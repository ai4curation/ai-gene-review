id: Q8X0H8
gene_symbol: alg-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  alg-2 encodes an endoplasmic-reticulum membrane GT4-family
  GDP-mannose-dependent mannosyltransferase. By orthology to characterized
  fungal and human ALG2 proteins, it is expected to act during the cytoplasmic
  phase of dolichol-linked oligosaccharide assembly for N-linked glycosylation,
  adding the alpha-1,3-linked second mannose to Man1GlcNAc2-PP-dolichol and the
  alpha-1,6-linked third mannose to Man2GlcNAc2-PP-dolichol.
existing_annotations:
- term:
    id: GO:0000033
    label: alpha-1,3-mannosyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000282458
  - SGD:S000003033
  - UniProtKB:Q9H553
  review:
    summary: >-
      The PTHR45918 PAINT node correctly places Neurospora alg-2 in the
      conserved ALG2 bifunctional mannosyltransferase clade, but this
      parent-level alpha-1,3-mannosyltransferase term should be refined to the
      dolichol-linked, Man1GlcNAc2-PP-Dol-specific reaction.
    action: MODIFY
    reason: >-
      GO:0000033 is true but generic. The same protein is also annotated to
      GO:0004378, which names the acceptor used in ALG2's alpha-1,3
      mannosyltransferase reaction.
    proposed_replacement_terms:
    - id: GO:0004378
      label: GDP-Man:Man(1)GlcNAc(2)-PP-Dol alpha-1,3-mannosyltransferase activity
    supported_by:
    - reference_id: file:interpro/panther/PTHR45918/PTHR45918-paint.tsv
      supporting_text: "PTHR45918\tPTN000282458\tGO:0000033\tF\tIBD\tfalse"
    - reference_id: file:genes/NEUCR/alg-2/alg-2-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: >-
        Mannosylates Man(2)GlcNAc(2)-dolichol diphosphate and
        Man(1)GlcNAc(2)-dolichol diphosphate to form
        Man(3)GlcNAc(2)-dolichol diphosphate.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000282458
        source_label: PANTHER:PTN000282458
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The PAINT node is correctly scoped to the ALG2 clade; only the GO
          term granularity is too broad for the Man1GlcNAc2-PP-Dol reaction.
- term:
    id: GO:0004378
    label: GDP-Man:Man(1)GlcNAc(2)-PP-Dol alpha-1,3-mannosyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR027054
