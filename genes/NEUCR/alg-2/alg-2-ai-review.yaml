  - EC:2.4.1.132
  review:
    summary: >-
      Combined automated transfer of the EC 2.4.1.132/RHEA:29515 ALG2
      reaction. This is the first of alg-2's two core mannosyltransferase
      activities and matches the UniProt catalytic annotation inferred from
      S. cerevisiae Alg2.
    action: ACCEPT
    supported_by:
    - reference_id: file:genes/NEUCR/alg-2/alg-2-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Xref=Rhea:RHEA:29515
    - reference_id: PMID:16878994
      supporting_text: >-
        this enzyme actually carries out an alpha1,3-mannosylation, followed by
        an alpha1,6-mannosylation, to form the first branched pentasaccharide
        intermediate of the pathway
