  review:
    summary: Acetyltransferase activity is the most specific function the evidence supports. V5ILC0 has
      a complete GNAT domain (PROSITE PS51186, residues 3-184; Pfam PF00583) and keeps the acetyl-CoA-binding
      motif A (RRMGVG, residues 107-112). Acetyl-CoA is the usual donor in GNATs. No acceptor-specific
      child term (protein N-terminal, lysine, polyamine, aminoglycoside) can be chosen, because the gene
      has no PANTHER subfamily and its orthologs are confined to Neurospora.
    action: ACCEPT
    reason: The GNAT domain and conserved motif A support acetyl transfer as a domain-level function.
      Because acceptor specificity in this superfamily cannot be predicted without a close characterised
      relative, the generic term is as precise as the evidence allows.
