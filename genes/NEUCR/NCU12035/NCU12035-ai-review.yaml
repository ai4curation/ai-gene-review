suggested_questions:
- question: What does NCU12035 acetylate? Its acceptor could be a protein N-terminus, a lysine, a polyamine
    or another small molecule.
- question: Is NCU12035 expressed, and under which conditions? Its orthologs are found only in Neurospora.
suggested_experiments:
- description: Purify recombinant NCU12035 and screen it against a panel of acceptors (peptides, polyamines,
    aminoglycosides, amino sugars) with a CoA-release assay. Confirm any hit by mass spectrometry of the
    product, and test an R107A/G110A motif A mutant as a negative control.
  experiment_type: in vitro enzyme assay
- description: Make a C-terminal GFP fusion at the native locus to find where the protein is in the cell.
  experiment_type: fluorescence microscopy
