  title: NCU12035 bioinformatics checks (GNAT motif A, domain span, orthology)
  findings:
  - statement: The GNAT domain covers residues 3-184 of 232 and keeps motif A (RRMGVG, 107-112). No PANTHER
      family is assigned, and the OrthoDB group contains only Neurospora genes.
    supporting_text: No characterised ortholog exists, and the absence of a PANTHER placement leaves no
      phylogenetic basis for transferring a substrate-specific function from another GNAT.
