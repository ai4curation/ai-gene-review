  title: Classification and phylogeny for the annotation of novel eukaryotic GNAT acetyltransferases.
  findings:
  - statement: Eukaryotic GNATs act on many acceptor classes, and a large fraction of sequence clusters
      have no characterised member, so substrate class cannot be read from GNAT-domain membership alone.
    supporting_text: We identified 48 clusters with known acetyltransferases and 184 completely uncharacterized
      clusters.
