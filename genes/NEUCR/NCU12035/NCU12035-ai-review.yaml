  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU12035 is a predicted GNAT-family acetyltransferase with an acyl-CoA-binding fold. It is
  expected to transfer an acetyl group to an unidentified acceptor. Its substrate class, physiological
  pathway, and cellular location remain unresolved; the shared GNAT fold encompasses enzymes that modify
  proteins and diverse small molecules.
