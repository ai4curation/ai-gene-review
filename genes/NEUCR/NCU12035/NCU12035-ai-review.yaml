id: V5ILC0
gene_symbol: NCU12035
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU12035 encodes a 232-residue protein made of a single GCN5-related N-acetyltransferase
  (GNAT) domain (residues 3-184) and a short serine/threonine/proline-rich C-terminal tail. The domain
  keeps the acetyl-CoA pyrophosphate-binding motif A (R107-x-x-G110-x-G112), so the protein is predicted
  to transfer an acetyl group from acetyl-CoA to an acceptor. The acceptor is unknown. GNAT enzymes modify
  protein N-termini, lysine side chains, polyamines, antibiotics and other metabolites, and the domain
  alone does not say which class this protein acts on. Orthologs are found only in Neurospora species
  and no PANTHER subfamily is assigned, so no characterised relative is close enough to supply a substrate,
  pathway or cellular location. No experimental study of NCU12035 has been reported.
