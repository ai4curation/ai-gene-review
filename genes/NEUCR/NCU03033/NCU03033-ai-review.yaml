suggested_questions:
- question: Which N. crassa promoters does the NCU03033-containing CBC occupy, and does it act with a
    Hap4-like activator, a HapX-like bZIP, or both in this species?
suggested_experiments:
- description: Endogenous epitope tagging of NCU03033 for nuclear localization, co-purification of the
    Hap3/Hap5 partners, and ChIP-seq with deletion RNA-seq under respiratory, iron-limited and oxidative
    conditions to define its direct regulon.
