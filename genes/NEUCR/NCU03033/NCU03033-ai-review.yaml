  review:
    summary: The CCAAT-binding factor acts on nuclear promoters; nuclear location follows from family
      membership.
    action: ACCEPT
    reason: >-
      Nucleus is the site of action of the CCAAT-binding factor and is supported by the curated UniRule
      (RuleBase RU367155) and the PROSITE NFYA/HAP2 rule. No N. crassa localization experiment exists,
      and the PAINT CC annotation is the complex term, so nucleus is kept as the appropriate location.
      Note that in A. nidulans an oxidised partner subunit (HapC) is excluded to the cytoplasm, showing
      that nuclear localization depends on complex assembly; this is not a Hap2-specific property.
    supported_by:
