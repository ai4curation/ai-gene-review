  review:
    summary: Core molecular function of the NF-YA/Hap2 clade, inherited from PAINT node PTN000290575.
    action: ACCEPT
    reason: >-
      PAINT placed this function at PTN000290575, an ancestral NF-YA/Hap2 node whose experimentally
      characterised descendants include S. cerevisiae HAP2 (SGD:S000003206), human NFYA (P23511) and
      mouse Nfya. NCU03033 is the only PTHR12632/IPR001289 protein in N. crassa and retains the full
      essential core (76-78% identity to yeast HAP2 and S. pombe php2 over the subunit-association and
      DNA-recognition segments; file:NEUCR/NCU03033/NCU03033-bioinformatics/RESULTS-rereview.md), so
      there is no evidence of divergence from the node. Yeast Hap2, A. nidulans HapB and human NF-YA are
      functionally interchangeable in complementation tests. The activity is exerted as a subunit of the
      trimer (all three subunits are needed for DNA binding), which GO captures by the companion
      CCAAT-binding factor complex annotation.
    supported_by:
    - reference_id: PMID:19965775
      supporting_text: Moreover, S. cerevisiae Hap2p, A. nidulans HapB and human NF-YA are functionally
        interchangeable, which was demonstrated by the complementation of an S. cerevisiae hap2 and an
        A. nidulans hapB deletion mutant by a human NF-YA cDNA (19,20).
    - reference_id: PMID:19965775
      supporting_text: Hap2/3/5 p form the core CCAAT-binding complex, which is responsible for DNA binding,
        while Hap4p is involved in transcriptional activation (11).
    - reference_id: file:NEUCR/NCU03033/NCU03033-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the NFYA/HAP2 subunit family.
    - reference_id: file:NEUCR/NCU03033/NCU03033-bioinformatics/RESULTS-rereview.md
      supporting_text: The full essential core of the NF-YA/Hap2 family is present and highly conserved.
