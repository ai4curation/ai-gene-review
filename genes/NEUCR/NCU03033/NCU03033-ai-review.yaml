      promoters, as part of the trimer. The specific descendant RNA polymerase II cis-regulatory region
      sequence-specific DNA binding (GO:0000978) is supported; it is implied by the DNA-binding
      transcription factor activity already accepted from the IBA row.
    supported_by:
    - reference_id: file:NEUCR/NCU03033/NCU03033-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Component of the sequence-specific heterotrimeric transcription factor (NF-Y) which
        specifically recognizes a 5'-CCAAT-3' box motif found in the promoters of its target genes.
    - reference_id: PMID:25589790
      supporting_text: 'Initial

        binding of the CBC to CCAAT boxes is mandatory for DNA recognition of HapX.'
    proposed_replacement_terms:
