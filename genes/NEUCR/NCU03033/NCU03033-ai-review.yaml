  review:
    summary: Core process of the CCAAT-binding factor, inherited from PTN000290575.
    action: ACCEPT
    reason: >-
      The PAINT node propagates regulation (not positive regulation) of RNA polymerase II transcription,
      which is the right level: the fungal CBC both activates (yeast respiratory genes with Hap4; A.
      nidulans amdS, ipnA, aatA) and represses (A. nidulans lysF, hapB, and iron-consuming genes with
      HapX) depending on partner regulators. Organism-specific regulons (respiration, cellulases, iron
      homeostasis) are not transferred to N. crassa, where the regulon is unmapped.
    supported_by:
    - reference_id: PMID:19965775
      supporting_text: 'On the other side, AnCF-mediated repression of gene expression was also found:
        the homoaconitase-encoding lysF and the hapB gene were repressed by AnCF (25,26).'
    - reference_id: PMID:19965775
      supporting_text: Moreover, S. cerevisiae Hap2p, A. nidulans HapB and human NF-YA are functionally
        interchangeable, which was demonstrated by the complementation of an S. cerevisiae hap2 and an
        A. nidulans hapB deletion mutant by a human NF-YA cDNA (19,20).
    - reference_id: file:NEUCR/NCU03033/NCU03033-deep-research-falcon.md
      supporting_text: However, the particular NCU03033 regulon in *N. crassa* has not been mapped.
- term:
    id: GO:0016602
    label: CCAAT-binding factor complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - FB:FBgn0035993
  - PANTHER:PTN000290576
  - RGD:70976
  - SGD:S000003206
  - UniProtKB:P23511
  - WB:WBGene00011614
  - WB:WBGene00043056
  review:
    summary: NF-YA/Hap2 is an obligate subunit of the CCAAT-binding factor trimer.
    action: ACCEPT
    reason: >-
      PAINT node PTN000290576 places complex membership at the base of the NF-YA clade, with yeast,
      human, rat, fly and worm donors. NCU03033 retains the subunit-association segment (UniProt MOTIF
      194-217) that mediates docking onto the Hap3/Hap5 dimer. In the closest characterised fungus
      (A. nidulans), the HapB/HapC/HapE trimer is required for DNA binding.
    supported_by:
    - reference_id: PMID:19965775
      supporting_text: 'The corresponding Aspergillus nidulans CCAAT-binding factor (AnCF)

        consists of the subunits HapB, HapC and HapE. All of the three subunits are

        necessary for DNA binding.'
    - reference_id: PMID:25589790
      supporting_text: 'The CBC consists of

        three subunits, which are named in the filamentous fungus Aspergillus nidulans

        HapB, HapC, and HapE.'
    - reference_id: file:NEUCR/NCU03033/NCU03033-bioinformatics/RESULTS-rereview.md
      supporting_text: The full essential core of the NF-YA/Hap2 family is present and highly conserved.
