gene_symbol: NCU03033
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  NCU03033 encodes the single Neurospora crassa member of the NF-YA/Hap2 family (314 aa), the
  sequence-recognition subunit of the heterotrimeric CCAAT-binding transcription factor (CBC; Hap2/3/5,
  HapB/C/E in Aspergillus, NF-Y in mammals). Its conserved essential core comprises an N-terminal
  subunit-association segment, which docks onto the Hap3/Hap5 histone-fold dimer, and a C-terminal
  CCAAT-recognition segment; the remainder of the protein is a Q/P-rich and charged disordered region.
  As part of the trimer it binds CCAAT boxes in nuclear promoters and regulates RNA polymerase
  II transcription, acting as an activator or repressor depending on promoter context and associated
  regulators (e.g. Hap4 or HapX). No N. crassa-specific experiment on this protein has been reported;
  the function is inferred from the PAINT-placed NF-YA/Hap2 clade, the near-identical core shared with
  yeast Hap2 and php2, and the functional interchangeability of yeast Hap2, Aspergillus HapB and human
  NF-YA.
