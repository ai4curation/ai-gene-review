  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU03033 is the Hap2/NF-YA subunit of the heterotrimeric CCAAT-binding transcription factor.
  Its conserved DNA-recognition domain works with the two partner subunits to bind CCAAT promoter elements
  and regulate nuclear RNA polymerase II transcription.
