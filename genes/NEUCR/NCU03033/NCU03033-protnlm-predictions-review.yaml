  label: Neurospora crassa OR74A
status: COMPLETE
description: >-
  NCU03033 is the single N. crassa NF-YA/Hap2 subunit of the heterotrimeric CCAAT-binding factor,
  placed by PAINT in the NF-YA/Hap2 clade whose characterised members (yeast Hap2, A. nidulans HapB,
  human NF-YA) are functionally interchangeable. Both ProtNLM2 GO predictions are correct and already
  carried by the gene in GOA: the generic DNA-binding transcription factor activity is less precise
  than the RNA polymerase II-specific activity inherited by IBA (LSP), and nucleus is an existing,
  accepted location (CNN).
