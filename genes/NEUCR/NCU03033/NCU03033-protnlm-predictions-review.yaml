    summary: >-
      NCU03033 carries the NF-YA/Hap2 signature (InterPro IPR001289) and the curated RuleBase family
      assignment, and the family's characterised fungal and human members are interchangeable
      CCAAT-box-binding transcription factor subunits that act on RNA polymerase II promoters. This
      is a justified family transfer, not an observation on the N. crassa protein itself. GOA already
      carries the exact predicted term (IEA), which the gene review modifies to the more specific
      GO:0000981 DNA-binding transcription factor activity, RNA polymerase II-specific (is_a
      descendant of GO:0003700), inherited by IBA from PAINT node PTN000290575 and accepted as the
      core function. The prediction is correct but less precise than that supported annotation.
