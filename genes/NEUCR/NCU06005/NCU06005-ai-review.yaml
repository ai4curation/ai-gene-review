taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU06005 encodes the glycerol kinase of Neurospora crassa, an FGGY-family carbohydrate kinase
  that phosphorylates glycerol with ATP to form sn-glycerol 3-phosphate. It belongs to the glycerol kinase
  subfamily (PANTHER PTHR10196:SF69) together with the experimentally characterized enzymes of budding
  yeast (GUT1), Arabidopsis (GLPK) and Escherichia coli (GlpK), and it is the only glycerol kinase gene
  in the N. crassa reference genome. Glycerol phosphorylation is the first step of the inducible glycerol
  dissimilation pathway, in which sn-glycerol 3-phosphate is then oxidized by mitochondrial glycerol-3-phosphate
  dehydrogenase to dihydroxyacetone phosphate. Classical genetics and enzymology identified a cytosolic,
  glycerol-, cold- and deoxyribose-inducible glycerokinase encoded by the glp-4 locus on linkage group
  VI, where NCU06005 also lies; no molecular complementation of glp-4 by NCU06005 has been published.
