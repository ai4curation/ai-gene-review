- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IC
  original_reference_id: PMID:6284716
  qualifier: located_in
  review:
    summary: Classical N. crassa enzymology placed the inducible glycerokinase in the cytosol, distinct
      from the mitochondrial glycerol-3-phosphate dehydrogenase. NCU06005 is the only glycerol kinase
      gene in the genome and lies on the same linkage group (VI) as glp-4, so the cytosolic activity is
      attributable to this locus. The sister SF69 enzyme yeast Gut1p is likewise cytosolic. PAINT placed
      a cytosol IRD at PTN000023394; that call is contested at family level (PTHR10196 review, LOSS_CONTRADICTED)
      because it negates the localization of its own seeds, and organism-level evidence for N. crassa
      supports cytosol.
    action: NEW
    reason: Organism-specific evidence for the cytosolic location of the activity. IC rather than IDA
      because the 1982 enzymology assayed the glycerokinase activity, and its attribution to NCU06005 rests
      on curator inference (sole glycerol kinase gene, same linkage group as glp-4), not on a molecular
      identification in the paper.
    supported_by:
    - reference_id: PMID:6284716
      supporting_text: 'Evidence from the enzymatic characterization of these

        mutants indicated that glp-2 and glp-4 were the structural genes encoding the

        mitochondrial glycerol-3-phosphate dehydrogenase and cytosolic glycerokinase,

        respectively.'
    - reference_id: file:NEUCR/NCU06005/NCU06005-bioinformatics/RESULTS-rereview.md
      supporting_text: NCU06005 is therefore the sole glycerol kinase gene in the reference proteome.
    - reference_id: PMID:17054397
      supporting_text: Interestingly, although Gut1p and Gpd2p are known cytosolic enzymes, they are
        predicted mitochondrial candidates in our network.
