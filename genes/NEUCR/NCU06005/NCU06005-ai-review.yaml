- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - MGI:MGI:106594
  - MGI:MGI:1329027
  - PANTHER:PTN000023394
  - SGD:S000001024
  - UniProtKB:P32189
  review:
    summary: The mitochondrion IBD at PTN000023394 is seeded by mammalian GK (porin-bound outer-membrane
      pool, SF56) and by yeast GUT1, the SF69 sister of NCU06005, whose in vitro mitochondrial import
      shows an additional pool of a mainly cytosolic enzyme. For N. crassa the only localization evidence
      is classical enzymology placing glycerokinase in the cytosol, distinct from mitochondrial glycerol-3-phosphate
      dehydrogenase; that assay reports the main pool and cannot exclude a minor mitochondrial one. Its
      N-terminal extension is net acidic and lacks presequence-like composition, which argues against
      a matrix-targeted form but not against outer-membrane association or a minor imported pool. With
      no target-specific evidence of loss, the inherited location is retained as a plausible minor, non-core
      location, consistent with the treatment of the same IBA on yeast GUT1 and with the family-level judgment
      that the eukaryotic glycerol kinase clade inherits both cytosol and mitochondrion.
    action: KEEP_AS_NON_CORE
    reason: Phylogenetically sound inheritance of a secondary location from an SF69 sister seed (Gut1p);
      the main Neurospora activity is cytosolic, so the mitochondrial pool is at most a minor, non-core
      location. Changed from MARK_AS_OVER_ANNOTATED because the cytosolic fractionation does not contradict
      a minor pool.
    supported_by:
    - reference_id: PMID:17054397
      supporting_text: we performed mitochondrial import experiments and confirmed import of both Gut1p
        and Gpd2p, implying a novel dual cytosolic and mitochondrial localization
    - reference_id: PMID:6284716
      supporting_text: 'Evidence from the enzymatic characterization of these

        mutants indicated that glp-2 and glp-4 were the structural genes encoding the

        mitochondrial glycerol-3-phosphate dehydrogenase and cytosolic glycerokinase,

        respectively.'
    - reference_id: file:NEUCR/NCU06005/NCU06005-bioinformatics/RESULTS-rereview.md
      supporting_text: This is a crude composition test, not a targeting predictor; it does not exclude
        a minor or internally targeted mitochondrial pool.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000023394
        source_status: SUPPORTS_TRANSFER
        comment: Seeds have real but additional mitochondrial pools (mammalian outer-membrane GK, yeast
          imported Gut1p, the latter in the same SF69 subfamily as NCU06005); transfer of a minor location
          is sound. The sibling cytosol IRD at this node is contested in interpro/panther/PTHR10196/PTHR10196-review.yaml
          (LOSS_CONTRADICTED).
