suggested_questions:
- question: Does an NCU06005 deletion strain (FGSC knockout collection) phenocopy glp-4 mutants (no growth
    on glycerol, no inducible glycerokinase activity), and does NCU06005 complement a glp-4 allele?
- question: Is there a minor mitochondrion-associated pool of Neurospora glycerol kinase, as reported for
    yeast Gut1p?
