  review:
    summary: The IBD is seeded only by mammalian GK (subfamily SF56), where glycerol phosphorylation
      feeds triglyceride synthesis and recycling in liver and adipose tissue. In N. crassa the enzyme is
      part of an inducible glycerol dissimilatory (catabolic) system. Supplying sn-glycerol 3-phosphate
      that could be acylated is substrate supply, not a step of triglyceride metabolism, and there is no
