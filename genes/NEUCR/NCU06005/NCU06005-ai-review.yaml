taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU06005 is a glycerol-kinase-family enzyme predicted to phosphorylate glycerol with ATP,
  producing sn-glycerol-3-phosphate. This reaction initiates glycerol assimilation and supplies an intermediate
  for carbon and glycerolipid metabolism. Classical Neurospora crassa enzymology identifies a cytosolic
  glycerokinase in the inducible glycerol-dissimilation pathway; the precise correspondence of that historical
  glp-4 activity to the modern NCU06005 locus and any additional mitochondrial pool remain unresolved.
