  findings: []
- id: PMID:8224542
  title: Structural characterization and expression analysis of the Neurospora conidiation gene con-6.
  findings:
  - statement: con-6 expression is conidiation-specific, peaking late in conidiation and in mature conidia,
      and absent from mycelium.
    supporting_text: The gene con-6 of Neurospora crassa is expressed during the formation of asexual
      spores (conidia), but it is not expressed in mycelium.
  - statement: Loss of con-6 has no demonstrable phenotype in conidium formation - expression during
      conidiation is not evidence of a required role in it.
    supporting_text: Inactivation of con-6 by the repeat-induced point mutation process had no demonstrable
      effect on formation or germination of conidia.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified (White & Yanofsky, Dev Biol 1993); the primary characterization of
      con-6. Abstract-only in the cache, but the loss-of-function result is stated in the abstract.
core_functions:
- description: Conidiation-specific protein expressed late in macroconidiation and retained in mature
    conidia; proposed to protect dormant spores from desiccation. Biochemical activity uncharacterized,
    and no process involvement is asserted here - con-6 is a temporal marker of the conidiation program
    rather than a demonstrated participant in it.
  supported_by:
  - reference_id: PMID:8224542
    supporting_text: The gene con-6 of Neurospora crassa is expressed during the formation of asexual
      spores (conidia), but it is not expressed in mycelium.
  - reference_id: file:NEUCR/con-6/con-6-uniprot.txt
    supporting_text: May protect dormant spores from desiccation
  knowledge_gaps:
  - gap_statement: 'No demonstrated role in conidium formation: con-6 inactivation had no effect on conidium
      formation or germination, so GO:0048315 involvement is not supportable from expression timing alone.
      Whether CON-6 contributes to spore desiccation tolerance (the LEA-like hypothesis) is untested.'
