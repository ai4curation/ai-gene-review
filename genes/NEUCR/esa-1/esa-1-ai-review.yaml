      rDNA heterochromatin formation is a budding-yeast Esa1/NuA4-specific
      process transfer.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      ESA-1 is clearly a chromatin HAT, but this automatic transfer from
      Saccharomyces ESA1 asserts a specialized rDNA-silencing process rather
