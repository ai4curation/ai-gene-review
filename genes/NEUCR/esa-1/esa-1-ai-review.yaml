id: Q7S9B6
gene_symbol: esa-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  esa-1 encodes the conserved fungal ESA1/MYST histone acetyltransferase, the
  catalytic subunit of NuA4-family chromatin acetyltransferase complexes.
  Neurospora ESA-1 acetylates histones H4 and H2A, associates with NuA4 subunits
  and the BRD-8/BYE-1 module, and supports chromatin-based regulation of RNA
  polymerase II transcription.
