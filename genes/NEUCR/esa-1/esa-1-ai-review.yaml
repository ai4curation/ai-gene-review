suggested_questions:
- question: >-
    Does Neurospora ESA-1 form an autonomous Piccolo NuA4-like catalytic
    subcomplex, or is all detected ESA-1 assembled into larger NuA4/BRD-8/BYE-1
    complexes?
- question: >-
    Are the crotonyltransferase and 2-hydroxyisobutyryltransferase activities
    inferred from S. cerevisiae ESA1 and S. pombe Mst1 measurable for
    Neurospora ESA-1 in vivo, and are histones the physiological substrates?
suggested_experiments:
- description: >-
    Purify epitope-tagged ESA-1, EPL-1, YNG-2, and shared NuA4 subunits under
    mild and stringent conditions and quantify co-elution by size-exclusion
    chromatography plus mass spectrometry to test for a stable Neurospora
    Piccolo NuA4 counterpart.
- description: >-
    Repeat the ESA-1V5 in vitro acyltransferase assay with crotonyl-CoA and
    2-hydroxyisobutyryl-CoA, and pair the assay with targeted H4/H2A acyl-lysine
    mass spectrometry in esa-1 depletion or catalytic-mutant strains.
