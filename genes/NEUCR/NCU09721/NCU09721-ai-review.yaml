    label: clathrin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR016342
  review:
    summary: Dikaryan beta-adaptins lack the canonical C-terminal clathrin-binding appendage, but Aspergillus
      AP1 beta uses alternative tail motifs. The target sequence contains LLDID at residues 629–633, matching
      one tested Aspergillus motif, and terminal LLGLF at 745–749; the stronger Aspergillus LLNGF motif
      is not identical. These observations support clathrin-association plausibility, but short motif
      similarity and complex traffic do not establish the exact intrinsic target-binding mechanism. Direct
      target binding remains unresolved.
    action: UNDECIDED
    supported_by:
    - reference_id: PMID:28220754
      supporting_text: clathrin binding domains are also missing from the AP-1 β subunit (β1) of all Dikarya
