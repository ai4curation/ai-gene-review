gene_symbol: NCU09721
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU09721 encodes the beta subunit (beta1-adaptin, an Apl2 ortholog) of the heterotetrameric
  AP-1 adaptor complex of Neurospora crassa. The 749-residue protein consists of an N-terminal adaptin
  trunk (Adaptin_N/ARM-like repeats), which assembles with the gamma, mu1 and sigma1 subunits, followed
  by a flexible Pro/Gly-rich tail. Like other Dikarya beta1 subunits, it lacks the C-terminal beta-appendage
  domain. Phylogenetically it belongs to the fungal AP-1 beta clade, with the AP-1 beta subunits of
  Aspergillus nidulans, Fusarium graminearum and Schizosaccharomyces pombe; its paralog NCU05232 is the
  AP-2 beta subunit. In related filamentous fungi, the AP-1 complex is recruited to the cytoplasmic face
  of the trans-Golgi network and endosomes. There it selects membrane cargo for post-Golgi carriers that
  deliver polarized cargo to the hyphal apex and that recycle endosomal cargo. The A. nidulans complex
  is essential, and its traffic is clathrin-dependent. NCU09721 itself has not been characterized
  experimentally. Its cargoes are unknown, as is whether it binds clathrin directly through short tail
  motifs (it retains an LLDID motif).
