  review:
    summary: The endocytosis IBA is inherited from the deep beta-adaptin node PTN000123671. Its experimental
      support comes from AP-2 beta, or from metazoan beta subunits shared between AP-1 and AP-2. NCU09721
      is the fungal AP-1-specific beta paralog, and in filamentous fungi endocytosis is carried out by
      AP-2, whose beta subunit is NCU05232.
    action: MARK_AS_OVER_ANNOTATED
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000123671
        source_label: PTN000123671
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Deep beta-adaptin node whose endocytosis evidence comes from AP-2 beta and from metazoan
          beta subunits shared by AP-1 and AP-2. The fungal AP-1-specific beta clade containing NCU09721
          does not carry the AP-2 plasma-membrane uptake role; in Dikarya that role belongs to the separate
          AP-2 beta paralog (NCU05232 in N. crassa).
    reason: The donors listed (human AP2B1 P63010, rat Ap2b1, Drosophila and C. elegans beta subunits
      shared by AP-1 and AP-2, and mouse AP-2 beta) support plasma-membrane uptake by AP-2. Dikarya
      have separate AP-1 beta and AP-2 beta genes. NCU09721 falls in the AP-1 beta clade with S. pombe
      apl2 (96% bootstrap), and NCU05232 falls with the AP-2 beta proteins. In A. nidulans, AP-2 has
      a specialized role in apical endocytosis. The previous KEEP_AS_NON_CORE rested on Fusarium sigma1
      deletion delaying FM4-64 internalization into the vacuole. That reflects disturbed endosomal
      recycling and delivery to the vacuole, an indirect effect, not participation in plasma-membrane
      uptake. The term is not refuted outright, because AP-1 acts on the downstream endosomal itinerary,
      so it is marked as an over-annotation rather than removed.
    supported_by:
    - reference_id: PMID:28220754
      supporting_text: The experimental support of a clathrin-independent role of AP-2 in endocytosis
        was in good agreement with the in silico observation that the β2 subunit of AP-2 of all higher
        fungi lacks the entire C-terminal β appendage
    - reference_id: file:NEUCR/NCU09721/NCU09721-bioinformatics/RESULTS-rereview.md
      supporting_text: NCU05232 instead clusters with A. nidulans AN5950, F. graminearum V6RQ48, S. pombe
        apl1 and S. cerevisiae APL1 (the AP-2 beta clade).
