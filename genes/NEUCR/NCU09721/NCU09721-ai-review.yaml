- term:
    id: GO:0030276
    label: clathrin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR016342
  review:
    summary: Unresolved. Dikarya beta1 subunits lack the canonical clathrin-binding appendage. In A. nidulans,
      AP-1 beta associates with clathrin through short C-terminal motifs (LLDID, LLNGF). NCU09721 retains
      LLDID (629-633) but lacks LLNGF.
    action: UNDECIDED
    reason: The IPR016342 mapping assumes a metazoan-type beta subunit with a clathrin box and appendage.
      Dikarya beta1 subunits lack these. Aspergillus AP-1 traffic is clathrin-dependent, and its full text
      (not in the local cache) reports motif-dependent clathrin association. NCU09721 retains only one of
      the two motifs (LLDID), and only short-motif similarity is available, with no binding assay for
      the N. crassa protein. Whether this subunit binds clathrin directly therefore remains open.
    supported_by:
    - reference_id: PMID:28220754
      supporting_text: clathrin binding domains are also missing from the AP-1 β subunit (β1) of all Dikarya
    - reference_id: file:NEUCR/NCU09721/NCU09721-bioinformatics/RESULTS-rereview.md
      supporting_text: NCU09721 retains LLDID (629-633) and has a terminal LLGLF (745-749), but has no LLNGF.
