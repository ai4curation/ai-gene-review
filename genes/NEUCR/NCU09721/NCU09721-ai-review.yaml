suggested_questions:
- question: Does PTN000123672 (the AP-1 adaptor complex IBD) sit above the fungal AP-1 beta / AP-2 beta
    split? Both NCU09721 (AP-1 beta) and its paralog NCU05232 (AP-2 beta clade) receive the AP-1 complex
    IBA.
- question: Does the retained LLDID tail motif of NCU09721 bind the clathrin heavy-chain terminal domain,
    or does N. crassa AP-1 recruit clathrin only through other subunits or accessory proteins?
suggested_experiments:
- description: Tag NCU09721 at its native locus with GFP and image it with N. crassa TGN (Kex2/Sec7)
    and endosome (Rab5) markers. Test whether an LLDID-to-AAAAA mutant changes clathrin light-chain
    recruitment or apical delivery of secretory-vesicle cargo.
