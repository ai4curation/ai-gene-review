taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU09721 is a large beta-adaptin assigned to the AP-1 cargo-adaptor complex by curated phylogenetic
  inference. It provides a noncatalytic scaffold for membrane-cargo sorting within the Golgi/endosomal
  trafficking system. Characterized filamentous-fungal AP-1 complexes support post-Golgi secretion, endosome
  recycling, and clathrin-associated carrier traffic. These conserved roles support Golgi and carrier-membrane
  recruitment in Neurospora crassa, while its individual cargoes and direct clathrin-binding mechanism
  remain uncharacterized.
