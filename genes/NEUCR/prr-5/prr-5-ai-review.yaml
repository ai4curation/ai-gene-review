    - reference_id: PMID:17951518
      supporting_text: PalI-GFP robustly localized to the plasma membrane at the cell periphery and septae
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001997363
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The fungal PAINT node is seeded outside SF3 by PomBase Mug33, and
          direct septal localization of A. nidulans PalI supports transfer into
          the filamentous SF3 branch.
- term:
    id: GO:0035838
    label: growing cell tip
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN001997363
  - PomBase:SPAC13G7.04c
  - PomBase:SPCC1739.10
  review:
    summary: >-
      ACCEPT: the IBA growing-tip row is consistent with direct polarized
      hyphal-tip localization of Aspergillus PalI.
    action: ACCEPT
    reason: >-
      Growing-cell-tip localization is placed at PTN001997363 for the fungal
      family. Although the S. pombe Mac1 seed has a caveat that Mac1 is not
      specific to growing sites, A. nidulans PalI-GFP provides direct
      filamentous-fungal SF3 support for polarized hyphal-tip localization. The
      budding-yeast DCV1/RIM9 cases have target experiments that do not show
      growing-tip enrichment; Neurospora has no comparable target-specific
      counterevidence.
    additional_reference_ids:
    - PMID:17951518
    - file:interpro/panther/PTHR28013/PTHR28013-paint.tsv
    supported_by:
    - reference_id: file:interpro/panther/PTHR28013/PTHR28013-paint.tsv
      supporting_text: "PTHR28013\tPTN001997363\tGO:0035838\tC\tIBD\tfalse\tPomBase:SPAC13G7.04c|PomBase:SPCC1739.10\ttaxon:451864\t20170228"
    - reference_id: PMID:17951518
      supporting_text: >-
        In this case, the marked apical spot was not visible, although the
        fusion protein was clearly polarized, as indicated by the brighter
        fluorescence seen at the hyphal tips
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN001997363
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The PAINT row is seeded partly by a PomBase Mac1 cell-tip annotation,
          but its support for Neurospora rests on direct A. nidulans PalI
          hyphal-tip localization in the filamentous SF3 branch.
