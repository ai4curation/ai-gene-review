suggested_questions:
- question: >-
    Does Neurospora prr-5 localize to hyphal tips, septa, and the plasma
    membrane as predicted by PAINT, and does its loss impair pacc-1 processing
    after alkaline pH shift?
suggested_experiments:
- description: >-
    Endogenously tag prr-5 and image it with plasma-membrane, septal, and
    Spitzenkörper or hyphal-tip markers during normal growth and after alkaline
    pH shift to test the three inherited PTHR28013 localizations directly in
    Neurospora.
  experiment_type: live-cell fluorescence microscopy
- description: >-
    Delete or deplete prr-5 and assay PacC/pacc-1 processing, alkaline-pH
    growth, and expression of PacC-responsive genes after alkaline shift.
  experiment_type: pH-response mutant assay
knowledge_gaps:
- gap_statement: >-
    The direct molecular activity and ambient-pH signaling role of Neurospora
    prr-5 have not been experimentally established.
  boundary: >-
    PAINT and InterPro place prr-5 in the fungal PalI/Rim9 membrane-protein
    family, and characterized Aspergillus, budding-yeast, and Candida family
    members act in Pal/PacC or Rim101 ambient-pH signaling, but the cached
    evidence for this Neurospora protein is currently computational.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
