  label: Neurospora crassa OR74A
description: >-
  prr-5 is a Neurospora crassa PalI/Rim9-family multipass membrane protein
  inferred to act in the fungal PacC/Rim101 ambient-pH response pathway. PAINT
  places it in the conserved fungal plasma-membrane PalI/Rim9 branch that also
  localizes to polarized cell-division and growing-tip sites in experimentally
  studied fungi.
