  review:
    summary: >-
      ACCEPT: polarized septal localization is plausible for Neurospora prr-5
      under the curated PalI/Rim9 PAINT node.
    action: ACCEPT
    reason: >-
      The PANTHER cell-division-site IBD is on the same PalI/Rim9-family node
      as the plasma-membrane row. Its PomBase seed is Mug33 rather than the
      SF3 Mac1 seed, but transfer to the filamentous-fungal SF3 branch is
      corroborated by direct A. nidulans PalI-GFP signal at septae. No
      Neurospora-specific loss or relocalization evidence argues against this
      inference.
    additional_reference_ids:
    - PMID:17951518
    - file:interpro/panther/PTHR28013/PTHR28013-paint.tsv
    supported_by:
