      ACCEPT: polarized septal localization is plausible for Neurospora prr-5
      under the curated PalI/Rim9 PAINT node.
    action: ACCEPT
    reason: >-
      The PANTHER cell-division-site placement is on the same PalI/Rim9-family
      node as the plasma-membrane row. A. nidulans PalI-GFP is directly seen at
      septae, and S. pombe Mac1 is directly reported at the septum, so the IBA
