  review:
    summary: >-
      ACCEPT: PTN001997363 is a sound fungal PalI/Rim9 plasma-membrane
      localization node for Neurospora prr-5.
    action: ACCEPT
    reason: >-
      prr-5 is in PTHR28013:SF3 with directly studied fungal PalI/Rim9 proteins,
      including A. nidulans PalI, S. cerevisiae Rim9, C. albicans RIM9, and
      S. pombe mac1. The PAINT plasma-membrane IBD is seeded by multiple fungal
      descendants and is supported by direct A. nidulans PalI-GFP and
      S. cerevisiae Rim9-GFP plasma-membrane evidence; no Neurospora-specific
      loss evidence argues against the transfer.
