description: >-
  prr-5 is a Neurospora crassa PalI/Rim9-family multipass membrane protein
  in a conserved fungal branch whose characterized members act at the plasma
  membrane in Pal/PacC or Rim101 ambient-pH signaling and can localize to
  polarized septal and hyphal-tip sites.
