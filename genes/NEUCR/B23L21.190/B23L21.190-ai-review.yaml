gene_symbol: B23L21.190
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  B23L21.190, also annotated as NCU03910, encodes the Neurospora crassa
  microsomal cytochrome b5 ortholog. It carries a conserved N-terminal
  cytochrome-b5 heme-binding domain and a C-terminal transmembrane helix,
  consistent with an
  endoplasmic-reticulum or microsomal membrane electron carrier that is
  orthologous to the yeast and Candida CYB5 proteins implicated in sterol
  biosynthesis.
