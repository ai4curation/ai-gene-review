knowledge_gaps:
- gap_statement: >-
    The N. crassa electron-acceptor enzymes and sterol-pathway consequences of
    B23L21.190 loss have not been directly tested.
  boundary: >-
    PAINT places B23L21.190 in the fungal SF150 CYB5 branch and UniProt records
    the expected heme-binding domain, membrane-bound electron-carrier function,
    and C-terminal transmembrane helix, but the literature search did not find a
    direct N. crassa genetic or biochemical study of this protein.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
suggested_questions:
- question: >-
    Does N. crassa B23L21.190 supply electrons to the canonical ergosterol
    oxygenases, and does the shorter SF14 B11H24.095 paralog serve a distinct
    membrane or acceptor-enzyme pool?
suggested_experiments:
- description: >-
    Delete or repress B23L21.190 singly and together with B11H24.095, then
    profile sterol intermediates and azole sensitivity to test whether the
    SF150 protein is the main Neurospora sterol-pathway cytochrome b5.
