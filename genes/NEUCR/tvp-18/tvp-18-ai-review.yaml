id: Q7S693
gene_symbol: tvp-18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  tvp-18 encodes a conserved TVP18/calcium-channel Flower family four-pass
  membrane protein inferred to act at the Golgi membrane in vesicle-mediated
  transport. Its molecular activity has not been directly established in
  Neurospora crassa.
existing_annotations:
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN001779222
  - SGD:S000004675
  review:
    summary: >-
      ACCEPT: PAINT places Golgi membrane on ancestral node PTN001779222 within
      the TVP18/Ca-channel Flower family and propagates it to the Neurospora
      tvp-18 protein.
    action: ACCEPT
    reason: >-
      PTN001779222 is a PAINT ancestral-node assertion in PTHR13314 seeded by
      the experimentally curated Saccharomyces cerevisiae TVP18 annotation, not
      a pairwise transfer. tvp-18 remains in the TVP18/Ca-channel Flower family
      and UniProt also curates the Neurospora protein as a Golgi apparatus
      membrane, multi-pass membrane protein by homology, with no
      evidence for loss or retargeting in this fungal branch.
    supported_by:
    - reference_id: file:interpro/panther/PTHR13314/PTHR13314-paint.tsv
      supporting_text: "PTHR13314\tPTN001779222\tGO:0000139\tC\tIBD\tfalse\tSGD:S000004675\ttaxon:4890\t20240205"
    - reference_id: file:genes/NEUCR/tvp-18/tvp-18-uniprot.txt
      supporting_text: >-
        SUBCELLULAR LOCATION: Golgi apparatus membrane {ECO:0000250};
        Multi-pass membrane protein {ECO:0000250}.
- term:
    id: GO:0000139
    label: Golgi membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0134
  review:
    summary: >-
      ACCEPT: the UniProtKB-SubCell mapping to Golgi membrane agrees with the
      PAINT Golgi membrane assertion for Neurospora tvp-18.
    action: ACCEPT
    reason: >-
      UniProt curates Q7S693 as a Golgi apparatus membrane, multi-pass membrane
      protein by homology, and mapping that curated subcellular-location
      vocabulary entry to GO:0000139 is consistent with the accepted fungal
      PAINT node for the same Golgi membrane localization.
    supported_by:
    - reference_id: file:genes/NEUCR/tvp-18/tvp-18-uniprot.txt
      supporting_text: >-
        SUBCELLULAR LOCATION: Golgi apparatus membrane {ECO:0000250};
        Multi-pass membrane protein {ECO:0000250}.
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR019365
  review:
    summary: >-
      TOO_GENERAL: tvp-18 is a membrane protein, but accepted annotations
      already place it at the more informative Golgi membrane.
    action: TOO_GENERAL
    reason: >-
      The InterPro TVP18/Ca-channel Flower signature supports membrane
      membership for this small multi-pass protein, so GO:0016020 is not
      biologically wrong. It is uninformative in this review because the more
      specific descendant GO:0000139 Golgi membrane is already accepted for the
      same protein.
    supported_by:
    - reference_id: file:genes/NEUCR/tvp-18/tvp-18-uniprot.txt
      supporting_text: InterPro; IPR019365; TVP18/Ca-channel_flower.
- term:
    id: GO:0016192
    label: vesicle-mediated transport
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - FB:FBgn0261722
  - MGI:MGI:1924317
  - PANTHER:PTN001779219
  - SGD:S000004675
  review:
    summary: >-
      ACCEPT: PAINT assigns the broad vesicle-mediated transport process to
      ancestral node PTN001779219 for PTHR13314, covering fungal TVP18 proteins
      and metazoan Flower proteins.
    action: ACCEPT
    reason: >-
      The IBA is grounded in the PAINT curator's PTN001779219 placement at the
      opisthokont ancestor, with Saccharomyces TVP18 and Drosophila fwe as
      descendant evidence. The broad vesicle-mediated transport term is an
      appropriate conserved-process assertion for Neurospora tvp-18: it matches
      UniProt's homology-based summary for the fungal protein, while the
      available evidence does not justify adding a more specific Neurospora
      trafficking route or a molecular activity.
    supported_by:
    - reference_id: file:interpro/panther/PTHR13314/PTHR13314-paint.tsv
      supporting_text: "PTHR13314\tPTN001779219\tGO:0016192\tP\tIBD\tfalse\tFB:FBgn0261722|SGD:S000004675\ttaxon:33154\t20260828"
    - reference_id: file:genes/NEUCR/tvp-18/tvp-18-uniprot.txt
      supporting_text: >-
        FUNCTION: Golgi membrane protein involved in vesicular trafficking.
        {ECO:0000250}.
