  review:
    summary: MAK-1 is the terminal MAP kinase of the Neurospora cell-wall-integrity MAPK cascade.
    action: ACCEPT
    reason: >-
      Direct Neurospora work characterized mik-1, mek-1, and mak-1 as the CWI-like MAPKKK, MAPKK, and
      MAPK module and showed that MIK-1 and MEK-1 are required for MAK-1 phosphorylation. WSC-1 and HAM-7
      are upstream sensors that activate this pathway, supporting the orthology-based transfer of the
      cell integrity MAPK cascade process.
    additional_reference_ids:
    - PMID:22879952
    supported_by:
    - reference_id: PMID:18849472
      supporting_text: The MAK-1 MAPK was not phosphorylated in Deltamik-1 and Deltamek-1 mutants, consistent with the involvement of MIK-1, MEK-1, and MAK-1 in the same signaling cascade.
    - reference_id: PMID:22879952
      supporting_text: N. crassa WSC-1 (and its homolog WSC-2) is required for the activation of the CWI MAK-1 MAP kinase pathway.
