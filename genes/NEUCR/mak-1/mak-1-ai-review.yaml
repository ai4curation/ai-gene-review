id: Q7RVR1
gene_symbol: mak-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  MAK-1 is the terminal Slt2/Pmk1-family mitogen-activated protein kinase of the
  Neurospora crassa MIK-1-MEK-1-MAK-1 cell-wall-integrity pathway. It acts
  downstream of WSC-1 and HAM-7 cell-wall and fusion sensors, is phosphorylated
  by the upstream MEK-1 kinase, and supports vegetative hyphal growth,
  cell-wall-integrity signaling, hyphal anastomosis, conidiation, and female
  protoperithecial development through crosstalk with the MAK-2
  pheromone-response MAPK pathway.
core_functions:
- description: >-
    Terminal fungal Slt2/Pmk1-family MAP kinase that relays WSC-1/HAM-7 inputs
    through the MIK-1/MEK-1/MAK-1 module to regulate cell-wall-integrity,
    hyphal-fusion, and female-development outputs.
  molecular_function:
    id: GO:0004707
    label: MAP kinase activity
  directly_involved_in:
  - id: GO:0000196
    label: cell integrity MAPK cascade
  - id: GO:0032995
    label: regulation of fungal-type cell wall biogenesis
  supported_by:
  - reference_id: PMID:18849472
    supporting_text: The MAK-1 MAPK was not phosphorylated in Deltamik-1 and Deltamek-1 mutants, consistent with the involvement of MIK-1, MEK-1, and MAK-1 in the same signaling cascade.
  - reference_id: PMID:22879952
    supporting_text: The data identify WSC-1 and HAM-7 as the major cell wall sensors that regulate two distinct MAK-1-dependent cellular activities, cell wall integrity and hyphal anastomosis, respectively.
