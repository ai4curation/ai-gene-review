suggested_questions:
- question: >-
    Which direct MAK-1 substrates distinguish the WSC-1-dependent cell-wall
    integrity output from the HAM-7-dependent hyphal-anastomosis and female
    developmental outputs?
suggested_experiments:
- description: >-
    Combine an analog-sensitive or kinase-dead mak-1 allele with acute cell-wall
    stress, germling fusion, and protoperithecial induction phosphoproteomics to
    map direct MAK-1 substrates and separate them from downstream MAK-2 and
    transcription-factor crosstalk.
