    summary: NCU04937 is an uncharacterised 114-residue orphan ORF in which a single run of 50 glutamines
      (residues 55-104) makes up about half the sequence, under a predicted coiled coil. It has no conserved
      domain; its only family signature, a weak PANTHER PTHR13270:SF14 match, lies over the polyglutamine
      run and reflects low-complexity sequence rather than a shared domain. The prediction cites human
      THAP11 (Q96EK4; phmmer score 29.1), whose DNA binding resides in its THAP zinc-finger domain, which
      NCU04937 lacks; shared glutamine-rich content does not transfer that function. The gene has no GOA
      annotations, no ortholog was detected in other Neurospora species, and a PubMed search for NCU04937
      returned no publications. Nothing supports or refutes DNA binding, so the prediction is uncertain.
