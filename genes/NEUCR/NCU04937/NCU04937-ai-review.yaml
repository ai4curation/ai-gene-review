suggested_questions:
- question: >-
    Is NCU04937 a real protein-coding gene? The ORF has no detectable homolog even
    in other Neurospora species, has no conserved domain, and its 3' gene model has
    changed between releases. Could the locus be a lineage-specific or spurious ORF
    built around a CAG/CAA microsatellite?
suggested_experiments:
- experiment_type: transcript and protein evidence for the gene model
  hypothesis: >-
    NCU04937 is transcribed and translated as the annotated 114-residue product.
  description: >-
    Map the NCU04937 transcript ends by RNA-seq read inspection and RACE, and check
    ribosome-profiling and proteomics data for evidence of translation. If the gene
    is expressed, tag it at its native locus and examine where the protein localises
    and what happens when it is deleted.
