  label: Neurospora crassa OR74A
description: >-
  NCU04937 is a predicted 114-residue protein of Neurospora crassa that has not been
  characterised experimentally. About half of the sequence is a single run of 50
  glutamines (residues 55-104). The rest is a short N-terminal segment, part of it
  predicted to be disordered, and a 10-residue C-terminal tail. A coiled-coil segment
  is predicted over the glutamine-rich region. The protein has no conserved domain. Its
  only family assignment is a weak PANTHER match that falls within the polyglutamine
  run. Sequence searches find no homolog in other Neurospora species or in other fungi.
  The 3' end of the gene model has been revised: an earlier version encoded 124 residues
  with a different C-terminal tail. The molecular function, cellular location and
  biological role of the protein are unknown.
