  label: Neurospora crassa OR74A
description: KAL-1 (NCU03593) is a 615-residue homeodomain transcription factor of Neurospora crassa.
  It carries a single typical homeodomain (residues 77-136, with the WFQNRR recognition-helix motif) preceded
  by a disordered N-terminal region, and a C-terminal PH-like domain (Pfam PF24818, PH_TRF2_HOY1) found
  in a lineage of fungal homeobox proteins. The homeodomain implies sequence-specific binding to RNA polymerase
  II cis-regulatory DNA and action in the nucleus; no binding site, target gene or activator/repressor
  activity has been determined for KAL-1 itself. Its one-to-one ortholog in the rice blast fungus, TRF2
  (MGG_04853), acts as a negative regulator of a polyketide (pyriculol) biosynthetic gene cluster, and
  the more distant Yarrowia relative HOY1, which has the same two-domain architecture, is required for
  the yeast-to-hypha transition. Deletion of kal-1 gives an altered colony morphology and an abnormal
  conidiation pattern, indicating a role in asexual development.
