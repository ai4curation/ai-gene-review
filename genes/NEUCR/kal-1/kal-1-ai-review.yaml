- term:
    id: GO:0030154
    label: cell differentiation
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - MGI:MGI:96086
  - PANTHER:PTN001963821
  - RGD:619932
  - UniProtKB:O13023
  - WB:WBGene00004011
  - ZFIN:ZDB-GENE-980526-299
  review:
    summary: PAINT inference from the same node, but every donor is an animal protein (mouse, rat, Xenopus
      and zebrafish Hhex and C. elegans PHA-2); none of the fungal members contributed to this term.
    action: KEEP_AS_NON_CORE
    reason: The term is very broad and the donor evidence is from animal developmental biology, which does
      not transfer in detail to a filamentous fungus. It is nevertheless not contradicted for KAL-1. Fungal
      members of the same lineage regulate developmental transitions (Yarrowia HOY1 is required for hypha
      formation), and the kal-1 deletion mutant has an abnormal conidiation pattern and colony morphology,
      so a regulatory role in fungal cell differentiation is plausible. The IBA is kept as a peripheral
      developmental output of the transcription factor, not a core function. A more specific fungal term
      such as conidiation is not proposed. The mutant phenotype shows the gene is needed for normal conidiation,
      but it does not show which step KAL-1 regulates or which genes it targets.
    supported_by:
    - reference_id: PMID:28696922
      supporting_text: the kal-1/NCU03593 homeodomain mutant had an abnormal conidiation pattern
    - reference_id: PMID:9343389
      supporting_text: deletion prevents the yeast-hypha transition both in liquid and solid media
