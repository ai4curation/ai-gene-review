  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: KAL-1 is a homeodomain-containing transcriptional regulator in Neurospora crassa. Its conserved
  homeodomain supports sequence-specific DNA binding and nuclear transcriptional regulation. Deletion
  of kal-1 alters colony morphology, connecting its regulatory role to fungal growth and differentiation.
