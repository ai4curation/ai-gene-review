core_functions:
- description: Sequence-specific DNA-binding transcription factor that binds RNA polymerase II cis-regulatory
    DNA through its homeodomain and regulates transcription in the nucleus. Its target genes and direction
    of regulation are unknown in Neurospora; its rice blast ortholog TRF2 represses a secondary-metabolite
    gene cluster.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  supported_by:
  - reference_id: file:NEUCR/kal-1/kal-1-uniprot.txt
    record_section: ["DR:Pfam"]
    supporting_text: DR   Pfam; PF00046; Homeodomain; 1.
  - reference_id: file:NEUCR/kal-1/kal-1-bioinformatics/RESULTS-rereview.md
    supporting_text: Pyricularia oryzae TRF2 (MGG_04853) is the KAL-1 ortholog
  locations:
