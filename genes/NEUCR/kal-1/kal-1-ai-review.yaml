    label: regulation of transcription by RNA polymerase II
suggested_questions:
- question: What DNA motif does the KAL-1 homeodomain recognise, and what are its direct target genes during
    conidiation? Is it, like its Pyricularia ortholog TRF2, a repressor of a secondary-metabolite gene
    cluster?
- question: What does the C-terminal PF24818 (PH_TRF2_HOY1) PH-like domain do? It is shared with TRF2 and
    HOY1 but absent from the yeast and animal family members.
suggested_experiments:
- description: ChIP-seq or DAP-seq of tagged KAL-1, combined with RNA-seq of the Δkal-1 strain during
    conidiation, to define its binding motif, direct targets and direction of regulation.
  experiment_type: ChIP-seq / RNA-seq
