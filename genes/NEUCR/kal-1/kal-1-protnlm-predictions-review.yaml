    summary: KAL-1 carries a canonical homeodomain (PROSITE PS50071, Pfam PF00046; DNA_BIND 77-136 with
      the WFQNRR recognition-helix motif) and sits in PANTHER subfamily PTHR24324:SF5, whose PAINT node
      PTN001963821 transfers RNA polymerase II cis-regulatory region sequence-specific DNA binding (GO:0000978)
      from experimentally characterised Phx1, Yox1, Pho2 and HHEX. Generic DNA binding is therefore correct,
      but it is already in GOA and is an ancestor of the curated GO:0000978 annotation that the gene review
      accepts, so it is less precise than the existing supported term. No KAL-1 DNA-binding experiment
      exists; PubMed has no functional study of KAL-1 or NCU03593.
