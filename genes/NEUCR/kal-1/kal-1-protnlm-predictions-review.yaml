description: ProtNLM2 emitted one GO prediction for KAL-1, generic DNA binding. The homeodomain and
  the PTHR24324:SF5 phylogenetic transfer support it, but it is less precise than the curated RNA polymerase
  II cis-regulatory region sequence-specific DNA binding annotation the gene already carries.
