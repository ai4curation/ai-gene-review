core_functions:
- description: Binds 5S rRNA, together with its partner Rrs1, through the conserved Brix-domain KKR
    loop, and recruits the 5S ribonucleoprotein particle into nucleolar pre-60S particles. It holds the
    immature central protuberance in place until it is released, and so acts as a non-catalytic scaffold
    in assembly of the large ribosomal subunit.
  supported_by:
  - reference_id: PMID:26117542
    supporting_text: These data show that Rpf2 directly binds the 5S rRNA.
  - reference_id: PMID:26117542
    supporting_text: Our data provide a structural model for 5S RNP recruitment to the pre-60S particle
      and explain why removal of Rpf2-Rrs1 is necessary for rearrangements to drive 60S maturation.
  - reference_id: PMID:25855814
