  - reference_id: file:NEUCR/NCU08595/NCU08595-uniprot.txt
    supporting_text: DR   PANTHER; PTHR12728:SF0; RIBOSOME PRODUCTION FACTOR 2 HOMOLOG; 1.
  - reference_id: file:NEUCR/NCU08595/NCU08595-bioinformatics/RESULTS-rereview.md
