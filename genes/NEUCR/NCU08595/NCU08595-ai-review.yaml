  review:
    summary: Core process. Rpf2-Rrs1 recruits the 5S RNP into nucleolar pre-60S particles and holds the
      immature central protuberance in place, so the protein does part of the work of large-subunit
      assembly itself.
    action: ACCEPT
    reason: This IEA comes from the Rpf2-specific InterPro entry IPR039770, not from the generic Brix
      signature. UniProt places NCU08595 in PANTHER PTHR12728:SF0 (RIBOSOME PRODUCTION FACTOR 2 HOMOLOG),
      the same subfamily as the characterized Thermochaetoides (Chaetomium) thermophilum and S. cerevisiae
      Rpf2 proteins. The C. thermophilum protein is 74% identical to NCU08595 and also belongs to the
      Sordariales. Structural and biochemical work on fungal Rpf2-Rrs1 shows the complex binding 5S rRNA,
      RpL5 and Rsa4 and positioning the 5S RNP within the pre-60S particle. That is direct physical
      participation in assembly, not just a requirement for it. This is the most accurate process term
      for the gene.
    supported_by:
