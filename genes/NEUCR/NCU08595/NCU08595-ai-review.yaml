suggested_questions:
- question: Does the N. crassa Rpf2-Rrs1 heterodimer bind 5S rRNA through K94-K96 and R242, as the fungal
    ortholog data predict?
- question: Should the 5S RNP-recruiting role of Rpf2-Rrs1 be recorded in GO-CAM as input to the 5S RNP
    incorporation step, rather than only as rRNA-processing process terms?
suggested_experiments:
- description: Make a conditional or heterokaryon-maintained NCU08595 depletion strain and run Northern
    blots of pre-rRNA intermediates and polysome profiles to test for 27SB accumulation and loss of 60S
    subunits.
  experiment_type: genetic depletion with pre-rRNA analysis
- description: Run EMSA of recombinant N. crassa Rpf2-Rrs1 (wild type and K94A/K95A/R96A and R242A
    variants) with N. crassa 5S rRNA.
  experiment_type: in vitro RNA binding
