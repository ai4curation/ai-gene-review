- term:
    id: GO:0019843
    label: rRNA binding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT3G23620
  - PANTHER:PTN000296192
  - SGD:S000001789
  - UniProtKB:Q57U27
  - UniProtKB:Q9H7B2
  review:
    summary: Correct but general. Rpf2 binds 5S rRNA specifically, and this was shown directly for the
      74%-identical C. thermophilum ortholog, which is in the same order as Neurospora.
    action: MODIFY
    reason: The PAINT rRNA-binding node is sound. The specific RNA ligand is 5S rRNA, which is the molecular
      basis of the Rpf2 role in assembly. Sinning and colleagues showed by EMSA that C. thermophilum Rpf2
      alone binds 5S rRNA. In the A. nidulans structure, the conserved KKR loop inserts into the major
      groove of 5S rRNA loop E. Yao and colleagues showed that the Rpf2-Rrs1 complex binds 5S rRNA and
      that yeast Rpf2 R236 contributes to this binding. NCU08595 keeps the KKR loop (K94-K96) and the
      arginine aligned to yeast R236 (R242). The structural docking also places Rpf2 against 25S pre-rRNA,
      but that contact has not been tested biochemically, so 5S rRNA binding is the descendant that is
      supported.
    supported_by:
    - reference_id: PMID:26117542
      supporting_text: These data show that Rpf2 directly binds the 5S rRNA.
    - reference_id: PMID:26117542
      supporting_text: The β3–β4 loop of Rpf2-N including the conserved 95-KKR motif snugly binds into
        loop E.
    - reference_id: PMID:25855814
      supporting_text: Saccharomyces cerevisiae Rpf2 R236 (corresponds to R238 of AnRpf2) plays a significant
        role in this binding.
    - reference_id: file:NEUCR/NCU08595/NCU08595-bioinformatics/RESULTS-rereview.md
      supporting_text: The 5S rRNA-binding residues are therefore retained.
    proposed_replacement_terms:
    - id: GO:0008097
      label: 5S rRNA binding
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      source_entities:
      - source_id: PANTHER:PTN000296192
        source_label: PTN000296192
        source_status: SUPPORTS_TRANSFER
        comment: RNA binding is conserved across the Rpf2 node, and NCU08595 (PTHR12728:SF0) is inside
