taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU08595 is a Rpf2-family ribosome assembly factor with a Brix RNA-binding domain. By conservation
  with characterized fungal Rpf2, it associates with Rrs1, binds 5S rRNA and promotes incorporation of
  the 5S ribonucleoprotein particle into nucleolar large-subunit precursors. This assembly step supports
  large-subunit rRNA maturation.
