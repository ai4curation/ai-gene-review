  review:
    summary: The PAINT node PTN000296192 (Rpf2 clade) was seeded by S. cerevisiae RPF2, which is required
      for processing of 27SB pre-rRNA. NCU08595 is in the same PANTHER subfamily.
    action: ACCEPT
    reason: The IBA rests on a curator-placed node in the Rpf2 subfamily (SF0), and NCU08595 descends
      from it. Nothing in the target sequence suggests the function was lost; the 5S rRNA-binding KKR
      loop and the residue aligned to yeast R236 are both conserved (file:NEUCR/NCU08595/NCU08595-bioinformatics/RESULTS-rereview.md).
      Rpf2-Rrs1 is a structural component of the pre-60S particles in which 27SB pre-rRNA is processed,
      and GO conventionally annotates such non-catalytic assembly factors to LSU-rRNA maturation. The
      processing is a downstream consequence of 5S RNP assembly, so GO:0000027 remains the primary process.
      This term is still the specific rRNA-maturation process the gene carries, and the broader IEA terms
      below are refined to it. A single donor is not weak support for a PAINT node.
    supported_by:
    - reference_id: PMID:25855814
      supporting_text: to the 90S ribosome precursor and subsequent 27SB pre-rRNA processing.
    - reference_id: file:NEUCR/NCU08595/NCU08595-bioinformatics/RESULTS-rereview.md
      supporting_text: The 5S rRNA-binding residues are therefore retained.
