taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU08595 encodes the Neurospora crassa ortholog of ribosome production factor 2 (Rpf2),
  a 341-residue nucleolar assembly factor of the large ribosomal subunit built around a Brix domain.
  In fungal orthologs, Rpf2 forms an obligate heterodimer with Rrs1 in which Rrs1 completes the Brix
  fold. Rpf2 binds 5S rRNA directly, through a conserved basic KKR loop that inserts into 5S rRNA loop
  E, and contacts ribosomal protein uL18 (RpL5). The heterodimer recruits the 5S ribonucleoprotein
  particle (5S rRNA, uL18 and uL5) into early nucleolar pre-60S particles. It then holds the immature
  central protuberance in place until Rpf2-Rrs1 is released, which allows the 5S RNP to rotate into
  its mature position. This assembly step is required for processing of 27SB pre-rRNA to mature 25S/28S
  and 5.8S rRNA. Rpf2 has no catalytic activity; it acts as an RNA- and protein-binding scaffold.
