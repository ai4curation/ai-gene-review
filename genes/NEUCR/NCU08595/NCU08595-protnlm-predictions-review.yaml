    summary: Correct but less precise than an existing supported annotation. NCU08595 is in the Rpf2
      subfamily (InterPro IPR039770; PANTHER PTHR12728:SF0), and characterized fungal Rpf2-Rrs1 complexes
      bind 5S rRNA, recruit the 5S RNP into pre-60S particles and are required for 27SB pre-rRNA processing,
      so participation in LSU-rRNA maturation transfers by subfamily membership. The predicted term is
      already in GOA for this gene as an InterPro2GO IEA, and the gene carries its is_a descendant GO:0000463
      (maturation of LSU-rRNA from tricistronic rRNA transcript) by IBA from the PAINT Rpf2 node. The gene
      review refines GO:0000470 to GO:0000463, so the prediction is the general form of the supported specific
      process. A PubMed search found no Neurospora-specific study of NCU08595; support rests on the fungal
      orthologs. Participation is as a non-catalytic assembly scaffold, not nuclease chemistry.
