- term:
    id: GO:0034599
    label: cellular response to oxidative stress
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P54783
  - sgd:YML086C
  review:
    summary: >-
      ALO1-family enzymes supply the ascorbate analog that protects fungi from
      oxidative stress, but this is a physiological consequence of the
      biosynthetic activity rather than the core enzyme function.
    action: KEEP_AS_NON_CORE
    reason: >-
      S. cerevisiae, C. albicans, and M. oryzae alo1 mutants are oxidative
      stress sensitive, and N. crassa contains erythroascorbic acid. This
      supports a conserved antioxidant role while leaving D-erythroascorbate
      biosynthesis as the core process.
    supported_by:
    - reference_id: PMID:10094636
      supporting_text: >-
        The alo1 mutants showed increased sensitivity towards oxidative stress
      reference_section_type: ABSTRACT
    - reference_id: PMID:11349062
      supporting_text: >-
        The alo1/alo1 null mutants of C. albicans showed increased sensitivity
      reference_section_type: ABSTRACT
    - reference_id: PMID:2825802
      supporting_text: >-
        erythroascorbic acid were identified in extracts of the fungus Neurospora crassa
      reference_section_type: ABSTRACT
