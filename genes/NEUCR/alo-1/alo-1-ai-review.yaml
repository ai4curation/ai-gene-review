suggested_questions:
- question: >-
    Should N. crassa ALO-1 be experimentally localized to distinguish generic
    mitochondrial-membrane residence from the S. cerevisiae-specific cytoplasmic
    side of mitochondrial outer membrane placement?
  experts:
  - Neurospora mitochondria curators
  - PAINT PTHR43762 curators
suggested_experiments:
- description: >-
    Localize ALO-1-GFP in N. crassa with mitochondrial and outer-membrane
    markers, and test whether alo-1 loss reduces D-erythroascorbate abundance or
    oxidative-stress tolerance.
