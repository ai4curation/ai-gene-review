id: Q7SGY1
gene_symbol: alo-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  Neurospora crassa alo-1 encodes a membrane-associated, FAD-linked sugar-lactone
  oxidase in the fungal ALO1 family. By homology to characterized yeast and
  Candida enzymes, ALO-1 is predicted to catalyze oxidation of
  D-arabinono-1,4-lactone in the terminal step of fungal D-erythroascorbate
  biosynthesis and to act at the mitochondrial membrane, where fungal and plant
  ascorbate-analog oxidases are commonly localized.
core_functions:
- description: >-
    D-arabinono-1,4-lactone oxidase activity at the mitochondrial membrane,
    using FAD as a covalent cofactor and oxygen as electron acceptor in the final
    step of fungal D-erythroascorbate biosynthesis.
  molecular_function:
    id: GO:0003885
    label: D-arabinono-1,4-lactone oxidase activity
