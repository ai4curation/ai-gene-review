id: V5IKE7
gene_symbol: mak-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: mak-2 encodes the terminal MAP kinase of the Neurospora crassa NRC-1/MEK-2/MAK-2 MAPK cascade, a Fus3/Spk1-like
  module used for germling and hyphal chemotropic communication, somatic cell fusion, vegetative growth, and sexual development.
  MAK-2 kinase activity is required for coordinated oscillatory recruitment of MAK-2 and SO to opposing cell tips during chemotropic
  interactions, and MAK-2 also localizes to nuclei and cytoplasmic cortical complexes in this self-signaling system.
