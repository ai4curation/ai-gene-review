suggested_questions:
- question: Would GO benefit from a fungal-specific term for the NRC-1/MEK-2/MAK-2 self-signaling MAPK cascade, distinct from
    the narrower pheromone response MAPK cascade term seeded from Fus3 and Spk1?
suggested_experiments:
- description: Use analog-sensitive MAK-2 and phosphoproteomics during germling fusion, hyphal fusion, and protoperithecium
    development to separate direct MAK-2 phosphorylation targets from indirect transcriptional effects.
