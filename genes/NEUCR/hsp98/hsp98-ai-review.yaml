  review:
    summary: >-
      This broad ARBA chaperone process should be made specific to protein
      refolding.
    action: MODIFY
    reason: >-
      Hsp104/ClpB proteins do not generally fold nascent proteins; they
      disaggregate damaged proteins so they can be refolded. The fungal PAINT
      node already asserts GO:0042026 protein refolding for hsp98.
    proposed_replacement_terms:
