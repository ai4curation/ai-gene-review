suggested_questions:
  - question: >-
      Does Neurospora Hsp98 accumulate in the nucleus or in nuclear protein
      aggregate centers after heat shock, matching the nuclear pools described
      for S. cerevisiae and S. pombe Hsp104?
suggested_experiments:
  - description: >-
      Image endogenously tagged hsp98 before, during, and after acute heat shock
      to resolve whether the protein enters the nucleus or remains primarily
      cytosolic and ribosome-associated in N. crassa.
