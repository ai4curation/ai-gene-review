        Hsp98 is a prominent N. crassa heat-shock protein with sequence homology
        to Hsp100/ClpB family members, including S. cerevisiae Hsp104.
      supporting_text: >-
        This 28 amino acid sequence from hsp98 has 75% homology with a region of
        the ClpB protein of Escherichia coli and 86% homology to a 96-kDa protein
        of Trypanosoma brucei. It also has 71% homology to hsp104 of
        Saccharomyces cerevisiae.
    - statement: >-
        During heat shock, hsp98 was enriched in a microsomal fraction whose
        high-molecular-weight heat-shock proteins were concentrated in
        polyribosomes.
      supporting_text: >-
        Hsp98 was enriched in the microsomal fraction of heat-shocked cells.
        Sucrose gradient analysis of this cellular fraction showed that the
        three major high molecular weight heat-shock proteins (hsp98, 83 and 67)
        were more concentrated in polyribosomes than in monoribosomes.
