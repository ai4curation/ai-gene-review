id: P31540
gene_symbol: hsp98
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  hsp98 encodes the Neurospora crassa cytosolic Hsp100/ClpB-family heat-shock
  protein orthologous to fungal Hsp104 disaggregases. Hsp98 is strongly induced
  during heat shock and contains conserved ClpB-family sequence features,
  supporting inherited ATP-dependent protein disaggregation, protein-unfolding,
  protein-refolding, and heat-acclimation functions from the fungal Hsp104
  ancestor. Direct Neurospora evidence is sparse and currently establishes the
  protein as a prominent heat-shock protein with ClpB/Hsp104 homology and a
  heat-shock distribution enriched in a microsomal, polyribosome-containing
  fraction.
existing_annotations:
- term:
    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR001270
  - InterPro:IPR003959
  - InterPro:IPR018368
  review:
    summary: >-
      Hsp98 is a ClpB/Hsp104-family protein with conserved AAA+ ATPase domains.
    action: ACCEPT
    reason: >-
      The InterPro ATP-binding assertion is appropriate for this Hsp100/ClpB
      protein. The original Neurospora protein sequencing study found hsp98
      sequence homology to E. coli ClpB and S. cerevisiae Hsp104, and the full
      UniProt sequence carries the same two AAA+ ATPase-domain architecture as
      fungal Hsp104 disaggregases.
    additional_reference_ids:
      - PMID:1472534
    supported_by:
      - reference_id: PMID:1472534
        supporting_text: >-
          This 28 amino acid sequence from hsp98 has 75% homology with a region
          of the ClpB protein of Escherichia coli and 86% homology to a 96-kDa
          protein of Trypanosoma brucei. It also has 71% homology to hsp104 of
          Saccharomyces cerevisiae.
