    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0191
  review:
    summary: >-
      The nuclear localization row is a similarity-based UniProt mapping that
      was not directly verified in the cached Neurospora literature.
    action: UNDECIDED
    reason: >-
      S. cerevisiae HSP104 and S. pombe hsp104 both have nuclear pools during
      stress, so nuclear localization is plausible for N. crassa hsp98. The
      cached hsp98 primary paper is abstract-only and instead reports enrichment
      in a heat-shock microsomal fraction and polyribosomes, so it does not let
      this review verify the nuclear assertion.
    supported_by:
      - reference_id: PMID:1472534
        supporting_text: >-
          Hsp98 was enriched in the microsomal fraction of heat-shocked cells.
          Sucrose gradient analysis of this cellular fraction showed that the
          three major high molecular weight heat-shock proteins (hsp98, 83 and
          67) were more concentrated in polyribosomes than in monoribosomes.
