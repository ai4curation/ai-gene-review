- id: PMID:39926406
  title: CSE-8, a filamentous fungus-specific Shr3-like chaperone, facilitates endoplasmic
    reticulum exit of chitin synthase CHS-3 (class I) in Neurospora crassa.
  findings:
  - statement: Neurospora has two Chs7 orthologs, CSE-7/NCU05720 and CSE-8/NCU01814.
    supporting_text: >-
      The Neurospora crassa genome encodes two orthologues of Chs7: chitin
      synthase export (CSE) proteins CSE-7 (NCU05720) and CSE-8 (NCU01814)
  - statement: CSE-7 is the CHS-4 export factor, whereas CSE-8 was tested as the second
      Chs7 ortholog acting on CHS-3.
    supporting_text: This study investigated the role of the second S. cerevisiae Chs7
      orthologue, CSE-8 (Chitin Synthase Export chaperone 8), in CHS trafficking.
