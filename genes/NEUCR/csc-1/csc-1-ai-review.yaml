proposed_new_terms:
- proposed_name: chitin synthase export chaperone activity
  proposed_definition: A protein folding chaperone activity that binds or escorts a
    chitin synthase client in the endoplasmic reticulum to promote its
    productive folding, ER quality-control evasion, and export toward the
    Golgi.
  justification: >-
    CSE-7 is not a generic unfolded-protein binder; the Neurospora evidence
    supports a client-biased CHS-4 export factor in the same PAINT subfamily
    as S. cerevisiae Chs7, whose review proposes this more specific term under
    GO:0044183.
  proposed_parent:
    id: GO:0044183
    label: protein folding chaperone
  supported_by:
  - reference_id: PMID:39926406
    supporting_text: >-
      CSE-7 acts as a cargo receptor for CHS-4, facilitating its transport
      from the ER to the SPK and septa
suggested_questions:
- question: Is CSE-7 a bona fide folding chaperone or holdase for CHS-4, or does it
    act primarily as a selective ER export receptor after CHS-4 has folded?
- question: Is CSE-7 dedicated to CHS-4 in vivo, or can it exchange clients with the
    CSE-8/CHS-3 trafficking branch?
- question: Which CSE-7-positive ER, NEC, tubular-vacuolar, Spitzenkorper, and septal
    compartments represent the active site of CHS-4 export-chaperone function?
suggested_experiments:
- hypothesis: CSE-7 directly promotes CHS-4 folding or shields CHS-4 from ER quality
    control before export.
  description: >-
    Assay CHS-4 aggregation, CSE-7 co-immunoprecipitation, ERAD sensitivity,
    and ER-exit competence in wild-type, cse-7 deletion, complemented, and
    CSE-7 client-binding mutant strains.
  experiment_type: client-folding and ER-export assay
- hypothesis: The two Neurospora CHS7-like paralogs have separable client specificity
    for CHS-4 and CHS-3.
  description: >-
    Express tagged CSE-7/CSE-8 swaps or chimeras in cse-7 and cse-8 mutants
    and measure CHS-4 versus CHS-3 binding, ER exit, Spitzenkorper/septal
    localization, and cell-wall chitin deposition.
  experiment_type: paralog client-specificity assay
