id: Q7SB92
gene_symbol: csc-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: csc-1 encodes CSE-7, a CHS7-family multipass membrane export chaperone in Neurospora
  crassa that acts on the class IV chitin synthase CHS-4. CSE-7 associates with ER/nuclear-envelope
  continuum-derived membranes and is required for CHS-4-containing chitosomes to reach the
  Spitzenkorper and developing septa, thereby supporting cell-wall chitin synthesis.
