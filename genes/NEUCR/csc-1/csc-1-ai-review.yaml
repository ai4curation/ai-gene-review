  review:
    summary: >-
      The IBA ER-membrane annotation is supported by the conserved
      PTHR35329 fungal CHS7-family node and by direct Neurospora CSE-7 imaging:
      the CSE-7/CHS7 ortholog acts as an ER-associated export receptor for the
      polytopic chitin synthase CHS-4.
    action: ACCEPT
    reason: >-
      Accept as the core cellular location. PTN002175570 asserts
      GO:0005789 for the fungal CHS7 family, Q7SB92 falls in the same
      PTHR35329:SF2 chitin synthase export chaperone subfamily as the
      S. cerevisiae and C. albicans CHS7 seeds, and the Neurospora CSE-7
      abstract directly reports CSE-7 in ER-associated membranes while
      identifying it as the putative ER receptor for CHS-4.
    supported_by:
    - reference_id: PMID:29601947
      supporting_text: >-
        CSE-7 was revealed at delimited regions of the ER at the immediacies
        of nuclei, at the NEC, and remarkably also at septa and the SPK.
    - reference_id: PMID:29601947
      supporting_text: >-
        This study identifies CSE-7 as the putative ER receptor for its
        cognate cargo, the polytopic membrane protein CHS-4
