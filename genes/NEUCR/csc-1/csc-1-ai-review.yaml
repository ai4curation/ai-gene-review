- term:
    id: GO:0006031
    label: chitin biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000175393
  - PANTHER:PTN002175570
  - SGD:S000001184
  review:
    summary: >-
      The chitin biosynthetic process IBA is supported for the conserved
      fungal CHS7 family and by Neurospora CSE-7 loss/complementation:
      CHS-4-GFP delivery to chitin-synthesis sites at the SPK and septa is
      lost in the cse-7 deletion strain and restored by cse-7 complementation.
    action: ACCEPT
    reason: >-
      Accept as a core biological process. CSE-7 is not the chitin synthase
      enzyme, but it contributes directly to chitin biosynthesis by escorting
      the polytopic CHS-4 client out of the ER for delivery to cell-wall
      synthesis sites. The PTHR35329 ancestor now carries GO:0006031 from
      S. cerevisiae CHS7 and C. albicans CHS7 seeds, Q7SB92 belongs to the
      same fungal export-chaperone subfamily, and direct N. crassa
      perturbation/rescue data show that CSE-7 is necessary for CHS-4
      localization at the SPK and septa.
    supported_by:
    - reference_id: PMID:29601947
      supporting_text: >-
        CHS-4-GFP no longer accumulated at the SPK and septa
    - reference_id: PMID:29601947
      supporting_text: >-
        In a complemented strain expressing a copy of cse-7 the localization
        of CHS-4-GFP at the SPK and septa was restored
    - reference_id: PMID:39926406
      supporting_text: >-
        Previous research highlighted the crucial role of CSE-7 in the
        localization of CHS-4 at sites of cell wall synthesis
    - reference_id: file:interpro/panther/PTHR35329/PTHR35329-paint.tsv
      supporting_text: "PTHR35329\tPTN002175570\tGO:0006031\tP\tIBD\tfalse\tCGD:CAL0000175393|SGD:S000001184\ttaxon:4751\t20260529"
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002175570
        source_label: PTHR35329 fungal CHS7-family ancestor
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The current PAINT record places chitin biosynthetic process at this
          fungal ancestor from S. cerevisiae and C. albicans CHS7 seeds;
          Neurospora csc-1 is inside the same PTHR35329:SF2 subfamily and
          has direct evidence for CHS-4 export to chitin-synthesis sites.
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002175570
  - SGD:S000001184
  review:
    summary: >-
      Protein folding is a conserved CHS7-family process propagated from the
      PTN002175570 PAINT node and fits Neurospora CSE-7's ER receptor role for
      the polytopic CHS-4 cargo.
    action: ACCEPT
    reason: >-
      Accept as a core biological-process annotation. The direct CSE-7 paper
      establishes client-specific ER export of CHS-4 rather than assaying
      folding intermediates, but the phylogenetic inference is appropriate:
      S. cerevisiae CHS7 is the PAINT seed for protein folding, Q7SB92 sits
      in the same PTHR35329:SF2 export-chaperone subfamily, and current PAINT
      also asserts the more explicit GO:0044183 protein folding chaperone
      molecular function at PTN002175570. GO:0044183 would therefore be a
      reasonable future propagated addition for csc-1, but the existing
      GO:0006457 row is the one already present in GOA and is retained here
      without adding a direct NEW row from the abstract alone.
    supported_by:
    - reference_id: PMID:29601947
      supporting_text: >-
        Here, we analyzed the role of CSE-7, N. crassa Chs7p orthologue, in
        the biogenesis of CHS-4
    - reference_id: PMID:29601947
      supporting_text: >-
        This study identifies CSE-7 as the putative ER receptor for its
        cognate cargo, the polytopic membrane protein CHS-4
    - reference_id: file:interpro/panther/PTHR35329/PTHR35329-paint.tsv
      supporting_text: "PTHR35329\tPTN002175570\tGO:0006457\tP\tIBD\tfalse\tSGD:S000001184\ttaxon:4751\t20170228"
    - reference_id: file:interpro/panther/PTHR35329/PTHR35329-paint.tsv
      supporting_text: "PTHR35329\tPTN002175570\tGO:0044183\tF\tIBD\tfalse\tSGD:S000001184\ttaxon:4751\t20260611"
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN002175570
        source_label: PTHR35329 fungal CHS7-family ancestor
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The PAINT node asserts protein folding for the fungal CHS7 family
          and now also asserts GO:0044183 protein folding chaperone at the
          same ancestor, supporting a conserved chitin-synthase
          export-chaperone role rather than a Neurospora-specific gain.
