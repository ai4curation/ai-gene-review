      that act on plasma-membrane protein cargos during folding.
    supporting_text: >-
      These proteins function as specialized chaperones that prevent the
      aggregation of PM proteins at the ER by ensuring proper folding
  - statement: Loss of CSE-7 has little gross vegetative effect despite the CHS-4
      localization defect.
    supporting_text: cse-7 strain of N. crassa did not display significant phenotypic alterations
