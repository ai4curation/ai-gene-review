  label: Neurospora crassa OR74A
description: >-
  NCU09825 is the Neurospora crassa RTT109 ortholog in the fungal
  Rtt109/KAT11 histone acetyltransferase family. It catalyzes histone H3K56
  acetylation, supports homologous-recombination-dependent small RNA production
  after DNA damage, and has a separate H3K56ac-independent role in maintaining
  Polycomb/PRC2-repressed facultative heterochromatin.
