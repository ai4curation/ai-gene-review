- id: PMID:24554705
  title: Histone H3K56 acetylation is required for quelling-induced small RNA production through its role in homologous recombination.
  findings:
  - statement: >-
      N. crassa RTT109 is required for H3K56ac, qiRNA/quelling-induced siRNA
      production, and homologous recombination at repetitive loci.
    supporting_text: >-
      This global loss of H3K56Ac was restored when a construct that expresses
      the c-Myc-tagged wild-type RTT109 was transformed into the rtt109 KO strain.
  - statement: >-
      Catalytically dead RTT109 variants fail to rescue HU-induced aRNA/qiRNA
      production.
    supporting_text: >-
      the wild-type RTT109 was able to rescue the HU-induced aRNA and qiRNA
      production, the RTT109 D145A and DD304305AA mutants were deficient in
      this response.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified full text; this is the direct Neurospora evidence for
      RTT109-dependent H3K56ac and its downstream DNA-damage/small-RNA roles.
- id: PMID:42832562
  title: Epigenetic maintenance of PRC2-repressed chromatin requires RTT109 but not H3K56 acetylation.
  findings:
  - statement: >-
      A 2026 N. crassa study found RTT109 is required for maintenance of
      PRC2-repressed facultative heterochromatin, and that this role requires
      RTT109 catalytic activity but not H3K56 acetylation.
    supporting_text: >-
      proper structure and function of PRC2-methylated chromatin require RTT109
      catalytic activity but are independent of NAF-2 and H3K56 acetylation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified full text; newer Neurospora-specific work extending
      RTT109 function to PRC2-repressed chromatin inheritance.
- id: PMID:38261383
  title: Functional analysis of chromatin-associated proteins in Sordaria macrospora reveals similar roles for RTT109 and ASF1 in development and DNA damage response.
  findings:
  - statement: >-
      Sordaria macrospora rtt109 deletion phenocopies asf1 deletion in growth,
      sexual development, histone acetylation and DNA-damage response.
    supporting_text: >-
      Deletion of rtt109 resulted in strains that exhibited similarities to
      asf1 deletions in terms of vegetative growth, sexual development, histone
      acetylation, and DNA damage response.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified full text; not a Neurospora paper, but useful newer
      filamentous-ascomycete support for conservation of RTT109/ASF1 biology.
