suggested_questions:
- question: >-
    Which histone or non-histone residue is acetylated by Neurospora RTT109 to
    maintain PRC2-repressed facultative heterochromatin independently of H3K56?
suggested_experiments:
- hypothesis: >-
    N. crassa RTT109 maintains PRC2-repressed chromatin by acetylating a
    non-H3K56 substrate in facultative heterochromatin domains.
  description: >-
    Compare acetyl-proteomes and chromatin-bound histone marks from wild type,
    rtt109 deletion, catalytically inactive rtt109, and H3K56R strains during
    vegetative growth, then test candidate lysines by chromosomal point
    mutation and H3K27me3 ChIP-seq.
  experiment_type: acetyl-proteomics / genetics / ChIP-seq
knowledge_gaps:
- gap_statement: >-
    The direct RTT109 substrate that supports N. crassa PRC2-repressed
    chromatin independently of H3K56 acetylation is unknown.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: >-
    Identifying this substrate would connect the conserved Rtt109 active site
    to a filamentous-fungus chromatin-inheritance pathway that is not explained
    by the canonical H3K56ac reaction.
  resolution: >-
    Acetyl-proteomics of matched rtt109 catalytic and H3K56R mutants followed
    by residue-level genetic rescue.
