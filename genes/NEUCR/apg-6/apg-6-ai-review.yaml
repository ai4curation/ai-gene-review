suggested_questions:
- question: >-
    Is Neurospora crassa APG-6 detectably processed, PE-lipidated, and
    recruited to phagophore or autophagosome membranes under starvation or
    selective-autophagy conditions, or is its ATG8 activity still only inferred
    from conserved fungal homologs?
  experts: []
suggested_experiments:
- hypothesis: >-
    Neurospora APG-6 is proteolytically processed at its conserved C-terminal
    glycine, PE-lipidated, and recruited to autophagosomal membranes during
    starvation-induced autophagy.
  description: >-
    Tag endogenous APG-6, assay starvation-dependent puncta and vacuolar
    delivery, and compare wild-type APG-6 with a C-terminal glycine or Atg4
    processing-site mutant by lipidation gel shift and autophagy-flux readouts.
  experiment_type: endogenous tagging and autophagy-flux assay
- hypothesis: >-
    The atg-8 intracolonial hyphal-fusion phenotype is a downstream consequence
    of impaired Atg8 lipidation-dependent autophagy rather than a direct APG-6
    role in plasma-membrane fusion.
  description: >-
    Measure intracolonial hyphal fusion in mutants for other core autophagy
    genes and in an APG-6 lipidation-site mutant, then test whether restoration
    of lipidatable APG-6 rescues both fusion and autophagy-flux phenotypes.
  experiment_type: genetic complementation and phenotyping
knowledge_gaps:
- gap_statement: >-
    Direct APG-6 processing, PE lipidation, and phagophore or autophagosome
    recruitment have not been experimentally demonstrated in N. crassa.
  boundary: >-
    Q8WZY7 is a canonical PTHR10969 ATG8-family protein, but all current APG-6
    molecular-function, process, and localization annotations are PAINT,
    UniProt SubCell, or similarity inferences from experimentally characterized
    ATG8-family proteins in other species.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: OPEN
  significance: >-
    Direct lipidation and localization evidence would establish whether the
    filamentous-fungal protein carries the conserved biochemical ATG8 activity
    that is currently inferred for every GOA row.
  resolution: >-
    Endogenous APG-6 lipidation, localization, and autophagy-flux assays in
    wild-type and lipidation-site mutant Neurospora strains.
  provenance:
  - reference_id: file:genes/NEUCR/apg-6/apg-6-uniprot.txt
    supporting_text: 'PE   3: Inferred from homology;'
    reference_section_type: DATABASE_ENTRY
