description: >-
  apg-6 encodes the single Neurospora crassa ATG8-family ubiquitin-like modifier.
  The protein is proteolytically matured and conjugated to
  phosphatidylethanolamine on phagophore and autophagosome membranes, where the
  conserved Atg8 lipidation cycle supports autophagosome assembly and maturation
  and provides the Atg8 platform used by selective autophagy pathways.
