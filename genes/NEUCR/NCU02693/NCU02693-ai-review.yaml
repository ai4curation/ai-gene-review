  label: Neurospora crassa OR74A
description: NCU02693 encodes the Neurospora crassa sterol-4-alpha-carboxylate 3-dehydrogenase/C-4 decarboxylase
  ortholog in PTHR43245:SF51. It is inferred to perform the NAD(P)-dependent oxidative decarboxylation of
  4-alpha-carboxysterols to 3-keto sterols as part of the ER-membrane C-4 demethylation sequence in ergosterol
  biosynthesis.
