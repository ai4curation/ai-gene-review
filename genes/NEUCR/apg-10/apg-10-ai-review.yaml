description: Neurospora crassa apg-10 encodes the predicted Atg18 PROPPIN phosphoinositide
  effector. The protein belongs to the fungal Atg18 branch of PTHR11227 and is expected to
  couple PI3P/PI(3,5)P2 recognition to Atg2-dependent autophagosome biogenesis at phagophore
  and vacuolar membranes.
