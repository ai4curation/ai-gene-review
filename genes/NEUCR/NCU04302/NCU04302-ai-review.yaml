- id: PMID:11600706
  title: SUMO modification of Rad22, the Schizosaccharomyces pombe homologue of the recombination protein
    Rad52.
  findings:
  - statement: Purified fission-yeast Hus5 (Ubc9) is the conjugator required, with the Rad31/Fub2 E1,
      for in vitro Pmt3 (SUMO) modification, and hus5 mutants are sensitive to DNA damaging agents.
    supporting_text: The Pmt3 modification that we detect requires the presence of added Pmt3-GG (the
      mature form of Pmt3), the activator (Rad31 + Fub2) and the conjugator, Hus5.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
