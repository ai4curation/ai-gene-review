id: Q1K772
gene_symbol: NCU04302
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU04302 encodes a 157-residue Ubc9-family SUMO-conjugating E2 enzyme. Its conserved UBC
  catalytic domain and phylogenetic placement support transfer of activated SUMO to protein substrates,
  predominantly in the nucleus. SUMO modification provides a mechanism for regulating nuclear proteins;
  target-specific substrates and the distribution among nuclear subcompartments remain incompletely characterized.
