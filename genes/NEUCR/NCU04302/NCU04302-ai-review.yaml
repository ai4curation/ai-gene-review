id: Q1K772
gene_symbol: NCU04302
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU04302 encodes the Neurospora crassa ortholog of Ubc9, the single E2 conjugating enzyme
  of the SUMO pathway. The 157-residue protein is a full-length UBC fold (UBC core 3-156) with the
  catalytic cysteine (Cys92) that accepts activated SUMO from the E1 (Aos1/Uba2) as a thioester and
  transfers it, usually with an E3 ligase, to lysine residues of target proteins. It sits in the fungal/
  invertebrate Ubc9 subfamily (PANTHER PTHR24067:SF248) together with budding-yeast UBC9 and fission-yeast
  Hus5, at the eukaryote-wide Ubc9 node of the E2 family tree. By orthology it is expected to act mainly
  in the nucleus, where in yeasts Ubc9-dependent sumoylation of repair and recombination proteins
  supports the DNA damage response and sumoylation of HP1-family and H3K9-methyltransferase proteins
  supports heterochromatin silencing. No Neurospora-specific biochemical or genetic study of the protein
  has been reported, so its substrates and roles in this fungus are inferred.
