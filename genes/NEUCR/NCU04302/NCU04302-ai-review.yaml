  review:
    summary: Ubc9-mediated SUMO conjugation can support genome maintenance through modification of repair
      proteins.
    action: KEEP_AS_NON_CORE
    reason: Ubc9-mediated SUMO conjugation can support genome maintenance through modification of repair
      proteins. The fission-yeast ortholog transfer is biologically coherent, but DNA repair is one substrate-dependent
      role of a general SUMO E2 rather than its defining biochemical function. In fission yeast, hus5
      mutants are sensitive to UV, ionising radiation and hydroxyurea, and Hus5 conjugates SUMO (Pmt3)
      to the Rad52 homolog Rad22 and to Rhp51 in vitro, so the E2 itself performs the modification step
      on repair proteins; the source ortholog is in the same PANTHER subfamily (SF248).
    supported_by:
    - reference_id: PMID:11600706
      supporting_text: The Schizosaccharomyces pombe rad31 and hus5 genes are required for the DNA damage
        response, as mutants defective in these genes are sensitive to DNA damaging agents
    - reference_id: PMID:11600706
      supporting_text: We have established an S.pombe in vitro Pmt3 modification system and have shown
        that Rad22 and Rhp51 are modified in vitro
    - reference_id: file:NEUCR/NCU04302/NCU04302-uniprot.txt
      supporting_text: DR   CDD; cd23798; UBCc_UBE2I; 1.
    - reference_id: PMID:9435231
      supporting_text: Moreover, recombinant yeast and mammalian UBC9 enzymes were found to form thioester
        complexes with SMT3 and SUMO-1, respectively.
    - reference_id: PMID:12597774
      supporting_text: The Hus5.62 protein is also capable of forming a thioester link with SUMO, but
        it does not function in sumoylation assays, either in the modification of Rad22 or in SUMO chain
        formation.
