  review:
    summary: The UBC catalytic domain and PAINT placement at PTN000629675 support the Ubc9 SUMO-E2 subfamily.
    action: ACCEPT
    reason: The UBC catalytic domain and PAINT placement at PTN000629675 support the Ubc9 SUMO-E2 subfamily.
      Biochemical work on yeast and mammalian Ubc9 establishes SUMO thioester formation, making SUMO conjugation
      a well-grounded conserved function. The target has modifier-specific CDD UBCc_UBE2I and FunFam Ubc9
      assignments, corroborated by 75% full-length identity to characterized fission-yeast Ubc9.
    supported_by:
    - reference_id: file:NEUCR/NCU04302/NCU04302-uniprot.txt
      supporting_text: DR   CDD; cd23798; UBCc_UBE2I; 1.
