      supporting_text: DR   FunFam; 3.10.110.10:FF:000035; SUMO-conjugating enzyme ubc9; 1.
    - reference_id: file:NEUCR/NCU04302/NCU04302-bioinformatics/RESULTS.md
      supporting_text: The full-length target sequence is 75.0% identical to fission-yeast Ubc9 P40984
        across 156 aligned residue pairs (99.36% target coverage), and 62.42% identical to human Ubc9
        P63279 across 157 residue pairs (100% target coverage).
    - reference_id: PMID:12597774
