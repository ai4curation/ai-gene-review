  review:
    summary: Heterochromatin association transferred from fission-yeast Hus5 (same PANTHER subfamily
      SF248), where ChIP shows heterochromatin-dependent enrichment; plausible but peripheral to the core
      E2 activity.
    action: KEEP_AS_NON_CORE
    reason: Re-review change from UNDECIDED. The source ortholog P40984 (Hus5) is in the same PANTHER
      subfamily (PTHR24067:SF248) as NCU04302, and Shin et al. 2005 showed by ChIP that Hus5 is enriched
      at heterochromatin in a heterochromatin-dependent manner through binding Swi6/Chp2 (HP1) and Clr4
      (H3K9 methyltransferase). Neurospora retains HP1 and the Clr4 ortholog DIM-5, so the recruitment
      mechanism is plausibly conserved, but no Neurospora localisation data exist. The association is
      a site of action for a general nuclear E2, not its defining function, so it is kept as non-core.
