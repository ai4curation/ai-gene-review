- term:
    id: GO:0106068
    label: SUMO ligase complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: part_of
  supporting_entities:
  - UniProtKB:P40984
  - PomBase:SPAC30D11.13.1:pep
  review:
    summary: Ubc9 engages SUMO E3 ligases and substrates during conjugation, which fits the broad SUMO
      ligase complex definition; kept as non-core because the assemblies are transient and E3-defined.
    action: KEEP_AS_NON_CORE
    reason: Re-review change from ACCEPT. GO:0106068 is defined as a protein ligase complex consisting
      of a SUMO-protein transferase and other proteins that may confer substrate specificity (QuickGO).
      Ubc9 binds E3 ligases and substrates during conjugation, and the fission-yeast source ortholog is
      in the same PANTHER subfamily (SF248), so the transfer is reasonable. The complexes are transient
      and defined by their E3 components rather than by Ubc9, no Neurospora E3 partner has been
      characterised, and PAINT curators did not propagate this complex term at the Ubc9 node
      (PTN000629675 carries only nucleus, SUMO conjugating enzyme activity and protein sumoylation), so
      it is kept as a non-core component annotation.
    supported_by:
    - reference_id: file:NEUCR/NCU04302/NCU04302-uniprot.txt
      supporting_text: DR   CDD; cd23798; UBCc_UBE2I; 1.
    - reference_id: PMID:17466333
      supporting_text: The SUMO E2 Ubc9 serves as a lynchpin in the SUMO conjugation pathway, interacting
        with the SUMO E1 during activation, with thioester linked SUMO after E1 transfer and with the
        substrate and SUMO E3 ligases during conjugation.
