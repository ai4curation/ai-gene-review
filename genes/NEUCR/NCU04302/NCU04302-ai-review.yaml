- id: file:NEUCR/NCU04302/NCU04302-bioinformatics/RESULTS.md
  title: NCU04302 E2 comparison results
  findings:
  - statement: The report supports the Ubc9 assignment in combination with PAINT and
      UBC-domain evidence, and explains why homology to an Arabidopsis ubiquitin E2
      does not support retaining ubiquitin-transfer specificity.
    supporting_text: The much broader E2 fold also encompasses ubiquitin E2s, explaining
      why a homologous donor does not justify retaining its modifier specificity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Re-read the Ubc9 comparison report; its target, fission-yeast Ubc9, human Ubc9 and
      Arabidopsis UBC2 alignments support the SUMO-E2 subfamily assignment but do not
      establish retention of the broader ubiquitin-transfer specificity.
