  review:
    summary: Ubc9 participates in conserved SUMO-conjugation assemblies.
    action: ACCEPT
    reason: GO:0106068 includes a SUMO-protein transferase with other proteins that confer substrate specificity;
      it does not require a permanently stable assembly. The Ubc9-specific sequence assignment and conserved
      interactions with SUMO, substrates and E3 ligases support this broad complex annotation from the
      fission-yeast ortholog. No named Neurospora E3 partner or stoichiometry is inferred.
    supported_by:
    - reference_id: file:NEUCR/NCU04302/NCU04302-uniprot.txt
      supporting_text: DR   CDD; cd23798; UBCc_UBE2I; 1.
    - reference_id: PMID:17466333
      supporting_text: The SUMO E2 Ubc9 serves as a lynchpin in the SUMO conjugation pathway, interacting
        with the SUMO E1 during activation, with thioester linked SUMO after E1 transfer and with the
        substrate and SUMO E3 ligases during conjugation.
