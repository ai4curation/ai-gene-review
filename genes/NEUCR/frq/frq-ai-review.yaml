- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: EXP
  original_reference_id: PMID:38526948
  qualifier: enables
  review:
    summary: 'Accept: protein homodimerization activity (phosphorylation-dependent).'
    action: ACCEPT
    reason: MALS shows the unphosphorylated protein is a dimer; note the activity
      is conditional — phosphorylation destabilizes the homodimer, so this is not
      a constitutive property across the circadian cycle.
    supported_by:
    - reference_id: PMID:38526948
      supporting_text: Hence, purified np-FRQ dimerizes, whereas phosphorylation destabilizes
        this association.
- term:
    id: GO:0140693
