existing_annotations:
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: located_in
  review:
    summary: 'Accept: nucleus.'
    action: ACCEPT
    reason: FRQ must enter the nucleus to inhibit the White Collar Complex, so nuclear localisation is intrinsic
      to the negative-feedback step. Electronic here, but well established for this protein.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: located_in
  review:
    summary: 'Accept: cytoplasm.'
    action: ACCEPT
    reason: FRQ shuttles, and its cytoplasmic pool is where much of the progressive phosphorylation that sets period
      length occurs. The term is general, but the dual distribution is real.
- term:
    id: GO:0006355
    label: regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: 'Accept: regulation of DNA-templated transcription.'
    action: ACCEPT
    reason: FRQ regulates transcription indirectly, by inhibiting the WCC rather than by binding DNA itself. The
      unsigned term is defensible, but a negative-regulation term would be the more accurate statement.
- term:
    id: GO:0007623
    label: circadian rhythm
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: 'Accept: circadian rhythm.'
    action: ACCEPT
    reason: 'The defining process for frq: it constitutes the negative arm of the Neurospora clock feedback loop.
      Correct, though electronic for a gene with extensive direct evidence.'
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20807745
  qualifier: enables
  review:
    summary: Protein binding (uninformative MF) reflecting White Collar Complex / clock interactions.
    action: KEEP_AS_NON_CORE
    reason: This IPI captures physical interactions within the White Collar Complex or clock; 'protein
      binding' is uninformative as a molecular function, so kept as non-core.
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:38526948
  qualifier: is_active_in
  review:
    summary: 'Accept: nucleus.'
    action: ACCEPT
    reason: FRQ acts in the nucleus as part of the FFC repressor, which is where it engages the WCC.
    supported_by:
    - reference_id: PMID:38526948
      supporting_text: The FFC enters the nucleus where it directly inhibits the WCC and thereby downregulates
        frq expression
- term:
    id: GO:0042803
    label: protein homodimerization activity
  evidence_type: EXP
  original_reference_id: PMID:38526948
  qualifier: enables
  review:
    summary: 'Accept: protein homodimerization activity (phosphorylation-dependent).'
    action: ACCEPT
    reason: MALS shows the unphosphorylated protein is a dimer; note the activity is conditional — phosphorylation
      destabilizes the homodimer, so this is not a constitutive property across the circadian cycle.
    supported_by:
    - reference_id: PMID:38526948
      supporting_text: Hence, purified np-FRQ dimerizes, whereas phosphorylation destabilizes this association.
- term:
    id: GO:0140693
    label: molecular condensate scaffold activity
  evidence_type: IDA
  original_reference_id: PMID:38526948
  qualifier: enables
  review:
    summary: 'Accept: molecular condensate scaffold activity.'
    action: ACCEPT
    reason: FRQ phase-separates and, as a condensate, sequesters its FFC partners FRH and CK1 — the scaffolding
      role the term describes, demonstrated directly in the annotated reference.
    supported_by:
    - reference_id: PMID:38526948
      supporting_text: Full-length FRQ undergoes liquid-liquid phase separation (LLPS) to sequester FRH
        and CK1 and influence CK1 enzymatic activity.
- term:
    id: GO:0140694
    label: membraneless organelle assembly
  evidence_type: IDA
  original_reference_id: PMID:38526948
  qualifier: involved_in
  review:
    summary: 'Accept: membraneless organelle assembly.'
    action: ACCEPT
    reason: FRQ forms condensate foci in vivo, so it participates in assembly of a membraneless compartment
      rather than merely residing in one.
    supported_by:
    - reference_id: PMID:38526948
      supporting_text: Live imaging of Neurospora hyphae reveals FRQ foci characteristic of condensates
        near the nuclear periphery.
