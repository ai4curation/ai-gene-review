  evidence_type: IPI
  original_reference_id: PMID:20807745
  qualifier: enables
  review:
    summary: Protein binding with FRH (FRQ-interacting RNA helicase, Q873J5), the
      partner with which FRQ forms the FFC repressor complex of the clock negative
      arm.
    action: KEEP_AS_NON_CORE
    reason: The WITH/FROM partner is FRH. The FRQ-FRH interaction is real and central
      to clock negative feedback (FRQ binds FRH via its FFD domain and positions it
      near CK1 in the FFC), but 'protein binding' names no activity. The informative
      statement about FRQ's molecular role is captured by the condensate-scaffold
      annotation; this row is retained as non-core interaction evidence.
    supported_by:
    - reference_id: PMID:20807745
      supporting_text: FREQUENCY-interacting RNA helicase (FRH), a component that complexes
        with FRQ to mediate negative feedback control in Neurospora
    - reference_id: PMID:38526948
      supporting_text: Translated FRQ binds to FRH via its FFD domain and to CK1 via
        its two FCD domains (1 and 2) to form the repressive FFC
  supporting_entities:
