  evidence_type: IDA
  original_reference_id: PMID:38526948
  qualifier: enables
  review:
    summary: 'Accept: molecular condensate scaffold activity.'
    action: ACCEPT
    reason: FRQ phase-separates and, as a condensate, sequesters its FFC partners
      FRH and CK1 — the scaffolding role the term describes, demonstrated directly
      in the annotated reference.
    supported_by:
    - reference_id: PMID:38526948
      supporting_text: Full-length FRQ undergoes liquid-liquid phase separation (LLPS)
        to sequester FRH and CK1 and influence CK1 enzymatic activity.
- term:
    id: GO:0140694
    label: membraneless organelle assembly
  evidence_type: IDA
  original_reference_id: PMID:38526948
  qualifier: involved_in
  review:
    summary: 'Accept: membraneless organelle assembly.'
    action: ACCEPT
    reason: FRQ forms condensate foci in vivo, so it participates in assembly of a
      membraneless compartment rather than merely residing in one.
    supported_by:
    - reference_id: PMID:38526948
      supporting_text: Live imaging of Neurospora hyphae reveals FRQ foci characteristic
        of condensates near the nuclear periphery.
