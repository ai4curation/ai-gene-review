existing_annotations:
- term:
    id: GO:0004311
    label: geranylgeranyl diphosphate synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR044843
  review:
    summary: >-
      InterPro2GO assigns GGPP synthase activity from IPR044843, a fold-level
      bacterial-type trans-isoprenyl diphosphate synthase signature. al-2 does
      not synthesise GGPP; it consumes GGPP as the substrate of its phytoene
      synthase activity, and GGPP is made in N. crassa by the separate gene al-3.
    action: REMOVE
    reason: >-
      GO:0004311 is defined as the head-to-tail condensation of farnesyl
      diphosphate with isopentenyl diphosphate to give geranylgeranyl
      diphosphate (verified against QuickGO), which is the opposite direction of
      metabolism from what al-2 does: al-2 takes two GGPP molecules and condenses
      them head-to-head to phytoene. The GGPP supply in N. crassa is provided by
      al-3, a distinct gene, while al-2 is the downstream consumer. IPR044843 is
      a fold-level trans-isoprenyl diphosphate synthase entry capturing the
      shared all-alpha terpenoid synthase fold, which the same UniProt record
      also matches as Gene3D "Farnesyl Diphosphate Synthase" and SUPFAM
      "Terpenoid synthases"; a fold-level match cannot discriminate chain
      elongation (a 1'-4 head-to-tail prenyltransferase) from the 1'-1
      head-to-head condensation al-2 performs. This is a paralog over-annotation
      from an InterPro2GO mapping and is handled as in genes/PANAN/crtB.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: InterPro:IPR044843
        source_label: Trans_IPPS_bact-type
        source_status: SOURCE_BAD
        comment: >-
          Fold-level bacterial trans-isoprenyl diphosphate synthase entry shared
          by head-to-tail elongases and head-to-head condensing enzymes; it
          cannot license a specific chain-elongation activity for a phytoene
          synthase.
    supported_by:
    - reference_id: file:NEUCR/al-2/al-2-uniprot.txt
      supporting_text: 'InterPro; IPR044843; Trans_IPPS_bact-type.'
    - reference_id: file:NEUCR/al-2/al-2-uniprot.txt
      supporting_text: >-
        Reaction=2 (2E,6E,10E)-geranylgeranyl diphosphate = 15-cis-phytoene + 2
    - reference_id: file:NEUCR/al-2/al-2-deep-research-falcon.md
      supporting_text: In *N. crassa*, GGPP is supplied by AL-3.
      reference_section_type: OTHER
