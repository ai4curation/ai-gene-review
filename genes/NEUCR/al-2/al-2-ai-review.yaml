suggested_questions:
- question: >-
    Which membrane does al-2 reside in within N. crassa, and is the multi-pass
    topology predicted from sequence borne out by experimental localization of
    the native protein?
- question: >-
    What structural feature of the al-2 cyclase domain enforces its unusual
    preference for a single cyclization, in contrast to the bicyclic products of
    most lycopene cyclases, and does al-2 warrant an additional annotation to
    beta-carotene biosynthetic process (GO:1901812) given that it can form
    beta-carotene when the native single-cyclization preference is overridden?
suggested_experiments:
- experiment_type: subcellular fractionation and imaging
  hypothesis: >-
    al-2 is an integral membrane protein anchored by its N-terminal
    transmembrane helices, positioning both catalytic domains at the membrane
    where the hydrophobic carotenoid substrates partition.
  description: >-
    Fractionate N. crassa into soluble and membrane fractions with validated
    marker controls and locate al-2 by immunoblot, in parallel with
    protease-accessibility assays and fluorescent-fusion imaging of a functional
    tagged allele, to test the sequence-predicted multi-pass membrane topology
    and identify the specific membrane.
- experiment_type: structure determination and site-directed mutagenesis
  hypothesis: >-
    Distinct active-site residues in the cyclase domain set the single-cyclization
    preference that distinguishes al-2 from bicyclic lycopene cyclases.
  description: >-
    Solve the structure of the al-2 cyclase domain, or model it and test
    candidate residues near the ionone-ring pocket by mutagenesis, measuring the
    ratio of monocyclic to bicyclic products for each variant to identify the
    determinants of the single-cyclization preference reported by Sandmann et al.
