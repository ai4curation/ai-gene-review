- term:
    id: GO:0051996
    label: squalene synthase [NAD(P)H] activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR033904
  review:
    summary: >-
      InterPro2GO assigns the paralogous squalene synthase activity from
      IPR033904, the head-to-head trans-IPPS domain that phytoene synthases and
      squalene synthases share by construction. al-2 uses a different substrate,
      makes a different product, and requires no NAD(P)H.
    action: REMOVE
    reason: >-
      GO:0051996 is defined as the NAD(P)H-dependent condensation of two farnesyl
      diphosphate molecules to squalene (verified against QuickGO), and every
      component of that definition is wrong for al-2: the substrate is the C20
      geranylgeranyl diphosphate rather than the C15 farnesyl diphosphate, the
      product is the C40 phytoene rather than the C30 squalene, and no
      nicotinamide cofactor is used. Phytoene synthase and squalene synthase are
      genuine homologues that both form a cyclopropylcarbinyl diphosphate
      intermediate (prephytoene diphosphate for al-2, recorded in UniProt) by
      head-to-head condensation, but they diverge at the second half-step:
      squalene synthase reductively opens the intermediate using NADPH, whereas
      phytoene synthase eliminates a proton, which is exactly why the product
      carries the central 15-cis double bond and why no nicotinamide is needed.
      IPR033904 is the shared head-to-head domain, matched on the same UniProt
      record by CDD cd00683, so it cannot discriminate the two families. This is
      a paralog over-annotation, handled as in genes/PANAN/crtB.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: InterPro:IPR033904
        source_label: Trans_IPPS_HH
        source_status: SOURCE_BAD
        comment: >-
          Head-to-head trans-IPPS domain common to squalene synthases and
          phytoene synthases; shared by construction, so it cannot assign the
          squalene-specific, NAD(P)H-dependent activity to a phytoene synthase.
    supported_by:
    - reference_id: file:NEUCR/al-2/al-2-uniprot.txt
      supporting_text: 'InterPro; IPR033904; Trans_IPPS_HH.'
    - reference_id: file:NEUCR/al-2/al-2-uniprot.txt
      supporting_text: >-
        Reaction=2 (2E,6E,10E)-geranylgeranyl diphosphate = 15-cis-phytoene + 2
core_functions:
- description: >-
    Committed entry step of C40 carotenoid biosynthesis. The C-terminal phytoene
    synthase domain of al-2 binds two molecules of geranylgeranyl diphosphate
    (supplied by al-3) and joins them head-to-head, first forming the
    cyclopropylcarbinyl intermediate prephytoene diphosphate and then rearranging
    it with loss of a proton to release 15-cis-phytoene and diphosphate
    (RHEA:34475, EC 2.5.1.32). The product is desaturated by al-1, committing
    isoprenoid carbon to the carotenoid branch.
