- id: file:NEUCR/al-2/al-2-deep-research-falcon.md
  title: Deep research report for Neurospora crassa al-2
  findings:
  - statement: >-
      States that GGPP is supplied by the separate enzyme AL-3, supporting the
      removal of the transferred GGPP synthase activity from al-2.
    supporting_text: In *N. crassa*, GGPP is supplied by AL-3.
    reference_section_type: OTHER
  - statement: >-
      States that no experimental localization of native AL-2 exists in
      N. crassa, so the membrane assignment remains sequence-based.
    supporting_text: No direct study was found that localizes native AL-2 in *N. crassa*
    reference_section_type: OTHER
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      Used as retrieval support only. Every identifier, GO term and quotation in
      this review was taken from QuickGO, the UniProt record or the cached
      publications rather than from this report. Its two negative statements,
      about GGPP being supplied by al-3 and about the absence of a localization
