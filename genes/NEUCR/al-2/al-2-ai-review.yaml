- description: >-
    Ring-forming step of carotene biosynthesis. The N-terminal lycopene
    beta-cyclase domain of al-2 folds a psi end group of the desaturated
    substrate into a beta-ionone ring, converting all-trans-lycopene to
    gamma-carotene and gamma-carotene to all-trans-beta-carotene (RHEA:32219 and
    RHEA:32239, EC 5.5.1.19), and converting 3,4-didehydrolycopene to torulene.
    Unlike most lycopene cyclases it preferentially performs a single
    cyclization, so monocyclic carotenes predominate and feed the torulene ->
    neurosporaxanthin branch. Point mutations in this domain (W189R, K208E)
    abolish the activity and neurosporaxanthin production.
