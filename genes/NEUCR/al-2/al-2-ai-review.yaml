  - UniProtKB:Q6EI12
  review:
    summary: >-
      Phylogenetic propagation of the module-level carotenoid biosynthetic
      process from the phytoene synthase/lycopene cyclase family node. al-2
      catalyses two steps of this pathway (phytoene formation and ring
      cyclization), so it participates in the process rather than merely being
      required for it.
    action: ACCEPT
    reason: >-
      This is the correct top-level process for al-2. The IBD behind this IBA was
      placed on the PANTHER node PTN000770577 in the bifunctional lycopene
      cyclase/phytoene synthase family, and al-2 sits within the clade that
      inherited the function; al-2's own experimental annotations for the same
      term (below) are among the descendant evidences, so its appearance in the
      WITH/FROM list is expected and not circular. Concordant with the direct
      experimental evidence.
    supported_by:
    - reference_id: PMID:11862485
      supporting_text: >-
        Phytoene synthase and carotene cyclase, two key enzymes in carotenoid
        biosynthesis, are encoded by two separate genes in bacteria and plants, but
        by a single bifunctional gene in fungi.
