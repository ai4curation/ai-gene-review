id: P37295
gene_symbol: al-2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257
    / FGSC 987)
description: >-
  al-2 (albino-2, NCU00585) is the bifunctional lycopene cyclase/phytoene
  synthase of the filamentous fungus Neurospora crassa, a 602-residue
  multi-pass membrane protein that carries two distinct catalytic activities in
  a single polypeptide. In bacteria and plants these two activities reside on
  separate proteins, but in fungi they are fused: the N-terminal region is a
  lycopene beta-cyclase and the C-terminal region is a phytoene synthase of the
  phytoene/squalene synthase family. As a phytoene synthase (EC 2.5.1.32) al-2
  catalyses the committed step of carotenoid biosynthesis, the head-to-head
  condensation of two molecules of the C20 isoprenoid geranylgeranyl
  diphosphate through the intermediate prephytoene diphosphate to the colourless
  C40 hydrocarbon 15-cis-phytoene. Geranylgeranyl diphosphate is supplied by the
  separate enzyme al-3, and the phytoene product is desaturated by al-1 to
  3,4-didehydrolycopene and lycopene. As a lycopene beta-cyclase (EC 5.5.1.19)
  al-2 then folds a psi end group of the desaturated substrate into a
  beta-ionone ring, converting lycopene to gamma-carotene and gamma-carotene to
  beta-carotene, and converting 3,4-didehydrolycopene to torulene. Unlike most
  lycopene cyclases it preferentially performs a single cyclization at one end
  of the substrate, so monocyclic carotenes predominate; torulene is
  subsequently cleaved by cao-2 and oxidised by ylo-1 to the acidic apocarotenoid
  neurosporaxanthin, the final pigment of the pathway. Because it acts on
  membrane-embedded hydrophobic substrates, al-2 is an integral membrane protein,
  and its expression is strongly induced by blue light through the White Collar
  photoreceptor complex.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings:
  - statement: >-
      Supplied four InterPro2GO rows. Two assign the catalytic activities of
      paralogous enzymes (GGPP synthase from the fold-level IPR044843 and
      squalene synthase from the head-to-head domain IPR033904) that al-2 does
      not possess and are removed. Two assign true but over-general ancestor or
      domain-level terms (the generic transferase term from the family
      conserved-site IPR019845, and intramolecular lyase activity from the
      lycopene cyclase domain IPR017825) that are modified to the specific,
      directly-assayed activities.
  reference_review:
    relevance: HIGH
    correctness: MISCITED
    review_notes: >-
      The method reference is correctly identified; the issue is at the mapping
      level. IPR044843 is a fold-level trans-isoprenyl diphosphate synthase entry
      and IPR033904 is the head-to-head trans-IPPS domain shared by phytoene and
      squalene synthases by construction, so neither can discriminate this
      protein's activity from that of its paralogues; the derived GGPP synthase
      and squalene synthase rows are removed with biological argument. IPR019845
      (family conserved site) and IPR017825 (lycopene cyclase domain) support
      only generic statements and are modified to the specific activities al-2
      holds by direct assay.
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: >-
      Supplied the IBA rows for GO:0046905 15-cis-phytoene synthase activity and
      GO:0016117 carotenoid biosynthetic process, propagated from the PANTHER
      node PTN000770577 in the bifunctional lycopene cyclase/phytoene synthase
      family (PTHR31480). al-2 (P37295) is itself among the WITH/FROM sources,
      reflecting its own experimental grounding.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The phylogenetic inference reaches the correct molecular function and
      process for this family at an appropriate level of specificity, concordant
      with the direct experimental evidence for the same terms. al-2's presence
      in its own WITH/FROM list is expected for a gene with its own experimental
      annotation and is not circular.
- id: GO_REF:0000044
  title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      Supplied the GO:0016020 membrane row from the UniProt subcellular location
      SL-0162, itself derived from the multi-pass membrane prediction.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The mapping faithfully reflects the UniProt Membrane; Multi-pass membrane
      protein annotation, which rests on seven predicted transmembrane helices.
      It is a sequence-based rather than experimentally verified localization.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Supplied the precise GO:0046905 row grounded in RHEA:34475 and EC 2.5.1.32
      and the precise GO:0045436 row grounded in RHEA:32219, both of which match
      the catalytic-activity records UniProt attributes to this entry on
      experimental grounds.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The Rhea reactions and EC number correspond exactly to the reactions
      UniProt records for al-2 with ECO:0000269 experimental evidence from
      PMID:11862485 and PMID:16928467, so the electronic route reaches the right
      chemistry.
- id: PMID:11862485
  title: Mutants of the carotene cyclase domain of al-2 from Neurospora crassa.
  findings:
  - statement: >-
      Isolated two reddish al-2 mutants (JA26, JA28) carrying substitutions in
      the N-terminal cyclase domain; the mutants lose cyclase activity and fail
      to make neurosporaxanthin, establishing that the al-2 product is a single
      bifunctional phytoene synthase/lycopene cyclase.
    supporting_text: >-
      The chemical and spectrophotometrical properties of this carotenoid are
      consistent with the absence of carotenoid cyclization
  - statement: >-
      Frames the bifunctional architecture: phytoene synthase and carotene
      cyclase are separate genes in bacteria and plants but fused in one gene in
      fungi.
    supporting_text: >-
      Phytoene synthase and carotene cyclase, two key enzymes in carotenoid
      biosynthesis, are encoded by two separate genes in bacteria and plants, but
      by a single bifunctional gene in fungi.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cache is abstract-only (full_text_available: false), but the abstract
      itself states the bifunctionality conclusion and the loss of cyclase
      activity in the domain mutants. UniProt records the catalytic activities
      for both EC 2.5.1.32 and EC 5.5.1.19 with ECO:0000269 experimental evidence
      citing this paper, so the curator read the full text; the enzymatic
      annotations are grounded on that experimental basis.
- id: PMID:16928467
  title: The biotechnological potential of the al-2 gene from Neurospora [correction
    of Neurospra] crassa for the production of monocyclic keto hydroxy carotenoids.
  findings:
  - statement: >-
      Cloned, expressed and functionally characterized the al-2 cDNA in E. coli,
      confirming that the single enzyme carries both a phytoene synthase and a
      lycopene cyclase activity.
    supporting_text: >-
      The enzyme comprised the two catalytic activities of a phytoene synthase and
      a lycopene cyclase.
  - statement: >-
      Established that al-2 preferentially performs a single cyclization,
      producing monocyclic carotenes, making it the first CrtYB-type
      monocyclic-acting lycopene cyclase.
    supporting_text: >-
      In contrast to most other lycopene cyclases, single cyclizations were
      preferentially catalyzed.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Cache is abstract-only, but the abstract directly states the two catalytic
      activities and the monocyclic preference relied on here. UniProt cites this
      paper with ECO:0000269 for both catalytic activities.
- id: PMID:8163509
  title: 'Characterization of al-2, the phytoene synthase gene of Neurospora crassa.
    Cloning, sequence analysis, and photoregulation.'
  findings:
  - statement: >-
      Cloned al-2 and identified a segment homologous to prokaryotic and
      eukaryotic phytoene synthases, the basis for the phytoene synthase name.
    supporting_text: >-
      segment homologous to prokaryotic and other eukaryotic phytoene synthases
  - statement: >-
      Showed strong blue-light photoinduction of al-2 mRNA, abolished in the
      wc-1 and wc-2 White Collar photoreceptor mutants.
    supporting_text: >-
      the level of al-2 mRNA increased over 30-fold in photoinduced mycelia
      compared with dark-grown mycelia
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Not a GOA row for this gene; the ECO:0000305 basis in UniProt for the
      phytoene synthase name and the source of the blue-light induction record.
      Cache is abstract-only but supports the points cited. The light induction
      is regulation of the gene rather than a function the protein performs.
