  review:
    summary: SmG contacts a nucleobase of the snRNA Sm site within the heptameric ring; the contact residues
      are conserved in NCU09880.
    action: ACCEPT
    reason: In the Sm ring each subunit engages one nucleobase of the U-rich Sm site through a conserved
