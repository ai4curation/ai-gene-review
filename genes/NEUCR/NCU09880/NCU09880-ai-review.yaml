id: Q7S234
gene_symbol: NCU09880
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU09880 encodes Neurospora crassa small nuclear ribonucleoprotein G (SmG), an 85-residue
  Sm-fold protein. With SmE and SmF it forms the F-E-G subcomplex that joins the D1-D2 and D3-B subcomplexes
  to build the heptameric Sm ring on the uridine-rich Sm site of the U1, U2, U4 and U5 snRNAs, where SmG
  contacts one nucleobase through a conserved Arg/Phe/Asn triad. The Sm ring is the core scaffold of these
  spliceosomal snRNPs, so SmG travels with them into the U4/U6.U5 tri-snRNP and the successive spliceosome
  assemblies that carry out nuclear pre-mRNA splicing. Before ring closure, Sm subunits pass through an
  SMN-Gemin2-dependent assembly intermediate.
