- term:
    id: GO:0034719
    label: SMN-Sm protein complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN000058285
  - UniProtKB:P62308
  review:
    summary: SmG is a substrate subunit of the SMN-Gemin2-Sm assembly intermediate; Neurospora encodes
      candidate SMN and Gemin2 homologs.
    action: KEEP_AS_NON_CORE
    reason: 'The PAINT node PTN000058285, which contains NCU09880, carries the SMN-Sm protein complex
      assertion seeded from human SNRPG, whose SmD1/D2/F/E/G pentamer was crystallised bound to Gemin2
      and the SMN Gemin2-binding domain. Neurospora is not obviously outside the clade that retained this
      machinery: it encodes a protein with the SMN Gemin2-binding domain (NCU01700) and a SIP1/Gemin2-family
      protein (NCU00620), although neither has been studied. The complex is a transient assembly intermediate
      in which SmG is a client, so the annotation is retained but not as a core function (the functional
      snRNP memberships are core).'
    supported_by:
    - reference_id: PMID:21816274
      supporting_text: 'Here, we describe the 2.5 Å crystal structure of Gemin2 bound to SmD1/D2/F/E/G

        pentamer and SMN''s Gemin2-binding domain, a key assembly intermediate.'
    - reference_id: file:NEUCR/NCU09880/NCU09880-bioinformatics/RESULTS-assembly-rereview.md
      supporting_text: Neurospora crassa encodes one protein with the SMN Gemin2-binding domain (NCU01700,
        Q7RY22) and one SIP1-family (Gemin2/Brr1) protein (NCU00620, Q7SI32)
- term:
    id: GO:0036261
    label: 7-methylguanosine cap hypermethylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P40204
  - sgd:YFL017W-A
  review:
    summary: Cap hypermethylation is catalysed by Tgs1; the yeast experiment behind this transfer depleted
      SmE, not SmG, and PAINT did not propagate the term.
    action: MARK_AS_OVER_ANNOTATED
    reason: This Ensembl Compara row transfers a yeast SmG annotation that rests on PMID:9528767, where
      depletion of SmE (and, cited there, SmD1/SmD3) reduced snRNA TMG-cap formation; SmG itself was not
      assayed for hypermethylation. The result shows that Sm-core assembly on the Sm site is a prerequisite
      for Tgs1-catalysed hypermethylation, i.e. the snRNP is the substrate-bearing particle and Tgs1 performs
      the methylation. That is necessity rather than participation by SmG, and PAINT curators, who propagated
      the snRNP and splicing terms from the same SmG node, did not propagate this one. Not rejected outright
      because the Sm ring is the platform recognised by the methylase, but it is an over-annotation for
      SmG.
    supported_by:
    - reference_id: PMID:9528767
      supporting_text: 'the efficiency of hypermethylation is around 0.51 to

        0.61, indicating that depletion of SmE protein affects the snRNA

        hypermethylation process.'
    - reference_id: PMID:9528767
      supporting_text: 'This binding allows hypermethylation of the snRNA 7-methyl cap

        by a methylase to form a methyl-2,2,7-guanosine cap structure'
    - reference_id: PMID:11983179
      supporting_text: 'Here,

        we show that yeast Tgs1p, an evolutionarily conserved protein carrying a

        signature of S-AdoMet methyltransferase, is essential for hypermethylation of

        the m(7)G caps of both snRNAs and snoRNAs.'
