id: Q7S234
gene_symbol: NCU09880
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: NCU09880 is a canonical SmG protein that binds snRNA in the heptameric Sm ring. SmG-containing
  U1, U2, U4 and U5 small nuclear ribonucleoproteins assemble into the spliceosome and support pre-mRNA
  splicing. SmG also participates in the assembly intermediates that build these RNA-protein particles.
