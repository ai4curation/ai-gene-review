  review:
    summary: SmG is a substrate subunit in the SMN-mediated Sm assembly intermediate.
    action: ACCEPT
    reason: SmG is a substrate subunit in the SMN-mediated Sm assembly intermediate. The human structure
      explicitly contains SmG in the SmD1/D2/F/E/G pentamer bound to Gemin2 and SMN. The curated ancestral
      assertion transfers this conserved assembly interaction, not a stable catalytic-spliceosome SMN
      membership.
    supported_by:
    - reference_id: PMID:21816274
      supporting_text: 'Here, we describe the 2.5 Å crystal structure of Gemin2 bound to SmD1/D2/F/E/G

        pentamer and SMN''s Gemin2-binding domain, a key assembly intermediate.'
- term:
    id: GO:0036261
    label: 7-methylguanosine cap hypermethylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:P40204
  - sgd:YFL017W-A
  review:
    summary: Cap hypermethylation is catalyzed by Tgs1 and is coupled to snRNP biogenesis, so a noncatalytic
      SmG contribution is plausible.
    action: UNDECIDED
    reason: Cap hypermethylation is catalyzed by Tgs1 and is coupled to snRNP biogenesis, so a noncatalytic
      SmG contribution is plausible. The retrieved experiments establish SmG-dependent ring assembly but
      do not resolve the specific SmG requirement for cap hypermethylation underlying this yeast-to-Neurospora
      transfer. This is not rejected merely because SmG lacks methyltransferase activity.
    supported_by:
    - reference_id: PMID:11983179
      supporting_text: 'Here,

        we show that yeast Tgs1p, an evolutionarily conserved protein carrying a

        signature of S-AdoMet methyltransferase, is essential for hypermethylation of

        the m(7)G caps of both snRNAs and snoRNAs.'
    - reference_id: PMID:27417296
      supporting_text: 'A seven-subunit Sm protein ring forms a core scaffold of the U1, U2, U4, and U5

        snRNPs that direct pre-mRNA splicing.'
