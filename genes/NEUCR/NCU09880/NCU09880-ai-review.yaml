    label: spliceosomal snRNP assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000481797
  review:
    summary: SmG is a structural subunit of the Sm core that is assembled onto snRNA to build spliceosomal
      snRNPs.
    action: ACCEPT
    reason: NCU09880 is a full-length canonical SmG (PANTHER PTHR10553:SF2, shared with characterised
      yeast SmG). Sm subunits pre-form the F-E-G subcomplex and then assemble with the other subcomplexes
      onto the snRNA Sm site; as a subunit of the assembled core, SmG contributes structure to this assembly
      process rather than merely being required for it. Accepted as a core process.
    supported_by:
    - reference_id: PMID:27417296
      supporting_text: 'Prior to assembly of the ring, the Sm subunits self-organize as three heteromeric
        subcomplexes: D3–B, F–E–G, and D1–D2'
    - &id001
      reference_id: PMID:27417296
      supporting_text: 'A seven-subunit Sm protein ring forms a core scaffold of the U1, U2, U4, and U5

        snRNPs that direct pre-mRNA splicing.'
    - &id002
      reference_id: file:NEUCR/NCU09880/NCU09880-bioinformatics/RESULTS-assembly-rereview.md
      supporting_text: Q7S234 shares PANTHER subfamily PTHR10553:SF2 with budding-yeast SMX2 (P40204),
