      yeast SmG proteins, so canonical Sm-ring membership of this snRNP-containing complex is evolutionarily
      grounded.
    action: ACCEPT
    reason: 'PANTHER subfamily SF2 and the SmG-specific signature place NCU09880 with experimentally characterised
      budding- and fission-yeast SmG rather than with Lsm7. The Sm ring is the core scaffold of the U1,
      U2, U4 and U5 snRNPs and remains bound to these snRNAs as they pass through the tri-snRNP, prespliceosome,
      spliceosome and intron-lariat stages; the PAINT node placement (or Compara ortholog transfer from
      yeast experimental data) is consistent with this. No Neurospora-specific divergence is apparent:
      the snRNA-contact residues are conserved.'
