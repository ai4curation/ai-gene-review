    label: spliceosomal snRNP assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000481797
  review:
    summary: The SmG-specific domain identifies a canonical Sm-ring subunit.
    action: ACCEPT
    reason: The SmG-specific domain identifies a canonical Sm-ring subunit. Characterized yeast SmG participates
      in the U1, U2, U4 and U5 snRNP scaffolds, and mutational interactions establish its functional contribution
      to spliceosome assembly and pre-mRNA splicing.
    supported_by:
    - reference_id: PMID:27417296
      supporting_text: 'A seven-subunit Sm protein ring forms a core scaffold of the U1, U2, U4, and U5

        snRNPs that direct pre-mRNA splicing.'
    - reference_id: PMID:27417296
      supporting_text: 'Tests of pairwise combinations of

        SmG, SmE, SmF, SmB, and SmD3 alleles highlighted the inherent redundancies

        within the Sm ring, whereby simultaneous mutations of the RNA binding sites of

        any two of the Sm subunits are lethal.'
