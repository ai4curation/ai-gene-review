id: P15937
gene_symbol: acu-8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  acu-8 encodes the Neurospora crassa member of the conserved fungal Ach1
  acetyl-CoA hydrolase/transferase family. Acu-8 is required for growth on
  acetate and acts in mitochondria as a succinyl-CoA:acetate CoA-transferase
  that links acetate with acetyl-CoA metabolism while retaining minor acetyl-CoA
  hydrolase activity.
existing_annotations:
- term:
    id: GO:0003986
    label: acetyl-CoA hydrolase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - CGD:CAL0000189008
  - PANTHER:PTN000484586
  - SGD:S000000111
  review:
    summary: PTN000484586 places acu-8 in the fungal Ach1 clade that inherited
      acetyl-CoA hydrolase activity.
    action: KEEP_AS_NON_CORE
    reason: Neurospora acu-8 has direct target evidence; an acetate-sensitive acu-8
      mutant is deficient in acetyl-CoA hydrolase and accumulates acetyl-CoA when
      supplied with acetate. Later fungal Ach1 work reclassified the family toward
      acetate CoA-transferase as the major in vivo activity, but S. cerevisiae Ach1p
      still has minor acetyl-CoA hydrolase activity. The PTN000484586 IBA is
      therefore consistent with the direct Neurospora phenotype and with fungal
      family biochemistry.
    additional_reference_ids:
    - PMID:1357077
    - PMID:19298859
    supported_by:
    - reference_id: PMID:1357077
      supporting_text: The mutant was shown to be deficient in acetyl-CoA hydrolase
        and to accumulate acetyl-CoA when supplied with acetate.
    - reference_id: PMID:19298859
      supporting_text: Ach1p showed highest specific activity for the CoASH transfer
        from succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
    propagation_review:
      root_cause: NO_FAILURE_NON_CORE
      source_entities:
      - source_id: PANTHER:PTN000484586
        source_status: SUPPORTS_TRANSFER
        comment: >-
          acu-8 falls under the PTHR43609 fungal Ach1 node whose seed data
          support acetyl-CoA hydrolase as a secondary conserved activity.
- term:
    id: GO:0003986
    label: acetyl-CoA hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:20289
  - EC:3.1.2.1
  review:
    summary: The Rhea/EC IEA to acetyl-CoA hydrolase activity agrees with direct
      acu-8 mutant evidence.
    action: KEEP_AS_NON_CORE
    reason: The GO:0003986 claim is supported by the classic Neurospora acu-8
      mutant, which is deficient in acetyl-CoA hydrolase after growth on acetate.
      Although the fungal Ach1 family is now understood to act primarily as acetate
      CoA-transferases, acetyl-CoA hydrolase activity remains experimentally
      observed and is appropriate to keep.
    additional_reference_ids:
    - PMID:1357077
    - PMID:19298859
    supported_by:
    - reference_id: PMID:1357077
      supporting_text: The mutant was shown to be deficient in acetyl-CoA hydrolase
        and to accumulate acetyl-CoA when supplied with acetate.
    - reference_id: PMID:19298859
      supporting_text: Ach1p showed highest specific activity for the CoASH transfer
        from succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0086
  review:
    summary: The UniProtKB-SubCell cytoplasm mapping is too broad for the fungal
      Ach1/acu-8 mitochondrial placement.
    action: MODIFY
    reason: S. cerevisiae Ach1p was localized mostly with mitochondria by
      subcellular fractionation and in mitochondria by immunofluorescence, and the
      more specific PTN000484602 PAINT node places mitochondrial activity in the
      Ascomycota. Review this broad cytoplasmic IEA as mitochondrion rather than
      retaining a nonspecific parent localization.
    proposed_replacement_terms:
    - id: GO:0005739
      label: mitochondrion
    additional_reference_ids:
    - PMID:12606555
    supported_by:
    - reference_id: PMID:12606555
      supporting_text: By subcellular fractionation, most of the Ach1p in yeast was
        distributed with mitochondria and little Ach1p in the cytoplasm.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - CGD:CAL0000189008
  - PANTHER:PTN000484602
  - SGD:S000000111
  - UniProtKB:Q5BD33
  review:
    summary: PTN000484602 places acu-8 in the Ascomycota subclade that inherited
      mitochondrial Ach1 activity.
    action: ACCEPT
    reason: The IBA is scoped to PTN000484602 rather than the whole CoA-transferase
      family, and Neurospora acu-8 falls in the same PTHR43609:SF1 fungal Ach1
      subfamily as the characterized S. cerevisiae and Candida ACH1 proteins. The
      experimentally observed S. cerevisiae Ach1p mitochondrial localization
      supports keeping this Ascomycota PAINT placement.
    additional_reference_ids:
    - PMID:12606555
    supported_by:
    - reference_id: PMID:12606555
      supporting_text: By immunofluorescence microscopy, we show that Ach1p and
        acetyl-CoA binding site-mutated constructs, but not its N-terminal deleted
        construct, are localized in mitochondria.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000484602
        source_status: SUPPORTS_TRANSFER
        comment: >-
          PTN000484602 places the mitochondrial localization on the Ascomycota
          branch, and acu-8 remains in the fungal Ach1 subfamily below that node.
- term:
    id: GO:0005739
    label: mitochondrion
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
