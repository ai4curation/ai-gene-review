- term:
    id: GO:0008410
    label: CoA-transferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003702
  review:
    summary: CoA-transferase activity is true but redundant with the accepted
      acetate CoA-transferase activity annotation.
    action: TOO_GENERAL
    reason: The fungal Ach1/Acu-8 family supports acetate as the physiologic
      acceptor for succinyl-CoA-dependent CoASH transfer. Because GO:0008775
      acetate CoA-transferase activity is accepted in this same review, the parent
      GO:0008410 CoA-transferase activity row is correct but uninformative.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:19298859
      supporting_text: Ach1p showed highest specific activity for the CoASH transfer
        from succinyl-CoA to acetate and only a minor acetyl-CoA-hydrolase activity.
- term:
    id: GO:0008775
    label: acetate CoA-transferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000484586
  - SGD:S000000111
  - UniProtKB:Q5BD33
  review:
    summary: PTN000484586 correctly propagates acetate CoA-transferase activity to
      Neurospora acu-8.
    action: ACCEPT
    reason: The IBA is placed at the same fungal Ach1 node that carries the older
      acetyl-CoA hydrolase and acetate-metabolism assertions. Re-characterization
      of S. cerevisiae Ach1p showed highest activity for CoASH transfer from
      succinyl-CoA to acetate, and there is no acu-8-specific evidence of loss or
      divergence from this family-level CoA-transferase activity.
    additional_reference_ids:
    - PMID:19298859
    supported_by:
    - reference_id: PMID:19298859
      supporting_text: Complementation of an ach1 mutant with the coaT gene
        reversed the growth defect on acetate confirming the in vivo function of
        Ach1p as a CoA-transferase.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000484586
        source_status: SUPPORTS_TRANSFER
        comment: >-
          PTN000484586 captures the conserved fungal Ach1 acetate
          CoA-transferase activity inherited by acu-8.
