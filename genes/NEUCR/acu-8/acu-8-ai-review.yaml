- term:
    id: GO:0006083
    label: acetate metabolic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - CGD:CAL0000189008
  - PANTHER:PTN000484586
  - SGD:S000000111
  review:
    summary: PTN000484586 correctly propagates acetate metabolism to Neurospora
      acu-8.
    action: ACCEPT
    reason: >-
      The process assertion matches target-specific evidence: Neurospora acu-8 was
      defined by an acetate-utilization phenotype, with acetate-sensitive mutant
      growth and defective acetyl-CoA hydrolase activity in acetate-grown cultures.
      Because acu-8 itself executes the acetyl-CoA/acetate interconversion reaction,
      this is participation in acetate metabolism rather than a substrate or upstream
      necessity effect.
    additional_reference_ids:
    - PMID:1357077
    - PMID:19298859
    supported_by:
    - reference_id: PMID:1357077
      supporting_text: An acu-8 mutant strain, previously characterized as acetate
        non-utilizing, shows strong growth-inhibition by acetate, but will use it
        as carbon source at low concentrations.
    - reference_id: PMID:19298859
      supporting_text: Saccharomyces cerevisiae and Neurospora crassa mutants
        defective in the so-called acetyl-CoA hydrolases Ach1p and Acu-8,
        respectively, display a severe growth defect on acetate, which is most
        strongly pronounced under acidic conditions.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000484586
        source_status: SUPPORTS_TRANSFER
        comment: >-
          The PAINT node carries the acetate-metabolism assertion on the same
          fungal Ach1 branch as the acetate CoA-transferase activity.
