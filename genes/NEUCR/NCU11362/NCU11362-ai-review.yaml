    summary: The curated ancestral assertion predicts mRNA methylation, but METTL16 substrate repertoires
      differ among eukaryotes.
    action: UNDECIDED
    reason: The curated ancestral assertion predicts mRNA methylation, but METTL16 substrate repertoires
      differ among eukaryotes. The verified fungal experiments establish U6 methylation and consequent
      mRNA splicing, which do not by themselves show methyl-group transfer to mRNA. Neurospora mRNA substrate
