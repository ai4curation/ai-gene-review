id: A7UX10
gene_symbol: NCU11362
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU11362 encodes the Neurospora crassa ortholog of METTL16, a nuclear S-adenosylmethionine-dependent
  RNA methyltransferase of the METTL16/RlmF family. By orthology with fission yeast Mtl16 and human METTL16,
  it is expected to install N6-methyladenosine in the conserved ACAGAGA box of U6 spliceosomal snRNA, the
  sequence that base-pairs with the 5' splice site of pre-mRNA introns. In fission yeast this U6 modification
  is needed for efficient splicing of a subset of introns. The 541-residue protein has a predicted disordered
  N-terminal extension, then a methyltransferase domain that retains the catalytic NPPF motif, then a C-terminal
  region aligned to that of fission yeast Mtl16. Methylation of mRNA targets, as reported for animal METTL16
  (for example regulation of SAM synthetase transcripts), has not been shown for any fungal ortholog. No
  experiments have been reported on the Neurospora protein itself.
