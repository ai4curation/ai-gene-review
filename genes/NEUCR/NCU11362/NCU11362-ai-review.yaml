suggested_questions:
- question: Does Neurospora crassa have any METTL16-dependent m6A outside U6 snRNA (for example on SAM
    synthetase transcripts), or is U6 the sole target as in fission yeast?
suggested_experiments:
- description: Delete NCU11362 and measure U6 snRNA m6A by RNA mass spectrometry, poly(A)+ RNA m6A levels,
    and intron retention by RNA-seq, compared with wild type.
