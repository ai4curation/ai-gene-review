- term:
    id: GO:0120048
    label: U6 snRNA (adenine(43)-N6)-methyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000333540
  - PomBase:SPAC27D7.08c
  - UniProtKB:Q86W50
  - WB:WBGene00014228
  review:
    summary: U6 snRNA ACAGA-box adenosine N6-methylation is the conserved METTL16 activity, shown directly
      for the fission yeast and human orthologs; this is the core activity of NCU11362.
    action: ACCEPT
    reason: PAINT placed this activity at the eukaryotic METTL16 node, with fission yeast, human and worm
      donors, so it is ancestral to fungi and inherited by NCU11362. Fission yeast Mtl16 has knockout, in
      vitro reconstitution and structural support for the reaction. NCU11362 aligns over the full Mtl16
      sequence and retains the NPPF catalytic motif. The label's position 43 is the human numbering; the
      homologous adenosine is A37 in S. pombe, and the Neurospora position has not been mapped.
    supported_by:
    - reference_id: PMID:34050143
      supporting_text: Loss of m6A in U6 snRNA isolated from SPAC27D7.08c knockout (mtl16Δ) cells.
    - reference_id: PMID:40841561
      supporting_text: 'The N6-methyladenosine (m6A) modification in U6 snRNA, catalyzed by METTL16

        using S-adenosylmethionine (SAM) as the methyl donor, is required for efficient

        and accurate pre-mRNA splicing.'
    - reference_id: PMID:29051200
      supporting_text: 'We demonstrate that METTL16 is

        responsible for N6-methylation of A43 of the U6 snRNA'
    - reference_id: file:NEUCR/NCU11362/NCU11362-bioinformatics/RESULTS-rereview.md
      supporting_text: The catalytic NPPF motif is retained at the aligned position.
