  review:
    summary: The U6 m6A installed by METTL16 sits in the ACAGA box that pairs with the 5' splice site, and
      its loss in fission yeast causes retention of a subset of introns; splicing is the process this enzyme
      serves.
    action: ACCEPT
    reason: PAINT placed this term at PTN000333540, the eukaryotic METTL16 node, seeded by fission yeast
      Mtl16 (PomBase IGI). NCU11362 descends from that node, and the alignment to Mtl16 covers 99.5% of the
      yeast protein with the catalytic NPPF motif at the aligned position (file:NEUCR/NCU11362/NCU11362-bioinformatics/RESULTS-rereview.md).
      The m6A in U6 contacts the intron during 5' splice site recognition, so the enzyme contributes a
      functional modification of a spliceosome component rather than acting only upstream. No target-specific
      evidence of loss.
    supported_by:
    - reference_id: PMID:34050143
      supporting_text: We found that a subset of introns was retained in mRNAs, indicating a splicing
        defect caused by loss of m6A in U6 snRNA.
    - reference_id: PMID:34050143
      supporting_text: This m6A faces the fourth position of the intron when the ACAGA box base-pairs with
        the 5′SS in the spliceosome B complexes
    - reference_id: file:NEUCR/NCU11362/NCU11362-bioinformatics/RESULTS-rereview.md
      supporting_text: The catalytic NPPF motif is retained at the aligned position.
- term:
    id: GO:0001734
    label: mRNA m(6)A methyltransferase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - MGI:MGI:1914743
  - PANTHER:PTN000333540
  - UniProtKB:Q86W50
  - WB:WBGene00014228
  review:
    summary: mRNA methylation by METTL16 is documented in animals (human MAT2A, worm SAM synthetase pre-mRNA),
      whereas the only characterised fungal ortholog, fission yeast Mtl16, has no detectable mRNA target;
      whether the Neurospora protein methylates any mRNA is unknown.
    action: UNDECIDED
    reason: PAINT placed this activity at PTN000333540, the eukaryotic METTL16 node, which is a considered
      judgement that mRNA methylation is ancestral to the clade; NCU11362 descends from that node. The donors
      are all animal (human METTL16, mouse Mettl16, worm METT-10), and fission yeast Mtl16, the experimentally
      characterised fungal member, was not used as a donor for this term. In S. pombe m6A is undetectable
      in poly(A)+ RNA and U6 is the sole Mtl16 target, so the property has been lost or never deployed
      in at least one fungal lineage. S. pombe (Taphrinomycotina) is not the target, however, and there
      are no Neurospora (Pezizomycotina) data on mRNA m6A or on METTL16-type hairpins in its SAM synthetase
      transcript. Neither the PAINT inference nor a fungus-wide loss can be confirmed from the available
      evidence, so the row is left undecided rather than demoted. It is not treated as a core activity;
      the supported activity is GO:0120048.
    supported_by:
    - reference_id: PMID:34050143
      supporting_text: we chose S. pombe as a model organism because m6A was undetectable in the poly(A)+
        RNA fraction (Supplementary Fig. 2) and the S. pombe MAT2a homolog sam1 contains no hairpin structures
        harboring the specific nonamer sequence targeted by METTL1669. Consequently, U6 snRNA m6A is the
        sole target for S. pombe Mtl16.
    - reference_id: PMID:29051200
      supporting_text: we observed crosslinking of METTL16 to the 3′ exon of the MAT2A pre‐mRNA
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN000333540
        source_status: UNRESOLVED
        comment: Eukaryotic METTL16 node (descendants include human, mouse, worm, Arabidopsis FIO1 and
          S. pombe Mtl16). mRNA methylation is supported in animal descendants and absent from the fission
          yeast descendant; its status in Pezizomycotina has not been tested.
      - source_id: UniProtKB:Q86W50
        source_status: UNRESOLVED
        comment: Human METTL16 methylates MAT2A mRNA hairpins; sound for the source, transfer to a fungus
          untested.
      - source_id: MGI:MGI:1914743
        source_status: UNRESOLVED
        comment: Mouse Mettl16; same vertebrate MAT2A-regulation context.
      - source_id: WB:WBGene00014228
        source_status: UNRESOLVED
        comment: Worm METT-10 methylates SAM synthetase pre-mRNA 3' splice sites; animal substrate, transfer
