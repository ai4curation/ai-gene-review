    in the ACAGAGA box of U6 snRNA in the nucleus; the modified U6 supports efficient 5' splice site recognition
    during pre-mRNA splicing. Inferred from the eukaryotic METTL16 PAINT node and fission yeast Mtl16 experiments.
  supported_by:
