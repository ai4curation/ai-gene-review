taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
status: COMPLETE
description: NCU11362 is a METTL16-family RNA N6-adenosine methyltransferase inferred to modify U6 snRNA
  using S-adenosylmethionine. The conserved U6 modification promotes accurate pre-mRNA splice-site recognition.
  U6 modification and its splicing role are inferred from the eukaryotic METTL16 PAINT node and fission
  yeast Mtl16 experiments; whether the Neurospora protein also methylates mRNA is unresolved.
