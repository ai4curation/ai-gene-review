  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
status: COMPLETE
description: NCU11362 is a METTL16-family RNA N6-adenosine methyltransferase inferred to modify U6 snRNA
  using S-adenosylmethionine. The conserved U6 modification promotes accurate pre-mRNA splice-site recognition.
  Nuclear RNA modification is strongly supported by fungal ortholog experiments; a distinct Neurospora
  mRNA methylation repertoire is unresolved.
