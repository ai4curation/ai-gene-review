- term:
    id: GO:0048315
    label: conidium formation
  evidence_type: IMP
  original_reference_id: PMID:15126394
  qualifier: acts_upstream_of_or_within
  review:
    summary: Proposed new annotation. Induction of macroconidiation is FL's defining role, yet GOA carries only
      generic electronic transcription-factor, zinc-binding and nuclear terms and no conidiation process term.
    action: NEW
    reason: Bailey-Shrode and Ebbole establish fl as necessary and sufficient to induce conidiophore development -
      raising fl expression from a heterologous promoter in a wild-type background induces conidiophores. The
      GOA set is entirely electronic (GO_REF) and captures only the generic machinery of transcription, leaving
      the process FL actually controls unannotated. GO:0048315 is the term core_functions already asserts for
      this gene, and the term GOA carries (IMP, acts_upstream_of_or_within) for the functionally analogous
      Aspergillus master regulators brlA and abaA reviewed in this module.
    supported_by:
    - reference_id: PMID:15126394
      supporting_text: The fl (fluffy) gene of Neurospora crassa encodes a binuclear zinc cluster protein that
        regulates the production of asexual spores called macroconidia.
    - reference_id: PMID:15126394
      supporting_text: Increasing expression of fl from a heterologous promoter in a wild-type genetic background
        is sufficient to induce conidiophore development.
