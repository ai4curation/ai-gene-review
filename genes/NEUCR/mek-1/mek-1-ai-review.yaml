  review:
    summary: MEK-1 is the middle kinase of the experimentally characterized MIK-1–MEK-1–MAK-1 cascade.
    action: ACCEPT
    reason: MEK-1 is the middle kinase of the experimentally characterized MIK-1–MEK-1–MAK-1 cascade.
      The broad MAPK cascade annotation is correct but less informative than the cell integrity cascade
      assignment.
    supported_by:
    - reference_id: PMID:18849472
      supporting_text: The MAK-1 MAPK was not phosphorylated in Δ mik-1 and Δ mek-1 mutants, consistent
        with the involvement of MIK-1, MEK-1, and MAK-1 in the same signaling cascade.
    - reference_id: PMID:41071819
      supporting_text: In a first step, we confirmed the accumulation of the kinase MAK-1 at the contact
        sites and showed the same localization pattern for both its upstream kinases (Fig 7).
