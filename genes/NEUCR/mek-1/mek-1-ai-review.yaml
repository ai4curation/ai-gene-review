  review:
    summary: 'EC 2.7.11.24 (MAP kinase) mapping is wrong for this protein: MEK-1 is the MAPKK upstream of the MAPK
      MAK-1, not itself a MAP kinase.'
    action: REMOVE
    reason: 'Full re-review (2026-10-21): this is a demonstrably wrong EC-to-GO mapping, so REMOVE rather than MODIFY.
      EC 2.7.11.24 reached the record only through ARBA-assigned catalytic-activity lines (ARBA00048130/ARBA00047919).
      GO:0004707 MAP kinase activity defines the MAPK tier (a kinase that is itself activated by MAPKK phosphorylation
      of a TXY motif); MEK-1 is the MAPKK that acts upstream of the MAPK MAK-1, belongs to the STE7/MAP kinase kinase
      family (InterPro IPR050915), and lacks the CMGC MAPK fold and TXY activation motif. GO:0004708 is not an is_a
      descendant of GO:0004707, so this is not a refinement; the correct activity is already carried by this gene
      on independent IBA and Compara rows.'
    supported_by:
    - reference_id: PMID:18849472
      supporting_text: The MAK-1 MAPK was not phosphorylated in Δ mik-1 and Δ mek-1 mutants, consistent with the
        involvement of MIK-1, MEK-1, and MAK-1 in the same signaling cascade.
