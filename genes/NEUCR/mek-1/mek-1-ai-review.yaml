  review:
    summary: Compara transfer of a S. pombe Pek1-specific regulatory role in calcium/calcineurin signalling; no
      Neurospora evidence.
    action: UNDECIDED
    reason: The relationship to Pek1 is a true subfamily orthology, but this term reflects S. pombe-specific cross-talk
      between the Pmk1 cascade and calcineurin signalling. In Neurospora, loss of mek-1 did not alter sensitivity
      to the calcineurin inhibitor FK506, which provides no support (though does not refute) a conserved positive
