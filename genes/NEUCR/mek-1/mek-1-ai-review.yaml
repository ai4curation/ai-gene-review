id: Q7RYZ6
gene_symbol: mek-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: MEK-1 (NCU06419) is the MAP kinase kinase (MAPKK) of the Neurospora crassa MIK-1/MEK-1/MAK-1 cell wall
  integrity (CWI) MAPK cascade, orthologous to Saccharomyces cerevisiae Mkk1/Mkk2 and Schizosaccharomyces pombe
  Pek1/Skh1. It is a cytoplasmic serine/threonine/tyrosine (dual-specificity) protein kinase with a disordered N-terminal
  region (residues 1-142) and a C-terminal kinase domain (221-491) that retains the ATP-binding lysine and catalytic
  aspartate. MEK-1 is required for phosphorylation (activation) of the MAPK MAK-1. Loss of mek-1 reduces hyphal
  extension, abolishes macroconidiation and protoperithecium formation, weakens the cell wall (increased sensitivity
  to lytic enzymes and autolysis), derepresses tyrosinase expression under nitrogen starvation, and blocks germling
  (conidial anastomosis tube) fusion. Functional MEK-1-GFP accumulates, together with MIK-1 and MAK-1, at the contact
  sites of fusing germlings.
