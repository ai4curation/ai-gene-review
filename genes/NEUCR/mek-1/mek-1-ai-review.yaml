suggested_questions:
- question: Does MEK-1 directly phosphorylate both the Thr and Tyr of the MAK-1 TEY activation motif, and does MIK-1
    phosphorylate the MEK-1 activation loop?
- question: Is the S. pombe Pek1 link to calcium/calcineurin signalling and division-septum localization conserved
    for Neurospora MEK-1, given that Δmek-1 is not FK506-hypersensitive?
suggested_experiments:
- description: In vitro kinase assay with purified MEK-1 (wild type and K250R) and kinase-dead MAK-1 substrate,
    with phospho-site mapping of the TEY motif.
- description: Live imaging of functional MEK-1-GFP in mature hyphae to test for septal accumulation.
