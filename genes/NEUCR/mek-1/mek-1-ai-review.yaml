id: Q7RYZ6
gene_symbol: mek-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: MEK-1 is the MAP kinase kinase of the Neurospora crassa MIK-1–MEK-1–MAK-1 signaling module.
  It is required for MAK-1 phosphorylation and helps control cell wall integrity, vegetative growth, asexual
  development and sexual differentiation. MEK-1 also accumulates at the contact sites of fusing germlings,
  linking this signaling module to local remodeling during cell fusion.
