status: COMPLETE
description: NCU08990 encodes eL39, a small basic structural protein of the cytosolic large ribosomal
  subunit. It is present in the experimentally determined Neurospora 80S ribosome and participates in
  cytoplasmic protein synthesis. Characterized fungal eL39 contributes to ribosome integrity and translational
  accuracy.
