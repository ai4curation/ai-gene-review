taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: NCU08990 encodes Neurospora crassa eL39 (60S ribosomal protein L39), a 51-residue, highly
  basic structural protein of the cytosolic large ribosomal subunit. It is resolved as chain n1 in the
  cryo-EM structure of actively translating Neurospora 80S ribosomes (PDB 7R81). In the assembled large
  subunit eL39 lies in the polypeptide exit tunnel region; the orthologous budding-yeast protein is dispensable
  for viability but required for normal translational fidelity, resistance to paromomycin, normal subunit
  balance and growth in the cold. The protein therefore functions as a structural constituent of the
  cytoplasmic ribosome that contributes to the accuracy of cytoplasmic translation; like other ribosomal
  proteins it is assembled into the subunit while it is still a nuclear preribosome.
