  review:
    summary: eL39 is assembled into the large ribosomal subunit before mature cytoplasmic translation.
    action: ACCEPT
    reason: eL39 is assembled into the large ribosomal subunit before mature cytoplasmic translation.
      The curated fungal orthology transfer to a preribosome is consistent with this conserved assembly
      route; the target mature structure corroborates ribosomal identity but is not itself a direct preribosome
      assay.
