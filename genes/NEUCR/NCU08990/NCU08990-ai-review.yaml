  review:
    summary: PAINT ancestral node PTN000463054 (PTHR19970) asserts cytoplasmic translation for eL39; NCU08990
      is in the same PANTHER subfamily (SF0) as the human and yeast donors and is a resolved chain of the
      translating Neurospora 80S ribosome.
    action: ACCEPT
    reason: As a structural ribosomal protein eL39 does part of the work of translation (it is a component
      of the machine that performs it), so participation, not mere necessity, is established. Q7S2X9 carries
      the eL39 signatures (IPR000077, PF00832), is placed in PTHR19970:SF0 together with human RPL39 (P62891)
      and yeast RPL39 (P04650), and is mapped by UniProt to chain n1 of the Neurospora translating-ribosome
      cryo-EM structure 7R81. The yeast ortholog deletion shows a direct effect on translational accuracy.
      The PAINT spermatogenesis assertion on the eutherian RPL39L node (PTN004522638) was deliberately not
      placed at the root and is correctly not propagated to fungi.
