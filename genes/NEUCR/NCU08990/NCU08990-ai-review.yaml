  qualifier: part_of
  supporting_entities:
  - UniProtKB:P05767
  - PomBase:SPCC663.04.1:pep
  review:
    summary: Ensembl Compara transfer from S. pombe rpl39 (P05767, PTHR19970:SF0). Plausible, since ribosomal
      proteins are incorporated into nuclear pre-60S particles, but it describes a transient assembly state,
      not the site of the protein's function.
    action: KEEP_AS_NON_CORE
    reason: The orthology is sound (P05767 and Q7S2X9 are both in PTHR19970:SF0), and ribosomal proteins
      are incorporated during subunit assembly, so membership of a pre-60S particle is expected. No Neurospora
      preribosome experiment exists, and the donor annotation reflects assembly intermediates rather than
      eL39's function, which is exerted in the mature cytoplasmic ribosome. Kept as a non-core location.
    supported_by:
    - reference_id: file:NEUCR/NCU08990/NCU08990-uniprot.txt
      supporting_text: DR   PANTHER; PTHR19970:SF0; LARGE RIBOSOMAL SUBUNIT PROTEIN EL39; 1.
