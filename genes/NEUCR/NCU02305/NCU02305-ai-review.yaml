taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  Neurospora crassa NCU02305 encodes a predicted mitochondrial trans-prenyl
  diphosphate synthase in the PTHR12001 SF69 CoQ-side-chain branch. It is the
  likely CoQ polyprenyl diphosphate synthase for ubiquinone biosynthesis,
  elongating an allylic prenyl diphosphate primer with IPP to produce the
  Neurospora ubiquinone side-chain precursor.
