suggested_questions:
- question: What is the all-trans polyprenyl diphosphate chain length produced by NCU02305 in vitro and in vivo?
- question: Does Neurospora NCU02305 act alone or with a PDSS2/Dlp1-like partner?
suggested_experiments:
- hypothesis: NCU02305 is the mitochondrial polyprenyl diphosphate synthase that sets Neurospora's CoQ tail length.
  description: >-
    Purify NCU02305 with candidate partner proteins and assay radiolabeled IPP
    incorporation with FPP while measuring product chain lengths by LC-MS/MS;
    compare with ubiquinone-tail profiles in NCU02305-depleted Neurospora.
  experiment_type: in vitro enzymology / targeted lipidomics
