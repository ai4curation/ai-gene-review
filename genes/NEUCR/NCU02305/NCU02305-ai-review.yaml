  qualifier: involved_in
  supporting_entities:
  - UniProtKB:O43091
  - PomBase:SPBPJ4664.01.1:pep
  review:
    summary: >-
      EnsemblFungi transfer from S. pombe dps1. CoQ side-chain synthases use
      FPP as an allylic primer for longer-chain synthesis, and no evidence was
      found that NCU02305 contributes to cytosolic FPP biosynthesis.
    action: REMOVE
    source_defects:
    - defect_type: WRONG_TERM
      resource: ENSEMBL
      slot: GO term
      requested_change: DELETE_ROW
      asserted_value: GO:0045337
      confidence: PROBABLE
      explanation: >-
        The EnsemblFungi transfer from S. pombe dps1 asserts that NCU02305 is
        involved in trans, trans-farnesyl diphosphate biosynthesis. NCU02305 is
        a mitochondrial PTHR12001:SF69 CoQ-side-chain synthase candidate that
        should use FPP as an allylic primer for longer-chain polyprenyl
        diphosphate synthesis rather than synthesize FPP.
      supported_by:
      - reference_id: file:NEUCR/NCU02305/NCU02305-uniprot.txt
        record_section: ["DR:PANTHER"]
        supporting_text: PANTHER; PTHR12001:SF69; ALL TRANS-POLYPRENYL-DIPHOSPHATE SYNTHASE PDSS1; 1.
