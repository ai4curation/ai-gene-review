taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa (strain ATCC 24698 / 74-OR23-1A / CBS 708.71 / DSM 1257 / FGSC 987)
description: acon-2 (aconidiate-2, NCU00478) encodes a cyclic-nucleotide (cAMP) phosphodiesterase that
  hydrolyzes cyclic nucleotides and negatively regulates cAMP/PKA signaling in Neurospora crassa. It acts
  upstream of the fluffy (FL) master regulator and is required for normal induction of conidiation; acon-2
  loss-of-function blocks macroconidiation (aconidiate phenotype), and elevated FL expression can bypass
  the acon-2 defect. acon-2 links nutrient/cAMP signal transduction to the FL-driven conidiation program.
existing_annotations:
- term:
    id: GO:0004115
    label: 3',5'-cyclic-AMP phosphodiesterase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: 'Accept: 3'',5''-cyclic-AMP phosphodiesterase activity.'
    action: ACCEPT
    reason: 'The family-level catalytic assignment, and the one that explains the biology: hydrolysing cAMP lowers
      PKA output and permits conidiation. The cAMP-specific term is preferable to the unsigned-substrate parent.'
- term:
    id: GO:0047555
    label: 3',5'-cyclic-GMP phosphodiesterase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  review:
    summary: 'Accept: 3'',5''-cyclic-GMP phosphodiesterase activity.'
    action: ACCEPT
    reason: Dual substrate specificity is common in this phosphodiesterase clade, but no cGMP assay for ACON-2 is
      cited here and cGMP signalling is poorly established in Neurospora. Kept as a phylogenetic inference rather
      than a demonstrated activity.
- term:
    id: GO:0141162
    label: negative regulation of cAMP/PKA signal transduction
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  review:
    summary: 'Accept: negative regulation of cAMP/PKA signal transduction.'
    action: ACCEPT
    reason: 'The signed process term that matches the enzymology: degrading cAMP attenuates PKA signalling. The
      most informative process statement for ACON-2.'
- term:
    id: GO:0004114
    label: 3',5'-cyclic-nucleotide phosphodiesterase activity
  evidence_type: IEA
