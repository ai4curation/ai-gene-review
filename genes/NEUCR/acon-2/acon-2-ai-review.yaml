- term:
    id: GO:0008081
    label: phosphoric diester hydrolase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: 'Accept: phosphoric diester hydrolase activity.'
    action: ACCEPT
    reason: The chemistry-level parent of phosphodiesterase activity; retained as an ancestor term, uninformative
      on its own.
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: enables
  review:
    summary: 'Accept: metal ion binding.'
    action: ACCEPT
    reason: Class I phosphodiesterase catalytic domains carry a binuclear metal centre, so metal binding here is
      a genuine cofactor requirement rather than a spurious keyword match.
- term:
    id: GO:0075307
    label: positive regulation of conidium formation
  evidence_type: IMP
  original_reference_id: PMID:15126394
  qualifier: acts_upstream_of_or_within
  review:
    summary: Proposed new annotation. GOA captures ACON-2's enzymology and its cAMP/PKA signalling role but not
      the developmental process that enzymology gates, which is the reason the gene was isolated.
    action: NEW
    reason: acon-2 is an aconidiate mutant that requires an inducing signal to develop - elevated fl expression
      restores development of the acon-2 mutant only in nitrogen-starved cultures - and acon-2 contributes to
      the developmental induction of fl, placing it upstream of the master regulator. The existing
      GO:0141162 row records the signalling mechanism; this term records the process that mechanism serves.
      The signed term is used rather than the unsigned GO:0048315 because the direction is established -
      loss of acon-2 blocks macroconidiation and ACON-2 contributes to fl induction, so it is a positive
      regulator, not an executor of conidium formation. This matches how this review set treats the other
      upstream regulators (flbB, flbD as GO:0075307; fadA as GO:0075308), and leaves the unsigned
      GO:0048315 to the master executors fl, brlA and abaA.
    supported_by:
    - reference_id: PMID:15126394
      supporting_text: Two other genes, acon-2 and acon-3, play major roles in controlling development.
    - reference_id: PMID:15126394
      supporting_text: fl is induced specifically in differentiating tissue during conidiation and acon-2 plays
        a role in this induction.
    - reference_id: PMID:15126394
      supporting_text: Elevated expression of fl leads to induction of development of the acon-2 mutant in
        nitrogen-starved cultures, but does not bypass the conidiation defect of the acon-3 mutant.
