- id: PMID:10340846
  title: The structure of the vacuolar ATPase in Neurospora crassa.
  findings:
  - statement: Margolles-Clark et al. describe the Neurospora vacuolar ATPase as
      an ATP-driven proton pump in the vacuolar membrane and report structural
      analysis of a multi-subunit V-type ATPase.
    supporting_text: >-
      The ATP-driven proton pump in the vacuolar membrane is a typical V-type
      ATPase. We examined the size and structure of this enzyme using radiation
      inactivation and electron microscopy. The vacuolar ATPase is a large and
      complex enzyme, which appears to contain at least thirteen different types
      of subunits.
    reference_section_type: ABSTRACT
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed record PMID:10340846 resolves to the cited 1999
      Neurospora vacuolar ATPase structure/subunit review.
