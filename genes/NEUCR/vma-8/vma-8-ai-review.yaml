id: O59941
gene_symbol: vma-8
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: vma-8 encodes the conserved V-type proton ATPase subunit D, a
  V1-sector component of the vacuolar ATPase. Together with subunit F, subunit D
  forms the central rotor stalk that transmits torque from the catalytic V1 A/B
  hexamer to the membrane V0 c-ring, supporting ATP-driven proton pumping and
  vacuolar acidification at the cytosolic face of fungal vacuolar membranes.
