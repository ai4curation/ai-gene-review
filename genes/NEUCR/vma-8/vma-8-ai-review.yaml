  title: UniProtKB O59941 flat-file record for Neurospora crassa vma-8
  findings:
  - statement: UniProt classifies O59941 as V-ATPase subunit D and a peripheral
      V1-sector component of the vacuolar ATPase.
    supporting_text: >-
      FUNCTION: Subunit of the V1 complex of vacuolar(H+)-ATPase (V-ATPase), a
      multisubunit enzyme composed of a peripheral complex (V1) that hydrolyzes
      ATP and a membrane integral complex (V0) that translocates protons
      (By similarity). V-ATPase is responsible for acidifying and maintaining
      the pH of intracellular compartments (By similarity).
    reference_section_type: OTHER
  - statement: UniProt places O59941 at the vacuole membrane and records
      membership in the V-ATPase D subunit family.
    supporting_text: >-
      SUBCELLULAR LOCATION: Vacuole membrane...Peripheral membrane protein...SIMILARITY:
      Belongs to the V-ATPase D subunit family.
    reference_section_type: OTHER
