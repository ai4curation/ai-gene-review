id: Q870Q4
gene_symbol: apg-13
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: apg-13 encodes the Neurospora crassa ortholog of Mon1, a conserved MON1/SAND-family trafficking protein that is expected to function with Ccz1 on endosomal and fungal-type vacuole membranes as part of the Mon1-Ccz1 complex that promotes Rab7/Ypt7-dependent vesicle fusion with the vacuole during vacuolar protein targeting, autophagy-related delivery, and endocytic trafficking.
existing_annotations:
- term:
    id: GO:0000329
    label: fungal-type vacuole membrane
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - PANTHER:PTN000989606
  - SGD:S000003092
  review:
    summary: The fungal PAINT node PTN000989606 assigns the vacuolar membrane localization to the PTHR13027:SF7 fungal Mon1 clade containing N. crassa apg-13, which is the expected membrane compartment for Mon1-Ccz1-mediated fusion of incoming vesicles with fungal vacuoles.
    action: ACCEPT
    reason: Accept. The N. crassa protein is in the fungal PTHR13027:SF7 Mon1 subfamily, and the PTN000989606 PAINT assertion is seeded from the experimentally characterized Saccharomyces cerevisiae MON1 gene rather than from pairwise transfer. S. cerevisiae Mon1 acts in a stable Ccz1-Mon1 complex that peripherally associates with a perivacuolar compartment and can attach to the vacuole membrane during the late fusion step. More recent filamentous-fungal work on FgMon1 also supports conserved vacuolar localization and vacuole-fusion biology in the Sordariomycetes.
    additional_reference_ids:
    - PMID:12364329
    - PMID:26657788
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: Microscopy of Ccz1 and Mon1 tagged with a fluorescent marker indicated that the Ccz1-Mon1 complex peripherally associated with a perivacuolar compartment and may attach to the vacuole membrane in agreement with their proposed function in fusion.
    - reference_id: file:NEUCR/apg-13/apg-13-uniprot.txt
      supporting_text: PANTHER; PTHR13027; SAND PROTEIN-RELATED; 1.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000989606
        source_status: SUPPORTS_TRANSFER
        comment: Fungal PTN seeded by S. cerevisiae MON1; the node contains the Neurospora PTHR13027:SF7 Mon1 ortholog and supports inheritance of fungal vacuole-membrane localization.
- term:
    id: GO:0005085
    label: guanyl-nucleotide exchange factor activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - FB:FBgn0031640
  - PANTHER:PTN000315021
  - SGD:S000003092
  review:
    summary: The broad PTHR13027 PAINT GEF assignment captures the conserved Mon1 contribution to Rab7/Ypt7 activation by the Mon1-Ccz1 complex.
    action: ACCEPT
    reason: Accept. The qualifier is important, because Mon1 is a subunit that contributes to the Rab7/Ypt7 GEF activity of the Mon1-Ccz1 complex rather than a standalone exchange factor. The PANTHER node PTN000315021 spans eukaryotic Mon1/SAND proteins and includes fungal and animal experimental seeds; nothing in the Neurospora sequence or fungal subfamily placement suggests loss of this core complex role.
    additional_reference_ids:
    - PMID:26657788
    supported_by:
    - reference_id: PMID:26657788
      supporting_text: FgMon1 likely acts as a GEF of FgRab7 and constitutively activated FgRab7 was able to rescue the defects of the ∆Fgmon1 mutant.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000315021
        source_status: SUPPORTS_TRANSFER
        comment: Eukaryotic Mon1/SAND PAINT node; the target is a fungal Mon1 member with no evidence for divergence from the conserved Rab7/Ypt7-directed activity of the Mon1-Ccz1 complex.
