      supporting_text: >-
        Accordingly, both deletion strains had kinetic defects in the
        biosynthetic delivery of resident vacuolar hydrolases through the CPY,
        ALP, and MVB pathways.
- term:
    id: GO:0032585
    label: multivesicular body membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0175
  review:
    summary: Endosomal and MVB membrane association is plausible for Neurospora Mon1, but this SubCell-derived row is inferred from characterized orthologs rather than demonstrated in N. crassa.
    action: KEEP_AS_NON_CORE
    reason: Keep as non-core. Yeast Mon1-Ccz1 is found at perivacuolar prevacuolar/endosomal membranes before vacuole fusion, and UniProt projects an MVB membrane location to the Neurospora homolog. Because the direct N. crassa localization has not been assayed, the inferred MVB membrane location should be retained as a conserved secondary location rather than elevated above the fungal-type vacuole membrane PAINT row.
    additional_reference_ids:
    - PMID:12364329
    supported_by:
    - reference_id: file:NEUCR/apg-13/apg-13-uniprot.txt
      supporting_text: "SUBCELLULAR LOCATION: Endosome, multivesicular body membrane"
- term:
    id: GO:0006914
    label: autophagy
  evidence_type: ISS
  review:
    summary: Propose autophagy as a conserved route that uses the fungal Mon1-Ccz1/Ypt7 fusion module.
    action: NEW
    reason: Although apg-13 lacks a direct N. crassa GOA autophagy row, Mon1 is the Rab7/Ypt7-activating subunit of the Mon1-Ccz1 complex that promotes fusion of autophagosomes with the vacuole. S. cerevisiae MON1 is experimentally required for autophagy, and filamentous-fungal Mon1 deletions in Fusarium graminearum and Valsa mali disrupt vacuole fusion and autophagy, supporting a conservative new autophagy annotation for the N. crassa ortholog.
    additional_reference_ids:
    - PMID:12364329
    - PMID:26657788
    - PMID:35793146
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: The mon1Delta and ccz1Delta strains also displayed defects in autophagy and pexophagy, degradative pathways that share protein machinery and mechanistic features with the biosynthetic Cvt pathway.
    - reference_id: PMID:26657788
      supporting_text: We concluded that the fusion of autophagosomes and vacuoles was impaired in the ΔFgmon1 mutant.
    - reference_id: PMID:35793146
      supporting_text: Cytological examination revealed that the ∆VmMon1 and ∆VmCcz1 mutants were impaired in vacuole fusion and autophagy.
