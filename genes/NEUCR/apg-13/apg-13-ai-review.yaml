  review:
    summary: The Opisthokonta PTN000315023 PAINT node supports inheritance of Mon1-Ccz1 complex membership by fungal Mon1 proteins including N. crassa apg-13.
    action: ACCEPT
    reason: Accept. The source node has multiple experimental descendants across opisthokonts and predates the fungal Mon1 radiation, and the N. crassa apg-13 product is an intact PTHR13027:SF7 Mon1 homolog. Direct S. cerevisiae experiments showed that Mon1 and Ccz1 physically interact as a stable Ccz1-Mon1 complex, supporting this as a conserved complex annotation rather than a lineage-specific fungal prediction.
    additional_reference_ids:
    - PMID:12364329
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: Subcellular fractionation and co-immunoprecipitation experiments confirm that Mon1 and Ccz1 physically interact as a stable protein complex termed the Ccz1-Mon1 complex.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000315023
        source_status: SUPPORTS_TRANSFER
        comment: Opisthokonta PAINT node with experimental descendants from fungi, animals, and nematode; it covers N. crassa apg-13 as a fungal Mon1/SAND-family member.
