suggested_questions:
- question: Has N. crassa NCU09220/apg-13 been directly localized at endosomes, MVBs, or fungal-type vacuole membranes, or are all current localization statements inferred from fungal orthologs?
- question: Has the Neurospora Mon1 ortholog been tested biochemically or genetically with its Ccz1 and Rab7/Ypt7 partners to verify complex formation and GEF contribution?
suggested_experiments:
- description: Endogenously tag N. crassa apg-13/NCU09220 and compare its localization with vacuole, multivesicular body, and Rab7 markers during vegetative growth and starvation-induced autophagy.
- description: Delete or deplete apg-13/NCU09220 and assay FM4-64 uptake, vacuole morphology, autophagosome-vacuole fusion, and rescue by wild-type versus interaction-defective Mon1 alleles.
