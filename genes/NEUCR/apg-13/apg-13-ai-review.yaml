- id: PMID:26657788
  title: FgMon1, a guanine nucleotide exchange factor of FgRab7, is important for vacuole fusion, autophagy and plant infection in Fusarium graminearum.
  findings:
  - statement: Fusarium FgMON1 encodes a Mon1 trafficking protein conserved among filamentous fungi, including Neurospora crassa.
    supporting_text: FgMON1 encodes a 601 amino acid (aa) protein with a well conserved trafficking protein domain Mon1 from resides 170 to 601.
    reference_section_type: RESULTS
    full_text_unavailable: false
  - statement: FgMon1 localized in the cytosol and to vacuoles and was required for vacuole fusion and normal endocytosis.
    supporting_text: Fragmentized vacuoles were observed in the mutant compared to normal intact vacuoles in the wild type and complemented transformant
    reference_section_type: RESULTS
    full_text_unavailable: false
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: PubMed-verified filamentous ascomycete ortholog study; useful corroboration for conservation, but not a direct assay of N. crassa Q870Q4.
