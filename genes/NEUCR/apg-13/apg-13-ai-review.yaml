  review:
    summary: The InterPro longin-domain mappings correctly recognize that Mon1 proteins act in vesicle-mediated endomembrane traffic, but the term is broader than the vacuole-directed trafficking role captured by PAINT.
    action: MODIFY
    reason: Modify to GO:0032511 late endosome to vacuole transport via multivesicular body sorting pathway. The three longin-like domain signatures support membership in the broader FUZ/MON1/HPS1 family, but GO:0016192 is too broad for fungal Mon1. The supported descendant captures Mon1-Ccz1 action on the endolysosomal route that delivers MVB cargo to the vacuole.
