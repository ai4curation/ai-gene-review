- term:
    id: GO:0006623
    label: protein targeting to vacuole
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000989606
  - SGD:S000003092
  review:
    summary: The fungal PTN000989606 PAINT assignment reflects Mon1's inherited role at a late vesicle-fusion step needed for protein delivery to the vacuole.
    action: ACCEPT
    reason: Accept. The PTN000989606 IBD is placed over the fungal Mon1 clade, with S. cerevisiae MON1 as experimental seed, and transfers to the N. crassa ortholog in the same PTHR13027:SF7 subfamily. The seed paper demonstrated that Mon1 is required after vesicle formation for delivery of vacuolar cargoes in several routes that converge on the vacuole, making the GO:0006623 process term an appropriate core process for fungal Mon1.
    additional_reference_ids:
    - PMID:12364329
    supported_by:
    - reference_id: PMID:12364329
      supporting_text: Mon1 and Ccz1 were identified from a gene deletion library as mutants defective in the vacuolar import of aminopeptidase I (Ape1) via the cytoplasm to vacuole targeting (Cvt) pathway.
    propagation_review:
      root_cause: NO_FAILURE_CORE
      source_entities:
      - source_id: PANTHER:PTN000989606
        source_status: SUPPORTS_TRANSFER
        comment: Fungal PAINT node seeded by S. cerevisiae MON1; the source evidence supports a late Mon1 role in vacuolar protein targeting and the Neurospora target remains within the fungal Mon1 clade.
