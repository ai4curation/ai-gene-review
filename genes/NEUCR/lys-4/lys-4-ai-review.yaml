id: Q7SFX6
gene_symbol: lys-4
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:367110
  label: Neurospora crassa OR74A
description: >-
  lys-4 encodes the Neurospora crassa saccharopine dehydrogenase
  [NAD(+), L-lysine-forming], a fungal LYS1/lys3-family enzyme that catalyzes
  the final alpha-aminoadipate-pathway step of L-lysine biosynthesis. The
  predicted cytoplasmic enzyme cleaves L-saccharopine with NAD(+) and water to
  produce L-lysine, 2-oxoglutarate, NADH, and a proton.
existing_annotations:
- term:
    id: GO:0003729
    label: mRNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: enables
  supporting_entities:
  - UniProtKB:P38998
  - sgd:YIR034C
  review:
    summary: >-
      This Ensembl Compara row transfers a budding-yeast LYS1 mRNA-binding
      annotation that is not a conserved saccharopine dehydrogenase function.
    action: REMOVE
    reason: >-
      The source row traces to S. cerevisiae LYS1, and the yeast RNA-binding
      study itself frames Lys1 as one of the unusual enzymes recovered in a
      proteome-wide search rather than as a core RNA-binding protein. Q7SFX6 is
      instead an intact PTHR11133:SF23 NAD(+), L-lysine-forming saccharopine
      dehydrogenase. The PAINT family places the conserved fungal function in
      L-lysine biosynthesis on the LYS1/lys3 branch and does not support
      conserved mRNA binding, so this yeast moonlighting observation should not
      be transferred automatically to Neurospora lys-4.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
        - SOURCE_EVIDENCE_WEAK
      source_entities:
        - source_id: UniProtKB:P38998
          source_label: LYS1 Scer
          source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
          comment: >-
            S. cerevisiae LYS1 is the correct enzymatic ortholog, but its
            mRNA-binding annotation is not a conserved feature of the fungal
            LYS1 branch.
        - source_id: sgd:YIR034C
          source_label: LYS1
          source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
          comment: >-
            SGD:YIR034C is the same budding-yeast donor; the direct yeast
            mRNA-binding observation is unsafe to propagate to Neurospora
            lys-4.
    additional_reference_ids:
      - PMID:20844764
      - file:interpro/panther/PTHR11133/PTHR11133-entries.csv
      - file:interpro/panther/PTHR11133/PTHR11133-paint.tsv
    supported_by:
      - reference_id: PMID:20844764
        supporting_text: With the exception of Gis2 and Lys1, the novel RBPs described in this work have
          no known RNA binding domains
