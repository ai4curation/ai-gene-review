    summary: >-
      The eukaryotic PTN000123605 IBA correctly recognizes a saccharopine
      dehydrogenase, but the target lies in the exact NAD(+),
      L-lysine-forming fungal LYS1 branch.
    action: MODIFY
    reason: >-
      PTN000123605 is not a bad PAINT node: it is a broad eukaryotic
      saccharopine dehydrogenase node seeded by both fungal reciprocal enzymes
      and by plant, metazoan, and Candida family members. For Q7SFX6 the term is
      too generic because the PANTHER member table places lys-4 in
      PTHR11133:SF23, with S. cerevisiae LYS1, C. albicans LYS1, and S. pombe
      lys3, and GOA already contains the exact GO:0004754 activity.
    proposed_replacement_terms:
      - id: GO:0004754
        label: saccharopine dehydrogenase (NAD+, L-lysine-forming) activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
        - GRANULARITY_MISMATCH
      source_entities:
        - source_id: PANTHER:PTN000123605
          source_label: PANTHER:PTN000123605
          source_status: SUPPORTS_TRANSFER
          comment: >-
            The eukaryotic node supports generic saccharopine dehydrogenase
            activity, but Q7SFX6 is in the more specific NAD(+),
            L-lysine-forming SF23 branch.
