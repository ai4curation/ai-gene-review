id: Q9AGP8
gene_symbol: dmg
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1665
  label: Arthrobacter globiformis
description: Dimethylglycine oxidase from Arthrobacter globiformis NRRL B-2979 is a soluble, covalently
  FAD-bound enzyme that oxidatively demethylates N,N-dimethylglycine to sarcosine using molecular oxygen.
  Its N-terminal oxidase region and C-terminal tetrahydrofolate-reacting region cooperate through an internal
  cavity to transfer the removed one-carbon unit into 5,10-methylenetetrahydrofolate, while generating
  hydrogen peroxide. Without sufficient tetrahydrofolate or with impaired coupling, hydrolysis of the
  reactive intermediate releases formaldehyde. This bifunctionality joins amine oxidation to folate chemistry;
  the enzyme does not oxidize the sarcosine product.
