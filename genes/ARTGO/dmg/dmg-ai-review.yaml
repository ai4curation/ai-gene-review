core_functions:
- description: Uses oxygen to oxidize dimethylglycine and channels the reactive one-carbon intermediate
    to tetrahydrofolate, producing sarcosine, 5,10-methylenetetrahydrofolate and hydrogen peroxide when
    folate coupling is effective.
  proposed_molecular_function: tetrahydrofolate-coupled dimethylglycine oxidase activity
  supported_by:
  - reference_id: PMID:12912903
    supporting_text: in the presence of THF, 5,10-methylene-THF is formed at the expense of formaldehyde
  - reference_id: PMID:12912903
    supporting_text: uses molecular oxygen rather than ETF
  - reference_id: PMID:19369258
    supporting_text: uncoupling of the active sites could be achieved by mutagenesis or deletion
- description: Catalyzes oxygen-dependent dimethylglycine oxidation; without adequate THF capture the
    iminium intermediate hydrolyzes to sarcosine and formaldehyde, with hydrogen peroxide generated by
    flavin reoxidation. This is the conditional uncoupled output of the same enzyme, not sarcosine oxidation.
  molecular_function:
    id: GO:0047866
    label: dimethylglycine oxidase activity
  supported_by:
  - reference_id: PMID:11926836
    supporting_text: using dimethylglycine and O2 as substrates
  - reference_id: PMID:12912903
    supporting_text: in the presence of THF, 5,10-methylene-THF is formed at the expense of formaldehyde
