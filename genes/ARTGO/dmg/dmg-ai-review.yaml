proposed_new_terms:
- proposed_name: tetrahydrofolate-coupled dimethylglycine oxidase activity
  proposed_definition: Catalysis of N,N-dimethylglycine + (6S)-5,6,7,8-tetrahydrofolate + O2 = sarcosine
    + (6R)-5,10-methylene-5,6,7,8-tetrahydrofolate + H2O2. Oxidation of the dimethylglycine methyl group
    is coupled to transfer of its one-carbon unit to tetrahydrofolate.
  justification: GO:0047866/RHEA:17077 explicitly releases formaldehyde and does not express the distinct
    THF-coupled net reaction RHEA:45756. Direct product and uncoupling experiments support the latter.
    This term is not sarcosine oxidase, ETF-dependent dimethylglycine dehydrogenase, or glycine-cleavage
    aminomethyltransferase activity.
  proposed_parent:
    id: GO:0016647
    label: oxidoreductase activity, acting on the CH-NH group of donors, oxygen as acceptor
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:45756
      label: THF-coupled oxidation of dimethylglycine to sarcosine
  supported_by:
  - reference_id: PMID:12912903
    supporting_text: in the presence of THF, 5,10-methylene-THF is formed at the expense of formaldehyde
  - reference_id: PMID:12912903
    supporting_text: uses molecular oxygen rather than ETF
  - reference_id: PMID:19369258
