      not the fully coupled THF-dependent output. The same protein normally can capture the oxidized one-carbon
      intermediate as 5,10-methylenetetrahydrofolate; that distinct net chemistry is represented by a
      proposed molecular function. No sarcosine oxidase or ETF-dependent dehydrogenase activity is inferred
      from the family name.
