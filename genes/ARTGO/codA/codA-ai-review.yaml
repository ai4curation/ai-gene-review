- id: PMID:14678796
  title: 'Cloning, sequence analysis, and purification of choline oxidase from Arthrobacter globiformis:
    a bacterial enzyme involved in osmotic stress tolerance.'
  findings:
  - statement: ATCC8010 codA cloning, recombinant purification, dimerization and activity with both substrates.
    supporting_text: 'The enzyme was shown to be a homodimer of 120,000 Da by size-exclusion

      chromatography and to be active with both choline and betaine aldehyde as

      substrate.'
- id: PMID:14690428
  title: Spectroscopic and kinetic properties of recombinant choline oxidase from Arthrobacter globiformis.
  findings:
  - statement: The recombinant enzyme described by Fan and colleagues uses molecular oxygen as primary
      acceptor.
    supporting_text: 'Choline oxidase catalyzes the four-electron oxidation of choline to glycine

      betaine, with molecular oxygen acting as primary electron acceptor.'
- id: PMID:18072756
  title: Role of Glu312 in binding and positioning of the substrate for the hydride transfer reaction
    in choline oxidase.
  findings:
  - statement: "Structure establishes the covalent His99\u2013FAD bond and substrate positioning by Glu312."
    supporting_text: 'The structure reveals a covalent

      linkage between His99 Nepsilon2 and FAD C8M atoms, and a 123 A3 solvent-excluded

      cavity adjacent to the re face of the flavin.'
- id: PMID:12637017
  title: Kinetic mechanism of choline oxidase from Arthrobacter globiformis.
  findings:
  - statement: Independent mechanistic evidence supports oxygen-dependent oxidation with both substrates;
      the abstract does not establish the exact stock/strain, so this is mechanistic corroboration, not
      the identity anchor.
    supporting_text: 'The steady state kinetic mechanism has been determined at pH

      7 with choline and betaine-aldehyde as substrate to be sequential, consistent

      with oxygen reacting with the reduced enzyme before release of betaine-aldehyde

      or glycine-betaine, respectively.'
- id: PMID:12795615
  title: Structural characterization and mapping of the covalently linked FAD cofactor in choline oxidase
    from Arthrobacter globiformis.
  findings:
  - statement: Earlier flavin peptide mapping uses His87 numbering; do not map that number directly to
      the corrected current sequence.
- id: PMID:15713082
  title: On the catalytic mechanism of choline oxidase.
  findings:
  - statement: Rapid/steady-state kinetic evidence examines flavin reduction by both choline and betaine
      aldehyde.
