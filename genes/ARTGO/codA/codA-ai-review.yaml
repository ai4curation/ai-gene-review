id: Q7X2H8
gene_symbol: codA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1665
  label: Arthrobacter globiformis
description: CodA is a homodimeric, covalently FAD-containing choline oxidase of Arthrobacter
  globiformis. The ATCC 8010 enzyme catalyzes both successive oxidations of choline to glycine
  betaine, through betaine aldehyde, using molecular oxygen as electron acceptor and producing
  hydrogen peroxide. Its second catalytic reaction accepts betaine aldehyde directly. His99 anchors
  FAD and Glu312 helps position the cationic substrate. This soluble enzyme provides the oxidative
  segment of glycine betaine synthesis; its native choline-import system and the contribution of
  this route to stress adaptation in ATCC 8010 remain incompletely defined.
existing_annotations:
- term:
