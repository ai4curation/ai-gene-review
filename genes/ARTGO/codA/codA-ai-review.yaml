    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001694915
  review:
    summary: CodA performs two experimentally established oxidations, more specific than generic
      oxidoreductase activity.
    action: MODIFY
    reason: 'Purified ATCC 8010 CodA uses choline and betaine aldehyde with oxygen, and the corrected
      AAP68832.1 sequence matches Q7X2H8 exactly. Refine the generic oxidoreductase claim to GO:0033713
      for choline oxidation and the proposed betaine-aldehyde:oxygen oxidoreductase activity for the independently
      measured second reaction. Generic GO:0004031 is chemically compatible but does not encode this substrate;
      its common use for unrelated AOX enzymes is not itself evidence against CodA chemistry. The proposed
      child preserves substrate specificity in the machine-readable core without claiming broad aldehyde
      turnover.'
    supported_by:
    - reference_id: PMID:14678796
      supporting_text: 'The enzyme was shown to be a homodimer of 120,000 Da by size-exclusion

        chromatography and to be active with both choline and betaine aldehyde as

        substrate.'
    - reference_id: PMID:14690428
      supporting_text: 'Choline oxidase catalyzes the four-electron oxidation of choline to glycine

        betaine, with molecular oxygen acting as primary electron acceptor.'
    proposed_replacement_terms:
