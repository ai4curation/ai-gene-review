  qualifier: enables
  supporting_entities:
  - PANTHER:PTN001694915
  review:
    summary: CodA performs two experimentally established oxidations, more specific than generic oxidoreductase
      activity.
    action: MODIFY
    reason: 'The TreeGrafter assignment is biologically correct at the broad oxidoreductase level. Purified
      ATCC8010 recombinant CodA accepts choline and betaine aldehyde (PMID14678796); the same recombinant
      preparation uses oxygen (PMID14690428). Refine GO0016491 to both supported descendant activities:
      choline:oxygen oxidoreductase and aldehyde oxidase. The latter is restricted here to betaine aldehyde,
      not an assertion of broad aldehyde specificity. The corrected AAP68832.1 sequence is identical to
      Q7X2H8.'
    supported_by:
    - reference_id: PMID:14678796
      supporting_text: 'The enzyme was shown to be a homodimer of 120,000 Da by size-exclusion

        chromatography and to be active with both choline and betaine aldehyde as

        substrate.'
    - reference_id: PMID:14690428
      supporting_text: 'Choline oxidase catalyzes the four-electron oxidation of choline to glycine

        betaine, with molecular oxygen acting as primary electron acceptor.'
    proposed_replacement_terms:
    - &id001
      id: GO:0033713
      label: choline:oxygen 1-oxidoreductase activity
    - &id003
      id: GO:0004031
      label: aldehyde oxidase activity
