      cavity adjacent to the re face of the flavin.'
- id: PMID:12637017
  title: Kinetic mechanism of choline oxidase from Arthrobacter globiformis.
  findings:
  - statement: Independent mechanistic evidence supports oxygen-dependent oxidation with both
      substrates; the abstract does not establish the exact stock/strain, so this is mechanistic
      corroboration, not the identity anchor.
    supporting_text: 'The steady state kinetic mechanism has been determined at pH

      7 with choline and betaine-aldehyde as substrate to be sequential, consistent

      with oxygen reacting with the reduced enzyme before release of betaine-aldehyde

      or glycine-betaine, respectively.'
