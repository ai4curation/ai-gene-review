- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000172
  - InterPro:IPR012132
  review:
    summary: CodA binds FAD covalently as a catalytic cofactor.
    action: ACCEPT
    reason: "The domain-derived FAD-binding annotation is independently supported by denaturation/mass-spectrometric
      evidence for covalent flavinylation in the ATCC8010 recombinant protein (PMID14678796) and the structural
      His99–FAD linkage (PMID18072756). This cofactor enables both oxidations and belongs to the core
      catalytic mechanism; it is not an unrelated binding function. Earlier His87 numbering in PMID12795615
      refers to an earlier sequence/variant."
    supported_by:
    - reference_id: PMID:18072756
      supporting_text: 'The structure reveals a covalent

        linkage between His99 Nepsilon2 and FAD C8M atoms, and a 123 A3 solvent-excluded

        cavity adjacent to the re face of the flavin.'
- term: &id002
    id: GO:0031456
    label: glycine betaine biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:14678796
  review:
    summary: CodA directly catalyzes glycine betaine synthesis through two successive oxidations.
    action: NEW
    reason: 'CodA itself performs both chemical steps, as demonstrated with the purified ATCC8010 recombinant
      enzyme and either choline or betaine aldehyde substrate; this is catalytic participation, not an
      inference from stress resistance or knockout necessity. GO0031456 is a biosynthetic process under
      amino-acid betaine biosynthesis. Its is_a/part_of ancestors do not duplicate either molecular-function
      term, and no existing BP row covers it. Same-role comparison queried E. coli BetA/P17444 and BetB/P17445
      and B. subtilis GbsA/P71016: current QuickGO returned this BP for BetB, but not the other two; the
      comparison is not evidence of a universal annotation convention or a completeness gap. Here direct
      product synthesis supplies the evidence. No Q7X2H8 GO-CAM entry was found. This assignment describes
      enzyme chemistry and does not assert a measured native osmotic-stress phenotype or uptake mechanism.'
    supported_by:
    - reference_id: PMID:14678796
      supporting_text: 'The enzyme was shown to be a homodimer of 120,000 Da by size-exclusion

        chromatography and to be active with both choline and betaine aldehyde as

        substrate.'
    - reference_id: PMID:14690428
      supporting_text: 'Choline oxidase catalyzes the four-electron oxidation of choline to glycine

        betaine, with molecular oxygen acting as primary electron acceptor.'
