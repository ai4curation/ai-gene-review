predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0017111
    label: ribonucleoside triphosphate phosphatase activity
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: DOMAIN_ARCHITECTURE_MISMATCH
    summary: >-
      The prediction is refuted by the protein's own architecture. NTP hydrolysis by
      NACHT and other P-loop NTPases needs a Walker A (GxxxxGK[ST]) and a Walker B motif.
      Q31PW6 has neither, and it has no NACHT or P-loop domain. Its only domain is
      DUF4062 (6-146), followed by a coiled coil and an unassigned C-terminal region. The
      call took "NTPase" from the COG5635 orthogroup name. That name fits the long
      DUF4062-NACHT members, such as TEP1, where the NACHT ATPase is a separate domain
      next to DUF4062. P-loop domains occur in 86% of DUF4062 proteins over 450 aa but in
      only 1.3% of those of 450 aa or less. This is a multidomain donor's activity
      transferred through a shared domain that does not hydrolyse NTPs. The DUF4062
      domain is instead a TIR-like NAD+ hydrolase (PMID:42146377), and Q31PW6 keeps its
      conserved Glu83. The term is absent from GOA, which has no annotations for Q31PW6.
