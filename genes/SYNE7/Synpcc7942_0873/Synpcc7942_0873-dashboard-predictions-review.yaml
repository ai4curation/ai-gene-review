description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for S. elongatus
  CP088958.1_900 is "DUF4062 domain-containing protein, putative NACHT-family NTPase."
  (tier B). Its one GO term is GO:0017111 ribonucleoside triphosphate phosphatase
  activity (NTPase). The dashboard sequence is identical to PCC 7942 Synpcc7942_0873
  (Q31PW6) over its full 362 residues, so the call is scored on Q31PW6. The DUF4062 part
  of the call is correct. The NTPase part is wrong. Its only basis is the STRING
  orthogroup label COG5635 ("Predicted NTPase, NACHT family domain"). The protein has no
  Walker A or Walker B motif and no NACHT or P-loop domain. Among DUF4062 proteins of
  450 aa or less, only 1.3% carry a P-loop domain, compared with 86% of longer ones. The
  NTPase label therefore comes from multidomain DUF4062-NACHT relatives through the
  shared DUF4062 domain. The DUF4062 domain itself is a TIR-like NAD+ hydrolase
  (PMID:42146377), and the query keeps its conserved catalytic Glu (Glu83). The
  predicted activity is thus the wrong kind of hydrolase: an NADase, not an NTPase. The
  dashboard model did not see this evidence; the preprint postdates the evidence it was
  given. Recommended dashboard verdict: wrong (overreach on the evidence shown).
  Corrected annotation: "DUF4062 (TIR-like) domain protein, probable NAD+ hydrolase;
  putative antiphage defence effector; no NTPase domain".
