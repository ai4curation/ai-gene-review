  review:
    summary: >-
      Synpcc7942_0873 is a probable NAD+ nucleosidase. This is inferred from its DUF4062
      TIR-like domain and its retention of the family's conserved catalytic Glu.
    action: NEW
    reason: >-
      DUF4062 domains of bacterial Swarozyc and human TEP1 hydrolyse NAD+ to ADP-ribose
      and nicotinamide, and the activity needs a conserved active-site Glu (E97 and
      E1008; PMID:42146377). The query's DUF4062 domain (Pfam hit 6-146, i-Evalue
      1.4e-53) has Glu83 at the family's most conserved Glu position: Pfam HMM state 78,
      consensus E, and identical in 93% of 375 short bacterial homologs. The protein also
      has the short Swarozyc-like layout of TIR-like domain, coiled-coil stalk and
      C-terminal region. Two points limit the inference. The activity was shown for
      distant relatives in a preprint, not for this protein. And not every DUF4062
      protein is active: human NWD1, NWD2 and NPHP3 were inactive. NAD+ nucleosidase
      activity (NAD+ + H2O = ADP-ribose + nicotinamide) matches the reported products. No
      cyclic ADP-ribose products were reported, so the cADPR-generating child term is
      not used.
    supported_by:
    - reference_id: PMID:42146377
      supporting_text: >-
        we show that domain of unknown function 4062 (DUF4062) is a widespread family of
        TIR-like NADases that hydrolyze NAD+ to ADP-ribose and nicotinamide
    - reference_id: PMID:42146377
      supporting_text: >-
        Sequence alignments identified a conserved Glu as a likely catalytic residue,
        corresponding to the known catalytic site of TIR NADases
    - reference_id: file:SYNE7/Synpcc7942_0873/Synpcc7942_0873-bioinformatics/RESULTS.md
      supporting_text: >-
        Glu83 sits at match state 78, whose
        consensus is an uppercase (highly conserved) E with emission probability P(E) = 0.602,
        the highest of any query Glu.
    - reference_id: file:SYNE7/Synpcc7942_0873/Synpcc7942_0873-deep-research-claude-code.md
      supporting_text: '**No gene-specific experimental literature exists.**'
