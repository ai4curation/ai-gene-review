description: >-
  Synpcc7942_0873 is an uncharacterized 362-residue cytoplasmic protein. It has an
  N-terminal DUF4062 domain (PF13271, residues 6-146), a predicted coiled coil (170-197)
  and a C-terminal region of about 165 residues with no InterPro or Pfam match. Two
  independent structure-based reviews of the AlphaFold model assign that C-terminal
  region a winged-helix fold, around residues 206-348, and both also read the N-terminal
  region as TIR-like; the winged-helix hits are weak at the individual level and are a
  fold-level candidate rather than a family assignment. A 2026 preprint
  showed that DUF4062 is a TIR-like NAD+ hydrolase. It converts NAD+ to ADP-ribose and
  nicotinamide and needs a conserved catalytic Glu (PMID:42146377). Bacterial members
  such as Klebsiella Swarozyc are antiphage defence proteins built from the TIR-like
  domain, helical stalks and an auxiliary domain. They are activated by the phage portal
  and kill the infected cell by depleting NAD+ (abortive infection). Synpcc7942_0873 has
  the same short layout, and the predicted winged-helix domain corresponds in position
  and fold to the Swarozyc auxiliary domain, which adopts a helix-turn-helix/winged fold
  and is the portal-recognition module. It also keeps the family's most conserved Glu
  (Glu83 in GLSYTEKEY, at a highly conserved E position of the Pfam HMM). It is therefore
  a probable NAD+ nucleosidase. This has not been tested, and not every DUF4062 protein
  is active. Its trigger, its partners and any role in phage defence are unknown. A
  winged helix can also bind DNA, so a regulatory role is not excluded; what favours the
  defence reading is that in this family the equivalent fold is a phage sensor. The
  protein has no P-loop NTPase domain: there is no Walker A or Walker B motif. The
  "NACHT-family NTPase" label from its COG5635 orthogroup describes long DUF4062-NACHT
  proteins such as TEP1, not this one. Its chromosomal neighbours include an SNF2/RAD54
  family helicase and a protein with a UvrC-like endonuclease domain. Whether they form
  a defence locus with it was not assessed.
