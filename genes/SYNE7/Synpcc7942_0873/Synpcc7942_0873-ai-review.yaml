suggested_questions:
- question: Does purified Synpcc7942_0873 hydrolyse NAD+ to ADP-ribose and nicotinamide, and does the Glu83Ala mutant abolish this?
- question: Does Synpcc7942_0873 defend S. elongatus against cyanophage, and is it activated by a phage portal protein as Swarozyc is?
- question: Do the neighbouring SNF2/RAD54 helicase and UvrC-like endonuclease genes form a defence island with Synpcc7942_0873?
suggested_experiments:
- description: >-
    Express and purify Synpcc7942_0873 and its E83A mutant, incubate with NAD+ and NADP+,
    and analyse products by HPLC, alone and in oligomerizing conditions or with candidate
    cyanophage portal proteins.
  experiment_type: in vitro NADase assay with active-site mutant
- description: >-
    Express Synpcc7942_0873 (WT and E83A) in a heterologous host or S. elongatus and test
    for phage defence and NAD+ depletion upon infection.
  experiment_type: phage challenge / abortive infection assay
