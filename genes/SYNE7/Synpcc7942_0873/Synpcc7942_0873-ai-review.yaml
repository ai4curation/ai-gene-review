  description: >-
    Probable TIR-like NAD+ hydrolase (DUF4062 domain, conserved catalytic Glu83). By
    analogy with bacterial Swarozyc, it may be a signal-activated NAD+-depleting effector,
    possibly an antiphage abortive-infection protein. The activating signal and the
    defence role are untested.
  supported_by:
