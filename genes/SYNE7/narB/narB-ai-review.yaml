- term:
    id: GO:0019333
    label: denitrification pathway
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00652
  review:
    summary: NarB performs assimilatory nitrate reduction, not the denitrification pathway.
    action: REMOVE
    reason: UniPathway:UPA00652 propagates a respiratory denitrification assignment to an assimilatory
      cyanobacterial nitrate reductase. Native physiology and target enzyme studies place NarB in
      the nitrate-to-nitrite step feeding NirA and nitrogen assimilation, not production of gaseous
      nitrogen oxides or dinitrogen. The shared nitrate substrate does not justify assigning this
      protein to denitrification (PMID:8624415, PMID:15166246, PMID:9341163).
    supported_by:
    - *id002
    - *id004
    - reference_id: PMID:9341163
      supporting_text: an ATP-binding cassette transporter encoded by the genes nrtA, nrtB, nrtC,
        and nrtD mediates active transport of nitrate and nitrite
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: UniPathway:UPA00652
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: UPA00652 is the observed denitrification source; its pathway assignment is incompatible
          with the target assimilatory NarB reaction and nitrogen-assimilation context.
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
