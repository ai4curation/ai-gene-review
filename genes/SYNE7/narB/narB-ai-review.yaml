core_functions:
- description: Reduces nitrate to nitrite with electrons supplied by ferredoxin through the [4Fe-4S]
    and molybdopterin Mo cofactors, executing the first reductive step of nitrate assimilation.
  molecular_function:
    id: GO:0047889
    label: ferredoxin-nitrate reductase activity
