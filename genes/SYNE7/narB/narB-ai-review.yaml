  review:
    summary: Replace generic binding with the donor-linked nitrate reductase activity.
    action: MODIFY
    reason: The original IPI paper (PMID:14871493) measures a functional ferredoxin complex and ferredoxin-dependent
      nitrate-to-nitrite catalysis, not merely an uninterpreted interaction. GO:0047889 captures
      the experimentally supported activity. The inherited spinach interactor is preserved; the abstract
      also specifies Anabaena PCC 7119 ferredoxin variants, and full-text PMID:28520412 uses PCC
      6803 ferredoxin with PCC 7942 NarB. These experiments do not identify an exclusively native
      donor pair.
