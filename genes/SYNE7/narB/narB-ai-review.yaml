- id: PMID:14871493
  title: 'Complex formation between ferredoxin and Synechococcus ferredoxin: nitrate oxidoreductase.'
  findings:
  - statement: The functional ferredoxin complex supports nitrate-to-nitrite reduction.
    supporting_text: When reduced ferredoxin served as the electron donor for the reduction of nitrate
      to nitrite, the activity of the enzyme declined markedly as the ionic strength increased.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original IPI source inspected. Abstract explicitly links ferredoxin interaction
      to nitrate reduction by PCC 7942 enzyme and includes Anabaena PCC 7119 ferredoxin variants.
      The inherited spinach P00221 interaction is retained in the machine payload; no wrong-gene
      claim is made from the incomplete full text.
- id: PMID:8624415
  title: A cyanobacterial narB gene encodes a ferredoxin-dependent nitrate reductase.
  findings:
  - statement: PCC 7942 NarB catalyzes nitrate reduction with reduced ferredoxin or artificial methyl
      viologen.
    supporting_text: either reduced methyl viologen or reduced ferredoxin could be used as an electron
      donor for the reduction of nitrate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary expression of the PCC 7942 narB gene in E. coli and comparison with the
      cyanobacterial enzyme. Abstract read; supports donor-linked catalytic identity, not a quinone-dependent
      respiratory enzyme.
- id: PMID:15166246
  title: Tuning a nitrate reductase for function. The first spectropotentiometric characterization
    of a bacterial assimilatory nitrate reductase reveals novel redox properties.
  findings:
  - statement: NarB contains approximately four Fe, four acid-labile sulfides and one Mo per molecule.
    supporting_text: Metal and acid-labile sulfide analysis revealed nearest integer values of 4:4:1
      (iron/sulfur/molybdenum)/molecule of NarB.
  - statement: EPR detects a reduced [4Fe-4S] cluster in NarB.
    supporting_text: Analysis of dithionite-reduced enzyme by low temperature EPR revealed at 10
      K the presence of a signal that is characteristic of a [4Fe-4S](1+) cluster.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PCC 7942 NarB spectroscopy and electrochemistry. Abstract read; publisher
      PDF retrieval returned 403. Metal/sulfide stoichiometry and EPR support the bound cofactors;
      the enzyme is an assimilatory cytoplasmic reductase.
- id: PMID:28520412
  title: Identification of the Ferredoxin-Binding Site of a Ferredoxin-Dependent Cyanobacterial Nitrate
    Reductase.
  findings:
  - statement: PCC 7942 NarB contains a molybdopterin Mo center and a [4Fe-4S] cluster.
    supporting_text: one bis-molybdopterin guanine dinucleotide (MGD) Mo center and one [4Fe-4S]2+,+
      cluster as prosthetic groups.
  - statement: The experimental enzyme/donor pair combines PCC 7942 NarB with PCC 6803 ferredoxin.
    supporting_text: Both recombinant wild-type Fd from the cyanobacterium Synechocystis sp. PCC
      6803 and recombinant, C-terminally Histagged Synechococcus sp. PCC 7942 NR were expressed in
      Escherichia coli
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary full text read, including methods and mutagenesis results. The enzyme is
      recombinant PCC 7942 NarB, whereas the assayed ferredoxin is from Synechocystis PCC 6803. Docking
      is a model tested by mutagenesis, not a solved native complex structure. Cofactor descriptions
      also synthesize earlier target spectroscopy.
- id: PMID:9341163
  title: Involvement of the C-terminal domain of an ATP-binding subunit in the regulation of the
    ABC-type nitrate/nitrite transporter of the Cyanobacterium synechococcus sp. strain PCC 7942.
  findings:
  - statement: NrtABCD mediates active uptake of both nitrate and nitrite.
    supporting_text: an ATP-binding cassette transporter encoded by the genes nrtA, nrtB, nrtC, and
      nrtD mediates active transport of nitrate and nitrite
  - statement: The C-terminal extension of NrtC participates in ammonium-promoted inhibition.
    supporting_text: the C-terminal domain of NrtC is involved in the ammonium-promoted inhibition
      of the nitrate/nitrite transporter.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PCC 7942 NrtC domain deletion, complementation and nitrate accumulation
      experiments. Full text read in the separately cached University of Seville PDF; methods specify
      the plasmid-cured PCC 7942 derivative R2-SPc. C-terminal regulation is not evidence for direct
      ammonium binding.
