taxon:
  id: NCBITaxon:1140
  label: Synechococcus elongatus PCC 7942 = FACHB-805
description: NarB is the assimilatory ferredoxin-dependent nitrate reductase of Synechococcus elongatus
  PCC 7942. It transfers electrons from reduced ferredoxin through a [4Fe-4S] cluster to a molybdopterin-containing
  molybdenum center, reducing nitrate to nitrite in the cytoplasm. Nitrite is subsequently reduced
  to ammonium by NirA for incorporation into cellular nitrogen.
