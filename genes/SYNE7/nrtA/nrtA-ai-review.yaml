- term:
    id: GO:0015414
    label: ABC-type nitrate transporter activity
  evidence_type: IC
  original_reference_id: PMID:9006953
  qualifier: contributes_to
  review:
    summary: NrtA contributes substrate recognition to the ATP-coupled nitrate importer.
    action: NEW
    reason: The native deletion phenotype alone would show necessity, but recombinant NrtA binds the transported
      substrates and native biochemical evidence identifies it as the membrane-anchored substrate-binding
      component. It therefore performs substrate recognition for the NrtABCD transport cycle rather than
      being cargo or an incidental regulator. The contributes_to relationship explicitly avoids claiming
      isolated ATP hydrolysis or a pore in NrtA. There is no existing MF row or replacement covering this
      function. GO:0015706 is not added separately because it is already an is_a/part_of ancestor of GO:0015414
      in the checked ontology; nitrate transport remains explicit in core_functions. The proposal rests
      on primary target evidence, not partner annotation coverage.
    supported_by:
    - reference_id: PMID:9006953
      supporting_text: 'A truncated

        NrtA protein lacking the N-terminal 81 amino acids, expressed in Escherichia

        coli cells as a histidine-tagged soluble protein, was shown to bind nitrate and

        nitrite with high affinity'
    - reference_id: PMID:9006953
      supporting_text: 'Characterization of the nrtA deletional mutants showed that the 45-kDa protein

        is essential for the functioning of the nitrate/nitrite transporter.'
    - reference_id: PMID:9341163
      supporting_text: 'an ATP-binding cassette transporter

        encoded by the genes nrtA, nrtB, nrtC, and nrtD mediates active transport of

        nitrate and nitrite'
- term:
    id: GO:0015707
    label: nitrite transport
  evidence_type: IC
  original_reference_id: PMID:9006953
  review:
    summary: NrtA performs substrate recognition in native nitrite uptake.
    action: NEW
    reason: NrtA binds nitrite as well as nitrate and supplies the substrate-binding component needed
      for the native dual-substrate NrtABCD transporter. Binding biochemistry plus native transporter
      genetics establishes work performed in transport, beyond a loss-of-function requirement. Nitrite
      transport is not an ancestor or descendant of the proposed nitrate-specific MF and is absent from
      existing rows/replacements. Same-role QuickGO comparison finds sparse NrtA homolog annotations (P73452
      and Q44292), but transport-process annotations on substrate-binding MalE P0AEX9 and PstS P0AG82
      show that this structural role is not excluded from transport processes. These comparator annotations
      are a convention check, not scientific support for this target; the primary papers supply that support.
    supported_by:
    - reference_id: PMID:9006953
      supporting_text: 'A truncated

        NrtA protein lacking the N-terminal 81 amino acids, expressed in Escherichia

        coli cells as a histidine-tagged soluble protein, was shown to bind nitrate and

        nitrite with high affinity'
    - reference_id: PMID:9006953
