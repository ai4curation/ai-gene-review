- id: PMID:9006953
  title: Substrate-binding lipoprotein of the cyanobacterium Synechococcus sp. strain PCC 7942 involved
    in the transport of nitrate and nitrite.
  findings:
  - statement: Recombinant truncated NrtA binds nitrate and nitrite; native-cell precursor accumulation
      supports lipoprotein processing.
    supporting_text: A truncated NrtA protein lacking the N-terminal 81 amino acids, expressed in Escherichia
      coli cells as a histidine-tagged soluble protein, was shown to bind nitrate and nitrite with high
      affinity
  - statement: NrtA is the nitrate/nitrite-binding lipoprotein of the transporter.
    supporting_text: These findings indicated that the nrtA gene product is a nitrate- and nitrite-binding
      lipoprotein.
  - statement: Native deletion and substrate-binding biochemistry identify NrtA as a functional recognition
      component of nitrate/nitrite uptake, not transported cargo.
    supporting_text: 'Characterization of the nrtA deletional mutants showed that the 45-kDa protein

      is essential for the functioning of the nitrate/nitrite transporter.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PCC 7942 deletion and globomycin experiments plus binding assays on truncated
      NrtA expressed in E. coli. Abstract read; DOI retrieval returned a redirect rather than full text.
      The measured affinity is for the recombinant truncation, not an intact-cell transport Km.
- id: PMID:9341163
  title: Involvement of the C-terminal domain of an ATP-binding subunit in the regulation of the ABC-type
    nitrate/nitrite transporter of the Cyanobacterium synechococcus sp. strain PCC 7942.
  findings:
  - statement: NrtABCD mediates active uptake of both nitrate and nitrite.
    supporting_text: an ATP-binding cassette transporter encoded by the genes nrtA, nrtB, nrtC, and nrtD
      mediates active transport of nitrate and nitrite
  - statement: The C-terminal extension of NrtC participates in ammonium-promoted inhibition.
    supporting_text: the C-terminal domain of NrtC is involved in the ammonium-promoted inhibition of
      the nitrate/nitrite transporter.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PCC 7942 NrtC domain deletion, complementation and nitrate accumulation experiments.
      Full text read in the separately cached University of Seville PDF; methods specify the plasmid-cured
      PCC 7942 derivative R2-SPc. C-terminal regulation is not evidence for direct ammonium binding.
