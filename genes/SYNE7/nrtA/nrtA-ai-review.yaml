taxon:
  id: NCBITaxon:1140
  label: Synechococcus elongatus PCC 7942 = FACHB-805
description: NrtA is the membrane-anchored substrate-binding lipoprotein of the high-affinity NrtABCD
  nitrate/nitrite uptake system in Synechococcus elongatus PCC 7942. It binds nitrate and nitrite on the
  extracytoplasmic side of the cytoplasmic membrane and supplies substrate to the NrtB permease and NrtC/NrtD
  ATP-binding components, enabling uptake for nitrogen assimilation.
