- id: PMID:8490140
  title: 'Nitrite reductase gene from Synechococcus sp. PCC 7942: homology between cyanobacterial
    and higher-plant nitrite reductases.'
  findings:
  - statement: The PCC 7942 nitrite reductase gene was identified and sequenced.
    supporting_text: The gene encoding nitrite reductase (nir) from the cyanobacterium Synechococcus
      sp. PCC 7942 has been identified and sequenced.
  - statement: Sequence conservation supports a coupled [4Fe-4S]-siroheme center.
    supporting_text: Identities found at positions corresponding to those amino acids which in the
      above-mentioned proteins hold the Fe4S4-siroheme active center suggest that nitrite reductase
      from Synechococcus bears an active site much alike that present in those reductases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PCC 7942 nir sequence study. Abstract read; supports gene identity and
      conserved Fe-S/siroheme architecture by comparison, not direct measurement of cofactor occupancy
      or donor kinetics in purified PCC 7942 NirA.
- id: url:https://idus.us.es/bitstream/handle/11441/129668/Involvement%20of%20the%20C-terminal%20Domain.pdf?sequence=1
  title: Involvement of the C-terminal Domain of an ATP-binding Subunit in the Regulation of the
    ABC-type Nitrate/Nitrite Transporter of the Cyanobacterium Synechococcus sp. Strain PCC 7942*
  findings:
  - statement: Deletion/complementation establishes that NrtC itself is essential for nitrate transport.
    supporting_text: NrtC itself is essential for nitrate transport.
  - statement: The truncated NrtC remains associated with the cytoplasmic membrane.
    supporting_text: These findings confirmed the expression of the N-termi- nal portion of NrtC
      and its incorporation into the cytoplasmic membrane in NC2.
  - statement: Native-cell nitrate and nitrite reductase activities were assayed with an artificial
      electron donor.
    supporting_text: NR and NiR activities were determined at 30 °C, using toluene-permeabilized
      cells with dithionite-reduced methylviolo- gen as the electron donor
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text copy of PMID:9341163 from the author institution. R2-SPc is a PCC 7942
      derivative cured of pUH24. Transport was separated from reduction using narB mutants and intracellular
      nitrate measurements. Table I measures native NR/NiR with artificial reduced methyl viologen;
      it does not establish a native ferredoxin partner.
