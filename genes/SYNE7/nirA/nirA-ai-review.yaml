  review:
    summary: NirA is the assimilatory ferredoxin-dependent nitrite reductase.
    action: ACCEPT
    reason: The sequenced PCC 7942 nir product, nitrite reductase assays in native PCC 7942-derived
      cells and the verified ferredoxin-NiR family assignment jointly support this catalytic identity.
      The original sequence paper does not directly measure donor specificity or cofactor occupancy,
      and the native assay used methyl viologen; these limits are kept explicit. This is distinct
      from the NADH-linked heterotrophic NirBD system and from Anabaena NirB accessory maturation
      proteins.
