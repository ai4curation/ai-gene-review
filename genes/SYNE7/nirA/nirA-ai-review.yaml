  label: Synechococcus elongatus PCC 7942 = FACHB-805
description: NirA is the ferredoxin-dependent assimilatory nitrite reductase of Synechococcus elongatus
  PCC 7942. It reduces nitrite to ammonium using six electrons supplied by reduced ferredoxin. Its
  conserved iron-sulfur/siroheme architecture supports a coupled [4Fe-4S]-siroheme catalytic center,
  completing the reductive part of nitrate assimilation before ammonium incorporation into organic
  nitrogen.
