taxon:
  id: NCBITaxon:1140
  label: Synechococcus elongatus PCC 7942 = FACHB-805
description: NrtB is the integral membrane permease of the high-affinity NrtABCD nitrate/nitrite
  transporter in Synechococcus elongatus PCC 7942. It forms the membrane pathway coupled to substrate
  capture by NrtA and ATP-dependent conformational changes driven by NrtC and NrtD, supplying inorganic
  nitrogen for assimilation.
