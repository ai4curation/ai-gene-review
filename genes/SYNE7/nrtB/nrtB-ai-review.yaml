- term:
    id: GO:0042918
    label: alkanesulfonate transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00034185
  review:
    summary: The alkanesulfonate pathway assignment is inconsistent with the characterized NrtB system.
    action: REMOVE
    reason: The proximate source is ARBA:ARBA00034185. PCC 7942 NrtB is genetically assigned to the
      NrtABCD nitrate/nitrite transporter; the associated NrtA substrate-binding component recognizes
      nitrate and nitrite (PMID:8437564, PMID:9006953, PMID:9341163). The broad PANTHER family has
      an alkanesulfonate-related name, but the verified target subfamily is NITRATE IMPORT PERMEASE
      PROTEIN NRTB. Neither a shared ABC membrane fold nor that broad family name justifies transferring
      the alkanesulfonate pathway. This rejects the electronic substrate assignment, not an experimental
      annotation.
    supported_by:
    - *id001
    - reference_id: PMID:9006953
      supporting_text: A truncated NrtA protein lacking the N-terminal 81 amino acids, expressed
        in Escherichia coli cells as a histidine-tagged soluble protein, was shown to bind nitrate
        and nitrite with high affinity
    - *id002
    propagation_review:
      root_cause: PROPAGATION_BAD
      source_entities:
      - source_id: ARBA:ARBA00034185
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: The observed ARBA rule propagates alkanesulfonate transport to a target characterized
          in the nitrate/nitrite-specific NrtABCD system. Broader ABC-family membership does not
          establish this substrate pathway.
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
