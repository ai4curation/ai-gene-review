  - PANTHER:PTN001248866
  review:
    summary: The NrtABCD component acts at the cytoplasmic membrane.
    action: ACCEPT
    reason: NrtB is the integral membrane component; the ATP-binding components NrtC and NrtD act
      on the cytoplasmic side of this membrane. This assignment combines native transport genetics
      with the conserved ABC architecture (PMID:8437564, PMID:9341163); it does not imply that an
      ATP-binding subunit is itself a transmembrane pore.
    supported_by:
