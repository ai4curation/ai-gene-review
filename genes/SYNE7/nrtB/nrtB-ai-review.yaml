- id: PMID:8437564
  title: Identification and characterization of a gene cluster involved in nitrate transport in the
    cyanobacterium Synechococcus sp. PCC7942.
  findings:
  - statement: NrtB is the hydrophobic membrane component of the binding-protein-dependent transporter.
    supporting_text: NrtB is a hydrophobic protein having structural similarity to the integral membrane
      components of bacterial transport systems that are dependent on periplasmic substrate-binding
      proteins.
  - statement: NrtC has an N-terminal ATP-binding domain related to NrtD.
    supporting_text: The N-terminal portion of NrtC (amino acid residues 1-254) and NrtD are 58%
      identical to each other in their amino acid sequences, and resemble the ATP-binding components
      of binding protein-dependent transport systems.
  - statement: Loss of NrtD removes the high-affinity phase of nitrate uptake.
    supporting_text: The high-affinity phase of nitrate-dependent O2 evolution was absent in the
      nrtD mutant.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PCC 7942 gene-cluster sequencing and native interruption phenotypes. Abstract
      read; subunit topology and ATP-binding assignments include sequence inference, not isolated-protein
      ATPase assays.
- id: PMID:9341163
  title: Involvement of the C-terminal domain of an ATP-binding subunit in the regulation of the
    ABC-type nitrate/nitrite transporter of the Cyanobacterium synechococcus sp. strain PCC 7942.
  findings:
  - statement: NrtABCD mediates active uptake of both nitrate and nitrite.
    supporting_text: an ATP-binding cassette transporter encoded by the genes nrtA, nrtB, nrtC, and
      nrtD mediates active transport of nitrate and nitrite
  - statement: The C-terminal extension of NrtC participates in ammonium-promoted inhibition.
    supporting_text: the C-terminal domain of NrtC is involved in the ammonium-promoted inhibition
      of the nitrate/nitrite transporter.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PCC 7942 NrtC domain deletion, complementation and nitrate accumulation
      experiments. Full text read in the separately cached University of Seville PDF; methods specify
      the plasmid-cured PCC 7942 derivative R2-SPc. C-terminal regulation is not evidence for direct
      ammonium binding.
- id: PMID:9006953
  title: Substrate-binding lipoprotein of the cyanobacterium Synechococcus sp. strain PCC 7942 involved
    in the transport of nitrate and nitrite.
  findings:
  - statement: Recombinant truncated NrtA binds nitrate and nitrite; native-cell precursor accumulation
      supports lipoprotein processing.
    supporting_text: A truncated NrtA protein lacking the N-terminal 81 amino acids, expressed in
      Escherichia coli cells as a histidine-tagged soluble protein, was shown to bind nitrate and
      nitrite with high affinity
  - statement: NrtA is the nitrate/nitrite-binding lipoprotein of the transporter.
    supporting_text: These findings indicated that the nrtA gene product is a nitrate- and nitrite-binding
      lipoprotein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PCC 7942 deletion and globomycin experiments plus binding assays on truncated
      NrtA expressed in E. coli. Abstract read; DOI retrieval returned a redirect rather than full
      text. The measured affinity is for the recombinant truncation, not an intact-cell transport
      Km.
