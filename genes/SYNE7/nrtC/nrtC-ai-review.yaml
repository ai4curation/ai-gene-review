- term:
    id: GO:0015707
    label: nitrite transport
  evidence_type: IC
  original_reference_id: PMID:9341163
  review:
    summary: nrtC contributes the ATP-coupling component of native NrtABCD nitrite uptake.
    action: NEW
    reason: NrtC is an ATP-binding/energy-coupling component of the native dual-substrate NrtABCD importer,
      so it performs structural and coupling work in nitrite transport rather than being cargo or only
      an upstream regulator. Native NrtC-domain perturbation changes nitrite uptake regulation while retaining
      a functional N-terminal component; the full paper assigns the observed NC2 uptake to the nitrate/nitrite
      transporter. IC deliberately synthesizes native-complex transport with subunit/domain identification;
      it is not a claim of a purified isolated NrtC nitrite-transport or ATPase assay. The same-role ABC
      ATPase comparators MalK P68187, PstB P0AAH0 and MetN P30750 carry transport-process annotations
      in live QuickGO, including experimental rows. These annotation states test convention only; primary
      native evidence supports this target. GO:0015707 is not an ancestor or descendant of the retained
      nitrate-transport, ABC nitrate-transporter, ATPase or ATP-binding terms, so it is a distinct substrate-specific
      process rather than a redundant ancestor. Local GO-CAM index/source-model searches found no target
      representation to reconcile.
    supported_by:
    - reference_id: PMID:8437564
      supporting_text: 'The N-terminal portion of NrtC (amino acid residues 1-254) and NrtD

        are 58% identical to each other in their amino acid sequences, and resemble the

        ATP-binding components of binding protein-dependent transport systems.'
    - reference_id: PMID:9341163
      supporting_text: 'an ATP-binding cassette transporter

        encoded by the genes nrtA, nrtB, nrtC, and nrtD mediates active transport of

        nitrate and nitrite'
    - reference_id: url:https://idus.us.es/bitstream/handle/11441/129668/Involvement%20of%20the%20C-terminal%20Domain.pdf?sequence=1
      supporting_text: 'nitrite is trans-

        ported into NC2 cells by the nitrate/nitrite transporter in the

        presence of ammonium.'
