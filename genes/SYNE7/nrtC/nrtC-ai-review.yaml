taxon:
  id: NCBITaxon:1140
  label: Synechococcus elongatus PCC 7942 = FACHB-805
description: NrtC is the ATP-binding component with a C-terminal regulatory extension of the high-affinity
  NrtABCD nitrate/nitrite transporter in Synechococcus elongatus PCC 7942. Its N-terminal ABC domain participates
  in energy coupling at the cytoplasmic membrane, while its NrtA-like C-terminal extension is required
  for normal ammonium-promoted inhibition of transport. The extension is dispensable for basal nitrate/nitrite
  uptake.
