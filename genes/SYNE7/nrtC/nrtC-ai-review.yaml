- id: PMID:8437564
  title: Identification and characterization of a gene cluster involved in nitrate transport in the cyanobacterium
    Synechococcus sp. PCC7942.
  findings:
  - statement: NrtB is the hydrophobic membrane component of the binding-protein-dependent transporter.
    supporting_text: NrtB is a hydrophobic protein having structural similarity to the integral membrane
      components of bacterial transport systems that are dependent on periplasmic substrate-binding proteins.
  - statement: NrtC has an N-terminal ATP-binding domain related to NrtD.
    supporting_text: The N-terminal portion of NrtC (amino acid residues 1-254) and NrtD are 58% identical
      to each other in their amino acid sequences, and resemble the ATP-binding components of binding
      protein-dependent transport systems.
  - statement: Loss of NrtD removes the high-affinity phase of nitrate uptake.
    supporting_text: The high-affinity phase of nitrate-dependent O2 evolution was absent in the nrtD
      mutant.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PCC 7942 gene-cluster sequencing and native interruption phenotypes. Abstract
      read; subunit topology and ATP-binding assignments include sequence inference, not isolated-protein
      ATPase assays.
- id: PMID:9341163
  title: Involvement of the C-terminal domain of an ATP-binding subunit in the regulation of the ABC-type
    nitrate/nitrite transporter of the Cyanobacterium synechococcus sp. strain PCC 7942.
  findings:
  - statement: NrtABCD mediates active uptake of both nitrate and nitrite.
    supporting_text: an ATP-binding cassette transporter encoded by the genes nrtA, nrtB, nrtC, and nrtD
      mediates active transport of nitrate and nitrite
  - statement: The C-terminal extension of NrtC participates in ammonium-promoted inhibition.
    supporting_text: the C-terminal domain of NrtC is involved in the ammonium-promoted inhibition of
      the nitrate/nitrite transporter.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary PCC 7942 NrtC domain deletion, complementation and nitrate accumulation experiments.
      Full text read in the separately cached University of Seville PDF; methods specify the plasmid-cured
      PCC 7942 derivative R2-SPc. C-terminal regulation is not evidence for direct ammonium binding.
- id: url:https://idus.us.es/bitstream/handle/11441/129668/Involvement%20of%20the%20C-terminal%20Domain.pdf?sequence=1
  title: Involvement of the C-terminal Domain of an ATP-binding Subunit in the Regulation of the ABC-type
    Nitrate/Nitrite Transporter of the Cyanobacterium Synechococcus sp. Strain PCC 7942*
  findings:
  - statement: Deletion/complementation establishes that NrtC itself is essential for nitrate transport.
    supporting_text: NrtC itself is essential for nitrate transport.
  - statement: The truncated NrtC remains associated with the cytoplasmic membrane.
    supporting_text: These findings confirmed the expression of the N-termi- nal portion of NrtC and its
      incorporation into the cytoplasmic membrane in NC2.
  - statement: Native-cell nitrate and nitrite reductase activities were assayed with an artificial electron
      donor.
    supporting_text: NR and NiR activities were determined at 30 °C, using toluene-permeabilized cells
      with dithionite-reduced methylviolo- gen as the electron donor
  - statement: The NrtC-domain mutant NC2 transports nitrite through the native nitrate/nitrite transporter;
      this is whole-complex uptake, not isolated NrtC transport.
    supporting_text: 'nitrite is trans-

      ported into NC2 cells by the nitrate/nitrite transporter in the

      presence of ammonium.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text copy of PMID:9341163 from the author institution. R2-SPc is a PCC 7942 derivative
      cured of pUH24. Transport was separated from reduction using narB mutants and intracellular nitrate
      measurements. Table I measures native NR/NiR with artificial reduced methyl viologen; it does not
      establish a native ferredoxin partner.
