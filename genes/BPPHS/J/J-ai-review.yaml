core_functions:
- description: >-
    Binds and condenses the viral single-stranded DNA genome via its basic
    N-terminal domain during procapsid entry, displaces internal scaffolding
    protein B by docking its aromatic C-terminus into interior clefts of coat
    protein F, and tethers the packaged genome to the inner surface of the viral
    capsid.
