suggested_questions:
- question: >-
    In what sequential order are the 60 interior gpF binding clefts switched from
    internal scaffold gpB to gpJ during unidirectional stage III rolling-circle
    ssDNA translocation into the 108S procapsid?
suggested_experiments:
- hypothesis: >-
    Co-translocational binding of gpJ to nascent ssDNA neutralizes charge in a
    5'-to-3' wave that sequentially displaces gpB pentamer-by-pentamer from the
    packaging vertex toward the distal vertices.
  description: >-
    Perform time-resolved cryo-EM analysis of in vitro stage III packaging
    reactions arrested with dideoxynucleotides at defined fractional genome
    lengths to visualize intermediate gpB-to-gpJ exchange states inside 108S
    procapsids.
  experiment_type: Time-resolved cryo-EM of arrested in vitro DNA packaging intermediates
