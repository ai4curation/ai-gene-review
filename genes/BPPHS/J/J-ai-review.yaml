  label: Enterobacteria phage phiX174 isolate Sanger
description: >-
  Small, highly basic DNA-binding and packaging protein (gpJ, 38 aa; 37 aa mature)
  essential for viral single-stranded DNA encapsidation and mature virion
  stability. During stage III genome packaging in the host cytoplasm, 60 copies
  of protein J bind the nascent circular single-stranded DNA genome via their
  positively charged N-terminal regions to neutralize phosphate repulsion and
  co-enter the 108S procapsid. Inside the procapsid, the conserved aromatic
  C-terminus of protein J binds an interior cleft on each of the 60 major coat
  protein F subunits, displacing internal scaffolding protein B and tethering the
  packaged genome to the inner surface of the mature T=1 icosahedral capsid.
