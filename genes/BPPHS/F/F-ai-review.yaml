suggested_questions:
- question: >-
    What conformational change in the fivefold loops of protein F gates the
    opening of the 5-fold vertex pore after G-spike dissociation and triggers
    oligomerization of the internal pilot protein H tail tube?
suggested_experiments:
- hypothesis: >-
    Binding of the exposed EF loops of protein F to the inner core of bacterial
    lipopolysaccharide allosterically destabilizes the fivefold beta-annulus of
    the F pentamer, dilating the vertex channel to allow H tube extrusion.
  description: >-
    Reconstitute phiX174 eclipse intermediates on rough-LPS nanodiscs and resolve
    the open versus closed 5-fold vertex conformations of the F pentamer by
    single-particle cryo-EM.
  experiment_type: Cryo-EM reconstruction of LPS-nanodisc-bound virion eclipse intermediates
