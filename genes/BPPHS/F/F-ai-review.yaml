id: P03641
gene_symbol: F
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1217068
  label: Enterobacteria phage phiX174 isolate Sanger
description: >-
  Major coat protein (gpF, 427 aa) that forms the T=1 icosahedral capsid shell of
  bacteriophage phiX174. Sixty copies of protein F, each adopting an
  eight-stranded antiparallel beta-barrel fold with extensive surface loops,
  assemble via 9S pentamers and 12S pre-assembly intermediates into the 108S
  procapsid and undergo an 8.5-Angstrom radial collapse around the packaged
  single-stranded DNA genome and DNA-binding protein J to form the mature 30-nm
  virion. During host infection, dissociation of a vertex spike exposes the EF
  loops of protein F to interact with bacterial lipopolysaccharide and opens a
  channel at the unique fivefold vertex for genome ejection.
