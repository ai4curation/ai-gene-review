core_functions:
- description: >-
    Internal molecular scaffolding protein (60 copies per procapsid) that binds the
    interior clefts of major coat protein F pentamers in the host cytoplasm to
    assemble 12S intermediates and the 108S procapsid before being displaced by
    protein J during ssDNA packaging.
