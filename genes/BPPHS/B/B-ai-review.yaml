suggested_questions:
- question: >-
    Is the slow autoproteolysis observed at Arg-Phe motifs of gpB in crystal
    structures essential for gpB extrusion in vivo during rapid phiX174 DNA
    packaging, or can intact gpB exit through the 30-Angstrom 3-fold pores when
    displaced by gpJ?
suggested_experiments:
- hypothesis: >-
    Competitive binding of the C-terminus of gpJ to the interior aromatic cleft of
    gpF is sufficient to displace intact gpB through the 3-fold procapsid pores
    independent of Arg-Phe cleavage.
  description: >-
    Mutate all three putative Arg-Phe autolysis motifs (residues 77-78, 93-94, and
    108-109) of phiX174 gpB to Arg-Ala and measure procapsid assembly, in vitro
    stage III ssDNA packaging efficiency, and completeness of gpB extrusion into
    132S provirions by mass spectrometry.
  experiment_type: Site-directed mutagenesis and in vitro procapsid DNA packaging assay
