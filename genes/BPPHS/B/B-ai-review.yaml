id: P03633
gene_symbol: B
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1217068
  label: Enterobacteria phage phiX174 isolate Sanger
description: >-
  Internal scaffolding protein (gpB, 120 aa) essential for early procapsid
  morphogenesis in the host cytoplasm. Sixty copies of protein B bind to the
  inner surface of major capsid protein F pentamers, promoting their association
  with major spike protein G pentamers and minor spike protein H into 12S
  pre-assembly intermediates while preventing premature shell closure. Twelve
  12S complexes are subsequently bridged by 240 copies of external scaffolding
  protein D to form the 108S procapsid. Upon viral single-stranded DNA packaging,
  gpB is displaced from the interior coat clefts by DNA-binding protein J and
  extruded from the procapsid, a process facilitated by autoproteolytic cleavage
  at Arg-Phe motifs.
