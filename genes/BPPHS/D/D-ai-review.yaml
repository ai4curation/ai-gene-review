  label: Enterobacteria phage phiX174 isolate Sanger
description: >-
  External scaffolding protein (gpD, 152 aa) that drives assembly of the T=1
  icosahedral 108S procapsid and mediates provirion maturation in the host
  cytoplasm. Two hundred forty copies of protein D (four quasi-equivalent
  subunits per icosahedral asymmetric unit) form an external lattice that bridges
  twelve 12S pentameric pre-assembly complexes (composed of F, G, B, and H
  proteins) into the porous 108S procapsid. After viral single-stranded DNA and
  protein J are packaged to form the 132S provirion, dissociation of the external
  protein D scaffold allows an 8.5-Angstrom radial collapse of the F coat shell
  into the mature infectious 114S virion.
