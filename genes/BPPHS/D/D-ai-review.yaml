suggested_questions:
- question: >-
    What triggers the cooperative dissociation of the 240-copy external D lattice
    from the 132S provirion upon completion of ssDNA packaging in vivo?
suggested_experiments:
- hypothesis: >-
    Tethering of the packaged ssDNA genome to the interior of the F capsid by
    protein J induces an allosteric conformational shift in the F coat alpha-helices
    that lowers the affinity for the D1-D4 tetramers, priming spontaneous scaffold
    release.
  description: >-
    Compare high-resolution cryo-EM reconstructions of the empty 108S procapsid and
    the DNA-filled 132S provirion trapped at low temperature to map changes at the
    gpD-gpF interface prior to gpD dissociation.
  experiment_type: Cryo-EM structural comparison of 108S procapsid and 132S provirion
