id: P69594
gene_symbol: K
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1217068
  label: Enterobacteria phage phiX174 isolate Sanger
description: >-
  Non-essential accessory protein (gpK, 56 aa) encoded in an overlapping reading
  frame spanning the junction of genes B, A, and C that enhances progeny phage
  burst size during infection. Although dispensable for plaque formation,
  expression of protein K increases the yield of infectious virions per infected
  host cell through an uncharacterized molecular mechanism.
existing_annotations: []
core_functions:
- description: >-
    Non-essential overlapping-frame accessory protein that increases progeny phage
    burst size during infection of the bacterial host.
  supported_by:
  - reference_id: file:BPPHS/K/K-uniprot.txt
    supporting_text: "Somehow affects phage production, although the protein does...not seem to be essential. {ECO:0000269|PubMed:3155803}."
references:
- id: file:BPPHS/K/K-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P69594 (K_BPPHS)
  findings:
  - statement: Protein K is encoded by an overlapping gene spanning genes B, A, and C and is non-essential for viability but affects the burst size of phage production.
    supporting_text: "Somehow affects phage production, although the protein does...not seem to be essential. {ECO:0000269|PubMed:3155803}....Gene K overlaps genes B, A, and C."
suggested_questions:
- question: >-
    What is the direct host or viral binding partner of the 56-residue overlapping
    protein K at the host inner membrane, and does gpK stimulate stage II/III
    DNA replication or delay premature gpE-mediated lysis to increase burst size?
suggested_experiments:
- hypothesis: >-
    Protein K localizes to the host inner membrane via its N-terminal hydrophobic
    leucine-rich helix and modulates either membrane-associated stage II RF DNA
    replication or the timing of YES-complex-mediated lysis.
  description: >-
    Perform affinity purification-mass spectrometry (AP-MS) of epitope-tagged gpK
    in phiX174-infected E. coli C cells, coupled with single-step growth curves
    and intracellular RF/ssDNA quantification in wild-type versus gene K nonsense
    mutant infections.
  experiment_type: Affinity purification-mass spectrometry (AP-MS) and single-step viral replication/burst-size assay
