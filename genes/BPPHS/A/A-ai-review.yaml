proposed_new_terms:
- proposed_name: rolling-circle DNA replication origin nicking-closing activity
  proposed_definition: >-
    Catalysis of site-specific cleavage of a single strand of double-stranded
    DNA at a rolling-circle replication origin via a covalent
    5'-phosphotyrosine intermediate, followed by ATP-independent
    transesterification to join the 5' and 3' ends of the displaced single
    strand into a closed circular DNA molecule.
  justification: >-
    Rolling-circle replication initiator endonucleases (such as phiX174 gpA,
    filamentous phage pII, and plasmid/geminivirus HUH relaxases) couple
    site-specific origin nicking with ATP-independent covalent phosphotyrosine
    strand-transfer circularization. GO currently lacks a molecular function
    term that captures both the nicking and ATP-independent transesterification
    strand-closing activities without conflating them with NTP-dependent DNA
    ligases (GO:0016874) or topoisomerases (GO:0003916).
  proposed_parent:
    id: GO:0004519
    label: endonuclease activity
  supported_by:
  - reference_id: file:BPPHS/A/A-uniprot.txt
    supporting_text: "Binds the...origin of replication and cleaves the dsDNA replicative form I (RFI)...and becomes covalently bound to it via phosphotyrosine bond, generating...the dsDNA replicative form II (RFII)....After one round of rolling circle synthesis,...protein A is linked to the newly synthesized ssDNA and joins the ends...of the displaced strand to generate a circular single-stranded molecule...ready to be packed into a virion."
suggested_questions:
- question: >-
    How is the N-terminal domain of full-length gpA (residues 1-172, absent in gpA*)
    structurally coupled to E. coli Rep helicase loading and procapsid docking
    during stage III packaging-coupled rolling-circle DNA synthesis?
- question: >-
    Does the predicted C4-type zinc-binding motif (residues 246-268) coordinate a
    structural Zn2+ ion in vivo, or does gpA rely solely on catalytic Mg2+/Mn2+
    within the HUH endonuclease active site?
suggested_experiments:
- hypothesis: >-
    The N-terminal 172 residues unique to full-length gpA form a dedicated docking
    interface for host Rep helicase and viral protein C that is absent in gpA*.
  description: >-
    Determine the cryo-EM structure of the phiX174 stage III replisome-packaging
    complex (RFII DNA, gpA, host Rep helicase, and gpC bound to the 108S procapsid)
    and test site-directed mutants in gpA residues 1-172 for Rep recruitment and
    ssDNA translocation.
  experiment_type: Cryo-EM single-particle reconstruction and in vitro rolling-circle replication assay
