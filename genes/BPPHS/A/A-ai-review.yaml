id: P03631
gene_symbol: A
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1217068
  label: Enterobacteria phage phiX174 isolate Sanger
description: >-
  Multifunctional rolling-circle replication initiator endonuclease (gpA) that
  catalyzes stage II and stage III viral DNA synthesis in the host cytoplasm.
  Protein A specifically binds the 30-base-pair viral origin of replication on
  supercoiled double-stranded replicative form I (RFI) DNA and nicks the viral
  (+) strand via a covalent 5'-phosphotyrosine intermediate at active-site
  residues Tyr-343 and Tyr-347, generating RFII DNA with a free 3'-OH primer for
  host Rep helicase and DNA polymerase III holoenzyme. After one complete round
  of rolling-circle synthesis, gpA cleaves the regenerated origin and joins the
  ends of the displaced viral strand by energy-conserving transesterification to
  produce a circular single-stranded DNA genome for virion packaging. An
  N-terminally truncated in-frame translation product, protein A* (gpA*), binds
  double-stranded DNA, inhibits semiconservative DNA replication, and promotes
  the transition to single-stranded viral DNA synthesis.
alternative_products:
- name: A
  id: P03631-1
  description: >-
    Full-length replication initiator protein A (513 aa) required for origin-specific
    nicking of double-stranded RFI DNA, recruitment of host Rep helicase, and
    rolling-circle synthesis and circularization of viral single-stranded DNA.
- name: A*
  id: P03631-2
  sequence_note: VSP_018674
  description: >-
    N-terminally truncated isoform (residues 173-513) translated from an internal
    in-frame start codon that binds double-stranded DNA, protects it from
    nuclease degradation, and inhibits semiconservative DNA replication to favor
    late single-stranded DNA synthesis.
