  review:
    summary: Erroneous keyword mapping derived from EC 6.5.1.1 (ATP-dependent DNA ligase); gpA does not bind ATP or free nucleotides.
    action: REMOVE
    reason: >-
      This annotation stems from an automated UniProt keyword mapping triggered by
      the assignment of EC 6.5.1.1 (ATP-dependent DNA ligase) to gpA. However,
      phiX174 protein A does not bind or hydrolyze ATP or other free nucleotides;
      instead, it conserves cleavage energy in a covalent O-(5'-phospho-DNA)-tyrosine
      bond at active-site residues Tyr-343 and Tyr-347 and ligates the displaced
      single-stranded DNA by direct transesterification.
    supported_by:
    - reference_id: file:BPPHS/A/A-uniprot.txt
      supporting_text: "Binds the...origin of replication and cleaves the dsDNA replicative form I (RFI)...and becomes covalently bound to it via phosphotyrosine bond, generating...the dsDNA replicative form II (RFII)."
