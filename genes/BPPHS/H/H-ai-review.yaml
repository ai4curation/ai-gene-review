id: P03646
gene_symbol: H
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1217068
  label: Enterobacteria phage phiX174 isolate Sanger
description: >-
  Multifunctional minor spike and DNA pilot protein (gpH, 328 aa) that mediates
  lipopolysaccharide-dependent host recognition and self-assembles into a
  transient periplasm-spanning alpha-helical barrel tube for viral DNA transport
  during infection. Twelve copies of protein H are incorporated into the T=1
  icosahedral capsid via 12S pre-assembly intermediates. Upon virion attachment
  to bacterial lipopolysaccharide and vertex opening, ten gpH monomers
  oligomerize into a 170-Angstrom-long decameric coiled-coil tube that bridges
  the host outer and inner membranes across the periplasmic space, forming a
  hydrophilic conduit that delivers the single-stranded DNA genome into the host
  cytoplasm.
