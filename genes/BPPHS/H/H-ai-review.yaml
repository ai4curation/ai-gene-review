suggested_questions:
- question: >-
    Where are the 12 monomers of protein H arranged within the asymmetric interior
    of the packaged virion prior to infection, and how do 10 monomers rapidly
    nucleate into a single decameric barrel at the infecting fivefold vertex?
suggested_experiments:
- hypothesis: >-
    Ten of the twelve gpH monomers are pre-organized as a loosely associated
    bundle beneath a single unique vertex during stage III DNA packaging, while
    the remaining two monomers remain monomeric.
  description: >-
    Perform symmetry-relaxed (C1) single-particle cryo-EM reconstruction of
    native 114S phiX174 virions using focused classification on the internal
    density beneath the twelve fivefold vertices.
  experiment_type: Symmetry-relaxed (C1) single-particle cryo-EM reconstruction
