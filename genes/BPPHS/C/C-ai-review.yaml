suggested_questions:
- question: >-
    Which specific surfaces of protein C contact the gpA-Rep-RFII complex versus the
    2-fold or 3-fold pores of the 108S procapsid to gate DNA polymerase III
    elongation until procapsid docking occurs?
suggested_experiments:
- hypothesis: >-
    Protein C forms a homodimeric clamp on the displaced 5'-phosphotyrosine-gpA
    junction that sterically blocks E. coli SSB binding until relieved by
    allosteric contact with external scaffolding protein D on the 108S procapsid.
  description: >-
    Perform hydrogen-deuterium exchange mass spectrometry (HDX-MS) and cryo-EM
    analysis of the reconstituted phiX174 pre-packaging complex (RFII-gpA-Rep-gpC)
    before and after addition of purified 108S procapsids.
  experiment_type: Cryo-EM and HDX-MS structural characterization
