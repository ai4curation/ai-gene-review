id: P69172
gene_symbol: C
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1217068
  label: Enterobacteria phage phiX174 isolate Sanger
description: >-
  Late-stage replication switch and viral DNA packaging protein (gpC, 86 aa) that
  couples rolling-circle single-stranded DNA synthesis to procapsid encapsidation
  in the host cytoplasm. Protein C binds to the replicative complex composed of
  viral initiator protein A, host Rep helicase, and replicative form DNA after one
  round of synthesis, inhibiting further stage II double-stranded RF replication
  until an empty 108S procapsid docks onto the complex to initiate stage III
  single-stranded viral DNA synthesis and packaging.
