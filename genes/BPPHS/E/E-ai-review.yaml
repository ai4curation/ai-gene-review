  label: Enterobacteria phage phiX174 isolate Sanger
description: >-
  Single-gene lysis protein (gpE, 91 aa) that induces host cell lysis by directly
  inhibiting bacterial cell wall peptidoglycan biosynthesis at the host inner
  membrane. Encoded in an overlapping +1 reading frame entirely within gene D,
  protein E inserts into the host plasma membrane and bridges host translocase I
  (MraY, phospho-N-acetylmuramoyl-pentapeptide-transferase) and the host
  chaperone SlyD to assemble the transmembrane heterohexameric YES (MraY2-E2-SlyD2)
  complex. By sterically obstructing the MraY active site and blocking lipid I
  production, protein E halts peptidoglycan synthesis during cell division,
  resulting in osmotic lysis and progeny virion release.
