    action: ACCEPT
    reason: >-
      Dominant resistance mutations in E. coli mraY (UniProtKB:P0A6W3) confer a
      lysis-defective phenotype against phiX174 protein E, demonstrating that gpE
      suppresses host peptidoglycan synthesis by targeting translocase I (MraY).
