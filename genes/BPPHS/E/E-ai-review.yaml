- id: PMID:10760296
  title: Genetic evidence that the bacteriophage phi X174 lysis protein inhibits cell
    wall synthesis.
  findings:
  - statement: Dominant mutations in the essential host gene mraY confer resistance to phiX174 protein E-mediated lysis, identifying translocase I (MraY) as the cellular target of gpE.
    supporting_text: "In this study, we describe the isolation of dominant mutations in the essential host gene mraY that result in a general lysis-defective phenotype. mraY encodes translocase I, which catalyzes the formation of the first lipid-linked intermediate in cell wall biosynthesis. The isolation of these lysis-defective mutants supports a model in which translocase I is the cellular target of E and that inhibition of cell wall synthesis is the mechanism of lysis."
- id: PMID:11078734
  title: The lysis protein E of phi X174 is a specific inhibitor of the MraY-catalyzed
    step in peptidoglycan synthesis.
  findings:
  - statement: Expression of phiX174 protein E specifically blocks MraY-catalyzed synthesis of lipid I in isolated host membranes without affecting related polyprenyl-phosphate transferases.
    supporting_text: "Moreover, we find that membranes isolated after Emyc expression are drastically reduced in MraY activity, whereas the activity of Rfe, an enzyme in the same superfamily, was unaffected. We therefore conclude that E is indeed a cell wall synthesis inhibitor and that this inhibition results from a specific block at the MraY-catalyzed step in the pathway."
- id: PMID:22742425
  title: Minimal requirements for inhibition of MraY by lysis protein E from bacteriophage
    ΦX174.
  findings:
  - statement: A minimal 18-residue transmembrane helix region of protein E is sufficient to inhibit MraY and lyse host cells.
    supporting_text: "We find that a minimal 18-residue region with the modified wild-type sequences of the conserved transmembrane helix of E is sufficient to lyse host cells and that specific residues within and at the boundaries of this helix are important for activity."
- id: PMID:37440661
  title: The mechanism of the phage-encoded protein antibiotic from ΦX174.
  findings:
  - statement: Cryo-EM reveals that protein E bridges host MraY and SlyD in a heterohexameric transmembrane YES complex, obstructing the MraY active site and halting lipid I synthesis.
    supporting_text: "Using single-particle electron cryo-microscopy, we demonstrate that protein E bridges two bacterial proteins to form the transmembrane YES complex [MraY, protein E, sensitivity to lysis D (SlyD)]. Protein E inhibits peptidoglycan biosynthesis by obstructing the MraY active site leading to loss of lipid I production."
- id: file:BPPHS/E/E-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P03639 (LYS_BPPHS)
  findings:
  - statement: Protein E localizes to the host cell membrane as part of the YES complex (2 MraY, 2 E, 2 SlyD) and inhibits MraY-catalyzed lipid I synthesis to induce host cell lysis.
    supporting_text: "Induces host cell lysis (PubMed:10760296, PubMed:11078734,...PubMed:19379010, PubMed:37440661). Inhibits the host translocase MraY...activity that catalyzes the synthesis of lipid I, a necessary step for...the host cell wall biosynthesis (PubMed:11078734, PubMed:19379010,...PubMed:37440661)."
suggested_questions:
- question: >-
    Does host SlyD actively catalyze prolyl cis-trans isomerization of Pro-21 or
    Pro-29 during membrane insertion of protein E, or does it act strictly as a
    cytoplasmic holdase/scaffold stabilizing the YES complex against FtsH-mediated
    proteolysis?
suggested_experiments:
- hypothesis: >-
    Chaperone binding by SlyD is required to prevent rapid degradation of the
    cytoplasmic C-terminal domain of protein E prior to MraY engagement, rather
    than catalyzing isomerization of the transmembrane Pro-21 residue.
  description: >-
    Measure the half-life of phiX174 protein E and in vitro YES complex assembly
    rates using catalytically inactive SlyD peptidyl-prolyl isomerase active-site
    mutants versus SlyD deletion strains lacking membrane protease FtsH.
  experiment_type: Pulse-chase protein stability and reconstituted proteoliposome MraY inhibition assay
