  label: Enterobacteria phage phiX174 isolate Sanger
description: >-
  Major spike protein (gpG, 175 aa) that forms the twelve pentameric vertex
  spikes of the T=1 icosahedral phiX174 capsid and mediates initial virion
  attachment to host bacterial lipopolysaccharide (LPS) receptors. In the host
  cytoplasm, five gpG monomers adopting an eight-stranded antiparallel
  beta-barrel fold assemble into a 6S spike pentamer that combines with an F coat
  pentamer, internal scaffolding protein B, and pilot protein H to form the 12S
  pre-assembly complex. In the mature virion, each G pentamer crowns a fivefold
  vertex around a central hydrophilic channel; upon LPS receptor recognition,
  conformational changes and dissociation of the G spike at the infecting vertex
  trigger pilot protein H deployment and DNA genome injection.
