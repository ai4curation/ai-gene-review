suggested_questions:
- question: >-
    How is symmetry broken during host adsorption so that only a single G spike
    pentamer dissociates from the infecting 5-fold vertex while the remaining 11
    vertex spikes remain intact on the capsid?
suggested_experiments:
- hypothesis: >-
    Engagement of pilot protein H with the inner membrane across the periplasm
    releases internal capsid pressure at the infecting vertex, stabilizing the
    remaining 11 G pentamers against LPS-induced dissociation.
  description: >-
    Compare G-spike dissociation stoichiometry upon lipopolysaccharide liposome
    binding between wild-type phiX174 virions and H-deficient or genome-less
    virus-like particles using native mass spectrometry and cryo-electron
    tomography.
  experiment_type: Cryo-electron tomography and native mass spectrometry of LPS-bound virions
