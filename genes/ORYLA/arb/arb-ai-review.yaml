  review:
    summary: Native medaka evidence limits the interpretation of the inherited testicular-function claim.
    action: UNDECIDED
    reason: The PAINT assertion conveys inherited testicular participation, not necessarily an essential
      role. Native medaka single and double receptor knockouts retain testicular germ-cell development
      and functional sperm. This establishes a difference from the mammalian requirement but does not
      prove absence of a modulatory contribution to the GO process. The target-specific extent of participation
      and ancestral-node placement therefore remain unresolved.
    propagation_review:
      root_cause: UNRESOLVED
      source_entities:
      - source_id: PANTHER:PTN002786997
        source_status: UNRESOLVED
        comment: This ancestral node asserts inherited participation. Normal differentiation and functional
          sperm in medaka double knockouts disprove a strict requirement but do not settle whether Arb
          modulates the process. A node-placement reassessment and target-specific functional evidence
          remain needed.
