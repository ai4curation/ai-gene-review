id: D1MV73
gene_symbol: arb
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8090
  label: Oryzias latipes
description: Medaka Arb is one of two teleost androgen receptor paralogs, a zinc-finger nuclear steroid
  receptor that couples androgen recognition to gene regulation. Ara and Arb differ in transactivation
  and tissue-specific localization. Arb contributes to male fin papillary processes and sexual motivation.
  Both receptors contribute to male courtship, while double-mutant testes retain functional sperm.
