id: D1MV72
gene_symbol: ara
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:8090
  label: Oryzias latipes
description: Medaka Ara is one of two teleost androgen receptor paralogs, a zinc-finger nuclear steroid
  receptor that couples androgen recognition to gene regulation. Ara and Arb differ in transactivation
  and tissue-specific localization. Ara contributes to male tooth enlargement and reproductive behavior,
  including female receptivity to male courtship. Both receptors contribute to male courtship, while double-mutant
  testes retain functional sperm.
