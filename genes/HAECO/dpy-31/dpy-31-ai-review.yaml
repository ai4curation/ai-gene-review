knowledge_gaps:
- gap_statement: >-
    The endogenous H. contortus cuticle procollagen substrates of DPY-31 and
    the in-species dpy-31 loss-of-function phenotype have not been directly
    identified.
  boundary: >-
    H. contortus dpy-31 rescues the C. elegans dpy-31 body-form phenotype, and
    recombinant Hco-DPY-31 cleaves the C. elegans cuticle collagen SQT-3 at the
    expected C-terminal processing site.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Direct Haemonchus substrate and perturbation data would test how completely
    the C. elegans SQT-3-centered pathway explains DPY-31 function in a
    gastrointestinal parasite.
  resolution: >-
    Identify H. contortus cuticle collagens that are cleaved by DPY-31 and
    assay dpy-31 loss of function in H. contortus larvae for cuticle, molting,
    body morphology, and viability phenotypes.
  provenance:
  - reference_id: file:HAECO/dpy-31/dpy-31-notes.md
    supporting_text: >-
      Native H. contortus cuticular substrates and an in-species
      loss-of-function phenotype remain inferred from heterologous rescue and
      SQT-3 cleavage rather than assayed directly.
suggested_experiments:
- description: >-
    Incubate recombinant Hco-DPY-31 with H. contortus cuticle-collagen
    precursors to map parasite-native C-terminal cleavage sites, then verify
    candidate substrates by targeted peptidomics after DPY-31 inhibition or
    depletion in larvae.
  hypothesis: >-
    Hco-DPY-31 cleaves H. contortus cuticle procollagens at C-terminal
    processing sites analogous to the C. elegans SQT-3 site.
  experiment_type: substrate mapping
- description: >-
    Deplete dpy-31 in H. contortus larvae, or treat larvae with DPY-31-active
    hydroxamate inhibitors, and score cuticle integrity, collagen maturation,
    body morphology, molting, and viability.
  hypothesis: >-
    Loss of Hco-DPY-31 activity blocks cuticle-collagen maturation and produces
    molting and morphology defects in H. contortus.
  experiment_type: loss of function
