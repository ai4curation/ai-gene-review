id: D5FM34
gene_symbol: dpy-31
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6289
  label: Haemonchus contortus
description: >-
  Hco-DPY-31/NAS-35 is a secreted, zinc-dependent astacin metalloendopeptidase
  of the BMP-1/tolloid family. It is produced from alternatively spliced
  dpy-31a and dpy-31b transcripts as a precursor with an N-terminal signal
  peptide and propeptide followed by a catalytic M12A astacin domain,
  EGF-like, CUB, and thrombospondin type-1 domains. The catalytic domain
  contains the extended HExxHxxGxxH zinc-binding motif characteristic of
  astacins and binds a catalytic zinc ion. Recombinant H. contortus DPY-31
  cleaves the C-terminal propeptide of the C. elegans cuticle collagen SQT-3 at
  the expected processing site, and the H. contortus ortholog rescues a C.
  elegans dpy-31 mutant body-form defect, supporting a conserved role as a
  procollagen C-proteinase for cuticular collagen maturation in nematodes.
