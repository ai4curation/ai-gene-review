  label: Haemonchus contortus
description: >-
  Hco-ACR-8 is a full-length alpha-type Cys-loop nicotinic acetylcholine
  receptor subunit in the parasitic strongylid nematode Haemonchus contortus.
  It has an N-terminal ligand-binding domain and four predicted transmembrane
  helices and is incorporated into an acetylcholine- and levamisole-gated
  heteromeric cation channel with Hco-UNC-29.1, Hco-UNC-38 and Hco-UNC-63a in
  Xenopus oocytes when the conserved ancillary factors Hco-RIC-3.1, Hco-UNC-50
  and Hco-UNC-74 are coexpressed. Inclusion of Hco-ACR-8 produces the
  Hco-L-AChR1 receptor state, which has much stronger levamisole sensitivity
  and weaker pyrantel and nicotine responses than the ACR-8-lacking
  Hco-L-AChR2 state. The truncated Hco-acr-8b transcript is associated with
  levamisole-resistant H. contortus isolates, connecting the ACR-8 locus to
  anthelmintic resistance surveillance.
