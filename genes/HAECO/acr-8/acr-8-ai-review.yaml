- id: PMID:21486278
  title: >-
    Functional reconstitution of Haemonchus contortus acetylcholine receptors
    in Xenopus oocytes provides mechanistic insights into levamisole
    resistance.
  findings:
  - statement: >-
      Boulin et al. cloned the full-length Hco-acr-8 cDNA from the
      levamisole-sensitive H. contortus ISE isolate and reconstituted the
      ACR-8-containing Hco-L-AChR1 receptor in Xenopus oocytes.
    supporting_text: >-
      Using a PCR-based strategy, we have cloned the full-length acr-8 cDNA
      sequences from three levamisole-sensitive trichostrongylid nematodes
  - statement: >-
      Removing Hco-acr-8 from the Hco-L-AChR1 cRNA mix reduced receptor
      expression by nearly all of the control current, while Hco-ACR-8 alone
      failed to form homomeric currents.
    supporting_text: >-
      Hco-ACR-8 does not assemble into homopentamers in our experimental
      conditions
  - statement: >-
      Inclusion of Hco-ACR-8 distinguished the highly levamisole-responsive
      Hco-L-AChR1 from the ACR-8-lacking Hco-L-AChR2.
    supporting_text: >-
      Hco-L-AChR1 has a significantly higher affinity for acetylcholine and
      levamisole than Hco-L-AChR2.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read. This study cloned the full-length Hco-acr-8 transcript,
      reconstituted the Hco-ACR-8-containing Hco-L-AChR1 receptor in Xenopus
      oocytes with Hco-UNC-29.1, Hco-UNC-38, Hco-UNC-63a and the three
      conserved ancillary proteins, showed that Hco-ACR-8 was not sufficient to
      make a homomeric receptor, and compared the acetylcholine, levamisole,
      pyrantel, nicotine and DMPP pharmacology of ACR-8-positive and
      ACR-8-lacking receptor combinations. The paper explicitly notes that
      native H. contortus receptor subunit localization, receptor stoichiometry
      and in vivo conductance assignments remained unresolved.
- id: PMID:21945142
  title: >-
    Candidate anthelmintic resistance-associated gene expression and sequence
    polymorphisms in a triple-resistant field isolate of Haemonchus contortus.
  findings:
  - statement: >-
      The levamisole-resistant UGA/2004 isolate expressed high levels of
      truncated Hco-acr-8b mRNA in resistant L3 larvae, while susceptible
      larvae had no detectable Hco-acr-8b expression.
    supporting_text: >-
      Levels of the Hco-acr-8b mRNA, encoding a truncated subunit, were very
      high in resistant L3, but undetectable in susceptible larvae
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cached study. The accessible abstract is sufficient for the
      narrow claim that truncated Hco-acr-8b expression was detected in the
      levamisole-resistant UGA/2004 isolate and not in a susceptible isolate;
      full text would be needed before curating exact expression assays,
      sampling design or sequence calls.
- id: PMID:24503202
  title: >-
    Novel assay for the detection and monitoring of levamisole resistance in
    Haemonchus contortus.
  findings:
  - statement: >-
      A 63-bp indel near the alternative third exon correlated with levamisole
      resistance status and with expression of the truncated Hco-acr-8b
      transcript.
    supporting_text: >-
      A correlation was also demonstrated between the absence of the indel and
      the expression of the Hco-acr-8b transcript.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract-only cached study. The abstract reports that Hco-acr-8b was
      absent from susceptible isolates and present in resistant isolates, then
      maps a 63-bp intron-2 indel whose absence correlates with Hco-acr-8b
      expression and levamisole resistance.
