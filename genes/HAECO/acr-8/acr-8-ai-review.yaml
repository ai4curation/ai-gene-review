knowledge_gaps:
- gap_statement: >-
    The endogenous stoichiometry, tissue distribution and postsynaptic
    localization of Hco-ACR-8-containing levamisole-sensitive acetylcholine
    receptors in H. contortus remain unresolved.
  boundary: >-
    Hco-ACR-8 is established as a full-length Cys-loop AChR subunit that can
    join Hco-UNC-29.1, Hco-UNC-38 and Hco-UNC-63a to produce a functional
    acetylcholine- and levamisole-gated cation channel in Xenopus oocytes.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Resolving the endogenous Hco-ACR-8 receptor pool would connect the
    oocyte-defined Hco-L-AChR1 pharmacology to levamisole action and
    resistance in the parasite.
  resolution: >-
    Localize Hco-ACR-8 in worms and determine native L-AChR subunit composition
    by receptor purification or targeted genetics and rescue in H. contortus.
  provenance:
  - *hco_lachr1_reconstitution
  - &in_vivo_gap
    reference_id: PMID:21486278
    supporting_text: >-
      no in vivo data is available in H. contortus regarding the spatial and
      temporal expression patterns of these receptor subunits
  - reference_id: file:HAECO/acr-8/acr-8-notes.md
    supporting_text: >-
      The oocyte-defined Hco-L-AChR1 establishes Hco-ACR-8 as a functional
      levamisole-sensitive pore subunit but does not identify where
      ACR-8-containing receptors assemble in vivo or whether the reconstituted
      subunit ratios match any native H. contortus receptor.
suggested_questions:
- question: >-
    Which native H. contortus levamisole-sensitive acetylcholine receptor
    populations contain Hco-ACR-8, and do any endogenous receptors match the
    oocyte-defined Hco-L-AChR1 subunit combination?
- question: >-
    Does the Hco-acr-8b truncation causally reduce Hco-L-AChR1 expression or
    levamisole sensitivity in resistant H. contortus isolates?
suggested_experiments:
- description: >-
    Affinity-purify Hco-ACR-8-containing receptor complexes from adult and
    larval H. contortus and identify co-purifying L-AChR subunits by targeted
    mass spectrometry.
  hypothesis: >-
    Hco-ACR-8 assembles with Hco-UNC-29.1, Hco-UNC-38 and Hco-UNC-63a in one
    or more native H. contortus L-AChR complexes.
  experiment_type: affinity purification-mass spectrometry
- description: >-
    Express full-length Hco-acr-8a alone or together with the truncated
    Hco-acr-8b transcript in a constant Hco-UNC-29.1/Hco-UNC-38/Hco-UNC-63a
    oocyte reconstitution background, then measure acetylcholine and levamisole
    dose responses.
  hypothesis: >-
    The levamisole-resistance-associated Hco-acr-8b transcript reduces
    ACR-8-positive Hco-L-AChR1 surface expression or shifts levamisole
    pharmacology.
  experiment_type: heterologous electrophysiology
