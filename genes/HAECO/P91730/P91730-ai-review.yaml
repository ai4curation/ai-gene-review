product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6289
  label: Haemonchus contortus
description: >-
  P91730 is the HG4/GluCl beta Cys-loop glutamate-gated chloride channel subunit
  from the parasitic strongylid nematode Haemonchus contortus. The cloned HG4
  cDNA encodes a predicted signal-peptide-containing, four-pass ligand-gated
  chloride-channel subunit whose predicted polypeptide shares 82% amino-acid
  identity with the C. elegans GluCl beta subunit GLC-2. Affinity-purified HG4
  antibodies localized the protein to anterior motor-neuron commissures,
  consistent with a neuronal GluCl receptor in the parasite, but direct
  electrophysiology and the native subunit composition of HG4-containing
  channels remain unresolved.
