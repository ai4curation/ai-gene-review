knowledge_gaps:
- gap_statement: >-
    The native HG4-containing H. contortus GluCl complexes, their subunit
    stoichiometry and their exact synaptic localization have not been resolved.
  boundary: >-
    HG4 is established as a full-length GluCl-beta-like receptor subunit
    expressed in anterior motor-neuron commissures, but the accessible H.
    contortus literature did not report direct heterologous electrophysiology
    or native receptor purification for P91730.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  significance: >-
    Determining the alpha partners and tissue-specific role of HG4 would connect
    the cloned H. contortus beta subunit to ivermectin-sensitive parasite
    circuits.
  resolution: >-
    Express HG4 with candidate H. contortus GluCl alpha subunits and affinity
    purify endogenous HG4-containing receptors from worms.
  provenance:
  - *hg4_cloning
  - *hg4_commissures
  - reference_id: file:HAECO/P91730/P91730-notes.md
    supporting_text: >-
      The abstract does not report electrophysiology for HG4, a native
      heteromeric partner, or postsynaptic localization within the stained
      anterior motor-neuron commissures.
suggested_questions:
- question: >-
    Which H. contortus GluCl alpha subunits assemble with the HG4 beta subunit
    to produce glutamate- and ivermectin-gated chloride currents?
- question: >-
    Is HG4 concentrated at postsynaptic membranes within the anterior
    commissures, or is it distributed more broadly over neuronal plasma
    membranes?
suggested_experiments:
- description: >-
    Coexpress P91730/HG4 with candidate H. contortus GluCl alpha subunits in
    Xenopus oocytes or another heterologous system and measure glutamate and
    ivermectin responses.
  hypothesis: >-
    HG4 contributes to heteromeric H. contortus glutamate-gated chloride
    channels with parasite alpha subunits that determine ligand and ivermectin
    sensitivity.
  experiment_type: heterologous electrophysiology
- description: >-
    Endogenously tag HG4 in H. contortus and co-image it with presynaptic and
    postsynaptic markers in anterior motor-neuron commissures.
  hypothesis: >-
    Native HG4-containing GluCls occupy plasma-membrane specializations at
    inhibitory glutamatergic synapses.
  experiment_type: endogenous tagging
proposed_ontology_changes:
- change_type: NODE_SHALLOWING
  ontology: GO
  about_node:
    id: GO:0005234
    label: extracellularly glutamate-gated ion channel activity
  old_value: GO:0005231
  new_value: GO:0005230
  subject:
    id: GO:0005230
    label: extracellular ligand-gated monoatomic ion channel activity
  predicate: rdfs:subClassOf
  justification: >-
    GO:0005234 is currently a child of GO:0005231, which makes every
    extracellularly glutamate-gated chloride channel a kind of excitatory
    extracellular ligand-gated channel and causes the correct GO:0008068
    glutamate-gated chloride-channel term to propagate excitatory postsynaptic
    potential assertions to invertebrate anion-selective GluCls. Glutamate-gated
    channels include both cation-selective excitatory channels and
    chloride-selective inhibitory channels, so the glutamate-gated ion-channel
    parent should sit under GO:0005230 without the excitatory sign commitment;
    cation-selective glutamate receptors would then need a more specific
    excitatory glutamate-gated channel parent so AMPA/NMDA receptor inferences
    keep the excitatory-postsynaptic-potential link.
  origin: SELF_PROPOSED
  confidence: PROBABLE
  affected_annotations:
  - genes/HAECO/P91730/P91730-ai-review.yaml
  supported_by:
  - reference_id: file:interpro/panther/PTHR18945/PTHR18945-review.yaml
    supporting_text: Anion-selective glycine receptor and invertebrate chloride-channel lineage
  - reference_id: PMID:37811674
    supporting_text: >-
      glutamate-gated chloride channels GLC-3 and GLC-2/4 receive DVB's
      glutamate signals to inhibit DVB and enteric muscle activity, respectively
  request_status: NOT_FILED
