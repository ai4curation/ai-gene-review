    label: GTPase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002453
  review:
    summary: InterPro2GO beta-tubulin GTPase assignment.
    action: ACCEPT
    reason: >-
      tub12-16 has an intact Tubulin/FtsZ GTPase domain and falls in the
      beta-tubulin family. The InterPro2GO GTPase row is acceptable as the
      beta-chain contribution to the tubulin nucleotide cycle, not as evidence
      that this H. contortus chain was assayed in isolation or independently
      autohydrolyzes GTP away from an alpha/beta-tubulin interface.
