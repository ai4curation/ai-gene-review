id: Q25022
gene_symbol: tub12-16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6289
  label: Haemonchus contortus
description: >-
  tub12-16 is a 448 aa Haemonchus contortus beta-tubulin that contains the conserved Tubulin/FtsZ GTPase
  and C-terminal domains and is expected to form alpha/beta-tubulin heterodimers that polymerize
  head-to-tail into microtubule protofilaments. The sequence contributes the beta structural subunit and
  exchangeable GTP-binding site of the heterodimer and carries Phe167, Glu198 and Phe200 at the three
  sites corresponding to canonical beta-tubulin benzimidazole-resistance positions. It is the isotype-2
  beta-tubulin, corresponding to HCON_00043670 on chromosome II of the chromosome-scale reference
  assembly, and so is a different locus from the isotype-1 gene on chromosome I in which the canonical
  benzimidazole-resistance substitutions arise.
