id: Q25022
gene_symbol: tub12-16
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6289
  label: Haemonchus contortus
description: >-
  tub12-16 is a full-length Haemonchus contortus beta-tubulin cDNA, beta
  12-16, cloned from whole worms as one of three parasite beta-tubulin cDNAs in
  the benzimidazole-target literature. It encodes a 448 aa beta-tubulin with
  conserved Tubulin/FtsZ GTPase and C-terminal domains and carries the
  wild-type Phe167, Glu198 and Phe200 residues at the three canonical
  benzimidazole-resistance positions.
