- id: PMID:1741017
  title: Three beta-tubulin cDNAs from the parasitic nematode Haemonchus contortus.
  full_text_unavailable: true
  findings:
  - statement: >-
      Geary et al. cloned and sequenced the H. contortus beta 12-16 cDNA, beta
      12-164 cDNA and beta 8-9 cDNA to investigate nematode beta-tubulin as the
      target of benzimidazole anthelmintics.
    supporting_text: >-
      To enhance our understanding of this phenomenon, and to provide the basis
      for investigating benzimidazole resistance in parasitic nematodes, we
      undertook the cloning of beta-tubulin cDNAs from the ruminant parasite,
      Haemonchus contortus. We have cloned and sequenced three beta-tubulin
      cDNAs from this organism, beta 12-16, beta 12-164, and beta 8-9.
core_functions:
- description: >-
    Full-length H. contortus beta-tubulin chain that can contribute the beta
    structural subunit and exchangeable GTP-binding site of alpha/beta-tubulin
    heterodimers in the microtubule lattice.
