suggested_questions:
- question: >-
    Does the H. contortus beta 12-16 isotype incorporate into the parasite
    microtubules that are engaged by benzimidazoles in vivo, and how do F167Y,
    E198A and F200Y alter benzimidazole sensitivity in this isotype background?
suggested_experiments:
- description: >-
    Express susceptible and benzimidazole-resistance variants of the beta
    12-16 isotype with a parasite alpha-tubulin partner for in vitro
    microtubule polymerization and benzimidazole-binding or depolymerization
    assays.
  hypothesis: >-
    Sequence changes in the beta 12-16 beta-tubulin background can modulate
    benzimidazole sensitivity while preserving microtubule assembly.
  experiment_type: biochemical reconstitution
