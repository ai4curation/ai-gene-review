knowledge_gaps:
- gap_statement: >-
    The modern beta-tubulin locus and drug-selected isotype class corresponding
    to the H. contortus beta 12-16 cDNA have not been resolved.
  boundary: >-
    Q25022 is the full-length beta 12-16 cDNA from Geary et al.; an ungapped alignment keeps it distinct
    from both the later A2TF56 resistant-isolate sequence and the older tub8-9 cDNA. Geary et al. found
    beta 12-16-like sequences in both benzimidazole-sensitive and resistant populations and pointed to a
    beta 8-9-related product as the possible population difference. An OpenScientist run
    (kgap-q25022-locus-identity) resolves this gap. The beta 12-16 cDNA corresponds to HCON_00043670, the
    isotype-2 beta-tubulin gene on chromosome II of the chromosome-scale PRJEB506 reference assembly, and
    not to isotype-1. The assemblies separate the two candidates at three independent levels, each
    reported as a margin over the runner-up rather than as an assertion. At the protein level Q25022 is
    99.55 per cent identical to HCON_00043670 with 2 differences, against 94.20 per cent and 26
    differences to the runner-up HCON_00005260 on chromosome I. At the nucleotide level the 1347-base
    coding sequence is 98.52 per cent identical to the HCON_00043670 CDS with 20 differences, 18 of them
    synonymous, against 79.36 per cent and 278 differences to HCON_00005260, so the margin widens from
    5.35 to 19.16 percentage points once silent sites are allowed to speak: purifying selection compresses
    protein divergence between the paralogs while their synonymous sites have drifted freely. At the exon
    level the two loci place introns at identical coding positions but share no single intron length, and
    isotype-2 carries a derived loss of the intron at coding position 1278 that isotype-1 and both
    chromosome X genes retain. The 20 nucleotide differences are read as isolate polymorphism rather than
    as a separate paralog. The isotype naming is a field convention rather than an ontology term, so the
    run anchored it three ways instead of asserting it: chromosome placement in a genome-wide selection
    study, NCBI record titles carrying the isotype label, and the original cDNA paper's own statement
    about isotype classes; WormBase ParaSite independently labels HCON_00005260 as tub8-9, and the
    alignment agrees, Q25024 being 2 differences from HCON_00005260 and 26 from HCON_00043670. This
    answers the question in this gap's significance clause, and it answers it the way the gene symbol does
    not invite: the best-matching locus is not the locus under primary benzimidazole selection. The
    canonical F167Y, E198A and F200Y mutations are scored in isotype-1 on chromosome I, and all four
    annotated beta-tubulin loci in the susceptible MHco3(ISE) reference carry Phe, Glu and Phe at those
    positions, which the local record confirms at Phe167, Glu198 and Phe200 of 448 residues. So this
    entry's residues describe a separate beta-tubulin isotype and not the benzimidazole-engaged pool, and
    they must not be read as the susceptible allele of the resistance gene. The run warns that any
    experimental-looking evidence line on this entry tracing to a benzimidazole resistance paper would
    almost certainly be paralog carry-over; that was checked here and the warning does not apply, because
    all seven existing annotations are IEA from GO_REFs with no experimental row among them. What is
    closed is the identity question this gap states. What remains is the second half of this gap's own
    resolution criterion, the isoform-resolved expression and benzimidazole-sensitivity assays, which are
    unperformed, and a residual the run states cannot be excluded by sequence comparison of any kind: an
    unannotated tandem duplicate about 99 per cent identical to HCON_00043670, which no assembly annotates
    and which would need read-depth evidence to rule out. The second listed assembly, PRJNA205202, has no
    complete isotype-2 gene model, so only the chromosome-scale assembly can adjudicate this. Five PubMed
    searches aimed at isotype 2 returned no primary functional, expression, knockdown or locus-level
    selection work, while all 12 beta-tubulin papers retrieved genotype isotype-1 only.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
  status: RESOLVED
  significance: >-
    Assigning beta 12-16 to a current locus or isotype class would clarify
    whether its F167, E198 and F200 residues describe the benzimidazole-engaged
    beta-tubulin pool or a separate H. contortus beta-tubulin isotype.
  resolution: >-
    Map the Q25022-specific sequence onto present H. contortus beta-tubulin
    loci, then assay isoform-resolved expression and benzimidazole sensitivity
    across susceptible and resistant isolates.
  provenance:
  - reference_id: PMID:1741017
    supporting_text: >-
      Sequences very similar or identical to beta 8-9 and beta 12-16 are
      present in both benzimidazole-sensitive and benzimidazole-resistant
      populations of H. contortus.
  - reference_id: file:HAECO/Q25022/Q25022-hypotheses/kgap-q25022-locus-identity/openscientist.md
    supporting_text: >-
      Q25022, the Geary beta 12-16 cDNA (GenBank M76491), corresponds to **HCON_00043670**, the
      **isotype-2** beta-tubulin gene on chromosome II
suggested_questions:
- question: >-
    Which modern H. contortus beta-tubulin locus or isotype class corresponds to
    beta 12-16, and is the encoded subunit incorporated into parasite
    microtubules that are engaged by benzimidazoles in vivo?
suggested_experiments:
- description: >-
    Map Q25022-specific variants onto the H. contortus beta-tubulin loci, then
    quantify beta 12-16-class expression across susceptible and resistant
    isolates with isoform-resolved transcript assays.
  hypothesis: >-
    The beta 12-16 cDNA represents a beta-tubulin isotype that is retained in
    both benzimidazole-sensitive and resistant parasite populations rather than
    the resistant-population-discriminating tub8-9-like gene product.
  experiment_type: comparative genomics and expression profiling
