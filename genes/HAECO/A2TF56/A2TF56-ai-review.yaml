suggested_questions:
- question: >-
    Which H. contortus alpha-tubulin partners and beta-tubulin isotype-1
    paralogs incorporate A2TF56-like F200Y alleles into parasite microtubules
    in vivo, and how do F167Y, E198A and F200Y alter benzimidazole sensitivity
    in each isotype background?
suggested_experiments:
- description: >-
    Reconstitute H. contortus alpha/beta-tubulin heterodimers containing A2TF56
    or susceptible isotype-1 variants and compare microtubule polymerization
    and benzimidazole binding or depolymerization in vitro.
  hypothesis: >-
    Sequence changes in resistant isotype-1 beta-tubulin alleles reduce
    benzimidazole sensitivity while preserving microtubule assembly.
  experiment_type: biochemical reconstitution
