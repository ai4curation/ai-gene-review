id: A2TF56
gene_symbol: A2TF56
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:6289
  label: Haemonchus contortus
description: >-
  A2TF56 is a full-length Haemonchus contortus beta-tubulin isotype-1
  sequence from a benzimidazole-resistant isolate and carries Tyr at the
  benzimidazole-resistance codon 200 while retaining Phe167 and Glu198. It
  contains the conserved Tubulin/FtsZ GTPase and C-terminal domains of
  beta-tubulins, and is expected to form alpha/beta-tubulin heterodimers that
  polymerize into the microtubule lattice.
