- id: file:genes/HAECO/A2TF56/A2TF56-bioinformatics/benzimidazole_resistance/RESULTS.md
  title: A2TF56 beta-tubulin benzimidazole-resistance-site alignment
  findings:
  - statement: >-
      An ungapped protein alignment maps A2TF56 Tyr200 to Phe200 in
      susceptible H. contortus beta-tubulin isotype-1 fragment MF034043 and to
      Phe200 in the older H. contortus tub8-9 cDNA M76493, while Phe167 and
      Glu198 are conserved in A2TF56.
    supporting_text: >-
      MF034043.1_susceptible_isotype1_partial,151,86,85,0.988,F,F,E,E,Y,F
- id: PMID:1741017
  title: Three beta-tubulin cDNAs from the parasitic nematode Haemonchus contortus.
  full_text_unavailable: true
  findings:
  - statement: >-
      Earlier H. contortus work cloned three beta-tubulin cDNAs from the same
      parasite species and framed beta-tubulin as the molecular target of
      benzimidazole anthelmintics, but those older cDNAs are not the exact
      A2TF56 accession.
    supporting_text: >-
      We have cloned and sequenced three beta-tubulin cDNAs from this organism,
      beta 12-16, beta 12-164, and beta 8-9.
- id: PMID:8366887
  title: >-
    Molecular characterisation of beta-tubulin genes present in
    benzimidazole-resistant populations of Haemonchus contortus.
  full_text_unavailable: true
  findings:
  - statement: >-
      H. contortus benzimidazole-resistant populations retain transcribed
      beta-tubulin isotype-1 genes, often after a reduction to one isotype-1
      gene per resistant population, and different selected fragments across
      populations indicate independent resistance origins.
    supporting_text: >-
      There was a reduction in beta-tubulin isotype 1 genes to usually one, in
      BZ-resistant populations.
core_functions:
- description: >-
    Full-length H. contortus beta-tubulin isotype-1 chain that can contribute
    the beta structural subunit and exchangeable GTP-binding site of
    alpha/beta-tubulin heterodimers in the microtubule lattice.
