id: Q00909
gene_symbol: TRI5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:229533
  label: Gibberella zeae (strain ATCC MYA-4620 / CBS 123657 / FGSC 9075 / NRRL 31084
    / PH-1)
description: >-
  TRI5 (FGSG_03537) encodes trichodiene synthase (EC 4.2.3.6), a soluble
  class I sesquiterpene cyclase of the wheat head blight fungus Fusarium
  graminearum (teleomorph Gibberella zeae). Using Mg2+ bound by its conserved
  NSE/DTE motif, the enzyme ionizes and cyclizes (2E,6E)-farnesyl diphosphate
  to trichodiene plus diphosphate, the first committed step that diverts
  isoprenoid flux into trichothecene biosynthesis. Recombinant enzyme produces
  mainly trichodiene with minor related cyclization products. Trichodiene is
  subsequently oxygenated by the cytochrome P450 TRI4 and further modified by
  other TRI cluster enzymes to give the type B trichothecene deoxynivalenol
  (DON) and its acetylated derivatives in strain PH-1 (or nivalenol in other
  chemotypes). TRI5 is a cytosolic protein enriched next to the ER-derived
  toxisome where downstream, membrane-anchored TRI enzymes reside; independent
  of its catalytic activity, TRI5 protein is required for normal toxisome
  morphology and for production of several non-trichothecene sesquiterpenes
  such as culmorin. TRI5 expression is induced in infection structures on
  wheat, is controlled by the cluster regulators TRI6 and TRI10 and by a
  cis-acting promoter-derived long non-coding RNA. Because TRI5 deletion
  abolishes trichothecene production, tri5 mutants are widely used to show
  that DON acts as a virulence factor: they cause local lesions on inoculated
  wheat spikelets but fail to spread through the rachis, whereas virulence on
  barley, maize and Arabidopsis floral tissue is largely unaffected. The
  host-side effect is exerted by DON itself, an inhibitor of eukaryotic
  ribosomes, rather than by the TRI5 protein.
existing_annotations:
- term:
    id: GO:0016106
    label: sesquiterpenoid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010458
  review:
    summary: >-
      InterPro2GO mapping from the ascomycete TRI5 family (IPR010458). TRI5
      catalyses the cyclization of farnesyl diphosphate to trichodiene, the
      first step of trichothecene (sesquiterpenoid) biosynthesis, so the gene
      product directly performs a step of this process.
    action: MODIFY
    reason: >-
      Correct but broad. For the PH-1 protein (a DON-producing strain), the
      specific pathway is known: trichodiene is the precursor of
      deoxynivalenol (vomitoxin), and TRI5 deletion abolishes DON synthesis.
      GO:0106110 vomitoxin biosynthetic process is a descendant of
      GO:0016106 (via mycotoxin and sesquiterpenoid biosynthesis), and GO
      already applies it to the TRI5 gene product under another UniProt
      accession (A0A1I9FCV5, TAS from PMID:38877764). The family-level IEA
      remains appropriate for the InterPro mapping itself, since the family
      includes trichothecene producers of other chemotypes.
    proposed_replacement_terms:
    - id: GO:0106110
      label: vomitoxin biosynthetic process
    supported_by:
    - reference_id: PMID:30664933
      supporting_text: The first step in DON synthesis is catalyzed by the sesquiterpene
        synthase (STS), Tri5 (trichodiene synthase), resulting in the cyclization
        of farnesyl diphosphate (FPP) to produce the sesquiterpene trichodiene.
    - reference_id: PMID:8589414
      supporting_text: The disrupted gene, Tri5, encodes the enzyme trichodiene
        synthase, which catalyzes the first step in trichothecene biosynthesis.
    - reference_id: PMID:38877764
      supporting_text: Deletion of TRI5 eliminates the ability of F. graminearum
        to synthesize DON
- term:
    id: GO:0016838
    label: carbon-oxygen lyase activity, acting on phosphates
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR024652
  review:
    summary: >-
      Trichodiene synthase (EC 4.2.3.6) is a carbon-oxygen lyase acting on
      phosphates (EC 4.2.3 subclass): it eliminates diphosphate from farnesyl
      diphosphate during cyclization.
    action: ACCEPT
    reason: >-
      A correct, if general, parent of trichodiene synthase activity derived
      from the trichodiene synthase family signature. Broad IEA terms that are
      true are acceptable; the specific activity is captured by GO:0045482.
    supported_by:
    - reference_id: PMID:30664933
      supporting_text: Tri5 was cloned and expressed in E. coli and shown to produce
        primarily trichodiene in addition to minor, related cyclization products.
- term:
    id: GO:0045482
    label: trichodiene synthase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010458
  - RHEA:12052
  - EC:4.2.3.6
  review:
    summary: >-
      TRI5 catalyses (2E,6E)-farnesyl diphosphate = trichodiene + diphosphate
      (RHEA:12052, EC 4.2.3.6). Recombinant F. graminearum TRI5 produces
      primarily trichodiene, and mutation of the Mg2+-binding motif
      (N225D/S229T) abolishes activity. This is the core molecular function.
    action: ACCEPT
    reason: >-
      Precise activity term, supported for this protein by heterologous
      expression and by loss of trichothecene production in deletion and
      catalytic-site mutants.
    supported_by:
    - reference_id: PMID:30664933
      supporting_text: Tri5 was cloned and expressed in E. coli and shown to produce
        primarily trichodiene in addition to minor, related cyclization products.
    - reference_id: PMID:30664933
      supporting_text: This shared precursor is produced by the cyclization of farnesyl
        pyrophosphate (FPP) by a sesquiterpene synthase (STS) called trichodiene
        synthase or Tri5
- term:
    id: GO:0045482
    label: trichodiene synthase activity
  evidence_type: IMP
  original_reference_id: PMID:18179606
  qualifier: enables
  review:
    summary: >-
      PHI-base annotation from a pathogenicity study of a PH-1 tri5 deletion
      mutant, which is unable to produce DON; the mutant causes only local
      eye-shaped lesions on wheat spikelets and fails to infect the rachis,
      but is fully pathogenic on Arabidopsis floral tissue.
    action: ACCEPT
    reason: >-
      The loss of DON production in the mutant is consistent with loss of the
      first enzyme of the pathway, and the activity itself is well
      established biochemically (PMID:30664933). The paper's main findings
      concern virulence, which is an indirect consequence of the toxin's
      action on host ribosomes rather than a function of TRI5 protein; GOA
      appropriately did not attach a host-interaction process term to TRI5
      from this study. Only the abstract is cached, so the curator's full
      reading is deferred to.
    supported_by:
    - reference_id: PMID:18179606
      supporting_text: The tri5 mutant, which is unable to produce DON, exhibited
        reduced pathogenicity on wheat ears, causing only discrete eye-shaped lesions
        on spikelets which failed to infect the rachis.
- term:
    id: GO:0005829
    label: cytosol
  evidence_type: TAS
  original_reference_id: PMID:30664933
  review:
    summary: >-
      TRI5 is a soluble cytosolic enzyme (no signal peptide or transmembrane
      segment), enriched in the cytosol between ER cisternae of the toxisome,
      adjacent to the ER-anchored downstream enzymes TRI1, TRI4 and TRI11.
    action: NEW
    reason: >-
      No cellular component annotation exists for TRI5. Its location is
      stated as established in the toxisome literature and is consistent with
      the absence of membrane-targeting features in the sequence. The
      toxisome is ER-derived, so an ER term would be inappropriate for the
      soluble enzyme.
    supported_by:
    - reference_id: PMID:30664933
      supporting_text: While it is established that Tri5 is a cytosolic enzyme (22,55,71)
        it also is enriched in the vicinity of the toxisome, seemingly within the
        layers of cytosol separating stacks of ER cisternae
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
- id: PMID:18179606
  title: Fusarium graminearum gene deletion mutants map1 and tri5 reveal similarities
    and differences in the pathogenicity requirements to cause disease on Arabidopsis
    and wheat floral tissue.
  findings:
  - statement: PH-1 tri5 deletion abolishes DON production and restricts wheat-ear
      disease to inoculated spikelets, but not disease on Arabidopsis floral tissue.
    supporting_text: This study reveals that DON mycotoxin production is not required
      for F. graminearum to colonize Arabidopsis floral tissue.
- id: PMID:8589414
  title: Reduced virulence of Gibberella zeae caused by disruption of a trichothecene
    toxin biosynthetic gene.
  findings:
  - statement: Tri5 encodes trichodiene synthase, the first enzyme of trichothecene
      biosynthesis; Tri5- strains have host-dependent reduced virulence.
    supporting_text: These results suggest that trichothecene production contributes
      to the virulence of G. zeae on some hosts.
- id: PMID:30664933
  title: Expression of the Fusarium graminearum terpenome and involvement of the endoplasmic
    reticulum-derived toxisome.
  findings:
  - statement: Recombinant TRI5 produces mainly trichodiene; TRI5 protein, independent
      of catalysis, is required for toxisome formation and non-trichothecene sesquiterpene
      synthesis.
    supporting_text: Our results indicate that the Tri5 protein, but not its enzymatic
      activity, is also required for the synthesis of non-trichothecene related sesquiterpenes
      and the formation of toxisomes.
- id: PMID:20507460
  title: Involvement of trichothecenes in fusarioses of wheat, barley and maize evaluated
    by gene disruption of the trichodiene synthase (Tri5) gene in three field isolates
    of different chemotype and virulence.
  findings:
  - statement: Tri5 disruption mutants fail to spread beyond inoculated wheat spikelets;
      the contribution of trichothecenes to virulence is host- and chemotype-dependent.
    supporting_text: all disruption mutants caused disease symptoms on the inoculated
      spikelet, but the symptoms did not spread into other spikelets.
- id: PMID:21798058
  title: Fusarium graminearum forms mycotoxin producing infection structures on wheat.
  findings: []
- id: PMID:38877764
  title: The trichothecene mycotoxin deoxynivalenol facilitates cell-to-cell invasion
    during wheat-tissue colonization by Fusarium graminearum.
  findings:
  - statement: DON synthesis requires TRI5; DON (not TRI5 protein) facilitates
      cell-to-cell invasion of wheat tissue.
    supporting_text: Deletion of TRI5 eliminates the ability of F. graminearum to
      synthesize DON
