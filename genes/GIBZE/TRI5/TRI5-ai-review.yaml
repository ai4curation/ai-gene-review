suggested_questions:
- question: >-
    Does TRI5 physically associate with the cytosolic faces of the
    ER-anchored TRI1, TRI4 and TRI11 enzymes or with toxisome membranes, and
    is this association what makes TRI5 protein (independent of catalysis)
    necessary for toxisome morphology and culmorin synthesis?
- question: >-
    Should a virulence or host-interaction process be attached to TRI5 at
    all, given that the host-side effect (ribosome inhibition, cell-to-cell
    invasion through the rachis) is exerted by DON rather than by the
    enzyme? GOA currently carries none, which seems correct.
suggested_experiments:
- description: >-
    Proximity labelling (TurboID) or split-fluorescent-protein assays with
    TRI5 and the ER-anchored TRI1/TRI4/TRI11 under toxin-inducing conditions,
    comparing wild-type and the catalytically inactive N225D/S229T allele,
    to test the proposed scaffolding role of TRI5 at the toxisome.
- description: >-
    Chemical complementation of a PH-1 tri5 deletion with trichodiene or
    DON applied in planta at the rachis node to separate the toxin's
    contribution to spread from any other contribution of TRI5 protein.
