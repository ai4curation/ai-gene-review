id: A0A059T5F6
gene_symbol: acrIIA2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1458856
  label: Listeria phage LP-101
description: AcrIIA2 is a 123-residue acidic protein of the Listeria phage LP-101,
  an orthologue of the AcrIIA2 inhibitors encoded by Listeria monocytogenes prophages,
  which neutralise the host type II-A CRISPR-Cas9 system and thereby allow phage and
  prophage DNA to persist in a Cas9-competent cell. It works as a DNA mimic. Highly
  acidic surface residues let it bind guide-RNA-loaded Cas9 at the position the target
  duplex would occupy, contacting the protospacer-adjacent-motif recognition residues
  and so preventing the enzyme from detecting double-stranded DNA. Inhibition is stoichiometric
  and competitive with target DNA, requires the guide RNA to be loaded before the binding
  surface exists, and extends to Cas9 orthologues sharing only about half their sequence,
  because the occluded surface is conserved. The binding motif used is distinct from
  that of the unrelated Listeria inhibitor AcrIIA4, so the two proteins represent independent
  evolutionary arrivals at the same strategy against the same enzyme surface.
