    summary: The AcrIIA2 family inhibits both the native Listeria monocytogenes Cas9 and the heterologous
      Streptococcus pyogenes Cas9, in bacteria and in human cells, and the crystal structure of the inhibited
      complex has been solved. GO:0098672 is the correct and maximally specific process term. This accession
