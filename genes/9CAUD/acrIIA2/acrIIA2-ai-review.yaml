  label: Listeria phage LP-101
description: AcrIIA2 of Listeria phage LP-101 is a 123-residue homologue of characterized Listeria prophage
  anti-CRISPR proteins. Those homologues bind guide-loaded Cas9 and occupy the target-DNA recognition
  surface through an acidic DNA-mimicking interface, inhibiting type II-A interference. The LP-101 protein
  differs at nine positions from the assayed J0161 reference protein, so its mechanism and potency are
  inferred from family membership and close sequence similarity rather than measured directly on this
  accession.
