knowledge_gaps:
- gap_statement: No function has been measured on this accession. Every functional
    claim for A0A059T5F6 is transferred from the 92.7 percent identical Listeria monocytogenes
    prophage protein AEO04363.1, and GOA holds no annotations for it at all.
  boundary: The AcrIIA2 family's mechanism is firmly established by a crystal structure
    of the inhibited complex and by in vivo inhibition of two Cas9 orthologues. What
    is unmeasured is whether this particular phage orthologue, with its nine substitutions,
    retains full potency, and whether the LP-101 phage actually depends on it.
  gap_kind:
  - CURATION
  - BIOLOGY
  status: OPEN
  significance: This accession is the gene-product-level exemplar for the AcrIIA2
    convergence case in modules/anti_crispr_suppression.yaml, and the module cites
    the structural paper as evidence for it. A reader following the accession reaches
    an unreviewed entry whose protein name is a ProtNLM machine prediction, with no
    experiment on the sequence itself. This is the same accession-level slippage the
    module already records as an open gap for the AcrIII-1 exemplar.
  resolution: Either assay the LP-101 protein directly, by expressing LP101_024 and
    testing inhibition of Lmo Cas9 and SpyCas9 and deleting it from the phage, or
    replace the module's gene-product selector with the assayed prophage sequence
    and keep LP101_024 as a family member.
  provenance:
  - reference_id: PMID:28041849
    supporting_text: AcrIIA2- (AEO04363.1), AcrIIA3- (CBY03209.1) and AcrIIA4- (AEO04689.1)
      homologous protein sequences were acquired by BLASTp searches
- gap_statement: Whether AcrIIA2 inhibits only target licensing, as pure PAM-site
    occlusion predicts, or additionally interferes with the cleavage step, is undetermined.
  boundary: The structure establishes occupancy of the PAM-recognition residues and
    competition with the target duplex. The ambiguity is about a possible second,
    post-licensing effect.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Pure occlusion of the PAM-reading surface should affect DNA binding
    and DNA cleavage equally, because nothing downstream can happen without licensing.
    The genetics showed a larger effect on cleavage than on dCas9 binding, which if
    real would mean AcrIIA2 belongs partly in the module's nuclease-neutralisation
    part as well as in its recognition-blockade part, and would move it off the pure
    AcrIIA4 analogy.
  resolution: Compare AcrIIA2 inhibition of dCas9 target binding and of wild-type
    Cas9 cleavage side by side with purified components and matched stoichiometries,
    rather than in a heterologous reporter system.
  provenance:
  - reference_id: PMID:28041849
    supporting_text: The enhanced efficacy of acrIIA2 in the cleavage-based Cas9 assay
      relative to the dCas9 based assay suggests that it may inhibit both binding
      and cleavage to some degree
suggested_questions:
- question: AcrIIA2 and AcrIIA4 occlude the same Cas9 surface with different binding
    motifs and no sequence relationship. Does the Cas9 PAM-interacting domain show
    signatures of selection driven by both, or has it been unable to escape because
    the mimicked feature, the phosphate backbone, cannot be abandoned?
  experts:
  - Yanli Wang
  - Joseph Bondy-Denomy
- question: Do the nine substitutions separating the LP-101 orthologue from the assayed
    prophage protein alter potency against Lmo Cas9, and is the Listeria phage-versus-prophage
    split reflected in two functionally distinct AcrIIA2 subfamilies?
  experts:
  - Yanli Wang
- question: Why does the apparent effect of AcrIIA2 on Cas9 cleavage exceed its effect
    on DNA binding, if the mechanism is occlusion of the PAM-recognition site upstream
    of both?
  experts:
  - Joseph Bondy-Denomy
suggested_experiments:
- hypothesis: The LP-101 orthologue is functionally equivalent to the assayed Listeria
    prophage AcrIIA2, so the nine substitutions are neutral with respect to Cas9 inhibition.
  description: Express LP101_024 and AEO04363.1 side by side, then measure Cas9 inhibition
    on three readouts at matched protein concentrations, namely isothermal titration
    calorimetry against sgRNA-loaded SpyCas9, in vitro plasmid cleavage, and plasmid
    interference rescue in a Cas9-competent host. Equivalence would retrospectively
    justify the ISS annotations here and let them be upgraded; divergence would mean
    the module's exemplar must be swapped for the assayed sequence.
  experiment_type: side-by-side orthologue potency comparison
- hypothesis: AcrIIA2 inhibition is competitive with target DNA, which is the operational
    test of the mimicry claim.
  description: Titrate AcrIIA2 against sgRNA-loaded dCas9 across a range of target
    duplex concentrations and fit the inhibition surface to competitive and non-competitive
    models. A mimic should lose apparent potency as duplex concentration rises; a
    failure of that prediction would mean the acidic surface binds at the same place
    as DNA without being outcompeted by it, which is a different mechanism and would
    need different wording in the proposed molecular function.
  experiment_type: competitive binding isotherm analysis
- hypothesis: acrIIA2 is required for LP-101 to replicate on a Cas9-competent Listeria
    host.
  description: Delete LP101_024 from phage LP-101 and compare plaquing efficiency
    on a Listeria monocytogenes host with an intact type II-A system against an isogenic
    cas9 deletion, with complementation in trans as the control. This is the necessity-and-sufficiency
    test that grounded the original anti-CRISPR assignments, and it has not been done
    for a free Listeria phage; it would also convert these ISS annotations into experimental
    ones on this very accession.
  experiment_type: phage gene deletion and plaquing assay
