  supporting_entities:
  - UniProtKB-KW:KW-0479
  review:
    summary: Mapped electronically from keyword KW-0479 (Metal-binding), which in
      this entry derives entirely from Ca(2+) ions modelled in the 1.50 Angstrom crystal
      form PDB 5GNF. The ions are coordinated by residues 2, 3, 65, 66 and 70, that
      is by the extreme N-terminus and a surface stretch, and the paper that produced
      that structure assigns no role to calcium anywhere. The independent 2.60 Angstrom
      AcrF3-Cas3 complex PDB 5B7I contains no calcium, and the inhibition mechanism
      it reports is purely steric masking of Cas3 surfaces, chemistry that requires
      no cofactor.
    action: MARK_AS_OVER_ANNOTATED
    reason: The Ca(2+) density is a real observation in a real deposited structure,
      so asserting that metal ion binding is simply false would overstate the case;
      what is unsupported is the inference that metal binding is a function of this
      protein. Terminal and surface-exposed Ca(2+) at high resolution are the classic
      signature of ions picked up from the crystallisation liquor, the second independent
      structure of the same protein has none, and no paper on AcrF3 describes a metal
      requirement, a metal-dependent activity, or a conserved metal site. MARK_AS_OVER_ANNOTATED
      rather than REMOVE for that reason. This is an electronic keyword mapping rather
      than an experimental annotation, and the relevant full text (PMID:27585537)
      is cached and has been read, so challenging it does not amount to second-guessing
      a curator who saw evidence unavailable here. Separately, this is the only annotation
      GOA holds for L7P7R7, so the single molecular function on record for a structurally
      well-characterised Cas3 inhibitor is a crystallisation artefact.
    supported_by:
    - reference_id: PMID:27585537
      supporting_text: our structural analysis of the Cas3-AcrF3 complex revealed
        that the AcrF3 dimer binds to HD, Linker and CTD domains of the Cas3 protein,
        therefore blocking the replaced non-complementary DNA access of Cas3
    - reference_id: PMID:27455460
      supporting_text: AcrF3 forms a homodimer that locks PaCas3 in an ADP-bound form,
