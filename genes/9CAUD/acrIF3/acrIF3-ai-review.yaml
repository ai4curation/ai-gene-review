knowledge_gaps:
- gap_statement: It is undetermined whether AcrF3 can extract Cas2/3 that is already engaged with a licensed
    R-loop, or whether it can only intercept free Cas2/3 before recruitment.
  boundary: That AcrF3 prevents recruitment, and which Cas3 surfaces it masks, are both established structurally.
    The ambiguity concerns the order of events, not the interaction.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The two possibilities differ in what they demand of the phage. Intercepting free Cas2/3
    requires only that AcrF3 reach inhibitory concentration before the first target is licensed, which
    is a race the phage can win by expressing early. Displacing an engaged nuclease would make the inhibitor
    effective at any point in the infection, and would also explain how a phage rescues itself after a
    delay.
  resolution: Assemble Csy complex on a target duplex, recruit Cas2/3, then add AcrF3 and follow dissociation
    and DNA degradation, comparing against addition of AcrF3 before recruitment.
  provenance:
  - reference_id: PMID:26416740
    supporting_text: The third anti-CRISPR protein operates by binding to the Cas3 helicase-nuclease and
      preventing its recruitment to the DNA-bound CRISPR-Cas complex.
suggested_questions:
- question: Does AcrF3 sequestration of Cas2/3 leave the host with a functional sequence-specific DNA-binding
    module that has physiological consequences of its own, beyond the reported transcriptional repression,
    for instance interference with replication at self-targeting loci?
  experts:
  - Alan R. Davidson
  - Karen L. Maxwell
- question: Is the Ca(2+) seen at the AcrF3 N-terminus and surface in PDB 5GNF conserved across AcrF3-family
    members, or is it unique to that crystal form, which would settle the GO:0046872 question definitively?
  experts:
  - Yanli Wang
- question: Cas3 sequestration has no counterpart against class 2 systems, where recognition and cleavage
    sit in one protein. Is that why class 2 inhibitors converged instead on domain blockade, as AcrIIC1
    does, and guide destruction, as AcrVA1 does?
  experts:
  - Joseph Bondy-Denomy
suggested_experiments:
- hypothesis: Calcium is not required for AcrF3 function, so the GO:0046872 annotation reflects crystallisation
    conditions rather than biology.
  description: Measure AcrF3 dimerisation by size-exclusion chromatography with inline light scattering,
    and AcrF3-Cas2/3 affinity by isothermal titration calorimetry, in buffers with saturating Ca(2+),
    with no added divalent cation, and with EDTA, then test inhibition of Cas2/3-dependent plasmid degradation
    under the same three conditions. Calcium-independence across all three readouts would support removing
    the keyword outright rather than only marking the annotation over-annotated.
  experiment_type: metal-dependence titration with paired binding and activity readouts
- hypothesis: AcrF3 can only intercept free Cas2/3 and cannot displace an already recruited nuclease.
  description: Reconstitute the licensed interference intermediate by assembling Csy complex on a matched
    protospacer duplex and recruiting purified Cas2/3, then add AcrF3 either before or after recruitment
    and score target degradation and complex composition by native gel and mass photometry. An order-of-addition
    effect is the prediction; its absence would mean AcrF3 is an active disassembly factor rather than
    a sequestering agent, which would change the molecular function assigned here.
  experiment_type: order-of-addition reconstitution assay
- hypothesis: AcrF3 blocks primed spacer acquisition in vivo, and does so to a greater extent than inhibitors
    that act on the surveillance complex.
  description: Challenge Pseudomonas aeruginosa PA14 carrying an intact type I-F system with a partially
    mismatched protospacer plasmid while inducing either AcrF3 or the Csy-blocking gp30, then deep sequence
    the CRISPR arrays for newly acquired spacers. The mechanisms predict different outcomes, since a Csy
    blocker prevents the initial recognition that priming starts from whereas AcrF3 permits recognition
    but removes the nuclease, so comparing them tests whether priming requires Cas2/3 activity or only
    target engagement.
  experiment_type: CRISPR array deep sequencing with paired inhibitor comparison
