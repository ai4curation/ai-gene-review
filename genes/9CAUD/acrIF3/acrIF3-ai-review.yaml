core_functions:
- description: Binds the host type I-F Cas2/3 helicase-nuclease as a homodimer, locking
    it in an ADP-bound state and masking the linker region and C-terminal domain through
    which the crRNA-guided Csy surveillance complex recruits it, so that Cas2/3 cannot
    interact with the complex or localise to the bound target; target recognition
    is left fully intact and only the destruction step is lost, which additionally
    blocks primed spacer acquisition
