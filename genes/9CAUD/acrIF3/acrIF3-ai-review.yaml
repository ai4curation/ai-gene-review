      proposed. The evidence code is IDA rather than ISS because PDB 5B7I, 5GNF and
      5GQH all carry chains spanning residues 1 to 139 of this accession, so the structural
      work was done on this sequence. GO:0005515 protein binding would be the uninformative
      alternative and is avoided.
