  label: Pseudomonas phage JBD5
description: AcrF3 (AcrIF3) is a 139-residue homodimeric anti-CRISPR protein of Pseudomonas phage JBD5.
  It binds the type I-F Cas2/3 helicase-nuclease, stabilizes an ADP-bound state and masks surfaces required
  for recruitment to the DNA-bound Csy surveillance complex. Target recognition by Csy is retained, but
  downstream DNA destruction and Cas3-dependent primed spacer acquisition are inhibited. The target-bound,
  nuclease-free surveillance complex can consequently repress transcription.
