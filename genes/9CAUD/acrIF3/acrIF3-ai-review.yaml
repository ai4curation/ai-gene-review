id: L7P7R7
gene_symbol: acrIF3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1223261
  label: Pseudomonas phage JBD5
description: AcrF3 is a 139-residue homodimeric protein of the Pseudomonas aeruginosa
  phage JBD5 that disables the host type I-F CRISPR-Cas system by sequestering its
  effector nuclease. Unlike inhibitors that block target recognition, AcrF3 leaves
  the crRNA-guided Csy surveillance complex free to find and bind its target; what
  it prevents is the arrival of the enzyme that would destroy that target. The dimer
  clamps the Cas2/3 helicase-nuclease, locking it in an ADP-bound state, occluding
  the entrance to the DNA-binding tunnel of its helicase domain, and masking the linker
  region and C-terminal domain through which the Csy complex recruits it, so Cas2/3
  can neither be delivered to the R-loop nor act on DNA. Because recruitment is blocked,
  the host also loses the ability to acquire new spacers by priming, so the phage escapes
  both immediate interference and the updating of CRISPR memory against it. A side
  consequence of leaving a target-bound but nuclease-free surveillance complex in place
  is that the inhibited system behaves as a sequence-specific transcriptional repressor.
  The mechanism is available only against class 1 CRISPR systems, in which target recognition
  and target destruction reside in separate proteins.
