      the occluded surfaces.
    action: NEW
    reason: GOA holds no process or mechanism term for L7P7R7 at all, only the keyword-derived
      metal ion binding row. GO:0140311 is asserted because its definition fits literally
      and in both of its clauses, namely binding a protein to prevent it from interacting
      with other partners, and inhibiting its localization to the area of the cell
      or complex where it is active. This is the one anti-CRISPR mechanism in modules/anti_crispr_suppression.yaml
