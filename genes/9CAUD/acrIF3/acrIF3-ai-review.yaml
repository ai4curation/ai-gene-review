- term:
    id: GO:0030430
    label: host cell cytoplasm
  evidence_type: IC
  original_reference_id: PMID:26416740
  review:
    summary: AcrF3 is translated from the JBD5 genome inside the infected Pseudomonas
      aeruginosa cell and sequesters the host Cas2/3 protein there. Inhibition, and
      the conversion of the host system into a transcriptional repressor, are both
      demonstrated in living cells, so the protein must act in the host cytoplasm;
      the structures were determined in vitro, so the location is inferred rather
      than measured.
    action: NEW
    reason: The UniProt taxon for this entry is the phage, so the host-qualified component
      term is the correct one and GO:0005737 cytoplasm would be wrong for a viral
      protein acting in another organism. The same assignment with the same IC code
      was made for the type I-F inhibitors AcrF8 (genes/BPZF4/AcrF8) and gp30 (genes/BPD31/orf30).
