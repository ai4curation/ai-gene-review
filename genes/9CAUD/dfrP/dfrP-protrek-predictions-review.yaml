    id: GO:0031427
    label: response to methotrexate
  predicted_term_type: GO_BP
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PATHWAY_CONTEXT_IGNORED
    summary: >-
      Rank 3 (score 16.10), with methotrexate binding behind it at rank 4. Methotrexate is a DHFR
      inhibitor used in mammalian cell biology and oncology; the term is transferred from vertebrate
      DHFR entries where MTX response is heavily studied. It is doubly inapt here: a bacteriophage
      protein has no methotrexate exposure to respond to, and this review notes the relevant pharmacology
      for the DfrA family is trimethoprim resistance, not methotrexate. An inhibitor-sensitivity property
      is also not a biological process the protein participates in.
    supported_by:
