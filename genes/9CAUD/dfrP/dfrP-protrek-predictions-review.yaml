description: >-
  ProTrek sequence-to-text retrieval for DfrP, a phage-encoded dihydrofolate reductase carried by
  Bacillus phage phiNIT1 as an auxiliary metabolic gene. The top call is an exact GOA match and the
  correct enzymatic activity; ranks 2 and 3 then attach host-pharmacology context that does not belong
  to a phage AMG. The free-text Function channel returns the canonical DHFR comment. Assessment: 1
  correct not novel (CNN), 1 uncertain (UNC), 1 nonparalog incorrect (NPI).
