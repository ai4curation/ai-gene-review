- term:
    id: GO:0046452
    label: dihydrofolate metabolic process
  evidence_type: ISS
  review:
    summary: DfrP carries out the chemistry on dihydrofolate itself, reducing 7,8-dihydrofolate
      to 5,6,7,8-tetrahydrofolate with NADPH, so it participates in dihydrofolate metabolism
      rather than merely being required for it. This statement was previously supplied
      by TreeGrafter (GO_REF:0000118, PTN000167324, now retired). Its replacement in
      GOA, tetrahydrofolate biosynthetic process (GO:0046654), is a sibling under
      folic acid-containing compound metabolic process (GO:0006760), not an ancestor,
      so without this NEW the DHF-side statement is lost.
    action: NEW
    reason: The dihydrofolate reductase activity (GO:0004146) is accepted. Comparator
      check on 2026-10-01 (QuickGO) found that canonical DHFRs carry this term. Human DHFR (P00374)
      has it by direct assay (PMID:2303423, PMID:23707606), and E. coli folA (P0ABQ4)
      and mouse Dhfr (P00375) have it by IBA from the PAINT node PTN000167322 in the
      same PANTHER family (PTHR48069). Asserted by similarity because TreeGrafter no
      longer propagates to this viral sequence.
    supported_by:
    - reference_id: file:9CAUD/dfrP/dfrP-deep-research-openai.md
      supporting_text: DfrP catalyzes the NADPH-dependent reduction of dihydrofolate
        to tetrahydrofolate
