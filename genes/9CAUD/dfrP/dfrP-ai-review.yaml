- term:
    id: GO:0046654
    label: tetrahydrofolate biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  retired: true
  review:
    summary: Core biological process. DfrP directly catalyzes the final step in THF
      biosynthesis - the reduction of 7,8-dihydrofolate to 5,6,7,8-tetrahydrofolate.
      This is not merely modulation of a host process; the phage-encoded enzyme directly
      performs the biosynthetic reaction. THF is essential for thymidylate synthesis
      (DNA precursor), purine synthesis, and amino acid biosynthesis. The phage carries
      this gene as an auxiliary metabolic gene to ensure robust THF production during
      viral DNA replication, forming a complete folate cycle together with its thymidylate
      synthase (thyA) gene.
    action: ACCEPT
    reason: The same term is still present via InterPro2GO (GO_REF:0000002).
      Retired because absent from GOA as of the 2026-07-27 QuickGO release (GOA refresh
      2026-09-29); the review is kept for provenance.
    supported_by:
    - reference_id: file:9CAUD/dfrP/dfrP-deep-research-openai.md
      supporting_text: This reaction is essential for regenerating THF, the active
        form of folate, which is required for one-carbon transfer reactions in the
        cell
    - reference_id: file:9CAUD/dfrP/dfrP-deep-research-openai.md
      supporting_text: the reaction catalyzed by DfrP is needed to produce THF for
        the de novo synthesis of glycine and purines, and for the continuous production
        of DNA precursors like thymidine (via the thymidylate synthase pathway)
    - reference_id: file:9CAUD/dfrP/dfrP-deep-research-openai.md
      supporting_text: By providing its own DHFR and TS, phiNIT1 ensures that the
        infected host cell can efficiently produce dTMP and other nucleotides, even
        if host pathways are downregulated or if folate pools become limiting
    - reference_id: file:9CAUD/dfrP/dfrP-deep-research-openai.md
      supporting_text: The combined presence of TS and DHFR in phiNIT1 means the phage
        can form a complete folate cycle independent of host regulation, securing
        a robust supply of DNA building blocks for phage genome synthesis
