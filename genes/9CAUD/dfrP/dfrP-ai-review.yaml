taxon:
  id: NCBITaxon:207656
  label: Bacillus phage phiNIT1
description: Phage-encoded dihydrofolate reductase (DHFR) that catalyzes the NADPH-dependent
  reduction of dihydrofolate (DHF) to tetrahydrofolate (THF). DfrP is an auxiliary
  metabolic gene (AMG) encoded by Bacillus phage phiNIT1, a Bastilleviridae phage.
  The phage carries both dfrP and thyA (thymidylate synthase) genes to form a self-sufficient
  thymidine synthesis cycle during infection. This ensures robust nucleotide production
  for viral DNA replication. DfrP belongs to the trimethoprim-resistant DfrA family
  of DHFRs, which can confer antibiotic resistance to the infected host cell.
