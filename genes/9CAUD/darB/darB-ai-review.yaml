id: Q9XJG2
gene_symbol: darB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:10678
  label: Punavirus P1
description: >-
  Unreviewed 512-amino-acid N-terminal sequence fragment (DarB', UniProt Q9XJG2) of
  bacteriophage P1 defense against restriction protein B (DarB; full-length 2,255-residue,
  251 kDa protein represented by reviewed entry Q71TF8), sequenced from the region
  immediately upstream of the P1 ssb gene. This N-terminal region encompasses the
  predicted SAM-dependent Type II adenine DNA methyltransferase M.TaqI-like domain
  (InterPro IPR011639; Pfam PF07669, residues 44-119), whereas full-length DarB also
  contains a central superfamily 2 DExD-like helicase domain. During P1 virion morphogenesis,
  DarB is packaged into the phage capsid in a pathway dependent on DarA, Hdf, and Ulx
  and is co-ejected with the viral genome into the host bacterial cytoplasm upon infection,
  where it acts strictly in cis to protect packaged phage or transduced DNA against
  host Type I restriction-modification systems (such as EcoB and EcoK) and BREX defense.
existing_annotations:
- term:
    id: GO:0006304
    label: DNA modification
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  review:
    summary: >-
      InterPro2GO maps the N-terminal Type II methyltransferase M.TaqI-like and DNA
      protection/modification domains (IPR011639, IPR052933) to DNA modification. While
      the sequence carries a SAM-dependent methyltransferase signature, the established
      biological process of P1 DarB is cis-acting antirestriction protection of
      virion-packaged DNA against host Type I restriction-modification systems.
    action: MODIFY
    reason: >-
      GO:0006304 (DNA modification) is an overly broad domain-based inference, and direct
      catalytic DNA methylation by P1 DarB has not been biochemically demonstrated. The
      specific, experimentally established biological process of DarB is evasion of host
      restriction-modification systems (GO:0099018).
    proposed_replacement_terms:
    - id: GO:0099018
      label: symbiont-mediated evasion of host restriction-modification system
    supported_by:
    - reference_id: PMID:3029954
      supporting_text: The darA and darB gene products are found in the phage head and protect any DNA packaged into a phage head, including transduced chromosomal markers, from restriction
    - reference_id: file:9CAUD/darB/darB-deep-research-falcon.md
      supporting_text: Several sources describe phage P1 **DarA/DarB** as **virion-associated proteins** that are delivered early during infection and **protect phage DNA** against host restriction systems
- term:
    id: GO:0008168
    label: methyltransferase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      UniProtKB keyword mapping (KW-0489 Methyltransferase) assigns general methyltransferase
      activity based on the conserved N-terminal Type II adenine-specific DNA methyltransferase
      M.TaqI-like domain (residues 44-119, Pfam PF07669 / InterPro IPR011639).
    action: MODIFY
    reason: >-
      The N-terminal domain captured in this 512-aa DarB' fragment specifically belongs to
      the Type II DNA methyltransferase M.TaqI-like family (IPR011639 / PANTHER PTHR41313),
      making GO:0009008 (DNA-methyltransferase activity) a more informative molecular
      function term than generic GO:0008168 (methyltransferase activity).
    proposed_replacement_terms:
    - id: GO:0009008
      label: DNA-methyltransferase activity
    supported_by:
    - reference_id: file:9CAUD/darB/darB-uniprot.txt
      supporting_text: /note="Type II methyltransferase M.TaqI-like"
    - reference_id: file:9CAUD/darB/darB-deep-research-falcon.md
      supporting_text: The UniProt entry provided (Q9XJG2) describes **DarB′**, annotated as a **“DNA methylase homolog DarB′”** (fragment) from **Punavirus P1**, with predicted domains consistent with a SAM-dependent DNA methyltransferase superfamily
- term:
    id: GO:0032259
    label: methylation
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >-
      Broad biological process mapped from the UniProt Methyltransferase keyword. Although
      the N-terminal domain of DarB has a conserved SAM-dependent methyltransferase fold,
      catalytic methylation has not been biochemically verified, and the primary biological
      role of DarB is antirestriction defense of injected viral DNA.
    action: KEEP_AS_NON_CORE
    reason: >-
      Retained as a non-core domain-level process annotation reflecting the conserved
      SAM-dependent methyltransferase domain, whereas the core biological role of P1 DarB
      is symbiont-mediated evasion of host restriction-modification systems (GO:0099018).
    supported_by:
    - reference_id: file:9CAUD/darB/darB-deep-research-falcon.md
      supporting_text: Given the UniProt-provided domain annotations (SAM-dependent MTase superfamily; TaqI-like; Eco57I-like), the *most plausible inferred biochemical function* is **DNA base methylation using SAM/AdoMet as the methyl donor**
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: NAS
  original_reference_id: PMID:3029954
  review:
    summary: >-
      DarB is packaged into the P1 phage head and injected along with the viral DNA into
      the recipient bacterial cytoplasm, where it acts in cis to protect the entering DNA
      from host Type I restriction endonucleases.
    action: NEW
    reason: >-
      Added to capture the intracellular site of antirestriction action following virion
      DNA injection into the host cell.
    supported_by:
    - reference_id: PMID:3029954
      supporting_text: The darA and darB gene products are found in the phage head and protect any DNA packaged into a phage head, including transduced chromosomal markers, from restriction. The proteins must, therefore, be injected into recipient cells along with the DNA.
