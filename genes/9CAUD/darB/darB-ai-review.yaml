  description: >-
    Phage-encoded, virion-injected antirestriction factor whose N-terminal region
    (captured in the 512-aa Q9XJG2 fragment) carries a conserved SAM-dependent Type II
    DNA-methyltransferase M.TaqI-like domain (InterPro IPR011639). While catalytic
    DNA methylation remains a domain-level inference awaiting direct biochemical assay,
    full-length P1 DarB is experimentally established to be packaged into the phage
    head and co-ejected with viral DNA into the host cytoplasm, where it acts in cis
    to protect packaged DNA against host Type I restriction-modification systems
    (EcoB, EcoK) and BREX.
