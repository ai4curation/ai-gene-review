id: A0SMN5
gene_symbol: DMS3-25
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2913973
  label: Pseudomonas phage DMS3
description: >-
  DMS3-25 is a 175-residue protein encoded by Pseudomonas phage DMS3, a temperate
  phage that forms lysogens of Pseudomonas aeruginosa. Its gene lies within the
  phage head-morphogenesis region but is transcribed divergently from the
  DNA-packaging operon beside it, in the position and orientation typical of a
  prophage accessory (moron) gene rather than a structural one. The protein is a
  homologue of Rip1 (ring interacting pore 1), a prophage-encoded antiphage
  defence protein that recognises the oligomeric, ring-shaped portal and small
  terminase complexes of an infecting phage, uses one of those rings as a
  template to polymerise, and inserts into the membrane as a pore. The pore
  arrests assembly of the incoming phage's virions and kills the infected cell
  prematurely, so a single small polypeptide carries both the sensing and the
  effector step of the defence, a bacterial counterpart of eukaryotic
  pore-forming immunity. Mutant-phenotype evidence from deletion and
  loss-of-function alleles of this gene supports a role in defence against
  phage. Apart from that phenotype and the family assignment the protein is
  uncharacterised: UniProt names no function, domain, family or keyword for it
  and sets its protein existence level to Predicted.
existing_annotations:
- term:
    id: GO:0051607
    label: defense response to virus
  evidence_type: IMP
  original_reference_id: PMID:41639445
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      CACAO row, and the only GO annotation this protein has. GOA actually carries
      two rows for this exact tuple of term, evidence code, reference and
      qualifier, differing only in ECO subtype (ECO:0001175 deletion mutation
      phenotypic evidence, ECO:0007089 loss-of-function mutant phenotype
      evidence); the review schema does not represent ECO, so this one entry
      covers both. Together they say the curator saw a deletion and a
      loss-of-function allele of this gene lose antiphage defence. The cited paper
      describes Rip1, a 164-residue prophage-encoded protein that senses the
      oligomeric portal or small terminase ring of an infecting phage, polymerises
      on it, and assembles into a membrane-disrupting pore that blocks virion
      assembly and kills the host cell early. Its abstract is the only readable
      text (Nature paywall, no PMC or Europe PMC record, no preprint) and does not
      name DMS3, and it describes two kinds of protein on opposite sides of the
      same defence: Rip1, which executes it, and the phage rings, which trigger
      it. Which one this entry is was therefore settled by sequence, using the two
      chains of the paper's own cryo-EM structure (PDB 9OOX, HK446 Rip1 bound to
      phage T6 small terminase) as the two reference points. A0SMN5 aligns to Rip1
      over its full length at 30.8% identity with the C-terminal twin CxxC module
      conserved, and scores negative against the small terminase; its gene is also
      divergent from the DMS3 packaging operon rather than in it. This protein is
      the defence effector, so GO:0051607 defense response to virus is the right
      term, and it is the term GO uses for bacterial antiphage defence systems.
    action: ACCEPT
    reason: >-
      The claim is correct, supported by mutant-phenotype experiments on this gene
      in the cited paper, and GO:0051607 is the appropriate granularity: GO has no
      abortive-infection term, and none of this term's non-regulation children
      fits a bacterial pore-forming defence (GO:0009616 is RNAi-mediated,
      GO:0140374 antiviral innate immune response is the metazoan innate-immunity
      branch, and GO:0044790 suppression of viral release by host names release
      rather than assembly). The only defect is the GAF qualifier.
      acts_upstream_of_or_within_positive_effect describes a gene product that
      influences a process from outside it, which is exactly what the activating
      phage portal and terminase rings do, and is not what this protein does: it
      integrates sensing and effector activity and forms the pore itself, so
      involved_in is correct. That is a source-record field error, recorded in
      source_defects, and not a reason to reject the claim; the same resolution
      was reached for the equivalent row in genes/9CAUD/acrIIA5. Retained as the
      core function of the gene.
    supported_by:
    - reference_id: PMID:41639445
      supporting_text: Here we describe a 164-residue prophage-encoded protein that defends bacteria
        by sensing conserved oligomeric components of phage assembly.
      reference_section_type: ABSTRACT
    - reference_id: PMID:41639445
      supporting_text: Rip1 uses these phage protein ring complexes as a template to assemble into
        membrane-disrupting pores that inhibit phage virion assembly and cause premature death of the
        host cell.
      reference_section_type: ABSTRACT
    - reference_id: PMID:41639445
      supporting_text: Rip1 homologues are widely distributed across bacteria and provide robust
        defence against diverse phages.
      reference_section_type: ABSTRACT
    - reference_id: file:9CAUD/DMS3-25/DMS3-25-bioinformatics/RESULTS.md
      supporting_text: A0SMN5 / DMS3-25 is a homologue of the Rip1 defence protein, not of the
        activating phage ring.
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: OTHER
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: acts_upstream_of_or_within_positive_effect
      corrected_value: involved_in
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        Both GAF rows for this gene product (assigned_by CACAO, dated 2026-03-23)
        carry the qualifier acts_upstream_of_or_within_positive_effect for
        GO:0051607 defense response to virus. The cited paper describes a protein
        that "integrates both sensing and effector activity": it senses the
        infecting phage's assembly ring and then itself forms the membrane pore
        that aborts the infection, so it performs the defence response rather than
        acting on it from outside. The qualifier that does fit
        acts_upstream_of_or_within_positive_effect is the one belonging to the
        phage portal and small terminase proteins that activate the defence, which
        is the other side of the same mechanism and a different set of gene
        products. A sequence analysis against the two chains of the paper's own
        structure (PDB 9OOX) places this protein in the defence family and not
        among the activating rings. The correct qualifier is involved_in; no
        change to the term, reference or evidence code is needed. Confidence is
        PROBABLE rather than CONFIRMED only because the paper's full text, which
        would name the DMS3 protein directly, could not be read.
- term:
    id: GO:0140911
    label: pore-forming activity
  evidence_type: ISS
  original_reference_id: file:9CAUD/DMS3-25/DMS3-25-bioinformatics/RESULTS.md
  qualifier: enables
  supporting_entities:
  - UniProtKB:K7P861
  review:
    summary: >-
      GOA gives this protein no molecular function at all. The cited paper's
      mechanism for the family is a pore: the protein polymerises on the phage
      assembly ring and inserts into the membrane, disrupting it. The sequence
      analysis in this review's bioinformatics folder places DMS3-25 in that
      family, aligning it over its full length at 30.8% identity to HK446 Rip1
      (UniProtKB:K7P861, the 164-residue protein of PDB 9OOX chain L, which the
      paper characterises), with the C-terminal twin CxxC module conserved and no
      detectable similarity to the activating small terminase. GO:0140911
      pore-forming activity is the GO term for this activity; its synonyms are
      holin and pinholin activity, so the term is in use for proteins that
      permeabilise the membrane of the cell expressing them, as the Rip1 family
      and the gasdermins do, even though its definition as written says "the
      membrane of another cell".
    action: NEW
    reason: >-
      Added to give the gene the molecular function that its one existing
      annotation, a biological process, leaves unstated, and to make explicit the
      activity asserted in core_functions. The inference is a molecular one about
      what this polypeptide does, not a process role, and it rests on
      full-length homology to a protein whose pore-forming activity is
      experimentally established, so ISS with UniProtKB:K7P861 as the source is
      the honest evidence code. It is deliberately not IDA or IMP: no pore has
      been demonstrated for the DMS3 protein itself, which is recorded as a
      knowledge gap. The definitional mismatch in GO:0140911 is raised in
      suggested_questions rather than treated as a reason to withhold the term.
    supported_by:
    - reference_id: PMID:41639445
      supporting_text: Rip1 uses these phage protein ring complexes as a template to assemble into
        membrane-disrupting pores that inhibit phage virion assembly and cause premature death of the
        host cell.
      reference_section_type: ABSTRACT
    - reference_id: file:9CAUD/DMS3-25/DMS3-25-bioinformatics/RESULTS.md
      supporting_text: A0SMN5 / DMS3-25 is a homologue of the Rip1 defence protein, not of the
        activating phage ring.
references:
- id: PMID:41639445
  title: A pore-forming antiphage defence is activated by oligomeric phage proteins.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The reference behind both GOA rows, and the only functional publication
      touching this protein. Verified against PubMed (Nature 651:1060-1067, 2026,
      DOI 10.1038/s41586-025-10075-1) and against the paper's deposited structure
      PDB 9OOX / EMD-70676, whose Rip1 chain is 164 residues, matching the
      abstract's description. The cached copy is abstract-only: the Nature text is
      paywalled, Europe PMC holds no open-access record and returns only
      abstract-level text-mined annotations for this PMID, and no preprint exists,
      so the DMS3-specific experiments behind the two IMP rows could not be read.
      The abstract does not name DMS3 or this protein, which is why the gene's
      identity as a Rip1 homologue was established independently by sequence
      rather than taken from the paper; that analysis confirms the paper is about
      the right protein family and so supports rather than questions the citation.
  findings:
  - statement: Rip1 is a small prophage-encoded protein that defends bacteria by sensing conserved
      oligomeric components of phage assembly
    supporting_text: Here we describe a 164-residue prophage-encoded protein that defends bacteria by
      sensing conserved oligomeric components of phage assembly.
    reference_section_type: ABSTRACT
  - statement: The activating ligands are the ring-shaped portal or small terminase complexes of the
      infecting phage, which are required for virion maturation
    supporting_text: This protein, called ring interacting pore 1 (Rip1), is activated by the portal
      or small terminase proteins of infecting phages-oligomeric ring-shaped complexes that are
      essential for virion maturation.
    reference_section_type: ABSTRACT
  - statement: Rip1 templates on the phage ring to assemble a membrane-disrupting pore, blocking
      virion assembly and killing the host cell prematurely
    supporting_text: Rip1 uses these phage protein ring complexes as a template to assemble into
      membrane-disrupting pores that inhibit phage virion assembly and cause premature death of the
      host cell.
    reference_section_type: ABSTRACT
  - statement: Rip1 homologues are widespread in bacteria and give robust defence against diverse
      phages
    supporting_text: Rip1 homologues are widely distributed across bacteria and provide robust defence
      against diverse phages.
    reference_section_type: ABSTRACT
  - statement: Sensing and effector activity are carried by the same single protein
    supporting_text: This study reveals a strategy by which a small defence protein integrates both
      sensing and effector activity by exploiting a conserved feature of viral assembly.
    reference_section_type: ABSTRACT
  - statement: The mechanism is a prokaryotic counterpart of eukaryotic pore-forming immunity,
      compressed into one polypeptide
    supporting_text: The mechanism mirrors eukaryotic pore-forming immunity but is executed by a
      single protein, offering an evolutionarily streamlined solution to viral detection and defence.
    reference_section_type: ABSTRACT
