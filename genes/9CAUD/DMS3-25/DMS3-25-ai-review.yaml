core_functions:
- description: >-
    Recognises the oligomeric, ring-shaped portal or small terminase complex of a
    phage infecting the lysogen, polymerises on that ring as a template, and
    assembles into a pore that disrupts the membrane, which arrests virion
    assembly of the incoming phage and causes premature death of the infected
    cell. Sensor and effector are the same polypeptide.
  molecular_function:
    id: GO:0140911
    label: pore-forming activity
  directly_involved_in:
  - id: GO:0051607
    label: defense response to virus
  supported_by:
  - reference_id: PMID:41639445
    supporting_text: Rip1 uses these phage protein ring complexes as a template to assemble into
      membrane-disrupting pores that inhibit phage virion assembly and cause premature death of the
      host cell.
  - reference_id: PMID:41639445
    supporting_text: This study reveals a strategy by which a small defence protein integrates both
      sensing and effector activity by exploiting a conserved feature of viral assembly.
  - reference_id: PMID:41639445
    supporting_text: Rip1 homologues are widely distributed across bacteria and provide robust
      defence against diverse phages.
  - reference_id: file:9CAUD/DMS3-25/DMS3-25-bioinformatics/RESULTS.md
    supporting_text: A0SMN5 / DMS3-25 is a homologue of the Rip1 defence protein, not of the
      activating phage ring.
  knowledge_gaps:
  - gap_statement: >-
      Whether the DMS3 protein forms a pore at all, and in which membrane, has not
      been shown. The pore and the membrane disruption are established for the
      Rip1 family in the cited paper; for this 30.8%-identical homologue only an
      antiphage defence phenotype is on record, and its molecular function is
      assigned from family membership.
    boundary: >-
      Established: the gene is a Rip1-family member, and deletion and
      loss-of-function alleles lose antiphage defence. Unknown: whether the DMS3
      protein oligomerises on a phage ring, whether it permeabilises the
      Pseudomonas aeruginosa inner membrane, and whether host death is the
      mechanism of defence or a consequence of it.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      It decides whether the molecular function is pore formation or something
      else in the same family, and whether the defence is abortive infection by
      altruistic suicide, which would be the better process term if GO had one.
    resolution: >-
      Membrane-permeabilisation and depolarisation assays on Pseudomonas
      aeruginosa expressing the DMS3 protein, with and without a superinfecting
      phage, alongside separation-of-function alleles that uncouple pore formation
      from ring binding.
    provenance:
    - reference_id: PMID:41639445
      supporting_text: Rip1 uses these phage protein ring complexes as a template to assemble into
        membrane-disrupting pores that inhibit phage virion assembly and cause premature death of the
        host cell.
  - gap_statement: >-
      Which phage proteins activate the DMS3 protein, and which Pseudomonas phages
      it defends against, is unknown. The family is activated by either the portal
      or the small terminase ring, and nothing establishes which one this
      homologue reads, or whether its own phage's portal and terminase evade it.
    boundary: >-
      Established: the family senses conserved oligomeric assembly components, and
      either the portal or the small terminase suffices. Unknown: the activating
      partner for the DMS3 protein, its phage range, and how a lysogen avoids
      triggering the defence with its own packaging proteins during induction.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      Self-versus-non-self discrimination is the central problem for a defence
      protein that senses a universal component of phage assembly, since the
      resident prophage makes those same rings when it is induced.
    resolution: >-
      Co-expression and pull-down panels of the DMS3 protein against portal and
      small terminase proteins of a set of Pseudomonas phages including DMS3's
      own, with plaquing on lysogens to match binding to protection.
    provenance:
    - reference_id: PMID:41639445
      supporting_text: This protein, called ring interacting pore 1 (Rip1), is activated by the portal
        or small terminase proteins of infecting phages-oligomeric ring-shaped complexes that are
        essential for virion maturation.
suggested_questions:
- question: >-
    Is the defence afforded by this protein abortive infection by altruistic
    suicide, the infected cell dying so that the population survives, or is host
    death an incidental consequence of pore formation? GO has no abortive-infection
    term, so the answer would also say whether one is needed.
- question: >-
    Which of the portal and the small terminase ring activates the DMS3 protein,
    and how does a DMS3 lysogen avoid triggering its own Rip1 when the prophage is
    induced and makes those same rings?
- question: >-
    GO:0140911 pore-forming activity is defined as insertion into "the membrane of
    another cell", yet its synonyms are holin and pinholin activity and it is used
    for proteins that permeabilise the membrane of the cell expressing them, as
    Rip1 and the gasdermins do. Should the definition be widened, or a sibling term
    created for self-directed pore formation? GSDMD is annotated GO:0022829 wide
    pore channel activity instead, so current practice is split.
- question: >-
    Do the other 51 proteins of the DMS3 genome include further defence morons,
    and should DMS3's portal (DMS3-27) and terminase large subunit (DMS3-26) carry
    an annotation for activating Rip1-family defences in the hosts they infect?
suggested_experiments:
- description: >-
    Delete this gene from a DMS3 lysogen of Pseudomonas aeruginosa and challenge
    with a panel of Pseudomonas phages, complementing in trans, to measure the
    protection the gene provides in its native context and define its phage range.
- description: >-
    Assay membrane permeabilisation and depolarisation in cells expressing the DMS3
    protein with and without a superinfecting phage, to test directly whether this
    homologue forms a pore and when.
- description: >-
    Co-purify the DMS3 protein with the portal and the small terminase of each
    phage in that panel, and determine a structure of a complex, to identify the
    activating ring and compare the interface with the HK446 Rip1-T6 terminase
    structure.
- description: >-
    Separate sensing from effector function with alleles in the C-terminal twin
    CxxC module and in the central helix, and ask whether a ring-binding,
    pore-dead variant still restricts phage, to test whether pore formation is
    required for defence or only for host death.
- description: >-
    Follow the fate of the prophage's own portal and terminase during mitomycin
    induction of a DMS3 lysogen, scoring Rip1 oligomerisation and cell lysis
    timing, to find the mechanism that prevents self-activation.
