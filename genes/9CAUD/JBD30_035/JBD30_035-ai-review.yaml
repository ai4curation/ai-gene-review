id: L7P7M1
gene_symbol: JBD30_035
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1223260
  label: Pseudomonas phage JBD30
description: >-
  JBD30_035 is the 78-residue product of gene 35 of Pseudomonas phage JBD30 and is the
  founding type I-F anti-CRISPR protein, AcrF1 (AcrIF1). It is a small globular protein
  built from a four-stranded antiparallel beta-sheet flanked by two alpha-helices, and it
  is classified by sequence in the AcrIF1 family (CDD cd22279, Pfam PF20829). Inside an
  infected Pseudomonas aeruginosa cell it binds the Cas7f (Csy3) backbone of the host
  type I-F crRNA-guided surveillance complex, two copies per complex contacting four of
  the six Cas7f subunits, and sits over the Cas7f thumbs so that a target DNA strand
  cannot move between successive complementary segments of the crRNA guide. The result is
  a stoichiometric, steric block on target-DNA recognition that leaves crRNA levels and
  cas gene expression untouched. Because the same surveillance complex is also required
  for new spacer uptake in this subtype, the protein blocks CRISPR adaptation as well as
  interference. Loss of the gene makes the phage unable to grow on a CRISPR-proficient
  host while leaving growth on a CRISPR-deleted host unaffected, and transferring the gene
  into a CRISPR-sensitive phage lets that phage escape immunity, so the protein's
  biological role is to neutralise host CRISPR-Cas immunity against the infecting phage
  genome. It has no catalytic activity and acts as an inhibitory binding partner of a
  host ribonucleoprotein.
existing_annotations:
- term:
    id: GO:0098672
    label: symbiont-mediated suppression of host CRISPR-cas system
  evidence_type: IMP
  original_reference_id: PMID:26586803
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: >-
      CACAO row (assigned_by CACAO, dated 2026-02-16), the only GO annotation this entry
      carries. What the cited paper shows for this gene: Vorontsova et al. reconstituted the
      Pseudomonas aeruginosa type I-F CRISPR-Cas system in Escherichia coli from pCas and
      pCsy plasmids, expressed each of the five known anti-CRISPR proteins from a compatible
      plasmid, and found that spacer acquisition was abolished by every one of them,
      including acrF1, which is the product of this entry. The control that carries the
      annotation is a frame-shift allele of acrF1: it lost the anti-acquisition activity
      just as it had previously lost anti-interference activity, which is why the row is
      IMP rather than IDA. The term matches: GO:0098672 is defined as a symbiont inhibiting
      or disrupting the CRISPR-Cas system of its host and is the most specific term GO
      offers (QuickGO 2026-11-01: non-obsolete, no children, usage unrestricted), its own
      definition is cited to this protein's discovery and mechanism papers
      (PMID:23242138, PMID:26416740), and the paper measures suppression of the host system
      directly rather than a downstream phenotype. Two evidential caveats that do not change
      the judgement: the assay is a heterologous reconstitution in E. coli rather than the
      natural PA14 host, and the arm of the system measured is adaptation rather than
      interference, which the generic term covers.
    action: ACCEPT
    reason: >-
      The claim is correct, maximally specific for this gene and directly supported by the
      cited experiment, and it is independently established in the natural host: deleting or
      frame-shifting gene 35 renders JBD30 unable to replicate on wild-type PA14 while
      leaving replication on the CRISPR-deleted strain intact (PMID:23242138). The only
      defect is the GAF qualifier. acts_upstream_of_or_within_positive_effect describes a
      gene product that influences a process from outside it, or whose participation is
      unknown; here the mechanism is settled. AcrF1 binds the Cas7f (Csy3) backbone of the
      host surveillance complex and occludes the target-DNA path (PMID:26416740,
      PMID:28340349), so the protein physically performs the suppression and involved_in is
      the correct relation. This is a source-record field error, recorded in source_defects,
      and not a reason to reject the claim, downgrade it, or change the term, reference or
      evidence code. The hedge would have been defensible had the paper shown only that the
      gene is required for anti-CRISPR function without identifying what the product acts
      on, which is not the case.
    supported_by:
    - reference_id: PMID:26586803
      supporting_text: Spacer acquisition was inhibited in the presence of each of the five
        different anti-CRISPR proteins tested (acrF1–5, Figure 4).
      reference_section_type: RESULTS
    - reference_id: PMID:26586803
      supporting_text: A plasmid bearing a frame-shift mutation in the beginning of the acrF1
        anti-CRISPR gene that inactivates its anti-interference function (40) also inactivated
        the anti-acquisition function.
      reference_section_type: RESULTS
    - reference_id: PMID:26586803
      supporting_text: We conclude that anti-CRISPR proteins that inhibit CRISPR interference
        in P. aeruginosa by targeting either the Csy complex or Cas3, also inhibit spacer
        acquisition.
      reference_section_type: RESULTS
    - reference_id: PMID:23242138
      supporting_text: a frameshift mutation was introduced into the phage JBD30 anti-CRISPR
        gene (gene 35). This mutant phage was unable to replicate on wild-type PA14 but still
        replicated robustly on the ΔCR/cas strain, demonstrating the requirement of the
        anti-CRISPR gene for replication
      reference_section_type: RESULTS
    - reference_id: PMID:28340349
      supporting_text: AcrF1 binds to the Cas7f backbone and prevents target binding
      reference_section_type: RESULTS
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: CACAO
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: acts_upstream_of_or_within_positive_effect
      corrected_value: involved_in
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        This GAF row (assigned_by CACAO, GONUTS community curation, dated 2026-02-16)
        carries the qualifier acts_upstream_of_or_within_positive_effect for GO:0098672
        symbiont-mediated suppression of host CRISPR-cas system. AcrF1 is itself the
        effector of that process: two copies bind the Cas7f (Csy3) subunits of the host
        type I-F surveillance complex and sterically block movement of the target DNA
        strand along the crRNA guide, which is the suppression, not an upstream influence
        on it. acts_upstream_of_or_within_positive_effect is a legal BP qualifier and is
        the conventional hedge for a mutant-phenotype annotation whose mechanism is
        unknown, but the mechanism here is established by structure and biochemistry
        (PMID:26416740, PMID:28340349), and GO:0098672's own definition is cited to those
        papers. The correct qualifier is involved_in. No change to the term, reference or
        evidence code is needed. The same defect was recorded for AcrIIA5
        (genes/9CAUD/acrIIA5), suggesting a systematic qualifier habit in recent CACAO
        anti-CRISPR rows rather than a one-off slip.
- term:
    id: GO:0043021
    label: ribonucleoprotein complex binding
  evidence_type: IPI
  original_reference_id: PMID:28340349
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q02MM1
  review:
    summary: >-
      Proposed new annotation. This entry has no molecular-function annotation at all, yet
      its activity is one of the better characterised in the anti-CRISPR field: it binds the
      crRNA-loaded type I-F Csy surveillance complex, a ribonucleoprotein, through the Cas7f
      (Csy3) protein subunits. The interaction is shown by co-purification and binding
      kinetics (PMID:26416740) and resolved in the cryo-EM structure of the Csy complex with
      two AcrF1 copies contacting four of the six Cas7f subunits, with surface-plasmon
      dissociation rates for wild-type and Cas7f K85A complexes (PMID:28340349). The
      supporting entity is Pseudomonas aeruginosa UCBPP-PA14 Csy3/Cas7f, UniProtKB:Q02MM1
      (reviewed in this repository as genes/PSEAB/csy3).
    action: NEW
    reason: >-
      GO has no molecular-function term for anti-CRISPR activity (a QuickGO text search on
      2026-11-01 returns only BP terms plus unrelated anti-sigma and anti-Mullerian terms),
      so the informative existing term for what this protein does is binding of the host
      surveillance ribonucleoprotein; bare protein binding would be uninformative and is
      avoided. This follows the precedent set for the homologous Csy-complex inhibitor AcrF8
      (genes/BPZF4/AcrF8), whose core molecular function is recorded with the same term, and
      it is the activity that the accepted biological-process row rests on, so it adds the
      missing mechanistic layer rather than a second claim about the same thing. A
      mechanism-specific molecular-function term is filed under proposed_new_terms.
    supported_by:
    - reference_id: PMID:28340349
      supporting_text: The structure presented here explains how two AcrF1 proteins (i.e.
        AcrF1.1 and 1.2) bind to one Csy complex through interactions with four of the six
        Cas7f subunits
      reference_section_type: RESULTS
    - reference_id: PMID:28340349
      supporting_text: AcrF1 proteins sits on top of the Cas7.6f and Cas7.4f thumbs, blocking
        the transition of target DNA from 1 to 2 and segment 3 to 4, respectively.
      reference_section_type: RESULTS
    - reference_id: PMID:26416740
      supporting_text: Two block the DNA-binding activity of the CRISPR-Cas complex, yet do
        this by interacting with different protein subunits, and using steric or non-steric
        modes of inhibition.
      reference_section_type: ABSTRACT
core_functions:
- description: Binds the crRNA-loaded type I-F CRISPR-Cas surveillance (Csy) complex of the
    Pseudomonas aeruginosa host through the Cas7f (Csy3) protein backbone, two copies per
    complex contacting four of the six Cas7f subunits and resting on their thumb domains, and
    thereby sterically blocks movement of a target DNA strand between successive complementary
    segments of the crRNA guide, abolishing target recognition and with it both CRISPR
    interference and new spacer acquisition, so that the infecting phage genome escapes host
    CRISPR-Cas immunity
