knowledge_gaps:
- gap_statement: >-
    Whether AcrF1 binding is itself responsible for the inward shift of the Cas7f web domains
    seen in the Csy-AcrF1-AcrF2 structure, and so whether the block on target DNA is purely
    steric or partly conformational, is unresolved, because no structure of the Csy complex
    free of anti-CRISPR proteins was available for comparison.
  boundary: >-
    Established: two AcrF1 copies bind four of six Cas7f subunits, contact the conserved thumb
    lysine K85, dissociate ~10^3-fold more slowly from wild-type than from K85A complexes, and
    sit where the target strand must cross between guide segments. Unknown: whether the
    adjacent web-domain displacement is caused by AcrF1 or is an intrinsic feature of the
    complex.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    It decides whether AcrF1 is a pure steric occluder, the paradigm it is usually cited as, or
    an allosteric inhibitor, which would change how escape mutations and engineered variants
    are predicted.
  resolution: >-
    A cryo-EM structure of the apo Csy complex at comparable resolution, compared subunit by
    subunit with the AcrF1-bound complex, together with crosslinking or FRET reporters of the
    web domain position in the presence and absence of AcrF1.
  provenance:
  - reference_id: PMID:28340349
    supporting_text: suggesting that AcrF1 binding may induce a conformational change that
      restricts access to the guide RNA (Figure 4E), though a structure of Csy complex without
      the anti-CRISPRs will be necessary to know that the AcrF1 protein is directly responsible
      for this observation
- gap_statement: >-
    Why AcrF1 blocks new spacer acquisition is explained by the host genetics rather than by
    anything measured on AcrF1 itself: the Csy complex is required for adaptation, so
    inactivating it is sufficient. Whether AcrF1 additionally contacts Cas1, Cas2-3 or the
    adaptation intermediate, and whether it blocks naive and primed acquisition equally, has
    not been tested.
  boundary: >-
    Established: expression of acrF1 abolishes spacer acquisition in a heterologous
    reconstitution, and a frame-shift allele does not. Unknown: whether the effect is wholly
    accounted for by occupancy of the Csy complex, or whether AcrF1 engages the adaptation
    machinery directly.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Anti-CRISPRs are increasingly deployed as off-switches for engineered CRISPR systems, and
    an inhibitor that acts on both arms through one contact is a different tool from one with
    two independent targets.
  resolution: >-
    Pull-downs and crosslinking of AcrF1 against Cas1, Cas2-3 and the Csy complex in the
    presence and absence of a protospacer substrate, with acquisition assays comparing naive
    and primed adaptation at AcrF1 concentrations that partially occupy the Csy complex.
  provenance:
  - reference_id: PMID:26586803
    supporting_text: We conclude that anti-CRISPR proteins that inhibit CRISPR interference in
      P. aeruginosa by targeting either the Csy complex or Cas3, also inhibit spacer
      acquisition.
proposed_new_terms:
- proposed_name: CRISPR-Cas surveillance complex inhibitor activity
  proposed_definition: >-
    A molecular function that binds a CRISPR-Cas crRNA-guided surveillance complex and
    prevents it from recognising or engaging its nucleic acid target, thereby inhibiting
    CRISPR-Cas-mediated immunity. Includes anti-CRISPR proteins that occlude the target-DNA
    path on the complex sterically and those that prevent target engagement by other means,
    and excludes inhibitors acting on a separate nuclease or helicase recruited by the
    complex.
  justification: >-
    GO has a biological-process term for anti-CRISPR action (GO:0098672 symbiont-mediated
    suppression of host CRISPR-cas system) but no molecular-function term for the activity
    that carries it out. The only available options are uninformative binding terms, so the
    molecular layer of an entire and well-characterised protein class, including AcrF1, AcrF2
    and AcrF8 against the type I-F Csy complex and AcrIIA4 and AcrIIA5 against Cas9, is
    unrepresentable. The activity is a specific, assayable inhibition of a defined
    ribonucleoprotein machine, and a molecular-function term would also let the existing
    process rows be grounded in a mechanism rather than restated.
  supported_by:
  - reference_id: PMID:26416740
    supporting_text: Two block the DNA-binding activity of the CRISPR-Cas complex, yet do this
      by interacting with different protein subunits, and using steric or non-steric modes of
      inhibition.
  - reference_id: PMID:28340349
    supporting_text: AcrF1 binds to the Cas7f backbone and prevents target binding
suggested_questions:
- question: >-
    Is the inward displacement of the Cas7.4f and Cas7.6f web domains in the AcrF1-bound Csy
    complex caused by AcrF1, making it an allosteric as well as a steric inhibitor?
  experts:
  - Blake Wiedenheft
  - Gabriel C. Lander
- question: >-
    Does AcrF1 block primed and naive spacer acquisition equally, and does it contact Cas1 or
    Cas2-3 at all, or is occupancy of the Csy complex the whole explanation for its
    anti-adaptation effect?
  experts:
  - Konstantin Severinov
  - Ekaterina Semenova
- question: >-
    Cas7f lysines K85, K254 and K257 are required for AcrF1 binding but mutating them also
    cripples target-DNA binding. Does that constraint explain why type I-F hosts appear not to
    escape AcrF1 by point mutation, and what route does escape take instead?
  experts:
  - Alan R. Davidson
  - Karen L. Maxwell
suggested_experiments:
- hypothesis: >-
    AcrF1 inhibits the Csy complex purely by steric occlusion of the target-strand path, not by
    an allosteric change in the Cas7f web domains.
  description: >-
    Determine a cryo-EM structure of the apo Pseudomonas aeruginosa Csy complex to the same
    resolution as the AcrF1/AcrF2-bound complex and compare web-domain positions subunit by
    subunit, with an orthogonal solution readout (site-specific FRET or crosslinking across the
    web-to-crRNA gap) measured with and without saturating AcrF1. Identical apo and bound web
    positions would establish the purely steric model; a shift that tracks AcrF1 occupancy
    would define a second, allosteric contribution.
  experiment_type: comparative cryo-EM with solution conformational reporters
- hypothesis: >-
    AcrF1's block on spacer acquisition is entirely a consequence of occupying the Csy complex,
    with no direct engagement of the adaptation machinery.
  description: >-
    Reconstitute type I-F adaptation and titrate AcrF1 against separately purified Csy complex,
    Cas1 and Cas2-3, measuring binding by pull-down, SPR and crosslinking mass spectrometry;
    in parallel measure naive and primed acquisition in cells expressing AcrF1 at graded levels
    and in cells carrying a Cas7f variant that cannot bind AcrF1 but retains function.
    Proportional loss of acquisition with Csy occupancy, and no detectable AcrF1-Cas1 or
    AcrF1-Cas2-3 complex, would confirm the single-target model.
  experiment_type: reconstituted adaptation assay with quantitative interaction mapping
references:
- id: PMID:26586803
  title: Foreign DNA acquisition by the I-F CRISPR-Cas system requires all components
    of the interference machinery.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The reference cited by the single CACAO row. PubMed identifier, title and author list
      match the cached full text (Nucleic Acids Res 2015, PMC4678832), and Figure 4 of the
      paper is the experiment behind the annotation: each of acrF1-5 blocks spacer acquisition
      in the E. coli reconstitution, and a frame-shift acrF1 allele does not. Joseph
      Bondy-Denomy, Blake Wiedenheft and Alan Davidson are co-authors, so this is the
      anti-CRISPR field's own groups assaying their own proteins. Correctly cited and
      scientifically sound; the only defect in the row that cites it is its qualifier.
  findings:
  - statement: Each of the five known Pseudomonas aeruginosa anti-CRISPR proteins, including
      AcrF1, blocks spacer acquisition by the reconstituted type I-F CRISPR-Cas system
    supporting_text: Spacer acquisition was inhibited in the presence of each of the five
      different anti-CRISPR proteins tested (acrF1–5, Figure 4).
    reference_section_type: RESULTS
  - statement: A frame-shift allele of acrF1 loses the anti-acquisition activity as well as the
      anti-interference activity, which makes the annotation a mutant-phenotype inference
    supporting_text: A plasmid bearing a frame-shift mutation in the beginning of the acrF1
      anti-CRISPR gene that inactivates its anti-interference function (40) also inactivated
      the anti-acquisition function.
    reference_section_type: RESULTS
  - statement: The authors attribute the anti-acquisition effect to the same targets as the
      anti-interference effect, the Csy complex or Cas3
    supporting_text: We conclude that anti-CRISPR proteins that inhibit CRISPR interference in
      P. aeruginosa by targeting either the Csy complex or Cas3, also inhibit spacer
      acquisition.
    reference_section_type: RESULTS
  - statement: The assay is a heterologous reconstitution of the Pseudomonas type I-F system in
      Escherichia coli, not an experiment in the natural host
    supporting_text: To determine if anti-CRISPR proteins also affect spacer acquisition we
      transformed E. coli (KD604) cells harboring pCas and pCsy plasmids with compatible
      plasmids expressing distinct anti-CRISPR proteins and monitored spacer acquisition
      (Figure 4).
    reference_section_type: RESULTS
