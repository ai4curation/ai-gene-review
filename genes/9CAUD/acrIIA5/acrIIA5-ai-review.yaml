  review:
    summary: The DisProt IPI row records an interaction between AcrIIA5 and a Cas9 single-guide RNA.
      In the cited paper the measured interaction is with the preformed Cas9-sgRNA ribonucleoprotein,
      detected as an sgRNA super-shift in an electrophoretic mobility shift assay (Figure 4A) and
      corroborated by amide line-broadening on NMR titration (Figure 4E). The same paper shows that
      AcrIIA5 has no ribonuclease activity on free sgRNA and does not bind apo-Cas9, so the RNA is
      engaged only in the context of the holo-enzyme. The partner is a ribonucleoprotein complex,
      not a free RNA ligand.
    action: MODIFY
    reason: The essence of the annotation is sound - there is a direct, experimentally measured
      physical interaction with a guide-RNA-containing entity - but GO:0003723 asserts binding to RNA
      as such, which this paper does not establish and in part argues against, since AcrIIA5 binds
      only the assembled complex. GO:0043021 ribonucleoprotein complex binding names the entity
      actually assayed and is the term this repository already uses for the equivalent
      AcrIIA4-Cas9/sgRNA relationship in genes/LISMN/acrIIA4. This is a lateral correction of the
      binding partner's identity rather than a refinement, so the replacement is not a descendant of
      the original term.
