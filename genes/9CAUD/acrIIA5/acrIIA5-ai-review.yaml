- term:
    id: GO:0030430
    label: host cell cytoplasm
  evidence_type: IC
  original_reference_id: PMID:28785032
  review:
    summary: AcrIIA5 is encoded by a strictly lytic (virulent) phage and acts on the bacterial host's
      Cas9 ribonucleoprotein, a cytoplasmic enzyme, during infection. Inhibition is demonstrated
      inside living cells of the native host genus, of a heterologous bacterium and of human cells
      expressing Cas9, so the protein must reach the compartment in which Cas9 resides. No
      localisation experiment has been performed; the NMR structure and all biochemistry were done in
      vitro, so this is a curator inference.
    action: NEW
    reason: 'This entry is assigned to the phage taxon (NCBITaxon:2006928), and because the phage is
      virulent rather than a resident prophage, the cell whose cytoplasm the protein occupies is a
      separate host cell. GO:0030430 host cell cytoplasm is therefore the correct component term,
      which is where this case differs from genes/LISMN/acrIIA4: that entry is filed under the
      Listeria monocytogenes taxon because the gene lies in a resident prophage, so GO:0005737
      cytoplasm applies there. Evidence is IC rather than IDA because the location is inferred from
      the target and from in-cell activity, not measured. Added conservatively as the single
      cellular-component claim; no sub-compartment or membrane association is implied.'
    supported_by:
    - reference_id: PMID:28785032
      supporting_text: we have identified an unrelated Acr in a virulent phage of Streptococcus
        thermophilus
      reference_section_type: ABSTRACT
    - reference_id: PMID:30046034
      supporting_text: we demonstrate that both Acr families from S. thermophilus phages inhibit
        Cas9-mediated genome editing of human cells
      reference_section_type: ABSTRACT
references:
- id: PMID:28785032
  title: An anti-CRISPR from a virulent streptococcal phage inhibits Streptococcus pyogenes Cas9.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Discovery paper for AcrIIA5 and the reference behind two of the three CACAO
      GO:0098672 rows. Verified against PubMed and against the UniProt record, which cites this paper
      as reference 1 for the D4276 genomic sequence from which this accession (EMBL ASD50988.1, ORF
      D4276_028) was derived, so the annotation sits on the protein the paper identified. The cached
      copy is abstract-only, so figure-level detail could not be checked; the abstract nonetheless
      states the key result for this protein outright.
  findings:
  - statement: Phage D4276 escapes Streptococcus thermophilus CRISPR immunity more than 40,000-fold
      better than comparable phages
    supporting_text: we found one that evaded the CRISPR-encoded immunity >40,000× more often than the
      others
    reference_section_type: ABSTRACT
  - statement: A single cloned gene of phage D4276 is wholly responsible for the loss of CRISPR
      immunity
    supporting_text: Through systematic cloning of its genes, we identified an Acr solely responsible
      for the abolished immunity.
    reference_section_type: ABSTRACT
  - statement: The protein also abolishes immunity conferred by the heterologous Streptococcus
      pyogenes Cas9 in a different bacterial genus
    supporting_text: We extended our findings by demonstrating activity in another S. thermophilus
      strain, against unrelated phages, and in another bacterial genus immunized using the
      heterologous SpCas9 system favoured for genome editing.
    reference_section_type: ABSTRACT
  - statement: This is the first anti-CRISPR found in a virulent rather than temperate phage or
      prophage
    supporting_text: we have identified an unrelated Acr in a virulent phage of Streptococcus
      thermophilus
    reference_section_type: ABSTRACT
- id: PMID:30046034
  title: Widespread anti-CRISPR proteins in virulent bacteriophages inhibit a range of Cas9 proteins.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primarily the AcrIIA6 discovery paper, which makes the CACAO row citing it look at
      first glance like a paper about a different gene. The full text settles it. AcrIIA5_D4276 (140
      aa) is itself cloned, expressed and assayed in the bacterial plaquing panel (Figure 4), the
      human K562 editing panel (Figure 5) and the Table 1 activity summary, so the reference genuinely
      supports an IDA on this protein. The orthologue AcrIIA5_D1126 is also assayed and the paper
      keeps the two distinguished, which is what allows the D4276-specific weakness against St3Cas9
      to be read off.
  findings:
  - statement: AcrIIA5 orthologues including the D4276 protein fully restore plaquing of phages
      targeted by the St1Cas9 (CR1) system
    supporting_text: All AcrIIA6 and AcrIIA5 orthologs completely restored the plaquing efficiency of
      phages targeted by the CR1 system of S. thermophilus (Fig. 4), indicating they are blocking the
      activity of St1Cas9.
    reference_section_type: RESULTS
  - statement: AcrIIA5 almost completely abolishes plasmid-borne SpCas9 activity in Lactococcus lactis
    supporting_text: Both AcrIIA5s almost completely abolished SpCas9 activity in this bacterial
      system
    reference_section_type: RESULTS
  - statement: The D4276 orthologue specifically is only weakly active against St3Cas9, unlike the 87%
      identical D1126 orthologue
    supporting_text: Notably, AcrIIA5D4276 comes from a phage infecting a S. thermophilus host which
      lacks the CR3 locus, and its activity is limited to a 10-fold inhibition of CR3 activity25.
    reference_section_type: RESULTS
  - statement: AcrIIA5 has the broadest activity of all anti-CRISPRs tested in this study, in bacteria
      and in human cells
    supporting_text: Of all the Acrs tested in human cells and in the bacterial assays, AcrIIA5
      displayed the broadest range of activity
    reference_section_type: DISCUSSION
  - statement: AcrIIA5 inhibits Cas9-mediated genome editing in human cells
    supporting_text: we demonstrate that both Acr families from S. thermophilus phages inhibit
      Cas9-mediated genome editing of human cells
    reference_section_type: ABSTRACT
- id: PMID:32544231
  title: Intrinsic disorder is essential for Cas9 inhibition of anti-CRISPR AcrIIA5.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structure-function paper for this exact protein and the reference behind both
      DisProt molecular-function rows; also the source of PDB 6LKF, which UniProt cross-references for
      this accession over residues 1-140. Verified by reading the full text, where the in vitro
      nuclease assays, gel shift assays and NMR titrations are all performed on AcrIIA5 itself.
  findings:
  - statement: AcrIIA5 adopts a novel fold with an N-terminal intrinsically disordered region
    supporting_text: AcrIIA5 comprises seven β-strands and two α-helices, preceded by an extended
      N-terminal disordered region
    reference_section_type: RESULTS
  - statement: No structural homologue of the AcrIIA5 fold exists in the PDB
    supporting_text: A search for structural homologs of AcrIIA5 using the DALI program did not return
      a similar fold, indicating that AcrIIA5 adopts a novel fold
    reference_section_type: RESULTS
  - statement: Purified AcrIIA5 alone is sufficient to block Cas9-sgRNA cleavage of a double-stranded
      DNA target in vitro
    supporting_text: Purified AcrIIA5 completely inhibited target double-stranded DNA (dsDNA) cleavage
      of Cas9–sgRNA in the in vitro nuclease activity assay, demonstrating that AcrIIA5 alone is
      sufficient for Cas9 inhibition
    reference_section_type: RESULTS
  - statement: AcrIIA5 binds the assembled Cas9-sgRNA ribonucleoprotein directly, forming a ternary
      complex
    supporting_text: Titration of AcrIIA5 into Cas9–sgRNA resulted in sgRNA super-shifts owing to the
      ternary complex formation, demonstrating a direct interaction between AcrIIA5 and Cas9–sgRNA
    reference_section_type: RESULTS
  - statement: AcrIIA5 binds only guide-loaded Cas9 and not apo-Cas9
    supporting_text: We note that AcrIIA5 interacted only with the preformed Cas9–sgRNA complex, and
      not with apo-Cas9.
    reference_section_type: RESULTS
  - statement: AcrIIA5 inhibits without competing with target-DNA binding, unlike the DNA-mimic
      inhibitors
    supporting_text: AcrIIA5 selectively binds to sgRNA-loaded Cas9 and inhibits the nuclease activity
      without competing with target DNA binding, which is unique among Cas9 inhibitors.
    reference_section_type: RESULTS
  - statement: AcrIIA5 has no intrinsic ribonuclease activity on free or Cas9-bound sgRNA
    supporting_text: Treatment of free sgRNA or the Cas9–sgRNA complex with AcrIIA5 did not digest
      sgRNA, and the AcrIIA5-treated sgRNA bands remained intact in the urea gel
    reference_section_type: RESULTS
  - statement: The N-terminal disordered region is required for inhibition, supplying both the length
      needed for association and the positive charges needed to block activity
    supporting_text: the length of the IDR provides a scaffold for association between AcrIIA5 and
      Cas9–sgRNA, while the positive charges of the IDR serve as a regulatory switch that hinders Cas9
      function upon binding
    reference_section_type: RESULTS
  - statement: A mobile beta3-beta4 loop in the folded core carries additional residues required for
      inhibition
    supporting_text: the key residues of AcrIIA5 required for Cas9 inhibition are located at the
      mobile loop region in the middle of the compact fold, in addition to the N-terminal IDR
    reference_section_type: RESULTS
  - statement: Inhibition is selective for Cas9 and does not extend to the type V-A nuclease Cas12a
    supporting_text: AcrIIA5 did not inhibit L. bacterium Cas12a, another RNA-guided endonuclease from
      the type V-A CRISPR–Cas system
    reference_section_type: RESULTS
- id: PMID:31722192
  title: Anti-CRISPR AcrIIA5 Potently Inhibits All Cas9 Homologs Used for Genome Editing.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Not cited by any GOA row, added during this review. Verified from the full text that
      the protein characterised is the D4276 AcrIIA5 of this accession, so its breadth-of-inhibition
      data apply directly here. Its proposed RNA-directed mechanism is the one later contradicted by
      PMID:32544231, recorded in the relevant finding_review below.
  findings:
  - statement: AcrIIA5 from phage D4276 has the broadest Cas9 inhibitory spectrum described, covering
      all Cas9 proteins in common genome-editing use
    supporting_text: We discovered that the previously identifed anti-CRISPR, AcrIIA5 from
      Streptococcus thermophilus phage D4276 (Hynes et al., 2017), has the broadest Cas9 inhibitory
      activity described to date, inhibiting all of the Cas9 proteins commonly used in genome-editing
      applications.
    reference_section_type: RESULTS
  - statement: AcrIIA5 potently inhibits nine diverse type II-A and type II-C Cas9 homologues
    supporting_text: here we identify one anti-CRISPR, called AcrIIA5, that potently inhibits nine
      diverse type II-A and type II-C Cas9 homologs, including those currently used for genome editing
    reference_section_type: ABSTRACT
  - statement: AcrIIA5 activity is accompanied by partial in vivo cleavage of the single-guide RNA,
      which the authors read as evidence of an RNA-directed mechanism
    supporting_text: We show that the activity of AcrIIA5 results in partial in vivo cleavage of a
      single-guide RNA (sgRNA), suggesting that its mechanism involves RNA interaction.
    reference_section_type: ABSTRACT
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:32544231
      review_notes: The observation of partial sgRNA cleavage in co-expression systems stands, and the
        correlation with inhibitory competence is well controlled here. The mechanistic inference does
        not. An et al. tested purified AcrIIA5 against free and Cas9-bound sgRNA and found no
        ribonuclease activity, attributing the in vivo cleavage to host RNases acting on guide RNA
        left exposed by perturbed Cas9-sgRNA assembly. The surviving claim is that AcrIIA5 engages the
        Cas9-sgRNA ribonucleoprotein, which is why this review annotates GO:0043021 rather than
        GO:0003723.
      supported_by:
      - reference_id: PMID:32544231
        supporting_text: Treatment of free sgRNA or the Cas9–sgRNA complex with AcrIIA5 did not digest
          sgRNA, and the AcrIIA5-treated sgRNA bands remained intact in the urea gel
      - reference_id: PMID:32544231
        supporting_text: the sgRNA cleavage observed in previously reported co-expression systems can
          be attributed to endogenous ribonucleases
  - statement: AcrIIA5 could not be purified in a soluble active form in this study, which is why its
      mechanism was approached indirectly
    supporting_text: Despite extensive efforts, AcrIIA5 could not be purified in a soluble and active
      form on its own.
    reference_section_type: RESULTS
- id: PMID:31775029
  title: AcrIIA5 Inhibits a Broad Range of Cas9 Orthologs by Preventing DNA Target Cleavage.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Not cited by any GOA row, added during this review. Verified against PubMed; the
      cached copy is abstract-only (no PMC record), so only the abstract's own statements are quoted.
      The abstract states that the protein studied is the Cas9 inhibitor from a virulent Streptococcus
      thermophilus phage, that is AcrIIA5, and PMID:32544231 cites this work as its reference 42 for
      the RuvC result, which corroborates the identification.
  findings:
  - statement: AcrIIA5 prevents target-DNA cleavage by Cas9 while leaving target-DNA binding intact
    supporting_text: AcrIIA5 inhibits Cas9 by preventing DNA target cleavage, but DNA target binding
      of Cas9 is unaffected.
    reference_section_type: ABSTRACT
  - statement: The inhibited activity is that of the RuvC nuclease domain, independently of the HNH
      domain
    supporting_text: it can affect the activity of the RuvC nuclease domain of Cas9 independent of the
      HNH nuclease domain
    reference_section_type: ABSTRACT
  - statement: Inhibition covers type II-A, II-B and II-C Cas9 orthologues
    supporting_text: We found that AcrIIA5 is a potent and broad-spectrum inhibitor of CRISPR-Cas9,
      which can inhibit diverse Cas9 orthologs of type II-A, type II-B, and type II-C.
    reference_section_type: ABSTRACT
core_functions:
- description: Binds the assembled Cas9-guide RNA ribonucleoprotein of the bacterial host through a
    basic intrinsically disordered N-terminal tail acting together with a mobile loop of the folded
    core, and blocks cleavage of the target DNA duplex without preventing guide loading or target-DNA
    engagement, thereby neutralising host type II CRISPR-Cas9 immunity against the infecting phage
    genome
  molecular_function:
    id: GO:0140721
