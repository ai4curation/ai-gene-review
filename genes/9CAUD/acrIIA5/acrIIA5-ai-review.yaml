  supported_by:
  - reference_id: PMID:32544231
    supporting_text: Purified AcrIIA5 completely inhibited target double-stranded DNA (dsDNA) cleavage
      of Cas9–sgRNA in the in vitro nuclease activity assay, demonstrating that AcrIIA5 alone is
      sufficient for Cas9 inhibition
  - reference_id: PMID:32544231
    supporting_text: AcrIIA5 selectively binds to sgRNA-loaded Cas9 and inhibits the nuclease activity
      without competing with target DNA binding, which is unique among Cas9 inhibitors.
  - reference_id: PMID:32544231
    supporting_text: the key residues of AcrIIA5 required for Cas9 inhibition are located at the
      mobile loop region in the middle of the compact fold, in addition to the N-terminal IDR
  - reference_id: PMID:31775029
    supporting_text: AcrIIA5 inhibits Cas9 by preventing DNA target cleavage, but DNA target binding
      of Cas9 is unaffected.
  - reference_id: PMID:28785032
    supporting_text: Through systematic cloning of its genes, we identified an Acr solely responsible
      for the abolished immunity.
knowledge_gaps:
- gap_statement: How the disordered tail of AcrIIA5 actually prevents DNA cleavage is unknown. Whether
    its positive charges occlude the RuvC active site directly or displace the guide RNA and the
    scissile strand allosterically has not been determined, and no AcrIIA5-Cas9 complex structure
    exists.
  boundary: 'Established: AcrIIA5 binds only guide-loaded Cas9, does not compete with target-DNA
    binding, needs more than 20 residues of disordered tail and the Arg12/Lys13/Arg14 charge cluster,
    and RuvC rather than HNH is the affected domain. Unknown: the contact surface on Cas9 and the
    physical basis of the block.'
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: It is the one Cas9 inhibitor reported to act without competing for the DNA target, so
    its mechanism is not reducible to the DNA-mimicry or HNH-blockade paradigms and would define a
    third class of anti-CRISPR mechanism.
  resolution: A structure or crosslinking map of the AcrIIA5-Cas9-sgRNA complex, with the tail
    resolved, together with cleavage assays that separate target-strand from non-target-strand nicking.
  provenance:
  - reference_id: PMID:32544231
    supporting_text: We postulate that the positive charges of the IDR may directly occlude the
      catalytic site of the Cas9 nuclease domain, or indirectly interferes with conformational
      transitions of Cas9 required for target DNA cleavage.
- gap_statement: Whether the partial guide-RNA cleavage seen whenever AcrIIA5 is co-expressed with
    Cas9 is a mechanistically necessary consequence of inhibition or an incidental effect of host
    ribonucleases acting on a destabilised complex has not been tested directly.
  boundary: 'Established: the cleavage occurs with several AcrIIA5 homologues and two different Cas9
    orthologues, is absent with inhibition-dead AcrIIA5 mutants, and purified AcrIIA5 has no
    ribonuclease activity of its own. Unknown: whether guide cleavage contributes to inhibition in
    vivo or merely reports on it.'
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: If guide degradation contributes to inhibition, AcrIIA5 is effectively irreversible in
    vivo in a way the in vitro assays cannot show, which matters both for phage biology and for its
    use as an off-switch.
  resolution: Repeat the co-expression experiments in hosts depleted of candidate ribonucleases, and
    measure guide integrity and cleavage inhibition in parallel over an infection time course.
  provenance:
  - reference_id: PMID:32544231
    supporting_text: Notwithstanding, the observation of sgRNA cleavage in the presence of AcrIIA5 in
      vivo suggests that AcrIIA5 possibly interferes with the Cas9–sgRNA assembly, leaving sgRNA
      vulnerable to cellular ribonucleases.
- gap_statement: The reason the His66/Asn70/His73 variant inhibits SpCas9 in a phage plaquing assay
    but fails to inhibit the same enzyme in vitro is unexplained.
  boundary: Both results are reported and each is internally controlled; the discrepancy is
    acknowledged but not resolved by either group.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: These residues sit in the mobile loop that the structural work implicates in
    inhibition, so the discrepancy may point to a host factor, a concentration regime or a
    conformational state present in the cell and absent from the reconstituted assay.
  resolution: Titrate the variant against Cas9 over a wide concentration range in vitro and measure
    its intracellular abundance and Cas9 occupancy in the plaquing host.
  provenance:
  - reference_id: PMID:32544231
    supporting_text: It is not clear what caused the discrepancy of Cas9 inhibition in vitro and in
      vivo.
suggested_questions:
- question: Does the disordered N-terminal tail of AcrIIA5 occlude the RuvC active site directly, or
    does it act allosterically by mispositioning the guide RNA, as the authors of the structural work
    leave open?
- question: Why is D4276 AcrIIA5 only weakly active against St3Cas9 when the 87% identical D1126
    orthologue inhibits it completely, and which substitutions account for the difference?
- question: Should GO offer a term for inhibition that leaves substrate binding intact, given that
    AcrIIA5 is reported to be unique among Cas9 inhibitors in not competing with target DNA, and that
    nuclease inhibitor activity does not distinguish this case from the DNA-mimicry inhibitors?
- question: Is the guide-RNA cleavage that accompanies AcrIIA5 activity part of the inhibitory
    mechanism in vivo, or a downstream consequence of a destabilised Cas9-guide complex?
suggested_experiments:
- description: Determine a structure of the AcrIIA5-Cas9-sgRNA complex, by cryo-EM or by NMR with
    selective labelling of the tail, to locate the disordered region on Cas9 and test the direct
    occlusion versus allosteric models.
- description: Assay target-strand and non-target-strand nicking separately, using Cas9 nickase
    variants and strand-specific substrates, to establish which cleavage event AcrIIA5 blocks and
    whether the block is confined to RuvC.
- description: Swap the divergent residues between the D4276 and D1126 orthologues and assay each
    chimera against St1Cas9, St3Cas9 and SpCas9, to map the determinants of orthologue specificity.
- description: Co-express AcrIIA5 with Cas9 in hosts individually depleted of candidate
    ribonucleases, measuring guide-RNA integrity and cleavage inhibition in parallel, to test whether
    guide degradation is required for inhibition.
- description: Measure AcrIIA5 abundance and Cas9 occupancy through a natural phage D4276 infection
    time course of an immunised Streptococcus thermophilus host, to establish whether the protein
    accumulates fast enough to outrun target cleavage in the native setting.
