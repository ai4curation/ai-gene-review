- term:
    id: GO:0140678
    label: molecular function inhibitor activity
  evidence_type: IMP
  original_reference_id: PMID:32544231
  qualifier: enables
  review:
    summary: The DisProt row captures the right molecular function in kind but stops at the top of the
      inhibitor-activity branch. The cited paper establishes both what is inhibited and by what.
      Purified AcrIIA5 alone completely blocks Cas9-sgRNA cleavage of a double-stranded DNA target in
      vitro (Figure 3A), and a graded series of N-terminal truncations and charge-neutralising
      mutations of the disordered region loses that inhibition (Figures 3C, 3E, 3F), which is the
      mutant-phenotype reasoning behind the IMP code. Two further papers establish the inhibited
      activity as DNA cleavage specifically, with target-DNA binding left intact and the RuvC
      nuclease domain implicated.
    action: MODIFY
    reason: 'The term is true but less specific than the evidence supports: the inhibited enzyme
      activity is known, so GO:0140721 nuclease inhibitor activity, an is_a descendant of GO:0140678
      via GO:0004857 enzyme inhibitor activity, should be used instead. This is the term the
      equivalent review in this repository uses for AcrIIC1 (genes/NEIME/acrIIC1). I deliberately
      stop at nuclease inhibitor activity rather than descending to GO:0060703 deoxyribonuclease
      inhibitor activity: the entity bound and inhibited is an RNA-guided ribonucleoprotein rather
      than a classical deoxyribonuclease, and the reported target within it is the RuvC domain of
      that holo-enzyme, so the parent term is the defensible stopping point. Specificity is real and
      not merely assumed - AcrIIA5 does not inhibit the unrelated RNA-guided nuclease Cas12a.'
    proposed_replacement_terms:
    - id: GO:0140721
      label: nuclease inhibitor activity
    supported_by:
    - reference_id: PMID:32544231
      supporting_text: Purified AcrIIA5 completely inhibited target double-stranded DNA (dsDNA)
        cleavage of Cas9–sgRNA in the in vitro nuclease activity assay, demonstrating that AcrIIA5
