gene_symbol: acrIIA5
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2006928
  label: Streptococcus phage D4276
description: AcrIIA5 is a 140-residue anti-CRISPR protein encoded by the virulent Streptococcus
  thermophilus phage D4276. It adopts a novel seven-stranded beta-sheet and two-helix fold preceded
  by a basic, intrinsically disordered N-terminal region of about 22 residues. Inside the infected
  bacterial cell it binds the guide-RNA-loaded Cas9 ribonucleoprotein and blocks cleavage of the
  target DNA duplex, while leaving guide loading and target-DNA engagement intact; it does not
  degrade the guide RNA itself and does not act on apo-Cas9. The disordered tail, which supplies
  both the length needed for association and the positive charges needed for inhibition, and a
  mobile beta3-beta4 loop in the folded core are the functional determinants. Inhibition extends
  across type II-A, II-B and II-C Cas9 orthologues, making it one of the broadest-spectrum Cas9
  inhibitors known, and it operates in its native host, in heterologous bacteria and in human
  cells. The biological consequence is escape of the phage genome from host CRISPR-Cas9 immunity.
