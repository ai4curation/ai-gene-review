  original_reference_id: PMID:28785032
  qualifier: acts_upstream_of_or_within_positive_effect
  review:
    summary: 'CACAO row, evidence ECO:0007040 (plaque assay evidence used in manual assertion). What
      the cited paper shows for this gene: phage D4276 escaped CRISPR immunity in Streptococcus
      thermophilus more than 40,000-fold more efficiently than related phages, systematic cloning of
      its ORFs identified a single gene wholly responsible for that escape, and the cloned product
      also abolished immunity conferred by the heterologous Streptococcus pyogenes Cas9 in another
      genus. That gene product is the 140-residue protein of this entry (D4276_028). The CACAO term
      matches the assay exactly: GO:0098672 is the most specific GO term for a symbiont protein
      neutralising host CRISPR-Cas immunity, and plaquing on CRISPR-immunised versus naive hosts
      measures that process directly rather than a downstream phenotype. The chosen ECO code is also
      an unusually precise one for the assay actually performed.'
    action: ACCEPT
    reason: The claim is correct, maximally specific, and directly supported by the cited experiments
      on this protein, so this is neither a phenotype-read-as-process nor a wrong-granularity case.
      The only defect is the GAF qualifier. acts_upstream_of_or_within_positive_effect describes a
      gene product that influences a process from outside it, whereas AcrIIA5 itself carries out the
      suppression, which is what the two involved_in rows for the same term correctly say. That is a
      source-record field error, recorded in source_defects, and not a reason to reject the claim.
    supported_by:
    - reference_id: PMID:28785032
      supporting_text: we found one that evaded the CRISPR-encoded immunity >40,000× more often than
        the others
      reference_section_type: ABSTRACT
    - reference_id: PMID:28785032
      supporting_text: Through systematic cloning of its genes, we identified an Acr solely
        responsible for the abolished immunity.
      reference_section_type: ABSTRACT
    - reference_id: PMID:28785032
      supporting_text: This Acr completely abolishes SpCas9-mediated immunity in our assays.
      reference_section_type: ABSTRACT
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: OTHER
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: acts_upstream_of_or_within_positive_effect
      corrected_value: involved_in
      cause: OTHER
      confidence: CONFIRMED
      explanation: 'This GAF row (assigned_by CACAO, GONUTS community curation, dated 2025-04-10 and
        2025-04-07) carries the qualifier acts_upstream_of_or_within_positive_effect for GO:0098672
