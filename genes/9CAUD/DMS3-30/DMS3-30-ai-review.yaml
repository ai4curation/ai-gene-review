gene_symbol: DMS3-30
aliases:
- AcrIE3
- ACR3-30
- gene 30
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2913973
  label: Pseudomonas phage DMS3
description: >-
  Gene 30 of the temperate Mu-like Pseudomonas phage DMS3 encodes AcrIE3
  (originally ACR3-30), a 68-residue anti-CRISPR protein that neutralises the
  type I-E CRISPR-Cas system of Pseudomonas aeruginosa. It lies in the conserved
  anti-CRISPR operon that these phages carry between the homologue of Mu gene G
  and the protease/scaffold gene, and is one of four unrelated families of type
  I-E anti-CRISPRs found there. Expressed inside the infected or lysogenised
  bacterium, it binds the Cas8e subunit of the type I-E surveillance complex
  Cascade and occludes the protospacer-adjacent-motif recognition site through an
  acidic surface on an all-helical fold, so that Cascade can no longer recognise
  its DNA target and cannot recruit Cas3 to destroy it. The consequence is that a
  phage genome bearing a matching protospacer survives host CRISPR-Cas immunity
  and replicates. Its activity is narrow in two directions. It does not inhibit
  the type I-F system of the same host, and it does not inhibit the distantly
  related type I-E system of Escherichia coli, so it is specific for the
  P. aeruginosa type I-E Cascade rather than for the subtype as such.
references:
- id: PMID:24736222
  title: A new group of phage anti-CRISPR genes inhibits the type I-E CRISPR-Cas system
    of Pseudomonas aeruginosa.
  findings:
  - statement: >-
      Plasmid-borne expression of DMS3 gene 30 (ACR3-30) in Pseudomonas
      aeruginosa SMC4386, a strain with a natively active type I-E CRISPR-Cas
      system, allowed the CRISPR-sensitive phage JBD8 to form plaques three to
      five orders of magnitude more efficiently than empty vector. Three other
      unrelated genes, from phages JBD88a, D3112 and JBD5, had the same effect,
      defining four families of type I-E anti-CRISPRs.
    supporting_text: >-
      As shown in Fig. 3C, expression of putative anti-CRISPR genes from phages
      JBD88a, DMS3, D3112, and JBD5 allowed CRISPR-sensitive phage JBD8 to form
      plaques with 103- to 105-fold-higher efficiency than on cells containing
      empty vector.
    reference_section_type: RESULTS
  - statement: >-
      The protein encoded by DMS3 gene 30 is named ACR3-30 in this paper. The
      other three are ACR88a-32 (phage JBD88a), ACR3112-31 (phage D3112,
      UniProtKB:Q6TM71) and ACR5-34 (phage JBD5).
    supporting_text: >-
      We designate the proteins encoded by these anti-CRISPR genes as ACR88a-32,
      ACR3-30, ACR3112-31, and ACR5-34
    reference_section_type: RESULTS
  - statement: >-
      The effect is specific to the four new families. Five type I-F anti-CRISPR
      genes and the conserved JBD30-36 gene, assayed in the same figure, did not
      rescue JBD8 plaquing.
    supporting_text: >-
      In contrast, plasmids expressing any one of five different type I-F
      anti-CRISPR genes, or gene JBD30-36 (homologs of which are found at the 3′
      ends of all anti-CRISPR regions) had no effect on JBD8 plaquing.
    reference_section_type: RESULTS
  - statement: >-
      Gene 30 is also required in the phage's own genome. A CRISPR-targeted
      derivative of DMS3 plaqued robustly on SMC4386, whereas isogenic phages in
      which gene 30 had been replaced by a type I-F anti-CRISPR gene, or by a
      frameshifted version of it, could not plaque at all, and all three plaqued
      equally on a CRISPR-Cas-negative strain.
    supporting_text: >-
      In contrast, a mutant phage in which the DMS3m type I-E anti-CRISPR gene
      was replaced with a type I-F anti-CRISPR gene (DMS3m30-35 [9]) was not able
      to form plaques on SMC4386.
    reference_section_type: RESULTS
  - statement: >-
      The authors state the conclusion for gene 30 explicitly, as an activity
      exercised during lytic infection.
    supporting_text: >-
      These results demonstrate that gene 30, the type I-E anti-CRISPR gene of
      phage DMS3m, functions during lytic infection to inhibit the type I-E
      CRISPR-Cas system of SMC4386 and, thus, allow robust phage replication
      within this strain.
    reference_section_type: RESULTS
  - statement: >-
      Activity is host-specific. None of the four type I-E anti-CRISPRs,
      including ACR3-30, inhibited the type I-E CRISPR-Cas system of Escherichia
      coli K-12, although all four were shown to be robustly expressed there.
    supporting_text: >-
      These data show that the anti-CRISPR proteins encoded by P. aeruginosa
      phages are not active against the type I-E system in E. coli.
    reference_section_type: RESULTS
  - statement: >-
      A DMS3 prophage inactivates the host type I-E system from the lysogenic
      state as well, restoring protospacer-plasmid transformation to roughly
      empty-vector efficiency.
    supporting_text: >-
      the lysogens of phages JBD5, JBD24, DMS3, and JBD26 could be transformed
      with ~100% efficiency compared to the empty vector
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed- and PMC-verified (PMC3993853), full text cached. This is the paper
      that discovered the type I-E anti-CRISPRs and it assays DMS3 gene 30
      directly, twice, by plasmid gain-of-function in Fig. 3C and by gene
      replacement in the phage genome in Fig. 4. It is the correct and sufficient
      citation for the annotation under review.
- id: PMID:39541974
  title: Structural and biochemical insights into the mechanism of the anti-CRISPR
    protein AcrIE3.
  findings:
  - statement: >-
      AcrIE3 acts by binding one subunit of the host type I-E surveillance
      complex, Cas8e, rather than the complex as a whole or the Cas3 nuclease.
    supporting_text: >-
      Our results reveal that AcrIE3 selectively binds to the Cas8e subunit of
      the Cascade complex.
    reference_section_type: ABSTRACT
  - statement: >-
      Mutational analysis localises the inhibitory surface to acidic residues
      that contact the protospacer-adjacent-motif recognition site of Cas8e, the
      site Cascade uses to license target DNA, making this a competitive block on
      target recognition.
    supporting_text: >-
      Through extensive mutational analyses, we show that AcrIE3 interacts with
      the protospacer adjacent motif (PAM) recognition site in Cas8e through its
      negatively charged surface residues.
    reference_section_type: ABSTRACT
  - statement: >-
      The crystal structure is an all-helical fold presenting a negatively
      charged surface.
    supporting_text: >-
      The crystal structure of AcrIE3 exhibits an all-helical fold with a
      negatively charged surface.
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, cached record is abstract-only (no PMC record). The
      identity of the assayed protein with this entry was checked independently
      of the text. The paper's coordinates are PDB 8HEL, whose chain A sequence
      is A0SMP0's 68 residues followed by a LEHHHHHH tag, and which RCSB labels
      "AcrIE3 | Pseudomonas phage DMS3 (2913973)". Supplies the mechanism that
      the 2014 phage-genetics paper could not.
- id: PMID:38797150
  title: Novel structure of the anti-CRISPR protein AcrIE3 and its implication on
    the CRISPR-Cas inhibition.
  findings:
  - statement: >-
      An independently determined high-resolution crystal structure of AcrIE3,
      described as a four-helix bundle with an extended N-terminal loop.
    supporting_text: >-
      Our structural examination showed that AcrIE3 adopts a helical bundle fold
      comprising four α-helices, with a notably extended loop at the N-terminus.
    reference_section_type: ABSTRACT
  - statement: >-
      Three acidic surface patches are identified and proposed to carry the
      inhibitory function, agreeing with the mutagenesis in PMID:39541974.
    supporting_text: >-
      surface analysis of AcrIE3 revealed the presence of three acidic regions,
      which potentially play a crucial role in the inhibitory function of this
      protein
    reference_section_type: ABSTRACT
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, cached record is abstract-only (no PMC record). Identity
      with this entry confirmed through PDB 8ZEY, whose chain A sequence is
      exactly A0SMP0's 68 residues. Corroborates the acidic-surface claim
      structurally but reports no binding or inhibition assay, hence MEDIUM
      rather than HIGH. Its fold description ("four α-helices") is not identical
      to the companion paper's ("all-helical fold"), but the two agree on what
      matters functionally, the acidic surface.
- id: PMID:23242138
  title: Bacteriophage genes that inactivate the CRISPR/Cas bacterial immune system.
  findings:
  - statement: >-
      Defines the DMS3 derivatives used in the later type I-E work. "DMS3m" is
      phage DMS3 itself carrying five point mutations in gene 42 that convert a
      partially matched protospacer into a perfect match to a PA14 crRNA, so that
      DMS3 becomes CRISPR-targeted. It is an isogenic derivative, not a different
      phage isolate.
    supporting_text: >-
      A constructed mutant DMS3 phage (DMS3m) described previously14 as DMS3100%,
      contains five point mutations in gene 42 creating a 100% match to this
      crRNA.
    reference_section_type: METHODS
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Cited here only to establish the provenance of the phage strains behind the
      annotation, which is what distinguishes an own-isolate experiment from a
      cross-isolate transfer. Full text cached. This paper is about the type I-F
      anti-CRISPRs and does not itself assay DMS3 gene 30.
