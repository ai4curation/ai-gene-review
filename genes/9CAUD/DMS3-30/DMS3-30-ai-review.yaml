      supporting_text: >-
        As shown in Fig. 3C, expression of putative anti-CRISPR genes from phages
        JBD88a, DMS3, D3112, and JBD5 allowed CRISPR-sensitive phage JBD8 to form
        plaques with 103- to 105-fold-higher efficiency than on cells containing
        empty vector.
      reference_section_type: RESULTS
    - reference_id: PMID:24736222
      supporting_text: >-
        We designate the proteins encoded by these anti-CRISPR genes as
        ACR88a-32, ACR3-30, ACR3112-31, and ACR5-34
      reference_section_type: RESULTS
    - reference_id: PMID:24736222
      supporting_text: >-
        In contrast, a mutant phage in which the DMS3m type I-E anti-CRISPR gene
        was replaced with a type I-F anti-CRISPR gene (DMS3m30-35 [9]) was not
        able to form plaques on SMC4386.
      reference_section_type: RESULTS
    - reference_id: PMID:24736222
      supporting_text: >-
        These results demonstrate that gene 30, the type I-E anti-CRISPR gene of
        phage DMS3m, functions during lytic infection to inhibit the type I-E
        CRISPR-Cas system of SMC4386 and, thus, allow robust phage replication
        within this strain.
      reference_section_type: RESULTS
    - reference_id: PMID:39541974
      supporting_text: >-
        Our results reveal that AcrIE3 selectively binds to the Cas8e subunit of
        the Cascade complex.
      reference_section_type: ABSTRACT
    additional_reference_ids:
    - PMID:39541974
    - PMID:23242138
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: CACAO
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: acts_upstream_of_or_within_positive_effect
      corrected_value: involved_in
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        This GAF row (assigned_by CACAO, dated 2025-05-03) carries the qualifier
        acts_upstream_of_or_within_positive_effect for GO:0098672
        symbiont-mediated suppression of host CRISPR-cas system. AcrIE3 is the
        effector of that process. It binds the Cas8e subunit of the host type I-E
        Cascade complex at the PAM recognition site and prevents recognition of
        target DNA, which is the suppression itself, not an upstream positive
        influence on it. The correct qualifier is involved_in. The comparator is
        unusually direct. Q6TM71 (D3112 orf31, ACR3112-31), the sibling
        anti-CRISPR assayed in the same figure of the same paper, carries both
        this CACAO row's qualifier from PMID:24736222 and a UniProt involved_in
        row (GO_REF:0000043) for the identical term and claim, so the correct
        qualifier for this exact assertion is already present in GOA on a
        neighbouring gene. The defect is also not isolated. Of the 18 GOA
        annotations to GO:0098672 (QuickGO, 2026-11-01), 9 carry
        acts_upstream_of_or_within_positive_effect and all 9 are CACAO rows
        (A0A220GHA5, A0A247D711, A0A2D0TCG3, A0A425B3G2, A0A6B1YCA6, A0SMP0,
        B3G1L5, L7P7M1, Q6TM71), so the whole set should be corrected together.
        No change to the term, reference or evidence code is needed.
core_functions:
- description: >-
    Binds the Cas8e subunit of the host type I-E CRISPR-Cas surveillance complex
    Cascade through an acidic surface on a small all-helical fold, occupying the
    protospacer-adjacent-motif recognition site so that Cascade can no longer
    license and engage its DNA target or recruit Cas3 to it, thereby neutralising
    host type I-E CRISPR-Cas immunity against the infecting or resident phage
    genome. The activity is specific to the Pseudomonas aeruginosa type I-E
    Cascade. It does not extend to the type I-F system of the same host, nor to
    the Escherichia coli type I-E system.
  proposed_molecular_function: CRISPR-Cas surveillance complex inhibitor activity
