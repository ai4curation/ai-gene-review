  review:
    summary: >-
      CACAO row, evidence ECO:0007040 (plaque assay evidence used in manual
      assertion), dated 2025-05-03, and the only GO annotation this gene product
      has from any source. What the cited paper shows for this gene is that DMS3
      gene 30 encodes ACR3-30, one of four unrelated type I-E anti-CRISPR
      families the paper discovers. Cloned out of DMS3 and expressed from a
      plasmid in Pseudomonas aeruginosa SMC4386, whose native type I-E CRISPR-Cas
      system the same paper had just shown to be active, it let the
      CRISPR-targeted phage JBD8 plaque three to five orders of magnitude better
      than empty vector (Fig. 3C), with five type I-F anti-CRISPR genes and the
      conserved JBD30-36 gene as negative controls in the same figure.
      Independently, isogenic DMS3 phages in which gene 30 was replaced by a type
      I-F anti-CRISPR gene, or by a frameshifted copy of it, lost the ability to
      plaque on SMC4386 while plaquing normally on a CRISPR-Cas-negative strain
      (Fig. 4), and the authors state the conclusion for gene 30 in those words.
      The term matches the assay exactly and is maximally specific, since
      GO:0098672 has no children and the gain-of-function and loss-of-function
      plaque and transformation assays measure suppression of host CRISPR-Cas
      immunity itself rather than a downstream phenotype. IDA is the right code,
      because Fig. 3C assays the cloned gene product directly. Later structural
      work on this exact protein (PDB 8HEL and 8ZEY both carry A0SMP0's 68
      residues) shows it binds the Cas8e subunit of Cascade at the PAM
      recognition site, confirming that the protein is the direct effector of the
      suppression.
    action: ACCEPT
    reason: >-
      The claim is correct, maximally specific, and directly supported by two
      independent experiments on this phage's own gene in the cited paper, so the
      annotation is retained as the gene's core process. The only defect is the
      GAF qualifier. acts_upstream_of_or_within_positive_effect describes a gene
      product that influences a process from outside it, and positively, whereas
      AcrIE3 itself executes the suppression by binding host Cas8e and blocking
      target recognition by Cascade. The correct qualifier is involved_in, which
      is what UniProt's own row for the same term on the sibling protein from the
      same figure of the same paper (Q6TM71, GO_REF:0000043) uses. That is a
      source-record field error, recorded in source_defects, and not a reason to
      reject the claim. Noted for completeness because it was looked for, this
      annotation is not a cross-isolate evidence transfer. The paper assays one
      representative gene from each of four different phages, DMS3 gene 30 among
      them, and the phage used in Fig. 4, "DMS3m", is DMS3 itself carrying five
      point mutations in gene 42, not a sibling isolate.
    supported_by:
