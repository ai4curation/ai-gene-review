proposed_new_terms:
- proposed_name: CRISPR-Cas surveillance complex inhibitor activity
  proposed_definition: >-
    Binds to a CRISPR-Cas surveillance (effector) complex, or to a subunit of
    such a complex, and inhibits its activity, so that the complex no longer
    recognises or licenses its nucleic acid target or no longer recruits the
    effector nuclease. This is the molecular function of anti-CRISPR proteins
    that act on the surveillance complex rather than on the nuclease, such as
    AcrIE3 and AcrIE5 binding Cas8e of the Pseudomonas aeruginosa type I-E
    Cascade.
  justification: >-
    GO currently has no molecular-function term for anti-CRISPR activity. A
    QuickGO ontology search for "CRISPR" returns only biological-process terms
    (GO:0099048, GO:0043571, GO:0098672, plus two obsoletes), so a protein whose
    entire function is to inhibit a CRISPR-Cas system can be given the process
    term GO:0098672 and no activity at all. The nearest existing molecular
    function, GO:0140721 nuclease inhibitor activity, is a poor fit for this
    class. In a type I system the nuclease is Cas3, whereas AcrIE3 binds Cas8e
    within the Cascade surveillance complex and blocks target recognition
    upstream of Cas3 recruitment, and in GOA GO:0140721 and its children are in
    practice occupied by ribonuclease inhibitors of the RraA/RraB type. Proposing
    the term rather than forcing an ill-fitting id also keeps the two mechanistic
    classes of anti-CRISPR distinguishable, since inhibitors that do block
    catalysis, such as AcrIIA5 on Cas9, are already served by GO:0140721. The
    parent proposed below is the generic inhibitor term. This is an ontology gap
    rather than a biological unknown, so it is recorded here and not as a
    knowledge gap.
  proposed_parent:
    id: GO:0140678
    label: molecular function inhibitor activity
  supported_by:
  - reference_id: PMID:39541974
    supporting_text: >-
      Our results reveal that AcrIE3 selectively binds to the Cas8e subunit of
      the Cascade complex.
    reference_section_type: ABSTRACT
  - reference_id: PMID:39541974
    supporting_text: >-
      Through extensive mutational analyses, we show that AcrIE3 interacts with
      the protospacer adjacent motif (PAM) recognition site in Cas8e through its
      negatively charged surface residues.
    reference_section_type: ABSTRACT
  - reference_id: PMID:39541974
    supporting_text: >-
      AcrIE3, identified in a Pseudomonas phage, inactivates the type I-E
      CRISPR-Cas system in Pseudomonas aeruginosa by engaging with the Cascade
      complex.
    reference_section_type: ABSTRACT
knowledge_gaps:
- gap_statement: >-
    Why AcrIE3 inhibits the Pseudomonas aeruginosa type I-E system but not the
    Escherichia coli type I-E system is unknown. Both systems use a
    Cas8e-containing Cascade, and AcrIE3 was shown to be robustly expressed in
    E. coli, so the failure is a property of the interaction rather than of
    protein supply, but the determinants on either side have not been identified.
  boundary: >-
    Established, all four Pseudomonas type I-E anti-CRISPRs, AcrIE3 among them,
    fail to protect phage M13 from an induced E. coli K-12 type I-E system while
    being expressed at levels visible by Coomassie staining; AcrIE3 binds
    P. aeruginosa Cas8e at the PAM recognition site; and the P. aeruginosa and
    E. coli systems are already known to differ in PAM specificity. Unknown,
    which Cas8e residues or which conformational features of the two Cascades
    account for the discrimination.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Anti-CRISPR proteins are proposed as off-switches for CRISPR-based tools, and
    a species-level specificity this sharp between two Cascades of the same
    subtype bears directly on whether such an off-switch can be transplanted. It
    also tests whether the PAM recognition site is the general target of
    divergent type I-E anti-CRISPRs, as the structural work proposes.
  resolution: >-
    Assay AcrIE3 against reconstituted E. coli and P. aeruginosa Cascade in
    vitro, measure binding to each Cas8e, and swap the divergent
    PAM-recognition-site regions between the two Cas8e proteins to find the
    determinants.
  provenance:
  - reference_id: PMID:24736222
    supporting_text: >-
      These data show that the anti-CRISPR proteins encoded by P. aeruginosa
      phages are not active against the type I-E system in E. coli.
    reference_section_type: RESULTS
  - reference_id: PMID:39541974
    supporting_text: >-
      Through extensive mutational analyses, we show that AcrIE3 interacts with
      the protospacer adjacent motif (PAM) recognition site in Cas8e through its
      negatively charged surface residues.
    reference_section_type: ABSTRACT
- gap_statement: >-
    No structure of AcrIE3 bound to Cascade, or to Cas8e, has been determined, so
    whether the acidic surface of AcrIE3 mimics the phosphate backbone of target
    DNA at the PAM recognition site or instead locks Cas8e in a non-permissive
    conformation is not established.
  boundary: >-
    Established, two independent crystal structures of free AcrIE3, a helical
    fold with three acidic surface patches; selective binding to Cas8e rather
    than to other Cascade subunits; and mutations in the acidic surface abolish
    inhibition. Unknown, the complex itself, and therefore which of the two
    mechanisms operates.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    DNA mimicry and allosteric locking are the two paradigms for anti-CRISPRs
    acting on surveillance complexes, and the distinction determines whether
    inhibition is competitive with target DNA and therefore escapable by target
    excess. It also decides whether AcrIE3, AcrIE4 and AcrIE5, which all converge
    on the same site, do so by the same chemistry.
  resolution: >-
    A cryo-EM structure of the AcrIE3-Cascade complex, with competition
    experiments titrating target DNA against AcrIE3 to test whether the block is
    competitive.
  provenance:
  - reference_id: PMID:39541974
    supporting_text: However, its precise inhibition mechanism has remained elusive.
    reference_section_type: ABSTRACT
  - reference_id: PMID:38797150
    supporting_text: >-
      surface analysis of AcrIE3 revealed the presence of three acidic regions,
      which potentially play a crucial role in the inhibitory function of this
      protein
    reference_section_type: ABSTRACT
- gap_statement: >-
    It is not known when during infection, or at what abundance, AcrIE3 is
    produced, and therefore how a phage carrying a perfectly matched protospacer
    manages to express an inhibitor fast enough to outrun Cascade-directed
    destruction of its own genome.
  boundary: >-
    Established, gene 30 lies in an operon with a conserved putative promoter
    upstream, it is sufficient for protection when supplied in trans before
    infection, and it is necessary during lytic infection of a targeted host.
    Unknown, the kinetics of expression from the incoming genome, and whether a
    sub-population of genomes is lost before enough inhibitor accumulates.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    The race between anti-CRISPR expression and CRISPR-Cas targeting sets whether
    anti-CRISPRs protect individual phage genomes or only populations, and the
    same question has been shown to matter for type I-F anti-CRISPRs in this
    phage family.
  resolution: >-
    Time-resolved measurement of gene 30 transcript and protein from a single
    round of infection of a type I-E-immune host, with single-cell reporters of
    phage genome survival.
  provenance:
  - reference_id: PMID:24736222
    supporting_text: >-
      These results demonstrate that gene 30, the type I-E anti-CRISPR gene of
      phage DMS3m, functions during lytic infection to inhibit the type I-E
      CRISPR-Cas system of SMC4386 and, thus, allow robust phage replication
      within this strain.
    reference_section_type: RESULTS
suggested_questions:
- question: >-
    Should GO have a molecular-function term for anti-CRISPR activity? At present
    a protein whose entire function is to inhibit a CRISPR-Cas system can carry
    only the process term GO:0098672, and the nearest activity term, GO:0140721
    nuclease inhibitor activity, does not describe an inhibitor that binds a
    surveillance complex subunit and blocks target recognition rather than
    catalysis.
- question: >-
    Should the qualifier on the nine CACAO rows for GO:0098672 that use
    acts_upstream_of_or_within_positive_effect be corrected in bulk? Every one is
    on a protein that executes the suppression itself, and GOA already holds
    involved_in rows for the same term on some of the same proteins.
- question: >-
    Which residues of Cas8e distinguish the Pseudomonas aeruginosa Cascade, which
    AcrIE3 inhibits, from the Escherichia coli Cascade, which it does not, given
    that the two systems already differ in PAM specificity and AcrIE3 binds the
    PAM recognition site?
- question: >-
    Do AcrIE3, AcrIE4 and AcrIE5, which are unrelated in sequence and fold but
    all reported to converge on the PAM recognition site of Cas8e, inhibit by the
    same physical mechanism, and does that convergence mark the PAM site as the
    most evolutionarily accessible target in a type I-E Cascade?
- question: >-
    Phage DMS3 carries a type I-E anti-CRISPR but no type I-F anti-CRISPR, while
    most phages in this family carry one or both in a mixed-and-matched
    arrangement. What selects for retaining only the I-E gene in DMS3, and does a
    DMS3 prophage leave its host's type I-F immunity intact as a consequence?
suggested_experiments:
- hypothesis: >-
    AcrIE3 inhibits Cascade competitively, by occupying the PAM recognition site
    of Cas8e in the manner of target DNA.
  description: >-
    Determine a cryo-EM structure of AcrIE3 bound to reconstituted Pseudomonas
    aeruginosa type I-E Cascade, and in parallel titrate target DNA against
    AcrIE3 in electrophoretic mobility shift and Cas3-dependent cleavage assays
    to test whether the block is relieved by target excess.
- hypothesis: >-
    The failure of AcrIE3 against the Escherichia coli type I-E system is due to
    divergence in the Cas8e PAM recognition site rather than to any other subunit
    or to protein stability.
  description: >-
    Measure AcrIE3 binding to purified E. coli and P. aeruginosa Cas8e and to
    each assembled Cascade, then build reciprocal chimaeras exchanging the
    PAM-recognition-site regions of the two Cas8e proteins and assay inhibition
    of each chimaeric Cascade.
- hypothesis: >-
    Protection of an incoming phage genome depends on how quickly gene 30 is
    expressed relative to Cascade-directed cleavage, so the gene should behave as
    an early gene.
  description: >-
    Follow gene 30 transcript and protein through a single synchronised infection
    of a type I-E-immune host by quantitative RT-PCR and quantitative immunoblot,
    alongside a fluorescent reporter of phage genome integrity in single cells,
    and compare phages in which gene 30 is placed under early, middle and late
    promoters.
- hypothesis: >-
    The three acidic surface patches of AcrIE3 are not equivalent; one carries
    the Cas8e interaction and the others are structural.
  description: >-
    Make charge-reversal and charge-neutralisation variants of each acidic patch
    separately and in combination, and score each for Cas8e binding by isothermal
    titration calorimetry and for inhibition in the JBD8 plaquing assay in
    SMC4386, to separate the binding determinant from the rest of the surface.
- hypothesis: >-
    AcrIE3 is sufficient to protect an otherwise unprotected phage from a type
    I-E system, as the reciprocal gene-replacement experiment showed it is
    necessary.
  description: >-
    Introduce gene 30 alone into a type I-E CRISPR-sensitive phage that lacks any
    anti-CRISPR gene, such as JBD8, by homologous recombination, and measure
    plaquing on SMC4386 and on a CRISPR-Cas-negative strain, completing the
    sufficiency half of the Fig. 4 experiment in the phage genome rather than
    from a plasmid.
