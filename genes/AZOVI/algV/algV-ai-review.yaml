core_functions:
- description: Participates as the AlgJ-family SGNH component in alginate O-acetylation at the periplasmic
    face of the inner membrane. Homolog assays support catalytic acetyl-group handling, but the physiological
    donor, recipient and transfer reaction remain unresolved. No intrinsic molecular function or distributed
    complex activity is assigned solely to express this uncertainty.
