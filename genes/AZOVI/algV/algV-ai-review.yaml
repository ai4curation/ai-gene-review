  review:
    action: ACCEPT
    summary: The protein is assigned to the bacterial inner membrane.
    reason: The curated target location places AlgV at the periplasmic face of the inner membrane by similarity.
      Pseudomonas AlgJ fractionation supports the homologous location, but the target signal-peptide processing
      and membrane association have not been measured here. Accept the inferred compartment without transferring
      the Pseudomonas uncleaved-anchor mechanism as a native observation.
