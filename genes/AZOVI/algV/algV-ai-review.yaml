id: O52197
gene_symbol: algV
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: AlgV is the AlgJ-family component of the alginate O-acetylation machinery in Azotobacter
  vinelandii. It has an SGNH hydrolase-like domain and is predicted to act on the periplasmic side of
  the inner membrane, supporting acetyl-group transfer during polymer modification. AlgV corresponds to
  the acetylation protein called AlgJ in Pseudomonas. It is distinct from the Azotobacter outer-membrane
  alginate-export protein historically called AlgJ.
