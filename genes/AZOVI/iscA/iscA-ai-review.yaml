id: O31271
gene_symbol: iscA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: IscA is an A-type iron-sulfur assembly accessory protein encoded in the Azotobacter vinelandii
  housekeeping isc operon. Its conserved cysteines and A-type protein domains support a metal/cluster-handling
  role. Native depletion compromises aconitase maturation and becomes lethal under elevated oxygen, while
  its precise chemical contribution remains unresolved. This IscA is distinct from the NifIscA paralog
  encoded in the nitrogen-fixation region.
