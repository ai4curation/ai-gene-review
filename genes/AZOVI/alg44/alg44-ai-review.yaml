id: P94200
gene_symbol: alg44
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: Alg44 is the Alg44-family copolymerase required for alginate production in Azotobacter vinelandii.
  Its conserved PilZ domain supports c-di-GMP recognition and regulation of the Alg8 polymerase by homology.
  The protein is inferred to bridge a cytoplasmic regulatory domain and a periplasmic assembly domain
  through the inner membrane. Native genetics establishes its requirement for alginate production, while
  direct ligand binding and detailed activation mechanisms remain comparative assignments.
