id: P70805
gene_symbol: algG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: AlgG is a mannuronan C5-epimerase from Azotobacter vinelandii that converts
  polymer-bound beta-D-mannuronate residues to alpha-L-guluronate. Recombinant strain E AlgG is
  catalytically active without added calcium. It is inferred to act in the periplasm and to help
  guide/protect nascent alginate during export. Its physiological epimerization contribution is
  small compared with the secreted AlgE1–7 enzymes under tested growth conditions.
