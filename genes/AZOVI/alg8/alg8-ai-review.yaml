- id: PMID:32989088
  title: Increased c-di-GMP Levels Lead to the Production of Alginates of High Molecular Mass in Azotobacter
    vinelandii.
  full_text_unavailable: false
  findings:
  - statement: Native c-di-GMP regulation is measured in Azotobacter; Alg44 receptor assignment is explicitly
      presumed from conservation. The AvGReg/MucG control module differs from the Pseudomonas MucR circuit.
      The introduction mistakenly calls the Alg8 substrate GDP-mannose; the actual activated substrate
      is GDP-mannuronate.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
