- term:
    id: GO:0085029
    label: extracellular matrix assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002740694
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Matrix assembly exceeds the established polymerization role.
    reason: An active polysaccharide synthase can participate in matrix assembly where that role is
      demonstrated. For this Azotobacter target, the retrieved native study tests alginate
      production and predicts the polymerase role, but does not resolve participation in the
      aggregation, arrangement or organization of a particular extracellular matrix. The
      PTN002740694 electronic transfer therefore exceeds the target-specific context established
      here. This is not a categorical exclusion of polymerases from assembly or a denial that
      alginate supplies extracellular structure; evidence of a native matrix-architecture phenotype
      could support retention.
    supported_by:
    - *id001
    - *id002
