id: P94199
gene_symbol: alg8
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: Alg8 is the membrane glycosyltransferase component of the Azotobacter vinelandii
  alginate polymerization machinery. It is inferred to extend a mannuronan chain from
  GDP-mannuronate in cooperation with the Alg44 copolymerase. Native ATCC 9046 mutants fail to
  produce alginate; the specific polymerization chemistry is supported by pathway context, sequence
  family and characterized homologs.
