- term:
    id: GO:0030213
    label: hyaluronan biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002740694
  review:
    action: REMOVE
    summary: The propagated hyaluronan-specific claim conflicts with the native alginate
      polymerization role.
    reason: Native alg8 disruption abolishes alginate production, and the target curated function
      and alginate-locus context support GDP-mannuronate polymerization. Hyaluronan instead requires
      alternating glucuronate and N-acetylglucosamine. Reject the erroneous substrate-specific
      assertion consistently with the identical PTN002740694 transfer to KT2440 and the Pa IBA; the
      independently supported alginate process and core synthase activity remain. This is not
      removal of a true broad claim or an argument from donor count. Even PTHR22913:SF12 contains
      both Alg8 and non-alginate glycosyltransferases, so its label does not establish substrate
      specificity.
    supported_by:
    - *id001
    - &id002
      reference_id: file:AZOVI/alg8/alg8-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Possibly a processive enzyme that polymerizes GDP-mannuronic acid.
    - &id003
      reference_id: file:AZOVI/alg8/alg8-uniprot.txt
      record_section:
      - CC:SIMILARITY
      supporting_text: Belongs to the glycosyltransferase 2 family.
