- term:
    id: GO:0085029
    label: extracellular matrix assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002740694
  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: Matrix assembly exceeds the established polymerization role.
    reason: An active polysaccharide synthase can participate in matrix assembly where that role is
      demonstrated. For this Azotobacter target, the retrieved native study tests alginate
      production and predicts the polymerase role, but does not resolve participation in the
      aggregation, arrangement or organization of a particular extracellular matrix. The
      PTN002740694 electronic transfer therefore exceeds the target-specific context established
      here. This is not a categorical exclusion of polymerases from assembly or a denial that
      alginate supplies extracellular structure; evidence of a native matrix-architecture phenotype
      could support retention.
    supported_by:
    - *id001
    - *id002
- term:
    id: GO:0047643
    label: alginate synthase activity
  evidence_type: ISS
  original_reference_id: file:AZOVI/alg8/alg8-uniprot.txt
  qualifier: enables
  supporting_entities:
  - UniProtKB:Q52463
  review:
    action: NEW
    summary: Alg8 is inferred to catalyze GDP-mannuronate extension of the mannuronan precursor of
      alginate.
    reason: 'Native ATCC 9046 alg8 mutation abolishes alginate production, and PMID:9358065 identifies
      sequence homology to Pseudomonas aeruginosa Alg8 in the conserved alginate locus. The experimentally
      characterized P. aeruginosa ortholog Q52463 supplies the catalytic interpretation: GDP-mannuronate
      polymerization in envelope fractions and mutational requirements of predicted Alg8 active-site
      residues. The target curated function and GT2 identity corroborate this inference but do not
      alone establish substrate specificity. Use ISS, not a direct target activity code: the native
      knockout establishes necessity, not purified target catalysis, and the ortholog assay used a
      protein assembly. This MF adds coverage absent from the five original rows; no retained MF ancestor,
      descendant or replacement already represents it. The removed hyaluronan activity (EC 2.4.1.212)
      is a different substrate-specific sibling, not a broader alginate claim. GO:0047643 maps to
      EC 2.4.1.33, now named mannuronan synthase by IUBMB; retain the official GO label while specifying
      precursor polymer chemistry.'
    additional_reference_ids:
    - PMID:9358065
    - PMID:16391057
    - PMID:18524915
    supported_by:
    - reference_id: PMID:9358065
      supporting_text: 'vinelandii alg8 and alg44 genes, whose sequences are highly homologous to
        those

        of the corresponding Pseudomonas aeruginosa genes.'
    - reference_id: PMID:9358065
      supporting_text: 'alg8 and alg44 mutants were

        constructed and shown to be completely impaired in alginate production.'
    - reference_id: file:AZOVI/alg8/alg8-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Possibly a processive enzyme that polymerizes GDP-mannuronic acid.
    - reference_id: file:AZOVI/alg8/alg8-uniprot.txt
      record_section: ["CC:SIMILARITY"]
      supporting_text: Belongs to the glycosyltransferase 2 family.
    - reference_id: PMID:16391057
      supporting_text: 'An enzymatic in vitro alginate polymerization assay was developed by using

        14C-labeled GDP-mannuronic acid as a substrate and subcellular fractions of

        alginate overproducing Pseudomonas aeruginosa FRD1 as a polymerase source.'
    - reference_id: PMID:18524915
      supporting_text: 'Alanine substitution mutagenesis showed that

        all of the predicted active site residues in the widely spaced D, DxD, D, LxxRW

        motif were required for polymerization activity in vivo'
