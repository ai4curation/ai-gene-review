  review:
    action: MODIFY
    summary: Replace hyaluronan production with alginate production.
    reason: GO:0030213 requires the glucuronate/GlcNAc disaccharide polymer. Native Alg8 belongs to the
      alginate locus and its loss eliminates alginate. The target subfamily is MANNURONAN SYNTHASE within
      a wider family named HYALURONAN SYNTHASE. The PTN002740694 electronic assignment transfers the wrong
      polymer specificity; this is a lateral correction, not a claim of ontology ancestry or weak donor
      count.
