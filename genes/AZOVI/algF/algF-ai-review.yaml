id: P70799
gene_symbol: algF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: AlgF is a small exported protein required for O-acetylation of alginate in Azotobacter
  vinelandii. A nonpolar algF mutant of strain ATCC 9046 produces unacetylated alginate and
  forms cysts with reduced long-term survival under desiccation. AlgF is predicted to act
  in the periplasm as a noncatalytic component of the acetylation machinery. Related Pseudomonas
  AlgF proteins mediate interactions among acetylation enzymes, suggesting an organizational
  role rather than intrinsic acetyltransferase activity.
