core_functions:
- description: Supports alginate O-acetylation as a noncatalytic machinery component. Native
    loss-of-function establishes the modification role, while the proposed organizational
    mechanism derives from Pseudomonas homolog experiments. These data do not establish that
    AlgF contributes to a molecular function distributed across a catalytic complex, so the
    core records the supported process and location without a molecular-function assignment.
