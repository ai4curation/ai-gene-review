  review:
    action: MODIFY
    summary: The specific supported role is modification of alginate by O-acetylation.
    reason: The target belongs to the conserved alginate modification machinery sequenced
      in the native ATCC 9046 biosynthetic locus. Its assigned role is acetyl-group addition
      to an existing polymer, rather than backbone polymerization. Use alginic acid acetylation
      as a lateral correction of biological role; live QuickGO confirms that GO:0051979 is
      not an is_a/part_of descendant of GO:0042121. This is not an ontology-ancestry claim.
      The native nonpolar algF mutant produces unacetylated polymer, directly supporting the
      modification role; this does not establish intrinsic AlgF catalysis. The Pseudomonas
      aeruginosa PDO300 production defect and polymerization/secretion-complex stability effects
      reported in PMID:31900562 provide an additional basis for retaining biosynthesis in
      that homolog review. Equivalent native Azotobacter evidence is not established here;
      the nonpolar AJ34 mutant still makes alginate. Conserved participation in acetylation
      is therefore retained without transferring the strain-specific production/stability
      phenotype as an additional biosynthetic role.
    supported_by:
