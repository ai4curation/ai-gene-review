    summary: AlgX is a conserved component of alginate production and export.
    reason: The native locus sequence and specific AlgX-family assignment support the curated role in
      maintaining the nascent polymer during periplasmic transit as well as modification. This is a biosynthetic-system
      contribution rather than an assertion of glycosyltransferase activity. Detailed polymer protection
      and acetylation mechanisms are inferred from Pseudomonas homologs.
