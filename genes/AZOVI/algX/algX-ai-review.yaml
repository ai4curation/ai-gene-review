core_functions:
- description: Catalyzes terminal O-acetyl transfer to alginate in the periplasm, inferred from specific
    AlgX-family membership, SGNH/CBM architecture and direct polymer-transfer assays of Pseudomonas AlgX.
    Also supports nascent polymer protection/export by homology; native Azotobacter enzymology and donor
    identity remain untested.
