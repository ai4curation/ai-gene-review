id: O52194
gene_symbol: algX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: AlgX is a predicted periplasmic component of the alginate biosynthesis and modification machinery
  in Azotobacter vinelandii. It contains an N-terminal SGNH hydrolase-like domain and a C-terminal carbohydrate-binding
  module. Specific family membership and characterization of Pseudomonas homologs support roles in protecting
  the nascent polymer during export and in terminal O-acetylation. These mechanistic assignments are comparative
  inferences rather than results of purified Azotobacter AlgX assays.
