    label: O-acetyltransferase activity
  evidence_type: ISS
  original_reference_id: PMID:25165982
  supporting_entities:
  - UniProtKB:Q51372
  review:
    action: NEW
    summary: Intrinsic O-acetyltransferase activity is inferred from the specific AlgX family and characterized homolog.
    reason: The target belongs specifically to the AlgX family and has its SGNH hydrolase-like N-terminal
      domain plus C-terminal carbohydrate-binding module. This architecture and the curated target
      by-similarity activity statement support transfer of the demonstrated Pseudomonas aeruginosa AlgX
      polymer O-acetylation activity. This is an inferred intrinsic enzyme activity, not an Azotobacter
      biochemical assay and not a distributed complex activity. The homolog experiment uses a surrogate
      acetyl donor; native donor identity, kinetics and target residue requirements are not transferred.
      Neither seeded row covers this molecular function. No target-specific evidence of catalytic
      divergence was identified.
    supported_by:
    - *id001
    - reference_id: file:AZOVI/algX/algX-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Probably has acetyltransferase activity in vivo (By similarity).
    - reference_id: file:AZOVI/algX/algX-uniprot.txt
      record_section: ["CC:DOMAIN"]
      supporting_text: Consists of two domains, with an N-terminal domain with structural homology to members
        of the SGNH (GDSL) hydrolase superfamily and a C-terminal carbohydrate-binding module (CBM) that may bind alginate.
    - reference_id: PMID:25165982
      supporting_text: AlgX was capable of utilizing the surrogate acetyl-donor 4-nitrophenyl acetate to
        catalyze the O-acetylation of polymannuronic acid.
