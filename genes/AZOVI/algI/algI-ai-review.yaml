id: O52196
gene_symbol: algI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: AlgI is a multipass inner-membrane member of the membrane-bound O-acyltransferase family
  in Azotobacter vinelandii. It is assigned to the alginate O-acetylation machinery encoded in the alginate
  biosynthetic locus and is predicted to support delivery of acetyl groups to the periplasmic modification
  system. Its catalytic role is inferred from specific AlgI-family membership and conserved pathway context;
  the native acetyl donor and detailed transfer mechanism have not been directly established for this
  protein.
