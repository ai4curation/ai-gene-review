- term:
    id: GO:0042121
    label: alginic acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR028362
  - UniPathway:UPA00286
  review:
    action: MODIFY
    summary: The specific supported role is modification of alginate by O-acetylation.
    reason: The target belongs to the conserved alginate modification machinery sequenced in the native
      ATCC 9046 biosynthetic locus. Its assigned role is acetyl-group addition to an existing polymer,
      rather than backbone polymerization. Use alginic acid acetylation as a lateral correction of biological
      role; live QuickGO confirms that GO:0051979 is not an is_a/part_of descendant of GO:0042121. This
      is not an ontology-ancestry claim. The target assignment is comparative; the native algF mutant
      validates acetylation in the system but is not a direct assay of this protein.
    supported_by:
    - *id002
    - *id001
    - *id003
    proposed_replacement_terms:
    - &id004
      id: GO:0051979
      label: alginic acid acetylation
