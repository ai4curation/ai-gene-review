  - UniRule:UR000084057
  review:
    summary: A shared IscS-IscU cluster ligand is predicted, but target-specific ligation is unresolved.
    action: UNDECIDED
    reason: UniRule UR000084057/HAMAP MF_00331 annotates C328 as a persulfide ligand shared with IscU.
      The native PMID18562278 complex contains a substituted IscU and does not locate cluster ligands.
      The identifiable structural precedent in PMID25447670 concerns catalytically divergent Archaeoglobus
      fulgidus IscS with mutant IscU. This does not establish native A. vinelandii IscS cluster binding,
      nor exclude a transient shared intermediate. Retain unresolved rather than call the source mapping
      demonstrably false.
    supported_by:
    - reference_id: PMID:18562278
      supporting_text: the reversible interaction of IscU and IscS.
