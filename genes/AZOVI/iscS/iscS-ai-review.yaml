taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: IscS is a cytoplasmic, pyridoxal-phosphate-dependent cysteine desulfurase that mobilizes
  sulfur from L-cysteine through a protein-bound persulfide. It supplies sulfur to IscU for housekeeping
  iron-sulfur cluster biosynthesis in Azotobacter vinelandii. It is distinct from the nitrogenase-associated
  desulfurase NifS.
