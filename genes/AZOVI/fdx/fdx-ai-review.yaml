  label: Azotobacter vinelandii
description: Fdx, also characterized as FdIV or FdxD, is a monomeric, redox-active [2Fe-2S] ferredoxin
  encoded in the Azotobacter vinelandii housekeeping isc operon. Native Fdx is required for efficient
  iron-sulfur protein maturation under standard growth conditions. Its exact physiological electron-transfer
  partner in this organism remains unresolved. It is distinct from ferredoxin I encoded by fdxA.
