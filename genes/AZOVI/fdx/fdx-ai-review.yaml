  review:
    summary: A P450-containing chain is not established for the housekeeping Isc ferredoxin.
    action: MARK_AS_OVER_ANNOTATED
    reason: IPR001055/IPR018298 recognize the bacterial ferredoxin class shared with P450 redox partners;
      that fold does not identify a cytochrome P450 recipient. Native FdIV identity, redox characterization
      and ISC-dependent phenotype support a different characterized context. No direct P450 electron-transfer
