  title: HscA and HscB stimulate [2Fe-2S] cluster transfer from IscU to apoferredoxin in an ATP-dependent
    reaction.
  findings:
  - statement: Azotobacter reconstitution supports ATP-dependent HscA/HscB-assisted cluster transfer from
      IscU to recipient ferredoxin, without establishing a tertiary-fold recovery endpoint or a ferredoxin
      donor edge.
