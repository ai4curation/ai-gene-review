id: O69220
gene_symbol: hscB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: HscB is a J-domain co-chaperone that activates HscA and supports IscU-dependent iron-sulfur
  protein maturation in Azotobacter vinelandii. HscB participates with HscA and IscU in an ATP-dependent
  cluster-transfer system, promoting delivery of scaffold-bound [2Fe-2S] clusters to acceptor proteins.
existing_annotations:
- term:
    id: GO:0001671
    label: ATPase activator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004640
  review:
    summary: HscB stimulates the HscA ATPase in the IscU-directed cycle.
    action: ACCEPT
    reason: PMID16964969 measures HscB-dependent stimulation of HscA hydrolysis and enhanced transfer;
      the J-domain and curated HscA interaction agree. This is activation of another enzyme, not intrinsic
      HscB ATP hydrolysis.
    supported_by:
    - &id002
      reference_id: file:AZOVI/hscB/hscB-uniprot.txt
      supporting_text: Interacts with HscA and stimulates its ATPase activity.
    - reference_id: PMID:16964969
      supporting_text: found to be an ATP-dependent reaction based on concomitant phosphate production
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000065662
  review:
    summary: Direct chaperone-assisted cluster maturation is established; assistance to a correct tertiary
      structure is not resolved.
    action: UNDECIDED
    reason: The AZOVI HscA/HscB assay establishes ATP-dependent cluster maturation, not recovery of a
      tertiary fold. E. coli HscB preferentially binds structured IscU (PMID22782893), a distinct state
      preference from HscA holdase behavior; this is not automatically an AZOVI folding measurement or
      a negative assay. Retain UNDECIDED for whether this target assists the GO-defined folding endpoint.
    supported_by:
    - &id001
      reference_id: PMID:16964969
      supporting_text: 'HscA/HscB cochaperone system in facilitating efficient [2Fe-2S] cluster transfer

        from the IscU scaffold protein to acceptor proteins'
    - reference_id: file:analysis/module_audits/bacterial_isc_iron_sulfur_cluster_assembly/round1/azovi-consultation/scientific-findings.md
- term:
    id: GO:0044571
    label: '[2Fe-2S] cluster assembly'
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004640
  review:
    summary: HscB is required for efficient chaperone-assisted [2Fe-2S] cluster delivery.
    action: ACCEPT
    reason: The purified A. vinelandii system directly demonstrates HscB-dependent enhancement of cluster
      transfer. This supports participation in cluster assembly/maturation through its cofactor role,
      while distinguishing transfer from initial synthesis on IscU.
    supported_by:
    - *id001
- term:
    id: GO:0051087
    label: protein-folding chaperone binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004640
  review:
    summary: HscB binds and activates the specialized HscA chaperone.
    action: ACCEPT
    reason: The curated HAMAP subunit statement identifies interaction with HscA and ATPase activation,
      consistent with the native transfer system. Fresh GO0051087 defines binding to chaperones that ensure
      correct folding or transport. Thus this specialized chaperone partnership is supported without claiming
      that AZOVI HscA independently demonstrates a folding endpoint.
    supported_by:
    - *id002
    - reference_id: file:analysis/module_audits/bacterial_isc_iron_sulfur_cluster_assembly/round1/azovi-consultation/scientific-findings.md
- term:
    id: GO:0051259
    label: protein complex oligomerization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR009073
  - InterPro:IPR036386
  review:
    summary: The HscB C-terminal fold does not establish a general oligomerization function.
    action: MARK_AS_OVER_ANNOTATED
    reason: IPR009073/IPR036386 identify a domain historically named for oligomerization, but the relevant
      positive evidence establishes HscA activation and IscU-assisted cluster transfer. Participation
      in a transient heterocomplex is not itself evidence that HscB drives formation of protein oligomers.
      Broader oligomerization activity remains unsupported rather than experimentally disproved.
    supported_by:
    - reference_id: file:AZOVI/hscB/hscB-uniprot.txt
      supporting_text: DR   InterPro; IPR009073; HscB_oligo_C.
    - *id002
    - reference_id: file:analysis/module_audits/bacterial_isc_iron_sulfur_cluster_assembly/round1/azovi-consultation/scientific-findings.md
- term:
    id: GO:1990230
    label: iron-sulfur cluster transfer complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: part_of
  supporting_entities:
  - PANTHER:PTN002304125
  review:
    summary: HscB participates in a functional iron-sulfur cluster-transfer assembly.
    action: ACCEPT
    reason: The GO1990230 definition permits a protein complex that catalyzes cluster transfer; its human
      example does not require bacterial HscB to share mitochondrial partners. The target-organism HscA/HscB/IscU
      transfer system meets this function, although its native occupancy and lifetime were not measured.
    supported_by:
    - *id001
    - *id002
