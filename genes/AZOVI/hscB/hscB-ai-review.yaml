  title: HscA and HscB stimulate [2Fe-2S] cluster transfer from IscU to apoferredoxin in an ATP-dependent
    reaction.
  findings:
  - statement: Purified A. vinelandii HscA and HscB accelerate transfer from cluster-loaded IscU to apo-IscFdx
      in an ATP-dependent reaction.
