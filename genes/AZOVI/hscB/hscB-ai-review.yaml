- id: PMID:16936042
  title: Controlled expression and functional analysis of iron-sulfur cluster biosynthetic components
    within Azotobacter vinelandii.
  findings:
  - statement: Native depletion establishes IscS, IscU, HscBA and Fdx requirements under the tested conditions,
      whereas the IscA null-growth phenotype depends on elevated oxygen.
    supporting_text: Depletion of IscA results in a null growth phenotype only when cells are cultured
      under conditions of elevated oxygen
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract retained unchanged. Full text additionally read at the primary publisher/PMC;
      detailed access and assay boundaries are recorded in gene notes.
