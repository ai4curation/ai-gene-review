    id: GO:0016226
    label: iron-sulfur cluster assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010236
  review:
    summary: HscA directly promotes delivery of preassembled clusters during ISC maturation.
    action: ACCEPT
    reason: The ATP-dependent HscA/HscB reaction contributes work to cluster transfer, beyond the native
      depletion phenotype. Cluster synthesis on IscU and chaperone-assisted delivery are distinct steps
      within the overall assembly machinery.
    supported_by:
    - reference_id: PMID:16964969
      supporting_text: No stimulation was observed in the absence of either HscB or MgATP
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
