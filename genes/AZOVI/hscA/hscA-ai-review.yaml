- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010236
  - UniRule:UR000032357
  review:
    summary: Direct chaperone-assisted cluster maturation is established; assistance to a correct tertiary
      structure is not resolved.
    action: UNDECIDED
    reason: The AZOVI assay in PMID16964969 measures ATP-coupled cluster transfer and phosphate production,
      not assistance to a correct tertiary fold. E. coli HscA holdase behavior (PMID22782893) and negative
      model-substrate recovery (PMID9852006) inform the distinction but are not target-organism negative
      folding assays. Retain UNDECIDED for this process endpoint; neither specialization nor unmeasured
      folding proves that every folding contribution is absent.
    supported_by:
