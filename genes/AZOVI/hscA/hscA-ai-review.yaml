id: O69221
gene_symbol: hscA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: HscA is the specialized Hsp70-family ATPase of the Azotobacter vinelandii iron-sulfur maturation
  machinery. Together with the J-protein HscB, it interacts with the IscU scaffold and couples ATP hydrolysis
  to efficient [2Fe-2S] cluster transfer to acceptor proteins. Its chaperone cycle supports cofactor-dependent
  protein maturation.
existing_annotations:
