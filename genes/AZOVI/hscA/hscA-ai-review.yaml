    id: GO:0005524
    label: ATP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR010236
  - InterPro:IPR013126
  review:
    summary: HscA uses ATP in its IscU-directed chaperone cycle.
    action: ACCEPT
    reason: ATP-dependent transfer and concomitant hydrolysis were measured using A. vinelandii HscA/HscB
      in PMID16964969. ATP binding is intrinsic to the directly demonstrated motor activity.
    supported_by:
    - reference_id: PMID:16964969
      supporting_text: No stimulation was observed in the absence of either HscB or MgATP
- term:
    id: GO:0006457
    label: protein folding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR010236
  - UniRule:UR000032357
  review:
    summary: Direct chaperone-assisted cluster maturation is established; assistance to a correct tertiary
      structure is not resolved.
    action: UNDECIDED
    reason: GO0006457 requires assisting assembly into correct tertiary structure. PMID16964969 measures
      ATP-dependent cluster transfer by CD/EPR and ATP turnover, not a folding endpoint for IscU or the
      recipient. This is genuine specialized maturation work, but neither a general folding function nor
      its absence follows. Retain unresolved rather than equate cluster transfer with folding or reject
      the annotation merely because the chaperone is specialized.
    supported_by:
    - reference_id: PMID:16964969
      supporting_text: No stimulation was observed in the absence of either HscB or MgATP
