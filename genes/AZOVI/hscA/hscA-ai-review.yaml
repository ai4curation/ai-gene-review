  review:
    summary: HscA hydrolyzes ATP during the cluster-transfer cycle.
    action: ACCEPT
    reason: PMID16964969 monitors phosphate production and ATP-dependent rate enhancement using the target
      organism proteins. The hydrolysis activity belongs to HscA; HscB stimulates it rather than being
