    label: alginic acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00286
  review:
    action: ACCEPT
    summary: AlgK is a direct component of the alginate production system.
    reason: A native nonpolar mutant loses alginate production. Its specific AlgK repeat architecture
      and inferred periplasmic lipid anchoring support a structural contribution to the biosynthetic/export
      machinery, not a glycosyltransferase reaction. Encystment is a downstream outcome rather than a
      separate core function.
    supported_by:
    - &id003
      reference_id: PMID:9368366
      supporting_text: A non-polar algK mutant was constructed and showed a non-mucoid phenotype, indicating
        that algK is essential for alginate production.
