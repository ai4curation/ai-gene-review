id: P94202
gene_symbol: algK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: AlgK is an AlgK-family repeat protein required for alginate production in Azotobacter vinelandii.
  It is predicted to be a lipid-anchored protein on the periplasmic face of the outer membrane, where
  homologous AlgK proteins organize the alginate export machinery. Native ATCC 9046 disruption abolishes
  alginate production and encystment; the scaffold mechanism is inferred from family and domain architecture.
