    summary: AlgE is localized in the outer membrane.
    reason: The primary study identifies recombinant protein in the E. coli outer membrane and a corresponding
      native Azotobacter outer-membrane protein by immunodetection. This is stronger than the location-vocabulary
      mapping alone. The historical 18-strand model is not treated as an experimentally determined structure.
    supported_by:
