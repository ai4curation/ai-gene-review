id: Q44497
gene_symbol: algE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: AlgE, historically called AlgJ in Azotobacter vinelandii, is an outer-membrane AlgE-family
  protein assigned to alginate export. The full-length strain E sequence is supported by native and recombinant
  outer-membrane localization. Its alginate-permeability role is inferred from the specific channel family
  and Pseudomonas homologs. This export protein is distinct from extracellular AlgE1–7 mannuronan epimerases
  and from the AlgV acetylation protein also catalogued with the synonym algJ.
