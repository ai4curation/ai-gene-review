- term:
    id: GO:0042121
    label: alginic acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00286
  review:
    action: ACCEPT
    summary: AlgE provides the inferred outer-membrane export component of alginate production.
    reason: Specific AlgE-family identity, the native alginate locus and outer-membrane localization support
      direct export-system participation. It is not an epimerase or polymerase. Native polymer translocation
      through purified Q44497 was not demonstrated in the accessible original study; that detailed mechanism
      remains a homolog-based inference.
    supported_by:
    - *id001
    - *id002
    - &id003
      reference_id: file:AZOVI/algE/algE-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Has non-porin-like, channel-forming properties and probably functions as an alginate
        permeability pore.
- term:
    id: GO:0015159
    label: polysaccharide transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: PMID:21778407
  supporting_entities:
  - UniProtKB:P18895
  review:
    action: NEW
    summary: Alginate transport is inferred for the specific AlgE-family outer-membrane channel.
    reason: Native Q44497 outer-membrane localization, its specific AlgE export/channel family, and the
      curated probable alginate-pore assignment support functional transfer from Pseudomonas aeruginosa
      AlgE. The homolog structure, halide-flux and loop-complementation experiments jointly support polymer
      export; they do not constitute purified direct polymer-translocation measurements. This proposed
      MF is explicitly ISS, not a native Azotobacter activity assay. GO:0015159 describes movement of
      polysaccharide across a membrane without importing unproven gating details or ion specificity. Neither
      seeded row covers this MF, and no target GO-CAM conflicts with the role.
    supported_by: &id004
    - *id001
    - *id002
    - *id003
    - reference_id: PMID:21778407
      supporting_text: complementation of an algE deletion mutant with ΔT8-AlgE impairs alginate production.
