- id: PMID:21778407
  title: Structural basis for alginate secretion across the bacterial outer membrane.
  full_text_unavailable: true
  findings:
  - statement: Pseudomonas aeruginosa AlgE structure, anion-flux and loop-complementation assays support
      the homolog export mechanism; neither a native Azotobacter assay nor purified polymer-translocation
      measurement.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Homolog support only. Abstract specifies the assayed organism and distinguishes measured
      halide flux from inferred alginate translocation; no structure, loop behavior or ion selectivity
      is transferred as a native result.
