  review:
    summary: Conserved IscU scaffold chemistry supports transient iron-ion binding.
    action: ACCEPT
    reason: The A. vinelandii scaffold retains C37, D39, C63, H105 and C106 at the corresponding E. coli
      IscU positions. PMID39870763 directly demonstrates pre-sulfur iron loading in reconstituted E. coli
      ISC, providing positive comparative support alongside native A. vinelandii scaffold biochemistry
      in PMID10891064/18562278. This is a conserved-function inference, not a native apo-Fe(II) binding
      measurement; cluster-bound iron alone is not the evidence, and native loading order and iron donor
      remain unresolved.
    supported_by:
    - reference_id: PMID:39870763
