taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: IscU is a soluble iron-sulfur cluster assembly scaffold in Azotobacter vinelandii. It accepts
  sulfur from IscS, binds nascent clusters, and donates clusters to recipient proteins. HscA and HscB
  accelerate [2Fe-2S] transfer from IscU through an ATP-dependent cycle. Its housekeeping function can
  be partially replaced by NifU under particular expression or oxygen conditions.
