id: O52195
gene_symbol: algL
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:354
  label: Azotobacter vinelandii
description: AlgL is a periplasmic polysaccharide lyase of Azotobacter vinelandii that depolymerizes alginate
  by beta elimination. Recombinant enzyme cleaves M-M and M-G bonds, including some acetylated substrates,
  but not G-M or G-G bonds. Native loss of AlgL increases the molecular weight of secreted alginate. A
  role in clearance of mislocalized periplasmic polymer is inferred from homologous systems; native alginate
  production can persist without AlgL.
