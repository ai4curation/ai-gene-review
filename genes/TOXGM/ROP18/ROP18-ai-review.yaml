- id: PMID:17305424
  title: ROP18 is a rhoptry kinase controlling the intracellular proliferation of Toxoplasma gondii.
  findings:
  - statement: ROP18 is a rhoptry bulb protein that relocalizes to the parasitophorous vacuole membrane
      during invasion and is an active kinase.
    supporting_text: We show here that ROP18, a member of the ROP2 family, is located in the rhoptries
      and re-localises at the parasitophorous vacuole membrane during invasion.
  - statement: Overexpression of ROP18 stimulates intravacuolar parasite multiplication in a
      catalysis-dependent manner.
    supporting_text: In contrast, when counting the number of parasites per vacuole at 16 h after
      infection, we observed a significant increase in parasite proliferation in the ROP18-Ty–transfected
      parasites, compared with that of wild-type tachyzoites.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Original cell-biological characterization of ROP18; full text cached and consistent
      with the localization claims made in this review.
