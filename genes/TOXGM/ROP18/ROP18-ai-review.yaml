- id: PMID:22761577
  title: The rhoptry proteins ROP18 and ROP5 mediate Toxoplasma gondii evasion of the murine, but not
    the human, interferon-gamma response.
  findings:
  - statement: The type II allele carried by ME49 is expressed and functional, while type III strains
      carry a promoter insertion that prevents expression.
    supporting_text: ROP18 is highly expressed in types I and II strains but an insertion in the
      promoter prevents expression in type III strains.
  - statement: Neither ROP18 nor ROP5 affects survival in interferon-activated human cells, which lack
      the expanded IRG family of rodents.
    supporting_text: However, neither ROP18 nor ROP5 markedly affect survival in IFNγ-activated human
      cells, which lack the multitude of IRGs present in murine cells.
