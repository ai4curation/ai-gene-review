gene_symbol: ROP18
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:508771
  label: Toxoplasma gondii ME49
description: >-
  ROP18 is a polymorphic serine/threonine protein kinase of Toxoplasma gondii that is stored in the
  bulb of the rhoptries, the apical secretory organelles discharged at the moment of host-cell
  invasion. During invasion the mature kinase is released into the host cell and is tethered, through
  an arginine-rich amphipathic helical region upstream of its kinase domain, to the cytosolic face of
  the parasitophorous vacuole membrane that surrounds the intracellular parasite. From this position
  it phosphorylates host proteins that reach the vacuole surface. Its best characterized substrates
  are interferon-inducible immunity-related GTPases (IRGs) of rodents, notably Irga6, which it
  phosphorylates on conserved threonines in switch region I of the GTPase domain; this inactivates
  the GTPase, prevents IRG oligomerization and loading onto the vacuole membrane, and so protects the
  vacuole from being ruptured and the parasite from being destroyed in interferon-activated
  macrophages. ROP18 works together with the pseudokinase ROP5 and the dense granule protein GRA7,
  which form a vacuolar complex that presents and regulates its IRG substrates. Through its
  N-terminal extension ROP18 also binds the host endoplasmic reticulum-bound transcription factor
  ATF6beta and, in a manner requiring its catalytic activity, promotes its proteasomal degradation.
  The kinase is an acute virulence determinant in mice, where catalytic activity, vacuole membrane
  targeting and allelic form all contribute to the ability of the parasite to survive host
  interferon-gamma responses.
