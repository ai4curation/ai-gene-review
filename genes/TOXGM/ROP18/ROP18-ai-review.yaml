- id: PMID:26247512
  title: The Toxoplasma gondii rhoptry protein ROP18 is an Irga6-specific kinase and regulated by the
    dense granule protein GRA7.
  findings:
  - statement: GRA7 is a component of the ROP5/ROP18 vacuolar kinase complex, recruited through direct
      binding to ROP5, and its loss reduces Irga6 phosphorylation.
    supporting_text: In this study, we confirmed the dense granule protein GRA7 as an additional
      component of the ROP5/ROP18 kinase complex and identified GRA7 association with the PVM by direct
      binding to ROP5.
  - statement: Among IRG proteins, Irga6 is the specific target of ROP18.
    supporting_text: We show that the only specific target of ROP18 among IRG proteins is in fact Irga6.
  reference_review:
