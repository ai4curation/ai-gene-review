- term:
    id: GO:0052170
    label: symbiont-mediated suppression of host innate immune response
  evidence_type: IMP
  original_reference_id: PMID:21147463
  qualifier: involved_in
  review:
    summary: By phosphorylating host IRG GTPases at the vacuole membrane, ROP18 blocks their recruitment
      and prevents interferon-driven destruction of the parasite in activated macrophages.
    action: NEW
    reason: ROP18 itself performs the step, since it is the kinase that modifies the host effector
      proteins, so this is participation and not mere necessity. The genetic evidence is reciprocal,
      with deletion in a type I strain increasing IRG loading and clearance, and transgenic expression
      in an IRG-susceptible type III strain reducing IRG coating and killing. The process is recorded
      with the generic symbiont and host term because the IRG arm of this mechanism operates in rodents,
      whose expanded IRG family humans lack.
    additional_reference_ids:
    - PMID:21203588
    - PMID:22761577
    - PMID:22906355
    supported_by:
    - reference_id: PMID:21147463
      supporting_text: Parasites expressing active ROP18 largely resisted IRG recruitment, while
        efficient Irgb6 loading was observed on vacuoles containing parasites deficient in ROP18 (Figure
        3A,B).
    - reference_id: PMID:21147463
      supporting_text: Enhanced recruitment of Irgb6 to vacuoles containing Δrop18 parasites occurred
        within IFN-γ-activated macrophages, indicating that in the absence of ROP18, type I parasites
        are less able to avoid IRG recruitment (Figure 6C).
    - reference_id: PMID:22761577
      supporting_text: Indeed, transgenic expression in the type III strain CEP of either ROP18I or
        ROP18II decreased the average number of vacuoles coated with Irgb6 from 45% to 23% (P = 0.001)
        for ROP18I or 29% (P = 0.003) for ROP18II (Figure 1B).
core_functions:
- description: 'Secreted rhoptry serine/threonine protein kinase that acts at the cytosolic face of the
    parasitophorous vacuole membrane: it phosphorylates conserved threonines in switch region I of host
    interferon-inducible immunity-related GTPases, chiefly Irga6, inactivating them and preventing their
    oligomerization on and disruption of the vacuole, and thereby suppressing interferon-driven innate
    clearance of the intracellular parasite. Membrane targeting through its arginine-rich amphipathic
    region is required for substrate access; the pseudokinase ROP5 and the dense granule protein GRA7
    form the vacuolar complex that presents and regulates its IRG substrates.'
  molecular_function:
    id: GO:0004674
    label: protein serine/threonine kinase activity
  directly_involved_in:
  - id: GO:0052170
    label: symbiont-mediated suppression of host innate immune response
  locations:
  - id: GO:0020008
    label: rhoptry
  - id: GO:0020005
    label: symbiont-containing vacuole membrane
  supported_by:
  - reference_id: PMID:21203588
    supporting_text: We show here that the ROP18 kinase from highly virulent strains targets Irga6,
      phosphorylating two threonines in the switch I loop.
  - reference_id: PMID:21147463
    supporting_text: Parasites expressing active ROP18 largely resisted IRG recruitment, while efficient
      Irgb6 loading was observed on vacuoles containing parasites deficient in ROP18 (Figure 3A,B).
  - reference_id: PMID:22906355
    supporting_text: Vacuole-targeting mutants of ROP18 failed to phosphorylate Irga6 and were unable to
      divert IRGs from the PVM, despite retaining intrinsic kinase activity.
  - reference_id: PMID:26247512
    supporting_text: In this study, we confirmed the dense granule protein GRA7 as an additional
      component of the ROP5/ROP18 kinase complex and identified GRA7 association with the PVM by direct
      binding to ROP5.
  knowledge_gaps:
  - gap_statement: It is undetermined whether ROP18 has parasite-encoded substrates in addition to its
      host targets; an early kinase assay detected phosphorylation of a tachyzoite protein of about 70
      kDa whose identity has never been established.
    boundary: Host IRG GTPases, principally Irga6, are established substrates with mapped
      phosphorylation sites, and the stimulation of intravacuolar replication by ROP18 overexpression is
      known to require catalytic activity.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Does ROP18 phosphorylate ATF6beta directly, or does it destabilize it only through
    N-terminal binding plus a catalysis-dependent step acting on another substrate? The published data
    establish kinase-dependent proteasomal degradation but not a phosphorylation site.
  experts:
  - Toxoplasma effector biologists
  - host ER stress and unfolded protein response researchers
- question: What does ROP18 do in human infection, where the expanded IRG family that provides its main
    rodent substrates is absent? If the IRG arm is rodent-specific, is the kinase retained in human
    isolates for the ATF6beta axis or for an unidentified human substrate?
  experts:
  - clinical toxoplasmosis researchers
  - comparative immunologists
- question: Is the type II (ME49) allele reviewed here functionally equivalent to the type I allele at
    the level of substrate phosphorylation, with virulence differences explained entirely by the ROP5
    allele and expression context?
  experts:
  - Toxoplasma population genetics and virulence QTL groups
suggested_experiments:
- description: Quantitative phosphoproteomics of host and parasite proteins in cells infected with ME49
    wild-type versus a ME49 rop18 knockout and a kinase-dead complement, under naive and
    interferon-gamma activated conditions.
  hypothesis: Beyond Irga6 and other IRGs, ROP18 has a small, defined set of vacuole-proximal substrates
    whose phosphorylation depends on both catalytic activity and PVM targeting.
  experiment_type: mass spectrometry phosphoproteomics with isogenic parasite lines
- description: Identify the approximately 70 kDa tachyzoite protein phosphorylated by recombinant ROP18
    in vitro, by substrate trapping with the kinase-dead allele followed by mass spectrometry.
  hypothesis: ROP18 has at least one intrinsic parasite substrate, which would explain the
    kinase-dependent effect of ROP18 overexpression on intravacuolar replication.
  experiment_type: substrate trapping and proteomics
- description: Express the ME49 type II allele and the type I allele in a common rop18-null background
    together with matched ROP5 alleles, and measure Irga6 Thr102 and Thr108 phosphorylation, IRG coating
    of the vacuole and survival in interferon-activated murine and human cells.
  hypothesis: Allelic differences in acute virulence are driven by the ROP5 partner rather than by
    intrinsic differences in ROP18 catalytic competence, and neither allele affects survival in human
    cells.
  experiment_type: comparative genetics with cell biological readouts
