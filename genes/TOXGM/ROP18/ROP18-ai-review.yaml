      to the vacuole, which is required for parasite destruction.
    supporting_text: Parasites expressing active ROP18 largely resisted IRG recruitment, while efficient
      Irgb6 loading was observed on vacuoles containing parasites deficient in ROP18 (Figure 3A,B).
  - statement: Autophosphorylation and substrate phosphorylation are lost in the kinase-dead mutant,
      establishing direct catalysis.
    supporting_text: both auto-phosphorylation of several forms of ROP18 and labeling of Irgb6 were readily
      detected by the active ROP18 but not the kinase-dead form (Figure 4B).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached; provides the knockout and kinase-dead evidence underlying the
      proposed symbiont-mediated suppression of host innate immune response annotation.
