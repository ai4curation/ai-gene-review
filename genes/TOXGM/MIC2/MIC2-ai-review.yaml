- id: PMID:9084040
  title: Molecular characterisation of an expressed sequence tag locus of Toxoplasma
    gondii encoding the micronemal protein MIC2.
  findings:
  - statement: The cloned locus encodes MIC2, a thrombospondin-repeat protein that is
      localized exclusively to the micronemes by cryo-immunoelectron microscopy.
    supporting_text: exclusively labeled the micronemes of T. gondii by
      cryo-immunoelectron microscopy
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified identification paper establishing gene identity and
      microneme localization.
- id: PMID:16933991
  title: Toxoplasma MIC2 is a major determinant of invasion and virulence.
  findings:
  - statement: Conditional suppression of MIC2 causes M2AP mistrafficking, defective
      host-cell attachment and invasion, and loss of helical gliding.
    supporting_text: markedly defective host-cell attachment and invasion
  - statement: The invasion defect of MIC2-depleted parasites is attributed mainly to
      failed adherence to the target cell.
    supporting_text: Therefore, the entry defect is principally due to an inability to
      adhere properly to the target cell
    finding_review:
      finding_status: SUPPORTED
      supported_by:
      - reference_id: PMID:28630943
        supporting_text: mic2 KO defect in invasion is due to diminished attachment
          capacity.
  - statement: MIC2-deficient parasites were reported to be unable to support lethal
      murine infection, a virulence claim later contradicted by a clean knockout.
    supporting_text: the inability to support lethal infection in a murine model of
      acute toxoplasmosis
    finding_review:
      finding_status: SUPERSEDED
      superseded_by: PMID:28630943
      supported_by:
      - reference_id: PMID:28630943
        supporting_text: like with wildtype
          parasites, inoculation with even low doses of mic2 KO parasites causes lethal
          disease in mice
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Full text available and verified. The attachment, gliding and invasion
      phenotypes are reproduced by the later null mutant, but the virulence conclusion
      is contradicted by PMID:28630943, probably reflecting the conditional knockdown
      background.
