- id: PMID:9084040
  title: Molecular characterisation of an expressed sequence tag locus of Toxoplasma
    gondii encoding the micronemal protein MIC2.
  findings:
  - statement: The cloned locus encodes MIC2, a thrombospondin-repeat protein that is
      localized exclusively to the micronemes by cryo-immunoelectron microscopy.
    supporting_text: exclusively labeled the micronemes of T. gondii by cryo-immunoelectron microscopy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified identification paper establishing gene identity and
      microneme localization.
- id: PMID:16933991
  title: Toxoplasma MIC2 is a major determinant of invasion and virulence.
  findings:
  - statement: Conditional suppression of MIC2 causes M2AP mistrafficking, defective
      host-cell attachment and invasion, and loss of helical gliding.
    supporting_text: markedly defective host-cell attachment and invasion, the loss of helical gliding
      motility
  - statement: The invasion defect of MIC2-depleted parasites is attributed mainly to
      failed adherence to the target cell.
    supporting_text: Therefore, the entry defect is principally due to an inability to adhere properly to the
      target cell, although we cannot rule out an additional defect in the penetration step that
      follows attachment.
    finding_review:
      finding_status: CORROBORATED
      supported_by:
      - reference_id: PMID:28630943
        supporting_text: mic2 KO defect in invasion is due to diminished attachment
          capacity.
  - statement: MIC2-deficient parasites were reported to be unable to support lethal
      murine infection, a virulence claim later contradicted by a clean knockout.
    supporting_text: the inability to support lethal infection in a murine model of
      acute toxoplasmosis
    finding_review:
      finding_status: OVERTURNED
      superseded_by:
      - PMID:28630943
      supported_by:
      - reference_id: PMID:28630943
        supporting_text: like with wildtype parasites, inoculation with even low numbers of mic2 KO parasites
          causes lethal disease in mice.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Full text available and verified. The attachment, gliding and invasion
      phenotypes are reproduced by the later null mutant, but the virulence conclusion
      is contradicted by PMID:28630943, probably reflecting the conditional knockdown
      background.
- id: PMID:28630943
  title: Parasites lacking the micronemal protein MIC2 are deficient in surface
    attachment and host cell egress, but remain virulent in vivo.
  findings:
  - statement: A clean mic2 null mutant is impaired in attachment to host cells and to
      collagen IV, with reduced motility and invasion traced to defective initiation.
    supporting_text: mic2KO parasites show impaired attachment to host cells and
      collagen IV.
  - statement: MIC2 is an important but non-essential attachment factor; knockout
      parasites remain lethal in mice and show delayed egress in vitro.
    supporting_text: 'In summary, we find here that MIC2 acts as important, but not
      essential, attachment factor'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available and verified; the definitive loss-of-function
      analysis and the basis for treating invasion and virulence roles as secondary to
      attachment.
- id: PMID:24639528
  title: Structures of the Toxoplasma gliding motility adhesin.
  findings:
  - statement: MIC2 has a VWA domain and six thrombospondin repeats in its ectodomain
      and connects to the actomyosin system through its cytoplasmic tail; the
      MIC2-M2AP ectodomain complex is a 1:1 elongated monomer.
    supporting_text: the MIC2-M2AP ectodomain complex is a highly elongated 1:1 monomer with M2AP bound to the
      TSR6 domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; crystallographic study, source of the domain
      architecture description.
- id: PMID:14670959
  title: The toxoplasma proteins MIC2 and M2AP form a hexameric complex necessary for
    intracellular survival.
  findings:
  - statement: MIC2 is a type I transmembrane protein bound to M2AP; native gels and
      gel filtration indicate a roughly 450 kDa complex of three alpha-beta dimers.
    supporting_text: MIC2 and M2AP proteins form stable hexamers consisting of three alphabeta dimers.
    finding_review:
      finding_status: DISPUTED
      superseded_by:
      - PMID:24639528
      supported_by:
      - reference_id: PMID:24639528
        supporting_text: We find that the MIC2-M2AP ectodomain complex is a highly
          elongated 1:1 monomer with M2AP bound to the TSR6 domain.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Abstract-only cache. The type I membrane topology and MIC2-M2AP
      association are solid; the hexameric stoichiometry conflicts with the later
      crystallographic 1:1 ectodomain result, so the complex composition is not settled.
- id: PMID:12727875
  title: Rapid invasion of host cells by Toxoplasma requires secretion of the MIC2-M2AP
    adhesive protein complex.
  findings:
  - statement: Loss of M2AP traps MIC2 in the endoplasmic reticulum and Golgi, blocks
      its rapid secretion on contact with a target cell, and impairs host cell entry by
      over 80 per cent.
    supporting_text: M2AP knockout parasites were also unable to rapidly secrete MIC2,
      an event that normally accompanies parasite attachment to a target cell.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; establishes the functional interdependence of
      MIC2 and M2AP and the magnitude of the entry defect.
- id: PMID:12718875
  title: Aldolase forms a bridge between cell surface adhesins and the actin
    cytoskeleton in apicomplexan parasites.
  findings:
  - statement: Aldolase binds the C-terminal cytoplasmic domains of TRAP-family
      adhesins, and the interaction requires a critical tryptophan previously shown to
      be essential for motility, linking adhesins to actin.
    supporting_text: Our findings reveal a potential role for aldolase in connecting TRAP family adhesins with
      the cytoskeleton, and provide a model linking adhesion with motility in apicomplexan
      parasites.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; mechanistic basis for coupling MIC2 to the
      actomyosin motor.
- id: PMID:16923803
  title: Two separate, conserved acidic amino acid domains within the Toxoplasma gondii
    MIC2 cytoplasmic tail are required for parasite survival.
  findings:
  - statement: Two acidic clusters in the MIC2 cytoplasmic tail are essential for the
      parasite; the extreme C-terminal cluster mediates direct aldolase binding.
    supporting_text: two separate acidic residue clusters in the cytoplasmic domain of MIC2 that are essential
      for parasite survival. One region, located at the extreme C terminus, is required for the
      direct interaction with aldolase, whereas the second upstream acidic region is not necessary
      for aldolase binding but is nonetheless essential to parasite survival. Both acidic domains
      are conserved throughout TRAP orthologs, implicating a central role for these motifs in
      apicomplexan motility.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; structure-function mapping of the motor-coupling
      tail.
- id: PMID:15003840
  title: Multimerization of the Toxoplasma gondii MIC2 integrin-like A-domain is
    required for binding to heparin and human cells.
  findings:
  - statement: The recombinant MIC2 A-domain binds heparin specifically and
      independently of the MIDAS motif, as a high-molecular-weight multimer that mimics
      native MIC2.
    supporting_text: the MIC2 A-domain binds specifically to heparin, a ubiquitous
      sulfated proteoglycan found in the extracellular matrix (ECM)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; direct in vitro ligand-binding evidence for the
      integrin-like A-domain.
- id: PMID:15760456
  title: Transepithelial migration of Toxoplasma gondii involves an interaction of
    intercellular adhesion molecule 1 (ICAM-1) with the parasite adhesin MIC2.
  findings:
  - statement: Human ICAM-1 immunoprecipitates mature surface MIC2, and soluble ICAM-1
      or ICAM-1 antibodies inhibit parasite transmigration across cellular barriers.
    supporting_text: human ICAM-1 immunoprecipitated the mature form of the parasite adhesin MIC2 present on the
      parasite surface, indicating that this interaction may contribute to cellular migration.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; identifies a defined host receptor for surface
      MIC2.
- id: PMID:15753289
  title: A spatially localized rhomboid protease cleaves cell surface adhesins
    essential for invasion by Toxoplasma.
  findings:
  - statement: Secreted MIC2 moves from the apical surface to the posterior surface,
      where it colocalizes with the rhomboid protease TgROM5 and is cleaved.
    supporting_text: Upon microneme secretion, as occurs during invasion, the MIC2
      adhesin was secreted to the apical end and translocated to the posterior, the
      site of cleavage, where it colocalized only with TgROM5.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; source for surface display and rearward
      translocation of MIC2.
- id: PMID:10799515
  title: The Toxoplasma adhesive protein MIC2 is proteolytically processed at multiple
    sites by two parasite-derived proteases.
  findings:
  - statement: MPP1 removes the MIC2 C-terminal domain on release into the medium,
      while MPP2 trims the N terminus on the parasite surface.
    supporting_text: the C-terminal domain of MIC2 is removed by a protease, termed MPP1, when MIC2 is released
      into the culture supernatant.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; underpins the shedding step that produces the
      extracellular MIC2 ectodomain.
- id: PMID:14982962
  title: Proteomic analysis of cleavage events reveals a dynamic two-step mechanism for
    proteolysis of a key parasite adhesive complex.
  findings:
  - statement: MIC2 is shed from the parasite surface by intramembrane cleavage within
      its anchoring domain, consistent with a rhomboid-family sheddase.
    supporting_text: MIC2 is shed by intramembrane cleavage within its anchoring domain.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; mass-spectrometric definition of the shedding
      cleavage.
- id: PMID:23263690
  title: Conditional genome engineering in Toxoplasma gondii uncovers alternative
    invasion mechanisms.
  findings:
  - statement: A clonal mic2 knockout line can be maintained in culture, showing MIC2
      is not essential for parasite survival and that MIC2-independent invasion exists.
    supporting_text: we achieved isolation of a clonal mic2 KO parasite line,
      demonstrating for the first time that neither myoA nor mic2 are essential for
      parasite survival.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text available; the DiCre knockout that reframed MIC2 as
      important but dispensable.
