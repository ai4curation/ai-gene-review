id: S8F9G8
gene_symbol: MIC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:508771
  label: Toxoplasma gondii ME49
description: >-
  MIC2 is the Toxoplasma gondii member of the thrombospondin-related anonymous
  protein (TRAP) family of apicomplexan adhesins. It is a type I transmembrane
  protein with an integrin-like von Willebrand factor A domain followed by six
  thrombospondin type-1 repeats, and a short acidic cytoplasmic tail ending in a
  conserved penultimate tryptophan that binds aldolase and so couples the adhesin to
  the parasite actin-myosin motor. MIC2 associates in the secretory pathway with its
  escort partner M2AP and is stored in the apical micronemes. On contact with a host
  cell, micronemes discharge MIC2-M2AP onto the apical parasite surface, where the
  ectodomain engages sulfated glycosaminoglycans, extracellular matrix and host
  ICAM-1; motor-driven rearward translocation of these contacts provides traction for
  helical gliding and the onset of invasion, after which the posterior surface
  rhomboid protease ROM5 sheds the complex by intramembrane cleavage and the ectodomain
  is released into the medium. Loss-of-function studies show MIC2 is a major but
  non-essential attachment factor: depletion impairs substrate and host-cell
  attachment, helical gliding, invasion efficiency and timely egress, while knockout
  parasites remain viable and lethal to mice.
