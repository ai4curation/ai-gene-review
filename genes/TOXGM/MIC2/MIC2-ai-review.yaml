knowledge_gaps:
- gap_statement: >-
    The physiological host receptor repertoire of the MIC2 A-domain is unresolved:
    heparin binding was shown with recombinant protein in vitro and ICAM-1 was
    identified by immunoprecipitation, but which ligands actually mediate attachment to
    a given host cell type, and with what affinity, is unknown.
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    How MIC2-null parasites still attach and invade is unknown, that is, which other
    microneme adhesins provide the redundant attachment activity and whether they act
    in the same motor-coupled manner.
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    The oligomeric state of the MIC2-M2AP complex on the parasite surface is unsettled,
    with native-gel evidence for a hexamer and crystallographic evidence for a 1:1
    ectodomain monomer, so the valency of the adhesive junction is unknown.
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    Why deletion of mic2 delays host cell egress is unexplained; a role for MIC2 in the
    signalling that triggers egress has been proposed but not demonstrated.
  gap_kind:
  - BIOLOGY
proposed_new_terms: []
suggested_questions:
- question: >-
    Which host cell surface molecules does MIC2 engage during attachment to different
    cell types, and is sulfated glycosaminoglycan binding by the A-domain the dominant
    interaction in vivo?
  experts: []
- question: >-
    Which adhesins support the residual, MIC2-independent attachment and invasion seen
    in mic2 knockout parasites?
  experts: []
- question: >-
    Is the delayed egress of mic2 knockout parasites a consequence of impaired
    attachment, or does MIC2 feed into the signalling pathway that triggers egress?
  experts: []
suggested_experiments:
- description: >-
    Surface plasmon resonance and glycan-array profiling of the recombinant MIC2
    ectodomain, in monomeric and multimeric forms, against defined
    glycosaminoglycans, ICAM-1 and matrix proteins, with affinities compared to
    attachment efficiency on cells depleted of the corresponding ligands.
  hypothesis: >-
    Highly sulfated glycosaminoglycans on the host cell surface are the principal
    physiological ligands of the MIC2 A-domain, and ICAM-1 engagement is specific to
    transmigration across cellular barriers.
- description: >-
    Complementation of the mic2 knockout with point mutants that separate ectodomain
    ligand binding from aldolase binding by the cytoplasmic tail, followed by
    quantitative assays of attachment under shear, three-dimensional motility,
    invasion and egress timing.
  hypothesis: >-
    Attachment and gliding defects of mic2 knockout parasites are rescued only when
    both host ligand binding and motor coupling are restored, whereas delayed egress
    depends on only one of the two.
- description: >-
    Determination of the stoichiometry of the native MIC2-M2AP complex on intact
    parasites by in-cell cross-linking combined with mass spectrometry and by
    single-molecule imaging of secreted MIC2 at the parasite surface.
