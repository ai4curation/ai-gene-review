id: S8F9G8
gene_symbol: MIC2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:508771
  label: Toxoplasma gondii ME49
description: >-
  MIC2 is the Toxoplasma gondii member of the thrombospondin-related anonymous
  protein (TRAP) family of apicomplexan adhesins. It is a type I transmembrane
  protein with an integrin-like von Willebrand factor A domain followed by six
  thrombospondin type-1 repeats, and a short acidic cytoplasmic tail ending in a
  conserved penultimate tryptophan that binds aldolase and so couples the adhesin to
  the parasite actin-myosin motor. MIC2 associates in the secretory pathway with its
  escort partner M2AP and is stored in the apical micronemes. On contact with a host
  cell, micronemes discharge MIC2-M2AP onto the apical parasite surface, where the
  ectodomain engages sulfated glycosaminoglycans, extracellular matrix and host
  ICAM-1; motor-driven rearward translocation of these contacts provides traction for
  helical gliding and the onset of invasion, after which the posterior surface
  rhomboid protease ROM5 sheds the complex by intramembrane cleavage and the ectodomain
  is released into the medium. Loss-of-function studies show MIC2 is a major but
  non-essential attachment factor: depletion impairs substrate and host-cell
  attachment, helical gliding, invasion efficiency and timely egress, while knockout
  parasites remain viable and lethal to mice.
existing_annotations:
- term:
    id: GO:0005576
    label: extracellular region
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0243
  review:
    summary: >-
      Electronic mapping of the UniProt ARBA "Secreted" subcellular location. MIC2 is a
      transmembrane microneme adhesin displayed on the parasite surface and later shed
      by intramembrane cleavage, so its ectodomain does end up in the medium.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is true of the shed MIC2 ectodomain, which is liberated into the culture
      supernatant by MPP1/ROM5 cleavage and is routinely recovered in the
      excreted-secreted antigen fraction. Release into the medium is nevertheless the end
      of MIC2's working life rather than a site of action; the functional compartments
      are the microneme and the parasite cell surface, proposed below. Neither of those
      is a descendant of extracellular region, so refinement by MODIFY does not apply and
      the term is retained as peripheral. The underlying UniProt call also overlooks the
      C-terminal membrane anchor.
    supported_by:
    - reference_id: PMID:10799515
      supporting_text: the C-terminal domain of MIC2 is removed by a protease, termed
        MPP1, when MIC2 is released into the culture supernatant
    - reference_id: PMID:14982962
      supporting_text: MIC2 is shed by intramembrane cleavage within its anchoring domain
    - reference_id: PMID:16933991
      supporting_text: When levels of MIC2 in cell lysates or in the excreted-secreted
        antigen fraction are examined by quantitative immunoblotting
- term:
    id: GO:0020009
    label: microneme
  evidence_type: IDA
  original_reference_id: PMID:9084040
  qualifier: located_in
  review:
    summary: >-
      MIC2 is a marker protein of Toxoplasma micronemes: affinity-purified antisera to
      the cloned protein label micronemes exclusively by cryo-immunoelectron microscopy,
      and MIC2 occupies the apical micronemes in immunofluorescence.
    action: NEW
    reason: >-
      Microneme is the storage compartment that defines this protein and it is absent
      from GOA, which carries only the electronic extracellular-region row. Direct
      immuno-electron microscopy supports the location.
    supported_by:
    - reference_id: PMID:9084040
      supporting_text: exclusively labeled the micronemes of T. gondii by
        cryo-immunoelectron microscopy
    - reference_id: PMID:16933991
      supporting_text: both proteins occupied the apical micronemes
- term:
    id: GO:0009986
    label: cell surface
  evidence_type: IDA
  original_reference_id: PMID:15753289
  qualifier: located_in
  review:
    summary: >-
      After microneme discharge MIC2 appears on the apical parasite surface and is
      translocated rearward to the posterior surface, where ROM5 cleaves it; surface
      MIC2 is the species captured by host ICAM-1.
    action: NEW
    reason: >-
      The parasite surface is where MIC2 exerts its adhesive activity, observed directly
      by immunofluorescence of secreted MIC2 and by immunoprecipitation of the mature
      surface form.
    supported_by:
    - reference_id: PMID:15753289
      supporting_text: Upon microneme secretion, as occurs during invasion, the MIC2
        adhesin was secreted to the apical end and translocated to the posterior, the
        site of cleavage, where it colocalized only with TgROM5.
    - reference_id: PMID:15760456
      supporting_text: human ICAM-1 immunoprecipitated the mature form of the parasite
        adhesin MIC2 present on the parasite surface
- term:
    id: GO:0098631
    label: cell adhesion mediator activity
  evidence_type: IDA
  original_reference_id: PMID:15003840
  qualifier: enables
  review:
    summary: >-
      MIC2 acts as a surface adhesin: its integrin-like A-domain binds heparin and human
      cells as a multimer, surface MIC2 binds host ICAM-1, and null parasites attach
      poorly to host cells and to collagen IV.
    action: NEW
    reason: >-
      GO:0098631 covers binding by a cell-surface adhesion protein to a molecule on
      another cell surface or an external substrate in order to mediate adhesion, which
      is precisely MIC2's molecular role. It is more informative than protein binding and
      underlies the attachment, gliding and invasion phenotypes.
    supported_by:
    - reference_id: PMID:15003840
      supporting_text: Multimerization of MIC2 may increase the number of interactions
        with host cell receptors, thereby forming a multivalent adhesive junction
    - reference_id: PMID:15760456
      supporting_text: human ICAM-1 immunoprecipitated the mature form of the parasite
        adhesin MIC2 present on the parasite surface
    - reference_id: PMID:28630943
      supporting_text: mic2KO parasites show impaired attachment to host cells and
        collagen IV.
- term:
    id: GO:0008201
    label: heparin binding
  evidence_type: IDA
  original_reference_id: PMID:15003840
  qualifier: enables
  review:
    summary: >-
      Recombinant MIC2 A-domain fusion proteins bind heparin specifically, independently
      of the MIDAS motif and as a high-molecular-weight multimeric species that mirrors
      native MIC2 from parasite lysate.
    action: NEW
    reason: >-
      Direct in vitro binding evidence for a defined MIC2 domain, with native protein
      behaving the same way. Recorded as a specific, non-core ligand-binding activity
      that underpins the adhesin role; physiological ligands are likely sulfated
      glycosaminoglycans of the host cell surface and matrix.
    supported_by:
    - reference_id: PMID:15003840
      supporting_text: the MIC2 A-domain binds specifically to heparin, a ubiquitous
        sulfated proteoglycan found in the extracellular matrix (ECM)
- term:
    id: GO:0044650
    label: adhesion of symbiont to host cell
  evidence_type: IMP
  original_reference_id: PMID:28630943
  qualifier: involved_in
  review:
    summary: >-
      Depletion or deletion of MIC2 strongly reduces tachyzoite attachment to host cells
      and to substrate, and the invasion defect of MIC2-deficient parasites is traced
      principally to this failure to adhere.
    action: NEW
    reason: >-
      MIC2 performs the adhesion step itself rather than merely being required for it:
      it is the surface adhesin whose ectodomain engages host ligands while its tail
      grips the actomyosin motor, so the participation test is met. The comparator check
      agrees, since other apicomplexan surface adhesins that attach the parasite to host
      cells carry adhesion-of-symbiont-to-host terms. Two independent genetic systems, a
      conditional knockdown and a clean null, give the same attachment phenotype.
    supported_by:
    - reference_id: PMID:28630943
      supporting_text: mic2KO parasites show impaired attachment to host cells and
        collagen IV.
    - reference_id: PMID:28630943
      supporting_text: 'In summary, we find here that MIC2 acts as important, but not
        essential, attachment factor'
    - reference_id: PMID:16933991
      supporting_text: Therefore, the entry defect is principally due to an inability to
        adhere properly to the target cell
- term:
    id: GO:0071980
    label: cell surface adhesin-mediated gliding motility
  evidence_type: IMP
  original_reference_id: PMID:16933991
  qualifier: involved_in
  review:
    summary: >-
      MIC2-depleted and MIC2-null tachyzoites lose helical gliding and twirling while
      retaining circular gliding, consistent with MIC2 supplying the substrate
      attachment that the subpellicular actomyosin motor pulls against.
    action: NEW
    reason: >-
      The term is defined as gliding that results from surface adhesins propelled by
      membrane-associated motor proteins, which is the mechanism MIC2 serves: it
      contributes the adhesive engagement that a step of the process depends on, and its
      cytoplasmic tail binds aldolase to link that engagement to actin. The phenotype is
      partial rather than absolute, which the later null analysis attributes to defective
      initiation of motility rather than to its maintenance.
    supported_by:
    - reference_id: PMID:16933991
      supporting_text: we suggest that MIC2 is needed to provide sufficient substrate
        binding to produce both helical and twirling motility
    - reference_id: PMID:28630943
      supporting_text: reduced invasion and gliding rates are due to a decreased ability
        to initiate rather than to sustain motility
    - reference_id: PMID:12718875
      supporting_text: Our findings reveal a potential role for aldolase in connecting
        TRAP family adhesins with the cytoskeleton
- term:
    id: GO:0085017
    label: entry into host cell by a symbiont-containing vacuole
  evidence_type: IMP
  original_reference_id: PMID:16933991
  qualifier: involved_in
  review:
    summary: >-
      Reducing MIC2 expression markedly lowers host-cell invasion, and loss of the
      MIC2 partner M2AP, which blocks rapid MIC2 secretion, impairs host cell entry by
      more than 80 per cent; the residual invasion of null parasites shows the
      contribution is quantitative.
    action: NEW
    reason: >-
      Toxoplasma enters host cells actively and resides in a parasitophorous vacuole, so
      this is the appropriate entry term. MIC2 participates by providing the adhesive
      grip at the start of entry rather than by driving penetration, and a clean null is
      still invasive, so the annotation is recorded as a genuine but non-core
      contribution and does not duplicate the adhesion term, which covers a distinct
      step.
    supported_by:
    - reference_id: PMID:16933991
      supporting_text: markedly defective host-cell attachment and invasion
    - reference_id: PMID:12727875
      supporting_text: M2AP knockout parasites were >80% impaired in host cell entry.
    - reference_id: PMID:28630943
      supporting_text: We verified the role of MIC2 in efficient surface attachment, but
        were unable to identify any direct function of MIC2 in sustaining gliding
        motility or host cell invasion once initiated.
