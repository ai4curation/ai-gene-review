- term:
    id: GO:0044650
    label: adhesion of symbiont to host cell
  evidence_type: IMP
  original_reference_id: PMID:28630943
  qualifier: involved_in
  review:
    summary: >-
      Depletion or deletion of MIC2 strongly reduces tachyzoite attachment to host cells
      and to substrate, and the invasion defect of MIC2-deficient parasites is traced
      principally to this failure to adhere.
    action: NEW
    reason: >-
      MIC2 performs the adhesion step itself rather than merely being required for it:
      it is the surface adhesin whose ectodomain engages host ligands while its tail
      grips the actomyosin motor, so the participation test is met. The comparator check
      agrees, since other apicomplexan surface adhesins that attach the parasite to host
      cells carry adhesion-of-symbiont-to-host terms. Two independent genetic systems, a
      conditional knockdown and a clean null, give the same attachment phenotype.
    supported_by:
    - reference_id: PMID:28630943
      supporting_text: mic2KO parasites show impaired attachment to host cells and
        collagen IV.
    - reference_id: PMID:28630943
      supporting_text: 'In summary, we find here that MIC2 acts as important, but not
        essential, attachment factor'
    - reference_id: PMID:16933991
      supporting_text: Therefore, the entry defect is principally due to an inability to adhere properly to the
        target cell, although we cannot rule out an additional defect in the penetration step that
        follows attachment.
- term:
    id: GO:0071980
    label: cell surface adhesin-mediated gliding motility
  evidence_type: IMP
  original_reference_id: PMID:16933991
  qualifier: involved_in
  review:
    summary: >-
      MIC2-depleted and MIC2-null tachyzoites lose helical gliding and twirling while
      retaining circular gliding, consistent with MIC2 supplying the substrate
      attachment that the subpellicular actomyosin motor pulls against.
    action: NEW
    reason: >-
      The term is defined as gliding that results from surface adhesins propelled by
      membrane-associated motor proteins, which is the mechanism MIC2 serves: it
      contributes the adhesive engagement that a step of the process depends on, and its
      cytoplasmic tail binds aldolase to link that engagement to actin. The phenotype is
      partial rather than absolute, which the later null analysis attributes to defective
      initiation of motility rather than to its maintenance.
    supported_by:
    - reference_id: PMID:16933991
      supporting_text: we suggest that MIC2 is needed to provide sufficient substrate binding to produce both
        helical and twirling motility.
    - reference_id: PMID:28630943
      supporting_text: reduced invasion and gliding rates are due to a decreased ability to initiate rather than
        to sustain motility.
    - reference_id: PMID:12718875
      supporting_text: Our findings reveal a potential role for aldolase in connecting TRAP family adhesins with
        the cytoskeleton, and provide a model linking adhesion with motility in apicomplexan
        parasites.
- term:
    id: GO:0085017
    label: entry into host cell by a symbiont-containing vacuole
  evidence_type: IMP
  original_reference_id: PMID:16933991
  qualifier: involved_in
  review:
    summary: >-
      Reducing MIC2 expression markedly lowers host-cell invasion, and loss of the
      MIC2 partner M2AP, which blocks rapid MIC2 secretion, impairs host cell entry by
      more than 80 per cent; the residual invasion of null parasites shows the
      contribution is quantitative.
    action: NEW
    reason: >-
      Toxoplasma enters host cells actively and resides in a parasitophorous vacuole, so
      this is the appropriate entry term. MIC2 participates by providing the adhesive
      grip at the start of entry rather than by driving penetration, and a clean null is
      still invasive, so the annotation is recorded as a genuine but non-core
      contribution and does not duplicate the adhesion term, which covers a distinct
      step.
    supported_by:
    - reference_id: PMID:16933991
      supporting_text: markedly defective host-cell attachment and invasion, the loss of helical
        gliding motility
    - reference_id: PMID:12727875
      supporting_text: M2AP knockout parasites were >80% impaired in host cell entry.
    - reference_id: PMID:28630943
      supporting_text: We verified the role of MIC2 in efficient surface attachment, but
        were unable to identify any direct function of MIC2 in sustaining gliding
        motility or host cell invasion once initiated.
