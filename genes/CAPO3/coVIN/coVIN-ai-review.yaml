  knowledge_gaps:
  - gap_statement: >-
      Actin filament binding, talin binding and talin-dependent activation are
      inferred from sponge and vertebrate vinculins and have not been measured for
      coVIN. No vinculin knockout or knockdown exists in Capsaspora, so its
      requirement for substrate adhesion is unknown.
suggested_questions:
- question: >-
    Does coVIN bind Capsaspora talin and, like sponge and vertebrate vinculins, become
    able to bind actin filaments only when talin relieves head-tail autoinhibition?
- question: >-
    Does coVIN lack domain D2, as sponge vinculin does, and does the longer paralog
    CAOG_03344 (1038 aa) retain it? Are the two paralogs expressed in different life
    stages or localised differently?
- question: >-
    Are the coVIN-positive filopodial patches adhesion sites? Do they also contain
    talin, and are they stable contacts with the substrate, given that animal
    filopodia are mostly exploratory?
- question: >-
    Where is coVIN in the aggregative stage, when adhesome genes are up-regulated? Is
    it at cell-cell contacts, as sponge vinculin is?
suggested_experiments:
- hypothesis: coVIN is required for filopodial substrate adhesion in Capsaspora.
  description: >-
    Knock out coVIN (and separately CAOG_03344) by the homologous-recombination
    method now available for Capsaspora, then measure adhesion to uncoated and
    fibronectin-coated surfaces, filopodium number and length, and integrin beta2
    patch formation.
  experiment_type: genetic knockout / adhesion assay
- hypothesis: coVIN is a talin-activated actin filament binding protein.
  description: >-
    Express recombinant full-length coVIN and its head domain. Measure binding to
    vinculin-binding-site peptides of Capsaspora talin by ITC, and F-actin
    co-sedimentation with and without talin peptide.
  experiment_type: in vitro binding
- hypothesis: The anti-vinculin staining reflects coVIN specifically.
  description: >-
    Stain coVIN knockout cells with the anti-CAOG_05123 antibody, and image a
    fluorescently tagged coVIN in live cells to follow patch dynamics during
    filopodial movement.
  experiment_type: localization / imaging
