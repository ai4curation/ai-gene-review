    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      bioRxiv preprint (full text cached) of the Curr Biol paper PMID:32857975, same
      authors and title. The only source of experimental data on coVIN. Its methods
      identify the vinculin antigen as CAOG_05123 residues 335-834, which matches
      A0A0D2WSN3 (CAOG_005123, 834 aa). Shows localisation only; no vinculin
      perturbation or binding data. Not peer reviewed; the published version may differ
      in detail.
  findings:
