taxon:
  id: NCBITaxon:595528
  label: Capsaspora owczarzaki ATCC 30864
description: >-
  coVIN (CAOG_05123) is one of two vinculin-family proteins of the amoeboid filasterean
  Capsaspora owczarzaki, a close unicellular relative of animals with an extensive
  integrin adhesome. The 834-residue protein carries the vinculin/alpha-catenin helical
  bundle architecture: an N-terminal vinculin head region (the talin-binding D1 domain
  in animal vinculins), central helix bundles, and a C-terminal bundle at the position
  of the vinculin tail, which in animal vinculins binds actin filaments. It is similar
  in length to sponge vinculin, which lacks the D2 domain of bilaterian vinculins. An
  antibody raised against its C-terminal region (residues 335-834) stains the cell body
  and distinct patches along the actin-dependent filopodia with which adherent
  Capsaspora cells attach to and move over the substrate. Some of these patches also
  contain integrin beta2, the major Capsaspora integrin beta subunit, whose ligand-binding
  domain is needed for adhesion to fibronectin. Vinculin staining in filopodia increases
  when cells adhere to fibronectin. These observations place coVIN at putative
  integrin-containing substrate contacts. Its own biochemical activities (binding to
  talin or actin filaments) and its requirement for adhesion have not been tested; in
  sponge and vertebrate vinculins, talin binding relieves autoinhibition and allows
  actin filament binding. The second Capsaspora vinculin paralog (CAOG_03344) is
  uncharacterized.
existing_annotations:
- term:
    id: GO:0003779
    label: actin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR017997
  review:
    summary: >-
      InterPro2GO mapping from the vinculin family signature (IPR017997, residues 1-257
      of coVIN). The protein has the full vinculin/alpha-catenin bundle architecture,
      including a C-terminal bundle at the position of the F-actin-binding vinculin tail.
      Actin binding has not been measured for the Capsaspora protein; the antibody
      localisation places it in actin-rich filopodia [DOI:10.1101/2020.02.27.967653].
    action: ACCEPT
    reason: >-
      A general MF inference from family membership that is consistent with the
      conserved vinculin mechanism, shown experimentally in a sponge vinculin
      [PMID:29880641] and in vertebrate vinculins. Accepted at IEA level only. It must
      not be upgraded to an experimental annotation for Capsaspora: no binding assay
      was done with coVIN, and in sponge and vertebrate vinculins actin binding depends
      on talin-mediated release of autoinhibition, which has not been tested here.
    supported_by:
    - reference_id: PMID:29880641
      supporting_text: >-
        Thus, binding of talin to Op vinculin D1 releases autoinhibition for F-actin
        binding, similar to the behavior of vertebrate vinculin.
    - reference_id: DOI:10.1101/2020.02.27.967653
      supporting_text: >-
        Distinct patches of vinculin are observed in the filopodia.
