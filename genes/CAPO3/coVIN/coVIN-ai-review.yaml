- term:
    id: GO:0007155
    label: cell adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR006077
  - InterPro:IPR036723
  review:
    summary: >-
      InterPro2GO mapping from the vinculin/alpha-catenin domain. In Capsaspora,
      adherent cells attach to the substrate through Arp2/3-dependent filopodia, and an
      antibody against the ligand-binding domain of integrin beta2 inhibits adhesion to
      fibronectin. coVIN localises in patches along these filopodia, partly together
      with integrin beta2, and its filopodial staining increases on fibronectin
      [DOI:10.1101/2020.02.27.967653].
    action: ACCEPT
    reason: >-
      Vinculin-family proteins do part of the work of adhesion as the
      actin-anchoring linkers of adhesion complexes, so this general process term is a
      reasonable family-level inference, and it is consistent with where coVIN is
      found. It is not an animal-tissue or developmental term. Accepted only at IEA
      level: no vinculin-specific perturbation exists in Capsaspora (the adhesion
      perturbations used drugs against actin polymerisation and Arp2/3 and a
      function-blocking integrin antibody), so neither this term nor a more specific
      cell-substrate adhesion term is supported experimentally for coVIN. The authors
      themselves present the patches only as possible anchorage sites. Sebé-Pedrós et
      al. argued that vinculin-family scaffolds predate integrins and had other
      ancestral roles [PMID:20479219], so a role in Capsaspora adhesion should not be
      assumed from homology alone.
    supported_by:
    - reference_id: DOI:10.1101/2020.02.27.967653
      supporting_text: >-
        these results suggest that the integrin and vinculin patches may represent
        anchorage sites of adhesion
    - reference_id: DOI:10.1101/2020.02.27.967653
      supporting_text: >-
        These results suggest that Fibronectin promotes cell adhesion by increasing the
        number and length of filopodia as well as by promoting recruitment of integrin
        and vinculin to the filopodia.
    - reference_id: PMID:20479219
      supporting_text: >-
        suggesting that an ancient scaffolding machinery was coopted to the integrin
        adhesion system
- term:
    id: GO:0051015
    label: actin filament binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR006077
  - InterPro:IPR036723
  review:
    summary: >-
      InterPro2GO mapping from the vinculin/alpha-catenin domain. The C-terminal bundle
      region of coVIN (Gene3D 655-832, with the PRINTS vinculin fingerprint motifs at
      691-780) corresponds to the actin-binding vinculin tail of animal vinculins.
      Sponge vinculin binds actin filaments once a talin peptide relieves
      autoinhibition [PMID:29880641].
    action: ACCEPT
    reason: >-
      The most likely core molecular activity of coVIN, inferred from family
      membership and domain architecture. Accepted at IEA level. Actin filament binding,
      and its talin dependence, have been shown for sponge and vertebrate vinculins but
      not for the Capsaspora protein, so they should not be transferred as
      experimental. coVIN may lack domain D2, as sponge vinculin does; this affects
      autoinhibition but not the presence of the actin-binding tail.
    supported_by:
    - reference_id: PMID:29880641
      supporting_text: >-
        In the presence of Op talin peptide, full-length Op vinculin bound to F-actin
        filaments
    - reference_id: PMID:29880641
      supporting_text: >-
        VIN proteins link actin filaments to membrane proteins at the plasma membrane
        and are found in all animals and their close outgroups
- term:
    id: GO:0030175
    label: filopodium
  evidence_type: IDA
  original_reference_id: DOI:10.1101/2020.02.27.967653
  qualifier: located_in
  review:
    summary: >-
      Immunostaining of endogenous coVIN in fixed adherent Capsaspora cells, with an
      antibody raised against residues 335-834 of CAOG_05123, shows distinct patches
      along the phalloidin-stained filopodia. Some patches also contain integrin beta2.
      Filopodial staining intensity increases on fibronectin-coated compared with
      BSA-coated coverslips. The antibody was checked by Western blot against the
      antigen and Capsaspora extracts (major band at the predicted size), by
      immunoprecipitation with mass spectrometry, and with no-primary-antibody imaging
      controls [DOI:10.1101/2020.02.27.967653; PMID:32857975].
    action: NEW
    reason: >-
      No experimental annotation exists for this protein. The localisation is a direct
      observation of the endogenous protein in Capsaspora, so IDA is the right evidence
      type. Filopodium is chosen rather than focal adhesion or cell-substrate junction:
      the patches have not been characterised as adhesion structures beyond partial
      overlap with integrin beta2, and the authors present them only as possible
      anchorage sites. Caveats: the full methods are in the bioRxiv preprint (the
      cached Curr Biol record is abstract only); there is no knockout or
      antigen-competition control, and cross-reaction with the second vinculin
      paralog (CAOG_03344) is not explicitly excluded in the text. Only the adherent
      stage was examined.
    additional_reference_ids:
    - PMID:32857975
    supported_by:
    - reference_id: DOI:10.1101/2020.02.27.967653
      supporting_text: >-
        Distinct patches of vinculin are observed in the filopodia.
    - reference_id: DOI:10.1101/2020.02.27.967653
      supporting_text: >-
        Co-immunostaining showed a partial overlap, some patches contain both, whereas
        others have just one of the proteins
    - reference_id: DOI:10.1101/2020.02.27.967653
      supporting_text: >-
        The vinculin-antigen is a polypeptide corresponding to the C-terminus region of
        one of the vinculin homologs (CAOG_05123, amino acid region 335-834).
    - reference_id: PMID:32857975
      supporting_text: >-
        We show that integrin β2 and its associated protein vinculin localize as
        distinct patches in the filopodia.
core_functions:
- description: >-
    Predicted actin-filament-binding linker at filopodial substrate contacts. By family
    membership and domain architecture, coVIN is a vinculin that would couple adhesion
    complexes to the actin cytoskeleton. In Capsaspora the endogenous protein forms
    patches along adhesive filopodia, some shared with integrin beta2, and its
    filopodial level rises on fibronectin. Its biochemical activities and its
    requirement for adhesion have not been tested.
