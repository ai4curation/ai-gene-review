  - statement: coVIN and integrin beta2 patches partially overlap.
    supporting_text: >-
      Co-immunostaining showed a partial overlap, some patches contain both, whereas
      others have just one of the proteins
  - statement: Vinculin staining in filopodia increases on fibronectin.
    supporting_text: >-
      The overall fluorescence intensity of integrin β2 and vinculin staining within
      filopodia increased
