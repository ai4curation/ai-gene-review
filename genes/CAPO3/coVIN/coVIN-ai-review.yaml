  review:
    summary: >-
      UniProt subcellular-location mapping (ARBA rule). Immunostaining of endogenous
      coVIN in fixed adherent Capsaspora cells shows staining of the cell body as well
      as of filopodial patches [DOI:10.1101/2020.02.27.967653].
    action: ACCEPT
    reason: >-
      Vinculin is a cytoplasmic protein in all organisms studied, and the cell-body
      staining in Capsaspora agrees. The more informative location is the filopodium,
      added below as a NEW IDA row.
