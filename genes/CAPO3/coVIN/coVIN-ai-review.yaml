- id: PMID:29880641
  title: Analysis of a vinculin homolog in a sponge (phylum Porifera) reveals that
    vertebrate-like cell adhesions emerged early in animal evolution.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Sponge (Oscarella pearsei) vinculin biochemistry and structure. Used as comparative
      context for the predicted activities of coVIN; it contains no Capsaspora data.
  findings:
  - statement: >-
      Sponge vinculin is autoinhibited for F-actin binding, and talin relieves the
      inhibition.
    supporting_text: >-
      Thus, binding of talin to Op vinculin D1 releases autoinhibition for F-actin
      binding, similar to the behavior of vertebrate vinculin.
  - statement: Sponge vinculin lacks domain D2.
    supporting_text: >-
      Op vinculin lacks domain 2, which typically distinguishes vinculin from
      α-catenin in other animals
- id: PMID:20479219
  title: Ancient origin of the integrin-mediated adhesion and signaling machinery.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Comparative genomics of the integrin adhesome, including Capsaspora. Establishes
      that vinculin predates animals; argues that the scaffolds predate integrins and
      were co-opted. No functional data on coVIN.
  findings:
  - statement: Vinculin and the other adhesome scaffolds are found across unikonts.
    supporting_text: >-
      all scaffolding proteins involved in the integrin adhesion apparatus (that is,
      α-actinin, vinculin, paxillin, and talin) are common among unikonts
