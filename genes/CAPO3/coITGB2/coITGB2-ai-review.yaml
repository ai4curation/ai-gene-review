    label: cell-matrix adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN002560695
  review:
    summary: >-
      TreeGrafter transfer from the vertebrate ITGBL1 node. Capsaspora integrin beta 2
      does mediate substrate adhesion: an antibody to its beta-I domain inhibits
      adhesion to fibronectin-coated surfaces [PMID:32857975]. The surfaces are plastic
      coated with mammalian fibronectin or with material the cells secrete; Capsaspora
      has no fibronectin ortholog, and no Capsaspora extracellular matrix ligand has
      been identified [DOI:10.1101/2020.02.27.967653].
    action: MODIFY
    reason: >-
      The process is supported, but "matrix" implies an extracellular matrix that has
      not been defined for Capsaspora. The experiments measure attachment to a coated
      substrate, which is exactly what cell-substrate adhesion (GO:0031589), the parent
      of cell-matrix adhesion, describes. The integrin is the adhesion receptor itself,
      so it does the work of the process. The antibody-blocking result
      (DOI:10.1101/2020.02.27.967653, PMID:32857975) is direct perturbation evidence
      for the replacement term. Revisit cell-matrix adhesion if the endogenous
      secreted ligand is identified.
    proposed_replacement_terms:
