core_functions:
- description: >-
    Integrin beta subunit that acts as a cell-substrate adhesion receptor in
    filopodia of adherent Capsaspora cells. Its ligand-binding beta-I domain is needed
    for adhesion to fibronectin-coated surfaces, and it concentrates, together with
    vinculin, in patches along filopodia. The endogenous ligand is unknown;
    heterodimerisation with an integrin alpha subunit and coupling to talin through the
    NPxY tail are inferred from conserved motifs, not shown.
  molecular_function:
    id: GO:0098631
    label: cell adhesion mediator activity
  directly_involved_in:
  - id: GO:0033627
    label: cell adhesion mediated by integrin
  - id: GO:0031589
    label: cell-substrate adhesion
  locations:
  - id: GO:0030175
    label: filopodium
  - id: GO:0005886
    label: plasma membrane
  in_complex:
    id: GO:0008305
    label: integrin complex
  knowledge_gaps:
  - gap_statement: >-
      The integrin complex (GO:0008305) membership is inferred, not shown: no
      integrin alpha partner of integrin beta2 has been identified biochemically
      in Capsaspora, and talin coupling through the NPxY tail motif is predicted
      from sequence only. The endogenous ligand is also unknown.
  supported_by:
  - reference_id: PMID:32857975
    supporting_text: >-
      Finally, using a specific antibody for integrin β2, we inhibited cell adhesion to a
      fibronectin-coated surface.
  - reference_id: PMID:32857975
    supporting_text: >-
      We show that integrin β2 and its associated protein vinculin localize as distinct
      patches in the filopodia.
  - reference_id: DOI:10.1101/2020.02.27.967653
    supporting_text: >-
      Taken together, these results show that the major integrin β subunit in
      Capsaspora makes a substantial contribution to substrate adhesion.
suggested_questions:
- question: >-
    What is the endogenous ligand of Capsaspora integrin beta 2? Candidates named by the
    authors are secreted Capsaspora proteins with fibronectin-type domains or RGD
    sequences; does adhesion depend on RGD, and on divalent cations at the conserved
    MIDAS site?
- question: >-
    Which of the four Capsaspora integrin alpha subunits pairs with beta 2, and does the
    pair form in vivo?
- question: >-
    Are the filopodial integrin-vinculin patches junctional plaques with talin and
    paxillin, comparable to animal nascent or focal adhesions, or a distinct
    filopodial adhesion structure?
- question: >-
    Does integrin beta 2 contribute to cell-cell adhesion or aggregate shape during the
    aggregative stage, where adhesome genes are up-regulated? Is its up-regulation in
    coYki knockouts the cause of their increased substrate adhesion?
- question: >-
    TreeGrafter grafts this and the other Capsaspora integrin betas onto the vertebrate
    ITGBL1 node (PTN002560695) of a Eumetazoa-rooted tree. Could PANTHER add a
    holozoan outgroup so that unicellular integrins graft at the family root instead?
suggested_experiments:
- hypothesis: Integrin beta 2 is required for substrate adhesion and filopodial adhesion patches.
  description: >-
    Knock out CAOG_05058 (genome editing now works in Capsaspora) and measure adhesion
