      label: cell-substrate adhesion
    supported_by:
    - reference_id: PMID:32857975
      supporting_text: >-
        Finally, using a specific antibody for integrin β2, we inhibited cell adhesion to
        a fibronectin-coated surface.
    - reference_id: DOI:10.1101/2020.02.27.967653
      supporting_text: >-
        Taken together, these results show that the major integrin β subunit in
        Capsaspora makes a substantial contribution to substrate adhesion.
    - reference_id: DOI:10.1101/2020.02.27.967653
      supporting_text: >-
        This suggests that a protein secreted by Capsaspora sticks to the plastic
        substrate and provides a ligand for adhesion
