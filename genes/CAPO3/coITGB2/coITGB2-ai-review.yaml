    label: integrin binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002560695
  review:
    summary: >-
      TreeGrafter transfer from PTN002560695, the vertebrate integrin beta-like protein 1
      (ITGBL1) node in PTHR10082. The term is inherited there from the integrin-beta
      family root, so it is a family-wide claim. For a beta subunit, the "integrin" it
      binds is its alpha partner. Capsaspora has four integrin alpha subunits, and the
      alpha-interacting tail motif is conserved in beta 2 [PMID:20479219], but
      heterodimer formation has not been tested.
    action: KEEP_AS_NON_CORE
    reason: >-
      The claim is plausible from conserved motifs and from the presence of alpha
      partners, and it is not specific to multicellular animals, since it concerns
      heterodimer assembly rather than any animal ligand. The authors who described the
      repertoire state explicitly that heterodimerisation is assumed, not shown. Kept as
      non-core, consistent with the human ITGB1 review, where the same IBA is kept as a
      non-core subunit-association term best captured by integrin complex.
    supported_by:
    - reference_id: PMID:20479219
      supporting_text: >-
        Other key motifs in metazoan integrin β proteins are the cytoplasmic integrin
        α-interacting motif and the NPXY motif
    - reference_id: PMID:20479219
      supporting_text: >-
        Thus, we can assume that they too work as heterodimers and that they interact and
        function similarly to metazoan homologs. Functional analysis will be needed to
        test this hypothesis.
