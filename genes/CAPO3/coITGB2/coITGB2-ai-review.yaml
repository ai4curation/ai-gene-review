        source_label: PTHR10082:SF3 integrin beta-like protein 1, Euteleostomi node
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Graft node is the vertebrate ITGBL1 clade (all leaves vertebrate ITGBL1), not
          an integrin beta orthology group containing Capsaspora; the PTHR10082 tree is
