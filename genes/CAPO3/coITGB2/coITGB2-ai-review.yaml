taxon:
  id: NCBITaxon:595528
  label: Capsaspora owczarzaki (strain ATCC 30864)
description: >-
  Integrin beta 2 (CAOG_05058) is one of four integrin beta subunits of the amoeboid
  filasterean Capsaspora owczarzaki, a close unicellular relative of animals, and the
  most highly expressed of them. It is a 1056-residue single-pass type I membrane
  protein. It has a signal peptide, a vWA-like beta-I domain with conserved MIDAS,
  ADMIDAS and LIMBS cation-binding sites, a PSI domain, a cysteine-rich EGF-like stalk
  that is longer than in animal integrins, a transmembrane helix, and a short
  cytoplasmic tail with the alpha-subunit-interacting region and NPxY-type motifs that
  bind talin in animals. Capsaspora also encodes integrin alpha subunits and the main
  intracellular adhesome proteins (talin, vinculin, paxillin, the ILK-PINCH-parvin
  complex, FAK and Src), so the protein presumably forms alpha/beta heterodimers,
  although this has not been tested. In adherent cells, integrin beta 2 is found on the
  cell body and in distinct patches along the actin-dependent filopodia that attach the
  cells to surfaces, partly overlapping with vinculin. Mammalian fibronectin increases
  adhesion and the amount of integrin beta 2 in filopodia. An antibody against its
  ligand-binding beta-I domain strongly reduces adhesion to fibronectin-coated
  surfaces, so the protein mediates cell-substrate adhesion. Capsaspora has no
  fibronectin ortholog, and its natural ligand is unknown; candidates include secreted
  Capsaspora proteins with fibronectin-type domains or RGD sequences. Whether integrin
  beta 2 also signals or takes part in cell-cell adhesion during aggregation has not
  been examined.
