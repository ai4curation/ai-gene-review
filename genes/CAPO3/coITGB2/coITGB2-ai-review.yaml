- term:
    id: GO:0005925
    label: focal adhesion
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN002560695
  review:
    summary: >-
      TreeGrafter transfer from the vertebrate ITGBL1 node PTN002560695. In
      Capsaspora, integrin beta 2 and vinculin form distinct, partly overlapping patches
      along filopodia, which the authors suggest may be anchorage sites of adhesion
      [DOI:10.1101/2020.02.27.967653]. These patches have not been shown to be focal
      adhesions, which GO defines as cell-substrate junctions that anchor the cell to
      the extracellular matrix and terminate actin filaments.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Focal adhesions are a specific structure of animal cells, mature integrin
      adhesions at the ends of stress fibres. In Capsaspora the integrin and vinculin
      patches lie within filopodia, and the authors themselves describe this
      as an unexpected role for integrin adhesion within filopodia. They
      characterise the patches only as possible anchorage sites. The localization that
      is shown is captured by the NEW filopodium annotation. A focal-adhesion (or
      cell-substrate junction) assignment would need evidence of a junctional plaque,
      for example talin and paxillin co-recruitment and actin-filament termination.
    supported_by:
    - reference_id: DOI:10.1101/2020.02.27.967653
      supporting_text: >-
        Taken together, these results suggest that the integrin and vinculin patches may
        represent anchorage sites of adhesion.
    - reference_id: DOI:10.1101/2020.02.27.967653
      supporting_text: >-
        which is an unexpected role for integrin adhesion within filopodia
    propagation_review:
