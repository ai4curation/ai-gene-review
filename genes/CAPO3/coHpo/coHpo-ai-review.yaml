  review:
    summary: >-
      Combined IEA (InterPro2GO for the Mst1/2 SARAH domain IPR024205, EC 2.7.11.1 via
      ARBA, and PANTHER PTN008481874). coHpo is the single Hippo/MST (STE20 subfamily,
      CDD STKc_MST1_2) kinase of Capsaspora. No in vitro kinase assay has been performed
      on the Capsaspora protein. Indirect support: overexpressed coHpo induces
      phosphorylation of coYki and of Drosophila Warts (T1077) and Yorkie (S168) in
      Drosophila S2R+ cells [PMID:22832104]; in Capsaspora, deletion of the kinase domain
      causes nuclear accumulation of coYki, the expected outcome of loss of an upstream
      kinase [PMID:38517944].
    action: ACCEPT
    reason: >-
      This is the core molecular activity of a Hippo/MST kinase. The domain
      architecture is complete (kinase domain plus Mst1/2-type SARAH), and the
      heterologous phosphorylation of the Hippo-responsive Warts site and the
      kinase-domain knockout phenotype are both consistent with an active Ser/Thr
      kinase. The activity itself remains an inference: it has not been measured
      biochemically with purified coHpo, and the Drosophila experiments are
      overexpression readouts in cells that contain endogenous kinases. Accepted as a
      well-supported homology-based annotation.
    supported_by:
