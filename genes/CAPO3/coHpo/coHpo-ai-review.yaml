  review:
    summary: >-
      TreeGrafter transfer from the PANTHER Hippo/MST family node. Localization of coHpo
      protein has not been examined in Capsaspora; the only localization data in the
      primary study are for its target coYki, which is cytoplasmic in wild-type cells and
      shifts to the nucleus in coHpo-/- cells [PMID:38517944].
    action: ACCEPT
    reason: >-
      Hippo/MST kinases act in the cytoplasm to phosphorylate Warts/LATS, which in turn
      retains Yorkie in the cytoplasm. A cytoplasmic site of action for coHpo is
      consistent with its role in cytoplasmic sequestration of coYki in Capsaspora, and
      the term is broad enough not to over-claim. It remains a family-level prediction
      until coHpo is localized directly.
    supported_by:
    - reference_id: PMID:38517944
      supporting_text: >-
        Together, these results show that the Capsaspora Hippo kinase cascade regulates
        coYki by cytoplasmic sequestration, indicating a premetazoan origin of this
        regulatory activity of the Hippo pathway.
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR011524
  review:
    summary: >-
      InterPro2GO mapping from the SARAH domain (IPR011524). In Capsaspora, homozygous
      coHpo knockout causes nuclear accumulation of coYki, the same regulatory output
      as loss of coWts, showing that coHpo acts in a Hippo kinase cascade upstream of
      coYki [PMID:38517944]. Heterologously, coHpo phosphorylates/activates Drosophila
      Warts and leads to Yorkie phosphorylation [PMID:22832104].
    action: MODIFY
    reason: >-
      Correct but far too general. GO:0035329 hippo signaling is defined as an
      intracellular cascade that starts with activation of Hippo, which phosphorylates
      LATS, which phosphorylates YAP/Yorkie leading to its cytosolic retention. That is
      what has been shown for coHpo: its loss releases coYki from cytoplasmic
      sequestration in Capsaspora (IMP-type evidence), and the protein activates the
      Warts-Yorkie cascade in Drosophila. coHpo is the initiating kinase of the
      cascade, so it performs a step of the process (participation test passes), and
      the orthologous kinases Drosophila hpo and human STK3/STK4 carry this term. The
      term has no taxon constraint. Caveats: no epistasis by double mutant was possible,
      and the coHpo-/- effect on coYki is weaker than that of coWts-/-, consistent with
      Hpo-independent Wts activity; coHpo phosphorylation of coWts has not been shown
      in Capsaspora.
    proposed_replacement_terms:
    - id: GO:0035329
      label: hippo signaling
    supported_by:
    - reference_id: PMID:38517944
      supporting_text: >-
        In contrast, the majority of coHpo-/- and coWts-/- cells showed nuclear levels of
        mScarlet-coYki greater than or equal to that seen in the cytoplasm
    - reference_id: PMID:38517944
      supporting_text: >-
        Together, these results show that the Capsaspora Hippo kinase cascade regulates
        coYki by cytoplasmic sequestration, indicating a premetazoan origin of this
        regulatory activity of the Hippo pathway.
    - reference_id: PMID:38517944
      supporting_text: >-
        Interestingly, we found that coWts-/- cells were significantly more likely to
        show nuclear mScarlet-coYki localization than coHpo-/- cells
    - reference_id: PMID:22832104
      supporting_text: >-
        Thus, Co-Hpo not only possesses growth-suppressing activity but also
        functionally activates a signaling cascade leading to the phosphorylation of
        endogenous Yki in Drosophila.
- term:
    id: GO:0051262
    label: protein tetramerization
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR036674
  review:
    summary: >-
      InterPro2GO mapping from IPR036674 "p53-like tetramerisation domain superfamily",
      a structural (Gene3D 4.10.170.10 / SUPERFAMILY) fold class that the helical SARAH
      segment of coHpo matches. GO:0051262 is defined as formation of a protein
      tetramer. The SARAH domain of Hippo/MST kinases forms antiparallel homodimers and
      1:1 heterodimers with RASSF and Salvador SARAH domains, not tetramers
      [PMID:17517604, PMID:25004971]. No oligomerization data exist for coHpo.
    action: REMOVE
    reason: >-
      The annotation is a fold-level InterPro2GO artefact: membership of a
      p53-tetramerisation-like structural superfamily does not imply tetramer
      formation. For MST1 the SARAH domain forms a homodimer, and when MST1 SARAH meets
      the tetramer-prone free Rassf5 SARAH domain it converts it into dimers, the
      opposite of tetramerization. The SARAH-specific InterPro entries for this protein
      (IPR011524, IPR024205) do not map to tetramerization. If SARAH-mediated
      oligomerization of coHpo is to be represented, it should be as dimerization
      activity once tested for the Capsaspora protein.
    supported_by:
    - reference_id: PMID:17517604
      supporting_text: >-
        The Mst1 SARAH structure forms a homodimer containing two helices per monomer.
    - reference_id: PMID:17517604
      supporting_text: >-
        In cross-linking experiments, the major population of the free Rassf5 SARAH
        domain formed tetramers in solution. However, when the Mst1 SARAH domain was
        added, dimers were formed
    - reference_id: PMID:17517604
      supporting_text: >-
        identified an elongated, tight-binding interface with the Rassf5 SARAH domain and
        a 1:1 heterodimer formation.
core_functions:
- description: >-
    Initiating serine/threonine kinase of the Capsaspora Hippo kinase cascade. coHpo is
    required to keep the Yorkie/YAP/TAZ ortholog coYki out of the nucleus, acting
    upstream of coWts; through this restraint of coYki transcriptional activity it limits
    an actomyosin-dependent elongated/contractile cell state and the packing density of
    cells in multicellular aggregates, but it does not regulate proliferation. Its kinase
    activity is inferred from domain architecture and from heterologous phosphorylation
    of Drosophila Warts and Yorkie; it has not been assayed with purified protein.
