  label: Capsaspora owczarzaki (strain ATCC 30864)
description: >-
  coHpo (CAOG_01932) is the single Hippo/MST-family kinase of the filasterean amoeba
  Capsaspora owczarzaki, a close unicellular relative of animals. It is a STE20-group
  serine/threonine protein kinase with an N-terminal kinase domain and a C-terminal
  SARAH coiled-coil domain, the architecture that defines Hippo/MST1/2 kinases. The locus
  has three predicted protein models (UniProt A0A0D2WLF3, 430 aa; A0A0D2VKT0, 466 aa;
  A0A0D2X1E3, 367 aa), of which only A0A0D2WLF3 contains the SARAH domain; this is the
  form used to rescue the knockout. Homozygous knockout of the kinase domain in
  Capsaspora shifts the Yorkie/YAP/TAZ ortholog coYki from the cytoplasm into the
  nucleus, indicating that coHpo acts at the head of a Hippo-Warts kinase cascade that
  restrains coYki by cytoplasmic sequestration. Loss of coHpo does not alter cell
  proliferation, but increases the frequency of an elongated, myosin-dependent
  contractile cell state (rescued by a coHpo transgene) and increases the packing
  density of cells within multicellular aggregates; these phenotypes are copied by a
  non-phosphorylatable, transcriptionally active coYki and are therefore attributed to
  unrestrained coYki activity. When overexpressed in Drosophila, coHpo stimulates
  phosphorylation of Warts at its Hippo-responsive site and of Yorkie, and restricts eye
  growth, showing that it can engage the animal kinase cascade. Its catalytic activity
  has not been measured with purified protein, and its subcellular localization has not
  been examined directly.
