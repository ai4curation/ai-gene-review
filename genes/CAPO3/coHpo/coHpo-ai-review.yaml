- id: PMID:38517944
  title: The Hippo kinase cascade regulates a contractile cell behavior and cell density
    in a close unicellular relative of animals.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary loss-of-function study; full text cached. Names the targeted gene as
      CAOG_01932 and states that only one of three predicted isoforms carries the SARAH
      domain. Reports coHpo-/- phenotypes on coYki localization, proliferation, cell
      shape/contractility, aggregate morphology and cell packing, plus rescue and RNA-seq.
      No biochemical kinase assay or coHpo localization.
  findings:
  - statement: The coHpo gene targeted for knockout is CAOG_01932.
    supporting_text: target the coHpo gene (CAOG_01932)
  - statement: >-
      Only one of three predicted coHpo isoforms encodes the SARAH domain, and that
      isoform was used for the rescue transgene.
    supporting_text: >-
      There are three predicted isoforms of the coHpo sequence, but only one of these
      encodes the SARAH domain, which is important for Hippo kinase activity in Hippo
      pathway signaling
  - statement: Loss of coHpo increases nuclear localization of coYki.
    supporting_text: >-
      In contrast, the majority of coHpo-/- and coWts-/- cells showed nuclear levels of
      mScarlet-coYki greater than or equal to that seen in the cytoplasm
  - statement: coHpo loss does not change proliferation in adherent culture.
    supporting_text: >-
      In adherent growth conditions, coWts-/- and coHpo-/- cells proliferated at similar
      rates as WT cells
  - statement: The elongated (contractile) cell phenotype is rescued by a coHpo transgene.
    supporting_text: >-
      The presence of elongated cells was rescued by transgenic expression of coHpo or
      coWts in the respective mutant
  - statement: coHpo loss increases cell packing density within aggregates.
    supporting_text: >-
      These results indicate that loss of the Hippo pathway kinases increases cell
      density within Capsaspora aggregates.
  - statement: coHpo-/- aggregates have normal size and circularity.
    supporting_text: coHpo -/- aggregates showed similar size and circularity as WT aggregates
  - statement: >-
      A non-phosphorylatable coYki phenocopies the kinase mutants; double-mutant
      epistasis was not possible.
    supporting_text: >-
      Since techniques are currently unavailable to create double mutants in Capsaspora,
      we could not test this possibility through classic genetic epistasis.
- id: PMID:22832104
