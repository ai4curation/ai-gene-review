      revealed by phospho-specific antibodies against P-Dm-Wts-T1077 and P-Dm-Yki-S168,
      respectively
suggested_questions:
- question: >-
    Which of the three predicted CAOG_01932 protein models (A0A0D2WLF3 with SARAH,
    430 aa; A0A0D2VKT0, 466 aa; A0A0D2X1E3, 367 aa, both lacking SARAH) are expressed in
    Capsaspora, and are the SARAH-less forms genuine isoforms or gene-model artefacts?
    The knockout removed the shared kinase domain and so eliminated all of them; rescue
    used the SARAH-containing form only.
- question: >-
    Does purified coHpo phosphorylate coWts directly (at the site corresponding to
    Drosophila Warts T1077) and is coHpo itself activated by autophosphorylation of its
    activation loop, as for Hpo/MST1/2?
- question: >-
    Does the coHpo SARAH domain homodimerize and heterodimerize with Capsaspora Salvador
    or RASSF SARAH proteins, and is the SARAH domain required for rescue of the coHpo-/-
    phenotypes?
- question: >-
    Why is the effect of coHpo loss on coYki localization weaker than that of coWts
    loss - which kinases (e.g. other STE20/MAP4K-family kinases) activate coWts
    independently of coHpo in Capsaspora?
- question: >-
    What upstream signals (cell density, cell contact, mechanical cues in aggregates)
    regulate coHpo activity in Capsaspora?
suggested_experiments:
- hypothesis: coHpo is an active Ser/Thr kinase that directly phosphorylates coWts.
  description: >-
    Express and purify wild-type and kinase-dead (catalytic lysine mutant) coHpo and
    perform in vitro kinase assays with coWts and the MOB ortholog as substrates, mapping
    phosphosites by mass spectrometry.
  experiment_type: biochemical kinase assay
- hypothesis: Catalytic activity and the SARAH domain are both required for coHpo function.
  description: >-
    Complement coHpo-/- cells with kinase-dead and SARAH-deleted transgenes and score
    coYki localization, elongated-cell frequency and aggregate cell density.
  experiment_type: genetic complementation
- hypothesis: coHpo acts in the cytoplasm/cell cortex.
  description: >-
    Stably express a fluorescently tagged coHpo (or endogenously tag the locus) and image
    its localization in adherent cells and aggregates relative to F-actin foci and the
    plasma membrane.
  experiment_type: localization / imaging
- hypothesis: coHpo phenotypes require coYki.
  description: >-
    Once double-mutant or conditional knockdown methods are available, test whether
    coYki loss suppresses the elongated-cell and dense-packing phenotypes of coHpo-/-
    cells.
  experiment_type: genetic epistasis
