      S2R+ cells it induced phosphorylation of Co-Yki, Dm-Wts T1077 and Dm-Yki S168, and
      GMR-driven overexpression gave a small-eye phenotype with increased endogenous Yki
      phosphorylation. Overexpression in a heterologous host; shows capacity, not
      endogenous function.
  findings:
