  - statement: Co-Hpo stimulates phosphorylation of Drosophila Warts and Yorkie in S2R+ cells.
    supporting_text: >-
      Interestingly, Co-Hpo also stimulated the phosphorylation of Dm-Wts and Dm-Yki, as
      revealed by phospho-specific antibodies against P-Dm-Wts-T1077 and P-Dm-Yki-S168,
      respectively
  - statement: Overexpressed Co-Hpo restricts eye growth in Drosophila.
    supporting_text: >-
      Overexpression of Co-Hpo by the GMR-Gal4 driver (GMR>Co-Hpo) resulted in a small
