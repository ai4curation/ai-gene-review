- term:
    id: GO:0031032
    label: actomyosin structure organization
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001122925
  review:
    summary: >-
      TreeGrafter transfer from PANTHER node PTN001122925 in PTHR22988, the
      ROCK/MRCK/citron Rho-effector kinase family, whose members directly phosphorylate
      myosin light chain and regulators of actomyosin. coWts is a Warts/LATS kinase
      (MOB-binding region, C-terminal kinase domain) that falls into this family's HMM
      while its human orthologs LATS1/2 are classified in PTHR24356. The coWts knockout
      does show a myosin-sensitive contractile cell behaviour and denser
      aggregates [PMID:38517944], but actomyosin structures were imaged and perturbed
      only in coHpo mutants and wild type, and the phenotypes are attributed to coYki
      transcription.
    action: REMOVE
    reason: >-
      The term comes from a family-level placement with the Rho-effector kinases, which
      do organize actomyosin directly; it is not inherited from the Warts/LATS lineage.
      The Capsaspora data do not rescue it: coWts loss increases a contractile behaviour
      through coYki-dependent transcription (phenocopied by coYki 4SA, abolished by the
      TEAD-binding F123A mutation), there was no epistasis test, and the authors state
      that the role of myosin in these phenotypes remains unclear. coWts therefore acts
      upstream of, not in, actomyosin structure organization. This is the
      Track C pattern of a family-specific cytoskeletal process term transferred to a
      unicellular protein through a misassigned family.
    supported_by:
    - reference_id: file:CAPO3/coWts/coWts-uniprot.txt
      supporting_text: PANTHER; PTHR22988; MYOTONIC DYSTROPHY S/T KINASE-RELATED; 1.
    - reference_id: PMID:38517944
      supporting_text: >-
        This result indicates that these phenotypes are mediated by the transcriptional
        activity of coYki.
    - reference_id: PMID:38517944
      supporting_text: >-
        Thus the specific role of myosin activity in the phenotypes observed in Hippo
        pathway mutants in Capsaspora remains unclear.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN001122925
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          PTHR22988 node (ROCK/MRCK/citron family); actomyosin organization is a direct
          activity of those Rho-effector kinases, but coWts belongs to the Warts/LATS
          clade, which acts on actomyosin only indirectly via Yorkie.
