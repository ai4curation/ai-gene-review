    supporting_text: >-
      this result suggests that coWts is not a negative regulator of cell proliferation
      as in Drosophila and mammals, but instead is required for normal cell viability
      under some growth conditions
  - statement: >-
      coWts loss produces elongated contractile cells, rescued by a coWts transgene.
    supporting_text: >-
      The presence of elongated cells was rescued by transgenic expression of coHpo or
      coWts in the respective mutant (Figure 3A and B), demonstrating that the elongated
      cell phenotype was specifically due to the absence of these kinases.
  - statement: coWts mutant aggregates are less circular and more densely packed.
    supporting_text: >-
      Whereas the number of cells per unit area in coYki -/- aggregates was not
      significantly different from WT, the number of cells per area in coHpo -/- and
      coWts -/- was significantly increased relative to WT (Figure 5E).
  - statement: coWts mutant cells have shorter filopodia within aggregates.
    supporting_text: >-
      Whereas filopodia from coHpo -/- cells resembled those of WT and often extended
      more than a cell diameter distance within the aggregate, filopodia from coWts -/-
      cells were much shorter
  - statement: >-
      The phenotypes depend on coYki transcriptional activity; epistasis could not be
      tested.
    supporting_text: >-
      Since techniques are currently unavailable to create double mutants in
      Capsaspora, we could not test this possibility through classic genetic epistasis.
