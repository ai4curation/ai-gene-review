    label: cytoskeleton
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN001122925
  review:
    summary: >-
      TreeGrafter transfer from PANTHER node PTN001122925. TreeGrafter places coWts in
      PTHR22988:SF71 "CITRON RHO-INTERACTING KINASE" (family PTHR22988, whose human
      members are ROCK1/2, MRCKs and CIT), not in the LATS clade where human LATS1/2 sit
      (PTHR24356). No localization of coWts has been reported.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The cytoskeletal location is characteristic of the Rho-effector kinases of
      PTHR22988, and reaches coWts because of the family placement rather than
      anything known about Warts/LATS. coWts's MOB-binding region and C-terminal kinase
      domain identify it as a LATS kinase. Animal LATS kinases are cytoplasmic with some
      cortical/centrosomal pools, so an association with cytoskeletal structures cannot
      be ruled out, but there is no evidence for it here. Not removed outright because
      the term is not demonstrably false.
    supported_by:
