core_functions:
- description: >-
    Warts/LATS-family serine/threonine kinase of the Capsaspora Hippo pathway that keeps
    the Yorkie/YAP/TAZ ortholog coYki in the cytoplasm, thereby restraining
    coYki-dependent transcription that otherwise induces a contractile elongated cell
    behaviour and denser cell packing within aggregates. Catalytic activity and coYki
    phosphorylation are inferred from domain conservation and the phenotype of a
    non-phosphorylatable coYki mutant; they have not been measured biochemically.
