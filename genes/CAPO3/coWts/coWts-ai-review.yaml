taxon:
  id: NCBITaxon:595528
  label: Capsaspora owczarzaki (strain ATCC 30864)
description: >-
  coWts (CAOG_00619) is the single Warts/LATS-family (NDR subfamily, AGC group)
  serine/threonine protein kinase of the filasterean amoeba Capsaspora owczarzaki, a
  close unicellular relative of animals. The 1205-residue protein has a long, largely
  disordered N-terminal region, a LATS-type MOB-binding region, a C-terminal kinase
  domain with the conserved ATP-binding lysine and catalytic aspartate, and an AGC
  C-terminal extension carrying a predicted hydrophobic-motif phosphorylation site. In
  Capsaspora it acts in the Hippo pathway upstream of the Yorkie/YAP/TAZ ortholog coYki:
  cells lacking the coWts kinase domain show increased nuclear accumulation of coYki,
  more strongly than cells lacking the upstream kinase coHpo, consistent with
  cytoplasmic retention of coYki by Warts-dependent phosphorylation as in animals,
  although coWts kinase activity and coYki phosphorylation have not been measured
  directly. Loss of coWts does not increase proliferation (it slows growth in shaking
  culture) but produces a subpopulation of elongated cells that undergo a myosin-sensitive
  contractile behaviour, rescued by a coWts transgene, and within
  multicellular aggregates causes denser cell packing, reduced aggregate circularity and
  shorter filopodia. These phenotypes are mimicked by a hyperactive coYki that cannot be
  phosphorylated at its predicted Warts sites and require coYki's TEAD-binding residue,
  indicating that coWts shapes cytoskeletal behaviour and aggregate architecture by
  restraining coYki-dependent transcription.
