      due to coYki activation resulting from a loss of upstream kinase signaling.
  - reference_id: PMID:38517944
    supporting_text: >-
      This result indicates that these phenotypes are mediated by the transcriptional
      activity of coYki.
suggested_questions:
- question: >-
    Does coWts phosphorylate coYki on its HXRXXS motifs in vitro and in cells, and does
    coHpo phosphorylate coWts on its activation-loop and hydrophobic-motif sites?
- question: >-
    Why is the coYki nuclear-localization phenotype stronger in coWts than in coHpo
    mutants - which kinases (e.g. other STE20/MAP4K-like kinases) activate coWts
    independently of coHpo?
- question: >-
    Where is coWts located in Capsaspora cells (cytoplasm, cortex, filopodia, adhesion
    foci), and is it recruited to membranes by Mats/MOB, Kibra or Merlin orthologs?
- question: >-
    Should PANTHER place Warts/LATS orthologs such as coWts and Drosophila wts in
    PTHR24356 with human LATS1/2 rather than in PTHR22988 (Rho-effector kinases), so
    that they inherit the LATS-node IBAs (hippo signaling) instead of the
    ROCK/citron actomyosin terms?
- question: >-
    Which coYki target genes (e.g. the actin-binding and laminin G-domain genes shared
    among the coHpo, coWts and coYki RNA-seq sets) mediate the contractile behaviour and
    cell-packing phenotype?
- question: >-
    What explains the slower growth of coWts mutants in shaking culture - a
    coYki-independent function of coWts, or a viability effect of coYki hyperactivity?
suggested_experiments:
- hypothesis: coWts is an active kinase that phosphorylates coYki at its predicted Warts sites.
  description: >-
    In vitro kinase assay with immunopurified wild-type versus kinase-dead (K740A or
    D834A) coWts on recombinant coYki and coYki 4SA, plus Phos-tag or phospho-specific
    immunoblots of coYki in wild-type and coWts-/- Capsaspora cells.
  experiment_type: biochemical kinase assay
- hypothesis: Kinase activity, not only the protein scaffold, is required for coWts function.
  description: >-
    Complement coWts-/- cells with wild-type versus kinase-dead coWts and score coYki
    nuclear localization, elongated-cell frequency and aggregate cell density.
  experiment_type: genetic complementation
- hypothesis: coWts acts upstream of coYki for all scored phenotypes.
  description: >-
    Construct coWts coYki double mutants (once sequential marker recycling is
    available) or deplete coYki in coWts-/- cells and test whether contractile
    behaviour, cell packing and the filopodial defect are suppressed.
  experiment_type: genetic epistasis
- hypothesis: coWts localizes to the cell cortex or adhesion foci.
  description: >-
    Express fluorescently tagged coWts from its endogenous locus or at low levels and
    image together with Lifeact and membrane (NMM) markers in adherent cells and
    aggregates.
  experiment_type: localization / imaging
