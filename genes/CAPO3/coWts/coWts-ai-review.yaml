      Participation test: Warts/LATS performs a step of the cascade (phosphorylation
      of Yorkie), so it is a participant rather than a regulated target. Comparator check:
      Drosophila wts and human LATS1/LATS2 carry GO:0035329 (experimental and IBA from
      LATS node PTN002390470). coWts received no hippo signaling IEA/IBA only because
      TreeGrafter placed it in PTHR22988 rather than the LATS clade. The IMP rests on
      the pathway readout (coYki nuclear localization) and the 4SA phenocopy. Limits:
      coHpo-to-coWts and coWts-to-coYki phosphorylation were not shown, and coWts
      may also have coHpo-independent activity.
    additional_reference_ids:
