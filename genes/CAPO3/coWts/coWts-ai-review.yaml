  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary paper for coWts; full text cached. Methods name the targeted gene as coWts
      (CAOG_00619); NCBI RefSeq XP_004365490.1 carries locus_tag CAOG_00619 and is
      cross-referenced by UniProt A0A0D2VGR4 (new tag CAOG_000619). Reports knockout,
      coYki localization, proliferation, cell morphology, aggregate and RNA-seq data.
      No biochemical kinase or phosphorylation measurements.
  findings:
  - statement: The coWts kinase domain was deleted from both alleles.
    supporting_text: >-
      For each gene, homologous recombination was used to replace the kinase domain of
      both WT alleles with selectable markers
  - statement: coWts loss increases nuclear coYki, more strongly than coHpo loss.
    supporting_text: >-
      Interestingly, we found that coWts-/- cells were significantly more likely to
      show nuclear mScarlet-coYki localization than coHpo-/- cells (Figure 1D)
