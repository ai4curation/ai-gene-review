- id: PMID:38729842
  title: 'Assembling a Hippo: the evolutionary emergence of an animal developmental
    signaling pathway.'
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Review; summarizes the coWts knockout phenotypes without new data.
  findings:
  - statement: >-
      Deleting coWts does not increase proliferation but increases an
      actomyosin-mediated contractile behaviour.
    supporting_text: >-
      Consistent with this result, targeted deletion of either Capsaspora Hippo (coHpo)
      or Capsaspora Warts (coWts) does not increase cell proliferation, but greatly
      increases the rate of occurrence of an actomyosin-mediated contractile behavior
      displayed by cells [66] (Figure 3A).
