  evidence_type: IMP
  original_reference_id: PMID:38517944
  review:
    summary: >-
      coWts is the Capsaspora Warts/LATS kinase of the Hippo cascade. Its knockout
      releases coYki to the nucleus, and its cytoskeletal and aggregate phenotypes are
      phenocopied by coYki 4SA (predicted Warts sites mutated) in a TEAD-binding-dependent
      manner, matching the canonical Hpo-Wts-Yki-Sd output.
    action: NEW
