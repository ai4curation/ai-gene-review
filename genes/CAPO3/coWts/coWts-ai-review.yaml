- id: PMID:22832104
  title: Premetazoan origin of the hippo signaling pathway.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Identifies the Capsaspora Hippo pathway components including a Wts homolog and
      tests Co-Yki, Co-Sd and Co-Hpo in Drosophila. Capsaspora Wts was aligned but not
