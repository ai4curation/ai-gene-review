  review:
    summary: >-
      Combined IEA (ARBA, InterPro AGC C-terminal domain, EC 2.7.11.1, PANTHER,
      UniRule). coWts is the Capsaspora Warts/LATS ortholog: it has a LATS-type
      MOB-binding region (CDD cd21774), a kinase domain with intact ATP-binding lysine
      and catalytic aspartate, and an AGC C-terminal extension. In animals Warts/LATS
      phosphorylates Yorkie/YAP/TAZ on HXRXXS motifs; coYki carries four such motifs, and
      the non-phosphorylatable coYki 4SA mutant is nuclear and phenocopies the coWts
      knockout [PMID:35659869, PMID:38517944].
    action: ACCEPT
    reason: >-
      This is the core molecular activity of a Warts/LATS kinase and nothing in the
      sequence argues against it. The PANTHER component of this row comes from a node in
      PTHR22988 (Rho-effector kinase family) rather than the LATS clade, but
      serine/threonine kinase activity is shared by both families, so the misplacement
      does not affect this term. Note that no in vitro kinase assay or phosphorylation
      readout (phospho-specific antibody, Phos-tag) has been reported for coWts; the
      activity is inferred from domain conservation and the 4SA genetic mimicry, not
      measured.
    supported_by:
    - reference_id: file:CAPO3/coWts/coWts-uniprot.txt
      supporting_text: CDD; cd21774; MobB_LATS; 1.
    - reference_id: PMID:35659869
      supporting_text: >-
        In mammals and in Drosophila, YAP/TAZ/Yorkie is regulated by cytoplasmic
        sequestration in response to phosphorylation of HXRXXS motifs by the LATS/Warts
        kinases (Zheng and Pan, 2019).
    - reference_id: PMID:38517944
      supporting_text: >-
        These results suggest that the phenotypes observed in coHpo and coWts mutants are
        due to coYki activation resulting from a loss of upstream kinase signaling.
