- term:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000137774
  review:
    summary: >-
      TreeGrafter transfer from the T-box family node. CoBra binds the conserved T-box
      motif [PMID:24043797], occupies regulatory sites in Capsaspora [PMID:27114036],
      and when expressed in Xenopus embryos it activates mesendodermal target genes and
      partly rescues a dominant-negative Brachyury phenotype [PMID:24043797].
    action: ACCEPT
    reason: >-
      This is the core molecular function, consistent with the core function chosen
      for human TBXT. Binding comes from Capsaspora protein and Capsaspora chromatin.
      Transcriptional activation has been shown only heterologously, in Xenopus
      embryos and animal caps, where CoBra acts as a nonselective "pan-T-box"
      activator. A more specific activator term (GO:0001228) is plausible but was not
      demonstrated in Capsaspora, so the general term is kept. The node lies at the
      T-box family root and a sequence-specific DNA-binding transcription factor
      activity fits every member, so the transfer is sound.
    supported_by:
    - reference_id: PMID:24043797
      supporting_text: >-
        Our data show that C. owczarzaki Brachyury ( CoBra ) can partially rescue
        Xenopus laevis embryos injected with a dominant negative XBra construct.
    - reference_id: PMID:24043797
      supporting_text: >-
        The conserved binding motif also helps to explain the ability of CoBra to
        rescue endogenous XBra and to activate several downstream T-box targets in
        Xenopus , but without the specificity of XBra
    - reference_id: PMID:27114036
      supporting_text: >-
        The ATAC-defined Bra regulatory sites were strongly enriched in CoBra compared
        with random motifs (Figure 6G), validating our Bra target prediction approach.
- term:
    id: GO:0001708
    label: cell fate specification
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN000137774
  review:
    summary: >-
      TreeGrafter transfer from PTN000137774, the deep T-box family node that also
      gives human TBXT its IBA for this term. The IBD donors are animal T-box genes
      (fly, worm, zebrafish, mouse), whose fate-specifying roles are embryonic. For
      CoBra, the only fate-related data are heterologous: in Xenopus embryos it partly
      rescues mesoderm and muscle gene expression after dominant-negative XBra, which
      the authors interpret cautiously [PMID:24043797].
    action: REMOVE
    reason: >-
      GO defines cell fate specification as designating a cell to follow a
      developmental path. Capsaspora is unicellular, and no study links CoBra to the
      choice between its temporal life stages; Bra-motif sites are active in both the
      amoeboid and aggregative stages [PMID:27114036]. The Xenopus result shows only
      that the protein can partly substitute for a frog transcription factor in a frog
      embryo. Even there CoBra activated every mesendodermal gene tested, so it lacks
      the target selectivity that lets animal Brachyury specify particular fates
      [PMID:24043797]. The term is formally allowed for all cellular organisms
      (QuickGO only_in_taxon NCBITaxon:131567), so this is not a taxon-constraint
      violation. It is an animal developmental outcome placed at a node that also
      covers the unicellular filasterean and fungal T-box proteins. Human TBXT keeps
      this term (non-core). The propagation is valid for the animal donors but not for
      this target.
    supported_by:
    - reference_id: PMID:24043797
      supporting_text: >-
        Thus, these results should be interpreted with caution; we can only conclude
        that both CoBra and CoTbx3 can roughly mimic endogenous XBra function.
    - reference_id: PMID:24043797
      supporting_text: >-
        both CoBra and CoTbx3 (a member of the Tbx7 class) behave as what we call
        “pan-Tbox” genes, activating all potential targets
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN000137774
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Deep T-box family node whose cell fate specification IBD is seeded by animal
          T-box genes (fly, worm, zebrafish, mouse) with embryonic roles. The node also
          spans unicellular filasterean T-box proteins such as CoBra, for which no
          fate-specifying role has been shown in their own organism.
