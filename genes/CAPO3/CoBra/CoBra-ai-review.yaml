product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:595528
  label: Capsaspora owczarzaki ATCC 30864
description: >-
  CoBra is the Brachyury-class T-box transcription factor of the amoeboid filasterean
  Capsaspora owczarzaki, a unicellular relative of animals whose life cycle has
  filopodial amoeba, aggregative and cystic stages. It is the only Brachyury known
  outside animals. Its single T-box DNA-binding domain keeps most of the DNA-contact
  and dimerization residues of animal T-box proteins. Protein-binding microarrays show
  that it recognizes the same T-box motif as mouse Brachyury (T). In Capsaspora, an
  antibody against CoBra enriches regulatory sites carrying Brachyury motifs. These
  sites lie mostly in first introns and 5' UTRs and are active in the amoeboid and
  aggregative stages. The predicted targets include genes for cell polarity,
  phagocytosis, metabolism and GPCR signalling, and the targets shared with mouse
  Brachyury are enriched for actin-cytoskeleton and cell-motility functions. When
  expressed in Xenopus embryos, CoBra partly rescues a dominant-negative Brachyury
  phenotype, but unlike animal Brachyury it activates every mesendodermal gene tested.
  This lack of target selectivity maps to its N- and C-terminal regions, not to the
  T-box, and the authors attribute it to missing cofactor interactions. No genetic
  loss-of-function data exist in Capsaspora. The identification of UniProt entry
  A0A0D2VUC6 (CAOG_005512, automatically named "TBX19 protein") as the CoBra of the
  published studies is inferred, not stated by those papers. It rests on sequence
  similarity to the T subfamily and on an arginine at the position of Xenopus
  Brachyury Lys149 that the 2013 study reports for CoBra.
