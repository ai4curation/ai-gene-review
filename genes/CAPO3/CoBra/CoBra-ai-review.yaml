core_functions:
- description: >-
    Brachyury-class T-box transcription factor that binds the conserved T-box DNA
    motif and occupies cis-regulatory regions of genes in Capsaspora, mainly at first
    introns and 5' UTRs that are active in the amoeboid and aggregative stages.
    Predicted targets include cell polarity, phagocytosis and motility genes, some
    shared with mouse Brachyury. When expressed in Xenopus embryos it acts as a
    nonselective activator of T-box target genes and lacks the target specificity of
    animal Brachyury. Its role in Capsaspora biology has not been tested genetically.
  molecular_function:
    id: GO:0000981
    label: DNA-binding transcription factor activity, RNA polymerase II-specific
  directly_involved_in:
  - id: GO:0006357
    label: regulation of transcription by RNA polymerase II
