      Our results indicate that CoBra has a highly similar motif to that determined in
      the mouse Bra-homolog, called T
  - reference_id: PMID:27114036
    supporting_text: >-
      The ATAC-defined Bra regulatory sites were strongly enriched in CoBra compared
      with random motifs (Figure 6G), validating our Bra target prediction approach.
  - reference_id: PMID:24043797
    supporting_text: >-
      The conserved binding motif also helps to explain the ability of CoBra to rescue
      endogenous XBra and to activate several downstream T-box targets in Xenopus ,
      but without the specificity of XBra
suggested_questions:
- question: >-
    Is UniProt A0A0D2VUC6 (CAOG_005512) the CoBra cDNA used in the 2013 Xenopus and
    PBM experiments and the antigen of the 2016 anti-CoBra antibody? The papers give
    no locus ID, and the assignment here rests on T-subfamily similarity and the
    arginine at the Xenopus Bra K149 position.
- question: >-
    PANTHER places A0A0D2VUC6 in subfamily PTHR11267:SF181 (OPTOMOTOR-BLIND PROTEIN, a
    Tbx2-class name), while the 2013 phylogeny places CoBra at the base of the
    Brachyury class. Is the subfamily assignment an error?
- question: >-
    Does CoBra activate or repress its predicted targets in Capsaspora, and does it
    regulate the transitions between the amoeboid, aggregative and cystic stages?
- question: >-
    Which cofactors, if any, does CoBra bind in Capsaspora, given that the cofactor
    Smad1 implicated in restricting animal Brachyury targets is absent?
suggested_experiments:
- hypothesis: >-
    CoBra directly activates a cell-polarity and motility gene network in Capsaspora.
  description: >-
    Generate a CoBra knockout or inducible knockdown with the Capsaspora genome-editing
    methods now available, and combine RNA-seq with genome-wide CoBra ChIP-seq or
    CUT&RUN to define direct targets. Score cell motility, filopodia and aggregation.
  experiment_type: genetic loss of function / chromatin profiling
- hypothesis: The anti-CoBra antibody recognizes the CAOG_005512 product.
  description: >-
    Immunoprecipitate with the anti-CoBra antibody followed by mass spectrometry, or
    epitope-tag CAOG_005512 and repeat ChIP-qPCR at the published sites, to confirm
    the locus assignment.
  experiment_type: protein identification
- hypothesis: CoBra is nuclear in all three life stages.
  description: >-
    Immunostain CoBra or image a tagged transgene in filopodial, aggregative and
    cystic cells to test stage-dependent nuclear localization.
  experiment_type: localization / imaging
