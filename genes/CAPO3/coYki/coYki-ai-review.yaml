      is dispensable for the proliferation of Capsaspora cells
suggested_questions:
- question: >-
    Does coYki bind coSd in Capsaspora cells, and which genomic sites does the
    complex occupy? Which of the 1205 coYki-dependent genes are direct targets,
    given that more genes are up-regulated than down-regulated in the knockout?
- question: >-
    Which coYki-regulated genes produce the blebbing and cell-substrate adhesion
    phenotypes? The candidates include the up-regulated actin-binding genes and the
    integrin-beta genes CAOG_05058 and CAOG_01283.
- question: >-
    Is coYki localization regulated by cell density, substrate attachment, or the
    transition into aggregates, as YAP/TAZ localization is regulated by contact and
    mechanics in animal cells?
- question: >-
    The papers number the TEAD-interface phenylalanine of coYki as F123 (aligned with
    YAP1 F95), but in the UniProt model A0A0D2WY30 the YAP1-like LPxSFF motif lies at
    residues 54-59. Is the UniProt gene model N-terminally truncated relative to the
    RACE-checked cDNA used experimentally?
- question: >-
    Does coYki also act at the cell cortex independently of transcription, as reported
    for Drosophila Yorkie? The F123A result argues against this for the 4SA
    phenotypes, but it was not tested for the loss-of-function blebbing phenotype.
suggested_experiments:
- hypothesis: coYki and coSd form a complex at target genes in Capsaspora.
  description: >-
    Endogenously tag coYki (and coSd) by homologous recombination and perform co-IP
    from Capsaspora lysates, plus CUT&RUN or ChIP-seq. Intersect the binding sites with
    the coYki, coHpo and coWts RNA-seq gene sets to define direct targets.
  experiment_type: protein interaction / chromatin profiling
- hypothesis: coYki suppresses blebbing through TEAD-dependent transcription.
  description: >-
    Complement coYki -/- cells with wild-type coYki versus the TEAD-interface mutant
    (F123A, paper numbering) and score bleb frequency, cell-substrate adhesion and
    aggregate circularity.
  experiment_type: genetic complementation
- hypothesis: coYki nuclear localization responds to cell density or aggregation.
  description: >-
    Image a stably expressed, low-level tagged coYki (or use an antibody against the
    endogenous protein) in sparse versus confluent adherent cells and in aggregates,
    and quantify the nuclear/cytoplasmic ratio. Compare with coHpo and coWts mutants.
  experiment_type: localization / imaging
