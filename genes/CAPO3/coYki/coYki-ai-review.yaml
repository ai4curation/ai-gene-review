  review:
    summary: >-
      TreeGrafter transfer from the PANTHER YAP1/Yorkie family node
      (PTHR17616:SF8, "TRANSCRIPTIONAL COACTIVATOR YORKIE"). Supported directly for the
      Capsaspora protein by heterologous assays: coYki and coSd co-immunoprecipitate
      and together activate a Hippo-responsive diap1 enhancer (HRE) luciferase
      reporter in Drosophila S2R+ cells and the endogenous targets Diap1 and Ex in the
      fly eye [PMID:22832104]. In Capsaspora, the phenotypes of hyperactive coYki 4SA
      are abolished by mutating the residue aligned with YAP1 F95, which YAP needs to
      bind TEAD, so they depend on transcriptional activity [PMID:38517944].
    action: ACCEPT
    reason: >-
      The GO definition (activating transcription of specific genes by binding a
      DNA-binding transcription factor) matches what was shown: coYki binds the
      DNA-binding transcription factor coSd and the pair activates a target enhancer,
      and coYki alone does not activate transcription in the fly eye. The cross-species
      reporter result shows the activity of the Capsaspora protein. The
      TEAD-interface mutant then shows that the activity is used in Capsaspora itself.
      This is the core molecular function of coYki. It is a biochemical activity, not
      an animal-specific process, so placing it at the holozoan-level PANTHER node is
      phylogenetically sound.
    supported_by:
    - reference_id: PMID:22832104
      supporting_text: >-
        co-expression of Co-Sd and Co-Yki stimulated the transcription of the
        HRE-luciferase reporter in Drosophila S2R+ cells
    - reference_id: PMID:22832104
      supporting_text: >-
        these data demonstrate the ability of Co-Sd and Co-Yki to form a functional
        transcription factor complex with striking specificity to activate similar
        target genes as its Drosophila counterpart
    - reference_id: PMID:38517944
      supporting_text: >-
        This result indicates that these phenotypes are mediated by the transcriptional
        activity of coYki.
