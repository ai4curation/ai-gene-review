- id: PMID:35659869
  title: Genome editing in the unicellular holozoan Capsaspora owczarzaki suggests a
    premetazoan role for the Hippo pathway in multicellular morphogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary coYki paper; full text cached. The key resources table identifies coYki
      as GenBank CAOG_07866, which matches the UniProt ORF name CAOG_007866
      (A0A0D2WY30). Reports the knockout, rescue, localization, blebbistatin and
      RNA-seq data.
  findings:
  - statement: coYki is dispensable for cell proliferation in Capsaspora.
    supporting_text: >-
      we observed no significant difference in cell proliferation between WT and
      coYki -/- cells in either condition
  - statement: coYki -/- aggregates are flatter and less circular but of normal size.
    supporting_text: >-
      Computational analysis of aggregate morphology and size revealed that WT and
      coYki -/- aggregate size was not significantly different
  - statement: >-
      coYki -/- cells form excessive actin-depleted blebs. The phenotype is rescued by
      a coYki transgene and suppressed by blebbistatin.
    supporting_text: >-
      These results suggest that the protrusions observed in coYki -/- cells are
      actin-depleted blebs
  - statement: >-
      Tagged coYki is cytoplasm-enriched in wild-type cells. Mutating its HXRXXS motifs
      (4SA) shifts it into the nucleus.
    supporting_text: >-
      These results show that HXRXXS motifs affect the subcellular localization of
      coYki and suggest that, like in animals, phosphorylation of coYki by Hippo
      signaling leads to cytoplasmic sequestration.
  - statement: >-
      coYki loss alters the expression of 1205 genes, with actin-binding genes enriched
      among up-regulated genes and no proliferation or cell-cycle enrichment.
    supporting_text: >-
      no enrichment was detected in functional categories of cell proliferation or the
      cell cycle
- id: PMID:38517944
  title: The Hippo kinase cascade regulates a contractile cell behavior and cell density
    in a close unicellular relative of animals.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Shows that coHpo and coWts control coYki localization in
      Capsaspora. Uses a hyperactive coYki 4SA transgene and a TEAD-interface (F123A)
      mutant. The residue numbering differs from the UniProt model (see suggested
      questions).
  findings:
  - statement: Loss of coHpo or coWts increases nuclear localization of coYki.
    supporting_text: >-
      Together, these results show that the Capsaspora Hippo kinase cascade regulates
      coYki by cytoplasmic sequestration
  - statement: >-
      Hyperactive coYki 4SA phenocopies the kinase mutants (increased aggregate cell
      packing, elongated cells).
    supporting_text: >-
      stable transgenic expression of coYki 4SA resulted in increased cell packing of
      Capsaspora aggregates
  - statement: The 4SA phenotypes require the TEAD-interface residue (F123A abolishes them).
    supporting_text: >-
      This result indicates that these phenotypes are mediated by the transcriptional
      activity of coYki.
- id: PMID:22832104
  title: Premetazoan origin of the hippo signaling pathway.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Identifies Co-Yki and tests it in Drosophila: eye
      overexpression with Co-Sd, co-IP and HRE-luciferase in S2R+ cells, and
      phosphorylation by Co-Hpo. Its claims of growth-promoting activity rest on fly
      tissue and were not borne out in Capsaspora (PMID:35659869).
  findings:
  - statement: Co-Yki alone does not drive fly eye overgrowth, but Co-Yki plus Co-Sd does.
    supporting_text: >-
      co-expression of Co-Yki and Co-Sd (GMR>Co-Sd+Co-Yki) resulted in massive tissue
      overgrowth resembling that caused by co-expression of their Drosophila
      counterparts
  - statement: Co-Yki and Co-Sd co-immunoprecipitate and activate an HRE reporter.
    supporting_text: >-
      epitope-tagged Co-Sd and Co-Yki immunoprecipitated with each other in
      Drosophila S2R+ cells
  - statement: Co-Hpo induces Co-Yki phosphorylation and inhibits Co-Sd/Co-Yki activity.
    supporting_text: >-
      Co-Hpo significantly inhibited Co-Sd/Co-Yki-mediated activation of the diap1
      HRE-luciferase reporter in S2R+ cells
