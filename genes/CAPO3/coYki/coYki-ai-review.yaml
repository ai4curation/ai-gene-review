  review:
    summary: >-
      Combined ARBA, subcellular-location and TreeGrafter inference. In Capsaspora,
      mScarlet-coYki is depleted from the nucleus in wild-type cells but is nuclear
      at or above cytoplasmic levels in most cells lacking coHpo or coWts, and when
      its four HXRXXS motifs are mutated (4SA) [PMID:35659869, PMID:38517944].
    action: ACCEPT
    reason: >-
      A coactivator must enter the nucleus to act, and the data show that coYki does
      so, under kinase control. The nucleus is where coYki carries out its function,
      even though at steady state in wild-type adherent cells most of the protein is
      cytoplasmic. Accepted. The supporting observations are of transiently expressed
      fusion proteins, not endogenous protein.
    supported_by:
