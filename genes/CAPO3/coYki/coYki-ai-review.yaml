      [PMID:38517944].
    action: ACCEPT
    reason: >-
      This process follows directly from the coactivator activity. coYki does part of
      the work by bringing activation capacity to the TEAD-family factor coSd: coSd
      alone does not drive the targets, and the complex does. The Capsaspora RNA-seq
      shows coYki-dependent gene expression in vivo, but cannot separate direct from
      indirect targets, and more genes go up than down in the mutant. The endogenous
      genes that coYki activates directly in Capsaspora are not yet known (no ChIP or
      CUT&RUN). The annotation stands on the heterologous reporter data and the
      transcription-dependence of the hyperactive allele.
    supported_by:
    - reference_id: PMID:22832104
      supporting_text: >-
        Third instar eye imaginal discs of GMR>Co-Sd+Co-Yki animals showed a marked
        upregulation of Diap1 and Ex staining posterior to the morphogenetic furrow
    - reference_id: PMID:35659869
      supporting_text: >-
        This analysis revealed 1205 differentially expressed genes, including 397
        downregulated
    - reference_id: PMID:38517944
      supporting_text: >-
        in contrast to coYki 4SA, the expression of a coYki 4SA F123A mutant did not
        affect cell or aggregate morphology
- term:
    id: GO:0140297
    label: DNA-binding transcription factor binding
  evidence_type: IPI
  original_reference_id: PMID:22832104
  review:
    summary: >-
      Epitope-tagged coYki (HA-CoYki) and coSd (FLAG-CoSd), the Capsaspora
      Scalloped/TEAD ortholog, co-immunoprecipitate when expressed in Drosophila S2R+
      cells [PMID:22832104]. The two proteins also act together in vivo: coYki drives
      eye overgrowth with coSd but not with Drosophila Sd. In Capsaspora, mutating the
      coYki residue aligned with the TEAD-binding residue F95 of YAP1 abolishes the
      activity of hyperactive coYki [PMID:38517944].
    action: NEW
    reason: >-
      GOA has no experimental annotation for this protein. The co-IP is a direct
      interaction assay between two proteins from the same species, so IPI with coSd
      is the right evidence type. Binding to a DNA-binding transcription factor is
      also how coYki carries out its coactivator activity, and the residue-level
      mutant data in Capsaspora support the same interface. The more specific
      functional term is already captured by transcription coactivator activity. This
      binding term records the evidence, and is used instead of the uninformative
      "protein binding". The assay used heterologous (fly) cells and overexpressed
      tagged proteins, and the complex has not yet been isolated from Capsaspora.
    supported_by:
    - reference_id: PMID:22832104
      supporting_text: >-
        epitope-tagged Co-Sd and Co-Yki immunoprecipitated with each other in
        Drosophila S2R+ cells (Figure 4A), demonstrating their ability to form a
        protein complex
    - reference_id: PMID:22832104
      supporting_text: >-
        For immunoprecipitation, HA-CoYki and FLAG-CoSd were constructed in the
        pAc5.1/V5-HisB vector
    - reference_id: PMID:38729842
      supporting_text: >-
        coYki and the single Capsaspora Sd/TEAD ortholog (coSd) can bind each other,
        showing deep conservation of this heterodimer
core_functions:
- description: >-
    Hippo-pathway-regulated transcriptional coactivator that partners with the
    Scalloped/TEAD ortholog coSd. The Hippo (coHpo) and Warts (coWts) kinases keep
    coYki in the cytoplasm through its HXRXXS motifs. When released into the nucleus,
    coYki activates TEAD-dependent target genes. In Capsaspora this transcriptional
    program controls cortical actomyosin behaviour (suppressing membrane blebbing),
    adhesion to the substrate, and the three-dimensional shape and cell packing of
    multicellular aggregates, but not cell proliferation. Coactivator activity and
    binding to coSd were shown in Drosophila cells and tissue. In Capsaspora, the
    activity is supported genetically: hyperactive coYki needs its TEAD-binding
    interface to act. The directly regulated target genes are not known.
