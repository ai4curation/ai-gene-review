- term:
    id: GO:0035329
    label: hippo signaling
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001446770
  review:
    summary: >-
      TreeGrafter transfer from the Yorkie family node. GO defines hippo signaling as
      the cascade in which Hippo phosphorylates LATS/Warts, which in turn phosphorylates
      YAP1/Yki, causing its cytosolic retention. In Capsaspora this cascade has been
      shown genetically. Deleting coHpo or coWts makes coYki nuclear. The 4SA mutant
      also becomes nuclear, and a stable 4SA transgene reproduces the cell-packing and
      cell-elongation phenotypes of the kinase mutants [PMID:38517944]. In Drosophila
      cells, coHpo induces coYki phosphorylation, which coexpressed Wts enhances
      [PMID:22832104].
    action: ACCEPT
    reason: >-
      Here the IEA is borne out experimentally in the organism itself. The term names
      the Yorkie/YAP effector in its definition, and it is not restricted to animals or
      tied to growth control. Its parents are signal-transduction terms, not
      multicellular or developmental processes. It is therefore not a
      TAXON_CONSTRAINT_VIOLATION of the kind the propagation audit looks for. Comparator
      check: human YAP1 (P46937) and Drosophila yki (Q45VV3) both carry GO:0035329 by
      experimental evidence (IDA/IMP), so annotating the terminal effector is
      established practice. coYki takes part in the cascade: it is the phosphorylated
      target whose localization and activity carry the signal, and the phenotypes of
      the kinase mutants are reproduced by hyperactive coYki. What the pathway
      regulates in Capsaspora differs from animals (cytoskeleton and aggregate cell
      packing, not proliferation). That does not affect this signaling-cascade term.
    supported_by:
    - reference_id: PMID:38517944
      supporting_text: >-
        Together, these results show that the Capsaspora Hippo kinase cascade
        regulates coYki by cytoplasmic sequestration, indicating a premetazoan origin of
        this regulatory activity of the Hippo pathway.
    - reference_id: PMID:38517944
      supporting_text: >-
        These results suggest that the phenotypes observed in coHpo and coWts mutants
        are due to coYki activation resulting from a loss of upstream kinase signaling.
    - reference_id: PMID:22832104
      supporting_text: >-
        expression of Co-Hpo induced phosphorylation of Co-Yki in S2R+ cells, and this
        phosphorylation was further enhanced by co-expression of Dm-Wts
