description: >-
  coYki (CAOG_07866) is the single Yorkie/YAP/TAZ ortholog of the amoeboid filasterean
  Capsaspora owczarzaki, a close unicellular relative of animals that can form
  calcium-dependent multicellular aggregates. The protein carries the hallmarks of the
  animal Hippo-pathway transcriptional coactivators: an N-terminal TEAD-binding region,
  four HXRXXS Warts/LATS phosphorylation motifs (three aligned with sites in YAP and
  Yorkie) and two WW domains. Expressed in Drosophila together with the Capsaspora
  Scalloped/TEAD ortholog (coSd), coYki co-immunoprecipitates with coSd, activates a
  Hippo-responsive diap1 enhancer reporter and endogenous Diap1 and Expanded, and drives
  eye overgrowth, and the Capsaspora Hippo kinase (coHpo) promotes its phosphorylation
  and inhibits its activity. In Capsaspora cells, tagged coYki is mostly cytoplasmic;
  it becomes nuclear when its phosphorylation motifs are mutated or when the Hippo
  (coHpo) or Warts (coWts) kinase is deleted, so the kinase cascade regulates it by
  cytoplasmic sequestration as in animals. Unlike its animal counterparts, coYki is
  not needed for cell proliferation. Instead, cells lacking it show excessive
  actin-depleted membrane blebbing, increased adhesion to the substrate, and flattened,
  less circular aggregates, and about 1,200 genes change expression, with genes for
  actin-binding proteins enriched among those up-regulated. A non-phosphorylatable,
  hyperactive coYki increases cell packing in aggregates and elongates adherent cells.
  This effect requires a conserved residue of the TEAD-binding interface, so coYki
  shapes cell and aggregate morphology by acting as a transcriptional coactivator.
