  review:
    summary: >-
      TreeGrafter transfer. Paired with coSd, coYki activates transcription of an
      RNA polymerase II-transcribed Hippo-responsive reporter and of the endogenous
      genes Diap1 and Ex in Drosophila [PMID:22832104]. In Capsaspora, coYki loss
