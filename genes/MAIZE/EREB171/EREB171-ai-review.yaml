core_functions:
- description: >-
    Nuclear AP2-subfamily transcription factor that binds the cis-regulatory regions of
    target genes, including the cell-wall genes ZmEXO1 and ZmXTH14, through its AP2/ERF
    domain. It acts with the GRAS co-regulator CT3, which increases its DNA affinity and
    transcriptional activity, to regulate gene expression for cell expansion and cell-wall
    integrity in internodes and leaves.
