suggested_questions:
- question: Does DIL1 alone activate or repress ZmEXO1 and ZmXTH14, and which DNA motif does
    its AP2 domain recognise (GCC-box, AW-box or another element)?
- question: Is DIL1 the one-to-one ortholog of rice SMOS1, and does the degenerate second
    AP2-like repeat contribute to DNA binding?
- question: Does the CT3 interaction require the DIL1 AP2 domain, and is the DIL1-CT3
    complex regulated by auxin or brassinosteroid as in rice?
suggested_experiments:
- description: Transactivation assays (protoplast dual-luciferase) of DIL1 alone and with
    CT3 on ZmEXO1 and ZmXTH14 promoters, with promoter-motif mutants, to establish the
    direction of regulation and the binding element.
  experiment_type: reporter assay
- description: DIL1 ChIP-seq or DAP-seq in wild-type and ct3 backgrounds to define direct
    targets and the effect of CT3 on DIL1 occupancy.
  experiment_type: ChIP-seq
