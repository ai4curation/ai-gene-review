  - reference_id: PMID:39928526
    supporting_text: direct binding of DIL1 to 2 cell wall-related genes, ZmEXO1 and ZmXTH14
  - reference_id: PMID:22649507
    supporting_text: Identification of mutations within the same candidate gene in two
      independent mutant alleles confirms that DIL1 encodes the AP2 transcription
      factor-like gene.
- description: >-
