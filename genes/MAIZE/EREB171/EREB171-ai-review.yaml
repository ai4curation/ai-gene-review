- term:
    id: GO:0006351
    label: DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: involved_in
  supporting_entities:
  - UniRule:UR000400199
  review:
    summary: >-
      UniRule-based annotation to the transcription process itself.
    action: MODIFY
    reason: >-
      DIL1 is a sequence-specific transcription factor. It regulates which genes are
      transcribed, for example by binding ZmEXO1 and ZmXTH14 [PMID:39928526], but it is not
      part of the RNA polymerase machinery that carries out DNA-templated transcription.
      GO practice annotates DNA-binding transcription factors to regulation of
      transcription, so the row is moved laterally to GO:0006355, which this gene already
      carries by IBA and IEA. Recorded as a rule-level term choice in source_defects.
    proposed_replacement_terms:
    - id: GO:0006355
      label: regulation of DNA-templated transcription
    supported_by:
    - reference_id: PMID:39928526
      supporting_text: CT3 functions as a co-regulator to enhance the DNA affinity and
        transcriptional activity of DIL1
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0006351
      corrected_value: GO:0006355
      corrected_label: regulation of DNA-templated transcription
      confidence: PROBABLE
      explanation: >-
        UniRule UR000400199 maps AP2/ERF transcription factors to GO:0006351
        DNA-templated transcription. A sequence-specific DNA-binding transcription factor
        regulates transcription rather than performing it; the rule should map to
        GO:0006355 (which it already also assigns via GO_REF:0000120) and drop GO:0006351.
