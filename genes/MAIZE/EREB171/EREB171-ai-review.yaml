id: B4FT20
gene_symbol: EREB171
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  EREB171, also called DWARF AND IRREGULAR LEAF1 (DIL1) or ZmAP2-5, is a 412-residue
  AP2-subfamily member of the AP2/ERF family of plant transcription factors. It has one
  canonical AP2/ERF DNA-binding domain followed by a degenerate second AP2-like repeat, and
  falls in the same PANTHER subfamily as rice SMALL ORGAN SIZE1 (SMOS1). DIL1 is a nuclear
  sequence-specific DNA-binding transcription factor. It binds directly to the regulatory
  regions of cell-wall genes such as ZmEXO1 and ZmXTH14. It forms a complex with the GRAS
  protein COMPACT PLANT 3 (CT3), which increases its DNA affinity and transcriptional
  activity, matching the rice SMOS1-SMOS2/DLT pairing. The gene is expressed at low levels in
  many tissues, including leaf primordia and the P0 region of the shoot meristem. Splice-site
  mutations that remove exons within the AP2 domain shorten internodes and give shorter,
  wider, wrinkled, more upright leaves with irregular, smaller cells and weakened cell walls.
  DIL1 therefore acts in a transcriptional pathway that controls cell expansion and plant
  architecture.
