      DIL1 carries an intact AP2/ERF DNA-binding domain and sits inside the AP2-subfamily
      clade that inherited the function. Maize DIL1 itself binds directly to the
      cell-wall genes ZmEXO1 and ZmXTH14 [PMID:39928526], and rice SMOS1, in the same
