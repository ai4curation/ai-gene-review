- id: PMID:22649507
  title: Mutations in an AP2 transcription factor-like gene affect internode length
    and leaf shape in maize.
  findings:
  - statement: Positional cloning identifies DIL1 as the AP2 gene of cDNA EU966890, encoding
      a 412-residue protein; this is the B4FT20 sequence.
    supporting_text: Only one low copy annotated gene with corresponding EST, an AP2
      transcription factor-like gene, was identified within this interval (GeneBank
      EU966890.1).
  - statement: Both dil1 alleles are splice-site mutations that skip exons inside the AP2
      domain.
    supporting_text: Since both exons 3 and 4 are within the AP2 domain, deletions of exons
      3 and/or 4 would presumably affect the function of the AP2 protein.
  - statement: DIL1 transcripts accumulate in leaf primordia and the P0 region of the
      meristem.
    supporting_text: DIL1 transcripts accumulate in the leaf primordia and also the P0
      region of the meristem
  - statement: The molecular mechanism was unknown at the time of this study.
    supporting_text: The molecular mechanism of DIL1 regulation in stalk and leaf development
      is unknown.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Gene identity confirmed through EMBL EU966890 (ACG39008.1),
      which is cross-referenced in the B4FT20 entry; 412 aa matches. Phenotype and
      expression only; no protein-level assays.
- id: PMID:39928526
  title: Maize COMPACT PLANT 3 regulates plant architecture and facilitates high-density
    planting.
  findings:
  - statement: The GRAS protein CT3 forms a complex with DIL1, increases its DNA affinity
      and transcriptional activity, and the two share many targets; DIL1 binds ZmEXO1 and
      ZmXTH14 directly.
    supporting_text: CT3 functions as a co-regulator to enhance the DNA affinity and
      transcriptional activity of DIL1
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only (PMC full text not retrievable), so the
      binding and transactivation assays could not be inspected directly.
- id: PMID:24486766
  title: A novel AP2-type transcription factor, SMALL ORGAN SIZE1, controls organ size
    downstream of an auxin signaling pathway.
  findings:
  - statement: Rice SMOS1, in the same PANTHER subfamily as DIL1, is nuclear and binds the
      OsPHI-1 regulatory region.
    supporting_text: a functional fluorophore-tagged SMOS1 was localized to the nucleus
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Rice relative, abstract only; used for family-level transfer of nuclear
      localization and DNA binding.
- id: PMID:28069545
  title: SMALL ORGAN SIZE 1 and SMALL ORGAN SIZE 2/DWARF AND LOW-TILLERING Form a Complex
    to Integrate Auxin and Brassinosteroid Signaling in Rice.
  findings:
  - statement: Rice SMOS1 and the GRAS protein SMOS2/DLT cooperatively enhance
      transactivation, paralleling maize DIL1-CT3.
    supporting_text: SMOS1 and SMOS2/DLT physically interact to cooperatively enhance
      transcriptional transactivation activity in yeast and in rice nuclei
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Rice relative, abstract only.
