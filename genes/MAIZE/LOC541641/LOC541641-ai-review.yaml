  review:
    summary: >-
      Propagated from Arabidopsis cytokinin receptor mutant germination phenotypes; a
      pleiotropic downstream outcome of cytokinin signalling with no evidence for ZmHK2.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The donors (AHK2, AHK3, AHK4) carry this term from receptor mutant phenotypes
      (faster, light-independent germination of multiple mutants), i.e. an indirect
      physiological output of loss of cytokinin signalling. No germination data exist for
      ZmHK2 in maize; the only heterologous study reports reduced seed size, not altered
      germination, for ZmHK2 overexpression in Arabidopsis [PMID:24585212]. Propagating a
      phenotype-level developmental process across the monocot-dicot split to every
      cytokinin receptor goes beyond what ZmHK2 is known to do; its role is captured by the
      cytokinin-activated signaling pathway.
    supported_by:
    - reference_id: PMID:24585212
