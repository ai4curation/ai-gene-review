- id: PMID:15064375
  title: Molecular characterization of cytokinin-responsive histidine kinases in maize.
    Differential ligand preferences and response to cis-zeatin.
  findings:
  - statement: ZmHK2 (1,007 aa) is the maize orthologue of AHK3.
    supporting_text: The longest cDNA clones of ZmHK1 and ZmHK2 contained reading frames of
      974 and 1,007 amino acids, respectively.
  - statement: ZmHK2 confers cytokinin-dependent cps::lacZ induction on an E. coli rcsC mutant;
      tZ and tZR are the most effective ligands.
    supporting_text: On the other hand, in ZmHK2 -expressing E. coli , tZ and tZ riboside
      (tZR) activated lacZ expression most strongly
  - statement: ZmHK2 is the predominant receptor transcript in leaf blades.
    supporting_text: The accumulation of the ZmHK2 transcript in leaf blades was 4- and 13-fold
      larger than that of ZmHK1 and ZmHK3a
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC419839). Primary cloning and functional complementation
      paper for ZmHK2 (GenBank AB102956).
- id: PMID:21778179
  title: Ligand-binding properties and subcellular localization of maize cytokinin receptors.
  findings:
  - statement: Direct [3H]tZ binding to ZmHK2 in bacterial spheroplasts; highest affinity of
      the maize receptors for most cytokinins and uniquely high affinity for dihydrozeatin.
    supporting_text: ZmHK2 demonstrated the highest affinities to almost all the cytokinins
      tested, including DZ
  - statement: Leaf microsomal cytokinin binding is dominated by ZmHK2 and is mostly endomembrane,
      with a denser binding in the plasma membrane-enriched fraction.
    supporting_text: leaf microsomes seemed greatly enriched with ZmHK2
  - statement: ZmHK2 itself was not localized; the antibody used recognises ZmHK1 only.
    supporting_text: The mAB reacted with ZmHK1, but not with ZmHK2 and ZmHK3a
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC3193018). ZmHK2 identity with A0A1D6N2S4 confirmed by the
      cloning primer (MTVTA start) and the Ala695-Gln1007 fragment boundary.
- id: PMID:21709172
  title: The cytokinin receptors of Arabidopsis are located mainly to the endoplasmic reticulum.
  findings:
  - statement: Arabidopsis AHK2, AHK3 and AHK4 are localized mainly to the ER.
    supporting_text: Cytokinin-binding assays, fluorescent fusion proteins, and biochemical
      fractionation all showed that the large majority of cytokinin receptors are localized
      to the ER
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only in cache; orthologue (AHK3) localization evidence.
- id: PMID:29355964
  title: 'Cytokinin signaling: from the ER or from the PM? That is the question!'
  findings:
  - statement: Review concluding the ER is the predominant but not exclusive site of cytokinin
      perception.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only in cache; background review.
- id: PMID:32291033
  title: Studies of cytokinin receptor-phosphotransmitter interaction provide evidences for
    the initiation of cytokinin signalling in the endoplasmic reticulum.
  findings:
  - statement: AHK3 has its catalytic part in the cytoplasm and hormone-binding module in the
      ER lumen; ER fractions carry cytokinin-dependent phosphotransfer activity.
    supporting_text: the catalytic part of AHK3 was located in the cytoplasm whereas the hormone
      binding module faced the ER lumen
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only in cache; orthologue topology, background.
- id: PMID:24585212
  title: Expression and functional analysis of genes encoding cytokinin receptor-like histidine
    kinase in maize (Zea mays L.).
  findings:
  - statement: Overexpression of ZmHK2 in Arabidopsis reduced seed size and up-regulated ARR5.
    supporting_text: seed size of ZmHK1-OX, ZmHK1a2-OX, ZmHK2-OX, ZmHK3b-OX and ZmHK2a2-OX was
      obviously reduced as compared to wild type
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Heterologous overexpression phenotypes; not used to add
      developmental process terms.
