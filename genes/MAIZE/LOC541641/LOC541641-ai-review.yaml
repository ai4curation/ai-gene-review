- term:
    id: GO:0019955
    label: cytokine binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028712
  review:
    summary: >-
      Wrong term: ZmHK2 binds cytokinins (adenine-derived plant hormones), not cytokines
      (animal signalling proteins).
    action: REMOVE
    reason: >-
      Cytokines are animal immune signalling proteins (GO:0019955 is a child of protein
      binding); plants have none. ZmHK2 binds cytokinins such as trans-zeatin,
      isopentenyladenine and dihydrozeatin [PMID:21778179]. The ARBA rule maps CHASE-domain
      cytokinin receptors to the wrong term; the correct claim, GO:0044373 cytokinin
      binding, is added as a NEW IDA row.
    supported_by:
    - reference_id: PMID:21778179
      supporting_text: ZmHK2 demonstrated the highest affinities to almost all the cytokinins
        tested, including DZ
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: ARBA:ARBA00028712
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0019955
      corrected_value: GO:0044373
      corrected_label: cytokinin binding
      confidence: CONFIRMED
      explanation: >-
        ARBA00028712 assigns GO:0019955 cytokine binding to the plant cytokinin receptor
        ZmHK2 (A0A1D6N2S4). Cytokines are animal signalling proteins; the ligands of
        CHASE-domain histidine kinases are cytokinins, for which the correct term is
        GO:0044373 cytokinin binding. The rule output should be repointed or removed.
      supported_by:
      - reference_id: PMID:21778179
        supporting_text: ZmHK2 demonstrated the highest affinities to almost all the cytokinins
          tested, including DZ
    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:A0A1D6N2S4
      slot: CC FUNCTION
      requested_change: CHECK
      asserted_value: ARBA:ARBA00002427
      confidence: PROBABLE
      explanation: >-
        The ARBA-assigned FUNCTION comment says the receptor "transmits the stress signal to
        a downstream MAPK cascade". That wording derives from osmosensing histidine kinases
        (AHK1-type); no study reports a MAPK cascade downstream of ZmHK2, which signals by a
        His-Asp phosphorelay. The rule should exclude CHASE-domain cytokinin receptors.
