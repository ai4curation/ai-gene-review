      Sensor histidine kinase activity that autophosphorylates on His and feeds a
      two-component phosphorelay; inherited from the ancestral hybrid histidine kinase node
      and confirmed for ZmHK2 by functional replacement of the E. coli RcsC sensor.
    action: ACCEPT
