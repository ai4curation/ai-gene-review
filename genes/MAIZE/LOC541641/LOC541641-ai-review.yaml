core_functions:
- description: >-
    Membrane-resident cytokinin receptor histidine kinase. The CHASE input domain binds
    free-base cytokinins (tZ, iP > cZ; uniquely high dihydrozeatin affinity) with high
    affinity, activating autophosphorylation of the HisKA domain and phosphotransfer via the
    receiver domain into a His-Asp phosphorelay; the predominant cytokinin receptor of maize
    leaves.
  molecular_function:
    id: GO:0009885
    label: transmembrane histidine kinase cytokinin receptor activity
  directly_involved_in:
  - id: GO:0009736
    label: cytokinin-activated signaling pathway
  - id: GO:0000160
    label: phosphorelay signal transduction system
  locations:
  - id: GO:0012505
    label: endomembrane system
  supported_by:
  - reference_id: PMID:15064375
    supporting_text: On the other hand, in ZmHK2 -expressing E. coli , tZ and tZ riboside
      (tZR) activated lacZ expression most strongly
  - reference_id: PMID:21778179
    supporting_text: ZmHK2 demonstrated the highest affinities to almost all the cytokinins
      tested, including DZ
  - reference_id: PMID:21778179
    supporting_text: it was estimated that no less than 90% and 80% of the total amount of
      [3H]tZ specific binding was attributed to endomembrane fractions from roots and leaves,
      respectively.
suggested_questions:
- question: Is ZmHK2 located mainly in the ER membrane, like ZmHK1 and AHK3, or does it have
    a larger plasma membrane pool in leaves, as the denser tZ binding in leaf plasma
    membrane-enriched fractions might suggest?
- question: Which maize histidine phosphotransfer proteins and response regulators receive
    phosphoryl groups from ZmHK2 in planta, and does its high dihydrozeatin affinity give it a
    distinct physiological role in leaves?
suggested_experiments:
- description: Localize ZmHK2 directly (ZmHK2-specific antibody or fluorescent fusion with ER
    and plasma membrane markers, plus Mg2+-shift density gradients) in maize leaf and root
    cells.
  experiment_type: cell biology
- description: Generate zmhk2 loss-of-function alleles (CRISPR), alone and with zmhk1 and
    zmhk3a, and measure cytokinin induction of type-A ZmRR genes in leaves and roots to define
    the contribution of ZmHK2 to cytokinin perception.
  experiment_type: genetics
