  review:
    summary: >-
      Endomembrane location is supported for maize cytokinin binding sites and for the
      orthologue AHK3; the ER membrane is likely but not directly shown for ZmHK2.
    action: ACCEPT
    reason: >-
      ZmHK2 is a two-pass membrane protein (Phobius), and in maize leaves, where ZmHK2
