  review:
    summary: >-
      A plasma membrane pool of ZmHK2 is plausible, particularly in leaves, but the
      predominant site of plant cytokinin receptors is the ER membrane.
    action: KEEP_AS_NON_CORE
    reason: >-
      The IBA node is seeded largely by bacterial sensor kinases (plasma membrane) and by
      AHK3 (AT1G27320), the Arabidopsis orthologue of ZmHK2, which has been reported at
      both the plasma membrane and, predominantly, the ER [PMID:21709172, PMID:29355964].
      ZmHK2 itself has not been localized directly, but in maize leaves, whose microsomal
      cytokinin binding sites are dominated by ZmHK2, the plasma membrane-enriched fraction
      bound about 3.5-fold more trans-zeatin per mg protein than the ER-enriched fraction,
      although after correction for membrane abundance most binding was endomembrane
      [PMID:21778179]. A plasma membrane location is therefore credible but minor, and not
      where the core activity is shown to occur.
    supported_by:
