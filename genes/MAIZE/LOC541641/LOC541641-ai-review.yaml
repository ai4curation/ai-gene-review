id: A0A1D6N2S4
gene_symbol: LOC541641
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  LOC541641 encodes ZmHK2 (Zea mays histidine kinase 2), a cytokinin receptor of the
  AHK3 subfamily of plant CHASE-domain sensor histidine kinases. The 1,007-residue protein
  has two transmembrane helices enclosing an extracytoplasmic (or ER-luminal) CHASE
  cytokinin-binding domain, followed by a cytoplasmic histidine kinase domain (predicted
  phospho-His432), a receiver-like domain and a C-terminal receiver domain (predicted
  phospho-Asp914). ZmHK2 binds free-base cytokinins with high affinity, preferring
  trans-zeatin and isopentenyladenine over cis-zeatin, and is the only maize receptor
  with high affinity for dihydrozeatin; it also responds to trans-zeatin riboside in a
  bacterial reporter assay. Cytokinin binding activates its kinase and initiates a His-Asp
  phosphorelay through histidine phosphotransfer proteins to response regulators. ZmHK2 is
  the predominant cytokinin receptor transcript in maize leaf blades and is expressed in
  roots at levels similar to ZmHK1. Its subcellular location has not been determined
  directly; by analogy with its Arabidopsis orthologue AHK3 and from maize membrane
  fractionation it is expected to reside mainly in endomembranes (ER), with a possible
  plasma membrane pool in leaves.
