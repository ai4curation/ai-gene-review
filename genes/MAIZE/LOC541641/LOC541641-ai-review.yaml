      receptor term) is not a descendant of GO:0000155 (checked with runoak ancestors), so
      this term adds the phosphorelay-sensor aspect and is not redundant. The is_a ancestors of
      GO:0009885 include GO:0004673 protein histidine kinase activity and GO:0004672 protein
      kinase activity, but not GO:0000155.
