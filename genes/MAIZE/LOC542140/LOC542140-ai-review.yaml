  review:
    summary: The PAINT node PTN000503382 is seeded only by fungal OPT/Isp4 oligopeptide and
      glutathione transporters. ZmGT1 sits in the plant OPT3 clade, and the characterised member
      of that clade (AtOPT3) transports transition-metal ions rather than demonstrated peptides.
    action: UNDECIDED
    reason: GSH is a tripeptide, and GO:0034634 glutathione transmembrane transporter activity is
      a descendant of GO:0035673 via GO:0042937 tripeptide transmembrane transporter activity
      (verified in OLS). If the authors' report of yeast GSH and GS-conjugate uptake by ZmGT1 holds,
      the term is true but broad. That report cites the authors' own earlier work, which is not in
      PubMed and could not be inspected. The 80%-identical ortholog AtOPT3 has instead been shown
      to transport Fe2+, Cd2+ and Cu. AtOPT3 also fails to reach the yeast plasma membrane, which
      complicates yeast-based substrate assays for this clade. Whether the ancestral oligopeptide
      or GSH transport inferred from the fungal seeds was retained in the plant OPT3 clade
      therefore cannot be decided from the available evidence.
