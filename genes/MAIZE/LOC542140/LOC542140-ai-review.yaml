gene_symbol: LOC542140
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: LOC542140 encodes ZmGT1, a maize member of the oligopeptide transporter (OPT) family
  (Pfam PF03169) with 15 predicted transmembrane helices. Its sequence is nearly identical to the
  cloned maize glutathione transporter ZmGT1 (GenBank FJ573212), and it is 80% identical to
  Arabidopsis OPT3. The cloning authors report that ZmGT1 mediates uptake of reduced glutathione
  (GSH) and glutathione S-conjugates when expressed in yeast; the primary data are not available in
  an indexed publication. Its closest characterised ortholog, AtOPT3, is a phloem plasma-membrane
  transporter of Fe2+, Cd2+ and Cu that supports long-distance metal redistribution and
  shoot-to-root iron signalling. In maize leaves, ZmGT1 transcripts rise after treatment with
  atrazine, metolachlor, primisulfuron and the safener dichlormid, but not 2,4-D. This has led to the
  proposal that it contributes to glutathione-conjugate-based herbicide detoxification. Its
  physiological substrate (GSH and its conjugates versus transition-metal ions) has not been
  established in planta.
