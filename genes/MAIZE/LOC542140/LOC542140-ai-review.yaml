core_functions:
- description: Plasma-membrane OPT-family transporter (ZmGT1) that moves a solute across the
    membrane. The authors report GSH and glutathione S-conjugates as substrates; the AtOPT3 ortholog
    suggests transition-metal ions such as Fe2+, Cd2+ and Cu. The physiological substrate is
    unresolved.
