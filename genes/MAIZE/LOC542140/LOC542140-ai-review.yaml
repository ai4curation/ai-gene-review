        comment: All experimental seeds are fungal (S. cerevisiae, S. pombe, C. albicans,
          A. fumigatus). The plant OPT3 clade's characterised member transports metal ions, so it
          is unclear whether the node placement correctly captures plant OPT3 substrate specificity.
