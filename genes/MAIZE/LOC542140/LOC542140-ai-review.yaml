- id: PMID:22792398
  title: Co-induction of a glutathione-S-transferase, a glutathione transporter and an ABC transporter
    in maize by xenobiotics.
  findings:
  - statement: ZmGT1 transcripts in maize leaves are induced by atrazine, metolachlor, primisulfuron
      and dichlormid but not by 2,4-D (semi-quantitative RT-PCR).
    supporting_text: While 2,4-D treatment had no influence on ZmGT1 expression, the other four
      compounds exhibited a significant inducing effect.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. This is an expression-only study. ZmGT1 is identified by GenBank
      FJ573212, which is 99.6% identical to A0A804M424. The paper contains no transport,
      localisation or loss-of-function data for ZmGT1.
- id: PMID:23144728
  title: Enantioselective induction of a glutathione-S-transferase, a glutathione transporter and an
    ABC transporter in maize by Metolachlor and its (S)-isomer.
  findings:
  - statement: The authors state that their earlier work showed ZmGT1-mediated uptake of GSH and GS
      conjugates in yeast. That earlier work is not indexed in PubMed.
    supporting_text: Our earlier work has shown that ZmGT1 is able to mediate the uptake of both GSH
      and GS conjugates by yeast cells, suggesting a potential role of this gene in xenobiotic
      detoxification [25].
  - statement: Rac- and S-metolachlor induce ZmGT1 transcripts to a similar extent.
    supporting_text: While no significant difference was found between rac- and S-metolachlor in
      increasing the transcript level of ZmGST27 and ZmGT1 (Fig. 1A and 1C)
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read; it is the RefSeq NM_001305852 GeneRIF reference for this gene.
      The new data are expression-only. The transport claim is an author statement about prior work
      that is not available for inspection.
- id: PMID:24867923
  title: OPT3 Is a Phloem-Specific Iron Transporter That Is Essential for Systemic Iron Signaling
    and Redistribution of Iron and Cadmium in Arabidopsis.
  findings:
  - statement: The ortholog AtOPT3 is a plasma-membrane transporter of transition-metal ions
      (Fe2+, Cd2+) when expressed in Xenopus oocytes.
    supporting_text: We found that OPT3 resided at the plasma membrane in oocytes
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: This is ortholog evidence (AtOPT3, 80.3% identical). It supports plasma-membrane
      localisation and points to metal-ion substrates for the OPT3 clade.
- id: PMID:24880337
  title: OPT3 is a component of the iron-signaling network between leaves and roots and misregulation
    of OPT3 leads to an over-accumulation of cadmium in seeds.
  findings:
  - statement: AtOPT3 localises to the phloem plasma membrane in planta but not to the plasma
      membrane in yeast.
    supporting_text: When expressed in yeast, OPT3 does not localize to the plasma membrane,
      precluding the identification of the OPT3 substrate.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Ortholog evidence. The finding about yeast mislocalisation bears on how to
      interpret yeast-based GSH uptake results for OPT3-clade proteins.
- id: PMID:36814393
  title: Loss of OPT3 function decreases phloem copper levels and impairs crosstalk between copper
    and iron homeostasis and shoot-to-root signaling in Arabidopsis thaliana.
  findings:
  - statement: AtOPT3 also transports Cu in heterologous systems.
    supporting_text: We report that AtOPT3 also transports Cu in heterologous systems and contributes
      to its delivery from sources to sinks in planta.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. Ortholog evidence for broad transition-metal substrate specificity.
- id: PMID:15247401
  title: AtOPT6 transports glutathione derivatives and is induced by primisulfuron.
  findings:
  - statement: The more distant paralog AtOPT6 transports GSH and its conjugates in yeast.
    supporting_text: In addition to peptide transport, AtOPT6 is able to transport glutathione
      derivatives and metal complexes, and may be involved in stress resistance.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only. This is paralog evidence (AtOPT6, 53.1% identical), cited by the
      maize authors as the model for glutathione transport by plant OPTs.
