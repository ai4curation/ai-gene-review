suggested_questions:
- question: Is the physiological substrate of ZmGT1 glutathione and its S-conjugates, as its
    discoverers report, or transition-metal ions (Fe2+, Cu, Cd2+), as shown for its 80%-identical
    Arabidopsis ortholog OPT3?
- question: Is ZmGT1 the functional maize OPT3 ortholog for phloem iron loading and shoot-to-root
    iron signalling? If so, would iron ion transmembrane transporter activity be a better core
    function term than glutathione transport?
- question: Does the herbicide- and safener-induced expression of ZmGT1 reflect a direct role in
    glutathione-conjugate detoxification, or a general stress-responsive transcriptional change?
suggested_experiments:
- description: Express ZmGT1 in Xenopus oocytes (where AtOPT3 reaches the plasma membrane) and measure
    uptake of radiolabelled GSH, a GS-conjugate (e.g. GS-metolachlor or GS-NEM) and Fe2+/Cd2+/Cu,
    together with two-electrode voltage clamp, to define its substrate range directly.
- description: Determine ZmGT1-GFP localisation and cell-type expression (phloem companion cells
    versus other tissues) in maize, and test CRISPR knockout lines for leaf and seed Fe/Zn/Cu/Cd
    distribution, root iron-deficiency marker expression and metolachlor sensitivity.
