- term:
    id: GO:0005516
    label: calmodulin binding
  evidence_type: IDA
  original_reference_id: PMID:33864702
  qualifier: enables
  review:
    summary: >-
      Proposed calmodulin binding. ZmCCaMK has a CaM-binding region and its Ca2+/CaM binding is
      reported to be regulated by Ser-67 phosphorylation.
    action: NEW
    reason: >-
      Ca2+/CaM binding is the second regulatory input of CCaMKs and is required to activate
      substrate phosphorylation; for ZmCCaMK the Ca2+/CaM binding was measured and found to be
      modulated by ZmBSK1-mediated Ser-67 phosphorylation, and CaM antagonists reduce its
      activity in vivo. The full text of PMID:33864702 was not available (abstract only), so the
      assay details could not be checked; the claim is stated explicitly in the abstract and is
      consistent with the domain architecture.
    supported_by:
