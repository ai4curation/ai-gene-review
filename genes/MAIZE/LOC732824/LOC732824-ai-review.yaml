suggested_questions:
- question: >-
    Is the participation of ZmCCaMK in abscisic acid-activated signalling (GO:0009738;
    phosphorylation of ZmNAC84 downstream of H2O2/NO) robust enough, beyond protoplast assays
    from a single group, to support an experimental GO process annotation, and should the
    BR-induced antioxidant response be captured as a separate signalling role?
- question: >-
    Does ZmCCaMK, like its legume and rice orthologs, act in the common symbiosis signalling
    pathway required for arbuscular mycorrhizal colonisation of maize roots?
- question: >-
    Two TrEMBL entries (A0A804P0P6 and Q208N4) carry the identical ZmCCaMK sequence for GeneID
    732824; should they be merged, and which accession should carry literature-based
    annotations?
suggested_experiments:
- description: >-
    Generate maize ccamk CRISPR knockout lines and test arbuscular mycorrhizal colonisation
    (Rhizophagus irregularis) and ABA/BR-induced antioxidant gene induction in planta.
  hypothesis: >-
    ZmCCaMK is required for AM symbiosis as in rice and legumes, and for hormone-induced
    antioxidant gene expression in leaves.
  experiment_type: reverse genetics / loss-of-function phenotyping
- description: >-
    Localise ZmCCaMK expressed from its native promoter (or by immunolocalisation with the
    C-terminal peptide antibody) in roots and leaves to resolve whether the cytoplasmic and
    plasma-membrane pools seen with 35S-YFP fusions exist at endogenous levels.
  hypothesis: Endogenous ZmCCaMK is predominantly nuclear, like DMI3.
  experiment_type: localization
- description: >-
    Measure Ca2+ binding by the purified EF-hand domain (ITC or 45Ca overlay) and Ca2+ versus
    Ca2+/CaM dependence of recombinant ZmCCaMK activity on ZmNAC84.
  hypothesis: >-
    ZmCCaMK shows the dual Ca2+ and Ca2+/CaM regulation described for lily and Medicago CCaMK.
  experiment_type: biochemical assay
