core_functions:
- description: >-
    Calcium- and Ca2+/calmodulin-dependent protein serine/threonine kinase. Free Ca2+ binding to
    the C-terminal EF-hand (visinin-like) domain and Ca2+/CaM binding to the central regulatory
    region activate the kinase, which autophosphorylates (Thr420, Ser454) and phosphorylates
    nuclear substrates such as the NAC transcription factor ZmNAC84 at Ser-113. It is itself
    regulated by ZmBSK1 phosphorylation at Ser-67. In maize leaves this kinase is activated
    downstream of ABA-induced H2O2 and NO and relays the signal to ZmNAC84 to induce antioxidant
    enzyme genes.
  molecular_function:
