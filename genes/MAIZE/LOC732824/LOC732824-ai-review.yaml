- term:
    id: GO:0005509
    label: calcium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002048
  - UniRule:UR001552760
  review:
    summary: >-
      EF-hand-based calcium ion binding. ZmCCaMK carries three canonical EF-hands (PROSITE
      EF_HAND_1 x3) forming the visinin-like domain that confers free-Ca2+ regulation.
    action: ACCEPT
    reason: >-
      Three EF-hand domains with intact Ca2+-binding loop signatures (PS00018, three matches)
      are annotated at 408-514. Direct Ca2+ binding by the EF-hand domain is the defining
      regulatory feature of CCaMKs (dual Ca2+ and Ca2+/CaM sensing) and is part of the
      mechanism of the core kinase activity, so it is retained as core. Direct Ca2+-binding
      measurements on the maize protein were not found; the support is the conserved,
      signature-intact domain.
    supported_by:
    - reference_id: file:MAIZE/LOC732824/LOC732824-uniprot.txt
      record_section: ["DR:PROSITE"]
      supporting_text: "DR   PROSITE; PS00018; EF_HAND_1; 3."
    - reference_id: PMID:22865912
      supporting_text: "A CCaMK structure includes a serine/threonine kinase domain, a
        CaM-binding domain, and three EF-hand motifs, similar to the visinin-like domain"
