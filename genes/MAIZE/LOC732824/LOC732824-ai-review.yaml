- id: PMID:22865912
  title: Nitric oxide-activated calcium/calmodulin-dependent protein kinase regulates
    the abscisic acid-induced antioxidant defence in maize.
  findings:
  - statement: Immunoprecipitated ZmCCaMK from maize leaves phosphorylates histone S-III; the
      activity is induced by ABA, H2O2 and NO and reduced by Ca2+ chelation and CaM antagonists.
    supporting_text: "Proteins that could phosphorylate histone S-III were precipitated from
      extracts of leaves of maize plants."
  - statement: YFP-ZmCCaMK localizes to nucleus, cytoplasm and plasma membrane in maize
      mesophyll protoplasts.
    supporting_text: "YFP–ZmCCaMK was localized in the nucleus, the cytoplasm, and the plasma
      membrane in maize mesophyll protoplasts"
  - statement: ZmCCaMK is required for ABA-induced antioxidant defence in protoplasts (RNAi and
      transient overexpression) and acts downstream of NO.
    supporting_text: "these data demonstrate unequivocally that ZmCCaMK is required for
      ABA-induced antioxidant defence in maize protoplasts"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC3427994). Uses GenBank DQ403196, the cDNA of the identical-sequence
      entry Q208N4 for this gene (GeneID 732824). Kinase activity is from IP in-gel assays;
      localization from 35S-driven YFP fusion.
- id: PMID:27208250
  title: Phosphorylation of a NAC Transcription Factor by a Calcium/Calmodulin-Dependent
    Protein Kinase Regulates Abscisic Acid-Induced Antioxidant Defense in Maize.
  findings:
  - statement: Recombinant ZmCCaMK phosphorylates ZmNAC84 in vitro at Ser-113 (LC-MS/MS), and
      the two proteins interact in the nucleus (BiFC).
    supporting_text: "LC-MS/MS analysis confirmed Ser-113 in ZmNAC84 as the phosphorylation
      site by ZmCCaMK"
  - statement: Ser-113 phosphorylation of ZmNAC84 is required for the ABA-induced stimulation of
      antioxidant defence by ZmCCaMK.
    supporting_text: "the phosphorylation at Ser-113 of ZmNAC84 by ZmCCaMK is essential for its
      role in this process"
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; identifies ZmCCaMK as DQ403196 and defines a direct substrate.
