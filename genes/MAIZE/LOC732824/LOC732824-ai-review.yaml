- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IDA
  original_reference_id: PMID:22865912
  qualifier: located_in
  review:
    summary: >-
      Proposed nuclear location. A YFP-ZmCCaMK fusion in maize mesophyll protoplasts is nuclear
      (DAPI co-staining), and its complexes with the transcription factors ZmNAC84 and
      ZmWRKY104 form in the nucleus by BiFC.
    action: NEW
    reason: >-
      Two independent lines place ZmCCaMK in the nucleus: direct YFP-fusion imaging with DAPI
