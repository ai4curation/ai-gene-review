gene_symbol: LOC732824
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  LOC732824 encodes ZmCCaMK, the maize calcium and calcium/calmodulin-dependent protein
  kinase (CCaMK), ortholog of Medicago DMI3 and rice OsCCaMK/OsDMI3. The 528-residue protein
  has an N-terminal Ser/Thr protein kinase domain (ATP-binding Lys45, catalytic Asp172), a
  central calmodulin-binding/autoinhibitory region and a C-terminal visinin-like domain of
  three EF-hands, giving it dual regulation by free Ca2+ and by Ca2+/calmodulin. Kinase
  activity of the native protein has been shown by immunoprecipitation kinase assays from maize
  leaves, and the recombinant protein phosphorylates myelin basic protein and the NAC
  transcription factor ZmNAC84, at Ser-113. ZmCCaMK autophosphorylates (Thr420 and Ser454 are
  required) and is itself phosphorylated at Ser-67 by the brassinosteroid-signalling kinase
  ZmBSK1, which modulates its Ca2+/CaM binding and activity. A YFP fusion localises to the
  nucleus, cytoplasm and plasma membrane, and its complexes with ZmNAC84 and ZmWRKY104 form in
  the nucleus. In maize leaves ZmCCaMK is activated downstream of abscisic acid, H2O2 and nitric
  oxide, and of brassinosteroid-induced Ca2+ signals, and is required for the induction of
  antioxidant enzymes (SOD, APX) in these hormone responses, contributing to drought and salt
  tolerance. Its legume and rice orthologs are core components of the common symbiosis
  signalling pathway for root endosymbioses, a role not yet tested genetically in maize.
