- term:
    id: GO:0009570
    label: chloroplast stroma
  evidence_type: IC
  original_reference_id: PMID:18430213
  qualifier: located_in
  review:
    summary: Proposed sub-compartment location of BX1 within the chloroplast.
    action: NEW
    reason: >-
      Root-organelle policy (projects/ORGANELLES.md): add the sub-compartment beside the
      chloroplast rows when independent lines agree. (1) BX1 is soluble: its activity is
      recovered as a monomer in clarified leaf extracts, and the mature protein is a
      soluble TIM-barrel enzyme with no transmembrane segment (crystal structures 1RD5/1TJR
      of the mature chain). (2) It has a single N-terminal chloroplast transit peptide with
      no thylakoid-targeting domain, which targets proteins to the stroma by default. (3)
      Its substrate is made by the plastid IGPS enzymes, and IGPS1 interacts with BX1 in
      BiFC. These three lines point to the stroma. The assignment is inferred, not assayed
      by sub-plastid fractionation, so it uses IC.
    supported_by:
