    summary: Phylogenetic transfer of cytosolic location from E. coli TrpA.
    action: REMOVE
    reason: >-
      The only donor is bacterial TrpA, which is cytosolic because bacteria have no
      plastids. BX1 has an N-terminal chloroplast transit peptide, encoded by exon 1. A
      YFP fusion of the maize indole-3-glycerol phosphate lyases, BX1 among them, was
      chloroplastic. The plant TSAs in the same family are plastidic, and the only cytosolic
