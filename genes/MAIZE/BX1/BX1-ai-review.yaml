id: P42390
gene_symbol: BX1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  BX1 (Benzoxazineless 1) encodes a chloroplast indole-3-glycerol phosphate lyase
  (EC 4.1.2.8) of maize. It belongs to the tryptophan synthase alpha-chain (TrpA) family
  and arose by duplication of the tryptophan synthase alpha subunit gene. BX1 has an
  N-terminal chloroplast transit peptide and a TrpA TIM-barrel fold. It cleaves
  indole-3-glycerol phosphate to free indole and D-glyceraldehyde 3-phosphate. Unlike
  bacterial TrpA, it is highly active on its own, without the tryptophan synthase beta
  subunit. The crystal structure shows the catalytic loop and glutamate fixed in the active
  conformation. BX1 behaves as a monomer in solution, does not bind maize TSB1, and is
  absent from the native leaf tryptophan synthase complex, whose alpha subunit is ZmTSA.
  The indole that BX1 releases is the precursor of the benzoxazinoids DIBOA and DIMBOA,
  defensive hydroxamic acids made by the P450s BX2-BX5 and later enzymes encoded in a gene
  cluster on chromosome 4. BX1 catalyses the branch-point step that diverts
  indole-3-glycerol phosphate from tryptophan synthesis to this secondary pathway. Bx1 is
  expressed mainly in seedlings and is the main developmentally controlled source of
  benzoxazinoids, while its paralog IGL is induced by herbivory. bx1 mutants lack most
  benzoxazinoids and are more susceptible to aphids, fungi and caterpillars, but they grow
  normally, which indicates that BX1 is not needed for tryptophan synthesis.
