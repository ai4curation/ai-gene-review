core_functions:
- description: >-
    Chloroplast indole-3-glycerol phosphate lyase that releases free indole from
    indole-3-glycerol phosphate without the tryptophan synthase beta subunit. This is the
    branch-point step that supplies indole to benzoxazinoid (DIBOA/DIMBOA) biosynthesis.
  molecular_function:
    id: GO:0033984
    label: indole-3-glycerol-phosphate lyase activity
  directly_involved_in:
  - id: GO:0042432
    label: indole biosynthetic process
  locations:
  - id: GO:0009507
    label: chloroplast
  supported_by:
  - reference_id: PMID:9235894
    supporting_text: Bx1 encodes a tryptophan synthase alpha homolog that catalyzes the
      formation of indole for the production of secondary metabolites rather than
      tryptophan, thereby defining the branch point from primary to secondary metabolism.
  - reference_id: PMID:11106389
    supporting_text: In contrast, BX1 activity is independent of TSB ( 10 ).
  - reference_id: PMID:33458870
    supporting_text: Fusions of yellow fluorescent protein with maize IGPS enzymes and
      indole-3-glycerolphosphate lyases were all localized in chloroplasts.
  - reference_id: PMID:21730199
    supporting_text: The Bx1 gene is under developmental control and is mainly responsible for
      BX production, whereas the Igl gene is inducible by stress signals, such as wounding,
      herbivory, or jasmonates.
proposed_new_terms:
- proposed_name: benzoxazinoid biosynthetic process
  proposed_definition: The chemical reactions and pathways resulting in the formation of a
    benzoxazinoid, a 2-hydroxy-2H-1,4-benzoxazin-3(4H)-one derivative such as DIBOA or
    DIMBOA, made from indole in grasses and some dicots as a defensive secondary metabolite.
  justification: >-
    GO has activity terms for individual benzoxazinoid enzymes (for example GO:0036193
    2-hydroxy-1,4-benzoxazin-3-one monooxygenase activity and GO:0047254 DIMBOA
    glucosyltransferase activity) but no process term for the pathway, so the
    Bx1-Bx9 enzymes can only be grouped under indole or generic secondary-metabolite
    terms. BX1 catalyses the first, branch-point step (UniPathway UPA00872 step 1/5).
suggested_questions:
- question: Does BX1, together with free TSB dimers, contribute measurably to tryptophan
    synthesis in maize, for example in bx1 versus wild-type tissue fed labelled
    indole-3-glycerol phosphate, or is its indole used only for benzoxazinoids?
- question: Should the PAINT nodes PTN000034360 (tryptophan synthase activity, tryptophan
    biosynthesis, cytosol) carry loss annotations for the BX1/IGL clade
    (PTHR43406:SF7), with indole-3-glycerol-phosphate lyase activity propagated
    there instead?
- question: Is the UniProt kcat for BX1 (0.02 s-1) a transcription error for 2.8 s-1, the
    value reported in later papers from the same group?
- question: Is BX1 a monomer (gel filtration) or a homodimer (crystal packing) in the
    chloroplast stroma, and does it form a complex with IGPS1 that channels its substrate?
suggested_experiments:
- description: Sub-plastid fractionation (stroma, envelope, thylakoid) of maize seedling
    chloroplasts with BX1 immunodetection or tagged-protein detection, to confirm the
    inferred stromal location.
  experiment_type: subcellular fractionation
- description: Isotope tracing of 13C-labelled anthranilate or indole-3-glycerol phosphate
    into tryptophan and DIMBOA in wild-type, bx1, igl and bx1 igl seedlings, to measure how
    much BX1-derived indole reaches tryptophan.
  experiment_type: metabolic labelling
