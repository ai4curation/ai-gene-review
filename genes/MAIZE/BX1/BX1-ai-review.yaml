      L-tryptophan, EC 4.2.1.20) from TrpA orthologs.
    action: MODIFY
    reason: >-
      Tryptophan synthase activity is the overall reaction of the alpha2beta2 complex. The
      beta subunit carries out the serine condensation. BX1 has no beta-subunit partner: it
      is a monomer in gel filtration, does not interact with ZmTSB1, and is absent from the
      native complex. The overall reaction is therefore not a property of BX1, and even a
      true alpha subunit could only contribute to it. The sound part of the claim is the
      alpha reaction, which BX1 catalyses on its own and with high efficiency. The row is
      modified to indole-3-glycerol-phosphate lyase activity (GO:0033984). This is a
      lateral correction: OAK shows that GO:0033984 (an aldehyde-lyase) is not a descendant
      of GO:0004834 (a hydro-lyase).
