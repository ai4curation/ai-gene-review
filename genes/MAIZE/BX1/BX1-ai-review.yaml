    reason: >-
      The IBD at PTN000034360 is right for canonical TrpA subunits, which act in
      tryptophan synthesis inside the alpha2beta2 tryptophan synthase complex. BX1 is a
      neofunctionalised maize paralog. It catalyses the same alpha reaction but releases
