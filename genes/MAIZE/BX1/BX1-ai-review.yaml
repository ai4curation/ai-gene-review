- id: PMID:9235894
  title: Analysis of a chemical plant defense mechanism in grasses.
  findings:
  - statement: BX1 is a TSA homolog that forms indole for benzoxazinoid synthesis rather
      than tryptophan, defining the branch point from primary to secondary metabolism.
    supporting_text: Bx1 encodes a tryptophan synthase alpha homolog that catalyzes the
      formation of indole for the production of secondary metabolites rather than
      tryptophan, thereby defining the branch point from primary to secondary metabolism.
  - statement: Bx1-Bx5 are clustered on chromosome 4 and are required for DIBOA synthesis.
    supporting_text: Five genes, Bx1 through Bx5, are required for DIBOA biosynthesis in maize.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache. Foundational paper; UniProt cites it for function,
      activity and kinetics of P42390.
- id: PMID:18430213
  title: Characterisation of the tryptophan synthase alpha subunit in maize.
  findings:
  - statement: BX1 does not interact with ZmTSB1 and is a monomer in solution.
    supporting_text: No interaction of ZmTSB1 with ZmTSAlike, BX1, or IGL was detectable.
  - statement: BX1 is not part of the native leaf tryptophan synthase complex; ZmTSA is the
      alpha subunit.
    supporting_text: ZmTSAlike, BX1, and IGL were not detectable in the native tryptophan
      synthase complex in leaves.
  - statement: Tryptophan in maize is made mainly by the ZmTSA/ZmTSB complex, not by BX1.
    supporting_text: We propose that, despite the availability of the highly active monomers
      BX1 and IGL, in maize tryptophan is predominantly synthesized through a tryptophan
      synthase complex containing ZmTSA and ZmTSB1 or ZmTSB2, respectively.
  - statement: Bx1 is transcribed mainly in seedlings.
    supporting_text: In contrast, Bx1 is predominantly transcribed in seedlings
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Characterises ZmTSA, and tests BX1 for TSB1 binding and
      complex membership in the same experiments.
- id: PMID:11106389
  title: An herbivore elicitor activates the gene for indole emission in maize.
  findings:
  - statement: BX1 activity does not depend on the beta subunit, and BX1 and IGL both make
      indole efficiently.
    supporting_text: In contrast, BX1 activity is independent of TSB ( 10 ).
  - statement: Exon 1 of Bx1 encodes a transit peptide.
    supporting_text: In the case of Bx1 ( 11 ) and TSA of A. thaliana ( 19 ), exon 1 encodes
      a transit peptide.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Primary paper on IGL with comparative statements on BX1.
- id: PMID:16120446
  title: On the structural basis of the catalytic mechanism and the regulation of the alpha
    subunit of tryptophan synthase from Salmonella typhimurium and BX1 from maize, two
    evolutionarily related enzymes.
  findings:
  - statement: BX1 cleaves IGP faster than TSA because its structure is stabilised in the
      active conformation.
    supporting_text: the faster catalytic rate of BX1 may be due to a stabilization of the
      active conformation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only in cache. Structural basis of standalone BX1 activity.
- id: PMID:33458870
  title: Indole-3-glycerolphosphate synthase, a branchpoint for the biosynthesis of
    tryptophan, indole, and benzoxazinoids in maize.
  findings:
  - statement: YFP fusions of maize IGP lyases (BX1, TSA, IGL) localise to chloroplasts.
    supporting_text: Fusions of yellow fluorescent protein with maize IGPS enzymes and
      indole-3-glycerolphosphate lyases were all localized in chloroplasts.
  - statement: IGPS1 interacts strongly with BX1 in BiFC.
    supporting_text: IGPS1 interacted strongly with BX1 and IGL
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache. The abstract states the localization for all
      three lyases collectively, BX1 included.
- id: PMID:7766899
  title: Structure of a maize tryptophan synthase alpha subunit gene with pith enhanced
    expression.
  findings:
  - statement: The Bx1 cDNA complements an E. coli trpA mutant.
    supporting_text: the cDNA clone can complement an E. coli trpA mutant
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only in cache. Original cloning; heterologous complementation
      shows alpha activity, not a role in maize tryptophan synthesis.
- id: PMID:21730199
  title: Benzoxazinoid metabolites regulate innate immunity against aphids and fungi in
    maize.
  findings:
  - statement: Bx1 is developmentally controlled and is the main source of benzoxazinoids;
      Igl is stress-inducible.
    supporting_text: The Bx1 gene is under developmental control and is mainly responsible
      for BX production, whereas the Igl gene is inducible by stress signals, such as
      wounding, herbivory, or jasmonates.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only in cache. bx1 phenotypes are downstream consequences of
      benzoxazinoid loss; not used for process annotations.
- id: PMID:19577780
  title: Benzoxazinoid biosynthesis, a model for evolution of secondary metabolic pathways
    in plants.
  findings:
  - statement: Bx1 arose by duplication and neofunctionalisation of TSA.
    supporting_text: The branchpoint from the primary metabolism (Bx1 gene) can be traced
      back to duplication and functionalisation of the alpha-subunit of tryptophan synthase
      (TSA).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Review, abstract only in cache.
