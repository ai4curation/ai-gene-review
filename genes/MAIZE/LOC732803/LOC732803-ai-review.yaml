gene_symbol: LOC732803
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  LOC732803 (NCBI Gene "orange pericarp 2", orp2; TSB2) encodes one of two nearly identical
  chloroplast tryptophan synthase beta subunits (TrpB family, type 1) of maize; the other is
  encoded by the unlinked duplicate orp1 (TSB1). The 479-residue precursor has an N-terminal
  chloroplast transit peptide and a pyridoxal 5'-phosphate (PLP)-dependent tryptophan
  synthase beta domain with the conserved PLP-binding lysine (K174). The beta subunit
  catalyzes the beta-reaction of tryptophan synthase, the PLP-dependent condensation of
  indole with L-serine to L-tryptophan and water. Together with the alpha subunit ZmTSA,
  which cleaves indole-3-glycerol phosphate to indole, it forms an alpha2beta2 tryptophan
  synthase complex that carries out the last step of L-tryptophan biosynthesis in the
  plastid. In leaf extracts from plants lacking TSB1, beta activity is still found both as a
  beta2 dimer and in the 160 kD alpha2beta2 complex, which shows that TSB2 is active and joins
  the complex in vivo. TSB1 and TSB2 are functionally redundant. Plants mutant in either gene
  alone are normal, whereas the orp1 orp2 double mutant lacks tryptophan synthase beta
  activity, accumulates anthranilate and indole, has orange pericarp and is a seedling-lethal
  tryptophan auxotroph. Both genes are expressed in all tissues examined.
