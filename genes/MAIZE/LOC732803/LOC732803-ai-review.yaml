suggested_questions:
- question: >-
    Should complex-forming (type-1) TrpB subunits carry GO:0052684 (the beta-reaction) as
    their own activity, with GO:0004834 as contributes_to? Reference type-1 TSBs (E. coli
    TrpB, Arabidopsis TSB1, yeast TRP5) are annotated only to GO:0004834, mostly with
    enables, while GO:0052684 is used mainly by TreeGrafter for TrpB-like proteins.
- question: >-
    K7TR93 (the chromosome-10 orp2 locus) is only 96.6% identical to the Swiss-Prot TSB2 cDNA
    P43284 but 98.2% identical to TSB1 (P43283) over that fragment, whereas the chromosome-4
    paralog K7TTR0 is 99.7% identical to P43283. Does P43284 come from a different inbred,
    or does it contain sequencing errors? Should it be merged with or cross-referenced to
    K7TR93?
- question: >-
    GO has no cellular-component term for the tryptophan synthase alpha2beta2 complex.
    Should one be requested so that the maize TSA and TSB subunits can be annotated to it?
suggested_experiments:
- description: >-
    Express mature recombinant TSB2 (without the transit peptide) and measure its
    beta-reaction kinetics alone and with ZmTSA, and its ability to stimulate the ZmTSA
    alpha-reaction, alongside TSB1, to test whether the two paralogs are biochemically
    equivalent.
  experiment_type: in vitro enzyme kinetics
- description: >-
    Localize a TSB2-GFP fusion in maize protoplasts, and determine its sub-plastid
    location (stroma versus membrane) by chloroplast fractionation.
  experiment_type: subcellular localization
- description: >-
    Use paralog-discriminating peptides (positions that differ between TSB1 and TSB2) in
    targeted mass spectrometry of the native 160 kD complex to show directly whether TSB2 is
    a component in wild-type leaves.
  experiment_type: proteomics
