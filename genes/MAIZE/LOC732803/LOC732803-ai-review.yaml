    Chloroplast tryptophan synthase beta subunit. TSB2 catalyzes the PLP-dependent
    beta-reaction, condensing indole with L-serine to L-tryptophan. As part of the alpha2beta2
    complex with ZmTSA it contributes to the overall tryptophan synthase reaction from
    indole-3-glycerol phosphate, the last step of L-tryptophan biosynthesis. It is
    functionally redundant with TSB1 (orp1).
