- id: PMID:18430213
  title: Characterisation of the tryptophan synthase alpha subunit in maize.
  findings:
  - statement: In leaf extracts of tsb1 and tsb2 single mutants, beta activity is present in
      both the beta2-dimer (90 kD) and the alpha2beta2 complex (160 kD) fractions, so TSB2
      alone forms active beta dimers and tryptophan synthase complexes in vivo.
    supporting_text: Here, the respective single mutants Zmtsb1 (orp1 +/orp1 orp2) and Zmtsb2
      (orp1 orp2/+ orp2) were tested and each yielded β-activity in both the 90 kD and the
      160 kD complex fractions (Figure 4D).
  - statement: TSB1 and TSB2 are functionally redundant active beta subunits.
    supporting_text: ZmTSB1 and ZmTSB2 are functionally redundant active TSB enzymes.
  - statement: Tryptophan in maize is synthesized mainly by a ZmTSA-ZmTSB1/2 complex.
    supporting_text: We propose that, despite the availability of the highly active monomers
      BX1 and IGL, in maize tryptophan is predominantly synthesized through a tryptophan
      synthase complex containing ZmTSA and ZmTSB1 or ZmTSB2, respectively.
  - statement: The native-complex peptide was assigned to TSB1, but the authors infer that
      TSB2 is also in the complex. The peptide is also a tryptic peptide of TSB2 (own
      analysis).
    supporting_text: However, based on Zmtsb1 mutant analysis (Figure 4) it is very likely that
      also ZmTSB2 is present in TS complexes in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC2395261, Kriechbaumer et al. 2008, BMC Plant Biol 8:44). The
      recombinant work uses ZmTSB1 (orp1); TSB2-specific evidence comes from the tsb1 and
      tsb2 single-mutant leaf extracts. The peptide QALNVFR that the authors call
      ZmTSB1-specific is also present in K7TR93, so the MS result does not distinguish the
      paralogs.
