- term:
    id: GO:0052684
    label: L-serine hydro-lyase (adding indole, L-tryptophan-forming) activity
  evidence_type: IC
  original_reference_id: PMID:18430213
  qualifier: enables
  review:
    summary: >-
      Proposed annotation of the beta-reaction (indole + L-serine = L-tryptophan + H2O), the
      activity the beta subunit performs on its own.
    action: NEW
    reason: >-
      TSB2 itself performs this step. In leaf extracts of the tsb1 single mutant, the only
      remaining beta subunit is TSB2, and beta activity (tryptophan formation from indole and
      serine) is still present in the beta2-dimer fraction, i.e. without the alpha subunit.
      The double mutant has no beta activity. Recombinant TSB1, 96% identical, has this
      activity alone in vitro (Table 1 of PMID:18430213). The catalytic PLP lysine is
      conserved (K174; bioinformatics RESULTS.md). This is the subunit's own established
      activity, alongside the contributes_to row for the overall complex reaction.
      Comparator check: E. coli TrpB, Arabidopsis TSB1 and yeast TRP5 carry GO:0004834 but
      not GO:0052684, which in GOA is mostly assigned by TreeGrafter to TrpB-like proteins.
      Curators have thus tended to annotate complex-forming TSBs only with the overall
      reaction. The term definition nonetheless describes exactly the reaction this subunit
      catalyzes alone, so it is proposed here and flagged for expert review.
    supported_by:
    - reference_id: PMID:18430213
      supporting_text: Here, the respective single mutants Zmtsb1 (orp1 +/orp1 orp2) and Zmtsb2
        (orp1 orp2/+ orp2) were tested and each yielded β-activity in both the 90 kD and the
        160 kD complex fractions (Figure 4D).
    - reference_id: PMID:18430213
      supporting_text: Formation of indole from IGP (α-reaction, A, B) and of tryptophan from
        indole + serine (β-reaction, C, D) was quantified.
