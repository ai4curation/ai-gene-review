- id: PMID:17731524
  title: Indole-3-Acetic Acid Biosynthesis in the Mutant Maize orange pericarp, a Tryptophan
    Auxotroph.
  full_text_unavailable: true
  findings:
  - statement: The orp tryptophan auxotroph was used to show tryptophan-independent IAA
      synthesis; this is a use of the mutant, not a function of TSB2.
    supporting_text: These results establish that IAA can be produced de novo without
      tryptophan as an intermediate.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Confirms that orp is a tryptophan auxotroph. It does not support any
      auxin-related annotation for TSB2.
