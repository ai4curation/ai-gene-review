    summary: >-
      InterPro2GO mapping from the Allergen V5/Tpx-1 conserved site (IPR018244) places this
      CAP-domain PR-1 protein in the extracellular region.
    action: ACCEPT
    reason: >-
      Two independent lines agree: SignalP predicts an N-terminal secretory signal peptide
      (residues 1-23) with no transmembrane segment or retention signal, and the protein is a
      single-domain PR-1-type CAP protein (CDD CAP_PR-1, PROSITE CRISP signatures), a family of
      secreted proteins whose defence role (sterol sequestration from pathogens) acts outside
      the cell. Extracellular region is as precise as the available evidence allows; an
      apoplast/extracellular space location is likely but has not been shown for this protein.
