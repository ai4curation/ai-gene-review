suggested_questions:
- question: >-
    Does the LOC542352 protein bind sterols (e.g. cholesterol, ergosterol) like the tomato and
    tobacco PR-1 proteins, and does it inhibit sterol-auxotrophic oomycetes such as
    Peronosclerospora or Pythium?
- question: >-
    Which maize PR-1 paralog was cloned in the induced-resistance study of Morris et al. 1998
    (PMID:9650297), and is LOC542352 (Zm00001eb299370) among the pathogen- and BTH-induced
    PR-1 genes?
- question: >-
    NCBI Gene links PMID:21385724 (with a GeneRIF) to GeneID 542352, but that paper concerns the
    pr1 (red aleurone1) flavonoid 3'-hydroxylase locus. Can NCBI remove this gene2pubmed/GeneRIF
    association, which appears to result from the collision between this gene's "PR1" alias and
    the pr1 locus symbol?
- question: >-
    Is a CAPE-like peptide released from the C-terminal PxGNxxGxxPY motif of this protein in
    maize, and does it act as a defence signal?
suggested_experiments:
- hypothesis: LOC542352 binds sterols through its CAP domain.
  description: >-
    Express the mature protein (residues 24-163) recombinantly, and test sterol binding with a
    radiolabelled cholesterol binding assay or fluorescent sterol analogue, including a
    mutation of the conserved CAP caveolin-binding-like motif as control.
  experiment_type: in vitro binding assay
- hypothesis: LOC542352 is secreted to the apoplast and induced during infection.
  description: >-
    Express a C-terminal fluorescent fusion in maize or Nicotiana benthamiana leaves and image
    after plasmolysis; in parallel, quantify Zm00001eb299370 transcripts (gene-specific
    primers distinguishing PR-1 paralogs) after BTH treatment and pathogen inoculation.
  experiment_type: localization and expression analysis
