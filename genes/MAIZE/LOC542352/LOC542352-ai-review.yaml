core_functions:
- description: >-
    Secreted acidic PR-1 type CAP-domain protein located in the extracellular region. Its
    molecular activity has not been tested; by family membership it is predicted to bind
    sterols and to contribute to antimicrobial defence, and its C-terminal PxGNxxGxxPY motif
    could release a CAPE-like signalling peptide, but these remain hypotheses for this gene, so
    the root molecular_function term is used.
