description: >-
  LOC542352 (NCBI GeneID 542352, gene model Zm00001eb299370 on chromosome 7; NCBI aliases
  PR-1, PR1, prp4, "pathogenesis related protein 4") encodes a 163-residue acidic
  pathogenesis-related protein 1 (PR-1) of maize. It consists of an N-terminal signal peptide
  (residues 1-23) followed by a single CAP (cysteine-rich secretory protein, antigen 5 and
  PR-1; SCP) domain carrying the CRISP family signatures, and it ends in the conserved
  PxGNxxGxxPY motif from which CAPE immune-signalling peptides are released in other plant
  PR-1 proteins. As a secreted CAP protein it is expected to accumulate in the extracellular
  space (apoplast). Plant PR-1 proteins bind sterols and inhibit sterol-auxotrophic pathogens
  such as oomycetes by sequestering sterol, and maize PR-1 transcripts are induced by pathogen
  infection and by chemical inducers of systemic acquired resistance, making them markers of
  the salicylic-acid-associated defence response. None of these activities has been tested
  for the LOC542352 protein itself, and which of the several maize PR-1 paralogs was studied
  in the published maize work is not established. The gene is unrelated to the maize pr1
  (red aleurone1) locus, which encodes flavonoid 3'-hydroxylase.
