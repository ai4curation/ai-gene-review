- term:
    id: GO:0010039
    label: response to iron ion
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT4G24120
  - AGI_LocusCode:AT5G24380
  - PANTHER:PTN001270331
  review:
    summary: >-
      Propagated from Arabidopsis YSL1/YSL2 expression (IEP) annotations; for ZmYS1 the iron
      dependence is a property of its transcript regulation, not an activity of the protein in an
      iron-response process.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The descendant evidence behind this PAINT node is expression-pattern evidence (the Arabidopsis
      YSL1 and YSL2 rows for this term are IEP), and the same is true of ZmYS1: Ys1 mRNA and protein
      rise under iron deficiency. A transcript that is regulated by iron status is a readout of the
      plant's iron-deficiency response, carried out by sensors and transcription factors; ZmYS1
      itself performs no step of sensing or responding to iron ions. Its role is the uptake of iron
      chelates, captured by the transporter MF and siderophore-iron import BP in core_functions.
      Keeping a "response to" term derived from expression over-states the protein's participation,
      so this is marked as an over-annotation rather than accepted.
    supported_by:
    - reference_id: PMID:15107503
      supporting_text: Ys1 expression at both the mRNA and protein levels responds rapidly to changes
        in iron availability
    - reference_id: PMID:11201743
      supporting_text: Under iron-deficient conditions, ys1 messenger RNA levels increase in both
        roots and shoots.
    propagation_review:
      root_cause: SOURCE_WEAK_OR_INFERRED
      failure_modes:
      - SOURCE_EVIDENCE_WEAK
      - ROLE_CONFLATION
      source_entities:
      - source_id: AGI_LocusCode:AT4G24120
