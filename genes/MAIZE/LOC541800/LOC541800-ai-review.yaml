suggested_questions:
- question: >-
    Is GO:0015343 siderophore-iron transmembrane transporter activity the intended term for
    plant Fe(III)-phytosiderophore transporters? Its logical definition references the ChEBI
    grouping "substance with siderophore role", whereas ChEBI currently classes phytosiderophore
    (CHEBI:38155) as an iron chelator / iron ionophore; should phytosiderophores be placed under
    the siderophore role, or should GO add a phytosiderophore-specific child term?
- question: >-
    Does ZmYS1 transport zinc-phytosiderophore in vivo? Schaaf et al. (PMID:14699112) report
    Zn-PS transport in yeast and oocytes, whereas Roberts et al. (PMID:15107503) found no support
    for it.
- question: >-
    What substrate does the mesophyll plasma-membrane pool of ZmYS1 take up in leaves:
    Fe-nicotianamine, Fe-phytosiderophore delivered via the xylem, or other metal chelates?
suggested_experiments:
- hypothesis: The mesophyll ZmYS1 pool mediates Fe-nicotianamine uptake into leaf cells.
  description: >-
    Express ZmYS1 under a mesophyll-specific promoter in a ys1 background and compare leaf iron
    distribution and chlorosis with root-specific complementation; measure Fe-NA versus Fe-PS
    uptake into isolated mesophyll protoplasts from wild type and ys1.
  experiment_type: tissue-specific complementation and uptake assay
- hypothesis: Zinc-phytosiderophore is a physiological ZmYS1 substrate.
  description: >-
    Measure 65Zn-PS and 59Fe-PS uptake by roots of wild type and ys1 mutant seedlings under zinc
    and iron deficiency, and test purified ZmYS1 in proteoliposomes for Zn-PS transport.
  experiment_type: radiotracer uptake and reconstitution
