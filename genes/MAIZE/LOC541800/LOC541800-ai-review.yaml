id: A0A1D6HET4
gene_symbol: LOC541800
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  LOC541800 encodes Yellow stripe 1 (ZmYS1, ys1; NCBI GeneID 541800; the reviewed Swiss-Prot
  record for the same gene is YS1_MAIZE, Q9AY27), the founding member of the Yellow Stripe-Like
  (YSL) clade of the OPT (oligopeptide transporter) superfamily. It is a 682-residue integral
  membrane protein with 13 predicted transmembrane helices and a disordered N-terminus. ZmYS1 is
  the root-surface transporter through which maize, a Strategy II (chelation-strategy) grass, takes
  up iron as Fe(III)-phytosiderophore (mugineic acid) complexes: the ys1 mutant is deficient in
  Fe(III)-phytosiderophore uptake and shows interveinal chlorosis, and ZmYS1 expressed in an
  iron-uptake-deficient yeast restores growth specifically on Fe(III)-phytosiderophore. Transport
  is proton-coupled and driven by the membrane potential, which allows uptake even at alkaline
  soil pH. ZmYS1 has a broad substrate range: it also transports iron(II/III)- and
  nickel-nicotianamine complexes and copper- and nickel-phytosiderophores (zinc-phytosiderophore
  transport is reported by one laboratory and disputed by another); the extracellular loop between
  TM6 and TM7 determines this breadth compared with barley HvYS1. Expression rises in roots and
  shoots under iron deficiency but not under copper or zinc deficiency. In planta the protein sits
  at the plasma membrane, at the distal (soil-facing) side of epidermal cells of crown and lateral
  roots, and at the periphery of leaf mesophyll cells, consistent with roles in primary iron
  acquisition from the rhizosphere and in uptake of iron and other metal chelates within the plant.
