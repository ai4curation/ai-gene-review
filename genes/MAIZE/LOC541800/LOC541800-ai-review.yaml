- term:
    id: GO:0035673
    label: oligopeptide transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004813
  - InterPro:IPR045035
  review:
    summary: >-
      InterPro2GO transfer from the OPT superfamily; correct that ZmYS1 is a transmembrane
      transporter, wrong about the substrate. ZmYS1 is a proton-coupled Fe(III)-phytosiderophore
      and metal-nicotianamine transporter.
    action: MODIFY
    reason: >-
      The OPT superfamily (IPR004813) includes fungal and plant oligopeptide transporters, but the
      YSL subfamily (IPR045035, TC 2.A.67.2) to which ZmYS1 belongs transports metal chelates.
      ZmYS1 has been shown directly, in yeast complementation and Xenopus oocyte
      electrophysiology, to be a proton-coupled transporter of Fe(III)-phytosiderophore and also of
      Fe- and Ni-nicotianamine; no oligopeptide transport has been reported. Replace with
      GO:0015343 siderophore-iron transmembrane transporter activity (whose definition is
      siderophore-iron plus H+ symport, matching the proton-coupled mechanism) and GO:0051980
      iron-nicotianamine transmembrane transporter activity. Both are is_a children of GO:0015603
      iron chelate transmembrane transporter activity (checked with OAK), so this is a lateral
      substrate correction, not a refinement of the oligopeptide term. The InterPro2GO mapping of
      the YSL-like entry IPR045035 to oligopeptide transport is recorded as a source defect.
    proposed_replacement_terms:
    - id: GO:0015343
      label: siderophore-iron transmembrane transporter activity
    - id: GO:0051980
      label: iron-nicotianamine transmembrane transporter activity
    supported_by:
    - reference_id: PMID:14699112
      supporting_text: Our results show that ZmYS1 encodes a proton-coupled broad-range
        metal-phytosiderophore transporter that additionally transports Fe- and Ni-nicotianamine.
    - reference_id: PMID:15107503
      supporting_text: YS1 is able to translocate iron that is bound either by PS or by the related
        compound, nicotianamine
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: InterPro:IPR045035
      slot: InterPro2GO
      requested_change: REPOINT
      asserted_value: GO:0035673
      corrected_value: GO:0015603
      corrected_label: iron chelate transmembrane transporter activity
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        InterPro (InterPro2GO) maps the YSL-like entry IPR045035 to GO:0035673 oligopeptide
        transmembrane transporter activity. Characterized YSL members (maize YS1, barley HvYS1,
        rice OsYSL15, Arabidopsis YSL2) transport metal complexes of phytosiderophores or
        nicotianamine, which are not oligopeptides. The mapping for IPR045035 should be to iron
        chelate transmembrane transporter activity (GO:0015603) or removed; the oligopeptide
        mapping may remain appropriate for the broader OPT entry IPR004813 only if restricted to
        the non-YSL branch.
      supported_by:
      - reference_id: PMID:14699112
        supporting_text: Our results show that ZmYS1 encodes a proton-coupled broad-range
          metal-phytosiderophore transporter that additionally transports Fe- and Ni-nicotianamine.
- term:
    id: GO:0048316
    label: seed development
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - AGI_LocusCode:AT4G24120
  - AGI_LocusCode:AT5G53550
  - PANTHER:PTN001270331
  review:
    summary: >-
      Propagated from Arabidopsis YSL1/YSL3 genetic data on seed metal loading and fertility; no
      evidence connects ZmYS1 to seed development.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The seed-development claim rests on the Arabidopsis ysl1 ysl3 double mutant, whose reduced
      fertility and low seed metals reflect impaired delivery of metal-nicotianamine complexes from
      senescing leaves to seeds, i.e. a nutritional consequence of transport, not participation in
      the developmental program. Even for the Arabidopsis donors the term is an
      acts-upstream-of-or-within inference. For ZmYS1 there is no seed or embryo phenotype or seed
      expression study; the ys1 phenotype is iron-deficiency chlorosis of leaves, and the protein's
      documented roles are root Fe(III)-phytosiderophore uptake and mesophyll metal-chelate uptake.
      The propagation transfers a developmental context from a different YSL sub-lineage onto a
      root uptake transporter, so the row is marked as an over-annotation.
    supported_by:
    - reference_id: PMID:16815956
      supporting_text: the double mutant has reduced fertility due to defective anther and embryo
        development
    - reference_id: PMID:19549626
      supporting_text: ZmYS1 is involved in both primary Fe acquisition and intracellular transport
        of iron and other metals in maize
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - CONTEXT_OR_TISSUE_MISMATCH
      - ROLE_CONFLATION
      source_entities:
      - source_id: AGI_LocusCode:AT4G24120
        source_label: YSL1
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          ysl1 ysl3 double-mutant fertility and seed-metal defects; an indirect nutritional
          phenotype in Arabidopsis with no counterpart reported for ZmYS1.
      - source_id: AGI_LocusCode:AT5G53550
        source_label: YSL3
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Same double-mutant evidence as YSL1.
      - source_id: PANTHER:PTN001270331
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          Placing a seed-development process at the base of the whole YSL clade extends a
          phloem/seed-loading phenotype of one sub-lineage to the grass root uptake transporters.
