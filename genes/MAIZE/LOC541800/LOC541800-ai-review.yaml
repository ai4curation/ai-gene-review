      label: siderophore-iron import into cell
    supported_by:
    - reference_id: PMID:11201743
      supporting_text: Expression of YS1 in a yeast iron uptake mutant restores growth specifically
        on Fe(III)-phytosiderophore media.
    - reference_id: PMID:11201743
      supporting_text: The maize yellow stripe1 (ys1) mutant is deficient in Fe(III)-phytosiderophore
        uptake
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0035672
      corrected_value: GO:0033214
      corrected_label: siderophore-iron import into cell
