  review:
    summary: InterPro2GO mapping of the plant RBOH NADPH_Ox domain (IPR013623) to peroxidase
      activity. RBOH proteins are ROS-generating NADPH oxidases, not peroxidases.
    action: REMOVE
    reason: >-
      IPR013623 (NADPH_Ox) is the N-terminal regulatory region of plant respiratory burst
      oxidase homologues, next to the EF-hand Ca2+-sensing region. It has no peroxidase
      chemistry. RBOHs catalyse one-electron reduction of O2 by NADPH via FAD and two hemes
      in the ferric-reductase membrane domain, producing superoxide; no family member uses a
      hydroperoxide as substrate. This is a wrong electronic mapping, removed consistently
      with the Arabidopsis RBOHD and maize ZmrbohC reviews. The real catalytic activity is
      captured by the MODIFY of the oxidoreductase rows to GO:0106292.
    supported_by:
    - reference_id: PMID:11756663
      supporting_text: putative plant plasma membrane NADPH oxidase can produce superoxide
    - reference_id: PMID:19592501
      supporting_text: Likewise, TMD3 and TMD5 contained pairs of histidine residues that are
        important for haem binding in human gp91phox
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0004601
      confidence: PROBABLE
      explanation: >-
        InterPro2GO maps IPR013623 (NADPH_Ox, plant respiratory burst oxidase N-terminal
        domain) to GO:0004601 peroxidase activity. Plant RBOHs are superoxide-generating
        NADPH oxidases; the domain is a regulatory region without peroxidase activity. The
        mapping should be removed at InterPro (InterPro2GO), which would also remove the
        downstream GO_REF:0000108 inference of cellular oxidant detoxification.
