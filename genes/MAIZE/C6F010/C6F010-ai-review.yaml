- id: PMID:19592501
  title: Positive feedback regulation of maize NADPH oxidase by mitogen-activated protein
    kinase cascade in abscisic acid signalling.
  findings:
  - statement: Cloning of a 2972-bp ZmrbohD transcript encoding a 932-aa protein of 104.5 kDa,
      matching C6F010 (932 aa) and its 2972-bp EMBL record EU825209.
    supporting_text: A 2972 bp ZmrbohD transcript was also cloned, which had an ORF of 2799
      nucleotides, encoding a protein of 932 amino acids
  - statement: ZmrbohD is the most strongly ABA-induced of ZmrbohA-D in maize leaves, in both
      phases of a biphasic response whose second phase depends on H2O2 and a MAPK cascade.
    supporting_text: the expression of ZmrbohD in both phase I and phase II induced by ABA was
      the highest among these Zmrbohs genes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Identifies ZmrbohD with a 932-aa ORF and 2972-bp transcript
      matching C6F010/EU825209 (same authors as the EMBL submission). Membrane NADPH oxidase
      activity was measured in bulk leaf plasma membranes and is not attributed to ZmrbohD
      alone.
- id: PMID:20693409
  title: ZmMPK5 is required for the NADPH oxidase-mediated self-propagation of apoplastic
    H2O2 in brassinosteroid-induced antioxidant defence in leaves of maize.
  findings:
  - statement: ZmrbohD transcript (primers from EF364442, the beta splice variant of the same
      gene) is induced by brassinosteroid in maize leaves with ZmrbohA-C; the late induction
      depends on apoplastic H2O2 and ZmMPK5. Expression evidence only.
    supporting_text: BR treatment significantly elevated the expression of ZmrbohA–ZmrbohD in
      leaves of maize plants.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Measures transcripts of four Zmrboh genes and DPI-sensitive
      apoplastic H2O2; it does not attribute activity to the ZmrbohD protein. EF364442 and
      the C6F010 source EU825209 both link to NCBI GeneID 100136880 (checked via NCBI
      E-utilities).
- id: PMID:38238629
  title: The ZmWAKL-ZmWIK-ZmBLK1-ZmRBOH4 module provides quantitative resistance to gray
    leaf spot in maize.
  findings:
  - statement: ZmRBOH4, the maize RBOH closest to AtRBOHD, binds and is phosphorylated on its
      N-terminal domain by ZmBLK1; knockouts show reduced pathogen-induced ROS burst, reduced
      plant height and increased gray leaf spot susceptibility.
    supporting_text: In maize genome, six RBOHs were identified, of which ZmRBOH4 was the most
      closely related to AtRBOHD with 63.3% sequence identity
  - statement: ZmBLK1 phosphorylates the ZmRBOH4 N-terminus in vitro.
    supporting_text: ZmBLK1-GST strongly phosphorylated His-N-ZmRBOH4
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Full text read. No gene identifier for ZmRBOH4 appears in the cached text.
      C6F010 is the closest maize homologue of AtRBOHD in our alignment and NCBI gives GeneID
      100136880 the designation "respiratory burst oxidase4", so ZmRBOH4 is probably this
      locus, but this is not confirmed; the paper is therefore not used to support
      annotations.
- id: PMID:11756663
  title: Arabidopsis gp91phox homologues AtrbohD and AtrbohF are required for accumulation
    of reactive oxygen intermediates in the plant defense response.
  findings:
  - statement: Superoxide is the proximal product of plant plasma membrane NADPH oxidases.
    supporting_text: putative plant plasma membrane NADPH oxidase can produce superoxide
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Arabidopsis RBOHD ortholog paper; family-level support for the activity and
      location.
- id: PMID:18218618
  title: Synergistic activation of the Arabidopsis NADPH oxidase AtrbohD by Ca2+ and
    phosphorylation.
  findings:
  - statement: Ca2+ binding to the EF-hand motifs of AtrbohD activates its ROS production,
      synergistically with phosphorylation.
    supporting_text: This activation required a conformational change in the EF-hand region,
      as a result of Ca(2+) binding to the EF-hand motifs.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Arabidopsis RBOHD (closest homologue); supports the EF-hand regulatory
      mechanism.
