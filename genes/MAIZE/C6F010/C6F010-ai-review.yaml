  review:
    summary: Generic membrane location from InterPro/SubCell; true, but the specific
      compartment is the plasma membrane.
    action: MODIFY
    reason: >-
      C6F010 has Phobius-predicted transmembrane helices within the ferric-reductase membrane
      domain, so membrane is correct but uninformative. Plant RBOHs, including the closest
      homologue Arabidopsis RBOHD, are plasma membrane enzymes; the maize NADPH oxidase
      activity regulated with ZmrbohD expression was measured in leaf plasma membrane
      vesicles, and the product accumulates in the apoplast. The specific location is plasma
      membrane (GO:0005886, is_a membrane, checked with OAK).
