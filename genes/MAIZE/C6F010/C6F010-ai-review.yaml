id: C6F010
gene_symbol: C6F010
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  C6F010 is the alpha splice variant of maize ZmrbohD (locus Zm00001d052653 /
  GRMZM2G441541, NCBI GeneID 100136880, designated "respiratory burst oxidase4"), a
  932-amino-acid respiratory burst oxidase homologue (plant NADPH oxidase, gp91phox/NOX2
  family) whose closest Arabidopsis homologue is RBOHD. It has a cytosolic N-terminal
  regulatory extension (NADPH_Ox domain with an EF-hand Ca2+-binding region), a multi-pass
  ferric-reductase transmembrane domain with four conserved heme-coordinating histidines,
  and C-terminal cytosolic FAD- and NADPH-binding domains. By homology with Arabidopsis
  RBOHD it is a plasma membrane enzyme that transfers electrons from cytosolic NADPH across
  the membrane to O2, producing apoplastic superoxide that dismutates to H2O2, with activity
  stimulated by Ca2+ binding and phosphorylation. ZmrbohD transcript is the most strongly
  abscisic acid-induced of the four maize rboh genes first cloned, and is also induced by
  H2O2 and brassinosteroid as part of an H2O2-ZmMPK5 amplification loop. A maize RBOH
  named ZmRBOH4, described as the closest homologue of AtRBOHD and probably this locus, is
  phosphorylated by the receptor-like cytoplasmic kinase ZmBLK1 downstream of the
  ZmWAKL-ZmWIK receptor complex and is required for the pathogen-induced ROS burst and
  quantitative resistance to gray leaf spot. No direct biochemical assay of the ZmrbohD
  protein has been reported.
