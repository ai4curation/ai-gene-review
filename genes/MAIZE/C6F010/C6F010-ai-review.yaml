    label: cellular oxidant detoxification
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0004601
  review:
    summary: Inferred automatically from the incorrect peroxidase activity row. ZmrbohD
      produces ROS; it does not detoxify them.
    action: REMOVE
    reason: >-
      This GO_REF:0000108 inference rests solely on GO:0004601 peroxidase activity, a wrong
      InterPro2GO mapping for this family (see that row). An NADPH oxidase generates
      superoxide and H2O2; removing their toxicity is the opposite of its activity. The
      induction of antioxidant enzymes downstream of NADPH oxidase-derived H2O2 in
      brassinosteroid-treated maize leaves (PMID:20693409) is a signalling consequence
      carried out by other enzymes, not participation of ZmrbohD in detoxification.
    supported_by:
    - reference_id: PMID:20693409
      supporting_text: These results suggest that BR-induced apoplastic H2O2 accumulation can
        induce NADPH oxidase gene expression to produce more H2O2 in BR signalling.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      slot: GO_ID
      requested_change: DELETE_ROW
      asserted_value: GO:0098869
      confidence: PROBABLE
      explanation: >-
        GO_REF:0000108 inter-ontology inference of cellular oxidant detoxification from
        GO:0004601 peroxidase activity, which itself comes from an incorrect InterPro2GO
        mapping of IPR013623 (plant RBOH N-terminal domain). The gene is a
        superoxide-generating NADPH oxidase; the row disappears once the peroxidase mapping
