core_functions:
- description: >-
    Plasma membrane NADPH oxidase that transfers electrons from cytosolic NADPH via FAD and
    two hemes to extracellular O2, generating apoplastic superoxide (and hence H2O2) used as
    a signal in hormone (ABA, brassinosteroid) and pathogen responses. Activity is inferred
    from the conserved RBOH architecture and the closest ortholog Arabidopsis RBOHD; its
    regulation by Ca2+ (EF-hands) and phosphorylation is likewise inferred from RBOHD.
  molecular_function:
    id: GO:0106292
    label: superoxide-generating NADPH oxidase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19592501
    supporting_text: Likewise, TMD3 and TMD5 contained pairs of histidine residues that are
      important for haem binding in human gp91phox
  - reference_id: PMID:11756663
    supporting_text: putative plant plasma membrane NADPH oxidase can produce superoxide
  - reference_id: file:MAIZE/C6F010/C6F010-bioinformatics/RESULTS.md
    supporting_text: The closest Arabidopsis homologue of C6F010 is RBOHD (Q9FIJ0), at 67.4%
suggested_questions:
- question: Is ZmRBOH4 of Zhong et al. 2024 (PMID:38238629) the same locus as
    ZmrbohD/C6F010 (Zm00001d052653, GeneID 100136880)? If so, the ZmBLK1 phosphorylation,
    ROS-burst and gray leaf spot data would support annotating its role in the
    pathogen-triggered ROS burst (for example respiratory burst involved in defense
    response), since the enzyme itself produces the ROS.
- question: Do the alpha (C6F010, 932 aa) and beta splice variants of ZmrbohD differ in
    activity or regulation, and which predominates in leaves?
suggested_experiments:
- description: Express ZmrbohD (alpha variant) in HEK293T cells and measure superoxide
    production (L-012 chemiluminescence, with SOD controls) after ionomycin treatment, with
    EF-hand mutants and with or without co-expressed ZmBLK1.
  experiment_type: heterologous expression and ROS assay
- description: Localize a fluorescent-protein-tagged ZmrbohD in maize protoplasts with a
    plasma membrane marker.
  experiment_type: subcellular localization
