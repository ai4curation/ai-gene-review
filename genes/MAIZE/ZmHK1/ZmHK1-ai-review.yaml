- term:
    id: GO:0019955
    label: cytokine binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028712
  review:
    summary: >-
      Wrong term: ZmHK1 binds cytokinins (adenine-derived plant hormones), not cytokines
      (animal signalling proteins).
    action: REMOVE
    reason: >-
      Cytokines are proteins of the animal immune system; plants have none, and ZmHK1 binds
      cytokinins such as iP, trans- and cis-zeatin [PMID:21778179]. The ARBA rule
      evidently maps cytokinin receptors to cytokine binding; the correct term is GO:0044373
      cytokinin binding, proposed as a NEW IDA row. The cytokinin-binding claim is captured by
      that row and by the MODIFY of the hormone binding row.
    supported_by:
    - reference_id: PMID:21778179
      supporting_text: ZmHK1 bound tZ and cZ almost equally well with moderate affinity
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: ARBA:ARBA00028712
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0019955
      corrected_value: GO:0044373
      corrected_label: cytokinin binding
      confidence: CONFIRMED
      explanation: >-
        ARBA00028712 assigns GO:0019955 cytokine binding to the plant cytokinin receptor
        ZmHK1 (Q9FRY7). Cytokines are animal signalling proteins; the ligands of CHASE-domain
        histidine kinases are cytokinins (adenine-derived hormones), for which the correct
        term is GO:0044373 cytokinin binding. The rule output should be repointed (or the
        GO mapping removed).
      supported_by:
      - reference_id: PMID:21778179
        supporting_text: ZmHK1 bound tZ and cZ almost equally well with moderate affinity
    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:Q9FRY7
      slot: CC FUNCTION
      requested_change: CHECK
      asserted_value: ARBA:ARBA00002427
      confidence: PROBABLE
      explanation: >-
        The ARBA-assigned FUNCTION comment on Q9FRY7 says the receptor "transmits the stress
        signal to a downstream MAPK cascade". That wording comes from osmosensing histidine
        kinases (AHK1/ATHK1-type); no study reports a MAPK cascade downstream of ZmHK1, which
        signals through a His-Asp phosphorelay to response regulators. Please check whether
        this part of the rule should be excluded for CRE1/AHK4-subfamily cytokinin receptors.
