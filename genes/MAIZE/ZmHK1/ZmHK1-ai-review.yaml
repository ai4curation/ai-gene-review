gene_symbol: ZmHK1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  ZmHK1 (Zea mays histidine kinase 1) is a cytokinin receptor of the CRE1/AHK4 subfamily of
  plant sensor histidine kinases. The 974-residue protein has an N-terminal transmembrane
  region enclosing an extracytoplasmic CHASE cytokinin-binding domain, followed by a
  cytoplasmic histidine kinase domain (autophosphorylated His369) and a C-terminal receiver
  domain (Asp880). It binds free-base cytokinins with nanomolar affinity, preferring
  isopentenyladenine and, unlike Arabidopsis AHK4, binding trans- and cis-zeatin about
  equally; cytokinin ribosides and dihydrozeatin are weak ligands and binding is strongly
  pH-dependent. Ligand binding activates the kinase and initiates a His-Asp phosphorelay
  through histidine phosphotransfer proteins to response regulators, inducing type-A
  response regulator genes such as ZmRR1. Endogenous ZmHK1 and GFP fusions localize mainly
  to the endoplasmic reticulum membrane (and nuclear envelope), with at most a minor plasma
  membrane pool, so that much cytokinin perception occurs at the ER. Semidominant
  gain-of-function alleles in its ligand-binding domain (Hairy Sheath Frayed1) cause
  cytokinin hypersignalling and ectopic proximal leaf tissue (sheath, auricle, ligule) on
  the blade margin.
