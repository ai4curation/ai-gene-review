core_functions:
- description: >-
    Endoplasmic reticulum membrane-resident cytokinin receptor histidine kinase. The CHASE
    input domain binds free-base cytokinins (iP > tZ = cZ) with nanomolar affinity, which
    activates autophosphorylation of the HisKA domain and phosphotransfer through the
    receiver domain into a His-Asp phosphorelay that induces cytokinin-responsive type-A
    response regulator genes.
