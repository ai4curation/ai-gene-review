- id: PMID:15064375
  title: Molecular characterization of cytokinin-responsive histidine kinases in maize.
    Differential ligand preferences and response to cis-zeatin.
  findings:
  - statement: ZmHK1 confers cytokinin-dependent cps::lacZ induction on an E. coli rcsC mutant,
      with iP the most effective ligand and free bases stronger than ribosides.
    supporting_text: Among them, iP was the most effective activator.
  - statement: Unlike AHK4, ZmHK1 responds to cis-zeatin about as well as to trans-zeatin.
    supporting_text: Analysis of the dose-response relationship showed that the sensitivity
      of ZmHK1 to cZ was comparable to that to tZ
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC419839). Primary cloning and functional complementation
      paper for ZmHK1; source of the AgBase IDA/RCA rows.
- id: PMID:21778179
  title: Ligand-binding properties and subcellular localization of maize cytokinin receptors.
  findings:
  - statement: Direct [3H]tZ binding to ZmHK1 with nanomolar apparent KD; tZ and cZ bound almost
      equally; DZ weak; adenine inactive.
    supporting_text: ZmHK1 bound tZ and cZ almost equally well with moderate affinity
  - statement: Endogenous ZmHK1 and ZmHK1-GFP localize predominantly to the ER membrane.
    supporting_text: Taken together, our results suggest that ZmHKs are localized predominantly
      in the ER membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC3193018). Key paper for direct ligand binding and ER
      localization of ZmHK1.
- id: PMID:25609827
  title: Plant membrane assays with cytokinin receptors underpin the unique role of free cytokinin
    bases as biologically active ligands.
  findings:
  - statement: In a plant membrane assay ZmHK1 binds trans- and cis-zeatin equally; binding
      rises with pH to a maximum at pH 9.
    supporting_text: However, with increasing pH, a steady rise in cytokinin binding to ZmHK1
      was observed, reaching a maximum at pH 9.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC4378623). Confirms binding properties in planta-like
      membranes; proposes a pH-sensing role (speculative).
- id: PMID:32205456
  title: The Maize Hairy Sheath Frayed1 (Hsf1) Mutation Alters Leaf Patterning through Increased
    Cytokinin Signaling.
  findings:
  - statement: Hsf1 alleles are gain-of-function missense mutations in the ZmHK1 ligand-binding
      domain that cause cytokinin hypersignalling and leaf proximal-distal patterning defects.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only in cache (PMC7203929 exists). PubMed-verified title and
      authorship. Phenotype evidence; not used to add developmental process terms.
- id: PMID:15728338
  title: Topolins and hydroxylated thidiazuron derivatives are substrates of cytokinin O-glucosyltransferase
    with position specificity related to receptor recognition.
  findings:
  - statement: ZmHK1 responds to cis-zeatin and o-topolin in the bacterial receptor assay, which
      AHK4 does not.
  reference_review:
