- term:
    id: GO:0005789
    label: endoplasmic reticulum membrane
  evidence_type: IDA
  original_reference_id: PMID:21778179
  qualifier: located_in
  review:
    summary: >-
      ZmHK1 resides predominantly in the ER membrane: endogenous protein co-fractionates with
