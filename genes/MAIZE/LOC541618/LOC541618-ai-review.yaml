  review:
    summary: MAP kinase activity (EC 2.7.11.24) from InterPro MAP kinase signature; this is the core molecular
      function of ZmMPK5.
    action: ACCEPT
    reason: 'K7VAM9 carries the MAP kinase conserved site (PS01351), the TEY activation-loop motif (Thr225-Glu226-Tyr227),
      the ATP-binding lysine and HRD catalytic aspartate. Experimentally, ZmMPK5 immunoprecipitated from
      maize leaves (with an antibody against the exact C-terminal 20 residues of K7VAM9) phosphorylates
      the classic MAPK substrate MBP and is activated by ABA, BR and H2O2 in a MAPKK-inhibitor-sensitive
      way; the immunocomplex also phosphorylates ZmMAP65-1a and ZmABA2 (Ser173). Immunocomplex assays
      cannot fully exclude co-precipitating kinases, but together with the sequence evidence the activity
      is well established. The ZmMPK5 of these papers is this locus: NCBI Gene 541618 lists ZmMPK5 as
      an alias, and the papers cite the ZmMPK5 cDNA AB016802, whose translation matches K7VAM9.'
    supported_by:
