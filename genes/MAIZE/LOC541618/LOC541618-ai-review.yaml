id: K7VAM9
gene_symbol: LOC541618
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: LOC541618 encodes ZmMPK5 (NCBI Gene 541618; aliases MPK5, MPK6-2), a 398-residue TEY-type
  mitogen-activated protein kinase of maize, most similar to Arabidopsis MPK6 (group A plant MAPKs). It
  has a disordered N-terminal extension, a canonical Ser/Thr protein kinase domain with the ATP-binding
  lysine and HRD catalytic aspartate, and a Thr-Glu-Tyr activation-loop motif whose dual phosphorylation
  by an upstream MAP kinase kinase activates the enzyme. In maize leaves ZmMPK5 kinase activity (measured
  on myelin basic protein) rises during senescence and after recovery from cold, and is induced by abscisic
  acid, brassinosteroid and hydrogen peroxide. ZmMPK5 phosphorylates the microtubule-associated protein
  ZmMAP65-1a and the xanthoxin dehydrogenase ZmABA2 (at Ser173, increasing its activity and stability),
  and is implicated in a positive feedback loop that amplifies apoplastic H2O2 production by NADPH oxidases
  and up-regulates antioxidant defences, and in the control of ABA content. It is found in the nucleus
  and cytoplasm. Overexpression in tobacco enhances salt and oxidative stress tolerance and pathogen-defence
  gene expression.
