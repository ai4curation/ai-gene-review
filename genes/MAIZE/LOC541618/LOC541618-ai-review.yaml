    label: MAPK cascade
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0004707
  review:
    summary: MAPK cascade inferred from the MAP kinase activity row; ZmMPK5 is a TEY-type MAP kinase whose
      activation in maize leaves depends on upstream MAPKK activity.
    action: ACCEPT
    reason: 'Acting as the terminal kinase of a MAPK cascade is the core process role of a MAP kinase.
      For ZmMPK5 this is supported by sequence (TEY activation-loop motif, MAP kinase signature) and by
      experiment: brassinosteroid- and H2O2-induced activation of immunoprecipitated ZmMPK5 is blocked
      by the MAPKK inhibitors PD98059 and U0126. The upstream MAPKK has not been identified, but participation
      in a MAPK cascade is the defining role of the protein.'
    supported_by:
    - &id009
      reference_id: PMID:20693409
      supporting_text: It was found that the BR-induced initial apoplastic H2O2 production activates ZmMPK5,
        which is involved in the self-propagation of apoplastic H2O2 via the regulation of NADPH oxidase
        gene expression in the BR-enhanced antioxidant defence systems.
    - &id001
      reference_id: PMID:20693409
      supporting_text: Kinase activity in the immunocomplex was determined by an in-gel kinase assay as
        described above.
    - &id002
      reference_id: file:MAIZE/LOC541618/LOC541618-bioinformatics/RESULTS.md
      supporting_text: 'Activation-loop phosphorylation motif TEY at 225 (Thr225-Glu226-Tyr227): a TEY-type
