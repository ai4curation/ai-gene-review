suggested_questions:
- question: Which maize MAPKK(s) phosphorylate the TEY motif of ZmMPK5 in ABA and brassinosteroid signalling,
    given that the evidence so far rests on PD98059/U0126 inhibitor sensitivity?
- question: Is the reported contribution of ZmMPK5 to apoplastic H2O2 amplification and ABA accumulation
    direct (via substrates such as ZmABA2 and transcription factors controlling rboh genes) or indirect,
    and would a GO term such as brassinosteroid-mediated signaling be justified once genetic (mutant)
    evidence exists?
- question: Does the GenBank AB016802 ZmMPK5 cDNA sequence, which lacks the conserved VAIK ATP-binding
    lysine present in the genome-derived K7VAM9 model, contain a sequencing error?
suggested_experiments:
- description: Assay recombinant ZmMPK5 (wild type, kinase-dead K97R, and T225A/Y227F activation-loop
    mutant) with an upstream constitutively active MAPKK on ZmABA2 and ZmMAP65-1a, to confirm that phosphorylation
    is intrinsic to ZmMPK5 rather than to co-immunoprecipitated kinases.
- description: Generate CRISPR knockout lines of LOC541618 in maize and test BR- and ABA-induced antioxidant
    enzyme activity, apoplastic H2O2 accumulation and ABA content, to replace inhibitor- and protoplast-based
    evidence with genetic evidence.
