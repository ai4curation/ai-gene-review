core_functions:
- description: TEY-type MAP kinase that, once activated by dual Thr/Tyr phosphorylation by an upstream
    MAPKK in response to ABA, brassinosteroid and H2O2, phosphorylates Ser/Thr-Pro sites on substrate
    proteins such as ZmMAP65-1a and the xanthoxin dehydrogenase ZmABA2, acting as the terminal kinase
    of a MAPK cascade.
