    Membrane-anchored cytochrome P450 flavonoid 3'-hydroxylase that 3'-hydroxylates the
    flavonoid B-ring, directing flux to cyanidin anthocyanins in the aleurone and to
    luteoforol-derived phlobaphenes and maysin in pericarp, cob glumes and silks.
