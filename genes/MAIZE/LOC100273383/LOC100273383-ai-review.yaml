  label: Zea mays
description: >-
  LOC100273383 is the maize pr1 (red aleurone1) gene, encoding ZmF3'H1 (CYP75B3), a
  membrane-anchored cytochrome P450 flavonoid 3'-hydroxylase (flavonoid 3'-monooxygenase,
  EC 1.14.14.82). The heme-thiolate enzyme adds a hydroxyl group at the 3' position of the
  flavonoid B-ring, converting 4'-hydroxylated intermediates such as naringenin and
  dihydrokaempferol into their 3',4'-dihydroxylated counterparts. In the kernel aleurone,
  where its expression depends on the C1/R1 anthocyanin regulators, it is required for
  purple cyanidin-based anthocyanins; pr1 mutants accumulate red pelargonidin pigments
  instead. Under the control of the MYB factor P1 it also acts in the 3-deoxyflavonoid
  branch in pericarp, cob glumes and silks, where it is needed for luteoforol-derived
  phlobaphenes and for the C-glycosyl flavone maysin (rather than apimaysin), a silk
  compound that slows corn earworm larval growth. The maize gene complements the
  Arabidopsis tt7 F3'H mutant.
