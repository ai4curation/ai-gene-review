- term:
    id: GO:0009813
    label: flavonoid biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:21385724
  qualifier: involved_in
  review:
    summary: ZmF3'H1 catalyses the B-ring 3'-hydroxylation step of flavonoid biosynthesis in
      both the anthocyanin and 3-deoxyflavonoid branches.
    action: NEW
    reason: >-
      This passes the participation bar: the gene product itself performs a step of the
      pathway (3'-hydroxylation), as shown by loss-of-function alleles that change product
      structure and by tt7 complementation. The parent flavonoid biosynthetic process is
      chosen rather than anthocyanin-containing compound biosynthetic process because the
      enzyme acts in both the 3-hydroxy (anthocyanin) and 3-deoxy (phlobaphene, maysin)
      branches. Comparator: biosynthetic enzymes of the pathway such as Arabidopsis TT7,
      the F3'H that ZmF3'H1 replaces in tt7, are the kind of gene product GO annotates to
      flavonoid biosynthesis.
    supported_by:
    - reference_id: PMID:21385724
      supporting_text: Finally, the identification of a Ds-induced insertion reveals independently
        the role of Zmf3′h1 in producing purple cyanidin glycosides from red pelargonidin glycosides.
    - reference_id: PMID:23113982
      supporting_text: Through the genetic and biochemical analysis of well-defined genetic stocks
        with combination of pr1 and p1 alleles we demonstrate that P1 regulated biosynthesis
        of 3-deoxyflavonoids in pericarps, cob glumes, and silks requires a functional Zmf3’h1
        gene.
