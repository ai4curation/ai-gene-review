suggested_questions:
- question: Which substrates (naringenin, dihydrokaempferol, apigenin, apimaysin precursors)
    does recombinant ZmF3'H1 hydroxylate, and with what kinetics?
- question: Is ZmF3'H1 localized to the ER membrane like dicot F3'Hs, and does it associate with
    other flavonoid enzymes in a metabolon?
suggested_experiments:
- description: Express ZmF3'H1 with an NADPH-P450 reductase in yeast microsomes and assay
    3'-hydroxylation of naringenin, dihydrokaempferol and apigenin by LC-MS.
  experiment_type: heterologous expression and enzyme assay
- description: Transient expression of a ZmF3'H1-GFP fusion with an ER marker in maize or
    Nicotiana benthamiana cells to determine subcellular localization.
  experiment_type: subcellular localization
