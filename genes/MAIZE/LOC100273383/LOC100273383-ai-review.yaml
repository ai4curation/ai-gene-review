  review:
    summary: Core activity. Although this row rests on an ARBA/EC mapping, the activity is
      independently established for pr1 by complementation and mutant chemistry.
    action: ACCEPT
    reason: >-
      Zmf3'h1 (GRMZM2G025832, this locus) rescues Arabidopsis tt7, restoring cyanidin
      glycosides; a Ds insertion and natural pr1 alleles shift aleurone pigments from
      cyanidin to pelargonidin, cob glume flavan-4-ols from luteoforol to apiforol, and silk
      flavones from maysin to apimaysin, all differing only by the B-ring 3'-hydroxyl. No
      in vitro assay with recombinant protein is published, but the genetic and chemical
      evidence for 3'-hydroxylation is consistent across tissues and branches.
    supported_by:
    - reference_id: PMID:21385724
      supporting_text: 'The isolated Zmf3′h1 sequence corresponds to GRMZM2G025832, an annotated
