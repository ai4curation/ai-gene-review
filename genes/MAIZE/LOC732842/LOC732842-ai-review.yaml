id: K7TTR0
gene_symbol: LOC732842
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  LOC732842 (NCBI Gene "orange pericarp 1", orp1; TSB1) encodes one of two nearly identical
  chloroplast tryptophan synthase beta subunits (TrpB family, type 1) of maize; the other is
  encoded by the unlinked duplicate orp2 (TSB2). The 474-residue precursor carries an
  N-terminal plastid-targeting sequence and a pyridoxal 5'-phosphate (PLP)-dependent
  tryptophan synthase beta domain with the conserved PLP-binding lysine (K169). Recombinant
  mature TSB1 alone catalyzes the beta-reaction of tryptophan synthase, the PLP-dependent
  condensation of indole with L-serine to L-tryptophan and water, and forms beta2 homodimers.
  With the plastid alpha subunit ZmTSA it assembles an alpha2beta2 heterotetramer (about
  160 kD) that performs the overall conversion of indole-3-glycerol phosphate and L-serine to
  L-tryptophan, the last step of tryptophan biosynthesis; complex formation raises the
  catalytic efficiency of the alpha-reaction about 30-fold, while the beta-reaction is not
  significantly activated. A complex of this size with alpha and beta activity is present in
  maize leaves. TSB1 and TSB2 are functionally redundant: either single mutant is normal,
  whereas the orp1 orp2 double mutant lacks tryptophan synthase beta activity, accumulates
  anthranilate and indole, and is a seedling-lethal tryptophan auxotroph. Both genes are
  expressed in all tissues examined.
