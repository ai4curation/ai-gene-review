  title: The maize auxotrophic mutant orange pericarp is defective in duplicate genes for
    tryptophan synthase beta.
  full_text_unavailable: true
  findings:
  - statement: orp1 and orp2 are duplicate structural genes for tryptophan synthase beta; the
      double mutant is a seedling-lethal tryptophan auxotroph lacking beta activity.
    supporting_text: Together, the biochemical, genetic, and molecular data verify the identity
      of orp1 and orp2 as duplicate structural genes for the beta subunit of tryptophan
      synthase.
  - statement: Both genes are expressed in all tissues examined.
    supporting_text: RNA analysis indicates that both genes are expressed in all tissues
      examined from normal plants.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in the cache (Wright et al. 1992, Plant Cell 4:711; PubMed-verified). It is
      the source of the Swiss-Prot TSB1 cDNA P43283 (its RX line) and of the orp1/orp2
      genetic identification.
- id: PMID:20701934
  title: Plants contain two distinct classes of functional tryptophan synthase beta proteins.
  full_text_unavailable: true
  findings:
  - statement: Plants also contain type-2 TSBs, only distantly related to the type-1 TSBs
      that form tryptophan synthase complexes; the maize TSBtype2 studied is a different gene.
    supporting_text: While type 1 enzymes are well established as components of tryptophan
      synthase complexes, type 2 enzymes in plants have not yet been characterized.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Abstract only. Cited to separate TSB1 (type 1, this gene; HAMAP MF_00133, TIGR00263)
      from the maize type-2 TSB.
