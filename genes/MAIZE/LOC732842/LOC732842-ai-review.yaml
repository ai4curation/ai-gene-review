- id: PMID:18430213
  title: Characterisation of the tryptophan synthase alpha subunit in maize.
  findings:
  - statement: Recombinant mature ZmTSB1 (this gene product) was expressed without its
      plastid-targeting sequence and its beta-reaction kinetics measured alone and with ZmTSA.
    supporting_text: The kinetic parameters of ZmTSA, ZmTSB1, and ZmTSA/ZmTSB1 heteromers
      were determined (Table 1).
  - statement: ZmTSA and ZmTSB1 assemble a 1:1 alpha2beta2 heterotetramer in vitro.
    supporting_text: These results are consistent with formation of a ZmTSA2ZmTSB12
      heterotetramer.
  - statement: TSB1 alone forms beta2 homodimers and does not associate with the other maize
      TSA homologs.
    supporting_text: No interaction of ZmTSB1 with ZmTSAlike, BX1, or IGL was detectable.
  - statement: ZmTSA and TSB1 are constituents of the native tryptophan synthase complex in
      leaves (but see review_notes on peptide specificity).
    supporting_text: In summary, ZmTSA and ZmTSB1 were identified by LC-ESI-ToF-MSas
      constituents of TS complexes.
  - statement: TSB1 and TSB2 are functionally redundant active beta subunits.
    supporting_text: ZmTSB1 and ZmTSB2 are functionally redundant active TSB enzymes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC2395261, Kriechbaumer et al. 2008, BMC Plant Biol 8:44). The paper
      equates Zmtsb1 with orp1, the locus that NCBI Gene assigns to GeneID 732842 (K7TTR0);
      the recombinant beta-subunit work is on ZmTSB1. The peptide QALNVFR that the authors
      call ZmTSB1-specific is also present in the TSB2 paralog K7TR93 (own analysis), so the
      in-planta MS result does not discriminate the paralogs, although the recombinant work
      and the tsb2 single-mutant extracts do concern TSB1.
