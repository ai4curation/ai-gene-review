  review:
    summary: >-
      Combined electronic assignment of tryptophan synthase activity (EC 4.2.1.20) from
      TrpB-family InterPro signatures and an ARBA rule.
    action: ACCEPT
    reason: >-
      The term is true of TSB1 as a subunit of the alpha2beta2 complex (same claim as the IBA
      row, accepted on the same evidence). The qualifier is not right: the beta subunit cannot
      convert indole-3-glycerol phosphate and serine to tryptophan on its own, because the
      alpha subunit performs the cleavage that releases indole. The overall reaction should be
      contributes_to, as on the IBA row; the subunit's own activity is the beta-reaction
      (GO:0052684, added as a NEW row). GO:0004834 and GO:0052684 are sibling hydro-lyase
      terms (both direct is_a children of GO:0016836 hydro-lyase activity, checked in OLS),
      neither an ancestor of the other, so this row cannot be MODIFIED to a more specific
      term. The qualifier is recorded as an upstream defect.
    supported_by:
    - reference_id: PMID:18430213
      supporting_text: Indole, which is formed from IGP by the α-subunits is channelled to
        β-subunits, which synthesize tryptophan from indole and serine.
    - reference_id: PMID:18430213
      supporting_text: Heteromerisation with ZmTSB1 resulted in a 32-fold increase of the
        catalytic efficiency of ZmTSA.
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: CHECK
      asserted_value: enables
      corrected_value: contributes_to
      cause: UNKNOWN
      confidence: PROBABLE
      explanation: >-
        GO:0004834 tryptophan synthase activity (EC 4.2.1.20; IGP + L-serine = L-tryptophan +
        G3P + H2O) is the reaction of the alpha2beta2 complex. The TrpB-family beta subunit
        (K7TTR0, maize TSB1/orp1) catalyzes on its own only the beta-reaction (indole +
        L-serine = L-tryptophan + H2O) and depends on the alpha subunit ZmTSA for indole
        formation (PMID:18430213). The GO_Central IBA on the same protein already uses
        contributes_to. Please consider contributes_to for GO:0004834 assigned through the
        combined IEA pipeline to TrpB-family subunits of the complex.
      supported_by:
      - reference_id: PMID:18430213
        supporting_text: Indole, which is formed from IGP by the α-subunits is channelled to
          β-subunits, which synthesize tryptophan from indole and serine.
