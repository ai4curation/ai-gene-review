    Chloroplast tryptophan synthase beta subunit. TSB1 catalyzes the PLP-dependent
    beta-reaction, condensing indole with L-serine to L-tryptophan, and as part of the
    alpha2beta2 complex with ZmTSA it contributes to the overall tryptophan synthase reaction
