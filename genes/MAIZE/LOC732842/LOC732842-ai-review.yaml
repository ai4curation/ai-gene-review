suggested_questions:
- question: >-
    Should complex-forming (type-1) TrpB subunits carry GO:0052684 (the beta-reaction) as
    their own activity, with GO:0004834 as contributes_to? Reference type-1 TSBs (E. coli
    TrpB, Arabidopsis TSB1, yeast TRP5) are annotated only to GO:0004834, mostly with enables.
- question: >-
    GO has no cellular-component term for the tryptophan synthase alpha2beta2 complex. Should
    one be requested so that the maize TSA and TSB subunits can be annotated to it?
- question: >-
    Do free TSB1 beta2 dimers, which are active without ZmTSA, contribute significantly to
    tryptophan formation in vivo (for example by salvaging indole released by BX1 or IGL), or
    is essentially all flux through the alpha2beta2 complex?
suggested_experiments:
- description: >-
    Localize a full-length TSB1-GFP fusion in maize protoplasts and determine its sub-plastid
    location (stroma versus membrane) by chloroplast fractionation, and map the transit
    peptide cleavage site by N-terminal sequencing of the native protein.
  experiment_type: subcellular localization
- description: >-
    Use paralog-discriminating peptides (positions that differ between TSB1 and TSB2) in
    targeted mass spectrometry of the native 160 kD complex, to show directly which beta
    paralogs occupy the complex in wild-type leaves.
  experiment_type: proteomics
- description: >-
    Feed labelled indole to bx1 igl and orp1 single mutants and measure incorporation into
    tryptophan, to estimate the contribution of free TSB beta2 dimers to indole salvage.
  experiment_type: metabolic labelling
