  review:
    summary: >-
      Proposed annotation of the beta-reaction (indole + L-serine = L-tryptophan + H2O), the
      activity the beta subunit performs on its own.
    action: NEW
    reason: >-
      TSB1 itself performs this step. Purified recombinant mature ZmTSB1 alone converts indole
      and serine to tryptophan (Table 1 of PMID:18430213: indole Km 24 µM, kcat 0.29 s-1), and
      this activity is not significantly changed by ZmTSA. In leaf extracts of the tsb2 single
      mutant, where TSB1 is the only beta subunit, beta activity is present in both the beta2
      dimer and the alpha2beta2 fractions. The PLP lysine is conserved (K169; bioinformatics
      RESULTS.md). This is the subunit's own established catalytic activity, recorded beside
      the contributes_to row for the overall complex reaction. Comparator check (as in the
      LOC732803 TSB2 review): E. coli TrpB, Arabidopsis TSB1 and yeast TRP5 carry GO:0004834
      but not GO:0052684, so curators have tended to annotate complex-forming TSBs only with
      the overall reaction; the term definition nonetheless describes exactly the reaction this
      subunit catalyzes alone, and it is a sibling, not an ancestor or descendant, of
      GO:0004834. Flagged for expert review in suggested_questions.
    supported_by:
    - reference_id: PMID:18430213
      supporting_text: The kinetic parameters of ZmTSA, ZmTSB1, and ZmTSA/ZmTSB1 heteromers
