core_functions:
  - description: R2R3-MYB transcriptional activator that binds CCT/AACC-type
      cis-elements in the promoters of flavonoid biosynthetic genes (C2/CHS,
      A1/DFR, Pr1/F3'H1, F2H1) and activates them without a bHLH co-activator,
      thereby controlling the 3-deoxyflavonoid branch (phlobaphenes, C-glycosyl
      flavones such as maysin, 3-deoxyanthocyanidins) in maize floral organs.
      P1 can also repress some of its genome-wide direct targets.
    molecular_function:
      id: GO:0001228
      label: DNA-binding transcription activator activity, RNA polymerase
        II-specific
    directly_involved_in:
      - id: GO:0045893
        label: positive regulation of DNA-templated transcription
      - id: GO:0009963
        label: positive regulation of flavonoid biosynthetic process
    locations:
      - id: GO:0005634
        label: nucleus
    supported_by:
      - reference_id: PMID:8313474
        supporting_text: P binds to and activates transcription of the A1 gene
          required for 3-deoxy flavonoid and phlobaphene biosynthesis
      - reference_id: PMID:23113982
        supporting_text: Using a combination of EMSA and ChIP experiments, we
          established that the Zmf3'h1 gene is a direct target of P1.
      - reference_id: PMID:15347654
        supporting_text: In contrast, the R2R3 MYB protein P1 activates a subset
          of the C1-regulated genes independently of R.
  - description: Sequence-specific binding of the R2R3 Myb domain to CCT/AACC
      elements in target gene promoters, the DNA-recognition part of P1's
      transcription factor activity.
    molecular_function:
      id: GO:0000976
      label: transcription cis-regulatory region binding
    locations:
      - id: GO:0005634
        label: nucleus
    supported_by:
      - reference_id: PMID:8313474
        supporting_text: P encodes a Myb homolog that recognizes the sequence
          CCT/AACC
      - reference_id: PMID:9144964
        supporting_text: The two C1 binding sites in the a1 promoter are also
          bound by P.
suggested_questions:
  - question: How does P1 binding repress a subset of its direct targets, as
      found by ChIP-seq/RNA-seq; does it recruit co-repressors or compete with
      other activators at those promoters?
  - question: The C-terminal ~90 residues of TrEMBL C6G8B2 (B73, with a Pfam
      P_C domain) and Swiss-Prot P27898 differ completely after residue ~250
      although the N-terminal regions are identical. Which sequence reflects the
      true P1 protein C-terminus, and does it differ between alleles (P1-rr vs
      P1-wr)?
  - question: Should ARBA00027688 (pigment biosynthetic process) be restricted
      so that it does not fire on transcription factors whose role in pigment
      pathways is regulatory?
suggested_experiments:
  - description: Determine P1 nuclear localization directly with a P1-GFP fusion
      in maize pericarp or protoplasts, and map which part of the protein (Myb
      domain or P_C domain) is required for nuclear import and for activation.
    experiment_type: subcellular localization and domain mapping
  - description: Test whether the C-terminal P_C domain of P1 is an activation
      domain by fusing it to the GAL4 DNA-binding domain in maize protoplast
      transactivation assays, and compare P1-rr and B73 P1-wr C-terminal
      sequences.
    experiment_type: transactivation assay
