        enzymes, an indirect consequence of P1 regulating flavonoid genes. P1's
        established role is developmental, tissue-specific control of
        flavonoid pigments in floral organs. Response to stress is therefore not
        a characteristic function of this gene product as encoded by the B73
        entry, and the term is too vague to be useful. Response to UV-B is not a
