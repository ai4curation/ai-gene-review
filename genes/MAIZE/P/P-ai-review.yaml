        leaves of some high-altitude landraces and the anti-insect activity of
        maysin, a P1-controlled metabolite.
      action: MARK_AS_OVER_ANNOTATED
      reason: The UV-B induction of P1 is allele- and landrace-specific (P1 is
        almost undetectable and barely UV-B-induced in B73 and W23 leaves), and
