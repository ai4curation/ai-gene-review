id: C6G8B2
gene_symbol: P
aliases:
  - P1
  - pericarp color1
  - ZmP1
  - Zm00001eb014290
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  P (pericarp color1, P1) encodes an R2R3-MYB transcription factor of maize.
  The protein has two N-terminal Myb repeats that bind CCT/AACC-type
  cis-elements, a disordered central region and a C-terminal P_C domain shared
  with the paralog P2. P1 is expressed mainly in floral organs (kernel
  pericarp, cob glumes, tassel glumes, silk and husk) and, in some
  high-altitude landraces, in UV-B-exposed leaves. In the nucleus it binds the
  promoters of flavonoid biosynthetic genes such as C2 (chalcone synthase), A1
  (dihydroflavonol 4-reductase), Pr1 (flavonoid 3'-hydroxylase) and F2H1, and
  activates them without the bHLH co-activators R/B that the related MYB C1
  requires. Through these targets it controls the 3-deoxyflavonoid branch of
  flavonoid metabolism, giving red phlobaphene pigments in pericarp and cob and
  insecticidal C-glycosyl flavones (maysin) and 3-deoxyanthocyanidins in silks.
  Genome-wide, P1 binds about 1500 putative direct targets and can either
  activate or repress them. Expression of the p1 gene is subject to
  epigenetic regulation, including paramutation and enhancer methylation,
  which underlies the many pericarp and cob colour alleles.
