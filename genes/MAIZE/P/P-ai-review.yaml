references:
  - id: PMID:8313474
    title: The myb-homologous P gene controls phlobaphene pigmentation in maize
      floral organs by directly activating a flavonoid biosynthetic gene subset.
    full_text_unavailable: true
    findings:
      - statement: P is a Myb homolog that binds CCT/AACC and directly activates
          A1 but not Bz1.
        supporting_text: P binds to and activates transcription of the A1 gene
          required for 3-deoxy flavonoid and phlobaphene biosynthesis, but not the
          Bz1 gene required for anthocyanin biosynthesis.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified (Cell 1994). Abstract only in cache; the
        founding molecular characterization of P DNA binding and activation.
  - id: PMID:9144964
    title: Evidence for direct activation of an anthocyanin promoter by the maize
      C1 protein and comparison of DNA binding by related Myb domain proteins.
    full_text_unavailable: true
    findings:
      - statement: P binds both C1 sites in the a1 promoter and activates a1
          independently of B/R.
        supporting_text: The two C1 binding sites in the a1 promoter are also
          bound by P.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified; abstract only in cache.
  - id: PMID:15347654
    title: Different mechanisms participate in the R-dependent activity of the
      R2R3 MYB transcription factor C1.
    full_text_unavailable: true
    findings:
      - statement: P1 activates a subset of C1 target genes without the bHLH
          co-activator R.
        supporting_text: In contrast, the R2R3 MYB protein P1 activates a subset
          of the C1-regulated genes independently of R.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: PubMed-verified; abstract only in cache. Mainly about C1 but
        uses P1 and the P1* variant directly.
  - id: PMID:22822204
    title: A genome-wide regulatory framework identifies maize pericarp color1
      controlled genes.
    findings:
      - statement: ChIP-seq and RNA-seq identify about 1500 putative direct P1
          targets, including F2H1; P1 binding can activate or repress targets.
        supporting_text: Unexpectedly, the binding of P1 to gene regulatory
          regions can result in both gene activation and repression.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified (Plant Cell 2012). Abstract read; cached full
        text extraction is fragmentary.
  - id: PMID:23113982
    title: Expression of flavonoid 3'-hydroxylase is controlled by P1, the
      regulator of 3-deoxyflavonoid biosynthesis in maize.
    findings:
      - statement: P1 binds CCT/AACC-like sites in the Zmf3'h1 promoter by EMSA
          and occupies the promoter in pericarps by ChIP; Zmf3'h1 expression
          requires functional p1.
        supporting_text: Using a combination of EMSA and ChIP experiments, we
          established that the Zmf3'h1 gene is a direct target of P1.
      - statement: The 3-deoxyflavonoid biosynthetic steps are performed by
          enzymes under P1 regulatory control.
        supporting_text: Our results show that the Zmf3'h1 gene participates in
          the biosynthesis of phlobaphenes and agronomically important
          3-deoxyflavonoid compounds under the regulatory control of P1.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full text read (PMC3509002). EMSA used His-tagged P1 MYB
        domain from E. coli; ChIP with anti-P1 antibody on P1-rr and P1-ww
        pericarps.
  - id: PMID:22702356
    title: Analysis of the P1 promoter in response to UV-B radiation in allelic
      variants of high-altitude maize.
    findings:
      - statement: P1 is UV-B induced in leaves of high-altitude landraces but
          barely expressed in B73 or W23.
        supporting_text: P1 is induced by UV-B, both at the transcript and at
          the protein levels, in contrast to B73 or W23, which showed almost
          undetectable expression levels, and very low induction by UV-B.
      - statement: ChIP shows increased P1 occupancy of the CHS (C2) promoter
          after UV-B in the Confite landrace.
        supporting_text: Therefore, there is a considerable increase in P1
          binding to the CHS promoter region of Confite plants exposed under UV-B
          light, and this change does not occur in the inbred line W23
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text read (PMC3489873). Mainly about regulation of P1
        expression by UV-B; ChIP gives in vivo binding to C2.
  - id: PMID:23055943
    title: Maize Unstable factor for orange1 is required for maintaining
      silencing associated with paramutation at the pericarp color1 and booster1
      loci.
    findings:
      - statement: Silencing of p1 epialleles involves enhancer DNA methylation
          and H3K9me2 that Ufo1-1 disrupts; this concerns regulation of the p1
          gene, not P1 protein function.
        supporting_text: Genetic tests revealed that the Ufo1-1 mutation
          disrupted silencing associated with paramutation at both p1 and b1.
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: Full text available (PMC3464198). Epigenetic regulation of the
        p1 locus; no information on the molecular function of the protein.
  - id: PMID:11148280
    title: A segmental gene duplication generated differentially expressed
      myb-homologous genes in maize.
    full_text_unavailable: true
    findings:
      - statement: p1 and p2 arose by duplication and have different expression
          domains.
        supporting_text: p1 transcripts accumulate in kernel pericarp, cob,
          tassel glumes, and silk, whereas p2 transcripts are found in developing
          anther and silk
    reference_review:
      relevance: LOW
      correctness: VERIFIED
