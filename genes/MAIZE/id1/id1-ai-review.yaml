  review:
    summary: >-
      Combined automated annotation (ARBA plus rice ortholog projection) that ID1 regulates
      transcription.
    action: ACCEPT
    reason: >-
      ID1 is a sequence-specific DNA-binding zinc finger protein [PMID:15020707], and loss of
      id1 changes the expression of many leaf genes, including the florigen gene ZCN8
      [PMID:21730358, PMID:17928372]. A 2026 single-cell chromatin and expression preprint
      (PMID:42818387) proposes candidate direct targets, noted in the manual
      synthesis. For maize ID1 the direction of regulation at any direct
      target has not been established, so this term is as precise as the maize evidence
      allows. The rice-derived 'positive regulation' row is reviewed separately.
    supported_by:
    - reference_id: PMID:15020707
      supporting_text: The presence of zinc finger domains that interact with specific DNA sequences is further evidence that maize ID1, and most likely all ID domain proteins, function as transcriptional regulators.
    - reference_id: PMID:17928372
      supporting_text: This analysis revealed 55 genes with a significant 2-fold difference in expression
    - reference_id: file:MAIZE/id1/id1-deep-research-manual.md
      supporting_text: reports scATAC/snRNA-seq of id1
