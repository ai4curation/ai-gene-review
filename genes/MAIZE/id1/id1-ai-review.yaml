  review:
    summary: >-
      Phylogenetic inference from the IDD clade (PTN002238909), seeded by Arabidopsis IDD
      proteins with experimental transcription-factor annotations. ID1 is the founding IDD
      member and binds a specific DNA motif via its ID domain.
    action: ACCEPT
    reason: >-
      ID1 carries the full ID domain shared by the IDD clade, and maize ID1 itself binds an
      11 bp consensus motif through that domain in vitro [PMID:15020707]. The IDD family is
      a family of transcription factors [PMID:16784536]. The rice ortholog activates
      transcription in yeast [PMID:18774969]. ID1 sits inside the clade that inherited the
      function, and nothing suggests loss. This is the core molecular function.
    supported_by:
    - reference_id: PMID:15020707
      supporting_text: ID1 binds selectively to an 11 bp consensus motif via the ID domain
    - reference_id: PMID:16784536
      supporting_text: the founding member of a transcription factor gene family that encodes a protein with a distinct arrangement of zinc finger motifs
    - reference_id: PMID:18774969
      supporting_text: OsId1 is able to activate transcription in yeast.
