- term:
    id: GO:0045893
    label: positive regulation of DNA-templated transcription
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:B1B534
  - RAP2022-09-01:Os10t0419200-01
  review:
    summary: >-
      Ensembl Compara projection from rice EHD2/OsId1, which activates transcription in
      yeast and is required for expression of Ehd1, Hd3a and RFT1.
    action: KEEP_AS_NON_CORE
    reason: >-
      Plausible by orthology: rice OsId1 activates transcription in yeast and is required
      for Ehd1 expression [PMID:18774969]. For maize ID1, activation has not been tested.
      The best-studied maize downstream gene, ZCN8, is probably not a direct target because
      the two genes are expressed in different parts of the leaf [PMID:21730358]. The row is
      kept as an orthology-supported claim, but it is not used as the core description of
      ID1 until a direct maize target is shown to be activated.
    supported_by:
    - reference_id: PMID:18774969
      supporting_text: OsId1 is able to activate transcription in yeast.
    - reference_id: PMID:21730358
      supporting_text: Therefore, it is unlikely that ZCN8 is a direct target of the ID1 transcriptional regulator in the way that FT is a direct target of CO
- term:
    id: GO:0048510
    label: regulation of timing of transition from vegetative to reproductive phase
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:B1B534
  - RAP2022-09-01:Os10t0419200-01
  review:
    summary: >-
      Ensembl Compara projection from rice. In maize this is the defining role of ID1: id1
      mutants are extremely late flowering.
    action: ACCEPT
    reason: >-
      ID1 controls the timing of the floral transition in maize. id1 mutants make more than
      twice the normal number of leaves before flowering [PMID:21730358], and id1 acts from
      the leaf to regulate production of a transmissible floral signal [PMID:9604934]. As a
      transcription factor whose activity sets the timing of the transition, ID1 regulates
      this process, which is the standard GO treatment of developmental-timing regulators.
      GO:0048510 has no descendants, so it is as specific as GO allows.
    supported_by:
    - reference_id: PMID:21730358
      supporting_text: Mutant id1 plants exhibit an extreme late flowering phenotype in which they produce more than twice as many leaves as normal maize
    - reference_id: PMID:9604934
      supporting_text: id1 acts non-cell-autonomously to regulate the production of a transmissible signal in the leaf
- term:
    id: GO:0048574
    label: long-day photoperiodism, flowering
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:B1B534
  - RAP2022-09-01:Os10t0419200-01
  review:
    summary: >-
      Ensembl Compara projection from rice EHD2/OsId1. Maize ID1 acts in the autonomous,
      photoperiod-independent flowering pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0048574 is a photoperiodism term (a phase change "as a result of detection of, or
      exposure to, a period of light or dark of a given length"). Maize ID1 acts in the
      autonomous pathway: its mRNA and protein levels are unaffected by day/night regime and
      photoperiod [PMID:17307745]. Even the rice ortholog acts "regardless of photoperiod"
      and is needed for flowering in both short and long days [PMID:18774969], which shows a
      general requirement for flowering rather than a day-length response. Whether ID1
      contributes to photoperiod responses in tropical maize is unknown [PMID:21730358]. The
      timing role is already captured by GO:0048510.
    supported_by:
    - reference_id: PMID:17307745
      supporting_text: The finding that ID1 expression is developmentally regulated and is unperturbed by external stimuli such as photoperiod supports the supposition that ID1 acts through the autonomous floral inductive pathway in maize.
    - reference_id: PMID:18774969
      supporting_text: RNAi mutants show a delay in flowering under both short-day (SD) and long-day (LD) conditions.
- term:
    id: GO:0048575
    label: short-day photoperiodism, flowering
  evidence_type: IEA
  original_reference_id: GO_REF:0000107
  qualifier: involved_in
  supporting_entities:
  - UniProtKB:B1B534
  - RAP2022-09-01:Os10t0419200-01
  review:
    summary: >-
      Ensembl Compara projection from rice EHD2/OsId1. Maize ID1 acts in the autonomous,
      photoperiod-independent flowering pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Same reasoning as the long-day row. ID1 levels are unaffected by photoperiod
      [PMID:17307745], and the rice ortholog is required for flowering in both short and long
      days [PMID:18774969], so the requirement is not a day-length response. In
      photoperiod-sensitive teosinte, short days induce ZCN8 through an unknown intermediate
      that the authors do not identify as ID1 [PMID:21730358].
    supported_by:
    - reference_id: PMID:17307745
      supporting_text: ID1 gene expression and protein levels are largely unaffected by variations in light and dark
    - reference_id: PMID:21730358
      supporting_text: Whether id1 has a role in mediating the floral transition in teosinte or other tropical maize that requires SD photoperiods to induce flowering is unknown.
