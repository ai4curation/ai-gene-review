gene_symbol: id1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  INDETERMINATE1 (ID1) is a plant-specific zinc finger transcription factor and the founding
  member of the INDETERMINATE DOMAIN (IDD) family. Its ID domain, a cluster of C2H2 and C2HC
  zinc fingers, binds an 11 bp DNA motif (5'-TTTGTCG/CT/CT/aT/aT-3') in a zinc-dependent
  manner, with zinc fingers Z2 and Z3 required for binding. ID1 is a nuclear protein expressed
  only in immature, non-photosynthetic leaf tissue, and its level does not vary with light,
  day length or the circadian clock. It is the central regulator of the autonomous
  (photoperiod-independent) floral transition in day-neutral temperate maize. Acting
  non-cell-autonomously from developing leaves, ID1 is required for production of the
  leaf-derived florigenic signal, including high expression of the florigen gene ZCN8 in
  mature leaves. The ZCN8 effect is probably indirect. id1 mutants produce more than twice
  the normal number of leaves, flower very late and form aberrant flowers. Orthologs in rice
  (OsId1/Ehd2/RID1) and sorghum have a similar role in grass flowering.
