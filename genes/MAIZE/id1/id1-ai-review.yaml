suggested_questions:
- question: >-
    Which genes are direct in vivo targets of ID1, and does ID1 activate or repress them?
    Since all IDD proteins bind the same motif in vitro, what gives ID1 its specificity?
- question: >-
    Rice EHD2/OsId1 carries LD and SD photoperiodism-of-flowering annotations, although it
    acts regardless of photoperiod. Should those source annotations be GO:0048510 instead,
    so that Compara projection does not spread photoperiodism terms?
suggested_experiments:
- description: >-
    ChIP-seq or CUT&RUN for ID1 in immature maize leaves, combined with RNA-seq of id1
    mutants and transient promoter-reporter assays, to identify direct targets and the sign
    of regulation.
  experiment_type: ChIP-seq
