- description: >-
    Nuclear zinc finger transcription factor that binds an 11 bp DNA motif through its ID
    domain. Acting in immature leaves, it regulates gene expression that sets the timing of
    the autonomous floral transition, including production of the leaf-derived florigenic
    signal (ZCN8 in mature leaves).
