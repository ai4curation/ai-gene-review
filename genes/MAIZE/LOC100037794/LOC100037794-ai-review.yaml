id: A0A1D6ND49
gene_symbol: LOC100037794
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  LOC100037794 encodes ZmrbohB, a maize respiratory burst oxidase homologue (plant NADPH
  oxidase, gp91phox/NOX2 family) of 943 amino acids. Like other plant RBOHs it has a
  cytosolic N-terminal regulatory extension with the NADPH_Ox domain and an EF-hand
  Ca2+-binding region, a multi-pass transmembrane ferric-reductase domain with four
  conserved heme-coordinating histidines, and C-terminal cytosolic FAD- and NADPH-binding
  domains. By homology with Arabidopsis RBOHD it is a plasma membrane enzyme that
  transfers electrons from cytosolic NADPH across the membrane to apoplastic O2,
  generating superoxide that dismutates to H2O2, with activity stimulated by Ca2+
  binding to the EF-hands and by phosphorylation. ZmrbohB was cloned from maize and is
  alternatively spliced; the major alpha transcript is induced by wounding, cold, heat,
  UV and salinity, and ZmrbohB transcript also rises with brassinosteroid treatment,
  aphid feeding and combined drought and cold. No biochemical or genetic study of the
  ZmrbohB protein itself has been reported, so its activity rests on family homology.
