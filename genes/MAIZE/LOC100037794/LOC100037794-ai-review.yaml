- term:
    id: GO:0016174
    label: NAD(P)H oxidase H2O2-forming activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - AGI_LocusCode:AT1G09090
  - AGI_LocusCode:AT1G64060
  - AGI_LocusCode:AT5G47910
  - AGI_LocusCode:AT5G51060
  - PANTHER:PTN000944270
  review:
    summary: NADPH oxidase activity inherited from the land-plant RBOH node; the oxidase
      inference is sound, but plant RBOHs generate superoxide, not H2O2 directly.
    action: MODIFY
    reason: >-
      The node PTN000944270 (taxon Viridiplantae) is seeded by Arabidopsis RBOHB, RBOHF,
      RBOHD and RBOHC, and ZmrbohB is a member of this clade with all catalytic motifs,
      so NADPH-oxidase activity is a sound inference. GO:0016174 is defined as a
      two-electron reaction (NAD(P)H + H+ + O2 = NAD(P)+ + H2O2, EC 1.6.3.1, the DUOX-type
      reaction). Plant RBOHs are NOX2 homologues whose proximal product is superoxide; H2O2
      arises secondarily by dismutation. The accurate term is GO:0106292
      superoxide-generating NADPH oxidase activity (is_a GO:0016175 superoxide-generating
      NAD(P)H oxidase activity), which is the term the Arabidopsis RBOHD review also uses.
      GO:0106292 and GO:0016174 are siblings under GO:0050664, so this is a lateral
      correction, not a refinement.
    proposed_replacement_terms:
    - id: GO:0106292
      label: superoxide-generating NADPH oxidase activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN000944270
        source_label: PTN000944270
        source_status: SUPPORTS_TRANSFER
        comment: The clade placement is right and the target is a typical member; the
          error is the choice of the H2O2-forming term at the IBD, following the TAIR seed
          annotations that measured H2O2 rather than the proximal superoxide product.
      residue_claims_not_applicable: The question is which reaction product the term names,
        not loss or retention of catalytic residues; the heme-ligand histidines and
        FAD/NADPH domains are present.
    supported_by:
    - reference_id: PMID:11756663
      supporting_text: putative plant plasma membrane NADPH oxidase can produce superoxide
    - reference_id: PMID:19261072
      supporting_text: The full-length cDNA of ZmrbohB encodes a 942 amino acid protein containing
        all of the respiratory burst oxidase homolog catalytically critical motifs.
    - reference_id: file:MAIZE/LOC100037794/LOC100037794-deep-research-manual.md
      supporting_text: NCBI Gene lists the aliases ZmrbohB / rbohB.
    source_defects:
    - defect_type: WRONG_TERM
      resource: GO_CENTRAL
      record: PANTHER:PTN000944270
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0016174
      corrected_value: GO:0106292
      corrected_label: superoxide-generating NADPH oxidase activity
      confidence: PROBABLE
      explanation: >-
        The PAINT IBD at PTN000944270 (plant RBOH clade, PTHR11972) asserts GO:0016174
        NAD(P)H oxidase H2O2-forming activity (EC 1.6.3.1). Plant RBOHs are gp91phox/NOX2
        homologues that produce superoxide as the proximal product; H2O2 is formed by
        dismutation. The node should carry GO:0106292 superoxide-generating NADPH oxidase
        activity (or GO:0016175), and the TAIR seed annotations to GO:0016174 should be
        re-examined accordingly.
