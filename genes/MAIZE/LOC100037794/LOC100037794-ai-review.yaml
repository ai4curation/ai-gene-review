core_functions:
- description: >-
    Plasma membrane NADPH oxidase that transfers electrons from cytosolic NADPH via FAD
    and two hemes to extracellular O2, generating apoplastic superoxide (and hence H2O2);
    activity is inferred from the conserved RBOH architecture and Arabidopsis orthologs.
  molecular_function:
    id: GO:0106292
    label: superoxide-generating NADPH oxidase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19261072
    supporting_text: The full-length cDNA of ZmrbohB encodes a 942 amino acid protein containing
      all of the respiratory burst oxidase homolog catalytically critical motifs.
  - reference_id: PMID:11756663
    supporting_text: putative plant plasma membrane NADPH oxidase can produce superoxide
suggested_questions:
- question: Does ZmrbohB protein produce superoxide when expressed heterologously, and is
    its activity stimulated by Ca2+ and phosphorylation like AtrbohD?
- question: Is the "RBOHB" phosphorylated by ZmCDPK7 at Ser-99 (PMID:33331695) this locus
    (Zm00001eb154010) or Zm00001eb341260, which another study also calls RBOHB?
- question: Should the PAINT node PTN000944270 carry superoxide-generating NADPH oxidase
    activity (GO:0106292) instead of the H2O2-forming GO:0016174?
suggested_experiments:
- description: Express ZmrbohB-alpha in HEK293T cells and measure superoxide production
    (L-012 chemiluminescence, with SOD controls) after ionomycin and calyculin A treatment,
    with EF-hand and Ser-99 mutants.
  experiment_type: heterologous expression and ROS assay
- description: Generate CRISPR zmrbohB knockouts in maize and test apoplastic ROS and
    abiotic stress responses, controlling for redundancy with ZmrbohA, C and D.
  experiment_type: genetic loss of function
