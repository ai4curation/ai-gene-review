      maize leaves, together with ZmrbohA, C and D; the induction depends on apoplastic H2O2
      and ZmMPK5 at later time points. Expression evidence only.
    supporting_text: BR treatment significantly elevated the expression of ZmrbohA–ZmrbohD in
      leaves of maize plants.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
