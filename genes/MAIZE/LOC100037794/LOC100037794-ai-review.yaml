  review:
    summary: InterPro2GO mapping of the plant RBOH NADPH_Ox domain (IPR013623) to peroxidase
      activity. RBOH proteins are ROS-generating NADPH oxidases, not peroxidases.
    action: REMOVE
    reason: >-
      IPR013623 (NADPH_Ox) is the N-terminal regulatory region of plant respiratory
      burst oxidase homologues, which also carries the EF-hand Ca2+-sensing region. It has
      no peroxidase chemistry. The catalytic reaction of RBOHs is one-electron reduction
      of O2 by NADPH via FAD and two hemes in the ferric-reductase membrane domain,
      producing superoxide. Nothing in the family uses a hydroperoxide as substrate.
      This is a wrong electronic mapping, removed in line with the Arabidopsis RBOHD
      review; the real catalytic activity is captured by the MODIFY of the oxidase rows
      to GO:0106292.
    supported_by:
