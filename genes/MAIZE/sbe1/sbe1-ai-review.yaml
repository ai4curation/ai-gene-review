- term:
    id: GO:0004553
    label: hydrolase activity, hydrolyzing O-glycosyl compounds
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR004193
  review:
    summary: InterPro2GO maps the N-terminal CBM48 domain (IPR004193, Glyco_hydro_13_N) to
      O-glycosyl hydrolase activity.
    action: REMOVE
    reason: Starch branching enzymes are GH13 transglycosylases (EC 2.4.1.18); the net reaction
      transfers a glucan segment to a 6-hydroxyl rather than to water. Biochemical studies of maize
      BEI report branching (transfer) activity and were carried out on preparations from which
      amylolytic activity had been eliminated; no glucan hydrolase activity is reported for BEI.
      The CBM48 domain is shared by hydrolases and transferases, so the mapping is not specific
      enough to assert hydrolysis. Electronic over-propagation.
    supported_by:
    - reference_id: PMID:8016271
      supporting_text: The expressed BEI was purified to near homogeneity so that amylolytic activity
        and bacterial BE could be completely eliminated from the BE preparation.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0004553
      corrected_value: GO:0003844
      corrected_label: 1,4-alpha-glucan branching enzyme activity
      confidence: PROBABLE
      explanation: InterPro (InterPro2GO) maps IPR004193 (glycoside hydrolase family 13 N-terminal
        domain, CBM48) to GO:0004553 hydrolase activity, hydrolyzing O-glycosyl compounds. The domain
        occurs in glycogen/starch branching enzymes, which are transglycosylases (EC 2.4.1.18) and not
        hydrolases, so the mapping mis-annotates branching enzymes such as maize SBEI (Q41740).
