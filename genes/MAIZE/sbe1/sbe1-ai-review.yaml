suggested_questions:
- question: Is BEI a functional component of the starch granule (GO:0043036 starch grain) in
    wild-type endosperm, or is its trace granule association non-specific entrapment that only
    becomes prominent in ae (BEIIb-null) kernels?
- question: Does BEI act in leaf chloroplast transitory starch synthesis at all, given that its
    transcript is low and the protein was not detected in leaves?
- question: Should InterPro2GO restrict the IPR037439 to glycogen biosynthetic process mapping to
    non-plant lineages, and drop the IPR004193 to O-glycosyl hydrolase mapping for branching
    enzymes?
suggested_experiments:
- description: Determine the amylose versus amylopectin branching contribution of BEI in vivo by
    comparing amylose fine structure (branch density, chain length of branches) in sbe1a, ae and
    sbe1a ae endosperm with isotope-labelled glucan synthesis in isolated amyloplasts.
  experiment_type: genetic and biochemical analysis
- description: Test whether phosphorylation of BEI (observed in ae amyloplasts) changes its
    activity or its recruitment into SSI/SSIIa complexes, using phosphosite mutants expressed in
    sbe1a endosperm.
  experiment_type: site-directed mutagenesis and complementation
