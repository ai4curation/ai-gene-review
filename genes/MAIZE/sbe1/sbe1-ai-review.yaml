- term:
    id: GO:0005978
    label: glycogen biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR037439
  review:
    summary: InterPro2GO maps the branching enzyme family IPR037439 to glycogen biosynthesis.
    action: REMOVE
    reason: Maize, like other land plants, stores alpha-glucan as starch, not glycogen, and the
      plastid branching enzymes act in starch synthesis. The family-level mapping is not taxon
      aware and is wrong for plant starch branching enzymes. That maize BE can make a glycogen-like
      polymer when expressed in E. coli (PMID:7862674) is a heterologous assay, not the in vivo
      process of the maize protein. The correct process, starch biosynthetic process, is already
      on the gene.
    supported_by:
    - reference_id: PMID:21599988
      supporting_text: Starch-branching enzyme (SBE) plays an important role in starch biosynthesis
        by introducing branch points, the α-1,6 linkages in starch.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      slot: GO_ID
      requested_change: CHECK
      asserted_value: GO:0005978
      corrected_value: GO:0019252
      corrected_label: starch biosynthetic process
      confidence: PROBABLE
      explanation: InterPro (InterPro2GO) maps IPR037439 (branching enzyme family) to GO:0005978
        glycogen biosynthetic process without a taxon restriction. Plant plastid starch branching
        enzymes such as maize SBEI (Q41740) act in starch, not glycogen, biosynthesis; the mapping
        should be restricted to glycogen-synthesising lineages or moved to a term common to both.
