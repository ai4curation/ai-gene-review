id: Q41740
gene_symbol: sbe1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  sbe1 (Sbe1a) encodes starch branching enzyme I (SBEI, BEI), one of the three starch branching
  enzymes of maize. It is a plastid-targeted glycoside hydrolase family 13 (GlgB subfamily)
  transglycosylase (EC 2.4.1.18) that cleaves an alpha-1,4-linked glucan segment and reattaches it
  through an alpha-1,6 bond, creating the branch points of starch. The mature ~86 kDa enzyme acts
  in the stroma of endosperm amyloplasts, where it behaves as a monomer and is also found at low
  levels inside starch granules. Compared with the SBEII isoforms, BEI branches amylose much faster
  than amylopectin and transfers longer chains (mostly DP greater than 10). Null sbe1a::Mu mutants
  make starch with near-normal amylose content and chain-length profile, but with altered
  branch-point clustering, greater resistance to alpha-amylase and slower mobilisation during
  germination, indicating that BEI fine-tunes the branching pattern of endosperm starch.
