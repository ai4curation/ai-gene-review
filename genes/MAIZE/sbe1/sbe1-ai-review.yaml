  title: Comparing the properties of Escherichia coli branching enzyme and maize branching enzyme.
  findings:
  - statement: Maize SBEI preferentially transfers longer chains (DP greater than 10) than SBEII.
    supporting_text: SBEI predominantly transfers longer chains with dp greater than 10, while
      producing few shorter chains with dp 3 to 5.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:11855730
  title: Identification of Mutator insertional mutants of starch-branching enzyme 1 (sbe1) in Zea
