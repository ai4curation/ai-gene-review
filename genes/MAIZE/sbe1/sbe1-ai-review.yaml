- id: PMID:21599988
  title: Deficiency of maize starch-branching enzyme I results in altered starch fine structure,
    decreased digestibility and reduced coleoptile growth during germination.
  findings:
  - statement: sbe1a null starch has an altered branch-point distribution, greater resistance to
      pancreatic alpha-amylase and slower mobilisation during germination.
    supporting_text: Molecular structure analysis suggests an important function of SBEI in
      modulating the branching pattern in normal starch by decreasing local clustering of
      amylopectin branch points.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC3245629). Genetic and starch-structure study of the sbe1a::Mu
      null in W64A; the germination phenotype is downstream of starch structure.
- id: PMID:12231902
  title: Differentiation of the Properties of the Branching Isozymes from Maize (Zea mays).
  findings:
  - statement: Native maize BEI branches amylose much faster than amylopectin.
    supporting_text: BEI had the highest activity in branching amylose, but its rate of branching
      amylopectin was less than 5% of that of branching amylose.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Direct enzyme assays on purified native maize endosperm BEI.
- id: PMID:8016271
  title: Expression of branching enzyme I of maize endosperm in Escherichia coli.
  findings:
  - statement: Recombinant mature BEI reproduces the activity of native endosperm BEI.
    supporting_text: The recombinant enzyme showed properties very similar to those of BEI purified
      from developing maize endosperm with respect to branching amylose and amylopectin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only.
- id: PMID:7862674
  title: Maize branching enzyme catalyzes synthesis of glycogen-like polysaccharide in glgB-deficient
    Escherichia coli.
  findings:
  - statement: Maize BEI complements branching in a glgB-deficient E. coli strain.
    supporting_text: Transformation of the maize BE gene(s) in AC71 (glgB-) showed complementation
      in branching activity.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only. Heterologous complementation; supports activity, not an in vivo
      glycogen process in maize.
