  findings:
  - statement: sbe1::Mu mutants lack endosperm SBEI but make starch with wild-type size and
      chain-length profiles.
    supporting_text: Starches extracted from mutant leaves and endosperm have structures
      indistinguishable from starches of wild-type controls
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract only. Isolation of the sbe1a::Mu null allele.
