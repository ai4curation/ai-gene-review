proposed_new_terms:
- proposed_name: nonenzymatic cell wall loosening activity
  proposed_definition: >-
    A molecular function in which a protein binds cell wall polysaccharides and, without
    catalysing covalent bond cleavage or formation, weakens noncovalent adhesion between
    polysaccharides (such as cellulose microfibrils and matrix glucans), allowing the
    wall to yield and extend under tension.
  justification: >-
    Expansin activity has no GO molecular function term (GO:0009936 expansin is
    obsolete), so the core activity of every expansin can only be captured as the
    process GO:0009828. A nonenzymatic wall-loosening MF would let GO-CAM models
    represent expansins as the activity enabling wall loosening.
  supported_by:
  - reference_id: PMID:16356276
    supporting_text: no hydrolytic activity has been detected for either α-expansin or
      β-expansin proteins
  - reference_id: PMID:16356276
    supporting_text: Expansin activity is usually assayed as the ability of a protein
      sample to induce extension of isolated cell walls
suggested_questions:
- question: >-
    Does ZmEXPA1 protein have wall-extension (creep) activity on maize or cucumber
    walls, and does it act preferentially on cellulose-cellulose junctions as reported
    for other alpha-expansins?
- question: >-
    Is the "Membrane; Peripheral membrane protein" location in the UniProt expansin rule
    (RU365023) supported by any experiment, or should expansin GO annotation be
    restricted to the cell wall?
suggested_experiments:
- description: >-
    Express recombinant ZmEXPA1 (e.g. in Pichia or maize seed) and measure induced
    creep of heat-inactivated walls at acidic pH, with D1/D2 truncations as controls.
  experiment_type: biochemical assay
- description: >-
    Generate expa1 CRISPR knockouts and test organ elongation and acid-induced growth,
    controlling for redundancy with other maize alpha-expansins.
  experiment_type: genetic loss-of-function
