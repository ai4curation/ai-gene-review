- term:
    id: GO:0009828
    label: plant-type cell wall loosening
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00084903
  review:
    summary: >-
      ARBA machine-learning prediction. Independently supported by the expansin A
      subfamily membership (UniRule RU365023, InterPro, PANTHER) and by the extensive
      literature showing alpha-expansins induce wall extension and mediate acid growth.
    action: ACCEPT
    reason: >-
      Cell wall loosening is the defining, conserved activity of alpha-expansins.
      ZmEXPA1 has the full two-domain architecture (DPBB D1 and cellulose-binding-like
      D2) required for wall-extension activity. Although the ZmEXPA1 protein has not
      been assayed directly, this is the core process for the gene.
    supported_by:
    - reference_id: PMID:38724021
      supporting_text: EXPAs mediate acid growth, which contributes to wall enlargement
        by auxin and other growth agents.
    - reference_id: PMID:16356276
      supporting_text: Expansins also act very quickly - they induce rapid extension
        within seconds of addition to wall specimens
    - reference_id: file:MAIZE/LOC541904/LOC541904-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: 'FUNCTION: Causes loosening and extension of plant cell walls by
        disrupting non-covalent bonding between cellulose microfibrils and matrix glucans.'
    - reference_id: file:MAIZE/LOC541904/LOC541904-deep-research-manual.md
      supporting_text: NCBI Gene 541904 is "alpha expansin 1"
- term:
    id: GO:0016020
    label: membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  supporting_entities:
  - UniProtKB-SubCell:SL-0162
  review:
    summary: >-
      Mapped from the UniRule RU365023 subcellular location statement "Membrane;
      Peripheral membrane protein". Expansins are secreted proteins bound to the cell
      wall; the reviewed literature reports wall, not membrane, localization.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      There is no evidence that ZmEXPA1 or alpha-expansins generally are membrane
      associated; immunolocalization and fractionation place expansins in the cell wall,
      distributed through its thickness. The membrane statement in the family rule is not
      tied to any cited experiment. Transit through the secretory pathway does not make
      the mature protein a membrane protein. Not removed outright because a transient
      plasma-membrane-proximal pool cannot be excluded, but the term misrepresents where
      the protein acts.
    supported_by:
    - reference_id: PMID:16356276
      supporting_text: With immunolocalization by light and electron microscopy, expansin
        proteins were localized to the cell wall [51,61,62], where they were found to be
        distributed throughout the thickness of the walls rather than concentrated in
        specific strata.
    - reference_id: file:MAIZE/LOC541904/LOC541904-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: 'Membrane {ECO:0000256|RuleBase:RU365023}; Peripheral membrane
        protein {ECO:0000256|RuleBase:RU365023}.'
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniRule:RU365023
      requested_change: CHECK
      asserted_value: UniProtKB-SubCell:SL-0162
      cause: UNKNOWN
      confidence: SUSPECTED
      explanation: >-
        UniRule RU365023 (expansin) assigns "Membrane; Peripheral membrane protein" in
        addition to "Secreted, cell wall", which propagates GO:0016020 membrane to every
        matching expansin. Expansins are reported as cell-wall-bound proteins by
        immunolocalization and fractionation; please check whether experimental
        evidence supports the membrane statement, and drop it from the rule if not.
