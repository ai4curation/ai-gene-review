id: A0A804NBL1
gene_symbol: LOC541904
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  LOC541904 encodes maize alpha-expansin 1 (ZmEXPA1; NCBI Gene 541904, B73 v3 model
  GRMZM2G339122, v5 model Zm00001eb149460), a 253-residue secreted protein of the
  expansin A subfamily. It has an N-terminal signal peptide, a DPBB (EG45-like) domain D1
  and a C-terminal cellulose-binding-like domain D2. Alpha-expansins are nonenzymatic
  cell wall proteins that bind the cellulose network and loosen the plant-type cell wall,
  disrupting noncovalent bonding between cellulose microfibrils and matrix glucans to
  allow turgor-driven wall extension (acid growth). ZmEXPA1 is one of the most strongly
  expressed maize alpha-expansins, with transcripts detected in several juvenile and
  mature organs; its transcription is induced in roots by salt stress and is a target of
  growth regulators (SDG128 in leaf auricles, DBB2/PIF4 in shade-induced elongation).
  No biochemical, localization or mutant study of the ZmEXPA1 protein itself has been
  reported, so its activity and wall location are inferred from the well-characterized
  family.
