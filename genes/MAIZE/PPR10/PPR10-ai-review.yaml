gene_symbol: PPR10
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  PPR10 is a nucleus-encoded, chloroplast-targeted P-class pentatricopeptide repeat (PPR)
  protein of maize (786 aa, predicted transit peptide 1-95, 18-19 tandem PPR motifs forming a
  right-handed superhelical solenoid). It is a sequence-specific single-stranded RNA-binding
  protein that binds two related ~17-18-nt elements in the chloroplast atpI-atpH and
  psaJ-rpl33 intergenic regions, using a modular code in which pairs of residues in each
  repeat specify the base. Bound PPR10 acts as a site-specific barrier that blocks both
  5'->3' and 3'->5' exoribonucleases, so that processed mRNAs from polycistronic precursors
  terminate at its binding site and are stabilized: it defines and protects the processed
  atpH 5' end and the psaJ 3' end, and also stabilizes a 3' end downstream of psaI. The
  protected binding site persists in vivo as a small RNA footprint. At the atpH 5'-UTR,
  PPR10 binding also remodels the ribosome-binding region and enhances atpH translation. It
  resides in the chloroplast stroma; null mutants are yellow-green and seedling lethal, with
  reduced accumulation of photosynthetic complexes. PPR10 forms an intertwined homodimer in
  crystals, but binds its RNA as a monomer in solution.
