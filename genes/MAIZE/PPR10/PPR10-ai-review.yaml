    summary: Phylogenetic inference of mRNA binding for the P-class PPR clade; correct, and
      PPR10 is experimentally a sequence-specific mRNA-binding protein.
    action: MODIFY
    reason: >-
      mRNA binding is true of PPR10, but the experimental evidence supports a more specific
      term. PPR10 binds defined ~17-18-nt elements in the atpH 5'-UTR and psaJ 3'-UTR, in vivo
      and in vitro, and crystal structures show base-specific recognition by individual
      repeats. GO:1990825 sequence-specific mRNA binding is_a GO:0003729 mRNA binding
      (checked with OAK). The IBA node placement is sound (P-class PPR proteins are
      sequence-specific organellar RNA-binding proteins); only the granularity is refined
      here.
