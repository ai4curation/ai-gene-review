  evidence_type: IMP
  original_reference_id: PMID:19424177
  qualifier: involved_in
  review:
    summary: ppr10 mutants lack the processed atpH and psaJ mRNAs whose termini map to the
      PPR10 binding sites; PPR10 is the barrier that stabilizes them.
