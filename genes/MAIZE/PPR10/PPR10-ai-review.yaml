- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:24162847
  qualifier: enables
  supporting_entities:
  - UniProtKB:B8Y6I0
  review:
    summary: Homodimerization of PPR10 observed in crystal structures (apo and psaJ-RNA
      bound).
    action: KEEP_AS_NON_CORE
    reason: >-
      The crystal structures of Yin et al. show an antiparallel intertwined PPR10 homodimer,
      so self-association is real in vitro. Its physiological role is doubtful: SAXS of the
      PPR10-atpH complex indicates that PPR10 binds RNA as a monomer, and dimerization depends
      on N-terminal segments and a repeat-10 cysteine. Self-binding is therefore kept but is
      not part of PPR10's core RNA-binding function.
    supported_by:
    - reference_id: PMID:24162847
      supporting_text: PPR10 forms an antiparallel, intertwined homodimer and exhibits
        considerable conformational changes upon binding to its target ssRNA
    - reference_id: PMID:25609698
      supporting_text: Our results support prior evidence that PPR10 binds RNA as a monomer
    - reference_id: PMID:25231995
      supporting_text: we show that the amino-terminal segments of PPR10 determine the
        dimerization state of PPR10
    - reference_id: file:MAIZE/PPR10/PPR10-deep-research-manual.md
      supporting_text: Physiological relevance of the dimer is therefore doubtful.
