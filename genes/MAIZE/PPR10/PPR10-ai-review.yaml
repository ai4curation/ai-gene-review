- term:
    id: GO:0045727
    label: positive regulation of translation
  evidence_type: IDA
  original_reference_id: PMID:21173259
  qualifier: involved_in
  review:
    summary: PPR10 bound to the atpH 5'-UTR remodels the ribosome-binding region and enhances
      atpH translation.
    action: NEW
    reason: >-
      The translational effect is not only a mutant phenotype: Prikryl et al. show that
      PPR10 binding itself alters the structure of the adjacent atpH RNA, keeping the
      ribosome-binding region single-stranded, which provides the mechanism for the reduced
      translation efficiency of atpH mRNA in ppr10 mutants. PPR10 thus performs the
      regulatory step directly. Kept non-core relative to mRNA stabilization, which is its
      principal and best-documented role.
    supported_by:
    - reference_id: PMID:21173259
      supporting_text: PPR10 binding not only stabilizes processed atpH RNAs but also enhances
        atpH translation
    - reference_id: PMID:21173259
      supporting_text: Finally, they demonstrate that PPR10 binding alters the structure of the
        adjacent RNA and that this RNA remodeling provides a plausible mechanism by which
        PPR10 enhances atpH translation.
    - reference_id: PMID:22156165
      supporting_text: maintains the ribosome binding region in a single-stranded conformation
