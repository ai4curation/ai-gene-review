- id: PMID:19424177
  title: Site-specific binding of a PPR protein defines and stabilizes 5' and 3' mRNA
    termini in chloroplasts.
  findings:
  - statement: PPR10 binds two similar intergenic RNA elements (atpI-atpH, psaJ-rpl33) and is
      required for accumulation of RNAs whose processed termini map to these sites; it acts as
      a barrier to decay from both directions.
    supporting_text: These findings show that PPR10 serves as a barrier to RNA decay from
      either the 5' or 3' direction
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Founding paper; cached copy is abstract-only. PubMed record matches the
      UniProt citation (EMBO J 28:2042). Stroma localization and mutant phenotype are reported
      via UniProt curation.
- id: PMID:21173259
  title: Mechanism of RNA stabilization and translational activation by a pentatricopeptide
    repeat protein.
  findings:
  - statement: Recombinant PPR10 blocks 5'->3' and 3'->5' exoribonucleases in vitro, defines
      the atpH 5' terminus with a generic exonuclease, has a 17-nt minimal site, and remodels
      the atpH ribosome-binding site.
    supporting_text: In addition, we show that the minimal PPR10-binding site spans 17 nt.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Mechanistic in vitro study establishing PPR10's barrier and
      RNA-remodeling activities.
- id: PMID:22156165
  title: Protein-mediated protection as the predominant mechanism for defining processed
    mRNA termini in land plant chloroplasts.
  findings:
  - statement: The small RNA footprint at the PPR10 atpH binding site is absent in ppr10 null
      mutants, confirming that PPR10 protects its site in vivo; the PPR10 barrier mechanism
      is generalised to most processed chloroplast mRNA termini.
    supporting_text: both were missing in ppr10 mutant plants, as predicted if they
      accumulate due to stabilization by bound PPR10
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Most of the paper concerns HCF152 and genome-wide sRNA
      mapping in barley; the PPR10-specific data are the ppr10 mutant sRNA blots (Figure 4)
      and the in vitro exonuclease-block positions matching sRNA borders.
- id: PMID:24162847
  title: Structural basis for the modular recognition of single-stranded RNA by PPR
    proteins.
  findings:
  - statement: Crystal structures of PPR10 apo and bound to the 18-nt psaJ element show a
      right-handed superhelix, an intertwined homodimer, and base recognition following the
      PPR code.
    supporting_text: PPR10 forms an antiparallel, intertwined homodimer
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only in cache; abstract states the homodimer and modular base
      recognition.
- id: PMID:25609698
  title: The solution structure of the pentatricopeptide repeat protein PPR10 upon binding
