suggested_questions:
- question: Should PPR10 carry GO:0010239 chloroplast mRNA processing? It defines processed
    atpH and psaJ termini by blocking exonucleases, but the nucleolytic steps are performed by
    RNases; does GO intend processing terms for barrier proteins that position the ends?
- question: Is the intertwined homodimer seen in crystals ever formed in the chloroplast, or
    is PPR10 monomeric in vivo, as SAXS of the RNA complex suggests?
suggested_experiments:
- description: Test whether PPR10 dimerizes in vivo (e.g. crosslinking or native gel of
    chloroplast stroma, or complementation of ppr10 with a dimerization-defective N-terminal
    variant) and whether dimerization affects RNA stabilization.
  experiment_type: biochemistry / genetic complementation
