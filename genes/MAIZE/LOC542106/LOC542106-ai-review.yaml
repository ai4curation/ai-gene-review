proposed_new_terms:
- proposed_name: nonenzymatic cell wall loosening activity
  proposed_definition: >-
    A molecular function in which a protein binds cell wall polysaccharides and, without
    catalysing covalent bond cleavage or formation, weakens noncovalent adhesion between
    wall polysaccharides, allowing the wall to yield and extend under tension.
  justification: >-
    Expansin activity has no GO molecular function term (GO:0009936 expansin is
    obsolete), so the defining activity of beta-expansins such as Zea m 1 can only be
    captured as the process GO:0009828. Zea m 1d induces wall extension without
    detectable hydrolysis.
  supported_by:
  - reference_id: PMID:16984999
    supporting_text: Tests for hydrolytic activity by EXPB1 with various wall
      polysaccharides proved negative.
  - reference_id: PMID:12913162
    supporting_text: Highly purified Zea m 1d induced extension of a variety of grass
      walls but not dicot walls.
suggested_questions:
- question: >-
    Is the LOC542106 product present in the native Zea m 1d preparation, and does it
    have wall-extension activity equal to that of EXPB1 (P58738), given the
    substitutions Y116F, I149L, Y191F and V251I?
- question: >-
    Which genomic EXPB1 copy carries the Mu insertion studied by Valdivia et al. 2007,
    and does LOC542106 contribute to pollen competitive ability?
- question: >-
    NCBI Gene 542106 carries both the aliases EXPB1B and EXPB9; since K7WCD1 is ~98%
    identical to EXPB1, is the EXPB9 name (one of the four Zea m 1 proteins of
    Yennawar et al. 2006) correctly attached to this locus?
suggested_experiments:
- description: >-
    Distinguish the LOC542106 product from EXPB1 by peptide mass spectrometry of pollen
    Zea m 1 spots (peptides covering positions 116, 149, 191 and 251), and measure its
    wall-extension activity on maize coleoptile walls after recombinant or native
    purification.
  experiment_type: biochemical assay
- description: >-
    Make locus-specific CRISPR knockouts of LOC542106, alone and combined with the other
    EXPB1 copies, and test pollen tube growth in silks and competitive siring under
    large pollen loads.
  experiment_type: genetic loss-of-function
