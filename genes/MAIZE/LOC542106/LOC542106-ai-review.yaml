description: >-
  LOC542106 (NCBI Gene 542106, "lo1 pI allergen homolog 1"; aliases EXPB1B, EXPB9;
  B73 v5 model Zm00001eb391800 on chromosome 9) encodes a 269-residue beta-expansin of
  the Zea m 1 group-1 grass pollen allergen class. Its sequence is about 98% identical to
  maize EXPB1 (Zea m 1d), differing at only five conservative positions, so it is one of
  the near-identical EXPB1 duplicates that encode the same pollen isoform. The protein
  has an N-terminal signal peptide, a DPBB/EG45-like domain 1 and a C-terminal
  cellulose-binding-like domain 2. Native Zea m 1d purified from pollen is a secreted
  glycoprotein that binds grass cell walls, chiefly the matrix glucuronoarabinoxylan,
  and nonenzymatically loosens them, inducing extension of grass but not dicot walls
  without detectable hydrolytic activity; domain 1 lacks the catalytic-base aspartate of
  GH45 glycoside hydrolases. Zea m 1 transcripts are pollen specific, and the protein is
  thought to loosen the walls of the stigma and style to speed pollen tube invasion;
  reducing pollen Zea m 1 levels lowers competitive siring success. No experiment has
  yet distinguished the LOC542106 product from the other EXPB1 copies.
