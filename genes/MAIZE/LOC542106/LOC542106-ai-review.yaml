    Secreted pollen beta-expansin (Zea m 1 group-1 allergen, near-identical to EXPB1)
    that binds the glucuronoarabinoxylan-rich matrix of grass cell walls and
    nonenzymatically loosens them, promoting wall extension; thought to ease pollen
    tube invasion of the stigma and style.
  proposed_molecular_function: nonenzymatic cell wall loosening activity
