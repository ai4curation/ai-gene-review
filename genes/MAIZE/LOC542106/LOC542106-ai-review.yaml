- id: PMID:17225858
  title: A group-1 grass pollen allergen influences the outcome of pollen competition
    in maize.
  findings:
  - statement: A Mu insertion in EXPB1 (cDNA AY197353, product = P58738) reduced pollen
      Zea m 1 by 31% and lowered competitive siring success under large pollen loads,
      without affecting pollen viability or in vitro tube growth.
    supporting_text: the transposon mutation is vastly underrepresented in the progeny
  - statement: Near-identical EXPB1 duplicates (LOC542106 is one) encode the same
      Zea m 1d isoform, so the mutation only partially reduced Zea m 1.
    supporting_text: additional genes highly similar to EXPB1 (>98.8% nucleotide
      sequence identity) also code for the same isoform
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC1764715). The mutated gene is identified as EXPB1, GenBank
      AY197353, whose product (AAO45608) is identical to Swiss-Prot P58738, not K7WCD1.
      The paper does not show which genomic copy carries the insertion beyond that
      assignment. Relevant to LOC542106 as paralog evidence and for the statement that
      highly similar genes encode the same isoform; the phenotype cannot be attributed
      to this locus.
- id: PMID:12913162
  title: Purification and characterization of four beta-expansins (Zea m 1 isoforms)
    from maize pollen.
  findings:
