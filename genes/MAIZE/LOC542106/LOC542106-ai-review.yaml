# --- NEW annotation proposed from paralog experimental evidence ---
- term:
    id: GO:0009828
    label: plant-type cell wall loosening
  evidence_type: ISS
  original_reference_id: PMID:12913162
  qualifier: involved_in
  review:
    summary: >-
      Wall loosening is the activity of the Zea m 1 beta-expansins: purified Zea m 1d
      induces extension of grass walls, and LOC542106 encodes a product ~98% identical
      to Zea m 1d that, per Valdivia et al., codes for the same isoform.
    action: NEW
    reason: >-
      The gene product itself is the wall-loosening agent (it binds the wall matrix and
      causes extension), so it performs the step rather than being required for or acted
      on by it. Comparator: the reviewed paralog P58738 (EXPB1, Zea m 1d) carries
      GO:0009828 by IDA from PMID:12913162 and PMID:9177257, and maize EXPA1 carries it
      too. Transfer by ISS is justified by 264/269 identity (own pairwise comparison of
      K7WCD1 with AAO45608), with no substitution in the catalytic-like or wall-binding
      surfaces described for the structure. Pollen-tube or pollination process terms
      were not added: the only genetic evidence is a phenotype of an allele assigned to
      the EXPB1 cDNA AY197353, not to this locus.
    supported_by:
    - reference_id: PMID:12913162
      supporting_text: Highly purified Zea m 1d induced extension of a variety of grass
        walls but not dicot walls.
    - reference_id: PMID:9177257
      supporting_text: We propose that group I allergens facilitate invasion of the pollen
        tube into the maternal tissues by loosening the cell walls of the grass stigma and
        style
    - reference_id: PMID:17225858
      supporting_text: additional genes highly similar to EXPB1 (>98.8% nucleotide
        sequence identity) also code for the same isoform
    - reference_id: PMID:16984999
      supporting_text: Tests for hydrolytic activity by EXPB1 with various wall
        polysaccharides proved negative.
    - reference_id: file:MAIZE/LOC542106/LOC542106-deep-research-manual.md
      supporting_text: AAO45608/P58738 at five positions only - A20V (in the signal peptide), Y116F, I149L,
