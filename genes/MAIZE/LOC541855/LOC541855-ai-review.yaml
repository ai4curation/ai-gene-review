core_functions:
- description: >-
    Cytosolic TrpA-family (tryptophan synthase alpha-like) protein of unknown molecular
    function. It retains the catalytic Glu/Asp pair of the alpha reaction, but no
    indole-3-glycerol phosphate cleavage or beta-subunit binding has been detected, and it is
    not part of the plastid tryptophan synthase complex.
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:18430213
    supporting_text: In contrast, ZmTSAlike-GFP was localized in the cytosol
  - reference_id: PMID:18430213
    supporting_text: As recombinant ZmTSAlike, expressed in E. coli, did not show any α-activity
      it remains unclear, whether ZmTSAlike functions as cytosolic TSA isoform.
  knowledge_gaps:
  - gap_statement: The molecular function of ZmTSAlike is unknown. It keeps the TrpA catalytic
      residues but shows no IGP lyase activity in vitro, and whether it is a conditionally
      active cytosolic IGP lyase, binds another partner, or has a different metabolic role
      has not been tested.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Is ZmTSAlike a cytosolic indole-3-glycerol phosphate lyase under conditions not
    tested by Kriechbaumer et al. 2008 (other buffers, post-translational modification, a
    cytosolic partner), or a non-catalytic paralog with another role?
- question: Should the PAINT nodes PTN000034360/PTN008681542 carry a loss annotation for the
    cytosolic ZmTSAlike clade (tryptophan synthase activity, chloroplast), and do orthologous
    grass TSA-like proteins share the cytosolic location?
- question: NCBI Gene 541855 is named igl1, yet the encoded protein is ZmTSAlike. Which
    MaizeGDB/NCBI identifier corresponds to the 339-aa IGL, and should the names be
    reassigned?
suggested_experiments:
- description: Assay recombinant ZmTSAlike (tag-free) for IGP-to-indole conversion across pH,
    salt and temperature ranges with sensitive LC-MS detection of indole and
    glyceraldehyde 3-phosphate, and test cytosolic maize extracts for partners that activate it.
  experiment_type: enzyme assay
- description: Generate Zmtsalike loss-of-function mutants (CRISPR) and measure free indole,
    tryptophan and indole-derived metabolites in the cytosol-enriched fraction and in
    herbivore- or elicitor-treated tissue, in wild-type and igl/bx1 backgrounds.
  experiment_type: genetic loss of function and metabolite profiling
