id: A0A1D6L7U4
gene_symbol: LOC541855
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  LOC541855 encodes ZmTSAlike, one of four tryptophan synthase alpha-chain (TrpA family)
  homologs in maize, alongside the plastid tryptophan synthase alpha subunit ZmTSA, the
  benzoxazinoid-pathway indole synthase BX1 and the herbivore-induced indole-3-glycerol
  phosphate lyase IGL. The gene lies on chromosome 1L, 1.6 kb from Igl. The 274-residue
  protein has the TrpA TIM-barrel fold and keeps the two catalytic residues of the alpha
  reaction (Glu58 and Asp69), but it has no N-terminal plastid transit peptide.
  A GFP fusion localizes to the cytosol of maize mesophyll protoplasts. The
  recombinant protein is a monomer. It showed no detectable cleavage of
  indole-3-glycerol phosphate either alone or with the beta subunit ZmTSB1, did not form a
  complex with ZmTSB1, and was not found in the native leaf tryptophan synthase complex,
  whose alpha subunit is ZmTSA. The transcript is present at low levels in all tissues
  examined and is not induced by the herbivore elicitor volicitin. Whether ZmTSAlike acts
  as a cytosolic indole-3-glycerol phosphate lyase under conditions not yet tested, or has
  another metabolic role, is unknown. NCBI Gene and RefSeq label the locus
  "indole-3-glycerol phosphate lyase 1" (igl1), but the encoded protein matches ZmTSAlike
  rather than IGL.
