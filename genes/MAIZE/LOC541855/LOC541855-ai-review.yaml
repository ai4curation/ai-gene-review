- term:
    id: GO:0033984
    label: indole-3-glycerol-phosphate lyase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  qualifier: enables
  supporting_entities:
  - EC:4.1.2.8
  review:
    summary: EC 4.1.2.8 mapping from the PROSITE TrpA active-site rule (PRU10120).
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      The EC assignment rests on the PS00167 TrpA active-site motif. The motif and both
      catalytic residues (E58, D69) are present, but the recombinant protein showed no
      detectable IGP-to-indole conversion, unlike its paralogs ZmTSA, BX1 and IGL tested in
      the same study. The authors leave open whether specific conditions or modifications are
      needed. The activity is therefore unsupported for this protein: it is not
      demonstrated, though one negative in vitro assay does not exclude it. This is an
      over-annotation rather than a demonstrated error. The UniProt record also places its
      second ACT_SITE feature on Ala68, apparently one residue before the catalytic Asp69,
      and NCBI Gene/RefSeq name this protein "indole-3-glycerol phosphate lyase 1"
      (igl1) although it is ZmTSAlike, not IGL. Both are recorded as source defects.
    supported_by:
    - reference_id: PMID:18430213
      supporting_text: No α-activity of recombinant ZmTSAlike was detected in analogous experiments.
    - reference_id: PMID:18430213
      supporting_text: ZmTSAlike might either require specific conditions and modifications or
        it has an unknown function in plant metabolism.
    - reference_id: file:MAIZE/LOC541855/LOC541855-bioinformatics/RESULTS.md
      supporting_text: Both catalytic residues are retained
        in ZmTSAlike.
    - reference_id: file:MAIZE/LOC541855/LOC541855-deep-research-manual.md
      supporting_text: NCBI Gene names the locus "indole-3-glycerol phosphate lyase 1"
    source_defects:
