id: Q6Y3I1
gene_symbol: MRP1
aliases:
  - ZmMRP1
  - Multidrug resistance associated protein 1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  MRP1 (ZmMRP1) is a 1477-residue full-size ATP-binding cassette transporter of
  the ABCC (multidrug resistance-associated protein, MRP) subfamily in maize. It
  has the N-terminal membrane-spanning domain (MSD0) typical of MRPs followed by
  two ABC transmembrane domains, each paired with a nucleotide-binding domain.
  NBD2 carries a consensus Walker A and a Walker B ending in the catalytic
  glutamate, while the NBD1 Walker B ends in aspartate, the degenerate-site
  pattern of ABCC proteins; with the canonical NBD1 signature this gives one
  consensus ATP-hydrolysis site. The gene is present in two closely linked
  copies, is expressed in all tissues examined, and its transcript is induced
  in shoots and leaves by aminotriazole and menadione, by the herbicides
  metolachlor (more strongly by the racemate than by S-metolachlor), atrazine,
  2,4-D and primisulfuron, and by the safeners dichlormid and isoxadifen-ethyl.
  By analogy with characterized plant ABCC pumps it is expected to move
  conjugated organic solutes, such as glutathione conjugates of xenobiotics,
  across a membrane using ATP, but no transport or ATPase activity, substrate,
  or subcellular location has been determined for this protein.
references:
  - id: PMID:14557075
    title: Isolation and characterisation of two multidrug resistance associated
      protein genes from maize.
    full_text_unavailable: true
    findings:
      - statement: ZmMRP1 was cloned as a maize ABC transporter of the MRP
          subfamily with an N-terminal MSD0 domain.
        supporting_text: ZmMRP1 contained an additional N-terminal
          membrane-spanning domain (MSD0) that is typical of MRP transporters
      - statement: ZmMRP1 is induced by aminotriazole and, less, by menadione.
        supporting_text: ZmMRP1 was induced by aminotriazole and to a lesser
          extent by menadione
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Source of the AAO72316.1 sequence cited in the UniProt entry
        (RX PubMed=14557075). Abstract only in cache; cloning, gene structure
        and RT-PCR induction, no functional assay.
  - id: PMID:22792398
    title: Co-induction of a glutathione-S-transferase, a glutathione transporter
      and an ABC transporter in maize by xenobiotics.
    findings:
      - statement: ZmMRP1 transcript in maize leaves is increased by atrazine,
          2,4-D, primisulfuron, metolachlor and dichlormid (semi-quantitative
          RT-PCR).
        supporting_text: All five compounds significantly increased the amount
          of ZmMRP1 transcript, but at different magnitude and after different
          time delay.
      - statement: The glutathione-conjugate transport role is stated only as
          background on the plant MRP family, not tested for ZmMRP1.
        supporting_text: Multidrug resistance-associated proteins (MRPs),
          members of ABC transporter family, play a role in the detoxification
          of xenobiotics by transporting GS conjugates into the vacuole
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached (PMC3394700). Expression data only; the
        detoxification role of ZmMRP1 is inferred from co-induction with GST27
        and from the literature on other MRPs.
  - id: PMID:23144728
    title: Enantioselective induction of a glutathione-S-transferase, a
      glutathione transporter and an ABC transporter in maize by Metolachlor and
      its (S)-isomer.
    findings:
      - statement: rac-metolachlor induces ZmMRP1 more strongly than
          S-metolachlor.
        supporting_text: rac-metolachlor was found to be a stronger inducer for
          ZmMRP1 expression as compared to S-metolachlor
      - statement: The proposed preference of ABC transporters for GS
          conjugates of R-isomers is a hypothesis; the vanadate experiment does
          not target ZmMRP1 specifically.
        supporting_text: However, further investigation is needed to obtain
          direct evidence for faster degradation of R-isomers.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full text cached (PMC3483294). RT-PCR induction plus a
        whole-plant vanadate sensitivity experiment; vanadate inhibits many
        ATPases, so it is not evidence of ZmMRP1 transport activity.
  - id: PMID:29870861
    title: The expression of detoxification genes in two maize cultivars by
      interaction of isoxadifen-ethyl and nicosulfuron.
    full_text_unavailable: true
    findings:
      - statement: ZmMRP1 is up-regulated by the safener isoxadifen-ethyl.
        supporting_text: ZmGSTIV, ZmGST6, ZmGST31 and ZmMRP1 could be considered
          safener-responsive
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: Abstract only in cache; expression data only.
