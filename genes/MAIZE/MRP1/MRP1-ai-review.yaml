      - InterPro:IPR017871
    review:
      summary: MRP1 keeps one consensus ATP site, formed by the NBD2 Walker A
        and a Walker B ending in the catalytic glutamate (ILVLDE) with the
        canonical NBD1 signature MSGGQ; the NBD1 Walker B ends in aspartate
        (VYLLDD), the degenerate site typical of ABCC proteins.
      action: ACCEPT
      reason: A full-size ABCC transporter with an intact consensus site is
        expected to hydrolyse ATP, and the single polypeptide carries both NBDs,
