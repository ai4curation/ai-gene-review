    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
      - InterPro:IPR003439
      - InterPro:IPR011527
      - InterPro:IPR017871
      - InterPro:IPR036640
      - UniRule:UR000400038
    review:
      summary: Two ABC NBDs (PROSITE PS50893, residues 613-834 and 1232-1466)
        with Walker A motifs GPVGSGKS and GRTGSGKS, and a canonical NBD1 ABC
        signature (MSGGQ).
      action: KEEP_AS_NON_CORE
      reason: The domain-based inference is sound and the ATP-binding motifs are
        intact. ATP binding is a step of the ABC transport cycle rather than the
        function itself, which is captured by ABC-type transporter activity and
        ATP hydrolysis activity. No nucleotide-binding data exist for MRP1.
      supported_by:
