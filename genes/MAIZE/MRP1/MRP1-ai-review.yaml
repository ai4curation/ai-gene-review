        supporting_text: Both clones contained two copies each of the membrane
          spanning domains and nucleotide-binding folds diagnostic of the ABC
          superfamily
      - reference_id: file:MAIZE/MRP1/MRP1-bioinformatics/RESULTS.md
        supporting_text: NBD2 has a Walker B ending in the catalytic glutamate
  - description: ATP hydrolysis by the consensus nucleotide-binding site formed
