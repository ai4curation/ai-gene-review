        label: membrane
    supported_by:
      - reference_id: file:MAIZE/MRP1/MRP1-bioinformatics/RESULTS.md
        supporting_text: NBD2 has a Walker B ending in the catalytic glutamate
suggested_questions:
  - question: Which membrane does ZmMRP1 reside in? Most plant ABCC pumps are
      tonoplast proteins, but the MSD0-containing ZmMRP1 has no localization
      data.
  - question: Does ZmMRP1 transport glutathione conjugates of herbicides such as
      metolachlor or atrazine, as proposed from its co-induction with ZmGST27,
      or other conjugates such as glucosides?
  - question: Should UniProt ARBA00057614 (phytic acid transport FUNCTION text)
      apply to ABCC8-like subfamily members such as Q6Y3I1, given that the
      phytic acid function was established for the lpa1/ABCC5-like subfamily?
  - question: Do the two closely linked ZmMRP1 copies reported by Swarbreck et
      al. encode identical proteins, and are both expressed?
suggested_experiments:
  - description: Express ZmMRP1 as a GFP fusion in maize protoplasts or
      Nicotiana benthamiana leaves with tonoplast and plasma membrane markers to
      determine its subcellular location.
    experiment_type: subcellular localization
  - description: Measure ATP-dependent uptake of radiolabelled glutathione
      conjugates (e.g. metolachlor-GS, DNB-GS) and glucoside conjugates into
      vesicles from yeast expressing ZmMRP1, with vanadate and ATP-free controls.
    experiment_type: vesicle transport assay
  - description: Assess herbicide (metolachlor, atrazine) tolerance and
      conjugate accumulation in maize zmmrp1 knockout lines generated by
      CRISPR/Cas9, targeting both linked copies.
    experiment_type: loss-of-function genetics
