      expected to use ATP hydrolysis at its single consensus NBD site to pump an
      as yet unidentified solute across a membrane. Xenobiotic and
      glutathione-conjugate transport are proposed from transcript induction by
      herbicides and safeners but have not been tested.
    molecular_function:
      id: GO:0140359
      label: ABC-type transporter activity
    directly_involved_in:
