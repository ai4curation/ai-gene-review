id: Q94FY8
gene_symbol: SXD1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  SXD1 (Sucrose export defective1) encodes the maize tocopherol cyclase (EC 5.5.1.24), a
  nucleus-encoded chloroplast protein with an N-terminal transit peptide and a Pfam
  Tocopherol_cycl (PF14249) domain, orthologous to Arabidopsis VTE1 and cyanobacterial
  slr1737. It catalyses formation of the chromanol ring of tocopherols, converting
  2,3-dimethyl-6-phytyl-1,4-benzo(hydro)quinone (DMPBQ/DMPQ) to gamma-tocopherol, the
  penultimate step of vitamin E biosynthesis. Recombinant SXD1 is active in vitro and maize
  SXD1 complements a Synechocystis slr1737 knockout. SXD1 is expressed in all green
  tissues and localizes to chloroplasts of both bundle sheath and mesophyll cells; by
  orthology to VTE1 it is expected to be associated with plastoglobules, the
  chloroplast lipoprotein particles where tocopherols accumulate. sxd1 mutants lack
  tocopherols and accumulate DMPBQ; as a downstream consequence they deposit callose over
  plasmodesmata at the bundle sheath-vascular parenchyma interface of minor veins, which
  blocks symplastic sucrose export and causes sugar- and anthocyanin-accumulating
  chlorotic leaf regions and reduced growth. How tocopherol deficiency triggers this
  callose deposition is unknown.
