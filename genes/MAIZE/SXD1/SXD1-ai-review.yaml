core_functions:
- description: >-
    SXD1 is the plastid tocopherol cyclase that closes the chromanol ring of tocopherols,
    converting DMPBQ/DMPQ to gamma-tocopherol in the penultimate step of vitamin E
    biosynthesis. It acts in chloroplasts of bundle sheath and mesophyll cells, and by
    orthology to VTE1 at plastoglobules, the lipoprotein particles where tocopherols
    accumulate.
