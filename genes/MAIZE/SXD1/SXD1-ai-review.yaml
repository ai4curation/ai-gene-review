suggested_questions:
- question: >-
    How does loss of tocopherols (or accumulation of DMPBQ) in sxd1 bundle sheath cells
    trigger callose deposition over plasmodesmata at the bundle sheath-vascular parenchyma
    interface - via lipid peroxidation products, altered plastid retrograde signaling, or
    a direct effect of DMPBQ?
- question: >-
    Does maize SXD1, like Arabidopsis VTE1, also cyclise the geranylgeranyl quinol
    (DMGQ) to form tocotrienols, which are abundant in cereal seeds?
- question: >-
    Is SXD1 associated with plastoglobules in maize bundle sheath and mesophyll chloroplasts,
    as shown for Arabidopsis VTE1?
suggested_experiments:
- description: >-
    Assay recombinant maize SXD1 with DMPQ and DMGQ substrates and measure kinetic parameters
    for tocopherol versus tocotrienol formation.
  hypothesis: SXD1 has both tocopherol and tocotrienol cyclase activity, as its Arabidopsis
    ortholog does.
  experiment_type: in vitro enzyme kinetics
- description: >-
    Fractionate chloroplasts from maize bundle sheath and mesophyll cells (or image a
    fluorescent SXD1 fusion alongside a plastoglobule marker such as a fibrillin) to
    determine SXD1 sub-plastid localization.
  hypothesis: SXD1 is enriched in plastoglobules in both C4 cell types.
  experiment_type: subcellular fractionation and proteomics
- description: >-
    Compare lipid peroxidation markers, DMPBQ levels and callose synthase expression in
    bundle sheath cells of sxd1 versus wild type, and test whether feeding or
    transgenic restoration of tocopherol in bundle sheath cells alone suppresses
    plasmodesmal callose deposition.
  hypothesis: Tocopherol deficiency in bundle sheath cells is sufficient to trigger
    plasmodesmal callose deposition and block of sucrose export.
  experiment_type: genetic complementation and cell-type-specific phenotyping
