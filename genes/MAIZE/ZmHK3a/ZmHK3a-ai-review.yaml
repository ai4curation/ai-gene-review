    label: membrane
  supported_by:
  - reference_id: PMID:15064375
    supporting_text: Thus, at least three ZmHKs functioned as cytokinin-responsive HKs in E.
      coli
  - reference_id: PMID:21778179
    supporting_text: All apparent dissociation constants KD* for cytokinins were within the
      nM range, which is reasonable for a high affinity interaction
  - reference_id: PMID:21778179
    supporting_text: ZmHK3a preferred iP.
suggested_questions:
- question: Is ZmHK3a, like its paralog ZmHK1 and Arabidopsis AHK2, localized mainly to the ER
    membrane, or does it have a significant plasma-membrane pool?
- question: What is the physiological role of the ZmHK3b splice form, which lacks part of the
