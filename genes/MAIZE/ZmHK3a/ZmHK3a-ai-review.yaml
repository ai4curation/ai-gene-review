- id: PMID:15064375
  title: Molecular characterization of cytokinin-responsive histidine kinases in maize.
    Differential ligand preferences and response to cis-zeatin.
  findings:
  - statement: ZmHK3a confers cytokinin-dependent cps::lacZ induction on an E. coli rcsC
      mutant; free bases are more effective than nucleosides and TDZ is active.
    supporting_text: TDZ, a synthetic phenylurea cytokinin, was effective with ZmHK3a but not
      with ZmHK1
  - statement: The ZmHK3b splice form, lacking part of the input domain, does not respond to
      cytokinin.
    supporting_text: ZmHK3b did not respond to any cytokinin tested
  - statement: ZmHK3a transcripts are most abundant in silk.
    supporting_text: ZmHK3a transcripts were predominantly detected in the silk.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC419839). Primary cloning and functional complementation
      paper for ZmHK3a; source of the AgBase IDA/RCA rows.
- id: PMID:21778179
  title: Ligand-binding properties and subcellular localization of maize cytokinin receptors.
  findings:
  - statement: Direct [3H]tZ binding to ZmHK3a with nanomolar apparent KD; iP preferred, tZ
      bound better than cZ, DZ weakest, adenine inactive.
    supporting_text: ZmHK3a preferred iP.
  - statement: ER localization was shown for ZmHK1 and generalized by the authors to the ZmHKs;
      ZmHK3a itself was not localized.
    supporting_text: Taken together, our results suggest that ZmHKs are localized predominantly
      in the ER membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC3193018). Key paper for direct ligand binding by ZmHK3a;
      localization data concern ZmHK1 only.
- id: PMID:22019467
  title: N9-Substituted N⁶-[(3-methylbut-2-en-1-yl)amino]purine derivatives and their
    biological activity in selected cytokinin bioassays.
  findings:
  - statement: Several N9-substituted iP derivatives inactive on CRE1/AHK4 and ZmHK1 weakly
      activate ZmHK3a in the bacterial receptor assay.
    supporting_text: several derivatives induced low but detectable cytokinin-like activation
      in maize ZmHK3a receptor
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only in cache; PubMed-verified. Corroborates ligand-activated
      receptor activity and a distinct ligand profile.
- id: PMID:24585212
  title: Expression and functional analysis of genes encoding cytokinin receptor-like
    histidine kinase in maize (Zea mays L.).
  findings:
  - statement: Overexpression of several ZmHK genes in Arabidopsis alters shoot and root
      development; the abstract names ZmHK3b, not ZmHK3a, among the lines with phenotypes.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract only in cache. Heterologous overexpression phenotypes; not used
      for annotation.
