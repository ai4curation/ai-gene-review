core_functions:
- description: >-
    Membrane-embedded cytokinin receptor histidine kinase. The CHASE input domain binds
    free-base cytokinins (iP preferred over tZ > cZ) with nanomolar affinity, which activates
    autophosphorylation of the HisKA domain and phosphotransfer through the receiver domain
    into a His-Asp phosphorelay.
  molecular_function:
    id: GO:0009885
    label: transmembrane histidine kinase cytokinin receptor activity
  directly_involved_in:
