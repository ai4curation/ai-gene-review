- term:
    id: GO:0019955
    label: cytokine binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: enables
  supporting_entities:
  - ARBA:ARBA00028712
  review:
    summary: >-
      Wrong term: ZmHK3a binds cytokinins (adenine-derived plant hormones), not cytokines
      (animal signalling proteins).
    action: REMOVE
    reason: >-
      Demonstrably wrong electronic mapping. Cytokines are animal immune signalling proteins;
      ZmHK3a binds cytokinins such as iP and trans-zeatin [PMID:21778179]. The correct term,
      GO:0044373 cytokinin binding, is proposed as a NEW IDA row and as the replacement for
      the hormone binding row.
    supported_by:
    - reference_id: PMID:21778179
      supporting_text: ZmHK3a preferred iP.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: ARBA:ARBA00028712
      slot: GO_ID
      requested_change: REPOINT
      asserted_value: GO:0019955
      corrected_value: GO:0044373
      corrected_label: cytokinin binding
      confidence: CONFIRMED
      explanation: >-
        ARBA00028712 assigns GO:0019955 cytokine binding to the plant cytokinin receptor
        ZmHK3a (Q76GZ9). Cytokines are animal signalling proteins; the ligands of
        CHASE-domain histidine kinases are cytokinins, for which the correct term is
        GO:0044373 cytokinin binding. The rule's GO output should be repointed or removed.
      supported_by:
      - reference_id: PMID:21778179
        supporting_text: ZmHK3a preferred iP.
    - defect_type: OTHER
      resource: UNIPROT
      record: UniProtKB:Q76GZ9
      slot: CC FUNCTION
      requested_change: CHECK
      asserted_value: ARBA:ARBA00002427
      confidence: PROBABLE
      explanation: >-
        The ARBA-assigned FUNCTION comment on Q76GZ9 says the receptor "transmits the stress
        signal to a downstream MAPK cascade". That wording comes from osmosensing histidine
        kinases (AHK1-type); no study reports a MAPK cascade downstream of ZmHK3a, which
        signals through a His-Asp phosphorelay. The rule should probably exclude CHASE-domain
        cytokinin receptors.
