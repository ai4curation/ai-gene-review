gene_symbol: ZmHK3a
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  ZmHK3a (Zea mays histidine kinase 3a) is a cytokinin receptor of the AHK2 subfamily of plant
  CHASE-domain sensor histidine kinases. The 1201-residue protein has an N-terminal region with
  several predicted transmembrane helices enclosing the CHASE cytokinin-binding domain, followed
  by a cytoplasmic histidine kinase domain (predicted phospho-His606), a receiver-like domain and
  a C-terminal receiver domain. Expressed in an Escherichia coli rcsC mutant, ZmHK3a confers
  cytokinin-dependent signalling through a His-Asp phosphorelay, responding to free-base
  cytokinins (including cis-zeatin and the phenylurea thidiazuron) more than to their ribosides.
  In direct radioligand assays it binds cytokinins with nanomolar affinity, preferring
  isopentenyladenine, and binds trans-zeatin better than cis-zeatin. A shorter splice form from
  the same locus (ZmHK3b) lacks part of the input domain and is not cytokinin-responsive. ZmHK3a
  transcripts are found in all tissues tested and are most abundant in silk. Its subcellular
  location has not been determined directly; its paralog ZmHK1 resides mainly in the
  endoplasmic reticulum membrane.
