  review:
    summary: Ensembl Compara projection of a nucleus annotation from Arabidopsis NIP5;1
      (AT4G10380), which TAIR made from PMID:39367257.
    action: REMOVE
    reason: >-
      The source annotation is from a paper on nuclear-localized pyruvate kinases PK6, PK7 and
      PK8 that phosphorylate histone H3T11; it does not concern the NIP5;1 aquaporin, so the
      Arabidopsis annotation appears to be on the wrong locus and its projection to maize is
      unfounded. TLS1/NIP3-1 is a six-transmembrane plasma-membrane boric acid channel with
      no nuclear role or nuclear localization reported.
