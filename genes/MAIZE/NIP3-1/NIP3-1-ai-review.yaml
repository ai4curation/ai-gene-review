  title: Transport of boron by the tassel-less1 aquaporin is critical for vegetative and
    reproductive development in maize.
  findings:
  - statement: Positional cloning identifies tls1 as ZmNIP3;1.
    supporting_text: The six EMS -induced tls1 alleles were found to have nonsynonymous
      mutations in the coding region of a gene encoding the major intrinsic protein NIP3;1
  - statement: TLS1 conducts water and boric acid into Xenopus oocytes.
    supporting_text: These results indicate that TLS1 is able to transport boric acid under
      these conditions.
  - statement: tls1 mutants have reduced B and reduced RG-II dimers in inflorescences, rescued by
      B application.
    supporting_text: B content is reduced in tls1 mutants, and application of B rescues the
      mutant phenotype
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read; the cloned gene is named NIP3;1 and corresponds to Q9ATN1
      (ZmNIP3-1). Primary source for both channel activities.
