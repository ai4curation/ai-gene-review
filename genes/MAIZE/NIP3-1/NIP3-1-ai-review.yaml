- description: >-
    Plasma-membrane boric acid (borate) channel that mediates passive boron influx into cells,
    supplying boron for borate cross-linking of rhamnogalacturonan II in growing vegetative
    and inflorescence tissues. Also water-permeable in oocytes.
  molecular_function:
    id: GO:0180044
    label: borate channel activity
  directly_involved_in:
  - id: GO:0035445
    label: borate transmembrane transport
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:25035406
    supporting_text: These results indicate that TLS1 is able to transport boric acid under
      these conditions.
  - reference_id: PMID:25035406
    supporting_text: The TLS1-expressing oocytes contained 4 times as much B as the
      mock-injected oocytes
  - reference_id: PMID:16679457
    supporting_text: green fluorescent protein-tagged NIP5;1 proteins localized to the plasma
      membrane
  knowledge_gaps:
  - gap_statement: The cell types and plasma-membrane domain in which TLS1 acts in maize roots
      and inflorescence meristems are unknown; whether it shows the polar outer-domain
      localization and boron-dependent regulation of AtNIP5;1 has not been tested.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: Should TAIR's annotations of AT4G10380 (NIP5;1) to PMID:39367257 (nucleus,
