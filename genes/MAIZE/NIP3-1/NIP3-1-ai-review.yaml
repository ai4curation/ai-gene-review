id: Q9ATN1
gene_symbol: NIP3-1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  NIP3-1 (ZmNIP3;1) is the maize TASSEL-LESS1 (TLS1) protein, a NOD26-like intrinsic protein
  of the NIP subgroup II aquaporins, co-orthologous to Arabidopsis NIP5;1 and rice NIP3;1. It
  has the six-transmembrane-helix MIP fold with NPS/NPV variants of the two NPA motifs and an
  AIGR aromatic/arginine selectivity filter shared with other boric acid channels. Expressed in
  Xenopus oocytes, TLS1 is permeable to boric acid and to water. tls1 loss-of-function mutants
  have reduced boron in roots, shoots and immature inflorescences, reduced borate cross-linking
  of the pectin rhamnogalacturonan II in developing tassels and ears, and boron-rescuable
  defects in vegetative growth and in tassel and ear development. TLS1 is therefore the
  plasma-membrane boric acid influx channel that supplies boron to growing tissues, acting
  together with the ROTTEN EAR (BOR1-type) efflux transporter in boron homeostasis.
