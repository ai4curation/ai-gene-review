  review:
    summary: Calcium binding through the N-terminal EF-hand region, a conserved regulatory
      feature of plant RBOHs.
    action: KEEP_AS_NON_CORE
    reason: >-
      A5H238 carries a PROSITE EF-hand domain (263-298) and an EF_HAND_1 Ca2+-binding site
      signature, the hallmark of the plant RBOH N-terminal extension, and the maize cloning
      paper describes Ca2+-binding EF-hand motifs in the ZmrbohC N-terminus. In Arabidopsis
      RBOHD, Ca2+ binding to these EF-hands is required for activation of ROS production.
      The term is as precise as the evidence allows; it describes how the enzyme is regulated
      rather than its catalytic function, so it is kept as non-core.
