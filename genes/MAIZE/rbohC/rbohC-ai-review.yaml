core_functions:
- description: >-
    Plasma membrane NADPH oxidase that transfers electrons from cytosolic NADPH via FAD and
    two hemes to extracellular O2, generating apoplastic superoxide (and hence H2O2) used as a
    signal, for example in guard cells and in the elicitor-triggered ROS burst. Activity is
    inferred from the conserved RBOH architecture and Arabidopsis orthologs; maize mutant
    studies of ZmRBOHC report reduced ROS output.
  molecular_function:
    id: GO:0106292
    label: superoxide-generating NADPH oxidase activity
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:19592501
    supporting_text: Likewise, TMD3 and TMD5 contained pairs of histidine residues that are
      important for haem binding in human gp91phox
  - reference_id: PMID:11756663
    supporting_text: putative plant plasma membrane NADPH oxidase can produce superoxide
  - reference_id: PMID:41792868
    supporting_text: ROS burst was also attenuated in Zmrbohc plants
suggested_questions:
- question: Are the ZmRBOHC genes studied genetically by Gao et al. 2022 (PMID:36045577) and
    Fu et al. 2026 (PMID:41792868) the same locus as ZmrbohC/A5H238 (Zm00001d038762)? If so,
    should stomatal closure and defense response to fungus be annotated, given that the
    enzyme itself produces the ROS signal?
- question: Does ZmrbohC protein produce superoxide when expressed heterologously, and is it
    activated by Ca2+, phosphorylation and ZmSRO1d-mediated mono-ADP-ribosylation?
suggested_experiments:
- description: Express ZmrbohC in HEK293T cells and measure superoxide production (L-012
    chemiluminescence, with SOD controls) after ionomycin treatment, with EF-hand mutants and
    with or without co-expressed ZmSRO1d.
  experiment_type: heterologous expression and ROS assay
- description: Localize a fluorescent-protein-tagged ZmrbohC in maize protoplasts or guard
    cells with a plasma membrane marker.
  experiment_type: subcellular localization
