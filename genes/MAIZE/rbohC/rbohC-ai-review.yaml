- id: PMID:19592501
  title: Positive feedback regulation of maize NADPH oxidase by mitogen-activated protein
    kinase cascade in abscisic acid signalling.
  findings:
  - statement: Cloning of ZmrbohC, a 948-aa RBOH (the length of A5H238) most similar to rice
      OsrbohC, with gp91phox-type transmembrane helices, heme histidines and N-terminal EF-hands.
    supporting_text: The ZmrbohC cDNA sequence (3317 bp) had an ORF of 2847 nucleotides,
      encoding a protein of 948 amino acids.
  - statement: ZmrbohC is weakly induced by ABA in maize leaves; ABA and H2O2 raise plasma
      membrane NADPH oxidase activity in two phases, the second dependent on a MAPK cascade.
    supporting_text: The expression of ZmrbohA in phase I and ZmrbohC in phase II induced by
      ABA was slight
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Identifies ZmrbohC with a 948-aa ORF matching A5H238
      (GenBank DQ897930, same authors as the EMBL submission). Membrane NADPH oxidase activity
      was measured in bulk leaf plasma membranes and is not attributed to ZmrbohC alone.
- id: PMID:20693409
  title: ZmMPK5 is required for the NADPH oxidase-mediated self-propagation of apoplastic
    H2O2 in brassinosteroid-induced antioxidant defence in leaves of maize.
  findings:
  - statement: ZmrbohC (primers from DQ897930) transcript is induced by brassinosteroid in maize
      leaves with ZmrbohA, B and D; the late induction depends on apoplastic H2O2 and ZmMPK5.
      Expression evidence only.
    supporting_text: BR treatment significantly elevated the expression of ZmrbohA–ZmrbohD in
      leaves of maize plants.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text read. Measures transcripts of four Zmrboh genes and DPI-sensitive
      apoplastic H2O2; it does not attribute activity to the ZmrbohC protein.
- id: PMID:36045577
  title: Natural variations of ZmSRO1d modulate the trade-off between drought resistance
    and yield by affecting ZmRBOHC-mediated stomatal ROS production in maize.
  findings:
  - statement: ZmSRO1d mono-ADP-ribosylates ZmRBOHC, increasing guard-cell ROS and stomatal
      closure; ZmRBOHC loss-of-function mutants yield more under well-watered conditions but
      have reduced drought resistance.
    supporting_text: loss-of-function mutants of ZmRBOHC showed remarkably
      increased yields under well-watered conditions, whereas they showed compromised
      drought resistance
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Abstract only. The abstract does not give a gene identifier; web gene
      databases link the Gao ZmRBOHC to this locus (ZmRBOHC/ZmRBOH9/rboh3), consistent with
      NCBI's designation "respiratory burst oxidase3", but this was not confirmed from the
      paper itself.
- id: PMID:41792868
  title: ZmWRKY29 Transcriptionally Represses ZmRBOHC to Attenuate ROS Production and
    Facilitates Gibberella Stalk Rot Susceptibility in Maize.
  findings:
  - statement: An EMS stop-gained Zmrbohc mutant has an attenuated chitin-elicited ROS burst and
      is more susceptible to Fusarium graminearum stalk rot; ZmWRKY29 represses ZmRBOHC
      transcription by binding a W-box in its promoter.
    supporting_text: ROS burst was also attenuated in Zmrbohc plants
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: Full text read. ZmRBOHC is called the ortholog of OsRBOHC, as ZmrbohC is in
      PMID:19592501, but no gene identifier is given in the cached text, so identity with
      A5H238 is probable rather than confirmed.
- id: PMID:11756663
  title: Arabidopsis gp91phox homologues AtrbohD and AtrbohF are required for accumulation
    of reactive oxygen intermediates in the plant defense response.
  findings:
  - statement: Superoxide is the proximal product of plant plasma membrane NADPH oxidases.
    supporting_text: putative plant plasma membrane NADPH oxidase can produce superoxide
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Arabidopsis ortholog paper; family-level support for the activity and location.
- id: PMID:18218618
  title: Synergistic activation of the Arabidopsis NADPH oxidase AtrbohD by Ca2+ and
    phosphorylation.
  findings:
  - statement: Ca2+ binding to the EF-hand motifs of AtrbohD activates its ROS production,
      synergistically with phosphorylation.
    supporting_text: This activation required a conformational change in the EF-hand region,
      as a result of Ca(2+) binding to the EF-hand motifs.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Arabidopsis ortholog; supports the EF-hand regulatory mechanism.
