id: A5H238
gene_symbol: rbohC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  rbohC encodes ZmrbohC (ZmRBOHC, ZmRboh07; locus Zm00001d038762 / GRMZM2G043435), a maize
  respiratory burst oxidase homologue (plant NADPH oxidase, gp91phox/NOX2 family) of 948
  amino acids that is most similar to rice OsrbohC. It has a cytosolic N-terminal regulatory
  extension (NADPH_Ox domain with an EF-hand Ca2+-binding region), a multi-pass
  ferric-reductase transmembrane domain with four conserved heme-coordinating histidines, and
  C-terminal cytosolic FAD- and NADPH-binding domains. By homology with Arabidopsis RBOHD and
  RBOHF it is a plasma membrane enzyme that transfers electrons from cytosolic NADPH across
  the membrane to O2, producing apoplastic superoxide that dismutates to H2O2, with activity
  stimulated by Ca2+ and phosphorylation. ZmrbohC transcript is induced in maize leaves by
  abscisic acid, H2O2 and brassinosteroid as part of an H2O2-MAPK (ZmMPK5) amplification
  loop. Genetic studies of maize ZmRBOHC report that it supplies guard-cell ROS for stomatal
  closure and drought resistance (its activity enhanced by ZmSRO1d-mediated
  mono-ADP-ribosylation), contributes to the chitin-elicited ROS burst and resistance to
  Gibberella stalk rot, and that its loss increases grain yield under well-watered
  conditions. No direct biochemical assay of the ZmrbohC protein has been reported.
