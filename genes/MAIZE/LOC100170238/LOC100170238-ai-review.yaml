    label: chloroplast
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: located_in
  supporting_entities:
  - ARBA:ARBA00027369
  review:
    summary: >-
      ARBA prediction of chloroplast localization. ZmTSA has an N-terminal plastid
      transit peptide (TargetP/iPSORT) and a ZmTSA-GFP fusion co-localizes with
      chlorophyll autofluorescence in maize mesophyll protoplasts.
    action: ACCEPT
