description: >-
  LOC100170238 (ZmTSA, tryptophan synthase alpha subunit; B73 gene Zm00001eb301540 on
  chromosome 7) encodes the plastid alpha subunit of maize tryptophan synthase, a
  TrpA-family (beta/alpha)8-barrel enzyme with an N-terminal plastid transit peptide.
  A GFP fusion localizes to chloroplasts in maize mesophyll protoplasts. On its own the
  recombinant protein is a monomer with weak indole-3-glycerol-phosphate lyase activity
  (the alpha-reaction, cleaving indole-3-glycerol phosphate to indole and
  glyceraldehyde 3-phosphate). It assembles with the beta subunit ZmTSB1 into an
  alpha2beta2 heterotetramer, which raises the catalytic efficiency of the alpha-reaction
  and performs the overall tryptophan synthase reaction, converting indole-3-glycerol
  phosphate and L-serine to L-tryptophan. ZmTSA is the alpha subunit identified in the
  native tryptophan synthase complex of maize leaves, where it acts in the final step of
  L-tryptophan biosynthesis. It is expressed throughout the plant and is the presumed
  ancestral, partner-dependent paralog of the stand-alone indole-producing lyases BX1
  and IGL of specialized metabolism.
