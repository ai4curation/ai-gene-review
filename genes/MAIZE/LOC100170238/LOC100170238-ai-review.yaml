        autofluorescence of the chloroplasts (Figure 2A–C), demonstrating plastidic
        localization of ZmTSA.
    - reference_id: PMID:18430213
      supporting_text: ZmTSA was predicted to be plastid localized, while ZmTSAlike, 45
        amino acids shorter at the N-terminus, was expected to be retained in the
        cytoplasm.
