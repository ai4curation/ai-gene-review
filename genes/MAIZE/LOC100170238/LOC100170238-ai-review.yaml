core_functions:
- description: >-
    Alpha subunit of plastid tryptophan synthase. ZmTSA catalyses the alpha-reaction,
    cleavage of indole-3-glycerol phosphate to indole and glyceraldehyde 3-phosphate, an
    activity that is weak alone and strongly stimulated by assembly with ZmTSB1/2 into an
    alpha2beta2 complex. Within that complex it contributes to the overall tryptophan
    synthase reaction (indole-3-glycerol phosphate + L-serine to L-tryptophan), the final
    step of L-tryptophan biosynthesis in the chloroplast.
