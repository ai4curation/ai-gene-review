  review:
    summary: >-
      Electronic assignment of the overall tryptophan synthase reaction (EC 4.2.1.20,
      IGP + L-serine to L-tryptophan + G3P + H2O) from TrpA-family signatures. ZmTSA
      catalyses only the alpha half-reaction; the overall reaction is performed by the
      ZmTSA2-ZmTSB1(2) heterotetramer, with the beta-reaction done by ZmTSB.
    action: ACCEPT
    reason: >-
      The term is true of the gene product as a subunit: ZmTSA forms an alpha2beta2
      complex with ZmTSB1 that performs the full alpha-beta reaction, and ZmTSA is the
      native alpha subunit in leaves (PMID:18430213). The term is kept, but the relation
      should be contributes_to rather than enables, because the beta (condensation)
      reaction requires the TSB subunit; the core function records it as
      contributes_to_molecular_function and the qualifier is queried upstream. GO:0004834
      (a hydro-lyase) is not an ancestor or descendant of GO:0033984, the alpha-reaction
      activity ZmTSA carries out alone (checked in OLS), so the rows are complementary.
    supported_by:
    - reference_id: PMID:18430213
      supporting_text: These results are consistent with formation of a ZmTSA2ZmTSB12
        heterotetramer.
    - reference_id: PMID:18430213
      supporting_text: Heteromerisation with ZmTSB1 resulted in a 32-fold increase of the
        catalytic efficiency of ZmTSA.
    - reference_id: PMID:31090986
      supporting_text: Here, a zmTrpA enzyme is activated by zmTrpB1 in the canonical TS
        whereas a zmBX1 enzyme displays a high IGP lyase activity without an interaction
        partner.
