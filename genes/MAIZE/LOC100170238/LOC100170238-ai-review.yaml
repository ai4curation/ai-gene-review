      Confirmed by direct GFP-fusion localization of this protein in maize cells
      (PMID:18430213) and by the transit-peptide prediction; the chloroplast is the
      major site of plant tryptophan biosynthesis. The sub-compartment (stroma) is
      expected for a soluble enzyme but has not been assayed, so no stroma row is added.
    supported_by:
