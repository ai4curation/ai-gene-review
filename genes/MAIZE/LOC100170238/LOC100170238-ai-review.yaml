  title: Characterisation of the tryptophan synthase alpha subunit in maize.
  findings:
  - statement: ZmTSA (GenBank EU334442, chromosome 7) is the gene product reviewed here;
      its native-complex MS peptides GTTFEDVISMVK and TLEEAASPEEGLK occur in A0A804Q7I2.
    supporting_text: A full-length ZmTSA cDNA clone was isolated [GenBank:EU334442].
    reference_section_type: RESULTS
  - statement: ZmTSA-GFP localizes to chloroplasts in maize mesophyll protoplasts.
    supporting_text: In case of ZmTSA GFP fluorescence coincided with the chlorophyll
      autofluorescence of the chloroplasts (Figure 2A–C), demonstrating plastidic
      localization of ZmTSA.
    reference_section_type: RESULTS
  - statement: Recombinant ZmTSA alone has weak IGP lyase (alpha-reaction) activity.
    supporting_text: A low, but clearly detectable IGP turnover (Kcat = 0.006 s-1) was
      observed (Table 1).
    reference_section_type: RESULTS
  - statement: ZmTSA and ZmTSB1 form an alpha2beta2 heterotetramer that enhances alpha
      catalytic efficiency 32-fold.
    supporting_text: Heteromerisation with ZmTSB1 resulted in a 32-fold increase of the
      catalytic efficiency of ZmTSA.
    reference_section_type: RESULTS
  - statement: ZmTSA is the alpha subunit of the native ~160 kD tryptophan synthase complex
      in maize leaves.
    supporting_text: Therefore, ZmTSA was conclusively identified as component of a maize
      TS complex.
    reference_section_type: RESULTS
  - statement: Free monomeric alpha activity in leaf extracts comes from BX1, not ZmTSA.
    supporting_text: In extracts of bx1 mutants this activity was not present
    reference_section_type: RESULTS
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC2395261). Gene identity confirmed by sequence: four ZmTSA
      peptides from the native complex (Table 2) and the C-terminal GFP-fusion primer
      match A0A804Q7I2, while the ZmTSAlike primer does not. NCBI Gene 100170238 lists
      this PMID. Primary source for localization, activity and complex formation.
- id: PMID:31090986
  title: Generation of a Stand-Alone Tryptophan Synthase α-Subunit by Mimicking an Evolutionary
    Blueprint.
  findings:
  - statement: zmTrpA (ZmTSA) has low intrinsic IGP lyase activity that is allosterically
      stimulated by zmTrpB1, unlike the stand-alone paralog BX1.
    supporting_text: Here, a zmTrpA enzyme is activated by zmTrpB1 in the canonical TS
      whereas a zmBX1 enzyme displays a high IGP lyase activity without an interaction
      partner.
  - statement: zmTrpA is monomeric on its own.
    supporting_text: MS showed that zmTrpA and its variants are monomers, and that zmBX1
      and zmTrpB1 are dimers (Figure S3, Figure S4).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC7293203). NCBI GeneRIF for GeneID 100170238. Enzymology and
      engineering study of zmTrpA loop variants; corroborates partner-dependent alpha
      activity and the evolutionary relationship to BX1.
