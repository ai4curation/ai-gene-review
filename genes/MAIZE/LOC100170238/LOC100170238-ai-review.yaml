suggested_questions:
- question: >-
    Is ZmTSA genetically required for tryptophan biosynthesis in maize, or is it partly
    redundant with ZmTSAlike, BX1 or IGL? No zmtsa loss-of-function allele has been
    characterized, in contrast to the Arabidopsis trp3 (TSA1) mutant.
- question: >-
    GO has no cellular-component term for the tryptophan synthase alpha2beta2 complex;
    should one be requested, so that TSA and TSB subunits can be annotated to the complex
    they form?
suggested_experiments:
- description: >-
    Generate CRISPR knockouts of Zm00001eb301540 (alone and combined with ZmTSAlike) and
    measure free tryptophan, auxin levels and growth with and without tryptophan
    supplementation, to test whether ZmTSA is the non-redundant alpha subunit in vivo.
  experiment_type: genetic loss of function
- description: >-
    Determine the sub-plastid location (stroma versus thylakoid or envelope) of native
    ZmTSA by chloroplast fractionation with compartment markers.
  experiment_type: subcellular fractionation
