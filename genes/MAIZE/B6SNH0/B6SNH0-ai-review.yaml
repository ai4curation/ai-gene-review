  review:
    summary: >-
      Combined automated annotation of DNA-binding transcription factor activity from the
      bZIP domain signatures and a UniRule.
    action: ACCEPT
    reason: >-
      Core function. B6SNH0 carries a canonical bZIP domain (PROSITE PS50217, residues
      139-202) with the basic DNA-binding region signature (PS00036). ZmbZIP60 has
      transcriptional activity in yeast one-hybrid assays, and its TMD-less form is nuclear
      [PMID:22307781]. It partially complements Arabidopsis bzip60 for BiP3 induction
      [PMID:22307781], and the HSFTF13 promoter is a bZIP60 target in maize protoplasts
      [PMID:32843434]. The activity belongs to the spliced, nuclear product of the gene
      (see functional_isoforms); the precursor is the same gene product held at the ER.
      Kept at this level rather than an activator-specific term because the
      direct-activation assays are reported only in abstracts read here.
    supported_by:
    - reference_id: PMID:22307781
      supporting_text: Yeast one-hybrid analysis showed that both ZmbZIP60 and ZmbZIP60ΔC
