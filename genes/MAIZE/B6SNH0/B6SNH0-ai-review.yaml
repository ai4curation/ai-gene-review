  review:
    summary: >-
      Automated ER membrane localization from an ARBA rule and the UniProt subcellular
      location vocabulary.
    action: KEEP_AS_NON_CORE
    reason: >-
      The 300-aa product of unspliced mRNA, which is exactly the B6SNH0 sequence, is
      predicted to be a type II membrane protein with a single TMD [PMID:22417282]; a
      hydrophobic segment (about residues 221-240) is present in the sequence. ER membrane
      residence of the precursor is directly shown for Arabidopsis bZIP60 but not yet for the
      maize protein, and the mRNA is spliced at the ER by an IRE1-type activity. The location
      is plausible and consistent with the sensor mechanism, but it is where the inactive
      precursor is held rather than where the transcription factor acts, so it is non-core.
