core_functions:
- description: >-
    Membrane-anchored bZIP transcription factor of the IRE1 arm of the ER unfolded protein
    response. ER stress or heat triggers unconventional splicing of its mRNA, producing a
    soluble nuclear form that binds DNA through its bZIP domain and activates stress-response
    genes, including BiP genes and, under heat, the heat shock factor HSFTF13.
  molecular_function:
    id: GO:0003700
    label: DNA-binding transcription factor activity
  directly_involved_in:
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  - id: GO:0030968
    label: endoplasmic reticulum unfolded protein response
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:22417282
    supporting_text: Splicing converts the predicted protein from a membrane-associated
      transcription factor to one that is targeted to the nucleus.
  - reference_id: PMID:22307781
    supporting_text: Yeast one-hybrid analysis showed that both ZmbZIP60 and ZmbZIP60ΔC
      had transcriptional activity.
  - reference_id: PMID:32843434
    supporting_text: the HSFTF13 promoter was shown to be a target of bZIP60 in maize
      protoplasts
suggested_questions:
- question: >-
    Should UniProt add the 258-aa spliced ZmbZIP60 product as a separate isoform or entry, so
    that nuclear transcription factor annotations can attach to the form that carries them?
- question: >-
    Which of the two maize IRE1 paralogs splices ZmbZIP60 mRNA, and would that justify the
    more specific GO:0036498 IRE1-mediated unfolded protein response?
- question: >-
    Does ZmbZIP60 bind the HSFTF13 and ZmBIPb promoters directly, and through which
    cis-elements (UPRE, ERSE, p-PURE)?
suggested_experiments:
- hypothesis: The unspliced precursor resides in the ER membrane and the spliced product
    relocates to the nucleus.
  description: >-
    Express a tagged unspliced ZmbZIP60 in maize protoplasts and co-localize with an ER
    marker before and after DTT or heat treatment.
  experiment_type: subcellular localization
- hypothesis: Spliced ZmbZIP60 binds the HSFTF13 and ZmBIPb promoters directly.
  description: >-
    ChIP-qPCR or EMSA with the spliced ZmbZIP60 on the HSFTF13 and ZmBIPb promoters to map
    the bound elements.
  experiment_type: DNA binding assay
- hypothesis: One maize IRE1 paralog is responsible for ZmbZIP60 mRNA splicing.
  description: >-
    Measure ZmbZIP60 splicing under ER stress in maize ire1 mutants of each paralog.
  experiment_type: genetic analysis
