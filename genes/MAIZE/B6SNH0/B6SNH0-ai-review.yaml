product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  B6SNH0 is maize bZIP60 (ZmbZIP60; locus Zm00001d046718/GRMZM2G025812), the plant
  counterpart of the IRE1 splicing target in the unfolded protein response. The 300-residue
  sequence of this entry is the product of unspliced mRNA: a type II membrane protein with an
  N-terminal region, a central bZIP DNA-binding and dimerization domain (residues 139-202),
  and a single C-terminal transmembrane segment predicted to anchor it in the endoplasmic
  reticulum membrane. Under ER stress caused by dithiothreitol or tunicamycin, and under
  heat, a 20-nucleotide intron is excised from its mRNA at a twin-loop structure of the
  IRE1-recognition type. The resulting frameshift yields a 258-residue soluble form that
  lacks the transmembrane segment, gains a putative nuclear localization signal and enters
  the nucleus. There it acts as a DNA-binding transcription activator of stress-response
  genes. It partially restores BiP3 induction in an Arabidopsis bzip60 mutant, and in maize
  it is needed for full heat induction of the heat shock factor HSFTF13 and of several heat
  shock protein, chlorophyll catabolism and chloroplast protein turnover genes, which links
  the ER unfolded protein response to the cytosolic heat shock response. Its own
  transcription is induced by abiotic stresses, and a cis-acting promoter variant in
  tropical lines strengthens its heat induction.
functional_isoforms:
- id: ZMBZIP60_SPLICED
  name: ZmbZIP60s (product of IRE1-type spliced mRNA, 258 aa)
  type: SPLICE_VARIANT
  description: >-
    Excision of a 20-nt intron from ZmbZIP60 mRNA under ER stress or heat shifts the reading
    frame downstream of the bZIP domain. The predicted 258-residue product shares the
    N-terminal region and bZIP domain with B6SNH0 but has a new C-terminus that lacks the
    transmembrane segment and carries a putative nuclear localization signal
    (PMID:22417282). This is the form expected to act as the nuclear transcription factor;
    a GFP fusion to a truncated ZmbZIP60 lacking the transmembrane domain is nuclear
    (PMID:22307781). No UniProtKB or RefSeq protein record for the spliced form was found
    (a UniProt search for the locus returned only B6SNH0).
  source_defects:
  - defect_type: MISSING_ISOFORM
    resource: UNIPROT
    record: UniProtKB:B6SNH0
    slot: ALTERNATIVE PRODUCTS
    requested_change: ADD
    asserted_value: UniProtKB:B6SNH0
    corrected_label: ZmbZIP60 spliced form (258 aa, frameshifted C-terminus without TMD)
    confidence: CONFIRMED
    explanation: >-
      The B6SNH0 entry represents only the 300-aa product of unspliced mRNA. The
      ER-stress-induced spliced mRNA was recovered and sequenced and encodes a 258-aa protein
      with a different C-terminus (PMID:22417282), which is the active nuclear transcription
      factor. No protein record for it exists, so GO annotations for nuclear transcription
      factor activity attach to the precursor sequence.
    supported_by:
    - reference_id: PMID:22417282
      supporting_text: the spliced form is predicted to encode a protein of 258 AA lacking
        a TMD, but having acquired a putative nuclear targeting signal (NLS)
