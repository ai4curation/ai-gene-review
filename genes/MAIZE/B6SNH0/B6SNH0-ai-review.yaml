- id: PMID:22417282
  title: ZmbZIP60 mRNA is spliced in maize in response to ER stress.
  findings:
  - statement: ZmbZIP60 mRNA folds into an IRE1-type twin-loop structure and is spliced,
      excising a 20-nt intron, in response to ER stress.
    supporting_text: A segment of the mRNA encoding ZmbZIP60 in maize can be folded into
      a twin loop structure, and in response to ER stress this mRNA is spliced, excising
      a 20b intron.
  - statement: The unspliced mRNA encodes a 300-aa type II membrane protein, matching the
      B6SNH0 sequence; the spliced form encodes a 258-aa protein lacking the TMD with a
      putative NLS.
    supporting_text: The unspliced mRNA is predicted to encode a type II membrane protein
      of 300 AA with a single transmembrane domain (TMD)
  - statement: Splicing is induced by DTT, tunicamycin and heat.
    supporting_text: Splicing of ZmbZIP60 can be elicited in maize seedlings by ER stress
      agents such as dithiothreitol (DTT) or tunicamycin (TM) or by heat treatment.
  - statement: ZmBIPb is upregulated by ER stress, but direct regulation by ZmbZIP60 was
      not shown.
    supporting_text: It is still unclear whether ZmbZIP60 is directly involved in the
      upregulation of ZmBIPb by ER stress.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (PMC3369818). Establishes the splicing mechanism and that
      B6SNH0 (300 aa) is the unspliced product. Protein localization and TF activity are
      predicted, not assayed, in this paper.
- id: PMID:22307781
  title: Cloning and characterization of the stress-induced bZIP gene ZmbZIP60 from
    maize.
  findings:
  - statement: GFP fused to TMD-less ZmbZIP60 is nuclear, and both full-length and truncated
      forms have transcriptional activity in yeast.
    supporting_text: Yeast one-hybrid analysis showed that both ZmbZIP60 and ZmbZIP60ΔC
      had transcriptional activity.
  - statement: ZmbZIP60 partially complements Arabidopsis bzip60 for tunicamycin induction
      of BiP3.
    supporting_text: The expression of ZmbZIP60 in Arabidopsis bzip60 mutant partially
      restored the induction of BiP3 transcription under TM treatment
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed-verified; abstract only (no PMC record), so the localization and
      yeast assays could not be inspected directly.
