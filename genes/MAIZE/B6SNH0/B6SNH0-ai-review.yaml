- term:
    id: GO:0030968
    label: endoplasmic reticulum unfolded protein response
  evidence_type: IC
  original_reference_id: PMID:22417282
  qualifier: involved_in
  review:
    summary: >-
      Proposed: ZmbZIP60 is the transcription factor output of the IRE1 splicing arm of
      the ER unfolded protein response.
    action: NEW
    reason: >-
      ZmbZIP60 does work in this process rather than being only required for it: the
      response is executed by ER stress-induced splicing of its own mRNA, and the spliced
      product is the transcription factor that induces UPR target genes. Its mRNA is spliced
      in response to the ER stress agents DTT and tunicamycin [PMID:22417282], and it
      partially restores tunicamycin induction of the UPR marker BiP3 in an Arabidopsis
      bzip60 mutant [PMID:22307781]. Comparator check: Arabidopsis bZIP60 carries GO:0030968
      (IMP, IEP), and metazoan XBP1, the equivalent IRE1-target transcription factor, carries
      UPR process terms. The more specific GO:0036498 IRE1-mediated unfolded protein response
      (is_a GO:0030968, checked with OAK) is not used because the maize IRE1 performing the
      splicing has not been identified experimentally.
    supported_by:
    - reference_id: PMID:22417282
      supporting_text: Splicing of ZmbZIP60 can be elicited in maize seedlings by ER stress
        agents such as dithiothreitol (DTT) or tunicamycin (TM) or by heat treatment.
    - reference_id: PMID:22307781
      supporting_text: partially restored the induction of BiP3 transcription under TM
        treatment
