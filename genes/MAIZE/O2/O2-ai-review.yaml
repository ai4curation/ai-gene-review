- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: is_active_in
  supporting_entities:
  - AGI_LocusCode:AT4G02640
  - AGI_LocusCode:AT5G24800
  - AGI_LocusCode:AT5G28770
  - PANTHER:PTN005302957
  - UniProtKB:Q6ZLB0
  review:
    summary: >-
      Phylogenetic inference that O2 is active in the nucleus.
    action: ACCEPT
    reason: >-
      O2 localizes to the nucleus in maize and tobacco cells, and two NLSs, one inside the
      basic DNA-binding region, were mapped with GUS fusions [PMID:1332794]. In onion
      cells YFP-O2 is predominantly nuclear, and nuclear entry is what ZmTaxilin blocks to
      repress its activity [PMID:22937104]. Endosperm nuclear extracts contain O2 that
      binds its zein-promoter site [PMID:1392590]. The nucleus is where its core activity
      takes place.
    supported_by:
    - reference_id: PMID:1332794
      supporting_text: The maize regulatory protein Opaque-2 (O2) localizes to the nucleus
        in both maize and tobacco cells.
    - reference_id: PMID:22937104
      supporting_text: YFP-O2 was completely repressed to be transported into nucleus when
        YFP-O2 and CFP-Taxilin were co-expressed
    propagation_review:
