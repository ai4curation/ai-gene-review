    action: MODIFY
    reason: >-
      Correct for O2 and well grounded in its own experiments, but less specific than the
      evidence allows. O2 binds defined sequences: the binding site in 22-kD zein
      promoters was mapped by DNase I footprinting and requires an ACGT core
