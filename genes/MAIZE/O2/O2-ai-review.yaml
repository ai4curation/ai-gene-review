- term:
    id: GO:0010581
    label: regulation of starch biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:27621432
  qualifier: involved_in
  review:
    summary: >-
      Proposed: O2 directly activates promoters of starch-synthesis genes (PPDK1, PPDK2,
      SSIII) together with PBF.
    action: NEW
    reason: >-
      O2 does work in this regulation rather than only being required for it: the
      promoters of PPDK1, PPDK2 and SSIII carry an O2 box that O2 transactivates, additively
      with PBF at the adjacent prolamin box, and starch content falls by about 11% in o2
      mutants [PMID:27621432]. The transcription factor is the entity that performs the
      regulatory step. Comparator check: EnsemblPlants already projects this term to the
      TrEMBL entry B4FHZ3 of the same O2 locus, so this is not a term curators withheld
      from the gene. Kept non-core relative to zein regulation; the evidence was read in
      abstract only.
    supported_by:
    - reference_id: PMID:27621432
      supporting_text: When the promoters of these genes were analyzed, we found a
        prolamine box and an O2 box that can be additively transactivated by PBF and O2.
    - reference_id: PMID:27621432
      supporting_text: The starch content in the PbfRNAi and o2 mutants was reduced by
        ∼5% and 11%, respectively, compared with normal genotypes.
    - reference_id: file:MAIZE/O2/O2-deep-research-manual.md
      supporting_text: NCBI Gene 542375 ("opaque endosperm 2", aliases
        GRMZM2G015534, Zm00001d018971, o2) lists both P12959 (UniProtKB/Swiss-Prot) and
        B4FHZ3 as protein products, so the two accessions are the same gene.
