core_functions:
- description: >-
    Endosperm bZIP transcription activator that binds ACGT-core O2-box sites in the
    promoters of 22-kD and other zein genes, the b-32 albumin gene and its own gene, as a
    homodimer or with bZIP partners, and activates their transcription in the nucleus,
    in cooperation with the Dof factor PBF bound at the adjacent prolamin box.
  molecular_function:
    id: GO:0001216
    label: DNA-binding transcription activator activity
  directly_involved_in:
  - id: GO:0045893
    label: positive regulation of DNA-templated transcription
  locations:
  - id: GO:0005634
    label: nucleus
  supported_by:
  - reference_id: PMID:1392590
    supporting_text: in yeast cells the O2 protein can activate expression of a lacZ
      gene containing a multimer of the O2 target sequence as part of its promoter,
      thus confirming its role as a transcriptional activator
  - reference_id: PMID:2001677
    supporting_text: It is shown that the promoter of the b-32 gene is activated in vivo
      in the presence of the O2 gene product
  - reference_id: PMID:22937104
    supporting_text: YFP-O2 is able to induce transcription of the z1C promoter by 3–4
      fold relative to the negative controls
  - reference_id: PMID:1332794
    supporting_text: The maize regulatory protein Opaque-2 (O2) localizes to the nucleus
      in both maize and tobacco cells.
suggested_questions:
- question: >-
    The task-named TrEMBL entry B4FHZ3 and the Swiss-Prot entry P12959 are both products
    of NCBI Gene 542375 but carry different GOA sets (EnsemblPlants projections appear only
    on B4FHZ3). Should GOA annotations for the O2 locus be consolidated on P12959?
- question: >-
    Is there a need for a GO process term covering transcriptional regulation of seed
    storage protein genes, so that O2, PBF and their orthologs (rice RISBZ1, barley BLZ2,
    wheat SPA) can be annotated beyond generic positive regulation of transcription?
- question: >-
    Does phosphorylation of O2 control its DNA binding in endosperm directly, and which
    kinase is responsible?
suggested_experiments:
- hypothesis: ZmTaxilin retains O2 outside the nucleus in developing endosperm, not
    only in heterologous onion cells.
  description: >-
    Co-localize tagged O2 and ZmTaxilin in maize endosperm cells across development,
    and test O2 target expression in ZmTaxilin knockouts.
  experiment_type: subcellular localization
- hypothesis: O2 binds the PPDK1, PPDK2 and SSIII promoters in vivo through the O2 box.
  description: >-
    ChIP-qPCR for O2 at the starch-gene promoters in wild type and o2 endosperm, with
    reporter assays of O2-box mutant promoters.
  experiment_type: chromatin immunoprecipitation
