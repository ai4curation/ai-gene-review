id: P12959
gene_symbol: O2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  Opaque-2 (O2) is an endosperm-specific basic leucine zipper (bZIP) transcription
  factor of maize and the founding member of a group of cereal bZIPs that control seed
  storage protein synthesis. The 453-residue protein has an N-terminal acidic activation
  domain, two nuclear localization signals (one SV40-like and one bipartite signal within
  the basic region) and a C-terminal bZIP domain (residues 225-288). In the nucleus of
  developing endosperm cells it binds, as a homodimer or as a heterodimer with the bZIP
  partner OHP1, ACGT-core sites such as the O2 box of 22-kD alpha-zein promoters and the
  GATGAYRTGR sites of the b-32 albumin promoter, and activates their transcription. It
  also binds and activates its own promoter. ChIP-seq places O2 on more than a thousand
  genes, including most zein genes, two transcription factor genes and genes of carbon,
  amino-acid and stress metabolism. Together with the Dof zinc-finger factor PBF, which
  binds the adjacent prolamin box, it also directly activates genes of the starch
  synthesis machinery (PPDK1, PPDK2, SSIII). Its activity is modulated by partner proteins
  such as the coiled-coil protein ZmTaxilin, which retains it outside the nucleus. Loss of
  O2 in the opaque-2 mutant greatly reduces 22-kD zeins, giving soft, opaque, lysine-rich
  kernels, and also lowers starch content.
