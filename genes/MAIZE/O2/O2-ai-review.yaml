  findings:
  - statement: YFP-O2 activates the 22-kD zein z1C promoter 3-4 fold in onion epidermal
      cells.
    supporting_text: YFP-O2 is able to induce transcription of the z1C promoter by 3–4
      fold relative to the negative controls
  - statement: ZmTaxilin interacts with O2 and prevents its nuclear import, lowering its
      transcriptional activity by 47%.
    supporting_text: the transcriptional activity on z1C promoter was reduced by 47% when
      compared to YFP-O2 alone
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
