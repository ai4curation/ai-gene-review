  review:
    summary: Calcium binding through the N-terminal EF-hand region, a conserved regulatory
      feature of plant RBOHs.
    action: KEEP_AS_NON_CORE
    reason: >-
      Q0MRQ8 carries a PROSITE EF-hand domain (179-214) and an EF_HAND_1 Ca2+-binding site
      signature, and the maize cloning paper describes Ca2+-binding EF-hand motifs in the
      N-termini of the ZmrbohA-D proteins. In the clade IV Arabidopsis orthologs RbohH and
      RbohJ, point mutations in the EF-hand motifs abolish Ca2+-induced ROS production. The
      term is as precise as the evidence allows; it describes how the enzyme is regulated
      rather than its catalytic function, so it is kept as non-core.
