  review:
    summary: Inferred automatically from the incorrect peroxidase activity row. ZmrbohA
      produces ROS; it does not detoxify them.
    action: REMOVE
    reason: >-
      This GO_REF:0000108 inference rests solely on GO:0004601 peroxidase activity, a wrong
      InterPro2GO mapping for this family (see that row). An NADPH oxidase generates
      superoxide and H2O2; removing their toxicity is the opposite of its activity. The
      induction of antioxidant enzymes downstream of NADPH oxidase-derived H2O2 in
      brassinosteroid-treated maize leaves is a signalling consequence carried out by other
      enzymes, not participation of ZmrbohA in detoxification.
