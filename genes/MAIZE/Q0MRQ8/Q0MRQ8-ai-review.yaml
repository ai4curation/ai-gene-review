taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  Q0MRQ8 is ZmrbohA (PeroxiBase ZmRboh03; GeneID 778438), an 852-amino-acid maize respiratory
  burst oxidase homologue (plant NADPH oxidase, gp91phox/NOX2 family). Phylogenetically it
  belongs to the clade IV plant RBOHs together with Arabidopsis RbohH and RbohJ and rice
  OsrbohD and OsrbohE, and is most similar to OsrbohE. It has a cytosolic N-terminal
  regulatory extension (NADPH_Ox domain with an EF-hand Ca2+-binding region), a multi-pass
  ferric-reductase transmembrane domain with four conserved heme-coordinating histidines, and
  C-terminal cytosolic FAD- and NADPH-binding domains. By homology with Arabidopsis RbohH and
  RbohJ, which are Ca2+-activated plasma membrane ROS-producing enzymes required for pollen
  tube tip growth, it is expected to transfer electrons from cytosolic NADPH across the plasma
  membrane to O2, producing apoplastic superoxide that dismutates to H2O2. In maize leaves the
  ZmrbohA transcript is induced by abscisic acid, H2O2 and brassinosteroid as part of an
  H2O2- and MAPK (ZmMPK5)-dependent amplification loop. No biochemical assay, localization or
  mutant of the ZmrbohA protein has been reported.
