core_functions:
- description: >-
    Plasma membrane NADPH oxidase that transfers electrons from cytosolic NADPH via FAD and
    two hemes to extracellular O2, generating apoplastic superoxide (and hence H2O2) used as a
    signal; activity is expected to be stimulated by Ca2+ binding to the N-terminal EF-hands.
    Inferred from the conserved RBOH architecture and the clade IV Arabidopsis orthologs
    RbohH and RbohJ; no direct assay of the maize protein exists.
  molecular_function:
    id: GO:0106292
    label: superoxide-generating NADPH oxidase activity
  locations:
