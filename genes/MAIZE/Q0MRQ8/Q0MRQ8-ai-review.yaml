suggested_questions:
- question: In which maize tissues is ZmrbohA mainly expressed? Its clade IV Arabidopsis
    orthologs RbohH/J act in pollen tubes, but ZmrbohA is detected and hormone-induced in
    leaves; does it have a pollen or reproductive role in maize (for example, is it the
    "RBOHH" flowering-time candidate Zm00001d042961 of PMID:41484844)?
- question: Does the ZmrbohA protein produce superoxide when expressed heterologously, and is
    its activity Ca2+- and phosphorylation-dependent like RbohH/J?
suggested_experiments:
- description: Express ZmrbohA in HEK293T cells and measure superoxide production (L-012
    chemiluminescence with SOD controls) after ionomycin treatment, with EF-hand point mutants.
  experiment_type: heterologous expression and ROS assay
- description: Localize fluorescent-protein-tagged ZmrbohA in maize protoplasts and growing
    pollen tubes with a plasma membrane marker, and test pollen tube growth in zmrbohA mutants.
  experiment_type: subcellular localization and mutant phenotyping
