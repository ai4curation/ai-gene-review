gene_symbol: LOC100193331
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >-
  LOC100193331 is the maize brassinosteroid-deficient dwarf1 (brd1) gene (GRMZM2G103773;
  Zm00001eb050010), encoding CYP85A1, the single brassinosteroid C-6 oxidase of maize. It is a
  465-residue heme-thiolate cytochrome P450 with an N-terminal hydrophobic membrane anchor. By
  orthology with the biochemically characterised Arabidopsis BR6ox and tomato DWARF CYP85A1
  enzymes, it catalyses the NADPH-cytochrome P450 reductase-dependent C-6 oxidation (via a
  6alpha-hydroxy intermediate) of late 6-deoxo brassinosteroid intermediates, such as
  6-deoxocastasterone to castasterone and 6-deoxotyphasterol to typhasterol, the late
  activation steps of brassinosteroid biosynthesis. Loss-of-function alleles (brd1-m1,
  lilliputian1) cause a severe brassinolide-rescuable dwarf phenotype with almost no internode
  elongation, no etiolation response, altered leaf, ligule and auricle morphology and feminized,
  sterile tassels. brd1 expression is feedback-repressed by brassinolide, and its regulation by
  ZmRAVL1 underlies natural variation in maize leaf angle (UPA1).
