  review:
    summary: Membrane location from the UniProt subcellular-location mapping; BRD1 has an
      N-terminal hydrophobic anchor typical of microsomal class II P450s.
    action: ACCEPT
    reason: >-
      The N-terminal hydrophobic segment (residues 1-16, called by SignalP but in class II P450s
      the membrane anchor) supports a membrane location, and the CYP85-type C-6 oxidation of
      6-deoxocastasterone is carried by a membrane-associated microsomal preparation in bean.
