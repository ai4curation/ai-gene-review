  title: Loss-of-function of a rice brassinosteroid biosynthetic enzyme, C-6 oxidase, prevents
    the organized arrangement and polar elongation of cells in the leaves and stem.
  findings:
  - statement: Rice brd1 mutants are BR C-6 oxidase deficient and complemented by OsDWARF, whose
