    summary: Generic P450 monooxygenase activity from the combined ARBA/InterPro pipeline.
    action: MODIFY
    reason: >-
      Correct but general. BRD1 is a CYP85A1 brassinosteroid C-6 oxidase; its CYP85A1 orthologs
      oxidise C-6 of several 6-deoxo brassinosteroids (via 6alpha-hydroxylation) using O2 and
      NADPH-cytochrome P450 reductase. GO has no C-6 oxidase term (one is proposed below), so the
      most specific existing descendants of GO:0004497 that fit are steroid hydroxylase activity
      (GO:0008395, is_a GO:0004497, checked with OAK) and the flavoprotein-donor P450 class
      GO:0016712 (is_a GO:0016705 and GO:0004497, checked with OAK). Both are listed.
    proposed_replacement_terms:
    - id: GO:0008395
      label: steroid hydroxylase activity
    - id: NTR
      label: brassinosteroid 6-oxidase activity
    - id: GO:0016712
