- id: PMID:22292043
  title: Brd1 gene in maize encodes a brassinosteroid C-6 oxidase.
  findings:
  - statement: Map-based cloning places the brd1-m1 dwarf mutation in GRMZM2G103773, a 465-aa
      CYP85A1 brassinosteroid C-6 oxidase; the nonsense allele truncates the protein after
      residue 165.
    supporting_text: The single base pair mutation in event NM4089 resulted in the creation of
      a stop codon after amino acid 165
  - statement: The brd1-m1 dwarf and etiolation defects are partially rescued by brassinolide.
    supporting_text: This phenotype could be rescued by exogenous application of brassinolide
      as was shown with at least fifteen mutant plants
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. GRMZM2G103773 confirmed as NCBI GeneID 100193331 alias. No
      enzyme assay or BR quantification on the maize protein; activity assigned by homology.
- id: PMID:11402205
  title: Brassinosteroid-6-oxidases from Arabidopsis and tomato catalyze multiple C-6
    oxidations in brassinosteroid biosynthesis.
  findings:
  - statement: Arabidopsis and tomato CYP85A1 enzymes expressed in yeast oxidise C-6 of several
      6-deoxo brassinosteroids.
    supporting_text: Our results indicate that the AtBR6ox gene and the tomato Dwarf gene encode
      steroid-6-oxidases and that these enzymes have a broad substrate specificity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Ortholog biochemistry (GC-MS of yeast feeding assays); basis for the
      orthology-based activity assignment.
