core_functions:
- description: >-
    Brassinosteroid C-6 oxidase (CYP85A1): a membrane-anchored heme-thiolate P450 that, with
    NADPH-cytochrome P450 reductase and O2, oxidises C-6 of late 6-deoxo brassinosteroid
    intermediates (e.g. 6-deoxocastasterone to castasterone), producing the active
    brassinosteroids required for internode elongation and normal leaf and tassel development
    in maize. Activity is assigned by orthology to biochemically characterised CYP85A1 enzymes
    and supported by the brassinolide-rescuable brd1 null phenotype.
  molecular_function:
    id: GO:0008395
    label: steroid hydroxylase activity
  directly_involved_in:
  - id: GO:0016132
    label: brassinosteroid biosynthetic process
  locations:
  - id: GO:0016020
    label: membrane
  supported_by:
  - reference_id: PMID:11402205
    supporting_text: Our results indicate that the AtBR6ox gene and the tomato Dwarf gene encode
      steroid-6-oxidases and that these enzymes have a broad substrate specificity.
  - reference_id: PMID:22292043
    supporting_text: These proteins encode brC-6 oxidase, an enzyme that catalyzes the last
      steps of brassinosteroid biosynthesis and belong to the family of cytochromes P450.
proposed_new_terms:
- proposed_name: brassinosteroid 6-oxidase activity
  proposed_definition: Catalysis of the two-step NADPH-hemoprotein reductase- and O2-dependent
    oxidation of a 6-deoxo brassinosteroid at C-6, via a 6alpha-hydroxy intermediate, to the
    corresponding 6-oxo brassinosteroid, e.g. 6-deoxocastasterone to castasterone, or
    6-deoxotyphasterol to typhasterol.
  justification: The defining activity of CYP85A enzymes (Rhea reactions RHEA:70043, RHEA:70039
    and RHEA:70035 on the UniProt record) has no GO term; the only CYP85-related term,
    GO:0102734 brassinolide synthase activity, describes the distinct Baeyer-Villiger
    lactonisation done by CYP85A2/A3.
  proposed_parent:
    id: GO:0016712
    label: oxidoreductase activity, acting on paired donors, with incorporation or reduction
      of molecular oxygen, reduced flavin or flavoprotein as one donor, and incorporation of
      one atom of oxygen
  supported_by:
  - reference_id: PMID:11402205
    supporting_text: Our results indicate that the AtBR6ox gene and the tomato Dwarf gene encode
      steroid-6-oxidases and that these enzymes have a broad substrate specificity.
suggested_questions:
- question: Does maize CYP85A1 (BRD1), as the single grass CYP85A, also convert castasterone to
    brassinolide (CYP85A2-like Baeyer-Villiger activity), or is castasterone the end product in
    maize vegetative tissues?
- question: Is BRD1 localized to the endoplasmic reticulum membrane like other microsomal
    class II P450s?
suggested_experiments:
- description: Express maize BRD1 with a P450 reductase in yeast or insect-cell microsomes and
    feed 6-deoxocastasterone, 6-deoxotyphasterol and castasterone, analysing products by GC-MS
    or LC-MS/MS; in parallel quantify endogenous BR intermediates in brd1-m1 versus wild type.
  hypothesis: BRD1 is a broad-specificity BR C-6 oxidase; brd1-m1 accumulates 6-deoxo BRs and
    lacks castasterone.
  experiment_type: heterologous enzyme assay and BR profiling
- description: Image a BRD1-fluorescent protein fusion co-expressed with an ER marker in maize
    protoplasts or Nicotiana benthamiana leaves.
  hypothesis: BRD1 is anchored in the ER membrane through its N-terminal hydrophobic segment.
  experiment_type: subcellular localization
