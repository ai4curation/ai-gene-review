- term:
    id: GO:0016132
    label: brassinosteroid biosynthetic process
  evidence_type: ISS
  original_reference_id: PMID:22292043
  qualifier: involved_in
  review:
    summary: BRD1 catalyses the C-6 oxidation steps of brassinosteroid biosynthesis; the maize
      brd1 null is a brassinolide-rescuable BR-deficient dwarf.
    action: NEW
    reason: >-
      The NEW bar is met because BRD1 itself performs steps of the pathway: its CYP85A1
      orthologs (Arabidopsis BR6ox, tomato DWARF) convert 6-deoxoteasterone,
      3-dehydro-6-deoxoteasterone, 6-deoxotyphasterol and 6-deoxocastasterone to their 6-oxo products in
      yeast, and maize BRD1 is 85% identical to rice BRD1 and 58% to Arabidopsis BR6ox1. The
      maize genetics (nonsense allele removing the P450 domain, phenotype rescued by
      brassinolide) confirms the enzyme acts in this pathway in maize. Comparator check:
      Arabidopsis BR6OX1/CYP85A1 carries GO:0016132 by IDA from PMID:11402205 and by IBA. No
      ancestor or descendant of this term is already on the gene.
    supported_by:
    - reference_id: PMID:11402205
      supporting_text: Our results indicate that the AtBR6ox gene and the tomato Dwarf gene encode
        steroid-6-oxidases and that these enzymes have a broad substrate specificity.
    - reference_id: PMID:22292043
      supporting_text: This phenotype could be rescued by exogenous application of brassinolide
        as was shown with at least fifteen mutant plants
    - reference_id: PMID:22292043
      supporting_text: These proteins encode brC-6 oxidase, an enzyme that catalyzes the last
        steps of brassinosteroid biosynthesis and belong to the family of cytochromes P450.
    - reference_id: file:MAIZE/LOC100193331/LOC100193331-deep-research-manual.md
      supporting_text: GRMZM2G103773 is the gene cloned as maize *brd1* by Makarevitch et al. 2012
