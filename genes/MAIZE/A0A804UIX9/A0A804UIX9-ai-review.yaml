      - reference_id: file:MAIZE/A0A804UIX9/A0A804UIX9-hypotheses/core-function-1-go-0003674/openscientist.md
        supporting_text: The assignment of GO:0003674 (the root molecular_function term) as the molecular function annotation for A0A804UIX9 is correct and reflects genuine uncertainty rather than annotation neglect.
suggested_questions:
  - question: >
      What is the molecular function of PGG-only membrane proteins (PANTHER PTHR24177, Pfam
      PF13962 without ankyrin repeats)? Do they form channels or transporters like ACD6 does,
      even though they lack ankyrin repeats, or do they act as membrane scaffolds or partners of
      ankyrin-PGG proteins?
  - question: >
      Which Zm00001eb381380 transcript structure is real? The canonical T001 model ends in a
      non-conserved, apparently frame-shifted C-terminal tail. T002 splices out part of the
      conserved second PGG motif. Neither matches the tandem paralog Zm00001eb380900 along its
      whole length. Full-length cDNA or long-read evidence would settle the model.
  - question: >
      Why is the plant-only PANTHER family PTHR24177 named CASKIN, when it contains no metazoan
      members and human CASKIN1 is classified in PTHR24174?
suggested_experiments:
  - hypothesis: The Zm00001eb381380 gene model is incorrect at its 3' end.
    description: >
      Sequence full-length transcripts of Zm00001eb381380 by RT-PCR or Iso-Seq from B73 tissues
      where it is expressed. Compare them with T001 and T002, and with the tandem paralog
      Zm00001eb380900, to define the true coding sequence and the extent of the second PGG domain.
    experiment_type: transcript structure determination
  - hypothesis: A0A804UIX9 is an integral membrane protein localized to a specific cellular membrane.
    description: >
      Express GFP-tagged A0A804UIX9 (corrected coding sequence) in maize protoplasts or Nicotiana
      benthamiana leaf epidermal cells. Image by confocal microscopy and co-stain with organelle
      markers for the ER, Golgi, plasma membrane and tonoplast.
    experiment_type: fluorescence microscopy
  - hypothesis: A0A804UIX9 and its tandem paralog have a role in maize development or stress response.
    description: >
      Generate CRISPR/Cas9 single and double knockouts of Zm00001eb381380 and Zm00001eb380900 in
      maize. Phenotype the lines under normal growth and under biotic and abiotic stress.
    experiment_type: reverse genetics
