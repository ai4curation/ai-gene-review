id: A0A804UIX9
gene_symbol: A0A804UIX9
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:4577
  label: Zea mays
description: >
  A0A804UIX9 is an uncharacterized PGG domain-containing protein from Zea mays (B73), encoded by
  gene model Zm00001eb381380 on chromosome 9 (canonical transcript T001, 375 amino acids; the
  alternative transcript T002 encodes A0A804R394). It has a disordered, polar N-terminal region
  (residues 1-44) followed by two tandem PGG domains (Pfam PF13962; residues 50-157 and 217-294)
  that carry six predicted transmembrane helices, so it is a predicted multi-pass integral membrane
  protein. Residues 1-297 are nearly identical to the neighbouring tandem paralog Zm00001eb380900
  (A0A804R017), but the C-terminal ~78 residues are not conserved and appear to be a frame-shifted
  read-through, so the second PGG domain of this gene model probably lacks its final
  membrane-spanning segment. PANTHER places the protein in PTHR24177 (named CASKIN, but composed
  exclusively of plant PGG and ankyrin-PGG proteins), subfamily SF432, a grass/monocot-specific
  clade with no experimentally characterized member. The functionally studied PGG proteins of
  Arabidopsis and rice (ACD6, ITN1, NPR4) belong to a different PANTHER family (PTHR24186) and
  carry ankyrin repeats that this protein lacks. No experimental data exist for A0A804UIX9, and
  its molecular function and biological role are unknown.
references:
  - id: PMID:34353948
    title: "De novo assembly, annotation, and comparative analysis of 26 diverse maize genomes"
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: >
        This is the maize B73 genome paper cited by UniProt for the nucleotide sequence.
        It provides the genomic context but no functional characterization of this specific gene.
  - id: file:MAIZE/A0A804UIX9/A0A804UIX9-hypotheses/core-function-1-go-0003674/openscientist.md
    title: OpenScientist hypothesis investigation - molecular function of PGG domain protein
    findings:
      - statement: >-
          GO:0003674 (root MF) confirmed as correct. No PGG domain protein in any
          species has a specific MF annotation. PANTHER CASKIN classification is a
          cross-kingdom misassignment. ACD6 (closest characterized homolog) has ion
          channel-like activity but requires ankyrin repeats absent from A0A804UIX9.
    reference_review:
      relevance: MEDIUM
      correctness: DISPUTED
      review_notes: >
        Supports retaining the root molecular_function term for this PGG-only maize
        membrane protein. Two framing claims did not hold up in the 2026-10-21 re-review.
        (1) PTHR24177 does not group plant proteins with animal CASKINs: all 12,734
        UniProt members are Viridiplantae, and human CASKIN1 is classified in PTHR24174.
        Only the family name is misleading. (2) ACD6 is not a phylogenetically close homolog.
        It is in a different PANTHER family (PTHR24186) and shares only the Pfam PGG domain.
        See file:MAIZE/A0A804UIX9/A0A804UIX9-bioinformatics/RESULTS-rereview.md.
  - id: file:MAIZE/A0A804UIX9/A0A804UIX9-deep-research-falcon.md
    title: "Deep research report for A0A804UIX9"
    publication_type: DEEP_RESEARCH
    reference_review:
      relevance: MEDIUM
      correctness: MISCITED
      review_notes: >
        The falcon deep research report incorrectly interprets the PGG domain as being
        characteristic of the PGIP (polygalacturonase-inhibiting protein) family. PGIPs are
        completely extracellular LRR proteins lacking transmembrane domains, whereas A0A804UIX9
        has six predicted transmembrane helices and is classified by PANTHER in the CASKIN family
        (PTHR24177), not in a PGIP family. The citations about PGIP biology (Protsenko et al. 2008,
        Murmu et al. 2025, etc.) are about a different protein family and should not be applied
        to this protein. The report provides useful general context on plant defense and cell wall
        biology but its central functional inference is incorrect.
  - id: file:MAIZE/A0A804UIX9/A0A804UIX9-uniprot.txt
    title: UniProtKB/TrEMBL entry A0A804UIX9
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >
        Source of the sequence-analysis features: Phobius transmembrane helices, Pfam PGG domain
