core_functions:
  - description: >-
      Predicted multi-pass integral membrane protein built from two tandem PGG domains, with no
      experimentally established or phylogenetically transferable molecular activity. Its PANTHER
      family (PTHR24177) and subfamily (SF432) contain no characterized member. The characterized
      PGG proteins (ACD6, ITN1, NPR4) sit in a different PANTHER family and carry ankyrin repeats,
      so their activities are not transferred. The root molecular_function term records that the
      activity is unknown. Membrane localization rests on Phobius transmembrane predictions only.
    molecular_function:
      id: GO:0003674
      label: molecular_function
    locations:
      - id: GO:0016020
        label: membrane
