    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0090698
      label: post-embryonic plant morphogenesis
    predicted_term_type: GO_BP
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Rank 2 (score 8.96). A high-frequency plant biological process asserted with no
        supporting feature: no expression data, no phenotype, no domain implication. It is
        the kind of call that is nearly unfalsifiable for a plant gene and therefore
        contributes nothing to annotation, which is why it is scored as an error rather than
        as a lead.
      supported_by:
        - reference_id: file:MAIZE/A0A804UIX9/A0A804UIX9-uniprot.txt
          supporting_text: PGG domain-containing protein
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0047396
      label: glycosylphosphatidylinositol diacylglycerol-lyase activity
    predicted_term_type: GO_MF
    review:
      assessment: NPI
      confidence_score: 0
      error_type: FREQUENCY_BIAS
      summary: >-
        Rank 4 by score (8.79), reviewed in place of rank 3 whose label ("preassembly of GPI
        anchor in ER membrane") no longer resolves to a current GO term. Asserting a specific
        lyase reaction for a protein whose molecular function this review determined to be
        undeterminable is the failure that matters most here: the correct output for this
        entry is the root molecular function term, and a retrieval model that always returns
        k specific terms has no way to produce it. That is a structural property of the
        approach, not a tuning problem.
      supported_by:
        - reference_id: file:MAIZE/A0A804UIX9/A0A804UIX9-uniprot.txt
          supporting_text: PGG domain-containing protein
