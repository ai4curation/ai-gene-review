id: A0A804UIX9
gene_symbol: A0A804UIX9
taxon:
  id: NCBITaxon:4577
  label: Zea mays
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for a maize PGG-domain protein with six predicted
  transmembrane helices whose molecular function this review concludes is genuinely
  unknown - no PGG-domain protein in any species carries a specific molecular function GO
  annotation. That makes this the benchmark's cleanest test of whether a model will
  abstain. ProTrek does not: it returns two GPI-anchor biosynthesis processes, a
  GPI-specific phospholipase activity and an aluminium ion transporter, at scores of 10.2
  down to 8.7 - among the lowest in the benchmark - and two of the five resolve to
  obsoleted GO terms. The membrane-associated framing is broadly consistent with six
  predicted TM helices, which is the one thing that can be said for the output. ProtNLM2
  made no GO prediction for this protein, which for an unannotatable entry is arguably the
  better behaviour.
  Assessment: 0 correct (COR/CNN/LSP), 1 uncertain (UNC), 2 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/MAIZE/A0A804UIX9/A0A804UIX9-uniprot.txt
predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0045052
      label: protein insertion into ER membrane by GPI attachment sequence
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Top-ranked hit (score 10.18). GPI-anchor attachment is carried out by the
        multi-subunit GPI transamidase; this protein has no PIG-family domain and no
        similarity to any transamidase subunit. The only supportable component of the call is
        that it involves an ER membrane protein, which matches the six predicted TM helices.
        Recorded as uncertain rather than incorrect because at a score of 10.2 the model is
        effectively reporting no match, and because the term is obsolete in the current GO
        release so it could not be entered regardless.
      supported_by:
        - reference_id: file:MAIZE/A0A804UIX9/A0A804UIX9-uniprot.txt
          supporting_text: PGG domain-containing protein
  - source_method: ProTrek
