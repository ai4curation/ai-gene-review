description: >-
  ProtNLM2 made no predictions (GO or subcellular location) for
  PGG domain-containing protein. The model returned only a protein name.
  This absence is assessed as appropriate. The gene has no GOA annotations,
  no experimental data, and no PubMed literature (searches for the accession,
  gene model Zm00001eb381380, and PGG domain proteins in maize return nothing).
  The gene review describes a predicted multi-pass membrane protein built from
  two tandem PGG domains in a grass-specific PANTHER subfamily (PTHR24177:SF432)
  with no characterized member, and retains only the root molecular_function
  term, so there is no supported specific GO term the model missed. A membrane
  location could have been inferred from the predicted transmembrane helices,
  but no GO or location prediction was made to assess.
