core_functions:
- description: >-
    Small two-TM PMP3-family proteolipid of the plasma membrane that, when expressed in
    yeast, substitutes for Pmp3 in conferring Na+ and hygromycin B tolerance, consistent
    with a role in limiting plasma membrane hyperpolarization and cation influx under
    salt stress. Its molecular activity is unknown, so no molecular function term is
    asserted.
