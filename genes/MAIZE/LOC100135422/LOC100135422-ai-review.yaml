suggested_questions:
- question: >-
    What is the molecular activity of PMP3-family proteolipids? Does ZmPMP3-1 itself
    depolarize the plasma membrane (e.g. by forming a conductance, binding lipids such as
    phosphoinositides, or modulating H+-ATPase or K+ channels), or does it act indirectly?
- question: >-
    Does ZmPMP3-1 complement the yeast pmp3 deletion by restoring plasma membrane potential
    when measured directly (e.g. DiSC3(5) fluorescence), rather than inferred from
    hygromycin B sensitivity?
- question: >-
    Would a regulation-of-membrane-potential process term be justified for the PMP3 family
    once a direct measurement exists in a plant member?
suggested_experiments:
- description: >-
    Measure plasma membrane potential (DiSC3(5) or electrophysiology) and Na+/K+ content in
    yeast pmp3 deletion cells expressing ZmPMP3-1 versus empty vector, with the ZmPMP3-6
    non-complementing paralog as a negative control.
  experiment_type: heterologous complementation with direct membrane-potential measurement
- description: >-
    Generate CRISPR knockouts of Zm00001eb417550 in maize (alone and with group I paralogs
    ZmPMP3-5/7/8) and measure root membrane potential, Na+/K+ accumulation and growth under
    salt stress.
  experiment_type: genetic loss of function
