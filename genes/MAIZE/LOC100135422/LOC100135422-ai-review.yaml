description: >-
  LOC100135422 (ZmPMP3-1; NCBI alias hydrophobic protein LTI6B/RCI2B, B73 gene
  Zm00001eb417550 on chromosome 10) encodes a 58-residue PMP3/RCI2/Esi3-family
  proteolipid with two transmembrane helices. A GFP fusion localizes to the plasma
  membrane of onion epidermal cells, persisting at the retracted membrane after
  plasmolysis. The gene is induced by salt in shoots and roots. Expressed in a yeast
  pmp3 deletion strain it suppresses Na+ and hygromycin B sensitivity, a phenotype
  attributed in yeast to plasma membrane hyperpolarization, and its overexpression in
  Arabidopsis improves growth under salt stress. Like other PMP3 family members it is
  thought to help maintain plasma membrane potential and cellular ion homeostasis
  under salt stress, but its molecular activity is unknown; the small proteins are
  unlikely to be transporters themselves.
