    summary: >-
      Combined automated annotation from the tau-class GST C-terminal signature,
      EC 2.5.1.18 and a UniRule. LOC542632 is a tau-class GST with intact N- and
      C-terminal GST domains and the conserved catalytic serine of the G-site.
    action: ACCEPT
    reason: >-
      Glutathione transferase activity is the defining activity of tau-class plant GSTs
      that retain the active-site serine, and the motif LKLLGAWPSPFVNRV (Ser19) of
      A0A804QUX9 matches the tau G-site. Independent family signatures agree (InterPro
      GST_C_Tau, CDD GST_N_Tau and GST_C_Tau, PANTHER PTHR11260, SFLD Omega- and
      Tau-like). There is no direct assay for this protein, and the expression studies on
      the gene measure transcripts only, but nothing suggests loss of activity, so the
      family-level inference is accepted as the core function. Electronic only.
