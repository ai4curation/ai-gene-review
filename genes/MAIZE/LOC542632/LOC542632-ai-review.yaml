- term:
    id: GO:0006749
    label: glutathione metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR045074
  review:
    summary: >-
      InterPro2GO mapping from the tau-class GST C-terminal domain signature.
    action: KEEP_AS_NON_CORE
    reason: >-
      Glutathione transferase activity consumes reduced glutathione to form
      S-conjugates, so the enzyme does take part in glutathione metabolism in the
      literal sense. The term is broad and says little about the biological role
      (xenobiotic and endogenous electrophile conjugation), but there is no more
      specific process term that the evidence for this protein supports: its only
      experimental data are transcript induction by herbicides and a safener, which
      is not evidence of participation in a detoxification process. Kept as a
      non-core consequence of the core activity.
    supported_by:
    - reference_id: file:MAIZE/LOC542632/LOC542632-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: |-
        Is involved in the conjugation of reduced glutathione to a
        CC       wide number of exogenous and endogenous hydrophobic electrophiles.
