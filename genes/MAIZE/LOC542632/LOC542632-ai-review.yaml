  knowledge_gaps:
  - gap_statement: >-
      The substrate range and catalytic efficiency of the LOC542632 enzyme are unknown;
      whether it conjugates the herbicides (atrazine, metolachlor) that induce its
      expression, or only model substrates such as CDNB, has not been tested.
    gap_kind:
    - BIOLOGY
suggested_questions:
- question: >-
    Does recombinant LOC542632 (tau GST, AF244692) conjugate glutathione to
    chloroacetanilide herbicides such as metolachlor, or is its induction by herbicides
    and safener a general stress response unrelated to herbicide turnover?
- question: >-
    Should literature using the name "ZmGST27" be curated per GenBank accession, given
    that the name is used both for this tau GST (AF244692, GeneID 542632) and for the phi
    GST II/IV subunit (X79515, P46420, GeneID 542311)?
suggested_experiments:
- description: >-
    Express LOC542632 in E. coli, purify the protein and measure glutathione
    transferase kinetics with CDNB and with metolachlor, alachlor and atrazine; mutate
    Ser19 to alanine to test the predicted catalytic serine.
  experiment_type: enzyme kinetics
- description: >-
    Test the subcellular location of a LOC542632-fluorescent protein fusion in maize
    protoplasts or N. benthamiana leaves.
  experiment_type: localization
