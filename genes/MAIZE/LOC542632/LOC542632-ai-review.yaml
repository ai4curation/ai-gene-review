  label: Zea mays
description: >-
  LOC542632 (NCBI Gene 542632, "glutathione transferase27"; also called GST 27 or
  GSTU6; B73 v5 model Zm00001eb356600 on chromosome 8) encodes a 237-residue tau-class
  glutathione S-transferase. The protein has a thioredoxin-fold GST N-terminal domain
  carrying the tau-class G-site motif with the conserved active-site serine, and an
  all-alpha GST C-terminal domain that forms the hydrophobic substrate-binding site.
  By family membership it is a cytosolic enzyme that conjugates reduced glutathione to
  hydrophobic electrophiles (EC 2.5.1.18). Its transcript in maize leaves rises within
  hours of treatment with the herbicides atrazine, metolachlor, primisulfuron and
  2,4-D and with the safener dichlormid, which fits a role in phase II
  xenobiotic detoxification. No enzymatic assay, substrate profile, localization study
  or mutant has been reported for this protein. It is distinct from the phi-class
  "GST-27" subunit of maize GST II and GST IV (GST4, P46420), which has the same
  trivial name.
