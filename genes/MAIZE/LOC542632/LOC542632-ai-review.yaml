  review:
    summary: >-
      Mapping of the UniRule-assigned UniProt subcellular location (Cytoplasm, cytosol)
      to GO.
    action: ACCEPT
    reason: >-
      Cytosol is the expected location of a tau-class GST with no signal peptide,
      transit peptide or transmembrane segment, and it is where glutathione conjugation
      of xenobiotics takes place before the conjugates are moved into the vacuole. It is
      the most specific location supported; not experimentally confirmed for this
      protein.
    supported_by:
