- id: PMID:22792398
  title: Co-induction of a glutathione-S-transferase, a glutathione transporter and
    an ABC transporter in maize by xenobiotics.
  findings:
  - statement: The ZmGST27 transcript measured is that of LOC542632; primers were
      designed from AF244692, the mRNA of the LOC542632 product (Q9FQB2/A0A804QUX9).
    supporting_text: were designed from the ORF region of ZmGST27 (accession number AF244692)
  - statement: ZmGST27 transcripts in maize leaves are induced by atrazine, 2,4-D,
      primisulfuron, metolachlor and the safener dichlormid, earliest of the three
      detoxification genes studied.
    supporting_text: For all chemicals, the inducing effect was first detected on ZmGST27.
  - statement: The authors interpret induction by herbicides not metabolised by
      glutathione conjugation as a general chemical-stress response.
    supporting_text: The up-regulation of ZmGST27 expression by these last two compounds
      is likely to be a general response of this gene to chemical stress.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC3394700). Semi-quantitative RT-PCR only; no enzyme or genetic
      data. The gene is identified by GenBank AF244692 (LOC542632, tau class). The
      discussion's statement that dichlormid was reported to raise ZmGST27 transcripts
      (refs 28-29) may refer to the unrelated phi-class GST-27 (P46420); the reference
      list was not in the cache, so this could not be checked.
