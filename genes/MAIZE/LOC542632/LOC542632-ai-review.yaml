core_functions:
- description: >-
    Tau-class glutathione S-transferase that conjugates reduced glutathione to
    hydrophobic electrophiles, including herbicides, in the cytosol; inferred from
    family membership and the conserved catalytic serine, not yet assayed directly.
  molecular_function:
    id: GO:0004364
    label: glutathione transferase activity
