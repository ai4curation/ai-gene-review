- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IEA
  original_reference_id: GO_REF:0000104
  qualifier: located_in
  supporting_entities:
  - UniRule:UR001756755
  review:
    summary: >-
      UniRule transfer of a cytoplasmic location. The same rule system assigns the more
      specific cytosol location, which this gene also carries (GO:0005829).
    action: MODIFY
    reason: >-
      The claim is correct but general. Tau-class GSTs lacking signal or transit
      peptides are soluble cytosolic enzymes, A0A804QUX9 has no predicted targeting
      sequence, and UniProt's rule assigns Cytoplasm, cytosol. GO:0005829 cytosol is
      part_of GO:0005737 cytoplasm (checked with OAK) and is already carried by the gene,
      so the row is refined to cytosol. Electronic only; no localization experiment
      exists for this protein.
    proposed_replacement_terms:
    - id: GO:0005829
      label: cytosol
    supported_by:
    - reference_id: file:MAIZE/LOC542632/LOC542632-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: |-
        SUBCELLULAR LOCATION: Cytoplasm, cytosol
