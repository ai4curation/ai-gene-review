- description: Oxidizes L-glutamate semialdehyde to L-glutamate with NAD+ through the GSALDH module, receiving
    the intermediate generated by proline oxidation. P5C/GSAL equilibration is distinguished from this
    aldehyde-oxidation reaction. Direct evidence is from the synthetic, tag-cleaved CfPutA construct;
    native physiology is not inferred.
  molecular_function: *id009
