  title: 'Structure and characterization of a class 3B proline utilization A: Ligand-induced dimerization
    and importance of the C-terminal domain for catalysis.'
  findings:
  - statement: Class3B CfPutA has two catalytic sites, ligand-dependent oligomerization and channeling;
      regulatory class 1C architecture is distinguished.
    supporting_text: Here, we studied PutA from Corynebacterium freiburgense (CfPutA), which belongs to
      the uncharacterized 3B class of PutAs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached paper read. CfPutA is a 1074-residue synthetic codon-optimized protein with
      His8/TEV tag removal. Deposited5UX5 and UniProt include leading GH at PDB -1/0; a native strain or
      genomic accession is not assigned. Model acceptors, recombinant oligomerization and CT-domain deletion
      assays do not establish native regulation or respiratory partners.
