id: A0A1X8XLF1
gene_symbol: putA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:556548
  label: Corynebacterium freiburgense
description: PutA from Corynebacterium freiburgense is a class 3B bifunctional enzyme that oxidizes L-proline
  through pyrroline-5-carboxylate/glutamate semialdehyde to L-glutamate. Its FAD-dependent proline dehydrogenase
  and NAD-dependent semialdehyde dehydrogenase active sites communicate through an internal tunnel. A
  C-terminal structural domain supports both catalytic sites, and recombinant protein shows ligand-dependent
  dimerization. A0A1X8XLF1 represents the deposited recombinant sequence, including two leading residues
  before the paper-numbered 1074-residue protein; native strain physiology and transcriptional regulation
  have not been established.
