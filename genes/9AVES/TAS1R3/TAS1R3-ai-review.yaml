  findings:
  - statement: No accession-, ORF-, or species-specific functional literature
      exists for A0A7L3N407 / Oreotrochilus melanogaster Tas1r3; all
      functional inference is by homology to other hummingbird species
      (chiefly Calypte anna) studied in PMID:25146290.
