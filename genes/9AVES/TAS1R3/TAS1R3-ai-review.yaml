- term:
    id: GO:0050917
    label: sensory perception of umami taste
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN009078551
  review:
    summary: >-
      TreeGrafter/PANTHER propagation reflecting the ancestral, family-wide
      function of the TAS1R1-TAS1R3 heterodimer (umami/amino-acid taste),
      which remains the function of this dimer in most non-hummingbird birds
      and other vertebrates that lack TAS1R2. In the hummingbird lineage
      specifically, this ancestral umami function was largely superseded by
      the derived sweet-taste function: hummingbird T1R1-T1R3 failed to
      detect carbohydrate-preferring amino acids the way chicken/swift
      T1R1-T1R3 does, though weak, low-affinity responses to some amino
      acids were retained.
    action: KEEP_AS_NON_CORE
    reason: >-
      The PANTHER/TreeGrafter node correctly reflects that umami/amino-acid
      detection is the ancestral, family-wide function of the TAS1R1-TAS1R3
      heterodimer (and remains the primary function in most other birds,
      which retain only this dimer). However, for the hummingbird lineage
      specifically, PMID:25146290 shows this function was largely
      transformed into sweet-taste detection, with only weak, low-affinity
      amino-acid responses retained rather than robust umami perception.
      Rather than REMOVE (the ancestral capacity is not entirely absent, and
      no experimental data exist to state it is fully lost in this
      particular species/accession) or ACCEPT as a co-equal core function
      (which would overstate the retained amino-acid sensitivity relative to
      the well-documented, dominant sweet-taste function), KEEP_AS_NON_CORE
      is used to retain this annotation as a non-core, likely-retained
      function while GO:0033041 / GO:0050916 (sweet taste) are treated as
      the core, derived function of this gene in this lineage.
    supported_by:
    - reference_id: PMID:25146290
      supporting_text: cells expressing chicken or swift T1R1-T1R3 failed to
        detect carbohydrates at any concentration tested and instead
        recognized alanine and serine
    - reference_id: PMID:25146290
      supporting_text: Low-affinity responses were observed to some amino
        acids, as with the human sweet receptor, which recognizes
        carbohydrates as well as proteins, dipeptides, and amino acids
core_functions:
- description: >-
    Obligate dimerization subunit of the hummingbird sweet-taste receptor:
    TAS1R3 partners with TAS1R1 (birds lack TAS1R2) to form a class C GPCR
    heterodimer that, in the hummingbird lineage, was evolutionarily
    repurposed from an ancestral amino-acid (umami) receptor into a
    carbohydrate-responsive receptor, enabling detection of nectar sugars.
    Neither subunit alone is functional; TAS1R3 contributes part of the
    extracellular Venus-flytrap ligand-binding surface and couples ligand
    binding to G-protein activation via its seven-transmembrane domain.
  supported_by:
  - reference_id: PMID:25146290
    supporting_text: Responses were not observed when T1R1 or T1R3 alone was
      used, suggesting that hummingbird T1R1-T1R3 functions as an obligate
      heterodimer.
  molecular_function:
    id: GO:0033041
    label: sweet taste receptor activity
  locations:
  - id: GO:0005886
    label: plasma membrane
- description: >-
    Retains a lower-affinity, ancestral capacity for amino-acid (umami-like)
    recognition characteristic of the TAS1R1-TAS1R3 heterodimer in
    non-hummingbird birds and other vertebrates, though this is not the
    dominant function in hummingbirds, where the sweet-taste-detecting role
    predominates.
  supported_by:
  - reference_id: PMID:25146290
    supporting_text: Low-affinity responses were observed to some amino
      acids, as with the human sweet receptor, which recognizes
      carbohydrates as well as proteins, dipeptides, and amino acids.
knowledge_gaps:
- gap_statement: >-
    No experimental data (expression, receptor pharmacology, or behavior)
    exist for TAS1R3 in Oreotrochilus melanogaster specifically, or for this
    exact UniProt accession (A0A7L3N407); functional inference is drawn
    entirely from a different hummingbird species (Calypte anna, and
    secondarily Archilochus colubris) in PMID:25146290, combined with
    homology/domain architecture (PANTHER family PTHR24061).
  boundary: >-
    The genus/family-wide phenomenon of TAS1R1-TAS1R3 sweet-taste
    repurposing in hummingbirds is firmly established for Calypte anna and
    Archilochus colubris; the presence of the class C GPCR domain
    architecture in this O. melanogaster sequence is firmly established from
    the deposited (fragmentary) sequence itself.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    Determines whether the sweet-taste-receptor annotation transferred here
    by homology actually holds for this species, or whether hillstar-
    specific sequence divergence alters ligand selectivity.
  resolution: >-
    Heterologous co-expression of full-length O. melanogaster TAS1R1 and
    TAS1R3 with a calcium-reporter ligand-response assay, as performed for
    Calypte anna in PMID:25146290.
  provenance:
  - reference_id: PMID:25146290
    supporting_text: we cloned T1Rs from the oral tissue of Anna's
      hummingbirds (Calypte anna)
- gap_statement: >-
    Whether the deposited fragmentary sequence (Flags: Fragment; non-terminal
    at both position 1 and 832) captures the complete, functionally critical
    regions of the receptor - including the full Venus-flytrap domain and
    the hummingbird-lineage substitutions shown to confer sugar
    responsiveness in Calypte anna - is unknown.
  boundary: >-
    The sequence as deposited includes the full 7TM GPCR_3 domain
    (residues 559-823) and the C-terminal region; it is the N-terminal
    extent and completeness of the Venus-flytrap module that is uncertain
    given the fragment flag.
  gap_kind:
  - CURATION
  dark_aspect: MF_DARK
  significance: >-
    A gene model derived from preliminary WGS assembly may be missing exons
    or contain assembly errors that would confound any downstream
    experimental or comparative-genomic use of this specific record.
  resolution: >-
    Completion of the O. melanogaster genome assembly/gene model at this
    locus and confirmation of the full coding sequence.
suggested_questions:
- question: Does TAS1R3 from Oreotrochilus melanogaster, expressed together
    with its TAS1R1 ortholog in a heterologous system, reproduce the
    carbohydrate-selective receptor pharmacology (sucrose/fructose/glucose
    responsiveness) documented for Calypte anna T1R1-T1R3?
- question: Does the full-length (non-fragmentary) Oreotrochilus
    melanogaster TAS1R3 sequence carry the same or homologous amino-acid
    substitutions in the Venus-flytrap domain that were shown to confer
    sugar responsiveness in Calypte anna T1R3 (e.g. the 19 substitutions in
    the 109-residue region identified by Baldwin et al. 2014)?
suggested_experiments:
- description: Clone and heterologously co-express full-length TAS1R1 and
    TAS1R3 from Oreotrochilus melanogaster oral/tongue tissue, and measure
    calcium-reporter responses to sugars, sugar alcohols, and amino acids
    (as in PMID:25146290) to directly test whether the sweet-taste
    repurposing generalizes to this species.
  hypothesis: O. melanogaster TAS1R1-TAS1R3 responds to carbohydrates
    (sucrose, fructose, glucose) rather than to amino acids, mirroring
    Calypte anna T1R1-T1R3.
- description: Complete the genome assembly/gene model at this locus (the
    current B10K entry is a WGS-derived fragment) and confirm the full
    coding sequence, signal peptide, and transmembrane topology.
