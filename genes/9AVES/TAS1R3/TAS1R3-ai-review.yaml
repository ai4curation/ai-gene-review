id: A0A7L3N407
gene_symbol: TAS1R3
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:689266
  label: Oreotrochilus melanogaster
description: >-
  Taste receptor type 1 member 3 (T1R3), a class C (family 3) G protein-coupled
  receptor with an extracellular Venus-flytrap ligand-binding module, a
  cysteine-rich linker domain, and a seven-transmembrane signaling domain.
  Across vertebrates, TAS1R3 is the obligate shared dimerization partner for
  both type-1 taste receptors: it pairs with TAS1R2 to form the canonical
  sweet-taste receptor and with TAS1R1 to form the umami (amino-acid) taste
  receptor. Birds lack TAS1R2, so avian TAS1R3 normally partners only with
  TAS1R1 to form an umami/amino-acid receptor. In hummingbirds (family
  Trochilidae), however, the ancestral TAS1R1-TAS1R3 umami heterodimer was
  evolutionarily repurposed, through amino-acid substitutions concentrated in
  the TAS1R3 Venus-flytrap domain, to respond to carbohydrates instead of
  amino acids, restoring a sweet-taste-like sensory capability that lets
  hummingbirds detect nectar sugars. This receptor localizes to the plasma
  membrane of taste receptor cells, where ligand binding triggers G
  protein-coupled signal transduction. This particular UniProt record
  (A0A7L3N407) is an unreviewed, fragmentary (Flags: Fragment; non-terminal at
  both ends) sequence predicted from preliminary Bird 10,000 Genomes (B10K)
  whole-genome shotgun data for the hummingbird species Oreotrochilus
  melanogaster (black-breasted hillstar); no species-specific experimental
  characterization (expression, receptor pharmacology, or behavior) exists for
  this exact sequence. The functional picture above is inferred from
  homology/domain architecture (PANTHER family PTHR24061, TAS1R subfamily) and
  from the well-documented genus/family-wide sweet-taste transformation
  phenomenon in hummingbirds, which was established experimentally in a
  different hummingbird species, Calypte anna (Anna's hummingbird).
references:
- id: PMID:25146290
  title: Sensory biology. Evolution of sweet taste perception in hummingbirds
    by transformation of the ancestral umami receptor.
  findings:
  - statement: Hummingbirds lack TAS1R2 (as do birds generally); the ancestral
      TAS1R1-TAS1R3 umami heterodimer was instead repurposed in the
      hummingbird lineage to detect carbohydrates rather than amino acids.
    supporting_text: We observed the widespread absence in birds of an
      essential subunit (T1R2) of the only known vertebrate sweet receptor,
      raising questions about how specialized nectar feeders such as
      hummingbirds sense sugars. Receptor expression studies revealed that
      the ancestral umami receptor (the T1R1-T1R3 heterodimer) was
      repurposed in hummingbirds to function as a carbohydrate receptor.
  - statement: Neither TAS1R1 nor TAS1R3 alone produced a ligand response in
      heterologous cells; only the co-expressed heterodimer responded,
      establishing TAS1R3 as an obligate dimerization partner rather than a
      stand-alone receptor.
    supporting_text: Responses were not observed when T1R1 or T1R3 alone was
      used, suggesting that hummingbird T1R1-T1R3 functions as an obligate
      heterodimer.
  - statement: Chimera and mutagenesis experiments localized most of the
      sugar-response-conferring substitutions to the TAS1R3 Venus-flytrap
      (ligand-binding) domain, with additional contributing substitutions in
      TAS1R1.
    supporting_text: Reintroducing 109 amino acids (residues 158 to 266) of
      hummingbird T1R3 into the chicken T1R3 venus flytrap domain restored
      sucrose responses (chimera 2).
  - statement: Hummingbird T1R1-T1R3 receptor pharmacology (responsiveness to
      sucrose/fructose/glucose/sucralose, non-responsiveness to human
      sweeteners such as aspartame/cyclamate/acesulfame-K) corresponded with
      behavioral sugar preference in captive and wild hummingbirds.
    supporting_text: We conclude that the molecular recognition properties of
      hummingbird T1R1-T1R3, together with those of other gustatory
      receptors, instruct taste behavior in both captive and wild
      hummingbirds.
  - statement: This study characterized T1Rs cloned from Anna's hummingbird
      (Calypte anna) and behavior in ruby-throated hummingbird (Archilochus
      colubris), not Oreotrochilus melanogaster; no data specific to O.
      melanogaster are presented.
    supporting_text: we cloned T1Rs from the oral tissue of Anna's
      hummingbirds (Calypte anna); the domestic chicken (Gallus gallus),
      which does not prefer sugars (7); and the insectivorous chimney swift
      (Chaetura pelagica)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed/PMC-verified (PMC4302410); establishes the genus/family-wide
      TAS1R1-TAS1R3 sweet-taste-repurposing mechanism this gene review relies
      on for functional inference, but is not a direct study of this
      accession, gene, or species, and is cited here as background/homology
      evidence rather than as the original_reference_id for any individual
      GOA row (none of the seeded rows cite it).
