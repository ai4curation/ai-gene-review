- term:
    id: GO:0033041
    label: sweet taste receptor activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN009078551
  review:
    summary: >-
      TreeGrafter/PANTHER (PTHR24061 family, node PTN009078551) propagation
      of "sweet taste receptor activity". GO:0033041 is defined generically
      as "Combining with soluble sweet compounds to initiate a change in
      cell activity" (QuickGO), which is not restricted to the canonical
      TAS1R2-TAS1R3 mechanism. This matches the hummingbird-specific finding
      that the TAS1R1-TAS1R3 heterodimer (the only sweet-capable dimer
      available to birds, which lack TAS1R2) was evolutionarily repurposed
      to bind carbohydrates and trigger cellular signaling. This is the
      central, novel finding motivating this gene review and is treated as
      this hummingbird's core annotated molecular activity, even though it
      has not been directly assayed for Oreotrochilus melanogaster
      specifically.
    action: ACCEPT
    reason: >-
      The GO:0033041 definition does not require the canonical T1R2-partner
      mechanism, only that the receptor combine with soluble sweet compounds
      to trigger a cellular response - which is exactly what was
      demonstrated for hummingbird TAS1R1-TAS1R3 (Calypte anna). Given the
      well-documented, phylogenetically widespread nature of this
      hummingbird-lineage transformation (which arose 42-72 million years
      ago, predating diversification of extant hummingbirds) and the
      concordant PANTHER/TreeGrafter family-level call, this is accepted as
      the core function by homology, while `description` and
      `knowledge_gaps` flag that direct experimental confirmation for this
      exact species/accession is lacking.
    supported_by:
    - reference_id: PMID:25146290
      supporting_text: Responses were not observed when T1R1 or T1R3 alone
        was used, suggesting that hummingbird T1R1-T1R3 functions as an
        obligate heterodimer.
    - reference_id: PMID:25146290
      supporting_text: Hummingbird T1R1-T1R3 responded to several
        carbohydrates, including sucrose, fructose, and glucose.
