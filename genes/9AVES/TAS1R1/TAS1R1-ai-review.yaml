id: A0A7L3NBT4
gene_symbol: TAS1R1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:689266
  label: Oreotrochilus melanogaster
description: >-
  TAS1R1 (taste receptor type 1 member 1) is a class C ("family 3") G
  protein-coupled receptor with a large extracellular venus-flytrap (VFT)
  ligand-binding domain, a cysteine-rich linker region, and a seven-
  transmembrane signalling domain. Across most vertebrates TAS1R1
  heterodimerizes obligately with TAS1R3 to form the umami taste receptor,
  which is expressed in type II taste-bud cells and detects L-amino acids
  (most notably glutamate), signalling through a heterotrimeric G
  protein/PLCbeta2/IP3/Ca2+/TRPM5 cascade. Birds generally lack the TAS1R2
  subunit required for the canonical vertebrate sweet receptor. In
  hummingbirds (family Trochilidae), the ancestral TAS1R1-TAS1R3 umami
  receptor was repurposed after divergence from their insectivorous
  swift relatives to respond primarily to carbohydrates rather than amino
  acids, giving hummingbirds an alternate, T1R2-independent route to sweet
  taste perception that is thought to have supported their nectarivorous
  radiation. This UniProt entry (A0A7L3NBT4) is an unreviewed, fragmentary
  (572 aa, non-terminal at both ends) TAS1R1 sequence from a preliminary
  whole-genome-shotgun assembly of the black-breasted hillstar,
  Oreotrochilus melanogaster, produced by the Bird 10,000 Genomes (B10K)
  project. No experimental characterization exists for this exact
  species/accession; the functional picture here is inferred from domain
  architecture/orthology to TAS1R1 and from the well-documented,
  genus/family-wide sweet-taste repurposing phenomenon in hummingbirds,
  which was originally demonstrated in a different hummingbird species,
  Calypte anna (Anna's hummingbird).
