      TAS1R1's established identity as a family C GPCR subunit.
    action: ACCEPT
    reason: >-
      The InterPro domain matches recorded on this record (ANF_lig-bd_rcpt,
      GPCR_3, GPCR_3_9-Cys_dom/sf, GPCR_3_C) and the UniProt-annotated 7TM
