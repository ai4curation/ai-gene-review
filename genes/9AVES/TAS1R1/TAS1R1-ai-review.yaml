- term:
    id: GO:0050917
    label: sensory perception of umami taste
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN009077744
  review:
    summary: >-
      TreeGrafter/PANTHER-propagated umami-taste call reflects the ancestral,
      tree-wide TAS1R1 function (retained in chicken, swift, and most other
      vertebrates), but is very likely stale for the hummingbird
      (Trochilidae) lineage this record belongs to, where TAS1R1-TAS1R3 has
      been experimentally shown (in a congeneric/confamilial species,
      Calypte anna) to have been repurposed to detect carbohydrates rather
      than amino acids.
    action: MODIFY
    reason: >-
      GO:0050917 is defined as perception of "the savory taste of meats and
      other foods that are rich in glutamates" - i.e. amino-acid/glutamate
      detection. That is the correct, ancestral TAS1R1-TAS1R3 function, and
      it is retained in non-hummingbird birds: "cells expressing chicken or
      swift T1R1-T1R3 failed to detect carbohydrates at any concentration
      tested and instead recognized alanine and serine." But hummingbirds
      transformed this same receptor complex after diverging from swifts:
      "Receptor expression studies revealed that the ancestral umami
      receptor (the T1R1-T1R3 heterodimer) was repurposed in hummingbirds to
      function as a carbohydrate receptor," and behavioral assays in
      multiple hummingbird species confirmed this receptor logic drives
      sugar-seeking taste behavior. Oreotrochilus melanogaster is a
      hummingbird (family Trochilidae), so by strong phylogenetic/functional
      inference its TAS1R1-TAS1R3 more likely mediates carbohydrate (sweet)
      perception than umami perception, even though this exact species and
      accession have not been assayed. Some residual amino-acid sensitivity
      may persist ("low-affinity responses were observed to some amino
      acids"), so umami sensing is not necessarily fully abolished, but it is
      no longer the primary, defining taste modality this receptor
      contributes to in hummingbirds - the more accurate primary process
      term is GO:0050916 (sensory perception of sweet taste), as already
      independently annotated for the partner subunit TAS1R3 in this same
      genome (genes/9AVES/TAS1R3). Kept as MODIFY rather than REMOVE because
      the underlying GPCR/heterodimer identity is sound and some amino-acid
      responsiveness is plausible; only the specific taste-modality term
      needs correcting for this lineage.
    proposed_replacement_terms:
    - id: GO:0050916
      label: sensory perception of sweet taste
    supported_by:
    - reference_id: PMID:25146290
      supporting_text: Receptor expression studies revealed that the ancestral
        umami receptor (the T1R1-T1R3 heterodimer) was repurposed in
        hummingbirds to function as a carbohydrate receptor.
    - reference_id: PMID:25146290
      supporting_text: cells expressing chicken or swift T1R1-T1R3 failed to
        detect carbohydrates at any concentration tested and instead
        recognized alanine and serine.
    - reference_id: PMID:25146290
      supporting_text: Low-affinity responses were observed to some amino acids
    - reference_id: file:9AVES/TAS1R1/TAS1R1-deep-research-falcon.md
      supporting_text: No retrieved publication independently validates this
        accession, gene model, or fragment boundaries.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      - LINEAGE_OR_TAXON_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN009077744
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The ancestral TAS1R1 node's umami-taste assignment is well
          supported tree-wide (retained in chicken, swift, mammals, etc.),
          but does not account for the hummingbird-specific functional
          transformation of the T1R1-T1R3 heterodimer to a carbohydrate
          receptor; propagation to this Trochilidae target is not safe
          without a lineage-specific override.
- term:
    id: GO:0050916
    label: sensory perception of sweet taste
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      NEW: proposed addition reflecting the hummingbird-specific
      TAS1R1-TAS1R3 sweet-taste repurposing (see review of GO:0050917
      above); mirrors the annotation already present on the partner subunit
      TAS1R3 in this genome.
    action: NEW
    reason: >-
      Not present in GOA for this record (TreeGrafter placed TAS1R3, but not
      TAS1R1, in the sweet-taste-annotated PANTHER node), but strongly
      supported by the same evidence base as the GO:0050917 MODIFY above:
      hummingbird T1R1-T1R3 is an obligate heterodimer whose sugar responses
      require both subunits, and behavioral data confirm this drives
      sugar-taste preference in hummingbirds. Proposed with moderate rather
      than high confidence because it rests on cross-species/cross-genus
      inference (Calypte anna data) rather than a direct assay of
      Oreotrochilus melanogaster or this fragment.
    supported_by:
    - reference_id: PMID:25146290
      supporting_text: Responses were not observed when T1R1 or T1R3 alone was
        used, suggesting that hummingbird T1R1-T1R3 functions as an obligate
        heterodimer.
    - reference_id: PMID:25146290
      supporting_text: We propose that changing taste receptor function enabled
        hummingbirds to perceive and use nectar, facilitating the massive
        radiation of hummingbird species.
