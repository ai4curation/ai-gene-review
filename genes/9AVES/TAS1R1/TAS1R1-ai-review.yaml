core_functions:
- description: >-
    Obligate subunit of the TAS1R1-TAS1R3 heterodimeric class C GPCR taste
    receptor. In hummingbirds (family Trochilidae, including this genome's
    source species Oreotrochilus melanogaster) this ancestral umami
    (amino-acid) receptor complex has been repurposed to respond primarily to
    carbohydrates (sucrose, fructose, glucose, sucralose), giving hummingbirds
    a T1R2-independent route to sweet taste perception. Direct experimental
    ligand data underlying this model come from a different hummingbird,
    Calypte anna; no assay exists yet for O. melanogaster or this fragmentary
    accession, so this should be read as a strong lineage-level inference
    rather than a species-specific demonstration.
  molecular_function:
    id: GO:0004930
    label: G protein-coupled receptor activity
  contributes_to_molecular_function:
    id: GO:0033041
    label: sweet taste receptor activity
  directly_involved_in:
  - id: GO:0050916
    label: sensory perception of sweet taste
  locations:
  - id: GO:0005886
    label: plasma membrane
  supported_by:
  - reference_id: PMID:25146290
    supporting_text: Receptor expression studies revealed that the ancestral
      umami receptor (the T1R1-T1R3 heterodimer) was repurposed in
      hummingbirds to function as a carbohydrate receptor.
  - reference_id: PMID:25146290
    supporting_text: Responses were not observed when T1R1 or T1R3 alone was
      used, suggesting that hummingbird T1R1-T1R3 functions as an obligate
      heterodimer.
  knowledge_gaps:
  - gap_statement: Whether Oreotrochilus melanogaster TAS1R1-TAS1R3 actually
      detects carbohydrates (versus retaining or partially retaining
      amino-acid/umami sensitivity) has not been directly tested; the
      carbohydrate-receptor model is extrapolated from Calypte anna and other
      hummingbird species, not measured for this species or this fragmentary
      accession.
    boundary: Species- and accession-specific ligand pharmacology (this record
      is a 572 aa fragment, non-terminal at both ends, from a preliminary
      B10K WGS assembly, so even the completeness of the coding sequence is
      unconfirmed).
    provenance:
    - reference_id: file:9AVES/TAS1R1/TAS1R1-deep-research-falcon.md
      supporting_text: no retrieved study mentions A0A7L3NBT4, OREMEL_R04111,
        NXU76429.1, or experimentally tests *O. melanogaster* Tas1r1
proposed_new_terms: []
suggested_questions:
- question: Has TAS1R1-TAS1R3 ligand specificity been directly assayed in any
    hillstar (Oreotrochilus) or other high-Andean hummingbird, given that
    Andean hummingbirds face unusual dietary/thermal constraints (e.g.
    torpor, high-altitude nectar sugar composition) that could plausibly
    have further tuned receptor pharmacology relative to lowland species
    like Calypte anna?
- question: Does the B10K genome assembly for Oreotrochilus melanogaster
    contain a full-length TAS1R1 transcript/CDS that resolves the two
    NON_TER fragment boundaries in A0A7L3NBT4, and does full-length TAS1R1
    retain the amino-acid substitutions (e.g. the T1R3 venus-flytrap sites)
    that Baldwin et al. 2014 mapped as necessary for sugar sensitivity in
    Calypte anna?
suggested_experiments:
- description: Clone and heterologously express full-length Oreotrochilus
    melanogaster TAS1R1 with its native TAS1R3 partner (calcium-reporter or
    IP1 assay in HEK293T/Gα15 cells, as in Baldwin et al. 2014) to directly
    test carbohydrate versus amino-acid responsiveness for this species,
    replacing the current cross-species inference.
- description: Confirm oral/taste-bud expression of TAS1R1 in O.
    melanogaster (RT-PCR or in situ hybridization/spatial transcriptomics
    on lingual/oral tissue), since the current annotation of "plasma
    membrane" localization and involvement in taste perception rests on
    domain architecture and cross-species orthology rather than
    tissue-level evidence in this species.
