    label: bacterial cellulose biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:21498404
  review:
    summary: Add the directly supported native cellulose-biosynthetic role.
    action: NEW
    reason: The protein is a catalytic GT2 synthase, and its gene disruption selectively prevents
      induced cellulose accumulation measured after cellulose isolation and cellulase-dependent
      glucose release. Participation follows from the polymerizing enzyme role plus product/genetic
      evidence, not merely necessity for aggregation. GO:0090540 covers bacterial cellulose
      formation; there is no pre-existing BP row or proposed ancestor/descendant duplication. E.
      coli BcsA carries the generic cellulose process and its bacterial-context descendant; the
      unannotated Pseudomonas comparator does not establish a convention excluding synthase
      catalysts. No additional cell-aggregation or stress-response BP is proposed. GO:0090540 adds
      bacterial context to the same cellulose-forming chemistry; it does not impose a native-output,
      intact-cell, crystallinity or fibril criterion. The RKN genetic/product evidence concerns
      bacterial cellulose formation; native induction conditions and the distinction from the BP1
      comparator remain unchanged.
