  label: Thermostichus vulcanus RKN
description: Tvtll0007 (XcsA) is the cellulose synthase of Thermostichus vulcanus strain RKN, described
  in the original literature as Thermosynechococcus vulcanus. It is a multipass membrane glycosyltransferase
  with a C-terminal PilZ domain. Genetic and cellulose-quantification experiments identify it as the enzyme
  responsible for induced extracellular cellulose accumulation and cellulose-mediated cell aggregation
  at low temperature under illumination. Its UDP-glucose polymerization chemistry and plasma-membrane
  placement are supported by synthase-family architecture; the proposed downstream XcsB/TolC export machinery
  remains less directly established.
