- term:
    id: GO:0030244
    label: cellulose biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:21498404
  review:
    summary: Add the directly supported native cellulose-biosynthetic role.
    action: NEW
    reason: The protein is a catalytic GT2 synthase, and its gene disruption selectively prevents induced
      cellulose accumulation measured after cellulose isolation and cellulase-dependent glucose release.
      Participation follows from the polymerizing enzyme role plus product/genetic evidence, not merely
      necessity for aggregation. GO:0030244 covers cellulose formation; there is no pre-existing BP row
      or proposed ancestor/descendant duplication. E. coli BcsA carries the same process and its biofilm-specific
      descendant; the unannotated Pseudomonas comparator does not establish a convention excluding synthase
      catalysts. No additional cell-aggregation or stress-response BP is proposed.
    supported_by:
    - reference_id: PMID:21498404
