references:
- id: file:THEVL/Tvtll0007/Tvtll0007-hypotheses/kgap-xcsa-export-architecture/openscientist.md
  title: OpenScientist architectural test of the XcsA-XcsB-TolC cellulose export route
  findings:
  - statement: >-
      The inner-membrane step is supported, with XcsA superposing on BcsA at 1.68 Angstrom over 404 CA
      and reproducing the glucan channel bore; XcsB is refuted as the BcsB equivalent, carrying neither
      BcsB periplasmic domain in a genome-wide absence calibrated against positive controls in other
      cyanobacteria; the TolC step is permissive but non-diagnostic; and the operon reading is refuted,
      the genes lying megabases apart on opposite strands.
    supporting_text: >-
      The measurements are permissive, which is weaker than supportive: the same channel is equally
      compatible with its default annotation as a small-molecule or protein efflux duct.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Computed results only; the run's literature quotations were not independently re-verified. Verified
      locally against E5RST0: the protein is 736 residues, Val354 is as stated, and the QxxRW motif sits
      at 392 within the window the run cites, with the PilZ domain cross-references present. Not
      verified: the superpositions and RMSD values against 4HG6 and 1EK9, the channel bore and lumen
      charge measurements, the 45-homolog family survey, the Pfam domain searches and their genome-wide
      absence calls, the XcsB and TolC model features, and the chromosomal coordinates. The run's own
      caveats are recorded in the boundary: the missing BcsB domain is an HMM negative rather than a
      structural one, and every structure used is an AlphaFold monomer model. No annotation action was
      changed.
