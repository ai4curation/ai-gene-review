    summary: Refine hexosyltransferase activity to cellulose synthase activity.
    action: MODIFY
    reason: The authentic RKN sequence is connected to the gene disrupted in PMID21498404 by the AB571479/BAJ61012.1
      accession bridge, rather than inferred from the BP-1 locus name. Cellulose quantification and selective
      loss of induced accumulation distinguish Tvtll0007 from the other putative synthases. GT2 and PTHR43867:SF2
