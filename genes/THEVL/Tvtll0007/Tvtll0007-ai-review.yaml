knowledge_gaps:
- gap_statement: How does RKN XcsA physically engage XcsB and TolC to export cellulose, and is this the
    complete export apparatus?
  boundary: >-
    The genetic requirement and domain-based tripartite model are supported, but direct complex
    reconstitution and chain movement through TolC are not demonstrated in the examined primary studies.
    An OpenScientist run (kgap-xcsa-export-architecture) answers the second half of this gap, is this
    the complete export apparatus, with a no, and splits the tripartite model into three claims that do
    not stand or fall together. The inner-membrane step is supported. XcsA superposes on the
    crystallised Cereibacter sphaeroides BcsA at 1.68 Angstrom core RMSD over 404 CA pairs from 674
    aligned positions at 31.2 per cent identity, all of BcsA's catalytic and acceptor-site residues map
    onto it, the finger helix aligns without a single gap, and the QxxRW motif is intact, which the
    local E5RST0 record confirms at position 392 of its 736 residues. The product-conducting channel is
    reproduced at a bore indistinguishable from BcsA's, median 4.05 against 4.29 Angstrom along the
    crystallographic glucan path with 74 against 72 per cent of the path at or above 3.0 Angstrom. One
    apparent defect dissolves on a family survey: BcsA Thr341 becomes Val354 here, confirmed locally as
    Val, but across 45 cellulose synthase homologs that position is Val in 16, Thr in 13, Ser in 11, Ala
    in 3 and Cys in 2, while the acidic Glu-Asp pair that does the work is conserved in 45 of 45, so the
    substitution is the commonest state rather than a lesion. The periplasmic step is where the model
    breaks, and this is the finding that matters for the gap. XcsB is a UPF0194 membrane fusion protein
    of the HlyD type, 434 residues with one transmembrane anchor and two coiled coils, and it carries
    neither of the two domains that build BcsB's periplasmic body. That absence is genome-wide rather
    than a property of this one protein: a search for the BcsB carbohydrate-binding domain returns zero
    proteins in this organism, zero in T. vestitus BP-1 and zero in Synechocystis PCC 6803, while
    returning hits in Calothrix parasitica, Dulcicalothrix desertica and in Cereibacter BcsB itself, so
    the negative is calibrated against positive controls rather than asserted. The deficit is
    load-bearing, because in the characterised complex 44 per cent of the glucan path lies within 10
    Angstrom of BcsB, and across the periplasmic first 36 Angstrom of that path the bore collapses from
    16 to 87 Angstrom with BcsA alone, which is to say open to bulk solvent, to 5 to 24 Angstrom once
    BcsB is present. The periplasmic half of the export conduit therefore has no owner here. Note what
    this does and does not say: XcsB remains genetically required, so it is refuted only as the BcsB
    equivalent, not as a participant, and an efflux adaptor is a different job from walling a sugar
    channel. The outer-membrane step cannot be decided. The TolC homolog is a genuine TolC by fold, 1.47
    Angstrom core RMSD over 210 CA against the E. coli structure and a modelled trimer 146 Angstrom long
    against 143 for the crystal, with a narrowest pore radius of 3.97 against 4.32 Angstrom and a lumen
    charge of -5.02 against -7.95 per 100 lining atoms. A single extended glucan needs roughly 3
    Angstrom half-width and carries no net charge, so it would fit and would feel nothing specific; the
    measurements are permissive, which the run is careful to call weaker than supportive, since the same
    channel suits its default annotation as a small-molecule or protein efflux duct equally well. The
    operon reading is refuted outright and the primary paper says so itself: on the 2.59 Mb chromosome
    the four genes sit 0.91, 0.75 and 0.32 Mb apart on opposite strands, the partners having been linked
    by synteny and knockout rather than by proximity, and the only adjacency is tll0007 with tll0008, 27
    base pairs apart on the same strand. The run names a second cellulose synthase in the same genome,
    and the gene it calls xcsC is tlr1902, which this project reviews separately under the THEVB
    organism code. Two caveats bound all of this: the missing BcsB-like domain is a negative from HMM
    annotation rather than from structure, so a sufficiently diverged carbohydrate-binding module would
    escape detection and reconcile the two models, and every structural result on these proteins uses
    AlphaFold monomer models, with the TolC trimer assembled by superposing a monomer onto a
    crystallographic trimer frame.
  gap_kind:
  - BIOLOGY
  status: NARROWING
  significance: Distinguishes a mechanistic hypothesis from an experimentally established alternative
    to BcsAB/BcsC.
  resolution: Reconstitute exact-strain components and track cellulose translocation with interaction
    and structural measurements.
  provenance:
