id: P41020
gene_symbol: ureC
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:1474
  label: Sporosarcina pasteurii
description: >-
  UreC is the 570-residue alpha subunit of the nickel-dependent urease
  (EC 3.5.1.5) of the soil bacterium Sporosarcina pasteurii (formerly Bacillus
  pasteurii). Three UreA (gamma) - UreB (beta) - UreC (alpha) heterotrimers
  assemble into the cytoplasmic (alpha-beta-gamma)3 enzyme, and the alpha
  subunit carries the catalytic site: a dinuclear Ni(II) centre whose two metal
  ions are bridged by the carboxylated side chain of Lys220 and by a hydroxide,
  with additional histidine and Asp363 ligands and a mobile flap over the active
  site cavity. The enzyme hydrolyses urea to ammonia and carbamate, the latter
  decomposing spontaneously to a second ammonia and bicarbonate, which raises
  the pH of the surrounding medium. S. pasteurii urease has served as the
  structural paradigm for the enzyme family: crystal structures of the native
  enzyme and of its complexes with substrate and with inhibitors
  (diamidophosphate, acetohydroxamate, phosphate, boric acid, fluoride) define
  the coordination chemistry of the dinickel site and the catalytic mechanism.
