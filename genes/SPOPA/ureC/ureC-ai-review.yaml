suggested_questions:
- question: >-
    Does the GO cellular component ontology need a way to distinguish the
    catalytic alpha subunit from the structural beta and gamma subunits of
    urease, given that all three are part_of GO:0035550 while only the alpha
    subunit carries the active site?
- question: >-
    Should GO:0016151 nickel cation binding be asserted for urease gamma
    subunits at all, given that the dinickel site lies entirely within the alpha
    subunit?
suggested_experiments:
- hypothesis: >-
    Nickel occupancy of the S. pasteurii UreC active site, and hence urease
    activity, limits the rate of carbonate generation during ureolysis-driven
    mineral precipitation.
  description: >-
    Measure urease specific activity and nickel content of S. pasteurii cells
    grown across a range of Ni(II) availability, and relate both to the rate and
    extent of carbonate precipitation under otherwise identical conditions.
  experiment_type: Enzyme assay, metal quantification, and precipitation kinetics
