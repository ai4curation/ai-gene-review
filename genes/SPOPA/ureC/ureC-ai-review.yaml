  review:
    summary: >-
      Bacterial UreABC urease is a soluble cytoplasmic enzyme, and the
      S. pasteurii enzyme used for all the structural work was purified as a
      soluble protein with no signal peptide or transmembrane segment.
    action: ACCEPT
    reason: >-
      The row comes from the HAMAP/UniRule system for the urease alpha subunit
      rather than from a localization assay, so it was checked against the
      record itself: P41020 has no signal peptide, no transmembrane feature and
      no lipoprotein motif, and the protein is routinely purified from soluble
      cell extracts for crystallography. Cytoplasm is where the urea hydrolysis
      performed by this subunit takes place.
