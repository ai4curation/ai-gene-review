- id: PMID:30969470
  title: The Structure of the Elusive Urease-Urea Complex Unveils the Mechanism of
    a Paradigmatic Nickel-Dependent Enzyme.
  findings:
  - statement: >-
      The substrate-bound structure of S. pasteurii urease, obtained by replacing
      the catalytic hydroxide with fluoride, shows urea bound at the dinuclear
      Ni(II) centre of the alpha subunit.
    supporting_text: >-
      The present study uses fluoride to substitute the hydroxide acting as the
      co-substrate in the reaction, preventing the occurrence of the catalytic
      steps that follow substrate binding.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed record checked; the paper is the source of the EXP urease activity
      annotation on P41020 and of the substrate-binding residues recorded in the
      UniProt entry.
- id: PMID:10368287
  title: 'A new proposal for urease mechanism based on the crystal structures of the
    native and inhibited enzyme from Bacillus pasteurii: why urea hydrolysis costs
    two nickels.'
  findings:
  - statement: >-
      The native S. pasteurii urease structure shows each of the two active-site
      nickel ions completed by a water molecule and a bridging hydroxide.
    supporting_text: >-
      In the native enzyme, the coordination sphere of each of the two nickel
      ions is completed by a water molecule and a bridging hydroxide.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed record checked; UniProt cites this work for the nickel ligands, the
      Lys220 carboxylation and the heterotrimeric subunit composition of P41020.
- id: PMID:8706719
  title: X-ray absorption spectroscopy study of native and phenylphosphorodiamidate-inhibited
    Bacillus pasteurii urease.
  findings:
  - statement: >-
      X-ray absorption spectroscopy of the native S. pasteurii enzyme shows
      octahedral Ni(II) with about two histidine ligands per metal.
    supporting_text: >-
      The results indicate the presence of octahedrally coordinated Ni2+, in a
      sphere of six N/O donors at an average distance of 0.203 nm.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed record checked; spectroscopic evidence for the nickel site that is
      independent of the crystallographic models.
- id: PMID:25113581
  title: 'Fluoride inhibition of Sporosarcina pasteurii urease: structure and thermodynamics.'
  findings:
  - statement: >-
      Fluoride inhibits S. pasteurii urease by a mixed competitive and
      uncompetitive mechanism, with the anions coordinating the active-site
      Ni(II) ions.
    supporting_text: >-
      The analysis of these structures revealed the presence of two fluoride
      anions coordinated to the Ni(II) ions in the active site, in terminal and
      bridging positions.
  full_text_unavailable: true
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed record checked; establishes the fluoride chemistry later exploited
      to trap the urea complex in PMID:30969470.
