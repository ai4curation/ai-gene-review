- term:
    id: GO:0009039
    label: urease activity
  evidence_type: EXP
  original_reference_id: PMID:30969470
  qualifier: enables
  review:
    summary: >-
      The alpha subunit holds the dinickel active site that hydrolyses urea; the
      1.42 A urease-urea complex of the S. pasteurii enzyme shows the substrate
      bound at that site.
    action: ACCEPT
    reason: >-
      This is the defining activity of the protein and the one the structural
      literature on S. pasteurii urease is built on. The substrate-bound
      structure places urea on the alpha-subunit dinickel centre, and UniProt
      records the catalysed reaction with experimental evidence from the same
      work.
    supported_by:
