    summary: >-
      The alpha subunit binds the two catalytic Ni(II) ions through His137,
      His139, the carboxylated Lys220, His249, His275 and Asp363.
    action: ACCEPT
    reason: >-
      Unlike the equivalent rows on the gamma subunit, this one is on the
