- term:
    id: GO:0035550
    label: urease complex
  evidence_type: IDA
  original_reference_id: PMID:10368287
  qualifier: part_of
  review:
    summary: >-
      UreC is the alpha chain of the (alpha-beta-gamma)3 S. pasteurii urease
      resolved crystallographically, but no complex-membership row exists for
      this subunit.
    action: NEW
    reason: >-
      GOA carries GO:0035550 for the beta subunit (P41021) through the InterPro
      signature but not for the alpha subunit, although the alpha subunit is the
      chain whose presence in the heterotrimer is directly observed in every
      S. pasteurii urease structure. Complex membership is a structural fact
      about this protein, not an inference from its activity, so it is proposed
      here as a separate row.
    supported_by:
    - reference_id: file:SPOPA/ureC/ureC-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
