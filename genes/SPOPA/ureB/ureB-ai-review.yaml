id: P41021
gene_symbol: ureB
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:1474
  label: Sporosarcina pasteurii
description: >-
  UreB is the 126-residue beta subunit of the nickel-dependent urease
  (EC 3.5.1.5) of the soil bacterium Sporosarcina pasteurii (formerly Bacillus
  pasteurii). Like the gamma subunit it is non-catalytic: one UreB chain
  associates with one UreA (gamma) and one UreC (alpha) chain to form the
  heterotrimer, and three heterotrimers assemble into the cytoplasmic
  (alpha-beta-gamma)3 enzyme that hydrolyses urea to ammonia and carbamate. The
  dinuclear Ni(II) active site lies entirely within the alpha subunit, so UreB
  contributes to urea hydrolysis through the architecture of the assembled
  enzyme rather than through an activity of its own. In many other bacteria the
  corresponding regions are fused into a single gamma-beta chain, and in plant
  and fungal ureases all three are fused into one polypeptide, which is why the
  three-chain arrangement of the Bacillota enzymes is informative about this
  protein.
