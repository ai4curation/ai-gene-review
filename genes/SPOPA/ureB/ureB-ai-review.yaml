  review:
    summary: >-
      UreB is part of the soluble cytoplasmic urease; the S. pasteurii enzyme
      was purified from soluble extract and crystallised with all three chains.
    action: ACCEPT
    reason: >-
      The row comes from the HAMAP/UniRule system rather than from a
      localization assay, so it was checked against the record: P41021 has no
      signal peptide, no transmembrane segment and no lipoprotein motif, and the
      subunit is present in the purified soluble heterotrimer. Cytoplasm is
      where the assembled enzyme acts.
