suggested_questions:
- question: >-
    Do the fused gamma-beta subunits found in many bacterial ureases carry the
    same GO annotations as the separate gamma and beta chains, and is the
    separation of roles between them consistent across the two architectures?
suggested_experiments:
- hypothesis: >-
    UreB is required for assembly of catalytically competent S. pasteurii
    urease rather than for catalysis itself.
  description: >-
    Express UreA and UreC with and without UreB together with the UreD/E/F/G
    accessory proteins, and compare heterotrimer formation, nickel
    incorporation and urease specific activity.
  experiment_type: Heterologous expression, native complex analysis, metal
    quantification, and urease assay
