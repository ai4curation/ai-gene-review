- term:
    id: GO:0009039
    label: urease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - RHEA:20557
  - EC:3.5.1.5
  - UniRule:UR000001437
  review:
    summary: >-
      The urea-hydrolysing activity belongs to the assembled urease, whose
      dinickel active site is carried by the alpha subunit; the beta subunit
      contributes to that activity but does not possess it.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Transferring the complex-level reaction to each structural chain
      overstates what this subunit does. UniProt records the two nickel ions and
      every nickel ligand on the alpha subunit P41020, and P41021 carries no
      metal-binding feature at all, so the catalysis cannot occur on this chain.
      The activity is retained as a contribution in core_functions rather than
      as an independent function.
    supported_by:
    - reference_id: file:SPOPA/ureB/ureB-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        SUBUNIT: Heterotrimer of UreA (gamma), UreB (beta) and UreC (alpha)
        subunits. Three heterotrimers associate to form the active enzyme.
- term:
    id: GO:0035550
    label: urease complex
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: part_of
  supporting_entities:
  - InterPro:IPR002019
  review:
    summary: >-
      UreB is the beta chain of the (alpha-beta-gamma)3 urease, resolved as such
      in every S. pasteurii urease structure.
    action: ACCEPT
    reason: >-
      The signature-based mapping from IPR002019 (Urease, beta subunit-like)
      lands on exactly the right claim for this protein, and it is confirmed
      independently by the curated subunit statement on the entry, which is
      backed by the crystallographic work on this enzyme. This is the most
      informative cellular-component term available for a structural subunit.
    supported_by:
    - reference_id: file:SPOPA/ureB/ureB-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        SUBUNIT: Heterotrimer of UreA (gamma), UreB (beta) and UreC (alpha)
        subunits. Three heterotrimers associate to form the active enzyme.
- term:
    id: GO:0043419
    label: urea catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002019
  - UniRule:UR000001437
  - UniPathway:UPA00258
  review:
    summary: >-
      UreB is a required structural component of the enzyme that performs the
      single step of urea degradation.
    action: ACCEPT
    reason: >-
      The beta subunit is not the chain that catalyses the reaction, but it is
      part of the complex that does and contributes the structure the catalytic
      subunit is built into, which is participation in the sense GO intends for
      a complex subunit. UniProt places the enzyme as the only step of the urea
      degradation pathway.
    supported_by:
    - reference_id: file:SPOPA/ureB/ureB-uniprot.txt
      record_section: ["CC:PATHWAY"]
      supporting_text: >-
        PATHWAY: Nitrogen metabolism; urea degradation; CO(2) and NH(3) from
        urea (urease route): step 1/1.
- term:
    id: GO:0005198
    label: structural molecule activity
  evidence_type: IC
  original_reference_id: PMID:10368287
  qualifier: enables
  review:
    summary: >-
      The beta subunit is a non-catalytic chain whose role is to build and
      stabilise the urease heterotrimer.
    action: NEW
    reason: >-
      With the catalytic machinery accounted for on the alpha subunit, the beta
      chain has no activity of its own, and a molecular-function slot left to
      GO:0009039 alone would misdescribe it. Structural molecule activity states
      what it does: it occupies a fixed position in the heterotrimer resolved in
      the S. pasteurii urease structures. This follows the treatment already
      applied to the Pseudomonas putida structural subunits in genes/PSEPK.
    supported_by:
    - reference_id: file:SPOPA/ureB/ureB-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        SUBUNIT: Heterotrimer of UreA (gamma), UreB (beta) and UreC (alpha)
        subunits. Three heterotrimers associate to form the active enzyme.
