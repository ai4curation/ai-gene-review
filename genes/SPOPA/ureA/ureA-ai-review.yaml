suggested_questions:
- question: >-
    Should interpro2go continue to map the urease gamma-subunit entries
    (IPR002026, IPR036463) to GO:0016151 nickel cation binding, given that the
    dinickel site is carried by the alpha subunit?
- question: >-
    Is the N-terminal modification of UreA modelled in the S. pasteurii urease
    PDB entries a genuine N-formylmethionine derivative, and does it matter for
    assembly?
suggested_experiments:
- hypothesis: >-
    UreA is required for assembly of catalytically competent S. pasteurii
    urease rather than for catalysis itself.
  description: >-
    Express UreB and UreC with and without UreA together with the UreD/E/F/G
    accessory proteins, and compare heterotrimer formation, nickel
    incorporation and urease specific activity.
  experiment_type: Heterologous expression, native complex analysis, metal
    quantification, and urease assay
