- term:
    id: GO:0009039
    label: urease activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012010
  - RHEA:20557
  - EC:3.5.1.5
  - UniRule:UR000001329
  review:
    summary: >-
      The urea-hydrolysing activity belongs to the assembled urease, whose
      dinickel active site is carried by the alpha subunit; the gamma subunit
      contributes to that activity but does not possess it.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Transferring the complex-level reaction to each structural chain
      overstates what this 100-residue subunit does. UniProt records the two
      nickel ions and every nickel ligand on the alpha subunit P41020, and
      P41022 carries no metal-binding feature at all, so the catalysis cannot
      occur on this chain. The activity is retained as a contribution in
      core_functions rather than as an independent function.
    supported_by:
    - reference_id: file:SPOPA/ureA/ureA-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
        SUBUNIT: Heterotrimer of UreA (gamma), UreB (beta) and UreC (alpha)
        subunits. Three heterotrimers associate to form the active enzyme.
- term:
    id: GO:0016151
    label: nickel cation binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR002026
  - InterPro:IPR036463
  review:
    summary: >-
      The two InterPro entries behind this row describe the gamma subunit fold,
      which contains no nickel site; the urease metals are bound by the alpha
      subunit.
    action: REMOVE
    reason: >-
      In S. pasteurii urease the two Ni(II) ions are held by His137, His139, the
      carboxylated Lys220, His249, His275 and Asp363, all on the alpha subunit
      P41020, and the crystal structures that resolve the gamma chain show no
      metal bound to it. The reviewed P41022 entry carries no BINDING feature
      and no Nickel keyword. The claim that this subunit binds nickel is
      therefore not merely imprecise but wrong, and it arises from an
      interpro2go mapping on gamma-subunit signatures rather than from any
      evidence about this protein.
    supported_by:
    - reference_id: file:SPOPA/ureC/ureC-uniprot.txt
      record_section: ["CC:COFACTOR"]
      supporting_text: Note=Binds 2 nickel ions per subunit.
    - reference_id: PMID:10368287
      supporting_text: >-
        In the native enzyme, the coordination sphere of each of the two nickel
        ions is completed by a water molecule and a bridging hydroxide.
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: InterPro:IPR002026
      slot: interpro2go
      requested_change: DELETE_VALUE
      asserted_value: GO:0016151
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        InterPro's interpro2go file maps IPR002026 (Urease, gamma/gamma-beta
        subunit) to GO:0016151 nickel cation binding, applied by GOA as an IEA
        (GO_REF:0000002). The urease dinickel centre is carried entirely by the
        alpha subunit: in Sporosarcina pasteurii urease the ligands are His137,
        His139, carboxy-Lys220, His249, His275 and Asp363 of UreC (P41020), and
        the reviewed gamma-subunit entries carry no metal-binding feature or
        Nickel keyword. The mapping propagates a nickel-binding claim to every
        urease gamma subunit and to the fused gamma-beta subunits, and should be
        withdrawn; GO:0043419, the other term mapped from this entry, is
        unaffected. Resource is InterPro (interpro2go, GO_REF:0000002).
    - defect_type: WRONG_TERM
      resource: OTHER
      record: InterPro:IPR036463
      slot: interpro2go
      requested_change: DELETE_VALUE
      asserted_value: GO:0016151
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The same mapping exists on IPR036463 (Urease, gamma subunit
        superfamily), the structural superfamily entry for the gamma chain, and
        should be withdrawn for the same reason: the nickel site is in the alpha
        subunit, not in this fold. Resource is InterPro (interpro2go,
        GO_REF:0000002).
- term:
    id: GO:0019627
    label: urea metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR012010
  review:
    summary: >-
      The parent process term is true of UreA, which acts only in the catabolic
      branch covered by the more specific GO:0043419.
    action: TOO_GENERAL
    reason: >-
      Urease carries out urea degradation and nothing else in urea metabolism,
      so the broader term is true but uninformative: GO:0043419 urea catabolic
      process, accepted in this review, is a descendant of GO:0019627 and
      already says which part of urea metabolism this subunit belongs to.
- term:
    id: GO:0043419
    label: urea catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002026
  - InterPro:IPR036463
  - UniRule:UR000001329
  - UniPathway:UPA00258
  review:
    summary: >-
      UreA is a required structural component of the enzyme that performs the
      single step of urea degradation.
    action: ACCEPT
    reason: >-
      The gamma subunit is not the chain that catalyses the reaction, but it is
      part of the complex that does and contributes the structure the catalytic
      subunit is built into, which is participation in the sense GO intends for
      a complex subunit. UniProt places the enzyme as the only step of the urea
      degradation pathway.
    supported_by:
