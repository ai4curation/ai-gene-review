id: P41022
gene_symbol: ureA
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:1474
  label: Sporosarcina pasteurii
description: >-
  UreA is the 100-residue gamma subunit of the nickel-dependent urease
  (EC 3.5.1.5) of the soil bacterium Sporosarcina pasteurii (formerly Bacillus
  pasteurii). It is a small, non-catalytic structural chain: one copy of UreA
  associates with one UreB (beta) and one UreC (alpha) chain to form the
  heterotrimer, and three heterotrimers assemble into the cytoplasmic
  (alpha-beta-gamma)3 enzyme that hydrolyses urea to ammonia and carbamate. The
  dinuclear Ni(II) active site lies entirely within the alpha subunit, so UreA
  contributes to urea hydrolysis through the architecture of the assembled
  enzyme rather than through an activity of its own. The subunit is resolved in
  all S. pasteurii urease crystal structures, and its N-terminal methionine is
  modelled in the deposited entries as a modified residue, probably the hydrated
  form of N-formylmethionine.
