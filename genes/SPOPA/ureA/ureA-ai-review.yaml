      record_section: ["CC:PATHWAY"]
      supporting_text: >-
        PATHWAY: Nitrogen metabolism; urea degradation; CO(2) and NH(3) from
        urea (urease route): step 1/1.
- term:
    id: GO:0035550
    label: urease complex
  evidence_type: IDA
  original_reference_id: PMID:10368287
  qualifier: part_of
  review:
    summary: >-
      UreA is the gamma chain of the (alpha-beta-gamma)3 S. pasteurii urease
      resolved crystallographically, but no complex-membership row exists for
      it.
    action: NEW
    reason: >-
      GOA carries GO:0035550 for the beta subunit (P41021) through the InterPro
      signature and for neither of the other two chains, although all three are
      resolved together in the S. pasteurii urease structures and UniProt states
      the heterotrimeric composition with experimental evidence. Complex
      membership is the most informative cellular-component claim that can be
      made about this subunit.
    supported_by:
    - reference_id: file:SPOPA/ureA/ureA-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: >-
