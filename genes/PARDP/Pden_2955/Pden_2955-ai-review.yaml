    id: GO:0102143
    label: carboxynorspermidine dehydrogenase activity
  evidence_type: IDA
  original_reference_id: PMID:40074085
  review:
    summary: Carboxyspermidine formation is supported by CASDH expression and pathway genetics. GO:0102143
      explicitly includes the carboxyspermidine/putrescine reaction, despite its short label; obsolete
      GO:0102144 is not used.
    action: NEW
    reason: 'PMID:40074085 Table 2 detects carboxyspermidine by high-resolution LC-MS after expression
      of CASDH alone in E. coli BL21speD and BL21speG. Thus Pden_2955 makes the carboxylated intermediate
      rather than merely affecting the pathway endpoint. Table S1 maps the construct to WP_011749229,
      whose sequence matches A1B695 exactly. GO:0102143 explicitly includes the carboxyspermidine/putrescine
      reaction and lies under CH-NH-group oxidoreductase activity with NAD(P) acceptors; the obsolete
      GO:0102144 is not an additional activity. Same-role comparator check: Vibrio CANSDHs Q9KRL3 and
      P0DPE4 both carry GO:0102143 in QuickGO (2026-11-05). Their annotation state checks term usage,
      not this target''s biochemical evidence. No other proposed MF is an ancestor or descendant duplicate;
      the separate tetraamine proposal changes the amine substrate. The experiment is heterologous product
      analysis, not a purified-enzyme kinetic or cofactor-specificity measurement.'
    supported_by:
    - reference_id: PMID:40074085
      supporting_text: Table 2 shows that in both BL21speD and BL21speG, the A. tumefaciens, P. denitrificans
        CASDH produced approximately 100-fold more carboxyspermidine than the D. desulfuricans and H. thermophila
        CASDH.
    - reference_id: file:modules/bacterial_carboxyspermidine_biosynthesis-source-analysis/PMID40074085-supplement.txt
      supporting_text: Paracoccus denitrificans (α-Proteobacteria)    CASDH [WP_011749229]              407
