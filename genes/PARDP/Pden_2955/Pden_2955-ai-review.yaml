taxon:
  id: NCBITaxon:318586
  label: Paracoccus denitrificans PD1222
description: Pden_2955 is a carboxyspermidine dehydrogenase that reductively condenses putrescine with
  L-aspartate 4-semialdehyde to form carboxyspermidine, the first intermediate in an alternative spermidine
  biosynthetic pathway. The adjacent NspC-family decarboxylase converts this intermediate to spermidine.
  The matched pair reconstructs spermidine production in E. coli; native PD1222 flux was not measured
  in that experiment. The enzyme pair also produces spermine and thermospermine through carboxylated intermediates
  in heterologous E. coli reconstruction. Additional tetraamine products are detected when homospermidine
  or norspermidine is supplied to the reconstructed pathway; these activities do not establish the predominant
  substrates in the native bacterium.
references:
- id: PMID:40074085
  title: New routes for spermine biosynthesis.
  findings:
  - statement: The accession-matched CASDH/CASDC pair synthesizes spermidine when expressed in spermidine-deficient
      E. coli; this is pathway reconstruction, not a purified-enzyme kinetic assay.
    supporting_text: Fig. 2 shows that all CASDH/CASDC pairs were able to synthesize spermidine in the
      spermidine-void BL21speD cells.
  - statement: LC-MS/MS resolves both spermine and thermospermine made by the reconstructed pair.
    supporting_text: Table 1 shows that both Spm and Tspm were produced by each CASDH/CASDC pair.
  - statement: CASDH expression alone produces carboxyspermine/carboxythermospermine in a spermidine-replete
      host; these intermediate isomers were not distinguished.
    supporting_text: However, in the spermidine-replete BL21speG, the CASDHs of A. tumefaciens and P. denitrificans
      efficiently produce C-Spm/C-Tspm.
  - statement: Fed homospermidine and norspermidine reveal additional substrate scope, with unknown relative
      uptake and no native-flux inference.
    supporting_text: Consistent with this, approximately 5- to 8-fold more N1-aminopropylhomospermidine
      was produced by the A. tumefaciens, P. denitrificans, and B. abortus CASDH/CASDC pairs, compared
      to norspermine, when expressed in spermidine-void BL21speD grown with 500 μM homospermidine or norspermidine
      (Fig. S1).
