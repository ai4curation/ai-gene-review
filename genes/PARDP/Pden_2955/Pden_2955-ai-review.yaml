suggested_questions:
- question: Which native growth conditions determine flux through the spermidine versus spermine/thermospermine
    branches, and what are the individual enzyme kinetic preferences for the corresponding substrates?
  experts:
  - Anthony J. Michael
- question: How much of the homospermidine/norspermidine-dependent tetraamine chemistry observed after
    heterologous feeding operates in the native organism?
- question: GO:1903603 thermospermine biosynthetic process is active but has no exact QuickGO annotations,
    including on established thermospermine synthases. Should the isomer-resolved, accession-matched heterologous
    route be annotated to this BP, and what native-context evidence do GO curators require? This is a
    term-use question, not evidence that existing curators made an error.
suggested_experiments:
- description: Combine native locus deletion and complementation with isotope-labeled putrescine and spermidine
    and isomer-resolving LC-MS/MS under defined nutrient conditions, then assay purified proteins across
    the identified carboxypolyamine or amine substrates. Separate intrinsic catalytic specificity from
    substrate uptake, pool sizes and protein abundance.
  experiment_type: Native metabolic tracing and purified-enzyme kinetics
