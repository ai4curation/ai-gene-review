proposed_new_terms:
- proposed_name: carboxyspermine/carboxythermospermine dehydrogenase activity
  proposed_definition: Catalysis of the reductive condensation of spermidine with L-aspartate 4-semialdehyde
    to form carboxyspermine or carboxythermospermine.
  justification: 'The 2025 reconstruction establishes the two-step aspartate semialdehyde-dependent route
    and separates the final products by LC-MS/MS. It must not be represented by the chemically different
    decarboxylated-S-adenosylmethionine-dependent spermine/thermospermine synthase activity terms. The
    intermediate isomers were not resolved and individual purified-enzyme kinetic constants were not measured.
    This is an assayed catalytic capability retained outside core_functions: native locus-dependent tetraamine
    flux and physiological centrality remain unestablished. Heterologous expression of a functional route
    does not by itself demonstrate conservation of that role.'
  supported_by:
  - reference_id: PMID:40074085
    supporting_text: Table 1 shows that both Spm and Tspm were produced by each CASDH/CASDC pair.
  - reference_id: PMID:40074085
