      of the retained spermidine or the other tetraamine BP; no broad redundant polyamine-process proposal
      is added. This NEW claim records the demonstrated reconstructed capability. It does not establish
      a conserved physiological core function: native locus-dependent spermine flux has not been shown
      for this target, so the activity is excluded from core_functions.'
