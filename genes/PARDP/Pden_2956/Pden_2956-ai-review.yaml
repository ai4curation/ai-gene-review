  label: Paracoccus denitrificans PD1222
description: Pden_2956 is a carboxyspermidine decarboxylase of the NspC family that catalyzes the second
  step of the aspartate semialdehyde-dependent spermidine pathway, converting carboxyspermidine to spermidine.
  It is a predicted cytoplasmic, pyridoxal phosphate-dependent enzyme. The matched pair reconstructs spermidine
  production in E. coli; native PD1222 flux was not measured in that experiment. The enzyme pair also
  produces spermine and thermospermine through carboxylated intermediates in heterologous E. coli reconstruction.
  Additional tetraamine products are detected when homospermidine or norspermidine is supplied to the
  reconstructed pathway; these activities do not establish the predominant substrates in the native bacterium.
