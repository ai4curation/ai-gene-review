- term:
    id: GO:0016668
    label: oxidoreductase activity, acting on a sulfur group of donors, NAD(P) as acceptor
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR012999
  - UniRule:UR000329331
  review:
    summary: >-
      Family-wide term from the class-I pyridine nucleotide-disulfide oxidoreductase active-site
      signature (PROSITE PS00076, IPR012999). It fits relatives such as dihydrolipoamide dehydrogenase,
      where a sulfur-containing substrate is the electron donor. In MerA the active-site disulfide belongs
      to the enzyme, and the substrate is Hg(II).
    action: REMOVE
    reason: >-
      GO:0016668 requires a sulfur-containing group as the substrate electron donor reducing NAD(P).
      The MerA reaction is Hg(0) + NADP+ <=> Hg(II) + NADPH, a metal-ion oxidoreduction (GO:0016152 is
      under GO:0016723, oxidoreductase activity acting on metal ions, NAD or NADP as acceptor, and not
      under GO:0016668). The redox-active disulfide is part of the catalytic machinery shared with the
      family and is not a substrate. This electronic mapping is wrong for this protein.
    supported_by:
    - reference_id: PMID:1531297
      supporting_text: A member of the flavin disulfide oxidoreductase family, MerA contains an FAD prosthetic group and redox-active disulfide in its active site.
    - reference_id: file:THIDA/merA/merA-uniprot.txt
      record_section: ["CC:CATALYTIC ACTIVITY"]
      supporting_text: Reaction=Hg + NADP(+) + H(+) = Hg(2+) + NADPH
    - reference_id: file:rules/rules-export-go-summary.csv
      supporting_text: |-
        UR000329331,unirule,GO:0016152,mercury (II) reductase (NADP+) activity,1
        UR000329331,unirule,GO:0016668,"oxidoreductase activity, acting on a sulfur group of donors, NAD(P) as acceptor",1
        UR000329331,unirule,GO:0046689,response to mercury ion,1
        UR000329331,unirule,GO:0046872,metal ion binding,1
        UR000329331,unirule,GO:0050660,flavin adenine dinucleotide binding,1
    - reference_id: file:rules/unirule/UR000329331/UR000329331.json
      supporting_text: '"oldRuleNum": "PIRNR000350"'
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      record: InterPro:IPR012999
      slot: interpro2go
      requested_change: CHECK
      asserted_value: GO:0016668
      cause: OTHER
      confidence: SUSPECTED
      explanation: >-
        Resource is InterPro (InterPro2GO), with the same term also asserted by UniRule UR000329331
        in the combined GO_REF:0000120 pipeline. IPR012999 (class-I pyridine nucleotide-disulfide
        oxidoreductase, FAD/NAD(P)-binding active site) is mapped to GO:0016668, which is true for
        lipoamide dehydrogenase-type members. It is false for mercuric reductases, whose substrate is
        Hg(II) and not a sulfur group. The family-wide mapping may need to be removed or restricted.
        The rule-level half of this defect is filed separately against UniProt.
    - defect_type: WRONG_TERM
      resource: UNIPROT
      record: UniRule:UR000329331
      slot: GO_ID
      requested_change: DELETE_VALUE
      asserted_value: GO:0016668
      cause: OTHER
      confidence: PROBABLE
      explanation: >-
        The GOA row for Q3SJ73 names UniRule:UR000329331 in its WITH/FROM for GO:0016668, and the
        UniProt entry itself carries this term as IEA:UniProtKB-UniRule, so the rule applied to this
        entry asserts it. The rule systems applied to Q3SJ73 are MerA-specific (PIRNR:PIRNR000350
        Mercury_reductase_MerA and RuleBase:RU361223, which also supply the entry's name, EC 1.16.1.1
        and the Hg/NADP(+) catalytic-activity line). GO:0016668 requires a sulfur-containing group as
        the electron donor reducing NAD(P); in mercuric reductase the active-site disulfide belongs to
        the enzyme and the substrate is Hg(II), whose oxidoreduction is GO:0016152, under GO:0016723
        (acting on metal ions, NAD or NADP as acceptor). A rule that fires on mercuric reductases
        should therefore not assert GO:0016668. The committed rule record
        rules/unirule/UR000329331/UR000329331.json gives its old rule number as PIRNR000350, the
        MerA-specific system that the entry carries as its rule-based evidence, and the committed GO
        summary of the cached rules holds exactly five rows for UR000329331 and no others, so the
        rule's complete GO assertion set is GO:0016152, GO:0016668, GO:0046689, GO:0046872 and
        GO:0050660. The
        rule thus already carries GO:0016152, the correct specific term for this activity, beside a
        broader term that does not hold for its own scope, so deleting GO:0016668 from the rule loses
        no information. The separate, broader InterPro2GO mapping of IPR012999 to the same term is
        filed against InterPro.
- term:
    id: GO:0045340
    label: mercury ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR021179
  review:
    summary: >-
      Supported by the N-terminal HMA/NmerA domain (GMTCDHC, PROSITE PS50846) and the C-terminal
      Cys538/Cys539 pair. In Tn501 MerA both are Hg(II)-binding sites, used for acquisition and
      catalysis respectively.
    action: ACCEPT
    reason: >-
      Hg(II) binding is part of the catalytic mechanism and of substrate acquisition by the NmerA domain.
      Both sets of binding cysteines are conserved in Q3SJ73. Binding of the substrate metal is retained
      as a molecular function alongside the catalytic term.
    supported_by:
    - reference_id: PMID:16114877
      supporting_text: we show Tn501 NmerA to be a stable, soluble protein that binds 1 Hg(2+)/domain and delivers it to the catalytic core at kinetically competent rates
    - reference_id: PMID:1531297
      supporting_text: Cys558 plays a more important role in forming the reducible complex with Hg(II), while both Cys558 and Cys559 seem to be involved in efficient scavenging (i.e., tight binding) of Hg(II).
    - reference_id: file:THIDA/merA/merA-bioinformatics/RESULTS.md
      supporting_text: "NmerA GMTCxxC motif: P00392 C11 and C14 align to Q3SJ73 C13 and C16"
