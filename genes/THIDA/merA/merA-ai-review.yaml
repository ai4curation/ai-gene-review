id: Q3SJ73
gene_symbol: merA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:292415
  label: Thiobacillus denitrificans ATCC 25259
description: >-
  Mercuric reductase (MerA, locus Tbd_1341) of the chemolithoautotrophic, facultatively
  anaerobic sulfur oxidizer Thiobacillus denitrificans. It is a 541-residue class-I pyridine
  nucleotide-disulfide oxidoreductase. One N-terminal heavy-metal-associated NmerA domain
  (GMTCDHC) is joined to an FAD/NAD(P)H-binding catalytic core that carries the redox-active
  CVNVGC disulfide and the MerA-specific C-terminal Cys-Cys pair. It is encoded as the last gene
  of a merRTPA operon inside a chromosomal metal-resistance island. By homology to the
  characterized Tn501 enzyme, it is predicted to be a homodimeric flavoenzyme that
  uses NADPH to reduce Hg(II), delivered by MerP/MerT, to volatile, relatively inert Hg(0). This
  confers resistance to inorganic mercury. No activity, expression, localisation or phenotype has
  been measured for this protein.
