- term:
    id: GO:0050787
    label: detoxification of mercury ion
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR021179
  review:
    summary: >-
      MerA performs the detoxifying step of mer-mediated resistance, the reduction of Hg(II) to volatile Hg(0).
      Q3SJ73 is encoded in a merRTPA operon and conserves the catalytic set.
    action: ACCEPT
    reason: >-
      MerA is the catalyst of the detoxification process, so this is participation and not mere
      requirement. Tn501 merA C-terminal cysteine mutants abolish Hg(II) detoxification in vivo, and
      Q3SJ73 conserves those residues in a canonical mer operon. Mercury resistance of T. denitrificans
      ATCC 25259 has not itself been tested, so this remains a homology-based inference.
    supported_by:
    - reference_id: PMID:1531297
      supporting_text: Phenotypic analysis indicates that both merA mutations result in a total disruption of the Hg(II) detoxification pathway in vivo
    - reference_id: PMID:12829275
      supporting_text: Loci conferring HgR in Gram-positive or Gram-negative bacteria typically have at minimum a mercuric reductase enzyme (MerA) that reduces reactive ionic Hg(II) to volatile, relatively inert, monoatomic Hg(0) vapor
    - reference_id: PMID:16452431
      supporting_text: a Hg 2+ resistance system, merRTPA (Tbd1338-Tbd1341)
