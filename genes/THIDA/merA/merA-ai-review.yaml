suggested_questions:
- question: >-
    Is the Tbd_1341 merRTPA operon of Thiobacillus denitrificans ATCC 25259 induced by Hg(II), and does
    it confer measurable mercury resistance and Hg(0) volatilization in this organism?
- question: >-
    In sulfur-oxidizing Thiobacillus species growing on mercury sulfide minerals, is MerA responsible for
    the Hg(0) produced, or do abiotic reductants generated by sulfur oxidation account for part of it?
- question: >-
    Does the single NmerA domain of Thiobacillus MerA accept Hg(II) directly from MerT/MerP, and how does
    the handoff compare with the two-domain MerA proteins?
suggested_experiments:
- description: >-
    Express Tbd_1341 in a mercury-sensitive Escherichia coli host and measure Hg(II)-dependent NADPH
    oxidation and Hg(0) volatilization, with the C538A/C539A double mutant as a catalytic control.
- description: >-
    Expose T. denitrificans ATCC 25259 to sub-lethal Hg(II) and measure merRTPA transcript levels by
    RT-qPCR to establish MerR-dependent induction in this organism.
- description: >-
    Construct a merA deletion in a sulfur-oxidizing Thiobacillus and compare Hg(0) emission from
    metacinnabar incubations with the wild type, to test whether MerA is required for the volatilization
    attributed to these cultures.
