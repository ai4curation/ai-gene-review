  review:
    summary: >-
      Core catalytic activity. Q3SJ73 matches the MerA family signatures (PIRSF000350, TIGR02053,
      IPR021179) and conserves the three cysteine sets needed for Hg(II) reduction in Tn501 MerA.
    action: ACCEPT
    reason: >-
      Several independent lines support the prediction. (1) Family membership: curated PIRSF/NCBIfam MerA rules, plus
      61% identity to Tn501 MerA (P00392). (2) Conservation of the redox-active disulfide (C117/C122)
      and the MerA-specific C-terminal Cys538/Cys539 pair. In Tn501 these cysteines distinguish MerA
      from mercurial-inhibited family members and are needed for Hg(II) reduction. (3) Genomic context:
      Tbd_1341 is the merA of a merRTPA operon. The function remains a homology-based prediction for this
      protein (PE 3).
    supported_by:
    - reference_id: PMID:1531297
      supporting_text: Mercuric ion reductase (MerA) catalyzes the reduction of Hg(II) to Hg(0) as the last step in the bacterial mercury detoxification pathway.
