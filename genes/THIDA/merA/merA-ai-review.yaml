- id: PMID:26157421
  title: Microbial- and thiosulfate-mediated dissolution of mercury sulfide minerals and transformation to gaseous mercury.
  findings:
  - statement: >-
      A 285-bp merA fragment from Thiobacillus thioparus was most similar to T. thioparus DSM 505 and
      85% similar to T. denitrificans ATCC 25259 merA, the basis for using Q3SJ73 as a genus-level
      representative. No MerA activity or mutant was examined.
    supporting_text: BLAST analysis of the merA fragment nucleotide sequence revealed a 98% sequence similarity to T. thioparus DSM 505 and 85% similarity to Thiobacillus denitrificans ATCC 25259, both containing putative mercuric reductase genes.
    reference_section_type: RESULTS
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Full text read. The work is on T. thioparus ATCC 8158, not T. denitrificans. It shows Hg(0) production
      from metacinnabar by live cells but does not attribute it to MerA experimentally. Background only.
