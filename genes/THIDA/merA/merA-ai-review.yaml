- term:
    id: GO:0016152
    label: mercury (II) reductase (NADP+) activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - InterPro:IPR021179
  - RHEA:23856
