  label: Komagataeibacter xylinus
description: BcsA is the integral inner-membrane catalytic subunit of the cellulose synthase encoded by
  the four-gene bcsABCD operon of Komagataeibacter xylinus strain 1306-3. Its glycosyltransferase domain
  processively incorporates glucose from UDP-glucose into beta-1,4-glucan, providing the polymer chains
  used to build extracellular cellulose fibrils. A C-terminal PilZ domain couples cellulose synthesis
  to cyclic-di-GMP. This 754-residue protein is a separate BcsA subunit; BcsA-BcsB fusion proteins occur
  in other cellulose-producing strains.
