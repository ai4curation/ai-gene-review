- term:
    id: GO:0035438
    label: cyclic-di-GMP binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR003919
  - InterPro:IPR009875
  review:
    summary: Retain cyclic-di-GMP binding by the C-terminal PilZ domain.
    action: ACCEPT
    reason: The curated record assigns cyclic-di-GMP binding, and the 2006 primary article reports binding
      by an isolated G. xylinus BcsA1 PilZ domain. Its main text was subsequently readable in the author-hosted
      ResearchGate copy, confirming a C-terminal His-tagged domain and a 30 uM dissociation constant.
      The full-length protein was not that construct. Exact strain/accession mapping remains unresolved
      without the supplement, so the existing annotation is retained on curated/domain support without
      assigning a full-length 1306-3 affinity.
    supported_by:
    - reference_id: file:KOMXY/bcsA/bcsA-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: Binds c-di-GMP with a dissociation constant of 30 uM.
    - reference_id: PMID:16920715
      supporting_text: 'Individual PilZ domains from YcgR and BcsA also bound c-di-GMP, albeit

        with lesser affinity, indicating that PilZ is sufficient for binding.'
