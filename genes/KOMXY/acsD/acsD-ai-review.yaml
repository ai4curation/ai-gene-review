description: AcsD (BcsD) is a small, noncatalytic accessory protein of the cellulose-synthesis machinery.
  The 156-residue sequence recorded from strain ATCC 53582/NQ5 is identical to the native protein segment
  crystallized from ATCC 23769. It forms a stable octameric cylinder with four internal passageways that
  contact cellopentaose, supporting a role in organizing nascent glucan chains. Native disruption reduces
  cellulose production, while polymerization can persist without AcsD. Its contribution to cellulose packing
  and crystallization is supported by genetic and structural evidence, but directed chain transport and
  the precise crystallization mechanism remain proposed.
