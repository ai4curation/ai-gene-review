knowledge_gaps:
- gap_statement: How does the AcsD octamer organize glucan chains in the native cellulose machinery?
  boundary: >-
    The structure binds cellopentaose and N-terminal mutations impair cellulose yield, but directed
    translocation, a native four-chain intermediate and effects on cellulose physicochemical properties
    are not established by these experiments. No specific catalytic or transporter MF is assigned. An
    OpenScientist run (kgap-acsd-passageway-geometry) refutes the conduit reading on geometry and leaves
    the organiser reading standing on phenotype, and it does so against a calibrated positive control
    rather than by assertion. A clearance field computed on the deposited octamer coordinates finds that
    four compartments and a traversable route never coexist: at a 1.4 Angstrom probe there is a single
    compartment of about 59,000 cubic Angstrom, 80 Angstrom long and open at both ends, while at a 3.2
    Angstrom probe the four sites are closed pockets of 13 to 17 cubic Angstrom and 3.6 to 4.8 Angstrom
    long. Width and burial alone do not separate the sites from a real channel, since the AcsD pore
    radius of 3.8 to 4.7 Angstrom and burial of 0.84 to 0.87 fall inside the range measured for BcsA,
    the cellulose-conducting synthase channel used here as the reference standard; that is why the run
    leans on the discriminating tests instead. Three of those are negative. The lining has no aromatic
    stacking track, with zero aromatics within 4.5 Angstrom at all four sites against 13 of 41 contacts
    in BcsA, Fisher p = 0.0024 and the nearest aromatic 4.9 Angstrom away, the site instead being built
    from Lys6, Lys7, Asp9, Thr11, Leu12, Gln15, Asn61, Ala62, Ala65, Leu66, Ile67, Gly68, Gln92 and
    Gly94 across four subunits. The four sites cannot template a crystallite, lying 19.1 Angstrom apart
    against the 8.20 Angstrom spacing of a cellulose I-beta sheet, with chain axes 54.6 to 58.0 degrees
    apart for adjacent sites and 85.7 to 86.9 degrees for opposite ones where 0 degrees is required. And
    the lining is not conserved across the family: 0.241 against 0.301 for non-lining positions over 491
    PF03500 sequences, Mann-Whitney p = 0.31, with the twelve most conserved positions sitting a median
    11.0 Angstrom from the sugar and only Asn61 at the site, while Lys6 itself is 0.04 family-wide. Two
    further tests came back non-discriminating rather than supportive, and the run says so: apo and holo
    linings superpose at 0.29 to 0.44 Angstrom, below the core RMSD, so there is no induced fit but two
    crystal forms cannot exclude lattice-suppressed motion; and the rigid-slide test did not separate
    AcsD from BcsA. What survives is the organiser reading, supported from phenotype rather than from
    structure: tuning bcsD expression changes crystallinity and porosity while yield does not fall
    significantly, heterologous BcsD alone raises the crystallinity index of E. coli cellulose by about
    17 per cent, and BcsD interacts with the BcsAB polymerisation complex both directly and through the
    product cellulose. One conflict is left open rather than resolved: the original operon-disruption
    genetics reports that bcsD mutants are impaired in cellulose production, which sits against those
    yield-neutral expression studies, and strain and assay differences are unresolved. A taxonomic
    observation cuts the same way, since PF03500 spans 141 genera but is absent from Escherichia and
    Salmonella, which make cellulose without a BcsD subunit. The free text of this review was checked
    against the run's warning and needs no softening: it already calls directed chain transport and the
    crystallisation mechanism proposed, and its use of passageway follows the source paper's structural
    description rather than asserting a conduit. The run's molecular-function lead, adding
    polysaccharide binding as an IDA from the cellopentaose complex with contacts of 2.5 to 4.5 Angstrom
    from Lys6, Asp9, Thr11, Gln15, Asn61 and Gln92, is recorded as a question for a curator rather than
    asserted here, since this campaign records gap provenance and does not add annotations; note also
    that the measured ligand is a soluble cello-oligosaccharide, which is why the run prefers
    polysaccharide binding over cellulose binding. What the run explicitly does not exclude is transient
    passage of a chain through the single open lumen; what it excludes is a static four-channel conduit
    and an internal crystallite template.
  gap_kind:
  - BIOLOGY
  status: NARROWING
  resolution: Reconstitute the native assembly with exact-strain partners, resolve chain trajectories
    and compare cellulose packing and crystallinity after contact-site mutations.
