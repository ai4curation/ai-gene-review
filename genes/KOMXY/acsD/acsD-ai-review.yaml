references:
- id: file:KOMXY/acsD/acsD-hypotheses/kgap-acsd-passageway-geometry/openscientist.md
  title: OpenScientist geometric test of whether the AcsD octamer passageways can conduct glucan chains
  findings:
  - statement: >-
      No probe radius yields four compartments and a traversable route at once, the lining has no
      aromatic sliding track against a BcsA control, the four sites are too far apart and too badly
      misaligned to template a cellulose sheet, and the lining is not conserved across PF03500, so a
      static four-channel conduit and an internal crystallite template are both excluded while the
      phenotype-supported organiser reading stands.
    supporting_text: >-
      Four compartments and a traversable route never coexist.
  reference_review:
    relevance: HIGH
    correctness: UNVERIFIED
    review_notes: >-
      Computed results only; the run's literature quotations were not independently re-verified. Nothing
      in this analysis is checkable against the local UniProt record, which carries sequence and family
      data but no structural coordinates, so unusually little was verified here: the clearance fields,
      pore radii and burial values, the aromatic contact counts and Fisher test, the site spacing and
      axis angles against the cellulose reference, the apo-holo superposition, the 491-sequence
      conservation analysis and the PF03500 taxonomy all rest on the run. Its positive control, BcsA as a
      known cellulose-conducting channel, is what gives the negatives force, and the run states which of
      its own tests were non-discriminating. Its molecular-function lead was recorded as a question rather
      than acted on, and no annotation action was changed.
