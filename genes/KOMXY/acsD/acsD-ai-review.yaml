knowledge_gaps:
- gap_statement: How does the AcsD octamer organize glucan chains in the native cellulose machinery?
  boundary: The structure binds cellopentaose and N-terminal mutations impair cellulose yield, but directed
    translocation, a native four-chain intermediate and effects on cellulose physicochemical properties
    are not established by these experiments. No specific catalytic or transporter MF is assigned.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Reconstitute the native assembly with exact-strain partners, resolve chain trajectories
    and compare cellulose packing and crystallinity after contact-site mutations.
  provenance:
  - reference_id: PMID:20921370
