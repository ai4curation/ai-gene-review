  review:
    summary: AcsD contributes to efficient cellulose biosynthesis as a structural accessory.
    action: ACCEPT
    reason: The ATCC53582 acsD mutant produces reduced cellulose I and II. The complete native sequence
      is identical to the ATCC23769 structure, whose oligomer and glucan-contacting channels support direct
      structural participation beyond a knockout phenotype. This does not imply that AcsD catalyzes polymerization,
      that all cellulose synthesis requires it, or that the proposed chain-extrusion/crystallization mechanism
      has been directly measured.
    supported_by:
    - reference_id: PMID:8083166
      supporting_text: 'the acsD mutant produced reduced

        amounts of two cellulose allomorphs (cellulose I and cellulose II), suggesting

        that the acsD gene is involved in cellulose crystallization.'
    - reference_id: PMID:20921370
      supporting_text: Among the CPT contacted residues, the side chains of Lys6, Asp9, and Thr11 were
        positioned within the hydrogen-bonding distance to the CPT.
    - reference_id: file:KOMXY/acsD/acsD-bioinformatics/RESULTS.md
      supporting_text: P37719 is exactly the complete 156-residue native segment in both RCSB 3AJ2 and
        cellopentaose-bound 3A8E entity 1, followed only by six histidines.
