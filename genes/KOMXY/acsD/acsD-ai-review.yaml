  review:
    summary: Homooligomerization is directly demonstrated by structure and solution experiments.
    action: ACCEPT
    reason: 'Retain the specific identical-protein-binding annotation: independent crystal forms, gel
      filtration and SAXS support a stable octamer, rather than a nonspecific interaction or crystal-packing
      artifact. The ATCC23769 construct contains the complete native P37719 sequence with a terminal His
      tag. This existing binding term describes self-assembly but is not used to invent a catalytic or
      transporter molecular function.'
    supported_by:
    - reference_id: PMID:20921370
      supporting_text: These results taken together indicate that AxCeSD exists in an octamer as a functional
        unit
