suggested_questions:
- question: >-
    Should AcsD carry a polysaccharide-binding molecular function term grounded in the cellopentaose
    complex, where Lys6, Asp9, Thr11, Gln15, Asn61 and Gln92 contact the sugar at 2.5 to 4.5 Angstrom,
    given that the measured ligand is a soluble cello-oligosaccharide rather than cellulose itself?
- question: >-
    Is there a GO term for bacterial cellulose crystallisation, or should one be requested? The
    crystallinity phenotypes support an organising role downstream of chain release, but the geometry
    excludes an internal crystallite template, and no suitable specific term was found.
- question: >-
    Why do operon-disruption genetics report impaired cellulose production for bcsD mutants while two
    expression-tuning studies report unchanged yield with altered crystallinity, and does the absence of
    PF03500 from Escherichia and Salmonella, which make cellulose without BcsD, settle which is general?