  review:
    summary: Refine the supported cellulose-producing role to bacterial cellulose biosynthesis.
    action: MODIFY
    reason: 'The ATCC 53582 acsD mutant produces reduced cellulose I and II. The complete native sequence
      is identical to the ATCC 23769 structure, whose oligomer and glucan-contacting channels support
      direct structural participation beyond a knockout phenotype. This does not imply that AcsD catalyzes
      polymerization, that all cellulose synthesis requires it, or that the proposed chain-extrusion/crystallization
      mechanism has been directly measured. GO:0090540 is the supported is_a descendant: its added distinction
      is bacterial context, not a different polymer or a stronger native-output claim. AcsD contributes
      structural glucan organization to bacterial cellulose production; this refinement does not establish
      obligatory crystallization or polymerase chemistry.'
