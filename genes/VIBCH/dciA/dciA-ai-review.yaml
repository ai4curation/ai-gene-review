proposed_new_terms:
- proposed_name: replicative DNA helicase loader activity
  proposed_definition: Facilitating the opening or assembly of a replicative DNA helicase ring and its
    placement around single-stranded DNA, producing a loaded helicase competent for subsequent activation.
  justification: Productive DnaB loading is directly measured with DNA threading blocked and supported
    by ring-opening structural evidence. This is not DNA-unwinding catalysis, sliding-clamp loading, generic
    protein binding or sequence-specific origin recognition. Use the same proposed activity as the E.
    coli DnaC review while distinguishing ATP-independent DciA from AAA+ loaders.
  supported_by:
  - &id004
    reference_id: PMID:42927770
    supporting_text: the 5′ single-stranded end was blocked with streptavidin, thereby preventing threading
      and ensuring that unwinding can occur only following productive topological loading of DnaB.
  - *id002
  - *id003
core_functions:
- description: Loads the replicative DnaB helicase onto DNA by opening/remodeling the ring and stabilizing
    productive loading intermediates.
  proposed_molecular_function: replicative DNA helicase loader activity
  supported_by:
