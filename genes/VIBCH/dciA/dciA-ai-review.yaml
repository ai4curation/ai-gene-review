id: Q9KPH3
gene_symbol: dciA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243277
  label: Vibrio cholerae O1 biovar El Tor str. N16961
description: DciA is a small, non-ATPase loader for the replicative DnaB helicase in Vibrio cholerae.
  Its N-terminal region promotes opening of the helicase ring, while its C-terminal lasso binds DnaB and
  improves productive loading onto DNA. DciA can suppress DnaB ATP hydrolysis in a pre-loading state while
  increasing productive DNA unwinding in functional assays. The N16961 protein forms a DnaB6-DciA3 structural
  intermediate and supports loading on a fork whose free single-stranded end is blocked, distinguishing
  topological loading from simple helicase threading.
