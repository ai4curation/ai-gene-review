    action: UNDECIDED
    summary: The precise origin-associated pre-primosome assignment cannot be verified from the accessible 2020
      source.
    reason: GO:1990099 describes a helicase-containing protein-DNA complex at an origin, lacking primase.
      The cited PMID:32679070 is cached as abstract only and establishes loading biochemistry without resolving
      that location/assembly claim. The 2026 DnaB6-DciA3 structure directly supports a helicase-loader
      complex but contains no DNA, and its loading assay uses a model fork rather than oriC. These independent
      data establish the loader function but do not resolve the full experimental annotation convention
