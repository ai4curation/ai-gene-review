description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for V. cholerae
  NZ_CWQN01000007.1_75 is "Type VI secretion system structural component TssA (VasJ),
  required for Hcp secretion" (tier A), with two GO terms: GO:0033103 protein secretion by
  the type VI secretion system and GO:0033104 type VI protein secretion system complex. The
  dashboard sequence (475 aa) is 98.7% identical over the aligned region to the N16961
  reference-proteome entry Q9KN46 (VC_A0119, 469 aa), on which this review is filed. The
  call is correct. VC_A0119/VCA0119 is the Class A (TssA2A) TssA of the V. cholerae T6SS:
  deletion in strain V52 abolishes Hcp secretion and killing of E. coli (PMID:21909372),
  and in strain 2740-80 a functional fluorescent fusion caps the distal end of the growing
  sheath as a dodecamer whose cryo-EM structure (PDB 6RIU) fits the sheath-end cap density,
  while its deletion slows sheath polymerization from 23 to 3 nm/s and reduces killing
  (PMID:31403721). GOA holds no annotations for Q9KN46, so both terms are novel. Two
  qualifications on the wording rather than the terms: "structural component" understates a
  role better described as a sheath-tube assembly chaperone or processivity cap, which is
  not strictly essential in O1 El Tor; and the dashboard's paralog signal is real, since the
  neighbouring ImpA_N protein VCA0121 (TagA, Class B, dashboard NZ_WYBZ01000044.1_3, called
  "VasL/ImpA-family inner membrane protein") has an opposing role, so ImpA_N alone would not
  have sufficed. The call avoided that trap by using the C-terminal VasJ domain and the
  VCA0119-specific family signature.
