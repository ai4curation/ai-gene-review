predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0033103
    label: protein secretion by the type VI secretion system
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct and novel. The dashboard sequence is 98.7% identical to
      VC_A0119 of N16961, the gene whose deletion in V. cholerae V52 removed Hcp from
      culture supernatants without changing cellular Hcp, and abolished killing of E. coli
      (PMID:21909372). Independent work in an O1 El Tor strain shows that the protein caps
      the growing T6SS sheath and that its loss slows sheath polymerization about eight-fold
      with reduced prey killing (PMID:31403721). The evidence is therefore direct for this
      gene in this species, not transferred from a distant homolog. GOA holds no annotations
      for Q9KN46, so the term is not already curated. No more specific child term exists for
      sheath assembly, so LSP does not apply.
    supported_by:
    - reference_id: PMID:21909372
      supporting_text: VCA0119 is important for T6SS-dependent secretion
    - reference_id: PMID:31403721
      supporting_text: speed of sheath polymerization dropped from 23 nm per second
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0033104
    label: type VI protein secretion system complex
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct and novel. A functional chromosomal TssA-mNeonGreen fusion
      localizes to T6SS assembly initiation sites and then to the distal end of the
      polymerizing sheath, and the cryo-EM reconstruction of the purified dodecamer fits the
      cap density of isolated V. cholerae sheaths with a correlation of 0.87
      (PMID:31403721). That is direct evidence of membership in the assembled apparatus
      rather than a domain-based inference. The call's own wording, "structural component",
      understates the role: the protein behaves as a sheath-tube assembly chaperone that is
      not strictly essential in strain 2740-80. That nuance affects the annotation text, not
      the validity of this complex term. GOA holds no annotations for Q9KN46.
    supported_by:
    - reference_id: PMID:31403721
      supporting_text: fits as a rigid body with CC = 0.87 into the distal end
    - reference_id: PMID:31403721
      supporting_text: Class A TssAs act as chaperones assisting sheath‐tube copolymerization
