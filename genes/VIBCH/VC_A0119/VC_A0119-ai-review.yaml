  label: Vibrio cholerae O1 biovar El Tor str. N16961
description: >-
  VC_A0119 (VCA0119, historically named vasJ) encodes TssA of the Vibrio cholerae type VI
  secretion system (T6SS), a 469-residue cytoplasmic, non-catalytic protein with an
  N-terminal ImpA_N domain (PF06812) and a C-terminal VasJ domain (PF16989). That
  architecture places it in Class A of the TssA-like proteins (Schneider et al. 2019) and
  in clade TssA2, sub-clade A of Dix et al. 2018; it is not a TssA1-class (baseplate)
  protein. In V. cholerae strain 2740-80 a functional chromosomal TssA-mNeonGreen fusion
  appears at T6SS assembly initiation sites and then tracks the membrane-distal end of the
  polymerizing VipA/VipB sheath and Hcp tube as a stable, non-exchanging dodecamer. The
  purified protein is a dodecameric six-pointed star by cryo-EM (PDB 6RIU) whose
  C-terminal ring fits the cap density at the distal end of isolated V. cholerae sheaths.
  Loss of tssA slows sheath polymerization roughly eight-fold and reduces, without
  abolishing, T6SS-dependent killing of E. coli, so the protein is best described as a
  sheath-tube assembly chaperone or processivity cap rather than a strictly essential
  structural subunit. In the O37 strain V52, deletion of VCA0119 abolished Hcp secretion
  and E. coli killing (Zheng et al. 2011). Its ImpA_N paralog in the same gene cluster,
  VCA0121 (TagA, Class B), performs the opposite role of stopping sheath polymerization at
  the far membrane, so ImpA_N presence alone does not determine function. The dashboard
  protein NZ_CWQN01000007.1_75 is 98.7% identical to this N16961 entry.
