knowledge_gaps:
- gap_statement: >-
    Which T6SS subunits TssA of V. cholerae contacts is unresolved. Pulldown and
    bacterial two-hybrid assays did not reproduce the Hcp and baseplate interactions
    reported for the E. coli orthologue, so the molecular basis of cap recruitment and
    of sheath-tube templating in this species is unknown.
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    The division of labour between the ImpA_N (Nt1), middle (Nt2) and VasJ C-terminal
    domains has been mapped for orthologues but not for the V. cholerae protein; the Nt1
    domain is not resolved in the cryo-EM reconstruction.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    Does the ImpA_N domain of V. cholerae TssA mediate sheath binding, as proposed for the
    E. coli orthologue, and what recruits the dodecamer to the initiation site?
suggested_experiments:
- experiment_type: Structure-guided mutagenesis with live-cell sheath imaging
  description: >-
    Mutate the ring interfaces and the Nt1-Nt2 linker of V. cholerae TssA on the chromosome
    and measure sheath polymerization speed, cap residence and prey killing, to separate
    oligomerization from cap processivity.
