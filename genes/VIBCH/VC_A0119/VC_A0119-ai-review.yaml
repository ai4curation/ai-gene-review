core_functions:
- description: >-
    Class A TssA (TssA2A) cap of the T6SS sheath. It is recruited to the T6SS assembly
    initiation site, then rides the membrane-distal end of the polymerizing VipA/VipB sheath
    and Hcp tube as a dodecamer, promoting processive sheath-tube copolymerization and hence
    efficient Hcp secretion and contact-dependent killing.
  proposed_molecular_function: type VI secretion system sheath assembly chaperone activity
  directly_involved_in:
  - id: GO:0033103
    label: protein secretion by the type VI secretion system
  in_complex:
    id: GO:0033104
    label: type VI protein secretion system complex
  supported_by:
  - reference_id: PMID:31403721
    supporting_text: Class A TssAs act as chaperones assisting sheath‐tube copolymerization
  - reference_id: PMID:31403721
    supporting_text: speed of sheath polymerization dropped from 23 nm per second
  - reference_id: PMID:30420757
    supporting_text: V. cholerae TssA2A (VCA0119)
proposed_new_terms:
- proposed_name: type VI secretion system sheath assembly chaperone activity
  proposed_definition: >-
    Binding, as a homo-oligomeric ring, to the distal end of a polymerizing type VI secretion
    system sheath-tube assembly and promoting the processive addition of sheath (TssB/TssC)
    and inner tube (Hcp) subunits.
  justification: >-
    Class A TssA proteins are non-catalytic dodecameric caps that accelerate T6SS sheath
    polymerization from its distal end. GO has no molecular function term for this role and
    no process term for T6SS sheath assembly, so such proteins can currently only be
    annotated to the whole secretion process and the apparatus complex.
  proposed_parent:
    id: GO:0005198
    label: structural molecule activity
  supported_by:
  - reference_id: PMID:31403721
    supporting_text: >-
      required for fast and efficient polymerization of T6SS sheath
