    label: L-tryptophan transmembrane transporter activity
  predicted_term_type: GO_MF
  review:
    assessment: PLI
    confidence_score: 0
    error_type: PARALOG_OVERANNOTATION
    summary: >-
      The prediction is a paralog over-annotation. The call's only tryptophan evidence is
      the same-genome paralog VC2283/AatX at 54.9% identity, and the call ranks that
      paralog above all other hits. The tryptophan role was assigned to VC2283
      specifically, because it is a TrpR-regulated gene (PMID:36130487). VC_1669 has no
      TrpR-like operator (9 of 20 mismatches, the genome median), no tryptophan-related
      neighbours and no experimental tryptophan data. VC_1669 is no closer than AatX to the
      tryptophan-transporting NSS proteins TnaT and MhsT. Characterized bacterial NSS
      members carry different amino acids (Trp, Tyr, Leu/Ala, broad hydrophobic), so
      substrate does not follow from family membership. No experiment excludes tryptophan
      as a VC_1669 substrate, but nothing supports it beyond transfer from the distinct
      paralog. The term is absent from GOA.
