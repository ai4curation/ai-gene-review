- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0015293
    label: symporter activity
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct at the family level. Every functionally characterized
      bacterial NSS member is a Na+-coupled symporter, including the 11-TM Tyt1
      (PMID:16798738) and TnaT (PMID:12569103). VC_1669 is a full-length NSS protein with
      11 predicted TM helices, in the Tyt1-like subgroup. The transfer stays at the
      mechanism level and assumes no substrate. Transport has not been tested for VC_1669.
      GOA has no function annotation for Q9KRH3, so the term is novel. The companion review
      adds it as a NEW ISS annotation.
    supported_by:
    - reference_id: PMID:16798738
      supporting_text: Tyt1 catalyzes robust Na+-dependent, highly selective l-tyrosine transport
    - reference_id: PMID:12569103
      supporting_text: Transport was Na(+)-dependent and highly selective.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0031402
    label: sodium ion binding
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      The evidence cannot confirm or refute this term. The extractor derived it from the
      word "sodium-dependent" in the call, not from any analysis of the protein.
      Characterized bacterial NSS transporters such as TnaT and Tyt1 are Na+-dependent, so
      Na+ binding during symport is plausible. However, Na+ coupling has not been tested
      for VC_1669, and its Na1 and Na2 site residues were not examined in this review.
      Binding a co-transported ion is also part of the
      symporter activity already scored above, not a separate function. The term is
      absent from GOA.
    supported_by:
