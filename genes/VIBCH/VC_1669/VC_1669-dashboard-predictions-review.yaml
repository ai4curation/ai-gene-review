description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for V. cholerae
  NZ_JADNQR010000211.1_1 is "Putative sodium-dependent tryptophan transporter of the
  sodium:neurotransmitter symporter family." (tier A). It has four GO terms: GO:0015196
  L-tryptophan transmembrane transporter activity, GO:0015293 symporter activity,
  GO:0015827 tryptophan transport and GO:0031402 sodium ion binding. The dashboard
  sequence is 98.2% identical to N16961 VC_1669 (Q9KRH3) over 447 aligned residues, so the
  call is scored on Q9KRH3. The family-level part of the call is supported: a putative
  Na+-coupled NSS symporter. The tryptophan part is not. It was transferred from the
  same-genome paralog VC2283/AatX, which is only 54.9% identical to the query, and the
  call ranked that paralog's tryptophan evidence above everything else. The tryptophan
  assignment for AatX rests on its TrpR regulation and an aatX trpT double-mutant
  phenotype (PMID:36130487). VC_1669 has no TrpR-like operator and no tryptophan-related
  neighbours, and no experiment links it to tryptophan. The only experimental note on
  VC1669 is that it is a CarR ChIP-seq target. Neither paralog is closer than the other
  to any characterized NSS transporter (32-48% identity). Two NSS paralogs in one genome
  are not expected to share a substrate, so the tryptophan terms are scored as paralog
  over-annotation. Recommended dashboard verdict: overreach. Corrected annotation:
  "Putative Na+-coupled NSS-family symporter, substrate unknown (paralog of tryptophan
  transporter AatX/VC2283)".
