- term:
    id: GO:0015293
    label: symporter activity
  evidence_type: ISS
  original_reference_id: PMID:16798738
  review:
    summary: VC_1669 is probably a Na+-coupled symporter, inferred from the NSS family; its substrate is unknown.
    action: NEW
    reason: >-
      Every functionally characterized bacterial NSS member is a Na+-coupled symporter:
      Tyt1 (tyrosine; PMID:16798738), TnaT (tryptophan; PMID:12569103) and MhsT
      (hydrophobic amino acids, crystallized with Na+; PMID:25282149). VC_1669 has the
      full-length NSS fold with 11 predicted TM helices, the same count as Tyt1, and falls in
      the Tyt1-like CDD subgroup. It is 32-41% identical to these transporters. Symport is a
      family-wide mechanism and is transferred at that general level only. A substrate-specific
      term is not justified, because the characterized relatives carry different amino acids
      and VC_1669 is no closer to any one of them. Transport has not been tested for VC_1669
      itself.
    supported_by:
    - reference_id: PMID:16798738
      supporting_text: >-
        Tyt1 contains only 11 TMs, a characteristic shared by approximately 70% of prokaryotic
        NSS homologues. Nonetheless upon heterologous expression in an engineered Escherichia
        coli host, Tyt1 catalyzes robust Na+-dependent, highly selective l-tyrosine transport.
    - reference_id: PMID:12569103
      supporting_text: Transport was Na(+)-dependent and highly selective.
    - reference_id: file:VIBCH/VC_1669/VC_1669-bioinformatics/RESULTS.md
      supporting_text: >-
        The two paralogs are 55.5% identical to each other and equally distant (32-48%) from
        every characterized bacterial NSS.
