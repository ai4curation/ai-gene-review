suggested_questions:
- question: What does VC_1669 transport? Is it an amino acid, and does it overlap with AatX for tryptophan?
- question: Does CarR (RstA) regulate VC_1669 expression in response to antimicrobial peptides, and does VC_1669 contribute to envelope-stress fitness?
suggested_experiments:
- description: Screen a ΔVC_1669 mutant and an overexpression strain against a Biolog or Fitness-Browser-style panel of amino acids and osmolytes, then confirm hits by radiolabelled uptake with and without Na+.
  experiment_type: substrate screen and uptake assay
