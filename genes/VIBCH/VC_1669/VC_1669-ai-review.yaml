description: >-
  VC_1669 is a 448-residue inner-membrane protein of the neurotransmitter:sodium symporter
  (NSS/SNF, PF00209) family, in the prokaryotic YocR/YhdH-like subgroup (cd10336
  SLC6sbd_Tyt1-like). It is a paralog of the tryptophan transporter AatX (VC2283), 55.5%
  identical to it. Every characterized bacterial NSS member is a Na+-coupled amino acid
  symporter: TnaT for tryptophan, Tyt1 for tyrosine, MhsT for hydrophobic amino acids
  including tryptophan, and LeuT for leucine and alanine. VC_1669 is only 32-41% identical
  to each of them and no closer to any one, so its substrate cannot be assigned. The only
  experimental report naming VC1669 is a CarR ChIP-seq study that lists it as a direct
  CarR target, relayed here through the dashboard's PaperBLAST summary. The tryptophan
  data for AatX do not transfer to VC_1669. AatX is TrpR-repressed and has a
  near-consensus TrpR operator, whereas VC_1669 has no TrpR-like site (9 of 20
  mismatches, the genome median) and no tryptophan-related neighbouring genes. Its
  neighbours are a pseudouridine synthase and cardiolipin synthase (cls). VC_1669 is best
  described as a putative Na+-coupled NSS-family symporter of unknown substrate.
