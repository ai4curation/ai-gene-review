- id: PMID:36130487
  title: Vibrio cholerae high cell density quorum sensing activates the host intestinal innate immune response.
  findings:
  - statement: The tryptophan-transporter assignment in this paper is for the paralog VC2283 (aatX), chosen because it is TrpR-regulated; VC1669 is not studied.
    supporting_text: >-
      We noted that VC2283, which was significantly repressed by HapR, was predicted to be
      a TrpR-regulated tryptophan transporter in the RegPrecise database
- id: file:VIBCH/VC_1669/VC_1669-bioinformatics/RESULTS.md
  title: >-
    Paralog comparison of VC_2283 (AatX) and VC_1669: pairwise identity to characterized NSS
    transporters, TrpR operator scan, and genomic neighbourhood
  findings:
  - statement: VC1669 has no TrpR operator; VC2283 does.
    supporting_text: VC1669 has no TrpR-like site (9 mismatches, the genome median).
  - statement: Identity does not place either paralog closer to a particular characterized NSS transporter.
    supporting_text: >-
      Identity therefore does not place either one closer to
      the Trp-specific TnaT or the Trp-binding MhsT than the other.
