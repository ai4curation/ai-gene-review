    summary: >-
      Correct and core. The EC/Rhea-derived term matches the curated UniProt
      reactions, and GO:0102143 covers both of them: its definition states the
      carboxynorspermidine reaction and then adds "Also converts
      carboxyspermidine to putrescine." (the NADP+ direction, so reductively
      putrescine to carboxyspermidine), and the term carries both Rhea reactions
      of EC 1.5.1.43, RHEA:34111 and RHEA:34115. The EC/Rhea grounding stands on
      its own: this GOA row's own with/from is RHEA:34111|RHEA:34115|EC:1.5.1.43,
      and those are exactly the two reactions Swiss-Prot curates on Q9KRL3, so the
      term covers the carboxyspermidine reaction whether or not the definition's
      second sentence is read. Genetic deletion and complementation in V. cholerae identify
      VC_1624 as the functional CANSDH.
