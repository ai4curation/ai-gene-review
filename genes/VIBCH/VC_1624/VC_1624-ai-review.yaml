      These support the synthase chemistry, while the C6709 native phenotype is transferred to the N16961
      reference and does not supply a Q9KRL3 comparative substrate-preference assay.
- term:
    id: GO:0045312
    label: nor-spermidine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:19196710
  qualifier: involved_in
  review:
    summary: >-
      Deletion of VC_1624 abolishes sym-norspermidine, and the enzyme
      performs the condensation step of the pathway, so it participates in the
      process rather than merely being required for it.
    action: NEW
    reason: >-
      C6709 VC1624 deletion and complementation identify its role in norspermidine production. VC1624
      performs the precursor-forming reductive condensation, independently supported by purified VC1624
      substrate generation in PMID37878710, so it contributes chemistry rather than merely being necessary.
      This inherited proposal applies the C6709 native evidence to the N16961 Q9KRL3 orthologue.
    supported_by:
    - reference_id: PMID:19196710
      supporting_text: Deletion of either VC1624 (putative CANSDH) or VC1623 (CANSDC) abolished sym
        -norspermidine and spermidine accumulation
    - reference_id: file:VIBCH/VC_1624/VC_1624-uniprot.txt
      record_section: ["CC:DISRUPTION PHENOTYPE"]
      supporting_text: Deletion of the gene abolishes norspermidine and spermidine biosynthesis
- term:
    id: GO:0008295
    label: spermidine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:19196710
  qualifier: involved_in
  review:
    summary: >-
      VC_1624 condenses putrescine with aspartate semialdehyde to form
      carboxyspermidine, the spermidine precursor. Its deletion abolishes
      spermidine, and its overexpression raises spermidine 18-fold while
      lowering putrescine.
    action: NEW
    reason: >-
      C6709 VC1624 deletion eliminates spermidine, while overexpression increases spermidine and depletes
      putrescine, consistent with VC1624 producing carboxyspermidine for the downstream decarboxylase.
      The inherited process proposal therefore reflects a catalytic contribution by the synthase. These
      native genetic/metabolite observations transfer to N16961 Q9KRL3; they do not quantify the purified
      synthase preference for putrescine versus diaminopropane.
    supported_by:
    - reference_id: PMID:19196710
      supporting_text: it increasingly uses putrescine as a substrate and forms carboxyspermidine,
        which is then converted to spermidine by CANSDC
    - reference_id: PMID:19196710
      supporting_text: deletion of either CANSDC or the putative CANSDH led to loss of
        sym-norspermidine and spermidine
