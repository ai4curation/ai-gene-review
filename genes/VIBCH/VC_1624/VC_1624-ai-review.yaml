product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243277
  label: Vibrio cholerae O1 biovar El Tor str. N16961
description: >-
  Carboxynorspermidine synthase (carboxynorspermidine dehydrogenase, CANSDH;
  EC 1.5.1.43), an NADPH-dependent enzyme of the saccharopine dehydrogenase-like
  CANSDH family. It reductively condenses L-aspartate 4-semialdehyde with a
  diamine, either 1,3-diaminopropane to give carboxynorspermidine or putrescine
  to give carboxyspermidine; the carboxypolyamine is then decarboxylated by the
  adjacent NspC (VC_1623) to sym-norspermidine or spermidine. Deletion of VC_1624
  abolishes both norspermidine and spermidine in V. cholerae, slows planktonic
  growth and severely reduces biofilm formation, and overexpression shifts the
  polyamine pool toward spermidine at the expense of putrescine.
