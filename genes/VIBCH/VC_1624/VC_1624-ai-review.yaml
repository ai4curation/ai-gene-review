knowledge_gaps:
- gap_statement: >-
    The quantitative substrate preference and in vivo flux partition of V. cholerae VC1624 remain unresolved;
    the sources reviewed do not provide a comparative steady-state kinetic panel for this enzyme.
  boundary: >-
    PMID:37878710 uses purified VC1624 to produce carboxynorspermidine, so biochemical activity is supported.
    The detailed 2023 putrescine/DAP kinetics in PMID:37437886 concern B. fragilis and C. leptum, not
    VC1624. The C6709 genetic/overexpression data establish both polyamine outputs but do not isolate
    enzyme preference from substrate supply.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Determines whether norspermidine dominance in Vibrio reflects enzyme specificity or
    precursor supply.
  resolution: Steady-state kinetics of purified VC_1624 with both diamines and NADPH.
  provenance:
  - reference_id: PMID:19196710
    supporting_text: These data suggest that when the CANSDH enzyme is in excess, it increasingly
      uses putrescine as a substrate
  - reference_id: PMID:37878710
    supporting_text: The activity toward carboxynorspermidine was assessed by adding CAPADC to the
      reaction mixture containing 1,3-diaminopropane, ASA, NADPH, and CANSDH from V. cholerae.
suggested_questions:
- question: Does V. cholerae CANSDH discriminate kinetically between 1,3-diaminopropane and
    putrescine, or does diamine supply alone set the norspermidine/spermidine ratio?
suggested_experiments:
- description: Purify VC_1624 and determine kcat/Km for 1,3-diaminopropane and putrescine with
    L-aspartate 4-semialdehyde and NADPH; confirm products by LC-MS.
  experiment_type: enzyme kinetics
