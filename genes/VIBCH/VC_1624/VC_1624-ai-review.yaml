- term:
    id: GO:0008295
    label: spermidine biosynthetic process
  evidence_type: IMP
  original_reference_id: PMID:19196710
  qualifier: involved_in
  review:
    summary: >-
      VC_1624 condenses putrescine with aspartate semialdehyde to form
      carboxyspermidine, the spermidine precursor. Its deletion abolishes
      spermidine, and its overexpression raises spermidine 18-fold while
      lowering putrescine.
    action: NEW
    reason: >-
      Same experiment as the norspermidine row. The overexpression data show
      that the enzyme uses putrescine in vivo, so spermidine synthesis is a
      genuine second product of this enzyme pair, not a side effect.
    supported_by:
    - reference_id: PMID:19196710
      supporting_text: it increasingly uses putrescine as a substrate and forms carboxyspermidine, which is then converted to spermidine by CANSDC
