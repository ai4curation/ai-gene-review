      supporting_text: The activity toward carboxynorspermidine was assessed by adding CAPADC to the
        reaction mixture containing 1,3-diaminopropane, ASA, NADPH, and CANSDH from V. cholerae.
    reason: >-
      The EC/Rhea mapping matches the two curated CANSDH reactions for Q9KRL3. PMID19196710 identifies
      VC1624 through C6709 deletion/complementation and polyamine measurements; PMID37878710 additionally
