knowledge_gaps:
- gap_statement: >-
    The kinetic preference of purified V. cholerae CANSDH for
    1,3-diaminopropane versus putrescine has not been measured; the in vivo
    product split appears to be set by enzyme level and diamine supply.
  boundary: >-
    Genetics shows both products depend on VC_1624, and overexpression shifts the
    pool toward spermidine, but no in vitro kinetics of VC_1624 are reported.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Determines whether norspermidine dominance in Vibrio reflects enzyme specificity or precursor supply.
  resolution: Steady-state kinetics of purified VC_1624 with both diamines and NADPH.
  provenance:
  - reference_id: PMID:19196710
    supporting_text: These data suggest that when the CANSDH enzyme is in excess, it increasingly uses putrescine as a substrate
suggested_questions:
- question: Does V. cholerae CANSDH discriminate kinetically between 1,3-diaminopropane and putrescine, or does diamine supply alone set the norspermidine/spermidine ratio?
suggested_experiments:
- description: Purify VC_1624 and determine kcat/Km for 1,3-diaminopropane and putrescine with L-aspartate 4-semialdehyde and NADPH; confirm products by LC-MS.
