suggested_questions:
- question: Does AatX transport tryptophan directly, and is the transport Na+-coupled? What are its affinity and substrate range (Phe, Tyr, indole, other hydrophobic amino acids)?
- question: Which gene is trpT, and how do AatX and TrpT divide tryptophan uptake between low- and high-tryptophan conditions?
suggested_experiments:
- description: Measure [14C]- or [3H]-L-tryptophan uptake in a V. cholerae ΔtrpT ΔaatX background complemented with aatX, with and without Na+, and test competition by Phe, Tyr and other hydrophobic amino acids.
  experiment_type: radiolabelled substrate uptake
- description: Confirm TrpR binding to the predicted operator upstream of aatX by EMSA or DNase I footprinting.
  experiment_type: protein-DNA binding
