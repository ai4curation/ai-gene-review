- term:
    id: GO:0015196
    label: L-tryptophan transmembrane transporter activity
  evidence_type: IGI
  original_reference_id: PMID:36130487
  review:
    summary: >-
      AatX is a TrpR-regulated NSS transporter whose deletion, together with trpT, reduces
      tryptophan consumption by V. cholerae; it is the second tryptophan transporter of this
      organism.
    action: NEW
    reason: >-
      Three lines of evidence support tryptophan as a substrate. (1) Regulation: aatX is
      repressed by TrpR (PMID:36130487), and a near-consensus TrpR operator lies upstream of
      the gene (bioinformatics RESULTS.md). (2) Genetics: deleting aatX together with trpT
      reduced tryptophan depletion from the culture medium by a hapR mutant, while neither
      single deletion did, which points to redundant uptake (IGI). (3) Family: NSS members
      TnaT and MhsT transport or bind tryptophan with Na+ (PMID:12569103, PMID:25282149),
      though at only 35-41% identity. No direct uptake assay with labelled tryptophan, and
      no test of other aromatic amino acids, has been reported. The name "aromatic amino acid
      transporter X" anticipates a broader range that has not been tested. The term is
      therefore well supported but rests on indirect experimental evidence.
    supported_by:
    - reference_id: PMID:36130487
      supporting_text: >-
        We noted that VC2283, which was significantly repressed by HapR, was predicted to be
        a TrpR-regulated tryptophan transporter in the RegPrecise database
    - reference_id: PMID:36130487
      supporting_text: >-
        Although deletion of trpT or aatX singly did not significantly increase extracellular
        tryptophan concentrations in ΔhapR supernatants, the ΔhapRΔtrpTΔaatX and ΔhapRΔtyrR
        mutants consumed significantly less tryptophan than the ΔhapR mutant.
    - reference_id: file:VIBCH/VC_1669/VC_1669-bioinformatics/RESULTS.md
      supporting_text: >-
        VC2283 is the only gene outside the trp operon with a near-consensus TrpR
        operator.
    - reference_id: PMID:12569103
      supporting_text: >-
        Expression of the tnaT gene product in Escherichia coli conferred the ability to
        accumulate tryptophan from the medium
- term:
    id: GO:1904556
    label: L-tryptophan transmembrane transport
  evidence_type: IGI
  original_reference_id: PMID:36130487
  review:
    summary: AatX acts redundantly with TrpT in uptake of tryptophan from the medium.
    action: NEW
    reason: >-
      The aatX trpT double deletion lowers tryptophan consumption from LB supernatants,
      and the authors interpret both genes as tryptophan uptake genes. The process term
      describes what the transporter activity achieves, so it passes the participation test.
      GO:1904556 is used instead of the parent GO:0015827 tryptophan transport because the
      uptake is across the cytoplasmic membrane.
    supported_by:
    - reference_id: PMID:36130487
      supporting_text: >-
        Deletion of the V. cholerae tryptophan uptake genes or tyrR in the ΔhapR mutant
        background also rescued these phenotypes
    - reference_id: PMID:36130487
      supporting_text: >-
        Although deletion of trpT or aatX singly did not significantly increase extracellular
        tryptophan concentrations in ΔhapR supernatants, the ΔhapRΔtrpTΔaatX and ΔhapRΔtyrR
        mutants consumed significantly less tryptophan than the ΔhapR mutant.
