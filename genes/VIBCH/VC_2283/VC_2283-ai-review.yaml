- id: PMID:36130487
  title: Vibrio cholerae high cell density quorum sensing activates the host intestinal innate immune response.
  findings:
  - statement: VC2283 was named aatX on the basis of a RegPrecise TrpR-regulon prediction.
    supporting_text: We named this gene aatX (aromatic amino acid transporter X).
  - statement: aatX is repressed by HapR and by TrpR.
    supporting_text: >-
      aatX demonstrated increased transcription in a ΔhapR mutant, and transcription was
      repressed by provision of hapR in trans
  - statement: TrpR represses aatX but not trpT.
    supporting_text: aatX was also repressed by TrpR, whereas deletion of trpR had little effect on expression of TrpT
  - statement: Only the aatX trpT double deletion reduces tryptophan consumption, so the two transporters are redundant.
    supporting_text: >-
      Although deletion of trpT or aatX singly did not significantly increase extracellular
      tryptophan concentrations in ΔhapR supernatants, the ΔhapRΔtrpTΔaatX and ΔhapRΔtyrR
      mutants consumed significantly less tryptophan than the ΔhapR mutant.
  - statement: Loss of aatX and trpT reduces the virulence of a hapR mutant in Drosophila.
    supporting_text: >-
      Deletion of aatX alone had a small effect on virulence, whereas deletion of trpT and
      aatX significantly decreased the virulence of a ΔhapR mutant
- id: PMID:12569103
  title: Characterization of a functional bacterial homologue of sodium-dependent neurotransmitter transporters.
  findings:
  - statement: TnaT, an NSS-family protein of Symbiobacterium thermophilum, is a Na+-dependent, tryptophan-selective transporter.
    supporting_text: Transport was Na(+)-dependent and highly selective.
- id: PMID:25282149
  title: A mechanism for intracellular release of Na+ by neurotransmitter/sodium symporters.
  findings:
  - statement: The NSS transporter MhsT was crystallized with Na+ and L-tryptophan bound.
    supporting_text: >-
      we present two crystal structures of MhsT, an NSS member from Bacillus halodurans, in
      occluded inward-facing states with bound Na+ ions and L-tryptophan
- id: file:VIBCH/VC_1669/VC_1669-bioinformatics/RESULTS.md
  title: >-
    Paralog comparison of VC_2283 (AatX) and VC_1669: pairwise identity to characterized NSS
    transporters, TrpR operator scan, and genomic neighbourhood
  findings:
  - statement: VC2283 has a near-consensus TrpR operator upstream; VC1669 does not.
    supporting_text: >-
      VC2283 is the only gene outside the trp operon with a near-consensus TrpR
      operator.
  - statement: The two paralogs are 55.5% identical and equally distant from characterized NSS transporters.
    supporting_text: >-
      The two paralogs are 55.5% identical to each other and equally distant (32-48%) from
      every characterized bacterial NSS.
