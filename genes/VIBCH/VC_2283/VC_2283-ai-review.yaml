description: >-
  AatX (aromatic amino acid transporter X; VC2283) is a 451-residue inner-membrane protein
  of the neurotransmitter:sodium symporter (NSS/SNF, PF00209) family, in the prokaryotic
  YocR/YhdH-like subgroup. Jugder et al. (2022) named the gene aatX after noting that
  RegPrecise predicted it to be a TrpR-regulated tryptophan transporter. They showed that
  its transcription is repressed by both TrpR and the quorum-sensing regulator HapR.
  Deleting aatX alone did not change tryptophan depletion from the medium by a hapR
  mutant, but deleting it together with the predicted tryptophan permease gene trpT did,
  so the two genes act redundantly in tryptophan uptake. A near-consensus TrpR operator
  (TGTACTAGTTAACTAGTGTG, 3 mismatches to the E. coli trp operator) lies upstream of
  VC2283; apart from the trp operon it is the only such site in the genome. Direct
  transport by AatX, its Na+ coupling and its substrate range have not been measured.
  Na+-coupled tryptophan symport is inferred from the family: TnaT is a Na+-dependent,
  tryptophan-selective NSS transporter, and MhsT is an NSS transporter crystallized with
  Na+ and L-tryptophan. Both are only 35-41% identical to AatX. The paralog VC_1669 (55.5%
  identical) lacks the TrpR site and has no tryptophan data.
