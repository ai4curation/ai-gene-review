description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for V. cholerae
  NZ_NMTP01000136.1_1 is "Sodium-dependent tryptophan symporter AatX mediating
  tryptophan uptake across the inner membrane." (tier A). It has three GO terms:
  GO:0005886 plasma membrane, GO:0015196 L-tryptophan transmembrane transporter activity
  and GO:0015827 tryptophan transport. The dashboard sequence is identical to N16961
  VC_2283 (Q9KPS9) over all 451 residues and has one extra N-terminal residue (452 aa),
  so the call is scored on Q9KPS9. The call is supported. VC2283 is the gene that
  Jugder et al. (PMID:36130487) named aatX. It is TrpR- and HapR-repressed, and deleting
  it together with trpT reduces tryptophan consumption. A near-consensus TrpR operator
  upstream of VC2283, the only such site outside the trp operon, independently supports
  the tryptophan assignment. All three terms are correct and novel, since GOA holds only
  GO:0016020 membrane. The call overstates the evidence in two ways. "Sodium-dependent
  symporter" is a family inference: Na+ coupling has not been measured for AatX. And the
  substrate evidence is genetic and regulatory, not a direct uptake assay.
