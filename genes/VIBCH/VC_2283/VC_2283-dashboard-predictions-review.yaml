predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0015196
    label: L-tryptophan transmembrane transporter activity
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct. VC2283 is aatX, which PMID:36130487 identifies as a
      TrpR-regulated tryptophan transporter. Deleting it together with trpT lowers
      tryptophan consumption by a hapR mutant, though neither single deletion does. The
      TrpR operator upstream of VC2283 supports tryptophan as the physiological substrate.
      The evidence is indirect: no labelled-substrate uptake or substrate-range assay has
      been reported, and the name "aromatic amino acid transporter" leaves other aromatic
      substrates open. GOA has no function annotation for Q9KPS9, so the term is novel.
    supported_by:
    - reference_id: PMID:36130487
      supporting_text: >-
        Although deletion of trpT or aatX singly did not significantly increase extracellular
        tryptophan concentrations in ΔhapR supernatants, the ΔhapRΔtrpTΔaatX and ΔhapRΔtyrR
        mutants consumed significantly less tryptophan than the ΔhapR mutant.
    - reference_id: file:VIBCH/VC_1669/VC_1669-bioinformatics/RESULTS.md
      supporting_text: >-
        VC2283 is the only gene outside the trp operon with a near-consensus TrpR
        operator.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0015827
    label: tryptophan transport
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct. The aatX trpT double mutant takes up less tryptophan from
      the medium (PMID:36130487), and AatX does this work as a transporter, so it passes the
      participation test. The companion review uses the more specific GO:1904556 L-tryptophan
      transmembrane transport. That term is not in GOA, so the predicted parent is COR, not
      LSP. GOA has no process annotation for Q9KPS9.
    supported_by:
    - reference_id: PMID:36130487
      supporting_text: >-
        Although deletion of trpT or aatX singly did not significantly increase extracellular
        tryptophan concentrations in ΔhapR supernatants, the ΔhapRΔtrpTΔaatX and ΔhapRΔtyrR
        mutants consumed significantly less tryptophan than the ΔhapR mutant.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005886
    label: plasma membrane
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct. DeepTMHMM predicts 11 alpha-helical TM segments in the
      inner membrane for the dashboard sequence, which is identical to Q9KPS9. Uptake of
      tryptophan from the medium needs a transporter in the cytoplasmic membrane. GOA has
      only the broader GO:0016020 membrane (IEA), so plasma membrane is more specific and
      novel.
    supported_by:
    - reference_id: file:VIBCH/VC_2283/VC_2283-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: 'DeepTMHMM: Inner membrane (α-helical TM)'
