predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0015891
    label: siderophore transport
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct by ortholog inference. VC1548 is TtpB2, the first gene of
      the V. cholerae tonB2 operon. In V. vulnificus, deleting ttpB2 together with tonB1
      abolishes uptake of endogenous and exogenous siderophores, including vibriobactin
      and enterobactin, just as deleting tonB2 does (PMID:31595707). In V. cholerae itself
      the TonB2 system is required for enterobactin utilization (PMID:11169119), but
      VC1548 has not been mutated there. This is a transfer from a 55%-identical ortholog
      in the same genus with conserved operon context, not an observation on the target.
      The term describes participation in the process, not transporter activity. GOA has
      no annotations for H9L4R2, so the term is novel. The more specific GO:0033214
      siderophore-iron import into cell is not an is_a descendant of this term, so LSP
      does not apply.
    supported_by:
    - reference_id: PMID:31595707
      supporting_text: >-
        Both TtpB2 and TtpD2 are absolutely required for the function of the TonB2
        system in V. vulnificus.
    - reference_id: PMID:11169119
      supporting_text: >-
        TonB2 is required for
        utilization of enterobactin by V. cholerae.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0006826
    label: iron ion transport
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct but broad. The TonB2 system, which needs TtpB2 in the
      V. vulnificus ortholog (PMID:31595707), imports ferric iron as siderophore
      complexes, and GO:0033214 siderophore-iron import into cell is an is_a descendant
      of iron ion transport. The same caveat applies as for siderophore transport: the
      inference comes from the ortholog, and VC1548 has not been tested in V. cholerae.
      GOA has no annotations for H9L4R2, so the term is novel. LSP does not apply,
      because no curated annotation is more specific. The companion review annotates the
      more informative GO:0033214.
    supported_by:
    - reference_id: PMID:31595707
      supporting_text: >-
        Both TtpB2 and TtpD2 are absolutely required for the function of the TonB2
        system in V. vulnificus.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0009279
    label: cell outer membrane
  predicted_term_type: GO_CC
  review:
    assessment: NPI
    confidence_score: 0
    error_type: DOMAIN_ARCHITECTURE_MISMATCH
    summary: >-
      The prediction is not supported and conflicts with the sequence evidence. DeepTMHMM
      on the exact sequence predicts a cleavable signal peptide (1-18), no alpha-helical
      or beta-barrel membrane segment, and a soluble exported mature protein. The
      sequence has no lipobox, and its only cysteine (C4) lies in the signal peptide, so
      it cannot be an outer-membrane lipoprotein. An outer-membrane location would need a
      beta-barrel or lipid anchor, and the protein has neither. The GO extractor inferred
      the term from "exported" plus "TonB2", reasoning that the TonB system acts at the
      outer membrane. In fact the TonB, ExbB, ExbD and TtpC components sit in the
      cytoplasmic membrane and contact outer-membrane receptors across the periplasm. The
      call text itself says only "exported", which is correct. The supported location is
      periplasmic space (GO:0042597), from the sequence model; it has not been tested
      experimentally. The term is absent from GOA.
    supported_by:
    - reference_id: file:VIBCH/VC_1548/VC_1548-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: >-
        Because it is an 'exported' protein supporting 'uptake' and associated with TonB2 (a
        system known to operate at the outer membrane), I will assign 'cell outer membrane'
        (CC).
    - reference_id: file:VIBCH/VC_1548/VC_1548-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: >-
        It is not an integral membrane protein and not a beta-barrel.
