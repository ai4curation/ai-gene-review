description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for V. cholerae
  NZ_KQ257329.1_600 is "Putative exported TonB2-associated accessory protein supporting
  ferric siderophore uptake" (tier A). It comes with three GO terms: GO:0015891
  siderophore transport, GO:0006826 iron ion transport and GO:0009279 cell outer
  membrane. The dashboard sequence is 100% identical over all 252 residues to the N16961
  reference-proteome entry H9L4R2 (VC_1548), so the call is scored directly on H9L4R2.
  The call is supported. VC1548 is TtpB2, the DUF3450 first gene of the
  ttpB2-ttpC2-exbB2-exbD2-tonB2-ttpD2 operon. It is not TtpC, which is the neighbouring
  ExbB/TolQ-like membrane protein VC1547. The V. vulnificus ortholog, at 55% identity,
  is essential for TonB2-dependent uptake of endogenous and exogenous siderophores
  (PMID:31595707). The call correctly reads the topology (signal peptide, no membrane
  segment) as an exported soluble protein, and correctly declines to transfer siderophore
  specificities, given that TtpB2 is species-specific in complementation. The two process
  terms are correct by ortholog inference and are new, since GOA has no annotations for
  H9L4R2. The outer-membrane term is wrong. The GO extractor inferred it from "exported"
  plus "TonB2", but the protein has no beta-barrel strands and no lipobox, so it has no
  means of outer-membrane insertion or anchoring. It is predicted to be periplasmic. The
  call itself does not name a compartment beyond "exported". Its evidence text names the
  V. vulnificus homolog TtpB2 but does not identify the query as the V. cholerae TtpB2.
