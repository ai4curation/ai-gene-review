taxon:
  id: NCBITaxon:243277
  label: Vibrio cholerae O1 biovar El Tor str. N16961
description: >-
  VC_1548 (VC1548) encodes TtpB2, a 252-residue DUF3450 (PF11932, PIRSF028069/UCP028069)
  protein. It is the first gene of the Vibrio tonB2 operon
  (ttpB2-ttpC2-exbB2-exbD2-tonB2-ttpD2; in N16961 VC1548-VC1543). Barnes et al.
  (PMID:31595707) named the gene and list the V. cholerae El Tor TtpB2 as NP_231188. It
  is not TtpC: TtpC is the neighbouring VC1547, a protein whose ExbB/TolQ-like homology is
  confined to a C-terminal three-TM membrane domain, previously annotated as tolR
  (PMID:17189363, PMID:15557661). TtpB2 has a cleavable N-terminal signal peptide
  (residues 1-18) and no transmembrane helix, beta-barrel strand or lipobox, so the
  mature protein is predicted to be soluble in the periplasm. A conserved N-terminal
  coiled-coil/leucine-zipper region suggests that it acts through protein-protein
  interactions. In V. vulnificus, TtpB2 (55% identical) is absolutely required for TonB2
  function: Delta-tonB1 Delta-ttpB2 strains cannot use endogenous (vulnibactin,
  hydroxamate) or exogenous (vibriobactin, vibrioferrin, ferrioxamine, enterobactin,
  aerobactin) siderophores, and ttpB2 is induced under iron limitation. The V. cholerae
  TtpB2 did not complement the V. vulnificus mutant, so the protein seems specific to its
  own TonB2 system. In V. cholerae the TonB2 system is required for enterobactin
  utilization (PMID:11169119), and TtpC2 (VC1547) is required for it (PMID:17189363), but
  VC1548 itself has not been mutated in V. cholerae. Its role in TonB2-dependent uptake
  of ferric siderophores in V. cholerae is therefore inferred from the V. vulnificus
  ortholog and from operon context. Its molecular activity is unknown. GOA holds no
  annotations for H9L4R2. The KBase dashboard protein NZ_KQ257329.1_600 is identical to
  it (252/252).
existing_annotations:
- term:
    id: GO:0033214
    label: siderophore-iron import into cell
  evidence_type: ISS
  original_reference_id: PMID:31595707
  review:
    summary: >-
      New annotation. The V. vulnificus ortholog TtpB2 (55% identical; V. cholerae TtpB2,
      NP_231188, is in the paper's comparison set) is essential for TonB2-dependent uptake
      of endogenous and exogenous ferric siderophores, and VC1548 is the first gene of the
      orthologous V. cholerae tonB2 operon. TonB systems energize the import of
      iron-siderophore complexes across the outer membrane.
    action: NEW
    reason: >-
      The process is transferred from a mutant phenotype in an ortholog in another Vibrio
      species, with conserved operon context. The process role is well grounded, but
      VC1548 has not been tested in V. cholerae. The V. cholerae protein does not
      complement the V. vulnificus ttpB2 mutant, which shows species specificity of
      partner interactions, not a different function. ISS is the right code. The term
      describes participation in the process, not a transporter activity.
    supported_by:
    - reference_id: PMID:31595707
      supporting_text: >-
        All six protein components of the TonB2 system-TonB2, ExbB2,
        ExbD2, TtpB2, TtpC2, and TtpD2-are essential for the uptake of both endogenously
        produced iron-bound siderophores and exogenous siderophores produced from other
        organisms.
    - reference_id: PMID:31595707
      supporting_text: >-
        The gene ttpB2 is located immediately upstream of ttpC2 and is the first gene in
        the tonB2 operon.
    - reference_id: PMID:11169119
      supporting_text: >-
        TonB2 is required for
        utilization of enterobactin by V. cholerae.
    - reference_id: file:VIBCH/VC_1548/VC_1548-deep-research-claude-code.md
      supporting_text: >-
        NCBI resolves that accession to the VC1548 product (verified by ESummary)
- term:
    id: GO:0015891
    label: siderophore transport
  evidence_type: ISS
  original_reference_id: PMID:31595707
  review:
    summary: >-
      New annotation. In V. vulnificus, TtpB2 is needed for uptake of siderophores
      including vibriobactin (the V. cholerae siderophore) and enterobactin.
    action: NEW
    reason: >-
      This is the same ortholog-based inference as for siderophore-iron import into cell.
      It is kept because siderophore transport is not an ancestor of GO:0033214 in GO,
      and the Vibrio TonB2 systems import the intact ferric-siderophore complexes.
    supported_by:
    - reference_id: PMID:31595707
      supporting_text: >-
        In addition, our CAS assays and bioassays have shown that TtpB2 and TtpB2 are
        essential for the uptake of both endogenous and exogenous siderophores through the
        TonB2 system.
- term:
    id: GO:0042597
    label: periplasmic space
  evidence_type: ISM
  original_reference_id: file:VIBCH/VC_1548/VC_1548-dashboard-prediction-evidence/dashboard_page.txt
  review:
    summary: >-
      New annotation. DeepTMHMM on the exact sequence predicts a cleavable signal peptide
      (residues 1-18) and no membrane-spanning segment of either the alpha-helical or the
      beta-barrel type. UniProt's SignalP feature agrees (SIGNAL 1..18). The sequence has
      no lipobox: its only cysteine is C4, inside the signal peptide. The mature protein
      is therefore a soluble periplasmic protein, not an outer- or inner-membrane protein.
    action: NEW
    reason: >-
      The location is predicted from the sequence and has not been tested experimentally.
      A soluble periplasmic protein that is essential for TonB2 function fits a role in
      contacting the periplasmic parts of TonB2, ExbD2 or TtpC2. It may also be bound to
      that inner-membrane complex at the periplasmic face, which has not been tested.
    supported_by:
    - reference_id: file:VIBCH/VC_1548/VC_1548-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: >-
        the protein has a cleavable signal peptide and NO membrane-spanning segment of
        either kind. The mature protein is therefore SOLUBLE AND EXPORTED -- periplasmic or
        secreted -- rather than membrane-embedded. It is not an integral membrane protein
        and not a beta-barrel.
core_functions:
- description: >-
    TtpB2, a periplasmic DUF3450 accessory protein of the Vibrio TonB2
    energy-transduction system (TtpB2-TtpC2-ExbB2-ExbD2-TonB2-TtpD2). It is required,
    by ortholog inference, for TonB2-dependent import of ferric siderophores across the
    outer membrane. Its molecular activity is unknown. A conserved N-terminal
    coiled-coil/leucine-zipper region suggests that it works through protein-protein
    contacts with other components of the system.
  directly_involved_in:
  - id: GO:0033214
    label: siderophore-iron import into cell
  locations:
  - id: GO:0042597
    label: periplasmic space
  supported_by:
  - reference_id: PMID:31595707
    supporting_text: >-
      Both TtpB2 and TtpD2 are absolutely required for the function of the TonB2
      system in V. vulnificus.
  - reference_id: PMID:31595707
    supporting_text: >-
      TtpB2 contains a leucine zipper motif (Leu‐X6‐Leu‐X6‐Leu‐X6‐Leu) toward the
      N‐terminus, while TtpD2 contains a number of TPR motifs.
knowledge_gaps:
- gap_statement: >-
    VC1548 has not been deleted in V. cholerae. Its requirement for TonB2-dependent
    uptake of enterobactin and other siderophores in V. cholerae, where TtpC2 has been
    tested, is inferred only from V. vulnificus TtpB2.
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    The molecular activity of TtpB2 is unknown. It is not known which TonB2-system
    proteins it binds, whether it stays soluble in the periplasm or is held at the inner
    membrane, or why TtpB2 from other Vibrio species cannot replace the V. vulnificus
    protein.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    Does an in-frame VC1548 deletion in a tonB1 mutant of V. cholerae N16961 abolish
    enterobactin utilization, as a ttpC2 mutation does?
- question: >-
    Which TonB2-system proteins (TonB2, ExbD2, TtpC2) does TtpB2 contact, and does its
    leucine-zipper region mediate that contact?
suggested_experiments:
- experiment_type: Genetic knockout and siderophore bioassay
  description: >-
    Construct Delta-VC1548 and Delta-tonB1 Delta-VC1548 in N16961. Test growth around
    enterobactin, vibriobactin, ferrichrome and haemin discs, and complement with VC1548
    in trans.
- experiment_type: Localization and interaction mapping
  description: >-
    Use cell fractionation (periplasm, inner and outer membrane) of an epitope-tagged
    VC1548, and in vivo crosslinking or bacterial two-hybrid assays against TonB2, ExbD2
    and TtpC2.
references:
- id: PMID:31595707
  title: Two novel proteins, TtpB2 and TtpD2, are essential for iron transport in the TonB2
    system of Vibrio vulnificus.
  findings:
  - statement: >-
      ttpB2 (DUF3450) is the first gene of the Vibrio tonB2 operon; V. cholerae El Tor
      TtpB2 is listed as NP_231188.
    supporting_text: >-
      The gene ttpB2 is located immediately upstream of ttpC2 and is the first gene in
      the tonB2 operon.
  - statement: TtpB2 is essential for TonB2-dependent siderophore uptake in V. vulnificus.
    supporting_text: >-
      Both TtpB2 and TtpD2 are absolutely required for the function of the TonB2
      system in V. vulnificus.
  - statement: TtpB2 from other Vibrio species, including V. cholerae, does not complement.
    supporting_text: >-
      In contrast, we also demonstrate that TtpB2 must come from
      V. vulnificus, and not other species within the genus, to complement mutations
      in the TonB2 system.
  - statement: TtpB2 carries an N-terminal leucine zipper and a DUF3450 domain.
    supporting_text: >-
      The ttpB2 gene encodes for a hypothetical protein with a large domain of unknown
      function (DUF3450).
- id: PMID:17189363
  title: A novel protein, TtpC, is a required component of the TonB2 complex for specific
    iron transport in the pathogens Vibrio anguillarum and Vibrio cholerae.
  findings:
  - statement: >-
      TtpC (VC1547 in V. cholerae, distinct from VC1548) is a protein whose
      ExbB/TolQ-like homology is confined to a C-terminal three-TM region; V. cholerae
      TtpC is needed for TonB2-mediated enterobactin transport.
    supporting_text: >-
      The taxonomic issue is complicated even further because the homology of this open
      reading frame to Exb-related proteins is confined to just the carboxy-terminal
      region that inserts in the membrane, with three transmembrane segments.
- id: PMID:15557661
  title: Two tonB systems function in iron transport in Vibrio anguillarum, but only one
    is essential for virulence.
  findings:
  - statement: The V. anguillarum TtpC ortholog corresponds to V. cholerae ORF 1547 (tolR).
    supporting_text: >-
      showing that it occurred at bp 935 of an open reading frame homologous (66%
      identity) to open reading frame 1547 ( tolR ) of the V.
- id: PMID:11169119
  title: 'The two TonB systems of Vibrio cholerae: redundant and specific functions.'
  findings:
  - statement: In V. cholerae, TonB2 is specifically required for enterobactin utilization.
    supporting_text: >-
      TonB1 specifically mediates
      utilization of the siderophore schizokinen, whereas TonB2 is required for
      utilization of enterobactin by V. cholerae.
- id: PMID:20860484
  title: The TonB energy transduction systems in Vibrio species.
  findings:
  - statement: Review; TtpC is an ExbB-like three-TM inner-membrane protein, a distinct component from TtpB2.
    supporting_text: >-
      TtpC is predicted to span the membrane three times with a carboxy-terminal
      distribution of TM domains highly similar to the ExbB proteins
- id: PMID:25148374
  title: Regulation of the expression of the Vibrio parahaemolyticus peuA gene encoding
    an alternative ferric enterobactin receptor.
  findings:
  - statement: >-
      In V. parahaemolyticus the ttpC2-tonB2 genes (VPA0151-0156) are co-transcribed with
      peuA under iron limitation.
    supporting_text: >-
      Our data showed that peuA is transcribed in a polycistronic mRNA with the
      VPA0151–VPA0156 genes under iron-limiting conditions
