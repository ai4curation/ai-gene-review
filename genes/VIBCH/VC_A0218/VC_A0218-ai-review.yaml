existing_annotations:
- term:
    id: GO:0006629
    label: lipid metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR008265
  review:
    summary: >-
      Correct, but less specific than the evidence supports; the direction of the chemistry
      is known, so the catabolic descendant should be used.
    action: MODIFY
    reason: >-
      The InterPro GDSL active-site mapping to lipid metabolism is right for this protein,
      and unlike the EstA case there is no doubt that a lipid is the substrate: the
      V. cholerae enzyme hydrolyses egg-yolk phospholipid, both as a diffusible activity
      around colonies and as a single band of phospholipase activity in an egg-yolk agarose
      overlay, and an in-frame deletion abolishes it. Its 63%-identical orthologue degrades
      phosphatidylcholine through lysophosphatidylcholine to glycerophosphorylcholine. The
      substrate is a glycerophospholipid and the reaction is hydrolysis, so GO:0046475
      glycerophospholipid catabolic process, an is_a descendant of this term, states what is
      established; the parent leaves the direction of the chemistry open, which matters here
      precisely because a lipid biosynthetic term is also annotated to this gene.
    proposed_replacement_terms:
    - id: GO:0046475
      label: glycerophospholipid catabolic process
    supported_by:
    - reference_id: PMID:9234762
      supporting_text: Polyacrylamide gel electrophoresis combined with an egg yolk agarose
        overlay demonstrated phospholipase activity migrating at a relative molecular weight
        of 45,000 in preparations of V. cholerae and the Escherichia coli clone.
    - reference_id: PMID:1791426
      supporting_text: it hydrolysed phosphatidylcholine (PC) to lysophosphatidylcholine
        (LPC) and then LPC to glycerophosphorylcholine (GPC)
- term:
    id: GO:0008610
    label: lipid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN005219546
  - UniProtKB:O33407
  review:
    summary: >-
      Sole-seeded IBD projected onto a leaf whose own chemistry is known and is the opposite:
      this protein is a characterised phospholipase, and no member of the bacterial side of
      the clade has any evidence for a biosynthetic step.
    action: REMOVE
    reason: >-
      Taking the phylogenetic reading seriously rather than counting donors: the IBD at
      PTN005219546 was placed at a node whose only experimental seed is P. aeruginosa EstA
      (the row's WITH/FROM is the node plus UniProtKB:O33407), and EstA's own support is a
      rhamnolipid-deficient deletion phenotype of unknown mechanism, argued in
      genes/PSEAE/estA. The question for this leaf is therefore whether it is inside a clade
      that inherited a lipid biosynthetic role, and the answer is available in data rather
      than in names. This protein hydrolyses glycerophospholipid: PMID:9234762 shows the
      activity for this exact sequence, and the gene-specific identification is not an
      inference from similarity (AAA92960.1 differs from Q9KMV0 at two of 418 residues).
      Every experimentally characterised bacterial member of the clade is likewise a
      phospholipase: V. parahaemolyticus LDH (PC to LPC to GPC), V. alginolyticus TLH and
      Vibrio sp. Vhe1 (purified, both activities in one polypeptide), P. damselae PPP
      (secreted activity lost in a knockout). Hydrolysis of a lipid is lipid catabolism, and
      no step of any lipid biosynthetic pathway has been attributed to any of them. The one
      element of the record pointing away from hydrolysis, the CDD hit cd01846
      fatty_acyltransferase_like, names a clade containing Aeromonas GCAT, which is 29.1%
      identical to this protein, no closer than ChoE or EstA, so it supplies no
      protein-specific support. EstA is 26.4% identical and carries an autotransporter
      barrel this protein lacks. The node annotation, not this row's reasoning, is the
      defect, and it is already reported upstream from the estA review; here the row simply
      asserts something the gene's own evidence contradicts in direction.
    propagation_review:
      root_cause: SOURCE_BAD
      failure_modes:
      - ROLE_CONFLATION
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN005219546
        source_label: PTN005219546
        source_status: SOURCE_BAD
        comment: >-
          Sole seed is P. aeruginosa EstA's own IMP rows (GO:0008610 UniProt, GO:0009247
          PseudoCAP, both PMID:17631636), a rhamnolipid-deficient deletion phenotype of
          unknown mechanism rather than a demonstrated biosynthetic step. This leaf is the
          test case the estA review wanted: the bacterial side of the clade is not merely
          uncharacterised, it is characterised, and characterised as hydrolytic.
      - source_id: UniProtKB:O33407
        source_label: estA
        source_status: SOURCE_BAD
        comment: >-
          Surface-exposed outer-membrane carboxylesterase with negligible activity on
          acyl-CoA; 26.4% identical to Q9KMV0 and architecturally different (646 aa with a
          C-terminal autotransporter beta-barrel). See genes/PSEAE/estA for the seed-level
          argument and the node source defect.
    supported_by:
    - reference_id: PMID:9234762
      supporting_text: with enzyme production visualized as a zone of clearing around colonies
