- id: file:VIBCH/VC_A0218/VC_A0218-uniprot.txt
  title: UniProt entry Q9KMV0 (Q9KMV0_VIBCH), TrEMBL, entry version 103
  findings:
  - statement: The record carries the GDSL serine active-site signature.
    record_section: ["DR:PROSITE"]
    supporting_text: PROSITE; PS01098; LIPASE_GDSL_SER
  - statement: An N-terminal signal peptide is predicted by SignalP.
    record_section: ["FT:SIGNAL"]
    supporting_text: SIGNAL          1..19
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The entry is accurate as far as it goes but is a bare automatic record: no CC FUNCTION,
      protein existence level 4 (Predicted), and the genome paper as its only reference. Its
      protein name "Thermolabile hemolysin" is a SubName carrying only
      ECO:0000313|EMBL:AAF96130.1, i.e. imported unchecked from the submitter rather than
      curated - so the name is not evidence for anything, and is not cited as such anywhere
      in this review. It nevertheless turns out to be correct, which is why this review's
      verdict on the name differs from what the ECO:0000313 provenance alone would suggest.
    source_defects:
    - defect_type: MISSING_STATEMENT
      resource: UNIPROT
      record: UniProtKB:Q9KMV0
      slot: CC:FUNCTION
      requested_change: ADD
      asserted_value: UniProtKB:Q9KMV0
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        Q9KMV0 has no FUNCTION comment and no literature references beyond the N16961 genome
        paper, yet the protein has been experimentally characterised twice. It is the
        V. cholerae lecithinase Lec of PMID:9234762 (GenBank U50074 / AAA92960.1, strain
        E7946): the two sequences align over the full 418 residues with two mismatches
