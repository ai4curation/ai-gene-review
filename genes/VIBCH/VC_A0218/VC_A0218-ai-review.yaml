id: Q9KMV0
gene_symbol: VC_A0218
aliases:
- VCA0218
- tlh
- lec
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:243277
  label: Vibrio cholerae O1 biovar El Tor str. N16961
description: >-
  VC_A0218 (VCA0218) encodes the secreted phospholipase of Vibrio cholerae, a 418-residue
  SGNH/GDSL-fold hydrolase with an N-terminal signal peptide and the GDSL catalytic serine
  at Ser155. It has been characterised twice under two names. As the lecithinase Lec it was
  cloned from El Tor strain E7946 and shown to hydrolyse egg-yolk phospholipid, producing a
  zone of clearing around intact colonies and a single band of phospholipase activity in an
  egg-yolk agarose overlay; an in-frame deletion abolished that activity. As the
  thermolabile haemolysin Tlh it is the haemolysin responsible for lysis of human type O
  erythrocytes by flagellar regulatory mutants, whose haemolysis is lost when tlh is
  deleted. The gene lies immediately next to, and is transcribed divergently from, the El
  Tor haemolysin gene hlyA (VCA0219), and both are repressed by the flagellar regulatory
  hierarchy. The protein is a full-length orthologue (63% identity over 418 residues) of the
  Vibrio parahaemolyticus thermolabile haemolysin, an atypical phospholipase
  A2/lysophospholipase whose haemolytic action comes from the lysophosphatidylcholine it
  transiently accumulates; the positional specificity of the V. cholerae enzyme itself has
  not been determined. Loss of the gene leaves intestinal colonisation essentially intact in
  rabbit ileal loops and infant mice, so the selective role of the enzyme, and its
  physiological substrate, remain unknown.
references:
- id: PMID:9234762
  title: Cloning, characterization, and chromosomal mapping of a phospholipase (lecithinase)
    produced by Vibrio cholerae.
  full_text_unavailable: true
  findings:
  - statement: The V. cholerae lecithinase gene lec encodes a 418-residue protein of
      predicted MW 47,600, matching Q9KMV0 (418 aa, 47,703 MW).
    supporting_text: Sequence analysis revealed a 1,254-bp open reading frame (lec) encoding
      a 418-amino-acid protein with a predicted molecular weight of 47,600.
  - statement: Phospholipase activity of the gene product was demonstrated directly, in both
      V. cholerae and an E. coli clone, by in-gel egg-yolk agarose overlay.
    supporting_text: Polyacrylamide gel electrophoresis combined with an egg yolk agarose
      overlay demonstrated phospholipase activity migrating at a relative molecular weight
      of 45,000 in preparations of V. cholerae and the Escherichia coli clone.
  - statement: The activity is secreted or otherwise extracellular, diffusing from intact
      colonies.
    supporting_text: with enzyme production visualized as a zone of clearing around colonies
      plated on egg yolk agar
  - statement: An in-frame deletion of lec abolished lecithinase activity but did not reduce
      the ileal loop response, so the enzyme is not a dominant enterotoxic factor.
    supporting_text: The resulting mutant lacked lecithinase activity on egg yolk agar but
      had undiminished reactivity in rabbit ligated ileal loop assays.
  - statement: lec lies adjacent to hlyA and hlyC on the chromosome, the arrangement that
      identifies it as VCA0218 in the N16961 numbering (hlyA = VCA0219).
    supporting_text: revealed that lec, hlyA (hemolysin), and hlyC (lipase) are adjacent on
      the V. cholerae chromosome
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Establishes the enzymology of this exact protein: the GenBank entry
      for this work (U50074, protein AAA92960.1, strain E7946) aligns to Q9KMV0 over the
      full 418 residues with two mismatches (99.5% identity), and the reported gene
      neighbourhood (next to hlyA) matches VCA0218/VCA0219 in N16961. Only the abstract is
      cached, so the phospholipase positional class is not recoverable here and has not been
      assumed.
- id: PMID:19717600
  title: The Vibrio cholerae flagellar regulatory hierarchy controls expression of virulence
    factors.
  findings:
  - statement: VCA0218 is V. cholerae's thermolabile haemolysin Tlh, with phospholipase and
      lecithinase activity.
    supporting_text: VCA0218 encodes a thermolabile hemolysin, Tlh, which has phospholipase
      and lecithinase activity
    reference_section_type: RESULTS
  - statement: Deleting tlh abolishes the haemolysis of human erythrocytes shown by a
      flagellar regulatory mutant, identifying Tlh as the responsible haemolysin.
    supporting_text: Importantly, the hemolytic activity of the fliA strain is abrogated when
      tlh is inactivated, demonstrating that the flagellum-regulated hemolysin is the
      thermolabile hemolysin Tlh.
    reference_section_type: RESULTS
  - statement: The target cells are human type O erythrocytes.
    supporting_text: The rpoN , flrA , flrC , and fliA flagellar regulatory mutants also
      demonstrate increased hemolysis of human type O erythrocytes
    reference_section_type: RESULTS
  - statement: The authors constructed the tlh deletion themselves rather than relying on an
      existing strain.
    supporting_text: Splicing-by-overlap-extension (SOE) PCR ( 26 ) was used to generate the
      deletion mutations in tlh , cdgD , and frhC
    reference_section_type: METHODS
  - statement: tlh transcription is repressed by the flagellar regulatory hierarchy.
    supporting_text: we can conclude that the flagellar regulatory hierarchy represses the
      transcription of tlh
    reference_section_type: RESULTS
  - statement: tlh is adjacent to and divergently transcribed from hlyA, independently
      confirming the identity of VCA0218 with the lec locus of PMID:9234762.
    supporting_text: the tlh gene is adjacent to and divergently transcribed from the hlyA
      gene
    reference_section_type: DISCUSSION
  - statement: Tlh is not a critical intestinal colonisation factor in infant mice.
    supporting_text: This indicates that thermolabile hemolysin does not play a critical role
      in colonization of the intestine, at least in this particular animal model.
    reference_section_type: RESULTS
    finding_review:
      finding_status: CURRENT
      review_notes: >-
        The paper is internally inconsistent about the magnitude: Results report a
        competitive index of 0.67 (P = 0.029), the Discussion says the tlh mutant "colonized
        infant mice similarly to the wild-type strain". The conclusion drawn here (no
        critical role) holds either way and agrees with the undiminished rabbit ileal loop
        response in PMID:9234762.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified, full text cached. This is the only published work that uses the
      locus tag VCA0218 and the name "thermolabile hemolysin" together, and it supplies the
      genetic evidence for haemolytic function. Caveat recorded rather than ignored: the
      experiments were done in classical-biotype strain O395 (chosen because it is
      HlyA-negative) while the locus tags are N16961's, and Q9KMV0 is the N16961 El Tor
      protein. Given 99.5% identity to the E7946 protein assayed in PMID:9234762 these are
      the same gene, but no experiment was performed in N16961 itself.
- id: PMID:1791426
  title: Purification and characterization of a lecithin-dependent haemolysin from
    Escherichia coli transformed by a Vibrio parahaemolyticus gene.
  full_text_unavailable: true
  findings:
  - statement: The V. parahaemolyticus orthologue hydrolyses both acyl esters of
      phosphatidylcholine, via lysophosphatidylcholine, to glycerophosphorylcholine.
    supporting_text: The LDH was a phospholipase hydrolysing both fatty acid esters of
      phospholipid, i.e. it hydrolysed phosphatidylcholine (PC) to lysophosphatidylcholine
      (LPC) and then LPC to glycerophosphorylcholine (GPC).
  - statement: The haemolytic agent is the lysophospholipid intermediate, which accumulates
      because the two hydrolytic steps run at comparable rates; this links the phospholipase
      activity mechanistically to the haemolysis.
    supporting_text: Phospholipase B, however, does not usually show haemolytic activity,
      because the intermediate (LPC), which is the actual haemolytic agent, is immediately
      hydrolysed to the final product (GPC).
  - statement: The enzyme is classified as an atypical phospholipase
      A2/lysophospholipase.
    supporting_text: LDH of V. parahaemolyticus is an atypical phospholipase to be designated
      as phospholipase A2/lysophospholipase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Not about this gene, but about its closest characterised orthologue
      (Q68CM4, 63.2% identity over all 418 residues), and it is the only study in the family
      that resolves positional specificity and explains why a phospholipase is haemolytic.
      Used here for the family-level mechanism only; the A2/lysophospholipase assignment is
      explicitly NOT transferred to the V. cholerae protein, which is why GO:0004620 rather
      than GO:0004623 is proposed.
- id: PMID:20662368
  title: 'Expression, purification, and characterization of thermolabile hemolysin (TLH) from
    Vibrio alginolyticus.'
  full_text_unavailable: true
  findings:
  - statement: Purified recombinant TLH of V. alginolyticus has both phospholipase and
      haemolytic activity, confirming that the two reside in one GDSL protein.
    supporting_text: TLH purified by the nickel-nitrilotriacetic acid (Ni-NTA) His-Bind Resin
      method showed phospholipase activity on an egg yolk emulsion plate and hemolytic
      activity against flounder erythrocytes
  - statement: The protein carries a GDSL lipase domain.
    supporting_text: The sequence analysis also indicated that it contained a GDSL lipase
      domain like VHH
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      PubMed-verified. Corroborating: a purified family member (94% identical to the
      V. parahaemolyticus LDH/TLH by the authors' own figure) with both activities in the one
      polypeptide. Supports the hydrolase reading of the clade; carries no information
      specific to V. cholerae.
- id: PMID:17958612
  title: 'Cloning and characterization of Photobacterium damselae ssp. piscicida
