      responsible for lysis of human erythrocytes, and it performs the lysis itself.
    action: NEW
    reason: >-
      Deleting tlh (VCA0218) abolishes haemolysis of human type O erythrocytes by a flagellar
      regulatory mutant; the authors made the deletion themselves and excluded the other two
      upregulated haemolysin genes on independent grounds (the strain is hlyA-negative, and
      Hlx lyses sheep but not human cells). So this is not merely a necessity phenotype of
      unknown mechanism: the protein does the work of the process. The mechanism is known
      from the 63%-identical orthologue, where the lytic agent is the
      lysophosphatidylcholine the enzyme itself transiently accumulates, and purified family
      members carry haemolytic and phospholipase activity in one polypeptide. Comparator
      check before proposing: of all annotations to this term and its descendants in GOA,
      only two have experimental evidence, V. parahaemolyticus tdh (UniProtKB:O87079, IDA)
      and Salmonella hlyE (UniProtKB:Q8Z727, IMP), so GO does annotate a bacterial haemolysin
