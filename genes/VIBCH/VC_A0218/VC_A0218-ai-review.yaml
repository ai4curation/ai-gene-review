core_functions:
- description: >-
    Secreted glycerophospholipase (lecithinase) of the LDH/TLH family. The SGNH/GDSL domain,
    with its catalytic Ser155, hydrolyses the acyl esters of phosphatidylcholine and related
    glycerophospholipids outside the cell, which both degrades extracellular phospholipid and
    makes the enzyme haemolytic: the lysophospholipid it generates is the agent that lyses
    erythrocyte membranes. It is the haemolysin responsible for lysis of human erythrocytes by
    non-motile V. cholerae, and is repressed by the flagellar regulatory hierarchy.
  molecular_function:
    id: GO:0004620
    label: glycerophospholipase activity
  directly_involved_in:
  - id: GO:0046475
    label: glycerophospholipid catabolic process
  - id: GO:0019836
    label: symbiont-mediated hemolysis of host erythrocyte
  locations:
  - id: GO:0005576
    label: extracellular region
  supported_by:
  - reference_id: PMID:9234762
    supporting_text: Polyacrylamide gel electrophoresis combined with an egg yolk agarose
      overlay demonstrated phospholipase activity migrating at a relative molecular weight of
      45,000 in preparations of V. cholerae and the Escherichia coli clone.
  - reference_id: PMID:19717600
    supporting_text: Importantly, the hemolytic activity of the fliA strain is abrogated when
      tlh is inactivated, demonstrating that the flagellum-regulated hemolysin is the
      thermolabile hemolysin Tlh.
  - reference_id: PMID:1791426
    supporting_text: The LDH was a phospholipase hydrolysing both fatty acid esters of
      phospholipid
  - reference_id: file:VIBCH/VC_A0218/VC_A0218-bioinformatics/RESULTS.md
    supporting_text: The alignment to AAA92960.1 is full length and gap free, with exactly two
      mismatches
  knowledge_gaps:
  - gap_statement: >-
      The positional specificity of the V. cholerae enzyme is undetermined: whether it
      cleaves the sn-1 ester, the sn-2 ester, or both in sequence as its V. parahaemolyticus
      orthologue does, and whether it has the lysophospholipase activity that makes the
      orthologue haemolytic rather than merely lipolytic.
    boundary: >-
      Hydrolysis of egg-yolk glycerophospholipid by this protein is established, as is the
      Ser-His-Asp SGNH machinery, and the orthologue 63% identical to it is an atypical
      phospholipase A2/lysophospholipase that releases lysophosphatidylcholine as an
      intermediate.
    gap_kind:
    - BIOLOGY
    dark_aspect: MF_DARK
    provenance:
    - reference_id: PMID:1791426
      supporting_text: LDH of V. parahaemolyticus is an atypical phospholipase to be
        designated as phospholipase A2/lysophospholipase
knowledge_gaps:
- gap_statement: >-
    The physiological substrate and selective role of this enzyme are unknown. Both
    loss-of-function studies read out as near-normal in the host: the in-frame deletion gave
    an undiminished rabbit ileal loop response and the tlh deletion colonised infant mice
    essentially like wild type. So whatever the enzyme is retained for is not what those
    assays measure, and whether it serves nutrient acquisition from environmental
    phospholipid, membrane remodelling, or anti-eukaryotic defence in the aquatic niche has
    not been tested.
  boundary: >-
    The activity, its extracellular disposition, its responsibility for human erythrocyte
    lysis in non-motile cells, and its repression by the flagellar regulatory hierarchy are
    all established.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  provenance:
  - reference_id: PMID:9234762
    supporting_text: The role of phospholipase in gut colonization or disease pathogenesis is
      unknown.
  - reference_id: PMID:9234762
    supporting_text: The resulting mutant lacked lecithinase activity on egg yolk agar but had
      undiminished reactivity in rabbit ligated ileal loop assays.
  - reference_id: PMID:19717600
    supporting_text: This indicates that thermolabile hemolysin does not play a critical role
      in colonization of the intestine, at least in this particular animal model.
- gap_statement: >-
    How the protein reaches the outside of the cell is unknown. It has a cleaved signal
    peptide and its activity is diffusible, but no study has tested whether it is released by
    the Eps type II secretion system (which exports the V. cholerae lipase), retained at the
    cell surface, or shed in membrane vesicles, and so it is not known whether the enzyme acts
    at the cell surface or at a distance.
  boundary: >-
    SignalP places a cleaved signal peptide at residues 1-19, and lecithinase activity
    diffuses from intact colonies into egg-yolk agar; the P. damselae homologue's activity is
    recoverable from the culture supernatant and is lost in a knockout.
  gap_kind:
  - BIOLOGY
  dark_aspect: CC_DARK
  provenance:
  - reference_id: file:VIBCH/VC_A0218/VC_A0218-uniprot.txt
    supporting_text: SIGNAL          1..19
  - reference_id: PMID:17958612
    supporting_text: The culture supernatant of wild-type P. damselae ssp. piscicida showed
      phospholipase activity, while that of a PPP gene knockout mutant did not.
suggested_questions:
- question: >-
    Does the V. cholerae enzyme share the unusual kinetic balance of its V. parahaemolyticus
    orthologue, where phosphatidylcholine and lysophosphatidylcholine are hydrolysed at
    comparable rates so that the lytic intermediate accumulates? That balance, rather than the
    bare phospholipase activity, is what makes the family haemolytic, and it determines whether
    GO:0004623 and a lysophospholipase term can be asserted for this protein.
  experts:
  - Shigeo Yamamoto
  - Sumio Shinoda
- question: >-
    Is the enzyme secreted by the Eps type II system, like the V. cholerae lipase, or does it
    remain surface-associated? This decides whether a more specific cellular-component term
    than extracellular region can replace the IC inference proposed here.
  experts:
  - Karl E Klose
  - James B Kaper
- question: >-
    Should GO:0008610 lipid biosynthetic process remain on the ~960 leaves of PANTHER
    PTN005219546 when the clade's characterised bacterial members are all phospholipases? This
    review supplies the leaf-level evidence the estA review lacked, and the node annotation is
    the thing to withdraw.
  experts: []
suggested_experiments:
- hypothesis: >-
    VC_A0218 is a phospholipase A2/lysophospholipase like its V. parahaemolyticus orthologue,
    and its haemolytic activity depends on transient accumulation of
    lysophosphatidylcholine.
  description: >-
    Express and purify recombinant Q9KMV0 and assay it on defined substrates rather than egg
    yolk: radiolabelled or fluorogenic phosphatidylcholine with the label at sn-1 versus sn-2
    to assign positional specificity, and 1-acyl-lysophosphatidylcholine to measure the
    lysophospholipase step. Follow both steps in the same reaction by thin-layer
    chromatography or LC-MS and compare their rates. In parallel, titrate purified enzyme
    against washed human erythrocytes and test whether added lysophosphatidylcholine
    phenocopies, and whether a catalytically dead Ser155Ala variant is non-haemolytic.
  experiment_type: enzyme kinetics with defined phospholipid substrates plus haemolysis assay
- hypothesis: >-
    The enzyme is exported by the Eps type II secretion system and acts extracellularly.
  description: >-
    Raise antibodies to the protein, or tag the chromosomal copy, and fractionate V. cholerae
    into cytoplasm, periplasm, membrane, surface-exposed and culture-supernatant pools,
    assaying lecithinase activity and protein in each. Repeat in an eps mutant background to
    test whether export depends on the type II system, and probe surface exposure of intact
    cells by protease accessibility.
  experiment_type: subcellular fractionation and secretion-mutant epistasis
- hypothesis: >-
    The enzyme's selective role is in the aquatic environment rather than the host, which is
    why host-colonisation assays show almost no phenotype.
  description: >-
    Compete a clean VC_A0218 deletion against wild type in conditions the gut assays do not
    model: growth with phosphatidylcholine or lysophospholipid as sole carbon or phosphate
    source, survival and biofilm formation on chitin surfaces, and grazing by a protist such
    as Tetrahymena or Dictyostelium. Measuring the deletion's fitness cost where phospholipid
    is the available nutrient tests the nutrient-acquisition reading directly.
  experiment_type: competitive fitness assays across environmental conditions
