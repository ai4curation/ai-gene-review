  review:
    summary: >-
      This ARBA prediction is based on the HD-GYP domain signature and is contradicted by
      both sequence and experiment. The HD-GYP domain of VC_1087 lacks the HD metal-binding
      dyad (Gln in place of Asp, GLMHQIG) and the GYP motif (GKP). Purified VC_1087 shows no
      c-di-GMP hydrolysis in vitro, and expressing it in V. cholerae does not lower
      c-di-GMP-dependent phenotypes. The S. oneidensis ortholog HnoD is likewise inactive
      even after 48 hours.
    action: REMOVE
    reason: >-
      This is a pseudoenzyme. The catalytic metal-ligand residues are absent, and direct
      assays on the V. cholerae protein found no phosphodiesterase activity.
    supported_by:
    - reference_id: PMID:25343965
      supporting_text: >-
        As we anticipated, VC1087 and VCA0895, which lack the HD dyad characteristic of HD
        metal-dependent phosphohydrolases, showed no evidence of c-di-GMP hydrolytic
        activity in vivo and in vitro.
    - reference_id: PMID:22542454
      supporting_text: >-
        TM0186 completely hydrolyzed c-di-GMP, whereas HnoD displayed no detectable pGpG
        formation, even after 48 hours
    - reference_id: file:VIBCH/VC_1087/VC_1087-bioinformatics/RESULTS.md
      supporting_text: >-
        The HD-GYP domain is degenerate. The Asp of the HD dyad, which coordinates the
        catalytic metals, and the Tyr of the GYP motif are both lost.
