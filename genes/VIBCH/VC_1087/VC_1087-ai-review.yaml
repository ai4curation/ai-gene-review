- id: PMID:22542454
  title: Nitric oxide modulates bacterial biofilm formation through a multicomponent cyclic-di-GMP
    signaling network.
  findings:
  - statement: >-
      V. cholerae hnoB (VC1086) and hnoD (VC1087) form an operon, and V. cholerae HnoK
      (VCA0719) transfers phosphoryl groups rapidly to HnoD.
    supporting_text: >-
      V. cholerae harbors the hnoXK genes (VCA0720/VCA0719) in an isolated operon with hnoB
      (VC1086) and hnoD (VC1087) grouped into a separate operon containing two additional
      HKs.
  - statement: Both V. cholerae kinases HnoK and HnoS phosphorylate HnoD.
    supporting_text: V.c. HnoK and HnoS phosphorylated both V.c. HnoB and HnoD.
  - statement: S. oneidensis HnoD has a degenerate HD-GYP domain and no PDE activity.
    supporting_text: >-
      TM0186 completely hydrolyzed c-di-GMP, whereas HnoD displayed no detectable pGpG
      formation, even after 48 hours
  - statement: >-
      In S. oneidensis, HnoD inhibits HnoB PDE activity in a phosphorylation-dependent
      manner, forming a feed-forward loop.
    supporting_text: >-
      HnoD significantly inhibited the PDE activity of HnoB and this inhibition was
      dependent on the phosphorylation state of HnoD. Phosphorylated HnoD was no longer
      inhibitory
- id: PMID:25343965
  title: A systematic analysis of the in vitro and in vivo functions of the HD-GYP domain
    proteins of Vibrio cholerae.
  findings:
  - statement: VC1087 lacks the HD dyad and has no c-di-GMP hydrolytic activity.
    supporting_text: >-
      As we anticipated, VC1087 and VCA0895, which lack the HD dyad characteristic of HD
      metal-dependent phosphohydrolases, showed no evidence of c-di-GMP hydrolytic activity
      in vivo and in vitro.
  - statement: VC1087 is one of three V. cholerae REC-HD-GYP proteins.
    supporting_text: >-
      Three HD-GYP domain proteins, VC1087, VC1348 and VCA0210, possess a phosphoreceiver
      (REC) domain
  - statement: No single HD-GYP gene deletion affected colonization.
    supporting_text: Furthermore, no single HD-GYP domain gene affected intestinal colonization
- id: PMID:26000450
  title: Vibrio cholerae Response Regulator VxrB Controls Colonization and Regulates the
    Type VI Secretion System.
  findings:
  - statement: Deleting VC1087 slightly enhanced infant-mouse colonization.
    supporting_text: >-
      ΔVC1050, ΔVC1086, and ΔVC1087 showed enhanced colonization
- id: PMID:30420597
  title: Vibrio cholerae motility exerts drag force to impede attack by the bacterial predator
    Bdellovibrio bacteriovorus.
  findings:
  - statement: VC1087 mutants are more resistant to Bdellovibrio predation.
    supporting_text: >-
      Similarly, mutants of the response regulator VC1087 were more resistant to predation
- id: PMID:23131828
  title: Glucose-specific enzyme IIA has unique binding partners in the vibrio cholerae biofilm.
  findings:
  - statement: VC1087 co-purified with EIIAGlc in biofilm cells (TAP-MS).
    supporting_text: >-
      Proteins copurifying with EIIAGlc in the biofilm alone included the putative response
      regulator VC1087
- id: PMID:30060647
  title: Discovery of a Nitric Oxide Responsive Quorum Sensing Circuit in Vibrio cholerae.
  findings:
  - statement: >-
      NO-bound H-NOX reduces HnoK phosphotransfer to VC1086 and VC1087 (background
      statement citing earlier work).
    supporting_text: >-
      This results in decreased phosphotransfer to two response regulator proteins: an
      active EAL-type cyclic-di-GMP phosphodiesterase (Vc1086) and a degenerate HDGYP-type
      cyclic-di-GMP phosphodiesterase (Vc1087).
