  review:
    summary: >-
      New annotation. Purified V. cholerae HnoD (VC1087) receives phosphoryl groups rapidly
      from the V. cholerae histidine kinases HnoK (VCA0719) and HnoS, with kinetics typical
      of cognate kinase/response-regulator pairs.
