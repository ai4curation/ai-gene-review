        displayed rapid phosphotransfer to the two RRs (Figure 2C).
core_functions:
- description: >-
    HnoD is a phosphoacceptor response regulator of the H-NOX/nitric oxide two-component
    network. It receives phosphoryl groups from the H-NOX-associated kinase HnoK (VCA0719)
    and from HnoS. Its C-terminal HD-GYP domain is catalytically dead, having lost the HD
    dyad and the GYP motif, and has no c-di-GMP phosphodiesterase activity. By analogy
    with S. oneidensis HnoD, its likely output is phosphorylation-reversible inhibition of
    the partner EAL phosphodiesterase HnoB (VC1086), which tunes c-di-GMP levels. This
    output has not been shown for the V. cholerae proteins.
