knowledge_gaps:
- gap_statement: >-
    The output of HnoD is known only from S. oneidensis, where unphosphorylated HnoD
    inhibits the HnoB EAL phosphodiesterase and phosphorylation relieves this. Whether V.
    cholerae VC1087 binds and inhibits VC1086 (HnoB) has not been tested. The V. cholerae
    HD-GYP motif substitutions (HQ, GKP) also differ from those of the Shewanella protein
    (SE-GEP).
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    Deletion phenotypes are weak and inconsistent between studies: no colonization defect
    (PMID:25343965), slightly enhanced infant-mouse colonization (PMID:26000450), and
    increased resistance to Bdellovibrio predation (PMID:30420597). None has been linked
    mechanistically to c-di-GMP or NO signaling. The co-purification of VC1087 with EIIAGlc
    from biofilm cells (PMID:23131828) rests on a single peptide and has not been
    validated.
  gap_kind:
  - BIOLOGY
suggested_questions:
- question: >-
    Does unphosphorylated VC1087 inhibit c-di-GMP hydrolysis by VC1086, and does
    phosphorylation by HnoK (VCA0719) or HnoS relieve the inhibition, as for the S.
    oneidensis pair?
suggested_experiments:
- experiment_type: In vitro enzyme assay
  description: >-
    Assay purified VC1086 c-di-GMP phosphodiesterase activity with increasing VC1087
    (wild type, D60A and D60E), with and without HnoK/ATP or BeFx, and test direct
    VC1086-VC1087 binding by pull-down or ITC.
