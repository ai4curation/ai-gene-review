  label: Vibrio cholerae O1 biovar El Tor str. N16961
description: >-
  VC_1087 is HnoD, a 447-residue cytoplasmic response regulator of the H-NOX/nitric
  oxide signaling network. It has an N-terminal receiver (REC) domain with the
  phosphoacceptor Asp60, a coiled-coil linker, and a catalytically degenerate HD-GYP
  domain. In V. cholerae the H-NOX-associated histidine kinase HnoK (VCA0719) and the
  adjacent kinase HnoS both transfer phosphoryl groups rapidly in vitro to HnoD and to
  its operon partner HnoB (VC1086, an active EAL c-di-GMP phosphodiesterase). These are
  cognate phosphorelay interactions (PMID:22542454). The HD-GYP domain has lost its
  metal-binding HD dyad (H-Q in place of H-D) and the GYP motif (G-K-P). VC_1087 shows no
  c-di-GMP hydrolytic activity in vitro or in vivo, and overexpressing it has no effect
  on motility or biofilm formation (PMID:25343965), so it is not a phosphodiesterase.
  In the Shewanella oneidensis system, unphosphorylated HnoD binds HnoB and inhibits its
  phosphodiesterase activity, and phosphorylation relieves the inhibition, forming a
  feed-forward loop on c-di-GMP. This regulatory role is inferred for V. cholerae but has
  not been tested with the V. cholerae proteins. Deleting VC_1087 has given weak and
  inconsistent phenotypes: no colonization defect in one study (PMID:25343965), slightly
  enhanced infant-mouse colonization in another (PMID:26000450), and increased
  resistance to Bdellovibrio predation (PMID:30420597). Dashboard protein
  NZ_QKKU01000066.1_29 is the full-length VC_1087 ortholog from another V. cholerae
  strain, 91.3% identical (408/447), with identical HD-GYP motif residues.
