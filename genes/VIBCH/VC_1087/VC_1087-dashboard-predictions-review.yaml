description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for V. cholerae
  NZ_QKKU01000066.1_29 is "HnoD-like phosphoacceptor response regulator with a degenerate
  HD-GYP domain, receiving phosphotransfer from HnoK and HnoS" (tier A). It carries two GO
  terms: GO:0000156 phosphorelay response regulator activity and GO:0000160 phosphorelay
  signal transduction system. The dashboard sequence has no active UniProtKB entry, so
  the call is scored on N16961 VC_1087 (Q9KT18). That entry is 91.3% identical (408/447,
  ungapped over the full length), which is low for two strains of one species. A search
  of the whole N16961 proteome nonetheless confirms that the dashboard protein is the
  VC_1087 ortholog and not a paralog. The next-best hits are VC_1086 (REC only) and the
  REC-HD-GYP proteins VC_1348 and VC_A0210, all at about 25-38% identity. Most of the
  substitutions are in the REC N-terminus and the linker, and the phosphoacceptor Asp60
  is conserved. The call is supported. VC1087 is the V. cholerae HnoD: V. cholerae HnoK
  (VCA0719) and HnoS phosphorylate it rapidly in vitro (PMID:22542454). Its HD-GYP domain
  is degenerate (HD dyad replaced by HQ, GYP by GKP), and VC1087 has no c-di-GMP
  hydrolytic activity (PMID:25343965). The call rightly rejects the PANTHER/ARBA
  phosphodiesterase label. Its main limitation is that it does not mention the likely
  output, which is phosphorylation-reversible inhibition of the partner EAL
  phosphodiesterase HnoB (VC1086). That output has been shown only for the S. oneidensis
  pair. Both GO terms are correct; GO:0000160 is already in GOA (IEA), and GO:0000156 is
  new.
