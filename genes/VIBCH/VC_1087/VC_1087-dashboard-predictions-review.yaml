predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0000156
    label: phosphorelay response regulator activity
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct. N16961 VC1087 (HnoD) receives phosphoryl groups rapidly
      in vitro from the V. cholerae histidine kinases HnoK (VCA0719) and HnoS, with
      cognate-type kinetics (PMID:22542454). The dashboard protein is the full-length
      VC_1087 ortholog, 91.3% identical, with the phosphoacceptor Asp60 and the rest of the
      receiver domain conserved. The transfer is an ortholog inference at high identity,
      not a measurement on this exact sequence. GOA holds no MF annotation of this kind
      for Q9KT18; its only MF is the ARBA phosphodiesterase term, which the companion
      review removes. The term is therefore novel. It covers the phosphoacceptor role.
      The likely output, inhibition of HnoB, is unproven in V. cholerae and would need a
      separate term.
    supported_by:
    - reference_id: PMID:22542454
      supporting_text: V.c. HnoK and HnoS phosphorylated both V.c. HnoB and HnoD.
    - reference_id: file:VIBCH/VC_1087/VC_1087-bioinformatics/RESULTS.md
      supporting_text: >-
        The dashboard protein is the VC_1087 ortholog, not a paralog
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0000160
    label: phosphorelay signal transduction system
  predicted_term_type: GO_BP
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      The prediction is correct but not novel. GOA already holds this term for Q9KT18 as
      an InterPro2GO IEA from the receiver domain. Phosphotransfer from two cognate V.
      cholerae kinases to VC1087 confirms experimentally that the protein takes part in a
      phosphorelay (PMID:22542454). The dashboard protein is the VC_1087 ortholog with an
      intact receiver domain.
    supported_by:
