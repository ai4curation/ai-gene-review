- id: file:VIBCH/VC_2060/VC_2060-dashboard-prediction-evidence/dashboard_page.txt
  title: gene-annotate dashboard review page for NZ_VSFT01000037.1_102
  findings:
  - statement: The dashboard call names ParP and its interaction partners.
    supporting_text: ParP chemotaxis-array assembly and polar-localization protein interacting with methyl-accepting chemotaxis proteins, CheA, and ParC.
  - statement: The protein-binding term was extracted from the list of interaction partners.
    supporting_text: The phrase 'interacting with methyl-accepting chemotaxis proteins, CheA, and ParC' explicitly supports 'protein binding'.
- id: PMID:29058677
  title: Coupling chemosensory array formation and localization.
  findings:
  - statement: V. cholerae ParP binds MCPs and CheA through its AIF domain and binds ParC through its N-terminus.
    supporting_text: Here we show that ParP's C-terminus integrates into the core-unit of signaling arrays through interactions with MCP-proteins and CheA.
- id: PMID:24379357
  title: ParP prevents dissociation of CheA from chemotactic signaling arrays and tethers
    them to a polar anchor.
  findings:
  - statement: ParP binds ParC and CheA and holds arrays at the pole.
    supporting_text: Following its recruitment to the pole by ParC, ParP sequesters arrays at this site by capturing and preventing the dissociation of CheA.
predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005515
    label: protein binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The term is true. In two-hybrid assays, V. cholerae ParP binds the signaling
      domains of several MCPs, CheA and ParC (PMID:29058677), and the ParC and CheA
      contacts were also shown for the V. parahaemolyticus ortholog (PMID:24379357).
      GOA has no protein-binding annotation for Q9KQE0, so the term is formally novel.
      The term is, however, uninformative. The repository does not add GO:0005515 and
      instead records the function as protein-macromolecule adaptor activity
      (GO:0030674): ParP links the MCP-CheA arrays to the polar anchor ParC. LSP does not
      apply, because that adaptor term is not a descendant of protein binding and is not
      an existing curated annotation.
    supported_by:
    - reference_id: PMID:29058677
      supporting_text: Since ParP's N-terminus mediates interaction with ParC (Ringgaard et al., 2014), ParP has at least three distinct interaction interfaces.
    - reference_id: file:VIBCH/VC_2060/VC_2060-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: The phrase 'interacting with methyl-accepting chemotaxis proteins, CheA, and ParC' explicitly supports 'protein binding'.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0065003
    label: protein-containing complex assembly
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The term is correct. In V. cholerae, chemoreceptor arrays (YFP-CheW1 clusters) do
      not form when both parP and cheA1, or the ParP AIF domain and cheA1, are deleted.
      ParP or CheA alone is sufficient for array formation, and ParP is built into the
      array baseplate (PMID:29058677, PMID:30541885). GOA has no process annotation
      other than the chemotaxis and signal transduction IEAs, so the term is novel. It
      is generic. The companion review uses receptor clustering (GO:0043113), a closer
      description of chemoreceptor array formation. GO has no term specific to bacterial
      chemosensory array assembly.
    supported_by:
    - reference_id: PMID:29058677
      supporting_text: Importantly, ParP integrates into arrays and promotes their formation via a C-terminal Array Integration and Formation (AIF) domain
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0008104
    label: intracellular protein localization
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The term is correct and is directly supported in V. cholerae. Without ParP, CheW1
      clusters are not recruited to the cell poles and are mislocalized or absent in 74%
      of cells (PMID:29058677). In V. parahaemolyticus, ParP holds CheA and the arrays at
      the pole after ParC has recruited it (PMID:24379357). The term is absent from GOA.
      GO has no "protein localization to cell pole" term, so this is the most specific
      available term.
    supported_by:
    - reference_id: PMID:29058677
      supporting_text: In contrast to localization in wild-type cells, in the absence of ParP, YFP-CheW1 clusters were not recruited to the cell poles
    - reference_id: PMID:24379357
      supporting_text: Following its recruitment to the pole by ParC, ParP sequesters arrays at this site by capturing and preventing the dissociation of CheA.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0060187
    label: cell pole
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The term is correct. This is the cellular-component reading of "polar-localization
      protein": YFP-ParP localizes to one or both poles in 97% of V. cholerae cells
      (PMID:29058677). The pole term is valid because the protein itself is there, not
      only the arrays it positions. The term is absent from GOA, which has no CC
      annotation for Q9KQE0.
    supported_by:
    - reference_id: PMID:29058677
      supporting_text: Wild-type YFP-ParP localized to the cell poles in a uni- or bi-polar manner in 97% of cells.
