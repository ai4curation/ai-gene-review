description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for V. cholerae
  NZ_VSFT01000037.1_102 (341 aa) is "ParP chemotaxis-array assembly and
  polar-localization protein interacting with methyl-accepting chemotaxis proteins, CheA,
  and ParC" (tier A). It carries four GO terms: GO:0005515 protein binding, GO:0065003
  protein-containing complex assembly, GO:0008104 intracellular protein localization and
  GO:0060187 cell pole. The call is scored on the N16961 reference entry Q9KQE0
  (VC_2060, 338 aa), which is 98.8% identical over the 338 aligned residues (97.9% over
  the query length). The query carries every ParP residue that has been functionally
  mapped in the AIF domain (L196, L209, L212, I215 and W305, shifted by +3 in the query
  numbering). The homolog the annotator relied on is this same gene, VC_2060, in strain
  N16961, where ParP was characterized directly (PMID:29058677). The call is supported
  and states the protein's function accurately. All four GO terms are biologically
  correct. None is in GOA, which holds only the InterPro2GO chemotaxis and signal
  transduction IEAs for Q9KQE0, so all four are scored COR. Protein binding is true
  but uninformative, and the companion review records protein-macromolecule adaptor
  activity instead. Complex assembly and intracellular protein localization are correct
  but generic; the companion review uses receptor clustering for array assembly.
