taxon:
  id: NCBITaxon:243277
  label: Vibrio cholerae O1 biovar El Tor str. N16961
description: >-
  parP (VC_2060; UniProt Q9KQE0, unreviewed and named only "CheW-like domain-containing
  protein") encodes ParP, a 338-residue cytoplasmic protein from chemotaxis cluster II of
  Vibrio cholerae. It tethers the cluster II chemoreceptor arrays to the polar
  ParA-like ATPase ParC (VC_2061). The gene lies directly downstream of parC. ParP has
  three interaction surfaces. A conserved extreme N-terminal motif binds ParC. A long,
  proline-rich, variable linker follows. The C-terminal CheW-like (SH3-like) "array
  integration and formation" (AIF) domain binds the protein-interaction tip of
  methyl-accepting chemotaxis proteins (MCPs), through L209, and the
  localization-and-inheritance domain (LID) of CheA, through W305. Through these
  contacts ParP becomes part of the core signaling unit and the array baseplate, at
  about one ParP per 35 CheW1 and 5 CheA. It stimulates array formation, and either ParP
  or CheA alone is sufficient for arrays to form. Once ParC has recruited ParP to the
  pole, ParP holds arrays there and prevents CheA from dissociating. It also promotes
  retention of ParC and of itself at the pole. Cells lacking ParP have mislocalized or
  absent arrays, so daughter cells do not reliably inherit an array, and they show
  reduced chemotaxis and fewer swimming reversals. The motility phenotypes were measured
  mainly in V. parahaemolyticus. ParP is a localization and assembly adaptor of the
  chemosensory machinery. It is not a CheW-type coupling protein that is required for
  kinase activation, and it has no enzymatic activity.
existing_annotations:
- term:
    id: GO:0006935
    label: chemotaxis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002545
  - InterPro:IPR036061
  review:
    summary: >-
      This InterPro2GO annotation comes from the C-terminal CheW-like domain. ParP is a
      component of the chemotaxis cluster II signaling arrays. It integrates into the
      core signaling unit by binding MCPs and CheA (PMID:29058677), and it is required
      for the polar localization and inheritance of the arrays. Loss of ParP reduces
      chemotaxis and swimming reversals in V. parahaemolyticus, and V. cholerae lacking
      ParP has a similar array-localization defect (PMID:24379357).
    action: ACCEPT
    reason: >-
      ParP participates in chemotaxis structurally: it builds and positions the
      chemosensory arrays on which chemotactic signaling depends. This passes the
      participation test. The term fits the gene's biology at the right level, so the IEA
      is accepted. The more specific array-level processes are added as NEW annotations
      below.
    supported_by:
    - reference_id: PMID:24379357
      supporting_text: Thus, our data indicate that ParP is required for optimal chemotaxis and proper swimming behavior.
    - reference_id: PMID:24379357
      supporting_text: A similar deficiency in localization of chemotaxis proteins was observed in V. cholerae lacking ParP
    - reference_id: PMID:29058677
      supporting_text: Via interactions with MCPs and CheA, ParP is a part of the chemotaxis core unit and integrates into the chemotactic signaling arrays.
- term:
    id: GO:0007165
    label: signal transduction
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002545
  - InterPro:IPR036061
  review:
    summary: >-
      This InterPro2GO annotation comes from the CheW-like domain. ParP sits inside the
      signal-transducing core unit of the chemoreceptor array, bound to MCPs and CheA,
      and it keeps CheA in the arrays (PMID:24379357, PMID:29058677). No study shows that
      ParP couples receptor signaling to CheA kinase activity, as CheW does. Its known
      contributions are array assembly, polar positioning and retention.
    action: KEEP_AS_NON_CORE
    reason: >-
      The term is broadly true, because ParP is a structural part of the signaling
      complex and stabilizes the kinase within it. ParP's own function, however, is
      positioning and assembly rather than signal relay. The term is kept as non-core,
      and the core function is captured by the adaptor, receptor-clustering and
      protein-localization terms.
    supported_by:
    - reference_id: PMID:24379357
      supporting_text: Once recruited to the pole by ParC, ParP sequesters arrays at this site by capturing and preventing the dissociation of chemotactic signaling protein (CheA).
    - reference_id: PMID:29058677
      supporting_text: ParP's C-terminus integrates into the core-unit of signaling arrays through interactions with MCP-proteins and CheA.
- term:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
  evidence_type: IDA
  original_reference_id: PMID:29058677
  review:
    summary: >-
      New annotation. In bacterial two-hybrid and E. coli co-localization assays, V.
      cholerae ParP (vc2060, strain N16961) binds the signaling domains of four MCPs
      through L209 and binds CheA through W305, both in its C-terminal AIF domain. It
      binds ParC through a separate N-terminal domain. Each of these contacts is needed
      for the full localization phenotype. ParP thus physically links the chemoreceptor
      array (MCPs and CheA) to the polar anchor ParC, which is the definition of an
      adaptor that brings macromolecules together so that they function in a coordinated
      way.
    action: NEW
    reason: >-
      An informative MF term is used instead of the generic GO:0005515 protein binding,
      as the repository's protein-binding policy requires. The interactions were shown
      directly for the V. cholerae protein. Their functional role, tethering arrays to
      ParC at the pole, was shown with separation-of-function point mutants
      (PMID:29058677) and in V. parahaemolyticus (PMID:24379357).
    supported_by:
    - reference_id: PMID:29058677
      supporting_text: These distinct interaction surfaces potentially allow ParP to simultaneously couple two critical signaling components (MCP and CheA) to the polar determinant ParC
    - reference_id: PMID:29058677
      supporting_text: Since ParP's N-terminus mediates interaction with ParC (Ringgaard et al., 2014), ParP has at least three distinct interaction interfaces.
    - reference_id: PMID:24379357
      supporting_text: Thus, a tripartite (ParC–ParP–CheA) interaction network enables the polar localization and sequestration of chemotaxis arrays in polarly flagellated organisms.
    - reference_id: file:VIBCH/VC_2060/VC_2060-deep-research-claude-code.md
      supporting_text: Alvarado et al. (2017) give "parP NCBI GeneID 2613440 (vc2060)". The UniProt record cross-references DNASU 2613440, the same gene ID
- term:
    id: GO:0043113
    label: receptor clustering
  evidence_type: IMP
  original_reference_id: PMID:29058677
  review:
    summary: >-
      New annotation. In V. cholerae, chemoreceptor arrays (marked by YFP-CheW1 clusters)
      fail to form when both parP and cheA1 are deleted, or when only the ParP AIF domain
      and cheA1 are deleted. ParP alone, or CheA alone, is sufficient for array formation.
      Array formation is the clustering of MCP chemoreceptors into an ordered lattice, so
      ParP contributes structure to receptor clustering.
    action: NEW
    reason: >-
      ParP's AIF domain inserts into the core unit between MCPs and plays the
      array-building role of CheA-P5. Cryo-ET and proteomics place ParP in the baseplate
      of cluster II arrays (PMID:30541885). This is participation, not mere requirement.
      GO has no specific term for bacterial chemoreceptor array assembly, and receptor
      clustering is the closest existing term.
    supported_by:
    - reference_id: PMID:29058677
      supporting_text: Consistent with the idea that the AIF domain accounts for ParP's activity in array formation, in the absence of CheA, chemotaxis clusters (as visually detected by YFP-CheW1) did not form in strains deleted for either the whole entire parP gene
    - reference_id: PMID:29058677
      supporting_text: These data indicate that formation of signaling arrays is severely compromised in the absence of both ParP and CheA
    - reference_id: PMID:30541885
      supporting_text: ParP integrates into the array via its C-terminal AIF-domain through interactions with MCPs and CheA.
- term:
    id: GO:0008104
    label: intracellular protein localization
  evidence_type: IMP
  original_reference_id: PMID:29058677
  review:
    summary: >-
      New annotation. In V. cholerae lacking ParP, the chemotaxis protein CheW1 is no
      longer recruited to the cell poles: in 74% of cells it is mislocalized along the
      cell length or absent. Once recruited by ParC, ParP holds CheA and the arrays at
      the pole and prevents CheA from dissociating, as shown mainly in V.
      parahaemolyticus (PMID:24379357). GO has no "protein localization to cell pole"
      term, so this is the most specific applicable process term.
    action: NEW
    reason: >-
      ParP acts directly as the tether between ParC and the array proteins, so it does
      the work of localizing them. It also promotes its own retention and that of ParC
      at the pole.
    supported_by:
    - reference_id: PMID:29058677
      supporting_text: In contrast to localization in wild-type cells, in the absence of ParP, YFP-CheW1 clusters were not recruited to the cell poles, but were instead mislocalized along the cell length or completely absent in 74% of cells
    - reference_id: PMID:24379357
      supporting_text: ParP promotes array stability as well as positioning and retention at the pole.
- term:
    id: GO:0060187
    label: cell pole
  evidence_type: IDA
  original_reference_id: PMID:29058677
  review:
    summary: >-
      New annotation. Functional YFP-ParP localizes to one or both cell poles in 97% of
      V. cholerae cells. Its polar recruitment depends on ParC, and its retention depends
      on integration into the arrays. ParP also exchanges continuously with a cytoplasmic
      pool, as FRAP shows.
    action: NEW
    reason: >-
      This is direct fluorescence-microscopy evidence for the V. cholerae protein. ParP
      follows the cell-cycle-dependent unipolar-to-bipolar pattern of ParC and the arrays
      (PMID:29531180). The more specific old/new-pole terms are not used, because ParP
      occupies both poles during the cell cycle.
    supported_by:
    - reference_id: PMID:29058677
      supporting_text: Wild-type YFP-ParP localized to the cell poles in a uni- or bi-polar manner in 97% of cells.
    - reference_id: PMID:29531180
      supporting_text: 'ParC and ParP themselves display a localization pattern similar to that of chemotaxis arrays: unipolarly at the old flagellated cell pole in young newborn cells, bipolarly later in the cell cycle, and evenly divided to daughter cells'
core_functions:
- description: >-
    Polar tethering and assembly adaptor of the cluster II chemoreceptor arrays. The
    C-terminal CheW-like AIF domain inserts into the array core unit by binding the MCP
    protein-interaction tip (through L209) and the CheA LID (through W305), which
    stimulates array formation. The N-terminal motif binds the polar ATPase ParC, which
    recruits and retains the arrays, and ParP itself, at the cell pole. This ensures that
    each daughter cell inherits an array and that chemotaxis works properly.
  molecular_function:
    id: GO:0030674
    label: protein-macromolecule adaptor activity
