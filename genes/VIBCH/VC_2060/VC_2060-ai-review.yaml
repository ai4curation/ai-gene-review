  supported_by:
  - reference_id: PMID:29058677
    supporting_text: Here we show that ParP's C-terminus integrates into the core-unit of signaling arrays through interactions with MCP-proteins and CheA.
  - reference_id: PMID:29058677
    supporting_text: Linkage of these domains within ParP couples array formation and localization and results in controlled array positioning at the cell pole.
  - reference_id: PMID:24379357
    supporting_text: Following its recruitment to the pole by ParC, ParP sequesters arrays at this site by capturing and preventing the dissociation of CheA.
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO
    terms
  findings: []
- id: PMID:21764856
  title: A family of ParA-like ATPases promotes cell pole maturation by facilitating
    polar localization of chemotaxis proteins.
  findings:
  - statement: >-
      Identified ParC (VC2061), the polar ParA-like ATPase encoded in V. cholerae
      chemotaxis cluster II, directly upstream of parP (VC2060). This paper predates
      the naming of ParP.
    supporting_text: Notably, in addition to the core structural genes of the chemotactic complex, cluster II also encodes a ParA homolog, VC2061.
- id: PMID:24379357
  title: ParP prevents dissociation of CheA from chemotactic signaling arrays and tethers
    them to a polar anchor.
  findings:
  - statement: >-
      Named and characterized ParP, mainly in V. parahaemolyticus (VP2226). ParP binds
      ParC and the CheA LID, prevents CheA dissociation from arrays, and is required for
      polar array localization and optimal chemotaxis. A parP deletion in V. cholerae
      gave a similar localization defect.
    supporting_text: Here, we show that a previously uncharacterized protein, ParP, interacts with ParC and that ParP is integral to array localization in Vibrio parahaemolyticus .
- id: PMID:29058677
  title: Coupling chemosensory array formation and localization.
  findings:
  - statement: >-
      In V. cholerae N16961 (vc2060), the ParP AIF domain binds MCPs (through L209) and
      CheA (through W305), integrates ParP into arrays, and stimulates array formation.
      The N-terminal domain binds ParC.
    supporting_text: Importantly, ParP integrates into arrays and promotes their formation via a C-terminal Array Integration and Formation (AIF) domain, which is linked to ParP's N-terminal ParC interaction domain.
- id: PMID:30541885
  title: Baseplate variability of Vibrio cholerae chemoreceptor arrays.
  findings:
  - statement: >-
      ParP is part of the cluster II array baseplate, at a CheW1:CheA2:ParP stoichiometry
      of 35:5.3:1.
    supporting_text: The analysis revealed the stoichiometry of CheW1:CheA2:ParP to be 35:5.3:1
- id: PMID:29531180
  title: Chemotaxis arrays in Vibrio species and their intracellular positioning by
    the ParC/ParP system.
  findings:
  - statement: Review of the ParC/ParP system. ParP binds ParC, CheA and MCPs.
    supporting_text: ParP has multiple interaction partners and specifically interacts with ParC, the histidine kinase CheA, and MCPs
