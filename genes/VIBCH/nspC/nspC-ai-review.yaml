id: Q9KRL4
gene_symbol: nspC
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:243277
  label: Vibrio cholerae O1 biovar El Tor str. N16961
description: >-
  Carboxynorspermidine/carboxyspermidine decarboxylase (CANSDC/CASDC, NspC;
  EC 4.1.1.96), a pyridoxal 5'-phosphate-dependent group IV basic amino acid
  decarboxylase of the Orn/Lys/Arg decarboxylase class-II family. It catalyses
  the last step of the alternative polyamine pathway, decarboxylating
  carboxynorspermidine to sym-norspermidine and carboxyspermidine to spermidine,
  the carboxypolyamines made by the adjacent CANSDH (VC_1624). Deletion of nspC
  abolishes norspermidine and spermidine, causes carboxynorspermidine to
  accumulate, slows planktonic growth and severely impairs biofilm formation,
  which is rescued by exogenous norspermidine. It is a cytoplasmic homodimer.
