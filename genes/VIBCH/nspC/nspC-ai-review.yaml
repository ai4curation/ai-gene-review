  title: UniProtKB/Swiss-Prot entry Q9KRL4 (NSPC_VIBCH)
  findings:
  - statement: Swiss-Prot curates both EC 4.1.1.96 reactions, the PLP cofactor, the homodimer, the cytoplasmic location and the deletion phenotype.
- id: PMID:19196710
  title: An alternative polyamine biosynthetic pathway is widespread in bacteria and
    essential for biofilm formation in Vibrio cholerae.
  findings:
  - statement: Deletion of VC1623 removes norspermidine and causes its carboxylated precursor to accumulate, identifying the gene as the functional CANSDC.
    supporting_text: resulted in the disappearance of norspermidine and the novel accumulation of carboxynorspermidine
  - statement: The purified orthologous enzyme does not decarboxylate meso-diaminopimelate, arginine or lysine.
    supporting_text: no activity with l -arginine, l -lysine, and meso -diaminopimelate
  - statement: Loss of the pathway impairs biofilm formation, rescuable by exogenous norspermidine.
    supporting_text: severely reduced biofilm formation, which could be rescued by exogenously supplied sym-norspermidine but not spermidine
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read; the primary genetic and enzymatic characterization of this gene.
- id: PMID:20534592
  title: 'Evolution of substrate specificity within a diverse family of beta/alpha-barrel-fold
    basic amino acid decarboxylases: X-ray structure determination of enzymes with
    specificity for L-arginine and carboxynorspermidine.'
  findings:
  - statement: The CANSDC crystal structure places the enzyme in the group IV PLP decarboxylase class with interfacial active sites, and identifies Leu314 in place of the acidic residue used by other substrates.
    supporting_text: Additionally, in CANSDC a key acidic residue that interacts with the distal amino group of other substrates is replaced by Leu(314), which interacts with the aliphatic portion of norspermidine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; structural basis for the divergence of NspC from the LysA/ODC members of the fold.
- id: PMID:7812450
  title: Cloning and nucleotide sequence of the carboxynorspermidine decarboxylase gene
    from Vibrio alginolyticus.
  findings:
  - statement: The V. alginolyticus nspC gene encodes the terminal enzyme of norspermidine biosynthesis and carries a PLP-binding region resembling that of DAP decarboxylases and ornithine decarboxylases.
    supporting_text: the deduced amino acid sequence contained a putative pyridoxal 5'-phosphate binding region similar to those of the bacterial meso-2,6-diaminopimelate decarboxylases and eukaryotic ornithine decarboxylases
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; the source of the ISS transfer (UniProtKB:Q56575) recorded in GOA.
- id: PMID:22025614
  title: Alternative spermidine biosynthetic route is critical for growth of Campylobacter
    jejuni and is the dominant polyamine pathway in human gut microbiota.
  findings:
  - statement: In C. jejuni the orthologous decarboxylase makes spermidine rather than norspermidine in vivo, and the route is the dominant spermidine pathway of the human gut microbiome.
    supporting_text: we found that the carboxynorspermidine decarboxylase orthologue is responsible for synthesizing spermidine and not sym-norspermidine in vivo
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; supports the generality of the route rather than any V. cholerae claim.
