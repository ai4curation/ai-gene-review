- id: PMID:19196710
  title: An alternative polyamine biosynthetic pathway is widespread in bacteria and essential for
    biofilm formation in Vibrio cholerae.
  findings:
  - statement: Deletion of VC1623 removes norspermidine and causes its carboxylated precursor to
      accumulate, identifying the gene as the functional CANSDC.
    supporting_text: resulted in the disappearance of norspermidine and the novel accumulation of
      carboxynorspermidine
  - statement: The purified orthologous enzyme does not decarboxylate meso-diaminopimelate, arginine
      or lysine.
    supporting_text: no activity with l -arginine, l -lysine, and meso -diaminopimelate
  - statement: Loss of the pathway impairs biofilm formation, rescuable by exogenous norspermidine.
    supporting_text: severely reduced biofilm formation, which could be rescued by exogenously
      supplied sym-norspermidine but not spermidine
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text checked. Deletion/complementation and metabolite experiments used V. cholerae C6709, whereas
      Q9KRL3/Q9KRL4 are N16961 reference records. Purified decarboxylase specificity was assayed using
      V. vulnificus CANSDC for technical reasons. These are distinct evidence layers; no N16961 purified-enzyme
      assay is inferred.
- id: PMID:20534592
  title: 'Evolution of substrate specificity within a diverse family of beta/alpha-barrel-fold basic amino
    acid decarboxylases: X-ray structure determination of enzymes with specificity for L-arginine and
    carboxynorspermidine.'
  findings:
  - statement: The CANSDC crystal structure places the enzyme in the group IV PLP decarboxylase
      class with interfacial active sites, and identifies Leu314 in place of the acidic residue used
      by other substrates.
    supporting_text: Additionally, in CANSDC a key acidic residue that interacts with the distal
      amino group of other substrates is replaced by Leu(314), which interacts with the aliphatic
      portion of norspermidine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The cache is abstract-only. The CANSDC structure is the C. jejuni homolog, as independently specified
      in PMID:39887002, not a structure of V. cholerae Q9KRL4; it supports the existing similarity-based
      PLP and assembly claims.
- id: PMID:7812450
  title: Cloning and nucleotide sequence of the carboxynorspermidine decarboxylase gene from Vibrio
    alginolyticus.
  findings:
  - statement: The V. alginolyticus nspC gene encodes the terminal enzyme of norspermidine
      biosynthesis and carries a PLP-binding region resembling that of DAP decarboxylases and
      ornithine decarboxylases.
    supporting_text: the deduced amino acid sequence contained a putative pyridoxal 5'-phosphate
      binding region similar to those of the bacterial meso-2,6-diaminopimelate decarboxylases and
      eukaryotic ornithine decarboxylases
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only cache; the source of the ISS transfer (UniProtKB:Q56575) recorded in
      GOA.
- id: PMID:22025614
  title: Alternative spermidine biosynthetic route is critical for growth of Campylobacter jejuni
    and is the dominant polyamine pathway in human gut microbiota.
  findings:
  - statement: In C. jejuni the orthologous decarboxylase makes spermidine rather than norspermidine
      in vivo, and the route is the dominant spermidine pathway of the human gut microbiome.
    supporting_text: we found that the carboxynorspermidine decarboxylase orthologue is responsible
      for synthesizing spermidine and not sym-norspermidine in vivo
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      The publication cache was normally refreshed to full text during this audit. C. jejuni experiments
      support the comparator spermidine pathway; they are not direct assays of the Vibrio or KT2440 targets.
- id: file:VIBCH/nspC/nspC-notes.md
  title: Curation notes for nspC
  findings: []
- id: PMID:40074085
  title: New routes for spermine biosynthesis.
  findings:
  - statement: Some related CASDH/CASDC pairs support tetramine or agmatine-dependent chemistry;
      this cautions against assigning substrate preference from family membership alone. No such
      additional activity is assigned here.
    supporting_text: The ASA-dependent pathway consisting of CASDH/CASDC homologs has diversified
      during evolution to produce norspermidine (29), N1-aminopropylagmatine (37), and as we have
      shown here, spermidine and Spm/Tspm.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text checked as a specificity comparator. The reported heterologous
      reconstructions are not direct measurements of this target enzyme or native target-species
      flux.
- id: PMID:39887002
  title: Structure of Clostridium leptum carboxyspermidine decarboxylase and comparison to homologs
    prevalent within the human gut microbiome.
  findings:
  - statement: Structural comparison independently identifies the older CANSDC structure as a C.
      jejuni homolog, and supports conserved PLP-dependent decarboxylase architecture across related
      enzymes.
    supporting_text: from the bacterium Campylobacter jejuni (PDB entry 3n29; Deng et al., 2010
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text checked. The new structure is C. leptum EDO61992.1, not the target
