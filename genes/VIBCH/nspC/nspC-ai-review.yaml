knowledge_gaps:
- gap_statement: >-
    How V. cholerae NspC partitions flux between carboxynorspermidine and
    carboxyspermidine in the cell is unresolved: the 20-fold preference measured
    for the V. vulnificus orthologue in vitro has not been measured for Q9KRL4
    itself, and the in vivo ratio also depends on which carboxypolyamine CANSDH
    supplies.
  boundary: >-
    The reaction chemistry, both substrates and the deletion phenotype are
    established; the quantitative partition is not.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Determines whether spermidine production in Vibrio is incidental to a
    norspermidine pathway or a separately regulated output.
  resolution: >-
    Kinetics of purified Q9KRL4 with both chemically synthesized
    carboxypolyamines, with polyamine quantitation in strains whose diamine
    supply is manipulated.
  provenance:
  - reference_id: PMID:19196710
    supporting_text: carboxynorspermidine was the primary substrate and was decarboxylated 20-fold more efficiently than carboxyspermidine
proposed_new_terms:
- proposed_name: carboxyspermidine/carboxynorspermidine decarboxylase activity
  proposed_definition: >-
    Catalysis of the decarboxylation of carboxyspermidine to spermidine or
    carboxynorspermidine to sym-norspermidine.
  justification: >-
    NspC enzymes are assigned EC 4.1.1.96 with RHEA:34095 and RHEA:34099, but GO
    offers only the broad carboxy-lyase parent GO:0016831. The same term is
    proposed by the KT2440 NspC review; one GO term would serve both.
  proposed_parent:
    id: GO:0016831
    label: carboxy-lyase activity
  supported_by:
  - reference_id: file:VIBCH/nspC/nspC-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: Catalyzes the decarboxylation of carboxynorspermidine and carboxyspermidine.
  - reference_id: PMID:19196710
    supporting_text: carboxynorspermidine was the primary substrate and was decarboxylated 20-fold more efficiently than carboxyspermidine
suggested_questions:
- question: Is the spermidine made by the Vibrio CANSDH/NspC pair functionally distinct from norspermidine, or is it a tolerated by-product of a norspermidine pathway?
suggested_experiments:
- description: Determine kcat/Km of purified Q9KRL4 for carboxynorspermidine and carboxyspermidine, and quantify both polyamines in strains with altered 1,3-diaminopropane and putrescine supply.
  experiment_type: enzyme kinetics and metabolomics
