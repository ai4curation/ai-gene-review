      Real and experimentally grounded, but peripheral to what the protein does.
      The biofilm defect of the nspC deletion is downstream of the loss of
      norspermidine and is rescued by adding norspermidine, so NspC contributes
      the signalling polyamine rather than performing a step of biofilm
      formation.
    action: KEEP_AS_NON_CORE
