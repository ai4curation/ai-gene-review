description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for V. cholerae
  NZ_JAACMT010000013.1_13 is "Inner-membrane-associated c-di-GMP-binding protein containing
  PAS, GGDEF, and EAL domains" (tier A). It carries two GO terms: GO:0035438 cyclic-di-GMP
  binding and GO:0005886 plasma membrane. The dashboard sequence (785 aa) is scored on the
  N16961 reference entry Q9KVR7 (768 aa). The two are 99.7% identical over 768 aligned
  residues, and the dashboard model has an 18-residue in-frame upstream extension (net +17
  aa) that does not touch any domain. The call is supported. Specific c-di-GMP binding was
  shown for the N16961 VC0072 ORF in a lysate DRaCALA screen, with competition by c-di-GMP
  but not GTP or cGMP (PMID:26506097). The protein has a predicted TM helix with
  cytoplasmic domains. The call is deliberately conservative: it names binding rather than
  a catalytic activity. Motif analysis shows that both the GGDEF (GGDEF, DLD, HDAGD) and
  EAL (EVLVR, N-loop, DDFGSG, KID, conserved Glu residues) catalytic signatures are intact,
  and GOA already carries an IBA for c-di-GMP phosphodiesterase activity. The binding the
  call reports is most likely substrate binding by a probable PDE. Calling binding instead
  of PDE (or DGC/PDE) activity is defensible because neither activity has been measured,
  but it under-describes the protein. The dashboard flagged a paralog signal: its STRING
  partners include the GGDEF-EAL paralogs MbaA and VC0658. The call did not transfer any
  paralog-specific function, so no paralog error was found.
