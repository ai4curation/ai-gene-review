- id: PMID:26506097
  title: Systematic Identification of Cyclic-di-GMP Binding Proteins in Vibrio cholerae
    Reveals a Novel Class of Cyclic-di-GMP-Binding ATPases Associated with Type II Secretion
    Systems.
  findings:
  - statement: VC0072 binds c-di-GMP specifically in lysate DRaCALA; binding is attributed to the EAL domain.
    supporting_text: >-
      Four ORFs (VC0072, VC0658, VC0703 (MbaA), VC1934) were identified with both GGDEF and
      EAL domains, but lacking the RxxD motif, suggesting that c-di-GMP binding occurs at
      the EAL domain.
predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0035438
    label: cyclic-di-GMP binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct and novel. In the DRaCALA ORFeome screen, lysates of E. coli
      expressing the N16961 VC0072 ORF bound 32P-c-di-GMP. Unlabeled c-di-GMP competed the
      binding and GTP and cGMP did not (PMID:26506097). The dashboard sequence is 99.7%
      identical to that ORF and differs only by an N-terminal extension and two
      substitutions outside the catalytic domains. The assay used crude lysate, not
      purified protein, so binding was not shown to be direct. However, the intact EAL site
      gives a simple direct explanation. GOA has no c-di-GMP binding annotation for
      Q9KVR7. The term is accurate but describes a property of a probable PDE (or DGC/PDE)
      enzyme rather than its main activity. LSP does not apply, because no curated
      catalytic term exists and phosphodiesterase activity is not a child of
      cyclic-di-GMP binding.
    supported_by:
    - reference_id: PMID:26506097
      supporting_text: >-
        Four ORFs (VC0072, VC0658, VC0703 (MbaA), VC1934) were identified with both GGDEF
        and EAL domains, but lacking the RxxD motif, suggesting that c-di-GMP binding occurs
        at the EAL domain.
    - reference_id: file:VIBCH/VC_0072/VC_0072-bioinformatics/RESULTS.md
      supporting_text: >-
        all EAL residues normally needed for Mg2+-dependent c-di-GMP hydrolysis are present
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005886
    label: plasma membrane
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      The prediction is correct but not novel: GOA already has GO:0005886 (IBA) for Q9KVR7.
      DeepTMHMM on the dashboard sequence predicts an N-terminal hydrophobic segment and one
      TM helix (78-96; UniProt 57-79), with residues 97-785 cytoplasmic. This is the
      topology of an inner (cytoplasmic) membrane protein with cytoplasmic PAS, GGDEF and
      EAL domains. The extension in the dashboard gene model does not remove the TM helix.
      No experimental localization exists.
    supported_by:
    - reference_id: file:VIBCH/VC_0072/VC_0072-bioinformatics/RESULTS.md
      supporting_text: >-
        both models keep the hydrophobic N-terminal region and the single TM helix
    - reference_id: file:VIBCH/VC_0072/VC_0072-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: 'DeepTMHMM: Inner membrane via Sec (SP + TM)'
