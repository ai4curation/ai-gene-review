core_functions:
- description: >-
    Inner-membrane-anchored PAS-GGDEF-EAL c-di-GMP-metabolizing protein. Its EAL domain is
    catalytically intact and binds c-di-GMP specifically, so it is predicted to hydrolyze
    c-di-GMP. The GGDEF domain also has an intact catalytic signature, so the protein may
    be bifunctional. Neither activity has been measured, and its physiological role in V.
    cholerae is unknown.
