    label: cyclic-di-GMP binding
  evidence_type: IDA
  original_reference_id: PMID:26506097
  qualifier: enables
  review:
    summary: >-
      In the DRaCALA ORFeome screen, lysates of E. coli expressing His- or His-MBP-tagged
      VC0072 bound 32P-c-di-GMP. Unlabeled c-di-GMP abolished the binding (fraction bound
      about 0.5 without competitor, near 0 with it), while GTP and cGMP did not compete.
      Purified VC0072 was not tested, so the binding was measured in heterologous lysate.
      The binding most likely reflects the substrate site of the intact EAL domain.
    action: NEW
    reason: >-
      This is the only direct biochemical observation for VC0072 and it is absent from
      GOA. It is a binding term; the underlying catalytic function, PDE activity, is
      captured separately, so binding is not treated as the core function.
    supported_by:
    - reference_id: PMID:26506097
      supporting_text: >-
        Unlabeled c-di-GMP significantly reduced 32P-c-di-GMP binding for ORFs listed in
        Table 1. In contrast, unlabeled GTP and cGMP did not reduce 32P-c-di-GMP binding,
        suggesting that the measured binding activity was specific for c-di-GMP.
    - reference_id: PMID:26506097
      supporting_text: >-
        Four ORFs (VC0072, VC0658, VC0703 (MbaA), VC1934) were identified with both GGDEF
        and EAL domains, but lacking the RxxD motif, suggesting that c-di-GMP binding occurs
        at the EAL domain.
references:
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings:
  - statement: PANTHER IBA supplies plasma membrane, c-di-GMP phosphodiesterase activity
      and regulation of biofilm formation from E. coli and P. aeruginosa GGDEF/EAL proteins.
- id: PMID:26506097
  title: Systematic Identification of Cyclic-di-GMP Binding Proteins in Vibrio cholerae
    Reveals a Novel Class of Cyclic-di-GMP-Binding ATPases Associated with Type II Secretion
    Systems.
  findings:
  - statement: VC0072 was a positive hit in a DRaCALA ORFeome screen for c-di-GMP binding;
      binding was competed by unlabeled c-di-GMP but not GTP or cGMP.
    supporting_text: >-
      Unlabeled c-di-GMP significantly reduced 32P-c-di-GMP binding for ORFs listed in
      Table 1. In contrast, unlabeled GTP and cGMP did not reduce 32P-c-di-GMP binding,
      suggesting that the measured binding activity was specific for c-di-GMP.
  - statement: VC0072 lacks the GGDEF I-site (RxxD); binding is proposed to occur at the
      EAL domain.
    supporting_text: >-
      Four ORFs (VC0072, VC0658, VC0703 (MbaA), VC1934) were identified with both GGDEF and
      EAL domains, but lacking the RxxD motif, suggesting that c-di-GMP binding occurs at
      the EAL domain.
  - statement: The screen measured binding in lysates of E. coli expressing each ORF, not
      purified protein.
    supporting_text: >-
      The specificity for c-di-GMP binding of cell lysates expressing positive ORFs was
      determined by competition experiments using unlabeled guanosine nucleotides
- id: PMID:29463743
  title: In vivo repressed genes of Vibrio cholerae reveal inverse requirements of an
    H(+)/Cl(-) transporter along the gastrointestinal passage.
  findings:
  - statement: VC0072 is an in vivo repressed (ivr) gene; its constitutive expression did
      not significantly attenuate colonization in vivo relative to in vitro.
    supporting_text: >-
      We found only three cases where constitutive expression did not result in a
      significant attenuation in vivo compared with in vitro condition: i.e., VC0072,
      VC0227, and VCA0576
