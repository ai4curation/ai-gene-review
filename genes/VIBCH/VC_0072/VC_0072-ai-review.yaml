suggested_questions:
- question: Does purified VC0072, or its cytoplasmic PAS-GGDEF-EAL fragment, hydrolyze c-di-GMP to pGpG, synthesize c-di-GMP from GTP, or both?
- question: What does the PAS domain sense, and does that signal switch VC0072 between DGC and PDE output?
- question: Which of the two annotated start codons is used in vivo (the N16961 alternative start or the upstream in-frame start in the dashboard gene model)?
suggested_experiments:
- description: Purify the cytoplasmic region and point mutants (GGDEF->GGAAF, EVL->AVL) and measure DGC and PDE activities by HPLC or LC-MS of reaction products.
  experiment_type: enzymology
- description: Measure intracellular c-di-GMP, biofilm formation and motility in a clean VC0072 deletion and in strains expressing the catalytic-site mutants.
  experiment_type: targeted genetics and physiology
