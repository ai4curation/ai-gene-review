  review:
    summary: >-
      The EAL domain (512-767) keeps every motif needed for Mg2+-dependent c-di-GMP
      hydrolysis: EVLVR, the N-loop Asn, an ExxE Glu, DDFGSG, the catalytic Lys (KID) and
      EFVE. The protein also binds c-di-GMP specifically in lysate DRaCALA, and the authors
      attribute this to the EAL domain. PDE activity has not been measured for VC0072, so
      this remains a phylogenetic and motif-based inference. It is the best-supported
      catalytic function of the protein.
    action: ACCEPT
    reason: >-
      The IBA inference is backed by an intact catalytic motif set and by specific
      c-di-GMP binding. Nothing argues for an inactive EAL domain.
    supported_by:
    - reference_id: file:VIBCH/VC_0072/VC_0072-bioinformatics/RESULTS.md
      supporting_text: >-
