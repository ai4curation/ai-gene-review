        present; the domain is predicted to be catalytically competent.
    - reference_id: file:VIBCH/VC_0072/VC_0072-deep-research-claude-code.md
      supporting_text: >-
        the EAL catalytic residues are intact (DDFGSG, EVL, conserved K/E/N)
    - reference_id: PMID:26506097
