taxon:
  id: NCBITaxon:243277
  label: Vibrio cholerae O1 biovar El Tor str. N16961
description: >-
  VC0072 is a 768-aa uncharacterized PAS-GGDEF-EAL protein of V. cholerae N16961,
  anchored in the inner membrane by an N-terminal hydrophobic segment and a single
  transmembrane helix (57-79), with its PAS, GGDEF and EAL domains in the cytoplasm. Both
  output domains keep canonical catalytic motifs: GGDEF has the GGDEF A-site, the DLD
  metal-binding motif and the HDAGD loop, and EAL has EVLVR, the N-loop Asn, DDFGSG, the
  catalytic Lys and the conserved Glu residues. The GGDEF domain lacks an RxxD I-site. In a
  DRaCALA ORFeome screen, lysates of E. coli expressing VC0072 bound 32P-c-di-GMP. Unlabeled
  c-di-GMP competed this binding but GTP and cGMP did not, and the authors attributed the
  binding to the EAL domain (PMID:26506097). Neither diguanylate cyclase nor
  phosphodiesterase activity has been measured, and no deletion phenotype has been
  reported. The gene is repressed during infant-mouse colonization (an ivr gene), and
  constitutive expression did not reduce colonization fitness (PMID:29463743). The protein
  is best regarded as a c-di-GMP-metabolizing enzyme, most likely a PDE and possibly
  bifunctional, with no assigned physiological role. The KBase dashboard sequence
  NZ_JAACMT010000013.1_13 is 99.7% identical to Q9KVR7 over 768 aligned residues. It is 17
  aa longer because its gene model starts at an upstream in-frame start codon.
