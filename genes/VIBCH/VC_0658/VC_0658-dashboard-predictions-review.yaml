description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for V. cholerae
  NZ_JABEED010000006.1_102 is "Integral inner-membrane c-di-GMP-binding protein containing
  GGDEF and EAL domains" (tier A), with GO:0035438 cyclic-di-GMP binding and GO:0005886 plasma
  membrane. The call is scored on the N16961 reference entry Q9KU65 (VC_0658, CdgI), which is
  99.7% identical to the dashboard sequence (679/681; two substitutions and a 4-residue
  deletion in a non-catalytic EAL loop). Both GO terms are correct. Plasma membrane is
  already in GOA (IBA), and c-di-GMP binding is novel to GOA but rests on a DRaCALA screen of
  the N16961 ORF (PMID:26506097). The call is accurate but under-specific. It declines to
  assign phosphodiesterase activity, yet the EAL domain keeps every conserved catalytic
  position, GOA already holds GO:0071111 cyclic-guanylate-specific phosphodiesterase
  activity by IBA, and the cdgI deletion phenotype led the original authors to conclude
  that CdgI acts as a PDE (PMID:18708497). The binding the call reports is most likely
  substrate binding by that EAL PDE site. The dashboard evidence did not identify the
  protein as the named gene cdgI or include the genetic study. Declining DGC activity is
  reasonable, because no assay or phenotype supports it even though the GGDEF A-site is
  intact.
