- id: PMID:26506097
  title: Systematic Identification of Cyclic-di-GMP Binding Proteins in Vibrio cholerae Reveals
    a Novel Class of Cyclic-di-GMP-Binding ATPases Associated with Type II Secretion Systems.
  findings:
  - statement: VC0658 binds c-di-GMP in the DRaCALA screen, apparently at its EAL domain.
    supporting_text: >-
      Four ORFs (VC0072, VC0658, VC0703 (MbaA), VC1934) were identified with both GGDEF and
      EAL domains, but lacking the RxxD motif, suggesting that c-di-GMP binding occurs at the
      EAL domain
- id: PMID:18708497
  title: Interplay between cyclic AMP-cyclic AMP receptor protein and cyclic di-GMP signaling
    in Vibrio cholerae biofilm formation.
  findings:
  - statement: The cdgI (VC0658) deletion phenotype indicates net PDE function.
    supporting_text: >-
      RocS and CdgI appear to function as a PDE under the experimental conditions that we
      utilized.
predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0035438
    label: cyclic-di-GMP binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct. The N16961 VC0658 ORF bound 32P-c-di-GMP in a DRaCALA screen
      of E. coli lysates, and unlabelled c-di-GMP competed the binding (PMID:26506097). The
      dashboard sequence is 99.7% identical to that ORF, with no catalytic-site differences.
      GOA has no cyclic-di-GMP binding annotation for Q9KU65, so the term is novel; the
      companion review adds it by IDA. The authors place the binding at the EAL domain
      because the protein lacks an RxxD I-site. The binding is therefore most likely
      substrate binding by the PDE active site. That makes the term true but much less
      informative than the phosphodiesterase activity already in GOA. The two terms are not
      parent and child, so this is not scored LSP.
    supported_by:
    - reference_id: PMID:26506097
      supporting_text: >-
        Four ORFs (VC0072, VC0658, VC0703 (MbaA), VC1934) were identified with both GGDEF and
        EAL domains, but lacking the RxxD motif, suggesting that c-di-GMP binding occurs at the
        EAL domain
    - reference_id: file:VIBCH/VC_0658/VC_0658-bioinformatics/RESULTS.md
      supporting_text: >-
        679 of 681 aligned positions are identical, giving 99.71% identity over the dashboard
        length.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005886
    label: plasma membrane
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      The prediction is correct but not novel. Q9KU65 already carries plasma membrane in GOA
      (IBA, PANTHER membrane-anchored GGDEF-EAL family). The dashboard sequence has the
      same two N-terminal hydrophobic segments (residues 17-36 and 162-181 on Q9KU65), and
      DeepTMHMM places it in the inner membrane with two helices. No experimental
      fractionation of VC0658 has been reported, so the location rests on topology
      prediction and family conservation.
    supported_by:
    - reference_id: file:VIBCH/VC_0658/VC_0658-bioinformatics/RESULTS.md
      supporting_text: >-
        The scan finds two hydrophobic segments, residues 17-36 (`SVFLVSVLLGLCFSFYHTLS`) and
        162-181 (`VLLFDLLRNTLLTTILLLFF`), which flank a roughly 125-residue loop.
    - reference_id: file:VIBCH/VC_0658/VC_0658-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: 'DeepTMHMM: Inner membrane (α-helical TM)'
