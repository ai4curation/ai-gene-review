- term:
    id: GO:0071732
    label: cellular response to nitric oxide
  evidence_type: IEA
  original_reference_id: GO_REF:0000117
  qualifier: involved_in
  supporting_entities:
  - ARBA:ARBA00085315
  review:
    summary: >-
      This is an ARBA association rule, probably carried over from H-NOX-regulated
      GGDEF/EAL proteins in other bacteria. VC0658 has no NO-sensing domain, and no H-NOX
      partner has been shown for it. In V. cholerae, NO exposure upregulates VC0658
      transcription (PMID:41329732), but that is a transcriptional response of the gene, not
      evidence that the protein takes part in the cellular NO response. The same study found
      the HnoX/HnoK system dispensable for NO-induced dispersal, and VC0658 was not tested
      genetically.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Induction of a transcript by a stimulus does not show that the gene product does any of
      the work of responding to it. No sensing or signalling role in the NO response has been
      shown for CdgI.
    supported_by:
    - reference_id: PMID:41329732
      supporting_text: >-
        Included among the genes with altered expression is VC0658, encoding the enzyme CdgI,
        which has been shown to be involved in dispersal
- term:
    id: GO:0035438
    label: cyclic-di-GMP binding
  evidence_type: IDA
  original_reference_id: PMID:26506097
  review:
    summary: >-
      VC0658 was positive for 32P-c-di-GMP binding in a DRaCALA screen of the N16961
      ORFeome expressed in E. coli lysates. Unlabelled c-di-GMP competed the binding. The
      protein has no RxxD I-site, so the authors attribute the binding to the EAL domain,
      where c-di-GMP is the substrate.
    action: NEW
    reason: >-
      This is direct binding evidence for the exact N16961 ORF, though measured in E. coli
      lysates and not with purified protein. Because the binding most likely reflects
      substrate binding by the EAL PDE domain, it is not a separate core function.
    supported_by:
    - reference_id: PMID:26506097
      supporting_text: >-
        individually testing Vibrio cholerae ORFs expressed in E. coli whole cell lysates for
        32P-c-di-GMP binding activity
    - reference_id: PMID:26506097
      supporting_text: >-
        Four ORFs (VC0072, VC0658, VC0703 (MbaA), VC1934) were identified with both GGDEF and
        EAL domains, but lacking the RxxD motif, suggesting that c-di-GMP binding occurs at the
        EAL domain
- term:
    id: GO:1900191
    label: negative regulation of single-species biofilm formation
  evidence_type: IMP
  original_reference_id: PMID:18708497
  review:
    summary: >-
      In-frame deletion of cdgI did not change biofilm formation in wild-type N16961. In the
      Δcrp background, where cdgI expression is raised, the deletion further enhanced
      biofilm formation. The authors interpret this as PDE action lowering c-di-GMP and so
      limiting biofilm formation.
    action: NEW
    reason: >-
      The phenotype shows that CdgI restrains biofilm formation under these conditions. The
      protein does part of the regulatory work, by hydrolysing the c-di-GMP signal that
      activates vps expression. The effect is conditional (seen only in Δcrp), so the
      annotation reflects a context-dependent role.
    supported_by:
    - reference_id: PMID:18708497
      supporting_text: >-
        deletion of rocS and VC0658 (designated cdgI ... in the Δ crp genetic background
        further enhanced biofilm formation
core_functions:
- description: >-
    Inner-membrane-anchored c-di-GMP phosphodiesterase (EAL domain catalytically intact) that
    lowers cellular c-di-GMP and restrains biofilm formation, at least when its expression is
    raised in Δcrp cells. Its GGDEF domain keeps a GGDEF A-site without an I-site. Whether
    CdgI also has DGC activity, and what its periplasmic loop senses, are unknown. Activity
    is inferred from the conserved active site, the PANTHER family annotation and the mutant
    phenotype. It has not been measured with purified protein.
