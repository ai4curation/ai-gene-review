suggested_questions:
- question: Does purified CdgI (cytoplasmic GGDEF-EAL module) hydrolyse c-di-GMP to pGpG, and does its intact GGDEF domain have any diguanylate cyclase activity?
- question: What does the ~125-residue periplasmic loop between the two TM helices sense, and does it switch CdgI between PDE and DGC output?
- question: Is CdgI required for biofilm dispersal in wild-type V. cholerae, and does it contribute to NO-induced dispersal?
suggested_experiments:
- description: Purify the cytoplasmic GGDEF-EAL region of CdgI and assay c-di-GMP hydrolysis and GTP-to-c-di-GMP synthesis by HPLC, with EAL (E447A) and GGDEF (GG321AA) active-site mutants.
  experiment_type: in vitro enzymology
- description: Measure c-di-GMP levels, vps expression and biofilm dispersal in clean ΔcdgI, complemented and active-site point-mutant strains, with and without NO donor.
  experiment_type: targeted genetics and physiology
