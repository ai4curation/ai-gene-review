  review:
    summary: >-
      This is the core activity. The EAL domain keeps every conserved catalytic position
      (EALIR, the Asn of INIS, ELEITE, DDFGTG, the Lys of KIDR, and EGVE). The cdgI deletion
      phenotype, enhanced biofilm formation in a Δcrp background, led the authors to conclude
      that CdgI acts as a PDE (PMID:18708497). The protein also binds c-di-GMP, apparently at
      the EAL domain (PMID:26506097). Activity has not been assayed with purified protein.
    action: ACCEPT
    reason: >-
      The IBA rests on many experimentally characterized EAL PDEs in E. coli and P.
      aeruginosa. VC0658 sits in that clade with an intact catalytic EAL site, and the
      genetic phenotype in V. cholerae is consistent with net PDE function. Nothing indicates
      loss of activity.
    supported_by:
    - reference_id: file:VIBCH/VC_0658/VC_0658-bioinformatics/RESULTS.md
      supporting_text: >-
        On sequence grounds the EAL domain is a canonical, presumably active c-di-GMP
        phosphodiesterase domain.
    - reference_id: PMID:18708497
      supporting_text: >-
        Although the enzymatic activities of these proteins have not been determined yet,
        based on biofilm-forming phenotypes, RocS and CdgI appear to function as a PDE under
        the experimental conditions that we utilized.
