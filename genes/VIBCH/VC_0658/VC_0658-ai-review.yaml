description: >-
  VC_0658 (CdgI) is a 685-aa inner-membrane GGDEF-EAL protein of Vibrio cholerae. It has two
  N-terminal transmembrane helices (about residues 17-36 and 162-181) that flank a periplasmic
  loop, followed by a cytoplasmic GGDEF domain with an intact GGDEF A-site motif (321-325) and
  no RxxD I-site, and a C-terminal EAL domain in which all the conserved catalytic positions
  (EALIR, DDFGTG, the Lys of KIDR, and the Asn and Glu residues) are retained. The GGDEF and
  EAL domains are therefore both sequence-intact, but the genetic data point to net
  c-di-GMP phosphodiesterase output. Deleting cdgI in a Δcrp background further enhanced
  biofilm formation, and the authors concluded that CdgI appears to act as a PDE
  (PMID:18708497). The ORF binds c-di-GMP in a DRaCALA screen of E. coli lysates. Because it
  lacks an I-site, the binding was attributed to the EAL domain (PMID:26506097). No
  purified-enzyme PDE or DGC assay has been reported, so the phosphodiesterase activity is
  inferred from motif conservation, the PANTHER phylogenetic annotation and the mutant
  phenotype. cdgI is induced in Δcrp cells (PMID:18708497) and by nitric oxide
  (PMID:41329732), and its promoter is bound by RpoS (PMID:40953128). Later papers say CdgI
  is involved in biofilm dispersal (PMID:41329732), citing a dispersal screen
  (PMID:33288715) whose text does not name the gene. The KBase dashboard sequence
  NZ_JABEED010000006.1_102 is 99.7% identical (679/681) to Q9KU65 and differs by two
  substitutions and a 4-residue deletion in a non-catalytic EAL loop.
