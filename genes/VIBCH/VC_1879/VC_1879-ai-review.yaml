- term:
    id: GO:0009290
    label: DNA import into cell involved in transformation
  evidence_type: IMP
  original_reference_id: PMID:24127573
  review:
    summary: >-
      New annotation. A V. cholerae comEC deletion is non-transformable, yet transforming
      DNA still accumulates in a DNase-protected periplasmic pool. ComEC is therefore
      required for, and positioned at, the inner-membrane step of DNA import during
      natural transformation. It does work in this step as the inner-membrane DNA
      conduit, rather than being a regulator or substrate.
    action: NEW
    reason: >-
      Direct mutant evidence in V. cholerae (strain A1552) for the inner-membrane step.
      It is supported by a second study from the same group and by the conserved role of
      ComEC across transformable bacteria.
    supported_by:
    - reference_id: PMID:24127573
      supporting_text: >-
        we detected tDNA only in strains lacking comEC , comF , or recA and not in
        Tfp-related mutants or a comEA − strain
    - reference_id: PMID:24127573
      supporting_text: >-
        ComEA shuttles the tDNA through the periplasm and toward the inner membrane
        aqueous channel ComEC ( 34 ), which, potentially in concert with ComF, transports
        a single DNA strand into the cytoplasm.
    - reference_id: PMID:25139903
      supporting_text: >-
        whereas deletion strains lacking either comEC or comF were nontransformable
    - reference_id: file:VIBCH/VC_1879/VC_1879-deep-research-claude-code.md
      supporting_text: >-
        So *V. cholerae* ComEC is a **full‑architecture, catalytically intact** family member
- term:
    id: GO:0051035
    label: DNA transmembrane transporter activity
  evidence_type: ISS
  original_reference_id: PMID:33772889
  review:
    summary: >-
      New annotation. ComEC is the conserved DNA translocase/channel of the cytoplasmic
      membrane in natural transformation. V. cholerae comEC mutants accumulate
      transforming DNA in the periplasm, which fits loss of the transmembrane
      translocation step. Transport by purified ComEC has not been reconstituted for any
      species, so the activity is inferred from family-level genetics and topology.
      Whether the protein is a passive channel is unknown, so the transporter term is
      used instead of channel activity.
    action: NEW
    reason: >-
      Family-level inference from B. subtilis and other ComEC proteins, consistent with
      the V. cholerae mutant phenotype (PMID:24127573) and the conserved Competence-domain
      architecture (VC_1879-bioinformatics).
    supported_by:
    - reference_id: PMID:33772889
      supporting_text: The DNA transport channel is provided by the protein ComEC.
    - reference_id: PMID:25139903
      supporting_text: >-
        Based on studies of other naturally competent bacteria, it is assumed that the
        transport of the tDNA across the inner membrane occurs through a putative channel
        formed by the ComEC protein (43).
- term:
    id: GO:0004536
    label: DNA nuclease activity
  evidence_type: ISS
  original_reference_id: PMID:33772889
  review:
    summary: >-
      New annotation. VC_1879 has the C-terminal MBL-like domain found in about half of
      ComEC proteins. Its motif II (HLDNDH) aligns with HADQDH of B. subtilis ComEC and
      HDDNDH of H. influenzae Rec2, and both metal-ligand aspartates are kept. The
      M. thermoacetica ComEC CTD is a Mn2+-dependent DNA nuclease. Substituting the motif
      II aspartates abolishes this activity, and the same substitutions in B. subtilis
      ComEC strongly impair transformation. The activity has not been tested for a
      Vibrio ComEC.
    action: NEW
    reason: >-
      Inference from a biochemically characterized ComEC CTD, supported by conservation of
      the metal-binding residues in VC_1879.
    supported_by:
    - reference_id: PMID:33772889
      supporting_text: >-
        Disruption of the CTD metal binding site abolishes nuclease activity and strongly
        impairs the ability of ComEC to support transformation in B.
    - reference_id: file:VIBCH/VC_1879/VC_1879-bioinformatics/RESULTS.md
      supporting_text: >-
        The C-terminal MBL-like domain keeps the metal-binding motif II as HLDNDH at residues 556-561
    - reference_id: PMID:40985778
      supporting_text: >-
        Taken together, BLACTMg coordinates two Mn2+ in its catalytic centre in order to
        function as a DNA nuclease.
    - reference_id: PMID:40985778
      supporting_text: >-
        In our in vivo transformation assay, all mutations that reduced nuclease activity
        in vitro completely abrogated transformation
    - reference_id: PMID:27318187
      supporting_text: >-
        the β-lactamase-like domain is the hitherto cryptic competence nuclease
