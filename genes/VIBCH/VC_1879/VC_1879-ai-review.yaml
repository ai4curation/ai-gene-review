  label: Vibrio cholerae O1 biovar El Tor str. N16961
description: >-
  VC_1879 (VC1879) encodes ComEC, the inner-membrane competence protein of the natural
  transformation DNA-uptake machinery of Vibrio cholerae. UniProt names it only
  "Rec2-related protein". The 752-residue protein has the complete ComEC architecture: an
  N-terminal ComEC_N/DUF4131 region (predicted OB-fold DNA-binding domain), the polytopic
  Competence domain (PF03772) that is thought to form the transmembrane DNA conduit, and a
  C-terminal metallo-beta-lactamase-like domain (residues 506-689). The MBL domain keeps the
  ComEC-type metal-binding motif II (HLDNDH, 556-561). In V. cholerae, comEC deletion
  abolishes chitin-induced and TfoX-induced transformation, but the transforming DNA still
  reaches a DNase-protected periplasmic compartment. ComEC therefore acts downstream of the
  type IV pilus and ComEA, in moving DNA across the inner membrane into the cytoplasm
  (PMID:24127573, PMID:25139903). By homology to B. subtilis ComEC, it is thought to form
  the channel that carries a single DNA strand across the cytoplasmic membrane. Its
  periplasm-facing MBL domain is predicted to be the Mn2+-dependent nuclease that degrades
  the non-transforming strand, as shown for the M. thermoacetica ComEC CTD (PMID:33772889).
  Neither the channel mechanism (passive pore or energized transport) nor the nuclease
  activity has been tested directly for any Vibrio ComEC.
