- term:
    id: GO:0030420
    label: establishment of competence for transformation
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004797
  review:
    summary: >-
      GO:0030420 covers the process by which a bacterium becomes able to take up DNA
      (regulation and assembly of the uptake machinery). ComEC does not establish
      competence. It is a structural, catalytic part of the uptake machinery and acts in
      the DNA uptake step itself. In V. cholerae, comEC is not needed for DNA to cross
      the outer membrane, but transforming DNA does not enter the cytoplasm without it
      (PMID:24127573).
    action: MODIFY
    reason: >-
      The InterPro2GO mapping describes the competence system as a whole. For ComEC, the
      accurate process is DNA import into cell involved in transformation (GO:0009290).
    proposed_replacement_terms:
    - id: GO:0009290
      label: DNA import into cell involved in transformation
    supported_by:
    - reference_id: PMID:24127573
      supporting_text: >-
        a recently developed DNA-uptake assay ( 16 ) allowed us to distinguish these two
        processes via the accumulation of tDNA within the periplasm in mutants defective
        for transport across the inner membrane
    - reference_id: PMID:24127573
      supporting_text: >-
        we detected tDNA only in strains lacking comEC , comF , or recA and not in
