- id: PMID:24127573
  title: DNA-uptake machinery of naturally competent Vibrio cholerae.
  findings:
  - statement: >-
      In V. cholerae, comEC mutants are non-transformable but still accumulate
      transforming DNA in the periplasm, so ComEC acts at the inner-membrane step.
    supporting_text: >-
      we detected tDNA only in strains lacking comEC , comF , or recA and not in
      Tfp-related mutants or a comEA − strain
  - statement: The authors describe ComEC as the inner membrane aqueous channel.
    supporting_text: >-
      ComEA shuttles the tDNA through the periplasm and toward the inner membrane aqueous
      channel ComEC ( 34 ), which, potentially in concert with ComF, transports a single
      DNA strand into the cytoplasm.
- id: PMID:25139903
  title: DNA transport across the outer and inner membranes of naturally transformable
    Vibrio cholerae is spatially but not temporally coupled.
  findings:
  - statement: comEC deletion abolishes transformation in V. cholerae.
    supporting_text: whereas deletion strains lacking either comEC or comF were nontransformable
  - statement: The ComEC channel is assumed from work in other bacteria, not shown in V. cholerae.
    supporting_text: >-
      Based on studies of other naturally competent bacteria, it is assumed that the
      transport of the tDNA across the inner membrane occurs through a putative channel
      formed by the ComEC protein (43).
- id: PMID:33772889
  title: The DNA transporter ComEC has metal-dependent nuclease activity that is important
    for natural transformation.
  findings:
  - statement: The ComEC MBL-like CTD is a Mn2+-dependent nuclease needed for efficient transformation.
    supporting_text: >-
      Disruption of the CTD metal binding site abolishes nuclease activity and strongly
      impairs the ability of ComEC to support transformation in B.
- id: PMID:40985778
  title: Molecular interplay between ComEC domains allows for selective degradation of
    the non-translocating strand during natural transformation.
  findings:
  - statement: >-
      The Moorella glycerini ComEC beta-lactamase-like domain is a two-Mn2+ DNA nuclease.
      Nuclease-reducing mutations abolish transformation in the Gram-negative
      L. pneumophila.
    supporting_text: >-
      In our in vivo transformation assay, all mutations that reduced nuclease activity
      in vitro completely abrogated transformation
  - statement: >-
      The competence domain is predicted, not measured, to form the DNA channel. The
      model has nuclease activity rather than ATP drive DNA entry through ComEC.
    supporting_text: >-
      The competence domain appears to be universally conserved across competent species
      and is predicted to form the DNA channel critical for ComEC’s role of DNA transport
      across the cytoplasmic membrane
  - statement: Proposed energetics of ComEC translocation.
    supporting_text: >-
      Initially this process in ComEC would not be powered by ATP hydrolysis, but would
      likely be driven by the activity of the β-lactamase-like domain.
- id: file:VIBCH/VC_1879/VC_1879-deep-research-claude-code.md
  title: Deep research report on VC_1879 (claude-code provider)
  findings:
  - statement: >-
      The deep research report identified the Stedman et al. 2025 ComEC domain study and
      reached the same conclusion on domain architecture.
    supporting_text: >-
      So *V. cholerae* ComEC is a **full‑architecture, catalytically intact** family member
- id: PMID:27318187
  title: Potential DNA binding and nuclease functions of ComEC domains characterized in silico.
  findings:
  - statement: The ComEC MBL-like domain was predicted to be the competence nuclease.
    supporting_text: the β-lactamase-like domain is the hitherto cryptic competence nuclease
- id: PMID:15661011
  title: 'Biogenesis of a putative channel protein, ComEC, required for DNA uptake: membrane
    topology, oligomerization and formation of disulphide bonds.'
  findings:
  - statement: B. subtilis ComEC is a polytopic membrane protein and putative DNA channel.
    supporting_text: >-
      Membrane topology studies suggest a model of ComEC as a multispanning membrane
      protein with seven transmembrane segments (TMSs)
- id: PMID:26401962
  title: CytR Is a Global Positive Regulator of Competence, Type VI Secretion, and Chitinases
    in Vibrio cholerae.
  findings:
  - statement: >-
      In strain C6706, comEC (vc1879) expression was not controlled by CytR. Its
      induction by TfoX was strain-dependent.
    supporting_text: >-
      In C6706 comEC was <2-fold induced under all conditions tested (Fig 1, S1 Dataset),
      in contrast to modest TfoX induction reported in A1552 [15].
- id: file:VIBCH/VC_1879/VC_1879-bioinformatics/RESULTS.md
  title: 'VC_1879 (Q9KQW8) ComEC/Rec2: sequence checks'
  findings:
  - statement: The MBL-like CTD is present with conserved motif II metal ligands.
    supporting_text: >-
      The C-terminal MBL-like domain keeps the metal-binding motif II as HLDNDH at residues 556-561
