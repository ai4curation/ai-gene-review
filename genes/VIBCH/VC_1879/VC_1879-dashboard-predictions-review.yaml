- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005886
    label: plasma membrane
  predicted_term_type: GO_CC
  review:
    assessment: CNN
    confidence_score: 2
    summary: >-
      The prediction is correct and is already in GOA as both IBA (PANTHER) and IEA
      (UniProt subcellular location). ComEC is a polytopic cytoplasmic-membrane protein:
      the B. subtilis topology has been mapped experimentally, and VC_1879 has 9 Phobius
      (13 DeepTMHMM) TM helices. "Inner membrane" in the call corresponds to the plasma
      membrane of a Gram-negative bacterium.
    supported_by:
    - reference_id: PMID:15661011
      supporting_text: >-
        Membrane topology studies suggest a model of ComEC as a multispanning membrane
        protein with seven transmembrane segments (TMSs)
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005215
    label: transporter activity
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct at the broad level stated. ComEC is the conserved
      cytoplasmic-membrane component that moves one strand of transforming DNA into the
      cytoplasm. In V. cholerae, loss of comEC traps the DNA in the periplasm
      (PMID:24127573). Transport has not been reconstituted with purified ComEC, so the
      activity is a family-level inference supported by genetics and structure prediction.
      GOA has no molecular function for Q9KQW8, so the term is novel. The companion review
      annotates the more specific GO:0051035 DNA transmembrane transporter activity by ISS.
      No curated annotation of that kind exists in GOA, so LSP does not apply.
    supported_by:
    - reference_id: PMID:33772889
      supporting_text: The DNA transport channel is provided by the protein ComEC.
    - reference_id: PMID:24127573
      supporting_text: >-
        we detected tDNA only in strains lacking comEC , comF , or recA and not in
        Tfp-related mutants or a comEA − strain
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0015267
    label: channel activity
  predicted_term_type: GO_MF
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      The evidence neither establishes nor refutes this term. GO channel activity is
      energy-independent facilitated diffusion through an aqueous pore. For ComEC, the
      pore is predicted from structure models of the competence domain (PMID:40985778).
      The V. cholerae papers describe it as a "putative" channel assumed from other
      bacteria (PMID:25139903). No conductance, pore or transport measurement exists for
      any ComEC. Proposed energetics differ: Stedman et al. suggest the nuclease drives
      entry without ATP, and cytoplasmic ATP-dependent partners (ComFA, ComF) may pull the
      strand. The GO extractor took the term from the phrase "DNA uptake channel". The
      term is absent from GOA. Transporter activity, the safer parent class, is scored
      separately.
    supported_by:
    - reference_id: PMID:40985778
      supporting_text: >-
        The competence domain appears to be universally conserved across competent species
        and is predicted to form the DNA channel critical for ComEC’s role of DNA transport
        across the cytoplasmic membrane
    - reference_id: PMID:25139903
      supporting_text: >-
        Based on studies of other naturally competent bacteria, it is assumed that the
        transport of the tDNA across the inner membrane occurs through a putative channel
        formed by the ComEC protein (43).
    - reference_id: file:VIBCH/VC_1879/VC_1879-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: >-
        This directly supports a cellular component (CC) of the plasma membrane (the
        bacterial inner membrane) and a molecular function (MF) of channel activity and
        transporter activity.
