- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0009290
    label: DNA import into cell involved in transformation
  predicted_term_type: GO_BP
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct and is supported by mutant data on V. cholerae itself.
      comEC deletion strains are non-transformable, but transforming DNA still accumulates
      in a DNase-protected periplasmic pool, which places ComEC at the inner-membrane step
      of DNA import (PMID:24127573). GOA has only the IEA term "establishment of competence
      for transformation" (GO:0030420), which is a different process. The companion review
      replaces it with GO:0009290, so the predicted term is novel and at the right level of
      specificity.
    supported_by:
