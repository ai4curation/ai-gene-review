- id: PMID:24127573
  title: DNA-uptake machinery of naturally competent Vibrio cholerae.
  findings:
  - statement: V. cholerae comEC mutants accumulate transforming DNA in the periplasm.
    supporting_text: >-
      we detected tDNA only in strains lacking comEC , comF , or recA and not in
      Tfp-related mutants or a comEA − strain
- id: PMID:25139903
  title: DNA transport across the outer and inner membranes of naturally transformable
    Vibrio cholerae is spatially but not temporally coupled.
  findings:
  - statement: comEC deletion abolishes transformation in V. cholerae.
    supporting_text: whereas deletion strains lacking either comEC or comF were nontransformable
  - statement: The ComEC channel is assumed in V. cholerae from other bacteria.
    supporting_text: >-
      Based on studies of other naturally competent bacteria, it is assumed that the
      transport of the tDNA across the inner membrane occurs through a putative channel
      formed by the ComEC protein (43).
- id: PMID:40985778
  title: Molecular interplay between ComEC domains allows for selective degradation of
    the non-translocating strand during natural transformation.
  findings:
  - statement: The channel is a structural prediction.
    supporting_text: >-
      The competence domain appears to be universally conserved across competent species
      and is predicted to form the DNA channel critical for ComEC’s role of DNA transport
      across the cytoplasmic membrane
- id: PMID:33772889
  title: The DNA transporter ComEC has metal-dependent nuclease activity that is important
    for natural transformation.
  findings:
  - statement: The ComEC CTD is a metal-dependent nuclease needed for efficient transformation.
    supporting_text: >-
      Disruption of the CTD metal binding site abolishes nuclease activity and strongly
      impairs the ability of ComEC to support transformation in B.
- id: PMID:15661011
  title: 'Biogenesis of a putative channel protein, ComEC, required for DNA uptake: membrane
    topology, oligomerization and formation of disulphide bonds.'
  findings:
  - statement: ComEC is a polytopic membrane protein.
    supporting_text: >-
      Membrane topology studies suggest a model of ComEC as a multispanning membrane
      protein with seven transmembrane segments (TMSs)
