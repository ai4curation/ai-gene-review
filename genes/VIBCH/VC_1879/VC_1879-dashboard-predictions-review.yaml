  title: gene-annotate dashboard review page for NZ_CWQE01000001.1_287
  findings:
  - statement: The dashboard call is ComEC/Rec2, an inner-membrane DNA uptake channel.
    supporting_text: >-
      ComEC/Rec2 inner membrane DNA uptake channel mediating single-stranded DNA
      translocation during natural transformation.
  - statement: The annotator discounted any catalytic activity of the MBL-like domain.
    supporting_text: >-
      the metallo-beta-lactamase-like domain occurs within a specifically identified ComEC
      architecture and does not establish antibiotic hydrolysis or a separate catalytic
      activity
  - statement: The channel activity term was extracted from the phrase "DNA uptake channel".
    supporting_text: >-
      This directly supports a cellular component (CC) of the plasma membrane (the
      bacterial inner membrane) and a molecular function (MF) of channel activity and
      transporter activity.
