description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for V. cholerae
  NZ_CWQE01000001.1_287 is "ComEC/Rec2 inner membrane DNA uptake channel mediating
  single-stranded DNA translocation during natural transformation" (tier A). It carries five
  GO terms: GO:0015267 channel activity, GO:0005215 transporter activity, GO:0009290 DNA
  import into cell involved in transformation, GO:0009294 DNA-mediated transformation and
  GO:0005886 plasma membrane. The dashboard sequence (756 aa, with 9 X residues) is 100%
  identical over 747 aligned residues to the N16961 reference-proteome entry Q9KQW8
  (VC_1879, 752 aa), so the call is scored on Q9KQW8. The identification as ComEC is
  correct. In V. cholerae, comEC deletion abolishes transformation while transforming DNA
  still reaches the periplasm, which places ComEC at the inner-membrane step of DNA import
  (PMID:24127573). The process, transporter and membrane terms are supported. Channel
  activity is scored uncertain. A DNA channel through the competence domain is a
  structural prediction for ComEC proteins (PMID:40985778), and V. cholerae papers call it
  "putative" (PMID:25139903). No ComEC has been shown to mediate energy-independent
  facilitated diffusion, which is what the GO channel term requires. The call misses one
  function. It dismisses the C-terminal metallo-beta-lactamase-like domain as carrying "a
  separate catalytic activity" that is not established. In fact the ComEC CTD is a
  biochemically demonstrated Mn2+-dependent nuclease that transformation requires
  (PMID:33772889, PMID:40985778). VC_1879 keeps the domain's motif II metal ligands
  (HLDNDH, 556-561), so the companion review annotates DNA nuclease activity by ISS. The
  annotator relied on a 98.8%-identity V. cholerae homolog whose cited paper (PMID:26401962)
  covers only regulation, and on a 31%-identity H. influenzae Rec2. The direct V. cholerae
  uptake genetics (PMID:24127573, PMID:25139903) were not in its evidence.
