description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for V. cholerae
  NZ_AFOM01000014.1_606 is "Inner-membrane c-di-GMP-binding protein containing HAMP and GGDEF
  signaling domains" (tier A). It carries two GO terms: GO:0035438 cyclic-di-GMP binding and
  GO:0005886 plasma membrane. The dashboard sequence is identical over all 443 residues to N16961
  VC_1370 (UniProt Q9KS89), so the call is scored on that entry.

  Both GO terms are correct and absent from GOA: GOA has only the parent term "membrane".
  The call is nonetheless under-called. Its own evidence block showed an intact GGDEF domain,
  PaperBLAST snippets describing VC1370 as a DGC whose ectopic expression causes biofilm, and
  a PANTHER/eggNOG DGC assignment. The annotator chose the c-di-GMP-binding label because
  "binding does not establish catalysis", which leaves out the protein's primary activity.

  Sequence analysis shows the GGDEF domain is catalytically intact: GGDEF A-site at 349-353,
  DxD metal site, GTP-binding NxxxGHxxGD, and a canonical RxxD (RESD) I-site. The DRaCALA
  binding that the call rests on is what the I-site of an active DGC would give, that is,
  allosteric product inhibition. It does not indicate a non-catalytic receptor. GOA already
  holds diguanylate cyclase activity (GO:0052621, IBA), and the companion review accepts it as
  the core function. Recommended dashboard verdict: "under-called". Suggested corrected
  annotation: "Inner-membrane HAMP-GGDEF diguanylate cyclase with c-di-GMP-binding I-site".
  No direct assay of purified VC1370 exists.
