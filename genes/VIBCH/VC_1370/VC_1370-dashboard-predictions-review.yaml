predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0035438
    label: cyclic-di-GMP binding
  predicted_term_type: GO_MF
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct and novel: GOA for Q9KS89 has no c-di-GMP binding term. VC1370
      bound c-di-GMP, with competition, in the V. cholerae ORFeome DRaCALA screen, which used
      E. coli lysates and not purified protein. It has a canonical RESD I-site placed as in
      PleD. The binding is the I-site property of an active diguanylate cyclase. It is true but
      secondary, and it is not a substitute for the cyclase activity, which is in GOA as an IBA
      and which this call omitted. That omission affects the call's overall verdict
      (under-called), not the correctness of this term. LSP does not apply: binding and
      catalysis are different activities, not a parent/child pair.
    supported_by:
    - reference_id: PMID:26506097
      supporting_text: >-
        Of the proteins containing only the GGDEF domain, three ORFs identified contain the RxxD
        motif required for c-di-GMP binding (VC1370, VC2370, VCA0965 (CdgF))
    - reference_id: file:VIBCH/VC_1370/VC_1370-bioinformatics/RESULTS.md
      supporting_text: >-
        The RxxD I-site is present as RESD at 340-343.
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005886
    label: plasma membrane
  predicted_term_type: GO_CC
  review:
    assessment: COR
    confidence_score: 2
    summary: >-
      The prediction is correct and more specific than GOA, which has only the InterPro-derived
      parent GO:0016020 membrane. The protein has two alpha-helical TM segments (5-32 and
      165-193) that flank a periplasmic region, followed by cytoplasmic HAMP and GGDEF domains.
      In a diderm bacterium this is the inner (cytoplasmic) membrane topology of a sensor DGC.
      The localization is predicted, not shown experimentally; Krin et al. likewise annotate
      VC1370 as an inner membrane protein.
    supported_by:
    - reference_id: file:VIBCH/VC_1370/VC_1370-bioinformatics/RESULTS.md
      supporting_text: >-
        Kyte-Doolittle 19-residue windows with mean >= 1.6 find two
        segments: 5-32 and 165-193.
