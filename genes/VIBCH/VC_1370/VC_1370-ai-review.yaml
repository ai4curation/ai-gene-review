core_functions:
- description: >-
    Inner-membrane sensor diguanylate cyclase. A periplasmic input region between two TM
    helices signals through a HAMP domain and coiled coil to a catalytically intact GGDEF
    domain, which condenses two GTP into c-di-GMP. The canonical RxxD I-site binds c-di-GMP,
    presumably for allosteric product inhibition. Expression rises at high cell density
    (quorum sensing) and under SOS, RpoS and nitric oxide stress.
