description: >-
  VC_1370 (VC1370; dashboard protein NZ_AFOM01000014.1_606, 100% identical over all 443
  residues) is an inner-membrane GGDEF-domain diguanylate cyclase (DGC) of V. cholerae with no
  assigned gene name. Its topology is TM1, a ~130-residue periplasmic region, TM2, HAMP,
  coiled coil, GGDEF. This is the layout of a sensor DGC in which a periplasmic input signal is
  relayed through the HAMP domain to the cytoplasmic cyclase. The ligand sensed is unknown.

  The GGDEF domain is not degenerate. It has an intact A-site (RLGGDEF, 349-353), the beta1
  DxD metal site (DLD 308-310), the GTP-binding NxxxGHxxGD stretch, and a canonical primary
  I-site (RESD 340-343) spaced from GGDEF as in PleD. In a DRaCALA ORFeome screen, VC1370
  bound c-di-GMP competitively (PMID:26506097), as expected for I-site product inhibition of
  an active DGC. No in vitro cyclase assay on purified VC1370 has been published, so DGC
  activity rests on sequence and family evidence. A full-text statement in Massie et al. 2012
  (PMID:22802636) supports it: VC1370 was among the DGCs that induced biofilm when
  overexpressed in the MBEC assay, although not by flow cytometry. The cached file holds only
  that paper's abstract, so it is not quoted here.

  vc1370 transcription is induced at high cell density by quorum sensing, indirectly, since
  HapR does not bind its promoter (PMID:18223081). It is also co-transcribed with VC1369 as a
  new member of the SOS regulon; the vc1369 and vc1370 mutants were less UV resistant
  (PMID:29783948). RpoS binds its promoter directly (PMID:40953128), and nitric oxide induces
  it (PMID:41329732).
