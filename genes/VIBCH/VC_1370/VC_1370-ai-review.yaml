    summary: >-
      Accepted as the core molecular function. The GGDEF domain keeps every catalytic
      hallmark: the GGDEF A-site, the DxD metal site, and the GTP-binding NxxxGHxxGD stretch.
      It also has a canonical RxxD I-site, the product-inhibition site found in active DGCs.
      No purified-protein assay exists, but the IBA is well founded and fits the
      c-di-GMP-dependent phenotypes reported in V. cholerae.
    action: ACCEPT
