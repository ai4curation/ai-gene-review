knowledge_gaps:
- gap_statement: >-
    No purified-protein DGC assay or catalytic-site (GGDEF to GGAAF) mutant has been reported
    for VC1370, so cyclase activity is inferred, not measured. Binding was shown only in E.
    coli lysates, and no Kd has been measured.
  gap_kind:
  - BIOLOGY
- gap_statement: >-
    The periplasmic input signal is unknown. So is whether the reduced UV survival of the
    vc1370 mutant depends on c-di-GMP synthesis.
  gap_kind:
  - BIOLOGY
