- term:
    id: GO:0035438
    label: cyclic-di-GMP binding
  evidence_type: IDA
  original_reference_id: PMID:26506097
  qualifier: enables
  review:
    summary: >-
      New annotation. In the DRaCALA screen of the V. cholerae ORFeome, VC1370 bound
      32P-c-di-GMP, and unlabeled c-di-GMP competed the binding away. It is one of three
      GGDEF-only proteins with the RxxD I-site that scored positive. The assay used E. coli
      lysates overexpressing the ORF, not purified protein. For a DGC, this binding is the
      allosteric product-inhibition (I-site) property, so it is a regulatory feature, not the
      core activity.
    action: NEW
    reason: >-
      Direct, competition-controlled binding was shown for this exact protein, and it is
      consistent with the intact RESD I-site.
    supported_by:
    - reference_id: PMID:26506097
      supporting_text: >-
        Of the proteins containing only the GGDEF domain, three ORFs identified contain the
        RxxD motif required for c-di-GMP binding (VC1370, VC2370, VCA0965 (CdgF)), which is
        present in only 11 of the 37 ORFs with GGDEF domains
    - reference_id: file:VIBCH/VC_1370/VC_1370-bioinformatics/RESULTS.md
      supporting_text: >-
        The RxxD I-site is present as RESD at 340-343.
