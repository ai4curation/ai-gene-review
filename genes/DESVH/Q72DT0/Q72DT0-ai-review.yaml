taxon:
  id: NCBITaxon:882
  label: Nitratidesulfovibrio vulgaris (Desulfovibrio vulgaris Hildenborough)
description: |
  QmoB (DVU_0849) is subunit B of the quinone-interacting membrane-bound
  oxidoreductase (QmoABC) complex of Desulfovibrio vulgaris Hildenborough,
  encoded in the aprBA-qmoABC gene cluster (DVU_0846-DVU_0850). It is a soluble
  iron-sulfur flavoprotein of the HdrA family that, with QmoA, forms the
  cytoplasmic part of the complex; the membrane subunit QmoC exchanges electrons
  with the menaquinone pool. In addition to its HdrA-like FAD-binding region,
  QmoB carries a C-terminal MvhD/FlpD-like domain with two 4Fe-4S
  ferredoxin-type motifs. The QmoABC complex is required for growth with
  sulfate as terminal electron acceptor and is proposed to supply electrons to
  adenylylsulfate (APS) reductase AprAB in dissimilatory sulfate reduction,
  possibly by flavin-based electron confurcation. The specific partner and
  reaction of QmoB within this process are not yet established.
