suggested_questions:
- question: What is the physiological partner of QmoB, suggested by its HdrA and MvhD similarity?
- question: Is QmoB (rather than QmoA) the site of flavin-based electron confurcation in the Qmo complex?
- question: What is the role of the fourth Qmo-associated protein QmoD (DVU_0851) that co-purifies with QmoB?
suggested_experiments:
- description: Reconstitute menaquinol-dependent APS reduction with purified QmoABC and AprAB plus candidate low-potential donors (e.g. reduced ferredoxin)
  hypothesis: APS reduction by QmoABC requires a second low-potential electron donor that interacts with QmoB
- description: Site-directed mutagenesis of the cysteine ligands of the two ferredoxin-type motifs of QmoB
  hypothesis: Loss of the QmoB [4Fe-4S] clusters abolishes sulfate-dependent growth without disrupting QmoABC assembly
