- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: TAS
  original_reference_id: DOI:10.3389/fmicb.2012.00137
  review:
    summary: |
      QmoB is an HdrA-family flavoprotein; UniProt lists FAD as cofactor (ARBA)
      and the QmoABC complex binds two FAD groups, carried by its two HdrA-like
      subunits.
    action: NEW
    reason: |
      FAD binding is not in GOA although UniProt assigns the FAD cofactor. The
      Qmo literature describes QmoB as a flavoprotein and the complex as
      containing two FAD groups. Evidence code TAS because this is an author
      statement in a primary Qmo paper rather than a QmoB-specific cofactor
      assay.
