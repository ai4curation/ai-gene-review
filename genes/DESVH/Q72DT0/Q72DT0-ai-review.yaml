    id: GO:0009055
    label: electron transfer activity
  description: |
    QmoB is a cytoplasmic HdrA-family iron-sulfur flavoprotein subunit of the
    QmoABC complex, which transfers electrons between the menaquinone pool and
    APS reductase during dissimilatory sulfate reduction. QmoB's own partner
    and reaction are not established; its HdrA and MvhD similarity suggests it
    engages an additional physiological partner, possibly in electron
    confurcation.
