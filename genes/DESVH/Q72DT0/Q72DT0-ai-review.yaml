- term:
    id: GO:0019420
    label: dissimilatory sulfate reduction
  evidence_type: TAS
  original_reference_id: DOI:10.3389/fmicb.2012.00137
  review:
    summary: |
      QmoB is a redox subunit of the QmoABC complex, which is required for
      growth with sulfate as electron acceptor and is proposed to supply
      electrons to APS reductase.
    action: NEW
    reason: |
      QmoB is a cofactor-carrying subunit of the complex that does the electron
      delivery step to AprAB, so this is participation rather than mere
      necessity. Earlier versions of this row cited a thesis about the
      FlxABCD-HdrABC complex (DVU_2399-DVU_2405), a different locus; that basis
      was invalid and has been replaced. TAS because the qmoABC deletion
      phenotype (Zane et al. 2010) is reported via Ramos et al. 2012.
    supported_by:
      - reference_id: DOI:10.3389/fmicb.2012.00137
        supporting_text: >-
          In Desulfovibrio vulgaris Hildenborough a deletion mutant of the qmoABC genes could not grow with sulfate as electron acceptor
      - reference_id: DOI:10.3389/fmicb.2012.00137
        supporting_text: >-
          The QmoABC complex has one membrane (QmoC) and two cytoplasmic subunits (QmoAB)
