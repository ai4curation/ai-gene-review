suggested_questions:
- question: >
    Does QmoABC reduce AprAB by flavin-based electron confurcation, and if so
    what is the second (low-potential) electron donor?
- question: >
    Which Qmo subunit (QmoA or QmoB) carries out the flavin chemistry, and does
    QmoA bind a [4Fe-4S] cluster in vivo?

suggested_experiments:
- description: >
    Reconstitute menaquinol-dependent APS reduction with purified QmoABC and
    AprAB in the presence of candidate low-potential donors (reduced ferredoxin)
  hypothesis: >
    APS reduction by QmoABC requires a second, low-potential electron donor,
    consistent with electron confurcation
  experiment_type: biochemical assay
- description: >
    Characterize growth of the D. vulgaris qmoA single deletion strain with
    sulfate, sulfite and thiosulfate as electron acceptors
  hypothesis: >
    Loss of QmoA alone phenocopies the qmoABC deletion (no growth on sulfate)
  experiment_type: genetic analysis
