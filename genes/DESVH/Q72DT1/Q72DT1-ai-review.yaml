- term:
    id: GO:0019420
    label: dissimilatory sulfate reduction
  evidence_type: TAS
  original_reference_id: DOI:10.3389/fmicb.2012.00137
  review:
    summary: >
      QmoA is the QmoABC subunit that contacts APS reductase (AprAB), the enzyme
      that reduces APS to sulfite in dissimilatory sulfate reduction, and the
      qmoABC genes are required for growth with sulfate as electron acceptor.
    action: NEW
    reason: >
      Participation, not only necessity: QmoA is part of the electron-transfer
      complex proposed to deliver reducing equivalents to AprAB (an electron
      donor to a pathway step), and it is the Qmo subunit that physically
      interacts with AprAB. This replaces an earlier NEW proposal of GO:0019645
      anaerobic electron transport chain, which was grounded only in a deep
      research file that misassigned DVU_0848 to the FlxABCD-HdrABC locus.
      Dropping it here rests on that sourcing, not on a judgement that the term
      is wrong for the complex. QmoC (Q72DS9), the membrane subunit that
      exchanges electrons with menaquinone, keeps GO:0019645 in its own review.
      Evidence code TAS because the qmoABC deletion phenotype (Zane et al. 2010)
      is reported here via Ramos et al. 2012, which also provides direct
      QmoA-AprAB interaction data.
    supported_by:
      - reference_id: DOI:10.3389/fmicb.2012.00137
        supporting_text: >-
          In Desulfovibrio vulgaris Hildenborough a deletion mutant of the qmoABC genes could not grow with sulfate as electron acceptor
      - reference_id: DOI:10.3389/fmicb.2012.00137
        supporting_text: >-
          the interaction involves the QmoA subunit
      - reference_id: PMID:23842468
        supporting_text: >-
          co-purification of QmoA/B and AprA/B from affinity-tagged D. vulgaris Hildenborough strains (AprA, QmoA and QmoB)

