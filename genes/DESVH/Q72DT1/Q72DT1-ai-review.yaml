  description: >
    QmoA is a cytoplasmic HdrA-like iron-sulfur flavoprotein subunit of the
    QmoABC complex and the subunit that contacts APS reductase AprAB. It is
    soluble in the sense of having no transmembrane segment, and is held at the
    cytoplasmic face of the membrane through the membrane subunit QmoC; the
    complex is proposed to deliver menaquinol-derived electrons to AprAB for
    APS reduction.
