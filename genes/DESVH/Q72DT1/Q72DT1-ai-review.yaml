id: Q72DT1
gene_symbol: qmoA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:882
  label: Nitratidesulfovibrio vulgaris (Desulfovibrio vulgaris Hildenborough)
description: >
  QmoA (DVU_0848) is subunit A of the quinone-interacting membrane-bound
  oxidoreductase (QmoABC) complex of Desulfovibrio vulgaris Hildenborough,
  encoded in the aprBA-qmoABC gene cluster (DVU_0846-DVU_0850). It is a soluble,
  HdrA-like iron-sulfur flavoprotein that sits on the cytoplasmic face of the
  complex, whose membrane subunit QmoC receives electrons from the menaquinol
  pool. QmoA is the Qmo subunit that makes direct contact with adenylylsulfate
  (APS) reductase AprAB, and the QmoABC complex is required for growth with
  sulfate, but not sulfite or thiosulfate, as terminal electron acceptor. The
  complex is therefore thought to supply electrons for APS reduction in
  dissimilatory sulfate reduction, possibly through flavin-based electron
  confurcation involving its FAD-containing HdrA-like subunits.
existing_annotations:
- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  review:
    summary: >
      Keyword-mapped oxidoreductase activity. QmoA is an HdrA-like iron-sulfur
      flavoprotein of the QmoABC electron-transfer complex.
    action: ACCEPT
    reason: >
      QmoA is a redox subunit of the QmoABC complex, an HdrA-like flavoprotein
      with FAD/NAD-binding architecture (IPR036188, IPR039650). The general term
      is accurate; the specific physiological reaction of QmoA is not yet
      established, so no more specific child term is justified. Ramos et al.
      call QmoA a flavoprotein, and the complex binds two FAD groups, but no
      FAD-binding term is proposed for QmoA: unlike QmoB (Q72DT0), its UniProt
      record has no FAD cofactor line or FAD keyword, only FAD/NAD-binding
      domain hits, and the literature does not assign the two FADs to
      individual subunits.
    supported_by:
      - reference_id: DOI:10.3389/fmicb.2012.00137
        supporting_text: >-
          QmoA and QmoB are both soluble iron–sulfur
      - reference_id: DOI:10.3389/fmicb.2024.1336360
        supporting_text: >-
          Quinone oxidoreductase, QmoABC complex, subunit A QmoA Q72DT1 DVU_0848

