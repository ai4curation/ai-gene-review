core_functions:
- description: >-
    AprA is the alpha subunit of APS reductase (EC 1.8.99.2), catalyzing the reduction of adenosine 5'-phosphosulfate
    (APS) to AMP and sulfite. This is the defining enzymatic function of the protein, supported by EC
    classification, domain architecture (IPR011803, TIGR02061), and extensive biochemical characterization
    in the literature. AprA contains a FAD cofactor essential for catalysis. AprAB is a soluble cytoplasmic
    enzyme with a Qmo-associated peripheral plasma-membrane pool.
  molecular_function:
