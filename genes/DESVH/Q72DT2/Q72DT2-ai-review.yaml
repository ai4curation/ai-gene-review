id: Q72DT2
gene_symbol: aprA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:882
  label: Nitratidesulfovibrio vulgaris (Desulfovibrio vulgaris) Hildenborough
description: >-
  AprA is the alpha (catalytic) subunit of adenylylsulfate (APS) reductase (EC 1.8.99.2), the central
  enzyme in dissimilatory sulfate reduction. AprA contains the catalytic FAD cofactor and forms an alpha-beta
  heterodimer with AprB (the beta subunit containing [4Fe-4S] clusters) to constitute the functional AprAB
  enzyme. AprAB catalyzes the reduction of adenosine 5'-phosphosulfate (APS) to AMP and sulfite, receiving
  electrons from the membrane-associated QmoABC complex which connects to the quinone pool. This enzyme
  sits between ATP sulfurylase (Sat) and dissimilatory sulfite reductase (DsrAB) in the dissimilatory
  sulfate reduction pathway. AprA is a soluble cytoplasmic protein that also associates peripherally with
  the plasma membrane through the Qmo-Apr complex.
existing_annotations:
- term:
    id: GO:0000104
    label: succinate dehydrogenase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: >-
      TreeGrafter propagated succinate dehydrogenase activity with PANTHER node PTN000908678 as provenance.
      AprA shares the SdhA/FrdA/AprA fold but catalyzes APS reduction to AMP and sulfite, a distinct reaction.
      The historical graft topology has not been independently reconstructed; the catalytic mismatch is
      supported without asserting a particular placement error.
    action: REMOVE
    reason: AprA has the APS-reductase substrate chemistry, AprA-specific domain assignment and 
      sulfate-reduction pathway context, rather than succinate dehydrogenation. Existing 
      OpenScientist and Falcon reports corroborate this distinction. Their assertion that a covalent
      FAD-binding histidine is universally necessary for all SDH/FRD catalysis is stronger than 
      needed here and is not used as decisive proof. The incorrect function is established 
      independently of whether the historical PANTHER graft position or ancestral term mapping 
      caused it.
    supported_by:
    - reference_id: file:DESVH/Q72DT2/Q72DT2-deep-research-falcon.md
      supporting_text: APS reductase (EC 1.8.99.2) catalyzes APS + 2e− + H+ → AMP + sulfite 
        (SO3(2−)). The AprA subunit houses the catalytic FAD, while AprB contains iron-sulfur 
        clusters that mediate electron transfer
    - reference_id: 
        file:DESVH/Q72DT2/Q72DT2-hypotheses/function-hypothesis-go-0000104/openscientist.md
      supporting_text: 'Verdict: REFUTED — Within-superfamily mis-placement (Failure mode 3).'
    - reference_id: 
        file:DESVH/Q72DT2/Q72DT2-hypotheses/function-hypothesis-go-0000104/openscientist.md
      supporting_text: UniProt assigns EC 1.8.99.2 (adenylyl-sulfate reductase).
    - reference_id: file:DESVH/Q72DT2/Q72DT2-hypotheses/function-hypothesis-go-0000104/falcon.md
      supporting_text: The AprA alpha subunit of dissimilatory adenosine-5′-phosphosulfate (APS) 
        reductase shares a common fold with the flavoprotein subunit of succinate dehydrogenase 
        (SDH/Complex II), but this structural relationship is explicitly "not reflected in sequence 
        similarity"

- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: >-
      AprAB has a peripheral plasma-membrane-associated pool in D. vulgaris Hildenborough through its
      complex with Qmo. Its soluble topology is compatible with this location.
    action: ACCEPT
    reason: >-
      PMID:23842468 reports AprA and AprB together with Qmo subunits in membrane preparations from the
      exact strain, supported by reciprocal affinity purification. This establishes more than a predicted
      electron-transfer partnership. GO:0005886 includes the phospholipid bilayer and associated proteins;
      it does not require a transmembrane helix, exclusive localization, or a measured membrane residence
      time. The OpenScientist report recovered this evidence but incorrectly treated peripheral association
      as excluding the broad term. Its suggested extrinsic-membrane term is a descendant through part_of/is_a
      relations. Retain the original annotation, without changing its electronic evidence code or claiming
      integral membrane insertion.
    supported_by:
    - reference_id: PMID:23842468
      supporting_text: another band contained three subunits of Qmo, as well as subunits of AprA and
        AprB.
    - reference_id: 
        file:DESVH/Q72DT2/Q72DT2-hypotheses/function-hypothesis-go-0005886/openscientist.md
      supporting_text: There is genuine **experimental** evidence for a **peripheral, partially 
        stable membrane-associated pool** of AprAB
    - reference_id: file:DESVH/Q72DT2/Q72DT2-notes.md
      supporting_text: GO:0005886 includes associated proteins; GO:0031234 reaches it through 
        part_of/is_a relations.
- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: AprA directly transfers reducing equivalents from its catalytic FAD to APS during 
      sulfate respiration.
    action: ACCEPT
    reason: Live QuickGO rechecked on 2026-09-23 defines directed electron movement between 
      molecular entities and explicitly includes redox transformations in enzymatic metabolic 
      reactions. It does not restrict GO:0009055 to a separate electron-transport carrier. In AprAB,
      AprB supplies the Fe-S relay while AprA transfers reducing equivalents from catalytic FAD to 
      the APS substrate; this specifies the electron donor/acceptor chemistry, rather than inferring
      this term merely from an oxidoreductase label. Retain the original electronic annotation under
      that current broad definition. The exact API response is preserved in 
      apra-membrane-term-check.json and quoted in the notes.
    supported_by:
    - reference_id: file:DESVH/Q72DT2/Q72DT2-deep-research-falcon.md
      supporting_text: The AprA subunit houses the catalytic FAD, while AprB contains iron-sulfur 
        clusters that mediate electron transfer, consistent with a flavoprotein-iron–sulfur 
        oxidoreductase mechanism
    - reference_id: file:DESVH/Q72DT2/Q72DT2-notes.md
      supporting_text: The current GO:0009055 definition includes redox transformations during 
        enzymatic reactions; AprA performs the FAD-dependent reduction of APS.

- term:
    id: GO:0009061
    label: anaerobic respiration
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: >-
      This annotation is accurate but insufficiently specific. AprA functions specifically
      in dissimilatory sulfate reduction, a type of anaerobic respiration where sulfate
      serves as the terminal electron acceptor. In DvH's dissimilatory sulfate reduction,
      sulfate is activated by ATP sulfurylase (Sat) to APS, reduced by AprAB to sulfite,
      and then by dissimilatory sulfite reductase (DsrAB) to sulfide.
    action: MODIFY
    reason: >-
      While anaerobic respiration is technically correct, the more specific term
      GO:0019420 (dissimilatory sulfate reduction) precisely captures AprA's biological
      role. AprA catalyzes a key step in this pathway where APS is reduced to sulfite.
    proposed_replacement_terms:
    - id: GO:0019420
      label: dissimilatory sulfate reduction
    supported_by:
    - reference_id: file:DESVH/Q72DT2/Q72DT2-deep-research-falcon.md
      supporting_text: In DvH’s dissimilatory sulfate reduction, sulfate is activated by ATP 
        sulfurylase (Sat) to APS, reduced by AprAB to sulfite, and then by dissimilatory sulfite 
        reductase (DsrAB) to sulfide
    - reference_id: file:DESVH/Q72DT2/Q72DT2-deep-research-falcon.md
      supporting_text: AprA/AprAB sits between Sat (ATP sulfurylase) and DsrAB in the dissimilatory 
        sulfate reduction chain, central to energy metabolism in DvH

- term:
    id: GO:0050660
    label: flavin adenine dinucleotide binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  review:
    summary: >-
      This annotation is accurate. AprA contains a FAD cofactor that is essential for
      its catalytic function. UniProt lists FAD as a cofactor (ChEBI:57692), and the
      deep research confirms that AprA contains the catalytic FAD. The protein has a
      FAD-binding domain (IPR003953, Pfam:PF00890).
    action: ACCEPT
    reason: >-
      FAD binding is well-established for AprA based on domain architecture (FAD-binding_2
      domain) and functional characterization. The FAD cofactor is central to the
      catalytic mechanism of APS reduction.
    supported_by:
    - reference_id: file:DESVH/Q72DT2/Q72DT2-deep-research-falcon.md
      supporting_text: The AprA subunit houses the catalytic FAD

- term:
    id: GO:0009973
    label: adenylyl-sulfate reductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000003
  review:
    summary: >-
      This is the core molecular function of AprA. The annotation is based on EC mapping
      (EC:1.8.99.2), which is the correct enzyme classification for APS reductase. The
      deep research extensively supports this: AprA in DvH (DVU_0847; UniProt Q72DT2)
      encodes the alpha subunit of adenylyl-sulfate (APS) reductase. APS reductase
      (EC 1.8.99.2) catalyzes APS + 2e- + H+ -> AMP + sulfite.
    action: ACCEPT
    reason: >-
      This is the primary molecular function of AprA, strongly supported by multiple
      lines of evidence including EC classification, domain architecture (IPR011803
      AprA, TIGR02061), UniProt annotation, and extensive literature.
    supported_by:
    - reference_id: file:DESVH/Q72DT2/Q72DT2-deep-research-falcon.md
      supporting_text: AprA is the alpha subunit of APS reductase (AprAB). Together with AprB, it 
        catalyzes reduction of APS to sulfite and AMP; AprA contains the catalytic FAD cofactor
    - reference_id: file:DESVH/Q72DT2/Q72DT2-deep-research-falcon.md
      supporting_text: In DvH proteomics, AprA is explicitly mapped to DVU_0847, confirming the 
        gene-protein assignment in this organism

- term:
    id: GO:0016491
    label: oxidoreductase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  review:
    summary: >-
      Oxidoreductase activity describes the core APS-reduction chemistry at a broader level than adenylyl-sulfate
      reductase activity.
    action: ACCEPT
    reason: >-
      AprA catalyzes the reduction of APS through its FAD-containing active site. GO:0009973 provides
      the more specific reaction, while GO:0016491 remains a correct description of the same core catalytic
      work. A valid broad parent is not an over-annotation simply because a more specific enzyme term
      coexists.
    supported_by:
    - reference_id: file:DESVH/Q72DT2/Q72DT2-deep-research-falcon.md
      supporting_text: APS reductase (EC 1.8.99.2) catalyzes APS + 2e− + H+ → AMP + sulfite 
        (SO3(2−))

