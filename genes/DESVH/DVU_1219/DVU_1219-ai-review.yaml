- id: PMID:37065130
  title: Large-scale genetic characterization of the model sulfate-reducing bacterium, Desulfovibrio vulgaris Hildenborough.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The source of the DvH RB-TnSeq fitness compendium used here (read from BERDL
      kescience.fitnessbrowser). DVU1219 is not discussed by name. The paper does
      characterize its two strongest cofitness partners: the DVU0437-DVU0438 RND pump and
      the outer membrane factor DVU3097, identified by cofitness. It reports that they are
      needed under molybdate stress and interprets this as a cell-wall-integrity role, not
      molybdate efflux. Full text read for the molybdate section.
  findings:
  - statement: Molybdate is toxic to sulfate reducers because it is a futile substrate in sulfate activation.
    supporting_text: Molybdate (MoO42−) is highly toxic to SRB due to its capacity to act as a futile substrate for the adenosine phosphosulfate (APS) reductase, a key enzyme in the sulfate reduction pathway (Peck, 1962).
  - statement: Mutants in the RND efflux pump DVU0437-DVU0438 are sick under molybdate.
    supporting_text: In contrast, strains lacking DVU0437 or DVU0438, which are annotated as the membrane fusion protein (MFP) and the integral membrane subunits of a resistance-nodulation-division (RND) type efflux pump, had significant fitness defects in the presence of molybdate (Figure 7A).
  - statement: DVU3097 was identified by cofitness as the outer membrane component of this pump.
    supporting_text: Instead, based on cofitness, we identified DVU3097 as the probable outer membrane component. DVU3097 shares the molybdate-related phenotypes of DVU0437:DVU0438 but also has other phenotypes (Figure 7B).
  - statement: The efflux system is proposed to maintain cell wall integrity, not to export molybdate.
    supporting_text: In both strains of Desulfovibrio, the efflux system is probably involved in maintaining cell wall integrity rather than in the efflux of molybdate or a related compound.
