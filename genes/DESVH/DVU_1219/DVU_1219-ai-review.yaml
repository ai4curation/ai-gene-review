core_functions:
- description: >-
    Probable envelope lipoprotein with a non-catalytic alpha-amylase (GH13_33) fold. It
    lacks the GH13 nucleophile (Glu351) and acid/base (Arg391), so no glycoside hydrolase
    or transglycosylase activity is expected. Its fitness profile is nearly identical to
    that of the DVU0437-DVU0438/DVU3097 RND efflux system, which is needed under molybdate
    excess and probably maintains cell wall integrity. Its molecular role in that process
    is unknown.
