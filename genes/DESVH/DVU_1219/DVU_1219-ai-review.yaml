description: >-
  DVU_1219 encodes a 731-residue envelope protein of unknown molecular function with an
  alpha-amylase (GH13) fold. Its N-terminus is a signal peptide (residues 1-40/41) ending
  in the lipobox LAGC (39-42), so the mature protein is probably a lipoprotein anchored
  through Cys42. Residues ~100-731 form a complete GH13-type architecture, with the
  catalytic (beta/alpha)8 barrel and the flanking B and C domains. The AlphaFold model is
  confident over this region (mean pLDDT 91), and its closest structural relatives are
  trehalose synthases (TreS) and amylosucrases. The CAZy-family HMMs of dbCAN assign it to
  GH13 subfamily GH13_33, while Pfam's Alpha-amylase domain and all carbohydrate-binding
  modules are absent. Both catalytic carboxylates of the GH13 retaining mechanism are
  replaced: the nucleophile Asp position carries Glu351 and the acid/base Glu position
  carries Arg391. Only the transition-state Asp (Asp456) is kept. DVU_1219 is therefore
  predicted to be a non-catalytic, pseudo-glycosidase member of the alpha-amylase family.
  Its substrate or ligand, if any, is unknown. In genome-wide transposon fitness assays
  of D. vulgaris Hildenborough, DVU_1219 mutants have a strong and pleiotropic phenotype
  (132 of 757 experiments). They are sick under molybdate excess, on many nitrogen sources
  including N2, and with FCCP, nitrite and chlorate, and they gain fitness with tungstate in
  pyruvate media and with nitrate. This profile matches that of the TolC-family outer
  membrane factor DVU3097 (cofitness 0.97) and the RND efflux pump DVU0437-DVU0438. These
  genes are needed under molybdate excess and have been proposed to maintain cell wall
  integrity rather than to export molybdate. DVU_1219 probably acts in the same
  envelope-maintenance process as this efflux system, by an unknown mechanism.
