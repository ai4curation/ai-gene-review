suggested_questions:
- question: Is DVU_1219 truly non-catalytic? Does it still bind an alpha-glucan or other glycan ligand through its GH13_33 barrel despite the E351/R391 substitutions?
- question: How does a lipoprotein with an alpha-amylase fold act with the DVU0437-DVU0438/DVU3097 RND efflux system? Is it a structural partner of the pump, or does it act on the same envelope substrate in parallel?
- question: Is DVU_1219 anchored to the inner or the outer membrane, and is it acylated on Cys42?
suggested_experiments:
- description: >-
    Construct clean in-frame deletions of DVU_1219 and DVU3097 and the double mutant, with
    complementation. Test growth with 100 uM molybdate, with 2-4 mM tungstate in pyruvate
    media, and under N2 fixation. Measure envelope permeability (NPN uptake, sensitivity to
    carbenicillin and detergents). Epistasis would place DVU_1219 in the efflux system's
    pathway.
  hypothesis: DVU_1219 and the RND efflux system act in one envelope-integrity pathway, so the double mutant phenocopies the single mutants.
  experiment_type: targeted genetics and physiology
- description: >-
    Express the mature protein (from Cys42) and the E351D/R391E double revertant. Assay
    alpha-glucosidic hydrolase and transglucosylase activity (pNP-alpha-glucoside, maltose,
    sucrose, trehalose, glycogen) and glycan binding (affinity gel electrophoresis on
    glycogen/amylopectin). Check acylation and membrane partitioning of a tagged protein by
    Triton X-114 phase separation and sucrose-gradient fractionation.
  hypothesis: The wild-type protein is inactive and the double revertant regains GH13 activity, which would confirm a pseudo-glycosidase.
  experiment_type: biochemistry and localization
