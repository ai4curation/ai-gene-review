  review:
    summary: >-
      Probable lipoprotein: a signal peptide followed by the lipobox LAGC places the
      mature protein on a membrane of the cell envelope.
    action: NEW
    reason: >-
      GOA has no annotation of any kind for Q72CR4. Phobius predicts a signal peptide at
      1-40 with the rest non-cytoplasmic, and DeepTMHMM (dashboard query, one residue
      different) predicts a cleavable signal peptide at 1-41 with no membrane-spanning
      segment. Residues 39-42 are LAGC, which matches the bacterial lipobox consensus
      [LVI][ASTVI][GAS]C, and DeepTMHMM's cleavage site falls immediately before Cys42,
      the position at which signal peptidase II cuts and the Cys is acylated. That makes
      the protein a probable lipoprotein, tethered to the outer face of the inner membrane
      or the inner leaflet of the outer membrane. We cannot tell which with sequence
      alone, so the generic membrane term is used rather than plasma or outer membrane.
      This is an inference (IC) from sequence features. No LipoP/SignalP 6 prediction or
      fractionation was done, and secretion as a free protein is not excluded.
