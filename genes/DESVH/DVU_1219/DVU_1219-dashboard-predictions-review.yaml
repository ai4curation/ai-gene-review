- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0005576
    label: extracellular region
  predicted_term_type: GO_CC
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      GOA has no location for Q72CR4. Export across the inner membrane is well supported.
      DeepTMHMM (dashboard) predicts a cleavable signal peptide at 1-41 with no membrane
      segment, and Phobius predicts a signal peptide at 1-40 with 41-731 non-cytoplasmic.
      Residues 39-42 are the lipobox LAGC, and DeepTMHMM's cleavage site falls immediately
      before Cys42, as expected for signal peptidase II processing. DVU_1219 is therefore
      most likely a lipoprotein, anchored by its acylated N-terminal Cys to a membrane in
      the cell envelope. Its near-identical fitness profile with an RND efflux system
      also argues for an envelope location rather than release into the medium. The
      lipobox call is a motif match, not a LipoP/SignalP 6 prediction, and no
      fractionation data exist, so secretion is not excluded. UNC; the missing evidence
      is lipoprotein-specific prediction or cell fractionation.
    supported_by:
    - reference_id: file:DESVH/DVU_1219/DVU_1219-dashboard-prediction-evidence/dashboard_page.txt
      supporting_text: signal peptide 1-41; extracellular/outside 42-731
    - reference_id: file:DESVH/DVU_1219/DVU_1219-bioinformatics/RESULTS.md
      supporting_text: 'Lipobox: residues 39-42 are LAGC'
