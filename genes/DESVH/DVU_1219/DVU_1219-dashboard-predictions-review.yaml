description: >-
  The KBase gene-annotate dashboard LLM call for N. vulgaris NZ_CABHLV010000001.1_902 is
  "Exported glycosidase/amylase-family protein associated with molybdate/tungstate stress
  responses" (tier A). It comes with three GO terms: GO:0016798 hydrolase activity, acting
  on glycosyl bonds; GO:0097501 stress response to metal ion; and GO:0005576 extracellular
  region. The exact sequence has no active UniProtKB entry, so the call is scored on the
  Hildenborough reference-proteome entry Q72CR4 (DVU_1219), which differs at one residue
  (V393M; 99.9% identity). Each part of the call has a real basis, but the call reads more
  into it than the evidence carries. (1) Family. The protein is a full-length GH13-fold
  protein: dbCAN places it in subfamily GH13_33 (E = 1.8e-50), and Foldseek finds
  trehalose synthase and amylosucrase as its closest structures. Both catalytic
  carboxylates of the GH13 retaining mechanism are replaced, though: the nucleophile Asp
  by Glu351 and the acid/base Glu by Arg391. Structure-based and profile-based mappings
  agree on this, so a glycoside hydrolase activity is not expected. (2) Phenotype. The
  molybdate and tungstate fitness phenotypes are real and strong. They are not specific to
  this gene, however. DVU1219 has strong phenotypes in 132 of 757 experiments, and the
  Fitness Browser calls no specific phenotype for it. Its fitness profile matches that of
  the TolC-family outer membrane factor DVU3097 (cofitness 0.97) and the RND pump
  DVU0437-DVU0438, and under molybdate excess these four genes are the top sick genes
  together. The phenotypes are evidence that DVU1219 works with an RND efflux system, not
  of a dedicated metal stress-response function. (3) Location. A LAGC lipobox right after
  the predicted signal peptide makes it a probable lipoprotein. The call missed this and
  turned "exported" into extracellular region. Recommended dashboard verdict: overreach.
  Suggested corrected annotation: "GH13_33-family (alpha-amylase-fold) lipoprotein
  lacking the GH13 catalytic nucleophile and acid/base (probably non-catalytic); strongly
  cofit with the DVU0437-0438/DVU3097 RND efflux system and, with it, required under
  molybdate excess; function unknown."
