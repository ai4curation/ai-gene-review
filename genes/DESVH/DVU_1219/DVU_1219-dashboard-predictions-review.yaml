predictions:
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0016798
    label: hydrolase activity, acting on glycosyl bonds
  predicted_term_type: GO_MF
  review:
    assessment: NPI
    confidence_score: 0
    error_type: PSEUDOENZYME_OVERANNOTATION
    summary: >-
      GOA has no annotation for Q72CR4. The call's evidence for glycosidase activity was
      a SUPERFAMILY (trans)glycosidase fold hit and a COG0366 label. Our analysis
      confirms the family placement: dbCAN assigns GH13_33 over residues 143-459, and
      Foldseek aligns the AlphaFold model over residues ~100-731 to trehalose synthases
      and amylosucrases at E = 1e-18 to 1e-20. Neither Pfam PF00128 nor any CBM is found.
      The catalytic machinery is not conserved, however. GH13 enzymes hydrolyse or
      transfer glycosyl bonds with a nucleophile Asp and an acid/base Glu. The
      structurally equivalent residues in DVU_1219 are Glu351 and Arg391, in 17 of 18
      and 22 of 24 annotated GH13 hits respectively. The GH13_33 profile, whose consensus
      is D and E at those states, places the same two residues there. Only the
      transition-state Asp (D456) is kept. An Arg at the acid/base position and a Glu at
      the nucleophile position are incompatible with GH13 hydrolysis, so the predicted
      activity is refuted by analysis of the sequence. This is a prediction, not an assay.
      The error is transfer of the ancestral activity to a fold-retaining
      pseudo-glycosidase.
    supported_by:
    - reference_id: file:DESVH/DVU_1219/DVU_1219-bioinformatics/RESULTS.md
      supporting_text: 'dbCAN: the only CAZy hit is GH13_33.hmm, query 143-459, HMM 2-322 of 325, score 167.4, i-Evalue 1.81e-50'
    - reference_id: file:DESVH/DVU_1219/DVU_1219-bioinformatics/RESULTS.md
      supporting_text: Nucleophile Asp maps to query E351 in 17 of 18 annotated hits that align it
    - reference_id: file:DESVH/DVU_1219/DVU_1219-bioinformatics/RESULTS.md
      supporting_text: Proton donor (acid/base) Glu maps to query R391 in 22 of 24 annotated hits
    - reference_id: file:DESVH/DVU_1219/DVU_1219-bioinformatics/RESULTS.md
      supporting_text: 'GH13_33 acid/base state: consensus E (P = 0.424); query has R391.'
- source_method: gene-annotate dashboard LLM annotation (Dark Protein Atlas)
  source_version: '2026-10-30 snapshot'
  predicted_term:
    id: GO:0097501
    label: stress response to metal ion
  predicted_term_type: GO_BP
  review:
    assessment: UNC
    confidence_score: 1
    summary: >-
      GOA has no annotation for Q72CR4. The term rests on DvH RB-TnSeq phenotypes, which
      we confirmed from the Fitness Browser tables: down to fit -3.5 with 100 uM
      molybdate and up to +5.4 with 2 mM tungstate. These are necessity phenotypes. They
      show that the mutant grows worse or better, not that the protein takes part in a
      process triggered by the metal. Nor are they specific. DVU1219 has strong
      phenotypes in 132 of 757 experiments, including most nitrogen sources, FCCP,
      chlorate and nitrite. Tungstate helps in pyruvate media but hurts under N2
      fixation, and the Fitness Browser calls no specific phenotype for this gene. The
      whole profile is shared with the TolC-family outer membrane factor DVU3097
      (cofitness 0.97) and the RND pump DVU0437-0438; with 100 uM molybdate in MoYLS4,
      these four genes are the top-ranked sick genes together. The tungstate gain is
      shared with roughly 100 genes, led by the DVU0245-0251 cluster. The data therefore
      place DVU1219 in an RND efflux module, not in a metal stress-response pathway. The
      authors of the DvH fitness compendium propose that this efflux system maintains
      cell wall integrity rather than exporting molybdate.
      Nothing refutes a role in molybdate tolerance through that module, so the score
      is UNC. What is missing is evidence that the protein responds to, or acts on,
      metal ions.
    supported_by:
    - reference_id: file:DESVH/DVU_1219/DVU_1219-bioinformatics/RESULTS.md
      supporting_text: 'DVU1219: 757 experiments; strong 132 (neg 117, pos 15); min -4.35 max 5.39'
