      (75–80 kDa, one FAD) and one beta subunit (18–23 kDa, two [4Fe–4S] centres) which are encoded
      by the aprBA gene loci

suggested_questions:
- question: >-
    Has the electron transfer pathway through AprB's two [4Fe-4S] clusters been characterized
    spectroscopically (e.g., EPR) in D. vulgaris specifically?
- question: >-
    What are the redox potentials of the individual [4Fe-4S] clusters in AprB, and
    how do they
    compare to homologous proteins?
- question: >-
    What is the stoichiometry of the AprAB heterodimer - is it strictly 1:1 alpha:beta?

suggested_experiments:
- description: >-
    Site-directed mutagenesis of conserved cysteine residues coordinating the [4Fe-4S]
    clusters
    to confirm their essential role in electron transfer
  hypothesis: >-
    Mutation of cysteine residues coordinating the [4Fe-4S] clusters will abolish
    electron
    transfer activity and APS reductase function
- description: >-
    EPR spectroscopy to characterize the redox states and properties of the individual
    iron-sulfur
    clusters
  hypothesis: >-
    The two [4Fe-4S] clusters will show distinct redox potentials consistent with
    their role
    in directional electron transfer
- description: >-
    In vivo complementation studies with aprB deletion mutants to confirm essentiality
    for
    sulfate reduction
  hypothesis: >-
    Deletion of aprB will abolish sulfate reduction capability, which can be restored
    by
    complementation with wild-type aprB

