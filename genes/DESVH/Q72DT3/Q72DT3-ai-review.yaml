core_functions:
- molecular_function:
    id: GO:0009055
    label: electron transfer activity
  description: >-
    AprB's primary molecular function is electron transfer. The protein contains two
    [4Fe-4S]
    ferredoxin-type clusters that relay electrons from the membrane-associated QmoABC
    complex
    to the FAD cofactor in the catalytic AprA subunit. This electron transfer is essential
    for
    the reduction of APS to sulfite.
  supported_by:
  - reference_id: DOI:10.1371/journal.pone.0001514
    supporting_text: >-
      The two electrons required for the reduction of APS were postulated to be transferred one by
      one over 30 A˚ via [4Fe-4S] cluster II at the surface of the protein, cluster I and Trp-B48 to
      the isoalloxazine ring of the buried FAD [18,23,24]
  - reference_id: DOI:10.3389/fmicb.2012.00137
    supporting_text: >-
      This showed that the QmoABC–AprAB complex has a strong steady-state afﬁnity (K D = 90 ± 3 nM),
      but has a transient character due to a fast dissociation rate.
  directly_involved_in:
  - id: GO:0019420
    label: dissimilatory sulfate reduction
  locations:
  - id: GO:0005737
    label: cytoplasm

- molecular_function:
    id: GO:0051539
    label: 4 iron, 4 sulfur cluster binding
  description: >-
    AprB binds two [4Fe-4S] clusters that are essential for its electron transfer
    function.
    These clusters are located in ferredoxin-type domains (residues 1-35 and 38-67)
    and are
    highly conserved across AprB homologs in sulfate-reducing and sulfur-oxidizing
    prokaryotes.
  supported_by:
  - reference_id: DOI:10.1371/journal.pone.0001514
    supporting_text: >-
      Its beta-subunit can be subdivided in three segments comprising a bacterial ferredoxin-like
