id: Q775D8
gene_symbol: brt
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2885909
  label: Bordetella phage BPP-1
description: >-
  Reverse transcriptase (bRT) of the diversity-generating retroelement (DGR) in
  Bordetella phage BPP-1 that catalyzes error-prone, adenine-specific
  RNA-templated DNA synthesis to diversify the major tropism determinant (mtd)
  tail fiber gene. bRT associates with a homopentamer of the accessory protein
  Avd and structured cis-acting DGR RNA to form a ribonucleoprotein complex in
  which the 2'-hydroxyl of spacer nucleotide SpA56 primes cDNA synthesis from the
  template repeat (TR). Selective misincorporation opposite template adenines by
  bRT generates hypervariable cDNA copies that home to the mtd variable region
  (VR1), enabling phage receptor tropism switching.
