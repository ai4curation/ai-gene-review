suggested_questions:
- question: >-
    How is the branched RNA-cDNA molecule produced by the bRT-Avd complex handed
    off to host or phage factors for target-primed reverse homing into the mtd
    VR1 DNA locus?
suggested_experiments:
- description: >-
    Perform single-molecule fluorescence and pull-down assays with reconstituted
    bRT-Avd:RNA-cDNA complexes incubated with supercoiled plasmid DNA carrying
    the mtd variable region (VR1) and stem-loop IMH (initiation of mutagenic
    homing) element.
  hypothesis: >-
    The bRT-Avd complex remains bound to the branched RNA-cDNA intermediate and
    recognizes the IMH/cruciform structure at the 3' end of mtd VR1 to promote
    strand invasion.
