- id: PMID:14973019
  title: Genomic and genetic analysis of Bordetella bacteriophages encoding reverse
    transcriptase-mediated tropism-switching cassettes.
  findings:
  - statement: >-
      Brt possesses experimentally confirmed reverse transcriptase activity that
      is essential for phage BPP-1 tropism switching.
    supporting_text: >-
      Brt ( Bordetella reverse transcriptase) contains a region (amino acids 72
      to 265) that matches the Pfam entry PF00078 rvt (reverse transcriptase)
      with an E-value of 3e-14. Using a His-6-tagged derivative of Brt, we
      previously demonstrated that the protein does indeed have reverse
      transcriptase activity ( 21 ). Deletion and site-directed mutagenesis
      experiments also showed that the reverse transcriptase domain is required
      for the Bordetella phage to undergo tropism switching.
- id: PMID:15386016
  title: Tropism switching in Bordetella bacteriophage defines a family of diversity-generating
    retroelements.
  findings:
  - statement: >-
      The Bordetella phage diversity-generating retroelement couples reverse
      transcription with site-directed adenine-specific mutagenesis to diversify
      host tropism.
    supporting_text: >-
      Bordetella bacteriophages generate diversity in a gene that specifies host
      tropism. This microevolutionary adaptation is produced by a genetic
      element that combines the basic retroelement life cycle of transcription,
      reverse transcription and integration with site-directed, adenine-specific
      mutagenesis.
- id: PMID:39779855
  title: RNA control of reverse transcription in a diversity-generating retroelement.
  findings:
  - statement: >-
      bRT requires association with the pentameric Avd protein and flanking DGR
      RNA elements to catalyze cDNA synthesis primed by SpA56.
    supporting_text: >-
      In the prototypical Bordetella bacteriophage DGR, the template must be
      surrounded by upstream and downstream RNA segments for complementary DNA
      synthesis to be carried out by a complex of the DGR reverse transcriptase
      bRT and associated protein Avd.
  - statement: >-
      bRT is inactive alone and requires complex formation with Avd for reverse
      transcription activity.
    supporting_text: >-
      Reverse transcription is carried out by a complex of bRT and Avd. Unlike
      other RTs, bRT lacks reverse transcription activity on its own and
      requires association with Avd10.
