core_functions:
- description: >-
    Catalyzes adenine-mutagenic, RNA-directed DNA synthesis from the DGR
    template repeat (TR) RNA within the bRT-Avd ribonucleoprotein complex,
    driving diversification of the mtd tail fiber gene and viral tropism
    switching.
