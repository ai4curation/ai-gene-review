  review:
    action: ACCEPT
    reason: >-
      Brt (bRT) is an experimentally verified RNA-directed DNA polymerase
      (reverse transcriptase) that synthesizes cDNA from the DGR template repeat
      RNA when complexed with Avd.
    supported_by:
    - reference_id: PMID:14973019
      supporting_text: >-
        Brt ( Bordetella reverse transcriptase) contains a region (amino acids
        72 to 265) that matches the Pfam entry PF00078 rvt (reverse
        transcriptase) with an E-value of 3e-14. Using a His-6-tagged derivative
        of Brt, we previously demonstrated that the protein does indeed have
        reverse transcriptase activity ( 21 ). Deletion and site-directed
        mutagenesis experiments also showed that the reverse transcriptase
        domain is required for the Bordetella phage to undergo tropism
        switching.
