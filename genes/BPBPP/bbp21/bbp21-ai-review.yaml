suggested_questions:
- question: >-
    How does the Bbp21 dodecameric portal ring interface with the BPP-1 short
    tail hub and internal core proteins during DNA packaging and genome ejection?
suggested_experiments:
- description: >-
    Determine the asymmetric cryo-EM reconstruction of the Bordetella phage BPP-1
    portal-tail vertex at atomic resolution before and after receptor-triggered
    genome ejection.
  hypothesis: >-
    Bbp21 forms a 12-fold symmetric crown and clip channel that undergoes a
    conformational valve opening upon tail fiber (Mtd) engagement with host
    pertactin.
