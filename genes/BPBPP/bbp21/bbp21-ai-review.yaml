id: Q775C3
gene_symbol: bbp21
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:2885909
  label: Bordetella phage BPP-1
description: >-
  Portal protein (head-to-tail connector, gp21) of the short-tailed Bordetella
  phage BPP-1. Bbp21 assembles as a ring-shaped homododecamer at a single fivefold
  vertex of the icosahedral capsid, forming the central axial channel required for
  capsid assembly, viral dsDNA packaging, tail attachment, and genome ejection
  through the short tail into the Bordetella host cell.
