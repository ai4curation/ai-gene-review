suggested_questions:
- question: >-
    How is the mechanical signal of multivalent Mtd-pertactin binding at the
    distal tail fiber tips transmitted through the proximal tail fiber (Bbp12)
    to trigger opening of the BPP-1 short tail and genome ejection?
suggested_experiments:
- description: >-
    Perform cryo-electron tomography of Bordetella phage BPP-1 adsorbed to
    pertactin-containing outer membrane vesicles to capture pre- and post-ejection
    tail fiber conformations.
  hypothesis: >-
    Simultaneous engagement of multiple Mtd bilobed distal tips on the membrane
    surface reorients the six proximal tail fibers upward, inducing a
    conformational change at the tail hub that opens the portal-tail channel.
