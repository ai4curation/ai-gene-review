  label: Bordetella phage BPP-1
description: >-
  Distal tail fiber receptor-binding protein (major tropism determinant, Mtd) of
  Bordetella phage BPP-1 that mediates host cell attachment and determines phage
  host range. Mtd assembles into pyramid-shaped homotrimers positioned as bilobed
  globules at the distal tips of the six phage tail fibers. Its C-terminal C-type
  lectin (CLec) fold scaffold displays 12 hypervariable residues encoded by the
  diversity-generating retroelement (DGR) variable region (VR1), enabling
  multivalent binding to Bordetella outer-membrane receptors such as pertactin
  and rapid viral tropism switching as the bacterial host alternates surface
  antigens.
