core_functions:
- description: >-
    Forms trimeric receptor-binding globules at the distal tips of the phage
    tail fibers that use a hypervariable C-type lectin (CLec) fold binding site
    to recognize host outer-membrane receptors (such as pertactin), mediating
    virion attachment and DGR-driven viral tropism switching.
