id: V9XY07
gene_symbol: FAE1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:13288
  label: Thlaspi arvense
description: >-
  FATTY ACID ELONGATION1 (FAE1) of field pennycress is the seed-expressed 3-ketoacyl-CoA
  synthase (condensing enzyme) of the endoplasmic reticulum acyl-CoA elongase. It catalyzes the
  chain-length-determining condensation of malonyl-CoA with oleoyl-CoA and eicosenoyl-CoA,
  the first of four reactions in each elongation cycle, producing the eicosenoic (20:1) and
  erucic (22:1) very-long-chain fatty acids that make up roughly 35-40% of wild pennycress seed
  oil and are stored mainly in triacylglycerol. The gene is highly expressed early in seed
  development. Loss-of-function alleles abolish erucic acid and nearly abolish eicosenoic acid
  in seed oil, raising oleic and polyunsaturated fatty acids without obvious effects on
  vegetative growth; such alleles underlie low-erucic, canola-like pennycress oil and are
  combined with fad2 or rod1 mutations to produce high-oleic oil. FAE1 belongs to the plant
  3-ketoacyl-CoA synthase (KCS) family and is orthologous to Arabidopsis FAE1/KCS18.
