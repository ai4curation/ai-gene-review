  - EC:2.3.1.199
  review:
    summary: The core catalytic activity; the GO term is defined by the KCS condensation reaction.
    action: ACCEPT
    reason: >-
      GO:0009922 is defined as the condensation of a very-long-chain acyl-CoA with malonyl-CoA,
