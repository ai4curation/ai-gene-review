  review:
    summary: ER localization predicted by ARBA from the plant KCS family.
    action: ACCEPT
    reason: >-
      No localization data exist for pennycress FAE1, but the acyl-CoA elongase is an ER
      membrane complex and the Arabidopsis ortholog (KCS18) is an ER enzyme. The prediction is
      consistent with the enzyme's established biochemistry and with the 1-residue identity of
      this protein to the reference-proteome FAE1.
    supported_by:
    - reference_id: PMID:33968108
      supporting_text: Fatty acid (FA) elongation of 18:1-CoA is carried out by a protein complex
        containing the FA elongase, FAE1.
    - reference_id: file:THLAR/FAE1/FAE1-deep-research-falcon.md
      supporting_text: The enzyme localizes to the endoplasmic reticulum membrane, where it operates
        as part of a multi-component complex including KCR, HCD, and ECR enzymes
- term:
    id: GO:0006633
    label: fatty acid biosynthetic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR012392
  - InterPro:IPR013601
  - UniPathway:UPA00094
  review:
    summary: Correct but too general; FAE1 elongates C18 acyl-CoAs to very-long-chain fatty acids.
    action: MODIFY
    reason: >-
      FAE1 performs the condensation step of very-long-chain fatty acid synthesis, not de novo
      (plastid) fatty acid synthesis. Knockout in pennycress specifically removes the C20:1 and
      C22:1 products, so the more precise process term is appropriate.
    proposed_replacement_terms:
    - id: GO:0042761
      label: very long-chain fatty acid biosynthetic process
    supported_by:
    - reference_id: PMID:30230695
      supporting_text: The pennycress fae1‐3 mutant harbours a 4‐bp deletion in the TaFAE1 coding
        sequence, producing seed oil (triacylglycerols; TAG) with undetectable amounts of erucic
        acid (C22:1) and greatly reduced amounts of eicosenoic acid (C20:1).
