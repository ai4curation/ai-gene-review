- id: file:THLAR/FAE1/FAE1-deep-research-falcon.md
  title: Deep research report on pennycress FAE1 (falcon)
  findings:
  - statement: Literature synthesis agrees with the review - ER-membrane KCS converting 18:1-CoA to
      20:1- and 22:1-CoA; ER localization is inferred from the conserved elongase, not measured in
      pennycress.
- id: PMID:24358289
  title: Evolutionary pattern of the FAE1 gene in brassicaceae and its correlation with the erucic
    acid trait.
  findings:
  - statement: Source of the V9XY07 sequence; FAE1 sequence variation across Brassicaceae correlates
      with seed erucic acid content.
    supporting_text: Sequence variations in FAE1 show a strong correlation with the content of erucic
      acid in seeds, suggesting a causal link between the two.
- id: PMID:27889523
  title: Identification of target genes and processes involved in erucic acid accumulation during
    seed development in the biodiesel feedstock Pennycress (Thlaspi arvense L.).
  findings:
  - statement: TaFAE1 is transcriptionally regulated and highly expressed early in seed development.
    supporting_text: TaFAE1 gene,
      encoding the fatty acid elongase, seemed to be controlled at the transcriptional
      level with high expression at the early stages of seed development.
- id: PMID:30230695
  title: Molecular tools enabling pennycress (Thlaspi arvense) as a model plant and oilseed cash cover
    crop.
  findings:
  - statement: CRISPR fae1 knockouts abolish erucic acid in pennycress seed oil.
    supporting_text: The pennycress fae1‐3 mutant harbours a 4‐bp deletion in the TaFAE1 coding
      sequence, producing seed oil (triacylglycerols; TAG) with undetectable amounts of erucic
      acid (C22:1) and greatly reduced amounts of eicosenoic acid (C20:1).
- id: PMID:32740897
  title: Functional analysis of β-ketoacyl-CoA synthase from biofuel feedstock Thlaspi arvense reveals
    differences in the triacylglycerol biosynthetic pathway among Brassicaceae.
  findings:
  - statement: Pennycress FAE1 expressed in Arabidopsis seed raises erucic acid and prefers
      eicosenoyl over oleoyl substrates.
    supporting_text: Seed-specific expression of the Pennycress FAE1 gene in Col-0 resulted in a
      3 to fourfold increase of erucic acid content in the seed oil.
- id: PMID:33968108
  title: CRISPR/Cas9-Induced fad2 and rod1 Mutations Stacked With fae1 Confer High Oleic Acid Seed
    Oil in Pennycress (Thlaspi arvense L.).
  findings:
  - statement: fae1 stacked with fad2 or rod1 yields high-oleic pennycress oil.
    supporting_text: fad2 fae1 and rod1 fae1 double mutants produced ∼90% and ∼60% oleic acid in seed
      oil, respectively
- id: PMID:39657724
  title: 'Propelling sustainable energy: Multi-omics analysis of pennycress FATTY ACID ELONGATION1
    knockout for biofuel production.'
  findings:
  - statement: fae1 knockouts grow like wild type and germinate faster at 10 °C.
    supporting_text: The results showed minimal differences in plant morphology and physiology
      between wild-type (WT) plants and the fatty acid elongation 1-3 (fae1-3) and fatty acid
      elongation 1-4 (fae1-4) knockout mutant alleles.
- id: PMID:41578087
  title: Creating a new oilseed crop, pennycress, by combining key domestication traits using CRISPR
    genome editing.
  findings:
  - statement: Stacked CRISPR edits give double-low (low erucic, reduced glucosinolate) pennycress.
    supporting_text: High-yielding varieties were created with seed
      compositions such as 'double-low' canola (low erucic acid and reduced
      glucosinolate) and reduced seed fibre content.
suggested_questions:
- question: Does pennycress FAE1 form the same ER elongase complex (KCR1, PAS2/HCD, ECR/CER10)
    as in Arabidopsis, and are the downstream elongase components seed-limiting for erucic acid?
- question: Which of the fixed FAE1 residues distinguishing high- and low-erucic Brassicaceae
    explain pennycress FAE1's reported preference for eicosenoyl-CoA over oleoyl-CoA?
suggested_experiments:
- description: In vitro or yeast assay of recombinant pennycress FAE1 with C18:1-, C20:1- and
    C22:1-CoA to measure substrate preference directly rather than inferring it from seed oil.
- description: Fluorescent-protein fusion of TaFAE1 in pennycress or N. benthamiana to confirm ER
    membrane localization.
