  review:
    summary: FAE1 catalyzes the committed condensation step of seed VLCFA synthesis in pennycress.
    action: NEW
    reason: >-
      FAE1 itself performs a step of this process (the condensation reaction), so this is
      participation, not mere requirement. CRISPR knockouts in pennycress remove erucic acid and
      nearly all eicosenoic acid from seed oil, confirming that this gene is the seed elongase.
    supported_by:
