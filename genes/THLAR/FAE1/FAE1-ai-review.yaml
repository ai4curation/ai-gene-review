      supporting_text: Seeds from homozygous fae1‐3, fae1‐4 and fae1‐5 plants were analysed for TAG
        fatty acid composition, revealing negligible amounts of erucic (C22:1) and eicosenoic (C20:1)
        acids in all three lines
    - reference_id: PMID:39657724
      supporting_text: FATTY ACID ELONGATION1 (FAE1) was targeted
        using CRISPR-Cas 9 gene editing to eliminate very long chain fatty acids
        (VLCFAs) from pennycress seed oil
