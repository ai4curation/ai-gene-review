- id: PMID:24608865
  title: The small subunit 1 of the Arabidopsis isopropylmalate isomerase is required for normal growth
    and development and the early stages of glucosinolate formation.
  full_text_unavailable: false
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
