description: TAV2_LOCUS13090 encodes a predicted LeuD-like small subunit of isopropylmalate isomerase
  in field pennycress. It is most closely associated with the Arabidopsis SSU2/SSU3 group involved in
  methionine chain elongation for glucosinolate biosynthesis, rather than a uniquely resolved SSU3 ortholog.
  It is inferred to contribute substrate-recognition and catalytic architecture to a heterodimer with
  an IIL1-like large subunit in plastids. Native complex assembly and localization have not been assayed.
