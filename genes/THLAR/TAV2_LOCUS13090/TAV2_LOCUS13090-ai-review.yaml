- id: PMID:19597944
  title: Arabidopsis thaliana encodes a bacterial-type heterodimeric isopropylmalate isomerase involved
    in both Leu biosynthesis and the Met chain elongation pathway of glucosinolate formation.
  full_text_unavailable: false
  findings:
  - statement: Arabidopsis IPMI comprises a shared large subunit and specialized small subunits; mutant
      profiling supports both leucine and methionine-chain-elongation reactions. Target activity remains
      inferred.
    supporting_text: In contrast, the small subunits appear to be specialized to either Leu biosynthesis
      or Met chain elongation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Arabidopsis IPMI comprises a shared large subunit and specialized small subunits; mutant
      profiling supports both leucine and methionine-chain-elongation reactions. Target activity remains
      inferred. Accessible abstract and relevant quoted passages inspected; no native target assay is
      claimed.
- id: PMID:20663849
  title: Functional specification of Arabidopsis isopropylmalate isomerases in glucosinolate and leucine
    biosynthesis.
  full_text_unavailable: true
  findings:
  - statement: The accessible abstract reports physical large/small-subunit association and chloroplast-stromal
      functional complexes in Arabidopsis. AtLeuD1/2 correspond to SSU2/3; AtLeuD3 is the leucine-specific
      SSU1.
    supporting_text: We demonstrate here that AtLeuC physically interacts with AtLeuD proteins to form
      functional IPMIs.
  reference_review:
