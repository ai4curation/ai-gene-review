- term: &id001
    id: GO:0120528
    label: 2-(omega-methylthio)alkylmalate dehydratase activity
  evidence_type: ISS
  original_reference_id: PMID:19597944
  supporting_entities:
  - UniProtKB:Q9ZW84
  - UniProtKB:Q9LYT7
  qualifier: contributes_to
  review:
    action: NEW
    summary: The inferred IPMI subunit contributes to methylthioalkylmalate isomerization.
    reason: The exact methionine-chain-elongation hydro-lyase activity is distinct from the pre-existing
      3-isopropylmalate reaction, not its ancestor or descendant. Specific sequence mapping, complementary
      large/small-subunit architecture and primary Arabidopsis heterodimer evidence support a comparative
      annotation. The contribution qualifier explicitly avoids claiming an autonomous subunit enzyme.
      Native pennycress complex activity is untested. Q9ZW84 (SSU2) is the reciprocal sequence match,
      while Q9LYT7 (SSU3) is the forward-query homolog with the experimentally supported GO:0120528 annotation.
      The two donors support the SSU2/SSU3 functional group rather than a claim of one-to-one SSU3 orthology.
      Independent substrate-range experiments support both paralogs.
