  review:
    action: KEEP_AS_NON_CORE
    summary: Retained IPM-converting capacity is inferred but peripheral to SSU2/SSU3-like specialization
      in methionine chain elongation.
    reason: The target maps to the SSU2/SSU3 group and has the LeuD substrate-recognition domain. Arabidopsis
      small subunits associate with IIL1 to form functional IPMI. The retained reaction is a complex-associated
      biochemical capacity, not evidence for a dedicated physiological leucine role or independent small-subunit
      catalysis. As in Arabidopsis SSU3, retained IPM activity is non-core relative to the inferred glucosinolate
      specialization; the term is reaction-specific and is not being treated as overly general.
    supported_by:
