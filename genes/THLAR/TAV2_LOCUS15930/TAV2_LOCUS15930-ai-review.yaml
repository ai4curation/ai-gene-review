  label: Thlaspi arvense
description: TAV2_LOCUS15930 encodes a predicted plastidic BCAT3-like aminotransferase in field pennycress.
  It is inferred to catalyze reversible transamination of branched-chain amino acids and their 2-oxo acids
  and to participate in the terminal transamination of elongated methionine precursors for glucosinolate
  biosynthesis. Its pyridoxal-phosphate-dependent catalytic architecture is conserved, but native reaction
  rates, chain-length preferences and localization remain unmeasured.
