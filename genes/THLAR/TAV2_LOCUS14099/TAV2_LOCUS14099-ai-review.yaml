taxon:
  id: NCBITaxon:13288
  label: Thlaspi arvense
description: >-
  Secreted multicopper oxidase laccase 4 (EC 1.10.3.2) in field pennycress
  (Thlaspi arvense), orthologous to Arabidopsis thaliana LAC4/IRX12
  (AT2G38080). TAV2_LOCUS14099 is a 558-amino-acid glycoprotein with an
  N-terminal secretory signal peptide (residues 1-24) and three cupredoxin
  domains that coordinate four catalytic copper ions in the apoplast. Unlike
  wood-rotting fungal laccases that degrade lignin, plant LAC4 oxidizes
  monolignols in the apoplast to drive oxidative radical coupling and lignin
  polymerization in vascular secondary cell walls and the seed coat. Its
  transcript contains a conserved miR397 target site at CDS positions 669-689
  that post-transcriptionally regulates laccase abundance and cell wall
  lignification.
