    title: >-
      An Arabidopsis gene regulatory network for secondary cell wall synthesis.
    findings:
      - statement: >-
          LAC4/IRX12 (At2g38080) is directly regulated within the Arabidopsis
          xylem secondary cell wall and lignin biosynthesis transcriptional
          network.
        supporting_text: >-
          KOR/IRX2 (At5g49720), LAC4/IRX12 (At2g38080), and REF8 (At2g40890) are
          described in Supplementary Table 6.
        full_text_unavailable: false
  - id: PMID:31559647
    title: >-
      Lignin-based barrier restricts pathogens to the infection site and confers
      resistance in plants.
    findings:
      - statement: >-
          In plants, laccases oxidatively polymerize monolignols into lignin
          units in the apoplast rather than degrading lignin.
        supporting_text: >-
          After their synthesis, monolignols are transported from the cytosol
          into the apoplast, where they are oxidatively polymerized to lignin
          units by the actions of laccases and peroxidases (Boerjan et al , 2003
          ; Berthet et al , 2011 ; Lee et al , 2013 ).
        full_text_unavailable: false
  - id: PMID:34990041
    title: >-
      Chromosome-level Thlaspi arvense genome provides new tools for
      translational research and for a newly domesticated cash cover crop of the
      cooler climates.
    findings:
      - statement: >-
          The chromosome-level Thlaspi arvense genome and small RNA annotation
          identified 72 miRNA-producing loci, including conserved tar-mir-397.
        supporting_text: >-
          We identified 72 miRNA‐producing loci, with 53 that were already known
          from other species, and 19 appeared to be species‐specific.
        full_text_unavailable: false
