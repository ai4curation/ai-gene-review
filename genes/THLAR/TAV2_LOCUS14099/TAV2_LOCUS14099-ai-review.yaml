suggested_questions:
  - question: >-
      Does seed-coat-specific overexpression of tar-miR397 in pennycress
      downregulate TAV2_LOCUS14099 and its paralogs (TAV2_LOCUS10945 and
      TAV2_LOCUS25610) to reduce seed hull lignin content and fiber without
      causing stem lodging?
suggested_experiments:
  - description: >-
      Perform 5' RLM-RACE on TAV2_LOCUS14099 transcripts in developing
      pennycress stems and seed coats to map tar-miR397 cleavage at CDS
      positions 669-689, and quantify acid-insoluble Klason lignin in
      TAV2_LOCUS14099 CRISPR knockout mutants.
    hypothesis: >-
      tar-miR397 directs cleavage of TAV2_LOCUS14099 mRNA at CDS 669-689, and
      loss of TAV2_LOCUS14099 reduces apoplastic monolignol polymerization in
      secondary cell walls.
