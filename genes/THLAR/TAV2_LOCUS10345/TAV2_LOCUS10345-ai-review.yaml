- id: PMID:18162591
  title: Arabidopsis branched-chain aminotransferase 3 functions in both amino acid and glucosinolate
    biosynthesis.
  full_text_unavailable: false
  findings:
  - statement: Arabidopsis BCAT3 assays and mutant profiles support branched-chain and methionine-related
      transamination; terminal elongated substrates are distinct from unelongated methionine.
    supporting_text: In vitro activity tests with the recombinant protein identified highest activities
      with the 2-oxo acids of leucine, isoleucine, and valine, but also revealed substantial conversion
      of intermediates of the Met chain elongation pathway.
