  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: A primary branched-chain amino-acid metabolic role is not established.
    reason: The InterPro family mapping conflates enzyme ancestry and residual substrate turnover with
      physiological pathway use. Arabidopsis BCAT4 is recruited to methionine chain elongation; the target-specific
      reciprocal match supports that specialization. Branched-chain catalytic capacity alone does not
