  label: Thlaspi arvense
description: TAV2_LOCUS10345 encodes a predicted BCAT4-like, pyridoxal-phosphate-dependent aminotransferase
  in field pennycress. Its close relationship to Arabidopsis BCAT4 supports a role in converting methionine
  to the corresponding 2-oxo acid at the entry to glucosinolate side-chain elongation. Branched-chain
  amino-acid transamination is a secondary inferred biochemical capacity. Native substrate preferences
  and cellular localization have not been measured for this protein.
