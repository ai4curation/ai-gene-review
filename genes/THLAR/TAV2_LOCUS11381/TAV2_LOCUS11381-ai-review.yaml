  label: Thlaspi arvense
description: TAV2_LOCUS11381 encodes a predicted SUR1-like, pyridoxal-phosphate-dependent carbon-sulfur
  lyase in field pennycress. It is inferred to generate thiohydroximate intermediates in glucosinolate
  biosynthesis. The protein retains a class-I aminotransferase-like fold, but its close SUR1 relationship
  supports specialized lyase chemistry rather than a tyrosine-catabolic assignment. The available 473-residue
  sequence is flagged as an N-terminal fragment, despite nearly complete coverage of Arabidopsis SUR1;
  native activity and completeness of the gene model remain unverified.
