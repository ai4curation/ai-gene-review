- id: PMID:21712415
  title: Cytosolic γ-glutamyl peptidases process glutathione conjugates in the biosynthesis of glucosinolates
    and camalexin in Arabidopsis.
  full_text_unavailable: false
  findings:
  - statement: Purified Arabidopsis GGP enzymes process multiple glucosinolate-related glutathione conjugates,
      supported by mutant accumulation and localization. The target inference uses specific GGP1 mapping.
    supporting_text: the purified recombinant GGPs can metabolize at least nine of the 10 glucosinolate-related
      GSH conjugates as well as GS-IAN.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Purified Arabidopsis GGP enzymes process multiple glucosinolate-related glutathione
      conjugates, supported by mutant accumulation and localization. The target inference uses specific
      GGP1 mapping. Accessible abstract and relevant quoted passages inspected; no native target assay
      is claimed.
