  review:
    action: MARK_AS_OVER_ANNOTATED
    summary: A glutamine metabolic role is not established by the GATase-like fold.
    reason: The UniRule transfer reflects an amidotransferase-related family, but the target maps specifically
      to GGP1. Characterized GGP1 hydrolyzes gamma-glutamyl bonds in glutathione and its conjugates; this
      is distinct from glutamine hydrolysis or amidotransfer. Family architecture alone does not establish
      the annotated physiological glutamine role.
