  label: Thlaspi arvense
description: TAV2_LOCUS24348 encodes a predicted cytosolic GGP1-like gamma-glutamyl peptidase in field
  pennycress. The enzyme is inferred to hydrolyze gamma-glutamyl bonds in glutathione conjugates during
  glucosinolate biosynthesis, releasing glutamate and cysteinylglycine conjugates. The homologous Arabidopsis
  enzyme also hydrolyzes glutathione itself. Its glutamine-amidotransferase-like fold and conserved catalytic
  residues support cysteine-peptidase chemistry rather than establishing a physiological glutamine-amidotransferase
  role.
