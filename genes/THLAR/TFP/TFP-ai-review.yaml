id: G1FNI6
gene_symbol: TFP
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:13288
  label: Thlaspi arvense
description: TaTFP is a thiocyanate-forming protein of field pennycress, an iron(II)-dependent specifier
  protein in the glucosinolate-myrosinase chemical defense system. It is a Kelch-repeat, six-bladed beta-propeller
  protein that acts as a homodimer. Rather than hydrolyzing intact glucosinolates, it captures the unstable
  aglucone generated by myrosinase upon tissue damage and redirects its rearrangement away from the default
  isothiocyanate, catalyzing formation of organic thiocyanates (e.g. allylthiocyanate), epithionitriles,
  and simple nitriles. The protein is curated as a carbon-sulfur lyase (sulfolyase, EC 4.8.1.8) and is
  expressed constitutively across plant tissues.
