  review:
    summary: The propagated nuclear localization of TaTFP is not resolved.
    action: UNDECIDED
    supported_by:
    - reference_id: PMID:26260516
    - reference_id: PMID:21783213
    reason: Arabidopsis ESP has conditional WRKY53-dependent nuclear recruitment; that observation neither
      demonstrates nor excludes a nuclear pool of pennycress TFP. Direct TaTFP structural and coupled-enzyme
      evidence does not establish this compartment. Do not call the original localization disproven by
      the absence of a known nuclear role.
