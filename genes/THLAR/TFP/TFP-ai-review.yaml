    id: GO:0005829
    label: cytosol
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  review:
    summary: Plausible and consistent with function. Specifier proteins act in the cytosol where myrosinase-released
      glucosinolate aglucones become available. Direct subcellular localization of TaTFP has not been
      experimentally established, but the cytosol is the expected site of action.
    action: ACCEPT
    supported_by:
