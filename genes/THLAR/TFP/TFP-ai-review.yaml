proposed_new_terms:
- proposed_name: thiocyanate-forming sulfolyase activity
  proposed_definition: A carbon-sulfur lyase activity that eliminates sulfate from a glucosinolate aglucone
    to yield an organic thiocyanate (EC 4.8.1.8). No GO molecular-function term currently captures this
    specific specifier-protein activity; carbon-sulfur lyase activity (GO:0016846) is the closest available
    parent.
  justification: The reaction is curated in UniProt (EC 4.8.1.8) and structurally characterized, but the
    existing GO MF granularity stops at the carbon-sulfur lyase parent, leaving specifier-protein catalysis
    under-described.
  proposed_parent:
    id: GO:0016846
    label: carbon-sulfur lyase activity
suggested_questions:
- question: What is the steady-state subcellular localization of TaTFP in intact pennycress tissue, and
    how does it co-localize with myrosinase prior to tissue disruption?
suggested_experiments:
- description: Determine TaTFP subcellular localization by fluorescent-protein fusion or immunolocalization
    in Thlaspi arvense, and test co-compartmentalization with myrosinase to define where aglucone capture
    occurs in vivo.
