core_functions:
- description: TaTFP is an Fe(2+)-dependent carbon-sulfur lyase (sulfolyase) that captures the myrosinase-generated
    glucosinolate aglucone and eliminates sulfate to form organic thiocyanates, epithionitriles, and simple
    nitriles, thereby diversifying glucosinolate breakdown chemistry away from the default isothiocyanate.
  molecular_function:
    id: GO:0016846
    label: carbon-sulfur lyase activity
  directly_involved_in:
  - id: GO:0019762
    label: glucosinolate catabolic process
  - id: GO:0080028
    label: nitrile biosynthetic process
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:21783213
    supporting_text: this protein promotes the formation of allylthiocyanate as well as the corresponding
      epithionitrile upon myrosinase-catalyzed hydrolysis of allylglucosinolate, the major glucosinolate
      of T. arvense.
  - reference_id: PMID:30900313
    supporting_text: Based on these insights, we propose that specifier proteins are catalysts that might
      be classified as Fe2+ -dependent lyases.
  - reference_id: PMID:26260516
    supporting_text: TaTFP crystallized as homodimer. Each monomer forms a six-blade β-propeller with
      a wide "top" and a narrower "bottom" opening with distinct strand-connecting loops protruding far
      beyond the lower propeller surface.
