- term:
    id: GO:0030234
    label: enzyme regulator activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: enables
  review:
    summary: Outdated molecular-function framing. Specifier proteins were historically viewed as accessory
      factors that "regulate" myrosinase product outcome, but TaTFP is now established as a catalyst in
      its own right - an Fe(2+)-dependent carbon-sulfur lyase (sulfolyase, EC 4.8.1.8) that eliminates
      sulfate from the glucosinolate aglucone to form thiocyanates and nitriles. The activity should be
      captured as a lyase, not as enzyme regulator activity. [PMID:30900313 "specifier proteins act as
      Fe(2+)-dependent lyases"]
    action: MODIFY
    proposed_replacement_terms:
