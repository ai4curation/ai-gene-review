        id: '30900313'
      value: Specifier protein that contributes to constitutive and herbivore-induced simple nitrile formation (By
        similarity). Catalyzes allylthiocyanate and corresponding epithionitrile formation from allylglucosinolate
        in the presence of myrosinase (PubMed:21783213, PubMed:23999604, PubMed:26260516, PubMed:30900313). Also
        converts aliphatic glucosinolates, such as indol-3-ylmethylglucosinolate, 4-methylsulfinylbutylglucosinolate,
        4-methylthiobutyl- and benzylisothiocyanate, to simple nitriles (PubMed:21783213)
    commentType: FUNCTION
