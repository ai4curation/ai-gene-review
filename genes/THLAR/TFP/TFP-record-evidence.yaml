    CC   -!- FUNCTION: Specifier protein that contributes to constitutive and
    CC       herbivore-induced simple nitrile formation (By similarity). Catalyzes
    CC       allylthiocyanate and corresponding epithionitrile formation from
    CC       allylglucosinolate in the presence of myrosinase (PubMed:21783213,
    CC       PubMed:23999604, PubMed:26260516, PubMed:30900313). Converts also
    CC       aliphatic glucosinolates, such as indol-3-ylmethylglucosinolate, 4-
    CC       methylsulfinylbutylglucosinolate, 4-methylthiobutyl- and
    CC       benzylisothiocyanate, to simple nitriles (PubMed:21783213).
    CC       {ECO:0000250|UniProtKB:Q93XW5, ECO:0000269|PubMed:21783213,
    CC       ECO:0000269|PubMed:23999604, ECO:0000269|PubMed:26260516,
    CC       ECO:0000269|PubMed:30900313}.
    CC   -!- CATALYTIC ACTIVITY:
    CC       Reaction=(Z)-N-(sulfonatooxy)prop-2-enimidothioate = allyl thiocyanate
    CC         + sulfate; Xref=Rhea:RHEA:69316, ChEBI:CHEBI:16189,
    CC         ChEBI:CHEBI:183062, ChEBI:CHEBI:183082; EC=4.8.1.8;
    CC         Evidence={ECO:0000269|PubMed:21783213};
    CC   -!- CATALYTIC ACTIVITY:
    CC       Reaction=(Z)-N-(sulfonatooxy)prop-2-enimidothioate = 2-(thiiran-2-
    CC         yl)acetonitrile + sulfate; Xref=Rhea:RHEA:69252, ChEBI:CHEBI:16189,
    CC         ChEBI:CHEBI:183062, ChEBI:CHEBI:183064; EC=4.8.1.8;
    CC         Evidence={ECO:0000269|PubMed:21783213};
    CC   -!- CATALYTIC ACTIVITY:
    CC       Reaction=(Z)-N-(sulfonatooxy)prop-2-enimidothioate = allyl
    CC         isothiocyanate + sulfate; Xref=Rhea:RHEA:69272, ChEBI:CHEBI:16189,
    CC         ChEBI:CHEBI:73224, ChEBI:CHEBI:183062;
    CC         Evidence={ECO:0000269|PubMed:21783213};
    CC   -!- CATALYTIC ACTIVITY:
    CC       Reaction=(Z)-phenyl-N-(sulfonatooxy)methanimidothioate =
    CC         phenylacetonitrile + sulfur + sulfate; Xref=Rhea:RHEA:69308,
    CC         ChEBI:CHEBI:16189, ChEBI:CHEBI:25979, ChEBI:CHEBI:26833,
    CC         ChEBI:CHEBI:183061; Evidence={ECO:0000269|PubMed:21783213};
    CC   -!- CATALYTIC ACTIVITY:
    CC       Reaction=glucoerucin + H2O = (Z)-4-methylsulfanylbutyl-N-
    CC         (sulfonatooxy)methanimidothioate + D-glucose; Xref=Rhea:RHEA:69320,
    CC         ChEBI:CHEBI:4167, ChEBI:CHEBI:5404, ChEBI:CHEBI:15377,
    CC         ChEBI:CHEBI:183222; Evidence={ECO:0000269|PubMed:21783213};
    CC   -!- CATALYTIC ACTIVITY:
    CC       Reaction=(Z)-4-methylsulfanylbutyl-N-(sulfonatooxy)methanimidothioate =
    CC         5-(methylsulfanyl)pentanenitrile + sulfur + sulfate + H(+);
    CC         Xref=Rhea:RHEA:69328, ChEBI:CHEBI:15378, ChEBI:CHEBI:16189,
    CC         ChEBI:CHEBI:26833, ChEBI:CHEBI:183222, ChEBI:CHEBI:183223;
    CC         Evidence={ECO:0000269|PubMed:21783213};
    CC   -!- COFACTOR:
    CC       Name=Fe(2+); Xref=ChEBI:CHEBI:29033;
    CC         Evidence={ECO:0000269|PubMed:21783213, ECO:0000269|PubMed:26260516,
    CC         ECO:0000269|PubMed:30900313};
    CC   -!- ACTIVITY REGULATION: Stimulated by the presence of Fe(2+) leading to an
    CC       increase formation of both thiocyanate and epithionitrile with
    CC       allylglucosinolate as substrate in the presence of myrosinase
    CC       (PubMed:21783213, PubMed:30900313). Repressed by EDTA
    CC       (PubMed:21783213). {ECO:0000269|PubMed:21783213,
    CC       ECO:0000269|PubMed:30900313}.
    CC   -!- BIOPHYSICOCHEMICAL PROPERTIES:
    CC       pH dependence:
    CC         Optimum pH is 5.5-6. {ECO:0000269|PubMed:21783213};
    CC   -!- SUBUNIT: Homodimer. {ECO:0000269|PubMed:26260516}.
    CC   -!- TISSUE SPECIFICITY: Expressed constitutively in roots, stems, leaves,
    CC       flowers, siliques and seedlings. {ECO:0000269|PubMed:21783213}.
    CC   -!- MISCELLANEOUS: Does not contain the mannose-binding lectin domain
    CC       present in other members of the family. {ECO:0000305}.
    CC   -!- MISCELLANEOUS: The proton donor differs depending on substrates.
    CC       {ECO:0000305|PubMed:26260516}.
