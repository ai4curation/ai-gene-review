  label: Thlaspi arvense
description: TAV2_LOCUS20462 encodes a predicted IMDH1-like, NAD-dependent hydroxyacid dehydrogenase in
  field pennycress. Homology to Arabidopsis IMDH1 supports oxidative decarboxylation of methylthioalkylmalate
  intermediates in glucosinolate chain elongation, together with activity on 3-isopropylmalate in leucine
  metabolism. The inferred enzyme uses a divalent metal cofactor. Its native substrate spectrum and relative
  pathway contributions have not been measured.
