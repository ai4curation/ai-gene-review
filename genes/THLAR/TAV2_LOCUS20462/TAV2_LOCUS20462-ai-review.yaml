- id: PMID:21697089
  title: Structural and functional evolution of isopropylmalate dehydrogenases in the leucine and glucosinolate
    pathways of Arabidopsis thaliana.
  full_text_unavailable: false
  findings:
  - statement: Arabidopsis IPMDH1 specializes toward methylthioalkylmalate but retains 3-isopropylmalate
      activity; mutagenesis demonstrates a substrate-specificity determinant. No target residue numbering
      or kinetic value is transferred.
    supporting_text: Site-directed mutagenesis of Phe-137 to a leucine in AtIPMDH1 (AtIPMDH1-F137L) reduced
      activity toward 3-(2'-methylthio)ethylmalate by 200-fold, but enhanced catalytic efficiency with
      3-isopropylmalate to levels observed with AtIPMDH2 and AtIPMDH3.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Arabidopsis IPMDH1 specializes toward methylthioalkylmalate but retains 3-isopropylmalate
      activity; mutagenesis demonstrates a substrate-specificity determinant. No target residue numbering
      or kinetic value is transferred. Accessible abstract and relevant quoted passages inspected; no
      native target assay is claimed.
- id: PMID:19674406
  title: A redox-active isopropylmalate dehydrogenase functions in the biosynthesis of glucosinolates
    and leucine in Arabidopsis.
  full_text_unavailable: true
  findings:
