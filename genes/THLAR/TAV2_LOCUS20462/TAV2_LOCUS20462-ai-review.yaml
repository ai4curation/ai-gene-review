    supporting_text: '| ipmdh1_activity | Q9FMT1 | IMDH1 | A0AAU9SYX6 | TAV2_LOCUS20462 | 806.4 | 721.1
      | 90.9 | 100.0 | Q9FMT1 (IMDH1) | yes |'
  - reference_id: file:THLAR/TAV2_LOCUS20462/TAV2_LOCUS20462-uniprot.txt
    record_section: ["DR:PANTHER"]
    supporting_text: PANTHER; PTHR42979:SF5; 3-ISOPROPYLMALATE DEHYDROGENASE 1, CHLOROPLASTIC-RELATED;
      1.
  - reference_id: PMID:21697089
    supporting_text: Site-directed mutagenesis of Phe-137 to a leucine in AtIPMDH1 (AtIPMDH1-F137L) reduced
      activity toward 3-(2'-methylthio)ethylmalate by 200-fold, but enhanced catalytic efficiency with
      3-isopropylmalate to levels observed with AtIPMDH2 and AtIPMDH3.
  - reference_id: PMID:21697089
    supporting_text: AtIPMDH1 accepts both substrates with comparable k cat / K m values, but was ∼500-fold
      more efficient with the glucosinolate substrate than the other two isoforms.
