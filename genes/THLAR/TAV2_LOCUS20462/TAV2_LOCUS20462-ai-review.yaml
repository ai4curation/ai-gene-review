proposed_new_terms:
- proposed_name: methylthioalkylmalate dehydrogenase (NAD+) activity
  proposed_definition: Catalysis of the NAD+-dependent oxidative decarboxylation of a 3-(omega-methylthio)alkylmalate
    to the corresponding omega-methylthio-2-oxoalkanoate, producing carbon dioxide and NADH. This reaction
    is the oxidative decarboxylation step of methionine chain elongation.
  justification: The proposed exact reaction is supported on the characterized Arabidopsis homolog and
    inferred for this pennycress protein from the specific reciprocal sequence relationship and catalytic
    architecture. GO:0003862 covers 3-isopropylmalate, not the chemically distinct methylthioalkylmalate
    substrate. No extant exact term was recovered by live QuickGO search; the broad NAD-dependent oxidoreductase
    parent remains applicable.
  proposed_parent:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  supported_by:
