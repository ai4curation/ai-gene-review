id: A0AAU9RDZ2
gene_symbol: TAV2_LOCUS415
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:13288
  label: Thlaspi arvense
description: TAV2_LOCUS415 encodes a predicted SOT17-like sulfotransferase in field pennycress. Its close
  relationship to Arabidopsis SOT17 supports transfer of sulfate from PAPS to desulfoglucosinolates in
  the final step of glucosinolate core biosynthesis. Both aliphatic and aromatic desulfoglucosinolate
  activities are inferred, while quantitative preferences among chain lengths and native tissue expression
  remain unresolved.
