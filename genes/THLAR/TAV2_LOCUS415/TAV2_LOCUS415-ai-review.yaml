    action: MODIFY
    summary: Desulfoglucosinolate sulfation is the specific inferred activity.
    reason: The 91.9%-identity reciprocal SOT17 match over 99.4% query coverage, together with the sulfotransferase
      domain, supports desulfoglucosinolate substrates beyond the family-wide term. Characterized Arabidopsis
      SOT17 acts on aliphatic and aromatic substrates; list both supported descendants without transferring
      exact chain-length preferences, kinetic constants or tissue expression.
