  review:
    action: UNDECIDED
    summary: Isopropylmalate synthase side activity is unresolved for this MAM homolog.
    reason: The shared MAM1/MAM3 best hit does not uniquely resolve paralog-specific substrate promiscuity.
      Arabidopsis MAM1 lacks this activity whereas MAM3 converts 2-oxoisovalerate to isopropylmalate.
      Thus neither a positive nor negative target assignment is justified from the PANTHER family mapping
      alone.
