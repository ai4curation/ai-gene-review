- id: PMID:14740211
  title: 'Biosynthesis of methionine-derived glucosinolates in Arabidopsis thaliana: recombinant expression
    and characterization of methylthioalkylmalate synthase, the condensing enzyme of the chain-elongation
    cycle.'
  full_text_unavailable: true
  findings:
  - statement: The accessible Arabidopsis MAM1 abstract reports the first two condensation cycles and
      lack of activity with primary-metabolic synthase substrates. The negative specificity is not transferred
      uniquely to a MAM1/3-like target.
    supporting_text: the MAM1 protein does not show activity with the substrates of any of these other
      enzymes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The accessible Arabidopsis MAM1 abstract reports the first two condensation cycles and
      lack of activity with primary-metabolic synthase substrates. The negative specificity is not transferred
      uniquely to a MAM1/3-like target. Accessible abstract and relevant quoted passages inspected; no
      native target assay is claimed.
- id: PMID:17369439
  title: MAM3 catalyzes the formation of all aliphatic glucosinolate chain lengths in Arabidopsis.
  full_text_unavailable: false
  findings:
  - statement: Arabidopsis MAM3 accepts all six condensation-cycle substrates and some non-methionine
      2-oxo acids, including the isopropylmalate-synthase substrate. This bounds the uncertainty of a
      co-ortholog assignment.
    supporting_text: MAM3 also accepts a range of non-Met-derived 2-oxoacids, e.g. converting pyruvate
      to citramalate and 2-oxoisovalerate to isopropylmalate
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Arabidopsis MAM3 accepts all six condensation-cycle substrates and some non-methionine
      2-oxo acids, including the isopropylmalate-synthase substrate. This bounds the uncertainty of a
