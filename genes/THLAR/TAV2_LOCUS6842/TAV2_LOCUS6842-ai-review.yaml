  label: Thlaspi arvense
description: TAV2_LOCUS6842 encodes a predicted methylthioalkylmalate synthase in field pennycress. It
  is a MAM1/3-like homolog inferred to condense acetyl-CoA with methionine-derived 2-oxo acids during
  glucosinolate side-chain elongation, probably in plastids. Its native chain-length range is unresolved;
  similarity to Arabidopsis MAM1 does not establish restriction to one elongation cycle or exclude MAM3-like
  substrate promiscuity.
