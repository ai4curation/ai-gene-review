  review:
    action: ACCEPT
    summary: The large subunit contributes to heterodimeric isopropylmalate isomerase activity.
    reason: The 95.3% identity IIL1 match and catalytic IPMI-domain architecture support the conserved
      enzyme subunit. Arabidopsis IIL1 forms functional heterodimers with LeuD small subunits. This annotation
      is interpreted as contribution within the enzyme complex, not autonomous catalysis by an isolated
      large subunit; original machine fields are preserved. Unlike SSU2/SSU3-like small subunits, the
      shared IIL1-like large subunit has both reactions as conserved core contributions. GO:0003861 is
      already represented in the second core function; no dedicated leucine-only specialization is required
      for ACCEPT.
    supported_by:
