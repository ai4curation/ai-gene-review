  label: Thlaspi arvense
description: TAV2_LOCUS24872 encodes an IIL1-like large subunit of a predicted heterodimeric isopropylmalate
  isomerase in field pennycress. The aconitase-like catalytic architecture and close Arabidopsis IIL1
  match support contribution to malate-derivative isomerization in leucine biosynthesis and methionine-derived
  glucosinolate chain elongation. Catalysis depends on association with a small LeuD-like subunit; native
  subunit pairing and plastid targeting remain untested.
