taxon:
  id: NCBITaxon:13288
  label: Thlaspi arvense
description: >-
  Chloroplastic ATP sulfurylase (sulfate adenylyltransferase, EC 2.7.7.4) in
  field pennycress (Thlaspi arvense), orthologous to Arabidopsis thaliana
  APS1/ATPS1 (AT3G22890). TAV2_LOCUS7508 contains an N-terminal plastid transit
  region followed by an ATP-sulfurylase PUA-like domain and a C-terminal sulfate
  adenylyltransferase catalytic domain. It catalyzes the first committed step of
  plastidic sulfate assimilation, converting inorganic sulfate and ATP into
  adenosine 5'-phosphosulfate (APS) and diphosphate, supplying activated sulfate
  for both reductive cysteine biosynthesis and 3'-phosphoadenosine
  5'-phosphosulfate (PAPS)-dependent glucosinolate (sinigrin) sulfation. Its
  transcript contains a conserved miR395 target site at CDS positions 973-993
  that mediates post-transcriptional regulation in response to sulfur status.
