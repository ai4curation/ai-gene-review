  - id: PMID:8058839
    title: >-
      Cloning of a cDNA encoding ATP sulfurylase from Arabidopsis thaliana by
      functional expression in Saccharomyces cerevisiae.
    findings:
      - statement: >-
          Arabidopsis APS1 encodes a chloroplastic ATP sulfurylase that
          catalyzes the formation of adenosine 5'-phosphosulfate (APS) from ATP
          and inorganic sulfate and is imported into intact chloroplasts.
        supporting_text: >-
          ATP sulfurylase, the first enzyme in the sulfate assimilation pathway of plants,
          catalyzes the formation of adenosine phosphosulfate from ATP and sulfate.
        full_text_unavailable: true
      - statement: >-
          APS1 possesses an N-terminal chloroplast transit peptide and enters
          isolated intact chloroplasts.
        supporting_text: >-
          Two lines of evidence indicate that APS1 encodes a
          chloroplast form of ATP sulfurylase. Its predicted amino-terminal sequence
          resembles a chloroplast transit peptide; and the APS1 polypeptide, synthesized
          in vitro, is capable of entering isolated intact chloroplasts.
        full_text_unavailable: true
  - id: PMID:24027241
    title: >-
      Natural variation in the ATPS1 isoform of ATP sulfurylase contributes to
      the control of sulfate levels in Arabidopsis.
    findings:
      - statement: >-
          Plastidic ATP sulfurylase (ATPS1/APS1) activates inorganic sulfate to
          APS as the first step of sulfate assimilation and controls flux into
          both primary sulfate reduction and secondary glucosinolate
          biosynthesis (~55% reduction in glucosinolate synthesis rate in atps1
          mutants).
        supporting_text: >-
          In sulfate assimilation, sulfate has to be first activated by ATP
          sulfurylase to adenosine 5′-phosphosulfate ( APS ), which is reduced
          in two steps, by adenosine 5′-phosphosulfate reductase ( APR ) to
          sulfite and subsequently by sulfite reductase to sulfide.
        full_text_unavailable: false
      - statement: >-
          Loss of ATPS1 reduces glucosinolate biosynthesis rate by approximately
          55% in Brassicaceae.
        supporting_text: >-
          Disruption of ATPS1 in the Col-0 background diminished the synthesis
          rate of glucosinolates by approximately 55%
        full_text_unavailable: false
  - id: PMID:34990041
    title: >-
      Chromosome-level Thlaspi arvense genome provides new tools for
      translational research and for a newly domesticated cash cover crop of the
      cooler climates.
    findings:
      - statement: >-
          The chromosome-level Thlaspi arvense genome and small RNA atlas
          identified 72 miRNA loci, including conserved miR395 loci.
        supporting_text: >-
          We identified 72 miRNA‐producing loci, with 53 that were already known
          from other species, and 19 appeared to be species‐specific.
        full_text_unavailable: false
