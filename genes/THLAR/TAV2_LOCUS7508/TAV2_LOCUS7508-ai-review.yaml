suggested_questions:
  - question: >-
      To what extent does seed-specific expression of tar-miR395 or partial loss
      of TAV2_LOCUS7508 reduce seed sinigrin (allylglucosinolate) accumulation
      in pennycress without impairing vegetative sulfur nutrition?
suggested_experiments:
  - description: >-
      Quantify TAV2_LOCUS7508 mRNA cleavage by 5' RLM-RACE at CDS positions
      973-993 and measure seed sinigrin and total sulfur levels in pennycress
      lines with altered tar-miR395 expression or TAV2_LOCUS7508 knockdown.
    hypothesis: >-
      tar-miR395 cleaves TAV2_LOCUS7508 transcripts at CDS 973-993 and limits
      plastidic APS production, reducing PAPS flux into seed sinigrin
      biosynthesis.
