    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    review:
      action: REMOVE
      reason: >-
        Classic TreeGrafter domain-fusion false positive from PANTHER family
        PTHR11055 (BIFUNCTIONAL 3'-PHOSPHOADENOSINE 5'-PHOSPHOSULFATE SYNTHASE),
        which includes metazoan bifunctional PAPSS1/PAPSS2 enzymes that fuse an
        ATP sulfurylase domain with an adenylylsulfate (APS) kinase domain. In
        plants, ATP sulfurylase (APS1-APS4) and APS kinase (APK1-APK4) are
        encoded by separate genes; TAV2_LOCUS7508 contains only the PUA-like
        (AA 265-428) and sulfate adenylyltransferase catalytic (AA 438-659)
        domains and has no APS kinase domain or activity.
