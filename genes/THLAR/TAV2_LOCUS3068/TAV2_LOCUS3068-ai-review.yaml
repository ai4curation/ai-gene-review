suggested_questions:
  - question: >-
      Does disrupting the miR162 target site in pennycress TAV2_LOCUS3068 (CDS
      positions 3073-3094) alter global miRNA accumulation—such as miR395,
      miR397, and miR156/172—and affect seed oil or sinigrin levels?
suggested_experiments:
  - description: >-
      Perform 5' RLM-RACE or PARE-seq (degradome sequencing) in developing
      pennycress embryos and leaves to directly map the predicted miR162-guided
      cleavage site between nucleotides 3083 and 3084 of TAV2_LOCUS3068 mRNA.
    hypothesis: >-
      tar-miR162a directs Argonaute-mediated endonucleolytic cleavage of
      TAV2_LOCUS3068 mRNA at the conserved site matching Arabidopsis DCL1,
      buffering DCL1 transcript abundance.
