  - id: PMID:34990041
    title: >-
      Chromosome-level Thlaspi arvense genome provides new tools for
      translational research and for a newly domesticated cash cover crop of the
      cooler climates.
    findings:
      - statement: >-
          Small RNA sequencing and genome annotation of Thlaspi arvense
          identified 72 miRNA-producing loci (53 conserved and 19 novel),
          processed by the canonical plant miRNA biogenesis pathway.
        supporting_text: >-
          We identified 72 miRNA‐producing loci, with 53 that were already known
          from other species, and 19 appeared to be species‐specific.
        full_text_unavailable: false
  - id: PMID:38918606
    title: >-
      In vivo structure and dynamics of the plant microprocessor Skip-HYL1-SE-DCL1
      complex in pri-miRNA processing.
    findings:
      - statement: >-
          In Brassicaceae (Arabidopsis thaliana), DCL1 forms the core nuclear
          Microprocessor complex with HYL1 and SE, where its RNase IIIa and
          RNase IIIb domains cleave the 3' and 5' arms of pri-miRNAs to generate
          mature miRNAs.
        supporting_text: >-
          Arabidopsis Microprocessor comprises Dicer-like1 (DCL1) and two core
          cofactors, zinc-finger protein Serrate (SE) and a dsRNA-binding protein
          called hyponastic leaves 1 (HYL1)
        full_text_unavailable: false
      - statement: >-
          The tandem RNase IIIb and RNase IIIa domains of DCL1 cleave the 5' and
          3' arms of pri-miRNA hairpins respectively in vivo and in vitro.
        supporting_text: >-
          The initial cutting sites of RNase a, reflected in the DCL1E1696Q
          line, are illustrated in the bottom panel of Fig. 3a. These results
          are well aligned with our in vitro results that the RNase b and a
          domains process the 5′ and 3′ arms
        full_text_unavailable: false
