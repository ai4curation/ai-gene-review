      id: GO:0003677
      label: DNA binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      action: REMOVE
      reason: >-
        False-positive InterPro2GO projection from IPR006935 (Helicase/UvrB_N),
        which includes prokaryotic DNA repair helicases (UvrB) alongside RNA
        helicases. Plant DCL1 binds and cleaves double-stranded RNA hairpins
