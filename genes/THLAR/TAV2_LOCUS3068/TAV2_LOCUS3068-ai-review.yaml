taxon:
  id: NCBITaxon:13288
  label: Thlaspi arvense
description: >-
  Endoribonuclease Dicer-like 1 (DCL1) in field pennycress (Thlaspi arvense),
  orthologous to Arabidopsis thaliana DCL1 (AT1G01040). TAV2_LOCUS3068 is a
  1,910-amino-acid nuclear multidomain ribonuclease III enzyme comprising an
  N-terminal DExD/H-box ATP-binding helicase domain, a Dicer double-stranded
  RNA-binding fold, a PAZ domain, tandem catalytic RNase IIIa and RNase IIIb
  domains, and two C-terminal double-stranded RNA-binding motifs (DRBMs). It
  serves as the catalytic core of the nuclear plant Microprocessor complex,
  performing sequential ATP-dependent cleavage of primary miRNA transcripts
  (pri-miRNAs) and precursor miRNAs (pre-miRNAs) to generate mature 21-nucleotide
  miRNA/miRNA* duplexes. Its own mRNA contains a conserved internal target site
  for miR162 (CDS positions 3073-3094), establishing an autoregulatory negative
  feedback loop that maintains miRNA biogenesis homeostasis.
