      Catalyzes the endonucleolytic cleavage of double-stranded primary miRNA
      (pri-miRNA) and precursor miRNA (pre-miRNA) hairpins in the nuclear
      Microprocessor complex to generate mature 21-nt miRNA/miRNA* duplexes,
      while undergoing homeostatic negative feedback regulation via miR162-guided
      mRNA cleavage.
