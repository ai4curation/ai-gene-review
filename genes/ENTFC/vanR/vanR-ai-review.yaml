knowledge_gaps:
- gap_statement: >-
    How phosphorylation of Asp53 is communicated to the DNA-binding domain, and
    what the activated VanR-promoter complex looks like, are unknown for this
    system. There is no structure of VanR in either state and none of it bound to
    the vanH promoter, the operator sequence it recognises has not been defined at
    base-pair resolution in the published record used here, and whether activation
    works by relieving an autoinhibitory contact, by promoting oligomerisation on
    the promoter, or by both is undetermined. The reported inhibition of VanR's
    DNA binding by VanS itself is a further unexplained layer.
  boundary: >-
    Firmly established: the domain organisation, the phosphorylation site, the
    kinetics and specificity of phosphotransfer from VanS, the stability of the
    phosphoaspartate, dephosphorylation by VanS, the increase in promoter affinity
    on phosphorylation, the monomeric state of the purified protein, and the
    identity of the cotranscribed target genes.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    An activated-state structure would show whether the latch can be jammed
    pharmacologically, which is an attractive way to block inducible resistance
    without having to inhibit any of the three remodelling enzymes; it would also
    settle whether the reported VanS inhibition of DNA binding is a real third
    layer of control.
suggested_questions:
- question: >-
    All eight GOA rows for vanR are electronic and none cites a publication,
    although the protein was purified and characterised in 1993, its
    phosphotransfer kinetics measured in 1996, and its promoter binding and
    phosphorylation-dependent affinity reported in the work UniProt cites with
    experimental evidence. Could experimental annotations be made from
    PMID:8494882, PMID:8664263 and PMID:8161518?
- question: >-
    UniProt entry Q06239 carries both the Activator and the Repressor keywords,
    while its FUNCTION text describes only activation of vanH, vanA and vanX. Is
    there evidence for repression by VanR, for example autoregulation of the vanR
    promoter in the unphosphorylated state, or should the Repressor keyword be
    reviewed? The answer decides whether the direction-specific process term for
    this gene should be positive regulation alone.
- question: >-
    GO-CAM model gomodel:671ae02600002832 represents VanR twice with the same gene
    product, function and process, splitting the VanS kinase and phosphatase edges
    between the two copies so that the inhibitory branch points at a node with no
    outgoing edges, and it gives the VanR activity has_input UniProtKB:Q05709, the
    VanH protein, rather than the operon's genes as targets. Both points are
    recorded as source_defects entries on the GO:0001216 row of this review;
    should the two nodes be merged?
suggested_experiments:
- description: >-
    Define the operator and the activation mechanism. Map the VanR binding site on
    the vanH and vanR promoters by footprinting with phosphorylated and
    unphosphorylated protein, measure the stoichiometry on DNA, and test whether a
    phosphomimetic substitution at Asp53 gives constitutive promoter occupancy and
    constitutive resistance in vivo.
- description: >-
    Test the reported inhibition of VanR DNA binding by VanS. Reconstitute
    full-length VanS in nanodiscs with VanR and the vanH promoter, and ask whether
    the sensor sequesters the regulator independently of its phosphatase activity,
    using a phosphatase-dead VanS variant to separate the two effects.
