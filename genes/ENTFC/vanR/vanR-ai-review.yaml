      vanR; phosphorylation of VanR increases binding affinity to the vanH and vanR promoters
      significantly
  - reference_id: PMID:8494882
    supporting_text: 32P-Phospho VanR showed chemical stability anticipated for an aspartyl
      phosphate and was relatively stable to hydrolysis (t1/2 = 10-12 h).
- description: >-
    Receiver half of the VanS-VanR phosphorelay. VanR is the dedicated
    phosphoryl-group acceptor of VanS, and the specificity runs both ways: VanS
    transfers to VanR ten thousand times more efficiently than to the heterologous
    regulator PhoB and not at all to OmpR, ArcB or CreB. It is also the substrate
    of the VanS phosphatase arm, so its phosphorylation state, and hence the state
    of the operon, is set entirely by that one sensor. Acetyl phosphate can
    phosphorylate it non-enzymatically in vitro.
  molecular_function:
    id: GO:0000156
    label: phosphorelay response regulator activity
  directly_involved_in:
