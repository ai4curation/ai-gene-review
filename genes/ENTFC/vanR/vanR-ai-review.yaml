id: Q06239
gene_symbol: vanR
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1352
  label: Enterococcus faecium
description: >-
  VanR is the response regulator that turns the glycopeptide-resistance operon
  on. It is a cytoplasmic, monomeric, two-domain protein of the OmpR/PhoB
  subclass: an N-terminal receiver domain that is phosphorylated on Asp53, and a
  C-terminal winged-helix DNA-binding domain. Its partner, the membrane sensor
  kinase VanS, controls that phosphorylation in both directions, transferring a
  phosphoryl group from its own phosphohistidine to Asp53 and also removing it
  again; the relay is highly specific, with a ten-thousand-fold kinetic
  preference over a heterologous response regulator. Phospho-VanR binds the
  promoter regions of vanR and of vanH with much higher affinity than the
  unphosphorylated protein, and from the vanH promoter the resistance genes vanH,
  vanA and vanX are cotranscribed, so the cell acquires the enzymes that build
  peptidoglycan precursors ending in D-Ala-D-Lac instead of D-Ala-D-Ala. The
  aspartyl phosphate is chemically stable, with a half-life of ten to twelve hours
  in vitro, which is why the regulator does not simply relax to the off state: the
  phosphatase arm of VanS has to remove the mark actively, and that is what keeps
  the operon silent in the absence of the inducing signal. VanR can also be
  phosphorylated non-enzymatically by acetyl phosphate, and its DNA binding has
  been reported to be inhibited by VanS itself.
