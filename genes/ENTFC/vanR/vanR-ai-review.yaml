  title: The VanS-VanR two-component regulatory system controls synthesis of depsipeptide
    peptidoglycan precursors in Enterococcus faecium BM4147.
  findings:
  - statement: >-
      VanR is a transcriptional activator of the OmpR subclass of response
      regulators.
    supporting_text: VanR was a transcriptional activator related to response regulators
      of the OmpR subclass.
  - statement: >-
      The VanR-VanS system activates a promoter from which vanH, vanA and vanX are
      cotranscribed, shown by reporter fusions and RNA mapping.
    supporting_text: Analysis of transcriptional fusions with a reporter gene and RNA
      mapping indicated that the VanR-VanS two-component regulatory system activates
      a promoter used for cotranscription of the vanH, vanA, and vanX resistance genes.
  - statement: >-
      Synthesis of the three resistance enzymes is controlled transcriptionally by
      the VanS-VanR system, and all three are necessary for resistance.
    supporting_text: The distal part of the van cluster encodes VanH, VanA, and a third
      enzyme, VanX, all of which are necessary for resistance.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The in vivo genetics of the system and the source of UniProt's function
      statement for this entry; it is not cited by any GOA row, which is worth
      raising with the curators. It is the evidence behind both proposed new
      annotations and behind the direction of the transcription-regulation term.
      Abstract-only in the cache.
- id: PMID:8494882
  title: 'Purification and characterization of VanR and the cytosolic domain of VanS:
    a two-component regulatory system required for vancomycin resistance in Enterococcus
    faecium BM4147.'
  findings:
  - statement: >-
      Phospho-VanS transfers its phosphoryl group to VanR, which is the
      phosphorylation event that activates the regulator.
    supporting_text: 32P-PhosphoMBP-VanS transferred the phosphoryl group to VanR.
  - statement: >-
      The mark is an aspartyl phosphate and is chemically long-lived, with a
      half-life of ten to twelve hours.
    supporting_text: 32P-Phospho VanR showed chemical stability anticipated for an aspartyl
      phosphate and was relatively stable to hydrolysis (t1/2 = 10-12 h).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The purification and characterisation of VanR itself, cited by UniProt with
      experimental evidence for the function, the subunit state and the
      phosphorylation of this entry, but by no GOA row. The half-life measurement is
      what makes the VanS phosphatase arm necessary rather than redundant.
      Abstract-only in the cache.
- id: PMID:8664263
  title: Kinetic comparison of the specificity of the vancomycin resistance VanSfor
    two response regulators, VanR and PhoB.
  findings:
  - statement: >-
      VanR is the kinetically preferred phosphoryl acceptor of VanS, by four orders
      of magnitude over the heterologous regulator PhoB.
    supporting_text: A KM of 3 microM was estimated for VanR, leading to a 10(4)-fold
      preference in kxfer/KM for phosphotransfer to VanR compared to PhoB.
  - statement: >-
      Three other response regulators accept no phosphoryl group at all, so the
      relay is dedicated.
    supporting_text: No phosphotransfer was detachable to three other E. coli response
      regulators, OmpR, ArcB, or CreB, providing some sense of the selectivity against
      two-component regulatory system cross-talk.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly cited. Note that the cached title contains a typographical run-on,
      "VanSfor", which is how PubMed records it; the paper is the right one. Cited
      by UniProt for the function of this entry but by no GOA row. Abstract-only in
      the cache.
- id: PMID:30677074
  title: Vancomycin does not affect the enzymatic activities of purified VanSA.
  findings:
  - statement: >-
      VanS dephosphorylates VanR in the absence of vancomycin, holding it in the
      transcriptionally inactive state.
    supporting_text: In the absence of vancomycin, VanS dephosphorylates VanR, thereby
      maintaining it in a transcriptionally inactive state.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text available and read. Cited here only for the phosphatase arm acting
      on VanR, which is not in dispute; the paper's contested claim concerns whether
      vancomycin affects VanS activity, which is discussed in the vanS review and
      does not bear on any annotation here.
