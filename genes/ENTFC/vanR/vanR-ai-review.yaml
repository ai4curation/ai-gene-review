      confidence: PROBABLE
      explanation: >-
        In a GO-CAM model of the vanA glycopeptide-resistance operon
        (gomodel:671ae02600002832, a development model), the VanR transcription
        activity is given has_input UniProtKB:Q05709, the VanH dehydrogenase.
