- id: PMID:7873524
  title: Overexpression, purification, and characterization of VanX, a D-, D-dipeptidase
    which is essential for vancomycin resistance in Enterococcus faecium BM4147.
  findings:
  - statement: >-
      VanX is a metal-activated D,D-dipeptidase, with turnover rising from 4.7 per
      second without divalent metal to as much as 788 per second with it.
    supporting_text: However, in the presence of metal cations, kcat can be as high
      as 788 s-1.
  - statement: >-
      VanX discriminates more than a hundred-thousand-fold between D-Ala-D-Ala and
      D-Ala-D-lactate, which is what leaves the depsipeptide available for
      incorporation.
    supporting_text: The more than 10(5)-fold differential in catalytic efficiency of
      VanX for hydrolysis of D-Ala-D-Ala vs D-Ala-D-lactate leaves D-Ala-D-lactate intact
      for subsequent incorporation into peptidoglycan.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary characterization of VanX and the source of UniProt's reaction,
      cofactor, kinetic and subunit statements for Q06241. It is not cited by any
      GOA row for this gene, which is itself worth raising with the curators.
      Abstract-only in the cache, but the abstract carries the kinetics and the
      selectivity figure.
- id: PMID:1556077
  title: The VanS-VanR two-component regulatory system controls synthesis of depsipeptide
    peptidoglycan precursors in Enterococcus faecium BM4147.
  findings:
  - statement: >-
      vanH, vanA and vanX are all necessary for resistance and are cotranscribed
      under VanS-VanR control.
    supporting_text: The distal part of the van cluster encodes VanH, VanA, and a third
      enzyme, VanX, all of which are necessary for resistance.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Establishes that vanX belongs to the inducible, regulated resistance response
      and is required for it, which is the support for the proposed GO:0046677
      annotation. UniProt cites it for the INDUCTION statement on this entry.
      Abstract-only in the cache.
- id: PMID:8852545
  title: Mechanisms of glycopeptide resistance in enterococci.
  findings:
  - statement: >-
      VanX and VanY act in series to eliminate D-Ala-D-Ala-containing precursors,
      VanX on the free dipeptide and VanY on the assembled precursor.
    supporting_text: These two proteins act in series to eliminate D-Ala-D-Ala-containing
      precursors.
  - statement: >-
      VanX is required for resistance whereas VanY only slightly increases its
      level, which is why the two are not interchangeable.
    supporting_text: VanX is required for resistance whereas VanY only slightly increases
      the level of resistance mediated by VanH, VanA and VanX.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      A review, cited for the division of labour between VanX and VanY and for
      their relative importance; both points are consistent with the primary
      papers, and the second is corroborated by UniProt's statement on vanY that it
      is not necessary for resistance in BM4147.
