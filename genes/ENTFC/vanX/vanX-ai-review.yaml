id: Q06241
gene_symbol: vanX
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1352
  label: Enterococcus faecium
description: >-
  VanX is the zinc dipeptidase that clears D-alanyl-D-alanine from the cytoplasm
  of glycopeptide-resistant enterococci. It is encoded in the Tn1546-type van
  cluster and cotranscribed with vanH and vanA from a promoter switched on by the
  VanS-VanR two-component system when the antibiotic is present. A homodimer of
  the peptidase M15D family, each subunit binds one zinc ion through two
  histidines and an aspartate and uses an aspartate as the catalytic proton
  donor; divalent cations raise the turnover number more than a hundredfold, to
  as much as 788 per second. Its reaction is the hydrolysis of the free dipeptide
  D-Ala-D-Ala to two D-alanines, and its defining property is what it does not
  do: it is more than a hundred thousand times less efficient on
  D-alanyl-D-lactate, the depsipeptide that the partner ligase VanA makes. That
  asymmetry is the reason the gene is in the cluster. By destroying the normal
  dipeptide while sparing the depsipeptide, VanX ensures that the
  D-Ala-D-Ala-adding enzyme is offered the resistant terminus rather than the
  drug-binding one, so the cell wall is built almost entirely from precursors
  that glycopeptides cannot grip. VanX is indispensable for resistance, unlike the
  downstream carboxypeptidase VanY, which only raises the level a little; it acts
  on the free dipeptide pool, whereas VanY trims precursors that were already
  assembled with D-Ala-D-Ala.
