- term:
    id: GO:0005829
    label: cytosol
  evidence_type: IC
  original_reference_id: PMID:7873524
  qualifier: located_in
  review:
    summary: >-
      Proposed new annotation. GOA carries no cellular-component term for VanX,
      and the UniProt record has no SUBCELLULAR LOCATION block. The protein has no
      transmembrane segment and no signal peptide, it was expressed and purified
      as a soluble homodimer, and its substrate is the free cytoplasmic
      D-Ala-D-Ala pool that the cytosolic ligases make and the
      D-Ala-D-Ala-adding enzyme consumes.
    action: NEW
    reason: >-
      An inference the reviewer authors from two independent lines: the absence of
      any membrane-targeting or export feature on a protein purified as a soluble
      dimer, and the compartment of the substrate, since the dipeptide pool VanX
      destroys is cytoplasmic and its disappearance is what redirects the
      cytoplasmic precursor pathway. Enterococcus faecium has no cytoplasmic
      organelles, so the cytosol is the specific compartment rather than a choice
      between alternatives. It is also the location named for the core function
      here.
    supported_by:
    - reference_id: PMID:7873524
      supporting_text: The more than 10(5)-fold differential in catalytic efficiency
        of VanX for hydrolysis of D-Ala-D-Ala vs D-Ala-D-lactate leaves D-Ala-D-lactate
        intact for subsequent incorporation into peptidoglycan.
    - reference_id: file:ENTFC/vanX/vanX-uniprot.txt
      record_section: ["CC:SUBUNIT"]
      supporting_text: Homodimer.
- term:
    id: GO:0046677
    label: response to antibiotic
  evidence_type: IMP
  original_reference_id: PMID:1556077
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. VanX is one of the three enzymes of an inducible
      glycopeptide-resistance response: the gene is cotranscribed with vanH and
      vanA only when the VanS-VanR system detects the drug, UniProt records the
      induction, and all three products are necessary for resistance. VanX is in
      fact the one whose loss is least tolerated, unlike vanY.
    action: NEW
    reason: >-
      VanX performs a step of the response itself rather than merely being
      required for it: it is the hydrolase that removes the competing dipeptide, so
      that the altered precursor is what reaches the cell wall. GO:0046677 is the
      most specific available term, since GO has no glycopeptide-resistance or
      response-to-vancomycin child, and functionally equivalent resistance enzymes
      in this repository already carry it. It is not an ancestor or descendant of the other
      process term proposed for this gene.
    supported_by:
    - reference_id: PMID:1556077
      supporting_text: The distal part of the van cluster encodes VanH, VanA, and a third
        enzyme, VanX, all of which are necessary for resistance.
    - reference_id: PMID:8852545
      supporting_text: VanX is required for resistance whereas VanY only slightly increases
        the level of resistance mediated by VanH, VanA and VanX.
    - reference_id: file:ENTFC/vanX/vanX-uniprot.txt
      record_section: ["CC:MISCELLANEOUS"]
      supporting_text: Does not hydrolyze D-Ala-D-lactate, which remains intact for
        subsequent incorporation into peptidoglycan precursors.
core_functions:
- description: >-
    Zinc-dependent D-Ala-D-Ala dipeptidase. VanX hydrolyses the free dipeptide
    D-alanyl-D-alanine to two D-alanines, with a turnover that rises more than a
    hundredfold in the presence of divalent cations, and is more than a hundred
    thousand times less efficient on the depsipeptide D-alanyl-D-lactate. That
    discrimination is the function: by emptying the normal dipeptide pool while
    leaving VanA's product untouched, it forces the D-Ala-D-Ala-adding enzyme to
    use the resistant terminus, so the wall is built from precursors that
    glycopeptides bind weakly. It acts on the free dipeptide, upstream of the
    carboxypeptidase VanY, which trims precursors already carrying D-Ala-D-Ala.
  molecular_function:
    id: GO:0160237
    label: D-Ala-D-Ala dipeptidase activity
