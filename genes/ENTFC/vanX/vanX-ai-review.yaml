  review:
    summary: >-
      InterPro2GO mapping from the peptidase M15 domain. VanX is a metal enzyme by
      more than inference: UniProt records one zinc ion per subunit with
      experimental evidence, places the three metal-coordinating residues, and
      notes activation by iron, cobalt or nickel as alternatives, and the measured
      turnover rises from 4.7 per second without divalent metal to as much as 788
      per second with it.
    action: ACCEPT
    reason: >-
      True and informative. GO:0008237 is not an is_a ancestor of GO:0160237
