    summary: >-
      UniRule-derived annotation. The underlying curated evidence on this entry is
      experimental: one zinc ion per subunit with evidence from two papers, three
      annotated zinc-binding residues (116, 123 and 184) and a catalytic
      proton-donor aspartate.
