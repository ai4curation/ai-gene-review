  review:
    summary: >-
      InterPro2GO mapping from the peptidase M15 domain signatures. VanX is
      genuinely a peptidase, but what it hydrolyses is a free dipeptide, not a
      protein: UniProt gives the reaction as D-alanyl-D-alanine + H2O = 2
      D-alanine, and the kinetics are for D-Ala-D-Ala, D-Ala-D-Ser and
      D-Ser-D-Ala. GO:0006508 is defined as the hydrolysis of proteins into
      smaller polypeptides and/or amino acids.
    action: MODIFY
    reason: >-
      The aspect and the region of the ontology are right and the gene does the
      work of the step, so the row is not removed; but the term names the wrong
      class of substrate. GO:0043171 peptide catabolic process is defined over
      compounds of two or more amino acids, which is exactly what D-Ala-D-Ala is,
      and it is the term that matches the curated reaction. This is a lateral
      substitution within the correct area rather than a refinement, which is a
      sanctioned use of MODIFY. The same signature-derived proteolysis row appears
      on vanY, where the substrate is a peptidoglycan precursor and a different
      replacement is appropriate.
