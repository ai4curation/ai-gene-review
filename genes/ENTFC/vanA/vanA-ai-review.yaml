    label: response to antibiotic
  evidence_type: IMP
  original_reference_id: PMID:1503450
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. VanA is one of three enzymes of an inducible
      resistance response: the van operon is transcribed only when the VanS-VanR
      system detects the drug, and the enzymes then rebuild the precursor so that
      the antibiotic cannot bind it. UniProt records the induction on this entry.
      Nothing in GOA currently connects the gene to antibiotic resistance.
