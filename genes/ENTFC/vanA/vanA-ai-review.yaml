id: P25051
gene_symbol: vanA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1352
  label: Enterococcus faecium
description: >-
  VanA is the ATP-dependent ligase that gives enterococci high-level, inducible
  resistance to the glycopeptide antibiotics vancomycin and teicoplanin. It is
  encoded on the Tn1546-type van gene cluster carried by plasmids such as pIP816
  and is transcribed, together with vanH and vanX, from a promoter switched on by
  the VanS-VanR two-component system in response to the drug. VanA belongs to the
  D-alanine--D-alanine ligase (Ddl) family and shares its ATP-grasp architecture
  and two divalent-metal site, but its substrate specificity has shifted: instead
  of joining two D-alanines through an amide bond, it condenses D-alanine with a
  D-2-hydroxy acid through an ester bond, giving the depsipeptide
  D-alanyl-(R)-lactate. D-lactate is supplied by the partner dehydrogenase VanH,
  and the depsipeptide is accepted by the normal D-Ala-D-Ala-adding enzyme, so the
  cell builds a UDP-MurNAc-pentadepsipeptide that ends in D-Ala-D-Lac rather than
  D-Ala-D-Ala. Glycopeptides bind this terminus with more than a thousand-fold
  lower affinity, because one of the five hydrogen bonds of the drug-target
  complex is lost, and the cell is resistant. The enzyme is a soluble
  precursor-biosynthetic protein that associates peripherally with the cytoplasmic
  face of the plasma membrane; it retains enough D-Ala-D-Ala ligase activity to
  complement a temperature-sensitive ddl mutant, but its evolved activity, and the
  one its kinetic constants describe, is the ester-forming reaction.
