- term:
    id: GO:0008716
    label: D-alanine-D-alanine ligase activity
  evidence_type: IDA
  original_reference_id: PMID:1931965
  qualifier: enables
  review:
    summary: >-
      VanA is a Ddl-family enzyme whose specificity has been altered rather than
      replaced: it is described in this paper as a D-alanine:D-alanine ligase of
      altered substrate specificity, and it retains enough dipeptide-ligase
      activity to rescue an E. coli strain with a temperature-sensitive ddl
      allele. Its measured kinetic constants, however, are for D-hydroxy acid
      acceptors, and the reaction UniProt records is the ester-forming one.
    action: KEEP_AS_NON_CORE
    reason: >-
      A genuine secondary activity rather than an over-annotation or an error.
      The transcomplementation of a ddl mutant is in vivo evidence that the
      dipeptide-ligase reaction is physiologically competent, which is why it is
      not marked over-annotated or removed. It is not the core function: the
      enzyme exists because its specificity shifted towards the depsipeptide, and
      that is the activity its EC number, its name and its kinetics describe.
      This is the secondary-activity tier of the enzyme-specificity policy.
    supported_by:
    - reference_id: PMID:1931965
      supporting_text: VanA is a D-alanine:D-alanine ligase of altered substrate specificity
    - reference_id: PMID:2266943
      supporting_text: The vanA gene was able to transcomplement an E. coli mutant with
        thermosensitive D-ala-D-ala ligase activity.
