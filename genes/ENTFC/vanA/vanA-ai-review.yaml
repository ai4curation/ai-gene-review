- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IDA
  original_reference_id: PMID:2266943
  qualifier: located_in
  review:
    summary: >-
      VanA was discovered as a vancomycin-induced 40 kDa protein in enterococcal
      membrane fractions, and the E. coli-expressed protein comigrated with it.
      UniProt records the location as cell membrane, peripheral membrane protein,
      cytoplasmic side. The same paper concludes that VanA is functionally one of
      the cytoplasmic precursor-synthesising enzymes.
    action: KEEP_AS_NON_CORE
    reason: >-
      A real, directly observed association, so the row is kept rather than
      removed: a peripheral protein on the cytoplasmic face of the membrane is
      legitimately annotated to the plasma membrane. It is non-core because the
      reaction itself is a soluble one on cytosolic substrates, and because the
      enzyme has no membrane-embedded segment; the location named for the core
      function is the cytosol. Marking it non-core rather than accepting it keeps
      the two location claims consistent without discarding either.
    supported_by:
    - reference_id: PMID:2266943
      supporting_text: Vancomycin induced the synthesis of a ca. 40 kDa membrane-associated
        protein designated VANA.
    - reference_id: file:ENTFC/vanA/vanA-uniprot.txt
      record_section: ["CC:SUBCELLULAR LOCATION"]
      supporting_text: Cell membrane {ECO:0000269|PubMed:2266943}; Peripheral membrane
        protein
