    correctness: VERIFIED
    review_notes: >-
      Family-node annotation from the D-Ala-D-Ala ligase tree. Its cytosol
      assignment agrees with the conclusion of the original VanA paper and with the
      cytosolic substrates of the reaction.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings: []
