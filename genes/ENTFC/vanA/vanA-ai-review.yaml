- term:
    id: GO:0009252
    label: peptidoglycan biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:1503450
  qualifier: involved_in
  review:
    summary: >-
      VanA performs a step of peptidoglycan precursor biosynthesis: it makes the
      dipeptide-position terminus that the D-Ala-D-Ala-adding enzyme attaches to
      UDP-MurNAc-tripeptide. In this paper, feeding D-lactate to a VanH-deficient
      strain restored resistance, showing that D-lactate is the acceptor VanA uses
      in the growing cell, and the earlier work showed the VanA product entering
      the UDP-MurNAc-pentapeptide pool.
    action: ACCEPT
    reason: >-
      The gene product does the work of a step in this process rather than merely
      being required for it: it is the ligase that forms the side-chain terminus,
      substituting for Ddl in the normal pathway. The term is at the right
      granularity, since GO has no precursor-specific child that would fit the
      depsipeptide route. Core biological process.
    supported_by:
    - reference_id: PMID:1503450
      supporting_text: D-Lactate added to the culture medium restored the vancomycin
        resistance of a strain that does not produce the VanH dehydrogenase and therefore
        appears to be a substrate of VanA in vivo.
    - reference_id: PMID:1931965
      supporting_text: The VanA product D-alanyl-D-2-hydroxybutyrate could then be incorporated
        into the UDPMurNAc-pentapeptide peptidoglycan precursor by D-Ala-D-Ala adding
        enzyme from Escherichia coli or by crude extract from E. faecium BM4147.
