core_functions:
- description: >-
    ATP-dependent D-alanine-(R)-lactate ligase. A Ddl-family ATP-grasp enzyme
    whose specificity has shifted from amide to ester bond formation: it
    condenses D-alanine with a D-2-hydroxy acid, physiologically the D-lactate
    made by VanH, to give the depsipeptide D-alanyl-(R)-lactate. The product is
    accepted by the normal D-Ala-D-Ala-adding enzyme, so the cell assembles a
    UDP-MurNAc-pentadepsipeptide ending in D-Ala-D-Lac. Glycopeptides bind that
    terminus far more weakly than D-Ala-D-Ala, which is the molecular basis of
    high-level, inducible vancomycin and teicoplanin resistance.
  molecular_function:
    id: GO:0160220
    label: D-alanine-(R)-lactate ligase activity
  directly_involved_in:
  - id: GO:0009252
    label: peptidoglycan biosynthetic process
  - id: GO:0046677
    label: response to antibiotic
  locations:
  - id: GO:0005829
    label: cytosol
  supported_by:
  - reference_id: PMID:1931965
    supporting_text: VanA was found to catalyze ester bond formation between D-alanine
      and the D-hydroxy acid products of VanH, the best substrate being D-2-hydroxybutyrate
      (Km = 0.60 mM).
  - reference_id: PMID:1503450
    supporting_text: D-Lactate added to the culture medium restored the vancomycin resistance
      of a strain that does not produce the VanH dehydrogenase and therefore appears
      to be a substrate of VanA in vivo.
  - reference_id: file:ENTFC/vanA/vanA-uniprot.txt
    record_section: ["CC:FUNCTION"]
    supporting_text: D-Ala--D-Ala ligase of altered specificity which catalyzes ester
      bond formation between D-Ala and various D-hydroxy acids; produces a peptidoglycan
      which does not terminate in D-alanine but in D-lactate, thus preventing vancomycin
      or teicoplanin binding.
proposed_new_terms: []
knowledge_gaps:
- gap_statement: >-
    What makes VanA prefer an ester to an amide acceptor is not established at the
    level of the enzyme. VanA is a Ddl homolog that still complements a ddl mutant,
    yet its measured specificity is for D-2-hydroxy acids, with
    D-2-hydroxybutyrate the best substrate in vitro and D-lactate the one used in
    vivo. Which residues reposition the acceptor site, and why the best in vitro
    substrate is not the physiological one, are open; so is how the enzyme avoids
    being outcompeted by the large intracellular D-alanine pool.
  boundary: >-
    Firmly established: the reaction and its EC number, K_m values for D-lactate,
    D-alanine and three longer D-2-hydroxy acids, the ATP-grasp domain and its ATP
    and divalent-metal sites, incorporation of the product into
    UDP-MurNAc-pentapeptide, and in vivo use of D-lactate.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    The acceptor-site determinants are what distinguish a resistance ligase from a
    housekeeping one, so they decide whether a ligase found in a new genome
    confers resistance, and they are the target surface for an inhibitor that
    would spare Ddl.
suggested_questions:
- question: >-
    GOA has no antibiotic-response annotation for any gene of the van cluster,
    although the operon is defined by inducible glycopeptide resistance and UniProt
    records the vancomycin induction on each entry. Should GO:0046677 response to
    antibiotic be annotated across vanR, vanS, vanH, vanA, vanX and vanY, and is a
    more specific child for glycopeptide resistance worth creating?
- question: >-
    VanA carries both GO:0160220 D-alanine-(R)-lactate ligase activity and
    GO:0008716 D-alanine-D-alanine ligase activity. The second is real, since vanA
    complements a temperature-sensitive ddl mutant, but it is the ancestral
    activity rather than the resistance one. Is there a convention for marking which
    of two genuine activities of an enzyme of altered specificity is the
    physiological one?
suggested_experiments:
- description: >-
    Measure the acceptor specificity of VanA against Ddl side by side under one set
    of conditions, with D-alanine, D-lactate, D-2-hydroxybutyrate and D-serine as
    acceptors, and compare the catalytic efficiencies. This would quantify how far
    the specificity has shifted and whether the residual dipeptide-ligase activity
    is enough to matter in a cell that has lost ddl.
- description: >-
    Test whether VanA's membrane association is functional. Fractionate induced E.
    faecium under conditions that preserve peripheral interactions, ask whether
    VanA co-fractionates with the MurF or MraY steps, and compare a soluble VanA
    variant for its ability to confer resistance. This would settle whether the
    membrane association reported in PMID:2266943 reflects channelling to the
    precursor pathway or is an artefact of the fractionation.
