- id: PMID:1503450
  title: Evidence for in vivo incorporation of D-lactate into peptidoglycan precursors
    of vancomycin-resistant enterococci.
  findings:
  - statement: >-
      VanA condenses D-alanine with a range of D-2-hydroxy and D-2-amino acids in
      vitro.
    supporting_text: The VanA ligase encoded by the vancomycin resistance plasmid pIP816
      of Enterococcus faecium BM4147 condenses D-alanine with various D-2-hydroxy and
      D-2-amino acids in vitro.
  - statement: >-
      D-lactate is the acceptor VanA uses in the growing cell: feeding it restores
      resistance to a strain lacking the VanH dehydrogenase.
    supporting_text: D-Lactate added to the culture medium restored the vancomycin resistance
      of a strain that does not produce the VanH dehydrogenase and therefore appears
      to be a substrate of VanA in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly cited; the short abstract states both findings used here. The
      D-lactate feeding experiment is what makes the in vivo acceptor claim, and
      hence the GO:0160220 and process annotations, more than an in vitro result.
      Abstract-only in the cache.
- id: PMID:1931965
  title: 'Molecular basis for vancomycin resistance in Enterococcus faecium BM4147:
    biosynthesis of a depsipeptide peptidoglycan precursor by vancomycin resistance
    proteins VanH and VanA.'
  findings:
  - statement: >-
      VanA is a D-Ala-D-Ala ligase of altered substrate specificity that forms an
      ester bond with the D-hydroxy acid products of VanH.
    supporting_text: VanA was found to catalyze ester bond formation between D-alanine
      and the D-hydroxy acid products of VanH, the best substrate being D-2-hydroxybutyrate
      (Km = 0.60 mM).
  - statement: >-
      The VanA product is accepted by the normal D-Ala-D-Ala-adding enzyme and
      enters the UDP-MurNAc-pentapeptide pool.
    supporting_text: The VanA product D-alanyl-D-2-hydroxybutyrate could then be incorporated
      into the UDPMurNAc-pentapeptide peptidoglycan precursor by D-Ala-D-Ala adding enzyme
      from Escherichia coli or by crude extract from E. faecium BM4147.
  - statement: >-
      The altered terminus binds vancomycin more than a thousand-fold more weakly,
      which is the molecular rationale for high-level resistance.
    supporting_text: thus providing a molecular rationale for high-level vancomycin
      resistance
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The key biochemical paper for both VanA and VanH, and the source of UniProt's
      reaction, kinetic parameters and EC number for P25051. Abstract-only in the
      cache, but the abstract reports the specificity, the K_m for the best
      substrate, the incorporation experiment and the binding comparison.
- id: PMID:2266943
  title: The VANA glycopeptide resistance protein is related to D-alanyl-D-alanine
    ligase cell wall biosynthesis enzymes.
  findings:
  - statement: >-
      VanA was identified as a vancomycin-induced, membrane-associated 40 kDa
      protein with no signal peptide.
    supporting_text: Vancomycin induced the synthesis of a ca. 40 kDa membrane-associated
      protein designated VANA.
  - statement: >-
      VanA is a sequence homolog of the D-Ala-D-Ala ligases of Salmonella and E.
      coli.
    supporting_text: VANA was structurally related to the D-alanyl-D-alanine (D-ala-D-ala)
      ligases of Salmonella typhimurium (36% amino acid identity) and of E. coli (28%).
  - statement: >-
      vanA complements a temperature-sensitive E. coli ddl mutant, so the residual
      D-Ala-D-Ala ligase activity is physiologically competent.
    supporting_text: The vanA gene was able to transcomplement an E. coli mutant with
      thermosensitive D-ala-D-ala ligase activity.
  - statement: >-
      Despite the membrane fractionation, the authors place VanA functionally with
      the cytoplasmic precursor-synthesising enzymes.
    supporting_text: Thus, the inducible resistance protein VANA was structurally and
      functionally related to cytoplasmic enzymes that synthesize the target of glycopeptide
      antibiotics.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The discovery paper, and the source of both the plasma-membrane location and
      the transcomplementation evidence used here. It is also the paper whose own
      conclusion reconciles the two location claims, which is why neither location
      row is removed. Abstract-only in the cache.
- id: PMID:1556077
  title: The VanS-VanR two-component regulatory system controls synthesis of depsipeptide
    peptidoglycan precursors in Enterococcus faecium BM4147.
  findings:
  - statement: >-
      vanH, vanA and vanX are all necessary for resistance and are cotranscribed
      under VanS-VanR control.
    supporting_text: The distal part of the van cluster encodes VanH, VanA, and a third
      enzyme, VanX, all of which are necessary for resistance.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Not cited by GOA for this gene; added here as the evidence that vanA is part
      of an inducible, regulated resistance response, which is what supports the
      proposed GO:0046677 annotation. Abstract-only in the cache.
- id: PMID:8852545
  title: Mechanisms of glycopeptide resistance in enterococci.
  findings:
  - statement: >-
      VanH reduces pyruvate to D-lactate and VanA makes the depsipeptide
      D-Ala-D-Lac; the depsipeptide replaces the dipeptide and the resulting
      precursors bind glycopeptides weakly.
    supporting_text: Tn1546 encodes the VanH dehydrogenase which reduces pyruvate to
      D-lactate (D-Lac) and the VanA ligase which catalyses synthesis of the depsipeptide
      D-alanyl-D-lactate (D-Ala-D-Lac).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      A review rather than primary work, cited here only for the summary of the
      pathway and the resistance mechanism; every claim taken from it is also
      supported by the primary papers in this list.
