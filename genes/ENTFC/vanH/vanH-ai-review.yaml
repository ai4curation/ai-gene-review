id: Q05709
gene_symbol: vanH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1352
  label: Enterococcus faecium
description: >-
  VanH is the NAD(P)H-dependent dehydrogenase that supplies the D-hydroxy acid
  used to build glycopeptide-resistant peptidoglycan precursors in enterococci.
  It is encoded in the Tn1546-type van cluster and cotranscribed with vanA and
  vanX from a promoter switched on by the VanS-VanR two-component system when the
  antibiotic is present. The protein is a member of the D-isomer-specific
  2-hydroxyacid dehydrogenase family, with a Rossmann dinucleotide-binding fold
  and a catalytic His-Arg-Glu triad, and it is a D-specific 2-keto acid
  reductase: it reduces 2-oxocarboxylates to the corresponding (2R)-2-hydroxy
  acids, with the highest catalytic efficiency on pyruvate and on 2-oxobutanoate,
  giving D-lactate and (2R)-hydroxybutanoate. Either dinucleotide serves as
  electron donor, with a slight preference for NADPH over NADH, and full activity
  requires a reducing environment and an activating anion such as phosphate or
  acetate. The physiological product is D-lactate, which the normal cytoplasm
  does not supply at useful concentration: it is the acyl acceptor that the
  partner ligase VanA esterifies to D-alanine, giving the depsipeptide
  D-Ala-D-Lac that replaces D-Ala-D-Ala at the end of the pentapeptide side
  chain. Because glycopeptides bind the depsipeptide terminus far more weakly,
  VanH is one of the three enzymes required for high-level, inducible vancomycin
  and teicoplanin resistance, and feeding D-lactate to a vanH-deficient strain
  restores that resistance.
