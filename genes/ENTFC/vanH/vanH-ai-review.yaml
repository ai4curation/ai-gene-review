core_functions:
- description: >-
    D-specific 2-keto acid reductase. Using NADPH or NADH, VanH reduces a
    2-oxocarboxylate to the corresponding (2R)-2-hydroxy acid, most efficiently
    pyruvate to D-lactate and 2-oxobutanoate to (2R)-hydroxybutanoate. Full
    activity needs a reducing environment and an activating anion. The
    physiological product is D-lactate, which the cell does not otherwise make in
    useful amounts, and which the partner ligase VanA esterifies to D-alanine to
    give the depsipeptide terminus that glycopeptide antibiotics bind poorly.
    Supplying D-lactate exogenously substitutes for the enzyme, which is what
    identifies this as its role in resistance.
