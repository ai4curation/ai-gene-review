- id: PMID:1931965
  title: 'Molecular basis for vancomycin resistance in Enterococcus faecium BM4147:
    biosynthesis of a depsipeptide peptidoglycan precursor by vancomycin resistance
    proteins VanH and VanA.'
  findings:
  - statement: >-
      VanH was purified to homogeneity and characterized as a D-specific alpha-keto
      acid dehydrogenase, not merely a lactate-specific enzyme.
    supporting_text: We report purification of VanH to homogeneity, characterization
      as a D-specific alpha-keto acid dehydrogenase, and comparison with D-lactate dehydrogenases
      from Leuconostoc mesenteroides and Lactobacillus leichmanii.
  - statement: >-
      The D-hydroxy acids VanH makes are the acceptors VanA esterifies to
      D-alanine, with D-2-hydroxybutyrate the best in vitro.
    supporting_text: VanA was found to catalyze ester bond formation between D-alanine
      and the D-hydroxy acid products of VanH, the best substrate being D-2-hydroxybutyrate
      (Km = 0.60 mM).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary biochemical paper for VanH and the source of UniProt's reactions,
      EC numbers and kinetic parameters for Q05709. Abstract-only in the cache, but
      the abstract states the purification, the characterization as a D-specific
      alpha-keto acid dehydrogenase and the coupling to VanA.
- id: PMID:9605319
  title: 'A thioredoxin fusion protein of VanH, a D-lactate dehydrogenase from Enterococcus
    faecium: cloning, expression, purification, kinetic analysis, and crystallization.'
  findings:
  - statement: >-
      A thioredoxin-VanH fusion has Michaelis constants for NADPH, NADH and
      pyruvate comparable to the native enzyme, so its kinetics report on VanH.
    supporting_text: Michaelis constants for NADPH, NADH, and pyruvate, of approximately
      3.5 microM, 19.0 microM, and 1.5 mM, respectively, were comparable to those reported
      for the native VanH
  - statement: >-
      Maximum activity requires an activating anion and, for the fusion, a strongly
      reducing environment.
    supporting_text: Like native VanH, maximum activity of the fusion protein requires
      the presence of an anion (phosphate or acetate), however, in addition, a strongly
      reducing environment is needed for optimal efficacy.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly cited and genuinely about VanH, which it titles a D-lactate
      dehydrogenase from Enterococcus faecium. Its kinetic constants are the second
      independent measurement of the activity and are cited by UniProt with
      experimental evidence. Abstract-only in the cache; no VanH structure has been
      published despite the crystals it reports.
- id: PMID:1503450
  title: Evidence for in vivo incorporation of D-lactate into peptidoglycan precursors
    of vancomycin-resistant enterococci.
  findings:
  - statement: >-
      A strain lacking VanH is resistance-deficient unless D-lactate is supplied,
      which identifies D-lactate as the product of VanH that matters in vivo.
    supporting_text: D-Lactate added to the culture medium restored the vancomycin resistance
      of a strain that does not produce the VanH dehydrogenase and therefore appears
      to be a substrate of VanA in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Not cited by GOA for this gene, but it is the experiment that establishes
      VanH's physiological product and its role in resistance, and so the main
      support for the proposed GO:0046677 annotation. Abstract-only in the cache.
- id: PMID:1556077
  title: The VanS-VanR two-component regulatory system controls synthesis of depsipeptide
    peptidoglycan precursors in Enterococcus faecium BM4147.
  findings:
  - statement: >-
      vanH, vanA and vanX are all necessary for resistance and are cotranscribed
      under VanS-VanR control.
    supporting_text: The distal part of the van cluster encodes VanH, VanA, and a third
      enzyme, VanX, all of which are necessary for resistance.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Added here as the evidence that vanH belongs to an inducible, regulated
      resistance response, which is what the proposed GO:0046677 annotation
      asserts. Abstract-only in the cache.
- id: PMID:8852545
  title: Mechanisms of glycopeptide resistance in enterococci.
  findings:
  - statement: >-
      VanH reduces pyruvate to D-lactate and VanA makes the depsipeptide, which
      replaces the dipeptide and lowers glycopeptide affinity.
    supporting_text: Tn1546 encodes the VanH dehydrogenase which reduces pyruvate to
      D-lactate (D-Lac) and the VanA ligase which catalyses synthesis of the depsipeptide
      D-alanyl-D-lactate (D-Ala-D-Lac).
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      A review, cited only for the pathway summary and in particular for the
      direction in which VanH runs physiologically; the underlying claims are also
      supported by the primary papers in this list.
