knowledge_gaps:
- gap_statement: >-
    Why VanH requires an activating anion and a strongly reducing environment for
    full activity is not understood, and neither is what sets its position on the
    NADPH/NADH boundary. Both papers report the anion effect, in the native enzyme
    and in the fusion, without identifying a site or a mechanism, and no structure
    of VanH has been reported despite crystals that diffracted to 3 angstroms in
    1998. Whether the anion occupies the substrate carboxylate site, stabilises an
    oligomeric state, or acts on the catalytic triad is open.
  boundary: >-
    Firmly established: the reactions and their three EC numbers, K_m values for
    pyruvate, NADH and NADPH, competitive inhibition by NAD+, ADP-ribose and
    oxamate, the requirement for anion and reducing conditions, and the position of
    the catalytic residues by homology to the D-isomer-specific
    2-hydroxyacid dehydrogenase family.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    The anion and redox dependence may be how the enzyme is tuned to run as a
    reductase in the cytoplasm rather than oxidising the D-lactate it has just
    made, and a structure would show whether the resistance enzyme differs from
    housekeeping D-lactate dehydrogenases in a way that could be targeted.
suggested_questions:
- question: >-
    GOA derives GO:0047809 D-lactate dehydrogenase activity for this gene from
    RHEA:62968, the NADP+-dependent lactate reaction, because GO has no
    NADP-specific child of that term while it does have GO:0008720 for the NAD+
    reaction. Should a D-lactate dehydrogenase (NADP+) activity term be created,
    so that the cofactor-agnostic parent is not used to carry a cofactor-specific
    claim?
- question: >-
    No gene of the van cluster carries an antibiotic-response annotation in GOA,
    although the operon is defined by inducible glycopeptide resistance and
    UniProt records the vancomycin induction. Should GO:0046677 be annotated
    across vanR, vanS, vanH, vanA, vanX and vanY, and would a glycopeptide-specific
    child be useful?
suggested_experiments:
- description: >-
    Determine a structure of VanH with NAD(P)H and pyruvate bound, following up the
    tetragonal crystals that diffracted to 3 angstroms in PMID:9605319, and look
    for an anion site. Comparing it with a housekeeping D-lactate dehydrogenase
    would show whether the resistance enzyme has a distinguishable active site.
- description: >-
    Test in vivo which product matters. Replace vanH with variants shifted toward
    2-oxobutanoate or toward pyruvate, measure the D-lactate and
    (2R)-hydroxybutanoate pools and the vancomycin and teicoplanin minimum
    inhibitory concentrations, and ask whether the depsipeptide made from the
    longer hydroxy acid supports resistance as well as D-Ala-D-Lac does.
