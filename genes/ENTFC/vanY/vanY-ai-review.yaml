- term:
    id: GO:0006508
    label: proteolysis
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR003709
  review:
    summary: >-
      InterPro2GO mapping from the VanY/peptidase M15 domain signature. VanY is a
      peptidase, but its substrates are peptidoglycan precursors, not proteins: it
      removes the C-terminal D-alanine from UDP-MurNAc-pentapeptide and the
      C-terminal D-hydroxy acid from the corresponding depsipeptide. GO:0006508 is
      defined as the hydrolysis of proteins into smaller polypeptides and/or amino
      acids.
    action: MODIFY
    reason: >-
      The gene does the work of the step and the aspect is right, so the row is
      kept rather than removed, but the term names the wrong class of substrate.
      GO:0000270 peptidoglycan metabolic process covers the pathways that act on
      peptidoglycan, which is what a precursor-trimming carboxypeptidase does, and
      UniProt's own keywords for this entry are peptidoglycan synthesis and cell
      wall biogenesis/degradation. GO:0006508 is not an ancestor of GO:0000270
      (checked against the local GO build, 2026-11-04), so this is a lateral
      substitution within the correct area, which is a sanctioned use of MODIFY.
      The neutral metabolic parent is chosen deliberately rather than the narrower
      GO:0009253 peptidoglycan catabolic process, which is a descendant of it:
      which pool VanY actually trims is unsettled (see knowledge_gaps). The
      assayed substrates are the soluble nucleotide precursor
      UDP-MurNAc-pentapeptide and a model peptide, so the trimming may well be a
      step of precursor maturation within peptidoglycan biosynthesis rather than
      breakdown of polymerised murein, and a catabolic term would assert a
      direction the evidence does not fix. This is the asymmetry with the same
      signature-derived proteolysis row on vanX, which is replaced by GO:0043171
      peptide catabolic process: there the substrate is a free D-Ala-D-Ala
      dipeptide that is destroyed outright, so the catabolic direction is
      established.
    proposed_replacement_terms:
    - id: GO:0000270
      label: peptidoglycan metabolic process
    supported_by:
    - reference_id: PMID:1510448
      supporting_text: These results demonstrate that VanY should contribute in vivo
        to the hydrolysis of both the D-alanyl-D-alanine- and the depsipeptide-containing
        peptidoglycan precursors.
    - reference_id: file:ENTFC/vanY/vanY-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Cleaves the C-terminal D-alanine residue of UDP-muramyl-pentapeptide
        (UDP-MurNAc-L-Ala-D-Glu-mDAP-D-Ala-D-Ala) or diacetyl-L-Lys-D-Ala-D-Ala
