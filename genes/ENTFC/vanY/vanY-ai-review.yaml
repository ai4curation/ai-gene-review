- id: PMID:1510448
  title: Characterization of vanY, a DD-carboxypeptidase from vancomycin-resistant
    Enterococcus faecium BM4147.
  findings:
  - statement: >-
      VanY is membrane-associated and cleaves the C-terminal D-alanine of
      UDP-muramyl-pentapeptide, with no transpeptidase or beta-lactamase activity.
    supporting_text: VanY was associated with the cell membranes and cleaved the C-terminal
      D-alanine residue of UDP-muramyl-pentapeptide but did not display transpeptidase
      or beta-lactamase activities.
  - statement: >-
      It also removes the C-terminal D-hydroxy acid from the depsipeptide made by
      VanA, so it is not selective for the dipeptide terminus.
    supporting_text: VanY released the C-terminal D-hydroxy acid from depsipeptides produced
      by the vancomycin resistance protein VanA.
  - statement: >-
      The activity is not inhibited by beta-lactams, which distinguishes it from
      the penicillin-binding serine D,D-carboxypeptidases.
    supporting_text: The DD-carboxypeptidase activity was not inhibited by beta-lactam
      antibiotics.
  - statement: >-
      The authors conclude that VanY contributes in vivo to hydrolysis of both
      dipeptide- and depsipeptide-containing precursors.
    supporting_text: These results demonstrate that VanY should contribute in vivo to
      the hydrolysis of both the D-alanyl-D-alanine- and the depsipeptide-containing
      peptidoglycan precursors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary and essentially only characterization of VanY, and the source of
      UniProt's function, location and inhibitor statements for P37711.
      Abstract-only in the cache, but the abstract carries the reaction, the
      negative controls, the inhibitor result and the location.
- id: PMID:8852545
  title: Mechanisms of glycopeptide resistance in enterococci.
  findings:
  - statement: >-
      VanX and VanY act in series to eliminate D-Ala-D-Ala-containing precursors.
    supporting_text: These two proteins act in series to eliminate D-Ala-D-Ala-containing
      precursors.
  - statement: >-
      VanY is dispensable: it only slightly increases the resistance level
      conferred by VanH, VanA and VanX, unlike VanX which is required.
    supporting_text: VanX is required for resistance whereas VanY only slightly increases
      the level of resistance mediated by VanH, VanA and VanX.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      A review, but the clearest statement of VanY's place in the pathway and of
      its dispensability, which is the point that limits how strongly any process
      annotation on this gene can be phrased. The dispensability is independently
      stated on the UniProt entry from two primary papers.
