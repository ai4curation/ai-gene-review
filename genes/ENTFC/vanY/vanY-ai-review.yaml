id: P37711
gene_symbol: vanY
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1352
  label: Enterococcus faecium
description: >-
  VanY is a membrane-anchored, zinc-dependent D,D-carboxypeptidase encoded in the
  Tn1546-type van gene cluster of glycopeptide-resistant enterococci and induced
  by vancomycin along with the rest of the cluster. A single N-terminal
  transmembrane helix tethers it to the cytoplasmic membrane; the catalytic
  region belongs to the peptidase M15B family and carries a zinc site formed by
  two histidines and an aspartate, with an aspartate as the catalytic proton
  donor. The enzyme removes the C-terminal residue from assembled peptidoglycan
  precursors: it cleaves the terminal D-alanine from UDP-MurNAc-pentapeptide, and
  it also releases the C-terminal D-hydroxy acid from the depsipeptide precursor
  that the resistance ligase VanA generates. It has no transpeptidase or
  beta-lactamase activity, and, unlike the penicillin-binding serine
  D,D-carboxypeptidases, it is not inhibited by beta-lactam antibiotics, which is
  what marks it as a metalloenzyme. Functionally VanY is the second and weaker
  half of a clearance pair: VanX destroys the free D-Ala-D-Ala dipeptide before it
  can be incorporated, while VanY trims precursors that were assembled with
  D-Ala-D-Ala before VanX could act. Because it is not selective for the
  dipeptide, and because the depsipeptide precursor is a substrate too, it is
  dispensable: a vanY-deficient strain remains vancomycin-resistant, and the gene
  only slightly raises the resistance level conferred by VanH, VanA and VanX.
