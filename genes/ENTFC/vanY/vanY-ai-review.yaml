knowledge_gaps:
- gap_statement: >-
    What VanY's real substrate is in a growing enterococcus is not settled. The
    assays were done on UDP-MurNAc-pentapeptide and on a diacetyl-L-Lys-D-Ala-D-Ala
    model peptide with an mDAP-containing precursor, whereas UniProt notes that the
    physiological precursor of this organism probably carries L-lysine at the third
    position; and because the enzyme is membrane-anchored it could equally act on
    lipid-linked or already-polymerised peptidoglycan rather than on the soluble
    nucleotide precursor. Which pool it actually trims, and on which side of the
    membrane its catalytic domain sits, are open.
  boundary: >-
    Firmly established: the reaction on UDP-MurNAc-pentapeptide and on the VanA
    depsipeptide, the absence of transpeptidase and beta-lactamase activity, the
    insensitivity to beta-lactams, the membrane association, the single
    transmembrane helix and the M15B zinc site, and the dispensability of the gene
    for resistance.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    If VanY acts on polymerised peptidoglycan rather than on the nucleotide
    precursor, it is a cell-wall-remodelling enzyme that happens to help
    resistance, not a precursor-editing one, and that changes what its small
    contribution to the resistance level is actually doing.
suggested_questions:
- question: >-
    The InterPro M15 signature produces GO:0006508 proteolysis for both vanY and
    vanX, but neither enzyme hydrolyses a protein: VanY trims a UDP-MurNAc-peptide
    precursor and VanX cleaves a free dipeptide. Should the InterPro2GO mapping for
    these families point to peptidoglycan or peptide terms rather than to
    proteolysis?
- question: >-
    No gene of the van cluster carries an antibiotic-response annotation in GOA,
    although the whole cluster is vancomycin-inducible. For vanY the claim is
    weaker than for the others, since UniProt states it is not necessary for
    resistance. Is GO:0046677 the right way to record a dispensable accessory
    contribution, or would an annotation extension or a regulatory term be
    preferable?
suggested_experiments:
- description: >-
    Determine which substrate pool VanY trims in vivo. Compare the muropeptide
    composition of wild-type and vanY-deleted E. faecium by HPLC after vancomycin
    induction, looking separately at the soluble UDP-MurNAc-peptide pool and at
    the polymerised sacculus, to see whether the terminal residue disappears from
    one, the other, or both.
- description: >-
    Establish the topology. Use cysteine-accessibility or reporter-fusion mapping
    on the single N-terminal helix to place the catalytic domain inside or outside
    the membrane, which decides whether the soluble nucleotide precursor can be a
    physiological substrate at all.
- description: >-
    Test the zinc assignment directly. Measure the metal content of purified VanY
    and the effect of chelators and of zinc, together with substitutions of the
    three predicted zinc ligands, on the carboxypeptidase activity. The present
    assignment rests on homology plus the negative beta-lactam result.
