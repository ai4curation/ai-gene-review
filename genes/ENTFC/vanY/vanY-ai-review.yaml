- term:
    id: GO:0046677
    label: response to antibiotic
  evidence_type: IMP
  original_reference_id: PMID:1510448
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation. VanY is part of the vancomycin-inducible resistance
      cluster and performs a step of the response: it hydrolyses the
      D-Ala-D-Ala-terminated precursors that escaped VanX, so that fewer
      drug-binding termini reach the wall. Unlike the other van genes it is
      dispensable, raising the resistance level rather than being required for it.
      GOA currently connects no gene of the cluster to antibiotic resistance.
    action: NEW
    reason: >-
      VanY does the work of a step in the response rather than merely accompanying
      it: the trimming reaction is assayed directly on both the dipeptide- and the
      depsipeptide-terminated precursors, and its in vivo effect is a measurable
      increase in the resistance level. GO:0046677 is the most specific available
      term, since GO has no glycopeptide-resistance child, and functionally
      equivalent resistance enzymes in this repository already carry it. The claim
      is deliberately pitched at
      participation in the response and not at being required for resistance,
      which UniProt explicitly denies for this gene.
    supported_by:
    - reference_id: PMID:1510448
      supporting_text: These results demonstrate that VanY should contribute in vivo
        to the hydrolysis of both the D-alanyl-D-alanine- and the depsipeptide-containing
        peptidoglycan precursors.
    - reference_id: PMID:8852545
      supporting_text: VanX is required for resistance whereas VanY only slightly increases
        the level of resistance mediated by VanH, VanA and VanX.
    - reference_id: file:ENTFC/vanY/vanY-uniprot.txt
      record_section: ["CC:FUNCTION"]
      supporting_text: Is not necessary for vancomycin resistance of E.faecium BM4147
        and perhaps not W14-9
core_functions:
- description: >-
    Membrane-anchored zinc D,D-carboxypeptidase that trims assembled peptidoglycan
    precursors. VanY removes the C-terminal D-alanine from UDP-MurNAc-pentapeptide
    and the C-terminal D-hydroxy acid from the depsipeptide precursor made by
    VanA, without transpeptidase or beta-lactamase activity and without being
    inhibited by beta-lactams. In the resistance cluster it works downstream of
    VanX: VanX removes the free D-Ala-D-Ala dipeptide before incorporation, VanY
    removes the terminus from precursors that carry it already. Because it cleaves
    the depsipeptide too, it is a blunt instrument, which is why it only raises the
    level of resistance rather than being required for it.
