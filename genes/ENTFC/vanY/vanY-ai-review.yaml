  review:
    summary: >-
      VanY expressed from a plasmid in E. coli was found in the cell membrane
      fraction, and the enzymatic assays on peptidoglycan precursors were done
      with that material. UniProt records cell membrane as the location with
      experimental evidence from this paper, and adds a single-pass transmembrane
      helix at residues 7-23.
    action: ACCEPT
    reason: >-
      Directly observed, and this is where the enzyme works: the precursors it
      trims are handled at the membrane, and the protein has an N-terminal
      membrane anchor rather than being a soluble enzyme caught in a fraction.
      Enterococcus faecium has only one cellular membrane, so the plasma-membrane
      term is the specific one rather than a choice between candidates. It is
      also the location named for the core function here.
