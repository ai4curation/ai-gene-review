core_functions:
- description: >-
    Bifunctional sensor of the VanS-VanR two-component system, anchored in the
    plasma membrane by two transmembrane helices. Its kinase arm autophosphorylates
    His164 using ATP and transfers the phosphoryl group to an aspartate of VanR,
    with a ten-thousand-fold kinetic preference for VanR over a heterologous
    response regulator and no detectable transfer to three others; phospho-VanR
    then activates the resistance promoter. Its phosphatase arm dephosphorylates
    phospho-VanR, which holds the operon off in the absence of the inducing signal,
    so the resting state is actively enforced rather than merely unstimulated. A
    mutation expected to lock the switch on reduces the phosphatase activity, as
    the model predicts. What signal flips the switch is unresolved and no activator
    is asserted here.
  molecular_function:
    id: GO:0000155
    label: phosphorelay sensor kinase activity
  directly_involved_in:
