- term:
    id: GO:0016036
    label: cellular response to phosphate starvation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN008690706
  review:
    summary: >-
      TreeGrafter annotation from the same family node that supplied the correct
      sensor-kinase, phosphatase and membrane rows. UniProt places VanS in
      PANTHER:PTHR45453, whose official family name is PHOSPHATE REGULON SENSOR
      PROTEIN PHOR, so the node carries the phosphate-starvation process of its
      dominant members. VanS controls a glycopeptide-resistance operon and has
      nothing to do with phosphate limitation.
    action: REMOVE
    reason: >-
      An over-propagated electronic inference that can be argued against on
      biological grounds, which is what REMOVE is for. The process term belongs to
      the PhoR-type members of the family, not to this protein: the VanS signal,
      whatever it turns out to be, concerns cell-wall precursors and glycopeptides,
      the operon it induces is vanH-vanA-vanX, and the specificity data cut
      directly against a shared role, since phosphotransfer from phospho-VanS to
      the phosphate-regulon regulator PhoB is ten thousand times less efficient
      than to VanR and no transfer at all is detectable to three other regulators.
      Nothing in the literature on this gene connects it to phosphate starvation.
    supported_by:
    - reference_id: PMID:8664263
      supporting_text: A KM of 3 microM was estimated for VanR, leading to a 10(4)-fold
        preference in kxfer/KM for phosphotransfer to VanR compared to PhoB.
