knowledge_gaps:
- gap_statement: >-
    What VanS senses is unknown, and the two direct tests disagree. One study
    reports that vancomycin and teicoplanin bind full-length VanS, shifting its
    tryptophan and tyrosine spectra, and raise its activity, while peptidoglycan
    components lower it; another finds the autophosphorylation, phosphotransfer and
    phosphatase activities of full-length VanS completely insensitive to vancomycin
    at many times the minimum inhibitory concentration, and argues that either
    additional components are needed for a functional signalling complex or that
    activation requires no contact with the drug at all. A third possibility, raised
    by the first study itself, is that the drug acts by suppressing the phosphatase
    arm rather than by stimulating the kinase arm, which neither activity assay
    directly resolves.
  boundary: >-
    Firmly established: the three catalytic activities and their rates, the
    histidine autophosphorylation site, the ten-thousand-fold selectivity of
    phosphotransfer for VanR, the reduction in phosphatase activity in a
    constitutively-active-type mutant, the membrane topology, and the in vivo
    requirement of VanS-VanR for induction of vanH, vanA and vanX.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    The identity of the signal decides whether glycopeptide resistance can be
    blocked at the sensor, and it is also what determines whether vancomycin should
    appear as a small-molecule activator in pathway models of this operon; three
    GO-CAM-adjacent representations currently differ on exactly that point.
suggested_questions:
- question: >-
    GO-CAM model gomodel:671ae02600002832 attaches vancomycin (CHEBI:28001) to the
    VanS activity as a small-molecule activator with direct-assay evidence from
    PMID:8494882, a paper that assayed only the VanS cytosolic domain and never
    tested vancomycin, and the question is contested in any case (PMID:28511809
    versus PMID:30677074). Should that activator edge be withdrawn or re-evidenced?
    The defect is recorded as a source_defects entry on the GO:0000155 row of this
    review.
- question: >-
    VanS dephosphorylates the aspartyl phosphate of a response regulator, for which
    GO offers only GO:0004721 phosphoprotein phosphatase activity. Would a
    phosphorelay response-regulator phosphatase activity term be worth creating?
    The two-component systems in which the sensor enforces the off state through a
    phosphatase arm are numerous, and the generic term loses the fact that the
    substrate is an aspartyl rather than a seryl or tyrosyl phosphate.
- question: >-
    TreeGrafter assigns GO:0016036 cellular response to phosphate starvation to
    VanS from PANTHER:PTN008690706, a node in PTHR45453 PHOSPHATE REGULON SENSOR
    PROTEIN PHOR. Should signal-specific process terms be withheld from this node,
    given that the family mixes sensors of entirely different signals and that the
    generic sensor-kinase terms it also supplies are correct?
suggested_experiments:
- description: >-
    Settle the activation question in a membrane rather than in detergent. Insert
    purified full-length VanS into nanodiscs or proteoliposomes of defined lipid
    composition with VanR in the lumen, and measure phospho-VanR levels with and
    without vancomycin and teicoplanin. Comparing the same preparation with and
    without lipid II or a peptidoglycan fragment would test the indirect-sensing
    model alongside the direct one.
- description: >-
    Separate the two arms in vivo. Build VanS variants that selectively impair the
    kinase or the phosphatase activity, starting from the T168K mutant that reduces
    the phosphatase arm, and measure resistance-gene induction and vancomycin
    minimum inhibitory concentration in each. If induction works by suppressing the
    phosphatase, a phosphatase-dead strain should be constitutively resistant and
    drug-insensitive.
