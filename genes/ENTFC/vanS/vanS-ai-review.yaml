id: Q06240
gene_symbol: vanS
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:1352
  label: Enterococcus faecium
description: >-
  VanS is the membrane sensor kinase of the two-component system that switches on
  glycopeptide resistance in enterococci. Two transmembrane helices flank a short
  extracytoplasmic region, and the cytoplasmic part carries a canonical histidine
  kinase domain with the autophosphorylation site at His164 and an ATP-binding
  region that prefers ATP to GTP. Three catalytic activities have been measured on
  the protein: ATP-dependent autophosphorylation on the histidine, transfer of
  that phosphoryl group to an aspartate of the response regulator VanR, and
  dephosphorylation of phospho-VanR. The phosphotransfer is strikingly selective
  for its cognate partner, with a ten-thousand-fold kinetic preference for VanR
  over the heterologous regulator PhoB and no detectable transfer to OmpR, ArcB or
  CreB. The two opposite arms make VanS a switch rather than a simple kinase: in
  the absence of the inducing signal the phosphatase arm keeps VanR
  dephosphorylated and the resistance operon silent, and a mutation expected to
  lock the protein on reduces the phosphatase activity as predicted. When the
  switch flips, phospho-VanR binds the resistance promoter and vanH, vanA and vanX
  are transcribed, so that the cell rebuilds its peptidoglycan precursors to end
  in D-Ala-D-Lac. What VanS actually senses remains unsettled: one study reports
  that vancomycin and teicoplanin bind the protein and raise its activity, while
  another finds the activities of full-length VanS completely insensitive to
  vancomycin and argues that activation needs additional factors or no direct drug
  contact at all.
