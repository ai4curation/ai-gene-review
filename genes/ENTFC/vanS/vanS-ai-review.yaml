  - reference_id: PMID:8664263
    supporting_text: A KM of 3 microM was estimated for VanR, leading to a 10(4)-fold
      preference in kxfer/KM for phosphotransfer to VanR compared to PhoB.
  - reference_id: PMID:30677074
    supporting_text: 'Hence, three distinct catalytic activities are associated with
      VanSA: autophosphorylation, phosphotransfer, and dephosphorylation.'
- description: >-
    Negative arm of the same switch: a phosphatase that removes the aspartyl
    phosphate from VanR. Because VanS both installs and removes the mark, the
    resistance operon is held off actively in the absence of the signal, and
    induction is a shift in the balance between the two arms rather than the
    switching on of a single activity. GO has no term for a response-regulator
    aspartyl-phosphate phosphatase, so the generic phosphoprotein phosphatase term
    is used.
