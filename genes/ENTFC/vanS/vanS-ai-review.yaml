- id: PMID:8494882
  title: 'Purification and characterization of VanR and the cytosolic domain of VanS:
    a two-component regulatory system required for vancomycin resistance in Enterococcus
    faecium BM4147.'
  findings:
  - statement: >-
      A VanS cytosolic-domain fusion autophosphorylates on a histidine in an
      ATP-dependent reaction.
    supporting_text: The MBP-VanS fusion protein displayed an ATP-dependent autophosphorylation
      on a histidine residue with a rate of 0.17 min-1 and a phosphorylation stoichiometry
      of 10-15%.
  - statement: The phosphoryl group is transferred from phospho-VanS to VanR.
    supporting_text: 32P-PhosphoMBP-VanS transferred the phosphoryl group to VanR.
  - statement: >-
      The authors read the system as a His kinase and Asp phosphoryl receptor
      tailored to sensing extracellular vancomycin, though they did not test
      vancomycin.
    supporting_text: Thus, the vancomycin resistance operon appears to have collected
      and specifically tailored the His kinase and Asp phosphoryl receptor of two-component
      signal transduction logic for sensing extracellular vancomycin and turning on structural
      genes, vanA and vanH, to make altered peptidoglycan structures such that vancomycin
      does not bind.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The foundational biochemistry for both VanS and VanR, correctly cited.
      Abstract-only in the cache. One caution worth carrying forward: the work used
      only the cytosolic domain (residues 95-374) and did not test vancomycin, so
      it cannot support an activator claim, although gomodel:671ae02600002832 uses
      it for exactly that.
- id: PMID:8664263
  title: Kinetic comparison of the specificity of the vancomycin resistance VanSfor
    two response regulators, VanR and PhoB.
  findings:
  - statement: >-
      Phosphotransfer from phospho-VanS to VanR is fast and highly selective, with
      a ten-thousand-fold preference over PhoB in kxfer/KM.
    supporting_text: A KM of 3 microM was estimated for VanR, leading to a 10(4)-fold
      preference in kxfer/KM for phosphotransfer to VanR compared to PhoB.
  - statement: >-
      No phosphotransfer is detectable to OmpR, ArcB or CreB, so the relay is
      dedicated rather than promiscuous.
    supporting_text: No phosphotransfer was detachable to three other E. coli response
      regulators, OmpR, ArcB, or CreB, providing some sense of the selectivity against
      two-component regulatory system cross-talk.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Correctly cited. Its specificity measurements are the strongest argument for
      the sensor-kinase typing and, incidentally, against the phosphate-starvation
      process term propagated from the PhoR family, since PhoB is the phosphate
      regulon's own regulator and is a poor substrate here. Abstract-only in the
      cache.
- id: PMID:30677074
  title: Vancomycin does not affect the enzymatic activities of purified VanSA.
  findings:
  - statement: >-
      Full-length VanS has all three expected activities: autophosphorylation,
      phosphotransfer and dephosphorylation.
    supporting_text: 'Hence, three distinct catalytic activities are associated with
      VanSA: autophosphorylation, phosphotransfer, and dephosphorylation.'
  - statement: >-
      The phosphatase arm maintains VanR in the inactive state in the absence of
      vancomycin.
    supporting_text: In the absence of vancomycin, VanS dephosphorylates VanR, thereby
      maintaining it in a transcriptionally inactive state.
  - statement: >-
      None of the activities responds to vancomycin, even far above the minimum
      inhibitory concentration, which argues against activation by a binary
      drug-kinase complex.
    supporting_text: This result argues against direct activation of VanSA via formation
      of a binary antibiotic-kinase complex, suggesting instead that either additional
      factors are required to form a functional signaling complex, or that activation
      does not require direct interaction with the antibiotic.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Full text available and read; methodologically the stronger of the two
      activation studies, since it uses full-length protein in two solubilisation
      systems, includes a constitutively-active-type control mutant and measures all
      three activities. Marked DISPUTED because its central negative conclusion is
      contradicted by PMID:28511809, not because the paper is doubted: its
      characterisation of the three activities is used here as primary support. No
      annotation in this review depends on which side is right.
- id: PMID:28511809
  title: Characterisation of the selective binding of antibiotics vancomycin and teicoplanin
    by the VanS receptor regulating type A vancomycin resistance in the enterococci.
  findings:
  - statement: >-
      Glycopeptides raise and peptidoglycan components lower the activity of
      purified VanS, which the authors read as identifying the drugs themselves as
      the activating ligands.
    supporting_text: Results showed significant increases in the activity of VanSA
      in the presence of GPAs and decreases in activity in the presence of peptidoglycan
      components (Fig. 6).
  - statement: >-
      The proposed mechanism is suppression of the phosphatase arm rather than
      stimulation of the kinase arm, a distinction the activity assays do not
      resolve.
    supporting_text: It is hypothesised that in type A resistance systems, vancomycin
      binding by VanSA initiates a suppression of phosphatase activity resulting in a
      net increase in VanRA phosphorylation
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: >-
      Not cited by any GOA row; fetched because UniProt reports its conclusion
      alongside the opposite one. Full text available and read. Marked DISPUTED
      because PMID:30677074 finds no vancomycin effect on full-length VanS; the
      spectroscopic binding data and the activity data are separate claims, and the
      paper's own hypothesis about which arm is affected is explicitly untested.
      Cited here only within the knowledge gap, never as support for an annotation.
- id: PMID:1556077
  title: The VanS-VanR two-component regulatory system controls synthesis of depsipeptide
    peptidoglycan precursors in Enterococcus faecium BM4147.
  findings:
  - statement: >-
      VanS stimulates VanR-dependent transcription in vivo and is a
      membrane-associated histidine kinase of the kind that sets response-regulator
      phosphorylation levels.
    supporting_text: VanS stimulated VanR-dependent transcription and was related to
      membrane-associated histidine protein kinases which control the level of phosphorylation
      of response regulators.
  - statement: >-
      Synthesis of the resistance enzymes is controlled transcriptionally by the
      VanS-VanR system.
    supporting_text: Synthesis of these enzymes was regulated at the transcriptional
      level by the VanS-VanR two-component regulatory system encoded by the proximal
      part of the cluster.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The in vivo genetics behind the whole system, cited by UniProt for the
      function of this entry. It is the evidence that the biochemistry observed in
      vitro is what controls the operon in the cell. Abstract-only in the cache.
