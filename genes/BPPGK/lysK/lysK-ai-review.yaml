- term:
    id: GO:0008233
    label: peptidase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0645
  review:
    summary: >-
      Keyword-derived peptidase term for the CHAP endopeptidase domain. Correct, but less
      specific than the structural and mutagenesis evidence supports: CHAP(K) is a
      papain-fold cysteine endopeptidase with a Cys54/His117/Glu134 triad.
    action: MODIFY
    reason: >-
      The 1.69 A structure of CHAP(K) shows a papain-like topology with the catalytic triad
      in a hydrophobic cleft, and alanine substitution of Cys54 or His117 eliminates
      staphylolytic activity entirely while E134A strongly reduces it (PMID:25064136),
      which identifies the mechanistic class. The domain is additionally classified as
      Peptidase C51 by PROSITE-ProRule and the entry's SUPFAM assignment is "Cysteine
      proteinases". GO:0004197 cysteine-type endopeptidase activity is a descendant of
      GO:0008233 and is the most specific term the ontology offers: GO has no term for the
      actual bond specificity (D-alanyl-glycyl endopeptidase, EC 3.4.22.-), which is filed
      as a proposed new term in this review. The same replacement is applied to the IMP row
      on this term, so the two rows stay consistent.
    proposed_replacement_terms:
    - id: GO:0004197
      label: cysteine-type endopeptidase activity
    supported_by:
    - reference_id: PMID:25064136
      reference_section_type: ABSTRACT
      supporting_text: >-
        The structure of CHAP(K) revealed a papain-like topology with a hydrophobic cleft, where the catalytic triad is located.
    - reference_id: PMID:25064136
      reference_section_type: RESULTS
      supporting_text: >-
        Mutation of the conserved Cys54 and His117 residues to alanine resulted in complete elimination of staphylolytic activity of the enzyme as demonstrated by zymographic analysis, indicating an essential role of these residues and supporting the hypothesis that they are part of the catalytic triad.
