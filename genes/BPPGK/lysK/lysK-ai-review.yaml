- term:
    id: GO:0009253
    label: peptidoglycan catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR002502
  - InterPro:IPR036505
  review:
    summary: >-
      InterPro2GO mapping from the Amidase_2 signatures to an own-process metabolic term.
      The chemistry is right and the direction of the interaction is wrong: GO:0009253
      describes an organism breaking down its own peptidoglycan, and a phage has none.
    action: MODIFY
    reason: >-
      Checked in OLS, GO:0009253 sits wholly inside the metabolic branch - peptidoglycan
      metabolic process, aminoglycan catabolic process, macromolecule catabolic process, all
      under GO:0009987 cellular process - with no interspecies parent anywhere in its
      ancestry. It therefore asserts that Staphylococcus phage K turns over peptidoglycan of
      its own, which is false: LysK hydrolyses the sacculus of its staphylococcal host. GO
      has the matching host-directed term, GO:0052009 symbiont-mediated disruption of host
      cell wall, on the interspecies-interaction branch, and replacing the term keeps the
      substance while putting it in the right branch. This is the same error the CACAO
      batch-1 review found on PRD1 endolysin P15 with GO:0044277 cell wall disassembly, and
      it is instructive that here it arrives by InterPro2GO rather than from a student: the
      domain signature cannot know whose wall is being degraded, so an own-process mapping
      from a muralytic domain will mis-direct every phage, type-VI-secretion and bacteriocin
      protein that carries it. The general fix is a taxon-aware mapping, or a taxon
      constraint on GO:0009253 excluding viruses.
    proposed_replacement_terms:
    - id: GO:0052009
      label: symbiont-mediated disruption of host cell wall
    supported_by:
    - reference_id: PMID:16199588
      reference_section_type: RESULTS
      supporting_text: >-
        These results confirmed that recombinant LysK from lactococci is enzymatically active and capable of degrading staphylococcal cell walls.
    - reference_id: file:BPPGK/lysK/lysK-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Endolysin that degrades host peptidoglycans and participates in the sequential events which lead to the programmed host cell lysis releasing the mature viral particles
    source_defects:
    - defect_type: WRONG_TERM
      resource: OTHER
      asserted_value: >-
        GO:0009253 peptidoglycan catabolic process, from InterPro:IPR002502 / IPR036505
        (InterPro2GO, GO_REF:0000002)
      corrected_value: >-
        GO:0052009 symbiont-mediated disruption of host cell wall for viral and other
        cross-species members of these signatures
      confidence: PROBABLE
      requested_change: REPOINT
      explanation: >-
        Resource is InterPro (InterPro2GO), for which the schema has no enum value, so
        OTHER is used. The InterPro2GO mapping of the Amidase_2 domain (IPR002502) and
        the Amidase/PGRP superfamily (IPR036505) to GO:0009253 peptidoglycan catabolic
        process is sound for bacterial autolysins, whose substrate is their own wall,
        but inverts the direction of the interaction for the many phage endolysins,
        bacteriocins and secreted effectors that carry the same domain. GO:0009253 has
        no interspecies parent. Suggest making the mapping taxon-aware, or adding
        GO:0052009 symbiont-mediated disruption of host cell wall for viral members.
