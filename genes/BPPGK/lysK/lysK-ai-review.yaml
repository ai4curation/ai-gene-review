gene_symbol: lysK
aliases:
- ORF30/ORF32
- PhageK_071
- LysK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:221915
  label: Kayvirus kay
description: >-
  Endolysin of Staphylococcus phage K (genus Kayvirus), a 495-residue, 54 kDa modular
  peptidoglycan hydrolase encoded late in infection and acting on the murein sacculus of
  its staphylococcal host. LysK is built from three modules: an N-terminal CHAP
  (cysteine, histidine-dependent amidohydrolase/peptidase) domain with a papain-like fold
  and a Cys54/His117/Glu134 catalytic triad, which hydrolyses the D-alanyl-glycyl bond
  between the D-alanine of the tetrapeptide stem and the first glycine of the
  pentaglycine cross-bridge (EC 3.4.22.-); a central Amidase_2 domain that cleaves the
  amide bond between N-acetylmuramic acid and L-alanine of the stem peptide
  (N-acetylmuramoyl-L-alanine amidase, EC 3.5.1.28); and a C-terminal SH3b cell
  wall-binding domain that docks the enzyme on staphylococcal peptidoglycan and is needed
  for full lytic activity. The CHAP domain carries a buried structural Ca(2+) ion
  essential for activity and a more loosely bound Zn(2+) ion at the active site; a
  further Zn(2+) site is inferred in the amidase domain. Cutting two bonds in the same
  glycopeptide collapses the cell wall, and in the phage life cycle this is the terminal
  lytic step that ruptures the infected cell and releases progeny virions. Because
  staphylococcal peptidoglycan is accessible from the outside, LysK also lyses untreated
  cells when applied exogenously, killing coagulase-positive and coagulase-negative
  staphylococci including MRSA and vancomycin-resistant strains while sparing other
  Gram-positive genera - the basis of interest in it as an enzybiotic.
existing_annotations:
- term:
    id: GO:0001897
    label: symbiont-mediated cytolysis of host cell
  evidence_type: IDA
  original_reference_id: PMID:16199588
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. Recombinant LysK expressed in Lactococcus lactis forms a 54 kDa lytic
      zone on a zymogram containing MRSA cells (Fig. 1A, lane 5) and, in a kill curve,
      reduces live MRSA DPC5645 by 99% within one hour (Fig. 1B). The gene product lyses
      cells of its staphylococcal host, which is what the term asserts.
    action: ACCEPT
    reason: >-
      CACAO assignment, experimental (IDA), full text available, and the term matches what
      the paper shows for this gene. PMID:16199588 demonstrates, on this protein, both
      cell-wall degradation (zymogram clearing at the predicted mass of LysK, absent from
      vector controls) and killing of live cells (Fig. 1B kill curve), i.e. cytolysis of
      host cells. Notably the student chose a term on the interspecies-interaction branch
      - GO:0001897 is under symbiont-mediated killing of host cell and cytolysis in another
      organism - which is the correct direction for a phage-encoded lysin acting on its
      host, and is exactly what the two electronic rows on this entry (GO:0009253,
      GO:0042742) get wrong. This is not a phenotype read as a process: LysK itself
      performs the peptidoglycan hydrolysis that ruptures the cell, so the molecular step
      and the process term coincide. The one caveat, which does not affect the action, is
      that the assay applies the enzyme from the outside rather than following an
      infection; the term speaks only of cytolysis of a host cell, which exogenous lysis of
      S. aureus by a phage K protein satisfies.
    supported_by:
    - reference_id: PMID:16199588
      reference_section_type: RESULTS
      supporting_text: >-
        These results confirmed that recombinant LysK from lactococci is enzymatically active and capable of degrading staphylococcal cell walls.
    - reference_id: PMID:16199588
      reference_section_type: RESULTS
      supporting_text: >-
        In kill curves using a human MRSA strain (DPC5645), a 99% reduction in staphylococcal cell numbers was observed 1 h after the addition of lysates containing LysK (Fig. 1B ), demonstrating that recombinant LysK is capable of killing live pathogenic staphylococci.
