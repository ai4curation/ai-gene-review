- term:
    id: GO:0042742
    label: defense response to bacterium
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: involved_in
  supporting_entities:
  - UniProtKB-KW:KW-0081
  review:
    summary: >-
      KW-0081 (Antimicrobial) mapped to a host-defence process term. The direction of the
      interspecies interaction is inverted: phage K attacks the bacterium, it does not
      defend itself against one.
    action: REMOVE
    reason: >-
      GO:0042742 denotes a reaction mounted to protect the annotated organism from a
      bacterium. LysK degrades the peptidoglycan of its own host in order to release
      progeny virions, and is of interest as an antibacterial precisely because it attacks
      staphylococci; there is no defence and no bacterium being resisted by phage K. This
      is a demonstrably wrong electronic keyword-to-GO mapping - the Antimicrobial keyword
      covers both host antimicrobial peptides and phage lytic enzymes, and only the former
      fits the defence framing - which the guidelines list as legitimate ground for REMOVE.
      The real content of the keyword is already carried, correctly, by GO:0031640 and
      GO:0001897. The identical row was removed on PRD1 endolysin P15 in CACAO batch 1 and
      reported upstream; this is a second instance, so the defect is systematic across
      phage-encoded lytic enzymes rather than a one-off.
    supported_by:
    - reference_id: file:BPPGK/lysK/lysK-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Endolysin that degrades host peptidoglycans and participates in the sequential events which lead to the programmed host cell lysis releasing the mature viral particles
    - reference_id: PMID:16199588
      reference_section_type: RESULTS
      supporting_text: >-
        In kill curves using a human MRSA strain (DPC5645), a 99% reduction in staphylococcal cell numbers was observed 1 h after the addition of lysates containing LysK (Fig. 1B ), demonstrating that recombinant LysK is capable of killing live pathogenic staphylococci.
    source_defects:
    - defect_type: WRONG_TERM
      resource: UNIPROT
      asserted_value: >-
        GO:0042742 defense response to bacterium, IEA from UniProtKB-KW:KW-0081
      corrected_value: >-
        no GO:0042742 annotation; on a phage endolysin the antimicrobial keyword denotes
        killing of the host (GO:0031640, GO:0001897), not defence against a bacterium
      confidence: CONFIRMED
      requested_change: DELETE_VALUE
      explanation: >-
        The UniProtKB keyword-to-GO mapping used by GO_REF:0000043 maps KW-0081
        (Antimicrobial) to GO:0042742 defense response to bacterium. For a
        bacteriophage-encoded bacteriolytic enzyme such as LysK this inverts the
        direction of the interspecies interaction: the phage kills the bacterium, it
        does not mount a defence against one. The intended content of the keyword is
        already captured for these proteins by GO:0031640 killing of cells of another
        organism (also mapped from KW-0081) and, specifically, by GO:0001897
        symbiont-mediated cytolysis of host cell. Suggest restricting the GO:0042742
        mapping to non-viral taxa, or splitting the keyword. This is the second
        instance found in this project, after PRD1 endolysin P15 (P13559).
- term:
    id: GO:0046872
    label: metal ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000043
  qualifier: enables
  supporting_entities:
  - UniProtKB-KW:KW-0479
  review:
    summary: >-
      Generic metal-binding term from KW-0479. The identities of the metals are known: the
      CHAP domain crystal structures resolve a buried structural Ca(2+) ion whose ligands
      are individually required for activity, and a more loosely bound Zn(2+) at the active
      site, both confirmed by X-ray fluorescence; UniProt infers a further Zn(2+) site in
      the amidase domain.
    action: MODIFY
    reason: >-
      Correct but less specific than the evidence supports, so MODIFY with descendant terms
      rather than ACCEPT. GO:0005509 calcium ion binding is experimentally established: the
      1.69-1.79 A structures (PDB 4CSH, 4CT3) show Ca(2+) coordinated by Asp45, Asp47,
      Tyr49, His51 and Asp56, and alanine substitution of Asp45, Asp47 or Asp56 abolishes
      staphylolytic activity (PMID:25064136). GO:0008270 zinc ion binding is also supported,
      though less firmly: the structures place a Zn(2+) at the catalytic Cys54 but describe
      it as loosely bound, and UniProt adds a by-similarity Zn(2+) site at 214/324/332 in the
      amidase domain with a note that Zn(2+) is required for amidase activity. Both are
      listed, as the guidelines direct when several specific descendants are supported;
      calcium is the one carried into core_functions, since it is the metal shown to be
      required.
    proposed_replacement_terms:
    - id: GO:0005509
      label: calcium ion binding
    - id: GO:0008270
      label: zinc ion binding
    supported_by:
    - reference_id: PMID:25064136
      reference_section_type: ABSTRACT
      supporting_text: >-
        CHAP(K) contains an additional lobe in its N-terminal domain, with a structural calcium ion, coordinated by residues Asp45, Asp47, Tyr49, His51 and Asp56.
    - reference_id: PMID:25064136
      reference_section_type: RESULTS
      supporting_text: >-
        Zymogram analysis demonstrated that mutation of residues Asp45, Asp47 and Asp56 resulted in the complete abolishment of the staphylolytic activity of the enzyme
    - reference_id: PMID:25064136
      reference_section_type: ABSTRACT
      supporting_text: >-
        The presence of a zinc ion in the active site was also apparent, coordinated by the catalytic residue Cys54 and a possible substrate analogue.
    - reference_id: file:BPPGK/lysK/lysK-uniprot.txt
      record_section:
      - CC:COFACTOR
      supporting_text: >-
        Note=Zn(2+) is required for amidase activity.
- term:
    id: GO:0042834
    label: peptidoglycan binding
  evidence_type: IMP
  original_reference_id: PMID:19493008
  qualifier: enables
  review:
    summary: >-
      Proposed new annotation for the C-terminal SH3b domain, the module that docks LysK on
      staphylococcal peptidoglycan. Fusing the SH3b domain back onto the isolated CHAP
      domain restores near full-length lytic activity, which the authors read as a
      requirement for a C-terminal binding domain.
    action: NEW
    reason: >-
      This is a distinct molecular function of the protein, missing from GOA, and LysK
      itself performs it: the SH3b module binds the substrate on which the two catalytic
      domains act, which is why its removal costs activity and its restoration recovers it.
      The structural basis is explicit in the entry - an SH3b domain at residues 412-481
      with a PROSITE-ProRule assignment and a solution NMR structure of that fragment
      (PDB 5O1Q) - and SH3b is the canonical staphylococcal cell-wall-binding module. The
      evidence code is IMP because the claim rests on engineered domain deletion and
      reconstruction rather than a binding assay; a direct binding measurement on the
      isolated SH3b domain would be the way to upgrade it to IDA, and is listed in
      suggested_experiments. Conservative in scope: no process term is proposed from this,
      only the binding function.
    supported_by:
    - reference_id: PMID:19493008
      reference_section_type: ABSTRACT
      full_text_unavailable: true
      supporting_text: >-
        A fusion of the CHAP domain to the SH3b domain has near full-length LysK lytic activity, suggesting the need for a C-terminal binding domain.
    - reference_id: file:BPPGK/lysK/lysK-uniprot.txt
      record_section:
      - CC:DOMAIN
      supporting_text: >-
        The SH3b domain increases the CHAP domain activity
    - reference_id: file:BPPGK/lysK/lysK-uniprot.txt
      record_section:
      - FT:DOMAIN
      supporting_text: >-
        /note="SH3b"
- term:
    id: GO:0044659
    label: viral release from host cell by cytolysis
  evidence_type: IC
  original_reference_id: PMID:16199588
  qualifier: involved_in
  review:
    summary: >-
      Proposed new annotation for the life-cycle role: LysK is the lytic enzyme of a virulent
      staphylococcal phage, expressed late in infection, whose peptidoglycan hydrolysis
      ruptures the infected cell and liberates progeny virions. This is the term under
      GO:0001897 that names why the cytolysis happens.
    action: NEW
    reason: >-
      The entry carries both the Host cell lysis by virus and Viral release from host cell
      keywords, and UniProt curates the role explicitly, yet no GO:0044659 row reached GOA -
      a gap in the keyword mapping rather than a disagreement. LysK passes the participation
      test: it performs the peptidoglycan hydrolysis step that ruptures the cell, it is not
      merely required for or consumed by the process. The evidence code is deliberately IC,
      an inference this review authors: neither cached paper follows an infection, both apply
      the enzyme from outside, so the release role rests on the enzyme's demonstrated
      muralytic activity plus the late timing of the lysK transcript (10-20 min
      post-infection, reported as data not shown) and on UniProt's own "(Probable)"
      assessment. The row is therefore proposed, and the missing holin genetics for phage K
      is recorded as a knowledge gap rather than papered over. Kept to the one term: no
      separate GO:0019076 or holin-related claim is proposed.
    supported_by:
    - reference_id: file:BPPGK/lysK/lysK-uniprot.txt
      record_section:
      - CC:FUNCTION
      supporting_text: >-
        Endolysin that degrades host peptidoglycans and participates in the sequential events which lead to the programmed host cell lysis releasing the mature viral particles
    - reference_id: PMID:16199588
      reference_section_type: RESULTS
      supporting_text: >-
        Reverse transcription-PCR results demonstrated that the lysK transcript appears between 10 and 20 min after phage infection (data not shown).
    - reference_id: PMID:25064136
      reference_section_type: ABSTRACT
      supporting_text: >-
        Los bacteriófagos codifican endolisinas para lisar sus bacterias hospedadoras y permitir la liberación de su progenie.
