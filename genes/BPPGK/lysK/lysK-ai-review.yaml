    peptide bond between the D-alanine of the peptidoglycan tetrapeptide stem and the first
    glycine of the pentaglycine cross-bridge, by a papain-like Cys54/His117/Glu134 catalytic
    triad. This is the activity that lyses live staphylococci, and the only one of the two
    that a truncated enzyme needs to do so. GO has no term for this bond specificity, so the
    mechanistic-class term is used here and the specific activity is filed under
    proposed_new_terms.
