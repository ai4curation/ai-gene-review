proposed_new_terms:
- proposed_name: D-alanyl-glycyl endopeptidase activity
  proposed_definition: >-
    Catalysis of the hydrolysis of the peptide bond between the D-alanine of the
    peptidoglycan stem peptide and the glycine that begins the interpeptide cross-bridge.
  proposed_parent:
    id: GO:0004197
    label: cysteine-type endopeptidase activity
  justification: >-
    The bond specificity of the CHAP domains of staphylococcal phage endolysins (LysK,
    phi11 LytA) and of related CHAP-family peptidoglycan hydrolases is established by mass
    spectrometry of digested peptidoglycan. GO has no term for it: the nearest available
    terms are GO:0004197 cysteine-type endopeptidase activity, which names the mechanism
    but not the substrate, and GO:0008745, which is the other, amidase activity of the same
    protein. A term for the D-Ala-Gly bond would let the two activities of bifunctional
    endolysins be distinguished without reaching for a mechanism-only parent, and would
    apply to a well-populated family (CHAP, MEROPS C51, Pfam PF05257). It is a sibling of
    the glycyl-glycine endopeptidase chemistry of lysostaphin, which is likewise unnamed
    in GO.
  supported_by:
  - reference_id: PMID:19493008
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: >-
      The cut sites are identical to LytA (phi11 endolysin), with cleavage between d-alanine of the stem peptide and glycine of the cross-bridge peptide, and N-acetylmuramoyl-l-alanine amidase activity.
  - reference_id: PMID:25064136
    reference_section_type: INTRODUCTION
    supporting_text: >-
      the CHAP domain hydrolyzes it between the D-alanine of the tetra-peptide stem and the first glycine of the penta-glycine cross-bridge
knowledge_gaps:
- gap_statement: >-
    How LysK reaches the sacculus during infection is unknown for phage K. Endolysins of
    other phages depend on a holin to permeabilise the cytoplasmic membrane, but no holin
    has been identified or tested in phage K, and no lysis-timing experiment has been done:
    every published assay applies LysK from the outside, so the terminal lysis step has
    never been observed in an infected cell.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    This is the evidential basis on which GO:0044659 viral release from host cell by
    cytolysis rests, which is why that row is proposed as an IC inference rather than an
    experimental annotation.
- gap_statement: >-
    Why the CHAP-only truncation lyses cells in zymogram, plate-lysis and turbidity assays
    yet has no detectable activity in a minimal inhibitory concentration assay is not
    understood, while the CHAP-SH3b fusion is active in all of them. Whether this reflects
    potency, stability in growth medium, or substrate accessibility in growing versus
    stationary cells is untested.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Determines whether the SH3b domain contributes only substrate affinity or something
    further, such as protection from proteolysis or processivity on intact cells, and bears
    directly on the design of truncated enzybiotics.
suggested_questions:
- question: >-
    Should GO carry a taxon constraint excluding viruses from GO:0009253 peptidoglycan
    catabolic process and the other own-process cell-wall terms, so that domain-based
    mappings from muralytic signatures cannot place phage endolysins, bacteriocins and
    secreted effectors on the metabolic branch?
  experts:
  - GO ontology editors
- question: >-
    Should the UniProtKB KW-0081 (Antimicrobial) to GO:0042742 mapping be restricted by
    taxon, or the keyword split, given that it is now documented to invert the direction of
    the interaction on at least two phage endolysins (LysK and PRD1 P15)?
  experts:
  - UniProt keyword curators
- question: >-
    Do the two catalytic domains of LysK act cooperatively or independently on intact
    staphylococcal peptidoglycan, and does cutting both bonds in the same glycopeptide
    matter for lysis, or is the endopeptidase cut sufficient?
  experts:
  - peptidoglycan biochemists
- question: >-
    Is the active-site zinc of CHAP(K) a catalytic cofactor, a regulator of substrate access
    to Cys54, or a crystallisation artefact?
  experts:
  - structural enzymologists
suggested_experiments:
- hypothesis: >-
    The SH3b domain of LysK binds staphylococcal peptidoglycan directly, which is why it
    raises the activity of the CHAP domain.
  description: >-
    Measure binding of the isolated SH3b domain (residues 412-481, for which a solution NMR
    structure exists, PDB 5O1Q) to purified S. aureus peptidoglycan and to peptidoglycan
    stripped of wall teichoic acid, by cell-wall pulldown and by surface plasmon resonance
    or isothermal titration calorimetry against soluble muropeptides. A measured affinity
    would upgrade the proposed GO:0042834 annotation from IMP to IDA and would show whether
    the determinant recognised is the glycan, the pentaglycine cross-bridge, or the teichoic
    acid.
  experiment_type: BINDING_ASSAY
- hypothesis: >-
    Access of LysK to the host sacculus during infection requires a phage K holin, and LysK
    is the enzyme that performs the terminal lysis step in vivo.
  description: >-
    Identify candidate holin genes in the phage K genome by membrane-topology prediction,
    then test a plasmid-borne lysis cassette in S. aureus as was done for PRD1: express the
    candidate holin alone, LysK alone, and both together, and follow optical density,
    potassium efflux and membrane potential. In parallel, construct a lysK-defective phage K
    (or suppress it with an antisense construct) and compare lysis timing and burst size with
    the wild type. This is the experiment that would convert the proposed GO:0044659 row from
    IC to IDA.
  experiment_type: GENETIC_SCREEN
- hypothesis: >-
    The zinc ion seen beside Cys54 in the CHAP(K) structure is regulatory rather than
    catalytic.
  description: >-
    Determine the specific activity of apo-CHAP(K), prepared by chelation and desalting, in a
    turbidimetric lysis assay, and titrate back Zn(2+) and Ca(2+) separately and together over
    a concentration range, with inductively coupled plasma MS to confirm the metal content of
    each preparation. The earlier metal-dependence assay did not strip metals before testing,
    so a true apoenzyme baseline is what is missing. A stimulatory-then-inhibitory zinc
    profile would support the regulatory model; a strict requirement would make it catalytic.
  experiment_type: ENZYME_ASSAY
- hypothesis: >-
    The CHAP endopeptidase and the Amidase_2 domain cut the same glycopeptide, and the
    endopeptidase cut alone is sufficient for lysis of live cells.
  description: >-
    Digest purified S. aureus peptidoglycan with full-length LysK, with the active-site mutants
    C54A (endopeptidase-dead) and with an Amidase_2 active-site mutant, and resolve the
    muropeptide products by reversed-phase HPLC and mass spectrometry; in parallel measure
    turbidity reduction and MIC for each enzyme on live cells. Comparing the product profiles
    of the single mutants with the double digest shows whether the two activities are
    independent, and comparing their lytic potency tests the sufficiency claim that the
    truncation experiments imply.
  experiment_type: ENZYME_ASSAY
