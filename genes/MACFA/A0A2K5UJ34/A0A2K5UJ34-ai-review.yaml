- id: file:MACFA/A0A2K5UJ34/A0A2K5UJ34-deep-research-falcon.md
  title: Deep research report on TTC39C in Macaca fascicularis
  reference_review:
    relevance: LOW
    correctness: LOW_QUALITY
    review_notes: >-
      Literature summary generated by the falcon provider. It is used here only as background.
      Its TTC39B/LXR material concerns a paralog in a different PANTHER subfamily (SF4), and its
      C. elegans ciliary-localization statement (Pir et al. 2024) concerns a worm protein
      described as "TTC39A/C" whose PANTHER subfamily relative to vertebrate TTC39C has not been
      established; the only reviewed worm family member, ttc-39B (Q09266), is in SF9. This file
      no longer supports the core function, which previously quoted it for ciliary localization.
- id: PMID:25860617
  title: Characterization of tetratricopeptide repeat-containing proteins critical for cilia formation
    and function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text read (PMC4393279). Zebrafish ttc39c morpholino knockdown with mRNA rescue of body
      curvature; KV cilia number and length reduced, pronephric cilia motility nearly abolished;
      abnormal otoliths and randomized heart-tube orientation reported as secondary ciliopathy
      phenotypes. FLAG-TTC39C (mouse) weakly co-precipitates IFT144 and IFT139. The authors
      state that their TTC39C antibody did not work for immunostaining, so no localization is
      reported. This is the source of the ZFIN IMP annotations that seed both PAINT nodes.
  findings:
  - statement: ttc39c knockdown reduces Kupffer's vesicle cilia number and length in zebrafish.
    supporting_text: >-
      We thus examined KV cilia in embryos at the 7-somite stage and found that both the number
      and length of the KV cilia were significantly reduced in the ttc morphants
  - statement: ttc39c morphant pronephric cilia are largely paralysed.
    supporting_text: >-
      Strikingly, many cilia were paralyzed in the ttc9c, ttc36, and ttc39c morphants
  - statement: TTC39C subcellular localization could not be determined.
    supporting_text: >-
      As to TTC39c, we were not sure of its subcellular localization because the antibody did
      not work for immunostaining.
