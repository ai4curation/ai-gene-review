core_functions:
- description: >-
    TTC39C is a non-catalytic TPR-domain protein required for the assembly of motile cilia, as
    shown by knockdown of the zebrafish ortholog in the same PANTHER subfamily, where Kupffer's
    vesicle cilia are fewer and shorter and pronephric cilia barely beat. Its weak association
    with the IFT-A subunits IFT144 and IFT139 suggests that it acts with intraflagellar
    transport, but its molecular activity, direct partners and subcellular localization are not
    known, so no molecular function or location is asserted.
  supported_by:
  - reference_id: PMID:25860617
    supporting_text: >-
      We thus examined KV cilia in embryos at the 7-somite stage and found that both the number
      and length of the KV cilia were significantly reduced in the ttc morphants
  - reference_id: PMID:25860617
    supporting_text: >-
      TTC36 mainly interacted with IFT-A complex, whereas TTC39c showed weak association with
      IFT144 and IFT139, two subunits of IFT-A.
  directly_involved_in:
  - id: GO:0060271
    label: cilium assembly
suggested_questions:
- question: >-
    Does TTC39C localize to cilia or basal bodies in mammalian multiciliated cells, given that the
    only vertebrate study could not immunostain it and the C. elegans ciliary localization comes
    from a worm protein whose orthology to TTC39C is not established?
- question: >-
    Is the TTC39C association with IFT144/IFT139 direct, and does it reflect a role in IFT-A
    function or in axonemal dynein arm assembly, which the authors raised for the paralysed
    pronephric cilia?
suggested_experiments:
- description: >-
    Generate stable ttc39c mutants in zebrafish (or Ttc39c knockout mice) to test whether the
    morpholino cilia-length and motility phenotypes are reproduced, and image tagged TTC39C in
    multiciliated airway cells to determine its ciliary localization.
- description: >-
    Proximity labelling or reconstitution with purified IFT-A to test whether TTC39C binds IFT144
    and IFT139 directly.
