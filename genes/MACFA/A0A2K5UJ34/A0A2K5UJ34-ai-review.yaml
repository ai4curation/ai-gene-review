taxon:
  id: NCBITaxon:9541
  label: Macaca fascicularis
description: >-
  Tetratricopeptide repeat protein 39C (TTC39C) of the crab-eating macaque, a non-catalytic
  member of the TTC39/IML2 family built around a TPR-like helical (Iml2-TPR_39) domain. The
  sequence corresponds to residues 39-583 of human TTC39C (99.6% identical over that span): the
  gene model starts at the human internal Met39 and lacks only the disordered N-terminal
  extension, so all annotated TPR repeats are present. Within PANTHER family PTHR31859 it falls in
  subfamily SF1 together with human, mouse, rat and zebrafish TTC39C (fungal IML2-like proteins
  also map to SF1 but sit outside the metazoan TTC39C clade). Functional knowledge of the
  orthologous group comes mainly from zebrafish ttc39c: morpholino knockdown, with mRNA rescue of
  the body-curvature phenotype, reduces the number and length of Kupffer's vesicle cilia and
  nearly abolishes pronephric cilia beating, and overexpressed TTC39C associates weakly with the
  IFT-A subunits IFT144 and IFT139, consistent with a role in assembling motile cilia, perhaps in
  connection with intraflagellar transport. The protein's subcellular localization in vertebrate
  cells, its direct binding partners and its molecular activity have not been determined. The
  paralog TTC39B (a different PANTHER subfamily) promotes ubiquitin-dependent degradation of LXR
  in liver, but that activity has not been shown for TTC39C.
existing_annotations:
- term:
    id: GO:0032474
    label: otolith morphogenesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      TreeGrafter transfer from PANTHER node PTN001275231; the underlying PAINT assertion (IBD at
      PTN002840059, Euteleostomi) is seeded by zebrafish ttc39c (ZFIN:ZDB-GENE-050522-194) whose
      only evidence is the morphant phenotype of Xu et al. 2015 (PMID:25860617): more than 75% of
      ttc39c morphants had abnormal otoliths. The authors themselves present the otolith defect
      as a secondary ciliopathy phenotype that follows from loss of inner-ear cilia motility,
      not as a process the protein performs. Macaque A0A2K5UJ34 is the TTC39C ortholog (PANTHER
      SF1, file:MACFA/A0A2K5UJ34/A0A2K5UJ34-bioinformatics/RESULTS-rereview.md), so the
      phylogenetic placement is not in question; what is in question is whether the zebrafish
      observation is process participation at all.
    action: REMOVE
    reason: >-
      Otolith morphogenesis here is an organismal readout downstream of defective motile cilia in
      a morpholino knockdown, the class of phenotype this review does not treat as process
      participation (the same logic by which the PAINT curator declined to propagate the
      zebrafish heart left/right asymmetry IMP from the same paper). No step of otolith
      formation is shown to be performed by TTC39C. In addition, primates form otoconia rather
      than the fused otoliths of teleosts, so the propagated term describes an anatomy the
      macaque lacks. The defensible part of the zebrafish data is captured by the cilium
      assembly annotation, which is retained.
    supported_by:
    - reference_id: PMID:25860617
      supporting_text: >-
        Since proper otolith formation requires cilia motility in the inner ear, defects in the
        inner ear motile cilia often lead to abnormal otoliths, which are fused, mispositioned,
        or of wrong sizes or numbers [39]. We found that, similar to the ttc25 morphants, more
        than 75% of the morphants of ttc4, -9c, -36, and -39c developed abnormal otoliths at 72
        hpf
    - reference_id: file:interpro/panther/PTHR31859/PTHR31859-paint.tsv
      supporting_text: "PTHR31859\tPTN002840059\tGO:0032474\tP\tIBD\tfalse\tZFIN:ZDB-GENE-050522-194\ttaxon:117571"
- term:
    id: GO:0060271
    label: cilium assembly
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  review:
    summary: >-
      TreeGrafter transfer from PANTHER node PTN001275231; the underlying PAINT assertion is an
      IBD at PTN001275223 (Eumetazoa) seeded by zebrafish ttc39c. Macaque A0A2K5UJ34 is the
      TTC39C ortholog: it is 99.6% identical to human TTC39C over residues 39-583 and is
      classified in the same PANTHER subfamily (PTHR31859:SF1) as zebrafish ttc39c, so it
      descends from the node that carries the assertion. The zebrafish evidence (PMID:25860617)
      is a cellular phenotype rather than an organismal one: ttc39c morphants showed reduced
      number and length of Kupffer's vesicle cilia and nearly paralysed pronephric cilia
      (5.6 Hz versus 42.2 Hz beat frequency), and the morphant body-curvature phenotype was
      rescued by MO-resistant ttc39c mRNA. Overexpressed mouse TTC39C co-precipitated weakly
      with IFT-A subunits IFT144 and IFT139, which links the protein to IFT machinery rather than
      only to a downstream readout.
    action: ACCEPT
    reason: >-
      The PAINT node placement is consistent with the subfamily assignment of this macaque
      ortholog, and the donor evidence is a direct measurement of cilium formation in the cells
      that build the cilium, supported by a biochemical association with IFT-A. The basis is a
      single morpholino study, with mRNA rescue shown for body curvature rather than for cilia
      length, and no mammalian loss-of-function data; cilium assembly is nonetheless the most
      specific process the evidence supports and the best current statement of the gene's role.
      The more specific motile-cilium terms are not added because the study does not separate
      an assembly defect from a motility defect.
    supported_by:
    - reference_id: PMID:25860617
      supporting_text: >-
        We thus examined KV cilia in embryos at the 7-somite stage and found that both the
        number and length of the KV cilia were significantly reduced in the ttc morphants
    - reference_id: PMID:25860617
      supporting_text: >-
        TTC36 mainly interacted with IFT-A complex, whereas TTC39c showed weak association with
        IFT144 and IFT139, two subunits of IFT-A.
    - reference_id: file:interpro/panther/PTHR31859/PTHR31859-paint.tsv
      supporting_text: "PTHR31859\tPTN001275223\tGO:0060271\tP\tIBD\tfalse\tZFIN:ZDB-GENE-050522-194\ttaxon:6072"
    - reference_id: file:MACFA/A0A2K5UJ34/A0A2K5UJ34-bioinformatics/RESULTS-rereview.md
      supporting_text: >-
        macaque residue 1 aligns to human Met39 and the segment runs to the
        human C-terminus.
