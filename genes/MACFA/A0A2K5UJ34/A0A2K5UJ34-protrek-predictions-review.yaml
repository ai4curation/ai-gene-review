id: A0A2K5UJ34
gene_symbol: TTC39C
taxon:
  id: NCBITaxon:9541
  label: Macaca fascicularis
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for macaque TTC39C, a TPR-repeat protein with
  ciliary associations and no catalytic domain. ProTrek splits between two themes: ranks
  1-3 are ciliary (cilium movement in otolith formation, protein localization to cilium,
  MKS complex), which matches GOA's IEA cilium assembly and otolith morphogenesis
  annotations and this review's core assignment; ranks 4-5 are mitochondrial (cristae
  formation, respiratory chain complex assembly), and the free-text channel leads with
  mitochondrial protein import. TPR solenoids are generic protein-interaction modules
  shared by ciliary and mitochondrial-import scaffolds alike, so the model is reporting
  both occupants of the fold without deciding. The adaptor molecular function this review
  assigns (protein-macromolecule adaptor activity) is not retrieved in the top 25 - the
  general problem that non-catalytic scaffolds have no distinctive GO signature to
  retrieve.
  Assessment: 1 correct novel (COR), 1 uncertain (UNC), 1 incorrect (NPI).
source_documents:
  - projects/PROTREK_EVALUATION/argo50_protrek_hits.tsv
  - genes/MACFA/A0A2K5UJ34/A0A2K5UJ34-uniprot.txt
