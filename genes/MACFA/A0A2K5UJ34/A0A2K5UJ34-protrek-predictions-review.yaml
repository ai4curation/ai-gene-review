predictions:
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0003355
      label: cilium movement involved in otolith formation
    predicted_term_type: GO_BP
    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        Top-ranked hit (score 14.81), absent from GOA and a strict descendant of the otolith
        morphogenesis term GOA carries by IEA. The refinement is well grounded: the zebrafish
        ortholog has IMP evidence for otolith morphogenesis and for heart left/right
        asymmetry, both cilium-motility-dependent processes, and the C. elegans ortholog is
        experimentally ciliary. Correct and novel, with the caveat that otoliths are a fish
        structure - a curator annotating the macaque protein would keep the mechanism
        (ciliary motility) and drop the fish-specific context.
      supported_by:
        - reference_id: GO_REF:0000107
          supporting_text: Automatic transfer of annotations with same species
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0061512
      label: protein localization to cilium
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        Rank 2 (score 14.43). Consistent with an adaptor acting in cilium assembly, and with
        the ciliary localisation established for the C. elegans ortholog, but it asserts a
        specific trafficking role - that TTC39C carries cargo to the cilium - which no
        ortholog study has shown. Plausible and untested; a good candidate experiment rather
        than an annotation.
      supported_by:
        - reference_id: GO_REF:0000107
          supporting_text: Automatic transfer of annotations with same species
  - source_method: ProTrek
    source_version: ProTrek_650M, SwissProt ProTrek_650M_UniRef50 text index
    source_reference_id: PMID:41039041
    predicted_term:
      id: GO:0036038
      label: MKS complex
    predicted_term_type: GO_CC
    review:
      assessment: NPI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Rank 3 (score 14.41). The MKS module of the ciliary transition zone has a defined
        membership (MKS1, TMEM67, TMEM216, B9D1/2, CC2D2A and others); TTC39C is not among
        them and has no B9 or TMEM domain. Being ciliary does not make a protein part of a
        specific ciliary complex, and asserting complex membership is a much stronger claim
        than the ciliary localisation the evidence supports. Naming a complex on the strength
        of a shared compartment recurs across this benchmark and is one of its most
        consistent error modes.
      supported_by:
        - reference_id: GO_REF:0000107
          supporting_text: Automatic transfer of annotations with same species
