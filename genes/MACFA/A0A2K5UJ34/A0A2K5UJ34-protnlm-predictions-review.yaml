status: COMPLETE
description: >-
  Macaque TTC39C ortholog (PANTHER PTHR31859:SF1). The single ProtNLM2 process prediction, heart
  left/right asymmetry, rests on one zebrafish ttc39c morpholino study in which randomized heart-tube
  orientation is reported as a secondary ciliopathy readout of defective Kupffer's vesicle cilia; it is
  neither established nor refuted for the macaque protein and is scored uncertain.
