    review:
      assessment: COR
      confidence_score: 2
      summary: >-
        The target is assigned specifically to the TTC39C subfamily rather than only to a generic TPR-repeat
        fold. Zebrafish ttc39c perturbation in a primary cilia study produced laterality defects, including
        abnormal heart positioning (PMID:25860617). Conservation of the TTC39C ciliary role and vertebrate
        cilia-dependent laterality provides a reasonable basis for transferring the broad heart-asymmetry
        process to macaque TTC39C. This is an ortholog-based inference rather than a macaque experiment;
        the process is absent from the cached target annotations.
