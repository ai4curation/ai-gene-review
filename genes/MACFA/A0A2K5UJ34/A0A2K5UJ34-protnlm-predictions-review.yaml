      label: determination of heart left/right asymmetry
    predicted_term_type: GO_BP
    review:
      assessment: UNC
      confidence_score: 1
      summary: >-
        The target is the TTC39C ortholog (PANTHER subfamily SF1, the same subfamily as zebrafish ttc39c),
        and the term is absent from its GOA annotations, so the prediction would be novel. The only
        experimental support is the zebrafish morpholino screen of Xu et al. 2015 (PMID:25860617), in
        which more than 64% of ttc39c morphants had misoriented heart tubes; the authors attribute this,
        like the otolith and body-curvature defects, to reduced number and length of Kupffer's vesicle
        cilia. Motile cilia of the left-right organiser do participate in laterality determination, so
        the prediction is biologically plausible, but the evidence is a single knockdown study with no
        mammalian loss-of-function data, and the PANTHER PAINT assertions for PTHR31859 propagate only
        cilium assembly and otolith morphogenesis, not a laterality term. The merged gene review accepts
        cilium assembly as the supported process and removes the parallel organismal readout (otolith
        morphogenesis) as a downstream ciliopathy phenotype rather than process participation; the heart
        asymmetry phenotype is of the same kind. No PubMed record links TTC39C to laterality outside this
        screen. The evidence therefore neither establishes nor refutes heart left/right asymmetry
        determination for macaque TTC39C.
