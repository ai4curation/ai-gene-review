core_functions:
- description: >-
    Sequence-specific binding of GU-rich (UGG/GGU) elements in target pre-mRNAs via three RRMs,
    through which the protein enhances or represses inclusion of adjacent alternative exons in
    the nucleus, directing an epithelial splicing program (inferred from the ESRP1 ortholog).
