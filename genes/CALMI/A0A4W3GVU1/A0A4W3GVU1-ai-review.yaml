suggested_questions:
- question: >-
    Does the elephant shark esrp1 gene produce nuclear and cytoplasmic isoforms through an
    alternative 5' splice site at the end of the exon equivalent to mammalian exon 12, and is
    its expression epithelium-restricted as in mammals?
suggested_experiments:
- description: >-
    Express tagged shark esrp1 in an ESRP-depleted mesenchymal cell line with an FGFR2 IIIb/IIIc
    minigene to test whether it rescues epithelial exon IIIb inclusion, and use CLIP to confirm
    binding to GU-rich intronic elements.
