id: A0A4W3GVU1
gene_symbol: esrp1
product_type: PROTEIN
status: DRAFT
taxon:
  id: NCBITaxon:7868
  label: Callorhinchus milii
description: >-
  Epithelial splicing regulatory protein 1 (esrp1) of the elephant shark is a 684-residue
  RNA-binding protein of the ESRP branch of the hnRNP-related PTHR13976 family. It carries an
  N-terminal RNase H-like fold followed by three RNA recognition motifs (RRMs), and is the
  ortholog of mammalian ESRP1: it groups with tetrapod ESRP1 sequences (about 78% identity to
  human ESRP1 over its full length) rather than with ESRP2 or hnRNP H/F. Mammalian ESRP1 is a
  nuclear, epithelial cell-type-specific regulator of alternative pre-mRNA splicing that binds
  GU-rich (UGG/GGU) cis-elements in introns and controls a large program of epithelial splice
  isoforms, best known for promoting the FGFR2 IIIb isoform. Alternative 5' splice-site use at
  the end of exon 12 produces nuclear and cytoplasmic ESRP1 isoforms, and the cytoplasmic form
  binds UTRs and acts post-transcriptionally. The shark protein is expected to share the
  conserved mRNA-binding and splicing-regulatory activities; it has not been studied directly.
existing_annotations:
- term:
    id: GO:0003676
    label: nucleic acid binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  review:
    summary: >-
      InterPro2GO mapping from the RBD-domain superfamily (IPR035979) and RNase H-like
      superfamily (IPR036397). The protein is a nucleic acid-binding protein, but the
      characterised activity of its ESRP1 orthologs is sequence-specific binding of pre-mRNA
      and mRNA via the RRMs; there is no evidence of DNA binding, and the RNase H-like fold is
      not known to bind or cleave nucleic acid in ESRPs.
    action: MODIFY
    reason: >-
      Correct but too general. The target groups with tetrapod ESRP1 inside the ESRP clade
      (file:CALMI/A0A4W3GVU1/A0A4W3GVU1-bioinformatics/RESULTS-rereview.md), which descends from
      PAINT node PTN001018050 where mRNA binding (GO:0003729) was placed by IBD from fusilli,
      ESRP1 and ESRP2. Human ESRP1 has mRNA binding by IDA (PMID:19285943). Replace with
      GO:0003729, the term used in core_functions.
    proposed_replacement_terms:
    - id: GO:0003729
      label: mRNA binding
    supported_by:
    - reference_id: PMID:19285943
      supporting_text: suggesting that they bind specific GU-rich sequence motifs
    - reference_id: file:CALMI/A0A4W3GVU1/A0A4W3GVU1-bioinformatics/RESULTS-rereview.md
      supporting_text: In the NJ tree the target groups with tetrapod ESRP1 (Xenopus, mouse, human)
- term:
    id: GO:0003723
    label: RNA binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  review:
    summary: >-
      Combined automated (InterPro RRM / UniRule) assignment of RNA binding. True: the protein
      has three RRMs and its ESRP1 orthologs bind GU-rich elements in target pre-mRNAs. PAINT
      also places RNA binding at the deep node PTN000360053. The more specific mRNA binding is,
      however, supported for the ESRP clade.
    action: MODIFY
    reason: >-
      The term is correct but less specific than the evidence supports. Human ESRP1 binds
      FGFR2 pre-mRNA intronic elements and mRNA UTRs (PMID:19285943, PMID:36238894) and the
      ESRP-clade PAINT node carries GO:0003729 mRNA binding; refine to that term (also used in
      core_functions), consistent with the nucleic acid binding row.
    proposed_replacement_terms:
    - id: GO:0003729
      label: mRNA binding
    supported_by:
    - reference_id: PMID:19285943
      supporting_text: we identified two paralogous epithelial cell-type-specific RNA-binding proteins
        that are essential regulators of FGFR2 splicing
    - reference_id: PMID:36238894
      supporting_text: RBPs, including ESRP1, execute their regulatory functions through sequence-specific
        binding to RNA
- term:
    id: GO:0005634
    label: nucleus
  evidence_type: IEA
  original_reference_id: GO_REF:0000044
  qualifier: located_in
  review:
    summary: >-
      UniProt SubCell mapping (ARBA-derived) of nucleus. Human ESRP1 is nuclear by IDA
      (PMID:19285943) and its splicing-regulatory function is nuclear. ESRP1 also has
      cytoplasmic isoforms produced by alternative 5' splice-site choice at the end of exon 12,
      so nucleus is not exclusive, but it is the compartment of the core activity. PAINT places
      nucleoplasm at PTN000360053; nucleus is as precise as the direct ortholog evidence for
      this gene model allows.
    action: ACCEPT
    reason: >-
      Nuclear localisation is experimentally established for the ortholog (human ESRP1, same
      ESRP1 clade by phylogeny) and is the site of splicing regulation. The ARBA source itself is
      not used as support.
    supported_by:
    - reference_id: PMID:36238894
      supporting_text: competing 5′ splice sites at the end of Esrp1 exon 12 lead to the production
        of ESRP1 isoforms with distinct nuclear or cytoplasmic localization
    - reference_id: PMID:19285943
      supporting_text: we identified two paralogous epithelial cell-type-specific RNA-binding proteins
        that are essential regulators of FGFR2 splicing
- term:
    id: GO:0043484
    label: regulation of RNA splicing
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  review:
    summary: >-
      Proposed process annotation. ESRP1 itself does the regulatory work: it binds intronic
      GU-rich cis-elements in target pre-mRNAs and enhances or silences adjacent exons
      (FGFR2 IIIb/IIIc being the defining case, plus hundreds of epithelial splicing events).
      This is participation, not a downstream consequence. Human ESRP1 carries GO:0043484 by
      IDA (PMID:19285943) and PAINT placed GO:0043484 by IBD at PTN000360053, an ancestor of the
      ESRP clade; the shark protein groups with ESRP1 and would inherit the IBA if it were in the
      PANTHER tree. The previous version of this review proposed the child term GO:0048024
      (regulation of mRNA splicing, via spliceosome); both the human curators and PAINT chose
      GO:0043484, so this review follows them.
    action: NEW
    reason: >-
      Gene product directly performs the regulation via sequence-specific pre-mRNA binding;
      relationship to the experimentally characterised ortholog is established by phylogenetic
      placement in the ESRP1 clade, not by best hit alone.
    supported_by:
    - reference_id: PMID:19285943
      supporting_text: we identified two paralogous epithelial cell-type-specific RNA-binding proteins
        that are essential regulators of FGFR2 splicing
    - reference_id: PMID:20711167
      supporting_text: Epithelial splicing regulatory proteins 1 and 2 (ESRP1 and ESRP2) are
    - reference_id: file:CALMI/A0A4W3GVU1/A0A4W3GVU1-bioinformatics/RESULTS-rereview.md
      supporting_text: In the NJ tree the target groups with tetrapod ESRP1 (Xenopus, mouse, human)
references:
- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings:
  - statement: >-
      InterPro domains (RBD superfamily, RRM domain) correctly identify ESRP1 as an
      RNA-binding protein, but the nucleic acid binding term generated is too broad
      and should be narrowed to mRNA binding.
- id: GO_REF:0000044
  title: >-
    Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
    vocabulary mapping, accompanied by conservative changes to GO terms applied by
    UniProt
  findings:
  - statement: >-
      The subcellular location mapping assigns nucleus, consistent with the ortholog's
      experimentally determined nuclear localisation.
- id: GO_REF:0000120
  title: Combined Automated Annotation using Multiple IEA Methods
  findings:
  - statement: >-
      Combined IEA methods assign RNA binding based on RRM domains and UniRule annotations.
- id: file:CALMI/A0A4W3GVU1/A0A4W3GVU1-deep-research-falcon.md
  title: Deep research summary for esrp1 in Callorhinchus milii
  findings:
  - statement: >-
      ESRP1 is an epithelial-specific RNA-binding protein that regulates alternative
      splicing of pre-mRNA transcripts including FGFR2, CD44, CTNND1, and ENAH.
  - statement: >-
      No species-specific literature exists for ESRP1 in Callorhinchus milii;
      functional annotation is inferred from conserved orthologs in mammals and other
      vertebrates.
  reference_review:
    relevance: MEDIUM
    correctness: UNVERIFIED
    review_notes: >-
      2026-10-21 re-review: no longer used as supported_by (two earlier quotes from it were not
