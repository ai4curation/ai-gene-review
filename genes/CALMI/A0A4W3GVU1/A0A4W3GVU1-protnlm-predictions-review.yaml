id: A0A4W3GVU1
gene_symbol: A0A4W3GVU1
taxon:
  id: NCBITaxon:7868
  label: Callorhinchus milii
status: COMPLETE
description: >-
  Elephant shark esrp1, an ESRP1 ortholog that groups with tetrapod ESRP1 and retains the
  characterized ESRP1 nuclear-localization peptide. The single ProtNLM2 prediction (nucleus) is
  correct and is already carried by the gene in GOA.
source_documents:
  - genes/CALMI/A0A4W3GVU1/A0A4W3GVU1-uniprot.txt
  - genes/CALMI/A0A4W3GVU1/A0A4W3GVU1-goa.tsv
  - genes/CALMI/A0A4W3GVU1/A0A4W3GVU1-bioinformatics/RESULTS-rereview.md
  - publications/PMID_28634384.md
  - genes/CALMI/A0A4W3GVU1/A0A4W3GVU1-hypotheses/prediction-nucleus-localization/openscientist.md
predictions:
  - source_method: ProtNLM2
    source_version: UniProt 2024_06 pilot
    predicted_term:
      id: GO:0005634
      label: nucleus
    predicted_term_type: GO_CC
    review:
      assessment: CNN
      confidence_score: 2
      summary: >-
        The target is the elephant shark ESRP1 ortholog: it carries the ESRP family and ESRP1 RRM1
        InterPro signatures and groups with tetrapod ESRP1 in a neighbour-joining tree. Its sequence
        contains the peptide GLSPPPCKLPCLSPP (UniProt sequence), which experiments on mouse Esrp1 showed
        is sufficient for nuclear localization, while isoforms lacking CKLP are mainly cytoplasmic
        (PMID:28634384). Nucleus is therefore a justified ortholog transfer, though not exclusive of a
        cytoplasmic isoform pool. The gene already carries nucleus in GOA (accepted in the gene review),
        so the prediction is correct but not novel.
      supported_by:
        - reference_id: file:CALMI/A0A4W3GVU1/A0A4W3GVU1-uniprot.txt
          supporting_text: >-
            DR   InterPro; IPR050666; ESRP. ... DR   InterPro; IPR034427; ESRP1_RRM1.
        - reference_id: file:CALMI/A0A4W3GVU1/A0A4W3GVU1-bioinformatics/RESULTS-rereview.md
          supporting_text: >-
            In the NJ tree the target groups with tetrapod ESRP1 (Xenopus, mouse, human)
        - reference_id: PMID:28634384
          supporting_text: >-
            we identified a fifteen-amino-acid stretch “GLSPPPCKLPCLSPP” that is sufficient for the
            nuclear localization while the same peptide excluding CKLP showed a cytoplasmic localization
        - reference_id: PMID:28634384
          supporting_text: >-
            isoforms containing the CKLP amino acids (derived from the distal 5′ss) were predominantly
            nuclear while isoforms lacking the CKLP (derived from the proximal 5′ss) were predominantly
            localized to the cytoplasm
        - reference_id: file:CALMI/A0A4W3GVU1/A0A4W3GVU1-hypotheses/prediction-nucleus-localization/openscientist.md
          supporting_text: >-
            The nucleus prediction is correct and well-supported.
