    predicted_term:
      id: GO:0097158
      label: pre-mRNA intronic pyrimidine-rich binding
    predicted_term_type: GO_MF
    review:
      assessment: PLI
      confidence_score: 0
      error_type: PARALOG_OVERANNOTATION
      summary: >-
        Top-ranked hit (score 18.02). Pyrimidine-tract binding defines PTBP1/hnRNP I and the
        U2AF machinery; ESRP1's RRMs recognise UGG- and GGU-rich elements, and it is that
        preference that produces the epithelial splicing program. The two are different
        RRM-family proteins acting at different positions relative to regulated exons.
        ProTrek's PANTHER context for this entry is the generic hnRNP-related family
        (PTHR13976), which is where the confusion most plausibly originates.
      supported_by:
