id: A0A4W3GVU1
gene_symbol: esrp1
taxon:
  id: NCBITaxon:7868
  label: Callorhinchus milii
status: COMPLETE
description: >-
  ProTrek sequence-to-text retrieval for the elephant shark ESRP1 ortholog, a three-RRM
  epithelial splicing regulator. ProTrek identifies the splicing-regulator role from
  sequence - regulation of RNA splicing at rank 2 and regulation of mRNA splicing via
  spliceosome at rank 4, neither of which is in GOA, whose annotations stop at RNA binding
  and nucleus - and its free-text channel returns the ESRP1 description verbatim, naming
  the FGFR2-IIIb epithelial isoform switch at a score of 20.94. The GO channel's errors are
  in RNA-binding specificity: ranks 1 and 3 assign pyrimidine-tract binding, which is the
  signature of PTB/hnRNP I, whereas ESRP1 binds UGG/GGU-rich elements. Getting the
  regulatory role right while getting the sequence preference backwards is a meaningful
  distinction for a splicing factor, since the binding motif is what determines the target
  set. ProtNLM2 made no GO prediction for this protein.
  Assessment: 2 correct novel (COR), 1 incorrect (PLI).
