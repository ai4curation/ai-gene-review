core_functions:
- description: Reactivates cognate ethanolamine ammonia-lyase by ATP-dependent exchange of inactive bound
    cobalamin for intact adenosylcobalamin. E. coli biochemistry supports this mechanistic assignment
    to LT2, whose EutA directly associates with EutBC and Eut metabolosomes. Reactivation is needed after
    inactivation, not after every catalytic turnover.
