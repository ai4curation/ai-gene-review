taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: EutA is the ethanolamine ammonia-lyase reactivase of Salmonella Typhimurium LT2. It associates
  with the cognate EutBC enzyme and is assigned ATP-dependent exchange of damaged or inactive bound cobalamin
  for intact adenosylcobalamin, restoring lyase activity after inactivation. EutA associates with ethanolamine
  microcompartments. Its physiological requirement depends on conditions that affect lyase inactivation
  and can be bypassed under particular growth conditions.
