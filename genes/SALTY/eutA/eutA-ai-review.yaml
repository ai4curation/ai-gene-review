  review:
    summary: EutA restores lyase activity through damaged-cofactor exchange.
    action: NEW
    reason: The direct purified reactivation experiment is on E. coli EutA, not the LT2 protein. Transfer
      to SALTY is supported by the conserved EutA family together with LT2 cognate EutBC interactions,
      complementation and localization. GO:0008047 requires direct interaction and no covalent modification
      of the enzyme; exchanging noncovalently bound cobalamin fits that definition. No general ATP-dependent
      protein-folding or autonomous lyase activity is inferred.
    supported_by:
    - *id001
    - *id002
    - reference_id: PMID:35785499
      supporting_text: the insolubility and instability of purified EutA challenged enzymatic analysis,
        as well as kinetic analysis of its interaction with EAL.
