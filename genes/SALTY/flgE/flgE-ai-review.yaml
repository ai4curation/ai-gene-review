- id: PMID:19732341
  title: Interaction of FliK with the bacterial flagellar hook is required for efficient export specificity
    switching.
  findings:
  - statement: FliK-FlhB interaction and transient hook contacts regulate export switching and hook length.
    supporting_text: temporary association of FliK with the inner surface of the hook during FliK secretion
  reference_review:
    review_notes: Binding and switching experiments test FliK/FlgE/FlgD and mutant backgrounds. Transient
      ruler contact is distinct from FlgE structural membership; no universal hook length or complete
      native assembly is inferred from binding alone.
- id: PMID:29946050
  title: In Vitro Reconstitution of Functional Type III Protein Export and Insights into Flagellar Assembly.
  findings:
  - statement: Membrane-vesicle reconstruction directly supports export, FlgE hook assembly and FliK-dependent
      length control in defined conditions.
    supporting_text: In the presence of FlgD, the transported FlgE monomers assembled into the hook structure
      on the basal body
  reference_review:
    review_notes: Direct inverted-membrane-vesicle transport and hook reconstruction, including defined
      energy conditions and FliK addition. This is not a demonstration that each purified component alone
      translocates protein or completes native flagellar assembly.
- id: PMID:31570877
  title: Torque transmission mechanism of the curved bacterial flagellar hook revealed by cryo-EM.
  findings: []
  reference_review:
    review_notes: Cryo-EM resolves the curved hook. RCSB6K3I entity1 is exactly LT2-reference FlgE residues2–403.
      This sequence bridge does not relabel other SJW polyhook preparations LT2.
