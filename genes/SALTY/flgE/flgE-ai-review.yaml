taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: FlgE is the polymerizing subunit of the Salmonella flagellar hook, the flexible joint connecting
  the basal-body rod to the filament. Repeated FlgE subunits form a hollow helical structure that combines
  bending flexibility with torsional rigidity to transmit motor torque. Exported FlgE assembles with assistance
  from the hook cap FlgD. FlgE is transiently present in the cytosol before export, while its mature structural
  function is extracellular in the hook.
