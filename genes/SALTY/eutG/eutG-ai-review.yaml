id: P41795
gene_symbol: eutG
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: EutG is an iron-family alcohol dehydrogenase associated with the ethanolamine microcompartment
  of Salmonella Typhimurium LT2. It is assigned the reduction of acetaldehyde to ethanol with oxidation
  of NADH, providing a route for NAD+ recycling during ethanolamine catabolism. This catalytic assignment
  is supported by enzyme-family conservation and physiological evidence; purified LT2 substrate/cofactor
  kinetics have not been established in the sources examined. Its requirement for growth depends on medium
  and compartment integrity.
