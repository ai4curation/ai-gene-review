taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: EutQ is a bifunctional component of the Salmonella Typhimurium LT2 ethanolamine microcompartment.
  Its cupin-like C-terminal domain supports reversible acetate kinase activity, providing ATP from acetyl
  phosphate and ADP in the catabolic direction. Its N-terminal helices connect shell proteins with encapsulated
  cargo enzymes and support assembly of the organelle. The N-terminal assembly architecture is distinct
  from that of shorter Gram-positive EutQ proteins.
