- term:
    id: GO:0140378
    label: protein complex scaffold activity
  evidence_type: IDA
  original_reference_id: PMID:41032589
  qualifier: enables
  review:
    summary: LT2 EutQ physically connects microcompartment shell and cargo.
    action: NEW
    reason: N-terminal H1/H2 contacts shell components while H3/H4 associates with cargo encapsulation
      peptides. Domain deletions separate these contacts and disrupt shell/cargo coupling. The incorporated
      EutQ molecule therefore supplies a structural scaffold rather than only generic binding. GO:0030674
      specifically directs protein-complex scaffolds to GO:0140378; the kinase domain is a separate activity.
      This LT2 architecture is not assigned wholesale to shorter Gram-positive proteins.
    supported_by:
    - *id004
    - *id003
