- id: PMID:26448059
  title: 'The EutQ and EutP proteins are novel acetate kinases involved in ethanolamine catabolism: physiological
    implications for the function of the ethanolamine metabolosome in Salmonella enterica.'
  findings:
  - statement: EutQ supports ATP generation in coupled assays.
    supporting_text: When EutQ, EutP or both were present in the reaction mixture, ATP was formed at the
      expense of AcCoA
  - statement: EutQ kinase was insensitive to divalent-metal removal.
    supporting_text: S. Typhimurium EutQ acetate kinase activity did not require divalent metal cofactors,
      as dialysis with EDTA did not affect its activity.
  reference_review:
    review_notes: Direct LT2-derived JE6583 recombinant EutQ kinase assays and EutD-coupled chemistry;
      His6 purification tag was cleaved. Physiological phenotype is conditional on anoxic ethanolamine/tetrathionate
      growth. Local ATP-consumer coupling is a hypothesis.
- id: PMID:27063436
  title: Engineering formation of multiple recombinant Eut protein nanocompartments in E. coli.
  findings: []
  reference_review:
    review_notes: Includes native S. enterica LT2 EutQ-deletion experiments (TT24802 eutQ370Δ::FRT), as
      well as recombinant E. coli C2566 nanocompartments and EutM pull-downs. C-terminally His6-tagged
      EutQ, but not the N-terminally tagged construct, supported EutM pull-down; tag orientation matters.
- id: PMID:3045078
  title: Ethanolamine utilization in Salmonella typhimurium.
  findings: []
- id: PMID:41032589
  title: Molecular basis of the biogenesis of a protein organelle for ethanolamine utilization.
  findings:
  - statement: Separate N-terminal regions associate with shell and cargo.
    supporting_text: the EutQ N-terminal H1/H2 interacts with the shell whereas H3/H4 associates with
      cargos.
  - statement: EutQ is incorporated into the LT2 Eut organelle.
    supporting_text: Our results show that only EutQ is encapsulated within the Eut BMC
  reference_review:
    review_notes: Direct LT2 fluorescent localization, scarless deletion, domain mapping and shell/cargo
      interaction studies. N-terminal assembly role is not transferable without evidence to Gram-positive
      EutQ lacking the first three helices. ATP delivery to EutA/EutT remains proposed.
core_functions:
- description: Reversible acetate kinase activity of the LT2 cupin-like C-terminal region generates ATP
    and acetate from ADP and acetyl phosphate. Direct coupled assays support pathway chemistry; dedicated
    delivery of this ATP to EutA or EutT remains a hypothesis.
