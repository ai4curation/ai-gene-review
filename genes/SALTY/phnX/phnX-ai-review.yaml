  review:
    summary: The inherited DNA-repair role is inappropriate for this characterized phosphonatase.
    action: REMOVE
    reason: Salmonella PhnX directly cleaves a phosphonate C-P bond in nutrient catabolism (PMID:9649311); the LT2 genetic study PMID:7592415 independently establishes this pathway. The shared HAD scaffold and PAINT inheritance from a node supported by phosphoglycolate phosphatase do not make the distinct PhnX subfamily a DNA-repair enzyme. This rejects transfer of the process to PhnX, not the experimental source annotation or the reliability of IBA in general.
