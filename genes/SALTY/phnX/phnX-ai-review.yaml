taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: PhnX is the phosphonoacetaldehyde hydrolase of Salmonella typhimurium LT2. It cleaves the carbon-phosphorus bond in phosphonoacetaldehyde, releasing acetaldehyde and inorganic phosphate in the second reaction of the PhnWX 2-aminoethylphosphonate catabolic pathway. This HAD-like enzyme uses a lysine-linked Schiff-base intermediate and a magnesium-dependent phosphoryl-transfer mechanism. Its expression responds to phosphate limitation through the Pho regulon.
