  review:
    summary: AcnA hydrates 2-methyl-cis-aconitate to 2-methylisocitrate, enabling complete in
      vitro reconstitution of the 2-methylcitric acid cycle (propionate to pyruvate) with
      PrpE, PrpC, PrpD and PrpB; the acnA acnB double mutant cannot grow on propionate.
