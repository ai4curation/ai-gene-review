  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: >-
  Aconitate hydratase A (aconitase A, AcnA) of Salmonella enterica serovar Typhimurium,
  a cytoplasmic [4Fe-4S] cluster-containing member of the aconitase/IRP family. AcnA
  catalyses the reversible isomerisation of citrate to isocitrate via cis-aconitate in the
  tricarboxylic acid cycle, and also hydrates 2-methyl-cis-aconitate to
  (2R,3S)-2-methylisocitrate, the step of the 2-methylcitric acid cycle of propionate
  catabolism that the operon-encoded PrpD dehydratase cannot perform. Purified AcnA,
  together with PrpE, PrpC, PrpD and PrpB, reconstitutes conversion of propionate to
  pyruvate in vitro. AcnA is functionally redundant with aconitase B (AcnB): an acnA
  mutant grows normally on propionate and other carbon sources, whereas an acnA acnB
  double mutant cannot grow on propionate. By analogy with Escherichia coli AcnA, the
  cluster-free apo-enzyme is expected to act as a post-transcriptional regulator that
  binds the 3' untranslated regions of aconitase mRNAs.
