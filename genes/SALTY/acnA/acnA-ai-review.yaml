suggested_questions:
- question: Does Salmonella apo-AcnA bind the 3'UTRs of acnA/acnB mRNAs and regulate their
    stability, as shown for E. coli AcnA, and does this matter under oxidative or iron stress
    during infection?
- question: What is the relative contribution of AcnA versus AcnB to 2-methylisocitrate
    formation in vivo, given that AcnA is stress-induced and AcnB is the main housekeeping
    aconitase?
suggested_experiments:
- description: Measure kinetic parameters of purified AcnA and AcnB for citrate,
    cis-aconitate and 2-methyl-cis-aconitate, and quantify methylcitrate-cycle flux in acnA
    and acnB single mutants grown on propionate.
