id: P26465
gene_symbol: fliI
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella typhimurium (strain LT2 / SGSC1412 / ATCC 700720)
description: >-
  FliI (STM1972) is the soluble ATPase of the flagellar type III protein export
  apparatus of Salmonella Typhimurium. It is a Mg2+-dependent ATPase whose
  activity is insensitive to F-, V- and P-type ATPase inhibitors. In the
  presence of ATP it assembles into a homohexameric ring. The ring is structurally
  related to the alpha3beta3 core of F1-ATPase, and the gamma-like coiled-coil
  protein FliJ binds in its centre. FliI exists as a cytoplasmic FliH2-FliI
  complex that binds export substrates and their chaperones (such as FliT), and
  as a FliI6-FliJ ring docked in the basal-body C ring through FliH contacts
  with FlhA and FliN. FliH inhibits FliI ATPase activity. ATP hydrolysis by FliI
  delivers substrates to the FlhA-FlhB docking platform and releases the FliH-FliI
  escort. It also drives FliJ-FlhA binding, which turns the export gate into an
  efficient membrane-potential-driven protein exporter and helps enforce the
  switch from rod/hook to filament substrates. Protein translocation itself is
  powered mainly by proton flux through the membrane export gate (a
  proton-protein antiporter). Export can proceed, inefficiently, without FliI or
  with a nearly inactive catalytic mutant. Catalytic-site mutations abolish
  flagellation. FliI is an evolutionary paralog of the F1-ATP synthase subunits
  but does not synthesize ATP or conduct protons. The UniProt name
  "Flagellum-specific ATP synthase" and EC 7.1.2.2 reflect that homology, not its
  function; the export ATPase EC is 7.4.2.8.
existing_annotations:
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:20421493
  qualifier: enables
  supporting_entities:
  - UniProtKB:P0A1N2
  review:
    summary: >-
      Pull-down assays showed that His-FliI binds the flagellar export chaperone
      FliT. Binding is strong to FliT lacking its C-terminal helix (FliT94) and
      very weak to full-length FliT. FliI and FliD bind different surfaces of
      FliT, consistent with FliI receiving the FliT-FliD chaperone-substrate
      complex for export.
    action: REMOVE
    reason: >-
      The interaction is real and biologically meaningful, but generic "protein
      binding" says nothing about function. No GO MF term fits well. GO:0051087
      protein-folding chaperone binding refers to folding chaperones, and FliT is
      an export/anti-aggregation chaperone. The role this interaction serves is
      captured by protein-exporting ATPase activity and by type III secretion.
      Removing the row does not mean the interaction is false.
    supported_by:
    - reference_id: PMID:20421493
      supporting_text: His-FliI bound strongly to GST-FliT94, very weakly to GST-FliT,
        and not at all to GST
- term:
    id: GO:0005515
    label: protein binding
  evidence_type: IPI
  original_reference_id: PMID:21278755
  qualifier: enables
