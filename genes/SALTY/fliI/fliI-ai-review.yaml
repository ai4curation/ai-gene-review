- term:
    id: GO:0015986
    label: proton motive force-driven ATP synthesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0046933
  review:
    summary: >-
      This row is a logical inference from the IBA GO:0046933 ATP synthase row.
      FliI consumes ATP to support flagellar protein export and is not part of
      an Fo-coupled ATP synthase. In the flagellar export system, the proton
      motive force drives protein translocation through the membrane export gate,
      not ATP synthesis.
    action: REMOVE
    reason: >-
      The source MF annotation (GO:0046933) is wrong, so this inferred process is
      also wrong. No FliI has been shown to synthesize ATP. The Salmonella enzyme
      is an ATP hydrolase that is insensitive to F-type ATPase inhibitors, and
      the PMF is used by the flagellar exporter for protein translocation.
    supported_by:
    - reference_id: PMID:8943245
      supporting_text: The activity was not affected by inhibitors of the F-, V- or
        P-type ATPases
    - reference_id: PMID:18216859
      supporting_text: the flagellar secretion apparatus functions as a proton-driven
        protein exporter
    - reference_id: file:SALTY/fliI/fliI-deep-research-falcon.md
      supporting_text: FliI hydrolyzes ATP, but it does not itself transport ATP-derived phosphate energy across the membrane or constitute the translocation pore
- term:
    id: GO:0016887
    label: ATP hydrolysis activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR005714
  - InterPro:IPR020005
  review:
    summary: >-
      Purified FliI is a Mg2+-dependent ATPase. Glu211 is the catalytic base:
      E211Q essentially abolishes hydrolysis, and E211D reduces it about 100-fold.
      Activity is cooperative and coupled to hexamer formation, and FliH inhibits
      it.
    action: ACCEPT
    reason: >-
      This is the correct catalytic activity, directly demonstrated on the
      Salmonella protein. It is kept alongside the more specific
      protein-exporting ATPase activity proposed below.
    supported_by:
    - reference_id: PMID:8943245
      supporting_text: It had an ATPase activity of 0.16 s-1 at 25 degrees C and pH
        7, and a Km for ATP of 0.3 mM; Mg2+ was required.
    - reference_id: PMID:12787361
      supporting_text: Enzymatic activity of the FliI ATPase showed positive co-operativity,
        establishing that oligomerization and enzyme activity are coupled.
- term:
    id: GO:0030254
    label: protein secretion by the type III secretion system
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR005714
  review:
    summary: >-
      The flagellar export apparatus is a type III secretion system. FliI
      escorts substrates to the export gate and uses ATP hydrolysis for substrate
      entry and gate activation. fliI mutants cannot export filament subunits.
    action: ACCEPT
    reason: >-
      Correct. FliI does part of the work of flagellar type III export: ATP-driven
      substrate delivery, escort release and gate activation. It is not merely
      required for the process.
    supported_by:
    - reference_id: PMID:21934659
      supporting_text: FliI ATPase forms a complex with FliH and FliJ and escorts export
        substrates from the cytoplasm to the export gate complex
    - reference_id: PMID:18216858
      supporting_text: the FliH-FliI complex facilitates only the initial entry of
        export substrates into the gate
