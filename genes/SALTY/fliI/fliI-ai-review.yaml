- term:
    id: GO:0042802
    label: identical protein binding
  evidence_type: IPI
  original_reference_id: PMID:21278755
  qualifier: enables
  supporting_entities:
  - UniProtKB:P26465
  review:
    summary: >-
      FliI self-associates into a homohexameric ring. Hydrolysis occurs at the
