- term:
    id: GO:0045259
    label: proton-transporting ATP synthase complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - AGI_LocusCode:AT5G08680
  - AGI_LocusCode:AT5G08690
  - PANTHER:PTN008558586
  - PomBase:SPAC222.12c
  - RGD:621368
  - SGD:S000003882
  - UniProtKB:P00829
  - UniProtKB:P06576
  - UniProtKB:P0ABB4
  - UniProtKB:P26527
  - UniProtKB:P83483
  review:
    summary: >-
      This IBD is placed at PANTHER:PTN008558586. In the PTHR15184 tree that node
      is a duplication, with two children: PTN000390097, the FliI/SctN
      type III ATPase clade (SF9, SF62, SF81), and PTN008558588, the F1-beta
      clade. Every seed (E. coli AtpD, human ATP5F1B, yeast ATP2, S. pombe atp2,
      Arabidopsis, rat, bovine and chloroplast beta subunits) lies in the F1-beta
      branch. P26465 (SF81) inherits the assertion only because the node sits
      above the duplication that created the export-ATPase paralog. FliI is part
      of the FliH-FliI-FliJ ring of the flagellar export apparatus, which has no
      Fo sector and no a/b/c subunits.
    action: REMOVE
    reason: >-
      The node is placed too deep. Membership of the Fo-F1 complex is a property
      of the F1-beta branch only. The FliI/SctN branch diverged at the
      duplication and forms a different complex: the cytoplasmic ATPase ring of a
      type III exporter. The FliJ-FliI6 ring is architecturally related to the
      F1 gamma-alpha3beta3 core, but it is not an ATP synthase complex. The IBD
      should be moved to PTN008558588, or an IRD/NOT placed at PTN000390097.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN008558586
        source_label: PTN008558586
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Duplication node above both the F1-beta clade (PTN008558588, which holds
          all seeds) and the FliI/SctN clade (PTN000390097). The complex membership is valid
          for F1-beta descendants only; FliI is in the FliH-FliI-FliJ export ATPase ring.
    supported_by:
    - reference_id: PMID:33846530
      supporting_text: The flagellar export apparatus is composed of a PMF-driven transmembrane
        export gate complex made of FlhA, FlhB, FliP, FliQ, and FliR and a cytoplasmic
        ATPase ring complex consisting of FliH, FliI, and FliJ
    - reference_id: PMID:17202259
      supporting_text: These results imply an evolutionary relation between the flagellum
        and F0F1-ATPsynthase and a similarity in the mechanism between FliI and F1-ATPase
        despite the apparently different functions of these proteins.
- term:
    id: GO:0046933
    label: proton-transporting ATP synthase activity, rotational mechanism
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN008558586
  - PomBase:SPAC222.12c
  - SGD:S000003882
  - UniProtKB:P06576
  - UniProtKB:P0ABB4
  review:
    summary: >-
      This IBD comes from the same PTN008558586 duplication node as the complex
      row, and its seeds are all F1-beta subunits. The row uses contributes_to,
      so the claim is that FliI is a subunit of a complex with rotary
      proton-transporting ATP synthase activity. The complex FliI actually forms
      (FliH12-FliI6-FliJ at the export gate) hydrolyzes ATP to drive protein
      export. FliJ is structurally gamma-like and a rotary mechanism for the
      FliI6-FliJ ring has been proposed, but no coupled proton channel or ATP
      synthesis exists.
    action: REMOVE
    reason: >-
      Contradicted by the Salmonella biochemistry. FliI's ATPase is insensitive
      to F-, V- and P-type inhibitors. Protons move through the export gate
      (FlhA has ion-channel activity and the gate alone is a proton-protein
      antiporter), not through FliI or its ring, and the PMF powers protein
      translocation, not ATP synthesis. A rotary-like architecture does not make
      the complex an ATP synthase, so even the weaker contributes_to claim fails.
      The target lies in the paralogous FliI/SctN branch below a duplication
      node, and there is target-specific evidence of functional divergence. This
      is paralog over-propagation from an IBD placed above the duplication.
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN008558586
        source_label: PTN008558586
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: IBD placed at a duplication node; seeds (AtpD, ATP5F1B, ATP2, atp2) are all
          in the F1-beta child PTN008558588. P26465 descends via the FliI/SctN paralog branch
          PTN000390097, whose members hydrolyse ATP for protein export and lack an Fo partner.
    supported_by:
    - reference_id: PMID:8943245
      supporting_text: The activity was not affected by inhibitors of the F-, V- or
        P-type ATPases
    - reference_id: PMID:21934659
      supporting_text: the export gate complex by itself is a proton-protein antiporter
    - reference_id: PMID:29946050
      supporting_text: FlhA has an ion channel activity, and the FlhA-FliJ interaction
        enables effective utilization of PMF for protein export
    - reference_id: PMID:21278755
      supporting_text: FliJ promotes the formation of FliI hexamer rings by binding
        to the center of the ring
- term:
    id: GO:0071973
    label: bacterial-type flagellum-dependent cell motility
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR020005
  review:
    summary: >-
      fliI mutants are non-flagellate and therefore non-motile. Swimming speed
      tracks export efficiency in catalytic mutants. FliI has no role in
      generating torque or in chemotaxis. Its effect on motility is entirely
      through building the flagellum.
    action: KEEP_AS_NON_CORE
    reason: >-
      Not wrong, since FliI is a component of the flagellar machine and motility
      needs it. But the direct process is flagellum assembly through type III
      export, and motility is a downstream consequence.
    supported_by:
    - reference_id: PMID:25531309
      supporting_text: In contrast, more than 80% of the fliI(E211D) mutant cells were
        motile, and their swimming speed was about 50% of the wild-type level
- term:
    id: GO:0008564
    label: protein-exporting ATPase activity
  evidence_type: IDA
  original_reference_id: PMID:29946050
  qualifier: enables
  review:
    summary: >-
      FliI hydrolyzes ATP to move flagellar export substrates into and through
      the type III export gate. In inverted-membrane-vesicle reconstitution with
      Salmonella components, ATP hydrolysis by FliI drove protein export even
      without PMF. In vivo, FliI's ATPase escorts and releases substrates and
      activates the gate.
    action: NEW
    reason: >-
      This is the most specific and informative MF for FliI, and it is missing
      from GOA for P26465. The GO definition covers ATP-hydrolysing enzymes of
      type III secretion. It is consistent with the sibling FliI reviews and with
      the export-ATPase EC 7.4.2.8.
    supported_by:
    - reference_id: PMID:29946050
      supporting_text: ATP hydrolysis by FliI can drive the protein export without
        PMF.
    - reference_id: PMID:10712687
      supporting_text: A soluble complex of at least three proteins (FliH, FliI and
        FliJ) bind the protein to be exported and then interact with the complex at
        the motor to deliver the protein, which is then exported in an ATP-dependent
        process mediated by FliI.
- term:
    id: GO:0120102
    label: bacterial-type flagellum secretion apparatus
  evidence_type: IDA
  original_reference_id: PMID:26916245
  qualifier: part_of
  review:
    summary: >-
