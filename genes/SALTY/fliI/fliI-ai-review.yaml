  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR000194
  - InterPro:IPR020003
  review:
    summary: >-
      FliI is a Walker-type P-loop ATPase (UniProt ATP-binding region 182-189).
      Purified FliI binds ATP. Mutating residues that correspond to F1-beta
      catalytic residues (K188, D272, Y363) abolishes flagellation.
    action: ACCEPT
