- id: file:SALTY/fliI/fliI-deep-research-falcon.md
  title: Falcon deep research report for Salmonella FliI
  findings: []
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Correctly identifies the target and the ATPase/export role. Primary papers
      were cached and cited instead wherever possible.
core_functions:
- description: >-
    Hexameric, ATP-hydrolyzing export ATPase of the flagellar type III protein
    export apparatus. With FliH and FliJ it escorts axial flagellar subunits and
    their chaperones to the FlhA-FlhB docking platform. It uses ATP hydrolysis
    to release the escort and to activate the PMF-driven export gate through
    FliJ-FlhA, which helps enforce export order during flagellum assembly.
  molecular_function:
    id: GO:0008564
    label: protein-exporting ATPase activity
  directly_involved_in:
  - id: GO:0044780
    label: bacterial-type flagellum assembly
  - id: GO:0030254
    label: protein secretion by the type III secretion system
  locations:
  - id: GO:0005737
    label: cytoplasm
  - id: GO:0120102
    label: bacterial-type flagellum secretion apparatus
  in_complex:
    id: GO:0030257
    label: type III protein secretion system complex
  supported_by:
  - reference_id: PMID:29946050
    supporting_text: ATP hydrolysis by FliI can drive the protein export without
      PMF.
  - reference_id: PMID:21934659
    supporting_text: FliI ATPase forms a complex with FliH and FliJ and escorts export
      substrates from the cytoplasm to the export gate complex
  - reference_id: PMID:8943245
    supporting_text: It had an ATPase activity of 0.16 s-1 at 25 degrees C and pH
      7, and a Km for ATP of 0.3 mM; Mg2+ was required.
proposed_new_terms: []
suggested_questions:
- question: >-
    PANTHER:PTN008558586, which carries the GO:0046933 and GO:0045259 IBDs, is a
    duplication node. Its children are the FliI/SctN type III ATPase clade
    (PTN000390097; SF9/SF62/SF81, including P26465 in SF81) and the F1-beta clade
    (PTN008558588), and all seeds are F1-beta subunits. Should the IBDs be moved
    down to PTN008558588, or should an IRD/NOT be placed at PTN000390097? About
    312 proteins receive these IBAs through this node, including every FliI and
    SctN.
- question: >-
    Should UniProt rename P26465 from "Flagellum-specific ATP synthase" (EC
    7.1.2.2, H+-transporting) to "Flagellar export ATPase FliI" with EC 7.4.2.8?
    Should it also drop the 1991 "proton translocase involved in local circuits"
    hypothesis from the FUNCTION comment?
- question: >-
    Does the FliI6-FliJ ring actually rotate FliJ during ATP hydrolysis at the
    export gate, as the F1-like architecture suggests? And how does this couple
    to FlhA remodelling and substrate unfolding?
suggested_experiments:
- description: >-
    Use single-molecule rotation assays (gold-bead or high-speed AFM) on
    FliI6-FliJ rings to test whether FliJ rotates during ATP hydrolysis, and
    whether the ring can be driven backwards (no evidence of ATP synthesis is
    expected).
  experiment_type: single-molecule biophysics
- description: >-
    Measure proton flux across the membrane in inverted vesicles containing the
    export gate, with and without FliH/FliI/FliJ and catalytic FliI mutants, to
    confirm that FliI itself makes no contribution to proton conduction.
  experiment_type: reconstituted membrane transport assay
