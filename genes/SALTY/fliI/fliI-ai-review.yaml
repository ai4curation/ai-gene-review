  original_reference_id: GO_REF:0000120
  qualifier: located_in
  supporting_entities:
  - InterPro:IPR005714
  - UniProtKB-SubCell:SL-0086
  review:
    summary: >-
      FliI is a soluble protein with no transmembrane segment. It exists as a
      cytoplasmic FliH2-FliI complex and as a FliI6 ring bound within the
      basal-body C ring at the cytoplasmic face of the export gate. It also
