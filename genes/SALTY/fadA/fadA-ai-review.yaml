  review:
    action: UNDECIDED
    summary: Target participation in phenylacetate catabolism is unresolved.
    reason: The GOA row names PTN001823071, but the frozen family PAINT snapshot does not contain this
      exact phenylacetate assertion. FadA's established fatty-acid role and the presence of a dedicated
      PaaJ enzyme do not demonstrate exclusion from phenylacetate metabolism. Without target-specific
      participation or exclusion evidence, neither a positive core assignment nor a categorical propagation
      defect is justified. Donor count is not evidence against a PAINT assertion.
    supported_by:
