id: P0A2H7
gene_symbol: fadA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: FadA is the beta-subunit 3-ketoacyl-CoA thiolase of the cytoplasmic FadBA fatty acid oxidation
  complex in Salmonella Typhimurium LT2. It catalyzes CoA-dependent cleavage of a 3-oxoacyl-CoA to acetyl-CoA
  and an acyl-CoA shortened by two carbons. LT2 FadBA cooperates with LT2 FadE to improve intermediate
  clearance in E. coli gene-exchange experiments; these experiments do not identify a separate FadA-specific
  rate advantage or establish the fate of every substrate under all conditions.
