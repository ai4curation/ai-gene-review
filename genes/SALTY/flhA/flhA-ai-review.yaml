  title: An energy transduction mechanism used in bacterial flagellar type III protein export.
  findings:
  - statement: FliJ-FlhA binding, supported by FliH/FliI, activates efficient membrane-potential-driven
      flagellar protein export.
    supporting_text: a specific binding of FliJ with an export gate membrane protein, FlhA, is brought
      about by the FliH-FliI complex, which turns the export gate into a highly efficient, Δψ-driven protein
      export apparatus.
  reference_review:
    review_notes: Native Salmonella SJW backgrounds, tagged interactions, deletions and suppressors are
      distinguished. The experiments support binding-dependent export activation; they are not all native
      LT2 measurements.
- id: PMID:26943926
  title: The Bacterial Flagellar Type III Export Gate Complex Is a Dual Fuel Engine That Can Use Both
    H+ and Na+ for Flagellar Protein Export.
  findings:
  - statement: FlhA ion conductance and conditional sodium coupling are distinguished from normal ATPase-containing
      export.
    supporting_text: We also show that FlhA has both H+ and Na+ channel activities.
  reference_review:
    review_notes: Separates normal ATPase-containing export from ATPase-deficient bypass and FlhA overexpression.
      Sodium-supported export is conditional; it is not a finding that the normal Salmonella motor is
      sodium driven.
core_functions:
- description: Conducts protons and supplies the cytoplasmic docking/activation platform of the flagellar
    protein exporter; proton-coupled export depends on the assembled gate and FliJ-mediated activation.
