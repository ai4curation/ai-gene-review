  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: FlhA is an integral inner-membrane component of the Salmonella flagellar type III protein
  export apparatus. Its membrane domain conducts coupling ions, while its cytoplasmic domain provides
  a docking and regulatory platform for export factors and chaperone-substrate complexes. FliJ binding
  promotes efficient membrane-potential-driven export. In the normal ATPase-containing apparatus proton
  coupling predominates; sodium-supported export and FlhA sodium conductance are demonstrated under ATPase-deficient
  or overexpression conditions. FlhA belongs to the protein export machinery, not the torque-generating
  flagellar stator.
