id: P26416
gene_symbol: fliK
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: FliK is a secreted regulator of hook length and export-substrate switching in the Salmonella
  flagellum. Its N-terminal region interacts with the hook/cap during secretion, while its C-terminal
  switch region acts on FlhB to change export from rod/hook substrates to filament substrates. Intermittent
  ruler passage couples the geometry of the growing hook to this switch. FliK is not the polymerized hook
  subunit and is not a torque-generating motor component.
