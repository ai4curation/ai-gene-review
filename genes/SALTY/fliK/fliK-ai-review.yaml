- id: GO_REF:0000002
  title: Gene Ontology annotation through association of InterPro records with GO terms
  findings: []
- id: GO_REF:0000033
  title: Annotation inferences using phylogenetic trees
  findings: []
- id: PMID:19732341
  title: Interaction of FliK with the bacterial flagellar hook is required for efficient export specificity
    switching.
  findings:
  - statement: FliK-FlhB interaction and transient hook contacts regulate export switching and hook length.
    supporting_text: FliK-FlhB interaction switches export specificity of the bacterial flagellar protein
      export apparatus to stop hook protein export at an appropriate timing for hook length control.
  reference_review:
    review_notes: Binding and switching experiments test FliK/FlgE/FlgD and mutant backgrounds. Transient
      ruler contact is distinct from FlgE structural membership; no universal hook length or complete
      native assembly is inferred from binding alone.
- id: PMID:21654632
  title: An infrequent molecular ruler controls flagellar hook length in Salmonella enterica.
  findings: []
  reference_review:
    review_notes: Abstract-only immutable cache supports the positive ruler mechanism. Detailed strain/construct
      assignments beyond the abstract require the primary full text and are not invented.
- id: PMID:29946050
  title: In Vitro Reconstitution of Functional Type III Protein Export and Insights into Flagellar Assembly.
  findings:
  - statement: Membrane-vesicle reconstruction directly supports export, FlgE hook assembly and FliK-dependent
      length control in defined conditions.
    supporting_text: Polyhooks with various lengths were produced without FliK, but with the increase
      of FliK concentration, the average length became shorter and the length distribution became narrower
  reference_review:
    review_notes: Direct inverted-membrane-vesicle transport and hook reconstruction, including defined
      energy conditions and FliK addition. This is not a demonstration that each purified component alone
      translocates protein or completes native flagellar assembly.
