gene_symbol: fadB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: FadB is the multifunctional alpha subunit of the cytoplasmic FadBA fatty acid oxidation complex
  in Salmonella Typhimurium LT2. Its hydratase and NAD-dependent (3S)-3-hydroxyacyl-CoA dehydrogenase
  domains perform consecutive beta-oxidation reactions; cis-3/trans-2 enoyl-CoA isomerization and hydroxyacyl-CoA
  epimerization provide additional substrate-processing activities. These individual reactions are supported
  by conserved FadB architecture and curated ortholog inference; LT2 fadBA gene-exchange experiments establish
  pathway contribution without assigning the efficiency difference to an individual FadB active site.
