id: P10503
gene_symbol: putA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: putA encodes the trifunctional proline utilization A protein (PutA) of Salmonella typhimurium,
  a 1320-residue homodimeric flavoenzyme. Its FAD-dependent proline dehydrogenase domain oxidises L-proline
  to 1-pyrroline-5-carboxylate, transferring electrons to membrane quinones, and its C-terminal NAD+-dependent
  L-glutamate gamma-semialdehyde dehydrogenase domain oxidises the semialdehyde to L-glutamate, allowing
  proline to be used as a carbon and nitrogen source. An N-terminal ribbon-helix-helix domain makes PutA
  the autogenous repressor of the divergent putA and putP genes. In the absence of proline PutA binds
  operator DNA in the control region in the cytoplasm; proline reduction of the FAD drives it to associate
  peripherally with the cytoplasmic face of the inner membrane, where it acts as an enzyme and the operon
  is derepressed.
