suggested_questions:
- question: Does PutA bind the put operators as a single dimer bridging sites via the curved control-region
    DNA loop, and how many operator sites are occupied in vivo in Salmonella?
- question: Should GO:0097054 L-glutamate biosynthetic process be used for catabolic enzymes whose product
    is glutamate, or should such rows be migrated to GO:0006562 following the GO:0010133 obsoletion?
- question: Is P5C channelled between the PRODH and GSALDH active sites of Salmonella PutA as shown for
    E. coli PutA?
suggested_experiments:
- description: Measure coupled proline-to-glutamate turnover and P5C channelling with purified P10503
    versus a GSALDH-dead variant.
  experiment_type: coupled enzyme kinetics
- description: Fluorescent-protein tagging of chromosomal PutA to follow cytoplasm-to-membrane relocalisation
    in live Salmonella upon proline addition.
  experiment_type: live-cell imaging
- description: ChIP-seq of PutA with and without proline to define in vivo operator occupancy and test
    for regulation beyond putA/putP.
