  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: EutD is a phosphate acetyltransferase of the Salmonella Typhimurium LT2 ethanolamine-utilization
  system. It reversibly interconverts acetyl-CoA plus inorganic phosphate and acetyl phosphate plus free
  CoA. In the catabolic direction, this supplies acetyl phosphate to acetate kinase and regenerates CoA
  for acetaldehyde oxidation. Genetic evidence places its function in the ethanolamine microcompartment
  and links its physiological importance to compartmentalized cofactor recycling.
