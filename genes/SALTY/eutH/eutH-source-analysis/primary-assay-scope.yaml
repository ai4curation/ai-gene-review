scope: LT2 derivatives were compared using in-frame deletions and a functional chromosomal EutH-Yfp fusion.
  Carbon-source growth, toxicity and whole-cell swelling support conditional substrate access. About 25
  micromolar uncharged ethanolamine is an assay-specific growth threshold, not a transporter Km or a universal
  species threshold. Standard growth used 41 mM total ethanolamine at pH 7.0; EutH-positive cells supported
  growth above about 3 micromolar uncharged substrate. No isolated EutH translocation or ion-coupling
  measurement is supplied.
exact_excerpts:
- All of the strains used in this study (Table 1 ) are derivatives of S. enterica serovar Typhimurium
  strain LT2.
- The EutH-Yfp fusion strain grew like the wild type
- Fluorescence microscopy revealed the localization of the EutH-Yfp protein near the cell periphery
- Mutants lacking EutH were impaired for growth at Eth 0 concentrations below about 25 μM.
- The growth ability of both wild-type and eutH mutant strains correlates with the external Eth 0 concentration.
