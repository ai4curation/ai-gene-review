core_functions:
- description: >-
    Inner-membrane ethanolamine facilitator that allows uncharged ethanolamine to
    enter the cell, making ethanolamine available to the eut pathway under
    conditions (low pH, low ethanolamine) where passive diffusion of the uncharged
    species is too slow to support growth.
  molecular_function:
    id: GO:0034228
    label: ethanolamine transmembrane transporter activity
  directly_involved_in:
  - id: GO:0034229
    label: ethanolamine transport
  locations:
