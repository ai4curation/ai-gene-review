    dark_aspect: MF_DARK
suggested_questions:
- question: Is EutH a facilitator (channel-like, driven only by the ethanolamine gradient) or does it
    couple ethanolamine uptake to the proton motive force?
  experts:
  - Bacterial membrane transport biochemists
- question: Does EutH have a substrate range beyond ethanolamine (for example other small amino alcohols),
    and is the EutH-like Bacillus subtilis protein YxeR a functional ethanolamine facilitator at all?
  experts:
  - Transporter substrate-specificity groups
suggested_experiments:
- hypothesis: EutH mediates ethanolamine translocation by itself, without a coupling ion.
  description: Purify EutH and reconstitute it into proteoliposomes, then measure radiolabelled ethanolamine
    uptake as a function of internal/external pH and of an imposed proton gradient or membrane potential;
    compare with uptake into protein-free liposomes to separate facilitated from passive diffusion.
  experiment_type: Transport assay in reconstituted proteoliposomes
- hypothesis: EutH delivers ethanolamine to the eut microcompartment pathway only at limiting uncharged-ethanolamine
    concentrations.
  description: Measure initial ethanolamine uptake rates and intracellular ethanolamine pools in wild-type
    and non-polar eutH deletion strains across a pH and ethanolamine concentration matrix, with and without
    vitamin B12, to map where EutH-dependent flux exceeds passive influx.
  experiment_type: Quantitative uptake and metabolite measurement
