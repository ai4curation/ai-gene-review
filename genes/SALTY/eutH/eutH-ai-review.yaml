- id: PMID:3045078
  title: Ethanolamine utilization in Salmonella typhimurium.
  findings:
  - statement: Ethanolamine supports growth as sole carbon and nitrogen source when vitamin B12 is supplied;
      the eut genes form one B12/ethanolamine-induced operon.
    supporting_text: Ethanolamine can serve as the sole source of carbon and nitrogen for Salmonella typhimurium
      if vitamin B12 is present to serve as a cofactor.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; used for the pathway and operon context of eutH, not for EutH-specific
      function.
- id: PMID:10464203
  title: The 17-gene ethanolamine (eut) operon of Salmonella typhimurium encodes five homologues of carboxysome
    shell proteins.
  findings:
  - statement: Only six eut genes are needed for aerobic ethanolamine use under standard conditions; eutH
      is among the genes with no phenotype in those tests.
    supporting_text: Nonpolar insertion and deletion mutations made with the Tn10-derived transposable
      element T-POP showed that at least 10 of the 11 previously undetected eut genes have no Eut phenotype
      under the conditions tested.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only; establishes that the eutH requirement is conditional, which is why the
      pH-dependent phenotype was needed to reveal its function.
- id: PMID:15466042
  title: 'A pH-sensitive function and phenotype: evidence that EutH facilitates diffusion of uncharged
    ethanolamine in Salmonella enterica.'
  findings:
  - statement: EutH facilitates diffusion of uncharged ethanolamine and is required when the uncharged
      species falls below about 25 micromolar; a EutH-Yfp fusion shows EutH is a membrane protein.
    supporting_text: When a lowered pH and/or ethanolamine concentration reduced the Eth0 concentration
      below 25 microM, EutH was needed to facilitate diffusion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal cache remains abstract-only after refresh, but authoritative PMC full text was
      acquired separately and scoped excerpts are preserved. All experimental strains are LT2 derivatives.
      In-frame deletions, toxicity, cell-swelling assays and functional EutH-Yfp localization support
      the conditional facilitator model; the growth threshold is not a transport Km.
