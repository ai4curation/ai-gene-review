- term:
    id: GO:0034229
    label: ethanolamine transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR007441
  review:
    summary: The process counterpart of the transporter activity - EutH-mediated entry of ethanolamine
      into the cell.
    action: ACCEPT
    reason: EutH itself performs the substrate-entry step supported by LT2 conditional growth, toxicity
      and membrane-localization evidence. Its requirement depends on uncharged ethanolamine availability;
      uptake is sufficient without EutH under permissive conditions. Macrophage experiments in PMID29531136
      used the separate SL1344 strain and provide comparative physiological support, not a direct LT2
      infection assay or an isolated transporter-flux measurement.
    supported_by:
    - reference_id: PMID:15466042
      supporting_text: It is suggested that EutH facilitates diffusion of Eth0.
    - reference_id: PMID:29531136
      supporting_text: These findings suggested a model in which EutH facilitates diffusion of ethanolamine
        into the bacterial cell in acidic environments.
    - reference_id: PMID:7868611
      supporting_text: The hydrophobic protein encoded by the eutH gene possesses some characteristics
        of bacterial permeases and might therefore be involved in the transport of ethanolamine.
- term:
    id: GO:0046336
    label: ethanolamine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00560
  review:
    summary: EutH conditionally participates in ethanolamine catabolism by delivering substrate to the
      degradative pathway.
    action: ACCEPT
    reason: GO:0046336 covers the chemical reactions and pathways leading to ethanolamine breakdown. The
      existing UniPathway mapping places EutH in that pathway, and LT2 physiology supports a specific
      substrate-entry role when uncharged ethanolamine is limiting. EutH itself performs that access step,
      rather than being merely a consumed substrate or a transcriptional regulator; a nonenzymatic role
      can contribute to the broader pathway. Thus the existing process claim is retained as conditional
      core participation. It does not assert that EutH cleaves ethanolamine, that every growth condition
      requires EutH, or that growth alone measures purified-transporter flux. Precise transport activity
      and process remain the primary mechanistic claims.
    supported_by:
    - reference_id: PMID:15466042
      supporting_text: When a lowered pH and/or ethanolamine concentration reduced the Eth0 concentration
        below 25 microM, EutH was needed to facilitate diffusion.
    - reference_id: file:SALTY/eutH/eutH-source-analysis/primary-assay-scope.yaml
      supporting_text: Mutants lacking EutH were impaired for growth at Eth 0 concentrations below about
        25 μM.
