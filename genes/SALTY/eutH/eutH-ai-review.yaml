  title: 'Conserving a volatile metabolite: a role for carboxysome-like organelles in
    Salmonella enterica.'
  findings: []
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Abstract-only; concerns the eut shell proteins and acetaldehyde
