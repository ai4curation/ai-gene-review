  review:
    summary: InterPro2GO mapping from the EutH family signature IPR007441; the activity is independently
      supported by the Salmonella genetics and physiology of eutH.
    action: ACCEPT
    reason: This is the core molecular function. eutH mutants cannot use ethanolamine when the concentration
      of the uncharged species falls below about 25 micromolar (low pH or low ethanolamine), EutH confers
      ethanolamine toxicity as a transporter would, and the protein is in the membrane it must act across;
      the conclusion drawn is that EutH facilitates diffusion of uncharged ethanolamine. GO:0034228 is
      defined as enabling transfer of ethanolamine from one side of a membrane to the other, which covers
      facilitated diffusion as well as active transport, so it is the right term at the right granularity.
    supported_by:
