- id: PMID:29531136
  title: The Ethanolamine Permease EutH Promotes Vacuole Adaptation of Salmonella enterica and Listeria
    monocytogenes during Macrophage Infection.
  findings:
  - statement: SL1344 EutH promotes survival and replication in acidic phagosomes; neutralization removes
      its requirement. This is a strain-specific comparator for LT2.
    supporting_text: Furthermore, in agreement with EutH being important in the acidic environment, neutralization
      of the vacuole abolished the requirement for EutH.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The normal cache is abstract-only. Independently acquired full PMC text explicitly uses
      Salmonella SL1344 derivatives (and Listeria 10403S), not LT2. This supports comparative acid-dependent
      access, not a family-wide transport guarantee or a direct assay of LT2 infection.
