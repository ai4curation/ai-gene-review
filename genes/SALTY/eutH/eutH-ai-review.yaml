id: P41796
gene_symbol: eutH
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: EutH is a polytopic inner (cytoplasmic) membrane protein with about eleven predicted transmembrane
  helices, encoded in the 17-gene eut operon that lets Salmonella enterica use ethanolamine as a sole
  source of carbon, nitrogen and energy. It is the founding member of the ethanolamine facilitator (EutH)
  family and acts as an ethanolamine permease that facilitates diffusion of the uncharged form of ethanolamine
  across the cytoplasmic membrane. Because the pKa of ethanolamine is about 9.5, the uncharged species
  is scarce at acidic pH; at pH 7.0 with high ethanolamine the passive influx of uncharged ethanolamine
  suffices and eutH mutants grow normally, but when lowered pH or lowered ethanolamine concentration brings
  the uncharged ethanolamine concentration below about 25 micromolar in the tested LT2 growth conditions,
  EutH becomes necessary for ethanolamine utilization. EutH also contributes to ethanolamine toxicity
  under some conditions, and studies of the separate Salmonella SL1344 strain associate EutH with survival
  in acidified macrophage vacuoles and dissemination to peripheral organs; vacuole neutralization removes
  that conditional requirement.
