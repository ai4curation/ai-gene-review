- term:
    id: GO:0034228
    label: ethanolamine transmembrane transporter activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: enables
  supporting_entities:
  - InterPro:IPR007441
  review:
    summary: InterPro2GO mapping from the EutH family signature IPR007441; the activity
      is independently supported by the Salmonella genetics and physiology of eutH.
    action: ACCEPT
    reason: >-
      This is the core molecular function. eutH mutants cannot use ethanolamine when
      the concentration of the uncharged species falls below about 25 micromolar
      (low pH or low ethanolamine), EutH confers ethanolamine toxicity as a
      transporter would, and the protein is in the membrane it must act across; the
      conclusion drawn is that EutH facilitates diffusion of uncharged ethanolamine.
      GO:0034228 is defined as enabling transfer of ethanolamine from one side of a
      membrane to the other, which covers facilitated diffusion as well as active
      transport, so it is the right term at the right granularity.
    supported_by:
    - reference_id: PMID:15466042
      supporting_text: When a lowered pH and/or ethanolamine concentration reduced
        the Eth0 concentration below 25 microM, EutH was needed to facilitate diffusion.
    - reference_id: PMID:15466042
      supporting_text: It is suggested that EutH facilitates diffusion of Eth0.
    - reference_id: PMID:15466042
      supporting_text: As predicted for a transporter, EutH contributed to the toxicity
        of ethanolamine seen under some conditions
    - reference_id: file:SALTY/eutH/eutH-uniprot.txt
      supporting_text: Reaction=ethanolamine(in) = ethanolamine(out)
      record_section:
      - CC:CATALYTIC ACTIVITY
- term:
    id: GO:0034229
    label: ethanolamine transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR007441
  review:
    summary: >-
      The process counterpart of the transporter activity - EutH-mediated entry of
      ethanolamine into the cell.
    action: ACCEPT
    reason: >-
      EutH itself performs the translocation step, so it does the work of ethanolamine
      transport rather than merely being required for it. The requirement is
      conditional on the availability of uncharged ethanolamine, not on the mechanism,
      and holds in vivo in the acidified macrophage vacuole as well as in culture at
      low pH. Core process.
    supported_by:
    - reference_id: PMID:15466042
      supporting_text: It is suggested that EutH facilitates diffusion of Eth0.
    - reference_id: PMID:29531136
      supporting_text: These findings suggested a model in which EutH facilitates diffusion
        of ethanolamine into the bacterial cell in acidic environments.
    - reference_id: PMID:7868611
      supporting_text: The hydrophobic protein encoded by the eutH gene possesses some
        characteristics of bacterial permeases and might therefore be involved in the
        transport of ethanolamine.
- term:
    id: GO:0046336
    label: ethanolamine catabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000041
  qualifier: involved_in
  supporting_entities:
  - UniPathway:UPA00560
  review:
    summary: UniPathway mapping of the ethanolamine degradation pathway (UPA00560) to
      the ethanolamine catabolic process, on the basis that eutH belongs to the eut
      operon.
    action: KEEP_AS_NON_CORE
    reason: >-
      Defensible but peripheral. The degradative chemistry is done by ethanolamine
      ammonia-lyase (EutBC) and the downstream aldehyde enzymes; EutH only delivers the
      substrate across the membrane, so it supplies the pathway rather than catalysing
      a step of it. The eut operon context is real, and eutH mutants fail to grow on
      ethanolamine at low pH, but growth failure is necessity, not participation in
      the breakdown reactions. It is retained as pathway context while ethanolamine
      transport and ethanolamine transmembrane transporter activity carry the core
      claims.
    supported_by:
    - reference_id: PMID:3045078
      supporting_text: Ethanolamine can serve as the sole source of carbon and nitrogen
        for Salmonella typhimurium if vitamin B12 is present to serve as a cofactor.
    - reference_id: PMID:15466042
      supporting_text: The eutH gene is part of an operon that allows Salmonella enterica
        to use ethanolamine as a sole source of nitrogen, carbon, and energy.
    - reference_id: PMID:15466042
      supporting_text: These mutants fail to use ethanolamine at a low pH.
