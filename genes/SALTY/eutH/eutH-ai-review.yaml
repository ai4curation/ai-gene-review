- id: PMID:29531136
  title: The Ethanolamine Permease EutH Promotes Vacuole Adaptation of Salmonella enterica
    and Listeria monocytogenes during Macrophage Infection.
  findings:
  - statement: EutH promotes survival and replication in the acidic phagosome, and the
      requirement disappears when the vacuole is neutralized.
    supporting_text: Furthermore, in agreement with EutH being important in the acidic
      environment, neutralization of the vacuole abolished the requirement for EutH.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only (PMC5913834); confirms the acid-dependent transport
      model in vivo in both Salmonella and Listeria, supporting the family-wide scope
      of the EutH function.
