  review:
    summary: PAINT IBD of generic NAD+-dependent, non-acylating aldehyde dehydrogenase
      activity at PTN000192666, the deep ALDH node of PTHR11699, inherited by EutE.
    action: MODIFY
    reason: >-
      The node placement is defensible for the family's classical branches, but the
      reaction it asserts is not the one EutE runs. GO:0004029 is the hydrolytic reaction
      that yields a free carboxylate, whereas EutE is CoA-acylating and yields a thioester
      (acetaldehyde + NAD+ + CoA = acetyl-CoA + NADH + H+, EC 1.2.1.10, measured on the
      purified enzyme in both directions). The PTHR11699 family review reaches the same
      conclusion, noting that the family also holds CoA-acylating EutE-type enzymes whose
      chemistry this term does not describe, and the local PANTHER member index places
      P41793 in the EutE-specific subfamily PTHR11699:SF68. This is a lateral correction
      rather than a refinement, so the replacement is not a descendant of the original
      term; GO:0008774 is already carried by this gene on EXP and IEA evidence, which is
      what this row should have asserted.
    proposed_replacement_terms:
    - id: GO:0008774
      label: acetaldehyde dehydrogenase (acetylating, NAD+) activity
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - FUNCTIONAL_DIVERGENCE
      source_entities:
      - source_id: PANTHER:PTN000192666
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Deep ALDH node seeded by classical non-acylating aldehyde dehydrogenases
          from bacteria, fungi, plants and animals. The NAD+-dependent oxidation they
          share is real, but the acylating EutE/PduP branch below the node makes acetyl-CoA
          instead of a carboxylate, so the cofactor-and-water reaction does not transfer.
