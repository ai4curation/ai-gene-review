suggested_questions:
- question: GO has no term for the lumen of a bacterial microcompartment, yet the Eut BMC
    is functionally polarised, with EutBC outside and EutE, EutD and EutG inside. Would a
    bacterial microcompartment lumen term, as a part of GO:0031469, be accepted, so that
    lumenal enzymes can be distinguished from shell proteins?
  experts:
  - GO cellular component ontology editors
  - bacterial microcompartment structural biologists
- question: Does EutE have a structural role in Eut microcompartment assembly or
    maintenance, as UniProt suggests on the basis that a eutE deletion permits growth on
    acetate, or is that phenotype entirely explained by loss of its catalytic step and the
    resulting cofactor imbalance?
  experts:
  - Salmonella eut operon genetics groups
- question: Is the reverse acetyl-CoA reductase direction of EutE used physiologically in
    Salmonella, for example to buffer acetyl-CoA or NADH inside the compartment, or is it
    only accessible in vitro and in engineered strains?
  experts:
  - bacterial central metabolism groups
suggested_experiments:
- hypothesis: EutE is catalytically active only inside the microcompartment lumen, so a
    targeting-sequence deletion that keeps the catalytic domain intact will support growth
    on ethanolamine poorly despite normal in vitro activity.
  description: Replace chromosomal eutE with a variant lacking residues 1 to 21, or
    carrying substitutions in the EutS-binding face, then compare ethanolamine growth rate,
    acetaldehyde release and purified-enzyme specific activity against the wild type.
  experiment_type: Targeted mutagenesis with growth and enzyme assays
- hypothesis: The EutE active site is adapted to the compartment's private CoA and NAD
    pools, so its kinetic parameters for CoA and NAD+ differ from those of cytoplasmic
    acylating aldehyde dehydrogenases such as the Salmonella PduP paralog.
  description: Measure KM and kcat for acetaldehyde, CoA and NAD+ side by side for purified
    EutE (P41793) and PduP (Q9XDN1), both classified in PTHR11699:SF68, under matched
    conditions.
  experiment_type: Comparative steady-state enzymology
