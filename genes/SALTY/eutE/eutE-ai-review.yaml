- term:
    id: GO:0031469
    label: bacterial microcompartment
  evidence_type: EXP
  original_reference_id: PMID:27450681
  qualifier: located_in
  review:
    summary: The EutE N-terminal signal sequence (residues 1-21) binds a helix of the
      shell protein EutS and targets cargo into the interior of Eut nanocompartments.
    action: MODIFY
    reason: >-
      Direct experimental evidence of BMC targeting through a defined interaction with
      the Eut shell protein EutS, which UniProt reads as placing the protein inside the
      compartment, and which the independent genetic analysis of cofactor pools agrees
      with by placing EutE in the lumen while EutBC stays outside. The claim is sound but
      the generic bacterial microcompartment term is less specific than the evidence:
      the compartment is the ethanolamine-specific one, so the row is refined to its
      is_a child GO:0031471 ethanolamine degradation polyhedral organelle, matching the
      E. coli EutB/EutC reviews. Whether EutE sits in the lumen rather than in the shell
      is a separate question that GO cannot yet express; it stays as a
      suggested_question. Core location.
    proposed_replacement_terms:
    - id: GO:0031471
      label: ethanolamine degradation polyhedral organelle
    supported_by:
    - reference_id: PMID:27450681
      supporting_text: Furthermore, we show that a second signal sequence EutE1-21
        interacts specifically with the same helix on EutS.
    - reference_id: PMID:23585538
      supporting_text: The model predicts that EutBC (ethanolamine-ammonia lyase) lies
        outside the compartment, using external coenzyme B12 and injecting its product,
        acetaldehyde, into the lumen, where it is degraded by the EutE, EutD, and EutG
        enzymes using private pools of CoA and NAD.
