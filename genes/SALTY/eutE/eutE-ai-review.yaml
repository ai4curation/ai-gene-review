- id: PMID:21803884
  title: Coproduction of acetaldehyde and hydrogen during glucose fermentation by
    Escherichia coli.
  findings:
  - statement: Purified recombinant Salmonella EutE has acetaldehyde dehydrogenase
      activity of 68.07 umol/min/mg and acetyl-CoA reductase activity of 49.23
      umol/min/mg, so the enzyme runs the acylating reaction in both directions.
    supporting_text: In vitro assays showed that this enzyme had both acetaldehyde
      dehydrogenase activity (68.07 ± 1.63 μmol min(-1) mg(-1)) and the desired acetyl-CoA
      reductase activity (49.23 ± 2.88 μmol min(-1) mg(-1)).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only, but the abstract itself reports the purification
      and the two specific activities, and UniProt cites this paper with ECO:0000269 for
      the reaction, the cofactor preference and the kinetics. The paper is a metabolic
      engineering study in E. coli, yet the enzyme characterised is the Salmonella EutE
      protein (SeEutE) of this entry.
- id: PMID:23585538
  title: Evidence that a metabolic microcompartment contains and recycles private cofactor
    pools.
  findings:
  - statement: Genetic tests place EutE, EutD and EutG inside the Eut microcompartment,
      using compartment-local CoA and NAD pools, while EutBC remains outside and injects
      acetaldehyde into the lumen.
    supporting_text: The model predicts that EutBC (ethanolamine-ammonia lyase) lies
      outside the compartment, using external coenzyme B12 and injecting its product,
      acetaldehyde, into the lumen, where it is degraded by the EutE, EutD, and EutG
      enzymes using private pools of CoA and NAD.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Not a GOA reference; fetched because UniProt cites it for the
      microcompartment location and the disruption phenotype. Cached abstract only, and
      the model it proposes is explicitly inferential, so it is used as corroboration of
      the lumenal location rather than as its primary evidence.
- id: PMID:27450681
  title: Encapsulation of multiple cargo proteins within recombinant Eut nanocompartments.
  findings:
  - statement: The EutE N-terminal signal sequence (residues 1-21) competes with the EutC
      signal sequence for the same helix of the shell protein EutS and targets cargo to the
      interior of Eut nanocompartments.
    supporting_text: Furthermore, we show that a second signal sequence EutE1-21 interacts
      specifically with the same helix on EutS.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only. UniProt cites it with ECO:0000269 for the BMC
      location, the EutS interaction and the targeting region, which is the basis of the
      location rows here.
- id: PMID:3045078
  title: Ethanolamine utilization in Salmonella typhimurium.
  findings:
  - statement: The eut genes form a single transcription unit induced by ethanolamine plus
      B12, and the genetic map identified mutations affecting the second enzyme of the
      pathway, acetaldehyde dehydrogenase.
    supporting_text: Included in the map are mutations which affect ethanolamine ammonia
      lyase, the first degradative enzyme, and mutations which affect the second enzyme in
      the pathway, acetaldehyde dehydrogenase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only. The original genetic analysis of the operon and
      the source of the GO:0006091 TAS row; it establishes the pathway role but not the
      acylating chemistry.
- id: PMID:7868611
  title: Ethanolamine utilization in Salmonella typhimurium nucleotide sequence, protein
    expression, and mutational analysis of the cchA cchB eutE eutJ eutG eutH gene cluster.
  findings:
  - statement: eutE mutants cannot use ethanolamine as a carbon source and are impaired in
      using it as a nitrogen source, and EutE was deduced to be the acetaldehyde
      dehydrogenase that converts acetaldehyde into acetyl-CoA.
    supporting_text: Mutations in eutE or eutG completely abolished the ability of mutants
      to utilize ethanolamine as a carbon source and reduced the ability to utilize
      ethanolamine as a nitrogen source.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only. Sequenced the gene cluster and provided the
      mutational evidence for the pathway role; its assignment of acetyl-CoA formation to
      EutE was a sequence-based deduction, later confirmed enzymologically in
      PMID:21803884.
- id: PMID:2656649
  title: Functions required for vitamin B12-dependent ethanolamine utilization in
    Salmonella typhimurium.
  findings:
  - statement: Complementation analysis defined six eut genes, three of which encode the
      known pathway enzymes, with eutE encoding acetaldehyde dehydrogenase.
    supporting_text: 'Three of these genes encode enzymes known to be involved in
      degradation of ethanolamine: ethanolamine ammonia-lyase (eutB and eutC) and
      acetaldehyde dehydrogenase (eutE).'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Not a GOA reference; fetched because UniProt cites it for the gene name
      and the disruption phenotype. Cached abstract only.
