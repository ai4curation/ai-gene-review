suggested_questions:
- question: Can GO distinguish the cargo interior of bacterial microcompartments from the protein shell?
    Modern LT2 evidence supports EutBC and EutE encapsulation; the older model placing EutBC outside should
    not define the ontology distinction.
  experts:
  - GO cellular component ontology editors
  - bacterial microcompartment structural biologists
- question: Does EutE have a structural role in Eut microcompartment assembly or maintenance, as UniProt
    suggests on the basis that a eutE deletion permits growth on acetate, or is that phenotype entirely
    explained by loss of its catalytic step and the resulting cofactor imbalance?
  experts:
  - Salmonella eut operon genetics groups
- question: Is the reverse acetyl-CoA reductase direction of EutE used physiologically in Salmonella,
    for example to buffer acetyl-CoA or NADH inside the compartment, or is it only accessible in vitro
    and in engineered strains?
  experts:
  - bacterial central metabolism groups
suggested_experiments:
- hypothesis: EutE encapsulation improves native pathway performance without being required for intrinsic
    purified-enzyme activity.
  description: Compare chromosomal EutE targeting-peptide variants with wild type for EutQ/cargo association,
    compartment incorporation, ethanolamine growth, acetaldehyde release and purified-enzyme activity.
    This separates targeting effects from catalytic defects and builds on the LT2 EutE2–21 deletion experiments.
  experiment_type: Targeted mutagenesis with growth and enzyme assays
- hypothesis: The EutE active site is adapted to the compartment's private CoA and NAD pools, so its kinetic
    parameters for CoA and NAD+ differ from those of cytoplasmic acylating aldehyde dehydrogenases such
    as the Salmonella PduP paralog.
  description: Measure KM and kcat for acetaldehyde, CoA and NAD+ side by side for purified EutE (P41793)
    and PduP (Q9XDN1), both classified in PTHR11699:SF68, under matched conditions.
  experiment_type: Comparative steady-state enzymology
