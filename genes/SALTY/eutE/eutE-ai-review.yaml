id: P41793
gene_symbol: eutE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: >-
  EutE is the CoA-acylating acetaldehyde dehydrogenase of the Salmonella ethanolamine
  utilization (eut) operon, catalysing the second step of ethanolamine catabolism:
  acetaldehyde + NAD+ + CoA = acetyl-CoA + NADH + H+ (EC 1.2.1.10). Unlike the
  non-acylating aldehyde dehydrogenases that dominate its protein family, it makes a
  thioester rather than a free carboxylic acid, so its product feeds straight into central
  metabolism, where acetyl-CoA from ethanolamine enters the glyoxylate bypass and the TCA
  cycle. The upstream step is performed by the cobalamin-dependent ethanolamine
  ammonia-lyase EutBC, and the whole operon is induced only when both ethanolamine and
  adenosylcobalamin are present. Purified EutE works in both directions, with a strong
  preference for NAD+ over NADP+, and the reverse acetyl-CoA reductase activity has been
  exploited to make acetaldehyde in engineered E. coli. EutE acts inside the Eut bacterial
  microcompartment: its first twenty or so residues are a targeting sequence that binds a
  helix of the shell protein EutS and carries the protein, and heterologous cargo, into the
  lumen, where acetaldehyde injected by external EutBC is consumed using compartment-local
  pools of CoA and NAD. Loss of eutE abolishes growth on ethanolamine as a carbon source,
  reduces its use as a nitrogen source, and causes increased release of volatile
  acetaldehyde.
