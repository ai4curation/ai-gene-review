gene_symbol: eutE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: EutE is the CoA-acylating acetaldehyde dehydrogenase of the Salmonella Typhimurium LT2 ethanolamine-utilization
  system. It converts acetaldehyde, NAD+ and CoA into acetyl-CoA, NADH and a proton; purified recombinant
  Salmonella EutE also catalyzes the reverse reaction. EutE is encapsulated with the EutBC lyase in ethanolamine
  microcompartments, where its oxidative step supplies acetyl-CoA and is coupled physiologically to cofactor
  recycling. Its N-terminal encapsulation peptide participates in EutQ-mediated cargo association in native
  LT2; EutS binding and reporter targeting have also been demonstrated in recombinant nanocompartments.
  The downstream acetyl-CoA supports central metabolism, while the physiological importance of reverse
  EutE flux remains unresolved.
