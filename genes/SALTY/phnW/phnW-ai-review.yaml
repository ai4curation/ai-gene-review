taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: PhnW is the pyridoxal-phosphate-dependent 2-aminoethylphosphonate transaminase of Salmonella typhimurium LT2. It transfers the amino group of 2-aminoethylphosphonate to pyruvate, generating phosphonoacetaldehyde and L-alanine. The phosphonoacetaldehyde is subsequently cleaved by PhnX to release phosphate. PhnW is a soluble homodimer with a substrate-specialized aminotransferase active site; its expression is induced during phosphate limitation through the Pho regulon.
