core_functions:
- description: >-
    Glycerophospholipid:cholesterol acyltransferase acting on the host membrane. Once
    translocated and bound to GTP-loaded RhoA, SseJ removes the sn-1 acyl chain of a
    glycerophospholipid such as phosphatidylcholine and esterifies cholesterol with it,
    producing lysophosphatidylcholine and a cholesteryl ester. This lowers free cholesterol
    in the vacuolar and endosomal membranes of the infected cell and raises its cholesteryl
    ester and lipid-droplet content.
  molecular_function:
    id: GO:0004607
    label: phosphatidylcholine-sterol O-acyltransferase activity
  locations:
