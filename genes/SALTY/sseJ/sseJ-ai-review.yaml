  review:
    summary: Right product, wrong reaction - GO:0034736 is the CoA-dependent SOAT/ACAT
      reaction, and SseJ uses a phospholipid as acyl donor.
    action: MODIFY
    reason: >-
      GO:0034736 is defined as "acyl-CoA + cholesterol = a cholesterol ester + CoA". The
      cited experiments contain no coenzyme A: liposomes of DOPC, cholesterol and oleic acid
      were incubated with purified SseJ and RhoA-GTP-gamma-S, and the acyl group transferred
