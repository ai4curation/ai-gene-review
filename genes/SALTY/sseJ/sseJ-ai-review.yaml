id: Q9FD10
gene_symbol: sseJ
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: >-
  SseJ is a Salmonella pathogenicity island 2 (SPI-2) type III secretion system effector of
  Salmonella enterica serovar Typhimurium. Its N-terminal region carries the translocation
  signal and its C-terminal region is a GDSL/SGNH lipolytic-enzyme domain with a
  Ser151-Asp247-His384 catalytic triad. After translocation across the vacuolar membrane
  SseJ is retained on the cytoplasmic face of the Salmonella-containing vacuole and
  subsequently redistributes along Salmonella-induced filaments and other late
  endosomal/lysosomal membranes. There it is bound and allosterically activated by the
  GTP-loaded form of the host small GTPase RhoA (and, more weakly, RhoC), which SseJ senses
  without acting as a GEF or GAP. Activated SseJ is a glycerophospholipid:cholesterol
  acyltransferase: it cleaves the sn-1 acyl chain of a glycerophospholipid such as
  phosphatidylcholine and transfers it to cholesterol, producing lysophosphatidylcholine and
  a cholesteryl ester. It also hydrolyses simple carboxylic esters in vitro, at a rate about
  ten-fold below that of the Aeromonas salmonicida acyltransferase, but esterification is
  the dominant activity in host cells. By esterifying membrane cholesterol SseJ lowers free
  cholesterol in host membranes, raises cholesteryl ester and lipid-droplet content of
  infected cells, antagonizes the cholesterol-dependent membrane association of the effector
  SifA, down-regulates Salmonella-induced filament formation, and cooperates with SifA to
  drive endosomal tubulation. Catalytic-triad substitutions do not affect translocation or
  localization but abolish these cellular phenotypes and attenuate the bacterium in mice,
  so the acyltransferase chemistry, not mere presence of the protein, is what makes SseJ a
  virulence factor.
