    RhoC) at a surface that includes the regulatory switch regions, without acting as a GEF
    or GAP. The interaction both recruits the effector to the vacuolar and endosomal
    membranes and allosterically activates its acyltransferase activity, coupling the
    enzyme's output to the activation state of a host GTPase.
