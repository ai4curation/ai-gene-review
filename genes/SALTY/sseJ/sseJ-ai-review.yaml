- term:
    id: GO:0008610
    label: lipid biosynthetic process
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN005219546
  - UniProtKB:O33407
  review:
    summary: >-
      The claim is true of SseJ on its own direct evidence - it catalyses the acyl-transfer
      step that forms cholesteryl ester - even though the IBD that delivered it is not
      sound for its clade.
    action: ACCEPT
    reason: >-
      Two separate questions. (1) Is the claim true for this gene product? Yes, and by
      participation rather than necessity: the entity that performs the step is SseJ itself.
      Purified SseJ plus GTP-gamma-S-loaded RhoA converted liposomal DOPC and cholesterol to
      lysophosphatidylcholine and cholesteryl ester, with the products identified by TLC, and
      the cholesteryl ester product was confirmed again with the fluorogenic sn-1 substrate
      PEDA1 both in vitro and in transfected cells (PMID:19887681). Independently, infection
      with wild type versus a sseJ deletion raised cholesteryl ester and lipid droplets in
      HeLa cells and RAW macrophages (PMID:18333886), and UniProt judges esterification the
      dominant activity in host cells. A cholesteryl ester is a lipid, and GO:0008610 is the
      formation of lipids, so this is not a MODIFY candidate for a general term - QuickGO
      (2026-11-06) has no cholesteryl-ester or sterol-ester biosynthetic process term, and
      GO:0010872/GO:0010873 are obsolete, so GO:0008610 is the most specific existing term.
      A proposed_new_terms entry records the missing child. (2) Is the IBD sound? No, and
      ACCEPT here is not an endorsement of it. The IBD sits at the LUCA node of PTHR45642
      with a single GO:0008610 seed, P. aeruginosa EstA, whose evidence is a
      rhamnolipid-deficient deletion phenotype of unknown mechanism; it propagates to 960
      leaves, 940 of them plant GDSL esterase/lipases with no experimental annotation.
      Nothing about SseJ's chemistry follows from that seed. Tree inspection (2026-11-06)
      also shows SseJ is not even in EstA's subfamily: EstA, ChoE and Salmonella ApeE are
      PTHR45642:SF139 autotransporter carboxylesterases, while SseJ sits in
      PTHR45642:SF141 with Vibrio cholerae VC_A0218 "thermolabile hemolysin" and
      Xanthomonas estA under node PTN005220549 - the GCAT-like branch, which is exactly the
      relationship Ohlson 2005 inferred from the catalytic-region alignment. The defensible
      place for a lipid-biosynthesis IBD is PTN005220549 seeded by SseJ's own IDA rows, not
      the LUCA node; see source_defects.
    supported_by:
    - reference_id: PMID:19887681
