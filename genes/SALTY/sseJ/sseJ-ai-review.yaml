proposed_new_terms:
- proposed_name: cholesteryl ester biosynthetic process
  proposed_definition: The chemical reactions and pathways resulting in the formation of
    cholesteryl esters, esters of cholesterol with a fatty acid.
  justification: >-
    There is no biological-process term for the formation of cholesteryl esters (QuickGO,
    2026-11-06): GO:0010872 and GO:0010873, regulation of cholesterol esterification, are
    obsolete, and no sterol-ester or cholesteryl-ester biosynthetic process term exists. The
    enzymes that make cholesteryl esters therefore end up either on GO:0008610 lipid
    biosynthetic process, which is four levels too broad, or on GO:0008203 cholesterol
    metabolic process, which does not say a product is formed. Human LCAT (P04180) and SOAT1
    (P35610) both take the latter route while Salmonella SseJ takes the former, so the same
    chemistry is annotated inconsistently across species. A term under both GO:0008610 and
    GO:0008203 would collect the sterol O-acyltransferases (SOAT1, SOAT2), the
    phosphatidylcholine-sterol O-acyltransferases (LCAT, bacterial GCATs including SseJ and
    the Aeromonas/Vibrio enzymes), and the processes that depend on them.
  proposed_parent:
    id: GO:0008610
    label: lipid biosynthetic process
  supported_by:
  - reference_id: PMID:19887681
    supporting_text: SseJ efficiently converted DOPC and cholesterol to
      lyso-phosphatidylcholine (lyso-PC) and cholesterol ester (CE)
  - reference_id: PMID:18333886
    supporting_text: led to higher levels of cholesterol ester production in HeLa cells and
      RAW macrophages and were shown to increase levels of lipid droplets
    full_text_unavailable: true
knowledge_gaps:
- gap_statement: >-
    Whether SseJ has a genuine phospholipase A1 activity - hydrolysis of a glycerophospholipid
    with release of a free fatty acid - or whether the sn-1 cleavage is only the first
    half-reaction of transesterification, has not been determined. The published
    "phospholipase" attribution rests on family membership and on sn-1 cleavage assays run in
    the presence of a sterol acceptor; the only hydrolysis directly measured on SseJ is of
    p-nitrophenyl esters.
  boundary: >-
    Firmly established: the Ser151/Asp247/His384 triad; hydrolysis of p-nitrophenyl butyrate
    and palmitate; RhoA-GTP-dependent transfer of the sn-1 acyl chain of phosphatidylcholine
    to cholesterol with lysophosphatidylcholine and cholesteryl ester as products; and that
    the chemistry, not the protein's presence, is required for the cellular and mouse
    virulence phenotypes.
  gap_kind:
  - BIOLOGY
  dark_aspect: RESIDUAL_SUBGAP
- gap_statement: >-
    The acyl acceptor and acyl donor specificity of SseJ in the host cell is unknown. Only
    cholesterol has been tested as acceptor and only phosphatidylcholine species as donor, so
    it is not known whether SseJ also esterifies other host sterols or alcohols, nor which
    phospholipid classes it prefers at the vacuolar membrane, and therefore not known how much
    of its effect on membrane composition is cholesterol depletion versus lysophospholipid
    production.
  boundary: >-
    Firmly established: the reaction type (sn-1 acyl transfer from a glycerophospholipid to
    cholesterol), the requirement for RhoA-GTP, and that infected cells accumulate cholesteryl
    ester and lipid droplets.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
suggested_questions:
- question: >-
    Should PAINT withdraw or re-scope the GO:0008610 lipid biosynthetic process IBD at
    PTN005219546 and instead place an acyltransferase/lipid-biosynthesis IBD at PTN005220549
    (PTHR45642:SF141 - SseJ, Vibrio VC_A0218, Xanthomonas estA), seeded by SseJ's own IDA
    rows, where the clade-level claim is supportable?
- question: >-
    GO annotates the cholesterol-esterifying enzymes inconsistently: human LCAT and SOAT1
    carry GO:0008203 cholesterol metabolic process and not GO:0008610, while Salmonella SseJ
    carries GO:0008610 and no cholesterol-metabolism term. Is the intended convention the
    metabolic branch, and would a cholesteryl ester biosynthetic process term under both
    parents resolve it?
- question: >-
    Is the low catalytic rate of SseJ relative to the Aeromonas salmonicida GCAT (about
    ten-fold on p-nitrophenyl butyrate) a tuned property that protects the vacuole from
    destruction, as Ohlson et al. speculate, or an artefact of assaying a membrane-targeted
    enzyme on a soluble surrogate substrate?
suggested_experiments:
- description: >-
    Assay purified SseJ, activated by RhoA-GTP, on defined glycerophospholipid substrates in
    the strict absence of any sterol or other acyl acceptor, and quantify free fatty acid
    release (for example by LC-MS or a coupled acyl-CoA synthetase assay) against the
    lysophospholipid produced. Equimolar fatty acid and lysophospholipid would establish a
    genuine phospholipase A1 activity; lysophospholipid without free fatty acid, or loss of
    turnover in the absence of an acceptor, would show that hydrolysis is only the first
    half-reaction.
- description: >-
    Determine the acceptor and donor spectrum: incubate activated SseJ with liposomes in which
    the sterol (cholesterol, ergosterol, sitosterol, oxysterols) and the phospholipid headgroup
    and acyl composition are varied systematically, and identify products by LC-MS. Pair this
    with untargeted lipidomics of SCV-enriched membrane fractions from cells infected with
    wild type, a sseJ deletion and a catalytic-triad mutant, to find which of the in vitro
    products actually accumulate during infection.
- description: >-
    Test the phylogenetic prediction behind the proposed re-seeding of the IBD: purify Vibrio
    cholerae VC_A0218 and Xanthomonas campestris EstA (Q8P634), the other two PTHR45642:SF141
    leaves, and assay them for glycerophospholipid:cholesterol acyltransferase activity
    alongside P. aeruginosa EstA and Salmonella ApeE from subfamily SF139. If SF141 members
    share the acyltransferase chemistry and SF139 members do not, the subfamily boundary
    rather than the LUCA node is where the lipid-synthesis assertion belongs.
