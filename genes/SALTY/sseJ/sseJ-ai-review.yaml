      explanation: >-
        This is a follow-up to the report already filed from genes/PSEAE/estA, and it
        corrects one statement in it. The GO:0008610 lipid biosynthetic process IBD at
        PTN005219546 (the LUCA node of PTHR45642, 960 leaves) has a single seed, P.
        aeruginosa EstA (UniProtKB:O33407), whose supporting evidence is that an estA
        deletion strain makes little rhamnolipid (PMID:17631636). That remains a necessity
