- term:
    id: GO:0031267
    label: small GTPase binding
  evidence_type: IPI
  original_reference_id: PMID:19887681
  qualifier: enables
  supporting_entities:
  - UniProtKB:P61586
  review:
    summary: SseJ binds GTP-loaded RhoA (and RhoC) specifically, and that binding
      allosterically activates the enzyme; a core molecular function.
    action: ACCEPT
    reason: >-
      Gel filtration with equimolar SseJ and a panel of GTP-gamma-S-loaded GTPases gave a
      complex only with RhoA and RhoC, and the nucleotide state determined complex formation.
      This is not a bare interaction: the bound GTPase raises SseJ activity about five-fold
      over the GDP form, so GTPase binding is a regulatory molecular function of the
      effector. SseJ is a sensor rather than a modifier of the switch, with no GEF or GAP
      activity, which rules out the GTPase-regulator terms. GO:0017048 Rho GTPase binding
      has been merged into GO:0031267 (QuickGO, 2026-11-06), so no more specific child is
      available and the term is as precise as the ontology allows.
    supported_by:
