      GO:0004607 is not a descendant of GO:0034736, which sits under GO:0004772 sterol
      O-acyltransferase activity. The claim that SseJ esterifies cholesterol is accepted in
      full; only the reaction's acyl donor is misstated, and the mismatch is recorded as a
      source defect.
