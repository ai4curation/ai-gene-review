core_functions:
- description: >-
    Magnesium-dependent dehydration of L-talarate (L-altrarate) to 5-dehydro-4-deoxy-D-glucarate,
    initiated by abstraction of the C2 proton by the His328-Asp301 dyad with the conjugate acid
    of His328 facilitating departure of the 3-OH group. This is the committed, and the only
    known, step by which Salmonella Typhimurium LT2 catabolises L-talarate as a carbon source.
  molecular_function:
    id: GO:1990594
    label: L-altrarate dehydratase activity
  directly_involved_in:
  - id: GO:1903663
    label: L-altrarate catabolic process
  supported_by:
  - reference_id: PMID:17649980
    supporting_text: it catalyzes the efficient dehydration of both l-talarate (kcat = 2.1 s-1,
      kcat/Km = 9.1 x 10(3) M-1 s-1)
  - reference_id: PMID:17649980
    supporting_text: we demonstrated that S. typhimurium LT2 can utilize l-talarate as carbon
      source. Insertional disruption of the gene encoding STM3697 abolishes this phenotype
- description: >-
    Magnesium-dependent dehydration of meso-galactarate to 5-dehydro-4-deoxy-D-glucarate in the
    same active site, initiated instead by Lys197 in an anti-elimination, giving the L-threo
    product enantiomer. The activity is established kinetically in two independent laboratories.
    At the process level the contribution is accessory rather than core, because the dedicated
    gar-operon dehydratase GarD (STM3250) provides the principal route and disruption of STM3697
    only diminishes galactarate utilization; the corresponding process term GO:0046392 is
    therefore kept as non-core in this review rather than listed here.
  molecular_function:
    id: GO:0008867
    label: galactarate dehydratase activity
  supported_by:
  - reference_id: PMID:17649980
    supporting_text: we conclude that Lys 197 functions as the galactarate-specific base and His
      328 functions as the l-talarate-specific base
  - reference_id: PMID:29248502
    supporting_text: the rates of StTGD-catalyzed conversion of m-galactarate to 5-KDG were
      determined by following the change in ellipticity at 323 nm
  - reference_id: PMID:19883118
    supporting_text: TalrD/GalrD produces a product with a positive rotation
      (2-keto-L-threo-4,5-dihydroxyadipate; 2 in Scheme I)
proposed_new_terms:
- proposed_name: L-talarate 2-epimerase activity
  proposed_definition: >-
    Catalysis of the reaction: L-altrarate (L-talarate) = galactarate. The reaction proceeds by
    abstraction of the C2 proton to give a metal-stabilised enolate intermediate, which is
    reprotonated on the opposite face of C2.
  justification: >-
    STM3697 catalyses this epimerization as a third, experimentally demonstrated activity
    distinct from its two dehydratase activities; UniProt curates it as a separate CATALYTIC
    ACTIVITY (Rhea:64172) with ECO:0000269 evidence from PMID:17649980, and the H328 and K197
    mutants lose epimerization as well as dehydration. GO has no term for it: a search of OLS
    returns only GO:0016857 racemase and epimerase activity, acting on carbohydrates and
    derivatives, with no aldarate- or galactarate-specific child. Without the term the activity
    cannot be annotated at all, and the review has to record it in prose only.
  proposed_parent:
    id: GO:0016857
    label: racemase and epimerase activity, acting on carbohydrates and derivatives
  proposed_mappings:
  - predicate: skos:exactMatch
    target_term:
      id: RHEA:64172
      label: L-altrarate = galactarate
  supported_by:
  - reference_id: PMID:17649980
    supporting_text: The dehydration of l-talarate is accompanied by competing epimerization to
      galactarate
  - reference_id: file:SALTY/STM3697/STM3697-uniprot.txt
