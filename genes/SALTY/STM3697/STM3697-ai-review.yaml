- term:
    id: GO:0008867
    label: galactarate dehydratase activity
  evidence_type: IDA
  original_reference_id: PMID:17649980
  qualifier: enables
  review:
    summary: >-
      CACAO row. The cited paper measures galactarate dehydration directly on purified STM3697
      (kcat 3.5 s-1, kcat/Km 1.1 x 10^4 M-1 s-1) and identifies the galactarate-specific base;
      the term matches the assayed reaction exactly.
    action: ACCEPT
    reason: >-
      What the paper shows for this gene, CACAO assessment. Yew et al. purified the STM3697
      product, screened it against a physical library of acid sugars, and found efficient
      dehydration of galactarate alongside L-talarate; they then assigned Lys197 as the
      galactarate-specific base using the K197A structure with L-glucarate and solvent-deuterium
      incorporation into galactarate, and K197A abolishes dehydration of both substrates. The
      term GO:0008867 is defined as "galactarate = 5-dehydro-4-deoxy-D-glucarate + H2O", which
      is precisely the measured reaction, so the granularity is right and IDA is the appropriate
      code. The abstract calls these activities "promiscuous", but in this paper that word
      denotes dual substrate use within one active site, not an unvalidated screen hit: the
      kcat/Km values for the two substrates differ by less than 20 percent, the activity was
      reproduced independently by PMID:29248502, and the enzyme is not active on other acid
      sugars. The assertion is therefore not a promiscuous in vitro activity read as
      physiological function at the molecular-function level. The separate question of how much
      this activity contributes to galactarate catabolism in vivo is handled on the GO:0046392
      row. The GONUTS wiki pages for PMID:17649980 and SALTY:TAGAD were fetched on 2026-10-29
      and are offline ("temporarily offline while we perform upgrades"), so the student's
      recorded evidence text could not be inspected; the abstract and UniProt curation state the
      assay explicitly enough that no UNDECIDED is needed.
