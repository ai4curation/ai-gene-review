knowledge_gaps:
- gap_statement: >-
    The biological source of L-talarate is unknown: no pathway, host compound or environmental
    polysaccharide has been shown to yield it, so it is not known under what circumstances
    Salmonella encounters the substrate its only dedicated catabolic enzyme is specific for.
  boundary: >-
    What is established is that the enzyme dehydrates L-talarate efficiently, that LT2 can grow
    on purified L-talarate as sole carbon source, and that STM3697 is required for that growth.
    What is missing is any demonstration that L-talarate occurs in a niche Salmonella inhabits.
  gap_kind:
  - BIOLOGY
  significance: >-
    Whether the L-talarate activity is the enzyme's selected function or an incidental
    consequence of an active site evolved for galactarate turns on whether the substrate exists
    in vivo; the enolase superfamily is a standard test case for how promiscuous activities
    become physiological ones, and this gene is one of the few where the in vivo question has
    been posed at all.
  resolution: >-
    Metabolomic detection of L-talarate (or of a hydrolysable precursor) in gut contents, plant
    or soil material, together with competitive-fitness assays of a STM3697 mutant in those
    niches.
  provenance:
  - reference_id: PMID:17649980
    supporting_text: Because l-talarate is a previously unknown metabolite, we demonstrated that
      S. typhimurium LT2 can utilize l-talarate as carbon source
suggested_questions:
- question: >-
    Should the InterPro2GO mapping from IPR018110 (mandelate racemase / muconate lactonizing
    enzyme, conserved site) to GO:0009063 (amino acid catabolic process) be withdrawn or
    restricted? The signature is a superfamily-wide PROSITE pattern matched by enzymes acting on
    mandelate, muconate and acid sugars, and the resulting annotation is wrong for every
    acid-sugar dehydratase member, STM3697 included.
- question: >-
    Should GO represent the two regiochemically distinct galactarate dehydratase reactions
    separately? TalrD/GalrD and GarD dehydrate meso-galactarate from one end to give
    2-keto-L-threo-4,5-dihydroxyadipate, whereas the Oceanobacillus iheyensis GalrD-II enzyme
    Ob2843 gives the enantiomeric D-threo product; GO:0008867 currently covers both, so the
    distinction established in PMID:19883118 is not expressible.
  experts:
  - John A. Gerlt
- question: >-
    Is STM3697 transcriptionally induced by L-talarate or galactarate, and which transporter
    delivers L-talarate to the cytoplasm? No regulator, promoter or uptake system has been
    reported for this gene, and it lies far from the gar operon (STM3248-STM3250) in the genome.
- question: >-
    Does the epimerization of L-talarate to galactarate have any physiological role, for example
    feeding L-talarate-derived carbon into the GarD route, or is it purely a consequence of
    partitioning of the shared enolate intermediate?
  experts:
  - Stephen L. Bearne
suggested_experiments:
- hypothesis: >-
    The residual galactarate utilisation of a STM3697 disruptant is due to GarD (STM3250), so a
    STM3697 garD double mutant should be unable to grow on galactarate at all.
  description: >-
    Construct single and double deletions of STM3697 and garD (STM3250) in Salmonella Typhimurium
    LT2 and compare growth rates and final yields on minimal medium with meso-galactarate,
    L-talarate or glucose as sole carbon source, complementing each mutation in trans. This
    directly partitions the organism's galactarate flux between the dedicated gar route and the
    accessory TalrD/GalrD route, and so settles whether the GO:0046392 annotation on STM3697
    should be read as core or accessory.
  experiment_type: bacterial genetics and growth phenotyping
- hypothesis: L-talarate is a real metabolite of a niche Salmonella occupies.
  description: >-
    Search for L-talarate by LC-MS/MS against an authentic standard in candidate sources (mouse
    caecal contents, plant cell wall hydrolysates, soil extracts), and test whether a STM3697
    mutant is outcompeted by wild type in those matrices in a tagged competitive-fitness assay.
    A positive result would convert the L-talarate dehydratase activity from a demonstrated
    laboratory function to a selected physiological one.
  experiment_type: metabolomics and competitive fitness assay
- hypothesis: >-
    Epimerization and dehydration can be separated at the level of single active-site residues,
    allowing the epimerase activity to be tested in isolation.
  description: >-
    Build a mutant series around the His328-Asp301 dyad and the Lys197-x-Lys motif that
    preferentially impairs departure of the 3-OH group while retaining alpha-proton abstraction,
    using the continuous circular dichroism assay of PMID:29248502 for dehydration and NMR or
    chiral chromatography for epimerization, then express such variants in a STM3697 garD
    background to ask whether epimerase activity alone supports any growth on L-talarate.
  experiment_type: site-directed mutagenesis with coupled enzymology and genetics
- hypothesis: STM3697 expression is substrate-inducible.
  description: >-
    Measure STM3697 transcript and protein abundance by RT-qPCR and targeted proteomics in LT2
    grown on glucose, galactarate and L-talarate, and screen a transposon library for mutants
    that fail to induce a STM3697 promoter-reporter fusion on L-talarate, to identify the
    regulator and any cognate transporter.
  experiment_type: expression profiling and transposon screen
