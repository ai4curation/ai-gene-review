- id: PMID:17649980
  title: 'Evolution of enzymatic activities in the enolase superfamily: L-talarate/galactarate
    dehydratase from Salmonella typhimurium LT2.'
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The defining functional study of this gene, and the source cited by all four CACAO rows.
      PMID verified against PubMed; the cached record is abstract-only but the abstract itself
      states the kinetics for both substrates, the active-site residues, the mutant phenotypes
      and the two carbon-source disruption phenotypes, so each CACAO row could be adjudicated
      without the full text. Independently corroborated: UniProt curates the same reactions,
      kinetics, cofactor and disruption phenotype against this PMID with ECO:0000269, the PDB
      holds 2PP0/2PP1/2PP3 from the same work, and PMID:19883118 (same senior author) restates
      the mechanistic conclusions.
  findings:
  - statement: >-
      The activity was discovered by physical screening of an acid-sugar library, not inferred
      from pathway context, and both substrates are dehydrated efficiently.
    reference_section_type: ABSTRACT
    supporting_text: We discovered the function of STM3697 by screening a library of acid
      sugars; it catalyzes the efficient dehydration of both l-talarate (kcat = 2.1 s-1, kcat/Km
      = 9.1 x 10(3) M-1 s-1) and galactarate (kcat = 3.5 s-1, kcat/Km = 1.1 x 10(4) M-1 s-1)
  - statement: >-
      Disruption of STM3697 abolishes growth on L-talarate and only diminishes growth on
      galactarate, the asymmetry on which the core versus non-core split in this review rests.
    reference_section_type: ABSTRACT
    supporting_text: Insertional disruption of the gene encoding STM3697 abolishes this
      phenotype; this disruption also diminishes, but does not eliminate, the ability of the
      organism to utilize galactarate as carbon source.
  - statement: >-
      The two substrates are turned over in one active site using different general bases, with
      Lys197 specific for galactarate and His328 for L-talarate.
    reference_section_type: ABSTRACT
    supporting_text: we conclude that Lys 197 functions as the galactarate-specific base and His
      328 functions as the l-talarate-specific base
  - statement: Three acidic residues coordinate the catalytic magnesium ion.
    reference_section_type: ABSTRACT
    supporting_text: Asp 226, Glu 252, and Glu 278 as ligands for the essential Mg2+ at the ends
      of the third, fourth, and fifth beta-strands
  - statement: >-
      A third activity, epimerization of L-talarate to galactarate, competes with dehydration
      and has no GO term.
    reference_section_type: ABSTRACT
    supporting_text: The dehydration of l-talarate is accompanied by competing epimerization to
      galactarate; little epimerization to l-talarate is observed in the dehydration of
      galactarate.
- id: PMID:29248502
  title: A continuous assay for l-talarate/galactarate dehydratase using circular
    dichroism.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      PMID verified against PubMed. Independent replication of the galactarate dehydratase
      activity on recombinant Salmonella enzyme in a different laboratory and by a different
      method (continuous circular dichroism rather than the original coupled assay), which is
      what raises this activity above a single-laboratory screen result. The paper is an assay
      development paper, so it speaks only to the galactarate reaction and to inhibition by
      tartronate, not to the in vivo role.
  findings:
  - statement: >-
      Recombinant Salmonella enzyme converts meso-galactarate to 5-KDG with kinetics matching
      the 2007 coupled assay.
    reference_section_type: ABSTRACT
    supporting_text: the rates of StTGD-catalyzed conversion of m-galactarate to 5-KDG were
      determined by following the change in ellipticity at 323 nm
  - statement: The newly measured kinetic parameters agree with the original report.
    reference_section_type: ABSTRACT
    supporting_text: These values are in excellent agreement with those published previously
- id: PMID:19883118
  title: 'Computation-facilitated assignment of the function in the enolase superfamily: a
    regiochemically distinct galactarate dehydratase from Oceanobacillus iheyensis.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Principally about Oceanobacillus iheyensis Ob2843 (GalrD-II), not about STM3697, but it
      assays the Salmonella TalrD/GalrD enzyme side by side with Ob2843 by polarimetry and so
      establishes the regiochemistry and product stereochemistry of the STM3697 reaction. Cached
      with PMC full text. Cited here for the product identity and for the independent statement
      that the two dehydratase activities share one enolate intermediate; it is not used to
      support any annotation on its own.
  findings:
  - statement: >-
      The two dehydratase activities of TalrD/GalrD proceed through a single shared enolate
      intermediate in one active site.
    reference_section_type: RESULTS
    supporting_text: We previously characterized a promiscuous acid sugar dehydratase in the MR
      subgroup that catalyzes both L-talarate dehydratase (TalrD) and GalrD reactions via a
      common enolate intermediate
  - statement: >-
      Polarimetry establishes that the Salmonella enzyme dehydrates meso-galactarate to the
      L-threo product enantiomer, the same one made by GarD-type enzymes.
    reference_section_type: RESULTS
    supporting_text: TalrD/GalrD produces a product with a positive rotation
      (2-keto-L-threo-4,5-dihydroxyadipate; 2 in Scheme I)
- id: PMID:39835335
  title: 'An Active-Site Bro̷nsted Acid-Base Catalyst Destabilizes Mandelate Racemase and
    Related Subgroup Enzymes: Implications for Catalysis.'
  full_text_unavailable: true
  reference_review:
