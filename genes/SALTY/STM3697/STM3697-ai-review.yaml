- term:
    id: GO:0046392
    label: D-galactarate catabolic process
  evidence_type: IMP
  original_reference_id: PMID:17649980
  qualifier: involved_in
  review:
    summary: >-
      CACAO row. Supported by the gene-disruption carbon-source phenotype, but the phenotype is
      explicitly partial and Salmonella carries a dedicated gar-operon galactarate dehydratase,
      so this is an accessory rather than a core route.
    action: KEEP_AS_NON_CORE
    reason: >-
      What the paper shows for this gene, CACAO assessment. The insertional disruption of
      STM3697 "diminishes, but does not eliminate, the ability of the organism to utilize
      galactarate as carbon source". That is a genuine in vivo loss-of-function result for a
      process whose first committed step the enzyme performs, so the term is not too downstream
      (it is not a phenotype read as a process: the gene product itself catalyses galactarate
      dehydration, measured in the same paper) and it is at the right granularity. The term is
      kept. It is marked non-core because the residual growth has a definite explanation: S.
      Typhimurium LT2 also encodes the canonical gar operon, garR (STM3248), garL (STM3249,
      5-keto-4-deoxy-D-glucarate aldolase) and garD (STM3250, galactarate dehydratase,
      L-threo-forming, EC 4.2.1.42), checked by UniProtKB REST query of taxon 99287. GarD is the
      dedicated galactarate dehydratase and provides the principal route; STM3697 contributes a
      partially redundant one, making the same product enantiomer (TalrD/GalrD gives
      2-keto-L-threo-4,5-dihydroxyadipate, and UniProt names GarD L-threo-forming). The
      molecular function GO:0008867 is nevertheless accepted as core on this gene: the activity
      is fully established, and it is only its share of the organism's galactarate flux that is
      secondary. Minor ontology note, not a reason to change the action: galactarate is a meso
      compound (ChEBI:16537) and GO:0046392's label retains a "D-" prefix; this is a naming
      inheritance in GO, and GO:0046392 is the term used across GO for galactarate catabolism,
      including for GarD-type enzymes. GONUTS was offline when checked (2026-10-29), so the
      student's own evidence note could not be read.
    supported_by:
    - reference_id: PMID:17649980
      supporting_text: this disruption also diminishes, but does not eliminate, the ability of
        the organism to utilize galactarate as carbon source
