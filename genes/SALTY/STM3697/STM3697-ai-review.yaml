  review:
    summary: >-
      A catalytic Mg(2+) is directly established for STM3697 by crystallography and by the
      canonical mandelate-racemase-subgroup metal triad, so the phylogenetic inference is
      confirmed on the target itself.
    action: ACCEPT
    reason: >-
      The IBD behind this row sits on an enolase-superfamily node whose members all share the
      Mg(2+)-stabilised enolate mechanism, so the node placement is sound; more importantly, the
      claim does not rest on the propagation at all. PMID:17649980 identifies Asp226, Glu252 and
      Glu278 as the ligands of the essential Mg(2+) at the ends of the third, fourth and fifth
      beta-strands, the wild-type and K197A structures (PDB 2PP0/2PP1/2PP3) were solved with
      magnesium bound, and UniProt curates one Mg(2+) per subunit with ECO:0000269 evidence from
      that paper. Magnesium is a cofactor of the core dehydration reaction rather than an
      unrelated metal-binding function, so this is retained as core.
    supported_by:
