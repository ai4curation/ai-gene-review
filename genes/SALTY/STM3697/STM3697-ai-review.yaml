id: Q8ZL58
gene_symbol: STM3697
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: >-
  STM3697 encodes L-talarate/galactarate dehydratase (TalrD/GalrD), a magnesium-dependent
  acid-sugar dehydratase of the mandelate racemase subgroup of the enolase superfamily. It
  catalyses the elimination of water from either L-talarate (L-altrarate) or meso-galactarate to
  give 5-dehydro-4-deoxy-D-glucarate, using a single active site in which His328 is the
  L-talarate-specific base and Lys197 the galactarate-specific base, with Asp226, Glu252 and
  Glu278 coordinating the catalytic Mg(2+). The shared enolate intermediate also partitions into
  epimerization, interconverting L-talarate and galactarate. The protein is a homooctamer
  (tetramer of dimers) and is not active on other acid sugars. In Salmonella Typhimurium LT2 the
  enzyme is the sole route for growth on L-talarate as a carbon source and an accessory
  contributor to growth on galactarate, where the dedicated gar operon dehydratase GarD
  (STM3250) provides the principal route.
