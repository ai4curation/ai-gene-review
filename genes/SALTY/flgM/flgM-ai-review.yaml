id: P26477
gene_symbol: flgM
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: FlgM is the anti-sigma factor that inhibits the flagellar sigma factor FliA (sigma28) in
  Salmonella. Its C-terminal region binds FliA and reduces late flagellar transcription. Completion of
  the hook-basal-body export pathway permits FlgM secretion, relieving cytoplasmic inhibition and coordinating
  late gene expression with assembly. FlgM also interacts with the export chaperone FliS, which competes
  with FliA for overlapping binding surfaces.
