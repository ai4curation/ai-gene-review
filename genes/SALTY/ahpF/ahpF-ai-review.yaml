taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: Salmonella typhimurium AhpF is a flavoprotein disulfide reductase that regenerates oxidized
  AhpC for peroxide detoxification. Its C-terminal FAD/pyridine-nucleotide region supplies electrons to
  an N-terminal thioredoxin-like relay that reduces the AhpC disulfide. The characterized Salmonella enzyme
  is homodimeric and accepts NADH and NADPH, with NADH preferred in the tested DTNB reductase assays.
  Free thioredoxin reduction is negligible on standard assay timescales compared with canonical thioredoxin
  reductase, although very slow side activity is detectable.
