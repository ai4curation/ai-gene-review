- id: PMID:25108218
  title: Toward aldehyde and alkane production by removing aldehyde reductase activity
    in Escherichia coli.
  findings:
  - statement: >-
      E. coli YbbO (orthologue of Salmonella ybbO) is a strictly NADPH-dependent
      aldehyde reductase in vitro, active on C2-C10 aldehydes with highest activity on
      hexanal and octanal, but about 10-fold less active than DkgA and YahK.
    supporting_text: YbbO showed broad substrate activity toward all the C2–C10 aldehydes
      with the highest activity toward hexanal and octanal
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached (PMC4411948). Experiments are on E. coli YbbO, not the Salmonella
      protein; relevant by orthology (90.6% identity). EcoCyc cites it for GO:0008106 IDA
      on P0AFP4.
- id: PMID:27134112
  title: Identification of long chain specific aldehyde reductase and its use in enhanced
    fatty alcohol production in E. coli.
  findings:
  - statement: >-
      Deletion of E. coli ybbO abolishes >90% of long-chain fatty alcohol production from
      fatty aldehydes, and purified YbbO reduces C6-C18 aldehydes with NADP(H), favouring
      C16-C18.
    supporting_text: Enzyme kinetic study revealed that YbbO has wide substrate specificity
      ranging from C6 to C18 aldehyde, with maximum affinity and efficiency for C18 and
      C16 chain length aldehyde, respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Abstract only in cache. Work is on E. coli YbbO in an engineered fatty-alcohol
      production strain, so it establishes activity but not the physiological substrate.
