suggested_questions:
- question: >-
    What is the physiological aldehyde substrate of YbbO in Salmonella and E. coli? The
    characterised activities come from engineered aldehyde-overproducing strains; does
    YbbO detoxify endogenous lipid-peroxidation or fatty aldehydes, or does it act on a
    hydroxysteroid-like or other secondary-alcohol substrate as its SDR9C relatives do?
suggested_experiments:
- description: >-
    Purify Salmonella YbbO (STM0505) and measure NADPH-dependent reduction of a panel of
    aliphatic (C2-C18), unsaturated (e.g. 4-hydroxynonenal) and aromatic aldehydes and the
    reverse NADP+-dependent oxidation of alcohols, and test growth and survival of a
    ybbO deletion mutant under aldehyde and oxidative stress and inside macrophages.
  experiment_type: biochemical assay and mutant phenotyping
