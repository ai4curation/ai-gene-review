taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: >-
  ybbO (STM0505) encodes a 256-residue cytoplasmic classical short-chain
  dehydrogenase/reductase (SDR) of the SDR9C (17beta-hydroxysteroid dehydrogenase-like)
  family, with an N-terminal Rossmann-fold TGxxxGxG NAD(P)-binding motif and the
  conserved YxxxK catalytic motif (proton acceptor Tyr146). It is 90.6% identical to
  Escherichia coli YbbO, an NADPH-dependent aldehyde reductase that reduces a broad range
  of aliphatic aldehydes (C2 to C18) to the corresponding primary alcohols, with the
  highest affinity for long-chain (C16-C18) fatty aldehydes. By orthology, Salmonella YbbO
  is expected to act as an NADPH-dependent aldehyde reductase; its physiological substrate
  and biological role, possibly the reduction of endogenous lipid-derived aldehydes, have
  not been established.
