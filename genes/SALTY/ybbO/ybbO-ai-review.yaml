  review:
    summary: >-
      Generic oxidoreductase activity propagated from PANTHER node PTN000672121
      (PTHR43313, SDR family 9C). The node groups vertebrate 17beta-hydroxysteroid and
      retinol dehydrogenases with E. coli YbbO (P0AFP4), so the only claim shared across
      the clade is the generic SDR oxidoreductase activity. Q7CR11 is a classical SDR with
      intact cofactor-binding and catalytic motifs and is 90.6% identical to E. coli YbbO,
      which is an experimentally characterised NADPH-dependent aldehyde reductase.
    action: MODIFY
    reason: >-
      The IBA is correct and the node placement is sound: Q7CR11 sits inside the
      PTHR43313 clade, retains the TGxxxGxG cofactor motif and the YxxxK catalytic motif,
      and there is no sign of loss of activity. But the term is more general than the
      evidence for this protein supports. Its E. coli orthologue YbbO is a one-to-one
      orthologue (reciprocal best hit across both full proteomes with a ~6-fold score gap
      over the nearest SDR paralogues, conserved ybbN-ybbO-tesA-ybbA neighbourhood, 90.6%
      identity, invariant N105-S133-Y146-K150 tetrad, and only one substitution, the
      orthologue-variable Y84F, in the predicted active-site pocket). E. coli YbbO reduces C2-C18 aliphatic
      aldehydes to alcohols with NADPH as the cofactor (PMID:25108218, PMID:27134112),
      which is the reverse direction of GO:0008106 alcohol dehydrogenase (NADP+) activity,
      the term EcoCyc assigns to P0AFP4 by IDA. The broad PAINT node legitimately stops at
      oxidoreductase because substrate specificity differs across SDR9C, but within the
      enterobacterial YbbO orthogroup the more specific activity is supported. Replace
      with GO:0008106 (an is_a descendant of GO:0016491).
    proposed_replacement_terms:
    - id: GO:0008106
      label: alcohol dehydrogenase (NADP+) activity
