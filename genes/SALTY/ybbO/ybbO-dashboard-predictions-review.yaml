description: >-
  The KBase gene-annotate dashboard (Dark Protein Atlas) LLM call for
  S. enterica AYCY01000026.1_161 is "Short-chain dehydrogenase/reductase (SDR)
  family oxidoreductase, substrate undetermined" (tier A), with one GO term,
  GO:0016491 oxidoreductase activity. The query is 99.6% identical over its full
  256 residues to S. Typhimurium LT2 STM0505 (Q7CR11), so it is scored on that
  accession. The sequence is a catalytically intact classical SDR: TGxxxGxG
  cofactor motif at residue 8, NNAG at 80, and YxxxK with Tyr146/Lys150. The call
  is biologically correct, and GO:0016491 is already present in GOA as an IBA, so
  the GO prediction is correct but not novel. It is, however, less informative
  than the evidence allows. The query is 91.4% identical to E. coli YbbO (P0AFP4),
  which has been characterized as an NADP(+)-dependent aldehyde reductase with
  in vitro kinetics on C6-C18 aldehydes (PMID:27134112) and was found among new
  E. coli aldehyde reductases in a genome-wide screen (PMID:25108218). The
  companion gene review therefore refines the IBA row to GO:0008106 alcohol
  dehydrogenase (NADP+) activity by orthology. The dashboard's PaperBLAST panel surfaced only
  a proteomics complex-association study for the E. coli orthologue, so the
  annotator did not see the biochemical evidence. Its tier rationale also cites
  copper and nickel fitness phenotypes in a 34.4%-identity homolog, but only a
  thallium phenotype appears in the evidence shown, and a distant homolog's
  fitness is a weak basis for tier A.
