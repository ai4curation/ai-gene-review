description: >-
  The KBase gene-annotate dashboard predicted "Short-chain
  dehydrogenase/reductase (SDR) family oxidoreductase, substrate undetermined"
  with one GO term, GO:0016491 oxidoreductase activity, for Salmonella enterica
  gene AYCY01000026.1_161 (serovar not stated). The query is scored on Q7CR11,
  and the taxon above is that accession's. The two sequences are 99.6%
  identical over all 256 residues, differing only at I244L, a conservative
  change away from the catalytic residues. The query is a catalytically intact
  classical SDR: TGxxxGxG cofactor motif at residue 8, NNAG at 80, and YxxxK
  with Tyr146/Lys150. Its E. coli orthologue YbbO (P0AFP4) is 91.0% identical
  over the query length by global alignment (233/256). The 90.6% in the
  companion review is the same comparison for Q7CR11, which matches P0AFP4 at
  one fewer position. E. coli YbbO is an NADP(+)-dependent aldehyde reductase
  with kinetics on C6-C18 aldehydes (PMID:27134112), and it was among five new
  aldehyde reductases found in a 44-candidate screen (PMID:25108218). The
  prediction is correct but not novel, because GO:0016491 is already in GOA as
  an IBA. It is also less informative than the orthologue evidence allows: the
  companion review refines that row to GO:0008106 alcohol dehydrogenase (NADP+)
  activity.
