  title: Identification of long chain specific aldehyde reductase and its use in enhanced fatty alcohol production in E. coli.
  findings:
  - statement: E. coli YbbO is an NADP(+)-dependent aldehyde reductase with broad aldehyde chain-length specificity.
    supporting_text: Enzyme kinetic study revealed that YbbO has wide substrate specificity ranging from C6 to C18 aldehyde, with maximum affinity and efficiency for C18 and C16 chain length aldehyde, respectively.
- id: PMID:25108218
  title: Toward aldehyde and alkane production by removing aldehyde reductase activity in Escherichia coli.
  findings:
  - statement: YbbO was identified as an E. coli aldehyde reductase in a screen of 44 candidate oxidoreductases.
    supporting_text: From the pool of 44 candidates, we found five new ALRs using this screening method (YahK, DkgA, GldA, YbbO, and YghA).
