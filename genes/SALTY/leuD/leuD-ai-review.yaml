id: P04787
gene_symbol: leuD
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: >-
  leuD encodes the small subunit of isopropylmalate isomerase
  (3-isopropylmalate dehydratase, EC 4.2.1.33), the second enzyme of the
  leucine-specific branch of branched-chain amino acid biosynthesis. The
  23.5 kDa LeuD polypeptide copurifies with the 51 kDa LeuC large subunit as
  a two-subunit enzyme that interconverts 2-isopropylmalate and
  3-isopropylmalate (Km for 2-isopropylmalate about 0.3 mM); activity is
  reconstituted in vitro by mixing extracts of leuC and leuD mutants. LeuD
  corresponds to the swivel domain of aconitase-family enzymes and carries no
  cofactor of its own. In Salmonella a cryptic paralog, NewD, can replace
  LeuD in the complex when activated by supQ mutations.
existing_annotations:
- term:
