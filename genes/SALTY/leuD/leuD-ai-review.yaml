    label: 3-isopropylmalate dehydratase activity
  evidence_type: EXP
  original_reference_id: PMID:7026530
  qualifier: enables
  review:
    summary: >-
      Isopropylmalate isomerase activity was measured for the native
      two-subunit LeuC-LeuD enzyme and reconstituted by in vitro
      complementation of leuC and leuD mutant extracts.
    action: ACCEPT
    reason: >-
      The paper directly shows LeuD is a required subunit of the active
      isomerase, so GO:0003861 is the right activity. The same evidence shows
      the activity is a property of the complex, not of LeuD alone, so the
      qualifier should be `contributes_to`; this is recorded as a source
      defect, consistently across all GO:0003861 rows of LeuD and with the
      PSEPK leuD review.
    supported_by:
    - reference_id: PMID:7026530
      supporting_text: >-
        It is a complex enzyme composed of two
        subunits which are coded for by two genes of the leucine operon, leuC and leuD.
    - reference_id: PMID:7026530
      supporting_text: >-
        in vitro complementation of cell-free extracts of leuC and leuD
        mutant strains was demonstrated
    source_defects:
    - defect_type: WRONG_QUALIFIER
      resource: UNIPROT
      slot: Qualifier
      requested_change: REPOINT
      asserted_value: enables
      corrected_value: contributes_to
      cause: OTHER
      confidence: CONFIRMED
      explanation: >-
        PMID:7026530 shows the isomerase is a LeuC-LeuD complex whose activity
        is reconstituted only when both subunits are present. LeuD
        contributes to, rather than independently enables, GO:0003861.
