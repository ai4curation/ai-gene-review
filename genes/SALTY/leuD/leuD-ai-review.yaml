- id: PMID:7026530
  title: Wild-type isopropylmalate isomerase in Salmonella typhimurium is composed
    of two different subunits.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Primary paper on the Salmonella isomerase: copurification of the leuC
      (51 kDa) and leuD (23.5 kDa) products, in vitro complementation of leuC
      and leuD extracts, and Km for 2-isopropylmalate. Abstract-only in the
      cache.
  findings:
  - statement: The isomerase is the second leucine-specific enzyme.
    supporting_text: >-
      The isopropylmalate isomerase in Salmonella typhimurium is the second enzyme
      specific for leucine biosynthesis.
  - statement: It is a two-subunit enzyme encoded by leuC and leuD.
    supporting_text: >-
      It is a complex enzyme composed of two
      subunits which are coded for by two genes of the leucine operon, leuC and leuD.
  - statement: The two subunits copurify.
    supporting_text: >-
      The two polypeptides have been shown to copurify through successive ammonium
      sulfate fractionations
  - statement: Activity is reconstituted by mixing leuC and leuD mutant extracts.
    supporting_text: >-
      in vitro complementation of cell-free extracts of leuC and leuD
      mutant strains was demonstrated
  - statement: The native enzyme Km for 2-isopropylmalate is 0.3 mM.
    supporting_text: >-
      The native isopropylmalate isomerase was shown to
      have a Km for its substrate alpha-isopropylmalate of 3 x 10(-4)M.
