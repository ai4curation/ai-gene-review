id: Q8ZRJ7
gene_symbol: fadE
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: FadE is the FAD-dependent acyl-CoA dehydrogenase that forms trans-2-enoyl-CoA at the entry
  to each fatty acid beta-oxidation turn in Salmonella Typhimurium LT2. Its physiological electron acceptor
  remains unresolved; a separate ETF partner has not been established. LT2-derived FadE improves fatty-acyl-CoA
  degradation when substituted into E. coli, while the full improvement in intermediate clearance also
  depends on LT2 FadBA. Native medium-chain fatty acid utilization depends on FadR regulation and substrate
  activation, as well as the oxidation enzymes.
