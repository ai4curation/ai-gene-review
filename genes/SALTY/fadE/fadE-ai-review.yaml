    action: MODIFY
    summary: Acyl-CoA oxidation is supported, but the term explicitly assumes an unverified ETF acceptor.
    reason: The active GO definition names oxidized and reduced electron-transfer flavoprotein. Primary
      enterobacterial genetic/physiological work establishes FadE-dependent acyl-CoA oxidation, while
      the physiological electron relay remains unresolved. This correction does not deny chain-length
      capability or demonstrate that ETF is impossible. LT2 gene replacement and CoA profiles support
      native pathway function and improved processing; they do not measure isolated-enzyme kinetics. Long-
