- id: PMID:24722491
  title: Functional characterization of the type III secretion ATPase SsaN encoded
    by Salmonella pathogenicity island 2.
  findings:
  - statement: >-
      Purified SsaN hydrolyses ATP (Km 0.81 mM, 0.36 umol/min/mg) with non-linear
      dependence on protein concentration; the DCCD-box variant R192G has no
      detectable activity.
    supporting_text: Purified SsaN-Myc-His6 hydrolyzed ATP in a linear, time-dependent
      manner with a mean ATPase activity of 0.36
  - statement: >-
      An ssaN deletion cannot secrete the translocator SseB or the effector SseJ;
      complementation restores secretion, R192G does not.
    supporting_text: SseB secretion from the ssaN mutant strain was undetectable
  - statement: >-
      SsaN forms a C-ring/sorting-platform complex with SsaK (SctL2) and SsaQ, and
      binds the SPI-2 chaperones SsaE, SseA, SscA and SscB.
    supporting_text: SsaN interacted with SsaK and SsaQ to form the C ring complex
  - statement: >-
      SsaN releases the translocator SseB from its chaperone SsaE in an
      ATP-dependent manner; ATPgammaS and R192G do not support release.
    supporting_text: our results indicate that SsaN releases the translocator protein
      SseB from the T3SS-2 specific chaperone SsaE in an ATP-dependent manner
  - statement: >-
      SsaN is in both the soluble and the membrane fraction of Salmonella grown
      under SPI-2-inducing conditions, independently of SsaK and SsaQ.
    supporting_text: These results indicated that SsaN could associate with the membrane
      regardless of the presence of the other ATPase-associated components.
  - statement: >-
      An ssaN mutant is strongly attenuated in mixed mouse infection (CI 0.047),
      restored by complementation.
    supporting_text: The CI value of the wild-type strain versus the ssaN mutant strain
      was significantly reduced to 0.047
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The primary characterisation of this protein and the source of every
      experimental row in GOA. Full text is cached. It supports the enzymology,
      interactions and cytoplasmic/membrane localisation, but it does not place
      SsaN in any host compartment, which is why the two host-cell rows are
      rejected.
- id: PMID:25035427
  title: Identification of the docking site between a type III secretion system ATPase
    and a chaperone for effector cargo.
  findings:
  - statement: >-
      2.1 A crystal structure of SsaN (PDB 4NPH); the C-terminal region forms the
      docking site for the multicargo chaperone SrcA, and docking-site mutants that
      retain ATPase activity are attenuated in vivo.
    supporting_text: The C-terminal region of T3SS ATPases mediates binding with multiple
      contact points along the chaperone.
  - statement: >-
      SsaN is required for secretion of SPI-2-encoded needle and translocon
      components; some effectors encoded outside SPI-2 can be rerouted via T3SS-1.
    supporting_text: As expected, SsaN was required for the secretion of needle and
      translocon components
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Structural and functional study of this protein. Also the basis of the
      UniProt hexamer statement, though the hexamer is modelled rather than
      directly observed.
- id: PMID:8943245
  title: Enzymatic characterization of FliI. An ATPase involved in flagellar assembly
    in Salmonella typhimurium.
  findings:
  - statement: >-
      The flagellar family member FliI is a Mg2+-dependent ATPase insensitive to
      F-, V- and P-type ATPase inhibitors, i.e. it is not a rotary proton pump.
    supporting_text: The activity was not affected by inhibitors of the F-, V- or P-type
      ATPases
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Paralog (Salmonella flagellar FliI) rather than SsaN itself; used only for
      the family-level point that these export ATPases do not behave like F-type
      enzymes.
- id: PMID:25701111
  title: Fueling type III secretion.
  findings:
  - statement: >-
      The proton motive force is the primary energy source for type III secretion,
      and its conversion to export occurs at the inner-membrane export gate
      (FlhA/YscV with FliJ/YscO), not at the ATPase.
    supporting_text: conversion of the pmf to protein export is the rate limiting step for protein export via the T3SS, and the pmf therefore the primary fuel for secretion via the T3SS
  - statement: Collapsing the pmf blocks type III protein export.
    supporting_text: Collapsing the pmf abolishes protein export via T3SS.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Review covering both flagellar and injectisome T3SS energetics; used to
      locate proton flux in the export gate rather than in the SctN ATPase.
- id: file:SALTY/sctN2/sctN2-deep-research-falcon.md
  title: Falcon deep research report for Salmonella SctN2/SsaN
  findings:
  - statement: >-
      SsaN has no transmembrane helices; its membrane-fraction signal reflects
      peripheral association with the cytoplasmic face of the SPI-2 apparatus.
    supporting_text: SsaN lacks transmembrane helices and is not classified as an integral
      membrane protein
  reference_review:
