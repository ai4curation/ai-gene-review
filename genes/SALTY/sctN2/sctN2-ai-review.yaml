    review_notes: >-
      Correctly identifies P74857 as the SPI-2 T3SS ATPase and summarises the two
      primary papers accurately, including the R192G result and the competitive
      indices. Primary papers were cited directly wherever possible; the report's
      family-level Yersinia inferences were not used as evidence for this entry.
