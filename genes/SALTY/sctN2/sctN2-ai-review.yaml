  review:
    summary: >-
      IBA from the PAINT IBD placed at PANTHER node PTN008558586. In the cached
      PTHR15184 PAINT table that node carries both this complex term and
      GO:0046933, seeded entirely by F1-beta subunits (E. coli AtpD P0ABB4, human
      ATP5F1B P06576, yeast ATP2, S. pombe atp2, plant and rat beta subunits).
