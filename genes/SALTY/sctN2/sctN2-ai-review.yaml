id: P74857
gene_symbol: sctN2
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: >-
  SctN2 (SsaN, STM1415) is the ATPase of the type III secretion system encoded by
  Salmonella pathogenicity island 2 (SPI-2 T3SS, T3SS-2), the injectisome that
  Salmonella uses from inside the Salmonella-containing vacuole. The purified
  enzyme is a Mg-ATP-dependent ATPase whose activity depends on the conserved
  DCCD-box arginine Arg192 and rises non-linearly with concentration, consistent
  with the hexameric ring that its 2.1 A crystal structure can be modelled into.
  SctN2 sits in the cytoplasm and in a peripheral inner-membrane pool at the
  cytoplasmic face of the injectisome, where it forms a sorting-platform (C ring)
  complex with the stator-like SsaK/SctL2 and the FliN-like SsaQ. Through a
  discrete C-terminal module it docks the SPI-2 chaperones SsaE, SseA, SscA, SscB
  and the multicargo chaperone SrcA, and it uses ATP hydrolysis to strip cargo
  from its chaperone, releasing the translocator SseB from SsaE. Cells lacking it
  fail to secrete translocators and effectors and are strongly attenuated in
  systemic mouse infection. SctN2 is a paralog of the F1-ATP synthase beta subunit
  and of the flagellar export ATPase FliI, but it neither synthesises ATP nor
  conducts protons: it has no Fo partner, and the proton motive force that powers
  type III translocation is converted to export at the membrane export gate, not
  by the ATPase.
