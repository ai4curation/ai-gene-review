suggested_questions:
- question: >-
    Should the PAINT IBDs for GO:0046933 and GO:0045259 be moved from
    PANTHER:PTN008558586 down to PTN008558588, the child that contains the ATP
    synthase beta subfamilies and all of the seed proteins? As placed, the
    assertions cross a duplication node and reach PTN000390097, the bacterial
    export ATPase clade (PTHR15184:SF62 SPI-2, SF9 SPI-1, SF81 flagellar), which
    has no Fo sector. Failing that, should an IRD or NOT be recorded at
    PTN000390097?
- question: >-
    Should the InterPro2GO mappings for IPR013380 (Type III secretion system ATPase
    SctN) drop GO:0046961 and GO:0006754? The signature is specific to export
    ATPases, so the two mappings mis-assign rotary proton pumping and ATP synthesis
    to the whole family, and they also generate the GO_REF:0000108 rows GO:1902600
    and (via GO:0046933) GO:0015986.
- question: >-
    Should the AgBase rows GO:0030430 host cell cytoplasm and GO:0033644 host cell
    membrane on P74857 be withdrawn or re-pointed? PMID:24722491 localises SsaN to
    bacterial soluble and membrane fractions, and it is the effector SseJ, not the
    ATPase, that is shown in the host cell.
- question: >-
    Is the hexameric ring of SsaN observed directly? The crystal structure is of a
    monomer and the hexamer is modelled on F1; cryo-EM or analytical
    ultracentrifugation of full-length SsaN, ideally with SsaK/SctL2, would settle
    the stoichiometry of the SPI-2 sorting platform.
suggested_experiments:
- description: >-
    Measure the contribution of the proton motive force versus SsaN ATP hydrolysis
    to SPI-2 secretion directly, by uncoupling the pmf in cells expressing wild-type
    or R192G SsaN and quantifying translocator and effector export. This would test
    for the injectisome the division of labour established for the flagellar system.
  experiment_type: bacterial physiology and secretion assay
- description: >-
    Determine a cryo-EM structure of full-length SsaN with SsaK/SctL2 and SsaQ, in
    situ if possible, to establish the oligomeric state and how the ATPase is held
    at the cytoplasmic face of the SPI-2 injectisome.
  experiment_type: structural biology
- description: >-
    Test whether SsaN unfolds its substrates rather than only releasing chaperones,
    using hydrogen-deuterium exchange or single-molecule force measurements on
    SseB with wild-type and R192G SsaN.
  experiment_type: biophysics
