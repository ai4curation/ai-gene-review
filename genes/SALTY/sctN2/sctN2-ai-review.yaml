  review:
    summary: >-
      Logical inference from the InterPro2GO GO:0046961 row. SsaN has no
      transmembrane segment and transports no protons. The SPI-2 injectisome, like
      the flagellar export apparatus, is powered mainly by the proton motive force,
      but that conversion happens at the inner-membrane export gate; dependence of
      the system on the pmf is not participation of the ATPase in proton transport.
