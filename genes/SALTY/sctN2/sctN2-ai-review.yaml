core_functions:
- description: >-
    ATP-hydrolysing engine of the SPI-2 injectisome. At the cytoplasmic face of
    the apparatus it docks chaperone-cargo complexes, uses ATP hydrolysis to strip
    the chaperone from the translocator or effector, and hands the substrate to the
    membrane export gate for secretion into the host cell.
  molecular_function:
    id: GO:0008564
    label: protein-exporting ATPase activity
  directly_involved_in:
