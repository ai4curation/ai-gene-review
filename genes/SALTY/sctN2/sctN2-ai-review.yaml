    label: type III protein secretion system complex
  supported_by:
  - reference_id: PMID:24722491
    supporting_text: our results indicate that SsaN releases the translocator protein
      SseB from the T3SS-2 specific chaperone SsaE in an ATP-dependent manner
  - reference_id: PMID:24722491
    supporting_text: SseB secretion from the ssaN mutant strain was undetectable
- description: >-
    Cargo-selection function: a discrete C-terminal module binds the SPI-2
    chaperones SsaE, SseA, SscA, SscB and the multicargo chaperone SrcA, which is
    how the ATPase recognises which proteins to feed into the secretion channel.
    Mutants that keep ATPase activity but lose chaperone docking are attenuated.
