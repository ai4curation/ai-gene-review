        source_label: E. coli AtpD (F1 beta)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Seed lies in the sister clade PTN008558588.
      - source_id: UniProtKB:P06576
        source_label: human ATP5F1B
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mitochondrial F1 beta; no Fo-type partner exists for SctN2.
      residue_claims_not_applicable: >-
        The argument is about tree topology and complex architecture (absence of an
        Fo sector and c-ring in the injectisome), not about gain or loss of
        individual residues; SctN2 retains an intact Walker A/B P-loop site and
