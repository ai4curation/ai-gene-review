- id: PMID:1550360
  title: Overexpression, purification, and some properties of the AdoCbl-dependent ethanolamine ammonia-lyase
    from Salmonella typhimurium.
  findings:
  - statement: Separated Salmonella subunits combine to form active lyase.
    supporting_text: These subunits, inactive by themselves, combine to produce an active enzyme whose
      composition is most likely alpha 6 beta 6.
  reference_review:
    review_notes: Historical purified Salmonella enzyme, with inactive separated subunits and active assembled
      alpha6-beta6 enzyme. Cached abstract only; exact construct termini are not available. Frozen UniProt
      assigns the study to LT2, but the older cloned sequences differ from current reference sequences;
      do not equate every residue of the historical preparation with current canonical records. Modern
      LT2 localization evidence independently supports gene/strain mapping.
- id: PMID:2197274
  title: Cloning, sequencing, and expression of the genes encoding the adenosylcobalamin-dependent ethanolamine
    ammonia-lyase of Salmonella typhimurium.
  findings: []
  reference_review:
    review_notes: Historical cloning of the two Salmonella subunits. The abstract reports 452/286 residues,
      whereas current LT2 EutB/EutC are 453/298 residues; frozen UniProt records explicit conflicts against
      old AAA27063/AAA27062 translations. Used for enzyme/gene identity and reaction class, not exact
      current construct sequence.
- id: PMID:20519496
  title: Crystal structures of ethanolamine ammonia-lyase complexed with coenzyme B12 analogs and substrates.
  findings:
  - statement: The E. coli homolog separates alpha-subunit catalysis from beta-subunit cofactor support.
    supporting_text: The active site is in the (beta/alpha)(8) barrel of the alpha-subunit; the beta-subunit
      covers the lower part of the cobalamin that is bound in the interface of the alpha- and beta-subunits.
  reference_review:
    review_notes: E. coli structural study with an N-terminally truncated beta subunit and cobalamin analogs/substrates.
      Active-site and interfacial cofactor organization are homolog inferences for SALTY, supported by
      frozen HAMAP/domain assignments; not a Salmonella crystal structure or a measurement of its native
      assembly stoichiometry.
- id: PMID:22428024
  title: Engineered protein nano-compartments for targeted enzyme localization.
  findings: []
  reference_review:
    review_notes: 'Full text: LT2-derived EutC1–19 reporter targeting in Salmonella, plus recombinant
      LT2 shell proteins in E. coli. Signal-peptide reporters and recombinant shells are distinguished
      from direct localization of unmodified native full-length EutC.'
- id: PMID:27063436
  title: Engineering formation of multiple recombinant Eut protein nanocompartments in E. coli.
  findings: []
  reference_review:
    review_notes: 'Full text: native LT2 EutQ deletion and recombinant E. coli C2566 nanocompartments,
      with EutC1–19 cargo reporters and EutM/EutQ interactions. It is not restricted to the recombinant
      host named in the title.'
- id: PMID:27450681
  title: Encapsulation of multiple cargo proteins within recombinant Eut nanocompartments.
  findings: []
  reference_review:
    review_notes: Cached abstract and curated UniProt document EutC/EutE targeting peptides and EutS contacts
      in recombinant nanocompartments. The precise native LT2 arrangement is evaluated using later 2025
      imaging and EutQ interaction studies; do not infer the complete native assembly mechanism from minimal
      recombinant shells.
- id: PMID:41032589
  title: Molecular basis of the biogenesis of a protein organelle for ethanolamine utilization.
  findings:
  - statement: Native LT2 EutC/EutE targeting peptides are needed for incorporation of the corresponding
      cargo.
    supporting_text: without the EPs, EutBC and EutE could not be incorporated into Eut BMCs.
  reference_review:
    review_notes: 'Full text: native LT2 fluorescently tagged proteins, scarless genomic deletions and
      EutQ/cargo peptide interactions support EutBC and EutE incorporation. EutC2–19 and EutE2–21 deletions
      disrupt incorporation. This supersedes the 2013 external-EutBC spatial hypothesis; it does not invalidate
      all cofactor-recycling physiology in that older paper.'
- id: PMID:35785499
  title: Localization and interaction studies of the Salmonella enterica ethanolamine ammonia-lyase (EutBC),
    its reactivase (EutA), and the EutT corrinoid adenosyltransferase.
  findings:
  - statement: LT2 immunogold localizes EAL to metabolosome-associated regions.
    supporting_text: EAL was detected clustered to electron-dense regions in the cell, which we identified
      as eut metabolosomes
  reference_review:
    review_notes: 'Full text: LT2-derived JE6583 immunogold EAL association, EutA/EAL interactions and
      cognate complementation. The reported EutB peptide16–23 DVKEVLAK matches the frozen sequence. The
      printed EutC peptide128SEISK133 has five residues for six coordinates and does not exactly match
      current128–133 SEISDK; this is not used as sequence-identical construct proof.'
- id: PMID:23585538
  title: Evidence that a metabolic microcompartment contains and recycles private cofactor pools.
  findings: []
  reference_review:
    review_notes: The external-EutBC arrangement was an explicitly inferential genetic model, superseded
      for LT2 by later localization and targeting studies. Cofactor-recycling hypotheses remain distinct
      from the rejected spatial placement.
- id: file:SALTY/eutB/eutB-uniprot.txt
  title: Frozen UniProt record for Salmonella Typhimurium LT2 eutB (P19264)
  findings: []
