taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: EutB is the catalytic large subunit of the adenosylcobalamin-dependent ethanolamine ammonia-lyase
  of Salmonella Typhimurium LT2. In the assembled EutB/EutC enzyme it converts ethanolamine to acetaldehyde
  and ammonium, initiating ethanolamine catabolism. Its active-site barrel and substrate/cofactor organization
  are conserved with the structurally characterized E. coli enzyme. The isolated Salmonella subunits are
  inactive; catalytic assignment to EutB does not imply autonomy from EutC. The enzyme is incorporated
  into ethanolamine microcompartments through EutC-associated targeting and interacts with the EutA reactivase.
