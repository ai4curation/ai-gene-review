  evidence_type: IC
  original_reference_id: PMID:21934659
  qualifier: enables
  review:
    summary: FliJ binds FlhA and activates efficient membrane-potential-driven protein export.
    action: NEW
    reason: Direct binding, interaction-disrupting deletions, suppressors and export assays establish
      noncovalent activation of the export gate. This is distinct from motor torque and does not assign
      ATP hydrolysis to FliJ. The tested SJW strain backgrounds are distinguished from the LT2 reference
      protein; an exact structural sequence bridge supports target identity. IC records the curated cross-background
      inference to the LT2 reference rather than labeling every SJW functional assay as native LT2 IDA.
    supported_by:
    - *id001
