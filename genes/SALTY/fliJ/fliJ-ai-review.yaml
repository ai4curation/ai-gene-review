  review:
    summary: FliJ activates flagellar export rather than generating flagellar motor torque.
    action: REMOVE
    reason: The term includes flagellar torque and is not eukaryote-specific. However, FliJ is an export-gate
      regulator and central stalk of the export ATPase assembly, not a demonstrated force-generating cytoskeletal
      motor. Its distinct binding-dependent activator activity is proposed separately from this incorrect
      motor-function mapping.
