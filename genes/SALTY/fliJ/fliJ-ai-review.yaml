      about by the FliH-FliI complex, which turns the export gate into a highly efficient, Δψ-driven protein
      export apparatus.
  reference_review:
    review_notes: Native Salmonella SJW backgrounds, tagged interactions, deletions and suppressors are
      distinguished. The experiments support binding-dependent export activation; they are not all native
      LT2 measurements.
