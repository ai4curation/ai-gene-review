taxon:
  id: NCBITaxon:99287
  label: Salmonella enterica subsp. enterica serovar Typhimurium str. LT2
description: FliJ is the small coiled-coil central stalk of the Salmonella flagellar export ATPase assembly.
  It promotes formation of FliI hexamer rings and binds the cytoplasmic linker of FlhA to activate efficient
  membrane-potential-driven export of axial flagellar proteins. FliJ also recruits unladen export chaperones
  for recycling. Its export-support role is distinct from torque generation by the flagellar motor and
  from autonomous ATP hydrolysis. It associates with the cytoplasmic face of the inner-membrane export
  apparatus.
