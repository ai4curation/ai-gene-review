- term:
    id: GO:0015986
    label: proton motive force-driven ATP synthesis
  evidence_type: IEA
  original_reference_id: GO_REF:0000108
  qualifier: involved_in
  supporting_entities:
  - GO:0046933
  review:
    summary: >-
      A logical inference (GO_REF:0000108) from the GO:0046933 ATP synthase
      molecular function that the IBA row asserts. InvC consumes ATP to power
      protein export; it does not make ATP, and the injectisome contains no
      Fo-like membrane sector that could couple proton flux to phosphorylation.
    action: REMOVE
    reason: >-
      The source molecular function is itself wrong for this protein, so the
      inferred process is wrong too. No type III secretion ATPase has ever been
      shown to synthesize ATP; the family's ATPase activity is insensitive to
      F-, V- and P-type ATPase inhibitors, and where a type III system uses the
      proton motive force, the protons pass through the membrane export gate,
      not through the ATPase.
    supported_by:
    - reference_id: PMID:8045880
      supporting_text: purified preparations of InvC showed significant ATPase activity
    - reference_id: PMID:8943245
      supporting_text: The activity was not affected by inhibitors of the F-, V- or
        P-type ATPases
    - reference_id: PMID:21934659
      supporting_text: the export gate complex by itself is a proton-protein antiporter
