- term:
    id: GO:0045259
    label: proton-transporting ATP synthase complex
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: part_of
  supporting_entities:
  - AGI_LocusCode:AT5G08680
  - AGI_LocusCode:AT5G08690
  - PANTHER:PTN008558586
  - PomBase:SPAC222.12c
  - RGD:621368
  - SGD:S000003882
  - UniProtKB:P00829
  - UniProtKB:P06576
  - UniProtKB:P0ABB4
  - UniProtKB:P26527
  - UniProtKB:P83483
  review:
    summary: >-
      The IBD behind this row sits at PANTHER node PTN008558586 in PTHR15184.
      That node is a duplication node: one child, PTN008558588, is the genuine
      F1-beta clade (subfamilies SF51/74/75/76/80/82/83/85) from which every seed
      comes (E. coli AtpD, human ATP5F1B, yeast ATP2, S. pombe atp2, plant and rat
      F1 subunits); the other child, PTN000390097, is the bacterial export-ATPase
      clade containing SF9 (SPI-1 T3SS ATPase, this protein), SF62 (SPI-2 ATPase)
      and SF81 (flagellar FliI). Asserting the F1 complex at the duplication node
      makes it leak across the paralogy boundary into export ATPases. InvC is a
      member of an injectisome, which has no Fo sector, no c-ring and no proton
      half-channels; it is in the cytoplasmic sorting platform, not in a
      two-sector ATP synthase.
    action: REMOVE
    reason: >-
      The node placement is the problem, not the number of donors: the IBD should
      sit on the F1-beta child PTN008558588, whose members supply all the
      experimental evidence, rather than on the duplication node that also
      subtends the T3SS/flagellar export ATPases. The complex InvC actually
      belongs to is the type III secretion system complex (GO:0030257), which is
      separately annotated and experimentally established here.
    supported_by:
    - reference_id: PMID:28283062
      supporting_text: InvC was located within the hexameric nave of the wheel with
        its carboxy-terminus facing the toroidal-shape structure formed by the cytoplasmic
        domain of InvA
    - reference_id: file:SALTY/sctN1/sctN1-notes.md
      supporting_text: PTN008558586 is a **DUPLICATION** node
    propagation_review:
      root_cause: PROPAGATION_BAD
      failure_modes:
      - WRONG_ORTHOLOG_OR_PARALOG
      - COMPARTMENT_OR_COMPLEX_MISMATCH
      residue_claims_not_applicable: >-
        The argument is about phylogenetic node placement and complex membership,
        not about gain or loss of particular residues; InvC retains a functional
        Walker-type catalytic site and hydrolyses ATP.
      source_entities:
      - source_id: PANTHER:PTN008558586
        source_label: PTHR15184 duplication node above the F1-beta / export-ATPase split
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          IBD node for GO:0045259. Its children are PTN008558588 (F1-beta clade)
          and PTN000390097 (export ATPases, SF9/SF62/SF81); the term should sit on
          the former.
      - source_id: UniProtKB:P0ABB4
        source_label: E. coli atpD (F1 beta subunit)
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Genuine F1-beta seed; its complex is the Fo-F1 ATP synthase, absent
          from the injectisome.
      - source_id: UniProtKB:P06576
        source_label: human ATP5F1B
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: Mitochondrial F1-beta seed, outside the export-ATPase clade.
      - source_id: SGD:S000003882
        source_label: yeast ATP2
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: F1-beta seed.
- term:
    id: GO:0046034
    label: ATP metabolic process
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004100
  review:
    summary: >-
      An InterPro2GO mapping from IPR004100, the F1/V1/A1 alpha/beta N-terminal
      domain, whose GO mapping reflects rotary ATP synthase biology. InvC does
      hydrolyse ATP, but only as the energy source for substrate unfolding and
      export; it plays no part in cellular ATP synthesis or ATP turnover as a
      metabolic pathway.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      Technically true but uninformative and misleading in context. GO captures
      energy-coupled ATP hydrolysis through the molecular function (GO:0016887,
      GO:0008564), not as participation in ATP metabolism, and the domain-based
      mapping carries ATP synthase meaning over to an export ATPase.
    supported_by:
    - reference_id: PMID:16208377
      supporting_text: InvC induces chaperone release from and unfolding of the cognate
        secreted protein in an ATP-dependent manner
- term:
    id: GO:0046933
    label: proton-transporting ATP synthase activity, rotational mechanism
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: contributes_to
  supporting_entities:
  - PANTHER:PTN008558586
  - PomBase:SPAC222.12c
  - SGD:S000003882
  - UniProtKB:P06576
  - UniProtKB:P0ABB4
  review:
    summary: >-
      Same source as the GO:0045259 row: an IBD at the PTHR15184 duplication node
      PTN008558586, seeded exclusively by F1-beta subunits. P0A1B9 is classified
      in PTHR15184:SF9, the SPI-1 T3SS ATPase subfamily, which descends from the
      export-ATPase child PTN000390097, not from the F1-beta child PTN008558588.
      The export ATPases diverged from F1 alpha/beta before the synthase function
      of the F1-beta clade and have no Fo partner. InvC hydrolyses ATP; ATP
      synthesis by it has never been observed, and the family's ATPase activity
      is insensitive to F-, V- and P-type ATPase inhibitors.
    action: REMOVE
    reason: >-
      Paralog over-propagation caused by placing the F1-beta IBD at a duplication
      node. The assertion is also contradicted biologically: InvC neither
      synthesizes ATP nor transports protons, and it has no transmembrane
      segment. Even under the rotary models proposed for the homologous
      FliI6-FliJ ring, the ring hydrolyses ATP to drive protein export, and
      proton flux in type III systems runs through the membrane export gate.
    supported_by:
    - reference_id: PMID:8045880
      supporting_text: InvC showed significant similarity to a protein family which
        shares sequence homology with the catalytic beta subunit of the F0F1 ATPase
        from a number of microorganisms
    - reference_id: PMID:8943245
      supporting_text: The activity was not affected by inhibitors of the F-, V- or
        P-type ATPases
    - reference_id: PMID:21934659
      supporting_text: the export gate complex by itself is a proton-protein antiporter
- term:
    id: GO:1902600
    label: proton transmembrane transport
  evidence_type: IEA
  original_reference_id: GO_REF:0000002
  qualifier: involved_in
  supporting_entities:
  - InterPro:IPR004100
  review:
    summary: >-
      An InterPro2GO mapping from the F1/V1/A1 alpha/beta N-terminal domain.
      InvC is a soluble protein with no transmembrane segment; it is only
      peripherally attached to the inner membrane through protein-protein
      contacts with the injectisome. Type III export can use the proton motive
      force, but proton movement happens in the membrane export gate
      (InvA/FlhA-type components), not in the ATPase.
    action: REMOVE
    reason: >-
      The domain-based mapping transfers rotary ATP synthase biology to an export
      ATPase. Assigning proton transport to InvC confuses a system-level
      dependence on the proton motive force with participation of this subunit in
      moving protons. There is no evidence for any proton-conducting activity of
      InvC.
    supported_by:
    - reference_id: PMID:15060043
      supporting_text: characteristic of a peripherally associated membrane protein
    - reference_id: PMID:21934659
      supporting_text: the export gate complex by itself is a proton-protein antiporter
    - reference_id: PMID:18216859
      supporting_text: the flagellar secretion apparatus functions as a proton-driven
        protein exporter
