  title: Molecular Organization of Soluble Type III Secretion System Sorting Platform
    Complexes.
  findings:
  - statement: >-
      Soluble SpaO/SpaOC/OrgB/InvC complexes were reconstituted and their
      stoichiometry and L-shaped organization determined, matching the sorting
      platform pods seen in situ.
    supporting_text: Here we reconstitute soluble complexes of the Salmonella Typhimurium
      sorting platform proteins including the ATPase InvC, the regulator OrgB, the
      protein SpaO and a recently identified subunit SpaOC
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract only in the cache; supports the complex composition.
- id: PMID:31393998
  title: Structural analysis of ligand-bound states of the Salmonella type III secretion
    system ATPase InvC.
  findings:
  - statement: >-
      Crystal structures of InvC lacking the oligomerization domain, alone and
      with ATPgammaS or ADP, define the nucleotide site and show ATP-dependent
      remodelling of two pore-facing loops that are essential for function.
    supporting_text: Both loops face the central pore of the predicted InvC cylinder
      and are essential for the function of the T3SS ATPase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Structural confirmation of ATP binding and of a
      pore-centred, translocase-like mechanism.
- id: PMID:8943245
  title: Enzymatic characterization of FliI. An ATPase involved in flagellar assembly
    in Salmonella typhimurium.
  findings:
  - statement: >-
      The homologous flagellar export ATPase FliI is a Mg2+-dependent ATPase
      whose activity is unaffected by F-, V- and P-type ATPase inhibitors.
    supporting_text: The activity was not affected by inhibitors of the F-, V- or
      P-type ATPases
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Paralog (flagellar FliI, same organism). Used only for the family-level
      point that these export ATPases are enzymatically distinct from F-type
      ATP synthases.
- id: PMID:21934659
  title: An energy transduction mechanism used in bacterial flagellar type III protein
    export.
  findings:
  - statement: >-
      In the flagellar type III system the membrane export gate complex is itself
      a proton-protein antiporter; the soluble ATPase complex acts upstream of
      that step.
    supporting_text: the export gate complex by itself is a proton-protein antiporter
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Flagellar paralog system. Cited to locate proton flux in the membrane
      export gate rather than in the export ATPase.
- id: PMID:18216859
  title: Energy source of flagellar type III secretion.
  findings:
  - statement: >-
      The flagellar type III secretion apparatus is a proton-driven protein
      exporter; ATP hydrolysis by the export ATPase is not the force that drives
      translocation.
    supporting_text: the flagellar secretion apparatus functions as a proton-driven
      protein exporter
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: >-
      Flagellar paralog system, abstract only. Context for why proton-transport
      terms belong to the gate, not the ATPase.
- id: file:SALTY/sctN1/sctN1-notes.md
  title: Curation notes for Salmonella SPI-1 T3SS ATPase InvC (SctN1)
  findings:
  - statement: >-
      PANTHER node analysis: the GO:0046933/GO:0045259 IBDs sit at PTN008558586,
      a duplication node above the split between the F1-beta clade
      (PTN008558588) and the bacterial export-ATPase clade (PTN000390097,
      subfamilies SF9/SF62/SF81).
    supporting_text: PTN008558586 is a **DUPLICATION** node
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: >-
      Node placement taken from the repository's cached PAINT table
      (interpro/panther/PTHR15184/PTHR15184-paint.tsv) and
      projects/TREEGRAFTER/rotary_atpase/node_placement.tsv.
core_functions:
- description: >-
    ATP-hydrolysing engine of the SPI-1 injectisome sorting platform: it
    recognizes chaperone-bound secretion substrates, releases the chaperone and
    unfolds the effector, and feeds it to the InvA export gate, thereby
    energizing type III protein export and epithelial-cell invasion.
  molecular_function:
    id: GO:0008564
    label: protein-exporting ATPase activity
  directly_involved_in:
  - id: GO:0030254
    label: protein secretion by the type III secretion system
  locations:
  - id: GO:0005737
    label: cytoplasm
  in_complex:
    id: GO:0030257
    label: type III protein secretion system complex
  supported_by:
  - reference_id: PMID:16208377
    supporting_text: InvC induces chaperone release from and unfolding of the cognate
      secreted protein in an ATP-dependent manner
  - reference_id: PMID:8045880
    supporting_text: purified preparations of InvC showed significant ATPase activity
  - reference_id: PMID:28283062
    supporting_text: InvC was located within the hexameric nave of the wheel with
      its carboxy-terminus facing the toroidal-shape structure formed by the cytoplasmic
      domain of InvA
proposed_new_terms: []
suggested_questions:
- question: >-
    Should the PTHR15184 IBDs for GO:0046933 and GO:0045259 be moved from the
    duplication node PTN008558586 to its F1-beta child PTN008558588, so that ATP
    synthase terms stop propagating into the export-ATPase clade PTN000390097
    (PTHR15184:SF9 SPI-1 T3SS ATPase, SF62 SPI-2 ATPase, SF81 flagellar FliI)?
    Alternatively, should an IRD or NOT annotation be placed at PTN000390097?
    The same question applies to the TreeGrafter graft nodes PTN000390110 and
    PTN001807733, which deliver the same terms as IEA (GO_REF:0000118) to other
    members of this clade.
- question: >-
    Should InterPro2GO mappings from IPR004100 (F1/V1/A1 alpha/beta N-terminal
    domain) to GO:0046034 and GO:1902600 be restricted so that they do not fire
    on entries that also match IPR005714 (T3SS/flagellar export ATPase
    FliI/YscN)? That single rule would remove the ATP-metabolism and
    proton-transport rows from every SctN and FliI protein at once.
- question: >-
    Is there a GO term that properly captures the ATP-dependent chaperone-release
    and substrate-unfolding activity of type III export ATPases? GO:0043335
    protein unfolding exists but is not used for any T3SS or flagellar export
    ATPase in GOA, so either the convention is that GO:0008564 subsumes it, or
    the unfoldase step of type III secretion is currently unrepresentable.
- question: >-
    How is InvC ATPase activity regulated in vivo, given that OrgB (SctL) is the
    FliH-like partner and that the free protein is largely monomeric until it is
    assembled on the platform? Does OrgB inhibit or activate InvC, as FliH does
    for FliI?
suggested_experiments:
- description: >-
    Measure the contribution of ATP hydrolysis versus proton motive force to
    SPI-1 secretion directly in Salmonella, by comparing secretion of SipB/SipC/
    SptP in wild type, ATPase-dead invC point mutants, and cells treated with
    protonophores, including a test for suppressor mutations in invA/spaS that
    bypass the ATPase (the flagellar system has such bypass suppressors).
  experiment_type: bacterial genetics and secretion assay
- description: >-
    Reconstitute purified hexameric InvC (full length, on a SpaO/OrgB scaffold)
    with a chaperone-effector pair and measure single-turnover chaperone release
    and unfolding kinetics, plus the ATP dependence of the pore-loop and
    two-helix-finger mutants, to quantify the unfoldase step attributed to InvC.
  experiment_type: in vitro reconstitution and enzymology
- description: >-
    Test directly whether InvC can conduct protons or synthesize ATP: assay
    purified InvC (and the InvC-InvI stalk complex) reconstituted into liposomes
    for proton translocation and for ATP synthesis under an imposed proton
    gradient, as a formal falsification of the propagated ATP synthase
    annotations.
  experiment_type: proteoliposome biophysics
