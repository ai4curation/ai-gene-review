- id: PMID:8045880
  title: 'Molecular and functional characterization of the Salmonella typhimurium
    invasion genes invB and invC: homology of InvC to the F0F1 ATPase family of proteins.'
  findings:
  - statement: >-
      Purified InvC has ATPase activity; mutation of the catalytic P-loop residue
      (K165E) abolishes activity and complementation. invC mutants cannot invade
      cultured epithelial cells. InvC is similar to the F0F1 ATPase beta subunit.
    supporting_text: purified preparations of InvC showed significant ATPase activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      The founding paper on this protein; the source of the EC 7.4.2.8
      assignment in UniProt. Abstract only in the cache (full text at PMC196268).
      It is also the origin of the "homology to F0F1 ATPase" framing that later
      propagated into ATP synthase GO terms; the paper itself concludes only that
      InvC energizes protein export.
- id: PMID:14762212
