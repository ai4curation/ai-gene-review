    by external guide sequences.
  findings:
  - statement: >-
      Knockdown of invC mRNA depletes InvC protein and reduces type III secretion
      and host cell invasion.
    supporting_text: expression in Salmonella results in invC mRNA and InvC protein
      depletion, decreased type III secretion and interference with host cell invasion
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Gene-specific loss-of-function support for the secretion phenotype.
- id: PMID:15060043
  title: Genetic analysis of the Salmonella enterica type III secretion-associated
    ATPase InvC defines discrete functional domains.
  findings:
  - statement: >-
      Active-site mutants of InvC lack ATPase activity and act as dominant
      negatives. InvC fractionates with the membrane as a peripheral protein,
      forms oligomers consistent with a hexamer, and interacts with OrgB.
    supporting_text: InvC was localized almost exclusively in the membrane fraction
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: >-
      Full text cached. Establishes the separation of catalytic, membrane-binding
