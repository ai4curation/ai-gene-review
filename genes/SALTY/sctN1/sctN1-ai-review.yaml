id: P0A1B9
gene_symbol: sctN1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:99287
  label: Salmonella typhimurium (strain LT2 / SGSC1412 / ATCC 700720)
description: >-
  SctN1 (InvC, STM2894) is the ATPase of the Salmonella pathogenicity island 1
  (SPI-1) type III secretion system, the injectisome that delivers effector
  proteins into intestinal epithelial cells. It is a soluble, Walker-type P-loop
  ATPase of the F1 alpha/beta-related export ATPase family that sits in the
  cytoplasmic sorting platform at the base of the injectisome: SpaO pods are
  linked by OrgB (SctL) spokes to a hexameric InvC ring, whose C-terminal face
  points at the cytoplasmic domain of the export gate protein InvA, with InvI
  (SctO) as the central stalk. InvC recognizes chaperone-bound secretion
  substrates, and uses ATP hydrolysis to release the chaperone and unfold the
  effector so it can enter the narrow export channel; pore-lining loops and a
  two-helix-finger motif of the ring, features shared with ATP-driven protein
  translocases and unfoldases, are essential for this. Loss of InvC, or of its
  ATPase activity, abolishes SPI-1 secretion and epithelial-cell invasion while
  leaving attachment intact. InvC is peripherally associated with the inner
  membrane through protein-protein contacts rather than a transmembrane segment.
  Despite its ancestry as a paralog of the F1-ATP synthase beta subunit, it
  neither synthesizes ATP nor conducts protons: the injectisome has no Fo sector,
  and proton motive force used by type III systems is transduced by the membrane
  export gate, not by the ATPase.
