    supporting_text: The full-length protein or only the functional domain hydrolyzed 33 P-labeled c-di-GMP
      to GMP
suggested_questions:
- question: Does Borrelia PdeB release pGpG during turnover, and what are the separate kinetic constants
    for ring opening and linear-dinucleotide hydrolysis?
