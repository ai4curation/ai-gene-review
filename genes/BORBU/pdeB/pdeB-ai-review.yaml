id: O50161
gene_symbol: pdeB
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224326
  label: Borreliella burgdorferi B31
description: PdeB is the HD-GYP cyclic di-GMP phosphodiesterase of Borreliella burgdorferi. Purified full-length
  enzyme and its isolated HD-GYP domain degrade cyclic di-GMP to GMP, with activity enhanced by manganese.
  PdeB controls second-messenger turnover and swimming flex frequency, and contributes to survival in
  feeding ticks; its deletion does not substantially impair infection after direct needle inoculation
  of mice.
references:
- id: PMID:21670168
  title: Analysis of the HD-GYP domain cyclic dimeric GMP phosphodiesterase reveals a role in motility
    and the enzootic life cycle of Borrelia burgdorferi.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected. Native experiments use the B31-derived A3-K2 delta-bbe002
      background; assays establish total c-di-GMP hydrolysis and Mn-enhanced activity. No inference from
      the retracted RpfG study is needed.
  findings:
  - statement: Purified full-length PdeB and its isolated HD-GYP domain hydrolyse c-di-GMP with GMP as
      the measured endpoint. Ring opening is inferred, not a separately measured release of pGpG.
    supporting_text: The full-length protein or only the functional domain hydrolyzed 33 P-labeled c-di-GMP
      to GMP
- id: PMID:24822172
  title: The cyclic-di-GMP signaling pathway in the Lyme disease spirochete, Borrelia burgdorferi.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review for circuit context; catalytic evidence is primary PMID:21670168.
  findings:
  - statement: Borrelia encodes two distinct phosphodiesterases; the HD-GYP branch has a different enzootic-cycle
      phenotype from the EAL branch.
existing_annotations:
- term:
    id: GO:0071111
    label: cyclic-guanylate-specific phosphodiesterase activity
  evidence_type: IC
  original_reference_id: PMID:21670168
  review:
    summary: Infer cyclic di-GMP ring opening as part of the directly demonstrated degradation to GMP.
    action: NEW
    reason: The seed has no GOA rows. Purified PdeB converts cyclic di-GMP to GMP, so opening one cyclic
      phosphodiester bond is an intrinsic step of the demonstrated hydrolysis. GO:0071111 describes only
      that first c-di-GMP-to-pGpG step; it is proposed as IC because this paper measures GMP as the final
      product, not isolated release or accumulation of pGpG. This does not claim that GMP is the direct
      product specified by GO:0071111. The primary assay concerns the same chromosomal BB0374 in a B31-derived
      background; strain-specific tick phenotypes are kept separate.
    supported_by:
    - reference_id: PMID:21670168
      supporting_text: The full-length protein or only the functional domain hydrolyzed 33 P-labeled c-di-GMP
        to GMP
core_functions:
- description: Degrade cyclic di-GMP through the HD-GYP domain, with GMP as the observed endpoint. The
    GO activity captures the inferred ring-opening step; subsequent hydrolysis to GMP is part of the experimentally
    established overall reaction.
  molecular_function:
    id: GO:0071111
    label: cyclic-guanylate-specific phosphodiesterase activity
  supported_by:
