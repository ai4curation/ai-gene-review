taxon:
  id: NCBITaxon:224326
  label: Borreliella burgdorferi B31
description: LysS is the class I lysyl-tRNA synthetase of Borreliella burgdorferi B31. It uses ATP to
  ligate lysine to tRNA(Lys), performing the same charging chemistry as the structurally unrelated class
  II lysyl-tRNA synthetases found in many bacteria. The Borrelia enzyme recognizes tRNA(Lys) anticodon
  identity elements and is expressed during native growth.
