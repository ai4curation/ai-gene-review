  review:
    summary: LysS has defined amino-acid and tRNA specificity.
    action: MODIFY
    reason: The broad ligase claim is correct. Refine it to the supported lysine charging activities,
      preserving every demonstrated tRNA substrate. These replacements express the specific chemistry
      rather than rejecting the general function. The current primary gene symbol is lysS. Enzyme activity
      was measured after expression in E. coli; native Borrelia mRNA establishes expression, not an independent
