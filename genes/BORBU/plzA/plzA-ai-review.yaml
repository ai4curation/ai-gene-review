id: O51675
gene_symbol: plzA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224326
  label: Borreliella burgdorferi B31
description: PlzA is a cyclic di-GMP receptor with an extended PilZ architecture in Borreliella burgdorferi.
  Ligand binding reorganizes its two-domain structure and modulates nucleic-acid interactions. Recombinant
  PlzA assists RNA annealing and, in its unliganded state under tested conditions, RNA strand displacement
  and unwinding. DNA binding has also been demonstrated in the presence of cyclic di-GMP. The physiological
  contribution of these in vitro nucleic-acid activities to gene expression across the tick-mammal life
  cycle remains unresolved; native targets and the ligand dependence of RNA binding require further study.
references:
- id: PMID:20030712
  title: 'Identification and molecular characterization of a cyclic-di-GMP effector protein, PlzA (BB0733):
    additional evidence for the existence of a functional cyclic-di-GMP regulatory network in the Lyme
    disease spirochete, Borrelia burgdorferi.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary publication identity checked; assay evidence and experimental strain distinguished
      from downstream phenotypes.
  findings:
  - statement: B31 PlzA binds c-di-GMP specifically; mutation of conserved PilZ arginines eliminates binding.
    supporting_text: Substitution of specific Arg residues within the PilZ domain completely abolished
      c-di-GMP binding.
- id: PMID:34117751
  title: 'High-resolution crystal structure of the Borreliella burgdorferi PlzA protein in complex with
    c-di-GMP: new insights into the interaction of c-di-GMP with the novel xPilZ domain.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary structural paper inspected; PDB 7MIE is cross-referenced by the B31 UniProt
      entry.
  findings:
  - statement: The c-di-GMP-bound crystal structure establishes an extended two-domain PilZ architecture
      and locates the ligand-binding site.
- id: PMID:37086029
  title: c-di-GMP regulates activity of the PlzA RNA chaperone from the Lyme disease spirochete.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary paper inspected, including B31-5A4 cloning methods and synthetic RNA assays.
      Native regulatory targets remain hypotheses; RNA activities are not extrapolated to ATP-dependent
      helicase activity.
  findings:
  - statement: B31-5A4 recombinant PlzA accelerates RNA annealing in both ligand states, whereas apo-PlzA
      additionally mediates strand displacement and unwinding.
    supporting_text: Holo- and apo-PlzA bind RNA and accelerate RNA annealing, while only apo-PlzA can
      strand displace and unwind double-stranded RNA.
- id: PMID:38527857
  title: Borrelia burgdorferi PlzA is a cyclic-di-GMP dependent DNA and RNA binding protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Published abstract directly supports nucleic-acid binding and ligand dependence. Associated
      full author manuscript at PMC9915621 was inspected for methods and comparison with PMID:37086029;
      it identifies B31-derived recombinant PlzA. Differences in substrates, concentrations and assay
      methods remain unresolved.
  findings:
  - statement: Direct DNA and RNA binding was reported with c-di-GMP dependence; this differs from the
      apo-RNA binding reported in the 2023 study.
    supporting_text: Here, we report that PlzA can bind DNA and RNA and that nucleic acid binding requires
      c-di-GMP
- id: PMID:24822172
  title: The cyclic-di-GMP signaling pathway in the Lyme disease spirochete, Borrelia burgdorferi.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Historical comparative review; later primary studies supersede its uncertainty about
      the effector mechanism.
  findings:
  - statement: PlzA is the conserved protein receptor in the minimal Borrelia c-di-GMP circuit.
existing_annotations:
- term:
    id: GO:0035438
    label: cyclic-di-GMP binding
  evidence_type: IDA
  original_reference_id: PMID:20030712
  review:
    summary: PlzA directly and specifically binds cyclic di-GMP.
    action: NEW
    reason: No GOA rows were present in the seed. Direct ligand-binding and site-directed mutagenesis
      of B31-derived recombinant PlzA establish this molecular function; the later cocrystal independently
      confirms the interaction. A PilZ-domain label alone is not the evidence.
    supported_by:
