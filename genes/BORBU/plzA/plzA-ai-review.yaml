      supporting_text: Substitution of specific Arg residues within the PilZ domain completely abolished
        c-di-GMP binding.
- term:
    id: GO:0140691
    label: RNA folding chaperone
  evidence_type: IDA
  original_reference_id: PMID:37086029
  review:
    summary: PlzA assists RNA structural rearrangements in vitro.
    action: NEW
    reason: Direct experiments on recombinant B31-5A4 PlzA measure RNA annealing, strand displacement
      and unwinding. This satisfies the RNA-folding-chaperone definition without asserting ATP-dependent
      RNA helicase activity or a proven endogenous RNA target. Apo and holo states differ in unwinding
      under these assay conditions; PMID:38527857 reports different ligand dependence of RNA binding,
      so that dependence is not generalized across substrates and assays. This activity is distinct from
      the cyclic-di-GMP receptor activity and DNA binding. This in vitro activity is retained as a supported
      molecular-function proposal but is not designated a conserved native core function while physiological
      targets and significance remain unresolved.
    supported_by:
    - reference_id: PMID:37086029
      supporting_text: Holo- and apo-PlzA bind RNA and accelerate RNA annealing, while only apo-PlzA can
        strand displace and unwind double-stranded RNA.
- term:
    id: GO:0003677
    label: DNA binding
  evidence_type: IDA
  original_reference_id: PMID:38527857
  review:
    summary: PlzA binds DNA in the presence of cyclic di-GMP.
    action: NEW
    reason: 'The primary study directly assays DNA binding and maps the principal nucleic-acid interaction
      to the N-terminal domain. The associated full manuscript identifies a B31 plzA construct. The broad
      DNA-binding term is as precise as warranted: sequence-selective transcription-factor activity and
      a specific transcriptional output are not inferred merely from DNA binding. No seeded row or replacement
      already covers this molecular function. This in vitro activity is retained as a supported molecular-function
      proposal but is not designated a conserved native core function while physiological targets and
      significance remain unresolved.'
    supported_by:
    - reference_id: PMID:38527857
      supporting_text: Here, we report that PlzA can bind DNA and RNA and that nucleic acid binding requires
        c-di-GMP
core_functions:
- description: Bind cyclic di-GMP through the extended PilZ architecture, coupling ligand occupancy to
    changes in receptor conformation.
  molecular_function:
    id: GO:0035438
    label: cyclic-di-GMP binding
  supported_by:
  - reference_id: PMID:20030712
    supporting_text: Substitution of specific Arg residues within the PilZ domain completely abolished
      c-di-GMP binding.
suggested_questions:
- question: Which endogenous RNA substrates are remodelled by PlzA, and how do RNA sequence, metal, protein
    preparation and ligand concentration explain the differing apo/holo binding results in PMID:37086029
    and PMID:38527857?
- question: Does c-di-GMP-dependent DNA binding directly regulate transcription at native target loci,
    or does PlzA primarily act through RNA and associated factors?
