  supporting_entities:
  - InterPro:IPR001789
  review:
    summary: Rrp1 is the response-regulator output component of the Hk1 signalling system.
    action: ACCEPT
    reason: The receiver domain gates cyclase activity through phosphorylation. This is participation
      as a response regulator, not an assertion that Rrp1 itself is a histidine kinase.
    supported_by:
    - &id001
      reference_id: PMID:15716451
      supporting_text: DGC activity of the GGDEF domain protein Rrp1 from Borrelia burgdorferi is strictly
        dependent on phosphorylation status of its input receiver domain.
- term:
    id: GO:0005886
    label: plasma membrane
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: located_in
  supporting_entities:
  - PANTHER:PTN001233161
  review:
    summary: Replace the electronically propagated membrane assignment with the supported cytoplasmic
      location.
    action: MODIFY
    reason: 'Rogers et al. fractionated B31-derived cells: Rrp1 partitions with the protoplasmic cylinder,
      which contains both inner membrane and cytoplasmic proteins. Combined with absence of export signals
      or predicted transmembrane spans, the authors infer a cytoplasmic protein. This supports cytoplasm
      at the resolution available; it does not establish an intrinsic plasma-membrane protein. The TreeGrafter
      PTN assignment cannot override target-specific localization evidence.'
    supported_by:
    - reference_id: PMID:19210621
      supporting_text: indicate that Rrp1 is most likely a cytoplasmic protein.
    proposed_replacement_terms:
    - id: GO:0005737
      label: cytoplasm
- term:
    id: GO:0043709
    label: cell adhesion involved in single-species biofilm formation
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001233161
  review:
    summary: A specific adhesive role in single-species biofilm formation is not established for Rrp1.
    action: MARK_AS_OVER_ANNOTATED
    reason: Rrp1 synthesizes a signalling nucleotide; the B31-derived primary studies establish metabolic,
      motility and tick-survival effects rather than execution of cell attachment via adhesion molecules.
      GO:0043709 names that specific attachment step, not all c-di-GMP signalling. Propagation from other
      GGDEF proteins therefore exceeds the demonstrated output in this spirochete. This is not a claim
      that B. burgdorferi cannot aggregate or that Rrp1 could never influence adhesion.
    supported_by:
    - reference_id: PMID:19210621
      supporting_text: Rrp1 differs from Rrp2 in that it lacks a DNA-binding output domain, but carries
        an enzymatic GGDEF domain with diguanylate cyclase activity.
- term:
    id: GO:0052621
    label: diguanylate cyclase activity
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  qualifier: enables
  supporting_entities:
  - EC:2.7.7.65
  - PANTHER:PTN001233161
  review:
    summary: Rrp1 directly synthesizes c-di-GMP through its GGDEF domain.
    action: ACCEPT
    reason: Primary biochemical work establishes phosphorylation-dependent diguanylate cyclase activity.
      The present electronic claim is supported independently of the family annotation; the input receiver
      and catalytic GGDEF domains are also present in the B31 sequence.
    supported_by:
    - *id001
- term:
    id: GO:1902201
    label: negative regulation of bacterial-type flagellum-dependent cell motility
  evidence_type: IEA
  original_reference_id: GO_REF:0000118
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001233161
  review:
    summary: Rrp1 constrains swimming run speed in a B31-derived strain, while also supporting normal
      chemotaxis.
    action: KEEP_AS_NON_CORE
    reason: 'In B31 clone 5A4, rrp1 deletion increased run speed from 4.14 to 5.58 micrometres per second
      and reduced flexing; complementation restored wild-type behaviour. Thus the negative-regulation
      term is defensible for run speed, but must not be read as a general switch from motility to sessility:
      the same mutant has reduced swarm spread and chemotaxis. Keep this output as non-core relative to
      cyclase catalysis.'
    supported_by:
    - reference_id: PMID:21542866
      supporting_text: Motion-tracking revealed that B31-Δrrp1 had a faster run speed (5.58 μm sec−1)
        and a significantly decreased flex frequency (0.015 flexes sec−1).
