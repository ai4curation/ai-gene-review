id: O51380
gene_symbol: rrp1
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224326
  label: Borreliella burgdorferi B31
description: Rrp1 is the receiver-domain/GGDEF diguanylate cyclase of Borreliella burgdorferi. Phosphorylation
  of its receiver domain activates synthesis of the intracellular second messenger cyclic di-GMP. Rrp1
  is most likely cytoplasmic and couples the Hk1 signalling system to metabolic adaptation, chemotactic
  behaviour and survival in feeding ticks. Its output is enzymatic rather than direct DNA binding, with
  downstream responses mediated by cyclic di-GMP effectors.
