gene_symbol: pdeA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:224326
  label: Borreliella burgdorferi B31
description: PdeA is an EAL-family cyclic di-GMP phosphodiesterase of Borreliella burgdorferi. Its C-terminal
  EIL/EAL catalytic region opens cyclic di-GMP to the linear dinucleotide pGpG, thereby reducing second-messenger
  availability. In B31-derived cells PdeA helps maintain normal swimming reversals and supports successful
  mammalian infection, while its catalytic activity is distinct from the HD-GYP enzyme PdeB.
