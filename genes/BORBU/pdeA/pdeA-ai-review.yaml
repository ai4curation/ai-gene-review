  review:
    summary: PdeA catalyses cyclic di-GMP ring opening to pGpG.
    action: ACCEPT
    reason: The C-terminal 285-residue recombinant fragment, containing the EIL catalytic domain, directly
      hydrolysed c-di-GMP to pGpG with an apparent Km of 0.054 micromolar; full-length recombinant expression
      was unsuccessful. Gene deletion and complementation in B31-A3 support the activity in the native
      system. These independent assays support both the experimental row and its curated EC/Rhea mapping.
    supported_by:
    - reference_id: PMID:20444101
      supporting_text: The truncated recombinant protein hydrolyzed [33P]-cyclic-di-GMP to pGpG
