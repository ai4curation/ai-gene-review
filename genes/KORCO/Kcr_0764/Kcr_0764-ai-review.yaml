- id: PMID:18535141
  title: A korarchaeal genome reveals insights into the evolution of the Archaea.
  findings:
  - statement: K. cryptofilum is predicted to be an anaerobic peptide fermenter whose only terminal
      reduction is H2 production. The paper mentions methanogen-like hdrABC homologs only as a possible
      part of energy coupling, and it lists many missing coenzyme biosynthesis genes. It does not
      mention methyl-coenzyme M reductase, coenzyme M or coenzyme B.
    supporting_text: However, many genes are missing for coenzyme biosynthesis that are conserved in
      most of the other archaea.
  - statement: A single-subunit CO dehydrogenase lies in a cluster of methanogen-like genes. By
      locus order this is the cluster that contains Kcr_0764.
    supporting_text: monoxide dehydrogenase and its accessory proteins in a cluster of methanogen-like
      genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Genome paper for the organism (PNAS 2008). Full text now cached from PMC HTML. It
      is the only primary source on the organism's metabolism, and all of it is genome-based
      prediction.
- id: PMID:30833730
  title: Co-occurring genomic capacity for anaerobic methane and dissimilatory sulfur metabolisms
    discovered in the Korarchaeota.
  findings:
  - statement: The MCR-carrying korarchaeote from Washburn Hot Springs is Ca. Methanodesulfokores
      washburnensis, which is distinct from K. cryptofilum. A K. cryptofilum population from the same
      metagenome was also recovered.
    supporting_text: One population is closely related to 'Candidatus Korarchaeum cryptofilum OPF8',
      while the more abundant korarchaeote, 'Candidatus Methanodesulfokores washburnensis', contains
      genes that are necessary for anaerobic methane and dissimilatory sulfur metabolisms.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract cached. The author manuscript (NSF PAR) was read but not cached. It reports
      70% ANI between the two korarchaeotes and places mcrA and dsrAB only in the divergent population,
      so methanogenesis genes do not extend to K. cryptofilum. Its title is about methane and sulfur
      metabolism, not N2 fixation.
- id: PMID:30004385
  title: Lipoate-binding proteins and specific lipoate-protein ligases in microbial sulfur oxidation
    reveal an atpyical role for an old cofactor.
  findings:
  - statement: Hdr-like complexes resembling methanogen HdrABC function in sulfur oxidizers that have
      no CoM-S-S-CoB.
    supporting_text: although a coenzyme M-coenzyme B (CoM-S-S-CoB) heterodisulfide is not present
      in the sulfur oxidizers.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text cached. It shows that the HdrA family includes non-methanogen members
      that act on other substrates. K. cryptofilum is not a sulfur oxidizer, so this is a precedent
      for divergence, not a function assignment.
- id: PMID:29930335
  title: A novel bacterial sulfur oxidation pathway provides a new link between the cycles of organic
    and inorganic sulfur compounds.
  findings:
  - statement: An Hdr-like system acts in sulfur oxidation in Hyphomicrobium denitrificans.
    supporting_text: pointed at a heterodisulfide reductase (Hdr)-like system acting as a
      sulfur-oxidizing entity.
  reference_review:
    relevance: LOW
    correctness: VERIFIED
    review_notes: Full text cached. Background on the non-methanogen Hdr-like pathway.
