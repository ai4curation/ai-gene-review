core_functions:
- description: HdrA-like iron-sulfur flavoprotein that is predicted to carry electrons through its
    FAD and four [4Fe-4S] clusters within an Hdr-like complex, encoded with MvhD-like, HdrC-like and
    HdrB-like subunits next to a CO dehydrogenase. Its electron donor and acceptor are unknown. The
    methanogen CoM-S-S-CoB substrate is absent from this organism.
  molecular_function:
    id: GO:0009055
    label: electron transfer activity
  supported_by:
  - reference_id: PMID:32750208
    supporting_text: Each sHdrA homodimer carries two FADs and two [4Fe-4S] clusters being linked by
      electron conductivity.
  - reference_id: file:KORCO/Kcr_0764/Kcr_0764-uniprot.txt
    record_section: ["DR:PROSITE"]
    supporting_text: PROSITE; PS51379; 4FE4S_FER_2; 4.
knowledge_gaps:
- gap_statement: >-
    The redox partners and physiological reaction of the Kcr_0764-0767 Hdr-like complex are unknown.
    K. cryptofilum has no methyl-coenzyme M reductase or coenzyme M synthesis, so the methanogen
    substrate CoM-S-S-CoB is unavailable, and no alternative disulfide or other acceptor has been
    identified.
  boundary: >-
    The FAD-binding region and four ferredoxin-type [4Fe-4S] domains of the HdrA family are present
    in the sequence, and the gene clusters with HdrB-like, HdrC-like and MvhD-like genes and a
    single-subunit CO dehydrogenase.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    The answer decides what the many HdrA-family proteins of non-methanogenic archaea do, and
    whether the complex couples CO or peptide-derived reductant to H2 production or to energy
    conservation in this peptide fermenter.
  resolution: >-
    Heterologous expression or native purification of the complex, followed by activity screens
    with candidate electron donors (CO through the adjacent CODH, reduced ferredoxin, NAD(P)H) and
    acceptors (ferredoxin, low-molecular-weight disulfides, lipoamide).
  provenance:
  - reference_id: PMID:18535141
    supporting_text: a system that might involve homologs of the methanogen hdrABC -type
      heterodisulfide reductase complex.
  - reference_id: file:KORCO/Kcr_0764/Kcr_0764-bioinformatics/RESULTS.md
    supporting_text: so an electron-transfer role in an Hdr-like complex with an unknown disulfide (or other) acceptor
suggested_questions:
- question: PAINT node PTN000078336 places CoB--CoM heterodisulfide reductase activity at a node that
    includes Korarchaeum cryptofilum HdrA-like proteins (B1L4Y3, B1L5Y2). K. cryptofilum has no MCR or
    coenzyme M synthesis. Should the IBD be moved below the split from the Korarchaeum branch, or a
    loss annotated there? Its only seed, P60200, rests on an IDA whose reference may not contain an
    assay.
- question: Is the Kcr_0764-0767 cluster, next to the single-subunit CO dehydrogenase, a CO-oxidizing,
    ferredoxin-reducing or H2-evolving module, and does Kcr_0764 bifurcate electrons as methanogen
    HdrA does?
- question: Does K. cryptofilum scavenge coenzyme M or coenzyme B from its enrichment community? The
    genome paper proposes scavenging for other missing cofactors.
suggested_experiments:
- hypothesis: The Kcr_0764-0767 Hdr-like complex transfers electrons from CO dehydrogenase or reduced
    ferredoxin to an acceptor other than CoM-S-S-CoB.
  description: Express Kcr_0762-0767 together in a thermophilic archaeal or E. coli host with Fe-S
    maturation support, purify the complex anaerobically, confirm FAD and Fe-S content by EPR and
    visible spectroscopy, and screen CO-, ferredoxin- and NAD(P)H-dependent reduction of benzyl
    viologen, ferredoxin, CoM-S-S-CoB (as a negative control), lipoamide and other low-molecular-weight
    disulfides.
- hypothesis: Kcr_0764 is expressed during peptide fermentation and its abundance changes with CO or
    H2 partial pressure.
  description: Metaproteomics or metatranscriptomics of the OPF8 enrichment culture grown on peptone
    under N2/CO2, with and without added CO or H2.
