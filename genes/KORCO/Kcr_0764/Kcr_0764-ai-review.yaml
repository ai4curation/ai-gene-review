- term:
    id: GO:0051912
    label: CoB--CoM heterodisulfide reductase activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN000078336
  - UniProtKB:P60200
  review:
    summary: PAINT propagation of CoB--CoM heterodisulfide reductase activity from PANTHER node
      PTN000078336 (PTHR43498, HdrA family). The only with/from donor is M. jannaschii HdrA
      (P60200).
    action: REMOVE
    reason: >-
      The node placement over-reaches into a lineage that cannot have the function. The IBD
      asserts a substrate-specific activity, reduction of the CoM-S-S-CoB heterodisulfide. That
      disulfide is formed only by methyl-coenzyme M reductase in the last step of methanogenesis or
      reverse methanogenesis. K. cryptofilum OPF8, a peptide fermenter whose only predicted terminal
      reduction is H2 production, has no MCR subunit and no ComA, ComB or ComDE coenzyme M
      synthesis protein in its complete genome (UniProt survey, see the bioinformatics file). The
      genome paper does not mention MCR or coenzyme M. The korarchaeote that does carry mcr genes,
      Ca. Methanodesulfokores washburnensis, is a different organism. Hdr-like complexes in
      non-methanogens, such as the sulfur-oxidizing sHdr, act on other substrates. So the fold and
      the cofactor set are inherited, but the substrate is not. Kcr_0764 sits inside the clade by
      sequence, but the function should have been placed at a node that excludes the Korarchaeum
      branch, or that branch should carry a loss. The term is also defined with methanophenazine as
      acceptor (archaea pattern 20), which K. cryptofilum lacks as well. Separately, the only donor
      (P60200) rests on a MENGO IDA citing a selenoprotein-labelling paper (see genes/METJA/hdrA).
      What the protein does is recorded as NEW electron transfer activity and cofactor-binding rows.
    supported_by:
    - reference_id: file:KORCO/Kcr_0764/Kcr_0764-bioinformatics/RESULTS.md
      supporting_text: No protein for the reaction that makes CoM-S-S-CoB (MCR) and no ComA/ComB/ComDE are encoded.
    - reference_id: PMID:18535141
      supporting_text: The only terminal reduction reaction predicted from the genome sequence is
        hydrogen production
    - reference_id: PMID:18535141
      supporting_text: The predicted gene functions suggest that the organism relies on a simple mode
        of peptide fermentation for carbon and energy
    - reference_id: PMID:30833730
