        OPF8', while the more abundant korarchaeote, 'Candidatus Methanodesulfokores washburnensis',
        contains genes that are necessary for anaerobic methane and dissimilatory sulfur metabolisms.
    - reference_id: PMID:30004385
      supporting_text: although a coenzyme M-coenzyme B (CoM-S-S-CoB) heterodisulfide is not present
        in the sulfur oxidizers.
