gene_symbol: Kcr_0764
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:374847
  label: Candidatus Korarchaeum cryptofilum OPF8
description: >-
  Kcr_0764 encodes a 648-residue HdrA-like iron-sulfur flavoprotein of the hyperthermophilic
  korarchaeote Candidatus Korarchaeum cryptofilum OPF8, an obligately anaerobic peptide fermenter
  from Yellowstone hot springs that has not been isolated in pure culture. The protein has the
  domain architecture of methanogen heterodisulfide reductase subunit A: an FAD/NAD(P)-binding
  Rossmann region and four ferredoxin-type [4Fe-4S] cluster-binding domains. Its gene lies in a
  cluster with genes for an MvhD-like iron-sulfur protein, HdrC-like and HdrB-like subunits and a
  single-subunit Ni-containing carbon monoxide dehydrogenase with its CooC maturation protein. Unlike
  methanogens, K. cryptofilum encodes no methyl-coenzyme M reductase and no coenzyme M biosynthesis
  enzymes, so it has no known source of the CoM-S-S-CoB heterodisulfide that methanogen HdrABC
  reduces. The protein most likely transfers electrons through its flavin and iron-sulfur clusters
  within an Hdr-like complex, but its electron donor and acceptor are unknown. No experimental data
  exist for the protein.
