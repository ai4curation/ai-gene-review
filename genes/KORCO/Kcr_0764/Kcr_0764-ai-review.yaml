- term:
    id: GO:0009055
    label: electron transfer activity
  evidence_type: ISS
  original_reference_id: PMID:21262829
  qualifier: enables
  review:
    summary: An FAD and four [4Fe-4S] clusters make an intramolecular electron path, as in other
      HdrA-family subunits.
    action: NEW
    reason: This is the one molecular role the evidence supports whatever the substrate. In
      methanogen HdrA the FAD and the ferredoxin-type clusters pass electrons between the hydrogenase,
      ferredoxin and HdrC/HdrB. In the HdrA-like subunit of sulfur oxidizers the FAD and [4Fe-4S]
      clusters are likewise linked by electron conductivity, although that protein does not
      bifurcate. Kcr_0764 has the same cofactor set, so electron transfer is inferred. Whether it
      bifurcates electrons, and between which partners, is unknown (see knowledge gaps).
    supported_by:
    - reference_id: PMID:21262829
      supporting_text: electron bifurcation is flavin based and that therefore the FAD harboring
