      one. This is an argument against an electronic inference on biological grounds, not
      a second-guessing of any experimental curator call; the UniRule row carries no
      experimental evidence for this organism. Checked for redundancy: GO:0099048 is
      neither ancestor nor descendant of GO:0043571, which sits in the DNA-metabolism
      branch. If meningococcal CRISPR restriction of a phage or prophage is reported,
      this MODIFY should be revisited rather than the viral term simply restored.
