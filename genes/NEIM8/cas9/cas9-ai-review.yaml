    reference_section_type: DISCUSSION
- description: >-
    Magnesium-dependent introduction of a double-strand break into the recognised target
    DNA, clearing foreign DNA that has entered the cell. One activity carried by two
    active sites: the HNH domain, with Asp587, His588 and Asn611 coordinating a single
    Mg2+ ion against the scissile phosphate, cleaves the crRNA-complementary target
    strand between protospacer nucleotides 3 and 4, while the discontinuous RuvC-like
    domain with catalytic Asp16 cleaves the non-target strand. The two are allosterically
    coupled - the catalytic HNH conformation is what activates RuvC - which is why
    occluding HNH alone inactivates the enzyme outright rather than converting it into a
    nickase, and why this is modelled as one molecular function with the domain division
    of labour in prose. Both catalytic residues are required in vivo: either alanine
    substitution fails to complement a cas9 null for interference.
