  review:
    summary: >-
      Counter-intuitive but correct, on one of the two limbs the term definition names.
      GO:0043571 sits under GO:0043570 maintenance of DNA repeat elements, in a
      DNA-metabolism branch rather than under defence, and its definition covers
      "capture of new spacer elements ... transcription of the CRISPR repeat arrays into
      RNA and processing". In this strain mature crRNA and tracrRNA collapse in cas9
      mutants while precursors do not accumulate, i.e. Cas9 is required for the
      availability of the array's RNA products, acting as a stabiliser rather than a
      processing enzyme.
    action: ACCEPT
    reason: >-
      Accepted on the guide-biogenesis limb only. The spacer-capture limb, which carries
      the annotation in Streptococcus pyogenes (where Cas9 joins a Cas1-Cas2-Csn2 complex
      and supplies PAM selection), is deliberately not claimed here: this locus has no
      csn2, cas1 and cas2 are dispensable for interference in this system, and adaptation
      has never been assayed in strain 8013. Transferring the type II-A adaptation result
      would be exactly the kind of cross-subtype inference this review avoids.
