- term:
    id: GO:0003690
    label: double-stranded DNA binding
  evidence_type: IDA
  original_reference_id: PMID:31668930
  qualifier: enables
  review:
    summary: >-
      GOA records no DNA-binding term at all for this entry, although target DNA binding
      is the step that precedes everything else the protein does and is resolved in
      several crystal structures: an early target-recognition state, an HNH
      pre-catalytic state, the HNH catalytic state and a cleaved-target-DNA-bound state.
      The substrate is duplex DNA - the PAM is read on the non-target strand of an intact
      duplex, and only then is the duplex unwound to form the guide:target heteroduplex -
      so the double-stranded child is the right term rather than generic DNA binding.
    action: NEW
    reason: >-
      Proposed to fill an outright gap rather than to refine an existing row. Evidence is
      IDA from the Nme1Cas9-sgRNA-dsDNA ternary structures, which place a defined DNA
      duplex in the protein. Note that DNA binding is experimentally separable from
      cleavage in this orthologue: AcrIIC1 abolishes cutting while leaving binding
      intact, so a DNA-binding annotation is not merely implied by the nuclease
      annotation.
    supported_by:
    - reference_id: PMID:31668930
      supporting_text: we report structures of meningococcal Cas9 homologs in complex
        with sgRNA, dsDNA, or the AcrIIC3 anti-CRISPR protein
      reference_section_type: ABSTRACT
    - reference_id: PMID:31668930
      supporting_text: The 8 nts of the TS base pair with seed nts 17-24 of the sgRNA
        guide region to form an RNA-DNA heteroduplex
      reference_section_type: RESULTS
    - reference_id: PMID:28844692
      supporting_text: AcrIIC1 blocks DNA cleavage by multiple Cas9 orthologs without
        impacting DNA binding, effectively transforming catalytically active Cas9 into
        catalytically inactive dCas9
      reference_section_type: DISCUSSION
- term:
    id: GO:0005737
    label: cytoplasm
  evidence_type: IC
  original_reference_id: PMID:23706818
  qualifier: located_in
  review:
    summary: >-
      Cas9 is a soluble, non-secreted bacterial protein with no signal peptide or
      transmembrane segment, and both of its established activities - stabilising the
      crRNA:tracrRNA guide pair and cleaving DNA that has entered the cell by natural
      transformation - take place in the bacterial cytoplasm.
    action: NEW
    reason: >-
      Added so that the compartment the core functions occupy is asserted rather than
      implied. Evidence is IC: there is no fractionation or imaging experiment for this
      protein, and the location is inferred from where its substrates and partners are.
      Not GO:0005829 cytosol, which would claim a resolution the evidence does not
      support.
    supported_by:
