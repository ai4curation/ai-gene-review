gene_symbol: cas9
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:604162
  label: Neisseria meningitidis serogroup C (strain 8013)
description: >-
  Cas9 of Neisseria meningitidis strain 8013 (Nme1Cas9) is the single-protein effector
  of a compact type II-C CRISPR-Cas adaptive immune system. The locus is minimal,
  carrying only cas9, cas1 and cas2 and lacking the csn2 and cas4 genes found in type
  II-A and II-B loci, and the protein itself is substantially smaller than its type II-A
  relatives at 1082 residues. Like all Cas9 enzymes it is catalytically inert alone and
  is activated by loading a crRNA:tracrRNA guide, which both licenses target engagement
  and reorganises the bilobed protein around a central nucleic-acid channel. The loaded
  ribonucleoprotein recognises a long, purine-rich protospacer adjacent motif of the
  N4GAYW/N4GYTT/N4GTCT class through a PAM-interacting domain that is highly diverged
  even from the closely related Nme2Cas9, then unwinds the duplex and forms an RNA:DNA
  heteroduplex nucleated at the PAM-proximal seed. Two magnesium-dependent nuclease
  centres then cut opposite strands: the HNH domain, whose active site is built around
  Asp587, His588 and Asn611 with a single Mg2+ ion coordinated to the scissile
  phosphate, cleaves the crRNA-complementary target strand, while the discontinuous
  RuvC-like domain with catalytic Asp16 cleaves the non-target strand. The two centres
  are allosterically coupled rather than independent: adoption of the catalytic HNH
  conformation is what activates RuvC. Cas9 is the only Cas protein this system needs
  for interference - cas1 and cas2 deletions retain full activity while cas9 deletion
  abolishes it, and alanine substitution of either catalytic residue is as damaging as
  deleting the gene. It also governs guide availability: mature crRNA and tracrRNA are
  strongly depleted in cas9 mutants without accumulation of precursors, indicating that
  Cas9 stabilises the guides rather than processing them. Unusually, crRNAs in this
  species can also be transcribed directly from promoters embedded in each CRISPR
  repeat, so RNase III-dependent processing is dispensable for immunity. The substrate
  the system is known to clear is DNA entering the cell by natural transformation:
  plasmid and neisserial genomic DNA carrying a spacer-matched protospacer with a
  correct PAM cannot transform the strain unless cas9 is disrupted. The enzyme is the
  target of the type II-C anti-CRISPR proteins AcrIIC1, which binds the conserved HNH
  domain and traps it on DNA in a catalytically inactive state, and AcrIIC3, which
  blocks target binding and dimerises the enzyme.
