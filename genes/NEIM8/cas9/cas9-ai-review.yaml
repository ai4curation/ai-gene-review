    summary: >-
      This is the one call where the two type II Cas9 exemplars legitimately diverge. For
      the Streptococcus pyogenes type II-A enzyme, inactivation of infecting phage is
      directly reported. For this type II-C enzyme the demonstrated interference
      substrate is DNA entering the cell by natural transformation - plasmid DNA and
