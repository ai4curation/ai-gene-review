proposed_new_terms:
- proposed_name: guide RNA-directed nucleic acid target recognition activity
  proposed_definition: >-
    Binding to a nucleic acid target at a site whose sequence is specified by
    base-pairing with a separate, non-covalently bound guide RNA, such that altering the
    guide RNA sequence alters the target site that is recognised without any change to
    the polypeptide. The gene product supplies the guide-binding site and the machinery
    for unwinding the target and forming a guide:target heteroduplex; it does not itself
    encode the target sequence specificity.
  proposed_parent:
    id: GO:0003676
    label: nucleic acid binding
  justification: >-
    Programmable, guide-dependent target recognition is the defining property of every
    CRISPR-Cas effector, and GO cannot express it. A QuickGO search for "guide RNA
    binding", "crRNA", "CRISPR" and "RNA-guided" returns only process terms (GO:0099048,
    GO:0043571, GO:0098672 and two obsoletes) and generic binding terms. The nuclease
    chemistry is well covered (GO:0004520, GO:0004521, GO:0004530, GO:1990238), which is
    exactly why the gap matters: with only those terms this protein is annotated
    indistinguishably from an unguided restriction endonuclease. The term is pitched above
    any single system so that it serves Cas9, Cas12a, Cas13a, Cascade/Csy subunits and
    Csm/Cmr complexes alike, with children for guide RNA-directed DNA endonuclease
    activity and guide RNA-directed RNA endonuclease activity layering the chemistry back
    on. PAM (or PFS) dependence is deliberately excluded from the definition because it is
    protein-encoded and orthologue-specific - this enzyme reads an N4GAYW-class motif, the
    nearly identical Nme2Cas9 reads N4CC, SpCas9 reads NGG, and Cas13a uses a protospacer
    flanking site - so it belongs on child terms or on individual annotations, not on the
    general concept. The fate of the target is excluded too, being what the existing
    nuclease terms already say. That recognition is genuinely separable from catalysis is
    an experimental result in this subtype, not a conceptual convenience: AcrIIC1 occupies
    the HNH domain and abolishes cleavage while leaving target binding intact, converting
    the enzyme into a recognition-only protein. One scope question is left to the ontology
    editors and is also raised in suggested_questions: as defined the term would equally
    fit Argonaute-family slicers, which delegate specificity to a dissociable guide in the
    same way. That is arguably correct, since the concept is specificity delegated to a
    dissociable nucleic-acid guide, but it widens the term well beyond prokaryotic defence
    and should be decided explicitly. The same proposal is carried in the review of the
    type II-A exemplar (UniProtKB:Q99ZW2) so that the two can be compared.
  supported_by:
  - reference_id: PMID:31668930
    supporting_text: The 8 nts of the TS base pair with seed nts 17-24 of the sgRNA guide
      region to form an RNA-DNA heteroduplex
    reference_section_type: RESULTS
  - reference_id: PMID:31668930
    supporting_text: 'This divergence leads to distinct PAM specificities: N4GAYW/N4GYTT/N4GTCT
      for Nme1Cas9'
    reference_section_type: RESULTS
  - reference_id: PMID:28844692
    supporting_text: AcrIIC1 blocks DNA cleavage by multiple Cas9 orthologs without
      impacting DNA binding, effectively transforming catalytically active Cas9 into
      catalytically inactive dCas9
    reference_section_type: DISCUSSION
suggested_questions:
- question: >-
    Does the meningococcal type II-C system restrict any phage or prophage? Every
    published interference assay in strain 8013 used plasmid or genomic DNA delivered by
    natural transformation, which is why GO:0051607 defense response to virus is refined
    away here; a single phage-challenge result would reverse that call.
  experts: []
- question: >-
    Is Cas9 involved in spacer acquisition in a type II-C system that lacks csn2 and
    cas4? In Streptococcus pyogenes Cas9 supplies PAM selection within a Cas1-Cas2-Csn2
    complex, but that accessory is absent here and adaptation has never been assayed in
    this strain, so the spacer-capture limb of GO:0043571 is left unclaimed.
  experts: []
- question: >-
    Should a GO molecular-function term for guide RNA-directed target recognition be
    scoped to CRISPR-Cas effectors, or pitched broadly enough to include Argonaute-family
    slicers, which delegate specificity to a dissociable guide in the same way?
  experts: []
- question: >-
    GO has no way to state that an inhibitor occludes one catalytic domain of a
    multidomain nuclease. Given that AcrIIC1 binds HNH alone and that the catalytic HNH
    conformation is what activates RuvC, is domain-level occlusion a mechanism GO should
    represent, or does the allosteric coupling make protein-level inhibition the right
    granularity?
  experts: []
suggested_experiments:
- hypothesis: >-
    The meningococcal CRISPR-Cas system restricts phage as well as transforming DNA, so
    GO:0051607 would be supported after all.
  description: >-
    Challenge wild-type, Δcas9 and catalytic-mutant (D16A, H588A) strain 8013 with a
    neisserial phage or inducible prophage engineered to carry a protospacer matching an
    endogenous spacer with an N4GATT PAM, and measure plaque formation or prophage
    induction titre against a protospacer-free control.
  experiment_type: phage challenge with isogenic cas9 mutants
- hypothesis: >-
    Cas9 stabilises the crRNA:tracrRNA duplex in this strain without participating in any
    cleavage, so a guide-binding-competent but catalytically dead enzyme should restore
    guide levels while leaving the strain interference-null.
  description: >-
    Complement Δcas9 with D16A, H588A and the D16A/H588A double mutant and quantify
    mature crRNA and tracrRNA by Northern blot alongside interference against a
    protospacer plasmid. The prediction is full restoration of guide accumulation with no
    restoration of interference, which would confirm that the GO:0043571 annotation rests
    on a non-catalytic RNA-binding activity.
  experiment_type: complementation with catalytic point mutants plus Northern blot
- hypothesis: >-
    Target recognition and cleavage are separable in this enzyme, so AcrIIC1-bound Cas9
    should remain a sequence-specific DNA-binding protein in vivo.
  description: >-
    Co-express AcrIIC1 with Nme1Cas9 in strain 8013 and assay target occupancy by ChIP at
    a chromosomally integrated protospacer while scoring interference in parallel. Intact
    occupancy with lost interference would establish the two activities as independently
    annotatable in the native host, not only in vitro.
  experiment_type: ChIP occupancy plus interference assay under anti-CRISPR inhibition
