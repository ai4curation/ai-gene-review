core_functions:
- description: >-
    crRNA:tracrRNA-programmed interrogation of double-stranded DNA and PAM-licensed
    recognition of a complementary protospacer. The protein supplies the guide-binding
    channel and a PAM-interacting domain that reads a long, purine-rich motif of the
    N4GAYW/N4GYTT/N4GTCT class; the sequence actually recognised is specified entirely
    by the spacer segment of the guide, so one polypeptide serves every spacer the array
    holds. Recognition proceeds through PAM contact, duplex unwinding and nucleation of
    an RNA:DNA heteroduplex at a PAM-proximal seed, and is captured structurally as an
    early target-recognition state preceding the catalytic ones. It is a separable
    activity rather than the first half of cleavage: AcrIIC1 occupies the HNH domain and
    removes catalysis while leaving target binding intact.
  proposed_molecular_function: guide RNA-directed nucleic acid target recognition activity
