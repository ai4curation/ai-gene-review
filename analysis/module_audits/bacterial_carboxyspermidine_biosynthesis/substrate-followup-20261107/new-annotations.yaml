  annotation:
    term:
      id: GO:0008295
      label: spermidine biosynthetic process
    evidence_type: IDA
    original_reference_id: PMID:40074085
    review:
      summary: The matched pair reconstructs spermidine production in E. coli; native PD1222 flux was
        not measured in that experiment.
      action: NEW
      reason: PMID:40074085 Fig. 2 detects spermidine after coexpression of the matched CASDH/CASDC pair
        in spermidine-deficient E. coli BL21speD; Table 2 detects carboxyspermidine with CASDH alone.
        These experiments distinguish intermediate formation from completion of the route. The gene product
        catalyzes the committed reductive condensation to carboxyspermidine; NspC performs the subsequent
        decarboxylation. Table S1 maps the construct to WP_011749229, whose sequence matches A1B695 exactly.
        The same-role condensation enzymes Q9KRL3 and P0DPE4 carry their specific MF but no exact GO:0008295
        row in QuickGO; this absence is not itself evidence of a curation gap. Product-forming polyamine
        catalysts E. coli SpeE P09158 and human SRM P19623 do carry GO:0008295, demonstrating that direct
        catalytic synthesis, unlike being a consumed polyamine substrate, fits the process convention.
        The term is under polyamine biosynthesis, not a downstream growth or siderophore process. GO:0008295
        is not an ancestor or descendant of the separate spermine, thermospermine or norspermidine process
        terms; no broader polyamine BP is added. A native PD1222 flux experiment is not claimed; the primary
        spermidine role is inferred from the matched pathway chemistry and family context, supported by
        reconstruction.
      supported_by:
      - reference_id: PMID:40074085
        supporting_text: Fig. 2 shows that all CASDH/CASDC pairs were able to synthesize spermidine in
          the spermidine-void BL21speD cells.
      - reference_id: file:modules/bacterial_carboxyspermidine_biosynthesis-source-analysis/PMID40074085-supplement.txt
        supporting_text: Paracoccus denitrificans (α-Proteobacteria)    CASDH [WP_011749229]              407
