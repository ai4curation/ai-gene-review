- review: genes/AGRFC/Atu4170/Atu4170-ai-review.yaml
  annotation:
    term:
      id: GO:0102143
      label: carboxynorspermidine dehydrogenase activity
    evidence_type: IDA
    original_reference_id: PMID:40074085
    review:
      summary: Carboxyspermidine formation is supported by CASDH expression and pathway genetics. GO:0102143
        explicitly includes the carboxyspermidine/putrescine reaction, despite its short label; obsolete
        GO:0102144 is not used.
      action: NEW
      reason: 'PMID:40074085 Table 2 detects carboxyspermidine by high-resolution LC-MS after expression
        of CASDH alone in E. coli BL21speD and BL21speG. Thus Atu4170 makes the carboxylated intermediate
        rather than merely affecting the pathway endpoint. PMID:26682642 independently links the C58 Atu4170
        deletion to loss of spermidine and accumulation of putrescine. Table S1 maps the construct to
        WP_010973612, whose sequence matches A9CG66 exactly. GO:0102143 explicitly includes the carboxyspermidine/putrescine
        reaction and lies under CH-NH-group oxidoreductase activity with NAD(P) acceptors; the obsolete
        GO:0102144 is not an additional activity. Same-role comparator check: Vibrio CANSDHs Q9KRL3 and
        P0DPE4 both carry GO:0102143 in QuickGO (2026-11-05). Their annotation state checks term usage,
        not this target''s biochemical evidence. No other proposed MF is an ancestor or descendant duplicate;
        the separate tetraamine proposal changes the amine substrate. The experiment is heterologous product
        analysis, not a purified-enzyme kinetic or cofactor-specificity measurement.'
      supported_by:
      - reference_id: PMID:26682642
        supporting_text: Compared to the C58 wild-type strain, the ΔCASDH (Atu4170) strain accumulates
          putrescine and homospermidine but lacks spermidine (Supporting Information Figure 1A); the ΔCASDC
          (Atu4169) strain accumulates carboxyspermidine, some putrescine and a small amount of homospermidine
          (Supporting Information Figure 2A).
      - reference_id: PMID:40074085
        supporting_text: Table 2 shows that in both BL21speD and BL21speG, the A. tumefaciens, P. denitrificans
          CASDH produced approximately 100-fold more carboxyspermidine than the D. desulfuricans and H. thermophila
          CASDH.
      - reference_id: file:modules/bacterial_carboxyspermidine_biosynthesis-source-analysis/PMID40074085-supplement.txt
        supporting_text: Agrobacterium tumefaciens (α-Proteobacteria)   CASDH [WP_010973612]              412
- review: genes/AGRFC/Atu4170/Atu4170-ai-review.yaml
  annotation:
    term:
      id: GO:0008295
      label: spermidine biosynthetic process
    evidence_type: IMP
    original_reference_id: PMID:26682642
    review:
      summary: Native C58 deletion and metabolite analysis establish the spermidine pathway.
      action: NEW
      reason: 'PMID:26682642 measures metabolites in native C58 locus deletions: ΔAtu4170 lacks spermidine
        and accumulates putrescine, while ΔAtu4169 accumulates carboxyspermidine. This identifies successive
        enzyme steps, rather than merely a requirement for growth. The gene product catalyzes the committed
        reductive condensation to carboxyspermidine; NspC performs the subsequent decarboxylation. Table
        S1 maps the construct to WP_010973612, whose sequence matches A9CG66 exactly. The same-role condensation
        enzymes Q9KRL3 and P0DPE4 carry their specific MF but no exact GO:0008295 row in QuickGO; this
        absence is not itself evidence of a curation gap. Product-forming polyamine catalysts E. coli
        SpeE P09158 and human SRM P19623 do carry GO:0008295, demonstrating that direct catalytic synthesis,
        unlike being a consumed polyamine substrate, fits the process convention. The term is under polyamine
        biosynthesis, not a downstream growth or siderophore process. GO:0008295 is not an ancestor or
        descendant of the separate spermine, thermospermine or norspermidine process terms; no broader
        polyamine BP is added. Native physiological participation is established for C58.'
      supported_by:
      - reference_id: PMID:26682642
        supporting_text: Compared to the C58 wild-type strain, the ΔCASDH (Atu4170) strain accumulates
          putrescine and homospermidine but lacks spermidine (Supporting Information Figure 1A); the ΔCASDC
          (Atu4169) strain accumulates carboxyspermidine, some putrescine and a small amount of homospermidine
          (Supporting Information Figure 2A).
      - reference_id: PMID:40074085
        supporting_text: Fig. 2 shows that all CASDH/CASDC pairs were able to synthesize spermidine in
          the spermidine-void BL21speD cells.
      - reference_id: file:modules/bacterial_carboxyspermidine_biosynthesis-source-analysis/PMID40074085-supplement.txt
        supporting_text: Agrobacterium tumefaciens (α-Proteobacteria)   CASDH [WP_010973612]              412
- review: genes/AGRFC/Atu4170/Atu4170-ai-review.yaml
  annotation:
    term:
      id: GO:0045312
      label: nor-spermidine biosynthetic process
    evidence_type: IC
    original_reference_id: PMID:26682642
    review:
      summary: The C58 CASDH/CASDC route synthesizes norspermidine from fed 1,3-diaminopropane in a ΔODC
        background; this is a conditional secondary role.
      action: NEW
      reason: 'PMID:26682642 feeds 1,3-diaminopropane to the C58 ΔODC strain and measures norspermidine
        production; supplying an already formed polyamine to rescue growth would not establish this synthesis.
        Atu4170 is the characterized CASDH condensation step, so the pathway-level feeding experiment
        supports its conversion of the fed diamine to the carboxynorspermidine intermediate, with NspC
        completing decarboxylation. This gene-specific step assignment is IC, not an isolated purified-protein
        assay. Same-role comparator check: the two characterized Vibrio CANSDHs Q9KRL3 and P0DPE4 have
        their specific MF but no exact nor-spermidine BP in QuickGO (2026-11-05); no oversight is inferred
        from that absence. Catalytic second-step comparators Vibrio NspC Q9KRL4 and Pseudomonas NspC Q88IS0
        do carry GO:0045312, consistent with a process term for enzymes that make norspermidine. The term
        lies under polyamine biosynthesis and is a sibling, not an ancestor/descendant duplicate, of the
        other proposed polyamine BPs. The actual fed-substrate conversion and known pathway mechanism
        justify this conditional proposal; it does not assert norspermidine as the normal native product
        and is excluded from the core-function process list. The distinction from the CAMJ8 and PSEPK
        alternate-substrate comparisons is cellular synthesis: C58 ΔODC grown in defined medium with 100
        µM DAP accumulated LC-MS-confirmed norspermidine (Figure 4B), whereas isolated-enzyme turnover
        alone does not establish such a cellular process. The step assignment to Atu4170 remains IC from
        the characterized pathway, not a DAP-fed Atu4170 deletion/complementation experiment. NEW records
        an authored proposal rather than core status; the corresponding NspC KEEP_AS_NON_CORE judgment
        reflects the same conditional biology.'
      supported_by:
      - reference_id: PMID:26682642
        supporting_text: The ΔODC strain allowed us to replace putrescine with 1,3-diaminopropane resulting
          in synthesis of norspermidine, and also with cadaverine, resulting in synthesis of aminopropylcadaverine
          and the corresponding tetraamine bis(aminopropyl)cadaverine or its isomer aminopentylnorspermidine.
      - reference_id: PMID:26682642
        supporting_text: Compared to the C58 wild-type strain, the ΔCASDH (Atu4170) strain accumulates
          putrescine and homospermidine but lacks spermidine (Supporting Information Figure 1A); the ΔCASDC
          (Atu4169) strain accumulates carboxyspermidine, some putrescine and a small amount of homospermidine
          (Supporting Information Figure 2A).
      - reference_id: PMID:26682642
        supporting_text: all of the 1,3-diaminopropane appeared to have been converted to norspermidine
          (Figure 4B).
