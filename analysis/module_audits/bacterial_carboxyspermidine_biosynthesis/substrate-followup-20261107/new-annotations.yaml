- review: genes/BACFG/HMPREF1080_01141/HMPREF1080_01141-ai-review.yaml
  annotation:
    term:
      id: GO:0102143
      label: carboxynorspermidine dehydrogenase activity
    evidence_type: IDA
    original_reference_id: PMID:37437886
    review:
      action: NEW
      summary: Purified BfCASDH directly supports the NADPH-dependent putrescine and DAP condensation
        activity covered by GO:0102143.
      reason: The paper identifies WP_005801052.1; its full 397-residue sequence is identical to I9VY56,
        which also carries the matching 8DEB structure cross-reference. PUT and DAP kinetics directly
        establish this activity. GO:0102143 includes both carboxypolyamine reactions. This molecular-function
        proposal does not establish native preference over untested agmatine or imply a target-strain
        genetic experiment.
      supported_by:
      - reference_id: PMID:37437886
        supporting_text: accession numbers WP_005801052.1 and EDO61991.1.
      - reference_id: PMID:37437886
        supporting_text: These data suggest that both enzymes can use putrescine or DAP and thus produce
          carboxyspermidine or carboxynorspermidine.
      - reference_id: file:BACFG/HMPREF1080_01141/HMPREF1080_01141-notes.md
        supporting_text: The NCBI WP_005801052.1 amino-acid sequence exactly matches all 397 residues
          of the I9VY56 UniProt sequence.
