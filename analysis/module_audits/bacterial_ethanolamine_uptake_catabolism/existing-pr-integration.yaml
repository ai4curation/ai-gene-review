    assessment_reason: Fungal branch seeded by S. cerevisiae ALD4, ALD5 and a third SGD gene. ALD5 import
      into isolated mitochondria was shown directly, and the COMPLETE yeast ALD4 and ALD5 gene reviews
      accept their mitochondrion rows.
    supported_by:
    - reference_id: file:interpro/panther/PTHR11699/PTHR11699-paint.tsv
      supporting_text: "PTHR11699\tPTN000916385\tGO:0005739\tC\tIBD\tfalse"
    - reference_id: PMID:9473035
      supporting_text: The experiments with ALDH5-LacZ fusion protein and in vitro import into isolated
        mitochondria confirmed that ALDH5 was located in mitochondria
  pr:
    node_id: PANTHER:PTN000916385
    asserted_term:
      id: GO:0005739
      label: mitochondrion
    evidence: IBD
    node_taxon:
      id: NCBITaxon:4892
    paint_snapshot: '20260528'
    seeds:
    - id: SGD:S000000875
    - id: SGD:S000005901
    - id: SGD:S000005982
    assessment: NEEDS_PRUNING
    assessment_reason: 'The fungal branch node behind the yeast mitochondrion IBAs. Two of its three seeds
      are genuinely mitochondrial - ALD4 (S000005901) and ALD5 (S000000875), both presequence-bearing
      matrix enzymes whose COMPLETE gene reviews keep the term - but the third, ALD6 (S000005982), is
      the constitutive cytosolic Mg2+-activated ALDH of the PDH bypass: it has no mitochondrial leader
      and fractionates entirely with the cytosol, and its only mitochondrial evidence is high-throughput
      organellar proteomics. The node propagates the stronger `is_active_in` form of the assertion, which
      the ALD6 gene review marks as over-annotated on exactly that ground. The organelle claim is therefore
      right for the branch as a whole but wrong for one member, so the fix is a member-level prune (an
      IRD or NOT on ALD6) rather than a re-placement of the node. No subfamily is named here because the
      axis cannot express it: the PANTHER 19.0 member index puts ALD6 (P54115) and ALD4 (P46367) in the
      same subfamily, SF268, so pruning by subfamily would also remove the term from a mitochondrial member
      that earns it.'
    supported_by:
    - reference_id: file:genes/yeast/ALD6/ALD6-ai-review.yaml
      supporting_text: Cell fractionation confirmed that ALDH1 was found only in the cytosolic portion.
