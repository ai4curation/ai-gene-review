    review:
      summary: 'Inter-ontology inference from arginine:agmatine antiporter activity: AdiC moves L-arginine
        (and agmatine) across the inner membrane.'
      action: MODIFY
      reason: True but general. The amino acid AdiC transports is L-arginine, imported in exchange for
        agmatine, so the specific descendant L-arginine transmembrane transport (GO:1903826) is supported
        directly by reconstitution and whole-cell assays. Agmatine is not an amino acid and GO has no
        agmatine transmembrane transport term; the agmatine leg is captured by the antiporter MF term.
      proposed_replacement_terms:
      - id: GO:1903826
        label: L-arginine transmembrane transport
      supported_by:
      - reference_id: PMID:17099215
        supporting_text: Purified AdiC reconstituted into liposomes exchanges arginine and agmatine in
          a strictly coupled, electrogenic fashion.
      - reference_id: PMID:19578361
        supporting_text: At the heart of the process is a 'virtual proton pump' in the inner membrane,
          called AdiC, that imports L-arginine from the gastric juice and exports its decarboxylation
          product agmatine.
