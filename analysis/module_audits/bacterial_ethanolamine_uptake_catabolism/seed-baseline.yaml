- accession: P0AEJ6
  review_path: genes/ECOLI/eutB/eutB-ai-review.yaml
  taxon:
    id: NCBITaxon:83333
    label: Escherichia coli K-12
  original_rows:
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: is_active_in
    supporting_entities:
    - PANTHER:PTN002217393
    - UniProtKB:P0AEJ6
    review:
      summary: PAINT places cytosolic activity at the EutB family root node, seeded by this protein.
      action: ACCEPT
      reason: EutB is a soluble enzyme subunit. Whether it is also enclosed in the Eut microcompartment
        in E. coli is unresolved, and the genetic model of Huseby and Roth places EutBC outside the shell,
        in the cytosol. The IBD seed is E. coli EutB itself, whose cytosol location is supported by the
        cytosol proteomics row below; the cytosol claim holds across the family, including members such
        as P. putida KT2440 that encode no shell proteins.
      supported_by:
      - reference_id: PMID:23585538
        supporting_text: The model predicts that EutBC (ethanolamine-ammonia lyase) lies outside the compartment,
          using external coenzyme B12 and injecting its product, acetaldehyde, into the lumen
      - reference_id: file:PSEPK/eutC/eutC-bioinformatics/RESULTS.md
        supporting_text: KT2440 encodes no BMC-domain or EutN/CcmL-domain protein anywhere in its reference
          proteome, while the same queries recover the complete E. coli Eut shell set.
  - term:
      id: GO:0005829
      label: cytosol
    evidence_type: IDA
    original_reference_id: PMID:18304323
    qualifier: located_in
    review:
      summary: EcoCyc annotation from quantitative proteomics of the E. coli cytosolic fraction.
      action: ACCEPT
      reason: The study profiled the soluble cytosol of strain MC4100 by LC-MS/MS; the per-protein identification
        tables are in the supplement, which is not in the cache, so the EutB identification is accepted
        on the curator's reading. A cytosolic location agrees with the soluble, detergent-independent
        behaviour of the purified enzyme.
      supported_by:
      - reference_id: PMID:18304323
        supporting_text: We performed approximately 200 individual LC-MS/MS runs of the E. coli MC4100
          cytosol, in combination with a variety of protein and peptide separation methods in order to
          maximize protein identification coverage.
      - reference_id: PMID:19762342
        supporting_text: A truncated enzyme was highly soluble even in the absence of detergent
