    review:
      summary: PAINT inference of plasma membrane localization at the EutH family node PTN002219906 (PTHR40089),
        seeded by the Escherichia coli K-12 EutH paralog UniProtKB:P76552.
      action: ACCEPT
      reason: 'The node placement is sound and the claim is directly confirmed in Salmonella itself: EutH
        has about eleven predicted helical transmembrane segments, a EutH-Yfp fusion localized to the
        membrane, and UniProt curates the location as cell inner membrane (the bacterial plasma membrane)
        from that work. A facilitator of ethanolamine diffusion must sit in the membrane it works across,
        so is_active_in plasma membrane is where the activity happens. Core location.'
      propagation_review:
        root_cause: NO_FAILURE_CORE
        source_entities:
        - source_id: PANTHER:PTN002219906
          source_status: SUPPORTS_TRANSFER
          comment: EutH family node; all four cached PTHR40089 members are single-subfamily polytopic
            EutH-type permeases, so membrane localization is ancestral to the family rather than lineage-specific.
        - source_id: UniProtKB:P76552
          source_label: eutH
          source_status: SUPPORTS_TRANSFER
