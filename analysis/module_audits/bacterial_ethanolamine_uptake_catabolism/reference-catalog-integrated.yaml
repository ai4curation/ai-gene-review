- id: PMID:35785499
  title: Localization and interaction studies of the Salmonella enterica ethanolamine ammonia-lyase (EutBC),
    its reactivase (EutA), and the EutT corrinoid adenosyltransferase.
  findings:
  - statement: LT2 EutA directly associates with its cognate lyase.
    supporting_text: SeEAL and SeEutA interacted and stabilized each other by forming a complex.
  - statement: Immunogold identifies association with Eut metabolosomes.
    supporting_text: Result from TEM immunogold labeling microscopy revealed that the localization patterns
      of EAL, EutA, and EutT were very similar, and that all of these enzymes associate with Eut metabolosomes
  - statement: Reactivates cognate ethanolamine ammonia-lyase by ATP-dependent exchange of inactive bound
      cobalamin for intact adenosylcobalamin. E. coli biochemistry supports this mechanistic assignment
      to LT2, whose EutA directly associates with EutBC and Eut metabolosomes. Reactivation is needed
      after inactivation, not after every catalytic turnover.
    supporting_text: SeEAL and SeEutA interacted and stabilized each other by forming a complex.
  - statement: Reactivates cognate ethanolamine ammonia-lyase by ATP-dependent exchange of inactive bound
      cobalamin for intact adenosylcobalamin. E. coli biochemistry supports this mechanistic assignment
      to LT2, whose EutA directly associates with EutBC and Eut metabolosomes. Reactivation is needed
      after inactivation, not after every catalytic turnover.
    supporting_text: Result from TEM immunogold labeling microscopy revealed that the localization patterns
      of EAL, EutA, and EutT were very similar, and that all of these enzymes associate with Eut metabolosomes
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: LT2 localization, cognate EutA/EutBC complementation, copurification and crosslinking.
      Immunogold establishes association; lumen placement is inferred. Aggregation prevented strong enzymatic/kinetic
      analysis. The paper states 468 aa for SeEutA, whereas frozen Q9ZFV2 has 467 aa. Published crosslinked
      peptides YEFIKR39–44 and QGGLKEVELK60–69 match the reference exactly at reported positions; construct-terminal
      details are not resolved, so whole-construct identity is not asserted.
