- id: PMID:20234377
  title: 'Ethanolamine utilization in bacterial pathogens: roles and regulation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; useful for comparative operon architecture. Its then-unassigned EutQ role
      must be read alongside newer primary studies.
  findings:
  - statement: Short eutBC loci occur in multiple bacterial groups; the enterobacterial operon is one
      realization rather than a universal gene checklist.
    supporting_text: Actinobacteria and most Proteobacteria have short eut operons containing eutBC
  - statement: EutA-mediated restoration is a maintenance function distinct from each normal EutBC catalytic
      turnover.
    supporting_text: EutA is a reactivating factor for the ethanolamine ammonia lyase
- id: PMID:29463652
  title: Ethanolamine Utilization in Bacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; comparative synthesis of access, chemical branches and regulatory diversity.
      Assay-specific thresholds come from primary studies.
  findings:
  - statement: Increasing protonation at acidic pH changes access requirements; EutH/Eat are condition-dependent
      transport implementations.
    supporting_text: the proportion of EA that is protonated increases
  - statement: Acetaldehyde has a reductive alcohol branch in addition to oxidative EutE processing; these
      fates need not be mutually exclusive.
    supporting_text: acetaldehyde can also be converted into alcohol by EutG
