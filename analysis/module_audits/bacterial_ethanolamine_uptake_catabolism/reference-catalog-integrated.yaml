- id: PMID:35880884
  title: Acinetobacter baumannii Catabolizes Ethanolamine in the Absence of a Metabolosome and Converts
    Cobinamide into Adenosylated Cobamides.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text. Native ATCC17978, evolved expression variants and Salmonella complementation
      are distinct experimental systems. Accession identities remain unresolved, so this is a mechanistic
      comparator without an invented protein selector.
  findings:
  - statement: The Acinetobacter enzyme supported heterologous ethanolamine nitrogen use without imposing
      a universal metabolosome or EutA requirement.
    supporting_text: did not require the metabolosome, the reactivase EutA enzyme
  - statement: Basal chromosomal eutBC expression supports the nitrogen endpoint; carbon/energy growth
      involves distinct expression conditions.
    supporting_text: as a sole nitrogen source but not as a carbon and energy source
  - statement: 'nitrogen endpoint versus carbon-growth endpoint: Native ATCC17978, Fig4. Host ammonia
      assimilation and other metabolic machinery are present; EutBC is not an autonomous biomass pathway.'
    supporting_text: Chromosomal levels of eutBC expression were sufficient to support growth with ethanolamine
      as a nitrogen source
  - statement: 'reactivase and BMC nonuniversality: Fig7 heterologous A. baumannii EutBC in Salmonella
      eut deletions. Do not call this complete carbon assimilation by EutBC alone.'
    supporting_text: Strains were grown in nce minimal medium containing ethanolamine as the sole source
      of nitrogen.
  - statement: 'expression/context gate: Native chromosomal expression differs from plasmid overexpression
      and ISAba1-evolved expression. Enzyme capacity does not by itself establish native carbon growth.'
    supporting_text: Chromosomal expression of eutBC allows A. baumannii to use ethanolamine as a sole
      nitrogen source but not as a carbon and energy source.
  - statement: 'active cofactor prerequisite: Compatible adenosylated cobamide is the broader prerequisite;
      adenosylcobalamin is the established standard for the main panel. Free cyanocobalamin alone is not
      equivalent to active bound cofactor without processing.'
    supporting_text: AbEutBC can utilize various adenosylcobamides
