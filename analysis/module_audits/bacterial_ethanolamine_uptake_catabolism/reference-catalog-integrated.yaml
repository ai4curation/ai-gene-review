- id: PMID:27325678
  title: Ethanolamine Catabolism in Pseudomonas aeruginosa PAO1 Is Regulated by the Enhancer-Binding Protein
    EatR (PA4021) and the Alternative Sigma Factor RpoN.
  findings:
  - statement: PAO1 has a non-acylating ethanolamine pathway; operon evidence complements direct PA4022
      biochemical assays.
    supporting_text: This pathway is encoded by the PA4022-eat-eutBC operon and consists of a transport
      protein (Eat), an ethanolamine-ammonia lyase (EutBC), and an acetaldehyde dehydrogenase (PA4022).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract plus separately acquired primary evidence in PA4022 notes; PAO1 gene
      deletion physiology is not a direct isolated-transport assay. EatR is the regulator, distinct from
      Eat.
