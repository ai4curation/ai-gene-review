  title: Evidence that a metabolic microcompartment contains and recycles private cofactor pools.
  findings:
  - statement: EutD and EutG were assigned to CoA and NAD recycling branches.
    supporting_text: These are EutD (acetyl-CoA to acetyl phosphate) and EutG (acetaldehyde to ethanol).
  - statement: 'private cofactor recycling implementation: Abstract explicitly describes stringent genetic
