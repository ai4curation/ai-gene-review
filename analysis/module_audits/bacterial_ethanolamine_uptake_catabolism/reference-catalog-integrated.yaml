- id: PMID:41032589
  title: Molecular basis of the biogenesis of a protein organelle for ethanolamine utilization.
  findings:
  - statement: EutG is an LT2 compartment cargo.
    supporting_text: The location of another cargo protein, EutG, was not affected in both ΔeutC2–19 and
      ΔeutE2–21
  - statement: Separate N-terminal regions associate with shell and cargo.
    supporting_text: the EutQ N-terminal H1/H2 interacts with the shell whereas H3/H4 associates with
      cargos.
  - statement: EutQ is incorporated into the LT2 Eut organelle.
    supporting_text: Our results show that only EutQ is encapsulated within the Eut BMC
  - statement: 'LT2 BMC scaffold: Direct LT2 imaging, domain perturbation and interaction data; do not
      equate a scaffold annoton alone with a complete shell.'
    supporting_text: the N-terminal domain of EutQ mediates the physical binding between the shell and
      cargos to ensure encapsulation
  - statement: 'taxon-dependent assembly: Do not grant the LT2 N-terminal scaffold mechanism to all EutQ
      proteins or infer no Gram-positive BMC assembly.'
    supporting_text: the EutQ proteins of Gram-positive species like Enterococcus faecalis and Listeria
      monocytogenes lack the first three α helices
  - statement: Inferred NAD-dependent acetaldehyde reduction to ethanol regenerates NAD+ in the LT2 ethanolamine
      compartment. The family-supported reaction is reversible; physiological direction and cofactor recycling
      are supported by genetics, whereas purified target kinetics remain unresolved.
    supporting_text: The location of another cargo protein, EutG, was not affected in both ΔeutC2–19 and
      ΔeutE2–21
  - statement: Reversible acetate kinase activity of the LT2 cupin-like C-terminal region generates ATP
      and acetate from ADP and acetyl phosphate. Direct coupled assays support pathway chemistry; dedicated
      delivery of this ATP to EutA or EutT remains a hypothesis.
    supporting_text: Our results show that only EutQ is encapsulated within the Eut BMC
  - statement: The N-terminal helices of LT2 EutQ form a physical scaffold linking shell proteins and
      cargo enzymes during ethanolamine microcompartment assembly; this is distinct from its C-terminal
      kinase activity.
    supporting_text: the EutQ N-terminal H1/H2 interacts with the shell whereas H3/H4 associates with
      cargos.
  - statement: The N-terminal helices of LT2 EutQ form a physical scaffold linking shell proteins and
      cargo enzymes during ethanolamine microcompartment assembly; this is distinct from its C-terminal
      kinase activity.
    supporting_text: Our results show that only EutQ is encapsulated within the Eut BMC
  - statement: LT2 EutE and EutC targeting/encapsulation is consistent with internal cargo organization;
      older external-EutBC models are historical.
    supporting_text: Both EutE and EutC have short peptides at their N termini, which act as endogenous
      encapsulation peptides (EPs) to target cargo enzymes into the Eut BMC
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct LT2 fluorescent localization, scarless deletion, domain mapping and shell/cargo
      interaction studies. N-terminal assembly role is not transferable without evidence to Gram-positive
      EutQ lacking the first three helices. ATP delivery to EutA/EutT remains proposed.
- id: PMID:14996820
  title: The eutD gene of Salmonella enterica encodes a protein with phosphotransacetylase enzyme activity.
