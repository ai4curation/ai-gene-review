module: bacterial_ethanolamine_uptake_catabolism
taxon_scope:
  root: NCBITaxon:2
  interpretation: Reusable bacterial mechanism with lineage- and condition-specific implementations, not
    universal bacterial presence.
  reviewed_exemplar_phyla:
  - Pseudomonadota
  - Bacillota
  beyond_panel: Comparative reviews and the Acinetobacter primary constrain universality without inventing
    unverified accession selectors.
boundary:
  start: Extracellular ethanolamine with context-qualified access and compatible active adenosylated cobamide;
    adenosylcobalamin is established for the main panel.
  core: Required EutBC deamination and oxidative acetaldehyde routing preserve the original oxidative
    module boundary. Nitrogen liberation and reductive ethanol formation are separately evaluated subnode
    endpoints.
  endpoints:
  - Nitrogen liberation is established by EutBC but does not by itself prove complete carbon assimilation.
  - Oxidative carbon routing yields acetyl-CoA or acetate.
  - EutG reduction yields ethanol and can recycle NAD+ in a coupled implementation.
  conditional_extensions:
  - EutD acetyl-CoA to acetyl-phosphate restores free CoA.
  - EutQ acetate kinase can couple acetyl-phosphate to ATP generation.
  - EutA damaged-cofactor exchange/reactivation maintains selected lyase implementations.
  - EutQ physical cargo/shell scaffold has separate Salmonella-specific evidence.
  external_dependencies:
  - Compatible active adenosylated cobamide; neither cyanocobalamin availability nor eutA presence alone
    establishes this prerequisite.
  - NAD+/NADH and CoA regeneration depend on the represented branch and physiological context.
  - Regulation and downstream bulk biomass assimilation remain explicit dependencies.
access_model:
  protein_part: Retain EutH and APC/Eat transport families as a conditional optional part in protein-role
    topology.
  environmental_precondition: Substrate access requires a supported transporter under limiting uncharged
    ethanolamine conditions or a diffusion-permissive condition supported for the relevant experimental
    system.
  representation: Use ModuleContext.conditions and evidence for physical access. Do not invent a diffusion
    gene/family or an always-true empty reaction branch.
  evaluation: Evaluate production-compiled protein roles together with an explicit environmental access
    predicate. Report unknown conditions as unsupported, not biological absence.
  tests:
  - Transporter loss permits the defined diffusion-permissive case.
  - The same loss fails a transporter-dependent low-free-substrate case.
  - A transporter alone does not replace EutBC.
  - No active cofactor means no supported lyase chemistry.
reaction_model:
  eutbc: One heteromeric complex; exact compatible EutB/EutC identities. Preserve qualifier sources; catalytic-unit
    language does not assert autonomous isolated EutB activity.
  fates: Required acetaldehyde_oxidation has ONE_OR_MORE acetylating EutE and non-acylating ALDH alternatives;
    optional parallel EutG reduction can coexist. EutBC-only passes only the separately qualified nitrogen-liberation
    endpoint, never the complete oxidative root.
  cycling: Test NAD and CoA recycling only for specifically supported coupled implementations; single-pass
    reaction capacity is not sustained native growth.
  eutq: Separate kinase and scaffold annotons with distinct evidence; Gram-positive architectural differences
    forbid a universal scaffold grant.
