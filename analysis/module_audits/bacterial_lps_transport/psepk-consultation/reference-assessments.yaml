- id: PMID:20446753
  title: Proteins required for lipopolysaccharide assembly in Escherichia coli form a transenvelope complex.
  cached_full_text: true
  statement: E. coli membrane fractionation and copurification support a trans-envelope Lpt assembly. LptA
    cofractionation denotes assembled membrane association, not an integral outer-membrane beta-barrel.
  supporting_text: Remarkably, LptA was also found to co-fractionate almost exclusively with these OM fractions
