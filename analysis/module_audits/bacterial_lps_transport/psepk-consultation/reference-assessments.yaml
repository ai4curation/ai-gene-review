- id: PMID:15919996
  title: Global topology analysis of the Escherichia coli inner membrane proteome.
  cached_full_text: false
  statement: The E. coli global inner-membrane topology survey describes a large-scale method. Its abstract-level
    aggregate result alone does not independently verify the topology of KT2440 LptF or LptG.
  supporting_text: Using C-terminal tagging with the alkaline phosphatase and green fluorescent protein, we
    established the periplasmic or cytoplasmic locations of the C termini for 601 inner membrane proteins.
- id: PMID:16765569
  title: Non-essential KDO biosynthesis and new essential cell envelope biogenesis genes in the Escherichia
