  statement: E. coli LptB2FG mutational work examines coupling of ATP hydrolysis to extraction; exact residue
    phenotypes are not assigned to KT2440 without sequence/construct verification.
  supporting_text: The LptB2FG proteins form an ATP-binding cassette (ABC) transporter that uses energy from
