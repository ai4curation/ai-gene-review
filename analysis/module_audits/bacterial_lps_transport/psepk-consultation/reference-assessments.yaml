- id: PMID:24990744
  title: Structural basis for outer membrane lipopolysaccharide insertion.
  cached_full_text: false
  statement: The linked PDB4N4R structure is Salmonella Typhimurium LT2 LptD/LptE expressed in E. coli, verified
