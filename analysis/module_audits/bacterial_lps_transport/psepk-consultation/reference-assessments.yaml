  title: Biochemical characterization of an ABC transporter LptBFGC complex required for the outer membrane
    sorting of lipopolysaccharides.
  cached_full_text: false
  statement: The E. coli biochemical study reports LptF/LptG association with LptB and inclusion of LptC. Complex
    association supports subunit assignments but is not itself a complete transport-flux assay.
  supporting_text: We report here that both LptF and LptG formed a complex with LptB.
