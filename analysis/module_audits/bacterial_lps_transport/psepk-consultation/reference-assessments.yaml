  statement: This REVIEW synthesizes periplasmic LPS transport and outer-membrane insertion. It is secondary
    mechanistic context, not an independent primary experiment on a KT2440 protein.
  supporting_text: Following extraction, it traverses a bridge formed by LptA and finally is selectively inserted
