  cached_full_text: false
  statement: E. coli conditional expression and complementation establish essentiality of the yrbK/lptC-containing
    distal locus under the tested conditions; this is pathway-context evidence, not a direct KT2440 LPS-transfer
    assay.
  supporting_text: the three distal genes (yrbK, yhbN and yhbG) are essential for E. coli viability.
- id: PMID:16861298
  title: Identification of a protein complex that assembles lipopolysaccharide in the outer membrane of Escherichia
    coli.
  cached_full_text: true
  statement: E. coli LptD/Imp and LptE/RlpB are required for newly synthesized LPS to reach the outer leaflet,
    supporting the outer-membrane assembly role of the pair.
  supporting_text: These data clearly show that in the absence of Imp or RlpB de novo synthesized LPS does
    not reach the outer leaflet of the OM.
- id: PMID:17056748
  title: Characterization of lptA and lptB, two essential genes implicated in lipopolysaccharide transport
    to the outer membrane of Escherichia coli.
  cached_full_text: true
  statement: E. coli LptA/LptB depletion disrupts LPS targeting to the outer membrane. Together with biochemical
    transfer studies this supports a transport role rather than attributing all envelope phenotypes to direct
    catalytic activities.
  supporting_text: Similar defects are observed in cells in which LptA and LptB are individually depleted (Fig.
    6 ), indicating that both proteins are required for LPS targeting to the OM.
- id: PMID:18375759
  title: Identification of two inner-membrane proteins required for the transport of lipopolysaccharide to
    the outer membrane of Escherichia coli.
  cached_full_text: true
  statement: E. coli LptF/YjgP and LptG/YjgQ are distinct inner-membrane proteins required for LPS surface
    transport, supporting specialized roles within the membrane extractor.
  supporting_text: two essential Escherichia coli IM proteins of unknown function, YjgP and YjgQ, which are
    required for the transport of LPS to the cell surface
- id: PMID:18424520
  title: Functional analysis of the protein machinery required for transport of lipopolysaccharide to the outer
    membrane of Escherichia coli.
  cached_full_text: true
  statement: E. coli localization and depletion distinguish cytoplasmic LptB, membrane-anchored LptC and periplasmic
    LptA within one LPS-assembly pathway.
  supporting_text: 'Thus, we have identified an essential LPS transport component in every cellular compartment:
    LptB in the cytoplasm, LptC in the IM, LptA in the periplasm, and LptD and LptE in the OM.'
- id: PMID:18480051
  title: The LptA protein of Escherichia coli is a periplasmic lipid A-binding protein involved in the lipopolysaccharide
    export pathway.
  cached_full_text: false
  statement: Purified E. coli LptA binds structurally diverse LPS through the lipid A region, directly supporting
    substrate binding; KT2440 transfer is inferred from specialized family membership and the conserved bridge
    role.
  supporting_text: Here we provide evidence that LptA binds structurally diverse LPS substrates in vitro and
    demonstrate that it interacts specifically with the lipid A domain of LPS.
