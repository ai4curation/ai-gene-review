- id: PMID:26038291
  title: Transport of lipopolysaccharide to the Gram-negative bacterial cell surface.
  publication_type: REVIEW
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review read in publisher rendering, particularly component discovery, periplasmic
      bridge, terminal insertion, taxonomic distribution and non-LPS organisms. Distribution searches
      are homology surveys, not functional assays. Three-stage overview predates newer regulators.
  access:
    url: https://academic.oup.com/femsre/article/39/6/985/547707
    publication_cache: publications/PMID_26038291.md
    publication_cache_full_text: false
    consulted_text: .cache/module-audit-logs/lps-20261107/literature-consultation/2015-review-full.txt
    consulted_text_sha256: b6f3fa9079c82dc55b8fc83ec3a023ecd2506ae6a8cc01ccdcec6769cd21048f
  checked_quote: Thus, the TM1735 protein does not function in LPS transport in its host organism.
  findings:
  - step: taxon_envelope
    statement: Lpt-related homologs occur in multiple non-proteobacterial diderms and in diderms lacking
      LPS; a homolog is not sufficient evidence of LPS substrate transport.
    scope: Review includes sequence/domain survey; n.d. means not detected, not proved absent.
  - step: boundary
    statement: LPS biosynthesis, MsbA flipping and O-antigen assembly are upstream of the selected outer-IM-leaflet
      to OM-surface transport mechanism.
    scope: The review distinguishes synthesis/flipping from Lpt-mediated export.
  - step: outer_membrane_insertion
    statement: The review recognizes the Neisseria LptE exception and directs readers to the primary surface-accessibility
      study.
    scope: E. coli seven-component essentiality is not a universal taxon rule.
- id: PMID:38816673
  title: Structural Insights into the Lipopolysaccharide Transport (Lpt) System as a Novel Antibiotic
    Target.
  publication_type: REVIEW
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full publisher PDF read for LptBFG/C regulation, bridge architecture and LptDE gating;
      inhibitor survey is outside this curation. Mechanistic synthesis needs primary/source-organism qualification;
      fixed native LptA tetramer stoichiometry is not inferred.
  access:
    url: https://www.jmicrobiol.or.kr/upload/pdf/jm-62-4-261.pdf
    publication_cache: publications/PMID_38816673.md
    publication_cache_full_text: false
    consulted_text: .cache/module-audit-logs/lps-20261107/literature-consultation/2024-review.txt
    consulted_text_sha256: 167bc5f4dabb73f61b2a9be9e490d11555cfb3734e2dd2ce972a8a2cf3b57246
  checked_quote: the structural interactions within the Lpt system
  findings:
  - step: extraction
    statement: The inner-membrane ABC assembly extracts mature outer-leaflet LPS and couples cytoplasmic
      nucleotide turnover to transport. LptC links the extractor to the bridge and modulates ATPase behavior.
    scope: Complex activity; not autonomous transport by an isolated ATPase or permease.
  - step: periplasmic_transfer
    statement: Aligned hydrophobic grooves in LptF/C/A/D support transport across the aqueous periplasm.
    scope: The review provides an architecture overview, not target-specific quantitative kinetics.
  - step: outer_membrane_insertion
    statement: LptD and LptE organize the terminal translocon and selective outer-leaflet insertion.
    scope: General canonical model, qualified by lineage-specific primary evidence and later LptM/Y work.
- id: PMID:35850151
  title: Lipid Transport Across Bacterial Membranes.
  publication_type: REVIEW
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review section4.3 and4.4 read; synthesis of extraction/bridge/insertion distinguished
      from adjacent MsbA/WzmWzt and phospholipid systems. Its explicit E. coli essentiality scope should
      be retained.
  access:
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12981311/
    publication_cache: publications/PMID_35850151.md
    publication_cache_full_text: true
    consulted_text: publications/PMID_35850151.md
    consulted_text_sha256: 048e1eae4aa905bad06f433944be04060ddc0adf4429f8c6a6d2bf617e5bdae5
  checked_quote: The seven proteins of the Lpt system, LptA–LptG, are all essential for LPS transport
    in E. coli
  findings:
  - step: mechanism
    statement: 'Lpt differs from MsbA: extraction starts in the outer IM leaflet, followed by periplasmic
      movement and selective OM insertion.'
    scope: No IM transbilayer activity is assigned to LptBFG.
  - step: periplasmic_transfer
    statement: The number of native LptA molecules and accommodation of different periplasmic widths remained
      open questions.
    scope: Do not assert a universal fixed oligomer count from in vitro polymerization.
  - step: connections
    statement: Hydrophobic grooves connect the inner membrane extractor to LptDE; the OM headgroup route
      and lateral lipid-anchor exit are distinct aspects of delivery.
    scope: Structural/mechanistic review, not independent experimental validation of each taxon.
- id: PMID:41407669
  title: Structural snapshots of Pseudomonas aeruginosa LptB(2)FG and LptB(2)FGC reveal insights into
    lipopolysaccharide recognition and transport.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary Results/Methods read. Genes were amplified from PAO1-LAC DNA and expressed
      in E. coli BL21/ClearColi. A C-terminally His-tagged LptB is used; PAO1 conditional complementation
      supports partial in-vivo function. Cross-species LptC non-substitution is cited prior work, not
      newly measured here.
  access:
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12738788/
    publication_cache: publications/PMID_41407669.md
    publication_cache_full_text: true
    consulted_text: publications/PMID_41407669.md
    consulted_text_sha256: 409c94210cf9eb64ce4716bb3928283aa388eda1141af5c61532a30d6aaa35a3
  checked_quote: tagged LptB variants are at least partially functional in vivo in P. aeruginosa
  findings:
  - step: extraction
    statement: Cryo-EM and native MS characterize Pa LptBFG and LptBFGC states, LPS recognition and lipid
      interactions.
    scope: Structural/substrate-binding evidence and ATPase competence do not alone reconstruct complete
      trans-envelope transport.
  - step: specificity
    statement: Binding preferences for Pa versus E. coli LPS support substrate sensitivity, and cardiolipin
      binding/competition complicates a simplistic LPS-only binding claim.
    scope: Heterogeneous commercial LPS and purified assemblies; no new phospholipid-transport function
      or native KT2440 kinetics inferred.
- id: PMID:41285762
  title: Structural basis of lipopolysaccharide assembly by the outer membrane translocon holo-complex.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results/Discussion and Methods examined. E. coli LptDE(M/Y) complexes, structural
      analysis, crosslinking and functional tests support a terminal-transport contribution. Presence
      in some enterobacterial lineages does not establish universal requirement.
  access:
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12644819/
    publication_cache: publications/PMID_41285762.md
    publication_cache_full_text: true
    consulted_text: publications/PMID_41285762.md
    consulted_text_sha256: 9e9fc1e6cee56d645c61bd8d5385e6dd6fd0c1e47a229a19240b67582707c286
  checked_quote: together, LptM and LptY stabilize the β-taco domain thereby facilitating the connection
    of the OM translocon
  findings:
  - step: outer_membrane_insertion
    statement: LptM occupies the lateral-gate region and influences LPS access; LptY stabilizes the periplasmic
      LptD receptor domain.
    scope: Positive roles exceed a generic assembly-only description, while the detailed contraction/extension
      cycle remains partly mechanistic proposal.
  - step: connections
    statement: Together the accessory lipoproteins improve connection of the translocon to the inner-membrane
      transport machinery.
    scope: Supported optional lineage-qualified efficiency/organization roles, not compulsory components
      in every LPS-producing organism.
  - step: assembly_vs_transport
    statement: LptM also contributes to LptD oxidative maturation, whereas LptY did not show the same
      maturation role.
    scope: Distinguish biogenesis from transport contribution; neither is added as a separate chemical
      reaction.
- id: PMID:42844470
  title: Structural basis for regulating lipopolysaccharide transmembrane transport.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Nature main text, Methods and figures read externally; normal cache remains abstract-only.
      E. coli machinery; LptC–LptA fusion stabilizes structural bridge. Some protein preparations use
      an LPS-null A. baylyi host expressing E. coli proteins, not Acinetobacter target orthologs.
  access:
    url: https://www.nature.com/articles/s41586-026-11129-8
    publication_cache: publications/PMID_42844470.md
    publication_cache_full_text: false
    consulted_text: .cache/module-audit-logs/lps-20261107/literature-consultation/2026-regulation.txt
    consulted_text_sha256: 4cd4769736a30da8fa89152ae8608812382c2b8182935b956b0cbea350ca7ab4
  checked_quote: Lpt bridge assembly triggers movement of the transmembrane helix of LptC (TM-LptC) in
    an LPS-dependent manner
  findings:
  - step: connections
    statement: Bridge assembly and LPS occupancy regulate TM-LptC displacement and ATP binding/hydrolysis,
      linking completion of the bridge to productive activity.
    scope: Biochemical and E. coli cellular support; engineered structural stabilization is explicit.
  - step: extraction
    statement: LptC is both a structural coupling element and part of regulatory gating of extraction.
    scope: Do not convert substrate-driven mechanical regulation into an unsupported separate signal-transduction
      function.
  - step: periplasmic_transfer
    statement: A viable engineered LptC–LptA fusion supports the bridge mechanism but does not establish
      native universal LptA stoichiometry.
    scope: Native architecture and engineered construct are distinguished.
- id: PMID:21705335
  title: The LptD chaperone LptE is not directly involved in lipopolysaccharide transport in Neisseria
    meningitidis.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full external primary Results/Figures2–4 and strain Table1 read. H44/76 L3 and HB-1
      derivative studied; MC58 locus identifiers are homology coordinates. Exact natural protein bridges
      are in identity/results.json; no MC58 native phenotype is asserted.
  access:
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC3190676/
    publication_cache: publications/PMID_21705335.md
    publication_cache_full_text: false
    consulted_text: .cache/module-audit-logs/lps-20261107/literature-consultation/Nm-LptE.txt
    consulted_text_sha256: c197f40376e388be6244be38437f020653193e8a8e74c7e2fcb5ae6b24a9c4ea
  checked_quote: Only the LPS of the wild type and of the Δ lptE mutant was surface-accessible
  findings:
  - step: outer_membrane_insertion
    statement: LptE deletion preserves surface-accessible LPS in the tested meningococcal backgrounds
      while reducing LptD abundance, supporting a chaperone/biogenesis role.
    scope: LptE dispensability for that endpoint differs from absence of all possible contributions.
  - step: periplasmic_transfer
    statement: LptH/C/F/G mutants fail cell-surface accessibility assays. LptC/B/H conditional depletion
      reduces cellular LPS, restored by expression.
    scope: Viability without LPS is not normal LPS transport; no native LptC-independent pathway is established.
  - step: identity
    statement: Meningococcal carrier LptH is distinct from the lipid A phosphoethanolamine transferase
      also called LptA.
    scope: Q7DDQ9 is the carrier, even though its UniProt gene field uses lptA.
