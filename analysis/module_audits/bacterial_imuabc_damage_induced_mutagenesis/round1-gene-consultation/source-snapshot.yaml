terms:
- id: GO:0042276
  label: error-prone translesion synthesis
  definition: The conversion of DNA-damage induced single-stranded gaps into large molecular weight DNA
    after replication by using a specialized DNA polymerase or replication complex to insert a defined
    nucleotide across the lesion. This process does not remove the replication-blocking lesions and causes
    an increase in the endogenous mutation level. For example, in E. coli, a low fidelity DNA polymerase,
    pol V, copies lesions that block replication fork progress. This produces mutations specifically targeted
    to DNA template damage sites, but it can also produce mutations at undamaged sites.
- id: GO:0004857
  label: enzyme inhibitor activity
  definition: A molecular function regulator that reduces a catalytic activity.
- id: GO:0000150
  label: DNA strand exchange activity
  definition: Catalysis of the identification and base-pairing of homologous sequences between single-stranded
    DNA and double-stranded DNA.
- id: GO:0008408
  label: 3'-5' exonuclease activity
  definition: Catalysis of the hydrolysis of ester linkages within nucleic acids by removing nucleotide
    residues from the 3' end.
- id: GO:0045910
  label: negative regulation of DNA recombination
  definition: Any process that stops, prevents, or reduces the frequency, rate or extent of DNA recombination.
- id: GO:0003887
  label: DNA-directed DNA polymerase activity
  definition: 'Catalysis of the reaction: deoxynucleoside triphosphate + DNA(n) = diphosphate + DNA(n+1);
    DNA-template-directed extension of the 3''-end of a DNA strand by one nucleotide at a time.'
