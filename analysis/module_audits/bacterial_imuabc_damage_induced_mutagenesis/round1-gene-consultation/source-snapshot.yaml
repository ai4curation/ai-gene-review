  name:
    name: Error-prone DNA polymerase/DNA polymerase III subunit alpha DnaE/PolC
    short: DnaE2/DnaE/PolC
  description:
  - text: <p>All proteins in this family for which functions are known are DNA polymerases. The group
      includes the error-prone DNA polymerase (DnaE2), involved in damage-induced mutagenesis and translesion
      synthesis (TLS), DNA polymerase III PolC-type, and the alpha subunit of DNA polymerase III (DnaE)
      ([ec:2.7.7.7]). DNA polymerase III is a complex, multichain enzyme responsible for most of the replicative
      synthesis in bacteria. This DNA polymerase also exhibits 3' to 5' exonuclease activity.</p>
    llm: false
    checked: false
    updated: false
