  description:
  - text: <p>This is a conserved region found in the the DNA polymerase III alpha subunit, ([ec:2.7.7.7]).
      DNA polymerase III is a complex, multichain enzyme responsible for most of the replicative synthesis
      in bacteria. This DNA polymerase also exhibits 3' to 5' exonuclease activity. The alpha chain is
      the DNA polymerase [[cite:PUB00019430]].</p>
