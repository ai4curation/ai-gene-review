          with what fidelity, and does its PHP domain retain measurable nuclease activity?
      suggested_experiments:
      - description: Reconstitute DnaE2 with ImuA', ImuB and the beta clamp on lesion-containing primer-templates,
          measure bypass efficiency and misinsertion spectra, and compare with DnaE1 to identify a selectivity
          window for inhibitors.
  genes/MYXXD/MXAN_3991/MXAN_3991-ai-review.yaml:
    sha256: 0870f1d55f068060a12a1193bca1202998e0ecc1bdfbb8b23426279ff715165b
    document:
      id: Q1D5A2
      gene_symbol: MXAN_3991
      product_type: PROTEIN
      status: COMPLETE
      taxon:
        id: NCBITaxon:246197
        label: Myxococcus xanthus DK 1622
      description: ImuA (MXAN_3991) is a RecA-like accessory protein of Myxococcus xanthus DK1622 involved
        in mutagenic DNA lesion bypass. It binds DNA and hydrolyzes ATP, with hydrolysis enhanced by DNA.
        It associates with ImuB and RecA1 and inhibits RecA1-mediated DNA binding and recombination. These
        activities support a role in balancing recombination and translesion synthesis, although coupling
        of its ATPase cycle to assembly or disassembly of the lesion-bypass machinery remains a mechanistic
        hypothesis.
      existing_annotations:
      - term:
          id: GO:0003697
          label: single-stranded DNA binding
        evidence_type: IEA
        original_reference_id: GO_REF:0000002
        qualifier: enables
        supporting_entities:
        - InterPro:IPR013765
        review:
          summary: Single-stranded DNA binding is supported by direct biochemical measurements.
          action: ACCEPT
          reason: PMID38591662 measured binding of purified M. xanthus ImuA to short single-stranded DNA
            by fluorescence polarization and found nucleotide-dependent changes in affinity. PMID34190612
            had not detected DNA binding using a different long-DNA mobility-shift assay. The later positive
            assay supports the claim under measured conditions; the earlier negative result is not evidence
            of universal absence. The accession bridge is documented by the primary promoter/genome sequence
            analysis.
          supported_by: &id001
          - reference_id: PMID:38591662
          - reference_id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/myxococcus-consultation/RESULTS.md
      - term:
          id: GO:0005524
          label: ATP binding
        evidence_type: IEA
        original_reference_id: GO_REF:0000002
        qualifier: enables
        supporting_entities:
        - InterPro:IPR013765
        review:
          summary: ATP binding is consistent with directly measured ATP hydrolysis and nucleotide-dependent
            DNA binding.
          action: ACCEPT
          reason: Purified M. xanthus ImuA hydrolyzes ATP and its DNA-binding behavior responds to ADP
            and a nonhydrolyzable ATP analog in PMID38591662. These positive target-protein assays support
            ATP interaction independently of the generic RecA-domain mapping. ATP binding and ATP hydrolysis
            are distinct ontology claims, so binding is retained alongside the specific catalytic proposal.
          supported_by: *id001
      - term:
          id: GO:0006281
          label: DNA repair
        evidence_type: IEA
        original_reference_id: GO_REF:0000002
        qualifier: involved_in
        supporting_entities:
        - InterPro:IPR013765
        review:
          summary: Refine the broad repair assignment to the supported error-prone lesion-bypass process.
          action: MODIFY
          reason: 'Target-strain genetics and direct ImuB/RecA1 interactions in PMID34190612 support an
            accessory contribution to mutagenic lesion bypass, rather than establishing that ImuA itself
            catalyzes homologous recombination. Its physical regulatory activity supplies work in the
            process; it is not merely a necessary substrate. The imuA deletion reduced rather than abolished
            induced mutagenesis, so absolute indispensability is not asserted. GO0042276 specifies this
            mechanism. This is a branch correction: current GO does not place error-prone translesion
            synthesis under GO0006281, although the broad repair definition includes bypass.'
          proposed_replacement_terms:
          - id: GO:0042276
            label: error-prone translesion synthesis
          supported_by:
          - reference_id: PMID:34190612
          - reference_id: PMID:38591662
          - reference_id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/myxococcus-consultation/RESULTS.md
          - reference_id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/myxococcus-consultation/source-scope.md
      - term:
          id: GO:0016887
          label: ATP hydrolysis activity
        evidence_type: IDA
        original_reference_id: PMID:38591662
        qualifier: enables
        review:
          summary: Directly measured ATP hydrolysis is missing from the seeded annotations.
          action: NEW
          reason: PMID38591662 directly measured ATP turnover by purified M. xanthus ImuA using phosphate-release
            assays, with enhancement by single- and double-stranded DNA. This supports ATP hydrolysis
            activity. DNA stimulation alone does not establish ATP-dependent modification of DNA, helicase
            activity, or a demonstrated ATP-driven mutasome disassembly mechanism. The proposal is a molecular
            activity and is neither an ancestor nor a descendant of the existing ATP-binding claim.
          supported_by: *id001
      references:
      - id: GO_REF:0000002
        title: Gene Ontology annotation through association of InterPro records with GO terms
        findings: []
      - id: PMID:34190612
        title: ImuA Facilitates SOS Mutagenesis by Inhibiting RecA-Mediated Activity in Myxococcus xanthus.
        findings:
        - statement: M. xanthus DK1622 ImuA physically associates with ImuB and RecA1 and inhibits RecA1
            activity; deletion reduces, but does not eliminate, induced mutagenesis.
        reference_review:
          relevance: HIGH
          correctness: VERIFIED
          review_notes: Primary-source scope and accessibility are documented in source-scope.md. The
            2021 local cache remains abstract-only; external full text and Figure 1 were read. The 2024
            local full text and downloaded supplement were inspected.
      - id: PMID:38591662
        title: Myxococcus xanthus translesion DNA synthesis protein ImuA is an ATPase enhanced by DNA.
        findings:
        - statement: Purified M. xanthus ImuA binds DNA and hydrolyzes ATP, with DNA-enhanced turnover;
            its proposed role in mutasome assembly/disassembly is not directly reconstituted.
        reference_review:
          relevance: HIGH
          correctness: VERIFIED
          review_notes: Primary-source scope and accessibility are documented in source-scope.md. The
            2021 local cache remains abstract-only; external full text and Figure 1 were read. The 2024
            local full text and downloaded supplement were inspected.
      - id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/myxococcus-consultation/RESULTS.md
        title: Primary-sequence identity bridge for Myxococcus xanthus ImuA
        findings:
        - statement: The primary imuA promoter sequence uniquely maps immediately upstream of MXAN_3991;
            its CDS translation equals the Q1D5A2 sequence.
      - id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/myxococcus-consultation/source-scope.md
        title: Myxococcus ImuA primary-source scope and evidence limits
        findings:
        - statement: The 2021 and 2024 assays support different condition-dependent aspects of ImuA, without
            establishing a complete biochemical lesion-bypass cycle.
      aliases:
      - imuA
      core_functions:
      - description: DNA-stimulated ATP hydrolysis by the RecA-like ImuA accessory factor. Direct biochemical
          activity is established; its precise coupling to the lesion-bypass machinery remains unresolved.
        molecular_function:
          id: GO:0016887
          label: ATP hydrolysis activity
        directly_involved_in:
        - id: GO:0042276
          label: error-prone translesion synthesis
        supported_by:
        - reference_id: PMID:38591662
        - reference_id: PMID:34190612
        - reference_id: file:analysis/module_audits/bacterial_imuabc_damage_induced_mutagenesis/myxococcus-consultation/RESULTS.md
        knowledge_gaps:
        - gap_statement: How the ATPase cycle contributes to the functional lesion-bypass complex is unresolved.
          boundary: DNA-stimulated ATP turnover and partner interactions are measured, but ATP-driven
            complex assembly/disassembly is proposed rather than reconstituted.
          significance: The distinction prevents a measured catalytic capacity from being mistaken for
            a complete established reaction sequence.
          gap_kind:
          - BIOLOGY
      - description: Binding single-stranded DNA, with affinity influenced by nucleotide state; the same
          study also demonstrated double-stranded DNA binding.
        molecular_function:
          id: GO:0003697
          label: single-stranded DNA binding
        supported_by: *id001
      suggested_questions:
      - question: How do the measured ATPase and nucleotide-sensitive DNA-binding activities couple to
          the ImuB-associated lesion-bypass mechanism in native M. xanthus?
