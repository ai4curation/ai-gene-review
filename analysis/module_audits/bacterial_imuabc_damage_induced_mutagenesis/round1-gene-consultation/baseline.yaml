reviews:
  genes/CAUVC/dnaE2/dnaE2-ai-review.yaml:
    sha256: f3bc712ac818dc2997e937d87bfb0c689588ff7200a49e6389c12190cb08388a
    document:
      id: Q9A3J3
      gene_symbol: dnaE2
      product_type: PROTEIN
      status: COMPLETE
      taxon:
        id: NCBITaxon:190650
        label: Caulobacter vibrioides CB15
      description: DnaE2 (CC_3211) is the type-C DNA polymerase of the SOS-regulated imuA-imuB-dnaE2 operon
        in Caulobacter vibrioides, historically called C. crescentus. It is distinct from the essential
        replicative DnaE paralog. In the CB15-derived NA1000 strain, dnaE2 disruption strongly increases
        mitomycin C sensitivity and reduces damage-induced mutagenesis, with a UV mutation-spectrum change
        shared with imuB. Conserved DnaE2 family features and catalytic-mutant studies in mycobacteria
        support a polymerase role in mutagenic lesion bypass, while its target-specific lesion repertoire,
        fidelity and proofreading capacity remain unresolved.
      existing_annotations:
      - term:
          id: GO:0003676
          label: nucleic acid binding
        evidence_type: IEA
        original_reference_id: GO_REF:0000002
        qualifier: enables
        review:
          summary: Template binding is intrinsic to a DNA polymerase, but the term is very broad.
          action: MODIFY
          reason: 'True but less specific than the evidence supports, and not an ancestor of the activity
            asserted as core: GO:0003887 has no is_a path to GO:0003676, so this is a refinement rather
            than a TOO_GENERAL case. The row is mapped from a generic nucleic-acid-binding domain signature,
            but this protein''s curated activity is DNA-templated synthesis on a DNA primer-template,
            so DNA binding is the supported child term.'
          proposed_replacement_terms:
          - id: GO:0003677
            label: DNA binding
          supported_by:
          - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
            record_section:
            - CC:SIMILARITY
            supporting_text: Belongs to the DNA polymerase type-C family. DnaE2
      - term:
          id: GO:0003824
          label: catalytic activity
        evidence_type: IEA
        original_reference_id: GO_REF:0000002
        qualifier: enables
        review:
          summary: Catalytic activity is true but uninformative.
          action: TOO_GENERAL
          reason: 'True of the protein but uninformative: GO:0003887, accepted in this review, is an is_a
            descendant of catalytic activity and so already entails it. The claim is not wrong, which
            is why this is TOO_GENERAL rather than an over-annotation.'
          supported_by:
          - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
            record_section:
            - CC:CATALYTIC ACTIVITY
            supporting_text: Reaction=DNA(n) + a 2'-deoxyribonucleoside 5'-triphosphate = DNA(n+1) +
      - term:
          id: GO:0003887
          label: DNA-directed DNA polymerase activity
        evidence_type: IEA
        original_reference_id: GO_REF:0000120
        qualifier: enables
        review:
          summary: This is the defining catalytic activity of DnaE2.
          action: ACCEPT
          reason: UniProt places Q9A3J3 in the DnaE2 subfamily of type-C DNA polymerases and records the
            templated nucleotidyl-transfer reaction; in the characterized mycobacterial cassette, substituting
            the DnaE2 catalytic residues reproduces the deletion phenotype, which establishes that the
            DnaE2 alpha subunit, and not ImuB, performs the synthesis. The purified C. crescentus enzyme
            has not been assayed, so the activity rests on the family assignment plus the ortholog catalytic-residue
            result.
          supported_by:
          - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
            record_section:
            - CC:SIMILARITY
            supporting_text: Belongs to the DNA polymerase type-C family. DnaE2
          - reference_id: PMID:20615954
            supporting_text: "In contrast, replacement of DnaE2 catalytic residues reproduces the dnaE2\
              \ gene deletion phenotype, strongly implying a direct role for the \u03B1-subunit in mutagenic\
              \ lesion bypass."
      - term:
          id: GO:0005737
          label: cytoplasm
        evidence_type: IEA
        original_reference_id: GO_REF:0000120
        qualifier: located_in
        review:
          summary: The inferred cytoplasmic location is appropriate for the core DNA-synthesis role.
          action: ACCEPT
          reason: The curated homology-based location and activity on intracellular chromosomal DNA support
            the cytoplasm. This is the location of the central function, not a peripheral role merely
            because it is inferred. No target microscopy or more precise subcellular compartment is claimed.
          supported_by:
          - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
            record_section:
            - CC:SUBCELLULAR LOCATION
            supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm {ECO:0000250}.'
      - term:
          id: GO:0006260
          label: DNA replication
        evidence_type: IEA
        original_reference_id: GO_REF:0000002
        qualifier: involved_in
        review:
          summary: DNA replication is broad but includes the supported translesion synthesis process in
            current GO.
          action: MODIFY
          reason: Current QuickGO places GO:0042276 error-prone translesion synthesis under DNA damage
            tolerance (GO:0006301), which is part_of DNA replication (GO:0006260); this is not a pure
            is_a path. The broad term is therefore compatible with the supported process and must not
            be rejected by equating it exclusively with routine chromosome duplication. Refine to the
            existing specific TLS proposal. The native disruption has no reported growth defect under
            the tested conditions, which distinguishes DnaE2 from essential replicative DnaE but does
            not negate the ontology ancestor.
          supported_by:
          - reference_id: PMID:15886391
            supporting_text: These results indicate that imuB and dnaE2 cooperate in a lesion bypass pathway,
              which has a different specificity than that involving umuDC in E.coli.
          - reference_id: PMID:15886391
            supporting_text: These gene disruptions had no effect upon cell growth
          proposed_replacement_terms:
          - id: GO:0042276
            label: error-prone translesion synthesis
      - term:
          id: GO:0006281
          label: DNA repair
        evidence_type: IEA
        original_reference_id: GO_REF:0000104
        qualifier: involved_in
        review:
          summary: Mutagenic translesion synthesis is more informative than the broad DNA repair annotation.
          action: MODIFY
          reason: Current GO:0006281 explicitly includes bypass among DNA-damage processing pathways,
            so lesion persistence alone does not make that broad annotation false. Native Caulobacter
            disruption and mutation-spectrum data specifically support mutagenic damage tolerance. Retain
            MODIFY to GO:0042276 as a process-specific correction; TLS is not currently an is_a descendant
            of DNA repair. The evidence is genetic and does not directly measure excision or purified
            lesion bypass.
          proposed_replacement_terms:
          - id: GO:0042276
            label: error-prone translesion synthesis
          supported_by:
          - reference_id: PMID:15886391
            supporting_text: These results indicate that imuB and dnaE2 cooperate in a lesion bypass pathway,
              which has a different specificity than that involving umuDC in E.coli.
      - term:
          id: GO:0006974
          label: DNA damage response
        evidence_type: IEA
        original_reference_id: GO_REF:0000117
        qualifier: involved_in
        review:
          summary: DnaE2 is induced by DNA damage and acts on damaged templates.
          action: TOO_GENERAL
          reason: 'True, and the induction is real: the operon is upregulated after UV and mitomycin C
            in a recA-dependent way. But GO:0042276, asserted in this review, is an is_a descendant of
            DNA damage response through GO:0019985 and GO:0006301, so this term adds nothing beyond it.'
          supported_by:
          - reference_id: PMID:15886391
            supporting_text: The results shown in Figure 5 demonstrate that imuA, imuB and dnaE2 expression
              levels are increased similarly in response to UV damage.
      - term:
          id: GO:0008408
          label: 3'-5' exonuclease activity
        evidence_type: IEA
        original_reference_id: GO_REF:0000002
        qualifier: enables
        review:
          summary: Intrinsic 3-prime-to-5-prime exonuclease activity has not been resolved for Caulobacter
            DnaE2.
          action: UNDECIDED
          reason: The broad DnaE/PHP domain mapping does not establish an active exonuclease in Q9A3J3.
            PMID:20615954 discusses missing PHP catalytic residues in the mycobacterial DnaE2 comparison,
            but a residue-by-residue correspondence to this target has not been established here. An error-prone
            phenotype is not itself evidence that proofreading is absent. Without target enzyme assays
            or an independently verified target catalytic-site analysis, neither this activity nor its
            loss can be asserted; retain the source claim as UNDECIDED rather than transferring a negative
            result across the family.
          supported_by:
          - reference_id: PMID:20615954
            supporting_text: "The corresponding domain of Mtb DnaE1 retains all amino acids associated\
              \ with exonuclease activity ( 34 \u2013 36 ), whereas key residues are absent in DnaE2."
      - term:
          id: GO:0034061
          label: DNA polymerase activity
        evidence_type: IEA
        original_reference_id: GO_REF:0000116
        qualifier: enables
        review:
          summary: The parent polymerase term is valid but redundant with its DNA-directed child.
          action: TOO_GENERAL
          reason: GO:0003887, accepted here as the core molecular function, is an is_a child of DNA polymerase
            activity and entails it, so the parent term is true but carries no additional information.
          supported_by:
          - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
            record_section:
            - CC:CATALYTIC ACTIVITY
            supporting_text: Reaction=DNA(n) + a 2'-deoxyribonucleoside 5'-triphosphate = DNA(n+1) +
      - term:
          id: GO:0071897
          label: DNA biosynthetic process
        evidence_type: IEA
        original_reference_id: GO_REF:0000120
        qualifier: involved_in
        review:
          summary: DNA synthesis does occur, but the parent process lacks the damage-bypass context.
          action: TOO_GENERAL
          reason: A true is_a ancestor of GO:0042276, which is asserted in this review from the primary
            genetics; error-prone translesion synthesis is substantially more informative, so this term
            adds nothing.
          supported_by:
          - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
            record_section:
            - CC:FUNCTION
            supporting_text: 'CC   -!- FUNCTION: DNA polymerase involved in damage-induced mutagenesis
              and'
      - term:
          id: GO:0042276
          label: error-prone translesion synthesis
        evidence_type: IMP
        original_reference_id: PMID:15886391
        qualifier: involved_in
        review:
          summary: A dnaE2 disruption abolishes mitomycin C-induced mutagenesis, reduces UV-induced mutagenesis
            and changes the UV mutational spectrum, in the same pathway as imuB.
          action: NEW
          reason: Retain the historical IMP proposal. Native disruption, damage sensitivity, altered rpoB
            mutation spectra and epistasis with imuB support a DnaE2-dependent mutagenic bypass pathway
            in NA1000, a CB15 derivative. These assays do not directly observe incorporation opposite
            a defined lesion. The polymerase assignment is additionally grounded in the specific DnaE2
            family and catalytic-mutant evidence from mycobacteria; the target lesion repertoire and insertion-versus-extension
            contributions remain unmeasured.
          supported_by:
          - reference_id: PMID:15886391
            supporting_text: The results show that the dnaE2 operon is upregulated in response to DNA
              damage in a recA-dependent manner, and demonstrate that all three genes that compose this
              expression unit are involved in UV and mitomycin C-induced mutagenesis.
          - reference_id: PMID:15886391
            supporting_text: This novel mutational signature, dependent on the activity of the imuAB/dnaE2
              operon, probably reflects a difference in polymerase preference for nucleotide incorporation
              during TLS.
          - reference_id: PMID:20615954
            supporting_text: In combination with the prediction that ImuB lacks polymerase activity, this
              observation implies that DnaE2 catalyzes translesion synthesis.
      references:
      - id: GO_REF:0000002
        title: Gene Ontology annotation through association of InterPro records with GO terms
        findings: []
      - id: GO_REF:0000104
        title: Electronic Gene Ontology annotations created by transferring manual GO annotations between
          related proteins based on shared sequence features
        findings: []
      - id: GO_REF:0000116
        title: Automatic Gene Ontology annotation based on Rhea mapping
        findings: []
      - id: GO_REF:0000117
        title: Electronic Gene Ontology annotations created by ARBA machine learning models
        findings: []
      - id: GO_REF:0000120
        title: Combined Automated Annotation using Multiple IEA Methods
        findings: []
      - id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
        title: UniProtKB entry for dnaE2 (Q9A3J3)
        findings:
        - statement: Q9A3J3 is a reviewed member of the DnaE2 subfamily of type-C DNA polymerases, with
            the templated nucleotidyl-transfer reaction and a cytoplasmic location recorded.
          record_section:
          - CC:SIMILARITY
          supporting_text: Belongs to the DNA polymerase type-C family. DnaE2
      - id: PMID:15886391
        title: An SOS-regulated operon involved in damage-inducible mutagenesis in Caulobacter crescentus.
        findings:
        - statement: dnaE2 disruption abolishes mitomycin C-induced mutagenesis and reduces UV-induced
            mutagenesis; imuB and dnaE2 are epistatic.
          supporting_text: The results show that the dnaE2 operon is upregulated in response to DNA damage
            in a recA-dependent manner, and demonstrate that all three genes that compose this expression
            unit are involved in UV and mitomycin C-induced mutagenesis.
        - statement: C. crescentus DnaE2 falls in a branch distinct from the replicative DnaE polymerases.
          supporting_text: DnaE2 orthologs clearly form a distinct branch, including the DnaE2 from C.crescentus.
        reference_review:
          relevance: HIGH
          correctness: VERIFIED
          review_notes: Full text cached; the primary source for every physiological claim in this review.
            Experiments are in NA1000, a derivative of the sequenced CB15 strain this entry represents.
      - id: PMID:20615954
        title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent mutagenesis
          in Mycobacterium tuberculosis.
        findings:
        - statement: In mycobacteria, DnaE2 active-site substitution reproduces the deletion phenotype,
            supporting a catalytic role in mutagenic bypass.
          supporting_text: Point mutations in the DnaE2 active site eliminated induced mutagenesis and
            damage tolerance, reproducing the dnaE2 deletion phenotype.
        - statement: The reported mycobacterial DnaE2 comparison lacks PHP-domain residues retained in
            DnaE1; this does not establish the corresponding residue configuration in Caulobacter.
          supporting_text: "The corresponding domain of Mtb DnaE1 retains all amino acids associated with\
            \ exonuclease activity ( 34 \u2013 36 ), whereas key residues are absent in DnaE2."
        reference_review:
          relevance: HIGH
          correctness: VERIFIED
          review_notes: Full cached primary read. Catalytic-mutant and PHP-domain findings concern mycobacteria.
            They inform the conserved polymerase assignment and target experiments, but do not establish
            Caulobacter proofreading loss or a target biochemical assay.
      core_functions:
      - description: Damage-inducible DNA-directed DNA polymerase inferred to provide synthesis in the
          ImuA-ImuB-DnaE2 mutagenic bypass pathway. Native Caulobacter genetics establishes pathway dependence;
          conserved family features and mycobacterial active-site mutations support the catalytic assignment.
          Exact lesion specificity, fidelity and insertion-versus-extension contributions remain unresolved
          for this target.
        molecular_function:
          id: GO:0003887
          label: DNA-directed DNA polymerase activity
        directly_involved_in:
        - id: GO:0042276
          label: error-prone translesion synthesis
        supported_by:
        - reference_id: file:CAUVC/dnaE2/dnaE2-uniprot.txt
          record_section:
          - CC:SIMILARITY
          supporting_text: Belongs to the DNA polymerase type-C family. DnaE2
        - reference_id: PMID:15886391
          supporting_text: This novel mutational signature, dependent on the activity of the imuAB/dnaE2
            operon, probably reflects a difference in polymerase preference for nucleotide incorporation
            during TLS.
        - reference_id: PMID:20615954
          supporting_text: In combination with the prediction that ImuB lacks polymerase activity, this
            observation implies that DnaE2 catalyzes translesion synthesis.
        knowledge_gaps:
        - gap_statement: Purified Caulobacter DnaE2 activity has not been established in the reviewed
            literature; its lesion repertoire, fidelity, insertion-versus-extension role and any PHP-dependent
            exonuclease activity remain unresolved.
          boundary: The genetic requirement for induced mutagenesis and damage tolerance, and the catalytic-residue
            dependence of that requirement in the mycobacterial ortholog, are established.
          significance: Fidelity and lesion specificity determine which mutations the cassette generates,
            which is what makes it a candidate target for limiting resistance evolution.
          gap_kind:
          - BIOLOGY
          dark_aspect: MF_DARK
      proposed_new_terms: []
      suggested_questions:
      - question: Which lesions can the C. crescentus ImuA-ImuB-DnaE2 complex bypass in vitro, and does
          reconstitution with the beta clamp reproduce the G:C to C:G transversion signature seen in vivo?
      suggested_experiments:
      - description: Reconstitute purified DnaE2 with ImuA, ImuB and the beta clamp on primer-templates
          carrying defined UV and mitomycin C lesions, measure bypass efficiency and misinsertion spectra,
          and compare with the rpoB mutational signature of the operon mutants.
  genes/PSEPK/dnaE2/dnaE2-ai-review.yaml:
    sha256: 506e390c36a37815afe3807aff82ae79221bc2a8b6e56259a9fcfd3ba377041c
    document:
      id: Q88I82
      gene_symbol: dnaE2
      product_type: PROTEIN
      status: COMPLETE
      taxon:
        id: NCBITaxon:160488
        label: Pseudomonas putida KT2440
      description: DnaE2 (PP_3119, ImuC) is the specialized DNA polymerase of the LexA2-regulated ImuABC
        cassette in Pseudomonas putida KT2440. Curated DnaE2-family evidence supports DNA synthesis during
        lesion bypass rather than bulk chromosome replication. Native studies in PaW85, described as isogenic
        to KT2440, establish alkylation-damage tolerance and MMS-induced mutagenesis under defined temperature
        and repair-background conditions. Older stationary-phase and UV studies report antimutator effects.
        These outcomes are conditional; neither defines an invariant fidelity state for all lesions. Direct
        purified-target lesion specificity and proofreading activity remain unresolved.
      existing_annotations:
      - term:
          id: GO:0003676
          label: nucleic acid binding
        evidence_type: IEA
        original_reference_id: GO_REF:0000002
        qualifier: enables
        review:
          summary: DNA-template binding is intrinsic to polymerase activity but this term is broad.
          action: MODIFY
          reason: 'True but less specific than the evidence supports, and not an ancestor of the activity
            asserted as core: GO:0003887 has no is_a path to GO:0003676, so this is a refinement rather
            than a TOO_GENERAL case. The row is mapped from IPR004365, a generic OB-fold nucleic-acid-binding
            domain shared with tRNA-binding proteins, but this protein''s curated activity is DNA-templated
            synthesis on a DNA primer-template, so DNA binding is the supported child term.'
          proposed_replacement_terms:
          - id: GO:0003677
            label: DNA binding
          supported_by:
          - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
            record_section:
            - DR:InterPro
            supporting_text: DR   InterPro; IPR004365; NA-bd_OB_tRNA.
      - term:
          id: GO:0003824
          label: catalytic activity
        evidence_type: IEA
        original_reference_id: GO_REF:0000002
        qualifier: enables
        review:
          summary: Refine generic catalysis to the supported DNA-directed polymerase activity.
          action: MODIFY
          reason: Catalytic activity is true from independently curated DnaE2 polymerase chemistry, regardless
            of the PHP-domain route that generated this row. Refine to the specific supported catalytic
            descendant already present; do not use a generic PHP match as proof of proofreading.
          supported_by:
          - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
            record_section:
            - CC:CATALYTIC ACTIVITY
            supporting_text: Reaction=DNA(n) + a 2'-deoxyribonucleoside 5'-triphosphate = DNA(n+1) +
          proposed_replacement_terms:
          - id: GO:0003887
            label: DNA-directed DNA polymerase activity
      - term:
          id: GO:0003887
          label: DNA-directed DNA polymerase activity
        evidence_type: IEA
        original_reference_id: GO_REF:0000120
        qualifier: enables
        review:
          summary: This is the defining catalytic activity of DnaE2.
          action: ACCEPT
          reason: HAMAP MF_01902 places Q88I82 in the DnaE2 subfamily of type-C DNA polymerases and its
            curated function statement describes a DNA polymerase acting in damage-induced mutagenesis;
            the activity is a family-rule inference, as the purified KT2440 enzyme has not been assayed.
          supported_by:
          - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
            record_section:
            - CC:FUNCTION
            supporting_text: DNA polymerase involved in damage-induced mutagenesis and
          - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
            record_section:
            - DR:HAMAP
            supporting_text: DR   HAMAP; MF_01902; DNApol_error_prone; 1.
      - term:
          id: GO:0005737
          label: cytoplasm
        evidence_type: IEA
        original_reference_id: GO_REF:0000120
        qualifier: located_in
        review:
          summary: Cytoplasmic localization is consistent with action on the bacterial chromosome.
          action: ACCEPT
          reason: Curated HAMAP localization and DNA-associated polymerase function support the cytoplasmic
            location where the core activity acts. This remains a conserved-role inference, not a native
            localization assay. Component membership is not peripheral merely because it is not a catalytic
            term; no finer subcompartment is asserted from this evidence alone.
          supported_by:
          - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
            record_section:
            - CC:SUBCELLULAR LOCATION
            supporting_text: 'CC   -!- SUBCELLULAR LOCATION: Cytoplasm {ECO:0000255|HAMAP-Rule:MF_01902}.'
      - term:
          id: GO:0006260
          label: DNA replication
        evidence_type: IEA
        original_reference_id: GO_REF:0000002
        qualifier: involved_in
        review:
          summary: Refine true DNA replication participation to specialized translesion synthesis.
          action: MODIFY
          reason: 'Current GO places TLS below DNA replication: it is specialized synthesis across damaged
            templates within DNA duplication. Being non-housekeeping does not make the parent process
            false. Refine to TLS, retaining the distinction from a bulk DnaE replicase. Native damage-tolerance
            genetics and the curated DnaE2 function support that specialization.'
          supported_by:
          - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
            record_section:
            - CC:FUNCTION
            supporting_text: CC       translesion synthesis (TLS). It is not the major replicative DNA
          - reference_id: PMID:20615954
            supporting_text: "All major DNA polymerase III\u03B1 structural/functional domains ( 23 ,\
              \ 24 ) are readily identified in DnaE2, except for the very C-terminal region which in E.\
              \ coli has been implicated in the interaction of \u03B1 with the clamp-loader subunit, \u03C4\
              \ ( 28 , 29 )."
          proposed_replacement_terms:
          - id: GO:0019985
            label: translesion synthesis
      - term:
          id: GO:0006281
          label: DNA repair
        evidence_type: IEA
        original_reference_id: GO_REF:0000104
        qualifier: involved_in
        review:
          summary: Replace the generic repair interpretation with specialized DNA lesion bypass.
          action: MODIFY
          reason: The specific mechanistic interpretation is lesion bypass, not lesion excision. Current
            GO does not place TLS under GO:0006281, so this replacement is a lateral process correction.
            Generic TLS fits both antimutator stationary-phase outcomes and the directly reported ImuC-dependent
            MMS mutation phenotype. The latter uses PaW85 derivatives stated isogenic to KT2440; exact
            purified lesion kinetics remain unmeasured.
          proposed_replacement_terms:
          - id: GO:0019985
            label: translesion synthesis
          supported_by:
          - reference_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
            record_section:
            - CC:FUNCTION
            supporting_text: 'CC   -!- FUNCTION: DNA polymerase involved in damage-induced mutagenesis
              and'
          - reference_id: PMID:17331811
            supporting_text: it acted as an anti-mutator in accumulation of base substitution
          - reference_id: PMID:28118378
            supporting_text: indicating that ImuC is responsible for the MMS mutability in P. putida
            reference_section_type: RESULTS
      - term:
          id: GO:0006974
          label: DNA damage response
        evidence_type: IEA
        original_reference_id: GO_REF:0000117
        qualifier: involved_in
        review:
          summary: Refine damage response to the supported lesion-bypass process.
          action: MODIFY
          reason: The curated polymerase role and native matched alkyl-damage experiments support TLS
            as the specific descendant of DNA damage response. The annotation is supported by active lesion-tolerance
            machinery rather than expression induction alone.
          supported_by:
          - reference_id: PMID:15458417
            supporting_text: these genes constitute a DNA damage-inducible operon
          - reference_id: PMID:28118378
            supporting_text: indicating that ImuC is responsible for the MMS mutability in P. putida
            reference_section_type: RESULTS
          proposed_replacement_terms:
          - id: GO:0019985
            label: translesion synthesis
      - term:
          id: GO:0008408
          label: 3'-5' exonuclease activity
        evidence_type: IEA
        original_reference_id: GO_REF:0000002
        qualifier: enables
        review:
          summary: Target proofreading activity is unresolved; the available residue comparison is mycobacterial.
          action: UNDECIDED
          reason: The PHP/DnaE-family mapping suggests a possible nuclease function, while PMID20615954
            reports loss of key PHP residues in Mtb DnaE2. That is not a target-specific Q88I82 residue
            analysis or a negative Pseudomonas exonuclease assay. A damage-tolerance or mutagenic role
            does not itself exclude proofreading. Without an independently established catalytic-site
            comparison or direct target activity, retain uncertainty rather than treating the domain match
            as proof or the Mtb comparison as a demonstrated loss in PSEPK.
          supported_by:
          - reference_id: PMID:20615954
            supporting_text: "The corresponding domain of Mtb DnaE1 retains all amino acids associated\
              \ with exonuclease activity ( 34 \u2013 36 ), whereas key residues are absent in DnaE2."
      - term:
          id: GO:0034061
          label: DNA polymerase activity
        evidence_type: IEA
        original_reference_id: GO_REF:0000116
        qualifier: enables
        review:
          summary: Refine polymerase activity to the supported DNA-directed reaction.
