      core_functions:
      - description: "DNA-directed DNA polymerase catalyzing mutagenic lesion-bypass synthesis as the\
          \ catalytic component of the ImuA\u2032\u2013ImuB\u2013DnaE2 system, supported by M. tuberculosis\
          \ genetics and homolog catalytic-site experiments."
        molecular_function:
