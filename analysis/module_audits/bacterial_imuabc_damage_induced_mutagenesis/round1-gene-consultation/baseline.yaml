      description: "DnaE2 (Rv3370c) is the damage-inducible, error-prone C-family DNA polymerase of Mycobacterium\
        \ tuberculosis. Together with ImuA\u2032 and the noncatalytic adaptor ImuB, it enables mutagenic\
        \ synthesis past DNA lesions. It is dispensable for normal growth and is distinct from the major\
        \ replicative polymerase DnaE1, while contributing to replication-associated damage tolerance.\
        \ M. tuberculosis genetics establish effects on UV survival, induced mutation, infection and emergence\
        \ of resistance; catalytic-site experiments in M. smegmatis support the conserved synthetic mechanism.\
        \ Its PHP domain lacks key residues of the active DnaE1 proofreader."
