- path: genes/CAUVC/dnaE2/dnaE2-ai-review.yaml
  row_index: 4
  source_payload:
    term:
      id: GO:0006260
      label: DNA replication
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
  before_review:
    summary: This term conflates DnaE2 with the essential replicative alpha subunit it is paralogous to.
    action: MARK_AS_OVER_ANNOTATED
    reason: The mapping comes from the shared DNA polymerase III alpha domains (IPR004805, IPR011708).
      DnaE2 is dispensable for growth, induced only on damage, and lacks the C-terminal region through
      which the replicative alpha subunit engages the clamp loader, so it cannot substitute for replicative
      synthesis; damage-induced lesion bypass is the real process.
    supported_by:
    - reference_id: PMID:20615954
      supporting_text: All major DNA polymerase IIIα structural/functional domains ( 23 , 24 ) are readily
        identified in DnaE2, except for the very C-terminal region which in E. coli has been implicated
        in the interaction of α with the clamp-loader subunit, τ ( 28 , 29 ).
    - reference_id: PMID:15886391
      supporting_text: DnaE2 orthologs clearly form a distinct branch, including the DnaE2 from C.crescentus.
  after_review:
    summary: DNA replication is broad but includes the supported translesion synthesis process in current
      GO.
    action: MODIFY
    reason: Current QuickGO places GO:0042276 error-prone translesion synthesis under DNA damage tolerance
      (GO:0006301), which is part_of DNA replication (GO:0006260); this is not a pure is_a path. The broad
      term is therefore compatible with the supported process and must not be rejected by equating it
      exclusively with routine chromosome duplication. Refine to the existing specific TLS proposal. The
      native disruption has no reported growth defect under the tested conditions, which distinguishes
      DnaE2 from essential replicative DnaE but does not negate the ontology ancestor.
    supported_by:
    - reference_id: PMID:15886391
      supporting_text: These results indicate that imuB and dnaE2 cooperate in a lesion bypass pathway,
        which has a different specificity than that involving umuDC in E.coli.
    - reference_id: PMID:15886391
      supporting_text: These gene disruptions had no effect upon cell growth
    proposed_replacement_terms:
    - id: GO:0042276
      label: error-prone translesion synthesis
