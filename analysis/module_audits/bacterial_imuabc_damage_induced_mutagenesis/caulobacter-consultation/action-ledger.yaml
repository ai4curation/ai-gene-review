- path: genes/CAUVC/imuA/imuA-ai-review.yaml
  row_index: 0
  source_payload:
    term:
      id: GO:0009432
      label: SOS response
    evidence_type: EXP
    original_reference_id: PMID:18083815
    qualifier: involved_in
  before_review:
    summary: The imuA promoter is one of the experimentally confirmed LexA-dependent promoters of the
      C. crescentus SOS regulon.
    action: KEEP_AS_NON_CORE
    reason: Correct, and the induction gate is real, but SOS regulon membership is the regulatory context
      rather than what the protein does; error-prone translesion synthesis is the effector process and
      is annotated separately in this review.
    supported_by:
    - reference_id: PMID:18083815
      supporting_text: 37 genes regulated in a LexA-dependent manner
    - reference_id: PMID:18083815
      supporting_text: which was confirmed by site-directed mutagenesis studies of the imuA promoter
  after_review:
    summary: ImuA is an effector of the SOS-induced mutagenic damage-tolerance pathway.
    action: ACCEPT
    reason: The promoter is experimentally LexA regulated, and independent Caulobacter deletion/complementation
      establishes ImuA participation in damage-induced mutagenesis. GO:0009432 describes an error-prone
      microbial DNA-damage response, so this is part of the core biological role rather than merely peripheral
      regulation. Promoter induction alone would not establish protein participation; PMID:15886391 supplies
      the functional genetic evidence. No LexA protease, transcription-regulatory or RecA-like ATPase
      activity is implied.
    supported_by:
    - reference_id: PMID:18083815
      supporting_text: 37 genes regulated in a LexA-dependent manner
      full_text_unavailable: true
    - reference_id: PMID:18083815
      supporting_text: which was confirmed by site-directed mutagenesis studies of the imuA promoter
      full_text_unavailable: true
    - reference_id: PMID:15886391
      supporting_text: The genes imuA and imuB encode previously uncharacterized proteins, which are shown
        here for the first time to be involved in DNA damage tolerance.
- path: genes/CAUVC/imuA/imuA-ai-review.yaml
  row_index: 1
  source_payload:
    term:
      id: GO:0042276
      label: error-prone translesion synthesis
    evidence_type: IMP
    original_reference_id: PMID:15886391
    qualifier: involved_in
  before_review:
    summary: An in-frame imuA deletion abolishes mitomycin C-induced mutagenesis and strongly reduces
      UV-induced mutagenesis while sensitizing cells to both agents, and the phenotype is complemented
      by the wild-type allele.
    action: NEW
    reason: The deletion genetics establish participation in damage tolerance whose output is induced
      mutation, which is what error-prone translesion synthesis describes; single imuA, imuB and dnaE2
      mutants share the phenotype and imuB dnaE2 double mutants are not additive, so the three products
      act in one lesion-bypass pathway. The experiments were done in NA1000, a derivative of the sequenced
      CB15 strain this entry represents, which is also how GOA assigns PMID:18083815 to this accession.
    supported_by:
    - reference_id: PMID:15886391
      supporting_text: The genes imuA and imuB encode previously uncharacterized proteins, which are shown
        here for the first time to be involved in DNA damage tolerance.
    - reference_id: PMID:15886391
      supporting_text: The single mutants imuA, imuB and dnaE2 mutants are extremely sensitive to this
        condition, revealing that this operon plays a major role in the tolerance to the mit C-induced
        DNA lesions.
    - reference_id: PMID:15886391
      supporting_text: Both the UV and the mit C sensitivity phenotypes of imuA could be complemented
        by vector pMR3213, containing the wild-type imuA allele.
  after_review:
    summary: An in-frame imuA deletion impairs induced mutagenesis and damage tolerance in the CB15-derived
      NA1000 strain; the sensitivity phenotype is complemented.
    action: NEW
    reason: The inherited proposal is retained as the genetically supported cassette process. An in-frame
      deletion, complementation and controls against downstream polar effects establish a functional requirement
      for the ImuA protein in the mutagenic tolerance pathway. Similar single-mutant phenotypes and imuB/dnaE2
      epistasis support a common pathway, but do not identify ImuA as the nucleotide-inserting enzyme
      or directly assay bypass of a defined lesion. ImuA is treated as an accessory participant; the exact
      molecular step remains unresolved. Experiments used NA1000, a CB15 derivative, rather than a separately
      assayed CB15 culture.
    supported_by:
    - reference_id: PMID:15886391
      supporting_text: The genes imuA and imuB encode previously uncharacterized proteins, which are shown
        here for the first time to be involved in DNA damage tolerance.
    - reference_id: PMID:15886391
      supporting_text: The single mutants imuA, imuB and dnaE2 mutants are extremely sensitive to this
        condition, revealing that this operon plays a major role in the tolerance to the mit C-induced
        DNA lesions.
    - reference_id: PMID:15886391
      supporting_text: Both the UV and the mit C sensitivity phenotypes of imuA could be complemented
        by vector pMR3213, containing the wild-type imuA allele.
    - reference_id: PMID:15886391
      supporting_text: These results confirm that the phenotypes of imuA and imuB strains are not due
        to negative effects on the expression of downstream genes in the operon.
- path: genes/CAUVC/imuB/imuB-ai-review.yaml
  row_index: 0
  source_payload:
    term:
      id: GO:0006281
      label: DNA repair
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: involved_in
  before_review:
    summary: 'Correct in direction but far broader than the evidence: ImuB does not repair lesions, it
      supports synthesis past them.'
    action: MODIFY
    reason: The row is a UniProt combined-pipeline IEA whose stated basis is the UmuC domain IPR001126
      plus the TreeGrafter node PANTHER:PTN000118183, neither of which resolves beyond generic DNA repair;
      it is not a PAINT IBA. The C. crescentus deletion experiments show lesion tolerance with induced
      mutagenesis, not lesion removal, so error-prone translesion synthesis is the term the evidence supports;
      it sits under DNA damage tolerance rather than under DNA repair.
    proposed_replacement_terms:
    - id: GO:0042276
      label: error-prone translesion synthesis
    supported_by:
    - reference_id: PMID:15886391
      supporting_text: These results indicate that imuB and dnaE2 cooperate in a lesion bypass pathway,
        which has a different specificity than that involving umuDC in E.coli.
  after_review:
    summary: The broad damage-processing annotation can be specified as mutagenic lesion bypass.
    action: MODIFY
    reason: 'The source IEA maps ImuB-related sequence features to DNA repair. The current GO:0006281
      definition includes bypass among damage-processing pathways, so the annotation is not rejected simply
      because lesions remain. Caulobacter genetics supports the more informative GO:0042276 error-prone
      translesion synthesis. This is a process-specific correction: current GO places TLS under DNA damage
      tolerance, and it is not an is_a descendant of DNA repair. The inference does not assign catalytic
      lesion removal or DNA polymerase activity to ImuB.'
    proposed_replacement_terms:
    - id: GO:0042276
      label: error-prone translesion synthesis
    supported_by:
    - reference_id: PMID:15886391
      supporting_text: These results indicate that imuB and dnaE2 cooperate in a lesion bypass pathway,
        which has a different specificity than that involving umuDC in E.coli.
- path: genes/CAUVC/imuB/imuB-ai-review.yaml
  row_index: 1
  source_payload:
    term:
      id: GO:0042276
      label: error-prone translesion synthesis
    evidence_type: IMP
    original_reference_id: PMID:15886391
    qualifier: involved_in
  before_review:
    summary: An imuB deletion is extremely sensitive to mitomycin C, loses most UV-induced mutagenesis,
      and shifts the surviving UV mutational spectrum exactly as a dnaE2 deletion does.
    action: NEW
    reason: Deletion, epistasis with dnaE2 and the shared change in mutational signature establish participation
      in damage-tolerant synthesis whose output is induced mutation. The mutational-spectrum result is
      direct evidence that the pathway inserts nucleotides opposite lesions rather than removing them.
    supported_by:
    - reference_id: PMID:15886391
      supporting_text: The imuB dnaE2 double mutant does not exhibit an exacerbated phenotype, indicating
        again that these genes cooperate in the same pathway of damage tolerance.
    - reference_id: PMID:15886391
      supporting_text: The mutation signature of UV light is remarkably similar in dnaE2 and imuB strains.
    - reference_id: PMID:15886391
      supporting_text: This novel mutational signature, dependent on the activity of the imuAB/dnaE2 operon,
        probably reflects a difference in polymerase preference for nucleotide incorporation during TLS.
  after_review:
    summary: An imuB deletion is extremely sensitive to mitomycin C, loses most UV-induced mutagenesis,
      and shifts the surviving UV mutational spectrum exactly as a dnaE2 deletion does.
    action: NEW
    reason: Retain the historical proposal on the combination of native deletion, complementation, epistasis
      with dnaE2 and altered rpoB mutational spectra. These establish participation in mutagenic damage
      tolerance and support the lesion-bypass interpretation. The spectra do not directly measure nucleotide
      insertion opposite a defined lesion, identify which subunit inserts it, or prove physical assembly
      of the proteins. The direct genetic experiments used NA1000, a CB15 derivative.
    supported_by:
    - reference_id: PMID:15886391
      supporting_text: The imuB dnaE2 double mutant does not exhibit an exacerbated phenotype, indicating
        again that these genes cooperate in the same pathway of damage tolerance.
    - reference_id: PMID:15886391
      supporting_text: The mutation signature of UV light is remarkably similar in dnaE2 and imuB strains.
    - reference_id: PMID:15886391
      supporting_text: This novel mutational signature, dependent on the activity of the imuAB/dnaE2 operon,
        probably reflects a difference in polymerase preference for nucleotide incorporation during TLS.
- path: genes/CAUVC/imuB/imuB-ai-review.yaml
  row_index: 2
  source_payload:
    term:
      id: GO:0030674
      label: protein-macromolecule adaptor activity
    evidence_type: ISS
    original_reference_id: PMID:20615954
    qualifier: enables
  before_review:
    summary: 'ImuB is a noncatalytic interaction hub: the characterized mycobacterial ortholog binds ImuA,
      DnaE2 and the beta clamp, and losing the clamp interaction alone destroys cassette function.'
    action: NEW
    reason: The adaptor activity is transferred from the mycobacterial ortholog, where it rests on two-hybrid
      interactions plus a separation-of-function clamp-binding allele, and the same paper states that
      ImuB homologs generally lack the catalytic residues, so the fold cannot be read as polymerase activity.
      C. crescentus ImuB keeps the UmuC fold and the genetic requirement, so the role transfers, but the
      interactions have not been tested in this organism.
    supported_by:
    - reference_id: PMID:20615954
      supporting_text: Yeast two-hybrid analyses indicate that ImuB interacts with both ImuA' and DnaE2,
        as well as with the beta-clamp.
    - reference_id: PMID:20615954
      supporting_text: Despite retaining structural features characteristic of Y-family members, ImuB
        homologs lack conserved active-site amino acids required for polymerase activity.
    - reference_id: file:CAUVC/imuB/imuB-uniprot.txt
      record_section:
      - DR:Pfam
      supporting_text: DR   Pfam; PF00817; IMS; 1.
  after_review:
    summary: A macromolecular adaptor role is inferred for Caulobacter ImuB from its specific family placement,
      native genetics and characterized ImuB homologs.
    action: NEW
    reason: The historical ISS proposal is retained as a mechanistic inference, not a target binding assay.
      PMID:15886391 places CC3212 in the ImuB branch distinct from ordinary DinB proteins and shows its
      interdependent genetic role with DnaE2. Mycobacterial ImuB binds cassette partners and the clamp,
      while PMID:38591662 independently demonstrates direct Myxococcus ImuA-ImuB binding. These observations
      support an accessory interaction role beyond generic UmuC-fold similarity. Exact partner affinities,
      clamp recognition, oligomeric state and catalytic-residue configuration have not been mapped in
      Caulobacter, and are not asserted from the Pfam label or family membership alone.
    supported_by:
    - reference_id: PMID:20615954
      supporting_text: Yeast two-hybrid analyses indicate that ImuB interacts with both ImuA' and DnaE2,
        as well as with the beta-clamp.
    - reference_id: PMID:20615954
      supporting_text: Despite retaining structural features characteristic of Y-family members, ImuB
        homologs lack conserved active-site amino acids required for polymerase activity.
    - reference_id: file:CAUVC/imuB/imuB-uniprot.txt
      record_section:
      - DR:Pfam
      supporting_text: DR   Pfam; PF00817; IMS; 1.
    - reference_id: PMID:15886391
      supporting_text: The product of CC3212 and its orthologs form a branch that is distinct from the
        DinB proteins of the same organisms, indicating that this is a divergent DinB/UmuC homolog
    - reference_id: PMID:38591662
      supporting_text: In the absence of DNA, ImuA directly binds ImuB with moderate affinity.
    - reference_id: PMID:38591662
      supporting_text: Here we carry out biochemical characterization of ImuA and a truncation of ImuB
        from Myxococcus xanthus.
