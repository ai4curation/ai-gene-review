      polymerase assignment is additionally grounded in the specific DnaE2 family and catalytic-mutant
      evidence from mycobacteria; the target lesion repertoire and insertion-versus-extension contributions
      remain unmeasured.
    supported_by:
    - reference_id: PMID:15886391
