- path: genes/CAUVC/dnaE2/dnaE2-ai-review.yaml
  row_index: 7
  source_payload:
    term:
      id: GO:0008408
      label: 3'-5' exonuclease activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
  before_review:
    summary: Proofreading chemistry is mapped from domains shared with the replicative polymerase, but
      DnaE2 proteins have lost the residues that carry it.
    action: MARK_AS_OVER_ANNOTATED
    reason: The term comes from the generic DnaE/PHP domain mappings IPR004805 and IPR011708. Published
      comparison of the PHP domains shows that the replicative DnaE1 retains the exonuclease residues
      whereas they are absent in DnaE2, and a proofreading activity would also sit awkwardly with the
