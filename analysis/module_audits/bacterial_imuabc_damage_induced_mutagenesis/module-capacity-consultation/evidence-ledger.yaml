limits:
- The beta clamp, lesion-containing template, dNTPs and expression/activation context are assumed
  external resources; they are not separately required member nodes.
- No arbitrary cross-species functional compatibility is inferred. Negative mixed-panel controls
  mean insufficient evidence in this audited panel, not demonstrated impossibility.
- Family/domain membership is supporting identity evidence only; it never supplies a missing core
  activity or cassette-level compatibility certificate.
- ImuA-prime lacks a unified asserted family ID in the module. Exact reviewed representative identity
  and the native/ortholog evidence bridge supply the bounded role gate.
- Alternative ImuA/ImuA-prime realizers satisfy one required accessory role; both are not required.
- Production static logic ignores connections, timing, contextual taxa and kinetic/resource constraints;
  external evidence oracle supplies panel compatibility. EXACTLY_ONE is at-least-one for static satisfiability,
  not a claim the other protein must be absent.
- Verified Q1D5A2 supplies only a Myxococcus accessory-role witness. No matched ImuB/DnaE2 panel
  is asserted. Native imuA deletion reduces but does not abolish all induced mutagenesis; required-accessory
  tests apply to the specified ImuA-containing realization, not all residual TLS.
- The Myxococcus ATPase gate identifies an activity-bearing realizer; measured hydrolysis does not
  establish causal necessity of ATP turnover for native TLS. Failure of that qualified branch is
  not a negative mutant-function prediction.
