gene_findings:
  recA: Refined broad DNA-binding/process/location claims and synthesized the specific strand-exchange
    core. Retained conserved ATP-dependent signaling without treating the provider claim of complete
    LexA1 cleavage as independently verified. PMID33393180 uses EM173 (a prophage-free KT2440 derivative),
    remains abstract-only, and establishes modest norfloxacin induction. PMID21261833 supplies direct
    KT2440 recA-dependent formaldehyde survival evidence; PMID37212693 supplies comparative mechanism.
    The new core term yields an advisory, not a need to manufacture a new row.
  lexA2: Direct KT2440 promoter-binding and regulon experiments support repression by a narrow SOS
    branch; they do not justify excluding SOS merely because LexA1 controls more genes. SOS and functional
    operator-bound complex are core. Curated LexA-family autoproteolysis remains explicitly inferred;
    no purified target cleavage experiment was identified. The scoped primary-reading file records
    full-source access separately from unchanged abstract-only caches.
  PP_3117: 'Corrected the earlier missing-target-mutant premise: PMID28118378 individually deletes
    PP3117 in PaW85, stated isogenic to KT2440, and finds an AlkA-background alkylation-damage phenotype.
    The historical ISS TLS proposal is preserved, now strengthened with matched genetics. Precise
    target molecular activity remains unresolved. PMID38591662 measures DNA-enhanced ATPase in Myxococcus
    ImuA, not Q88I84. Legacy canonical SulA division-inhibitor mapping remains rejected on specific
    identity/architecture grounds, without universal claims about all ImuA proteins.'
  imuB: Native PaW85 deletion and complementation in the AlkA-deficient background resolve the previous
    missing-genetics premise. The noncatalytic adaptor mechanism is still inferred from specific
    architecture and mycobacterial interaction studies; it is not a purified PSEPK binding experiment.
    Both historical NEW rows remain unchanged. Generic DNA repair is replaced laterally by TLS, not
    described as a GO descendant refinement.
  dnaE2: MMS-induced mutagenesis in PaW85 and stationary-phase antimutator effects are separate contexts.
    Replaced blanket nonmutagenic/nonreplicative claims with conditional physiology; current GO places
    TLS under DNA replication and DNA biosynthesis. Broad true claims refine to supported chemistry/processes.
    PHP exonuclease is UNDECIDED because the cited loss-of-residues comparison is mycobacterial,
    not a Q88I82 assay or target alignment. Historical TLS NEW is unchanged.
source_boundary: PaW85 is stated isogenic to KT2440 in PMID28118378; PAO1, Myxococcus and mycobacterial
  biochemical experiments remain distinct.
ontology: TLS is a descendant of DNA replication, DNA biosynthesis and DNA-damage response; it is
  not a descendant of GO0006281 DNA repair.
research: Existing genuine reports preserved; missing PP3117 Falcon403 recorded; no publication cache
  fetched or overwritten by this agent.
paint: No target leaf available in cached trees; no claim of demonstrated loss or demonstrated absence
  of loss.
validation_advisory: RecA core GO0000150 is supported independently but absent as a row; advisory
