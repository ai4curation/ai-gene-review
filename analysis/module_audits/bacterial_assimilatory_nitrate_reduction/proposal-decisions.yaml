non_proposals_and_retained_decisions:
- target: SYNE7/nrtA
  term: GO:0015706
  reason: Already entailed through is_a/part_of ancestry by the proposed GO:0015414
    contribution.
- target: BACSU/nasD and nasE
  term: GO:0106314
  reason: A minor NADPH-supported crude-lysate signal does not specifically establish
    NasDE NADPH catalysis; retained as a question, not a replacement term.
- target: MYCS2/nasN
  term: GO:0009703
  decision: Retain as a secondary measured molecular capacity from purified recombinant
    NasN; not a second demonstrated native pathway.
- target: ECOLI/nirD
  term: GO:0019210
  reason: RelA GO:0008728 is a diphosphotransferase, not a descendant of kinase activity
    GO:0016301; retain GO:0004857.
