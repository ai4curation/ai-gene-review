limits: MSMEG_0428 and several transporter-subunit proposals are explicit conserved-component
  plus native-context inferences, not new target-specific purified or single-subunit
  assays. Ligand totals do not establish binding geometry or occupancy. Modern CDS
  continuity is not a full-fusion expression or kinetics assay.
