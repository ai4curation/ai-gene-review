- path: genes/ECOLI/iscS/iscS-ai-review.yaml
  index: 33
  term: GO:0051537
  original_action: KEEP_AS_NON_CORE
  current_action: UNDECIDED
  review_changed: true
  original_reference: GO_REF:0000104
  adjudication: The frozen UniProt binding feature supports an inferred Cys328 ligand shared with IscU.
    However, the structurally characterized cluster intermediate discussed in PMID36605734 is an Archaeoglobus
    fulgidus IscS–IscU(D35A) complex with an altered scaffold. E. coli IscSU cluster assembly does not
    by itself resolve direct ligation by IscS. Transient binding can be a genuine molecular function;
    uncertainty concerns transfer of this specific ligand geometry to the native E. coli protein, not
    a requirement for a stable cofactor.
- path: genes/ECOLI/iscS/iscS-ai-review.yaml
  index: 34
  term: GO:0072348
  original_action: MARK_AS_OVER_ANNOTATED
  current_action: ACCEPT
  review_changed: true
  original_reference: PMID:10739946
  adjudication: GO:0072348 includes directed movement within a cell and is not restricted to a membrane
    pore. IscS converts cysteine sulfur to an enzyme-bound persulfide and transfers that sulfur to ThiI,
    TusA and IscU. The original IDA assignment is consistent with this independently demonstrated carrier
    mechanism. The cached PMID10739946 abstract establishes enzyme chemistry but does not expose every
    transport assay; the positive transfer evidence is supplied by the accessible sulfur-relay studies,
    without inventing a transmembrane role.
