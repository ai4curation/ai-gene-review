  current_action: ACCEPT
  review_changed: false
  original_reference: PMID:10781607
  adjudication: Genetic loss-of-function and complementation, together with reconstitution showing sulfur
    moves IscS -> ThiI -> tRNA, establish IscS as the sulfur-mobilizing enzyme of s4U biosynthesis. IscS
    does part of the work of the process (sulfur mobilization and transpersulfidation to ThiI Cys456).
