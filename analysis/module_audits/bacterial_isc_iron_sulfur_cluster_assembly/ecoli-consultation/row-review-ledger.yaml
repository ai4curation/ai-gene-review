  term: GO:0016226
  original_action: ACCEPT
  current_action: ACCEPT
  review_changed: false
  original_reference: PMID:10393315
  adjudication: IscS is the sulfur donor of the housekeeping Isc pathway and supplies sulfur for both
    [2Fe-2S] (IscU) and [4Fe-4S] (e.g. dihydroxy-acid dehydratase) clusters, so the general term is appropriate
    alongside the [2Fe-2S] child term. The operon-level evidence is consistent with direct biochemical
    data.
