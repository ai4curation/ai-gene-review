  original_reference: PMID:10753862
  adjudication: 'IscS performs sulfur mobilization rather than merely being required downstream: PMID10781607
    combines thiazole-rescuable auxotrophy with sulfur transfer to the ThiS C-terminal carboxylate. This
    is an established physiological branch of the same carrier chemistry, alongside Fe-S assembly and
    tRNA thiolation, and belongs in the whole-gene core.'
- path: genes/ECOLI/iscS/iscS-ai-review.yaml
