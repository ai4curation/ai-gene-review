  original_reference: PMID:16387657
  adjudication: IscS performs the first chemical step of the process (sulfur mobilization from cysteine
    and persulfide transfer to TusA), so it participates in, rather than merely being required for, wobble
    uridine thiolation. This is one of the major sulfur-donor branches of IscS.
