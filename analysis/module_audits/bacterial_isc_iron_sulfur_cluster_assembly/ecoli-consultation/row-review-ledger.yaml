  original_reference: PMID:10753862
  adjudication: This non-traceable statement extrapolates from IscS's role in making s4U to the downstream
    photobiology of s4U-containing tRNA. IscS neither absorbs UV nor transduces a UV signal; at most it
    acts far upstream. The cited abstract contains no UV-detection data.
- path: genes/ECOLI/iscS/iscS-ai-review.yaml
