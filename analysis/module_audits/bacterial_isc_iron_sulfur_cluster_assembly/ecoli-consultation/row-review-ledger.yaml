- path: genes/ECOLI/iscU/iscU-ai-review.yaml
  index: 15
  term: GO:0006879
  original_action: MARK_AS_OVER_ANNOTATED
  current_action: KEEP_AS_NON_CORE
  review_changed: true
  original_reference: GO_REF:0000033
  adjudication: 'The earlier assertion that no bacterial evidence exists is superseded by PMID38452854:
    MC4100 iscU deletion impairs Fur cluster loading and regulation, while purified-component experiments
    support IscU-promoted Fur cluster assembly and restored Fur-box binding. IscU supplies scaffold/cofactor-maturation
    work, rather than itself binding the Fur-box or acting as the iron-responsive transcription factor.
    This defined peripheral client pathway supports retaining the existing PAINT claim; it is not inferred
    from a generic growth defect alone.'
- path: genes/ECOLI/iscU/iscU-ai-review.yaml
  index: 16
  term: GO:0008198
  original_action: MARK_AS_OVER_ANNOTATED
  current_action: ACCEPT
  review_changed: true
  original_reference: GO_REF:0000033
  adjudication: 'The PAINT assertion at PTN000009661 is not judged by the taxonomic composition of its
    descendant evidence. There is now direct bacterial support: PMID32131593 detects Fe(II) at the IscU
    cysteine site and PMID36605734 detects retained Fe(II) supporting assembly. Earlier negative results
    concern different loading conditions and do not establish a lineage-specific loss. The lineage loss
