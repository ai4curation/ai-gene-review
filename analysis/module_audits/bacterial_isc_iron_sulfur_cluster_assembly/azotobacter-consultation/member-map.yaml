strain_boundary: The original ENA source names DJ116; curated UniProt iscS/iscU/hscA/hscB
  reference strain aliases name UW/ATCC13705, whereas unreviewed iscA/fdx retain DJ116.
  All six protein sequences exactly match the deposited original CDSs. Species-level
  AZOVI is retained; this does not claim identity of every gene or phenotype across
  arbitrary A. vinelandii strains. The 2006 native experiments use DJ and derivatives
  and reuse the original cloned isc-region DNA.
