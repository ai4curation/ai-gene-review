interface_evidence:
  PMID:11577100:
    assay_organism: ECOLI
    source_path: publications/PMID_11577100.md
    supporting_quotes:
    - sulfur transfer between IscS and IscU from Escherichia coli
    scope: Direct cognate sulfur handoff; transferred to KT2440 only by qualified inference.
  PMID:23682711:
    assay_organism: ECOLI
    source_path: publications/PMID_23682711.md
    supporting_quotes:
    - Escherichia coli [2Fe-2S]-ferredoxin (Fdx)
    - reduced Fdx supplies one electron to the IscS complex
    scope: E. coli Fdx interaction and redox chemistry, not a KT2440 or Azotobacter assay.
  PMID:25688831:
    assay_organism: ECOLI
    source_path: publications/PMID_25688831.md
    supporting_quotes:
    - E. coli IscS, IscU, Fdx, CyaY and FNR were then expressed and purified
    - trio of electron transfer partners are sufficient to sustain the reaction
    scope: E. coli donor-supported cluster assembly; in vitro sufficiency does not establish native flux.
  PMID:10869428:
    assay_organism: ECOLI
    source_path: publications/PMID_10869428.md
    supporting_quotes:
    - protein from Escherichia coli and have studied its interactions with the hscA and hscB gene products
      Hsc66 and Hsc20.
    scope: Cognate IscU/chaperone interactions and ATPase stimulation.
  PMID:15485839:
    assay_organism: ECOLI
    source_path: publications/PMID_15485839.md
    supporting_quotes:
    - The ATPase activity of HscA, a specialized hsp70 molecular chaperone from Escherichia coli
    scope: Cognate HscB/IscU regulation of HscA ATPase; does not alone establish the folding endpoint.
  PMID:18986169:
    assay_organism: ECOLI
    source_path: publications/PMID_18986169.md
    supporting_quotes:
    - HscA-mediated acceleration of [2Fe2S] cluster transfer exhibited an absolute requirement for both
      HscB and ATP.
    organism_verification:
      source_url: https://air.unimi.it/retrieve/dfa8b98f-b99c-748b-e053-3a05fe0a3a96/chaperoni%202008.pdf
      source_location: Experimental Procedures, Proteins; PDF page 3 (printed page 12796)
      supporting_text: Recombinant forms of E. coli IscU (12), ferredoxin (18), HscA (20), and HscB (20)
        were prepared
      access_scope: Full primary paper read from the author institutional repository; publication cache
        remains abstract-only.
      validation_limit: External organism quotation verified by reading the primary PDF; local checker
        validates the cache activity quotation, not a local full-paper copy.
    scope: Target-organism chaperone-assisted transfer; this does not demonstrate generic protein folding.
  PMID:16165131:
    assay_organism: AZOVI
    source_path: publications/PMID_16165131.md
    supporting_quotes:
    - Azotobacter vinelandii IscU
    - IscS can transfer sulfur
    scope: Target-organism sulfur transfer to scaffold variants.
  PMID:10542283:
    assay_organism: AZOVI
    source_path: publications/PMID_10542283.md
    supporting_quotes:
    - fdxD, that is in the A. vinelandii iscSUA operon
    - a reduction potential of -344 mV
    scope: Native FdIV identity and redox capability, not direct donor-interface reconstitution.
  PMID:16936042:
    assay_organism: AZOVI
    source_path: publications/PMID_16936042.md
    supporting_quotes:
    - IscS, IscU, HscBA, and Fdx are essential in A. vinelandii
    scope: Conditional native requirement; not evidence of the precise Fdx donor/acceptor chemistry.
  PMID:16964969:
    assay_organism: AZOVI
    source_path: publications/PMID_16964969.md
    supporting_quotes:
    - The role of the Azotobacter vinelandii HscA/HscB cochaperone system
    - time course of cluster transfer from [2Fe-2S]IscU to apo-Isc ferredoxin.
    scope: Fdx is the cluster recipient. This supports the assisted-transfer edge, never the electron-donor
      edge.
