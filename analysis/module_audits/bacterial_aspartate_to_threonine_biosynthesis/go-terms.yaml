source: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms
retrieved: '2026-11-01'
terms:
- id: GO:0004072
  label: aspartate kinase activity
  obsolete: false
  aspect: molecular_function
  definition: 'Catalysis of the reaction: L-aspartate + ATP = 4-phospho-L-aspartate
    + ADP + H+.'
- id: GO:0004073
  label: aspartate-semialdehyde dehydrogenase (NADP+) activity
  obsolete: false
  aspect: molecular_function
  definition: 'Catalysis of the reaction: L-aspartate 4-semialdehyde + NADP+ + phosphate
    = 4-phospho-L-aspartate + H+ + NADPH.'
- id: GO:0043899
  label: phosphoserine:homoserine phosphotransferase activity
  obsolete: false
  aspect: molecular_function
  definition: Catalysis of the transfer of a phosphoryl group from phosphoserine to
    homoserine to form phosphohomoserine.
- id: GO:0004413
  label: homoserine kinase activity
  obsolete: false
  aspect: molecular_function
  definition: 'Catalysis of the reaction: L-homoserine + ATP = O-phospho-L-homoserine
    + ADP + 2 H+.'
- id: GO:0004412
  label: homoserine dehydrogenase activity
  obsolete: false
  aspect: molecular_function
  definition: 'Catalysis of the reaction: L-homoserine + NADP+ = L-aspartate-4-semialdehyde
    + NADPH + H+.'
- id: GO:0004795
  label: threonine synthase activity
  obsolete: false
  aspect: molecular_function
  definition: 'Catalysis of the reaction: O-phospho-L-homoserine + H2O = L-threonine
    + phosphate.'
- id: GO:0009088
  label: L-threonine biosynthetic process
  obsolete: false
  aspect: biological_process
  definition: The chemical reactions and pathways resulting in the formation of L-threonine
    (2-amino-3-hydroxybutyric acid), a polar, uncharged, essential amino acid found
    in peptide linkage in proteins.
- id: GO:0042803
  label: protein homodimerization activity
  obsolete: false
  aspect: molecular_function
  definition: Binding to an identical protein to form a homodimer.
- id: GO:1901705
  label: L-isoleucine biosynthetic process
  obsolete: false
  aspect: biological_process
  definition: The chemical reactions and pathways resulting in the formation of L-isoleucine.
- id: GO:0071266
  label: '''de novo'' L-methionine biosynthetic process'
  obsolete: false
  aspect: biological_process
  definition: The chemical reactions and pathways resulting in the formation of L-methionine,
    the L-enantiomer of (2S)-2-amino-4-(methylsulfanyl)butanoic acid, from simpler
    components such as L-aspartate or L-homoserine. This process occurs in plants,
    bacteria, archae and fungi.
- id: GO:0071265
  label: L-methionine biosynthetic process
  obsolete: false
  aspect: biological_process
  definition: The chemical reactions and pathways resulting in the formation of L-methionine,
    the L-enantiomer of (2S)-2-amino-4-(methylsulfanyl)butanoic acid.
