terms:
- id: GO:0016616
  label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP
    as acceptor
  definition: Catalysis of an oxidation-reduction (redox) reaction in which a CH-OH
    group acts as a hydrogen or electron donor and reduces NAD+ or NADP.
- id: GO:0015038
  label: glutathione disulfide oxidoreductase activity
  definition: 'Catalysis of the reaction: 2 glutathione + electron acceptor = glutathione
    disulfide + electron donor.'
- id: GO:0016491
  label: oxidoreductase activity
  definition: Catalysis of an oxidation-reduction (redox) reaction, a reversible chemical
    reaction in which the oxidation state of an atom or atoms within a molecule is
    altered. One substrate acts as a hydrogen or electron donor and becomes oxidized,
    while the other acts as hydrogen or electron acceptor and becomes reduced.
- id: GO:0004364
  label: glutathione transferase activity
  definition: 'Catalysis of the reaction: RX + glutathione = an S-substituted glutathione
    + a halide anion + H+.'
- id: GO:0016846
  label: carbon-sulfur lyase activity
  definition: Catalysis of the elimination of hydrogen sulfide or substituted H2S.
- id: GO:0046274
  label: lignin catabolic process
  definition: The chemical reactions and pathways resulting in the breakdown of lignins,
    a class of polymers of phenylpropanoid units.
