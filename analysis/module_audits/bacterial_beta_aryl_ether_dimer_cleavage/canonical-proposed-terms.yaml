- proposed_name: glutathione-dependent beta-aryl etherase activity
  proposed_definition: Catalysis of glutathione-dependent displacement of the aryloxy group from Cbeta
    of a Calpha-keto beta-aryl ether, forming a carbon-sulfur bond between Cbeta and glutathione and releasing
    the corresponding phenol.
  proposed_parent:
    id: GO:0016765
    label: transferase activity, transferring alkyl or aryl (other than methyl) groups
  justification: The reaction transfers the carbon group formerly attached to the aryloxy oxygen onto
    glutathione sulfur. GO:0016765 supplies the appropriate broad transferase parent but does not specify
    this substrate or reaction. GO:0004364 defines halide displacement, whereas beta-aryl ether cleavage
    releases a phenol; the reaction is also distinct from ether hydrolysis. Substrate stereoselectivity
    and demonstrated product configuration belong in the individual enzyme or complex description.
- proposed_name: arylglycerol-beta-aryl ether Calpha-dehydrogenase (NAD+) activity
  proposed_definition: Catalysis of NAD+-dependent oxidation of the benzylic Calpha alcohol of an arylglycerol-beta-aryl
    ether to the corresponding Calpha ketone, producing NADH and a proton while retaining the Cbeta configuration.
  proposed_parent:
    id: GO:0016616
    label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
  justification: GO:0016616 correctly describes oxidation of a CH-OH donor with a pyridine nucleotide
    acceptor, but does not specify the arylglycerol-beta-aryl ether substrate or NAD+ requirement. GO:0018502
    instead specifies oxidation of 2,5-dichloro-2,5-cyclohexadiene-1,4-diol, a different substrate. A
    substrate-defined child term captures the demonstrated reaction; individual alphaR or alphaS preferences
    remain in the enzyme descriptions.
- proposed_name: GS-HPV glutathione-dependent deglutathionylase activity
  proposed_definition: Catalysis of reductive cleavage of the carbon-sulfur bond in beta-glutathionyl-gamma-hydroxypropiovanillone
    (GS-HPV), using an additional molecule of reduced glutathione to produce gamma-hydroxypropiovanillone
    (HPV) and glutathione disulfide.
  proposed_parent:
    id: GO:0016491
    label: oxidoreductase activity
  justification: The net reaction reduces the substrate carbon by replacing its carbon-sulfur bond with
    a carbon-hydrogen bond, coupled to oxidation of the substrate-bound and free glutathione sulfur atoms
    into glutathione disulfide. GO:0016491 therefore supplies an appropriate broad redox parent. GO:0016846
    describes elimination of hydrogen sulfide or substituted hydrogen sulfide; GO:0004364 describes halide
    substitution. GO:0015038 specifies a reaction with two free glutathione molecules and does not capture
    the GS-HPV thioether substrate. A GS-HPV-specific term preserves the demonstrated substrate and products
    without substituting disulfide-reductase or elimination chemistry.
