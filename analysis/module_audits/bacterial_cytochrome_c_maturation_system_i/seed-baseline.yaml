        reason: CcmD has no detectable heme binding and is not needed for heme transfer from CcmC to CcmE;
          its essential role is release of holo-CcmE from the CcmABCD complex. The heme-export model behind
          the family name is not supported, so heme transport overstates CcmD's role. Not REMOVE, because
          CcmD is part of the machinery that moves heme (as holo-CcmE) onward in the pathway.
        supported_by:
