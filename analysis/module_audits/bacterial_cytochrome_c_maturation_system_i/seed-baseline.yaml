      review:
        summary: InterPro CcmE family mapping to heme binding; consistent with the experimental evidence.
        action: ACCEPT
        reason: Same claim as the IBA and IDA rows; the CcmE family signature is a sound basis and the
          activity is directly demonstrated for E. coli CcmE.
