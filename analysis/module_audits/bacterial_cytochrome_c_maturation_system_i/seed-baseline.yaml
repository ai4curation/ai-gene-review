    - term: &id027
        id: GO:1903607
        label: cytochrome c biosynthetic process
      evidence_type: IDA
      original_reference_id: PMID:16824107
      qualifier: involved_in
      review:
        summary: CcmA-dependent ATP hydrolysis releases holo-CcmE from CcmC so that heme can proceed to
          the last step of cytochrome c assembly.
        action: ACCEPT
        reason: The abstract states the CcmAB(C) ABC complex is required for release of holo-CcmE to the
          final step of cytochrome c assembly. Only the abstract is cached, but it fully supports the
          curator's annotation. CcmA does part of the work of the process (ATP-coupled release of the
