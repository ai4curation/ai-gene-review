          process. The descendant GO:0018063 cytochrome c-heme linkage is not chosen because CcmD does
          not take part in attaching heme to apocytochrome c.
        proposed_replacement_terms:
        - id: GO:1903607
          label: cytochrome c biosynthetic process
        supported_by:
        - reference_id: PMID:18326572
          supporting_text: CcmD is absolutely required for the release of holo-CcmE from the CcmABCD complex.
