          supporting_text: Interactions of CcmD with either ferrochelatase, the last heme biosynthetic
            enzyme, or directly with heme were not detectable.
        - reference_id: PMID:18326572
          supporting_text: CcmD is not necessary for the CcmC-dependent transfer of heme to CcmE in the
            periplasm or for interaction of CcmE with CcmABC.
