    - id: PMID:7635817
      title: Escherichia coli genes required for cytochrome c maturation.
      findings:
      - statement: A deletion of the E. coli ccmABCDEFGH cluster abolishes maturation of indigenous and
          heterologous c-type cytochromes.
        supporting_text: The results suggest that the E. coli ccm gene cluster present in the aeg-46.5
          region is required for a general pathway involved in cytochrome c maturation.
    - id: PMID:10339610
      title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires the CcmC
        protein, which may function independently of the ABC-transporter CcmAB.
      findings:
      - statement: CcmC, not CcmAB, is strictly required for heme loading onto CcmE; ccmA and ccmB deletions
          block holocytochrome c formation; evidence argues against CcmAB as heme exporter.
        supporting_text: We report that CcmC is functionally uncoupled from the ABC transporter subunits
          CcmA and CcmB, because it is the only Ccm protein that is strictly required for heme transfer
          and attachment to CcmE.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Full text cached; E. coli K-12 in-frame ccmA/ccmB deletions assayed directly. Source
          of the IMP annotation.
    - id: PMID:10708391
      title: 'Oxidase and periplasmic cytochrome assembly in Escherichia coli K-12: CydDC and CcmAB are
        not required for haem-membrane association.'
      findings:
      - statement: Haem uptake into everted membrane vesicles is ATP-independent and unaffected by ccmA
          deletion.
        supporting_text: suggesting that the activity of neither the CydDC nor CcmAB transporters is essential
          for haem export to the periplasm
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Abstract-only cache; abstract explicitly reports the delta(ccmA) vesicle result
          used here.
    - id: PMID:16824107
      title: ABC transporter-mediated release of a haem chaperone allows cytochrome c biogenesis.
      findings:
      - statement: CcmA and CcmB form a CcmA2B1C1 complex with CcmC that mediates ATP-dependent release
          of holo-CcmE; without CcmA or CcmB holo-CcmE is trapped on CcmC.
        supporting_text: Expression of CcmA and CcmB facilitates formation of the CcmA2B1C1 complex and
          ATP-dependent release of holoCcmE.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Abstract-only cache; abstract directly states the release function.
    - id: PMID:17419738
      title: Loss of ATP hydrolysis activity by CcmAB results in loss of c-type cytochrome synthesis and
        incomplete processing of CcmE.
      findings:
      - statement: Purified CcmAB hydrolyses ATP; the CcmA K40D Walker A mutant loses ATPase activity
          and cytochrome c biogenesis while still forming holo-CcmE.
        supporting_text: We have purified a complex of these proteins, and found it to have ATP hydrolysis
          activity.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Abstract-only cache; source of the ATP hydrolysis IDA.
    - id: PMID:18326572
      title: Topology and function of CcmD in cytochrome c maturation.
      findings:
      - statement: CcmD is part of the CcmABCD complex and is required for release of holo-CcmE from it.
        supporting_text: CcmD is absolutely required for the release of holo-CcmE from the CcmABCD complex.
    - id: PMID:19721088
      title: 'Cytochrome c biogenesis: mechanisms for covalent modifications and trafficking of heme and
        for heme-iron redox control.'
      findings:
      - statement: 'Review: system I step 1 is CcmABCD-mediated synthesis and release of oxidized holo-CcmE.'
        supporting_text: Step 1 is the CcmABCD-mediated synthesis and release of oxidized holoCcmE (heme
          in the Fe(+3) state).
    - id: PMID:24044352
      title: Probing heme delivery processes in cytochrome c biogenesis System I.
      findings:
      - statement: ATP-driven conformational change in CcmA, presumably transmitted through CcmB, removes
          heme (as holo-CcmE) from CcmC; the heme-transporter model is described as disproven.
        supporting_text: An ATP-driven conformational change in CcmA, presumably via CcmB, is responsible
          for removing the heme from CcmC
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Full text cached. Cited by ComplexPortal for the NAS heme import row, although the
          paper itself rejects the heme-transporter model.
