          supporting_text: An ATP-driven conformational change in CcmA, presumably via CcmB, is responsible
            for removing the heme from CcmC
        - reference_id: PMID:10339610
          supporting_text: We also present evidence that questions the role of CcmAB as a heme exporter;
            yet, the transported substrate remains unknown.
