      review:
        summary: Phylogenetic inference that CcmB-family proteins act in the plasma (inner) membrane;
          consistent with E. coli topology data.
        action: ACCEPT
        reason: CcmB is a multi-pass integral inner-membrane protein and functions there with CcmA and
