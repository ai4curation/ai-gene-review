          which included CcmB.
        action: ACCEPT
        reason: The paper experimentally located C termini of 601 inner membrane proteins using PhoA/GFP
          fusions; UniProt cites it for CcmB topology. Only the abstract is cached, but the annotation
          is consistent with all other evidence and is accepted, deferring to the curator.
        supported_by:
