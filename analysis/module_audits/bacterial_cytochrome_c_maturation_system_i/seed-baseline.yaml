    description: 'DsbE (CcmG) is a membrane-anchored thioredoxin-like thiol-disulfide oxidoreductase of
      cytochrome c maturation system I in Escherichia coli. A single N-terminal transmembrane helix anchors
      it in the inner membrane, and its C-terminal thioredoxin domain, carrying a WCPTC active site, faces
      the periplasm. DsbE acts as a highly specific disulfide reductase in the late, reductive steps of
      c-type cytochrome assembly: it keeps the cysteines of the apocytochrome CXXCH heme-binding motif
      reduced, either by reducing apocytochrome disulfides directly or by resolving mixed disulfides between
      apocytochrome c and CcmH, so that heme can be covalently attached by the CcmF/CcmH synthase. DsbE
      is itself kept reduced by direct disulfide exchange with the N-terminal periplasmic domain of the
      transmembrane electron transporter DsbD, which delivers reducing equivalents from cytoplasmic thioredoxin.
      Deletion of dsbE abolishes formation of all c-type cytochromes.'
    existing_annotations:
    - term: &id192
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:16004871
      qualifier: enables
      supporting_entities: &id193
      - UniProtKB:P36655
      review:
        summary: CcmG forms a disulfide-linked reaction complex with the N-terminal periplasmic domain
          of DsbD, whose crystal structure was solved.
        action: REMOVE
        reason: 'The DsbD-CcmG interaction is a genuine redox-reaction intermediate: DsbD reduces CcmG
          by direct disulfide exchange. Generic protein binding conveys none of this; the functional content
          is captured by CcmG''s protein-disulfide reductase activity and its role in cytochrome c-heme
          linkage. Removal does not dispute the interaction.'
        supported_by:
        - reference_id: PMID:16004871
          supporting_text: We determined the crystal structure of the disulfide-linked complex between
            nDsbD and the soluble part of CcmG at 1.94 A resolution.
    - term: &id194
