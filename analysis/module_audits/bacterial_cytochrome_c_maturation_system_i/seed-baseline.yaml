    description: CcmG, also called DsbE, is a membrane-anchored periplasmic thioredoxin of cytochrome
      c maturation system I. It supplies reducing equivalents during preparation of apocytochrome CXXCH
      motifs, acting through direct reduction of apocytochrome disulfides and/or resolution of CcmH-apocytochrome
      mixed-disulfide intermediates depending on the system I architecture.
    existing_annotations:
    - term: &id271
        id: GO:0005886
        label: plasma membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000044
      qualifier: located_in
      review:
        summary: CcmG is anchored to the inner membrane with a periplasmic thioredoxin domain.
        action: ACCEPT
        reason: The membrane anchor and periplasmic catalytic domain are integral to CcmG function, and
          complement the periplasm annotation.
    - term: &id272
        id: GO:0015036
        label: disulfide oxidoreductase activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: enables
      review:
        summary: CcmG supplies thiol-reducing activity to apocytochrome maturation, directly and through
          CcmH-linked intermediates.
        action: MODIFY
        reason: Correct but general. Biochemical studies show that CcmG reduces protein disulfides, both
          the apocytochrome CXXCH disulfide and CcmH-apocytochrome mixed disulfides (PMID:20544959; PMID:28634234),
          so the is_a descendant GO:0015035 protein-disulfide reductase activity, already the core function
          of this review, is the supported term.
        proposed_replacement_terms:
        - id: GO:0015035
          label: protein-disulfide reductase activity
        supported_by:
        - reference_id: PMID:28634234
          supporting_text: We established that CcmG can efficiently reduce the disulfide bond of apocytochrome
