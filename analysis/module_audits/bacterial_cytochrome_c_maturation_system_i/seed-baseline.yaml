    description: CcmC is a six-transmembrane-helix inner-membrane protein of the cytochrome c maturation
      (Ccm) system I and a member of the heme-handling protein superfamily defined by a tryptophan-rich
      WWD motif. CcmC binds heme in its periplasmic WWD domain, coordinating the iron through two conserved
      histidines (His60 and His184), and presents the heme 2-vinyl group to the periplasmic chaperone
      CcmE so that heme becomes covalently attached to CcmE His130. CcmC is the only Ccm protein strictly
      required for formation of holo-CcmE. It forms a CcmCDE intermediate complex with the small accessory
      protein CcmD and with CcmE, and a larger CcmA2B1C1D assembly in which ATP hydrolysis by the ABC-type
      CcmAB subunits releases holo-CcmE for delivery to the CcmF/CcmH heme ligation machinery. Although
      historically named a heme exporter, a role for CcmC or CcmABC in translocating heme across the membrane
      has not been demonstrated.
    existing_annotations:
    - term: &id056
        id: GO:0004096
        label: catalase activity
      evidence_type: IBA
      original_reference_id: GO_REF:0000033
      qualifier: enables
      supporting_entities: &id057
      - PANTHER:PTN001247822
      - UniProtKB:Q9I3N5
      review:
        summary: Catalase activity propagated to E. coli CcmC from a single Pseudomonas aeruginosa CcmC
          (Q9I3N5) donor; CcmC is a polytopic heme-handling membrane protein without a catalase active
          site.
        action: REMOVE
        reason: Catalase (H2O2 dismutation) is carried out by dedicated heme-b enzymes (KatE/KatG in E.
          coli), not by Ccm membrane proteins. The donor annotation on P. aeruginosa CcmC is a mutant-phenotype
          (IMP) annotation, and a loss of cellular catalase activity in a cytochrome c maturation mutant
          is an indirect, pleiotropic consequence of disrupted heme handling rather than evidence that
          CcmC catalyses peroxide dismutation. All direct biochemical work on CcmC describes heme binding
          and heme transfer to CcmE, with no catalytic activity on hydrogen peroxide. The PAINT node otherwise
          correctly places CcmC in cytochrome c biogenesis; this particular function should not have been
          propagated.
        supported_by:
        - reference_id: PMID:29518410
          supporting_text: We conclude that CcmC trafficks heme via its WWD domain and propose the structural
            basis for stereochemical attachment of heme.
        - reference_id: PMID:10339610
          supporting_text: it is the only Ccm protein that is strictly required for heme transfer and
            attachment to CcmE
        propagation_review:
          root_cause: SOURCE_BAD
