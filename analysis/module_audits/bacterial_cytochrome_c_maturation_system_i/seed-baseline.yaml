    description: CcmD is a small (69-residue) single-pass inner-membrane protein of the cytochrome c maturation
      (Ccm) system I, with a short acidic N-terminal segment facing the periplasm, one transmembrane helix
      and a positively charged cytoplasmic C-terminal domain. CcmD binds CcmC and is a subunit of both
      the CcmCDE heme-loading intermediate and the larger CcmABCD complex, in which the ABC-type CcmAB
      subunits use ATP hydrolysis to discharge the heme chaperone CcmE after CcmC has attached heme to
      it. CcmD does not bind heme and is not required for heme transfer from CcmC to CcmE, but it is essential
      for release of holo-CcmE from the CcmABCD complex and increases the steady-state yield of holo-CcmE;
      earlier work also proposed that it stabilises CcmE in the membrane. Loss of CcmD abolishes c-type
      cytochrome synthesis.
    existing_annotations:
