      review:
        summary: CcmF co-immunoprecipitates with CcmH, defining the CcmFH heme-lyase complex. The interaction
          is real, but generic protein binding is uninformative.
        action: REMOVE
        reason: 'Protein-binding policy: GO:0005515 is removed as uninformative; this does not dispute
          the CcmF-CcmH interaction. Its functional meaning, that CcmF and CcmH together form the holocytochrome
          c synthase, is captured by the proposed contributes_to holocytochrome-c synthase activity (GO:0004408)
          annotation and the cytochrome c-heme linkage process.'
        supported_by:
        - reference_id: PMID:11744735
          supporting_text: We propose that CcmFH forms a bacterial heme lyase complex for the transfer
            of heme from CcmE to apocytochrome c.
