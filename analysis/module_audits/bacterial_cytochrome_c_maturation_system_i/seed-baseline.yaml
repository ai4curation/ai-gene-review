        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:15513913
      qualifier: enables
      supporting_entities: &id104
      - UniProtKB:P0ABM1
      review:
        summary: CcmD co-immunoprecipitates with CcmC (P0ABM1).
        action: REMOVE
        reason: The CcmD-CcmC interaction is real and repeatedly observed, but bare protein binding conveys
          no functional information. Its functional meaning (CcmD as a subunit of the CcmCDE/CcmABCD complex
          required for holo-CcmE release) is captured by the complex and process annotations. Removal
          follows the protein-binding policy and does not dispute the interaction.
        supported_by:
        - reference_id: PMID:15513913
          supporting_text: Here we show that it physically interacts with CcmE and CcmC, another essential
            component of the heme delivery system.
    - term: &id105
