    description: CcmE is the heme chaperone of the Escherichia coli cytochrome c maturation (Ccm) system
      I. It is a monotopic inner-membrane protein with an N-terminal signal-anchor helix and a C-terminal
      periplasmic OB-fold heme-binding domain. In a ternary complex with CcmC and CcmD, CcmE receives
      heme from CcmC and binds it covalently through a single bond between His130 and a heme vinyl group,
      with Tyr134 providing an axial iron ligand, forming holo-CcmE. The ATP-hydrolysing CcmAB subcomplex
      is then needed to release holo-CcmE from CcmC, after which CcmE delivers the heme to the CcmF/CcmH
      holocytochrome c synthase for covalent attachment to the CXXCH motifs of periplasmic apocytochromes
      c. CcmE is essential for the formation of all periplasmic c-type cytochromes in E. coli.
    existing_annotations:
    - term: &id128
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:11744735
      qualifier: enables
      supporting_entities: &id129
      - UniProtKB:P0ABM1
      review:
        summary: Co-immunoprecipitation work from the Thony-Meyer laboratory placing CcmE in complexes
          with other Ccm components (GOA lists CcmC as the partner). The interaction is real, but generic
          protein binding does not convey CcmE's function.
        action: REMOVE
        reason: Following the protein-binding policy, the bare GO:0005515 term is removed as uninformative;
          this does not dispute the reported CcmE interactions. CcmE's interactions with CcmC (heme loading)
          and CcmF (heme delivery) are steps in its heme-chaperone cycle, which is captured by heme binding
          (GO:0020037) and cytochrome c-heme linkage (GO:0018063). No more informative MF term exists
          for the chaperone-partner contact itself.
        supported_by:
        - reference_id: PMID:11744735
          supporting_text: Co-immunoprecipitation experiments revealed that CcmF interacts directly with
            the heme donor CcmE and with CcmH but not with apocytochrome c.
    - term: &id130
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:15513913
      qualifier: enables
      supporting_entities: &id131
      - UniProtKB:P0ABM1
      review:
        summary: CcmE forms a ternary CcmCDE complex with CcmC and CcmD during heme loading. The interaction
          is well supported, but bare protein binding is uninformative.
        action: REMOVE
        reason: 'Protein-binding policy: the CcmC-CcmE interaction is the heme-loading step of CcmE''s
          chaperone cycle and is better represented by heme binding and the cytochrome c-heme linkage
          process. Removal does not mean the interaction is false.'
        supported_by:
        - reference_id: PMID:15513913
          supporting_text: We demonstrate the formation of a ternary complex consisting of CcmCDE.
    - term: &id132
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:16364305
      qualifier: enables
      supporting_entities: &id133
      - UniProtKB:P0ABM1
      review:
        summary: CcmE variants co-precipitate with CcmC, mapping the CcmC interaction to the periplasmic
          heme-binding domain of CcmE. Bare protein binding is uninformative.
        action: REMOVE
        reason: 'Protein-binding policy: the reported CcmC interaction is accepted as real but removed
          as a function annotation because GO:0005515 does not describe what CcmE does; its heme-chaperone
          role is captured elsewhere.'
        supported_by:
        - reference_id: PMID:16364305
          supporting_text: Also, both forms of CcmE can be co-precipitated with CcmC, thus restricting
            the site of interaction of CcmE with CcmC to the C-terminal periplasmic domain.
    - term: &id134
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:16824107
      qualifier: enables
      supporting_entities: &id135
      - UniProtKB:P0ABM1
      review:
        summary: Holo-CcmE binds CcmC in a stable dead-end complex when CcmA or CcmB is absent, and CcmAB-dependent
          ATP hydrolysis releases it. Bare protein binding is uninformative.
        action: REMOVE
        reason: 'Protein-binding policy: the CcmC-holoCcmE complex is a trafficking intermediate of the
          heme-chaperone cycle, not a distinct binding function of CcmE. Removal does not dispute the
          interaction.'
        supported_by:
        - reference_id: PMID:16824107
          supporting_text: In the absence of CcmA or CcmB, holo(haem)CcmE binds to CcmC in a stable dead-end
            complex, indicating high affinity binding of haem to CcmC.
    - term: &id136
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:19629033
      qualifier: enables
      supporting_entities: &id137
      - UniProtKB:P0ABM1
      review:
        summary: Purified GST-CcmCDE complexes trapped with heme show CcmE bound to CcmC. The interaction
          is solid, but generic protein binding conveys no function.
        action: REMOVE
        reason: 'Protein-binding policy: the CcmCDE complex is the site of covalent heme loading onto
          CcmE (His130), which is better captured by heme binding and the cytochrome c-heme linkage process.
          Removal does not mean the interaction is false.'
        supported_by:
        - reference_id: PMID:19629033
          supporting_text: The split α-absorption peak is due to a unique haem environment, contributions
            from which are shown to include CcmC His60 and His184 as iron axial ligands and the CcmE His130
            as a covalent adduct.
    - term: &id138
        id: GO:0005886
        label: plasma membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: located_in
      supporting_entities: &id139
      - InterPro:IPR036127
      - UniProtKB-SubCell:SL-0037
      - UniRule:UR000089058
      review:
        summary: CcmE is a monotopic inner (cytoplasmic) membrane protein whose N-terminal helix anchors
          a periplasmic heme-binding domain.
        action: ACCEPT
        reason: Experimental work describes CcmE as a monotopic membrane protein with a periplasmic functional
          domain, and its membrane anchor is functionally important for heme receipt from CcmC. Plasma
          membrane is the correct location term for the E. coli inner membrane.
        supported_by:
        - reference_id: PMID:16364305
          supporting_text: The cytochrome c maturation system of Escherichia coli contains two monotopic
            membrane proteins with periplasmic, functional domains, the heme chaperone CcmE and the thioredoxin
            CcmG.
    - term: &id140
        id: GO:0017003
        label: protein-heme linkage
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: involved_in
      supporting_entities: &id141
      - InterPro:IPR004329
      - InterPro:IPR036127
      - UniRule:UR000089058
      review:
        summary: CcmE is itself covalently linked to heme through His130 before delivering that heme to
          apocytochrome c.
        action: ACCEPT
        reason: CcmE supplies the His130 nucleophile of the covalent heme-protein bond in holo-CcmE, so
          it is the most direct participant in this protein-heme linkage. CcmE is not a cytochrome, so
          the general protein-heme linkage term is the right level for this bond, matching the ccmC review's
          ACCEPT for the same reaction. CcmE's later role as heme donor for cytochrome c is captured separately
          by the NEW GO:0018063 row.
        supported_by:
        - reference_id: PMID:9712585
          supporting_text: CcmE, was shown to bind heme in the bacterial periplasm by way of a single
            covalent bond to a histidine.
    - term: &id142
        id: GO:0017004
        label: cytochrome complex assembly
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: involved_in
      supporting_entities: &id143
      - InterPro:IPR004329
      - InterPro:IPR036127
      review:
        summary: CcmE contributes to c-type cytochrome maturation; cytochrome complex assembly is a broad
          parent of the more precise process.
        action: MODIFY
        reason: GO:0018063 cytochrome c-heme linkage is an is_a descendant of GO:0017004 and names the
          specific step CcmE serves (delivery of heme for covalent attachment to apocytochrome c). Cytochrome
          complex assembly otherwise suggests assembly of multi-subunit cytochrome complexes, which CcmE
          does not directly perform.
        proposed_replacement_terms:
        - id: GO:0018063
          label: cytochrome c-heme linkage
        supported_by:
        - reference_id: PMID:9712585
          supporting_text: The heme was then released and delivered to apocytochrome c.
    - term: &id144
        id: GO:0017004
        label: cytochrome complex assembly
      evidence_type: NAS
      original_reference_id: PMID:24044352
      qualifier: involved_in
      review:
        summary: The Mavridou et al. study describes CcmE as the pivotal heme chaperone in cytochrome
          c biogenesis; the correct but general process is refined as for the IEA row.
        action: MODIFY
        reason: 'Consistent with the IEA row for the same term: the claim is sound but the is_a descendant
          cytochrome c-heme linkage (GO:0018063) is the precise process supported for CcmE.'
        proposed_replacement_terms:
        - id: GO:0018063
          label: cytochrome c-heme linkage
        supported_by:
        - reference_id: PMID:24044352
          supporting_text: CcmE was found to have the surprising property of binding heme covalently,
            via a conserved histidine residue, before transferring the heme to the apocytochrome.
    - term: &id145
        id: GO:0020037
        label: heme binding
      evidence_type: IBA
      original_reference_id: GO_REF:0000033
      qualifier: enables
      supporting_entities: &id146
      - AGI_LocusCode:AT3G51790
      - PANTHER:PTN002436954
      - UniProtKB:P69490
      review:
        summary: Heme binding is conserved across the CcmE/CycJ family, including plant mitochondrial
          CCME; E. coli CcmE is among the experimental donors.
        action: ACCEPT
        reason: The PAINT node places heme binding at the root of the CcmE family, and E. coli CcmE has
          direct experimental evidence (its own appearance in the WITH/FROM reflects this grounding).
          Heme binding is CcmE's core molecular activity as a heme chaperone.
        supported_by:
        - reference_id: file:ECOLI/ccmE/ccmE-uniprot.txt
          supporting_text: Heme chaperone required for the biogenesis of c-type cytochromes. Transiently
            binds heme delivered by CcmC and transfers the heme to apo-cytochromes
    - term: &id147
        id: GO:0020037
        label: heme binding
      evidence_type: IDA
      original_reference_id: PMID:9712585
      qualifier: enables
      review:
        summary: Schulz et al. showed that CcmE binds heme in the periplasm via a single covalent bond
          to a histidine, defining it as a heme chaperone.
        action: ACCEPT
        reason: Direct biochemical demonstration of heme binding by CcmE; this is the founding evidence
          for its chaperone function and the core MF.
        supported_by:
        - reference_id: PMID:9712585
          supporting_text: Thus, CcmE can be viewed as a heme chaperone guiding heme to its appropriate
            biological partner and preventing illegitimate complex formation.
    - term: &id148
        id: GO:0020037
