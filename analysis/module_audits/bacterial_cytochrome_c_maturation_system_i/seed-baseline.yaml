    - term: &id171
        id: GO:0015232
        label: heme transmembrane transporter activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: enables
      supporting_entities: &id172
      - InterPro:IPR003567
      - InterPro:IPR003568
      review:
        summary: InterPro2GO mapping from the cytochrome c biogenesis protein family signatures; no evidence
          that CcmF moves heme across the membrane.
        action: REMOVE
        reason: The heme that CcmF attaches to apocytochrome c is delivered on the periplasmic side by
          holo-CcmE, and CcmF's own b-heme is a stable, stoichiometric cofactor, not a transported substrate.
          There are no experimental annotations for transport activity on E. coli CcmF, and the CcmFGH-only
          experiments show heme attachment by CcmFH without any dedicated transporter role being demonstrated
          for CcmF. The family-level IEA mapping (which also covers system II CcsA/CcsBA, a genuine heme
          export-and-attachment protein) is over-propagated to CcmF.
        supported_by:
        - reference_id: PMID:19629033
          supporting_text: This haem is shown not to arise from holoCcmE, which is the haem moiety that
            is covalently attached to the CXXCH of apocytochromes c at the CcmF/H active site
        - reference_id: PMID:19629033
          supporting_text: Rather, the b -haem is a stable component of the CcmF protein in a 1:1 (molar)
            stoichiometry.
    - term: &id173
        id: GO:0015886
        label: heme transport
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: involved_in
      supporting_entities: &id174
      - InterPro:IPR003567
      - InterPro:IPR003568
      review:
        summary: CcmF handles heme transferred from holo-CcmE to apocytochrome c within the periplasmic
          ligation step, but this is not a transport process in the usual GO sense.
        action: MARK_AS_OVER_ANNOTATED
        reason: Heme handover from CcmE to apocytochrome at the CcmF/H active site could be read as movement
          of heme within the cell, but CcmF's role is better captured by cytochrome c-heme linkage (GO:0018063).
          The family-based transport mapping overstates the evidence for CcmF.
        supported_by:
        - reference_id: PMID:24044352
          supporting_text: The large membrane protein CcmF is thought to transfer the heme from CcmE to
            the apocytochrome and to be involved in the formation of the thioether bonds between the heme
            and the cytochrome cysteines
