    - term: &id022
        id: GO:0022857
        label: transmembrane transporter activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: enables
      supporting_entities: &id023
      - InterPro:IPR005895
      review:
        summary: Generic transporter MF inherited from the historical heme-exporter naming of the CcmA
          InterPro family.
        action: REMOVE
        reason: No substrate translocated by CcmAB has been identified, heme export has been tested and
          not supported, and the experimentally characterized activity of the CcmABCD assembly is ATP-dependent
          release of the membrane-anchored chaperone holo-CcmE from CcmC, which is not a transmembrane
          transport reaction. CcmA itself is a peripheral nucleotide-binding subunit. The transporter
          MF is therefore an unsupported family-name inference, removed consistently with the substrate-specific
          GO:0015439 row and with the P. putida CcmA review.
        supported_by:
        - reference_id: PMID:10339610
          supporting_text: We also present evidence that questions the role of CcmAB as a heme exporter;
            yet, the transported substrate remains unknown.
        - reference_id: PMID:16824107
          supporting_text: We propose that the CcmA2B1C1 complex represents a new subgroup within the
            ABC transporter superfamily that functions to release a chaperone.
    - term: &id024
        id: GO:0043190
        label: ATP-binding cassette (ABC) transporter complex
      evidence_type: NAS
      original_reference_id: PMID:24044352
      qualifier: part_of
      review:
        summary: CcmA is the nucleotide-binding subunit of a complex with ABC-transporter architecture
          (CcmA plus integral membrane CcmB, joined by CcmC/CcmD), but the complex is not shown to transport
          a metabolite.
        action: MARK_AS_OVER_ANNOTATED
        reason: GO:0043190 is defined as a complex for transport of metabolites into or out of the cell.
          CcmAB does have ABC architecture and is described as an ABC transporter by name, so the assignment
          is not baseless, but the cited paper itself states the transporter model was disproven and the
          characterized function is holo-CcmE release. No GO complex term exists for the CcmABCD heme-chaperone
          release complex (ComplexPortal CPX-3568), so this is flagged as over-annotation rather than
          replaced. Action matches the ccmB, ccmC and ccmD reviews.
        supported_by:
        - reference_id: PMID:10339610
          supporting_text: Our results suggest that the ABC transporter is composed of the ATP-binding
            CcmA subunit plus the membrane-integral CcmB protein.
        - reference_id: PMID:24044352
          supporting_text: It was thought that CcmABC form a ATP-driven heme transporter,14 but this has
            since been disproven.
    - term: &id025
        id: GO:1903607
        label: cytochrome c biosynthetic process
      evidence_type: IBA
      original_reference_id: GO_REF:0000033
      qualifier: involved_in
      supporting_entities: &id026
      - PANTHER:PTN001952384
