      review:
        summary: Records association of CcmB with CcmC in the CcmA2B1C1 complex (Feissner et al. 2006).
        action: REMOVE
        reason: Bare protein binding is uninformative under the project protein-binding policy. The CcmB-CcmC
          association is genuine and reflects assembly of the holo-CcmE release complex, captured in core_functions;
          no specific binding MF can be derived from interaction data alone. Removal does not mean the
          interaction is false.
        supported_by:
        - reference_id: PMID:16824107
          supporting_text: This ABC transporter is composed of the ABC subunit CcmA, and two membrane
            proteins, CcmB and CcmC.
