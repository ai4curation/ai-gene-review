    - term: &id150
        id: GO:0043190
        label: ATP-binding cassette (ABC) transporter complex
      evidence_type: NAS
      original_reference_id: PMID:24044352
      qualifier: part_of
      review:
        summary: CcmE is the client chaperone released by the CcmABCD complex, not a subunit of an ABC
          transporter.
        action: REMOVE
        reason: The cited paper itself describes CcmAB as the ABC-like component that forms a complex
          with CcmC, with CcmE receiving heme from CcmC; it also states that the ATP-driven heme transporter
          model for CcmABC has been disproven. Holo-CcmE is only trapped with CcmC in a dead-end complex
          when CcmA/CcmB are missing, and CcmAB ATP hydrolysis serves to release it. CcmE is therefore
          a transiently bound substrate/client of the CcmABCD assembly rather than a component of an ABC
          transporter complex. This is a non-experimental (NAS) statement contradicted by the source and
          by the direct release experiments.
        supported_by:
        - reference_id: PMID:24044352
          supporting_text: It was thought that CcmABC form a ATP-driven heme transporter,14 but this has
            since been disproven.
        - reference_id: PMID:16824107
          supporting_text: The mechanism involves an ATP-binding cassette (ABC) transporter that is required
            for release of the periplasmic haem chaperone CcmE to the last step of cytochrome c assembly.
    - term: &id151
        id: GO:1903607
        label: cytochrome c biosynthetic process
      evidence_type: IBA
      original_reference_id: GO_REF:0000033
      qualifier: involved_in
      supporting_entities: &id152
      - PANTHER:PTN002436954
      - UniProtKB:P69490
      review:
        summary: CcmE family members are required for c-type cytochrome biogenesis; E. coli CcmE is a
          descendant with experimental support.
        action: ACCEPT
        reason: Correct and well supported phylogenetically and experimentally. CcmE carries the heme
          that becomes covalently attached to cytochrome c, so it contributes directly to cytochrome c
          biosynthesis.
        supported_by:
        - reference_id: PMID:9712585
          supporting_text: Prototype of a heme chaperone essential for cytochrome c maturation.
    - term: &id153
        id: GO:1903607
        label: cytochrome c biosynthetic process
