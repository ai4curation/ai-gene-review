      review:
        summary: InterPro2GO assignment reflecting the historical "heme exporter" name of the CcmC family.
        action: MARK_AS_OVER_ANNOTATED
        reason: 'CcmC directly binds heme in its periplasmic WWD domain and transfers it to CcmE, and
          later work speaks of CcmC "trafficking" heme. But translocation of heme across the membrane
          by CcmC has never been demonstrated: the ABC-transporter heme-export model was questioned by
          direct experiments (PMID:10339610, PMID:10708391) and is described as disproven (PMID:24044352).
          The source of periplasmic heme for CcmC remains unresolved, so the transporter MF is not refuted
          outright but overstates current evidence; heme binding (GO:0020037) is the supported MF. No
          E. coli experimental annotation asserts transporter activity. Not REMOVE, because CcmC''s direct
          heme contact on the periplasmic side leaves a CcmC-mediated membrane passage open as an unproven
          hypothesis.'
        supported_by:
        - reference_id: PMID:24044352
          supporting_text: It was thought that CcmABC form a ATP-driven heme transporter,14 but this has
            since been disproven.
        - reference_id: PMID:10339610
