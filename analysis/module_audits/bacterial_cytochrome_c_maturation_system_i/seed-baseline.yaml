    status: COMPLETE
    taxon: *id001
    description: 'CcmA is the cytoplasmic ATP-binding cassette (nucleotide-binding) subunit of the inner-membrane
      CcmAB complex of cytochrome c maturation system I in Escherichia coli. It associates with the membrane
      only together with the integral membrane partner CcmB and, through CcmB, with the heme-handling
      protein CcmC (and CcmD) in a CcmABCD assembly. ATP hydrolysis by CcmA is required for c-type cytochrome
      synthesis: in its absence, or in a Walker A (K40D) mutant, heme-loaded CcmE stays trapped with CcmC
      and cannot deliver heme to apocytochrome c. CcmAB was long assumed to export heme to the periplasm,
      but direct tests do not support that model; its function is best described as ATP-dependent energy
      coupling for release of holo-CcmE from CcmC, and any transported substrate remains unknown.'
    aliases:
    - P33931
    - b2201
    - yejW
