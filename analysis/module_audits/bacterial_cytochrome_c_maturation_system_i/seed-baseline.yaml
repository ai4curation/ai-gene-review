      original_reference_id: PMID:19629033
      qualifier: acts_upstream_of_or_within
      review:
        summary: Purification of CcmCDE heme-trapped intermediates and holo-CcmE defines CcmE's position
          in the heme trafficking route to cytochrome c.
        action: ACCEPT
        reason: The paper biochemically defines holo-CcmE formation and its oxidized heme state as an
          intermediate en route to the CcmF/H synthetase, supporting CcmE's role in cytochrome c biosynthesis.
        supported_by:
        - reference_id: PMID:19629033
          supporting_text: All post-adduct holoCcmE intermediates and released holoCcmE possess haem in
            the oxidized state (Fe 3+ ).
    - term: &id154
        id: GO:1903607
        label: cytochrome c biosynthetic process
      evidence_type: IMP
      original_reference_id: PMID:9712585
      qualifier: acts_upstream_of_or_within
      review:
        summary: CcmE is essential for cytochrome c maturation, and its covalently bound heme is delivered
          to apocytochrome c.
        action: ACCEPT
        reason: Mutant and heme-transfer evidence in the founding paper establish CcmE as an essential
          participant in cytochrome c biosynthesis.
        supported_by:
        - reference_id: PMID:9712585
          supporting_text: The heme was then released and delivered to apocytochrome c.
    - term: &id155
        id: GO:1904334
        label: heme import across plasma membrane
      evidence_type: NAS
      original_reference_id: PMID:24044352
      qualifier: involved_in
      review:
        summary: CcmE is a periplasmic heme chaperone acting after heme has reached the periplasmic side;
          there is no evidence that it moves heme across a membrane, and the term describes import into
          the cytosol.
        action: REMOVE
        reason: GO:1904334 is defined as movement of heme from outside the cell across the plasma membrane
          into the cytosol, the opposite direction from heme flow in cytochrome c maturation (cytoplasm
          to periplasm). The cited paper states that the heme transport route across the inner membrane
          is unknown and that CcmE acts on heme already ligated by CcmC at the periplasmic assembly site.
          The annotation is contradicted by both the term definition and the source.
        supported_by:
        - reference_id: PMID:24044352
          supporting_text: The mechanism of how heme is transported from its cytoplasmic site of synthesis
            across the inner membrane is not known.
    - term: &id156
        id: GO:0018063
        label: cytochrome c-heme linkage
      evidence_type: IMP
      original_reference_id: PMID:9712585
      qualifier: involved_in
      review:
        summary: CcmE donates its covalently bound heme for attachment to apocytochrome c; the heme-linkage
          process is the precise process in which it acts.
        action: NEW
        reason: 'Argued on its own footing, separately from the protein-heme linkage row (kept as ACCEPT
          for CcmE''s own His130 bond). CcmE does part of the work of the step rather than being merely
          required: it is the heme donor, carrying the cofactor as a covalent His130 adduct and transferring
          it to the CcmF/CcmH ligation site. The system I module models CcmE with this process.'
        supported_by:
        - reference_id: PMID:9712585
          supporting_text: The heme was then released and delivered to apocytochrome c.
        - reference_id: PMID:24044352
          supporting_text: CcmE was found to have the surprising property of binding heme covalently,
            via a conserved histidine residue, before transferring the heme to the apocytochrome.
