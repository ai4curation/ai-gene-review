      supporting_entities: &id043
      - InterPro:IPR003544
      review:
        summary: Family-level inference of heme transport. CcmB contributes to moving heme, as covalent
          holo-CcmE, off CcmC within the maturation machinery, but does not itself transport heme.
        action: MARK_AS_OVER_ANNOTATED
        reason: GO:0015886 includes movement of heme within a cell, and the CcmABCD complex does mobilise
          heme from CcmC by releasing holo-CcmE, so the term is not wholly wrong. However, the heme moves
          as a covalent adduct of the CcmE chaperone, CcmB's contribution is energy transduction from
          CcmA, and translocation of free heme by CcmAB has been tested and not supported. The informative
          process is GO:1903607, already accepted.
        supported_by:
