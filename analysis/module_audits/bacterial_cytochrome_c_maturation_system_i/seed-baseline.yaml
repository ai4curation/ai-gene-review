      - InterPro:IPR003544
      review:
        summary: InterPro2GO mapping reflecting the historical "heme exporter protein B" model of CcmB;
          not supported experimentally.
        action: REMOVE
        reason: This is an electronic family-name inference with no experimental support on E. coli CcmB.
          Everted-vesicle assays showed haem translocation is ATP-independent and unaffected by loss of
          CcmAB (Cook and Poole 2000); CcmC overproduction bypasses CcmAB for heme loading onto CcmE and
          exogenous heme does not rescue ccm mutants (Schulz et al. 1999); and Mavridou et al. 2013 describe
          the heme transporter model as disproven. The legacy UniProt FUNCTION line for CcmB still repeats
          the export model, but the paired CcmA entry has been revised to say heme export does not seem
          to be the case. No E. coli experimental row asserts a transporter MF, so removing this IEA does
          not overrule a curator.
        supported_by:
        - reference_id: PMID:10708391
          supporting_text: suggesting that the activity of neither the CydDC nor CcmAB transporters is
            essential for haem export to the periplasm
        - reference_id: PMID:10339610
          supporting_text: We also present evidence that questions the role of CcmAB as a heme exporter;
            yet, the transported substrate remains unknown.
        - reference_id: PMID:24044352
          supporting_text: It was thought that CcmABC form a ATP-driven heme transporter,14 but this has
            since been disproven.
    - term: &id042
