        supported_by:
        - reference_id: PMID:16824107
          supporting_text: The mechanism involves an ATP-binding cassette (ABC) transporter that is required
            for release of the periplasmic haem chaperone CcmE to the last step of cytochrome c assembly.
        - reference_id: PMID:16824107
          supporting_text: In the absence of CcmA or CcmB, holo(haem)CcmE binds to CcmC in a stable dead-end
            complex, indicating high affinity binding of haem to CcmC.
    - term: &id028
        id: GO:1903607
        label: cytochrome c biosynthetic process
      evidence_type: IMP
      original_reference_id: PMID:10339610
      qualifier: involved_in
      review:
        summary: In-frame chromosomal ccmA deletion abolishes holocytochrome c formation even when CcmC
          overproduction restores holo-CcmE.
        action: ACCEPT
        reason: Direct mutant phenotype in E. coli K-12 showing CcmA is needed for cytochrome c maturation
          at a step downstream of heme loading onto CcmE.
        supported_by:
        - reference_id: PMID:10339610
          supporting_text: The ΔccmAand ΔccmBmutants, however, could not synthesize holocytochromec
    - term: &id029
        id: GO:1904334
        label: heme import across plasma membrane
      evidence_type: NAS
      original_reference_id: PMID:24044352
      qualifier: involved_in
      review:
        summary: ComplexPortal statement assigning heme import to the CcmABCDE complex; the cited paper
          itself says the heme-transporter model has been disproven.
        action: REMOVE
        reason: The cited paper explicitly rejects an ATP-driven CcmABC heme transporter and depicts the
          route of heme to the periplasm as unknown. Even under the historical model the direction would
          be export to the periplasm, not import into the cell. Direct vesicle assays found CcmAB dispensable
          for heme translocation (PMID:10708391). This NAS is contradicted by its own source.
        supported_by:
        - reference_id: PMID:24044352
          supporting_text: It was thought that CcmABC form a ATP-driven heme transporter,14 but this has
            since been disproven.
        - reference_id: PMID:24044352
          supporting_text: Heme is also synthesized in the cytoplasm, but its transport route to the point
            of assembly is unknown
        - reference_id: PMID:10708391
          supporting_text: suggesting that the activity of neither the CydDC nor CcmAB transporters is
            essential for haem export to the periplasm
