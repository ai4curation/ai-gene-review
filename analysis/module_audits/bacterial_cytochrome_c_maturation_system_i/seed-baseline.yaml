        action: REMOVE
        reason: Bare protein binding is uninformative under the project protein-binding policy. The CcmA-CcmB
          interaction is real (CcmA is membrane-bound only when CcmB is present), but no specific binding
          MF term is warranted. Removal does not mean the interaction is false.
        supported_by:
        - reference_id: PMID:16824107
          supporting_text: Expression of CcmA and CcmB facilitates formation of the CcmA2B1C1 complex
            and ATP-dependent release of holoCcmE.
