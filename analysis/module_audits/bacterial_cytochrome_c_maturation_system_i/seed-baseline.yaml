      original_reference_id: GO_REF:0000044
      qualifier: located_in
      supporting_entities: &id013
      - UniProtKB-SubCell:SL-0037
      review:
        summary: CcmA is a peripheral subunit on the cytoplasmic face of the inner membrane, held there
          by CcmB.
        action: ACCEPT
        reason: Experimental fractionation shows CcmA is membrane-bound only when CcmB is present, consistent
          with the UniProt peripheral inner membrane location. Plasma membrane (bacterial inner membrane)
          is the correct location for its core energy-coupling role.
        supported_by:
        - reference_id: PMID:17419738
          supporting_text: CcmA, which has the features of a soluble ATP hydrolysis subunit, is found
            in a membrane-bound complex only when CcmB is present in the membrane.
    - term: &id014
        id: GO:0015439
        label: ABC-type heme transporter activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: enables
      supporting_entities: &id015
      - RHEA:19261
      - EC:7.6.2.5
      review:
        summary: Electronic mapping from the legacy EC 7.6.2.5 heme-exporter reaction. Direct experiments
          in E. coli do not support heme export by CcmAB.
        action: REMOVE
        reason: This is an EC/Rhea-derived IEA, not an experimental annotation. The E. coli UniProt FUNCTION
          text itself states the heme-export model does not seem to hold. Everted-vesicle assays showed
          haem uptake was unaffected by ccmA deletion and needed no ATP (Cook and Poole 2000); Schulz
          et al. 1999 found that CcmC overexpression bypasses CcmAB for heme loading of CcmE and that
          exogenous heme cannot rescue ccmA mutants; and Mavridou et al. 2013 describe the ATP-driven
          heme transporter model as disproven. CcmAB acts to release holo-CcmE from CcmC, so a heme-substrate
          transporter MF is demonstrably wrong. There are no experimental rows for a transporter MF on
          E. coli CcmA, so this does not overrule any curator.
        supported_by:
        - reference_id: file:ECOLI/ccmA/ccmA-uniprot.txt
          supporting_text: once thought to export heme, this does not seem to be the case, but its exact
            role is uncertain.
        - reference_id: PMID:10708391
          supporting_text: suggesting that the activity of neither the CydDC nor CcmAB transporters is
            essential for haem export to the periplasm
        - reference_id: PMID:10339610
          supporting_text: We also present evidence that questions the role of CcmAB as a heme exporter;
            yet, the transported substrate remains unknown.
        - reference_id: PMID:24044352
          supporting_text: It was thought that CcmABC form a ATP-driven heme transporter,14 but this has
            since been disproven.
