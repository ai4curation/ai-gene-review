scope: Inspected top-level reference findings across all13 previously reviewed targets; corrected seven clearly
  mismatched statements in five targets. No annotation verdict/core/quote changes.
released_handoff:
  manifest_sha256: d4d73d28bb109763c65ce0fd055f9126cec78c81ad8a3b4298da2a35a31348f8
  verified_files: 52
  all_match: true
  snapshot_root: .cache/module-audit-logs/cytochrome-20261106/round1-reference-supplement/released-52-snapshot
changes:
- target: SHEON/ccmB
  reference: PMID:40026579
  finding_index: 0
  previous_statement: MR-1 CcmB is localized to the inner membrane.
  corrected_statement: Functional CcmB-GFP fusions complement the MR-1 ccmB mutant and inhibit cytochrome c
    maturation at higher expression levels.
  unchanged_supporting_text: The fusion proteins were found to be active, capable of complementing the ccmB
    mutant and inhibiting CCM when expressed to proper levels
- target: SHEON/ccmB
  reference: PMID:40167305
  finding_index: 0
  previous_statement: CcmB overproduction supports conditional cellular heme efflux in MR-1.
  corrected_statement: In the E. coli system examined, CcmAB and ATP hydrolysis are not required for heme delivery
    to the CcmC WWD domain. This challenges a universal CcmB conduit model; it is not an MR-1 efflux result.
  unchanged_supporting_text: Thus, CcmAB, and consequently ATP hydrolysis, are not required for heme transport
    to the CcmC WWD domain.
- target: RHOCB/ccl1
  reference: PMID:24397552
  finding_index: 0
  previous_statement: Ligation and heme handling do not establish CcmF as a membrane-crossing heme transporter.
  corrected_statement: CcmF contains a stably bound, noncovalent heme b cofactor.
  unchanged_supporting_text: CcmF contains a separate, stably bound non-covalent heme b
- target: RHOCB/ccl1
  reference: file:RHOCB/ccl2/ccl2-source-analysis/construct-scope.md
  finding_index: 0
  previous_statement: CcmF contributes to holocytochrome-c synthase activity in a multisubunit complex.
  corrected_statement: The SB1003 CcmF assignment transfers conserved roles from characterized constructs and
    strains; the source analysis does not claim an unmodified SB1003 assay.
  unchanged_supporting_text: The SB1003 reviews therefore transfer conserved molecular roles with explicit
    construct/strain limits and do not claim an unmodified SB1003 assay.
- target: RHOCB/ccl2
  reference: file:RHOCB/ccl2/ccl2-source-analysis/construct-scope.md
  finding_index: 0
  previous_statement: CcmH mediates thiol-disulfide exchange with apocytochrome c and CcmG.
  corrected_statement: The SB1003 CcmH assignment transfers conserved roles with explicit construct and strain
    limits; an unmodified SB1003 assay is not claimed.
  unchanged_supporting_text: The SB1003 reviews therefore transfer conserved molecular roles with explicit
    construct/strain limits and do not claim an unmodified SB1003 assay.
- target: ECOLI/ccmE
  reference: PMID:40167305
  finding_index: 0
  previous_statement: Cysteine/heme crosslinks map a proposed heme acceptance site and transmembrane path through
    E. coli CcmCD.
  corrected_statement: The E. coli biochemical mapping results do not support CcmB as the heme-acceptance component
    of System I; this is evidence against that model, not an MR-1 transport assay.
  unchanged_supporting_text: do not support a role for CcmB in heme acceptance for System I
- target: ECOLI/ccmB
  reference: PMID:40167305
  finding_index: 0
  previous_statement: Cysteine/heme crosslinks map a proposed heme acceptance site and transmembrane path through
    E. coli CcmCD.
  corrected_statement: The E. coli biochemical mapping results do not support CcmB as the heme-acceptance component
    of System I, providing counterevidence to the proposed CcmB-conduit model.
  unchanged_supporting_text: do not support a role for CcmB in heme acceptance for System I
