judgments:
- issue: Broad heme transport versus membrane crossing
  decision: Retain GO0015886 for active intracellular heme handoff in all four audited CcmF orthologs. Preserve
    direct canonical machinery versus G20/Rhodobacter/KT2440 inference boundaries. Heme binding alone is not
    the argument.
  primary: PMID:24397552
  supporting_text: Our findings establish that CcmFH is the system I holocytochrome c synthetase.
- issue: CcmB and CcmC precise transporter certainty
  decision: 'OLEA2 and SHEON CcmB GO0015232 become UNDECIDED. G20 CcmC is likewise UNDECIDED because the later
    canonical CcmCD channel study contradicts blanket absence claims but does not assay the I* target. OLEA2
    CcmF becomes MARK_AS_OVER_ANNOTATED for a different reason: known ligation/heme handling does not establish
    a conduit, and no target-negative transport assay exists.'
  primary: PMID:40167305
  supporting_text: 'A structure-function analysis via cysteine/heme crosslinking

    identified a heme acceptance domain and heme transport channel in CcmCD.'
- issue: SHEON broad heme transport process
  decision: ACCEPT based on conserved active participation in heme-handoff machinery plus separate quantitative
    external-heme results. The CcmA2B1C1 release experiment is E. coli ortholog evidence; MR-1 overproduction
    is conditional whole-cell evidence, not proof of an autonomous inner-membrane channel. The conflicting-channel
    quote supports UNDECIDED only and is absent from positive BP support.
  primary: PMID:40026579
  supporting_text: Results showed that the ccmB mutant did not release heme to levels above the detection limit
    but was able to do so when the ccmB gene was expressed with IPTG at 0.1 mM or above
- issue: Localization
  decision: OLEA2 CcmE uses target Phobius TM9..29; KT2440 CycH uses target TM6..24 and93..113. These are admissible
    topology predictions plus conserved machinery context, not native target localization assays. CcmA activity
    is placed at the associated plasma membrane on its cytoplasmic face, explicitly inferred for G20.
  primary: PMID:24044352
  supporting_text: 'with the exception of CcmA, which is located on

    the cytoplasmic side of the membrane.'
- issue: CcmE covalent intermediate
  decision: Retain GO0017003 for the Cys127 and His130 protein-heme intermediates separately from downstream
    cytochrome delivery. GO0018063 currently also mentions other heme proteins, so the argument is distinct
    chemical events, not an invented cytochrome-only restriction.
deferred_nonblocking:
- target: ECOLI/ccmE
  issue: Historical NEW GO0018063 duplicates existing MODIFY replacements. Exact payload and NEW status retained
    by explicit parent instruction; no withdrawal or hidden row removal.
- target: RHOCB/ccl2
  issue: GO0015035 versus0015036 differ by protein substrate scope, not directionality. Broad historical NEW
    and core remain unchanged; notes explain measured exchange and reduced-CcmH alternative without inventing
    a negative reductase claim.
- target: module ccmD/ccmI process granularity
  issue: Module not edited; aggregate/module reconciliation belongs to root.
