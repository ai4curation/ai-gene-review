- id: PMID:40026579
  title: Complexation of CcmB with CcmACD safeguards heme translocation for cytochrome c maturation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full primary study: CcmB overproduction, heme loss/sensitivity, complementation, modeling
      and mutagenesis support its proposed translocase role. Main experimental model is Shewanella; exact
      donor identity for other homologs and physiologically assembled complexes needs separate checking.
      Its conduit assignment is disputed by PMID40167305.'
  findings:
  - statement: The authors assign CcmB a heme-translocase role and complexation with CcmACD a routing
      role toward maturation.
  - statement: Excess free CcmB can drain cellular heme; this phenotype does not by itself settle which
      subunit conducts native maturation-associated transmembrane flux.
  cached_source_sha256: 19eb610f9e013e465bd92800a6ff3ead56e0235126a138f381f9cfdb08a2460d
- id: PMID:40167305
  title: Biochemical mapping reveals a conserved heme transport mechanism via CcmCD in System I bacterial
    cytochrome c biogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary study maps engineered cysteine/heme crosslinks in CcmCD and explicitly
      disputes CcmB-channel proposals. Contact mapping plus holoCcmE formation without CcmAB supports
      its model; distinguish this from a purified vectorial-flux measurement or proof that all taxa use
      an identical conduit.
  findings:
  - statement: Mapped heme contacts span cytoplasmic acceptance and a proposed CcmC membrane channel leading
      to the WWD domain.
  - statement: The study distinguishes proposed energy-independent transport from CcmAB ATP-dependent
      holoCcmE release.
