- id: PMID:21958041
  title: Cytochrome c biogenesis System I.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Comparative review with full text: useful for canonical versus System I* and fused/separate
      CcmH/I architectures; mechanistic proposals are dated and must be reconciled with newer primary
      studies.'
  findings:
  - statement: System I* uses a cysteine-bearing CcmE and can omit the canonical CcmG/H requirement in
      characterized strains; not every cysteine-CcmE lineage lacks CcmH.
  - statement: CcmI enhances maturation in the characterized System I* but is not absolutely required.
    supporting_text: In System I*, CcmI appears to enhance the production of c-type cytochromes but is
