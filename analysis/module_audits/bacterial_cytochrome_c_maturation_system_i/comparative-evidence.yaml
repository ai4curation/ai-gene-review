modeling_constraints:
- Bacterial module context excludes archaeal and mitochondrial implementations even when the comparative
  review discusses them.
- Keep exact conduit identity unresolved where primary studies disagree; retain supported heme handling,
  loading, ATP coupling and release roles.
- Do not make CcmG/H universally required across System I; the experimentally reconstituted System I*
  lacks those canonical components.
- Model linked CcmE chemistry and ligation variants together; avoid artificial hybrids assembled from
  incompatible alternatives.
- DsbD or CcdA electron supply and Sec export are external dependencies; do not universally require DsbD
  across lineages.
- CcmI accessory dependence must track the actual lineage and assay; CcmD deletion is not interchangeable
  with CcmI deletion.
- 'Gene names and old taxonomic names are not sufficient protein identity: establish the exact donor,
  sequence and current accession.'
