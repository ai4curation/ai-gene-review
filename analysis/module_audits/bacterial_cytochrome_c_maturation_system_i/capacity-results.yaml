status: PASS
case_count: 151
semantics: Production compile_node/is_satisfied with independent accession-role, matched-strain,
  branch chemistry, family and reviewed-core oracle. Capacity is bounded curated-panel
  coverage; heterologous and inferred roles do not become native flux or genome completeness.
  False means unsupported panel coverage, not biological absence.
limitations:
- G20 CcmB coupling is inferred from conserved architecture and functional operon;
  no individual deletion assay is claimed.
- G20 CcmC locus is mapped but experimental versus reference residue numbering remains
  unresolved.
- KT2440 assignments are mechanistic ortholog inference; its histidine CcmE site is
  sequence/HAMAP-supported, not a direct linkage assay.
- Rhodobacter and Shewanella panels are partial; no complete native-system capacity
  is asserted.
- Disputed CcmB/CcmCD heme-translocation interpretations do not decide the pathway
  gate.
- Optional CcmI enhancement, including the Ecoli H/I fusion, is distinct from required
  canonical CcmH.
