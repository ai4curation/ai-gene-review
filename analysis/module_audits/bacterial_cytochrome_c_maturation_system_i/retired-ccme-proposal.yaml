  review:
    summary: CcmE donates its covalently bound heme for attachment to apocytochrome
      c; the heme-linkage process is the precise process in which it acts.
    action: NEW
    reason: 'Argued on its own footing, separately from the protein-heme linkage row
      (kept as ACCEPT for CcmE''s own His130 bond). CcmE does part of the work of
      the step rather than being merely required: it is the heme donor, carrying the
      cofactor as a covalent His130 adduct and transferring it to the CcmF/CcmH ligation
      site. The system I module models CcmE with this process.'
    supported_by:
    - reference_id: PMID:9712585
      supporting_text: The heme was then released and delivered to apocytochrome c.
    - reference_id: PMID:24044352
      supporting_text: CcmE was found to have the surprising property of binding heme
        covalently, via a conserved histidine residue, before transferring the heme
        to the apocytochrome.
