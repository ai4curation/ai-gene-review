- id: GO:0008961
  isObsolete: false
  name: phosphatidylglycerol-prolipoprotein diacylglyceryl transferase activity
  definition:
    text: Catalysis of the transfer of the diacylglyceryl group from phosphatidylglycerol
      to the sulfhydryl group of the prospective N-terminal cysteine residue in an
      unmodified prolipoprotein.
    xrefs:
    - dbCode: PMID
      dbId: '8051048'
    - dbCode: RHEA
      dbId: '56712'
  aspect: molecular_function
  usage: Unrestricted
- id: GO:0042500
  isObsolete: false
  name: aspartic endopeptidase activity, intramembrane cleaving
  definition:
    text: Catalysis of the hydrolysis of nonterminal peptide bonds in a polypeptide
      chain, occurring within a membrane.
    xrefs:
    - dbCode: ISBN
      dbId: 0198506732
  comment: Note that although GO generally avoids the use of localization information
    in terms, in this case an exception was made. This is because the fact that the
    cleavage occurs within the membrane is integral to its function, as it is the
    only thing that distinguishes this group from other aspartic endopeptidases.
  aspect: molecular_function
  usage: Unrestricted
- id: GO:0009003
  isObsolete: false
  name: signal peptidase activity
  definition:
    text: An endopeptidase that cleaves a hydrophobic, N-terminal signal or leader
      sequences from mitochondrial, secreted and periplasmic proteins.
    xrefs:
    - dbCode: PMID
      dbId: '12191769'
    - dbCode: PMID
      dbId: '28065271'
  comment: Note that this term was reinstated from obsolete.
  aspect: molecular_function
  usage: Unrestricted
