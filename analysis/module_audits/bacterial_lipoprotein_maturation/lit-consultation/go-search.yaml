protein lipoylation:
  numberOfHits: 2957
  results:
  - id: GO:0009249
    isObsolete: false
    name: protein lipoylation
    definition:
      text: The chemical reactions and pathways resulting in the attachment of a lipoyl
        group to a lipoyl carrier protein, either by de novo assembly on the carrier
        protein via transfer of an octanoyl group followed by sulfur insertion, or
        by ligation of exogenous lipoate.
    aspect: biological_process
  - id: GO:0016979
    isObsolete: false
    name: lipoate-protein ligase activity
    definition:
      text: 'Catalysis of the lipoylation of a protein in two steps: ATP + (R)-lipoate
        + a [lipoyl-carrier protein]-L-lysine = a [lipoyl-carrier protein]-N6-(lipoyl)lysine
        + AMP + diphosphate (overall reaction): (1) ATP + (R)-lipoate = lipoyl-AMP
        + diphosphate; (2) lipoyl-AMP + a [lipoyl-carrier protein]-L-lysine = a [lipoyl-carrier
        protein]-N6-(lipoyl)lysine + AMP.'
    aspect: molecular_function
  - id: GO:0051291
    isObsolete: false
    name: protein heterooligomerization
    definition:
      text: The process of creating protein oligomers, compounds composed of a small
        number, usually between three and ten, of component monomers that are not
        all identical. Oligomers may be formed by the polymerization of a number of
        monomers or the depolymerization of a large protein polymer.
    aspect: biological_process
  - id: GO:0051290
    isObsolete: false
    name: protein heterotetramerization
    definition:
      text: The formation of a protein heterotetramer, a macromolecular structure
        consisting of four noncovalently associated subunits, of which not all are
        identical.
    aspect: biological_process
  - id: GO:0051289
    isObsolete: false
    name: protein homotetramerization
    definition:
      text: The formation of a protein homotetramer, a macromolecular structure consisting
        of four noncovalently associated identical subunits.
    aspect: biological_process
  - id: GO:0016925
    isObsolete: false
    name: protein sumoylation
    definition:
      text: The process in which a SUMO protein (small ubiquitin-related modifier)
        is conjugated to a target protein via an isopeptide bond between the carboxy-terminus
        of SUMO with an epsilon-amino group of a lysine residue of the target protein.
    aspect: biological_process
  - id: GO:0016926
    isObsolete: false
    name: protein desumoylation
    definition:
      text: The process in which a SUMO protein (small ubiquitin-related modifier)
        is cleaved from its target protein.
    aspect: biological_process
  - id: GO:0006605
    isObsolete: false
    name: protein targeting
    definition:
      text: The process of targeting specific proteins to particular regions of the
        cell, typically membrane-bounded subcellular organelles. Usually requires
        an organelle specific protein sequence motif.
    aspect: biological_process
  - id: GO:0031648
    isObsolete: false
    name: protein destabilization
    definition:
      text: Any process that decreases the stability of a protein, making it more
        vulnerable to degradative processes or aggregation.
    aspect: biological_process
  - id: GO:0043543
    isObsolete: false
    name: protein acylation
    definition:
      text: The addition of an acyl group, any group or radical of the form RCO- where
        R is an organic group, to a protein amino acid.
    aspect: biological_process
  pageInfo:
    resultsPerPage: 10
    current: 1
    total: 296
protein N-acyltransferase:
  numberOfHits: 4008
  results:
  - id: GO:0140186
    isObsolete: false
    name: protein N-acyltransferase activity
    definition:
      text: 'Catalysis of the reaction: an acyl-CoA + L-lysyl-[protein] = N6-acyl-L-lysyl-[protein]
        + CoA + H+.'
    aspect: molecular_function
  - id: GO:0043810
    isObsolete: false
    name: ornithine-acyl [acyl carrier protein] N-acyltransferase activity
    definition:
      text: 'Catalysis of the reaction: (3R)-3-hydroxyacyl-[acyl-carrier protein]
        + L-ornithine = lyso-ornithine lipid + [acyl-carrier protein]. The enzyme,
        found in bacteria, catalyzes the first step in the biosynthesis of ornithine
        lipids.'
    aspect: molecular_function
  - id: GO:0047961
    isObsolete: false
    name: glycine N-acyltransferase activity
    definition:
      text: 'Catalysis of the reaction: acyl-CoA + glycine = CoA + N-acylglycine.'
    aspect: molecular_function
  - id: GO:7770136
    isObsolete: false
    name: sphinganine N-acyltransferase activity
    definition:
      text: 'Catalysis of the reaction: a fatty acyl-CoA + sphinganine = an N-acylsphinganine
        + CoA + H+.'
    aspect: molecular_function
  - id: GO:0050291
    isObsolete: false
    name: sphingosine N-acyltransferase activity
    definition:
      text: 'Catalysis of the reaction: acyl-CoA + sphingosine = CoA + N-acylsphingosine.'
    aspect: molecular_function
  - id: GO:0047946
    isObsolete: false
    name: L-glutamine N-acyltransferase activity
    definition:
      text: 'Catalysis of the reaction: acyl-CoA + L-glutamine = CoA + N-acyl-L-glutamine.'
    aspect: molecular_function
  - id: GO:0050640
    isObsolete: false
    name: isopenicillin-N N-acyltransferase activity
    definition:
      text: 'Catalysis of the reaction: phenylacetyl-CoA + isopenicillin N + H2O =
        CoA + penicillin G + L-2-aminoadipate.'
    aspect: molecular_function
  - id: GO:0080072
    isObsolete: false
    name: spermidine:sinapoyl CoA N-acyltransferase activity
    definition:
      text: Catalysis of the transfer of a sinapoyl group to a nitrogen atom on the
        spermidine molecule.
    aspect: molecular_function
  - id: GO:0080073
    isObsolete: false
