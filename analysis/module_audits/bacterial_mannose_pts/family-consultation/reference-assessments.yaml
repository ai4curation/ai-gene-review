  PTHR33799:
  - id: PMID:2117666
    title: Levanase operon of Bacillus subtilis includes a fructose-specific phosphotransferase system
      regulating the expression of the operon.
    full_text_unavailable: true
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Abstract explicitly reports LevDEFG fructose uptake and no mannose uptake; full experimental
        negative assay was not independently available. Used as a reported substrate boundary with curated
        UniProt and architecture, not a basis to rewrite experimental gene rows.
