  before: KEEP_AS_NON_CORE
  after: ACCEPT
  reason: Mg2+ coordination is part of the catalytic Mg-ATP/phosphorylation machinery of KdpB, rather
    than a peripheral activity (PMID:34272288; PMID:41259220). The existing binding term is appropriately
    specific for this cofactor requirement.
- review: genes/ECOLI/kdpC/kdpC-ai-review.yaml
  row_index: 2
  term: GO:0005524
  reference: GO_REF:0000104
  before: MARK_AS_OVER_ANNOTATED
  after: UNDECIDED
  reason: PMID:21711450 publisher full text reports photoaffinity labeling and ATP-dependent KdpBN/KdpCsol
    association, but direct ITC did not detect ATP binding to isolated KdpCsol through 2.8 mM. Periplasmic
    KdpC topology (PMID:28636601) contradicts the proposed contact with cytoplasmic KdpB in the intact
    pump; it does not prove that isolated KdpC cannot bind ATP. Physiologically meaningful ATP binding
    remains unresolved, so neither confident acceptance nor a universal negative is warranted.
- review: genes/ECOLI/kdpC/kdpC-ai-review.yaml
  row_index: 12
  term: GO:0008556
  reference: GO_REF:0000033
  before: MARK_AS_OVER_ANNOTATED
  after: ACCEPT
  reason: KdpC contributes structure to the functional KdpFABC pump, as supported by intact-complex topology
    and the biochemical activity of the assembled complex (PMID:28636601; PMID:34272288). Its contribution
    need not include ATP hydrolysis or formation of the ion pathway. The exact accessory mechanism remains
    unresolved; core_functions represents contribution to the complex activity.
