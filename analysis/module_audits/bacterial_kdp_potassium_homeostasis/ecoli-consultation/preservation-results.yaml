- review: genes/ECOLI/kdpD/kdpD-ai-review.yaml
  row_index: 35
  term: GO:0042803
  reference: PMID:9858704
  before: KEEP_AS_NON_CORE
  after: ACCEPT
  reason: 'Homodimerization supports the core kinase mechanism: complementary kinase-defective subunits
    recover activity, supporting trans-autophosphorylation, and independent biochemical measurements establish
    dimers (PMID:9858704). This mechanistic role is central rather than peripheral.'
- review: genes/ECOLI/kdpE/kdpE-ai-review.yaml
  row_index: 18
  term: GO:0032993
  reference: GO_REF:0000033
  before: KEEP_AS_NON_CORE
  after: ACCEPT
  reason: The KdpE-phosphorylated regulator/DNA complex is the functional assembly through which KdpE
    activates kdpFABC transcription (PMID:14534307; PMID:22291906). It is a core regulatory complex, not
    peripheral merely because binding creates it.
- review: genes/ECOLI/kdpE/kdpE-ai-review.yaml
  row_index: 20
  term: GO:0042803
  reference: PMID:16322582
  before: KEEP_AS_NON_CORE
  after: ACCEPT
  reason: Receiver-domain dimerization is part of the response-regulator activation mechanism, supported
    by the structures in PMID:16322582. It is a central supporting activity of KdpE rather than a separate
    peripheral function; isolated DNA-binding-domain monomericity in PMID:22291906 does not contradict
    receiver-domain dimerization.
- review: genes/ECOLI/kdpF/kdpF-ai-review.yaml
  row_index: 5
  term: GO:0008556
  reference: PMID:9789555
  before: MARK_AS_OVER_ANNOTATED
  after: ACCEPT
  reason: 'KdpF performs structural work in the pump: loss of the peptide strongly reduces purified detergent-solubilized
    complex activity, and purified KdpF restores activity (PMID:10608856; PMID:9789555). This supports
    contribution to the complex activity without claiming autonomous ATP hydrolysis or ion translocation.
    Near-normal activity in native membranes and growth at 0.1 mM K+ show condition-specific dispensability,
    not absence of a core stabilizing role.'
