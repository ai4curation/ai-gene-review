consultation: E. coli Kdp annotation-reviewer consultation
review_date: '2026-11-07'
scope:
  organism: Escherichia coli K-12
  taxon: NCBITaxon:83333
  members:
    kdpA: UniProtKB:P03959
    kdpB: UniProtKB:P03960
    kdpC: UniProtKB:P03961
    kdpD: UniProtKB:P21865
    kdpE: UniProtKB:P21866
    kdpF: UniProtKB:P36937
  original_ordered_rows: 160
  protected_original_files: 45
  original_GO_rows: 158
  inherited_NEW_rows: 2
  new_proposals_added: 0
  retired_rows: 0
  excluded_edits: Module, family, project, provider and publication files are outside this consultation's edits.
method:
  - Read annotation-reviewer skill and repository curation instructions.
  - Review all 160 annotation claims, existing core functions, original references and biological summaries.
  - Independently inspect current GO definitions through QuickGO; snapshot is ontology-check.yaml.
  - Read critical cached primary full texts and explicit abstract evidence; retain source-access boundaries.
  - Perform genuine configured Falcon attempts; all six failed HTTP 403 authentication. No provider report was fabricated.
  - Run PAINT-loss checks for each gene; kdpA/B/C/D/E have no lineage IRD/IKR, while kdpF lacks a source PANTHER family so losses cannot be checked.
  - Preserve ordered source fields including qualifiers and supporting entities; record review-action changes separately.
mechanistic_adjudications:
  - claim: Potassium entry through KdpA and ATP-coupled transfer/release through KdpB
    evidence:
      - reference: PMID:34272288
        access: Full cached text
        scope: E. coli KdpA Q116R/KdpB S162A and trapped catalytic states; constructs and state-trapping conditions are bounded.
      - reference: PMID:41259220
        access: Full cached text
        scope: Wild-type E. coli pump in lipid nanodiscs under turnover, alongside separate mutant ATPase/transport experiments.
      - reference: PMID:41384914
        access: Full cached Results and Discussion
        scope: Simulations, anomalous scattering and functional coupling experiments; predominantly hydrated tunnel, unresolved energetic barrier/interface intermediate.
    conclusion: Both subunits perform transport work. Old KdpA-only and continuous ion-wire models are historical, not current mechanistic assertions.
    limitations: No mutant quantitative property is reassigned to wild type. Exact interface coupling/protonation remains unresolved.
  - claim: KdpC ATP binding versus physiological catalytic chaperone
    evidence:
      - reference: PMID:21711450
        access: Publisher full text independently read; protected publication cache remains abstract-only
        url: https://febs.onlinelibrary.wiley.com/doi/10.1111/j.1742-4658.2011.08224.x
        scope: Direct isolated-KdpC ATP ITC negative through 2.8 mM; ATP-dependent KdpBN/KdpCsol association positive; photoaffinity labeling and assembled-complex kinetics do not uniquely establish the proposed physiological contact.
      - reference: PMID:28636601
        access: Full cached text
        scope: Intact E. coli KdpA Q116R complex places KdpC soluble domain in the periplasm.
    conclusion: UNDECIDED for ATP binding. The old contact geometry is disputed, but topology does not prove a universal inability to bind ATP.
  - claim: KdpC/F pump contribution and KdpF dispensability
    evidence:
      - reference: PMID:10608856
        access: Protected abstract; collaborating reviewer attempted JBC full text and received HTTP 403
        scope: E. coli kdpF deletion growth at 0.1 mM K+, nearly unchanged membrane ATPase activity, reduced detergent-purified activity and rescue by KdpF or lipids are explicit abstract observations.
      - reference: PMID:9789555
        access: Protected abstract
        scope: Purified complex transport plus KdpF-dependent stabilization; no independent KdpF ATPase is established.
      - reference: PMID:28636601
        access: Full cached text
        scope: Direct structural membership and topology.
      - reference: PMID:34272288
        access: Full cached text
        scope: Authors propose stabilization by accessory subunits; exact KdpC mechanism remains unresolved.
    conclusion: ACCEPT existing GO0008556 contribution claims for C/F and KdpF GO0071805; core representations record contributes_to activity, not autonomous catalysis.
    limitations: KdpF native dispensability is condition-specific. KdpC structural contribution is positive evidence distinct from necessity alone; a gate or folding mechanism is not asserted.
  - claim: KdpD regulatory activities and whole-protein location
    evidence:
      - reference: PMID:38622146
        access: Full cached text
        scope: E. coli KdpD N-terminal atypical serine kinase directly inhibits KdpB; C-terminal histidine kinase regulates KdpE. Short Deinococcus c-di-AMP regulation is not transferred to E. coli.
      - reference: PMID:9858704
        access: Protected abstract
        scope: Complementing kinase-defective subunits plus oligomer measurements support a functional homodimer and trans-autophosphorylation.
      - reference: PMID:7499326
        access: Protected abstract
        scope: Four membrane-spanning regions and cytoplasmic N/C termini directly described.
      - reference: PMID:1532388
        access: Protected abstract
        scope: Inner-membrane fractionation of KdpD and soluble cytoplasmic KdpE directly described.
      - reference: PMID:9099740
        access: Protected abstract
        scope: Purified reconstituted KdpD transfers phosphate to KdpE and mediates KdpE dephosphorylation.
    conclusion: Refine generic phosphotransferase to both known kinases; retain both inherited NEW proposals; accept mechanistically central dimerization. Cytoplasm REMOVE remains justified because GO0005737 excludes plasma membrane.
    limitations: Exact ARBA propagation mechanism was not reconstructed. Cytoplasm-facing domains do not locate the entire integral protein in soluble cytoplasm.
  - claim: KdpE transcription activation and functional assemblies
    evidence:
      - reference: PMID:22291906
        access: Full cached text
        scope: DNA-binding domain recognizes the promoter, but full-length receiver-containing protein is needed for transcriptional activation.
      - reference: PMID:16322582
        access: Full cached structural Results
        scope: Receiver-domain structures support dimerization; this is distinct from isolated DNA-binding-domain monomericity.
      - reference: PMID:14534307
        access: Protected abstract
        scope: KdpD N-terminal region stabilizes the KdpE-phosphorylated regulator/DNA assembly.
    conclusion: Core uses existing GO0001216 transcription-activator activity. Functional DNA complex and receiver-domain dimerization are central, not peripheral merely because they support another activity.
other_decisions:
  - KdpB Mg binding is accepted as part of the catalytic Mg-ATP machinery, supported by contemporary structures rather than generic family expectation alone.
  - Generic protein-binding removals retain real interactions and functional complex context; no new molecular function is manufactured from interaction alone.
  - Existing antiporter-complex corrections remain justified. A proposed intraprotein proton wire is not evidence of transmembrane potassium:proton antiport.
  - Remove two exact duplicate KdpB UniProt reference objects while preserving every distinct finding and all source files.
validation_limits:
  - Schema, term, quote, action consistency, render and preservation checks cannot establish biological truth.
  - The manual evidence ledger supplies scientific adjudication, while the preservation checker proves source and ordered-payload integrity.
  - Abstract-only sources are explicitly bounded; no unseen result or wrong-gene allegation is inferred from an abstract's omissions.
