          label: monoatomic cation transmembrane transport
        evidence_type: IDA
        original_reference_id: PMID:9789555
        qualifier: acts_upstream_of_or_within
        review:
          summary: Electrogenic cation transport by the purified Kdp complex; the cation is K+.
          action: MODIFY
          reason: Monoatomic cation transmembrane transport is correct but general; the transported cation
            is K+, so the is_a child GO:0071805 potassium ion transmembrane transport (annotated from
            the same paper) should be used.
          proposed_replacement_terms:
          - *id027
          supported_by:
          - reference_id: PMID:9789555
            supporting_text: These data clearly indicate that the Kdp-ATPase transports K+ in an electrogenic
              manner.
      - term:
          id: GO:1903103
          label: potassium:proton antiporter complex
        evidence_type: IPI
        original_reference_id: PMID:28636601
        qualifier: part_of
        review:
          summary: 'Complex-membership claim mapped to the wrong complex term: GO:1903103 is a potassium:proton
            antiporter complex, whereas KdpFABC is a P-type K+-transporting ATPase.'
          action: MODIFY
          reason: The full text of PMID:28636601 describes ATP-coupled K+ import by a P-type ATPase complex
            and contains no antiport claim. KdpF membership of the complex is correct; GO:0031004 potassium
            ion-transporting ATPase complex, whose definition names KdpF, is the right term (already annotated
            by IDA).
          proposed_replacement_terms:
          - &id029
            id: GO:0031004
            label: potassium ion-transporting ATPase complex
          supported_by:
          - &id028
            reference_id: PMID:28636601
            supporting_text: This membrane complex, called KdpFABC, has one channel-like subunit (KdpA)
              belonging to the superfamily of potassium transporters and another pump-like subunit (KdpB)
              belonging to the superfamily of P-type ATPases.
          - *id023
          source_defects:
          - defect_type: WRONG_TERM
            resource: INTACT
            requested_change: REPOINT
            asserted_value: GO:1903103
            corrected_value: GO:0031004
            corrected_label: potassium ion-transporting ATPase complex
            confidence: CONFIRMED
            explanation: KdpFABC is a P-type ATPase that couples ATP hydrolysis to K+ uptake; no K+/H+
              antiport is described. GO:1903103 is defined as a complex capable of potassium:proton antiporter
              activity (GO:0015386). GO:0031004 is defined as the ATP-driven K+ uptake complex and names
              the E. coli KdpFABC subunits explicitly.
            supported_by:
            - *id028
      references:
      - id: GO_REF:0000002
        title: Gene Ontology annotation through association of InterPro records with GO terms
        findings:
        - statement: InterPro2GO mapping of IPR011726 (KdpF) to the pump activity GO:0008556.
      - id: GO_REF:0000120
        title: Combined Automated Annotation using Multiple IEA Methods
        findings:
        - statement: Combined IEA mapping of plasma membrane location.
      - id: PMID:27510400
        title: 'Membranome: a database for proteome-wide analysis of single-pass membrane proteins.'
        findings:
        - statement: Membranome catalogues single-pass (bitopic) membrane proteins, including those of
            E. coli.
          supporting_text: The Membranome database was developed to assist analysis and computational
            modeling of single-pass (bitopic) transmembrane (TM) proteins
      - id: PMID:28636601
        title: Crystal structure of the potassium-importing KdpFABC membrane complex.
        findings:
        - statement: KdpF is a single transmembrane helix in the KdpFABC structure.
          supporting_text: KdpF is a single transmembrane helix with a position that is distinct from
            transmembrane helices or accessory elements in other P-type ATPases
        - statement: KdpF appears to play a structural role in stabilising the complex.
          supporting_text: suggesting that it plays a structural role in stabilizing the complex
      - id: PMID:30478378
        title: Cryo-EM structures of KdpFABC suggest a K(+) transport mechanism via two inter-subunit
          half-channels.
        findings:
        - statement: Cryo-EM structures of the full KdpFABC complex were determined from membrane-solubilised
            protein.
          supporting_text: After cell fractionation, membrane solubilization
      - id: PMID:9789555
        title: Structure and function of the Kdp-ATPase of Escherichia coli.
        findings:
        - statement: KdpF stabilises the transport complex; it is not essential in vivo.
          supporting_text: Although KdpF is not essential in vivo, the purified complex lacking KdpF exhibits
            hardly any K(+)-stimulated ATPase activity.
        - statement: The purified Kdp-ATPase transports K+ electrogenically.
          supporting_text: These data clearly indicate that the Kdp-ATPase transports K+ in an electrogenic
            manner.
      - id: PMID:10608856
        title: The KdpF subunit is part of the K(+)-translocating Kdp complex of Escherichia coli and
          is responsible for stabilization of the complex in vitro.
        findings:
        - statement: KdpF co-purifies with the Kdp complex.
          supporting_text: it could be demonstrated that KdpF remains associated with the purified complex
        - statement: KdpF is dispensable for growth on low K+.
          supporting_text: KdpF is not essential for growth on low K(+) (0.1 mM) medium
        - statement: Membrane-bound ATPase activity is unaffected by loss of KdpF.
          supporting_text: In the absence of KdpF, the ATPase activity of the membrane-bound Kdp complex
            was almost indistinguishable from that of the wild type.
        - statement: KdpF is a stabilising element of the complex in vitro.
          supporting_text: Although KdpF is not essential for the function of the Kdp complex in vivo,
            it is part of the complex and functions as a stabilizing element in vitro.
      - id: PMID:34272288
        title: Structural basis for potassium transport in prokaryotes by KdpFABC.
        findings:
        - statement: KdpF is a single TM helix at the KdpA-KdpB interface, possibly stabilising the complex.
          supporting_text: KdpF consists of a single transmembrane helix at the interface of KdpA and
            KdpB, possibly serving to stabilize the complex
        - statement: KdpF remains static during the reaction cycle.
          supporting_text: whereas KdpA, KdpC, and KdpF remain static
      - id: file:ECOLI/kdpF/kdpF-uniprot.txt
        title: UniProtKB P36937 (KDPF_ECOLI) record
        findings:
        - statement: KdpF may be involved in stabilisation of the complex.
          record_section:
          - CC:FUNCTION
          supporting_text: This subunit may be involved in stabilization of the complex
        - statement: kdpF inactivation still gives a functional complex in vivo.
          record_section:
          - CC:DISRUPTION PHENOTYPE
          supporting_text: Inactivation of kdpF still leads to a functional KdpABC complex in vivo.
        - statement: KdpF family member.
          record_section:
          - CC:SIMILARITY
          supporting_text: Belongs to the KdpF family.
      core_functions:
      - description: 'Structural subunit of the KdpFABC P-type potassium pump: a single transmembrane
          helix at the KdpA-KdpB interface that stabilises the complex (essential for activity of the
          isolated complex, dispensable in vivo). No GO molecular function term is assigned because KdpF
          has no catalytic or transport activity of its own.'
        in_complex: *id029
        locations:
        - id: GO:0005886
          label: plasma membrane
        supported_by:
        - *id024
        - *id030
      suggested_questions:
      - question: Does KdpF contribute to KdpFABC stability or assembly in vivo under stress conditions
          (e.g. low K+ combined with membrane perturbation), given that lipids can substitute for it in
          vitro?
      suggested_experiments:
      - description: Compare KdpFABC abundance, turnover and K+ uptake kinetics in wild-type and kdpF
          in-frame deletion strains under K+ limitation and membrane stress.
        experiment_type: genetic deletion with membrane-complex stability assay
