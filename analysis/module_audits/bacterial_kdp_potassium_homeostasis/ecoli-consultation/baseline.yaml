      description: KdpC is the small accessory subunit of KdpFABC, the inducible high-affinity ATP-driven
        potassium uptake pump of the bacterial inner membrane, and is required together with KdpA and
        KdpB for a functional system. KdpC has a single transmembrane helix and a soluble domain of novel
        fold; crystal and cryo-EM structures place this domain on the periplasmic side, where it is held
        against periplasmic loops of the K+-selective subunit KdpA near the entrance of its selectivity
        filter, and KdpC (with KdpF) stabilizes the KdpA-KdpB partnership. KdpC neither hydrolyzes ATP
        (a KdpB function) nor forms the K+ pathway (a KdpA function). Earlier biochemical work proposed
        that KdpC acts as a "catalytic chaperone" that binds ATP and raises the nucleotide affinity of
        KdpB, but the periplasmic placement of its soluble domain in the structures is difficult to reconcile
        with direct contact with the cytoplasmic nucleotide-binding domain of KdpB.
