      taxon:
        id: NCBITaxon:83333
        label: Escherichia coli K-12
      description: KdpD is the inner-membrane sensor of the E. coli KdpD/KdpE two-component system that
        controls the high-affinity K+ uptake pump KdpFABC. The 894-residue homodimer has a large cytoplasmic
        N-terminal input region (containing a Walker A/B atypical kinase domain and a Usp domain), four
        transmembrane helices, and a cytoplasmic C-terminal transmitter (GAF, DHp and HATPase_c domains).
        Under K+ limitation or salt stress KdpD autophosphorylates His673 in trans and transfers the phosphoryl
        group to KdpE, which then activates kdpFABC transcription; it also dephosphorylates KdpE~P, and
        the kinase/phosphatase balance responds to both extracellular and intracellular K+. Its activity
        is modulated by UspC (scaffold under salt stress) and dephosphorylated IIA(Ntr). At high K+ the
        N-terminal atypical serine kinase domain phosphorylates KdpB Ser162, inhibiting the KdpFABC pump
        post-translationally.
