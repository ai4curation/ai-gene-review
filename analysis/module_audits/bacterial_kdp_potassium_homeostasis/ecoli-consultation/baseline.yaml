        - UniProtKB:P03959
        review:
          summary: Phylogenetic inference of the KdpFABC ATP-driven K+ import activity for the KdpA family.
          action: ACCEPT
          reason: The activity (ATP + H2O + K+(out) = ADP + Pi + K+(in)) is carried out by the KdpFABC
            complex, in which KdpA forms the K+ selectivity filter and the translocation pathway while
            KdpB hydrolyzes ATP. KdpA is an essential, substrate-handling part of this activity, so the
            term is appropriate; strictly the relationship is contributes_to, which is how it is captured
            in core_functions.
          supported_by:
          - reference_id: PMID:7896809
            supporting_text: Energy coupling in Kdp, mediated by the KdpB subunit, is performed by a different
              subunit from the one that mediates transport.
