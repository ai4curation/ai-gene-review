        label: Escherichia coli K-12
      description: KdpE is the cytoplasmic OmpR/PhoB-family response regulator of the E. coli KdpD/KdpE
        two-component system. It has an N-terminal receiver domain phosphorylated on Asp52 by the sensor
        kinase KdpD (and by PhoR in the absence of KdpD) and a C-terminal winged helix-turn-helix DNA-binding
        domain. Phosphorylated KdpE dimerizes via the alpha4-beta5-alpha5 face of its receiver domain
        and binds two AT-rich 6-bp half-sites upstream of the kdpFABC promoter, activating transcription
        of the high-affinity K+ uptake pump KdpFABC under K+ limitation or salt stress. KdpD is the phosphatase
        that returns KdpE~P to the inactive state.
