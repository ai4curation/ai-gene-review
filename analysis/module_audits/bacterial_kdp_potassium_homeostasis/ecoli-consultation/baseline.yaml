        label: Escherichia coli K-12
      description: 'KdpA is the potassium-binding and potassium-translocating subunit of KdpFABC, the
        inducible high-affinity ATP-driven potassium uptake pump of the bacterial inner membrane, which
        is expressed when external K+ falls to micromolar levels. KdpA is a ten-transmembrane-helix member
        of the superfamily of potassium transporters (SKT), built from four M1PM2 repeats around a KcsA-like
        selectivity filter that binds dehydrated K+ and confers the high affinity and K+/Rb+ discrimination
        of the system. KdpA itself has no ATPase activity: energy is supplied by the P-type ATPase subunit
        KdpB, and structures show an intramembrane tunnel that carries K+ from the KdpA selectivity filter
        to the canonical cation site of KdpB, with the accessory single-span subunits KdpC and KdpF stabilizing
        the complex.'
