        label: Escherichia coli K-12
      description: KdpF is a 29-residue, N-formylated, single-pass transmembrane peptide encoded as the
        first gene of the kdpFABC operon and a subunit of the KdpFABC high-affinity ATP-driven potassium
        uptake complex of the E. coli inner membrane. Structures show KdpF as one transmembrane helix
        at the KdpA-KdpB interface that remains static during the catalytic cycle. KdpF is not required
        for growth on low potassium or for ATPase activity of the membrane-bound complex, but it is required
        for activity of the purified detergent-solubilised complex, where it can be replaced by added
        lipids; it therefore acts as a structural stabilising element of the pump rather than a catalytic
        subunit.
