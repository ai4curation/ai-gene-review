      description: 'KdpB is the catalytic P-type ATPase subunit (type IA, EC 7.2.2.6) of KdpFABC, the
        high-affinity, ATP-driven potassium uptake system of the E. coli inner membrane that is expressed
        under K+ limitation under control of the KdpD/KdpE two-component system. KdpB binds Mg-ATP in
        its cytoplasmic N and P domains and forms a phosphoenzyme on Asp307 of the DKTGT motif, cycling
        through E1/E2 conformations while KdpA, KdpC and KdpF remain static. ATP hydrolysis by KdpB is
        coupled to K+ uptake: K+ is selected by the channel-like KdpA subunit, passes through an intramembrane
        tunnel to binding sites in the KdpB transmembrane domain, and is released by KdpB to the cytoplasm.
        KdpC acts as a catalytic chaperone at the KdpB nucleotide-binding loop. KdpB activity is inhibited
        by phosphorylation of Ser162 in the TGES motif of the A domain.'
