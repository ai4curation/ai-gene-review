source: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/
consulted_on: '2026-11-07'
terms:
- id: GO:0005737
  label: cytoplasm
  definition: The contents of a cell excluding the plasma membrane and nucleus, but including other subcellular
    structures.
  is_obsolete: false
- id: GO:0005886
  label: plasma membrane
  definition: The membrane surrounding a cell that separates the cell from its external environment. It
    consists of a phospholipid bilayer and associated proteins.
  is_obsolete: false
- id: GO:0005829
  label: cytosol
  definition: The part of the cytoplasm that does not contain organelles but which does contain other
    particulate matter, such as protein complexes.
  is_obsolete: false
- id: GO:0004721
  label: phosphoprotein phosphatase activity
  definition: 'Catalysis of the reaction: a phosphoprotein + H2O = a protein + phosphate. Together with
    protein kinases, these enzymes control the state of phosphorylation of cellular proteins and thereby
    provide an important mechanism for regulating cellular activity.'
  is_obsolete: false
- id: GO:0016772
  label: transferase activity, transferring phosphorus-containing groups
  definition: Catalysis of the transfer of a phosphorus-containing group from one compound (donor) to
    another (acceptor).
  is_obsolete: false
- id: GO:1903103
  label: potassium:proton antiporter complex
  definition: A protein complex which is capable of potassium:proton antiporter activity.
  is_obsolete: false
- id: GO:0000155
  label: phosphorelay sensor kinase activity
  definition: Catalysis of the phosphorylation of a histidine residue in response to detection of an extracellular
    signal such as a chemical ligand or change in environment, to initiate a change in cell state or activity.
    The two-component sensor is a histidine kinase that autophosphorylates a histidine residue in its
    active site. The phosphate is then transferred to an aspartate residue in a downstream response regulator,
    to trigger a response.
  is_obsolete: false
- id: GO:0106310
  label: protein serine kinase activity
  definition: 'Catalysis of the reactions: ATP + protein serine = ADP + protein serine phosphate.'
  is_obsolete: false
- id: GO:0008556
  label: P-type potassium transmembrane transporter activity
  definition: 'Enables the transfer of a solute or solutes from one side of a membrane to the other according
    to the reaction: ATP + H2O + K+(out) = ADP + phosphate + K+(in).'
  is_obsolete: false
- id: GO:1901017
  label: negative regulation of potassium ion transmembrane transporter activity
  definition: Any process that stops, prevents or reduces the frequency, rate or extent of potassium ion
    transmembrane transporter activity.
  is_obsolete: false
- id: GO:0001216
  label: DNA-binding transcription activator activity
  definition: A DNA-binding transcription factor activity that activates or increases transcription of
    specific gene sets.
  is_obsolete: false
- id: GO:0000987
  label: cis-regulatory region sequence-specific DNA binding
  definition: Binding to a specific upstream regulatory DNA sequence (transcription factor recognition
    sequence or binding site, located in cis relative to the transcription start site (i.e., on the same
    strand of DNA) of a gene transcribed by some RNA polymerase. Cis-regulatory sites are often referred
    to as a sequence motifs, enhancers, or silencers.
  is_obsolete: false
- id: GO:0031004
  label: potassium ion-transporting ATPase complex
  definition: 'Protein complex that carries out the reaction: ATP + H2O + K+(out) = ADP + phosphate +
    K+(in). It is a high affinity potassium uptake system. The E. coli complex consists of 4 proteins:
    KdpA is the potassium ion translocase, KdpB is the ATPase, and KdpC and KdpF seem to be involved in
    assembly and stabilization of the complex.'
  is_obsolete: false
