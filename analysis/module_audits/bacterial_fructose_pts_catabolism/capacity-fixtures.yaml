limits:
- Passing the matched panel means coverage of the modeled functions under the curated evidence assumptions,
  not measured native flux in every strain.
- 'Deinococcus full relay is not asserted: restored KDR_B0075 has no established UniProt mapping/PEP-uptake
  assay.'
- Azospirillum counterpart locus is not interchangeable by family membership.
- Cross-panel mixtures have no asserted matched-system evidence; failure is not a claim that heterologous
  complementation is impossible.
- Free-text architecture is enforced by this explicit audit oracle, not by production compiler feature
  extraction.
- TagK secondary 1-PFK activity and archaeal 1-PFK activity may satisfy a component predicate without
  establishing a matched fused bacterial pathway.
