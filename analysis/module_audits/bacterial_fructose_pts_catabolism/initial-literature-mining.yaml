status: IN_PROGRESS
references:
- id: PMID:24847021
  title: 'The bacterial phosphoenolpyruvate:carbohydrate phosphotransferase system: regulation by protein
    phosphorylation and phosphorylation-dependent protein-protein interactions.'
  publication_type: REVIEW
  cache_full_text: true
  findings:
  - statement: General PTS relay can also serve regulation without a transporter. Require transport machinery
      and substrate evidence rather than accepting soluble PTS hits alone.
    supporting_text: These PTSs are therefore probably not involved in carbohydrate transport but carry
      out only regulatory functions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached review inspected for general relay chemistry, fusion variation and regulatory-only
      systems; archaeal absence claim of the older survey is superseded.
- id: PMID:16339738
  title: Comparative genomic analyses of the bacterial phosphotransferase system.
  publication_type: REVIEW
  cache_full_text: false
  findings:
  - statement: Historical genomic survey separates soluble PTS homologs from complete transport systems.
      Its sampling is historical; use the later review for archaeal distribution.
    supporting_text: 'These soluble homologues

      presumably function in regulation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract and comparative survey inspected; not a contemporary exhaustive census or a
      fructose-specific assay.
- id: PMID:18485189
  title: Unraveling the evolutionary history of the phosphoryl-transfer chain of the phosphoenolpyruvate:phosphotransferase
    system through phylogenetic analyses and genome context.
  publication_type: PRIMARY_RESEARCH
  cache_full_text: true
  findings:
  - statement: FruB architectural variants and horizontal transfer prevent equating family membership
      or bacterial taxonomy with a single relay architecture.
    supporting_text: The prototypic FruB proteins (usually termed FPr) of Enterobacteriaceae and Vibrionaceae
      are composed of a IIAFru domain separated by an intervening domain from a C-terminal HPr domain
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary comparative analysis inspected, especially fused-domain section.
      Its ancestral reconstructions are hypotheses, not functional assays.
- id: PMID:18296519
  title: Evidence of in vivo cross talk between the nitrogen-related and fructose-related branches of
    the carbohydrate phosphotransferase system of Pseudomonas putida.
  publication_type: PRIMARY_RESEARCH
  cache_full_text: true
  findings:
  - statement: Fructose-dependent cross-talk to PtsN does not establish that PtsN can replace FruB for
      transport.
    supporting_text: FruB mutants cannot transport fructose through the two-domain (EIIB Fru and EIIC
      Fru ) FruA permease
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached paper inspected for cross-talk and the stated asymmetric substitution boundary.
      Do not call its PtsN phosphorylation measurement a direct assay of each internal transfer.
- id: PMID:27933319
  title: A Metabolic Widget Adjusts the Phosphoenolpyruvate-Dependent Fructose Influx in Pseudomonas putida.
  publication_type: PRIMARY_RESEARCH
  cache_full_text: true
  findings:
  - statement: The KT2440 transport system supplies a fused soluble relay and a separate membrane transport/phosphorylation
      protein.
    supporting_text: 'This Fru-only transport system involves two unique polyproteins: EI/HPr/EIIAFru
      (cytoplasmic, encoded by fruB) and EIIBC (membrane bound, encoded by fruA).'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached paper inspected for pathway organization and metabolite regulation; family-domain
      multiplicity is checked separately against exact proteins.
- id: PMID:39817736
  title: Identification and functional characterization of a fructose-inducible phosphotransferase system
    in Azospirillum brasilense Sp7.
  publication_type: PRIMARY_RESEARCH
  cache_full_text: true
  findings:
  - statement: The experimentally prioritized Sp7 locus has three fructose-induced components; the two
      loci must not be treated as interchangeable.
    supporting_text: FruA (AMK58_25875), FruK (AMK58_25880), and FruB (AMK58_25885).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached primary text inspected, including perturbation and complementation. Transport
      growth phenotype is direct for the locus but not an isolated assay of every FruB or FruK reaction.
- id: PMID:21822900
  title: ATP-dependent fructose uptake system in Deinococcus radiodurans.
  publication_type: PRIMARY_RESEARCH
  cache_full_text: false
  findings:
  - statement: In the tested Deinococcus material, fructose phosphorylation uses ATP rather than PEP;
      reciprocal mixed-fraction assays follow the cytoplasmic partner.
    supporting_text: 'fructose

      phosphorylation required ATP, not PEP, as the phosphate donor.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract inspected. Do not extrapolate the reported fruB pseudogene to all strains
      or to the complete 2024 resequenced ORF.
- id: PMID:38962131
  title: 'Comparative genomics of Deinococcus radiodurans: unveiling genetic discrepancies between ATCC
    13939K and BAA-816 strains.'
  publication_type: PRIMARY_RESEARCH
  cache_full_text: true
  findings:
  - statement: Resequencing identifies complete FruB in ATCC13939K, requiring a strain-qualified reassessment
      of older Deinococcus pseudogene statements.
    supporting_text: a complete coding sequence for FruB (KDR_B0075) was identified in ATCC-13939K
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text inspected for reconstructed gene and intact operon; gene restoration
      alone is not a direct PEP-dependent transport assay.
