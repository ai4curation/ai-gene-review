- gene: metK
  index: 0
  term:
    id: GO:0000287
    label: magnesium ion binding
  action: KEEP_AS_NON_CORE
  reason: UniProt records two divalent ions per subunit for the methionine adenosyltransferase reaction.
    Magnesium binding supports catalysis, while GO:0004478 captures the defining molecular function.
- gene: metK
  index: 1
  term:
    id: GO:0004478
    label: methionine adenosyltransferase activity
  action: ACCEPT
