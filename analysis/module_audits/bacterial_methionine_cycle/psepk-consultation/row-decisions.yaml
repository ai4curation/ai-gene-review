- gene: metH
  index: 9
  term:
    id: GO:0050667
    label: homocysteine metabolic process
  action: MODIFY
  reason: The current methionine-cycle term is a descendant of homocysteine metabolism and explicitly
    includes homocysteine remethylation. The curated MetH reaction performs this chemical step, independently
    of whether a particular homocysteine molecule arose de novo or by SAH turnover.
- gene: metH
  index: 10
  term:
    id: GO:0071267
    label: L-methionine salvage
  action: ACCEPT
  reason: GO:0071267 covers generation of L-methionine from its derivatives, not only the methylthioadenosine
    salvage pathway; GO:0008705 is explicitly part_of this process. The same MetH chemistry can complete
    de novo biosynthesis or regenerate methionine after methyl-group utilization. A UniPathway de novo
    label does not exclude the latter role.
- gene: metE
  index: 0
  term:
    id: GO:0003871
    label: 5-methyltetrahydropteroyltriglutamate-homocysteine S-methyltransferase activity
  action: MODIFY
  reason: 'GO:0003871 requires 5-methyltetrahydropteroyltriglutamate. PP_2698 is closely related to characterized
    MesD and linked to MesX, whereas it lacks the canonical N-terminal folate-binding barrel. PMID33534785
    demonstrates folate-independent MesD/MesX complementation in a comparator. Generalize to S-methyltransferase
    activity: the homocysteine sulfur acceptor is supported, but the methyl donor and native target activity
    are not directly measured. This corrects substrate specificity without denying the conserved methyltransferase
    role.'
