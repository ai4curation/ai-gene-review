    exactly matching GO:0004478.
- gene: metK
  index: 2
  term:
    id: GO:0005524
    label: ATP binding
  action: KEEP_AS_NON_CORE
  reason: ATP is a substrate in RHEA:21080 and multiple ATP-contacting residues are annotated in UniProt.
    The specific catalytic activity GO:0004478 remains the core molecular function.
- gene: metK
  index: 3
  term:
    id: GO:0005737
    label: cytoplasm
  action: MODIFY
  reason: Curated HAMAP cytoplasmic localization and the soluble AdoMet-synthase architecture support
