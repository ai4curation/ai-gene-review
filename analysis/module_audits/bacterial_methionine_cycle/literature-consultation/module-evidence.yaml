- id: PMID:17603473
  title: Structure-based activity prediction for an enzyme of unknown function.
  publication_type: PRIMARY_RESEARCH
  full_text_unavailable: false
  findings:
  - statement: T. maritima MSB8 TM_0936/Q9X034 deaminates SAH to SIH. Purified-protein assays and product
      identity support this reaction, and the exact 2PLM polymer matches current Q9X034.
  - statement: The matched T. maritima TM_0172/O51933 enzyme releases homocysteine from SIH or SAH approximately
      equally, supporting two biochemically available entry substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete author-hosted Nature PDF, main results and appended methods read
