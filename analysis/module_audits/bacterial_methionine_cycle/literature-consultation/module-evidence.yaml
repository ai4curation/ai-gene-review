    review_notes: Complete XML; model discrepancy and B12-dependent methionine-pathway results read
- id: PMID:18953685
  title: Structure-function relationships in methionine adenosyltransferases.
  publication_type: REVIEW
  full_text_unavailable: true
  findings:
  - statement: The indexed catalytic section supports coupling of methionine adenosylation to bound tripolyphosphate
      hydrolysis; mammalian isoenzyme regulation is not a universal bacterial mechanism.
  reference_review:
    relevance: HIGH
