- id: PMID:32034217
  title: Identification and characterization of a bacterial core methionine synthase.
  publication_type: PRIMARY_RESEARCH
  full_text_unavailable: false
  findings:
  - statement: Purified D. mccartyi CBDB1 cbdbA481/A0A916P3S8 uses methylcobalamin to methylate homocysteine
      and fails the tested folate-donor reaction. The physiological corrinoid-protein donor remains unestablished.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete XML; results, donor controls, physiological caveat and construct identity read
- id: PMID:33339190
  title: 'S-adenosyl-l-homocysteine Hydrolase: A Structural Perspective on the Enzyme with Two Rossmann-Fold
    Domains.'
  publication_type: REVIEW
  full_text_unavailable: false
  findings:
  - statement: SAH hydrolase reversibly produces adenosine and homocysteine; net hydrolytic flux depends
      on product clearance, while bound NAD participates in internal redox chemistry.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review read, emphasizing reversible chemistry, product removal, NAD-dependent internal
      redox and bacterial/archaeal structural distinctions; descriptions of common routes are not an exhaustive
      bacterial inventory.
- id: PMID:33468593
  title: De Novo Cobalamin Biosynthesis, Transport, and Assimilation and Cobalamin-Mediated Regulation
    of Methionine Biosynthesis in Mycobacterium smegmatis.
  publication_type: PRIMARY_RESEARCH
  full_text_unavailable: false
  findings:
  - statement: In native M. smegmatis mc²155, endogenous cobalamin suppresses MetE and conditions MetH
      essentiality; B12-deficient backgrounds permit a different route. Neither enzyme is universally
      essential.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete XML; native M. smegmatis mc²155 results and strain/construct methods read
- id: PMID:33534785
  title: Four families of folate-independent methionine synthases.
  publication_type: PRIMARY_RESEARCH
  full_text_unavailable: false
  findings:
  - statement: MesD and MesX form a folate- and cobalamin-independent methionine-synthesis alternative
      in the characterized S. koreensis DSMZ15582 system. Oxygen is required in the tested complementation
      context and the physiological methyl donor remains unidentified.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete XML; MesD results, comparative analysis, assay identity and methods read
- id: PMID:36891755
  title: 'S-Adenosylmethionine: more than just a methyl donor.'
  publication_type: REVIEW
  full_text_unavailable: false
  findings:
  - statement: 'Require the actual SAM-to-SAH methyl-transfer reaction: SAM binding, a methyltransferase
      fold, radical SAM cleavage, or other alkyl transfer does not establish this module role.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete XML acquired; abstract, introduction, and chemistry/boundary sections read
- id: PMID:42509803
  title: 'S-Adenosyl-L-Homocysteine Hydrolase (SAHH): Structure, Function, and Applications.'
  publication_type: REVIEW
  full_text_unavailable: false
  findings:
  - statement: The SAH-hydrolase review summarizes internal NAD redox cycling and variable substrate recognition.
      Its generalization of pronounced SIH preference to Thermotoga must be reconciled with the target's
      approximately equal SAH/SIH activity in primary17603473.
  - statement: The review includes Thermotoga in its generalization of marked preference for hypoxanthine-containing
      SIH substrates.
    finding_review:
      finding_status: DISPUTED
      review_notes: The target-specific primary reports approximately equal activity on SIH and SAH; this
        review generalization cannot establish loss of SAH activity. The general NAD mechanism is retained.
      supported_by:
      - reference_id: PMID:17603473
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full 2026 review read. Mechanistic NAD discussion is usable; the broad Thermotoga SIH-preference/evolutionary
      synthesis is not a target assay and is not used to deny its directly measured SAH hydrolysis.
- id: PMID:42570567
  title: Coordinated use of three homocysteine methyltransferases supports l-methionine biosynthesis and
    environmental adaptation among plant-associated bacteria.
  publication_type: PRIMARY_RESEARCH
  full_text_unavailable: true
  findings:
  - statement: X. campestris pv. campestris XC1 uses MesD, S-methylmethionine-dependent MmuM, and split
      MetHaHb under different donor/cofactor contexts. Thus the represented alternatives must not be described
      as exhaustive for Bacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract/metadata only; electronic publication 2026-08-07, December issue is not a future-unpublished
      study
