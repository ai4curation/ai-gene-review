- gene: pfs
  index: 18
  term:
    id: GO:0046124
    label: purine deoxyribonucleoside catabolic process
  action: UNDECIDED
  reason: The direct Pfs substrate in PMID15911379 is 5'-deoxyadenosine. GO:0046124 says deoxyribose,
    but its nucleoside ancestor specifies 2-deoxyribofuranose and its deoxyadenosine child explicitly
    denotes the DNA nucleoside 2-deoxyribosyladenine. Whether the broader term is intended to include
    the 5-prime-deoxy substrate is unresolved; no target 2-prime-deoxyadenosine activity is established
    here. The former reason that a true secondary catabolic role is overannotation is withdrawn; measured
    byproduct clearance remains supported.
