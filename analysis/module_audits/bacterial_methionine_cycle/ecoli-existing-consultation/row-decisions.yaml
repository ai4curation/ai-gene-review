- gene: luxS
  index: 5
  term:
    id: GO:0009372
    label: quorum sensing
  action: ACCEPT
  reason: LuxS performs signal-production chemistry rather than perception. PMID11514505 used K-12 W3110
    and its luxS::Tc derivative MDAI2 with conditioned media differing in AI-2 bioactivity; together with
    the direct precursor-forming reaction, this supports the existing producer-side quorum role. Conditioned
    media are not purified AI-2, and a metabolic mutant phenotype alone would not establish signaling
    or justify transfer to every LuxS-containing species.
