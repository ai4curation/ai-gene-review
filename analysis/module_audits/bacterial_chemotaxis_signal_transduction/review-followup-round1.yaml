findings:
  '1': FliY reasons and quotes now concern FliY; CheC-specific stimulation support removed.
  '2': FliM structural activity and core use full primary PMID30455280 physical-contact/assembly evidence,
    qualified for 3610/PY79 to 168 transfer. The FliY C-ring module step also mines this evidence; module
    references increase to 37.
  '3': CheW adaptor support uses the coupling/redundancy result; the CheV phosphorylation quote is removed.
  '4': CheC positive chemotaxis uses the full PMID23226535 Fig 5B proline-capillary behavior experiment.
  '5': Current QuickGO is_a API confirms GO0000155 inherits molecular sensor activity. Four CheA reviews
    retain GO0004673 kinase chemistry, MODIFY the sensor term, and preserve signaling context. Suspected
    source-defect/term-scoping annotations are restored; PTHR43395 distinguishes term scope from phylogenetic
    placement. Both module selectors agree.
  '6': GO0004673 is again the retained CheA activity, so all cross-references and broad-transferase refinements
    are consistent.
  '7': PomA/PomB ontology-definition maintenance moved from knowledge_gaps to suggested_questions and
    notes.
  '8': Three CheY acetylation rows use MARK_AS_OVER_ANNOTATED with separate selfactivity and chemical-substrate
    reasoning. The 2010 substrate experiment is not independent participation evidence; unknown native
    relevance and inaccessible 2006 full text remain explicit.
  '9': Generic summaries replaced with claim-specific statements across all affected reviews; all other
    summary-only panel data are preserved.
  '10': CheV receiver wording removed from the Bacillus CheA review.
  '11': CheS retains GO0098772 because the full primary paper reports unchanged autokinase activity and
    does not establish a direct catalytic-regulation mechanism; enzyme/kinase regulator alternatives are
    explicitly assessed.
  '12': 'Tar refinement retained: current ancestry confirms GO0000160 descends from GO0035556. Receptor
    control is work within the relay, without assigning kinase MF to Tar.'
  '13': TlpD preprint relevance changed to MEDIUM; VERIFIED denotes source correspondence, not peer-review
    status. No quality downgrade inferred solely from preprint status.
  '14': Identical duplicate support entries removed from Ecoli CheA.
  '15': Ecoli CheY signal-carrier and Sinorhizobium CheY1 phosphate-sink roles distinguished in gene/family
    reasoning; reaction-level uncertainty remains.
