findings:
- topic: native_strain
  supporting_text: F. johnsoniae ATCC 17061 UW101 strains were routinely grown
  interpretation: Native organism matches target strain UW101; no E. coli or other Flavobacterium assay
    transfer is needed for the deletion/complementation phenotypes.
- topic: locus
  supporting_text: The F. johnsoniae gene identified was Fjoh_2111, which we refer to as lolA1.
  interpretation: Primary locus identifies the target independently of broad PANTHER membership.
- topic: complementation
  supporting_text: Plasmid-borne complementation of lolA1 and lolB1 deletion with lolA1 and lolB1 fully
    restored gliding motility
  interpretation: Native loss/rescue establishes physiological relevance, but does not itself make LolA1
    a motor or T9SS translocase.
- topic: cargo_distribution
  supporting_text: GldK and GldJ, two lipoproteins essential for gliding motility and T9 secretion28 were
    much less abundant in the OM of the lolA1 and lolB1 mutants than in the WT strain
  interpretation: Direct outer-membrane proteomic phenotype supports a target role in lipoprotein trafficking.
    It is not a purified carrier assay; degradation, assembly and indirect effects can contribute to measured
    abundance.
- topic: location
  supporting_text: All three LolA homologs carry such a signal sequence and are thus likely localized
    in the periplasm.
  interpretation: Periplasmic localization is explicitly a prediction/inference, not direct target fractionation.
- topic: interspecies_complementation
  supporting_text: In trans expression of LolAEc and LolBEc did not restore gliding nor T9 secretion of
    the lolA1 and lolB1 mutants
  interpretation: Tested E. coli/F. johnsoniae functional exchange fails in these conditions; do not infer
    all cross-species partners are incompatible.
- topic: alternative_surface_route
  supporting_text: LES-SiaC surface exposed in both WT and LolAB lacking strains
  interpretation: The engineered reporter remains surface exposed without all five LolAB homologs. The
    specific LolA1 route is not asserted to carry every lipoprotein.
unasserted:
- No purified target carrier or insertion assay identified
- No direct LolA1 compartment fractionation identified
- No molecular T9SS secretion or motor function inferred from downstream phenotypes
- No exact cargo specificity extrapolated to pigment-locus LolA2
- No conversion of ECO:0007744 to an invented three-letter GO evidence code
