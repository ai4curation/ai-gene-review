provenance:
  domains: Frozen official UniProt Pfam classifications, parsed independently of module family selectors. These broad domains are necessary panel consistency checks, never sufficient activity assignments.
  compartments: Reviewed core locations supported by original target features and source-scoped mechanisms; location inference is not converted into a target fractionation experiment.
  functions: Existing independently reviewed release, carrier, insertion and ATPase chemistry; binds module declarations to the same required activity used by the source-qualified predicate.
  source: Requires positive core support and separately verifies verbatim quotations and source hashes. Reference presence alone does not establish an assay; the retained reviews adjudicate scope.
  bifunctional_boundary: CB15 remains periplasmic and context-bounded; no anchored-LolB location requirement is imposed on its distinct bifunctional mechanism.
