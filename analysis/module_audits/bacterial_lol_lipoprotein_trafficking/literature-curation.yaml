references:
- id: PMID:30900542
  title: Lipoproteins and Their Trafficking to the Outer Membrane.
  publication_type: REVIEW
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read; the existing PMID cache lacks full text and remains unchanged.
      Useful for the canonical relay and existence of conditional LolAB-independent trafficking. Essentiality
      is not universal across organisms or engineered backgrounds.
  findings:
  - statement: The canonical relay separates extraction, periplasmic carriage and outer-membrane incorporation.
    supporting_text: LolA shuttles them through the periplasmic space
  - statement: LolAB-independent delivery is a known alternative whose components must not be invented.
    supporting_text: without either LolA or LolB
- id: PMID:42023066
  title: Leveraging the lipoprotein trafficking pathway for the development of novel antimicrobials.
  publication_type: REVIEW
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Section 3 on Lol architecture and the abaucin mechanism section read. The LolF comparison
      informs extractor alternatives; its broad outside-Enterobacteriaceae wording is not a taxonomic
      exclusion of Pseudomonas LolCDE. Unresolved structural questions are updated using 2026 primary
      structures. Drug potency is not used as a family activity criterion.
  findings:
  - statement: LolD ATPase supplies power to a complex with distinct membrane subunits in the E. coli
      route.
    supporting_text: LolC and LolE form a heterodimeric IM transporter complex
  - statement: A homodimeric membrane-subunit implementation supplies a distinct extractor architecture.
    supporting_text: a LolF homodimer paired to LolD2
- id: PMID:40536045
  title: Advances in Small Molecule Inhibitors Targeting the Bacterial Lipoprotein Transport System (Lol)
    in Gram-Negative Bacteria.
  publication_type: REVIEW
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Structure/characteristics sections on LolCDE, LolA and LolB read. Useful synthesis of
      separate transport stages and lineage variation, but its abbreviated Caulobacter statement must
      be bounded by the engineered construct and heterologous host in PMID36716372. Antimicrobial essentiality
      language is not transferred to every lineage.
  findings:
  - statement: The review points to bifunctional Caulobacter LolA; the underlying engineered assay, rather
      than this shorthand, determines the evidence scope.
    supporting_text: In Caulobacter vibrioides, LolA fulfills the role of LolB
- id: PMID:36716372
  title: Teasing apart the evolution of lipoprotein trafficking in gram-negative bacteria reveals a bifunctional
    LolA.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Results and Methods read. Exact source is CB15 CC_3705, not NA1000. Complementation
      uses a Caulobacter construct with the final 12 residues replaced by E. coli LolA residues, in an
      E. coli lpp-deletion background; the unmodified native protein is not equivalent to this construct.
      The study supports a bifunctional mechanism and a native-function inference, not direct proof of
      native Caulobacter flux. Its sequence-based LolB absence generalization is updated by the later
      Bacteroidota studies.
  findings:
  - statement: The successful heterologous carrier was engineered to improve interaction with the E. coli
      extractor.
    supporting_text: we replaced the final 12 residues of cviLolA with those of ecoLolA
  - statement: The assayed Caulobacter sequence comes from CB15.
    supporting_text: cviLolA (CC_3705) from C. vibrioides strain CB15
- id: PMID:40050408
  title: LolA and LolB are conserved in Bacteroidota and are crucial for gliding motility and Type IX
    secretion.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native UW101 deletion/complementation, lipoprotein localization and Methods read. Fjoh_2111/LolA1
      and Fjoh_1066/LolB1 support a client-selective Bacteroidota delivery implementation. Structural
      homology identifies distant LolB despite sequence-search failure. Other LolA/B paralogs and retained
      localization in deletions prevent a universal essentiality or exclusive-pathway claim. T9SS and
      gliding are downstream client functions, not additional steps of this module.
  findings:
  - statement: The experimentally studied LolA1 and LolB1 are not freely interchangeable with the E. coli
      system.
    supporting_text: these proteins are not interchangeable with their E. coli counterparts
  - statement: Residual outer-membrane localization establishes incomplete coverage by known LolA/B proteins
      without identifying the bypass machinery.
    supporting_text: Some lipoproteins still localize to the OM in the absence of LolA and LolB
- id: PMID:41676706
  title: Identification and characterization of the functional LolB ortholog in Bacteroides.
  publication_type: PREPRINT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: BioRxiv publication status verified from cached PubMed metadata. B. thetaiotaomicron
      VPI-5482 BT_3463 is studied by heterologous complementation, insertion assays, conditional depletion
      and fraction proteomics. Evidence is provisional. Surface-client retention and limited growth phenotype
      after depletion do not establish that all traffic bypasses LolB; depletion is not a clean null.
      Used as corroborating context, not the sole support for Bacteroidota LolB.
  findings:
  - statement: The Bacteroides candidate is BT_3463, homologous to the B. fragilis candidate BF9343_0270.
    supporting_text: The B. theta homolog BT_3463 is 59% identical
- id: PMID:41557797
  title: Liganded LolCDE structures reveal a common substrate-LolE interaction guiding bacterial lipoprotein
    transport.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: E. coli liganded LolCDE structural and functional analysis read. Supports LolE substrate
      engagement and distinct LolC/LolE roles, with a mechanistic model separating ATP-binding extrusion
      from hydrolysis/reset. Does not establish that each membrane subunit independently executes the
      entire release reaction.
  findings:
  - statement: The primary study examines liganded LolCDE rather than a generic ABC transporter.
    supporting_text: Liganded LolCDE structures reveal a common substrate-LolE interaction
- id: PMID:42736309
  title: Mechanistic basis of LolDF-mediated lipoprotein transport in Acinetobacter.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Results and Methods read. Native ADP1 chromosomal-tag purification, ATPase control,
      substrate/LolA/AMP-PNP structures and detergent single-cycle BamE handoff support the LolDF extractor.
      Lnt deletion and sorting mutants are condition-specific; they do not demonstrate every acyl state
      or every charged signal behaves identically. PDB entries link LolF to Q9EYM3, sequence-identical
      to current genome entry A0ACM8PZZ0/ACIAD2641; this duplicate identity is separately archived.
  findings:
  - statement: ADP1 uses a homodimeric LolF membrane unit with LolD ATPase, rather than distinct LolC
      and LolE units.
    supporting_text: LolDF forms a symmetric homodimer
  - statement: The structural dimer binds one LolA in the observed state.
    supporting_text: only a single LolA molecule binds to the LolDF dimer
  - statement: A direct in vitro handoff assay supplements structural inference.
    supporting_text: single-cycle transport assay using detergent-purified A baylyi LolDF
- id: PMID:25583975
  title: Small-molecule inhibitors of gram-negative lipoprotein trafficking discovered by phenotypic screening.
  publication_type: PRIMARY_RESEARCH
  reference_review:
    relevance: LOW
    correctness: UNVERIFIED
    review_notes: 'Full cached title and article identity checked: this is the McLeod et al. small-molecule
      inhibitor study of E. coli LolCDE, not the LoVullo Francisella lipoprotein-processing study. The
      initial search lead was misrouted and is rejected for Francisella LolF or acyl-state support. It
