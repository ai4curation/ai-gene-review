        action: ACCEPT
    - term:
        id: GO:0015031
        label: protein transport
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: involved_in
      review:
        summary: True at a broad level, but lipoprotein localization to the outer membrane captures LolB's
          role much more precisely.
        action: MARK_AS_OVER_ANNOTATED
    - term:
        id: GO:0044874
        label: lipoprotein localization to outer membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000104
      qualifier: involved_in
      review:
        summary: LolB receives LolA-bound lipoproteins and incorporates them into the outer membrane.
        action: ACCEPT
    - term:
        id: GO:0042953
        label: lipoprotein transport
      evidence_type: ISS
      original_reference_id: file:PSEPK/lolB/lolB-uniprot.txt
      qualifier: involved_in
      review:
        summary: LolB performs the terminal delivery and incorporation step of lipoprotein transport.
        action: NEW
        reason: The reviewed Q88PX4 UniProt record identifies LolB as the terminal lipoprotein-incorporation
          component, supporting the missing pathway process annotation by conserved-family inference.
        supported_by:
        - reference_id: file:PSEPK/lolB/lolB-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: Plays a critical role in the incorporation of lipoproteins in
    references:
    - id: GO_REF:0000002
      title: Gene Ontology annotation through association of InterPro records with GO terms
      findings: []
    - id: GO_REF:0000104
      title: Electronic Gene Ontology annotations created by transferring manual GO annotations between
        related proteins based on shared sequence features
      findings: []
    - id: GO_REF:0000120
      title: Combined Automated Annotation using Multiple IEA Methods
      findings: []
    - id: file:PSEPK/lolB/lolB-uniprot.txt
      title: UniProt record for Pseudomonas putida KT2440 LolB (Q88PX4)
      findings:
      - statement: UniProt identifies Q88PX4 as an outer-membrane LolB-family protein that incorporates
          lipoproteins after their release by LolA.
    - id: file:PSEPK/lolB/lolB-deep-research-openscientist.md
      title: OpenScientist research for Pseudomonas putida KT2440 LolB
      findings:
      - statement: LolB is the terminal outer-membrane receptor and insertion factor in the LolCDE-LolA-LolB
          relay.
        supporting_text: LolB is the outer-membrane receptor/inserter for lipoproteins
        reference_section_type: RESULTS
      - statement: Detailed mechanism is inferred mainly from characterized E. coli LolB rather than direct
          Q88PX4 experiments.
        supporting_text: Nearly all mechanistic detail derives from the *E. coli* ortholog
        reference_section_type: DISCUSSION
      reference_review:
        relevance: HIGH
        correctness: UNVERIFIED
        review_notes: Useful retrieval and Q88PX4 feature analysis; primary mechanistic and essentiality
          evidence is ortholog- or genus-derived.
    core_functions:
    - description: Acceptance of mature lipoproteins from LolA and their delivery into the bacterial outer
        membrane.
      directly_involved_in:
      - id: GO:0042953
        label: lipoprotein transport
      - id: GO:0044874
        label: lipoprotein localization to outer membrane
      locations:
      - id: GO:0009279
        label: cell outer membrane
      supported_by:
      - reference_id: file:PSEPK/lolB/lolB-uniprot.txt
        record_section:
        - CC:FUNCTION
        supporting_text: Plays a critical role in the incorporation of lipoproteins in
      - reference_id: file:PSEPK/lolB/lolB-deep-research-openscientist.md
        supporting_text: LolB is the outer-membrane receptor/inserter for lipoproteins
    proposed_new_terms:
    - proposed_name: outer-membrane lipoprotein insertion activity
      proposed_definition: Accepting a mature lipoprotein from a periplasmic carrier and promoting incorporation
        of its lipid anchor into the bacterial outer membrane.
      justification: Existing GO biological-process terms capture lipoprotein transport and localization,
        but no molecular-function term captures LolB-mediated terminal delivery and membrane insertion.
      proposed_parent:
        id: GO:0140318
        label: protein transporter activity
      supported_by:
      - reference_id: file:PSEPK/lolB/lolB-uniprot.txt
        record_section:
        - CC:FUNCTION
        supporting_text: Plays a critical role in the incorporation of lipoproteins in
    suggested_questions:
    - question: Which KT2440 outer-membrane lipoproteins depend most strongly on LolB for insertion?
    suggested_experiments:
    - description: Deplete LolB and quantify membrane partitioning of representative outer-membrane lipoproteins,
        followed by complementation with Q88PX4.
      experiment_type: membrane fractionation and complementation
  lolC:
    id: Q88KY5
    gene_symbol: lolC
    product_type: PROTEIN
    status: COMPLETE
    taxon:
      id: NCBITaxon:160488
      label: Pseudomonas putida KT2440
    description: Multi-pass inner-membrane LolC subunit of the LolCDE ABC complex. Together with LolE
      it forms the membrane machinery that extracts outer-membrane-destined mature lipoproteins and transfers
      them to LolA.
    existing_annotations:
    - term:
        id: GO:0005886
        label: plasma membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000044
      qualifier: located_in
      review:
        summary: LolC is an integral bacterial inner-membrane protein.
        action: ACCEPT
    - term:
        id: GO:0016020
        label: membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: located_in
      review:
        summary: Correct but less specific than the plasma membrane annotation the protein already carries.
        action: MODIFY
        reason: Plasma membrane (bacterial inner membrane) is the supported is_a descendant.
        proposed_replacement_terms:
        - id: GO:0005886
          label: plasma membrane
    - term:
        id: GO:0042953
        label: lipoprotein transport
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: involved_in
      review:
        summary: LolC is a membrane subunit of the lipoprotein-releasing LolCDE complex.
        action: ACCEPT
    - term:
        id: GO:0044874
        label: lipoprotein localization to outer membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000118
      qualifier: involved_in
      review:
        summary: LolCDE initiates transport of outer-membrane-destined lipoproteins.
        action: ACCEPT
    - term:
        id: GO:0098797
        label: plasma membrane protein complex
      evidence_type: IEA
      original_reference_id: GO_REF:0000118
      qualifier: part_of
      review:
        summary: LolC is an integral subunit of the inner-membrane LolCDE complex.
        action: ACCEPT
    - term:
        id: GO:0140306
        label: lipoprotein releasing activity
      evidence_type: ISS
      original_reference_id: file:PSEPK/lolC/lolC-uniprot.txt
      qualifier: enables
      review:
        summary: LolC is a membrane subunit of the lipoprotein-releasing LolCDE complex.
        action: NEW
        reason: GO:0140306 lipoprotein releasing activity is defined for the LolCDE complex of diderm
          bacteria. Q88KY5 is the syntenic lolC-lolD-lolE ortholog in KT2440, and the activity is established
          by reconstitution and depletion of the E. coli LolCDE subunits, which carry this term by IDA
          and IMP.
        supported_by:
        - reference_id: PMID:10783239
          supporting_text: catalyses the release of lipoproteins in LolA- and sorting-signal-dependent
            manners
        - reference_id: file:PSEPK/lolC/lolC-deep-research-openscientist.md
          supporting_text: LolA, initially primed to receive lipoprotein by interaction with LolC
    references:
    - id: GO_REF:0000002
      title: Gene Ontology annotation through association of InterPro records with GO terms
      findings: []
    - id: GO_REF:0000044
      title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location vocabulary mapping
        accompanied by conservative changes to GO terms applied by UniProt
      findings: []
    - id: GO_REF:0000118
      title: TreeGrafter-generated GO annotations
      findings: []
    - id: GO_REF:0000120
      title: Combined Automated Annotation using Multiple IEA Methods
      findings: []
    - id: PMID:10783239
      title: A new ABC transporter mediating the detachment of lipid-modified proteins from membranes.
      findings:
      - statement: Reconstituted E. coli LolCDE catalyses LolA- and sorting-signal-dependent lipoprotein
          release and does not transport substrate across the membrane.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Ortholog evidence (E. coli K-12 LolCDE) supporting the ISS lipoprotein releasing
          activity annotation.
    - id: PMID:29109272
      title: Structure and mechanotransmission mechanism of the MacB ABC transporter superfamily.
      findings:
      - statement: LolC and LolE, with the LolD NBD, translocate lipoproteins from the outer face of the
          inner membrane to a periplasmic chaperone by mechanotransmission rather than transmembrane substrate
          passage (E. coli comparative background, not KT2440).
    - id: file:PSEPK/lolC/lolC-uniprot.txt
      title: UniProt record for Pseudomonas putida KT2440 LolC (Q88KY5)
      findings:
      - statement: UniProt assigns Q88KY5 to the multi-pass membrane LolC/E subfamily.
    - id: file:PSEPK/lolC/lolC-deep-research-openscientist.md
      title: OpenScientist research for Pseudomonas putida KT2440 LolC
      findings:
      - statement: LolC is the LolA-docking membrane subunit of the LolCDE extraction complex rather than
          a pore-forming transmembrane transporter.
        supporting_text: LolC operates by mechanotransmission, not by transmembrane substrate passage
        reference_section_type: RESULTS
      - statement: Direct experimental characterization of Q88KY5 was not found.
        supporting_text: No study in the knowledge base characterizes *P. putida* KT2440 LolC
        reference_section_type: DISCUSSION
      reference_review:
        relevance: HIGH
        correctness: UNVERIFIED
        review_notes: Supports subunit-aware modeling; detailed LolA-docking and mechanotransmission evidence
          derives primarily from E. coli orthologs.
    core_functions:
    - description: Integral-membrane LolC contribution to LolCDE-dependent extraction and release of mature
        outer-membrane-destined lipoproteins, including the LolA-docking interface. Support is LolC/E
        family membership (NCBIfam TIGR02212, InterPro IPR011925), Phobius transmembrane helices, and
        comparative E. coli LolCDE mechanism summarized in the MacB-superfamily study; the LolA-docking
        role is inferred from E. coli work that is not cached here, and no KT2440 experiment exists.
      molecular_function:
        id: GO:0140306
        label: lipoprotein releasing activity
      directly_involved_in:
      - id: GO:0042953
        label: lipoprotein transport
      - id: GO:0044874
        label: lipoprotein localization to outer membrane
      locations:
      - id: GO:0005886
        label: plasma membrane
      supported_by:
      - reference_id: PMID:10783239
        supporting_text: catalyses the release of lipoproteins in LolA- and sorting-signal-dependent manners
      - reference_id: file:PSEPK/lolC/lolC-uniprot.txt
        record_section:
        - DR:NCBIfam
        supporting_text: NCBIfam; TIGR02212; lolCE; 1.
      - reference_id: file:PSEPK/lolC/lolC-uniprot.txt
        record_section:
        - DR:InterPro
        supporting_text: InterPro; IPR011925; LolCE_TM.
      - reference_id: file:PSEPK/lolC/lolC-uniprot.txt
        record_section:
        - FT:TRANSMEM
        supporting_text: TRANSMEM        21..48
      - reference_id: PMID:29109272
        supporting_text: LolC and LolE collaborate with NBDs encoded by LolD to translocate lipoproteins
          from the outer face of the inner membrane to a periplasmic chaperone during outer membrane biogenesis
      - reference_id: PMID:29109272
        supporting_text: LolCDE and FtsEX do not transport substrates across the inner membrane, but instead
          use cytoplasmic ATP hydrolysis to perform work in the periplasm
    suggested_questions:
    - question: What distinct substrate-contacting role does KT2440 LolC have relative to LolE?
    suggested_experiments:
    - description: Reconstitute LolCDE with systematic LolC and LolE substitutions and measure lipoprotein
        release to LolA.
      experiment_type: proteoliposome transport assay
  lolD:
    id: Q88KY4
    gene_symbol: lolD
    product_type: PROTEIN
    status: COMPLETE
    taxon:
      id: NCBITaxon:160488
      label: Pseudomonas putida KT2440
    description: Cytoplasmic ATPase subunit of the inner-membrane LolCDE complex. LolD hydrolyzes ATP
      to power extraction of outer-membrane-destined mature lipoproteins from the inner membrane and their
      transfer to LolA.
    existing_annotations:
    - term:
        id: GO:0005524
        label: ATP binding
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: enables
      review:
        summary: Correct for this ABC-family ATPase but less informative than ATP hydrolysis activity.
        action: KEEP_AS_NON_CORE
    - term:
        id: GO:0005886
        label: plasma membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: located_in
      review:
        summary: LolD is peripherally associated with the inner membrane through LolCDE.
        action: ACCEPT
    - term:
        id: GO:0016020
        label: membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: located_in
      review:
        summary: Correct but less specific than the plasma membrane annotation the protein already carries.
        action: MODIFY
        reason: Plasma membrane (bacterial inner membrane) is the supported is_a descendant.
        proposed_replacement_terms:
        - id: GO:0005886
          label: plasma membrane
    - term:
        id: GO:0016887
        label: ATP hydrolysis activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: enables
      review:
        summary: LolD is the catalytic ATPase subunit that powers LolCDE.
        action: ACCEPT
    - term:
        id: GO:0022857
        label: transmembrane transporter activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000118
      qualifier: enables
      review:
        summary: The ATPase subunit carries the activity of its complex, but the accurate activity is
          lipoprotein release, not transmembrane transport.
        action: MODIFY
        reason: GO annotates ABC ATPase subunits with the transporter activity of their complex, so the
          row is refined rather than removed. The transmembrane sense is wrong for LolCDE, which does
          not move its cargo across the bilayer, and GO:0140359 ABC-type transporter activity likewise
          requires transport across a membrane. The specific activity of the complex that LolD powers
          is GO:0140306 lipoprotein releasing activity, a protein transporter activity defined for LolCDE.
        supported_by:
        - reference_id: PMID:10783239
          supporting_text: The LolCDE complex differs mechanistically from all other ABC transporters
            as it is not involved in the transmembrane transport of substrates.
        proposed_replacement_terms:
        - id: GO:0140306
          label: lipoprotein releasing activity
    - term:
        id: GO:0044873
        label: lipoprotein localization to membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: involved_in
      review:
        summary: Broad parent of the accepted outer-membrane localization process.
        action: MODIFY
        reason: GO:0044874 is the is_a child that the gene already carries.
        proposed_replacement_terms:
        - id: GO:0044874
          label: lipoprotein localization to outer membrane
    - term:
        id: GO:0044874
        label: lipoprotein localization to outer membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: involved_in
      review:
        summary: LolD powers the initiating LolCDE release step.
        action: ACCEPT
    - term:
        id: GO:0042953
        label: lipoprotein transport
      evidence_type: ISS
      original_reference_id: file:PSEPK/lolD/lolD-uniprot.txt
      qualifier: involved_in
      review:
        summary: LolD supplies ATP hydrolysis to the LolCDE lipoprotein-release step.
        action: NEW
        reason: The reviewed Q88KY4 UniProt record places LolD in the LolCDE complex that releases mature
          outer-membrane-directed lipoproteins, supporting the missing pathway process annotation by conserved-family
          inference.
        supported_by:
        - reference_id: file:PSEPK/lolD/lolD-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: translocation of mature outer membrane-directed lipoproteins
    - term:
        id: GO:0055085
        label: transmembrane transport
      evidence_type: IEA
      original_reference_id: GO_REF:0000118
      qualifier: involved_in
      review:
        summary: LolCDE extracts lipoprotein from the outer leaflet of the inner membrane by mechanotransmission;
          its cargo does not cross the lipid bilayer.
        action: REMOVE
        reason: GO:0055085 requires movement across a membrane, whereas LolCDE mechanically extrudes lipid-anchored
          cargo from the membrane surface into the periplasm.
        supported_by:
        - reference_id: file:modules/bacterial_lol_lipoprotein_trafficking-deep-research-openscientist.md
          supporting_text: LolCDE does not translocate its substrate *across* the membrane
    - term:
        id: GO:0089705
        label: protein localization to outer membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: involved_in
      review:
        summary: Broad compared with lipoprotein localization to outer membrane.
        action: MODIFY
        reason: LolD acts only on lipoproteins; GO:0044874 is the precise process the gene already carries.
        proposed_replacement_terms:
        - id: GO:0044874
          label: lipoprotein localization to outer membrane
    - term:
        id: GO:0140306
        label: lipoprotein releasing activity
      evidence_type: ISS
      original_reference_id: file:PSEPK/lolD/lolD-uniprot.txt
      qualifier: enables
      review:
        summary: LolD is the ATPase subunit that powers LolCDE lipoprotein release.
        action: NEW
        reason: GO:0140306 lipoprotein releasing activity is defined for the LolCDE complex of diderm
          bacteria. Q88KY4 is the syntenic lolC-lolD-lolE ortholog in KT2440, and the activity is established
          by reconstitution and depletion of the E. coli LolCDE subunits, which carry this term by IDA
          and IMP.
        supported_by:
        - reference_id: PMID:10783239
          supporting_text: catalyses the release of lipoproteins in LolA- and sorting-signal-dependent
            manners
    references:
    - id: GO_REF:0000002
      title: Gene Ontology annotation through association of InterPro records with GO terms
      findings: []
    - id: GO_REF:0000118
      title: TreeGrafter-generated GO annotations
      findings: []
    - id: GO_REF:0000120
      title: Combined Automated Annotation using Multiple IEA Methods
      findings: []
    - id: PMID:10783239
      title: A new ABC transporter mediating the detachment of lipid-modified proteins from membranes.
      findings:
      - statement: Reconstituted E. coli LolCDE catalyses LolA- and sorting-signal-dependent lipoprotein
          release and does not transport substrate across the membrane.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Ortholog evidence (E. coli K-12 LolCDE) supporting the ISS lipoprotein releasing
          activity annotation.
    - id: file:PSEPK/lolD/lolD-uniprot.txt
      title: UniProt record for Pseudomonas putida KT2440 LolD (Q88KY4)
      findings:
      - statement: UniProt identifies LolD as the ATP-binding subunit of the inner-membrane LolCDE complex.
    - id: file:PSEPK/lolD/lolD-deep-research-openscientist.md
      title: OpenScientist deep research report on PSEPK LolD (Q88KY4)
      publication_type: DEEP_RESEARCH
      findings:
      - statement: Q88KY4 is a complete LolD-type ABC ATPase encoded between lolC and lolE.
        supporting_text: "This chromosomal **lolC\u2013lolD\u2013lolE cluster** mirrors the *E. coli lolCDE*\
          \ operon and demonstrates that *P. putida* encodes a **complete LolCDE transporter** with LolD's\
          \ integral-membrane partners present and adjacently encoded"
      reference_review:
        relevance: HIGH
        correctness: UNVERIFIED
        review_notes: Used for target-specific motif, architecture, orthology, and synteny synthesis;
          mechanistic claims remain ortholog-derived.
    - id: file:modules/bacterial_lol_lipoprotein_trafficking-deep-research-openscientist.md
      title: OpenScientist research for the reusable Lol trafficking module
      publication_type: DEEP_RESEARCH
      findings:
      - statement: LolCDE uses mechanotransmission rather than moving lipoprotein through a membrane pore.
        supporting_text: LolCDE does not translocate its substrate *across* the membrane
        reference_section_type: RESULTS
      reference_review:
        relevance: HIGH
        correctness: UNVERIFIED
        review_notes: Used to distinguish membrane-surface extraction from transmembrane transport.
    core_functions:
    - description: ATP hydrolysis that powers LolCDE-dependent lipoprotein extraction and release to LolA.
      molecular_function:
        id: GO:0016887
        label: ATP hydrolysis activity
      contributes_to_molecular_function:
        id: GO:0140306
        label: lipoprotein releasing activity
      directly_involved_in:
      - id: GO:0042953
        label: lipoprotein transport
      - id: GO:0044874
        label: lipoprotein localization to outer membrane
      locations:
      - id: GO:0005886
        label: plasma membrane
      supported_by:
      - reference_id: file:PSEPK/lolD/lolD-deep-research-openscientist.md
        supporting_text: "The protein is **only ~227 aa with no transmembrane segment** \u2014 i.e., a\
          \ **stand-alone nucleotide-binding domain**, exactly the architecture expected for the separate\
          \ cytoplasmic LolD ATPase that dimerizes and docks onto the integral-membrane LolC/LolE subunits."
      - reference_id: PMID:10783239
        supporting_text: catalyses the release of lipoproteins in LolA- and sorting-signal-dependent manners
    knowledge_gaps:
