reviews:
  lolA:
    id: Q88FS9
    gene_symbol: lolA
    product_type: PROTEIN
    status: COMPLETE
    taxon:
      id: NCBITaxon:160488
      label: Pseudomonas putida KT2440
    description: Periplasmic LolA-family carrier that accepts outer-membrane-destined mature lipoproteins
      from the inner-membrane LolCDE complex and carries them across the periplasm to LolB for outer-membrane
      delivery.
    existing_annotations:
    - term:
        id: GO:0030288
        label: outer membrane-bounded periplasmic space
      evidence_type: IEA
      original_reference_id: GO_REF:0000118
      qualifier: located_in
      review:
        summary: LolA is a soluble periplasmic lipoprotein carrier in diderm bacteria.
        action: ACCEPT
    - term:
        id: GO:0042597
        label: periplasmic space
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: located_in
      review:
        summary: Correct but less specific than the outer membrane-bounded periplasmic space annotation
          that this diderm protein already carries.
        action: MODIFY
        reason: GO:0030288 is the is_a child appropriate to a diderm periplasmic carrier.
        proposed_replacement_terms:
        - id: GO:0030288
          label: outer membrane-bounded periplasmic space
    - term:
        id: GO:0042953
        label: lipoprotein transport
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: involved_in
      review:
        summary: LolA carries mature lipoproteins through the periplasm.
        action: ACCEPT
    - term:
        id: GO:0044874
        label: lipoprotein localization to outer membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: involved_in
      review:
        summary: LolA transfers outer-membrane-destined lipoproteins from LolCDE to LolB.
        action: ACCEPT
    - term:
        id: GO:0140598
        label: lipoprotein carrier activity
      evidence_type: ISS
      original_reference_id: file:PSEPK/lolA/lolA-uniprot.txt
      qualifier: enables
      review:
        summary: LolA is the periplasmic lipoprotein carrier of the Lol pathway.
        action: NEW
        reason: GO:0140598 lipoprotein carrier activity ("binding to and carrying a lipoprotein between
          two different cellular locations") exactly describes the conserved LolA role. Q88FS9 is a reviewed
          LolA-family member (HAMAP MF_00240, PTHR35869:SF1), and the carrier activity is established
          experimentally for E. coli LolA, which forms soluble complexes with released outer-membrane
          lipoproteins and binds them in its hydrophobic cavity.
        supported_by:
        - reference_id: file:PSEPK/lolA/lolA-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: Participates in the translocation of lipoproteins from the inner membrane to
            the outer membrane.
        - reference_id: PMID:7628437
          supporting_text: p20 is a periplasmic carrier protein involved in the translocation of lipoproteins
            from the inner to the outer membrane
    references:
    - id: GO_REF:0000118
      title: TreeGrafter-generated GO annotations
      findings: []
    - id: GO_REF:0000120
      title: Combined Automated Annotation using Multiple IEA Methods
      findings: []
    - id: file:PSEPK/lolA/lolA-uniprot.txt
      title: UniProt record for Pseudomonas putida KT2440 LolA (Q88FS9)
      findings:
      - statement: UniProt identifies Q88FS9 as a periplasmic LolA-family carrier that participates in
          translocation of lipoproteins from the inner membrane to the outer membrane.
    - id: PMID:7628437
      title: A novel periplasmic carrier protein involved in the sorting and transport of Escherichia
        coli lipoproteins destined for the outer membrane.
      findings:
      - statement: Defines LolA (p20) in E. coli as a periplasmic carrier forming soluble complexes with
          outer-membrane-directed lipoproteins.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Ortholog evidence (E. coli K-12, P61316) supporting the ISS carrier-activity annotation.
    - id: file:modules/bacterial_lol_lipoprotein_trafficking-deep-research-openscientist.md
      title: OpenScientist research for the reusable Lol trafficking module
      publication_type: DEEP_RESEARCH
      findings:
      - statement: LolA shields the lipid anchor while carrying lipoprotein cargo across the periplasm.
        supporting_text: LolA is a soluble, monomeric periplasmic chaperone
        reference_section_type: RESULTS
      reference_review:
        relevance: HIGH
        correctness: UNVERIFIED
        review_notes: Used as retrieval support for the conserved LolA carrier role; Q88FS9-specific support
          comes from UniProt.
    core_functions:
    - description: Periplasmic carriage of mature outer-membrane-destined lipoproteins from the LolCDE
        release complex to the outer-membrane receptor LolB.
      molecular_function:
        id: GO:0140598
        label: lipoprotein carrier activity
      directly_involved_in:
      - id: GO:0042953
        label: lipoprotein transport
      - id: GO:0044874
        label: lipoprotein localization to outer membrane
      locations:
      - id: GO:0030288
        label: outer membrane-bounded periplasmic space
      supported_by:
      - reference_id: file:PSEPK/lolA/lolA-uniprot.txt
        record_section:
        - CC:FUNCTION
        supporting_text: Participates in the translocation of lipoproteins from the inner membrane to
          the outer membrane.
      - reference_id: file:modules/bacterial_lol_lipoprotein_trafficking-deep-research-openscientist.md
        supporting_text: LolA is a soluble, monomeric periplasmic chaperone
    suggested_questions:
    - question: Does KT2440 LolA apply the canonical Asp-dependent inner-membrane retention rule to all
        native lipoproteins?
    suggested_experiments:
    - description: Test transfer of purified KT2440 lipoproteins from reconstituted LolCDE to LolA and
        LolB using +2 residue variants.
      experiment_type: lipoprotein transfer assay
  lolB:
    id: Q88PX4
    gene_symbol: lolB
    product_type: PROTEIN
    status: COMPLETE
    taxon:
      id: NCBITaxon:160488
      label: Pseudomonas putida KT2440
    description: Outer-membrane-anchored LolB-family receptor that accepts mature lipoproteins from the
      periplasmic carrier LolA and promotes their incorporation into the outer membrane.
    existing_annotations:
    - term:
        id: GO:0009279
        label: cell outer membrane
