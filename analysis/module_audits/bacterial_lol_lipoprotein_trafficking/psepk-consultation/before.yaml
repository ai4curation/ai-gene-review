      - BIOLOGY
      significance: The catalytic assignment is strong, but quantitative behavior is transferred from
        characterized orthologs.
    suggested_questions:
    - question: What ATPase cycle and subunit stoichiometry optimize KT2440 LolCDE activity?
    suggested_experiments:
    - description: Reconstitute LolCDE and couple ATP hydrolysis measurements to lipoprotein release onto
        LolA.
      experiment_type: coupled ATPase and transport assay
