- id: GO:0140662
  name: ATP-dependent protein folding chaperone
  definition: Binding to a protein or a protein-containing complex to assist the protein
    folding process, driven by ATP hydrolysis.
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0140662
