- review_path: genes/ECOLI/groS/groS-ai-review.yaml
  accession: P0A6F9
  row_count: 36
  findings: 'Retained real GroES folding-cofactor activity under current GO0044183
    (binding protein or protein-containing complex to assist folding); core contributes
    to ATP-dependent folding without assigning autonomous GroES ATPase. Functional
    heptamerization is ACCEPT, not peripheral merely because it is structural. Cytoplasm
    refines to existing cytosol. ATP REMOVE is now grounded in PMID7867782 direct
    negative calorimetry/equilibrium experiments and nonspecific photolabel controls,
    while retaining the conflicting 1993 positive report. Metal binding is KEEP_AS_NON_CORE:
    ancestral PAINT support is corroborated by PMID12837792 E. coli GroES calcium-responsive
    oligomerization. Its 20 mM CaCl2 DLS measurement and proposed Glu53 site are not
    direct site occupancy, affinity or physiological calcium regulation. Earlier donor-count/missing-site
    rejection is superseded. Scoped primary excerpt records source and assay limits.'
  status: COMPLETE
  provider: default Falcon attempted;403 authentication; manual notes only
  paint_loss_scope: target lineage no IRD/IKR
