module_implications:
- GroEL and GroES form the ATP-dependent folding unit; GroES cofactor contribution
  is not autonomous ATPase.
- CnoX basal redox quality control differs from HOCl-induced holdase activation.
- CnoX/GroES same-ring coexistence is structurally supported; productive kinetic ordering
  remains unresolved.
- E. coli primary assays and Pseudomonas target inference remain distinct; no arbitrary
  cross-species compatibility is asserted.
