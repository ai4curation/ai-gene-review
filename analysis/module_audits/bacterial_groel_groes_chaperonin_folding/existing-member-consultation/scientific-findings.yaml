  findings: Full PMID42567683 identifies recombinant P0A6F5/P0A6F9/P77395 proteins
    (BL21(DE3); N-His6 CnoX) and demonstrates same-ring CnoX/GroES coexistence. This
    refines, rather than erases, the release result under the 2023 biochemical conditions.
    Substrate-free AMP-PNP structures do not establish temporal ordering or productive
    folding by each state. Basal GroEL-associated client redox quality control from
    PMID36764293 is separated from HOCl-activated holdase function from PMID29754824.
    No universal classical oxidoreductase or obligatory immediate-displacement claim
    is made. The two inherited NEW rows are retained unchanged in payload/action;
    no new proposal is added.
