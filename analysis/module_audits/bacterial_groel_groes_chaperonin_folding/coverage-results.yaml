limits:
- Five cognate pairs and one explicitly tested heterologous combination; biochemical reconstitution, complementation
  and curated target inference are labeled separately.
- The two CnoX mechanisms are optional and taxonomically distinct; this coverage panel addresses cage
  capacity rather than all CnoX chemistry.
- The compiler treats the whole cage as one atom; this external oracle explicitly checks both active units,
  activity and curated compatibility.
- The role-function evidence table is a scientific assessment, not an independent experimental validation.
  No ancestry, universal presence, client-transfer kinetics or arbitrary pair compatibility is inferred.
