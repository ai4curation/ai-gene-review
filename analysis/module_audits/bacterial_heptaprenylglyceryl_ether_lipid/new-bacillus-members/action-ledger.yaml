- gene: yvoF
  row_index: 0
  source_payload:
    term:
      id: GO:0016407
      label: acetyltransferase activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    supporting_entities:
    - PANTHER:PTN001917401
    - UniProtKB:G3XD01
  seed_action: PENDING
  final_review:
    summary: YvoF catalyzes O-acetylation of the glyceryl headgroup of an ether-lipid acetyl carrier.
    action: MODIFY
    reason: The inherited acetyltransferase claim is supported by target-gene deletion/complementation
      and recombinant enzyme chemistry. The acceptor atoms are glyceryl oxygens, so refine GO:0016407
      to its O-acetyltransferase descendant GO:0016413. This is increased chemical specificity, not rejection
      of PAINT ancestry or inference from donor count. The required PAINT lineage check found no IRD or
      IKR loss. The 2016 primary identifies the acetyl-CoA-dependent YvoF reaction, and the 2025 reconstitution
      uses YvoF to generate an acetylated geranylgeranyl analogue of native HepG. Similarity to maltose
      O-acetyltransferase does not establish maltose as a physiological substrate; the 2016 study reports
      that MAT fails to complement the yvoF deletion.
    proposed_replacement_terms:
    - id: GO:0016413
      label: O-acetyltransferase activity
    supported_by:
    - reference_id: PMID:27226549
      supporting_text: The acetyl-CoA-dependent enzyme YvoF is a close relative of maltose O-acetyltransferase
        (MAT).
      full_text_unavailable: true
    - reference_id: PMID:40626731
      supporting_text: which is subsequently dephosphorylated by a non-specific phosphatase prior to acetylation
        by YvoF to form acetylated heptaprenylglyceryl (Ac-HepG) with acetyl-coenzyme A (Ac-CoA) as donor
    - reference_id: PMID:40626731
      supporting_text: We substituted the commercially available geranylgeranyl pyrophosphate (GGPP) (four
        isoprenyl repeats) for the native heptaprenyl pyrophosphate (seven isoprenyl repeats) carrier
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - GRANULARITY_MISMATCH
      source_entities:
      - source_id: PANTHER:PTN001917401
        source_status: SUPPORTS_TRANSFER
        comment: The inherited generic acetyltransferase claim is consistent with target biochemical evidence.
          The lineage-loss check found no IRD/IKR; no ancestral-node placement error is asserted. Refinement
          specifies the directly supported oxygen acceptor rather than rejecting the transfer or treating
          the extant donor list as a similarity score.
- gene: ypjA
  row_index: 0
  source_payload:
    term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    supporting_entities:
    - UniProtKB-SubCell:SL-0039
  seed_action: PENDING
  final_review:
    summary: LhaT is an integral plasma-membrane enzyme that acetylates extracellular-facing lipoprotein
      amino termini.
    action: ACCEPT
    reason: 'The curated UniProt membrane assignment is independently corroborated by the primary biochemical
      study: recombinant B. subtilis YpjA was recovered in E. coli membranes and supported lipopeptide
      acetylation, with native deletion/complementation confirming its pathway role. Transmembrane prediction
      supports an integral protein; the extracellular reaction face follows the accessibility of the mature
      Lsp-cleaved lipoprotein amino terminus and the proposed pathway, rather than a direct topology-mapping
      experiment. UniProt lists three predicted segments whereas the study predicts six helices; exact
      helix count is not needed to support plasma membrane.'
    supported_by:
    - reference_id: file:BACSU/ypjA/ypjA-uniprot.txt
      record_section:
      - CC:SUBCELLULAR LOCATION
      supporting_text: 'SUBCELLULAR LOCATION: Cell membrane {ECO:0000305}; Multi-pass membrane protein
        {ECO:0000305}.'
    - reference_id: PMID:40626731
      supporting_text: YpjA is an unannotated membrane protein with no known functional domains that is
        predicted to encode six transmembrane α-helical passes by DeepTMHMM
    - reference_id: PMID:40626731
      supporting_text: the integral membrane protein YpjA to transfer the ester-linked acetyl group from
        Ac-HepG to an amide-linked bond with the α-amino termini of DA-LP substrates
- gene: ypjA
  row_index: 1
  source_payload:
    term:
      id: GO:0008080
      label: N-acetyltransferase activity
    evidence_type: IDA
    original_reference_id: PMID:40626731
  seed_action: null
  final_review:
    summary: LhaT transfers a lipid-derived acetyl group to the N-terminal nitrogen of a diacylglyceryl
      lipoprotein.
    action: NEW
    reason: The only seeded row records localization, leaving a directly demonstrated molecular activity
      uncovered. Native deletion/complementation and an in vitro reaction using recombinant B. subtilis
      YpjA in E. coli membranes, lipid-generating enzymes and a fluorescent model lipopeptide support
      the activity; mass spectrometry confirms a +42-Da product. GO:0008080 is donor-agnostic and matches
      acetyl transfer to nitrogen. GO:0004596 is inappropriate because its defined donor is acetyl-CoA,
      whereas LhaT accepts the lipid-loaded acetyl group. The reconstitution used a C20 geranylgeranyl
      analogue and mixed mono/diacetylated donors; native C35 preference and donor regioselectivity were
      not resolved. This is target biochemical evidence, not a blanket transfer to the entire DUF1405/PTHR40042
      family; a B. anthracis member was experimentally inactive.
    supported_by:
    - reference_id: PMID:40626731
      supporting_text: the integral membrane protein YpjA to transfer the ester-linked acetyl group from
        Ac-HepG to an amide-linked bond with the α-amino termini of DA-LP substrates
    - reference_id: PMID:40626731
      supporting_text: the Ac-CoA/YvoF/YpjA lipopeptide product was mass shifted by +42 Da
    - reference_id: PMID:40626731
      supporting_text: We substituted the commercially available geranylgeranyl pyrophosphate (GGPP) (four
        isoprenyl repeats) for the native heptaprenyl pyrophosphate (seven isoprenyl repeats) carrier
