native_phenotypes_not_computed:
  PAO1: Native PAO1 insertion/growth and PA14 deletion evidence reported; this enzyme-capacity calculation
    does not itself predict growth.
  KT2440: No native carnitine-growth conclusion follows from this finite audit; reported GBB-growth failure
    is an upstream, different-substrate phenotype.
  RHIME1021: 1021 GBB-growth failure remains separate from exact-sequence protein chemistry and positive3D0a2/Rm2011
    GBB growth; no native1021 carnitine-growth claim.
limitations:
- Finite reviewed-member oracle; not genome-wide classifier.
- Direct-or-identical profile is separately measured enzyme chemistry, not native pathway flux or growth.
- Compiler supplies Boolean topology; oracle separately inspects exact chemistry, original selectors and
  complex units.
- Same-strain gate defines a coherent finite panel, not an assertion that cross-species reconstitution
  is impossible.
- No PAINT node placement or family-wide exact-substrate specificity inferred.
- Source evidence, not ACCEPT actions or presence of broad GO terms, determines assay tiers.
