head: f5b02387a85bfaa85982a32f0c7cc0e41fe60c9e
reviews:
  genes/PSEPK/caiX/caiX-ai-review.yaml:
    id: Q88R30
    gene_symbol: caiX
    product_type: PROTEIN
    aliases:
    - PP_0304
    status: COMPLETE
    taxon:
      id: NCBITaxon:160488
      label: Pseudomonas putida KT2440
    description: caiX (PP_0304) encodes the periplasmic L-carnitine-binding protein of the Pseudomonas
      putida KT2440 Cbc ABC importer. By orthology with characterized P. aeruginosa and P. syringae CaiX,
      it carries a signal peptide and an OpuAC-type substrate-binding domain, binds L-carnitine, and docks
      to the shared CbcWV permease-ATPase core to confer carnitine specificity on uptake. The gene lies
      in the carnitine catabolic locus beside lcdH and the CdhB- and CdhC-type enzymes; KT2440 CaiX itself
      has not been assayed.
    existing_annotations:
    - term:
        id: GO:0015871
        label: choline transport
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: involved_in
      review:
        summary: InterPro2GO from the choline-binding-protein signature; CaiX is carnitine-selective.
        action: REMOVE
        reason: With CaiX as sole binding protein, CbcWV transports carnitine but not choline, and choline
          does not compete for CaiX binding; choline uptake uses the CbcX binding protein (Q88R38 in KT2440).
        supported_by:
        - reference_id: PMID:19919675
          supporting_text: Choline and betaine do not compete with carnitine for binding to CaiX, as indicated
            by the lack of competition by choline or betaine in the absence of CbcX (Table 7) and by the
            lack of choline or betaine uptake when CaiX was the sole SBP (Table 5)
        source_defects:
        - defect_type: WRONG_TERM
          resource: OTHER
          slot: GO ID
          requested_change: DELETE_ROW
          asserted_value: GO:0015871
          cause: OTHER
          confidence: PROBABLE
          explanation: InterPro2GO maps IPR017783 (ABC_choline_sub-bd) to choline transport; the signature
            also matches carnitine-specific CaiX.
    - term:
        id: GO:0022857
        label: transmembrane transporter activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: enables
      review:
        summary: True of the complex CaiX belongs to, but much less specific than its role.
        action: MODIFY
        reason: The informative activity is carnitine transmembrane transport by the CaiX-CbcWV complex
          (GO:0015226, a descendant of this term), to which CaiX contributes the substrate-binding role;
          it is recorded with contributes_to below.
        proposed_replacement_terms:
        - id: GO:0015226
          label: carnitine transmembrane transporter activity
        supported_by:
        - reference_id: PMID:19919675
          supporting_text: demonstrating that CaiX was sufficient for, and specific to, carnitine uptake
            (Table 5).
    - term:
        id: GO:0015226
        label: carnitine transmembrane transporter activity
      evidence_type: ISS
      original_reference_id: PMID:19919675
      qualifier: contributes_to
      review:
        summary: CaiX contributes carnitine recognition to the CbcWV importer.
        action: NEW
        reason: Pseudomonas CaiX is experimentally required and, with CbcWV, sufficient for carnitine
          uptake; the KT2440 protein is its locus-conserved ortholog.
        supported_by:
        - reference_id: PMID:19919675
          supporting_text: demonstrating that CaiX was sufficient for, and specific to, carnitine uptake
            (Table 5).
        - reference_id: file:PSEPK/caiX/caiX-deep-research-openscientist.md
          supporting_text: caiX sits in a carnitine-catabolic gene cluster
    - term:
        id: GO:0033265
        label: choline binding
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: enables
      review:
        summary: The family mapping assigns the CbcX ligand to carnitine-selective CaiX.
        action: MODIFY
        reason: Ortholog evidence identifies CaiX as carnitine-specific, not choline-binding. GO has no
          carnitine-binding term, so the closest accurate parent is quaternary ammonium group binding.
        proposed_replacement_terms:
        - id: GO:0050997
          label: quaternary ammonium group binding
        supported_by:
        - reference_id: PMID:19919675
          supporting_text: CaiX, which binds carnitine with a moderate affinity and represents the first
            carnitine-specific SBP to be reported.
        source_defects:
        - defect_type: WRONG_TERM
          resource: OTHER
          slot: GO ID
          requested_change: REPOINT
          asserted_value: GO:0033265
          corrected_value: GO:0050997
          cause: OTHER
          confidence: PROBABLE
          explanation: InterPro2GO maps IPR017783 (ABC_choline_sub-bd) to choline binding; the signature
            also matches carnitine-specific CaiX.
    - term:
        id: GO:0042597
        label: periplasmic space
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: located_in
      review:
        summary: CaiX acts as a periplasmic substrate-binding protein.
        action: ACCEPT
        reason: SignalP predicts a cleavable signal peptide, and CaiX orthologs act as free periplasmic
          binding proteins of a Gram-negative ABC importer.
        supported_by:
        - reference_id: file:PSEPK/caiX/caiX-uniprot.txt
          record_section:
          - FT:SIGNAL
          supporting_text: FT   SIGNAL          1..24
        - reference_id: PMID:19919675
          supporting_text: Following rapid binding of the substrates by SBPs in the periplasm, the core
            transporter likely discriminates between the substrate-bound and substrate-free SBPs
    - term:
        id: GO:0043190
        label: ATP-binding cassette (ABC) transporter complex
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: part_of
      review:
        summary: CaiX docks to CbcWV; the binding-protein-containing child is the precise complex.
        action: MODIFY
        reason: CaiX is the substrate-binding subunit of a CbcWV importer, which is GO:0055052, an is_a
          child of this term.
        proposed_replacement_terms:
        - id: GO:0055052
          label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
        supported_by:
        - reference_id: PMID:19919675
          supporting_text: The core transporter CbcWV also interacts with the carnitine-specific SBP CaiX
    - term:
        id: GO:0055085
        label: transmembrane transport
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: involved_in
      review:
        summary: Correct but general; the specific process is carnitine transmembrane transport.
        action: MODIFY
        reason: GO:1902603 is the is_a descendant supported by ortholog evidence and proposed below.
        proposed_replacement_terms:
        - id: GO:1902603
          label: carnitine transmembrane transport
        supported_by:
        - reference_id: PMID:19919675
          supporting_text: demonstrating that CaiX was sufficient for, and specific to, carnitine uptake
            (Table 5).
    - term:
        id: GO:1902603
        label: carnitine transmembrane transport
      evidence_type: ISS
      original_reference_id: PMID:19919675
      qualifier: involved_in
      review:
        summary: Carnitine transport is the specific process mediated by CaiX with CbcWV.
        action: NEW
        reason: Pseudomonas CaiX orthologs are genetically and biochemically required for Cbc-mediated
          carnitine uptake.
        supported_by:
        - reference_id: PMID:19919675
          supporting_text: These findings provide compelling evidence that Psyr_2916 and PA5388, hereafter
            referred to as CaiX, enable Cbc-mediated carnitine uptake in P. syringae and P. aeruginosa
            respectively.
    references:
    - id: GO_REF:0000002
      title: Gene Ontology annotation through association of InterPro records with GO terms
      findings: []
    - id: PMID:19919675
      title: The ATP-binding cassette transporter Cbc (choline/betaine/carnitine) recruits multiple substrate-binding
        proteins with strong specificity for distinct quaternary ammonium compounds.
      findings:
      - statement: Establishes CaiX as the carnitine-selective binding component used with CbcWV.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Full text cached; experiments on P. aeruginosa and P. syringae orthologs.
    - id: file:PSEPK/caiX/caiX-uniprot.txt
      title: UniProtKB record for caiX
      findings:
      - statement: Identifies Q88R30 as the carnitine uptake periplasmic component.
    - id: file:PSEPK/caiX/caiX-deep-research-openscientist.md
      title: OpenScientist deep research report for caiX
      findings:
      - statement: Supports CaiX orthology, periplasmic localization, CbcWV recruitment, and the absence
          of direct KT2440 binding assays.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Supports CaiX/Q88R30 as the carnitine-selective periplasmic substrate-binding protein
          recruiting the shared CbcWV core, distinct from choline-selective CbcX; direct KT2440 assays
          remain unavailable.
    core_functions:
    - description: Periplasmic L-carnitine recognition for the CbcWV ABC importer.
      molecular_function:
        id: GO:0050997
        label: quaternary ammonium group binding
      contributes_to_molecular_function:
        id: GO:0015226
        label: carnitine transmembrane transporter activity
      directly_involved_in:
      - id: GO:1902603
        label: carnitine transmembrane transport
      locations:
      - id: GO:0042597
        label: periplasmic space
      in_complex:
        id: GO:0055052
        label: ATP-binding cassette (ABC) transporter complex, substrate-binding subunit-containing
      supported_by:
      - reference_id: PMID:19919675
        supporting_text: The core transporter CbcWV also interacts with the carnitine-specific SBP CaiX
    proposed_new_terms:
    - proposed_name: L-carnitine binding
      proposed_definition: Binding to L-carnitine.
      justification: CaiX is a substrate-binding protein specific for L-carnitine, but GO has no carnitine-binding
        term; the closest parent is quaternary ammonium group binding.
      proposed_parent:
        id: GO:0050997
        label: quaternary ammonium group binding
      supported_by:
      - reference_id: PMID:19919675
        supporting_text: the carnitine-specific SBP CaiX (K(m), 24 microM)
    suggested_questions:
    - question: What is the binding affinity and substrate range of KT2440 CaiX itself?
    suggested_experiments:
    - description: Measure Q88R30 binding to L-carnitine and related quaternary amines and test CbcWV-dependent
        uptake.
      experiment_type: ligand-binding and transport assay
  genes/PSEPK/lcdH/lcdH-ai-review.yaml:
    id: Q88R32
    gene_symbol: lcdH
    product_type: PROTEIN
    aliases:
    - PP_0302
    status: COMPLETE
    taxon:
      id: NCBITaxon:160488
      label: Pseudomonas putida KT2440
    description: lcdH (PP_0302) encodes the cytoplasmic NAD(+)-dependent L-carnitine dehydrogenase of
      Pseudomonas putida KT2440, which oxidizes L-carnitine to 3-dehydrocarnitine as the first step of
      L-carnitine catabolism to glycine betaine. It lies in the conserved PP_0301-PP_0304 carnitine locus
      next to the CdhC- and CdhB-type enzymes and the CaiX carnitine-binding protein, and it is the ortholog
      of the characterized P. aeruginosa CdhA. Carnitine dehydrogenase purified from another P. putida
      strain is specific for L-carnitine and NAD(+); the KT2440 protein itself is assigned by orthology
      and HAMAP classification.
    existing_annotations:
    - term:
        id: GO:0005737
        label: cytoplasm
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: located_in
      review:
        summary: Cytoplasm is the supported location for the soluble L-carnitine dehydrogenase.
        action: ACCEPT
        reason: The HAMAP rule places LcdH in the cytoplasm, consistent with a soluble NAD(+)-dependent
          enzyme without signal peptide or transmembrane segment.
        supported_by:
        - reference_id: file:PSEPK/lcdH/lcdH-uniprot.txt
          record_section:
          - CC:SUBCELLULAR LOCATION
          supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm {ECO:0000255|HAMAP-Rule:MF_02129}.'
    - term:
        id: GO:0006631
        label: fatty acid metabolic process
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: involved_in
      review:
        summary: InterPro2GO transfer from the 3-hydroxyacyl-CoA dehydrogenase domains; LcdH acts on L-carnitine.
        action: REMOVE
        reason: The domain mapping fits the acyl-CoA dehydrogenases of the family, but LcdH belongs to
          the L-carnitine dehydrogenase subfamily, whose characterized members do not act on fatty acids
          or hydroxy acids such as 3-hydroxybutyrate.
        supported_by:
        - reference_id: file:PSEPK/lcdH/lcdH-uniprot.txt
          record_section:
          - CC:SIMILARITY
          supporting_text: Belongs to the 3-hydroxyacyl-CoA dehydrogenase family. L- carnitine dehydrogenase
            subfamily.
        - reference_id: file:PSEAE/cdhA/cdhA-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: D,L-3- hydroxybutyrate, L-lactate, ethanol, L-malate and D,L-isocitrate are
            not substrates (PubMed:4302217).
        source_defects:
        - defect_type: WRONG_TERM
          resource: OTHER
          slot: GO ID
          requested_change: DELETE_ROW
          asserted_value: GO:0006631
          cause: OTHER
          confidence: PROBABLE
          explanation: InterPro2GO maps IPR006108/IPR006176 (3-hydroxyacyl-CoA dehydrogenase domains)
            to fatty acid metabolic process; the L-carnitine dehydrogenase subfamily shares the domains
            but not the fatty acid substrate.
    - term:
        id: GO:0009437
        label: carnitine metabolic process
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: involved_in
      review:
        summary: Correct but less specific than carnitine catabolic process.
        action: MODIFY
        reason: LcdH catalyzes the first step of carnitine degradation in Pseudomonas; the specific child
          GO:0042413 is already on this gene.
        proposed_replacement_terms:
        - id: GO:0042413
          label: carnitine catabolic process
        supported_by:
        - reference_id: PMID:9037756
          supporting_text: Some, especially Pseudomonas species, assimilate L-(-)-carnitine as sole source
            of carbon and nitrogen. The first catabolic step is catalysed by the L-(-)-carnitine dehydrogenase.
    - term:
        id: GO:0016491
        label: oxidoreductase activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: enables
      review:
        summary: True but far less specific than the carnitine 3-dehydrogenase activity.
        action: MODIFY
        reason: GO:0047728 is the specific descendant and is already on this gene.
        proposed_replacement_terms:
        - id: GO:0047728
          label: carnitine 3-dehydrogenase activity
        supported_by:
        - reference_id: file:PSEPK/lcdH/lcdH-uniprot.txt
          record_section:
          - CC:CATALYTIC ACTIVITY
          supporting_text: Reaction=carnitine + NAD(+) = 3-dehydrocarnitine + NADH + H(+);
    - term:
        id: GO:0016616
        label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: enables
      review:
        summary: Chemically correct parent of carnitine 3-dehydrogenase activity.
        action: MODIFY
        reason: GO:0047728 is the specific descendant and is already on this gene.
        proposed_replacement_terms:
        - id: GO:0047728
          label: carnitine 3-dehydrogenase activity
        supported_by:
        - reference_id: file:PSEPK/lcdH/lcdH-uniprot.txt
          record_section:
          - CC:CATALYTIC ACTIVITY
          supporting_text: Reaction=carnitine + NAD(+) = 3-dehydrocarnitine + NADH + H(+);
    - term:
        id: GO:0042413
        label: carnitine catabolic process
      evidence_type: IEA
      original_reference_id: GO_REF:0000117
      qualifier: involved_in
      review:
        summary: Carnitine catabolism is the process LcdH initiates.
        action: ACCEPT
        reason: 'Although the row is an ARBA prediction, it is supported independently: the dehydrogenase
          catalyzes the first catabolic step of Pseudomonas carnitine assimilation, and the P. aeruginosa
          ortholog CdhA is required for growth on carnitine.'
        supported_by:
        - reference_id: PMID:9037756
          supporting_text: Some, especially Pseudomonas species, assimilate L-(-)-carnitine as sole source
            of carbon and nitrogen. The first catabolic step is catalysed by the L-(-)-carnitine dehydrogenase.
        - reference_id: file:PSEAE/cdhA/cdhA-uniprot.txt
          record_section:
          - CC:DISRUPTION PHENOTYPE
        - reference_id: file:PSEAE/cdhA/cdhA-uniprot.txt
          record_section:
          - CC:DISRUPTION PHENOTYPE
          supporting_text: 'DISRUPTION PHENOTYPE: Cells are incapable of growth on carnitine.'
        - reference_id: PMID:19406895
          supporting_text: The PA5388-PA5384 region contains the predicted P. aeruginosa carnitine dehydrogenase
            homologue along with other genes required for growth on carnitine.
    - term:
        id: GO:0047728
        label: carnitine 3-dehydrogenase activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: enables
      review:
        summary: GO:0047728 is the exact molecular function of LcdH.
        action: ACCEPT
        reason: HAMAP classifies PP_0302 in the L-carnitine dehydrogenase subfamily with EC 1.1.1.108,
          and the enzyme purified from P. putida is specific for L-carnitine and NAD(+).
        supported_by:
        - reference_id: file:PSEPK/lcdH/lcdH-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: Catalyzes the NAD(+)-dependent oxidation of L-carnitine to 3- dehydrocarnitine.
        - reference_id: file:PSEPK/lcdH/lcdH-deep-research-openscientist.md
          supporting_text: L-carnitine dehydrogenase (EC 1.1.1.108)
        - reference_id: PMID:3058208
          supporting_text: Carnitine dehydrogenase (carnitine:NAD+ oxidoreductase, EC 1.1.1.108) from
            Pseudomonas putida IFP 206 catalyzes the oxidation of L-carnitine to 3-dehydrocarnitine.
        - reference_id: PMID:3058208
          supporting_text: the carnitine dehydrogenase is specific for L-carnitine and NAD+.
    - term:
        id: GO:0051287
        label: NAD binding
      evidence_type: IEA
      original_reference_id: GO_REF:0000104
      qualifier: enables
      review:
        summary: Correct cofactor binding; NAD+ binding is the specific child already on this gene.
        action: MODIFY
        reason: NAD(+) is the oxidant of the reaction and the HAMAP-defined site binds NAD(+).
        proposed_replacement_terms:
        - id: GO:0070403
          label: NAD+ binding
        supported_by:
        - reference_id: file:PSEPK/lcdH/lcdH-uniprot.txt
          record_section:
          - FT:BINDING
          supporting_text: /ligand="NAD(+)"
    - term:
        id: GO:0070403
        label: NAD+ binding
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: enables
      review:
        summary: NAD+ binding is supported but secondary to the specific dehydrogenase activity.
        action: KEEP_AS_NON_CORE
        reason: The term is as precise as warranted but describes cofactor binding, not the core catalytic
          activity.
        supported_by:
        - reference_id: file:PSEPK/lcdH/lcdH-uniprot.txt
          record_section:
          - FT:BINDING
          supporting_text: /ligand="NAD(+)"
    references:
    - id: GO_REF:0000002
      title: Gene Ontology annotation through association of InterPro records with GO terms
      findings: []
    - id: GO_REF:0000104
      title: Electronic Gene Ontology annotations created by transferring manual GO annotations between
        related proteins based on shared sequence features
      findings: []
    - id: GO_REF:0000117
      title: Electronic Gene Ontology annotations created by ARBA machine learning models
      findings: []
    - id: GO_REF:0000120
      title: Combined Automated Annotation using Multiple IEA Methods
      findings: []
    - id: file:PSEPK/lcdH/lcdH-uniprot.txt
      title: UniProtKB reviewed entry for lcdH
      findings:
      - statement: UniProt/HAMAP supplies the L-carnitine dehydrogenase name, EC/Rhea reaction, carnitine
          metabolism pathway, NAD(+) binding feature and cytoplasmic location.
    - id: PMID:19406895
      title: Identification of genes required for Pseudomonas aeruginosa carnitine catabolism.
      full_text_unavailable: true
      findings:
      - statement: The P. aeruginosa locus containing the carnitine dehydrogenase is required for growth
          on carnitine.
        supporting_text: The PA5388-PA5384 region contains the predicted P. aeruginosa carnitine dehydrogenase
          homologue along with other genes required for growth on carnitine.
      reference_review:
        relevance: MEDIUM
        correctness: VERIFIED
        review_notes: Abstract-only cache; ortholog evidence for the catabolic role, cited directly rather
          than only through the curated Q9HTH8 entry.
    - id: file:PSEAE/cdhA/cdhA-uniprot.txt
      title: UniProtKB entry Q9HTH8 (P. aeruginosa CdhA ortholog)
      findings:
      - statement: The characterized ortholog is specific for L-carnitine and required for growth on carnitine.
    - id: file:interpro/panther/PTHR48075/PTHR48075-metadata.yaml
      title: PANTHER family metadata for lcdH
      findings:
      - statement: The PANTHER family is a broad 3-hydroxyacyl-CoA dehydrogenase family, supporting caution
          around family-level fatty-acid annotations.
    - id: file:PSEPK/lcdH/lcdH-deep-research-openscientist.md
      title: OpenScientist deep research report for lcdH
      reference_review:
        relevance: HIGH
        correctness: UNVERIFIED
        review_notes: On-target provider report that supports L-carnitine dehydrogenase activity from
          same-species Pseudomonas biochemistry, KT2440 sequence/HAMAP assignment, and the local carnitine-catabolism
          cluster. The purified-enzyme work was not in KT2440 specifically.
      findings:
      - statement: Same-species biochemical support for L-carnitine dehydrogenase activity, a KT2440 carnitine-catabolism
          gene-cluster context, and the caveat that Q88R32 is assigned by orthology rather than KT2440
          enzymology.
    - id: PMID:3058208
      title: Purification and properties of carnitine dehydrogenase from Pseudomonas putida.
      full_text_unavailable: true
      findings:
      - statement: Purified P. putida carnitine dehydrogenase oxidizes L-carnitine to 3-dehydrocarnitine
          and is specific for L-carnitine and NAD(+).
        supporting_text: the carnitine dehydrogenase is specific for L-carnitine and NAD+.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Abstract-only cache; strain IFP 206, not KT2440.
    - id: PMID:9037756
      title: Bacterial carnitine metabolism.
      findings:
      - statement: Review identifying L-carnitine dehydrogenase as the first catabolic step of carnitine
          assimilation in Pseudomonas.
      reference_review:
        relevance: MEDIUM
        correctness: VERIFIED
        review_notes: Abstract-level review; background for the process assignment.
    - id: PMID:565193
      title: '[Interrelationships between carnitine metabolism and fatty acid assimilation in Pseudomonas
        putida (author''s transl)].'
      findings:
      - statement: P. putida physiology study reports growth on L-carnitine and induction of carnitine
          dehydrogenase by L-carnitine and gamma-butyrobetaine.
      reference_review:
        relevance: LOW
        correctness: VERIFIED
        review_notes: Background physiology; not used as support for a specific row.
    core_functions:
    - description: NAD(+)-dependent oxidation of L-carnitine to 3-dehydrocarnitine, the first step of
        carnitine catabolism.
      molecular_function:
        id: GO:0047728
        label: carnitine 3-dehydrogenase activity
      directly_involved_in:
      - id: GO:0042413
        label: carnitine catabolic process
      locations:
      - id: GO:0005737
        label: cytoplasm
      supported_by:
      - reference_id: file:PSEPK/lcdH/lcdH-uniprot.txt
        record_section:
        - CC:CATALYTIC ACTIVITY
        supporting_text: Reaction=carnitine + NAD(+) = 3-dehydrocarnitine + NADH + H(+);
      - reference_id: PMID:3058208
        supporting_text: the carnitine dehydrogenase is specific for L-carnitine and NAD+.
      - reference_id: PMID:9037756
        supporting_text: The first catabolic step is catalysed by the L-(-)-carnitine dehydrogenase.
    proposed_new_terms: []
    suggested_questions:
    - question: Is there direct genetic evidence for PP_0302-dependent L-carnitine utilization in P. putida
        KT2440, or is the assignment entirely transferred from CdhA?
    suggested_experiments:
    - description: Compare wild-type and lcdH deletion KT2440 growth on L-carnitine as sole carbon or
        nitrogen source, and measure 3-dehydrocarnitine by targeted LC-MS.
      experiment_type: growth phenotype and metabolite profiling
  genes/PSEPK/cbcV/cbcV-ai-review.yaml:
    id: Q88R40
    gene_symbol: cbcV
    product_type: PROTEIN
    aliases:
    - PP_0294
    status: COMPLETE
    taxon:
      id: NCBITaxon:160488
      label: Pseudomonas putida KT2440
    description: cbcV (PP_0294) encodes the cytoplasmic ATP-binding (nucleotide-binding domain) subunit
      of the modular Cbc ABC importer of Pseudomonas putida KT2440. With the CbcW permease it forms the
      shared core that, depending on which periplasmic binding protein docks (CbcX, BetX or CaiX), imports
