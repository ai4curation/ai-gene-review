- review: genes/CAUVC/pleD/pleD-ai-review.yaml
  annotation:
    term:
      id: GO:0035438
      label: cyclic-di-GMP binding
    evidence_type: ISS
    original_reference_id: PMID:17697997
    review:
      summary: PleD binds c-di-GMP at an allosteric feedback site.
      action: NEW
      reason: The structure directly demonstrates a noncatalytic c-di-GMP binding
        site rather than substrate binding during synthesis. This activity is absent
        from the seeded annotations and their replacements. ISS conservatively transfers
        the characterized PleD mechanism to CB15 Q9A5I5; CB15N B8GZM2 is sequence-identical
        (454 residues; notes).
      supported_by:
      - reference_id: PMID:17697997
        supporting_text: Here, a second mode is observed that crosslinks the DGC domains
          within a PleD dimer. Both modes cause noncompetitive product inhibition
          by domain immobilization.
    supporting_entities:
    - UniProtKB:B8GZM2
- review: genes/PSEPF/lapD/lapD-ai-review.yaml
  annotation:
    term:
      id: GO:0035438
      label: cyclic-di-GMP binding
    evidence_type: IDA
    original_reference_id: PMID:21304926
    review:
      summary: LapD directly binds c-di-GMP through its inactive EAL domain.
      action: NEW
      reason: The structural and binding experiments use Pf0-1 LapD. This defining
        receptor activity is absent from the seeded rows and is not a replacement
        for the separate LapG inhibitory function.
      supported_by:
      - reference_id: PMID:21304926
        supporting_text: c-di-GMP binding to the LapD degenerate phosphodiesterase
          domain is communicated via the HAMP relay to the periplasmic domain, triggering
          sequestration of the protease LapG, thus preventing cleavage of the surface
          adhesin LapA.
- review: genes/BACSU/motI/motI-ai-review.yaml
  annotation:
    term:
      id: GO:0140678
      label: molecular function inhibitor activity
    evidence_type: ISS
    original_reference_id: PMID:29196522
    supporting_entities:
    - NCBIProtein:AQZ91192.1
    review:
      summary: MotI non-covalently inhibits MotA motor function.
      action: NEW
      reason: Ligand binding alone omits the established regulatory output. MotI interacts
        with MotA to inhibit stator–rotor engagement, fitting the more specific molecular
        function inhibitor activity through non-covalent target binding without covalent
        modification; it is not a cytoskeletal motor regulator, so GO:0140659 is inappropriate.
        The assays used the NCIB 3610 background; ISS records transfer to the sequence-identical
        168 protein, checked against AQZ91192.1 in CP020102.1. This term is absent
        from the seeded rows and their replacements.
      supported_by:
      - reference_id: PMID:29196522
        supporting_text: MotI acts like a molecular clutch on the flagellar motor
          by interacting with MotA and preventing contact with FliG.
- review: genes/BACSU/ydaK/ydaK-ai-review.yaml
  annotation:
    term:
      id: GO:0035438
      label: cyclic-di-GMP binding
    evidence_type: ISS
    original_reference_id: PMID:23893111
    supporting_entities:
    - NCBIProtein:AQZ89334.1
    review:
      summary: YdaK binds c-di-GMP despite loss of GGDEF cyclase activity.
      action: NEW
      reason: Purified YdaK domain binds c-di-GMP in calorimetry, and later hydrogen–deuterium
        exchange and I-site mutagenesis establish ligand-dependent structural responses.
        This MF is absent from the seeded review. ISS records transfer from experimentally
        studied NCIB 3610 to the sequence-identical 168 YdaK, checked against AQZ89334.1
        (283 aa) in CP020102.1. No cyclase activity or generic biofilm process is
        inferred from the GGDEF domain alone.
      supported_by:
      - reference_id: PMID:23893111
        supporting_text: we were able to measure c-di-GMP binding to this domain,
          likely at the conserved I-site, with a dissociation constant of ∼1.1 μM
      - reference_id: PMID:32156823
        supporting_text: binding of c-di-GMP to YdaK leads to major conformational
          changes in the entire GGDEF domain
- review: genes/BORBU/pdeB/pdeB-ai-review.yaml
  annotation:
    term:
      id: GO:0071111
      label: cyclic-guanylate-specific phosphodiesterase activity
    evidence_type: IC
    original_reference_id: PMID:21670168
    review:
      summary: Infer cyclic di-GMP ring opening as part of the directly demonstrated
        degradation to GMP.
      action: NEW
      reason: The seed has no GOA rows. Purified PdeB converts cyclic di-GMP to GMP,
        so opening one cyclic phosphodiester bond is an intrinsic step of the demonstrated
        hydrolysis. GO:0071111 describes only that first c-di-GMP-to-pGpG step; it
        is proposed as IC because this paper measures GMP as the final product, not
        isolated release or accumulation of pGpG. This does not claim that GMP is
        the direct product specified by GO:0071111. The primary assay concerns the
        same chromosomal BB0374 in a B31-derived background; strain-specific tick
        phenotypes are kept separate.
      supported_by:
      - reference_id: PMID:21670168
        supporting_text: The full-length protein or only the functional domain hydrolyzed
          33 P-labeled c-di-GMP to GMP
- review: genes/BORBU/plzA/plzA-ai-review.yaml
  annotation:
    term:
      id: GO:0035438
      label: cyclic-di-GMP binding
    evidence_type: IDA
    original_reference_id: PMID:20030712
    review:
      summary: PlzA directly and specifically binds cyclic di-GMP.
      action: NEW
      reason: No GOA rows were present in the seed. Direct ligand-binding and site-directed
        mutagenesis of B31-derived recombinant PlzA establish this molecular function;
        the later cocrystal independently confirms the interaction. A PilZ-domain
        label alone is not the evidence.
      supported_by:
      - reference_id: PMID:20030712
        supporting_text: Substitution of specific Arg residues within the PilZ domain
          completely abolished c-di-GMP binding.
- review: genes/BORBU/plzA/plzA-ai-review.yaml
  annotation:
    term:
      id: GO:0140691
      label: RNA folding chaperone
    evidence_type: IDA
    original_reference_id: PMID:37086029
    review:
      summary: PlzA assists RNA structural rearrangements in vitro.
      action: NEW
      reason: Direct experiments on recombinant B31-5A4 PlzA measure RNA annealing,
        strand displacement and unwinding. This satisfies the RNA-folding-chaperone
        definition without asserting ATP-dependent RNA helicase activity or a proven
        endogenous RNA target. Apo and holo states differ in unwinding under these
        assay conditions; PMID:38527857 reports different ligand dependence of RNA
        binding, so that dependence is not generalized across substrates and assays.
        This activity is distinct from the cyclic-di-GMP receptor activity and DNA
        binding. This in vitro activity is retained as a supported molecular-function
        proposal but is not designated a conserved native core function while physiological
        targets and significance remain unresolved.
      supported_by:
      - reference_id: PMID:37086029
        supporting_text: Holo- and apo-PlzA bind RNA and accelerate RNA annealing,
          while only apo-PlzA can strand displace and unwind double-stranded RNA.
- review: genes/BORBU/plzA/plzA-ai-review.yaml
  annotation:
    term:
      id: GO:0003677
      label: DNA binding
    evidence_type: IDA
    original_reference_id: PMID:38527857
    review:
      summary: PlzA binds DNA in the presence of cyclic di-GMP.
      action: NEW
      reason: 'The primary study directly assays DNA binding and maps the principal
        nucleic-acid interaction to the N-terminal domain. The associated full manuscript
        identifies a B31 plzA construct. The broad DNA-binding term is as precise
        as warranted: sequence-selective transcription-factor activity and a specific
        transcriptional output are not inferred merely from DNA binding. No seeded
        row or replacement already covers this molecular function. This in vitro activity
        is retained as a supported molecular-function proposal but is not designated
        a conserved native core function while physiological targets and significance
        remain unresolved.'
      supported_by:
      - reference_id: PMID:38527857
        supporting_text: Here, we report that PlzA can bind DNA and RNA and that nucleic
          acid binding requires c-di-GMP
