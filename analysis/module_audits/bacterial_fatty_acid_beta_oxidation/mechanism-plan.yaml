evidence_corrections:
- Current GO0003995, GO0004466 and GO0070991 all specify ETF. An acceptor-unspecified proposed MF is necessary
  where dehydrogenation is established but physiological relay remains unknown.
- PMID32826213 identifies PP0368/PP0370 as stronger native KT2440 dehydrogenase candidates than PP1893;
  retain inferred versus native evidence separately.
- Dedicated PaaJ presence and a FadA beta-oxidation role do not alone exclude a secondary phenylacetate
  role. Review family over-propagation claims against actual node/member evidence.
- Pseudomonas fragi reconstitution with added acyl-CoA oxidase does not establish a matched native acyl-CoA
  dehydrogenase.
