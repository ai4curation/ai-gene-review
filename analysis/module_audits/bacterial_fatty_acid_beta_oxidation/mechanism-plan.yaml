taxon_decision: Bacteria is the shared reaction-level scope, supported by sampled Pseudomonadota, Actinomycetota
  and Bacillota. This is not a universal distribution or a family-hit sufficiency claim.
evidence_corrections:
- Current GO0003995, GO0004466 and GO0070991 all specify ETF. An acceptor-unspecified proposed MF is necessary
  where dehydrogenation is established but physiological relay remains unknown.
- PMID32826213 identifies PP0368/PP0370 as stronger native KT2440 dehydrogenase candidates than PP1893;
  retain inferred versus native evidence separately.
- Dedicated PaaJ presence and a FadA beta-oxidation role do not alone exclude a secondary phenylacetate
  role. Review family over-propagation claims against actual node/member evidence.
- Pseudomonas fragi reconstitution with added acyl-CoA oxidase does not establish a matched native acyl-CoA
  dehydrogenase.
- Bacillus FadB is a separate hydratase, but FadN carries both hydratase and dehydrogenase domains; distinct
  gene names do not establish mutually exclusive functions.
final_summary: Comparative beta-oxidation curation covers 19 COMPLETE gene reviews across seven species
  and three bacterial phyla, preserving all 211 original annotation payloads, both inherited NEW rows
  and 40 raw/provider files. Six supported additions yield 217 rows. Seventeen references, including four
  review articles, supply 21 mined findings. Four required reactions use ten alternatives and eight reviewed
  protein families. Unknown physiological electron acceptors, matched partner requirements, substrate
  limits and distinct native versus biochemical endpoints are explicit. The source-scoped checker uses
  the production module circuit with 54 cases and 12 mutation checks; passing cases do not replace the
  literature assessment. Final focused checks, full-corpus validation, a dedicated PR, independent review,
  CI and actual merge remain pending.
