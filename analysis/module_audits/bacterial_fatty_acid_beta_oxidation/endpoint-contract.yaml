status: IMPLEMENTED
scope: 'Evidence-bounded named exemplars, not arbitrary-proteome prediction. NOT_ESTABLISHED means missing
  proof, never biological impossibility. The actual module circuit is necessary but insufficient: exact
  member chemistry, compatible partners, substrate and assay context are additional requirements.'
profiles:
  ecoli:
    level: SUPPORTED_NATIVE_PARTICIPATION
    claim: E. coli fatty-acid degradation participation in the reported genetic backgrounds
    roles:
      fade_acyl_coa_dehydrogenase_activity: Q47146
      fadb_enoyl_coa_hydratase_activity: P21177
      fadb_hydroxyacyl_coa_dehydrogenase_activity: P21177
      fada_ketoacyl_coa_thiolase_activity: P21151
    required_conditions: &id001
    - reported_induced_genetic_background
    - substrate_transport_activation_and_redox_context
    source_ids:
    - PMID:12057976
    - PMID:16385050
    - PMID:368024
    require_whole_module: true
    limits:
    - No purified complete spiral or physiological ETF assignment.
    - No unlimited chain-range or complete acetyl-CoA yield claim.
  salmonella:
    level: SUPPORTED_COMPARATIVE_PARTICIPATION
    claim: LT2 homologous enzymes contribute to the measured fatty-acid utilization and acyl-CoA phenotype
    roles:
      fade_acyl_coa_dehydrogenase_activity: Q8ZRJ7
      fadb_enoyl_coa_hydratase_activity: Q9L6L5
      fadb_hydroxyacyl_coa_dehydrogenase_activity: Q9L6L5
      fada_ketoacyl_coa_thiolase_activity: P0A2H7
    required_conditions: &id003
    - native_LT2_acyl_CoA_observation_context
    - separate_E_coli_gene_exchange_evidence
    - substrate_transport_activation_and_redox_context
    source_ids:
    - PMID:16385050
    - file:ECOLI/fadE/fadE-source-analysis/enterobacterial-evidence.md
    require_whole_module: true
    limits:
    - Native LT2 acyl-CoA observations and E. coli complementation are separate experimental systems;
      this profile combines their evidence, not their assay conditions. Whole-cell phenotypes are not
      isolated-enzyme specificity or equivalent flux.
  putida:
    level: SUPPORTED_PATHWAY_INFERENCE
    claim: KT2440 PP1893 and PP2136/PP2137 support a qualified four-reaction pathway inference
    roles:
      fade_acyl_coa_dehydrogenase_activity: Q88LN6
      fadb_enoyl_coa_hydratase_activity: Q88L02
      fadb_hydroxyacyl_coa_dehydrogenase_activity: Q88L02
      fada_ketoacyl_coa_thiolase_activity: Q88L01
    required_conditions: &id005
    - compatible_native_pair_inferred
    - accepted_activated_substrate_and_cofactors
    source_ids:
    - PMID:32826213
    - file:PSEPK/fadE/fadE-uniprot.txt
    require_whole_module: true
    limits:
    - PP1893 is not the principal native dehydrogenase established by the cited fitness study.
    - No purified kinetics, stoichiometry, physiological electron acceptor or complete native flux claimed.
  bacillus:
    level: SUPPORTED_PATHWAY_INFERENCE
    claim: Strain168 FadE FadB FadN FadA supply a qualified four-reaction realization
    roles:
      bacillus_fade: O32176
      bacillus_fadb_hydratase: P94549
      bacillus_fadn_dehydrogenase: O32178
      bacillus_fada_thiolase: O32177
    required_conditions: &id007
    - native_genetic_context_and_downstream_induction
    - accepted_activated_substrate_and_cofactors
    source_ids:
    - PMID:17189250
    - file:BACSU/fadB/fadB-source-analysis/direct-assay.md
    require_whole_module: true
    limits:
    - ETF coupling is a supported native-system inference; direct purified FadE-to-ETF electron transfer
      remains unmeasured.
    - Purified FadN chemistry and universal substrate compatibility remain inferred.
  fragi_tfe:
    level: SUPPORTED_IN_VITRO_ACTIVITIES
    claim: Matched P. fragi alpha/beta complex supports hydration oxidation and thiolysis
    roles:
      fadb_enoyl_coa_hydratase_activity: P28793
      fadb_hydroxyacyl_coa_dehydrogenase_activity: P28793
      fada_ketoacyl_coa_thiolase_activity: P28790
    required_conditions: &id009
    - matched_alpha_beta_complex
    - supplied_assay_substrates_and_cofactors
    source_ids:
    - PMID:9396725
    - PMID:2361950
    require_whole_module: false
    limits:
    - The 1990 reconstruction uses added acyl-CoA oxidase and synthetase, not an identified native FadE.
    - Three measured activities do not by themselves establish native whole-route flux.
  mycobacterium_tfe:
    level: SUPPORTED_IN_VITRO_ACTIVITIES
    claim: H37Rv matched FadBA complex supports the reported medium/long-chain activities
    roles:
      fadb_enoyl_coa_hydratase_activity: O53872
      fadb_hydroxyacyl_coa_dehydrogenase_activity: O53872
      mycobacterial_fada_thiolase: O53871
    required_conditions: &id011
    - matched_alpha_beta_complex
    - reported_C10_C16_substrates_and_cofactors
    source_ids:
    - PMID:34371166
    - PMID:23496842
    require_whole_module: false
    limits:
    - C4 non-detection is assay-scoped and not evolutionary loss.
    - Native first-step dehydrogenase is not assigned; no autonomous complete route.
  pao1_fade1:
    level: SUPPORTED_IN_VITRO_REACTION
    claim: Wild-type PAO1 FadE1 dehydrogenates the assayed C16 substrate
    roles:
      pao1_fade1_fade2: Q9I612
    required_conditions: &id013
    - wild_type_PAO1_sequence
    - C16_acyl_CoA
    - ferrocenium_assay
    source_ids:
    - PMID:40057486
    - file:PSEAE/PA0506/PA0506-source-analysis/identity-bridge.md
    require_whole_module: false
    limits:
    - No physiological ETF, oxygen route, PAO1 growth phenotype or whole spiral inferred.
  pao1_fade2:
    level: SUPPORTED_IN_VITRO_REACTION
    claim: Wild-type PAO1 FadE2 dehydrogenates the assayed C8 substrate
    roles:
      pao1_fade1_fade2: Q9I610
    required_conditions: &id015
    - wild_type_PAO1_sequence
    - C8_acyl_CoA
    - ferrocenium_assay
    source_ids:
    - PMID:40057486
    - file:PSEAE/PA0506/PA0506-source-analysis/identity-bridge.md
    require_whole_module: false
    limits:
    - C16/C18 were reported NA; FadE1 C4 was ND and is not a negative measurement.
  bacillus_hydratase:
    level: SUPPORTED_IN_VITRO_REACTION
    claim: Purified strain168 FadB hydrates crotonyl-CoA
    roles:
      bacillus_fadb_hydratase: P94549
    required_conditions: &id017
    - strain168_recombinant_FadB
    - crotonyl_CoA_and_water
    source_ids:
    - file:BACSU/fadB/fadB-source-analysis/direct-assay.md
    require_whole_module: false
    limits:
    - The assayed product stereochemistry and broad chain range were not measured.
