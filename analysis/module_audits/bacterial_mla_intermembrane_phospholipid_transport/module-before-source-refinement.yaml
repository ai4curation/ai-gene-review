  knowledge_gaps:
  - gap_statement: Native net phospholipid flux and its context dependence remain unmeasured in many Mla-containing
      lineages despite strong retrograde biochemical evidence in E. coli.
    boundary: Use the experimentally supported retrograde interpretation for the characterized E. coli
      assays while retaining the assay and taxon limits; do not promote contested anterograde models to
      equivalent universal variants.
    gap_kind:
    - BIOLOGY
    status: OPEN
    provenance:
    - reference_id: PMID:34873038
      supporting_text: such anterograde movement is instead abolished by ATP hydrolysis
  - gap_statement: MlaA proteins occur with and without a canonical lipoprotein signal, porin partners
      vary by lineage, and MlaB's precise effect on MlaF stability and ATPase activity remains incompletely
      resolved (no STAS-domain NTP-binding or regulatory activity has been demonstrated for MlaB orthologs
      outside E. coli).
    boundary: Preserve the three-interface architecture without requiring a named OmpC/OmpF ortholog or
      assigning a catalytic function to MlaB.
    gap_kind:
