id: MODULE:bacterial_mla_intermembrane_phospholipid_transport
title: Bacterial Mla intermembrane phospholipid transport
description: Phospholipid transfer across the two-membrane envelope of Mla-containing diderm bacteria
  couples an outer-membrane MlaA interface, a soluble periplasmic MlaC carrier, and an ATP-coupled inner-membrane
  MlaF/E/D assembly. Characterized enterobacterial and pseudomonad systems include the MlaB accessory
  subunit, whereas a Bordetella pertussis realization lacks an identifiable MlaB homolog. MlaA-associated
  porins, carrier cargo and operon organization vary by lineage. Reconstituted Escherichia coli assays
  favor ATP-driven retrograde transfer from the outer-membrane interface toward the inner membrane; passive
  reverse exchange and contested anterograde interpretations do not establish a universal alternative
  transport direction.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:19383799
  title: An ABC transport system that maintains lipid asymmetry in the gram-negative outer membrane.
  statement: Genetic definition of the Mla pathway in Escherichia coli as a conserved multi-compartment
    system that preserves outer-membrane lipid asymmetry.
  supporting_text: This highly conserved pathway, which we have termed the Mla pathway for its role in
    preserving OM lipid asymmetry, is composed of at least 6 proteins and contains at least 1 component
    in each cellular compartment.
- &id001
  source_id: PMID:28388411
  title: Architectures of Lipid Transport Systems for the Bacterial Outer Membrane.
  statement: Purified MlaC binds both MlaFEDB and MlaA-OmpF by biolayer interferometry. The paper proposes
    lipid handoff in its model; those binding measurements are not themselves direct lipid-transfer assays.
  supporting_text: We observed robust and specific binding of both MlaFEDB
- source_id: PMID:27529189
  title: Defining key roles for auxiliary proteins in an ABC transporter that maintains bacterial outer
    membrane lipid asymmetry.
  statement: E. coli MlaD and MlaB support assembly and activity of the characterized MlaFEDB complex.
    This experiment does not establish a universal requirement for MlaB in other lineages.
  supporting_text: elucidate critical roles for auxiliary proteins, MlaD and MlaB, in the assembly and
    activity of the complex.
- &id005
  source_id: PMID:32602838
  title: Structure of MlaFB uncovers novel mechanisms of ABC transporter regulation.
  statement: MlaB supports E. coli MlaF stability and assembly. Overexpressed MlaF can rescue a tested
    MlaB deletion phenotype, so MlaB is an architectural/context requirement rather than an invariant
    catalytic requirement.
  supporting_text: can be rescued by overexpression of either WT MlaB or MlaF
  notes: Conditional complementation is not evidence that native MlaB is universally dispensable.
- &id004
  source_id: PMID:39080293
  title: Structure of the MlaC-MlaD complex reveals molecular basis of periplasmic phospholipid transport.
  statement: Reconstituted MlaA-to-MlaFEDB lipid movement depends on the MlaC carrier and compatible MlaC-MlaD
    interfaces. The reporter is NBD-PE; the source prose calling it phosphatidyl glycerol (PE) is inconsistent
    with the figure caption.
  supporting_text: NBD-PE FRET quenching by Rhodamine-PE
  notes: Use the figure-caption probe identity. This assay is not a measurement of native whole-cell flux
    in every lineage.
- source_id: PMID:33236984
  title: Structure of bacterial phospholipid transporter MlaFEDB with substrate bound.
  statement: Cryo-EM defines the MlaFEDB architecture and a continuous phospholipid pathway through MlaE
    and MlaD.
  supporting_text: A continuous transport pathway extends from the MlaE substrate-binding site, through
    the channel of MlaD, and into the periplasm.
- source_id: PMID:33837253
  title: The Pseudomonas aeruginosa substrate-binding protein Ttg2D functions as a general glycerophospholipid
    transporter across the periplasm.
  statement: Direct work on a Pseudomonas Ttg2D ortholog establishes a soluble periplasmic glycerophospholipid
    carrier.
  supporting_text: In Pseudomonas aeruginosa, Ttg2D is the soluble periplasmic phospholipid-binding component
    of an ABC transport system thought to be involved in maintaining the asymmetry of the outer membrane.
- &id008
  source_id: PMID:34873038
  title: ATP disrupts lipid-binding equilibrium to drive retrograde transport critical for bacterial outer
    membrane asymmetry.
  statement: Reconstituted transfer assays support ATP-enhanced retrograde transport while also detecting
    spontaneous bidirectional exchange.
  supporting_text: We further demonstrate that spontaneous PL transfer also occurs from MlaFEDB to MlaC,
    but such anterograde movement is instead abolished by ATP hydrolysis.
- source_id: GO:0120010
  title: intermembrane phospholipid transfer
  statement: The general process is phospholipid transfer between membranes. This module instantiates
    it across the diderm bacterial envelope; the GO term itself is not restricted to bacterial inner and
    outer membranes.
- source_id: file:PSEPK/ttg2D/ttg2D-uniprot.txt
  title: PSEPK Ttg2D/MlaC UniProt record
  statement: Q88P91 is a structurally characterized MlaC-family phospholipid-binding protein.
- source_id: file:PSEPK/mlaF/mlaF-uniprot.txt
  title: PSEPK MlaF UniProt record
  statement: Q88P94 is the ATPase subunit of the MlaFEDB inner-membrane complex.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_mla_intermembrane_phospholipid_transport__ppu02010-deep-research-openscientist.md
  title: OpenScientist PSEPK Mla pathway satisfiability research
  statement: Supports complete coverage by PP_0958-PP_0962 plus unlinked VacJ PP_2163, while distinguishing
    the PP_0140-PP_0142 Mce-like system and unresolved PP_1737 MlaA-family paralog from the core Mla route.
- source_id: file:modules/bacterial_mla_intermembrane_phospholipid_transport-deep-research-openscientist.md
  title: OpenScientist generic Mla module research
  statement: Supports the three-interface boundary, direction-neutral architecture, MlaB accessory role,
    MlaA lineage variation, and separation from parallel phospholipase-based outer-membrane repair.
- source_id: PMID:36459067
  title: 'Forward or backward, that is the question: phospholipid trafficking by the Mla system.'
  statement: Structural and biochemical synthesis supports the three-interface Mla architecture and favors
    retrograde transport in characterized systems. Predicted extended MlaD systems remain hypotheses,
    not demonstrated alternative realizers.
  supporting_text: the retrograde mode is the most widely accepted
  notes: Review article; read together with the later 2024 and 2025 transport assays.
- &id003
  source_id: PMID:38802775
  title: 'Maintenance of bacterial outer membrane lipid asymmetry: insight into MlaA.'
  statement: Comparative synthesis documents lineage-dependent operon organization, including the Bordetella
    pertussis locus without mlaB. This does not establish uniform gene content or essentiality across
    all diderm bacteria.
  supporting_text: In B. pertussis, all mla genes are found as an operon without mlaB
  notes: Review-level distribution claims are bounded by the primary Bordetella study rather than used
    as universal absence assertions.
- source_id: PMID:35850151
  title: Lipid Transport Across Bacterial Membranes.
  statement: The Mla carrier mechanism is distinct from envelope-spanning lipid tunnels and from the other
    lipid systems sharing MCE or ABC folds.
  supporting_text: The Mla system uses a ferry-like mechanism
  notes: 2022 review; its 2026 PMC deposit is not a new publication date.
- &id002
  source_id: PMID:40168124
  title: Following phospholipid transfer through the OmpF(3)-MlaA-MlaC lipid shuttle with native mass
    spectrometry.
  statement: Native mass spectrometry directly follows OmpF3-MlaA-mediated loading of MlaC and transient
    shuttle assembly. Endogenous MlaC is enriched in PG; this does not imply that the carrier accepts
    only PG.
  supporting_text: enhance loading of delipidated MlaC
  notes: The purified outer-membrane-to-carrier interface does not by itself reconstitute the complete
    inner-membrane step.
- &id006
  source_id: PMID:36518166
  title: Inactivation of the Mla system and outer-membrane phospholipase A results in disrupted outer-membrane
    lipid asymmetry and hypervesiculation in Bordetella pertussis.
  statement: Bordetella pertussis has a five-gene MlaF/E/D/A/C locus without an identifiable MlaB homolog.
    Native B213 MlaF/OMPLA perturbations support outer-membrane asymmetry maintenance; medium-dependent
    growth and surface-PE phenotypes do not directly measure transport direction.
  supporting_text: we were not able to identify an MlaB homologue in B. pertussis
  notes: Supplementary Table S1 identifies B213 as a streptomycin-resistant Tohama I derivative. The reference-locus
    bridge is established; exact experimental protein sequences have not all been compared.
- source_id: PMID:30638443
  title: The Acinetobacter baumannii Mla system and glycerophospholipid transport to the outer membrane.
  statement: An Acinetobacter baumannii study interpreted fractionation and isotope measurements as anterograde
    transport. Its interpretation is disputed by the later strain-background and fractionation controls
    in PMID:32880370.
  notes: Retained as contested primary evidence, not an equally established directional realization.
- source_id: PMID:32880370
  title: The Mla pathway in Acinetobacter baumannii has no demonstrable role in anterograde lipid transport.
  statement: Follow-up Acinetobacter baumannii experiments challenge the anterograde interpretation and
    identify an obgE strain-background confound. The OMV pulse-chase readout is a proxy rather than purified
    whole-pathway reconstitution.
  notes: Read alongside PMID:30638443; the correction does not establish native net flux in every Mla-containing
    organism.
notes: 'Audit in progress: member and family consultations remain pending. The Bacteria taxon is an occurrence
  envelope for this multi-interface mechanism, not a claim of universal bacterial presence. A complete
  realization requires matched MlaA, MlaC and MlaF/E/D components, suitable phospholipid cargo, ATP and
  compatible membrane/partner context. The MlaB-containing and MlaB-independent architectures are alternatives
  with positive evidence requirements; dropping B from an arbitrary incomplete panel does not establish
  the latter. E. coli OmpC/OmpF are characterized partners, not universally required named porins. Existing
  source-model and probe-identity errors are corrected in the evidence statements without rewriting cached
  papers. PSEPK PP_0140-PP_0142 and PP_1737 remain unassigned comparators rather than interchangeable
  Mla components. Chloroplast TGD and mycobacterial Mce/YrbE systems are distinct biological mechanisms
  despite overlapping subfamilies. PR #5076 overlaps module labels and MlaB grounding; its SF1 assertion
  is now supported for the sampled MlaB members by current official classification, superseding the older
  no-ID explanation without rewriting source caches. See the frozen preflight and baseline records for
  source access and strain boundaries.'
