id: P76506
gene_symbol: mlaA
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MlaA (formerly VacJ) is an outer-membrane lipoprotein that forms the
  outer-membrane interface of the Mla (maintenance of lipid asymmetry)
  intermembrane phospholipid transport system. After cleavage of its lipoprotein
  signal peptide and N-terminal lipidation, MlaA folds as a monomeric,
  mostly alpha-helical, doughnut-shaped protein embedded in the inner
  (periplasmic) leaflet of the outer membrane, where it associates stably with
  the trimeric porins OmpC and OmpF. A ridge around its central amphipathic,
  hydrophilic channel reaches toward the outer leaflet, allowing phospholipids
  that have become mislocalized in the lipopolysaccharide-rich outer leaflet to
  enter the channel, while inner-leaflet phospholipids are excluded. A gated
  beta-hairpin loop and C-terminal helices at the periplasmic opening of the
  channel recruit and dock the soluble carrier MlaC, juxtaposing the MlaA
  channel with the MlaC lipid-binding cavity so that phospholipid passes from
  the outer membrane into MlaC without an energy source at the outer membrane;
  MlaC then delivers it to the inner-membrane ABC transporter MlaFEDB. Loss of
  MlaA causes phospholipid accumulation in the outer leaflet, increased outer
  membrane permeability and sensitivity to SDS-EDTA, whereas the dominant
  gain-of-function allele mlaA* lets phospholipids flow into the outer leaflet,
  causing lipopolysaccharide increase, vesiculation and stationary-phase death.
