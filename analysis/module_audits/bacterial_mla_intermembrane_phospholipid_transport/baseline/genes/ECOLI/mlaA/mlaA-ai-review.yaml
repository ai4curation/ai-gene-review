- term:
    id: GO:0120010
    label: intermembrane phospholipid transfer
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: involved_in
  supporting_entities:
  - PANTHER:PTN001247191
  - UniProtKB:P76506
  review:
    summary: >-
      PAINT places intermembrane phospholipid transfer at the MlaA family
      ancestral node; E. coli MlaA is the experimentally characterized member
      (and appears in its own WITH/FROM as an expected seed).
    action: ACCEPT
    reason: >-
      MlaA directly performs the outer-membrane step of Mla-mediated phospholipid
      movement between the outer membrane and the inner membrane: it removes
      phospholipids from the outer leaflet through its channel and hands them to
      MlaC. This is participation, not mere requirement, so involved_in is
      appropriate. The term is direction-neutral, which suits the residual
      debate on anterograde versus retrograde net flux.
    supported_by:
    - reference_id: PMID:38092770
      supporting_text: in the first step, the OmpC-MlaA complex transfers PLs to the periplasmic chaperone MlaC, but mechanistic details are lacking.
    - reference_id: PMID:29038444
      supporting_text: The OM lipoprotein MlaA performs the first step in this process via an unknown mechanism that does not require external energy input.
