  review:
    summary: >-
      MlaA interacts specifically with the trimeric porin OmpF (and OmpC), as
      stated in the abstract of Chong et al. 2015; the MlaA-porin complex is the
      outer-membrane component of the Mla system.
    action: REMOVE
    reason: >-
      The interaction itself is well established (also by crystal and cryo-EM
      structures of MlaA-OmpF/OmpC, PMID:29038444, PMID:38092770), but bare
      protein binding carries no functional information. The biologically
      meaningful content (MlaA acting with porins in outer-membrane phospholipid
      removal) is captured by the cell outer membrane, intermembrane
      phospholipid transfer and the contributes_to phospholipid transfer
      activity core function. No more specific porin-binding molecular function
      term exists that would add information. Removal follows the protein
      binding policy and does not question the reported interaction.
    supported_by:
    - reference_id: PMID:26314242
      supporting_text: We show that the OM lipoprotein MlaA interacts specifically with OmpC and OmpF.
