core_functions:
- description: >-
    Outer-membrane phospholipid extraction and hand-off: in complex with the
    porins OmpC/OmpF, MlaA receives phospholipids from the outer leaflet of the
    outer membrane into its hydrophilic channel and transfers them to the
    docked periplasmic carrier MlaC, the outer-membrane half of the MlaA-MlaC
    phospholipid transfer step of the Mla pathway.
  contributes_to_molecular_function:
    id: GO:0120014
    label: phospholipid transfer activity
  directly_involved_in:
  - id: GO:0120010
    label: intermembrane phospholipid transfer
  locations:
  - id: GO:0009279
    label: cell outer membrane
  supported_by:
  - reference_id: PMID:38092770
    supporting_text: Our work provides critical mechanistic insights for the PL transfer reaction from OmpC-MlaA to MlaC for onward shuttling to the IM.
  - reference_id: PMID:29038444
    supporting_text: MlaA represents a lipid transport protein that selectively removes outer leaflet phospholipids to help maintain the essential barrier function of the bacterial OM.
  - reference_id: PMID:28388411
    supporting_text: Binding of MlaC to the lipid-bound MlaA-OmpC/OmpF complex results in lipid transfer to the hydrophobic pocket of MlaC, where it is protected from solvent.
suggested_questions:
- question: >-
    Does MlaA itself bind phospholipid with measurable affinity, or does it act
    only as a channel through which lipids partition into MlaC? (This decides
    whether GO:0005543 phospholipid binding should be asserted for MlaA.)
- question: >-
    Is there, or should there be, a GO activity term for outer-membrane
    phospholipid extraction by a membrane-embedded channel that hands lipid to a
    soluble carrier, distinct from GO:0120014 (which includes carriage through
    the aqueous phase)?
- question: What role, if any, do OmpC/OmpF play in lipid movement through MlaA beyond positioning and stabilizing it?
suggested_experiments:
- description: >-
    Reconstitute MlaA (wild type, MlaA*, and the hairpin-loop 3G3P variant) in
    asymmetric outer-membrane mimetic liposomes with labelled outer-leaflet
    phospholipid, and measure direct transfer to apo-MlaC with and without
    OmpC, to quantify MlaA-dependent extraction and its directionality.
  experiment_type: in vitro phospholipid transfer assay
