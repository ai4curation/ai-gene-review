sources:
  e_coli_transfer:
    path: publications/PMID_34873038.md
    quote: such anterograde movement is instead abolished by ATP hydrolysis
    scope: E. coli purified carrier/inner-membrane system; energetic retrograde bias, not native flux
      in every lineage.
  e_coli_outer:
    path: publications/PMID_40168124.md
    quote: enhance loading of delipidated MlaC
    scope: Direct E. coli outer-membrane-complex/carrier loading. Porin identity cannot be transferred
      universally.
  e_coli_assembly:
    path: publications/PMID_32602838.md
    quote: can be rescued by overexpression of either WT MlaB or MlaF
    scope: MlaB assembly role and conditional overexpressed-MlaF rescue; not native B dispensability.
  bordetella_locus:
    path: publications/PMID_36518166.md
    quote: we were not able to identify an MlaB homologue
    scope: Native B213 genetics and five-component locus. Tohama I reference bridge is lineage-qualified,
      not full experimental protein sequence equality.
  bordetella_identity:
    path: analysis/module_audits/bacterial_mla_intermembrane_phospholipid_transport/preflight/identity-proof.json
    scope: Official Tohama I loci and supplement B213 lineage bridge.
  bordetella_binding:
    path: analysis/module_audits/bacterial_mla_intermembrane_phospholipid_transport/new-member-consultation/bp3761-structure-proof.json
    scope: Exact mature BP3761 sequence in DPPE-bound deposited structures; binding, not native flux.
  psepk_context:
    path: genes/PSEPK/mlaE/mlaE-uniprot.txt
    quote: NCBIfam; TIGR00056; MlaE family lipid ABC transporter permease subunit
    scope: "Official target classification and ordered locus identifiers PP_0958\u2013PP_0962 plus VacJ\
      \ PP_2163 are checked against all six raw records. Specific domains/current family membership and\
      \ reviewed target structural evidence support a matched KT2440 inference. Generated provider prose\
      \ is discovery provenance, not independent evidence; ortholog primary assays do not become native\
      \ KT2440 measurements."
  pao1_cargo:
    path: publications/PMID_33837253.md
    quote: one cardiolipin
    scope: PAO1 Ttg2D cargo and native-host periplasmic recovery; heterologous structure bounded separately;
      no complete PAO1 panel or measured full native direction.
