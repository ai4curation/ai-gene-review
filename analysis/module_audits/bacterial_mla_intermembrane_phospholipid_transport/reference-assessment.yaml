- reference_id: PMID:36459067
  title: 'Forward or backward, that is the question: phospholipid trafficking by the Mla system.'
  publication_type: REVIEW
  full_text_available: true
  source_sha256: bfac91b85f5da11b4110a207a3b6562d663bf0364c0d62c0a9671f1c81c4a925
  findings:
  - module_path: /evidence/11
    statement: Structural and biochemical synthesis supports the three-interface Mla architecture and
      favors retrograde transport in characterized systems. Predicted extended MlaD systems remain hypotheses,
      not demonstrated alternative realizers.
    supporting_text: the retrograde mode is the most widely accepted
    limitations: Review article; read together with the later 2024 and 2025 transport assays.
