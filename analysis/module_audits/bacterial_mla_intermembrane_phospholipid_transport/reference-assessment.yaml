- reference_id: PMID:33837253
  title: The Pseudomonas aeruginosa substrate-binding protein Ttg2D functions as a general glycerophospholipid
    transporter across the periplasm.
  publication_type: PRIMARY_RESEARCH
  full_text_available: true
  source_sha256: d921c47bdbd18874bcd0360763b0853164d604f015f30b8ccb58114fba08c54d
  findings:
  - module_path: /evidence/6
    statement: PAO1 Ttg2D has direct structural, binding/reloading and native-host periplasmic cargo evidence.
      These data and its specific MlaC architecture support a carrier role; this study does not directly
      reconstitute membrane-to-membrane transfer or establish complete native pathway direction.
    supporting_text: In Pseudomonas aeruginosa, Ttg2D is the soluble periplasmic phospholipid-binding
      component of an ABC transport system thought to be involved in maintaining the asymmetry of the
      outer membrane.
    limitations: The deletion/complementing expression and native-host cargo measurements are distinct
      from the heterologously expressed crystallographic construct. Two diacyl phospholipids or one cardiolipin
      are supported cargo states; antibiotic efflux is not inferred.
  - module_path: /module/parts/1/node/evidence/0
    statement: PAO1 Ttg2D has direct structural, binding/reloading and native-host periplasmic cargo evidence.
      These data and its specific MlaC architecture support a carrier role; this study does not directly
