  findings:
  - module_path: /evidence/0
    statement: Genetic definition of the Mla pathway in Escherichia coli as a conserved multi-compartment
      system that preserves outer-membrane lipid asymmetry.
    supporting_text: This highly conserved pathway, which we have termed the Mla pathway for its role
      in preserving OM lipid asymmetry, is composed of at least 6 proteins and contains at least 1 component
      in each cellular compartment.
