- reference_id: PMID:36518166
  title: Inactivation of the Mla system and outer-membrane phospholipase A results in disrupted outer-membrane
    lipid asymmetry and hypervesiculation in Bordetella pertussis.
  publication_type: PRIMARY_RESEARCH
  full_text_available: true
  source_sha256: f71a7a2b3d152125963662b7672b9ea4d62b470d7ab458e4649b148b055d16c0
  findings:
  - module_path: /evidence/15
    statement: Bordetella pertussis has a five-gene MlaF/E/D/A/C locus without an identifiable MlaB homolog.
      Native B213 MlaF/OMPLA perturbations support outer-membrane asymmetry maintenance; medium-dependent
      growth and surface-PE phenotypes do not directly measure transport direction.
    supporting_text: we were not able to identify an MlaB homologue in B. pertussis
    limitations: Supplementary Table S1 identifies B213 as a streptomycin-resistant Tohama I derivative.
      The reference-locus bridge is established; exact experimental protein sequences have not all been
      compared.
