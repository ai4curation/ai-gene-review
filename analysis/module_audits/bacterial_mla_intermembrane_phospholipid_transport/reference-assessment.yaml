- reference_id: PMID:40168124
  title: Following phospholipid transfer through the OmpF(3)-MlaA-MlaC lipid shuttle with native mass
    spectrometry.
  publication_type: PRIMARY_RESEARCH
  full_text_available: true
  source_sha256: 3c4d1c3026c7891597f0a664d1d417d38027c1a4fb2be3e8f81da3cea22102a4
  findings:
  - module_path: /evidence/14
    statement: Native mass spectrometry directly follows OmpF3-MlaA-mediated loading of MlaC and transient
      shuttle assembly. Endogenous MlaC is enriched in PG; this does not imply that the carrier accepts
      only PG.
    supporting_text: We demonstrate that OmpF3–MlaA simultaneously recruits apo MlaC and phospholipids,
      thus greatly enhancing lipid transfer to MlaC in solution.
    limitations: The purified outer-membrane-to-carrier interface does not by itself reconstitute the
      complete inner-membrane step.
