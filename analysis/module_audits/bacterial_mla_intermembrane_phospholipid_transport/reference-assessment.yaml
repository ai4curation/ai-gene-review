  full_text_available: true
  source_sha256: 5a02f1f08d8f07af89c4424a4aa77e87b5b932bf90f1cc065556b1cb5c625640
  findings:
  - module_path: /module/parts/0/node/annotons/0/participant/protein_complex/evidence/0
    statement: Escherichia coli MlaA is an integral outer-membrane protein beside OmpC trimers that forms
