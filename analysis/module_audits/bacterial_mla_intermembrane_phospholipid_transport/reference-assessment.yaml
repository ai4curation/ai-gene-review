    statement: Comparative synthesis documents lineage-dependent operon organization, including the Bordetella
      pertussis locus without mlaB. This does not establish uniform gene content or essentiality across
      all diderm bacteria.
    supporting_text: In B. pertussis, all mla genes are found as an operon without mlaB
    limitations: Review-level distribution claims are bounded by the primary Bordetella study rather than
