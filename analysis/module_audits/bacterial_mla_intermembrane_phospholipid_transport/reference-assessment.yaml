- reference_id: PMID:30638443
  title: The Acinetobacter baumannii Mla system and glycerophospholipid transport to the outer membrane.
  publication_type: PRIMARY_RESEARCH
  full_text_available: true
  source_sha256: 5dc36cfeef9a31d4f0719263e44dfbcb9a5f97ae4f9d03a38152a6844b7741b5
  findings:
  - module_path: /evidence/16
    statement: An Acinetobacter baumannii study interpreted fractionation and isotope measurements as
      anterograde transport. Its interpretation is disputed by the later strain-background and fractionation
      controls in PMID:32880370.
    supporting_text: null
    limitations: Retained as contested primary evidence, not an equally established directional realization.
- reference_id: PMID:32880370
  title: The Mla pathway in Acinetobacter baumannii has no demonstrable role in anterograde lipid transport.
  publication_type: PRIMARY_RESEARCH
  full_text_available: true
  source_sha256: ada2850718080bf3f32142d51716f0ac71299beeb1782a9618925260c7e7a925
  findings:
  - module_path: /evidence/17
    statement: Follow-up Acinetobacter baumannii experiments challenge the anterograde interpretation
      and identify an obgE strain-background confound. The OMV pulse-chase readout is a proxy rather than
      purified whole-pathway reconstitution.
    supporting_text: null
    limitations: Read alongside PMID:30638443; the correction does not establish native net flux in every
      Mla-containing organism.
