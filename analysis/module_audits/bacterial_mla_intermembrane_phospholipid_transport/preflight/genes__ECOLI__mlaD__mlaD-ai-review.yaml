- term:
    id: GO:0120014
    label: phospholipid transfer activity
  evidence_type: IBA
  original_reference_id: GO_REF:0000033
  qualifier: enables
  supporting_entities:
  - PANTHER:PTN002120837
  - UniProtKB:P64604
  review:
    summary: >-
      Phylogenetic inference of phospholipid transfer activity for the MlaD clade,
      grounded in E. coli MlaD itself.
    action: MARK_AS_OVER_ANNOTATED
    reason: >-
      GO:0120014 is the activity of carrying a phospholipid between membranes, which
      in the Mla system is executed by the assembled MlaFEDB complex together with
      MlaC; no single MlaFEDB subunit performs it alone. The same reading is applied
      to all four subunits (MlaB, MlaD, MlaE, MlaF) - the enables-qualified row
      overstates the subunit's role, and the claim is recorded as contributes_to
      GO:0120014 in core_functions.
      MlaD does contact lipid, but that subunit-intrinsic activity is phospholipid
      binding (GO:0005543, accepted and core); binding the cargo does not make the
      subunit the carrier, so the line between enables and contributes_to falls at
      the complex for MlaD as for MlaE.
    supported_by:
    - reference_id: PMID:34873038
      supporting_text: >-
        We reveal that MlaC spontaneously transfers PLs to the IM transporter in an
        MlaD-dependent manner that can be further enhanced by coupled ATP
        hydrolysis.
    propagation_review:
      root_cause: TERM_SCOPING_PROBLEM
      failure_modes:
      - ROLE_CONFLATION
      source_entities:
      - source_id: PANTHER:PTN002120837
        source_label: PTN002120837
        source_status: SUPPORTS_SOURCE_BUT_NOT_TARGET
        comment: >-
          The node is seeded by P64604's own experimental row from a reconstituted
          MlaFEDB assay, which measures the activity of the whole complex.
          Propagating an enables-qualified subunit activity conflates the
          complex-level transfer with what MlaD itself does. MlaD does bind phospholipid (GO:0005543, accepted), but binding the cargo is not the same as carrying it between membranes, and contributes_to would be the appropriate relation for the complex-level transfer activity.
