- id: PMID:27529189
  title: Defining key roles for auxiliary proteins in an ABC transporter that maintains
    bacterial outer membrane lipid asymmetry.
  findings:
  - statement: MlaD forms SDS-resistant hexamers within MlaFEDB, binds phospholipids and modulates ATP hydrolysis.
    supporting_text: >-
      We further demonstrate that MlaD forms extremely stable hexamers within the
      complex, functions in substrate binding with strong affinity for PLs, and
      modulates ATP hydrolytic activity.
  - statement: Hexameric soluble MlaD binds phospholipid with at least four sites.
    supporting_text: >-
      Taken together, our data establish that hexameric sMlaD is a PL-binding
      complex with at least four binding sites.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read (Thong et al. 2016 eLife); E. coli MlaFEDB and sMlaD biochemistry.
