suggested_questions:
- question: >-
    Where exactly does phospholipid bind on the MlaD ring in the native complex:
    only in the central pore (as in E. coli MlaFEDB structures) or also between
    MCE protomers (as reported for Acinetobacter MlaFEDB)?
- question: >-
    How is ATP hydrolysis by cytoplasmic MlaF transmitted to the distant MlaD ring
    to drive lipid release from MlaC?
suggested_experiments:
- description: >-
    Site-specific photocrosslinking of radiolabelled phospholipids to MlaD
    pore-lining (Leu106/Leu107) and inter-protomer residues in vivo, combined with
    nanodisc MlaC-to-MlaFEDB transfer assays, to map lipid-binding sites on the
    MlaD ring and their role in transfer.
  experiment_type: in vivo photocrosslinking and reconstituted transfer assay
