    that binds glycerophospholipids in and around its central hydrophobic pore,
    docks the periplasmic carrier MlaC, and relays lipid between MlaC and the MlaE
    substrate pocket, contributing to the ATP-coupled phospholipid transfer
    activity of the complex.
