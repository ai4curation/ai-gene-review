id: P63386
gene_symbol: mlaF
product_type: PROTEIN
status: COMPLETE
taxon:
  id: NCBITaxon:83333
  label: Escherichia coli K-12
description: >-
  MlaF (YrbF) is the ATP-binding cassette (ABC) nucleotide-binding domain subunit of
  the inner-membrane MlaFEDB complex of the Mla (maintenance of lipid asymmetry)
  intermembrane phospholipid transport system. Two MlaF subunits sit on the
  cytoplasmic face of the inner membrane, docked onto the two MlaE permease subunits
  (with six MlaD MCE-domain subunits forming the periplasmic ring), and each MlaF binds
  one STAS-domain MlaB subunit that is required for MlaF stability and assembly into
  the complex. A C-terminal extension of MlaF wraps around the neighbouring MlaF-MlaB
  module and supports NBD dimerization. MlaF hydrolyzes ATP (a Walker A K47R mutant
  abolishes complex ATPase activity) to energize phospholipid movement between the
  periplasmic carrier MlaC and the inner membrane; in reconstituted systems ATP
  hydrolysis favours retrograde transfer from MlaC into the inner membrane, consistent
  with removal of phospholipids mislocalized to the outer leaflet of the outer
  membrane. Loss of MlaF causes phospholipid accumulation in the outer-membrane outer
  leaflet and SDS-EDTA sensitivity.
