suggested_questions:
- question: How is MlaF ATP hydrolysis coupled across the membrane to lipid release
    from the MlaD ring or the MlaE cavity, and does the coupling set net transport
    direction in vivo?
- question: Should ComplexPortal and PAINT represent MlaFEDB with GO:0043190 (ABC
    transporter complex) rather than GO:1990531, which is defined as a P-type ATPase
    flippase complex, and would a dedicated MlaFEDB complex term be warranted?
suggested_experiments:
- description: Measure leaflet-resolved phospholipid transfer by MlaFEDB containing
    Walker A (K47R) or Walker B MlaF variants, with and without MlaC, to separate the
    contributions of ATP binding and hydrolysis to transfer direction.
