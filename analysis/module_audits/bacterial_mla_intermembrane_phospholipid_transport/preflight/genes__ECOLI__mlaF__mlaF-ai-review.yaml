- id: PMID:34873038
  title: ATP disrupts lipid-binding equilibrium to drive retrograde transport critical
    for bacterial outer membrane asymmetry.
  findings:
  - statement: ATP hydrolysis by MlaFEDB drives net retrograde phospholipid transfer
      from MlaC.
    supporting_text: Therefore, we have shown that PLs equilibrate between MlaC and MlaFEDB,
      and ATP hydrolysis drives overall transport in the retrograde direction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text; radiolabelled phospholipid transfer assays between MlaC
      and MlaFEDB.
