# Counterfactuals change only in-memory copies of the current BP3761 review.
# Real gene records, the module and original fixtures remain immutable.
cases:
- id: actual_pe_binding_and_transfer_core
  binding: GO:0008429
  keep_transfer_core: true
  expected: true
- id: generic_lipid_binding_even_with_transfer_core
  binding: GO:0008289
  keep_transfer_core: true
  expected: false
  expected_failure: declared_unit_activity
  bypass_function_must_rescue: true
- id: pe_binding_with_transport_process
  binding: GO:0008429
  keep_transfer_core: false
  expected: true
- id: generic_lipid_binding_with_transport_process
  binding: GO:0008289
  keep_transfer_core: false
  expected: false
  expected_failure: reviewed_activity
  bypass_function_must_rescue: true
- id: pe_binding_without_transport_process
  binding: GO:0008429
  keep_transfer_core: false
  remove_transport_process: true
  expected: false
  expected_failure: reviewed_activity
- id: pe_binding_wrong_member_compartment
  binding: GO:0008429
  keep_transfer_core: false
  location: GO:0005737
  expected: false
  expected_failure: reviewed_activity
- id: pe_binding_carrier_without_native_partners
  binding: GO:0008429
  keep_transfer_core: false
  keep_roles: [C]
  expected: false
  expected_failure: missing_role:A
- id: pe_binding_cross_panel_carrier
  binding: GO:0008429
  keep_transfer_core: false
  panel: ECOLI
  replace:
    role: C
    donor_panel: BORPE
  expected: false
  expected_failure: matched_panel
- id: pe_binding_without_source_support
  binding: GO:0008429
  keep_transfer_core: false
  mask:
    C: [source]
  expected: false
  expected_failure: source_support
