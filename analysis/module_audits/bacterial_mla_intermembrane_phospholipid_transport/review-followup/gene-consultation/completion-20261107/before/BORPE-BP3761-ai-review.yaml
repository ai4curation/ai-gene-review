- id: PMID:36518166
  title: Inactivation of the Mla system and outer-membrane phospholipase A results in disrupted outer-membrane
    lipid asymmetry and hypervesiculation in Bordetella pertussis.
  findings:
  - statement: PMID36518166 identifies BP3757–BP3761 as the MlaF/E/D/A/C locus in the Tohama I reference.
      The native experiments used B213, a streptomycin-resistant Tohama I derivative identified in Supplementary
      TableS1; complete experimental B213 protein sequences were not independently compared. Only MlaF
      was directly perturbed in this operon, and the clearest surface-PE defect involves combined mlaF/pldA
      loss. The source therefore supports a lineage-qualified Mla pathway, not five separate target assays
      or a measured native transport direction.
    supporting_text: All mla genes found are adjacent to each other and probably form an operon
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PMID36518166 identifies BP3757–BP3761 as the MlaF/E/D/A/C locus in the Tohama I reference.
      The native experiments used B213, a streptomycin-resistant Tohama I derivative identified in Supplementary
      TableS1; complete experimental B213 protein sequences were not independently compared. Only MlaF
      was directly perturbed in this operon, and the clearest surface-PE defect involves combined mlaF/pldA
