- id: PMID:34873038
  title: ATP disrupts lipid-binding equilibrium to drive retrograde transport critical for bacterial outer
    membrane asymmetry.
  findings:
  - statement: Purified E. coli MlaC/MlaFEDB shows spontaneous exchange with ATP-enhanced retrograde movement.
      This is ortholog mechanism evidence, not a Bordetella directional reconstitution.
    supporting_text: We reveal that MlaC spontaneously transfers PLs to the IM transporter in an MlaD-dependent
      manner that can be further enhanced by coupled ATP hydrolysis.
  reference_review:
    relevance: HIGH
