  label: Bordetella pertussis Tohama I
description: BP3759 is the MlaD-family MCE component of the Bordetella pertussis Mla system. Its periplasm-facing
  domain is predicted to bind phospholipids and participate in the handoff between the soluble MlaC carrier
  and the inner-membrane MlaEF machinery. The protein has an N-terminal hydrophobic anchor and a conserved
  MlaD domain; its assembly and transport role are inferred from the native locus and characterized homologs.
