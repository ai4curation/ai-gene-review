- description: Contributes the membrane component of MlaFED-mediated phospholipid transfer. MlaE signatures,
    multiple membrane-spanning segments and the native operon support this conserved role; isolated BP3758
    transport and an exact Bordetella complex stoichiometry have not been measured.
  supported_by:
