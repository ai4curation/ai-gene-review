  label: Bordetella pertussis Tohama I
description: BP3758 is the MlaE-family integral inner-membrane component of the Bordetella pertussis Mla
  system. It provides the membrane interface for phospholipid handling by the MlaFED ABC complex, coupled
  to the MlaF ATPase and periplasm-facing MlaD. Its role is inferred from conserved MlaE architecture
  and the native Mla locus; an identifiable MlaB subunit is absent in this lineage.
