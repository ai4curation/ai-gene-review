- id: PMID:33837253
  title: The Pseudomonas aeruginosa substrate-binding protein Ttg2D functions as a general glycerophospholipid
    transporter across the periplasm.
  findings:
  - statement: The exact PAO1 Ttg2D sequence is characterized structurally and by native/denaturing mass
      spectrometry. The homologously expressed His-tagged protein was purified from the PAO1 periplasm,
      and its cargo includes two diacyl phospholipids or one cardiolipin. Heterologous crystallography
      is distinguished from that native-host preparation; the complete pathway direction and drug transport
      are not measured.
    supporting_text: 'Native and

      denaturing mass spectrometry experiments confirm that Ttg2D, produced both

      heterologously and homologously and isolated from the periplasm, can carry two

      diacyl glycerophospholipids as well as one cardiolipin.'
  - statement: The complementing tagged target was directly recovered from the PAO1 periplasm; the crystallographic
      preparation was separately produced in E. coli.
    supporting_text: Under these conditions, the mature Ttg2DPae could be purified from the periplasm
      in sufficient amount and purity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The exact PAO1 Ttg2D sequence is characterized structurally and by native/denaturing
