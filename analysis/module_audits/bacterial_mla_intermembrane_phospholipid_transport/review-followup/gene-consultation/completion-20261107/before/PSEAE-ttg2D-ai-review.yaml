  label: Pseudomonas aeruginosa PAO1
description: Ttg2D is a soluble periplasmic phospholipid carrier in the Pseudomonas aeruginosa PAO1 Ttg2/Mla
  envelope-lipid system. Its large hydrophobic cavity accommodates two diacyl glycerophospholipids or
  one cardiolipin. The carrier is inferred to shuttle lipid between membrane-associated partners and supports
  envelope barrier function; effects on antibiotic susceptibility do not imply direct antibiotic export.
core_functions:
- description: Binds glycerophospholipid cargo in a cavity accommodating four acyl chains. Target crystallography
    and mass spectrometry directly establish lipid binding, including native-host periplasmic cargo; purified
    binding/reloading does not determine whole-pathway direction.
  supported_by:
