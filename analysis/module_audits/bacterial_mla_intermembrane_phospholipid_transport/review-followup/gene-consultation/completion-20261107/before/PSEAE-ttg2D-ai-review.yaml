  review:
    summary: Target crystallography and mass spectrometry demonstrate phospholipid binding by PAO1 Ttg2D.
    action: NEW
    reason: The protein itself binds phospholipid. The study combines a mature-target structure with cargo
      recovered from His-tagged Ttg2D expressed in a PAO1 deletion strain and purified from its periplasm,
      plus in vitro cardiolipin loading. Diverse PG/PE/cardiolipin cargo supports phospholipid binding
      without a claim of exclusive headgroup specificity. The zero-row source contains no competing parent
      or descendant annotation; this molecular-function proposal does not infer a process from necessity
      or claim measured membrane-to-membrane flux.
    supported_by:
    - reference_id: PMID:33837253
      supporting_text: 'Native and

        denaturing mass spectrometry experiments confirm that Ttg2D, produced both

        heterologously and homologously and isolated from the periplasm, can carry two

        diacyl glycerophospholipids as well as one cardiolipin.'
