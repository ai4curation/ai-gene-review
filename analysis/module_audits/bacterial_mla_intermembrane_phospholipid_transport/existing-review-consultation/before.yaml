      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: The report directly supports PP_2163 as the outer-membrane VacJ/MlaA
          interface of an intact KT2440 Mla pathway while documenting that lipidation,
          porin partnership, and PP_2163-specific wet-lab evidence remain unresolved.
      findings:
      - statement: The report supports an outer-membrane MlaA/VacJ lipid-handling
          role from conserved-family and ortholog evidence, but found no direct experimental
          characterization of PP_2163.
      - statement: Net transport direction, N-terminal lipidation, and the identity
          of any KT2440 porin partner remain unresolved for this specific protein.
    core_functions:
    - description: Outer-membrane phospholipid handling in the Mla intermembrane transfer
        system. Support is MlaA family classification (Pfam MlaA, InterPro IPR007428)
        plus a SignalP-predicted signal peptide (1..31) consistent with export to
        the envelope; the outer-membrane MlaA-OmpC/F role is from the homologous Mla
        system (PMID:33236984), not a KT2440 experiment.
