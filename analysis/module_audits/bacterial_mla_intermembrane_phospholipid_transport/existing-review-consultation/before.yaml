      review:
        summary: Direct interaction of MlaD with the periplasmic lipid carrier MlaC
          (P0ADV7) measured by biolayer interferometry.
        action: REMOVE
        reason: Bare protein binding carries no functional information. The MlaD-MlaC
          interaction is a functionally important docking step for lipid hand-off,
          but it is better expressed through the phospholipid binding and phospholipid
          transfer activity annotations (and, at the model level, as MlaC input to
          the MlaFEDB activity) than by a generic binding term. Removal does not dispute
          the reported interaction.
        supported_by:
        - reference_id: PMID:28388411
          supporting_text: as well as a direct interaction between MlaC and MlaD
