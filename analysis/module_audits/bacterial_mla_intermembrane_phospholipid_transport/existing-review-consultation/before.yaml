  genes/ECOLI/mlaC/mlaC-ai-review.yaml:
    id: P0ADV7
    gene_symbol: mlaC
    product_type: PROTEIN
    status: COMPLETE
    taxon:
      id: NCBITaxon:83333
      label: Escherichia coli K-12
    description: MlaC (formerly YrbC) is the soluble periplasmic phospholipid carrier
      of the Mla (maintenance of lipid asymmetry) intermembrane phospholipid transport
      system. Exported by a cleaved N-terminal signal peptide, it adopts a mixed alpha/beta
      fold related to the NTF2/cystatin superfamily, with a deep hydrophobic pocket
      that accommodates the two acyl chains of a diacyl phospholipid while leaving
      the head group solvent-exposed, so binding shows little head-group selectivity;
      a pivoting beta-sheet opens and closes the pocket between apo and lipid-loaded
      states. MlaC docks transiently on the periplasmic base of the outer-membrane
      MlaA-OmpC/OmpF complex and on the MlaD hexamer of the inner-membrane ABC transporter
      MlaFEDB, and shuttles phospholipid across the aqueous periplasm between them.
      Purified MlaC exchanges phospholipids spontaneously with MlaD/MlaFEDB, and ATP
      hydrolysis by MlaFEDB drives net movement from MlaC into the inner membrane,
      the retrograde direction that removes phospholipids mislocalized in the outer
      leaflet of the outer membrane. Loss of MlaC causes phospholipid accumulation
      in the outer leaflet, increased outer membrane permeability and sensitivity
      to SDS-EDTA.
    existing_annotations:
    - term:
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:28388411
      qualifier: enables
      supporting_entities:
      - UniProtKB:P64604
      review:
        summary: Biolayer interferometry shows direct binding of MlaC to MlaD (P64604),
          the MCE-domain subunit of the inner-membrane MlaFEDB transporter.
        action: REMOVE
        reason: The MlaC-MlaD interaction is real and functionally central (it is
          the docking step for phospholipid exchange, later solved structurally in
          PMID:39080293), but generic protein binding conveys no function. The informative
          content is captured by the phospholipid transfer activity and phospholipid
          binding terms proposed below and by intermembrane phospholipid transfer.
          Removal follows the protein binding policy and does not question the interaction.
        supported_by:
        - reference_id: PMID:28388411
          supporting_text: We observed robust and specific binding of both MlaFEDB
            (Figure 4F) and MlaA-OmpF assemblies (Figure 4G) to MlaC, as well as a
            direct interaction between MlaC and MlaD (Figure S4I).
    - term:
        id: GO:0015914
        label: phospholipid transport
      evidence_type: IMP
      original_reference_id: PMID:19383799
      qualifier: acts_upstream_of_or_within
      review:
        summary: Malinverni & Silhavy 2009 showed that mla mutants, including mlaC,
          accumulate phospholipid in the outer leaflet of the outer membrane, and
          proposed the Mla pathway as an intermembrane phospholipid trafficking system.
        action: MODIFY
        reason: Correct but general. The transport MlaC performs is specifically the
          movement of phospholipid between the two envelope membranes through the
          periplasm, which is GO:0120010 intermembrane phospholipid transfer (an is_a
          descendant of phospholipid transport), already carried by MlaC via IBA and
          IDA. The cached paper is abstract-only, but UniProt cites it with experimental
          evidence for the mlaC disruption phenotype, and the refinement does not
          challenge the curator's claim.
        proposed_replacement_terms:
        - id: GO:0120010
          label: intermembrane phospholipid transfer
        supported_by:
        - reference_id: PMID:19383799
          supporting_text: We propose that the Mla pathway constitutes a bacterial
            intermembrane PL trafficking system.
        - reference_id: file:ECOLI/mlaC/mlaC-uniprot.txt
          supporting_text: Mutation leads to accumulation of phospholipid in the outer
            leaflet of the outer membrane and increased outer membrane permeability.
