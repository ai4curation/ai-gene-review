  genes/ECOLI/mlaD/mlaD-ai-review.yaml:
    id: P64604
    gene_symbol: mlaD
    product_type: PROTEIN
    status: COMPLETE
    taxon:
      id: NCBITaxon:83333
      label: Escherichia coli K-12
    description: MlaD is the MCE (mammalian cell entry) domain subunit of the MlaFEDB
      ATP-binding cassette complex of the Mla (maintenance of outer membrane lipid
      asymmetry) intermembrane phospholipid transport system. It is a single-pass,
      signal-anchored inner-membrane protein whose periplasmic MCE domain self-assembles
      into a highly stable homohexameric ring with a central hydrophobic pore; six
      MlaD protomers sit atop the MlaE permease dimer in the MlaF2E2D6B2 complex,
      so that the MlaD pore and the MlaE substrate pocket form a continuous lipid-binding
      pathway into the periplasm. The periplasmic domain binds glycerophospholipids
      (with a preference for phosphatidylglycerol in co-purification), docks the soluble
      lipid carrier MlaC, and is required for phospholipid exchange between MlaC and
      the inner-membrane complex. MlaD also restrains and tunes the ATPase activity
      of MlaFEB, coupling ATP hydrolysis to productive, net retrograde (outer-to-inner
      membrane) phospholipid transfer. Loss of MlaD leads to phospholipid accumulation
      in the outer leaflet of the outer membrane and sensitivity to SDS-EDTA.
    existing_annotations:
    - term:
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:28388411
      qualifier: enables
      supporting_entities:
