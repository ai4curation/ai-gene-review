reviews:
  genes/ECOLI/mlaA/mlaA-ai-review.yaml:
    id: P76506
    gene_symbol: mlaA
    product_type: PROTEIN
    status: COMPLETE
    taxon:
      id: NCBITaxon:83333
      label: Escherichia coli K-12
    description: MlaA (formerly VacJ) is an outer-membrane lipoprotein that forms
      the outer-membrane interface of the Mla (maintenance of lipid asymmetry) intermembrane
      phospholipid transport system. After cleavage of its lipoprotein signal peptide
      and N-terminal lipidation, MlaA folds as a monomeric, mostly alpha-helical,
      doughnut-shaped protein embedded in the inner (periplasmic) leaflet of the outer
      membrane, where it associates stably with the trimeric porins OmpC and OmpF.
      A ridge around its central amphipathic, hydrophilic channel reaches toward the
      outer leaflet, allowing phospholipids that have become mislocalized in the lipopolysaccharide-rich
      outer leaflet to enter the channel, while inner-leaflet phospholipids are excluded.
      A gated beta-hairpin loop and C-terminal helices at the periplasmic opening
      of the channel recruit and dock the soluble carrier MlaC, juxtaposing the MlaA
      channel with the MlaC lipid-binding cavity so that phospholipid passes from
      the outer membrane into MlaC without an energy source at the outer membrane;
      MlaC then delivers it to the inner-membrane ABC transporter MlaFEDB. Loss of
      MlaA causes phospholipid accumulation in the outer leaflet, increased outer
      membrane permeability and sensitivity to SDS-EDTA, whereas the dominant gain-of-function
      allele mlaA* lets phospholipids flow into the outer leaflet, causing lipopolysaccharide
      increase, vesiculation and stationary-phase death.
    existing_annotations:
    - term:
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:26314242
      qualifier: enables
      supporting_entities:
      - UniProtKB:P02931
      review:
        summary: MlaA interacts specifically with the trimeric porin OmpF (and OmpC),
          as stated in the abstract of Chong et al. 2015; the MlaA-porin complex is
          the outer-membrane component of the Mla system.
        action: REMOVE
        reason: The interaction itself is well established (also by crystal and cryo-EM
          structures of MlaA-OmpF/OmpC, PMID:29038444, PMID:38092770), but bare protein
          binding carries no functional information. The biologically meaningful content
          (MlaA acting with porins in outer-membrane phospholipid removal) is captured
          by the cell outer membrane, intermembrane phospholipid transfer and the
          contributes_to phospholipid transfer activity core function. No more specific
          porin-binding molecular function term exists that would add information.
          Removal follows the protein binding policy and does not question the reported
          interaction.
        supported_by:
        - reference_id: PMID:26314242
          supporting_text: We show that the OM lipoprotein MlaA interacts specifically
            with OmpC and OmpF.
    - term:
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:26314242
      qualifier: enables
      supporting_entities:
      - UniProtKB:P06996
      review:
        summary: MlaA interaction with osmoporin OmpC, the porin that functionally
          partners MlaA in maintaining outer-membrane lipid asymmetry.
        action: REMOVE
        reason: 'As for the OmpF row: the OmpC-MlaA complex is real and functionally
          important (removing OmpC phenocopies mlaA loss in stationary phase), but
          generic protein binding is uninformative. The function of the complex is
          represented by the process and core-function annotations. Removal does not
          dispute the interaction.'
        supported_by:
        - reference_id: PMID:26314242
          supporting_text: Removing OmpC, but not OmpF, causes accumulation of PLs
            in the outer leaflet of the OM in stationary phase, as was previously
            observed for MlaA.
    - term:
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:28388411
      qualifier: enables
      supporting_entities:
      - UniProtKB:P02931
      review:
        summary: Ekiert et al. 2017 purified MlaA as a stable complex with OmpF and
          used it to show that MlaC binds the outer-membrane MlaA-OmpF assembly.
        action: REMOVE
        reason: Co-purification of MlaA with OmpF is a genuine physical association,
          but generic protein binding conveys no function. The informative content
          of this paper for MlaA (an MlaA-OmpF complex that MlaC docks onto for lipid
          exchange) is captured by the intermembrane phospholipid transfer process
          and the contributes_to phospholipid transfer activity core function.
        supported_by:
        - reference_id: PMID:28388411
          supporting_text: We over-expressed and purified MlaA from E. coli, which
            co-purified as a stable complex with OmpF under our culture conditions,
            as confirmed by mass spectrometry.
    - term:
        id: GO:0009279
        label: cell outer membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000044
      qualifier: located_in
      supporting_entities:
      - UniProtKB-SubCell:SL-0040
      review:
        summary: MlaA is an outer-membrane lipoprotein embedded in the inner leaflet
          of the outer membrane in complex with OmpC/OmpF.
        action: ACCEPT
        reason: Correct and appropriately specific. The outer-membrane location is
          supported experimentally (porin association that is sufficient to target
          non-lipidated MlaA to the OM; crystal structure placing MlaA in the inner
          leaflet of the OM).
        supported_by:
        - reference_id: PMID:26314242
          supporting_text: This interaction is sufficient to localize MlaA lacking
            its lipid anchor to the OM.
        - reference_id: PMID:29038444
          supporting_text: MlaA is a monomeric α-helical OM protein that functions
            as a phospholipid translocation channel
    - term:
        id: GO:0009279
        label: cell outer membrane
      evidence_type: RCA
      original_reference_id: PMID:12876315
      qualifier: located_in
      review:
        summary: LipoP-based prediction of a lipoprotein signal peptide; for MlaA
          the predicted outer-membrane lipoprotein location is confirmed experimentally.
        action: ACCEPT
        reason: The computational prediction (SPaseII lipoprotein signal peptide,
          lipidated Cys18) agrees with experimental localization of MlaA to the outer
          membrane, so the annotation is correct and consistent with the IEA row for
          the same term.
        supported_by:
        - reference_id: PMID:12876315
          supporting_text: The results for Escherichia coli K12 were compared with
            new experimental data, and the predictions by the HMM agree well with
            the experimentally verified lipoproteins.
        - reference_id: PMID:29848551
          supporting_text: we established that MlaA interacts extensively with OmpC
            and is located entirely within the lipid bilayer
    - term:
        id: GO:0016020
        label: membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: located_in
      supporting_entities:
      - InterPro:IPR007428
      review:
        summary: InterPro (MlaA family) mapping to the generic membrane term; correct
          but far less specific than the known outer-membrane location.
        action: MODIFY
        reason: MlaA is specifically an outer-membrane protein, already annotated
          to GO:0009279 cell outer membrane (ACCEPT above); the informative descendant
          should replace the generic membrane term.
        proposed_replacement_terms:
        - id: GO:0009279
          label: cell outer membrane
        supported_by:
        - reference_id: PMID:29038444
          supporting_text: forming a ~20-Å-thick doughnut embedded in the inner leaflet
            of the OM with a central, amphipathic pore
    - term:
        id: GO:0120010
        label: intermembrane phospholipid transfer
      evidence_type: IBA
      original_reference_id: GO_REF:0000033
      qualifier: involved_in
      supporting_entities:
      - PANTHER:PTN001247191
      - UniProtKB:P76506
      review:
        summary: PAINT places intermembrane phospholipid transfer at the MlaA family
          ancestral node; E. coli MlaA is the experimentally characterized member
          (and appears in its own WITH/FROM as an expected seed).
        action: ACCEPT
        reason: 'MlaA directly performs the outer-membrane step of Mla-mediated phospholipid
          movement between the outer membrane and the inner membrane: it removes phospholipids
          from the outer leaflet through its channel and hands them to MlaC. This
          is participation, not mere requirement, so involved_in is appropriate. The
          term is direction-neutral, which suits the residual debate on anterograde
          versus retrograde net flux.'
        supported_by:
        - reference_id: PMID:38092770
          supporting_text: in the first step, the OmpC-MlaA complex transfers PLs
            to the periplasmic chaperone MlaC, but mechanistic details are lacking.
        - reference_id: PMID:29038444
          supporting_text: The OM lipoprotein MlaA performs the first step in this
            process via an unknown mechanism that does not require external energy
            input.
    - term:
        id: GO:0120010
        label: intermembrane phospholipid transfer
      evidence_type: IDA
      original_reference_id: PMID:26314242
      qualifier: acts_upstream_of_or_within
      review:
        summary: Chong et al. 2015 establish that the OmpC-MlaA complex is the outer-membrane
          component of the Mla system and propose that it removes phospholipids directly
          from the outer leaflet.
        action: ACCEPT
        reason: Consistent with the IBA row and with later structural and biochemical
          work showing MlaA-to-MlaC phospholipid transfer at the outer membrane (PMID:38092770).
          Only the abstract is cached, but the abstract itself states the role of
          the OmpC-MlaA complex in the Mla pathway, and the curator-assigned process
          is clearly correct for MlaA.
        supported_by:
        - reference_id: PMID:26314242
          supporting_text: the OmpC-MlaA complex may function to remove PLs directly
            from the outer leaflet to maintain OM lipid asymmetry
        - reference_id: PMID:38092770
          supporting_text: Using in vivo photo- and disulfide-crosslinking, we demonstrate
            that MlaC interacts with MlaA directly at its periplasmic base, in a manner
            that juxtaposes the lipid binding cavity of MlaC with the hydrophilic
            channel of MlaA.
    references:
    - id: GO_REF:0000002
      title: Gene Ontology annotation through association of InterPro records with
        GO terms
      findings: []
    - id: GO_REF:0000033
      title: Annotation inferences using phylogenetic trees
      findings: []
    - id: GO_REF:0000044
      title: Gene Ontology annotation based on UniProtKB/Swiss-Prot Subcellular Location
        vocabulary mapping, accompanied by conservative changes to GO terms applied
        by UniProt
      findings: []
    - id: PMID:12876315
      title: Prediction of lipoprotein signal peptides in Gram-negative bacteria.
      findings:
      - statement: LipoP predicts SPaseII-cleaved lipoprotein signal peptides; the
          basis of the RCA outer-membrane annotation.
      reference_review:
        relevance: LOW
        correctness: VERIFIED
        review_notes: Generic LipoP method paper (abstract only cached); supports
          the lipoprotein prediction, not MlaA-specific function.
    - id: PMID:19383799
      title: An ABC transport system that maintains lipid asymmetry in the gram-negative
        outer membrane.
      findings:
      - statement: Defines the Mla pathway (including MlaA/VacJ) as preventing phospholipid
          accumulation in the outer leaflet of the OM.
        supporting_text: We have identified an ABC transport system in Escherichia
          coli with predicted import function that serves to prevent PL accumulation
          in the outer leaflet of the OM.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Founding Mla paper (Malinverni & Silhavy 2009); abstract only
          cached. UniProt cites it (ECO:0000269) for the mlaA disruption phenotype.
    - id: PMID:26314242
      title: Osmoporin OmpC forms a complex with MlaA to maintain outer membrane lipid
        asymmetry in Escherichia coli.
      findings:
      - statement: MlaA interacts specifically with OmpC and OmpF, and the porin interaction
          suffices to target unlipidated MlaA to the OM.
        supporting_text: This interaction is sufficient to localize MlaA lacking its
          lipid anchor to the OM.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Abstract only cached; abstract explicitly states the MlaA-OmpC/OmpF
          interaction and the proposed outer-leaflet phospholipid removal role.
    - id: PMID:28388411
      title: Architectures of Lipid Transport Systems for the Bacterial Outer Membrane.
      findings:
      - statement: Purified MlaA forms a stable complex with OmpF that binds MlaC;
          model in which MlaA-OmpC/F extracts lipids and hands them to MlaC.
        supporting_text: Binding of MlaC to the lipid-bound MlaA-OmpC/OmpF complex
          results in lipid transfer to the hydrophobic pocket of MlaC, where it is
          protected from solvent.
      reference_review:
        relevance: MEDIUM
        correctness: VERIFIED
        review_notes: Full text cached; MlaA-specific content is the MlaA-OmpF purification
          and binding to MlaC; the transfer step is presented as a model.
    - id: PMID:29038444
      title: Structural basis for maintenance of bacterial outer membrane lipid asymmetry.
      findings:
      - statement: Crystal structures and MD show MlaA is a monomeric alpha-helical
          OM protein in the inner leaflet with a central amphipathic pore that selectively
          accepts outer-leaflet phospholipids.
        supporting_text: MlaA represents a lipid transport protein that selectively
          removes outer leaflet phospholipids to help maintain the essential barrier
          function of the bacterial OM.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Abellón-Ruiz et al. 2017 Nat Microbiol, PubMed-verified via
          esearch; abstract only cached (fetched for this review).
    - id: PMID:29848551
      title: The architecture of the OmpC-MlaA complex sheds light on the maintenance
        of outer membrane lipid asymmetry in Escherichia coli.
      findings:
      - statement: MlaA sits entirely within the OM bilayer bound to OmpC and forms
          a hydrophilic channel gated by a hairpin loop.
        supporting_text: In addition, MlaA forms a hydrophilic channel, likely enabling
          PL translocation across the OM.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Yeow et al. 2018 JBC; full text cached (fetched for this review).
    - id: PMID:38092770
      title: Molecular mechanism of phospholipid transport at the bacterial outer
        membrane interface.
      findings:
      - statement: MlaC docks on the periplasmic base of MlaA, juxtaposing the MlaA
          channel with the MlaC lipid-binding cavity; MlaC binding opens the MlaA
          channel; cryo-EM of OmpC-MlaA-MlaC.
        supporting_text: Here, we biochemically and structurally characterize the
          MlaA-MlaC transient complex.
      reference_review:
        relevance: HIGH
        correctness: VERIFIED
        review_notes: Yeow et al. 2023 Nat Commun; full text cached (fetched for this
          review). Source of PDB 8I8R/8I8X in the UniProt record.
    - id: PMID:26929379
      title: Disruption of lipid homeostasis in the Gram-negative cell envelope activates
        a novel cell death pathway.
      findings:
      - statement: The dominant mlaA* allele increases OM permeability, LPS levels
          and stationary-phase death.
        supporting_text: a dominant mutation (designated mlaA*, maintenance of lipid
          asymmetry) that alters MlaA, a lipoprotein that removes phospholipids from
          the outer leaflet of the OM of Escherichia coli, increases OM permeability,
          lipopolysaccharide levels, drug sensitivity, and cell death in stationary
          phase
      reference_review:
        relevance: MEDIUM
        correctness: VERIFIED
        review_notes: Sutterlin et al. 2016 PNAS; abstract only cached (fetched for
          this review).
    - id: PMID:39080293
      title: Structure of the MlaC-MlaD complex reveals molecular basis of periplasmic
        phospholipid transport.
      findings:
      - statement: In vitro reconstitution with MlaA-containing donor proteoliposomes,
          MlaC and MlaFEDB acceptor proteoliposomes supports MlaC-mediated lipid movement
          from MlaA-containing membranes.
        supporting_text: Readout of transport is reported by the reduction of quenching
          of NBD labelled phosphatidyl glycerol (PE) by Rhodamine-PE after transport
          from donor MlaA containing proteoliposomes to acceptor MlaFEDB proteoliposomes
          by the MlaC chaperone.
      reference_review:
        relevance: MEDIUM
        correctness: VERIFIED
        review_notes: Full text cached; the paper focuses on MlaC-MlaD, MlaA is used
          as the donor-side component of the reconstituted assay.
    - id: PMID:34873038
      title: ATP disrupts lipid-binding equilibrium to drive retrograde transport
        critical for bacterial outer membrane asymmetry.
      findings:
      - statement: Reconstitution establishes ATP-driven retrograde phospholipid transport
          by the OmpC-Mla system (context for MlaA's role).
        supporting_text: ATP binding and/or hydrolysis shift this equilibrium to ultimately
          drive retrograde PL transport by the OmpC-Mla system
      reference_review:
        relevance: LOW
        correctness: VERIFIED
        review_notes: Context for directionality; MlaA itself is not assayed.
    core_functions:
    - description: 'Outer-membrane phospholipid extraction and hand-off: in complex
        with the porins OmpC/OmpF, MlaA receives phospholipids from the outer leaflet
        of the outer membrane into its hydrophilic channel and transfers them to the
        docked periplasmic carrier MlaC, the outer-membrane half of the MlaA-MlaC
        phospholipid transfer step of the Mla pathway.'
      contributes_to_molecular_function:
        id: GO:0120014
        label: phospholipid transfer activity
      directly_involved_in:
      - id: GO:0120010
        label: intermembrane phospholipid transfer
      locations:
      - id: GO:0009279
        label: cell outer membrane
      supported_by:
      - reference_id: PMID:38092770
        supporting_text: Our work provides critical mechanistic insights for the PL
          transfer reaction from OmpC-MlaA to MlaC for onward shuttling to the IM.
      - reference_id: PMID:29038444
        supporting_text: MlaA represents a lipid transport protein that selectively
          removes outer leaflet phospholipids to help maintain the essential barrier
          function of the bacterial OM.
      - reference_id: PMID:28388411
        supporting_text: Binding of MlaC to the lipid-bound MlaA-OmpC/OmpF complex
          results in lipid transfer to the hydrophobic pocket of MlaC, where it is
          protected from solvent.
    suggested_questions:
    - question: Does MlaA itself bind phospholipid with measurable affinity, or does
        it act only as a channel through which lipids partition into MlaC? (This decides
        whether GO:0005543 phospholipid binding should be asserted for MlaA.)
    - question: Is there, or should there be, a GO activity term for outer-membrane
        phospholipid extraction by a membrane-embedded channel that hands lipid to
        a soluble carrier, distinct from GO:0120014 (which includes carriage through
        the aqueous phase)?
    - question: What role, if any, do OmpC/OmpF play in lipid movement through MlaA
        beyond positioning and stabilizing it?
    suggested_experiments:
    - description: Reconstitute MlaA (wild type, MlaA*, and the hairpin-loop 3G3P
        variant) in asymmetric outer-membrane mimetic liposomes with labelled outer-leaflet
        phospholipid, and measure direct transfer to apo-MlaC with and without OmpC,
        to quantify MlaA-dependent extraction and its directionality.
      experiment_type: in vitro phospholipid transfer assay
  genes/ECOLI/mlaB/mlaB-ai-review.yaml:
    id: P64602
    gene_symbol: mlaB
    product_type: PROTEIN
    status: COMPLETE
    taxon:
      id: NCBITaxon:83333
      label: Escherichia coli K-12
    description: 'MlaB (YrbB) is a small (97-residue) cytoplasmic protein consisting
      of a single STAS (sulfate transporter and anti-sigma factor antagonist) domain,
      encoded as the last gene of the mlaFEDCB operon of the Mla (maintenance of lipid
      asymmetry) intermembrane phospholipid transport system. Two MlaB subunits are
      stoichiometric components of the inner-membrane MlaFEDB ABC transporter complex,
      each bound to the side of the helical subdomain of one MlaF ATPase on the cytoplasmic
      face of the inner membrane, far from the ATP sites and away from the MlaE/MlaD
      lipid pathway. MlaB binds and stabilizes MlaF: without MlaB, MlaF cannot be
      produced in useful amounts and does not assemble with MlaE and MlaD. A T52A
      substitution at the conserved STAS Ser/Thr position, which lies at the MlaF
      interface, leaves complex assembly intact but abolishes complex ATPase activity.
      Over-expression of MlaF suppresses the mlaB deletion, suggesting that the main
      role of MlaB is to keep MlaF stable and available for MlaFEDB assembly; a regulatory
      role (for example by phosphorylation of Thr52) has been proposed but not demonstrated.
      Loss of MlaB causes outer-membrane lipid asymmetry defects and SDS-EDTA sensitivity.'
    existing_annotations:
    - term:
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:32602838
      qualifier: enables
      supporting_entities:
      - UniProtKB:P63386
      review:
        summary: MlaB binds the MlaF nucleotide-binding domain (MlaFB crystal structure,
          pull-downs).
        action: REMOVE
        reason: The interaction is well established, but bare protein binding is uninformative
          under the protein-binding policy. Its functional consequence, stabilization
          of MlaF and its assembly into MlaFEDB, is captured by the NEW protein stabilization
          annotation and the complex membership term (GO:0043190). Removal does not
          dispute the interaction.
        supported_by:
        - reference_id: PMID:32602838
          supporting_text: MlaB, a STAS domain protein, binds the ABC nucleotide binding
            domain, MlaF, and is required for its stability.
    - term:
        id: GO:0005515
        label: protein binding
      evidence_type: IPI
      original_reference_id: PMID:33199922
      qualifier: enables
      supporting_entities:
      - UniProtKB:P63386
      review:
        summary: MlaB-MlaF contact within the cryo-EM MlaFEDB structure.
        action: REMOVE
        reason: Bare protein binding is uninformative; the MlaF contact is a subunit
          interaction within MlaFEDB, represented by complex membership (GO:0043190)
          and the protein stabilization process.
    - term:
        id: GO:0005737
        label: cytoplasm
      evidence_type: IEA
      original_reference_id: GO_REF:0000044
      qualifier: located_in
      supporting_entities:
      - UniProtKB-SubCell:SL-0086
      review:
        summary: MlaB is a soluble cytoplasmic STAS-domain protein.
        action: ACCEPT
        reason: MlaB has no signal peptide or transmembrane segment and binds the
          cytoplasmic MlaF subunits of MlaFEDB.
        supported_by:
        - reference_id: PMID:33236984
          supporting_text: 'Outside this ABC transporter core, MlaFEDB contains additional
            subunits not found in other ABC transporters: MlaD on the periplasmic
            side of the IM, and MlaB in the cytoplasm.'
    - term:
        id: GO:0005829
        label: cytosol
      evidence_type: IDA
      original_reference_id: PMID:17309111
      qualifier: located_in
      review:
        summary: Proteomic detection reported by EcoCyc as cytosolic localization.
        action: ACCEPT
        reason: Abstract-only cache, so the specific observation cannot be checked,
          but a soluble cytoplasmic location is consistent with all structural data
          for MlaB; defer to the curator.
        supported_by:
        - reference_id: PMID:33236984
          supporting_text: 'Outside this ABC transporter core, MlaFEDB contains additional
            subunits not found in other ABC transporters: MlaD on the periplasmic
            side of the IM, and MlaB in the cytoplasm.'
    - term:
        id: GO:0005829
        label: cytosol
      evidence_type: IDA
      original_reference_id: PMID:18304323
      qualifier: located_in
      review:
        summary: Detection of MlaB in the E. coli cytosolic proteome.
        action: ACCEPT
        reason: MlaB is not named in the cached main text (presumably in the supplementary
          protein lists), but cytosolic detection agrees with MlaB being a soluble
          cytoplasmic protein; defer to the curator.
        supported_by:
        - reference_id: PMID:33236984
          supporting_text: 'Outside this ABC transporter core, MlaFEDB contains additional
            subunits not found in other ABC transporters: MlaD on the periplasmic
            side of the IM, and MlaB in the cytoplasm.'
    - term:
        id: GO:0006974
        label: DNA damage response
      evidence_type: IBA
      original_reference_id: GO_REF:0000033
      qualifier: involved_in
      supporting_entities:
      - PANTHER:PTN002185077
      - UniProtKB:P64602
      review:
        summary: PAINT propagates DNA damage response to the gammaproteobacterial
          MlaB node, seeded only by the E. coli mlaB transposon-mutant phenotype.
        action: MARK_AS_OVER_ANNOTATED
        reason: The only seed is the yrbB::Tn5 hyperlethality phenotype (PMID:20128927),
          an indirect consequence of an outer-envelope defect. Nothing places MlaB
          in a DNA-damage sensing or repair pathway, so propagating involvement in
          the DNA damage response across the MlaB family overstates a pleiotropic
          phenotype. The PTHR35849 family review assesses this node as WRONG_NODE
          for the same reason. MARK_AS_OVER_ANNOTATED rather than REMOVE because the
          seed phenotype itself is real and verified in the full text, and this row's
          sole seed is the gene's own IMP row below, so the two rows make one claim
          and carry the same action. What is wrong is the process assignment, not
          the observation.
        supported_by:
        - reference_id: PMID:20128927
          supporting_text: Eight of the mutant genes (yadC, rfbX, rfbC, ycdO, yrbB,
            ybdA, emrK, and emrY) were annotated in Genbank as outer membrane proteins
            or proteins whose function is related to the outer membrane.
        propagation_review:
          root_cause: SOURCE_WEAK_OR_INFERRED
          failure_modes:
          - ROLE_CONFLATION
          - SOURCE_EVIDENCE_WEAK
          source_entities:
          - source_id: PANTHER:PTN002185077
            source_label: PTN002185077
            source_status: SOURCE_WEAK_OR_INFERRED
            comment: Sole seed is P64602's own acts_upstream_of_or_within IMP from
              a Tn5 hyperlethality screen; an indirect envelope phenotype, not participation
              in the DNA damage response, was converted into an involved_in IBD.
    - term:
        id: GO:0006974
        label: DNA damage response
      evidence_type: IMP
      original_reference_id: PMID:20128927
      qualifier: acts_upstream_of_or_within
      review:
        summary: yrbB::Tn5 mutants are more readily killed by nalidixic acid, mitomycin
          C and UV.
        action: MARK_AS_OVER_ANNOTATED
        reason: The hyperlethality phenotype is real (full text verified, complemented),
          but the authors group yrbB with outer-membrane-related genes and offer no
          mechanism linking MlaB to a DNA-damage response; the effect is most plausibly
          an indirect consequence of compromised envelope homeostasis in Mla mutants.
          A DNA damage response process term overstates the role of MlaB.
        supported_by:
