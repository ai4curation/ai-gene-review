      \ \"Belongs to the MlaA family\"].\n- The broad membrane location is modified\
      \ to cell outer membrane based on the MlaA/VacJ lipoprotein role.\n- GO:0120010\
      \ is retained without imposing a universal net transport direction.\n- OpenScientist\
