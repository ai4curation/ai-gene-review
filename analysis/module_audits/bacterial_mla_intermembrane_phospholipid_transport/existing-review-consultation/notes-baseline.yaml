notes:
  genes/ECOLI/mlaA/mlaA-notes.md:
    original_text: "# mlaA (P76506) curation notes\n\n## Deep research\n- `just deep-research\
      \ ECOLI mlaA --provider perplexity` was attempted on 2026-10-23 and failed:\n\
      \  \"Provider 'perplexity' not available. Available: falcon, openscientist\"\
      . No deep-research\n  file was generated; the review is based on cached primary\
      \ literature and the UniProt record.\n\n## Literature summary\n- Founding Mla\
      \ paper: mla mutants accumulate PL in the OM outer leaflet [PMID:19383799 \"\
      We have identified an ABC transport system in Escherichia coli with predicted\
      \ import function that serves to prevent PL accumulation in the outer leaflet\
      \ of the OM.\"]\n- MlaA is an OM lipoprotein that binds OmpC and OmpF; porin\
      \ binding alone targets unlipidated MlaA to the OM [PMID:26314242 \"We show\
      \ that the OM lipoprotein MlaA interacts specifically with OmpC and OmpF.\"\
      \ ; \"This interaction is sufficient to localize MlaA lacking its lipid anchor\
      \ to the OM.\"]\n- Structure: monomeric alpha-helical doughnut in the inner\
      \ leaflet with an amphipathic pore; selectively removes outer-leaflet PLs; porins\
      \ not active in transport [PMID:29038444 \"MlaA represents a lipid transport\
      \ protein that selectively removes outer leaflet phospholipids to help maintain\
      \ the essential barrier function of the bacterial OM.\"]\n- OmpC-MlaA architecture:\
      \ MlaA entirely within the bilayer, hydrophilic channel, gating hairpin loop\
      \ [PMID:29848551 \"In addition, MlaA forms a hydrophilic channel, likely enabling\
      \ PL translocation across the OM.\"]\n- MlaA-MlaC transient complex (cryo-EM\
      \ 2.9 Å, PDB 8I8R/8I8X): MlaC docks at the MlaA periplasmic base, juxtaposing\
      \ channel and MlaC cavity; apo-MlaC binding opens MlaA channel [PMID:38092770\
      \ \"in the first step, the OmpC-MlaA complex transfers PLs to the periplasmic\
      \ chaperone MlaC\"].\n- mlaA* gain-of-function allele: PL flow into outer leaflet,\
      \ LPS increase, vesiculation, death [PMID:26929379].\n- Ekiert 2017 model: \"\
      Binding of MlaC to the lipid-bound MlaA-OmpC/OmpF complex results in lipid transfer\
      \ to the hydrophobic pocket of MlaC\" [PMID:28388411].\n- Reconstitution with\
      \ MlaA donor proteoliposomes, MlaC and MlaFEDB acceptor proteoliposomes [PMID:39080293\
      \ \"transport from donor MlaA containing proteoliposomes to acceptor MlaFEDB\
      \ proteoliposomes by the MlaC chaperone\"].\n- Direction: ATP drives retrograde\
      \ (OM to IM) transport [PMID:34873038]; anterograde proposals [PMID:31235958]\
      \ are disputed.\n\n## Decisions\n- Protein binding (3 IPI rows, OmpC/OmpF):\
      \ REMOVE per protein-binding policy; interactions are real.\n- Cell outer membrane\
      \ IEA + RCA: ACCEPT. Membrane IEA: MODIFY -> cell outer membrane.\n- GO:0120010\
      \ IBA + IDA: ACCEPT.\n- Core MF: contributes_to GO:0120014 phospholipid transfer\
      \ activity. GO:0120014 is defined as removing\n  a PL from a membrane, carrying\
      \ it through the aqueous phase in a hydrophobic pocket and delivering it.\n\
      \  MlaA does the removal/hand-off step but not aqueous carriage (that is MlaC),\
      \ so `enables` would overstate;\n  `contributes_to` records MlaA as the OM half\
      \ of the MlaA-MlaC transfer step. GO:0005543 phospholipid\n  binding was not\
      \ asserted: there is no direct binding measurement for MlaA (lipid interaction\
      \ comes from\n  MD and channel structure). No GO term exists for OM phospholipid\
      \ extraction by a channel; raised as a\n  suggested question. No NEW annotation\
      \ rows added.\n"
    sha256: 7d34f75ae40646c98edbfe70837bde334db6fa466b9ba601f977b4390bc99f9b
  genes/ECOLI/mlaB/mlaB-notes.md:
    original_text: "# mlaB (P64602, E. coli K-12) review notes\n\n## Deep research\n\
      \n- 2026-10-23: `just deep-research ECOLI mlaB --provider perplexity` was run\
      \ once and\n  failed (\"Provider 'perplexity' not available. Available: falcon,\
      \ openscientist\").\n  No deep-research file was generated; this review is based\
      \ on the cached\n  publications listed below (full text unless noted) and the\
      \ UniProt record.\n\n## Identity\n\n- MlaB (YrbB, b3191), 97 aa, a single STAS\
      \ domain (PROSITE PS50801, Pfam PF13466);\n  last gene of the mlaFEDCB operon.\
      \ Cytoplasmic; no TM helix or signal peptide.\n- Binds the side of each MlaF\
      \ NBD: \"MlaB, a STAS domain protein, binds the ABC\n  nucleotide binding domain,\
      \ MlaF, and is required for its stability\" [PMID:32602838,\n  full text]. The\
      \ MlaB binding site is ~30 A from the ATP site; MlaB subunits do not\n  contact\
      \ each other and have \"presumed minimal contacts\" with other transporter\n\
      \  subunits [PMID:32602838].\n- MlaFEDB cryo-EM: \"On the cytoplasmic side,\
      \ each of the MlaF ATPase subunits is bound\n  to MlaB\" [PMID:33236984]. MlaB\
      \ does not line the lipid pathway, which runs through\n  MlaE and MlaD [PMID:33236984].\n\
      \n## Role in the complex\n\n- Thong et al. 2016 [PMID:27529189, full text]:\
      \ \"MlaB is necessary for both the assembly\n  and activity of the ABC transporter,\
      \ likely by modulating MlaF structure and\n  stability\". Without MlaB, MlaFE\
      \ could not be isolated. MlaB T52A does not affect\n  MlaFEB assembly but abolishes\
      \ ATPase activity, and mlaB T52A does not complement\n  SDS-EDTA sensitivity.\n\
      - Kolich et al. 2020 [PMID:32602838]: MlaF cannot be expressed/purified alone,\
      \ but\n  MlaFB co-expression gives good yield; \"These data suggest that MlaB\
      \ stabilizes MlaF\".\n  MlaF over-expression fully suppresses the mlaB knockout:\
      \ \"MlaB may have no essential\n  function in Mla lipid transport apart from\
      \ its role in promoting MlaF stability\n  and/or association with the MlaFEDB\
      \ complex\". Thr52 lies at the MlaF-MlaB interface\n  and is the conserved Ser/Thr\
      \ phosphorylation site of STAS domains; phosphoregulation\n  is hypothesized,\
      \ not shown.\n- Interpretation: MlaB is a stoichiometric, non-catalytic accessory\
      \ subunit. Its\n  documented activity is binding and stabilizing MlaF (GO:0050821\
      \ protein\n  stabilization, process), enabling MlaFB to assemble with MlaED.\
      \ It does not contact\n  phospholipid, so \"enables phospholipid transfer activity\"\
      \ overstates it; at most it\n  contributes to the complex activity. GO lacks\
      \ a specific MF term for \"ABC ATPase\n  subunit stabilizer\"; no MF is asserted\
      \ with `enables` in core_functions.\n\n## Stress phenotypes (PMID:20128927,\
      \ full text)\n\n- Tn5 screen for hyperlethality to nalidixic acid; yrbB::Tn5\
      \ was among 14 hits, also\n  more readily killed by mitomycin C, UV and H2O2;\
      \ complementation was observed for\n  tested mutants including yrbB. The authors\
      \ note the yrbB mutation does not change\n  bacteriostatic susceptibility or\
      \ permeability to most compounds. These are indirect,\n  envelope-related phenotypes;\
      \ nothing places MlaB in a DNA-damage response pathway.\n- PAINT PTN002185077\
      \ (PTHR35849, taxon Gammaproteobacteria) propagates\n  GO:0006974 DNA damage\
      \ response, GO:0120014, GO:0120010 and GO:1990531, all seeded\n  solely by P64602\
      \ itself (interpro/panther/PTHR35849/PTHR35849-paint.tsv).\n\n## Location\n\n\
      - UniProt: \"Cytoplasm\" (ECO:0000305 PMID:19383799). EcoCyc IDA cytosol from\
      \ proteomics\n  PMID:18304323 (full text; MlaB not found in cached text, presumably\
      \ in supplementary\n  tables) and PMID:17309111 (abstract only). Functional\
      \ location is the cytoplasmic face\n  of the IM, bound to MlaF in MlaFEDB.\n\
      \n## Reference issues\n\n- PMID:29358647 (TatA-type Tat translocase paper) is\
      \ the ComplexPortal NAS reference for\n  \"membrane\"; full text has no mention\
      \ of Mla genes - miscited.\n- GO:1990531 is defined as a P-type ATPase (P4 flippase)\
      \ complex; MlaFEDB is an ABC\n  transporter: GO:0043190 is the correct complex\
      \ term.\n"
    sha256: 57f4b0f0176b3edec3641de90297bb916bdc7309bdccd65eee464e7fc5c9b191
  genes/ECOLI/mlaC/mlaC-notes.md:
    original_text: "# mlaC (P0ADV7) curation notes\n\n## Deep research\n- `just deep-research\
      \ ECOLI mlaC --provider perplexity` was attempted on 2026-10-23 and failed:\n\
      \  \"Provider 'perplexity' not available. Available: falcon, openscientist\"\
      . No deep-research file\n  generated; review based on cached primary literature\
      \ and UniProt.\n\n## Literature summary\n- Founding Mla paper (mlaC mutants\
      \ accumulate outer-leaflet PL) [PMID:19383799 \"We propose that the Mla pathway\
      \ constitutes a bacterial intermembrane PL trafficking system.\"]\n- 1.5 Å crystal\
      \ structure with diacyl lipid in hydrophobic pocket; binds MlaFEDB, MlaD, MlaA-OmpF\
      \ [PMID:28388411 \"The two acyl chains of the lipid insert snugly into the protein\
      \ core where they are protected from solvent\"].\n- MlaD spontaneously transfers\
      \ PLs to MlaC (higher affinity in MlaC) [PMID:30284446 \"we demonstrated using\
      \ purified proteins that MlaD spontaneously transfers PLs to MlaC\"].\n- Point-to-point\
      \ [14C]-PL transfer between MlaC and MlaFEDB nanodiscs; ATP drives net retrograde\
      \ transfer [PMID:34873038 \"Therefore, we have shown that PLs equilibrate between\
      \ MlaC and MlaFEDB, and ATP hydrolysis drives overall transport in the retrograde\
      \ direction.\"]\n- Apo-MlaC structure, pivoting beta-sheet; authors argued for\
      \ anterograde export (disputed) [PMID:31235958].\n- MlaC-MlaD cryo-EM at 1:6\
      \ and 2:6 stoichiometry [PMID:39080293].\n- MlaC docks at MlaA periplasmic base\
      \ [PMID:38092770].\n\n## Decisions\n- Protein binding (MlaD IPI): REMOVE per\
      \ policy.\n- Phospholipid transport IMP: MODIFY -> GO:0120010 (refinement).\n\
      - GO:0030288 IBA/IDA: ACCEPT. GO:0042597 IEA: MODIFY -> GO:0030288.\n- GO:0120010\
      \ IBA/IDA: ACCEPT.\n- NEW: GO:0120014 phospholipid transfer activity (IDA, PMID:34873038)\
      \ and GO:0005543 phospholipid binding\n  (IDA, PMID:28388411). GO:0120014 is\
      \ not an is_a descendant of GO:0005543, so both are informative.\n- Core functions:\
      \ (1) GO:0120014 (primary; definition matches the MlaC carrier exactly);\n \
      \ (2) GO:0005543 binding state, retained so the module's MlaC annoton (GO:0005543)\
      \ has gene-level grounding.\n"
    sha256: 37cf23e934960a3056bda23afc510ca6080187db17ef8b4d291c19243139eb94
  genes/ECOLI/mlaD/mlaD-notes.md:
    original_text: "# mlaD (P64604, Escherichia coli K-12) - curation notes\n\n##\
      \ Deep research\n- 2026-10-23: `just deep-research ECOLI mlaD --provider perplexity`\
      \ was attempted once and failed\n  (\"Provider 'perplexity' not available. Available:\
      \ falcon, openscientist\"). No deep-research file\n  was generated; this review\
      \ is built directly from cached full-text publications and the UniProt record.\n\
      \n## Identity and topology\n- 183-residue single-pass (signal-anchor type II)\
      \ inner-membrane protein: TM 8-28, periplasmic MCE/MlaD\n  domain (39-116),\
      \ disordered C-terminal tail [file:ECOLI/mlaD/mlaD-uniprot.txt]. MlaD family\n\
      \  (Pfam PF02470; NCBIfam TIGR04430 OM_asym_MlaD; InterPro IPR030970 ABC_MlaD).\n\
      \n## Hexameric MCE ring and lipid binding\n- [PMID:27529189 \"Within this complex,\
      \ MlaD forms an SDS-resistant hexamer via its soluble domain, and we\n  demonstrate\
      \ that this domain binds PLs.\"]; \"hexameric sMlaD is a PL-binding complex\
      \ with at least four\n  binding sites\"; preference for PG over PE.\n- [PMID:28388411\
      \ \"MlaD, PqiB, and YebT each bound phospholipid species that co-migrated with\n\
      \  phosphatidylglycerol (PG), cardiolipin (CL) and phosphatidylethanolamine\
      \ (PE) standards.\"]\n- Crystal/EM structure: hexameric ring with central hydrophobic\
      \ pore; pore-lining (beta5-beta6 loop)\n  mutants fail to complement deltamlaD\
      \ [PMID:28388411].\n- In the MlaFEDB cryo-EM structure, a phospholipid acyl\
      \ chain inserts into a constriction in the MlaD pore\n  formed by Leu106/Leu107;\
      \ pathway continuous from MlaE pocket through MlaD [PMID:33236984].\n\n## Complex\
      \ and partners\n- MlaFEDB stable complex; MlaD reduces ATP hydrolysis ~3-fold\
      \ and modulates coupling [PMID:27529189].\n- MlaD binds MlaC directly [PMID:28388411\
      \ \"a direct interaction between MlaC and MlaD\"].\n- MlaC spontaneously transfers\
      \ PLs to MlaFEDB \"in an MlaD-dependent manner\" [PMID:34873038]; MlaD\n  important\
      \ for productive coupling of ATP hydrolysis to retrograde PL transfer.\n- MlaD\
      \ requires its native TM helix to assemble with MlaFEB and function [PMID:33236984].\n\
      \n## Curation decisions (summary)\n- GO:0005515 protein binding x2 (MlaC; MlaE):\
      \ REMOVE per protein-binding policy (no better MF term for\n  MlaC docking;\
      \ complex membership captured by GO:0043190).\n- GO:0005543 phospholipid binding\
      \ IDA: ACCEPT (core).\n- GO:0015914 phospholipid transport (IEA, NAS): MODIFY\
      \ -> GO:0120010.\n- GO:0016020 membrane NAS: MODIFY -> GO:0005886.\n- GO:1990531\
      \ (P-type flippase complex): MODIFY -> GO:0043190.\n- GO:0120014 enables (IBA,\
      \ IDA): MARK_AS_OVER_ANNOTATED (revised in PR review); the activity belongs\
      \ to the assembled MlaFEDB complex with MlaC, so core records contributes_to;\
      \ MlaD-intrinsic lipid contact is GO:0005543 phospholipid binding. Same reading\
      \ applied to MlaB, MlaE and MlaF.\n  (plus MlaC).\n"
    sha256: f5dab55634d2eb2cae6c64bb48d01532b96b7ebb73c5e770c31c28bc163ece16
  genes/ECOLI/mlaE/mlaE-notes.md:
    original_text: "# mlaE (P64606, Escherichia coli K-12) - curation notes\n\n##\
      \ Deep research\n- 2026-10-23: `just deep-research ECOLI mlaE --provider perplexity`\
      \ was attempted once and failed\n  (\"Provider 'perplexity' not available. Available:\
      \ falcon, openscientist\"). No deep-research file\n  was generated; this review\
      \ is built directly from cached full-text publications and the UniProt record.\n\
      \n## Identity and topology\n- MlaE (YrbE) is the 260-residue integral inner-membrane\
      \ permease (TMD) of the MlaFEDB ABC transporter;\n  member of the MlaE permease\
      \ family (Pfam PF02405; NCBIfam TIGR00056) [file:ECOLI/mlaE/mlaE-uniprot.txt\n\
      \  \"Belongs to the MlaE permease family.\"].\n- Inner-membrane location: global\
      \ topology mapping placed the C terminus in the cytoplasm\n  [PMID:15919996,\
      \ abstract only]; UniProt \"Cell inner membrane {ECO:0000269|PubMed:15919996\"\
      .\n  Membrane proteomics of an E. coli K-12 inner-membrane fraction [PMID:17309111,\
      \ abstract only].\n\n## Complex\n- MlaF, MlaE, MlaD and MlaB form a stable complex\
      \ [PMID:27529189 \"We conclude that MlaF, MlaE, MlaD and\n  MlaB form a stable\
      \ complex.\"]; stoichiometry MlaF2E2D6B2.\n- Cryo-EM: \"A homohexameric ring\
      \ of MCE domains from MlaD sits atop the periplasmic end of MlaE like a\n  crown.\"\
      \ [PMID:33236984]. MlaE is distantly related to the TMDs of LptFG / MacB and\
      \ ABCA/ABCG.\n- MlaD modulates complex ATPase \"via its interaction with MlaE\"\
      \ [PMID:27529189].\n\n## Substrate binding (key MF evidence)\n- [PMID:33236984\
      \ \"Additional density was apparent in the outward-open pocket of MlaE, which\
      \ is the right\n  size and shape to accommodate two diacyl phospholipids\"].\n\
      - In vivo photocrosslinking with BPA at pocket residues: [PMID:33236984 \"Thus,\
      \ the phospholipid-binding\n  site observed in our MlaFEDB structure is occupied\
      \ by phospholipids in vivo.\"]\n- Continuous pathway: [PMID:33236984 \"A continuous\
      \ transport pathway extends from the MlaE\n  substrate-binding site, through\
      \ the channel of MlaD, and into the periplasm.\"]\n- Tang et al. 2021 [PMID:33199922,\
      \ abstract only] also solved E. coli MlaFEDB with phospholipid bound\n  and\
      \ built a proteoliposome MlaFEDB/MlaC/MlaA-OmpF transport system.\n\n## Transport\
      \ and direction\n- Disruption: PL accumulates in OM outer leaflet; SDS-EDTA\
      \ sensitivity [PMID:19383799, abstract only].\n- Reconstituted point-to-point\
      \ assays: \"PLs equilibrate between MlaC and MlaFEDB, and ATP hydrolysis drives\n\
      \  overall transport in the retrograde direction.\" [PMID:34873038]. Combined\
      \ lipid-binding cavity formed by\n  MlaD and MlaE; ATP binding collapses the\
      \ MlaE lipid-binding cavity [PMID:34873038].\n- Direction remains debated (anterograde\
      \ transfer reported by Tang et al.), so process annotation uses the\n  direction-neutral\
      \ GO:0120010 intermembrane phospholipid transfer.\n\n## Curation decisions (summary)\n\
      - GO:0005515 protein binding (IPI, with MlaF/MlaD): REMOVE per protein-binding\
      \ policy; complex membership\n  captured by GO:0043190.\n- GO:1990531 phospholipid-translocating\
      \ ATPase complex: definition is a P-type ATPase (flippase) complex;\n  MlaFEDB\
      \ is an ABC transporter -> MODIFY to GO:0043190 ABC transporter complex.\n-\
      \ GO:0015914 phospholipid transport (IBA, NAS): correct but general -> MODIFY\
      \ to GO:0120010 (is_a child,\n  already on the gene).\n- GO:0016020 membrane\
      \ (NAS): MODIFY to GO:0005886 plasma membrane. The cited Tat paper (PMID:29358647)\n\
      \  does not mention Mla at all; ComplexPortal mis-cited it (recorded as a WRONG_REFERENCE\
      \ source defect).\n- GO:0120014 phospholipid transfer activity (IDA, enables):\
      \ MARK_AS_OVER_ANNOTATED (revised in PR review);\n  the activity belongs to\
      \ the assembled MlaFEDB complex with MlaC, so the core function records it as\n\
      \  contributes_to, the same reading applied to MlaB, MlaD and MlaF.\n- NEW:\
      \ GO:0005543 phospholipid binding (IDA, PMID:33236984) based on cryo-EM + in\
      \ vivo crosslinking.\n"
    sha256: 83ef5ce336ae2255dae912e04e4a26fdde2059af683d5986478f579726128980
  genes/ECOLI/mlaF/mlaF-notes.md:
    original_text: "# mlaF (P63386, E. coli K-12) review notes\n\n## Deep research\n\
      \n- 2026-10-23: `just deep-research ECOLI mlaF --provider perplexity` was run\
      \ once and\n  failed (\"Provider 'perplexity' not available. Available: falcon,\
      \ openscientist\").\n  No deep-research file was generated; this review is based\
      \ on the cached\n  publications listed below (full text unless noted) and the\
      \ UniProt record.\n\n## Identity and architecture\n\n- MlaF (YrbF, b3195) is\
      \ the 269-residue ABC nucleotide-binding domain (NBD) subunit of\n  the inner-membrane\
      \ MlaFEDB complex of the Mla (maintenance of lipid asymmetry)\n  pathway. UniProt:\
      \ \"Belongs to the ABC transporter superfamily. MlaF family.\"\n- Complex stoichiometry\
      \ MlaF2 E2 D6 B2 [UniProt SUBUNIT, ECO:0000269 PMID:27529189,\n  PMID:28388411].\
      \ MlaF is peripheral on the cytoplasmic face of the IM: MlaFB is \"the\n  cytoplasmic\
      \ portion of the larger MlaFEDB ABC transporter complex\" [PMID:32602838].\n\
      - Each MlaF binds one MlaB (STAS domain) on the helical subdomain of the NBD,\
      \ ~30 A from\n  the ATP site [PMID:32602838 \"The MlaB binding site on MlaF\
      \ is centered on the helical\n  subdomain of the core NBD in MlaF, distant from\
      \ the MlaF2 dimer interface and the ATP\n  binding sites\"].\n- A unique C-terminal\
      \ extension (CTE) of MlaF reaches over to the neighbouring MlaFB\n  module (\"\
      handshake\") and is required for function; forced dimerization largely rescues\n\
      \  the CTE deletion [PMID:32602838].\n- MlaF is unstable without MlaB: \"we\
      \ were unable to express and purify significant\n  amounts of MlaF alone\" and\
      \ over-expression of MlaF suppresses the mlaB knockout\n  [PMID:32602838].\n\
      \n## ATP hydrolysis (verification of the IMP row, PMID:27529189, full text)\n\
      \n- Purified MlaFEB in DDM: kcat 1.8 umol ATP/s/umol complex; MlaD association\
      \ lowers it ~3x\n  [PMID:27529189].\n- \"Remarkably, no activity is detected\
      \ with the MlaFEBT52A complex, similar to a variant\n  of the complex containing\
      \ a predicted non-functional mutation in the MlaF Walker A\n  motif (MlaFK47REB)\"\
      \ and \"the mlaBT52A or mlaFK47R alleles do not complement SDS-EDTA\n  sensitivity\"\
      \ [PMID:27529189]. So the IMP rests on the K47R Walker A mutant abolishing\n\
      \  complex ATPase activity: sound support for MlaF as the catalytic ATPase.\n\
      - ATP drives the retrograde direction: \"ATP hydrolysis drives overall transport\
      \ in the\n  retrograde direction\" and anterograde transfer \"is abolished by\
      \ ATP hydrolysis\"\n  [PMID:34873038]. Transport direction is still debated\
      \ in the field; the module\n  deliberately stays direction-neutral.\n\n## Process\
      \ and complex terms\n\n- Mla pathway prevents PL accumulation in the outer leaflet\
      \ of the OM [PMID:19383799,\n  abstract only]; mla mutants are SDS-EDTA sensitive\
      \ [UniProt DISRUPTION PHENOTYPE].\n- Proteoliposome transport system with MlaFEDB,\
      \ MlaC and MlaA-OmpF [PMID:33199922,\n  abstract only] - basis for EcoCyc IDA\
      \ rows (GO:0120010, GO:0120014).\n- GO:1990531 \"phospholipid-translocating\
      \ ATPase complex\" is defined as \"A protein complex\n  that functions as a\
      \ phospholipid-translocating P-Type ATPase\" (synonyms P4-ATPase\n  complex,\
      \ DRS2-CDC50 complex) and is_a transporter complex only; MlaFEDB is an ABC\n\
      \  transporter, so GO:0043190 ATP-binding cassette (ABC) transporter complex\
      \ is the\n  correct complex term (checked with runoak against sqlite:obo:go).\n\
      - GO:0120014 phospholipid transfer activity is defined as carrying a PL through\
      \ the\n  aqueous phase in a hydrophobic pocket; for MlaFEDB it is the complex-level\
      \ activity\n  used in the Mla module. MlaF itself contacts no lipid; it contributes\
      \ the ATPase\n  that drives the transfer, so the honest framing is MlaF enables\
      \ GO:0016887 and\n  contributes_to GO:0120014.\n\n## Reference issues\n\n- PMID:29358647\
      \ (TatA-type Tat translocase components) is cited by ComplexPortal for\n  \"\
      membrane\" (NAS). Full text contains no mention of Mla/MlaF/yrb genes (grep),\
      \ so it is\n  miscited; the location itself (IM, cytoplasmic face) is correct.\n\
      - PMID:15690043, PMID:16606699 (high-throughput pull-downs; GroEL interactor)\
      \ are\n  abstract-only; GroEL binding is a generic folding interaction, rows\
      \ REMOVEd under the\n  protein-binding policy.\n\n## PAINT\n\n- PTN000655692\
      \ (PTHR43023): IBD GO:0016887 seeded by AT1G65410 (TGD3) and P63386;\n  GO:0120014\
      \ seeded by P63386.\n- PTN000655704 (taxon Bacteria): GO:1990531, GO:0120010\
      \ seeded by P63386.\n  (interpro/panther/PTHR43023/PTHR43023-paint.tsv)\n"
    sha256: 87f2a630ce069231f546978b5c134f16382d23f9da7e4adc5036bea24ffac656
  genes/PSEPK/mlaD/mlaD-notes.md:
    original_text: '# mlaD curation notes


      ## 2026-09-01 OpenScientist integration


      The report correctly identifies Q88P92/PP_0960 and supports a single

      N-terminal membrane anchor, one MlaD/MCE domain, phospholipid binding, and a

      periplasm-facing interface within MlaFEDB

      [file:PSEPK/mlaD/mlaD-deep-research-openscientist.md, "Q88P92 has one Mce/MlaD

      domain (Pfam **PF02470**, residues **39–116**) — the short, single-ring MlaD

      type"]. These findings were integrated into the review.


      Two claims were not promoted. First, the report presents retrograde transport

      as the settled physiological direction, but later acknowledges that direction

      and ATP coupling remain debated

      [file:PSEPK/mlaD/mlaD-deep-research-openscientist.md, "The precise

      **directionality** (retrograde vs. bidirectional) and the exact **role of ATP

      hydrolysis** remain debated even in model organisms"]. The gene review and

      module therefore use direction-neutral phospholipid transfer. Second, the

      adjacent ttg2 solvent-tolerance context does not establish a direct

      MlaD-specific toluene-tolerance function, so it remains pathway context rather

      than a core annotation.

      '
    sha256: 0d02c95c9cad54f9096f0d9fc10e4cadedd87a596caaaaca399ea292a6908201
  genes/PSEPK/mlaE/mlaE-notes.md:
    original_text: '# mlaE curation notes


      ## 2026-09-01 OpenScientist integration


      The report supports Q88P93 as a five-pass MlaE-family inner-membrane permease

      [file:PSEPK/mlaE/mlaE-deep-research-openscientist.md, "a **266-residue

      protein** with **five predicted helical transmembrane segments**"] and assigns

      the phospholipid binding/transmembrane conduit to MlaE

      [file:PSEPK/mlaE/mlaE-deep-research-openscientist.md, "MlaE thus provides both

      the binding pocket and the transmembrane conduit."].


      The report''s categorical retrograde framing was not promoted. Its own useful

      boundary statement is retained: "Under either interpretation, MlaE remains the

      inner-membrane permease that moves phospholipid across the IM; the debate

      concerns net physiological directionality, not MlaE''s molecular role." The

      gene review and module therefore assign direction-neutral phospholipid

      transfer.

      '
    sha256: 6a2a3872da77df5f19ec6d50877e5fca5aab5dc2b6bc4bd9f48f4eb016960e6c
  genes/PSEPK/mlaF/mlaF-notes.md:
    original_text: '# mlaF curation notes


      ## 2026-09-01 OpenScientist integration


      The report correctly identifies Q88P94/PP_0958 as the MlaFEDB ATPase and finds

      the complete conserved ABC nucleotide-binding/hydrolysis motif set

      [file:PSEPK/mlaF/mlaF-deep-research-openscientist.md, "A motif scan of the

      actual 269-residue *P. putida* MlaF (Q88P94) confirms a complete, intact ABC

      nucleotide-binding active site"]. It also places the nucleotide-binding dimer

      on the cytoplasmic face of the inner membrane

      [file:PSEPK/mlaF/mlaF-deep-research-openscientist.md, "MlaF is a **peripheral

      cytoplasmic-membrane protein**: the NBDs sit on the **cytoplasmic (inner) face

      of the inner membrane**"].


      The report''s categorical retrograde-pathway language was not promoted. It

      acknowledges that "precisely how ATP hydrolysis is coupled to the direction
      and

      steps of lipid movement is still debated and not fully resolved". The review

      therefore assigns ATP hydrolysis directly to MlaF and direction-neutral

      intermembrane phospholipid transfer to the assembled system.

      '
    sha256: f981c501057de239dcc04c99582a0df2bdbbc8b370cb9a142f767dd87f47d07d
  genes/PSEPK/ttg2D/ttg2D-notes.md:
    original_text: "# ttg2D curation notes\n\n- Q88P91 is structurally characterized\
      \ and belongs to the exact MlaC PANTHER subfamily [file:PSEPK/ttg2D/ttg2D-uniprot.txt\
      \ \"PANTHER; PTHR36573:SF1; INTERMEMBRANE PHOSPHOLIPID TRANSPORT SYSTEM BINDING\
      \ PROTEIN MLAC\"].\n- The local Ttg2D name is retained while the module records\
      \ its MlaC-family periplasmic carrier role.\n- There are no existing GOA rows;\
      \ phospholipid binding, intermembrane transfer, and periplasmic localization\
      \ are synthesized core assertions.\n- OpenScientist identifies PDB 4FCZ and\
      \ lipid-bound PDB 5UWB as structures of\n  Q88P91 itself, providing direct target-level\
      \ support for a lipid-binding\n  cavity [file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md\n\
      \  \"Direct structural evidence for the target protein (PDB 5UWB)\"].\n- The\
      \ quantitative lipid stoichiometry and promiscuity derive from the\n  P. aeruginosa\
      \ ortholog, and the report states that direction is unresolved\n  specifically\
      \ in P. putida. These are not promoted to target-specific core\n  claims [file:PSEPK/ttg2D/ttg2D-deep-research-openscientist.md\n\
      \  \"Transport directionality not settled organism-specifically\"].\n"
    sha256: d35a1c78d92afe3b5225a93ab34bb672c350f59a02bce9016b0efe1bd6116f52
  genes/PSEPK/ttg2E/ttg2E-notes.md:
    original_text: '# ttg2E curation notes


      ## 2026-09-01 OpenScientist integration


      Q88P90 is a 100-residue single-STAS-domain protein in the

      mlaF-mlaE-mlaD-ttg2D-ttg2E locus. The report correctly recognizes this as the

      diagnostic architecture and operon position of an MlaB-equivalent accessory

      subunit [file:PSEPK/ttg2E/ttg2E-deep-research-openscientist.md, "This gene

      order (F‑E‑D‑C‑B) is identical to the canonical *E. coli* `mlaFEDCB` operon,

      unambiguously assigning **ttg2E = MlaB**."].


      Ortholog studies support roles in transporter assembly and activity, but the

      precise effect on KT2440 MlaF is untested. The review therefore assigns no

      catalytic molecular function and retains the mechanism as a knowledge gap.

      The report''s retrograde-direction and direct toluene-tolerance language is
      not

      promoted to a Ttg2E-specific annotation.

      '
    sha256: c5026729317a78006df0d4825a5d77b1520d2c435ca8c4fad778940498f6b447
  genes/PSEPK/vacJ/vacJ-notes.md:
