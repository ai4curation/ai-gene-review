- path: genes/PSEPK/putP/putP-ai-review.yaml
  row_index: 7
  term:
    id: GO:0031402
    label: sodium ion binding
  evidence_type: IEA
  original_reference_id: GO_REF:0000120
  before_action: MARK_AS_OVER_ANNOTATED
  submitted_action: ACCEPT
  final_action: ACCEPT
  before_reason: Sodium interaction is inherent in the substrate-specific symporter reaction; the
    electronic row does not establish an additional binding function.
  final_reason: 'The specific PutP/Na-proline symporter assignment and curated RuleBase sodium-dependent
    uptake statement support sodium binding as a conserved mechanistic interaction. A separate standalone
    sodium-binding role is not required by GO:0031402. This is inference for KT2440, not a target-specific
    affinity or stoichiometry measurement. The evidence remains weaker than the direct Na+-protection/binding
    experiments on E. coli PutP (PMID:1567896): neither sodium affinity, stoichiometry, nor binding
    without proline has been measured here. The shared ACCEPT action judges the supported central
    interaction; it does not equate evidence codes or experimental coverage.'
  final_supported_by:
  - reference_id: file:PSEPK/putP/putP-uniprot.txt
    record_section:
    - DR:NCBIfam
    supporting_text: DR   NCBIfam; TIGR02121; Na_Pro_sym; 1.
  - reference_id: file:PSEPK/putP/putP-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Catalyzes the sodium-dependent uptake of extracellular L- proline.
