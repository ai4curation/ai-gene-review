- path: genes/ECOLI/putA/putA-ai-review.yaml
  row_index: 40
  term:
    id: GO:0097054
    label: L-glutamate biosynthetic process
  evidence_type: IDA
  original_reference_id: PMID:12009917
  before_action: KEEP_AS_NON_CORE
  submitted_action: ACCEPT
  final_action: ACCEPT
  before_reason: 'Glutamate is the literal product of the PutA two-step reaction, so the term is
    formally true; these IDA rows appear to replace the obsoleted GO:0010133 L-proline catabolic
    process to L-glutamate. Physiologically the process is proline catabolism (GO:0006562, accepted),
    and de novo glutamate biosynthesis in E. coli is via glutamate dehydrogenase/GOGAT; so the term
    is kept but non-core (same judgment as the yeast PUT2 review). Not REMOVE: unlike L-proline biosynthesis,
    the direction is correct. Note that PutA669 studied here lacks the GSALDH step, so the full-length
    data underpin this row.'
  final_reason: PutA directly catalyzes formation of L-glutamate from proline via glutamate semialdehyde.
    GO:0097054 is defined by formation of L-glutamate and does not require a de novo anabolic route
    or exclude formation during amino-acid catabolism. This is direct product-forming chemistry,
    not merely a growth phenotype. Retain it as part of the central two-step reaction alongside proline
    catabolism. The PutA669 fragment lacks the GSALDH reaction; full-length protein evidence supports
    glutamate formation.
  final_supported_by:
  - &id001
    reference_id: file:ECOLI/putA/putA-uniprot.txt
    record_section:
    - CC:FUNCTION
    supporting_text: Oxidizes proline to glutamate for use as a carbon and nitrogen source
  - reference_id: PMID:22040654
    supporting_text: performs the oxidation of proline to glutamate in two catalytic steps using
      separate proline dehydrogenase (PRODH) and Δ(1)-pyrroline-5-carboxylate (P5C) dehydrogenase
      domains
