status: RESOLVED_WITH_EXPLICIT_BIOLOGICAL_GAPS
findings:
- selector: BcsA PANTHER:PTHR43867:SF2 AND InterPro:IPR003919
  target: UniProtKB:E5RST0
  review: genes/THEVL/Tvtll0007/Tvtll0007-ai-review.yaml
  observed: The genuine RKN cellulose synthase has SF2 membership but no IPR003919 cross-reference in its frozen
    record. It carries generic GT2 and PilZ signatures.
  implication: The IPR003919 requirement excludes an experimentally supported cyanobacterial synthase. SF2
    alone remains too broad because it includes other GT2 chemistries.
  source:
    path: genes/THEVL/Tvtll0007/Tvtll0007-uniprot.txt
    sha256: d389c23851b4942be59a85b73efd52409d04fca88fce5dc8ee07f2b863df0400
  resolution: Replaced the universal IPR003919 conjunction with SF2 plus independently supported cellulose
    synthase activity. RKN and CslA positive cases and a synthetic family-only negative case pass.
  verification: capacity-results.yaml
- selector: BcsB PANTHER:PTHR39083
  target: UniProtKB:Q3J126
  review: genes/CERS4/RSP_0332/RSP_0332-ai-review.yaml
  observed: The directly assayed Rhodobacter BcsB record has no PANTHER cross-reference; it has PF03170, IPR018513
    and IPR048861.
  implication: A PTHR39083-only selector is not demonstrated to cover this structural exemplar.
  source:
    path: genes/CERS4/RSP_0332/RSP_0332-uniprot.txt
    sha256: 6ab460acbc542188b5f34d7e8f6b406b6e1b202dab493b6388054b9f53c348a3
  resolution: Uses verified IPR018513 membership, covering structurally characterized Q3J126 without a PANTHER
    assignment.
  verification: capacity-results.yaml
- selector: BcsQ InterPro:IPR017746
  target: UniProtKB:P37655
  review: genes/ECOLI/bcsQ__P37655/bcsQ__P37655-ai-review.yaml
  observed: The native K12 predicted pseudogene fragment and the intact/repaired P0DP92 both retain the BcsQ
    family signature.
  implication: Family presence alone cannot prove a native functioning cellulose secretion system.
  source:
    path: genes/ECOLI/bcsQ__P37655/bcsQ__P37655-uniprot.txt
    sha256: 137fa35bc21995e6fe2cb40263ff02d9e7c2562dda8e3aa19927071849f52ff9
  resolution: Separate intact/repaired P0DP92 and native P37655 records; the enterobacterial route requires
    the reviewed intact representative. No isolated-fragment ATP chemistry is declared disproven.
  verification: capacity-results.yaml
- selector: BcsB family annotation prose
  target: InterPro:IPR018513 and Pfam:PF03170
  observed: The official IPR018513 description calls BcsB the catalytic multi-transmembrane cellulose synthase;
    PF03170 says BcsB binds c-di-GMP. These statements conflict with the structurally resolved BcsA catalytic/PilZ
    and periplasmic noncatalytic BcsB roles.
  implication: Use these signatures as sequence-family evidence, not as support for BcsB catalysis or direct
    c-di-GMP binding.
  primary_sources:
  - PMID:23222542
  - PMID:24704788
  resolution: Official IPR018513 and PF03170 responses and provenance are retained in module source-analysis;
    primary structures govern the role.
  verification: modules/bacterial_cellulose_biosynthesis-source-analysis/family-source-provenance.json
