GO:0002143:
  url: https://www.ebi.ac.uk/QuickGO/services/ontology/go/terms/GO:0002143
  term:
    numberOfHits: 1
    results:
    - id: GO:0002143
      isObsolete: false
      name: tRNA wobble position uridine thiolation
      definition:
        text: The process in which a uridine residue at position 34 in the anticodon of a tRNA is post-transcriptionally
          thiolated at the C2 position. This process involves transfer of a sulfur from L-cysteine to
          position C2 by several steps.
        xrefs:
        - dbCode: PMID
          dbId: '16871210'
      comment: In E. coli, the first step of the reaction is reductive elimination of sulfur from L-cysteine
        by IscS cysteine desulfurase to form an enzyme-bound cysteine-persulfide intermediate. Then, five
        essential gene products, TusA, TusB, TusC, TusD and TusE, mediate a sulfur relay that delivers
        the terminal sulfur of persulfide from IscS to MnmA12. The last protein, MnmA catalyzes the transfer
        of the sulfur from IscS to an ATP activated U34 of the tRNA.
      synonyms:
      - name: tRNA wobble uridine thiolation
        type: exact
      - name: wobble position s2U biosynthesis
        type: exact
      children:
      - id: GO:1990799
        relation: is_a
      aspect: biological_process
      usage: Unrestricted
    pageInfo: null
  ancestors:
