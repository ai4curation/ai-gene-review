sources:
  relay:
    path: publications/PMID_16387657.md
    quote: IscS transfers the persulfide sulfur to TusA.
    scope: Positive recombinant E. coli full-relay result; normal cache abstract-only.
  assembly:
    path: publications/PMID_16472754.md
    quote: forming a heterohexamer composed of a dimer of the heterotrimer.
    scope: Positive E. coli TusBCD structure and TusD cysteine result; normal cache abstract-only.
  terminal_uncertainty:
    path: publications/PMID_39660893.md
    quote: proof that TusE transfers the persulfide directly to MnmA in E. coli remains to be definitively provided.
    scope: Full critical review; unresolved last covalent handoff and D-type Fe-S dispute.
  kt2440_bridge:
    path: analysis/module_audits/bacterial_mnma_trna_thiolation/existing-review-consultation/sequence-bridge.yaml
    scope: Target-specific sequence and active-site inference, not target assay.
  kt2440_scope:
    path: analysis/module_audits/bacterial_mnma_trna_thiolation/existing-review-consultation/evidence.md
    scope: Distinct roles/signatures and locus neighborhood; no native measured flux.
  bacillus:
    path: publications/PMID_25825430.md
    quote: YrvO is able to transfer sulfur directly to MnmA.
    scope: Positive cognate reconstitution; normal cache abstract-only, full publisher bridge below.
  bacillus_bridge:
    path: analysis/module_audits/bacterial_mnma_trna_thiolation/preflight/source-ledger.json
    scope: Actual publisher access and PS832/168 identity bridge; full page artifacts frozen separately.
  thermus:
    path: publications/PMID_31801798.md
    quote: In the absence of reductant, s2U was readily formed by the cysteine desulfurases using cysteine as the sulfur donor.
    scope: Full primary; HB27 holoenzyme and either donor, unknown native allocation.
  thermus_identity:
    path: publications/PMID_16547008.md
    scope: Exact TTC0087/TTC1373 locus bridge; original U54 experiment not treated as U34 assay.
  simplified_ecoli:
    path: publications/PMID_12549933.md
    scope: Simplified IscS/MnmA in-vitro activity is a real boundary control, not proof of physiological Tus dispensability.
controls:
  A0R5M7:
    path: analysis/module_audits/bacterial_mnma_trna_thiolation/family-consultation/A0R5M7-uniprot.json
    positive_activity: EgtE ergothioneine-pathway C-S lyase
    limit: Same SF8 as Thermus SufS; not source-qualified as its cognate MnmA donor. No secondary desulfurase absence asserted.
  Q59072:
    path: analysis/module_audits/bacterial_mnma_trna_thiolation/family-consultation/Q59072-uniprot.json
    positive_activity: SepCysS Sep-tRNA to Cys-tRNA conversion
    limit: Same parent family, different substrate and cellular lineage; not MnmA U34 delivery evidence.
  O67046:
    path: analysis/module_audits/bacterial_mnma_trna_thiolation/family-consultation/O67046-uniprot.json
    positive_activity: unreviewed SF6 classification only
    limit: Same parent as MnmA, no supported exact U34 activity or compatible pairing; absence of activity not asserted.
