- id: PMID:33744947
  type: PRIMARY_RESEARCH
  title: 'Iron–sulfur biology invades tRNA modification: the case of U34 sulfuration'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC8053098/
  access: Full Europe PMC XML; strain, reconstitution, activity and genetic sections read
  source: PMC8053098.txt
  quote: All strains used in this study are  E. coli  K-12 MG1655 derivatives.
  finding: MG1655-cloned MnmA binds a reconstituted Fe-S cluster and the reported sulfide-fed activity
    requires that state. Native genetic experiments retain U34 thiolation after loss of ISC/SUF assembly
    machinery.
  limits: Cluster assembly used CsdA in vitro; this does not identify CsdA as the native U34 sulfur donor.
    Sulfide-fed assay differs from the 2024 IscS/cysteine/bulk-tRNA experiment. Native Fe-S requirement
    remains disputed.
  source_sha256: 8b7424ad7723c3ff6c486412957de617ba5fc6af7ecf1575f2233316e46497ac
  curation_use: Boundary/step evidence
