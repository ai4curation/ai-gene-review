- id: PMID:39660893
  type: REVIEW
  title: '2-Thiouridine formation in Escherichia coli: a critical review'
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC11784392/
  access: Full Europe PMC XML; relevant mechanistic sections read
  source: PMC11784392.txt
  quote: These apparent differences in experimental findings need to be investigated and clarified in
    future studies.
  finding: The 2025 review explicitly contrasts the 2021 and 2024 E. coli MnmA Fe-S results. It distinguishes
    established adenylation and sulfur-relay participation from unresolved terminal sulfur activation.
    Tus proteins increase the reconstituted E. coli reaction substantially; in-vitro two-enzyme sufficiency
    is not proof of native Tus dispensability.
  limits: Secondary synthesis, not a new assay. Do not copy its evolutionary or oxygen generalizations
    as universal rules. No universal D-type Fe-S requirement or absence is established.
