- id: PMID:25825430
  type: PRIMARY_RESEARCH
  title: Abbreviated Pathway for Biosynthesis of 2-Thiouridine in Bacillus subtilis
  url: https://journals.asm.org/doi/10.1128/jb.02625-14
  access: Publisher full text genuinely accessible through web; methods and results captured in two web-result
    JSONs. Europe PMC XML failed twice (HTTP500), preserved as failures
  source: 25825430-web-result.json
  additional_source: 25825430-web-results.json
  quote: All genes were amplified from B. subtilis strain PS832 genomic DNA
  finding: PS832 is explicitly a 168 derivative. Native conditional MnmA expression correlates with thiolation;
    purified YrvO/MnmA and coexpression in E. coli mutants establish a direct two-enzyme route. Individual
    cross-species replacements failed under the tested conditions; pairing is mechanistically important.
    ATP permits YrvO-to-MnmA sulfur transfer.
  limits: Conditional strain retains residual MnmA; failed knockouts do not prove universal essentiality.
    E. coli rescue is heterologous. An in-vitro IscS comparator is Azotobacter vinelandii, not E. coli.
    Pair specificity is assay-bounded, not universal incompatibility.
  source_sha256: 3a8bf6477f19ef5607600d61a03fa5b4d0d1379bb60dbb682ae91d9f5930c393
  additional_source_sha256: 2171b4e6f136da02d6cce1b54259996350eb0c2da1b9424882536f1860df98cb
  curation_use: Boundary/step evidence
- id: PMID:31801798
  type: PRIMARY_RESEARCH
  title: An ancient type of MnmA protein is an iron-sulfur cluster-dependent sulfurtransferase for tRNA
    anticodons
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC7025502/
  access: Full Europe PMC XML; methods and catalytic/donor results read
  source: PMC7025502.txt
  quote: suggest direct persulfide transfer from the cysteine desulfurases to MnmA
  finding: HB27 TT_C1727 was expressed with a C-terminal His6 tag in E. coli. Reconstituted C-type MnmA
    supports multiple-turnover U34 thiolation of Lys/Gln transcripts; U34A, apoenzyme and omitted ATP/sulfide
    controls distinguish activity. Both Thermus IscS and SufS support cysteine-fed thiolation after reductants
    are removed. C105/C108/C200 mutations test the cluster ligands.
  limits: Purified pair capacity does not identify native donor choice, exclude an unknown carrier or
    establish in-vivo flux. Do not conflate chemical sulfide supplementation with a native sulfide pathway.
    U54 thiolation uses another enzyme.
  source_sha256: 2014399403caafffde2fec8545bc85515d27c6290fc3dc065aacba490ea49e2c
  curation_use: Boundary/step evidence
