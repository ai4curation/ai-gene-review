  title: E. coli MnmA Is an Fe-S Cluster-Independent 2-Thiouridylase
  url: https://mdpi-res.com/d_attachment/inorganics/inorganics-12-00067/article_deploy/inorganics-12-00067.pdf
  access: Genuine publisher PDF200; pdftotext; activity, binding and purification sections read. Publisher
    HTML403 retained separately
  source: 2024-counterclaim.txt
  quote: The [4Fe-4S] Cluster Inhibits the tRNA Thiolation Activity of E. coli MnmA
  finding: Aerobically purified MnmA, including protein from CL100 delta-iscS, supports bulk-tRNA thiolation
    with IscS/cysteine/ATP; reconstituted protein loses activity. SPR finds weaker IscS binding after
    reconstitution. BL21 and CL100 are expression hosts; the source does not supply an accession-level
    construct sequence bridge.
  limits: This conflicts with 33744947; neither should be silently discarded. Reconstitution, donor chemistry,
    substrate preparation and assays differ. Do not infer universal D-type cofactor absence or a generic
    oxygen switch.
