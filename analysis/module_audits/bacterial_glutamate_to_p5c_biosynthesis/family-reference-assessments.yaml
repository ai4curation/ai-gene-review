family: PANTHER:PTHR43654
references:
- id: PMID:25367752
  title: 'Evolution of proline biosynthesis: enzymology, bioinformatics, genetics,
    and transcriptional regulation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review, cached abstract and publisher full text read.
      Separates widespread glutamate route, fused eukaryotic P5CS and alternative
      ornithine routes. Older channeling interpretations are qualified by the 2024
      primary study.
  findings:
  - statement: Split ProB/ProA chemistry is evolutionarily widespread but not universal;
      alternative ornithine routes can supply proline.
  - statement: Plant and animal P5CS joins kinase and reductase activities that are
      separate in the bacterial route.
- id: PMID:39514317
  title: 'Challenging a decades-old paradigm: ProB and ProA do not channel the unstable
    intermediate in proline synthesis after all.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. Structural perturbations, activity assays
      and diffusion calculations address E. coli split enzymes; conclusions are not
      generalized to fused P5CS filaments.
  findings:
  - statement: Proline synthesis persists after changes expected to prevent a specific
      ProB–ProA interface, arguing against obligatory channeling.
  - statement: The calculated intermediate lifetime permits diffusion across an E.
      coli cell before most intermediate cyclizes to a dead-end product.
- id: PMID:37511294
  title: Investigating the Prevalence of RNA-Binding Metabolic Enzymes in E. coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. K12 ASKA ProB was recloned for protein purification;
      positive ProB evidence is SELEX and competition EMSA, not iCLIP. Weak affinity,
      unresolved binding site and unproven physiological effect constrain interpretation.
  findings:
  - statement: Specific in-vitro RNA binding by E. coli ProB contradicts a blanket
      family-wide claim that no member binds RNA.
  - statement: RNA binding is not required to represent either proline-biosynthetic
      reaction and is not established for the other exemplars.
