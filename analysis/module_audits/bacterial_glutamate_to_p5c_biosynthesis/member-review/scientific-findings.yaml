scope: Four complete bacterial individual reviews plus bounded RNA-row corrections
  in two yeast comparators. No NEW annotations or family/module edits.
findings:
- reference: PMID:39514317
  finding: ProB and ProA catalyze sequential reactions; channeling is not required
    for the tested E. coli growth conditions.
  quote: By changing the structures of either the kinase or the reductase, we show
    that channeling is not required to support proline synthesis in vivo.
  scope: K-12 BW25113 genetic/growth derivatives; biochemical expression in engineered
    BL21(DE3), including His6-ProA and SUMO-cleaved ProB. Failed photocrosslinking
    is not standalone proof of absence; predicted interfaces and GP lifetime/diffusion
    values are computational. This does not rule out all conditional interactions
    or establish results for KT2440.
- reference: PMID:39514317
  finding: Native-locus monomeric reporter fusions support cytoplasmic distribution
    rather than the polar localization caused by overexpression with oligomerizing
    GFP.
  quote: both proteins are dispersed throughout the cytoplasm
  scope: ProA/ProB-msfGFP native-locus fusions; retain distinction between fluorescence
    localization and untagged wild-type imaging.
- reference: PMID:37511294
  finding: The universal assertion that no glutamate kinase binds RNA is contradicted
    by a purified K-12 ProB experiment.
  quote: Representative EMSA experiments with one of those sequences confirmed the
    specific binding.
  scope: ASKA K-12 proB recloned into pET21a, C-terminal His tag, BL21-Gold(DE3) expression.
    SELEX and competition EMSA; not a positive ProB iCLIP experiment. Estimated KD
    >>10 micromolar; selected tktA antisense RNA not established as native physiological
    target, binding site not mapped. Retain measured intrinsic activity non-core,
    do not grant RNA regulation or family-wide binding.
- reference: PMID:37511294
  finding: ProB construct provenance is explicit in the primary methods.
  quote: ansB and proB were cloned into pET21a, because a C-terminal His-tag gave
    better yields.
  scope: The ASKA K-12 donor and BL21-Gold expression host are different concepts;
    MG1655 RNA-read mapping is not donor-strain evidence.
- reference: PMID:20970428
  finding: A functional dimer explains refinement from identical-protein binding to
    the existing homodimerization term.
  quote: the functional unit of the E. coli enzyme is dimeric
  scope: Accessible primary abstract. Tetramer is a dimer of dimers; no claim whole
    purified enzyme is only dimeric.
ontology:
  source: Official QuickGO term responses copied unchanged under this directory. URLs
    and complete JSON retained.
  GO:0004350: Exact NADP-dependent reversible GSA/glutamyl-phosphate chemistry; P5C
    formation is spontaneous, not a ProA cyclase activity.
  GO:0050661: Definition includes either NADP+ or NADPH.
  GO:0042803: is_a GO:0042802, verified in parent children list.
  GO:0005829: part_of GO:0005737, verified in parent children list.
family_recommendation: 'Root-owned PTHR43654: retract universal RNA-negative premise,
  retain positive named-member E. coli biochemical evidence and unresolved extrapolation
  to untested PSEPK/yeast/SCHPO targets. PUA regulation does not exclude RNA binding,
  and the positive RNA-binding site is not established as PUA.'
literature_limits:
- Existing 15 publication caches protected; no refresh. Abstract-only early primary
  evidence retained with explicit limits rather than overruling expert experimental
  annotations.
- New comparative PMID25367752 and EcoSal review26443591 were normally fetched but
  remain abstract-only. Their review status is evident from content despite automated
  publication_type metadata; no unviewed full text is claimed.
- No target-specific purified KT2440 ProA/ProB assay identified. Curated HAMAP supports
  chemistry/location inference; no physical-channeling or native RNA-regulation transfer.
research_attempts:
  provider: falcon
  targets:
  - ECOLI/proA
  - ECOLI/proB
  - PSEPK/proA
  - PSEPK/proB
  outcome: All failed403 authentication/access; logs retained, no provider files created.
remaining_advisory: The bounded yeast PRO1 comparator edit intentionally leaves its
  prior channeling-related biological description outside this RNA-only scope; it
  is not independent bacterial module evidence.
