limits:
- Manually reviewed source-based reaction assignments exercise module wiring. They combine direct and
  inferred evidence as explicitly labeled; they do not prove native pathway flux or equal experimental
  characterization.
- The production circuit does not enforce taxon, same-system or distinct-polypeptide identity; the explicit
  external gates do.
- Curation actions and RNA-binding judgments are not used to create positive catalytic evidence.
- A panel failure cannot establish a missing genomic pathway, especially where a bypass is known.
