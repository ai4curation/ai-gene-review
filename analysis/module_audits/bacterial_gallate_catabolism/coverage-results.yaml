limits:
- Manual reaction-level evidence assertions paired with independently fetched family classification. These
  are curated coverage inputs, not an independent biological experiment or a proteome scan. Inferred and
  direct assignments are explicitly distinguished.
- The production compiler does not enforce reaction substrate identity; this checker supplies that gate
  explicitly.
- Curation actions are not used as the activity oracle.
- Coverage is neither native flux nor taxonomic absence; the mixed-strain positive is explicitly synthetic.
