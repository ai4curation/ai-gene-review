  genes/PSEPK/galD: 'Keto-enol tautomerization is distinguished from the LigU 1,3-allylic C=C migration.
    The existing specific proposed term is now the core function and MODIFY replacement, parent GO:0016862.
    The original GO:0016863 payload is intact. PMID:21219457 identifies GalD activity in recombinant extracts;
    the deletion grows at high gallate but poorly at lower concentration, so lack of absolute necessity
    does not negate catalytic participation. GalD and LigU share PrpF-family membership without implying
    identical substrate transformations.


