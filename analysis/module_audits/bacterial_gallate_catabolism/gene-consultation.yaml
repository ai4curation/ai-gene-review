  genes/SPHSK/ligJ: 'KCH hydration, zinc coordination and Glu284 mechanism are supported by PMID:30207699;
    the protected cache is abstract-only but explicitly describes the structural/kinetic results. PDB6DWV
    entity1 maps G2IQQ5 and exactly matches all341 residues, preserved in structure-identity.json. The
    existing KCH-specific NTR is now the core activity rather than broad hydro-lyase. All four inherited
    NEW rows/actions are intact. Zinc binding is mechanistically central. The historical native genetics
    in PMID:11092855 and soluble pathway enzymology are distinguished from direct subcellular localization;
    cytoplasm remains a non-core inferred assignment. The enzyme acts on soluble ring-cleavage intermediates,
    and no direct lignin-polymer degradation is asserted.


