findings:
  genes/PSEPK/galA: 'GalA directly performs the Fe(II)-dependent gallate ring cleavage (PMID:16030014).
    Broad oxidoreductase terms are now MODIFY to GO:0036238, and catalytic iron binding is ACCEPT consistently
    across the two rows. The product is keto-OMA, resolved by the 2011 NMR study. The native growth tests
    use KTGAL, whose GalT frameshift is repaired; the GalA sequence is unchanged from KT2440.


    Research: protected genuine provider reports were read as leads and remain byte-identical. All original
    non-review annotation payloads, order and inherited NEW actions are retained; no new annotation row
    was added. Sources were not refreshed. Current ontology responses and pre-edit proofs are in the ignored
    gallate-20261106/gene-review audit cache.'
  genes/PSEPK/galB: 'Recombinant GalB directly hydrates OMAenol/CHM to CHA, contains one zinc per subunit
    and forms a homohexamer (PMID:21219457, full publisher text read). This is not an amidase merely because
    the fold belongs to the MshB/LmbE group. GO:0047584 remains the established hydratase assignment;
    its current keto-OMA wording differs from the experimentally resolved enol immediate substrate and
    curated RHEA:17401. Neither that term nor fold identity establishes KCH-specific LigJ chemistry. Native
    galB insertion has downstream galD polarity, so its growth defect is not treated as a clean single-step
    assay; recombinant chemistry independently supports participation.


