    secondary oxaloacetate decarboxylation, magnesium dependence, and a homohexamer. Current GO:0047443
    includes CHA cleavage explicitly; the short HMG name is not evidence of a different target reaction.
    Retain directly demonstrated secondary OAA decarboxylase as non-core. HMG formation is curated from
    PMID:29658701, whose protected cache is abstract-only; do not invent its assay conditions. Retain
    historical gallate NEW and the PCA pathway assertion. Replace polymer-level lignin scope with the
    chemically defined lower PCA pathway.


