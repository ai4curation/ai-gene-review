  genes/NOVK1/ligU: 'PMID:31339729 explicitly identifies KA1 LigU and supplies independent target-grounded
    structural/mechanistic evidence; normal fetch initially returned429, then succeeded with abstract-only
    cache. PDB6P3J entity1 maps Q0KJL4 and contains the complete unchanged 357-aa target within its 365-aa
    expression construct. This supports the curated KA1 attribution of PMID:29658701 despite its SYK-6
    title; that older protected cache remains abstract-only and no purported full-methods reading is claimed.
    Both historical IDA NEW rows are retained. The core now uses the existing substrate-specific NTR.
    Polymer-defined lignin BP is laterally replaced with the demonstrated lower PCA pathway. A complete
    native KA1 gallate route is not established by this single enzyme.


