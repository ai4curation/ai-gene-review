  genes/PSEPK/galP: 'Full PMID:21219457 publisher text reports a GalP-specific uptake phenotype overlooked
    by the provider: KTGALdgalP has 4.2 versus 7.4 nmol/min/mg uptake at 10 micromolar gallate, while
    growth is unaffected. This is the adapted GalT-restored KTGAL strain; its GalP sequence is unchanged
    from KT2440. OprD/outer-membrane porin family signatures support porin activity and inferred outer-membrane
    localization; no product-name evidence is used. Whole-cell uptake does not establish isolated-channel
    specificity or a GalP-only inner-membrane transport step. No additional GO assertion is needed to
    encode this qualified evidence, since transport and porin rows already cover its supported work.


