  genes/SPHPI/desB: 'New normally fetched primary PMID:24657997 provides direct DesB iron-center structure
    and substrate-recognition evidence. PDB3WR9 entity1 maps Q5NTE5 and exactly matches all 418 residues
    of the frozen record; structure-identity.json preserves the bridge. Therefore FeII binding is ACCEPT
    as catalytic, replacing an outdated family-only caveat. The legacy species code/taxon payload remains
    untouched; the biological experimental strain is SYK-6. Both historical NEW annotations remain unchanged
    as assertions. The assay demonstrates chemistry and mutant-supported native aromatic utilization,
    not universal gallate growth for every family member.


