  source_path: .cache/module-audit-logs/mcl-pha-20261107/literature-consultation/from-preflight/review2025.txt
  source_sha256: 262ec6e7193fa80c63eaac2d603607abef0dcec1477652e84e3116f4aaa41dc5
  publication_type: REVIEW
  access_scope: FULL; classification, specificity, and PhaZ sections manually read
  reference_review:
    assessment: RELEVANT
    reviewed_by: codex
    rationale: Class II synthases are usual mcl-PHA anchors, but class labels are not absolute substrate
      exclusion rules; the review discusses C. necator class I acceptance of C8/C12 precursors in heterologous
      E. coli. Intracellular native-granule and extracellular denatured-polymer depolymerases are distinct
      roles. Publisher calls this OriginalPaper, but its content is a literature review.
  findings:
  - statement: Class II synthases are usual mcl-PHA anchors, but class labels are not absolute substrate
      exclusion rules; the review discusses C. necator class I acceptance of C8/C12 precursors in heterologous
      E. coli. Intracellular native-granule and extracellular denatured-polymer depolymerases are distinct
      roles. Publisher calls this OriginalPaper, but its content is a literature review.
    supporting_text: the substrate specificity of the different types of PhaCs is less strict than originally
      thought
    reference_section_type: REVIEW
- id: PMID:38845815
  source_path: publications/PMID_38845815.md
