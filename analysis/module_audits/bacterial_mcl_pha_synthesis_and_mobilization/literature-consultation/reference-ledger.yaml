- id: PMID:35338129
  source_path: publications/PMID_35338129.md
  source_sha256: 196dc3b20c8ca6a18bdbc56c8486781527d4d6468a0e3d84ae4cf48cb2410c94
  publication_type: PRIMARY_RESEARCH
  access_scope: FULL; genetic discrimination and bioprospecting Results read
  reference_review:
    assessment: RELEVANT
    reviewed_by: codex
    rationale: 'KT2440 PhaG expressed in E. coli supports forward ACP-to-CoA routing in genetic product-sink
      comparisons: the product does not depend on FadD reactivation. The paper explicitly lacks direct
      forward acyl-ACP in-vitro kinetics. Endogenous thioesterases offer an alternative explanation for
      free hydroxyacids in older experiments. The main subsequent enzyme optimization uses P. koreensis
      PhaG and is not KT2440 native physiology.'
  findings:
  - statement: 'KT2440 PhaG expressed in E. coli supports forward ACP-to-CoA routing in genetic product-sink
      comparisons: the product does not depend on FadD reactivation. The paper explicitly lacks direct
      forward acyl-ACP in-vitro kinetics. Endogenous thioesterases offer an alternative explanation for
      free hydroxyacids in older experiments. The main subsequent enzyme optimization uses P. koreensis
      PhaG and is not KT2440 native physiology.'
    supporting_text: no in vitro data on acyl-ACPs, the substrate in the forward direction is available
    reference_section_type: RESULTS
