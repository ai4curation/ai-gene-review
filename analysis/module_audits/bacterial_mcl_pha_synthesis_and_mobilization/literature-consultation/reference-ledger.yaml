- id: PMID:22101037
  source_path: publications/PMID_22101037.md
  source_sha256: 984ad0f033d0abe924629df909130f4b082f7e979180e2e023f3aa23816e61eb
  publication_type: PRIMARY_RESEARCH
  access_scope: FULL; native KT2440 composition/expression and heterologous Results read
  reference_review:
    assessment: RELEVANT
    reviewed_by: codex
    rationale: This study inferred PhaG thioesterase chemistry from heterologous free hydroxyacid accumulation
      and increased PHA when PP0763 was coexpressed. It did not isolate PhaG hydrolysis from endogenous
      CoA-thioester hydrolysis. Preserve the observed phenotype while reassessing that interpretation
      against the 2022 controls; do not make PP0763 universally required for PhaG routing. Native KT2440
      polymer composition is measured separately from recombinant E. coli output.
