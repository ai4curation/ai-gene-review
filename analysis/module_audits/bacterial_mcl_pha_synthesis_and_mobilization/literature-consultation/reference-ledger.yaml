  publication_type: PRIMARY_RESEARCH
  access_scope: ABSTRACT_ONLY; corrected Wiley full URL returned403
  reference_review:
    assessment: RELEVANT
    reviewed_by: codex
    rationale: PAO1 PhaG supports complementation of a P. putida phaG mutant; the resulting polymer contains
      C6/C8/C10/C12. Native P. aeruginosa phaG disruption reduces gluconate-supported PHA to about40%
      of wild type while fatty-acid-supported accumulation remains at wild-type level. This establishes
