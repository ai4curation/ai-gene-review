- id: PMID:1989978
  source_path: publications/PMID_1989978.md
  source_sha256: cf3f9fa976f2a2518c5e1e37a0295988841ddc78f07db4dddbbc7f0cfc4501b3
  publication_type: PRIMARY_RESEARCH
  access_scope: ABSTRACT_ONLY; publisher and institutional PDF access returned403
  reference_review:
    assessment: RELEVANT
    reviewed_by: codex
    rationale: The original GPo1 locus study selected synthase/degradation complementation and sequenced
      the two synthases and intervening depolymerase. M58445 CDS translations exactly match P26494/P26495/P26496.
      It does not establish a mandatory sequential C1/C2 division, and the abstract reports no clear specificity
      difference.
  findings:
  - statement: The original GPo1 locus study selected synthase/degradation complementation and sequenced
      the two synthases and intervening depolymerase. M58445 CDS translations exactly match P26494/P26495/P26496.
      It does not establish a mandatory sequential C1/C2 division, and the abstract reports no clear specificity
      difference.
    supporting_text: No clear difference in specificity was found for the PHA polymerases.
    reference_section_type: ABSTRACT
