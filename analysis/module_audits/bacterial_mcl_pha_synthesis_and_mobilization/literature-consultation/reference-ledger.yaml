  publication_type: REVIEW
  access_scope: FULL; introduction and producer/feedstock sections manually read
  reference_review:
    assessment: RELEVANT
    reviewed_by: codex
    rationale: The mcl range is C6–C14, distinct from C3–C5 scl-PHA. Wild-type production reports extend
      beyond Pseudomonas, but a polymer-production report does not identify the matching synthase/depolymerase
      pair or license family-only role transfer. Composition depends on feedstock; C8/C10 are frequent,
      not exclusive.
  findings:
  - statement: The mcl range is C6–C14, distinct from C3–C5 scl-PHA. Wild-type production reports extend
      beyond Pseudomonas, but a polymer-production report does not identify the matching synthase/depolymerase
      pair or license family-only role transfer. Composition depends on feedstock; C8/C10 are frequent,
      not exclusive.
    supporting_text: comprising different monomers containing 6-14 carbon atoms
    reference_section_type: ABSTRACT
