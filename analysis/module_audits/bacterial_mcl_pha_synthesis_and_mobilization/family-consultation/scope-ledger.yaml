scope_changes:
- family: PTHR36837
  term:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: Characterized synthases perform non-amino-acyl transfer during polyester elongation. A whole-family
    grant is withheld for unresolved branches; this does not deny the positive class I/class II synthase
    members or assert a hydrolase loss from a submitter label.
- family: PTHR36837
  term:
    id: GO:0042621
    label: poly(3-hydroxyalkanoate) biosynthetic process
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: Positive PHA biosynthesis is established for the characterized synthases. Family and SF5 classification
    alone do not resolve polymer composition, partner requirements or activity of every member.
- family: PTHR36837
  term:
    id: GO:0042619
    label: poly-hydroxybutyrate biosynthetic process
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: PHB formation is directly supported for C. necator P23608; the same SF5 includes mcl-PHA synthases.
    The PHB-specific process cannot be granted from SF5 membership alone. This is a scope uncertainty,
    not an assertion that class II enzymes never accept C4 or that class I enzymes never accept longer
    precursors. Primary10612741 reports C8/C12 comonomer incorporation by the class I enzyme in engineered
    E. coli precursor contexts; this is PHB-rich copolymer synthesis, not a pure-mcl-polymer or complete
    native H16 turnover assay.
- family: PTHR36837
  term:
    id: GO:0070088
    label: polyhydroxyalkanoate granule
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: Granule-associated function is supported for bacterial PHA synthesis systems, but universal
    location and polymer context are not established for all branches of this broad family.
- family: PTHR43194
  term:
    id: GO:0016787
    label: hydrolase activity
  prior_scope: FAMILY_WIDE
  current_scope: UNRESOLVED
  reason: Broad hydrolase activity is established in several branches, but the family also includes acyltransferases.
    PhaG hydroxyacid/ligase phenotypes do not uniquely establish intrinsic thioesterase activity; 2022
    product-sink controls favor ACP-to-CoA transfer. Neither secondary hydrolysis nor its universal absence
    is established. The pre-existing AcoC E2 acetyltransferase judgment is retained in notes and the archived
    original term assessment; its schema representation changes only because UNRESOLVED cannot carry member_exceptions.
    AcoC Q88QE1 remains judged not to perform hydrolase activity in this family review, on its E2 acetyltransferase
    assignment. The current schema/semantic combination cannot preserve that independently negative member
    as a live member_exceptions object under UNRESOLVED; current-member-judgments.yaml retains it explicitly,
    with the enforcement limitation documented.
  prior_exceptions:
  - member:
      id: UniProtKB:Q88QE1
      gene_symbol: acoC
      organism: Pseudomonas putida KT2440
    exception_reason: 'The E2 of the acetoin-cleaving system: lipoyl-dependent acetyl transfer to coenzyme
      A, not hydrolysis.'
    supported_by:
    - reference_id: file:genes/PSEPK/acoC/acoC-ai-review.yaml
      supporting_text: AcoC is the lipoyl-bearing E2 acetyltransferase assigned to the acetoin-cleaving
        system of Pseudomonas putida KT2440
  - member:
      id: UniProtKB:O85207
      gene_symbol: phaG
      organism: Pseudomonas putida KT2440
    exception_reason: A 3-hydroxyacyl transacylase routing ACP-bound intermediates to PHA synthesis.
    supported_by:
    - reference_id: file:genes/PSEPK/phaG/phaG-ai-review.yaml
      supporting_text: phaG encodes a PhaG-family acyltransferase that connects de novo fatty-acid synthesis
  representation: Q88QE1 current negative preserved in current-member-judgments.yaml; O85207 exclusions
    withdrawn as unsupported categorical secondary-activity negatives.
- family: PTHR43194
  term:
    id: GO:0090499
    label: pimelyl-[acyl-carrier protein] methyl ester esterase activity
  prior_scope: SUBFAMILY_ONLY
  current_scope: UNRESOLVED
  reason: BioH is a positive pimeloyl-ACP methyl esterase, but SF5 also contains PhaG and RhlA with established
    different pathway roles. Those positive functions do not prove absence of secondary BioH-like chemistry.
    No whole-SF5 grant, categorical negative PhaG exception, or precise historical pruning point is justified
    here.
  prior_exceptions:
  - member:
      id: UniProtKB:O85207
      gene_symbol: phaG
      organism: Pseudomonas putida KT2440
    exception_reason: PhaG is a PHA-pathway acyltransferase, not a biotin-pathway esterase.
    supported_by:
    - reference_id: file:genes/PSEPK/phaG/phaG-ai-review.yaml
      supporting_text: phaG encodes a PhaG-family acyltransferase that connects de novo fatty-acid synthesis
  representation: Q88QE1 current negative preserved in current-member-judgments.yaml; O85207 exclusions
    withdrawn as unsupported categorical secondary-activity negatives.
- family: PTHR43194
  term:
    id: GO:0016747
    label: acyltransferase activity, transferring groups other than amino-acyl groups
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: PhaG transfer is established for exact target proteins and RhlA has distinct acyl-transfer chemistry.
    Shared SF5 also contains BioH; no whole-family or whole-SF5 PhaG substrate grant is made. Forward
    routing is supported by genetic product-sink controls, not purified forward kinetics.
- family: PTHR43194
  term:
    id: GO:0042621
    label: poly(3-hydroxyalkanoate) biosynthetic process
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: PhaG supplies precursor-routing work for PHA synthesis, but the broader family/SF5 also includes
    other pathways. The routing step is not universally required for PHA accumulation on every carbon
    source.
- family: PTHR43433
  term:
    id: GO:0050527
    label: poly(3-hydroxyoctanoate) depolymerase activity
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: Intracellular mcl-PHA depolymerization is supported for the PhaZ lineage, including C8-rich
    polymer. Neither SF5 nor the whole family has this substrate specificity. PMID17170116 assays KT2442
    PhaZ; PMID41055782 also uses KT2442-derived constructs expressed in E. coli, with GPo1 supplying polymer.
    Q88D24 is the KT2440 reference and is supported by homolog/pathway/domain evidence, not relabeled
    as a directly assayed native KT2440 enzyme. Intracellular granule mobilization differs from secreted
    attack on extracellular polymer.
- family: PTHR43433
  term:
    id: GO:0042620
    label: poly(3-hydroxyalkanoate) metabolic process
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: PhaZ performs polyester mobilization; LipG/LipJ and other hydrolase roles do not establish universal
    PHA metabolism. PMID17170116 assays KT2442 PhaZ; PMID41055782 also uses KT2442-derived constructs
    expressed in E. coli, with GPo1 supplying polymer. Q88D24 is the KT2440 reference and is supported
    by homolog/pathway/domain evidence, not relabeled as a directly assayed native KT2440 enzyme. Intracellular
    granule mobilization differs from secreted attack on extracellular polymer.
- family: PTHR43433
  term:
    id: GO:0016787
    label: hydrolase activity
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: Positive hydrolysis is established in characterized branches, but this targeted review does
    not certify all family members. This is uncertainty about universal scope, not absence of hydrolase
    activity in the positive PhaZ/LipJ members.
- family: PTHR43433
  term:
    id: GO:0004806
    label: triacylglycerol lipase activity
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: Triacylglycerol hydrolysis and hydroxyalkanoate-polyester hydrolysis use different substrates.
    The original LipG seed is retained; no negative PhaZ TAG assay or universal TAG grant follows from
    classification.
- family: PTHR43433
  term:
    id: GO:0046503
    label: glycerolipid catabolic process
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: Glycerolipid catabolism is not synonymous with PHA turnover because PHA has no glycerol backbone.
    Actual secondary glycerolipid participation of every PhaZ relative remains unresolved.
- family: PTHR43433
  term:
    id: GO:0016020
    label: membrane
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: Intracellular storage-granule association does not by itself establish lipid-bilayer membrane
    localization, and secreted polymer degradation is a different role.
- family: PTHR43798
  term:
    id: GO:0016787
    label: hydrolase activity
  prior_scope: FAMILY_WIDE
  current_scope: FAMILY_WIDE
  reason: Fold-level hydrolase activity seeded on superfamily nodes. The lipoyl-domain acetoin E2 AcoC
    is an exception.
- family: PTHR43798
  term:
    id: GO:0047372
    label: monoacylglycerol lipase activity
  prior_scope: SUBFAMILY_ONLY
  current_scope: UNRESOLVED
  reason: ABHD6 is a positive monoacylglycerol lipase, but official SF5 also includes GPo1 PhaZ. Its native
    polyester-mobilization evidence does not establish monoacylglycerol hydrolysis and does not prove
    its absence. Retain positive ABHD6 biology without an unjustified universal SF5 grant or an invented
    PhaZ negative exception.
- family: PTHR43798
  term:
    id: GO:0050527
    label: poly(3-hydroxyoctanoate) depolymerase activity
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: GPo1 PhaZ supports native intracellular mcl-PHA mobilization, but exact poly(3-hydroxyoctanoate)
    substrate/product chemistry was not established by that mutant/rescue evidence. Neither a precise
    single-enzyme activity nor universal SF5 depolymerase activity is granted. Positive ABHD6 and PhaZ
    biology remain distinct.
- family: PTHR43798
  term:
    id: GO:0042620
    label: poly(3-hydroxyalkanoate) metabolic process
  prior_scope: NO_PRIOR_ASSESSMENT
  current_scope: UNRESOLVED
  reason: GPo1 PhaZ does work in native PHA turnover. The family contains other hydrolase functions, so
    this process is not universally granted.
