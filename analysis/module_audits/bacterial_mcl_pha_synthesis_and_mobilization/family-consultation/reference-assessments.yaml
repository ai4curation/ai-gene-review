      - evidences:
        - evidenceCode: ECO:0000269
          source: PubMed
          id: '2670936'
        value: Polymerizes (R)-3-hydroxybutyryl-CoA to create polyhydroxybutyrate (PHB) which consists
          of thousands of hydroxybutyrate molecules linked end to end. PHB serves as an intracellular
          energy reserve material when cells grow under conditions of nutrient limitation
      commentType: FUNCTION
  UniProtKB:Q9BV23:
    record_section: FUNCTION
    source: analysis/module_audits/bacterial_mcl_pha_synthesis_and_mobilization/family-consultation/Q9BV23-uniprot.json
    scope: Exact curated FUNCTION text, not submitter label or GO annotation; embedded ECO/publication
      evidence retained in official JSON.
    evidence:
    - texts:
      - evidences:
        - evidenceCode: ECO:0000250
          source: UniProtKB
          id: Q8R2Y0
        - evidenceCode: ECO:0000269
          source: PubMed
          id: '22969151'
        - evidenceCode: ECO:0000269
          source: PubMed
          id: '26491015'
        value: Lipase that preferentially hydrolysis medium-chain saturated monoacylglycerols including
          2-arachidonoylglycerol (PubMed:22969151). Through 2-arachidonoylglycerol degradation may regulate
          endocannabinoid signaling pathways (By similarity). Also has a lysophosphatidyl lipase activity
          with a preference for lysophosphatidylglycerol among other lysophospholipids (By similarity).
          Also able to degrade bis(monoacylglycero)phosphate (BMP) and constitutes the major enzyme for
          BMP catabolism (PubMed:26491015). BMP, also known as lysobisphosphatidic acid, is enriched in
          late endosomes and lysosomes and plays a key role in the formation of intraluminal vesicles
          and in lipid sorting (PubMed:26491015)
      commentType: FUNCTION
  UniProtKB:O07732:
    record_section: FUNCTION
    source: analysis/module_audits/bacterial_mcl_pha_synthesis_and_mobilization/family-consultation/O07732-uniprot.json
    scope: Exact curated FUNCTION text, not submitter label or GO annotation; embedded ECO/publication
      evidence retained in official JSON.
    evidence:
    - texts:
      - evidences:
        - evidenceCode: ECO:0000269
          source: PubMed
          id: '15678099'
        - evidenceCode: ECO:0000269
          source: PubMed
          id: '33960821'
        - evidenceCode: ECO:0000269
          source: PubMed
          id: '34019937'
        value: May play a role in cell wall modulation (PubMed:33960821, PubMed:34019937). The N-terminal
          domain exhibits lipolytic activity (PubMed:33960821). In vitro, hydrolyzes various p-nitrophenyl
          (pNP) esters (PubMed:33960821). pNP-decanoate (C10) is the best substrate, followed by pNP-octonate
          (C8), pNP-laurate (C12) and pNP-butyrate (C4) (PubMed:33960821). Exhibits lower activity with
          pNP-acetate (C2), pNP-myristate (C14) and pNP-palmitate (C16) (PubMed:33960821). Can also use
          tributyrin (PubMed:33960821). The C-terminal domain catalyzes the biosynthesis of cyclic AMP
          (cAMP) from ATP (PubMed:15678099). It has a guanylyl cyclase side-activity, corresponding to
          7% of the adenylate cyclase activity (PubMed:15678099)
      commentType: FUNCTION
  UniProtKB:P13001:
    record_section: FUNCTION
    source: analysis/module_audits/bacterial_mcl_pha_synthesis_and_mobilization/family-consultation/P13001-uniprot.json
    scope: Exact curated FUNCTION text, not submitter label or GO annotation; embedded ECO/publication
      evidence retained in official JSON.
    evidence:
    - texts:
      - value: The physiological role of BioH is to remove the methyl group introduced by BioC when the
          pimeloyl moiety is complete. It allows to synthesize pimeloyl-ACP via the fatty acid synthetic
          pathway through the hydrolysis of the ester bonds of pimeloyl-ACP esters. E.coli employs a methylation
          and demethylation strategy to allow elongation of a temporarily disguised malonate moiety to
          a pimelate moiety by the fatty acid synthetic enzymes. BioH shows a preference for short chain
          fatty acid esters (acyl chain length of up to 6 carbons) and short chain p-nitrophenyl esters.
          Also displays a weak thioesterase activity. Can form a complex with CoA, and may be involved
          in the condensation of CoA and pimelic acid into pimeloyl-CoA, a precursor in biotin biosynthesis
      commentType: FUNCTION
    - texts:
      - value: Catalyzes the hydrolysis of the methyl ester bond of dimethylbutyryl-S-methyl mercaptopropionate
          (DMB-S-MMP) to yield dimethylbutyryl mercaptopropionic acid (DMBS-MPA) during the biocatalytic
          conversion of simvastin acid from monacolin J acid. Can also use acyl carriers such as dimethylbutyryl-S-ethyl
          mercaptopropionate (DMB-S-EMP) and dimethylbutyryl-S-methyl thioglycolate (DMB-S-MTG) as the
          thioester substrates
      commentType: FUNCTION
