scientific_judgments:
  schema: proposed_molecular_function may coexist with contributes_to_molecular_function, but replaces the
    subunit-specific molecular_function; permission alone does not establish autonomous catalysis.
  beta_catalysis: 'All three beta cores now carry the proposed sarcosine oxidase (imine-forming) activity:
    beta-localized sarcosine oxidation at FAD and electron transfer via FMN to O2, yielding imine and H2O2
    within the assembled enzyme. Alpha-associated THF capture and imine hydrolysis are excluded. Direct U-96
    site evidence is distinguished from PSEPK/CHRI1 ortholog inference.'
  stoichiometry: Oxidation of sarcosine to its imine removes two hydrogen equivalents; FAD receives them and
    two electrons pass via FMN to reduce one O2 to one H2O2. This is the oxidase subreaction, not the complete
    folate reaction.
  assembly_limit: U-96 beta and beta/delta expression preparations lacked flavin under the studied conditions
    (PMID15914915 scoped excerpt). No isolated-beta turnover or impossible-in-all-conditions claim is made.
  common_convention: All twelve Sox cores retain contribution to GO0016647 and complex membership. The same
    rule separates supported own chemistry/cofactor functions from collective turnover. Existing Zn/NAD cores
    remain; unsupported subunit-specific cofactor functions are not invented solely to make records visually
    identical.
  whole_reaction_proposal: The pre-existing folate-coupled activity proposal is retained as an assembled-complex
    ontology proposal. Three beta-specific proposals were added; no annotation rows were added.
  FMN: DdhC HPLC used authentic FAD/FMN standards and identified 1.06 +/- 0.08 FAD per protein; no covalent
    flavin fluorescence was observed. Together with the explicit source interpretation this supports target-specific
    REMOVE of electronic FMN binding, not a universal inability to bind FMN or whole-family deletion.
  qualifiers: Twenty-four original sarcosine-oxidase enables rows retain all source payloads and actions; PROBABLE
    correction queries specify contributes_to and route to actual InterPro/UniProt provenance. No experimental
    reaction is removed.
