references:
- id: PMID:33812916
  title: 'The family of sarcosine oxidases: Same reaction, different products.'
  findings:
  - statement: The comparative review identifies substantial substrate and product diversity within the
      sarcosine oxidase family. A family match alone cannot establish sarcosine turnover or a specific
      complete route.
    supporting_text: 'The subfamily of sarcosine oxidase is a set of enzymes within the larger family

      of amine oxidases.'
  access_status: ABSTRACT_ONLY
  curation_limit: Only the accessible text supports these findings; primary experiments and exact strain/sequence
    bridges are assessed separately.
- id: PMID:16042597
  title: Crystal structure of DMGO provides a prototype for a new tetrahydrofolate-binding fold.
  findings:
  - statement: The DMGO tetrahydrofolate-binding fold is shared with proteins of different functions.
      Fold similarity to glycine-cleavage T protein does not establish lipoyl-H-protein aminomethyltransferase
      activity in DMGO or SoxA.
    supporting_text: similar THF-binding folds despite little similarity in sequence or function.
  access_status: ABSTRACT_ONLY
  curation_limit: Only the accessible text supports these findings; primary experiments and exact strain/sequence
    bridges are assessed separately.
- id: PMID:23354714
  title: 'Homeostasis and catabolism of choline and glycine betaine: lessons from Pseudomonas aeruginosa.'
  findings:
  - statement: The review places betaine catabolism in a subset of bacterial lineages and distinguishes
      nutrient utilization from osmoprotectant retention. It does not establish universal pathway presence
      from bacterial taxon membership.
    supporting_text: 'bacteria have catabolic pathways for the multistep conversion of choline, via

      GB, to glycine and can thereby use choline and GB as sole sources of carbon and

      nitrogen.'
  access_status: ABSTRACT_ONLY
  curation_limit: Only the accessible text supports these findings; primary experiments and exact strain/sequence
    bridges are assessed separately.
- id: PMID:12912903
  title: Channelling and formation of 'active' formaldehyde in dimethylglycine oxidase.
  findings:
  - statement: Arthrobacter globiformis DMGO has an oxidative active site and a distinct THF-dependent
      site linked by an internal chamber. This is a genuine alternative first-step architecture; bifunctionality
      does not imply sarcosine oxidation.
    supporting_text: 'The active sites in DMGO are approximately 40 A apart,

      connected by a large irregular internal cavity.'
  access_status: FULL_TEXT
  curation_limit: Only the accessible text supports these findings; primary experiments and exact strain/sequence
    bridges are assessed separately.
