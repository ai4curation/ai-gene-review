scope:
  intended: ABSTRACT reusable bacterial two-stage DMG-to-sarcosine-to-glycine mechanism
  taxon: NCBITaxon:2 Bacteria; no claim of universal distribution
  boundary: Retain both sequential demethylations; upstream betaine demethylation and downstream glycine cleavage
    remain separate mechanisms. Preserve alternative experimentally supported architectures rather than forcing
    all lineages into DgcAB/ETF.
routes:
- step: dimethylglycine_to_sarcosine
  architecture: DgcA/DdhC with genetically implicated DgcB and ETF
  measured: Purified DdhC turnover uses PMS/DCPIP or PMS/NBT; native ZW4-1 genetics supports pathway dependence
  not_established: Direct DgcA-to-DgcB electron transfer, ordered DgcB-to-ETF transfer and downstream physiological
    acceptor
  integration: Use acceptor-unspecified GO:0016645 for DgcA. Preserve genetically implicated companion components
    and mark the ordered relay as proposed; no fixed acceptor in substrates/products.
- step: dimethylglycine_to_sarcosine
  architecture: Arthrobacter globiformis DMGO
  measured: Q9AGP8 links to exact NRRL B-2979 coding sequence and WT1PJ5; oxidative and THF-dependent active
    sites
  integration: Add first-step alternative with THF-coupled net chemistry, explicit conditional formaldehyde
    output without THF, and no assertion that DMGO oxidizes sarcosine. Verify PTHR43757:SF11 membership and
    official label.
- step: sarcosine_to_glycine
  architecture: Heterotetrameric SoxABDG
  integration: Represent complete THF-dependent activity at the complex. Distinguish individual subunit contribution
    and binding functions; isolated beta active-site location does not prove complete autonomous activity.
    Preserve all four subunits as required for the supported assembly.
- step: sarcosine_to_glycine
  architecture: Monomeric SoxA
  integration: Retain exact ARTST TE1826 P40873 exemplar and PTHR10961:SF7 grounding; formaldehyde-producing
    chemistry differs from THF-coupled SoxABDG.
- step: sarcosine_to_glycine
  architecture: Historical Pseudomonas sarcosine dehydrogenase
