biological_limits:
- Bacillus O07639 polymerase role combines FtsW-specific subfamily membership, PY79 FtsW imaging and purified
  ortholog biochemistry; no purified O07639 reaction is claimed.
- Exact StPBP2x and SaPBP1 constructs support direct activator activity independently of transpeptidation.
  The TM deletion/compensatory-mutation experiment is Streptococcus-specific; inactive SaPBP1 forms a
  stable active complex with SaFtsW.
- Bacillus PBP2B retains an essential physical role when its catalytic site is inactive; this does not
  by itself establish direct FtsW activation. PBP3 catalytic backup establishes neither equivalent activation
  nor stable divisome membership.
- E. coli flippase assays are retained as real; MurJ evidence and unresolved residual FtsW contribution
  justify over-annotation rather than claiming a demonstrated secondary physiological function or zero
  activity.
- GO1990586 core membership is explicit for supported/inferred septal pairs without adding redundant CC
  rows merely to silence advisory coverage warnings.
- DD proposal definition is shared, while organism-specific acceptor chemistry and product-resolved versus
  inferential evidence remain distinct.
