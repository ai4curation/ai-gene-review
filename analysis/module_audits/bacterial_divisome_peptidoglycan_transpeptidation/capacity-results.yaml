limitations:
- PROTEIN_COMPLEX active units and textual NTR functions are checked by this explicit oracle, not by Atom.function_ids.
- The native registry is a curated panel, not evidence that all cross-species pairs are incompatible or that
  unlisted genomes lack capacity.
- Bacillus activation is a qualified inference from native physical roles and comparative biochemistry; PBP3
  catalytic rescue is not a purified linkage-product assay.
- The StFtsW construct omits current residues1-5 and its assay uses E. faecalis lipid II; native bridge identity
  is not assigned.
