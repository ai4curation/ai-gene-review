scope:
  intended: CONCRETE bacterial FtsW/bPBP mechanism with four taxon-qualified realizations
  taxon: NCBITaxon:2 Bacteria; sampled lineages, not a universal cell-division apparatus
  boundary: Retain both substantive synthetic reactions. FtsZ positioning, lipid-II production/flipping, upstream
    regulatory recruitment, class-A-PBP replacement routes and daughter-cell separation remain explicit interfaces
    or outside this focused mechanism.
  rationale: ModuleScopeEnum CONCRETE applies to a specific process with grounded terminal representatives;
    ABSTRACT is reserved for motifs that intentionally lack terminal representatives. Cross-species reuse alone
    does not make a module ABSTRACT.
requirements:
- claim: Correct polymerization versus crosslink-transfer chemistry
  action: Remove hydrolytic GO:0009002 as a proxy for D,D-crosslinking. Check current GO definitions; use a
    supported proposed molecular function if no exact term exists. Preserve original GOA IDs and assess their
    claims separately.
- claim: Cognate pair compatibility
  action: Model the matched FtsW/bPBP interaction and activation requirement, not arbitrary coexistence of
    two broad families. Catalytically inactive bPBP can activate FtsW in vitro; polymerization alone does not
    establish completed crosslinks.
- claim: Species-specific acceptor chemistry
  action: Do not generalize the E. coli mDAP acceptor to lysine/interpeptide-bridge organisms. Scope substrate
    and product descriptions to native peptidoglycan chemistry.
- claim: Conditional catalytic substitution
  action: Audit Bacillus PBP2B structural requirement and PBP3 catalytic substitution in PMID:28792086; distinguish
    catalytic bypass from loss of the PBP2B protein.
- claim: Scope boundary
  action: Explicitly retain the Clostridioides difficile vegetative class-A-PBP1 pathway as an outside-boundary
    comparator; FtsW/FtsI is not universally required in all walled bacteria.
