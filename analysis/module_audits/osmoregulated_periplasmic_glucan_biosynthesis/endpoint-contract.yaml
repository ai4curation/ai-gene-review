status: IMPLEMENTED
purpose: Separate a supported molecular reaction, an inferred pathway capacity and experimentally supported
  native product formation. Expected cases are independently stated from the literature; the executable
  evaluator consumes the actual module logic and current gene reviews. Results and mutation checks are
  recorded in capacity-results.json.
outcomes:
  SUPPORTED_NATIVE_PROCESS: Native genetic and product evidence supports the named organism and process.
  SUPPORTED_IN_VITRO_REACTION: A supplied-substrate biochemical assay establishes the named reaction.
  SUPPORTED_INFERENCE: A qualified homology or mechanistic inference, without direct target-product proof.
  NOT_ESTABLISHED: The supplied evidence or required context is insufficient; this does not assert biological
    impossibility.
profiles:
  ecoli_native_opg:
    required_accessions:
    - P62517
    - P33136
    - P0A6A8
    required_conditions:
    - compatible_membrane_system
    - udp_glucose
    - compatible_acp
    source_ids:
    - PMID:7934824
    - PMID:9171419
    - PMID:1827116
    - PMID:2945202
    - PMID:3479786
    limitations:
    - OpgH alone is not an autonomous purified reconstruction.
    - OpgD is not required for all OPG production.
    - OpgG hydrolysis is not a required native reaction established by the data.
  cers4_native_opg:
    required_accessions:
    - Q9FA52
    - Q9FA54
    - Q3J1N3
    required_conditions:
    - same_strain_native_system
    source_ids:
    - PMID:12027885
    limitations:
    - Genetic participation does not assign an individual ring-closing reaction.
    - The WS8 NMR-defined18-mer is not an exact2.4.1 product measurement.
    - OpgI dependency does not establish an ACP-like molecular function.
  psepk_inferred_opg:
    required_accessions:
    - Q88D04
    - Q88D03
    source_ids:
    - file:PSEPK/opgH/opgH-ai-review.yaml
    - file:PSEPK/opgG/opgG-ai-review.yaml
    limitations:
    - Exact native product chemistry and direct KT2440 enzymology remain unmeasured here.
  ecoli_opgD_hydrolysis:
    required_accessions:
    - P40120
    required_conditions:
    - supplied_linear_beta_1_2_glucan
    - active_enzyme
    source_ids:
    - PMID:37735577
  ecoli_opgG_intrinsic_hydrolysis:
    required_accessions:
    - P33136
    required_conditions:
    - supplied_linear_beta_1_2_glucan
    - active_enzyme
    source_ids:
    - PMID:37735577
    limitations:
    - Measured weak activity does not establish the native required reaction.
  xcc_opgD_cyclization:
    required_accessions:
    - Q8P3C6
    required_conditions:
    - supplied_linear_beta_1_2_glucan
    - active_wild_type_enzyme
    source_ids:
    - PMID:38957137
    - file:XANCP/opgD/opgD-source-analysis/primary-evidence.md
    product: DP16 with15beta1,2 linkages and1alpha1,6 closure
    limitations:
    - D379N structure is not the active wild-type assay construct.
    - Intrinsic cyclization from supplied substrate does not reconstruct native whole-pathway synthesis.
  caulobacter_glucosyltransferase_inference:
    required_accessions:
    - B8GX72
    source_ids:
    - PMID:39145657
    limitations:
    - UDP-glucose accumulation and active-site/morphology evidence do not define product chemistry.
    - Failed detection with the E.coli protocol does not establish absence of OPG.
