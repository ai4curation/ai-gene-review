required_mutation_checks:
- Reject a module change that promotes OpgG hydrolysis to a universally required native reaction.
- Reject a scope change that excludes every cyclic product from OpgGH-associated mechanisms.
- Reject an evaluator that treats a PANTHER family match as sufficient evidence of the specific SF3 chemistry.
- Reject an evaluator that drops the conditional OpgI or compatible-ACP gate.
- Reject an evaluator that merges the WS8 chemical characterization with the2.4.1 genetic experiment.
- Reject an evaluator that upgrades inferred or supplied-substrate evidence to direct native whole-pathway
  proof.
