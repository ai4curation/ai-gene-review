      - evidenceCode: ECO:0000269
        source: PubMed
        id: '24097954'
      value: Catalytic subunit of cellulose synthase. It polymerizes uridine 5'-diphosphate
        glucose to cellulose, which is produced as an extracellular component for
        mechanical and chemical protection at the onset of the stationary phase, when
        the cells exhibit multicellular behavior (rdar morphotype). Coexpression of
        cellulose and thin aggregative fimbriae (curli fimbrae or fibers) leads to
        a hydrophobic network with tightly packed cells embedded in a highly inert
        matrix that confers cohesion, elasticity and tissue-like properties to colonies
        (PubMed:24097954)
