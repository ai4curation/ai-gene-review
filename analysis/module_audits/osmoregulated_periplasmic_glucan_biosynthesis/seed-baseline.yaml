    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    review:
      summary: Hexosyltransferase activity is correct but less informative than glucosyltransferase activity
        for OpgH.
      action: MODIFY
      reason: OpgH is a glucans biosynthesis glucosyltransferase in the glycosyltransferase 2 family,
        so the child term glucosyltransferase activity better captures the transferred sugar.
