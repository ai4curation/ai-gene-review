module: MODULE:osmoregulated_periplasmic_glucan_biosynthesis
genes:
- accession: Q88D03
  review_path: genes/PSEPK/opgG/opgG-ai-review.yaml
  original_rows:
  - term:
      id: GO:0005975
      label: carbohydrate metabolic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Carbohydrate metabolism is a broad parent term for OpgG's role in osmoregulated periplasmic
        glucan biosynthesis.
      action: MODIFY
      reason: UniProt places OpgG specifically in the osmoregulated periplasmic glucan biosynthesis pathway;
        the broad carbohydrate metabolic process term should be replaced by the specific OPG biosynthesis
        term.
      proposed_replacement_terms:
      - id: GO:1900727
        label: osmoregulated periplasmic glucan biosynthetic process
      supported_by:
      - reference_id: file:PSEPK/opgG/opgG-uniprot.txt
        record_section:
        - CC:FUNCTION
        supporting_text: 'FUNCTION: Involved in the biosynthesis of osmoregulated periplasmic'
      - reference_id: file:PSEPK/opgG/opgG-uniprot.txt
        record_section:
        - CC:PATHWAY
        supporting_text: 'PATHWAY: Glycan metabolism; osmoregulated periplasmic glucan (OPG)'
  - term:
      id: GO:0009250
      label: glucan biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: involved_in
    review:
      summary: Glucan biosynthesis is correct but should be made specific to osmoregulated periplasmic
        glucan biosynthesis.
      action: MODIFY
      reason: UniProt assigns OpgG to OPG biosynthesis, and GO:1900727 captures this pathway more specifically
        than generic glucan biosynthesis.
      proposed_replacement_terms:
      - id: GO:1900727
        label: osmoregulated periplasmic glucan biosynthetic process
      supported_by:
      - reference_id: file:PSEPK/opgG/opgG-uniprot.txt
        record_section:
        - CC:PATHWAY
        supporting_text: 'PATHWAY: Glycan metabolism; osmoregulated periplasmic glucan (OPG)'
  - term:
      id: GO:0016051
      label: carbohydrate biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: involved_in
    review:
      summary: Carbohydrate biosynthesis is a broad parent term for OpgG's role in OPG biosynthesis.
      action: MODIFY
      reason: The OpgG-specific process is osmoregulated periplasmic glucan biosynthesis, so the broad
        carbohydrate biosynthetic process term should be replaced by GO:1900727.
      proposed_replacement_terms:
      - id: GO:1900727
        label: osmoregulated periplasmic glucan biosynthetic process
      supported_by:
      - reference_id: file:PSEPK/opgG/opgG-uniprot.txt
        record_section:
        - CC:FUNCTION
        supporting_text: 'FUNCTION: Involved in the biosynthesis of osmoregulated periplasmic'
  - term:
      id: GO:0030246
      label: carbohydrate binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Carbohydrate binding is plausible for OpgG but is secondary to its inferred beta-1,2-glucanase
        activity.
      action: KEEP_AS_NON_CORE
      reason: InterPro supports carbohydrate binding for the OpgD/OpgG-family protein, but primary biochemical
        work on E. coli OpgG/OpgD identifies this family as GH186 beta-1,2-glucanases. Binding should
        be retained as a supporting, non-core activity rather than the primary molecular function.
      supported_by:
      - reference_id: file:PSEPK/opgG/opgG-uniprot.txt
        record_section:
        - CC:SIMILARITY
        supporting_text: Belongs to the OpgD/OpgG family
      - reference_id: PMID:37735577
        supporting_text: EcOpgG was found to hydrolyze β-1,2-glucans; however, the catalytic velocity
          was very low
  - term:
      id: GO:0033913
      label: glucan endo-1,2-beta-glucosidase activity
    evidence_type: ISS
    original_reference_id: PMID:37735577
    qualifier: enables
    review:
      summary: OpgG's core molecular function is inferred to be beta-1,2-glucanase activity.
      action: NEW
      reason: Primary biochemical and structural work on E. coli OpgG/OpgD-family orthologs supports GH186
        beta-1,2-glucanase activity, and the P. putida protein has strong sequence, domain, signal-peptide,
        and opgGH operon support for ISS transfer of the same periplasmic OPG-processing role.
      supported_by:
      - reference_id: PMID:37735577
        supporting_text: EcOpgG was found to hydrolyze β-1,2-glucans; however, the catalytic velocity
          was very low
      - reference_id: PMID:37735577
        supporting_text: EcOpgG also showed the same substrate specificity toward the polysaccharides
          as that of EcOpgD.
      - reference_id: file:PSEPK/opgG/opgG-deep-research-openscientist.md
        supporting_text: Global Needleman–Wunsch alignment of Q88D03 (559 aa) gave **63.6% identity (357/561
          aligned positions)** to the biochemically and structurally characterized E. coli OpgG (P33136)
          and **66.4% identity (383/577)** to P. aeruginosa OpgG (Q9HUA5).
      - reference_id: file:PSEPK/opgG/opgG-deep-research-openscientist.md
        supporting_text: The exact in-vivo cut/branch chemistry OpgG performs during OPG maturation remains
          to be pinned down, but the enzyme class is now defined.
  - term:
      id: GO:0030288
      label: outer membrane-bounded periplasmic space
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: located_in
    review:
      summary: Outer membrane-bounded periplasmic space is the appropriate location for Gram-negative
        OpgG.
      action: ACCEPT
      reason: UniProt places OpgG in the periplasm with an N-terminal signal peptide, and TreeGrafter
        provides the Gram-negative-specific periplasmic compartment term.
      supported_by:
      - reference_id: file:PSEPK/opgG/opgG-uniprot.txt
        record_section:
        - CC:SUBCELLULAR LOCATION
        supporting_text: 'SUBCELLULAR LOCATION: Periplasm'
      - reference_id: file:PSEPK/opgG/opgG-uniprot.txt
        record_section:
        - FT:SIGNAL
        supporting_text: FT   SIGNAL          1..17
  - term:
      id: GO:0042597
      label: periplasmic space
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: located_in
    review:
      summary: Periplasmic space is correct but less specific than the Gram-negative outer membrane-bounded
        periplasmic space term.
      action: MODIFY
      reason: OpgG is a signal-peptide-bearing periplasmic protein in a Gram-negative bacterium; GO:0030288
        is the more precise concurrent location term.
      proposed_replacement_terms:
      - id: GO:0030288
        label: outer membrane-bounded periplasmic space
      supported_by:
      - reference_id: file:PSEPK/opgG/opgG-uniprot.txt
        record_section:
        - CC:SUBCELLULAR LOCATION
        supporting_text: 'SUBCELLULAR LOCATION: Periplasm'
  - term:
      id: GO:0051274
      label: beta-glucan biosynthetic process
    evidence_type: IEA
    original_reference_id: GO_REF:0000118
    qualifier: involved_in
    review:
      summary: Beta-glucan biosynthesis is correct but OPG biosynthesis is the more specific pathway context
        for OpgG.
      action: MODIFY
      reason: OpgG is assigned to osmoregulated periplasmic glucan biosynthesis; GO:1900727 captures that
        pathway more specifically than beta-glucan biosynthetic process.
      proposed_replacement_terms:
      - id: GO:1900727
        label: osmoregulated periplasmic glucan biosynthetic process
      supported_by:
      - reference_id: file:PSEPK/opgG/opgG-uniprot.txt
        record_section:
        - CC:PATHWAY
        supporting_text: 'PATHWAY: Glycan metabolism; osmoregulated periplasmic glucan (OPG)'
