module: MODULE:bacterial_flagellar_assembly_export
scope: Gammaproteobacterial assembly/export architecture and condition-qualified stator realizations,
  not a sufficient minimal genome.
root_endpoint: Coverage of the represented normally assisted assembly/export roles in a compatible supplied
  background.
external_prerequisites:
- role: FliE and compatible envelope/LP-ring assembly
  support: PMID:39766194; PMID:33931760
  interpretation: Required background outside the enumerated panel, not biologically optional.
- role: Late substrate expression, chaperones, membrane insertion and assay-appropriate energy supply
  support: PMID:24064315; PMID:29946050; PMID:34859548
  interpretation: Family presence alone cannot establish these conditions.
distinct_endpoints:
  late_transcription: Native FliA function; FlgM inhibition is a removable brake. Omitting this root context
    assumes external substrate supply or leaves transcription unevaluated.
  normal_assisted_export: The represented configuration includes FliH/FliI/FliJ assistance; absence fails
    configuration coverage, not all possible export.
  bypass_export: PMID18216858 supplies weak fliHI-null and gate-suppressor evidence, not normal efficiency
    in every target species.
  reconstituted_export: PMID29946050 ATP-driven IMV export without bulk PMF; not a universal intact-cell
    energetic rule.
  motor_function: Requires a complete compatible native stator pair, rotor, anchoring and relevant energy
    conditions; not implied by assembly/export coverage.
  native_performance: KT2440 liquid swimming and semisolid dispersal differ by stator. No wild-type-like
    liquid swimming is certified for MotCD-only from rapid semisolid spreading.
  complete_de_novo_flagellum: NOT_ESTABLISHED by this nonexhaustive panel.
taxonomy: Retain Gammaproteobacteria; directly sampled Pseudomonas, Escherichia, Salmonella and Vibrio.
  Gram-positive/outgroup structural comparisons do not expand the complete configuration across Bacteria.
family_limit: Exact reviewed members and compatible contexts are checked; a broad family hit, a homologous
  ATP synthase/injectisome ATPase or a shared OmpA domain cannot establish the role. FlgD has a named
  family without an invented ID.
stator_pairs:
- members:
  - Q88DC2
  - Q88DC3
  background: PSEPK
  coupling: H+ inferred; native motility directly assayed
  reference: PMID:36409076
- members:
  - Q88EW6
  - Q88EW7
  background: PSEPK
  coupling: H+ inferred; native motility directly assayed
  reference: PMID:36409076
- members:
  - O06873
  - O06874
  background: VIBAL
  coupling: Na+; native functional and structure evidence
  reference: PMID:18326582; PMID:39793043
