        - reference_id: file:PSEPK/flgL/flgL-uniprot.txt
          record_section:
          - DR:InterPro
          supporting_text: DR   InterPro; IPR013384; Flagell_FlgL.
        - reference_id: file:PSEPK/flgL/flgL-uniprot.txt
          record_section:
          - DR:NCBIfam
          supporting_text: DR   NCBIfam; TIGR02550; flagell_flgL; 1.
    - term:
        id: GO:0009424
        label: bacterial-type flagellum hook
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      review:
        summary: This imported hook annotation is close but not the most precise term
          for flgL. Flagellar hook-associated protein FlgL is a hook-associated protein
          at the hook-filament junction, and GO:0009422 bacterial-type flagellum hook-filament
          junction is the better cellular-component term.
        action: MODIFY
        reason: Use GO:0009422 because it names the hook-filament junction, whereas
          GO:0009424 describes the hook proper. Falcon deep research, citing a 2.9
          Angstrom cryo-EM structure, shows FlgL assembles as the distal layer of
          the hook-filament junction linking the FlgE hook to the FliC filament -
          not as a component of the hook itself - directly supporting this refinement.
        proposed_replacement_terms:
        - id: GO:0009422
          label: bacterial-type flagellum hook-filament junction
        supported_by:
        - reference_id: file:PSEPK/flgL/flgL-uniprot.txt
          supporting_text: hook-associated protein
        - reference_id: file:PSEPK/flgL/flgL-deep-research-falcon.md
          supporting_text: assembles as the **distal layer** of the HFJ, directly
            beneath the filament and above FlgK, thereby linking the hook protein
            **FlgE** to the filament protein **FliC (flagellin)**.
    - term:
        id: GO:0071973
        label: bacterial-type flagellum-dependent cell motility
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      review:
        summary: This process annotation is appropriate. A FlgL-containing hook-filament
          junction is required for a functional bacterial flagellum and flagellum-dependent
          motility.
        action: ACCEPT
        reason: Motility is the direct biological context for this structural flagellar
          component. The support is FlgL family membership (NCBIfam TIGR02550, PANTHER
          hook-associated protein 3 subfamily); the motility requirement is ortholog-derived
          - the Falcon report cites a cryo-EM and mutagenesis study of the FlgK-FlgL
          interface (doi 10.1038/s41564-025-02037-0, not cached here) - and has not
          been tested by a KT2440 flgL mutant.
        supported_by:
        - reference_id: file:PSEPK/flgL/flgL-uniprot.txt
          record_section:
          - DR:NCBIfam
          supporting_text: DR   NCBIfam; TIGR02550; flagell_flgL; 1.
        - reference_id: file:PSEPK/flgL/flgL-uniprot.txt
          record_section:
          - DR:PANTHER
          supporting_text: DR   PANTHER; PTHR42792:SF1; FLAGELLAR HOOK-ASSOCIATED
            PROTEIN 3; 1.
    status: DRAFT
