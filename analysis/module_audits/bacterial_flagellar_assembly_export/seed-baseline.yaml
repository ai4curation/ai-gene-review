          supporting_text: FliMN contains a well conserved LSQXEIDALL sequence, which
            is responsible for the interaction with CheY-P [33].
        - reference_id: PMID:31452860
          supporting_text: The binding of CheY-P to FliM and FliN affects subunit-subunit
            interactions between FliMM domains and between FliMC and FliN in the C
            ring to induce a 180° rotation of FliGCC relative to MotAC, thereby allowing
            the motor to rotate in CW direction [34].
        - reference_id: file:PSEPK/fliM/fliM-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: This complex interacts with the CheY and CheZ chemotaxis
            proteins, in addition to contacting components of the motor that determine
            the direction of flagellar rotation.
    - term:
        id: GO:0071973
        label: bacterial-type flagellum-dependent cell motility
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: involved_in
      supporting_entities:
      - InterPro:IPR001689
      review:
        summary: FliM is an essential rotor/switch component of the flagellar motor
          and does part of the work of flagellum-dependent motility.
        action: ACCEPT
        reason: As a structural subunit of the C ring rotor and the CheY-P-responsive
          switch, FliM participates directly in flagellar rotation and its direction.
          KT2440 swims with polar flagella in a run-reverse-turn pattern that depends
          on switching of motor direction. No KT2440 fliM mutant phenotype is in the
          cached literature, so the term is kept at the general motility level rather
          than refined to swimming.
        supported_by:
        - reference_id: file:PSEPK/fliM/fliM-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: 'FUNCTION: FliM is one of three proteins (FliG, FliN, FliM)
            that forms the rotor-mounted switch complex (C ring), located at the base
            of the basal body.'
        - reference_id: PMID:23728820
          supporting_text: our results suggest a new "run-reverse-turn" paradigm for
            polar-flagellated Pseudomonas motility
    - term:
        id: GO:0071978
        label: bacterial-type flagellum-dependent swarming motility
      evidence_type: IEA
      original_reference_id: GO_REF:0000118
      qualifier: involved_in
      supporting_entities:
      - PANTHER:PTN002408987
      review:
        summary: TreeGrafter transfer of a swarming-motility term from the PANTHER
          FliM node, whose experimental members include swarming bacteria. P. putida
          is reported not to swarm in a flagellum-dependent manner.
        action: MARK_AS_OVER_ANNOTATED
        reason: The swarming claim exceeds what is known for KT2440. The KT2440 stator
          study states (citing earlier work) that P. putida does not swarm in a flagella-dependent
          manner, and the motility documented for this strain is swimming in liquid
          and through semisolid agar. The general motility process is retained on
          the GO:0071973 row. This matches the treatment of the same TreeGrafter term
          on the KT2440 MotA review.
        supported_by:
        - reference_id: PMID:36409076
          supporting_text: However, P. putida does not swarm in a flagella-dependent
            manner (16) and is lophotrichously flagellated, having multiple flagella
            at one cell pole (17).
