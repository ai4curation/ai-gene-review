      review:
        summary: TreeGrafter transfer from the PANTHER FliM node. FliM does part of
          the work of chemotaxis, as the switch component that receives CheY-P and
          changes the direction of motor rotation, but nothing restricts this to movement
          toward attractants.
        action: MODIFY
        reason: Overly specific. The switch responds to CheY-P irrespective of whether
          the stimulus is an attractant or a repellent, so the same FliM activity
          serves positive and negative chemotaxis. The appropriate term is the parent,
          chemotaxis (GO:0006935), which is also the term used for FliN and for the
          other relay proteins of this pathway.
        proposed_replacement_terms:
        - id: GO:0006935
          label: chemotaxis
