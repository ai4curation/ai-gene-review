        label: cytosol
      evidence_type: IEA
      original_reference_id: GO_REF:0000118
      review:
        summary: This annotation should be removed. FlgE is explicitly identified
          as the flagellar hook protein and described as the flexible connector between
          filament and basal-body drive apparatus, which is inconsistent with a soluble
          cytosolic localization. The cytosol term appears to be a TreeGrafter overcall
          from broad family propagation rather than a gene-specific localization statement.
        action: REMOVE
        reason: FlgE is an exported axial subunit. UniProt gives its subcellular location
          as the bacterial flagellum basal body, and the assembly literature places
          the protein outside the cytoplasm, travelling through the central channel
          of the growing structure and polymerizing at the distal end of the rod;
          its terminal regions are disordered precisely to prevent premature assembly
          in the cytosol. The functional compartment is therefore the hook (GO:0009424,
          accepted on another row), and a located_in cytosol call for the mature structural
          protein is contradicted rather than merely redundant.
        supported_by:
        - reference_id: UniProt:Q88ER5
          supporting_text: 'RecName: Full=Flagellar hook protein FlgE'
        - reference_id: file:PSEPK/flgE/flgE-deep-research-falcon.md
          supporting_text: rather than in the cytosol.
