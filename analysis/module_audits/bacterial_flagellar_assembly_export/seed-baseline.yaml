  genes/PSEPK/fliM/fliM-ai-review.yaml:
    sha256: f6e249aea08a70551d5472b28948a304ca4864e384e3a9c8b484289b4f4d4a2d
    annotations:
    - term:
        id: GO:0003774
        label: cytoskeletal motor activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: enables
      supporting_entities:
      - InterPro:IPR001689
      review:
        summary: InterPro2GO mapping from the FliM family signature. The GO definition
          of cytoskeletal motor activity covers generation of torque for rotation
          of a flagellum, but in the flagellar motor torque is generated at the stator-rotor
          interface between MotA and the C-terminal torque helix of FliG, not by FliM.
        action: MODIFY
        reason: 'The essence (FliM is a component of the flagellar motor) is sound,
          but the activity FliM itself contributes is structural and regulatory: it
          forms the C ring wall with FliN and FliG and binds CheY-P to switch rotation
          direction. Torque is generated by stator units (MotA/MotB, or MotC/MotD
          in P. putida) acting on the FliG torque helix. The row is therefore re-typed
          to the subunit''s own activity, structural molecule activity (GO:0005198),
          which is also the complex-level activity assigned to the C ring switch module.
          This is a lateral correction, not a refinement.'
        proposed_replacement_terms:
        - id: GO:0005198
          label: structural molecule activity
        supported_by:
        - reference_id: PMID:31452860
          supporting_text: Each stator unit is composed of two transmembrane proteins,
            MotA and MotB, and acts as a transmembrane proton channel to couple the
            proton flow through the channel with torque generation
        - reference_id: PMID:31452860
          supporting_text: side-by-side associations between FliMM domains are responsible
            for the formation of the C ring wall
        - reference_id: file:PSEPK/fliM/fliM-uniprot.txt
          record_section:
          - DR:InterPro
          supporting_text: DR   InterPro; IPR001689; Flag_FliM.
    - term:
        id: GO:0005886
        label: plasma membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000044
      qualifier: located_in
      supporting_entities:
      - UniProtKB-SubCell:SL-0037
      review:
        summary: 'UniProt subcellular-location mapping (PIRNR002888): FliM is a peripheral
          inner-membrane protein, attached via the C ring to the cytoplasmic face
          of the membrane-embedded MS ring.'
        action: MODIFY
        reason: Correct but general. fliM has no transmembrane segment and is held
          on the cytoplasmic face of the inner membrane through the C ring and MS
          ring, so the supported membrane location is GO:0009898 cytoplasmic side
          of plasma membrane, as for FliG and the soluble chemotaxis proteins at receptor
          arrays. The informative structural location, the C ring, is given on the
          MODIFY rows below.
        proposed_replacement_terms:
        - id: GO:0009898
          label: cytoplasmic side of plasma membrane
        supported_by:
        - reference_id: file:PSEPK/fliM/fliM-uniprot.txt
          record_section:
          - CC:SUBCELLULAR LOCATION
          supporting_text: 'SUBCELLULAR LOCATION: Cell inner membrane {ECO:0000256|PIRNR:PIRNR002888};
            Peripheral membrane protein {ECO:0000256|PIRNR:PIRNR002888}.'
