  genes/PSEPK/motA/motA-ai-review.yaml:
    sha256: 22082f93a8167cd8d756fcd865e85f99f99ba0123b3321060e3ce32bdd4d9a93
    annotations:
    - term:
        id: GO:0005886
        label: plasma membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      review:
        summary: This location annotation is appropriate. MotA is an inner-membrane
          stator component of the flagellar motor.
        action: ACCEPT
        reason: 'Retain plasma membrane as the GO cellular-component location, while
          the stator complex is captured in the synthesized core function. Two independent
          lines agree: Phobius predicts four helical transmembrane segments (31..48,
          69..85, 171..190, 202..220; two are quoted), and the protein is classified
          in the MotA stator family (NCBIfam TIGR03818 MotA1, Pfam PF01618 MotA_ExbB),
          whose members are described in a cached review as integral membrane stator
          proteins of proton-driven flagellar motors. That review is about MotA in
          general (E. coli, Salmonella, Vibrio PomA), not the KT2440 protein. The
          UniProt SUBCELLULAR LOCATION and SIMILARITY lines rest only on ARBA rules
          and are not cited.'
        supported_by:
        - reference_id: file:PSEPK/motA/motA-uniprot.txt
          record_section:
          - FT:TRANSMEM
          supporting_text: FT   TRANSMEM        31..48
        - reference_id: file:PSEPK/motA/motA-uniprot.txt
          record_section:
          - FT:TRANSMEM
          supporting_text: FT   TRANSMEM        171..190
        - reference_id: file:PSEPK/motA/motA-uniprot.txt
          record_section:
          - DR:NCBIfam
          supporting_text: DR   NCBIfam; TIGR03818; MotA1; 1.
        - reference_id: PMID:35572622
          supporting_text: The stator complex is composed of two integral membrane
            proteins, PomA and PomB, for the sodium-driven motor and MotA and MotB
            for the proton-driven motor.
    - term:
        id: GO:0006935
        label: chemotaxis
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      review:
        summary: Chemotaxis is too broad and mechanistically indirect for MotA. MotA
          powers flagellar motor rotation, which can support taxis behavior, but it
          is not a chemotaxis signaling protein. Falcon deep research is explicit
          that directional switching (and hence chemotactic responses) is not executed
          by MotA itself but by chemotaxis signaling proteins; MotA only supplies
          torque at the rotor-stator interface.
        action: MARK_AS_OVER_ANNOTATED
        reason: The claim that MotA takes part in chemotaxis exceeds what the protein
          does. MotA supplies torque for rotation in both directions; the chemotactic
          step (CheY-P-driven switching of the C ring) is performed by the chemotaxis
          proteins and the C-ring switch (FliG/FliM/FliN), not by the stator. Loss
          of MotAB in KT2440 impairs swimming itself, which is a motility defect rather
          than evidence of participation in chemotactic signaling. The direct stator
          roles are captured by flagellum-dependent cell motility and proton transmembrane
          transport.
        supported_by:
        - reference_id: file:PSEPK/motA/motA-deep-research-falcon.md
          supporting_text: Direction switching is not executed by MotA itself but
            by chemotaxis signaling that reorients the rotor interface MotA engages
    - term:
        id: GO:0071978
        label: bacterial-type flagellum-dependent swarming motility
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      review:
        summary: MotA is the A subunit of the MotAB stator that powers flagellar rotation.
          In KT2440 the MotAB stator is required for efficient swimming in liquid;
          no swarming phenotype of motA has been described.
        action: MARK_AS_OVER_ANNOTATED
        reason: The swarming claim exceeds what is known for KT2440. The KT2440 stator
          study states (citing earlier work) that P. putida does not swarm in a flagella-dependent
          manner; the motility documented for the MotAB stator is swimming in liquid.
          The general motility process is captured by the NEW GO:0071973 row (IMP).
          This matches the treatment of the same swarming term on the KT2440 FliM
          and MotC (PP_4336) reviews.
        supported_by:
        - reference_id: PMID:36409076
          supporting_text: However, P. putida does not swarm in a flagella-dependent
            manner (16) and is lophotrichously flagellated, having multiple flagella
            at one cell pole (17).
        - reference_id: PMID:36409076
          supporting_text: In homogeneous fluids, the MotAB stator is crucial to promote
            swimming motility, so the movement of ΔmotAB mutant cells in aqueous fluids
            is strongly impaired.
    - term:
        id: GO:0071973
        label: bacterial-type flagellum-dependent cell motility
      evidence_type: IMP
      original_reference_id: PMID:36409076
      review:
        summary: MotA should be annotated to bacterial-type flagellum-dependent cell
          motility, the process the MotAB stator directly powers.
        action: NEW
        reason: In KT2440, deletion of motAB (PP4905-PP4904) strongly impairs swimming
          in liquid, and the MotAB stator generates the torque that rotates the flagellum.
          Swarming is too specific without gene-specific support. The deletion removes
          both stator genes, so the same IMP applies to MotB.
        supported_by:
        - reference_id: PMID:36409076
          supporting_text: In homogeneous fluids, the MotAB stator is crucial to promote
            swimming motility, so the movement of ΔmotAB mutant cells in aqueous fluids
            is strongly impaired.
        - reference_id: PMID:36409076
          supporting_text: Additionally, the genome encodes a second copy of a stator
            outside this gene cluster, the MotAB (PP4905 and PP4904) (15).
        - reference_id: PMID:35572622
          supporting_text: movement of the stator that is coupled to ion influx through
            the ion channel of the stator generates the rotational force
    - term:
        id: GO:1902600
        label: proton transmembrane transport
      evidence_type: IC
      original_reference_id: PMID:18310339
      review:
        summary: MotA forms, with MotB, the proton channel of the MotAB stator; proton
          flow through the channel is coupled to torque generation.
        action: NEW
        reason: MotA itself does part of the work of proton translocation (its four
          transmembrane helices form the channel around the MotB helix), so this is
          participation. Inferred from the MotA family assignment (Pfam MotA_ExbB
          proton channel domain, NCBIfam TIGR03818) and stator studies in other bacteria;
          UniProt also carries an electronic GO line for this term, which is not used
          as evidence.
        supported_by:
        - reference_id: PMID:18310339
          supporting_text: The stator complex functions as a proton channel and couples
            proton flow with torque generation
        - reference_id: file:PSEPK/motA/motA-uniprot.txt
          record_section:
          - FT:DOMAIN
          supporting_text: DOMAIN 134..239 /note="MotA/TolQ/ExbB proton channel"
        - reference_id: file:PSEPK/motA/motA-deep-research-falcon.md
          supporting_text: MotA (A subunit) and MotB (B subunit) form the canonical
            **H+-driven stator**, MotAB.
    - term:
        id: GO:0015078
        label: proton transmembrane transporter activity
      evidence_type: IC
      original_reference_id: PMID:18310339
      review:
        summary: MotA contributes to proton transmembrane transporter activity as
          part of the assembled MotAB stator rather than acting as an independent
          transporter by itself.
        action: NEW
        reason: The contributes_to qualifier captures the complex-level proton-channel
          activity of the MotAB stator.
        supported_by:
        - reference_id: PMID:18310339
          supporting_text: The stator complex functions as a proton channel and couples
            proton flow with torque generation
        - reference_id: PMID:35572622
          supporting_text: the stator units, which are an energy-converting membrane
            protein complex
        - reference_id: file:PSEPK/motA/motA-deep-research-falcon.md
          supporting_text: MotA (A subunit) and MotB (B subunit) form the canonical
            **H+-driven stator**, MotAB.
      qualifier: contributes_to
    - term:
        id: GO:0120101
        label: bacterial-type flagellum stator complex
      evidence_type: IC
      original_reference_id: PMID:18310339
      review:
        summary: MotA should be placed in the bacterial-type flagellum stator complex
          because it is the A subunit of the membrane-embedded MotAB stator.
        action: NEW
        reason: The complex term captures the functional location of MotA more specifically
          than plasma membrane alone.
        supported_by:
        - reference_id: PMID:18310339
          supporting_text: MotA and MotB are integral membrane proteins that form
            the stator complex
        - reference_id: PMID:35572622
          supporting_text: 'The stator is composed of two membrane proteins: MotA
            and MotB'
        - reference_id: file:PSEPK/motA/motA-deep-research-falcon.md
          supporting_text: MotA forms the **A-subunit ring** of the stator complex
            and provides the **cytoplasmic interface to the rotor** (FliG) that converts
            ion-driven conformational changes into rotor torque.
    status: COMPLETE
  genes/PSEPK/motB/motB-ai-review.yaml:
