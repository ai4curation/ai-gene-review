base: 488d370561caf677da6e0c8ef94d5b0c7f4cb374
module_sha256: 251c4eca950c04f49016f086e3bb661bab1eb80cccc47d8b30a121ba648776a8
reviews:
  genes/PSEPK/fliA/fliA-ai-review.yaml:
    sha256: e5a9ee320d3a2cdb98084d8c9d258984dc8112aad0f60ecf2e4da23525162361
    annotations:
    - term:
        id: GO:0003677
        label: DNA binding
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      review:
        summary: DNA binding is not entirely wrong for a sigma factor-containing holoenzyme,
          but it is too generic as a standalone description of FliA. The precise molecular
          function is sigma factor activity.
        action: MARK_AS_OVER_ANNOTATED
        reason: GO:0016987 captures promoter-specific sigma-factor function better
          than generic DNA binding.
        supported_by:
        - reference_id: file:PSEPK/fliA/fliA-uniprot.txt
          supporting_text: RNA polymerase sigma factor FliA
        - reference_id: file:PSEPK/fliA/fliA-deep-research-falcon.md
          supporting_text: In KT2440, FliA’s **primary molecular function** is to
            function as an **RNAP sigma factor** that recognizes **σ28-type promoters**
            to activate late flagellar/chemotaxis transcription.
    - term:
        id: GO:0003700
        label: DNA-binding transcription factor activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      review:
        summary: FliA is a transcription regulatory factor, but the generic DNA-binding
          transcription factor term is less precise than sigma factor activity for
          a bacterial RNA polymerase sigma subunit.
        action: MODIFY
        reason: Replace the broad transcription-factor term with the specific sigma
          factor molecular function.
        proposed_replacement_terms:
        - id: GO:0016987
          label: sigma factor activity
        supported_by:
        - reference_id: file:PSEPK/fliA/fliA-uniprot.txt
          supporting_text: RNA polymerase sigma factor FliA
        - reference_id: file:PSEPK/fliA/fliA-uniprot.txt
          record_section:
          - CC:SIMILARITY
          supporting_text: Belongs to the sigma-70 factor family. FliA subfamily.
        - reference_id: file:PSEPK/fliA/fliA-deep-research-falcon.md
          supporting_text: '**FliA is an alternative sigma factor** that binds core
            RNA polymerase (RNAP) to alter promoter recognition specificity. In *P.
            putida* KT2440, this is explicitly described as FliA “conferr[ing] promoter-recognition
            specificity to core RNA polymerase (RNAP),” consistent with sigma-factor
            biology.'
    - term:
        id: GO:0003899
        label: DNA-directed RNA polymerase activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      review:
        summary: This annotation should be removed. FliA is a sigma factor that helps
          RNA polymerase initiate at flagellar promoters; it is not the catalytic
          RNA polymerase enzyme.
        action: REMOVE
        reason: RNA polymerase catalytic activity belongs to the core polymerase complex,
          whereas FliA provides promoter specificity.
        supported_by:
        - reference_id: file:PSEPK/fliA/fliA-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: Sigma factors are initiation factors that promote the
        - reference_id: file:PSEPK/fliA/fliA-deep-research-falcon.md
          supporting_text: '**FliA is an alternative sigma factor** that binds core
            RNA polymerase (RNAP) to alter promoter recognition specificity. In *P.
            putida* KT2440, this is explicitly described as FliA “conferr[ing] promoter-recognition
            specificity to core RNA polymerase (RNAP),” consistent with sigma-factor
            biology.'
    - term:
        id: GO:0005737
        label: cytoplasm
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      review:
        summary: This location annotation is appropriate for a bacterial sigma factor
          that associates with cytoplasmic RNA polymerase.
        action: ACCEPT
        reason: UniProt places FliA in the cytoplasm.
        supported_by:
        - reference_id: file:PSEPK/fliA/fliA-uniprot.txt
          record_section:
          - CC:SUBCELLULAR LOCATION
          supporting_text: 'SUBCELLULAR LOCATION: Cytoplasm'
        - reference_id: file:PSEPK/fliA/fliA-deep-research-falcon.md
          supporting_text: FliA is not a secreted or membrane-embedded protein; it
            functions by **associating with cytosolic RNAP** and acting at **chromosomal
            promoters**. KT2440 literature describes FliA as conferring promoter specificity
            to core RNAP, implying its functional localization is the cytosol/nucleoid
            region where RNAP-DNA transcription occurs.
    - term:
        id: GO:0006352
        label: DNA-templated transcription initiation
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      review:
        summary: This is a core process annotation. Sigma factors act at transcription
          initiation by directing RNA polymerase to specific promoters.
        action: ACCEPT
        reason: FliA controls initiation at flagella-related promoters.
        supported_by:
        - reference_id: file:PSEPK/fliA/fliA-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: Sigma factors are initiation factors that promote the
        - reference_id: file:PSEPK/fliA/fliA-deep-research-falcon.md
          supporting_text: In KT2440, FliA’s **primary molecular function** is to
            function as an **RNAP sigma factor** that recognizes **σ28-type promoters**
            to activate late flagellar/chemotaxis transcription.
    - term:
        id: GO:0006355
        label: regulation of DNA-templated transcription
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      review:
        summary: This broad transcription-regulation term is directionally correct
          but less informative than the initiation-specific process term already present.
        action: MODIFY
        reason: GO:2000142 is already present and ACCEPTED in this review; this MODIFY
          means the broad parent term should be dropped in favor of the existing initiation-specific
          term.
        proposed_replacement_terms:
        - id: GO:2000142
          label: regulation of DNA-templated transcription initiation
        supported_by:
        - reference_id: file:PSEPK/fliA/fliA-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: controls the expression of flagella-related genes
        - reference_id: file:PSEPK/fliA/fliA-deep-research-falcon.md
          supporting_text: In KT2440, FliA’s **primary molecular function** is to
            function as an **RNAP sigma factor** that recognizes **σ28-type promoters**
            to activate late flagellar/chemotaxis transcription.
    - term:
        id: GO:0010468
        label: regulation of gene expression
      evidence_type: IEA
      original_reference_id: GO_REF:0000104
      review:
        summary: Regulation of gene expression is too broad for FliA. The direct process
          is regulation of transcription initiation through sigma-factor promoter
          recognition.
        action: MODIFY
        reason: GO:2000142 is already present and ACCEPTED in this review; this MODIFY
          removes a redundant high-level gene-expression parent in favor of the existing
          initiation-specific term.
        proposed_replacement_terms:
        - id: GO:2000142
          label: regulation of DNA-templated transcription initiation
        supported_by:
        - reference_id: file:PSEPK/fliA/fliA-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: controls the expression of flagella-related genes
        - reference_id: file:PSEPK/fliA/fliA-deep-research-falcon.md
          supporting_text: In KT2440, FliA’s **primary molecular function** is to
            function as an **RNAP sigma factor** that recognizes **σ28-type promoters**
            to activate late flagellar/chemotaxis transcription.
    - term:
        id: GO:0016987
        label: sigma factor activity
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      review:
        summary: This is the correct core molecular function for FliA. The protein
          is explicitly annotated as an RNA polymerase sigma factor and a sigma-70
          family FliA subfamily member.
        action: ACCEPT
        reason: Sigma factor activity captures FliA promoter-specificity function.
        supported_by:
        - reference_id: file:PSEPK/fliA/fliA-uniprot.txt
          record_section:
          - CC:SIMILARITY
          supporting_text: Belongs to the sigma-70 factor family. FliA subfamily.
        - reference_id: file:PSEPK/fliA/fliA-deep-research-falcon.md
          supporting_text: '**FliA is an alternative sigma factor** that binds core
            RNA polymerase (RNAP) to alter promoter recognition specificity. In *P.
            putida* KT2440, this is explicitly described as FliA “conferr[ing] promoter-recognition
            specificity to core RNA polymerase (RNAP),” consistent with sigma-factor
            biology.'
    - term:
        id: GO:2000142
        label: regulation of DNA-templated transcription initiation
      evidence_type: IEA
      original_reference_id: GO_REF:0000108
      review:
        summary: This is the best specific regulatory process term in the current
          annotation set. FliA regulates transcription at initiation by directing
          RNA polymerase to flagellar promoters.
        action: ACCEPT
        reason: The logical inference from sigma factor activity to regulation of
          transcription initiation is biologically appropriate.
        supported_by:
        - reference_id: file:PSEPK/fliA/fliA-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: Sigma factors are initiation factors that promote the
        - reference_id: file:PSEPK/fliA/fliA-deep-research-falcon.md
          supporting_text: In KT2440, FliA’s **primary molecular function** is to
            function as an **RNAP sigma factor** that recognizes **σ28-type promoters**
            to activate late flagellar/chemotaxis transcription.
    - term:
        id: GO:0044780
        label: bacterial-type flagellum assembly
      evidence_type: IEA
      review:
        summary: As the Class III (late-tier) flagellar sigma factor, FliA directs
          transcription of the genes that build the flagellar filament, a stator complex,
          and the chemotaxis apparatus, so it is functionally involved in completing
          bacterial-type flagellum assembly. This process is absent from the current
          IEA-only annotation set but is well supported by KT2440 primary literature
          summarized in the falcon deep research.
        action: NEW
        reason: KT2440 primary literature places FliA at the late tier of the flagellar
          cascade, where its transcriptional output completes filament, stator, and
          chemotaxis biogenesis; this flagellum-assembly process role complements
          the molecular sigma factor function and is not captured by the existing
          transcription-centric terms.
        supported_by:
        - reference_id: file:PSEPK/fliA/fliA-deep-research-falcon.md
          supporting_text: '**Class III:** **FliA-dependent** transcription enables
            synthesis of the **filament**, at least one **stator** complex, and completion
            of the **chemotaxis apparatus**.'
        - reference_id: file:PSEPK/fliA/fliA-deep-research-falcon.md
          supporting_text: 'In KT2440 the late output of FliA activity is explicitly
            described: **filament synthesis**, activation of at least one **stator
            complex**, and completion of the **chemotaxis apparatus**.'
    status: DRAFT
  genes/PSEPK/flgM/flgM-ai-review.yaml:
    sha256: 2db60ae49ac216315a974a4e110eb15cda09ac1b24945b581e1af9ddbff5717d
    annotations:
    - term:
        id: GO:0045892
        label: negative regulation of DNA-templated transcription
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      review:
        summary: This annotation is appropriate. FlgM is the anti-sigma-28 factor
          that prevents FliA-dependent transcription of flagellin genes until flagellar
          assembly is ready.
        action: ACCEPT
        reason: Negative regulation of DNA-templated transcription captures the direct
          anti-sigma regulatory effect.
        supported_by:
        - reference_id: file:PSEPK/flgM/flgM-deep-research-falcon.md
          supporting_text: FlgM is a **cytoplasmic anti-σ factor** that antagonizes
            **FliA (σ28)**, thereby acting as a **negative regulator of late flagellar
            gene expression** (including flagellin/filament genes).
        - reference_id: file:PSEPK/flgM/flgM-deep-research-falcon.md
          supporting_text: PP_4395** is explicitly annotated as **“Negative regulator
            of flagellin synthesis FlgM”** and is downregulated when FliA is absent,
            matching the canonical FliA–FlgM regulatory pair.
        - reference_id: PMID:27663176
          supporting_text: FliA and the cytoplasmic anti‐sigma factor FlgM depresses
            transcription of class IV flagellar genes by inhibiting the FliA‐RNA polymerase
            association until completion of the hook‐basal body complex, at which
            point the anti‐sigma factor is secreted
    - term:
        id: GO:0016989
        label: sigma factor antagonist activity
      evidence_type: ISS
      original_reference_id: file:PSEPK/flgM/flgM-uniprot.txt
      review:
        summary: FlgM directly antagonizes the flagellar sigma factor FliA, so sigma
          factor antagonist activity captures the direct molecular mechanism behind
          the transcriptional repression.
        action: NEW
        reason: GO:0016989 is defined as binding to a sigma factor and reducing its
          transcriptional activity, matching the conserved anti-sigma-28 function
          of FlgM.
        supported_by:
        - reference_id: file:PSEPK/flgM/flgM-uniprot.txt
          record_section:
          - DE
          supporting_text: 'AltName: Full=Anti-sigma-28 factor'
        - reference_id: file:PSEPK/flgM/flgM-uniprot.txt
          record_section:
          - CC:FUNCTION
          supporting_text: preventing expression of the flagellin genes
        - reference_id: file:PSEPK/flgM/flgM-uniprot.txt
          record_section:
          - DR:SUPFAM
          supporting_text: Anti-sigma factor FlgM
        - reference_id: file:PSEPK/flgM/flgM-deep-research-falcon.md
          supporting_text: FlgM is a **protein anti-sigma factor** that binds the
            flagellar sigma factor **FliA (σ28)** and inhibits FliA-dependent transcription
            of late/class III-IV flagellar genes until assembly reaches the proper
            checkpoint.
        - reference_id: file:PSEPK/flgM/flgM-deep-research-falcon.md
          supporting_text: whose primary molecular role is to **bind/sequester FliA**,
            preventing FliA from associating with RNA polymerase and thereby blocking
            FliA-dependent transcription until a defined assembly checkpoint is satisfied.
        - reference_id: PMID:27663176
          supporting_text: FliA and the cytoplasmic anti‐sigma factor FlgM depresses
            transcription of class IV flagellar genes by inhibiting the FliA‐RNA polymerase
            association until completion of the hook‐basal body complex, at which
            point the anti‐sigma factor is secreted
    status: DRAFT
  genes/PSEPK/flhA/flhA-ai-review.yaml:
    sha256: e1b988085d13810d8d831dd2ea43d77c911a8af3a9c11d7423161a733348677e
    annotations:
    - term:
        id: GO:0005886
        label: plasma membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: located_in
      review:
        summary: FlhA is a multipass component of the cytoplasmic membrane export
          gate.
        action: ACCEPT
        reason: The specific membrane localization is consistent with the conserved
          FlhA architecture.
    - term:
        id: GO:0009306
        label: protein secretion
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: involved_in
      review:
        summary: FlhA participates in export of flagellar assembly substrates.
        action: MODIFY
        reason: GO:0030254 specifically captures secretion through the type III export
          apparatus in which FlhA acts.
        proposed_replacement_terms:
        - id: GO:0030254
          label: protein secretion by the type III secretion system
        supported_by:
        - reference_id: file:PSEPK/flhA/flhA-deep-research-openscientist.md
          supporting_text: FlhA is therefore not a peripheral accessory but one of
            six integral-membrane proteins that build the transmembrane secretion
            channel.
    - term:
        id: GO:0016020
        label: membrane
      evidence_type: IEA
      original_reference_id: GO_REF:0000002
      qualifier: located_in
      review:
        summary: FlhA is membrane embedded, but plasma membrane is already annotated
          more specifically.
        action: KEEP_AS_NON_CORE
        reason: Correct but redundant with the more informative plasma-membrane annotation.
    - term:
        id: GO:0044780
        label: bacterial-type flagellum assembly
      evidence_type: IEA
      original_reference_id: GO_REF:0000120
      qualifier: involved_in
      review:
        summary: Flagellar substrate export through the FlhA-containing gate is required
          for assembly.
        action: ACCEPT
        reason: This is the core biological process supported by conserved FlhA function.
    status: COMPLETE
