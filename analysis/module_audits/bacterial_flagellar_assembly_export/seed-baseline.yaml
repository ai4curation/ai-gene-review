          supporting_text: TRANSMEM 21..45 /note="Helical" /evidence="ECO:0000256|SAM:Phobius"
        - reference_id: PMID:35572622
          supporting_text: MotB/PomB have a single TM segment at their N-termini and
            a large periplasmic C-terminal region that is anchored to the peptidoglycan
            (PG) layer.
    - term:
        id: GO:0071973
        label: bacterial-type flagellum-dependent cell motility
      qualifier: involved_in
      evidence_type: IMP
      original_reference_id: PMID:36409076
      review:
        summary: Proposed process. Deletion of motAB in KT2440 strongly impairs swimming
