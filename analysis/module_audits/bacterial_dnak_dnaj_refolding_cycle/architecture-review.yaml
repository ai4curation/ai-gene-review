id: bacterial_dnak_dnaj_refolding_cycle_architecture_review
date: '2026-11-06'
mode: READ_ONLY_SCIENTIFIC_CONSULTATION
conclusion: SUPPORTED_WITH_TARGETED_QUALIFICATIONS
recommended_required_role_ids:
- dnaj_client_delivery
- dnak_client_remodeling
- grpe_nucleotide_exchange
architecture_recommendations:
- Preserve the three original required roles. Under client delivery, distinguish canonical ATPase-activating
  DnaJ exemplars from the Thermus J2 folding/client-handoff alternative without requiring GO0001671 for
  the latter.
- Preserve dnaj_atpase_activation only inside the canonical activation alternative. Attribute ATP-to-ADP/phosphate
  chemistry to DnaK alone; the J role activates or delivers clients and must not duplicate catalytic products.
- Use GO0044183 for the supported Thermus client-handling role, with exact representative/partner evidence.
  Its broad definition is not by itself an unrestricted substitute for any ATPase activator or arbitrary
  J protein.
- DnaK GO0140662 and GrpE GO0000774 remain shared roles. Require reviewed role, target identity and compatible
  cycle evidence, not family labels alone.
- Mtb J1 and J2 are alternatives for basal capacity. Both can improve aggregate-reactivation performance;
  OR is not a claim of quantitative or client-independent equivalence.
- DafA belongs in optional inhibitory-state context. It is neither a productive prerequisite nor a presence-based
  veto. Keep its inhibitory occupancy distinct from intrinsic G/F autoinhibition.
- Describe the three-role architecture as a supported bacterial implementation, not a universal requirement
  for all Hsp70-dependent refolding, all clients or all bacterial genomes.
material_corrections:
- issue: The original DnaJ annoton assigns ADP/phosphate products while DnaK also performs hydrolysis.
  recommendation: Keep activating/client-delivery interaction on DnaJ and chemical ATP turnover on DnaK;
    apply the activation edge only to the canonical branch.
- issue: Same-strain membership is not evidence of productive coupling by itself.
  recommendation: Use an explicit compatible-cycle witness in addition to taxon and reviewed activity.
    Do not use the Tetragenococcus failure to deny every cross-species combination.
thermus_requirement_assessment:
  trio_support: Productive Hsp70/Hsp40/NEF reconstitution directly supports the specified Thermus implementation.
    The 2019 work directly establishes Hsp40 client-handling necessity in the tested luciferase reaction.
    The 2025 recipe includes all three proteins and ATP regeneration.
  limit: Do not restate an all-component recipe as a universal omission/deletion result. Historical exchange
    kinetics and modern client-handoff data support GrpE and J2 roles but do not establish that every
    Thermus substrate needs these components absolutely.
  productive_vs_inhibited: The DafA-containing structural assembly is inhibited; productive refolding
    assay mixtures do not list DafA.
capacity_controls_recommended:
- Positive canonical E. coli trio; inferred KT2440 trio explicitly labeled comparative rather than directly
  reconstituted.
- Positive Mtb trio with J1 or J2, with gene-review strain inference and assay differences preserved;
  neither require both nor claim identical performance.
- Positive Thermus trio using J2 client-handling capability without a positive GO0001671 gate.
- Negative missing-DnaK, missing-J/client-delivery, and missing-GrpE controls for this defined module,
  without biological claims of absolute universal necessity.
- Negative same-family but wrong paralog/unknown partner, correct taxon but unsupported coupling, and
  cross-taxon mosaic without a curated compatibility witness.
- Explicitly bounded Tetragenococcus coupling-failure control and a separately recognized experimentally
  compatible heterologous pair where warranted.
- DafA presence alone does not invalidate a productive-capacity witness; an explicitly occupied inhibited
  state cannot serve as the productive witness.
- ATP-independent holdase activity and isolated ATPase activity do not substitute for ATP-dependent client
  remodeling.
evidence_matrix:
- id: ecoli_client_capture
  applies_to:
  - dnaj_client_delivery
  - client-delivery to DnaK edge
  claim: DnaJ first binds the non-native client, then collaborates with DnaK in the ATP-dependent cycle.
  evidence:
    reference_id: PMID:7937953
    supporting_text: unfolded luciferase binds initially to DnaJ
  assay_context: Reconstituted E. coli DnaK/DnaJ/GrpE folding of denatured firefly luciferase.
  limits: 'Abstract-only cache: do not invent exact E. coli substrain, construct sequences, protein concentrations
    or temperatures. This is a defined model-client mechanism, not a guarantee for every client.'
- id: ecoli_j_activation
  applies_to:
  - canonical dnaj_atpase_activation alternative
  - activation edge to DnaK
  claim: DnaJ accelerates hydrolysis by DnaK; DnaJ is not the ATP-hydrolyzing catalyst.
  evidence:
    reference_id: PMID:1826368
    supporting_text: DnaJ alone leads to an acceleration in the rate of hydrolysis of the DnaK-bound ATP.
  assay_context: E. coli nucleotide-cycle biochemistry separates hydrolysis and nucleotide release.
  limits: The coupled steady-state ATPase increase with DnaJ and GrpE does not make GrpE an ATPase or
    assign nucleotide hydrolysis to DnaJ.
- id: ecoli_nef_release
  applies_to:
  - grpe_nucleotide_exchange
  - exchange/reset edge to DnaK
  claim: GrpE promotes release of bound nucleotide, permitting ATP rebinding and client release.
  evidence:
    reference_id: PMID:1826368
    supporting_text: GrpE alone increases the rate of release of bound ATP or ADP without affecting the
      rate of hydrolysis.
  assay_context: E. coli nucleotide-release measurements.
  limits: Describe exchange/reset rather than GrpE catalysis of ATP hydrolysis. ATP rebinding and client
    release belong to the coupled DnaK cycle.
- id: ecoli_repeat_cycle
  applies_to:
  - dnak_client_remodeling
  - reset to renewed client remodeling edge
  claim: Efficient recovery of the tested luciferase substrate requires repeated cycles.
  evidence:
    reference_id: PMID:7937953
    supporting_text: Several rounds of ATP-dependent interaction with DnaK and DnaJ are required for fully
      efficient folding.
  assay_context: Luciferase refolding rather than a universal fixed number of cycles.
  limits: A single pass releases only a fraction as folded protein; avoid a deterministic claim that each
    cycle yields native protein.
- id: thermus_activation_limit
  applies_to:
  - Thermus client-delivery alternative
  - canonical ATPase-activation edge applicability
  claim: Do not require a positive autonomous ATPase-stimulation assertion for Thermus DnaJ2.
  evidence:
    reference_id: PMID:11162122
    supporting_text: DnaJ does not stimulate the DnaK-mediated ATP hydrolysis
  assay_context: Thermus thermophilus nucleotide-cycle kinetics; the paper also examines GrpE exchange
    and luciferase refolding.
  limits: This is a negative result under the reported conditions, not proof that stimulation is impossible
    in every client-loaded assembly. The cache is abstract-only.
- id: thermus_nef_positive
  applies_to:
  - grpe_nucleotide_exchange
  - Thermus productive implementation
  claim: GrpE-mediated exchange remains effective despite the historical lack of J-mediated ATPase stimulation.
  evidence:
    reference_id: PMID:11162122
    supporting_text: nucleotide exchange is still efficiently stimulated by GrpE.
  assay_context: Stopped-flow/equilibrium nucleotide-analogue measurements; altered refolding kinetics
    need not imply reduced final yield.
  limits: No universal kinetic magnitude is transferred to other GrpE proteins.
- id: thermus_client_role
  applies_to:
  - Thermus GO:0044183 alternative under dnaj_client_delivery
  claim: Client-handling work is directly supported independently of a positive ATPase-stimulation rate
    assay.
  evidence:
    reference_id: PMID:31604242
    supporting_text: ttHsp40 is essential for the refolding activity of the machinery
  assay_context: 'Full-text Results: chemically denatured luciferase in Hsp70/Hsp40/NEF reactions; mutations
    impairing the client-binding domains strongly reduce refolding.'
  limits: The observed J-protein requirement is for this reconstituted assay. The general introductory
    statement about J-domain stimulation is not a new direct Thermus ATPase assay.
- id: thermus_handoff_interface
  applies_to:
  - client-delivery to DnaK edge
  claim: The Hsp70-Hsp40 interaction participates in client exchange and productive refolding.
  evidence:
    reference_id: PMID:31604242
    supporting_text: Hsp70 binding to Hsp40 displaces the unfolded client.
  assay_context: NMR client-complex analysis and refolding perturbations; disruption of the Hsp70 C-tail
    interaction adversely affects refolding.
  limits: Do not infer that every handoff follows a universal irreversible order or that chaperone binding
    and unfolded-client binding are the same molecular-function assertion.
- id: thermus_defined_trio
  applies_to:
  - three required roles in the Thermus implementation
  claim: Modern productive refolding experiments use Hsp40, Hsp70 and a nucleotide-exchange factor together.
  evidence:
    reference_id: PMID:41092901
    supporting_text: 0.25μM Hsp40 protein, 5 μM Hsp70 protein and 1 μM NEF at 30 °C
  assay_context: 'Methods: firefly luciferase unfolded in6M urea, diluted to0.2µM; 2mM ATP with phosphoenolpyruvate/pyruvate-kinase
    regeneration. Thermus genes DnaJ, DnaK and GrpE are cloned into expression constructs; proteins expressed
    in E. coli BL21(DE3), with affinity-tag removal.'
  limits: This supports the specified three-component implementation. An assay recipe alone is not an
    omission test establishing absolute requirement of each component for every client/condition. Productive
    assay temperature30°C is not the organism optimal growth temperature. Point-mutant and monomeric engineered
    constructs must be distinguished from wild-type controls.
- id: dafa_optional_inhibition
  applies_to:
  - optional DafA regulatory branch
  claim: DafA stabilizes an inhibited assembly; it is not a required productive folding component.
  evidence:
    reference_id: PMID:41092901
    supporting_text: a T. thermophilus protein that binds and inhibits the activity of the Hsp70 machinery
  assay_context: The stabilized structural assembly has2Hsp70:2Hsp40:2DafA, not the older3:3:3 arrangement.
    Structural contacts occlude Hsp70 client sites and the J-domain docking surface.
  limits: Keep observed inhibition/client occlusion separate from an independently measured ATPase-rate
    effect. Mere genomic presence of dafA must not veto productive capacity; occupancy/assembly state
    matters. Intrinsic Hsp40 G/F autoinhibition is a separate regulatory mechanism.
- id: mtb_j_alternatives
  applies_to:
  - canonical activating-J alternatives
  - Mtb capacity witness
  claim: DnaJ1 and DnaJ2 provide alternative positive activation routes with different kinetics.
  evidence:
    reference_id: PMID:27872278
    supporting_text: DnaJ1 and DnaJ2 activate the ATPase activity of DnaK differently.
  assay_context: 'Purified Mtb proteins expressed as His-SUMO fusions in E. coli followed by tag cleavage.
    MS ATP/ADP assays: low-cofactor DnaJ2 is more effective; appreciable J1 activation appears at approximately
    equimolar J1:DnaK.'
  limits: Do not collapse J1/J2 into quantitatively equivalent cofactors. Exact H37Rv donor construct
    identity remains the gene audit limitation; species-level biochemistry is not fabricated exact-strain
    evidence.
- id: mtb_basal_vs_optimal
  applies_to:
  - Mtb J1 OR J2 capacity alternative
  - optional cooperative J1 plus J2 context
  claim: One J protein can support activity, while both enhance the tested aggregate-reactivation output.
  evidence:
    reference_id: PMID:27872278
    supporting_text: When one J protein was removed, there was approximately half the amount of refolding
  assay_context: Heat-denatured luciferase with Hsp20 during preparation; DnaK/GrpE/J-cofactors restore
    activity and ClpB increases yield. J1:J2 ratio changes the ClpB-containing reaction.
  limits: Do not require both J genes for basal modeled capacity, and do not promise identical yield with
    either alone. The native deletion/complementation tests are in M. smegmatis, not direct H37Rv viability
    measurements. Aggregate dissolution and ClpB enhancement remain outside the minimal refolding core.
- id: mtb_three_component_refolding
  applies_to:
  - dnak_client_remodeling
  - grpe_nucleotide_exchange
  - productive trio witness
  claim: A DnaK-DnaJ2-GrpE system supports ATP-dependent recovery of a model client without making ClpB
    a core requirement.
  evidence:
    reference_id: PMID:38253530
    supporting_text: firefly luciferase was denatured at 42 °C and refolded by DnaK, DnaJ2, and GrpE
  assay_context: Full-text Results specify2mM ATP and refolding at25°C. The structure resolves an asymmetric1DnaK:2GrpE
    complex; GrpE-interface mutants impair exchange and refolding.
  limits: The study uses J2, not a direct demonstration that J1 is an equivalent substitute in this exact
    assay. In vivo complementation uses M. smegmatis and Mtb operon constructs; distinguish that from
    native Mtb physiology. The1:2 structural stoichiometry does not require a permanently assembled three-protein
    cycle.
- id: mtb_exchange_client_coupling
  applies_to:
  - GrpE to DnaK reset/release edge
  claim: GrpE allosterically couples nucleotide exchange with client release in the Mtb system.
  evidence:
    reference_id: PMID:38253530
    supporting_text: the disordered GrpE N-terminus is critical for substrate release
  assay_context: Full-length DnaK-GrpE cryo-EM plus peptide-release, exchange and refolding assays.
  limits: Do not restrict GrpE to a passive ADP-release label, but avoid making this Mtb structural route
    or detailed stoichiometry universal across all bacterial systems.
- id: tetragenococcus_coupling_control
  applies_to:
  - capacity oracle negative/unknown control
  - taxon coherence limitation
  claim: Same-species component presence and an Hsp70 ATPase/holdase identity are insufficient to prove
    productive coupling.
  evidence:
    reference_id: PMID:18323638
    supporting_text: DnaK did not cooperate with the purified DnaJ and GrpE from either T. halophilus
      or E. coli
  assay_context: Abstract reports tested ATP-hydrolysis and luciferase-refolding conditions; T. halophilus
    DnaJ/GrpE complement E. coli and E. coli DnaK cross-reacts with both sets.
  limits: Use as a bounded negative coupling example, not proof of no native Tetragenococcus refolding
    under every condition. Conversely, do not encode all cross-species combinations as biologically impossible.
- id: review_allostery
  applies_to:
  - mechanism framing only
  claim: The shared cycle concerns transient, nucleotide-controlled client affinity.
  evidence:
    reference_id: PMID:31201219
    supporting_text: substrate binding is transient and allosterically cycles
  assay_context: Comparative review, full text.
  limits: Useful framing, not independent evidence for a particular strain, accession, compatible trio
    or arbitrary fixed stoichiometry.
- id: review_diversity
  applies_to:
  - taxon and regulatory scope only
  claim: Conserved ATPase mechanisms coexist with regulatory and substrate differences.
  evidence:
    reference_id: PMID:41134158
    supporting_text: these systems exhibit striking regulatory diversity and substrate specificity
  assay_context: Comparative review, full text.
  limits: Do not let its generalized bacterial descriptions override Thermus/Tetragenococcus primary exceptions
    or lineage-specific duplication.
- id: review_thermus_scope
  applies_to:
  - Thermus branch framing only
  claim: Thermus organization and regulation differ from E. coli.
  evidence:
    reference_id: PMID:12475169
    supporting_text: profound differences in its regulation, and genetic as well as oligomeric organization
  assay_context: Comparative review, abstract-only cache.
  limits: Does not establish exact contemporary complex stoichiometry or replace primary structural/refolding
    measurements.
