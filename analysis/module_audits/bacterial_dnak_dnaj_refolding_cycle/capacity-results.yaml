added_rows:
- accession: Q56235
  row:
    term:
      id: GO:0140662
      label: ATP-dependent protein folding chaperone
    evidence_type: IC
    original_reference_id: PMID:31604242
    review:
      action: NEW
      summary: ATP-dependent protein folding chaperone.
      reason: Purified Thermus chaperone reconstitution establishes ATP-coupled client folding. Existing ATP binding/hydrolysis
        and folding-process rows do not state this integrated molecular function; no existing/replacement row covers
        the chaperone term. Exact-sequence bridging and HB8 cloning provenance are documented.
      supported_by:
      - reference_id: PMID:31604242
        supporting_text: Amino acid substitutions in either of the ttHsp40 CBDs that impair client binding (figs.
          S1D,G and S15C) decreases dramatically the refolding efficiency
- accession: Q56237
  row:
    term:
      id: GO:0044183
      label: protein folding chaperone
    evidence_type: IC
    original_reference_id: PMID:31604242
    review:
      action: NEW
      summary: protein folding chaperone.
      reason: Thermus client-binding mutations and reconstituted refolding directly demonstrate folding assistance.
        Existing process annotations do not cover the molecular function. The exact protein sequence matches the
        deposited complex; autonomous ATPase activation is deliberately unresolved.
      supported_by:
      - reference_id: PMID:31604242
        supporting_text: Amino acid substitutions in either of the ttHsp40 CBDs that impair client binding (figs.
          S1D,G and S15C) decreases dramatically the refolding efficiency
      - reference_id: PMID:31604242
        supporting_text: Amino acid substitutions in either of the ttHsp40 CBDs that impair client binding
- accession: P77527
  row:
    term:
      id: GO:0051087
      label: protein-folding chaperone binding
    evidence_type: IC
    original_reference_id: PMID:41092901
    review:
      action: NEW
      summary: protein-folding chaperone binding.
      reason: The exact-sequence structural complex directly establishes DafA binding to DnaK and DnaJ2. This is
        partner recognition, not unfolded-client binding. The seed contains no annotations, so no ancestor/descendant
        or replacement-row redundancy is introduced. The more precise inhibitory activity is represented as a proposed
        term.
      supported_by:
      - reference_id: PMID:41092901
        supporting_text: 'DafA inhibits the Hsp70-Hsp40 machinery through two distinct mechanisms: it blocks access
          of protein clients to Hsp70 and it prevents the docking of the J domain onto Hsp70'
- accession: P9WNV9
  row:
    term:
      id: GO:0001671
      label: ATPase activator activity
    evidence_type: IC
    original_reference_id: PMID:27872278
    review:
      action: NEW
      summary: ATPase activator activity.
      reason: Titration and HPD-mutant experiments assign stimulation to this J protein and hydrolysis to DnaK.
        This distinct molecular activity is absent from the existing folding, zinc-binding and partner-binding rows.
        The H37Rv reference assignment is a species-level inference with the donor-sequence limitation documented.
      supported_by:
      - reference_id: PMID:27872278
        supporting_text: significant activation was only observed at equimolar DnaJ1 and DnaK regardless of the
          presence of DnaJ2 or GrpE
- accession: P9WNV7
  row:
    term:
      id: GO:0001671
      label: ATPase activator activity
    evidence_type: IC
    original_reference_id: PMID:27872278
    review:
      action: NEW
      summary: ATPase activator activity.
      reason: Titration and HPD-mutant experiments assign stimulation to this J protein and hydrolysis to DnaK.
        This distinct molecular activity is absent from the existing folding, zinc-binding and partner-binding rows.
        The H37Rv reference assignment is a species-level inference with the donor-sequence limitation documented.
      supported_by:
      - reference_id: PMID:27872278
        supporting_text: DnaJ2 was also able to stimulate DnaK in the absence of GrpE
- accession: P9WNV7
  row:
    term:
      id: GO:0008428
      label: ribonuclease inhibitor activity
    evidence_type: IC
    original_reference_id: PMID:21568871
    review:
      action: NEW
      summary: ribonuclease inhibitor activity.
      reason: The primary abstract explicitly identifies Rv2373c binding to Rv2752c and inhibiting its RNase activity,
        independently corroborated by the curated UniProt experimental statement. This secondary function is not
        covered by any existing folding/cochaperone row. The full assay and native physiological importance remain
        unresolved; no ribonuclease chemistry is assigned to DnaJ2.
      supported_by:
      - reference_id: PMID:21568871
        supporting_text: A chaperone-like protein, Rv2373c, physically interacted with Rv2752c and inhibited both
          activities.
