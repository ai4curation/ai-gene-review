    review:
      summary: DnaK is directly involved in refolding heat-damaged proteins. Schroder et al. (1993) showed
        that DnaK, DnaJ, and GrpE are essential for reactivation of heat-inactivated luciferase both in
        vivo and in vitro (PMID:7900997). Skowyra et al. (1990) demonstrated DnaK reactivates heat-inactivated
        RNA polymerase in an ATP-dependent manner (PMID:2203539).
      action: ACCEPT
      reason: Core biological process for DnaK. Protein refolding (repair of heat-damaged proteins) is
        one of the best-characterized functions of the DnaK/DnaJ/GrpE system.
