  - term:
      id: GO:0043531
      label: ADP binding
    evidence_type: IDA
    original_reference_id: PMID:19439666
    review:
      summary: Bertelsen et al. (2009) determined the solution conformation of wild-type DnaK complexed
        with ADP and substrate peptide. ADP binding stabilizes the closed-lid conformation of the substrate-binding
        domain.
      action: ACCEPT
      reason: ADP binding is an integral part of the DnaK chaperone cycle. In the ADP-bound state, DnaK
