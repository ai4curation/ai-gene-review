      supported_by:
      - reference_id: PMID:19439666
        supporting_text: an experimental structure for wild-type, full-length DnaK, complexed with the
          peptide NRLLLTG and with ADP
    qualifier: enables
  - term:
      id: GO:0043531
      label: ADP binding
    evidence_type: IDA
    original_reference_id: PMID:7776367
    review:
      summary: McCarty et al. (1995) characterized DnaK's nucleotide binding properties, including ADP
        binding and its role in the functional cycle.
      action: ACCEPT
      reason: ADP binding is essential for the DnaK chaperone cycle. GrpE stimulates ADP release, which
