  - term:
      id: GO:0044183
      label: protein folding chaperone
    evidence_type: IDA
    original_reference_id: PMID:10380927
    review:
      summary: Teter et al. (1999) showed DnaK transiently associates with a wide variety of nascent and
        newly synthesized polypeptides under nonstress conditions, demonstrating its role as a de novo
        protein folding chaperone. Combined deletion of trigger factor and DnaK is lethal.
      action: ACCEPT
      reason: Definitive demonstration of DnaK as a de novo protein folding chaperone for nascent polypeptides.
        This is a core molecular function.
