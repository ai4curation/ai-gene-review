  - term:
      id: GO:0042026
      label: protein refolding
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    supporting_entities:
    - PANTHER:PTN002454318
    - SGD:S000001878
    - UniProtKB:P08622
    review:
      summary: DnaJ participates in protein refolding as part of the DnaK/DnaJ/GrpE chaperone system.
        The IBA annotation is well-supported by experimental evidence showing DnaJ involvement in refolding
        denatured substrates (PMID:7559385, PMID:20953191).
      action: ACCEPT
      reason: Core function of DnaJ. The DnaK/DnaJ/GrpE system refolds misfolded proteins, and DnaJ is
        essential for substrate delivery and DnaK activation in this process. Supported by IDA from PMID:7559385
        and the unfoldase/refolding work of PMID:20953191.
      propagation_review:
        root_cause: NO_FAILURE_CORE
        source_entities:
        - source_id: PANTHER:PTN002454318
          source_label: PANTHER:PTN002454318
          source_status: SUPPORTS_TRANSFER
          comment: Current PTHR43096 PAINT retains GO:0042026 at this node.
        - source_id: SGD:S000001878
          source_label: SGD:S000001878
          source_status: SUPPORTS_TRANSFER
          comment: Listed descendant evidence supporting ancestral refolding involvement.
        - source_id: UniProtKB:P08622
          source_label: DnaJ
          source_status: SUPPORTS_TRANSFER
          comment: DnaJ's own experimental refolding annotation is valid descendant evidence and supports
            the node placement.
      supported_by:
      - reference_id: PMID:7559385
        supporting_text: The DnaJ protein of Escherichia coli and the DnaJ-like proteins of eukaryotes
          are known as molecular chaperones and specific regulators of DnaK-like proteins and are involved
          in protein folding and renaturation after stress.
      - reference_id: PMID:20953191
        supporting_text: Hsp70-Hsp40-NEF and possibly Hsp100 are the only known molecular chaperones that
          can use the energy of ATP to convert stably pre-aggregated polypeptides into natively refolded
          proteins.
    qualifier: involved_in
  - term:
      id: GO:0051082
      label: unfolded protein binding
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    supporting_entities:
    - PANTHER:PTN002454318
    - SGD:S000001878
    - UniProtKB:P08622
    review:
      summary: DnaJ does bind unfolded proteins via its C-terminal domain and delivers them to DnaK. However,
        GO:0051082 "unfolded protein binding" is a legacy binding-style assertion for a chaperone cycle
        component; DnaJ is better described as a protein folding chaperone (GO:0044183) since its binding
        to unfolded proteins is in the context of the chaperone folding cycle, not as an independent binding
        function. DnaJ is a co-chaperone, not an independent foldase.
      action: MODIFY
      reason: GO:0051082 states only unfolded-client binding and loses the ATPase stimulation and client-transfer
        context of the DnaK/DnaJ/GrpE chaperone cycle. GO:0044183 "protein folding chaperone" better captures
        this co-chaperone function; GO:0003767 "co-chaperone activity" is obsolete, so GO:0044183 is the
        pragmatic interim term.
      proposed_replacement_terms:
      - id: GO:0044183
        label: protein folding chaperone
      propagation_review:
        root_cause: SOURCE_STALE_OR_MISSING
        source_entities:
        - source_id: PANTHER:PTN002454318
