    qualifier: involved_in
  - term:
      id: GO:0031072
      label: heat shock protein binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: IEA from InterPro (IPR001305, the DnaJ cysteine-rich domain). DnaJ directly binds DnaK
        (Hsp70) via its J-domain and zinc finger region. This is well-established experimentally (PMID:9860950,
        PMID:10521435, PMID:22065753). However, the term "heat shock protein binding" is quite vague.
