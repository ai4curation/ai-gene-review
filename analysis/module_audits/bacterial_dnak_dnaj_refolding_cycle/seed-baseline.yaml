    qualifier: enables
  - term:
      id: GO:0051082
      label: unfolded protein binding
    evidence_type: IDA
    original_reference_id: PMID:9145101
    review:
      summary: 'Rudiger et al. (1997) characterized DnaK interaction with peptide substrates, defining
        the substrate-binding motif: DnaK recognizes extended peptide strands composed of hydrophobic
        residues. This directly demonstrates binding to unfolded protein segments. However, GO:0051082
        is now formally obsolete.'
      action: MODIFY
      reason: GO:0051082 is now formally obsolete (go-ontology#30962). While this paper directly demonstrates
        DnaK binding to unfolded peptide segments, this binding is mechanistically part of DnaK's foldase
        activity. The correct replacement is GO:0044183 (protein folding chaperone) or GO:0140662 (ATP-dependent
        protein folding chaperone). DnaK can also act as a holdase in some contexts (PMID:2203539), but
        the holdase NTR is pending.
      proposed_replacement_terms:
      - id: GO:0140662
        label: ATP-dependent protein folding chaperone
      supported_by:
      - reference_id: PMID:9145101
        supporting_text: DnaK recognizes extended peptide strands composed of up to five consecutive hydrophobic
          residues within and positively charged residues outside the substrate binding cavity
    qualifier: enables
  - term:
      id: GO:0008270
      label: zinc ion binding
    evidence_type: IDA
    original_reference_id: PMID:11985624
    review:
      summary: Katayama et al. (2002) identified DnaK as a zinc-binding protein in a systematic search
        for zinc-binding proteins in E. coli using radioactive Zn(II) binding assay. DnaK was among nine
        newly identified zinc-binding proteins.
      action: KEEP_AS_NON_CORE
      reason: The abstract explicitly identifies DnaK in a radioactive Zn(II)-binding screen, so the IDA
        is supported and should not remain undecided. The physiological role and specificity are unresolved,
        making zinc binding a non-core biochemical property rather than a central chaperone function.
      supported_by:
      - reference_id: PMID:11985624
        supporting_text: 'nine zinc-binding proteins were newly identified including: acetate kinase (AckA),
          DnaK, serine hydroxymethyltransferase (GlyA)'
      - reference_id: file:ECOLI/DnaK/DnaK-hypotheses/prediction-zinc-binding/openscientist.md
        supporting_text: DnaK has **only one cysteine (Cys15)** in 638 residues and **no CXXC / C4 zinc-finger
          motif**
    qualifier: enables
