  - term:
      id: GO:0006260
      label: DNA replication
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: IEA from UniProt keyword mapping (KW-0235 "DNA replication"). The attached literature establishes
        DnaJ participation in phage lambda genome replication and plasmid DNA replication as part of the
        DnaK/DnaJ/GrpE chaperone system, which remodels extrachromosomal replication initiation complexes.
        This is a specialized non-core application of DnaJ's chaperone activity.
      action: KEEP_AS_NON_CORE
      reason: DnaJ involvement in DNA replication is indirect -- it functions as a chaperone to disassemble
        or activate replication initiation complexes rather than as part of the host replisome. The UniProt
        keyword mapping covers both phage lambda and plasmid replication initiators, so the generic process
        row is retained as non-core rather than narrowed to the viral-only GO:0044829 term used for the
        direct lambda IMP row.
      supported_by:
      - reference_id: PMID:1361234
        supporting_text: a set of Escherichia coli heat shock proteins termed the Hsp70 complex--DnaK,
          DnaJ, and GrpE--act with ATP to release lambda P protein from the nucleo-protein complex, freeing
          the DnaB helicase for its DNA-unwinding reaction.
      - reference_id: PMID:15485812
        supporting_text: Here we show that the chaperone DnaK along with its co-chaperone DnaJ and the
          nucleotide exchange factor GrpE were needed to activate WT pi and caused it to initiate replication
          in vitro at the correct origin.
    qualifier: involved_in
