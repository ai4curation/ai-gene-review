  - term:
      id: GO:0045892
      label: negative regulation of DNA-templated transcription
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    review:
      summary: This IEA annotation is inferred from GO:0016989 (sigma factor antagonist activity) via
        logical inference. DnaK binds and inactivates sigma32, which represses heat shock gene transcription
        (PMID:8599944). The inference is sound since antagonizing sigma32 leads to negative regulation
        of sigma32-dependent transcription.
      action: ACCEPT
      reason: Logically sound inference from the experimentally validated sigma factor antagonist activity
        (GO:0016989). DnaK-mediated sequestration of sigma32 represses heat shock gene transcription.
      supported_by:
      - reference_id: PMID:8599944
        supporting_text: DnaK and DnaJ cooperatively inhibit sigma32 activity in heat shock gene transcription
    qualifier: involved_in
  - term:
      id: GO:0000166
      label: nucleotide binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: IEA annotation from UniProt keyword mapping. DnaK binds both ATP and ADP, which is well-established
        experimentally (PMID:7776367, PMID:19439666). This is a broader parent of the more specific ATP
        binding annotation.
      action: ACCEPT
      reason: Correct but very general. Subsumed by more specific ATP binding (GO:0005524) and ADP binding
        (GO:0043531) annotations which are experimentally validated. Acceptable as an IEA annotation.
    qualifier: enables
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    review:
      summary: IEA annotation for ATP binding, which is also supported by direct IDA evidence (PMID:9103205,
        PMID:7776367). DnaK has a well-characterized N-terminal ATPase domain.
      action: ACCEPT
      reason: Correct annotation. ATP binding is a core feature of DnaK's N-terminal nucleotide-binding
        domain. Redundant with IDA-supported annotations but acceptable.
    qualifier: enables
  - term:
      id: GO:0005737
      label: cytoplasm
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    review:
      summary: IEA annotation from UniProt subcellular location mapping. DnaK is predominantly cytoplasmic,
        confirmed by HDA (PMID:16858726) and IDA (PMID:15911532, PMID:18304323) evidence as well.
      action: ACCEPT
      reason: Correct localization. Broader than cytosol (GO:0005829) but acceptable as IEA.
    qualifier: located_in
  - term:
      id: GO:0005886
      label: plasma membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    review:
      summary: IEA annotation from UniProt subcellular location. UniProt lists DnaK as a peripheral inner
        membrane protein (PMID:16079137). DnaK has also been found associated with membrane fractions
        (PMID:16858726 HDA). This is a secondary localization.
      action: KEEP_AS_NON_CORE
      reason: DnaK is primarily cytosolic but has been detected at the cell inner membrane as a peripheral
        protein. This is not a core localization but is supported by UniProt annotations citing PMID:16079137.
    qualifier: located_in
  - term:
      id: GO:0006260
      label: DNA replication
    evidence_type: IEA
    original_reference_id: GO_REF:0000043
    review:
      summary: IEA annotation from UniProt keyword mapping (KW-0235 DNA replication). UniProt describes
        DnaK as essential for phage lambda DNA replication and involved in chromosomal DNA replication
        through interaction with DnaA. This reflects a genuine but non-core function.
      action: KEEP_AS_NON_CORE
      reason: DnaK's role in DNA replication is well-documented for phage lambda (releasing lambda O and
        P from the preprimosomal complex) and proposed for chromosomal replication via DnaA interaction.
        However, this is not DnaK's primary evolved function -- it reflects chaperone activity applied
        to replication machinery, not a direct replication function.
    qualifier: involved_in
  - term:
      id: GO:0006457
      label: protein folding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: IEA annotation from InterPro (IPR012725, Chaperone_DnaK). DnaK is a core protein folding
        chaperone. This BP annotation is correct and also supported by IDA evidence (PMID:9103205).
      action: ACCEPT
      reason: Protein folding is the core biological process in which DnaK participates. This IEA is consistent
        with the extensive experimental evidence.
    qualifier: involved_in
  - term:
      id: GO:0016887
      label: ATP hydrolysis activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: IEA annotation from InterPro (IPR013126, Hsp_70_fam). Duplicates the IBA annotation for
        the same term. DnaK has well-characterized intrinsic ATPase activity.
      action: ACCEPT
      reason: Correct. Duplicate of the IBA annotation but from a different evidence source. ATP hydrolysis
        is central to DnaK function.
    qualifier: enables
  - term:
      id: GO:0051082
      label: unfolded protein binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: IEA annotation from InterPro (IPR012725). GO:0051082 is now formally obsolete (go-ontology#30962).
        DnaK does bind unfolded proteins, but this binding is in the context of its foldase activity,
        not as a passive binder. The function is better captured by GO:0044183 (protein folding chaperone)
        or GO:0140662 (ATP-dependent protein folding chaperone), both of which DnaK already has.
      action: MODIFY
      reason: GO:0051082 is now formally obsolete. DnaK's binding of unfolded proteins is mechanistically
        part of its ATP-dependent foldase cycle, not passive binding. The correct MF is GO:0044183 or
        its child GO:0140662. DnaK can also function as a holdase in some contexts (PMID:2203539, ATP-independent
        protection from aggregation), but the holdase NTR has not yet been created.
      proposed_replacement_terms:
      - id: GO:0044183
        label: protein folding chaperone
      supported_by:
      - reference_id: PMID:7937953
        supporting_text: DnaK, the Hsp70 protein of Escherichia coli, is regulated by the chaperone protein
          DnaJ and the cofactor GrpE...we have analyzed a model reaction in which DnaK, DnaJ, and GrpE
          mediate the folding of denatured firefly luciferase
    qualifier: enables
  - term:
