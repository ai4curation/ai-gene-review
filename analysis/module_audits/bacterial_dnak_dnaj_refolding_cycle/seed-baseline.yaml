  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IDA
    original_reference_id: PMID:7776367
    review:
      summary: McCarty et al. (1995) characterized the ATP hydrolysis cycle of DnaK, showing that ATP-bound
        DnaK is the primary form initiating substrate interaction.
      action: ACCEPT
      reason: Core function. ATP binding to DnaK's NBD drives its conformational cycle. This paper provided
        detailed kinetic characterization of the nucleotide cycle.
      supported_by:
