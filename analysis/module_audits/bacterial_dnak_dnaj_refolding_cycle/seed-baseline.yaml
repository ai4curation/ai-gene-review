        that stimulates the ATPase activity of its partner DnaK (Hsp70). It is DnaK, not DnaJ, that binds
        and hydrolyzes ATP. The UniProt record lists no ATP-binding site or feature for DnaJ, and there
        is no Walker motif in the sequence. This is a known erroneous InterPro2GO propagation to the DnaJ
        family and should be removed.
      action: REMOVE
      reason: DnaJ has no ATP-binding site or Walker motif in its sequence; ATP binding and hydrolysis
        are properties of its partner DnaK, so this is an erroneous family-level InterPro2GO transfer.
      supported_by:
