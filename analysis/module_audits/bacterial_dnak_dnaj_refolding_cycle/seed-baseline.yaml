    review:
      summary: DnaK is the canonical bacterial protein folding chaperone (foldase). It assists protein
        folding through iterative ATP-driven binding-and-release cycles (PMID:7937953). The IBA annotation
        is well-supported and represents a core function of the HSP70 family.
      action: ACCEPT
      reason: Core molecular function of DnaK. The IBA captures the foldase activity at the correct level
        of specificity. DnaK has both GO:0044183 (general foldase) and GO:0140662 (ATP-dependent foldase)
        annotations; both are appropriate with GO:0140662 being more specific.
