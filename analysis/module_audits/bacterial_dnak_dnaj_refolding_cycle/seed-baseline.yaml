  - term:
      id: GO:0045892
      label: negative regulation of DNA-templated transcription
    evidence_type: IEA
    original_reference_id: GO_REF:0000108
    review:
      summary: This IEA annotation is logically inferred from the sigma factor antagonist activity annotation
        (GO:0016989). DnaJ, together with DnaK, inactivates sigma32 by direct binding, thereby negatively
        regulating heat shock gene transcription (PMID:8599944, PMID:1534276). The inference is sound.
      action: ACCEPT
      reason: Logical inference from GO:0016989 sigma factor antagonist activity. DnaJ binds sigma32 directly
        and cooperates with DnaK to inhibit its transcriptional activity, constituting negative regulation
        of transcription (PMID:8599944).
      supported_by:
      - reference_id: PMID:8599944
        supporting_text: DnaK and DnaJ cooperatively inhibit sigma32 activity in heat shock gene transcription
          and GrpE partially reverses this inhibition.
    qualifier: involved_in
  - term:
      id: GO:0005524
      label: ATP binding
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    review:
      summary: IEA from InterPro mapping (IPR012724, the DnaJ family). However, DnaJ itself does not bind
        or hydrolyze ATP. DnaJ stimulates the ATPase activity of DnaK, but the ATP binding is by DnaK,
        not DnaJ. The InterPro mapping is incorrect for DnaJ specifically.
      action: REMOVE
      reason: DnaJ does not bind ATP. It stimulates the ATPase activity of DnaK (the Hsp70), which is
        the ATP-binding partner. UniProt does not list ATP binding as a feature of DnaJ, and no experimental
        evidence supports direct ATP binding by DnaJ. This is an erroneous IEA mapping from the DnaJ family
        InterPro entry.
      supported_by:
      - reference_id: PMID:8599944
        supporting_text: DnaJ, through rapid association with sigma32 and stimulation of hydrolysis of
          DnaK-bound ATP, mediates efficient binding of DnaK to sigma32 in the presence of ATP
    qualifier: enables
