        GrpE, HtpG, and ClpB. This is also supported by IPI evidence (PMID:9103205, PMID:21525416).
      action: ACCEPT
      reason: Correct. DnaK physically interacts with multiple protein-folding chaperones as part of its
        functional cycle.
    qualifier: enables
  - term:
