    qualifier: acts_upstream_of_or_within
    review:
      summary: Sharma et al. characterized a bacterial Hsp70-Hsp40-NEF system that uses ATP to unfold
        stably misfolded polypeptides into intermediates that can refold after chaperone release.
      action: ACCEPT
      reason: In E. coli, GrpE is the nucleotide-exchange factor that recycles DnaK in this Hsp70/Hsp40/NEF
        unfoldase reaction. GrpE directly performs the nucleotide-exchange step that resets DnaK for substrate
        release and rebinding, even though DnaK and DnaJ rather than GrpE contact the client polypeptide.
      supported_by:
      - reference_id: PMID:20953191
        supporting_text: Hsp70-Hsp40-NEF and possibly Hsp100 are the only known molecular chaperones that
          can use the energy of ATP to convert stably pre-aggregated polypeptides into natively refolded
          proteins.
