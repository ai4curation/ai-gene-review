scope: Reviewed six-protein panel; biochemical capability is not evidence that every bacterial Hsp70/J/GrpE combination is compatible.
claims:
- role: DnaK ATP-driven client remodeling
  representatives: [P0A6Y8, Q88DU2]
  function: GO:0140662
  reference: PMID:7937953
  quote: Several rounds of ATP-dependent interaction with DnaK and DnaJ are required for fully efficient folding.
  scope: Direct E. coli denatured firefly-luciferase reconstitution; Q88DU2 is a curated-family/function inference, not a purified KT2440 assay.
- role: DnaJ client capture and DnaK activation
  representatives: [P08622, Q88DU3]
  function: GO:0001671
  reference: PMID:1826368
  quote: the presence of DnaJ alone leads to an acceleration in the rate of hydrolysis of the DnaK-bound ATP.
  scope: Direct E. coli biochemistry; Q88DU3 is supported by curated HAMAP MF_01152 and comparison, not exact-target kinetics.
- role: GrpE nucleotide exchange
  representatives: [P09372, Q88DU1]
  function: GO:0000774
  reference: PMID:1826368
  quote: The presence of GrpE alone increases the rate of release of bound ATP or ADP without affecting the rate of hydrolysis.
  scope: Direct E. coli nucleotide-release measurement; Q88DU1 supported by curated HAMAP MF_01151 and GrpE architecture. Do not equate increased cycle turnover with hydrolysis catalyzed by GrpE.
- role: Regulatory boundary
  reference: PMID:11162122
  quote: Here, DnaJ does not stimulate the DnaK-mediated ATP hydrolysis
  scope: Thermus thermophilus negative kinetic result prevents universal J-domain ATPase-stimulation inference. It does not negate E. coli or KT2440 assignments.
- role: Pseudomonas physiological boundary
  reference: PMID:33668424
  quote: P. putida strains used are derivatives of PaW85 [37], which is isogenic to the strain KT2440 [38,39].
  scope: Methods source dnaK from PaW85 chromosome. GraT and competition phenotypes support a physiological role but do not measure a purified KT2440 three-protein cycle.
- role: Separate DnaK holdase activity
  representative: P0A6Y8
  proposed_function: holdase chaperone activity
  reference: PMID:2203539
  quote: the dnaK gene product, protects the host RNA polymerase enzyme from heat inactivation in an ATP-independent reaction
  scope: Separate supported protective activity; do not model it as requiring ATP or infer it from every Hsp70-family member.
- role: Specialized heat-shock transcription feedback
  representatives: [P0A6Y8, P08622]
  function: GO:0016989
  reference: PMID:8599944
  quote: DnaK and DnaJ cooperatively inhibit sigma32 activity in heat shock gene transcription
  scope: E. coli regulatory output, distinct from the generic protein-folding cycle.
limitations:
- All five owned normal forced publication fetches succeeded but remained abstract-only. Specific construct/substrain details absent from those abstracts are not asserted.
- Three E. coli GO0065003 process assertions citing PMID9103205 remain UNDECIDED; the abstract proves a physical DnaK-GrpE complex, not the precise assembly-process work attributed to each component.
- Current GO0044183 defines binding that assists protein folding; DnaJ's accepted activity does not assign ATP hydrolysis or autonomous ATP-driven unfolding to DnaJ.
- Pseudomonas whole-cell phenotypes and family assignments do not imply universal cross-species component interchangeability or exact kinetic conservation.
