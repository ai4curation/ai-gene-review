limits:
- Manual source-based reaction panel, not gene-review-action inference, proteome scan or native-flux proof.
  Single-gene architecture and same-system gates are explicit external constraints.
- The production compiler carries family/function IDs but does not enforce taxon, same-strain identity,
  PAINT ancestry or complex architecture; the stated external gates do.
- PAINT nodes are curated context, not tested ancestry predicates in this checker.
- A required GlpF witness defines this implementation, not all biological glycerol uptake.
