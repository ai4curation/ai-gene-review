references:
- id: PMID:30883020
  title: Biochemistry, genetics and biotechnology of glycerol utilization in Pseudomonas species.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Comparative review read from the retrieved full cache. Its ubiquinol-dependent wording
      for GlpD reverses the immediate oxidized acceptor: PMID18296637 and PMID25827416 support quinone
      reduction. Do not transfer its historical absence statements to all current Pseudomonas genomes.'
  findings:
  - statement: Glycerol channel uptake and ATP-dependent phosphorylation feed a quinone-linked glycerol-3-phosphate
      dehydrogenase in the described Pseudomonas systems.
  - statement: The nonphosphorylating GldA/DhaKLM and anaerobic GlpABC routes are alternative implementations
      rather than components required by this module.
- id: PMID:31069487
  title: Glycerol metabolism and its regulation in lactic acid bacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Only cached original abstract read; used for comparative scope. The published correction
      PMID31147755 was read separately and corrects species, operon and GlpA/GlpD assignments. Detailed
      oxidase chemistry is supported independently, not inferred from the uncorrected review.
  findings:
  - statement: Lactic acid bacteria show glycerol-metabolism differences from the three enterobacterial
      model systems summarized in the review.
  - statement: Widespread occurrence of genes needed for glycerophospholipid synthesis does not establish
      that a bacterium can use glycerol as a carbon source.
- id: PMID:28961963
  title: Glycerol metabolism and its implication in virulence in Mycoplasma.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Only cached abstract read; it explicitly identifies peroxide-generating oxidase chemistry.
      Use as a boundary comparator, not primary assay evidence for an unexamined protein.
  findings:
  - statement: Mycoplasma can access glycerol-3-phosphate through free glycerol phosphorylation or imported
      glycerophosphodiesters.
  - statement: The described glycerol-3-phosphate oxidase produces hydrogen peroxide, so it is not the
      quinone-acceptor reaction in this module.
- id: PMID:18296637
  title: Structure of glycerol-3-phosphate dehydrogenase, an essential monotopic membrane enzyme involved
    in respiration and metabolism.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. Direct E. coli structures and biochemical context; membrane
      topology and acceptor specificity are not experimentally shown on every homolog.
  findings:
  - statement: Active E. coli GlpD is a monotopic membrane enzyme with FAD-dependent glycerol-3-phosphate
      oxidation.
  - statement: Structures with quinone analogues identify a likely ubiquinone-binding region, linking
      glycerol-3-phosphate oxidation to respiration.
- id: PMID:4945192
  title: 'Anaerobic L- -glycerophosphate dehydrogenase of Escherichia coli: its genetic locus and its
    physiological role.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary abstract explicitly describes the informative mutant comparison; no full-text-access
      claim. Terminology aerobic versus anaerobic names enzyme systems and does not impose oxygen as GlpD
      substrate.
  findings:
  - statement: Cells retaining the particulate enzyme but lacking the soluble anaerobic enzyme can grow
      on glycerol with nitrate anaerobically, but not with fumarate.
  - statement: Loss of both systems prevents significant growth on glycerol or glycerol phosphate under
      the tested conditions.
- id: PMID:25827416
  title: The glycerol-dependent metabolic persistence of Pseudomonas putida KT2440 reflects the regulatory
    logic of the GlpR repressor.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. KT2440 regulatory physiology and GlpK activity measured in cell
      extracts support the pathway assignment. The GlpD quinone-specificity depiction is not a purified
      KT2440 acceptor assay.
  findings:
  - statement: The KT2440 glp locus encodes GlpF, GlpK, GlpR and GlpD with separately controlled transcriptional
      units.
  - statement: Glycerol phosphorylation supplies glycerol-3-phosphate for GlpD and provides metabolic
      trapping behind facilitated uptake.
  - statement: The study measures ATP-dependent GlpK activity in KT2440 cell extracts using a coupled
      glycerol-phosphate assay.
- id: PMID:2127799
  title: 'Glycerol catabolism in Bacillus subtilis: nucleotide sequence of the genes encoding glycerol
    kinase (glpK) and glycerol-3-phosphate dehydrogenase (glpD).'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached primary abstract read. Strain and assay boundaries were examined independently
      in full primary papers PMID4368746 and PMID8436953; this cloning abstract is not a purified quinone-acceptor
      assay.
  findings:
  - statement: The cloned Bacillus glp region complements mutants defective in glycerol catabolism.
  - statement: Sequenced glpK and glpD encode the phosphorylation and glycerol-phosphate oxidation steps;
      specific electron-acceptor and membrane claims need separate evidence.
- id: PMID:9726992
  title: The soluble alpha-glycerophosphate oxidase from Enterococcus casseliflavus. Sequence homology
    with the membrane-associated dehydrogenase and kinetic analysis of the recombinant enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract describes recombinant oxidase kinetics and close sequence similarity
      to Bacillus dehydrogenase. Curated UniProt O86963 supplies the oxygen/peroxide reaction; no full-text-access
      claim.
  findings:
  - statement: Recombinant Enterococcus casseliflavus glycerol-phosphate oxidase is catalytically active
      despite close sequence similarity to Bacillus glycerol-phosphate dehydrogenase.
  - statement: Shared FAD-dependent enzyme family membership therefore cannot distinguish the oxidase
      from the quinone-linked reaction.
- id: PMID:31147755
  title: 'Correction to: Glycerol metabolism and its regulation in lactic acid bacteria.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Published correction text read in indexed publisher preview hosted by ResearchGate;
      publisher landing page verifies identity. Source-access notes are in modules/bacterial_glycerol_uptake_catabolism-source-analysis/lab-review-correction.md.
      The cached record is abstract-only and has not been rewritten.
  findings:
  - statement: The correction identifies Lactococcus lactis subsp. cremoris GlpA and Lactobacillus alimentarius
      GlpD, correcting swapped assignments in the original review.
  - statement: The corrected Lactococcus operon is glpKAF and its referenced strain is SK11; these literature
      corrections do not themselves measure acceptor specificity.
- id: PMID:4368746
  title: 'Glycerol metabolism in Bacillus subtilis: gene-enzyme relationships.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full publisher PDF read, particularly pp.432–435 and Tables1–4. W168 and BR95-derived
      strains; 17,000 × g extract supernatant and tetrazolium assay do not resolve membrane topology or
      physiological acceptor.
  findings:
  - statement: Bacillus mutants lacking inducible NAD-independent glycerol-phosphate dehydrogenase fail
      to grow on glycerol or glycerol phosphate.
  - statement: The dehydrogenase assay measures tetrazolium reduction in crude extract; it does not directly
      measure purified quinone reduction.
  - statement: Bacillus glycerol-kinase mutants retain growth on glycerol phosphate, placing phosphorylation
      upstream of its catabolic oxidation.
- id: PMID:8436953
  title: The glpP and glpF genes of the glycerol regulon in Bacillus subtilis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full publisher PDF read, particularly pp.355–357. BR95 and derivatives establish operon
      organization and expression; GlpF channel assignment uses hydropathy, conserved MIP residues and
      homolog comparison.
  findings:
  - statement: Bacillus glpF and glpK form an operon, linking the proposed uptake facilitator to glycerol
      phosphorylation.
  - statement: The GlpF assignment combines predicted membrane spans, conserved MIP residues and approximately
      35% identity to E. coli GlpF; a target channel-permeability assay is not reported.
limitations:
- Bacillus physiological activity is direct; quinone acceptor specificity is retained curated synthesis.
- Family-wide electron-acceptor scope remains unresolved; positive gene activities do not grant the family
  the activity.
- Coverage checks enforce same-system identity and single-gene architecture externally; the compiler alone
  does not.
