    original_reference_id: PMID:1429594
    qualifier: enables
    review:
      summary: The in vitro oxidative-folding assay directly supports DsbA thiol-disulfide oxidoreductase
        activity.
      action: ACCEPT
      reason: Purified DsbA stimulates formation of disulfide bonds in reduced protein substrates, and
