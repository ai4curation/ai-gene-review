      id: GO:0005515
      label: protein binding
    evidence_type: IPI
    original_reference_id: PMID:17110337
    qualifier: enables
    supporting_entities:
    - UniProtKB:P0A6M2
    review:
      summary: The DsbB-DsbA structure captures a true reaction complex, but generic protein binding does
