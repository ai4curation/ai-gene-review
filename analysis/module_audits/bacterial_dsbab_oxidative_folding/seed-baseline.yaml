    evidence_type: IPI
    original_reference_id: PMID:18775700
    qualifier: enables
    supporting_entities:
    - UniProtKB:P0A6M2
    review:
      summary: A trapped ternary DsbB-quinone-DsbA intermediate supports DsbA-DsbB electron transfer rather
        than generic protein binding as a function.
      action: REMOVE
      reason: The DsbA-DsbB association detected here is a covalent reaction intermediate in DsbB-dependent
        reoxidation of DsbA. The binding observation is real, but GO:0005515 is mechanistically uninformative
