      id: GO:0015035
      label: protein-disulfide reductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000120
    qualifier: enables
    supporting_entities:
    - InterPro:IPR003752
    - UniRule:UR000083131
    review:
      summary: Compatible but less precise than quinone-linked electron transfer.
      action: KEEP_AS_NON_CORE
      reason: The InterPro/UniRule inference recognizes DsbB as a thiol-disulfide redox protein. GO:0015035
        is valid for the reversible DsbA oxidation step, but GO:0009055 and GO:0016672 are closer to the
        DsbB-specific electron-transfer mechanism.
      supported_by:
      - reference_id: PMID:10854438
        supporting_text: Here we show that DsbB, a protein required for disulfide bond formation in vivo,
          uses the oxidizing power of quinones to generate disulfides de novo.
  - term:
      id: GO:0015035
      label: protein-disulfide reductase activity
    evidence_type: IMP
    original_reference_id: PMID:8430071
    qualifier: enables
    review:
      summary: Genetic evidence places DsbB immediately upstream of DsbA in disulfide bond formation.
      action: KEEP_AS_NON_CORE
      reason: DsbB mutations cause defects in the same in vivo disulfide-bond formation pathway and support
        DsbB's role in regenerating DsbA. The reversible GO:0015035 definition is compatible with that
        reaction, but is kept outside the core in favor of the quinone-linked electron transfer term.
      supported_by:
      - reference_id: PMID:8430071
        supporting_text: Evidence suggests that DsbB may act by reoxidizing DsbA, thereby regenerating
          its ability to donate its disulfide bond to target proteins.
