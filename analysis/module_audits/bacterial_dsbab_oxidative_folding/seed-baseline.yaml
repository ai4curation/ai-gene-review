    review:
      summary: The cytochrome c assembly phenotype is consistent with the same periplasmic DsbA disulfide-oxidoreductase
        role.
      action: ACCEPT
      reason: The paper localizes a formate-dependent nitrite-reduction and c-type cytochrome defect to
