  - term:
      id: GO:0003756
      label: protein disulfide isomerase activity
    evidence_type: IBA
    original_reference_id: GO_REF:0000033
    qualifier: enables
    supporting_entities:
    - PANTHER:PTN002185589
    - UniProtKB:P0AEG4
    review:
      summary: DsbA is a disulfide oxidoreductase, but the isomerase term overstates its physiological
        role relative to oxidative disulfide introduction.
      action: MODIFY
      reason: The PAINT assertion lands on the correct DsbA-family node, with the target's own experimental
        annotations as descendant evidence, but GO:0003756 specifically describes disulfide rearrangement.
        DsbA is the periplasmic oxidase that donates its active-site disulfide to exported substrates,
        while DsbC/DsbD perform the dedicated reducing/isomerizing branch. GO:0015035 names protein-disulfide
        oxidoreductase chemistry without assigning DsbC-like isomerase repair as DsbA's core role.
      proposed_replacement_terms:
      - id: GO:0015035
        label: protein-disulfide reductase activity
      supported_by:
      - reference_id: PMID:1429594
        supporting_text: Purified DsbA markedly stimulated disulfide bond formation of E. coli alkaline
          phosphatase, either in vitro synthesized or purified and denatured, as well as of reduced bovine
          ribonuclease A.
      propagation_review:
        root_cause: TERM_SCOPING_PROBLEM
        source_entities:
        - source_id: PANTHER:PTN002185589
          source_label: PANTHER:PTN002185589
          source_status: SUPPORTS_TRANSFER
          comment: The historical DsbA-family PAINT assertion points at the correct clade but uses a term
            that is less accurate than disulfide oxidoreductase activity for DsbA.
  - term:
      id: GO:0003756
      label: protein disulfide isomerase activity
    evidence_type: IDA
    original_reference_id: PMID:1934062
    qualifier: enables
    review:
      summary: The direct DsbA discovery paper supports disulfide oxidoreductase activity, not a dedicated
        isomerase function.
      action: MODIFY
      reason: The paper identified DsbA as a periplasmic protein with a Cys-Pro-His-Cys motif and showed
        both in vivo disulfide formation defects and an in vitro insulin-reduction activity. That evidence
        establishes DsbA as a protein thiol-disulfide oxidoreductase; GO:0015035 is a better fit than
        the isomerase-specific GO:0003756 term.
      proposed_replacement_terms:
      - id: GO:0015035
        label: protein-disulfide reductase activity
      supported_by:
      - reference_id: PMID:1934062
        supporting_text: The dsbA gene codes for a 21,000 Mr periplasmic protein containing the sequence
          cys-pro-his-cys, which resembles the active sites of certain disulfide oxidoreductases.
