    review:
      summary: GO:0015035 is the specific protein-disulfide oxidoreductase activity term for DsbA thiol-disulfide
        exchange.
      action: ACCEPT
      reason: GO:0015035 is defined with a reversible equality between reduced sulfide groups and oxidized
        disulfide bonds. That makes it compatible with DsbA-catalyzed disulfide exchange despite the reductase
        wording in the primary label, and GO records protein disulfide oxidoreductase activity as an exact
        synonym.
      supported_by:
      - reference_id: PMID:1429594
        supporting_text: Purified DsbA markedly stimulated disulfide bond formation of E. coli alkaline
          phosphatase, either in vitro synthesized or purified and denatured, as well as of reduced bovine
          ribonuclease A.
