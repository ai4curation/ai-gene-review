    label: Pseudomonas putida KT2440
  original_rows:
  - term:
      id: GO:0015036
      label: disulfide oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000117
    qualifier: enables
    review:
      summary: Sound but one level too broad for a DsbA-family protein-disulfide oxidoreductase.
      action: MODIFY
      reason: The exact Q88RK2 record identifies a DsbA-family thiol-disulfide interchange protein with
        the canonical active-site disulfide. GO:0015036 captures disulfide oxidoreductase chemistry broadly;
        GO:0015035 is the more specific protein-disulfide oxidoreductase term for DsbA-catalyzed thiol-disulfide
        exchange with exported substrates.
      proposed_replacement_terms:
      - id: GO:0015035
        label: protein-disulfide reductase activity
  - term:
      id: GO:0016491
      label: oxidoreductase activity
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: enables
    review:
      summary: Correct but too broad relative to disulfide oxidoreductase activity.
      action: KEEP_AS_NON_CORE
      reason: Oxidoreductase activity is a valid parent of the more informative disulfide oxidoreductase
        activity. It is broad rather than erroneous and is therefore retained outside the core-function
        summary.
  - term:
      id: GO:0042597
      label: periplasmic space
    evidence_type: IEA
    original_reference_id: GO_REF:0000044
    qualifier: located_in
    review:
      summary: Correct but broader than outer membrane-bounded periplasmic space for a Gram-negative DsbA.
      action: MODIFY
      reason: Q88RK2 has a cleavable signal peptide and UniProt assigns the mature protein to the periplasm.
        In Gram-negative Pseudomonas putida KT2440, DsbA acts in the outer membrane-bounded periplasmic
        space, making GO:0030288 the more precise component.
      proposed_replacement_terms:
      - id: GO:0030288
        label: outer membrane-bounded periplasmic space
  - term:
      id: GO:0045454
      label: cell redox homeostasis
    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: involved_in
    review:
      summary: DsbA contributes to envelope redox homeostasis, but oxidative protein folding is the more
        direct role.
      action: KEEP_AS_NON_CORE
      reason: The term is compatible with a periplasmic thiol-disulfide oxidoreductase, but it is broader
        than DsbA's direct catalytic contribution to exported protein folding.
  - term:
      id: GO:0006457
      label: protein folding
    evidence_type: ISS
    original_reference_id: file:PSEPK/dsbA/dsbA-uniprot.txt
    qualifier: involved_in
    review:
      summary: DsbA directly introduces disulfide bonds during folding of exported proteins.
      action: NEW
      reason: The DsbA-family assignment, periplasmic localization, and disulfide-oxidoreductase activity
        support oxidative folding as the direct biological process, which is absent from the fetched GOA
        set.
