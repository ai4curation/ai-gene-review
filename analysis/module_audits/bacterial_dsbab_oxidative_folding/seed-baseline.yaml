      label: membrane
    evidence_type: IEA
    original_reference_id: GO_REF:0000002
    qualifier: located_in
    supporting_entities:
    - InterPro:IPR003752
    review:
      summary: Correct but less precise than the plasma-membrane location.
      action: KEEP_AS_NON_CORE
      reason: DsbB is a multi-pass plasma-membrane protein. The generic membrane term is true but redundant
        with the more specific GO:0005886 location.
      supported_by:
      - reference_id: PMID:8430071
        supporting_text: We propose that DsbB, an integral membrane protein, may be involved in transducing
          redox potential across the cytoplasmic membrane.
  - term:
      id: GO:0016672
      label: oxidoreductase activity, acting on a sulfur group of donors, quinone or similar compound
        as acceptor
    evidence_type: IDA
    original_reference_id: PMID:10428033
    qualifier: enables
    review:
      summary: Purified DsbB directly uses quinones as electron acceptors for oxidative protein folding.
      action: ACCEPT
      reason: The reconstituted system showed DsbB-dependent electron flow from DsbA to the quinone pool.
        The term precisely describes DsbB as a sulfur-donor oxidoreductase using quinone-like acceptors.
      supported_by:
      - reference_id: PMID:10428033
        supporting_text: DsbB uses quinones as electron acceptors, allowing various choices for electron
          transport to support disulfide bond formation.
  - term:
      id: GO:0048039
      label: ubiquinone binding
    evidence_type: IDA
    original_reference_id: PMID:10854438
    qualifier: enables
    review:
      summary: DsbB binds quinone directly as part of its disulfide-generating redox cycle.
      action: ACCEPT
      reason: The in vitro reconstitution and binding work showed that DsbB contains a high-affinity quinone-binding
        site and reduces quinone during oxidative folding. This is an exact molecular property of the
        DsbB electron-transfer mechanism.
      supported_by:
      - reference_id: PMID:10854438
        supporting_text: DsbB contains a single high affinity quinone-binding site.
- review_path: genes/PSEPK/dsbA/dsbA-ai-review.yaml
  accession: Q88RK2
  taxon:
