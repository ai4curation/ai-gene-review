    evidence_type: IEA
    original_reference_id: GO_REF:0000104
    qualifier: enables
    review:
      summary: Generic electron transfer is sound but less specific than the DsbB quinone-coupled sulfur-donor
        oxidoreductase activity.
      action: KEEP_AS_NON_CORE
      reason: DsbB1 is predicted to relay electrons from reduced DsbA through its membrane redox centers
        to quinone. GO:0009055 captures that relay generically, but GO:0016672 more precisely captures
        DsbB as a sulfur-donor oxidoreductase using quinone-like acceptors.
