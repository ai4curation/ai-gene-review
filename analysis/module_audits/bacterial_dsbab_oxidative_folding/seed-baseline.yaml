    qualifier: enables
    review:
      summary: The reversible protein-disulfide oxidoreductase claim captures DsbA reoxidation, but GO:0016672
        is the DsbB-specific activity.
      action: MODIFY
      reason: DsbB1 is inferred to reoxidize reduced DsbA and pass reducing equivalents to the quinone
        pool. The direction-neutral GO:0015035 term is compatible with this DsbA oxidation step, but GO:0016672
        is more specific for the membrane quinone-linked DsbB reaction.
      proposed_replacement_terms:
      - id: GO:0016672
