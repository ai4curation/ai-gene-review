scope: Exact representative-backed DsbB-dependent oxidative-folding witnesses. Absence from this list
  means no curated compatibility evidence here, not a claim of biological incompatibility. A whole-family
  or same-species match is insufficient.
pairs:
- id: ecoli
  substrate_oxidase: P0AEG4
  membrane_relay: P0A6M2
  support_level: DIRECT_RECONSTITUTION_AND_NATIVE_EVIDENCE
  scope: E. coli K-12 reference implementation; activity and native respiratory dependence are distinct
    evidence lines.
  supported_by:
  - reference_id: PMID:12853466
    statement: E. coli DsbB directly catalyzes quinone-coupled oxidation of reduced DsbA.
    supporting_text: 'The membrane protein DsbB from Escherichia coli is essential for disulfide bond

      formation and catalyses the oxidation of the periplasmic dithiol oxidase DsbA by

      ubiquinone.'
  - reference_id: PMID:9342327
    statement: Native respiratory-chain perturbations support electron transfer downstream of DsbB during
      maintenance of oxidized DsbA.
    supporting_text: 'These results suggest that the respiratory electron transfer

      chain participates in the oxidation of DsbA, by acting primarily on DsbB.'
  - reference_id: PMID:1429594
    statement: Purified E. coli DsbA directly promotes disulfide formation in protein substrates.
    supporting_text: Purified DsbA markedly stimulated disulfide bond formation of E. coli alkaline phosphatase,
      either in vitro synthesized or purified and denatured, as well as of reduced bovine ribonuclease
      A.
