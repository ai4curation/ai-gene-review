boundaries:
- case: DsbA plus VKOR
  supported_by:
  - reference_id: PMID:29463925
    statement: Actinobacterial and cyanobacterial DsbA systems can replace DsbB with VKOR; DsbA presence
      alone is insufficient to infer this DsbB-dependent module.
    supporting_text: 'One variation found amongst Actinobacteria and Cyanobacteria

      is the replacement of DsbB by a homologue of human vitamin K epoxide reductase.'
  - reference_id: PMID:40741763
    statement: Mycobacterial oxidative protein folding is performed by DsbA and VKOR, validating an alternative
      outside this DsbB-dependent module.
    supporting_text: 'Mycobacteria rely on two

      membrane enzymes, disulfide bond formation protein A (DsbA) and vitamin K

      epoxide reductase (VKOR), for introducing disulfide bonds into exported

      proteins.'
  interpretation: Alternative oxidative-folding route outside DsbB-dependent module; DsbA presence alone
    is insufficient.
- case: DsbC/DsbD
  supported_by:
  - reference_id: PMID:34504665
    statement: The DsbC/DsbD repair route is mechanistically separate from initial DsbA/DsbB oxidation.
    supporting_text: DsbC proofreads and re-shuffles non-native disulfide bonds in misfolded substrates.
  interpretation: Repair of mispaired disulfides is a separate task, not a required component of initial
    oxidation.
- case: BdbD calcium
  supported_by:
  - reference_id: PMID:19535335
    statement: Calcium modulates BdbD redox potential without being required for the tested folding or
      stability; do not make calcium presence a categorical pathway-capacity gate.
    supporting_text: the occupancy of the metal site by Ca2+ ion is not required for folding/stability
      but leads to a significant increase of the midpoint reduction potential.
  interpretation: Thermodynamic modulation, not an obligatory Boolean cofactor requirement.
