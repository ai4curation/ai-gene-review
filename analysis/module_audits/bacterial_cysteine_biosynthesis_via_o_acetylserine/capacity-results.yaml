scope: Reviewed-panel biochemical capability; not genome completeness, native flux
  or growth. KT2440 roles are inference. Minor chemistry and gene names cannot establish
  a core route.
engine: ai_gene_review.module_logic.compile_node/is_satisfied
oracle_requirements:
- reviewed core reaction
- curated exact-member route role
- module representative
- actual family
- same strain taxon
limitations:
- The production compiler does not enforce taxon or substrate semantics; this oracle
  does.
- No family-only genome inference or unsupported native pathway use is claimed.
