original_panel:
  scope: Read with the reviewed gene records; no whole-strain capacity or generic CSC inference.
  evidence:
  - id: ECOLI_cysE
    accession: P0A9D4
    statement: CysE produces O-acetyl-L-serine.
    source_id: PMID:22179612
    supporting_text: 'serine O-acetyltransferase (SAT, EC 2.3.1.30), which produces

      O-acetyl-L-serine'
    evidence_scope: E. coli complex biophysics. Reaction is also independently supported by curated target
      record and free-enzyme kinetics; do not infer substrate channeling.
  - id: ECOLI_cysM
    accession: P16703
    statement: OASS-B catalyzes OAS plus sulfide to cysteine.
    source_id: PMID:16546401
    supporting_text: 'produced by Escherichia coli that catalyze the synthesis of L-cysteine from

      O-acetyl-L-serine and sulfide.'
    evidence_scope: Abstract-only target biochemical characterization. No exact assay strain or construct-sequence
      equivalence is asserted from the abstract.
  - id: PSEAE_cysE
    accession: Q9HXI6
    statement: PA3816 catalyzes the committed OAS-forming step.
    source_id: PMID:42278617
    supporting_text: PaCysE catalyzes a committed and non-redundant step of de novo cysteine biosynthesis
    evidence_scope: PAO1 native deletion/complementation; separate recombinant codon-optimized Q9HXI6
      N-terminal Strep construct in E.coli BL21 Tuner. Non-redundancy limited to tested conditions.
  - id: PSEAE_cysE_kinetics
    accession: Q9HXI6
    statement: Purified PaCysE turns over L-serine and acetyl-CoA.
    source_id: PMID:42278617
    supporting_text: We obtained Km,AcCoA = 0.18 ± 0.02 mM, Km,L-Ser = 8.7 ± 1.1 mM and kcat = 208 ± 13
      s−1.
    evidence_scope: Direct recombinant enzymology; numbers belong to the described assay and target construct.
  - id: PSEAE_cysK
    accession: Q9I0D3
    statement: PA2709 supplies OAS+sulfide cysteine synthase activity.
    source_id: PMID:41541697
    supporting_text: 'PA2709 is a classical O-acetylserine (OAS)

      sulfhydrylase, using bisulfide as a sulfur source.'
    evidence_scope: Table1 Q9I0D3/PA2709. Independent41676964 explicitly specifies Q9I0D3 His-tagged construct
      in Rosetta(DE3); native genetics uses PAO1.
  - id: PSEAE_cysM
    accession: Q9I526
    statement: Both main isoforms have cysteine synthase activity, while PA0932 also has a distinct S-sulfocysteine
      activity.
    source_id: PMID:41541697
    supporting_text: These data further suggest a cysteine synthase activity for both isoforms and an
      additional S-sulfocysteine synthase activity for PA0932 only.
    evidence_scope: Direct enzyme kinetics in this study; the later41676964 detects weak PaCysK S-sulfocysteine
      formation, so do not treat the earlier only wording as a universal negative specificity claim.
  - id: PSEAE_cysM_thiosulfate
    accession: Q9I526
    statement: Thiosulfate produces S-sulfocysteine, requiring subsequent reduction for cysteine production.
    source_id: PMID:41676964
    supporting_text: PaCysM produced S‐sulfocysteine with complete consumption of OAS, demonstrating efficient
      thiosulfate utilization.
    evidence_scope: Direct product analysis of tagged recombinant Q9I526. This is adjacent chemistry,
      outside an OAS+sulfide-only module reaction.
  - id: PSEAE_noncanonical_CSC
    accession: Q9HXI6/Q9I0D3
    statement: Purified PaCysE/PaCysK lack the expected reciprocal kinetic modulation.
    source_id: PMID:42278617
    supporting_text: The effect, if any, is negligible. The same observation holds true when measuring
      the activity of PaCysK
    evidence_scope: Full-length enzyme kinetic assays. Combined with41676964 negative endogenous tail-peptide
      binding; not proof of no possible cellular physical interaction.
  - id: PSEPK_boundary
    accession: Q88PL0/Q88E95/Q88MC0
    statement: P.putida S-313 extracts contain cysteine synthase activity.
    source_id: PMID:10482527
    supporting_text: substantial levels of O-acetylserine sulfhydrylase (cysteine synthase) activity.
    evidence_scope: Different strain, no exact KT2440 locus assignment. KT2440 enzymes are supported by
      specific family/rule evidence, not these direct target assays.
additional_panel:
  core_evidence:
  - member: UniProtKB:Q0PAC7
    gene: CAMJE/cysE
    claim: Produces the O-acetylserine intermediate from L-serine and acetyl-CoA; the specific family
      assignment is reinforced by pathway-specific genetic and OAS-rescue evidence.
    activity:
      id: GO:0009001
      label: L-serine O-acetyltransferase activity
    supported_by:
    - reference_id: PMID:36671471
      supporting_text: These phenotypes were restored to wildtype levels by genetic complementation (Figure
        6A) and, in the case of ΔcysE, partially by chemical complementation through exogenous addition
        of OAS (Figure 6B).
    - reference_id: file:CAMJE/cysE/cysE-uniprot.txt
      supporting_text: DR   NCBIfam; TIGR01172; cysE; 1.
  - member: UniProtKB:P71128
    gene: CAMJE/cysM
    claim: Catalyzes PLP-dependent cysteine formation from O-acetyl-L-serine and sulfide. Purified-enzyme
      and growth results support this donor preference; weak thiosulfate activity is not promoted to a
      principal physiological route.
    activity:
      id: GO:0004124
      label: cysteine synthase activity
    supported_by:
    - reference_id: PMID:36671471
      supporting_text: No L-Cysteine was produced when OPS was provided as sulfur acceptor.
    - reference_id: PMID:36671471
      supporting_text: Sulfide proved to be a far superior sulfur donor, while thiosulfate was such a
        poor donor that reliable Km and Vmax values could not be calculated.
    - reference_id: PMID:36671471
      supporting_text: C. jejuni cysM (cj0912c) was amplified from NCTC 11168 genomic DNA with the primers
        listed in Table S1.
  - member: UniProtKB:P95231
    gene: MYCTU/cysE
    claim: Generates O-acetylserine from serine and acetyl-CoA.
    activity:
      id: GO:0009001
      label: L-serine O-acetyltransferase activity
    supported_by:
    - reference_id: PMID:23483228
      supporting_text: 'The serine acetyltransferase

        activity of the M. tuberculosis CysE protein was detected using Ellman''s

        reagent.'
  - member: UniProtKB:P9WP55
    gene: MYCTU/cysK1
    claim: Produces cysteine by PLP-dependent substitution of OAS acetate with sulfide.
    activity:
      id: GO:0004124
      label: cysteine synthase activity
    supported_by:
    - reference_id: PMID:17567578
      supporting_text: 'Recombinant CysK1 is a pyridoxal phosphate (PLP)-dependent enzyme

        that catalyzes the conversion of O-acetylserine to cysteine.'
  - member: UniProtKB:P9WP53
    gene: MYCTU/cysM
    claim: Transfers CysO-bound sulfur to an OPS-derived intermediate to form the CysO-cysteine adduct;
      Mec+ performs the subsequent release step.
    activity: CysO-dependent cysteine synthase activity
    supported_by:
    - reference_id: PMID:18842002
      supporting_text: 'specificity of CysM for its amino acid substrate is more than 500-fold greater

        for O-phospho-L-serine than for O-acetyl-L-serine'
    - reference_id: PMID:16104727
      supporting_text: 'A protease, Mec+, hydrolyzes

        the CysO-cysteine adduct to release cysteine and regenerate CysO.'
  - member: UniProtKB:Q06750
    gene: BACSU/cysE
    claim: Supplies OAS for cysteine synthesis through serine acetylation.
    activity:
      id: GO:0009001
      label: L-serine O-acetyltransferase activity
    supported_by:
    - reference_id: file:BACSU/cysE/cysE-uniprot.txt
      supporting_text: Reaction=L-serine + acetyl-CoA = O-acetyl-L-serine + CoA;
    - reference_id: PMID:18974048
  - member: UniProtKB:P37887
    gene: BACSU/cysK
    claim: Catalyzes cysteine formation from OAS and sulfide, independently of a CysE-CysK complex.
    activity:
      id: GO:0004124
      label: cysteine synthase activity
    supported_by:
    - reference_id: file:BACSU/cysK/cysK-uniprot.txt
      supporting_text: Reaction=O-acetyl-L-serine + hydrogen sulfide = L-cysteine + acetate;
    - reference_id: PMID:17056751
  - member: UniProtKB:P37887
    gene: BACSU/cysK
    claim: Binds CymR and stabilizes its promoter-associated repression complex; OAS promotes complex
      dissociation. CysK itself is not the DNA-binding transcription factor.
    activity:
      id: GO:0140297
      label: DNA-binding transcription factor binding
    supported_by:
    - reference_id: file:BACSU/cysK/cysK-source-analysis/primary-evidence.md
      supporting_text: CysK increased 7-fold the stability of binding of CymR to the ytlI promoter region.
  boundaries:
  - 'CAMJE CysE: family plus genotype/OAS rescue; no purified enzyme assay. CAMJE CysM: NCTC11168 His6
    enzyme OAS/sulfide, no OPS; thiosulfate signal not proof of direct free cysteine.'
  - 'MYCTU CysK1: full P9WP55 in2Q3B plus GSH; CysE peptide alone not whole complex,2024abstract independently
    reports regulatory complex.'
  - 'MYCTU CysM: OPS+CysO carrier route, Mec+ release; GO0004124 UNDECIDED, not a positive OAS module
    implementation. GSH/T2A3DKI negative product assay has no formal LOD;3DWG exact H37Rv plus RH.'
  - BACSU:168 native context; CysE14 phenotype QB944 includes purA26. CysK-His6 activity and direct CymR
    binding; no supported CysE-CysK complex under tested conditions. CysE printed clone coordinates remain
    unresolved against current217aa reference.
  - BACSU CysK positive cystathionine beta-synthase IDA contradicted by full primary results; methionine-utilization
    necessity not direct methionine breakdown.
role_boundary: Core OAS/sulfide chemistry is required; Mtb CysM is a negative native-route comparator,
  not a universal zero-activity assertion.
