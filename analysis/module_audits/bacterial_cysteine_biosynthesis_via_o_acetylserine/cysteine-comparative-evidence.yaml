status: COMPLETE_COMPARATIVE_AND_PRIMARY_MEMBER_INTEGRATION
references:
- id: PMID:36148777
  title: Combatting antimicrobial resistance via the cysteine biosynthesis pathway in bacterial pathogens.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review of bacterial CysE and OAS sulfhydrylases. Use the OAS/sulfide mechanism
      and structural comparison; its direct-thiosulfate-to-cysteine shorthand omits S-sulfocysteine reduction
      and must not define reaction products.
  findings:
  - statement: CysE forms OAS from serine and acetyl-CoA.
    supporting_text: requiring L-serine and acetyl coenzyme A (acetyl-CoA) to produce O-acetylserine (OAS).
    reference_section_type: DISCUSSION
  - statement: CysK incorporates sulfide into OAS.
    supporting_text: combines O-acetylserine with sulfide to produce cysteine
    reference_section_type: DISCUSSION
- id: PMID:38257399
  title: Challenges and Advances in the Bioproduction of L-Cysteine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full comparative review inspected for sulfur-source routes. Its thiosulfate section distinguishes
      the first product and subsequent reduction; biochemical engineering and secretion steps remain outside
      this module.
  findings:
  - statement: The thiosulfate route produces S-sulfocysteine before reduction to cysteine; it is not the two-step
      OAS/sulfide route.
    supporting_text: OAS and thiosulfate into S-sulfocysteine, which is reduced into L-cysteine and sulfite
      by glutaredoxin (Grx1)
    reference_section_type: DISCUSSION
- id: PMID:38931847
  title: Amino Acid Biosynthesis Inhibitors in Tuberculosis Drug Discovery.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review section on cysteine biosynthesis inspected. Supports separating the mycobacterial
      CysK1 OAS route from the distinct CysK2/CysM routes. The CysM mechanism still requires primary evidence,
      not inference from this short overview.
  findings:
  - statement: M. tuberculosis CysK1 is the OAS/sulfide enzyme; other cysteine synthase names need separate
      substrate checks.
    supporting_text: CysK1, a bona fide PLP-dependent O-acetylserine sulfhydrylase encoded by the gene rv2334,
      which converts O-acetylserine and sulfide to Cys
    reference_section_type: DISCUSSION
- id: PMID:42278617
  title: 'Serine Acetyltransferase from Pseudomonas aeruginosa: Distinctive Features, Pleiotropic Roles, and
    Therapeutic Potential.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full PAO1 biochemical and deletion study inspected. PA3816 is the directly studied CysE.
      Its absent measurable functional coupling to CysK argues against requiring an enterobacterial-style cysteine
      synthase complex universally.
  findings:
  - statement: PAO1 CysE and CysK do not show the measured reciprocal activity coupling expected from a canonical
      CSC.
    supporting_text: PaCysE did not measurably affect PaCysK activity, nor was its own activity significantly
      altered by PaCysK.
    reference_section_type: RESULTS
- id: PMID:41676964
  title: Distinct contributions of O-acetylserine sulfhydrylases to cysteine biosynthesis in Pseudomonas aeruginosa.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full PAO1 enzyme/LC-MS and native-deletion study inspected. Supports complementary sulfide/thiosulfate
      preferences and a measured failure of endogenous CysE peptide interaction. Chemical products, not just
      donor names, determine route membership.
  findings:
  - statement: PaCysM favors thiosulfate, while PaCysK is adapted to sulfide; this is a preference rather than
      absolute exclusivity.
    supporting_text: PaCysK primarily supports sulfide‐dependent cysteine biosynthesis, whereas PaCysM is specialized for thiosulfate utilization, consistent with their distinct catalytic properties.
    reference_section_type: RESULTS
- id: PMID:41541697
  title: 'De novo cysteine biosynthesis in Pseudomonas aeruginosa: Characterization of the two main cysteine
    synthase isoforms.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Independent full PAO1 CysK/CysM study inspected. Identifies PA2709 and PA0932, distinguishes
      OAS from OPS routes, and describes S-sulfocysteine as the direct thiosulfate product.
  findings:
  - statement: The thiosulfate branch requires an additional reduction after sulfocysteine formation.
    supporting_text: S-sulfocysteine can subsequently be converted to cysteine by the action of glutaredoxins.
    reference_section_type: RESULTS
- id: PMID:10482527
  title: Pathways of assimilative sulfur metabolism in Pseudomonas putida.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full sulfur-assimilation study inspected. P. putida experiments use S-313; extract activity
      supports an organism-level OAS route but cannot identify exact KT2440 Q88E95/Q88MC0 contributions.
  findings:
  - statement: The study compares P. putida S-313 with P. aeruginosa PAO1, not KT2440.
    supporting_text: Cysteine and methionine biosynthesis was studied in Pseudomonas putida S-313 and Pseudomonas
      aeruginosa PAO1.
    reference_section_type: RESULTS
