decisions:
  ECOLI/cysM: Merged the two chemically identical S-sulfo-L-cysteine synthase proposals into one. The
    fuller mechanistic justification is retained. The support union retains the curated target reaction
    and PMID22607201; two differently wrapped copies of the same UniProt sentence count as one evidence
    item. No annotation row was removed or changed.
  ECOLI/cysK: 'Retained the existing NEW GO:0170054 row and its direct purified-protein support [PMID:22333533,
    "Equimolar mixtures of CysK-His 6 and CdiA-CT were able to cleave purified tRNA"]. Removed only the
    toxin-activation core entry: the evidence shows exploitation of a recipient biosynthetic protein,
    not a selected beneficial function of recipient CysK. This does not deny molecular activation or convert
    the NEW row to a different action. The matched UniProt strain quote is explicitly CC:FUNCTION. The
    activator role is not RNase catalysis or a broad CDI process, and prior GOA absence is not labeled
    an oversight solely from omission.'
  MYCTU/cysM: Reassessed both GO:0004124 rows against projects/ENZYME_SPECIFICITY.md and changed UNDECIDED
    to MARK_AS_OVER_ANNOTATED. The decision concerns an unsupported functional assignment, not absence
    of every residual catalytic event. PMID18842002 measures OAS first-half intermediate formation; it
    does not establish weak complete OAS/free-sulfide turnover. The full primary PMID18799456 result remains
    [PMID:18799456, "unable to detect any cysteine as reaction product using OAS as substrate and sodium
    sulfide as sulfur donor"], with the previously recorded construct and detection-limit boundaries.
    Its discussion also judges the minor OAS behavior unlikely to matter metabolically. PMID17567578 independently
    characterizes the dedicated OAS enzyme CysK1. The preferred OPS/CysO reaction, demonstrated OPS/free-sulfide
    endpoint, and early OAS/CysO/Mec+ route remain distinct. No quantitative complete-reaction cutoff,
    proven evolutionary loss, or zero native turnover is asserted. Positive E. coli/PAO1 PAINT seed evidence
    is not invalidated.
  BACSU/cysK: 'Verified the full publisher Results again for PMID17056751 (DOI:10.1128/JB.01273-06): both
    the canonical serine/homocysteine assay and the OAS variant were negative for purified CysK. The exact
    frozen source row is UniProtKB:P37887, GO:0004122, IDA/ECO:0000314, PMID:17056751, assigned_by CAFA,
    date 20170124. Added a CONFIRMED MISSING_NEGATION source defect to that existing REMOVE decision,
    asking CAFA to withdraw the positive assertion and check an experimentally scoped NOT row. Attribution
    was read from GOA only to identify the upstream record; biological support is the primary result,
    not the GOA file. No source file or annotation payload was edited, and no external report was sent.'
  PSEPK/cysK: Removed the provider sentence that merely repeats the UniProt name/EC label from the GO:0004124
    ACCEPT support. Added the already inspected NCBIfam TIGR01139 CysK assignment beside the RuleBase-backed
    catalytic reaction. The provider file remains byte-identical and its reference assessment now distinguishes
    label repetition from independent evidence. Target-specific experimental and strain limitations remain
    unchanged.
