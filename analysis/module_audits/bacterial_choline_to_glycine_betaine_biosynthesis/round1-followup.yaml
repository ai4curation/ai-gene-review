  notes:
    BACSU/gbsA: 'Replaced the reused substrate/cofactor quote on metal binding with the actual salt-stimulation
      statement. Cytoplasmic inference now cites soluble recombinant GbsA recovery plus native precursor conversion;
      GbsB-family evidence is removed from GbsA claims. Detoxification uses the precursor-toxicity evidence.
      The three additional aminoaldehyde IBA activities remain UNDECIDED after independent examination: the
      paper tested propionaldehyde, pivalaldehyde, isovaleraldehyde, acetaldehyde and benzaldehyde (0.5 or
      50 mM), not aminobutyraldehyde, trimethylammoniobutyraldehyde or guanidinobutyraldehyde. The author specificity
      statement is limited by that panel. No target-negative assay, loss, erroneous PAINT node placement or
      absent pathway is inferred. Molecular catalytic capacity is distinct from physiological pathway participation;
      UNDECIDED also covers genuine unresolved biology after accessible research.'
    BACSU/gbsB: Replaced irrelevant GbsA support on GbsB core/process/location claims with the actual gbsB
      deletion precursor-rescue and radiolabeled-conversion passages, and the primary soluble-family statement.
      The reviewer suggested a GbsA homodimer quote for GbsB location; that would repeat the gene mismatch
      and is deliberately not used. Cytoplasmic localization remains an inference, not direct imaging. The
      metal uncertainty now quotes the primary sequence comparison and its explicit uncertainty. The description
      states the biology, while cofactor-evidence limits remain in review reasons and gaps.
    BACSU/opuBA: Replaced the duplicated summary for complex membership with a subunit-specific summary; complex
      architecture and ATPase/contributes_to assignments remain supported.
    BACSU/opuBB: 'Retain GO0055085 as ACCEPT alongside choline transport: cargo transport GO0015871 is not
      an is_a/part_of descendant of membrane-crossing GO0055085. No suitable choline-specific transmembrane-transport
      BP was found. The choline-specific MF and membrane-subunit contribution remain separate. Summaries now
      state component roles rather than repeat reasons.'
    BACSU/opuBC: 'Retain GO0055085 as ACCEPT: OpuBC contributes substrate capture to membrane import, while
      choline transport records cargo. GO0015871 is not a descendant of GO0055085 and GO0015220 is MF, not
      a BP substitute. The ligand-binding and transporter-contribution summaries are distinct from their detailed
      evidence.'
    BACSU/opuBD: Retain GO0055085 as ACCEPT alongside cargo transport, consistently with BetT and the other
      OpuB subunits. GO0015871 is not a membrane-crossing descendant; no suitable choline-specific transmembrane
      BP exists in the checked ontology. The choline-specific MF and membrane-subunit contribution remain precise.
      Summaries no longer duplicate their reasons.
    ECOLI/betT: Current QuickGO ancestry confirms the existing ACCEPT decision for GO0055085. Choline transport
      is a separate cargo process, and the search found no appropriate choline-specific transmembrane-transport
      BP descendant. GO0015220 remains the specific MF. OpuB reviews are brought into the same interpretation.
    ECOLI/betA: The PMID3512525 finding now states the older crude-membrane dual-substrate observation rather
      than omitting its second reaction. A finding_review marks attribution of that second reaction to BetA
      DISPUTED and links PMID39510372 purified-enzyme evidence. OVERTURNED would exceed the accessible strain/assay
      comparison; the original observation and separate soluble BetB NAD kinetics remain distinct. Added the
      missing ontology question for hypothetical acceptor-linked betaine-aldehyde oxidation, without asserting
      this unresolved BetA capability.
    ARTGO/codA: The second oxidation now uses proposed_molecular_function and a supported top-level proposed
      term for betaine-aldehyde:oxygen oxidoreductase activity; the broad original oxidoreductase row refines
      to GO0033713 plus the matching NTR. GO0004031 remains the proposed parent, not a substrate-specific core
      assertion. A GOC source_defect requests clarification of the first-reaction GO definition versus broader
      EC mapping and a precise second-reaction term. The broad term is chemically compatible irrespective of
      AOX family usage; the issue is specificity, not a claim that CodA belongs to the wrong chemical class.
      The module uses an identifier-free named function and the oracle requires the proposed core plus independent
      primary sources.
  no_annotation_payload_changes: true
  literature: No refresh. Exact scoped excerpts from cached author PDFs and new official ontology evidence.
