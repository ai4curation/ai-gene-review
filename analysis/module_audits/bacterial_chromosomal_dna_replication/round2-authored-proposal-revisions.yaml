- review_path: genes/PSEPK/holD/holD-ai-review.yaml
  original_row_index: 2
  initial_authored_row:
    term:
      id: GO:0006260
      label: DNA replication
    evidence_type: IC
    original_reference_id: PMID:21955458
    review:
      action: NEW
      summary: The psi accessory component contributes physical organization of the replicative clamp
        loader.
      reason: HolD participates by assembling and stabilizing the chi-containing loader accessory unit,
        rather than merely being required for growth or being a substrate. The KT2440 clone-to-locus mapping
        and direct chi–psi complex characterization combine with Pseudomonas loader reconstitution to
        support that role. Current GO0006260 concerns duplication of DNA and its parents are nucleic-acid
        metabolic processes; this physical replisome component executes work in that process. Same-role
        accessory/structural loader comparators E. coli HolA/P28630, HolB/P28631 and HolC/P28905 each
        carry replication annotations in current QuickGO; this is a convention check, not biological evidence.
        No existing BP row or redundant BP ancestor/descendant is proposed, and Q88Q02 has no cached GO-CAM
        entry. No KT2440 knockout-essentiality, chromosome-firing regulation or activity of the untested
        N-terminal extension is asserted.
      supported_by:
      - reference_id: file:PSEPK/holC/holC-source-analysis/README.md
        supporting_text: The psi primers map PP_0696, AAN66321.1, Q88Q02, not neighboring PP_0978.
      - reference_id: PMID:21955458
        supporting_text: The holC and holD genes of P. putida were amplified by PCR from genomic DNA of
          P. putida strain KT2440
      - reference_id: PMID:16210315
        supporting_text: 'aeruginosa chiPsi increased the specific activity of tau(3)deltadelta'' 25-fold

          and enabled the holoenzyme to function under physiological salt conditions.'
