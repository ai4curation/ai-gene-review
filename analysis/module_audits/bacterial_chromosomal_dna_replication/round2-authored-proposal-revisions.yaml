- review_path: genes/BACSU/dnaB/dnaB-ai-review.yaml
  original_row_index: 8
  initial_authored_row:
    term:
      id: GO:0003677
      label: DNA binding
    evidence_type: IDA
    original_reference_id: PMID:20071750
    review:
      action: NEW
      summary: Add the directly demonstrated DNA-engagement function.
      reason: The protein itself binds the DNA substrate and organizes initiation machinery. This is direct
        molecular participation, not a process assertion based only on essentiality. The original seed
        lacks this claim.
      supported_by:
      - reference_id: PMID:20071750
        supporting_text: We show that DnaB has two separate ssDNA-binding sites one located within residues
          1-300 and another between residues 365-428, and a dsDNA-binding site within residues 365-428.
