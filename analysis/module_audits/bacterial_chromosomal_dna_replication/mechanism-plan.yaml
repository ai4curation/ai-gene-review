boundary: DnaA-initiated bacterial chromosomal DNA duplication through synthesis, RNA-primer replacement,
  nick sealing and daughter-DNA unlinking. Bacteria scope describes a reusable mechanism, not universal
  possession of each named enzyme or one required molecular implementation.
corrections_to_initial_model:
- Do not omit RNA-primer processing/gap filling while retaining ligation and claiming completed duplication.
- Do not require an independent epsilon subunit for intrinsic-proofreading polymerases.
- Do not confuse BACSU DnaC helicase with ECOLI DnaC loader, or BACSU DnaB accessory with ECOLI DnaB helicase.
- Do not require HolC/HolD for every minimal DnaX/HolA/HolB clamp loader.
- Do not use DnaE2 repair polymerase to satisfy the essential replicative-polymerase role.
- Do not read purified rolling-circle/restart reconstitution as origin initiation or complete native-chromosome
  duplication.
