conditional_context:
- Tus/Rtp fork traps constrain convergence in some lineages but are not universal requirements for completion.
- Chromosome dimer resolution is conditional on dimer formation; segregation machinery and chromosome
  organization are adjacent processes.
- Restart, lesion bypass and repair polymerases are conditional recovery mechanisms, not substitutes for
  the ordinary replicative polymerase.
capacity_controls:
- Missing loader must fail origin-dependent root capacity despite a complete elongation core.
- DnaE2 plus polymerase MF cannot discharge replicative DnaE1/PolC identity.
- DnaE alone cannot discharge the BACSU PolC/DnaE synthesis mechanism.
- PHP domain alone cannot discharge proofreading when target catalytic residues/activity are unresolved.
- DnaX alone and incomplete clamp-loader complexes must fail clamp loading.
- Missing primer removal or gap filling must fail complete mature-DNA capacity even with LigA.
- Single GyrA/GyrB or ParC/ParE components cannot discharge assembled topoisomerase activity.
- No current DciA accession match means no falsely positive full PSEPK native-root claim.
not_yet_proven:
- PolC/DnaE1 additional cross-clade exemplar remains outside the sampled panel
- Native dominant BACSU gap-filling actor
- External review and actual merge
