judgments:
  holD: Structured WRONG_START_SITE/CONFIRMED captures the literature/model and construct-coordinate discrepancy;
    reviewed_segment 32-291 is the GST-fusion insert. The literature-selected native start predicts positions
    31-291 with initiator Met. The UNIPROT correction query is PROBABLE; no new native N-terminal sequencing
    or exclusion of alternative initiation is claimed.
  mapping_resources: Three direct InterPro2GO rows have INTERPRO defects. Five combined GO_REF:0000120 rows
    assigned by UniProt have UNIPROT defects naming exact InterPro/EC/UniRule inputs; no entire combined assertion
    is attributed to a single unverified mapping.
  bare_binding: Four formerly UNDECIDED rows become REMOVE because GO0005515 is uninformative, not because
    interactions are disproved. All six DnaC-DnaI partner rows are consistent.
  protected_NEW_specificity: Historical HolD GO0006260 and DnaB GO0003677 proposals remain unchanged; specific
    core activities/processes describe supported biology without redundant descendant NEW rows.
  epsilon: GO0008408 machine rows refine to GO0008296; DNA proofreading is supported, with target Ecoli biochemistry
    and explicitly comparative Pseudomonas evidence. The ancestral generic exonuclease claim is not alleged
    false.
  DnaB_location: Full PMID20071750 fractionation evidence differentiates soluble and membrane-associated pools;
    membrane association does not establish integral topology.
