- id: dnai_dnab_functional_loading
  planned_role: helicase loading
  evidence_scope: DIRECT_PRIMARY
  taxon_or_construct_scope: B. subtilis DnaI/DnaB/DnaC biochemical study
  integration_limit: Abstract accessible. This establishes functional loading; combine with native-origin
