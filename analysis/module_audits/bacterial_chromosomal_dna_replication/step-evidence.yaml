catalogue_status: READY_FOR_INTEGRATION
module_id: MODULE:bacterial_chromosomal_dna_replication
boundary: DnaA-initiated bacterial chromosomal DNA duplication through synthesis, RNA-primer replacement,
  nick sealing and daughter-DNA unlinking. Bacteria scope describes a reusable mechanism, not universal
  possession of each named enzyme or one required molecular implementation.
usage: references are copy-ready module-reference entries; evidence_items[].evidence are schema-shaped
  EvidenceItems. planned_role maps to mechanism-plan.yaml; attach each item at the relevant leaf/variant/connection.
  integration_limit is curator context, not a positive annotation.
references:
- id: PMID:42133467
  title: Mechanisms of chromosomal DNA replication in Escherichia coli and Bacillus subtilis.
  findings:
  - statement: ATP-bound DnaA promotes origin strand opening with nucleoid-associated factors in the two
      model bacteria.
    supporting_text: together with nucleoid-associated proteins, recognizes and “melts” parental DNA strands
      at oriC to initiate DNA replication
  - statement: The Bacillus DnaC helicase encircles single-stranded DNA and unwinds the fork with 5-prime
      to 3-prime polarity.
    supporting_text: Once released from DnaI, DnaC encircles ssDNA and unwinds forked DNA with 5'→3' polarity
  - statement: Bacillus PolC contains polymerase and proofreading exonuclease activities in one polypeptide.
    supporting_text: PolC is a bifunctional enzyme that contains a 5'→ 3' polymerase domain and a DEDDh-family
      3'→ 5' proofreading exonuclease domain within a single polypeptide
  - statement: The Bacillus DnaX/HolA/HolB complex loads DnaN clamps in an ATP-dependent reaction.
    supporting_text: The CLC additionally interacts with and loads two ring-shaped DnaN sliding-clamps
      onto each complementary strand at oriC in an ATP-dependent manner
  - statement: DnaN binding increases polymerase processivity and synthesis rate.
    supporting_text: DnaE/α interacts with DnaN/β via the CBM, increasing the processivity and rate of
      DNA synthesis by the Pol III HE
  - statement: Full-length tau couples the leading-strand polymerase to the helicase.
    supporting_text: the leading-strand Pol III core enzyme is physically linked to DnaB through DnaX/τ
      interactions
  - statement: Okazaki-fragment maturation requires RNA-primer removal before the fragments form a continuous
      DNA strand.
    supporting_text: Okazaki fragment maturation involves highly coordinated reactions that remove RNA
      primers and convert the discrete fragments into a continuous lagging strand.
  - statement: The dominant polymerase filling gaps after Bacillus primer removal remains unresolved;
      PolC is a proposal.
    supporting_text: After primer removal, the DNAP responsible for gap filling remains poorly defined,
      as PolA is a mutagenic enzyme
  - statement: Gyrase relieves positive torsion that would otherwise prevent fork progression.
    supporting_text: Topo II/GyrAB), which introduces (−) and relieves (+) supercoiling ahead of the RF
  - statement: Tus/Rtp fork traps are lineage-restricted and not universally required to finish replication.
    supporting_text: mutants lacking RTP, Tus, or ter sites show little phenotype and complete replication
      normally
  - statement: Specialized recombination machinery resolves chromosomal dimers when they form.
    supporting_text: XerCD, which binds the 28-bp dif site to resolve chromosomal dimers
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full comparative text inspected. Strong boundary and step-level synthesis for E. coli/B.
      subtilis; not universal native-protein requirements. Explicitly distinguishes DnaC/DnaB nomenclature,
      PolC/DnaE3 and immature versus mature DNA. Its proposed PolC gap filling is not an established native
      assignment. Dimer resolution/fork traps remain conditional.
- id: PMID:19968790
  title: Ordered association of helicase loader proteins with the Bacillus subtilis origin of replication
    in vivo.
  findings:
  - statement: Bacillus origin recruitment proceeds through ordered DnaA, DnaD and DnaB association followed
      by DnaI-mediated helicase loading.
    supporting_text: 'We found that there was

      a clear order of stable association with oriC; DnaA, DnaD, DnaB, and finally

      DnaI-mediated loading of helicase.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text available. Native oriC association evidence, distinct from a synthetic-fork
      restart reconstitution.
- id: PMID:37093985
  title: The DNA replication initiation protein DnaD recognises a specific strand of the Bacillus subtilis
    chromosome origin.
  findings:
  - statement: DnaD recognizes an oriC single-stranded element as part of the Bacillus loading architecture.
    supporting_text: 'Biochemical and genetic data support the model that DnaD recognizes a new

      single-stranded DNA (ssDNA) motif located in oriC, the DnaD Recognition Element

      (DRE).'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text available. Strand-specific recognition is demonstrated; precise recruitment/orientation
      mechanism remains a model.
- id: PMID:12718886
  title: A two-protein strategy for the functional loading of a cellular replicative DNA helicase.
  findings:
  - statement: Bacillus DnaI and DnaB cooperate in functional delivery of the DnaC helicase onto DNA.
    supporting_text: 'We show that DnaI and DnaB interact physically and functionally

      with the DnaC helicase and mediate its functional delivery onto DNA.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only; restrict the assessment to explicit abstract results. Abstract
      accessible. This establishes functional loading; combine with native-origin evidence rather than
      calling this an oriC reconstitution.
- id: PMID:23562643
  title: The bacterial DnaC helicase loader is a DnaB ring breaker.
  findings:
  - statement: E. coli DnaC opens the DnaB ring and can load it onto DNA.
    supporting_text: 'the DnaC isolated

      helicase-binding domain can both load DnaB onto DNA and increase the efficiency

      by which the helicase acts on substrates in vitro.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text available. The isolated-domain experiment does not establish that all
      native loading regulation is ATP-independent.
- id: PMID:30797687
  title: Physical Basis for the Loading of a Bacterial Replicative Helicase onto DNA.
  findings:
  - statement: DnaC ATP hydrolysis after DNA binding permits closure of the helicase into a primase-compatible
      state.
    supporting_text: 'Upon binding DNA, DnaC hydrolyzes ATP, allowing DnaB to

      isomerize into a topologically closed, pre-translocation state competent to bind

      primase.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text available. Distinguish the loader ATPase from the helicase ATPase;
      BACSU dnaC is the helicase, not this loader.
- id: PMID:36877032
  title: Diverse Mechanisms of Helicase Loading during DNA Replication Initiation in Bacteria.
  findings:
  - statement: A non-ATPase DciA implementation provides an alternative to DnaC/DnaI-type loading.
    supporting_text: 'DciA is

      not an ATPase, and yet it serves as a helicase operator, providing a function

      analogous to that of DnaC and DnaI across diverse bacterial species.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only; restrict the assessment to explicit abstract results. Do not infer
      an exact Pseudomonas accession from this review or make DnaC/DnaI universal.
- id: PMID:27830752
  title: DciA is an ancestral replicative helicase operator essential for bacterial replication initiation.
  findings:
  - statement: P. aeruginosa DciA is implicated in replicative-helicase operation during initiation.
    supporting_text: 'We validate this

      hypothesis by establishing in Pseudomonas aeruginosa that DciA possesses the

      attributes of the replicative helicase-operating proteins associated with

      replication initiation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text available. The current PAO1/KT2440 exact-accession mapping remains
      unresolved; this item is not a positive accession selector.
- id: PMID:42927770
  title: Structural basis of DnaB ring opening by the ancestral helicase loader DciA.
  findings:
  - statement: Vibrio DciA promotes topological helicase loading; the intact protein is more effective
      than its isolated domains.
    supporting_text: Under these conditions, full-length DciA supported efficient duplex unwinding, whereas
      the isolated C-terminal fragment was completely inactive
  - statement: DciA stabilizes an open DnaB hexamer, providing a structural mechanism for DNA loading.
    supporting_text: 'A 3.5 Å cryo-EM structure reveals a DnaB6·DciA3

      complex in which DciA binds the periphery of the helicase and stabilizes a

      right-handed open-helical conformation with a single cracked interface.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached article plus unchanged official JATS metadata and RCSB deposit inspected.
      PDB9TZF cites this PMID; DciA entity2 exactly matches Q9KPH3/VC_2395,157aa and DnaB entity1 matches
      Q9KUY7/VC_0371,468aa, both taxon243277/N16961. Methods use cleavable fusion tags. The full-length
      loading assay and ring-open structure ground an active DciA alternative; they do not resolve PAO1/KT2440
      accession identity or reconstitute oriC firing.
- id: PMID:21955458
  title: Characterization of the χψ subcomplex of Pseudomonas aeruginosa DNA polymerase III.
  findings:
  - statement: SSB protects exposed single-stranded DNA during replication and links it to the clamp-loader
      accessory complex.
    supporting_text: 'During replication, single-stranded

      DNA-binding protein (SSB) coats and protects single-stranded DNA (ssDNA) and

      also interacts with the χψ heterodimer'
  - statement: The KT2440 chi/psi complex has DNA-binding activity that can support an SSB-DNA-associated
      accessory role.
    supporting_text: We also observed DNA-binding activity for P. putida χψ
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text and existing PSEPK source-analysis consulted. Direct KT2440 chi/psi
      binding is distinguished from P. aeruginosa stimulation/domain dissection. PP_0696/Q88Q02 is the
      supported KT2440 psi locus; cloned sequence covers database residues32–291 and the proposed native
      start differs from the older291-aa model. No independent loader catalysis assigned to HolC/HolD.
- id: PMID:30945375
  title: A structural view of bacterial DNA replication.
  findings:
  - statement: DnaG primase produces RNA primers while interacting with the replicative helicase.
    supporting_text: 'DnaB binds the DnaG primase that synthesizes RNA

      primers on both strands.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only; restrict the assessment to explicit abstract results. Do not infer
      BACSU DnaE primer extension from this DnaG statement.
- id: PMID:20122408
  title: Reconstitution of the B. subtilis replisome with 13 proteins including two distinct replicases.
  findings:
  - statement: Both PolC and DnaE are required for the purified Bacillus fork system; DnaE extends RNA
      primers before transfer to PolC.
    supporting_text: 'adding a

      stretch of deoxynucleotides to the RNA primer before handoff to PolC.'
  - statement: PolC supports leading-strand synthesis in the reconstitution, while lagging-strand synthesis
      additionally requires DnaG and DnaE.
    supporting_text: 'Leading strand synthesis requires PolC plus ten

      proteins; lagging strand synthesis additionally requires primase and DnaE.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached publication is abstract-only; earlier BACSU source analysis inspected the author-hosted
      full text and native168 preparations. The exact quoted findings are in the cached abstract. The
      thirteen-protein 5-prime-flap minicircle system is a restart-like elongation reconstitution, not
      DnaA/oriC initiation, primer maturation, ligation, topological completion or a native full chromosome.
- id: PMID:28878042
  title: Interactions of the Bacillus subtilis DnaE polymerase with replisomal proteins modulate its activity
    and fidelity.
  findings:
  - statement: PolC exonuclease can correct errors introduced by DnaE in the biochemical complex.
    supporting_text: 'its errors are

      proofread by the 3'' > 5'' exonuclease activity of PolC in a stable

      template-DnaE-PolC complex.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text available. Does not confer intrinsic exonuclease activity on DnaE itself.
- id: PMID:25894501
  title: DNA replication fidelity in Mycobacterium tuberculosis is mediated by an ancestral prokaryotic
    proofreader.
  findings:
  - statement: M. tuberculosis DnaE1 has PHP-dependent DNA 3-prime to 5-prime exonuclease activity.
    supporting_text: Wild-type DnaE1MTB shows clear 3′-5′ exonuclease activity
  - statement: The intrinsic DnaE1 exonuclease can correct a terminal mismatch before DNA extension.
    supporting_text: These data demonstrate that DnaE1MTB encodes an intrinsic 3′-5′ exonuclease activity
      that, at least in vitro, is capable of correcting mismatches.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected. Purified Rv1547/H37Rv DnaE1 supports intrinsic PHP proofreading.
      M. smegmatis experiments supply the large mutation-rate phenotype; do not transfer that number to
      H37Rv. Later PMID39141351 establishes additional noncanonical DnaQ contributions, so PHP is not
      asserted to be the sole mycobacterial proofreader.
- id: PMID:39141351
  title: An additional proofreader contributes to DNA replication fidelity in mycobacteria.
  findings:
  - statement: Noncanonical mycobacterial DnaQ provides additional proofreading alongside PHP.
    supporting_text: 'mycobacterial DnaQ binds to the β

      clamp and functions synergistically with the PHP domain proofreader to correct

      replication errors.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only primary study. Supports noncanonical DnaQ/PHP co-proofreading and main
      M. smegmatis mutation-accumulation results; M. tuberculosis variant associations are a separate
      evidence stream. No full methods-level mapping or numerical transfer is inferred.
- id: PMID:41728957
  title: Diversity and distribution of bacterial DNA polymerases.
  findings:
  - statement: Three major replicative catalytic-subunit configurations are DnaE1 alone, PolC with DnaE1,
      and PolC with DnaE3.
    supporting_text: (i) DnaE1-only, (ii) PolC + DnaE1, and (iii) PolC + DnaE3
  - statement: DnaE1 and PolC family membership does not ensure an active PHP proofreader.
    supporting_text: Different fractions of inactivated PHP proofreaders are present in all four major
      C-family groups (DnaE1–3 and PolC).
  - statement: DnaE2 is an error-prone accessory polymerase rather than a substitute for the ordinary
      replicative catalytic subunit.
    supporting_text: DnaE2 polymerases, with few exceptions, have inactivated PHP domains, as they represent
      non-essential SOS-inducible TLS polymerases
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary comparative-computational survey inspected. Polymerase combinations, phylogenetic
      distribution and motif status are sequence/structure inferences, not activity assays for every protein.
      Distinguish PolC-DnaE1 from PolC-DnaE3; unidentified noncanonical proofreaders are not absent proofreading.
- id: PMID:15611049
  title: Reconstitution of a minimal DNA replicase from Pseudomonas aeruginosa and stimulation by non-cognate
    auxiliary factors.
  findings:
  - statement: A Pseudomonas minimal replicase supports efficient primer elongation with alpha-epsilon,
      beta clamp and tau3-delta-delta-prime.
    supporting_text: 'Efficient primer elongation

      requires the presence of alphaepsilon, beta, and tau(3)deltadelta''.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only; restrict the assessment to explicit abstract results. Functional
      support for a minimal loader-containing system, not a full native chromosome cycle or proof that
      HolC/HolD never matter physiologically.
- id: PMID:23525462
  title: Insights into the structure and assembly of the Bacillus subtilis clamp-loader complex and its
    interaction with the replicative helicase.
  findings:
  - statement: Mass spectrometry supports a heteropentameric Bacillus tau3-delta-delta-prime loader.
    supporting_text: 'a hetero-pentameric τ3-δ-δ'' Bacillus subtilis clamp-loader assembles via

      multiple pathways'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected. B. subtilis loader stoichiometry is directly measured.
      Helicase interaction experiments use Geobacillus stearothermophilus DnaB; do not rename that as
      BACSU DnaB accessory or an assayed BACSU DnaC construct.
- id: PMID:16210315
  title: Discovery and characterization of the cryptic psi subunit of the pseudomonad DNA replicase.
  findings:
  - statement: Cognate Pseudomonas chi/psi strongly stimulates the minimal loader and permits activity
      under physiological salt conditions.
    supporting_text: 'P.

      aeruginosa chiPsi increased the specific activity of tau(3)deltadelta'' 25-fold

      and enabled the holoenzyme to function under physiological salt conditions.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only; restrict the assessment to explicit abstract results. Accessory
      relative to a minimal biochemical loader does not mean biologically dispensable under every native
      condition; do not transfer this fold-change to KT2440.
- id: PMID:6262323
  title: Replication of phi X174 dna with purified enzymes. I. Conversion of viral DNA to a supercoiled,
    biologically active duplex.
  findings:
  - statement: E. coli Pol I fills a residual gap and replaces the RNA primer with DNA in a purified synthesis
      system.
    supporting_text: 'E. coli DNA polymerase I was needed to fill

      the short gap left by DNA polymerase III holoenzyme, and to remove the primer

      and replace it with DNA.'
  - statement: Ligase and gyrase are needed after PolI-mediated primer replacement to obtain the completed
      supercoiled viral duplex.
    supporting_text: 'Production of supercoiled RF required the further

      actions of E. coli DNA ligase and gyrase.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only; restrict the assessment to explicit abstract results. Functional
      maturation evidence; this is a model substrate, not direct native chromosomal oriC replication.
      Supports downstream sealing/topology in a model system, not a chromosome-specific native rate.
- id: PMID:30670546
  title: RNase HIII Is Important for Okazaki Fragment Processing in Bacillus subtilis.
  findings:
  - statement: RNase HIII and PolA support efficient processing of a linear model Okazaki fragment in
      vitro.
    supporting_text: 'RNase HIII and DNA polymerase I provide the primary pathway for

      Okazaki fragment maturation in vitro'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only primary source. The claimed primary RNaseHIII/PolA route is explicitly
      in vitro on a linear model substrate. Later FenA work and comparative synthesis qualify the hierarchy;
      do not require both alternatives or call this the sole native pathway.
- id: PMID:37146086
  title: Bacillus subtilis encodes a discrete flap endonuclease that cleaves RNA-DNA hybrids.
  findings:
  - statement: FenA efficiently cleaves RNA-DNA and flap substrates relevant to primer removal.
    supporting_text: 'FEN is far more active

      than Pol I on nicked double-flap, 5'' single flap, and nicked RNA-DNA hybrid

      substrates.'
  - statement: The study proposes a FenA-removal/PolA-extension model based on the biochemical and genetic
      results.
    supporting_text: 'we propose a model where cells remove RNA primers using FEN while upstream

      Okazaki fragments are extended through synthesis by Pol I.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected. Enzymes and strains derive from PY79, not a direct assay
      of every168 reference protein. FenA cleavage and PolA synthesis support a biochemical maturation
      mechanism. The proposed FenA/PolA physiological model is not proof of the dominant native gap-fill
      actor; retain the later review uncertainty.
- id: PMID:42286923
  title: Single-molecule tracking of RNA-DNA hybrid removal enzymes important for lagging-strand replication.
  findings:
  - statement: PolA, FenA and RNase HIII are mobile in living Bacillus cells; their localization behavior
      differs.
    supporting_text: 'We also find evidence that Pol I activity is

      modulated through interaction with the replisome, whereas FenA and RNase HIII

      are regulated through access to the nucleoid.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text available. Recruitment/dynamics evidence, not direct identification
      of which polymerase fills each physiological gap.
- id: PMID:11095673
  title: The NAD-dependent ligase encoded by yerG is an essential gene of Bacillus subtilis.
  findings:
  - statement: Bacillus YerG/LigA is the NAD-dependent ligase that supplies the essential ligase function
      in the tested backgrounds.
    supporting_text: 'whereas yoqV did not complement the ligts defects, yerG

      fully complemented the growth and UV sensitivity defects of the lig mutant.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only; restrict the assessment to explicit abstract results. Complementation/essentiality
      support; not a purified substrate-kinetic ligation assay, and no universal rule that ATP-dependent
      alternatives cannot exist.
- id: PMID:347446
  title: Purification of subunits of Escherichia coli DNA gyrase and reconstitution of enzymatic activity.
  findings:
  - statement: Recombined GyrA and GyrB subunits restore the intrinsic reactions of gyrase, including
      DNA supercoiling.
    supporting_text: 'The same ratio of subunits gives efficient reconstitution

      of the reactions intrinsic to DNA gyrase, including catalysis of supercoiling of

      closed duplex DNA'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only; restrict the assessment to explicit abstract results. Require
      both subunit roles. Do not assign assembled topoisomerase activity autonomously to GyrA or GyrB.
- id: PMID:8227000
  title: Escherichia coli topoisomerase IV. Purification, characterization, subunit structure, and subunit
    interactions.
  findings:
  - statement: Topoisomerase IV activity resides in a ParC2-ParE2 complex.
    supporting_text: 'the active form of Topo IV was a

      heterotetramer, ParC2ParE2.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only; restrict the assessment to explicit abstract results. Truncated
      forms were inactive. Require assembled activity rather than one subunit or a generic ATPase.
- id: PMID:8104339
  title: Decatenation activity of topoisomerase IV during oriC and pBR322 DNA replication in vitro.
  findings:
  - statement: TopoIV resolves linked daughter DNA in reconstituted oriC/pBR322 replication, whereas gyrase
      chiefly relieves positive supercoiling.
    supporting_text: 'These results suggest that during DNA replication, gyrase acts

      primarily to relieve accumulated positive supercoiling and Topo IV acts to

      segregate the daughter chromosomes.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract only; restrict the assessment to explicit abstract results. Do not conflate
      torsional relief and daughter-DNA unlinking or infer native completion solely from a plasmid-template
      assay.
- id: PMID:22206257
  title: Architecture and conservation of the bacterial DNA replication machinery, an underexploited drug
    target.
  findings:
  - statement: The older review distinguishes widespread core replication machinery from lineage-restricted
      modules.
    supporting_text: Other modules are restricted to particular phylogenetic groups and are likely therefore
      to have evolved more recently
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full older comparative review inspected. Useful architecture and historical reconstitution
      context. Do not import its universal epsilon/PolA list or loader-free speculation unchanged: later
      intrinsic-PHP, alternative primer-removal and DciA evidence qualifies these statements. RK2 oriV
      experiments do not prove Pseudomonas native chromosomal loading without DciA.'
