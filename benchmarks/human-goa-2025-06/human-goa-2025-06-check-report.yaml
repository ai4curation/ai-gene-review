  evidence:
  - 'FUNCTION: [Isoform 2]: Catalytically inactive when either DNA or nucleosomes are the substrate and
    does not possess chromatin-remodeling activity (PubMed:15310751, PubMed:28801535). Acts as a negative
    regulator of chromatin remodelers by generating inactive complexes (PubMed:15310751). {ECO:0000269|PubMed:15310751,
    ECO:0000269|PubMed:28801535}.'
  - 'SUBUNIT: [Isoform 2]: May form homodimers (PubMed:15310751). Component of the BPFT-SMARCA1 complex
    at least composed of SMARCA1, BPFT, RBBP4 and RBBP7; the complex is catalytically inactive and does
    not remodel chromatin (PubMed:15310751). Within the complex interacts with BPTF, RBBP4 and RBBP7 (PubMed:15310751).
    Component of the BAZ1A-1-SMARCA1 complex at least composed of SMARCA1 and BAZ1A; the complex is catalytically
    inactive and does not remodel chromatin (PubMed:28801535). Component of the BAZ1B-1-SMARCA1 complex
    at least composed of SMARCA1 and BAZ1B; the complex is catalytically inactive and does not remodel
    chromatin (PubMed:28801535). {ECO:0000269|PubMed:15310751, ECO:0000269|PubMed:28801535}.'
  - 'MISCELLANEOUS: [Isoform 2]: Inactive as an ATPase due to the presence of exon 13, but retains its
    ability to correctly fold and incorporate into complexes. {ECO:0000269|PubMed:15310751, ECO:0000269|PubMed:28801535}.'
