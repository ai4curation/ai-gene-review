description: Example time-split benchmark. Targets are experimental (CAFA evidence set) human annotations
  present in the 2026-08-05 GO release, absent with experimental evidence from the 2025-06-01 release,
  and resting on a paper published on or after 2025-06-01, so that the knowledge, not only its GO record,
  is new. Twenty proteins are sampled at random, plus up to four proteins that UniProt names or describes
  as catalytically inactive (pseudoenzymes) and gained annotations from a paper published since 2023-01-01
  (no human pseudoenzyme qualifies under the main 2025-06-01 floor in this release). NOT annotations are
  kept as negative targets, and each item has three decoy terms. The conditions compare a sequence-only
  blind read with organism, full-header and agent-review (combined reasoning) conditions, item by item.
