id: human-goa-2025-06
title: Human experimental GO annotations new since June 2025
created: '2026-11-25'
spec:
  id: human-goa-2025-06
  title: Human experimental GO annotations new since June 2025
  description: Example time-split benchmark. Targets are experimental (CAFA evidence set) human annotations
    present in the 2026-08-05 GO release, absent with experimental evidence from the 2025-06-01 release,
    and resting on a paper published on or after 2025-06-01, so that the knowledge, not only its GO record,
    is new. Twenty proteins are sampled at random, plus up to four proteins that UniProt names or describes
    as catalytically inactive (pseudoenzymes) and gained annotations from a paper published since 2023-01-01
    (no human pseudoenzyme qualifies under the main 2025-06-01 floor in this release). NOT annotations
    are kept as negative targets, and each item has three decoy terms. The conditions compare a sequence-only
    blind read with organism, full-header and agent-review (combined reasoning) conditions, item by item.
  taxon:
    id: NCBITaxon:9606
    label: Homo sapiens
    gaf_code: HUMAN
  cutoff_date: '2025-06-01'
  min_reference_date: '2025-06-01'
  baseline_release: '2025-06-01'
  current_release: '2026-08-05'
  evidence_codes:
  - EXP
  - IDA
  - IPI
  - IMP
  - IGI
  - IEP
  - TAS
  - IC
  include_negated: true
  max_proteins_per_reference: 20
  size: 24
  dev_fraction: 0.0
  seed: 20251
  mode: GOA_TIME_SPLIT
  near_duplicate_threshold: 0.8
  features:
  - feature: PSEUDOENZYME
    count: 4
    min_reference_date: '2023-01-01'
    uniprot_query: reviewed:true AND organism_id:9606 AND (protein_name:inactive OR protein_name:pseudokinase
      OR cc_function:pseudokinase OR cc_function:"catalytically inactive")
  decoys_per_item: 3
  conditions:
  - name: blind
    context: BLIND
    tool: peptalk
    task: ask-function
    model: claude-fable-5-2
    shuffle_control: true
    description: Sequence only (peptalk --context blind), the fs2f protocol.
  - name: organism
    context: ORGANISM
    tool: peptalk
    task: ask-function
    model: claude-fable-5-2
    description: Sequence plus organism and taxon id.
  - name: blind-opus
    context: BLIND
    tool: peptalk
    task: ask-function
    model: claude-opus-5-5
    model_training_cutoff: '2026-06-01'
    shuffle_control: true
    description: Sequence only, Opus 5.5.
  - name: organism-opus
    context: ORGANISM
    tool: peptalk
    task: ask-function
    model: claude-opus-5-5
    model_training_cutoff: '2026-06-01'
    description: Sequence plus organism and taxon id, Opus 5.5.
  - name: full
    context: FULL
    tool: peptalk
    task: ask-function
    model: claude-fable-5-2
    description: Sequence plus the full UniProt-style header (accession, name, gene).
  - name: agent-review
    context: AGENT_REVIEW
    tool: ai-gene-review review skill
    model: claude-opus-5-5
    model_training_cutoff: '2026-06-01'
    description: 'Combined reasoning: an ai-gene-review review of the gene seeded with the baseline-release
      GOA file from `benchmark export`, scored on the terms its kept rows and core functions entail.'
