# Shared by the independent validation and test jobs.
src:
  - 'src/**'
  - 'tests/**'
  - '.github/workflows/main.yaml'
  - '.github/ci-path-filters.yaml'
  - 'pyproject.toml'
  - 'uv.lock'
  # projects/ is here because tests/test_project_frontmatter.py
  # validates it. Without this the check can only ever fire on a PR
  # that also touches src/, which project-doc PRs do not -- so it
  # was structurally unable to catch what it exists to catch, and a
  # doc with four out-of-vocabulary tags merged green.
  - 'projects/**'
# The agentic-automation surface: workflow definitions, the central
# agent config, the composite actions, and the deterministic guard
# scripts. Cheap to check, and not otherwise covered when a PR only
# touches .github/.
agents:
  - '.github/ci-path-filters.yaml'
  - '.github/workflows/**'
  - '.github/actions/**'
  - '.github/scripts/**'
  - '.github/agent-config.yaml'
  - '.github/cron-profiles.yaml'
  - 'scripts/auto_merge_ready_prs.py'
  - 'scripts/retry_failed_reviews.py'
  - 'scripts/apply_cron_profile.py'
  - 'tests/js/**'
genes:
  - 'genes/**/*-ai-review.yaml'
predictions:
  - 'genes/**/*-predictions-review.yaml'
# BioReason/GO-GPT prediction sidecars: schema, term and GOA-support validation
# (validate-prediction-terms). The full source-evidence check would reject
# their own conventions, e.g. assessment/score pairs and unlisted sources.
bioreason_predictions:
  - 'genes/**/*-sft-predictions.yaml'
  - 'genes/**/*-gogpt-predictions.yaml'
  - 'genes/**/*-gogpt-leaf-predictions.yaml'
modules:
  - 'modules/**/*.yaml'
  - 'modules/**/*.yml'
# The curated dirs are here because the history layout test asserts
# every record's target.path exists on disk -- an invariant a
# gene/module/gocam/project rename or delete can break without
# touching history/ itself.
history:
  - 'history/**/*.yaml'
  - 'src/ai_gene_review/schema/history.yaml'
  - 'scripts/new_history.py'
  - 'scripts/backfill_history_from_prs.py'
  - 'tests/test_history_schema.py'
  - 'tests/test_backfill_history.py'
  - 'genes/**'
  - 'modules/**'
  - 'gocams/**'
  - 'projects/**'
families:
  - 'interpro/panther/**/*-review.yaml'
  # The member index (a build artifact) is the authority for
  # family_residue_validator's PANTHER_MEMBERSHIP check, so a change to
  # how it is built, or to its curated overrides, must re-validate.
  - 'src/ai_gene_review/etl/panther_families.py'
  - 'interpro/panther/panther-members-overrides.tsv'
# Anything that can change validation behaviour for ALL genes. If any of
# these change we cannot trust per-gene scoping, so we validate everything.
infra:
  # This includes the history schema, so editing it triggers full
  # validate-all it cannot affect. Do NOT "fix" that with a leading-!
  # entry: dorny/paths-filter compiles each pattern independently
  # (picomatch) and combines them with some(), so a negated pattern
  # matches every OTHER path and turns the filter on for every PR.
  # Real exclusions need predicate-quantifier: every, which would
  # change the semantics of all the multi-pattern filters above.
  - 'src/ai_gene_review/schema/**'
  - 'src/ai_gene_review/validation/**'
  - 'src/ai_gene_review/cli.py'
  - 'src/ai_gene_review/tools/validate_pmid_references.py'
  - 'conf/**'
  - 'scripts/run_term_validator.sh'
  - 'scripts/run_reference_validator.sh'
  - 'justfile'
  - 'project.justfile'
