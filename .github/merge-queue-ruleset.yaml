# Apply only after the merge_group workflow and queue-aware shepherd reach main.
# This adds a queue requirement; existing approval/check protection stays in place.
name: merge-queue-main
target: branch
enforcement: active
bypass_actors: []
conditions:
  ref_name:
    include: [refs/heads/main]
    exclude: []
rules:
  - type: merge_queue
    parameters:
      check_response_timeout_minutes: 360
      grouping_strategy: ALLGREEN
      max_entries_to_build: 1
      max_entries_to_merge: 1
      merge_method: SQUASH
      min_entries_to_merge: 1
      min_entries_to_merge_wait_minutes: 0
