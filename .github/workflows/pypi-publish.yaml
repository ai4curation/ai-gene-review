name: Publish Python Package

on:
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build-n-publish:
    name: Build and publish Python 🐍 distributions 📦 to PyPI
    # aigr-benchmark-v* releases publish packages/aigr-benchmark instead
    # (aigr-benchmark-publish.yaml).
    if: ${{ !startsWith(github.ref_name, 'aigr-benchmark-v') }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync

      - name: Build source and wheel archives
        run: uv build

      # ai-gene-review depends on aigr-benchmark (packages/aigr-benchmark). The
      # wheel's requirements must resolve from PyPI alone, without the workspace,
      # so a release made before aigr-benchmark is on PyPI fails here.
      - name: Check the wheel's requirements resolve from PyPI
        run: |
          uv venv /tmp/resolve-check
          uv pip install --dry-run --python /tmp/resolve-check dist/ai_gene_review-*.whl

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true