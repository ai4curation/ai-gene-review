# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  # Weekly full re-validation safety net: per-PR scoping can miss breakage caused by
  # upstream ontology drift (e.g. a GO term becoming obsolete), so validate everything
  # once a week and on manual dispatch.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

env:
  FORCE_COLOR: "1" # Make tools pretty.

#permissions: {}

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:

      # Ontology SQLite DBs (GO, CHEBI, ...) are large; free space before downloads.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check for source changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          list-files: shell
          filters: |
            src:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              # projects/ is here because tests/test_project_frontmatter.py
              # validates it. Without this the check can only ever fire on a PR
              # that also touches src/, which project-doc PRs do not -- so it
              # was structurally unable to catch what it exists to catch, and a
              # doc with four out-of-vocabulary tags merged green.
              - 'projects/**'
            # The agentic-automation surface: workflow definitions, the central
            # agent config, the composite actions, and the deterministic guard
            # scripts. Cheap to check, and not otherwise covered when a PR only
            # touches .github/.
            agents:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
              - '.github/agent-config.yaml'
              - '.github/cron-profiles.yaml'
              - 'scripts/auto_merge_ready_prs.py'
              - 'scripts/apply_cron_profile.py'
              - 'tests/js/**'
            genes:
              - 'genes/**/*-ai-review.yaml'
            modules:
              - 'modules/**/*.yaml'
              - 'modules/**/*.yml'
            families:
              - 'interpro/panther/**/*-review.yaml'
            # Anything that can change validation behaviour for ALL genes. If any of
            # these change we cannot trust per-gene scoping, so we validate everything.
            infra:
              - 'src/ai_gene_review/schema/**'
              - 'src/ai_gene_review/validation/**'
              - 'src/ai_gene_review/cli.py'
              - 'src/ai_gene_review/tools/validate_pmid_references.py'
              - 'conf/**'
              - 'scripts/run_term_validator.sh'
              - 'scripts/run_reference_validator.sh'
              - 'justfile'
              - 'project.justfile'

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install project
        run: uv sync --dev

      # Cache the oaklib ontology SQLite DBs so term validation does not re-download
      # multi-GB GO/CHEBI/etc. every run. Weekly-rotating key keeps them reasonably fresh.
      - name: Compute ontology cache week
        id: ontoweek
        run: echo "week=$(date -u +%Y%U)" >> "$GITHUB_OUTPUT"

      - name: Cache ontology databases
        uses: actions/cache@v6
        with:
          path: ~/.data/oaklib
          key: oaklib-${{ runner.os }}-${{ steps.ontoweek.outputs.week }}
          restore-keys: |
            oaklib-${{ runner.os }}-

      # Residue validation resolves UniProt sequences. Caching them keeps
      # validate-families from depending on UniProt being reachable on every run,
      # which is what lets it stay scoped to gene changes as well as family ones.
      # Same weekly rotation as above; sequences change far less often than that.
      - name: Cache UniProt sequences
        uses: actions/cache@v6
        with:
          path: .cache/uniprot_seq
          key: uniprot-seq-${{ runner.os }}-${{ steps.ontoweek.outputs.week }}
          restore-keys: |
            uniprot-seq-${{ runner.os }}-

      # Scope validation to what changed: a change to schema/validators/config could
      # affect every gene (-> full validate-all); otherwise validate only changed genes.
      - name: Validate gene reviews (scoped)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::Scheduled/manual run -> validating ALL gene reviews."
            just validate-all
          elif [ "${{ steps.changes.outputs.infra }}" = "true" ]; then
            echo "::notice::Validation infrastructure changed -> validating ALL gene reviews."
            just validate-all
          elif [ "${{ steps.changes.outputs.genes }}" = "true" ]; then
            echo "::notice::Validating only changed gene reviews."
            just validate-changed ${{ steps.changes.outputs.genes_files }}
          else
            echo "No gene-review or validation-infrastructure changes; skipping gene validation."
          fi

      # Module YAMLs are validated against the ModuleReview schema. They are not
      # covered by validate-all (which is gene-review scoped), so validate them
      # whenever a module changes, the schema/validators change, or on the weekly
      # full run.
      - name: Validate modules (scoped)
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.infra == 'true' ||
          steps.changes.outputs.modules == 'true'
        run: just validate-modules

      # Family reviews carry residue sites and node assessments that gene reviews
      # cite, so a change to either side can break the join.
      #
      # Also fires on gene changes, because a gene residue_claim can cite a family
      # site and the join breaks from either side. The UniProt cache restored above is
      # what makes that affordable: without it every run would resolve each sequence
      # over the network, and an upstream outage would block curation that cannot have
      # broken these checks.
      - name: Validate family reviews (scoped)
        if: >-
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.infra == 'true' ||
          steps.changes.outputs.families == 'true' ||
          steps.changes.outputs.genes == 'true'
        run: just validate-families

      # PTN claims are validated against interpro/panther/*/*-paint.tsv slices
      # that curation PRs commit alongside the claim they justify, so per-PR CI
      # cannot tell a genuine slice from an authored one. Re-deriving them from
      # PANTHER's upstream IBD.gaf closes that loop. Network-bound and repo-wide,
      # so it runs only on the scheduled/manual full pass, not per PR.
      - name: Verify PAINT slices against upstream (full run only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: just verify-panther-paint

      - name: Test valid/invalid examples
        if: steps.changes.outputs.infra == 'true' || steps.changes.outputs.src == 'true'
        run: just test-examples

      - name: Run test suite
        if: steps.changes.outputs.src == 'true'
        run: just test

      # Runs even when `src` is false, so a .github-only change still gets its
      # agent-config consistency and guard-script checks.
      - name: Check agentic automation
        if: steps.changes.outputs.agents == 'true'
        run: |
          uv run pytest tests/test_agent_config.py tests/test_agent_run_summary.py \
            tests/test_apply_cron_profile.py tests/test_auto_merge_ready_prs.py \
            tests/test_pr_shepherd_workflow.py -q
          uv run ruff check --no-force-exclude scripts/auto_merge_ready_prs.py \
            tests/test_auto_merge_ready_prs.py tests/test_pr_shepherd_workflow.py
          just test-js
