# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:
  merge_group:
  # Weekly full re-validation safety net: per-PR scoping can miss breakage caused by
  # upstream ontology drift (e.g. a GO term becoming obsolete), so validate everything
  # once a week and on manual dispatch.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

# Cancel superseded PR/main push runs to reduce runner pressure. Queue and
# scheduled/manual runs are unique: cancelling integration ejects its queued PR.
concurrency:
  group: build-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

env:
  FORCE_COLOR: "1" # Make tools pretty.

#permissions: {}

jobs:
  validation:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:

      # Like dismech, avoid deleting preinstalled SDKs on every run. The runner
      # started with 86 GB free in run 38122109159 (2026-10-11); cleanup still
      # spent 121 seconds reclaiming another 22 GB. Log capacity for monitoring.
      - name: Report disk space
        run: df -h /

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check for source changes
        uses: dorny/paths-filter@v4 # merge_group support requires >=4.0.1
        id: changes
        with:
          list-files: shell
          filters: .github/ci-path-filters.yaml

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install project
        run: uv sync --dev

      # Cache the oaklib ontology SQLite DBs so term validation does not re-download
      # multi-GB GO/CHEBI/etc. every run. Weekly-rotating key keeps them reasonably fresh.
      - name: Compute ontology cache week
        id: ontoweek
        run: echo "week=$(date -u +%Y%U)" >> "$GITHUB_OUTPUT"

      - name: Cache ontology databases
        uses: actions/cache@v6
        with:
          path: ~/.data/oaklib
          key: oaklib-${{ runner.os }}-${{ steps.ontoweek.outputs.week }}
          restore-keys: |
            oaklib-${{ runner.os }}-

      # PR runs reuse compatible generations, with the legacy cache as fallback.
      # Scheduled/manual full passes resolve cold to detect upstream sequence drift.
      # Saving separately below preserves valid downloads even if validation fails.
      - name: Restore UniProt sequences
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v6
        with:
          path: .cache/uniprot_seq
          key: uniprot-seq-v2-${{ runner.os }}-${{ steps.ontoweek.outputs.week }}-
          restore-keys: |
            uniprot-seq-v2-${{ runner.os }}-
            uniprot-seq-${{ runner.os }}-

      - name: Snapshot restored UniProt sequences
        id: sequence_cache_before
        continue-on-error: true
        run: >-
          python .github/scripts/sequence_cache_manifest.py before
          --cache-dir .cache/uniprot_seq
          --snapshot "$RUNNER_TEMP/uniprot-sequence-before.json"

      # The PANTHER member index (accession -> family) is a build artifact, not
      # committed: validate-modules / validate-families run
      # `just ensure-panther-members`, which extends it incrementally from the
      # release-pinned PANTHER classification files cached here. A warm cache
      # makes that a quick offline no-op; a cold one downloads ~300 MB once. The
      # key changes when cited accessions change, so the extended index is saved,
      # and restore-keys fall back to the nearest earlier cache.
      - name: Cache PANTHER classifications and member index
        uses: actions/cache@v6
        with:
          path: .cache/panther
          key: panther-${{ runner.os }}-${{ hashFiles('src/ai_gene_review/etl/panther_families.py') }}-${{ hashFiles('modules/**/*.yaml', 'interpro/panther/**/*-review.yaml') }}
          restore-keys: |
            panther-${{ runner.os }}-${{ hashFiles('src/ai_gene_review/etl/panther_families.py') }}-
            panther-${{ runner.os }}-

      # Scope validation to what changed: a change to schema/validators/config could
      # affect every gene (-> full validate-all); otherwise validate only changed genes.
      - name: Validate gene reviews (scoped)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::Scheduled/manual run -> validating ALL gene reviews."
            just validate-all
          elif [ "${{ steps.changes.outputs.infra }}" = "true" ]; then
            echo "::notice::Validation infrastructure changed -> validating ALL gene reviews."
            just validate-all
          elif [ "${{ steps.changes.outputs.genes }}" = "true" ]; then
            echo "::notice::Validating only changed gene reviews."
            just validate-changed ${{ steps.changes.outputs.genes_files }}
          else
            echo "No gene-review or validation-infrastructure changes; skipping gene validation."
          fi

      # Integration can expose schema incompatibilities outside the PR's paths.
      # Full reference/ontology revalidation remains on infra changes and the
      # weekly pass; avoid refetching the entire literature corpus per merge.
      - name: Validate all gene schemas (merge queue)
        if: github.event_name == 'merge_group' && steps.changes.outputs.infra != 'true'
        run: >-
          uv run python -m ai_gene_review.validation.schema_batch --schema src/ai_gene_review/schema/gene_review.yaml
          --target-class GeneReview genes/*/*/*-ai-review.yaml

      - name: Validate changed prediction reviews and source evidence
        if: steps.changes.outputs.predictions == 'true'
        run: just validate-predictions ${{ steps.changes.outputs.predictions_files }}

      - name: Validate changed BioReason/GO-GPT prediction files
        if: steps.changes.outputs.bioreason_predictions == 'true'
        run: just validate-prediction-terms ${{ steps.changes.outputs.bioreason_predictions_files }}

      - name: Upload prediction evidence validation
        if: always() && steps.changes.outputs.predictions == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prediction-evidence-validation
          path: reports/prediction-evidence.json

      # Module YAMLs are validated against the ModuleReview schema. They are not
      # covered by validate-all (which is gene-review scoped), so validate them
      # whenever a module changes, the schema/validators change, or on the weekly
      # full run.
      - name: Validate modules (scoped)
        if: >-
          github.event_name == 'merge_group' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.infra == 'true' ||
          steps.changes.outputs.modules == 'true'
        run: just validate-modules

      # History records (append-only session provenance under history/, ported
      # from dismech) validate against src/ai_gene_review/schema/history.yaml.
      # Cheap, so run whenever they, their tooling, or the curated dirs whose
      # paths the layout test checks change, or on the full pass.
      - name: Validate history records (scoped)
        if: >-
          github.event_name == 'merge_group' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.infra == 'true' ||
          steps.changes.outputs.history == 'true'
        run: |
          just validate-history-all
          uv run pytest tests/test_history_schema.py tests/test_backfill_history.py -q

      # Advisory-only nudge: if a PR edits curated content but adds no matching
      # history/ record, warn so curation provenance keeps pace with content.
      # See docs/history.md and `just new-history`. continue-on-error is what
      # makes "advisory" true: without it a gh api hiccup (rate limit, fork-PR
      # token scope, >3000-file PR) would fail an unrelated curation PR.
      - name: Check curation history coverage
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # GitHub's own PR file list reflects only what the PR itself changes
          # (a local two-dot diff misblames main's newer commits on branches
          # behind main). `status == "added"` replaces --diff-filter=A.
          PR_FILES="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files"
          CHANGED=$(gh api --paginate "$PR_FILES" --jq '.[].filename')
          ADDED_HISTORY=$(gh api --paginate "$PR_FILES" \
            --jq '.[] | select(.status == "added") | .filename' \
            | grep -E '^history/.*\.yaml$' || true)

          # Curated content per docs/history.md: gene reviews, modules (nested
          # included), GO-CAM reviews, and project pages.
          CURATED=$(echo "$CHANGED" \
            | grep -E '^(genes/[^/]+/[^/]+/[^/]+-ai-review\.yaml|modules/.+\.ya?ml|gocams/[^/]+/[^/]+-review\.yaml|projects/.+\.md)$' \
            || true)

          if [ -z "$CURATED" ]; then
            echo "No curated-content changes; skipping history-coverage nudge."
            exit 0
          fi

          if [ -z "$ADDED_HISTORY" ]; then
            echo "::warning::This PR changes curated content but adds no history/ record." \
              " Consider scaffolding one with \`just new-history\` (see docs/history.md)."
            echo "Curated files changed:"
            echo "$CURATED"
          else
            echo "History records added:"
            echo "$ADDED_HISTORY"
          fi

      # Family reviews carry residue sites and node assessments that gene reviews
      # cite, so a change to either side can break the join.
      #
      # Also fires on gene changes, because a gene residue_claim can cite a family
      # site and the join breaks from either side. The UniProt cache restored above is
      # what makes that affordable: without it every run would resolve each sequence
      # over the network, and an upstream outage would block curation that cannot have
      # broken these checks.
      - name: Validate family reviews (scoped)
        if: >-
          github.event_name == 'merge_group' ||
          github.event_name == 'schedule' ||
          github.event_name == 'workflow_dispatch' ||
          steps.changes.outputs.infra == 'true' ||
          steps.changes.outputs.families == 'true' ||
          steps.changes.outputs.genes == 'true'
        run: just validate-families

      # Cache maintenance is advisory; every validation keeps its normal exit status.
      # Only this validation job saves sequences; tests run on a separate runner.
      - name: Inspect downloaded UniProt sequences
        id: sequence_cache_after
        if: ${{ !cancelled() && steps.sequence_cache_before.outcome == 'success' }}
        continue-on-error: true
        run: >-
          python .github/scripts/sequence_cache_manifest.py after
          --cache-dir .cache/uniprot_seq
          --snapshot "$RUNNER_TEMP/uniprot-sequence-before.json"
          --output "$GITHUB_OUTPUT"

      - name: Save downloaded UniProt sequences
        if: ${{ !cancelled() && steps.sequence_cache_after.outcome == 'success' && steps.sequence_cache_after.outputs.changed == 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache/uniprot_seq
          key: uniprot-seq-v2-${{ runner.os }}-${{ steps.ontoweek.outputs.week }}-${{ steps.sequence_cache_after.outputs.digest }}

      # PTN claims are validated against interpro/panther/*/*-paint.tsv slices
      # that curation PRs commit alongside the claim they justify, so per-PR CI
      # cannot tell a genuine slice from an authored one. Re-deriving them from
      # PANTHER's upstream IBD.gaf closes that loop. Network-bound and repo-wide,
      # so it runs only on the scheduled/manual full pass, not per PR.
      - name: Verify PAINT slices against upstream (full run only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: just verify-panther-paint

  suite:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:

      # Like dismech, avoid deleting preinstalled SDKs on every run. The runner
      # started with 86 GB free in run 38122109159 (2026-10-11); cleanup still
      # spent 121 seconds reclaiming another 22 GB. Log capacity for monitoring.
      - name: Report disk space
        run: df -h /

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check for source changes
        uses: dorny/paths-filter@v4 # merge_group support requires >=4.0.1
        id: changes
        with:
          list-files: shell
          filters: .github/ci-path-filters.yaml

      - name: Decide whether test setup is needed
        id: scope
        run: echo "run=${{ github.event_name == 'merge_group' || steps.changes.outputs.src == 'true' || steps.changes.outputs.infra == 'true' || steps.changes.outputs.agents == 'true' }}" >> "$GITHUB_OUTPUT"

      # The benchmark tests read frozen inputs with `git cat-file` at declared commits:
      # baseline_commit (ARGO95/ARGO139 GOA) and review_snapshot_commit (reviews/GOA
      # behind the GO-GPT and BioReason sidecar reports), plus the ProtNLM2
      # evaluation's own review_snapshot_commit.
      - name: Fetch benchmark baseline and review snapshot commits
        if: steps.scope.outputs.run == 'true'
        shell: bash
        run: |
          fetch_field() {
            local policy="$1" field="$2" commit
            commit="$(sed -n "s/^${field}: //p" "$policy")"
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Invalid ${field} in ${policy}: $commit" >&2
              exit 1
            fi
            # persist-credentials is disabled; this targeted fetch uses public read access.
            git fetch --no-tags --depth=1 origin "$commit"
          }
          fetch_field projects/BIOREASON_COMPARISON/benchmark-policy.yaml baseline_commit
          fetch_field projects/BIOREASON_COMPARISON/benchmark-policy.yaml review_snapshot_commit
          fetch_field projects/PROTNLM_EVALUATION/review-snapshot.yaml review_snapshot_commit

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        if: steps.scope.outputs.run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        if: steps.scope.outputs.run == 'true'
        run: |
          uv tool install rust-just

      - name: Install project
        if: steps.scope.outputs.run == 'true'
        run: uv sync --dev

      # Cache the oaklib ontology SQLite DBs so term validation does not re-download
      # multi-GB GO/CHEBI/etc. every run. Weekly-rotating key keeps them reasonably fresh.
      - name: Compute ontology cache week
        if: steps.scope.outputs.run == 'true'
        id: ontoweek
        run: echo "week=$(date -u +%Y%U)" >> "$GITHUB_OUTPUT"

      - name: Cache ontology databases
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ~/.data/oaklib
          key: oaklib-${{ runner.os }}-${{ steps.ontoweek.outputs.week }}
          restore-keys: |
            oaklib-${{ runner.os }}-

      # PR runs reuse compatible generations, with the legacy cache as fallback.
      # Scheduled/manual full passes resolve cold to detect upstream sequence drift.
      - name: Restore UniProt sequences
        if: steps.scope.outputs.run == 'true' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v6
        with:
          path: .cache/uniprot_seq
          key: uniprot-seq-v2-${{ runner.os }}-${{ steps.ontoweek.outputs.week }}-
          restore-keys: |
            uniprot-seq-v2-${{ runner.os }}-
            uniprot-seq-${{ runner.os }}-

      # The PANTHER member index (accession -> family) is a build artifact, not
      # committed: validate-modules / validate-families run
      # `just ensure-panther-members`, which extends it incrementally from the
      # release-pinned PANTHER classification files cached here. A warm cache
      # makes that a quick offline no-op; a cold one downloads ~300 MB once. The
      # tests only restore this index; the validation job owns cache updates.
      - name: Cache PANTHER classifications and member index
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@v6
        with:
          path: .cache/panther
          key: panther-${{ runner.os }}-${{ hashFiles('src/ai_gene_review/etl/panther_families.py') }}-${{ hashFiles('modules/**/*.yaml', 'interpro/panther/**/*-review.yaml') }}
          restore-keys: |
            panther-${{ runner.os }}-${{ hashFiles('src/ai_gene_review/etl/panther_families.py') }}-
            panther-${{ runner.os }}-

      - name: Test valid/invalid examples
        if: github.event_name == 'merge_group' || steps.changes.outputs.infra == 'true' || steps.changes.outputs.src == 'true'
        run: just test-examples

      - name: Run test suite
        if: github.event_name == 'merge_group' || steps.changes.outputs.src == 'true'
        run: just test

      # Runs even when `src` is false, so a .github-only change still gets its
      # agent-config consistency and guard-script checks.
      - name: Check agentic automation
        if: github.event_name == 'merge_group' || steps.changes.outputs.agents == 'true'
        run: |
          uv run pytest tests/test_agent_config.py tests/test_agent_run_summary.py \
            tests/test_apply_cron_profile.py tests/test_auto_merge_ready_prs.py \
            tests/test_pr_shepherd_workflow.py tests/test_retry_failed_reviews.py \
            tests/test_sequence_cache_persistence.py tests/test_merge_group_ci.py tests/test_merge_queue.py -q
          uv run ruff check --no-force-exclude scripts/auto_merge_ready_prs.py \
            scripts/retry_failed_reviews.py tests/test_auto_merge_ready_prs.py \
            tests/test_pr_shepherd_workflow.py tests/test_retry_failed_reviews.py \
            .github/scripts/sequence_cache_manifest.py tests/test_sequence_cache_persistence.py \
            tests/test_merge_group_ci.py tests/test_merge_queue.py
          just test-js

  # Keep the branch-protection context unchanged. An unconditional gate is needed:
  # a skipped dependent job can otherwise look green when a prerequisite fails.
  test:
    needs: [validation, suite]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false
    steps:
      - name: Require validation and tests to succeed
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          SUITE_RESULT: ${{ needs.suite.result }}
        run: |
          printf 'Validation: %s; tests: %s\n' "$VALIDATION_RESULT" "$SUITE_RESULT"
          test "$VALIDATION_RESULT" = success && test "$SUITE_RESULT" = success
