---
name: Generate Pages

on:
  push:
    branches: [main]
    paths:
      - 'genes/**/*.yaml'
      - 'src/ai_gene_review/schema/**'
      - 'src/ai_gene_review/templates/**'
      - 'src/ai_gene_review/render.py'
      - 'src/ai_gene_review/render_projects.py'
      - 'src/ai_gene_review/render_modules.py'
      - 'src/ai_gene_review/export/**'
      - 'src/ai_gene_review/browser/**'
      - 'src/ai_gene_review/tools/minify_linkml_browser_data.py'
      - 'projects/*.md'
      - 'projects/**/*.md'
      - 'modules/**/*.yaml'
      - 'project.justfile'
      - '.github/workflows/generate-pages.yaml'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force run even if already ran today'
        type: boolean
        default: false

concurrency:
  group: generate-pages
  cancel-in-progress: true

jobs:
  generate-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      # Scopes the default GITHUB_TOKEN only; the branch push and the PR are made
      # with the ai4c-agent App token below.
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A manual dispatch may select any workflow ref. Generated artifacts
          # must nevertheless always be built from the trusted default branch.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # NOTE: The previous "Close stale regeneration PRs" step closed the
      # regeneration PR if it was older than one hour. Because the PR is created
      # as a draft and reuses a single branch, it was frequently auto-closed
      # before anyone merged it -- so newly added gene reviews had their YAML on
      # main but their rendered HTML never landed, producing 404s for those
      # pages. That step has been removed; the regeneration PR is now created
      # ready-for-review with auto-merge enabled so generated pages publish
      # reliably (see the "Create or update regeneration PR" step below).

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install just
        run: uv tool install rust-just

      - name: Install project
        run: uv sync --dev

      - name: Get changed files
        id: changed
        run: |
          # Get YAML files changed in the triggering commit(s)
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'genes/**/*-ai-review.yaml' 'rules/**/*-review.yaml' 2>/dev/null || echo "")
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "Changed YAML files: $(echo "$CHANGED" | grep -c '.' || echo 0)"

      - name: Validate changed gene reviews
        run: |
          ERRORS=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            [ ! -f "$f" ] && continue
            if [[ "$f" == genes/*/*/*-ai-review.yaml ]]; then
              ORG=$(echo "$f" | cut -d/ -f2)
              GENE=$(echo "$f" | cut -d/ -f3)
              echo "=== Validating $ORG/$GENE ==="
              if ! just validate "$ORG" "$GENE"; then
                ERRORS=$((ERRORS + 1))
              fi
            fi
          done <<< "${{ steps.changed.outputs.files }}"
          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS validation errors"
            exit 1
          fi
          echo "✅ All changed files valid"

      - name: Render all gene review HTML pages
        run: just render-all

      - name: Render project pages
        run: just render-projects

      - name: Validate module YAML files
        run: just validate-modules

      - name: Render module pages
        run: just render-modules

      - name: Deploy browser app (data.js + index.html)
        run: just deploy-browser

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet \
            genes/ \
            app/index.html \
            app/data.js \
            app/schema.js \
            pages/ \
            reports/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            git diff --stat \
              genes/ \
              app/index.html \
              app/data.js \
              app/schema.js \
              pages/ \
              reports/
          fi

      - name: Compute regeneration metadata
        if: steps.check-changes.outputs.has_changes == 'true'
        id: pr-metadata
        shell: bash
        run: |
          GENE_COUNT=$(find genes -name '*-ai-review.yaml' | wc -l | tr -d ' ')
          HTML_COUNT=$(find genes -name '*-ai-review.html' | wc -l | tr -d ' ')
          PROJECT_COUNT=$(find pages/projects -name '*.html' 2>/dev/null | wc -l | tr -d ' ')
          MODULE_COUNT=$(find pages/modules -name '*.html' 2>/dev/null | wc -l | tr -d ' ')

          {
            echo "branch=auto/generate-pages"
            echo "gene_count=$GENE_COUNT"
            echo "html_count=$HTML_COUNT"
            echo "project_count=$PROJECT_COUNT"
            echo "module_count=$MODULE_COUNT"
          } >> "$GITHUB_OUTPUT"

      # Minted HERE, not at job start. An App installation token lives 60
      # minutes and does not refresh, and this is the longest job in the repo —
      # the last completed run took 58 minutes rendering ~1200 gene pages plus
      # projects, modules and the browser app. A token minted at job start would
      # expire during the render and 401 on the push below, discarding all of it.
      # `timeout-minutes: 55` (what the agent workflows use) would be worse still:
      # it would kill a run that legitimately needs the time. The render needs no
      # credentials, so the token is minted immediately before the only step that
      # does.
      - name: Generate ai4c-agent token
        id: ai4c-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.AI4C_AGENT_APP_ID }}
          private-key: ${{ secrets.AI4C_AGENT_PRIVATE_KEY }}

      - name: Create or update regeneration PR
        id: regen-pr
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ steps.ai4c-token.outputs.token }}
          APP_SLUG: ${{ steps.ai4c-token.outputs.app-slug }}
        shell: bash
        run: |
          # Commit as the ai4c-agent App bot and serve the short-lived token to git
          # through the gh credential helper, instead of persisting it in .git/config.
          APP_USER_ID="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git

          BRANCH_NAME="${{ steps.pr-metadata.outputs.branch }}"
          git fetch origin "$BRANCH_NAME:refs/remotes/origin/$BRANCH_NAME" || true
          git checkout -B "$BRANCH_NAME"

          git add \
            genes/ \
            app/index.html \
            app/data.js \
            app/schema.js \
            pages/ \
            reports/

          # SAFETY GUARD: this automated commit must only ever contain
          # generated build artifacts. If anything outside the generated set is
          # staged (e.g. a gene-review YAML, schema, src/, or projects/*.md
          # source file), abort rather than risk clobbering hand-authored
          # content. Allowed: gene-review HTML, everything under pages/, the
          # three browser-app files, and reports/.
          DISALLOWED="$(git diff --cached --name-only \
            | grep -vE '^(genes/[^[:space:]]+\.html|pages/[^[:space:]]+|app/(index\.html|data\.js|schema\.js)|reports/[^[:space:]]+)$' \
            || true)"
          if [ -n "$DISALLOWED" ]; then
            echo "❌ Refusing to commit non-artifact files:"
            echo "$DISALLOWED"
            exit 1
          fi

          git commit -m "$(cat <<EOF
            Regenerate pages, browser app, and reports

            - ${{ steps.pr-metadata.outputs.html_count }} gene review HTML pages (from ${{ steps.pr-metadata.outputs.gene_count }} YAML reviews)
            - ${{ steps.pr-metadata.outputs.project_count }} project pages
            - ${{ steps.pr-metadata.outputs.module_count }} module pages
            - Browser app data.js
            - Validation report

            Triggered by changes to gene reviews or templates.
          EOF
          )"

          git push --force-with-lease origin "$BRANCH_NAME"

          PR_BODY="$(mktemp)"
          {
            echo "## Summary"
            echo
            echo "Automated regeneration of static assets after gene review or template changes."
            echo
            echo "## Generated Assets"
            echo
            echo "| Asset | Count/Status |"
            echo "|-------|--------------|"
            echo "| Gene review YAML files | ${{ steps.pr-metadata.outputs.gene_count }} |"
            echo "| Gene review HTML pages | ${{ steps.pr-metadata.outputs.html_count }} |"
            echo "| Project pages | ${{ steps.pr-metadata.outputs.project_count }} |"
            echo "| Module pages | ${{ steps.pr-metadata.outputs.module_count }} |"
            echo "| Browser app (data.js) | Updated |"
            echo "| Validation report | Updated |"
            echo
            echo "## Trigger"
            echo
            echo "This PR was triggered by changes to:"
            echo "- genes/**/*.yaml - gene review data files"
            echo "- src/ai_gene_review/schema/** - LinkML schema files"
            echo "- src/ai_gene_review/templates/** - Jinja2 templates"
            echo "- src/ai_gene_review/render.py - rendering code"
            echo "- src/ai_gene_review/render_modules.py - module rendering code"
            echo "- src/ai_gene_review/export/** - export code"
            echo "- src/ai_gene_review/browser/** - browser app assets"
            echo "- src/ai_gene_review/tools/minify_linkml_browser_data.py - browser data compaction"
            echo "- projects/*.md - project definitions"
            echo "- modules/**/*.yaml - module definitions"
            echo "- project.justfile - just recipes used by CI"
            echo "- .github/workflows/generate-pages.yaml - workflow definition"
            echo
            echo "## Review"
            echo
            echo "- [ ] Spot-check a few gene review HTML pages render correctly"
            echo "- [ ] Spot-check module tree browser pages render correctly"
            echo "- [ ] Verify browser app loads and filters work"
            echo "- [ ] Check validation report for new issues"
          } > "$PR_BODY"

          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH_NAME" \
            --base main \
            --state open \
            --author app/ai4c-agent \
            --json number \
            --limit 1 \
            --jq '.[0].number // empty')"

          if [ -n "$PR_NUMBER" ]; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              -f body="$(cat "$PR_BODY")" \
              >/dev/null
            echo "Updated existing regeneration PR #$PR_NUMBER."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$BRANCH_NAME" \
              --title "Regenerate pages and browser app" \
              --body-file "$PR_BODY"

            PR_NUMBER="$(gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH_NAME" \
              --base main \
              --state open \
              --author app/ai4c-agent \
              --json number \
              --limit 1 \
              --jq '.[0].number // empty')"

            if [ -z "$PR_NUMBER" ]; then
              echo "Failed to resolve regeneration PR number for $BRANCH_NAME."
              echo "Compare URL: https://github.com/${GITHUB_REPOSITORY}/compare/main...${BRANCH_NAME}?expand=1"
              exit 1
            fi
            echo "Created regeneration PR #$PR_NUMBER."
          fi

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Approve exact generated commit
        id: approve-generated
        if: steps.check-changes.outputs.has_changes == 'true'
        # Approval is a fail-safe convenience after the expensive render and
        # push. The later step will not arm auto-merge when the reviewer App is
        # unavailable, so preserve the artifacts and emit a loud warning below.
        continue-on-error: true
        uses: ./.github/actions/approve-regen-pr
        with:
          pr-number: ${{ steps.regen-pr.outputs.pr_number }}
          branch-name: auto/generate-pages
          base-branch: main
          expected-author: app/ai4c-agent
          app-id: ${{ secrets.AI4C_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AI4C_REVIEWER_PRIVATE_KEY }}

      - name: Warn when generated approval is unavailable
        if: >-
          ${{ always() &&
              steps.check-changes.outputs.has_changes == 'true' &&
              steps.approve-generated.outcome == 'failure' }}
        env:
          PR_NUMBER: ${{ steps.regen-pr.outputs.pr_number }}
        shell: bash
        run: |
          echo "::warning title=Generated PR approval unavailable::The exact-head approval for regeneration PR #${PR_NUMBER:-unknown} failed. Generated artifacts were already pushed; the later step will not arm auto-merge. Retry the workflow or inspect the ai4c-reviewer App."

      # Approval is deliberately a separate, earlier step. A protection-read or
      # rollout-guard failure below must never prevent the independent reviewer
      # App from recording its exact-head decision on the generated PR.
      - name: Validate protection and arm generated auto-merge
        if: >-
          ${{ !cancelled() &&
              steps.check-changes.outputs.has_changes == 'true' &&
              steps.regen-pr.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.ai4c-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MERGE_ENABLED: ${{ vars.PR_SHEPHERD_MERGE_ENABLED }}
          PR_NUMBER: ${{ steps.regen-pr.outputs.pr_number }}
          EXPECTED_HEAD: ${{ steps.regen-pr.outputs.head_sha }}
          APPROVAL_OUTCOME: ${{ steps.approve-generated.outcome }}
        shell: bash
        run: |
          # Share the Shepherd rollout flag as the generated lane's kill switch.
          # Flag-off still leaves the already-created and reviewed PR open.
          if [ "$MERGE_ENABLED" != "true" ]; then
            echo "Auto-merge is rollout-disabled; PR #$PR_NUMBER remains open."
            exit 0
          fi

          # The generated PR and approval action both use literal base `main`.
          # Refuse a renamed/default-branch mismatch rather than checking one
          # branch and arming auto-merge against another.
          if [ "$DEFAULT_BRANCH" != "main" ]; then
            echo "::error title=Generated auto-merge base mismatch::Repository default branch is $DEFAULT_BRANCH, but the generated lane targets literal base main. Refusing to arm auto-merge."
            exit 1
          fi
          pr_base=""
          if ! pr_base="$(gh pr view "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --json baseRefName \
            --jq '.baseRefName')"; then
            echo "::error title=Generated auto-merge base check failed::Could not read the current base for PR #$PR_NUMBER; refusing to arm auto-merge."
            exit 1
          fi
          if [ "$pr_base" != "main" ]; then
            echo "::error title=Generated auto-merge base mismatch::PR #$PR_NUMBER targets $pr_base, not literal base main. Refusing to arm auto-merge."
            exit 1
          fi

          # Mirror the Shepherd's protected-branch existence smoke check with
          # the current App token. This intentionally does not claim to verify
          # the exact classic-protection settings in the rollout checklist.
          protected=""
          if ! protected="$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/main" \
            --jq '.protected')"; then
            echo "::error title=Generated auto-merge protection check failed::Could not read protection for literal base main; refusing to arm auto-merge."
            exit 1
          fi
          if [ "$protected" != "true" ]; then
            echo "::error title=Generated auto-merge requires protected main::Literal base main reports protected=$protected; refusing to arm auto-merge."
            exit 1
          fi

          # Do not arm a PR whose independent exact-head approval was not
          # recorded. The warning step above reports the fail-safe outcome.
          if [ "$APPROVAL_OUTCOME" != "success" ]; then
            echo "Auto-merge was not armed because exact-head approval is unavailable."
            exit 0
          fi
          if [ -z "$EXPECTED_HEAD" ]; then
            echo "::error title=Generated auto-merge head pin missing::The generated head SHA is empty; refusing to arm auto-merge."
            exit 1
          fi

          # Arm auto-merge rather than issue a direct merge. Protected main must
          # enforce the exact-head reviewer approval and required test check.
          # The staged-path allowlist guarantees derived artifacts only.
          echo "Arming auto-merge for regeneration PR #$PR_NUMBER."
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash \
            --match-head-commit "$EXPECTED_HEAD" \
            || echo "Auto-merge could not be enabled; PR #$PR_NUMBER left open for manual merge."
