ion text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 163,\n        "text": "- Structural and regulatory underpinnings: Domain organization, catalytic motifs, PTMs (including phosphorylation) and transcriptional control (Sp1, CREB, TEAD4/YAP, PPARδ) are implicated in tuning ACSL4 activity and ferroptosis output, informing druggability assessments (Jul 2023; https://doi.org/10.1097/cm9.0000000000002533) (chen2023theacsl4network pages 5-7, ding2023acylcoasynthaseacsl4 pages 1-2).",\n        "mapped_pmid": "37442770",\n        "title": "Acyl-CoA synthase ACSL4: an essential target in ferroptosis and fatty acid metabolism",\n        "doi_aliases": [\n          "10.1097/cm9.0000000000002533"\n        ],\n        "pmc_aliases": [\n          "PMC10617883"\n        ],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37442770/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/37442770/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-explicit-web.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 170,\n        "text": "- Reaction: ACSL4 catalyzes ATP‑dependent activation of long‑chain PUFAs (PUFA + ATP + CoA → PUFA‑CoA + AMP + PPi), with strong selectivity for AA and AdA in human systems (Jul 2023; https://doi.org/10.1097/cm9.0000000000002533; Mar 2024; https://doi.org/10.1126/sciadv.adk1200) (ding2023acylcoasynthaseacsl4 pages 1-2, huang2024identificationofa pages 1-2).",\n        "mapped_pmid": "37442770",\n        "title": "Acyl-CoA synthase ACSL4: an essential target in ferroptosis and fatty acid metabolism",\n        "doi_aliases": [\n          "10.1097/cm9.0000000000002533"\n        ],\n        "pmc_aliases": [\n          "PMC10617883"\n        ],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37442770/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/37442770/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-explicit-web.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 178,\n        "text": "- X‑linked intellectual disability: Genetic association between ACSL4 and X‑linked non‑specific intellectual disability is noted in human studies (Jul 2023; https://doi.org/10.1097/cm9.0000000000002533) (ding2023acylcoasynthaseacsl4 pages 1-2).",\n        "mapped_pmid": "37442770",\n        "title": "Acyl-CoA synthase ACSL4: an essential target in ferroptosis and fatty acid metabolism",\n        "doi_aliases": [\n          "10.1097/cm9.0000000000002533"\n        ],\n        "pmc_aliases": [\n          "PMC10617883"\n        ],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37442770/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/37442770/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-explicit-web.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n    