    - name: Install uv without a shared dependency cache
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false
    - name: Install the locked normal project runtime
      timeout-minutes: 15
      run: uv sync --frozen --no-dev --no-editable
    - name: Run normal source fetchers in isolated temporary directories
      id: fetch
      continue-on-error: true
      timeout-minutes: 40
      run: |
        uv run --no-sync python - <<'PYFETCH'
        """Retrieve a fixed PMID/Reactome inventory with the normal CLI; never author source records."""
        from pathlib import Path
        from datetime import datetime, timezone
        from importlib.metadata import version
        import hashlib,json,os,re,signal,subprocess,time,yaml

        BRANCH='refs/heads/cmungall/clingen-reference-fetch89-20260930'
        REPOSITORY='ai4curation/ai-gene-review'
        ROOT_NAME='clingen-reference-recovery89'
        REQUEST_SHA256='4068b315ba608a516d25dd23b1fb98f4713c15e97b33921c93b3ca042c12643f'
        PMIDS={'31690665','24559376'}
        REACTOME_IDS=set()
        PER_PMID_SECONDS=180
        PER_REACTOME_SECONDS=60
        TOTAL_SECONDS=35*60
        REACTOME_CALL='''from pathlib import Path
        import sys
        from ai_gene_review.etl.reactome import cache_reactome_pathway
        raise SystemExit(0 if cache_reactome_pathway(sys.argv[1], output_dir=Path(sys.argv[2]), force=False) else 1)
        '''

        def digest(data):
         return {'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest(),'git_blob_sha':hashlib.sha1(f'blob {len(data)}\0'.encode()+data).hexdigest()}

        def validate_requests(raw):
         if hashlib.sha256(raw).hexdigest()!=REQUEST_SHA256:raise ValueError('Requests differ from the fixed approved bytes')
         data=json.loads(raw);allowed={('pmid',x) for x in PMIDS}|{('reactome',x) for x in REACTOME_IDS}
         if not isinstance(data,list) or len(data)!=len(allowed):raise ValueError('Wrong finite inventory size')
         if {(r['kind'],r['id']) for r in data}!=allowed:raise ValueError('Wrong fixed source inventory')
         for r in data:
          if set(r)!={'kind','id','mode','genes','citations'} or r['mode']!='fetch_missing':raise ValueError('Unsupported request shape or mode')
          pattern={'pmid':r'[1-9][0-9]{0,8}','reactome':r'R-[A-Z]{3}-[1-9][0-9]{0,8}'}.get(r['kind'])
          if not pattern or not re.fullmatch(pattern,r['id']):raise ValueError('Invalid source identifier')
          if not r['genes'] or not r['citations']:raise ValueError('Missing source provenance')
         return data

        def inspect_publication(raw,pmid):
         text=raw.decode('utf-8');parts=re.split(r'^---\s*$',text,maxsplit=2,flags=re.M)
         if not text.startswith('---\n') or len(parts)!=3:raise ValueError('Missing normal publication frontmatter')
         meta=yaml.safe_load(parts[1])
         if not isinstance(meta,dict) or str(meta.get('pmid'))!=pmid:raise ValueError('Wrong publication identifier')
         if not isinstance(meta.get('title'),str) or not meta['title'].strip():raise ValueError('Missing publication title')
         if not isinstance(meta.get('full_text_available'),bool):raise ValueError('Missing normal availability metadata')
         if not parts[2].strip():raise ValueError('Empty publication body')
         return {**digest(raw),'frontmatter':meta,'has_abstract_section':'## Abstract' in parts[2],'has_full_text_section':'## Full Text' in parts[2]}

        def inspect_reactome(raw,identifier):
         text=raw.decode('utf-8');parts=re.split(r'^---\s*$',text,maxsplit=2,flags=re.M)
         if not text.startswith('---\n') or len(parts)!=3:raise ValueError('Missing normal Reactome frontmatter')
         meta=yaml.safe_load(parts[1])
         if not isinstance(meta,dict) or meta.get('stable_id')!=identifier:raise ValueError('Wrong Reactome identifier')
         if not isinstance(meta.get('display_name'),str) or not meta['display_name'].strip() or meta['display_name']=='Unknown pathway':raise ValueError('Missing Reactome title')
         if not parts[2].strip():raise ValueError('Empty Reactome body')
         return {**digest(raw),'frontmatter':meta,'has_summary':bool(meta.get('summary')),'has_summary_section':'## Summary' in parts[2]}

        def inspect_source(raw,kind,identifier):
         if kind=='pmid':return inspect_publication(raw,identifier)
         if kind=='reactome':return inspect_reactome(raw,identifier)
         raise ValueError('Wrong source kind')

        def relative_cache_path(kind,identifier):
         if kind=='pmid' and identifier in PMIDS:return Path('publications',f'PMID_{identifier}.md')
         if kind=='reactome' and identifier in REACTOME_IDS:return Path('reactome',identifier+'.md')
         raise ValueError('Unapproved source/path')

        def write_raw(destination,data):
         destination.parent.mkdir(parents=True,exist_ok=True)
         with destination.open('xb') as handle:handle.write(data)
         if destination.read_bytes()!=data:raise ValueError('Raw byte-copy mismatch')

        def copy_raw_tree(source,destination):
         records=[]
         for path in sorted(source.rglob('*')):
          if path.is_symlink():raise ValueError('Generated symlink requires inspection')
          if not path.is_file():continue
          rel=path.relative_to(source);data=path.read_bytes();write_raw(destination/rel,data);records.append({'path':str(rel),**digest(data)})
         return records

        def command_for(kind,identifier,runtime,work):
         relative=relative_cache_path(kind,identifier);output=work/relative.parent
         if kind=='pmid':return [str(runtime/'bin/ai-gene-review'),'fetch-pmid',identifier,'--output-dir',str(output),'--delay','1.0']
         return [str(runtime/'bin/python'),'-c',REACTOME_CALL,identifier,str(output)]

        def run_command(command,work,logpath,timeout):
         with logpath.open('w') as log:
          proc=subprocess.Popen(command,cwd=work,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
          try:return {'returncode':proc.wait(timeout=timeout),'timed_out':False}
          except subprocess.TimeoutExpired:
           try:os.killpg(proc.pid,signal.SIGKILL)
           except ProcessLookupError:pass
           proc.wait();return {'returncode':proc.returncode,'timed_out':True}
          except BaseException:
           try:os.killpg(proc.pid,signal.SIGKILL)
           except ProcessLookupError:pass
           proc.wait();raise

        def main():
         if os.environ.get('GITHUB_EVENT_NAME')!='workflow_dispatch' or os.environ.get('GITHUB_REF')!=BRANCH or os.environ.get('GITHUB_REPOSITORY')!=REPOSITORY:raise ValueError('Wrong event, task branch or repository')
         repo=Path(os.environ['GITHUB_WORKSPACE']).resolve();runner=Path(os.environ['RUNNER_TEMP']).resolve();root=runner/ROOT_NAME
         runtime=Path(os.environ['UV_PROJECT_ENVIRONMENT']).resolve()
         if not runtime.is_relative_to(root) or root.is_relative_to(repo):raise ValueError('Runtime/output path outside isolated runner temp')
         artifact=root/'artifact';workroot=root/'fetch-work';workroot.mkdir(parents=True);logs=artifact/'logs';logs.mkdir()
         requests=validate_requests((artifact/'requests.json').read_bytes())
         report={key:os.environ[key] for key in ['GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']}
         report.update(started_utc=datetime.now(timezone.utc).isoformat(),entries=[],request_digest=digest((artifact/'requests.json').read_bytes()),provenance_digest=digest((artifact/'source-list-provenance.json').read_bytes()),versions={},source_code={},scope='Raw normal publication and Reactome outputs only. Metadata checks do not establish scientific support or complete article access. No source authoring, review, gene seeding, import, refresh or remote mutation.')
         def save():(artifact/'fetch-report.json').write_text(json.dumps(report,indent=2)+'\n')
         save();deadline=time.monotonic()+TOTAL_SECONDS
         try:
          for name in ['ai-gene-review','linkml-reference-validator','PyYAML']:report['versions'][name]=version(name)
          for name in ['src/ai_gene_review/cli.py','src/ai_gene_review/etl/publication.py','src/ai_gene_review/etl/reactome.py','uv.lock','.github/workflows/warm-reference-cache.yaml']:report['source_code'][name]=digest((repo/name).read_bytes())
          save()
          for request in requests:
           kind=request['kind'];identifier=request['id'];key=kind+'_'+identifier;entry={'kind':kind,'id':identifier,'status':'pending'};report['entries'].append(entry);save()
           relative=relative_cache_path(kind,identifier);existing=repo/relative
           if existing.exists():
            try:entry.update(inspect_source(existing.read_bytes(),kind,identifier),status='already_present')
            except Exception as exc:entry.update(status='existing_needs_inspection',error=str(exc),existing_digest=digest(existing.read_bytes()))
            save();continue
           remaining=deadline-time.monotonic()
           if remaining<=0:entry['status']='not_attempted_budget';save();continue
           work=workroot/key;work.mkdir();command=command_for(kind,identifier,runtime,work);entry.update(status='fetching',command=command,started_utc=datetime.now(timezone.utc).isoformat());save()
           try:
            entry.update(run_command(command,work,logs/(key+'.log'),min(PER_PMID_SECONDS if kind=='pmid' else PER_REACTOME_SECONDS,remaining)))
            generated=work/relative
            if entry['returncode']!=0:raise ValueError('Normal fetch failed or timed out')
            if generated.is_symlink():raise ValueError('Symlink publication output')
            raw=generated.read_bytes();entry.update(inspect_source(raw,kind,identifier))
            entry['raw_outputs']=copy_raw_tree(work,artifact/'raw_outputs'/key)
            write_raw(artifact/relative,raw);entry.update(status='recovered',artifact_path=str(relative))
           except Exception as exc:
            entry.update(status='needs_inspection',error=str(exc))
            try:entry['quarantined_outputs']=copy_raw_tree(work,artifact/'quarantine'/key)
            except Exception as copy_error:entry['quarantine_error']=str(copy_error)
           save()
         except Exception as exc:
          report['fatal_error']=str(exc)
         finally:
          attempted={(r['kind'],r['id']) for r in report['entries']}
          report['entries'] += [{'kind':r['kind'],'id':r['id'],'status':'not_attempted_after_failure'} for r in requests if (r['kind'],r['id']) not in attempted]
          report['finished_utc']=datetime.now(timezone.utc).isoformat();report['unresolved_sources']=[r['kind']+':'+r['id'] for r in report['entries'] if r['status'] not in {'recovered','already_present'}];report['recovered_count']=sum(r['status']=='recovered' for r in report['entries']);save()
         with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:summary.write(f"Recovered {report['recovered_count']} normal source caches; {len(report['unresolved_sources'])} unresolved. All outputs require independent identity/content checks before import.\n")
         return int(bool(report['unresolved_sources']) or 'fatal_error' in report)
        if __name__=='__main__':raise SystemExit(main())
        PYFETCH
    - name: Verify the checked-out repository is unchanged
      id: unchanged
      if: ${{ always() }}
      run: |
        git diff --exit-code
        git diff --cached --exit-code
        test -z "$(git ls-files --others --exclude-standard)"
    - name: Upload raw normal sources and partial reports
      id: artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: clingen-reference-recovery89-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/clingen-reference-recovery89/artifact/
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: false
        overwrite: false
    - name: Report incomplete recovery after preserving outputs
      if: ${{ always() && (steps.fetch.outcome != 'success' || steps.unchanged.outcome != 'success' ||
        steps.artifact.outcome != 'success') }}
      run: exit 1
