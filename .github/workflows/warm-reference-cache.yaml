name: ClinGen bounded source and seed recovery 56
run-name: Source and seed recovery 56 at ${{ github.ref_name }} (${{ github.sha }})

# TEMPORARY: replace only this path on the dedicated task branch.
# The registered default-branch workflow is not changed or dispatched.
'on':
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: clingen-source-seed-recovery56-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-source-seed-fetch56-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Set isolated runtime paths after runner initialization
      run: |
        python - <<'PYENV'
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-source-seed-recovery56'
        with Path(os.environ['GITHUB_ENV']).open('a') as out:
            out.write('UV_CACHE_DIR='+str(root/'uv-cache')+'\n')
            out.write('UV_PROJECT_ENVIRONMENT='+str(root/'venv')+'\n')
        PYENV
    - name: Install uv without a shared dependency cache
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Initialize fixed source requests and partial report
      run: |
        python - <<'PYINIT'
        from pathlib import Path
        import json, os, base64, zlib, hashlib
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-source-seed-recovery56'/'artifact'
        root.mkdir(parents=True)
        REQUESTS_B85 = 'c-nPQ%TB{E5WM#*mT;x9Korq(f>u1FsDLU?sIpvV+gdp5$aY#H#J^)Ffkq%MR%Ul+XJ_&;07%M0<t~}P>+&SR4H7mm0DzC?4P{psE2Bd_xyc@<r;Cf^<h!-qkmM?lz5BcQbaFX5A0N6EsnQzX4Lpxuvh&fQE3^`>r`Hspu73t1%4YLEzJFSb`#9XwyQZOM*~2X93d<iYl_PoOYhGGa2wU^Y>R-xR?@KpfY`@>9Bv&dWU8JP8>Bj6>Oop9ZoQ*D7U#`#T%%;X}Soi(5Vy$Tw)NTDAGcG4lpli6f@S@Qhwz&^2md1K^e8jr6*&*sbMw?K%lcvO&`K{U^;Jc6>B8knXHxJMSe+7OY?y83lcSs<lMCX*D_E;7S<W=BFYn-#VMvD|CKv)E6Xswm>Lqoa-K{-&^VVfPL#~g%%yT@y29k}%H(?kBoa&4s0e2rdi<CPw5p(s>l^95fEr7Me^438;rQ~9#;uC@9Z-sRwP@CEcd$zA'
        REQUESTS_SHA256 = 'd251a3df4757dc2bc305cc288fd266ca5b87e12973b3d1ac885efa074dc24aa9'
        def decoded(payload, expected):
            raw=zlib.decompress(base64.b85decode(payload))
            if hashlib.sha256(raw).hexdigest()!=expected:
                raise ValueError('Embedded source provenance checksum mismatch')
            return raw
        (root/'requests.json').write_bytes(decoded(REQUESTS_B85, REQUESTS_SHA256))
        receipt={key:os.environ[key] for key in ['GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']}
        receipt.update(status='initialized_before_dependency_install',scope='zero explicit PMID requests and one normal human BLOC1S6 seed request; raw temporary outputs only')
        (root/'run-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
        (root/'fetch-report.json').write_text(json.dumps(dict(receipt,entries=[]),indent=2)+'\n')
        PYINIT
