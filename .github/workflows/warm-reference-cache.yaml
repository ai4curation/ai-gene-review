name: ClinGen bounded source and seed recovery 57
run-name: Source and seed recovery 57 at ${{ github.ref_name }} (${{ github.sha }})

# TEMPORARY: replace only this path on the dedicated task branch.
# The registered default-branch workflow is not changed or dispatched.
'on':
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: clingen-source-seed-recovery57-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-source-seed-fetch57-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Set isolated runtime paths after runner initialization
      run: |
        python - <<'PYENV'
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-source-seed-recovery57'
        with Path(os.environ['GITHUB_ENV']).open('a') as out:
            out.write('UV_CACHE_DIR='+str(root/'uv-cache')+'\n')
            out.write('UV_PROJECT_ENVIRONMENT='+str(root/'venv')+'\n')
        PYENV
    - name: Install uv without a shared dependency cache
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Initialize fixed source requests and partial report
      run: |
        python - <<'PYINIT'
        from pathlib import Path
        import json, os, base64, zlib, hashlib
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-source-seed-recovery57'/'artifact'
        root.mkdir(parents=True)
        REQUESTS_B85 = 'c-nPRU2obj6n*Dc+-0vNCcvPurvO^lf!Hd#rwLicxqwy2j%=rCRQ12t`DjTu?ZwJH*T?tVbMo8+2(nZpHkiYo{Z&<-P+?vA0^qqmJ#5SLpryxy#peE36kNSE&L_pGNUF~Fo9%KwoXozAF6~^2%xKr%xEpR(qv@r~q+qr)t_Ih)aU4a1+50t*ecSvPM&rTw1GbC1WlbARqb_z|AU<?~c(Y#rUhaYx*}p3h2`VRCNi!o-W=fhH`IoM<bD5nJQWQm~_(6n9rlAt&@T4C}WgEF3N0TAx&g*hoD?)8fr2T$4kj4_?r<?MB%<6H)QnWQUVUE@F`b{W(gPAsteEvk*Fi0nfe>SZ>r<Usst4Ma@3Gj(=2Nj8Imy26yWBCfM@VZK1oTIfut41bpqpdY~M1#tAfEfg?)lmxW`dUfPPzfk}L{oD!hY2tXH$P)&G~4j<6L`n9p;B`u=@A`2SF#+MR49+EwmW)cLgogk(zM!}>fB|yv(0WV{@nLodaqH=$vy'
        REQUESTS_SHA256 = '9ad81dee58a5f92f81bfb690b52e156bbef4bc6f6cfb57ec5ed1ae00aa4e0c40'
        def decoded(payload, expected):
            raw=zlib.decompress(base64.b85decode(payload))
            if hashlib.sha256(raw).hexdigest()!=expected:
                raise ValueError('Embedded source provenance checksum mismatch')
            return raw
        (root/'requests.json').write_bytes(decoded(REQUESTS_B85, REQUESTS_SHA256))
        receipt={key:os.environ[key] for key in ['GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']}
        receipt.update(status='initialized_before_dependency_install',scope='zero explicit PMID requests and one normal human BLTP1 seed request; raw temporary outputs only')
        (root/'run-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
        (root/'fetch-report.json').write_text(json.dumps(dict(receipt,entries=[]),indent=2)+'\n')
        PYINIT
