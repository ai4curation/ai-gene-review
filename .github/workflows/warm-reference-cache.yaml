name: ClinGen reference recovery batch 99
run-name: Reference recovery batch 99 at ${{ github.ref_name }} (${{ github.sha }})
"on":
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: clingen-reference-recovery99-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-reference-fetch99-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Set isolated runtime paths after runner initialization
      run: |
        python - <<'PYENV'
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-reference-recovery99'
        with Path(os.environ['GITHUB_ENV']).open('a') as out:
            out.write('UV_CACHE_DIR='+str(root/'uv-cache')+'\n')
            out.write('UV_PROJECT_ENVIRONMENT='+str(root/'venv')+'\n')
        PYENV
    - name: Initialize fixed source requests and partial report
      run: |
        python - <<'PYINIT'
        from pathlib import Path
        import json, os, base64, zlib, hashlib
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-reference-recovery99'/'artifact'
        root.mkdir(parents=True)
        REQUESTS_B85 = 'c-pO0O-~y!5WVv&MmZ<DA*fV^6CXm&fr6k?4+KSCdv<qHf64X+Qq=$6@oqu`?WIx=QS6!V^UQnC`)~m8!asn~cd}}90wZrojmATa`pD7I>}YoU@xv}^oWdNhG0ApmC`Pi)F4>^P$k~T}%YpOx#ogJc-#u<?Bqfo^+5Nhg?LVi}#`pMZ3{(@UrF*g%mb+8SXoZihOWP~^GhU=NpGn4-0c#9sB~GM}Elw)IeSZ2hQ5dPQ<ql`E!-=Jc5o0uHQ?ZK9?gP6(4OyX=|8PU!@5Bc(B5Wq47?;xK4`@v`&w0ETO8A`eCBt^X0xWpDc$Hu=8t)@8tnR7mNgjiM`)~8|{>v3yIO8=w!!?=;!x-if&SG?uL_!5mlv+4HyP8~5bU|T&JJfyVwngi*01?Q-=gtTlL0ARXEV_o9&<IP>#QiRmquj&cv^bm|9+#^^tlFlSO=lc9ET+?=H$n}pEW4odp*AHSPs-AFl|fZlSy5rNDJ-=`<JRSF@NysH)foQ+EZ~~(iNT`lg2ZK%Zm?gJlqFu)PHXqn`OJtyk2dS6HxN)LaCJ>gs)pOHx@P_cvAMZW_TrS6H}mrL`eJ_BvnYF65`w5=3PPqac-=)X*+Be?fJ?z(5=tad4E)1d1QIq4Ixzi)ud6#Nvx#}h<`o-G1_VVhF-k|VMRf|+ah>LhkVtAALrqP`WiCMMJU5aZKg=Pupv)N?AqB!U<0{7{U^9SFt4@(*e?Ub}yN1_#I1!7t+PXDbkx8puXBA8HcOvs3cQ-d*-!Zz=^*5`#w=;~s<?M7jr{vx{P8$S|>|xWz#2s>F<=Ed9){cj*1L6<NgGuf#Fna%HL97L7QIXE@ud@>Cv*}rzc;Ok8xe~nTr-i{QZ)P^a`|L#X?pwL7_&I#|4)W^p;1@Hqx4i'
        REQUESTS_SHA256 = '50a189b100dacf1ad3ed7fed581b9cd6c1057b5383c3bba1ea5ba87a35e4e67f'
        def decoded(payload, expected):
            raw=zlib.decompress(base64.b85decode(payload))
            if hashlib.sha256(raw).hexdigest()!=expected:
                raise ValueError('Embedded source provenance checksum mismatch')
            return raw
        (root/'requests.json').write_bytes(decoded(REQUESTS_B85, REQUESTS_SHA256))
