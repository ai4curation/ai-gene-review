: 365,\n        "text": "17. https://doi.org/10.1212/WNL.0000000000207133.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1212/wnl.0000000000207133",\n        "normalized_doi": "10.1212/wnl.0000000000207133",\n        "primary_pmid": "36878704",\n        "primary_title": "New Therapeutic Approaches to Inherited Metabolic Pediatric Epilepsies",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/36878704/"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "37002809",\n    "mode": "fetch_missing",\n    "genes": [\n      "ADGRV1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 220,\n        "text": "Affinity proteomics and transcriptomics linked ADGRV1 to autophagosomal machinery. ADGRV1-deficient fibroblasts showed a greater starvation-induced LC3-II/LC3-I increase than control cells, while fibroblasts from patients with USH2C accumulated p62; assays included 2 μM bafilomycin A1 for two hours to assess flux. The *Vlgr1/del7TM* mouse retina also showed altered autophagy- and mTOR-related transcription. These findings imply that ADGRV1 normally regulates autophagic flux, potentially through MAM calcium transfer, cAMP signaling, AMPK, or mechanical stress. Whether increased autophagy is causal, maladaptive, or compensatory in sensory degeneration is unresolved. [Linnert et al., published April 2023](https://doi.org/10.1111/bcpt.13869). (linnert2023theadhesiong pages 2-2, linnert2023theadhesiong pages 14-14, linnert2023theadhesiong pages 13-14)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1111/bcpt.13869",\n        "normalized_doi": "10.1111/bcpt.13869",\n        "primary_pmid": "37002809",\n        "primary_title": "The adhesion G protein-coupled receptor VLGR1/ADGRV1 controls autophagy.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37002809/"\n      },\n      {\n  