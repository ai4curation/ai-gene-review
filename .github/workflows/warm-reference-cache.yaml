        PROVENANCE_PREFIX_SHA256 = 'b3494564b7f01277971f8a2f941fd8a34c0d146bdcf9ce8baa42dc2500f57e33'
        PROVENANCE_SHA256 = '8b4ce385358d2f914714fa22e21078e13dd31ba606780f87a042274dd7ece128'
        prefix=(root.parent/'source-provenance-prefix.b85').read_bytes()
        assert len(prefix)==16000 and hashlib.sha256(prefix).hexdigest()==PROVENANCE_PREFIX_SHA256
        PROVENANCE_B85=prefix.decode('ascii')+PROVENANCE_SUFFIX_B85
        raw=zlib.decompress(base64.b85decode(PROVENANCE_B85))
