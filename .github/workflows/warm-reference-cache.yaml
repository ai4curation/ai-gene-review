://www.informatics.jax.org/homology/GOGraph/Abhd12) links mouse Q99LR1 to PMID:27307232 for protein depalmitoylation, cytoplasm and dendrite cytoplasm, and to PMID:22632720 for AMPA-complex membership."\n      },\n      {\n        "path": "genes/human/ABHD12/ABHD12-notes.md",\n        "type": "explicit_source_citation",\n        "line": 32,\n        "text": "[PMID:27307232, PMC5015780](https://pmc.ncbi.nlm.nih.gov/articles/PMC5015780/) was recovered as indexed original Methods/Results with the title and ABHD12, and `\\"PMC5015780\\" \\"Figure 3\\" \\"ABHD12\\"`. Mouse Abhd12 NM_024465 is explicitly in the cDNA screen. Figure 1 measures reduced PSD-95 palmitate labeling after ABHD12 coexpression in HEK293T, with a smaller effect than ABHD17. Figure 3A compares FLAG-tagged proteins in rat hippocampal neurons. The detailed neuronal catalytic-mutant, endogenous-substrate and knockdown work concerns ABHD17; it should not be borrowed for ABHD12. Thus the protein-hydrolase and dendritic assertions are retained as bounded secondary annotations, while the broad cytoplasm term remains true for the established intracellular membrane pool. Cytoplasm is not a synonym for soluble cytosol. No source failure is inferred from the ABHD17-centered title."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "29449373",\n    "mode": "fetch_missing",\n    "genes": [\n      "AHI1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 58,\n        "text": "| 2018 | Medium | AHI1 loss in Ahi1-KO mice downregulates tyrosine hydroxylase (TH) in the midbrain. Rev-Erb\\u03b1 (a TH transcriptional repressor) and BMAL1 (Rev-Erb\\u03b1 transcriptional regulator) are upregulated in Ahi1-KO midbrains. AHI1 decreases BMAL1/Rev-Erb\\u03b1 expression by interacting with and repressing ROR\\u03b1 (a nuclear receptor and circadian gene transcriptional regulator). Bmal1 deficiency reverses TH reduction caused by Ahi1 deficiency. Rev-Erb\\u03b1 inhibitor microinfusion into ventral midbrain of Ahi1-KO mice increases TH and improves depressive symptoms. | PMID:29449373 | The Journal of biological chemistry |"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 92,\n        "text": "- PMID:29449373"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-notes.md",\n        "type": "explicit_source_citation",\n        "line": 821,\n        "text": "PMID:29449373, PMID:30949029, PMID:31062249, PMID:33782379, PMID:34218273,"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "30420694",\n    "mode": "fetch_missing",\n    "genes": [\n      "ABHD12"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ABHD12/ABHD12-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 738,\n        "text": "and PMID:30420694; the latter also demonstrates lysoPS elevation in primary human macrophages after"\n      },\n      {\n        "path": "genes/human/ABHD12/ABHD12-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 744,\n        "text": "- reference_id: PMID:30420694"\n      },\n      {\n        "path": "genes/human/ABHD12/ABHD12-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1230,\n        "text": "- id: PMID:30420694"\n      },\n      {\n        "path": "genes/human/ABHD12/ABHD12-notes.md",\n        "type": "explicit_source_citation",\n        "line": 23,\n        "text": "- [PMID:30420694, PubMed](https://pubmed.ncbi.nlm.nih.gov/30420694/): verified primary abstract reports selective DO264-dependent lysoPS elevation in mouse brain and primary human macrophages. Infection and hearing comparisons are mouse results. These support context-dependent inflammatory regulation; exact assay-level selectivity details were not newly verified from full text."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "30949029",\n    "mode": "fetch_missing",\n    "genes": [\n      "AHI1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 61,\n        "text": "| 2019 | High | Mutant Ahi1 lacking intact WD40 repeats (generated by morpholino or CRISPR/Cas9 truncation in zebrafish) causes retinal ganglion cell axon misprojection and ocular dysplasia, whereas ahi1 null zebrafish show normal RGC axon projection and ocular morphology, demonstrating that the aberrant retinal axon projection phenotype is caused by a toxic gain-of-function of truncated Ahi1 rather than loss of Ahi1. | PMID:30949029 | Frontiers in cellular neuroscience |"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 93,\n        "text": "- PMID:30949029"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-notes.md",\n        "type": "explicit_source_citation",\n        "line": 821,\n        "text": "PMID:29449373, PMID:30949029, PMID:31062249, PMID:33782379, PMID:34218273,"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "31062249",\n    "mode": "fetch_missing",\n    "genes": [\n      "AHI1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 24,\n        "text": "AHI1 (Jouberin) is a modular SH3- and WD40-repeat scaffolding/adaptor protein that operates at the primary cilium transition zone and in neuronal cytoplasmic signaling, with loss-of-function mutations causing Joubert syndrome featuring cerebellar malformation and abnormal axonal decussation [PMID:15322546, PMID:15467982]. At the ciliary base, AHI1 localizes to the mother centriole/basal body, where its recruitment to a ring-shaped transition-zone domain depends on Cby1, and where it is required for ciliogenesis and polarized vesicular trafficking by stabilizing the small GTPase Rab8a [PMID:19625297, PMID:25103236]. AHI1 governs ciliary cargo: it sustains Arl13b ciliary membrane localization and proteasomal stability to support Sonic hedgehog signaling and proper axoneme length, mediates outer-segment protein transport in photoreceptors, and targets the GPCRs MCHR1 to the ciliary membrane for downstream cAMP/ERK signaling [PMID:20592197, PMID:31391239, PMID:33741721]. Its WD40 region binds NPHP1, and Joubert/retinitis pigmentosa mutations in this region destabilize AHI1 and impair its ciliary-base enrichment, whereas the C-terminal SH3 domain is dispensable for normal development [PMID:23532844, PMID:25616960, PMID:28442542]. In neurons AHI1 forms a stable complex with HAP1 that regulates TrkB receptor endocytic sorting and signaling, and AHI1 controls additional partners including 5-HT2CR, Cend1, GR, and APP to influence neurite outgrowth, feeding behavior, and stress-related/depressive phenotypes [PMID:18636121, PMID:20956301, PMID:22123816, PMID:23658157, PMID:31062249, PMID:33782379]. Beyond ciliary and neuronal roles, AHI1 has hematopoietic and immune functions: an AHI-1/BCR-ABL/JAK2 complex assembled via its SH3 domain modulates JAK2-STAT5 phosphorylation and tyrosine kinase inhibitor resistance in leukemia, and AHI1 recruits the deubiquitinase OTUD1 to stabilize Tyk2 and maintain basal type-I interferon signaling [PMID:18936234, PMID:22623184, PMID:35821088]."\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 60,\n        "text": "| 2019 | Medium | AHI1 physically interacts with APP (amyloid precursor protein) in mouse brain and transfected cells. AHI1 expression facilitates intracellular translocation of APP and inhibits APP amyloidogenic processing, reducing APP-CTF\\u03b2 and secreted A\\u03b242. AHI1 is reduced in AD model cells (expressing Swedish/Indiana APP) and in 3xTg-AD mouse brain. AHI1-APP interaction enhances Erk activation and restores cell survival and differentiation. | PMID:31062249 | Molecular neurobiology |"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 94,\n        "text": "- PMID:31062249"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-notes.md",\n        "type": "explicit_source_citation",\n        "line": 821,\n        "text": "PMID:29449373, PMID:30949029, PMID:31062249, PMID:33782379, PMID:34218273,"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "33571455",\n    "mode": "fetch_missing",\n    "genes": [\n      "ABHD12"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ABHD12/ABHD12-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1242,\n        "text": "- id: PMID:33571455"\n      },\n      {\n        "path": "genes/human/ABHD12/ABHD12-notes.md",\n        "type": "explicit_source_citation",\n        "line": 24,\n        "text": "- [PMID:33571455, PMC7611549](https://pmc.ncbi.nlm.nih.gov/articles/PMC7611549/): indexed full Results/Table 1/Figure 1 and 6 descriptions were read through title and `\\"PMC7611549\\" \\"HEK293T\\" \\"human ABHD12\\"` searches. Human enzyme in HEK293T membranes prefers very-long-chain synthetic R-Me-lysoPS substrates. These are methyl esters; carboxylesterase conversion makes them useful surrogates/prodrugs, but they should not be silently described as unmodified natural substrates. Mouse knockout tissue and mast-cell experiments, and human THP1 lipid treatments, are separate scopes."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "33782379",\n    "mode": "fetch_missing",\n    "genes": [\n      "AHI1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 24,\n        "text": "AHI1 (Jouberin) is a modular SH3- and WD40-repeat scaffolding/adaptor protein that operates at the primary cilium transition zone and in neuronal cytoplasmic signaling, with loss-of-function mutations causing Joubert syndrome featuring cerebellar malformation and abnormal axonal decussation [PMID:15322546, PMID:15467982]. At the ciliary base, AHI1 localizes to the mother centriole/basal body, where its recruitment to a ring-shaped transition-zone domain depends on Cby1, and where it is required for ciliogenesis and polarized vesicular trafficking by stabilizing the small GTPase Rab8a [PMID:19625297, PMID:25103236]. AHI1 governs ciliary cargo: it sustains Arl13b ciliary membrane localization and proteasomal stability to support Sonic hedgehog signaling and proper axoneme length, mediates outer-segment protein transport in photoreceptors, and targets the GPCRs MCHR1 to the ciliary membrane for downstream cAMP/ERK signaling [PMID:20592197, PMID:31391239, PMID:33741721]. Its WD40 region binds NPHP1, and Joubert/retinitis pigmentosa mutations in this region destabilize AHI1 and impair its ciliary-base enrichment, whereas the C-terminal SH3 domain is dispensable for normal development [PMID:23532844, PMID:25616960, PMID:28442542]. In neurons AHI1 forms a stable complex with HAP1 that regulates TrkB receptor endocytic sorting and signaling, and AHI1 controls additional partners including 5-HT2CR, Cend1, GR, and APP to influence neurite outgrowth, feeding behavior, and stress-related/depressive phenotypes [PMID:18636121, PMID:20956301, PMID:22123816, PMID:23658157, PMID:31062249, PMID:33782379]. Beyond ciliary and neuronal roles, AHI1 has hematopoietic and immune functions: an AHI-1/BCR-ABL/JAK2 complex assembled via its SH3 domain modulates JAK2-STAT5 phosphorylation and tyrosine kinase inhibitor resistance in leukemia, and AHI1 recruits the deubiquitinase OTUD1 to stabilize Tyk2 and maintain basal type-I interferon signaling [PMID:18936234, PMID:22623184, PMID:35821088]."\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 62,\n        "text": "| 2021 | Medium | Ahi1 regulates the nuclear translocation of glucocorticoid receptor (GR): stress-mediated GR nuclear translocation reduces Ahi1 in stressed cells and mouse brains. Ahi1 interacts with GR to stabilize each other in the cytoplasm. Ahi1 deficiency promotes GR degradation in the cytoplasm and reduces GR nuclear translocation in response to stress. Ahi1-KO mice show hyposensitivity to antidepressants under stress. | PMID:33782379 | Translational psychiatry |"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 97,\n        "text": "- PMID:33782379"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-notes.md",\n        "type": "explicit_source_citation",\n        "line": 821,\n        "text": "PMID:29449373, PMID:30949029, PMID:31062249, PMID:33782379, PMID:34218273,"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "34218273",\n    "mode": "fetch_missing",\n    "genes": [\n      "AHI1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 64,\n        "text": "| 2021 | Medium | Chronic stress induces abnormal nuclear translocation of Tet2. Ahi1 physically interacts with Tet2 (identified by Tet2 immunoprecipitation and mass spectrometry). Ahi1 knockout or knockdown causes accumulation of Tet2 in the cytosol. Reduction of Ahi1 protein under chronic stress explains Ahi1-dependent Tet2 nuclear translocation defects. | PMID:34218273 | Human molecular genetics |"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 98,\n        "text": "- PMID:34218273"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-notes.md",\n        "type": "explicit_source_citation",\n        "line": 821,\n        "text": "PMID:29449373, PMID:30949029, PMID:31062249, PMID:33782379, PMID:34218273,"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "34404721",\n    "mode": "fetch_missing",\n    "genes": [\n      "ABCG5",\n      "ABCG8"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ABCG5/ABCG5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1892,\n        "text": "- id: PMID:34404721"\n      },\n      {\n        "path": "genes/human/ABCG5/ABCG5-notes.md",\n        "type": "explicit_source_citation",\n        "line": 24,\n        "text": "- [PMID:34404721 \\u2014 Molecular basis of cholesterol efflux via ABCG subfamily transporters](https://pubmed.ncbi.nlm.nih.gov/34404721/). Human G5/G8 sterol-bound structures identify a cytosolic-leaflet-accessible site and a second transmembrane site. The paper also examines ABCG1; its macrophage-to-HDL pathway must not be assigned to G5/G8 merely because both proteins occur in the article. G5/G8 supports secretion toward bile and gut lumen."\n      },\n      {\n        "path": "genes/human/ABCG5/ABCG5-notes.md",\n        "type": "explicit_source_citation",\n        "line": 55,\n        "text": "The independent ABCG8 reviewer also recovered full **PMID:16867993** (PMC4527585): mouse G5/G8 in Sf9, inside-out vesicles and purified proteoliposomes support ATP-dependent sterol mass transfer and substrate controls. Its Discussion leaves flippase versus other membrane-transfer mechanism unresolved; it does not demonstrate a soluble aqueous-pocket carrier. The historical **PMID:12208867**, **PMID:18402465**, **PMID:21209088** and **PMID:34404721** source leads remain scoped as above. Current PubMed abstract/figure captions for PMID:21209088 were rechecked. No normal cache was hand-edited to incorporate externally read text."\n      },\n      {\n        "path": "genes/human/ABCG5/ABCG5-notes.md",\n        "type": "explicit_source_citation",\n        "line": 92,\n        "text": "The exact notes-inclusive missing normal publication records are **PMID:12208867, PMID:16867993, PMID:18402465, PMID:21209088, PMID:34404721, PMID:15710224, PMID:17109865, PMID:17132608, PMID:23117815, PMID:25263431 and PMID:25612518**. Normal fetch failed 0/11 with DNS errors; none is a fabricated provider source. The four cited Reactome records are present from verified source3 recovery. These eleven publication records keep the review/PR in draft until standard retrieval and exact quote/title validation can run against them."\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 87,\n        "text": "- PMID:34404721"\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1728,\n        "text": "- id: PMID:34404721"\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1738,\n        "text": "assigned to ABCG8. Normal cache retrieval failed DNS. Verification route: https://pubmed.ncbi.nlm.nih.gov/34404721/"\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-notes.md",\n        "type": "explicit_source_citation",\n        "line": 26,\n        "text": "- **PMID:34404721**, [primary PubMed record and figures](https://pubmed.ncbi.nlm.nih.gov/34404721/) and indexed PMC8403869 Results: human sterol-bound G5G8 structures provide later ligand evidence and explain reduced nucleotide binding at the ABCG8 Walker-containing site. ABCG1\\u2019s ATP-bound experiments are separate. No new binding annotation is proposed merely to duplicate the established transport mechanism."\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-notes.md",\n        "type": "explicit_source_citation",\n        "line": 57,\n        "text": "The paired ABCG5 reviewer owned a single normal retrieval of shared new sources; `/tmp/ABCG5-notes-donors-fetch.log` ended with 0/11 and exit 1 after DNS failures, creating no records. The settled ABCG8 notes-inclusive missing set is **PMID:15710224, PMID:16867993, PMID:17109865, PMID:23117815, PMID:25263431 and PMID:34404721**. All seven seeded PMID records and all four cited Reactome records are present. Reactome disease summaries are interpreted as mutant-event context, not wild-type transport assays; the expression event treats ABCG8 as the regulated product."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "34714331",\n    "mode": "fetch_missing",\n    "genes": [\n      "AGRN"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AGRN/AGRN-deep-research-perplexity.md",\n        "type": "preserved_provider_citation",\n        "line": 191,\n        "text": "10. https://pubmed.ncbi.nlm.nih.gov/34714331/"\n      },\n      {\n        "path": "genes/human/AGRN/AGRN-notes.md",\n        "type": "explicit_source_citation",\n        "line": 117,\n        "text": "PMID:22302937, PMID:26610917, PMID:34714331, PMID:35948834, PMID:36609795,"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "35643536",\n    "mode": "fetch_missing",\n    "genes": [\n      "AHI1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 66,\n        "text": "| 2022 | Medium | Ahi1 regulates serotonin production via the GR/ER\\u03b2/TPH2 pathway: GR acts as a transcription factor that binds to the ER\\u03b2 promoter glucocorticoid response elements and inhibits ER\\u03b2 transcription. Ahi1 regulates GR nuclear translocation (established in prior work), thereby modulating the ER\\u03b2/TPH2 serotonin synthesis pathway. Brain E2 (17\\u03b2-estradiol) levels decrease 