        PROVENANCE_PREFIX_SHA256 = '1a50aa303fcab19038faa91f6f63d57fb6242970f68c3b78e7b004623e0a4460'
        PROVENANCE_SHA256 = '43c3a5559c50e8701263067e0dca2c3b771dce7e9911eb6196dd04e4b1b0f799'
        prefix=(root.parent/'source-provenance-prefix.b85').read_bytes()
        assert len(prefix)==12000 and hashlib.sha256(prefix).hexdigest()==PROVENANCE_PREFIX_SHA256
        PROVENANCE_B85=prefix.decode('ascii')+PROVENANCE_SUFFIX_B85
        raw=zlib.decompress(base64.b85decode(PROVENANCE_B85))
        assert hashlib.sha256(raw).hexdigest()==PROVENANCE_SHA256
        with (root/'source-list-provenance.json').open('xb') as handle:handle.write(raw)
