/jcb_201709028.pdf) was read. Figures 2\\u20134 directly analyze human RPE1 CCP1-null cells and mitochondrial morphology/fusion. Figure 5 compares enzymatically active and inactive CCP1 under stress. Mouse neurons provide motility measurements. Reduced Drp1 dosage rescues fly phenotypes but the tested partial mouse reduction does not rescue pcd degeneration. The work supports a non-core organization role; its proposed tubulin/motility-to-fusion mechanism is not proof of an intramitochondrial catalytic substrate or a CCP1 fusion-GTPase activity."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "30420557",\n    "mode": "fetch_missing",\n    "genes": [\n      "AGTPBP1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AGTPBP1/AGTPBP1-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 47,\n        "text": "- PMID:30420557"\n      },\n      {\n        "path": "genes/human/AGTPBP1/AGTPBP1-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 725,\n        "text": "assertion. Human disease involves cerebellar atrophy, while PMID:30420557 explicitly lacks direct"\n      },\n      {\n        "path": "genes/human/AGTPBP1/AGTPBP1-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 733,\n        "text": "- PMID:30420557"\n      },\n      {\n        "path": "genes/human/AGTPBP1/AGTPBP1-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 781,\n        "text": "PMID:30420557 establishes human central/peripheral neurodegeneration, endogenous CCP1 loss and excess"\n      },\n      {\n        "path": "genes/human/AGTPBP1/AGTPBP1-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 787,\n        "text": "- PMID:30420557"\n      },\n      {\n        "path": "genes/human/AGTPBP1/AGTPBP1-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 800,\n        "text": "inaccessible. Independent human/mouse evidence in PMID:30420557 supports the broad conserved"\n      },\n      {\n        "path": "genes/human/AGTPBP1/AGTPBP1-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 920,\n        "text": "- id: PMID:30420557"\n      },\n      {\n        "path": "genes/human/AGTPBP1/AGTPBP1-notes.md",\n        "type": "explicit_source_citation",\n        "line": 47,\n        "text": "**PMID:30420557**, *Loss of tubulin deglutamylase CCP1 causes infantile-onset neurodegeneration.* The [full author manuscript](https://push-zb.helmholtz-munich.de/deliver.php?id=23189) supplies human patient fibroblast/muscle data and central/peripheral disease findings. Figure 3E/F and Methods use **mouse** CCP1-YFP variants in human HEK293 cells. The authors explicitly lacked direct human Purkinje histology and discussed a retinal phenotype difference. These boundaries matter for differentiation transfers. For the much broader [GO:0050905 neuromuscular process](https://amigo.geneontology.org/amigo/term/GO:0050905), conserved enzymology and the human/mouse nerve/muscle evidence justify non-core retention; the term is not restricted to neuromuscular-junction formation."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "37621215",\n    "mode": "fetch_missing",\n    "genes": [\n      "AGO2"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AGO2/AGO2-deep-research-falcon.md",\n        "type": "verified_doi_provider_citation",\n        "line": 265,\n        "text": "* Brothers WR et al. *The EDC4\\u2013XRN1 interaction controls P-body dynamics to link mRNA decapping with decay.* **The EMBO Journal** (Aug **2023**). https://doi.org/10.15252/embj.2023113933 (brothers2023theedc4\\u2010xrn1interaction pages 1-2)",\n        "original_doi": "10.15252/embj.2023113933",\n        "normalized_doi": "10.15252/embj.2023113933",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37621215/",\n        "primary_title": "The EDC4-XRN1 interaction controls P-body