   "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 3,\n        "text": "| Protein/complex | **AFG3L2 = human mitochondrial inner-membrane m-AAA protease subunit** (UniProt Q9Y4W6); assembles as **homo-hexamers** or **hetero-hexamers with SPG7/paraplegin** to form the matrix-facing m-AAA protease complex (pqac-00000001, pqac-00000002, pqac-00000003) | Review + primary | Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z; Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1007/s12035-023-03768-z",\n        "normalized_doi": "10.1007/s12035-023-03768-z",\n        "primary_pmid": "38012514",\n        "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 5,\n        "text": "| Catalytic activities | Dual function: **AAA+ ATPase/unfoldase-translocase** plus **zinc metalloprotease**; ATP-driven substrate engagement/translocation feeds substrates to a C-terminal Zn-dependent protease site (pqac-00000002, pqac-00000003, pqac-00000006) | Review | Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z; Khalimonchuk & Becker, 2023, *Antioxid Redox Signal*, https://doi.org/10.1089/ars.2022.0124 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1007/s12035-023-03768-z",\n        "normalized_doi": "10.1007/s12035-023-03768-z",\n        "primary_pmid": "38012514",\n        "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 16,\n        "text": "| Human disease: SCA28 | **Spinocerebellar ataxia type 28 (SCA28)**: typically **autosomal dominant**, usually from **heterozygous AFG3L2 variants**, characterized by slowly progressive gait/limb ataxia with frequent oculomotor abnormalities (pqac-00000016, pqac-00000017, pqac-00000018, pqac-00000020) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1007/s12035-023-03768-z",\n        "normalized_doi": "10.1007/s12035-023-03768-z",\n        "primary_pmid": "38012514",\n        "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 17,\n        "text": "| Human disease: DOA12 / OPA12 | **Dominant optic atrophy 12 (DOA12/OPA12)**: generally **autosomal dominant**, associated especially with **heterozygous ATPase- or catalytic-domain variants**; may overlap with ophthalmoplegia and broader mitochondrial optic neuropathy phenotypes (pqac-00000016, pqac-00000019, pqac-00000020) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1007/s12035-023-03768-z",\n        "normalized_doi": "10.1007/s12035-023-03768-z",\n        "primary_pmid": "38012514",\n        "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 18,\n        "text": "| Human disease: SPAX5 | **Spastic ataxia type 5 / early-onset spastic ataxia-neuropathy syndrome (SPAX5)**: **autosomal recessive**, caused by **biallelic AFG3L2 variants**; severe childhood-onset phenotype with cerebellar ataxia, spasticity, dystonia, neuropathy, and in some cases myoclonic epilepsy (pqac-00000016, pqac-00000018, pqac-00000019, pqac-00000020) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1007/s12035-023-03768-z",\n        "normalized_doi": "10.1007/s12035-023-03768-z",\n        "primary_pmid": "38012514",\n        "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 19,\n        "text": "| Therapeutic/diagnostic implications | Current clinical use is mainly **genetic diagnosis/variant interpretation** (NGS panels, exome-based workup for ataxia/optic neuropathy). Preclinical 2024 evidence suggests **ISR potentiation with Sephin-1** can improve SPAX5 cellular and mouse phenotypes; molecular readouts include **eIF2α phosphorylation, ATF4 targets, CHOP/CHAC1/FGF21** (pqac-00000016, pqac-00000017, pqac-00000020) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1007/s12035-023-03768-z",\n        "normalized_doi": "10.1007/s12035-023-03768-z",\n        "primary_pmid": "38012514",\n        "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "38390227",\n    "mode": "fetch_missing",\n    "genes": [\n      "AFG3L2"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 260,\n        "text": "- **Genetic variant-type distribution for SCA28**: a 2024 diagnostic review table reports **>99%** of reported SCA28 cases involve **SNVs/small intragenic indels**, with monoallelic deletion/duplication described as extremely rare, informing testing strategy. (Feb 2024; https://doi.org/10.3389/fnint.2023.1275794) (lopergolo2024autosomalrecessivecerebellar pages 4-5)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3389/fnint.2023.1275794",\n        "normalized_doi": "10.3389/fnint.2023.1275794",\n        "primary_pmid": "38390227",\n        "primary_title": "Autosomal recessive cerebellar ataxias: a diagnostic classification approach according to ocular features",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390227/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 298,\n        "text": "- Lopergolo et al., **Frontiers in Integrative Neuroscience**, **Feb 2024**: https://doi.org/10.3389/fnint.2023.1275794 (lopergolo2024autosomalrecessivecerebellar pages 4-5)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3389/fnint.2023.1275794",\n        "normalized_doi": "10.3389/fnint.2023.1275794",\n        "primary_pmid": "38390227",\n        "primary_title": "Autosomal recessive cerebellar ataxias: a diagnostic classification approach according to ocular features",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390227/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 322,\n        "text": "10. (lopergolo2024autosomalrecessivecerebellar pages 4-5): Diego Lopergolo, Francesca Rosini, Elena Pretegiani, Alessia Bargagli, Valeria Serchi, and Alessandra Rufa. Autosomal recessive cerebellar ataxias: a diagnostic classification approach according to ocular features. Frontiers in Integrative Neuroscience, Feb 2024. URL: https://doi.org/10.3389/fnint.2023.1275794, doi:10.3389/fnint.2023.1275794. This article has 10 citations.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3389/fnint.2023.1275794",\n        "normalized_doi": "10.3389/fnint.2023.1275794",\n        "primary_pmid": "38390227",\n        "primary_title": "Autosomal recessive cerebellar ataxias: a diagnostic classification approach according to ocular features",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390227/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 350,\n        "text": "13. https://doi.org/10.3389/fnint.2023.1275794",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3389/fnint.2023.1275794",\n        "normalized_doi": "10.3389/fnint.2023.1275794",\n        "primary_pmid": "38390227",\n        "primary_title": "Autosomal recessive cerebellar ataxias: a diagnostic classification approach according to ocular features",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390227/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 362,\n        "text": "25. https://doi.org/10.3389/fnint.2023.1275794,",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3389/fnint.2023.1275794",\n        "normalized_doi": "10.3389/fnint.2023.1275794",\n        "primary_pmid": "38390227",\n        "primary_title": "Autosomal recessive cerebellar ataxias: a diagnostic classification approach according to ocular features",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390227/"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "38412125",\n    "mode": "fetch_missing",\n    "genes": [\n      "AGO1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 208,\n        "text": "A 2024 PNAS study modeling disease variants reports that exome studies identified **18 de novo coding AGO1 variants** in affected children (and 12 in AGO2), linking AGO1 to **neurodevelopmental disorder (NDD)**/intellectual disability and often autism-spectrum features. (2024-02; URL: https://doi.org/10.1073/pnas.2308255121) (duan2024modelingneurodevelopmentaldisorderassociated pages 1-2)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1073/pnas.2308255121",\n        "normalized_doi": "10.1073/pnas.2308255121",\n        "primary_pmid": "38412125",\n        "primary_title": "Modeling neurodevelopmental disorder-associated human AGO1 mutations in Caenorhabditis elegans Argonaute alg-1.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38412125/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 259,\n        "text": "| Disease relevance | Strongest current human genetic link is neurodevelopmental disorder | Exome studies identified 18 de novo AGO1 coding variants in affected children; modeling of AGO1 NDD alleles in C. elegans supports disruption of miRNA biogenesis, miRISC assembly, and target repression, with antimorphic effects stronger than nulls | (duan2024modelingneurodevelopmentaldisorderassociated pages 1-2, duan2023modelingneurodevelopmentaldisorderassociated pages 1-4) | 2023 preprint; 2024 peer-reviewed; https://doi.org/10.1101/2023.04.06.535748 ; https://doi.org/10.1073/pnas.2308255121 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1073/pnas.2308255121",\n        "normalized_doi": "10.1073/pnas.2308255121",\n        "primary_pmid": "38412125",\n        "primary_title": "Modeling neurodevelopmental disorder-associated human AGO1 mutations in Caenorhabditis elegans Argonaute alg-1.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38412125/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 285,\n        "text": "10. (duan2024modelingneurodevelopmentaldisorderassociated pages 1-2): Ye Duan, Li Li, Ganesh Prabhakar Panzade, Amélie Piton, Anna Zinovyeva, and Victor Ambros. Modeling neurodevelopmental disorder-associated human ago1 mutations in caenorhabditis elegans argonaute alg-1. Proceedings of the National Academy of Sciences of the United States of America, Feb 2024. URL: https://doi.org/10.1073/pnas.2308255121, doi:10.1073/pnas.2308255121. This article has 20 citations and is from a highest quality peer-reviewed journal.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1073/pnas.2308255121",\n        "normalized_doi": "10.1073/pnas.2308255121",\n        "primary_pmid": "38412125",\n        "primary_title": "Modeling neurodevelopmental disorder-associated human AGO1 mutations in Caenorhabditis elegans Argonaute alg-1.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38412125/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 306,\n        "text": "12. https://doi.org/10.1073/pnas.2308255121",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1073/pnas.2308255121",\n        "normalized_doi": "10.1073/pnas.2308255121",\n        "primary_pmid": "38412125",\n        "primary_title": "Modeling neurodevelopmental disorder-associated human AGO1 mutations in Caenorhabditis elegans Argonaute alg-1.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38412125/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 312,\n        "text": "18. https://doi.org/10.1073/pnas.2308255121,",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1073/pnas.2308255121",\n        "normalized_doi": "10.1073/pnas.2308255121",\n        "primary_pmid": "38412125",\n        "primary_title": "Modeling neurodevelopmental disorder-associated human AGO1 mutations in Caenorhabditis elegans Argonaute alg-1.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38412125/"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "38419708",\n    "mode": "fetch_missing",\n    "genes": [\n      "ALDH7A1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ALDH7A1/ALDH7A1-deep-research-falcon.md",\n        "line": 257,\n        "text": "A Norwegian retrospective study published **14 February 2024** evaluated **13 patients and 163 EEGs**, including 101 recordings from the first year. Median seizure onset was **9 hours**; median delay to first pyridoxine injection was **2 days**. Eight patients (**62%**) had burst suppression within the first five days. Of 11 monitored during pyridoxine injections, only three showed immediate EEG improvement concordant with seizure control; clinical and electrographic responses often diverged. The authors advised continuing pyridoxine until biomarkers and genetic results are available rather than excluding PDE after one inconclusive trial. DOI/URL: https://doi.org/10.3389/fneur.2024.1355861. (arntsen2024utilityandlimitations pages 1-2)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3389/fneur.2024.1355861",\n        "normalized_doi": "10.3389/fneur.2024.1355861",\n        "primary_pmid": "38419708",\n        "primary_title": "Utility and limitations of EEG in the diagnosis and management of ALDH7A1-related pyridoxine-dependent epilepsy. A retrospective observational study.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38419708/"\n      },\n      {\n        "path": "genes/human/ALDH7A1/ALDH7A1-deep-research-falcon.md",\n        "line": 337,\n        "text": "12. (arntsen2024utilityandlimitations pages 1-2): Vibeke Arntsen, Ahmed Jamali, Alma Sikiric, Erle Kristensen, Trine Tangeraas, Guste Kupliauskiene, Sigurbjörg Stefansdottir, Laurence A. Bindoff, Trond Sand, and Eylert Brodtkorb. Utility and limitations of eeg in the diagnosis and management of aldh7a1-related pyridoxine-dependent epilepsy. a retrospective observational study. Frontiers in Neurology, Feb 2024. URL: https://doi.org/10.3389/fneur.2024.1355861, doi:10.3389/fneur.2024.1355861. This article has 6 citations and is from a peer-reviewed journal.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3389/fneur.2024.1355861",\n        "normalized_doi": "10.3389/fneur.2024.1355861",\n        "primary_pmid": "38419708",\n        "primary_title": "Utility and limitations of EEG in the diagnosis and management of ALDH7A1-related pyridoxine-dependent epilepsy. A retrospective observational study.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38419708/"\n      },\n      {\n        "path": "genes/human/ALDH7A1/ALDH7A1-deep-research-falcon.md",\n        "line": 337,\n        "text": "12. (arntsen2024utilityandlimitations pages 1-2): Vibeke Arntsen, Ahmed Jamali, Alma Sikiric, Erle Kristensen, Trine Tangeraas, Guste Kupliauskiene, Sigurbjörg Stefansdottir, Laurence A. Bindoff, Trond Sand, and Eylert Brodtkorb. Utility and limitations of eeg in the diagnosis and management of aldh7a1-related pyridoxine-dependent epilepsy. a retrospective observational study. Frontiers in Neurology, Feb 2024. URL: https://doi.org/10.3389/fneur.2024.1355861, doi:10.3389/fneur.2024.1355861. This article has 6 citations and is from a peer-reviewed journal.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3389/fneur.2024.1355861",\n        "normalized_doi": "10.3389/fneur.2024.1355861",\n        "primary_pmid": "38419708",\n        "primary_title": "Utility and limitations of EEG in the diagnosis and management of ALDH7A1-related pyridoxine-dependent epilepsy. A retrospective observational study.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38419708/"\n      },\n      {\n        "path": "genes/human/ALDH7A1/ALDH7A1-deep-research-falcon.md",\n        "line": 360,\n        "text": "12. https://doi.org/10.3389/fneur.2024.1355861.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3389/fneur.2024.1355861",\n        "normalized_doi": "10.3389/fneur.2024.1355861",\n        "primary_pmid": "38419708",\n        "primary_title": "Utility and limitations of EEG in the diagnosis and management of ALDH7A1-related pyridoxine-dependent epilepsy. A retrospective observational study.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38419708/"\n      },\n      {\n        "path": "genes/human/ALDH7A1/ALDH7A1-deep-research-falcon.md",\n        "line": 374,\n        "text": "26. https://doi.org/10.3389/fneur.2024.1355861,",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3389/fneur.2024.1355861",\n        "normalized_doi": "10.3389/fneur.2024.1355861",\n        "primary_pmid": "38419708",\n        "primary_title": "Utility and limitations of EEG in the diagnosis and management of ALDH7A1-related pyridoxine-dependent epilepsy. A retrospective observational study.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38419708/"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "38750021",\n    "mode": "fetch_missing",\n    "genes": [\n      "ACTB"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 151,\n        "text": "- Nuclear actin regulating chromatin accessibility (Nature Communications 2024): In human mesenchymal stem cells, Arp2/3 inhibition (CK666) decreased nuclear actin structure and broadly altered chromatin accessibility by ATAC-seq at 24 h; cytochalasin D increased nuclear actin and induced distinct accessibility changes. CK666 reduced pericentric H3K9me3, while cytoD caused central redistribution of H3K27me3; Arp4 knockdown unpacked chromatin but only modestly increased transcription, implicating actin–Arp4 in transcriptional control. URL: https://doi.org/10.1038/s41467-024-48580-y (May 2024). (sen2024nuclearactinstructure pages 1-2)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1038/s41467-024-48580-y",\n        "normalized_doi": "10.1038/s41467-024-48580-y",\n        "primary_pmid": "38750021",\n        "primary_title": "Nuclear actin structure regulates chromatin accessibility.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38750021/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 168,\n        "text": "- Nuclear chromatin metrics: CK666 (Arp2/3 inhibitor) reduced nuclear actin structure and significantly altered ATAC-seq chromatin accessibility at 24 h; CK666 decreased pericentric H3K9me3 foci, while cytochalasin D redistributed H3K27me3 centrally—consistent with distinct differentiation outcomes. Publication date: May 2024. URL: https://doi.org/10.1038/s41467-024-48580-y. (sen2024nuclearactinstructure pages 1-2)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1038/s41467-024-48580-y",\n        "normalized_doi": "10.1038/s41467-024-48580-y",\n        "primary_pmid": "38750021",\n        "primary_title": "Nuclear actin structure regulates chromatin accessibility.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38750021/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 177,\n        "text": "| Nuclear actin → chromatin accessibility | In MSCs, Arp2/3 inhibition (CK666) reduced nuclear actin and caused widespread ATAC-seq accessibility changes distinct from cytochalasin D (which increased nuclear actin); CK666 decreased pericentric H3K9me3 while CytoD redistributed H3K27me3, linking nuclear F-actin remodeling to chromatin state and differentiation. (sen2024nuclearactinstructure pages 1-2) | Human mesenchymal stem cells (MSCs) | ATAC-seq, imaging, histone immunostaining, genetic knockdowns | Nature Communications | May 2024 | https://doi.org/10.1038/s41467-024-48580-y (sen2024nuclearactinstructure pages 1-2) |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1038/s41467-024-48580-y",\n        "normalized_doi": "10.1038/s41467-024-48580-y",\n        "primary_pmid": "38750021",\n        "primary_title": "Nuclear actin structure regulates chromatin accessibility.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38750021/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 201,\n        "text": "4. (sen2024nuclearactinstructure pages 1-2): Buer Sen, Zhihui Xie, Michelle D. Thomas, Samantha G. Pattenden, Sean Howard, Cody McGrath, Maya Styner, Gunes Uzer, Terrence S. Furey, and Janet Rubin. Nuclear actin structure regulates chromatin accessibility. Nature Communications, May 2024. URL: https://doi.org/10.1038/s41467-024-48580-y, doi:10.1038/s41467-024-48580-y. This article has 29 citations and is from a