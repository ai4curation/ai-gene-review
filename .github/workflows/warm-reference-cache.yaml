name: ClinGen reference recovery batch 100
run-name: Reference recovery batch 100 at ${{ github.ref_name }} (${{ github.sha }})
"on":
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: clingen-reference-recovery100-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-reference-fetch100-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Set isolated runtime paths after runner initialization
      run: |
        python - <<'PYENV'
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-reference-recovery100'
        with Path(os.environ['GITHUB_ENV']).open('a') as out:
            out.write('UV_CACHE_DIR='+str(root/'uv-cache')+'\n')
            out.write('UV_PROJECT_ENVIRONMENT='+str(root/'venv')+'\n')
        PYENV
    - name: Initialize fixed source requests and partial report
      run: |
        python - <<'PYINIT'
        from pathlib import Path
        import json, os, base64, zlib, hashlib
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-reference-recovery100'/'artifact'
        root.mkdir(parents=True)
        REQUESTS_B85 = 'c-pO0OHbQC5We#(MmfiJ0t67f6%Iuz4Wg(Qf~>W791pB_SNljvQU7~qoj8Q{RH=tN=CR+*eBbOo9s#`Z2VnF<T8=JZWIK|h@zzJZ=j3>HHk+NE58lp5O#TK#-Ig7BPkK27m#EQm^szVD@%iigYWjUP>g}gpR!u<!GWsy{ZTHLJu(5rG6*_7NWogzLT{)a8y%yHDChUs#XRHWqIukluIBd|Nt}&}c-C|Y=?sPhtWD-3sbuj>C1CTF-_vn3xI^@sZ=tE@VXh~YA@?T2y9cR{2C)_3@$-opge_<=qY0|R;SHRbhs%*^#i?CpGv6o>n8XqDstm?_y5e=zJ!!l3}E8$4!;Gq`LBM8vAhD0uy2EL%{g!V6+>@G?rUchg(bf&{YbZIDIPbc|wa&l4l)9LBSSvEPIWRr`t^KAA(f$gwmbSj-`L$Lm`C~T}cl)0`e%C+ipO>Mq3t74d^IK<d1{y)GRt_ar*=1p`pmcBOIy}F;zAHboI5L$%VbXH+Vq%>5MP;eKkTa+LwADpNI2rZ#Y0`sE7-R;#r@(H*hMZQG`y%5Fq{HEBTaE$7lsf-f=$2~wQwXbl+!v9EFyG;aqwTeSQZQ$9E_FU%Xy5L&;&6qhntPQl06-xpWCRO{kqT?0fVSF7~VTT~e2ktYbu4E413^Y-x%nFNc3=J(KCm9DmS{^%Xd{0Fhjd)X(AZ8evl+n`$`{n&8wppPTd;!YJL@imXJ+rAVUsJjrWn+{w>u5dj`+^pA0^=bEq2DPP%Jj$I3EqywBDl!m4#6Um-9;auVo0b=XrV&x7ol;8KQV`UthqbK=>6pcu@a<2MJmBdgC4XAKrH*_fSg2%V56r1w#)Nj=1y3fR<rx#UEF2-+CFhd>EF}QZ+jiDJO'
        REQUESTS_SHA256 = 'b53108dcffa17d618059bf1cee8d497b0928005821875ff61e693959694313a1'
        def decoded(payload, expected):
            raw=zlib.decompress(base64.b85decode(payload))
            if hashlib.sha256(raw).hexdigest()!=expected:
                raise ValueError('Embedded source provenance checksum mismatch')
            return raw
        (root/'requests.json').write_bytes(decoded(REQUESTS_B85, REQUESTS_SHA256))
        receipt={key:os.environ[key] for key in ['GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']}
