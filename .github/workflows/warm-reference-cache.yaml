name: One normal AKR1D1 Reactome diagnostic
run-name: R-HSA-193755 normal fetch diagnostic at ${{ github.sha }}
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: normal-akr1d1-reactome-diagnostic
  cancel-in-progress: false
jobs:
  fetch:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' && github.ref
      == 'refs/heads/cmungall/clingen-source-seed-fetch65-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Initialize isolated outputs and exact runtime identity
      run: |
        python - <<'PY'
        import hashlib, json, os, pathlib, subprocess
        root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'normal-akr1d1-reactome-diagnostic'
        artifact = root / 'artifact'
        artifact.mkdir(parents=True, exist_ok=False)
        (artifact / 'raw').mkdir()
        expected = {
            'src': 'b6437edffc6d0f26c93fd72c8c1cbd62aaae0256',
            'pyproject.toml': 'aedefcdb55d98c43bb2bf7fb6ff527c8edfeeff6',
            'uv.lock': '311083db700f38b31e9c31d22cb3a9a4f31788fa',
            'src/ai_gene_review/etl/reactome.py': '0a41c552936b2d19c271ab45bce6c4c092f17cf2',
        }
        observed = {p: subprocess.check_output(['git', 'rev-parse', 'HEAD:' + p], text=True).strip() for p in expected}
        receipt = {k: os.environ[k] for k in ('GITHUB_REPOSITORY', 'GITHUB_REF', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
        receipt.update(gene='AKR1D1', reactome_id='R-HSA-193755',
                       expected_runtime_objects=expected, observed_runtime_objects=observed,
                       status='initialized', import_authorized=False,
                       source_attempts=1, diagnostic_body_importable=False)
        (artifact / 'run-receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
        assert observed == expected, 'Normal code or dependency input changed'
        assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == receipt['GITHUB_SHA']
        with open(os.environ['GITHUB_ENV'], 'a') as out:
            out.write('AKR_DIAGNOSTIC_ROOT=' + str(root) + '\n')
            out.write('UV_CACHE_DIR=' + str(root / 'uv-cache') + '\n')
            out.write('UV_PROJECT_ENVIRONMENT=' + str(root / 'venv') + '\n')
        PY
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false
    - name: Install unchanged locked normal fetcher
      timeout-minutes: 15
      run: uv sync --frozen --no-dev --no-editable
    - name: Observe one unchanged normal Reactome cache attempt
      timeout-minutes: 3
      run: |
        "$UV_PROJECT_ENVIRONMENT/bin/python" - <<'PY'
        """One normal Reactome cache attempt; transparent, non-importable diagnostics."""
        import contextlib
        import datetime
        import hashlib
        import importlib.metadata
        import json
        import os
        from pathlib import Path
        import sys

        TARGET = 'R-HSA-193755'
        URL = 'https://reactome.org/ContentService/data/query/' + TARGET
        MODULE_SHA256 = '3d7c876c4b2d6019d99f5c5268fb0be17a5ef8cf08f1bbabace7b651e3b77954'
        BODY_LIMIT = 4 * 1024 * 1024
        HEADERS = ('Content-Type', 'Content-Length', 'Content-Encoding', 'Date',
                   'ETag', 'Last-Modified', 'Retry-After')


        def now():
            return datetime.datetime.now(datetime.timezone.utc).isoformat()


        def write_json(path, value):
            path.write_text(json.dumps(value, indent=2) + '\n')


        def observe_normal_fetch(module, artifact):
            """Return the unaltered normal result, plus observations, after one call."""
            output_dir = artifact / 'raw' / 'reactome'
            assert not output_dir.exists(), 'Requires a fresh isolated output directory'
            diagnostic_dir = artifact / 'diagnostics'
            diagnostic_dir.mkdir(exist_ok=False)
            observation = {'target': TARGET, 'normal_url': URL, 'started_utc': now(),
                           'calls': [], 'observation_errors': [], 'import_authorized': False,
                           'body_semantics': 'requests.response.content: decoded response bytes, not wire-compressed bytes'}
            original_get = module.requests.get

            def observed_get(*args, **kwargs):
                call = {'number': len(observation['calls']) + 1,
                        'arguments_match_normal': args == (URL,) and kwargs == {'timeout': 10},
                        'started_utc': now()}
                observation['calls'].append(call)
                try:
                    response = original_get(*args, **kwargs)
                except Exception as exc:
                    call.update(exception_type=type(exc).__name__, exception_message=str(exc),
                                finished_utc=now())
                    raise
                # Never change the response, request parameters, exception or formatter.
                # An observation write failure must not change the normal fetch result.
                try:
                    body = response.content
                    call.update(status_code=response.status_code, final_url=response.url,
                                redirects=[{'status_code': r.status_code, 'url': r.url} for r in response.history],
                                headers={k: response.headers[k] for k in HEADERS if k in response.headers},
                                body_bytes=len(body), body_sha256=hashlib.sha256(body).hexdigest(),
                                body_saved_complete=len(body) <= BODY_LIMIT)
                    if len(body) <= BODY_LIMIT:
                        body_path = diagnostic_dir / ('response-' + str(call['number']) + '.body')
                        with body_path.open('xb') as stream:
                            stream.write(body)
                        call['body_path'] = body_path.relative_to(artifact).as_posix()
                except Exception as exc:
                    observation['observation_errors'].append({'call': call['number'],
                        'type': type(exc).__name__, 'message': str(exc)})
                call['finished_utc'] = now()
                return response

            module.requests.get = observed_get
            try:
                with (artifact / 'normal-fetch.log').open('x') as log:
                    with contextlib.redirect_stdout(log), contextlib.redirect_stderr(log):
                        success = module.cache_reactome_pathway(TARGET, output_dir=output_dir, force=False)
            finally:
                module.requests.get = original_get
                observation['finished_utc'] = now()
                write_json(diagnostic_dir / 'http-observation.json', observation)
            return success, observation


        def main():
            from ai_gene_review.etl import reactome
            artifact = Path(os.environ['AKR_DIAGNOSTIC_ROOT']) / 'artifact'
            source = Path(reactome.__file__).read_bytes()
            assert hashlib.sha256(source).hexdigest() == MODULE_SHA256, 'Installed normal module differs'
            report = {'target': TARGET, 'function': 'ai_gene_review.etl.reactome.cache_reactome_pathway',
                      'arguments': {'reactome_id': TARGET, 'force': False, 'output_dir': 'raw/reactome'},
                      'normal_function_attempts': 1, 'python': sys.version,
                      'package_version': importlib.metadata.version('ai_gene_review'),
                      'installed_module_sha256': hashlib.sha256(source).hexdigest(),
                      'started_utc': now(), 'status': 'started', 'import_authorized': False}
            write_json(artifact / 'fetch-report.json', report)
            try:
                success, observation = observe_normal_fetch(reactome, artifact)
                calls = observation['calls']
                output = artifact / 'raw/reactome' / (TARGET + '.md')
                diagnostic_complete = (len(calls) == 1 and calls[0]['arguments_match_normal']
                    and not observation['observation_errors']
                    and ('exception_type' in calls[0] or calls[0].get('body_saved_complete') is True))
                report.update(normal_success=success, observed_get_calls=len(calls),
                              diagnostic_complete=diagnostic_complete,
                              output_exists=output.is_file() and not output.is_symlink(),
                              status='normal_fetch_success_pending_identity_review' if success else 'normal_fetch_failed_diagnostic_only')
                if output.is_file() and not output.is_symlink():
                    raw = output.read_bytes()
                    report['candidate_output'] = {'path': output.relative_to(artifact).as_posix(),
                        'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
                if success and (not diagnostic_complete or not report['output_exists']):
                    report['status'] = 'incomplete_requires_inspection'
            except Exception as exc:
                report.update(status='incomplete_requires_inspection', exception_type=type(exc).__name__, exception_message=str(exc))
            report['finished_utc'] = now()
            write_json(artifact / 'fetch-report.json', report)
            # A failed normal fetch remains a failed job; diagnostics are always uploaded.
            return 0 if report['status'] == 'normal_fetch_success_pending_identity_review' else 1


        if __name__ == '__main__':
            raise SystemExit(main())

        PY
    - name: Verify checkout unchanged
      if: ${{ always() }}
      run: |
        git diff --exit-code
        git diff --cached --exit-code
        test -z "$(git ls-files --others --exclude-standard)"
    - name: Inventory exact raw outputs and controls
      if: ${{ always() }}
      run: |
        python - <<'PY'
        import hashlib, json, os, pathlib
        artifact = pathlib.Path(os.environ['RUNNER_TEMP']) / 'normal-akr1d1-reactome-diagnostic/artifact'
        entries = []
        for p in sorted(artifact.rglob('*')):
            assert not p.is_symlink(), 'Unexpected symlink in output'
            if p.is_file():
                raw = p.read_bytes()
                entries.append({'path': p.relative_to(artifact).as_posix(), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()})
        (artifact / 'manifest.json').write_text(json.dumps({'files': entries, 'import_authorized': False,
            'family_outputs': 'quarantined; not eligible for gene or source import'}, indent=2) + '\n')
        PY
    - uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: normal-akr1d1-reactome-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/normal-akr1d1-reactome-diagnostic/artifact/
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: false
        overwrite: false
