26 Å) forces the second protomer into an F-actin-like state, forming a knot-like interaction with the first three subunits. These conformations explain end-specific kinetics and capping mechanisms. URL: https://doi.org/10.1126/science.adg6812 (Jun 2023); commentary: https://doi.org/10.1002/cm.21770 (Aug 2023). (carman2023structuresofthe pages 10-14, carman2023structuresofthe pages 7-10, carman2023structuresofthe pages 3-4, barrie2023conformationofactin pages 1-2, barrie2023conformationofactin pages 4-6)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1126/science.adg6812",\n        "normalized_doi": "10.1126/science.adg6812",\n        "primary_pmid": "37228182",\n        "primary_title": "Structures of the free and capped ends of the actin filament.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37228182/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 167,\n        "text": "- Cryo-EM resolutions and conformational metrics: Free barbed end 3.30 Å; CapZ-capped barbed 2.79 Å; free pointed 2.84 Å; Tmod-capped pointed 3.26 Å. Observed shifts included ~2.0 Å C-terminus movement at barbed end and ~15° CapZβ rotation; short-pitch pair splaying ~1.5 Å and ~2° rotation at terminal subunit. Publication date: June 2023. URL: https://doi.org/10.1126/science.adg6812. (carman2023structuresofthe pages 3-4, carman2023structuresofthe pages 10-14)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1126/science.adg6812",\n        "normalized_doi": "10.1126/science.adg6812",\n        "primary_pmid": "37228182",\n        "primary_title": "Structures of the free and capped ends of the actin filament.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37228182/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 175,\n        "text": "| Cryo-EM F-actin ends & capping 