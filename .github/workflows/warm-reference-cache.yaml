y. Full body was not read in this follow-up; the normal cache attempt failed DNS."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "32271162",\n    "mode": "fetch_missing",\n    "genes": [\n      "AGRN"\n    ],\n    "citations": [\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-perplexity.md",\n        "line": 193,\n        "text": "12. https://insight.jci.org/articles/view/132023",\n        "mapped_pmid": "32271162",\n        "title": "Congenital myasthenic syndrome-associated agrin variants affect clustering of acetylcholine receptors in a domain-specific manner",\n        "doi": "10.1172/jci.insight.132023",\n        "pmcid": "PMC7205260",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/32271162/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "32328026",\n    "mode": "fetch_missing",\n    "genes": [\n      "AGRN"\n    ],\n    "citations": [\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-perplexity.md",\n        "line": 187,\n        "text": "6. https://www.frontiersin.org/journals/neurology/articles/10.3389/fneur.2020.00239/epub",\n        "mapped_pmid": "32328026",\n        "title": "Novel NtA and LG1 Mutations in Agrin in a Single Patient Causes Congenital Myasthenic Syndrome.",\n        "doi": "10.3389/fneur.2020.00239",\n        "pmcid": "PMC7160337",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/32328026/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "36248738",\n    "mode": "fetch_missing",\n    "genes": [\n      "ACTB"\n    ],\n    "citations": [\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/ACTB/ACTB-deep-research-cyberian.md",\n        "line": 239,\n        "text": "16. **vanri-2022-nterminal-processing-abstract**: Vanri M, et al. Differential N-terminal processing of beta and gamma actin. *iScience.* 2022;25(10):105181. DOI: 10.1016/j.isci.2022.105181. PMCID: PMC9556930. https://pmc.ncbi.nlm.nih.gov/articles/PMC9556930/",\n        "mapped_pmid": "36248738",\n        "title": "Differential N-terminal processing of beta and gamma actin.",\n        "doi": "10.1016/j.isci.2022.105186",\n        "pmcid": "PMC9556930",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/36248738/",\n        "reviewed_source_scope": "Adjacent provider DOI 105181 is wrong but PMCID identifies genuine cited processing study."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "38390858",\n    "mode": "fetch_missing",\n    "genes": [\n      "AGRN"\n    ],\n    "citations": [\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 155,\n        "text": "- Cardiac regeneration: Summaries of preclinical studies show that recombinant agrin administered post-myocardial infarction in mice and swine improves ejection fraction, reduces scar, and promotes cardiomyocyte proliferation, acting via LRP4 and α-dystroglycan with ERK/YAP activation (Jan 2024; https://doi.org/10.3390/medsci12010008) (hamsho2024thecurrentstate pages 8-10). The 2024 review also collates these studies and proposes translational potential (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 4-5, li2024roleofagrin pages 9-10).",\n        "mapped_pmid": "38390858",\n        "title": "The Current State of Extracellular Matrix Therapy for Ischemic Heart Disease.",\n        "doi": "10.3390/medsci12010008",\n        "pmcid": "PMC10885030",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390858/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 160,\n        "text": "- Translational cardiology: Recombinant agrin is under evaluation in large-animal models with dosing regimens (e.g., single intramyocardial dose ≈33 μg/kg) that improved function and reduced remodeling after ischemia–reperfusion injury—informing real-world therapeutic design (Jan 2024; https://doi.org/10.3390/medsci12010008) (hamsho2024thecurrentstate pages 8-10).",\n        "mapped_pmid": "38390858",\n        "title": "The Current State of Extracellular Matrix Therapy for Ischemic Heart Disease.",\n        "doi": "10.3390/medsci12010008",\n        "pmcid": "PMC10885030",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390858/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 168,\n        "text": "- Cardiac regeneration effects: In preclinical mouse and swine myocardial infarction models, recombinant agrin improved systolic function (ejection fraction, fractional shortening), reduced scar size, and enhanced wall thickness after one or two local doses, with mechanistic evidence for ERK and YAP activation through LRP4/α-dystroglycan (Jan 2024; https://doi.org/10.3390/medsci12010008) (hamsho2024thecurrentstate pages 8-10).",\n        "mapped_pmid": "38390858",\n        "title": "The Current State of Extracellular Matrix Therapy for Ischemic Heart Disease.",\n        "doi": "10.3390/medsci12010008",\n        "pmcid": "PMC10885030",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390858/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 180,\n        "text": "- Regenerative medicine: Recombinant agrin shows multi-modal benefits in preclinical cardiac repair (e.g., improved EF, reduced scar, angiogenesis, immunomodulation) with mechanistic links to LRP4/α-dystroglycan–ERK/YAP pathways (Jan 2024; https://doi.org/10.3390/medsci12010008; Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (hamsho2024thecurrentstate pages 8-10, li2024roleofagrin pages 4-5, li2024roleofagrin pages 9-10).",\n        "mapped_pmid": "38390858",\n        "title": "The Current State of Extracellular Matrix Therapy for Ischemic Heart Disease.",\n        "doi": "10.3390/medsci12010008",\n        "pmcid": "PMC10885030",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390858/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 187,\n        "text": "| Synaptic basal lamina localization & dystroglycan/laminin interactions | Agrin concentrates in the synaptic basal lamina where it binds α-dystroglycan and laminins, linking the basement membrane to the postsynaptic membrane and stabilizing the DGC. | Laminin G–like C-terminal domains mediate DAG1 (α-dystroglycan) and laminin interactions; contributes to postsynaptic scaffold stability. | (li2024roleofagrin pages 7-9, hamsho2024thecurrentstate pages 8-10, li2024roleofagrin pages 1-2) | https://doi.org/10.3892/ijmm.2024.5422, https://doi.org/10.3390/medsci12010008 | 2024 |",\n        "mapped_pmid": "38390858",\n        "title": "The Current State of Extracellular Matrix Therapy for Ischemic Heart Disease.",\n        "doi": "10.3390/medsci12010008",\n        "pmcid": "PMC10885030",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390858/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 191,\n        "text": "| Cardiac regeneration with recombinant agrin (mouse & swine) | Recombinant agrin delivered after myocardial infarction promotes cardiomyocyte cell-cycle re-entry, reduces scar formation and improves cardiac function in mouse and porcine models. | Agrin signals via LRP4 and α‑dystroglycan, activating ERK/YAP and remodeling ECM, angiogenesis and immunomodulation to enable CM dedifferentiation/proliferation. | (hamsho2024thecurrentstate pages 8-10, li2024roleofagrin pages 4-5, li2024roleofagrin pages 9-10) | https://doi.org/10.3390/medsci12010008, https://doi.org/10.3892/ijmm.2024.5422 | 2024 |",\n        "mapped_pmid": "38390858",\n        "title": "The Current State of Extracellular Matrix Therapy for Ischemic Heart Disease.",\n        "doi": "10.3390/medsci12010008",\n        "pmcid": "PMC10885030",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390858/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 200,\n        "text": "- Hamsho K, Broadwin M, Stone CR, Sellke FW, Abid MR. Current state of extracellular matrix therapy for ischemic heart disease (includes recombinant agrin animal data). Medical Sciences. Jan 2024. https://doi.org/10.3390/medsci12010008 (hamsho2024thecurrentstate pages 8-10).",\n        "mapped_pmid": "38390858",\n        "title": "The Current State of Extracellular Matrix Therapy for Ischemic Heart Disease.",\n        "doi": "10.3390/medsci12010008",\n        "pmcid": "PMC10885030",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390858/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 223,\n        "text": "9. (hamsho2024thecurrentstate pages 8-10): Khaled Hamsho, Mark Broadwin, Christopher R. Stone, Frank W. Sellke, and M. Ruhul Abid. The current state of extracellular matrix therapy for ischemic heart disease. Medical Sciences, 12:8, Jan 2024. URL: https://doi.org/10.3390/medsci12010008, doi:10.3390/medsci12010008. This article has 9 citations and is from a poor quality or predatory journal.",\n        "mapped_pmid": "38390858",\n        "title": "The Current State of Extracellular Matrix Therapy for Ischemic Heart Disease.",\n        "doi": "10.3390/medsci12010008",\n        "pmcid": "PMC10885030",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390858/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 244,\n        "text": "14. https://doi.org/10.3390/medsci12010008",\n        "mapped_pmid": "38390858",\n        "title": "The Current State of Extracellular Matrix Therapy for Ischemic Heart Disease.",\n        "doi": "10.3390/medsci12010008",\n        "pmcid": "PMC10885030",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390858/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 246,\n        "text": "16. https://doi.org/10.3390/medsci12010008;",\n        "mapped_pmid": "38390858",\n        "title": "The Current State of Extracellular Matrix Therapy for Ischemic Heart Disease.",\n        "doi": "10.3390/medsci12010008",\n        "pmcid": "PMC10885030",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390858/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 248,\n        "text": "18. https://doi.org/10.3390/medsci12010008,",\n        "mapped_pmid": "38390858",\n        "title": "The Current State of Extracellular Matrix Therapy for Ischemic Heart Disease.",\n        "doi": "10.3390/medsci12010008",\n        "pmcid": "PMC10885030",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38390858/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "39301653",\n    "mode": "fetch_missing",\n    "genes": [\n      "AGRN"\n    ],\n    "citations": [\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 141,\n        "text": "- Target identity verified: AGRN (UniProt O00468) encodes human agrin, a large extracellular matrix heparan sulfate proteoglycan with multiple EGF-like and laminin G-like domains; alternative splicing yields secreted vs transmembrane isoforms. This aligns with the UniProt description and domain architecture. Mechanistically, agrin binds LRP4 and activates MuSK at the neuromuscular junction (NMJ) (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 1-2).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 146,\n        "text": "- Identity and structure: Agrin is a ~220 kDa extracellular matrix heparan sulfate proteoglycan encoded by AGRN. It contains multiple domains, including EGF-like repeats and C-terminal laminin G-like modules that mediate interactions with receptors and basement-membrane components. Alternative splicing produces neural isoforms with “z” inserts (z+) that are synaptogenic and muscle/non-neural isoforms with reduced synaptogenic activity (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 1-2).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 147,\n        "text": "- Processing and fragments: Neuronal neurotrypsin cleaves agrin to generate C-terminal fragments, including a 22-kDa C-terminal agrin fragment (CAF22). Circulating CAFs are measurable in plasma and have been studied as biomarkers of neuromuscular junction (NMJ) degeneration and sarcopenia (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 6-7, li2024roleofagrin pages 9-10).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 148,\n        "text": "- Primary NMJ function: Neural (z+) agrin released from motor neurons binds LRP4 on myofibers, inducing LRP4–MuSK complex formation and MuSK activation, which triggers clustering of acetylcholine receptors (AChRs). This pathway is required for NMJ differentiation and maintenance (2024 preprint; https://doi.org/10.26434/chemrxiv-2024-rkqvt; Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (iyer2024rarediseasesinsights pages 32-34, kutay2025masterarbeit|mastersthesis pages 88-90, li2024roleofagrin pages 1-2).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 149,\n        "text": "- Synaptic basal lamina and binding partners: Agrin concentrates in the synaptic basal lamina and binds α-dystroglycan and laminins via its laminin G-like domains, stabilizing the dystrophin–glycoprotein complex (DGC) and the postsynaptic apparatus (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 7-9).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 150,\n        "text": "- Renal basement membranes: In the kidney, agrin is a major heparan sulfate proteoglycan of the glomerular basement membrane (GBM), contributing to its negative charge and to podocyte–basement-membrane linkage via dystroglycan. Some reports note preserved filtration despite agrin loss, indicating context-dependent contributions to charge selectivity and integrity (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 7-9, li2024roleofagrin pages 10-11).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 153,\n        "text": "- Updated mechanistic synthesis: A 2024 review integrates structural and functional advances in agrin biology across tissues, emphasizing canonical LRP4–MuSK signaling at the NMJ, and expanding roles in regeneration (cardiac, cartilage, cornea, hematopoiesis) and in matrix-mediated mechano-signaling (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 1-2, li2024roleofagrin pages 6-7, li2024roleofagrin pages 7-9).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 155,\n        "text": "- Cardiac regeneration: Summaries of preclinical studies show that recombinant agrin administered post-myocardial infarction in mice and swine improves ejection fraction, reduces scar, and promotes cardiomyocyte proliferation, acting via LRP4 and α-dystroglycan with ERK/YAP activation (Jan 2024; https://doi.org/10.3390/medsci12010008) (hamsho2024thecurrentstate pages 8-10). The 2024 review also collates these studies and proposes translational potential (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 4-5, li2024roleofagrin pages 9-10).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 156,\n        "text": "- Biomarkers: Recent syntheses emphasize circulating C-terminal agrin fragments (CAF/CAF22) as emerging biomarkers of sarcopenia and NMJ decline; multiple cohorts have established reference intervals and associations with muscle status (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 6-7, li2024roleofagrin pages 9-10, li2024roleofagrin pages 10-11).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 159,\n        "text": "- Clinical biomarker development: CAF/CAF22 quantification is being explored for muscle denervation and sarcopenia risk stratification (reference interval and disease cohorts reported). Post-stroke and kidney-transplant applications have been evaluated, indicating feasibility of clinical testing workflows (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 9-10, li2024roleofagrin pages 10-11).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 163,\n        "text": "- 2024 review perspective: Agrin integrates structural ECM roles with receptor-mediated signaling to coordinate synaptogenesis and organ repair; the therapeutic window likely relies on isoform, dose, tissue distribution, and crosstalk with receptors such as LRP4, α-dystroglycan, and downstream YAP/ERK pathways. The review cautions that precise mechanisms and context-dependence (e.g., renal vs synaptic BM) remain active areas of inquiry (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 1-2, li2024roleofagrin pages 7-9).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 169,\n        "text": "- CAF/CAF22 biomarker associations: Across recent studies collated in 2024, higher circulating CAF associates with sarcopenia and muscle decline; studies have established reference intervals and assessed CAF as a renal function biomarker in transplant recipients and as a marker post-acute stroke (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 9-10, li2024roleofagrin pages 10-11, li2024roleofagrin pages 6-7).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 172,\n        "text": "- NMJ signaling pathway: Neuronal z+ agrin engages LRP4, which complexes with and activates MuSK; MuSK phosphorylation triggers downstream scaffolding and cytoskeletal changes that cluster AChRs at the postsynaptic membrane, essential for synapse formation and stability (2024; https://doi.org/10.3892/ijmm.2024.5422; 2024; https://doi.org/10.26434/chemrxiv-2024-rkqvt) (li2024roleofagrin pages 1-2, iyer2024rarediseasesinsights pages 32-34, kutay2025masterarbeit|mastersthesis pages 88-90).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 173,\n        "text": "- Synaptic basal lamina scaffold: Agrin’s C-terminal laminin G-like domains bind α-dystroglycan and laminins, anchoring the basement membrane to the DGC and organizing postsynaptic components, consistent with its concentration in the synaptic basal lamina (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 7-9).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 174,\n        "text": "- Kidney GBM: Agrin contributes to GBM composition and charge. Its interactions with podocyte dystroglycan support basement membrane integrity; however, the exact contribution to filtration charge selectivity may vary with context, as some studies note preserved function despite agrin loss (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 7-9, li2024roleofagrin pages 10-11).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 179,\n        "text": "- Biomarkers: CAF/CAF22 are promising for assessing NMJ denervation and sarcopenia; evidence extends to stroke and renal-transplant populations with established assay feasibility (Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (li2024roleofagrin pages 9-10, li2024roleofagrin pages 10-11, li2024roleofagrin pages 6-7). Data specifically quantifying post–COVID-19 CAF22 dynamics were not extractable from the present evidence set; thus, this remains a partial gap here.",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 180,\n        "text": "- Regenerative medicine: Recombinant agrin shows multi-modal benefits in preclinical cardiac repair (e.g., improved EF, reduced scar, angiogenesis, immunomodulation) with mechanistic links to LRP4/α-dystroglycan–ERK/YAP pathways (Jan 2024; https://doi.org/10.3390/medsci12010008; Sep 2024; https://doi.org/10.3892/ijmm.2024.5422) (hamsho2024thecurrentstate pages 8-10, li2024roleofagrin pages 4-5, li2024roleofagrin pages 9-10).",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 185,\n        "text": "| Identity / domains & HSPG nature | AGRN encodes agrin, a ~220 kDa extracellular matrix heparan-sulfate proteoglycan with multiple EGF-like and laminin G–like domains and alternatively spliced secreted vs transmembrane isoforms. | HSPG glycosylation and domain architecture (EGF-like, LamG) determine ECM interactions and localization. | (li2024roleofagrin pages 1-2) | https://doi.org/10.3892/ijmm.2024.5422 | 2024 |",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 186,\n        "text": "| NMJ pathway (LRP4–MuSK, AChR clustering) & isoforms | Neuronal (z+) agrin binds LRP4 to activate MuSK, driving postsynaptic AChR clustering; neural vs muscle isoforms determine synapse-inducing activity. | Agrin–LRP4–MuSK complex formation triggers MuSK phosphorylation and downstream AChR clustering machinery. | (li2024roleofagrin pages 1-2, iyer2024rarediseasesinsights pages 32-34, kutay2025masterarbeit|mastersthesis pages 88-90) | https://doi.org/10.3892/ijmm.2024.5422, https://doi.org/10.26434/chemrxiv-2024-rkqvt | 2024 |",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 187,\n        "text": "| Synaptic basal lamina localization & dystroglycan/laminin interactions | Agrin concentrates in the synaptic basal lamina where it binds α-dystroglycan and laminins, linking the basement membrane to the postsynaptic membrane and stabilizing the DGC. | Laminin G–like C-terminal domains mediate DAG1 (α-dystroglycan) and laminin interactions; contributes to postsynaptic scaffold stability. | (li2024roleofagrin pages 7-9, hamsho2024thecurrentstate pages 8-10, li2024roleofagrin pages 1-2) | https://doi.org/10.3892/ijmm.2024.5422, https://doi.org/10.3390/medsci12010008 | 2024 |",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 188,\n        "text": "| Kidney GBM presence & roles | Agrin is a major heparan-sulfate proteoglycan of the glomerular basement membrane (GBM), contributing to negative charge, podocyte–BM linkage, and BM integrity though some studies report preserved filtration despite loss. | HSPG negative charge and interactions with podocyte dystroglycan link the cytoskeleton to the GBM; proteolytic fragments may modulate renal pathology. | (li2024roleofagrin pages 7-9, li2024roleofagrin pages 10-11) | https://doi.org/10.3892/ijmm.2024.5422 | 2024 |",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 190,\n        "text": "| Circulating C‑terminal agrin fragments (CAF / CAF22) as biomarkers | Neurotrypsin cleavage of agrin releases C‑terminal fragments (e.g., CAF22) measurable in plasma; elevated CAF associates with sarcopenia, NMJ decline and has been studied in clinical cohorts. | Proteolytic release by neurotrypsin produces CAFs that reflect NMJ proteolysis/denervation and correlate with muscle loss. | (li2024roleofagrin pages 6-7, li2024roleofagrin pages 9-10, li2024roleofagrin pages 10-11) | https://doi.org/10.3892/ijmm.2024.5422 | 2024 |",\n        "mapped_pmid": "39301653",\n        "title": "Role of Agrin in tissue repair and regeneration: From mechanisms to therapeutic opportunities (Review).",\n        "doi": "10.3892/ijmm.2024.5422",\n        "pmcid": "PMC11410309",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39301653/",\n        "reviewed_source_scope": "Primary PubMed indexed result and/or PMC/publisher identifier/title/DOI inspected during this follow-up; primary link identities, not provider title alone. Full scientific appraisal is limited to source scopes in notes."\n      },\n      {\n        "type": "verified_provider_citation",\n        "path": "genes/human/AGRN/AGRN-deep-research-falcon.md",\n        "line": 191,\n        "text": "| Cardiac regeneration with recombinant agrin (mouse & swine) | Recombinant agrin delivered after myocardial infarction promotes cardiomyocyte cell-cycle re-entry, reduces scar formation and improves cardiac function in mouse and porcine models. | Agrin signals via LRP4 and α‑dystroglycan, activating ERK/YAP and remodeling ECM, angiogenesis and immunomodulation to enable CM dedifferentiation/proliferation. | (hamsho2024thecurrentstate pages 8-10, li2024roleofagrin pages 4-5, li2024roleofagrin pages 9-10) | https://doi.org/10.3390/meds