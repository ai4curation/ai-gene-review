name: ClinGen bounded source and seed recovery 4
run-name: Source and seed recovery 4 at ${{ github.ref_name }} (${{ github.sha }})

# TEMPORARY: replace only this path on the dedicated task branch.
# The registered default-branch workflow is not changed or dispatched.
'on':
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: clingen-source-seed-recovery4-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-source-seed-fetch4-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Set isolated runtime paths after runner initialization
      run: |
        python - <<'PYENV'
        from pathlib import Path
        import os
        root = Path(os.environ['RUNNER_TEMP']).resolve() / 'clingen-source-seed-recovery4'
        with Path(os.environ['GITHUB_ENV']).open('a') as out:
            out.write('UV_CACHE_DIR=' + str(root / 'uv-cache') + '\n')
            out.write('UV_PROJECT_ENVIRONMENT=' + str(root / 'venv') + '\n')
        PYENV
    - name: Install uv without a shared dependency cache
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Initialize fixed source requests and provenance
      run: |
        python - <<'PY'
        from pathlib import Path
        import json, os
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-source-seed-recovery4'/'artifact'
        root.mkdir(parents=True)
        requests_text = '{\n  "pmids": [],\n  "genes": [\n    {\n      "symbol": "ALB",\n      "hgnc_id": "HGNC:399",\n      "uniprot_id": "P02768",\n      "aliases": [\n        "HSA",\n        "FDAHT",\n        "PRO0883",\n        "PRO0903",\n        "PRO1341",\n        "GIG20",\n        "GIG42",\n        "PRO1708",\n        "PRO2044",\n        "PRO2619",\n        "PRO2675",\n        "UNQ696"\n      ],\n      "identity_primary_urls": [\n        "https://rest.uniprot.org/uniprotkb/P02768.txt",\n        "https://www.ncbi.nlm.nih.gov/gene/213",\n        "https://ncbi.nlm.nih.gov/datasets/gene/213/"\n      ],\n      "alias_scope": "HGNC snapshot contains no aliases/previous symbols. Additional NCBI synonyms and UniProt ORF names are included conservatively. Composite ORF name UNQ696/PRO1341 is represented by both safe components for directory checks, not reclassified as two approved gene symbols.",\n      "prior_local_fetch": "terminal_DNS_failure_no_outputs"\n    }\n  ]\n}\n'
        provenance_text = '{\n  "scope": "One normal human ALB fetch-gene seed request; zero explicit PMID requests. Normal gene fetch auxiliary source outputs stay raw and require separate identity/conflict validation before any import. No biological review, provider call, import or publication.",\n  "publication_base": "ba3ff58d7d2de76dbe3c24b16e05e12369f463fc",\n  "base_workflow_blob_sha": "3b7b98db5c90e0cad98cf0100894b393bc5ca712",\n  "fresh_remote_main": "21364698b8b0c1099c7f26384bfd35b13596d282",\n  "fresh_preflight_scope": "All 13 canonical/alias paths absent, both task branches absent, 13 separate open-PR title searches zero. Root obtained exact saved GraphQL response. Recheck before dispatch and before import.",\n  "primary_identity": {\n    "gene": "ALB",\n    "hgnc": {\n      "hgnc_id": "HGNC:399",\n      "symbol": "ALB",\n      "status": "Approved",\n      "prev_symbol": "",\n      "alias_symbol": "",\n      "locus_group": "protein-coding gene",\n      "locus_type": "gene with protein product"\n    },\n    "uniprot_id": "P02768",\n    "taxon": 9606,\n    "primary_identity_urls": [\n      "https://rest.uniprot.org/uniprotkb/P02768.txt",\n      "https://www.ncbi.nlm.nih.gov/gene/213",\n      "https://ncbi.nlm.nih.gov/datasets/gene/213/"\n    ],\n    "primary_read": "2026-09-27; UniProt primary accession P02768, name ALB, human taxon9606 and HGNC399 cross-reference directly read. NCBI confirms mapped accession and five synonyms.",\n    "additional_aliases": [\n      "HSA",\n      "FDAHT",\n      "PRO0883",\n      "PRO0903",\n      "PRO1341",\n      "GIG20",\n      "GIG42",\n      "PRO1708",\n      "PRO2044",\n      "PRO2619",\n      "PRO2675",\n      "UNQ696"\n    ],\n    "alias_scope": "HGNC snapshot contains no aliases/previous symbols. Additional NCBI synonyms and UniProt ORF names are included conservatively. Composite ORF name UNQ696/PRO1341 is represented by both safe components for directory checks, not reclassified as two approved gene symbols.",\n    "local_paths": {\n      "ALB": {\n        "directory_exists": true,\n        "files": []\n      },\n      "HSA": {\n        "directory_exists": false,\n        "files": []\n      },\n      "FDAHT": {\n        "directory_exists": false,\n        "files": []\n      },\n      "PRO0883": {\n        "directory_exists": false,\n        "files": []\n      },\n      "PRO0903": {\n        "directory_exists": false,\n        "files": []\n      },\n      "PRO1341": {\n        "directory_exists": false,\n        "files": []\n      },\n      "GIG20": {\n        "directory_exists": false,\n        "files": []\n      },\n      "GIG42": {\n        "directory_exists": false,\n        "files": []\n      },\n      "PRO1708": {\n        "directory_exists": false,\n        "files": []\n      },\n      "PRO2044": {\n        "directory_exists": false,\n        "files": []\n      },\n      "PRO2619": {\n        "directory_exists": false,\n        "files": []\n      },\n      "PRO2675": {\n        "directory_exists": false,\n        "files": []\n      },\n      "UNQ696": {\n        "directory_exists": false,\n        "files": []\n      }\n    },\n    "imported_main": "d35dcc30b44924f79c0510b281ae824aa536848a",\n    "base_paths": {\n      "ALB": [],\n      "HSA": [],\n      "FDAHT": [],\n      "PRO0883": [],\n      "PRO0903": [],\n      "PRO1341": [],\n      "GIG20": [],\n      "GIG42": [],\n      "PRO1708": [],\n      "PRO2044": [],\n      "PRO2619": [],\n      "PRO2675": [],\n      "UNQ696": []\n    },\n    "fresh_remote_status": "Owner gh GraphQL connection failed; parent will execute saved finite query. No absence inferred from failure.",\n    "prior_normal_attempt": "Parent reported session13310 terminalexit1 DNS; tool-only output not preserved. No synthetic log; one new normal attempt explicitly authorized for durable capture."\n  },\n  "normal_attempt": {\n    "status": "TERMINAL_FAILED",\n    "session_id": 64731,\n    "exit_code": 1,\n    "failure": "UniProt DNS resolution failure