          report['finished_utc']=datetime.now(timezone.utc).isoformat();report['unresolved_sources']=[r['id'] for r in report['entries'] if r['status'] not in {'recovered','already_present'}];report['recovered_count']=sum(r['status']=='recovered' for r in report['entries']);save()
