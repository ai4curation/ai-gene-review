t ferroptosis-related diseases",\n        "doi_aliases": [\n          "10.1126/sciadv.adk1200"\n        ],\n        "pmc_aliases": [],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-doi-first.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 147,\n        "text": "- Substrate specificity: Human ACSL4 shows marked preference for PUFA substrates, especially arachidonic acid (AA, 20:4) and adrenic acid (AdA, 22:4), forming AA‑CoA and AdA‑CoA that seed pro‑oxidant phospholipid pools (Mar 2024; https://doi.org/10.1126/sciadv.adk1200) (huang2024identificationofa pages 1-2). Reviews from 2023 corroborate AA/AdA preference among PUFAs (Jun 2023; https://doi.org/10.1093/cm9.0000000000002533) (ding2023acylcoasynthaseacsl4 pages 1-2).",\n        "mapped_pmid": "38552012",\n        "title": "Identification of a targeted ACSL4 inhibitor to treat ferroptosis-related diseases",\n        "doi_aliases": [\n          "10.1126/sciadv.adk1200"\n        ],\n        "pmc_aliases": [],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-doi-first.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 152,\n        "text": "- First targeted, direct ACSL4 inhibitor with in vivo efficacy: A 2024 Science Advances study identified AS‑252424 as a specific ACSL4 inhibitor that binds glutamine 464 on ACSL4, suppressing its enzymatic activity, lipid peroxidation, and ferroptosis. Nanoparticle‑delivered AS‑252424 ameliorated ferroptosis‑mediated organ injury in mouse models of kidney ischemia/reperfusion and acute liver injury, highlighting translational potential (Mar 2024; https://doi.org/10.1126/sciadv.adk1200) (huang2024identificationofa pages 1-2).",\n        "mapped_pmid": "38552012",\n        "title": "Identification of a targeted ACSL4 inhibitor to treat ferroptosis-related diseases",\n        "doi_aliases": [\n          "10.1126/sciadv.adk1200"\n        ],\n        "pmc_aliases": [],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-doi-first.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 157,\n        "text": "- Anti‑ferroptosis therapeutics in organ injury models: Targeting ACSL4 with AS‑252424 suppressed ferroptosis and reduced injury severity in kidney and liver models when delivered in nanoparticles, providing a proof‑of‑concept therapeutic avenue to limit ferroptosis‑driven tissue damage (Mar 2024; https://doi.org/10.1126/sciadv.adk1200) (huang2024identificationofa pages 1-2).",\n        "mapped_pmid": "38552012",\n        "title": "Identification of a targeted ACSL4 inhibitor to treat ferroptosis-related diseases",\n        "doi_aliases": [\n          "10.1126/sciadv.adk1200"\n        ],\n        "pmc_aliases": [],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-doi-first.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 166,\n        "text": "- Target engagement and efficacy (preclinical): AS‑252424 directly engages ACSL4 at Q464 and prevents lipid peroxidation and ferroptosis across human and mouse cells; nanoparticle‑mediated delivery attenuated organ injury in murine kidney ischemia/reperfusion and acute liver injury models (Mar 2024; https://doi.org/10.1126/sciadv.adk1200) (huang2024identificationofa pages 1-2). Quantitative effect sizes were model‑specific and not detailed in the excerpt; however, the study documents significant protective effects in vivo.",\n        "mapped_pmid": "38552012",\n        "title": "Identification of a targeted ACSL4 inhibitor to treat ferroptosis-related diseases",\n        "doi_aliases": [\n          "10.1126/sciadv.adk1200"\n        ],\n        "pmc_aliases": [],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-doi-first.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 170,\n        "text": "- Reaction: ACSL4 catalyzes ATP‑dependent activation of long‑chain PUFAs (PUFA + ATP + CoA → PUFA‑CoA + AMP + PPi), with strong selectivity for AA and AdA in human systems (Jul 2023; https://doi.org/10.1097/cm9.0000000000002533; Mar 2024; https://doi.org/10.1126/sciadv.adk1200) (ding2023acylcoasynthaseacsl4 pages 1-2, huang2024identificationofa pages 1-2).",\n        "mapped_pmid": "38552012",\n        "title": "Identification of a targeted ACSL4 inhibitor to treat ferroptosis-related diseases",\n        "doi_aliases": [\n          "10.1126/sciadv.adk1200"\n        ],\n        "pmc_aliases": [],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-doi-first.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 180,\n        "text": "- Organ injury (kidney/liver): Direct ACSL4 inhibition with AS‑252424 confers protection in mouse kidney ischemia/reperfusion and acute liver injury models, arguing for clinical exploration in ferroptosis‑driven organ pathologies (Mar 2024; https://doi.org/10.1126/sciadv.adk1200) (huang2024identificationofa pages 1-2).",\n        "mapped_pmid": "38552012",\n        "title": "Identification of a targeted ACSL4 inhibitor to treat ferroptosis-related diseases",\n        "doi_aliases": [\n          "10.1126/sciadv.adk1200"\n        ],\n        "pmc_aliases": [],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-doi-first.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 187,\n        "text": "- Targeted inhibitor: AS‑252424 (AS) — direct binding to Q464; inhibits ACSL4 enzymatic activity; abrogates lipid peroxidation and ferroptosis; effective in vivo with nanoparticle delivery in murine organ injury models (Mar 2024; https://doi.org/10.1126/sciadv.adk1200) (huang2024identificationofa pages 1-2).",\n        "mapped_pmid": "38552012",\n        "title": "Identification of a targeted ACSL4 inhibitor to treat ferroptosis-related diseases",\n        "doi_aliases": [\n          "10.1126/sciadv.adk1200"\n        ],\n        "pmc_aliases": [],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/38552012/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-doi-first.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n  