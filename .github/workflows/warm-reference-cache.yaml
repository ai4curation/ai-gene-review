},\n    {\n      "symbol": "ABHD12",\n      "hgnc_id": "HGNC:15868",\n      "uniprot_id": "Q8N2K0",\n      "aliases": [\n        "C20orf22",\n        "DKFZP434P106",\n        "dJ965G21.2",\n        "BEM46L2",\n        "ABHD12A"\n      ],\n      "identity_primary_url": "https://www.uniprot.org/uniprotkb/Q8N2K0/entry",\n      "prior_local_fetch": "failed_DNS",\n      "base_main_paths": {\n        "ABHD12": [],\n        "C20orf22": [],\n        "DKFZP434P106": [],\n        "dJ965G21.2": [],\n        "BEM46L2": [],\n        "ABHD12A": []\n      }\n    },\n    {\n      "symbol": "ABHD5",\n      "hgnc_id": "HGNC:21396",\n      "uniprot_id": "Q8WTS1",\n      "aliases": [\n        "CGI-58",\n        "NCIE2"\n      ],\n      "identity_primary_url": "https://www.ncbi.nlm.nih.gov/datasets/gene/51099/",\n      "prior_local_fetch": "failed_DNS",\n      "base_main_paths": {\n        "ABHD5": [],\n        "CGI-58": [],\n        "NCIE2": []\n      }\n    },\n    {\n      "symbol": "AICDA",\n      "hgnc_id": "HGNC:13203",\n      "uniprot_id": "Q9GZX7",\n      "aliases": [\n        "HIGM2",\n        "CDA2",\n        "ARP2",\n        "AID"\n      ],\n      "identity_primary_url": "https://www.ncbi.nlm.nih.gov/datasets/gene/57379/",\n      "prior_local_fetch": "failed_DNS",\n      "base_main_paths": {\n        "AICDA": [],\n        "HIGM2": [],\n        "CDA2": [],\n        "ARP2": [],\n        "AID": []\n      }\n    },\n    {\n      "symbol": "AGTPBP1",\n      "hgnc_id": "HGNC:17258",\n      "uniprot_id": "Q9UPW5",\n      "aliases": [\n        "KIAA1035",\n        "Nna1",\n        "CCP1"\n      ],\n      "identity_primary_url": "https://www.ncbi.nlm.nih.gov/datasets/gene/id/23287/products/",\n      "prior_local_fetch": "not_attempted_in_this_segment",\n      "base_main_paths": {\n        "AGTPBP1": [],\n        "KIAA1035": [],\n        "Nna1": [],\n        "CCP1": []\n      }\n    },\n    {\n      "symbol": "AIFM1",\n      "hgnc_id": "HGNC:8768",\n      "uniprot_id": "O95831",\n      "aliases": [\n        "PDCD8",\n        "NAMSD",\n        "AUNX1",\n        "AIF",\n        "CMTX4",\n        "DFNX5"\n      ],\n      "identity_primary_url": "https://pubchem.ncbi.nlm.nih.gov/protein/O95831",\n      "prior_local_fetch": "not_attempted_in_this_segment",\n      "base_main_paths": {\n        "AIFM1": [],\n        "PDCD8": [],\n        "NAMSD": [],\n        "AUNX1": [],\n        "AIF": [],\n        "CMTX4": [],\n        "DFNX5": []\n      }\n    },\n    {\n      "symbol": "AK2",\n      "hgnc_id": "HGNC:362",\n      "uniprot_id": "P54819",\n      "aliases": [],\n      "identity_primary_url": "https://www.ncbi.nlm.nih.gov/datasets/gene/204/",\n      "prior_local_fetch": "not_attempted_in_this_segment",\n      "base_main_paths": {\n        "AK2": []\n      }\n    }\n  ]\n}\n'
