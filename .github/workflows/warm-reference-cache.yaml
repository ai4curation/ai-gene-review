,\n      {\n        "kind": "pmid",\n        "id": "21209088"\n      },\n      {\n        "kind": "pmid",\n        "id": "22123816"\n      },\n      {\n        "kind": "pmid",\n        "id": "22302937"\n      },\n      {\n        "kind": "pmid",\n        "id": "22632720"\n      },\n      {\n        "kind": "pmid",\n        "id": "23117815"\n      },\n      {\n        "kind": "pmid",\n        "id": "23297193"\n      },\n      {\n        "kind": "pmid",\n        "id": "23658157"\n      },\n      {\n        "kind": "pmid",\n        "id": "25263431"\n      },\n      {\n        "kind": "pmid",\n        "id": "25580854"\n      },\n      {\n        "kind": "pmid",\n        "id": "25612518"\n      },\n      {\n        "kind": "pmid",\n        "id": "26610917"\n      },\n      {\n        "kind": "pmid",\n        "id": "27307232"\n      },\n      {\n        "kind": "pmid",\n        "id": "29449373"\n      },\n      {\n        "kind": "pmid",\n        "id": "30420694"\n      },\n      {\n        "kind": "pmid",\n        "id": "30949029"\n      },\n      {\n        "kind": "pmid",\n        "id": "31062249"\n      },\n      {\n        "kind": "pmid",\n        "id": "33571455"\n      },\n      {\n        "kind": "pmid",\n        "id": "33782379"\n      },\n      {\n        "kind": "pmid",\n        "id": "34218273"\n      },\n      {\n        "kind": "pmid",\n        "id": "34404721"\n      },\n      {\n        "kind": "pmid",\n        "id": "34714331"\n      },\n      {\n        "kind": "pmid",\n        "id": "35643536"\n      },\n      {\n        "kind": "pmid",\n        "id": "35948834"\n      },\n      {\n        "kind": "pmid",\n        "id": "36609795"\n      },\n      {\n        "kind": "pmid",\n        "id": "36691038"\n      },\n      {\n        "kind": "pmid",\n        "id": "37321467"\n      },\n      {\n        "kind": "pmid",\n        "id": "40496808"\n      },\n      {\n        "kind": "pmid",\n        "id": "41983263"\n      },\n      {\n        "kind": "pmid",\n   