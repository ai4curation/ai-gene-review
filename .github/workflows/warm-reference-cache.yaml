"text": "- PMID:23117815"\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1352,\n        "text": "snapshot 2023-03-10 identifies IEP evidence from PMID:23117815. Primary abstracts were read; full assay"\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1357,\n        "text": "snapshot 2023-03-10 identifies IEP evidence from PMID:23117815. Primary abstracts were read; full assay"\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1691,\n        "text": "- id: PMID:23117815"\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1701,\n        "text": "not by themselves resolve human triglyceride-homeostasis participation. Verification route: https://pubmed.ncbi.nlm.nih.gov/23117815/"\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-notes.md",\n        "type": "explicit_source_citation",\n        "line": 51,\n        "text": "| Response to muscle activity | PMID:23117815 | Training-associated intestinal expression differs by diet; conserved effector participation unresolved. |"\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-notes.md",\n        "type": "explicit_source_citation",\n        "line": 52,\n        "text": "| Response to nutrient levels | PMID:23117815; PMID:25263431 | The first abstract explicitly reports Abcg8 expression; the second gives ovariectomy/VLDL context without naming Abcg8. Its Abcg8 connection comes from the donor annotation and remains unresolved at full-assay level. |"\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-notes.md",\n        "type": "explicit_source_citation",\n        "line": 53,\n        "text": "| Triglyceride homeostasis | PMID:23117815 | Liver triglyceride accumulation accompanies a larger expression program; correlation is not enough to assign a resolved ABCG8-dependent homeostatic step, but neutral-sterol specificity alone does not refute one. |"\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-notes.md",\n        "type": "explicit_source_citation",\n        "line": 57,\n        "text": "The paired ABCG5 reviewer owned a single normal retrieval of shared new sources; `/tmp/ABCG5-notes-donors-fetch.log` ended with 0/11 and exit 1 after DNS failures, creating no records. The settled ABCG8 notes-inclusive missing set is **PMID:15710224, PMID:16867993, PMID:17109865, PMID:23117815, PMID:25263431 and PMID:34404721**. All seven seeded PMID records and all four cited Reactome records are present. Reactome disease summaries are interpreted as mutant-event context, not wild-type transport assays; the expression event treats ABCG8 as the regulated product."\n      },\n      {\n        "path": "genes/human/ABCG8/ABCG8-notes.md",\n        "type": "explicit_source_citation",\n        "line": 59,\n        "text": "The ABCG5 reviewer independently read all 47 ABCG8 decisions, core and reference assessments and found no biological action/core blocker. Their one source-specific correction was incorporated: PMID:25263431\'s abstract does not name Abcg8, unlike PMID:23117815; its donor provenance and full-assay uncertainty are distinguished. The full draft was sent to the parent for independent biological review. No NEW annotation is required: the existing assertions and evidence-backed MODIFY terms cover the core transporter role. Research-provider failure, incomplete donor studies and the six cache gates remain explicit; status is DRAFT."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "23297193",\n    "mode": "fetch_missing",\n    "genes": [\n      "ABHD12"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ABHD12/ABHD12-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 899,\n        "text": "reason: RHEA:40895 is present on the human UniProt record by similarity to mouse Q99LR1. PMID:23297193"\n      },\n      {\n        "path": "genes/human/ABHD12/ABHD12-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 905,\n        "text": "- reference_id: PMID:23297193"\n      },\n      {\n        "path": "genes/human/ABHD12/ABHD12-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1028,\n        "text": "PMID:23297193 Figure 5 and Results explicitly report LPI hydrolysis and its decrease in knockout"\n      },\n      {\n        "path": "genes/human/ABHD12/ABHD12-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1033,\n        "text": "- reference_id: PMID:23297193"\n      },\n      {\n        "path": "genes/human/ABHD12/ABHD12-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1180,\n        "text": "- id: PMID:23297193"\n      },\n      {\n        "path": "genes/human/ABHD12/ABHD12-notes.md",\n        "type": "explicit_source_citation",\n        "line": 21,\n        "text": "- [PMID:23297193, PMC3557017](https://pmc.ncbi.nlm.nih.gov/articles/PMC3557017/): indexed Results/Figure 5 read using `\\"PMC3557017\\" \\"Table\\" \\"lyso\\"`. Mouse Abhd12 cDNA is expressed in HEK293T; knockout mouse brain demonstrates predominant lysoPS turnover and additional LPI hydrolysis. Bulk MAG/LPC/LPE hydrolysis was unchanged, which does not exclude recombinant capacity or local flux. The specific LPE panel result remains incompletely resolved here, so row 33 is UNDECIDED. The explicit LPI result supports row 37 as non-core."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "23658157",\n    "mode": "fetch_missing",\n    "genes": [\n      "AHI1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 24,\n        "text": "AHI1 (Jouberin) is a modular SH3- and WD40-repeat scaffolding/adaptor protein that operates at the primary cilium transition zone and in neuronal cytoplasmic signaling, with loss-of-function mutations causing Joubert syndrome featuring cerebellar malformation and abnormal axonal decussation [PMID:15322546, PMID:15467982]. At the ciliary base, AHI1 localizes to the mother centriole/basal body, where its recruitment to a ring-shaped transition-zone domain depends on Cby1, and where it is required for ciliogenesis and polarized vesicular trafficking by stabilizing the small GTPase Rab8a [PMID:19625297, PMID:25103236]. AHI1 governs ciliary cargo: it sustains Arl13b ciliary membrane localization and proteasomal stability to support Sonic hedgehog signaling and proper axoneme length, mediates outer-segment protein transport in photoreceptors, and targets the GPCRs MCHR1 to the ciliary membrane for downstream cAMP/ERK signaling [PMID:20592197, PMID:31391239, PMID:33741721]. Its WD40 region binds NPHP1, and Joubert/retinitis pigmentosa mutations in this region destabilize AHI1 and impair its ciliary-base enrichment, whereas the C-terminal SH3 domain is dispensable for normal development [PMID:23532844, PMID:25616960, PMID:28442542]. In neurons AHI1 forms a stable complex with HAP1 that regulates TrkB receptor endocytic sorting and signaling, and AHI1 controls additional partners including 5-HT2CR, Cend1, GR, and APP to influence neurite outgrowth, feeding behavior, and stress-related/depressive phenotypes [PMID:18636121, PMID:20956301, PMID:22123816, PMID:23658157, PMID:31062249, PMID:33782379]. Beyond ciliary and neuronal roles, AHI1 has hematopoietic and immune functions: an AHI-1/BCR-ABL/JAK2 complex assembled via its SH3 domain modulates JAK2-STAT5 phosphorylation and tyrosine kinase inhibitor resistance in leukemia, and AHI1 recruits the deubiquitinase OTUD1 to stabilize Tyk2 and maintain basal type-I interferon signaling [PMID:18936234, PMID:22623184, PMID:35821088]."\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 52,\n        "text": "| 2013 | High | Full-length (but not N-terminal) Ahi1 binds Hap1, and this interaction is regulated by nerve growth factor: NGF induces dephosphorylation of Hap1A and decreases its association with Ahi1. Ahi1 associates with phosphorylated Hap1A in cytosolic but not synaptosomal fractions. Mass spectrometry of cytosolic Ahi1 immunoprecipitates identifies Cend1 (BM88) as a binding partner. Loss of Ahi1 reduces Cend1 levels in the hypothalamus; overexpressed Ahi1 stabilizes Cend1; and Cend1 overexpression rescues neurite extension defects in Ahi1-KO hypothalamic neurons. | PMID:23658157 | The Journal of neuroscience |"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-deep-research-affinage.md",\n        "type": "preserved_provider_citation",\n        "line": 87,\n        "text": "- PMID:23658157"\n      },\n      {\n        "path": "genes/human/AHI1/AHI1-notes.md",\n        "type": "explicit_source_citation",\n        "line": 820,\n        "text": "PMID:15467982, PMID:18785627, PMID:19211505, PMID:22123816, PMID:23658157,"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "25263431",\n    "mode": "fetch_missing",\n    "genes": [\n      "ABCG5",\n      "ABCG8"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ABCG5/ABCG5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 802,\n        "text": "reason: The historical rat GO graph assigns this IEP term using PMID:23117815, PMID:25263431 and PMID:25612518."\n      },\n      {\n        "path": "genes/human/ABCG5/ABCG5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 810,\n        "text": "- PMID:25263431"\n      },\n      {\n        "path": "genes/human/ABCG5/ABCG5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line