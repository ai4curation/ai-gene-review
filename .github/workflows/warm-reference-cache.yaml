name: ClinGen retained PANTHER comparator audit 2
run-name: PANTHER retained comparator audit at ${{ github.sha }}
'on':
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: clingen-panther-audit2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' && github.ref
      == 'refs/heads/cmungall/clingen-panther-audit2-20261002'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the exact dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Fetch nine fixed official comparator files once
      id: fetch
      continue-on-error: true
      timeout-minutes: 32
      env:
        PANTHER_AUDIT_SPEC_B64: 
      run: |
        python - <<'PANTHER_AUDIT'
        """One finite PANTHER input audit. Network execution is reserved to the reviewed runner."""
        from pathlib import Path
        from datetime import datetime, timezone
        from typing import Dict, Iterable
        import ast, base64, hashlib, json, os, re, signal, time
        import urllib.request, urllib.parse, urllib.error

        REPOSITORY='ai4curation/ai-gene-review'
        BRANCH='refs/heads/cmungall/clingen-panther-audit2-20261002'
        ROOT_NAME='clingen-panther-audit2'
        CODE_PATH='src/ai_gene_review/etl/panther_families.py'
        CODE_SHA256='ad4162a45d021da97433b3d3b98e858ea97d16265dedc1c0e61598d89b7cc10a'
        CODE_BLOB='c47a28d2a54d36ab6a9c1951345b298a23e58c5d'
        SPEC_SHA256='2f0ce17bd9614c566cb6214245cd231958be1e92304c26f4b772b21653112ace'
        BASE='https://data.pantherdb.org/ftp/sequence_classifications/19.0/PANTHER_Sequence_Classification_files/'
        GROUPS=(('human', ('Q13308', 'Q6PEW0', 'O15353', 'Q02750')), ('rat', ('Q6AY28',)), ('mouse', ('Q7M756', 'Q61575', 'Q8K3Q3', 'P31938')), ('budding_yeast', ('P32643',)), ('neurospora', ('Q7RYZ6',)), ('horse', ('A0A9L0SHX8', 'A0A9L0R074')), ('fission_yeast', ('P10506', 'Q9Y884')), ('zebrafish', ('A2BGM5',)), ('x_laevis', ('Q3BJS1',)))
        MAX_FILE=64*1024*1024
        MAX_TOTAL=256*1024*1024
        MAX_AUDIT=2*1024*1024
        PER_REQUEST_SECONDS=180
        TOTAL_SECONDS=30*60
        IO_TIMEOUT_SECONDS=20

        def utc():return datetime.now(timezone.utc).isoformat()
        def sha(b):return hashlib.sha256(b).hexdigest()
        def blob(b):return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
        def write_json(path,obj):
         raw=(json.dumps(obj,indent=2,sort_keys=True)+'\n').encode()
         if len(raw)>MAX_AUDIT:raise ValueError('Audit JSON exceeds reviewed limit; no truncation')
         with path.open('xb')as f:f.write(raw)
         return dict(path=path.name,bytes=len(raw),sha256=sha(raw))

        def unchanged_parser(raw):
         if sha(raw)!=CODE_SHA256 or blob(raw)!=CODE_BLOB:raise ValueError('Parser source changed')
         tree=ast.parse(raw.decode('utf-8'))
         names={'FAMILY_RE','SUBFAMILY_RE','UNIPROT_IN_LONG_ID_RE','_SEQ_COL_LONG_ID','_SEQ_COL_FAMILY_SF'}
         selected=[]
         for node in tree.body:
          if isinstance(node,ast.Assign)and len(node.targets)==1 and isinstance(node.targets[0],ast.Name)and node.targets[0].id in names:selected.append(node)
          if isinstance(node,ast.FunctionDef)and node.name=='parse_sequence_classification':selected.append(node)
         if len(selected)!=6:raise ValueError('Unexpected parser dependency shape')
         module=ast.Module(body=selected,type_ignores=[])
         namespace={'re':re,'Dict':Dict,'Iterable':Iterable}
         exec(compile(module,CODE_PATH,'exec'),namespace)
         return namespace['parse_sequence_classification'],sha(ast.dump(module,include_attributes=False).encode())

        def analyze(raw,targets,parser):
         # Independent whole-token extraction deliberately differs from the existing
         # parser's search regex: any discrepancy is retained for diagnosis, not fixed.
         text=raw.decode('utf-8');lines=text.splitlines();parsed=parser(lines)
         matches={a:[]for a in targets};uniprot_row_count=0;short_rows=0
         for number,line in enumerate(lines,1):
          cols=line.split('\t')
          if len(cols)<4:short_rows+=1
          tokens=cols[0].split('|') if cols else[]
          accessions=[t[len('UniProtKB='):]for t in tokens if t.startswith('UniProtKB=')]
          if accessions:uniprot_row_count+=1
          for accession in targets:
           if accession in accessions:
            matches[accession].append(dict(line_number=number,raw_line=line,columns=cols,column4=cols[3]if len(cols)>3 else None))
         result={}
         for accession,rows in matches.items():
          assignments=sorted({r['column4'].strip()for r in rows if r['column4']is not None})
          valid=[a for a in assignments if re.fullmatch(r'PTHR\d+(?::SF\d+)?',a)]
          result[accession]=dict(matches=rows,match_count=len(rows),distinct_assignments=assignments,valid_distinct_assignments=valid,existing_parser_result=parsed.get(accession),
           match_status='NO_MATCH'if not rows else'SINGLE_MATCH'if len(rows)==1 else'DUPLICATE_SAME_ASSIGNMENT'if len(assignments)==1 else'MULTIPLE_ASSIGNMENTS',
           result='ABSENT_FROM_ENTIRE_FILE'if not rows else'MULTIPLE_ASSIGNMENTS'if len(valid)>1 else'UNIQUE_ASSIGNMENT'if len(valid)==1 else'NO_VALID_ASSIGNMENT',
           parser_agrees_with_unique_exact_match=(parsed.get(accession)==valid[0])if len(valid)==1 else None)
         return dict(line_count=len(lines),first_three_raw_lines=lines[:3],uniprot_row_count=uniprot_row_count,short_row_count=short_rows,has_plausible_sequence_layout=uniprot_row_count>0,targets=result)

        class BoundedRedirect(urllib.request.HTTPRedirectHandler):
         def __init__(self,events):super().__init__();self.events=events
         def redirect_request(self,req,fp,code,msg,headers,newurl):
          target=urllib.parse.urljoin(req.full_url,newurl);u=urllib.parse.urlsplit(target)
          self.events.append(dict(status=code,from_url=req.full_url,to_url=target,headers=list(headers.items())))
          if len(self.events)>3 or u.scheme!='https'or u.netloc!='data.pantherdb.org'or not u.path.startswith('/ftp/sequence_classifications/19.0/PANTHER_Sequence_Classification_files/')or u.query or u.fragment:
           raise ValueError('Redirect outside reviewed primary-source boundary')
          return super().redirect_request(req,fp,code,msg,headers,target)

        def timeout_handler(signum,frame):raise TimeoutError('Bounded request wall time exceeded')

        def acquire(url,path,remaining_bytes,parser,targets,wall_seconds=PER_REQUEST_SECONDS):
         events=[];record=dict(url=url,started_utc=utc(),attempts=1,redirects=events,complete_body=False)
         cap=min(MAX_FILE,remaining_bytes)
         if cap<=0:raise ValueError('Aggregate source body limit exhausted')
         opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),BoundedRedirect(events))
         request=urllib.request.Request(url,headers={'Accept-Encoding':'identity','User-Agent':'ai-gene-review-panther-input-audit/1'})
         old_handler=signal.signal(signal.SIGALRM,timeout_handler);signal.alarm(min(PER_REQUEST_SECONDS,wall_seconds))
         try:
          with opener.open(request,timeout=IO_TIMEOUT_SECONDS)as response:
           record.update(status_code=response.status,final_url=response.geturl(),headers=list(response.headers.items()))
           if response.status!=200:raise ValueError('Non-200 response')
           if response.headers.get('Content-Encoding','identity').lower()not in ['identity','']:raise ValueError('Unexpected content encoding')
           expected=response.headers.get('Content-Length')
           if expected is not None and(not expected.isdigit()or int(expected)>cap):raise ValueError('Invalid or oversized Content-Length')
           count=0
           with path.open('xb')as handle:
            while True:
             part=response.read(min(65536,cap-count+1))
             if not part:break
             if count+len(part)>cap:raise ValueError('Source body byte limit exceeded')
             handle.write(part);count+=len(part)
           if expected is not None and count!=int(expected):raise ValueError('Content-Length does not match complete body')
           raw=path.read_bytes();record.update(complete_body=True,raw_file=path.name,bytes=len(raw),sha256=sha(raw))
           record['analysis']=analyze(raw,targets,parser)
           if not record['analysis']['has_plausible_sequence_layout']:raise ValueError('No plausible sequence-classification layout')
           record['status']='COMPLETE_PRIMARY_BODY_ANALYZED'
         except Exception as error:
          record.update(status='FAILED_NO_RETRY',error_type=type(error).__name__,error=str(error))
          if isinstance(error,urllib.error.HTTPError):record.update(status_code=error.code,final_url=error.geturl(),headers=list(error.headers.items()))
          if path.exists():
           raw=path.read_bytes();record.update(raw_file=path.name,bytes=len(raw),sha256=sha(raw),partial_or_invalid_body_retained=True)
         finally:
          signal.alarm(0);signal.signal(signal.SIGALRM,old_handler);record['ended_utc']=utc()
         return record

        def main():
         env={k:os.environ[k]for k in ['GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT','RUNNER_TEMP','GITHUB_WORKSPACE']}
         if env['GITHUB_REPOSITORY']!=REPOSITORY or env['GITHUB_REF']!=BRANCH or env['GITHUB_RUN_ATTEMPT']!='1':raise ValueError('Wrong repository, branch or attempt')
         if not re.fullmatch(r'[0-9a-f]{40}',env['GITHUB_SHA'])or not env['GITHUB_RUN_ID'].isdigit():raise ValueError('Invalid run identity')
         workspace=Path(env['GITHUB_WORKSPACE']).resolve();root=Path(env['RUNNER_TEMP']).resolve()/ROOT_NAME
         if root==workspace or workspace in root.parents or root.exists():raise ValueError('Non-isolated or existing output root')
         root.mkdir();rawdir=root/'raw-inputs';auditdir=root/'audit';rawdir.mkdir();auditdir.mkdir()
         receipt=dict(status='INITIALIZED_BEFORE_NETWORK',started_utc=utc(),github={k:env[k]for k in ['GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']},spec_sha256=SPEC_SHA256,
          limits=dict(max_file_bytes=MAX_FILE,max_total_bytes=MAX_TOTAL,max_audit_json_bytes=MAX_AUDIT,per_request_seconds=PER_REQUEST_SECONDS,total_seconds=TOTAL_SECONDS,connect_and_each_read_timeout_seconds=IO_TIMEOUT_SECONDS,phase1_only=True,automatic_retries=0),entries=[])
         write_json(auditdir/'run-initial.json',receipt)
         spec_raw=base64.b64decode(os.environ['PANTHER_AUDIT_SPEC_B64'],validate=True)
         if sha(spec_raw)!=SPEC_SHA256:raise ValueError('Reviewed request specification changed')
         with(auditdir/'reviewed-request-spec.json').open('xb')as f:f.write(spec_raw)
         code=(workspace/CODE_PATH).read_bytes();parser,parser_ast_sha=unchanged_parser(code)
         receipt['parser']=dict(path=CODE_PATH,bytes=len(code),sha256=sha(code),git_blob_sha=blob(code),unchanged_selected_ast_sha256=parser_ast_sha)
         start=time.monotonic();total=0
         for organism,targets in GROUPS:
          name='PTHR19.0_'+organism
          remaining_seconds=int(TOTAL_SECONDS-(time.monotonic()-start))
          if remaining_seconds<=0 or total>=MAX_TOTAL:
           result=dict(url=BASE+name,status='NOT_ATTEMPTED_BUDGET_EXHAUSTED',attempts=0,complete_body=False)
          else:result=acquire(BASE+name,rawdir/name,MAX_TOTAL-total,parser,targets,remaining_seconds)
          result.update(organism=organism,target_accessions=list(targets));total+=result.get('bytes',0)
          write_json(auditdir/(organism+'.json'),result);receipt['entries'].append(result)
          print(json.dumps(dict(organism=organism,status=result['status'],bytes=result.get('bytes'),sha256=result.get('sha256'))),flush=True)
         if (workspace/CODE_PATH).read_bytes()!=code:raise ValueError('Read-only parser source changed during audit')
         receipt.update(ended_utc=utc(),total_source_bytes=total,status='COMPLETE_NINE_COMPARATOR_INPUTS'if all(x['status']=='COMPLETE_PRIMARY_BODY_ANALYZED'for x in receipt['entries'])else'PARTIAL_DIAGNOSTIC_FAILURE_NO_RETRY')
         write_json(auditdir/'audit-report.json',receipt)
         manifest=dict(github=receipt['github'],spec_sha256=SPEC_SHA256,parser=receipt['parser'],status=receipt['status'],sources=[{k:v for k,v in r.items()if k!='analysis'}for r in receipt['entries']])
         write_json(rawdir/'raw-input-manifest.json',manifest)
         print(json.dumps(dict(status=receipt['status'],logical_requests=sum(r['attempts']for r in receipt['entries']),source_bytes=total,canonical_writes=0)),flush=True)
         return 0 if receipt['status']=='COMPLETE_NINE_COMPARATOR_INPUTS'else 1

        if __name__=='__main__':raise SystemExit(main())
        PANTHER_AUDIT
    - name: Retain complete raw primary inputs and partial evidence
      id: raw
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: clingen-panther-audit2-raw-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/clingen-panther-audit2/raw-inputs/
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: false
        overwrite: false
        compression-level: 6
    - name: Bind the actual raw artifact identity into the compact audit
      id: bind
      if: ${{ always() }}
      env:
        RAW_OUTCOME: ${{ steps.raw.outcome }}
        RAW_ID: ${{ steps.raw.outputs.artifact-id }}
        RAW_DIGEST: ${{ steps.raw.outputs.artifact-digest }}
        RAW_URL: ${{ steps.raw.outputs.artifact-url }}
      run: |
        python - <<'PANTHER_BIND'
        from pathlib import Path
        import hashlib,json,os,re
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-panther-audit2';out=root/'audit'
        if not out.is_dir():raise ValueError('Diagnostic audit directory is absent')
        receipt={'status':'RAW_ARTIFACT_UPLOAD_FAILED','raw_step_outcome':os.environ['RAW_OUTCOME'],'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'head':os.environ['GITHUB_SHA']}
        if os.environ['RAW_OUTCOME']=='success':
         identifier=os.environ['RAW_ID'];digest=os.environ['RAW_DIGEST'];url=os.environ['RAW_URL']
         if not identifier.isdigit()or not re.fullmatch(r'(?:sha256:)?[0-9a-f]{64}',digest):raise ValueError('Invalid actual raw artifact identity')
         expected='https://github.com/ai4curation/ai-gene-review/actions/runs/'+os.environ['GITHUB_RUN_ID']+'/artifacts/'+identifier
         if url!=expected:raise ValueError('Wrong actual raw artifact URL')
         receipt.update(status='RAW_ARTIFACT_UPLOADED',artifact_id=int(identifier),artifact_digest=digest,artifact_url=url)
        with(out/'raw-artifact-binding.json').open('x')as f:json.dump(receipt,f,indent=2);f.write('\n')
        print(json.dumps(receipt))
        PANTHER_BIND
    - name: Upload compact complete or partial audit
      id: audit
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: clingen-panther-audit2-audit-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/clingen-panther-audit2/audit/
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: false
        overwrite: false
    - name: Report the actual terminal diagnostic outcome
      if: ${{ always() }}
      env:
        FETCH_OUTCOME: ${{ steps.fetch.outcome }}
        RAW_OUTCOME: ${{ steps.raw.outcome }}
        BIND_OUTCOME: ${{ steps.bind.outcome }}
        AUDIT_OUTCOME: ${{ steps.audit.outcome }}
      run: |
        python - <<'PANTHER_TERMINAL'
        from pathlib import Path
        import json,os
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-panther-audit2'/'audit'
        report=json.loads((root/'audit-report.json').read_bytes());binding=json.loads((root/'raw-artifact-binding.json').read_bytes())
        assert report['status']=='COMPLETE_NINE_COMPARATOR_INPUTS'and len(report['entries'])==9 and binding['status']=='RAW_ARTIFACT_UPLOADED'
        assert all(os.environ[k]=='success'for k in ['FETCH_OUTCOME','RAW_OUTCOME','BIND_OUTCOME','AUDIT_OUTCOME'])
        print('Nine comparator input bodies retained; audit uploaded. No classification repair or canonical import performed.')
        PANTHER_TERMINAL
