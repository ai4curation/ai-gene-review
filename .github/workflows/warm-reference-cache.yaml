name: ClinGen reference recovery batch 2
run-name: Reference recovery batch 2 at ${{ github.ref_name }} (${{ github.sha }})

# TEMPORARY: replace only this path on the dedicated task branch.
# The registered default-branch workflow is not changed or dispatched.
'on':
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: clingen-reference-recovery2-${{ github.ref }}
  cancel-in-progress: false

