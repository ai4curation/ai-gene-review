        """Bounded standard-fetcher orchestration; never authors source-cache content."""
        from pathlib import Path
        from datetime import datetime, timezone
        from importlib.metadata import version
        import hashlib
        import json
        import os
        import re
        import shutil
        import signal
        import subprocess
        import time
        import yaml

        BRANCH = 'refs/heads/cmungall/clingen-reference-fetch2-20260927'
        REACTOME_CALL = '''from pathlib import Path
        import sys
        from ai_gene_review.etl.reactome import cache_reactome_pathway
        raise SystemExit(0 if cache_reactome_pathway(sys.argv[1], output_dir=Path(sys.argv[2]), force=True) else 1)
        '''


        def digest(data):
            return {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                    'git_blob_sha': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()}


        def inspect_bytes(data, kind, identifier):
            text = data.decode('utf-8')
            if not text.startswith('---\n'):
                raise ValueError('Missing normal YAML frontmatter')
            parts = re.split(r'^---\s*$', text, maxsplit=2, flags=re.MULTILINE)
            if len(parts) != 3:
                raise ValueError('Incomplete frontmatter')
            meta = yaml.safe_load(parts[1])
            if not isinstance(meta, dict):
                raise ValueError('Frontmatter is not a mapping')
            if kind == 'pmid':
                if str(meta.get('pmid')) != identifier:
                    raise ValueError('Returned PMID label does not match request')
                if not isinstance(meta.get('title'), str) or not meta['title'].strip():
                    raise ValueError('No publication title')
                if not isinstance(meta.get('full_text_available'), bool):
                    raise ValueError('No normal boolean full_text_available metadata')
                extra = {'has_abstract_section': '## Abstract' in parts[2],
                         'has_full_text_section': '## Full Text' in parts[2]}
            elif kind == 'reactome':
                if meta.get('stable_id') != identifier:
                    raise ValueError('Returned Reactome label does not match request')
                if not isinstance(meta.get('display_name'), str) or not meta['display_name'].strip() or meta['display_name'] == 'Unknown pathway':
                    raise ValueError('No meaningful Reactome display_name')
                extra = {'has_summary': bool(meta.get('summary')), 'has_summary_section': '## Summary' in parts[2]}
            else:
                raise ValueError('Unsupported source kind')
            return {**digest(data), 'frontmatter': meta, **extra}


        def validate_requests(requests):
            if not isinstance(requests, list) or not 1 <= len(requests) <= 100:
                raise ValueError('Expected bounded request list')
            seen = set()
            for request in requests:
                kind, identifier, mode = request.get('kind'), request.get('id'), request.get('mode')
                pattern = {'pmid': r'[1-9][0-9]{0,8}', 'reactome': r'R-[A-Z]{3}-[1-9][0-9]{0,8}'}.get(kind)
                if not pattern or not isinstance(identifier, str) or not re.fullmatch(pattern, identifier):
                    raise ValueError('Invalid request kind or identifier')
                if mode not in ('fetch_missing', 'fresh_candidate'):
                    raise ValueError('Unsupported retrieval mode')
                if mode == 'fresh_candidate' and (kind, identifier) != ('pmid', '36126419'):
                    raise ValueError('Only the explicitly requested metadata-only PMID may be refreshed')
                if (kind, identifier) in seen:
                    raise ValueError('Duplicate source request')
                seen.add((kind, identifier))
            return requests


        def relative_cache_path(kind, identifier):
            return Path('publications', f'PMID_{identifier}.md') if kind == 'pmid' else Path('reactome', identifier + '.md')


        def command_for(request, runtime, work):
            kind, identifier = request['kind'], request['id']
            relative = relative_cache_path(kind, identifier)
            output_dir = work / relative.parent
            if kind == 'pmid':
                command = [str(runtime / 'bin/ai-gene-review'), 'fetch-pmid', identifier,
                           '--output-dir', str(output_dir), '--delay', '1.0']
                if request['mode'] == 'fresh_candidate':
                    command.append('--force')
            else:
                command = [str(runtime / 'bin/python'), '-c', REACTOME_CALL, identifier, str(output_dir)]
            return command, work / relative


        def main():
            if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch' or os.environ.get('GITHUB_REF') != BRANCH:
                raise ValueError('This helper is restricted to the dedicated dispatch branch')
            if os.environ.get('GITHUB_REPOSITORY') != 'ai4curation/ai-gene-review':
                raise ValueError('Unexpected source repository')
            repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()
            runner_temp = Path(os.environ['RUNNER_TEMP']).resolve()
            root = runner_temp / 'clingen-reference-recovery2'
            runtime = Path(os.environ['UV_PROJECT_ENVIRONMENT']).resolve()
            if not runtime.is_relative_to(root):
                raise ValueError('Runtime environment must stay in the dedicated runner temporary directory')
            artifact = root / 'artifact'
            work_root = root / 'fetch-work'
            work_root.mkdir(parents=True)
            logs = artifact / 'logs'
            logs.mkdir()
            requests = validate_requests(json.loads((artifact / 'requests.json').read_text()))
            report = {key: os.environ[key] for key in ['GITHUB_REPOSITORY', 'GITHUB_REF', 'GITHUB_SHA', 'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT']}
            report.update(started_utc=datetime.now(timezone.utc).isoformat(), entries=[], dependency_versions={},
                          source_code={}, request_sha256=digest((artifact / 'requests.json').read_bytes())['sha256'],
                          source_list_provenance_sha256=digest((artifact / 'source-list-provenance.json').read_bytes())['sha256'],
                          metadata_scope='Normal fetcher bytes and frontmatter are preserved. Label checks are not independent identifier mapping, scientific validation or completeness checks. Reactome formatter uses the requested stable ID; source-level title/scope still needs review.',
                          refresh_policy='PMID:36126419 is always freshly fetched into temp and quarantined from automatic import as a candidate. Existing checkout/local cache files are never overwritten.')
            for name in ['ai-gene-review', 'linkml-reference-validator', 'biopython', 'requests', 'PyYAML']:
                report['dependency_versions'][name] = version(name)
            for path in ['src/ai_gene_review/etl/publication.py', 'src/ai_gene_review/etl/reactome.py', 'src/ai_gene_review/cli.py', 'uv.lock', '.github/workflows/warm-reference-cache.yaml']:
                report['source_code'][path] = digest((repo / path).read_bytes())

            def checkpoint():
                (artifact / 'fetch-report.json').write_text(json.dumps(report, indent=2) + '\n')

            deadline = time.monotonic() + 60 * 60
            checkpoint()
            for request in requests:
                kind, identifier = request['kind'], request['id']
                result = {'kind': kind, 'id': identifier, 'mode': request['mode']}
                report['entries'].append(result)
                relative = relative_cache_path(kind, identifier)
                existing = repo / relative
                existing_bytes = existing.read_bytes() if existing.exists() else None
                if existing_bytes is not None:
                    result['existing_checkout'] = digest(existing_bytes)
                if existing_bytes is not None and request['mode'] == 'fetch_missing':
                    try:
                        result.update(inspect_bytes(existing_bytes, kind, identifier), status='already_present')
                    except Exception as exc:
                        result.update(status='existing_needs_inspection', inspection_error=str(exc))
                    checkpoint()
                    continue
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    result['status'] = 'not_attempted_run_budget'
                    checkpoint()
                    continue
                work = work_root / (kind + '_' + identifier)
                work.mkdir()
                command, generated = command_for(request, runtime, work)
                result.update(status='fetching', command=command, started_utc=datetime.now(timezone.utc).isoformat())
                checkpoint()
                with (logs / (kind + '_' + identifier + '.log')).open('w') as log:
                    process = subprocess.Popen(command, cwd=work, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                    try:
                        result['returncode'] = process.wait(timeout=min(180 if kind == 'pmid' else 45, remaining))
                        result['status'] = 'fetch_failed' if result['returncode'] else 'fetched'
                    except subprocess.TimeoutExpired:
                        os.killpg(process.pid, signal.SIGKILL)
                        process.wait()
                        result.update(status='timeout', returncode=process.returncode)
                if generated.exists():
                    raw = generated.read_bytes()
                    try:
                        result.update(inspect_bytes(raw, kind, identifier))
                        if result['returncode'] != 0:
                            raise ValueError('Fetcher did not complete successfully')
                        fresh = request['mode'] == 'fresh_candidate'
                        destination = artifact / ('candidates' if fresh else '') / relative
                        destination.parent.mkdir(parents=True, exist_ok=True)
                        shutil.copyfile(generated, destination)
                        assert destination.read_bytes() == raw
                        result.update(status='recovered_candidate' if fresh else 'recovered', artifact_path=str(destination.relative_to(artifact)))
                        if existing_bytes is not None:
                            result['identical_to_existing_checkout'] = raw == existing_bytes
                    except Exception as exc:
                        result.update(status='needs_inspection', inspection_error=str(exc))
                        destination = artifact / 'quarantine' / relative
                        destination.parent.mkdir(parents=True, exist_ok=True)
                        shutil.copyfile(generated, destination)
                        result['quarantine_path'] = str(destination.relative_to(artifact))
                elif result['status'] == 'fetched':
                    result['status'] = 'missing_output'
                if existing_bytes is not None and existing.read_bytes() != existing_bytes:
                    raise ValueError('Checkout cache changed unexpectedly')
                checkpoint()
                time.sleep(1.0)
            good = {'recovered', 'recovered_candidate', 'already_present'}
            report['finished_utc'] = datetime.now(timezone.utc).isoformat()
            report['unresolved_sources'] = [f"{r['kind']}:{r['id']}" for r in report['entries'] if r['status'] not in good]
            report['recovered_count'] = sum(r['status'] == 'recovered' for r in report['entries'])
            report['candidate_count'] = sum(r['status'] == 'recovered_candidate' for r in report['entries'])
            checkpoint()
            with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
                out.write(f"Recovered {report['recovered_count']} standard caches, {report['candidate_count']} refresh candidates; {len(report['unresolved_sources'])} unresolved.\n")
                out.write('Candidate records require explicit comparison before import. No repository cache was changed.\n')
            return int(bool(report['unresolved_sources']))


        if __name__ == '__main__':
            raise SystemExit(main())
        PY

    - name: Verify the checked-out repository is unchanged
      id: unchanged
      if: ${{ always() }}
      run: |
        git diff --exit-code
        git diff --cached --exit-code
        test -z "$(git ls-files --others --exclude-standard)"

    - name: Upload standard cache records and provenance only
      id: artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: clingen-reference-recovery2-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/clingen-reference-recovery2/artifact/
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: false
        overwrite: false

    - name: Report incomplete runs after preserving their artifact
      if: ${{ always() }}
      env:
        FETCH_OUTCOME: ${{ steps.fetch.outcome }}
        UNCHANGED_OUTCOME: ${{ steps.unchanged.outcome }}
        ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
      run: |
        python - <<'PY'
        from pathlib import Path
        import json, os
        receipt = {key: os.environ.get(key) for key in ['ARTIFACT_ID', 'ARTIFACT_DIGEST', 'ARTIFACT_URL']}
        print(json.dumps(receipt, sort_keys=True))
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
            out.write('Uploaded artifact receipt: ' + json.dumps(receipt, sort_keys=True) + '\n')
        failed = {key: os.environ.get(key) for key in ['FETCH_OUTCOME', 'UNCHANGED_OUTCOME', 'ARTIFACT_OUTCOME'] if os.environ.get(key) != 'success'}
        if failed:
            raise SystemExit(f'Incomplete reference recovery; inspect artifact/logs: {failed}')
        PY
