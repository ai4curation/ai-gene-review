name: ClinGen reference recovery batch 5
run-name: Reference recovery batch 5 at ${{ github.ref_name }} (${{ github.sha }})
"on":
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: clingen-reference-recovery5-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-reference-fetch5-20260927'
