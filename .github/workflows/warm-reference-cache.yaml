name: ClinGen reference recovery batch 95
run-name: Reference recovery batch 95 at ${{ github.ref_name }} (${{ github.sha }})
"on":
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: clingen-reference-recovery95-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-reference-fetch95-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Set isolated runtime paths after runner initialization
      run: |
        python - <<'PYENV'
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-reference-recovery95'
        with Path(os.environ['GITHUB_ENV']).open('a') as out:
            out.write('UV_CACHE_DIR='+str(root/'uv-cache')+'\n')
            out.write('UV_PROJECT_ENVIRONMENT='+str(root/'venv')+'\n')
        PYENV
    - name: Initialize fixed source requests and partial report
      run: |
        python - <<'PYINIT'
        from pathlib import Path
        import json, os, base64, zlib, hashlib
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-reference-recovery95'/'artifact'
        root.mkdir(parents=True)
        REQUESTS_B85 = 'c-pO0O;6iE5WVv&MmZ;T0xGC*YLg2>6hwP#P_*8i#6$N>yXyoO^}ly^oj_<$m3oMr`Fb<+=Gos*0ABb9F#17OjV@v24XM$1@KN!con2g<&8D-1*EogQzs4lnm7y5PZVtf>T8te1UQBj;p5H8PM#XyE=SWH-k+a8nFZ(BlQ|}A@76Yvb)ynNGhSi~J6|L~Gb!p$S)OeBFT$7Bi1FkWkl{k??wm4}7&-wAgL}8?jtq(Yp15T_(j2NRqo2sYi>@lzlv>_|>>K{6kc_%)Q5uu-uVq8l7U(lLt-t+v(mGC*`CWE=;11#BGzMfz?8XqGttS(d)k|E%x(;{Jn)FOPFe*)P{jcf(iZCbcr%z<nPiYDgy!L8YQ18ZSO_n^AKrvx-j=$$1A3b&}8FU%Y_R*rJp*|g%J&g-X&6D8{Ebb30grf1c3dhzZ$0~M<-=v>yO<l|*s`>rvlDk~eRtTvUUw%WLDeb}}>#&}i3{{RcPCEPJsbX}0RiqZ|5yUV9zB838c7BVqGYmy{1+}~a=#!wg^!{Y9G45CY|3vmpJIR{}CNN2o8Huzn_XH=Qy6d0z0FOCuB*9+K*2#TWDqDOTFw$mC63LC+?1Q?TOG{qLxxHx=pTeQQy80IT#lqn;Z=9AXNZ0$LL2aKI&LEj=rRfHYObl4`M7lG&GE3aLEhMabre&`|I2KT~asAK2Z%va|=in#BC<Gda5ta&w$HjA3EhBpTe8t0VM7J(V&LnOyDg^ojpp%Fv%UKM#Y!7^MmuH*F3zn$O}G4oo&yk_1c3)ETNUqQ$-9gXu=L-DA8gS;@pIw1Z;-UKDL4UAUaT@YJAS~R3{p>jCfftU|wijOlXlmK%k*pOO~fk8g+mNCNnEKc*sH*=ryYxn@3<bRJRzX9u4x`Y'
        REQUESTS_SHA256 = '8289888ca29113dae0f794caa7079eea71216ef42fc0bc86687a7fd1671fbce6'
        def decoded(payload, expected):
            raw=zlib.decompress(base64.b85decode(payload))
            if hashlib.sha256(raw).hexdigest()!=expected:
                raise ValueError('Embedded source provenance checksum mismatch')
            return raw
        (root/'requests.json').write_bytes(decoded(REQUESTS_B85, REQUESTS_SHA256))
        receipt={key:os.environ[key] for key in ['GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']}
        receipt.update(status='initialized_before_dependency_install',scope='1 fixed normal PMID request; no gene seeding, provider run or source authoring')
        (root/'run-receipt.json').write_text(json.dumps(receipt,indent=2)+'\n')
        (root/'fetch-report.json').write_text(json.dumps(dict(receipt,entries=[]),indent=2)+'\n')
        PYINIT
