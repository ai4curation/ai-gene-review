ecovery batch; frozen source9 is unchanged. No other cited source gap or provider-only source exists in this gene directory."\n      },\n      {\n        "path": "genes/human/AICDA/AICDA-notes.md",\n        "type": "explicit_source_citation",\n        "line": 23,\n        "text": "Accordingly, the four existing cytidine-deaminase assertions are retained. The core uses verified [GO:0019239 deaminase activity](https://amigo.geneontology.org/amigo/term/GO%3A0019239), with the DNA substrate specified in prose, and the two very broad hydrolase assertions are refined to it. No DNA-specific MF identifier was invented. The remaining ontology question distinguishes the known chemistry from the absence of an adequately specific term found in this search. [PMID:28757211](https://pmc.ncbi.nlm.nih.gov/articles/PMC5771415/) and the [author PDF](https://wulab.tch.harvard.edu/_files/ugd/feeaaa_f8d5b1054d45494f9494cfd5c7918e44.pdf) support engineered human AID recognition of structured DNA, catalytic zinc and substrate-dependent oligomerization. Bound cytidine derivatives in a structure are not used as a turnover assay, nor is an obligatory native homodimer claimed."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "30361410",\n    "mode": "fetch_missing",\n    "genes": [\n      "ABHD5"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ABHD5/ABHD5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1512,\n        "text": "- id: PMID:30361410"\n      },\n      {\n        "path": "genes/human/ABHD5/ABHD5-notes.md",\n        "type": "explicit_source_citation",\n        "line": 28,\n        "text": "Normal installed-CLI fetches then attempted PMID:40818613, PMID:30361410,"\n      },\n      {\n        "path": "genes/human/ABHD5/ABHD5-notes.md",\n        "type": "explicit_source_citation",\n        "line": 109,\n        "text": "[PMID:30361410](https://pubmed.ncbi.nlm.nih.gov/30361410/), full indexed"\n      },\n      {\n        "path"