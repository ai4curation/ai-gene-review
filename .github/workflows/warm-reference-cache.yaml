 },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 146,\n        "text": "- Identity and catalytic function: ACSL4 is a membrane‑associated long‑chain acyl‑CoA synthetase that activates long‑chain polyunsaturated fatty acids (PUFAs) by ligating them to CoA in an ATP‑dependent adenylation/thiolation reaction, generating PUFA‑CoAs used for complex lipid synthesis and β‑oxidation substrates (AMP‑binding/adenylate domain plus C‑terminal catalytic domain; ~711 aa, ~80 kDa) (Jul 2023; https://doi.org/10.1097/cm9.0000000000002533) (ding2023acylcoasynthaseacsl4 pages 1-2, chen2023theacsl4network pages 5-7).",\n        "mapped_pmid": "37442770",\n        "title": "Acyl-CoA synthase ACSL4: an essential target in ferroptosis and fatty acid metabolism",\n        "doi_aliases": [\n          "10.1097/cm9.0000000000002533"\n        ],\n        "pmc_aliases": [\n          "PMC10617883"\n        ],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37442770/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/37442770/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-explicit-web.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 153,\n        "text": "- Refined structural/biochemical framing: Contemporary reviews summarize ACSL4 domain architecture (AMP/adenylate‑binding region, catalytic triad Lys‑Asp‑Cys) and its biochemical selectivity for PUFA activation underlying ferroptotic susceptibility (Jul 2023; https://doi.org/10.1097/cm9.0000000000002533) (chen2023theacsl4network page