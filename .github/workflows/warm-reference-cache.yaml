name: ClinGen bounded source and seed recovery 59
run-name: Source and seed recovery 59 at ${{ github.ref_name }} (${{ github.sha }})

# TEMPORARY: replace only this path on the dedicated task branch.
# The registered default-branch workflow is not changed or dispatched.
'on':
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: clingen-source-seed-recovery59-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-source-seed-fetch59-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Set isolated runtime paths after runner initialization
      run: |
        python - <<'PYENV'
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-source-seed-recovery59'
        with Path(os.environ['GITHUB_ENV']).open('a') as out:
            out.write('UV_CACHE_DIR='+str(root/'uv-cache')+'\n')
            out.write('UV_PROJECT_ENVIRONMENT='+str(root/'venv')+'\n')
        PYENV
    - name: Install uv without a shared dependency cache
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Initialize fixed source requests and partial report
      run: |
        python - <<'PYINIT'
        from pathlib import Path
        import json, os, base64, zlib, hashlib
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-source-seed-recovery59'/'artifact'
        root.mkdir(parents=True)
        REQUESTS_B85 = 'c-nPRO;6)65WV+T%x14`OsZ0(a-wCI<<JjN2?<bTxz4n)*0Ceop<5yTJGK*O7R1H!JinRuX2vf)fTSu#Zj%W-ZTcbHqrw>a0N^E_9=6AFtEI=2>3lUx`tNwLSDcDGJp8#?%qH2{MRt0vm8gt%En$@n$D>XzlY-ffSOk6f;q-&!fyamWuWr2jJ<GB#5HtQm=CkE$J?<jc_jjYD4L2VKM2^Y{cchgOB{N4_8~Mpj;ap`Wgd7fsRPn7yl`K;wigd4^NthKGpASh_s+-aFpK7xw?fvhTG;<(c+Z?~k45bw-(Z<}IITqCh%^n5@D{UP4`Gd3zAgAenX*155TCOV$Ygmha5ZGifo8CeptkXttCP5pBRA@x(CG2!<9HIioIa({U>O-^*Oyv;TL7~7F-pe4k1<AH3Eii+?wc1I+-9RhZ@D)CziKQxsIe4L)<<+}bdiocB8`@B*y(hXu$BW?Fp(%y($n|1PcTC9IAXS=%sZd?Js&=+%{nekF-fQm-3KP&='
        REQUESTS_SHA256 = 'c5f5a81324347fe0c680f450e15e2103c0536e0f804e3e26ae3b3fce0c9ea6c2'
        def decoded(payload, expected):
            raw=zlib.decompress(base64.b85decode(payload))
            if hashlib.sha256(raw).hexdigest()!=expected:
                raise ValueError('Embedded source provenance checksum mismatch')
            return raw
        (root/'requests.json').write_bytes(decoded(REQUESTS_B85, REQUESTS_SHA256))
        receipt={key:os.environ[key] for key in ['GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']}
