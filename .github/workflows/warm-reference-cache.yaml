name: ClinGen reference recovery batch 91
run-name: Reference recovery batch 91 at ${{ github.ref_name }} (${{ github.sha }})
"on":
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: clingen-reference-recovery91-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-reference-fetch91-20260930'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Set isolated runtime paths after runner initialization
      run: |
        python - <<'PYENV'
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-reference-recovery91'
        with Path(os.environ['GITHUB_ENV']).open('a') as out:
            out.write('UV_CACHE_DIR='+str(root/'uv-cache')+'\n')
            out.write('UV_PROJECT_ENVIRONMENT='+str(root/'venv')+'\n')
        PYENV
    - name: Initialize fixed source requests and partial report
      run: |
        python - <<'PYINIT'
        from pathlib import Path
        import json, os, base64, zlib, hashlib
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-reference-recovery91'/'artifact'
