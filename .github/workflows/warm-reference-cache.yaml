vider_doi_citation",\n        "original_doi": "10.1126/science.adg6812",\n        "normalized_doi": "10.1126/science.adg6812",\n        "primary_pmid": "37228182",\n        "primary_title": "Structures of the free and capped ends of the actin filament.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37228182/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 232,\n        "text": "12. https://doi.org/10.1126/science.adg6812",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1126/science.adg6812",\n        "normalized_doi": "10.1126/science.adg6812",\n        "primary_pmid": "37228182",\n        "primary_title": "Structures of the free and capped ends of the actin filament.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37228182/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 237,\n        "text": "17. https://doi.org/10.1126/science.adg6812.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1126/science.adg6812",\n        "normalized_doi": "10.1126/science.adg6812",\n        "primary_pmid": "37228182",\n        "primary_title": "Structures of the free and capped ends of the actin filament.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37228182/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 241,\n        "text": "21. https://doi.org/10.1126/science.adg6812,",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1126/science.adg6812",\n        "normalized_doi": "10.1126/science.adg6812",\n        "primary_pmid": "37228182",\n        "primary_title": "Structures of the free and capped ends of the actin filament.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37228182/"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "37371069",\n    "mode": "fetch_missing",\n    "genes": [\n      "ADGRV1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 200,\n        "text": "A CRISPR-generated *adgrv1* zebrafish model provided functional support in 2023. Loss of periciliary Adgrv1 reduced *ush2a* and *whrnb* expression by **34% and 26%**, respectively, caused abnormal rhodopsin accumulation in photoreceptor cell bodies, and reduced ERG B-wave amplitude. These observations connect the USH2 complex to photoreceptor protein localization and retinal physiology. The model did not develop clear progressive adult degeneration, plausibly because zebrafish regenerate photoreceptors, limiting its fidelity to human retinitis pigmentosa. [Stemerdink et al., published June 2023](https://doi.org/10.3390/cells12121598). (stemerdink2023generationandcharacterization pages 11-13)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/cells12121598",\n        "normalized_doi": "10.3390/cells12121598",\n        "primary_pmid": "37371069",\n        "primary_title": "Generation and Characterization of a Zebrafish Model for ADGRV1-Associated Retinal Dysfunction Using CRISPR/Cas9 Genome Editing Technology.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37371069/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 273,\n        "text": "10. (stemerdink2023generationandcharacterization pages 11-13): Merel Stemerdink, Sanne Broekman, Theo Peters, Hannie Kremer, Erik de Vrieze, and Erwin van Wijk. Generation and characterization of a zebrafish model for adgrv1-associated retinal dysfunction using crispr/cas9 genome editing technology. Cells, 12:1598, Jun 2023. URL: https://doi.org/10.3390/cells12121598, doi:10.3390/cells12121598. This article has 23 citations.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/cells12121598",\n        "normalized_doi": "10.3390/cells12121598",\n        "primary_pmid": "37371069",\n        "primary_title": "Generation and Characterization of a Zebrafish Model for ADGRV1-Associated Retinal Dysfunction Using CRISPR/Cas9 Genome Editing Technology.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37371069/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 330,\n        "text": "30. https://doi.org/10.3390/cells12121598",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/cells12121598",\n        "normalized_doi": "10.3390/cells12121598",\n        "primary_pmid": "37371069",\n        "primary_title": "Generation and Characterization of a Zebrafish Model for ADGRV1-Associated Retinal Dysfunction Using CRISPR/Cas9 Genome Editing Technology.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37371069/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 345,\n        "text": "45. https://doi.org/10.3390/cells12121598,",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/cells12121598",\n        "normalized_doi": "10.3390/cells12121598",\n        "primary_pmid": "37371069",\n        "primary_title": "Generation and Characterization of a Zebrafish Model for ADGRV1-Associated Retinal Dysfunction Using CRISPR/Cas9 Genome Editing Technology.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37371069/"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "37422204",\n    "mode": "fetch_missing",\n    "genes": [\n      "ADGRV1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 226,\n        "text": "The largest detailed ADGRV1-specific cohort reported through 2023 included **30 patients from 28 families**. Hearing loss began in the first decade in all participants; mean onset of visual symptoms was **17.0 ± 7.7 years**, and **90%** had no or only mild visual impairment at baseline. Hyperautofluorescent retinal rings occurred in **70%**, perimacular reduced-autofluorescence patches in **59%**, and bone-spicule-like pigment in **63%**. Of 49 identified variants, **26 (53%) were previously unreported**, and **68% of families** had two null alleles. Central vision was often preserved into late adulthood despite peripheral retinal degeneration. [Varela et al., published December 2023](https://doi.org/10.1016/j.ajo.2023.06.026). (varela2023detailedclinicalophthalmic pages 1-2, varela2023detailedclinicalophthalmic pages 7-9)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1016/j.ajo.2023.06.026",\n        "normalized_doi": "10.1016/j.ajo.2023.06.026",\n        "primary_pmid": "37422204",\n        "primary_title": "Detailed Clinical, Ophthalmic, and Genetic Characterization of ADGRV1-Associated Usher Syndrome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37422204/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 283,\n        "text": "15. (varela2023detailedclinicalophthalmic pages 1-2): Malena Daich Varela, Shiao Wei Wong, Gulunay Kiray, Patricio G. Schlottmann, Gavin Arno, Amjaad N. Abu Shams, Omar A. Mahroo, Andrew R. Webster, Alaa AlTalbishi, and Michel Michaelides. Detailed clinical, ophthalmic, and genetic characterization of adgrv1-associated usher syndrome. American Journal of Ophthalmology, 256:186-195, Dec 2023. URL: https://doi.org/10.1016/j.ajo.2023.06.026, doi:10.1016/j.ajo.2023.06.026. This article has 8 citations and is from a domain leading peer-reviewed journal.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1016/j.ajo.2023.06.026",\n        "normalized_doi": "10.1016/j.ajo.2023.06.026",\n        "primary_pmid": "37422204",\n        "primary_title": "Detailed Clinical, Ophthalmic, and Genetic Characterization of ADGRV1-Associated Usher Syndrome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37422204/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 285,\n        "text": "16. (varela2023detailedclinicalophthalmic pages 7-9): Malena Daich Varela, Shiao Wei Wong, Gulunay Kiray, Patricio G. Schlottmann, Gavin Arno, Amjaad N. Abu Shams, Omar A. Mahroo, Andrew R. Webster, Alaa AlTalbishi, and Michel Michaelides. Detailed clinical, ophthalmic, and genetic characterization of adgrv1-associated usher syndrome. American Journal of Ophthalmology, 256:186-195, Dec 2023. URL: https://doi.org/10.1016/j.ajo.2023.06.026, doi:10.1016/j.ajo.2023.06.026. This article has 8 citations and is from a domain leading peer-reviewed journal.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1016/j.ajo.2023.06.026",\n        "normalized_doi": "10.1016/j.ajo.2023.06.026",\n        "primary_pmid": "37422204",\n        "primary_title": "Detailed Clinical, Ophthalmic, and Genetic Characterization of ADGRV1-Associated Usher Syndrome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37422204/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 335,\n        "text": "35. https://doi.org/10.1016/j.ajo.2023.06.026",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1016/j.ajo.2023.06.026",\n        "normalized_doi": "10.1016/j.ajo.2023.06.026",\n        "primary_pmid": "37422204",\n        "primary_title": "Detailed Clinical, Ophthalmic, and Genetic Characterization of ADGRV1-Associated Usher Syndrome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37422204/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 347,\n        "text": "47. https://doi.org/10.1016/j.ajo.2023.06.026,",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1016/j.ajo.2023.06.026",\n        "normalized_doi": "10.1016/j.ajo.2023.06.026",\n        "primary_pmid": "37422204",\n        "primary_title": "Detailed Clinical, Ophthalmic, and Genetic Characterization of ADGRV1-Associated Usher Syndrome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37422204/"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "37632366",\n    "mode": "fetch_missing",\n    "genes": [\n      "ACTB"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 150,\n        "text": "- Near-atomic cryo-EM of filament ends and capping (Science 2023; commentary 2023): Carman et al. resolved free and capped ends, showing flat F-actin-like terminal protomers at the barbed end (free barbed 3.30 Å) and G-actin–like twisted conformations at the pointed end (free pointed 2.84 Å). CapZ binding to the barbed end is captured at 2.79 Å and leaves barbed-end protomers largely flat while CapZ undergoes conformational change; tropomodulin binding at the pointed end (3.26 Å) forces the second protomer into an F-actin-like state, forming a knot-like interaction with the first three subunits. These conformations explain end-specific kinetics and capping mechanisms. URL: https://doi.org/10.1126/science.adg6812 (Jun 2023); commentary: https://doi.org/10.1002/cm.21770 (Aug 2023). (carman2023structuresofthe pages 10-14, carman2023structuresofthe pages 7-10, carman2023structuresofthe pages 3-4, barrie2023conformationofactin pages 1-2, barrie2023conformationofactin pages 4-6)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1002/cm.21770",\n        "normalized_doi": "10.1002/cm.21770",\n        "primary_pmid": "37632366",\n        "primary_title": "Conformation of actin subunits at the barbed and pointed ends of F-actin with and without capping proteins.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37632366/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 176,\n        "text": "| End-conformation commentary | Commentary summarizes that barbed-end protomers are \\"flat\\" (primed for addition) while pointed-end protomers are \\"twisted\\" G-actin–like (primed for dissociation); CapZ changes conformation but leaves barbed-end protomers largely unchanged, Tmod forces protomer-2 flat. (barrie2023conformationofactin pages 2-4) | In vitro F-actin filaments | Cryo-EM analysis / commentary | Cytoskeleton | Aug 2023 | https://doi.org/10.1002/cm.21770 (barrie2023conformationofactin pages 2-4) |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1002/cm.21770",\n        "normalized_doi": "10.1002/cm.21770",\n        "primary_pmid": "37632366",\n        "primary_title": "Conformation of actin subunits at the barbed and pointed ends of F-actin with and without capping proteins.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37632366/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 197,\n        "text": "2. (barrie2023conformationofactin pages 1-2): Kyle R. Barrie, Peter J. Carman, and Roberto Dominguez. Conformation of actin subunits at the barbed and pointed ends of f‐actin with and without capping proteins. Cytoskeleton, 80:309-312, Aug 2023. URL: https://doi.org/10.1002/cm.21770, doi:10.1002/cm.21770. This article has 2 citations and is from a peer-reviewed journal.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1002/cm.21770",\n        "normalized_doi": "10.1002/cm.21770",\n        "primary_pmid": "37632366",\n        "primary_title": "Conformation of actin subunits at the barbed and pointed ends of F-actin with and without capping proteins.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37632366/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 199,\n        "text": "3. (barrie2023conformationofactin pages 4-6): Kyle R. Barrie, Peter J. Carman, and Roberto Dominguez. Conformation of actin subunits at the barbed and pointed ends of f‐actin with and without capping proteins. Cytoskeleton, 80:309-312, Aug 2023. URL: https://doi.org/10.1002/cm.21770, doi:10.1002/cm.21770. This article has 2 citations and is from a peer-reviewed journal.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1002/cm.21770",\n        "normalized_doi": "10.1002/cm.21770",\n        "primary_pmid": "37632366",\n        "primary_title": "Conformation of actin subunits at the barbed and pointed ends of F-actin with and without capping proteins.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37632366/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 217,\n        "text": "12. (barrie2023conformationofactin pages 2-4): Kyle R. Barrie, Peter J. Carman, and Roberto Dominguez. Conformation of actin subunits at the barbed and pointed ends of f‐actin with and without capping proteins. Cytoskeleton, 80:309-312, Aug 2023. URL: https://doi.org/10.1002/cm.21770, doi:10.1002/cm.21770. This article has 2 citations and is from a peer-reviewed journal.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1002/cm.21770",\n        "normalized_doi": "10.1002/cm.21770",\n        "primary_pmid": "37632366",\n        "primary_title": "Conformation of actin subunits at the barbed and pointed ends of F-actin with and without capping proteins.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37632366/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 233,\n        "text": "13. https://doi.org/10.1002/cm.21770",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1002/cm.21770",\n        "normalized_doi": "10.1002/cm.21770",\n        "primary_pmid": "37632366",\n        "primary_title": "Conformation of actin subunits at the barbed and pointed ends of F-actin with and without capping proteins.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37632366/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 242,\n        "text": "22. https://doi.org/10.1002/cm.21770,",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1002/cm.21770",\n        "normalized_doi": "10.1002/cm.21770",\n        "primary_pmid": "37632366",\n        "primary_title": "Conformation of actin subunits at the barbed and pointed ends of F-actin with and without capping proteins.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37632366/"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "37804316",\n    "mode": "fetch_missing",\n    "genes": [\n      "AFG3L2"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 216,\n        "text": "Importantly, they show **pharmacologic potentiation of ISR via Sephin-1** improves growth of SPAX5 fibroblasts, improves Purkinje neuron survival/arborization ex vivo, and **extends lifespan and improves cerebellar/mitochondrial phenotypes** in Afg3l2−/− mice—supporting ISR modulation as a plausible therapeutic direction. Publication date: **Oct 2024**. URL: https://doi.org/10.1093/brain/awad340 (franchino2024sustainedoma1mediatedintegrated pages 1-2)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 267,\n        "text": "| Protein/complex | **AFG3L2 = human mitochondrial inner-membrane m-AAA protease subunit** (UniProt Q9Y4W6); assembles as **homo-hexamers** or **hetero-hexamers with SPG7/paraplegin** to form the matrix-facing m-AAA protease complex (franchino2024sustainedoma1mediatedintegrated pages 1-2, dastidar2024multifacetedrolesof pages 1-2, dastidar2024multifacetedrolesof pages 2-5) | Review + primary | Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z; Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 268,\n        "text": "| Localization/topology | **Inner mitochondrial membrane (IMM)**, catalytic sites/AAA+ module **facing the matrix**; IM-anchored metalloprotease involved in protein quality control and mitochondrial biogenesis (franchino2024sustainedoma1mediatedintegrated pages 1-2, khalimonchuk2023moleculardeterminantsof pages 6-8, chandragiri2024afg3l2mediatedproteolysisrestricts pages 1-5) | Review + primary | Khalimonchuk & Becker, 2023, *Antioxid Redox Signal*, https://doi.org/10.1089/ars.2022.0124; Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 279,\n        "text": "| Regulatory pathway: OMA1–DELE1–HRI ISR | In AFG3L2 deficiency/mutation, **mitochondrial proteotoxic stress** causes **OMA1 overactivation**, excessive **OPA1 processing**, mitochondrial fragmentation, and activation of the **OMA1–DELE1–HRI integrated stress response (ISR)** with increased eIF2α phosphorylation and ATF4 signaling (franchino2024sustainedoma1mediatedintegrated pages 1-2) | Primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 280,\n        "text": "| Human disease: SCA28 | **Spinocerebellar ataxia type 28 (SCA28)**: typically **autosomal dominant**, usually from **heterozygous AFG3L2 variants**, characterized by slowly progressive gait/limb ataxia with frequent oculomotor abnormalities (dastidar2024multifacetedrolesof pages 15-16, dastidar2024multifacetedrolesof pages 10-11, lopergolo2024autosomalrecessivecerebellar pages 4-5, franchino2024sustainedoma1mediatedintegrated pages 1-2) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 281,\n        "text": "| Human disease: DOA12 / OPA12 | **Dominant optic atrophy 12 (DOA12/OPA12)**: generally **autosomal dominant**, associated especially with **heterozygous ATPase- or catalytic-domain variants**; may overlap with ophthalmoplegia and broader mitochondrial optic neuropathy phenotypes (dastidar2024multifacetedrolesof pages 15-16, dastidar2024multifacetedrolesof pages 13-15, franchino2024sustainedoma1mediatedintegrated pages 1-2) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 282,\n        "text": "| Human disease: SPAX5 | **Spastic ataxia type 5 / early-onset spastic ataxia-neuropathy syndrome (SPAX5)**: **autosomal recessive**, caused by **biallelic AFG3L2 variants**; severe childhood-onset phenotype with cerebellar ataxia, spasticity, dystonia, neuropathy, and in some cases myoclonic epilepsy (dastidar2024multifacetedrolesof pages 15-16, lopergolo2024autosomalrecessivecerebellar pages 4-5, dastidar2024multifacetedrolesof pages 13-15, franchino2024sustainedoma1mediatedintegrated pages 1-2) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 283,\n        "text": "| Therapeutic/diagnostic implications | Current clinical use is mainly **genetic diagnosis/variant interpretation** (NGS panels, exome-based workup for ataxia/optic neuropathy). Preclinical 2024 evidence suggests **ISR potentiation with Sephin-1** can improve SPAX5 cellular and mouse phenotypes; molecular readouts include **eIF2α phosphorylation, ATF4 targets, CHOP/CHAC1/FGF21** (dastidar2024multifacetedrolesof pages 15-16, dastidar2024multifacetedrolesof pages 10-11, franchino2024sustainedoma1mediatedintegrated pages 1-2) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxi