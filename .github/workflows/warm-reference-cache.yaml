 Cells.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39769373/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 169,\n        "text": "- Isoform-specific effects: β-actin knockdown increased nuclear area and shifted lamins (↓A-type; ↑lamin B2) with histone PTM changes (↓H3K9me2; ↑H3K9ac); KDM3A mRNA up ~1.6-fold in β-actin–depleted A549 cells. Publication date: Dec 2024. URL: https://doi.org/10.3390/ijms252413607. (shagieva2024divergentcontributionof pages 5-10)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/ijms252413607",\n        "normalized_doi": "10.3390/ijms252413607",\n        "primary_pmid": "39769373",\n        "primary_title": "Divergent Contribution of Cytoplasmic Actins to Nuclear Structure of Lung Cancer Cells.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/39769373/"\n      },\n      {\n        "path": "genes/human/ACTB/ACTB-deep-research-falcon.md",\n        "line": 179,\n        "text": "| Isoform-specific nuclear effects (β vs γ) | In A549 lung cancer cells, β-actin knockdown increased nuclear area, decreased A-type lamins, increased lamin B2, decreased H3K9me2 and increased H3K9ac; RNA-seq showed KDM3A upregulated ~1.6-fold, indicating isoform-specific control of chromatin state. (shagieva2024divergentcontributionof pages 5-10) | A549 (human lung adenocarcinoma) cells | shRNA knockdown, IF, Western blot, RNA-seq | International Journal of Molecular Sciences | Dec 2024 | https://doi.org/10.3390/ijms252413607 (shagieva2024divergentcontributionof pages 5-10) |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/ijms252413607",\n        "normalized_doi": "10.3390/ijms252413607",\n        "primary_pmid": "39769373",\n        "primary_title": "Divergent Contribution of Cytoplasmic Actins to Nuclear Structure of Lung Cancer Cells.",\n        "primary_url": "https://pubm