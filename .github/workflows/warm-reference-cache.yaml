    - name: Verify the checked-out repository is unchanged
      id: unchanged
      if: ${{ always() }}
      run: |
        git diff --exit-code
        git diff --cached --exit-code
        test -z "$(git ls-files --others --exclude-standard)"
    - name: Upload raw normal sources and partial reports
      id: artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: clingen-reference-recovery19-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/clingen-reference-recovery19/artifact/
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: false
        overwrite: false
    - name: Report incomplete recovery after preserving outputs
      if: ${{ always() && (steps.fetch.outcome != 'success' || steps.unchanged.outcome != 'success' ||
        steps.artifact.outcome != 'success') }}
      run: exit 1
