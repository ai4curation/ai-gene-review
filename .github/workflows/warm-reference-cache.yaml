"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 251,\n        "text": "| Identity | AGO1 = human argonaute RISC component 1 (EIF2C1), UniProt Q9UL18 | Member of mammalian AGO1-4 subfamily; core effector of miRNA-loaded RISC; conserved N, PAZ, MID, PIWI domains | (narasimhan2025partnersinsilencing pages 4-5, carvalho2019studyofhuman pages 27-29) | 2019; 2025; https://doi.org/10.3390/ncrna11040062 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/ncrna11040062",\n        "normalized_doi": "10.3390/ncrna11040062",\n        "primary_pmid": "40863728",\n        "primary_title": "Partners in Silencing: Decoding the Mammalian Argonaute Interactome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/40863728/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 252,\n        "text": "| Core molecular function in miRISC | Small-RNA loading, guide stabilization, target recognition, post-transcriptional repression | Pre-miRNA processing/loading involves DICER1 with TRBP/PACT; AGO loading requires HSC70/HSP90/p23; AGO1-bound miRNAs recognize targets mainly through seed nt 2-8, usually in 3′ UTRs; repression proceeds largely via translational repression plus deadenylation/decapping-linked decay rather than slicing | (narasimhan2025partnersinsilencing pages 2-4, narasimhan2025partnersinsilencing pages 1-2) | 2025; https://doi.org/10.3390/ncrna11040062 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/ncrna11040062",\n        "normalized_doi": "10.3390/ncrna11040062",\n        "primary_pmid": "40863728",\n        "primary_title": "Partners in Silencing: Decoding the Mammalian Argonaute Interactome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/40863728/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 253,\n        "text": "| Catalytic status vs AGO2 | AGO1 is a non-slicer AGO; AGO2 is the principal human slicer | AGO1/3/4 cannot nick passenger strand like AGO2; AGO1 lacks the catalytic tetrad associated with AGO2 slicing; passenger-strand removal instead exploits duplex mismatches, especially guide positions 13-16 | (narasimhan2025partnersinsilencing pages 2-4, narasimhan2025partnersinsilencing pages 4-5, carvalho2019studyofhuman pages 27-29) | 2019; 2025; https://doi.org/10.3390/ncrna11040062 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/ncrna11040062",\n        "normalized_doi": "10.3390/ncrna11040062",\n        "primary_pmid": "40863728",\n        "primary_title": "Partners in Silencing: Decoding the Mammalian Argonaute Interactome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/40863728/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 254,\n        "text": "| Key interactors: loading/assembly | DICER1, TRBP, PACT, HSC70, HSP90, p23, C3PO | These factors support pre-miRNA processing, RISC loading, AGO opening/folding, and passenger-strand disposal; complete passenger degradation can be executed by C3PO (TSN/TRAX) | (narasimhan2025partnersinsilencing pages 1-2) | 2025; https://doi.org/10.3390/ncrna11040062 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/ncrna11040062",\n        "normalized_doi": "10.3390/ncrna11040062",\n        "primary_pmid": "40863728",\n        "primary_title": "Partners in Silencing: Decoding the Mammalian Argonaute Interactome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/40863728/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 255,\n        "text": "| Key interactors: repression/decay | TNRC6/GW182, CCR4-NOT, PABP, PAN2-PAN3, PARN, DDX6, DCP1/2, XRN1, exosome | GW182/TNRC6 scaffolds recruit CCR4-NOT/PABP deadenylation machinery; PAN2-PAN3 shortens poly(A) tails to ~50-110 nt; DDX6 links CCR4-NOT to decapping; DCP1/2 support decapping; XRN1/exosome degrade decapped transcripts | (narasimhan2025partnersinsilencing pages 2-4, narasimhan2025partnersinsilencing pages 4-5) | 2025; https://doi.org/10.3390/ncrna11040062 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/ncrna11040062",\n        "normalized_doi": "10.3390/ncrna11040062",\n        "primary_pmid": "40863728",\n        "primary_title": "Partners in Silencing: Decoding the Mammalian Argonaute Interactome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/40863728/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 256,\n        "text": "| Subcellular localization / context | Cytoplasm, P-bodies, stress granules, ER-associated condensates; some evidence for nuclear roles across mammalian Argonautes | Canonical repression is cytoplasmic; AGO1 localizes to P-bodies; AGO1-4 localize to stress granules; AGO-family N-terminal lipid-binding motif can drive PI(4,5)P2-dependent ER-associated condensates; miRISC composition influences localization | (narasimhan2025partnersinsilencing pages 8-10, narasimhan2025partnersinsilencing pages 11-13) | 2025; https://doi.org/10.3390/ncrna11040062 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/ncrna11040062",\n        "normalized_doi": "10.3390/ncrna11040062",\n        "primary_pmid": "40863728",\n        "primary_title": "Partners in Silencing: Decoding the Mammalian Argonaute Interactome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/40863728/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 257,\n        "text": "| Post-translational modifications | SUMOylation, phosphorylation, ubiquitination, PARylation | RANBP2 promotes AGO1/2 sumoylation; CSNK1A1 phosphorylates AGO1-3 EI region; STUB1 adds K48 polyubiquitin to AGO1-4; PARP poly(ADP-ribosyl)ates AGO1-4 mainly in stress granules and can inhibit miRISC repression under stress | (narasimhan2025partnersinsilencing pages 8-10, narasimhan2025partnersinsilencing media 7103b7a6) | 2025; https://doi.org/10.3390/ncrna11040062 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/ncrna11040062",\n        "normalized_doi": "10.3390/ncrna11040062",\n        "primary_pmid": "40863728",\n        "primary_title": "Partners in Silencing: Decoding the Mammalian Argonaute Interactome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/40863728/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 258,\n        "text": "| Specialized isoform | AGO1x translational readthrough isoform | Let-7a promotes readthrough; AGO1x binds miRNA, DICER, and target mRNA but does not bind GW182/TNRC6A, so AGO1x-RISC fails to repress targets; overexpression increases global translation and reduces processing bodies | (narasimhan2025partnersinsilencing pages 10-11) | 2025; https://doi.org/10.3390/ncrna11040062 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/ncrna11040062",\n        "normalized_doi": "10.3390/ncrna11040062",\n        "primary_pmid": "40863728",\n        "primary_title": "Partners in Silencing: Decoding the Mammalian Argonaute Interactome.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/40863728/"\n      },\n      {\n        "path": "genes/human/AGO1/AGO1-deep-research-falcon.md",\n        "line": 267,\n        "text": "1. (narasimhan2025partnersinsilencing pages 4-5): Srinaath Narasimhan and Stefan J. Erkeland. Partners in silencing: decoding the mammalian argonaute interactome. Non-Coding RNA, 11:62, Aug 2025. URL: https://doi.org/10.3390/ncrna1104006