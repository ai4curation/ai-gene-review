---
name: ClinGen pinned artifact transport
run-name: Pinned artifact 10920674630 at ${{ github.ref_name }} (${{ github.sha }})

# Temporary task-branch replacement of this registered workflow only.
# No default-branch modification, checkout, fetching, or publication.
'on':
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: clingen-pinned-artifact-transport-${{ github.ref }}
  cancel-in-progress: false

jobs:
  transport:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' && github.ref == 'refs/heads/cmungall/clingen-artifact-transport-20260927'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify and print the pinned ZIP as base64
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: '1'
        shell: bash
        run: |
          python3 - <<'PY'
          """Read only the one pinned Actions artifact; emit its exact ZIP as framed base64."""
          import base64
          import hashlib
          import json
          import os
          import sys
          import urllib.error
          import urllib.parse
          import urllib.request

          REPO = "ai4curation/ai-gene-review"
          TASK_REF = "refs/heads/cmungall/clingen-artifact-transport-20260927"
          SOURCE_BRANCH = "cmungall/clingen-reference-fetch-20260927"
          RUN_ID = 36286975328
          HEAD_SHA = "5946477c8ac79ade0709264c775ea1262b108438"
          ARTIFACT_ID = 10920674630
          SIZE = 512580
          SHA256 = "c0ffe4a66b80278af34b44aab6a3ae354ffd5699236b3a486ca95527be5e9713"
          WORKFLOW_PATH = ".github/workflows/warm-reference-cache.yaml"
          API = "https://api.github.com"
          PREFIX = "AIGR_ARTIFACT_ZIP_V1_"
          CHUNK_SIZE = 8192


          class CheckFailed(Exception):
              pass


          def require(ok, message):
              if not ok:
                  raise CheckFailed(message)


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None


          def check_https(url):
              parsed = urllib.parse.urlsplit(url)
              require(parsed.scheme == "https" and parsed.hostname and not parsed.username
                      and not parsed.password and not parsed.fragment and parsed.port in (None, 443),
                      "Invalid HTTPS download location")


          class HTTPSRedirectOnly(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  check_https(newurl)
                  return super().redirect_request(req, fp, code, msg, headers, newurl)


          def api_request(path, token):
              require(path.startswith(f"/repos/{REPO}/actions/"), "Unexpected API path")
              return urllib.request.Request(API + path, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "aigr-pinned-artifact-transport",
              }, method="GET")


          def api_json(path, token):
              with urllib.request.build_opener(NoRedirect()).open(api_request(path, token), timeout=30) as response:
                  data = response.read(1048577)
                  require(response.status == 200 and len(data) <= 1048576, "Invalid metadata response")
              return json.loads(data)


          def verify_metadata(run, artifact):
              require(run.get("id") == RUN_ID and run.get("head_sha") == HEAD_SHA,
                      "Source run id/head mismatch")
              require(run.get("status") == "completed" and run.get("conclusion") == "success",
                      "Source run is not completed successfully")
              require(run.get("event") == "workflow_dispatch" and run.get("head_branch") == SOURCE_BRANCH,
                      "Source run event/branch mismatch")
              require(run.get("path") == WORKFLOW_PATH, "Source workflow path mismatch")
              require(run.get("repository", {}).get("full_name") == REPO
                      and run.get("head_repository", {}).get("full_name") == REPO,
                      "Source run repository mismatch")
              require(artifact.get("id") == ARTIFACT_ID and artifact.get("expired") is False,
                      "Artifact id/expiry mismatch")
              require(artifact.get("size_in_bytes") == SIZE and artifact.get("digest") == "sha256:" + SHA256,
                      "Artifact size/digest metadata mismatch")
              source = artifact.get("workflow_run", {})
              require(source.get("id") == RUN_ID and source.get("head_sha") == HEAD_SHA,
                      "Artifact source run id/head mismatch")
              require(source.get("repository_id") == run["repository"].get("id")
                      and source.get("head_repository_id") == run["repository"].get("id"),
                      "Artifact repository id mismatch")


          def download_exact(token):
              path = f"/repos/{REPO}/actions/artifacts/{ARTIFACT_ID}/zip"
              try:
                  urllib.request.build_opener(NoRedirect()).open(api_request(path, token), timeout=30)
              except urllib.error.HTTPError as exc:
                  require(exc.code == 302, "Artifact API did not provide its expected redirect")
                  location = exc.headers.get("Location", "")
                  exc.close()
              else:
                  raise CheckFailed("Artifact API did not provide its expected redirect")
              check_https(location)
              # A fresh request deliberately omits the GitHub token on the signed URL.
              request = urllib.request.Request(location, headers={"User-Agent": "aigr-pinned-artifact-transport"}, method="GET")
              with urllib.request.build_opener(HTTPSRedirectOnly()).open(request, timeout=60) as response:
                  require(response.status == 200, "Artifact download did not return HTTP 200")
                  data = response.read(SIZE + 1)
              require(len(data) == SIZE, "Downloaded ZIP size mismatch")
              require(hashlib.sha256(data).hexdigest() == SHA256, "Downloaded ZIP digest mismatch")
              return data


          def make_frame(data, transport_head, transport_run):
              require(len(data) == SIZE and hashlib.sha256(data).hexdigest() == SHA256,
                      "Refusing to frame unverified ZIP bytes")
              encoded = base64.b64encode(data).decode("ascii")
              chunks = [encoded[i:i + CHUNK_SIZE] for i in range(0, len(encoded), CHUNK_SIZE)]
              receipt = {"repository": REPO, "artifact_id": ARTIFACT_ID, "source_run_id": RUN_ID,
                         "source_head_sha": HEAD_SHA, "size_bytes": SIZE, "sha256": SHA256,
                         "base64_length": len(encoded), "chunk_size": CHUNK_SIZE, "chunk_count": len(chunks),
                         "transport_head_sha": transport_head, "transport_run_id": transport_run}
              lines = [PREFIX + "BEGIN", PREFIX + "META " + json.dumps(receipt, sort_keys=True, separators=(",", ":"))]
              lines += [f"{PREFIX}DATA {i:04d}/{len(chunks):04d} {chunk}" for i, chunk in enumerate(chunks, 1)]
              lines += [PREFIX + "END"]
              frame = "\n".join(lines) + "\n"
              require(len(frame.encode("ascii")) < 690000, "Framed output exceeded transport bound")
              return frame


          def main():
              require(os.environ.get("GITHUB_REPOSITORY") == REPO
                      and os.environ.get("GITHUB_REF") == TASK_REF
                      and os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch", "Dispatch scope mismatch")
              token = os.environ.get("GH_TOKEN", "")
              require(bool(token), "Missing read-only runtime token")
              run = api_json(f"/repos/{REPO}/actions/runs/{RUN_ID}", token)
              artifact = api_json(f"/repos/{REPO}/actions/artifacts/{ARTIFACT_ID}", token)
              verify_metadata(run, artifact)
              data = download_exact(token)
              frame = make_frame(data, os.environ["GITHUB_SHA"], os.environ["GITHUB_RUN_ID"])
              sys.stdout.write(frame)
              sys.stdout.flush()


          if __name__ == "__main__":
              try:
                  main()
              except CheckFailed as exc:
                  print("TRANSPORT_FAILED: " + str(exc), file=sys.stderr)
                  raise SystemExit(1)
              except Exception as exc:
                  # Do not expose token-bearing headers, signed URLs, or HTTP response bodies.
                  print("TRANSPORT_FAILED: " + type(exc).__name__, file=sys.stderr)
                  raise SystemExit(1)
          PY
