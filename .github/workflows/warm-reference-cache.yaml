ID:23341589. They are reserved for a future recovery batch; frozen source9 is unchanged. No other cited source gap or provider-only source exists in this gene directory."\n      },\n      {\n        "path": "genes/human/AICDA/AICDA-notes.md",\n        "type": "explicit_source_citation",\n        "line": 29,\n        "text": "The [original HBV paper, PMID:23341589](https://pmc.ncbi.nlm.nih.gov/articles/PMC3568302/) reports C-to-U changes in nucleocapsid RNA, with RNase-H-defective polymerase, lamivudine and core immunoprecipitation controls. Human and mouse AID-ER are explicitly compared in separate DNA-hypermutation experiments; endogenous human BL2 AID also reduces viral nucleocapsid DNA. The first Results section explicitly introduces the unfused construct as human AID; subsequent RNA panels continue that AID/GFP comparison without identifying a species change. This resolves the earlier construct-scope concern sufficiently to retain the IBA as non-core with positive human experimental corroboration. The ancestral IBD chain remains uninspected. This is distinct from proving an endogenous immunoglobulin RNA-editing mechanism. Root independently highlighted the first Results sentence, which was then re-read alongside the RNA panels."\n      },\n      {\n        "path": "genes/human/AICDA/AICDA-notes.md",\n        "type": "explicit_source_citation",\n        "line": 31,\n        "text": "Broad antiviral defense is retained as non-core using the endogenous human BL2 result and the AID/UNG-dependent HBV cccDNA study [PMID:23341589; PMID:26867650]. The [GO:0045869 definition](https://amigo.geneontology.org/amigo/term/GO%3A0045869) specifically concerns single-stranded viral RNA replication through DNA. HBV is a DNA virus. The [full PMID:19188259 study](https://pmc.ncbi.nlm.nih.gov/articles/PMC2665220/) explicitly tests human AID among eight vertebrate proteins and supports L1/MusD retrotransposition restriction; this does not automatically establish infectious retroviral restriction. The specific IBA remains UNDECIDED pending its IBD evidence and a properly matched assay."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "25315780",\n    "mode": "fetch_missing",\n    "genes": [\n      "ABHD5"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ABHD5/ABHD5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 34,\n        "text": "counterexperiments, not an inference from an inaccessible abstract. Later PMID:25315780 reports"\n      },\n      {\n        "path": "genes/human/ABHD5/ABHD5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 41,\n        "text": "- PMID:25315780"\n      },\n      {\n        "path": "genes/human/ABHD5/ABHD5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 79,\n        "text": "later homogenate/LPGAT results in PMID:25315780 do not directly resolve intrinsic human LPAAT."\n      },\n      {\n        "path": "genes/human/ABHD5/ABHD5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 83,\n        "text": "- PMID:25315780"\n      },\n      {\n        "path": "genes/human/ABHD5/ABHD5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 967,\n        "text": "substrate supply or regulation of endogenous enzymes. The later 293T homogenate observation in PMID:25315780"\n      },\n      {\n        "path": "genes/human/ABHD5/ABHD5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 973,\n        "text": "- PMID:25315780"\n      },\n      {\n        "path": "genes/human/ABHD5/ABHD5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 1003,\n        "text": "substrate supply or regulation of endogenous enzymes. The later 293T homogenate observation in PMID:25315780"\n      },\n      {\n        "path": "genes/human/ABHD5/ABHD5-ai-review.yaml",\n        "type": "explicit_source_citation",\n        "line": 100