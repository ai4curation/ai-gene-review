name: ClinGen bounded source and seed recovery 5
run-name: Source and seed recovery 5 at ${{ github.ref_name }} (${{ github.sha }})

# TEMPORARY: replace only this path on the dedicated task branch.
# The registered default-branch workflow is not changed or dispatched.
'on':
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: clingen-source-seed-recovery5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-source-seed-fetch5-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Set isolated runtime paths after runner initialization
      run: |
        python - <<'PYENV'
        from pathlib import Path
        import os
        root = Path(os.environ['RUNNER_TEMP']).resolve() / 'clingen-source-seed-recovery5'
        with Path(os.environ['GITHUB_ENV']).open('a') as out:
            out.write('UV_CACHE_DIR=' + str(root / 'uv-cache') + '\n')
            out.write('UV_PROJECT_ENVIRONMENT=' + str(root / 'venv') + '\n')
        PYENV
    - name: Install uv without a shared dependency cache
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Initialize fixed source requests and provenance
      run: |
        python - <<'PY'
        from pathlib import Path
        import json, os
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-source-seed-recovery5'/'artifact'
        root.mkdir(parents=True)
        requests_text = '{\n  "pmids": [],\n  "genes": [\n    {\n      "symbol": "ALK",\n      "hgnc_id": "HGNC:427",\n      "uniprot_id": "Q9UM73",\n      "aliases": [\n        "CD246",\n        "ALK1"\n      ],\n      "identity_primary_urls": [\n        "https://www.uniprot.org/uniprotkb/Q9UM73/history"\n      ],\n      "alias_scope": "Exact HGNC approved-symbol aliases; no previous approved symbol is recorded. ALK1 is ambiguous with ACVRL1; requested HGNC/accession must match ALK.",\n      "prior_local_fetch": "terminal_DNS_failure_no_outputs"\n    },\n    {\n      "symbol": "ALMS1",\n      "hgnc_id": "HGNC:428",\n      "uniprot_id": "Q8TCU4",\n      "aliases": [\n        "KIAA0328"\n      ],\n      "identity_primary_urls": [\n        "https://www.uniprot.org/uniprotkb/Q8TCU4/entry"\n      ],\n      "alias_scope": "Exact HGNC approved-symbol aliases; no previous approved symbol is recorded.",\n      "prior_local_fetch": "terminal_DNS_failure_no_outputs"\n    },\n    {\n      "symbol": "ALPK1",\n      "hgnc_id": "HGNC:20917",\n      "uniprot_id": "Q96QP1",\n      "aliases": [\n        "Lak",\n        "FLJ22670",\n        "KIAA1527"\n      ],\n      "identity_primary_urls": [\n        "https://www.ncbi.nlm.nih.gov/gene/80216/"\n      ],\n      "alias_scope": "Exact HGNC approved-symbol aliases; no previous approved symbol is recorded.",\n      "prior_local_fetch": "terminal_DNS_failure_no_outputs"\n    }\n  ]\n}\n'
        provenance_text = '{\n  "scope": "Three normal human fetch-gene seed requests: ALK, ALMS1, ALPK1; zero explicit PMID/Reactome requests. Raw auxiliary outputs require separate validation before import. No biological review, provider call, canonical import or remote action.",\n  "publication_base": "3c03c1821c6c67910948f96b0569c3cab5a14016",\n  "base_workflow_blob_sha": "3b7b98db5c90e0cad98cf0100894b393bc5ca712",\n  "fresh_remote_main": "3c03c1821c6c67910948f96b0569c3cab5a14016",\n  "fresh_preflight_scope": "Nine canonical/HGNC-alias paths absent, task branch absent, nine independent open-PR title searches zero. Recheck before publication/dispatch and import.",\n  "primary_identity": {\n    "hgnc": {\n      "ALPK1": {\n        "hgnc_id": "HGNC:20917",\n        "symbol": "ALPK1",\n        "status": "Approved",\n        "prev_symbol": "",\n        "alias_symbol": "Lak|FLJ22670|KIAA1527",\n        "locus_group": "protein-coding gene",\n        "locus_type": "gene with protein product"\n      },\n      "ALK": {\n        "hgnc_id": "HGNC:427",\n        "symbol": "ALK",\n        "status": "Approved",\n        "prev_symbol": "",\n        "alias_symbol": "CD246|ALK1",\n        "locus_group": "protein-coding gene",\n        "locus_type": "gene with protein product"\n      },\n      "ALMS1": {\n        "hgnc_id": "HGNC:428",\n        "symbol": "ALMS1",\n        "status": "Approved",\n        "prev_symbol": "",\n        "alias_symbol": "KIAA0328",\n        "locus_group": "protein-coding gene",\n        "locus_type": "gene with protein product"\n      }\n    },\n    "symbols_and_aliases": [\n      "ALK",\n      "CD246",\n      "ALK1",\n      "ALMS1",\n      "KIAA0328",\n      "ALPK1",\n      "Lak",\n      "FLJ22670",\n      "KIAA1527"\n    ],\n    "source_code_paths": [\n      "src/ai_gene_review/cli.py",\n      "src/ai_gene_review/etl/gene.py",\n      "src/ai_gene_review/etl/publication.py",\n      "src/ai_gene_review/validation/goa_validator.py",\n      "uv.lock",\n      ".github/workflows/warm-reference-cache.yaml"\n    ],\n    "local_directories": {\n      "ALK": true,\n      "CD246": false,\n      "ALK1": false,\n      "ALMS1": false,\n      "KIAA0328": false,\n      "ALPK1": false,\n      "Lak": false,\n      "FLJ22670": false,\n      "KIAA1527": false\n    },\n    "accessions": {\n      "ALK": "Q9UM73",\n      "ALMS1": "Q8TCU4",\n      "ALPK1": "Q96QP1"\n    },\n    "identity_routes": {\n      "ALK": "https://www.uniprot.org/uniprotkb/Q9UM73/history",\n      "ALMS1": "https://www.uniprot.org/uniprotkb/Q8TCU4/entry",\n      "ALPK1": "https://www.ncbi.nlm.nih.gov/gene/80216/"\n    },\n    "identity_access": "Primary indexed UniProt pages: ALK reviewed history; ALMS1 reviewed entry; ALPK1 human alternate entry maps canonical Q96QP1/ALPK1_HUMAN. Direct history opens may serve JS fallback, which was not counted as identity evidence. NCBI Gene 80216 independently maps human ALPK1 isoform 1 to UniProtKB/Swiss-Prot Q96QP1."\n  },\n  "normal_attempts": {\n    "ALK": {\n      "command": [\n        "uv",\n        "run",\n        "ai-gene-review",\n        "fetch-gene",\n        "human",\n        "ALK"\n      ],\n      "exit_code": 1,\n      "elapsed_seconds": 2.2410621643066406,\n      "log": "tmp/ALK-full-audit/normal-fetch.log",\n      "log_bytes": 923,\n      "log_sha256": "851ff207f99d6b8b438eeeabed014f62a3baf5877422e1f641e28227e7d6f554",\n      "generated_files": []\n    },\n    "ALMS1": {\n      "command": [\n        "uv",\n        "run",\n        "ai-gene-review",\n        "fetch-gene",\n        "human",\n        "ALMS1"\n      ],\n      "exit_code": 1,\n      "elapsed_seconds": 3.2041828632354736,\n      "log": "tmp/ALMS1-initialization/normal-fetch.log",\n      "log_bytes": 927,\n      "log_sha256": "d489311bc9c622da3faeefa44f5c59c113fd0e676e9eb62396b6b6a160a30bb0",\n      "generated_files": []\n    },\n    "ALPK1": {\n      "command": [\n        "uv",\n        "run",\n        "ai-gene-review",\n        "fetch-gene",\n        "human",\n        "ALPK1"\n      ],\n      "exit_code": 1,\n      "elapsed_seconds": 3.213160991668701,\n      "log": "tmp/ALPK1-initialization/normal-fetch.log",\n      "log_bytes": 927,\n      "log_sha256": "4383ee2831510e44f276515050be2d31371e7d0b576811904d6b19b6d5571eab",\n      "generated_files": []\n    }\n  },\n  "verified_runtime_source_blobs": {\n    "src/ai_gene_review/cli.py": "c02bb5424e11c5a28665222ba0f662cbfa52d84e",\n    "src/ai_gene_review/etl/gene.py": "7434b6e6c3b63ac4c129c13d699fe2f6ab6f7b87",\n    "src/ai_gene_review/etl/publication.py": "816f27fe63f44ea6eb4f0c6e0db7d522c04fb628",\n    "src/ai_gene_review/validation/goa_validator.py": "b0d9787910adecf2e2b23f36548c021dce08a6ae",\n    "uv.lock": "3cd248ac866eb7bd72da1fbc5d3b0caa886294e1",\n    ".github/workflows/warm-reference-cache.yaml": "3b7b98db5c90e0cad98cf0100894b393bc5ca712"\n  },\n  "runtime_source_comparison": "Five current-main CLI/gene/publication/GOA-validator/lock blobs match the actual successful seed4 source-code pin receipt. Local CLI/publication files differ from that deployed code; no local code was overwritten and those local bytes are not represented as the runner code.",\n  "provenance_files": [\n    {\n      "path": "tmp/source-seed-recovery5-design/identity-preflight.json",\n      "bytes": 2064,\n      "sha256": "0226fc31e2b8987003196253b110ff8a997c69d074c0f63a02128b6c116e0663",\n      "git_blob_sha": "37ca507df5adf84c98976e3b8e5afa1f995cb102"\n    },\n    {\n      "path": "tmp/source-seed-recovery5-design/preflight-query.json",\n      "bytes": 2999,\n      "sha256": "6bcc5dbbfbf12b4225dd60d88807f008d188d29478d68dfb7d70947d84705870",\n      "git_blob_sha": "a014664f45d703ed64d7258920b0ac698901e082"\n    },\n    {\n      "path": "tmp/source-seed-recovery5-design/fresh-preflight-response.json",\n      "bytes": 821,\n      "sha256": "1a086795e3ceefe869465b8f4124fad69731ae8c92f67dc9b3eafccd94420cf8",\n      "git_blob_sha": "efac0662326c100f2dd7cf3363bbc561be18cba9"\n    },\n    {\n      "path": "tmp/ALK-full-audit/normal-fetch-receipt.json",\n      "bytes": 343,\n      "sha256": "867f5a2a0dfe721eddceac53577ff23b2907ce39ca0686d7b73de808af856962",\n      "git_blob_sha": "6e3218e29c522946ba742d6f82c9a86d4bb8573e"\n    },\n    {\n      "path": "tmp/ALK-full-audit/normal-fetch.log",\n      "bytes": 923,\n      "sha256": "851ff207f99d6b8b438eeeabed014f62a3baf5877422e1f641e28227e7d6f554",\n      "git_blob_sha": "e7c14f538059611c172a65380c5c35854e687093"\n    },\n    {\n      "path": "tmp/ALMS1-initialization/normal-fetch-receipt.json",\n      "bytes": 351,\n      "sha256": "74a3b7ae6e7dd056484a169d82c765e070617c5a7ea2719e239b381ba82284c4",\n      "git_blob_sha": "66107835809f2ea402a0e117382c900077270d0a"\n    },\n    {\n      "path": "tmp/ALMS1-initialization/normal-fetch.log",\n      "bytes": 927,\n      "sha256": "d489311bc9c622da3faeefa44f5c59c113fd0e676e9eb62396b6b6a160a30bb0",\n      "git_blob_sha": "9e56d439e4ffc8cacca73ecdfcb76ff170981e2f"\n    },\n    {\n      "path": "tmp/ALPK1-initialization/normal-fetch-receipt.json",\n      "bytes": 350,\n      "sha256": "27a9b1fc8cd1335dbe6f6f0a0c480aca9cdb96af3305e0896b8650b6202f774e",\n      "git_blob_sha": "e970eeafa5fd62ce092857194ea2f92d8879007d"\n    },\n    {\n      "path": "tmp/ALPK1-initialization/normal-fetch.log",\n      "bytes": 927,\n      "sha256": "4383ee2831510e44f276515050be2d31371e7d0b576811904d6b19b6d5571eab",\n      "git_blob_sha": "8151c58e893fe64f5a729dc196aa494856d68f02"\n    },\n    {\n      "path": "projects/CLINGEN_MENDELIAN/hgnc-symbols.json",\n      "bytes": 740457,\n      "sha256": "7b8493d6a78e3b0537735e1715c7a12d1bf6f512d62394400d665b5bb1e888d2",\n      "git_blob_sha": "ba021e688ae37bcee12409afd61f7f53812fbcfd"\n    },\n    {\n      "path": "tmp/seed4-import-validator-design/source-code-pin-check.json",\n      "bytes": 1261,\n      "sha256": "7fe3107c2f403f1d2c18b99e131f3fc049b9ef3f315e7152972786beb9bace8b",\n      "git_blob_sha": "da96d4aee1f4897694ca1e45b33bcbeeb306c023"\n    },\n    {\n      "path": "tmp/source-seed-recovery4-design/fetch_requested.py",\n      "bytes": 14437,\n      "sha256": "a1e4b416a60920eafafd4e7c58f0335ed64180b5d51fe7fa986ac75f222a042b",\n      "git_blob_sha": "f702c7de4e461d4263be9da98f87417f141b18b7"\n    },\n    {\n      "path": "tmp/source-seed-recovery4-design/design-manifest.json",\n      "bytes": 9396,\n      "sha256": "f20443fb3935453e9db9dd36d01f453f66696c94d4518b147796e80e8b292cf0",\n      "git_blob_sha": "893ffbf3eaffc57d89e577f13315e088bce4c68c"\n    },\n    {\n      "path": "tmp/source-seed-recovery3-design/requests.json",\n      "bytes": 4543,\n      "sha256": "a380cc2dddfd1b84ddca63d163d00b4f4de8c4d369c81d45c4203f1eb7b2bb15",\n      "git_blob_sha": "eb41009f697e32f4f4b1fea556d043b38d86d0c9"\n    },\n    {\n      "path": "tmp/source-seed-recovery4-design/requests.json",\n      "bytes": 931,\n      "sha256": "6b9ee8bd63964f99498d43da782f5992339e7d250b73f64d66eb7ff68ceaccd3",\n      "git_blob_sha": "549b15d5781d30ebde0cc32dae0db4d09f885f5d"\n    }\n  ],\n  "existing_content_policy": "No canonical writes. Existing checkout/current-main canonical or alias directory skips a request; unresolved API access refuses it. Raw source bytes are copied exclusively and never repaired. Partial/invalid outputs are quarantined.",\n  "limits": {\n    "explicit_pmids": 0,\n    "genes": 3,\n    "per_gene_seconds": 1200,\n    "main_api_calls_max": 12,\n    "per_main_api_seconds": 30,\n    "serial_request_max_seconds": 3960,\n    "helper_seconds": 4500,\n    "step_minutes": 80,\n    "job_minutes": 100,\n    "dependency_install_minutes": 15\n  },\n  "workflow_reuse_decision": "Registered default workflow has no inputs, warms sources and writes a shared branch/PR. Prior operational seed4 has a fixed ALB-only request hash and branch. Neither supports direct dispatch inputs for these three genes. A new branch-only fixed allowlist adaptation is required.",\n  "runtime_basis": "Successful seed4 normal fetch-gene framework: only branch/root/request pins, three explicit gene/HGNC/accession/alias entries, per-gene alias selection and total budget change. Existing normal CLI, identity/GOA checks, byte copies, timeout and quarantine controls retained."\n}\n'
        (root/'requests.json').write_text(requests_text)
        (root/'source-list-provenance.json').write_text(provenance_text)
        (root/'run-receipt.json').write_text(json.dumps({
         'repository':os.environ['GITHUB_REPOSITORY'],'ref':os.environ['GITHUB_REF'],
         'head_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],
         'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'status':'initialized_before_dependency_install',
         'scope':'zero explicit PMID requests and three normal human ALK/ALMS1/ALPK1 seed requests; raw outputs in temporary directory only'
        },indent=2)+'\n')
        PY

    - name: Install the locked normal project runtime
      timeout-minutes: 15
      run: uv sync --frozen --no-dev --no-editable

    - name: Run standard source and gene fetchers in isolated temporary directories
      id: fetch
      continue-on-error: true
      timeout-minutes: 80
      run: |
        uv run --no-sync python - <<'PY'
        """Run normal CLI fetchers into temporary directories; preserve all generated source bytes."""
        from pathlib import Path
        from datetime import datetime, timezone
        from importlib.metadata import version
        import csv
        import hashlib
        import io
        import json
        import os
        import re
        import shutil
        import signal
        import subprocess
        import time
        import urllib.error
        import urllib.parse
        import urllib.request
        import yaml

        BRANCH = 'refs/heads/cmungall/clingen-source-seed-fetch5-20260927'
        REPOSITORY = 'ai4curation/ai-gene-review'
        PMIDS = set()
        GENES = {'ALK': ('HGNC:427', 'Q9UM73'), 'ALMS1': ('HGNC:428', 'Q8TCU4'), 'ALPK1': ('HGNC:20917', 'Q96QP1')}
        ALIASES = {'ALK': ['CD246', 'ALK1'], 'ALMS1': ['KIAA0328'], 'ALPK1': ['Lak', 'FLJ22670', 'KIAA1527']}
        REQUEST_SHA256 = 'e6b3244fcd65a769b864afebba7421f66501ad364b66c5203cbcfbaea53ed014'


        def digest(data):
            return {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(),
                    'git_blob_sha': hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()}


        def validate_requests(data):
            if not isinstance(data, dict) or set(data) != {'pmids', 'genes'}:
                raise ValueError('Unexpected request shape')
            if len(data['pmids']) != 0 or {r['id'] for r in data['pmids']} != PMIDS:
                raise ValueError('Publication request list must equal the empty approved list')
            if len(data['genes']) != 3 or {r['symbol'] for r in data['genes']} != set(GENES):
                raise ValueError('Gene request list must equal the three approved symbols ALK, ALMS1, ALPK1')
            for r in data['genes']:
                if (r['hgnc_id'], r['uniprot_id']) != GENES[r['symbol']]:
                    raise ValueError('Unexpected HGNC/accession mapping')
                if r['aliases'] != ALIASES[r['symbol']]:
                    raise ValueError('Alias preflight inventory changed')
                if not isinstance(r['aliases'], list) or any(not re.fullmatch(r'[A-Za-z0-9_.-]+',a) for a in r['aliases']):
                    raise ValueError('Unsafe alias path')
            return data


        def load_requests(raw):
            if hashlib.sha256(raw).hexdigest() != REQUEST_SHA256:
                raise ValueError('Exact approved request bytes changed')
            return validate_requests(json.loads(raw))


        def inspect_publication(data, pmid):
            text = data.decode('utf-8')
            parts = re.split(r'^---\s*$', text, maxsplit=2, flags=re.M)
            if not text.startswith('---\n') or len(parts) != 3:
                raise ValueError('Missing standard source frontmatter')
            meta = yaml.safe_load(parts[1])
            if not isinstance(meta, dict) or str(meta.get('pmid')) != pmid:
                raise ValueError('Returned PMID label mismatch')
            if not isinstance(meta.get('title'), str) or not meta['title'].strip():
                raise ValueError('Missing title')
            if not isinstance(meta.get('full_text_available'), bool):
                raise ValueError('Missing normal availability metadata')
            return {**digest(data), 'frontmatter': meta,
                    'has_abstract_section': '## Abstract' in parts[2],
                    'has_full_text_section': '## Full Text' in parts[2]}


        def inspect_gene(directory, request):
            """Check primary identity and unreviewed seed integrity; never modify source outputs."""
            from ai_gene_review.validation.goa_validator import GOAValidator
            symbol, accession, hgnc = request['symbol'], request['uniprot_id'], request['hgnc_id']
            up = directory / (symbol + '-uniprot.txt')
            goa = directory / (symbol + '-goa.tsv')
            review = directory / (symbol + '-ai-review.yaml')
            text = up.read_text()
            ac = re.search(r'^AC\s+([^;]+);', text, re.M)
            if not ac or ac[1].strip() != accession:
                raise ValueError('Primary UniProt accession mismatch')
            if not re.search(r'^OX\s+NCBI_TaxID=9606;', text, re.M):
                raise ValueError('Not a human UniProt record')
            if not re.search(r'^DR\s+HGNC;\s*' + re.escape(hgnc) + r';', text, re.M):
                raise ValueError('UniProt HGNC cross-reference mismatch')
            gn = ' '.join(line[5:] for line in text.splitlines() if line.startswith('GN   '))
            name = re.search(r'\bName=([^;{]+)', gn)
            if not name or name[1].strip() != symbol:
                raise ValueError('UniProt primary gene symbol mismatch; inspect rather than rewrite')
            d = yaml.safe_load(review.read_text())
            if d.get('id') != accession or d.get('gene_symbol') != symbol or d.get('taxon',{}).get('id') != 'NCBITaxon:9606':
                raise ValueError('Seed identity mismatch')
            if d.get('status') != 'INITIALIZED':
                raise ValueError('Unexpected authored status')
            annotations = d.get('existing_annotations', [])
            if not annotations or any(a.get('review', {}).get('action') != 'PENDING' for a in annotations):
                raise ValueError('Empty or already-reviewed seed; inspect manually')
            rows = list(csv.DictReader(io.StringIO(goa.read_text()), delimiter='\t'))
            if not rows:
                raise ValueError('Header-only GOA must not be promoted as initialized evidence')
            allowed_symbols = {symbol, *request['aliases']}
            for row in rows:
                if row.get('GENE PRODUCT ID', '').split('-')[0] != accession or row.get('TAXON ID') != '9606':
                    raise ValueError('GOA accession or organism mismatch')
                if row.get('SYMBOL') not in allowed_symbols:
                    raise ValueError('GOA symbol not current HGNC or approved alias')
            validator = GOAValidator(strict_mode=True, strict_tuple_matching=True)
            result = validator.validate_against_goa(review, goa)
            if not result.is_valid:
                raise ValueError('Seed/GOA source mismatch: ' + validator.get_summary(result))
            immutable = {p.name: digest(p.read_bytes()) for p in [up, goa, review]}
            return {'symbol': symbol, 'hgnc_id': hgnc, 'uniprot_id': accession,
                    'seed_status': d['status'], 'seed_rows': len(annotations), 'goa_rows': len(rows),
                    'goa_source_validation': 'PASS', 'primary_files': immutable,
                    'alternative_products': d.get('alternative_products'),
                    'scope': 'Identity/source consistency only; PENDING seed requires a full biological review.'}


        def api_get(path):
            """Public read API only; no credentials, redirects to arbitrary hosts, or mutations."""
            url = 'https://api.github.com/repos/' + REPOSITORY + '/' + path
            request = urllib.request.Request(url, headers={'Accept': 'application/vnd.github+json',
                                              'User-Agent': 'ai-gene-review-bounded-source-recovery',
                                              'X-GitHub-Api-Version': '2026-03-10'})
            with urllib.request.urlopen(request, timeout=30) as response:
                if urllib.parse.urlparse(response.url).netloc != 'api.github.com':
                    raise ValueError('Unexpected API redirect host')
                return json.loads(response.read())


        def current_main_presence(request):
            head = api_get('commits/main')['sha']
            if not re.fullmatch(r'[0-9a-f]{40}', head):
                raise ValueError('Invalid current-main commit')
            # Check canonical plus historical aliases. Conservatively skip any existing directory.
            checked = []
            for symbol in [request['symbol']] + request['aliases']:
                path = 'genes/human/' + symbol
                try:
                    data = api_get('contents/' + urllib.parse.quote(path, safe='/') + '?ref=' + head)
                except urllib.error.HTTPError as exc:
                    if exc.code != 404:
                        raise
                    checked.append({'path': path, 'status': 'absent_404'})
                    continue
                checked.append({'path': path, 'status': 'present', 'response_type': type(data).__name__})
                return {'head_sha': head, 'exists': True, 'checked': checked}
            return {'head_sha': head, 'exists': False, 'checked': checked}


        def copy_raw_tree(source, destination):
            records = []
            for p in sorted(source.rglob('*')):
                if p.is_symlink():
                    raise ValueError('Symlink in generated outputs; refuse artifact acceptance')
                if not p.is_file():
                    continue
                rel = p.relative_to(source)
                out = destination / rel
                out.parent.mkdir(parents=True, exist_ok=True)
                raw = p.read_bytes()
                with out.open('xb') as handle:
                    handle.write(raw)
                assert out.read_bytes() == raw
                records.append({'path': str(rel), **digest(raw)})
            return records


        def run_command(command, work, logpath, timeout):
            with logpath.open('w') as log:
                proc = subprocess.Popen(command, cwd=work, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                try:
                    rc = proc.wait(timeout=timeout)
                    return {'returncode': rc, 'timed_out': False}
                except subprocess.TimeoutExpired:
                    os.killpg(proc.pid, signal.SIGKILL)
                    proc.wait()
                    return {'returncode': proc.returncode, 'timed_out': True}


        def main():
            if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch' or os.environ.get('GITHUB_REF') != BRANCH:
                raise ValueError('Wrong event or task branch')
            if os.environ.get('GITHUB_REPOSITORY') != REPOSITORY:
                raise ValueError('Wrong repository')
            repo = Path(os.environ['GITHUB_WORKSPACE']).resolve()
            root = Path(os.environ['RUNNER_TEMP']).resolve() / 'clingen-source-seed-recovery5'
            runtime = Path(os.environ['UV_PROJECT_ENVIRONMENT']).resolve()
            if not runtime.is_relative_to(root):
                raise ValueError('Runtime outside task temp directory')
            artifact = root / 'artifact'
            work_root = root / 'fetch-work'
            work_root.mkdir(parents=True)
            logs = artifact / 'logs'
            logs.mkdir()
            request_bytes = (artifact / 'requests.json').read_bytes()
            inputs = load_requests(request_bytes)
            report = {k: os.environ[k] for k in ['GITHUB_REPOSITORY','GITHUB_REF','GITHUB_SHA','GITHUB_RUN_ID','GITHUB_RUN_ATTEMPT']}
            report.update(started_utc=datetime.now(timezone.utc).isoformat(), entries=[],
                          request_digest=digest((artifact/'requests.json').read_bytes()),
                          provenance_digest=digest((artifact/'source-list-provenance.json').read_bytes()),
                          versions={n:version(n) for n in ['ai-gene-review','linkml-reference-validator','PyYAML']},
                          source_code={p:digest((repo/p).read_bytes()) for p in ['src/ai_gene_review/cli.py','src/ai_gene_review/etl/gene.py','src/ai_gene_review/etl/publication.py','src/ai_gene_review/validation/goa_validator.py','uv.lock','.github/workflows/warm-reference-cache.yaml']},
                          scope='Raw standard fetcher results only; source labels/identity checks are not evidence completeness or scientific adjudication. No import, review, provider call, commit, PR or push.')
            def save():
                (artifact/'fetch-report.json').write_text(json.dumps(report,indent=2)+'\n')
            deadline = time.monotonic() + 75 * 60
            save()
            for request in inputs['pmids']:
                identifier=request['id'];result={'kind':'pmid','id':identifier};report['entries'].append(result)
                existing=repo/'publications'/('PMID_'+identifier+'.md')
                if existing.exists():
                    result.update(status='already_present',existing_digest=digest(existing.read_bytes()))
                    save();continue
                remaining=deadline-time.monotonic()
                if remaining<=0:
                    result['status']='not_attempted_budget';save();continue
                work=work_root/('pmid_'+identifier);work.mkdir()
                command=[str(runtime/'bin/ai-gene-review'),'fetch-pmid',identifier,'--output-dir',str(work/'publications'),'--delay','1.0']
                result['command']=command;save()
                result.update(run_command(command,work,logs/('pmid_'+identifier+'.log'),min(180,remaining)))
                output=work/'publications'/('PMID_'+identifier+'.md')
                try:
                    if result['returncode']!=0:raise ValueError('Normal fetcher failed or timed out')
                    result.update(inspect_publication(output.read_bytes(),identifier),status='recovered')
                    result['artifact_files']=copy_raw_tree(work,artifact/'recovered'/'pmid'/identifier)
                except Exception as exc:
                    result.update(status='needs_inspection',error=str(exc))
                    result['artifact_files']=copy_raw_tree(work,artifact/'quarantine'/'pmid'/identifier)
                save()
            for request in inputs['genes']:
                symbol=request['symbol'];result={'kind':'gene','symbol':symbol};report['entries'].append(result)
                try:
                    checkout_paths=[str(Path('genes/human')/s) for s in [symbol]+request['aliases'] if (repo/'genes/human'/s).exists()]
                    if checkout_paths:
                        result.update(status='already_present_checkout',paths=checkout_paths);save();continue
                    result['current_main_check']=current_main_presence(request)
                    if result['current_main_check']['exists']:
                        result['status']='already_present_main';save();continue
                except Exception as exc:
                    result.update(status='main_preflight_unresolved',error=str(exc));save();continue
                remaining=deadline-time.monotonic()
                if remaining<=0:
                    result['status']='not_attempted_budget';save();continue
                work=work_root/('gene_'+symbol);work.mkdir()
                command=[str(runtime/'bin/ai-gene-review'),'fetch-gene','human',symbol,'--uniprot-id',request['uniprot_id'],'--output-dir',str(work)]
                result['command']=command;save()
                result.update(run_command(command,work,logs/('gene_'+symbol+'.log'),min(1200,remaining)))
                try:
                    if result['returncode']!=0:raise ValueError('Normal fetcher failed or timed out')
                    result['identity_and_seed_check']=inspect_gene(work/'genes/human'/symbol,request)
                    result.update(status='initialized_candidate',artifact_files=copy_raw_tree(work,artifact/'gene_candidates'/symbol))
                except Exception as exc:
                    result.update(status='needs_inspection',error=str(exc))
                    result['artifact_files']=copy_raw_tree(work,artifact/'quarantine'/'gene'/symbol)
                save()
            good={'recovered','already_present','initialized_candidate','already_present_checkout','already_present_main'}
            report['unresolved']=[r for r in report['entries'] if r['status'] not in good]
            report['finished_utc']=datetime.now(timezone.utc).isoformat();save()
            with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as f:
                f.write('Source/seed artifact generated with '+str(len(report['unresolved']))+' unresolved requests. All gene outputs require parent identity/source inspection and current-main conflict recheck before import.\n')
            return int(bool(report['unresolved']))


        if __name__=='__main__':
            raise SystemExit(main())
        PY

    - name: Verify the checked-out repository is unchanged
      id: unchanged
      if: ${{ always() }}
      run: |
        git diff --exit-code
        git diff --cached --exit-code
        test -z "$(git ls-files --others --exclude-standard)"

    - name: Upload raw standard sources, seed candidates and provenance
      id: artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: clingen-source-seed-recovery5-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/clingen-source-seed-recovery5/artifact/
        if-no-files-found: error
        retention-days: 7
        include-hidden-files: false
        overwrite: false

    - name: Report incomplete runs after preserving their artifact
      if: ${{ always() }}
      env:
        FETCH_OUTCOME: ${{ steps.fetch.outcome }}
        UNCHANGED_OUTCOME: ${{ steps.unchanged.outcome }}
        ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
        ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
      run: |
        python - <<'PY'
        from pathlib import Path
        import json, os
        receipt = {key: os.environ.get(key) for key in ['ARTIFACT_ID', 'ARTIFACT_DIGEST', 'ARTIFACT_URL']}
        print(json.dumps(receipt, sort_keys=True))
        with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
            out.write('Uploaded artifact receipt: ' + json.dumps(receipt, sort_keys=True) + '\n')
        failed = {key: os.environ.get(key) for key in ['FETCH_OUTCOME', 'UNCHANGED_OUTCOME', 'ARTIFACT_OUTCOME'] if os.environ.get(key) != 'success'}
        if failed:
            raise SystemExit(f'Incomplete reference recovery; inspect artifact/logs: {failed}')
        PY
