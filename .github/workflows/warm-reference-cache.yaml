91%**), frequently inherited from unaffected parents, indicating incomplete penetrance and making causality less secure than for USH2C. A 2024 preprint further proposed impaired astrocytic glutamate uptake as a mechanism using mouse tissue, patient-derived cells, proteomics, transcriptomics, and live-cell imaging; because this remains preprint evidence, it should not yet redefine ADGRV1’s primary annotation. [Güler et al., preprint posted April 2024](https://doi.org/10.1101/2024.04.25.591120). (guler2024theadhesiongpcr pages 1-5)"\n        },\n        {\n          "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n          "line": 287,\n          "text": "17. (guler2024theadhesiongpcr pages 1-5): Baran E. Güler, Mark Zorin, Joshua Linnert, Kerstin Nagel-Wolfrum, and Uwe Wolfrum. The adhesion gpcr adgrv1 controls glutamate homeostasis in hippocampal astrocytes supporting neuron development: first insights into to pathophysiology of adgrv1-associated epilepsy. bioRxiv, Apr 2024. URL: https://doi.org/10.1101/2024.04.25.591120, doi:10.1101/2024.04.25.591120. This article has 4 citations."\n        },\n        {\n          "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n          "line": 336,\n          "text": "36. https://doi.org/10.1101/2024.04.25.591120"\n        },\n        {\n          "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n          "line": 348,\n          "text": "48. https://doi.org/10.1101/2024.04.25.591120,"\n        }\n      ],\n      "local_metadata_matches": [],\n      "provider_context": "Cited in retained gene narrative and/or its substantive bibliography, not an unused unrelated URL. Scientific claims themselves are not re-reviewed in this identity census.",\n      "pmid": null,\n      "classification": "DOI_ONLY_NO_EXACT_PMID_IDENTIFIED",\n      "title": "The adhesion GPCR ADGRV1 controls glutamate homeostasis in hippocampal astrocytes supporting neuron development: first insights into to pathophysiology of ADGRV1-associated epilepsy",\n      "primary_url": "https://www.ag-wolfrum.bio.uni-mainz.de/publications-of-the-wolfrum-lab/",\n      "note": "Author laboratory primary publication list directly retains the exact 2024 bioRxiv title/DOI at line 75 and lists related 2026 journal work PMID:42002803 at line 82. No exact preprint PMID or explicit replacement linkage was identified. The related journal DOI is 10.1186/s40478-026-02282-2, not the cited preprint DOI; no automatic substitution/fetch request."\n    },\n    {\n      "gene": "ADGRV1",\n      "original_scan_doi": "10.1101/2024.09.10.612265",\n      "normalized_doi": "10.1101/2024.09.10.612265",\n      "occurrences": [\n        {\n          "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n          "line": 235,\n          "text": "4. **Human-retina isoforms (preprint, September 2024):** standard PacBio and optimized long-transcript sequencing reached about 15 kb but could not capture the full approximately **19.6-kb** ADGRV1 transcript. Samplix Xdrop enrichment plus PacBio sequencing supported VLGR1b expression and shorter isoforms and identified a novel in-frame **33-bp exon 39A**. Reads spanning exons 3–73 and 79–90 supported, but did not completely reconstruct, full-length VLGR1b. Amplification artifacts and unresolved isoform assignments remain important limitations. [Stemerdink et al., bioRxiv preprint, posted September 2024](https://doi.org/10.1101/2024.09.10.612265). (stemerdink2024pushingthelimits pages 20-23, stemerdink2024pushingthelimits pages 23-27, stemerdink2024pushingthelimits pages 1-4)"\n        },\n        {\n          "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n          "line": 289,\n          "text": "18. (stemerdink2024pushingthelimits pages 20-23): Merel Stemerdink, Tabea Riepe, Nick Zomer, Renee Salz, Michael Kwint, Raoul Timmermans, Barbara Ferrari, Stefano Ferrari, Alfredo Dueñas Rey, Emma Delanote, Suzanne E. de Bruijn, Hannie Kremer, Susanne Roosing, Frauke Coppieters, Alexander Hoischen, Frans P. M. Cremers, Peter A.C. ’t Hoen, Erwin van Wijk, and Erik de Vrieze. Pushing the limits of single molecule transcript sequencing to uncover the largest disease-associated transcript isoforms in the human neural retina. bioRxiv, Sep 2024. URL: https://doi.org/10.1101/2024.09.10.612265, doi:10.1101/2024.09.10.612265. This article has 0 citations."\n        },\n        {\n          "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n          "line": 291,\n          "text": "19. (stemerdink2024pushingthelimits pages 23-27): Merel Stemerdink, Tabea Riepe, Nick Zomer, Renee Salz, Michael Kwint, Raoul Timmermans, Barbara Ferrari, Stefano Ferrari, Alfredo Dueñas Rey, Emma Delanote, Suzanne E. de Bruijn, Hannie Kremer, Susanne Roosing, Frauke Coppieters, Alexander Hoischen, Frans P. M. Cremers, Peter A.C. ’t Hoen, Erwin van Wijk, and Erik de Vrieze. Pushing the limits of single molecule transcript sequencing to uncover the largest disease-associated transcript isoforms in the human neural retina. bioRxiv, Sep 2024. URL: https://doi.org/10.1101/2024.09.10.612265, doi:10.1101/2024.09.10.612265. This article has 0 citations."\n        },\n        {\n          "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n          "line": 293,\n          "text": "20. (stemerdink2024pushingthelimits pages 1-4): Merel Stemerdink, Tabea Riepe, Nick Zomer, Renee Salz, Michael Kwint, Raoul Timmermans, Barbara Ferrari, Stefano Ferrari, Alfredo Dueñas Rey, Emma Delanote, Suzanne E. de Bruijn, Hannie Kremer, Susanne Roosing, Frauke Coppieters, Alexander Hoischen, Frans P. M. Cremers, Peter A.C. ’t Hoen, Erwin van Wijk, and Erik de Vrieze. Pushing the limits of single molecule transcript sequencing to uncover the largest disease-associated transcript isoforms in the human neural retina. bioRxiv, Sep 2024. URL: https://doi.org/10.1101/2024.09.10.612265, doi:10.1101/2024.09.10.612265. This article has 0 citations."\n        },\n      