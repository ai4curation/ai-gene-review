: "A 2023 mouse study localized adenylyl cyclase 6 (**AC6**), Gαs, Gαi, and PKA-Cα1 near basal stereocilia, partly overlapping ADGRV1. In *Adgrv1*−/− and *Ush2a*−/− cochleas, AC6 became distributed throughout stereocilia rather than remaining concentrated near ankle links, indicating that USH2-complex integrity organizes AC6. AC6 was estimated to account for about **50% of cochlear PKA activation**. Nevertheless, *Adcy6*−/− mice retained normal adult hearing, implying redundant cyclases or compensatory Gq/PKC signaling. The pathway is therefore plausible and experimentally supported but not essential by itself. [Mathur et al., published May 2023](https://doi.org/10.1038/s41598-023-34361-y). (mathur2023adenylylcyclase6 pages 7-9, mathur2023adenylylcyclase6 pages 2-3, mathur2023adenylylcyclase6 pages 9-10)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1038/s41598-023-34361-y",\n        "normalized_doi": "10.1038/s41598-023-34361-y",\n        "primary_pmid": "37127773",\n        "primary_title": "Adenylyl cyclase 6 plays a minor role in the mouse inner ear and retina.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37127773/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 277,\n        "text": "12. (mathur2023adenylylcyclase6 pages 7-9): Pranav Dinesh Mathur, Junhuang Zou, Grace Neiswanger, Daniel Zhu, Yong Wang, Ali A. Almishaal, Deepti Vashist, H. Kirk Hammond, Albert H. Park, and Jun Yang. Adenylyl cyclase 6 plays a minor role in the mouse inner ear and retina. Scientific Reports, May 2023. URL: https://doi.org/10.1038/s41598-023-34361-y, doi:10.1038/s41598-023-34361-y. This article has 4 citations and is from a peer-reviewed journal.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1038/s41598-023-34361-y",\n        "normalized_doi": "10.1038/s41598-023-34361-y",\n        "primary_pmid": "37127773",\n        "primary_title": "Adenylyl cyclase 6 plays a minor role in the mouse inner ear and retina.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37127773/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 279,\n        "text": "13. (mathur2023adenylylcyclase6 pages 2-3): Pranav Dinesh Mathur, Junhuang Zou, Grace Neiswanger, Daniel Zhu, Yong Wang, Ali A. Almishaal, Deepti Vashist, H. Kirk Hammond, Albert H. Park, and Jun Yang. Adenylyl cyclase 6 plays a minor role in the mouse inner ear and retina. Scientific Reports, May 2023. URL: https://doi.org/10.1038/s41598-023-34361-y, doi:10.1038/s41598-023-34361-y. This article has 4 citations and is from a peer-reviewed journal.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1038/s41598-023-34361-y",\n        "normalized_doi": "10.1038/s41598-023-34361-y",\n        "primary_pmid": "37127773",\n        "primary_title": "Adenylyl cyclase 6 plays a minor role in the mouse inner ear and retina.",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37127773/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 281,\n        "text": "14. (mathur2023adenylylcyclase6 pages 9-10): Pranav Dinesh Mathur, Junhuang Zou, Grace Neiswanger, Daniel Zhu, Yong Wang, Ali A. Almishaal, Deepti Vashist, H. Kirk Hammond, Albert H. Park, and Jun Yang. Adenylyl cyclase 6 plays a minor role in the mouse inner ear and retina. Scientific Reports, May 2023. URL: https://doi.org/10.1038/s41598-023-34361-y, doi:10.1038/s41598-023-34361-y. This article has 4 citations and is from a peer-reviewed journal.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1038/s41598-023-34361-y",\n        "normalized_doi": "10.1038/s41598-023-34361-y",\n        "primary_pmid": "37127773",\n        "primary_title": "Adenylyl cyclase 6 plays a 