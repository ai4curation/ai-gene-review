to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 269,\n        "text": "| Catalytic activities | Dual function: **AAA+ ATPase/unfoldase-translocase** plus **zinc metalloprotease**; ATP-driven substrate engagement/translocation feeds substrates to a C-terminal Zn-dependent protease site (dastidar2024multifacetedrolesof pages 1-2, dastidar2024multifacetedrolesof pages 2-5, khalimonchuk2023moleculardeterminantsof pages 6-8) | Review | Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z; Khalimonchuk & Becker, 2023, *Antioxid Redox Signal*, https://doi.org/10.1089/ars.2022.0124 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1007/s12035-023-03768-z",\n        "normalized_doi": "10.1007/s12035-023-03768-z",\n        "primary_pmid": "38012514",\n        "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 280,\n        "text": "| Human disease: SCA28 | **Spinocerebellar ataxia type 28 (SCA28)**: typically **autosomal dominant**, usually from **heterozygous AFG3L2 variants**, characterized by slowly progressive gait/limb ataxia with frequent oculomotor abnormalities (dastidar2024multifacetedrolesof pages 15-16, dastidar2024multifacetedrolesof pages 10-11, lopergolo2024autosomalrecessivecerebellar pages 4-5, franchino2024sustainedoma1mediatedintegrated pages 1-2) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1007/s12035-023-03768-z",\n        "normalized_doi": "10.1007/s12035-023-03768-z",\n        "primary_pmid": "38012514",\n        "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 281,\n        "text": "| Human disease: DOA12 / OPA12 | **Dominant optic atrophy 12 (DOA12/OPA12)**: generally **autosomal dominant**, associated especially with **heterozygous ATPase- or catalytic-domain variants**; may overlap with ophthalmoplegia and broader mitochondrial optic neuropathy phenotypes (dastidar2024multifacetedrolesof pages 15-16, dastidar2024multifacetedrolesof pages 13-15, franchino2024sustainedoma1mediatedintegrated pages 1-2) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1007/s12035-023-03768-z",\n        "normalized_doi": "10.1007/s12035-023-03768-z",\n        "primary_pmid": "38012514",\n        "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 282,\n        "text": "| Human disease: SPAX5 | **Spastic ataxia type 5 / early-onset spastic ataxia-neuropathy syndrome (SPAX5)**: **autosomal recessive**, caused by **biallelic AFG3L2 variants**; severe childhood-onset phenotype with cerebellar ataxia, spasticity, dystonia, neuropathy, and in some cases myoclonic epilepsy (dastidar2024multifacetedrolesof pages 15-16, lopergolo2024autosomalrecessivecerebellar pages 4-5, dastidar2024multifacetedrolesof pages 13-15, franchino2024sustainedoma1mediatedintegrated pages 1-2) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1007/s12035-023-03768-z",\n        "normalized_doi": "10.1007/s12035-023-03768-z",\n        "primary_pmid": "38012514",\n        "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon.md",\n        "line": 283,\n        "text": "| Therapeutic/diagnostic implications | Current clinical use is mainly **genetic diagnosis/variant interpretation** (NGS panels, exome-based workup for ataxia/optic neuropathy). Preclinical 2024 evidence suggests **ISR potentiation with Sephin-1** can improve SPAX5 cellular and mouse phenotypes; molecular readouts include **eIF2α phosphorylation, ATF4 targets, CHOP/CHAC1/FGF21** (dastidar2024multifacetedrolesof pages 15-16, dastidar2024multifacetedrolesof pages 10-11, franchino2024sustainedoma1mediatedintegrated pages 1-2) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1007/s12035-023-03768-z",\n        "normalized_doi": "10.1007/s12035-023-03768-z",\n        "primary_pmid": "38012514",\n        "primary_title": "Multifaceted Roles of AFG3L2, a Mitochondrial ATPase in Relation to Neurological Disorders",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38012514/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-