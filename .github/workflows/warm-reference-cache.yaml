ne (PE) by LPCAT3; 15‑LOX then oxidizes PE‑AA/PE‑AdA to hydroperoxy‑PE species that execute ferroptosis. ACSL4 abundance/activity thus dictates accumulation of these pro‑ferroptotic PE‑PUFAs (Jun 2023; https://doi.org/10.3390/ijms241210021) (jia2023acsl4mediatedferroptosisand pages 3-5, chen2023theacsl4network pages 2-4).",\n        "mapped_pmid": "37373168",\n        "title": "ACSL4-Mediated Ferroptosis and Its Potential Role in Central Nervous System Diseases and Injuries",\n        "doi_aliases": [\n          "10.3390/ijms241210021"\n        ],\n        "pmc_aliases": [],\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37373168/",\n        "identity_proofs": [\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/37373168/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-follow2.txt"\n          },\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/37373168/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-doi-first.txt"\n          },\n          {\n            "url": "https://pubmed.ncbi.nlm.nih.gov/37373168/",\n            "saved_web_result": "tmp/acsl4-acat1-doi-audit/primary-explicit-web.txt"\n          }\n        ],\n        "scope": "Identity mapped in the frozen primary-source audit; provider citation text may contain errors and is retained verbatim for provenance, not endorsed as scientific evidence."\n      },\n      {\n        "type": "audited_authored_or_provider_citation",\n        "path": "genes/human/ACSL4/ACSL4-deep-research-falcon.md",\n        "line": 154,\n        "text": "- CNS disease relevance updated: A 2023 review details ACSL4’s mechanistic positioning at ER‑associated oxidation centers and its indispensability for AA‑PE/AdA‑PE oxidation in neuronal ferroptosis; knockdown protects against ischemic brain injury models (Jun 2023; https://doi.org/10.3390/ijms241210021) (jia2023acsl4mediatedferroptosisand pages 3-5).",\n        "mapped_pmid": "37373168",\n        "titl