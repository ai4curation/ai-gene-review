        PROVENANCE_PREFIX_SHA256 = '7a797a7a54fe7a698ec57f7c601e2bfa9f7ecfdcb10c01b5db3b70a82d37376f'
        PROVENANCE_MIDDLE_SHA256 = '41f2b114a66c55dfde49dc248085938cd42fc7a4ebcf8338c3d55a992825e989'
        PROVENANCE_SHA256 = '97d4df3a4db094859865f62b702fc45473e8287339a4b2b011dc0046938e7bca'
        prefix=(root.parent/'source-provenance-prefix.b85').read_bytes()
        assert len(prefix)==16000 and hashlib.sha256(prefix).hexdigest()==PROVENANCE_PREFIX_SHA256
        middle=(root.parent/'source-provenance-middle.b85').read_bytes()
        assert len(middle)==16000 and hashlib.sha256(middle).hexdigest()==PROVENANCE_MIDDLE_SHA256
        PROVENANCE_B85=prefix.decode('ascii')+middle.decode('ascii')+PROVENANCE_SUFFIX_B85
        raw=zlib.decompress(base64.b85decode(PROVENANCE_B85))
        assert hashlib.sha256(raw).hexdigest()==PROVENANCE_SHA256
        with (root/'source-list-provenance.json').open('xb') as handle:handle.write(raw)
