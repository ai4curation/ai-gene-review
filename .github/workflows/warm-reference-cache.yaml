name: Read-only UniProt Dbfetch availability diagnostic
run-name: O43497 Dbfetch comparison probe at ${{ github.sha }}
'on':
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uniprot-dbfetch-availability-O43497
  cancel-in-progress: false
jobs:
  probe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' && github.ref == 'refs/heads/cmungall/clingen-source-seed-fetch65-20261003'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Probe two fixed anonymous raw-record routes once
        timeout-minutes: 2
        run: |
          python3 - <<'PY'
          """One hosted diagnostic, two fixed anonymous GETs; no source import."""
          from pathlib import Path
          import datetime, hashlib, json, os, re, subprocess, sys, time
          
          ROUTES = (
              ('entry', 'https://rest.uniprot.org/uniprotkb/O43497.txt'),
              ('dbfetch', 'https://www.ebi.ac.uk/Tools/dbfetch/dbfetch?db=uniprotkb&id=O43497&format=uniprot&style=raw'),
          )
          BODY_LIMIT = 512 * 1024
          WALL_SECONDS = 30
          
          WORKER = r'''
          from pathlib import Path
          import json, sys, time, urllib.request, urllib.error
          LIMIT = 512 * 1024
          EXPECTED = {
           'entry': 'https://rest.uniprot.org/uniprotkb/O43497.txt',
           'dbfetch': 'https://www.ebi.ac.uk/Tools/dbfetch/dbfetch?db=uniprotkb&id=O43497&format=uniprot&style=raw',
          }
          root, name, url = Path(sys.argv[1]), sys.argv[2], sys.argv[3]
          assert name in EXPECTED and url == EXPECTED[name]
          target = root / name
          target.mkdir(exist_ok=False)
          body_path = target / 'body.bin'
          with body_path.open('xb'):
           pass
          report = {'route': name, 'url': url, 'method': 'GET', 'http_status': None,
                    'content_type': None, 'response_complete': False, 'truncated': False,
                    'error_type': None, 'error_text': None, 'body_limit': LIMIT,
                    'redirect_followed': False, 'import_authorized': False}
          def save_report():
           p = target / 'response.json'
           tmp = target / 'response.json.tmp'
           tmp.write_text(json.dumps(report, indent=2) + '\n')
           tmp.replace(p)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
           def redirect_request(self, req, fp, code, msg, headers, newurl):
            return None
          save_report()
          response = None
          try:
           opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())
           request = urllib.request.Request(url, method='GET', headers={
            'Accept': 'text/plain', 'Accept-Encoding': 'identity',
            'User-Agent': 'ai-gene-review-read-only-availability-probe/1'})
           try:
            response = opener.open(request, timeout=30)
           except urllib.error.HTTPError as exc:
            response = exc
           report['http_status'] = response.code
           report['content_type'] = response.headers.get('Content-Type')
           report['declared_content_length'] = response.headers.get('Content-Length')
           report['content_encoding'] = response.headers.get('Content-Encoding')
           report['location_header'] = response.headers.get('Location')
           (target / 'headers.json').write_text(json.dumps(list(response.headers.items()), indent=2) + '\n')
           save_report()
           remaining = LIMIT
           with body_path.open('ab') as output:
            while remaining:
             chunk = response.read(min(16384, remaining))
             if not chunk:
              report['response_complete'] = True
              break
             assert len(chunk) <= remaining
             output.write(chunk)
             output.flush()
             remaining -= len(chunk)
            if remaining == 0:
             report['truncated'] = True
             report['truncation_note'] = 'Capture cap reached; no extra byte was requested to inspect the tail.'
          except Exception as exc:
           report['error_type'] = type(exc).__name__
           report['error_text'] = str(exc)[:512]
          finally:
           if response is not None:
            response.close()
           save_report()
          '''
          
          def crc64_iso(sequence):
              # Reflected CRC-64/ISO polynomial used in UniProt SQ lines; init/xorout zero.
              value = 0
              for byte in sequence.encode('ascii'):
                  value ^= byte
                  for _ in range(8):
                      value = (value >> 1) ^ (0xD800000000000000 if value & 1 else 0)
              return f'{value:016X}'
          
          def assess_flatfile(body, accession='O43497', taxon='9606', gene='CACNA1G'):
              result = {'status': 'INVALID_OR_UNRESOLVED', 'import_authorized': False}
              try:
                  text = body.decode('utf-8')
                  lines = text.splitlines()
                  assert lines and lines[0].startswith('ID   '), 'Missing initial UniProt ID line'
                  assert sum(l.startswith('ID   ') for l in lines) == 1, 'Multiple record headers'
                  assert lines.count('//') == 1 and text.rstrip().endswith('//'), 'Missing/extra record terminator or trailing content'
                  identity = re.fullmatch(r'ID   (\S+)\s+Reviewed;\s+(\d+) AA\.', lines[0])
                  assert identity, 'Unrecognized or unreviewed ID line'
                  accessions = [a.strip() for line in lines if line.startswith('AC   ') for a in line[5:].split(';') if a.strip()]
                  assert accessions and accessions[0] == accession, 'Primary accession differs from requested accession'
                  taxa = re.findall(r'^OX   NCBI_TaxID=(\d+)', text, re.M)
                  assert taxa == [taxon], 'Taxon is not the expected single taxon'
                  assert re.search(r'^GN   Name=' + re.escape(gene) + r'(?:[ ;{])', text, re.M), 'Gene symbol does not match'
                  versions = re.findall(r'^DT   .*sequence version (\d+)\.', text, re.M)
                  assert len(versions) == 1 and int(versions[0]) > 0, 'Missing/ambiguous sequence version'
                  sqs = [(i,l) for i,l in enumerate(lines) if l.startswith('SQ   ')]
                  assert len(sqs) == 1, 'Missing/multiple sequence headers'
                  sqi, sql = sqs[0]
                  sq = re.fullmatch(r'SQ   SEQUENCE\s+(\d+) AA;\s+\d+ MW;\s+([0-9A-F]{16}) CRC64;', sql)
                  assert sq, 'Unrecognized sequence header'
                  seq_lines = lines[sqi+1:lines.index('//')]
                  assert seq_lines and all(re.fullmatch(r'     [A-Z ]+', l) for l in seq_lines), 'Unexpected sequence line'
                  sequence = ''.join(''.join(l.split()) for l in seq_lines)
                  assert re.fullmatch(r'[ACDEFGHIKLMNPQRSTVWYBXZJUO]+', sequence), 'Invalid amino-acid symbol'
                  assert len(sequence) == int(identity[2]) == int(sq[1]), 'ID/SQ/actual sequence lengths differ'
                  observed_crc = crc64_iso(sequence)
                  assert observed_crc == sq[2], 'Sequence CRC64 mismatch'
                  result.update(status='VALIDATED_SINGLE_FLATFILE_DIAGNOSTIC_ONLY', entry_name=identity[1], primary_accession=accessions[0], taxon=taxa[0], gene=gene, sequence_version=int(versions[0]), sequence_length=len(sequence), declared_crc64=sq[2], calculated_crc64=observed_crc, sequence_sha256=hashlib.sha256(sequence.encode()).hexdigest())
              except (AssertionError, UnicodeError, ValueError) as exc:
                  result['issue'] = str(exc)[:256]
              return result
          
          def write_json(path, value):
              path.write_text(json.dumps(value, indent=2) + '\n')
          
          def one_route(root, name, url):
              start = time.monotonic()
              timeout = False
              code = None
              try:
                  result = subprocess.run(
                      [sys.executable, '-c', WORKER, str(root), name, url],
                      stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL,
                      stderr=subprocess.PIPE, timeout=WALL_SECONDS, check=False)
                  code = result.returncode
                  worker_error = result.stderr[:512].decode('utf-8', 'replace')
              except subprocess.TimeoutExpired:
                  # subprocess.run kills and waits for this sole child before returning.
                  timeout = True
                  worker_error = 'Parent enforced the 30-second wall-clock deadline.'
              elapsed = time.monotonic() - start
              target = root / name
              target.mkdir(exist_ok=True)
              p = target / 'response.json'
              report = json.loads(p.read_text()) if p.exists() else {
                  'route': name, 'url': url, 'method': 'GET', 'http_status': None,
                  'content_type': None, 'response_complete': False, 'truncated': False,
                  'error_type': 'WorkerDidNotWriteMetadata', 'error_text': None}
              body_path = target / 'body.bin'
              if not body_path.exists():
                  with body_path.open('xb'):
                      pass
              body = body_path.read_bytes()
              assert len(body) <= BODY_LIMIT
              report.update(bytes=len(body), sha256=hashlib.sha256(body).hexdigest(),
                            wall_timeout=timeout, elapsed_seconds=elapsed,
                            worker_returncode=code, import_authorized=False)
              if timeout:
                  report.update(response_complete=False, error_type='WallClockTimeout',
                                error_text=worker_error)
              elif code:
                  report.update(response_complete=False, error_type='WorkerFailure',
                                error_text=worker_error)
              report['flatfile_check'] = (
                  assess_flatfile(body) if report.get('http_status') == 200 and report.get('response_complete') and not report.get('truncated')
                  else {'status': 'NOT_ASSESSED_INCOMPLETE_OR_NON200', 'import_authorized': False})
              error_excerpt = report.get('error_text') or ''
              if report.get('http_status') != 200 and body:
                  error_excerpt = body[:256].decode('utf-8', 'replace')
              # Compact errors only; successful record bytes are never printed to logs.
              error_excerpt = ''.join(c if c.isprintable() else ' ' for c in error_excerpt)[:256]
              report['bounded_error_excerpt'] = error_excerpt
              write_json(p, report)
              keys = ('route', 'url', 'http_status', 'content_type', 'bytes', 'sha256',
                      'response_complete', 'truncated', 'wall_timeout', 'elapsed_seconds',
                      'error_type', 'bounded_error_excerpt', 'flatfile_check')
              print(json.dumps({k: report.get(k) for k in keys}), flush=True)
              return report
          
          def main():
              root = Path(os.environ['RUNNER_TEMP']) / 'uniprot-dbfetch-availability-O43497' / 'artifact'
              root.mkdir(parents=True, exist_ok=False)
              receipt = {k: os.environ[k] for k in (
                  'GITHUB_REPOSITORY', 'GITHUB_REF', 'GITHUB_SHA',
                  'GITHUB_RUN_ID', 'GITHUB_RUN_ATTEMPT')}
              assert receipt['GITHUB_REPOSITORY'] == 'ai4curation/ai-gene-review'
              assert receipt['GITHUB_REF'] == 'refs/heads/cmungall/clingen-source-seed-fetch65-20261003'
              receipt.update(purpose='Read-only UniProt availability diagnostic, not normal source fetching',
                             accession='O43497', maximum_get_requests=2,
                             redirects_followed=0, retries=0, body_cap_bytes=BODY_LIMIT,
                             wall_seconds_per_route=WALL_SECONDS, import_authorized=False,
                             started_utc=datetime.datetime.now(datetime.timezone.utc).isoformat())
              write_json(root / 'run-receipt.json', receipt)
              reports = [one_route(root, name, url) for name, url in ROUTES]
              write_json(root / 'summary.json', {
                  'status': 'DIAGNOSTIC_COMPLETED_RESULTS_REQUIRE_INSPECTION',
                  'routes': reports, 'import_authorized': False,
                  'finished_utc': datetime.datetime.now(datetime.timezone.utc).isoformat()})
          
          if __name__ == '__main__':
              main()
          PY
      - name: Inventory diagnostic bytes and controls
        if: ${{ always() }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'uniprot-dbfetch-availability-O43497' / 'artifact'
          root.mkdir(parents=True, exist_ok=True)
          entries = []
          for p in sorted(root.rglob('*')):
              assert not p.is_symlink()
              if p.is_file():
                  b = p.read_bytes()
                  if p.name == 'body.bin':
                      assert len(b) <= 512 * 1024
                  entries.append({'path': p.relative_to(root).as_posix(), 'bytes': len(b), 'sha256': hashlib.sha256(b).hexdigest()})
          (root / 'manifest.json').write_text(json.dumps({'files': entries, 'purpose': 'availability diagnostic only', 'import_authorized': False}, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: uniprot-dbfetch-availability-O43497-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uniprot-dbfetch-availability-O43497/artifact/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false
