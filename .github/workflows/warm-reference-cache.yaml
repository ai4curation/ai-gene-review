name: ClinGen bounded source and seed recovery 3
run-name: Source and seed recovery 3 at ${{ github.ref_name }} (${{ github.sha }})

# TEMPORARY: replace only this path on the dedicated task branch.
# The registered default-branch workflow is not changed or dispatched.
'on':
  workflow_dispatch: null

permissions:
  contents: read

concurrency:
  group: clingen-source-seed-recovery3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-source-seed-fetch3-20260927'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Set isolated runtime paths after runner initialization
      run: |
        python - <<'PYENV'
        from pathlib import Path
        import os
        root = Path(os.environ['RUNNER_TEMP']).resolve() / 'clingen-source-seed-recovery3'
        with Path(os.environ['GITHUB_ENV']).open('a') as out:
            out.write('UV_CACHE_DIR=' + str(root / 'uv-cache') + '\n')
            out.write('UV_PROJECT_ENVIRONMENT=' + str(root / 'venv') + '\n')
        PYENV
    - name: Install uv without a shared dependency cache
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: false

    - name: Initialize fixed source requests and provenance
      run: |
        python - <<'PY'
