i.org/10.1016/j.ymgme.2012.11.282,",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1016/j.ymgme.2012.11.282",\n        "normalized_doi": "10.1016/j.ymgme.2012.11.282",\n        "primary_pmid": "23266196",\n        "primary_title": "Mitochondrial citrate synthase crystals: novel finding in Sengers syndrome caused by acylglycerol kinase (AGK) mutations",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/23266196/"\n      },\n      {\n        "path": "genes/human/AGK/AGK-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 4,\n        "text": "| Substrates/products | AGK phosphorylates monoacylglycerol (MAG) to lysophosphatidic acid (LPA) and diacylglycerol (DAG) to phosphatidic acid (PA); 2023 review places AGK as an intramitochondrial PA-generating route in the inner mitochondrial membrane (pqac-00000004, pqac-00000007, pqac-00000021) | Jackson et al., 2021; Siriwardena et al., 2013; Joshi et al., 2023 | https://doi.org/10.1091/mbc.e20-06-0390 ; https://doi.org/10.1016/j.ymgme.2012.11.282 ; https://doi.org/10.1242/jcs.260857 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1016/j.ymgme.2012.11.282",\n        "normalized_doi": "10.1016/j.ymgme.2012.11.282",\n        "primary_pmid": "23266196",\n        "primary_title": "Mitochondrial citrate synthase crystals: novel finding in Sengers syndrome caused by acylglycerol kinase (AGK) mutations",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/23266196/"\n      },\n      {\n        "path": "genes/human/AGK/AGK-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 13,\n        "text": "| Quantitative mitochondrial protein loss | In patient muscle, AGK protein can be nearly absent/negligible, with mitochondrial immunogold labeling reduced from 37.9±4.6 particles/μm² in control to 14.5±4.9 and 18.9±6.9 particles/μm² in two AGK-deficient patients (pqac-00000007, pqac-00000013) | Siriwardena et al., 2013 | https://doi.org/10.1016/j.ymgme.2012.11.282 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1016/j.ymgme.2012.11.282",\n        "normalized_doi": "10.1016/j.ymgme.2012.11.282",\n        "primary_pmid": "23266196",\n        "primary_title": "Mitochondrial citrate synthase crystals: novel finding in Sengers syndrome caused by acylglycerol kinase (AGK) mutations",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/23266196/"\n      },\n      {\n        "path": "genes/human/AGK/AGK-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 14,\n        "text": "| Quantitative bioenergetic defects | Patient fibroblasts showed decreased complex I activity to 43% and 54% of control in two cases, with high lactate/pyruvate ratios; another index case had plasma lactate 7.3 mmol/L (normal 0.5–2.2 mmol/L) (pqac-00000013, pqac-00000014) | Siriwardena et al., 2013; Mayr et al., 2012 | https://doi.org/10.1016/j.ymgme.2012.11.282 ; https://doi.org/10.1016/j.ajhg.2011.12.005 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1016/j.ymgme.2012.11.282",\n        "normalized_doi": "10.1016/j.ymgme.2012.11.282",\n        "primary_pmid": "23266196",\n        "primary_title": "Mitochondrial citrate synthase crystals: novel finding in Sengers syndrome caused by acylglycerol kinase (AGK) mutations",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/23266196/"\n      },\n      {\n        "path": "genes/human/AGK/AGK-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 16,\n        "text": "| Clinical heterogeneity | AGK disease ranges from lethal neonatal/infantile disease to milder forms, including reports of isolated congenital cataract without major cardiomyopathy in some families, indicating variable expressivity despite shared mitochondrial mechanism (pqac-00000014, pqac-00000019) | Mayr et al., 2012; Siriwardena et al., 2013 | https://doi.org/10.1016/j.ajhg.2011.12.005 ; https://doi.org/10.1016/j.ymgme.2012.11.282 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1016/j.ymgme.2012.11.282",\n        "normalized_doi": "10.1016/j.ymgme.2012.11.282",\n        "primary_pmid": "23266196",\n        "primary_title": "Mitochondrial citrate synthase crystals: novel finding in Sengers syndrome caused by acylglycerol kinase (AGK) mutations",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/23266196/"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "30663059",\n    "mode": "fetch_missing",\n    "genes": [\n      "ALDH7A1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ALDH7A1/ALDH7A1-deep-research-falcon.md",\n        "line": 269,\n        "text": "**6-Oxo-pipecolate (6-oxo-PIP)** is substantially more stable than P6C. In an early analytical study, affected patients—but not 14 blood/urine controls or three CSF controls—showed 6-oxo-PIP and related abnormal metabolites. Illustrative plasma concentrations were **2.7 ± 0.1** and **4.1 ± 0.1 μM**, while two urine samples contained **156.8** and **122.2 μmol/mg creatinine**. Sensitivity and specificity nevertheless required further validation. DOI/URL, March 2019: https://doi.org/10.1002/jimd.12059. (wempe2019identificationofa pages 11-16)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1002/jimd.12059",\n        "normalized_doi": "10.1002/jimd.12059",\n        "primary_pmid": "30663059",\n        "primary_title": "Identification of a novel biomarker for pyridoxine-dependent epilepsy: Implications for newborn screening",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/30663059/"\n      },\n      {\n        "path": "genes/human/ALDH7A1/ALDH7A1-deep-research-falcon.md",\n        "line": 333,\n        "text": "10. (wempe2019identificationofa pages 11-16): Michael F. Wempe, Amit Kumar, Vijay Kumar, Yu J. Choi, Michael A.