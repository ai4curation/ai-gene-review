n and ATF4 signaling (pqac-00000001, pqac-00000020) | Primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340 |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 16,\n        "text": "| Human disease: SCA28 | **Spinocerebellar ataxia type 28 (SCA28)**: typically **autosomal dominant**, usually from **heterozygous AFG3L2 variants**, characterized by slowly progressive gait/limb ataxia with frequent oculomotor abnormalities (pqac-00000016, pqac-00000017, pqac-00000018, pqac-00000020) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 17,\n        "text": "| Human disease: DOA12 / OPA12 | **Dominant optic atrophy 12 (DOA12/OPA12)**: generally **autosomal dominant**, associated especially with **heterozygous ATPase- or catalytic-domain variants**; may overlap with ophthalmoplegia and broader mitochondrial optic neuropathy phenotypes (pqac-00000016, pqac-00000019, pqac-00000020) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 18,\n        "text": "| Human disease: SPAX5 | **Spastic ataxia type 5 / early-onset spastic ataxia-neuropathy syndrome (SPAX5)**: **autosomal recessive**, caused by **biallelic AFG3L2 variants**; severe childhood-onset phenotype with cerebellar ataxia, spasticity, dystonia, neuropathy, and in some cases myoclonic epilepsy (pqac-00000016, pqac-00000018, pqac-00000019, pqac-00000020) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      },\n      {\n        "path": "genes/human/AFG3L2/AFG3L2-deep-research-falcon_artifacts/artifact-00.md",\n        "line": 19,\n        "text": "| Therapeutic/diagnostic implications | Current clinical use is mainly **genetic diagnosis/variant interpretation** (NGS panels, exome-based workup for ataxia/optic neuropathy). Preclinical 2024 evidence suggests **ISR potentiation with Sephin-1** can improve SPAX5 cellular and mouse phenotypes; molecular readouts include **eIF2α phosphorylation, ATF4 targets, CHOP/CHAC1/FGF21** (pqac-00000016, pqac-00000017, pqac-00000020) | Review + primary | Franchino et al., 2024, *Brain*, https://doi.org/10.1093/brain/awad340; Dastidar et al., 2024, *Mol Neurobiol*, https://doi.org/10.1007/s12035-023-03768-z |",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.1093/brain/awad340",\n        "normalized_doi": "10.1093/brain/awad340",\n        "primary_pmid": "37804316",\n        "primary_title": "Sustained OMA1-mediated integrated stress response is beneficial for spastic ataxia type 5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37804316/"\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "37893031",\n    "mode": "fetch_missing",\n    "genes": [\n      "ADGRV1"\n    ],\n    "citations": [\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 182,\n        "text": "The full-length VLGR1b isoform is approximately **700 kDa** and about **6,306–6,309 amino acids**, making ADGRV1 the largest known adhesion GPCR and among the largest cell-surface proteins. Older transcript analyses describe a gene spanning roughly 605 kb with 90 exons and multiple splice forms; importantly, several shorter isoforms lack the C-terminal GPCR region and therefore should not automatically be assigned the signaling properties of full-length VLGR1b. A 2023 report describes the b isoform as 6,306 residues, whereas an earlier review reported 6,309 residues, likely reflecting transcript-annotation differences rather than different genes. [Sun et al., published November 2013, DOI/URL](https://doi.org/10.1007/s12031-012-9911-5); [Borgese et al., published September 2023](https://doi.org/10.3390/biomedicines11102657). (borgese2023combinedpresencein pages 4-7, sun2013theverylarge pages 2-3)",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/biomedicines11102657",\n        "normalized_doi": "10.3390/biomedicines11102657",\n        "primary_pmid": "37893031",\n        "primary_title": "Combined Presence in Heterozygosis of Two Variant Usher Syndrome Genes in Two Siblings Affected by Isolated Profound Age-Related Hearing Loss",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37893031/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 255,\n        "text": "1. (borgese2023combinedpresencein pages 4-7): Nica Borgese, Andrés Guillén-Samander, Sara Francesca Colombo, Giulia Mancassola, Federica Di Berardino, Diego Zanetti, and Paola Carrera. Combined presence in heterozygosis of two variant usher syndrome genes in two siblings affected by isolated profound age-related hearing loss. Biomedicines, 11:2657, Sep 2023. URL: https://doi.org/10.3390/biomedicines11102657, doi:10.3390/biomedicines11102657. This article has 1 citations.",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/biomedicines11102657",\n        "normalized_doi": "10.3390/biomedicines11102657",\n        "primary_pmid": "37893031",\n        "primary_title": "Combined Presence in Heterozygosis of Two Variant Usher Syndrome Genes in Two Siblings Affected by Isolated Profound Age-Related Hearing Loss",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/37893031/"\n      },\n      {\n        "path": "genes/human/ADGRV1/ADGRV1-deep-research-falcon.md",\n        "line": 329,\n        "text": "29. https://doi.org/10.3390/biomedicines11102657",\n        "type": "primary_verified_retained_provider_doi_citation",\n        "original_doi": "10.3390/biomedicines11102657",\n        "normalized_doi": "10.3390/biomedicines11102657",\n        "primary_pmid": "37893031",\n        "primary_title":