name: ClinGen reference recovery batch 104
run-name: Reference recovery batch 104 at ${{ github.ref_name }} (${{ github.sha }})
"on":
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: clingen-reference-recovery104-${{ github.ref }}
  cancel-in-progress: false
jobs:
  recover:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'ai4curation/ai-gene-review' &&
      github.ref == 'refs/heads/cmungall/clingen-reference-fetch104-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout the dispatched commit
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        fetch-depth: 1
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Set isolated runtime paths after runner initialization
      run: |
        python - <<'PYENV'
        from pathlib import Path
        import os
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-reference-recovery104'
        with Path(os.environ['GITHUB_ENV']).open('a') as out:
            out.write('UV_CACHE_DIR='+str(root/'uv-cache')+'\n')
            out.write('UV_PROJECT_ENVIRONMENT='+str(root/'venv')+'\n')
        PYENV
    - name: Initialize fixed source requests and partial report
      run: |
        python - <<'PYINIT'
        from pathlib import Path
        import json, os, base64, zlib, hashlib
        root=Path(os.environ['RUNNER_TEMP']).resolve()/'clingen-reference-recovery104'/'artifact'
        root.mkdir(parents=True)
        REQUESTS_B85 = 'c-rk%$!;4*5WVXw3OtK5LrIoo`xfQONHB7<45FvIhErB==!Ftv_}^1Ki%7*b;2_G)2QIx;b-nlM^~V!{FZ=;mJdjn3cd+n=)Z%oUqhV(Crnx#_y;;q(#wjfG9VXdt48=%xJ1=h0V&v72!;mL_Ti>mk#W4Cb?U9s3B4>~HeVKlFIqm%re}{oOLbY*^7Q<#fwTV{v*t;~P9L{)=`f?^2UkB_kpq03kLiV_91>bYkTr3qv+S+;!w44LQTEvJk8nmhU9GyLm>;i4c3cdL^DTW&_eIO&keo2Z0Q`&zMTazu7ULH*)d`czDIJ{>H?s<6sOv3%*^f&^C)dN@q%s>&ij*?Ai=v)9J$R_?ULm)*^BqVHudrUp39LlUIKR7PBfjx@H8I+?z1WmO%yEv;A?y6?hyuEmV{#fWH2VM5|Df#%Wu6=F|s>;fiDyvOpsjs$fSI@Q7$1$GSevM!OcZ81|EV>*dZlZLfrf!_^8WV!+I+6vYyWFl(foNk2LM9MaK}3x*@$B9D20mcSnl;kVHirU~AG8Yrg{olfazuErPCmFio|eukDtk~Z`O1_H?~O7e#O%Eb3DC4*?<~m)cC&YK&zJJSX<}s!@*HFJ!n9a;OnIC>1?v*@*$Cbdqu57ao{{0(1Gg~kNM$Z-I=GA;CF3f~UJNBb1%EhTh__gm`)Dk(uOEA-ap{HUWFqtZtCs}39a_PH-?T1U#rzaBKiuB_2_wWXNPf7pqL|1sl&yAh6)!j4*gweY6S*+A1WZf?nE5|2^StMgSgvE5Lp=rlqF+shQha~N8Zw_U3}(q^a^!n3F3>s-(jqqnLKhJK!iuStTvy<vLmPwG3DTk^U9u{Nalo2bGJEK<))PLAx8Q-)g3MIF3$%>zz6ja;!#}4TUq>_K@2{sn<-eC#Z?CV;&wu&v|Kz{t&CeL{#KMmZ__he?$#bX2(!8!?#j&p%7koeXYGToHA0;FU#i}iowlDq92EpnL*{Aqy(%!{nMdCK-nU0Wx^F7Vp{R4k)t}g1&t*q9U&BgWV`mAaGi%C!QzK%(MFW76E^cqv|RIF#S{+-xxM<$Ma`he<;J^yttnHvoS_@P7Xe9`3hNqApe-E$YQO(X~Sgh3MLD0gcyiKS31Q4Cu?!PaE5CO%OfWGHX4OcmTXTja*<cdX~gzU0i53T>nv0(*Wfxgvgf)Ka3>hopm#%NeTibvknNUoQU2E<U^Pw=RD2>Ev%%Ri*X'
