        PROVENANCE_PREFIX_SHA256 = '1a39775c6bed9a06f26a57d99fa63d52a7388fbf457cf63a4b1c4b28f27ec97b'
        PROVENANCE_MIDDLE_SHA256 = 'bcb45981cd6547428dbcda625bf62c100725e656b436191df6832db026cd518b'
        PROVENANCE_SHA256 = 'c908876c74e78fb448d3df2c6522f8529d7ffce40737c384d0dcd5432fd025db'
        prefix=(root.parent/'source-provenance-prefix.b85').read_bytes()
        assert len(prefix)==14000 and hashlib.sha256(prefix).hexdigest()==PROVENANCE_PREFIX_SHA256
        middle=(root.parent/'source-provenance-middle.b85').read_bytes()
        assert len(middle)==14000 and hashlib.sha256(middle).hexdigest()==PROVENANCE_MIDDLE_SHA256
        PROVENANCE_B85=prefix.decode('ascii')+middle.decode('ascii')+PROVENANCE_SUFFIX_B85
        raw=zlib.decompress(base64.b85decode(PROVENANCE_B85))
        assert hashlib.sha256(raw).hexdigest()==PROVENANCE_SHA256
        with (root/'source-list-provenance.json').open('xb') as handle:handle.write(raw)
