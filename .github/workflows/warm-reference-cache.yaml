path": "genes/human/AIMP2/AIMP2-deep-research-falcon.md",\n        "type": "verified_doi_provider_citation",\n        "line": 162,\n        "text": "- 2024 update\\u2014bidirectional regulation by DX2: AIMP2\\u2019s exon\\u20112\\u2013deleted splice variant, DX2, antagonizes AIMP2. In neuronal models, DX2 translocates to the nucleus more rapidly under oxidative stress, binds PARP\\u20111 with apparently higher affinity than AIMP2, and inhibits PARP\\u20111\\u2013dependent neuronal death. In vivo, DX2 transgenics show neuroprotection in rotenone models; single intracranial AAV\\u2011DX2 improved behavior/mobility in 6\\u2011OHDA PD models. This positions DX2 as a candidate therapeutic that counters AIMP2\\u2011PARP\\u20111\\u2013driven parthanatos (Lee 2024, Acta Neuropathol Commun., Jan 2024; https://doi.org/10.1186/s40478-023-01697-5) (lee2024bidirectionalregulationof pages 1-2).",\n        "original_doi": "10.1186/s40478-023-01697-5",\n        "normalized_doi": "10.1186/s40478-023-01697-5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38172953/",\n        "primary_title": "Bi-directional regulation of AIMP2 and its splice variant on PARP-1-dependent neuronal cell death; Therapeutic implication for Parkinson\'s disease."\n      },\n      {\n        "path": "genes/human/AIMP2/AIMP2-deep-research-falcon.md",\n        "type": "verified_doi_provider_citation",\n        "line": 243,\n        "text": "16. https://doi.org/10.1186/s40478-023-01697-5,",\n        "original_doi": "10.1186/s40478-023-01697-5",\n        "normalized_doi": "10.1186/s40478-023-01697-5",\n        "primary_url": "https://pubmed.ncbi.nlm.nih.gov/38172953/",\n        "primary_title": "Bi-directional regulation of AIMP2 and its splice variant on PARP-1-dependent neuronal cell death; Therapeutic implication for Parkinson\'s disease."\n      }\n    ]\n  },\n  {\n    "kind": "pmid",\n    "id": "38224449",\n    "mode": "fetch_missing",\n    "genes": [\n      "AGO2"\n    ],\n    "citations": [\n