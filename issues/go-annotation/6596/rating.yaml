summary: 'Diagnosis matches the curator''s own stated reasoning almost exactly (yeast SCS is ATP- not
  GTP-forming, PMID:9874242), and the worker independently supplied the mechanistic "why" (nucleotide
  specificity sits in the beta subunit, PMID:10353839, PMID:9765291) that the curator''s one-line comment
  does not spell out. All three key quotes (PMID:9874242, PMID:10353839, PMID:9765291) and the two PAINT
  TSV quotes verify verbatim against the cached sources (just validate-quotes: 4/4 verified, 0 failures).
  Actions only partially match what was actually done: the curator''s fix was a point primary NOT on UniProtKB:P53598
  alone (confirmed from the thread, comment:5947943682), not the node-level IKR NOT at the Fungi clade
  (PANTHER:PTN000874203) that the worker recommended as the source-level fix, and not an action on S.
  pombe O13750 at all. Downstream QuickGO checks (2026-11-11) show the P53598 row still unchanged from
  its pre-fix 20260528 IBA state (release lag -- the curator''s 10-02 NOT is plausible but not yet visible)
  and, independently, that O13750 (SPAC16E8.17c) still carries the same uncorrected "enables GO:0004776"
  IBA with no NOT at all, since the curator''s point fix never reached it. Spot-checking the quantitative
  claim, QuickGO''s IBA GO:0004776 recipients of PTN000122012 include on the order of 18-19 members with
  fungal taxon ids, consistent with the worker''s "19 IBA recipients" figure for the Fungi clade. The
  worker also independently verified and corrected a detail in the issue''s own framing (the 2017 precedent''s
  SPCC1620.08 is the S. pombe beta subunit, not an alpha orthologue), which I confirmed: SPCC1620.08/UniProtKB:O94415
  carries only GO:0004775, consistent with it being the beta gene fixed in 2017, while the alpha orthologue
  (SPAC16E8.17c/O13750) is a distinct, still-uncorrected gene. This is genuine added value: the worker
  (and the resulting family review) identified that the curator''s fix, while correct as far as it goes,
  is narrower than the family-wide problem and leaves at least 18 other Fungi recipients, including O13750,
  with the same error -- a currently-verifiable, unresolved gap, not a speculative one. The one open recommendation
  (a possible second IKR NOT at Viridiplantae, PANTHER:PTN000122078) is correctly left as FLAG_FOR_CHECK
  pending a plant-specific nucleotide assay the worker did not find, so it is scored as neither agreement
  nor disagreement. No action proposed looks likely to cause harm: the Fungi-node NOT rests on the same
  biology PAINT already uses for the beta family (PTHR11815), and the one acknowledged gap (the other
  17 fungal recipients not reviewed individually, Viridiplantae unchecked) was flagged rather than acted
  on. Confounds: prior_work is COVERS_SUBJECT on both work products (a prior YeastPathways-module PR had
  already set REMOVE on the LSC1 row, and the PTHR11117 family review already had this node at UNRESOLVED),
  so the worker built on an existing repo conclusion rather than starting cold, though `saw_prior_work:
  true` records this and the worker''s own mechanistic/citation contribution and the Fungi-wide quantitative
  check go well beyond what the prior work had established. This is a RETROSPECTIVE issue; the title given
  to the triager names the gene and term directly, so triage was not a blind call, though the diagnosis
  and quote-level work still required real literature synthesis. I did not open self-rating.yaml, issue.yaml/rating.yaml/report.md
  git history, PR 6220, any history/ record mentioning 6596, or the GO_ANNOTATION_TRACKER Status section
  at any point before or during scoring.'
