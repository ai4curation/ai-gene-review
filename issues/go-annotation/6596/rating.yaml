summary: >-
  Same problem, same fix for the gene at issue. The worker judged the GO:0004776
  (GDP-forming) IBA on LSC1 wrong because the yeast enzyme uses ATP but not GTP
  (PMID:9874242), and proposed REMOVE. The curator reached the same result with a NOT primary
  annotation on P53598 from the same paper. Actions are PARTIAL because the mechanisms
  differ. The worker proposed an IKR NOT at the Fungi node PTN000874203; the thread does not
  say whether the curator did more than the leaf NOT, so this can be neither confirmed nor
  refuted. The curator's family-wide fix adding contributes_to was noticed by the worker
  ("arguably contributes_to") but set aside as out of scope rather than proposed.
  Downstream is NOT_APPLICABLE: on 2026-11-10 QuickGO and the GO API still show the IBA
  (dated 20260528) on P53598 and O13750 and no NOT row. That is release lag, not a failed fix.
  Verified added value: SPCC1620.08 is O94415, the S. pombe beta subunit, not the alpha
  orthologue the opening post said it was; the alpha is SPAC16E8.17c (O13750, UniProt
  reviewed). O13750 does carry the same GDP-forming IBA. S. pombe and S. cerevisiae each have
  only one SCS beta (UniProt), and the PTHR11815 PAINT file has GO:0004776 IBD only at
  PTN000929335, with an IKR NOT for GO:0004775 there, so the beta-subunit argument holds.
  Quotes from PMID:9874242, PMID:10353839 and PMID:9765291 are verbatim in the cache, and the
  first is abstract-only. No harm found: the Fungi-wide NOT is an extrapolation from two
  yeasts, but no GTP-using fungal SCS is known, and the plant NOT was left for a curator to
  check. Confound: the LSC1 review already had REMOVE on this row before the run (YeastPathways
  PR of 2026-10-16, after the issue closed), so the worker did not judge the gene row
  independently. Its own contribution is the node-level diagnosis. Process note: while
  checking the file layout before writing, the rater saw the last lines of the worker's
  self-rating note. Scores had already been set.
