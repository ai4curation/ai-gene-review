resolution:
  status: RESOLVED
  resolved_at: '2026-10-02T08:11:00Z'
  summary: 'The PAINT curator agreed that the GDP-forming IBA on yeast LSC1 is wrong. They made a primary
    NOT annotation for GO:0004776 on P53598 based on PMID:9874242, so that PAINT stops propagating the
    term to it. They also re-reviewed the whole PTHR11117 annotation, adding the contributes_to qualifier
    that most annotations lacked. The thread does not say whether an ancestral NOT was placed at a Fungi
    node or whether S. pombe O13750 was changed. As of 2026-11-10 none of this has reached released data:
    QuickGO and the GO API still show the GO:0004776 IBA from PTN000122012 (dated 20260528) on both P53598
    and O13750, no NOT row for P53598, and the cached LSC1-goa.tsv matches. That is expected lag, since
    PAINT changes reach GOA only with a PANTHER/GO release; it is not evidence that the fix was dropped.'
  evidence:
