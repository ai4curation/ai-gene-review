    ref: comment:5947943682
    checked_at: '2026-11-11T00:00:00Z'
    note: Curator states they created a NOT primary annotation for P53598 based on PMID:9874242, and reviewed
      CONTRIBUTES_TO qualifiers across the whole PTHR11117 family annotation.
  - kind: GOA_DIFF
    ref: QuickGO annotation search, geneProductId=UniProtKB:P53598, goId=GO:0004776
    checked_at: '2026-11-11T00:00:00Z'
    note: Returns one row, "enables GO:0004776 IBA GO_REF:0000033 GO_Central 20260528", no NOT qualifier
      and no later date; the curator's fix is not yet reflected in the public QuickGO snapshot (release
      lag, not a wrong fix).
  - kind: GOA_DIFF
    ref: QuickGO annotation search, geneProductId=UniProtKB:O13750, goId=GO:0004776
    checked_at: '2026-11-11T00:00:00Z'
    note: 'Returns one row, "enables GO:0004776 IBA GO_REF:0000033 GO_Central 20260528", on the S. pombe
      alpha orthologue SPAC16E8.17c. This is the pre-fix state: no release since the 2026-10-02 fix exists,
      so it shows neither that O13750 was fixed nor that it was not.'
  - kind: OTHER
    ref: GO release metadata (release-date.json) and PANTHER PAINT downloads (paint/current)
    checked_at: '2026-11-11T17:00:00Z'
    note: Latest GO release 2026-08-05; latest PAINT release (IBD.gaf, paint_exp.gaf, presubmission) 2026-08-28.
      Both predate the 2026-10-02 fix, so no downstream source can show it yet. The August IBD.gaf still
      has the GO:0004776 IBD at PTN000122012 dated 20260528.
