  rationale: A PAINT IBD (PTN000122012, PTHR11117) propagates GO:0004776 succinate-CoA ligase (GDP-forming)
    activity to S. cerevisiae LSC1. Checkable from literature, the PANTHER tree and the PAINT data of
    both subunit families; work products are the LSC1 gene review and the PTHR11117 family review.
  triaged_by: claude-opus-5-5
  triaged_at: '2026-11-10T01:46:36Z'
shadow:
  status: DONE
  blinding: BLIND
  started_at: '2026-11-10T01:46:36Z'
  completed_at: '2026-11-10T02:00:00Z'
  worker: claude-opus-5-5
  worker_run: Claude Code session 466441eb (coordinator session), worker subagent in its own git worktree,
    2026-11-10T01:46Z
  saw_prior_work: true
  diagnosis: 'The issue is correct for LSC1: yeast succinyl-CoA ligase uses ATP but not GTP (PMID:9874242),
    so the GDP-forming IBA is wrong. The root cause is that the term sits on the LUCA node of the alpha-subunit
    family, while nucleotide specificity is set by the beta subunit (nucleotide site in the beta ATP-grasp
    domain, PMID:10353839; animal ATP- and GTP-specific enzymes share one alpha and differ in beta, PMID:9765291).
    Whether an alpha contributes to GDP-forming activity depends on the beta partners in the organism.
    The beta family PTHR11815 already models this (GDP-forming IBD on the GTP-specific beta clade PTN000929335
    with an IKR NOT for ADP-forming). In the alpha family the term is right for animals, for bacteria
    with dual-specificity enzymes (E. coli, P. aeruginosa seeds) and for Dictyostelium (IDA), but it over-propagates
    to all Fungi (19 IBA recipients, node PTN000874203), whose only beta subunit is ATP-specific. Viridiplantae
    (66 recipients) is probably a second loss but was not verified. One correction to the issue''s framing:
    SPCC1620.08, cited as the S. pombe orthologue in the 2017 precedent, is the beta subunit (LSC2 orthologue);
    the S. pombe alpha orthologue SPAC16E8.17c also carries this IBA.'
  supported_by:
  - reference_id: PMID:9874242
    supporting_text: The yeast succinyl-CoA ligase was shown to utilize ATP but not GTP for succinyl-CoA
      synthesis
  - reference_id: PMID:10353839
    supporting_text: It was concluded that the nucleotide-binding site is located in the N-terminal domain
      of the beta-subunit.
  - reference_id: PMID:9765291
    supporting_text: Highly ATP- and GTP-specific isoforms of succinyl-CoA synthetase in pigeon incorporate
      the same alpha-subunit, but different beta-subunits
  - reference_id: file:interpro/panther/PTHR11815/PTHR11815-paint.tsv
    supporting_text: "PTHR11815\tPTN000929335\tGO:0004776\tF\tIBD\tfalse"
  proposed_actions:
  - action: REMOVE
    subject: UniProtKB:P53598
    term_id: GO:0004776
    note: 'LSC1 IBA GO:0004776 succinate-CoA ligase (GDP-forming) activity: remove. Keep GO:0004775 succinate-CoA
      ligase (ADP-forming) activity (contributes_to, IDA/IMP).'
  - action: ADD
    subject: PANTHER:PTN000874203
    term_id: GO:0004776
    note: Add an IKR NOT for GO:0004776 at the Fungi node of PTHR11117, stopping propagation to all fungal
      alpha subunits (including S. pombe SPAC16E8.17c, UniProtKB:O13750). Keep the GO:0004775 IBD at PTN000122012.
  - action: REMOVE
    subject: UniProtKB:O13750
    term_id: GO:0004776
    note: S. pombe alpha subunit SPAC16E8.17c inherits the same IBA; its only beta (SPCC1620.08) is ADP-forming.
      Resolved by the Fungi NOT above.
  - action: FLAG_FOR_CHECK
    subject: PANTHER:PTN000122078
    term_id: GO:0004776
    note: 'Viridiplantae: candidate for a second IKR NOT (plant SCS is described as ATP-forming), but
      no plant nucleotide-specificity assay was checked; needs a curator''s check before acting. The more
      principled alternative is to keep nucleotide specificity on the beta family and drop or narrow the
      GDP-forming IBD at the alpha-family root.'
  work_products:
  - kind: GENE_REVIEW
    path: genes/yeast/LSC1/LSC1-ai-review.yaml
  - kind: FAMILY_REVIEW
