  - kind: OTHER
    path: history/genes/yeast/LSC1/2026-11-10T015606Z-claude-opus-5-5-bb2d89.yaml
resolution:
  status: RESOLVED
  resolved_at: '2026-10-02T08:11:00Z'
  summary: 'The PAINT curator agreed the GDP-forming call is wrong for the reported
    sequence and fixed it by creating a primary NOT annotation on UniProtKB:P53598 (LSC1) for GO:0004776,
    citing PMID:9874242, and separately reviewed the whole family''s qualifiers to add CONTRIBUTES_TO
    where missing. The fix is a point correction on the one reported sequence, not a node-level IKR
    NOT at the Fungi clade (PTN000874203) and not a re-placement of the IBD. Checked downstream on
    2026-11-11: QuickGO still returns the un-negated "enables GO:0004776" IBA row on P53598 dated
    20260528 (the curator''s 2026-10-02 NOT is not yet visible, consistent with release lag), and the
    S. pombe alpha orthologue SPAC16E8.17c (UniProtKB:O13750), which carries the same IBA from the same
    PTN000122012 node, has not been touched at all and still shows the uncorrected "enables GO:0004776"
    IBA row. The curator''s fix therefore does not yet reach the other ~18-19 Fungi members (confirmed
    by counting IBA GO:0004776 recipients under PTN000122012 whose taxon is fungal) that the shadow
    work also flagged.'
  evidence:
  - kind: THREAD
    ref: comment:5947943682
    checked_at: '2026-11-11T00:00:00Z'
    note: Curator states they created a NOT primary annotation for P53598 based on PMID:9874242, and
      reviewed CONTRIBUTES_TO qualifiers across the whole PTHR11117 family annotation.
  - kind: GOA_DIFF
    ref: QuickGO annotation search, geneProductId=UniProtKB:P53598, goId=GO:0004776
    checked_at: '2026-11-11T00:00:00Z'
    note: Returns one row, "enables GO:0004776 IBA GO_REF:0000033 GO_Central 20260528", no NOT qualifier
      and no later date; the curator's fix is not yet reflected in the public QuickGO snapshot (release
      lag, not a wrong fix).
  - kind: GOA_DIFF
    ref: QuickGO annotation search, geneProductId=UniProtKB:O13750, goId=GO:0004776
    checked_at: '2026-11-11T00:00:00Z'
    note: Returns one row, "enables GO:0004776 IBA GO_REF:0000033 GO_Central 20260528", on the S. pombe
      alpha orthologue SPAC16E8.17c; the curator's fix was scoped to P53598 only and did not extend here.
