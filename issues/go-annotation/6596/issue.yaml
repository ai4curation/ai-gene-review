resolution:
  status: RESOLVED
  resolved_at: '2026-10-02T08:11:00Z'
  summary: 'The PAINT curator agreed that the GDP-forming IBA on yeast LSC1 is wrong. They made a primary
    NOT annotation for GO:0004776 on UniProtKB:P53598 from PMID:9874242, and reviewed the whole PTHR11117
    annotation, adding the contributes_to qualifier that most rows lacked. The thread does not say whether
    a NOT was also placed at a Fungi node (PTN000874203) or whether the S. pombe alpha subunit (UniProtKB:O13750)
    was changed; both are unknown, not absent. None of the change can yet be seen downstream: the fix
    was made on 2026-10-02, and the latest releases predate it (GO 2026-08-05, PAINT 2026-08-28). QuickGO
    on 2026-11-11 still shows the pre-fix IBA (dated 20260528) on both P53598 and O13750, which cannot
    distinguish a fix from no fix.'
  evidence:
