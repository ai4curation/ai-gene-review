# Shadowed tracker: geneontology/go-annotation.
# See projects/GO_ANNOTATION_TRACKER.md. Never reference upstream issues by URL or
# org/repo#N in commits or PR text, and never @mention anyone but cmungall.
repo: geneontology/go-annotation
# Issues created before this date are not mirrored.
backfill_since: 2024-11-10
# Issues created on or after this date are PROSPECTIVE (picked up by the watcher);
# earlier ones are RETROSPECTIVE.
prospective_since: 2026-11-10
# Upstream label -> suggested IssueKindEnum value. First match in this order wins.
# Suggestions are hints for the triager, not triage decisions.
label_kinds:
  PAINT annotation: PAINT_IBA
  PAINT - waiting for primary annotation: PAINT_IBA
  TreeGrafter: PAINT_IBA
  ARBA: MAPPING_RULE
  ARBA - checked: MAPPING_RULE
  InterPro mapping: MAPPING_RULE
  UniProt KW2GO mapping: MAPPING_RULE
  UniRule: MAPPING_RULE
  HAMAP2GO mapping: MAPPING_RULE
  EC2GO mapping: MAPPING_RULE
  RHEA: MAPPING_RULE
  Rfam2GO: MAPPING_RULE
  direct_ann_to_list_of_terms: TERM_WIDE_REVIEW
  reg_ann_to_list_of_terms: TERM_WIDE_REVIEW
  annotation request: NEW_ANNOTATION_REQUEST
  annotation review: GENE_ANNOTATION
  technical issue: OUT_OF_SCOPE
  request for guidelines: OUT_OF_SCOPE
  no clear request: OUT_OF_SCOPE
