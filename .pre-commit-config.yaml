---
# https://pre-commit.com/
# Machine-owned mirrors of upstream issue threads keep their text verbatim.
exclude: '^issues/[^/]+/[0-9]+/(thread\.jsonl|source\.yaml)$'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/adrienverge/yamllint.git
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies:
          - tomli

  - repo: https://github.com/crate-ci/typos
    rev: v1.31.1
    hooks:
      - id: typos

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.11.3
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Run the formatter.
      - id: ruff-format

  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.6.12
    hooks:
      - id: uv-lock

  - repo: local
    hooks:
      # Committed term-validator caches must stay sorted by CURIE and
      # deduplicated, else git's line-based merge silently duplicates rows
      # (see the TCDB cache-conflict investigation). Repair drift with:
      #   uv run python -m ai_gene_review.tools.cache_lint --fix
      - id: cache-lint
        name: term-validator caches sorted and deduplicated
        entry: uv run python -m ai_gene_review.tools.cache_lint
        language: system
        pass_filenames: false
        files: '^cache/.*\.(csv|tsv)$'

      # Commit messages must not cross-reference or @mention upstream trackers
      # (it notifies their curators). Needs the commit-msg hook type:
      #   pre-commit install --hook-type commit-msg
      - id: upstream-notification-guard
        name: no upstream issue references or @mentions in commit message
        entry: python3 src/ai_gene_review/shadow_issues/guard.py --commit-msg
        language: system
        stages: [commit-msg]
