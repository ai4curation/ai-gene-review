id: MODULE:cyclic_nucleotide_gated_channels
title: Cyclic nucleotide-gated channels — rod CNGA1/CNGB1, cone CNGA3/CNGB3 and olfactory CNGA2/CNGA4/CNGB1b heterotetramers gated by intracellular cGMP or cAMP and conducting Na+ and Ca2+ into the cell, with Ca2+/calmodulin feedback inhibition through CNGB1
description: >-
  Cyclic nucleotide-gated (CNG) channels are nonselective cation channels of the
  plasma membrane of sensory cilia that open when intracellular cGMP or cAMP binds to a
  cyclic nucleotide-binding domain on each subunit. Each channel is a heterotetramer of
  homologous six-transmembrane subunits of the voltage-gated channel superfamily, in
  which the pore-forming alpha subunits (CNGA1, CNGA2, CNGA3) are joined by modulatory
  subunits (CNGB1, CNGB3, CNGA4) that tune ligand sensitivity, ion permeation, calcium
  block and calmodulin regulation. Three native channel types are known. In rod
  photoreceptor outer segments, three CNGA1 and one CNGB1 subunits form the cGMP-gated
  channel that carries the dark current; in cone outer segments the channel has three
  CNGA3 and one CNGB3 subunits; and in the cilia of olfactory sensory neurons the channel
  has two CNGA2, one CNGA4 and one CNGB1b subunit, the short splice form of CNGB1 that
  lacks the glutamic acid-rich GARP domain, and is opened by cAMP made by the odorant
  receptor-G(olf)-adenylyl cyclase 3 cascade. Open CNG channels conduct an inward current
  of Na+ and Ca2+ that depolarizes the cell and raises ciliary Ca2+. The Ca2+ that enters
  binds calmodulin, which associates with CNGB1 and lowers the apparent affinity of the
  channel for its cyclic nucleotide; in olfactory neurons this rapid feedback inhibition
  underlies odorant adaptation. In photoreceptors the light-driven fall in cGMP closes
  the channels, and inherited loss of rod or cone channel subunits causes retinitis
  pigmentosa or achromatopsia; loss of CNGB1 also impairs smell.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001139
    title: calcium transport pathway
    statement: >-
      RGD Pathway Ontology record for the calcium transport pathway (55 human genes curated
      by RGD). Its text names cyclic nucleotide-gated channels that respond to cGMP and cAMP
      to raise Ca2+ in photoreceptor and olfactory cells, and the record links a CNGs
      sub-page. This module models that CNG channel system only; the record's other
      transport systems are separate modules or unmodelled (see notes). Human genes in
      scope from RGD's list: CNGA1 CNGA2 CNGA3 CNGA4 CNGB1 CNGB3. Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001139.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: The RGD record text describing the CNG channels.
    supporting_text: >-
      Cyclic nucleotide gated channels (CNGs) respond to changes in the intracellular
      concentration of cGMP and also cAMP to increase Ca2+ concentration in photoreceptor
      and olfactory cells.
  - source_id: GO:0006816
    title: calcium ion transport
    statement: >-
      The GO process mapped to PW:0001139 (skos:closeMatch) in the project's PW-GO mappings
      (projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). CNG channels conduct Na+ as
      well as Ca2+, so the module concept is the sibling-branch term GO:0098655 monoatomic
      cation transmembrane transport rather than a descendant of GO:0006816 (see notes).
  - source_id: GO:0098655
    title: monoatomic cation transmembrane transport
    statement: >-
      Module concept. It is the process the four completed CNG subunit gene reviews give as
      directly_involved_in for their core channel function, and GO:0070588 calcium ion
      transmembrane transport, the Ca2+ part of the RGD rationale, is one of its children
      (go-basic 2026-07-26).
  - source_id: GO:0017071
    title: intracellular cyclic nucleotide activated cation channel complex
    statement: >-
      The complex term used for all three channel types; carried in GOA by CNGA3 (IDA
      PMID:12815043) and CNGB3 (IMP PMID:12815043), by IBA for all six subunits, and used as
      the enabling entity of the CNG activities in the human visual-perception GO-CAMs.
  - source_id: PMID:34699778
    title: Structural mechanisms of assembly, permeation, gating, and pharmacology of native human rod CNG channel.
    statement: Cryo-EM and electrophysiology of the human rod channel establish its 3:1 CNGA1/CNGB1 composition.
    supporting_text: the native rod CNG functions as a heterotetramer consisting of three A1 and one B1 subunits
  - source_id: PMID:34969976
    title: Structure of the human cone photoreceptor cyclic nucleotide-gated channel.
    statement: The human cone channel structure resolves a 3:1 CNGA3/CNGB3 stoichiometry.
    supporting_text: The channel contains three CNGA3 and one CNGB3 subunits.
  - source_id: PMID:41131016
    title: Structural mechanisms of assembly, gating, and calmodulin modulation of human olfactory CNG channel.
    statement: >-
      Structures of the human olfactory channel establish its CNGA2/CNGA4/CNGB1b composition,
      its 2:1:1 stoichiometry, cAMP gating and calmodulin binding on CNGB1b.
    supporting_text: >-
      In olfactory sensory neurons, the native CNG
      channel functions as a heterotetramer consisting of CNGA2, CNGA4, and CNGB1b
      subunits and is activated by cAMP.
  - source_id: PMID:41131016
    statement: All CNG channels conduct inward Na+ and Ca2+ when opened by their cyclic nucleotide.
    supporting_text: Upon activation, CNG channels conduct inward Na⁺ and Ca2+ currents, thereby depolarizing the membrane potential and increasing the intracellular [Ca2+].
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001139 (calcium transport pathway) through
  the RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml,
  mapped GO:0006816 calcium ion transport). RGD curates 55 human genes to PW:0001139, mixing
  unrelated channel, pump and exchanger families, so the project models the record as one
  human module per transport system. This module is the cyclic nucleotide-gated channel
  system; store_operated_calcium_entry, plasma_membrane_calcium_extrusion,
  er_calcium_store_cycling and mitochondrial_calcium_uniporter are sibling modules from the
  same record. PW:0001139 is the only PW evidence source_id; its sub-pathway PW:0001140
  (calcium/calcium-mediated signaling) is mentioned here in prose only. RGD's diagram draws
  no CNG gene; the six subunits come from its curated gene list and the record's CNGs
  sub-page link.


  (1) MODULE CONCEPT. CNG channels are nonselective cation channels; in rods the dark
  current is carried mainly by Na+, with Ca2+ a minor but signalling-relevant fraction (larger
  in cones and olfactory cilia). A calcium-only concept (GO:0070588 calcium ion transmembrane
  transport, the descendant of the mapped GO:0006816) would misstate the cargo, so the
  concept is its parent GO:0098655 monoatomic cation transmembrane transport, which the four
  completed CNG gene reviews give as directly_involved_in. Na+ and Ca2+ are recorded as
  cargo on each channel annoton, grounded to ChEBI with labels checked in OLS (November
  2026): sodium(1+) CHEBI:29101, calcium(2+) CHEBI:29108. The gating ligands are not
  transported, so they are not cargo; they are named in each function description as
  3',5'-cyclic GMP(1-) CHEBI:57746 and 3',5'-cyclic AMP(1-) CHEBI:58165 (OLS-checked; the
  ionized forms used by Rhea). Outward K+ flux and Mg2+ block are not modelled.


  (2) STRUCTURE. Two parts. Part 1 is the conduction step, a ONE_OR_MORE REALIZER variant
  set on sensory cell type with three variants (rod, cone, olfactory), each with its cell type
  in variant context and one PROTEIN_COMPLEX annoton (GO:0017071) whose active_units give the
  subunits and stoichiometry (3 CNGA1 + 1 CNGB1; 3 CNGA3 + 1 CNGB3; 2 CNGA2 + 1 CNGA4 + 1
  CNGB1b). Part 2 is Ca2+/calmodulin feedback on CNGB1; the conduction step CAUSES it (Ca2+
  entry) and it NEGATIVELY_REGULATES the conduction step.


  (3) COMPLEX-SUBUNIT RULE AND MOLECULAR FUNCTIONS. The channel activity is placed on each
  complex annoton, as in modules/visual_phototransduction.yaml. Subunit (active_unit)
  functions follow experimental GOA (QuickGO, November 2026; GO ids checked in go-basic
  2026-07-26): CNGA1 enables GO:0005223 intracellularly cGMP-activated cation channel activity
  (IDA PMID:34699778, which measures CNGA1 homomers as well as heteromers) and CNGA3 enables
  GO:0005223 (IDA PMID:12815043, IMP PMID:24164424), so these alpha units carry the
  activity; both form functional homomers. CNGA2 also forms homomers (PMID:41131016) but has
  no experimental human GOA function row (IBA and ISS only), so its unit has no function. The
  modulatory units CNGB1, CNGB3 and CNGA4 do not form channels alone and were assayed only
  within heteromers, so they get no channel function of their own; this matches the CNGB1 and
  CNGB3 gene reviews' core functions (contributes_to GO:0005221 and GO:0005223). CNGA4 has no
  experimental GOA row at all. The CNGA1 and CNGA3 gene reviews also record their core
  function as contributes_to, reflecting the physiological heteromer; the unit-level enables
  here records the homomer capability that GOA captures, and the module-level activity still
  sits on the complex. The olfactory complex function GO:0005222 intracellularly
  cAMP-activated cation channel activity is authored from PMID:41131016: no GOA row types the
  olfactory complex (CNGB1's GO:0005222 IDA row is from the rod channel). The calmodulin
  function GO:0008200 ion channel inhibitor activity is also authored: CALM1 and CALM2 have
  IDA rows for GO:0019855 calcium channel inhibitor activity and GO:0005246 calcium channel
  regulator activity from studies of other channels, and the CNG channel is a nonselective
  cation channel, so the ion channel parent is used. GO:0005515 protein binding is not used.
  Processes on the complexes: GO:0141190 transducin-mediated opsin signaling pathway for rod
  and cone, matching visual_phototransduction (the GO-CAMs use the broader GO:0007601 visual
  perception), and GO:0050911 detection of chemical stimulus involved in sensory perception
  of smell for the olfactory channel, as in the CNGB1 gene review. The calmodulin process is
  GO:1902159 regulation of cyclic nucleotide-gated ion channel activity; its negative and
  positive children are obsolete in go-basic 2026-07-26, so the direction is carried by the
  NEGATIVELY_REGULATES connection.


  (4) RELATION TO visual_phototransduction. modules/visual_phototransduction.yaml models the
  rod and cone channels as its CNG channel-closure step (part 4) with the same typing: a
  GO:0017071 complex participant with CNGA1/CNGB1 or CNGA3/CNGB3 active_units, function
  GO:0005223, process GO:0141190, location GO:0042622. This module keeps that typing so both
  modules describe the same activity identically. It adds unit-level functions for CNGA1 and
  CNGA3, cargo and stoichiometry, which do not conflict. Because visual_phototransduction is
  not edited here, it does not yet module_ref this module; a later revision could replace its
  CNG step with a module_ref to cyclic_nucleotide_gated_channels. A module_ref in the other
  direction is not appropriate: this module needs the channel step, not the opsin cascade.


  (5) BOUNDARY. Upstream signalling is context, not parts: the phototransduction cascade
  (opsins, transducin, PDE6, retGC/GCAPs; in visual_phototransduction) that sets cGMP, and the
  olfactory cascade (odorant receptors, GNAL, ADCY3) that makes cAMP, which has no module yet.
  Downstream: the Ca2+-activated chloride channel ANO2 that amplifies the olfactory current,
  NCKX extrusion of the entering Ca2+ (plasma_membrane_calcium_extrusion), and synaptic output. Channel
  trafficking to the outer segment (ankyrin-G/ANK3, modelled in the ankyrin-G GO-CAM) and the
  soluble GARP products of CNGB1 that inhibit basal PDE6 (see the CNGB1 gene review and
  visual_phototransduction) are out of scope. HCN channels, which share the cyclic
  nucleotide-binding fold but are hyperpolarization-activated, are not CNG channels and are
  excluded.


  (6) CALMODULIN FEEDBACK. Modelled only where evidence is cited: the human olfactory
  channel (PMID:41131016: calmodulin bound to CNGB1b at two sites, Ca2+-dependent inhibition)
  and the rod channel (Reactome R-HSA-3229181, a TAS event citing the 1990s rod studies,
  not cached here). Calmodulin modulation of the cone channel through CNGB3 has been reported
  but no cached source was checked, so the cone channel is not a target. The role description
  leads with olfaction, where the human evidence is direct. Other reported modulators
  (phosphoinositides, phosphorylation, CNGA4-dependent desensitization details) are not
  modelled.


  (7) GO-CAM LINKS. Seven production human GO-CAMs in gocams/index.tsv contain a CNG channel
  complex, all typed GO:0017071 enabling GO:0005223. Rod CNGA1/CNGB1: the RHO model
  (gomodel:6918f23700000035) and the ankyrin-G transport model (gomodel:69ea894900004256).
  Cone CNGA3/CNGB3: the OPN1LW, OPN1SW, OPN1MW, OPN1MW2 and OPN1MW3 models. All are pinned on
  the matching annoton; visual_phototransduction pins three of the five cone activities and
  only the RHO rod activity. No GO-CAM models the olfactory channel or calmodulin feedback.
  The cone channel's location differs between models (photoreceptor outer segment membrane
  in the OPN1SW model, cone photoreceptor disc membrane in the others); both are defensible
  and this is noted, not flagged. The seed's best_gocam (gomodel:65d7e4ac00002121, ITPR1
  mitochondrial calcium import) is unrelated to this module.


  (8) POSSIBLE UPSTREAM ISSUES. (a) CNGB1 and CNGB3 carry enables GO:0005223 (IDA) from
  heteromer assays (PMID:34699778, PMID:24164424; PMID:12815043, PMID:24164424) in which the
  beta subunit cannot conduct alone; contributes_to would match the experiments better. The
  gene reviews accepted these rows, so this is a qualifier question for UniProt, not a
  removal. (b) Human CNGA2 and CNGA4 have no experimental GOA rows although the human
  olfactory complex has now been characterized (PMID:41131016); a curation gap, recorded for
  the project plan.


  (9) OTHER PW:0001139 GENES NOT MODELLED HERE. ATP2B1-4, SLC8A1-3 and SLC24A1-4 are in
  plasma_membrane_calcium_extrusion; STIM1, STIM2, ORAI1-3 in store_operated_calcium_entry;
  ITPR1-3, RYR1-3 and ATP2A1-3 in er_calcium_store_cycling; MCU and SLC8B1 in
  mitochondrial_calcium_uniporter. The voltage-gated CACNA1 and CACNB genes, TRPV5/TRPV6,
  TPCN1/TPCN2/MCOLN1 and ATP2C1/ATP2C2 are handled by other modules or are unmodelled.


  (10) GROUNDING. UniProt accessions: CNGA1, CNGA3, CNGB1, CNGB3 and CALM1-3 from their
  genes/human/*-uniprot.txt files; CNGA2 (Q16280) and CNGA4 (Q8IV77) from UniProt REST
  (reviewed human entries). Cell types from CL via OLS. GO ids and labels checked against
  go-basic 2026-07-26; none obsolete. Gene reviews exist for CNGA1, CNGA3, CNGB1 and CNGB3;
  CNGA2 and CNGA4 have none yet, which is curation follow-up for the project plan. No
  PANTHER or PTN ids are asserted: every participant is a concrete human gene product.
module:
  id: cyclic_nucleotide_gated_channels
  label: Cyclic nucleotide-gated channels
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: monoatomic cation transmembrane transport
      term:
        id: GO:0098655
        label: monoatomic cation transmembrane transport
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: ciliary membrane
        term:
          id: GO:0060170
          label: ciliary membrane
        description: >-
          Shared location of all three channel types: the photoreceptor outer segment is a
          modified primary cilium and the olfactory channel sits in the membrane of the
          sensory cilia. Annotons give the more specific photoreceptor outer segment membrane
          where it applies.
  parts:
    - order: 1
      role: cyclic nucleotide-gated cation conduction
      node:
        id: cng_cation_conduction
        label: Cyclic nucleotide-gated Na+ and Ca2+ entry through cell-type-specific CNG heterotetramers
        module_type: TRANSPORT_STEP
        description: >-
          Binding of intracellular cGMP (photoreceptors) or cAMP (olfactory neurons) to the
          cyclic nucleotide-binding domains opens the CNG pore, which admits Na+ and Ca2+
          from the extracellular side into the cytosol. Each sensory cell type assembles its
          own heterotetramer from a pore-forming alpha subunit and one or two modulatory
          subunits.
        variant_sets:
          - id: cng_channel_cell_type
            label: Rod, cone and olfactory CNG channels
            axis: sensory cell type
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            notes: >-
              Each cell type expresses one channel type; the organism has all three. CNGB1 is
              shared between the rod channel (full-length isoform with the GARP domain) and
              the olfactory channel (short CNGB1b form).
            variants:
              - id: rod_cng_channel
                label: Rod CNG channel (3 CNGA1 + 1 CNGB1)
                module_type: TRANSPORT_STEP
                context:
                  cell_types:
                    - preferred_term: retinal rod cell
                      term:
                        id: CL:0000604
                        label: retinal rod cell
                annotons:
