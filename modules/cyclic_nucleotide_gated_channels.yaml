    - order: 2
      role: Ca2+/calmodulin feedback inhibition through CNGB1
      node:
        id: cng_calmodulin_feedback
        label: Ca2+/calmodulin binds CNGB1 and lowers the cyclic nucleotide sensitivity of the channel
        module_type: REGULATORY_STEP
        description: >-
          Ca2+ entering through the open channel binds calmodulin, which is associated with
          the CNGB1 subunit of the olfactory and rod channels. Ca2+/calmodulin lowers the
          apparent affinity of the channel for its cyclic nucleotide and so closes channels
          at a given cAMP or cGMP level, a negative feedback that underlies rapid odorant
          adaptation in olfactory neurons.
        annotons:
          - id: calmodulin_cng_inhibition
            label: Ca2+/calmodulin inhibition of the CNGB1-containing channels
            participant:
              selector_type: FAMILY
              family:
                preferred_term: calmodulin (CALM1, CALM2, CALM3)
                description: >-
                  Three human genes encode an identical calmodulin protein; any of them can fill
                  this role.
                representative_members:
                  - preferred_term: CALM1
                    term:
                      id: UniProtKB:P0DP23
                      label: Calmodulin-1
                  - preferred_term: CALM2
                    term:
                      id: UniProtKB:P0DP24
                      label: Calmodulin-2
                  - preferred_term: CALM3
                    term:
                      id: UniProtKB:P0DP25
                      label: Calmodulin-3
            function:
              preferred_term: ion channel inhibitor activity
              term:
                id: GO:0008200
                label: ion channel inhibitor activity
              targets:
                - preferred_term: CNGB1 (olfactory CNGB1b and rod CNGB1)
                  term:
                    id: UniProtKB:Q14028
                    label: Cyclic nucleotide-gated channel beta-1
            processes:
              - preferred_term: regulation of cyclic nucleotide-gated ion channel activity
                term:
                  id: GO:1902159
                  label: regulation of cyclic nucleotide-gated ion channel activity
            role_description: >-
              Calmodulin stays bound to the olfactory channel even without Ca2+; when Ca2+ rises,
              its C-lobe binds the CNGB1b CaM1 site and its N-lobe the CaM2 site, closing the
              channel and lowering its apparent cAMP affinity more than 10-fold. Reactome
              describes the same CNGB1-targeted reduction of cGMP affinity for the rod channel.
              The function is authored (see notes): calmodulin's experimental GOA rows for
              channel inhibition concern other channels.
            evidence:
              - source_id: PMID:41131016
                statement: Endogenous calmodulin bound to the human olfactory channel causes rapid Ca2+-dependent inhibition.
                supporting_text: adding Ca2+ in the bath solution (cytosolic) induces rapid inhibition of CNGA2/A4/B1b conduction mediated by the endogenous CaM
              - source_id: PMID:41131016
                statement: Calmodulin acts mainly on the CNGB1b subunit through its two lobes.
                supporting_text: Upon Ca2+ binding, CaM modulates the native olfactory CNG activity by mainly interacting with the B1b subunit, with its C-lobe binding to the B1b N-terminal CaM1 site and its N-lobe binding to the B1b C-terminal CaM2 s
              - source_id: Reactome:R-HSA-3229181
                statement: Reactome event for Ca2+/calmodulin binding the rod CNG channel beta subunit.
                supporting_text: By targeting the beta subunit of the channel, CALM1:Ca2+ reduces the apparent affinity of the channel for cGMP
