                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: rod CNG channel (3 CNGA1 + 1 CNGB1)
                        term:
                          id: GO:0017071
                          label: intracellular cyclic nucleotide activated cation channel complex
                        active_units:
                          - id: rod_cnga1_unit
                            label: CNGA1 subunit
                            role: >-
                              Principal cGMP-binding and pore-forming subunit. Expressed alone,
                              CNGA1 forms functional cGMP-gated homotetramers, so it carries the
                              channel activity in its own right (GOA enables GO:0005223, IDA
                              PMID:34699778).
                            stoichiometry: '3'
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: CNGA1
                                term:
                                  id: UniProtKB:P29973
                                  label: Cyclic nucleotide-gated channel alpha-1
                            function:
                              preferred_term: intracellularly cGMP-activated cation channel activity
                              term:
                                id: GO:0005223
                                label: intracellularly cGMP-activated cation channel activity
                            evidence:
                              - source_id: PMID:33651975
                                statement: The alpha subunits form functional homotetrameric channels; the study resolves the human CNGA1 homotetramer in closed and cGMP-bound open states.
                                supporting_text: The α-subunits (CNGA1, A2 or A3), being the major components of CNG channels, can by themselves form functional homotetrameric channels
                          - id: rod_cngb1_unit
                            label: CNGB1 subunit (full-length rod isoform)
                            role: >-
                              Modulatory subunit. It contributes its own cyclic nucleotide-binding
                              domain and part of the pore, raises cAMP efficacy, weakens Ca2+ block,
                              confers L-cis-diltiazem sensitivity and carries the calmodulin-binding
                              sites; it does not form a channel alone. Assayed only within the
                              heteromer, so it is given no channel function of its own; its gene
                              review records contributes_to GO:0005221.
