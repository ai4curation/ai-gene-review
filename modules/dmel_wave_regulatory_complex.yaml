id: MODULE:dmel_wave_regulatory_complex
title: WAVE regulatory complex (SCAR complex) in Drosophila melanogaster
description: >-
  The WAVE regulatory complex (WRC) is a five-subunit complex that holds the Arp2/3 activator
  SCAR (WAVE) in an inactive state until it is recruited and activated at the plasma membrane,
  mainly by the small GTPase Rac. It is built from two subcomplexes: a Cyfip (Sra1)-Hem (Nap1)
  dimer and a trimer of SCAR, Abi and HSPC300. Once activated, the C-terminal VCA region of
  SCAR binds actin and the Arp2/3 complex and stimulates branched actin nucleation. In Drosophila
  the WRC is needed for lamellipodia formation, axon growth, myoblast fusion and egg chamber
  development, and loss of one subunit destabilizes the others.
status: DRAFT
scope: CONCRETE
