- source_id: FB:FBgg0000492
  title: 'FlyBase gene group WRC: Wave regulatory complex'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as wave regulatory complex (WRC);
    this module models that group.
- source_id: GO:0031209
