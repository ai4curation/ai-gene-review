notes: >-
  The Arp2/3 complex acted on by the WRC is a separate module (dmel_arp2_3_complex). Rac GTPases
  and membrane recruitment factors are regulators and are not parts. FlyBase groups realized
  by this module: WRC (FBgg0000492). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_wave_regulatory_complex.yaml; none of the member genes has a gene review
  yet unless noted.
