id: MODULE:retinal_determination_network
title: Retinal determination network module
description: >-
  The conserved gene regulatory network that specifies eye identity in bilaterians. A Pax6 paired/homeodomain
  selector transcription factor initiates the program and induces expression of a Six-family homeodomain
  transcription factor (Sine oculis / SIX) and the Eyes absent (EYA) cofactor. EYA, a nuclear transcriptional
  coactivator with intrinsic protein phosphatase activity, binds SIX proteins and converts SIX-dependent
  repression into activation; Dachshund (DACH), a Ski/Sno-related nuclear cofactor, also complexes with
  EYA. The factors cross-regulate one another in positive feedback loops, so the network behaves as an
  interlocked circuit rather than a linear hierarchy. Misexpression of the Pax6, Six/Eya or Dachshund
  components can induce ectopic eye tissue in Drosophila, and the vertebrate orthologs (PAX6, SIX3/SIX6,
  EYA, DACH) act with the same epistatic logic in optic vesicle, retina and lens development.
status: DRAFT
evidence:
- source_id: GO:0001654
  title: eye development
  statement: The module is grounded in the species-neutral GO process for eye development.
- source_id: PMID:9428513
  title: >-
    Dachshund and eyes absent proteins form a complex and function synergistically to induce ectopic eye
    development in Drosophila.
  statement: >-
    Retinal specification is controlled by an interlocked network of Pax6, Eya, Dachshund (and So) rather
    than a linear cascade.
  supporting_text: >-
    We propose that a conserved regulatory network, rather than a linear hierarchy, controls retinal specification
    and involves multiple protein complexes that function during distinct steps of eye development.
- source_id: PMID:9584118
  title: >-
    Eyeless initiates the expression of both sine oculis and eyes absent during Drosophila compound eye
    development.
  statement: >-
    Pax6 (Eyeless) induces so and eya, which then participate in a positive feedback loop; vertebrate
    homologs show similar epistasis.
  supporting_text: >-
    Recent studies in vertebrate systems indicate that the epistatic relationships among the corresponding
    vertebrate homologs are very similar to those observed in Drosophila.
- source_id: file:human/PAX6/PAX6-ai-review.yaml
  title: PAX6 gene review
  statement: >-
    Core function of the human Pax6 selector is RNA polymerase II-specific DNA-binding transcription factor
    activity.
- source_id: file:DROME/ey/ey-ai-review.yaml
  title: ey gene review
  statement: >-
    Eyeless core functions are Pol II TF activity and cis-regulatory DNA binding at so, eya and atonal
    eye enhancers.
- source_id: file:DROME/toy/toy-ai-review.yaml
  title: toy gene review
  statement: Twin of eyeless directly activates the ey eye enhancer and acts upstream of ey.
- source_id: file:mouse/Pax6/Pax6-ai-review.yaml
  title: Pax6 (mouse) gene review
  statement: >-
    Mouse Pax6 is reviewed as an activator/repressor Pol II transcription factor in eye, CNS and endocrine
    pancreas.
notes: >-
  Boundary: the module covers the transcriptional core of eye-field / eye-disc specification (Pax6, Six,
  Eya, Dach). Upstream inputs (Hedgehog, Dpp/BMP, Notch and EGFR signalling; Hox repression of eyeless
  outside the head), downstream neurogenesis (atonal/ATOH7 activation) and photoreceptor differentiation
  are context, not parts. In Drosophila the Pax6 role is split between twin of eyeless (toy), which directly
  activates the eye-specific enhancer of eyeless (ey), and ey itself; mammals have a single PAX6, so both
  are modelled as representatives of one Pax6 family annoton. Insects use So (Six1/2 subfamily) in the
  eye, while vertebrate eye-field specification relies chiefly on the Six3/6 subfamily (fly Optix); both
  are represented under one Six-family annoton. Gene reviews now exist for all representatives (so, eya,
  dac, SIX3, SIX6, EYA1, DACH1); the fly dac representative is an unreviewed UniProt entry. EYA1 is used
  as the mammalian Eya exemplar for the conserved coactivator/phosphatase activities only: its loss-of-function
  roles are in ear, kidney and branchial arches (branchio-oto-renal syndrome), not retinal specification,
  so the eye-development process on the Eya annoton rests on Drosophila eya. Human DACH1 is a transcriptional
  corepressor (a child of the annoton's coregulator term) with reported direct DNA binding not shown for
  fly Dac.
module:
  id: retinal_determination_network
  label: Retinal determination gene regulatory network
  module_type: DEVELOPMENTAL_PROCESS
  description: >-
    Pax6-initiated, mutually reinforcing network of selector transcription factors and nuclear cofactors
    that confers eye identity on a primordium.
  concepts:
  - preferred_term: eye development
    term:
      id: GO:0001654
      label: eye development
    description: >-
      Species-neutral parent of compound eye development (GO:0048749) and camera-type eye development
      (GO:0043010), both of which this network initiates.
  - preferred_term: specification of animal organ identity
    term:
      id: GO:0010092
      label: specification of animal organ identity
    description: The network specifies eye identity of a primordium, as shown by ectopic eye induction.
  context:
    taxa:
    - preferred_term: Bilateria
      term:
        id: NCBITaxon:33213
        label: Bilateria
      description: Pax6, Six, Eya and Dach orthologs act together in eye specification in insects and
        vertebrates.
    cellular_components:
    - preferred_term: nucleus
      term:
        id: GO:0005634
        label: nucleus
  parts:
  - order: 1
    role: eye selector initiation
    node:
      id: pax6_selector
      label: Pax6 selector transcription factor
      module_type: REGULATORY_STEP
      description: >-
        Paired-box/homeodomain transcription factor that initiates eye development and directly activates
        Six-family and other target enhancers.
      annotons:
      - id: pax6_tf
        label: Pax6 eye selector
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Pax6 paired-box/homeodomain transcription factors
            term:
              id: PANTHER:PTHR45636
              label: PAIRED BOX PROTEIN PAX-6-RELATED-RELATED
            description: Pax6 subfamily of paired-box proteins; duplicated in insects into eyeless and
              twin of eyeless.
            representative_members:
            - preferred_term: PAX6 (human)
              term:
                id: UniProtKB:P26367
                label: Paired box protein Pax-6
            - preferred_term: Pax6 (mouse)
              term:
                id: UniProtKB:P63015
                label: Paired box protein Pax-6
            - preferred_term: ey (Drosophila eyeless)
              term:
                id: UniProtKB:O18381
                label: Paired box protein Pax-6
            - preferred_term: toy (Drosophila twin of eyeless)
              term:
                id: UniProtKB:Q9V490
                label: Twin of eyeless
            ancestral_nodes:
            - preferred_term: PAINT sensory-organ-development node PTN008693041
              term:
                id: PANTHER:PTN008693041
                label: PTN008693041
              description: >-
                Bilaterian PAINT node in PTHR45636 with IBD support for sensory organ development (GO:0007423);
                seeds include human PAX6 (UniProtKB:P26367), mouse Pax6 (MGI:97490), eyeless (FB:FBgn0005558)
                and twin of eyeless (FB:FBgn0019650).
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT node PTN008693041 in PTHR45636.
        function:
          preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
        processes:
        - preferred_term: eye development
          term:
            id: GO:0001654
            label: eye development
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: >-
          Initiating selector of the network; its misexpression induces ectopic eyes, and it is required
          in the lens primordium of the vertebrate eye.
        evidence:
        - source_id: PMID:7892602
          title: Induction of ectopic eyes by targeted expression of the eyeless gene in Drosophila.
          statement: Targeted ey expression induces morphologically normal ectopic compound eyes.
          supporting_text: These results support the proposition that ey is the master control gene for
            eye morphogenesis.
        - source_id: PMID:10198632
          title: >-
            twin of eyeless, a second Pax-6 gene of Drosophila, acts upstream of eyeless in the control
            of eye development.
          statement: Toy directly activates the eye-specific enhancer of ey and acts through Ey.
          supporting_text: Toy functions upstream of ey by directly regulating the eye-specific enhancer
            of ey
        - source_id: PMID:11069887
          title: >-
            Pax6 activity in the lens primordium is required for lens formation and for correct placement
            of a single retina in the eye.
          statement: In mouse, Pax6 is required cell-autonomously in the surface ectoderm for lens placode
            formation.
          supporting_text: Pax6 activity was found to be essential in the specified ectoderm for lens
            placode formation
  - order: 2
    role: Six-family DNA-binding effector
    node:
      id: six_factor
      label: Six-family homeodomain transcription factor
      module_type: REGULATORY_STEP
      description: >-
        Six-family homeodomain transcription factor of the network. So/SIX1-2 is induced by Pax6 and partners
        with EYA; SIX3/SIX6 act as corepressor-dependent eye-field factors cooperating with Pax6.
      annotons:
      - id: six_tf
        label: Sine oculis / SIX eye transcription factor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: SIX homeodomain transcription factors
            term:
              id: PANTHER:PTHR10390
              label: HOMEOBOX PROTEIN SIX
            description: >-
              Six1/2 (fly So) and Six3/6 (fly Optix) subfamilies; So acts in the insect eye disc, SIX3/SIX6
              in the vertebrate eye field.
            representative_members:
            - preferred_term: so (Drosophila sine oculis)
              term:
                id: UniProtKB:Q27350
                label: Protein sine oculis
            - preferred_term: SIX6 (human)
              term:
                id: UniProtKB:O95475
                label: Homeobox protein SIX6
            - preferred_term: SIX3 (human)
              term:
                id: UniProtKB:O95343
                label: Homeobox protein SIX3
        function:
          preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
        processes:
        - preferred_term: eye development
          term:
            id: GO:0001654
            label: eye development
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: >-
          DNA-binding transcription factor of the network. The Six1/2 class (fly So, vertebrate SIX1/2)
          is the DNA-binding partner of EYA and, with Eya, induces ectopic eyes in Drosophila. The Six3/6
          class (fly Optix, vertebrate SIX3/SIX6) that dominates vertebrate eye-field specification does
          not bind Eya; it acts mainly as a Groucho/TLE- and Dach-dependent repressor and cooperates with
          Pax6 in eye field and optic vesicle patterning.
        evidence:
        - source_id: PMID:9428512
          title: >-
            The eye-specification proteins So and Eya form a complex and regulate multiple steps in Drosophila
            eye development.
          statement: So and Eya act together, synergize in ectopic eye induction and physically interact.
          supporting_text: >-
            We propose that an So/Eya complex regulates multiple steps in eye development and functions
            within the context of a network of genes to specify eye tissue identity.
        - source_id: PMID:12163408
          title: Six3 inactivation reveals its essential role for the formation and patterning of the
            vertebrate eye.
          statement: Vertebrate Six3 is required for forebrain and eye formation and cooperates with Pax6.
          supporting_text: During both processes of vertebrate eye formation, Six3 cooperates with Pax6.
        - source_id: PMID:12050133
          title: >-
            Six3-mediated auto repression and eye development requires its interaction with members of
            the Groucho-related family of co-repressors.
          statement: Six3 does not bind Eya; it represses via Groucho-related corepressors.
          supporting_text: Six3 does not interact with any known member of the Eya family.
  - order: 3
    role: EYA coactivator-phosphatase
    node:
      id: eya_cofactor
      label: Eyes absent transcriptional coactivator-phosphatase
      module_type: REGULATORY_STEP
      description: >-
        Nuclear EYA cofactor recruited by So/SIX1-2 proteins as a transcriptional coactivator. EYA is
        also a HAD-family protein tyrosine phosphatase; in mammalian Six1-Dach-Eya complexes the phosphatase
        was reported to switch repression to activation, but in Drosophila the phosphatase is dispensable
        for normal eye development.
      annotons:
      - id: eya_coactivator
        label: EYA transcriptional coactivator
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Eyes absent family
            term:
              id: PANTHER:PTHR10190
              label: EYES ABSENT
            representative_members:
            - preferred_term: eya (Drosophila eyes absent)
              term:
                id: UniProtKB:Q05201
                label: Protein phosphatase eya
            - preferred_term: EYA1 (human)
              term:
                id: UniProtKB:Q99502
                label: Protein phosphatase EYA1
        function:
          preferred_term: transcription coactivator activity
          term:
            id: GO:0003713
            label: transcription coactivator activity
        processes:
        - preferred_term: eye development
          term:
            id: GO:0001654
            label: eye development
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: >-
          Lacks DNA-binding activity and is brought to target genes by SIX; recruits coactivators to convert
          Six1-Dach repression into activation.
        evidence:
        - source_id: PMID:14628042
          title: >-
            Eya protein phosphatase activity regulates Six1-Dach-Eya transcriptional effects in mammalian
            organogenesis.
          statement: >-
            Eya phosphatase function switches Six1-Dach from repression to activation through co-activator
            recruitment.
          supporting_text: >-
            The phosphatase function of Eya switches the function of Six1-Dach from repression to activation,
            causing transcriptional activation through recruitment of co-activators.
      - id: eya_phosphatase
        label: EYA protein tyrosine phosphatase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Eyes absent family
            term:
              id: PANTHER:PTHR10190
              label: EYES ABSENT
            representative_members:
            - preferred_term: eya (Drosophila eyes absent)
              term:
                id: UniProtKB:Q05201
                label: Protein phosphatase eya
            - preferred_term: EYA1 (human)
              term:
                id: UniProtKB:Q99502
                label: Protein phosphatase EYA1
        function:
          preferred_term: protein tyrosine phosphatase activity
          term:
            id: GO:0004725
            label: protein tyrosine phosphatase activity
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: >-
          Intrinsic HAD-family protein tyrosine phosphatase activity. Its developmental role is contested:
          transgene assays implicated the active site in eye specification, whereas genomic-rescue alleles
          lacking catalytic residues show it is not required for normal eye development or survival in
          Drosophila. Kept as a conserved activity of the node, not as an eye-specification step.
        evidence:
        - source_id: PMID:14628053
          title: The transcription factor Eyes absent is a protein tyrosine phosphatase.
          statement: Eya phosphatase active-site mutations compromise eye specification in Drosophila.
          supporting_text: >-
            mutations that disrupt the phosphatase active site severely compromise the ability of Eyes
            absent to promote eye specification and development in Drosophila
        - source_id: PMID:23554934
          title: Eyes absent tyrosine phosphatase activity is not required for Drosophila development
            or survival.
          statement: Genomic-rescue phosphatase-dead eya supports normal eye development.
          supporting_text: >-
            We conclude that the tyrosine phosphatase activity of Eya is not required for normal eye development
            or survival in Drosophila.
  - order: 4
    role: Dachshund cofactor
    node:
      id: dach_cofactor
      label: Dachshund nuclear cofactor
      module_type: REGULATORY_STEP
      description: >-
        Ski/Sno-related nuclear cofactor that complexes with EYA and cross-activates Pax6 and Eya expression.
      annotons:
      - id: dach_coregulator
        label: Dachshund transcription coregulator
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Dachshund family
            term:
              id: PANTHER:PTHR12577
              label: DACHSHUND
            representative_members:
            - preferred_term: dac (Drosophila dachshund; unreviewed entry)
              term:
                id: UniProtKB:Q8IP19
                label: Dachshund, isoform B
            - preferred_term: DACH1 (human)
              term:
                id: UniProtKB:Q9UI36
                label: Dachshund homolog 1
        function:
          preferred_term: transcription coregulator activity
          term:
            id: GO:0003712
            label: transcription coregulator activity
        processes:
        - preferred_term: eye development
          term:
            id: GO:0001654
            label: eye development
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: >-
          Binds EYA through conserved domains and acts synergistically with it; in the Six1-Dach-Eya complex
          it acts as a repressor that EYA phosphatase activity converts to activation.
        evidence:
        - source_id: PMID:9428513
          title: >-
            Dachshund and eyes absent proteins form a complex and function synergistically to induce ectopic
            eye development in Drosophila.
          statement: Dachshund and Eya physically interact and synergize in ectopic retinal induction.
          supporting_text: the Dachshund and Eyes Absent proteins can physically interact through conserved
            domains
        - source_id: PMID:9006066
          title: Ectopic eye development in Drosophila induced by directed dachshund expression.
          statement: Targeted dachshund expression is sufficient to induce ectopic retina.
          supporting_text: >-
            targeted expression of dachshund is sufficient to direct ectopic retinal development in a
            variety of tissues
  connections:
  - source: pax6_selector
    target: six_factor
    connection_type: POSITIVELY_REGULATES
    description: >-
      Pax6 (Ey) directly activates the eye-specific enhancer of sine oculis and is required for its expression.
    evidence:
    - source_id: PMID:10207149
      title: >-
        Direct regulatory interaction of the eyeless protein with an eye-specific enhancer in the sine
        oculis gene during eye induction in Drosophila.
      statement: Ey binds and activates an eye enhancer in the so intron.
      supporting_text: >-
        the EY protein activates transcription of sine oculis by direct interaction with an eye-specific
        enhancer in the long intron of the so gene
  - source: pax6_selector
    target: eya_cofactor
    connection_type: POSITIVELY_REGULATES
    description: Eyeless is required for and induces eyes absent expression in the eye disc.
    evidence:
    - source_id: PMID:9584118
      title: >-
        Eyeless initiates the expression of both sine oculis and eyes absent during Drosophila compound
        eye development.
      statement: ey acts upstream of so and eya.
      supporting_text: >-
        eyeless is expressed earlier than and is required for the expression of sine oculis and eyes absent,
        but not vice versa
  - source: eya_cofactor
    target: six_factor
    connection_type: POSITIVELY_REGULATES
    description: >-
      EYA is recruited by So/SIX1-2 and acts as their coactivator. In mammalian Six1-Dach-Eya complexes
      its phosphatase was reported to switch Six1-Dach from repression to activation; this phosphatase
      dependence is not seen in Drosophila eye development. Does not apply to SIX3/6, which do not bind
      Eya.
    evidence:
    - source_id: PMID:14628042
      title: >-
        Eya protein phosphatase activity regulates Six1-Dach-Eya transcriptional effects in mammalian
        organogenesis.
      statement: Eya switches Six1-Dach from repression to activation.
      supporting_text: The phosphatase function of Eya switches the function of Six1-Dach from repression
        to activation
  - source: eya_cofactor
    target: dach_cofactor
    connection_type: POSITIVELY_REGULATES
    description: eyes absent and dachshund positively regulate each other's expression.
    evidence:
    - source_id: PMID:9428513
      title: >-
        Dachshund and eyes absent proteins form a complex and function synergistically to induce ectopic
        eye development in Drosophila.
      statement: dac and eya cross-activate.
      supporting_text: >-
        the dachshund and eyes absent genes act synergistically to induce ectopic retinal development
        and positively regulate the expression of each other
  - source: dach_cofactor
    target: eya_cofactor
    connection_type: POSITIVELY_REGULATES
    description: Reciprocal arm of the dac/eya positive feedback loop.
    evidence:
    - source_id: PMID:9428513
      title: >-
        Dachshund and eyes absent proteins form a complex and function synergistically to induce ectopic
        eye development in Drosophila.
      statement: dac and eya cross-activate.
      supporting_text: >-
        the dachshund and eyes absent genes act synergistically to induce ectopic retinal development
        and positively regulate the expression of each other
  - source: dach_cofactor
    target: pax6_selector
    connection_type: POSITIVELY_REGULATES
    description: dachshund and eyeless induce each other's expression, closing a feedback loop onto the
      selector.
    evidence:
    - source_id: PMID:9006066
      title: Ectopic eye development in Drosophila induced by directed dachshund expression.
      statement: dac and ey induce each other's expression.
      supporting_text: dachshund and eyeless induce the expression of each other
