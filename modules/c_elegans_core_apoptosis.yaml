            evidence:
              - source_id: PMID:8654923
                title: The Caenorhabditis elegans cell-death protein CED-3 is a cysteine protease with substrate specificities similar to those of the human CPP32 protease.
                statement: CED-3 is activated by proteolysis, and its protease activity is needed to kill cells.
                supporting_text: >-
                  We show that the full-length CED-3 protein undergoes
                  proteolytic activation to generate a CED-3 cysteine protease
                  and that CED-3 protease activity is required for killing
                  cells by programmed cell death in C. elegans.
              - source_id: PMID:20223951
                title: Caspase-dependent conversion of Dicer ribonuclease into a death-promoting deoxyribonuclease.
                statement: CED-3 cleaves DCR-1 to generate a death-promoting deoxyribonuclease.
                supporting_text: >-
                  DCR-1 was cleaved by the CED-3 caspase to generate a
                  C-terminal fragment with deoxyribonuclease activity
              - source_id: PMID:24225442
                title: Caspase-mediated activation of Caenorhabditis elegans CED-8 promotes apoptosis and phosphatidylserine externalization.
                statement: >-
                  CED-3 cleavage of CED-8 links caspase activation to the
                  phosphatidylserine exposure that triggers corpse engulfment.
                supporting_text: >-
                  Our finding identifies a crucial link between caspase
                  activation and PS externalization, which triggers
                  phagocytosis of apoptotic cells.
