id: MODULE:c_elegans_core_apoptosis
title: Core programmed cell death machinery in Caenorhabditis elegans
description: >-
  Most somatic and germline apoptotic deaths in Caenorhabditis elegans are
  initiated by four proteins acting in a linear pathway. In living cells the
  BCL2-family protein CED-9 sits on mitochondria and binds an asymmetric dimer
  of the Apaf-1-like adaptor CED-4, holding it in an inactive state. A death
  signal raises the level of the BH3-only protein EGL-1, whose BH3 helix binds
  a hydrophobic groove on CED-9 and remodels it so that the CED-4 dimer is
  released. Free CED-4 dimers assemble into an ATP-bound octameric apoptosome
  that relocates to the nuclear periphery, recruits two molecules of the CED-3
  caspase zymogen into its central hutch and drives their autocatalytic
  maturation. Active CED-3 then cleaves execution substrates such as DCR-1 and
  CED-8, which promote chromosome fragmentation and phosphatidylserine exposure
  for corpse engulfment. In the adult germline, DNA damage feeds into the same
  machinery through the p53-family transcription factor CEP-1, which induces
  transcription of egl-1 and of a second BH3-only gene, ced-13. CED-13 can
  also bind CED-9 and release CED-4, but its loss has only a small effect on
  DNA damage-induced germline death, so EGL-1 remains the main trigger on
  that route as well. Unlike the
  mammalian intrinsic pathway, the worm pathway has no known requirement for
  mitochondrial outer membrane permeabilization or cytochrome c release; CED-9
  inhibits by direct sequestration of CED-4 rather than by controlling a pore.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:16208361
    title: Structure of the CED-4-CED-9 complex provides insights into programmed cell death in Caenorhabditis elegans.
    statement: >-
      Defines the four-protein core and its order: CED-9 constitutively
      inhibits CED-4 until EGL-1 releases it, and CED-4 is required to
      activate CED-3. The pathway was reconstituted from purified proteins.
    supporting_text: >-
      Activation of the cell-killing protease CED-3 requires CED-4. However,
      CED-4 is constitutively inhibited by CED-9 until its release by EGL-1.
  - source_id: PMID:24065769
    title: Mechanistic insights into CED-4-mediated activation of CED-3.
    statement: >-
      The four genes act in a linear pathway that controls the onset of
      programmed cell death.
    supporting_text: >-
      Four genes—egl-1, ced-9, ced-4, and ced-3—act in a linear fashion to
      control the onset of PCD in C. elegans.
  - source_id: PMID:10688797
    title: Translocation of C. elegans CED-4 to nuclear membranes during programmed cell death.
    statement: >-
      Endogenous CED-9 and CED-4 are on mitochondria in surviving cells, and
      CED-4 becomes perinuclear in dying cells before caspase activation.
    supporting_text: >-
      Endogenous CED-9 and CED-4 proteins localized to mitochondria in
      wild-type embryos, in which most cells survive.
  - source_id: PMID:11696333
    title: The C. elegans homolog of the p53 tumor suppressor is required for DNA damage-induced apoptosis.
    statement: >-
      CEP-1 is required for DNA damage-induced germline apoptosis but not for
      developmental or physiological germ cell death, so it is a conditional
      input rather than a core component.
    supporting_text: >-
      However,cep-1 RNAi does not affect programmed cell death occurring during
      worm development and physiological (radiation-independent) germ cell
      death.
  - source_id: file:modules/bcl2_family_momp_control.yaml
    title: BCL2-family MOMP control module
    statement: >-
      Mammalian BCL2-family module (BAX/BAK pore, cytochrome c release). It is
      a comparator, not a template, for the CED-9/EGL-1 step here.
  - source_id: file:modules/intrinsic_apoptotic_signaling.yaml
    title: Intrinsic apoptotic signaling pathway module
    statement: >-
      Mammalian CYCS/APAF1/CASP9 apoptosome module. CED-4 is the Apaf-1-like
      counterpart but needs no cytochrome c.
  - source_id: file:modules/apoptotic_execution_phase.yaml
    title: Apoptotic execution phase module
    statement: >-
      Mammalian effector-caspase execution module. In the worm, CED-3 is both
      the initiator and the main executioner caspase.
  - source_id: file:modules/phagocytic_engulfment.yaml
    title: Phagocytic engulfment module
    statement: >-
      Downstream removal of cell corpses by the CED-1/CED-6/CED-7 and
      CED-2/CED-5/CED-12/CED-10 routes, which is outside this boundary.
  - source_id: file:genes/worm/ced-9/ced-9-ai-review.yaml
    title: worm ced-9 gene review
    statement: >-
      Centers CED-9 on mitochondrial sequestration of CED-4 and EGL-1
      BH3-domain binding, and removes PAINT transfers for cytochrome c release
      and channel activity as mammalian leak-through.
  - source_id: file:genes/worm/egl-1/egl-1-ai-review.yaml
    title: worm egl-1 gene review
    statement: >-
      Centers EGL-1 on BH3-mediated inhibition of CED-9 and proposes the new
      term pro-survival BCL2 family protein inhibitor activity, because GO
      lacks a ligand-side BH3 inhibitor term.
notes: >-
  Boundary. This is a concrete C. elegans module for the decision and
  activation steps of apoptosis: BH3-only trigger, BCL2-family restraint,
  adaptor oligomerization and caspase activation, plus caspase cleavage of
  execution substrates as the module output. Corpse recognition and engulfment
  are a separate module (MODULE:phagocytic_engulfment); CED-3 cleavage of CED-8
  is the hand-off point, since acCED-8 promotes phosphatidylserine exposure
  that engulfing cells recognize. CEP-1 is modeled as an optional upstream part
  because it is needed only for DNA damage-induced germline death.
  Developmental transcriptional control of egl-1 (for example TRA-1 in the HSN
  neurons, or CES-1/CES-2 in the NSM sister cells) is cell-type specific
  upstream regulation and is not modeled here.

  Systemic inputs. Germline DNA-damage apoptosis is also modulated from
  outside the germ cell. The intestinal PMK-1/p38 target SYSM-1 (gene review
  genes/worm/sysm-1, UniProtKB:Q22714) is a secreted ShKT-domain protein that
  reaches the germline and is required for full DNA damage-induced germ cell
  apoptosis. It acts in parallel to or downstream of CEP-1, since egl-1 and
  ced-13 are still induced in pmk-1 mutants (PMID:35121747). Its molecular
  activity is unknown, so it is recorded here as a systemic modulator and not
  modeled as a part of the core machinery.

  Relation to the mammalian modules. MODULE:bcl2_family_momp_control and
  MODULE:intrinsic_apoptotic_signaling describe BAX/BAK-mediated outer
  membrane permeabilization, cytochrome c release and the CYCS/APAF1/CASP9
  apoptosome. None of those steps is part of this module. C. elegans has no
  BAX/BAK-type effector in the core pathway, and CED-4 oligomerizes without
  cytochrome c once CED-9 releases it. The ced-9 gene review removed
  BCL2-family PAINT transfers for cytochrome c release and channel activity on
  these grounds. Mitochondria matter here as the site where CED-9 holds CED-4,
  not as a source of released apoptogenic factors. CED-3 combines the
  initiator role of CASP9 and the executioner role of CASP3/CASP7 in the
  mammalian MODULE:apoptotic_execution_phase.

  Members and terms. All six members have completed gene reviews. EGL-1 has
  no fitting GO molecular function: GO:0051434 BH3 domain binding describes
  the groove-side receptor (CED-9), not the BH3 ligand. The EGL-1 annoton
  therefore uses the free-text proposed term "pro-survival BCL2 family protein
  inhibitor activity" from the egl-1 review, as in
  MODULE:bcl2_family_momp_control for the mammalian BH3-only sensitizers.
  CED-9 carries two activities, CED-4 sequestration (GO:0140311) and EGL-1
  BH3 binding (GO:0051434), matching its two core functions. CED-13 is a
  second CEP-1-induced BH3-only protein that binds CED-9. Its gene review
  gives it the same proposed molecular function as EGL-1, and it is modeled
  as a second annoton in the optional CEP-1 DNA-damage part rather than in
  the main trigger step. The weighting is deliberate: ced-13 overexpression
  kills somatic cells and its BH3 peptide displaces CED-4 from CED-9, but
  loss of ced-13 has only limited effects, confined to DNA damage-induced
  germline apoptosis, so it is a minor and largely redundant trigger next to
  EGL-1. Two CED-13 roles outside this boundary are not modeled:
  physiological germline death in cisd mutants, which depends on CED-13 but
  not EGL-1 (PMID:29666474), and a non-apoptotic pro-longevity response to
  mitochondrial ROS that uses CED-13, CED-9, CED-4 and CED-3 but not EGL-1
  (PMID:24813612). Non-core branches recorded in the gene reviews (local
  EGL-1/CED-9/CED-4/CED-3 activity in synapse pruning, CED-9 roles in
  mitochondrial dynamics, CED-3 cleavage of heterochronic regulators) are
  outside this boundary. No production GO-CAM in gocams/index.tsv contains
  these proteins.
module:
  id: c_elegans_core_apoptosis
  label: Core CED/EGL-1 apoptosis pathway in C. elegans
  module_type: SIGNALING_PATHWAY
  description: >-
    Linear EGL-1 -| CED-9 -| CED-4 -> CED-3 pathway that initiates and
    executes apoptosis, with an optional CEP-1 (p53) DNA-damage input to
    egl-1 transcription in the germline.
  concepts:
    - preferred_term: apoptotic signaling pathway
      term:
        id: GO:0097190
        label: apoptotic signaling pathway
      description: >-
        The signaling steps from BH3-only induction to CED-3 activation. The
        execution-phase output is placed on the CED-3 annoton.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
  parts:
    - order: 1
      role: DNA damage-induced transcription of BH3-only genes
      optional: true
      node:
        id: cep1_dna_damage_input
        label: CEP-1 transcriptional induction of egl-1 and ced-13
        module_type: REGULATORY_STEP
        description: >-
          In the adult germline, ionizing radiation and other genotoxic stress
          activate the checkpoint machinery (including HUS-1), and the
          p53-family transcription factor CEP-1 induces egl-1 and ced-13. The
          two BH3-only proteins then act on CED-9; EGL-1 (part 2) is the main
          trigger and CED-13, modeled here, is a minor one. CEP-1 is not needed for
          developmental somatic deaths or for physiological germ cell death.
        annotons:
          - id: cep1_transcription_activator
            label: CEP-1 p53-family transcription activator
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CEP-1
                term:
                  id: UniProtKB:Q20646
                  label: Transcription factor cep-1
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
              targets:
                - preferred_term: egl-1 gene
                - preferred_term: ced-13 gene
            processes:
              - preferred_term: intrinsic apoptotic signaling pathway in response to DNA damage by p53 class mediator
                term:
                  id: GO:0042771
                  label: intrinsic apoptotic signaling pathway in response to DNA damage by p53 class mediator
              - preferred_term: positive regulation of transcription by RNA polymerase II
                term:
                  id: GO:0045944
                  label: positive regulation of transcription by RNA polymerase II
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Germline DNA-damage input. CEP-1 activates transcription of the
              BH3-only genes egl-1 and ced-13, which feeds genotoxic stress
              into the core pathway.
            evidence:
              - source_id: PMID:11696333
                title: The C. elegans homolog of the p53 tumor suppressor is required for DNA damage-induced apoptosis.
                statement: CEP-1 is a transcription factor required for DNA damage-induced germline apoptosis.
                supporting_text: >-
                  CEP-1 acts as a transcription factor and is able to activate
                  a transcriptional reporter containing consensus human p53
                  binding sites.
              - source_id: PMID:12445383
                title: Caenorhabditis elegans HUS-1 is a DNA damage checkpoint protein required for genome stability and EGL-1-mediated apoptosis.
                statement: DNA damage induces egl-1 expression in a hus-1- and cep-1-dependent way.
                supporting_text: >-
                  we show that DNA damage increases expression of the
                  proapoptotic gene egl-1, a response that requires hus-1 and
                  the p53 homolog cep-1.
              - source_id: PMID:15605074
                title: C. elegans ced-13 can promote apoptosis and is induced in response to DNA damage.
                statement: >-
                  ced-13 encodes a second BH3-only protein, induced by DNA
                  damage in a cep-1-dependent way, that binds CED-9.
                supporting_text: >-
                  We show that ced-13 mRNA accumulates following DNA damage,
                  and that this accumulation is dependent on an intact C.
                  elegans cep-1/p53 gene.
              - source_id: PMID:18627611
                title: Transcriptional profiling in C. elegans suggests DNA damage dependent apoptosis as an ancient function of the p53 family.
                statement: egl-1 and ced-13 are among very few cep-1-dependent IR-induced genes.
                supporting_text: >-
                  Among the IR-induced genes only three are dependent on cep-1,
                  namely egl-1, ced-13 and a novel C. elegans specific gene
          - id: ced13_ced9_inhibitor
            label: CED-13 BH3-only CED-9 inhibitor (minor DNA-damage trigger)
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CED-13
                term:
                  id: UniProtKB:Q9TY06
                  label: Secreted protein
            function:
              preferred_term: pro-survival BCL2 family protein inhibitor activity
              description: >-
                Same proposed molecular function as EGL-1 (ced-13 and egl-1
                reviews). The CED-13 BH3 helix binds CED-9 and displaces CED-4.
              targets:
                - preferred_term: CED-9
            processes:
              - preferred_term: intrinsic apoptotic signaling pathway in response to DNA damage by p53 class mediator
                term:
                  id: GO:0042771
                  label: intrinsic apoptotic signaling pathway in response to DNA damage by p53 class mediator
              - preferred_term: positive regulation of apoptotic process
                term:
                  id: GO:0043065
                  label: positive regulation of apoptotic process
            role_description: >-
              Second, minor BH3-only trigger on the CEP-1 route. CEP-1 induces
              ced-13 after DNA damage, and CED-13 can release CED-4 from
              CED-9, but ced-13 loss has only a limited effect on
              DNA damage-induced germline apoptosis. EGL-1 carries most of the
              load, and CED-13 is best seen as a partly redundant contributor.
            evidence:
              - source_id: PMID:15605074
                title: C. elegans ced-13 can promote apoptosis and is induced in response to DNA damage.
                statement: CED-13 binds CED-9 and kills somatic cells through the core pathway when overexpressed.
                supporting_text: >-
                  overexpression of ced-13 in somatic cells leads to the death
                  of cells that normally survive, and this death requires the
                  core apoptotic pathway of C. elegans.
              - source_id: PMID:16167070
                title: 'CED-4 forms a 2 : 2 heterotetrameric complex with CED-9 until specifically displaced by EGL-1 or CED-13.'
                statement: The CED-13 BH3 peptide displaces CED-4 from CED-9, as the EGL-1 BH3 peptide does.
                supporting_text: >-
                  synthetic peptides corresponding to the BH3 domains of worm
                  BH3-only proteins (EGL-1, CED-13) dissociate CED-4 from CED-9
              - source_id: PMID:24813612
                title: The intrinsic apoptosis pathway mediates the pro-longevity response to mitochondrial ROS in C. elegans.
                statement: >-
                  Weighting: ced-13 loss has only limited effects on apoptosis,
                  restricted to DNA damage-induced germline death.
                supporting_text: >-
                  However, loss of CED-13 has very limited effects and only on
                  DNA damage-induced germline apoptosis.
    - order: 2
      role: BH3-only trigger that neutralizes CED-9
      node:
        id: egl1_bh3_trigger
        label: EGL-1 BH3-mediated inhibition of CED-9
        module_type: MOLECULAR_FUNCTION
        description: >-
          EGL-1 is a small BH3-only protein whose transcription is the main
          point at which cell-fate signals commit a cell to die. The C-terminal
          half of EGL-1 forms an extended BH3 helix that binds a hydrophobic
          groove on CED-9 and induces structural rearrangements that release
          CED-4.
        annotons:
          - id: egl1_ced9_inhibitor
            label: EGL-1 BH3-only CED-9 inhibitor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EGL-1
                term:
                  id: UniProtKB:O61667
                  label: Programmed cell death activator egl-1
            function:
              preferred_term: pro-survival BCL2 family protein inhibitor activity
              description: >-
                Proposed molecular function (egl-1 review) for BH3-ligand-side
                inhibition of a pro-survival BCL2-family protein. GO has no
                such term; GO:0051434 BH3 domain binding is the receptor-side
                activity and belongs on CED-9.
              targets:
                - preferred_term: CED-9
            processes:
              - preferred_term: apoptotic signaling pathway
                term:
                  id: GO:0097190
                  label: apoptotic signaling pathway
              - preferred_term: positive regulation of apoptotic process
                term:
                  id: GO:0043065
                  label: positive regulation of apoptotic process
            locations:
              - preferred_term: mitochondrion
                term:
                  id: GO:0005739
                  label: mitochondrion
            role_description: >-
              Binds CED-9 through its BH3 helix and displaces CED-4 from the
              CED-4/CED-9 complex.
            evidence:
              - source_id: PMID:9604928
                title: The C. elegans protein EGL-1 is required for programmed cell death and interacts with the Bcl-2-like protein CED-9.
                statement: >-
                  egl-1 is required for most somatic deaths, encodes a BH3-only
                  protein and binds CED-9.
                supporting_text: >-
                  We propose that EGL-1 activates programmed cell death by
                  binding to and directly inhibiting the activity of CED-9,
                  perhaps by releasing the cell death activator CED-4 from a
                  CED-9/CED-4-containing protein complex.
              - source_id: PMID:15383288
                title: Structural, biochemical, and functional analyses of CED-9 recognition by the proapoptotic proteins EGL-1 and CED-4.
                statement: >-
                  EGL-1 interface mutants cannot bind CED-9, release CED-4 or
                  kill cells.
                supporting_text: >-
                  EGL-1 interface mutants failed to bind to CED-9 or to release
                  CED-4 from the CED-4/CED-9 complex, and were unable to induce
                  cell death in vivo.
    - order: 3
      role: BCL2-family restraint of CED-4 on mitochondria
      node:
        id: ced9_sequestration
        label: CED-9 sequestration of CED-4
        module_type: MOLECULAR_FUNCTION
        description: >-
          One CED-9 molecule binds an asymmetric CED-4 dimer on the
          mitochondrial outer membrane and blocks CED-4 from activating CED-3.
          The CED-4-binding surface of CED-9 is distinct from its EGL-1-binding
          groove, so EGL-1 releases CED-4 by an allosteric change rather than
          by direct competition.
        annotons:
          - id: ced9_ced4_sequestering
            label: CED-9 sequestering CED-4
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CED-9
                term:
                  id: UniProtKB:P41958
                  label: Apoptosis regulator ced-9
            function:
              preferred_term: protein sequestering activity
              term:
                id: GO:0140311
                label: protein sequestering activity
              targets:
                - preferred_term: CED-4 asymmetric dimer
            processes:
              - preferred_term: negative regulation of apoptotic process
                term:
                  id: GO:0043066
                  label: negative regulation of apoptotic process
            locations:
              - preferred_term: mitochondrial outer membrane
                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
            role_description: >-
              Holds CED-4 inactive on mitochondria in cells that survive.
            evidence:
              - source_id: PMID:9024666
                title: Interaction between the C. elegans cell-death regulators CED-9 and CED-4.
                statement: >-
                  CED-9 binds CED-4, and CED-9 loss-of-function mutations
                  disrupt the binding.
                supporting_text: >-
                  Mutations that reduce or eliminate CED-9 activity also
                  disrupt its ability to bind CED-4, suggesting that this
                  interaction is important for CED-9 function.
              - source_id: PMID:16208361
                title: Structure of the CED-4-CED-9 complex provides insights into programmed cell death in Caenorhabditis elegans.
                statement: CED-9 binds one molecule of an asymmetric CED-4 dimer and so blocks CED-3 activation.
                supporting_text: >-
                  One molecule of CED-9 binds to an asymmetric dimer of CED-4,
                  but specifically recognizes only one of the two CED-4
                  molecules. This specific interaction prevents CED-4 from
                  activating CED-3.
          - id: ced9_bh3_receptor
            label: CED-9 binding of the EGL-1 BH3 helix
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CED-9
                term:
                  id: UniProtKB:P41958
                  label: Apoptosis regulator ced-9
            function:
              preferred_term: BH3 domain binding
              term:
                id: GO:0051434
                label: BH3 domain binding
              targets:
                - preferred_term: EGL-1 BH3 helix
            processes:
              - preferred_term: negative regulation of apoptotic process
                term:
                  id: GO:0043066
                  label: negative regulation of apoptotic process
            locations:
              - preferred_term: mitochondrial outer membrane
                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
            role_description: >-
              Groove-side receptor for the EGL-1 BH3 helix. Binding changes the
              conformation of CED-9 and releases the CED-4 dimer.
            evidence:
              - source_id: PMID:16208361
                title: Structure of the CED-4-CED-9 complex provides insights into programmed cell death in Caenorhabditis elegans.
                statement: EGL-1 binding changes CED-9 conformation and releases the CED-4 dimer.
                supporting_text: >-
                  EGL-1 binding induces pronounced conformational changes in
                  CED-9 that result in the dissociation of the CED-4 dimer from
                  CED-9.
              - source_id: PMID:15383288
                title: Structural, biochemical, and functional analyses of CED-9 recognition by the proapoptotic proteins EGL-1 and CED-4.
                statement: The CED-4-binding surface on CED-9 differs from the EGL-1-binding surface.
                supporting_text: >-
                  A surface patch on CED-9, different from that required for
                  binding to EGL-1, was identified to be responsible for
                  binding to CED-4.
    - order: 4
      role: CED-4 apoptosome assembly and CED-3 zymogen activation
      node:
        id: ced4_apoptosome
        label: CED-4 apoptosome
        module_type: MOLECULAR_FUNCTION
        description: >-
          Released CED-4 dimers further oligomerize into a funnel-shaped
          octamer (a tetramer of asymmetric dimers) through the NB-ARC AAA+
          ATPase module. The octamer binds two CED-3 zymogen molecules through
          the CED-3 L2' loop inside its hutch, forcing their dimerization and
          autocatalytic maturation, and it also stimulates the activity of
          mature CED-3. CED-4 moves from mitochondria to the nuclear periphery
          in dying cells; this does not need ced-3.
        annotons:
          - id: ced4_caspase_activator
            label: CED-4 apoptosome caspase activator
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CED-4
                term:
                  id: UniProtKB:P30429
                  label: Cell death protein 4
            function:
              preferred_term: cysteine-type endopeptidase activator activity involved in apoptotic process
              term:
                id: GO:0008656
                label: cysteine-type endopeptidase activator activity involved in apoptotic process
              cofactors:
                - preferred_term: ATP
              targets:
                - preferred_term: CED-3 zymogen
            processes:
              - preferred_term: apoptotic signaling pathway
                term:
                  id: GO:0097190
                  label: apoptotic signaling pathway
            locations:
              - preferred_term: mitochondrion
                term:
                  id: GO:0005739
                  label: mitochondrion
              - preferred_term: nuclear membrane
                term:
                  id: GO:0031965
                  label: nuclear membrane
            role_description: >-
              Octameric adaptor that recruits and activates the CED-3 zymogen
              once it is released from CED-9.
            evidence:
              - source_id: PMID:20434985
                title: Crystal structure of the Caenorhabditis elegans apoptosome reveals an octameric assembly of CED-4.
                statement: >-
                  The CED-4 apoptosome is an octamer that binds two mature
                  CED-3 molecules and strongly stimulates their protease
                  activity.
                supporting_text: >-
                  The mature CED-3 protease is monomeric in solution and forms
                  an active holoenzyme with the CED-4 apoptosome, within which
                  the protease activity of CED-3 is markedly stimulated.
              - source_id: PMID:24065769
                title: Mechanistic insights into CED-4-mediated activation of CED-3.
                statement: >-
                  CED-4 binds the CED-3 L2' loop, and a CED-4 mutant that
                  cannot bind it fails to stimulate CED-3 zymogen processing.
                supporting_text: >-
                  In contrast, the mutant CED-4 (A394W), which exhibited nearly
                  crippled interaction with CED-3, failed to stimulate the
                  autocatalytic processing of CED-3
              - source_id: PMID:10688797
                title: Translocation of C. elegans CED-4 to nuclear membranes during programmed cell death.
                statement: >-
                  EGL-1-induced perinuclear translocation of CED-4 is blocked
                  by ced-9(gf) but does not need ced-3.
                supporting_text: >-
                  CED-4 translocation induced by the cell-death activator EGL-1
                  was blocked by a gain-of-function mutation in ced-9 but was
                  not dependent on ced-3 function
    - order: 5
      role: caspase activation and cleavage of execution substrates
      node:
        id: ced3_caspase
        label: CED-3 caspase activation and execution
        module_type: MOLECULAR_FUNCTION
        description: >-
          CED-3 is made as an inactive zymogen and is matured by
          apoptosome-stimulated autoprocessing. Active CED-3 is an Asp-directed
          cysteine protease with substrate preferences resembling mammalian
          CASP3. Its substrates include DCR-1, whose C-terminal fragment
          becomes a deoxyribonuclease that nicks chromosomes, and CED-8, whose
          cleavage product promotes phosphatidylserine exposure on the dying
          cell.
