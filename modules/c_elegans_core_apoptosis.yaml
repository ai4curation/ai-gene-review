knowledge_gaps:
  - gap_statement: >-
      The functional role of CED-4 relocation from mitochondria to the nuclear
      periphery is not known. It is unclear whether perinuclear localization
      is needed for apoptosome assembly or CED-3 activation, or follows from
      them.
    boundary: >-
      Relocation is EGL-1-induced, blocked by ced-9(gf) and independent of
      ced-3, so it lies between CED-4 release and CED-3 activation. The
      apoptosome has been reconstituted in vitro without any membrane.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether the nuclear envelope is an organizing platform for
      the worm apoptosome or only a destination.
    resolution: >-
      Tether CED-4 to mitochondria or to the nuclear envelope in vivo and test
      CED-3 activation and cell death in egl-1-induced deaths.
    provenance:
      - reference_id: PMID:10688797
        supporting_text: >-
          Thus, a change in the subcellular localization of CED-4 may drive
          programmed cell death.
  - gap_statement: >-
      The relative contributions of EGL-1 and CED-13 to CEP-1-dependent
      germline apoptosis after DNA damage, and whether CED-13 acts on CED-9
      in the same way as EGL-1, are not fully resolved.
    boundary: >-
      CED-13 is a CEP-1-induced BH3-only protein that binds CED-9, displaces
      CED-4 in vitro and kills somatic cells when overexpressed. It is modeled
      as a minor annoton in the CEP-1 part. Its loss has only limited effects
      on DNA damage-induced germline apoptosis, but whether it adds to EGL-1
      in a quantitative or tissue-restricted way is not known.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Bears on whether the DNA-damage input uses one or two BH3-only triggers
      in parallel, as p53 does with PUMA and NOXA in mammals.
    resolution: >-
      Quantify germline apoptosis after irradiation in egl-1, ced-13 and
      double mutants across doses, and compare CED-13 and EGL-1 affinity for
      CED-9 and CED-4 displacement with full-length proteins.
    provenance:
      - reference_id: PMID:15605074
        supporting_text: >-
          Our studies suggest that in addition to the BH3-only protein EGL-1,
          CED-13 might also promote apoptosis in the C. elegans germ line in
          response to p53 activation.
      - reference_id: PMID:24813612
        supporting_text: >-
          However, loss of CED-13 has very limited effects and only on DNA
          damage-induced germline apoptosis.
