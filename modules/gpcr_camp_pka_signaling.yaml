    - order: 3
      role: cAMP second messenger generation
      node:
        id: adenylyl_cyclase_activation
        label: Adenylyl cyclase produces cAMP
        module_type: REACTION
        description: G alpha subunits regulate membrane adenylyl cyclase conversion of ATP to cAMP.
        variant_sets:
          - id: adenylyl_cyclase_regulatory_class
            label: Adenylyl cyclase regulatory class
            axis: regulatory class of the adenylyl cyclase isoform
            selection: ONE_OR_MORE
            evidence:
              - source_id: PMID:8119955
                statement: >-
                  AC5 and AC6 are the isoforms most sensitive to G alpha i
                  inhibition; AC1 is also inhibited, less sensitively and
                  additionally by G(o) alpha, while AC2 is immune. The
                  Gi-inhibited variant is represented by AC5/6.
                supporting_text: >-
                  Types V and VI adenylyl cyclase are most sensitive to
                  inhibition by Gi alpha 1, Gi alpha 2, and Gi alpha 3; type I
                  adenylyl cyclase can be inhibited by these three Gi alpha
                  proteins and by G(o) alpha as well. Type II adenylyl cyclase
                  appears to be immune to inhibition by these proteins.
            variants:
              - id: gs_stimulated_adenylyl_cyclases
                label: Gs-stimulated transmembrane adenylyl cyclases
                module_type: REACTION
                annotons:
                  - id: gs_stimulated_adenylyl_cyclase
                    label: Gs-stimulated adenylyl cyclase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Gs-stimulated transmembrane adenylyl cyclases
                        term:
                          id: PANTHER:PTHR45627
                          label: ADENYLATE CYCLASE TYPE 1
                        representative_members:
