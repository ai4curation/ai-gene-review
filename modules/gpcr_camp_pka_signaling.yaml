    - order: 4
      role: PKA activation and transcriptional output
      node:
        id: pka_creb_output
        label: PKA activation and CREB phosphorylation
        module_type: REGULATORY_STEP
        description: >-
          cAMP binds PKA regulatory subunits, freeing catalytic subunits to
          phosphorylate substrates including CREB-family transcription factors.
          The holoenzyme activation and catalytic steps are included by reference
          to the fuller cAMP/PKA module; the CREB phosphorylation step is modelled
          here.
        parts:
          - order: 1
            role: cAMP-induced PKA holoenzyme dissociation
            node:
              id: pka_creb_holoenzyme_activation
              label: cAMP-induced dissociation of the PKA holoenzyme
              description: >-
                Included by reference to the PKA regulatory-subunit step of the
                fuller cAMP/PKA module (type I and type II holoenzymes).
              module_ref: camp_pka_signal_transduction#pka_holoenzyme_activation
          - order: 2
            role: PKA catalytic subunit phosphorylation of substrates
            node:
              id: pka_creb_catalytic_activity
              label: PKA catalytic subunit phosphorylation of substrates
              description: >-
                Included by reference to the PKA catalytic-subunit step of the
                fuller cAMP/PKA module (PRKACA, PRKACB, PRKACG).
              module_ref: camp_pka_signal_transduction#pka_catalytic_activity
          - order: 3
            role: PKA phosphorylation of CREB
            node:
              id: creb_phosphorylation
              label: PKA phosphorylates the CREB transcription factor
              module_type: REGULATORY_STEP
              description: >-
                Released PKA catalytic subunit phosphorylates CREB in the nucleus,
                the transcriptional output that the fuller cAMP/PKA module leaves out
                of scope.
              annotons:
                - id: pka_catalytic_subunit
                  label: PKA catalytic subunit
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: PRKACA
                      term:
                        id: UniProtKB:P17612
                        label: cAMP-dependent protein kinase catalytic subunit alpha
                  function:
                    preferred_term: cAMP-dependent protein kinase activity
                    term:
                      id: GO:0004691
                      label: cAMP-dependent protein kinase activity
                    targets:
                      - preferred_term: CREB1
                  role_description: cAMP-responsive kinase output of the pathway.
                - id: creb_transcription_factor
                  label: CREB transcriptional effector
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: CREB1
                      term:
                        id: UniProtKB:P16220
                        label: Cyclic AMP-responsive element-binding protein 1
                  function:
                    preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
                    term:
                      id: GO:0001228
                      label: DNA-binding transcription activator activity, RNA polymerase II-specific
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: Nuclear transcriptional effector phosphorylated by PKA.
        connections:
          - source: pka_creb_holoenzyme_activation
            target: pka_creb_catalytic_activity
            connection_type: POSITIVELY_REGULATES
            description: Released catalytic subunits become active kinases.
          - source: pka_creb_catalytic_activity
            target: creb_phosphorylation
            connection_type: CAUSES
            description: Free PKA catalytic subunit phosphorylates CREB.
  connections:
    - source: gs_gpcr_activation
      target: adenylyl_cyclase_activation
      connection_type: POSITIVELY_REGULATES
      description: G alpha s-GTP stimulates adenylyl cyclase.
    - source: gi_gpcr_inhibition
      target: gi_inhibited_adenylyl_cyclases
      connection_type: NEGATIVELY_REGULATES
      description: G alpha i-GTP inhibits Gi-sensitive membrane adenylyl cyclases.
    - source: adenylyl_cyclase_activation
      target: pka_creb_output
      connection_type: CAUSES
      description: cAMP generated by adenylyl cyclase activates PKA.
