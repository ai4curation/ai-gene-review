id: MODULE:gpcr_camp_pka_signaling
title: GPCR-cAMP-PKA signaling pathway module
description: >-
  A compact Gs-coupled GPCR signaling module. An agonist-occupied GPCR activates
  heterotrimeric Gs, G alpha s stimulates adenylyl cyclase, cAMP accumulates and
  activates PKA, and PKA phosphorylates cytosolic and nuclear substrates
  including CREB. The module is grounded in GO:0007188. ADRB2 is anchored to
  PAINT GPCR nodes; GNAS, PRKACA, and CREB1 are curated UniProt exemplars
  without PTN ancestry claims. The adenylyl cyclase step and the cAMP-PKA
  activation and catalysis steps are included by reference to the fuller
  camp_pka_signal_transduction module; the CREB phosphorylation step is
  modelled here.
status: DRAFT
evidence:
  - source_id: GO:0007188
    title: adenylate cyclase-modulating G protein-coupled receptor signaling pathway
    statement: The module is grounded in the GO biological process term for GPCR signaling through cAMP.
notes: >-
  Reconciled with modules/camp_pka_signal_transduction.yaml, the fuller cAMP/PKA
  cassette derived from RGD PW:0000543. This compact module keeps its three node
  ids because other modules point at them by module_ref: crh_receptor_signaling,
  beta_adrenergic_signaling and pth_receptor_signaling use adenylyl_cyclase_activation
  and pka_creb_output; glucagon_receptor_signaling and vasopressin_receptor_signaling
  use pka_creb_output; calcium_sensing_receptor_signaling and acetylcholine_signaling
  use adenylyl_cyclase_activation for the Gi-inhibited cyclase; and
  camp_pka_signal_transduction itself uses gs_gpcr_activation as its optional upstream
  input. Rather than repoint those ten references across seven files, the two
  PKA node here now resolves into the fuller module. (1) adenylyl_cyclase_activation
  keeps its own ADCY5 annoton (adenylate cyclase activity) rather than referencing
  camp_pka_signal_transduction#camp_production: that step is a variant set over every
  regulatory class including soluble ADCY10, which G proteins do not regulate, so
  referencing it would let a Gs-stimulated or Gi-inhibited caller be satisfied by a
  cyclase it cannot act on. ADCY5 is both Gs-stimulated and Gi-inhibited, which fits
  all of this node's callers; the vasopressin module names ADCY6 in its own node. (2)
  pka_creb_output is a composite node with three parts: cAMP-induced holoenzyme
  dissociation and catalytic-subunit substrate phosphorylation, each a module_ref into
  the fuller module (pka_holoenzyme_activation, pka_catalytic_activity), and a local CREB
  phosphorylation step that keeps the original PRKACA and CREB1 annotons. The CREB step
  stays here because the fuller module leaves PKA substrates out of scope, while the CRH,
  vasopressin and other hormone modules rely on this node for the CREB transcriptional
  output (POMC and AQP2 transcription). The references are node-to-node in both
  directions between the two modules (gs_gpcr_activation is referenced from the fuller
  module; pka_holoenzyme_activation and pka_catalytic_activity are referenced from
  here), and none of the referenced nodes contains a further reference,
  so no cycle is formed.
module:
  id: gpcr_camp_pka_signaling
  label: GPCR-cAMP-PKA signaling pathway
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: adenylate cyclase-modulating G protein-coupled receptor signaling pathway
      term:
        id: GO:0007188
        label: adenylate cyclase-modulating G protein-coupled receptor signaling pathway
      description: GPCR signaling through modulation of adenylyl cyclase and cAMP.
  context:
    taxa:
      - preferred_term: eukaryotes
        term:
          id: NCBITaxon:2759
          label: Eukaryota
        description: GPCR and cyclic-nucleotide signaling are ancient eukaryotic signaling mechanisms.
    cellular_components:
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: receptor and Gs activation
      node:
        id: gs_gpcr_activation
        label: Gs-coupled receptor activates heterotrimeric G protein
        module_type: REGULATORY_STEP
        description: >-
          Agonist-bound GPCR acts as a guanine nucleotide exchange factor for
          the heterotrimeric G protein, producing active G alpha s-GTP.
        annotons:
          - id: beta2_adrenergic_receptor
            label: Beta-2 adrenergic receptor exemplar
            participant:
              selector_type: FAMILY
              family:
                preferred_term: class A Gs-coupled GPCRs
                term:
                  id: PANTHER:PTHR24248
                  label: ADRENERGIC RECEPTOR-RELATED G-PROTEIN COUPLED RECEPTOR
                representative_members:
                  - preferred_term: ADRB2
                    term:
                      id: UniProtKB:P07550
                      label: Beta-2 adrenergic receptor
                ancestral_nodes:
                  - preferred_term: PAINT GPCR receptor-activity node PTN002798190
                    term:
                      id: PANTHER:PTN002798190
                      label: PTN002798190
                    description: >-
                      PANTHER PAINT node in PTHR24248 with IBD support for
                      G protein-coupled receptor activity (F:GO:0004930) and
                      plasma-membrane localization.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002798190 in PTHR24248.
                  - preferred_term: PAINT beta2-adrenergic receptor node PTN002798499
                    term:
                      id: PANTHER:PTN002798499
                      label: PTN002798499
                    description: >-
                      PANTHER PAINT node in PTHR24248 with IBD support for
                      beta2-adrenergic receptor activity (F:GO:0004941).
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002798499 in PTHR24248.
            function:
              preferred_term: G protein-coupled receptor activity
              term:
                id: GO:0004930
                label: G protein-coupled receptor activity
            role_description: Receptor exemplar for agonist-driven Gs activation.
          - id: g_alpha_s
            label: G alpha s switch
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GNAS
                term:
                  id: UniProtKB:P63092
                  label: Guanine nucleotide-binding protein G(s) subunit alpha isoforms short
            role_description: GTP-bound alpha subunit that stimulates adenylyl cyclase.
    - order: 2
      role: cAMP second messenger generation
      node:
        id: adenylyl_cyclase_activation
        label: Adenylyl cyclase produces cAMP
        module_type: REACTION
        description: G alpha s activates membrane adenylyl cyclase to convert ATP to cAMP.
        annotons:
          - id: adenylyl_cyclase
            label: Adenylyl cyclase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ADCY5
                term:
                  id: UniProtKB:O95622
                  label: Adenylate cyclase type 5
            function:
              preferred_term: adenylate cyclase activity
              term:
                id: GO:0004016
                label: adenylate cyclase activity
              products:
                - preferred_term: cyclic AMP
            role_description: Enzyme tier that generates the cAMP second messenger.
    - order: 3
      role: PKA activation and transcriptional output
      node:
        id: pka_creb_output
        label: PKA activation and CREB phosphorylation
        module_type: REGULATORY_STEP
        description: >-
          cAMP binds PKA regulatory subunits, freeing catalytic subunits to
          phosphorylate substrates including CREB-family transcription factors.
          The holoenzyme activation and catalytic steps are included by reference
          to the fuller cAMP/PKA module; the CREB phosphorylation step is modelled
          here.
        parts:
          - order: 1
            role: cAMP-induced PKA holoenzyme dissociation
            node:
              id: pka_creb_holoenzyme_activation
              label: cAMP-induced dissociation of the PKA holoenzyme
              description: >-
                Included by reference to the PKA regulatory-subunit step of the
                fuller cAMP/PKA module (type I and type II holoenzymes).
              module_ref: camp_pka_signal_transduction#pka_holoenzyme_activation
          - order: 2
            role: PKA catalytic subunit phosphorylation of substrates
            node:
              id: pka_creb_catalytic_activity
              label: PKA catalytic subunit phosphorylation of substrates
              description: >-
                Included by reference to the PKA catalytic-subunit step of the
                fuller cAMP/PKA module (PRKACA, PRKACB, PRKACG).
              module_ref: camp_pka_signal_transduction#pka_catalytic_activity
          - order: 3
            role: PKA phosphorylation of CREB
            node:
              id: creb_phosphorylation
              label: PKA phosphorylates the CREB transcription factor
              module_type: REGULATORY_STEP
              description: >-
                Released PKA catalytic subunit phosphorylates CREB in the nucleus,
                the transcriptional output that the fuller cAMP/PKA module leaves out
                of scope.
              annotons:
                - id: pka_catalytic_subunit
                  label: PKA catalytic subunit
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: PRKACA
                      term:
                        id: UniProtKB:P17612
                        label: cAMP-dependent protein kinase catalytic subunit alpha
                  function:
                    preferred_term: protein serine/threonine kinase activity
                    term:
                      id: GO:0004674
                      label: protein serine/threonine kinase activity
                    targets:
                      - preferred_term: CREB1
                  role_description: cAMP-responsive kinase output of the pathway.
                - id: creb_transcription_factor
                  label: CREB transcriptional effector
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: CREB1
                      term:
                        id: UniProtKB:P16220
                        label: Cyclic AMP-responsive element-binding protein 1
                  locations:
                    - preferred_term: nucleus
                      term:
                        id: GO:0005634
                        label: nucleus
                  role_description: Nuclear transcriptional effector phosphorylated by PKA.
        connections:
          - source: pka_creb_holoenzyme_activation
            target: pka_creb_catalytic_activity
            connection_type: POSITIVELY_REGULATES
            description: Released catalytic subunits become active kinases.
          - source: pka_creb_catalytic_activity
            target: creb_phosphorylation
            connection_type: CAUSES
            description: Free PKA catalytic subunit phosphorylates CREB.
  connections:
    - source: gs_gpcr_activation
      target: adenylyl_cyclase_activation
      connection_type: CAUSES
      description: G alpha s-GTP stimulates adenylyl cyclase.
    - source: adenylyl_cyclase_activation
      target: pka_creb_output
      connection_type: CAUSES
      description: cAMP generated by adenylyl cyclase activates PKA.
