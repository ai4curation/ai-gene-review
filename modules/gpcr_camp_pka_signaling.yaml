id: MODULE:gpcr_camp_pka_signaling
title: GPCR-cAMP-PKA signaling pathway module
description: >-
  A compact GPCR adenylyl-cyclase/cAMP motif with stimulatory Gs and inhibitory
  Gi arms. Agonist-occupied GPCRs activate heterotrimeric Gs or Gi; G alpha s
  stimulates transmembrane adenylyl cyclase, G alpha i inhibits selected
  adenylyl cyclase isoforms, and cAMP feeds PKA phosphorylation of cytosolic and
  nuclear substrates including CREB. The module is grounded in GO:0007188. ADRB2,
  the G alpha switch family and transmembrane adenylyl cyclases are anchored to
  PAINT/PANTHER families; PRKACA and CREB1 are curated UniProt exemplars without
  PTN ancestry claims. The cAMP-PKA activation and catalysis steps are included
  by reference to the fuller camp_pka_signal_transduction module; the CREB
  phosphorylation step is modelled here.
status: DRAFT
evidence:
  - source_id: GO:0007188
    title: adenylate cyclase-modulating G protein-coupled receptor signaling pathway
    statement: The module is grounded in the GO biological process term for GPCR signaling through cAMP.
  - source_id: PANTHER:PTN000026392
    statement: >-
      PAINT node in PTHR10218 with IBD support for GNAI1 and other eukaryotic
      G alpha subunits carrying G protein activity, heterotrimeric G-protein
      complex membership and adenylate-cyclase-modulating GPCR signaling.
  - source_id: PANTHER:PTN002899368
    statement: >-
      PAINT node in PTHR45627 with IBD support for adenylate cyclase activity
      and plasma-membrane localization in transmembrane adenylyl cyclases.
notes: >-
  Reconciled with modules/camp_pka_signal_transduction.yaml, the fuller cAMP/PKA
  cassette derived from RGD PW:0000543. This compact module keeps its original
  three node ids because other modules point at them by module_ref:
  crh_receptor_signaling, beta_adrenergic_signaling and pth_receptor_signaling
  use adenylyl_cyclase_activation and pka_creb_output;
  glucagon_receptor_signaling and vasopressin_receptor_signaling use
  pka_creb_output; calcium_sensing_receptor_signaling and acetylcholine_signaling
  use adenylyl_cyclase_activation for the Gi-inhibited cyclase; and
  camp_pka_signal_transduction itself uses gs_gpcr_activation as its optional
  upstream input. The Gi branch is now represented as the sibling node
  gi_gpcr_inhibition rather than squeezing inhibitory models through the Gs
  activation node. Rather than repoint the existing references across seven
  files, the PKA node here now resolves into the fuller module. (1)
  adenylyl_cyclase_activation keeps its own compact regulatory-class split rather
  than referencing camp_pka_signal_transduction#camp_production: that fuller step
  ranges over every regulatory class including soluble ADCY10 and G beta
  gamma-conditional AC2/4/7, so a Gi-inhibited caller could be satisfied by a
  cyclase it cannot act on. The new Gi edge targets only the
  gi_inhibited_adenylyl_cyclases variant, represented by AC5/6, while the
  PTHR45627 family descriptor stays on the broader Gs-stimulated transmembrane
  class. (2)
  pka_creb_output is a composite node with three parts: cAMP-induced holoenzyme
  dissociation and catalytic-subunit substrate phosphorylation, each a module_ref into
  the fuller module (pka_holoenzyme_activation, pka_catalytic_activity), and a local CREB
  phosphorylation step that keeps the original PRKACA and CREB1 annotons. The CREB step
  stays here because the fuller module leaves PKA substrates out of scope, while the CRH,
  vasopressin and other hormone modules rely on this node for the CREB transcriptional
  output (POMC and AQP2 transcription). The references are node-to-node in both
  directions between the two modules (gs_gpcr_activation is referenced from the fuller
  module; pka_holoenzyme_activation and pka_catalytic_activity are referenced from
  here), and none of the referenced nodes contains a further reference,
  so no cycle is formed.
