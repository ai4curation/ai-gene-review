                    label: Gi-inhibited adenylyl cyclase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Gi-inhibited adenylyl cyclases (ADCY5, ADCY6)
                        representative_members:
                          - preferred_term: ADCY5
                            term:
                              id: UniProtKB:O95622
                              label: Adenylate cyclase type 5
                          - preferred_term: ADCY6
                            term:
                              id: UniProtKB:O43306
                              label: Adenylate cyclase type 6
                    function:
                      preferred_term: adenylate cyclase activity
                      term:
                        id: GO:0004016
                        label: adenylate cyclase activity
                      products:
                        - preferred_term: cyclic AMP
                    gocam_associations:
