                        title: "AVPR2 -mediated signaling G-alpha-s (\"stimulatory\", activating adenylate cyclase) following activation by vasopressin (AVP) (Human)."
                        description: >-
                          Human AVPR2 model ADCY6 activity, downstream of GNAS
                          in the adenylate-cyclase-activating GPCR pathway.
                    role_description: Gs-stimulated enzyme tier that generates the cAMP second messenger.
              - id: gi_inhibited_adenylyl_cyclases
                label: Gi-inhibited transmembrane adenylyl cyclases (AC5/6)
                module_type: REACTION
