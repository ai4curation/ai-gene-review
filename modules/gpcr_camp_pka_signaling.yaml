                            term:
                              id: UniProtKB:O95622
                              label: Adenylate cyclase type 5
                          - preferred_term: ADCY6
                            term:
                              id: UniProtKB:O43306
                              label: Adenylate cyclase type 6
                        ancestral_nodes:
                          - preferred_term: PAINT transmembrane adenylyl cyclase node PTN002899368
                            term:
                              id: PANTHER:PTN002899368
                              label: PTN002899368
                            description: >-
                              PANTHER PAINT node in PTHR45627 with IBD support for
                              adenylate cyclase activity (F:GO:0004016) and plasma-membrane localization.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN002899368 in PTHR45627.
