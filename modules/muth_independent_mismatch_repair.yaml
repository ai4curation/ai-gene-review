module:
  id: muth_independent_mismatch_repair
  label: MutH-independent bacterial DNA mismatch repair
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: mismatch repair
    term:
      id: GO:0006298
      label: mismatch repair
    description: Correction of mismatches that escaped replicative proofreading.
  parts:
  - order: 1
    role: mismatch recognition
    node:
      id: mismatch_recognition
      label: MutS-dependent mismatch recognition
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: muts_mismatch_sensor
        label: ATP-dependent MutS mismatch sensor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: bacterial MutS mismatch sensors
            term:
              id: PANTHER:PTHR11361:SF34
              label: DNA MISMATCH REPAIR PROTEIN MSH1, MITOCHONDRIAL
            representative_members:
            - preferred_term: mutS (Pseudomonas putida KT2440)
              term:
                id: UniProtKB:Q88ME7
                label: DNA mismatch repair protein MutS
            - preferred_term: mutS (Escherichia coli K-12)
              term:
                id: UniProtKB:P23909
                label: DNA mismatch repair protein MutS
            - preferred_term: mutS (Bacillus subtilis 168)
              term:
                id: UniProtKB:P49849
                label: DNA mismatch repair protein MutS
              description: MutS of the canonical MutH-independent Gram-positive model; its beta-clamp
                interaction directs MutS and MutL repair foci.
            notes: PTHR11361:SF34 holds bacterial MutS and the organellar MSH1 proteins. The family review
              restricts ATP-dependent mismatch sensing to SF34 and the eukaryotic MSH2, MSH3 and MSH6
              subfamilies, excluding the meiotic MSH4/MSH5 subfamilies.
        function:
          preferred_term: ATP-dependent DNA damage sensor activity
          term:
            id: GO:0140664
            label: ATP-dependent DNA damage sensor activity
          evidence:
          - source_id: file:PSEPK/mutS/mutS-ai-review.yaml
            statement: The PSEPK review accepts this as the integrated mismatch-recognition function of
              Q88ME7.
          - source_id: file:interpro/panther/PTHR11361/PTHR11361-review.yaml
            statement: The MutS family review grants GO:0140664 to SF34.
        processes:
        - preferred_term: mismatch repair
          term:
            id: GO:0006298
            label: mismatch repair
        locations:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        role_description: Recognizes a base-pair mismatch or small insertion/deletion loop and initiates
          ATP-dependent recruitment of MutL.
  - order: 2
    role: MutL-dependent strand incision
    node:
      id: mutl_incision
      label: MutL coordination and duplex-DNA nicking
      module_type: BIOLOGICAL_PROCESS
      annotons:
      - id: mutl_atpase
        label: MutL ATPase coordinator
        participant:
          selector_type: FAMILY
          family:
            preferred_term: MutL-family ATPase coordinators
            term:
              id: PANTHER:PTHR10073:SF12
              label: DNA MISMATCH REPAIR PROTEIN MLH1
            representative_members:
            - preferred_term: mutL (Pseudomonas putida KT2440)
              term:
                id: UniProtKB:Q88DD1
                label: DNA mismatch repair protein MutL
            - preferred_term: mutL (Pseudomonas aeruginosa PAO1)
              term:
                id: UniProtKB:Q9HUL8
                label: DNA mismatch repair protein MutL
              description: Directly characterized Pseudomonas endonuclease exemplar, with 521 identical
                residues among 627 aligned residue pairs to Q88DD1 in the retained global alignment.
            - preferred_term: mutL (Bacillus subtilis 168)
              term:
                id: UniProtKB:P49850
                label: DNA mismatch repair protein MutL
              description: Directly characterized beta-clamp-stimulated MutL endonuclease of B. subtilis.
            notes: PTHR10073:SF12 also contains E. coli MutL and eukaryotic MLH1. The GHKL ATPase is shared
              family-wide, so the subfamily grounding plus exact bacterial exemplars delimit this coordinator
              role.
          required_function:
            preferred_term: ATP hydrolysis activity
            term:
              id: GO:0016887
              label: ATP hydrolysis activity
          notes: PTHR10073 also contains eukaryotic MLH/PMS proteins and MutL implementations with different
            incision mechanisms. Exact bacterial exemplars and the required ATPase function delimit this
            coordinator role.
        function:
          preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
        processes:
        - preferred_term: mismatch repair
          term:
            id: GO:0006298
            label: mismatch repair
        role_description: Uses the GHKL ATPase cycle to coordinate the transition from MutS recognition
          to strand incision and excision.
      - id: mutl_endonuclease
        label: MutL strand-incision endonuclease
        participant:
          selector_type: FAMILY
          family:
            preferred_term: endonuclease-bearing bacterial MutL proteins
            term:
              id: PANTHER:PTHR10073:SF12
              label: DNA MISMATCH REPAIR PROTEIN MLH1
            representative_members:
            - preferred_term: mutL (Pseudomonas putida KT2440)
              term:
                id: UniProtKB:Q88DD1
                label: DNA mismatch repair protein MutL
            - preferred_term: mutL (Pseudomonas aeruginosa PAO1)
              term:
                id: UniProtKB:Q9HUL8
                label: DNA mismatch repair protein MutL
            - preferred_term: mutL (Bacillus subtilis 168)
              term:
                id: UniProtKB:P49850
                label: DNA mismatch repair protein MutL
              description: Directly characterized beta-clamp-stimulated MutL endonuclease of B. subtilis.
            notes: 'Incision activity is RESIDUE_DETERMINED in the PTHR10073 family review: SF12 mixes
              motif-bearing MutL of MutH-independent bacteria with motif-less E. coli MutL and eukaryotic
              MLH1. Members need an intact DQHA(X)2E(X)4E endonuclease motif (site PANTHER:PTHR10073#endonuclease_motif);
              all three exemplars carry it.'
          required_function:
            preferred_term: double-stranded DNA endonuclease activity
            term:
              id: GO:1990238
              label: double-stranded DNA endonuclease activity
          notes: The broad PTHR10073 family is not itself an endonuclease selector. The required function
            and directly characterized Q9HUL8 exemplar restrict this role to incision-capable MutL implementations.
        function:
          preferred_term: double-stranded DNA endonuclease activity
          term:
            id: GO:1990238
            label: double-stranded DNA endonuclease activity
          substrates:
          - preferred_term: intact duplex DNA near a mismatch
          - preferred_term: water
          products:
          - preferred_term: nicked duplex DNA
          cofactors:
          - preferred_term: divalent metal ion
          evidence:
          - source_id: PMID:23969026
            statement: Purified P. aeruginosa MutL (Q9HUL8) nicks covalently closed duplex DNA.
          - source_id: PMID:20603082
            statement: B. subtilis MutL (P49850) nicking requires the endonuclease motif aspartate (D462N
              abolishes activity).
          - source_id: PMID:16873062
            statement: The motif is shared by PMS2 and MutL of bacteria that do not use d(GATC) methylation,
              and is absent from MutL of MutH-dependent bacteria.
        processes:
        - preferred_term: mismatch repair
          term:
            id: GO:0006298
            label: mismatch repair
        role_description: Introduces the strand discontinuity that replaces the MutH incision step of
          methyl-directed systems. Nicking is stimulated by the beta clamp; the strand-discrimination
          signal that orients it is not fully resolved.
      - id: dnan_beta_clamp
        label: Replication beta-clamp incision context
        participant:
          selector_type: FAMILY
          family:
            preferred_term: bacterial beta sliding clamps
            term:
              id: PANTHER:PTHR30478:SF0
              label: BETA SLIDING CLAMP
            representative_members:
            - preferred_term: dnaN (Pseudomonas putida KT2440)
              term:
                id: UniProtKB:P0A120
                label: Beta sliding clamp
            - preferred_term: dnaN (Escherichia coli K-12)
              term:
                id: UniProtKB:P0A988
                label: Beta sliding clamp
        function:
          preferred_term: DNA polymerase processivity factor activity
          term:
            id: GO:0030337
            label: DNA polymerase processivity factor activity
        processes:
        - preferred_term: mismatch repair
          term:
            id: GO:0006298
            label: mismatch repair
        role_description: 'Provides replisome-coupled clamp context: MutS and MutL bind the clamp, and
          in MutH-independent systems such as B. subtilis the clamp binds and stimulates the MutL endonuclease
          and is required for repair.'
        evidence:
        - source_id: PMID:26384423
          statement: Disrupting the MutL-clamp interaction abolishes mismatch repair in B. subtilis but
            only mildly affects E. coli.
        - source_id: PMID:21050827
          statement: MutS and MutL both bind the beta clamp; MutS-clamp binding recruits them to foci.
  - order: 3
    role: mismatch-containing tract excision
    node:
      id: mismatch_excision
      label: Directional unwinding and exonucleolytic excision
      module_type: METABOLIC_PATHWAY
