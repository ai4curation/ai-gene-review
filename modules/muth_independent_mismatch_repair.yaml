  notes: 'Generalization: the module is species-neutral for bacteria that lack Dam methylation and MutH.
    Exemplars come from P. putida KT2440 and P. aeruginosa (Gram-negative) and B. subtilis (Gram-positive),
    with E. coli proteins where the step chemistry is shared with the MutH-dependent route (recognition,
    unwinding, excision, synthesis, ligation). Eukaryotic MutSalpha/MutLalpha repair uses the same MutH-independent
    nicking logic, with PMS2 as the endonuclease, but it is not included: its clamp (PCNA), loader (RFC),
    excision (EXO1, RPA) and synthesis (Pol delta) components belong to other families. It would be a
    separate module. Every family step is grounded on the PANTHER subfamily that holds all its exemplars,
    checked against panther.obo and the member index. Exonuclease I, RecJ and Exonuclease VII are orientation-dependent
    alternatives rather than universally obligatory proteins, and which dominate in a given lineage is
    not resolved. DnaN, SSB, DnaE and LigA are shared replication and repair machinery included to complete
    the pathway, not MMR-specific proteins. Intrinsic warning: the MutL endonuclease annoton is grounded
    on PTHR10073:SF12, for which the family review marks GO:1990238 RESIDUE_DETERMINED (endonuclease motif),
    because SF12 also contains motif-less E. coli MutL and MLH1. The FAMILY_SCOPE_RESTRICTED warning this
    produces is correct and cannot be removed by a different PANTHER id.'
