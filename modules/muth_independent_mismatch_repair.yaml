id: MODULE:muth_independent_mismatch_repair
title: MutH-independent bacterial DNA mismatch repair
description: A reusable four-stage bacterial module in which MutS recognizes a replication mismatch, the
  beta sliding clamp licenses and orients an endonuclease-bearing MutL that nicks the DNA without MutH,
  and a helicase, single-stranded DNA-binding protein and one or more directional exonucleases remove
  the error-containing tract before DNA polymerase and ligase restore the duplex. This is the mismatch
  repair mode of most bacteria, which lack Dam methylation and MutH, and it is distinct from the Dam/MutH-directed
  route of enterobacteria. Mismatch avoidance by polymerase proofreading, recombination control, and the
  other repair pathways that share UvrD, RecJ, polymerase or ligase are outside the boundary.
status: COMPLETE
evidence:
- source_id: GO:0006298
  title: mismatch repair
  statement: GO:0006298 defines the biological process represented by the module.
- source_id: PMID:31599106
  title: Mismatch repair hierarchy of Pseudomonas putida revealed by mutagenic ssDNA recombineering of
    the pyrF gene.
  statement: Direct KT2440 genetics establishes MutS- and MutL-dependent correction and the absence of
    a canonical MutH component.
- source_id: PMID:23969026
  title: Analysis of DNA structure and sequence requirements for Pseudomonas aeruginosa MutL endonuclease
    activity.
  statement: Direct biochemistry establishes duplex-DNA nicking by the close Pseudomonas MutL exemplar
    Q9HUL8.
- source_id: PMID:20603082
  title: 'Structure of the endonuclease domain of MutL: unlicensed to cut.'
  statement: Direct structural and biochemical evidence for the B. subtilis MutL endonuclease (P49850),
    whose motif aspartate is needed for nicking.
- source_id: PMID:26384423
  title: The sliding clamp tethers the endonuclease domain of MutL to DNA.
  statement: The beta clamp stimulates B. subtilis MutL nicking and is required for its mismatch repair
    in vivo.
- source_id: PMID:16873062
  title: Endonucleolytic function of MutLalpha in human mismatch repair.
  statement: The DQHA(X)2E(X)4E endonuclease motif is conserved in PMS2 and in MutL of bacteria without
    methyl-directed repair, defining which MutL proteins can supply incision.
- source_id: file:PSEPK/mutL/mutL-bioinformatics/RESULTS.md
  title: Reproducible Q88DD1-Q9HUL8 MutL global protein alignment
  statement: Retained inputs, scripts, parameters, checksums, and outputs establish 521 identical residues
    among 627 aligned residue pairs (83.0941%).
- source_id: PMID:30292721
  title: Involvement of transcription-coupled repair factor Mfd and DNA helicase UvrD in mutational processes
    in Pseudomonas putida.
  statement: Direct P. putida genetics supports an important but partially redundant UvrD contribution
    to mismatch repair.
