id: MODULE:muth_independent_mismatch_repair
title: MutH-independent bacterial DNA mismatch repair
description: >-
  A reusable four-stage bacterial module in which MutS recognizes a
  replication mismatch, the beta sliding clamp helps orient an
  endonuclease-bearing MutL that nicks DNA without MutH, and a helicase,
  single-stranded DNA-binding protein, and one or more directional exonucleases
  remove the error-containing tract before DNA polymerase and ligase restore
  the duplex. The module is explicitly distinct from the Dam/MutH-directed
  Escherichia coli route. Mismatch avoidance by polymerase proofreading,
  recombination control, and the other repair pathways that share UvrD, RecJ,
  polymerase, or ligase are outside the boundary.
status: DRAFT
evidence:
  - source_id: GO:0006298
    title: mismatch repair
    statement: GO:0006298 defines the biological process represented by the module.
  - source_id: PMID:31599106
    title: Mismatch repair hierarchy of Pseudomonas putida revealed by mutagenic ssDNA recombineering of the pyrF gene.
    statement: >-
      Direct KT2440 genetics establishes MutS- and MutL-dependent correction
      and the absence of a canonical MutH component.
  - source_id: PMID:23969026
    title: Analysis of DNA structure and sequence requirements for Pseudomonas aeruginosa MutL endonuclease activity.
    statement: >-
      Direct biochemistry establishes duplex-DNA nicking by the close
      Pseudomonas MutL exemplar Q9HUL8.
  - source_id: file:PSEPK/mutL/mutL-bioinformatics/RESULTS.md
    title: Reproducible Q88DD1-Q9HUL8 MutL global protein alignment
    statement: >-
      Retained inputs, scripts, parameters, checksums, and outputs establish
      521 identical residues among 627 aligned residue pairs (83.0941%).
  - source_id: PMID:30292721
    title: Involvement of transcription-coupled repair factor Mfd and DNA helicase UvrD in mutational processes in Pseudomonas putida.
    statement: >-
      Direct P. putida genetics supports an important but partially redundant
      UvrD contribution to mismatch repair.
  - source_id: PANTHER:PTN002260821
    title: MutS TreeGrafter support node
    statement: Current PSEPK GOA uses this exact node for MutS annotations.
  - source_id: PANTHER:PTN002225929
    title: MutL TreeGrafter support node
    statement: Current PSEPK GOA uses this exact node for MutL annotations.
  - source_id: PANTHER:PTN008511651
    title: UvrD TreeGrafter support node
    statement: Current PSEPK GOA uses this exact node for UvrD annotations.
  - source_id: PANTHER:PTN002437006
    title: XseB TreeGrafter support node
    statement: Current PSEPK GOA uses this exact node for XseB annotations.
  - source_id: PANTHER:PTHR30478
    title: DNA polymerase III beta sliding clamp family
    statement: >-
      PSEPK DnaN P0A120 and E. coli DnaN P0A988 are exact representatives of
      the beta-clamp role.
  - source_id: PANTHER:PTHR10302
    title: bacterial single-stranded DNA-binding protein family
    statement: >-
      PSEPK SSB Q88QK5 and E. coli SSB P0AGE0 are exact representatives of
      the ssDNA-binding and repair-partner scaffold role.
  - source_id: file:PSEPK/mutS/mutS-ai-review.yaml
    title: PSEPK mutS gene review
    statement: Q88ME7 supplies ATP-dependent mismatch recognition.
  - source_id: file:PSEPK/mutL/mutL-ai-review.yaml
    title: PSEPK mutL gene review
    statement: Q88DD1 supplies ATP-dependent coordination and inferred strand incision.
  - source_id: file:PSEPK/uvrD/uvrD-ai-review.yaml
    title: PSEPK uvrD gene review
    statement: Q88C31 supplies a directly supported but nonexclusive repair helicase.
  - source_id: file:PSEPK/xseA/xseA-ai-review.yaml
    title: PSEPK xseA gene review
    statement: Q88P26 supplies the Exonuclease VII large subunit candidate.
  - source_id: file:PSEPK/xseB/xseB-ai-review.yaml
    title: PSEPK xseB gene review
    statement: Q88QG5 supplies the Exonuclease VII small subunit candidate.
  - source_id: file:PSEPK/sbcB/sbcB-ai-review.yaml
    title: PSEPK sbcB gene review
    statement: Q88N51 supplies the 3'-to-5' Exonuclease I candidate.
  - source_id: file:PSEPK/recJ/recJ-ai-review.yaml
    title: PSEPK recJ gene review
    statement: Q88MU1 supplies the 5'-to-3' RecJ candidate.
module:
  id: muth_independent_mismatch_repair
  label: MutH-independent bacterial DNA mismatch repair
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: mismatch repair
      term:
        id: GO:0006298
        label: mismatch repair
      description: Correction of mismatches that escaped replicative proofreading.
  parts:
    - order: 1
      role: mismatch recognition
      node:
        id: mismatch_recognition
        label: MutS-dependent mismatch recognition
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: muts_mismatch_sensor
            label: ATP-dependent MutS mismatch sensor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial MutS mismatch sensors
                term:
                  id: PANTHER:PTHR11361
                  label: DNA MISMATCH REPAIR PROTEIN MUTS FAMILY MEMBER
                representative_members:
                  - preferred_term: PSEPK MutS
                    term:
                      id: UniProtKB:Q88ME7
                      label: DNA mismatch repair protein MutS
                  - preferred_term: Escherichia coli MutS
                    term:
                      id: UniProtKB:P23909
                      label: DNA mismatch repair protein MutS
            function:
              preferred_term: ATP-dependent DNA damage sensor activity
              term:
                id: GO:0140664
                label: ATP-dependent DNA damage sensor activity
              evidence:
                - source_id: file:PSEPK/mutS/mutS-ai-review.yaml
                  statement: >-
                    The PSEPK review accepts this as the integrated
                    mismatch-recognition function of Q88ME7.
            processes:
              - preferred_term: mismatch repair
                term:
                  id: GO:0006298
                  label: mismatch repair
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Recognizes a base-pair mismatch or small insertion/deletion loop
              and initiates ATP-dependent recruitment of MutL.
    - order: 2
      role: MutL-dependent strand incision
      node:
        id: mutl_incision
        label: MutL coordination and duplex-DNA nicking
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: mutl_atpase
            label: MutL ATPase coordinator
            participant:
              selector_type: FAMILY
              family:
                preferred_term: MutL-family ATPase coordinators
                term:
                  id: PANTHER:PTHR10073
                  label: DNA MISMATCH REPAIR PROTEIN MLH, PMS, MUTL
                representative_members:
                  - preferred_term: PSEPK MutL
                    term:
                      id: UniProtKB:Q88DD1
                      label: DNA mismatch repair protein MutL
                  - preferred_term: Pseudomonas aeruginosa MutL
                    term:
                      id: UniProtKB:Q9HUL8
                      label: DNA mismatch repair protein MutL
                    description: >-
                      Directly characterized Pseudomonas endonuclease exemplar,
                      with 521 identical residues among 627 aligned residue
                      pairs to Q88DD1 in the retained global alignment.
              required_function:
                preferred_term: ATP hydrolysis activity
                term:
                  id: GO:0016887
                  label: ATP hydrolysis activity
              notes: >-
                PTHR10073 also contains eukaryotic MLH/PMS proteins and MutL
                implementations with different incision mechanisms. Exact
                bacterial exemplars and the required ATPase function delimit
                this coordinator role.
            function:
              preferred_term: ATP hydrolysis activity
              term:
                id: GO:0016887
                label: ATP hydrolysis activity
            processes:
              - preferred_term: mismatch repair
                term:
                  id: GO:0006298
                  label: mismatch repair
            role_description: >-
              Uses the GHKL ATPase cycle to coordinate the transition from
              MutS recognition to strand incision and excision.
          - id: mutl_endonuclease
            label: MutL strand-incision endonuclease
            participant:
              selector_type: FAMILY
              family:
                preferred_term: endonuclease-bearing bacterial MutL proteins
                term:
                  id: PANTHER:PTHR10073
                  label: DNA MISMATCH REPAIR PROTEIN MLH, PMS, MUTL
                representative_members:
                  - preferred_term: PSEPK MutL
                    term:
                      id: UniProtKB:Q88DD1
                      label: DNA mismatch repair protein MutL
                  - preferred_term: Pseudomonas aeruginosa MutL
                    term:
                      id: UniProtKB:Q9HUL8
                      label: DNA mismatch repair protein MutL
              required_function:
                preferred_term: double-stranded DNA endonuclease activity
                term:
                  id: GO:1990238
                  label: double-stranded DNA endonuclease activity
              notes: >-
                The broad PTHR10073 family is not itself an endonuclease
                selector. The required function and directly characterized
                Q9HUL8 exemplar restrict this role to incision-capable MutL
                implementations.
            function:
              preferred_term: double-stranded DNA endonuclease activity
              term:
                id: GO:1990238
                label: double-stranded DNA endonuclease activity
              substrates:
                - preferred_term: intact duplex DNA near a mismatch
                - preferred_term: water
              products:
                - preferred_term: nicked duplex DNA
              cofactors:
                - preferred_term: divalent metal ion
              evidence:
                - source_id: PMID:23969026
                  statement: >-
                    Q9HUL8 is a directly characterized duplex-DNA nicking
                    exemplar for the close Pseudomonas orthology inference.
            processes:
              - preferred_term: mismatch repair
                term:
                  id: GO:0006298
                  label: mismatch repair
            role_description: >-
              Introduces a strand discontinuity that replaces the MutH incision
              step of methyl-directed systems. The precise KT2440
              strand-discrimination signal remains unresolved.
          - id: dnan_beta_clamp
            label: Replication beta-clamp incision context
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial beta sliding clamps
                term:
                  id: PANTHER:PTHR30478
                  label: DNA POLYMERASE III SUBUNIT BETA
                representative_members:
                  - preferred_term: PSEPK DnaN
                    term:
                      id: UniProtKB:P0A120
                      label: Beta sliding clamp
                  - preferred_term: Escherichia coli DnaN
                    term:
                      id: UniProtKB:P0A988
                      label: Beta sliding clamp
            function:
              preferred_term: DNA polymerase processivity factor activity
              term:
                id: GO:0030337
                label: DNA polymerase processivity factor activity
            processes:
              - preferred_term: mismatch repair
                term:
                  id: GO:0006298
                  label: mismatch repair
            role_description: >-
              Provides replisome-coupled clamp context that can orient or
              stimulate MutL incision in MutH-independent systems; the exact
              strand-discrimination signal varies among lineages.
    - order: 3
      role: mismatch-containing tract excision
      node:
        id: mismatch_excision
        label: Directional unwinding and exonucleolytic excision
        module_type: METABOLIC_PATHWAY
        annotons:
          - id: ssb_excision_scaffold
            label: Single-stranded DNA-binding repair scaffold
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial single-stranded DNA-binding proteins
                term:
                  id: PANTHER:PTHR10302
                  label: SINGLE-STRANDED DNA-BINDING PROTEIN
                representative_members:
                  - preferred_term: PSEPK SSB
                    term:
                      id: UniProtKB:Q88QK5
                      label: Single-stranded DNA-binding protein
                  - preferred_term: Escherichia coli SSB
                    term:
                      id: UniProtKB:P0AGE0
                      label: Single-stranded DNA-binding protein
            function:
              preferred_term: single-stranded DNA binding
              term:
                id: GO:0003697
                label: single-stranded DNA binding
            processes:
              - preferred_term: mismatch repair
                term:
                  id: GO:0006298
                  label: mismatch repair
            role_description: >-
              Coats exposed single-stranded DNA and recruits or coordinates
              DNA-processing partners during tract unwinding and degradation.
        parts:
          - order: 1
            role: repair-directed DNA unwinding
            node:
              id: repair_helicase_unwinding
              label: UvrD/PcrA-family repair helicase
              module_type: REACTION
              annotons:
                - id: uvrD_repair_helicase
                  label: 3'-to-5' DNA helicase
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: UvrD/PcrA-family DNA helicases
                      term:
                        id: PANTHER:PTHR11070
                        label: UVRD / RECB / PCRA DNA HELICASE FAMILY MEMBER
                      representative_members:
                        - preferred_term: PSEPK UvrD
                          term:
                            id: UniProtKB:Q88C31
                            label: DNA helicase II
                        - preferred_term: Escherichia coli UvrD
                          term:
                            id: UniProtKB:P03018
                            label: DNA helicase II
                    required_function:
                      preferred_term: 3'-5' DNA helicase activity
                      term:
                        id: GO:0043138
                        label: 3'-5' DNA helicase activity
                    notes: >-
                      PTHR11070 also contains RecB, PcrA, and Srs2-like
                      helicases. Exact UvrD exemplars plus the required
                      directional DNA-helicase function delimit this role.
                  function:
                    preferred_term: 3'-5' DNA helicase activity
                    term:
                      id: GO:0043138
                      label: 3'-5' DNA helicase activity
                    substrates:
                      - preferred_term: nicked duplex DNA
                      - preferred_term: ATP
                      - preferred_term: water
                    products:
                      - preferred_term: unwound DNA repair intermediate
                      - preferred_term: ADP
                      - preferred_term: phosphate
                      - preferred_term: proton
                  processes:
                    - preferred_term: mismatch repair
                      term:
                        id: GO:0006298
                        label: mismatch repair
                  role_description: >-
                    Unwinds from the repair nick toward and beyond the mismatch.
                    PSEPK genetics shows that Q88C31 contributes strongly but
                    that residual MMR remains without it.
          - order: 2
            role: directional single-stranded DNA degradation
            node:
              id: excision_nuclease_choice
              label: Orientation-dependent mismatch-excision nucleases
              module_type: METABOLIC_PATHWAY
              description: >-
                One or more directional exonucleases degrade the displaced
                error-containing strand. Which candidates dominate each
                orientation in KT2440 is not directly resolved.
              variant_sets:
                - id: mismatch_excision_nucleases
                  label: Directional exonuclease implementations
                  axis: nick orientation and nuclease availability
                  selection: ONE_OR_MORE
                  variants:
                    - id: exoi_3_to_5_excision
                      label: Exonuclease I 3'-to-5' route
                      module_type: REACTION
                      annotons:
                        - id: sbcB_exonuclease
                          label: Single-stranded DNA 3'-to-5' Exonuclease I
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: bacterial Exonuclease I proteins
                              term:
                                id: PANTHER:PTHR11046:SF11
                                label: EXODEOXYRIBONUCLEASE I
                              representative_members:
                                - preferred_term: PSEPK SbcB
                                  term:
                                    id: UniProtKB:Q88N51
                                    label: Exodeoxyribonuclease I
                                - preferred_term: Escherichia coli SbcB
                                  term:
                                    id: UniProtKB:P04995
                                    label: Exodeoxyribonuclease I
                          function:
                            preferred_term: single-stranded DNA 3'-5' DNA exonuclease activity
                            term:
                              id: GO:0008310
                              label: single-stranded DNA 3'-5' DNA exonuclease activity
                          role_description: >-
                            Provides 3'-to-5' degradation of an exposed
                            single-stranded repair tract.
                    - id: recj_5_to_3_excision
                      label: RecJ 5'-to-3' route
                      module_type: REACTION
                      annotons:
                        - id: recJ_exonuclease
                          label: RecJ 5'-to-3' exonuclease
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: bacterial RecJ exonucleases
                              term:
                                id: PANTHER:PTHR30255
                                label: Single-stranded-DNA-specific exonuclease RecJ
                              representative_members:
                                - preferred_term: PSEPK RecJ
                                  term:
                                    id: UniProtKB:Q88MU1
                                    label: single-stranded-DNA-specific exonuclease RecJ
                                - preferred_term: Escherichia coli RecJ
                                  term:
                                    id: UniProtKB:P21893
                                    label: single-stranded-DNA-specific exonuclease RecJ
                          function:
                            preferred_term: single-stranded DNA 5'-3' DNA exonuclease activity
                            term:
                              id: GO:0045145
                              label: single-stranded DNA 5'-3' DNA exonuclease activity
                          role_description: >-
                            Provides 5'-to-3' degradation of an exposed
                            single-stranded repair tract.
                    - id: exonuclease_vii_bidirectional_excision
                      label: Exonuclease VII bidirectional route
                      module_type: PROTEIN_COMPLEX
                      annotons:
                        - id: xseAB_exonuclease_vii
                          label: XseA/XseB Exonuclease VII
                          participant:
                            selector_type: PROTEIN_COMPLEX
                            protein_complex:
                              preferred_term: bacterial Exonuclease VII
                              term:
                                id: GO:0009318
                                label: exodeoxyribonuclease VII complex
                              active_units:
                                - id: xseA_large_subunit
                                  label: Exonuclease VII large subunit
                                  participant:
                                    selector_type: FAMILY
                                    family:
                                      preferred_term: XseA large subunits
                                      term:
                                        id: PANTHER:PTHR30008
                                        label: EXODEOXYRIBONUCLEASE 7 LARGE SUBUNIT
                                      representative_members:
                                        - preferred_term: PSEPK XseA
                                          term:
                                            id: UniProtKB:Q88P26
                                            label: exodeoxyribonuclease VII large subunit
                                        - preferred_term: Escherichia coli XseA
                                          term:
                                            id: UniProtKB:P04994
                                            label: exodeoxyribonuclease VII large subunit
                                  role: Catalytic large subunit of the heterooligomer.
                                - id: xseB_small_subunit
                                  label: Exonuclease VII small subunit
                                  participant:
                                    selector_type: FAMILY
                                    family:
                                      preferred_term: XseB small subunits
                                      term:
                                        id: PANTHER:PTHR34137
                                        label: EXODEOXYRIBONUCLEASE 7 SMALL SUBUNIT
                                      representative_members:
                                        - preferred_term: PSEPK XseB
                                          term:
                                            id: UniProtKB:Q88QG5
                                            label: exodeoxyribonuclease VII small subunit
                                        - preferred_term: Escherichia coli XseB
                                          term:
                                            id: UniProtKB:P0A8G9
                                            label: exodeoxyribonuclease VII small subunit
                                  role: Small subunit required for the heterooligomeric enzyme.
                          function:
                            preferred_term: exodeoxyribonuclease VII activity
                            term:
                              id: GO:0008855
                              label: exodeoxyribonuclease VII activity
                          role_description: >-
                            Provides bidirectional single-stranded DNA
                            degradation through the XseA/XseB complex.
        connections:
          - source: repair_helicase_unwinding
            target: excision_nuclease_choice
            connection_type: PROVIDES_INPUT_FOR
            description: Helicase-generated single-stranded DNA is degraded by an available exonuclease route.
    - order: 4
      role: repair synthesis and strand sealing
      node:
        id: repair_synthesis_and_sealing
        label: DNA gap filling and ligation
        module_type: METABOLIC_PATHWAY
        parts:
          - order: 1
            role: repair DNA synthesis
            node:
              id: repair_gap_filling
              label: DNA polymerase-dependent gap filling
              module_type: REACTION
              annotons:
                - id: dna_polymerase_repair_synthesis
                  label: DNA-directed DNA polymerase
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: bacterial replicative DNA polymerase catalytic subunits
                      term:
                        id: PANTHER:PTHR32294
                        label: DNA POLYMERASE III SUBUNIT ALPHA
                      representative_members:
                        - preferred_term: PSEPK DnaE
                          term:
                            id: UniProtKB:Q88MG5
                            label: DNA polymerase III subunit alpha
                        - preferred_term: Escherichia coli DnaE
                          term:
                            id: UniProtKB:P10443
                            label: DNA polymerase III subunit alpha
                  function:
                    preferred_term: DNA-directed DNA polymerase activity
                    term:
                      id: GO:0003887
                      label: DNA-directed DNA polymerase activity
                  role_description: Fills the excision-generated single-stranded gap using the intact strand as template.
          - order: 2
            role: nick sealing
            node:
              id: repair_nick_ligation
              label: NAD-dependent DNA ligation
              module_type: REACTION
              annotons:
                - id: ligA_repair_ligation
                  label: NAD-dependent DNA ligase
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: bacterial NAD-dependent DNA ligases
                      term:
                        id: PANTHER:PTHR23389
                        label: NAD-dependent DNA ligase
                      representative_members:
                        - preferred_term: PSEPK LigA
                          term:
                            id: UniProtKB:Q88F25
                            label: DNA ligase
                        - preferred_term: Escherichia coli LigA
                          term:
                            id: UniProtKB:P15042
                            label: DNA ligase
                  function:
                    preferred_term: DNA ligase (NAD+) activity
                    term:
                      id: GO:0003911
                      label: DNA ligase (NAD+) activity
                  role_description: Seals the remaining nick after repair synthesis.
        connections:
          - source: repair_gap_filling
            target: repair_nick_ligation
            connection_type: PROVIDES_INPUT_FOR
            description: Gap filling leaves a nick that is sealed by DNA ligase.
  connections:
    - source: mismatch_recognition
      target: mutl_incision
      connection_type: PRECEDES
      description: Mismatch-bound MutS recruits and activates MutL.
    - source: mutl_incision
      target: mismatch_excision
      connection_type: PROVIDES_INPUT_FOR
      description: MutL nicking creates the entry point for unwinding and excision.
    - source: mismatch_excision
      target: repair_synthesis_and_sealing
      connection_type: PROVIDES_INPUT_FOR
      description: Excision generates the DNA gap restored by polymerase and ligase.
  notes: >-
    Exact UniProt exemplars delimit every family-level role without restricting
    the module taxonomically or importing the MutH incision mechanism.
    Exonuclease I, RecJ, and Exonuclease VII are orientation-dependent
    alternative implementations rather than universally obligatory proteins.
    DnaN supplies the replisome-coupled clamp context, while SSB stabilizes the
    exposed excision intermediate and coordinates processing proteins. DnaN,
    SSB, DnaE, and LigA are shared repair and replication machinery included to
    complete the pathway, not MMR-specific proteins. PTNs encountered in source
    GOA are TreeGrafter or combined-IEA provenance only; no ancestral node is
    asserted without verified PAINT IBD evidence.
