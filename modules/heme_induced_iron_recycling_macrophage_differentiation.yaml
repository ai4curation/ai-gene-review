  parts:
    - order: 1
      role: heme export from the phagolysosome
      node:
        id: phagolysosomal_heme_export
        label: HRG1 exports heme from the phagolysosome
        module_type: TRANSPORT_STEP
        description: >-
          Haemoglobin is digested in the phagolysosome and its heme is released
          there. Heme oxygenase faces the cytosol, so heme must cross the
          phagolysosomal membrane. HRG1 is recruited to that membrane during
          erythrophagocytosis and moves heme into the cytosol.
        concepts:
          - preferred_term: heme export from vacuole to cytoplasm
            term:
              id: GO:0140357
              label: heme export from vacuole to cytoplasm
        annotons:
          - id: hrg1_heme_transporter
            label: HRG1 heme transporter
            participant:
              selector_type: FAMILY
              family:
                preferred_term: HRG1 heme transporter
                term:
                  id: PANTHER:PTHR31525:SF1
                  label: HEME TRANSPORTER HRG1
                representative_members:
                  - preferred_term: Slc48a1 (mouse)
                    term:
                      id: UniProtKB:Q9D8M3
                      label: Heme transporter HRG1
                  - preferred_term: SLC48A1 (human)
                    term:
                      id: UniProtKB:Q6P1K1
                      label: Heme transporter HRG1
                  - preferred_term: hrg-1 (C. elegans)
                    term:
                      id: UniProtKB:Q21642
                      label: Heme transporter hrg-1
                notes: hrg-1 shows the family is shared with nematodes, where it imports heme; it is not claimed to act in phagolysosomes.
            function:
              preferred_term: heme transmembrane transporter activity
              term:
                id: GO:0015232
                label: heme transmembrane transporter activity
            locations:
              - preferred_term: phagolysosome membrane
                term:
                  id: GO:0061474
                  label: phagolysosome membrane
            role_description: >-
              Delivers heme from engulfed erythrocytes to the cytosol. Its
              knockdown blunts induction of heme-responsive genes during
              erythrophagocytosis.
            evidence:
              - source_id: PMID:23395172
                title: HRG1 is essential for heme transport from the phagolysosome of macrophages during erythrophagocytosis.
                statement: HRG1 moves to the phagolysosome only when red cells, not beads, are engulfed.
                supporting_text: Hrg1 was recruited to the phagolysosomal membranes specifically during phagocytosis of RBCs but not latex beads
              - source_id: PMID:23395172
                title: HRG1 is essential for heme transport from the phagolysosome of macrophages during erythrophagocytosis.
                statement: The loss-of-function readout is indirect, through heme-responsive transcripts.
                supporting_text: Hrg1 knockdown resulted in a significant attenuation of Hmox1 and Fpn1 mRNA induction during EP
    - order: 2
      role: heme sensing
      node:
        id: bach1_derepression
        label: Heme-triggered BACH1 degradation de-represses Spic
        module_type: REGULATORY_STEP
        description: >-
          BACH1 represses Spic. Heme binds BACH1 through its C-terminal
          cysteine-proline motifs and triggers its proteasomal degradation. A
          BACH1 mutant without these motifs resists degradation and blocks Spic
          induction completely.
        annotons:
          - id: bach1_repressor
            label: BACH1 heme-sensing repressor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: BACH1
                term:
                  id: PANTHER:PTHR46105:SF1
                  label: TRANSCRIPTION REGULATOR PROTEIN BACH1
                representative_members:
                  - preferred_term: Bach1 (mouse)
                    term:
                      id: UniProtKB:P97302
                      label: Transcription regulator protein BACH1
                  - preferred_term: BACH1 (human)
                    term:
                      id: UniProtKB:O14867
                      label: Transcription regulator protein BACH1
            function:
              preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
              term:
                id: GO:0001227
                label: DNA-binding transcription repressor activity, RNA polymerase II-specific
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              The heme sensor of the programme. Bach1-/- macrophages express Spic
              without heme, and a degradation-resistant mutant blocks induction.
              Whether BACH1 binds the Spic locus directly is not known.
            evidence:
              - source_id: PMID:24630724
                title: Heme-mediated SPI-C induction promotes monocyte differentiation into iron-recycling macrophages.
                statement: BACH1 represses Spic and heme relieves the repression.
                supporting_text: These results demonstrate that Bach1 is a transcriptional repressor of Spic that is inhibited by heme.
              - source_id: PMID:24630724
                title: Heme-mediated SPI-C induction promotes monocyte differentiation into iron-recycling macrophages.
                statement: The cysteine-proline motifs are required for heme to induce Spic.
                supporting_text: This demonstrates the requirement of heme-BACH1 interactions via CP motifs for heme-mediated Spic expression.
    - order: 3
      role: lineage transcription factor
      node:
        id: spic_differentiation
        label: SPI-C drives iron-recycling macrophage differentiation
        module_type: DEVELOPMENTAL_PROCESS
        description: >-
          De-repressed SPI-C drives monocytes to become red pulp macrophages and
