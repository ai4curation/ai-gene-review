knowledge_gaps:
  - gap_statement: >-
      How BACH1 represses Spic, and which heme-dependent step besides BACH1
      degradation is needed for red pulp macrophage development, are unknown.
    boundary: >-
      The Spic locus has no classic MARE, NRF2 is not needed, and Bach1-/- mice
      have normal red pulp macrophage numbers, so the authors propose an
      additional heme-dependent, BACH1-independent step.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: The chain heme to BACH1 to SPIC is incomplete, and BACH1 may act indirectly on Spic.
    resolution: >-
      ChIP for BACH1 and its partner at the Spic locus in monocytes, and a
      screen for heme-induced, BACH1-independent factors needed for red pulp
      macrophage maturation (TremL4 is one candidate output).
    provenance:
      - reference_id: PMID:24630724
        supporting_text: RPM development may involve an additional step that is heme-dependent but Bach1-independent
