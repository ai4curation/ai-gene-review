id: MODULE:heme_induced_iron_recycling_macrophage_differentiation
title: Heme-induced iron-recycling macrophage differentiation
description: >-
  Macrophages that engulf aged or damaged red blood cells digest them in the
  phagolysosome and release heme. The heme transporter HRG1 carries heme out of
  the phagolysosome into the cytosol. Heme then switches on a differentiation
  programme. The transcriptional repressor BACH1 normally keeps the gene for the
  transcription factor SPI-C silent. Heme binds BACH1 through its
  cysteine-proline motifs and triggers its proteasomal degradation, which
  de-represses Spic. SPI-C drives monocytes to become iron-recycling macrophages:
  splenic red pulp macrophages and VCAM1-positive bone marrow macrophages. The
  same heme signal also de-represses the iron-recycling enzymes and transporters
  these cells use, heme oxygenase 1 and ferroportin.
status: DRAFT
scope: ABSTRACT
references:
  - id: PMID:24630724
    title: Heme-mediated SPI-C induction promotes monocyte differentiation into iron-recycling macrophages.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached and read in full. Mouse. Bach1-/-
        BMDM, a degradation-resistant BACH1 CP-to-AP mutant, Spic-igfp reporter
        mice, Spic-/- and Ho1-/- mice and adoptive transfer of monocytes.
  - id: PMID:23395172
    title: HRG1 is essential for heme transport from the phagolysosome of macrophages during erythrophagocytosis.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached and read in full. Mouse BMDM
        erythrophagocytosis with latex-bead controls; Hrg1 siRNA; heme-transport
        reporters in yeast and macrophages. No knockout animal in this paper.
  - id: PMID:20179090
    title: Heme controls ferroportin1 (FPN1) transcription involving Bach1, Nrf2 and a MARE/ARE sequence motif at position -7007 of the FPN1 promoter.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; abstract only in cache. RAW264.7 cells; BACH1 represses
        and NRF2 activates Fpn1 transcription in response to heme.
evidence:
  - source_id: PMID:24630724
    title: Heme-mediated SPI-C induction promotes monocyte differentiation into iron-recycling macrophages.
    statement: The authors' summary of the programme in vivo.
    supporting_text: Bach1 inhibition at sites of erythrophagocytosis controls RPM and BMM development through derepression of Spic.
  - source_id: PMID:24630724
    title: Heme-mediated SPI-C induction promotes monocyte differentiation into iron-recycling macrophages.
    statement: The signal is heme itself, not a heme breakdown product.
    supporting_text: Bilirubin and biliverdin failed to induce SPIC-EGFP in Spicigfp/igfp BMDM
notes: >-
  Boundary: this module starts with heme in the phagolysosome of a macrophage
  that has engulfed an erythrocyte, and ends with a differentiated
  iron-recycling macrophage that exports iron. Engulfment of the erythrocyte
  and its digestion belong to the phagocytosis modules.

  The programme is defined by heme, not by phagocytosis. Heme released by
  haemolysis induces Spic in the same way. Engulfed erythrocytes are the main
  physiological source of heme for these cells.

  GO has no term for red pulp macrophage differentiation. The module concept is
  GO:0030225 macrophage differentiation, and "splenic red pulp macrophage
  differentiation" (is_a GO:0030225, cell type CL:0000874) has been proposed to
  the GO editors in go-ontology#32748.

  The two arms are supported by separate papers in different cells. HRG1 work
  is in bone-marrow-derived macrophages and spleen and liver macrophages
  without red pulp markers; the BACH1/SPIC work is in bone-marrow-derived
  macrophages, monocytes and chimeric mice. The link between them, phagolysosomal
  heme reaching BACH1, is inferred.

  Taxon scope: SPI-C is a vertebrate ETS factor and the programme is shown only
  in mouse. HRG1 is conserved more widely (C. elegans hrg-1 imports heme), so the
  heme-export step is broader than the differentiation programme.
