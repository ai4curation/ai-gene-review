id: MODULE:mitochondrial_calcium_uniporter
title: Mitochondrial calcium uniporter and NCLX efflux — MCU-EMRE pore with MICU1-MICU2/MICU3 gatekeepers and the dominant-negative MCUB subunit for calcium uptake into the matrix, and SLC8B1 (NCLX) sodium/lithium-calcium exchange for efflux (human)
description: >-
  Mitochondria take up calcium from the cytosol across the inner membrane through the
  mitochondrial calcium uniporter, a highly calcium-selective channel driven by the
  negative-inside membrane potential set up by the respiratory chain. In humans the
  uniporter holocomplex (uniplex) contains four MCU pore subunits, the small single-pass
  subunit EMRE (SMDT1), which is essential for MCU opening in animals and links the pore to
  the gatekeepers, and a disulfide-linked heterodimer of EF-hand gatekeepers in the
  intermembrane space: MICU1 with MICU2 in most tissues, or MICU1 with MICU3 in brain. At
  resting cytosolic calcium the calcium-free gatekeepers occlude the pore, so little calcium
  enters; when local calcium rises, for example near IP3 receptors at ER-mitochondria
  contacts, calcium binding to the EF-hands opens the channel, giving a sigmoidal response
  that prevents overload while letting mitochondria respond to calcium signals. MCUB, a
  paralog of MCU, enters the pore tetramer as a dominant-negative subunit that lowers
  uniporter activity and gatekeeper association, and is induced after cardiac stress.
  Matrix calcium activates dehydrogenases of the citric acid cycle and so couples calcium
  signals to ATP production; it also shapes cytosolic calcium transients and, in excess,
  triggers the permeability transition and cell death. Calcium leaves the matrix mainly
  through the inner-membrane sodium/calcium exchanger NCLX (SLC8B1), which also accepts
  lithium, so that uptake and efflux together set matrix calcium.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001139
    title: calcium transport pathway
    statement: >-
      RGD Pathway Ontology record for the calcium transport pathway (55 human genes curated
      by RGD). Its text describes mitochondrial calcium uptake by the MCU uniporter complex
      across the inner membrane and release by a Na+/Li+/Ca2+ exchanger (diagram gene link
      Slc24a6, the former name of SLC8B1). This module models that mitochondrial system
      only; the other transport systems of the record are separate modules or unmodelled
      (see notes). Human genes in scope from RGD's list: MCU SLC8B1. Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001139.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: RGD's description of mitochondrial uptake through the MCU complex.
    supporting_text: is mediated by the Mcu mitochondrial uniporter complex - a selective channel that moves the ion across the mitochondrial inner membrane
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: RGD's description of mitochondrial calcium efflux.
    supporting_text: In the opposite direction, a Na+/Li+/ Ca2+ exchanger (Slc24a6) promotes release of the metal ion
  - source_id: GO:0006816
    title: calcium ion transport
    statement: >-
      The GO process mapped to PW:0001139 (skos:closeMatch) in the project's PW-GO mappings
      (projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). Too broad for this module,
      whose concept is its descendant GO:0006851 mitochondrial calcium ion transmembrane
      transport (via GO:0070588), checked in go-basic 2026-07-26.
  - source_id: GO:0006851
    title: mitochondrial calcium ion transmembrane transport
    statement: >-
      Module concept covering both directions: its children GO:0036444 calcium import into
      the mitochondrion (uniporter) and GO:0099093 calcium export from the mitochondrion
      (NCLX). Carried in GOA by MCU (IDA PMID:21685888, PMID:24560927), SMDT1 (IMP), MICU2
      (IDA) and SLC8B1 (IDA).
  - source_id: GO:1990246
    title: uniplex complex
    statement: >-
      The uniporter holocomplex; GOA part_of rows (IDA) for MCU, SMDT1, MICU1, MICU2 and MCUB
      (PMID:24231807 and others). Used as the concept of the uptake part.
  - source_id: PMID:24231807
    title: EMRE is an essential component of the mitochondrial calcium uniporter complex.
    statement: >-
      Affinity purification of the human uniplex recovers MCU, MCUB, EMRE, MICU1 and MICU2;
      this is the RGD-cited reference (Sancak et al. 2013) for the complex composition.
    supporting_text: Quantitative mass spectrometry of affinity-purified uniplex recovered MICU1 and MICU2, MCU and its paralog MCUb, and essential MCU regulator (EMRE), a previously uncharacterized protein
  - source_id: PMID:32494073
    title: Structure and mechanism of the mitochondrial Ca(2+) uniporter holocomplex.
    statement: Cryo-EM structures of the human uniplex define its four core components.
    supporting_text: 'In mammals, the uniporter complex (uniplex) contains four core components: the pore-forming MCU protein, the gatekeepers MICU1 and MICU2, and an auxiliary subunit, EMRE, essential for Ca2+ transport'
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001139 (calcium transport pathway) through
  the RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml,
  mapped GO:0006816 calcium ion transport). RGD curates 55 human genes to PW:0001139, mixing
  unrelated channel, pump and exchanger families, so the project models the record as one
  human module per transport system. This module is the mitochondrial system. Sibling
  modules from the same record: er_calcium_store_cycling (IP3 receptor and ryanodine
  receptor release, SERCA re-uptake), store_operated_calcium_entry and
  plasma_membrane_calcium_extrusion; they are named here rather than linked by module_ref
  because they were drafted in parallel. PW:0001139 is the only PW evidence source_id; its
  sub-pathway PW:0001140 is mentioned here in prose only.


  (1) MEMBERS BEYOND RGD'S LIST. RGD lists only MCU and SLC8B1 (as Slc24a6). SMDT1 (EMRE),
  MICU1, MICU2, MICU3 and MCUB are added on direct human evidence: the uniplex purification
  that RGD itself cites (PMID:24231807, Sancak et al. 2013), the human holocomplex
  structure (PMID:32494073), MICU1-MICU2 reconstitution (PMID:24560927), MICU3 (PMID:29725115)
  and MCUB (PMID:31533452), with experimental GOA for each (see role descriptions). RGD's
  other uniporter reference (Raffaello et al. 2013, EMBO J, the MCUb discovery paper) is not
  cached and not cited. MCUR1, SLC25A23 and the m-AAA protease AFG3L2-SPG7 that degrades
  EMRE are reported uniporter regulators but are not part of the minimal human uniplex
  defined by the structure, so they are left out. LETM1, proposed as a calcium/proton exchanger, is left out: the SLC8B1 gene
  review cites evidence that NCLX, not LETM1, mediates calcium extrusion. The outer
  membrane passage through VDAC is not modelled.


  (2) RELATION TO THE DROSOPHILA MODULE. modules/dmel_mitochondrial_calcium_uniporter.yaml
  models the fly uniporter from FlyBase gene groups. This module reuses its structure (a
  pore part with MCU and EMRE, then a MICU gatekeeper variant set) but is not a duplicate:
  it is human, adds MCUB and NCLX efflux, and models each subunit as its own annoton rather
  than as complex active units, so that sub-compartment locations, processes and GO-CAM
  activities can be attached per subunit. The fly MICU1 alternative CG4704 has no human
  counterpart here; the human axis is MICU2 versus MICU3 as MICU1's partner.


  (3) LOCATIONS (CLAUDE.md organelle rules). No root mitochondrion term is used; every
  location is a sub-compartment backed by direct evidence on the human protein: inner
  membrane for MCU, EMRE, MCUB and NCLX (IDA/EXP rows, transmembrane subunits); inner
  membrane for MICU3 (only NAS/TAS and the GO-CAM, so not refined further); intermembrane
  space for MICU1 and MICU2 (EXP/IDA protease-protection and structural rows, consistent
  with their EF-hands facing the intermembrane space). The matrix is the destination of the
  transported calcium, not a location of any subunit. Calcium substrates are labelled
  intermembrane space to matrix because the inner membrane is the barrier crossed.


  (4) MOLECULAR FUNCTIONS. From experimental GOA (QuickGO, November 2026) or the gene's
  review core function, checked in go-basic 2026-07-26 (none obsolete). MCU: GO:0005262
  calcium channel activity (IDA, many). GOA also has GO:0015292 uniporter activity (IDA
  PMID:21685886, PMID:21685888, PMID:24560927), but in GO that term is_a GO:0015291
  secondary active transmembrane transporter activity, a carrier term, whereas the
  uniporter is a pore; GO:0005262 matches the electrophysiology, the production GO-CAMs and
  the fly module. EMRE: GO:0099103 channel activator activity (IDA); the GO-CAMs use
  GO:0030674 protein-macromolecule adaptor activity, also IDA in GOA. MICU1, MICU2, MICU3:
  GO:0061891 calcium ion sensor activity (IDA); MICU1's calcium channel inhibitor activity
  (GO:0019855 IDA; production model gomodel:65d7e4ac00001584) is the calcium-free state of
  the same gating role. MCUB: GO:0019855 calcium channel inhibitor activity (IDA). NCLX:
  GO:0015368 calcium:monoatomic cation antiporter activity, following the SLC8B1 gene
  review; the IDA child GO:0005432 calcium:sodium antiporter activity would also be valid.
  Substrates grounded to ChEBI with labels checked in OLS (November 2026): calcium(2+)
  CHEBI:29108, sodium(1+) CHEBI:29101; the exchange stoichiometry (3 Na+ : 1 Ca2+ is
  usually cited) and lithium are not encoded.


  (5) BOUNDARY. Upstream: calcium delivered at ER-mitochondria contacts by IP3 receptors
  (er_calcium_store_cycling) and the membrane potential generated by the respiratory chain
  are context, not parts. Downstream: activation of matrix dehydrogenases and the
  permeability transition are outputs, not parts. The gatekeeper connection is recorded as
  POSITIVELY_REGULATES because calcium-bound MICU dimers open the pore; the calcium-free
  inhibition is described in the node and connection text.


  (6) GO-CAM LINKS. Pinned: gomodel:65d7e4ac00001363 (uniplex uptake; MCU, SMDT1, MICU1,
  MICU2), gomodel:65d7e4ac00002435 (MICU3 in the central nervous system; MICU1, MICU3),
  gomodel:65d7e4ac00002808 (MCUB inhibition), and the seed's best_gocam
  gomodel:65d7e4ac00002121 (ITPR1-HSPA9-VDAC1 calcium transfer in apoptosis), pinned on MCU
  only, because its MCU activity is the uptake step modelled here. Not pinned but relevant:
  gomodel:65d7e4ac00001584 (MICU1 occludes MCU without calcium), gomodel:65d7e4ac00002910
  (AKT1 phosphorylation of MICU1) and gomodel:65c57c3400001115 (AFG3L2-SPG7 cleavage of EMRE
  and MCU), which add regulation outside this module. No production GO-CAM contains SLC8B1.


  (7) POSSIBLE UPSTREAM ISSUES. SLC8B1 has GO:0005886 plasma membrane (TAS, Reactome
  R-HSA-425822), from its earlier description as a plasma membrane NCKX6 exchanger; the
  protein is mitochondrial (EXP inner membrane, cristae), so the row may be stale. SMDT1
  has GO:0005759 mitochondrial matrix (TAS, Reactome R-HSA-8949649) beside many inner
  membrane rows; EMRE is a transmembrane subunit, so matrix is at most its N-terminal
  region. Both are low-confidence observations, not verified against the Reactome entries.


  (8) GROUNDING. UniProt accessions from genes/human/<GENE>/<GENE>-uniprot.txt for MICU1
  and SLC8B1, the rest from UniProt REST (reviewed human entries). Only MICU1 and SLC8B1
  have gene reviews; MCU, SMDT1, MICU2, MICU3 and MCUB lack one, which is curation
  follow-up for the project plan. No PANTHER or PTN ids are asserted.
module:
  id: mitochondrial_calcium_uniporter
  label: Mitochondrial calcium uniporter and NCLX efflux
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: mitochondrial calcium ion transmembrane transport
      term:
        id: GO:0006851
        label: mitochondrial calcium ion transmembrane transport
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: mitochondrial inner membrane
        term:
          id: GO:0005743
          label: mitochondrial inner membrane
  parts:
    - order: 1
      role: calcium-conducting pore of the uniporter
      node:
        id: mcu_emre_pore
        label: MCU-EMRE pore
        module_type: PROTEIN_COMPLEX
        description: >-
          Four MCU subunits form the calcium-selective pore in the inner membrane, each bound
          by an EMRE subunit whose transmembrane helix holds MCU open and whose matrix and
          intermembrane-space regions link the pore to the MICU gatekeepers. Both are
          required: MCU without EMRE does not conduct calcium in human cells.
        concepts:
          - preferred_term: uniplex complex
            term:
              id: GO:1990246
              label: uniplex complex
        annotons:
          - id: mcu_pore_subunit
            label: MCU pore-forming subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MCU
                term:
                  id: UniProtKB:Q8NE86
                  label: Calcium uniporter protein, mitochondrial
            function:
              preferred_term: calcium channel activity
              term:
                id: GO:0005262
                label: calcium channel activity
              substrates:
                - preferred_term: calcium(2+) (intermembrane space)
                  term:
                    id: CHEBI:29108
                    label: calcium(2+)
              products:
                - preferred_term: calcium(2+) (mitochondrial matrix)
                  term:
                    id: CHEBI:29108
                    label: calcium(2+)
            processes:
              - preferred_term: calcium import into the mitochondrion
                term:
                  id: GO:0036444
                  label: calcium import into the mitochondrion
            locations:
              - preferred_term: mitochondrial inner membrane
                term:
                  id: GO:0005743
                  label: mitochondrial inner membrane
            role_description: >-
              Pore-forming subunit. Function, process and location are experimental in GOA
              (GO:0005262 IDA PMID:21685888, PMID:24560927, PMID:32494073 and others, IMP
              PMID:23755363; GO:0036444 IDA, many papers; GO:0005743 IDA PMID:21685886,
              PMID:21685888 and others). GOA also has GO:0015292 uniporter activity (IDA);
              see notes for the choice of GO:0005262. No MCU gene review yet.
            evidence:
              - source_id: PMID:23755363
                statement: Mitoplast patch clamp identifies MCU as the pore of the uniporter current.
                supporting_text: These analyses establish that MCU encodes the pore-forming subunit of the uniporter channel
              - source_id: PMID:21685888
                statement: Purified MCU forms a channel with uniporter properties in bilayers.
                supporting_text: The purified MCU protein showed channel activity in planar lipid bilayers, with electrophysiological properties and inhibitor sensitivity of the uniporter
              - source_id: PMID:21685886
                statement: MCU silencing abolishes uptake without loss of membrane potential.
                supporting_text: Silencing MCU in cultured cells or in vivo in mouse liver severely abrogates mitochondrial Ca(2+) uptake, whereas mitochondrial respiration and membrane potential remain fully intact
            gocam_associations:
              - model: gomodel:65d7e4ac00001363
                activity: gomodel:65d7e4ac00001363/65d7e4ac00001404
                title: MCU calcium channel activity (GO:0005262), part of GO:0036444 calcium import into the mitochondrion, in the human uniplex model
              - model: gomodel:65d7e4ac00002121
                activity: gomodel:65d7e4ac00002121/65d7e4ac00002883
                title: MCU calcium channel activity (GO:0005262) downstream of ITPR1-HSPA9-VDAC1 calcium transfer at ER-mitochondria contacts in apoptosis (Human)
          - id: emre_pore_subunit
            label: EMRE (SMDT1) essential pore subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SMDT1
                term:
                  id: UniProtKB:Q9H4I9
                  label: Essential MCU regulator, mitochondrial
            function:
              preferred_term: channel activator activity
              term:
                id: GO:0099103
                label: channel activator activity
            processes:
              - preferred_term: calcium import into the mitochondrion
                term:
                  id: GO:0036444
                  label: calcium import into the mitochondrion
            locations:
              - preferred_term: mitochondrial inner membrane
                term:
                  id: GO:0005743
                  label: mitochondrial inner membrane
            role_description: >-
              Metazoan-specific single-pass subunit required for MCU opening and for MCU
              binding to MICU1/MICU2. Function GO:0099103 is experimental in GOA (IDA
              PMID:31080062, PMID:32315830, PMID:33296646), as are GO:0036444 (IDA) and
              GO:0005743 (IDA PMID:24231807 and others). The production GO-CAMs type EMRE
              with GO:0030674 protein-macromolecule adaptor activity (also IDA in GOA); the
              activator term is used because it names the role that makes EMRE essential.
              RGD does not list SMDT1; it is added on this evidence. No SMDT1 gene review
              yet.
            evidence:
              - source_id: PMID:24231807
                statement: Without EMRE, MCU is present and oligomerised but conducts no current.
                supporting_text: In its absence, uniporter channel activity was lost despite intact MCU expression and oligomerization
              - source_id: PMID:33296646
                statement: EMRE controls MCU opening through its transmembrane helix.
                supporting_text: we demonstrate that EMRE controls MCU activity via its transmembrane helix, while using an N-terminal PKP motif to strengthen binding with MCU
            gocam_associations:
              - model: gomodel:65d7e4ac00001363
                activity: gomodel:65d7e4ac00001363/65d7e4ac00001394
                title: SMDT1 protein-macromolecule adaptor activity (GO:0030674), part of GO:0036444, in the human uniplex model
    - order: 2
      role: calcium-sensing gatekeeping of the pore from the intermembrane space
      node:
        id: micu_gatekeepers
        label: MICU gatekeeper heterodimers
        module_type: PROTEIN_COMPLEX
        description: >-
          Disulfide-linked heterodimers of EF-hand proteins sit over the pore entrance in the
          intermembrane space. Calcium-free, they occlude the pore and set the uptake
          threshold; calcium binding to the EF-hands releases the block. MICU1 is common to
          both dimers.
        variant_sets:
          - id: micu_dimers
            label: MICU1 partner (MICU2 or MICU3)
            axis: gatekeeper dimer composition and tissue
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            variants:
              - id: micu1_micu2_variant
                label: MICU1-MICU2 (most tissues)
                module_type: PROTEIN_COMPLEX
                annotons:
                  - id: micu1_sensor_with_micu2
                    label: MICU1 calcium sensor (MICU1-MICU2 dimer)
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MICU1
                        term:
                          id: UniProtKB:Q9BPX6
                          label: Calcium uptake protein 1, mitochondrial
                    function:
                      preferred_term: calcium ion sensor activity
                      term:
                        id: GO:0061891
                        label: calcium ion sensor activity
                    processes:
                      - preferred_term: calcium import into the mitochondrion
                        term:
                          id: GO:0036444
                          label: calcium import into the mitochondrion
                    locations:
                      - preferred_term: mitochondrial intermembrane space
                        term:
                          id: GO:0005758
                          label: mitochondrial intermembrane space
                    role_description: >-
                      Calcium sensor and, calcium-free, inhibitor of the pore. Function and
                      process follow the first core function of the MICU1 gene review
                      (GO:0061891 IDA, many papers; GO:0036444); the second core function,
                      GO:0019855 calcium channel inhibitor activity, is the calcium-free state
                      of the same role and is described here rather than given another
                      annoton. Intermembrane space is GOA EXP/IDA (PMID:23747253,
                      PMID:24231807 and others).
                    evidence:
                      - source_id: file:human/MICU1/MICU1-ai-review.yaml
                        statement: Core function of the MICU1 gene review.
                        supporting_text: MICU1 is the calcium sensor of the mitochondrial calcium uniporter.
                      - source_id: PMID:24560927
                        statement: Opposite effects of MICU2 and MICU1 at low and high calcium.
                        supporting_text: At low [Ca(2+)], the dominant effect of MICU2 largely shuts down MCU activity; at higher [Ca(2+)], the stimulatory effect of MICU1 allows the prompt response of mitochondria to Ca(2+) signals generated in the cytoplasm
                    gocam_associations:
                      - model: gomodel:65d7e4ac00001363
                        activity: gomodel:65d7e4ac00001363/65d7e4ac00001420
                        title: MICU1 calcium ion sensor activity (GO:0061891) in the human uniplex model
                  - id: micu2_sensor
                    label: MICU2 calcium sensor (MICU1-MICU2 dimer)
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MICU2
                        term:
                          id: UniProtKB:Q8IYU8
                          label: Calcium uptake protein 2, mitochondrial
                    function:
                      preferred_term: calcium ion sensor activity
                      term:
                        id: GO:0061891
                        label: calcium ion sensor activity
                    processes:
                      - preferred_term: calcium import into the mitochondrion
                        term:
                          id: GO:0036444
                          label: calcium import into the mitochondrion
                    locations:
                      - preferred_term: mitochondrial intermembrane space
                        term:
                          id: GO:0005758
                          label: mitochondrial intermembrane space
                    role_description: >-
                      Inhibitory partner of MICU1 that keeps the pore closed at resting
                      calcium. Function, process and location are experimental in GOA
                      (GO:0061891 IDA PMID:28615291, PMID:32494073 and others; GO:0036444
                      IDA; GO:0005758 EXP/IDA PMID:24231807, PMID:24560927 and others). RGD
                      does not list MICU2; it is added on this evidence. No MICU2 gene
                      review yet.
                    evidence:
                      - source_id: PMID:24560927
                        statement: MICU1 and MICU2 are both regulated by calcium through their EF-hands.
                        supporting_text: Both MICU1 and MICU2 are regulated by calcium through their EF-hand domains, thus accounting for the sigmoidal response of MCU to [Ca(2+)] in situ and allowing tight physiological control
                    gocam_associations:
                      - model: gomodel:65d7e4ac00001363
                        activity: gomodel:65d7e4ac00001363/65d7e4ac00001427
                        title: MICU2 calcium ion sensor activity (GO:0061891) in the human uniplex model
              - id: micu1_micu3_variant
                label: MICU1-MICU3 (brain)
                module_type: PROTEIN_COMPLEX
                annotons:
                  - id: micu1_sensor_with_micu3
                    label: MICU1 calcium sensor (MICU1-MICU3 dimer)
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MICU1
                        term:
                          id: UniProtKB:Q9BPX6
                          label: Calcium uptake protein 1, mitochondrial
                    function:
                      preferred_term: calcium ion sensor activity
                      term:
                        id: GO:0061891
                        label: calcium ion sensor activity
                    processes:
                      - preferred_term: calcium import into the mitochondrion
                        term:
                          id: GO:0036444
                          label: calcium import into the mitochondrion
                    locations:
                      - preferred_term: mitochondrial intermembrane space
                        term:
                          id: GO:0005758
                          label: mitochondrial intermembrane space
                    role_description: As in the MICU1-MICU2 variant; MICU1 pairs with MICU3 in neurons.
                    gocam_associations:
                      - model: gomodel:65d7e4ac00002435
                        activity: gomodel:65d7e4ac00002435/65d7e4ac00002458
                        title: MICU1 calcium ion sensor activity (GO:0061891) in the human MICU3 model
                  - id: micu3_sensor
                    label: MICU3 calcium sensor (MICU1-MICU3 dimer)
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MICU3
                        term:
                          id: UniProtKB:Q86XE3
                          label: Calcium uptake protein 3, mitochondrial
                    function:
                      preferred_term: calcium ion sensor activity
                      term:
                        id: GO:0061891
                        label: calcium ion sensor activity
                    processes:
                      - preferred_term: calcium import into the mitochondrion
                        term:
                          id: GO:0036444
                          label: calcium import into the mitochondrion
                    locations:
                      - preferred_term: mitochondrial inner membrane
                        term:
                          id: GO:0005743
                          label: mitochondrial inner membrane
                    role_description: >-
                      Brain-enriched MICU1 partner that enhances uptake. Function and process
                      are experimental in GOA (GO:0061891 IDA PMID:29725115, PMID:30699349;
                      GO:0036444 IDA PMID:29725115). Location is the inner membrane, as in GOA
                      (NAS/TAS) and the production GO-CAM; no MICU3-specific assay places it
                      in the intermembrane space, so the sub-compartment given for MICU1 and
                      MICU2 is not transferred (see notes). RGD does not list MICU3; it is added on this evidence. No
                      MICU3 gene review yet.
                    evidence:
                      - source_id: PMID:29725115
                        statement: MICU3 dimerises with MICU1 and enhances MCU-dependent uptake.
                        supporting_text: We show that MICU3 forms a disulfide bond-mediated dimer with MICU1, but not with MICU2, and it acts as enhancer of MCU-dependent mitochondrial Ca2+ uptake
                    gocam_associations:
                      - model: gomodel:65d7e4ac00002435
                        activity: gomodel:65d7e4ac00002435/65d7e4ac00002465
                        title: MICU3 calcium ion sensor activity (GO:0061891), MICU3 promotes uptake in the central nervous system (Human)
    - order: 3
      optional: true
      role: dominant-negative pore subunit limiting uptake
      node:
        id: mcub_inhibition
        label: MCUB dominant-negative pore subunit
        module_type: REGULATORY_STEP
        description: >-
          MCUB replaces MCU subunits in the pore tetramer, reduces gatekeeper association and
          lowers uniporter current. Optional because its expression varies between tissues
          and conditions.
        annotons:
          - id: mcub_pore_inhibitor
            label: MCUB uniporter inhibitor
            participant:
