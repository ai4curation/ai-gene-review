                notes: 'The PAINT PTN001852279 assertion covers the kinase activity of the bifunctional
                  ThrA lineage. P00561 is this target among the experimentally grounded descendants, which
                  is expected and not circular. Its N-terminal kinase domain activates aspartate; the
                  C-terminal homoserine reaction is a separate activity.


                  PMID:11368768 determines the kinetic parameters of the E. coli threonine-pathway reactions
                  under a common physiological assay regime, including the first aspartate-activation
                  step and feedback inhibition. This supports the ThrA kinase activity alongside the independently
                  curated ATP/aspartate reaction; the study is not treated as a localization assay.


                  RHEA:23776 and the IPR001341/IPR018042 kinase signatures describe ATP-dependent aspartate
                  activation in the N-terminal portion of this fusion. The reaction is independently established
                  for ThrA; a second dehydrogenase domain does not erase the kinase activity.


                  The Q9SA18 transfer concerns the conserved aspartate-kinase reaction of Arabidopsis
                  AKHSDH1. PMID:16216875 tests that donor isoform directly, and PMID:11368768 independently
                  characterizes the E. coli pathway. The transfer does not import plant chloroplast location
                  or isoform-specific allosteric responses into ThrA.'
