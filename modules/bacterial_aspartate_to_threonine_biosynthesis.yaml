              required_function:
                preferred_term: homoserine kinase activity
                term:
                  id: GO:0004413
                  label: homoserine kinase activity
              family:
                preferred_term: Pseudomonas-type homoserine kinase family
                term:
                  id: InterPro:IPR050249
                  label: Pseudomonas-type ThrB
                representative_members:
                  - preferred_term: PSEPK ThrB
                    term:
                      id: UniProtKB:Q88RK8
                      label: Homoserine kinase
                    description: Pseudomonas putida KT2440 thrB/PP_0121.
            function:
              preferred_term: homoserine kinase activity
              term:
                id: GO:0004413
                label: homoserine kinase activity
              substrates:
                - preferred_term: L-homoserine
                - preferred_term: ATP
              products:
                - preferred_term: O-phospho-L-homoserine
