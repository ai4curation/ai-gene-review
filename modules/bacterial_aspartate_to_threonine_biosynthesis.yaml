        - source_id: PMID:10220164
          title: ThrH, a homoserine kinase isozyme with in vivo phosphoserine phosphatase activity in
            Pseudomonas aeruginosa.
          statement: Native P. aeruginosa thrB/thrH double inactivation causes threonine auxotrophy, supporting
            alternative homoserine-phosphorylation capacity.
          supporting_text: 'threonine auxotrophy is observed only when both thrB and thrH are

            simultaneously inactivated.'
          notes: Primary abstract inspected. Native genetic redundancy is distinguished from the direct
            phosphoserine-donor chemistry in PMID:14699121; overexpression rescue of serB does not establish
            a core serine-biosynthesis role.
        notes: PMID:14699121 uses HPLC-based assays to demonstrate transfer of the phosphoserine phosphoryl
          group to homoserine. Serine is the coproduct and ATP is not the donor. This direct chemistry
          explains complementation of thrB mutants without calling ThrH an ATP-dependent homoserine kinase;
          its separate hydrolytic phosphoserine-phosphatase activity is also retained.
        role_description: Separately scoped PAO1 alternative step; does not complete a full aspartate-to-threonine
          route or replace ThrB in another organism.
