id: MODULE:bacterial_aspartate_to_threonine_biosynthesis
title: Bacterial L-threonine biosynthesis from L-aspartate
description: >-
  The ordered bacterial route from L-aspartate to L-threonine. Aspartate kinase
  and aspartate-semialdehyde dehydrogenase form the shared aspartate-family
  trunk that also supplies lysine biosynthesis. Homoserine dehydrogenase then
  forms L-homoserine, a branch-point precursor also used for methionine
  biosynthesis. Homoserine kinase and pyridoxal 5'-phosphate-dependent
  threonine synthase perform the two threonine-specific reactions. The module
  stops at L-threonine; downstream threonine degradation and conversion to
  2-oxobutanoate for isoleucine synthesis are outside its boundary.
status: DRAFT
evidence:
  - source_id: GO:0009088
    title: L-threonine biosynthetic process
    statement: >-
      The module is grounded in the GO biological-process term for formation
      of L-threonine.
  - source_id: UniPathway:UPA00050
    title: L-threonine biosynthesis
    statement: >-
      UniPathway identifies the ordered aspartate-to-threonine route and maps
      the exact PSEPK representatives used to ground its five reactions.
  - source_id: KEGG:ppu00260
    title: Glycine, serine and threonine metabolism in Pseudomonas putida KT2440
    statement: >-
      The organism-specific KEGG map supplies candidate proteins but is broader
      than this module; only the aspartate-to-threonine biosynthetic chain is
      retained here.
  - source_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
    title: PSEPK UniProt metadata table
    statement: >-
      Supplies exact accessions, ordered loci, EC numbers, pathway mappings,
      and family identifiers for the PSEPK exemplars.
  - source_id: PMID:5441401
    title: The aspartate kinase of Pseudomonas putida. Regulation of synthesis and activity
    statement: >-
      Provides direct biochemical evidence for the aspartate-kinase entry step
      and its regulation in Pseudomonas putida.
notes: >-
  This is a reusable bacterial pathway template rather than a PSEPK-only gene
  list. PSEPK exemplars orient each family-level leaf. Q88LE4 and Q88MU8 are
  the best-supported PSEPK representatives for the shared semialdehyde and
  homoserine-forming reactions. Q88LE2 is retained only as an unconfirmed
  USG-like Asd-family candidate: its PTHR46278:SF2 placement, absent HAMAP hit,
  and absent UniPathway assignment distinguish it from canonical Q88LE4/SF4.
  Q88Q34 is a credible short-form Hom isozyme with unresolved relative in-vivo
  contribution. Q88Q36 is a predicted PLP-dependent threonine-synthase-like
  enzyme, but lacks direct catalytic or genetic evidence and does not satisfy
  the terminal step without stronger evidence; Q88MU7 is the canonical terminal
  enzyme. The 109-residue
  PP_1147 entry is not treated as a complete aspartate-semialdehyde
  dehydrogenase.
module:
  id: bacterial_aspartate_to_threonine_biosynthesis
  label: bacterial L-threonine biosynthesis from L-aspartate
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: L-threonine biosynthetic process
      term:
        id: GO:0009088
        label: L-threonine biosynthetic process
      description: Formation of L-threonine from L-aspartate through L-homoserine.
  parts:
    - order: 1
      role: shared aspartate-family activation
      node:
        id: aspartate_activation
        label: L-aspartate to 4-phospho-L-aspartate
        module_type: REACTION
        description: >-
          Entry reaction shared by the lysine, methionine, and threonine
          branches of bacterial aspartate-family amino-acid biosynthesis.
        annotons:
          - id: aspartate_kinase_activity
            label: Aspartate kinase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: aspartate kinase activity
                term:
                  id: GO:0004072
                  label: aspartate kinase activity
              family:
                preferred_term: bacterial aspartokinase subfamily
                term:
                  id: PANTHER:PTHR21499:SF3
                  label: ASPARTOKINASE
                representative_members:
                  - preferred_term: PSEPK aspartate kinase PP_4473
                    term:
                      id: UniProtKB:Q88EI9
                      label: Aspartate kinase
                    description: >-
                      Pseudomonas putida KT2440 PP_4473; directly assayed in
                      PMID:5441401.
            function:
              preferred_term: aspartate kinase activity
              term:
                id: GO:0004072
                label: aspartate kinase activity
              substrates:
                - preferred_term: L-aspartate
                - preferred_term: ATP
              products:
                - preferred_term: 4-phospho-L-aspartate
                - preferred_term: ADP
              evidence:
                - source_id: EC:2.7.2.4
                  statement: Aspartate kinase reaction.
                - source_id: Rhea:RHEA:23776
                  statement: L-aspartate phosphorylation with ATP.
                - source_id: PMID:5441401
                  statement: Direct Pseudomonas putida aspartate-kinase study.
            role_description: Activates L-aspartate for the shared aspartate-family trunk.
    - order: 2
      role: shared aspartate-semialdehyde formation
      node:
        id: aspartate_semialdehyde_formation
        label: 4-phospho-L-aspartate to L-aspartate 4-semialdehyde
        module_type: REACTION
        description: >-
          Reductive dephosphorylation that produces the branch-point precursor
          used by lysine biosynthesis and the homoserine branch.
        annotons:
          - id: aspartate_semialdehyde_dehydrogenase_activity
            label: Aspartate-semialdehyde dehydrogenase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: aspartate-semialdehyde dehydrogenase activity
                term:
                  id: GO:0004073
                  label: aspartate-semialdehyde dehydrogenase activity
              family:
                preferred_term: canonical aspartate-semialdehyde dehydrogenase subfamily
                term:
                  id: PANTHER:PTHR46278:SF4
                  label: ASPARTATE-SEMIALDEHYDE DEHYDROGENASE
                representative_members:
                  - preferred_term: PSEPK Asd PP_1989
                    term:
                      id: UniProtKB:Q88LE4
                      label: Aspartate-semialdehyde dehydrogenase
                    description: >-
                      Pseudomonas putida KT2440 PP_1989; the higher-confidence
                      HAMAP- and UniPathway-supported representative.
            function:
              preferred_term: aspartate-semialdehyde dehydrogenase activity
              term:
                id: GO:0004073
                label: aspartate-semialdehyde dehydrogenase activity
              substrates:
                - preferred_term: 4-phospho-L-aspartate
                - preferred_term: NADPH
              products:
                - preferred_term: L-aspartate 4-semialdehyde
                - preferred_term: NADP+
                - preferred_term: phosphate
              evidence:
                - source_id: EC:1.2.1.11
                  statement: Aspartate-semialdehyde dehydrogenase reaction.
                - source_id: Rhea:RHEA:24284
                  statement: Reversible NADP-dependent aspartate-semialdehyde reaction.
            role_description: Produces the shared L-aspartate 4-semialdehyde branch point.
    - order: 3
      role: homoserine branch formation
      node:
        id: homoserine_formation
        label: L-aspartate 4-semialdehyde to L-homoserine
        module_type: REACTION
        description: >-
          Forms L-homoserine, which supplies both threonine biosynthesis and
          bacterial methionine routes that activate homoserine separately.
        annotons:
          - id: homoserine_dehydrogenase_activity
            label: Homoserine dehydrogenase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: homoserine dehydrogenase activity
                term:
                  id: GO:0004412
                  label: homoserine dehydrogenase activity
              family:
                preferred_term: homoserine dehydrogenase family
                term:
                  id: PANTHER:PTHR43331:SF1
                  label: HOMOSERINE DEHYDROGENASE
                representative_members:
                  - preferred_term: PSEPK Hom PP_1470
                    term:
                      id: UniProtKB:Q88MU8
                      label: Homoserine dehydrogenase
                    description: >-
                      Pseudomonas putida KT2440 hom/PP_1470; carries a
                      C-terminal ACT regulatory domain and
                      threonine/methionine pathway mappings.
                  - preferred_term: PSEPK homoserine dehydrogenase PP_0664
                    term:
                      id: UniProtKB:Q88Q34
                      label: Homoserine dehydrogenase
                    description: >-
                      Pseudomonas putida KT2440 PP_0664; a shorter same-EC
                      paralog with unresolved pathway partitioning.
            function:
              preferred_term: homoserine dehydrogenase activity
              term:
                id: GO:0004412
                label: homoserine dehydrogenase activity
              substrates:
                - preferred_term: L-aspartate 4-semialdehyde
                - preferred_term: NADH
              products:
                - preferred_term: L-homoserine
                - preferred_term: NAD+
              evidence:
                - source_id: EC:1.1.1.3
                  statement: Homoserine dehydrogenase reaction.
                - source_id: Rhea:RHEA:15759
                  statement: Physiological biosynthetic direction to L-homoserine.
            role_description: Forms the homoserine branch point shared with methionine biosynthesis.
    - order: 4
      role: threonine-specific homoserine phosphorylation
      node:
        id: homoserine_phosphorylation
        label: L-homoserine to O-phospho-L-homoserine
        module_type: REACTION
        description: >-
          First reaction dedicated to the bacterial threonine branch at this
          module boundary.
        annotons:
          - id: homoserine_kinase_activity
