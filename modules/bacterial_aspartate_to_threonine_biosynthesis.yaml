id: MODULE:bacterial_aspartate_to_threonine_biosynthesis
title: Bacterial L-threonine biosynthesis from L-aspartate
description: Three species-native examples of the five-reaction aspartate-to-threonine pathway distinguish
  Pseudomonas standalone enzymes, E. coli bifunctional AK/HDH isozymes, and the Corynebacterium alpha2beta2
  aspartokinase. Every complete route requires the intervening aspartate-semialdehyde dehydrogenase. Shared
  upstream steps also supply other amino-acid branches. The boundary begins at intracellular aspartate
  and ends at threonine; cofactors and reductant are supplied. A separate P. aeruginosa ThrH comparison
  uses phosphoserine instead of ATP for homoserine phosphorylation.
status: DRAFT
scope: CONCRETE
