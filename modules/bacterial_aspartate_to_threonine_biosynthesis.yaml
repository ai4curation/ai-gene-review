  evidence: &id008
  - source_id: PMID:11352712
    title: The central enzymes of the aspartate family of amino acid biosynthesis.
    statement: The shared aspartate-family trunk feeds several amino-acid branches; this module ends at
      threonine and does not make every upstream enzyme threonine-specific.
    supporting_text: 'The aspartate pathway is responsible for the biosynthesis of lysine, threonine,

      isoleucine, and methionine in most plants and microorganisms.'
    notes: Comparative review abstract inspected; broad biochemical context, not evidence for each sampled
      accession.
  - source_id: PMID:19946135
    title: Cohesion group approach for evolutionary analysis of aspartokinase, an enzyme that feeds a
      branched network of many biochemical pathways.
    statement: The broader aspartokinase network is a composite across lineages. Three complete species-native
      examples are modeled here without asserting universal bacterial pathway presence.
    supporting_text: The figure is a composite illustration of known branches, not all of which coexist
      in any given organism.
    notes: Full comparative review inspected. Architecture and taxonomic limitations are retained; no
      speculative evolutionary node or universal presence is asserted.
  - source_id: PMID:4391829
    title: Regulation of the biosynthesis of amino acids of the aspartate family in Coliform bacteria
      and Pseudomonads.
    statement: Homoserine-dehydrogenase pyridine-nucleotide usage varies among organisms. NADPH is the
      represented biosynthetic donor; a second native NADH route is not inferred from a generic enzyme
      name.
    supporting_text: 'In most of the bacteria examined,

      either nicotinamide adenine dinucleotide (NAD) or nicotinamide adenine

      dinucleotide phosphate can serve as a cofactor for this enzyme, though the

      relative activity with the two pyridine nucleotides varies widely.'
    notes: Primary comparative abstract inspected. This is a warning against cross-species donor transfer,
      not target-specific cofactor kinetics.
evidence: *id008
notes: Three complete sampled native routes do not imply universal bacterial presence. Three PSEPK candidate
  paralogs remain assessed outside required-route satisfaction; their membership and review status are
  recorded in the audit members table. NADPH capacity is distinguished from exclusive donor preference
  and from native kinetic evidence. Symbolic reaction descriptions show principal reactants and products,
  not a proton-balanced quantitative model. Literature assessments and retrieval limits are documented
  in the accompanying notes.
