              hydride transfer from NADPH. Those mechanistic observations directly support the NADP-dependent
              semialdehyde-dehydrogenase reaction, beyond a sequence-family assignment.


              PAINT PTN000019341 places the NADP-dependent aspartate-semialdehyde dehydrogenase reaction
              in the inherited Asd lineage. P0A9Q9 is the target and an experimentally characterized descendant,
              not a circular donor. Its catalytic cysteine and direct NADPH chemistry in PMID:6102909
              corroborate this placement.


              The IDA row from PMID:11368768 concerns the same measured pathway reaction as the separate
              EXP row: reduction of aspartyl phosphate to aspartate semialdehyde. The study models substrate/product
              effects under one assay regime; it does not assert equal NAD and NADP efficiencies.


              PMID:14726201 directly studies purified E. coli Asd inhibition by cystine and maps the covalent
              modification to catalytic Cys135. This target activity assay supports the phosphoacyl reduction
              mechanism; failure of NADP/NADPH to protect against cystine does not mean the enzyme lacks
              those cofactors.


