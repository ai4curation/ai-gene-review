            notes: 'PMID:11368768 integrates the E. coli threonine-pathway enzyme kinetics and includes
              the aspartyl-phosphate reduction step. Asd catalyzes NADPH-dependent reductive dephosphorylation,
              supplying aspartate semialdehyde; the NADP-specific activity is corroborated by purified-target
