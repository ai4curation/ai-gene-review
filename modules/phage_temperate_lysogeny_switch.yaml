id: MODULE:phage_temperate_lysogeny_switch
title: Temperate phage lysogenic-lytic decision, transcription antitermination, and prophage integration/excision
description: A coupled gene-regulatory and site-specific recombination module that governs the bistable decision between prophage
  latency (lysogeny) and productive lytic development in lambdoid temperate bacteriophages. Early transcription initiated
  at promoters PL and PR is extended past intrinsic and Rho-dependent terminators by the nut-site antitermination protein
  N, expressing the CII transcriptional activator, its FtsH-inhibiting stabilizer CIII, and the integrative/recombinational
  genes. High CII activity activates promoters PRE (driving synthesis of the CI immunity repressor), PI (driving synthesis
  of the tyrosine integrase Int), and PaQ (antisense inhibition of late antiterminator Q), establishing integrated proviral
  latency in which CI dimers cooperatively repress PL and PR while maintaining PRM. Conversely, low CII activity permits Cro
  accumulation at OR3/OL3 and Q-mediated antitermination of the late PR' transcript, committing the phage to lytic replication
  and virion morphogenesis. Host SOS DNA damage activates RecA* coprotease-stimulated autocleavage of CI, derepressing PL
  and PR so that Int and the directionality factor Xis catalyze excisive recombination (attL x attR) to release the prophage
  genome for lytic replication.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:11711436
  title: Octamerization of lambda CI repressor is needed for effective repression of P(RM) and efficient switching from lysogeny.
  statement: Establishes the long-range octameric operator-looping mechanism of CI at OR and OL that maintains lysogeny and
    enables efficient switching to lytic development upon induction.
- source_id: PMID:25114241
  title: Nucleoprotein architectures regulating the directionality of viral integration and excision.
  statement: Establishes the nucleoprotein architecture of Int-catalyzed integrative (attP x attB) and Xis-directed excisive
    (attL x attR) site-specific recombination in phage lambda.
- source_id: GO:0098689
  title: latency-replication decision
  statement: Defines the biological process governing the choice between viral latency and lytic replication.
- source_id: GO:0075713
  title: establishment of integrated proviral latency
  statement: Defines integration of the temperate phage genome into the host chromosome to establish a prophage.
- source_id: GO:0032359
  title: provirus excision
  statement: Defines site-specific excision of the integrated prophage genome upon induction.
notes: 'Exemplar phage: Escherichia phage lambda (NCBITaxon:2681611). Generalizes across lambdoid and temperate tailed phages
  (including Salmonella phage P22, coliphages HK97, 434, and 21) that couple a CII/CI/Cro-like bistable transcriptional switch
  and N/Q-like antitermination to tyrosine or serine integrase/excisionase-mediated prophage integration and excision.'
