      the MOI threshold for CIII-mediated FtsH inhibition and CII tetramer accumulation during the lytic-lysogenic decision
      remains incompletely resolved in single cells, alongside the lack of bacteriophage-specific GO terms distinguishing
      lysogenic establishment from eukaryotic viral latency.
    boundary: Map lysogenic establishment to GO:0075713 and maintenance to GO:0019044, and record retroregulation of int transcript
      processing at sib in module and gene notes.
    gap_kind:
