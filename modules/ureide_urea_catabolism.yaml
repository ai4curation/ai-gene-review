            role: urate oxidation
            node:
              id: urate_oxidase_step
              label: urate + O2 to 5-hydroxyisourate + H2O2
              module_type: REACTION
              annotons:
                - id: urate_oxidase_activity
                  label: Urate oxidase (uricase)
                  participant:
