  notes: >-
    Boundary: starts at urate (optional entry) or allantoin, and ends with
    ammonium, CO2 and glyoxylate. Purine nucleotide breakdown to urate is in
    purine_nucleotide_catabolism (animals) and
    bacterial_purine_base_oxidation_to_urate. Urease nickel-centre assembly is
    in urease_biogenesis_urea_hydrolysis. Uptake of allantoin, allantoate and
    urea (S. cerevisiae DAL4, DAL5, DUR3), the fate of glyoxylate (DAL7 malate
    synthase), and nitrogen catabolite repression and induction (GATA factors
    and DAL81/DAL82) are outside the module.

    YeastCyc assessment: all five S. cerevisiae reactions and genes (DAL1,
    DAL2, DAL3, DUR1,2) are kept, all cytosolic. DAL3 was historically called
    "ureidoglycolate hydrolase" (PMID:3915539, PMID:1776360). The reaction
    YeastCyc, UniProt and the GO-CAMs assign it is the urea-releasing lyase
    (EC 4.3.2.3, GO:0050385), not the plant amidohydrolase (GO:0004848). This
    fits with S. cerevisiae degrading allantoin through urea and allophanate
    (PMID:4604238). No enzyme is missing from the SGD summary. S. cerevisiae
    lacks the urate oxidase entry part and urease (PMID:21447149; no member of
    PTHR42874, PTHR10395, PTHR43466 or PTHR33569 in the PANTHER 19.0 yeast
    proteome).

    Generalisation: the crosswalk asked for an entry variant (urate oxidase
    route present or absent) and a urea-cleavage variant (urease or urea
    amidolyase). The entry is an optional part rather than a variant set,
    because allantoin import is a transport step, not an alternative enzyme.
    Two more lineage variant sets were added from the literature: plant and
    E. coli allantoate amidohydrolase plus ureidoglycine aminohydrolase in
    place of allantoicase, and plant ureidoglycolate amidohydrolase in place
    of the lyase (PMID:19935661, PMID:21482173).

    GO-CAM notes: (1) PomBase model gomodel:665912ed00002626 is a broader
    nitrogen-cycle model. Its urea-cycle, arginase, agmatinase, ornithine
    transport, glutaminase and spermidine synthase activities are outside this
    module, apart from noting that arginase-derived urea also feeds urease.
    (2) In that model the allantoinase (66e382fb00001783) and OHCU
    decarboxylase (69c59f8a00003378) activities are enabled by a generic
    "protein" (CHEBI:36080), so no S. pombe gene is assigned. (3) S. pombe dal1
    (SPAC19G12.04) ureidoglycolate lyase is placed in GO:0019627 urea metabolic
    process, while the other ureide steps are in GO:0019628 urate catabolic
    process. (4) The model has a separate urease activator complex activity
    (GO:0150006) that positively regulates ure2. The S. pombe accessory
    proteins are ure4 (UreD-like, P87125), ure6 (UreF-like, O14016) and ure7
    (UreG-like, Q96WV0); they belong to the urease biogenesis module and are
    not exemplars here. (5) The YeastPathways models put all five activities
    in GO:0000256 allantoin catabolic process (PWY-5703 in GO:0043419), which
    agrees with this module.
knowledge_gaps:
  - gap_statement: >-
      No S. pombe gene product has been assigned to the allantoinase or the
      OHCU decarboxylase step, although the PomBase model includes both
      activities and S. pombe has urate oxidase, HIU hydrolase, allantoicase,
      ureidoglycolate lyase and urease.
    boundary: >-
      S. pombe has no member of the canonical allantoinase (PTHR43668) or OHCU
      decarboxylase (PTHR43466) families. The other ureide enzymes are
      assigned to named genes (uro1, SPCC285.04, dal2, dal1, ure2).
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Without these two activities, S. pombe would not be able to turn urate
      into ureidoglycolate. An unrelated, non-orthologous enzyme or a
      non-enzymatic step may be involved.
    resolution: >-
      Test growth on urate and allantoin as sole nitrogen sources, and
      allantoinase activity in extracts, then identify the enzyme by
      activity-guided purification or a deletion-library screen.
