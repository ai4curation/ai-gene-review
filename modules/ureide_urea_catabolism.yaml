id: MODULE:ureide_urea_catabolism
title: Ureide pathway - nitrogen recovery from allantoin via urea to ammonia
description: >-
  The ureide pathway recovers the four nitrogen atoms of the purine ring as
  ammonium. In organisms that keep urate oxidase, urate made by purine
  catabolism is oxidised to 5-hydroxyisourate, which 5-hydroxyisourate
  hydrolase and 2-oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline (OHCU)
  decarboxylase convert to (S)-allantoin. Organisms without these enzymes, such
  as budding yeasts, can import allantoin from outside and enter the pathway at
  this point. Allantoinase opens the hydantoin ring to give allantoate. The
  allantoate is then split along one of two chemical routes. In the first,
  allantoicase releases urea and (S)-ureidoglycolate, and ureidoglycolate lyase
  releases a second urea and glyoxylate. In the second, used by plants and many
  bacteria, allantoate amidohydrolase and ureidoglycine aminohydrolase release
  ammonium directly, and ureidoglycolate is either split by the lyase or fully
  hydrolysed by ureidoglycolate amidohydrolase without making urea. The urea is
  then broken down in one of two ways. Most fungi, plants and many bacteria use
  a nickel-dependent urease, which hydrolyses urea in one step. Saccharomycetes
  yeasts instead use urea amidolyase, a biotin-dependent enzyme with two
  domains: urea carboxylase makes allophanate from urea, bicarbonate and ATP,
  and allophanate hydrolase converts allophanate to ammonium and CO2. The
  glyoxylate carbon goes to the glyoxylate cycle. In fungi and animals the
  enzymes are soluble, and in some organisms the urate oxidase steps are
  peroxisomal; in plants the steps after allantoin take place in the
  endoplasmic reticulum.
status: DRAFT
evidence:
  - source_id: YeastPathways:ALLANTOINDEG-PWY
    title: superpathway of allantoin degradation in yeast
    statement: >-
      Source superpathway (five reactions): DAL1 allantoinase, DAL2
      allantoicase, DAL3 ureidoglycolate lyase, and DUR1,2 urea carboxylase
      and allophanate hydrolase. All gene assignments are kept. The pathway
      starts at allantoin because S. cerevisiae has no urate oxidase.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=ALLANTOINDEG-PWY
  - source_id: YeastPathways:PWY-5694
    title: allantoin degradation to glyoxylate I
    statement: DAL1, DAL2 and DAL3 subpathway (allantoin to glyoxylate plus two urea).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5694
  - source_id: YeastPathways:PWY-5697
    title: allantoin degradation to ureidoglycolate I (urea producing)
    statement: DAL1 and DAL2 subpathway (allantoin to ureidoglycolate plus urea).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5697
  - source_id: YeastPathways:PWY-5703
    title: urea degradation I
    statement: DUR1,2 urea carboxylase plus allophanate hydrolase (urea amidolyase).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5703
  - source_id: GO:0000256
    title: allantoin catabolic process
    statement: Module-level process for the core steps from allantoin to urea, glyoxylate and ammonium.
  - source_id: GO:0043419
    title: urea catabolic process
    statement: Module-level process for the urea-cleavage part (urease or urea amidolyase).
  - source_id: GO:0019628
    title: urate catabolic process
    statement: Process for the optional urate-to-allantoin entry part.
  - source_id: PMID:4604238
    title: Clustering of the genes for allantoin degradation in Saccharomyces cerevisiae.
    statement: S. cerevisiae degrades allantoin through allantoate, urea and allophanate.
    supporting_text: >-
      We have shown that allantoin degradation in Saccharomyces cerevisiae
      proceeds exclusively through the intermediate formation of allantoic
      acid, urea, and allophanic acid.
  - source_id: PMID:6105114
    title: 'Structural analysis of the dur loci in S. cerevisiae: two domains of a single multifunctional gene.'
    statement: Urea carboxylase and allophanate hydrolase are two domains of the single DUR1,2 polypeptide.
    supporting_text: >-
      In Saccharomyces cerevisiae, the degradation of urea to carbon dioxide
      and ammonia is catalyzed by urea carboxylase and allophanate hydrolase.
  - source_id: PMID:21447149
    title: Molecular evolution of urea amidolyase and urea carboxylase in fungi.
    statement: >-
      Urea amidolyase (DUR1,2) is found in Saccharomycetes, which lack urease;
      other fungi, including S. pombe, have urease. This supports the urea
      cleavage variant set.
    supporting_text: >-
      Consistent with the earlier observation [1], the urease protein was
      present in all the fungal species examined except for those of the
      Saccharomycotina.
  - source_id: PMID:9339351
    title: Identification of the ure1+ gene encoding urease in fission yeast.
    statement: S. pombe urease is a single-chain, plant-like urease needed for urea metabolism.
    supporting_text: >-
      The fission yeast urease has a one-subunit structure like those from
      plants but different from bacterial ureases which are composed of two or
      three distinct subunits.
  - source_id: PMID:16462750
    title: Completing the uric acid degradation pathway through phylogenetic comparison of whole genomes.
    statement: >-
      HIU hydrolase and OHCU decarboxylase complete the conversion of urate to
      (S)-allantoin after urate oxidase.
    supporting_text: >-
      We show that the two proteins encoded by mouse genes catalyze two
      consecutive steps following urate oxidation to 5-hydroxyisourate (HIU):
      hydrolysis of HIU to give 2-oxo-4-hydroxy-4-carboxy-5-ureidoimidazoline
      (OHCU) and decarboxylation of OHCU to give S-(+)-allantoin.
  - source_id: PMID:19935661
    title: Ureide catabolism in Arabidopsis thaliana and Escherichia coli.
    statement: >-
      Identifies ureidoglycine aminohydrolase and ureidoglycolate
      amidohydrolase as the final plant ureide enzymes and a similar route in
      E. coli. This supports the amidohydrolase variants.
    supporting_text: >-
      A cross-organism protein association analysis allowed us to identify two
      enzymes, ureidoglycine aminohydrolase and ureidoglycolate
      amidohydrolase, that catalyze the final reactions of purine degradation
      in the model plant Arabidopsis thaliana.
  - source_id: PMID:21482173
    title: 'The biochemistry of nitrogen mobilization: purine ring catabolism.'
    statement: Review of plant purine ring catabolism, including its peroxisome and ER compartments.
    supporting_text: >-
      Xanthine is oxidized to urate in the cytosol, followed by three enzymatic
      steps taking place in the peroxisome and four reactions in the
      endoplasmic reticulum releasing the four ring nitrogen as ammonia.
  - source_id: PMID:1803816
    title: The allantoinase (DAL1) gene of Saccharomyces cerevisiae.
    statement: Cloning and sequence of DAL1 allantoinase.
    supporting_text: >-
      The allantoinase (DAL1) gene from Saccharomyces cerevisiae has been
      cloned, sequenced, and found to encode a 472 amino acid protein with a Mr
      of 52,028.
  - source_id: PMID:1916277
    title: Sequences of two adjacent genes, one (DAL2) encoding allantoicase and another (DCG1) sensitive to nitrogen-catabolite repression in Saccharomyces cerevisiae.
    statement: Sequence of DAL2 allantoicase.
    supporting_text: >-
      Reported are the nucleotide sequences of the yeast
      allantoicase-encoding gene (DAL2)
  - source_id: PMID:3915539
    title: Identification of the ureidoglycolate hydrolase gene in the DAL gene cluster of Saccharomyces cerevisiae.
    statement: Isolation of DAL2 and DAL3 ("ureidoglycolate hydrolase", now known to be the urea-releasing lyase).
    supporting_text: >-
      This report describes the isolation of the genes encoding allantoicase
      (DAL2) and ureidoglycolate hydrolase (DAL3)
module:
  id: ureide_urea_catabolism
  label: Ureide pathway (allantoin to urea to ammonia), with urease or urea amidolyase variants
  module_type: METABOLIC_PATHWAY
  description: >-
    [urate -> 5-hydroxyisourate -> OHCU ->] (S)-allantoin -> allantoate ->
    (S)-ureidoglycolate (+ urea or NH4+) -> glyoxylate (+ urea or NH4+/CO2);
    urea -> NH4+ + CO2 (urease, or urea carboxylase + allophanate hydrolase).
  concepts:
    - preferred_term: allantoin catabolic process
      term:
        id: GO:0000256
        label: allantoin catabolic process
      description: Core of the module, from allantoin to glyoxylate, urea and ammonium.
    - preferred_term: urea catabolic process
      term:
        id: GO:0043419
        label: urea catabolic process
      description: Terminal urea cleavage to ammonium and CO2 (urease or urea amidolyase).
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          All S. cerevisiae and S. pombe steps are placed in the cytosol by the
          SGD and PomBase GO-CAMs. Plant steps are peroxisomal (urate to
          allantoin) and ER-resident (after allantoin); see the annoton notes.
  gocam_associations:
    - model: gomodel:YeastPathways_ALLANTOINDEG-PWY
      title: "superpathway of allantoin degradation in yeast - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:YeastPathways_PWY-5694
      title: "allantoin degradation to glyoxylate I - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:YeastPathways_PWY-5697
      title: "allantoin degradation to ureidoglycolate I (urea producing) - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:YeastPathways_PWY-5703
      title: "urea degradation I - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:665912ed00002626
      title: "nitrogen cycle metabolic process (GO:0071941), urate catabolic process (GO:0019628) (S. pombe)"
  parts:
    - order: 1
      role: urate to (S)-allantoin (entry; absent from budding yeasts)
      optional: true
      notes: >-
        Present where urate oxidase is kept (S. pombe, most bacteria, plants,
        most non-primate animals). Saccharomycetes such as S. cerevisiae have
        no urate oxidase, HIU hydrolase or OHCU decarboxylase family member
        (PANTHER 19.0 PTHR42874, PTHR10395, PTHR43466) and take up allantoin
        from outside.
      node:
        id: urate_to_allantoin
        label: Urate oxidation to (S)-allantoin
        module_type: METABOLIC_PATHWAY
        concepts:
          - preferred_term: urate catabolic process
            term:
              id: GO:0019628
              label: urate catabolic process
        parts:
