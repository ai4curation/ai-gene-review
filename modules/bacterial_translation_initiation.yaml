id: MODULE:bacterial_translation_initiation
title: Bacterial translation initiation
description: >-
  A reusable bacterial module for assembly of a translation-competent 70S
  initiation complex. IF2 and IF3 associate with the 30S subunit early, IF1
  stabilizes their binding and organizes the preinitiation complex, and IF2
  promotes initiator fMet-tRNA accommodation and 50S joining while hydrolyzing
  GTP. The boundary ends with factor release and formation of the mature 70S
  initiation complex. Ribosome biogenesis, initiator-tRNA aminoacylation and
  formylation, elongation, and termination are excluded. RRF/EF-G-driven
  recycling is outside the module, but IF3 stabilization of newly split 30S
  subunits is retained as the recycling-to-initiation interface.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006413
    title: translational initiation
    statement: >-
      GO:0006413 defines the biological process performed by the bacterial IF1,
      IF2, and IF3 roles.
  - source_id: file:PSEPK/infA/infA-ai-review.yaml
    title: PSEPK infA gene review
    statement: >-
      The exact IF1 record states that IF2 and IF3 load before IF1 and initiator
      tRNA in the predominant 30S preinitiation-complex assembly order.
  - source_id: file:PSEPK/infB/infB-ai-review.yaml
    title: PSEPK infB gene review
    statement: >-
      IF2 protects and promotes binding of formylmethionyl-tRNA and hydrolyzes
      GTP during formation of the 70S complex.
  - source_id: file:PSEPK/infC/infC-ai-review.yaml
    title: PSEPK infC gene review
    statement: >-
      IF3 binds the 30S subunit and shifts the 70S/free-subunit equilibrium
      toward initiation-competent free subunits.
  - source_id: PMID:22562136
    title: Real-time assembly landscape of bacterial 30S translation initiation complex.
    statement: >-
      Real-time kinetic measurements in Escherichia coli identify IF3 and IF2
      arrival before IF1 as a kinetically favored assembly route, while mRNA
      recruitment can occur at variable times.
    supporting_text: >-
      IF3 and IF2 are the first factors to arrive, forming an unstable
      30S-IF2-IF3 complex. Subsequently, IF1 joins and locks the factors in a
      kinetically stable 30S PIC
  - source_id: PMID:10790378
    title: 'Late events of translation initiation in bacteria: a kinetic analysis.'
    statement: >-
      Quench-flow and stopped-flow experiments directly measured IF2-dependent
      GTP hydrolysis during formation of the 70S initiation complex.
    supporting_text: >-
      IF2-dependent GTP hydrolysis was fast (30/s) followed by slow P(i) release
      from the complex (1.5/s).
  - source_id: PMID:16043510
    title: The role of ribosome recycling factor in dissociation of 70S ribosomes into subunits.
    statement: >-
      Biochemical experiments show that IF3 stabilizes the subunits transiently
      split by RRF and EF-G, defining its interface between recycling and a new
      initiation cycle.
    supporting_text: >-
      IF3 stabilizes the dissociation by binding to the transiently formed 30S
      subunits, preventing re-association back to 70S ribosomes.
  - source_id: file:projects/P_PUTIDA/batches/ppu03010_bacterial_translation_initiation.tsv
    title: Pseudomonas putida KT2440 translation-initiation batch
    statement: >-
      The focused batch identifies the exact KT2440 IF1, IF2, and IF3 proteins
      used to test this bacterial module.
notes: >-
  The module is bacteria-scoped and uses Pseudomonas putida KT2440 proteins as
  concrete leaf exemplars. IF2 appears in both the early 30S-loading part and
  the terminal subunit-joining part because the same factor spans both phases;
  this is not a duplicated pathway requirement. The first PRECEDES edge
  represents the kinetically favored Escherichia coli route measured in
  PMID:22562136, not an obligatory universal factor-binding sequence; factor
  occupancy overlaps and mRNA can bind at different times. The PANTHER
  selectors are pan-taxonomic families containing bacterial, organellar, and
  cytosolic homologs. The explicit bacterial taxon context and exact bacterial
  UniProt exemplars constrain their use here without claiming that the family
  identifiers themselves are bacteria-specific.
