id: MODULE:bacterial_translation_initiation
title: Bacterial translation initiation
description: >-
  A reusable bacterial module for assembly of a translation-competent 70S
  initiation complex. IF2 and IF3 associate with the 30S subunit early, IF1
  stabilizes their binding and organizes the preinitiation complex, and IF2
  promotes initiator fMet-tRNA accommodation and 50S joining while hydrolyzing
  GTP. The boundary ends with factor release and formation of the mature 70S
  initiation complex. Ribosome biogenesis, initiator-tRNA aminoacylation and
  formylation, elongation, termination, and ribosome recycling are excluded.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006413
    title: translational initiation
    statement: >-
      GO:0006413 defines the biological process performed by the bacterial IF1,
      IF2, and IF3 roles.
  - source_id: file:PSEPK/infA/infA-ai-review.yaml
    title: PSEPK infA gene review
    statement: >-
      The exact IF1 record states that IF2 and IF3 load before IF1 and initiator
      tRNA in the predominant 30S preinitiation-complex assembly order.
  - source_id: file:PSEPK/infB/infB-ai-review.yaml
    title: PSEPK infB gene review
    statement: >-
      IF2 protects and promotes binding of formylmethionyl-tRNA and hydrolyzes
      GTP during formation of the 70S complex.
  - source_id: file:PSEPK/infC/infC-ai-review.yaml
    title: PSEPK infC gene review
    statement: >-
      IF3 binds the 30S subunit and shifts the 70S/free-subunit equilibrium
      toward initiation-competent free subunits.
  - source_id: file:projects/P_PUTIDA/batches/ppu03010_bacterial_translation_initiation.tsv
    title: Pseudomonas putida KT2440 translation-initiation batch
    statement: >-
      The focused batch identifies the exact KT2440 IF1, IF2, and IF3 proteins
      used to test this bacterial module.
notes: >-
  The module is bacteria-scoped and uses Pseudomonas putida KT2440 proteins as
  concrete leaf exemplars. IF2 appears in both the early 30S-loading part and
  the terminal subunit-joining part because the same factor spans both phases;
  this is not a duplicated pathway requirement. The part order follows the
  exact IF1 UniProt assembly statement while acknowledging overlapping factor
  occupancy and variable timing of mRNA recruitment. PANTHER display labels
  for IF1 and the IF3 subfamily are organelle-centered, but the broad families,
  bacterial participant descriptions, exact UniProt exemplars, and bacterial
  taxon context define the intended scope.
