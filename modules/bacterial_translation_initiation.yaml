id: MODULE:bacterial_translation_initiation
title: Bacterial translation initiation
description: A reusable bacterial module for assembly of a translation-competent 70S initiation complex.
  IF2 and IF3 associate with the 30S subunit early, IF1 occupies the A site and locks them into a stable
  preinitiation complex, IF3 checks the start codon and initiator tRNA, and IF2 accommodates formylated
  initiator fMet-tRNA and hydrolyzes GTP as the 50S subunit joins. The boundary ends with factor release
  and formation of the mature 70S initiation complex. Ribosome biogenesis, initiator-tRNA aminoacylation
  and formylation, elongation, and termination are excluded. RRF/EF-G-driven recycling is outside the
  module, but IF3 stabilization of newly split 30S subunits is retained as the recycling-to-initiation
  interface. The three factors are conserved across Bacteria; their PANTHER subfamilies also contain mitochondrial
  and plastid orthologs of endosymbiotic origin, which are outside this bacterial module.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0006413
  title: translational initiation
  statement: GO:0006413 defines the biological process performed by the bacterial IF1, IF2, and IF3 roles.
- source_id: file:PSEPK/infA/infA-ai-review.yaml
  title: PSEPK infA gene review
  statement: The exact IF1 record states that IF2 and IF3 load before IF1 and initiator tRNA in the predominant
    30S preinitiation-complex assembly order.
- source_id: file:PSEPK/infB/infB-ai-review.yaml
  title: PSEPK infB gene review
  statement: IF2 protects and promotes binding of formylmethionyl-tRNA and hydrolyzes GTP during formation
    of the 70S complex.
- source_id: file:PSEPK/infC/infC-ai-review.yaml
  title: PSEPK infC gene review
  statement: IF3 binds the 30S subunit and shifts the 70S/free-subunit equilibrium toward initiation-competent
    free subunits.
- source_id: PMID:22562136
  title: Real-time assembly landscape of bacterial 30S translation initiation complex.
  statement: Real-time kinetic measurements in Escherichia coli identify IF3 and IF2 arrival before IF1
    as a kinetically favored assembly route, while mRNA recruitment can occur at variable times.
  supporting_text: IF3 and IF2 are the first factors to arrive, forming an unstable 30S-IF2-IF3 complex.
    Subsequently, IF1 joins and locks the factors in a kinetically stable 30S PIC
- source_id: PMID:10790378
  title: 'Late events of translation initiation in bacteria: a kinetic analysis.'
  statement: Quench-flow and stopped-flow experiments directly measured IF2-dependent GTP hydrolysis during
    formation of the 70S initiation complex.
  supporting_text: IF2-dependent GTP hydrolysis was fast (30/s) followed by slow P(i) release from the
    complex (1.5/s).
- source_id: PMID:16043510
  title: The role of ribosome recycling factor in dissociation of 70S ribosomes into subunits.
  statement: Biochemical experiments show that IF3 stabilizes the subunits transiently split by RRF and
    EF-G, defining its interface between recycling and a new initiation cycle.
  supporting_text: IF3 stabilizes the dissociation by binding to the transiently formed 30S subunits,
    preventing re-association back to 70S ribosomes.
- source_id: PMID:8858589
  title: Escherichia coli translation initiation factor 3 discriminates the initiation codon in vivo.
  statement: In-vivo start-codon substitutions and IF3 mutants establish IF3 discrimination between efficient
    and inefficient bacterial initiation codons.
  supporting_text: Therefore, IF3 is generally able to discriminate between efficient and inefficient
    codons in vivo, consistent with earlier in vitro observations.
- source_id: file:projects/P_PUTIDA/batches/ppu03010_bacterial_translation_initiation.tsv
  title: Pseudomonas putida KT2440 translation-initiation batch
  statement: The focused batch identifies the exact KT2440 IF1, IF2, and IF3 proteins used to test this
    bacterial module.
- source_id: file:modules/bacterial_translation_initiation-deep-research-openscientist.md
  title: OpenScientist bacterial translation-initiation module research
  statement: Module-level research supports a reusable three-factor bacterial boundary while treating
    the observed factor-binding order as a favored route rather than an obligatory universal sequence.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_translation_initiation__ppu03010-deep-research-openscientist.md
  title: OpenScientist PSEPK translation-initiation pathway assessment
  statement: Taxon-aware pathway research identifies the exact KT2440 IF1, IF2, and IF3 proteins as present
    outside the 54-ribosomal-protein KEGG ppu03010 bucket, so the module is satisfied without asserting
    a pathway hole.
- source_id: PMID:10200264
  title: Universal conservation in translation initiation revealed by human and archaeal homologs of bacterial
    translation initiation factor IF2.
  statement: Human and archaeal IF2 homologs function as translation factors, establishing IF2/eIF5B as
    a universally conserved family whose bacterial members define this module.
  supporting_text: We propose a universally conserved function for IF2 in facilitating the proper binding
    of initiator methionyl-tRNA to the ribosomal P site.
- source_id: PMID:9419357
  title: Universally conserved translation initiation factors.
  statement: Bacterial IF1 and archaeal/eukaryotic eIF1A are related in sequence, while later refinement
    of initiation occurred separately in the bacterial lineage.
  supporting_text: significant development and refinement subsequently occurred independently on both
    the bacterial lineage and on the archaeal/eukaryotic line.
- source_id: file:interpro/panther/PTHR43381/PTHR43381-review.yaml
  title: PANTHER PTHR43381 family review (IF2/eIF5B)
  statement: Family review of the IF2/eIF5B PANTHER family, including subfamily scope, PAINT node assessments,
    and divergence of archaeal, eukaryotic and organellar members.
- source_id: file:interpro/panther/PTHR10938/PTHR10938-review.yaml
  title: PANTHER PTHR10938 family review (IF3)
  statement: Family review of the IF3 PANTHER family, including subfamily scope, PAINT node assessments,
    and divergence of archaeal, eukaryotic and organellar members.
- source_id: file:interpro/panther/PTHR33370/PTHR33370-review.yaml
  title: PANTHER PTHR33370 family review (IF1)
  statement: Family review of the IF1 PANTHER family, including subfamily scope, PAINT node assessments,
    and divergence of archaeal, eukaryotic and organellar members.
- source_id: file:ECOLI/infA/infA-ai-review.yaml
  title: ECOLI infA gene review
  statement: Gene review of the Escherichia coli K-12 reference protein for this step (infA).
- source_id: file:ECOLI/infB/infB-ai-review.yaml
  title: ECOLI infB gene review
  statement: Gene review of the Escherichia coli K-12 reference protein for this step (infB).
- source_id: file:ECOLI/infC/infC-ai-review.yaml
  title: ECOLI infC gene review
  statement: Gene review of the Escherichia coli K-12 reference protein for this step (infC).
notes: 'Scope is Bacteria (NCBITaxon:2). IF1, IF2 and IF3 are encoded by essentially all bacterial genomes
  and act in the same order on the 30S subunit, so the module is species-neutral. Escherichia coli K-12
  is the experimental reference for every step and Pseudomonas putida KT2440 is a second exemplar; Pseudomonas
  aeruginosa PAO1 IF2 is added for the IF2 steps because its formylation-independent initiation is experimentally
  characterized. No other organisms were added: B. subtilis and Thermus IFs have structural but little
  additional GO-relevant functional evidence, and adding them would only raise counts. IF2 appears in
  both the early 30S-loading part and the terminal subunit-joining part because the same factor spans
  both phases; this is not a duplicated pathway requirement. The first PRECEDES edge represents the kinetically
  favored E. coli route measured in PMID:22562136, not an obligatory universal factor-binding sequence;
  factor occupancy overlaps and mRNA can bind at different times. Participants are grounded on the bacterial-type
  PANTHER subfamilies (IF2 PTHR43381:SF5, IF3 PTHR10938:SF0, IF1 PTHR33370:SF1). Their official labels
  are generic or organelle-oriented and are kept verbatim; each subfamily also contains plastid (and,
  for SF0, mitochondrial) members, so the Bacteria taxon context, not the subfamily id, restricts the
  module. Divergence outside the module: IF2 is orthologous to archaeal/eukaryotic aIF5B/eIF5B (PTHR43381:SF4),
  which acts downstream of eIF2 on 80S initiation; IF1 is related in sequence to a/eIF1A, which PANTHER
  classifies separately (PTHR21668); IF3 has no archaeal or eukaryotic cytosolic ortholog. These are recorded
  in the family reviews. The IF1 PAINT root node asserts GO:0140517 protein-RNA adaptor activity rather
  than translation initiation factor activity, so no IF1 ancestral node is cited.'
