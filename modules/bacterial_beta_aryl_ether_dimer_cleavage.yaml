  findings:
  - statement: Glutathione substitution inverts beta configuration; etherase substrate and conjugate stereochemistry
      must not be conflated.
    supporting_text: Thus, β-etherase catalysis causes stereochemical inversion of the chiral center,
      converting a β(R)-substrate to a β(S)-product (LigE and LigP), and a β(S)-substrate to a β(R)-product
      (LigF).
- id: PMID:29449375
  title: Novosphingobium aromaticivorans uses a Nu-class glutathione S-transferase as a glutathione lyase
    in breaking the β-aryl ether bond of lignin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached publication identifier/title and quoted source text checked. Primary experimental
      support; assay substrate, strain and native versus recombinant conclusions are separated in the
