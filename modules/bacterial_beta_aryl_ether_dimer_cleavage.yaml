  findings:
  - statement: Deglutathionylation consumes a second GSH, yields GSSG and releases HPV. Glutathione recycling
      lies outside this reaction boundary.
    supporting_text: Finally, the glutathione moiety is removed from GS-HPV and combined with another
      GSH, producing hydroxypropiovanillone (HPV) and glutathione disulfide (GSSG).
  - statement: F199 NaGSTNu supports both GS-HPV stereoisomers in the native late step.
    supporting_text: NaGSTNu is the only enzyme needed to remove glutathione from both (R)- and (S)-GS-HPV
      in N. aromaticivorans
  - statement: The DH5alpha-derived E. coli YghU enzyme can replace F199 NaGSTNu experimentally; this
      is isolated reaction capacity, not an E. coli lignin pathway.
    supporting_text: EcYghU complements growth of an N. aromaticivorans ΔNaGSTNu mutant, showing that
      it can perform these reactions in vivo.
  - statement: The isolated E. coli activities are less efficient and do not establish a physiological
      GS-HPV substrate in E. coli.
    supporting_text: the lower catalytic efficiencies we find with EcYghU and EcYfcG toward GS-HPV may
      reflect the fact that this compound is not a natural substrate for E. coli.
- id: PMID:33244017
  title: Roles of two glutathione S-transferases in the final step of the β-aryl ether cleavage pathway
    in Sphingobium sp. strain SYK-6.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached publication identifier/title and quoted source text checked. Primary experimental
      support; assay substrate, strain and native versus recombinant conclusions are separated in the
      findings.
  findings:
  - statement: Native mutants assign betaR-conjugate conversion to LigG and LigQ, and betaS-conjugate
      conversion to LigQ.
    supporting_text: Analyses of mutants of ligG, ligQ, and both genes revealed that SYK-6 converted (βR)-GS-HPV
      using both LigG and LigQ, whereas only LigQ was involved in converting (βS)-GS-HPV.
  - statement: Both enzymes are kinetically biased; dual-substrate activity does not mean equal efficiency,
      and LigG is not absolutely inactive on betaS conjugate.
    supporting_text: Purified LigG showed an approximately 300-fold higher specific activity for (βR)-GS-HPV
      than that for (βS)-GS-HPV, whereas purified LigQ showed an approximately six-fold higher specific
      activity for (βS)-GS-HPV than that for (βR)-GS-HPV.
