      and assay of the characterized dehydrogenase, beta-etherase and lyase
      panels against them.
    provenance:
      - reference_id: PMID:41705825
        supporting_text: >-
          In general, analysis of dimer degradation pathways is limited by the
          availability of suitable model compounds, and dimers with varied
          monomers and defined stereochemistry are even more challenging to
          synthesize or source commercially.
        reference_section_type: DISCUSSION
  - gap_statement: >-
      It is not known why sphingomonads maintain several stereochemically
      complementary enzymes at each step while Novosphingobium aromaticivorans
      completes the deglutathionylation step with a single non-stereospecific
      Nu-class enzyme, nor what the fitness consequence of each architecture is.
    boundary: >-
      Both architectures are modeled as variants of the same step; no claim is
      made about which is ancestral or advantageous.
    gap_kind:
