knowledge_gaps:
  - gap_statement: >-
      The substrate range of the beta-etherase and Calpha-dehydrogenase
      families beyond guaiacyl-guaiacyl model dimers is largely unknown, in
      particular for lignin fragments containing p-hydroxyphenyl and syringyl
      units and for dimers of defined stereochemistry, so it is unclear how
      much of real deconstructed lignin these enzymes can process.
    boundary: >-
      The module asserts the three-step chemistry and the stereochemical
      complementarity established with GGE and MPHPV; it does not assert
      activity on any particular non-guaiacyl dimer.
    gap_kind:
      - BIOLOGY
    status: OPEN
    resolution: >-
