id: MODULE:bacterial_beta_aryl_ether_dimer_cleavage
title: Bacterial beta-aryl ether cleavage of lignin-derived dimers
description: >-
  A reusable bacterial module for glutathione-dependent cleavage of the
  beta-O-4 (beta-aryl ether) interunit linkage of lignin-derived aromatic
  dimers, exemplified by guaiacylglycerol-beta-guaiacyl ether (GGE). The
  module has three reaction steps. An NAD+-dependent Calpha-dehydrogenase
  oxidizes the benzylic Calpha hydroxyl of the dimer to give the ketone
  alpha-(2-methoxyphenoxy)-beta-hydroxypropiovanillone (MPHPV). A
  glutathione S-transferase beta-etherase then displaces the aryloxy leaving
  group at Cbeta with glutathione, releasing guaiacol and
  alpha-glutathionyl-beta-hydroxypropiovanillone (GS-HPV). Finally a
  glutathione lyase removes the glutathione moiety using a second glutathione,
  yielding the achiral monomer beta-hydroxypropiovanillone (HPV) and
  glutathione disulfide. Because the lignin polymer is racemic at Calpha and
  Cbeta, each step is implemented by a set of stereochemically complementary
  enzymes, modeled as variants. Uptake of the dimer, downstream catabolism of
  HPV and guaiacol to vanillate and protocatechuate, glutathione regeneration,
  and pathways for other interunit linkages are outside the boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:41705825
    title: Biochemical parallels between catabolic pathways for lignin-associated aromatic dimers.
    statement: >-
      Trigger review. Places the beta-O-4 (GGE) route among the catabolic
      pathways for lignin-associated aromatic dimers and identifies it, with
      the 5-5 (DDVA) route, as the established prior work on which the newer
      beta-1, beta-5 and beta-beta pathways are compared; used here to set the
      module boundary at one linkage type.
    supporting_text: >-
      Extensive prior work has established core pathways for catabolism of
      guaiacylglycerol-β-guaiacyl ether (GGE), a model aromatic dimer with a
      β-O-4 linkage, and dehydrodivanillate (DDVA), a model dimer with a 5-5
      linkage
  - source_id: PMID:41705825
    title: Biochemical parallels between catabolic pathways for lignin-associated aromatic dimers.
    statement: >-
      The beta-etherase GSTs also act on dimers with syringyl units, supporting
      a linkage-defined rather than GGE-only module scope.
    supporting_text: >-
      the glutathione-S-transferases LigE/LigF/LigP with
      guaiacylglycerol-β-guaiacyl ether (GGE), guaiacylglycerol-β-syringyl
      ether (GSE), syringylglycerol-β-guaiacyl ether (SGE), and
      syringylglycerol-β-syringyl ether (SSE)
  - source_id: PMID:19542348
    title: Identification of three alcohol dehydrogenase genes involved in the stereospecific catabolism of arylglycerol-beta-aryl ether by Sphingobium sp. strain SYK-6.
    statement: >-
      Establishes the two-intermediate route GGE to MPHPV to GS-HPV plus
      guaiacol that this module models, in Sphingobium sp. SYK-6.
    supporting_text: >-
      Sphingobium sp. strain SYK-6 degrades guaiacylglycerol-beta-guaiacyl
      ether (GGE) to alpha-(2-methoxyphenoxy)-beta-hydroxypropiovanillone
      (MPHPV), and then the ether linkage of MPHPV is cleaved to generate
      alpha-glutathionyl-beta-hydroxypropiovanillone (GS-HPV) and guaiacol.
  - source_id: PMID:26940872
    title: Structural and Biochemical Characterization of the Early and Late Enzymes in the Lignin β-Aryl Ether Cleavage Pathway from Sphingobium sp. SYK-6.
    statement: >-
      Beta-aryl ether is the dominant interunit linkage of lignin, which is why
      this cleavage module is the central entry route for dimer catabolism.
    supporting_text: >-
      β-Aryl ether units are typically abundant in lignin, corresponding to
      50-70% of all of the intermonomer linkages.
notes: >-
  Boundary decision. The module is defined by the interunit linkage cleaved
  (beta-O-4), not by one model substrate or one strain, because the same
  three-step chemistry is used on GGE and on the corresponding syringyl dimers
  and operates in both Sphingobium sp. SYK-6 and Novosphingobium
  aromaticivorans F199. The three steps are modeled as ordered parts; the
  stereochemical redundancy within each step is modeled as a variant_set with
  selection ONE_OR_MORE, since a strain needs several complementary enzymes to
  process the racemic linkage and most strains carry more than one.
  Grounding limits. Several pathway members have no active UniProtKB entry at
  the time of curation (direct gene, locus-tag and EMBL-protein-id searches of
  UniProtKB and UniParc, 2026-10-10): LigN (SLG_35900, EMBL protein BAK68265),
  LigP (SLG_32600, EMBL protein BAK67935) and the SYK-6 Nu-class glutathione
  lyase SLG_04120 (SYK6GSTNu, EMBL protein BAK65087) each had a UniProtKB
  accession (C0SUK1, E1CJ68 and G2IKM4 respectively) that has since been
  deleted - as a redundant sequence (C0SUK1, E1CJ68) or as not part of a
  reference proteome (G2IKM4) - leaving only a UniParc archive record and no
  citable UniProtKB entry; they are therefore named in prose and variant
  descriptions but not asserted as representative members. LigL (C0SUJ9) and
  LigO (C0SUK3) do retain active individual unreviewed UniProtKB entries and
  are cited from those. The F199 homologs
  Saro_0205, Saro_0793, Saro_0794, Saro_1875, Saro_2091 and Saro_2405 are
  identified by homology and GGE-induced expression in PMID:29449375 rather
  than by individual enzyme assay, and are therefore not asserted as
  representative members; only the experimentally characterized F199
  glutathione lyase NaGSTNu (Saro_2595) is.
  Adjacency. Downstream, HPV catabolism and guaiacol O-demethylation feed
  vanillate and protocatechuate; those steps are covered by
  modules/hydroxycinnamate_vanillate_catabolism.yaml (vanillin to vanillate to
  protocatechuate) and the ring-cleavage modules
  modules/catechol_ortho_cleavage.yaml and
  modules/beta_ketoadipate_lower_pathway.yaml, with
  modules/bacterial_gallate_catabolism.yaml covering the related gallate
  route. None of those modules contains a beta-aryl ether step, so there is no
  overlap. Not modeled here: the 5-5 (DDVA) route (LigXacd, LigZ, LigY, LigW,
  LigW2), the beta-1 (DGPD) route (LdpA, LdpB, LdpC), the beta-5 (DCA) route
  (PhcCDFG, PcfL), the beta-beta (pinoresinol) route (PinZ, PinY, PinX, PinW),
  the lignostilbene dioxygenases that cleave the stilbene intermediates of
  those routes, and dimer transporters (DdvK, DdvT). Of these the DDVA route
  is the next best grounded and is the natural follow-up module.
  Ontology gaps for GO editors: there is no molecular-function term for
  Calpha-dehydrogenase (arylglycerol-beta-aryl ether Calpha oxidation), for
  beta-etherase (glutathione-dependent beta-aryl ether cleavage), or for
  glutathione lyase (beta-S-thioether cleavage yielding glutathione
  disulfide), and no biological-process term for beta-aryl ether cleavage or
  for lignin-dimer catabolism distinct from breakdown of the lignin polymer;
  each annoton therefore uses the nearest existing parent term, with the
  specific reaction named in preferred_term and role_description. The
  existing IEA annotation of LigD to GO:0046274 lignin catabolic process sets
  the precedent for the process term used here. No Rhea reactions exist for
  these three steps; the UniProt Rhea cross-reference RHEA:15741 on the LigL
  and LigO entries is a dichlorocyclohexadienediol dehydrogenase reaction from
  an automatic annotation rule and does not describe the GGE reaction, so it
  is deliberately not cited.
module:
  id: bacterial_beta_aryl_ether_dimer_cleavage
  label: Bacterial beta-aryl ether cleavage of lignin-derived dimers
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: lignin catabolic process
      term:
        id: GO:0046274
        label: lignin catabolic process
      description: >-
        Catabolism of lignin-derived material; used here for cleavage of the
        beta-O-4 linkage of lignin-derived dimers, the aspect of lignin
        breakdown this module implements.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
      - preferred_term: Sphingomonadaceae
        term:
          id: NCBITaxon:41297
          label: Sphingomonadaceae
        description: >-
          The characterized implementations are sphingomonad; beta-etherase
          homologs are much more widely distributed but mostly uncharacterized.
  parts:
    - order: 1
      role: Calpha oxidation of the arylglycerol-beta-aryl ether dimer
      node:
        id: calpha_oxidation
        label: Calpha-dehydrogenase oxidation of GGE to MPHPV
        module_type: REACTION
        description: >-
          NAD+-dependent oxidation of the benzylic Calpha hydroxyl, converting
          the arylglycerol-beta-aryl ether to the corresponding ketone and
          activating Cbeta for nucleophilic attack.
        evidence:
          - source_id: PMID:26940872
            title: Structural and Biochemical Characterization of the Early and Late Enzymes in the Lignin β-Aryl Ether Cleavage Pathway from Sphingobium sp. SYK-6.
            statement: Defines the hydride-transfer chemistry and NAD+ dependence of the step.
            supporting_text: >-
              The conversion from GGE to MPHPV during the Cα-dehydrogenase
              reaction is achieved by the loss of a proton and a hydride ion
              from the substrate, creating NADH from NAD+
          - source_id: PMID:19542348
            title: Identification of three alcohol dehydrogenase genes involved in the stereospecific catabolism of arylglycerol-beta-aryl ether by Sphingobium sp. strain SYK-6.
            statement: >-
              Four short-chain dehydrogenase/reductase enzymes of SYK-6 carry
              out this step with complementary stereospecificity.
            supporting_text: >-
              three alcohol dehydrogenase genes, ligL, ligN, and ligO, which
              conferred GGE transformation activity in Escherichia coli, were
              isolated from SYK-6 and characterized, in addition to the
              previously cloned ligD gene
        variant_sets:
          - id: calpha_dehydrogenase_stereospecificity
            label: Calpha-dehydrogenase stereospecificity
            axis: Calpha configuration of the dimer substrate
            selection: ONE_OR_MORE
            notes: >-
              Both variants are needed to oxidize all four GGE stereoisomers;
              gene disruption showed ligD is essential for the two
              (alphaR)-isomers while ligL and ligN both contribute to the
              (alphaS)-isomers.
            evidence:
              - source_id: PMID:19542348
                title: Identification of three alcohol dehydrogenase genes involved in the stereospecific catabolism of arylglycerol-beta-aryl ether by Sphingobium sp. strain SYK-6.
                statement: >-
                  Chiral HPLC with enantiopure GGE stereoisomers assigned the
                  stereospecificity of each of the four dehydrogenases.
                supporting_text: >-
                  LigD and LigO converted (alphaR,betaS)-GGE and
                  (alphaR,betaR)-GGE into (betaS)-MPHPV and (betaR)-MPHPV,
                  respectively
            variants:
              - id: alpha_r_specific_dehydrogenase
                label: (alphaR)-specific Calpha-dehydrogenase (LigD, LigO)
                module_type: REACTION
                annotons:
                  - id: ligd_calpha_dehydrogenase
                    label: Calpha-dehydrogenase LigD
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: >-
                          (alphaR)-selective arylglycerol-beta-aryl ether
                          Calpha-dehydrogenases of the SDR family
                        representative_members:
                          - preferred_term: LigD (Sphingobium sp. SYK-6)
                            term:
                              id: UniProtKB:Q01198
                              label: C alpha-dehydrogenase
                          - preferred_term: LigO (Sphingobium sp. SYK-6)
                            term:
                              id: UniProtKB:C0SUK3
                              label: C alpha-dehydrogenase
                    function:
                      preferred_term: >-
                        (alphaR)-arylglycerol-beta-aryl ether
                        Calpha-dehydrogenase (NAD+) activity
                      term:
                        id: GO:0016616
                        label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
                      substrates:
                        - preferred_term: (alphaR)-guaiacylglycerol-beta-guaiacyl ether
                        - preferred_term: NAD+
                      products:
                        - preferred_term: alpha-(2-methoxyphenoxy)-beta-hydroxypropiovanillone (MPHPV)
                        - preferred_term: NADH
                    processes:
                      - preferred_term: lignin catabolic process
                        term:
                          id: GO:0046274
                          label: lignin catabolic process
                    role_description: >-
                      Oxidizes the (alphaR)-configured dimer stereoisomers. In
                      vitro LigD acts on (alphaR,betaS)-GGE and LigO on
                      (alphaR,betaR)-GGE, each retaining the Cbeta
                      configuration in the MPHPV product; in vivo, however, the
                      ligD mutant is deficient in both (alphaR) isomers (the
                      ligD cell extract transformed only 50% of GGE), so LigO
                      does not fully substitute for LigD in SYK-6 and the two
                      are modeled together as the (alphaR) variant rather than
                      as independently sufficient enzymes. GO has no
                      substrate-specific term, so the NAD(P)-dependent CH-OH
                      oxidoreductase parent is used.
              - id: alpha_s_specific_dehydrogenase
                label: (alphaS)-specific Calpha-dehydrogenase (LigL, LigN)
                module_type: REACTION
                description: >-
                  LigL and LigN together oxidize the two (alphaS)-configured
                  GGE stereoisomers. LigN (SLG_35900) has no UniProtKB entry
                  and is therefore named but not asserted as a member.
                annotons:
                  - id: ligl_calpha_dehydrogenase
                    label: Calpha-dehydrogenase LigL
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: >-
                          (alphaS)-selective arylglycerol-beta-aryl ether
                          Calpha-dehydrogenases of the SDR family
                        representative_members:
                          - preferred_term: LigL (Sphingobium sp. SYK-6)
                            term:
                              id: UniProtKB:C0SUJ9
                              label: C alpha-dehydrogenase
                    function:
                      preferred_term: >-
                        (alphaS)-arylglycerol-beta-aryl ether
                        Calpha-dehydrogenase (NAD+) activity
                      term:
                        id: GO:0016616
                        label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
                      substrates:
                        - preferred_term: (alphaS)-guaiacylglycerol-beta-guaiacyl ether
                        - preferred_term: NAD+
                      products:
                        - preferred_term: alpha-(2-methoxyphenoxy)-beta-hydroxypropiovanillone (MPHPV)
                        - preferred_term: NADH
                    processes:
                      - preferred_term: lignin catabolic process
                        term:
                          id: GO:0046274
                          label: lignin catabolic process
                    role_description: >-
                      Oxidizes (alphaS,betaR)-GGE to (betaR)-MPHPV; LigL is
                      also active on threo-diguaiacylpropanediol, an example of
                      the substrate promiscuity shared across dimer pathways.
                    evidence:
                      - source_id: PMID:41705825
                        title: Biochemical parallels between catabolic pathways for lignin-associated aromatic dimers.
                        statement: LigL-type Calpha-dehydrogenases act on more than one dimer class.
                        supporting_text: >-
                          Similarly, LigL and related Cα-dehydrogenases oxidize
                          both GGE and threo-DGPD
    - order: 2
      role: glutathione-dependent cleavage of the beta-aryl ether bond
      node:
        id: beta_etherase_cleavage
        label: Beta-etherase displacement of the aryloxy group by glutathione
        module_type: REACTION
        description: >-
          Glutathione S-transferases attack Cbeta of MPHPV, releasing the
          phenol of the second ring (guaiacol from GGE) and forming the
          thioether conjugate GS-HPV. This is the bond-breaking step of the
          module.
        evidence:
          - source_id: PMID:12618439
            title: Roles of the enantioselective glutathione S-transferases in cleavage of beta-aryl ether.
            statement: >-
              LigE and LigF each convert MPHPV to guaiacol plus GS-HPV, acting
              on opposite enantiomers of racemic MPHPV.
            supporting_text: >-
              a model compound of beta-aryl ether,
              alpha-(2-methoxyphenoxy)-beta-hydroxypropiovanillone (MPHPV), was
              transformed by LigF or LigE to guaiacol and
              alpha-glutathionyl-beta-hydroxypropiovanillone
          - source_id: PMID:12618439
            title: Roles of the enantioselective glutathione S-transferases in cleavage of beta-aryl ether.
            statement: Beta-aryl ether cleavage is the key bond-breaking step of lignin catabolism.
            supporting_text: >-
              Cleavage of the beta-aryl ether linkage is the most important
              process in lignin degradation.
        variant_sets:
          - id: beta_etherase_enantioselectivity
            label: Beta-etherase enantioselectivity
            axis: Cbeta configuration of the MPHPV substrate
            selection: ONE_OR_MORE
            evidence:
              - source_id: PMID:24509858
                title: Stereochemical features of glutathione-dependent enzymes in the Sphingobium sp. strain SYK-6 β-aryl etherase pathway.
                statement: >-
                  The two beta-etherase classes consume opposite Cbeta
                  enantiomers and invert the stereocentre.
                supporting_text: >-
                  Thus, β-etherase catalysis causes stereochemical inversion of
                  the chiral center, converting a β(R)-substrate to a
                  β(S)-product (LigE and LigP), and a β(S)-substrate to a
                  β(R)-product (LigF).
            variants:
              - id: beta_r_etherase
                label: beta(R)-selective beta-etherase (LigE, LigP)
                module_type: REACTION
                description: >-
                  LigE and LigP act on beta(R)-MPHPV and give the beta(S)
                  conjugate. LigP (SLG_32600) has no UniProtKB entry and is
                  named but not asserted as a member.
                annotons:
                  - id: lige_beta_etherase
                    label: Beta-etherase LigE
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: beta(R)-selective beta-etherase glutathione S-transferases
                        representative_members:
                          - preferred_term: LigE (Sphingobium sp. SYK-6)
                            term:
                              id: UniProtKB:P27457
                              label: Beta-etherase
                    function:
                      preferred_term: beta(R)-beta-etherase (glutathione-dependent beta-aryl ether lyase) activity
                      term:
                        id: GO:0004364
                        label: glutathione transferase activity
                      substrates:
                        - preferred_term: beta(R)-MPHPV
                        - preferred_term: glutathione
                      products:
                        - preferred_term: beta(S)-GS-HPV
                        - preferred_term: guaiacol
                    processes:
                      - preferred_term: lignin catabolic process
                        term:
                          id: GO:0046274
                          label: lignin catabolic process
                    role_description: >-
                      Cleaves the beta-O-4 bond of the beta(R) ketone with
                      inversion at Cbeta. The GO:0004364 definition names a
                      halide leaving group, whereas here the leaving group is
                      an aryloxide; the term is used as the closest existing
                      GST molecular function.
                    evidence:
                      - source_id: PMID:22146726
                        title: Characterization of the third glutathione S-transferase gene involved in enantioselective cleavage of the β-aryl ether by Sphingobium sp. strain SYK-6.
                        statement: >-
                          LigP shares LigE's enantioselectivity, and the two
                          together account for degradation of (betaR)-MPHPV in
                          SYK-6.
                        supporting_text: >-
                          LigP produced in Escherichia coli revealed
                          enantioselectivity for (-)-(βR)-MPHPV
              - id: beta_s_etherase
                label: beta(S)-selective beta-etherase (LigF)
                module_type: REACTION
                annotons:
                  - id: ligf_beta_etherase
                    label: Beta-etherase LigF
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: beta(S)-selective beta-etherase glutathione S-transferases
                        representative_members:
                          - preferred_term: LigF (Sphingobium sp. SYK-6)
                            term:
                              id: UniProtKB:P30347
                              label: Protein LigF
                    function:
                      preferred_term: beta(S)-beta-etherase (glutathione-dependent beta-aryl ether lyase) activity
                      term:
                        id: GO:0004364
                        label: glutathione transferase activity
                      substrates:
                        - preferred_term: beta(S)-MPHPV
                        - preferred_term: glutathione
                      products:
                        - preferred_term: beta(R)-GS-HPV
                        - preferred_term: guaiacol
                    processes:
                      - preferred_term: lignin catabolic process
                        term:
                          id: GO:0046274
                          label: lignin catabolic process
                    role_description: >-
                      Cleaves the beta-O-4 bond of the beta(S) ketone with
                      inversion at Cbeta, producing the beta(R) conjugate that
                      LigG prefers. Gene disruption showed ligF is essential
                      for degradation of its MPHPV enantiomer in SYK-6.
    - order: 3
      role: removal of the glutathione moiety to release the aromatic monomer
      node:
        id: glutathione_lyase_release
        label: Glutathione lyase release of beta-hydroxypropiovanillone
        module_type: REACTION
        description: >-
          A second glutathione attacks the thioether of GS-HPV, releasing the
          achiral monomer HPV and glutathione disulfide. This step completes
          the conversion of the dimer into two monomers that can enter
          established aromatic catabolic routes.
        evidence:
          - source_id: PMID:29449375
            title: Novosphingobium aromaticivorans uses a Nu-class glutathione S-transferase as a glutathione lyase in breaking the β-aryl ether bond of lignin.
            statement: Defines the stoichiometry of the deglutathionylation step.
            supporting_text: >-
              Finally, the glutathione moiety is removed from GS-HPV and
              combined with another GSH, producing hydroxypropiovanillone
              (HPV) and glutathione disulfide (GSSG).
          - source_id: PMID:12618439
            title: Roles of the enantioselective glutathione S-transferases in cleavage of beta-aryl ether.
            statement: >-
              The product HPV is achiral, which is why no further
              stereochemical resolution is needed downstream.
            supporting_text: >-
              This reaction then produces an achiral compound,
              beta-hydroxypropiovanillone, which is further degraded by this
              strain.
        variant_sets:
          - id: glutathione_lyase_class
            label: Glutathione lyase class
            axis: glutathione S-transferase class and substrate stereoselectivity
            selection: ONE_OR_MORE
            notes: >-
              SYK-6 uses the stereospecific omega-class LigG together with a
              Nu-class enzyme (SLG_04120, SYK6GSTNu, no UniProtKB entry) that
              cleaves both epimers, which explains the earlier finding that a
              ligG deletion is not blocked; F199 relies on the Nu-class enzyme
              alone.
            variants:
              - id: omega_class_stereospecific_lyase
                label: Omega-class stereospecific glutathione lyase (LigG)
                module_type: REACTION
                annotons:
                  - id: ligg_glutathione_lyase
                    label: Glutathione lyase LigG
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: >-
                          omega-class glutathione transferases acting as
                          beta(R)-selective GS-HPV thioetherases
                        representative_members:
                          - preferred_term: LigG (Sphingomonas paucimobilis SYK-6)
                            term:
                              id: UniProtKB:Q9WXJ9
                              label: Glutathione S-transferase homolog
                            description: >-
                              The SYK-6 ligG gene product; the entry predates
                              the reclassification of the strain as Sphingobium
                              sp. SYK-6.
                    function:
                      preferred_term: beta(R)-GS-HPV glutathione lyase (beta-S-thioetherase) activity
                      term:
                        id: GO:0016846
                        label: carbon-sulfur lyase activity
                      substrates:
                        - preferred_term: beta(R)-GS-HPV
                        - preferred_term: glutathione
                      products:
                        - preferred_term: beta-hydroxypropiovanillone (HPV)
                        - preferred_term: glutathione disulfide
                    processes:
                      - preferred_term: lignin catabolic process
                        term:
                          id: GO:0046274
                          label: lignin catabolic process
                    role_description: >-
                      Cleaves the C-S bond of the beta(R) conjugate produced by
                      LigF; little or no activity on the beta(S) epimer. GO has
                      no glutathione lyase term, so the carbon-sulfur lyase
                      parent is used.
                    evidence:
                      - source_id: PMID:24509858
                        title: Stereochemical features of glutathione-dependent enzymes in the Sphingobium sp. strain SYK-6 β-aryl etherase pathway.
                        statement: LigG is stereospecific for the beta(R) conjugate.
                        supporting_text: demonstrating that LigG is a stereospecific β-thioetherase
                      - source_id: PMID:23058289
                        title: Sphingobium sp. SYK-6 LigG involved in lignin degradation is structurally and biochemically related to the glutathione transferase ω class.
                        statement: >-
                          The crystal structure places LigG in the omega class
                          of glutathione transferases.
                        supporting_text: >-
                          its known ability to stereoselectively
                          deglutathionylate the physiological substrate
                          α-glutathionyl-β-hydroxypropiovanillone
              - id: nu_class_nonstereospecific_lyase
                label: Nu-class non-stereospecific glutathione lyase (NaGSTNu)
                module_type: REACTION
                annotons:
                  - id: nu_class_glutathione_lyase
                    label: Nu-class glutathione lyase NaGSTNu
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: >-
                          Nu-class glutathione transferases with GS-HPV
                          glutathione lyase activity on both epimers
                        representative_members:
                          - preferred_term: NaGSTNu (Novosphingobium aromaticivorans F199)
                            term:
                              id: UniProtKB:Q2G542
                              label: Glutathione S-transferase-like protein
                            description: >-
                              Saro_2595, the characterized F199 glutathione
                              lyase; the UniProt protein name is the automatic
                              family-level description, not the assayed
                              activity.
                    function:
                      preferred_term: GS-HPV glutathione lyase (beta-S-thioetherase) activity
                      term:
                        id: GO:0016846
                        label: carbon-sulfur lyase activity
                      substrates:
                        - preferred_term: (R)- or (S)-GS-HPV
                        - preferred_term: glutathione
                      products:
                        - preferred_term: beta-hydroxypropiovanillone (HPV)
                        - preferred_term: glutathione disulfide
                    processes:
                      - preferred_term: lignin catabolic process
                        term:
                          id: GO:0046274
                          label: lignin catabolic process
                    role_description: >-
                      Single enzyme sufficient for the deglutathionylation step
