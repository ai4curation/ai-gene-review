notes: Specific reaction descriptors are intentionally free text where no precise GO identifier was established.
  GO:0004364 specifies halide release, GO:0016846 describes elimination of substituted hydrogen sulfide,
  and GO:0046274 describes polymer catabolism; these are not used as substitutes for the represented aryl-ether
  substitution, reductive deglutathionylation or bounded dimer process. Exact target selectors coexist
  with independently verified family metadata; a shared family id does not imply identical stereochemistry
  or subunit roles. The source-analysis checks document Boolean capacity assumptions and stereochemical
  continuity. Current and archived source records remain unmodified. Official complete UniParc cross-reference
  lookups on 2026-11-03 found no active UniProtKB replacement for archived LigN C0SUK1, LigP E1CJ68 or
  LigQ G2IKM4. Their exact archived sequences match UniParc; active RefSeq/EMBL links and raw responses
  are recorded in the gene record-evidence files. These selectors identify version-pinned experimental
  sequences, not currently active UniProtKB records.
