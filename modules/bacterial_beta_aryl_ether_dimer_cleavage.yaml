id: MODULE:bacterial_beta_aryl_ether_dimer_cleavage
title: Bacterial beta-aryl ether cleavage of lignin-derived dimers
description: A three-stage glutathione-dependent route converts lignin-derived beta-O-4 dimers into aromatic
  monomers. NAD+-dependent Calpha oxidation produces MPHPV; stereospecific ether cleavage releases guaiacol
  and an inverted GS-HPV conjugate; reductive deglutathionylation consumes a second glutathione to yield
  HPV and GSSG. The complete SYK-6 implementation requires coverage of both alpha and beta configurations.
  F199 provides an independently assayed downstream subroute with a BaeAB heterodimer alternative, and
  E. coli YghU provides a bounded isolated-activity comparator. Polymer depolymerization, uptake, downstream
  monomer assimilation and cofactor regeneration lie outside the boundary.
status: COMPLETE
scope: CONCRETE
