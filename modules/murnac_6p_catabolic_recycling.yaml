id: MODULE:murnac_6p_catabolic_recycling
title: MurNAc 6-phosphate etherase route of muramic acid recycling
description: >-
  A bacterial route that converts N-acetylmuramic acid (MurNAc) recovered from
  cell-wall turnover, or taken up from the environment, into
  N-acetylglucosamine 6-phosphate (GlcNAc-6P). MurNAc 6-phosphate (MurNAc-6P)
  is formed either by a MurNAc-specific phosphotransferase-system (PTS)
  transporter that phosphorylates MurNAc during uptake, or by the
  anhydro-MurNAc kinase AnmK acting on 1,6-anhydro-MurNAc released from
  imported anhydromuropeptides. The etherase MurQ then removes the D-lactyl
  ether from MurNAc-6P, yielding GlcNAc-6P and D-lactate, and GlcNAc-6P joins
  the GlcNAc catabolic pathway. The RpiR-family repressor MurR keeps the
  murP-murQ genes off until MurNAc-6P binds it. This catabolic etherase route
  is the alternative to the Pseudomonas-type anabolic MupP-AmgK-MurU shortcut
  (MODULE:peptidoglycan_recycling). Anhydromuropeptide import and the NagZ and
  AmpD steps that free anhydro-MurNAc are modeled in that module; GlcNAc-6P
  deacetylation and further catabolism are outside the boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0097173
    title: N-acetylmuramic acid catabolic process
    statement: Defines the biological-process boundary for MurNAc breakdown.
  - source_id: GO:0097175
    title: 1,6-anhydro-N-acetyl-beta-muramic acid catabolic process
    statement: Defines the recycling branch that starts from anhydro-MurNAc.
  - source_id: PMID:15060041
    title: Identification of a phosphotransferase system of Escherichia coli required for growth on N-acetylmuramic acid.
    statement: >-
      Establishes MurP as the MurNAc-specific PTS EIIBC that depends on
      EIIA-Glc, and places MurNAc catabolism upstream of the GlcNAc pathway.
    supporting_text: >-
      the catabolic pathway for MurNAc merges into the GlcNAc pathway on the
      level of GlcNAc 6-phosphate
  - source_id: PMID:15983044
    title: Scission of the lactyl ether bond of N-acetylmuramic acid by Escherichia coli "etherase".
    statement: Identifies MurQ as the MurNAc-6P etherase and its products.
    supporting_text: >-
      catalyze the cleavage of MurNAc 6-phosphate, with GlcNAc 6-phosphate and
      D-lactate being the primary products
  - source_id: PMID:15901686
    title: Recycling of the anhydro-N-acetylmuramic acid derived from cell wall murein involves a two-step conversion to N-acetylglucosamine-phosphate.
    statement: >-
      Shows that anhydro-MurNAc from murein turnover is converted to GlcNAc-P
      by AnmK followed by the etherase.
    supporting_text: >-
      The sugar is first phosphorylated by anhydro-N-acetylmuramic acid kinase
      (AnmK), yielding MurNAc-P, and this is followed by action of an etherase
  - source_id: PMID:18723630
    title: The transcriptional factors MurR and catabolite activator protein regulate N-acetylmuramic acid catabolism in Escherichia coli.
    statement: Establishes MurR as the MurNAc-6P-responsive repressor of murQ.
    supporting_text: >-
      MurNAc-6-phosphate, the substrate of MurQ, was identified as a specific
      inducer that weakens binding of MurR to the operator.
  - source_id: PMID:35640608
    title: Molecular basis for cell-wall recycling regulation by transcriptional repressor MurR in Escherichia coli.
    statement: Structural and biochemical confirmation of MurNAc-6P as the MurR inducer.
    supporting_text: >-
      In this work, we revealed that MurNAc-6-P directly binds to MurR to
      induce the dissociation of MurR from the promoter DNA, leading to the
      derepression of the murPQ pathway.
  - source_id: RHEA:26410
    title: MurQ reaction
    statement: Defines the EC 4.2.1.126 MurNAc-6P etherase reaction.
  - source_id: RHEA:24952
    title: AnmK reaction
    statement: Defines ring opening and phosphorylation of anhydro-MurNAc to MurNAc-6P.
  - source_id: RHEA:33399
    title: MurP reaction
    statement: Defines PTS-coupled uptake and 6-phosphorylation of MurNAc (EC 2.7.1.192).
notes: >-
  Grounded on Escherichia coli K-12, where every step has direct genetic and
  biochemical evidence (gene reviews genes/ECOLI/murP, murQ and murR). Bacillus
  subtilis representatives are included where reviewed or curated: MurQ
  (Q45582) and the MurR-like repressor YbbH (Q45581, genes/BACSU/ybbH), whose
  regulator role is supported by a murR deletion reporter but whose DNA
  binding and effector are inferred from E. coli MurR. E. coli MurR also
  represses pbp4B, which is not modeled. The EIIA-Glc (Crr), HPr and enzyme I
  phosphoryl relay that feeds MurP is shared with the glucose PTS and is
  context rather than a part of this module. GO has no term for the MurQ
  etherase activity or for negative regulation of MurNAc catabolism; both are
  proposed as new terms in the murQ and murR reviews, so the MurQ annoton
  carries no GO id.
