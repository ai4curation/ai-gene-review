            label: MurR ligand-modulated transcription repressor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: MurR RpiR-family repressors
                term:
                  id: PANTHER:PTHR30514:SF17
                  label: HTH-TYPE TRANSCRIPTIONAL REGULATOR MURR
                representative_members:
                  - preferred_term: murR (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P77245
                      label: HTH-type transcriptional regulator MurR
            function:
              preferred_term: ligand-modulated transcription repressor activity
              term:
                id: GO:0141096
                label: ligand-modulated transcription repressor activity
              evidence:
                - source_id: PMID:18723630
                  statement: MurR represses murQ and its own gene; MurNAc-6P is the inducer.
                  supporting_text: >-
                    In this way MurR represses transcription from the murQ
                    promoter and also interferes with its own transcription.
                - source_id: PMID:35640608
                  statement: MurNAc-6P binding releases MurR from promoter DNA.
                  supporting_text: >-
                    MurNAc-6-P directly binds to MurR to induce the dissociation
                    of MurR from the promoter DNA
            processes:
              - preferred_term: negative regulation of DNA-templated transcription
                term:
                  id: GO:0045892
                  label: negative regulation of DNA-templated transcription
              - preferred_term: negative regulation of carbohydrate utilization
                term:
                  id: GO:0180068
                  label: negative regulation of carbohydrate utilization
            role_description: >-
              Senses the pathway intermediate MurNAc-6P and derepresses
              murP-murQ when it accumulates. The B. subtilis homolog YbbH
              (Q45581) has a repressor role shown by deletion but an inferred
              operator and effector, so it is noted rather than listed as a
              representative.
