id: MODULE:dmel_elba_boundary_complex
title: Elba early boundary factor complex in Drosophila melanogaster
description: >-
  Elba is a heterotrimeric chromatin boundary (insulator) factor active in the early embryo.
  It binds a specific DNA sequence in the Fab-7 boundary of the Bithorax complex and gives
  the boundary its early insulating activity. Elba1 and Elba2 are BEN-domain DNA-binding proteins,
  and Elba3 bridges them; Elba3 is expressed only in early embryos, which restricts the complex
  to that stage.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000720
  title: 'FlyBase gene group ELBA: Elba boundary factor complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as elba boundary factor complex
    (ELBA); this module models that group.
- source_id: GO:0005667
  title: transcription regulator complex
  statement: >-
    GO term grounding the module as transcription regulator complex.
notes: >-
  No GO cellular-component term exists for Elba or insulator complexes, so the module is grounded
  to transcription regulator complex. A three-subunit complex without further sub-structure;
  it is decomposed one part per subunit. Chromatin insulator sequence binding (GO:0043035;
  GOA IDA for Elba1 and Elba2) is recorded on a complex-level annoton with all three subunits
  as active units, because the Elba1, Elba2 and Elba3 gene reviews record that the BEN-domain
  subunits contribute to it as part of the heterotrimer. The bridging subunit Elba3 is also
  given protein-macromolecule adaptor activity (GO:0030674; GOA IDA), its core function in
  its gene review. FlyBase groups realized by this module: ELBA (FBgg0000720). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_elba_boundary_complex.yaml. Member genes with a gene review in this
  repository: Elba1, Elba2, Elba3.
