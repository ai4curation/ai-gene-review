                term:
                  id: GO:0019069
                  label: viral capsid assembly
              - preferred_term: viral DNA genome packaging
                term:
                  id: GO:0019073
                  label: viral DNA genome packaging
              - preferred_term: symbiont genome ejection through host cell envelope, contractile tail mechanism
                term:
                  id: GO:0099000
                  label: symbiont genome ejection through host cell envelope, contractile tail mechanism
            protein_complex:
              preferred_term: viral portal complex
              term:
                id: GO:0046798
                label: viral portal complex
            locations:
              - preferred_term: host cell cytoplasm
                term:
                  id: GO:0030430
                  label: host cell cytoplasm
            evidence:
              - source_id: file:genes/BPMU/H/H-uniprot.txt
                statement: Portal protein H forms the dodecameric portal vertex involved in head assembly, terminase docking for genome packaging, neck/tail attachment, and genome ejection.
                supporting_text: 'Forms the portal vertex of the capsid. This portal plays     critical roles in head assembly, genome packaging, neck/tail     attachment, and genome ejection.'
            role_description: Forms the 12-subunit portal ring at the unique capsid vertex for DNA translocation, tail attachment, and genome ejection.
          - id: i_procapsid_maturation_protease
            label: Protease I (and internal isoform scaffold Z) procapsid assembly and proteolytic maturation
