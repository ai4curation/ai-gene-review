id: MODULE:phage_mu_headful_packaging_contractile_tail_and_sar_lysis
title: Escherichia Phage Mu Procapsid Maturation, Headful Cointegrate Packaging, Contractile Tail Assembly, and Releasin-SAR-Endolysin-Spanin Lysis
description: 'A concrete pathway module for Escherichia phage Mu (Muvirus mu, NCBITaxon:2681603) covering the late virion morphogenesis and host-cell lysis program: (1) assembly and maturation of the T=7 icosahedral procapsid from the dodecameric portal protein H (Q9T1W5), dual protease/internal scaffolding protein I/Z (Q01267), minor/assembly capsid proteins F (Q01259) and G (Q01261), and major capsid protein T (Q9T1W1); (2) pac-site-initiated headful DNA packaging directly from host chromosomal cointegrates by the small terminase subunit gp27 (Mup27, Q9T1W7) and large terminase subunit gp28 (Mup28, Q9T1W6), encapsulating ~50-150 bp of left-end and ~0.5-3 kb of right-end host flanking DNA; (3) assembly of the simple myoviral contractile tail from the baseplate hub gp44 (P, P08558), Ca2+-binding puncturing spike gp45 (Mup45, Q9T1V4), baseplate wedge subunits gp46-gp48 (Mup46-Mup48, Q9T1V3/Q9T1V2/Q9T1V1), tape measure protein gp42 (Mup42, Q9T1V6), ribosomal-frameshift tail assembly chaperones gp41/FS-gp41 (Mup41/FS-gp41, P79680/P0DJY4), tail tube protein M (P79679), contractile sheath protein L (P79678), and tail/sheath terminators gp37/gp38 (Mup37/Mup38, Q9T1V8/P79677); and (4) three-step programmed host lysis by the inner-membrane releasin gp25 (Mup25, Q9T1W9), signal-arrest-release (SAR) endolysin Lys (Q9T1X2), and two-component spanin complex gp23/gp23.1 (Mup23/Mup23.1, Q9T1X1/P0DTL7).'
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:14745593
    title: 'Characterization of Plys-proximal morphogenetic genes of transposable bacteriophage Mu.'
    statement: Characterizes the Plys-proximal lysis and DNA maturation/packaging gene cluster (encoding the terminase subunits gp27/D and gp28/E that recognize the Mu pac site) required to package Mu DNA from dispersed chromosomal integration sites.
    supporting_text: 'Late during the bacteriophage Mu lytic cycle, Mu DNA must be matured and packaged from its dispersed integration sites in the host DNA in order to produce progeny virions.'
  - source_id: PMID:27555589
    title: 'Baseplate assembly of phage Mu: Defining the conserved core components of contractile-tailed phages and related bacterial systems.'
    statement: Defines the minimal myoviral baseplate architecture of phage Mu composed of the central hub complex (gp44/P, N, and gp45) surrounded by independently assembled peripheral wedges (gp46, gp47, and gp48).
    supporting_text: 'We show that the Mu baseplate is constructed through the independent assembly of wedges that are organized around a central hub complex.'
  - source_id: PMID:16125724
    title: 'Structure of the central hub of bacteriophage Mu baseplate determined by X-ray crystallography of gp44.'
    statement: Resolves the crystal structure of the trimeric gp44 (P) baseplate central hub ring through which viral DNA passes during tail contraction and genome ejection.
    supporting_text: 'Bacteriophage Mu is a double-stranded DNA phage that consists of an icosahedral head, a contractile tail with baseplate and six tail fibers, similar to the well-studied T-even phages.'
notes: Curated for Phase 7 of the Bacteriophage Genome & Module Curation project (`projects/PHAGES.md`). Phage Mu packages its linear dsDNA genome by a headful mechanism directly out of integrated host-chromosome cointegrates rather than concatemers, cutting within host DNA ~50-150 bp upstream of the left attL end and ~0.5-3 kb downstream of the right attR end. Note that GOA IEA mappings from InterPro (`IPR005039`) erroneously assign `GO:0032359` (`provirus excision`) to the Mu terminase subunits Mup27 and Mup28; in phage Mu, these proteins mediate headful packaging cleavage (`GO:0019073`) and never excise a prophage.
module:
