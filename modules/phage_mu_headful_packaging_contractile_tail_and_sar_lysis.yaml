    - order: 4
      role: Three-step programmed host lysis via Releasin, SAR-Endolysin, and Spanin complex
      node:
        id: mu_releasin_sar_endolysin_spanin_lysis
        label: Releasin gp25 mobilization of SAR-endolysin Lys and outer-membrane disruption by spanin gp23/gp23.1
        module_type: BIOLOGICAL_PROCESS
        description: Unlike canonical holin-endolysin phages, phage Mu exports its lysozyme Lys (gp22) across the inner membrane via the host Sec pathway in a membrane-tethered, inactive signal-arrest-release (SAR) state. The inner-membrane releasin protein gp25 (Mup25) facilitates release of the N-terminal SAR transmembrane domain from the inner membrane into the periplasm, where refolded active Lys hydrolyzes the peptidoglycan meshwork. Removal of the peptidoglycan barrier allows the periplasm-spanning inner/outer-membrane spanin complex (i-spanin gp23/Mup23 and o-spanin lipoprotein gp23.1/Mup23.1) to disrupt the host outer membrane and release progeny virions.
        annotons:
          - id: mup25_releasin_sar_mobilization
            label: Releasin protein gp25 inner-membrane release of the tethered SAR-endolysin
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: Mup25 (Escherichia phage Mu)
                term:
                  id: UniProtKB:Q9T1W9
                  label: Releasin protein
              description: Single-pass inner-membrane releasin protein gp25 (Mup25) that triggers release of the membrane-tethered SAR-endolysin Lys into the periplasm.
            processes:
              - preferred_term: viral release from host cell by cytolysis
                term:
                  id: GO:0044659
                  label: viral release from host cell by cytolysis
              - preferred_term: viral release via disruption of host peptidoglycan cell wall
                term:
                  id: GO:0140913
                  label: viral release via disruption of host peptidoglycan cell wall
            locations:
              - preferred_term: host cell plasma membrane
                term:
                  id: GO:0020002
                  label: host cell plasma membrane
            evidence:
              - source_id: file:genes/BPMU/Mup25/Mup25-uniprot.txt
                statement: Releasin protein gp25 localizes to the host inner membrane and facilitates the release of the SAR-endolysin.
                supporting_text: 'Facilitates the release of the SAR-endolysin.     {ECO:0000269|PubMed:35471081}.'
            role_description: Triggers release of the Sec-exported SAR-endolysin Lys from the host inner membrane into the periplasm to initiate timed lysis.
          - id: lys_sar_endolysin_peptidoglycan_hydrolysis
            label: SAR-endolysin Lys lysozyme cleavage of host periplasmic peptidoglycan
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: lys (Escherichia phage Mu)
                term:
                  id: UniProtKB:Q9T1X2
                  label: SAR-endolysin
              description: Signal-arrest-release (SAR) muramidase Lys (gp22) that is released from the inner membrane by gp25 releasin to degrade the periplasmic peptidoglycan cell wall.
            function:
              preferred_term: lysozyme activity
              term:
                id: GO:0003796
                label: lysozyme activity
            processes:
              - preferred_term: peptidoglycan catabolic process
                term:
                  id: GO:0009253
                  label: peptidoglycan catabolic process
              - preferred_term: viral release from host cell by cytolysis
                term:
                  id: GO:0044659
                  label: viral release from host cell by cytolysis
            locations:
              - preferred_term: host cell plasma membrane
                term:
                  id: GO:0020002
                  label: host cell plasma membrane
              - preferred_term: periplasmic space
                term:
                  id: GO:0042597
                  label: periplasmic space
            evidence:
              - source_id: file:genes/BPMU/lys/lys-uniprot.txt
                statement: SAR-endolysin Lys is released by the releasin protein into the periplasm, where its lysozyme activity degrades host peptidoglycan during programmed host cell lysis.
                supporting_text: Signal-arrest-release (SAR) endolysin with lysozyme activity     that degrades host peptidoglycans and participates with the releasin     and spanin proteins in the sequential events which lead to programmed     host cell lysis releasing the mature viral particles.
            role_description: Hydrolyzes beta-(1->4) glycosidic linkages in the host peptidoglycan sacculus once released from the inner membrane into the periplasm.
          - id: mup23_inner_membrane_spanin_subunit
            label: Spanin inner membrane subunit gp23 periplasmic bridge and outer-membrane disruption
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: Mup23 (Escherichia phage Mu)
                term:
                  id: UniProtKB:Q9T1X1
                  label: Spanin, inner membrane subunit
              description: Inner-membrane spanin subunit gp23 (Mup23, i-spanin) that pairs with outer-membrane lipoprotein gp23.1 across the periplasm to disrupt the host outer membrane after peptidoglycan degradation.
            processes:
              - preferred_term: viral release from host cell by cytolysis
                term:
                  id: GO:0044659
