                statement: Terminase large subunit gp28 acts as an ATP-driven molecular motor for DNA translocation into empty procapsids and as an endonuclease that initiates and terminates headful packaging.
                supporting_text: The terminase large subunit acts as an ATP driven molecular     motor necessary for viral DNA translocation into empty capsids and as     an endonuclease that cuts the viral genome to initiate and to end a     packaging reaction.
            role_description: Cleaves host DNA flanking integrated Mu cointegrates and translocates a headful (~39 kb) linear genome into the procapsid.
