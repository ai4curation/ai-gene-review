        id: GO:0019069
        label: viral capsid assembly
      description: Assembly and protease-mediated maturation of the T=7 icosahedral Mu procapsid.
    - preferred_term: viral DNA genome packaging
      term:
        id: GO:0019073
        label: viral DNA genome packaging
      description: Headful packaging of Mu DNA together with flanking host DNA segments directly from integrated chromosomal cointegrates.
    - preferred_term: viral tail assembly
      term:
        id: GO:0098003
        label: viral tail assembly
      description: Assembly of the simple contractile myoviral tail around the gp44-gp48 baseplate and gp42 tape measure protein.
    - preferred_term: viral release from host cell by cytolysis
      term:
        id: GO:0044659
        label: viral release from host cell by cytolysis
      description: Programmed host cell lysis orchestrated by the gp25 releasin, gp22 SAR-endolysin (Lys), and gp23/gp23.1 two-component spanin complex.
