                term:
                  id: UniProtKB:Q9T1W7
                  label: Probable terminase, small subunit gp27
              description: Small terminase subunit gp27 (Mup27) that binds the Mu pac packaging site and regulates the ATPase/nuclease activities of large terminase gp28.
            function:
              preferred_term: DNA binding
              term:
                id: GO:0003677
                label: DNA binding
            processes:
              - preferred_term: viral DNA genome packaging
                term:
                  id: GO:0019073
                  label: viral DNA genome packaging
            protein_complex:
              preferred_term: viral terminase, small subunit
              term:
                id: GO:0097710
                label: viral terminase, small subunit
            locations:
