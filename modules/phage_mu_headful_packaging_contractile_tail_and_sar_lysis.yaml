                statement: Terminase small subunit gp27 binds the pac packaging initiation site and regulates the ATPase activity of the large terminase subunit gp28.
                supporting_text: 'The terminase small subunit binds to the packaging initiation     site (pac) and regulates the ATPase activity of the terminase large     subunit.'
            role_description: Recognizes the viral pac sequence on chromosomal cointegrates and positions the large terminase for upstream host-DNA cleavage and packaging initiation.
