    - order: 2
      role: Headful DNA packaging directly from chromosomal cointegrates
      node:
        id: mu_terminase_headful_cointegrate_packaging
        label: Terminase small subunit gp27 pac recognition and large subunit gp28 headful cleavage and translocation
        module_type: BIOLOGICAL_PROCESS
        description: The small terminase subunit gp27 (Mup27) recognizes the viral pac site near the left end of an integrated Mu copy and recruits the large terminase subunit gp28 (Mup28). Rather than cutting at the Mu attL boundary, the terminase complex reaches into the adjacent host chromosome ~50-150 bp upstream of the left end to make the initial endonucleolytic cut, docks onto the portal vertex (H) of an empty procapsid, and uses ATP hydrolysis to translocate ~39 kb of DNA until the head is full—making the terminal cut ~0.5-3 kb inside host chromosomal DNA past the right attR end.
        annotons:
          - id: mup27_terminase_small_subunit_pac_recognition
            label: Terminase small subunit gp27 pac-site DNA binding and motor regulation
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
