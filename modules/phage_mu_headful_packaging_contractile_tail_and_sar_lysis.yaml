                statement: Inner-membrane spanin subunit gp23 complexes with the outer-membrane spanin subunit to disrupt the host outer membrane after endolysin-mediated peptidoglycan degradation.
                supporting_text: Component of the spanin complex that disrupts the host outer     membrane and causes cell lysis during virus exit. The spanin complex     conducts the final step in host lysis by disrupting the outer membrane     after endolysin action has degraded the host peptidoglycans.
