            label: Portal protein H dodecameric vertex assembly and genome conduit formation
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: H (Escherichia phage Mu)
                term:
                  id: UniProtKB:Q9T1W5
                  label: Portal protein
              description: Homododecameric portal vertex protein H (gp29) that nucleates procapsid assembly, docks the gp27/gp28 terminase motor, links the head to the neck/tail, and forms the channel for DNA packaging and ejection.
            function:
              preferred_term: structural constituent of virion
              term:
                id: GO:0039660
                label: structural constituent of virion
            processes:
