                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Cofactor-free one-step alternative, typical of bacteria
                      and also found in anaerobic fungi; S. cerevisiae lacks it.
    - order: 2
      role: xylulose phosphorylation
      node:
        id: xylulose_phosphorylation
        label: D-xylulose + ATP to D-xylulose 5-phosphate + ADP
        module_type: REACTION
        concepts:
          - preferred_term: xylulose catabolic process
            term:
              id: GO:0005998
              label: xylulose catabolic process
        annotons:
          - id: xylulokinase_activity
            label: FGGY-family D-xylulokinase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: D-xylulokinase activity
                term:
                  id: GO:0004856
                  label: D-xylulokinase activity
              family:
                preferred_term: FGGY-family D-xylulokinase
                family_terms:
                  - id: PANTHER:PTHR10196:SF57
                    label: XYLULOSE KINASE
                  - id: PANTHER:PTHR43095
                    label: SUGAR KINASE
                description: >-
                  UniProt places S. cerevisiae XKS1 in PTHR10196:SF57 and
                  E. coli XylB in PTHR43095; both are FGGY carbohydrate kinases.
                representative_members:
                  - preferred_term: XKS1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P42826
                      label: Xylulose kinase
                    description: >-
                      S. cerevisiae XKS1/YGR194C, rate-limiting for xylulose
                      use (PMID:9595677, PMID:10981687).
                  - preferred_term: xylB (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P09099
                      label: Xylulose kinase
                    description: E. coli xylulokinase, encoded next to xylA.
            function:
              preferred_term: D-xylulokinase activity
              term:
                id: GO:0004856
                label: D-xylulokinase activity
              substrates:
                - preferred_term: D-xylulose
                - preferred_term: ATP
              products:
                - preferred_term: D-xylulose 5-phosphate
                - preferred_term: ADP
              evidence:
                - source_id: EC:2.7.1.17
                  statement: xylulokinase
                  notes: MetaCyc/YeastCyc XYLULOKIN-RXN
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Shared terminal step of both entry routes. Produces D-xylulose
              5-phosphate for the non-oxidative pentose phosphate pathway
              (module pentose_phosphate_nonoxidative_branch).
  connections:
    - source: xylose_to_xylulose
      target: xylulose_phosphorylation
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: D-xylulose from either route is the xylulokinase substrate; no CoA intermediate.
  notes: >-
    NEW module (YeastPathways crosswalk, 2026-10) generalising PWY3O-8 (xylose
    metabolism) and PWY3O-5 (xylulose degradation). The crosswalk slug names
    the fungal oxidoreductase route, but the module also includes the
    bacterial and anaerobic-fungal xylose isomerase as an alternative entry
    variant, as the crosswalk scope asks; the xylulokinase step is common to
    both. Boundary: xylose transport (hexose transporters in S. cerevisiae)
    and the pentose phosphate pathway are outside. S. cerevisiae: all three
    enzymes are present, but wild-type cells grow on xylulose and not on xylose
    and convert xylose mainly to xylitol (PMID:18555359, PMID:15184173),
    because GRE3 and XYL2 activities are low, the NADPH-preferring reductase
    and NAD+-dependent dehydrogenase unbalance cofactors, and XKS1 expression
    is low (PMID:10981687). Other S. cerevisiae aldose reductases (for example
    YPR1) and sorbitol dehydrogenases SOR1/SOR2 can contribute to the two
    oxidoreductase steps (SOR1 is xylose-induced, PMID:15184173); they were
    not added as exemplars because their in vivo contribution is not
    established. YeastCyc corrections: the GRE3 reaction RXN-8773 is written
    in the xylitol-oxidation direction with EC 1.1.1.21; the module models
    the physiological reduction of D-xylose. GO-CAM disagreements: the
    YeastPathways PWY3O-8 model types GRE3 with the general aldose reductase
    (NADPH) term GO:0004032 and uses the broad process D-xylose metabolic
    process (GO:0042732); there is no GO-CAM for the XKS1 step. No PomBase
    GO-CAM is linked and S. pombe is not used as an exemplar.
