                              - source_id: EC:1.1.1.431
                                statement: D-xylose reductase (NADPH)
                                notes: Dual-cofactor reductases such as S. stipitis XYL1 also have EC 1.1.1.430 (NADH).
                              - source_id: EC:1.1.1.21
                                statement: aldose reductase
                                notes: YeastCyc RXN-8773 is written as EC 1.1.1.21 in the reverse direction.
                          locations:
                            - preferred_term: cytosol
                              term:
                                id: GO:0005829
                                label: cytosol
                          gocam_associations:
                            - model: gomodel:YeastPathways_PWY3O-8
                              activity: gomodel:RXN-8773
                              title: 'xylose metabolism - imported from: Saccharomyces Genome Database'
                              description: >-
                                GRE3 enables GO:0004032 aldose reductase (NADPH)
                                activity, the parent class of the xylose-specific
                                term used here.
                          role_description: >-
                            First step of the fungal route. In S. cerevisiae
                            GRE3 is a stress-induced broad-specificity aldose
                            reductase rather than a dedicated xylose reductase.
                  - order: 2
                    role: xylitol oxidation
                    node:
