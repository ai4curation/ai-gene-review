                  - source: xylose_reduction
                    target: xylitol_oxidation
                    connection_type: PRECEDES
                    chaining_status: VERIFIED
                    chaining_note: Xylitol made by the reductase is the dehydrogenase substrate; no CoA intermediate.
              - id: isomerase_route
                label: Xylose isomerase
                module_type: REACTION
                annotons:
                  - id: xylose_isomerase_activity
                    label: Xylose isomerase
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: xylose isomerase activity
                        term:
                          id: GO:0009045
                          label: xylose isomerase activity
                      family:
                        preferred_term: xylose isomerase (XylA)
