id: MODULE:xylose_oxidoreductase_pathway
title: D-xylose catabolism to D-xylulose 5-phosphate (oxidoreductase and isomerase routes)
description: >-
  D-xylose, the main pentose of plant hemicellulose, is channelled into the
  pentose phosphate pathway as D-xylulose 5-phosphate. The isomerisation of
  xylose to xylulose is achieved by one of two routes. In xylose-utilising
  yeasts and filamentous fungi, an aldo-keto reductase family xylose reductase
  reduces D-xylose to xylitol with NADPH (or NADH), and an NAD+-dependent
  medium-chain dehydrogenase, xylitol dehydrogenase (D-xylulose reductase),
  oxidises xylitol to D-xylulose. Because the two steps use different
  cofactors, the route can create a redox imbalance and xylitol accumulation
  under oxygen limitation. Bacteria, and some anaerobic fungi, instead use a
  single cofactor-free xylose isomerase. In both routes an FGGY-family
  xylulokinase then phosphorylates D-xylulose with ATP to D-xylulose
  5-phosphate, which enters the non-oxidative pentose phosphate pathway. Xylose
  uptake and downstream pentose phosphate metabolism are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0042843
    title: D-xylose catabolic process
    statement: Module-level process concept.
  - source_id: GO:0005998
    title: xylulose catabolic process
    statement: Process concept for the xylulokinase step, which also serves xylulose taken up directly.
  - source_id: YeastPathways:PWY3O-8
    title: xylose metabolism (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists RXN-8773 (GRE3 aldose reductase, written in the xylitol
      oxidation direction) and D-XYLULOSE-REDUCTASE-RXN (XYL2). Both
      assignments were retained; the reductase reaction is modelled in its
      physiological direction (xylose to xylitol).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-8
  - source_id: YeastPathways:PWY3O-5
    title: xylulose degradation (S. cerevisiae, SGD YeastPathways)
    statement: YeastCyc lists XYLULOKIN-RXN with XKS1. Retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-5
  - source_id: PMID:15184173
    title: Endogenous xylose pathway in Saccharomyces cerevisiae.
    statement: >-
      Overexpression of the endogenous GRE3 aldose reductase and XYL2 xylitol
      dehydrogenase lets S. cerevisiae grow (slowly) on xylose; the
      S. stipitis XR and XDH work better.
    supporting_text: >-
      We found that S. cerevisiae can grow on D-xylose
      when only the endogenous genes GRE3 (YHR104w), coding for a nonspecific aldose
      reductase, and XYL2 (YLR070c, ScXYL2), coding for a xylitol dehydrogenase (XDH),
      are overexpressed under endogenous promoters.
  - source_id: PMID:7747971
    title: Purification and partial characterization of an aldo-keto reductase from Saccharomyces cerevisiae.
    statement: >-
      The cytosolic NADPH-specific aldo-keto reductase later identified as
      GRE3 resembles yeast and mammalian aldose reductases and has broad
      aldehyde specificity.
    supporting_text: >-
      These data indicate that the S. cerevisiae aldo-keto reductase is a monomeric
      NADPH-specific reductase with strong similarities to the aldose reductases.
  - source_id: PMID:10486580
    title: Evidence that the gene YLR070c of Saccharomyces cerevisiae encodes a xylitol dehydrogenase.
    statement: XYL2/YLR070C encodes an NADH-specific xylitol dehydrogenase.
    supporting_text: >-
      Overexpression of this open reading frame in S. cerevisiae
      resulted in xylitol dehydrogenase activity. The enzyme is specific for NADH.
  - source_id: PMID:18555359
    title: Direct evidence for a xylose metabolic pathway in Saccharomyces cerevisiae.
    statement: >-
      Wild-type S. cerevisiae has low xylose reductase and xylitol
      dehydrogenase activity and converts xylose mainly to xylitol.
    supporting_text: >-
      In vivo conversion of
      (14)C-xylose in S. cerevisiae is demonstrated and xylitol is detected
  - source_id: PMID:9595677
    title: The YGR194c (XKS1) gene encodes the xylulokinase from the budding yeast Saccharomyces cerevisiae.
    statement: XKS1 is required for growth on D-xylulose and encodes xylulokinase.
    supporting_text: >-
      We report the finding of a Saccharomyces cerevisiae gene necessary for growth in
      culture media with D-xylulose as the sole carbon source.
  - source_id: PMID:10981687
    title: The role of xylulokinase in Saccharomyces cerevisiae xylulose catabolism.
    statement: >-
      Xylulokinase is rate-limiting for xylulose use in S. cerevisiae; xks1
      deletion prevents xylulose metabolism.
    supporting_text: >-
      deletion of the gene prevented growth on
      D-xylulose and D-xylulose metabolism.
  - source_id: PMID:1756986
    title: Cloning and expression in Saccharomyces cerevisiae of the NAD(P)H-dependent xylose reductase-encoding gene (XYL1) from the xylose-assimilating yeast Pichia stipitis.
    statement: Scheffersomyces (Pichia) stipitis XYL1 encodes the NADH/NADPH-dependent xylose reductase.
    supporting_text: >-
      The XYL1 encodes a polypeptide of
      35,927 Da that constitutes a NADH/NADPH-dependent xylose reductase (XR).
  - source_id: PMID:2127555
    title: Isolation and characterization of the Pichia stipitis xylitol dehydrogenase gene, XYL2, and construction of a xylose-utilizing Saccharomyces cerevisiae transformant.
    statement: >-
      S. stipitis XYL2 encodes xylitol dehydrogenase; XYL1 plus XYL2 let
      S. cerevisiae grow on xylose.
    supporting_text: >-
      S. cerevisiae cells transformed with a plasmid, pRD1, containing
      both the xylose reductase gene (XYL1) and the xylitol dehydrogenase gene (XYL2),
      were able to grow on xylose as a sole carbon source.
  - source_id: PMID:14554198
    title: 'High-level functional expression of a fungal xylose isomerase: the key to efficient ethanolic fermentation of xylose by Saccharomyces cerevisiae?'
    statement: >-
      The anaerobic fungus Piromyces sp. E2 uses xylose isomerase rather than
      the reductase/dehydrogenase route, so the isomerase variant is not
      restricted to bacteria.
    supporting_text: >-
      Evidence is presented that xylose metabolism in the anaerobic cellulolytic
      fungus Piromyces sp. E2 proceeds via a xylose isomerase rather than via the
      xylose reductase/xylitol-dehydrogenase pathway found in xylose-metabolising
      yeasts.
  - source_id: PMID:20171088
    title: 'Hemicelluloses for fuel ethanol: A review.'
    statement: >-
      Background review on hemicellulose-derived xylose and its fermentation
      (cited by YeastPathways for both frames).
module:
  id: xylose_oxidoreductase_pathway
  label: D-xylose catabolism to D-xylulose 5-phosphate
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: D-xylose catabolic process
      term:
        id: GO:0042843
        label: D-xylose catabolic process
      description: Conversion of D-xylose to D-xylulose 5-phosphate for entry into the pentose phosphate pathway.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-8
      title: 'xylose metabolism - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion for S. cerevisiae with GRE3 (GO:0004032 aldose
        reductase (NADPH) activity) and XYL2 (GO:0046526) in cytosol, part of
        D-xylose metabolic process (GO:0042732), no causal edge. The
        xylulokinase step (separate YeastCyc frame PWY3O-5) has no GO-CAM.
  parts:
    - order: 1
      role: isomerisation of D-xylose to D-xylulose
      node:
        id: xylose_to_xylulose
        label: D-xylose to D-xylulose
        module_type: METABOLIC_PATHWAY
        variant_sets:
          - id: xylose_entry_route_variants
            label: Two-step oxidoreductase route versus one-step isomerase route
            axis: route
            selection: ONE_OR_MORE
            notes: >-
              Fungi typically use the oxidoreductase route and bacteria the
              isomerase route, but anaerobic fungi such as Piromyces use a
              xylose isomerase (PMID:14554198). Engineered S. cerevisiae strains
              use either.
            variants:
              - id: oxidoreductase_route
                label: Xylose reductase plus xylitol dehydrogenase
                module_type: METABOLIC_PATHWAY
                parts:
                  - order: 1
                    role: xylose reduction
                    node:
                      id: xylose_reduction
                      label: D-xylose + NAD(P)H to xylitol + NAD(P)+
                      module_type: REACTION
                      annotons:
                        - id: xylose_reductase_activity
                          label: Aldo-keto reductase family xylose reductase
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: D-xylose reductase (NADPH) activity
                              term:
                                id: GO:0032866
                                label: D-xylose reductase (NADPH) activity
                            family:
                              preferred_term: AKR2-type aldose/xylose reductase
                              term:
                                id: PANTHER:PTHR11732
                                label: ALDO/KETO REDUCTASE
                              description: >-
                                Broad aldo-keto reductase family; xylose
                                reductases are a subset and many members
                                act on other aldehydes.
                              representative_members:
                                - preferred_term: GRE3 (Saccharomyces cerevisiae)
                                  term:
                                    id: UniProtKB:P38715
                                    label: NADPH-dependent aldose reductase GRE3
                                  description: >-
                                    S. cerevisiae GRE3/YHR104W, an NADPH-specific
                                    non-specific aldose reductase that reduces
                                    xylose (PMID:7747971, PMID:15184173).
                                - preferred_term: XYL1 (Scheffersomyces stipitis)
                                  term:
                                    id: UniProtKB:P31867
                                    label: NAD(P)H-dependent D-xylose reductase
                                  description: >-
                                    Dedicated xylose reductase of a natural
                                    xylose-fermenting yeast; uses NADPH and NADH
                                    (PMID:1756986).
                          function:
                            preferred_term: D-xylose reductase (NADPH) activity
                            term:
                              id: GO:0032866
                              label: D-xylose reductase (NADPH) activity
                            substrates:
                              - preferred_term: D-xylose
                              - preferred_term: NADPH
                            products:
                              - preferred_term: xylitol
                              - preferred_term: NADP+
