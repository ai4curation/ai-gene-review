                      annotons:
                        - id: xylitol_dehydrogenase_activity
                          label: Xylitol dehydrogenase (D-xylulose reductase)
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: D-xylulose reductase activity
                              term:
                                id: GO:0046526
                                label: D-xylulose reductase activity
                            family:
                              preferred_term: medium-chain zinc dehydrogenase xylitol dehydrogenase subfamily
                              term:
                                id: PANTHER:PTHR43161:SF9
                                label: SORBITOL DEHYDROGENASE
                              description: >-
                                UniProt places S. cerevisiae XYL2 and
                                S. stipitis XYL2 in this subfamily; it is
                                named after the related sorbitol
                                dehydrogenases.
                              representative_members:
                                - preferred_term: XYL2 (Saccharomyces cerevisiae)
                                  term:
                                    id: UniProtKB:Q07993
                                    label: D-xylulose reductase
                                  description: >-
                                    S. cerevisiae XYL2/YLR070C, NADH-specific
                                    xylitol dehydrogenase (PMID:10486580).
                                - preferred_term: XYL2 (Scheffersomyces stipitis)
                                  term:
                                    id: UniProtKB:P22144
                                    label: D-xylulose reductase
                                  description: S. stipitis xylitol dehydrogenase (PMID:2127555).
                          function:
                            preferred_term: D-xylulose reductase activity
                            term:
                              id: GO:0046526
                              label: D-xylulose reductase activity
                            substrates:
                              - preferred_term: xylitol
                              - preferred_term: NAD+
                            products:
                              - preferred_term: D-xylulose
                              - preferred_term: NADH
                            evidence:
                              - source_id: EC:1.1.1.9
                                statement: D-xylulose reductase
                                notes: MetaCyc/YeastCyc D-XYLULOSE-REDUCTASE-RXN
                          locations:
                            - preferred_term: cytosol
                              term:
                                id: GO:0005829
                                label: cytosol
                          gocam_associations:
                            - model: gomodel:YeastPathways_PWY3O-8
                              activity: gomodel:D-XYLULOSE-REDUCTASE-RXN
                              title: 'xylose metabolism - imported from: Saccharomyces Genome Database'
                              description: XYL2 enables GO:0046526 in cytosol.
                          role_description: >-
                            NAD+-dependent second step. Its cofactor
                            preference differs from the NADPH-preferring
                            reductase, which causes NADH accumulation and
                            xylitol excretion under oxygen limitation.
