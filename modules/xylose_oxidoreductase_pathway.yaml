                      products:
                        - preferred_term: D-xylulose
                      cofactors:
                        - preferred_term: divalent metal cation (Mg2+ or Mn2+)
                      evidence:
                        - source_id: EC:5.3.1.5
                          statement: xylose isomerase
                    locations:
                      - preferred_term: cytosol
