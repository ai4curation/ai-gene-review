                              label: Lipopolysaccharide export system ATP-binding protein LptB
                          - preferred_term: lptB (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88P99
                              label: Lipopolysaccharide export system ATP-binding protein LptB
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
                  - id: lptf_permease
                    label: LptF permease subunit
                    role: One half of the transmembrane cavity; its periplasmic beta-jellyroll docks
                      LptC.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: LptF permease subfamily
                        term:
                          id: PANTHER:PTHR33529:SF7
                          label: LIPOPOLYSACCHARIDE EXPORT SYSTEM PERMEASE PROTEIN LPTF
                        representative_members:
                          - preferred_term: lptF (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P0AF98
                              label: Lipopolysaccharide export system permease protein LptF
                          - preferred_term: PP_0982 / lptF (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88P71
                              label: Lipopolysaccharide export system permease protein LptF
                        ancestral_nodes:
