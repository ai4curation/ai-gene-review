                  - id: lptg_permease
                    label: LptG permease subunit
                    role: Other half of the transmembrane cavity; binds the lipid A phosphates.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: LptG permease subfamily
                        term:
                          id: PANTHER:PTHR33529:SF2
                          label: LIPOPOLYSACCHARIDE EXPORT SYSTEM PERMEASE PROTEIN LPTG
                        representative_members:
                          - preferred_term: lptG (Escherichia coli K-12)
                            term:
