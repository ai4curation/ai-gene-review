id: MODULE:bacterial_lps_transport
title: Bacterial lipopolysaccharide transport
description: >-
  Reusable module for ATP-driven extraction of lipopolysaccharide (LPS) from the outer
  leaflet of the inner membrane of diderm bacteria, its transfer across the periplasm along
  the trans-envelope Lpt protein bridge, and its insertion into the outer leaflet of the
  outer membrane. The module separates the LptB2FGC inner-membrane extraction machine, the
  soluble LptA bridge, and the LptD/LptE outer-membrane translocon, which together form the
  seven-protein lipopolysaccharide transport system.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0015920
    title: lipopolysaccharide transport
    statement: >-
      GO:0015920 grounds movement of LPS from the inner membrane to the cell surface through
      the trans-envelope Lpt system.
  - source_id: GO:0062051
    title: lipopolysaccharide transport system
    statement: >-
      GO:0062051 (is_a GO:1990351 transporter complex) is the GO complex term for the whole
      trans-envelope Lpt machine; its definition cites PMID:29449493.
  - source_id: PMID:22668317
    title: Regulated assembly of the transenvelope protein complex required for lipopolysaccharide
      export.
    statement: >-
      Defines the seven essential Lpt proteins and the transenvelope bridge model on which
      the module's three parts are based.
    supporting_text: >-
      In Escherichia coli, this LPS transport process is known to require the seven
      essential Lpt proteins,7 but how these proteins move large, amphipathic LPS molecules
      across both membranes and the periplasmic space is not understood.
  - source_id: PMID:18424520
    title: Functional analysis of the protein machinery required for transport of lipopolysaccharide
      to the outer membrane of Escherichia coli.
    statement: >-
      Places LptA, LptB, LptC, LptD and LptE in one LPS transport machine.
    supporting_text: >-
      In this paper we provide evidence that LptA, LptB, LptD, LptE, and YrbK (renamed
      LptC), an essential IM protein characterized here, are all members of the same LPS
      transport machinery.
  - source_id: PMID:18375759
    title: Identification of two inner-membrane proteins required for the transport of lipopolysaccharide
      to the outer membrane of Escherichia coli.
    statement: >-
      Identifies LptF and LptG as the transmembrane subunits of the LptB-energized
      extraction transporter.
    supporting_text: >-
      We propose that these two proteins, which we have renamed LptF and LptG,
      respectively, are the missing transmembrane components of the ABC transporter that,
      together with LptB, functions to extract LPS from the IM en route to the OM.
  - source_id: KEGG:ppu00540
    title: Pseudomonas putida KT2440 lipopolysaccharide biosynthesis
    statement: >-
      KEGG ppu00540 includes the P. putida KT2440 Lpt components associated with LPS
      biogenesis and export, supporting the KT2440 exemplars.
notes: >-
  Scope and taxonomy. The Lpt system is present in diderm bacteria that build an LPS outer
  leaflet: all seven components were defined and characterized in Escherichia coli K-12,
  and orthologues are found across Proteobacteria and other LPS-bearing phyla (PANTHER
  reference trees include Chlamydia, Bacteroides, Leptospira, Aquifex and cyanobacteria).
  The module therefore uses E. coli K-12 as the primary experimental exemplar and
  Pseudomonas putida KT2440 as a second, independently curated exemplar. It is
  lineage-specific: monoderm bacteria (Bacillus subtilis), mycobacteria and Rhodococcus,
  which build mycolate rather than LPS outer layers, and eukaryotes lack the Lpt system, so
  no members are listed for them. Homologues in diderms without canonical LPS
  (Deinococcus, Thermotoga) are untested and are discussed in the family reviews.
  P. putida PP_0982 and PP_0983 encode LptF and LptG but lack lpt gene symbols in UniProt.
  MsbA flipping of LPS across the inner membrane, LPS biosynthesis, and core/O-antigen
  assembly are upstream and outside this transport module.
