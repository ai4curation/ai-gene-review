id: MODULE:bacterial_lps_transport
title: Bacterial lipopolysaccharide transport
description: >-
  Reusable Gram-negative bacterial module for ATP-driven extraction of
  lipopolysaccharide (LPS) from the outer leaflet of the inner membrane,
  transfer across the periplasmic Lpt bridge, and insertion into the outer
  leaflet of the outer membrane. The module separates the LptB2FGC inner-
  membrane machine, soluble LptA bridge, and LptDE outer-membrane translocon.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0015920
    title: lipopolysaccharide transport
    statement: >-
      GO:0015920 grounds movement of LPS through the trans-envelope Lpt system.
  - source_id: GO:1990351
    title: lipopolysaccharide transport complex
    statement: >-
      GO:1990351 grounds the outer-membrane LptD/LptE assembly.
  - source_id: KEGG:ppu00540
    title: Pseudomonas putida KT2440 lipopolysaccharide biosynthesis
    statement: >-
      KEGG ppu00540 includes the KT2440 Lpt components associated with LPS
      biogenesis and export.
notes: >-
  P. putida genes PP_0982 and PP_0983 encode the LptF and LptG permease
  subunits but lack standard lpt gene symbols in UniProt. Biosynthetic enzymes
  and LPS core/O-antigen assembly are outside this transport module.
module:
  id: bacterial_lps_transport
  label: LPS transport from inner to outer membrane
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: lipopolysaccharide transport
      term:
        id: GO:0015920
        label: lipopolysaccharide transport
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: ATP-driven LPS extraction from the inner membrane
      node:
        id: inner_membrane_lptb2fgc
        label: LptB2FGC inner-membrane extraction machine
        module_type: PROTEIN_COMPLEX
        description: >-
          Cytosolic LptB ATPases energize the LptF/LptG permease. LptC couples
          the inner-membrane machine to the periplasmic transport bridge.
        annotons:
          - id: lptb_atpase
            label: LptB ATPase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LptB family
                term:
                  id: PANTHER:PTHR45772
                  label: LIPOPOLYSACCHARIDE EXPORT SYSTEM ATP-BINDING PROTEIN LPTB
                representative_members:
                  - preferred_term: PSEPK LptB exemplar
                    term:
                      id: UniProtKB:Q88P99
                      label: Lipopolysaccharide export system ATP-binding protein LptB
            function:
              preferred_term: ATP hydrolysis activity
              term:
                id: GO:0016887
                label: ATP hydrolysis activity
            role_description: >-
              Supplies the conformational energy that extracts LPS from the
              inner membrane and advances it into the bridge.
          - id: lptf_permease
            label: LptF permease subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LptF/LptG permease family
                term:
                  id: PANTHER:PTHR33529
                  label: LIPOPOLYSACCHARIDE EXPORT SYSTEM PERMEASE
                representative_members:
                  - preferred_term: PSEPK PP_0982 LptF exemplar
                    term:
                      id: UniProtKB:Q88P71
                      label: Lipopolysaccharide export system permease protein LptF
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: One half of the LptFG inner-membrane transmembrane cavity.
          - id: lptg_permease
            label: LptG permease subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LptF/LptG permease family
                term:
                  id: PANTHER:PTHR33529
                  label: LIPOPOLYSACCHARIDE EXPORT SYSTEM PERMEASE
                representative_members:
                  - preferred_term: PSEPK PP_0983 LptG exemplar
                    term:
                      id: UniProtKB:Q88P70
                      label: LPS export ABC transporter permease LptG
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: One half of the LptFG inner-membrane transmembrane cavity.
          - id: lptc_bridge_anchor
            label: LptC bridge anchor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LptC family
                term:
                  id: PANTHER:PTHR37481
                  label: LIPOPOLYSACCHARIDE EXPORT SYSTEM PROTEIN LPTC
                representative_members:
                  - preferred_term: PSEPK LptC exemplar
                    term:
                      id: UniProtKB:Q88P97
                      label: Lipopolysaccharide export system protein LptC
            function:
              preferred_term: lipopolysaccharide transmembrane transporter activity
              term:
                id: GO:0015221
                label: lipopolysaccharide transmembrane transporter activity
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Receives extracted LPS and connects LptFG to LptA.
    - order: 2
      role: periplasmic transfer across the Lpt bridge
      node:
        id: periplasmic_lpta_bridge
        label: LptA periplasmic bridge
        module_type: TRANSPORT_STEP
        description: >-
          LptA proteins form a hydrophobic groove that extends the LptC/LptD
          beta-jellyroll bridge across the periplasm.
        annotons:
          - id: lpta_bridge
            label: LptA bridge protein
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LptA family
                term:
                  id: PANTHER:PTHR36504
                  label: LIPOPOLYSACCHARIDE EXPORT SYSTEM PROTEIN LPTA
                representative_members:
                  - preferred_term: PSEPK LptA exemplar
                    term:
                      id: UniProtKB:Q88P98
                      label: Lipopolysaccharide export system protein LptA
            locations:
              - preferred_term: periplasmic space
                term:
                  id: GO:0042597
                  label: periplasmic space
            role_description: Transfers LPS through the periplasmic bridge.
    - order: 3
      role: LPS insertion into the outer membrane
      node:
        id: outer_membrane_lptde
        label: LptD/LptE outer-membrane translocon
        module_type: PROTEIN_COMPLEX
        description: >-
          LptD forms the outer-membrane beta-barrel and lateral exit, while the
          LptE lipoprotein forms the lumenal plug and supports translocon assembly.
        annotons:
          - id: lptd_outer_membrane_translocon
            label: LptD beta-barrel translocon
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LptD family
                term:
                  id: PANTHER:PTHR30189
                  label: LPS-ASSEMBLY PROTEIN LPTD
                representative_members:
                  - preferred_term: PSEPK LptD exemplar
                    term:
                      id: UniProtKB:A0A140FVZ0
                      label: LPS-assembly protein LptD
            locations:
              - preferred_term: outer membrane
                term:
                  id: GO:0019867
                  label: outer membrane
            role_description: Accepts LPS from the bridge and inserts it laterally into the outer membrane.
          - id: lpte_translocon_plug
            label: LptE translocon lipoprotein
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LptE family
                term:
                  id: PANTHER:PTHR38098
                  label: LPS-ASSEMBLY LIPOPROTEIN LPTE
                representative_members:
                  - preferred_term: PSEPK LptE exemplar
                    term:
                      id: UniProtKB:Q88DN0
                      label: LPS-assembly lipoprotein LptE
            locations:
              - preferred_term: outer membrane
                term:
                  id: GO:0019867
                  label: outer membrane
            role_description: >-
              Forms the lumenal plug within LptD and supports assembly and
              operation of the outer-membrane translocon.
  connections:
    - source: inner_membrane_lptb2fgc
      target: periplasmic_lpta_bridge
      connection_type: PROVIDES_INPUT_FOR
    - source: periplasmic_lpta_bridge
      target: outer_membrane_lptde
      connection_type: PROVIDES_INPUT_FOR
