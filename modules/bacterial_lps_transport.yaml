        label: LptB2FGC inner-membrane extraction machine
        module_type: PROTEIN_COMPLEX
        description: >-
          Cytoplasmic LptB ATPases energize the LptF/LptG transmembrane subunits, which take
          up LPS from the inner membrane into their central cavity and push it out into the
          periplasm. LptC couples the inner-membrane machine to the periplasmic transport
          bridge.
