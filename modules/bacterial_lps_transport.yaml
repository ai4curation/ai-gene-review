                            description: PTHR33529 PAINT IBD node at the LptF/LptG duplication carrying
                              GO:0015920 and GO:0043190, seeded by E. coli LptF and LptG.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: PAINT places lipopolysaccharide transport at PTN002128445
                                  in PTHR33529.
            function:
              preferred_term: lipopolysaccharide transfer activity
              term:
                id: GO:0140332
                label: lipopolysaccharide transfer activity
              description: 'Activity of the LptB2FG complex, not of any single subunit: it removes LPS
                from the outer leaflet of the inner membrane and pushes it into the LptC/LptA/LptD groove,
                the donor-membrane part of the transfer completed by the rest of the Lpt machine. The
                subunit gene reviews record it with the contributes_to qualifier; LptB additionally
                enables ATP hydrolysis.'
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Extracts LPS from the inner membrane and advances it into the periplasmic
              bridge, powered by ATP hydrolysis in LptB.
