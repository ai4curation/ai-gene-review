                    label: LptB ATPase (two copies)
                    role: Cytoplasmic nucleotide-binding domains whose ATP hydrolysis drives the transporter.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: LptB family
                        term:
                          id: PANTHER:PTHR45772:SF10
                          label: LIPOPOLYSACCHARIDE EXPORT SYSTEM ATP-BINDING PROTEIN LPTB
                        representative_members:
