id: MODULE:nad_consumption
title: NAD+ consumption — sirtuin deacylation, PARP/ARTD poly- and mono-ADP-ribosylation and CD38/BST1
  NAD+ glycohydrolysis, with PARG and macrodomain reversal; SIRT1-7/PARP1-4/PARP6/PARP8-12/PARP14-16/TIPARP/TNKS/TNKS2/CD38/BST1/PARG/MACROD1/MACROD2/OARD1
description: >-
  Besides serving as a hydride carrier in redox reactions, NAD+ is a substrate that is broken down by
  three classes of signalling enzymes. Each cleaves the bond between nicotinamide and ribose, releases
  free nicotinamide and uses the ADP-ribose moiety. The sirtuins (SIRT1-7) are NAD+-dependent protein
  deacylases. They transfer an acetyl group, or another acyl group such as succinyl, malonyl, glutaryl,
  lipoyl or a long-chain fatty acyl, from a protein lysine to the ADP-ribose of NAD+, producing nicotinamide
  and 2''-O-acyl-ADP-ribose. SIRT1, SIRT6 and SIRT7 act in the nucleus, SIRT2 mainly in the cytoplasm,
  and SIRT3, SIRT4 and SIRT5 in mitochondria. SIRT5 is chiefly a desuccinylase, demalonylase and deglutarylase,
  SIRT4 a lipoamidase, and SIRT4 and SIRT6 also mono-ADP-ribosylate proteins. The PARP (ARTD) family of
  ADP-ribosyltransferases transfers ADP-ribose from NAD+ to protein acceptor residues. PARP1, PARP2 and
  the tankyrases TNKS and TNKS2 build poly(ADP-ribose) chains; DNA-break-activated PARP1, with its cofactor
  HPF1, is the largest NAD+ consumer after genotoxic stress. Most other PARPs (PARP3, PARP4, PARP6, PARP8,
  PARP10-12, PARP14-16 and TIPARP/PARP7) attach a single ADP-ribose. The ectoenzymes CD38 and BST1 (CD157)
  are NAD+ glycohydrolases and ADP-ribosyl cyclases. They convert NAD+ mostly to ADP-ribose and partly
  to the calcium-mobilising messenger cyclic ADP-ribose, which they also hydrolyse. Protein ADP-ribosylation
  is reversed by PAR glycohydrolase (PARG), which cleaves PAR chains, and by the macrodomain hydrolases
  MACROD1, MACROD2 and OARD1 (TARG1), which remove the last ADP-ribose from glutamate and aspartate residues.
  The nicotinamide released by all of these reactions is recycled to NAD+ by the NAMPT salvage pathway.
  Because the consumers share a limited NAD+ pool, strong PARP1 or CD38 activity lowers NAD+ and with
  it sirtuin activity, coupling DNA damage, inflammation and ageing to metabolic signalling.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PW:0002581
  title: nicotinamide adenine nucleotide utilization pathway
  statement: >-
    The module boundary and gene set follow the RGD Pathway Ontology record and diagram for this term.
    The diagram draws the NAD+ biosynthetic pathway (PW:0000219) positively affecting NAD+, and NAD+ positively
    affecting target deacetylation (sirtuins), target ribosylation (MAR/PAR writers, the PARPs) and cyclic
    ADP-ribose (Cd38, Bst1); target ribosylation positively affects target deribosylation (MAR/PAR erasers),
    and MAR/PAR readers are associated with target ribosylation. The RGD human gene set is APLF, BST1,
    CD38, CHFR, MACROD1, MACROD2, OARD1, PARG, PARP1-4, PARP6, PARP8-12, PARP14-16, RNF146, SIRT1-7, TIPARP,
    TNKS, TNKS2 and ZC3HAV1. Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0002581.yaml).
- source_id: PW:0002582
  title: ADP-ribosylation pathway, mono and poly-ribosylation
  statement: >-
    The mono- and poly-ADP-ribosylation subpathway drawn as a node of the PW:0002581 diagram; covered
    by the ADP-ribosyltransferase variant and the eraser part of this module.
- source_id: PW:0002583
  title: ADP-ribosylation pathway, cyclic ribosylation
  statement: >-
    The cyclic ADP-ribosylation subpathway drawn as a node of the PW:0002581 diagram; covered by the CD38/BST1
