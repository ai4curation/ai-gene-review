        - id: nad_glycohydrolase_cyclase
          label: NAD+ glycohydrolase / ADP-ribosyl cyclase (CD38, BST1)
          module_type: MOLECULAR_FUNCTION
          description: >-
            The ectoenzymes CD38 and BST1 (CD157) cleave NAD+ to nicotinamide and either cyclise the ADP-ribose
            to cyclic ADP-ribose (cADPR) or, far more often, hydrolyse it to ADP-ribose; they also hydrolyse
            cADPR to ADP-ribose. CD38 hydrolyses roughly 100 NAD+ for each cADPR made and is a dominant
            NAD+ consumer in many mammalian tissues. cADPR acts as a calcium-mobilising messenger at ryanodine
            receptors.
