                    term:
                      id: CHEBI:73672
                      label: cyclic ADP-beta-D-ribose(2-)
                  - preferred_term: ADP-D-ribose
                    term:
                      id: CHEBI:57967
                      label: ADP-D-ribose(2-)
                  - preferred_term: nicotinamide
                    term:
                      id: CHEBI:17154
                      label: nicotinamide
                  - preferred_term: H+
                    term:
                      id: CHEBI:15378
                      label: hydron
                  evidence:
                  - source_id: RHEA:38611
                    statement: >-
                      NAD(+) = cyclic ADP-beta-D-ribose + nicotinamide + H(+); a Rhea xref of GO:0061809.
                  - source_id: RHEA:38615
                    statement: >-
