  supporting_text: Here we show that the majority of PARPs generate MAR, not PAR, and demonstrate that
    the H-Y-E motif is not the sole indicator of PARP activity.
notes: >-
  Derived from the RGD Pathway Ontology record and diagram PW:0002581 (nicotinamide adenine nucleotide
  utilization pathway) through the RGD_PATHWAY_ONTOLOGY project's diagram->module route; curated GO mapping
  GO:0019677 NAD+ catabolic process (skos:closeMatch). The RGD diagram supplies the boundary (NAD+ in;
  target deacetylation, target ribosylation, cyclic ADP-ribose and target deribosylation out) and the
  33-gene human set. It is modelled as two required parts and one optional part: (1) a variant set of
  the three NAD+-consuming enzyme classes, sirtuins, PARP/ARTD ADP-ribosyltransferases (split into poly-
  and mono-ADP-ribosylation) and the CD38/BST1 NAD+ glycohydrolases/ADP-ribosyl cyclases; (2) the hydrolytic
  reversal of protein ADP-ribosylation by PARG and the macrodomain hydrolases; and (3) an optional module_ref
  to the NAMPT/NMN realization of modules/nad_biosynthesis_salvage.yaml, which recycles the released nicotinamide.
  The three RGD subpathway terms drawn as diagram nodes (PW:0002582, PW:0002583, PW:0002584) are listed
  as evidence because the variants cover them. The fourth diagram link, PW:0000219 NAD+ biosynthetic pathway,
  is not: NAD+ synthesis is modelled in modules/nad_biosynthesis_salvage.yaml and modules/kynurenine_nad_de_novo.yaml
  and is only referenced here. Boundary decisions. (a) PAR readers APLF, CHFR and RNF146 are context,
  not participants. Each binds poly(ADP-ribose) (GO:0072572, IDA; PMID:18172500, PMID:21478859), but none
  consumes NAD+ or transfers or removes ADP-ribose. Their own activities (APLF histone chaperone and nuclease,
  CHFR and RNF146 ubiquitin ligase) act downstream in DNA repair, mitotic checkpoint control and tankyrase-directed
  proteolysis of AXIN. RGD itself draws the readers only as associated with target ribosylation. (b) ZC3HAV1
  (PARP13, ZAP) is excluded. Its reviewed UniProt entry Q7Z2W4 states that its divergent PARP-homology
  domain lacks the structural requirements for NAD+ binding and is inactive. QuickGO (checked 2026-10-28)
  records NOT NAD+-protein mono-ADP-ribosyltransferase activity (IDA, PMID:25043379), NOT NAD+ poly-ADP-ribosyltransferase
  activity and NOT NAD+ binding (IMP, PMID:25635049). Its antiviral RNA-binding role is unrelated to NAD+
  consumption. (c) PARP9 is in neither the RGD gene list nor the participant set, and its catalytic status
  is disputed. QuickGO carries both NOT GO:0003950 and NOT NAD+ binding (IMP, PMID:16061477) and positive
  GO:0140802 C-terminal glycine ADP-ribosyltransferase (IDA, PMID:28525742, ubiquitin ADP-ribosylation
  by the DTX3L-PARP9 heterodimer) and GO:0003950 (IDA, PMID:23230272). PMID:27796300 found that PARP9
  does not ADP-ribosylate STAT1 and instead suppresses PARP14. This is recorded as a knowledge gap. (d)
  GO usage of GO:0019677. In human GOA the term is carried only by NAD+-degrading enzymes: SARM1 (IDA,
  many papers), NUDT12 (IDA), NUDT17 (IBA), plus IEA rows on NNMT and PARP14 (GO_REF:0000107). No sirtuin
  or PARP carries it, because GO describes their process as protein deacylation or ADP-ribosylation, with
  NAD+ as cosubstrate. GO:0019677 is therefore kept as the module-level concept (the closeMatch) and is
  not put on the sirtuin or PARP annotons. It is put on the CD38 and BST1 annotons, because their NAD+
  glycohydrolase chemistry (NAD+ to ADP-ribose or cADPR plus nicotinamide) is the same as that of SARM1,
  whose GO:0019677 annotation rests on IDA. Neither CD38 nor BST1 carries GO:0019677 in GOA; this is a
  possible curation gap, not asserted here as a GOA annotation. The PARP14 IEA row looks like an over-propagated
  orthology transfer and is a candidate for upstream review. (e) Molecular functions come from each protein's
  experimental GO annotations in QuickGO (checked 2026-10-28), cross-checked against the Rhea xrefs of
  the GO terms and the cached abstracts: SIRT1, SIRT2, SIRT3, SIRT6 and SIRT7 GO:0034979 (EXP/IDA; RHEA:43636);
  SIRT5 GO:0036055 (IDA; RHEA:47668; demalonylase GO:0036054 and deglutarylase GO:0061697 in prose); SIRT4
  GO:0106419 (EXP/IDA; RHEA:63640) and GO:0140803 (EXP; RHEA:56612); SIRT6 GO:0140804 (EXP; RHEA:58220);
  PARP1 GO:0140805 (EXP/IDA; RHEA:58232) and GO:0003950 (EXP/IDA); PARP2, TNKS and TNKS2 GO:0003950 (IDA/EXP);
  PARP3, PARP4, PARP8, PARP11, PARP12, PARP15 and TIPARP GO:1990404 (IDA); PARP6 GO:0140803 (IDA); PARP10,
  PARP14 and PARP16 GO:0140807 (EXP/IDA; RHEA:58224); CD38 and BST1 GO:0061809 (EXP/IDA; RHEA:38611, RHEA:38615,
  plus NAD+ hydrolysis RHEA:16301); PARG GO:0004649 (EXP/IDA; RHEA:52216); MACROD1, MACROD2 and OARD1
  GO:0140293 (IDA; RHEA:58248). PAR chain elongation (EC 2.4.2.30) has no Rhea reaction, so the PAR annotons
  carry the EC equation in prose. Most PARP mono-ARTs (PARP3, PARP4, PARP6, PARP8, PARP10, PARP11, PARP12,
  PARP14, PARP15, PARP16, TIPARP) also carry GO:0003950 poly-ADP-ribosyltransferase activity in GOA, by
  IBA and in some cases IDA/IMP. That conflicts with the family-wide product assignment (PMID:25043379),
  which found that most PARPs make MAR, and with the substrate-assisted mechanism that prevents PARP10-type
  enzymes from polymerising (PMID:18851833). These rows are candidates for IBA and upstream review, and
  GO:0003950 is not used for them here. Also not adopted: SIRT7 protein methyltransferase activity (GO:0008276,
  IDA; also an activity in GO-CAM gomodel:63c0ac2b00001853). It is unexpected for a sirtuin and is flagged
  for review. (f) Outside the RGD gene list and the module: the serine-ADP-ribose hydrolase ADPRS (ARH3),
  which removes the HPF1-dependent serine mono-ADP-ribose that PARG leaves; the NUDIX ADP-ribose pyrophosphatases
  (NUDT5, NUDT9) that clear free ADP-ribose; the NAD+ hydrolase SARM1; the ecto-ARTs ART1-5; and NNMT,
  which methylates the nicotinamide product. The ADPRS omission means the reversal part as drawn by RGD
  is incomplete for serine-linked marks. The PARP1 cofactor HPF1 is described in the PARP1 annoton but
  is not a participant. Downstream signalling by cADPR (ryanodine receptors) and NAADP (two-pore channels)
  is out of scope. (g) GO-CAM: gocams/index.tsv (checked 2026-10-28) has production models for 12 of the
  33 genes. The project's best-overlap model gomodel:627d95ee00002067 is linked at module level and on
  the PARP1 and PARP2 annotons, and further models are linked on the SIRT1, SIRT2, SIRT3, SIRT6, SIRT7,
  PARP1, PARP2, PARP12 and PARP16 annotons. Possible GO-CAM issue: in gomodel:696022cd00000603 (Regulation
  of the TCA cycle by SIRT3) the SIRT3 deacetylase activity is part of GO:0008053 mitochondrial fusion,
  which does not match the model title. Gene reviews exist for PARP1, SIRT1, SIRT2, SIRT5 and TNKS; the
  other members have none. Publications cited are abstract-only in the cache except PMID:22076378, PMID:25525879,
  PMID:27568560, PMID:28190768, PMID:23481255, PMID:23275542, PMID:27796300, PMID:30104678 and PMID:34314702.
knowledge_gaps:
- gap_statement: >-
    Whether PARP9 has ADP-ribosyltransferase activity of its own, and whether the ubiquitin Gly76 ADP-ribosylation
    attributed to the DTX3L-PARP9 heterodimer is catalysed by PARP9 or by DTX3L, is unresolved.
  boundary: >-
    PARP9 lacks the canonical NAD+-binding features and is excluded from the participant set. One study
    reports NAD+-dependent ubiquitin ADP-ribosylation by the heterodimer, while another found that PARP9
    does not ADP-ribosylate STAT1 and that it suppresses PARP14 activity.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Decides whether PARP9 is an NAD+ consumer and belongs among the mono-ADP-ribosyltransferases of this
    module or is a non-catalytic PAR reader.
  resolution: >-
    Assay recombinant DTX3L-PARP9 heterodimers carrying catalytic-site substitutions in each partner separately
    for NAD+ consumption and ubiquitin ADP-ribosylation, and measure ADP-ribosylated ubiquitin in PARP9-null
    cells reconstituted with wild-type or catalytic-site mutant PARP9.
  provenance:
  - reference_id: PMID:28525742
    supporting_text: We show that the Dtx3L/Parp9 heterodimer mediates NAD+-dependent mono-ADP-ribosylation
      of ubiquitin
  - reference_id: PMID:27796300
    supporting_text: PARP9 did not promote ADP-ribosylation of either STAT1α or STAT6, which supports
      a previous report showing that PARP9 lacks catalytic activity
- gap_statement: >-
    The share of cellular NAD+ turnover carried by each consumer class (sirtuins, PARPs, CD38/BST1) in
    human tissues at rest, and how it shifts with DNA damage, inflammation and age, is not quantified.
  boundary: >-
    Maximal PARP1 activation can deplete NAD+ by most of its pool, and CD38 hydrolyses about 100 NAD+
    per cADPR made, but direct flux measurements that apportion NAD+ consumption between the classes in
    the same tissue are lacking.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Determines which consumer drives the NAD+ decline linked to ageing and DNA damage, and so which branch
    of this module limits sirtuin activity.
  resolution: >-
    Isotope-tracer NAD+ flux measurement in human cells and tissues with selective PARP1/2, CD38 and sirtuin
    inhibition or knockout, under basal, genotoxic and inflammatory conditions.
  provenance:
  - reference_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0002581.yaml
    supporting_text: Competition between NAD-consuming enzymes for the limited shared substrate is envisioned.
module:
  id: nad_consumption
  label: NAD+ consumption by sirtuins, ADP-ribosyltransferases and NAD+ glycohydrolases
  module_type: METABOLIC_PATHWAY
  description: >-
    Sirtuins, PARP-family ADP-ribosyltransferases and the CD38/BST1 NAD+ glycohydrolases each cleave NAD+
    and release nicotinamide; the protein ADP-ribosylation made by PARPs is reversed by PARG and the macrodomain
    hydrolases, and the nicotinamide is salvaged to NAD+ by NAMPT.
  concepts:
  - preferred_term: NAD+ catabolic process
    term:
      id: GO:0019677
      label: NAD+ catabolic process
    description: >-
      closeMatch mapping of PW:0002581; the module covers NAD+ breakdown by enzymes that use it as a substrate.
  context:
    taxa:
    - preferred_term: Homo sapiens
      term:
        id: NCBITaxon:9606
        label: Homo sapiens
      description: >-
        Members are grounded on the human proteins; the RGD diagram is drawn for rat and the gene set
        is conserved in mammals.
  parts:
  - order: 1
    role: NAD+ cleavage with nicotinamide release by a consumer enzyme
    node:
      id: nad_consuming_reactions
      label: NAD+-consuming enzyme classes
      module_type: METABOLIC_PATHWAY
      description: >-
        Three enzyme classes use NAD+ as a substrate rather than as a redox cofactor. Each cleaves the
        nicotinamide-ribosyl bond, releases nicotinamide and destroys the NAD+ molecule.
      concepts:
      - preferred_term: NAD+ catabolic process
        term:
          id: GO:0019677
          label: NAD+ catabolic process
        description: >-
          The breakdown of NAD+ that these consumers effect jointly; see notes for how GO applies the
          term.
      variant_sets:
      - id: nad_consumer_class
        label: NAD+-consuming enzyme class
        axis: enzyme class (sirtuin deacylase, ADP-ribosyltransferase, NAD+ glycohydrolase/cyclase)
        selection: ONE_OR_MORE
        variants:
        - id: sirtuin_nad_consumption
          label: Sirtuin NAD+-dependent deacylation and ADP-ribosylation
          module_type: MOLECULAR_FUNCTION
          description: >-
            Class III protein deacylases (sirtuins 1-7) share a conserved NAD+-binding catalytic core.
            They cleave the nicotinamide-ribosyl bond of NAD+ and transfer the protein acyl group to the
            ADP-ribose, so every deacylation consumes one NAD+ and yields nicotinamide and 2''-O-acyl-ADP-ribose.
            Nicotinamide is a non-competitive feedback inhibitor, which makes sirtuin activity sensitive
            to the NAD+/nicotinamide ratio.
          variant_sets:
          - id: sirtuin_reaction
            label: Sirtuin reaction
            axis: acyl group removed or ADP-ribose transferred
            selection: ONE_OR_MORE
            variants:
            - id: sirtuin_deacetylation
              label: NAD+-dependent lysine deacetylation (SIRT1, SIRT2, SIRT3, SIRT6, SIRT7)
              module_type: REACTION
              description: >-
                Removal of an acetyl group from a protein lysine with NAD+ as cosubstrate. The ADP-ribose
                of NAD+ accepts the acetyl group, so each deacetylation consumes one NAD+ and releases
                nicotinamide and 2''-O-acetyl-ADP-ribose.
              annotons:
              - id: sirt1_deacetylase
