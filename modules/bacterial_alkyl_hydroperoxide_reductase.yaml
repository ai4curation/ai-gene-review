    - preferred_term: Bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
    conditions:
    - preferred_term: A sampled native AhpC system has a functional reducing chain and an accepted peroxide
        substrate
  description: At least one complete organism-coherent implementation supplies peroxide reduction and
    regeneration of AhpC. These alternatives define named biochemical capabilities, not a complete cellular
    stress-defense network, minimal growth sufficiency, or universal bacterial distribution. Molecular
    oxygen is not a stoichiometric substrate; anaerobic coupled assays are valid.
