id: MODULE:bacterial_alkyl_hydroperoxide_reductase
title: E. coli AhpC/AhpF alkyl hydroperoxide reductase
description: >-
  The concrete E. coli alkyl hydroperoxide reductase system. The peroxiredoxin
  AhpC reduces hydrogen peroxide and organic hydroperoxides with its
  peroxidatic cysteine, forming an intersubunit disulfide, and the soluble
  flavoprotein AhpF accepts reducing equivalents from NADH and relays them
  through its C-terminal and N-terminal redox-active disulfide centers to
  oxidized AhpC. Together the two subunits carry out NADH-dependent
  hydroperoxide reduction, the main route for scavenging endogenous hydrogen
  peroxide in aerobically growing cells.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:10666639
    title: >-
      Crystallization and preliminary X-ray analysis of the catalytic core of
      the alkylhydroperoxide reductase component AhpF from Escherichia coli.
    statement: >-
      Establishes AhpF as a pyridine nucleotide-disulfide oxidoreductase that
      channels electrons from NAD(P)H through disulfides to the hydroperoxide
      reductase AhpC component.
  - source_id: PMID:25372677
    title: >-
      Structure, mechanism and ensemble formation of the alkylhydroperoxide
      reductase subunits AhpC and AhpF from Escherichia coli.
    statement: >-
      Solved E. coli AhpF and AhpC structures and demonstrated AhpF binding to
      the AhpC ring, supporting the physical AhpC/AhpF hydroperoxide-scavenging
      complex.
  - source_id: PMID:28270505
    title: >-
      Essential role of the flexible linker on the conformational equilibrium
      of bacterial peroxiredoxin reductase for effective regeneration of
      peroxiredoxin.
    statement: >-
      Shows that E. coli AhpF uses NADH-linked, linker-dependent interdomain
      motions to shuttle electrons to AhpC for efficient peroxidase turnover.
  - source_id: PMID:11717276
    title: >-
      Alkyl hydroperoxide reductase is the primary scavenger of endogenous
      hydrogen peroxide in Escherichia coli.
    statement: >-
      Genetic analysis showing that the AhpCF system, rather than catalase, is
      the primary scavenger of endogenously generated hydrogen peroxide, with
      turnover limited by NADH supply.
  - source_id: file:genes/ECOLI/ahpC/ahpC-ai-review.yaml
    title: ECOLI ahpC gene review
    statement: >-
      The E. coli ahpC review scopes AhpC's own molecular function to
      peroxiredoxin activity, records that it contributes to the whole-system
      NADH-dependent peroxiredoxin activity, and accepts its cytosolic
      localization, AhpC/AhpF complex membership and peroxide-detoxification
      process annotations.
  - source_id: file:genes/ECOLI/AhpF/AhpF-ai-review.yaml
    title: ECOLI AhpF gene review
    statement: >-
      The E. coli AhpF review evaluates current GOA annotations for
      protein-disulfide reductase activity, AhpC/AhpF complex membership,
      oxidant detoxification, FAD binding, and cytosolic localization.
