    - BIOLOGY
    status: OPEN
    boundary: The Bacillus pairing is a qualified mechanistic inference; family labels alone do not prove
      donor specificity or eliminate compensating enzymes.
    provenance:
    - reference_id: PMID:8932314
      supporting_text: the ahpC mutant was resistant to hydrogen peroxide because of the derepression
        of the peroxide regulon
  notes: Scope excludes Tpx/BCP/AhpE and other peroxiredoxin families, catalases, superoxide dismutases,
    glutathione pathways, general thioredoxin clients and upstream PDH carbon metabolism. The Eukaryota-scoped
    glutathione_thioredoxin_redox_systems module is unchanged. Exact gene-product selectors prevent broad
    PANTHER groups or mixed-species donors from satisfying a route. Verified PANTHER labels containing
    mitochondrial or unrelated representative names are classification labels, not functional/localization
    transfers. Original E. coli leaf ids are retained for corpus references.
references:
- id: PMID:28270505
  title: Essential role of the flexible linker on the conformational equilibrium of bacterial peroxiredoxin
    reductase for effective regeneration of peroxiredoxin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary paper inspected. Target E. coli domain/mutant and coupled activity assays
      support the reductant-to-peroxiredoxin step; no fixed cellular oligomer stoichiometry follows.
  findings:
  - statement: Purified E. coli AhpF linker variants impair electron transfer and AhpC-supported peroxide
      turnover.
    supporting_text: The mutants also exhibited a decrease in H2O2 reduction by the AhpF-AhpC ensemble.
- id: PMID:11717276
  title: Alkyl hydroperoxide reductase is the primary scavenger of endogenous hydrogen peroxide in Escherichia
    coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full native primary study inspected. Substrate concentration and expression state bound
      the division of labor; this is not a universal essentiality claim.
  findings:
  - statement: Native E. coli experiments identify AhpCF as a major low-H2O2 scavenger under tested conditions,
      with catalase important at higher challenge.
    supporting_text: Ahp is kinetically a more efficient scavenger of trace H(2)O(2) than is catalase
- id: PMID:8555198
  title: Flavin-dependent alkyl hydroperoxide reductase from Salmonella typhimurium. 1. Purification and
    enzymatic activities of overexpressed AhpF and AhpC proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract and the mechanistic review inspected. Native versus recombinant equivalence
      is explicit. NADH preference is assay-specific; NADPH turnover is also measured.
  findings:
  - statement: Salmonella AhpF/AhpC reduce peroxide in a coupled purified system; native and recombinant
      preparations behaved alike.
    supporting_text: All assays gave identical results whether overexpressed S. typhimurium proteins from
      E. coli or proteins isolated directly from S. typhimurium were used.
- id: PMID:8555199
  title: Flavin-dependent alkyl hydroperoxide reductase from Salmonella typhimurium. 2. Cystine disulfides
    involved in catalysis of peroxide reduction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary mechanistic abstract inspected. Used only for the experimentally characterized
      disulfide relay, not a bacterial-wide oligomeric model.
  findings:
  - statement: Salmonella AhpC and AhpF use redox-active disulfide centers in peroxide turnover.
    supporting_text: The AhpC cystine disulfide center, shown to exist as an intersubunit disulfide bond,
      is stoichiometrically reducible by NADH in the presence of a catalytic amount of AhpF and can be
      reoxidized by ethyl hydroperoxide.
- id: PMID:8932314
  title: 'General and oxidative stress responses in Bacillus subtilis: cloning, expression, and mutation
    of the alkyl hydroperoxide reductase operon.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract inspected. Direct evidence is native operon/induction/mutant physiology;
      purified Bacillus-pair electron transfer is inferred from independently verified AhpF architecture
      and characterized homologues, not measured here.
  findings:
  - statement: Native Bacillus operon and mutant physiology support an AhpC/AhpF peroxide-defense implementation,
      with compensation and growth-stage limits.
    supporting_text: the ahpC mutant was resistant to hydrogen peroxide because of the derepression of
      the peroxide regulon
- id: PMID:11222594
  title: 'Essential thioredoxin-dependent peroxiredoxin system from Helicobacter pylori: genetic and kinetic
    characterization.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract and complete author PDF inspected. Native cloned 26695 system and donor
      specificity are distinguished from detailed peroxide kinetics using E. coli TrxR.
  findings:
  - statement: H. pylori AhpC is regenerated by its thioredoxin system rather than the Salmonella AhpF
      used in a comparator assay.
    supporting_text: Instead, homologues of Escherichia coli thioredoxin (Trx) reductase (TrxR, HP0825)
      and Trx (Trx1, HP0824) formed a reductase system for H. pylori AhpC.
- id: url:https://scb.wfu.edu/Poole-files/Baker_Hpylori.pdf
  title: 'Essential thioredoxin-dependent peroxiredoxin system from Helicobacter pylori: genetic and kinetic
    characterization.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Complete primary paper, Methods, Table 2 and Figs. 2–6 inspected. Table 2 identifies
      P21762 and methods clone 26695. Trx1, not tested Trx2, reduces AhpC. The claim is bounded to these
      native preparations/assays. Canonical article identity: PMID:11222594. This URL is an alternate
      full-text manifestation of the same paper, not an additional paper, a deleted record, or an incorrect
      identifier. Exact-title and DOI/PMCID verification is recorded in modules/bacterial_alkyl_hydroperoxide_reductase-source-analysis/reference-identities.yaml.txt.
      Retained URL citations identify full-text quotations absent from the abstract-only PMID cache.'
  findings:
  - statement: Native H. pylori TrxR does not use NADH in the tested donor-substitution experiment.
    supporting_text: In TrxR-Trx1-insulin experiments in which NADPH was replaced with NADH, no decrease
      in the NADH A 340 was observed
- id: PMID:11799204
  title: Metabolic enzymes of mycobacteria linked to antioxidant defense by a thioredoxin-like protein.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract inspected; Science full text could not be recovered. SucB was subsequently
      renamed DlaT. Later primary metabolic and native physiology studies independently support the relay
      and qualify the old sole-lipoyl-protein wording.
  findings:
  - statement: The Mtb proteins define a lipoyl-mediated electron relay linking Lpd to AhpC through DlaT
      and AhpD.
    supporting_text: The peroxiredoxin alkyl hydroperoxide reductase (AhpC) is linked to Lpd and SucB
      by an adaptor protein, AhpD.
- id: PMID:15178486
  title: Intermolecular interactions in the AhpC/AhpD antioxidant defense system of Mycobacterium tuberculosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract directly describes mutant-resolved chemistry. Upstream donors in this
      assay are free lipoamide and bovine DHLDH, not an all-native Lpd/DlaT preparation.
  findings:
  - statement: Target AhpD directly reduces AhpC through a catalytic mixed disulfide.
    supporting_text: A key step in the reduction of oxidized AhpC by reduced AhpD is formation of a disulfide
      cross-link between Cys61 of AhpC and Cys133 of AhpD.
- id: PMID:14871480
  title: Multiple thioredoxin-mediated routes to detoxify hydroperoxides in Mycobacterium tuberculosis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract inspected, full publisher access unavailable. Donor pairing is explicit;
      Tpx accepts different thioredoxins and is excluded from this module. The assay does not establish
      route predominance in infected cells.
  findings:
  - statement: Mtb TrxC plus thioredoxin reductase supplies a distinct NADPH-linked AhpC regeneration
      route.
    supporting_text: NADPH-driven hydroperoxide reduction by AhpC that is mediated by thioredoxin reductase
      and thioredoxin C
- id: PMID:16045627
  title: Mycobacterium tuberculosis appears to lack alpha-ketoglutarate dehydrogenase and encodes pyruvate
    dehydrogenase in widely separated genes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract and complete publisher-PDF Results inspected. Normal full-PDF caching failed;
      quotes use the actual cached abstract. Results separately assay Lpd NADH/lipoamide activity and
      Lpd–DlaT–AhpD coupled disulfide reduction. PDH metabolism is outside the module, but resolves protein
      identities.
  findings:
  - statement: DlaT is experimentally the PDH E2 partner of Lpd, distinct from an oxoglutarate-dehydrogenase
      SucB assignment.
    supporting_text: Finally, recombinant AceE, DlaT and Lpd, although encoded by genes that are widely
      separated on the chromosome, reconstituted PDH in vitro with Km values typical of bacterial PDH
      complexes.
- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3040420/
  title: Virulence of Mycobacterium tuberculosis depends on lipoamide dehydrogenase, a member of three
    multienzyme complexes.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Complete primary paper inspected. Native H37Rv genetics distinguish carbon metabolism,
      acidified-nitrite sensitivity and H2O2 resistance. Alternative BCKADH lipoylation in DlaT-deficient
      cells limits universal sole-carrier claims. Canonical article identity: PMID:21238944. This URL
      is an alternate full-text manifestation of the same paper, not an additional paper, a deleted record,
      or an incorrect identifier. Exact-title and DOI/PMCID verification is recorded in modules/bacterial_alkyl_hydroperoxide_reductase-source-analysis/reference-identities.yaml.txt.
      Retained URL citations identify full-text quotations absent from the abstract-only PMID cache.'
  findings:
  - statement: 'Native Lpd perturbation does not establish an obligatory peroxide-survival pathway: the
      tested mutant is more H2O2-resistant.'
    supporting_text: Mtb lacking lpdC was more resistant than WT and complemented strains
- id: url:https://www.nature.com/articles/s41598-017-05354-5
  title: AhpC of the mycobacterial antioxidant defense system and its interaction with its reducing partner
    Thioredoxin-C.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Complete primary article inspected. All constructs are from M. bovis BCG; the paper
      explicitly states that its AhpC sequence is identical to Mtb AhpC. Redox-dependent dimers/dodecamers
      are condition-specific. No new BCG module exemplar is introduced. Canonical article identity: PMID:28698569.
      This URL is an alternate full-text manifestation of the same paper, not an additional paper, a deleted
      record, or an incorrect identifier. Exact-title and DOI/PMCID verification is recorded in modules/bacterial_alkyl_hydroperoxide_reductase-source-analysis/reference-identities.yaml.txt.
      Retained URL citations identify full-text quotations absent from the abstract-only PMID cache.'
  findings:
  - statement: BCG recombinant TrxB2/TrxC supports AhpC peroxide turnover and NMR detects the TrxC–AhpC
      interface; this corroborates but is not a native H37Rv experiment.
    supporting_text: This demonstrates the binding of MbTrxC with MbAhpC.
- id: url:https://scb.wfu.edu/Poole-files/ABB-Poole-05.pdf
  title: 'Bacterial defenses against oxidants: mechanistic features of cysteine-based peroxidases and
    their flavoprotein reductases.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Complete 2005 mechanistic review inspected. Native systems and reconstitution contexts
      are distinguished. Oligomeric state depends on redox state and concentration; broad family labels
      do not establish donor exchangeability. Canonical article identity: PMID:15581580. This URL is an
      alternate full-text manifestation of the same paper, not an additional paper, a deleted record,
      or an incorrect identifier. Exact-title and DOI/PMCID verification is recorded in modules/bacterial_alkyl_hydroperoxide_reductase-source-analysis/reference-identities.yaml.txt.
      Retained URL citations identify full-text quotations absent from the abstract-only PMID cache.'
  findings:
  - statement: AhpF is not the universal AhpC regeneration architecture; multiple-protein thioredoxin
      and related systems occur in AhpF-deficient organisms.
    supporting_text: In many AhpF-deﬁcient organisms, the NAD(P)H-dependent recycling of AhpC or other
      Prxs is mediated by at least two proteins
- id: PMID:18084895
  title: Peroxiredoxin systems in mycobacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Review abstract inspected. The statement is corroborated by primary relay and TrxC studies.
      Other peroxiredoxins discussed in this review remain outside the AhpC boundary.
  findings:
  - statement: The mycobacterial review explicitly distinguishes AhpD and TrxC as alternate AhpC reductants.
    supporting_text: AhpC can be reduced by AhpD, a CXXC-motif-containing protein, or by one of the mycobacterial
      thioredoxins, TrxC.
- id: PMID:34258640
  title: Relevance of peroxiredoxins in pathogenic microorganisms.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 2021 review abstract inspected. Family-level diversity is not proof that every class
      has the same donor, cellular localization or extra-peroxidase functions.
  findings:
  - statement: AhpC/Prx1 is one of six mechanistically diverse peroxiredoxin classes, supporting exclusion
      of Tpx, BCP and AhpE from this module.
    supporting_text: Prx are very diverse and are classified into six different classes (Prx1-AhpC, BCP-PrxQ,
      Tpx, Prx5, Prx6, and AhpE)
- id: PMID:38899743
  title: 'From ubiquity to specificity: The diverse functions of bacterial thioredoxin systems.'
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: 2024 review abstract inspected. This broad synthesis motivates partner-specific scope,
      not transfer of its motility, biofilm or chaperone functions into the present peroxide module.
  findings:
  - statement: Thioredoxin systems specialize their cofactors and clients during bacterial evolution;
      a shared reductase family is not evidence for arbitrary partner substitution.
    supporting_text: This evolution can be characterized by the multiplication of the systems and by the
      specialization of cofactors or targets
- id: PMID:27249779
  title: Mycobacterium tuberculosis Thioredoxin Reductase Is Essential for Thiol Redox Homeostasis but
    Plays a Minor Role in Antioxidant Defense.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete primary text inspected after normal recovery. Native H37Rv tunable depletion
      separates essential thiol reduction from peroxide/RNS defense; Fig. 4 tests partial rather than
      complete depletion. No plumbagin phenotype is not a general proof of absent participation.
  findings:
  - statement: Partial TrxB2 depletion preserves the tested response to a superoxide generator.
    supporting_text: partial inhibition of TrxB2 did not affect Mtb’s susceptibility to growth inhibition
      or killing by plumbagin, a superoxide generator
  - statement: The strongest measured stress phenotype is thiol-specific.
    supporting_text: TrxB2-silenced Mtb was 8–16 fold more susceptible to growth inhibition by diamide,
      a thiol-specific oxidant
