id: MODULE:endosomal_trafficking_routing
title: Intracellular endosomal trafficking and cargo routing — clathrin/AP-2 uptake, V-ATPase acidification, EHD1 recycling vs. ESCRT/RAB7A late-endosomal maturation, CTSD lysosomal proteolysis, and cytosolic escape
description: >-
  Receptor-bound macromolecular cargo and therapeutic nanoparticles (including diferric transferrin
  bound to TfR1/TFRC and apolipoprotein-coated lipid nanoparticles) enter cells via clathrin- and
  AP-2-mediated endocytosis into nascent endocytic vesicles that mature into early sorting endosomes.
  V-ATPase (catalytic subunit ATP6V1A) acidifies the early endosomal lumen (pH ~6.0-5.5), triggering
  ligand uncoupling (such as iron release from transferrin) and protonation of ionizable lipids.
  From the acidified sorting endosome, cargo partitions across three competing fates: (1) tubular
  endocytic recycling back to the plasma membrane driven by the membrane-remodeling ATPase EHD1;
  (2) multivesicular body (MVB) sorting by ESCRT-I (TSG101) and early-to-late endosomal maturation
  governed by the small GTPase RAB7A, which delivers cargo to lysosomes for luminal proteolysis by
  aspartic cathepsins (CTSD); and (3) endosomal membrane destabilization and productive escape into
  the cytosol. Because active RAB7A-driven late endosomal maturation sequesters cargo into the
  degradative lysosomal pathway, loss of RAB7A diverts endosomal flux away from lysosomal
  degradation and markedly increases cytosolic escape of lipid nanoparticle cargo (Jozić et al. 2026,
  PMID:41814093).
status: DRAFT
evidence:
  - source_id: GO:0006898
    title: receptor-mediated endocytosis
    statement: Clathrin/AP-2-dependent uptake of receptor-bound cargo at the plasma membrane.
  - source_id: GO:0048388
    title: endosomal lumen acidification
    statement: V-ATPase-driven proton translocation acidifies early and late endosomal compartments.
  - source_id: GO:0032456
    title: endocytic recycling
    statement: EHD1-dependent tubular recycling returns receptors and recycling cargo to the plasma membrane.
  - source_id: GO:0008333
    title: endosome to lysosome transport
    statement: ESCRT-I (TSG101) and RAB7A route sorting-endosome cargo through MVBs/late endosomes to lysosomes.
  - source_id: PMID:41814093
    title: In vivo endosomal escape assay identifies mechanisms for efficient hepatic LNP delivery.
    statement: >-
      LysoTag in vivo lysosomal barcoding shows ~8% baseline cytosolic LNP escape within 30 min and
      demonstrates that loss of Rab7-mediated late endosomal maturation increases cytosolic LNP escape.
    supporting_text: Loss of Rab7, a mediator of late endosomal maturation, increased LNP escape.
  - source_id: file:human/TFRC/TFRC-ai-review.yaml
    title: TFRC gene review (human)
    statement: >-
      Cell-surface receptor binding and internalization step (UniProtKB:P02786, GO:0004998,
      GO:0006898) matches the completed human TFRC review.
  - source_id: file:human/AP2M1/AP2M1-ai-review.yaml
    title: AP2M1 gene review (human)
    statement: >-
      Cargo-motif recognition at clathrin-coated pits (UniProtKB:Q96CW1, GO:0005048, GO:0072583)
      matches the completed human AP2M1 review.
  - source_id: file:human/CLTC/CLTC-ai-review.yaml
    title: CLTC gene review (human)
    statement: >-
      Clathrin lattice assembly and coated-vesicle internalization (UniProtKB:Q00610, GO:0005198,
      GO:0006898) matches the completed human CLTC review.
  - source_id: file:human/ATP6V1A/ATP6V1A-ai-review.yaml
    title: ATP6V1A gene review (human)
    statement: >-
      Endosomal and lysosomal lumen acidification (UniProtKB:P38606, GO:0046961, GO:0048388)
      matches the completed human ATP6V1A review.
  - source_id: file:human/EHD1/EHD1-ai-review.yaml
    title: EHD1 gene review (human)
    statement: >-
      Tubular recycling endosome fission and return to the plasma membrane (UniProtKB:Q9H4M9,
      GO:0016887, GO:0032456) matches the human EHD1 review.
  - source_id: file:human/TSG101/TSG101-ai-review.yaml
    title: TSG101 gene review (human)
    statement: >-
      ESCRT-I ubiquitinated cargo recognition and MVB sorting (UniProtKB:Q99816, GO:0043130,
      GO:0036258) matches the completed human TSG101 review.
  - source_id: file:human/RAB7A/RAB7A-ai-review.yaml
    title: RAB7A gene review (human)
    statement: >-
      Early-to-late endosome maturation and lysosome transport (UniProtKB:P51149, GO:0003924,
      GO:0045022, GO:0008333) matches the completed human RAB7A review.
  - source_id: file:mouse/Rab7/Rab7-ai-review.yaml
    title: Rab7 gene review (mouse)
    statement: >-
      Conserved mouse Rab7 late endosome maturation and LNP escape regulation (UniProtKB:P51150,
      PMID:41814093) matches the completed mouse Rab7 review.
  - source_id: file:human/CTSD/CTSD-ai-review.yaml
    title: CTSD gene review (human)
    statement: >-
      Lysosomal lumen aspartic endopeptidase proteolysis (UniProtKB:P07339, GO:0004190,
      GO:0006508) matches the human CTSD review.
module:
  id: endosomal_trafficking_routing
  label: Intracellular endosomal trafficking, sorting, and cytosolic escape
  module_type: TRANSPORT_STEP
  concepts:
    - preferred_term: receptor-mediated endocytosis
      term:
        id: GO:0006898
        label: receptor-mediated endocytosis
      description: Clathrin- and adaptor-dependent uptake of cell-surface receptor-cargo complexes.
    - preferred_term: endosomal lumen acidification
      term:
        id: GO:0048388
        label: endosomal lumen acidification
      description: V-ATPase-driven proton import that lowers early/late endosomal pH.
    - preferred_term: endocytic recycling
      term:
        id: GO:0032456
        label: endocytic recycling
      description: Return of internalized receptors and cargo from recycling endosomes to the plasma membrane.
    - preferred_term: endosome to lysosome transport
      term:
        id: GO:0008333
        label: endosome to lysosome transport
      description: Maturation and transport of cargo from early sorting endosomes through MVBs/late endosomes to lysosomes.
  parts:
    - order: 1
      role: cell-surface cargo receptor binding (TfR1 / transferrin and targeted payload capture)
      node:
        id: tfrc_cargo_binding
        label: Cell-surface cargo receptor binding (TfR1 / transferrin & targeted payload capture)
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: tfrc_receptor_binding
            label: "TFRC (TfR1/CD71): cell-surface cargo receptor"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Transferrin receptor protein 1
                term:
                  id: PANTHER:PTHR10404:SF26
                  label: TRANSFERRIN RECEPTOR PROTEIN 1
                representative_members:
                  - preferred_term: TFRC (human)
                    term:
                      id: UniProtKB:P02786
                      label: Transferrin receptor protein 1
            function:
              preferred_term: transferrin receptor activity
              term:
                id: GO:0004998
                label: transferrin receptor activity
              substrates:
                - preferred_term: diferric transferrin / receptor-targeted macromolecular cargo
              evidence:
                - source_id: file:human/TFRC/TFRC-ai-review.yaml
                  statement: Binds diferric transferrin at the plasma membrane and internalizes via clathrin/AP-2-mediated endocytosis.
                - source_id: PMID:10192390
                  title: Transferrin receptor is necessary for development of erythrocytes and the nervous system.
                  statement: Diferric transferrin binds cell-surface TfR1 to initiate receptor-mediated endocytosis into endosomes.
                  supporting_text: >-
                    Diferric Trf interacts with cell-surface Trf 
                    receptor (Trfr) to undergo receptor-mediated endocytosis into specialized 
                    endosomes.
            processes:
              - preferred_term: receptor-mediated endocytosis
                term:
                  id: GO:0006898
                  label: receptor-mediated endocytosis
              - preferred_term: transferrin transport
                term:
                  id: GO:0033572
                  label: transferrin transport
            locations:
              - preferred_term: external side of plasma membrane
                term:
                  id: GO:0009897
                  label: external side of plasma membrane
            role_description: >-
              Captures extracellular diferric transferrin (and TfR1-targeted payloads) at the plasma
              membrane and presents its cytoplasmic YTRF sorting motif to the AP-2 adaptor complex.
    - order: 2
      role: clathrin/AP-2 coated pit assembly and cargo internalization
      node:
        id: clathrin_ap2_internalization
        label: Clathrin/AP-2 coated pit assembly and cargo internalization
        module_type: TRANSPORT_STEP
        annotons:
          - id: ap2m1_cargo_selection
            label: "AP2M1 (AP-2 mu2): tyrosine-motif cargo adaptor"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: AP-2 complex subunit mu
                term:
                  id: PANTHER:PTHR10529
                  label: AP COMPLEX SUBUNIT MU
                representative_members:
                  - preferred_term: AP2M1 (human)
                    term:
                      id: UniProtKB:Q96CW1
                      label: AP-2 complex subunit mu
            function:
              preferred_term: signal sequence receptor activity
              term:
                id: GO:0005048
                label: signal sequence receptor activity
              evidence:
                - source_id: file:human/AP2M1/AP2M1-ai-review.yaml
                  statement: Recognizes cytoplasmic tyrosine-based YxxPhi sorting motifs and couples cargo to the clathrin coat.
                - source_id: PMID:31104773
                  title: A Recurrent Missense Variant in AP2M1 Impairs Clathrin-Mediated Endocytosis and Causes Developmental and Epileptic Encephalopathy.
                  statement: Loss or mutation of AP-2 mu2 impairs clathrin-mediated endocytosis of transferrin.
                  supporting_text: >-
                    revealed a significant impairment of CME of transferrin.
            processes:
              - preferred_term: clathrin-dependent endocytosis
                term:
                  id: GO:0072583
                  label: clathrin-dependent endocytosis
              - preferred_term: receptor internalization
                term:
                  id: GO:0031623
                  label: receptor internalization
            locations:
              - preferred_term: clathrin-coated pit
                term:
                  id: GO:0005905
                  label: clathrin-coated pit
            role_description: >-
              Recognizes tyrosine-based cytoplasmic sorting signals (such as the TfR1 YTRF motif) at
              PtdIns(4,5)P2-rich plasma-membrane patches to concentrate cargo into clathrin-coated pits.
          - id: cltc_coat_lattice
            label: "CLTC (CHC17): clathrin heavy chain coat lattice"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Clathrin heavy chain 1
                term:
                  id: PANTHER:PTHR10292:SF7
                  label: CLATHRIN HEAVY CHAIN 1
                representative_members:
                  - preferred_term: CLTC (human)
                    term:
                      id: UniProtKB:Q00610
                      label: Clathrin heavy chain 1
            function:
              preferred_term: structural molecule activity
              term:
                id: GO:0005198
                label: structural molecule activity
              evidence:
                - source_id: file:human/CLTC/CLTC-ai-review.yaml
                  statement: Polymerizes into polyhedral triskelion lattices at the plasma membrane to drive coated-vesicle budding.
                - source_id: PMID:14985334
                  title: Analysis of clathrin-mediated endocytosis of epidermal growth factor receptor by RNA interference.
                  statement: Knockdown of clathrin heavy chain maximally inhibits receptor internalization.
                  supporting_text: >-
                    The knock-downs of 
                    clathrin heavy chain and dynamin produced maximal inhibitory effects on the 
                    internalization of both receptors.
            processes:
              - preferred_term: receptor-mediated endocytosis
                term:
                  id: GO:0006898
                  label: receptor-mediated endocytosis
              - preferred_term: clathrin coat assembly
                term:
                  id: GO:0048268
                  label: clathrin coat assembly
            locations:
              - preferred_term: clathrin-coated endocytic vesicle
                term:
                  id: GO:0045334
                  label: clathrin-coated endocytic vesicle
            role_description: >-
              Assembles polyhedral clathrin cages on AP-2-selected membrane patches to invaginate and
              internalize cargo-bearing endocytic vesicles.
    - order: 3
      role: V-ATPase-driven early endosome acidification and cargo/lipid protonation
      node:
        id: early_endosome_acidification
        label: V-ATPase early endosome acidification (pH drop, ligand uncoupling & lipid protonation)
        module_type: TRANSPORT_STEP
        annotons:
          - id: atp6v1a_proton_pump
            label: "ATP6V1A: V-ATPase catalytic subunit A"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: V-type proton ATPase catalytic subunit A
                term:
                  id: PANTHER:PTHR43607:SF9
                  label: V-TYPE PROTON ATPASE CATALYTIC SUBUNIT A
                representative_members:
                  - preferred_term: ATP6V1A (human)
                    term:
                      id: UniProtKB:P38606
                      label: V-type proton ATPase catalytic subunit A
            function:
              preferred_term: proton-transporting ATPase activity, rotational mechanism
              term:
                id: GO:0046961
                label: proton-transporting ATPase activity, rotational mechanism
              evidence:
                - source_id: file:human/ATP6V1A/ATP6V1A-ai-review.yaml
                  statement: Hydrolyzes ATP in the V1 ring to drive proton translocation across endosomal and lysosomal membranes.
                - source_id: PMID:33065002
                  title: Structures of a Complete Human V-ATPase Reveal Mechanisms of Its Assembly.
                  statement: V-ATPase couples V1 ATP hydrolysis to V0 proton pumping to acidify intracellular compartments.
                  supporting_text: >-
                    Vesicular- or vacuolar-type adenosine triphosphatases (V-ATPases) 
                    are ATP-driven proton pumps comprised of a cytoplasmic V1 complex for ATP 
                    hydrolysis and a membrane-embedded Vo complex for proton transfer.
            processes:
              - preferred_term: endosomal lumen acidification
                term:
                  id: GO:0048388
                  label: endosomal lumen acidification
              - preferred_term: proton transmembrane transport
                term:
                  id: GO:1902600
                  label: proton transmembrane transport
            locations:
              - preferred_term: endosome membrane
                term:
                  id: GO:0010008
                  label: endosome membrane
              - preferred_term: lysosomal membrane
                term:
                  id: GO:0005765
                  label: lysosomal membrane
            role_description: >-
              Acidifies sorting endosomes so that receptor-bound ligands dissociate (or release iron)
              and ionizable lipid nanoparticles become protonated prior to downstream routing into
              recycling, late-endosomal maturation, or cytosolic escape.
    - order: 4
      role: EHD1-mediated tubular endocytic recycling to the plasma membrane
      node:
        id: ehd1_recycling_branch
        label: EHD1 recycling endosome tubulation and plasma-membrane return
        module_type: TRANSPORT_STEP
        annotons:
          - id: ehd1_membrane_fission
            label: "EHD1: recycling endosome tubulation/fission ATPase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: EH domain-containing protein 1
                term:
                  id: PANTHER:PTHR11216:SF127
                  label: EH DOMAIN-CONTAINING PROTEIN 1
                representative_members:
                  - preferred_term: EHD1 (human)
                    term:
                      id: UniProtKB:Q9H4M9
                      label: EH domain-containing protein 1
            function:
              preferred_term: ATP hydrolysis activity
              term:
                id: GO:0016887
                label: ATP hydrolysis activity
              evidence:
                - source_id: file:human/EHD1/EHD1-ai-review.yaml
                  statement: Oligomerizes on recycling endosome tubules and hydrolyzes ATP to drive tubule fission and plasma-membrane recycling.
                - source_id: PMID:15020713
                  title: Rabenosyn-5 and EHD1 interact and sequentially regulate protein recycling to the plasma membrane.
                  statement: Depletion of EHD1 delays transferrin and MHC-I recycling and traps cargo in the juxtanuclear recycling compartment.
                  supporting_text: >-
                    Depletion of 
                    either EHD1 or Rabenosyn-5 delayed the recycling of transferrin and major 
                    histocompatibility complex class I to the plasma membrane.
            processes:
              - preferred_term: endocytic recycling
                term:
                  id: GO:0032456
                  label: endocytic recycling
            locations:
              - preferred_term: recycling endosome membrane
                term:
                  id: GO:0055038
                  label: recycling endosome membrane
            role_description: >-
              Tubulates and vesiculates recycling endosome membranes to return internalized receptors
              (such as apo-TfR1) and non-degraded cargo back to the cell surface.
    - order: 5
      role: ESCRT-I MVB cargo sorting and RAB7A-mediated early-to-late endosome maturation
      node:
        id: escrt_rab7_late_endosome
        label: TSG101/ESCRT-I MVB cargo sorting and RAB7A late endosome maturation
        module_type: TRANSPORT_STEP
        annotons:
          - id: tsg101_escrt_sorting
            label: "TSG101: ESCRT-I ubiquitin-binding MVB sorting subunit"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Tumor susceptibility gene 101 protein
                term:
                  id: PANTHER:PTHR23306:SF17
                  label: TUMOR SUSCEPTIBILITY GENE 101 PROTEIN
                representative_members:
                  - preferred_term: TSG101 (human)
                    term:
                      id: UniProtKB:Q99816
                      label: Tumor susceptibility gene 101 protein
            function:
              preferred_term: ubiquitin binding
              term:
                id: GO:0043130
                label: ubiquitin binding
              evidence:
                - source_id: file:human/TSG101/TSG101-ai-review.yaml
                  statement: Binds ubiquitinated endocytic cargo on endosome membranes to nucleate ESCRT-mediated MVB sorting.
                - source_id: PMID:12900395
                  title: Hrs regulates multivesicular body formation via ESCRT recruitment to endosomes.
                  statement: The ESCRT-I subunit TSG101 mediates sorting of ubiquitinated endocytic cargo into multivesicular bodies for the degradative pathway.
                  supporting_text: >-
                    The ESCRT complexes are conserved through evolution, and the mammalian homologue
                    of Vps23p, Tsg101, has been shown to mediate the sorting of ubiquitinated proteins
                    into the degradative pathway, much like its yeast counterpart (Babst et al., 2000;
                    Bishop et al., 2002).
            processes:
              - preferred_term: multivesicular body assembly
                term:
                  id: GO:0036258
                  label: multivesicular body assembly
              - preferred_term: ubiquitin-dependent protein catabolic process via the multivesicular body sorting pathway
                term:
                  id: GO:0043162
                  label: ubiquitin-dependent protein catabolic process via the multivesicular body sorting pathway
            locations:
              - preferred_term: late endosome membrane
                term:
                  id: GO:0031902
                  label: late endosome membrane
              - preferred_term: early endosome membrane
                term:
                  id: GO:0031901
                  label: early endosome membrane
            role_description: >-
              Recognizes ubiquitinated cargo and recruits ESCRT machinery to bud intraluminal vesicles
              into maturing multivesicular bodies.
          - id: rab7a_late_maturation
            label: "RAB7A / Rab7: late endosome maturation and HOPS-tethering GTPase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Ras-related protein Rab-7a
                term:
                  id: PANTHER:PTHR47981:SF13
                  label: RAS-RELATED PROTEIN RAB-7A
                representative_members:
                  - preferred_term: RAB7A (human)
                    term:
                      id: UniProtKB:P51149
                      label: Ras-related protein Rab-7a
                  - preferred_term: Rab7 (mouse)
                    term:
                      id: UniProtKB:P51150
                      label: Ras-related protein Rab-7a
            function:
              preferred_term: GTPase activity
              term:
                id: GO:0003924
                label: GTPase activity
              evidence:
                - source_id: file:human/RAB7A/RAB7A-ai-review.yaml
                  statement: Controls the early-to-late endosome maturation switch and late endosome-to-lysosome transport.
                - source_id: file:mouse/Rab7/Rab7-ai-review.yaml
                  statement: Mediates late endosomal maturation in mouse liver; its loss increases cytosolic escape of lipid nanoparticles.
                - source_id: PMID:20028791
                  title: Disease mutations in Rab7 result in unregulated nucleotide exchange and inappropriate activation.
                  statement: Rab7 controls the transition of early endosomes into the late-endosomal/lysosomal degradative system.
                  supporting_text: >-
                    Rab7 specifically controls the transition of early endosomes
                    into the late-endosomal/lysosomal system and subsequent degradation of
                    cargos associated with target vesicles
                - source_id: PMID:41814093
                  title: In vivo endosomal escape assay identifies mechanisms for efficient hepatic LNP delivery.
                  statement: Loss of Rab7 blocks late endosomal maturation and increases productive cytosolic LNP escape.
                  supporting_text: >-
                    Loss of Rab7, a mediator of late endosomal maturation, increased LNP escape.
            processes:
              - preferred_term: early endosome to late endosome transport
                term:
                  id: GO:0045022
                  label: early endosome to late endosome transport
              - preferred_term: endosome to lysosome transport
                term:
                  id: GO:0008333
                  label: endosome to lysosome transport
            locations:
              - preferred_term: late endosome
                term:
                  id: GO:0005770
                  label: late endosome
              - preferred_term: late endosome membrane
                term:
                  id: GO:0031902
                  label: late endosome membrane
            role_description: >-
              Executes the Rab5-to-Rab7 conversion on maturing endosomes and recruits HOPS/RILP
              effectors to commit cargo to late endosomes and lysosomal fusion, competing with
              productive cytosolic escape.
    - order: 6
      role: endosomal membrane destabilization and productive cytosolic payload escape
      node:
        id: cytosolic_cargo_escape
        label: Endosomal escape to cytosol (productive LNP/mRNA or payload delivery)
        module_type: TRANSPORT_STEP
        context:
          cellular_components:
            - preferred_term: cytosol
              term:
                id: GO:0005829
                label: cytosol
            - preferred_term: endosome membrane
              term:
                id: GO:0010008
                label: endosome membrane
        evidence:
          - source_id: PMID:41814093
            title: In vivo endosomal escape assay identifies mechanisms for efficient hepatic LNP delivery.
            statement: >-
              Approximately 8% of branched ionizable phospholipid LNPs escape acidified endosomes
              into the hepatic cytosol within 30 min in vivo, and blocking Rab7-mediated late
              endosomal maturation increases cytosolic escape.
            supporting_text: >-
              Loss of Rab7, a mediator of late endosomal maturation, increased LNP escape.
    - order: 7
      role: lysosomal fusion and CTSD-mediated luminal cargo proteolysis
      node:
        id: ctsd_lysosomal_degradation
        label: Lysosomal fusion and CTSD luminal cargo proteolysis
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: ctsd_proteolysis
            label: "CTSD (cathepsin D): lysosomal aspartic endopeptidase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Cathepsin D
                term:
                  id: PANTHER:PTHR47966:SF42
                  label: CATHEPSIN D
                representative_members:
                  - preferred_term: CTSD (human)
                    term:
                      id: UniProtKB:P07339
                      label: Cathepsin D
            function:
              preferred_term: aspartic-type endopeptidase activity
              term:
                id: GO:0004190
                label: aspartic-type endopeptidase activity
              evidence:
                - source_id: file:human/CTSD/CTSD-ai-review.yaml
                  statement: Cleaves internal peptide bonds in acidic lysosomal and endosomal lumens during cargo turnover.
                - source_id: PMID:8393577
                  title: "Crystal structures of native and inhibited forms of human cathepsin D: implications for lysosomal targeting and drug design."
                  statement: Human cathepsin D is a lysosomal N-glycosylated aspartic protease that degrades internalized protein cargo.
                  supporting_text: >-
                    Determination of the crystal structures of cathepsin D and a complex with
                    pepstatin at 2.5 A resolution provides insights into inhibitor binding and
                    lysosomal targeting for this two-chain, N-glycosylated aspartic protease.
            processes:
              - preferred_term: proteolysis
                term:
                  id: GO:0006508
                  label: proteolysis
            locations:
              - preferred_term: lysosomal lumen
                term:
                  id: GO:0043202
                  label: lysosomal lumen
              - preferred_term: endosome lumen
                term:
                  id: GO:0031904
                  label: endosome lumen
            role_description: >-
              Hydrolyzes internalized protein cargo delivered to the acidic lysosomal lumen, acting as
              the terminal degradative sink of the endolysosomal pathway.
  connections:
    - source: tfrc_cargo_binding
      target: clathrin_ap2_internalization
      connection_type: PROVIDES_INPUT_FOR
      description: Receptor-bound cargo complexes at the cell surface are captured into clathrin/AP-2 coated pits.
    - source: clathrin_ap2_internalization
      target: early_endosome_acidification
      connection_type: PROVIDES_INPUT_FOR
      description: Internalized clathrin-coated vesicles uncoat and fuse with V-ATPase-acidified early sorting endosomes.
    - source: early_endosome_acidification
      target: ehd1_recycling_branch
      connection_type: PROVIDES_INPUT_FOR
      description: Acid-uncoupled receptors and recycling cargo enter EHD1-dependent tubular recycling endosomes for plasma-membrane return.
    - source: early_endosome_acidification
      target: escrt_rab7_late_endosome
      connection_type: PROVIDES_INPUT_FOR
      description: Cargo retained in sorting endosomes is sorted by ESCRT-I (TSG101) and matures via RAB7A into late endosomes/MVBs.
    - source: early_endosome_acidification
      target: cytosolic_cargo_escape
      connection_type: PROVIDES_INPUT_FOR
      description: Protonated LNP/macromolecular cargo in acidified endosomes destabilizes the limiting membrane to escape into the cytosol.
    - source: escrt_rab7_late_endosome
      target: cytosolic_cargo_escape
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Active RAB7A/ESCRT late endosomal maturation sequesters cargo into the degradative lysosomal
        route, restricting productive cytosolic escape (PMID:41814093).
    - source: escrt_rab7_late_endosome
      target: ctsd_lysosomal_degradation
      connection_type: PROVIDES_INPUT_FOR
      description: Mature RAB7A-positive late endosomes fuse with lysosomes where CTSD degrades luminal cargo.
  notes: >-
    Constructed for the DELIVEROME and ABM_TRAFFICKING projects to represent intracellular endosomal
    routing and cytosolic cargo escape as an executable agent-based model (ABM) derived directly from
    the module graph. All protein participants are grounded to completed AIGR gene reviews (human
    TFRC, AP2M1, CLTC, ATP6V1A, EHD1, TSG101, RAB7A, CTSD, and mouse Rab7) and PANTHER family/subfamily
    identifiers verified against interpro/panther/panther.obo and PANTHER sequence classifications.
executable_models:
  - id: endosomal_trafficking_abm
    title: Agent-based cargo routing model of endosomal recycling, lysosomal degradation, and cytosolic escape
    model_type: AGENT_BASED
    derivation: DERIVED_FROM_MODULE
    description: >-
      Simulates 100 discrete cargo/nanoparticle agents traversing the seven stages of the module
      under uniform uncalibrated default transition rates (base_rate = 0.45,
      competing_inhibitor_factor = 0.25). In wild-type baseline trafficking, active RAB7A/ESCRT
      late endosomal maturation (escrt_rab7_late_endosome) attenuates the cytosolic escape
      transition from acidified early endosomes, resulting in ~47% recycling
      (ehd1_recycling_branch), ~43% lysosomal degradation (ctsd_lysosomal_degradation), and ~10%
      cytosolic escape (cytosolic_cargo_escape) — reproducing the qualitative hierarchy observed
      by LysoTag barcoding (~8% baseline cytosolic LNP escape in vivo; PMID:41814093). Perturbing
      individual stages reproduces the qualitative direction of genetic and pharmacological blocks
      across the pathway.
    notes: >-
      Deterministic particle-conserving agent-based simulation (N=100 cargo particles, T=24 steps)
      derived from the module's directed flow connections (PROVIDES_INPUT_FOR) and competing-pathway
      inhibitory edges (NEGATIVELY_REGULATES) using uniform uncalibrated default kinetics. Cargo
      cohorts initialize at the cell-surface entry stage (tfrc_cargo_binding) and partition across
      competing branches at the acidified sorting endosome (early_endosome_acidification). Modeling
      cytosolic_cargo_escape as a direct branch out of early_endosome_acidification (attenuated by
      escrt_rab7_late_endosome) is a topological simplification that lumps early- and
      maturing-endosomal escape into a single pre-lysosomal branch.
    scenarios:
      - id: wt_steady_trafficking
        label: Wild-type baseline trafficking (recycling + lysosomal degradation dominate; ~10% cytosolic escape)
        description: >-
          With all trafficking machinery active under default module kinetics, internalized cargo
          is predominantly partitioned between EHD1-mediated plasma-membrane recycling (47%) and
          RAB7A/CTSD-mediated lysosomal degradation (43%), while only a minor fraction (10%)
          escapes into the cytosol — consistent with the qualitative hierarchy measured by LysoTag
          in vivo barcoding (~8% baseline LNP escape; PMID:41814093).
        expected_active:
          - tfrc_cargo_binding
          - clathrin_ap2_internalization
          - early_endosome_acidification
          - ehd1_recycling_branch
          - escrt_rab7_late_endosome
          - cytosolic_cargo_escape
          - ctsd_lysosomal_degradation
        expected_outcome_order:
          - ehd1_recycling_branch
          - ctsd_lysosomal_degradation
          - cytosolic_cargo_escape
        evidence:
          - source_id: PMID:41814093
            title: In vivo endosomal escape assay identifies mechanisms for efficient hepatic LNP delivery.
            statement: In vivo LysoTag barcoding shows ~8% of BiP-20 LNPs escape to the cytosol within 30 min while the majority remains in endolysosomal/recycling compartments.
            supporting_text: >-
              finding that ~8% of BiP-20 LNPs reach the 
              cytosol within 30 min of administration.
      - id: rab7a_loss_lnp_escape
        label: RAB7A / late-endosomal maturation loss (diverts flux from lysosomes and increases cytosolic escape)
        description: >-
          Inactivating escrt_rab7_late_endosome (modeling Rab7 loss-of-function) blocks endosome-to-lysosome
          delivery (ctsd_lysosomal_degradation drops to 0%) and lifts competitive sequestration on the
          acidified sorting endosome, increasing productive cytosolic escape from 10% to 47% in the
          uncalibrated default model (reproducing the qualitative increase in LNP escape upon Rab7 loss
          in PMID:41814093).
        settings:
          - element: escrt_rab7_late_endosome
            active: false
        expected_active:
          - tfrc_cargo_binding
          - clathrin_ap2_internalization
          - early_endosome_acidification
          - ehd1_recycling_branch
          - cytosolic_cargo_escape
        expected_inactive:
          - escrt_rab7_late_endosome
          - ctsd_lysosomal_degradation
        expected_outcome_order:
          - ehd1_recycling_branch
          - cytosolic_cargo_escape
          - ctsd_lysosomal_degradation
        evidence:
          - source_id: PMID:41814093
            title: In vivo endosomal escape assay identifies mechanisms for efficient hepatic LNP delivery.
            statement: Loss of Rab7 blocks late endosomal maturation and increases LNP escape into the cytosol.
            supporting_text: >-
              Loss of Rab7, a mediator of late endosomal maturation, increased LNP escape.
      - id: clathrin_endocytosis_block
        label: Clathrin / AP-2 endocytosis block (cargo trapped at the cell surface)
        description: >-
          Inactivating clathrin_ap2_internalization (modeling CLTC knockdown or pathogenic AP2M1
          loss-of-function) prevents coated-pit internalization, trapping 100% of receptor-bound
          cargo at the cell surface (tfrc_cargo_binding).
        settings:
          - element: clathrin_ap2_internalization
            active: false
        expected_active:
          - tfrc_cargo_binding
        expected_inactive:
          - clathrin_ap2_internalization
          - early_endosome_acidification
          - ehd1_recycling_branch
          - escrt_rab7_late_endosome
          - cytosolic_cargo_escape
          - ctsd_lysosomal_degradation
        expected_outcome_order:
          - tfrc_cargo_binding
          - clathrin_ap2_internalization
        evidence:
          - source_id: PMID:14985334
            title: Analysis of clathrin-mediated endocytosis of epidermal growth factor receptor by RNA interference.
            statement: Depletion of clathrin heavy chain or AP-2 subunits blocks transferrin and EGFR internalization at the plasma membrane.
            supporting_text: >-
              The knock-downs of 
              clathrin heavy chain and dynamin produced maximal inhibitory effects on the 
              internalization of both receptors.
      - id: vatpase_acidification_block
        label: V-ATPase acidification block (bafilomycin A1 / ATP6V1A loss; arrest in nascent endocytic vesicles)
        description: >-
          Inactivating early_endosome_acidification (modeling V-ATPase inhibition or ATP6V1A loss)
          allows clathrin-mediated uptake into neutral nascent vesicles but blocks pH-dependent
          ligand release, recycling, late maturation, and protonation-dependent cytosolic escape.
        settings:
          - element: early_endosome_acidification
            active: false
        expected_active:
          - tfrc_cargo_binding
          - clathrin_ap2_internalization
        expected_inactive:
          - early_endosome_acidification
          - ehd1_recycling_branch
          - escrt_rab7_late_endosome
          - cytosolic_cargo_escape
          - ctsd_lysosomal_degradation
        expected_outcome_order:
          - clathrin_ap2_internalization
          - early_endosome_acidification
        evidence:
          - source_id: file:human/ATP6V1A/ATP6V1A-ai-review.yaml
            statement: V-ATPase proton pumping acidifies early and late endosomal compartments; loss of V-ATPase function prevents endosomal acidification.
          - source_id: PMID:33065002
            title: Structures of a Complete Human V-ATPase Reveal Mechanisms of Its Assembly.
            statement: V-ATPase couples V1 ATP hydrolysis to Vo proton translocation to acidify intracellular endolysosomal compartments.
            supporting_text: >-
              Vesicular- or vacuolar-type adenosine triphosphatases (V-ATPases) 
              are ATP-driven proton pumps comprised of a cytoplasmic V1 complex for ATP 
              hydrolysis and a membrane-embedded Vo complex for proton transfer.
      - id: ehd1_recycling_block
        label: EHD1 recycling block (diverts sorting-endosome cargo toward lysosomal degradation and escape)
        description: >-
          Inactivating ehd1_recycling_branch (modeling EHD1 depletion) abolishes plasma-membrane
          recycling and redirects sorting-endosome cargo into the late-endosomal/lysosomal pathway
          (80%) and cytosolic escape (20%).
        settings:
          - element: ehd1_recycling_branch
            active: false
        expected_active:
          - tfrc_cargo_binding
          - clathrin_ap2_internalization
          - early_endosome_acidification
          - escrt_rab7_late_endosome
          - cytosolic_cargo_escape
          - ctsd_lysosomal_degradation
        expected_inactive:
          - ehd1_recycling_branch
        expected_outcome_order:
          - ctsd_lysosomal_degradation
          - cytosolic_cargo_escape
          - ehd1_recycling_branch
        evidence:
          - source_id: PMID:15020713
            title: Rabenosyn-5 and EHD1 interact and sequentially regulate protein recycling to the plasma membrane.
            statement: RNAi depletion of EHD1 blocks recycling of transferrin and MHC class I back to the plasma membrane.
            supporting_text: >-
              Depletion of 
              either EHD1 or Rabenosyn-5 delayed the recycling of transferrin and major 
              histocompatibility complex class I to the plasma membrane.
      - id: ctsd_proteolysis_block
        label: CTSD lysosomal proteolysis block (undegraded cargo accumulates in late endosomes/lysosomes)
        description: >-
          Inactivating ctsd_lysosomal_degradation (modeling cathepsin D deficiency or pepstatin A
          inhibition) preserves upstream recycling (47%) and cytosolic escape (10%) while causing
          undegraded cargo to accumulate in the late-endosomal compartment (43%).
        settings:
          - element: ctsd_lysosomal_degradation
            active: false
        expected_active:
          - tfrc_cargo_binding
          - clathrin_ap2_internalization
          - early_endosome_acidification
          - ehd1_recycling_branch
          - escrt_rab7_late_endosome
          - cytosolic_cargo_escape
        expected_inactive:
          - ctsd_lysosomal_degradation
        expected_outcome_order:
          - ehd1_recycling_branch
          - escrt_rab7_late_endosome
          - cytosolic_cargo_escape
          - ctsd_lysosomal_degradation
        evidence:
          - source_id: file:human/CTSD/CTSD-ai-review.yaml
            statement: Cathepsin D is the principal lysosomal aspartic endopeptidase responsible for luminal protein degradation.
          - source_id: PMID:8393577
            title: "Crystal structures of native and inhibited forms of human cathepsin D: implications for lysosomal targeting and drug design."
            statement: Inhibition of human cathepsin D by pepstatin blocks its lysosomal aspartic protease activity.
            supporting_text: >-
              Determination of the crystal structures of cathepsin D and a complex with
              pepstatin at 2.5 A resolution provides insights into inhibitor binding and
              lysosomal targeting for this two-chain, N-glycosylated aspartic protease.
