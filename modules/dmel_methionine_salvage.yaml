id: MODULE:dmel_methionine_salvage
title: L-methionine salvage pathway in Drosophila melanogaster
description: >-
  The methionine salvage pathway recycles the methylthio group of 5'-methylthioadenosine (MTA),
  a by-product of polyamine synthesis, back into methionine. MTA phosphorylase (Mtap) cleaves
  MTA to adenine and 5-methylthioribose-1-phosphate, which is isomerised to methylthioribulose-1-phosphate
  (Mri1) and dehydrated to a diketo phosphate (CG11134). The bifunctional enolase-phosphatase
  Enoph converts this to acireductone, which acireductone dioxygenase (Adi1) oxidises to 4-methylthio-2-oxobutanoate.
  A final transamination regenerates methionine. As in other animals, the pathway in flies
  lacks the methylthioribose kinase step used by bacteria and plants, because MTA is cleaved
  phosphorolytically.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002175
  title: 'FlyBase gene group LMETSA: L-methionine salvage pathway'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as l-methionine salvage pathway
    (LMETSA); this module models that group.
- source_id: GO:0071267
  title: L-methionine salvage
  statement: >-
    GO term grounding the module as L-methionine salvage.
notes: >-
  Boundary. The final transamination of 4-methylthio-2-oxobutanoate to methionine is carried
  out by broad-specificity aminotransferases that FlyBase does not include in this group,
  so it is not modelled. Adi1 is given the iron-dependent dioxygenase activity, which yields
  the methionine precursor; the nickel-dependent activity that yields methylthiopropionate
  is a side reaction. Molecular functions follow orthology to the characterized enzymes of
  other organisms; except for Mtap, the fly enzymes have not been assayed directly. FlyBase
  groups realized by this module: LMETSA (FBgg0002175). Participants were generated from the
  FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_methionine_salvage.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
