id: MODULE:bacterial_gallate_catabolism
title: Bacterial gallate catabolism by the GalA-D-B-C route
description: >-
  A reusable bacterial module for oxidative cleavage of gallate and conversion
  of the ring-opened product to pyruvate and oxaloacetate. An optional
  outer-membrane porin can facilitate substrate entry. GalA then cleaves the
  aromatic ring to the keto tautomer of 4-oxalomesaconate, GalD supplies the
  enol tautomer used by GalB, GalB hydrates that intermediate to
  4-carboxy-4-hydroxy-2-oxoadipate, and GalC performs the terminal aldol
  cleavage. Regulation and downstream central metabolism are outside the
  module boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:16030014
    title: Molecular characterization of the gallate dioxygenase from Pseudomonas putida KT2440. The prototype of a new subgroup of extradiol dioxygenases.
    statement: >-
      Biochemical characterization establishes the Fe(II)-dependent GalA
      gallate ring-cleavage reaction that initiates the pathway.
  - source_id: PMID:21219457
    title: 'Unravelling the gallic acid degradation pathway in bacteria: the gal cluster from Pseudomonas putida'
    statement: >-
      Genetic and biochemical analysis establishes the GalA, GalD, GalB, and
      GalC sequence and connects the terminal products to central metabolism;
      homologous gal clusters outside Pseudomonas support a bacterial rather
      than KT2440-only scope.
notes: >-
  GalP is optional because its porin activity and outer-membrane location are
  supported, but direct gallate specificity and pathway essentiality are not.
  The module begins chemically at extracellular or periplasm-accessible
  gallate and ends at pyruvate plus oxaloacetate. GalR regulation, the GalT
  inner-membrane transporter candidate, and metabolism of the terminal products
  are adjacent context rather than additional core reactions. Continuity of the
  GalA-D-B-C chain was manually verified against RHEA:28927, RHEA:28931,
  RHEA:17401, and RHEA:28935; the current derived chaining check is CoA-specific
  and does not evaluate these non-CoA intermediates.
