knowledge_gaps:
  - gap_statement: >-
      The substrate specificity and pathway requirement of the gallate-cluster
      outer-membrane porin are not established directly.
    boundary: >-
      GalP is retained only as an optional entry step; gallate-specific
      transport and the required inner-membrane uptake step are not asserted.
    gap_kind:
      - BIOLOGY
    status: OPEN
    resolution: >-
      Direct GalP uptake/selectivity assays plus identification and testing of
      the inner-membrane gallate transporter would resolve the transport
      boundary.
    provenance:
      - reference_id: file:PSEPK/galP/galP-uniprot.txt
        supporting_text: Probable transporter, possibly involved in the gallate
        reference_section_type: RESULTS
  - gap_statement: >-
      It is not known how the two OMA-to-CHA routes are distributed among
      bacteria carrying gallate dioxygenases, or whether any lineage uses both.
    boundary: >-
      Each route is grounded in one characterized lineage (Pseudomonas gal
      cluster; sphingomonad lig/des genes); route assignment for other
      gallate-degrading taxa is not asserted.
    gap_kind:
      - BIOLOGY
    status: OPEN
    resolution: >-
      Genetic tests of GalD/GalB versus LigU/LigJ homologs in gallate-degrading
      bacteria outside these two lineages, with intermediate detection (OMA
      enol versus KCH), would establish which route each uses.
    provenance:
      - reference_id: PMID:21219457
        supporting_text: >-
          presence of homologous gal clusters outside the Pseudomonas genus sheds light on
          the evolution and ecology of the gal genes in GA degraders
        reference_section_type: ABSTRACT
