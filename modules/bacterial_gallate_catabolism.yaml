knowledge_gaps:
  - gap_statement: >-
      The substrate specificity and pathway requirement of the GalP-associated
      outer-membrane porin are not established directly.
    boundary: >-
      GalP is retained only as an optional entry step; gallate-specific
      transport and the required inner-membrane uptake step are not asserted.
    gap_kind:
      - BIOLOGY
      - CURATION
  - gap_statement: >-
      GO:0047443 names 4-hydroxy-4-methyl-2-oxoglutarate aldolase activity,
      whereas GalC's characterized physiological pathway reaction cleaves CHA.
    boundary: >-
      The module records the CHA reaction with RHEA:28935 and uses the current
      EC-mapped GO term only at the GalC annoton pending a CHA-specific GO term.
    gap_kind:
      - ONTOLOGY
