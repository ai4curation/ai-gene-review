knowledge_gaps:
  - gap_statement: >-
      The substrate specificity and pathway requirement of the GalP-associated
      outer-membrane porin are not established directly.
    boundary: >-
      GalP is retained only as an optional entry step; gallate-specific
      transport and the required inner-membrane uptake step are not asserted.
    gap_kind:
      - BIOLOGY
      - CURATION
    status: OPEN
    resolution: >-
      Direct GalP uptake/selectivity assays plus identification and testing of
      the inner-membrane gallate transporter would resolve the transport
      boundary.
    provenance:
      - reference_id: file:PSEPK/galP/galP-uniprot.txt
        supporting_text: Probable transporter, possibly involved in the gallate
        reference_section_type: RESULTS
  - gap_statement: >-
      GO:0047443 already maps to RHEA:28935 for CHA cleavage, but its label
      names only 4-hydroxy-4-methyl-2-oxoglutarate rather than the characterized
      physiological CHA substrate.
    boundary: >-
      The reaction is represented through RHEA:28935; the remaining gap is
      whether GO should add a CHA synonym or a narrower CHA-specific term.
    gap_kind:
      - ONTOLOGY
    status: OPEN
    resolution: >-
      GO molecular-function editors should determine whether GO:0047443 needs
      a CHA synonym or whether the physiological reaction warrants a narrower
      CHA-specific child term.
    provenance:
      - reference_id: file:PSEPK/galC/galC-ai-review.yaml
        supporting_text: >-
          Should GO represent GalC with a CHA-specific aldolase molecular-function term distinct from the current EC-name term?
        reference_section_type: RESULTS
    proposed_terms:
      - proposed_name: 4-carboxy-4-hydroxy-2-oxoadipate aldolase activity
        proposed_definition: >-
          Catalysis of the cleavage of 4-carboxy-4-hydroxy-2-oxoadipate to
          pyruvate and oxaloacetate.
        justification: >-
          GalC has a characterized physiological CHA cleavage reaction, while
          the current EC-mapped GO term label names only the HMG substrate.
        proposed_parent:
          id: GO:0016833
          label: oxo-acid-lyase activity
        supported_by:
          - reference_id: PMID:21219457
            supporting_text: >-
              galC encodes the aldolase catalysing CHA cleavage to pyruvic and oxaloacetic acids
