knowledge_gaps:
  - gap_statement: >-
      The isolated GalP channel substrate spectrum and molecular basis of selectivity remain unresolved.
      Its native uptake contribution and dispensability for growth under the tested conditions are already
      supported.
    boundary: >-
      GalP and GalT are adjacent transport context outside the intracellular chemical boundary.
      The model does not assert complete extracellular-to-cytoplasmic delivery.
    gap_kind:
      - BIOLOGY
    status: OPEN
    resolution: >-
      Purified-channel transport and substrate competition measurements would resolve GalP selectivity.
    provenance:
      - reference_id: PMID:29052962
  - gap_statement: >-
      It is not known how the two OMA-to-CHA routes are distributed among
      bacteria carrying gallate dioxygenases, or whether any lineage uses both.
    boundary: >-
      Each route is grounded in one characterized lineage (Pseudomonas gal
      cluster; sphingomonad lig/des genes); route assignment for other
      gallate-degrading taxa is not asserted.
    gap_kind:
      - BIOLOGY
    status: OPEN
    resolution: >-
      Genetic tests of GalD/GalB versus LigU/LigJ homologs in gallate-degrading
      bacteria outside these two lineages, with intermediate detection (OMA
      enol versus KCH), would establish which route each uses.
    provenance:
      - reference_id: PMID:21219457
        supporting_text: >-
          presence of homologous gal clusters outside the Pseudomonas genus sheds light on
          the evolution and ecology of the gal genes in GA degraders
        reference_section_type: ABSTRACT
references:
  - id: PMID:17213657
    title: Genetic and biochemical investigations on bacterial catabolic pathways for lignin-derived aromatic
      compounds.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Publisher PDF read; the cached PMID is abstract-only. Review predates the 2018 KCH/LigU
        resolution, so use it for lineage, enzyme-family and pathway context rather than exact intermediate
        assignment.
    findings:
      - statement: SYK-6 DesB belongs to the type-II extradiol dioxygenases; its lower catabolic reactions
          converge with protocatechuate degradation.
      - statement: Arthrobacter keyseri has a protocatechuate 4,5-cleavage pathway; this does not establish a
          gallate-specific entry enzyme there.
  - id: PMID:31075306
    title: A comparison between the homocyclic aromatic metabolic pathways from plant-derived compounds by
      bacteria and fungi.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Author manuscript retrieved from the University of Helsinki repository. Sections 2.9.2 and
        2.9.5 compare bacteria and fungi. Its intradiol wording for GalA/DesB and its treatment of LigU as an
        OMA tautomerase are not adopted; the mechanistic primary studies resolve both.
    findings:
      - statement: The review places gallate processing in Pseudomonas and sphingomonads alongside proposed
          fungal routes, which require separate enzyme-level evidence.
      - statement: GalC/LigK terminal cleavage produces oxaloacetate and pyruvate; common downstream products
          do not make all ring-opening pathways equivalent.
  - id: PMID:29052962
    title: 'Bacterial catabolism of lignin-derived aromatics: New findings in a recent decade: Update on bacterial
      lignin catabolism.'
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full publisher text read, especially transporter table 4 and transport sections; PMID
        cache remains abstract-only. Supports transport boundaries rather than a new assignment of catalytic
        chemistry.
    findings:
      - statement: GalT has experimental transport support in the adapted KTGAL strain; aromatic-binding
          proteins and predicted transporters elsewhere are not equivalent evidence.
      - statement: The review separates porins, substrate-specific channels and inner-membrane transport
          systems.
  - id: PMID:38064205
    title: 'Bringing up to date the toolkit for the catabolism of aromatic compounds in fungi: The unexpected 1,2,3,5-tetrahydroxybenzene
      central pathway.'
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Full cached primary paper inspected; comparative fungal boundary evidence, not a bacterial
        exemplar.
    findings:
      - statement: Aspergillus gallate use can proceed through a distinct tetrahydroxybenzene pathway, so
          gallate utilization alone does not identify the bacterial OMA mechanism.
  - id: PMID:21219457
    title: 'Unravelling the gallic acid degradation pathway in bacteria: the gal cluster from Pseudomonas putida.'
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Full publisher text read separately from the protected abstract-only cache. Distinguish
        the adapted KTGAL strain from its KT2440 parent; native growth, heterologous complementation and
        enzyme assays have different scopes.
    findings:
      - statement: KTGAL restores a frameshifted GalT transporter; GalP disruption reduces uptake without
          abolishing growth.
      - statement: Burkholderia strain 383 grows on gallate, while locus-level enzyme assignments in its
          depicted cluster remain comparative predictions.
      - statement: GalD/GalB establishes one OMA-to-CHA route; native growth after deletion does not make
          spontaneous or promiscuous replacement the same encoded route.
  - id: PMID:16030014
    title: Molecular characterization of the gallate dioxygenase from Pseudomonas putida KT2440. The prototype
      of a new subgroup of extradiol dioxygenases.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Cached primary abstract and curated GalA record inspected; direct Pseudomonas
        ring-cleavage evidence.
    findings:
      - statement: GalA provides the initiating gallate dioxygenase step.
  - id: PMID:16030198
    title: 'Characterization of the gallate dioxygenase gene: three distinct ring cleavage dioxygenases are involved
      in syringate degradation by Sphingomonas paucimobilis SYK-6.'
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Cached primary paper inspected; distinguish DesB-specific activity from overlapping
        LigAB/DesZ routes.
    findings:
      - statement: DesB provides a second lineage of gallate ring-cleavage evidence in SYK-6.
  - id: PMID:29658701
    title: Functional Annotation of LigU as a 1,3-Allylic Isomerase during the Degradation of Lignin in the
      Protocatechuate 4,5-Cleavage Pathway from the Soil Bacterium Sphingobium sp. SYK-6.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Cached primary abstract inspected; 2018 mechanism supersedes the older generic OMA
        tautomerase description. Protein identity for the KA1 exemplar is separately checked in its gene
        review.
    findings:
      - statement: LigU forms KCH by allylic isomerization, which must remain distinct from GalD keto-enol
          tautomerization.
  - id: PMID:12486039
    title: Characterization of the 4-carboxy-4-hydroxy-2-oxoadipate aldolase gene and operon structure of the
      protocatechuate 4,5-cleavage pathway genes in Sphingomonas paucimobilis SYK-6.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Cached primary paper inspected for the SYK-6 terminal cleavage enzyme.
    findings:
      - statement: LigK catalyses the shared terminal CHA cleavage; growth on upstream aromatics supplies
          pathway context.
  - id: PMID:30207699
    title: 'Structure and Reaction Mechanism of the LigJ Hydratase: An Enzyme Critical for the Bacterial Degradation
      of Lignin in the Protocatechuate 4,5-Cleavage Pathway.'
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: Primary LigJ mechanism study; read cached abstract. Supports distinguishing KCH hydration
        from GalB enol hydration.
    findings:
      - statement: LigJ substrate and product chemistry restrict the shared amidohydrolase family to the
          matching reaction.
  - id: PMID:31339729
    title: Structure and Chemical Reaction Mechanism of LigU, an Enzyme That Catalyzes an Allylic
      Isomerization in the Bacterial Degradation of Lignin.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: The cached primary abstract explicitly identifies Novosphingobium KA1. The gene review
        also checks the structural construct against the target sequence.
    findings:
      - statement: KA1 LigU catalyses the OMA-to-KCH allylic isomerization and is an experimentally grounded
          exemplar of this chemical step.
  - id: file:analysis/module_audits/bacterial_gallate_catabolism/review-20261107/publisher-evidence.md
    title: Scoped publisher transport and strain evidence for PMID:21219457
    findings:
    - statement: The sequenced gal cluster differs between KTGAL and KT2440 only in the GalT-restoring cytosine
        deletion; other cluster genes provide an exact sequence bridge, without establishing native KT2440
        gallate uptake.
      supporting_text: identical to that of the wild-type strain
    - statement: GalP whole-cell uptake contribution and GalT adaptation are transport context, not an additional
        intracellular reaction.
      supporting_text: uptake of 10 µM GA
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: Bounded publisher Results excerpts and separate interpretation; acquisition URL, source
        lines190/229 and capture/excerpt hashes are in adjacent publisher-provenance.json. Original PMID
        cache remains abstract-only.
