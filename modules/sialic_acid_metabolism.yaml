              evidence:
                - source_id: PMID:15510212
                  statement: >-
                    Proton-coupled efflux of free sialic acid from lysosomes, measured with a plasma-membrane-redirected
                    sialin; disease mutations abolish or slow transport. GOA has EXP annotations to GO:0015538.
                  supporting_text: >-
                    Cells expressing the
                    plasmalemmal construct accumulated neuraminic acid at acidic pH by a process
                    equivalent to lysosomal efflux.
                - source_id: PMID:10581036
                  statement: SLC17A5 mutations cause Salla disease and infantile sialic acid storage disease.
            locations:
