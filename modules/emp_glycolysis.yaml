                  statement: phosphopyruvate hydratase (enolase); Mg2+-dependent
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Reversible and shared with gluconeogenesis. Phosphoenolpyruvate is a
              major branch point, feeding the PTS entry variant of this module as
              well as anaplerosis, aromatic-amino-acid biosynthesis, and cell-wall
              precursor synthesis.
    - order: 9
      role: terminal substrate-level phosphorylation
      node:
        id: pyruvate_kinase_step
        label: Phosphoenolpyruvate + ADP to pyruvate + ATP
        module_type: REACTION
        description: >-
          The terminal, effectively irreversible step, yielding pyruvate and the
          second ATP per triose. Gluconeogenesis cannot reverse it and must bypass it
          via oxaloacetate or via pyruvate-phosphate dikinase / PEP synthase.
        annotons:
          - id: pyruvate_kinase_activity
            label: Pyruvate kinase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: pyruvate kinase activity
                term:
                  id: GO:0004743
                  label: pyruvate kinase activity
            function:
              preferred_term: pyruvate kinase activity
              term:
                id: GO:0004743
                label: pyruvate kinase activity
              substrates:
                - preferred_term: phosphoenolpyruvate
                - preferred_term: ADP
              products:
                - preferred_term: pyruvate
                - preferred_term: ATP
              evidence:
                - source_id: EC:2.7.1.40
                  statement: pyruvate kinase; requires K+ and Mg2+
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Defines the endpoint of the module. Pyruvate's onward fate —
              decarboxylation to acetyl-CoA, reduction to lactate or ethanol,
              carboxylation to oxaloacetate — belongs to downstream modules, not to
              this one.
  connections:
    - source: hexose_phosphate_entry
      target: gpi_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        All entry variants converge on the same D-glucose 6-phosphate pool consumed
        by the isomerase.
      chaining_status: VERIFIED
      chaining_note: >-
        Curator-confirmed continuity on D-glucose 6-phosphate. No CoA intermediates
        occur anywhere in this module, so the automated CoA-continuity check does not
        apply to any connection here.
    - source: gpi_step
      target: pfk_step
      connection_type: PROVIDES_INPUT_FOR
      description: D-fructose 6-phosphate is the substrate of the committed kinase step.
      chaining_status: VERIFIED
      chaining_note: Curator-confirmed continuity on D-fructose 6-phosphate.
    - source: pfk_step
      target: aldolase_step
      connection_type: PROVIDES_INPUT_FOR
      description: D-fructose 1,6-bisphosphate is the substrate of the aldol cleavage.
      chaining_status: VERIFIED
      chaining_note: Curator-confirmed continuity on D-fructose 1,6-bisphosphate.
    - source: aldolase_step
      target: tpi_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The glycerone phosphate half of the aldol cleavage is the substrate of the
        isomerase.
      chaining_status: VERIFIED
      chaining_note: Curator-confirmed continuity on glycerone phosphate.
    - source: aldolase_step
      target: g3p_oxidation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The glyceraldehyde-3-phosphate half of the aldol cleavage enters the
        oxidation step directly, without passing through the isomerase.
      chaining_status: VERIFIED
      chaining_note: Curator-confirmed continuity on D-glyceraldehyde 3-phosphate.
    - source: tpi_step
      target: g3p_oxidation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The isomerase converts the second triose so that it too can be oxidised;
        this is the edge that makes the pathway yield two pyruvate per hexose.
      chaining_status: VERIFIED
      chaining_note: Curator-confirmed continuity on D-glyceraldehyde 3-phosphate.
    - source: g3p_oxidation
      target: pgam_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Every oxidation variant yields 3-phospho-D-glycerate, whether via the
        kinase step or directly.
      chaining_status: VERIFIED
      chaining_note: Curator-confirmed continuity on 3-phospho-D-glycerate.
    - source: pgam_step
      target: enolase_step
      connection_type: PROVIDES_INPUT_FOR
      description: 2-phospho-D-glycerate is the substrate of the hydratase.
      chaining_status: VERIFIED
      chaining_note: Curator-confirmed continuity on 2-phospho-D-glycerate.
    - source: enolase_step
      target: pyruvate_kinase_step
      connection_type: PROVIDES_INPUT_FOR
      description: Phosphoenolpyruvate is the phosphoryl donor of the terminal kinase.
      chaining_status: VERIFIED
      chaining_note: Curator-confirmed continuity on phosphoenolpyruvate.
    - source: enolase_step
      target: pts_entry_variant
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Feedback edge into the PTS entry variant specifically: the
        phosphoenolpyruvate that drives transport-coupled sugar uptake is produced
        by this module's own penultimate step, so in PTS-using organisms the entry
        step depends on pathway output. Targeting the variant rather than the
        hexose_phosphate_entry node makes the conditionality structural, and keeps
        the top-level step graph acyclic for realisations that do not select PTS
        entry.
      chaining_status: VERIFIED
      chaining_note: Curator-confirmed continuity on phosphoenolpyruvate.
  notes: >-
    Scope: the fructose-1-phosphate route is deliberately excluded. The bacterial
    fructose PTS yields fructose 1-phosphate, which 1-phosphofructokinase (FruK,
    EC 2.7.1.56) phosphorylates straight to fructose 1,6-bisphosphate, bypassing
    both the isomerase and the phosphofructokinase step — and therefore bypassing
    the fructose-6-phosphate intermediate that defines this module. GO treats that
    route the same way: GO:0061625 glycolytic process through fructose-1-phosphate
    is a SIBLING of this module's core term GO:0061615 under GO:0006096, not a
    child of it, so the route is outside this module rather than a missing variant
    of it. It is covered by modules/bacterial_fructose_pts_catabolism.yaml and
    modules/fructose_pts_uptake_and_catabolism.yaml. The glucose PTS variant
    retained here is a different thing: it yields glucose 6-phosphate and rejoins
    the F6P route at the isomerase.

    Scope. The module starts at hexose entry and ends at pyruvate. The fate of
    pyruvate (pyruvate dehydrogenase, lactate or ethanol fermentation, anaplerotic
    carboxylation), the reoxidation of the reduced cofactor produced at the
    oxidation step, and the mobilisation of glucans that feeds the
    glucose-1-phosphate entry variant are all deliberately outside it, and are
    covered by separate modules.

    Relationship to gluconeogenesis. Counting reactions rather than parts (the
    phosphorylating oxidation part contains two), the module has ten, of which
    seven are near-equilibrium and are shared, run in reverse, by the
    gluconeogenesis template. Only the entry kinase, the phosphofructokinase step
    (except in the diphosphate-dependent variant, which is freely reversible) and
    the pyruvate kinase step are effectively irreversible, and those three are
    exactly the steps the gluconeogenesis module covers with dedicated bypass
    reactions. The two modules are intended to be read together.

    Grounding. scope is ABSTRACT: participants use ANY_WITH_FUNCTION selectors
    throughout and terminal nodes intentionally do not name representative
    proteins, matching the sibling generic gluconeogenesis template. Leaf-grounding
    QC gaps on this file are therefore expected rather than defects. Concrete
    grounding to families, isozymes, and UniProt accessions lives in the
    instantiating modules (glycolysis_investment_phase, glycolysis_payoff_phase for
    human; entner_doudoroff_and_gluconeogenesis for the bacterial contrast case).

    Stoichiometry. Per hexose entering at glucose 6-phosphate via an ATP-dependent
    kinase and running the phosphorylating oxidation variant: 2 ATP invested, 4 ATP
    and 2 NAD(P)H produced, for a net 2 ATP + 2 NAD(P)H + 2 pyruvate. The PTS entry
    variant substitutes one phosphoenolpyruvate for one investment ATP; the
    non-phosphorylating oxidation variants forgo 2 ATP per hexose; the
    diphosphate-dependent phosphofructokinase variant spends diphosphate rather
    than ATP.

    Ontology limitations recorded against this template. GO provides no molecular
    function term distinguishing cofactor-dependent (dPGM, EC 5.4.2.11) from
    cofactor-independent (iPGM, EC 5.4.2.12) phosphoglycerate mutase — GO:0046538
    and GO:0046537 are obsolete with term_replaced_by GO:0004619 — and class I
    (Schiff-base) and class II (metal-dependent) fructose-bisphosphate aldolases
    likewise share GO:0004332 and EC 4.1.2.13. In both cases a concrete module
    cannot record which family an organism uses through the function term alone,
    despite the pairs being non-homologous, unevenly distributed across taxa, and
    of direct interest as drug targets; family-level grounding (PANTHER, InterPro)
    is the only route to that distinction.

    Before leaving DRAFT. This template has not been checked for satisfiability
    against a bacterial or archaeal genome. The archaeal ADP-dependent kinase and
    ferredoxin-dependent oxidation variants in particular are asserted from the GO
    term inventory and general pathway knowledge rather than from a specific
    annotated genome, and should be confirmed against one.
