id: MODULE:generic_emp_glycolysis
title: Generic Embden-Meyerhof-Parnas (EMP) glycolysis module
description: >-
  A generic, taxon-neutral decomposition of Embden-Meyerhof-Parnas glycolysis as a
  module: the catabolism of a hexose phosphate to pyruvate through the
  fructose-6-phosphate and fructose-1,6-bisphosphate intermediates, with net
  production of ATP and reduced pyridine nucleotide. The module is deliberately
  phrased as an ordered chain of reaction steps with abstract function selectors
  rather than a fixed list of genes, so that it can represent bacterial, archaeal,
  fungal, plant, and animal implementations of the same route. Its defining
  feature is the passage through fructose-6-phosphate, which is what separates
  EMP from the Entner-Doudoroff route (which passes through 6-phosphogluconate and
  2-keto-3-deoxy-6-phosphogluconate) and from the phosphoketolase routes. Three
  axes of genuine cross-taxon variation are modelled explicitly as variant sets:
  how hexose carbon enters the hexose-phosphate pool (ATP-dependent kinase,
  ADP-dependent kinase, phosphotransferase-system transport coupling,
  glucose-1-phosphate from a glucan, or fructose and mannose phosphorylated and
  delivered straight to the fructose 6-phosphate pool), which phosphoryl donor drives the committed
  6-phosphofructokinase step (ATP, diphosphate, or ADP), and whether the
  glyceraldehyde-3-phosphate oxidation step is phosphorylating (conserving the
  oxidation energy as 1,3-bisphosphoglycerate and then ATP) or non-phosphorylating
  (running straight to 3-phosphoglycerate and forgoing that ATP). A concrete
  organism module specialises these selectors with genes, isozymes, compartments,
  and regulation; see the human investment-phase and payoff-phase modules for a
  worked concrete instantiation. The steps used by fungi are oriented by
  representative enzyme families with budding-yeast and fission-yeast members,
  including the paralogous isozymes that share a step.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0061615
    title: glycolytic process through fructose-6-phosphate
    statement: >-
      The module core is grounded in the GO term for glycolysis proceeding through a
      fructose-6-phosphate intermediate, which is the specific child of glycolytic
      process (GO:0006096) that picks out the Embden-Meyerhof-Parnas route. The
      Entner-Doudoroff route is grounded separately in GO:0061678; its former
      sibling term GO:0061688 was obsoleted in GO release 2026-05-19.
  - source_id: MetaCyc:PWY-5484
    title: glycolysis II (from fructose 6-phosphate)
    statement: >-
      MetaCyc pathway cross-referenced by GO:0061615 (recorded as the has_dbxref of
      that term in the GO release used here), representing the EMP route as a
      conserved pathway with organism-specific enzyme variants.
  - source_id: GO:0061621
    title: canonical glycolysis
    statement: >-
      GO subdivides the glucose-6-phosphate route by entry mechanism; canonical
      glycolysis is defined as beginning with conversion of glucose to
      glucose-6-phosphate by glucokinase activity. This supports modelling hexose
      entry as a variant set rather than a single fixed step.
  - source_id: GO:0061633
    title: transport-coupled glycolytic process through glucose-6-phosphate
    statement: >-
      GO recognises transport-coupled entry (the bacterial phosphoenolpyruvate-
      dependent phosphotransferase system) as a distinct route into the same
      hexose-phosphate pool, supporting the PTS entry variant.
  - source_id: GO:0061622
    title: glycolytic process through glucose-1-phosphate
    statement: >-
      GO recognises entry via glucose-1-phosphate, supporting the glucan-derived
      entry variant in which phosphoglucomutase feeds the hexose-phosphate pool.
  - source_id: GO:0046537
    title: obsolete 2,3-bisphosphoglycerate-independent phosphoglycerate mutase activity
    statement: >-
      Both the cofactor-independent (GO:0046537) and cofactor-dependent
      (GO:0046538) phosphoglycerate mutase terms are obsolete and carry
      term_replaced_by GO:0004619. The dPGM/iPGM distinction therefore cannot be
      grounded in a GO molecular function term, and is recorded in this module as
      prose on the mutase step rather than as a term-bearing variant set.
  - source_id: GO:0061625
    title: glycolytic process through fructose-1-phosphate
    statement: >-
      The fructose-1-phosphate route (fructose PTS + 1-phosphofructokinase, which
      bypasses fructose 6-phosphate) is a SIBLING of GO:0061615 under GO:0006096,
      not a child of it. GO therefore places that route outside the
      fructose-6-phosphate pathway this module models, which is the basis for
      scoping it out in notes rather than adding it as an entry variant.
      Auditable directly: the asserted superclasses of GO:0061625 are GO:0006001
      fructose catabolic process and GO:0006096 glycolytic process, and GO:0061615
      is not among them. Note that module_validator checks term LABELS, not
      parentage, so this claim is not covered by CI and rests on that check
      against the GO release in use.
  - source_id: file:modules/gluconeogenesis.yaml
    title: Generic gluconeogenesis module
    statement: >-
      This module is the catabolic counterpart of the existing taxon-neutral
      gluconeogenesis template and follows the same modelling style (abstract
      function selectors, variant sets on axes of real cross-taxon variation).
      The two share the reversible trunk that the gluconeogenesis module leaves
      deliberately coarse.
  - source_id: file:modules/entner_doudoroff_and_gluconeogenesis.yaml
    title: Entner-Doudoroff glycolysis and gluconeogenesis module
    statement: >-
      The existing ED module covers bacterial hexose catabolism for organisms that
      do not run a complete forward EMP route; it explicitly scopes itself against
      EMP, and this module supplies the EMP counterpart it contrasts with.
  - source_id: file:modules/glycolysis_investment_phase.yaml
    title: Glycolysis I — investment phase (human)
    statement: >-
      Concrete human instantiation of parts 1-5 of this template (hexokinase, GPI,
      PFK-1, aldolase, TPI1), with isozyme families and disease associations.
  - source_id: file:modules/glycolysis_payoff_phase.yaml
    title: Glycolysis II — payoff phase (human)
    statement: >-
      Concrete human instantiation of parts 6-9 of this template (GAPDH, PGK,
      PGAM, enolase, pyruvate kinase).
  - source_id: YeastPathways:GLYCOLYSIS
    title: glycolysis I (from glucose 6-phosphate)
    statement: >-
      Source pathway for the S. cerevisiae realisation of parts 2-9 (glucose
      6-phosphate to pyruvate). All glycolytic catalysts listed by SGD were
      retained (PGI1, PFK1/PFK2, FBA1, TPI1, TDH1-3, PGK1, GPM1, ENO1/ENO2,
      CDC19/PYK2). Two corrections: the frame also lists fructose-1,6-
      bisphosphatase FBP1 (F16BDEPHOS-RXN), which is the gluconeogenic bypass of
      the phosphofructokinase step and is excluded here (see the gluconeogenesis
      module); and it assigns GPM1 to both the cofactor-dependent (EC 5.4.2.11,
      RXN-15513) and cofactor-independent (EC 5.4.2.12, 3PGAREARR-RXN) mutase
      reactions, whereas Gpm1 is a 2,3-bisphosphoglycerate-dependent dPGM
      (UniProt P00950, EC 5.4.2.11), so only the former is used.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLYCOLYSIS
  - source_id: YeastPathways:PWY3O-3827
    title: glucose-6-phosphate biosynthesis
    statement: >-
      Source for the hexose-kinase entry step: HXK1, HXK2 and GLK1, each
      sufficient for growth on glucose, with Hxk2 the main glucose-phosphorylating
      isoenzyme on glucose and HXK1/GLK1 glucose-repressed. No GO-CAM was
      generated for this frame; the hexokinase activities are grounded through
      the fructose and mannose frames and the fission-yeast model.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-3827
  - source_id: YeastPathways:PWY3O-0
    title: fructose degradation
    statement: >-
      Fructose entry: Hxk1/Hxk2 phosphorylate fructose at C6, delivering it
      directly to the fructose 6-phosphate pool. The frame's second reaction
      (keto-D-fructose 6-phosphate to the furanose form, RXN-14812) is an
      uncatalysed anomer/tautomer interconversion and is not modelled as a step.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-0
  - source_id: YeastPathways:PWY3O-1743
    title: mannose degradation
    statement: >-
      Mannose entry: Hxk1, Hxk2 or Glk1 phosphorylate mannose to mannose
      6-phosphate, and the reversible mannose-6-phosphate isomerase Pmi40
      converts it to fructose 6-phosphate.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-1743
  - source_id: GO:0061616
    title: glycolytic process from fructose through fructose-6-phosphate
    statement: >-
      Concept for the fructose branch of the fructose/mannose entry variant; a
      child of this module's core term GO:0061615.
  - source_id: GO:0061619
    title: glycolytic process from mannose through fructose-6-phosphate
    statement: >-
      Concept for the mannose branch of the fructose/mannose entry variant; a
      child of GO:0061615.
  - source_id: PMID:12007644
    title: The hexokinase 2-dependent glucose signal transduction pathway of Saccharomyces cerevisiae.
    statement: Hxk2 is the hexokinase highly expressed on glucose and also has a nuclear regulatory role.
    supporting_text: >-
      The HXK2 gene, encoding hexokinase 2 (Hxk2), the enzyme that initiates
      glucose metabolism, is highly expressed during growth in glucose
  - source_id: PMID:8354408
    title: Trehalose-6-phosphate, a new regulator of yeast glycolysis that inhibits hexokinases.
    statement: >-
      Trehalose 6-phosphate inhibits the yeast hexokinases, mainly Hxk2, but not
      glucokinase; a lineage-specific control of the entry step.
    supporting_text: >-
      Glucokinase was not inhibited by trehalose-6-P up to 5 mM.
  - source_id: PMID:8549830
    title: "Schizosaccharomyces pombe possesses an unusual and a conventional hexokinase: biochemical and molecular characterization of both hexokinases."
    statement: >-
      Fission yeast has two hexokinases (hxk1, hxk2), with hxk2 the kinetically
      conventional one important for growth on glucose, and no glucokinase.
    supporting_text: >-
      Disruption of hxk1+ had no effect on growth but disruption of hxk2+ doubled
      the generation time in glucose.
  - source_id: PMID:11221662
    title: Single point mutations in either gene encoding the subunits of the heterooctameric yeast phosphofructokinase abolish allosteric inhibition by ATP.
    statement: >-
      Budding-yeast phosphofructokinase is a hetero-octamer of Pfk1 (alpha) and
      Pfk2 (beta) subunits; mutations in either subunit alter allosteric control
      of the holoenzyme.
    supporting_text: >-
      Yeast phosphofructokinase is a heterooctameric enzyme subject to a complex
      allosteric regulation.
  - source_id: PMID:20833871
    title: Molecular architecture and structural basis of allosteric regulation of eukaryotic phosphofructokinases.
    statement: >-
      Fungal phosphofructokinases are large multi-subunit enzymes whose
      architecture and allosteric sites differ from the bacterial homotetramer.
    supporting_text: >-
      Eukaryotic ATP-dependent 6-phosphofructokinases (Pfks) differ from their
      bacterial counterparts in a much more complex structural organization and
      allosteric regulation.
  - source_id: PMID:3905788
    title: Differential expression of the three yeast glyceraldehyde-3-phosphate dehydrogenase genes.
    statement: TDH3 supplies most of the GAPDH activity, TDH2 and TDH1 the rest.
    supporting_text: >-
      The contribution of the TDH1, TDH2, and TDH3 gene products to the total
      glyceraldehyde-3-phosphate dehydrogenase activity in wild type cells is
      10-15, 25-30, and 50-60%, respectively.
  - source_id: PMID:9139918
    title: Characterization of a glucose-repressed pyruvate kinase (Pyk2p) in Saccharomyces cerevisiae that is catalytically insensitive to fructose-1,6-bisphosphate.
    statement: >-
      CDC19 (PYK1) is the main pyruvate kinase; the glucose-repressed,
      fructose-1,6-bisphosphate-insensitive Pyk2 is a minor isozyme for low
      glycolytic flux.
    supporting_text: >-
      The results indicate that the PYK2-encoded pyruvate kinase may be used
      under conditions of very low glycolytic flux.
  - source_id: PMID:1377774
    title: PMI40, an intron-containing gene required for early steps in yeast mannosylation.
    statement: >-
      Pmi40 is the yeast phosphomannose isomerase; its loss makes cells
      mannose auxotrophs, because the same reversible reaction also supplies
      mannose 6-phosphate for glycosylation.
    supporting_text: >-
      Deletion of the PMI40 coding sequence results in a strain requiring
      D-mannose for growth.
module:
  id: generic_emp_glycolysis
  label: Generic Embden-Meyerhof-Parnas glycolysis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: glycolytic process through fructose-6-phosphate
      term:
        id: GO:0061615
        label: glycolytic process through fructose-6-phosphate
      description: >-
        Breakdown of a monosaccharide to pyruvate through a fructose-6-phosphate
        intermediate. Passage through fructose-6-phosphate is the defining
        criterion of the EMP route and distinguishes it from the
        Entner-Doudoroff route. "Committed step" is reserved throughout this
        module for the phosphofructokinase reaction, not for this criterion.
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          The EMP enzymes are soluble and operate in the cytosol in bacteria,
          archaea, and eukaryotes alike. Compartment-specific realisations (for
          example plastidial or glycosomal glycolysis in plants and
          kinetoplastids) override this in the concrete module.
  gocam_associations:
    - model: gomodel:YeastPathways_GLYCOLYSIS
      title: "glycolysis I (from glucose 6-phosphate) - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:YeastPathways_PWY3O-0
      title: "fructose degradation - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:YeastPathways_PWY3O-1743
      title: "mannose degradation - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:663d668500002302
      title: "canonical glycolysis (GO:0061621) (S. pombe)"
  parts:
    - order: 1
      role: entry of hexose carbon into the hexose-phosphate pool
      node:
        id: hexose_phosphate_entry
        label: Hexose to hexose 6-phosphate
        module_type: REACTION
        description: >-
          Generation of a hexose 6-phosphate from an exogenous or stored hexose
          source. Four variants converge on D-glucose 6-phosphate, which the
          isomerase step then converts; the fifth (fructose or mannose entry)
          lands directly on D-fructose 6-phosphate and joins the route at the
          phosphofructokinase step. GO subdivides the glucose-6-phosphate route
          (GO:0061620) and the fructose-6-phosphate route (GO:0061616,
          GO:0061619) by exactly this axis, which is why it is modelled as a
          variant set.
        variant_sets:
          - id: hexose_entry_route
            label: Hexose-phosphate entry variants
            axis: entry mechanism and phosphoryl donor
            selection: ONE_OR_MORE
            notes: >-
              ONE_OR_MORE rather than EXACTLY_ONE: many organisms run several of
              these in parallel (for example an enteric bacterium with both a
              glucose PTS and a cytoplasmic glucokinase, or a hepatocyte
              mobilising glycogen while also phosphorylating free glucose).
            variants:
              - id: atp_kinase_entry_variant
                label: ATP-dependent hexose kinase entry
                module_type: REACTION
                description: >-
                  The canonical route (GO:0061621): a cytoplasmic ATP-dependent
                  kinase phosphorylates free glucose at C6. The broad-specificity
                  hexokinases and the glucose-specific glucokinases are
                  alternatives here, not a required pair, so they are nested as a
                  variant set on the specificity axis rather than listed as two
                  conjunctive annotons.
                concepts:
                  - preferred_term: canonical glycolysis
                    term:
                      id: GO:0061621
                      label: canonical glycolysis
                variant_sets:
                  - id: hexose_kinase_specificity
                    label: Hexose kinase specificity variants
                    axis: substrate specificity of the entry kinase
                    selection: ONE_OR_MORE
                    notes: >-
                      GO:0004340 glucokinase activity is a direct child of
                      GO:0004396 hexokinase activity, so the two are related by
                      subsumption rather than exclusion; an organism may carry
                      either or both (vertebrates carry both). ONE_OR_MORE rather
                      than EXACTLY_ONE for that reason.
                    variants:
                      - id: broad_hexokinase_variant
                        label: Broad-specificity hexokinase
                        module_type: REACTION
                        annotons:
                          - id: hexokinase_entry_activity
                            label: Hexokinase (broad-specificity)
                            participant:
                              selector_type: FAMILY
                              required_function:
                                preferred_term: hexokinase activity
                                term:
                                  id: GO:0004396
                                  label: hexokinase activity
                              family:
                                preferred_term: hexokinase family
                                term:
                                  id: PANTHER:PTHR19443
                                  label: HEXOKINASE
                                representative_members:
                                  - preferred_term: HXK2 (S. cerevisiae)
                                    term:
                                      id: UniProtKB:P04807
                                      label: Hexokinase-2
                                    description: >-
                                      Main glucose-phosphorylating isozyme on glucose
                                      (PMID:12007644); also nuclear, with a role in
                                      glucose repression.
                                  - preferred_term: HXK1 (S. cerevisiae)
                                    term:
                                      id: UniProtKB:P04806
                                      label: Hexokinase-1
                                    description: Glucose-repressed isozyme (PMID:7732723).
                                  - preferred_term: hxk2 (S. pombe)
                                    term:
                                      id: UniProtKB:P50521
                                      label: Hexokinase-2
                                    description: >-
                                      Kinetically conventional fission-yeast hexokinase
                                      needed for normal growth on glucose (PMID:8549830).
                                  - preferred_term: hxk1 (S. pombe)
                                    term:
                                      id: UniProtKB:Q09756
                                      label: Hexokinase-1
                                    description: Low-affinity hexokinase induced on fructose or glycerol (PMID:8549830).
                            function:
                              preferred_term: hexokinase activity
                              term:
                                id: GO:0004396
                                label: hexokinase activity
                              substrates:
                                - preferred_term: D-glucose
                                - preferred_term: ATP
                              products:
                                - preferred_term: D-glucose 6-phosphate
                                - preferred_term: ADP
                              evidence:
                                - source_id: EC:2.7.1.1
                                  statement: hexokinase, the broad-specificity hexose kinase
                            locations:
                              - preferred_term: cytosol
                                term:
                                  id: GO:0005829
                                  label: cytosol
                            role_description: >-
                              Commits hexose carbon to intracellular metabolism by trapping
                              it as a phosphorylated, membrane-impermeant sugar. Glucose
                              6-phosphate is a branch point, not an EMP-exclusive
                              intermediate: it also feeds the pentose phosphate pathway, the
                              Entner-Doudoroff route, and glucan synthesis. In yeasts the
                              hexokinases are inhibited by trehalose 6-phosphate
                              (PMID:8354408), a lineage-specific control of glycolytic
                              entry.
                            gocam_associations:
                              - model: gomodel:663d668500002302
                                activity: gomodel:663d668500002302/663d668500002396
                                title: "canonical glycolysis (GO:0061621) (S. pombe hxk2)"
                              - model: gomodel:663d668500002302
                                activity: gomodel:663d668500002302/663d668500002664
                                title: "canonical glycolysis (GO:0061621) (S. pombe hxk1)"
                      - id: glucose_specific_kinase_variant
                        label: Glucose-specific glucokinase
                        module_type: REACTION
                        annotons:
                          - id: glucokinase_entry_activity
                            label: Glucokinase
                            participant:
                              selector_type: FAMILY
                              required_function:
                                preferred_term: glucokinase activity
                                term:
                                  id: GO:0004340
                                  label: glucokinase activity
                              family:
                                preferred_term: hexokinase family (glucokinase members)
                                term:
                                  id: PANTHER:PTHR19443
                                  label: HEXOKINASE
                                description: >-
                                  Eukaryotic glucokinases belong to the hexokinase family;
                                  bacterial Glk-type glucokinases are unrelated (ROK and
                                  glucokinase families) and are covered only by the
                                  required_function selector.
                                representative_members:
                                  - preferred_term: GLK1 (S. cerevisiae)
                                    term:
                                      id: UniProtKB:P17709
                                      label: Glucokinase-1
                                    description: >-
                                      Glucose-repressed glucokinase, expressed on
                                      non-fermentable carbon sources (PMID:7732723);
                                      not inhibited by trehalose 6-phosphate
                                      (PMID:8354408). Fission yeast has no glucokinase
                                      (PMID:8549830).
                            function:
                              preferred_term: glucokinase activity
                              term:
                                id: GO:0004340
                                label: glucokinase activity
                              substrates:
                                - preferred_term: D-glucose
                                - preferred_term: ATP
                              products:
                                - preferred_term: D-glucose 6-phosphate
                                - preferred_term: ADP
                              evidence:
                                - source_id: EC:2.7.1.2
                                  statement: glucokinase, the glucose-specific kinase
                            locations:
                              - preferred_term: cytosol
                                term:
                                  id: GO:0005829
                                  label: cytosol
                            role_description: >-
                              The glucose-specific kinase named in the GO definition of
                              canonical glycolysis (GO:0061621). Bacterial Glk and the
                              metazoan high-Km glucose-sensing isozyme are both of this type.
              - id: adp_kinase_entry_variant
                label: ADP-dependent glucokinase entry (archaeal)
                module_type: REACTION
                description: >-
                  Several hyperthermophilic archaea run a modified EMP route in
                  which the two kinase steps use ADP rather than ATP as the
                  phosphoryl donor, yielding AMP.
                annotons:
                  - id: adp_glucokinase_activity
                    label: ADP-specific glucokinase
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: ADP-specific glucokinase activity
                        term:
                          id: GO:0043843
                          label: ADP-specific glucokinase activity
                    function:
                      preferred_term: ADP-specific glucokinase activity
                      term:
                        id: GO:0043843
                        label: ADP-specific glucokinase activity
                      substrates:
                        - preferred_term: D-glucose
                        - preferred_term: ADP
                      products:
                        - preferred_term: D-glucose 6-phosphate
                        - preferred_term: AMP
                      evidence:
                        - source_id: EC:2.7.1.147
                          statement: ADP-specific glucokinase
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Pairs with the ADP-specific phosphofructokinase variant of the
                      committed step; an organism using one generally uses both.
              - id: pts_entry_variant
                label: Phosphotransferase-system (transport-coupled) entry
                module_type: TRANSPORT_STEP
                description: >-
                  The bacterial phosphoenolpyruvate-dependent phosphotransferase
                  system phosphorylates the sugar during translocation, so uptake
                  and the first glycolytic phosphorylation are a single coupled
                  event (GO:0061633). The phosphoryl donor is phosphoenolpyruvate
                  produced downstream in this same module, making the entry step
                  dependent on pathway output.
                concepts:
                  - preferred_term: transport-coupled glycolytic process through glucose-6-phosphate
                    term:
                      id: GO:0061633
                      label: transport-coupled glycolytic process through glucose-6-phosphate
                annotons:
                  - id: pts_activity
                    label: PEP-dependent sugar phosphotransferase system
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
                        term:
                          id: GO:0008982
                          label: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
                    function:
                      preferred_term: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
                      term:
                        id: GO:0008982
                        label: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
                      substrates:
                        - preferred_term: D-glucose
                        - preferred_term: protein N(pi)-phospho-L-histidine
                      products:
                        - preferred_term: D-glucose 6-phosphate
                        - preferred_term: protein L-histidine
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                        description: >-
                          The one membrane-associated step in the module: the EIIC
                          component is integral to the plasma membrane, while the
                          phosphorelay components (EI, HPr, EIIA) are cytosolic. The
                          module-level cytosol context does not cover it.
                    role_description: >-
                      Couples transmembrane sugar transport to phosphorylation. No
                      ATP is spent at this step; the cost is one phosphoenolpyruvate
                      per hexose, so a PTS-using organism forgoes one of the four
                      payoff-phase ATP per hexose rather than paying an
                      investment-phase ATP. Net yield is unchanged at 2 ATP.
              - id: glucan_entry_variant
                label: Glucose-1-phosphate entry from a glucan or disaccharide
                module_type: REACTION
                description: >-
                  Phosphorolytic mobilisation of glycogen, starch, maltodextrin, or
                  sucrose yields glucose 1-phosphate, which phosphoglucomutase
                  isomerises into the hexose-phosphate pool (GO:0061622). This is the
                  entry route used when the carbon source is stored or polymeric
                  rather than free hexose.
                concepts:
                  - preferred_term: glycolytic process through glucose-1-phosphate
                    term:
                      id: GO:0061622
                      label: glycolytic process through glucose-1-phosphate
                annotons:
                  - id: phosphoglucomutase_activity
                    label: Phosphoglucomutase
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: phosphoglucomutase activity
                        term:
                          id: GO:0004614
                          label: phosphoglucomutase activity
                      family:
                        preferred_term: alpha-D-phosphohexomutase family
                        term:
                          id: PANTHER:PTHR22573
                          label: PHOSPHOHEXOMUTASE FAMILY MEMBER
                        representative_members:
                          - preferred_term: PGM2 (S. cerevisiae)
                            term:
                              id: UniProtKB:P37012
                              label: Phosphoglucomutase 2
                          - preferred_term: PGM1 (S. cerevisiae)
