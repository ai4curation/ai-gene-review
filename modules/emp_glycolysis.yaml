                              - preferred_term: ATP
                            evidence:
                              - source_id: EC:2.7.2.3
                                statement: phosphoglycerate kinase
                          locations:
                            - preferred_term: cytosol
                              term:
                                id: GO:0005829
                                label: cytosol
                          role_description: >-
                            Recovers the acyl-phosphate energy as ATP, repaying the
                            investment-phase cost. Freely reversible and shared with
                            gluconeogenesis.
                connections:
                  - source: gapdh_step
                    target: pgk_step
                    connection_type: PROVIDES_INPUT_FOR
                    description: >-
                      1,3-bisphospho-D-glycerate produced by the dehydrogenase is the
                      phosphoryl donor consumed by the kinase.
                    chaining_status: VERIFIED
                    chaining_note: >-
                      Curator-confirmed continuity on 3-phospho-D-glyceroyl phosphate.
                      The automated check covers CoA-carrier continuity only, so this
                      acyl-phosphate intermediate is outside its scope.
              - id: nonphosphorylating_nadp_variant
                label: Non-phosphorylating NADP+ oxidation (GAPN bypass)
                module_type: REACTION
                description: >-
                  Direct, essentially irreversible oxidation of the aldehyde to the
                  carboxylate, reducing NADP+. No acyl phosphate is formed, so the
                  phosphoglycerate kinase step is skipped and one ATP per triose is
                  forgone. Used as the main route in some bacteria and as an
                  NADPH-supplying bypass in plants and apicomplexans.
                annotons:
                  - id: gapn_activity
                    label: Non-phosphorylating glyceraldehyde-3-phosphate dehydrogenase
                    participant:
