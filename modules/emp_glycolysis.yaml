                          locations:
                            - preferred_term: cytosol
                              term:
                                id: GO:0005829
                                label: cytosol
                          role_description: >-
                            Couples aldehyde oxidation to formation of a high-energy
                            acyl phosphate. Consumes inorganic phosphate, not ATP,
                            and reduces NAD(P)+, creating the requirement that the
                            cell reoxidise the reduced cofactor for flux to continue.
                  - order: 2
                    role: substrate-level phosphorylation
                    node:
                      id: pgk_step
                      label: 1,3-bisphospho-D-glycerate + ADP to 3-phospho-D-glycerate + ATP
                      module_type: REACTION
                      annotons:
                        - id: pgk_activity
                          label: Phosphoglycerate kinase
                          participant:
                            selector_type: ANY_WITH_FUNCTION
                            required_function:
                              preferred_term: phosphoglycerate kinase activity
                              term:
                                id: GO:0004618
                                label: phosphoglycerate kinase activity
                          function:
                            preferred_term: phosphoglycerate kinase activity
                            term:
                              id: GO:0004618
                              label: phosphoglycerate kinase activity
                            substrates:
                              - preferred_term: 3-phospho-D-glyceroyl phosphate
                              - preferred_term: ADP
                            products:
