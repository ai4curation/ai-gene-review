id: MODULE:generic_emp_glycolysis
title: Generic Embden-Meyerhof-Parnas (EMP) glycolysis module
description: >-
  A generic, taxon-neutral decomposition of Embden-Meyerhof-Parnas glycolysis as a
  module: the catabolism of a hexose phosphate to pyruvate through the
  fructose-6-phosphate and fructose-1,6-bisphosphate intermediates, with net
  production of ATP and reduced pyridine nucleotide. The module is deliberately
  phrased as an ordered chain of reaction steps with abstract function selectors
  rather than a fixed list of genes, so that it can represent bacterial, archaeal,
  fungal, plant, and animal implementations of the same route. Its defining
  commitment is the passage through fructose-6-phosphate, which is what separates
  EMP from the Entner-Doudoroff route (which passes through 6-phosphogluconate and
  2-keto-3-deoxy-6-phosphogluconate) and from the phosphoketolase routes. Three
  axes of genuine cross-taxon variation are modelled explicitly as variant sets:
  how hexose carbon enters the hexose-phosphate pool (ATP-dependent kinase,
  ADP-dependent kinase, phosphotransferase-system transport coupling, or
  glucose-1-phosphate from a glucan), which phosphoryl donor drives the committed
  6-phosphofructokinase step (ATP, diphosphate, or ADP), and whether the
  glyceraldehyde-3-phosphate oxidation step is phosphorylating (conserving the
  oxidation energy as 1,3-bisphosphoglycerate and then ATP) or non-phosphorylating
  (running straight to 3-phosphoglycerate and forgoing that ATP). A concrete
  organism module specialises these selectors with genes, isozymes, compartments,
  and regulation; see the human investment-phase and payoff-phase modules for a
  worked concrete instantiation.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0061615
    title: glycolytic process through fructose-6-phosphate
    statement: >-
      The module core is grounded in the GO term for glycolysis proceeding through a
      fructose-6-phosphate intermediate, which is the specific child of glycolytic
      process (GO:0006096) that picks out the Embden-Meyerhof-Parnas route and
      excludes the Entner-Doudoroff sibling term GO:0061688.
  - source_id: MetaCyc:PWY-5484
    title: glycolysis II (from fructose 6-phosphate)
    statement: >-
      MetaCyc pathway cross-referenced by GO:0061615 (recorded as the has_dbxref of
      that term in the GO release used here), representing the EMP route as a
      conserved pathway with organism-specific enzyme variants.
  - source_id: GO:0061621
    title: canonical glycolysis
    statement: >-
      GO subdivides the glucose-6-phosphate route by entry mechanism; canonical
      glycolysis is defined as beginning with conversion of glucose to
      glucose-6-phosphate by glucokinase activity. This supports modelling hexose
      entry as a variant set rather than a single fixed step.
  - source_id: GO:0061633
    title: transport-coupled glycolytic process through glucose-6-phosphate
    statement: >-
      GO recognises transport-coupled entry (the bacterial phosphoenolpyruvate-
      dependent phosphotransferase system) as a distinct route into the same
      hexose-phosphate pool, supporting the PTS entry variant.
  - source_id: GO:0061622
    title: glycolytic process through glucose-1-phosphate
    statement: >-
      GO recognises entry via glucose-1-phosphate, supporting the glucan-derived
      entry variant in which phosphoglucomutase feeds the hexose-phosphate pool.
  - source_id: GO:0046537
    title: obsolete 2,3-bisphosphoglycerate-independent phosphoglycerate mutase activity
    statement: >-
      Both the cofactor-independent (GO:0046537) and cofactor-dependent
      (GO:0046538) phosphoglycerate mutase terms are obsolete and carry
      term_replaced_by GO:0004619. The dPGM/iPGM distinction therefore cannot be
      grounded in a GO molecular function term, and is recorded in this module as
      prose on the mutase step rather than as a term-bearing variant set.
  - source_id: GO:0061625
    title: glycolytic process through fructose-1-phosphate
    statement: >-
      The fructose-1-phosphate route (fructose PTS + 1-phosphofructokinase, which
      bypasses fructose 6-phosphate) is a SIBLING of GO:0061615 under GO:0006096,
      not a child of it. GO therefore places that route outside the
      fructose-6-phosphate pathway this module models, which is the basis for
      scoping it out in notes rather than adding it as an entry variant.
  - source_id: file:modules/gluconeogenesis.yaml
    title: Generic gluconeogenesis module
    statement: >-
      This module is the catabolic counterpart of the existing taxon-neutral
      gluconeogenesis template and follows the same modelling style (abstract
      function selectors, variant sets on axes of real cross-taxon variation).
      The two share the reversible trunk that the gluconeogenesis module leaves
      deliberately coarse.
  - source_id: file:modules/entner_doudoroff_and_gluconeogenesis.yaml
    title: Entner-Doudoroff glycolysis and gluconeogenesis module
    statement: >-
      The existing ED module covers bacterial hexose catabolism for organisms that
      do not run a complete forward EMP route; it explicitly scopes itself against
      EMP, and this module supplies the EMP counterpart it contrasts with.
  - source_id: file:modules/glycolysis_investment_phase.yaml
    title: Glycolysis I — investment phase (human)
    statement: >-
      Concrete human instantiation of parts 1-5 of this template (hexokinase, GPI,
      PFK-1, aldolase, TPI1), with isozyme families and disease associations.
  - source_id: file:modules/glycolysis_payoff_phase.yaml
    title: Glycolysis II — payoff phase (human)
    statement: >-
      Concrete human instantiation of parts 6-9 of this template (GAPDH, PGK,
      PGAM, enolase, pyruvate kinase).
module:
  id: generic_emp_glycolysis
  label: Generic Embden-Meyerhof-Parnas glycolysis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: glycolytic process through fructose-6-phosphate
      term:
        id: GO:0061615
        label: glycolytic process through fructose-6-phosphate
      description: >-
        Breakdown of a monosaccharide to pyruvate through a fructose-6-phosphate
        intermediate. Passage through fructose-6-phosphate is the defining
        commitment of the EMP route and distinguishes it from the
        Entner-Doudoroff route.
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          The EMP enzymes are soluble and operate in the cytosol in bacteria,
          archaea, and eukaryotes alike. Compartment-specific realisations (for
          example plastidial or glycosomal glycolysis in plants and
          kinetoplastids) override this in the concrete module.
  parts:
    - order: 1
      role: entry of hexose carbon into the hexose-phosphate pool
      node:
        id: hexose_phosphate_entry
        label: Hexose to hexose 6-phosphate
        module_type: REACTION
        description: >-
          Generation of D-glucose 6-phosphate (or, via the isomerase step, direct
          entry at fructose 6-phosphate) from an exogenous or stored hexose source.
          GO subdivides the glucose-6-phosphate route (GO:0061620) by exactly this
          axis, which is why it is modelled as a variant set.
        variant_sets:
          - id: hexose_entry_route
            label: Hexose-phosphate entry variants
            axis: entry mechanism and phosphoryl donor
            selection: ONE_OR_MORE
            notes: >-
              ONE_OR_MORE rather than EXACTLY_ONE: many organisms run several of
              these in parallel (for example an enteric bacterium with both a
              glucose PTS and a cytoplasmic glucokinase, or a hepatocyte
              mobilising glycogen while also phosphorylating free glucose).
            variants:
              - id: atp_kinase_entry_variant
                label: ATP-dependent hexose kinase entry
                module_type: REACTION
                description: >-
                  The canonical route (GO:0061621): a cytoplasmic ATP-dependent
                  kinase phosphorylates free glucose at C6. The broad-specificity
                  hexokinases and the glucose-specific glucokinases are
                  alternatives here, not a required pair, so they are nested as a
                  variant set on the specificity axis rather than listed as two
                  conjunctive annotons.
                concepts:
                  - preferred_term: canonical glycolysis
                    term:
                      id: GO:0061621
                      label: canonical glycolysis
                variant_sets:
                  - id: hexose_kinase_specificity
                    label: Hexose kinase specificity variants
                    axis: substrate specificity of the entry kinase
                    selection: ONE_OR_MORE
                    notes: >-
                      GO:0004340 glucokinase activity is a direct child of
                      GO:0004396 hexokinase activity, so the two are related by
                      subsumption rather than exclusion; an organism may carry
                      either or both (vertebrates carry both). ONE_OR_MORE rather
                      than EXACTLY_ONE for that reason.
                    variants:
                      - id: broad_hexokinase_variant
                        label: Broad-specificity hexokinase
                        module_type: REACTION
                        annotons:
                          - id: hexokinase_entry_activity
                            label: Hexokinase (broad-specificity)
                            participant:
                              selector_type: ANY_WITH_FUNCTION
                              required_function:
                                preferred_term: hexokinase activity
                                term:
                                  id: GO:0004396
                                  label: hexokinase activity
                            function:
                              preferred_term: hexokinase activity
                              term:
                                id: GO:0004396
                                label: hexokinase activity
                              substrates:
                                - preferred_term: D-glucose
                                - preferred_term: ATP
                              products:
                                - preferred_term: D-glucose 6-phosphate
                                - preferred_term: ADP
                              evidence:
                                - source_id: EC:2.7.1.1
                                  statement: hexokinase, the broad-specificity hexose kinase
                            locations:
                              - preferred_term: cytosol
                                term:
                                  id: GO:0005829
                                  label: cytosol
                            role_description: >-
                              Commits hexose carbon to intracellular metabolism by trapping
                              it as a phosphorylated, membrane-impermeant sugar. Glucose
                              6-phosphate is a branch point, not an EMP-exclusive
                              intermediate: it also feeds the pentose phosphate pathway, the
                              Entner-Doudoroff route, and glucan synthesis.
                      - id: glucose_specific_kinase_variant
                        label: Glucose-specific glucokinase
                        module_type: REACTION
                        annotons:
                          - id: glucokinase_entry_activity
                            label: Glucokinase
                            participant:
                              selector_type: ANY_WITH_FUNCTION
                              required_function:
                                preferred_term: glucokinase activity
                                term:
                                  id: GO:0004340
                                  label: glucokinase activity
                            function:
                              preferred_term: glucokinase activity
                              term:
                                id: GO:0004340
                                label: glucokinase activity
                              substrates:
                                - preferred_term: D-glucose
                                - preferred_term: ATP
                              products:
                                - preferred_term: D-glucose 6-phosphate
                                - preferred_term: ADP
                              evidence:
                                - source_id: EC:2.7.1.2
                                  statement: glucokinase, the glucose-specific kinase
                            locations:
                              - preferred_term: cytosol
                                term:
                                  id: GO:0005829
                                  label: cytosol
                            role_description: >-
                              The glucose-specific kinase named in the GO definition of
                              canonical glycolysis (GO:0061621). Bacterial Glk and the
                              metazoan high-Km glucose-sensing isozyme are both of this type.
              - id: adp_kinase_entry_variant
                label: ADP-dependent glucokinase entry (archaeal)
                module_type: REACTION
                description: >-
                  Several hyperthermophilic archaea run a modified EMP route in
                  which the two kinase steps use ADP rather than ATP as the
                  phosphoryl donor, yielding AMP.
                annotons:
                  - id: adp_glucokinase_activity
                    label: ADP-specific glucokinase
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: ADP-specific glucokinase activity
                        term:
                          id: GO:0043843
                          label: ADP-specific glucokinase activity
                    function:
                      preferred_term: ADP-specific glucokinase activity
                      term:
                        id: GO:0043843
                        label: ADP-specific glucokinase activity
                      substrates:
                        - preferred_term: D-glucose
                        - preferred_term: ADP
                      products:
                        - preferred_term: D-glucose 6-phosphate
                        - preferred_term: AMP
                      evidence:
                        - source_id: EC:2.7.1.147
                          statement: ADP-specific glucokinase
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Pairs with the ADP-specific phosphofructokinase variant of the
                      committed step; an organism using one generally uses both.
              - id: pts_entry_variant
                label: Phosphotransferase-system (transport-coupled) entry
                module_type: TRANSPORT_STEP
                description: >-
                  The bacterial phosphoenolpyruvate-dependent phosphotransferase
                  system phosphorylates the sugar during translocation, so uptake
                  and the first glycolytic phosphorylation are a single coupled
                  event (GO:0061633). The phosphoryl donor is phosphoenolpyruvate
                  produced downstream in this same module, making the entry step
                  dependent on pathway output.
                concepts:
                  - preferred_term: transport-coupled glycolytic process through glucose-6-phosphate
                    term:
                      id: GO:0061633
                      label: transport-coupled glycolytic process through glucose-6-phosphate
                annotons:
                  - id: pts_activity
                    label: PEP-dependent sugar phosphotransferase system
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
                        term:
                          id: GO:0008982
                          label: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
                    function:
                      preferred_term: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
                      term:
                        id: GO:0008982
                        label: protein-N(PI)-phosphohistidine-carbohydrate phosphotransferase activity
                      substrates:
                        - preferred_term: D-glucose
                        - preferred_term: protein N(pi)-phospho-L-histidine
                      products:
                        - preferred_term: D-glucose 6-phosphate
                        - preferred_term: protein L-histidine
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                        description: >-
                          The one membrane-associated step in the module: the EIIC
                          component is integral to the plasma membrane, while the
                          phosphorelay components (EI, HPr, EIIA) are cytosolic. The
                          module-level cytosol context does not cover it.
                    role_description: >-
                      Couples transmembrane sugar transport to phosphorylation. No
                      ATP is spent at this step; the cost is one phosphoenolpyruvate
                      per hexose, so a PTS-using organism forgoes one of the four
                      payoff-phase ATP per hexose rather than paying an
                      investment-phase ATP. Net yield is unchanged at 2 ATP.
              - id: glucan_entry_variant
                label: Glucose-1-phosphate entry from a glucan or disaccharide
                module_type: REACTION
                description: >-
                  Phosphorolytic mobilisation of glycogen, starch, maltodextrin, or
                  sucrose yields glucose 1-phosphate, which phosphoglucomutase
                  isomerises into the hexose-phosphate pool (GO:0061622). This is the
                  entry route used when the carbon source is stored or polymeric
                  rather than free hexose.
                concepts:
                  - preferred_term: glycolytic process through glucose-1-phosphate
                    term:
                      id: GO:0061622
                      label: glycolytic process through glucose-1-phosphate
                annotons:
                  - id: phosphoglucomutase_activity
                    label: Phosphoglucomutase
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: phosphoglucomutase activity
                        term:
                          id: GO:0004614
                          label: phosphoglucomutase activity
                    function:
                      preferred_term: phosphoglucomutase activity
                      term:
                        id: GO:0004614
                        label: phosphoglucomutase activity
                      substrates:
                        - preferred_term: D-glucose 1-phosphate
                      products:
                        - preferred_term: D-glucose 6-phosphate
                      evidence:
                        - source_id: EC:5.4.2.2
                          statement: phosphoglucomutase (alpha-D-glucose 1,6-phosphomutase)
                    role_description: >-
                      Entry point for glucan-derived carbon. The upstream
                      phosphorylase or hydrolase that liberates glucose 1-phosphate
                      belongs to the glucan-degradation module, not to this one.
    - order: 2
      role: aldose-ketose isomerisation committing carbon to the EMP route
      node:
        id: gpi_step
        label: D-glucose 6-phosphate to D-fructose 6-phosphate
        module_type: REACTION
        description: >-
          The step that makes the route EMP: this isomerisation is where carbon is
          routed into the Embden-Meyerhof-Parnas pathway, and passage through its
          product is what GO:0061615 names. It is not, however, the committed step
          — that is the phosphofructokinase step below. The reaction is
          near-equilibrium and runs in either direction depending on flux, and
          fructose 6-phosphate is itself a shared metabolite: it is an output of
          the non-oxidative pentose phosphate branch, an intermediate of the
          phosphoketolase routes, and the substrate drawn off into hexosamine
          biosynthesis.
        annotons:
          - id: gpi_activity
            label: Glucose-6-phosphate isomerase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: glucose-6-phosphate isomerase activity
                term:
                  id: GO:0004347
                  label: glucose-6-phosphate isomerase activity
            function:
              preferred_term: glucose-6-phosphate isomerase activity
              term:
                id: GO:0004347
                label: glucose-6-phosphate isomerase activity
              substrates:
                - preferred_term: D-glucose 6-phosphate
              products:
                - preferred_term: D-fructose 6-phosphate
              evidence:
                - source_id: EC:5.3.1.9
                  statement: glucose-6-phosphate isomerase
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Reversibly interconverts glucose 6-phosphate and fructose 6-phosphate.
              Shared with gluconeogenesis, which runs this same enzyme in the
              opposite direction.
    - order: 3
      role: committed, effectively irreversible phosphorylation
      node:
        id: pfk_step
        label: D-fructose 6-phosphate to D-fructose 1,6-bisphosphate
        module_type: REACTION
        description: >-
          The committed step of the pathway proper and, where it is ATP-dependent,
          the principal locus of allosteric control. It is the step that
          gluconeogenesis must bypass with a phosphatase rather than reverse.
        variant_sets:
          - id: pfk_phosphoryl_donor
            label: 6-phosphofructokinase phosphoryl-donor variants
            axis: phosphoryl donor
            selection: ONE_OR_MORE
            notes: >-
              The choice of donor has thermodynamic consequences for the whole
              module: the ATP and ADP variants are effectively irreversible and
              require a separate fructose-1,6-bisphosphatase for gluconeogenic
              flux, whereas the diphosphate-dependent enzyme is freely reversible
              and can itself serve both directions in organisms that use it.
              ONE_OR_MORE rather than EXACTLY_ONE: the donors are not mutually
              exclusive. Plants co-express a cytosolic ATP-dependent PFK and a
              diphosphate-dependent PFP, and where both are present the committed
              step is only partly irreversible, so a realisation may select more
              than one variant here.
            variants:
              - id: atp_pfk_variant
                label: ATP-dependent 6-phosphofructokinase route
                module_type: REACTION
                annotons:
                  - id: atp_pfk_activity
                    label: ATP-dependent 6-phosphofructokinase
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: 6-phosphofructokinase activity
                        term:
                          id: GO:0003872
                          label: 6-phosphofructokinase activity
                    function:
                      preferred_term: 6-phosphofructokinase activity
                      term:
                        id: GO:0003872
                        label: 6-phosphofructokinase activity
                      substrates:
                        - preferred_term: D-fructose 6-phosphate
                        - preferred_term: ATP
                      products:
                        - preferred_term: D-fructose 1,6-bisphosphate
                        - preferred_term: ADP
                      evidence:
                        - source_id: EC:2.7.1.11
                          statement: 6-phosphofructokinase
                    role_description: >-
                      The usual bacterial and eukaryotic enzyme, and the canonical
                      allosteric control point of glycolysis. The specific effectors
                      are lineage-dependent and belong in the concrete module.
              - id: ppi_pfk_variant
                label: Diphosphate-dependent phosphofructokinase route
                module_type: REACTION
                annotons:
                  - id: ppi_pfk_activity
                    label: Diphosphate-fructose-6-phosphate 1-phosphotransferase
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: diphosphate-fructose-6-phosphate 1-phosphotransferase activity
                        term:
                          id: GO:0047334
                          label: diphosphate-fructose-6-phosphate 1-phosphotransferase activity
                    function:
                      preferred_term: diphosphate-fructose-6-phosphate 1-phosphotransferase activity
                      term:
                        id: GO:0047334
                        label: diphosphate-fructose-6-phosphate 1-phosphotransferase activity
                      substrates:
                        - preferred_term: D-fructose 6-phosphate
                        - preferred_term: diphosphate
                      products:
                        - preferred_term: D-fructose 1,6-bisphosphate
                        - preferred_term: phosphate
                      evidence:
                        - source_id: EC:2.7.1.90
                          statement: diphosphate-fructose-6-phosphate 1-phosphotransferase
                    role_description: >-
                      Uses inorganic diphosphate rather than ATP, salvaging the
                      diphosphate released by biosynthetic reactions. Freely
                      reversible, so in organisms that rely on it the step is not a
                      committed one and the module's irreversibility argument does
                      not hold.
              - id: adp_pfk_variant
                label: ADP-dependent phosphofructokinase route (archaeal)
                module_type: REACTION
                annotons:
                  - id: adp_pfk_activity
                    label: ADP-specific phosphofructokinase
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: ADP-specific phosphofructokinase activity
                        term:
                          id: GO:0043844
                          label: ADP-specific phosphofructokinase activity
                    function:
                      preferred_term: ADP-specific phosphofructokinase activity
                      term:
                        id: GO:0043844
                        label: ADP-specific phosphofructokinase activity
                      substrates:
                        - preferred_term: D-fructose 6-phosphate
                        - preferred_term: ADP
                      products:
                        - preferred_term: D-fructose 1,6-bisphosphate
                        - preferred_term: AMP
                      evidence:
                        - source_id: EC:2.7.1.146
                          statement: ADP-specific phosphofructokinase
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      The archaeal counterpart, pairing with the ADP-specific
                      glucokinase entry variant.
    - order: 4
      role: aldol cleavage of the hexose bisphosphate into two trioses
      node:
        id: aldolase_step
        label: D-fructose 1,6-bisphosphate to DHAP + D-glyceraldehyde 3-phosphate
        module_type: REACTION
        description: >-
          Retro-aldol cleavage producing one molecule each of dihydroxyacetone
          phosphate and glyceraldehyde 3-phosphate. Two mechanistically unrelated
          enzyme classes catalyse this reaction and both carry the same GO term:
          class I aldolases (lysine Schiff-base mechanism; animals, plants, green
          algae) and class II aldolases (divalent-metal-dependent; most bacteria and
          fungi). The distinction is an enzyme-family fact rather than a route fact,
          so it is recorded here as prose rather than as a term-bearing variant set.
        annotons:
          - id: aldolase_activity
            label: Fructose-bisphosphate aldolase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: fructose-bisphosphate aldolase activity
                term:
                  id: GO:0004332
                  label: fructose-bisphosphate aldolase activity
            function:
              preferred_term: fructose-bisphosphate aldolase activity
              term:
                id: GO:0004332
                label: fructose-bisphosphate aldolase activity
              substrates:
                - preferred_term: D-fructose 1,6-bisphosphate
              products:
                - preferred_term: glycerone phosphate
                - preferred_term: D-glyceraldehyde 3-phosphate
              evidence:
                - source_id: EC:4.1.2.13
                  statement: fructose-bisphosphate aldolase (class I and class II enzymes share this EC number)
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Halves the hexose skeleton. From this point the module's per-hexose
              stoichiometry doubles: every downstream step runs twice per molecule
              of glucose consumed.
    - order: 5
      role: recovery of the second triose into the oxidisable pool
      node:
        id: tpi_step
        label: Glycerone phosphate to D-glyceraldehyde 3-phosphate
        module_type: REACTION
        description: >-
          Only glyceraldehyde 3-phosphate is oxidised by the payoff phase, so
          without this isomerisation half the hexose carbon would be stranded as
          dihydroxyacetone phosphate. It is this step that makes the pathway yield
          two pyruvate per hexose.
        annotons:
          - id: tpi_activity
            label: Triose-phosphate isomerase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: triose-phosphate isomerase activity
                term:
                  id: GO:0004807
                  label: triose-phosphate isomerase activity
            function:
              preferred_term: triose-phosphate isomerase activity
              term:
                id: GO:0004807
                label: triose-phosphate isomerase activity
              substrates:
                - preferred_term: glycerone phosphate
              products:
                - preferred_term: D-glyceraldehyde 3-phosphate
              evidence:
                - source_id: EC:5.3.1.1
                  statement: triose-phosphate isomerase
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Near-diffusion-limited, freely reversible isomerisation. Also the point
              at which glycerol- and dihydroxyacetone-derived carbon enters the
              pathway, and the exit point toward glycerolipid synthesis.
    - order: 6
      role: oxidation of glyceraldehyde 3-phosphate
      node:
        id: g3p_oxidation
        label: D-glyceraldehyde 3-phosphate to 3-phospho-D-glycerate
        module_type: METABOLIC_PATHWAY
        description: >-
          The redox step of the pathway, and the axis on which EMP implementations
          differ most consequentially for energy yield. The phosphorylating route
          conserves the oxidation energy as the acyl phosphate
          1,3-bisphosphoglycerate and then recovers it as ATP; the
          non-phosphorylating routes oxidise straight to 3-phosphoglycerate,
          forgoing that substrate-level phosphorylation in exchange for a large
          thermodynamic pull.
        variant_sets:
          - id: g3p_oxidation_route
            label: Glyceraldehyde-3-phosphate oxidation variants
            axis: phosphorylating versus non-phosphorylating oxidation
            selection: ONE_OR_MORE
            notes: >-
              ONE_OR_MORE because some organisms run a phosphorylating and a
              non-phosphorylating enzyme side by side, using the latter as a
              largely irreversible, NADPH-generating bypass under conditions where
              the ATP is worth sacrificing. Selecting a non-phosphorylating variant
              makes the phosphoglycerate kinase sub-step inapplicable, since
              1,3-bisphosphoglycerate is never formed.
            variants:
              - id: phosphorylating_oxidation_variant
                label: Phosphorylating oxidation with substrate-level phosphorylation
                module_type: METABOLIC_PATHWAY
                description: >-
                  The canonical two-step route: oxidative phosphorylation of the
                  aldehyde to an acyl phosphate, then transfer of that phosphate to
                  ADP. This pair is the only ATP-yielding segment of the module
                  besides the pyruvate kinase step.
                parts:
                  - order: 1
                    role: oxidative phosphorylation of the aldehyde
                    node:
                      id: gapdh_step
                      label: G3P + phosphate + NAD(P)+ to 1,3-bisphospho-D-glycerate
                      module_type: REACTION
