    - order: 7
      role: intramolecular phosphoryl transfer
      node:
        id: pgam_step
        label: 3-phospho-D-glycerate to 2-phospho-D-glycerate
        module_type: REACTION
        description: >-
          Repositions the phosphate group to set up the dehydration that creates the
          high-energy enol phosphate. Two unrelated enzyme families catalyse this
          reaction: the cofactor-dependent mutases (dPGM), which require
          2,3-bisphosphoglycerate as a phosphate donor and are found in animals,
          fungi, and many bacteria, and the cofactor-independent mutases (iPGM),
          which are manganese-dependent and are the form found in plants, nematodes,
          archaea, and other bacteria. GO no longer distinguishes them: the
          dependent and independent MF terms (GO:0046538, GO:0046537) were obsoleted
          with term_replaced_by GO:0004619, so this step deliberately asserts only
          the generic term and records the family split as prose. That the two
          families are non-homologous and unevenly distributed makes iPGM a
          long-standing antiparasitic and antibacterial target.
        annotons:
          - id: pgam_activity
            label: Phosphoglycerate mutase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: phosphoglycerate mutase activity
                term:
                  id: GO:0004619
                  label: phosphoglycerate mutase activity
            function:
              preferred_term: phosphoglycerate mutase activity
              term:
                id: GO:0004619
                label: phosphoglycerate mutase activity
              substrates:
                - preferred_term: 3-phospho-D-glycerate
              products:
                - preferred_term: 2-phospho-D-glycerate
              evidence:
                - source_id: EC:5.4.2.11
                  statement: 2,3-bisphosphoglycerate-dependent phosphoglycerate mutase (dPGM)
                - source_id: EC:5.4.2.12
                  statement: 2,3-bisphosphoglycerate-independent phosphoglycerate mutase (iPGM)
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Near-equilibrium isomerisation shared with gluconeogenesis. The
              cofactor-dependent form is mechanistically linked to the
              2,3-bisphosphoglycerate shunt in organisms that run one.
    - order: 8
      role: dehydration creating the high-energy enol phosphate
      node:
        id: enolase_step
        label: 2-phospho-D-glycerate to phosphoenolpyruvate
        module_type: REACTION
        description: >-
          Removal of water redistributes energy within the molecule, raising the
          phosphoryl-transfer potential of the phosphate far above that of ATP
          without any input of energy. This is what makes the final step able to
          phosphorylate ADP.
        annotons:
          - id: enolase_activity
            label: Enolase (phosphopyruvate hydratase)
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: phosphopyruvate hydratase activity
                term:
                  id: GO:0004634
                  label: phosphopyruvate hydratase activity
            function:
              preferred_term: phosphopyruvate hydratase activity
              term:
                id: GO:0004634
                label: phosphopyruvate hydratase activity
