                              term:
                                id: GO:0004365
                                label: glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating) activity
                          function:
                            preferred_term: glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating) activity
                            term:
                              id: GO:0004365
                              label: glyceraldehyde-3-phosphate dehydrogenase (NAD+) (phosphorylating) activity
                            substrates:
                              - preferred_term: D-glyceraldehyde 3-phosphate
                              - preferred_term: phosphate
                              - preferred_term: NAD(+)
                            products:
                              - preferred_term: 3-phospho-D-glyceroyl phosphate
                              - preferred_term: NADH
                            evidence:
                              - source_id: EC:1.2.1.12
                                statement: glyceraldehyde-3-phosphate dehydrogenase (phosphorylating)
                              - source_id: GO:0043891
                                statement: >-
                                  Dual-cofactor enzymes are covered by
                                  glyceraldehyde-3-phosphate dehydrogenase [NAD(P)+]
                                  (phosphorylating) activity (GO:0043891); a concrete
