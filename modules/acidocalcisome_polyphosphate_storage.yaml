              term:
                id: UniProtKB:O14617
                label: AP-3 complex subunit delta-1
            ancestral_nodes:
            - preferred_term: PAINT node PTN000513025
              term:
                id: PANTHER:PTN000513025
                label: PTN000513025
              description: PANTHER PAINT ancestral node PTN000513025 in family PTHR22781, placed at taxon:2759 (Eukaryota);
