  - order: 2
    role: polyphosphate synthesis
    node:
      id: vtc_polyp_synthesis
      label: VTC polyphosphate polymerase
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: vtc4_catalytic_subunit
        label: Vtc4 catalytic subunit of the VTC complex
        participant:
          selector_type: FAMILY
          family:
            preferred_term: VTC-domain subunit of PTHR46140:SF1 (Vtc4 in most lineages)
            term:
              id: PANTHER:PTHR46140:SF1
              label: VACUOLAR TRANSPORTER CHAPERONE COMPLEX SUBUNIT 4-RELATED
            representative_members:
            - preferred_term: VTC4 (budding yeast)
              term:
                id: UniProtKB:P47075
                label: Vacuolar transporter chaperone complex subunit 4
            - preferred_term: TbVtc4 (Trypanosoma brucei)
              term:
                id: UniProtKB:Q382V9
                label: Vacuolar transporter chaperone complex subunit 4
            ancestral_nodes:
            - preferred_term: PAINT node PTN001646574
              term:
                id: PANTHER:PTN001646574
                label: PTN001646574
              description: PANTHER PAINT ancestral node PTN001646574 in family PTHR46140, placed at taxon:2759 (Eukaryota).
                Its F IBD for GO:0008976 is seeded by SGD:S000003549 and UniProtKB:Q382V9 (TbVtc4); its other IBDs
                are C:GO:0005783, C:GO:0033254 and P:GO:0006799. PAINT rows dated 20240920-20260530. Yeast VTC4
                and TbVtc4 descend from it (their IBA rows cite PTN001646574). The node is family-wide, so it also
                covers the non-catalytic subunits; neither the node nor the domain requirement separates the catalytic
                subunit from every non-catalytic one (see the family description).
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN001646574 in PANTHER family PTHR46140.
            description: 'PTHR46140:SF1 is mixed: the PTHR46140 family review records that it holds the catalytic
              Vtc4 together with short Vtc1-like and regulatory Vtc5 proteins, and that neither the subfamily nor
              VTC complex membership bounds polyphosphate kinase activity. The step therefore also requires the
              VTC domain (InterPro IPR018966, Pfam PF09359), the triphosphate-tunnel domain of the catalytic subunit.
              That excludes the Vtc1-like proteins, which have only the DUF202 membrane domain: the Dictyostelium
              SF1 proteins Q54JW8 and Q54ZD5 are dropped, and yeast VTC5 (P38966), in SF1 without the VTC domain,
              is not selected. It does not exclude every non-catalytic VTC-domain subunit. The fungal Vtc2 and Vtc3
              are in SF2 and are not selected, but the entries table places Toxoplasma vtc2 (A0A125YS36) in SF1,
              so where a lineage''s Vtc2/Vtc3-type subunit falls in SF1 the step can be met by it. The proteins
              the step is met on in the census organisms are: budding yeast VTC4 (P47075), fission yeast vtc4 (P78810),
              Neurospora vtc-4 (Q7SCX0), the chytrid Vtc4 (F4NUF7), T. brucei Vtc4 (Q382V9), Leishmania Q4QI04,
              Thalassiosira B8CGM0, Plasmodium C6KT60 and Chlamydomonas A0A2K3E503, A0A2K3DF66 and A0A2K3DBW4.
              Only P47075, P78810 and Q382V9 are reviewed UniProt entries; the other names, including the Vtc4
              names of Q7SCX0 and F4NUF7, are automatic. Apicomplexans have a Vtc4: Toxoplasma has Vtc2 and Vtc4
              orthologs (PMID:42126255), and the entries table places its Vtc2 (A0A125YS36) in SF1. Which of
              the two the putative Plasmodium protein C6KT60 is has not been established, so its pass may rest
              on a Vtc2-type subunit. Chlamydomonas has a Vtc4 ortholog
              (PMID:42126255), but one of its three selected proteins, A0A2K3DBW4 (Cre10.g461500), is described
              there as Vtc1-like although it carries the VTC domain.'
          required_domain:
            preferred_term: VTC domain
            term:
              id: InterPro:IPR018966
              label: VTC domain
        function:
          preferred_term: polyphosphate kinase activity
          term:
            id: GO:0008976
            label: polyphosphate kinase activity
        locations:
        - preferred_term: acidocalcisome membrane
          term:
            id: GO:0033102
            label: acidocalcisome membrane
        - preferred_term: fungal-type vacuole membrane
          term:
            id: GO:0000329
            label: fungal-type vacuole membrane
          description: The membrane on which the VTC complex works in the fungi, which meet this rule through
            their polyphosphate-filled vacuole.
        role_description: Cytosolic catalytic domain of the membrane VTC complex that transfers the gamma-phosphate
          of ATP onto a growing polyphosphate chain, which the complex translocates into the organelle lumen.
        evidence:
        - source_id: file:genes/yeast/VTC4/VTC4-ai-review.yaml
          statement: 'Reviewed core function of yeast VTC4: polyphosphate kinase activity.'
        - source_id: PMID:24114837
          statement: TbVtc4 is a polyphosphate kinase that localizes to acidocalcisomes of T. brucei.
          supporting_text: Here, we report that TbVtc4 (Vtc4 ortholog of Trypanosoma brucei) encodes, in contrast,
            a short chain polyP kinase that localizes to acidocalcisomes.
        - source_id: PMID:42126255
          statement: The TTM domain of Vtc4 synthesises polyphosphate from cytosolic ATP, and the chain is translocated
            into the vacuole.
          supporting_text: The TTM domain of Vtc4 (TTMVtc4) synthesizes polyP by transferring the γ-phosphate of
            cytosolic ATP onto the growing polyP chain, which is translocated into the vacuole (27).
        - source_id: PMID:42126255
          statement: Apicomplexans have both a Vtc2 and a Vtc4 ortholog, so a VTC-domain protein selected in
            an apicomplexan is not necessarily the catalytic subunit.
          supporting_text: The apicomplexan parasite Toxoplasma gondii possesses orthologs to Vtc2 (23) and Vtc4
            (49) but not to Vtc1, Vtc3, and Vtc5.
        - source_id: file:interpro/panther/PTHR46140/PTHR46140-review.yaml
          statement: Family review; records that SF1 mixes Vtc4 with Vtc1-like and Vtc5 proteins.
        - source_id: file:interpro/panther/PTHR46140/PTHR46140-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  - order: 2
    role: lumen acidification
