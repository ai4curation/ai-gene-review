                term:
                  id: PANTHER:PTHR31998
                  label: K(+)-INSENSITIVE PYROPHOSPHATE-ENERGIZED PROTON PUMP
                representative_members:
                - preferred_term: AVP1 (Arabidopsis)
                  term:
                    id: UniProtKB:P31414
                    label: Pyrophosphate-energized vacuolar membrane proton pump 1
                - preferred_term: TbVP1 (Trypanosoma brucei), the pump knocked down in PMID:12121996
                  term:
                    id: UniProtKB:Q8MTZ4
                    label: H(+)-exporting diphosphatase
                ancestral_nodes:
                - preferred_term: PAINT node PTN009132393
                  term:
                    id: PANTHER:PTN009132393
                    label: PTN009132393
                  description: PANTHER PAINT ancestral node PTN009132393 in family PTHR31998, given no taxon in
                    the source PAINT rows; IBD seeds AGI_LocusCode:AT1G15690 (AVP1) and AGI_LocusCode:AT1G78920
                    for F:GO:0009678, and UniProtKB:Q9S5X0 for P:GO:0055085. Arabidopsis AVP1 descends from it (its
                    IBA row for GO:0055085 cites PTN009132393).
                  evidence:
                  - source_id: GO_REF:0000033
                    statement: IBD propagation from PAINT ancestral node PTN009132393 in PANTHER family PTHR31998.
                description: 'Despite its official name, PTHR31998 holds both the K+-stimulated (AVP1) and the K+-insensitive
                  (AVPL1) Arabidopsis pumps, and the H+-PPases of the trypanosomatids, Plasmodium, Chlamydomonas
                  and Thalassiosira in PANTHER''s release-19 files; the trypanosomatid and Chlamydomonas acidocalcisome
                  pumps are the ones studied (PMID:12121996, PMID:11579086). PTHR48146 (K-STIMULATED PYROPHOSPHATE-ENERGIZED
                  SODIUM PUMP PROTEIN) is not selected: its Dictyostelium member Q554R7 is a DUF8749 protein, not
                  a proton pump.'
            function:
