        axis: proton pump
        variant_kind: REALIZER
        selection: ONE_OR_MORE
        notes: Chlamydomonas acidocalcisomes carry both the H+-PPase and the V-ATPase (PMID:11579086), while the
          yeasts have no H+-PPase in PANTHER's files and acidify their vacuole with the V-ATPase, hence ONE_OR_MORE.
        variants:
        - id: h_ppase_variant
          label: Vacuolar H+-pyrophosphatase
          module_type: MOLECULAR_FUNCTION
          annotons:
