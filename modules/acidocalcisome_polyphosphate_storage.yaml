              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000513025 in PANTHER family PTHR22781.
            description: 'The delta subunit stands for the complex: the human beta3, mu3 and sigma3 subunits are
              in subfamilies that hold no protein from the other census organisms, so they cannot be selected eukaryote-wide.
              PTHR22781:SF12 holds a protein in every census organism except Chlamydomonas and Giardia.'
