id: MODULE:acidocalcisome_polyphosphate_storage
title: Acidocalcisome polyphosphate storage
description: Acidocalcisomes are acidic, electron-dense organelles that store polyphosphate, pyrophosphate, calcium
  and other cations. They were first described in trypanosomatids and apicomplexan parasites and are found in green
  algae, diatoms and fungi, where the polyphosphate-filled vacuole is the comparable compartment. Their defining
  content is made at the membrane. The vacuolar transporter chaperone (VTC) complex synthesises polyphosphate from
  cytosolic ATP with its catalytic subunit Vtc4 and translocates the growing chain into the lumen, and a proton
  pump, the vacuolar H+-pyrophosphatase or the V-ATPase, acidifies the lumen. In trypanosomatids the AP-3 adaptor
  complex delivers the membrane proteins of the organelle and is needed for acidocalcisomes to form. This module
  is the core of polyphosphate storage in an acidic compartment, written so that it can be evaluated in any genome.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:42126255
  title: Composition and role of the vacuolar transporter chaperone complex in polyphosphate synthesis and infectivity
    in Trypanosoma cruzi.
  statement: Synthesis and translocation of polyphosphate into the acidocalcisome lumen are catalysed by the VTC
    complex, present in trypanosomatids, apicomplexans, fungi and algae; trypanosomatids and Chlamydomonas have
    Vtc1 and Vtc4 only.
  supporting_text: Synthesis and translocation of polyP into the lumen of acidocalcisomes are catalyzed by the vacuolar
    transporter chaperone (VTC) complex (21). The VTC complex is present in trypanosomatids (21, 22), apicomplexans
    (23, 24), fungi (25), and algae (26).
- source_id: PMID:42126255
  statement: Synthesis and translocation of polyphosphate into the acidocalcisome lumen are catalysed by the VTC
    complex, present in trypanosomatids, apicomplexans, fungi and algae; trypanosomatids and Chlamydomonas have
    Vtc1 and Vtc4 only.
  supporting_text: Trypanosomatids, as also occurs with algae (Chlamydomonas spp.) (26, 32), possess orthologs to
    Vtc1 and Vtc4 but no homologs to other subunits.
- source_id: PMID:15738951
  title: Acidocalcisomes - conserved from bacteria to man.
  statement: Review of acidocalcisome ultrastructure, composition and function across trypanosomatids and other
    organisms.
  supporting_text: Acidocalcisomes have been linked with several functions, including storage of cations and phosphorus,
    polyphosphate metabolism, calcium homeostasis, maintenance of intracellular pH homeostasis and osmoregulation.
notes: 'Scope: read as a satisfiability rule, a genome needs a VTC-domain subunit of PTHR46140:SF1 (InterPro
  IPR018966; Vtc4 in most lineages) and an acidifying pump (H+-PPase or V-ATPase, ONE_OR_MORE). The rule therefore
  tests for VTC-made polyphosphate stored in an acidic compartment, which is the acidocalcisome of trypanosomatids,
  apicomplexans and algae and the polyphosphate-filled vacuole of fungi; it does not separate the two, and the module
  makes no claim that the fungal vacuole is an acidocalcisome. Lineages without VTC are outside it by construction.
  Animals store polyphosphate in acidocalcisome-like compartments (platelet dense granules, mast cell granules)
  but have no VTC, and their polyphosphate synthase is not established; land plants have no VTC4 in the PANTHER
  files checked. A genome that fails this rule may still have acidocalcisomes. Dictyostelium is one: its mass-dense
  granules hold polyphosphate and carry an H+-PPase activity (PMID:11748243), but it makes polyphosphate with a bacterial-type
  PPK1 (PMID:17940044), its two PTHR46140:SF1 proteins carry only the DUF202 membrane domain of Vtc1, and PANTHER''s
  file places no protein of its in PTHR31998. Paramecium and Phytophthora, with no Vtc4-type protein in PANTHER''s
  files, are not checked. The Eukaryota context is kept although the rule is for the VTC lineages, because those
  lineages do not form one clade (trypanosomatids, apicomplexans, green algae, diatoms and fungi), so no narrower
  NCBITaxon context fits them. Adding a PPK1 variant to the polymerase step was considered and not done: it would
  change the rule from VTC-made polyphosphate to any polyphosphate, and the papers cited here do not show that
  Dictyostelium PPK1 supplies its mass-dense granules. The VTC1 membrane subunit (DUF202, InterPro IPR003807) is not a separate step: yeast
  VTC1 is not classified in PANTHER''s yeast file, so it cannot be selected by family, and in PTHR46140:SF1 VTC1-like
  proteins sit beside Vtc4. Not yet modelled: the acidocalcisome Ca2+-ATPase (Toxoplasma TgA1, PMID:15686552), the
  polyphosphate-degrading exopolyphosphatases and pyrophosphatases, inositol pyrophosphate control of VTC through
  its SPX domains, the acidocalcisome-contractile vacuole link, and the pathway from the Golgi beyond AP-3.'
