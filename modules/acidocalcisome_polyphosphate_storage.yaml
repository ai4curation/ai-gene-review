          term:
            id: GO:0140312
            label: cargo adaptor activity
        locations:
        - preferred_term: endosome membrane
          term:
            id: GO:0010008
            label: endosome membrane
        role_description: Subunit of the AP-3 adaptor that sorts membrane proteins, among them the H+-PPase, into
          the vesicles that build acidocalcisomes.
        evidence:
        - source_id: file:genes/human/AP3D1/AP3D1-ai-review.yaml
          statement: 'Reviewed core function of human AP3D1: contributes to cargo adaptor activity.'
        - source_id: PMID:21880705
          statement: Knockdown of the AP-3 beta3 or delta subunit abolishes acidocalcisomes in T. brucei.
          supporting_text: Ablation of the β3 subunit by RNA interference (RNAi) resulted in disappearance of acidocalcisomes
            from both procyclic and bloodstream form trypanosomes
        - source_id: PMID:21880705
          statement: Knockdown of the AP-3 beta3 or delta subunit abolishes acidocalcisomes in T. brucei.
          supporting_text: Similar results were obtained by knocking down the expression of the δ subunit of AP-3.
        - source_id: PMID:18252798
          statement: Leishmania lacking AP-3 delta have acidocalcisomes without membrane proton pumps or polyphosphate.
          supporting_text: The acidocalcisomes of the L. major mutant lacked membrane-bound proton pumps (notably
            V-H+-PPase), were less acidic than normal acidocalcisomes and devoid of polyphosphate
        - source_id: file:interpro/panther/PTHR22781/PTHR22781-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      description: Optional because AP-3 is not specific to acidocalcisomes (it builds lysosome-related organelles
        in animals and the vacuole route in yeast), because the census finds no PTHR22781:SF12 protein in Chlamydomonas,
        whose acidocalcisomes are well described, and because only the delta subunit can be selected.
  connections:
