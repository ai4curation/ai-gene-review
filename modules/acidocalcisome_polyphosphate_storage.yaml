              term:
                id: GO:0033102
                label: acidocalcisome membrane
            role_description: Membrane pyrophosphatase that couples pyrophosphate hydrolysis to proton pumping into
              the acidocalcisome lumen.
            evidence:
            - source_id: PMID:12121996
              statement: Knockdown of the T. brucei H+-PPase leaves acidocalcisomes without acidity and with 90%
                less polyphosphate.
              supporting_text: Acidocalcisomes of these mutated parasites lost acidity and contained 90% less polyphosphate.
            - source_id: PMID:11579086
              statement: The polyphosphate bodies of Chlamydomonas carry H+-PPase and V-ATPase activities.
              supporting_text: Purification of the electron-dense vacuoles using iodixanol density gradients indicated
                a preferential localization of the H(+)-PPase and the V-H(+)-ATPase activities
            - source_id: file:interpro/panther/PTHR31998/PTHR31998-paint.tsv
              statement: PAINT ancestral-node rows for this step's family.
        - id: v_atpase_variant
          label: V-ATPase (see MODULE:vacuolar_atpase_acidification)
          module_ref: vacuolar_atpase_acidification
          description: The eukaryote-wide V-ATPase rule. It is met by nearly every eukaryote, so this variant alone
            does not discriminate.
