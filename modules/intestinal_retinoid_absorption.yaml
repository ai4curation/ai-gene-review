  - order: 5
    role: binding of cellular retinol and retinal by CRBP2
    node:
      id: crbp2_retinoid_binding
      label: CRBP2 (RBP2) binding of enterocyte retinol
      module_type: TRANSPORT_STEP
      description: >-
        Cellular retinol-binding protein 2 is one of the most abundant soluble proteins of jejunal enterocytes.
        It binds retinol from both the hydrolysis and the carotenoid routes (and retinal), keeps free retinoid
        low and presents retinol to the esterifying enzymes. Loss of CRBP2 in mice halves the saturable component
        of intestinal retinol uptake and lowers hepatic vitamin A stores.
