              label: all-trans-retinal
        processes:
        - preferred_term: carotene catabolic process
          term:
            id: GO:0016121
            label: carotene catabolic process
        locations:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        role_description: >-
          GO:0003834 and GO:0016121 are experimental GOA rows (IDA, PMID:11401432 and PMID:24668807; IMP,
          PMID:17951468). The cytosolic location follows the RGD record and the cited review; there is no
          experimental human cellular component row.
        evidence:
        - source_id: PMID:11401432
          statement: Recombinant human BCO1 has beta,beta-carotene-15,15'-dioxygenase activity and is expressed in intestine.
          supporting_text: Biochemical analysis of baculovirus expressed human BCDO demonstrates the predicted beta,beta-carotene-15,15'-dioxygenase
            activity.
        - source_id: PMID:21718801
          statement: Central cleavage by cytosolic BCO1 is the major route from beta-carotene to retinal.
          supporting_text: The major pathway is the central cleavage catalyzed by a cytosolic enzyme, β-C 15,15′-oxygenase
            1 (BCO1), which cleaves β-C at its central double bond (15,15′) to yield retinal
        gocam_associations:
        - model: gomodel:67086be200002705
          activity: gomodel:67086be200002705/67086be200002803
          title: Retinoid Metabolic Process 4 (Mouse)
          description: >-
            Mouse Bco1 GO:0003834 beta-carotene 15,15'-dioxygenase activity, part of retinoid metabolic process;
            not causally connected to the other activities in the model.
  - order: 4
    role: reduction of retinal to retinol
    node:
      id: retinal_reduction
      label: NADPH-dependent reduction of all-trans-retinal to all-trans-retinol (enzyme unresolved)
      module_type: REACTION
      description: >-
        Retinal made by BCO1 is reduced to retinol, which can then be bound by CRBP2 and esterified. The enzyme
        that does this in human enterocytes has not been identified. Two candidates with experimental
        NADP(H)-dependent all-trans-retinal reductase activity are modelled as variants: the cytosolic
        aldo-keto reductase AKR1B10, the small intestine reductase that RGD draws, and the ER-membrane
        short-chain dehydrogenase/reductase RDH11, which Reactome proposes. Both GO terms are written in the
        oxidative direction; the reaction is reversible and here runs toward retinol.
      evidence:
      - source_id: Reactome:R-HSA-975629
        statement: Reactome states that the enterocyte retinal reductase is not identified and proposes RDH11.
        supporting_text: Although the enzyme catalysing retinal reduction in human enterocytes is not identified,
          the best candidate is retinol dehydrogenase 11 (RDH11, RalR1).
      gocam_associations:
      - model: gomodel:67086be200002705
        activity: gomodel:67086be200002705/67086be200002846
        title: Retinoid Metabolic Process 4 (Mouse)
        description: >-
          The mouse model fills this step with Dhrs3 GO:0052650 all-trans-retinol dehydrogenase (NADP+)
          activity, downstream of Rbp2 and upstream of Lrat. Pinned to the node, not to a variant, because
          DHRS3 is not modelled as an intestinal candidate here.
      variant_sets:
      - id: retinal_reductase
        label: Candidate retinal reductase
        axis: enzyme family and compartment (cytosolic aldo-keto reductase versus ER-membrane SDR)
        selection: ONE_OR_MORE
        variants:
