knowledge_gaps:
- gap_statement: >-
    The enzyme that reduces BCO1-derived all-trans-retinal to retinol in human enterocytes is not known. AKR1B10
    (cytosolic) and RDH11 (ER membrane) reduce retinal with NADPH in vitro and are expressed in intestine, and a
    mouse GO-CAM uses DHRS3 for the step, but no loss-of-function study has measured the contribution of any of
    them to intestinal retinol formation from beta-carotene.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Decides whether carotenoid-derived retinal is reduced in the cytosol or at the ER membrane next to LRAT,
    and which gene variants could affect provitamin A conversion efficiency.
- gap_statement: >-
    How ABCA1 supports basolateral efflux of free retinol is unknown: retinol has not been shown to be an ABCA1
    substrate, and the effect could follow from ABCA1-dependent phospholipid efflux and nascent HDL formation.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Determines whether the non-chylomicron retinol exit route is a transporter step or a consequence of HDL
    biogenesis, and so whether it belongs to this module or to HDL assembly.
notes: >-
  Derived from the RGD Pathway Ontology record and diagram PW:0000141 (retinol metabolic pathway) through the
  RGD_PATHWAY_ONTOLOGY project's diagram->module route; GO mapping GO:0042572 retinol metabolic process
  (skos:closeMatch). Despite its name, the RGD record and diagram describe intestinal absorption of dietary
  vitamin A, which is why this module is named for absorption rather than for retinol metabolism. The 11 RGD-curated
  human genes (RGD source rows in the human gene-pathway file) are ABCA1, AKR1B10, ALDH1A2, BCO1, CD36, LRAT, PLB1,
  PNLIP, PNLIPRP2, RBP2 and SCARB1; the other 72 genes attached to PW:0000141 come from KEGG map00830 and SMPDB and
  cover the whole retinol and retinoic acid network (UGTs, CYP2/3 enzymes, ADHs, RDHs, ER chaperones), so they
  were not used to set the boundary. Modelled as seven required parts and two optional ones: (1) retinyl ester
  hydrolysis, a variant set of PNLIP, PNLIPRP2 and PLB1; (2) carotenoid uptake, a variant set of SCARB1 and CD36;
  (3) BCO1 central cleavage; (4) retinal reduction, a variant set of the candidate reductases AKR1B10 and RDH11;
  (5) CRBP2 binding; (6) LRAT esterification by module_ref to retinoid_visual_cycle#retinol_esterification;
  (7) chylomicron packaging by module_ref to chylomicron_assembly_secretion; (8, optional) ISX feedback; and
  (9, optional) ABCA1-dependent retinol efflux.

  Boundary decisions. (a) ALDH1A2, in the RGD gene set but not drawn, oxidises retinal to retinoic acid; that step
  is modelled in modules/retinoic_acid_metabolism.yaml and is not repeated. That module's notes record PW:0000141
  as considered but not covered and point to a separate absorption module, which this is. (b) LRAT and chylomicron
  assembly are included by module_ref, as retinoic_acid_metabolism does for LRAT, so neither the enzyme nor the
  MTTP/apoB-48/SAR1B machinery is restated. DGAT1 (acyl-CoA:retinol acyltransferase at high retinol doses; a mouse
  GO-CAM gives Dgat1 GO:0050252) is in the KEGG/SMPDB gene list only and is left as context; Lrat-null mice still put some acyl-CoA-derived retinyl ester into chylomicrons (PMID:16115871). (c) Retinal reduction:
  RGD draws AKR1B10, Reactome proposes RDH11 and states that the enterocyte enzyme is not identified, and mouse
  GO-CAM gomodel:67086be200002705 uses Dhrs3. Both AKR1B10 and RDH11 have experimental GO:0052650 and are modelled
  as candidate variants; DHRS3 is mentioned only in the node-level GO-CAM pin because no intestinal evidence for it
  was found. The unknown enzyme is recorded as a knowledge gap; an experiment that would close it is enterocyte-specific
  deletion of each candidate with stable-isotope beta-carotene tracing into lymph retinyl esters. (d) Colipase (CLPS),
  required by PNLIP and modelled as an enzyme activator in the mouse GO-CAMs, is not in the RGD set and is described
  in the PNLIP role rather than modelled as an annoton. Carboxyl ester lipase is excluded because CEL-null mice absorb
  retinyl ester normally (PMID:21718801). (e) Retinol entry into the enterocyte is by diffusion and has no protein
  participant; SCARB1 and CD36 take up carotenoids but not retinol (PMID:23427331, PMID:17644776). (f) ISX is not one
  of the RGD genes; RGD describes its feedback in prose only. ISX acts on the SCARB1 and BCO1 genes, which are
  targets of a transcription factor, not substrates, so it is a regulator: it gets its own optional part whose annoton
  carries its transcription repressor activity, linked to the uptake and cleavage nodes by NEGATIVELY_REGULATES. It is
  not added to those nodes' participants, and no metabolic process term is given to it. The inducing signal (retinoic
  acid acting through RARs) is in modules/retinoic_acid_receptor_signaling.yaml; the module validator therefore warns
  that the feedback loop is cut (isx_feedback has no incoming activating edge here), which is expected. (g) ABCA1
  retinol efflux is optional and its annoton carries ABCA1's own floppase activity, not a retinol term, because
  retinol is not shown to be an ABCA1 substrate. (h) Downstream fates are out of scope: chylomicron remnant uptake by
  liver, hepatic storage and RBP4/STRA6 delivery (in retinoic_acid_metabolism), the visual cycle, and eccentric
  cleavage by BCO2 (described by RGD, not drawn).

  Molecular functions and their support (QuickGO, checked 2026-11-10): PNLIP GO:0047376 (EXP, PMID:10769148);
  BCO1 GO:0003834 (IDA, PMID:11401432, PMID:24668807; IMP, PMID:17951468); AKR1B10 GO:0052650 (IDA, PMID:12732097;
  EXP, PMID:18087047); RDH11 GO:0052650 (core function of the completed RDH11 review); ABCA1 GO:0140326 (IDA and EXP;
  core function of the ABCA1 review). Authored without experimental human GOA support: PNLIPRP2 GO:0050253 (from the
  horse enzyme, PMID:16497549; human experimental rows are triacylglycerol, galactolipid and phospholipid lipase);
  PLB1 GO:0050253 (IBA and Reactome TAS; rat purification PMID:8117729); RBP2 GO:1904768 (Reactome TAS); ISX
  GO:0001227 and GO:0000122 (IEA by orthology; human experimental row is only sequence-specific DNA binding).
  SCARB1 and CD36 carry no function term: their facilitated lipid uptake has no matching GO molecular function, and
  their experimental terms (HDL particle receptor, fatty acid transporter, scavenger receptor) describe other roles.
  The process GO:0046867 carotenoid transport on SCARB1 and CD36 is not in their GOA; it is asserted from the mouse
  knockout and cell studies cited. Comparator check for processes: GO:0016121 is given only to BCO1, which does the
  chemistry; no carotenoid or retinoid process is given to ISX or ABCA1.

  GO-CAM: gocams/index.tsv (checked 2026-11-10) has no human production model for this pathway. The seed's best_gocam
  lead (gomodel:6197061700002397, CD36 fatty acid transport) is unrelated and is not linked. Mouse models are linked at
  activity level: Retinoid Metabolic Process 1 (gomodel:66f5faaa00001204; Pnlip, Rbp2), 3 (gomodel:67086be200002592;
  Pnlip, Rbp2) and 4 (gomodel:67086be200002705; Bco1, Rbp2, and Dhrs3 at the retinal reduction node). Their Lrat
  activities belong to the referenced visual-cycle node and their chylomicron retinoid-binding activities to the
  referenced chylomicron module, so they are not pinned here; Lpl and Ldlr act after secretion and are out of scope.
  Possible upstream issue: in gomodel:67086be200002705 the Bco1 activity is not causally connected to the retinal
  reduction or esterification activities, so the carotenoid branch is disconnected from the rest of that model.
  Gene reviews exist for LRAT, ABCA1 and RDH11; PNLIP, PNLIPRP2, PLB1, SCARB1, CD36, BCO1, AKR1B10, RBP2 and ISX have
  none. PANTHER family ids and PTNs are deliberately not asserted. Most cited publications are abstract-only in the
  cache; PMID:21718801 has full text.
