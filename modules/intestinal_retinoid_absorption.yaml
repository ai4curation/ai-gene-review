      description: >-
        Regulatory part, not a step that handles a retinoid. Retinoic acid, acting through the retinoic acid
        receptors, induces the intestine-specific homeobox transcription factor ISX, and ISX represses
        transcription of the SCARB1 and BCO1 genes. When vitamin A is plentiful, carotenoid uptake and
        cleavage are therefore turned down; in vitamin A deficiency ISX falls and both are derepressed. ISX
        acts on the target genes, not on carotenoids or retinoids, so it is modelled as a regulator of the
        uptake and cleavage nodes (NEGATIVELY_REGULATES connections) and not as a participant in them. Optional
