                  label: Phospholipase B1, membrane-associated
            function:
              preferred_term: retinyl-palmitate esterase activity
              term:
                id: GO:0050253
                label: retinyl-palmitate esterase activity
              substrates:
              - preferred_term: all-trans-retinyl palmitate
                term:
                  id: CHEBI:17616
                  label: all-trans-retinyl palmitate
              products:
              - preferred_term: all-trans-retinol
                term:
                  id: CHEBI:17336
                  label: all-trans-retinol
              - preferred_term: hexadecanoate
                term:
                  id: CHEBI:7896
                  label: hexadecanoate
            locations:
            - preferred_term: brush border membrane
              term:
                id: GO:0031526
                label: brush border membrane
            role_description: >-
              Intrinsic brush-border membrane phospholipase B of the distal small intestine. The retinyl ester
              hydrolase purified from rat brush border is very probably this enzyme. In human GOA, GO:0050253
              rests on IBA and Reactome TAS; there is no human experimental row.
            evidence:
            - source_id: PMID:8117729
              statement: The rat brush-border retinyl ester hydrolase is immunologically identical to brush-border
                phospholipase B and prefers retinyl palmitate to phosphatidylcholine.
              supporting_text: A polyclonal antiserum against rat brush border phospholipase B reacted with the purified
                retinyl ester hydrolase, strongly suggesting that this enzyme was the same as that previously purified
                and characterized as a calcium-independent brush border phospholipase B
  - order: 2
    role: carotenoid uptake across the brush border membrane
    node:
      id: carotenoid_uptake
      label: Class B scavenger receptor-facilitated carotenoid uptake (SCARB1, CD36)
      module_type: TRANSPORT_STEP
      description: >-
        Beta-carotene and other provitamin A carotenoids are taken up from mixed micelles across the apical
        brush border. Uptake is saturable and facilitated by the class B scavenger receptors SR-BI (SCARB1),
        which predominates in the duodenum and is needed for beta-carotene absorption in mice, and CD36.
        Neither receptor is specific for carotenoids: both also take up cholesterol, phospholipids and fatty
        acids, and GO has no molecular function term for this lipid-uptake activity, so the annotons carry
        the carotenoid transport process without a function term. Unconverted carotenoids pass on to
        chylomicrons; the fraction that is cleaved enters the BCO1 step.
      concepts:
      - preferred_term: carotenoid transport
        term:
          id: GO:0046867
          label: carotenoid transport
      evidence:
      - source_id: PMID:15766282
        statement: SR-BI and CD36 in the brush border membrane facilitate beta-carotene absorption, and SR-BI is
          essential for it in mice on a high-fat diet.
        supporting_text: SR-BI is essential for beta-carotene absorption, at least in mice on a high fat diet.
      variant_sets:
      - id: class_b_scavenger_receptor
        label: Class B scavenger receptor
        axis: receptor paralogue (SR-BI predominant in the duodenum; CD36 more distal)
        selection: ONE_OR_MORE
        variants:
        - id: scarb1_variant
          label: SCARB1 (SR-BI)
          module_type: TRANSPORT_STEP
          annotons:
          - id: scarb1_carotenoid_uptake
            label: SR-BI facilitated carotenoid uptake
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SCARB1 (SR-BI)
                term:
                  id: UniProtKB:Q8WTV0
                  label: Scavenger receptor class B member 1
            processes:
            - preferred_term: carotenoid transport
              term:
                id: GO:0046867
                label: carotenoid transport
            locations:
            - preferred_term: brush border membrane
              term:
                id: GO:0031526
                label: brush border membrane
            role_description: >-
              High-density lipoprotein receptor (GO:0070506, IDA) that mediates selective lipid uptake. Here it
              facilitates beta-carotene, alpha-carotene and beta-cryptoxanthin uptake into enterocytes but not
              retinol uptake. No function term is asserted (see node description). Its transcription is
              repressed by ISX (part 8).
            evidence:
            - source_id: PMID:17644776
              statement: SR-BI inhibition decreases carotenoid uptake by Caco-2 cells but does not affect retinol
                transport.
              supporting_text: Scavenger receptor class B type I (SR-BI) inhibition did not affect ROL transport but
                decreased carotenoid uptake.
            - source_id: PMID:23427331
              statement: SR-BI and CD36 take part in cellular uptake of provitamin A carotenoids in Caco-2 and HEK cells.
              supporting_text: SR-BI and CD36 are involved in cellular uptake of provitamin A carotenoids
        - id: cd36_variant
          label: CD36
          module_type: TRANSPORT_STEP
          annotons:
          - id: cd36_carotenoid_uptake
            label: CD36 facilitated carotenoid uptake
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CD36
                term:
                  id: UniProtKB:P16671
                  label: Platelet glycoprotein 4
            processes:
            - preferred_term: carotenoid transport
              term:
                id: GO:0046867
                label: carotenoid transport
            locations:
            - preferred_term: brush border membrane
              term:
                id: GO:0031526
                label: brush border membrane
            role_description: >-
              Multiligand scavenger receptor and long-chain fatty acid transporter (GO:0005324, IMP). Its role
              in carotenoid uptake rests on transfected cells and brush-border vesicles, with genetic association
              of CD36 variants with plasma provitamin A carotenoid levels, and is less established in vivo than
              that of SR-BI. No function term is asserted (see node description).
            evidence:
            - source_id: PMID:15766282
              statement: Transfected SR-BI or CD36 confers on COS-7 cells uptake of dietary lipids including beta-carotene.
              supporting_text: Both scavenger receptors facilitate the uptake of dietary lipids such as beta-carotene,
                free and esterified cholesterol, phospholipids, and fatty acids into COS-7 cells.
            - source_id: PMID:23427331
              statement: Variants in SCARB1 and CD36 associate with plasma provitamin A carotenoid concentrations.
              supporting_text: genetic variations in their encoding genes may modulate plasma concentrations of provitamin
                A carotenoids at a population level
  - order: 3
    role: central cleavage of beta-carotene to retinal
    node:
      id: beta_carotene_cleavage
      label: BCO1 central cleavage of beta-carotene to all-trans-retinal
      module_type: REACTION
      description: >-
        The cytosolic non-heme iron oxygenase BCO1 cleaves all-trans-beta-carotene at the central 15,15'
        double bond to give two molecules of all-trans-retinal, the route by which provitamin A carotenoids
        become vitamin A. The mitochondrial eccentric-cleavage enzyme BCO2, which RGD mentions but does not
        draw, is not modelled. BCO1 transcription is repressed by ISX (part 8).
      concepts:
      - preferred_term: carotene catabolic process
        term:
          id: GO:0016121
          label: carotene catabolic process
      annotons:
      - id: bco1_carotene_dioxygenase
        label: BCO1 beta-carotene 15,15'-dioxygenase
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: BCO1
            term:
              id: UniProtKB:Q9HAY6
              label: Beta,beta-carotene 15,15'-dioxygenase
        function:
