id: MODULE:intestinal_retinoid_absorption
title: Intestinal absorption of dietary vitamin A — PNLIP/PNLIPRP2/PLB1 retinyl ester hydrolysis, SCARB1/CD36 carotenoid
  uptake, BCO1 central cleavage, retinal reduction, CRBP2 binding, LRAT re-esterification, chylomicron export, ABCA1 retinol
  efflux and ISX feedback
description: >-
  Animals cannot make vitamin A and obtain it from the diet either as preformed retinyl esters of animal
  foods or as provitamin A carotenoids of plants, chiefly beta-carotene. Both forms are absorbed by the
  enterocytes of the proximal small intestine. Dietary retinyl esters must first be hydrolysed: in the
  lumen by pancreatic triglyceride lipase (PNLIP, with its cofactor colipase) and pancreatic lipase-related
  protein 2 (PNLIPRP2), and at the brush border by phospholipase B1 (PLB1). The free retinol released
  enters the enterocyte, largely by diffusion. Carotenoids are taken up across the brush border membrane
  with the help of the class B scavenger receptors SR-BI (SCARB1) and CD36. In the cytosol the
  carotenoid oxygenase BCO1 cleaves beta-carotene at its central double bond into two molecules of
  all-trans-retinal, which is reduced to all-trans-retinol by an NADPH-dependent retinal reductase whose
  identity in human enterocytes is not settled (AKR1B10 and RDH11 are candidates). Retinol from both
  sources is bound by cellular retinol-binding protein 2 (CRBP2, RBP2), an abundant intestine-specific
  carrier, and re-esterified with long-chain fatty acids, mainly by LRAT. The new retinyl esters, together
  with unconverted carotenoids, are packaged into chylomicrons and secreted into the lymph. Some free
  retinol leaves the cell across the basolateral membrane, partly by an ABCA1-dependent route, and reaches
  the portal blood. Carotenoid absorption and cleavage are under negative feedback: retinoic acid induces
  the intestine-specific homeobox transcription factor ISX, which represses transcription of the SCARB1
  and BCO1 genes. Loss of SR-BI impairs beta-carotene absorption in mice, loss of CRBP2 reduces retinol
  uptake and hepatic vitamin A stores, and loss of ISX derepresses SCARB1 and BCO1.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PW:0000141
  title: retinol metabolic pathway
  statement: >-
    The module boundary follows the RGD Pathway Ontology record and diagram for this term, which despite its
    name describe intestinal absorption of dietary vitamin A. The diagram draws dietary retinyl esters
    hydrolysed to all-trans-retinol (Pnlip, Pnliprp2, Plb1), carotenoids taken up (Scarb1, Cd36) and
    converted to retinal (Bcmo1), retinal reduced to cellular retinol (Akr1b10, NADPH to NADP+), cellular
    retinol associated with Rbp2, re-esterified (Lrat) or released as circulating retinol (Abca1), with
    passive diffusion of retinol drawn as a label. The RGD-curated human gene set is ABCA1, AKR1B10, ALDH1A2,
    BCO1, CD36, LRAT, PLB1, PNLIP, PNLIPRP2, RBP2 and SCARB1. Derived through projects/RGD_PATHWAY_ONTOLOGY
    (pathways/PW_0000141.yaml).
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000141.yaml
  title: RGD PW:0000141 record text (project snapshot)
  statement: >-
    The RGD record assigns luminal and brush-border hydrolysis of dietary retinyl esters to the two pancreatic
    lipases and phospholipase B1.
  supporting_text: The pancreatic lipases Pnlip and Pnliprp2, known as Ptl and Plrp-2, respectively and the
    phospholipase B1 located in the brush border membrane of absorptive cells, carry out the reaction.
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000141.yaml
  title: RGD PW:0000141 record text (project snapshot)
  statement: >-
    The RGD record describes the two fates of enterocyte retinol bound to RBP2: LRAT re-esterification and
    ABCA1-mediated efflux.
  supporting_text: In the cell, free retinol is in complex with Rbp2 retinol binding protein and is re-esterified
    to retinyl esters (RE) by Lrat or is released into the circulation via Abca1-mediated efflux
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000141.yaml
  title: RGD PW:0000141 record text (project snapshot)
  statement: >-
    The RGD record describes ISX feedback on Scarb1 and Bcmo1 in prose, although ISX is not drawn or listed
    among the RGD genes.
  supporting_text: Expression of Isx results in repression of Scarb1 and Bcmo1 genes, providing a negative
    feedback loop between cellular dietary vitamin A metabolites and its uptake and production.
- source_id: GO:0042572
  title: retinol metabolic process
  statement: >-
    The skos:closeMatch GO mapping of PW:0000141 (RGD page GO xref, PW definition xref and lexical match;
    projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is kept as a module-level concept because the
    pathway produces, binds and esterifies retinol, but it is broader than this module, which covers only its
    intestinal absorption arm; GO:0098856 intestinal lipid absorption is added beside it for that reason.
- source_id: PMID:21718801
  title: Mechanisms involved in the intestinal absorption of dietary vitamin A and provitamin A carotenoids.
  statement: >-
    The review that RGD cites for most of the pathway genes summarises the same sequence of steps: carotenoid
    cleavage and retinal reduction, retinyl ester hydrolysis, re-esterification by LRAT and chylomicron export.
  supporting_text: In the intestinal mucosa β-carotene is converted to retinal by β-C 15,15′ oxygenase 1 (BCO1)
    and the retinal is then reduced to retinol by a retinal reductase
- source_id: PMID:21718801
  title: Mechanisms involved in the intestinal absorption of dietary vitamin A and provitamin A carotenoids.
  statement: Re-esterified retinol leaves the enterocyte in chylomicrons with other neutral lipids and intact carotenoids.
  supporting_text: The resulting retinyl esters are incorporated with other neutral lipid esters (i.e., triacylglycerols
    and cholesteryl esters) and intact carotenoids into chylomicrons and absorbed via the lymphatics
- source_id: Reactome:R-HSA-975634
  title: Retinoid metabolism and transport
  statement: Reactome describes the same enterocyte route for dietary carotenes and retinyl esters.
  supporting_text: Transport from enterocytes to the liver happens via chylomicrons
module:
  id: intestinal_retinoid_absorption
  label: Intestinal absorption of dietary vitamin A
  module_type: METABOLIC_PATHWAY
  concepts:
  - preferred_term: retinol metabolic process
    term:
      id: GO:0042572
      label: retinol metabolic process
    description: >-
      The closeMatch of PW:0000141. Broader than this module, which models the intestinal absorption arm only.
  - preferred_term: intestinal lipid absorption
    term:
      id: GO:0098856
      label: intestinal lipid absorption
    description: >-
      Retinyl esters, retinol and carotenoids are dietary lipids absorbed alongside triacylglycerol and
      cholesterol, using shared lipases, scavenger receptors and chylomicrons.
  context:
    taxa:
    - preferred_term: Homo sapiens
      term:
        id: NCBITaxon:9606
        label: Homo sapiens
    cell_types:
    - preferred_term: enterocyte
      term:
        id: CL:0000584
        label: enterocyte
      description: >-
        The absorptive cell of the small intestine. Luminal hydrolysis acts just outside it, in the gut lumen
        and at its brush border.
  parts:
  - order: 1
    role: hydrolysis of dietary retinyl esters in the gut lumen and at the brush border
    node:
      id: retinyl_ester_hydrolysis
      label: Luminal and brush-border retinyl ester hydrolysis (PNLIP, PNLIPRP2, PLB1)
      module_type: REACTION
      description: >-
        Dietary retinyl esters, mainly retinyl palmitate, cannot be absorbed intact and are hydrolysed to
        all-trans-retinol and fatty acid before uptake. Several lipases share the work, depending on how the
        ester is presented (emulsion droplets, mixed micelles or vesicles) and on age: colipase-dependent
        pancreatic triglyceride lipase (PNLIP) is the main pancreatic retinyl ester hydrolase, pancreatic
        lipase-related protein 2 (PNLIPRP2) hydrolyses micelle-solubilised esters, and phospholipase B1 (PLB1)
        is an intrinsic brush-border enzyme. They are modelled as alternatives in one variant set. The released
        retinol is taken up largely by diffusion, which has no protein participant here.
      evidence:
      - source_id: PMID:21718801
        statement: More than one enzyme probably shares luminal retinyl ester hydrolysis, and a brush-border activity
          has been attributed to phospholipase B.
        supporting_text: Thus, more than one enzyme may be responsible for the complete hydrolysis of retinyl esters
          in the intestinal lumen.
      variant_sets:
      - id: retinyl_ester_hydrolase
        label: Retinyl ester hydrolase
        axis: enzyme and site of action (pancreatic lipases in the lumen versus brush-border phospholipase B1)
        selection: ONE_OR_MORE
        variants:
        - id: pnlip_variant
          label: PNLIP (pancreatic triglyceride lipase, with colipase)
          module_type: REACTION
          annotons:
          - id: pnlip_retinyl_ester_hydrolase
            label: PNLIP all-trans-retinyl-palmitate hydrolase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PNLIP
                term:
                  id: UniProtKB:P16233
                  label: Pancreatic triacylglycerol lipase
            function:
              preferred_term: all-trans-retinyl-palmitate hydrolase, all-trans-retinol forming activity
              term:
                id: GO:0047376
                label: all-trans-retinyl-palmitate hydrolase, all-trans-retinol forming activity
              substrates:
              - preferred_term: all-trans-retinyl palmitate
                term:
                  id: CHEBI:17616
                  label: all-trans-retinyl palmitate
              products:
              - preferred_term: all-trans-retinol
                term:
                  id: CHEBI:17336
                  label: all-trans-retinol
              - preferred_term: hexadecanoate
                term:
                  id: CHEBI:7896
                  label: hexadecanoate
            locations:
            - preferred_term: extracellular region
              term:
                id: GO:0005576
                label: extracellular region
            role_description: >-
              Secreted pancreatic lipase that acts on emulsified and micellar retinyl esters and needs colipase
              (CLPS) to do so. GO:0047376 is an experimental GOA row (EXP, PMID:10769148). Its main function
              is triacylglycerol hydrolysis (GO:0004806); retinyl esters are digested by the same enzyme as
              the other dietary neutral lipid esters.
            evidence:
            - source_id: PMID:10769148
              statement: Purified human PTL hydrolyses retinyl esters, and PTL is the major pancreatic retinyl ester
                hydrolase in rodents.
              supporting_text: Finally, purified human PTL exhibited similar enzymatic characteristics for triglyceride
                hydrolysis as well as for retinyl ester hydrolysis, indicating that RE is a substrate for PTL in vivo.
            - source_id: PMID:16497549
              statement: Pancreatic lipase hydrolysis of retinyl palmitate depends on colipase.
              supporting_text: This hydrolysis was abolished when colipase was not added to the medium.
            - source_id: Reactome:R-HSA-975593
              statement: Reactome models PNLIP:CLPS hydrolysis of retinyl palmitate in the lumen.
              supporting_text: Pancreatic lipase catalyses the hydrolysis of RE to all-trans-retinol (atROL) and fatty
                acid which are then both taken up by enterocytic cell membranes
            gocam_associations:
            - model: gomodel:66f5faaa00001204
              activity: gomodel:66f5faaa00001204/66f5faaa00001321
              title: Retinoid Metabolic Process 1 (Mouse)
              description: Mouse Pnlip GO:0050253 retinyl-palmitate esterase activity in the extracellular region.
            - model: gomodel:67086be200002592
              activity: gomodel:67086be200002592/67086be200002614
              title: Retinoid Metabolic Process 3 (Mouse)
              description: Mouse Pnlip GO:0050253 retinyl-palmitate esterase activity in the extracellular region.
        - id: pnliprp2_variant
          label: PNLIPRP2 (pancreatic lipase-related protein 2)
          module_type: REACTION
          annotons:
          - id: pnliprp2_retinyl_ester_hydrolase
            label: PNLIPRP2 retinyl-palmitate esterase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PNLIPRP2
                term:
                  id: UniProtKB:P54317
                  label: Pancreatic lipase-related protein 2
            function:
              preferred_term: retinyl-palmitate esterase activity
              term:
                id: GO:0050253
                label: retinyl-palmitate esterase activity
              substrates:
              - preferred_term: all-trans-retinyl palmitate (in mixed micelles)
                term:
                  id: CHEBI:17616
                  label: all-trans-retinyl palmitate
              products:
              - preferred_term: all-trans-retinol
                term:
                  id: CHEBI:17336
                  label: all-trans-retinol
              - preferred_term: hexadecanoate
                term:
                  id: CHEBI:7896
                  label: hexadecanoate
            locations:
            - preferred_term: extracellular region
              term:
                id: GO:0005576
                label: extracellular region
            role_description: >-
              Colipase-independent pancreatic lipase with broad specificity (triacylglycerol, galactolipid and
              phospholipid lipase activities are experimental in human GOA). Retinyl palmitate hydrolysis was shown
              with the purified horse enzyme, only for micelle-solubilised ester and at about one third of the PL
              rate, so GO:0050253 is authored here from that evidence and is not a human experimental GOA row.
              Human PNLIPRP2 is polymorphic and many people carry an inactive allele (the gene is named
              gene/pseudogene by HGNC), which limits its contribution in adults.
            evidence:
            - source_id: PMID:16497549
              statement: PLRP2 hydrolyses retinyl palmitate in mixed micelles but not in emulsions, and PLRP1 does not.
              supporting_text: PLRP2 hydrolyzes RP only when RP is solubilized in mixed micelles
        - id: plb1_variant
          label: PLB1 (brush-border phospholipase B1)
          module_type: REACTION
          annotons:
          - id: plb1_retinyl_ester_hydrolase
