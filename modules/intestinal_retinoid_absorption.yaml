              gene_product:
                preferred_term: AKR1B10
                term:
                  id: UniProtKB:O60218
                  label: Aldo-keto reductase family 1 member B10
            function:
              preferred_term: all-trans-retinol dehydrogenase (NADP+) activity
              term:
                id: GO:0052650
                label: all-trans-retinol dehydrogenase (NADP+) activity
              substrates:
              - preferred_term: all-trans-retinal
                term:
                  id: CHEBI:17898
                  label: all-trans-retinal
