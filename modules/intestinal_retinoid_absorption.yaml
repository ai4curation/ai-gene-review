        Part of the absorbed retinol leaves the enterocyte unesterified, outside lipoproteins, and reaches the
        portal circulation; this route matters most when chylomicron secretion is low (fasting, or
        abetalipoproteinemia). In Caco-2 cells the saturable component of retinol efflux is reduced by the ABCA1
