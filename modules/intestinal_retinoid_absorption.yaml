          human-cell and mouse studies below. Whether ISX binds the SCARB1 and BCO1 promoters directly is
          stated in the cited work only for BCO1 (abstract-level), so the repression may be partly indirect.
        evidence:
        - source_id: PMID:18093975
          statement: Isx-deficient mice have greatly increased intestinal Bcmo1 and SR-BI expression.
          supporting_text: beta-carotene 15,15'-monooxygenase (EC1.14.99.36 Bcmo1) and the class B type I scavenger
            receptor, which are involved in vitamin A synthesis and carotenoid uptake, respectively, were drastically
            increased in IsxLacZ/LacZ mice.
        - source_id: PMID:20061533
