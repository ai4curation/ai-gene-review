id: MODULE:wood_ljungdahl_pathway
title: Wood-Ljungdahl (reductive acetyl-CoA) pathway
description: >-
  The reductive acetyl-CoA pathway, by which acetogenic bacteria and
  methanogenic and acetoclastic archaea fix two molecules of CO2 into the two
  carbons of acetyl-CoA. It is the only carbon-fixation route that is linear
  rather than cyclic, and the only one that conserves energy as it fixes
  carbon. Two branches converge on one active site: the methyl branch reduces
  CO2 to formate and carries it through tetrahydrofolate-bound C1
  intermediates down to a methyl group, which is handed to a corrinoid
  iron-sulfur protein; the carbonyl branch reduces a second CO2 to
  enzyme-bound carbon monoxide. Acetyl-CoA synthase then condenses the methyl
  group, the carbonyl and coenzyme A. The pathway runs on low-potential
  ferredoxin, is irreversibly oxygen-sensitive at the nickel-iron-sulfur
  A-cluster, and is widely held to be among the most ancient metabolisms. It
  is a sibling of the other non-Calvin fixation routes
  (MODULE:reductive_tca_cycle, MODULE:hydroxypropionate_bicycle) and of
  MODULE:calvin_benson_bassham_cycle; unlike those, it references none of
  them, because its product is acetyl-CoA directly.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0030634
    title: carbon fixation by acetyl-CoA pathway
    statement: >-
      Defines the process this module decomposes; GO has no term labelled
      "Wood-Ljungdahl", so this is the term to use.
  - source_id: UniProtKB:P27989
    title: >-
      Carbon monoxide dehydrogenase/acetyl-CoA synthase subunit beta
      (EC 1.2.7.4, anaerobic CO dehydrogenase; Neomoorella thermoacetica)
    statement: >-
      Reviewed CODH subunit, the carbonyl branch; from the organism in which
      the pathway was characterized.
  - source_id: UniProtKB:P27988
    title: >-
      Carbon monoxide dehydrogenase/acetyl-CoA synthase subunit alpha
      (EC 2.3.1.169, CO-methylating acetyl-CoA synthase; Neomoorella
      thermoacetica)
    statement: >-
      Reviewed ACS subunit carrying the A-cluster where the three substrates
      are joined.
  - source_id: UniProtKB:Q46389
    title: >-
      5-methyltetrahydrofolate:corrinoid/iron-sulfur protein
      co-methyltransferase (AcsE; Neomoorella thermoacetica)
    statement: >-
      Reviewed methyltransferase that transfers the methyl group from the folate
      carrier to the corrinoid protein, joining the two branches.
notes: >-
  Grounded on the acetogen Moorella thermoacetica (reclassified Neomoorella
  thermoacetica, which is why the reviewed entries carry both names), whose
  core proteins are all in Swiss-Prot. Archaea run the same chemistry on
  tetrahydromethanopterin rather than tetrahydrofolate and assemble the
  activities into the ACDS/CODH complex (GO:0044672); that complex term is
  deliberately NOT asserted here, because it names the archaeal
  acetyl-CoA-decarbonylase/synthase complex and this module's exemplars are
  the bacterial CODH/ACS. A realization in an archaeon should assert it. The
  methylenetetrahydrofolate reductase step carries no representative member:
  no reviewed M. thermoacetica entry exists for it, and the unreviewed
  candidates could not be confidently assigned, so the descriptor stands
  without one rather than naming a guess. The formate dehydrogenase shown is
  the NADP-dependent, selenium- and tungsten-containing enzyme of this
  organism; other acetogens use hydrogen-dependent CO2 reductase instead, which
  is a realization difference at the same step. Energy conservation by the
  Rnf or Ech complexes and by flavin-based electron bifurcation is what makes
  the pathway exergonic overall, but it is a separate bioenergetic module and
  is named rather than modelled. The direction matters: these enzymes also run
  oxidatively in acetoclastic and syntrophic metabolism, which is the same
  module traversed backwards, not a different one. The CODH/ACS subunits are
  named here as UniProt names them, by EC number and by alpha/beta: the
  literature's AcsA (CODH) and AcsB (ACS) do not map onto UniProt's alpha and
  beta in the order one would guess, and UniProt asserts no gene name for
  either entry, so none is asserted here. The unambiguous anchors are the EC
  numbers: P27989 carries EC 1.2.7.4 (CO dehydrogenase) and P27988 carries
  EC 2.3.1.169 (acetyl-CoA synthase).
module:
  id: wood_ljungdahl_pathway
  label: Wood-Ljungdahl (reductive acetyl-CoA) pathway
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: carbon fixation by acetyl-CoA pathway
      term:
        id: GO:0030634
        label: carbon fixation by acetyl-CoA pathway
      description: >-
        Linear reduction of two CO2 to the methyl and carbonyl carbons of
        acetyl-CoA.
    - preferred_term: carbon fixation
      term:
        id: GO:0015977
        label: carbon fixation
  parts:
    - order: 1
      role: methyl branch - CO2 reduction to formate
      node:
        id: wl_formate_formation
        label: Formate dehydrogenase reduction of CO2
        module_type: REACTION
        annotons:
          - id: wl_fdh
            label: NADP-dependent formate dehydrogenase
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: NADP-dependent formate dehydrogenase (FdhAB)
                active_units:
                  - id: wl_fdh_alpha
                    label: FdhA
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: fdhA (Neomoorella thermoacetica)
                        term:
                          id: UniProtKB:P77908
                          label: NADP(+)-dependent formate dehydrogenase subunit alpha
                  - id: wl_fdh_beta
                    label: FdhB
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: fdhB (Neomoorella thermoacetica)
                        term:
                          id: UniProtKB:P77907
                          label: NADP(+)-dependent formate dehydrogenase subunit beta
            function:
              preferred_term: formate dehydrogenase (NADP+) activity
              term:
                id: GO:0047899
                label: formate dehydrogenase (NADP+) activity
              substrates:
                - preferred_term: CO2
                - preferred_term: NADPH
              products:
                - preferred_term: formate
                - preferred_term: NADP+
            role_description: >-
              The first committed reduction, run in the thermodynamically
              unfavourable direction; a selenocysteine- and
              tungsten-dependent enzyme in this organism.
    - order: 2
      role: methyl branch - folate-bound C1 reduction
      node:
        id: wl_folate_c1_branch
        label: Tetrahydrofolate C1 carrier chain down to the methyl level
        module_type: REACTION
        annotons:
          - id: wl_fhs
            label: Formate--tetrahydrofolate ligase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: formate--tetrahydrofolate ligase (Fhs)
                representative_members:
                  - preferred_term: fhs (Neomoorella thermoacetica)
                    term:
                      id: UniProtKB:P21164
                      label: Formate--tetrahydrofolate ligase
            function:
              preferred_term: formate-tetrahydrofolate ligase activity
              term:
                id: GO:0004329
                label: formate-tetrahydrofolate ligase activity
              substrates:
                - preferred_term: formate
                - preferred_term: tetrahydrofolate
                - preferred_term: ATP
              products:
                - preferred_term: 10-formyltetrahydrofolate
                - preferred_term: ADP
                - preferred_term: phosphate
            role_description: >-
              Spends one ATP to load formate onto the carrier; this is the
              pathway's main ATP cost.
          - id: wl_fold
            label: Bifunctional methylenetetrahydrofolate dehydrogenase/cyclohydrolase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bifunctional FolD
                representative_members:
                  - preferred_term: folD (Moorella thermoacetica ATCC 39073)
                    term:
                      id: UniProtKB:Q2RIB4
                      label: Bifunctional protein FolD
            function:
              preferred_term: methenyltetrahydrofolate cyclohydrolase activity
              term:
                id: GO:0004477
                label: methenyltetrahydrofolate cyclohydrolase activity
              substrates:
                - preferred_term: 10-formyltetrahydrofolate
              products:
                - preferred_term: 5,10-methenyltetrahydrofolate
            role_description: >-
              One protein carrying both the cyclohydrolase and the
              NADP-dependent dehydrogenase activity (GO:0004488), which take
              the carrier from formyl through methenyl to methylene.
          - id: wl_metf
            label: Methylenetetrahydrofolate reductase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: methylenetetrahydrofolate reductase activity
                term:
                  id: GO:0004489
                  label: methylenetetrahydrofolate reductase [NAD(P)H] activity
              description: >-
                No reviewed entry for this step exists in the exemplar
                organism, so the descriptor names no representative member
                rather than asserting an unverified one. Many acetogens use a
                ferredoxin-dependent enzyme (GO:0033738) instead.
            function:
              preferred_term: methylenetetrahydrofolate reductase [NAD(P)H] activity
              term:
                id: GO:0004489
                label: methylenetetrahydrofolate reductase [NAD(P)H] activity
              substrates:
                - preferred_term: 5,10-methylenetetrahydrofolate
              products:
                - preferred_term: 5-methyltetrahydrofolate
            role_description: >-
              The last reduction before the methyl group leaves the folate
              carrier; effectively irreversible.
    - order: 3
      role: methyl transfer to the corrinoid carrier
      node:
        id: wl_methyl_transfer
        label: AcsE transfer of the methyl group to the corrinoid iron-sulfur protein
        module_type: REACTION
        annotons:
          - id: wl_acse
            label: Methyltetrahydrofolate:corrinoid/iron-sulfur protein methyltransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: AcsE methyltransferase
                representative_members:
                  - preferred_term: acsE (Neomoorella thermoacetica)
                    term:
                      id: UniProtKB:Q46389
                      label: >-
                        5-methyltetrahydrofolate:corrinoid/iron-sulfur protein
                        co-methyltransferase
            function:
              preferred_term: methyltetrahydrofolate:corrinoid/iron-sulfur protein methyltransferase activity
              term:
                id: GO:0102036
                label: >-
                  methyltetrahydrofolate:corrinoid/iron-sulfur protein
                  methyltransferase activity
              substrates:
                - preferred_term: 5-methyltetrahydrofolate
              products:
                - preferred_term: methylated corrinoid/iron-sulfur protein
            role_description: >-
              The hand-off that joins the two branches, moving the methyl group
              onto cobalt.
          - id: wl_cfesp
            label: Corrinoid iron-sulfur protein (CFeSP)
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: corrinoid/iron-sulfur protein (AcsCD)
                active_units:
                  - id: wl_acsc
                    label: AcsC (large subunit)
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: acsC (Neomoorella thermoacetica)
                        term:
                          id: UniProtKB:Q07340
                          label: Corrinoid/iron-sulfur protein large subunit
                  - id: wl_acsd
                    label: AcsD (small subunit)
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: acsD (Neomoorella thermoacetica)
                        term:
                          id: UniProtKB:Q07341
                          label: Corrinoid/iron-sulfur protein small subunit
            function:
              preferred_term: cobalt-dependent methyl group carrier
              term:
                id: GO:0031419
                label: cobalamin binding
              description: >-
                Accepts the methyl group on its cobalamin cobalt and delivers it
                to the acetyl-CoA synthase A-cluster. A carrier rather than a
                catalyst of net chemistry, so no EC-style activity is asserted;
                the term given is the cofactor binding that makes the carrier
                role possible, which UniProtKB:Q07340 carries by IDA. It is
                asserted rather than omitted because the atom would otherwise
                ground on nothing: the route extractor does not read accessions
                out of protein_complex.active_units, so a complex participant
                with no function term satisfies no oracle and silently makes
                every route through this pathway dead (Atom.is_grounded in
                src/ai_gene_review/module_logic.py).
            role_description: >-
              The shuttle between the folate and the nickel chemistry; its
              cobalt must be kept reduced, and oxidative inactivation here is a
              known failure mode.
    - order: 4
      role: carbonyl branch - CO2 reduction to enzyme-bound CO
      node:
        id: wl_carbonyl_branch
        label: CO dehydrogenase reduction of CO2 to carbon monoxide
        module_type: REACTION
        annotons:
          - id: wl_codh
            label: Anaerobic carbon-monoxide dehydrogenase (CODH subunit)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Ni-Fe anaerobic CO dehydrogenase (CODH)
                representative_members:
                  - preferred_term: >-
                      P27989 (CODH/ACS subunit beta, EC 1.2.7.4, Neomoorella
                      thermoacetica; no gene symbol in UniProt)
                    term:
                      id: UniProtKB:P27989
                      label: >-
                        Carbon monoxide dehydrogenase/acetyl-CoA synthase
                        subunit beta
            function:
              preferred_term: anaerobic carbon-monoxide dehydrogenase activity
              term:
                id: GO:0043885
                label: anaerobic carbon-monoxide dehydrogenase activity
              substrates:
                - preferred_term: CO2
                - preferred_term: reduced ferredoxin
              products:
                - preferred_term: CO
                - preferred_term: oxidized ferredoxin
            role_description: >-
              Reduces the second CO2 at the C-cluster using low-potential
              ferredoxin. The CO is not released but travels to the A-cluster
              through an internal hydrophobic channel, which is why the two
              activities sit in one complex.
    - order: 5
      role: acetyl-CoA assembly
      node:
        id: wl_acetyl_coa_synthesis
        label: Acetyl-CoA synthase condensation at the A-cluster
        module_type: REACTION
        annotons:
          - id: wl_acs
            label: CO-methylating acetyl-CoA synthase (ACS subunit)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: acetyl-CoA synthase (ACS)
                representative_members:
                  - preferred_term: >-
                      P27988 (CODH/ACS subunit alpha, EC 2.3.1.169, Neomoorella
                      thermoacetica; no gene symbol in UniProt)
                    term:
                      id: UniProtKB:P27988
                      label: >-
                        Carbon monoxide dehydrogenase/acetyl-CoA synthase
                        subunit alpha
            function:
              preferred_term: CO-methylating acetyl-CoA synthase activity
              term:
                id: GO:0043884
                label: CO-methylating acetyl-CoA synthase activity
              substrates:
                - preferred_term: CO
                - preferred_term: methylated corrinoid/iron-sulfur protein
                - preferred_term: coenzyme A
              products:
                - preferred_term: acetyl-CoA
            role_description: >-
              Forms a carbon-carbon bond at a nickel-iron-sulfur A-cluster,
              joining the two branches' products and thioesterifying the result.
              The step that makes the pathway a fixation route rather than a
              C1 shuffle.
  connections:
    - source: wl_formate_formation
      target: wl_folate_c1_branch
      connection_type: PROVIDES_INPUT_FOR
      description: Formate is loaded onto tetrahydrofolate.
    - source: wl_folate_c1_branch
      target: wl_methyl_transfer
      connection_type: PRECEDES
      description: >-
        The methyl group reaches the end of the folate carrier chain and is
        handed to the corrinoid protein.
    - source: wl_methyl_transfer
      target: wl_acetyl_coa_synthesis
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The methylated corrinoid protein delivers the methyl group to the
        A-cluster.
    - source: wl_carbonyl_branch
      target: wl_acetyl_coa_synthesis
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        CO travels from the C-cluster to the A-cluster through the internal
        channel rather than through the bulk solvent.
