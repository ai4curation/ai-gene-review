id: MODULE:yrhb_chaperone_like_refolding
title: YrhB ATP-independent chaperone-like refolding
description: >-
  A draft single-protein module for the small E. coli YrhB protein, which has
  been reported to prevent heat-induced PurK aggregation and support refolding
  of a model client without ATP. The purified K-12 and BL21(DE3) proteins are
  identical, but the physiological client set and whether this is a native
  chaperone function rather than an overexpression-associated moonlighting
  behavior remain unresolved.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0044183
    title: protein folding chaperone
    statement: The closest current GO molecular-function term for YrhB's chaperone-like activity.
  - source_id: GO:0042026
    title: protein refolding
    statement: Defines the refolding process supported by YrhB in vitro.
  - source_id: file:genes/ECOLI/yrhB/yrhB-ai-review.yaml
    title: ECOLI yrhB gene review
    statement: >-
      The completed E. coli yrhB review grounds YrhB as an ATP-independent
      chaperone-like protein and rejects unsupported Imm35 immunity assertions.
  - source_id: PMID:22569261
    title: >-
      YrhB is a highly stable small protein with unique chaperone-like activity
      in Escherichia coli BL21(DE3).
    statement: >-
      Reports heat-induced aggregation prevention, refolding assistance, and
      ATP independence for YrhB.
notes: >-
  No adjacent cognate toxin gene exists in E. coli K-12, so this module does
  not include the predicted Imm35 peptidase-inhibitor/polymorphic-toxin
  immunity activity.
