id: MODULE:udp_glucose_and_udp_galactose_biosynthesis
title: UDP-glucose and UDP-galactose biosynthesis
description: >-
  Bacterial module for de novo production of UDP-glucose from the central
  glucose 6-phosphate pool and its reversible interconversion with
  UDP-galactose. Three reactions make up the module: phosphoglucomutase
  isomerizes glucose 6-phosphate to alpha-D-glucose 1-phosphate,
  UTP--glucose-1-phosphate uridylyltransferase (GalU) activates glucose
  1-phosphate as UDP-glucose, and NAD-dependent UDP-glucose 4-epimerase (GalE)
  interconverts UDP-glucose and UDP-galactose. The phosphoglucomutase step is
  supplied by non-homologous or distantly related enzyme families that differ
  between lineages: a PGM1-type phosphoglucomutase (Escherichia coli Pgm), a
  PGM2-type phosphoglucomutase (Bacillus subtilis PgcA), or a bifunctional
  phosphomannomutase/phosphoglucomutase (Pseudomonas aeruginosa AlgC). The
  activated hexoses feed lipopolysaccharide core, teichoic acid and glycolipid
  anchors, capsular and exopolysaccharides, trehalose and other glycoconjugates;
  those consuming pathways, and galactose uptake and catabolism, are outside
  this module.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:7961613
    title: >-
      Overproduction and characterization of recombinant UDP-glucose
      pyrophosphorylase from Escherichia coli K-12.
    statement: >-
      Recombinant E. coli GalU purified to homogeneity catalyzes Mg2+-dependent
      synthesis and pyrophosphorolysis of UDP-glucose, and the cloned gene
      complements a galU mutant; the prokaryotic enzyme is structurally
      unrelated to eukaryotic UDP-glucose pyrophosphorylases.
  - source_id: PMID:14216423
    statement: >-
      Purified E. coli phosphoglucomutase interconverts glucose 1-phosphate and
      glucose 6-phosphate (Mg2+-dependent; UniProt P36938 catalytic activity
      evidence).
  - source_id: PMID:14235524
    statement: >-
      E. coli UDP-galactose 4-epimerase interconverts UDP-galactose and
      UDP-glucose and is specific for these two nucleotide sugars (UniProt
      P09147 function evidence).
  - source_id: PMID:8050998
    statement: >-
      P. aeruginosa AlgC is a bifunctional enzyme with both phosphomannomutase
      and phosphoglucomutase activities (UniProt P26276 catalytic activity
      evidence).
  - source_id: PMID:15640167
    statement: >-
      B. subtilis PgcA interconverts glucose 6-phosphate and glucose
      1-phosphate as the first step of glucolipid and UDP-glucose-dependent
      envelope polymer synthesis (UniProt P18159 function evidence).
  - source_id: file:PSEPK/galU/galU-uniprot.txt
    title: UniProtKB entry for Pseudomonas putida KT2440 galU
    statement: >-
      P. putida KT2440 Q88GA4 carries the UDPGP type 2 (GalU) family
      signature and the RHEA:19889 reaction, and is retained as a Pseudomonas
      exemplar alongside the E. coli enzymes.
notes: >-
  Taxonomic scope. The three reactions are conserved across Bacteria, so the
  module is written species-neutrally with E. coli K-12 (Pgm, GalU, GalE),
  B. subtilis 168 (PgcA) and P. aeruginosa PAO1 (AlgC) as experimentally
  characterized exemplars and P. putida KT2440 (Pgm/PP_3578, AlgC/PP_5288,
  GalU/PP_3821, GalE/PP_3129) kept as a homology-grounded exemplar. The module
  is scoped to Bacteria rather than all life because the UDP-glucose
  pyrophosphorylase step is family-specific: bacterial GalU belongs to the
  prokaryotic UDPGP type 2 family (PANTHER PTHR43197), whereas eukaryotic
  UGP1/UGP2 belong to a structurally distinct UDPGP type 1 family; the
  eukaryotic route is better modelled separately.

  Phosphoglucomutase family choice. E. coli Pgm (PTHR22573:SF57) and B. subtilis PgcA / P. putida Pgm
  (PTHR45745:SF1) are both dedicated phosphoglucomutases but sit in different
  PANTHER families of the alpha-D-phosphohexomutase superfamily, so they are
  modelled as separate variants rather than one family descriptor. The
  bifunctional AlgC-type route (PTHR43771:SF2) can coexist with a dedicated
  Pgm; in P. aeruginosa AlgC supplies glucose 1-phosphate for LPS core
  synthesis, while in P. putida the in-vivo flux split between Pgm and AlgC has
  not been measured. P. putida CpsG/PP_1777 is excluded because current
  evidence supports phosphomannomutase rather than phosphoglucomutase activity.

  GalE grounding. The epimerase is grounded on two PTHR43725 subfamilies:
  E. coli GalE is in SF47 and P. putida GalE in SF53. SF53's PANTHER name
  (UDP-ARABINOSE 4-EPIMERASE 1) does not describe the bacterial members, which
  are UDP-glucose 4-epimerases; a single-subfamily grounding would exclude one
  exemplar, and the whole-family id would also cover the plant UDP-arabinose
  4-epimerase subfamilies (SF33, SF38) to which the activity does not apply.

  Out of scope. Glucose kinase, aldose mutarotation, galactose uptake and Leloir
  catabolism (modules/galactose_leloir_pathway.yaml), glycogen synthesis, and
  downstream polymer assembly are separate modules.
module:
  id: udp_glucose_and_udp_galactose_biosynthesis
  label: UDP-glucose and UDP-galactose biosynthesis
  module_type: METABOLIC_PATHWAY
  description: >-
    Glucose 6-phosphate to glucose 1-phosphate to UDP-glucose, with reversible
    epimerization of UDP-glucose to UDP-galactose.
  concepts:
    - preferred_term: UDP-alpha-D-glucose biosynthetic process
      term:
        id: GO:0120530
        label: UDP-alpha-D-glucose biosynthetic process
      description: De novo formation of UDP-alpha-D-glucose from glucose 6-phosphate.
    - preferred_term: UDP-galactose biosynthetic process
      term:
        id: GO:0052574
        label: UDP-galactose biosynthetic process
      description: >-
        Formation of UDP-galactose by epimerization of UDP-glucose; this module
        does not imply a complete galactose catabolic (Leloir) route.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: glucose 1-phosphate formation
      node:
        id: phosphoglucomutase_step
        label: Phosphoglucomutase reaction
        module_type: REACTION
        description: >-
          Alternative enzyme solutions supply this reaction. A dedicated
          PGM1-type or PGM2-type phosphoglucomutase, or a bifunctional
          AlgC-type phosphomannomutase/phosphoglucomutase, may provide glucose
          1-phosphate; an organism needs at least one and may carry several.
        variant_sets:
          - id: glucose_1_phosphate_enzyme_route
            label: Glucose 1-phosphate enzyme route
            axis: phosphoglucomutase enzyme family
            selection: ONE_OR_MORE
            variants:
              - id: pgm1_type_pgm_variant
                label: Dedicated PGM1-type phosphoglucomutase route
                module_type: REACTION
                annotons:
                  - id: pgm1_type_phosphoglucomutase
                    label: "Pgm (PGM1-type): phosphoglucomutase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: bacterial PGM1-type phosphoglucomutase subfamily
                        term:
                          id: PANTHER:PTHR22573:SF57
                          label: PHOSPHOGLUCOMUTASE
                        representative_members:
                          - preferred_term: pgm (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P36938
                              label: Phosphoglucomutase
                            description: E. coli K-12 pgm/b0688.
                        ancestral_nodes:
                          - preferred_term: PAINT phosphoglucomutase node PTN000501426
                            term:
                              id: PANTHER:PTN000501426
                              label: PTN000501426
                            description: >-
                              PAINT IBD node for phosphoglucomutase activity
                              placed at the PTHR22573 root, seeded by bacterial,
                              fungal, animal and plant enzymes including E. coli
                              Pgm.
                            evidence:
                              - source_id: GO_REF:0000033
                                title: Phylogenetic annotation using PAINT
                                statement: IBD propagation from PAINT node PTN000501426.
                              - source_id: file:interpro/panther/PTHR22573/PTHR22573-review.yaml
                                statement: >-
                                  The PTHR22573 family review assesses the
                                  PTN000501426 GO:0004614 IBD as SOUND, with
                                  E. coli Pgm P36938 among the seeds.
                    function:
                      preferred_term: phosphoglucomutase activity
                      term:
                        id: GO:0004614
                        label: phosphoglucomutase activity
                      substrates:
                        - preferred_term: alpha-D-glucose 6-phosphate
                      products:
                        - preferred_term: alpha-D-glucose 1-phosphate
                      cofactors:
                        - preferred_term: Mg2+
