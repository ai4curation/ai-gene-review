                ancestral_nodes:
                  - preferred_term: PAINT GalU node PTN000501189
                    term:
                      id: PANTHER:PTN000501189
                      label: PTN000501189
                    description: >-
                      PAINT IBD node for UTP:glucose-1-phosphate
                      uridylyltransferase activity, seeded by E. coli GalU and
                      GalF and B. subtilis GtaB and paralogs.
                    evidence:
                      - source_id: GO_REF:0000033
                        title: Phylogenetic annotation using PAINT
                        statement: IBD propagation from PAINT node PTN000501189.
                      - source_id: file:interpro/panther/PTHR43197/PTHR43197-paint.tsv
                        statement: >-
                          PTN000501189 carries the GO:0003983 IBD with E. coli
                          GalU P0AEP3 among its seeds.
            function:
              preferred_term: UTP:glucose-1-phosphate uridylyltransferase activity
              term:
                id: GO:0003983
                label: UTP:glucose-1-phosphate uridylyltransferase activity
              substrates:
                - preferred_term: UTP
                - preferred_term: alpha-D-glucose 1-phosphate
              products:
                - preferred_term: UDP-alpha-D-glucose
                - preferred_term: diphosphate
              cofactors:
