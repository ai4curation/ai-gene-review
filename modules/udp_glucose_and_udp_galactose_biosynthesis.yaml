id: MODULE:udp_glucose_and_udp_galactose_biosynthesis
title: UDP-glucose and UDP-galactose biosynthesis
description: >-
  Species-neutral bacterial module for production of UDP-glucose from
  glucose 6-phosphate and its reversible interconversion with UDP-galactose.
  The module contains phosphoglucomutase, UTP--glucose-1-phosphate
  uridylyltransferase, and UDP-glucose 4-epimerase reactions. It supplies
  activated hexoses to multiple downstream glycoconjugate and storage-polymer
  pathways; those consuming pathways are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: file:PSEPK/pgm/pgm-uniprot.txt
    title: UniProtKB entry for PSEPK pgm
    statement: Q88GY7 is annotated as phosphoglucomutase EC 5.4.2.2.
  - source_id: file:PSEPK/algC/algC-uniprot.txt
    title: UniProtKB entry for PSEPK algC
    statement: >-
      Q88C93 is a bifunctional phosphomannomutase/phosphoglucomutase with EC
      5.4.2.8 and EC 5.4.2.2.
  - source_id: file:PSEPK/galU/galU-uniprot.txt
    title: UniProtKB entry for PSEPK galU
    statement: >-
      Q88GA4 is annotated as UTP--glucose-1-phosphate uridylyltransferase EC
      2.7.7.9.
  - source_id: file:PSEPK/galE/galE-uniprot.txt
    title: UniProtKB entry for PSEPK galE
    statement: Q88I72 is annotated as UDP-glucose 4-epimerase EC 5.1.3.2.
notes: >-
  PSEPK Pgm/PP_3578 is the dedicated primary candidate for glucose
  1-phosphate formation, while bifunctional AlgC/PP_5288 provides a plausible
  alternative or backup; their in-vivo flux split has not been measured.
  CpsG/PP_1777 is excluded because current evidence supports
  phosphomannomutase rather than phosphoglucomutase activity. Glucose kinase,
  aldose mutarotation, galactose uptake/catabolism, and downstream polymer
  assembly are separate modules.
module:
