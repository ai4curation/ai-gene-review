id: MODULE:dmel_chitin_metabolism
title: Chitin biosynthesis and catabolism in Drosophila melanogaster
description: >-
  Chitin, a beta-1,4-linked polymer of N-acetylglucosamine, is the fibrous scaffold of the
  insect cuticle, tracheal linings and the peritrophic matrix of the midgut. It is synthesized
  at the plasma membrane by chitin synthases: Krotzkopf verkehrt (kkv) makes chitin of the
  epidermal cuticle and trachea, and Chs2 is the second chitin synthase, expressed in the
  gut. During molting and tissue remodelling, chitin is broken down by family 18 chitinases
  (Cht genes), which cleave the polymer into oligosaccharides, and by beta-N-acetylhexosaminidases
  (Hexo1, Hexo2), which release N-acetylglucosamine from the non-reducing ends.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002045
  title: 'FlyBase gene group CHIYBI: Chitin biosynthesis'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as chitin biosynthesis (CHIYBI);
    this module models that group.
- source_id: FB:FBgg0002046
  title: 'FlyBase gene group CHITCA: Chitin catabolism'
  statement: >-
    FlyBase release FB2026_03 groups 12 D. melanogaster genes as chitin catabolism (CHITCA);
    this module models that group.
- source_id: GO:0006030
  title: chitin metabolic process
  statement: >-
    GO term grounding the module as chitin metabolic process.
notes: >-
  Boundary. The module joins the FlyBase chitin biosynthesis (CHIYBI) and chitin catabolism
  (CHITCA) groups. UDP-N-acetylglucosamine synthesis, chitin deacetylases and chitin-binding
  cuticle proteins are not parts. Chitinase activity is not assigned to individual Cht genes
  because activity has not been shown for most of them. The fused lobes hexosaminidase is
  not a FlyBase member of the group and is not included. FlyBase groups realized by this module:
  CHIYBI (FBgg0002045), CHITCA (FBgg0002046). Participants were generated from the FlyBase
  gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_chitin_metabolism.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
