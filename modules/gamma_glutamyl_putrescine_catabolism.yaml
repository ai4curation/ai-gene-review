id: MODULE:gamma_glutamyl_putrescine_catabolism
title: Gamma-glutamyl putrescine catabolism to 4-aminobutanoate
description: >-
  A four-reaction bacterial route in which putrescine is activated by
  ATP-dependent gamma-glutamylation, oxidized to a gamma-glutamyl aminoaldehyde,
  oxidized again to gamma-glutamyl-4-aminobutanoate, and hydrolyzed to release
  4-aminobutanoate (GABA) and glutamate. The gamma-glutamyl group is carried
  through both oxidations and released as glutamate. The route was defined
  genetically and biochemically in Escherichia coli (the Puu pathway) and is
  conserved, with expanded paralog sets, in Pseudomonas. Putrescine supply and
  import, the parallel non-glutamylated transaminase route, and the downstream
  GABA shunt are separate modules.
status: COMPLETE
scope: CONCRETE
evidence:
