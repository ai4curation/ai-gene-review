id: MODULE:gamma_glutamyl_putrescine_catabolism
title: Gamma-glutamyl putrescine catabolism to 4-aminobutanoate
description: >-
  A four-reaction route in which putrescine is activated by ATP-dependent
  gamma-glutamylation, oxidized to a gamma-glutamyl aminoaldehyde, oxidized
  again to gamma-glutamyl-4-aminobutanoate, and hydrolyzed to release
  4-aminobutanoate (GABA) and glutamate. Putrescine supply and import, the
  parallel non-glutamylated transaminase route, and the downstream GABA shunt
  are separate modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009447
    title: putrescine catabolic process
    statement: Defines the substrate-specific catabolic process represented here.
  - source_id: RHEA:13633
    title: glutamate-putrescine ligase reaction
    statement: Defines ATP-dependent gamma-glutamylputrescine formation.
  - source_id: RHEA:28414
    title: gamma-glutamylputrescine oxidoreductase reaction
    statement: Defines oxidative formation of the gamma-glutamyl aminoaldehyde.
  - source_id: RHEA:28410
    title: NADP-dependent PuuC reaction
    statement: Defines one experimentally supported cofactor variant of gamma-glutamyl aminoaldehyde oxidation.
  - source_id: RHEA:42340
    title: NAD-dependent PuuC reaction
    statement: Defines the alternative experimentally supported cofactor variant of gamma-glutamyl aminoaldehyde oxidation.
  - source_id: RHEA:19737
    title: gamma-glutamyl-gamma-aminobutyrate hydrolase reaction
    statement: Defines hydrolytic release of GABA and glutamate.
  - source_id: PANTHER:PTN000230196
    title: PAINT bacterial PuuD ancestral node
    statement: >-
      The local PTHR43235 PAINT table assigns GO:0033969 and GO:0006598 to
      PTN000230196 using experimentally characterized E. coli PuuD P76038 as a seed.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__gamma-glutamyl-putrescine-catabolism__ppu00330-deep-research-openscientist.md
    title: OpenScientist PSEPK gamma-glutamyl putrescine catabolism synthesis
    statement: >-
      Species-aware retrieval identifies strong KT2440 PuuA, PuuB, and PuuD
      implementations and PP_2589 as the leading but incompletely resolved PuuC candidate.
notes: >-
  KT2440 PuuA candidates are Q88KW1 and Q88C84, with additional
  glutamylpolyamine synthetases nearby. Q88K44 is the exact PuuB-subfamily
  candidate. Q88JR0 carries a PuuC/GABA-aldehyde-dehydrogenase CDD assignment
  and the relevant KEGG orthology, but its UniProt function remains generic;
  this step is therefore candidate-uncertain in the target organism. PuuD
  candidates Q88C85, Q88KW0, and Q88GW9 carry exact EC 3.5.1.94 assignments.
