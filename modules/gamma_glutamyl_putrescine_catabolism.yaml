    statement: >-
      The local PTHR43235 PAINT table assigns GO:0033969 and GO:0006598 to
      PTN000230196 using experimentally characterized E. coli PuuD P76038 as a seed.
  - source_id: PMID:18495664
    title: gamma-Glutamylputrescine synthetase in the putrescine utilization pathway of Escherichia coli K-12.
    statement: Biochemically establishes the PuuA reaction and its distinction from glutamine synthetase activity.
  - source_id: PMID:15590624
    title: A novel putrescine utilization pathway involves gamma-glutamylated intermediates of Escherichia coli K-12.
    statement: Defines the sequential PuuA-PuuB-PuuC-PuuD chemistry represented by the module.
  - source_id: PMID:22636776
    title: Pathway and enzyme redundancy in putrescine catabolism in Escherichia coli.
    statement: >-
      Shows the gamma-glutamylated and transaminase routes are partly redundant in E. coli and that PuuC
      oxidizes all aldehydes of putrescine catabolism.
  - source_id: PMID:16499623
    title: Gamma-glutamyl-gamma-aminobutyrate hydrolase in the putrescine utilization pathway of Escherichia coli K-12.
    statement: Characterizes PuuD (catalytic Cys-114) and shows puuD mutants accumulate gamma-Glu-GABA.
  - source_id: PMID:34605433
    title: Structure and mechanism of the γ-glutamyl-γ-aminobutyrate hydrolase SpuA from Pseudomonas aeruginosa.
    statement: Shows P. aeruginosa SpuA is a class I GATase-fold hydrolase that prefers gamma-Glu-GABA.
  - source_id: PMID:21622750
    title: Functional characterization of seven γ-Glutamylpolyamine synthetase genes and the bauRABCD locus for polyamine and β-Alanine utilization in Pseudomonas aeruginosa PAO1.
    statement: Shows the PuuABCD-homologous gamma-glutamylation pathway is conserved and paralog-expanded in Pseudomonas.
  - source_id: PMID:12081945
    title: Functional analysis and regulation of the divergent spuABCDEFGH-spuI operons for polyamine uptake and utilization in Pseudomonas aeruginosa PAO1.
    statement: Provides comparative Pseudomonas operon and SpuC transaminase evidence used to set the module boundary.
  - source_id: PMID:18192388
    title: Transcriptome analysis of agmatine and putrescine catabolism in Pseudomonas aeruginosa PAO1.
    statement: Establishes the SpuC transaminase route as major and gamma-glutamylation as an alternative Pseudomonas route.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__gamma-glutamyl-putrescine-catabolism__ppu00330-deep-research-openscientist.md
    title: OpenScientist PSEPK gamma-glutamyl putrescine catabolism synthesis
    statement: >-
      Species-aware retrieval identifies strong KT2440 PuuA, PuuB, and PuuD
      implementations and PP_2589 as the leading but incompletely resolved PuuC candidate.
notes: >-
  Exemplar choice: E. coli K-12 PuuA, PuuB, PuuC and PuuD carry the
  experimental evidence for every step, and P. aeruginosa SpuA adds a
  structurally and biochemically characterized PuuD-step enzyme. Pseudomonas
  putida KT2440 is kept as a paralog-rich exemplar: PuuA candidates Q88KW1 and
  Q88C84 (with further glutamylpolyamine synthetases nearby), the exact
  PuuB-subfamily member Q88K44, the leading PuuC candidate Q88JR0 (an
  ALDH_GABALDH-PuuC conserved-domain assignment but a generic UniProt
  function), and PuuD-family hydrolases Q88C85, Q88KW0 and Q88GW9; none of the
  KT2440 proteins has been assayed. In Pseudomonas the SpuC transaminase route
  is the major putrescine route, so the module does not imply dominant flux.
  Intrinsic validation caveats: (1) GO has no substrate-specific molecular
  function for the PuuB oxidase or the PuuC aldehyde dehydrogenase reactions,
  so the leaf annotons use the verified parents GO:0016641 and GO:0004030 and
  the exact chemistry is carried by Rhea evidence; new terms are proposed in
  the E. coli puuB and puuC gene reviews. (2) PTHR43785 and its SF12 subfamily
  mix PuuA-like ligases with bona fide glutamine synthetases, and PTHR43235 SF1
  mixes PuuD-like gamma-Glu-GABA hydrolases with other gamma-glutamyl
  hydrolases, so the family selectors are used together with required_function
  and characterized representatives, and activity is not transferred from
  family membership alone (see the PTHR43785 and PTHR43235 family reviews). (3)
  PTHR11699 is the whole ALDH superfamily; its PAINT node PTN000192666 supports
  only generic NAD+-dependent aldehyde dehydrogenase activity. These family
  reviews therefore leave GO:0034024 (PTHR43785), GO:0033969 (PTHR43235),
  GO:0004029 (PTHR11699) and GO:0016641 (PTHR13847, whose O2-dependent
  CH-NH2 oxidases span the PuuB and glycine oxidase subfamilies) UNRESOLVED at
  family scope, which the module validator reports as the four remaining,
  intrinsic family-function conformance warnings.
