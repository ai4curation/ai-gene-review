id: MODULE:il22_signaling
title: Interleukin-22 signaling pathway module
description: >-
  Secreted Interleukin-22 (IL22), produced by Th17/Th22 cells, gamma-delta T
  cells, and group 3 innate lymphoid cells (ILC3), binds with high affinity to
  the private epithelial receptor subunit IL22RA1 (IL-22R1) and recruits the
  shared class II cytokine receptor subunit IL10RB (IL-10R2) into a ternary
  signaling complex on barrier epithelial cells, keratinocytes, and hepatocytes.
  Receptor assembly activates IL22RA1-associated JAK1 and IL10RB-associated
  TYK2, which phosphorylate IL22RA1 cytoplasmic tyrosines (Y251, Y301) to
  recruit and phosphorylate STAT3, driving antimicrobial peptide expression,
  acute-phase protein synthesis, and epithelial barrier proliferation and
  repair. Extracellular IL22 bioactivity is antagonized by the secreted soluble
  decoy receptor IL22RA2 (IL-22BP).
status: DRAFT
evidence:
  - source_id: GO:0140865
    title: interleukin-22-mediated signaling pathway
    statement: >-
      Grounded in the GO biological process term for interleukin-22-mediated
      signaling pathway, defined as the series of molecular signals initiated by
      interleukin-22 binding to its heterodimeric cell-surface receptor complex
      (IL22RA1/IL10RB).
  - source_id: PMID:10875937
    title: Interleukin (IL)-22, a novel human cytokine that signals through the interferon receptor-related proteins CRF2-4 and IL-22R.
    statement: >-
      Identified human IL22 and demonstrated that it signals through the
      heterodimeric IL22RA1 (IL-22R) and IL10RB (CRF2-4) receptor complex to
      activate STAT3 (and STAT1/STAT5).
  - source_id: PMID:10954742
    title: 'Human interleukin-10-related T cell-derived inducible factor: molecular cloning and functional characterization as an hepatocyte-stimulating factor.'
    statement: >-
      Cloned human IL22 (IL-TIF) and demonstrated STAT3 activation and induction
      of acute-phase reactants in human hepatoma cells.
  - source_id: PMID:11481447
    title: A soluble class II cytokine receptor, IL-22RA2, is a naturally occurring IL-22 antagonist.
    statement: >-
      Identified IL22RA2 (IL-22BP) as a secreted class II cytokine receptor
      homolog that binds IL22 in the extracellular space and blocks IL22 binding
      to cell-surface IL22RA1/IL10RB.
  - source_id: PMID:18675809
    title: Crystal structure of the IL-22/IL-22R1 complex and its implications for the IL-22 signaling mechanism.
    statement: >-
      Crystal structure of the binary human IL22:IL22RA1 complex revealing the
      high-affinity site 1 interface and the composite site 2 surface created
      for subsequent IL10RB recruitment.
  - source_id: PMID:20462497
    title: Structure and mechanism of receptor sharing by the IL-10R2 common chain.
    statement: >-
      Defines the structural basis by which the binary IL22:IL22RA1 complex
      recruits the shared low-affinity IL10RB (IL-10R2) chain to assemble the
      active ternary signaling complex.
  - source_id: Reactome:R-HSA-448480
    title: IL22 binds IL22RA1:JAK1 receptor complex
    statement: >-
      Reactome reaction documenting high-affinity binding of secreted IL22 to
      the IL22RA1:JAK1 complex at the plasma membrane.
  - source_id: Reactome:R-HSA-448741
    title: IL22RA2 binds IL22
    statement: >-
      Reactome reaction documenting extracellular sequestration of IL22 by the
      soluble decoy receptor IL22RA2 (IL-22BP).
  - source_id: Reactome:R-HSA-8854645
    title: IL22:IL22RA1:JAK1 binds IL10RB:TYK2
    statement: >-
      Reactome reaction documenting recruitment of IL10RB:TYK2 to the binary
      IL22:IL22RA1:JAK1 complex.
  - source_id: Reactome:R-HSA-8987042
    title: IL22:IL22RA1:JAK1:IL10RB:TYK2 phosphorylates JAK1,TYK2
    statement: >-
      Reactome reaction documenting reciprocal trans-phosphorylation of JAK1 and
      TYK2 in the assembled IL22 receptor complex.
  - source_id: Reactome:R-HSA-8987070
    title: IL22:p-Y251,p-Y301-IL22RA1:p-JAK1:IL10RB:p-TYK2:STAT3 phosphorylates STAT3
    statement: >-
      Reactome reaction documenting JAK1/TYK2-mediated phosphorylation of STAT3
      docked at phosphorylated IL22RA1 Y251/Y301.
  - source_id: file:genes/human/IL22/IL22-ai-review.yaml
    title: Human IL22 gene review
    statement: >-
      Curates human IL22 (UniProtKB:Q9GZX6) with GO:0005125 (cytokine activity)
      and GO:0140865 (interleukin-22-mediated signaling pathway), upgrading
      GO:0045518 (interleukin-22 receptor binding) and GO:0007165 (signal
      transduction).
  - source_id: file:genes/human/IL22RA1/IL22RA1-ai-review.yaml
    title: Human IL22RA1 gene review
    statement: >-
      Curates human IL22RA1 (UniProtKB:Q8N6P7) with GO:0004896 (cytokine
      receptor activity) and GO:0140865 (interleukin-22-mediated signaling
      pathway).
  - source_id: file:genes/human/IL22RA2/IL22RA2-ai-review.yaml
    title: Human IL22RA2 gene review
    statement: >-
      Curates human IL22RA2 (UniProtKB:Q969J5) as the secreted soluble decoy
      antagonist of IL22 signaling.
  - source_id: file:interpro/panther/PTHR48488/PTHR48488-review.yaml
    title: PANTHER PTHR48488 (INTERLEUKIN-22) family review
    statement: >-
      Documents family-wide coherence of PTHR48488 across Euteleostomi root
      node PTN009232695 for GO:0005125 (cytokine activity) and GO:0140865
      (interleukin-22-mediated signaling pathway).
  - source_id: PANTHER:PTN009232695
    title: PAINT node PTN009232695 for IL22
    statement: >-
      Local PAINT IBD node in PTHR48488 (Euteleostomi root) with propagated
      terms C:GO:0005576, F:GO:0005125, P:GO:0050728; PAINT date 20260601.
  - source_id: PANTHER:PTN000466212
    title: PAINT node PTN000466212 for IL22RA1, IL10RB, and IL22RA2
    statement: >-
      Local PAINT IBD node in PTHR20859 with propagated terms C:GO:0005886,
      F:GO:0004896, P:GO:0019221; PAINT date 20260828.
  - source_id: PANTHER:PTN001562978
    title: PAINT node PTN001562978 for JAK1 and TYK2
    statement: >-
      Local PAINT IBD node in PTHR45807 with propagated terms F:GO:0004715,
      P:GO:0007259, P:GO:0019221; PAINT date 20260828.
  - source_id: PANTHER:PTN000210448
    title: PAINT node PTN000210448 for STAT3
    statement: >-
      Local PAINT IBD node in PTHR11801 with propagated terms C:GO:0005634,
      C:GO:0005737, F:GO:0000978, F:GO:0000981, P:GO:0006357; PAINT date 20260828.
notes: >-
  Three-step class II cytokine receptor JAK-STAT signaling module modeling
  Interleukin-22 (family PTHR48488) signaling through the heterodimeric
  IL22RA1 (PTHR20859:SF53) and IL10RB (PTHR20859:SF50) receptor complex,
  alongside extracellular decoy antagonism by soluble IL22RA2 (IL-22BP,
  PTHR20859:SF51). Per ligand-in-signaling conventions
  (projects/LIGANDS_IN_SIGNALING.md), the IL22 ligand annoton uses FAMILY
  selector PANTHER:PTHR48488 and molecular function GO:0005125 (cytokine
  activity, an is_a child of GO:0048018 receptor ligand activity) rather than
  the receptor-binding term GO:0045518 (interleukin-22 receptor binding),
  resolving the Category C gap where GO:0140865 was annotated to IL22RA1,
  IL10RB, and IL22RA2 in GOA but had zero annotations on IL22 itself in human
  or mouse.
