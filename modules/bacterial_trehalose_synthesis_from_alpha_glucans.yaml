id: MODULE:bacterial_trehalose_synthesis_from_alpha_glucans
title: Bacterial trehalose synthesis from alpha-glucans and maltose
description: >-
  A reusable bacterial module covering two alternative routes that form
  trehalose from alpha-glucosides. In the coupled TreY-TreZ route, TreY
  rearranges the reducing-end linkage of an alpha-1,4-glucan to form
  maltooligosyltrehalose and TreZ hydrolytically releases trehalose. In the
  standalone TreS route, one enzyme reversibly interconverts maltose and
  trehalose; two sequence-distinct TreS groups carry this reaction, the
  classical GH13 TreS subfamily first described in Pimelobacter and a
  Pseudomonas-type TreS group. Trehalose synthesis from nucleotide sugars,
  trehalose degradation, upstream alpha-glucan or maltose supply, and TreS
  acting with maltokinase to feed GlgE-dependent alpha-glucan synthesis are
  outside the boundary.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:8605217
    title: Cloning and sequencing of trehalose biosynthesis genes from Arthrobacter sp. Q36.
    statement: >-
      The characterized Arthrobacter locus contains adjacent treY and treZ
      genes encoding the two reactions of the alpha-glucan route.
    supporting_text: >-
      Sequence analysis of the DNA fragment revealed two open reading frames of
      2325 and 1794 bp, encoding maltooligosyltrehalose synthase (TreY) and
      maltooligosyltrehalose trehalohydrolase (TreZ), respectively.
  - source_id: PMID:8611744
    title: Purification and properties of a novel enzyme, maltooligosyl trehalose synthase, from Arthrobacter sp. Q36.
    statement: Purified Arthrobacter sp. Q36 TreY catalyzes the first route reaction.
    supporting_text: >-
      Arthrobacter sp. Q36 produces a novel enzyme, maltooligosyl trehalose
      synthase, which catalyzes the conversion of maltooligosaccharide into the
      non-reducing saccharide, maltooligosyl trehalose (alpha-maltooligosyl
      alpha-D-glucoside) by intramolecular transglycosylation.
  - source_id: PMID:8611745
    title: Purification and characterization of a novel enzyme, maltooligosyl trehalose trehalohydrolase, from Arthrobacter sp. Q36.
    statement: Purified Arthrobacter sp. Q36 TreZ catalyzes the second route reaction.
    supporting_text: >-
      The enzyme specifically catalyzed the hydrolysis of the
      alpha-1,4-glucosidic linkage that bound the maltooligosyl and trehalose
      moieties of maltooligosyl trehalose.
  - source_id: PMID:25204684
    title: Cloning and expression of a trehalose synthase from Pseudomonas putida KT2440 for the scale-up production of trehalose from maltose.
    statement: >-
      Recombinant Pseudomonas putida KT2440 TreS converted maltose to
      trehalose, directly supporting the standalone route in this strain.
    supporting_text: >-
      High-pressure liquid chromatography results indicated that this enzyme
      had the ability to catalyze 59% maltose into trehalose, with about 5.1%
      glucose as by-product.
  - source_id: PMID:15654636
    title: Cloning and expression of a trehalose synthase from Pseudomonas stutzeri CJ38 in Escherichia coli for the production of trehalose.
    statement: >-
      The characterized Pseudomonas stutzeri CJ38 TreS reversibly
      interconverts maltose and trehalose and supports the trehalose-forming
      direction represented by the standalone route.
    supporting_text: >-
      Activity analysis, using either maltose or trehalose as a substrate,
      showed a reversible reaction.
  - source_id: UniProtKB:Q88FN6
    title: Pseudomonas putida KT2440 TreY
    statement: Q88FN6 is the exact KT2440 TreY exemplar.
  - source_id: UniProtKB:Q88FN8
    title: Pseudomonas putida KT2440 TreZ
    statement: Q88FN8 is the exact KT2440 TreZ exemplar.
  - source_id: UniProtKB:Q88IT1
    title: Pseudomonas putida KT2440 TreSA
    statement: >-
      Q88IT1 is the standalone KT2440 TreS exemplar; its sequence begins with
      the peptide encoded by the cloning primer reported for the assayed
      KT2440 enzyme.
    url: https://microbiologyjournal.org/download/69686/
    notes: >-
      After its BamHI site, the reported forward primer encodes MTQPDPS, which
      exactly matches residues 1-7 of Q88IT1. A companion article reports an
      approximately 76-kDa product, close to Q88IT1's predicted 75.6 kDa, but
      the PMID:25204684 abstract reports 67 kDa. The unresolved mass conflict
      means the primer match, not apparent mass, is the stronger locus evidence.
  - source_id: UniProtKB:Q9LAS5
    title: Pseudomonas stutzeri CJ38 TreS
    statement: >-
      Q9LAS5 maps to GenBank AAF26837.1, the 689-residue CJ38 TreS characterized
      in PMID:15654636, and is a TIGR02455 TreS_stutzeri family member.
  - source_id: PMID:10658666
    title: Three pathways for trehalose biosynthesis in mycobacteria.
    statement: >-
      Recombinant enzymes from M. tuberculosis showed TreY-TreZ trehalose
      synthesis from glycogen-like alpha-glucans, extending the coupled route
      beyond Arthrobacter.
    supporting_text: >-
      from glycogen-like alpha(1-->4)-linked glucose polymers (the TreY-TreZ
      pathway)
  - source_id: PMID:8645698
    title: Cloning and sequencing of trehalose synthase gene from Pimelobacter sp. R48.
    statement: >-
      The founding trehalose synthase from Pimelobacter sp. R48 converts
      maltose into trehalose and is the classical standalone TreS exemplar.
    supporting_text: >-
      The gene encoding trehalose synthase (catalyzing the conversion of maltose into
      alpha, alpha-trehalose by intramolecular transglucosylation) was cloned from
      Pimelobacter sp. R48.
  - source_id: UniProtKB:P72235
    title: Pimelobacter sp. R48 TreS
    statement: >-
      P72235 is the 573-residue Pimelobacter TreS encoded by the gene cloned in
      PMID:8645698 and belongs to PANTHER PTHR10357:SF219.
  - source_id: file:interpro/panther/PTHR10357/PTHR10357-review.yaml
    title: PTHR10357 family review
    statement: >-
      TreY activity is confined to subfamily SF216 and TreS activity to
      subfamily SF219 plus a Pseudomonas-type TreS group that PANTHER places
      only at family level; the rest of the GH13 family comprises other
      glucosidases and transglycosylases.
  - source_id: file:interpro/panther/PTHR43651/PTHR43651-review.yaml
    title: PTHR43651 family review
    statement: >-
      TreZ (SF11) is a sister clade to the glycogen branching enzymes and
      inherits none of their PAINT terms.
  - source_id: file:MYCTU/treY/treY-ai-review.yaml
    title: MYCTU treY gene review
    statement: P9WQ21 (Rv1563c) is the experimentally supported M. tuberculosis TreY and the PAINT seed.
  - source_id: file:MYCTU/treZ/treZ-ai-review.yaml
    title: MYCTU treZ gene review
    statement: P9WQ23 (Rv1562c) is the experimentally supported M. tuberculosis TreZ.
  - source_id: file:PIMSR/treS/treS-ai-review.yaml
    title: Pimelobacter sp. R48 treS gene review
    statement: P72235 is the classical standalone TreS exemplar.
  - source_id: file:STUST/treS/treS-ai-review.yaml
    title: Stutzerimonas stutzeri CJ38 treS gene review
    statement: Q9LAS5 is the characterized Pseudomonas-type TreS.
  - source_id: file:PSEPK/treSA/treSA-ai-review.yaml
    title: Pseudomonas putida KT2440 treSA gene review
    statement: Q88IT1 is the KT2440 Pseudomonas-type TreS with demonstrated maltose-to-trehalose activity.
notes: >-
  The TreY-TreZ route and the standalone TreS route are alternative module
  implementations, not a three-step chain. The narrower reusable TreY-TreZ
  route is also represented in modules/trey_trez_trehalose_biosynthesis.yaml,
  and this variant uses the same subfamilies, PAINT node and exemplars; this
  broader module adds the alternative standalone TreS architecture. The module
  is species-neutral: each step is selected by family, and exemplars were chosen
  for experimental evidence (Arthrobacter sp. Q36 and M. tuberculosis TreY/TreZ,
  Pimelobacter sp. R48 and P. stutzeri CJ38 TreS), with P. putida KT2440 kept as
  one homology- or assay-supported exemplar per step. TreS is split into two
  family groups because they are sequence-distinct: classical TreS sits in
  PANTHER PTHR10357:SF219 with the TIGR02456 TreS N-terminal signature, whereas
  the Pseudomonas-type TreS (TIGR02455, InterPro IPR012665) is placed in
  PTHR10357 only at family level, so it is selected by its InterPro family.
  SF219 also contains TreS enzymes that work in another pathway context:
  mycobacterial TreS and the P. putida TreSB-maltokinase fusion (Q88FN0) are
  SF219 members but are not chosen as exemplars here, because in mycobacteria
  TreS runs mainly toward maltose and pairs with maltokinase to feed GlgE,
  which is modelled in
  modules/tres_mak_glge_branched_alpha_glucan_biosynthesis.yaml. Selecting
  SF219 for the standalone route therefore asserts catalytic capacity for the
  reaction, not that every SF219 member makes trehalose in vivo. All TreS
  reactions are reversible; the standalone route records demonstrated
  maltose-to-trehalose catalytic capacity, not established in vivo flux, and
  for KT2440 PP_2918/Q88IT1 the physiological direction remains unresolved.
  Five OpenScientist jobs (three genes, generic module, and module + ppu00500
  + PSEPK) finished without producing reports; no provider output was
  reconstructed or inferred.
module:
  id: bacterial_trehalose_synthesis_from_alpha_glucans
  label: Bacterial trehalose synthesis from alpha-glucans and maltose
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: trehalose biosynthetic process
      term:
        id: GO:0005992
        label: trehalose biosynthetic process
      description: Formation of trehalose by either represented alpha-glucoside route.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  variant_sets:
    - id: alpha_glucoside_trehalose_synthesis_route
      label: Alpha-glucoside-dependent trehalose-synthesis route
      axis: substrate and enzyme architecture
      selection: ONE_OR_MORE
      variants:
        - id: trey_trez_route
          label: Coupled TreY-TreZ route from alpha-1,4-glucan
          module_type: METABOLIC_PATHWAY
          description: >-
            TreY creates a trehalose-containing reducing end and TreZ releases
            free trehalose in a second reaction.
          conforms_to:
            - template: trey_trez_trehalose_biosynthesis
              status: EXACT
              notes: >-
                This variant contains the same two molecular functions and
                TreY-to-TreZ metabolite-flow topology as the narrower template.
          parts:
            - order: 1
              role: maltooligosyltrehalose formation
              node:
                id: trey_maltooligosyl_trehalose_formation
                label: TreY terminal glucosyl rearrangement
                module_type: REACTION
                annotons:
                  - id: trey_activity
                    label: Maltooligosyl trehalose synthase activity
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: TreY maltooligosyl trehalose synthase family
                        term:
                          id: PANTHER:PTHR10357:SF216
                          label: MALTOOLIGOSYL TREHALOSE SYNTHASE-RELATED
                        representative_members:
                          - preferred_term: TreY (Arthrobacter sp. Q36)
                            term:
                              id: UniProtKB:Q44315
                              label: Maltooligosyl trehalose synthase
                          - preferred_term: TreY (Mycobacterium tuberculosis H37Rv)
                            term:
                              id: UniProtKB:P9WQ21
                              label: Putative maltooligosyl trehalose synthase
                          - preferred_term: TreY (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88FN6
                              label: Maltooligosyl trehalose synthase
                        ancestral_nodes:
                          - preferred_term: PAINT node PTN008498486 for TreY glucosylmutase activity
                            term:
                              id: PANTHER:PTN008498486
                              label: PTN008498486
                            description: >-
                              Root of the SF216 TreY clade in PTHR10357,
                              asserting F:GO:0047470 and P:GO:0005992 by IBD
                              seeded by M. tuberculosis Rv1563c, as recorded in
                              the PTHR10357 family review.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN008498486 in PTHR10357.
                    function:
                      preferred_term: (1,4)-alpha-D-glucan 1-alpha-D-glucosylmutase activity
                      term:
                        id: GO:0047470
                        label: (1,4)-alpha-D-glucan 1-alpha-D-glucosylmutase activity
                      substrates:
                        - preferred_term: alpha-1,4-glucan with a reducing-end alpha-1,4 linkage
                      products:
                        - preferred_term: maltooligosyltrehalose
                      evidence:
                        - source_id: RHEA:13621
                          statement: >-
                            Official Rhea entry for the bidirectional EC
                            5.4.99.15 rearrangement of a reducing-end
                            alpha-1,4-glucan linkage to the corresponding
                            alpha,alpha-1,1-linked glucan terminus.
                        - source_id: PMID:8611744
                          statement: Purified Arthrobacter sp. Q36 TreY forms maltooligosyl trehalose.
                    role_description: >-
                      Rearranges the reducing-end glycosidic linkage to form the
                      substrate consumed by TreZ.
            - order: 2
              role: trehalose release
              node:
                id: trez_trehalose_release
                label: TreZ maltooligosyltrehalose hydrolysis
                module_type: REACTION
                annotons:
                  - id: trez_activity
                    label: Maltooligosyltrehalose trehalohydrolase activity
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: TreZ maltooligosyltrehalose trehalohydrolase family
                        term:
                          id: PANTHER:PTHR43651:SF11
                          label: MALTO-OLIGOSYLTREHALOSE TREHALOHYDROLASE
                        representative_members:
                          - preferred_term: TreZ (Arthrobacter sp. Q36)
                            term:
                              id: UniProtKB:Q44316
                              label: Malto-oligosyltrehalose trehalohydrolase
                          - preferred_term: TreZ (Mycobacterium tuberculosis H37Rv)
                            term:
                              id: UniProtKB:P9WQ23
                              label: Malto-oligosyltrehalose trehalohydrolase
                          - preferred_term: TreZ (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88FN8
                              label: Malto-oligosyltrehalose trehalohydrolase
                    function:
                      preferred_term: 4-alpha-D-(1->4)-alpha-D-glucanotrehalose trehalohydrolase activity
                      term:
                        id: GO:0033942
                        label: 4-alpha-D-(1->4)-alpha-D-glucanotrehalose trehalohydrolase activity
                      substrates:
                        - preferred_term: maltooligosyltrehalose
                        - preferred_term: water
                      products:
                        - preferred_term: trehalose
                        - preferred_term: shortened alpha-1,4-glucan
                      evidence:
                        - source_id: PMID:8611745
                          statement: >-
                            Purified Arthrobacter sp. Q36 TreZ hydrolyzes the
                            linkage between the maltooligosyl and trehalose
                            moieties.
                    role_description: >-
                      Hydrolyzes the linkage adjacent to the trehalose moiety
                      and releases free trehalose.
          connections:
            - source: trey_maltooligosyl_trehalose_formation
              target: trez_trehalose_release
              connection_type: PROVIDES_INPUT_FOR
              description: TreY supplies maltooligosyltrehalose to TreZ.
              chaining_status: VERIFIED
              chaining_note: >-
                The product and substrate are explicit in the two characterized
                reactions; the automated chain checker is not designed for
                non-CoA glucan intermediates.
        - id: standalone_tres_route
          label: Standalone TreS route from maltose
          module_type: REACTION
          description: >-
            A standalone TreS reversibly interconverts maltose and trehalose;
            this route variant represents flux in the trehalose-forming
            direction. Two sequence-distinct TreS groups implement it.
          variant_sets:
            - id: standalone_tres_enzyme_group
              label: Standalone TreS enzyme group
              axis: enzyme family
              selection: EXACTLY_ONE
              variants:
                - id: classical_tres
                  label: Classical GH13 TreS (PTHR10357:SF219)
                  module_type: REACTION
                  description: >-
                    The classical TreS subfamily, first purified and cloned
                    from Pimelobacter sp. R48, carrying the TIGR02456 TreS
                    N-terminal signature.
                  annotons:
                    - id: classical_tres_activity
                      label: Maltose alpha-D-glucosyltransferase activity (classical TreS)
                      participant:
                        selector_type: FAMILY
                        family:
                          preferred_term: classical TreS trehalose synthase subfamily
                          term:
                            id: PANTHER:PTHR10357:SF219
                            label: MALTOSE ALPHA-D-GLUCOSYLTRANSFERASE
                          representative_members:
                            - preferred_term: TreS (Pimelobacter sp. R48)
                              term:
                                id: UniProtKB:P72235
                                label: Trehalose synthase
                              description: >-
                                The founding 573-residue trehalose synthase,
                                whose gene was cloned for the enzyme that
                                converts maltose into trehalose.
                      function:
                        preferred_term: maltose alpha-D-glucosyltransferase activity
                        term:
                          id: GO:0047471
                          label: maltose alpha-D-glucosyltransferase activity
                        substrates:
                          - preferred_term: D-maltose
                        products:
                          - preferred_term: alpha,alpha-trehalose
                        evidence:
                          - source_id: RHEA:15145
                            statement: Reversible EC 5.4.99.16 maltose-trehalose interconversion.
                          - source_id: PMID:8645698
                            statement: >-
                              The Pimelobacter sp. R48 trehalose synthase
                              converts maltose into trehalose by intramolecular
                              transglucosylation.
                      role_description: >-
                        Converts maltose directly to trehalose without a glucan
                        intermediate.
                - id: pseudomonas_type_tres
                  label: Pseudomonas-type TreS (TIGR02455)
                  module_type: REACTION
                  description: >-
                    A sequence-distinct TreS group defined by the TIGR02455
                    TreS_stutzeri and IPR012665 signatures, characterized in
                    Pseudomonas stutzeri CJ38 and P. putida KT2440.
                  annotons:
                    - id: tres_activity
                      label: Maltose alpha-D-glucosyltransferase activity (Pseudomonas-type TreS)
                      participant:
                        selector_type: FAMILY
                        family:
                          preferred_term: Pseudomonas-type TreS trehalose synthase family
                          term:
                            id: InterPro:IPR012665
                            label: Trehalose synthase
                          evidence:
                            - source_id: file:STUST/treS/treS-uniprot.txt
                              statement: >-
                                The characterized CJ38 TreS carries the
                                IPR012665 and TIGR02455 signatures and is placed
                                in PANTHER PTHR10357 only at family level.
                              supporting_text: 'DR   InterPro; IPR012665; Trehalose_synth.'
                            - source_id: file:PSEPK/treSA/treSA-uniprot.txt
                              statement: KT2440 TreSA carries the same IPR012665 family signature.
                              supporting_text: 'DR   InterPro; IPR012665; Trehalose_synth.'
                          representative_members:
                            - preferred_term: TreS (Pseudomonas stutzeri CJ38)
                              term:
                                id: UniProtKB:Q9LAS5
                                label: Trehalose synthase
                              description: >-
                                Characterized 689-residue TreS (GenBank
                                AAF26837.1) that reversibly interconverts
                                maltose and trehalose.
                            - preferred_term: TreSA (Pseudomonas putida KT2440)
                              term:
                                id: UniProtKB:Q88IT1
                                label: Trehalose synthase A
                      function:
                        preferred_term: maltose alpha-D-glucosyltransferase activity
                        term:
                          id: GO:0047471
                          label: maltose alpha-D-glucosyltransferase activity
                        substrates:
                          - preferred_term: D-maltose
                        products:
                          - preferred_term: alpha,alpha-trehalose
                        evidence:
                          - source_id: RHEA:15145
                            statement: Reversible EC 5.4.99.16 maltose-trehalose interconversion.
                          - source_id: PMID:15654636
                            statement: >-
                              Recombinant Pseudomonas stutzeri CJ38 TreS
                              catalyzed the reversible reaction and produced
                              trehalose from maltose.
                          - source_id: PMID:25204684
                            statement: Recombinant KT2440 TreS converted maltose to trehalose.
                      role_description: >-
                        Carries the reversible reaction in the trehalose-forming
                        direction without requiring the TreY-TreZ intermediate.
                        For KT2440 PP_2918 this direction is demonstrated in
                        vitro, while its physiological flux direction remains
                        unresolved.
