  knowledge_gaps:
    - gap_statement: >-
        In S. cerevisiae the enzyme, if any, that hydrolyses palmitoyl-,
        stearoyl-, palmitoleoyl- and oleoyl-CoA to free fatty acids as the
        terminal step of the YeastCyc pathways is not established; YeastCyc
        leaves these reactions without a gene and the GO-CAM conversion
        assigns the peroxisomal thioesterase TES1.
      boundary: >-
        Fungal FAS releases acyl-CoA, which is used directly for lipid
        synthesis, so free fatty acid release is not modelled as a part.
        Biochemical and localisation data would be needed to assign a
        cytosolic acyl-CoA thioesterase to this role.
      gap_kind:
        - BIOLOGY
  notes: >-
    GENERALIZE (YeastPathways project, 2026-10): the former human-only
    lipogenesis module (ACLY -> ACACA/ACACB -> FASN -> OLAH) was broadened to
    eukaryotic cytosolic type I FAS. Nine YeastCyc frames (PWY3O-5962,
    PWY3O-6336, PWY3O-10, PWY-5971-1, PWY3O-8514, PWY3O-355, PWY3O-31723,
    PWY3O-5268, PWY3O-1801) are partitions of one pathway and map onto parts
    2, 3 and 5. Changes: (1) acetyl-CoA supply became a ONE_OR_MORE variant
    set with ATP-citrate lyase (human ACLY, S. pombe acl1) and the acetate /
    acetyl-CoA synthetase route used by S. cerevisiae, which lacks ATP-citrate
    lyase (ACS2 representative; pdh_bypass_acetyl_coa_synthesis is
    authoritative for that route). S. pombe ATP-citrate lyase is heteromeric
    (acl1 + acl2); acl2 is in a different PANTHER family and is mentioned only
    in the acl1 description. (2) ACC gained S. cerevisiae ACC1 and S. pombe
    cut6 (both PTHR45728). (3) chain assembly became an EXACTLY_ONE variant
    set: animal homodimeric FASN (GO:0004312, free palmitate) vs the fungal
    alpha6-beta6 FAS complex (GO:0005835; FAS1 beta + FAS2 alpha;
    GO:0004321 fatty-acyl-CoA synthase activity because the product leaves as
    acyl-CoA). The fungal subunits carry no PANTHER term: UniProt and PANTHER
    place both FAS1 and FAS2 in PTHR10982:SF21 "FATTY ACID SYNTHASE SUBUNIT
    BETA" under the malonyl-CoA ACP transacylase family, which does not
    describe the alpha subunit; family membership was not used as a role
    descriptor. (4) OLAH became optional (animal-specific). (5) a new optional
    delta-9 desaturation part (SCD/OLE1/ole1, PTHR11351, GO:0004768, ER
    membrane) was added. The module context is now Eukaryota + cytosol; the
    desaturase location is given on its annoton. ACACB's mitochondrial outer
    membrane location and its regulatory role in beta-oxidation remain in its
    gene review rather than in module context. YeastCyc corrections: HFA1 is
    the mitochondrial acetyl-CoA carboxylase (PMID:14761959), and CEM1, OAR1
    and MCT1 are mitochondrial FAS II enzymes; YeastCyc lists them as
    catalysts of the cytosolic FAS reactions, and they are modelled in
    type_ii_fatty_acid_synthesis instead. YeastCyc gives no gene for many
    3-oxoacyl-ACP reductions (FAS2 KR domain) and none for the final acyl-CoA
    hydrolysis steps. GO-CAM disagreements: the YeastPathways models place
    every activity, including ER-membrane OLE1, in cytosol, attach mitochondrial
    HFA1/CEM1/OAR1/MCT1 to cytosolic FAS reaction nodes, type two FAS1 partial
    reactions only as GO:0003674, type one FAS1 enoyl-reductase node as
    GO:0004318 (NADH) although the fungal enzyme uses NADPH, and attach TES1
    (a peroxisomal thioesterase) to the cytosolic acyl-CoA hydrolysis
    reactions. The PomBase model 678073a900002931 agrees with the cytosolic
    core and additionally contains mitochondrial FAS II, the ER elongation
    cycle, citrate transport and lipoylation, which belong to other modules.
    Very-long-chain extension is in fatty_acid_elongation_cycle.
