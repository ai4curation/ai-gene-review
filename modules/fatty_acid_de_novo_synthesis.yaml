                            role: >-
                              Carries the acetyltransferase, malonyl/palmitoyl
                              transferase, 3-hydroxyacyl dehydratase and
                              enoyl reductase active sites; the malonyl/palmitoyl
                              transferase transfers the finished acyl chain to CoA.
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: fungal FAS beta subunit
                                representative_members:
                                  - preferred_term: FAS1 (Saccharomyces cerevisiae)
                                    term:
                                      id: UniProtKB:P07149
                                      label: Fatty acid synthase subunit beta
                                  - preferred_term: fas1 (Schizosaccharomyces pombe)
                                    term:
                                      id: UniProtKB:Q9UUG0
                                      label: Fatty acid synthase subunit beta
                                    description: SPAC926.09c.
                            function:
                              preferred_term: '[acyl-carrier-protein] S-malonyltransferase activity'
                              term:
                                id: GO:0004314
                                label: '[acyl-carrier-protein] S-malonyltransferase activity'
                    function:
                      preferred_term: fatty-acyl-CoA synthase activity
                      term:
                        id: GO:0004321
                        label: fatty-acyl-CoA synthase activity
                      substrates:
                        - preferred_term: acetyl-CoA (primer)
                        - preferred_term: malonyl-CoA (7-8 units)
                        - preferred_term: NADPH
                      products:
                        - preferred_term: palmitoyl-CoA and stearoyl-CoA (minor myristoyl-CoA)
                        - preferred_term: CoA + CO2
                      evidence:
                        - source_id: PMID:17448991
                          statement: The yeast FAS assembly carries out the whole pathway to C16 and C18 fatty acids.
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    gocam_associations:
                      - model: gomodel:YeastPathways_PWY3O-5962
                        activity: gomodel:3-OXOACYL-ACP-SYNTH-BASE-RXN
                        title: 'superpathway of fatty acid biosynthesis, saturated and unsaturated - imported from: Saccharomyces Genome Database'
                        description: >-
                          FAS2 enables GO:0004315 (first condensation); the model
                          also attaches CEM1 to this activity, which is not
                          supported. Other FAS partial activities in the model are
                          typed GO:0004313, GO:0004314, GO:0004316, GO:0019171,
                          GO:0004318/GO:0016631, GO:0016409 and GO:0004321, and two
