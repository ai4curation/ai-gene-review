id: MODULE:fatty_acid_de_novo_synthesis
title: Eukaryotic cytosolic de novo fatty acid synthesis (type I FAS)
description: >-
  Cytosolic de novo fatty acid synthesis builds long-chain saturated fatty
  acids (mainly C16:0 and C18:0) from acetyl-CoA in eukaryotes, supplying
  membrane phospholipids, sphingolipids, storage triacylglycerol and acylated
  proteins. Cytosolic acetyl-CoA is supplied either by ATP-citrate lyase, which
  cleaves citrate exported from mitochondria (animals, plants and many fungi
  such as fission yeast), or, in yeasts without ATP-citrate lyase, by
  acetyl-CoA synthetase acting on acetate. A biotin-dependent multidomain
  acetyl-CoA carboxylase then carboxylates acetyl-CoA to malonyl-CoA in the
  committed, highly regulated step. The chain is assembled by a type I fatty
  acid synthase (FAS), a multifunctional megasynthase that carries all the
  acyl-transfer, condensation, reduction, dehydration and acyl-carrier
  activities on large polypeptides and iteratively adds two-carbon units from
  malonyl-CoA using NADPH. Two unrelated architectures carry out this step:
  the animal FAS is a homodimer of a single polypeptide that releases free
  palmitate through a thioesterase, whereas the fungal FAS is a 2.6 MDa
  alpha6-beta6 barrel built from two polypeptides that releases the product as
  acyl-CoA (mostly palmitoyl- and stearoyl-CoA) through a
  malonyl/palmitoyl-transferase domain. In animals an auxiliary thioesterase
  can release medium-chain fatty acids early. Saturated acyl-CoAs are commonly
  desaturated by an endoplasmic-reticulum delta-9 stearoyl-CoA desaturase to
  palmitoleoyl- and oleoyl-CoA. Chain extension beyond C16-C18 is carried out
  by the separate microsomal elongation cycle, and the mitochondrial
  dissociated (type II) FAS that makes the octanoyl precursor of lipoic acid is
  a distinct pathway.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY3O-5962
    title: superpathway of fatty acid biosynthesis, saturated and unsaturated (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-5962
    statement: >-
      YeastCyc superpathway combining ACC1/HFA1 carboxylation, FAS1/FAS2
      chain assembly (with CEM1, OAR1 and MCT1 also listed as catalysts) and
      OLE1 desaturation. HFA1, CEM1, OAR1 and MCT1 are mitochondrial FAS II
      enzymes and are modelled in type_ii_fatty_acid_synthesis instead.
  - source_id: YeastPathways:PWY3O-6336
    title: superpathway of fatty acid biosynthesis, saturated (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-6336
    statement: Saturated superpathway; same catalyst list as PWY3O-5962 without OLE1.
  - source_id: YeastPathways:PWY3O-10
    title: fatty acid biosynthesis, initial steps (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-10
    statement: >-
      Carboxylation, acetyl/malonyl loading and the first condensation and
      reduction round, assigned to ACC1, HFA1, FAS1, FAS2, MCT1 and CEM1.
  - source_id: YeastPathways:PWY-5971-1
    title: myristate biosynthesis (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5971-1
    statement: Iterative FAS1/FAS2 rounds up to myristoyl-CoA; the 3-oxoacyl reductions are given no gene although FAS2 carries the ketoreductase domain.
  - source_id: YeastPathways:PWY3O-8514
    title: palmitate biosynthesis (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-8514
    statement: FAS1/FAS2 round from myristoyl- to palmitoyl-ACP and release as palmitoyl-CoA.
  - source_id: YeastPathways:PWY3O-355
    title: stearate biosynthesis III (fungi) (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-355
    statement: FAS1/FAS2 round from palmitoyl- to stearoyl-ACP; CEM1 is also listed as condensing enzyme, which is not supported.
  - source_id: YeastPathways:PWY3O-31723
    title: fatty acids biosynthesis (yeast) (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-31723
    statement: Single lumped FATTY-ACYL-COA-SYNTHASE-RXN (EC 2.3.1.86) catalysed by FAS1 and FAS2, producing long-chain acyl-CoA.
  - source_id: YeastPathways:PWY3O-5268
    title: oleate biosynthesis (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-5268
    statement: OLE1 delta-9 desaturation of stearoyl-CoA; the subsequent thioester hydrolysis to free oleate has no assigned gene.
  - source_id: YeastPathways:PWY3O-1801
    title: palmitoleate biosynthesis (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-1801
    statement: OLE1 delta-9 desaturation of palmitoyl-CoA; hydrolysis to free palmitoleate has no assigned gene.
  - source_id: GO:0006633
    title: fatty acid biosynthetic process
    statement: Module-level process for the carboxylation and chain-assembly core.
  - source_id: GO:2001295
    title: malonyl-CoA biosynthetic process
    statement: Acetyl-CoA carboxylase produces malonyl-CoA, the two-carbon donor.
  - source_id: GO:0006636
    title: unsaturated fatty acid biosynthetic process
    statement: Process of the optional delta-9 desaturation part.
  - source_id: PMID:17448991
    title: The crystal structure of yeast fatty acid synthase, a cellular machine with eight active sites working together.
    statement: >-
      In yeast the entire pathway to 16- and 18-carbon fatty acids is carried
      out by a 2.6 MDa FAS assembly containing six copies of all eight
      catalytic centres.
  - source_id: PMID:8098706
    title: Acetyl-CoA carboxylase from yeast is an essential enzyme and is regulated by factors that control phospholipid metabolism.
    statement: ACC1 encodes the 250 kDa biotin-containing acetyl-CoA carboxylase; acc1 spores are inviable even with fatty acid supplementation.
  - source_id: PMID:1350093
    title: Cloning of the yeast FAS3 gene and primary structure of yeast acetyl-CoA carboxylase.
    statement: FAS3 (= ACC1) encodes acetyl-CoA carboxylase, conserved with chicken and rat carboxylases.
  - source_id: PMID:14761959
    title: HFA1 encoding an organelle-specific acetyl-CoA carboxylase controls mitochondrial fatty acid synthesis in Saccharomyces cerevisiae.
    statement: >-
      HFA1 and ACC1 do not complement each other; ACC1 serves cytoplasmic
      fatty acid synthesis whereas HFA1 is the mitochondrial carboxylase, so
      HFA1 is excluded from this cytosolic module.
  - source_id: PMID:1978720
    title: The OLE1 gene of Saccharomyces cerevisiae encodes the delta 9 fatty acid desaturase and can be functionally replaced by the rat stearoyl-CoA desaturase gene.
    statement: OLE1 encodes the delta-9 desaturase required for unsaturated fatty acid synthesis and is replaceable by rat stearoyl-CoA desaturase.
  - source_id: PMID:16920014
    title: Regulation of long chain unsaturated fatty acid synthesis in yeast.
    statement: >-
      Ole1p is an ER membrane desaturase with a fused C-terminal cytochrome b5
      domain that receives electrons from NADH via cytochrome b5 reductase.
  - source_id: PMID:24520995
    title: Yeast lipid metabolism at a glance.
    statement: Review of yeast fatty acid synthesis, elongation, desaturation and degradation used for boundary setting.
  - source_id: file:human/ACLY/ACLY-ai-review.yaml
    title: ACLY gene review (human)
    statement: ATP-citrate lyase (UniProtKB:P53396, GO:0003878) matches the completed human ACLY review.
  - source_id: file:human/ACACA/ACACA-ai-review.yaml
    title: ACACA gene review (human)
    statement: Acetyl-CoA carboxylase 1 (UniProtKB:Q13085, GO:0003989) matches the completed human ACACA review.
  - source_id: file:human/ACACB/ACACB-ai-review.yaml
    title: ACACB gene review (human)
    statement: Acetyl-CoA carboxylase 2 (UniProtKB:O00763, GO:0003989) matches the completed human ACACB review.
  - source_id: file:human/FASN/FASN-ai-review.yaml
    title: FASN gene review (human)
    statement: Fatty acid synthase (UniProtKB:P49327, GO:0004312) matches the completed human FASN review.
  - source_id: file:human/OLAH/OLAH-ai-review.yaml
    title: OLAH gene review (human)
    statement: Oleoyl-ACP hydrolase / thioesterase II (UniProtKB:Q9NV23, GO:0016297) matches the completed human OLAH review.
module:
  id: fatty_acid_de_novo_synthesis
  label: Eukaryotic cytosolic de novo fatty acid synthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: fatty acid biosynthetic process
      term:
        id: GO:0006633
        label: fatty acid biosynthetic process
      description: Cytosolic de novo synthesis of long-chain saturated fatty acids by type I FAS.
    - preferred_term: malonyl-CoA biosynthetic process
      term:
        id: GO:2001295
        label: malonyl-CoA biosynthetic process
      description: Carboxylation of acetyl-CoA to malonyl-CoA, the committed step.
  context:
    taxa:
      - preferred_term: Eukaryota
        term:
          id: NCBITaxon:2759
          label: Eukaryota
        description: >-
          Animals and fungi use unrelated type I FAS architectures; the
          carboxylase, acetyl-CoA supply and desaturase roles are shared.
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: Acetyl-CoA supply, carboxylation and chain assembly are cytosolic.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-5962
      title: 'superpathway of fatty acid biosynthesis, saturated and unsaturated - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with ACC1, HFA1, FAS1, FAS2, MCT1, CEM1, OAR1, OLE1 and
        TES1, all placed in cytosol and part of GO:0006633. HFA1, MCT1, CEM1
        and OAR1 are mitochondrial FAS II enzymes and do not belong here.
    - model: gomodel:YeastPathways_PWY3O-6336
      title: 'superpathway of fatty acid biosynthesis, saturated - imported from: Saccharomyces Genome Database'
      description: Saturated-only version of PWY3O-5962 with the same catalyst issues.
    - model: gomodel:YeastPathways_PWY3O-10
      title: 'fatty acid biosynthesis, initial steps - imported from: Saccharomyces Genome Database'
      description: Carboxylation and first FAS round; includes HFA1, MCT1 and CEM1.
    - model: gomodel:YeastPathways_PWY-5971-1
      title: 'myristate biosynthesis - imported from: Saccharomyces Genome Database'
      description: Iterative FAS1/FAS2 rounds to myristoyl-CoA.
    - model: gomodel:YeastPathways_PWY3O-8514
      title: 'palmitate biosynthesis - imported from: Saccharomyces Genome Database'
      description: FAS1/FAS2 round to palmitoyl-CoA.
    - model: gomodel:YeastPathways_PWY3O-355
      title: 'stearate biosynthesis III (fungi) - imported from: Saccharomyces Genome Database'
      description: FAS1/FAS2 round to stearoyl-CoA (CEM1 also listed).
    - model: gomodel:YeastPathways_PWY3O-5268
      title: 'oleate biosynthesis - imported from: Saccharomyces Genome Database'
      description: OLE1 stearoyl-CoA 9-desaturase placed in cytosol (it is an ER membrane enzyme) plus TES1 thioesterase.
    - model: gomodel:YeastPathways_PWY3O-1801
      title: 'palmitoleate biosynthesis - imported from: Saccharomyces Genome Database'
      description: OLE1 desaturation of palmitoyl-CoA plus TES1 thioesterase, both in cytosol.
    - model: gomodel:678073a900002931
      title: fatty acid biosynthetic process (GO:0006633)
      description: >-
        PomBase S. pombe model with cytosolic acl1/acl2 ATP-citrate lyase,
        cut6 acetyl-CoA carboxylase, the fas1/fas2 FAS complex, ole1
        desaturase and acyl-CoA thioesterases, together with mitochondrial
        FAS II (modelled in type_ii_fatty_acid_synthesis), the ER elongation
        cycle (fatty_acid_elongation_cycle), citrate transporters and
        lipoylation.
  parts:
    - order: 1
      role: cytosolic acetyl-CoA supply
      node:
        id: acetyl_coa_generation
        label: Cytosolic acetyl-CoA supply
        module_type: METABOLIC_PATHWAY
        description: >-
          Cytosolic acetyl-CoA, the FAS primer and carboxylase substrate, is
          made from mitochondria-exported citrate by ATP-citrate lyase or, in
          lineages without ATP-citrate lyase, from acetate by acetyl-CoA
          synthetase.
        variant_sets:
          - id: acetyl_coa_source_variants
            label: Source of cytosolic acetyl-CoA
            axis: enzyme route (lineage)
            selection: ONE_OR_MORE
            variants:
              - id: acly_route
                label: ATP-citrate lyase (animals, plants, many fungi)
                module_type: REACTION
                annotons:
                  - id: acly_activity
                    label: "ACLY: ATP-citrate lyase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: ACLY / ATP-citrate lyase family
                        term:
                          id: PANTHER:PTHR23118
                          label: ATP-CITRATE SYNTHASE
                        representative_members:
                          - preferred_term: ACLY (human)
                            term:
                              id: UniProtKB:P53396
                              label: ATP-citrate synthase
                          - preferred_term: acl1 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:Q9P7W3
                              label: Probable ATP-citrate synthase subunit 1
                            description: >-
                              SPBC1703.07; fungal ATP-citrate lyase is a heteromer
                              of this subunit with acl2 (SPAC22A12.16, O13907),
                              which PANTHER places in a different family
                              (PTHR11815).
                    function:
                      preferred_term: ATP citrate synthase activity
                      term:
                        id: GO:0003878
                        label: ATP citrate synthase activity
                      substrates:
                        - preferred_term: citrate
                        - preferred_term: ATP
                        - preferred_term: CoA
                      products:
                        - preferred_term: acetyl-CoA
                        - preferred_term: oxaloacetate
                        - preferred_term: ADP + phosphate
                      evidence:
                        - source_id: file:human/ACLY/ACLY-ai-review.yaml
                          statement: Cytosolic homotetramer cleaving citrate to acetyl-CoA + OAA; supplies acetyl-CoA for lipogenesis, cholesterol synthesis and acetylation
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    gocam_associations:
                      - model: gomodel:678073a900002931
                        activity: gomodel:678073a900002931/6792e70800000110
                        title: fatty acid biosynthetic process (GO:0006633)
                        description: S. pombe acl1 enables GO:0003878 in cytosol.
                    role_description: Regenerate cytosolic acetyl-CoA from mitochondria-exported citrate.
              - id: acetyl_coa_synthetase_route
                label: Acetate activation by acetyl-CoA synthetase (yeasts lacking ATP-citrate lyase)
                module_type: REACTION
                annotons:
                  - id: acs_activity
                    label: "ACS: cytosolic acetyl-CoA synthetase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: acetyl-CoA synthetase family
                        term:
                          id: PANTHER:PTHR24095
                          label: ACETYL-COENZYME A SYNTHETASE
                        representative_members:
                          - preferred_term: ACS2 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P52910
                              label: Acetyl-coenzyme A synthetase 2
                            description: >-
                              Constitutively expressed isozyme that supplies
                              lipogenic acetyl-CoA in S. cerevisiae, which has no
                              ATP-citrate lyase.
                    function:
                      preferred_term: acetyl-CoA synthetase activity
                      term:
                        id: GO:0003987
                        label: acetyl-CoA synthetase activity
                      substrates:
                        - preferred_term: acetate
                        - preferred_term: ATP
                        - preferred_term: CoA
                      products:
                        - preferred_term: acetyl-CoA
                        - preferred_term: AMP + diphosphate
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Activate acetate (from the pyruvate dehydrogenase bypass) to
                      cytosolic acetyl-CoA; the full route is modelled in
                      pdh_bypass_acetyl_coa_synthesis.
    - order: 2
      role: acetyl-CoA carboxylation (committed step)
      node:
        id: malonyl_coa_synthesis
        label: Cytosolic multidomain acetyl-CoA carboxylase
        module_type: REACTION
        annotons:
          - id: acc_activity
            label: "ACC: biotin-dependent multidomain acetyl-CoA carboxylase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: ACC / eukaryotic multidomain acetyl-CoA carboxylase family
                term:
                  id: PANTHER:PTHR45728
                  label: ACETYL-COA CARBOXYLASE, ISOFORM A
                representative_members:
                  - preferred_term: ACACA / ACC1 (human; cytosolic lipogenic)
                    term:
                      id: UniProtKB:Q13085
                      label: Acetyl-CoA carboxylase 1
                  - preferred_term: ACACB / ACC2 (human; mito-OM, FAO-regulating)
                    term:
                      id: UniProtKB:O00763
                      label: Acetyl-CoA carboxylase 2
                  - preferred_term: ACC1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:Q00955
                      label: Acetyl-CoA carboxylase
                    description: ACC1/FAS3; essential cytosolic carboxylase (PMID:8098706, PMID:1350093).
                  - preferred_term: cut6 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:P78820
                      label: Acetyl-CoA carboxylase
                    description: SPAC56E4.04c.
            function:
              preferred_term: acetyl-CoA carboxylase activity
              term:
                id: GO:0003989
                label: acetyl-CoA carboxylase activity
              substrates:
                - preferred_term: acetyl-CoA
                - preferred_term: hydrogencarbonate (HCO3-)
                - preferred_term: ATP (biotin cofactor)
              products:
                - preferred_term: malonyl-CoA
                - preferred_term: ADP + phosphate
              evidence:
                - source_id: file:human/ACACA/ACACA-ai-review.yaml
                  statement: Biotin-dependent committed rate-limiting step (AMPK/citrate-regulated); ACACA cytosolic lipogenic, ACACB mito-OM producing CPT1-inhibitory malonyl-CoA
                - source_id: PMID:8098706
                  statement: Yeast ACC1 encodes the biotin-containing acetyl-CoA carboxylase and is essential.
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_PWY3O-5962
                activity: gomodel:ACETYL-COA-CARBOXYLTRANSFER-RXN
                title: 'superpathway of fatty acid biosynthesis, saturated and unsaturated - imported from: Saccharomyces Genome Database'
                description: ACC1 enables GO:0003989 in cytosol (the same activity node is also enabled by mitochondrial HFA1 in the model).
              - model: gomodel:678073a900002931
                activity: gomodel:678073a900002931/678073a900004003
                title: fatty acid biosynthetic process (GO:0006633)
                description: S. pombe cut6 enables GO:0003989 in cytosol.
            role_description: Carboxylate acetyl-CoA to malonyl-CoA (committed, rate-limiting step).
    - order: 3
      role: fatty acid chain assembly by a type I megasynthase
      node:
        id: palmitate_synthesis
        label: Type I fatty acid synthase
        module_type: METABOLIC_PATHWAY
        description: >-
          One acetyl primer and seven (or eight) malonyl extender units are
          condensed, reduced, dehydrated and reduced again on a single
          multienzyme. The animal and fungal megasynthases are not homologous
          as assemblies and differ in domain order, quaternary structure and
          product release.
        variant_sets:
          - id: type_i_fas_architecture
            label: Type I FAS architecture
            axis: enzyme architecture (lineage)
            selection: EXACTLY_ONE
            variants:
              - id: animal_fasn_variant
                label: Animal homodimeric FASN releasing free palmitate
                module_type: REACTION
                annotons:
                  - id: fasn_activity
                    label: "FASN: fatty acid synthase (homodimeric megasynthase)"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: FASN / animal fatty acid synthase (type I) family
                        family_terms:
                          - id: PANTHER:PTHR43775:SF7
                            label: FATTY ACID SYNTHASE
                        representative_members:
                          - preferred_term: FASN (human)
                            term:
                              id: UniProtKB:P49327
                              label: Fatty acid synthase
                    function:
                      preferred_term: fatty acid synthase activity
                      term:
                        id: GO:0004312
                        label: fatty acid synthase activity
                      substrates:
                        - preferred_term: acetyl-CoA (primer)
                        - preferred_term: malonyl-CoA (7 units)
                        - preferred_term: NADPH
                      products:
                        - preferred_term: palmitate (C16:0)
                        - preferred_term: CoA + CO2
                      evidence:
                        - source_id: file:human/FASN/FASN-ai-review.yaml
                          statement: Homodimeric multifunctional megaenzyme (KS/MAT/DH/ER/KR/ACP/TE) iteratively condensing acetyl-CoA + 7 malonyl-CoA (NADPH) to palmitate
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: Assemble palmitate and release it as the free acid via the integral thioesterase.
              - id: fungal_fas_variant
                label: Fungal alpha6-beta6 FAS releasing acyl-CoA
                module_type: PROTEIN_COMPLEX
                annotons:
                  - id: fungal_fas_activity
                    label: "FAS1/FAS2: fungal alpha6-beta6 fatty acid synthase"
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: fungal type I fatty acid synthase complex (alpha6-beta6)
                        term:
                          id: GO:0005835
                          label: fatty acid synthase complex
                        description: >-
                          2.6 MDa barrel of six alpha (FAS2) and six beta (FAS1)
                          subunits with six copies of all eight catalytic centres
                          and the ACP domain shuttling inside the reaction
                          chambers (PMID:17448991).
                        active_units:
                          - id: fas2_alpha_unit
                            label: FAS2 alpha subunit (ACP, ketoacyl reductase, ketoacyl synthase, phosphopantetheinyl transferase)
                            role: >-
                              Carries the acyl carrier domain, the 3-oxoacyl
                              synthase and 3-oxoacyl reductase active sites, and
                              the phosphopantetheinyl transferase that activates
                              the ACP domain.
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: fungal FAS alpha subunit
                                representative_members:
                                  - preferred_term: FAS2 (Saccharomyces cerevisiae)
                                    term:
                                      id: UniProtKB:P19097
                                      label: Fatty acid synthase subunit alpha
                                  - preferred_term: fas2 (Schizosaccharomyces pombe)
                                    term:
                                      id: UniProtKB:Q10289
                                      label: Fatty acid synthase subunit alpha
                                    description: SPAC4A8.11c (lsd1).
                            function:
                              preferred_term: 3-oxoacyl-[acyl-carrier-protein] synthase activity
                              term:
                                id: GO:0004315
                                label: 3-oxoacyl-[acyl-carrier-protein] synthase activity
                          - id: fas1_beta_unit
