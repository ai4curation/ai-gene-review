id: MODULE:dmel_activin_signaling
title: Activin signaling pathway in Drosophila melanogaster
description: >-
  The Drosophila activin branch of TGF-beta signaling is triggered by the activin-like ligands
  Activin-beta, Dawdle and Myoglianin. These ligands bind a receptor complex of the type I
  serine/threonine kinase Baboon and a type II receptor kinase (Punt, or Wishful thinking).
  The activated type I receptor phosphorylates the receptor-regulated SMAD Smox (dSmad2),
  which partners with the co-SMAD Medea and enters the nucleus to regulate target genes. The
  pathway acts in neuronal remodeling, cell and tissue growth, and metabolic homeostasis.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001093
  title: 'FlyBase gene group ACT-SMAD2: Activin signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 13 D. melanogaster genes as activin signaling pathway
    (ACT-SMAD2); this module models that group.
- source_id: GO:0032924
  title: activin receptor signaling pathway
  statement: >-
    GO term grounding the module as activin receptor signaling pathway.
notes: >-
  Boundary. Core components only (FlyBase ACT-C). Medea is shared with the BMP pathway and
  Punt and Wishful thinking also act as BMP type II receptors. The role of Wishful thinking
  in activin signaling is less well defined than that of Punt, so no receptor activity is
  asserted for it here. Extracellular modulators (Follistatin, the tolloid proteases) are
  regulators, not parts. FlyBase groups realized by this module: ACT-SMAD2 (FBgg0001093).
  Subgroups folded into it: ACT-C. FlyBase also curates regulator sets for this pathway, which
  are context and not modelled as parts: ACT-N (negative regulators of activin signaling pathway,
  2 genes); ACT-P (positive regulators of activin signaling pathway, 4 genes). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_activin_signaling.yaml; none of the member genes has a gene review
  yet unless noted.
