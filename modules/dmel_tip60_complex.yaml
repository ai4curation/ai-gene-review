id: MODULE:dmel_tip60_complex
title: Tip60 histone acetyltransferase and exchange complex in Drosophila melanogaster
description: >-
  The Drosophila Tip60 complex combines the activities that budding yeast splits between NuA4
  and SWR1. Its MYST-family acetyltransferase Tip60 acetylates nucleosomal histone H4 and
  the H2A variant H2Av, and the SWR1-family ATPase Domino exchanges phosphorylated H2Av for
  unmodified H2Av, which links the complex to DNA damage responses. The complex also contains
  the AAA+ ATPases Pontin and Reptin, the Tra1 homolog Nipped-A, actin, and chromatin-reader
  subunits including MRG15, Brd8 and Gas41. It contributes to transcriptional regulation,
  DNA repair and cell-cycle control.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000287
  title: 'FlyBase gene group TIP60: Tip60 complex'
  statement: >-
    FlyBase release FB2026_03 groups 16 D. melanogaster genes as tip60 complex (TIP60); this
    module models that group.
- source_id: GO:0035267
  title: NuA4 histone acetyltransferase complex
  statement: >-
    GO term grounding the module as NuA4 histone acetyltransferase complex.
notes: >-
  Subunit grouping into acetyltransferase core, MRG15 module, Domino module and Tra1 follows
  the conserved organisation of NuA4 and SWR1 in yeast and the TIP60 complex in mammals; it
  is a modelling convenience, not a claim about separable Drosophila subcomplexes. The Domino-B-containing
  complex without Tip60 is modelled separately in dmel_swr1_domino_complex. FlyBase groups
  realized by this module: TIP60 (FBgg0000287). Participants were generated from the FlyBase
  gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_tip60_complex.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
