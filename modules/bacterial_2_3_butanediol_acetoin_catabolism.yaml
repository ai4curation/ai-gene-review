id: MODULE:bacterial_2_3_butanediol_acetoin_catabolism
title: Bacterial 2,3-butanediol and acetoin catabolism
description: >-
  A reusable bacterial pathway in which a stereospecific 2,3-butanediol
  dehydrogenase can supply acetoin to a lipoyl-dependent acetoin-cleaving
  system. AcoA/AcoB E1 cleaves acetoin and reductively acetylates the AcoC
  lipoyl arm, AcoC E2 transfers acetyl to coenzyme A, and an AcoL-like or shared
  E3 reoxidizes the reduced lipoyl arm. The module is species-neutral; concrete
  proteins below are verified exemplars rather than required orthologs.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:7813883
  title: Molecular characterization of the Pseudomonas putida 2,3-butanediol catabolic pathway.
  statement: >-
    PpG2 experiments connect an inducible 2,3-butanediol dehydrogenase to AcoA,
    AcoB, and AcoC in conversion of 2,3-butanediol to central metabolites.
- source_id: PMID:2061286
  title: Identification and molecular characterization of the Alcaligenes eutrophus H16 aco operon genes involved in acetoin catabolism.
  statement: >-
    Protein purification establishes alpha2-beta2 AcoA/AcoB E1 architecture,
    identifies AcoC, and explicitly leaves AcoX function unknown.
- source_id: PMID:8110297
  title: Identification and molecular characterization of the aco genes encoding the Pelobacter carbinolicus acetoin dehydrogenase enzyme system.
  statement: >-
    The Pelobacter system identifies separate AcoA, AcoB, AcoC, and AcoL E1,
    E2, and E3 components and provides a verified E3 exemplar.
- source_id: file:PSEPK/acoC/acoC-deep-research-openscientist.md
  title: OpenScientist gene research for PSEPK acoC
  statement: >-
    The report corroborates the locus and E2/lipoyl-domain interpretation;
    unvalidated structural and regulatory predictions were not promoted to module claims.
notes: >-
  AcoX is locus-associated accessory context, not a catalytic part, because its
  biochemical function remains unknown. Pseudomonas KT2440 does not encode an
  obvious acoL in PP_0552-PP_0556, so the exact E3 paralog is a residual gap.
  Completed OpenScientist artifacts were present only for acoC. No gene reports
  for bdhA, acoA, acoB, or PP_0556 and no generic module or
  module+pathway+taxon report were found after the completed research attempts;
  those jobs were not restarted. The curated boundary therefore rests on
  cached primary literature, GOA/UniProt, and verified cross-taxon exemplars.
