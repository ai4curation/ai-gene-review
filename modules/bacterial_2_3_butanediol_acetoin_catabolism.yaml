references:
- id: PMID:1898934
  title: Purification and characterization of acetoin:2,6-dichlorophenolindophenol oxidoreductase, dihydrolipoamide
    dehydrogenase, and dihydrolipoamide acetyltransferase of the Pelobacter carbinolicus acetoin dehydrogenase
    enzyme system.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: Purified native Pelobacter E1, E2 and E3 reconstitute acetoin-dependent CoA-coupled NAD reduction.
    supporting_text: The combination of purified Ao:DCPIP OR, DHLTA, and DHLDH in the presence of thiamine
      pyrophosphate and the substrate acetoin or methylacetoin resulted in a coenzyme A-dependent reduction
      of NAD.
  - statement: DCPIP is an artificial acceptor used to assay E1 cleavage; this assay does not itself demonstrate
      native lipoyl transfer.
    supporting_text: In vitro in the presence of DCPIP, it catalyzed a thiamine pyrophosphate-dependent oxidative-hydrolytic
      cleavage of acetoin, methylacetoin, and diacetyl.
  - statement: Purified native Pelobacter E3 uses NAD(H), supporting its redox regeneration role.
    supporting_text: DHLDH had a native Mr of 110,000, consisted of two identical subunits of Mr 54,000, and
      reacted only with NAD(H) as a coenzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Accessible abstract directly reports purified components, artificial-acceptor assay and native
      reconstitution. Full-text recovery attempts failed; unreported assay details are not inferred.
- id: PMID:8110297
  title: Identification and molecular characterization of the aco genes encoding the Pelobacter carbinolicus
    acetoin dehydrogenase enzyme system.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: N-terminal sequences link the purified Pelobacter components to the acoABCL genes.
    supporting_text: Use of oligonucleotide probes, which were deduced from the N-terminal sequences of the
      purified enzyme components, identified the structural genes for the alpha and beta subunits of E1 (acetoin:2,6-dichlorophenolindophenol
      oxidoreductase), E2 (dihydrolipoamide acetyltransferase), and E3 (dihydrolipoamide dehydrogenase) of
      the Pelobacter carbinolicus acetoin dehydrogenase enzyme system, which were designated acoA, acoB, acoC,
      and acoL, respectively.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract directly maps purified N termini to component genes; source accession/strain provenance
      is separately retained in member notes.
- id: PMID:2061286
  title: Identification and molecular characterization of the Alcaligenes eutrophus H16 aco operon genes involved
    in acetoin catabolism.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: Native H16 E1 purification supports an alpha/beta assembly; alpha2 beta2 stoichiometry is the
      authors' favored interpretation.
    supporting_text: Ao:DCPIP OR consisted of alpha and beta subunits (Mrs, 35,500 and 36,000, respectively),
      and a tetrameric alpha 2 beta 2 structure was most likely for the native protein.
  - statement: The H16 AcoC E2 assignment rests on sequence homology of the purified fast-migrating protein,
      rather than a gene-specific acetyltransferase assay in the accessible abstract.
    supporting_text: whereas those deduced from acoC for FMP (Mr, 38,941) revealed homology to the dihydrolipoamide
      acetyltransferase of Escherichia coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Accessible abstract supports native E1 and FMP identification. FMP/E2 is sequence-based.
      Current curated sequences include subsequent revisions.
- id: PMID:7813883
  title: Molecular characterization of the Pseudomonas putida 2,3-butanediol catabolic pathway.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: PpG2 induces butanediol dehydrogenase and acetoin-cleaving activity on either carbon source.
    supporting_text: The 2,3-butanediol dehydrogenase and the acetoin-cleaving system were simultaneously induced
      in Pseudomonas putida PpG2 during growth on 2,3-butanediol and on acetoin.
  - statement: PpG2 AcoABC subunit assignments were supported by comparative sequence evidence.
    supporting_text: The amino acid sequences deduced from acoA, acoB, and acoC for E1 alpha (M(r) 34639),
      E1 beta (M(r) 37268), and E2 (M(r) 39613) of the P. putida acetoin cleaving system exhibited striking
      similarities to those of the corresponding components of the A. eutrophus acetoin cleaving system and
      of the acetoin dehydrogenase enzyme system of Pelobacter carbinolicus and other bacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract supports induction, locus and comparative sequence evidence. No gene-specific PpG2
      AcoC transfer or matched NADP specificity assay is asserted.
- id: PMID:34513815
  title: Dehydrogenation Mechanism of Three Stereoisomers of Butane-2,3-Diol in Pseudomonas putida KT2440.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: Purified KT2440 PP0552 catalyzes NAD-linked oxidation of R,R and meso butanediol.
    supporting_text: For the oxidative reaction, R,R-BDH can catalyze NAD-dependent dehydrogenation of (2R,3R)-2,3-BDO
      and meso-2,3-BDO.
  - statement: PP0552 is needed for efficient R,R/meso butanediol utilization but dispensable when acetoin
      is provided, supporting an optional entry step.
    supporting_text: the disruption of pp0552 had no effect on the ability of P. putida KT2440 (Δpp0552) to
      grow in racemic AC and pyruvate but impaired its ability to utilize meso-2,3-BDO and (2R,3R)-2,3-BDO.
  - statement: Native double deletion prevents S,S-butanediol use with or without lanthanum, while the three-entry-enzyme
      deletion can still use acetoin.
    supporting_text: Double-knockout strain P. putida KT2440 (ΔpedEΔpedH) was completely unable to utilize
      (2S,3S)-2,3-BDO both in the presence and absence of La3+ (Figures 5C,D) and there might be no other alcohol
      dehydrogenase catalyzing dehydrogenation of (2S,3S)-2,3-BDO in the strain. PedE and PedH function redundantly
      in (2S,3S)-2,3-BDO catabolism, but work under different conditions. The triple-knockout strain P. putida
      KT2440 (Δpp0552ΔpedEΔpedH) grew normally in AC (Figure 5E) and pyruvate (Figure 5F), while lost growth
      ability in either stereoisomer of 2,3-BDO (Figures 5A–D). Thus, P. putida KT2440 uses R,R-BDH, PedH,
      and PedE to utilize different 2,3-BDO stereoisomers.
  - statement: The S,S entry reaction supplies S-acetoin upstream of acetoin cleavage.
    supporting_text: PedE and PedH catalyze the irreversible dehydrogenation of (2S,3S)-2,3-BDO into (3S)-AC.
  reference_review:
    relevance: HIGH
    correctness: DISPUTED
    review_notes: Full text; exact PP0552 constructs, purified assays and native deletion phenotypes establish
      R,R/meso NAD-BDH entry. Table 2 has no detected NADP(H) activity; S,S entry is separate. One discussion
      sentence reverses the direction of the lanthanide switch; native growth results and the original 2017
      switch study support PedH under lanthanides and PedE without them. The inconsistent sentence is not used
      as regulatory evidence.
- id: PMID:36482024
  title: The acetoin assimilation pathway of Pseudomonas putida KT2440 is regulated by overlapping global regulatory
