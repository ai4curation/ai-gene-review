id: MODULE:bacterial_2_3_butanediol_acetoin_catabolism
title: Bacterial lipoyl-dependent acetoin and stereoisomer-specific butanediol catabolism
description: Lipoyl-dependent acetoin cleavage produces acetaldehyde and acetyl-CoA through an AcoA/AcoB E1
  reaction, AcoC acetyl transfer and E3-mediated carrier regeneration. NAD-dependent R,R/meso oxidation and
  metal-dependent PQQ-mediated S,S-butanediol oxidation can supply acetoin upstream. The compared bacterial
  implementations differ in E2 architecture, availability of a dedicated E3 and strength of direct biochemical
  evidence. Native systems are kept separate; the bacterial envelope does not imply universal conservation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:17558661
  statement: The bacterial review distinguishes competing acetoin-cleavage accounts and motivates an explicit
    acetoin-dehydrogenase boundary.
  supporting_text: then we discuss the relationship between the two conflicting acetoin cleavage pathways,
    the enzymes of the acetoin dehydrogenase enzyme system, major genes involved in acetoin degradation, and
    the CcpA mediated acetoin catabolite repression pathway;
- source_id: PMID:1898934
  statement: Purified native Pelobacter E1, E2 and E3 reconstitute acetoin-dependent CoA-coupled NAD reduction.
  supporting_text: The combination of purified Ao:DCPIP OR, DHLTA, and DHLDH in the presence of thiamine pyrophosphate
    and the substrate acetoin or methylacetoin resulted in a coenzyme A-dependent reduction of NAD.
- source_id: PMID:20508247
  statement: The review distinguishes acetoin cleavage from pyruvate decarboxylation and describes reductive
    acylation of E2-bound lipoamide.
  supporting_text: This intermediate collapses, releasing acetaldehyde and leaving TPP with an activated hydroxyethyl
    group that is poised to acylate the lipoamide cofactor of the E2 subunit.
- source_id: PMID:20508247
  statement: A pathway-linked E3 varies among species; recruitment of a shared E3 where it is absent is explicitly
    a hypothesis.
  supporting_text: The presence of an E3 subunit encoded in this cluster varies by species ( 256 ), and in
    cases where it is absent, a common E3 is presumably shared between the AoDH and the α-ketoacid dehydrogenases.
- source_id: PMID:37644496
  statement: Different BDHs account for different stereoisomers; an enzyme-family name does not establish universal
    substrate specificity.
  supporting_text: This was discovered to be due to the simultaneous presence of multiple butanediol dehydrogenases
    (BDHs) in microorganisms, and AC and BD can be interconverted under BDH catalysis.
notes: The boundary is acetoin cleavage plus the explicitly characterized optional NAD/PQQ entry routes, not
  acetoin synthesis or downstream acetaldehyde assimilation. AcoX/PP0556 is reviewed as locus-associated context
  but is not asserted to catalyze a step. Regulatory AcoR and lipoylation biosynthesis remain outside the core.
  Exact native selectors prevent mixed-species complexes; family descriptors classify proteins rather than
  asserting substrate-specific function for every family member. PpG2 Adh/AcoC are comparative exemplars, not
  a completed fifth native route.
