- id: PMID:20508247
  title: Lipoic acid metabolism in microbial pathogens.
  publication_type: REVIEW
  findings:
  - statement: The review distinguishes acetoin cleavage from pyruvate decarboxylation and describes reductive
      acylation of E2-bound lipoamide.
    supporting_text: This intermediate collapses, releasing acetaldehyde and leaving TPP with an activated
      hydroxyethyl group that is poised to acylate the lipoamide cofactor of the E2 subunit.
  - statement: A pathway-linked E3 varies among species; recruitment of a shared E3 where it is absent is explicitly
      a hypothesis.
    supporting_text: The presence of an E3 subunit encoded in this cluster varies by species ( 256 ), and in
      cases where it is absent, a common E3 is presumably shared between the AoDH and the α-ketoacid dehydrogenases.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review; mechanistic and cross-species overview. Shared E3 is qualified as presumptive,
      and generic E2 structural discussion is not transferred uncritically to the distinct hydrolase AcoC lineage.
- id: PMID:17558661
  title: Acetoin metabolism in bacteria.
  publication_type: REVIEW
  findings:
  - statement: The bacterial review distinguishes competing acetoin-cleavage accounts and motivates an explicit
      acetoin-dehydrogenase boundary.
    supporting_text: then we discuss the relationship between the two conflicting acetoin cleavage pathways,
      the enzymes of the acetoin dehydrogenase enzyme system, major genes involved in acetoin degradation,
      and the CcpA mediated acetoin catabolite repression pathway;
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Abstract-only integrated review; used for historical pathway boundary, not detailed molecular
      assignments.
- id: PMID:37644496
  title: Mechanism of microbial production of acetoin and 2,3-butanediol optical isomers and substrate specificity
    of butanediol dehydrogenase.
  publication_type: REVIEW
  findings:
  - statement: Different BDHs account for different stereoisomers; an enzyme-family name does not establish
      universal substrate specificity.
    supporting_text: This was discovered to be due to the simultaneous presence of multiple butanediol dehydrogenases
      (BDHs) in microorganisms, and AC and BD can be interconverted under BDH catalysis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review focuses on production/stereochemistry. Used to delimit BDH substrate generalization;
      native catabolic roles come from primary studies.
- id: PMID:28655819
  title: Functional Role of Lanthanides in Enzymatic Activity and Transcriptional Regulation of Pyrroloquinoline
    Quinone-Dependent Alcohol Dehydrogenases in Pseudomonas putida KT2440.
  publication_type: PRIMARY_RESEARCH
  findings:
  - statement: Purified PedH requires tested lanthanides and PedE is its calcium-dependent counterpart.
    supporting_text: enzyme activity on a range of substrates similar to that of its Ca2+-dependent counterpart
      PedE (PP_2674), including linear and aromatic primary and secondary alcohols, as well as aldehydes, but
      only in the presence of lanthanide ions, including La3+, Ce3+, Pr3+, Sm3+, or Nd3+
  - statement: Purified activities were measured with PMS/DCPIP artificial electron acceptors; native electron-transfer
      partner identity is not established by this assay.
    supporting_text: 500 µM phenazine methosulfate (PMS), 150 µM 2,6-dichlorophenol indophenol (DCPIP), 25
      mM imidazole, 1 mM CaCl2 for PedE or 1 µM PrCl3 for PedH, 1 µM PQQ for PedE or 50 µM PQQ for PedH, 12.5
      µl of substrate, and 2.5 to 20 µg/ml enzyme.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary study; distinguishes metal-dependent purified activity and native expression.
      Artificial acceptor assays do not identify the native electron-transfer partner.
