id: MODULE:dmel_toll_signaling
title: Toll signaling pathway in Drosophila melanogaster
description: >-
  The Toll pathway is activated when an extracellular serine protease cascade cleaves the
  pro-domain of the cytokine-like ligand Spaetzle, allowing it to bind the Toll receptor.
  In the early embryo, a maternally supplied cascade (Gastrulation defective, Snake and Easter),
  spatially restricted by the Pipe sulfotransferase in the ventral follicle cells, generates
  ventral Spaetzle and establishes the dorsal-ventral axis. In the immune response, pattern-recognition
  proteins (PGRP-SA, GNBP1, GNBP3) and the virulence sensor Persephone activate ModSP, Grass
  and Hayan, converging on the Spaetzle-processing enzyme. Activated Toll recruits the adaptors
  MyD88 and Tube and the kinase Pelle, which lead to degradation of the IkB protein Cactus
  and nuclear entry of the NF-kappaB factors Dorsal and Dif. Related Toll receptors such as
  Toll-7, bound by neurotrophin-like Spaetzle family ligands, act in the nervous system.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001054
  title: 'FlyBase gene group DORS: Dorsal group'
  statement: >-
    FlyBase release FB2026_03 groups 11 D. melanogaster genes as dorsal group (DORS); this
    module models that group.
- source_id: FB:FBgg0001059
  title: 'FlyBase gene group TL-CAN: Toll signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 80 D. melanogaster genes as toll signaling pathway (TL-CAN);
    this module models that group.
- source_id: GO:0008063
  title: Toll signaling pathway
  statement: >-
    GO term grounding the module as Toll signaling pathway.
notes: >-
  Boundary. The module combines the FlyBase dorsal group and the Toll pathway core subgroups.
  Windbeutel (wbl) is a dorsal-group member that acts as an ER chaperone for Pipe. The IkB
  protein Cactus is in the FlyBase negative regulator set and is therefore not modelled as
  a part, although it is the direct target of the pathway; serpins (Spn27A, Necrotic, Spn88Ea)
  are likewise regulators. PGRP-SC amidases scavenge peptidoglycan and may dampen rather than
  drive signaling. FlyBase groups realized by this module: DORS (FBgg0001054), TL-CAN (FBgg0001059).
  Subgroups folded into it: TL-SPZC, TL-NFC. FlyBase also curates regulator sets for this
  pathway, which are context and not modelled as parts: TL-NFN (negative regulators of toll-nf-kappab
  signaling pathway, 19 genes); TL-SPZN (negative regulators of spatzle activating pathway,
  4 genes); TL-NFP (positive regulators of toll-nf-kappab signaling pathway, 23 genes). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_toll_signaling.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
