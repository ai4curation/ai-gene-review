id: MODULE:ccr7_chemokine_signaling
title: CCL19/CCL21 - CCR7 chemokine signaling pathway module
description: >-
  The homeostatic CC chemokines CCL19 (ELC, MIP-3-beta) and CCL21 (SLC,
  6Ckine), secreted by stromal cells of the T-cell zones and high endothelial
  venules of secondary lymphoid organs, are the two physiological agonists of
  the G protein-coupled receptor CCR7. CCR7 on naive T cells, B cells and
  mature dendritic cells binds either chemokine and couples to Gi-dependent
  signaling (calcium mobilization, MAPK and PI3K/Akt activation) that drives
  chemotaxis, bringing lymphocytes and antigen-bearing dendritic cells together
  in the T-cell zone.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0038118
    title: C-C chemokine receptor CCR7 signaling pathway
    statement: >-
      The module is grounded in the GO biological process term for the C-C
      chemokine receptor CCR7 signaling pathway (a child of GO:0070098
      chemokine-mediated signaling pathway), whose ligand-specific children are
      GO:0038119 CCL19-activated CCR7 signaling pathway and GO:0038120
      CCL21-activated CCR7 signaling pathway.
  - source_id: PMID:9153236
    title: Molecular cloning of a novel human CC chemokine EBI1-ligand chemokine that is a specific functional ligand for EBI1, CCR7.
    statement: >-
      Identifies human CCL19 (ELC) as a specific ligand of the orphan receptor
      EBI1 that induces calcium mobilization and chemotaxis in EBI1-expressing
      cells, and proposes EBI1 be designated CCR7.
    supporting_text: >-
      ELC-Flag-induced transient calcium mobilization and chemotactic responses in
      EBI1-transfected cells.
  - source_id: PMID:9507024
    title: Secondary lymphoid-tissue chemokine is a functional ligand for the CC chemokine receptor CCR7.
    statement: >-
      Shows that human CCL21 (SLC) is a high-affinity functional ligand of
      CCR7 that shares the receptor with CCL19 (ELC) in binding, calcium
      mobilization and chemotaxis assays.
    supporting_text: >-
      Here, we show that SLC is a high affinity functional ligand for chemokine
      receptor 7 (CCR7) that is expressed on T and B lymphocytes and a known
      receptor for ELC.
  - source_id: PMID:14592837
    title: CCL19/CCL21-triggered signal transduction and migration of dendritic cells requires prostaglandin E2.
    statement: >-
      Reference behind the IDA annotations of human CCL19, CCL21 and CCR7 to
      GO:0038119 and GO:0038120; CCL19 and CCL21 trigger CCR7-dependent PI3K/Akt
      signaling, calcium flux and PLC-dependent migration of mature monocyte-
      derived dendritic cells.
    supporting_text: >-
      Activated DCs home to lymphoid organs, where the CCR7 ligands CCL19 and
      CCL21 are expressed.
  - source_id: PMID:15778365
    title: The chemokine receptor CCR7 activates in dendritic cells two signaling modules that independently regulate chemotaxis and migratory speed.
    statement: >-
      CCR7 in dendritic cells signals through Gi to the MAPKs ERK1/2, JNK and
      p38, which control chemotaxis, and through Rho/Pyk2/cofilin, which
      controls migratory speed.
    supporting_text: >-
      We found that CCR7 induced a G(i)-dependent activation of MAPK members
      ERK1/2, JNK, and p38, with ERK1/2 and p38 controlling JNK.
  - source_id: PMID:10520991
    title: CCR7 coordinates the primary immune response by establishing functional microenvironments in secondary lymphoid organs.
    statement: >-
      Ccr7-deficient mice have impaired lymphocyte migration, disorganized
      secondary lymphoid organs, and mature skin dendritic cells that fail to
      reach draining lymph nodes.
    supporting_text: >-
      Upon activation, mature skin dendritic cells fail to migrate into the
      draining lymph nodes.
  - source_id: PMID:9927507
    title: Mice lacking expression of secondary lymphoid organ chemokine have defects in lymphocyte homing and dendritic cell localization.
    statement: >-
      plt mice, which lack lymphoid CCL21 (SLC) expression, fail to home naive
      T cells to lymph nodes and fail to accumulate dendritic cells in T-cell
      zones.
    supporting_text: >-
      These findings suggest that the abnormalities in plt mice
      are due to a genetic defect in the expression of SLC and that SLC mediates the
      entry of naive T cells and antigen-stimulated DCs into the T cell zones of
      secondary lymphoid organs.
  - source_id: PANTHER:PTN000245709
    title: PAINT node PTN000245709 for CC chemokines (CCL19, CCL21)
    statement: >-
      Local PAINT IBD node in PTHR12015 (node taxon not recorded in paint.tsv)
      asserting C:GO:0005576, F:GO:0008009, F:GO:0048020, P:GO:0006954,
      P:GO:0030335, P:GO:0060326, P:GO:0061844 and P:GO:0070098. Human CCL19
      (UniProtKB:Q99731) and CCL21 (UniProtKB:O00585) are among the seeds of
      F:GO:0008009 and P:GO:0070098, as are mouse Ccl19 (MGI:1346316) and
      Ccl21a (MGI:1349183).
  - source_id: PANTHER:PTN002573880
    title: PAINT node PTN002573880 for CCR7
    statement: >-
      Local PAINT IBD node in PTHR10489 (node taxon NCBITaxon:117571
      Euteleostomi, PAINT date 20200312) asserting F:GO:0035757 chemokine
      (C-C motif) ligand 19 binding, F:GO:0035758 chemokine (C-C motif) ligand
      21 binding and F:GO:0038117 C-C motif chemokine 19 receptor activity,
      each seeded only by human CCR7 (UniProtKB:P32248).
  - source_id: PANTHER:PTN001628461
    title: PAINT node PTN001628461 for chemokine receptors (CCR7 among seeds)
    statement: >-
      Local PAINT IBD node in PTHR10489 asserting C:GO:0009897, F:GO:0016493,
      F:GO:0019957, P:GO:0006955, P:GO:0007204, P:GO:0019722 and P:GO:0060326;
      human CCR7 (UniProtKB:P32248) and mouse Ccr7 (MGI:103011) seed
      F:GO:0016493.
notes: >-
  Boundary. Two-step ligand-first module: a secreted CCR7 agonist (variant set
  of CCL19 or CCL21) and the receptor CCR7 on the responding cell. Downstream
  Gi heterotrimer, PI3K/Akt, PLC/calcium, MAPK and Rho/Pyk2/cofilin effectors
  (PMID:14592837, PMID:15778365) are generic chemokine-receptor effectors
  shared with modules/chemokine_signaling.yaml and are not modelled as parts.
  The representative members (human CCL19, CCL21 and CCR7; mouse Ccl19,
  Ccl21a/Ccl21b/Ccl21c and Ccr7) are examples, not a species scope. Mouse
  carries several Ccl21 paralogs (Ccl21a, P84444; Ccl21b, P86792; Ccl21c,
  P86793; all in PTHR12015:SF72 per their UniProt PANTHER cross-references);
  the mouse plt mutation (PMID:9927507) abolishes lymphoid SLC/CCL21
  expression and is a natural CCL21-deficiency model.

  Out of scope. (1) The atypical chemokine receptor ACKR4 (CCRL1, CCX-CKR)
  binds CCL19 and CCL21 but does not signal through G proteins; it is a
  scavenger that shapes chemokine gradients and is a regulator outside the
  signaling core, not an alternative receptor. (2) CCL21 carries a basic
  C-terminal extension that binds glycosaminoglycans and immobilizes it on
  stromal and endothelial surfaces (CCL19 lacks this tail); this affects
  gradient formation and haptotaxis but is not a step of receptor
  signaling. Neither has a cached primary reference here, so they are noted
  without citation.

  Taxon scope. Euteleostomi (NCBITaxon:117571), the placement of the
  CCR7-specific PAINT node PTN002573880; the ligand chemokine-activity node
  PTN000245709 in PTHR12015 has no taxon recorded in the local paint.tsv.

  Ligand function term. Following projects/LIGANDS_IN_SIGNALING.md section 2,
  both ligand variants use GO:0008009 chemokine activity (an is_a child of
  GO:0005125 cytokine activity and of GO:0048018 receptor ligand activity),
  not the receptor-specific binding term GO:0031732 CCR7 chemokine receptor
  binding. In GOA (QuickGO, 2026-11-23) human CCL19 and CCL21 carry
  GO:0031732 only by ISS (from mouse O70460 and P84444 respectively), and
  carry GO:0008009 by IDA (PMID:15778365; CCL21 also PMID:18308860) and IBA
  (PTN000245709). PTN000245709 additionally asserts F:GO:0048020 CCR
  chemokine receptor binding, a receptor-binding term that by the same
  decision should be read as the ligand activity GO:0008009 it already
  carries. No gene reviews exist yet for CCL19, CCL21 or CCR7.

  Receptor function term. The receptor step uses GO:0016493 C-C chemokine
  receptor activity because one CCR7 receptor serves both ligands; its
  ligand-specific children GO:0038117 C-C motif chemokine 19 receptor activity
  (IDA PMID:9507024; IBA PTN002573880) and GO:0038121 C-C motif chemokine 21
  receptor activity (IDA PMID:9507024) are carried by human CCR7 in GOA.

  GO-CAM check (2026-11-23). No production GO-CAM in gocams/ contains CCL19,
  CCL21 (or mouse Ccl21a/b/c), or CCR7, so the module has no
  gocam_associations. Queries on gocams/index.tsv (12,592 rows): UniProt
  accessions Q99731, O00585, P32248, O70460, P84444, P86792, P86793, P47774
  and MGI ids MGI:1346316, MGI:1349183, MGI:1349182, MGI:1891386,
  MGI:103011 returned no rows; gene_label symbols CCL19, CCL21, CCL21A/B/C,
  CCR7 returned no rows; GO ids GO:0038115, GO:0038116, GO:0038117,
  GO:0038118, GO:0038119, GO:0038120, GO:0038121, GO:0035757, GO:0035758,
  GO:0031732 and GO:0048020 returned no rows. The same identifiers grepped
  across every gocams/*/*-src.yaml returned no files. Positive controls: CXCL8
  (P10145) and CXCR2 (P25025) are found in model 6246724f00001114
  (IL8-mediated signaling pathway (Human)), and GO:0016493 C-C chemokine
  receptor activity returns rows for CCR1-CCR5 and CXCR3 in other models, so
  the queries can return positives. Other CC chemokine-receptor pairs are
  modelled (for example CCL17/CCL22-CCR4, CCL11/CCL24/CCL26-CCR3,
  CCL2-CCR2, CCL1-CCR8), so a CCL19/CCL21-CCR7 model would be a curation gap
  in GO-CAM, not a modelling convention.
module:
  id: ccr7_chemokine_signaling
  label: CCL19/CCL21 - CCR7 chemokine signaling pathway
  module_type: SIGNALING_PATHWAY
  description: >-
    A secreted CCR7 agonist, CCL19 or CCL21, binds CCR7 on a responding T
    cell, B cell or mature dendritic cell and activates Gi-coupled signaling
    that directs migration into the T-cell zone of secondary lymphoid organs.
  concepts:
    - preferred_term: C-C chemokine receptor CCR7 signaling pathway
      term:
        id: GO:0038118
        label: C-C chemokine receptor CCR7 signaling pathway
      description: >-
        Signaling initiated by CCR7 binding one of its physiological ligands,
        CCL19 (GO:0038119) or CCL21 (GO:0038120).
  context:
    taxa:
      - preferred_term: Euteleostomi
        term:
          id: NCBITaxon:117571
          label: Euteleostomi
    cellular_components:
