        term:
          id: GO:0005576
          label: extracellular region
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
  parts:
    - order: 1
      role: CCR7 agonist chemokine
      node:
        id: ccr7_ligand
        label: Secreted CCR7 agonist chemokine (CCL19 or CCL21)
        module_type: REGULATORY_STEP
        description: >-
          Either of two homeostatic CC chemokines, CCL19 or CCL21, secreted by
          lymphoid stromal cells, acts as the agonist for CCR7.
        variant_sets:
          - id: ccr7_agonist
            label: CCR7 agonist chemokine
            axis: CC chemokine ligand paralog
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            notes: >-
              CCL19 and CCL21 are paralogous CC chemokines (32% amino acid
              identity, adjacent genes at human 9p13) that fully share CCR7 in
              binding, calcium mobilization and chemotaxis assays
              (PMID:9507024). Either one satisfies the ligand step.
            evidence:
              - source_id: PMID:9507024
                statement: >-
                  CCL21 (SLC) and CCL19 (ELC) are equivalent CCR7 agonists in
                  cross-desensitization, cross-competition and chemotaxis.
                supporting_text: >-
                  When assessed using CCR7-transfected L1.2 cells, SLC and ELC
                  were essentially equivalent in terms of cross desensitization in
                  calcium mobilization via CCR7, cross-competition in binding to
                  CCR7, and induction of chemotaxis via CCR7.
            variants:
              - id: ccl19_ligand
                label: CCL19 (ELC, MIP-3-beta)
                module_type: REGULATORY_STEP
