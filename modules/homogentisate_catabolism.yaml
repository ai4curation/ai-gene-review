id: MODULE:homogentisate_catabolism
title: Homogentisate catabolism
description: >-
  A conserved three-reaction lower pathway that opens the aromatic ring of
  homogentisate to form maleylacetoacetate, isomerizes maleylacetoacetate to
  fumarylacetoacetate, and hydrolyzes fumarylacetoacetate to fumarate and
  acetoacetate. The same three enzyme families (homogentisate
  1,2-dioxygenase, zeta-class glutathione transferase-type maleylacetoacetate
  isomerase, and fumarylacetoacetase) carry out these steps in bacteria,
  fungi, plants, and animals. In animals the pathway is the terminal segment
  of phenylalanine and tyrosine catabolism, and loss of homogentisate
  1,2-dioxygenase or fumarylacetoacetase causes alkaptonuria or hereditary
  tyrosinemia type I respectively. In bacteria such as Pseudomonas putida the
  lower pathway also receives homogentisate from 3-hydroxyphenylacetate and
  other aromatic routes. The products, fumarate and acetoacetate, enter
  central carbon metabolism.
status: COMPLETE
scope: ABSTRACT
evidence:
  - source_id: GO:1902000
    title: homogentisate catabolic process
    statement: >-
      GO:1902000 defines the biological-process boundary from homogentisate
      consumption through lower-pathway products.
  - source_id: file:modules/homogentisate_catabolism-deep-research-openscientist.md
    title: OpenScientist research for the reusable homogentisate-catabolism module
    statement: >-
      The module-level review supports the ordered dioxygenase, isomerase and
      hydrolase lower pathway and distinguishes its boundaries from upstream
      aromatic-substrate routes and downstream central metabolism.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__homogentisate_catabolism__ppu00643-deep-research-openscientist.md
    title: OpenScientist PSEPK/ppu00643 homogentisate-catabolism research
    statement: >-
      The KT2440 pathway review finds all three lower-pathway reactions covered
      by the contiguous hmgABC genes and identifies peaE and PP_2932 as
      overview-map artifacts outside the homogentisate module boundary.
  - source_id: PMID:15262943
    title: >-
      The homogentisate pathway: a central catabolic pathway involved in the
      degradation of L-phenylalanine, L-tyrosine, and
      3-hydroxyphenylacetate in Pseudomonas putida.
    statement: >-
      Bacterial exemplar: HmgA, HmgC, and HmgB are the three enzymes that
      convert homogentisate to fumarate and acetoacetate in P. putida, and the
      pathway is shared by phenylalanine, tyrosine and 3-hydroxyphenylacetate
      degradation.
  - source_id: PMID:9417084
    title: >-
      Characterization of a fungal maleylacetoacetate isomerase gene and
      identification of its human homologue.
    statement: >-
      Fungal and human exemplar: the Aspergillus nidulans maiA gene, clustered
      with fahA and hmgA, encodes a glutathione S-transferase-like
      maleylacetoacetate isomerase, and its human homologue (GSTZ1) has MAAI
      activity, showing that the three-enzyme lower pathway is shared by
      fungi and animals.
  - source_id: PMID:8782815
    title: The molecular basis of alkaptonuria.
    statement: >-
      Human HGD is the alkaptonuria gene; loss of homogentisate
      1,2-dioxygenase activity leads to accumulation of homogentisic acid.
  - source_id: PMID:1998338
    title: >-
      Cloning and expression of the cDNA encoding human fumarylacetoacetate
      hydrolase, the enzyme deficient in hereditary tyrosinemia: assignment of
      the gene to chromosome 15.
    statement: >-
      Human FAH encodes the fumarylacetoacetate hydrolase deficient in
      hereditary tyrosinemia, the terminal enzyme of the pathway.
