            participant:
              selector_type: FAMILY
              family:
                preferred_term: zeta-class glutathione transferase-type maleylacetoacetate isomerases (MaiA/HmgC/GSTZ1)
                description: >-
                  No family identifier is asserted. PANTHER PTHR42673 holds
                  E. coli YfcF and YibF, glutathione transferases with no
                  maleylacetoacetate isomerase activity, in the same
                  subfamilies as genuine isomerases (SF21 and SF4), and its
                  PAINT node PTN001344486 propagates GO:0016034 to them; the
                  PTHR42673 family review therefore leaves GO:0016034
                  unresolved at family level. The closer signature is the
                  NCBIfam maiA equivalog TIGR01262 (InterPro IPR005955), which
                  all three representatives match and YfcF and YibF do not,
                  but it still includes the Ralstonia gentisate-pathway
                  maleylpyruvate isomerase NagL, so pathway context (clustering
                  with the dioxygenase and hydrolase genes) is needed to assign
                  the step.
                evidence:
                  - source_id: InterPro:IPR005955
                    title: Glutathione S-transferases, class Zeta
                    statement: >-
                      InterPro family integrating only NCBIfam TIGR01262
                      (maleylacetoacetate isomerase); matched by Q88E49,
                      O43708 and O43123.
                  - source_id: file:interpro/panther/PTHR42673/PTHR42673-review.yaml
                    title: PTHR42673 family review
                    statement: >-
                      Records that GO:0016034 cannot be scoped by PANTHER
                      subfamily because YfcF, YibF and NagL share subfamilies
                      with genuine maleylacetoacetate isomerases, and assesses
                      the PTN001344486 assertions.
                  - source_id: file:PSEPK/hmgC/hmgC-uniprot.txt
                    title: UniProtKB entry Q88E49 for PSEPK HmgC
                    statement: >-
