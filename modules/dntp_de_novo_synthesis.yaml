  notes: >-
    NEW module from the YeastPathways crosswalk (PWY-7220-1, PWY-7222-1,
    YEAST-DE-NOVO-PYRMID-DNT). Scope: class Ia ribonucleotide reduction and
    dNTP formation in eukaryotes, with S. cerevisiae, human and E. coli
    exemplars; no PomBase GO-CAM is listed for this group. Reaction
    assessment: the four NDP reductions are one RNR annoton; the five NDP
    kinase reactions (dADP, dGDP, dCDP, dUDP, dTDP) are YNK1 annotons in parts
    2 and 3. Enzyme corrections: YeastCyc lists a dCTP deaminase reaction
    (DCTP-DEAM-RXN) without a gene - S. cerevisiae has no dCTP deaminase (no
    EC 3.5.4.13 protein in UniProt for S288C) and instead deaminates dCMP with
    DCD1 (PMID:3023902), which the frame omits; DCD1 was added. The dCMP
    kinase reaction (RXN-7913) has no gene in YeastCyc but URA6 in the GO-CAM
    (URA6 phosphorylates CMP/dCMP, PMID:1333436); it supplies dCMP-to-dCDP
    salvage flux and is modelled in pyrimidine_salvage /
    de_novo_pyrimidine_synthesis rather than here. CDC8 dUMP kinase
    (RXN-14122) is a minor side activity (PMID:6094555). The formate-dependent
    class III reductase reactions RXN0-745/RXN0-746 listed by YeastCyc with
    no gene do not exist in yeast. GO-CAM disagreements: activities are
    filed under unrelated processes (GO:0046085 adenosine metabolic process,
    GO:0106387 'de novo' GMP biosynthesis, GO:0006207 pyrimidine nucleobase
    biosynthesis) rather than deoxyribonucleotide biosynthesis; CDC21 is
    placed in cytosol whereas the reviewed location is the nuclear
    periphery; URA6 carries the obsolete GO:0004127. The RNR is enabled by SGD
    complex entities CPX-1102 and CPX-1103 (Rnr1- and Rnr3-containing
    holoenzymes). Out of scope: thioredoxin/glutaredoxin reduction of RNR
    (TRX1/TRX2, TRR1), regulation by the Mec1-Rad53-Dun1 checkpoint, the Sml1
    and Dif1 regulators and Crt1 repression (regulatory, not catalytic
    steps), class II and III reductases, the human p53-inducible RRM2B small
    subunit and mitochondrial salvage (mitochondrial_dntp_supply), and
    deoxynucleoside salvage (pyrimidine_salvage). The dTTP branch overlaps
    thymidylate_synthesis (human DUT/TYMS/DTYMK; folded into this module in
    the crosswalk). Thymidylate synthase is the only native dTMP source in
    budding and fission yeast, which lack thymidine kinase (PMID:14500848,
    PMID:15157888).
