id: MODULE:dntp_de_novo_synthesis
title: De novo deoxyribonucleoside triphosphate synthesis by class I ribonucleotide reductase
description: >-
  De novo formation of the four DNA precursors dATP, dGTP, dCTP and dTTP from
  ribonucleoside diphosphates in eukaryotes and other organisms with a class
  I (oxygen-dependent) ribonucleotide reductase. The reductase replaces the
  2'-hydroxyl of ADP, GDP, CDP and UDP with hydrogen using electrons from
  thioredoxin or glutaredoxin; its large (alpha) subunit binds substrates and
  the allosteric effectors that balance the four products, and its small
  (beta) subunit carries the di-iron tyrosyl radical cofactor. In budding
  yeast the active enzyme is an alpha2 homodimer of Rnr1 (or the damage-induced
  Rnr3) with a beta heterodimer of the radical-bearing Rnr2 and the
  catalytically inactive but essential Rnr4. Nucleoside-diphosphate kinase
  then phosphorylates dADP, dGDP and dCDP to the triphosphates. dTTP cannot be
  made by direct reduction: dUMP is produced either by hydrolysis of dUTP by
  dUTP diphosphatase, which also keeps dUTP out of DNA, or by deamination of
  dCMP by dCMP deaminase; thymidylate synthase then methylates dUMP to dTMP
  with 5,10-methylenetetrahydrofolate, dTMP kinase makes dTDP and
  nucleoside-diphosphate kinase makes dTTP. Activity and subunit levels are
  tightly controlled by the cell cycle and the DNA damage checkpoint. Class II
  (adenosylcobalamin) and class III (anaerobic, glycyl-radical) reductases of
  prokaryotes, deoxynucleoside salvage and the mitochondrial dNTP supply
  pathway of animals are outside the module.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY-7220-1
    title: adenosine deoxyribonucleotides de novo biosynthesis II (S. cerevisiae, SGD YeastPathways)
    statement: >-
      ADP reduction by RNR1-RNR4 and dADP phosphorylation by YNK1. Also lists a
      gene-less formate-dependent class III reductase reaction (RXN0-745)
      that does not occur in yeast.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-7220-1
  - source_id: YeastPathways:PWY-7222-1
    title: guanosine deoxyribonucleotides de novo biosynthesis II (S. cerevisiae, SGD YeastPathways)
    statement: GDP reduction and dGDP phosphorylation; gene-less class III reaction RXN0-746 as above.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-7222-1
  - source_id: YeastPathways:YEAST-DE-NOVO-PYRMID-DNT
    title: de novo biosynthesis of pyrimidine deoxyribonucleotides (S. cerevisiae, SGD YeastPathways)
    statement: >-
      CDP and UDP reduction, NDP kinase (YNK1), DUT1, CDC21, CDC8 (dTMP and
      dUMP kinase), a gene-less dCMP kinase reaction (URA6 in the GO-CAM) and a
      gene-less dCTP deaminase reaction. S. cerevisiae has no dCTP deaminase;
      it deaminates dCMP with DCD1, which the frame omits.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=YEAST-DE-NOVO-PYRMID-DNT
  - source_id: GO:0009263
    title: deoxyribonucleotide biosynthetic process
    statement: Module-level process term for reduction of NDPs and formation of the dNTPs.
  - source_id: GO:0006235
    title: dTTP biosynthetic process
    statement: Process term for the dUMP-to-dTTP branch.
  - source_id: PMID:2199320
    title: Two genes differentially regulated in the cell cycle and by DNA-damaging agents encode alternative regulatory subunits of ribonucleotide reductase.
    statement: >-
      RNR1 (essential, cell-cycle regulated) and RNR3 (non-essential, strongly
      DNA-damage inducible) encode alternative large subunits.
  - source_id: PMID:11893751
    title: Yeast DNA damage-inducible Rnr3 has a very low catalytic activity strongly stimulated after the formation of a cross-talking Rnr1/Rnr3 complex.
    statement: Rnr3 alone has under 1% of Rnr1 activity but is activated in an Rnr1/Rnr3 heterodimer.
  - source_id: PMID:9315671
    title: Rnr4p, a novel ribonucleotide reductase small-subunit protein.
    statement: Rnr4p lacks iron ligands and is catalytically inactive but is required for RNR activity.
  - source_id: PMID:9315670
    title: Identification of RNR4, encoding a second essential small subunit of ribonucleotide reductase in Saccharomyces cerevisiae.
    statement: RNR2 and RNR4 are both essential, non-interchangeable and coimmunoprecipitate.
  - source_id: PMID:12732713
    title: Subcellular localization of yeast ribonucleotide reductase regulated by the DNA replication and damage checkpoint pathways.
    statement: >-
      Rnr1 and Rnr3 are predominantly cytoplasmic, whereas Rnr2 and Rnr4 are
      nuclear and redistribute to the cytoplasm in S phase or after DNA damage.
  - source_id: PMID:16537480
    title: Structures of eukaryotic ribonucleotide reductase I define gemcitabine diphosphate binding and subunit assembly.
    statement: Structural basis of the yeast Rnr1 large subunit and its assembly with the small subunit.
  - source_id: PMID:1659321
    title: 'Saccharomyces cerevisiae nucleoside-diphosphate kinase: purification, characterization, and substrate specificity.'
    statement: Yeast NDP kinase phosphorylates dTDP, dUDP, dGDP, dCDP and dADP as well as ribonucleotides.
  - source_id: PMID:8223452
    title: dUTP pyrophosphatase is an essential enzyme in Saccharomyces cerevisiae.
    statement: >-
      DUT1 is essential; dut1 nulls survive only with exogenous dTMP, and death
      results from uracil incorporation into DNA.
  - source_id: PMID:21548881
    title: Structure and activity of the Saccharomyces cerevisiae dUTP pyrophosphatase DUT1, an essential housekeeping enzyme.
    statement: Biochemical and structural characterisation of DUT1 dUTP hydrolysis.
  - source_id: PMID:3023902
    title: Sequence and expression of the dCMP deaminase gene (DCD1) of Saccharomyces cerevisiae.
    statement: DCD1 encodes dCMP deaminase; dcd1 dmp1 haploids are dUMP auxotrophs.
  - source_id: PMID:6094555
    title: Characterization of Saccharomyces cerevisiae thymidylate kinase, the CDC8 gene product. General properties, kinetic analysis, and subcellular localization.
    statement: >-
      CDC8 thymidylate kinase phosphorylates dTMP (and dUMP more weakly) and is
      found in the nuclear and cytoplasmic fraction but not in mitochondria.
  - source_id: file:yeast/CDC21/CDC21-ai-review.yaml
    title: S. cerevisiae CDC21 gene review
    statement: >-
      CDC21 core function is thymidylate synthase activity (GO:0004799) at the
      nuclear periphery, part of dTMP biosynthesis.
  - source_id: PMID:14500848
    title: Reconstitution of an efficient thymidine salvage pathway in Saccharomyces cerevisiae.
    statement: >-
      cdc21 deletion strains depend entirely on exogenous thymidine only when
      a heterologous nucleoside kinase and transporter are supplied, showing
      that thymidylate synthase is the sole native dTMP source.
  - source_id: PMID:15157888
    title: In vivo labeling of fission yeast DNA with thymidine and thymidine analogs.
    statement: >-
      Yeasts neither take up thymidine efficiently nor phosphorylate it, so
      fission yeast also depends on thymidylate synthase for dTMP.
module:
  id: dntp_de_novo_synthesis
  label: De novo dNTP synthesis (class I ribonucleotide reductase and the dTTP branch)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: deoxyribonucleotide biosynthetic process
      term:
        id: GO:0009263
        label: deoxyribonucleotide biosynthetic process
      description: Reduction of ribonucleoside diphosphates and formation of the four dNTPs.
    - preferred_term: dTTP biosynthetic process
      term:
        id: GO:0006235
        label: dTTP biosynthetic process
      description: The dUMP to dTTP branch (part 3).
  context:
    taxa:
      - preferred_term: Eukaryota
        term:
          id: NCBITaxon:2759
          label: Eukaryota
        description: >-
          Class Ia reductases are universal in eukaryotes and also occur in
          many aerobic bacteria (for example Escherichia coli NrdAB).
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          Reduction occurs in the cytosol; in yeast the small subunits are
          stored in the nucleus outside S phase (PMID:12732713) and thymidylate
          synthase concentrates at the nuclear periphery.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY-7220-1
      title: 'adenosine deoxyribonucleotides <i>de novo</i> biosynthesis II - imported from: Saccharomyces Genome Database'
      description: RNR complexes CPX-1102 and CPX-1103 (GO:0004748) and YNK1, part_of GO:0046085 adenosine metabolic process.
    - model: gomodel:YeastPathways_PWY-7222-1
      title: 'guanosine deoxyribonucleotides <i>de novo</i> biosynthesis II - imported from: Saccharomyces Genome Database'
      description: >-
        Activities are part_of GO:0106387 'de novo' GMP biosynthetic process,
        which does not describe dGTP formation; the gene-less class III
        reaction is modelled with a generic protein.
    - model: gomodel:YeastPathways_YEAST-DE-NOVO-PYRMID-DNT
      title: 'de novo biosynthesis of pyrimidine deoxyribonucleotides - imported from: Saccharomyces Genome Database'
      description: >-
        RNR complexes, YNK1, DUT1, CDC21, CDC8 and URA6, all placed in cytosol
        and part_of GO:0006207 'de novo' pyrimidine nucleobase biosynthetic
        process; URA6 uses the obsolete GO:0004127.
  parts:
    - order: 1
      role: ribonucleotide reduction
      node:
        id: ribonucleotide_reduction
        label: NDP to dNDP (ADP, GDP, CDP, UDP)
        module_type: REACTION
        annotons:
          - id: class_i_rnr_activity
            label: Class Ia ribonucleotide reductase (alpha2 beta2)
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: class Ia ribonucleoside-diphosphate reductase complex
                term:
                  id: GO:0005971
                  label: ribonucleoside-diphosphate reductase complex
                description: >-
                  Large-subunit homodimer (R1/alpha) with a small-subunit dimer
                  (R2/beta). In S. cerevisiae the small subunit is the Rnr2-Rnr4
                  heterodimer, and Rnr3 can replace or pair with Rnr1 after DNA
                  damage.
                active_units:
                  - id: rnr_large_subunit
                    label: Large (alpha, R1) subunit
                    role: >-
                      Binds the NDP substrate and the specificity and activity
                      effectors; carries the catalytic cysteines that perform
                      2'-reduction.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: class Ia RNR large subunits
                        description: >-
                          SF6 is the class Ia (eukaryotic/NrdA-type) group; class Ib NrdE is
                          in SF30 (PTHR11573 family review).
                        term:
                          id: PANTHER:PTHR11573:SF6
                          label: RIBONUCLEOSIDE-DIPHOSPHATE REDUCTASE LARGE SUBUNIT
                        representative_members:
                          - preferred_term: RNR1 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P21524
                              label: Ribonucleoside-diphosphate reductase large chain 1
                            description: Essential, cell-cycle-regulated major large subunit (PMID:2199320).
                          - preferred_term: RNR3 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P21672
                              label: Ribonucleoside-diphosphate reductase large chain 2
                            description: >-
                              DNA-damage-induced minor large subunit with very low
                              activity on its own (PMID:11893751).
                          - preferred_term: RRM1 (human)
                            term:
                              id: UniProtKB:P23921
                              label: Ribonucleoside-diphosphate reductase large subunit
                          - preferred_term: nrdA (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P00452
                              label: Ribonucleoside-diphosphate reductase 1 subunit alpha
                  - id: rnr_small_subunit
                    label: Small (beta, R2) radical-bearing subunit
                    role: >-
                      Generates and stores the di-iron tyrosyl radical that
                      initiates catalysis in the large subunit.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: class I RNR small subunits
                        term:
                          id: PANTHER:PTHR23409
                          label: RIBONUCLEOSIDE-DIPHOSPHATE REDUCTASE SMALL CHAIN
                        representative_members:
                          - preferred_term: RNR2 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P09938
                              label: Ribonucleoside-diphosphate reductase small chain 1
                          - preferred_term: RRM2 (human)
                            term:
                              id: UniProtKB:P31350
                              label: Ribonucleoside-diphosphate reductase subunit M2
                          - preferred_term: nrdB (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P69924
                              label: Ribonucleoside-diphosphate reductase 1 subunit beta
                  - id: rnr_small_subunit_partner
                    label: Inactive small-subunit partner (fungal Rnr4 type)
                    role: >-
                      Catalytically inactive beta-like subunit that heterodimerises
                      with Rnr2 and is required for radical formation and activity
                      in budding yeast; absent from animals and E. coli.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RNR4 (Saccharomyces cerevisiae)
                        term:
                          id: UniProtKB:P49723
                          label: Ribonucleoside-diphosphate reductase small chain 2
                        description: >-
                          Lacks iron-binding residues; mutation of its tyrosine
                          does not affect function (PMID:9315671); essential and
                          not interchangeable with RNR2 (PMID:9315670).
            function:
              preferred_term: ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor
              term:
                id: GO:0004748
                label: ribonucleoside-diphosphate reductase activity, thioredoxin disulfide as acceptor
              substrates:
                - preferred_term: ADP, GDP, CDP or UDP
                - preferred_term: reduced thioredoxin
              products:
