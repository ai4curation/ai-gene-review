                - preferred_term: ATP
              products:
                - preferred_term: dATP, dGTP, dCTP or dUTP
                - preferred_term: ADP
              evidence:
                - source_id: PMID:1659321
                  statement: >-
                    Purified yeast NDP kinase uses dTDP, CDP, UDP, dUDP, GDP,
                    dGDP, dCDP, dADP and ADP as phosphate acceptors.
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-7220-1
                activity: gomodel:DADPKIN-RXN
                title: 'adenosine deoxyribonucleotides <i>de novo</i> biosynthesis II - imported from: Saccharomyces Genome Database'
                description: YNK1 enables GO:0004550 on dADP.
              - model: gomodel:YeastPathways_PWY-7222-1
                activity: gomodel:DGDPKIN-RXN
                title: 'guanosine deoxyribonucleotides <i>de novo</i> biosynthesis II - imported from: Saccharomyces Genome Database'
                description: YNK1 enables GO:0004550 on dGDP.
              - model: gomodel:YeastPathways_YEAST-DE-NOVO-PYRMID-DNT
                activity: gomodel:DCDPKIN-RXN
                title: 'de novo biosynthesis of pyrimidine deoxyribonucleotides - imported from: Saccharomyces Genome Database'
                description: YNK1 enables GO:0004550 on dCDP.
              - model: gomodel:YeastPathways_YEAST-DE-NOVO-PYRMID-DNT
                activity: gomodel:DUDPKIN-RXN
                title: 'de novo biosynthesis of pyrimidine deoxyribonucleotides - imported from: Saccharomyces Genome Database'
                description: YNK1 enables GO:0004550 on dUDP.
            role_description: >-
              Broad-specificity terminal phosphorylation. YNK1 is not essential,
              so other phosphotransferases can supply dNTPs in its absence.
    - order: 3
