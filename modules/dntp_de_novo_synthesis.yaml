                - preferred_term: oxidized thioredoxin
                - preferred_term: water
              evidence:
                - source_id: EC:1.17.4.1
                  statement: ribonucleoside-diphosphate reductase (class I)
                - source_id: PMID:12732713
                  supporting_text: >-
                    In Saccharomyces cerevisiae, there are two large subunits
                    (Rnr1 and Rnr3) and two small subunits (Rnr2 and Rnr4).
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-7220-1
                activity: gomodel:ADPREDUCT-RXN
                title: 'adenosine deoxyribonucleotides <i>de novo</i> biosynthesis II - imported from: Saccharomyces Genome Database'
                description: SGD complexes CPX-1102 and CPX-1103 enable GO:0004748 on ADP in cytosol.
              - model: gomodel:YeastPathways_PWY-7222-1
                activity: gomodel:GDPREDUCT-RXN
                title: 'guanosine deoxyribonucleotides <i>de novo</i> biosynthesis II - imported from: Saccharomyces Genome Database'
                description: CPX-1103 enables GO:0004748 on GDP in cytoplasm.
              - model: gomodel:YeastPathways_YEAST-DE-NOVO-PYRMID-DNT
                activity: gomodel:CDPREDUCT-RXN
                title: 'de novo biosynthesis of pyrimidine deoxyribonucleotides - imported from: Saccharomyces Genome Database'
                description: CPX-1102 and CPX-1103 enable GO:0004748 on CDP.
              - model: gomodel:YeastPathways_YEAST-DE-NOVO-PYRMID-DNT
                activity: gomodel:UDPREDUCT-RXN
                title: 'de novo biosynthesis of pyrimidine deoxyribonucleotides - imported from: Saccharomyces Genome Database'
                description: CPX-1102 and CPX-1103 enable GO:0004748 on UDP.
            role_description: >-
              Rate-limiting step of dNTP production and the only de novo source
              of deoxyribose. One allosterically regulated enzyme reduces all
              four NDPs; the specificity site (dATP/dGTP/dTTP) balances the
              pools and the activity site (ATP vs dATP) sets overall flux.
    - order: 2
      role: dNDP phosphorylation
      node:
        id: dndp_phosphorylation
        label: dADP, dGDP and dCDP (and dUDP) to the triphosphates
        module_type: REACTION
        annotons:
          - id: dndp_kinase_activity
            label: Nucleoside-diphosphate kinase (dNDP to dNTP)
            participant:
