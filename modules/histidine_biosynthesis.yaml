      node:
        id: hisie_steps
        label: Phosphoribosyl-ATP to ProFAR (HisE and HisI reactions)
        module_type: METABOLIC_PATHWAY
        description: >-
          Two consecutive hydrolytic reactions: phosphoribosyl-ATP
          diphosphatase (HisE) releases diphosphate to give phosphoribosyl-AMP,
          and phosphoribosyl-AMP cyclohydrolase (HisI) opens the adenine ring
          to give ProFAR. The two activities are always both required, but
          their protein architecture varies by lineage, so the pair is modelled
          as one part with an explicit architecture variant set. Within every
          variant the diphosphatase reaction precedes the cyclohydrolase
          reaction.
