              IPR008179) and HisI (phosphoribosyl-AMP cyclohydrolase, Pfam
              PF01502) catalytic domains are the same in all three variants;
              only their fusion state differs. PANTHER does not separate the
              architectures (PSEPK standalone HisI and S. pombe bifunctional
              his7 are both PTHR42945:SF1), so no PANTHER family is asserted.
