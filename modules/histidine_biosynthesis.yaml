id: MODULE:histidine_biosynthesis
title: L-histidine biosynthesis
description: >-
  De novo biosynthesis of L-histidine from PRPP and ATP through the conserved
  ten-reaction His pathway found in bacteria, archaea, fungi and plants. The
  module begins at the first committed ATP phosphoribosyltransferase reaction;
  PRPP production is shared upstream metabolism and is intentionally outside
  the module boundary. The pathway returns the ATP-derived purine ring to
  nucleotide metabolism as AICAR during the imidazole-glycerol-phosphate
  synthase reaction, which couples histidine and purine biosynthesis. The
  reaction chain is invariant, but its enzyme architecture varies widely across
  lineages: ATP phosphoribosyltransferase exists as a short-form catalytic
  subunit with a separate HisZ regulatory subunit or as a long-form single
  chain; the phosphoribosyl-ATP diphosphatase and phosphoribosyl-AMP
  cyclohydrolase can be separate proteins, a bifunctional HisIE protein, or
  domains of a trifunctional protein that also carries histidinol
  dehydrogenase (as in budding yeast); the glutaminase and cyclase halves of
  imidazole-glycerol-phosphate synthase can be separate HisH and HisF subunits
  or a single fused HisHF chain (as in fungi); and histidinol-phosphate
  phosphatase activity has arisen in several unrelated families (IMPase-like,
  HAD and PHP). The terminal histidinol dehydrogenase performs two successive
  NAD+-dependent oxidations through histidinal to produce L-histidine.
status: DRAFT
evidence:
  - source_id: GapMind:aa
    title: GapMind for amino acid biosynthesis
    statement: >-
      Step set and characterized-protein groundings derive from the GapMind
      amino-acid biosynthesis pathway definition his.steps (PaperBLAST, Price &
      Arkin, LBL).
    url: https://papers.genomics.lbl.gov/cgi-bin/gapView.cgi?gdb=NCBI&set=aa&path=his
  - source_id: MetaCyc:HISTSYN-PWY
    title: L-histidine biosynthesis
    statement: GapMind bases the histidine pathway on the MetaCyc pathway HISTSYN-PWY.
  - source_id: YeastPathways:HISTSYN-PWY
    title: L-histidine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      The SGD YeastCyc pathway lists the ten histidine-biosynthesis reactions
      with HIS1, HIS4 (diphosphatase, cyclohydrolase and both histidinol
      dehydrogenase half-reactions), HIS6, HIS7, HIS3, HIS5 and HIS2 as
      catalysts. All seven gene assignments were retained after review.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=HISTSYN-PWY
  - source_id: GO:0000105
    title: L-histidine biosynthetic process
    statement: The module is grounded in the GO biological-process term for histidine biosynthesis.
  - source_id: KEGG:ppu00340
    title: Pseudomonas putida KT2440 histidine metabolism
    statement: >-
      The PSEPK ppu00340 instance grounds the pathway with hisG/hisZ, hisE,
      hisI, hisA, hisF/hisH, hisB, hisC, PP_3157/PP_5147, and hisD while also
      containing histidine-catabolism and other pathway-map spillover genes.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__histidine_biosynthesis__ppu00340-deep-research-openscientist.md
    title: OpenScientist module/pathway/taxon report for PSEPK histidine biosynthesis
    statement: >-
      Supports the biosynthesis boundary, ordered catalytic activities,
      HisG-HisZ and HisF-HisH architectures, and exclusion of Hut catabolism
      from this module. Its recommendation to exclude PP_5147 is treated as an
      unresolved candidate call: PA0335 establishes a Pseudomonas HAD-family
      implementation, but the cached evidence does not establish PP_5147
      orthology or substrate specificity.
  - source_id: PMID:8852895
    title: 'Histidine biosynthetic pathway and genes: structure, regulation, and evolution.'
    statement: >-
      Review of the histidine pathway, its genes and their evolution across
      microbes; cited by YeastPathways for HISTSYN-PWY.
  - source_id: PMID:14190241
    title: GENE-ENZYME RELATIONS IN HISTIDINE BIOSYNTHESIS IN YEAST.
    statement: >-
      Each S. cerevisiae histidine mutant class was correlated with a
      particular pathway step, establishing the yeast gene-enzyme map.
  - source_id: PMID:379004
    title: The product of the his4 gene cluster in Saccharomyces cerevisiae. A trifunctional polypeptide.
    statement: >-
      HIS4 encodes a single 95-kDa polypeptide carrying phosphoribosyl-AMP
      cyclohydrolase, phosphoribosyl-ATP pyrophosphohydrolase and histidinol
      dehydrogenase activities.
  - source_id: PMID:8366040
    title: >-
      Cloning, primary structure, and regulation of the HIS7 gene encoding a
      bifunctional glutamine amidotransferase: cyclase from Saccharomyces
      cerevisiae.
    statement: >-
      HIS7 encodes a fused glutamine amidotransferase (HisH-like) and cyclase
      (HisF-like) protein that complements E. coli hisH and hisF mutants.
  - source_id: PMID:11591353
    title: >-
      Crystal structure of imidazole glycerol phosphate synthase: a tunnel
      through a (beta/alpha)8 barrel joins two active sites.
    statement: >-
      The structure of the yeast single-chain IGP synthase shows the
      glutaminase and cyclase domains joined by an ammonia tunnel.
  - source_id: PMID:10322033
    title: >-
      Histidinol phosphate phosphatase, catalyzing the penultimate step of the
      histidine biosynthesis pathway, is encoded by ytvP (hisJ) in Bacillus
      subtilis.
    statement: >-
      Defines the HisJ (PHP-family) histidinol-phosphate phosphatases, which
      include the S. cerevisiae and S. pombe enzymes and are not homologous to
      the enterobacterial HisB phosphatase.
  - source_id: PMID:8299169
    title: >-
      Cloning and manipulation of the Schizosaccharomyces pombe his7+ gene as a
      new selectable marker for molecular genetic studies.
    statement: >-
      S. pombe his7+ complements an E. coli hisI mutation, supporting its
      assignment as the HisIE cyclohydrolase/diphosphatase protein.
  - source_id: PMID:15744050
    title: >-
      Revisiting purine-histidine cross-pathway regulation in Saccharomyces
      cerevisiae: a central role for a small molecule.
    statement: >-
      AICAR, the purine-pathway co-product of the IGP synthase reaction, is
      synthesised by both the AMP and histidine pathways in yeast and acts as a
      regulatory molecule linking them.
  - source_id: PMID:28720084
    title: >-
      Sequence-based identification of inositol monophosphatase-like
      histidinol-phosphate phosphatases (HisN) in Corynebacterium glutamicum,
      Actinobacteria, and beyond
    statement: >-
      Defines sequence motifs and HMMs that distinguish IMPase-like HisN
      phosphatases from related inactive substrate classes and finds this
      family beyond Actinobacteria, including Proteobacteria.
  - source_id: PMID:31862725
    title: >-
      PA0335, a Gene Encoding Histidinol Phosphate Phosphatase, Mediates
      Histidine Auxotrophy in Pseudomonas aeruginosa
    statement: >-
      Provides genetic and biochemical evidence for the monofunctional
      Pseudomonas HAD-family histidinol-phosphate phosphatase represented by
      PA0335.
  - source_id: file:projects/P_PUTIDA/data/psepk_pathway_membership.tsv
    title: PSEPK pathway membership table
    statement: >-
      The local partition provides the accession and locus-tag mapping used to
      distinguish the biosynthetic core from Hut catabolism and unrelated
      ppu00340 members.
