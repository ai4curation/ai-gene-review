  knowledge_gaps:
    - gap_statement: >-
        KT2440 contains two unrelated candidates for histidinol-phosphate
        phosphatase activity. PP_3157/Q88I44 has a HisN-family assignment,
        whereas PP_5147/Q88CN3 has only generic HAD-family support. Neither
        protein has been assayed directly in KT2440.
      boundary: >-
        Retain both enzyme-family implementations in the reusable module while
        treating the PSEPK assignments as candidate-level. Direct KT2440
        genetics and substrate-specific biochemistry are still needed to
        determine whether either or both proteins are physiologically active.
      gap_kind:
        - BIOLOGY
        - CURATION
  notes: >-
    The reusable reaction backbone comes from GapMind, MetaCyc and SGD
    YeastPathways (HISTSYN-PWY), with GO and reaction identifiers checked
    against the local gene records. PRPP production is outside the module core;
    all molecular functions sit on leaf annotons. The scope covers bacteria,
    archaea, fungi and plants. ALIGN with YeastPathways (2026-10): the ten
    YeastCyc reactions map one-to-one onto the module (the two histidinol
    dehydrogenase half-reactions HISTOLDEHYD-RXN and HISTALDEHYD-RXN are one
    GO:0004399 annoton), and the seven YeastCyc catalysts (HIS1, HIS4, HIS6,
    HIS7, HIS3, HIS5, HIS2) are all correct; no enzymes are missing. The
    former separate diphosphatase and cyclohydrolase parts were merged into one
    part (hisie_steps) so that the standalone, bifunctional HisIE (S. pombe
    his7) and trifunctional HIS4 architectures could be explicit variants;
    histidinol dehydrogenase gained a matching monofunctional/trifunctional
    variant set, and IGP synthase gained a heteromeric HisH+HisF versus fused
    HisHF (S. cerevisiae HIS7, S. pombe his4) variant set. A PHP-family HisJ
    variant (S. cerevisiae HIS2, S. pombe SPCC1672.01, B. subtilis HisJ) was
    added for the phosphatase step. The HisC family anchor moved from PANTHER
    PTHR43643:SF3 to InterPro IPR005861 because the fungal enzymes sit in
    PANTHER PTHR42885:SF2. In both GO-CAMs every activity occurs in the cytosol;
    the module does not assert a compartment because the scope includes plants.
    GO-CAM disagreements - YeastPathways_HISTSYN-PWY types HIS7
    (GLUTAMIDOTRANS-RXN) and both HIS4 histidinol dehydrogenase half-reactions
    only with GO:0003674 rather than GO:0000107 and GO:0004399, and has no
    causal edges between activities; YeastCyc gives no EC number for the two
    dehydrogenase half-reactions. The PomBase model (6690711d00002904) agrees
    with the module and additionally includes a mitochondrial histidyl-tRNA
    ligase (hrs1) and L-histidine transport, which are outside this module. In
    KT2440 the OpenScientist taxon report supports the boundary, but step 7
    remains unresolved at the candidate level; its recommendation to exclude
    PP_5147 is not adopted because the available evidence is insufficient
    either to establish or to rule out that protein's histidinol-phosphatase
    role.
