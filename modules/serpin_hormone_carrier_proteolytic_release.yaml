id: MODULE:serpin_hormone_carrier_proteolytic_release
title: Protease-triggered hormone release from serpin carrier globulins (CBG, TBG; neutrophil elastase; alpha-1-antitrypsin)
description: >-
  Two plasma hormone carriers, corticosteroid-binding globulin (CBG, SERPINA6) and
  thyroxine-binding globulin (TBG, SERPINA7), are non-inhibitory serpins that keep the serpin
  conformational mechanism and use it to release their cargo. Each holds its hormone at a single
  site while the reactive-centre loop is exposed. Neutrophil elastase, released by activated
  neutrophils at sites of inflammation, cleaves the loop; the loop inserts into beta-sheet A
  (the stressed-to-relaxed transition) and the change is transmitted through helix D to the
  hormone site, lowering affinity and releasing hormone locally. The carrier is a substrate of
  the protease, not its inhibitor. The inhibitory serpin alpha-1-antitrypsin restrains
  neutrophil elastase and so limits the release. The module covers this carrier, protease and
  protease-inhibitor triad; hormone synthesis, receptor signalling and the temperature
  dependence of carrier affinity are outside it.
status: DRAFT
evidence:
  - source_id: PMID:2370299
    title: A role for corticosteroid-binding globulin in delivery of cortisol to activated neutrophils.
    statement: >-
      Neutrophil elastase cleaves CBG at one site without being inhibited and releases bound
      cortisol; alpha-1-proteinase inhibitor prevents the cleavage by activated granulocytes.
    supporting_text: >-
      unlike A1-PI, CBG does not alter the activity of this enzyme, but is cleaved by it at a
      single location close to its carboxy-terminus, and this reduces its molecular size by 5 kDa
      with the concomitant release of more than 80% of CBG-bound cortisol
  - source_id: PMID:18513745
    title: The S-to-R transition of corticosteroid-binding globulin and the mechanism of hormone release.
    statement: Loop cleavage drives the serpin S-to-R transition in CBG, which is coupled allosterically to the hormone site.
    supporting_text: >-
      CBG has adapted an allosteric mechanism of the serpins to allow equilibrated release of the
      hormones by a flip-flop movement of the intact reactive loop into and out of the beta-sheet
  - source_id: PMID:11889191
    title: Characterization of T(4)-binding globulin cleaved by human leukocyte elastase.
    statement: TBG is likewise non-inhibitory, is cleaved by leukocyte elastase and then binds thyroxine less tightly.
    supporting_text: >-
      In this communication we confirm previous observations that TBG is also cleaved by elastase
      and undergoes the characteristic conformational changes.
  - source_id: PMID:21325280
    title: Allosteric modulation of hormone release from thyroxine and corticosteroid-binding globulins.
    statement: In both carriers loop insertion lowers hormone affinity, mainly through the helix D connecting loop.
    supporting_text: >-
      Cleavage of the reactive loop results in its complete insertion into the β-sheet A and a
      substantial but incomplete decrease in binding affinity in both TBG and CBG.
  - source_id: PMID:39788946
    title: The NE/AAT/CBG axis regulates adipose tissue glucocorticoid exposure.
    statement: Neutrophil elastase and alpha-1-antitrypsin set local glucocorticoid availability in vivo in mice and humans.
    supporting_text: >-
      These findings show that NE and AAT regulate local tissue glucocorticoid bioavailability in
      vivo, providing crucial evidence of a mechanism linking inflammation and metabolism.
  - source_id: file:human/SERPINA6/SERPINA6-ai-review.yaml
    title: SERPINA6 gene review (human)
    statement: >-
      The carrier role, the removal of protease inhibitor activity and the cleavage site are taken
      from the human SERPINA6 review and its structural analysis.
  - source_id: file:human/ELANE/ELANE-ai-review.yaml
    title: ELANE gene review (human)
    statement: Neutrophil elastase is reviewed as an extracellular serine endopeptidase of activated neutrophils.
module:
  id: serpin_hormone_carrier_proteolytic_release
  label: Protease-triggered hormone release from serpin carrier globulins
  module_type: MODULE
  concepts:
    - preferred_term: hormone transport
      term:
        id: GO:0009914
        label: hormone transport
      description: >-
        Carriage of a hormone in blood by a serpin globulin and its regulated local release.
        GO has no term for protease-triggered release from a carrier.
  context:
    cellular_components:
      - preferred_term: extracellular region
        term:
          id: GO:0005576
          label: extracellular region
        description: All three activities act in plasma and in the extracellular fluid of inflamed tissue.
  parts:
    - order: 1
      role: hormone carriage by a non-inhibitory serpin
      node:
        id: carrier_step
        label: hormone held by the serpin carrier with its reactive-centre loop exposed
        module_type: TRANSPORT_STEP
        variant_sets:
          - id: carrier_identity
            label: Carrier and cargo
            axis: carrier globulin / hormone carried
            selection: ONE_OR_MORE
            variants:
              - id: cbg_variant
                label: Corticosteroid-binding globulin carrying cortisol
                module_type: TRANSPORT_STEP
                annotons:
                  - id: cbg_carrier
                    label: "CBG: glucocorticoid and progesterone carrier"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: corticosteroid-binding globulin (serpin A6) orthologs
                        term:
                          id: PANTHER:PTHR11461:SF34
                          label: CORTICOSTEROID-BINDING GLOBULIN
                        representative_members:
                          - preferred_term: SERPINA6 (human)
                            term:
                              id: UniProtKB:P08185
                              label: Corticosteroid-binding globulin
                    function:
                      preferred_term: lipid carrier activity
                      term:
                        id: GO:0005319
                        label: lipid carrier activity
                      cargo:
                        - preferred_term: cortisol
                        - preferred_term: progesterone
                      evidence:
                        - source_id: file:human/SERPINA6/SERPINA6-ai-review.yaml
                          statement: Human SERPINA6 core function is steroid carriage; GO has no steroid hormone carrier term, so lipid carrier activity is used.
                        - source_id: PMID:24424442
                          statement: CBG holds most circulating cortisol.
                          supporting_text: Corticosteroid-binding globulin (CBG) binds more than 90% of circulating cortisol
                    locations:
                      - preferred_term: extracellular region
                        term:
                          id: GO:0005576
                          label: extracellular region
                    role_description: >-
                      Holds cortisol in the high-affinity state while the reactive-centre loop is
                      exposed; the loop is the protease-sensitive trigger.
              - id: tbg_variant
                label: Thyroxine-binding globulin carrying thyroxine
                module_type: TRANSPORT_STEP
                annotons:
                  - id: tbg_carrier
                    label: "TBG: thyroid hormone carrier"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: thyroxine-binding globulin (serpin A7) orthologs
                        term:
                          id: PANTHER:PTHR11461:SF375
                          label: THYROXINE-BINDING GLOBULIN
                        representative_members:
                          - preferred_term: SERPINA7 (human)
                            term:
                              id: UniProtKB:P05543
                              label: Thyroxine-binding globulin
                    function:
                      preferred_term: molecular carrier activity
                      term:
                        id: GO:0140104
                        label: molecular carrier activity
                      cargo:
                        - preferred_term: thyroxine
                      evidence:
                        - source_id: PMID:11889191
                          statement: TBG is a non-inhibitory serpin with hormone transport function.
                          supporting_text: >-
                            both TBG and another serpin with hormone transport function,
                            corticosteroid-binding globulin, are noninhibitory
                    locations:
                      - preferred_term: extracellular region
                        term:
                          id: GO:0005576
                          label: extracellular region
                    role_description: Holds thyroxine; cleaved by leukocyte elastase with reduced affinity afterwards.
    - order: 2
      role: reactive-centre loop cleavage by neutrophil elastase
      node:
        id: elastase_step
        label: neutrophil elastase cleaves the carrier loop, triggering the S-to-R transition and hormone release
        module_type: REGULATORY_STEP
        annotons:
          - id: elastase_activity
            label: "Neutrophil elastase: serine endopeptidase acting on the carrier loop"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: neutrophil elastase orthologs
                term:
                  id: PANTHER:PTHR24257:SF16
                  label: NEUTROPHIL ELASTASE
                representative_members:
                  - preferred_term: ELANE (human)
                    term:
                      id: UniProtKB:P08246
                      label: Neutrophil elastase
            function:
              preferred_term: serine-type endopeptidase activity
              term:
                id: GO:0004252
                label: serine-type endopeptidase activity
              substrates:
                - preferred_term: carrier serpin reactive-centre loop (CBG Val344-Thr345, mature numbering)
              evidence:
                - source_id: PMID:38042488
                  statement: Elastase cuts CBG at one loop bond.
                  supporting_text: rapidly and specifically cleaves the RCL at Val344–Thr345
                - source_id: PMID:2370299
                  statement: The carrier is cleaved and the enzyme is not inhibited.
                  supporting_text: CBG acts as a substrate for neutrophil elastase
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Released by activated neutrophils; converts the carrier to the low-affinity relaxed
              form. Other proteases (chymotrypsin, Pseudomonas aeruginosa LasB) can cut the CBG
              loop at nearby bonds.
    - order: 3
      role: restraint of the protease by an inhibitory serpin
      optional: true
      node:
        id: antitrypsin_step
        label: alpha-1-antitrypsin inhibits neutrophil elastase
        module_type: REGULATORY_STEP
        annotons:
          - id: antitrypsin_activity
            label: "Alpha-1-antitrypsin: neutrophil elastase inhibitor"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: alpha-1-antitrypsin (serpin A1) orthologs
                term:
                  id: PANTHER:PTHR11461:SF165
                  label: ALPHA-1-ANTITRYPSIN
                representative_members:
                  - preferred_term: SERPINA1 (human)
                    term:
                      id: UniProtKB:P01009
                      label: Alpha-1-antitrypsin
            function:
              preferred_term: serine-type endopeptidase inhibitor activity
              term:
                id: GO:0004867
                label: serine-type endopeptidase inhibitor activity
              targets:
                - preferred_term: neutrophil elastase
              evidence:
                - source_id: PMID:39788946
                  statement: Alpha-1-antitrypsin inhibits neutrophil elastase and thereby limits CBG cleavage.
                  supporting_text: NE is inhibited by alpha-1-antitrypsin (AAT; SERPINA1).
                - source_id: PMID:2370299
                  statement: Pre-incubation with alpha-1-proteinase inhibitor prevents CBG cleavage by septic granulocytes.
                  supporting_text: Preincubation with A1-PI prevented this, which demonstrates that neutrophil elastase plays a key role in this event.
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              The same fold used in the opposite way: here loop cleavage traps the protease. The
              ratio of elastase to alpha-1-antitrypsin sets how much carrier is cleaved.
  connections:
    - source: elastase_step
      target: carrier_step
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Loop cleavage lowers the carrier's hormone affinity and releases the hormone; the carrier
        is the protease's substrate.
    - source: antitrypsin_step
      target: elastase_step
      connection_type: NEGATIVELY_REGULATES
      description: Alpha-1-antitrypsin inhibits neutrophil elastase and so limits carrier cleavage.
  notes: >-
    A reusable three-role motif (carrier, releasing protease, protease inhibitor) with two carrier
    variants. Grounded to human SERPINA6 (P08185), SERPINA7 (P05543), ELANE (P08246) and SERPINA1
    (P01009) through PANTHER subfamily selectors. The carrier variants are in the same PANTHER
    family as the inhibitor, PTHR11461: the PAINT IBD for serine-type endopeptidase inhibitor
    activity at PTN008970140 reaches all three, and the family review requests losses for the
    carrier clades. Whether elastase-cleaved CBG circulates is disputed (PMID:30452386 found
    none in blood), so the release is modelled as local. There is no GO-CAM for this mechanism;
    the mouse glucocorticoid biosynthesis model gomodel:68b0f0d000007538 contains Serpina6 only
    as an unconnected carrier activity. Temperature-dependent release and the reversible
    partial loop insertion of the intact carrier are not modelled.
proposed_new_terms:
  - proposed_name: steroid hormone carrier activity
    proposed_definition: >-
      Directly binding to a steroid hormone and delivering it either to an acceptor molecule or
      to a specific location.
    proposed_parent:
      id: GO:0005319
      label: lipid carrier activity
    justification: >-
      The CBG carrier annoton has to use lipid carrier activity because GO has no carrier term
      for steroid hormones. The same request is made in the SERPINA6 gene review.
    supported_by:
      - reference_id: PMID:18513745
        supporting_text: Corticosteroids are transported in the blood by a serpin, corticosteroid-binding globulin (CBG)
