id: MODULE:synaptic_vesicle_exocytosis
title: Synaptic vesicle exocytosis (docking, priming, Ca2+-triggered fusion)
description: >-
  The release stage of the synaptic vesicle cycle at the presynaptic active
  zone. Loaded vesicles are recruited to the active zone by the vesicle GTPase
  Rab3 and its effector RIM, which together with ELKS scaffolds tether vesicles
  and position them near voltage-gated Ca2+ channels. Munc13 and Munc18-1 then
  prime the vesicle by opening syntaxin-1 and templating assembly of the
  trans-SNARE complex (syntaxin-1 / SNAP-25 / synaptobrevin-2). An action
  potential opens Cav2 channels; the resulting Ca2+ microdomain is sensed by
  synaptotagmin-1, which relieves the complexin clamp and drives full SNARE
  zippering and fusion-pore opening, releasing transmitter. NSF with alpha-SNAP
  finally disassembles the cis-SNARE complex so the SNAREs can be reused. The
  inner pair -> fuse -> recycle bundle conforms to the generic
  MODULE:snare_fusion_cycle motif. Exemplars are human; the machinery is
  conserved across metazoan chemical synapses. Grounded in GO:0016079
  (synaptic vesicle exocytosis).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0016079
    title: synaptic vesicle exocytosis
    statement: The module is grounded in the GO process for synaptic vesicle exocytosis.
  - source_id: GO:0016082
    title: synaptic vesicle priming
    statement: Munc13/Munc18-dependent priming is modeled as a required part.
  - source_id: GO:0099502
    title: calcium-dependent activation of synaptic vesicle fusion
    statement: Synaptotagmin-mediated Ca2+ triggering is modeled as the fusion-activating step.
  - source_id: PMID:24183019
    title: 'Neurotransmitter release: the last millisecond in the life of a synaptic vesicle.'
    statement: >-
      Review framing the docking/priming/Ca2+-triggering/fusion sequence and the
      roles of RIM, Munc13, Munc18, SNAREs, complexin and synaptotagmin.
  - source_id: PMID:23060190
    title: Molecular machines governing exocytosis of synaptic vesicles.
    statement: Review of the SNARE/SM-protein fusion machinery and NSF/SNAP recycling.
  - source_id: PMID:26098518
    title: The Synaptic Vesicle Release Machinery.
    statement: Review of the structural mechanism of SNARE assembly templated by Munc18-1 and Munc13-1.
  - source_id: PMID:24274737
    title: Molecular mechanisms for synchronous, asynchronous, and spontaneous neurotransmitter release.
    statement: Basis for the release-mode variant set (synchronous vs asynchronous Ca2+ sensors).
  - source_id: PANTHER:PTN000461349
    title: PAINT syntaxin SNARE-complex node
    statement: >-
      Local PAINT IBD node in PTHR19957 seeded by human syntaxins with propagated
      terms C:GO:0031201 and P:GO:0006906.
  - source_id: PANTHER:PTN009219507
    title: PAINT Rab3 G protein activity node
    statement: Local PAINT IBD node in PTHR47980 seeded by RAB3A with propagated term F:GO:0003925.
notes: >-
  Human-centric exemplars with family-level descriptors. The obsolete GO term
  for synaptic vesicle docking is not used; docking is described in prose on
  the active-zone recruitment node and the RIM annoton carries GO:0010808
  (positive regulation of synaptic vesicle priming). Ca2+ channel beta/alpha2delta
  subunits, bassoon/piccolo, and the dense-core-vesicle pathway are out of
  scope. Neurotransmitter loading and vesicle retrieval are separate modules
  (MODULE:synaptic_vesicle_neurotransmitter_loading,
  MODULE:synaptic_vesicle_endocytosis); MODULE:synaptic_vesicle_cycle is the
  umbrella.
knowledge_gaps:
  - gap_statement: >-
      The identity of the Ca2+ sensor(s) for spontaneous release remains
      debated, so no spontaneous-release variant is asserted alongside the
      synchronous and asynchronous variants.
    boundary: >-
      Synaptotagmin-1/2 are the established fast synchronous sensors and
      synaptotagmin-7 the asynchronous sensor.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Would add a third variant to the release-mode variant set.
    resolution: Sensor knockouts combined with cytosolic Ca2+ buffering at synapses with defined spontaneous release.
    provenance:
      - reference_id: PMID:24274737
        supporting_text: in the identity of the Ca(2+) sensor for release
        reference_section_type: ABSTRACT
  - gap_statement: >-
      Whether Munc13 acts mainly as a vesicle tether/docking factor, as a
      syntaxin-1 opener, or as both at a given synapse is still being resolved.
    boundary: >-
      Munc13 is required for priming, its MUN domain opens syntaxin-1 and its
      C1/C2B domains regulate release probability.
    gap_kind:
      - BIOLOGY
    status: OPEN
    resolution: Structure-guided separation-of-function mutants assayed by flash-and-freeze electron microscopy.
  - gap_statement: >-
      Bassoon, piccolo and liprin-alpha contribute to active-zone assembly and
      vesicle recruitment but are not modeled as parts of this module.
    boundary: RIM, RIM-BP and ELKS are modeled as the minimal active-zone scaffold.
    gap_kind:
      - CURATION
    status: OPEN
