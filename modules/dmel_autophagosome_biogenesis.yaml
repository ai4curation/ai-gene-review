id: MODULE:dmel_autophagosome_biogenesis
title: Autophagosome biogenesis by the core Atg machinery in Drosophila melanogaster
description: >-
  Macroautophagy begins with formation of a cup-shaped phagophore that expands and closes
  to form the double-membrane autophagosome. The core Atg proteins act in conserved functional
  units. The Atg1 kinase complex (Atg1, Atg13, Atg17/FIP200 and Atg101) initiates phagophore
  formation in response to nutrient starvation and TOR inhibition. The class III phosphatidylinositol
  3-kinase complex (Vps34/Pi3K59F, Vps15, Atg6/Beclin 1 and Atg14) produces phosphatidylinositol
  3-phosphate at the phagophore. Atg9 vesicles supply membrane and Atg9 has phospholipid scramblase
  activity, while Atg2, recruited with the PI3P-binding Atg18 proteins, transfers lipids to
  the expanding phagophore. Two ubiquitin-like conjugation systems act downstream: Atg7 and
  Atg10 conjugate Atg12 to Atg5, and the Atg12-Atg5-Atg16 complex promotes lipidation of Atg8
  proteins with phosphatidylethanolamine by Atg7 and Atg3 after processing of Atg8 by the
  Atg4 proteases. In Drosophila, the fat body of starved larvae is the classic setting for
  studying this pathway.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000076
  title: 'FlyBase gene group ATG: Autophagy-related genes'
  statement: >-
    FlyBase release FB2026_03 groups 20 D. melanogaster genes as autophagy-related genes (ATG);
    this module models that group.
- source_id: FB:FBgg0000216
  title: 'FlyBase gene group ATG-CPX: Autophagy-related complexes'
  statement: >-
    FlyBase release FB2026_03 groups 11 D. melanogaster genes as autophagy-related complexes
    (ATG-CPX); this module models that group.
- source_id: GO:0000045
  title: autophagosome assembly
  statement: >-
    GO term grounding the module as autophagosome assembly.
notes: >-
  Boundary. The module contains the FlyBase core Atg genes and the Atg complexes. Pi3K59F
  and Vps15 enter through the FlyBase autophagy-specific PI3 kinase complex group; they also
  act in endosomal PI3K complexes. Atg7 is placed in both conjugation systems because it is
  the E1 enzyme for both Atg12 and Atg8. Autophagosome-lysosome fusion (HOPS, SNAREs), cargo
  receptors and upstream TOR signalling are outside the module. The connections give the conventional
  order of action; parts also act partly in parallel. FlyBase groups realized by this module:
  ATG (FBgg0000076), ATG-CPX (FBgg0000216). Subgroups folded into it: ATG-PK, ATG-C, ATG-PI3K.
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_autophagosome_biogenesis.yaml;
  none of the member genes has a gene review yet unless noted.
