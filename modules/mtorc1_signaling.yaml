                - id: rheb_kinase_activator
                  label: Rheb-GTP kinase-activator role
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: Rheb GTPase
                      term:
                        id: UniProtKB:Q15382
                        label: GTP-binding protein Rheb
                  function:
                    preferred_term: protein serine/threonine kinase activator activity
                    term:
                      id: GO:0043539
                      label: protein serine/threonine kinase activator activity
                    targets:
                      - preferred_term: mTOR kinase (TORC1)
                  processes:
                    - preferred_term: positive regulation of TORC1 signaling
                      term:
                        id: GO:1904263
                        label: positive regulation of TORC1 signaling
                  role_description: GTP-bound Rheb allosterically activates the TORC1 holoenzyme kinase.
                  gocam_associations:
                    - model: gomodel:646ff70100000391
                      activity: gomodel:646ff70100000391/646ff70100000496
                      title: Canonical mTORC1 signaling (Human) - RHEB kinase-activator
                    - model: gomodel:6796b94c00006848
                      activity: gomodel:6796b94c00006848/6796b94c00006877
                      title: TORC1 signaling (S. pombe) - Rhb1/GTP kinase-activator
          - order: 2
            role: TSC complex (Rheb GAP, switch-off)
            node:
              id: tsc_gap
              label: TSC complex GTPase-activating protein
              module_type: REACTION
              description: >-
                The TSC complex (TSC1 hamartin, TSC2 tuberin, TBC1D7) is the GAP
                for Rheb; TSC2 carries the catalytic GAP domain. AKT and ERK/RSK
                phosphorylation inhibit it (growth-factor input); AMPK
                phosphorylation activates it (energy stress). It is the single
                integrating node for the Rheb switch.
