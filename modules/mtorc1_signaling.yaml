          The rapamycin-sensitive TORC1 kinase: the mTOR/Tor catalytic subunit,
          the raptor/Kog1 substrate-presenting adaptor and the MLST8/Lst8
          subunit, with the DEPTOR and PRAS40 inhibitory subunits (metazoan).
          Raptor binds substrate TOS motifs and the active Rag heterodimer;
          Rheb-GTP allosterically activates the kinase.
