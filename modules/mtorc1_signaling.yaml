id: MODULE:mtorc1_signaling
title: mTORC1 nutrient, growth-factor and stress signaling at the lysosome/vacuole
description: >-
  A taxon-neutral decomposition of the TORC1 (mTOR complex 1) growth-control
  module, the conserved kinase hub that couples nutrient, growth-factor and
  energy status to cell growth. The module fixes the invariant core shared from
  fungi to metazoa and pushes the lineage-specific variation into explicit
  variant sets. The invariant core is: (1) the TORC1 holoenzyme, a
  rapamycin-sensitive serine/threonine kinase (mTOR/Tor) scaffolded by a
  raptor/Kog1 substrate-adaptor subunit and an MLST8/Lst8 subunit, held off by
  the DEPTOR and PRAS40 inhibitors; (2) two GTPase switches that gate the kinase
  at the lysosomal (metazoan) or vacuolar (fungal) membrane - the Rheb switch,
  whose GTP-bound GTPase is the direct allosteric activator of the kinase and
  whose GAP is the TSC complex, and the Rag switch, a GTPase heterodimer that
  recruits the holoenzyme to the membrane and whose RagA/Gtr1 GEF is the
  Ragulator/EGO complex and whose GAPs are GATOR1/SEACIT (for RagA/Gtr1) and
  FLCN-FNIP/Lst4-Lst7 (for RagC/Gtr2); and (3) a fixed output set - the
  translation program (S6K activation, 4E-BP repression relieved), autophagy
  initiation (ULK1/Atg13 inhibition) and, in metazoa, TFEB/TFE3 regulation.
  The variable layers are modeled as variant sets: the holoenzyme subunit roster
  by taxon, the presence of the Rheb/TSC switch by taxon (budding yeast has lost
  it), and the upstream sensor repertoire (amino-acid sensors SESN2, CASTOR1,
  SAMTOR, SLC38A9 feeding GATOR2->GATOR1; growth-factor/insulin input via
  AKT->TSC2; energy input via AMPK->TSC2 and ->raptor; sterol input via LYCHOS).
  Both GTPase switches embed the generic GTPase nucleotide-switch motif through
  `conforms_to`. Growth-factor input, energy input and autophagy output are
  modeled as interfaces to neighbouring modules (MODULE:pi3k_akt_mtor,
  MODULE:phagophore_assembly_site) rather than re-modeled here.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0038202
    title: TORC1 signaling
    statement: >-
      The module is grounded in TORC1 signaling, the mTOR-complex-1-centered
      control of cell growth, translation and autophagy in response to nutrients
      and growth factors.
  - source_id: GO:0031931
    title: TORC1 complex
    statement: >-
      The invariant kinase hub is the TORC1 complex: the mTOR/Tor kinase with
      its raptor/Kog1 and MLST8/Lst8 subunits.
  - source_id: GO_CAM:646ff70100000391
    title: Canonical mTORC1 signaling (Human)
    statement: >-
      The human canonical model types the holoenzyme (MTOR kinase, RPTOR
      adaptor), the Rag switch (RagA GTP, RagC GDP, Ragulator GEF, LAMTOR1
      anchor), the Rheb activator and the S6K/4E-BP output at the lysosomal
      membrane, and anchors the metazoan realization of this module.
  - source_id: GO_CAM:6796b94c00006848
    title: TORC1 signaling (GO:0038202) (S. pombe)
    statement: >-
      The S. pombe model types the same topology at the vacuolar membrane -
      TORC1 complex kinase, Rhb1 GTPase and its TSC1-TSC2 GAP, the Gtr1-Gtr2 Rag
      heterodimer with its Ragulator GEF and GATOR1 / FNIP-folliculin GAPs - and
      anchors the fungal realization, confirming the cross-species conservation
      the module asserts.
notes: >-
  Boundary decisions. (1) The two GTPase switches are modeled as separate parts
  rather than one switch because they have different GEF/GAP logic, different
  outputs (Rheb-GTP allosterically activates the kinase; the Rag heterodimer
  positions the holoenzyme at the membrane) and different taxon distributions -
  budding yeast retains the Rag/EGO switch but has lost Rheb and the TSC complex.
  (2) Single-regulator post-translational events on core nodes that the cached
  GO-CAMs enumerate one model at a time (OGT/OTUB1 on raptor, RNF152/USP4/ATXN3
  on Rheb, RNF167 on SESN2/CASTOR1, KLHL22/UBE4B on DEPDC5/RagC, PELI1 on TSC1,
  NLK/PKA/TBK1 on raptor) are recorded as gocam_associations or notes on the node
  they modify, not promoted to parts, to keep the module from regrowing the
  per-model sprawl. (3) mTORC2 is a distinct complex and module
  (MODULE:mtorc2_signaling); its only edge to this module is the S6K1 negative
  feedback onto RICTOR/mSIN1, left as an interface. Representative members and
  the function terms on each node were verified against the gene reviews in this
  repository and the two anchor GO-CAMs; family/complex descriptors are used
  where a verified local exemplar is not yet available (e.g. LYCHOS, TFEB).
module:
  id: mtorc1_signaling
  label: mTORC1/TORC1 signaling hub
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: TORC1 signaling
      term:
        id: GO:0038202
        label: TORC1 signaling
      description: mTOR-complex-1 control of growth, translation and autophagy.
  context:
    taxa:
      - preferred_term: eukaryotes
        description: >-
          The TORC1 growth-control module is conserved across eukaryotes; the
          lysosomal amino-acid-sensing elaborations (GATOR2 sensors, LYCHOS) are
          progressively added in the metazoan lineage.
    cellular_components:
      - preferred_term: lysosomal/vacuolar membrane
        description: >-
          TORC1 is activated at the endolysosomal membrane in metazoa
          (GO:0005765 lysosomal membrane) and at the vacuole membrane in fungi
          (GO:0000329 fungal-type vacuole membrane); the variant is taxon-level
          and recorded on each node rather than asserted once here.
