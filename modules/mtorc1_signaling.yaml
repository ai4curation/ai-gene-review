    - order: 2
      role: Rheb GTPase switch (direct kinase activator)
      optional: true
      node:
        id: rheb_switch
        label: Rheb GTPase switch
        module_type: SIGNALING_PATHWAY
        description: >-
          The Rheb nucleotide switch. GTP-bound Rheb (Rhb1 in fungi) is the
          direct allosteric activator of the TORC1 kinase at the membrane; its
          GAP is the TSC complex (TSC1-TSC2-TBC1D7; TSC2/tuberin carries the GAP
          domain). Rheb has no dedicated GEF - exchange is spontaneous - so the
          switch is gated almost entirely by TSC GAP activity, which growth
          factors (via AKT) switch off and energy stress (via AMPK) switches on.
          This switch is present in metazoa and fission yeast but lost in
          budding yeast.
        concepts:
          - preferred_term: positive regulation of TORC1 signaling
            term:
              id: GO:1904263
              label: positive regulation of TORC1 signaling
        conforms_to:
          - template: gtpase_switch
            status: WITH_DEVIATIONS
            deviations:
              - No dedicated GEF step; nucleotide exchange on Rheb is spontaneous.
            notes: >-
              Rheb (GO:0003924 GTPase) is switched off by the TSC complex GAP
              (GO:0005096), filling the active-GTPase and GAP tiers; the GEF tier
              is empty because Rheb has no trans-acting GEF.
        parts:
          - order: 1
            role: active GTP-bound Rheb (kinase activator)
            node:
              id: rheb_active
              label: Rheb-GTP, the TORC1 kinase activator
              module_type: REACTION
              description: >-
                GTP-bound Rheb binds the mTOR kinase domain and realigns its
                active site, directly activating the holoenzyme. Rheb cycles
                through intrinsic, GAP-stimulated GTP hydrolysis.
              annotons:
