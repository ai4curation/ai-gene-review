                            gene_product:
                              preferred_term: TBC1D7
                              term:
                                id: UniProtKB:Q9P0N9
                                label: TBC1 domain family member 7
                  function:
                    preferred_term: GTPase activator activity
                    term:
                      id: GO:0005096
                      label: GTPase activator activity
                    targets:
