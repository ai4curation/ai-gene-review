                        - preferred_term: EIF4EBP1 (4E-BP1)
                        - preferred_term: ULK1
                  - id: raptor_adaptor
                    label: raptor/Kog1 substrate adaptor
                    role: Presents TOS-motif substrates to mTOR and binds the active Rag heterodimer.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: raptor substrate adaptor
                        term:
