  connections:
    - source: rag_switch
      target: torc1_holoenzyme
      connection_type: CAUSES
      description: The active Rag heterodimer recruits TORC1 to the lysosomal/vacuolar membrane.
      chaining_status: NOT_APPLICABLE
      chaining_note: Regulatory recruitment edge, not a metabolic reaction chain.
    - source: rheb_switch
      target: torc1_holoenzyme
      connection_type: POSITIVELY_REGULATES
      description: Rheb-GTP allosterically activates the membrane-recruited TORC1 kinase.
      chaining_status: NOT_APPLICABLE
    - source: tsc_gap
      target: rheb_active
      connection_type: NEGATIVELY_REGULATES
      description: The TSC complex stimulates Rheb GTP hydrolysis, switching the kinase activator off.
      chaining_status: NOT_APPLICABLE
    - source: gator1_gap
      target: rag_heterodimer
      connection_type: NEGATIVELY_REGULATES
      description: GATOR1 switches RagA off under amino-acid scarcity.
      chaining_status: NOT_APPLICABLE
    - source: ragulator_gef
      target: rag_heterodimer
      connection_type: POSITIVELY_REGULATES
      description: Ragulator loads GTP onto RagA, activating the heterodimer.
      chaining_status: NOT_APPLICABLE
    - source: upstream_sensors
      target: rag_switch
      connection_type: POSITIVELY_REGULATES
      description: Amino-acid sensors set the Rag switch state via GATOR2/GATOR1.
      chaining_status: NOT_APPLICABLE
    - source: upstream_sensors
      target: rheb_switch
      connection_type: POSITIVELY_REGULATES
      description: Growth-factor (AKT) and energy (AMPK) inputs set the Rheb switch state via the TSC complex.
      chaining_status: NOT_APPLICABLE
    - source: torc1_holoenzyme
      target: torc1_output
      connection_type: CAUSES
      description: Active TORC1 phosphorylates its output effectors.
      chaining_status: NOT_APPLICABLE
