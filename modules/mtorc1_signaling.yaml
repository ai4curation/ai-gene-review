                    - model: gomodel:6796b94c00006848
                      activity: gomodel:6796b94c00006848/6796b94c00006868
                      title: TORC1 signaling (S. pombe) - TSC1-TSC2 complex GAP
        variant_sets:
          - id: rheb_switch_taxon
            label: Rheb switch presence by taxon
            axis: taxon
            selection: EXACTLY_ONE
            variants:
              - id: rheb_metazoan
