    - order: 3
      role: Rag GTPase switch (membrane recruitment)
      node:
        id: rag_switch
        label: Rag/Gtr GTPase heterodimer switch
        module_type: SIGNALING_PATHWAY
        description: >-
          The Rag (metazoan RagA/B-RagC/D; fungal Gtr1-Gtr2) GTPase heterodimer
          recruits TORC1 to the lysosomal/vacuolar membrane in the
          amino-acid-replete state (RagA-GTP / RagC-GDP). The RagA/Gtr1 GEF is the
          Ragulator complex (LAMTOR1-5; fungal EGO complex), anchored to the
          membrane by myristoylated/palmitoylated LAMTOR1; SLC38A9 is a lysosomal
          arginine-responsive co-GEF. The RagA GAP is GATOR1 (DEPDC5-NPRL2-NPRL3;
          fungal SEACIT Iml1-Npr2-Npr3), scaffolded at the membrane by KICSTOR.
          The RagC GAP is FLCN-FNIP (fungal Lst4-Lst7), and the RagC-GDP state it
          produces is required for the non-canonical TFEB/TFE3 substrates.
        concepts:
          - preferred_term: positive regulation of TORC1 signaling
            term:
              id: GO:1904263
              label: positive regulation of TORC1 signaling
        conforms_to:
          - template: gtpase_switch
            status: EXTENDS
            deviations:
              - The GTPase is an obligate heterodimer with two independently gated nucleotide sites.
              - Two GAPs act on the two subunits (GATOR1 on RagA, FLCN-FNIP on RagC).
            notes: >-
              RagA/Gtr1 (GO:0003924) is loaded by the Ragulator/EGO GEF
              (GO:0005085) and switched off by the GATOR1 GAP (GO:0005096),
              filling the GEF / active-GTPase / GAP tiers; RagC carries a second,
              oppositely-gated nucleotide site with its own FLCN-FNIP GAP.
        parts:
          - order: 2
            role: Rag heterodimer (active, recruits TORC1)
            node:
              id: rag_heterodimer
              label: Rag/Gtr heterodimer
              module_type: REACTION
              description: >-
                In the active state (RagA/Gtr1-GTP, RagC/Gtr2-GDP) the heterodimer
                binds raptor and tethers TORC1 at the membrane for Rheb to
                activate.
              concepts:
