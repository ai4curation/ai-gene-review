                  label: Rheb GTPase / kinase-activator
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: Rheb GTPase
                      term:
                        id: UniProtKB:Q15382
                        label: GTP-binding protein Rheb
                    required_function:
                      preferred_term: GTPase activity
                      term:
                        id: GO:0003924
                        label: GTPase activity
                  function:
                    preferred_term: GTPase activity
                    term:
                      id: GO:0003924
                      label: GTPase activity
                  processes:
                    - preferred_term: positive regulation of TORC1 signaling
                      term:
                        id: GO:1904263
                        label: positive regulation of TORC1 signaling
                  locations:
                    - preferred_term: lysosomal membrane
                      term:
                        id: GO:0005765
                        label: lysosomal membrane
                  role_description: >-
                    GTPase tier of the switch; GTP-bound Rheb is the direct
                    allosteric activator of the TORC1 kinase (kinase-activator
