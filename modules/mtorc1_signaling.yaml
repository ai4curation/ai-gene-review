                  label: TSC complex Rheb-GAP activity
                  participant:
                    selector_type: PROTEIN_COMPLEX
                    protein_complex:
                      preferred_term: TSC1-TSC2-TBC1D7 complex
                      term:
                        id: GO:0033596
                        label: TSC1-TSC2 complex
                      active_units:
                        - id: tsc2_catalytic
                          label: TSC2/tuberin GAP subunit
