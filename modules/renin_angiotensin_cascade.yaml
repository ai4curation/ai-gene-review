        module_ref: angiotensin_ii_receptor_signaling
    - order: 4
      role: angiotensin-(1-7) formation (counter-regulatory arm)
      node:
        id: ras_angiotensin_1_7_formation
        label: Formation of angiotensin-(1-7) and angiotensin-(1-9) by ACE2, neprilysin, ACE and prolylcarboxypeptidase
        module_type: REACTION
        description: >-
          The counter-regulatory arm converts the pressor peptides into
          angiotensin-(1-7) (AGT 25-31). ACE2 removes the C-terminal Phe of angiotensin II
          (its best substrate) and, much less efficiently, the C-terminal Leu of
          angiotensin I to give angiotensin-(1-9) (AGT 25-33). Neprilysin cleaves
          angiotensin I and angiotensin-(1-9) directly to angiotensin-(1-7), and ACE also
          converts angiotensin-(1-9) to angiotensin-(1-7). The lysosomal
          prolylcarboxypeptidase PRCP releases the C-terminal Phe of angiotensin II and
          III. Which enzyme dominates depends on the tissue and on their relative levels.
        variant_sets:
          - id: ras_angiotensin_1_7_forming_enzymes
            label: Angiotensin-(1-7)-forming peptidases
            axis: peptidase and substrate route
            selection: ONE_OR_MORE
            notes: >-
              Three routes: from angiotensin II by ACE2 (dominant; kcat/Km 2.2e6 M-1 s-1
              in PMID:15283675) or PRCP; from angiotensin I directly by neprilysin; and
              from angiotensin I via angiotensin-(1-9) by ACE2 followed by neprilysin or
              ACE. Each route alone yields angiotensin-(1-7).
