                      source on this biochemical evidence. Its GO:0002003 row is IEA only.
                      Lysosome is its only location here because the cited angiotensin
                      cleavage was characterised at the acid optimum; the endothelial-surface
                      pool is noted but no cached source shows angiotensin cleavage there.
                    evidence:
                      - source_id: PMID:28321
                        statement: Purified human kidney PRCP cleaves the C-terminal Pro-Phe bond of angiotensin II.
                        supporting_text: The enzyme cleaved benzyloxycarbonyl (Cbz)-Pro-Phe, representing the COOH-terminal end of angiotensin II
                      - source_id: PMID:28321
                        statement: PRCP has an acid pH optimum but keeps half its activity at neutral pH.
                        supporting_text: The enzyme had an acid pH optimum (4.5 to 5.5), but hydrolyzed angiotensin III at pH 7 at 50% of the optimal rate.
              - id: ras_ace_angiotensin_1_9_variant
                label: ACE (from angiotensin-(1-9))
                module_type: REACTION
