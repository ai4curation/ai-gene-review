                        term:
                          id: UniProtKB:Q9BYF1
                          label: Angiotensin-converting enzyme 2
                    function:
                      preferred_term: carboxypeptidase activity
                      term:
                        id: GO:0004180
                        label: carboxypeptidase activity
                      substrates:
                        - preferred_term: angiotensin II (AGT 25-32) and angiotensin I (AGT 25-34)
                          term:
                            id: UniProtKB:P01019
                            label: Angiotensinogen
                    processes:
                      - preferred_term: angiotensin maturation
                        term:
                          id: GO:0002003
                          label: angiotensin maturation
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Captopril-insensitive zinc monocarboxypeptidase. Its efficient
                      reaction is angiotensin II to angiotensin-(1-7); the reaction on
                      angiotensin I to angiotensin-(1-9) is several hundred-fold weaker.
                      Both are one activity (single C-terminal residue removal) and are
                      kept on one annoton. Its separate role as the SARS-CoV-2 receptor is
                      outside this module.
                    evidence:
                      - source_id: PMID:15283675
                        statement: ACE2 efficiently cleaves angiotensin II to angiotensin-(1-7).
                        supporting_text: Ang II was cleaved efficiently by ACE2 to Ang (1-7)
                      - source_id: PMID:10969042
                        statement: ACE2 removes the C-terminal Leu of angiotensin I to give angiotensin-(1-9).
                        supporting_text: Recombinant ACE2 hydrolyzes the carboxy terminal leucine from angiotensin I to generate angiotensin 1-9
                      - source_id: PMID:10924499
                        statement: On the angiotensins ACE2 acts only as a carboxypeptidase.
                        supporting_text: In the hydrolysis of the angiotensins, ACEH functions exclusively as a carboxypeptidase.
                      - source_id: PMID:10969042
                        statement: ACE2 is insensitive to ACE inhibitors.
                        supporting_text: ACE2 is not inhibited by lisinopril or captopril.
              - id: ras_neprilysin_variant
                label: Neprilysin (MME) (from angiotensin I or angiotensin-(1-9))
                module_type: REACTION
                annotons:
                  - id: mme_angiotensin_cleavage
                    label: Neprilysin metalloendopeptidase activity converting angiotensin I and angiotensin-(1-9) to angiotensin-(1-7)
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MME
                        term:
                          id: UniProtKB:P08473
                          label: Neprilysin
                    function:
                      preferred_term: metalloendopeptidase activity
                      term:
                        id: GO:0004222
                        label: metalloendopeptidase activity
                      substrates:
                        - preferred_term: angiotensin I (AGT 25-34) and angiotensin-(1-9) (AGT 25-33)
                          term:
                            id: UniProtKB:P01019
                            label: Angiotensinogen
                    processes:
                      - preferred_term: angiotensin maturation
                        term:
                          id: GO:0002003
                          label: angiotensin maturation
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Neutral endopeptidase 24.11 cuts the Pro7-Phe8 bond of angiotensin I
                      and angiotensin-(1-9), bypassing angiotensin II. It also degrades
                      angiotensin II to smaller fragments, so it is both a source of
                      angiotensin-(1-7) and an angiotensinase. MME carries
                      metalloendopeptidase activity by EXP/IDA; its GO:0002003 row is IEA.
                    evidence:
                      - source_id: PMID:15283675
                        statement: Neprilysin efficiently cleaves angiotensin I to angiotensin-(1-7).
                        supporting_text: Ang I was effectively cleaved by NEP to Ang (1-7)
                      - source_id: PMID:15283675
                        statement: Angiotensin-(1-9) is a better neprilysin substrate than an ACE substrate.
                        supporting_text: Ang (1-9) was a better substrate for NEP than ACE
              - id: ras_prcp_variant
                label: Prolylcarboxypeptidase (PRCP) (from angiotensin II and III)
                module_type: REACTION
                annotons:
                  - id: prcp_angiotensin_ii_cleavage
                    label: Prolylcarboxypeptidase serine-type carboxypeptidase activity on angiotensin II and III
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PRCP
                        term:
                          id: UniProtKB:P42785
                          label: Lysosomal Pro-X carboxypeptidase
                    function:
                      preferred_term: serine-type carboxypeptidase activity
                      term:
                        id: GO:0004185
                        label: serine-type carboxypeptidase activity
                      substrates:
                        - preferred_term: angiotensin II (AGT 25-32) and angiotensin III (AGT 26-32)
                          term:
                            id: UniProtKB:P01019
                            label: Angiotensinogen
                    processes:
                      - preferred_term: angiotensin maturation
                        term:
                          id: GO:0002003
                          label: angiotensin maturation
                    locations:
                      - preferred_term: lysosome
                        term:
                          id: GO:0005764
                          label: lysosome
                    role_description: >-
                      "Angiotensinase C": cleaves the Pro7-Phe8 bond of angiotensin II and
