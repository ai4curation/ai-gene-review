knowledge_gaps:
  - gap_statement: >-
      Whether the (pro)renin receptor ATP6AP2 contributes measurably to angiotensin
      generation in vivo is unresolved. It increases renin's catalytic efficiency and
      activates prorenin in cell systems, but the plasma concentrations of renin and
      prorenin are far below the receptor's binding affinity, and its essential
      V-ATPase role confounds loss-of-function experiments, so the angiotensin-dependent
      contribution has not been separated from its other functions.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      It decides whether tissue angiotensin II generation is a receptor-scaffolded
      surface process or simply soluble renin acting locally.
    provenance:
      - reference_id: PMID:12045255
        supporting_text: This discovery emphasizes the role of the cell surface in angiotensin II generation
  - gap_statement: >-
      The relative in vivo flux of angiotensin I and angiotensin II through ACE,
      chymase, ACE2, neprilysin and prolylcarboxypeptidase in a given tissue is not
      known. Kinetic constants are measured on purified enzymes, but the outcome depends
      on local enzyme amounts, membrane localisation and competition for the same
      peptides, which current measurements do not resolve in intact tissue.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      It determines whether vasoconstrictor or vasodilator angiotensins predominate
      locally and why ACE inhibition leaves residual tissue angiotensin II.
    provenance:
      - reference_id: PMID:15283675
        supporting_text: the flux of peptides through the RAS is complex
