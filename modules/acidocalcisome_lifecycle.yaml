id: MODULE:acidocalcisome_lifecycle
title: Acidocalcisome lifecycle
description: The acidocalcisome is an acidic, electron-dense organelle that stores polyphosphate, pyrophosphate,
  calcium, magnesium and other cations, and that takes part in phosphate and cation storage, pH homeostasis
  and osmoregulation. It is best known in trypanosomatids and apicomplexan parasites and is also found in
  green algae and diatoms; the polyphosphate-filled vacuole of fungi and the dense granules of animal platelets
  are related compartments. Its membrane proteins are delivered from the Golgi by the AP-3 adaptor, its
  lumen is acidified by a proton pyrophosphatase or the V-ATPase, and its polyphosphate is made and translocated
  into it by the VTC complex. This umbrella module composes the modules for those stages by reference.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: file:modules/acidocalcisome_polyphosphate_storage.yaml
  title: Acidocalcisome polyphosphate storage
  statement: VTC-dependent polyphosphate synthesis into a lumen acidified by an H+-PPase or the V-ATPase,
    with AP-3 delivery of membrane proteins optional.
- source_id: PMID:15738951
  title: Acidocalcisomes - conserved from bacteria to man.
  statement: Review of acidocalcisome composition and function.
  supporting_text: Acidocalcisomes have been linked with several functions, including storage of cations
    and phosphorus, polyphosphate metabolism, calcium homeostasis, maintenance of intracellular pH homeostasis
    and osmoregulation.
notes: 'Organelle lifecycle umbrella (see projects/ORGANELLE_LIFECYCLES.md); stage roles follow the shared
  skeleton. Read as a satisfiability rule, the umbrella is satisfied when acidocalcisome_polyphosphate_storage
  is, which tests for a VTC-domain polyphosphate polymerase subunit and an acidifying pump. It is therefore a rule
  for the VTC lineages (trypanosomatids, apicomplexans, green algae, diatoms and fungi) and is not met in
  animals or land plants, which have no VTC. A genome that fails it may still have acidocalcisomes, as Dictyostelium
  does; see that module''s notes. The inositol pyrophosphate pathway is optional: in yeast, inositol pyrophosphates
  bound by the SPX domains of the VTC complex stimulate polyphosphate synthesis, but trypanosomatid Vtc4
  lacks an SPX domain and the pathway is not shown to act on acidocalcisomes in every lineage. Not yet modelled:
  acidocalcisome division and fusion, its link with the contractile vacuole in Dictyostelium, Chlamydomonas
  and trypanosomes, the acidocalcisome Ca2+-ATPase and IP3 receptor, polyphosphate turnover, and autophagic
  or secretory turnover of the organelle.'
