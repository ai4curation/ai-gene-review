id: MODULE:c_elegans_translation_surveillance_immunity
title: ZIP-2/CEBP-2 translation-surveillance immunity in Caenorhabditis elegans
description: >-
  Caenorhabditis elegans can detect a pathogen by the damage it does to a core
  host process instead of by recognizing a microbial molecule. The best
  defined case is translation surveillance in the intestine. Pseudomonas
  aeruginosa Exotoxin A (ToxA) is endocytosed and ADP-ribosylates elongation
  factor 2, which inhibits host mRNA translation. Chemical translation
  inhibitors such as cycloheximide, and loss of other core host functions,
  trigger the same response. Enzymatically inactive ToxA does not. So the
  host senses the block in translation, not the toxin itself. Translation
  inhibition raises the level of the bZIP transcription factor ZIP-2 through a
  conserved upstream open reading frame (uORF) in the zip-2 mRNA. This fits a
  model in which a general fall in translation derepresses ZIP-2 synthesis.
  ZIP-2 acts with the C/EBP-gamma ortholog CEBP-2, a bZIP partner that binds
  it, to induce a set of intestinal infection-response genes. These include
  irg-1 and irg-2, which are induced independently of the PMK-1 p38 MAPK,
  DBL-1 TGF-beta and KGB-1 JNK pathways. zip-2 and cebp-2 mutants are more
  susceptible to P. aeruginosa and to ToxA. The molecular functions of the
  IRG-1 and IRG-2 proteins are unknown. Mitochondrial surveillance through
  ATFS-1 and the mitochondrial UPR is a parallel, separately regulated
  surveillance pathway.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:22520464
    title: >-
      Host translational inhibition by Pseudomonas aeruginosa Exotoxin A
      Triggers an immune response in Caenorhabditis elegans.
    statement: >-
      The host senses ToxA through its effect on translation. Catalytically
      inactive ToxA does not induce the response, and translation block alone
      does.
    supporting_text: >-
      ToxA-responsive genes are not induced by enzymatically inactive ToxA
      protein but can be upregulated independently of ToxA by disruption of
      host protein translation.
  - source_id: PMID:22520464
    title: >-
      Host translational inhibition by Pseudomonas aeruginosa Exotoxin A
      Triggers an immune response in Caenorhabditis elegans.
    statement: >-
      Both the ZIP-2 pathway and the ATF-7 (PMK-1) pathway are needed to
      survive ToxA.
    supporting_text: >-
      immune pathways involving the ATF-7 and ZIP-2 transcription factors,
      which protect C. elegans from P. aeruginosa, are required for preventing
      ToxA-mediated lethality.
  - source_id: PMID:22520465
    title: >-
      C. elegans detects pathogen-induced translational inhibition to activate
      immune signaling.
    statement: >-
      The zip-2/irg-1 pathway is induced by several core-process disruptions,
      not only by infection.
    supporting_text: >-
      In the absence of infection we find that the zip-2/irg-1 pathway is
      upregulated following disruption of several core host processes,
      including inhibition of mRNA translation.
  - source_id: PMID:20133860
    title: >-
      bZIP transcription factor zip-2 mediates an early response to
      Pseudomonas aeruginosa infection in Caenorhabditis elegans.
    statement: >-
      Most genes induced by virulent P. aeruginosa are independent of known
      immunity pathways, and ZIP-2 is required to induce irg-1 and to defend
      against the pathogen.
    supporting_text: >-
      This screen identified zip-2, a bZIP transcription factor that is
      required for inducing irg-1, as well as several other genes, and is
      important for defense against infection by P. aeruginosa.
  - source_id: file:modules/c_elegans_pmk1_intestinal_immunity.yaml
    title: PMK-1 p38 MAPK intestinal innate immunity in Caenorhabditis elegans
    statement: >-
      The parallel, PMK-1/ATF-7-dependent intestinal immune pathway. It is
      also needed for ToxA survival but does not induce irg-1 or irg-2.
notes: >-
  Boundary. This is a concrete C. elegans module for the ZIP-2 branch of
  surveillance immunity: translation inhibition -> uORF-mediated derepression
  of ZIP-2 -> ZIP-2/CEBP-2-dependent transcription -> irg-1/irg-2 output. It
  has three parts. The biology is thin in one respect. The sensing step is
  carried by ZIP-2 itself, through a cis-acting uORF in its own mRNA, so part
  1 and part 2 have the same protein. They are kept as separate parts because
  they are different mechanisms: translational control of ZIP-2 abundance in
  part 1, and ZIP-2/CEBP-2 transcription factor activity in part 2. Part 1
  has no molecular function because the regulated entity is the zip-2 mRNA,
  not an activity of a protein.

  Exclusions and cross-references. GCN-2, the eIF2-alpha kinase of the worm
  integrated stress response, is not modeled as a member. No cached paper
  shows that GCN-2 or eIF2-alpha phosphorylation is needed for ZIP-2
  induction, and the gcn-2 review places GCN-2 in amino-acid-starvation and
  mitochondrial-stress translational control. Whether the zip-2 uORF responds
  to eIF2-alpha phosphorylation or to a general fall in initiation is open
  (see knowledge_gaps). ATFS-1 and the mitochondrial UPR are a separate
  surveillance pathway that detects loss of mitochondrial import (PMID:25274306)
  and is not modeled here. ZIP-2 activation during aging is independent of
  ATFS-1 and CEBP-2 (PMID:32350153). ZIP-2 and CEBP-2 also take part in the
  ESRE network, which responds to mitochondrial damage in liquid-killing
  assays (PMID:28662060). That broader bZIP network is recorded as context.
  The PMK-1/ATF-7 pathway is modeled in
  MODULE:c_elegans_pmk1_intestinal_immunity. Both pathways protect against
  ToxA, but irg-1 and irg-2 induction does not need PMK-1. CEBP-2 also acts
  with ZIP-11 in a PMK-1-independent response (PMID:34804026), which is not
  modeled.

  Ontology. GO has no term for surveillance (effector-triggered) immunity in
  animals or for a response to host translation inhibition. The module
  therefore uses antibacterial innate immune response and defense response to
  Gram-negative bacterium as its process concepts. The surveillance character
  is described in text.
module:
  id: c_elegans_translation_surveillance_immunity
  label: ZIP-2/CEBP-2 translation-surveillance immunity in C. elegans
  module_type: SIGNALING_PATHWAY
  description: >-
    Intestinal surveillance pathway. Pathogen-imposed translation inhibition
    derepresses ZIP-2 through its uORF, and ZIP-2 with CEBP-2 then induces
    the PMK-1-independent infection-response genes irg-1 and irg-2.
  concepts:
    - preferred_term: antibacterial innate immune response
      term:
        id: GO:0140367
        label: antibacterial innate immune response
    - preferred_term: defense response to Gram-negative bacterium
      term:
        id: GO:0050829
        label: defense response to Gram-negative bacterium
      description: The defined trigger is P. aeruginosa and its Exotoxin A.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    anatomical_locations:
      - preferred_term: intestine
        description: >-
          WBbt:0005772 intestine. ZIP-2 is expressed throughout the intestine
          and irg-1 is an intestinal gene. The WBbt id is given in text because
          the WBbt prefix is not configured for label validation.
    conditions:
      - preferred_term: Pseudomonas aeruginosa PA14 infection (Exotoxin A)
      - preferred_term: chemical translation inhibition (e.g. cycloheximide)
  parts:
    - order: 1
      role: sensing of translation inhibition by uORF-mediated ZIP-2 derepression
      node:
        id: zip2_derepression
        label: Translation-block derepression of ZIP-2 protein
        module_type: REGULATORY_STEP
        description: >-
          ToxA endocytosed during infection, or cycloheximide, inhibits
          intestinal mRNA translation. ZIP-2 protein levels then rise. The
          increase depends on a conserved uORF in the zip-2 mRNA. Normally the
          uORF limits translation of the main ZIP-2 open reading frame, and
          translation inhibition is proposed to relieve this. The input is a
          host-process defect, not a microbial ligand.
        annotons:
          - id: zip2_uorf_target
            label: zip-2 uORF-regulated translation
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ZIP-2
                term:
                  id: UniProtKB:Q21148
                  label: Transcription factor zip-2
            processes:
              - preferred_term: antibacterial innate immune response
                term:
                  id: GO:0140367
                  label: antibacterial innate immune response
            role_description: >-
              The sensed quantity is ZIP-2 abundance. Its synthesis is
              controlled in cis by the zip-2 uORF and rises when host
              translation is inhibited. No molecular function is asserted for
              this step.
            evidence:
              - source_id: PMID:22520465
                title: >-
                  C. elegans detects pathogen-induced translational inhibition
                  to activate immune signaling.
                statement: ToxA-mediated translation inhibition raises ZIP-2 protein levels.
                supporting_text: >-
                  P. aeruginosa infection inhibits mRNA translation in the
                  intestine via the endocytosed translation inhibitor Exotoxin
                  A, which leads to an increase in ZIP-2 protein levels.
              - source_id: PMID:22520465
                title: >-
                  C. elegans detects pathogen-induced translational inhibition
                  to activate immune signaling.
                statement: ZIP-2 induction is conferred by a conserved uORF.
                supporting_text: >-
                  ZIP-2 induction is conferred by a conserved upstream open
                  reading frame in zip-2 that could derepress ZIP-2
                  translation upon infection.
              - source_id: file:worm/zip-2/zip-2-uniprot.txt
                title: UniProt Q21148 zip-2 entry
                statement: ZIP-2 is induced by translational inhibitors and by ToxA.
                supporting_text: >-
                  Induced by translational inhibitors such as cycloheximide
                  and exogenous or P.aeruginosa-derived ToxA
    - order: 2
      role: ZIP-2/CEBP-2 bZIP transcriptional activation
      node:
        id: zip2_cebp2_transcription
        label: ZIP-2 and CEBP-2 transcriptional activation
        module_type: MOLECULAR_FUNCTION
        description: >-
          Nuclear ZIP-2 and its bZIP partner CEBP-2 are both needed to induce
          irg-1 after P. aeruginosa infection and to survive infection and
          ToxA. The two proteins interact in bZIP interaction screens. That
          they bind DNA as a heterodimer at target promoters is inferred, not
          shown.
        annotons:
          - id: zip2_tf
            label: ZIP-2 bZIP transcription factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ZIP-2
                term:
                  id: UniProtKB:Q21148
                  label: Transcription factor zip-2
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
              targets:
                - preferred_term: irg-1 and irg-2
            processes:
              - preferred_term: positive regulation of transcription by RNA polymerase II
                term:
                  id: GO:0045944
                  label: positive regulation of transcription by RNA polymerase II
              - preferred_term: defense response to Gram-negative bacterium
                term:
                  id: GO:0050829
                  label: defense response to Gram-negative bacterium
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Surveillance-induced transcription factor that is required to
              induce irg-1, irg-2 and other infection-response genes.
            evidence:
              - source_id: PMID:20133860
                title: >-
                  bZIP transcription factor zip-2 mediates an early response to
                  Pseudomonas aeruginosa infection in Caenorhabditis elegans.
                statement: ZIP-2 belongs to a specialized pathogen-response pathway induced by virulent P. aeruginosa.
                supporting_text: >-
                  These data indicate that zip-2 is part of a specialized
                  pathogen response pathway that is induced by virulent
                  strains of P. aeruginosa and provides defense against this
                  pathogen.
              - source_id: file:worm/zip-2/zip-2-uniprot.txt
                title: UniProt Q21148 zip-2 entry
                statement: ZIP-2 is required to activate irg-1 and irg-2 after infection.
                supporting_text: >-
                  Required for the activation of several infection response
                  genes including irg-1 and irg-2 following P.aeruginosa
                  infection
          - id: cebp2_tf
            label: CEBP-2 bZIP transcription factor (ZIP-2 partner)
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CEBP-2
                term:
                  id: UniProtKB:Q8IG69
                  label: CCAAT/enhancer-binding protein homolog 2
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
              description: >-
                The cebp-2 review also accepts protein dimerization activity
                (GO:0046983) for its bZIP heterodimerization with ZIP-2,
                ZIP-11 and others.
              targets:
                - preferred_term: irg-1
            processes:
              - preferred_term: defense response to Gram-negative bacterium
                term:
                  id: GO:0050829
                  label: defense response to Gram-negative bacterium
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              C/EBP-gamma ortholog that acts together with ZIP-2 and is required
              for irg-1 induction and for survival of infection and ToxA.
            evidence:
              - source_id: PMID:26876169
                title: >-
                  The C. elegans CCAAT-Enhancer-Binding Protein Gamma Is
                  Required for Surveillance Immunity.
                statement: CEBP-2 acts with ZIP-2 in the response to ToxA translational block.
                supporting_text: >-
                  We show that CEBP-2 acts together with the bZIP
                  transcription factor ZIP-2 in the protective response to
                  translational block by P. aeruginosa Exotoxin A as well as
                  perturbations of other processes.
              - source_id: file:worm/cebp-2/cebp-2-uniprot.txt
                title: UniProt Q8IG69 cebp-2 entry
                statement: CEBP-2 is required for irg-1 activation after infection.
                supporting_text: >-
                  Required for the activation of infection response gene irg-1
                  following P.aeruginosa infection
              - source_id: file:worm/cebp-2/cebp-2-uniprot.txt
                title: UniProt Q8IG69 cebp-2 entry
                statement: CEBP-2 and ZIP-2 interact in binary interaction data (IntAct).
                supporting_text: >-
                  Q8IG69; Q21148: zip-2; NbExp=3; IntAct=EBI-2914231, EBI-6731556;
    - order: 3
      role: PMK-1-independent infection-response gene output
      node:
        id: irg_output
        label: irg-1/irg-2 infection-response output
        module_type: BIOLOGICAL_PROCESS
        description: >-
          irg-1 and irg-2 are induced in the intestine by virulent P.
          aeruginosa, but not by an attenuated gacA mutant, and by
          translation inhibitors. Induction needs ZIP-2 but not PMK-1, DBL-1
          or KGB-1. They are the standard readouts of the pathway. IRG-1 has a
          NADAR domain with no demonstrated activity. IRG-2 has no recognizable
          domain. Neither protein has a demonstrated molecular function, and
          whether either one contributes to resistance, rather than only
          reporting ZIP-2 activity, is not established.
        annotons:
          - id: irg1_output
            label: IRG-1 infection-response protein
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: IRG-1
                term:
                  id: UniProtKB:O16327
                  label: Protein irg-1
            processes:
              - preferred_term: antibacterial innate immune response
                term:
                  id: GO:0140367
                  label: antibacterial innate immune response
            role_description: >-
              ZIP-2- and CEBP-2-dependent output and reporter of the pathway.
              No molecular function is asserted. The NADAR domain suggests an
              ADP-ribose-related hydrolase, but no activity has been shown.
            evidence:
              - source_id: file:worm/irg-1/irg-1-uniprot.txt
                title: UniProt O16327 irg-1 entry
                statement: irg-1 induction depends on zip-2 and not on PMK-1, DBL-1, KGB-1 or BAR-1.
                supporting_text: >-
                  dependent on zip-2, but independent of several
                  immunity-related pathways including pmk-1 p38MAPK, dbl-1
                  TGF-beta, kgb-1 JNK and bar-1/beta-catenin pathways
              - source_id: PMID:20133860
                title: >-
                  bZIP transcription factor zip-2 mediates an early response to
                  Pseudomonas aeruginosa infection in Caenorhabditis elegans.
                statement: irg-1 is strongly induced by virulent P. aeruginosa PA14 only.
                supporting_text: >-
                  We generated a GFP reporter for one of these genes,
                  infection response gene 1 (irg-1), which is induced strongly
                  by wild-type P. aeruginosa strain PA14, but not by other C.
                  elegans pathogens
          - id: irg2_output
            label: IRG-2 infection-response protein
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: IRG-2
                term:
                  id: UniProtKB:O16224
                  label: Protein irg-2
            processes:
              - preferred_term: antibacterial innate immune response
                term:
                  id: GO:0140367
                  label: antibacterial innate immune response
            role_description: >-
              ZIP-2-dependent, PMK-1-independent output, co-induced with irg-1.
              No molecular function, partner or localization is known.
            evidence:
              - source_id: file:worm/irg-2/irg-2-uniprot.txt
                title: UniProt O16224 irg-2 entry
                statement: irg-2 is induced by translation inhibitors and ToxA in a zip-2-dependent manner.
                supporting_text: >-
                  Induced, in a zip-2 dependent manner, by translation
                  inhibitors such as cycloheximide and exogenous or
                  P.aeruginosa-derived ToxA
              - source_id: PMID:32350153
                title: >-
                  A cellular surveillance and defense system that delays aging
                  phenotypes in C. elegans.
                statement: irg-1 and irg-2 rise with age as ZIP-2 targets.
                supporting_text: >-
                  the expression of the ZIP-2 targets irg-1 (Figure 2A) and
                  irg-2 (Figure 2B) increased 24.0-fold and 15.5-fold,
                  respectively, from day 1 to day 8 of adulthood
  connections:
    - source: zip2_derepression
      target: zip2_cebp2_transcription
      connection_type: POSITIVELY_REGULATES
      description: >-
        More ZIP-2 protein, made when translation is blocked, increases
        ZIP-2/CEBP-2-dependent transcription.
    - source: zip2_cebp2_transcription
      target: irg_output
      connection_type: CAUSES
      description: ZIP-2 and CEBP-2 induce irg-1 and irg-2.
knowledge_gaps:
  - gap_statement: >-
      How a fall in host translation is turned into more ZIP-2 is not
      resolved. It is not known whether the zip-2 uORF responds to
      eIF2-alpha phosphorylation (by GCN-2 or PEK-1), as ATF4 uORFs do, or to
      a general fall in initiation or elongation. ZIP-2 stability may also
      contribute.
    boundary: >-
      The uORF is needed for ZIP-2 induction. No eIF2-alpha kinase has been
      shown to be required, and ToxA blocks elongation, not initiation.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether translation surveillance is a branch of the
      integrated stress response or a separate, elongation-sensitive
      mechanism.
    resolution: >-
      Test ZIP-2 induction by ToxA and cycloheximide in gcn-2, pek-1 and
      eIF2-alpha S49A non-phosphorylatable mutants. Do ribosome profiling of
      the zip-2 uORF and main ORF under each inhibitor.
    provenance:
      - reference_id: PMID:22520465
        supporting_text: >-
          ZIP-2 induction is conferred by a conserved upstream open reading
          frame in zip-2 that could derepress ZIP-2 translation upon infection.
  - gap_statement: >-
      The molecular functions of IRG-1 and IRG-2 are unknown, and it has not
      been established whether either protein contributes to defense or only
      reports ZIP-2 activity.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Without them the module's output is a transcriptional readout, not a
      defined effector mechanism.
    resolution: >-
      Test irg-1 and irg-2 single and double mutants for survival on P.
      aeruginosa and ToxA. Assay recombinant IRG-1 for NADAR-type
      ADP-ribose-conjugate hydrolase activity.
    provenance:
      - reference_id: file:worm/irg-2/irg-2-ai-review.yaml
        supporting_text: >-
          Whether the protein itself contributes to pathogen resistance, as
          opposed to serving as a downstream reporter of ZIP-2 activation, is
          not established.
