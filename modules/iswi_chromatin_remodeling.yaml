    axis: regulatory (accessory) subunit paired with the ISWI ATPase
    variant_kind: REALIZER
    selection: ONE_OR_MORE
    notes: >-
      Several complexes coexist in a cell; each is an alternative carrier of the ISWI remodeling activity
      with its own genomic targeting.
    variants:
    - id: acf
      label: ACF complex (SMARCA5-BAZ1A)
      module_type: PROTEIN_COMPLEX
      description: >-
        Heterodimer of SMARCA5 and BAZ1A that assembles and spaces nucleosomes; required for replication
        through pericentromeric heterochromatin.
      concepts:
      - preferred_term: ACF complex
        term:
          id: GO:0016590
          label: ACF complex
      annotons:
      - id: acf_complex
        label: ACF complex (SMARCA5-BAZ1A)
        participant:
          selector_type: PROTEIN_COMPLEX
