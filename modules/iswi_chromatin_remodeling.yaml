            term:
              id: GO:0016590
              label: ACF complex
            active_units:
            - id: acf_atpase
              label: SMARCA5 (SNF2H) ISWI ATPase, or SMARCA1 (SNF2L)
              role: >-
                Catalytic ISWI ATPase that slides histone octamers along DNA. SMARCA5 is the ATPase named
                by the GO definition of this complex; SMARCA1 can replace it (PMID:28801535).
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: ISWI ATPase paralogues (SMARCA5/SNF2H canonical here, SMARCA1/SNF2L
                    alternative)
                  representative_members:
                  - preferred_term: SMARCA5
                    term:
                      id: UniProtKB:O60264
                      label: SWI/SNF-related matrix-associated actin-dependent regulator of chromatin
                        subfamily A member 5
                  - preferred_term: SMARCA1
                    term:
                      id: UniProtKB:P28370
                      label: SWI/SNF-related matrix-associated actin-dependent regulator of chromatin
                        subfamily A member 1
              function:
                preferred_term: histone octamer slider activity
                term:
                  id: GO:0140751
                  label: histone octamer slider activity
              evidence:
              - source_id: PMID:9836642
                statement: RSF (SNF2H with RSF1) has ATP-dependent nucleosome-remodeling and spacing activities.
                supporting_text: >-
                  This factor, remodeling and spacing factor (RSF), has adenosine triphosphate-dependent
                  nucleosome-remodeling and spacing activities.
              - source_id: PMID:28801535
                statement: >-
                  Endogenous SMARCA1 and SMARCA5 each co-purify with every ISWI regulatory subunit, so
                  either ATPase can occupy the catalytic position of each complex.
