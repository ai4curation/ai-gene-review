  module_type: PROTEIN_COMPLEX
  description: >-
    SMARCA5- or SMARCA1-driven nucleosome sliding and spacing complexes, each defined by one regulatory
    subunit (BAZ1A, BAZ1B, BPTF, RSF1, BAZ2A or CECR2).
