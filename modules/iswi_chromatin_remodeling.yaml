id: MODULE:iswi_chromatin_remodeling
title: >-
  Mammalian ISWI chromatin remodeling complexes — SMARCA5 (SNF2H) or SMARCA1 (SNF2L) ATPase paired with
  a BAZ/BPTF-family regulatory subunit: ACF (BAZ1A), CHRAC (BAZ1A, CHRAC1, POLE3), WICH (BAZ1B), NURF
  (BPTF, RBBP4/7), RSF (RSF1), NoRC (BAZ2A) and CERF (CECR2)
description: >-
  ISWI (imitation switch) remodelers are ATP-dependent chromatin remodelers of the SNF2 family that slide
  histone octamers along DNA. Most of their complexes assemble and space nucleosomes into regular arrays.
  Humans have two ISWI ATPases, SMARCA5 (SNF2H), which is ubiquitous, and SMARCA1 (SNF2L), which is enriched
  in the nervous system. Each ATPase pairs with one large regulatory subunit, and the regulatory subunit
  defines the complex and where it acts. BAZ1A (ACF1) forms ACF, and with the histone-fold heterodimer
  CHRAC1-POLE3 it forms CHRAC; both help replicate condensed heterochromatin. BAZ1B (WSTF) forms WICH,
  which acts at replication forks and at RNA polymerase I and III genes. BPTF forms NURF with RBBP4 or
  RBBP7; BPTF reads H3K4me3 and acetylated H4 and recruits NURF to active promoters. RSF1 forms RSF, which
  deposits histones and spaces nucleosomes. BAZ2A (TIP5) forms the nucleolar NoRC, which silences rRNA
  genes. CECR2 forms CERF, which acts in neural development. GO and the first purifications assign one
  ATPase to each complex, but both ATPases co-purify with every regulatory subunit, so each complex can
  exist in a SNF2H and a SNF2L form.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PW:0001339
  title: chromatin remodeling pathway
  statement: >-
    The module models the ISWI branch of the RGD chromatin remodeling pathway. RGD's text names ISWI as
    one of four remodeler families, and its diagram draws the ACF, CHRAC and NURF complexes positively
    affecting gene expression, the WICH complex affecting the DNA replication pathway and ISWI affecting
    ATM signaling. RGD's ISWI genes are SMARCA5, SMARCA1, BAZ1A, BAZ1B, BPTF, CHRAC1 and POLE3. Derived
    through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001339.yaml); the SWI/SNF, INO80 and CHD branches
    are other modules.
- source_id: GO:0006338
  title: chromatin remodeling
  statement: >-
    The GO process mapped to PW:0001339 (skos:closeMatch, from the PW definition cross-reference and a
    label match in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is the process carried by
    each complex annoton.
- source_id: GO:0031010
  title: ISWI-type complex
  statement: >-
    Module concept: nuclear complexes containing an ISWI-family ATPase. Each variant is typed with one
    of its children (ACF complex, CHRAC, WICH complex, NURF complex, RSF complex, NoRC complex, CERF complex).
- source_id: PMID:28801535
  statement: 'Systematic purification of endogenous ISWI complexes: all regulatory subunits co-purify
    with both ATPases.'
  supporting_text: All ISWI regulatory subunits co‐purify with the ATPases SMARCA1 and SMARCA5.
notes: 'Derived from the RGD Pathway Ontology term PW:0001339 (chromatin remodeling pathway) through the
  RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier related_module_only).
  RGD curates 74 human genes to PW:0001339 and has no gene-level diagram; its text describes four unrelated
  remodeler families, so the project models the pathway as one human module per SNF2-family complex group.
  This module is the ISWI group; the SWI/SNF group is modules/swi_snf_chromatin_remodeling (drafted together
  with this one). INO80, SRCAP, TIP60/p400 and CHD/NuRD genes on the RGD list are left for other modules.


  RGD genes in scope (7): SMARCA5 SMARCA1 BAZ1A BAZ1B BPTF CHRAC1 POLE3, all modelled. RGD draws ACF,
  CHRAC, WICH and NURF. Added beyond the RGD list: RBBP4 and RBBP7 as the histone-binding NURF subunits
  (both are on the RGD list, presumably for NuRD, and are used here only in their NURF position), and
  three further complexes with their regulatory subunits RSF1 (RSF), BAZ2A (NoRC) and CECR2 (CERF). These
  three are included because each has a GO complex term whose definition names its human subunits, a human
  purification with remodeling activity cached here (PMID:9836642 and PMID:12972596 for RSF, PMID:11532953
  for NoRC, PMID:15640247 for CERF), experimental GOA rows on its subunits, and co-purification of the
  regulatory subunit with endogenous ISWI ATPases (PMID:28801535). Excluded: BAZ2B, the seventh regulatory
  subunit identified in PMID:28801535 (a BAZ2B-SMARCA5 complex is so far supported only by that proteomic
  study and has no GO term, so it is noted rather than modelled); DNA polymerase epsilon (POLE3 also belongs
  to it with POLE4, and POLE4 is not a CHRAC subunit); the larger B-WICH assembly (WICH with nuclear myosin
  1, DEK, MYBBP1A, DDX21 and others; PMID:16603771), recorded as WICH context; WINAC (BAZ1B with SWI/SNF
  subunits), which is neither an ISWI complex nor modelled in the SWI/SNF module; and TTF-I, pRNA, HDAC1,
  SIN3 and DNMTs that act with NoRC.


  Structure. Following the Drosophila analogue modules/dmel_iswi_complexes (NURF, NORC, ACF, CHRAC, TORC,
  RSF), each complex is a variant of one REALIZER variant set (selection ONE_OR_MORE) with a protein-complex
  annoton listing its subunits. The ATPase position is a FAMILY unit in every complex, with the ATPase
  named by the GO definition listed first (SMARCA5 for ACF, CHRAC, WICH, RSF and NoRC; SMARCA1 for NURF
  and CERF) and the other paralogue second, because endogenous SMARCA1 and SMARCA5 each co-purify with
  every regulatory subunit (PMID:28801535) and GOA has NURF-complex IDA rows for both ATPases (PMID:20850016).
  RBBP4/RBBP7 is a FAMILY unit; the cached quote names RBBP4, and RBBP7 rests on its NURF IPI row from
  PMID:14609955 (abstract-only cache). Drosophila TORC has no mammalian counterpart and is not modelled.
  The fly module is the evolutionary counterpart and is not referenced as a module_ref.


  Molecular functions. Functions come from each protein''s experimental GO annotations in QuickGO (November
  2026) and, where a gene review exists (BPTF, CHRAC1, BAZ2A, POLE4), from its core functions. The SMARCA5-led
  ATPase family carries histone octamer slider activity (SMARCA5 IDA, PMID:9836642), the SMARCA1-led family
  ATP-dependent chromatin remodeler activity (SMARCA1 IDA, PMID:15640247). Complex annotons carry ATP-dependent
  chromatin remodeler activity, except RSF, which carries nucleosome array spacer activity (its defining
  reaction, PMID:9836642), and NoRC, which carries histone octamer slider activity (PMID:11532953); all
  carry chromatin remodeling and chromatin, and NoRC also nucleolus. CHRAC1 and POLE3 carry DNA binding
  (the heterodimer binds naked DNA, PMID:10880450; CHRAC1 review core function); for POLE3 this is authored
  from that assay, as POLE3 has no experimental DNA-binding row. BPTF carries histone H3K4me3 reader activity
  (core function of the BPTF review; PMID:16728976). RBBP4/RBBP7 and RSF1 carry histone binding (IDA,
  PMID:9651585 and PMID:12972596). BAZ1A, BAZ1B, BAZ2A and CECR2 are units without a function. Deliberate
  omissions: BAZ1B''s protein tyrosine kinase and histone H2AXY142 kinase activities (PMID:19092802) are
  DNA damage response context; the BAZ2A review''s chromatin-protein adaptor activity, which recruits
  silencing enzymes to rDNA, is histone-modification context; CECR2 has an "enables ATP-dependent chromatin
  remodeler activity" IDA row from PMID:15640247 that reflects the CERF complex assay, and is left to
  the complex annoton; BPTF''s sequence-specific DNA binding rows and SMARCA1''s ATP-dependent DNA/DNA
  annealing activity are not part of the remodeling reaction. The RSF1 "histone octamer slider activity"
  IDA row (PMID:9836642) likewise reflects the complex assay. No function is authored without an experimental
  GOA row or gene-review core function, except POLE3 DNA binding as stated.


  Boundary decisions. (1) Histone modification (PW:0001338), DNA methylation (PW:0001340), DNA repair
  recruitment and the RGD diagram''s edge from ISWI to ATM signaling (PW:0001361; modules/atm_dsb_signaling),
  WICH''s link to DNA replication (PW:0000098), and transcription-factor targeting are context, not parts.
  (2) The diagram''s ISWI-to-ATM and WICH-to-replication edges are recorded here only as context. (3)
  No actin or actin-related protein is an ISWI subunit, so ACTB and ACTL6A appear only in the SWI/SNF
  module.


  GO-CAM links. gocams/index.tsv was checked for every member. SMARCA5 appears in gomodel:65c57c3400002054
  (RPSA in antiviral proinflammatory cytokine production) with ATP-dependent chromatin remodeler activity
  and no named complex; it is pinned at the module node, not to a complex variant. No other member is
  in a cached GO-CAM. The seed''s best_gocam (gomodel:617b481400000460, KAT5 in homologous recombination)
  concerns the TIP60 branch of the RGD list and is unrelated to ISWI. Observations for upstream review:
  CECR2 and RSF1 carry "enables" rows for complex-level activities measured on purified CERF and RSF (contributes_to
  would match the assay); SMARCA5 has ACF and RSF complex rows by IPI but no CHRAC row, although PMID:10880450
  purified human CHRAC. PANTHER family ids and PTNs are deliberately not asserted.


  Quotes from PMID:9836642, PMID:12972596 and PMID:10655480 are verified against draft caches (not yet
  in publications/).'
module:
