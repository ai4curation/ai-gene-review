  connections:
    - source: acp_transfer_step
      target: dph5_step
      connection_type: PRECEDES
      description: The ACP-modified histidine on EF2 is the Dph5 substrate.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Intermediates are protein-bound EF2 modifications, not CoA carriers.
    - source: dph5_step
      target: dph7_step
      connection_type: PRECEDES
      description: Diphthine methyl ester made by Dph5 is hydrolysed by Dph7.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Intermediates are protein-bound EF2 modifications, not CoA carriers.
    - source: dph7_step
      target: dph6_step
      connection_type: PRECEDES
      description: Diphthine produced by Dph7 is amidated by Dph6.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Intermediates are protein-bound EF2 modifications, not CoA carriers.
  notes: >-
    Boundary: the module begins with the first ACP transfer onto EF2 and ends
    with diphthamide. Synthesis of SAM, ATP and the Fe-S clusters is outside
    it, and so are the toxin ADP-ribosylation of diphthamide and any role of
    diphthamide in translation. The EF2 substrate (yeast EFT1/EFT2) is the
    acceptor of every step and performs none of them, so it is not a module
    participant. KTI11/DPH3 also has a separate role with the Elongator tRNA
    modification complex, which is out of scope. The Dph7 methylesterase step
    is established for yeast and human. Archaeal EF2 also carries
    diphthamide, but the cached literature does not establish whether archaea
    use a Dph7-like esterase or a different chemistry, so this step is modelled
    from eukaryotic evidence. The S. pombe orthologs (dph1-dph5 are named in
    UniProt) are not listed because this group has no PomBase GO-CAM.
knowledge_gaps:
  - gap_statement: >-
      The molecular role of the J-protein Dph4 (JJJ3/DNAJC24) in the first
      step is unknown. It might deliver iron or electrons to Dph1-Dph2, act as
      an Hsp70 co-chaperone for complex assembly, or present the EF2 substrate;
