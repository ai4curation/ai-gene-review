id: MODULE:diphthamide_biosynthesis
title: Diphthamide biosynthesis on translation elongation factor 2
description: >-
  Diphthamide is a post-translationally modified histidine residue found only
  on archaeal and eukaryotic translation elongation factor 2 (EF2), at the tip
  of domain IV. It is the target of diphtheria toxin and Pseudomonas exotoxin A,
  which ADP-ribosylate it and so inactivate EF2. The modification is built on
  the folded EF2 protein in the cytosol in four enzymatic steps. First, a
  [4Fe-4S]-cluster enzyme cleaves S-adenosyl-L-methionine at the methionine
  C(gamma)-S bond, unlike canonical radical-SAM enzymes, and transfers the
  3-amino-3-carboxypropyl (ACP) group to C2 of the histidine imidazole ring. In
  archaea this enzyme is a Dph2 homodimer; in eukaryotes it is a Dph1-Dph2
  heterodimer that also needs the CSL-zinc-finger protein Dph3, which reduces
  its iron-sulfur clusters, and the J-domain protein Dph4. Second, the SAM-dependent
  methyltransferase Dph5 trimethylates the amino group and methylates the
  carboxylate, giving diphthine methyl ester. Third, the WD40-repeat
  methylesterase Dph7 hydrolyses the ester to diphthine. Fourth, the ATP-binding
  diphthine-ammonia ligase Dph6 amidates the carboxylate with ammonium to form
  diphthamide. Diphthamide is not essential in yeast, but its loss reduces
  translational fidelity (more -1 ribosomal frameshifting) and confers
  resistance to diphtheria toxin and the antifungal sordarin.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: YeastPathways:PWY-6482-1
    title: diphthamide biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists RXN-11371 (DPH1, DPH2, KTI11/DPH3), three single-methyl
      DPH5 reactions (RXN-11370, RXN-11374, RXN-11373) ending at diphthine, and
      DIPHTINE--AMMONIA-LIGASE-RXN catalysed by RRT2/YBR246W. Four corrections
      were made. (1) The amidation enzyme is DPH6/YLR143W (PMID:23169644), not
      RRT2. (2) RRT2 is DPH7, the diphthine methylesterase acting between DPH5
      and DPH6 (PMID:24739148). (3) The DPH5 product is diphthine methyl ester,
      not diphthine (PMID:24739148). (4) DPH4/JJJ3, which the first step requires
      (PMID:15485916), was added.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-6482-1
  - source_id: GO:0017183
    title: protein histidyl modification to diphthamide
    statement: The module is grounded in the GO biological-process term for diphthamide formation on EF2.
  - source_id: PMID:15485916
    title: >-
      Identification of the proteins required for biosynthesis of diphthamide,
      the target of bacterial ADP-ribosylating toxins on translation elongation
      factor 2.
    statement: >-
      Identifies yeast Dph1, Dph3 and Dph4 alongside Dph2 and Dph5, names the
      human homologs, and shows that DPH4 encodes a CSL-zinc-finger DnaJ-like
      protein and that Dph1-Dph3 act as a complex in vivo.
  - source_id: PMID:20559380
    title: Diphthamide biosynthesis requires an organic radical generated by an iron-sulphur enzyme.
    statement: >-
      Pyrococcus horikoshii Dph2 is a [4Fe-4S]-cluster homodimer that cleaves
      SAM to a 3-amino-3-carboxypropyl radical for the first step, defining the
      archaeal single-protein architecture.
  - source_id: PMID:24422557
    title: Dph3 is an electron donor for Dph1-Dph2 in the first step of eukaryotic diphthamide biosynthesis.
    statement: >-
      Reconstitution shows that yeast Dph1-Dph2 is the eukaryotic equivalent of
      the PhDph2 homodimer and that reduced Dph3 (KTI11) donates electrons to
      the Dph1-Dph2 Fe-S clusters.
  - source_id: PMID:22367199
    title: >-
      Structure and mechanistic insights into novel iron-mediated moonlighting
      functions of human J-protein cochaperone, Dph4.
    statement: >-
      Human Dph4 (DNAJC24) and yeast Jjj3 bind iron through the CSL domain;
      iron-bound Dph4 has redox and electron-carrier properties. How this
      contributes to step 1 remains unresolved.
  - source_id: PMID:1508200
    title: DPH5, a methyltransferase gene required for diphthamide biosynthesis in Saccharomyces cerevisiae.
    statement: >-
      DPH5 encodes the AdoMet-dependent EF2 methyltransferase. It is related
      to uroporphyrinogen III methyltransferases, and recombinant Dph5
      methylates EF2 from a dph5 mutant.
  - source_id: PMID:22188241
    title: YBR246W is required for the third step of diphthamide biosynthesis.
    statement: >-
      Deleting YBR246W causes a diphthine-like intermediate to accumulate.
      YeastCyc cites this paper for its RRT2 amidation assignment, but
      PMID:24739148 later superseded that interpretation.
  - source_id: PMID:24739148
    title: Dph7 catalyzes a previously unknown demethylation step in diphthamide biosynthesis.
    statement: >-
      Dph5 produces methylated diphthine (diphthine methyl ester). Dph7
      (YBR246W/WDR85) is the methylesterase that converts it to diphthine,
      which Dph6 then amidates.
  - source_id: PMID:23169644
    title: Chemogenomic approach identified yeast YLR143W as diphthamide synthetase.
    statement: >-
      YLR143W/DPH6 is the ATP- and ammonium-dependent diphthamide synthetase.
      Human ATPBD4/DPH6 fully rescues the yeast deletion.
  - source_id: PMID:23468660
    title: >-
      The amidation step of diphthamide biosynthesis in yeast requires DPH6, a
      gene identified through mining the DPH1-DPH5 interaction network.
    statement: >-
      dph6 and dph7 mutants accumulate diphthine-modified eEF2. Dph6 carries an
      essential adenine-nucleotide hydrolase domain and binds eEF2. The dph
      mutants share increased -1 frameshifting.
module:
  id: diphthamide_biosynthesis
  label: Diphthamide biosynthesis
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Four ordered enzymatic modifications of a single histidine residue of
    EF2. Each step uses the product of the previous step, which stays attached
    to EF2 throughout, as its substrate.
  concepts:
    - preferred_term: protein histidyl modification to diphthamide
      term:
        id: GO:0017183
        label: protein histidyl modification to diphthamide
      description: >-
        Conversion of a specific histidine of translation elongation factor 2
        to diphthamide.
  context:
    taxa:
      - preferred_term: Eukaryota
        description: Dph1-Dph7 pathway (yeast and human enzymes characterised).
      - preferred_term: Archaea
        description: >-
          Diphthamide is present on archaeal EF2; the first step uses a Dph2
          homodimer.
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: The modification is made on cytosolic EF2.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY-6482-1
      title: 'diphthamide biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD YeastPathways conversion for S. cerevisiae. All activities are in
        the cytosol and part of GO:0017183, with no causal edges. DPH5 is typed
        GO:0004164 (diphthine synthase) on three activities. The amidation
        activity GO:0017178 is enabled by RRT2/DPH7, which is incorrect: DPH6
        enables it, and DPH7 is a diphthine methylesterase (GO:0061685). DPH6,
        DPH4 and the DPH7 esterase step are missing from the model.
  parts:
    - order: 1
      role: first step (3-amino-3-carboxypropyl transfer from SAM to EF2 histidine)
      node:
        id: acp_transfer_step
        label: EF2 histidine to 2-(3-amino-3-carboxypropyl)histidine
        module_type: REACTION
        description: >-
          A non-canonical radical-SAM reaction. A [4Fe-4S] cluster cleaves SAM
          at the methionine C(gamma)-S bond, releasing S-methyl-5'-thioadenosine,
          and the 3-amino-3-carboxypropyl radical is added to C2 of the target
          histidine's imidazole ring.
        variant_sets:
          - id: acp_transferase_architecture
            label: ACP-transferase enzyme architecture
            axis: taxon / enzyme architecture
            selection: EXACTLY_ONE
            variants:
              - id: eukaryotic_dph1_dph2_variant
                label: Eukaryotic Dph1-Dph2 heterodimer with Dph3 and Dph4
                module_type: PROTEIN_COMPLEX
                description: >-
                  Two paralogous catalytic subunits, each binding a [4Fe-4S]
                  cluster, form the ACP transferase. The reduced CSL zinc-finger
                  protein Dph3 supplies electrons to those clusters, and the
                  CSL-domain J-protein Dph4 is also required for this step.
                annotons:
                  - id: dph1_dph2_acp_transferase
                    label: Dph1-Dph2 2-(3-amino-3-carboxypropyl)histidine synthase
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: 2-(3-amino-3-carboxypropyl)histidine synthase complex
                        term:
                          id: GO:0120513
                          label: 2-(3-amino-3-carboxypropyl)histidine synthase complex
                        active_units:
                          - id: dph1_unit
                            label: Dph1 catalytic subunit
                            role: >-
                              One of the two paralogous [4Fe-4S]-cluster subunits
                              of the heterodimeric ACP transferase.
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: Dph1/Dph2 diphthamide-synthesis family (Dph1 subfamily)
                                term:
                                  id: PANTHER:PTHR10762
                                  label: DIPHTHAMIDE BIOSYNTHESIS PROTEIN
                                representative_members:
                                  - preferred_term: DPH1 (Saccharomyces cerevisiae)
                                    term:
                                      id: UniProtKB:P40487
                                      label: 2-(3-amino-3-carboxypropyl)histidine synthase subunit 1
                                  - preferred_term: DPH1 (human)
                                    term:
                                      id: UniProtKB:Q9BZG8
                                      label: 2-(3-amino-3-carboxypropyl)histidine synthase subunit 1
                          - id: dph2_unit
                            label: Dph2 catalytic subunit
                            role: >-
                              The second paralogous [4Fe-4S]-cluster subunit of
                              the heterodimeric ACP transferase.
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: Dph1/Dph2 diphthamide-synthesis family (Dph2 subfamily)
                                term:
                                  id: PANTHER:PTHR10762
                                  label: DIPHTHAMIDE BIOSYNTHESIS PROTEIN
                                representative_members:
