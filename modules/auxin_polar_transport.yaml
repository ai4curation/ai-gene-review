id: MODULE:auxin_polar_transport
title: Polar (cell-to-cell) auxin transport
description: >
  Polar auxin transport is the directional, cell-to-cell movement of the phytohormone auxin
  (indole-3-acetic acid, IAA) through plant tissues. It generates the auxin gradients and
  maxima that pattern embryos, organs and vasculature and that drive tropic growth. The
  chemiosmotic model explains its directionality. In the acidic apoplast, protonated IAAH can
  enter cells by diffusion, but most uptake is carried out by AUX1/LAX proton-coupled influx
  symporters. In the near-neutral cytosol IAA is trapped as the membrane-impermeant anion and
  must be exported by carriers. PIN-FORMED (PIN) efflux carriers are polarly localized within
  the plasma membrane, so their position sets the direction of flow. Examples are PIN1 at the
  basal (rootward) side of shoot vascular cells and apically in the shoot-apex epidermis, and
  PIN2 at the apical (shootward) side of root epidermal and lateral root cap cells. Full-size
  ABCB/P-glycoprotein transporters such as ABCB19 use ATP to export auxin from the plasma
  membrane largely non-polarly. They maintain long-distance streams by limiting reuptake and
  lateral leakage, and they act together with PINs. PIN activity and polarity are set by
  phosphorylation of the PIN central hydrophilic loop by plasma-membrane-associated AGCVIII
  kinases. PINOID/WAG kinases phosphorylate sites that recruit PINs into apical targeting (a
  phosphorylation-dependent polarity switch opposed by PP2A/PP6 phosphatases), and both PID
  and the basally localized D6 PROTEIN KINASE (D6PK) activate PIN-mediated efflux. This module
  covers the transport and regulatory activities at the plasma membrane. Nuclear auxin
  perception and signaling (TIR1/AFB-Aux/IAA-ARF), auxin biosynthesis, intracellular auxin
  compartmentation (short PINs, PILS) and the vesicle-trafficking machinery that recycles
  PINs (GNOM ARF-GEF) are outside its boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:16601150
    title: PIN proteins perform a rate-limiting function in cellular auxin efflux.
    statement: PINs catalyze rate-limiting auxin efflux independently of other plant factors,
      and their action is distinct from that of PGP/ABCB transporters.
    supporting_text: >-
      the action of PINs in auxin efflux is distinct from PGP, rate-limiting, specific to auxins,
      and sensitive to auxin transport inhibitors
  - source_id: PMID:16601151
    title: Polar PIN localization directs auxin flow in plants.
    statement: The polar localization of PINs determines the direction of auxin flow.
  - source_id: PMID:17237354
    title: Interactions among PIN-FORMED and P-glycoprotein auxin transporters in Arabidopsis.
    statement: PINs and ABCBs act as coordinated but partially independent auxin export
      mechanisms, and they interact physically.
    supporting_text: >-
      These results suggest that PINs and PGPs characterize coordinated, independent auxin
      transport mechanisms but also function interactively in a tissue-specific manner.
  - source_id: PMID:24948515
    title: Auxin efflux by PIN-FORMED proteins is activated by two different protein kinases,
      D6 PROTEIN KINASE and PINOID.
    statement: D6PK and PID/WAG kinases directly activate PIN-mediated auxin transport, with
      different phosphosite preferences.
    supporting_text: >-
      PIN-mediated auxin transport is directly activated by D6 PROTEIN KINASE (D6PK) and PINOID
      (PID)/WAG kinases of the Arabidopsis AGCVIII kinase family
  - source_id: PMID:15514156
    title: A PINOID-dependent binary switch in apical-basal PIN polar targeting directs auxin
      efflux.
    statement: PID-dependent phosphorylation switches PIN polarity from basal to apical.
    supporting_text: >-
      Our results show that a PINOID-dependent binary switch controls PIN polarity and mediates
      changes in auxin flow to create local gradients for patterning processes.
module:
  id: auxin_polar_transport
  label: Polar auxin transport (influx, polar efflux and kinase control of PIN carriers)
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: auxin polar transport
      term:
        id: GO:0009926
        label: auxin polar transport
      description: Directional cell-to-cell auxin flow resulting from carrier-mediated influx
        and polarly localized efflux.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: Concrete instantiation with Arabidopsis members. Polar auxin transport by
          AUX/LAX, PIN and ABCB carriers is conserved across land plants.
  parts:
    - order: 1
      role: carrier-mediated auxin uptake
      node:
        id: auxin_influx
        label: AUX1/LAX auxin influx
        module_type: TRANSPORT_STEP
        description: >-
          Proton-coupled uptake of the IAA anion from the apoplast. AUX1 is the founding member
          of the AUX1/LAX family (LAX1-3 act in other tissues). It supplies auxin to root apical
          tissues and is required with PIN2 for root gravitropism.
        annotons:
          - id: aux1_influx
            label: "AUX1: auxin influx symporter"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: AUX1
                term:
                  id: UniProtKB:Q96247
                  label: Auxin transporter protein 1
            function:
              preferred_term: auxin influx transmembrane transporter activity
              term:
                id: GO:0010328
                label: auxin influx transmembrane transporter activity
              evidence:
                - source_id: PMID:16677815
                  statement: AUX1 mediates saturable, pH-dependent IAA uptake in Xenopus oocytes.
                  supporting_text: >-
                    Upon expression of AUX1 in Xenopus oocytes, saturable, pH-dependent uptake
                    of 3H-IAA was measured.
            processes:
              - preferred_term: auxin import into cell
                term:
                  id: GO:0060919
                  label: auxin import into cell
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Imports auxin into root apical cells (protophloem, columella,
              lateral root cap, epidermis); the source of auxin carried shootward by PIN2.
    - order: 2
      role: polar auxin efflux by PIN carriers
      node:
        id: pin_polar_efflux
        label: PIN-mediated polar auxin efflux
        module_type: TRANSPORT_STEP
        description: >-
          Long (canonical) PIN carriers export IAA across the plasma membrane from a polar
          membrane domain, so the side of the cell they occupy sets the direction of
          intercellular auxin flow. Different PINs act in different tissues; PIN1 and PIN2 are
          the curated exemplars here (PIN3, PIN4 and PIN7 act in additional tissues and in
          tropisms).
        variant_sets:
          - id: pin_tissue_variants
            label: PIN carrier by tissue and polarity
            axis: tissue / polar membrane domain
            selection: ONE_OR_MORE
            variants:
              - id: pin1_shoot_vascular
                label: PIN1 in shoot vasculature and shoot-apex epidermis
                module_type: TRANSPORT_STEP
                annotons:
                  - id: pin1_efflux
                    label: "PIN1: polar auxin efflux carrier"
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PIN1
                        term:
                          id: UniProtKB:Q9C6B8
                          label: Auxin efflux carrier component 1
                    function:
                      preferred_term: auxin efflux transmembrane transporter activity
                      term:
                        id: GO:0010329
                        label: auxin efflux transmembrane transporter activity
                      evidence:
                        - source_id: PMID:35917925
                          statement: PIN1 mediates active auxin efflux, enhanced by D6PK and
                            inhibited by NPA.
                          supporting_text: >-
                            These results show that PIN1 mediates active auxin efflux when
                            expressed in HEK293F cells, and is further activated by D6PK.
                    processes:
                      - preferred_term: auxin polar transport
                        term:
                          id: GO:0009926
                          label: auxin polar transport
                    locations:
                      - preferred_term: basal plasma membrane
                        term:
                          id: GO:0009925
                          label: basal plasma membrane
                    role_description: Basal (rootward) in shoot vascular cells, driving the
                      basipetal stream down the stem; apical in shoot-apex epidermis, where
                      it builds auxin maxima for organ initiation.
              - id: pin2_root_epidermis
                label: PIN2 in root epidermis, lateral root cap and cortex
                module_type: TRANSPORT_STEP
                annotons:
                  - id: pin2_efflux
                    label: "PIN2: shootward auxin efflux carrier"
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PIN2
                        term:
                          id: UniProtKB:Q9LU77
                          label: Auxin efflux carrier component 2
                    function:
                      preferred_term: auxin efflux transmembrane transporter activity
                      term:
                        id: GO:0010329
                        label: auxin efflux transmembrane transporter activity
                      evidence:
                        - source_id: PMID:9844024
                          statement: AGR1/PIN2 increases IAA efflux when expressed in yeast.
                          supporting_text: >-
                            AGR1 promotes an increased efflux of radiolabeled IAA from the cells
                    processes:
                      - preferred_term: auxin polar transport
                        term:
                          id: GO:0009926
                          label: auxin polar transport
                      - preferred_term: positive gravitropism
                        term:
                          id: GO:0009958
                          label: positive gravitropism
                    locations:
                      - preferred_term: apical plasma membrane
                        term:
                          id: GO:0016324
                          label: apical plasma membrane
                    role_description: Apical (shootward) in root epidermis and lateral root
                      cap, carrying auxin from the root tip into the elongation zone; needed
                      for root gravitropism.
    - order: 3
      role: ATP-driven auxin export by ABCB transporters
      node:
        id: abcb_auxin_export
        label: ABCB19-mediated auxin export
        module_type: TRANSPORT_STEP
        description: >-
          Full-size ABCB (P-glycoprotein) transporters export auxin using ATP hydrolysis, mostly
          from non-polar plasma-membrane positions in vascular and bundle-sheath cells. ABCB19
          maintains long-distance basipetal transport in shoots and rootward transport in the
          root central cylinder. It also stabilizes PIN1 in sterol-enriched membrane domains and
          is inhibited by phototropin 1 phosphorylation. (ABCB19 also exports brassinosteroids;
          that activity is outside this module.)
        annotons:
          - id: abcb19_auxin_export
            label: "ABCB19: ATP-dependent auxin exporter"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ABCB19
                term:
                  id: UniProtKB:Q9LJX0
                  label: ABC transporter B family member 19
            function:
              preferred_term: auxin efflux transmembrane transporter activity
              term:
                id: GO:0010329
                label: auxin efflux transmembrane transporter activity
              evidence:
                - source_id: PMID:11701880
                  statement: Polar auxin transport is greatly reduced in atmdr1 (abcb19).
                  supporting_text: >-
                    Auxin transport activity was greatly impaired in atmdr1 and atmdr1 atpgp1
                    double mutant plants.
                - source_id: PMID:21666806
                  statement: phot1 phosphorylation inhibits ABCB19 efflux activity.
                  supporting_text: phosphorylation of ABCB19 by phot1 inhibits its efflux activity
            processes:
              - preferred_term: basipetal auxin transport
                term:
                  id: GO:0010540
                  label: basipetal auxin transport
              - preferred_term: acropetal auxin transport
                term:
                  id: GO:0010541
                  label: acropetal auxin transport
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Sustains long-distance auxin streams alongside PINs (basipetal
              in inflorescence stems and hypocotyls; rootward in the root stele).
    - order: 4
      role: AGCVIII kinase control of PIN polarity and activity
      node:
        id: pin_kinase_regulation
        label: PIN phosphorylation by PID and D6PK
        module_type: REGULATORY_STEP
        description: >-
          Plasma-membrane-associated AGCVIII kinases phosphorylate serines in the PIN central
          hydrophilic loop. PINOID (with WAG1/WAG2/PID2) drives apical PIN targeting and also
          activates efflux; its effect on polarity is opposed by PP2A/PP6 phosphatases. D6PK
          (with D6PKL1-3) is basally localized, activates PIN efflux without by itself switching
          polarity, and is required for efficient basipetal transport and tropisms.
        annotons:
          - id: pid_pin_phosphorylation
            label: "PID: apical PIN targeting kinase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PID
                term:
                  id: UniProtKB:O64682
                  label: Protein kinase PINOID
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              evidence:
                - source_id: PMID:20040538
                  statement: PID phosphorylates PINs and regulates apical-basal PIN polarity.
                  supporting_text: >-
                    The Ser/Thr protein kinase PINOID (PID) catalyzes PIN phosphorylation and
                    crucially contributes to the regulation of apical-basal PIN polarity.
            processes:
              - preferred_term: protein localization involved in auxin polar transport
                term:
                  id: GO:1901703
                  label: protein localization involved in auxin polar transport
              - preferred_term: regulation of auxin polar transport
                term:
                  id: GO:2000012
                  label: regulation of auxin polar transport
            locations:
              - preferred_term: apical plasma membrane
                term:
                  id: GO:0016324
                  label: apical plasma membrane
            role_description: Phosphorylates PIN loops to recruit PINs into apical
              (GNOM-independent) targeting and to activate efflux.
          - id: d6pk_pin_activation
            label: "D6PK: basal PIN-activating kinase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: D6PK
                term:
                  id: UniProtKB:Q9FG74
                  label: Serine/threonine-protein kinase D6PK
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              evidence:
                - source_id: PMID:24948515
                  statement: Kinase-active D6PK activates PIN-mediated auxin efflux; kinase-dead
                    D6PK does not.
                  supporting_text: >-
                    a kinase-dead variant of D6PK could not activate auxin efflux in this system
            processes:
              - preferred_term: regulation of auxin polar transport
                term:
                  id: GO:2000012
                  label: regulation of auxin polar transport
            locations:
              - preferred_term: basal plasma membrane
                term:
                  id: GO:0009925
                  label: basal plasma membrane
            role_description: Basally localized, phospholipid-anchored kinase that phosphorylates
              and activates PINs (PIN1, PIN3 and others).
  connections:
    - source: auxin_influx
      target: pin_polar_efflux
      connection_type: PROVIDES_INPUT_FOR
      description: Auxin imported by AUX1 is the cellular pool exported by polar PINs
        (e.g. AUX1 and PIN2 together drive the root-tip shootward stream in gravitropism).
    - source: pin_kinase_regulation
      target: pin_polar_efflux
      connection_type: POSITIVELY_REGULATES
      description: PID and D6PK phosphorylate the PIN hydrophilic loop, activating efflux and
        (for PID) directing apical PIN polarity.
      evidence:
        - source_id: PMID:24948515
          statement: D6PK and PID/WAGs directly activate PIN-mediated auxin transport.
          supporting_text: >-
            PIN-mediated auxin transport is directly activated by D6 PROTEIN KINASE (D6PK) and
            PINOID (PID)/WAG kinases of the Arabidopsis AGCVIII kinase family
    - source: abcb_auxin_export
      target: pin_polar_efflux
      connection_type: POSITIVELY_REGULATES
      description: ABCB19 interacts with PIN1 and stabilizes it in sterol-enriched plasma
        membrane domains, enhancing coordinated auxin efflux.
      evidence:
        - source_id: PMID:17237354
          statement: PIN-PGP interactions enhance transport activity and specificity.
          supporting_text: >-
            PIN-PGP interactions appeared to enhance transport activity and, to a greater extent,
            substrate/inhibitor specificities when coexpressed in heterologous systems.
  notes: >-
    No production GO-CAM in gocams/index.tsv contains these Arabidopsis auxin-transport genes
    (checked 2026-10-05), so no gocam_associations are given. PANTHER family ids are omitted
    because members are modeled as concrete gene products.
