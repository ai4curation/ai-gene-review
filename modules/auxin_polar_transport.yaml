id: MODULE:auxin_polar_transport
title: Multiactivity mechanisms contributing to polar auxin transport
description: 'Cell-to-cell auxin transport arises from the spatial arrangement and regulation of
  membrane uptake and export activities. This module represents experimentally grounded land-plant
  transport combinations: complementary influx/efflux, pair-specific PIN–ABCB cooperation, and carrier
  activation by kinases or TWD1. Each named mechanism contains at least two substantive activities
  and native-context evidence; satisfying it identifies a supported mechanistic combination, not
  sufficiency to generate tissue polarity or a complete transport network. Carrier-mediated uptake
  is context-dependent because protonated IAA can also enter by diffusion. Native polarity and tissue
  flow are distinguished from cellular or heterologous export. Arabidopsis provides the characterized
  multiactivity mechanisms. Rice contributes only an optional sampled influx/efflux segment, and
  moss/liverwort PINs are exporter comparators; neither alone certifies an equivalent native mechanism.
  Nuclear signaling, biosynthesis, intracellular short-PIN/PILS compartmentation, general vesicle
  trafficking and bulk phloem transport are outside the modeled boundary.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: url:https://www.jstage.jst.go.jp/article/plmorphol/36/1/36_3/_html/-char/en
  statement: Distinguishes cell-to-environment, non-canalized intercellular and canalized auxin transport;
    exporter biochemistry and tissue-level directionality require separate evidence.
  supporting_text: “cell-to-environment auxin transport”, “non-canalized intercellular auxin transport”,
    and “canalized auxin transport”.
- source_id: PMID:36786017
  statement: Functional validation of predicted orthologs is needed to establish conserved biochemical
    properties and biological roles.
  supporting_text: more functional validations of the predicted extant orthologs are required to
    confirm the conservation of the biochemical properties
- source_id: PMID:42618840
  statement: Review supports compartmental and cooperative transport framing; its broad ABCB efflux
    wording is qualified here by primary ABCB4 bidirectionality evidence.
  supporting_text: Although ABCBs can mediate auxin efflux independently, their interaction with
    PIN proteins enhances transport efficiency and directionality.
- source_id: PMID:38211951
  statement: Abstract-level review establishes transporter biochemical/structural diversity; individual
    mechanisms here are anchored to primary experiments.
  supporting_text: transported by a diverse range of transporters with distinct biochemical and structural
    properties.
- source_id: PMID:36608348
  statement: Abstract-level review supports integrating spatial models with experiments; model predictions
    are not recast as direct flux measurements.
  supporting_text: how auxin movement between cells regulates development at the tissular scale.
- source_id: PMID:39931795
  statement: Abstract-level review distinguishes post-translational effects on transporter activity,
    localization and specificity.
  supporting_text: activation status, localization and substrate specificity.
- source_id: PMID:40100293
  statement: ABCB functions extend beyond auxin transport, consistent with avoiding auxin-only family
    scope.
- source_id: PMID:31712756
  statement: An early streptophyte PIN exporter supports ancestral cellular transport, not conservation
    of an entire multicellular directional circuit.
- source_id: PMID:42271607
  statement: Tested non-plant PIN-like proteins did not support directional export in heterologous
    systems despite structural resemblance; this is not a universal absence claim for all algae.
- source_id: PMID:16601151
  statement: Native PIN polarity contributes to the direction of auxin flow.
- source_id: PMID:16601150
  statement: PIN cellular export can be distinguished from PGP/ABCB transport; universal ABCB dependence
    is not inferred.
- source_id: PMID:33705718
  statement: Kinase/MAB4-dependent restriction of PIN lateral diffusion supports polarity maintenance;
    PID/WAG can localize apolarly.
- source_id: PMID:38513023
  statement: ABCB19 directly transports brassinosteroids; cellular IAA-export evidence must be distinguished
    from the isolated proteoliposome assay.
- source_id: PMID:40720658
  statement: AUX1 structural and cellular evidence supports a proton-coupled import mechanism, without
    specifying an unmeasured fixed stoichiometry.
- source_id: PMID:42130089
  statement: Comparative review distinguishes local PIN-mediated gradients and moss symplastic branching
    models from long-range PIN-mediated transport in vascular plants; no blanket bryophyte polarity
    is inferred.
  supporting_text: branching is regulated mainly by symplastic auxin diffusion through plasmodesmata
- source_id: PMID:41984944
  statement: Native early growing moss phyllids show apolar PINA/PINB and a role in reducing intracellular
    auxin; older polar tip localization is stage-dependent and does not establish a universal leaf-wide
    directional stream.
  supporting_text: moss PIN transporters do not participate in polar auxin transport during phyllid
    development but mainly reduce intracellular auxin concentration.
- source_id: PMID:41061699
  statement: A physics-based native moss branching study supports symplasmic diffusion as a sufficient
    model for observed branch patterns; its cache is abstract-only, so detailed parameters are not
    asserted.
- source_id: PMID:32699109
  statement: Direct ABCB1 activation by TWD1 provides transporter-regulator evidence without requiring
    a settled PPIase mechanism.
