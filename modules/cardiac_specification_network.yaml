          statement: Pannier and Tinman synergistically induce cardial cells; GATA4 functions equivalently
            in flies.
          supporting_text: >-
            co-expression of Pannier and the homeodomain protein Tinman synergistically activate cardiac
            gene expression and induce cardial cells
        - source_id: PMID:9584153
          title: >-
            The cardiac tissue-restricted homeobox protein Csx/Nkx2.5 physically associates with the zinc
            finger protein GATA4 and cooperatively activates atrial natriuretic factor gene expression.
          statement: Nkx2-5 and GATA4 associate in cells.
          supporting_text: Coimmunoprecipitation experiments demonstrate that Csx and GATA4 associate
            intracellularly.
