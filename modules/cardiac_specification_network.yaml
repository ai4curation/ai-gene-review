id: MODULE:cardiac_specification_network
title: Cardiac specification transcriptional network module
description: >-
  The evolutionarily conserved core transcriptional network that specifies cardiac progenitors in the
  mesoderm and launches their myocardial differentiation. An NK-2 class homeodomain factor (Drosophila
  Tinman, vertebrate NKX2-5) acts with a cardiogenic GATA zinc-finger factor (Pannier, GATA4) and T-box
  factors (Dorsocross, TBX5/TBX20) in a mutually cross-regulating set; these factors physically associate
  and synergistically activate cardiac enhancers. Together they activate the bHLH factor Hand and the
  MADS-box differentiation factor MEF2, which drives the cardiac muscle differentiation program. In the
  fly the network is deployed in dorsal mesoderm at the intersection of ectodermal Dpp and Wingless signals;
  in vertebrates its mammalian elaboration underlies first and second heart field development and chamber
  formation. No single factor is sufficient on its own: heart specification depends on their combination
  with signalling inputs.
status: DRAFT
evidence:
- source_id: GO:0007507
  title: heart development
  statement: The module is grounded in the species-neutral GO process for heart development.
- source_id: PMID:12027431
  title: Control of cardiac development by an evolutionarily conserved transcriptional network.
  statement: >-
    Fly and mammalian heart formation share a conserved network of signalling pathways and transcription
    factors.
  supporting_text: >-
    The regulatory network that controls the formation of the primitive heart in fruit flies has been
    elaborated upon to form the complex multichambered heart of mammals.
- source_id: file:DROME/tin/tin-ai-review.yaml
  title: tin gene review
  statement: >-
    Tinman core function is Pol II TF activity in cardioblast differentiation and dorsal mesoderm subdivision,
    necessary but not sufficient for heart induction.
- source_id: file:human/NKX2-5/NKX2-5-ai-review.yaml
  title: NKX2-5 gene review
  statement: >-
    NKX2-5 core functions are Pol II TF activity and binding of partner TFs GATA4 and TBX5 on composite
    cardiac elements.
- source_id: file:mouse/Nkx2-5/Nkx2-5-ai-review.yaml
  title: Nkx2-5 (mouse) gene review
  statement: >-
    Mouse Nkx2-5 is reviewed as a Pol II TF that binds partner TFs (GATA4, TBX5, TBX20, SRF, MEF2C, HAND2).
notes: >-
  Boundary: the module covers the cardiogenic transcription factor kernel (NK-2, GATA, T-box, Hand) and
  its MEF2 differentiation output. Inductive signals (BMP/Dpp, Wnt/Wingless, FGF/Heartless), the upstream
  mesoderm determinant (Twist), second-heart-field regulators (ISL1, TBX1, FOXH1), and chamber/conduction-system
  patterning (TBX2/3, IRX4, ID2) are context or separate modules. Tinman also specifies visceral mesoderm
  via bagpipe and some dorsal somatic muscle founders; those outputs are outside this module. In the mouse,
  Nkx2-5 loss does not block commitment to the cardiac lineage but disrupts looping and ventricular differentiation,
  so the NK-2 role is framed as heart development rather than strictly cell fate specification across
  taxa. Gene reviews now exist for all representatives; fly Dorsocross1, Hand unreviewed UniProt entries
  are used where no Swiss-Prot entry exists. Annoton processes use heart development rather than cardiac
  cell fate specification because the mammalian members (NKX2-5, GATA4) are not required for lineage specification.
module:
  id: cardiac_specification_network
  label: Cardiac specification transcriptional network
  module_type: DEVELOPMENTAL_PROCESS
  description: >-
    Cross-regulating NK-2 / GATA / T-box / Hand transcription factor kernel that specifies cardiac progenitors
    and activates MEF2-driven myocardial differentiation.
  concepts:
  - preferred_term: heart development
    term:
      id: GO:0007507
      label: heart development
  - preferred_term: cardiac cell fate specification
    term:
      id: GO:0060912
      label: cardiac cell fate specification
    description: >-
      The earliest step the kernel controls. In Drosophila tinman, pannier and Dorsocross are required
      for cardioblast specification; in mouse, Nkx2-5 or Gata4 loss does not prevent cardiac lineage specification
      (redundancy with paralogs such as GATA5/6), so this concept rests chiefly on fly evidence.
    evidence:
    - source_id: PMID:9136932
      title: GATA4 transcription factor is required for ventral morphogenesis and heart tube formation.
      statement: Gata4-null mouse cells still form cardiac lineages.
      supporting_text: GATA4 is not essential for the specification of the cardiac cell lineages.
  context:
    taxa:
    - preferred_term: Bilateria
      term:
        id: NCBITaxon:33213
        label: Bilateria
      description: NK-2, GATA, T-box, Hand and MEF2 orthologs act in heart development in insects and
        vertebrates.
    cellular_components:
    - preferred_term: nucleus
      term:
        id: GO:0005634
        label: nucleus
  parts:
