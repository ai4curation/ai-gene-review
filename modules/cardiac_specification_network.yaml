          title: >-
            The Dorsocross T-box genes are key components of the regulatory network controlling early
            cardiogenesis in Drosophila.
          statement: Dorsocross, tinman and pannier cross-regulate in cardiac mesoderm.
          supporting_text: >-
            co-expression of these three genes in the cardiac mesoderm, which also involves cross-regulation,
            plays a major role in the specification of cardiac progenitors
        - source_id: PMID:11431700
