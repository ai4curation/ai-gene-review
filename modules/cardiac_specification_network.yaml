          statement: Tbx5 and Nkx2-5 bind the Nppa promoter in tandem and synergize.
          supporting_text: >-
            Tbx5 and Nkx2-5 directly bound to the promoter of the gene for cardiac-specific natriuretic
            peptide precursor type A (Nppa) in tandem, and both transcription factors showed synergistic
            activation.
