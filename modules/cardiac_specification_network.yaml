                statement: IBA propagation from PAINT node PTN000678271 in PTHR24340.
        function:
          preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0000981
            label: DNA-binding transcription factor activity, RNA polymerase II-specific
        processes:
        - preferred_term: heart development
          term:
            id: GO:0007507
            label: heart development
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: >-
          Required for heart and visceral muscle specification in Drosophila and for heart looping and
          ventricular myogenesis in mouse; binds GATA4 and TBX5 and synergistically activates cardiac
          promoters.
        evidence:
        - source_id: PMID:7915669
          title: The gene tinman is required for specification of the heart and visceral muscles in Drosophila.
          statement: tinman mutants lack heart primordia and visceral mesoderm.
          supporting_text: >-
            Embryos that are mutant for the tinman gene lack the appearance of visceral mesoderm and of
            heart primordia
        - source_id: PMID:7628699
          title: >-
            Myogenic and morphogenetic defects in the heart tubes of murine embryos lacking the homeo
            box gene Nkx2-5.
          statement: Nkx2-5 is essential for heart morphogenesis and ventricular myogenesis in mouse.
          supporting_text: >-
            The data demonstrate that Nkx2-5 is essential for normal heart morphogenesis, myogenesis,
            and function.
