id: MODULE:dmel_mediator_complex
title: Mediator complex in Drosophila melanogaster
description: >-
  Mediator is a large multisubunit coactivator that bridges DNA-bound transcription factors
  and RNA polymerase II, helping assemble and activate the preinitiation complex. The core
  Mediator (head, middle and tail modules, with MED14 as a central scaffold) binds the polymerase,
  while tail subunits contact activators. The CDK8 kinase module (CKM), consisting of Cdk8,
  CycC, MED12 (kto) and MED13 (skd), associates reversibly with core Mediator and generally
  restrains its interaction with polymerase; Drosophila kto and skd were identified through
  their roles in imaginal disc patterning.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001867
  title: 'FlyBase gene group MEDC: Mediator complexes'
  statement: >-
    FlyBase release FB2026_03 groups 30 D. melanogaster genes as mediator complexes (MEDC);
    this module models that group.
- source_id: GO:0016592
  title: mediator complex
  statement: >-
    GO term grounding the module as mediator complex.
notes: >-
  Boundary. The core is modelled as a single complex because head, middle and tail assignments
  of several metazoan-specific subunits (MED26-MED30) are not uniform across studies. ix is
  the Drosophila MED29. FlyBase groups realized by this module: MEDC (FBgg0001867). Subgroups
  folded into it: MED, CKM. Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_mediator_complex.yaml;
  none of the member genes has a gene review yet unless noted.
