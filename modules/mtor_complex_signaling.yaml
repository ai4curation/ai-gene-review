        evidence:
          - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000180.yaml
            statement: RGD draws PI3K-Akt inhibiting Tsc2 and Akt1s1, and mTORC2 phosphorylating Akt.
            supporting_text: Akt can also activate mTOR downstream of Tsc2 by relieving the inhibition by Akt1s1, (known as Pras40). Interestingly, Akt is among the substrates of mTORC2.
