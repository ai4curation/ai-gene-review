id: MODULE:mtor_complex_signaling
title: mTOR complex signaling — mTORC1 (MTOR-RPTOR-MLST8, PRAS40, DEPTOR) and mTORC2 (MTOR-RICTOR-MAPKAP1-MLST8, PRR5/PRR5L) kinases, RHEB activation on the lysosome under TSC control, and amino acid sensing through Rag-Ragulator, GATOR1, GATOR2, FLCN-FNIP, Sestrin2, CASTOR1 and SAMTOR
description: >-
  The serine/threonine kinase mTOR acts in two multiprotein complexes. mTOR complex 1
  (mTORC1) contains mTOR, the substrate-recruiting scaffold raptor (RPTOR) and mLST8, and is
  held in check by two inhibitory subunits, PRAS40 (AKT1S1) and DEPTOR. mTOR complex 2
  (mTORC2) contains mTOR, mLST8, the scaffold rictor (RICTOR), mSIN1 (MAPKAP1) and one of the
  Protor proteins (PRR5 or PRR5L), and DEPTOR also binds and inhibits it. mTORC1 is the
  growth controller: it phosphorylates S6K1 and S6K2, 4E-BP1, ULK1, TFEB and lipin-1,
  promoting translation, ribosome biogenesis and lipid synthesis and suppressing autophagy
  and lysosome biogenesis. mTORC2 phosphorylates the hydrophobic motifs of AGC kinases, most
  notably AKT on Ser473, SGK1 and protein kinase C, and so feeds into PI3K-AKT signalling and
  cytoskeletal control. mTORC1 is activated on the cytosolic face of lysosomes only when two
  inputs coincide. Growth factor and energy signals act through the small GTPase RHEB, which
  binds mTOR and allosterically activates the kinase; the TSC1-TSC2-TBC1D7 complex is the
  GTPase-activating protein that turns RHEB off, and AKT and AMPK act on it in opposite
  directions. Amino acid sufficiency acts through the heterodimeric Rag GTPases (RagA or RagB
  with RagC or RagD), which are anchored to the lysosome by the pentameric Ragulator complex
  (LAMTOR1-5) and, in the RagA/B-GTP and RagC/D-GDP state, bind raptor and recruit mTORC1 to
  the lysosomal surface where RHEB resides. The nucleotide state of the Rags is set by GATOR1
  (DEPDC5, NPRL2, NPRL3), a GTPase-activating protein for RagA/B that inhibits the pathway;
  by GATOR2 (MIOS, WDR24, WDR59, SEH1L, SEC13), which inhibits GATOR1; and by the
  folliculin-FNIP complex, a GTPase-activating protein for RagC/D that is needed for mTORC1
  activation and especially for TFEB phosphorylation. Cytosolic sensors connect specific
  amino acids to GATOR: Sestrin2 binds GATOR2 until leucine binds Sestrin2, CASTOR1 binds
  GATOR2 until arginine binds CASTOR1, and SAMTOR binds GATOR1 until S-adenosylmethionine
  binds SAMTOR. Folding and assembly of mTOR into both complexes depends on the TEL2-TTI1-TTI2
  co-chaperone complex.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000180
    title: mTOR signaling pathway
    statement: >-
      The module boundary follows the RGD Pathway Ontology term and its interactive diagram,
      which draws the mTORC1 and mTORC2 complexes; Akt1s1 negatively affecting mTORC1; Rheb
      activating mTORC1 and Tsc2 inhibiting Rheb; the Rrag members activating mTORC1 under
      positive control of the Ragulator complex and Flcn-Fnip and negative control of the Gator1
      complex; Gator2 inhibiting Gator1 and itself inhibited by Sesn2, Gatsl3 (CASTOR1) and
      Gatsl2 (CASTOR2), with leucine and arginine relieving those inhibitions; rapamycin with
      Fkbp1a inhibiting mTORC1; and outputs to Rps6kb1, Eif4ebp1, autophagy, Nfe2l2 signalling
      and, for mTORC2, the PI3K-Akt pathway and cytoskeletal rearrangements. Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000180.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000180.yaml
    title: RGD PW:0000180 record (cached pathway text, diagram and gene links)
    statement: >-
      The RGD record text names the two complexes and their composition, which the first two
      parts of the module follow.
    supporting_text: >-
      The highly conserved Ser/Thr mTOR kinase is found in two distinct complexes: the
      rapamycin-sensitive mTORC1 and the largely rapamycin-insensitive mTORC2.
  - source_id: GO:0031929
    title: TOR signaling
    statement: >-
      The GO process mapped to PW:0000180 (skos:relatedMatch from the PW definition xref,
      recorded in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml) and the module's
      process concept. Its two children, TORC1 signaling (GO:0038202) and TORC2 signaling
      (GO:0038203), are used on the two complex nodes.
  - source_id: gomodel:646ff70100000391
    title: Canonical mTORC1 signaling (Human)
    statement: >-
      The reference human GO-CAM for the lysosomal mTORC1 core: Ragulator guanyl-nucleotide
      exchange factor activity and LAMTOR1 protein-membrane adaptor activity, RRAGA and RRAGC
      protein-membrane adaptor activity, RHEB protein serine/threonine kinase activator activity,
      RPTOR enzyme-substrate adaptor activity and MTOR protein serine/threonine kinase activity,
      all on the lysosomal membrane, with S6K1/S6K2 and 4E-BP1 downstream.
  - source_id: gomodel:66e382fb00001412
    title: mTORC2 signaling (Human).
    statement: >-
      The reference human GO-CAM for mTORC2: MTOR protein serine/threonine kinase activity with
      RICTOR and MAPKAP1 enzyme-substrate adaptor activity and MLST8 protein-macromolecule
      adaptor activity at the plasma membrane, acting on AKT1.
  - source_id: gomodel:6482692800001029
    title: Activation of the canonical mTORC1 signaling by GATOR2, which inactivates GATOR1 in response to abundant amino acids (Human)
    statement: >-
      The best GO-CAM lead recorded for PW:0000180 in the RGD seed file (overlap 10 genes),
      checked and relevant: it models WDR24 ubiquitin protein ligase activity acting on the
      GATOR1 GAP (NPRL2 GTPase activator activity, DEPDC5 small GTPase binding) upstream of the
      Rag heterodimer, RHEB and mTORC1.
  - source_id: PMID:15467718
    title: Mammalian TOR complex 2 controls the actin cytoskeleton and is rapamycin insensitive.
    statement: >-
      Establishes the two-complex organisation of mammalian TOR that the module's first two
      parts follow.
    supporting_text: >-
      Thus, two distinct TOR complexes constitute a primordial signalling network conserved in
      eukaryotic evolution to control the fundamental process of cell growth.
  - source_id: PMID:20381137
    title: Ragulator-Rag complex targets mTORC1 to the lysosomal surface and is necessary for its activation by amino acids.
    statement: >-
      Establishes lysosomal recruitment by Rag-Ragulator as the amino acid step, and that it
      works by bringing mTORC1 to RHEB rather than by bypassing RHEB, which is why the module
      requires both the RHEB part and the amino acid sensing part.
    supporting_text: >-
      Constitutive targeting of mTORC1 to the lysosomal surface is sufficient to render the
      mTORC1 pathway amino acid insensitive and independent of Rag and Ragulator, but not Rheb,
      function.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000180 (mTOR signaling pathway) through
  the RGD_PATHWAY_ONTOLOGY project's diagram->module route. RGD curates 43 human genes to
  PW:0000180 (AKT1S1 CASTOR1 CASTOR2 CXCL8 DEPDC5 DEPTOR EIF4EBP1 FKBP1A FLCN FNIP1 FNIP2
  LAMTOR1 LAMTOR2 LAMTOR3 LAMTOR4 LAMTOR5 LPIN1 MAPKAP1 MIOS MLST8 MTOR NPRL2 NPRL3 PRR5
  PRR5L RHEB RICTOR RPS6KB1 RPS6KB2 RPTOR RRAGA RRAGB RRAGC RRAGD SESN2 SLC7A5 TBC1D7 TELO2
  TSC1 TSC2 TTI1 WDR24 WDR59). Thirty-four are modelled here as participants; TSC1 and TSC2
  are covered by module_ref to the TSC relay of ampk_energy_sensing; EIF4EBP1, RPS6KB1,
  RPS6KB2 and LPIN1 are recorded as kinase targets, not participants; CXCL8, FKBP1A and
  SLC7A5 are excluded (reasons below). Three participants are added although RGD does not
  list them: SEH1L and SEC13, because they are two of the five subunits of the GATOR2 complex
  RGD draws and GO:0061700 is the complex term used, and SAMTOR, the S-adenosylmethionine
  sensor that acts on GATOR1 alongside the leucine and arginine sensors that RGD draws, with a
  primary paper and a human GO-CAM. The only PW id used as an evidence
  source is PW:0000180. The other PW ids the RGD diagram links to (translation, Raf/Mek/Erk,
  insulin signaling, PI3K-Akt, autophagy, NRF2, AMPK, translation initiation and ribosome
  biogenesis pathways) are other diagrams; the PI3K-Akt and AMPK ones are realised here only
  through module_ref to existing modules. The mapped GO process GO:0031929 TOR signaling is
  the module concept; its children TORC1 signaling and TORC2 signaling sit on the complex
  nodes.

  Boundary decisions. (1) Relationship to pi3k_akt_mtor. That module models the growth factor
  axis and has a coarse mTORC1 activation step (an unnamed mTORC1 complex with protein
  serine/threonine kinase activity). This module is the decomposition of the mTOR complexes
  themselves and their non-AKT inputs, so the PI3K-AKT input is included by module_ref to
  pi3k_akt_mtor#akt_activation and is not re-modelled; PI3K, PDK1, PTEN and the AKT effector
  tier stay in that module. Its mtorc1_activation step is not referenced, because this
  module's mtorc1 node is the fuller model of the same complex; a follow-up could make that
  step a module_ref to mtor_complex_signaling#mtorc1 (not done here, since this change touches
  only this file). (2) TSC. The TSC1-TSC2 complex, with TSC2 GTPase activator activity on
  RHEB, is already modelled in ampk_energy_sensing#ampk_tsc_relay and is included by
  module_ref, not duplicated. TBC1D7, which RGD lists and the referenced step lacks, is
  modelled as a separate optional part with a POSITIVELY_REGULATES connection to the TSC
  part; it would sit better as a third unit of that TSC complex in the AMPK module. The TSC,
  AKT and AMPK parts are optional because they regulate rather than perform the activation
  of mTORC1; loss of TSC gives constitutive activity. The AMPK heterotrimer is referenced
  (ampk_energy_sensing#ampk_heterotrimer) for the direct raptor phosphorylation, and its TSC2
  arm is the TSC part. The Raf/Mek/Erk (and RSK) phosphorylation of TSC2 that RGD mentions is
  not modelled; it is described here only. (3) Substrates are targets, not participants. S6K1,
  S6K2, 4E-BP1, ULK1, TFEB/TFE3, lipin-1 (mTORC1) and AKT, SGK1 and PKC (mTORC2) are
  phosphorylated by the complexes and are listed under the kinase function's targets. This
  follows CLAUDE.md's substrate-versus-participant rule and the GO-CAM convention: in
  gomodel:646ff70100000391 the S6Ks and 4E-BP1 carry their own activities in translation
  initiation, downstream of MTOR, not TORC1 signaling. The RGD outputs that are other diagrams
  (translation initiation, ribosome biogenesis, autophagy, NRF2 via SQSTM1-KEAP1, cytoskeletal
  rearrangement, the S6K1-IRS1 feedback) are outside the boundary. The S6K-IRS1 feedback in
  particular is S6K acting on the insulin receptor pathway, not mTOR acting. (4) Excluded RGD
  genes. FKBP1A (FKBP12) is the intracellular receptor for rapamycin; the FKBP12-rapamycin
  complex inhibits mTORC1, but that is drug action, and no endogenous role of FKBP12 in mTOR
  signalling is modelled. SLC7A5 (LAT1) imports leucine; it supplies the signal rather than
  sensing it, and RGD itself says the lysosomal amino acid transporters that may act as
  sensors are not shown. CXCL8 appears on the RGD gene list without a role in the record text
  or diagram, and is treated as a downstream or annotation-propagated association. (5)
  Amino acid sensing is one root part with eight sub-parts. Ragulator, the Rag heterodimer,
  GATOR1, GATOR2 and FLCN-FNIP are required (FLCN because RagC/D-GDP is needed for raptor
  binding); the three sensors are optional, since each relays one amino acid and none is
  required for the others. KICSTOR (which holds GATOR1 and SAMTOR at the lysosome), SLC38A9
  and the v-ATPase are outside the RGD list and are named here only; the v-ATPase-Ragulator
  link is modelled in gomodel:698e557b00000129. The TTT co-chaperone (TELO2, TTI1) is an
  optional assembly part: it is required for mTOR stability but also serves the other PIKKs,
  so it is not specific to this pathway.

  Molecular functions follow experimental GOA rows (QuickGO, checked November 2026) and the
  human GO-CAMs, and gene-review core functions where reviews exist (AKT1S1, DEPDC5, FLCN,
  FNIP1). Choices needing comment: (a) Ragulator. All five LAMTOR subunits carry
  contributes_to guanyl-nucleotide exchange factor activity GO:0005085 (IDA, PMID:22980980
  and one later paper), and the mTORC1 GO-CAMs type the complex that way. The module instead
  gives the complex protein-membrane adaptor activity GO:0043495 (LAMTOR1 IDA), the anchoring
  role established by PMID:20381137, because lysosomal anchoring of the Rag heterodimer is the
  step this node represents in the module. This is a modelling choice for that step, not a
  judgement against the GEF annotation: the GEF rows are not disputed here, only not chosen
  as the module's step. (b) Rag heterodimer: complex-level
  protein-membrane adaptor activity, as in the GO-CAMs (RRAGA and RRAGC IDA), with GTPase
  activity on the two paralogue-pair units. The GO-CAMs type RRAGA as GTP binding and RRAGC as
  GDP binding to encode the active state; the module records that state in prose. RRAGC also
  has enzyme-substrate adaptor activity (IDA) for TFEB recruitment, noted in its unit role.
  (c) Sensors. SESN2 and CASTOR1 are given protein sequestering activity GO:0140311 (IDA,
  and the activity their GO-CAMs give the GATOR2 interaction); their amino acid binding
  terms (L-leucine binding, arginine binding, both IDA) are described in the role text. GO's
  amino acid sensor activity GO:0140785 has no leucine or arginine child and no experimental
  rows on these proteins, so it is not used. CASTOR1 also carries molecular sensor activity
  GO:0140299 (IDA). CASTOR2 has NOT arginine binding (IDA) and is given no function. SAMTOR
  is given S-adenosyl-L-methionine binding GO:1904047 (IDA). (d) mLST8 is given protein
  serine/threonine kinase activator activity GO:0043539 (IDA, PMID:12718876) in both
  complexes; the mTORC2 GO-CAM uses protein-macromolecule adaptor activity (also IDA). (e)
  Units without an experimental molecular function carry a role statement and no GO id:
  PRR5/PRR5L (protein kinase regulator activity IBA only), NPRL3, MIOS, WDR59 (signaling
  adaptor activity IBA only), SEH1L, SEC13, LAMTOR2-5 (only the contributes_to GEF and adaptor
  rows), TBC1D7 (see its part) and CASTOR2. No function is authored that is not backed by an
  experimental GOA row or a gene-review core function.

  Process terms. Following the GO-CAM convention, only the kinase complexes carry TORC1
  signaling GO:0038202 and TORC2 signaling GO:0038203; activators (RHEB, Rags, Ragulator,
  GATOR2, FLCN-FNIP) carry positive regulation of TORC1 signaling GO:1904263, and inhibitors
  (GATOR1, Sestrin2, CASTOR1/2, TBC1D7's TSC complex) negative regulation GO:1904262, which is
  how GOA annotates them (e.g. SESN2, CASTOR1, CASTOR2 GO:1904262 IDA/IMP; FLCN GO:1904263
  IDA). SAMTOR is given the neutral regulation of TORC1 signaling GO:1903432 (IDA), see
  below. No NEW annotations are implied by the module.

  GO-CAM coverage. Human models were checked in gocams/index.tsv: the canonical mTORC1 model
  gomodel:646ff70100000391 grounds MTOR, RPTOR, RHEB, RRAGA, RRAGC, LAMTOR1 and Ragulator; the
  mTORC2 model gomodel:66e382fb00001412 grounds MTOR, RICTOR, MAPKAP1 and MLST8; the RGD seed's
  best lead gomodel:6482692800001029 (GATOR2 inactivating GATOR1) grounds WDR24, NPRL2 and
  DEPDC5; separate models ground AKT1S1, DEPTOR, SESN2, CASTOR1, SAMTOR, FLCN and FNIP1 and
  the ULK1 and TFEB substrate branches. No production GO-CAM contains PRR5, PRR5L, RRAGB,
  RRAGD, LAMTOR2-5 as individual genes, NPRL3, MIOS, WDR59, SEH1L, SEC13, CASTOR2, FNIP2,
  TELO2, TTI1 or TBC1D7.

  Possible upstream issues noticed. SAMTOR carries positive regulation of TORC1 signaling
  GO:1904263 by IDA (PMID:29123071), although that paper shows SAMTOR inhibits mTORC1 and is
  relieved by SAM; the positive sign fits SAM binding relieving inhibition (as the GO-CAM
  encodes it) but reads oddly as a gene-level annotation. SESN2 carries both enables and
  NOT|enables for GO:0032542 sulfiredoxin activity (IDA, different papers). TBC1D7's GTPase
  activator activity GO:0005096 IDA comes from PMID:17646400, a Rab GTPase screen in cilium
  formation; it may be read as Rheb GAP activity, which PMID:22795129 assigns to the
  TSC-TBC complex rather than to TBC1D7 alone. The
  Ragulator GEF typing discussed above is a modelling difference, not an error. Gene reviews
  exist for AKT1S1, DEPDC5, FLCN, FNIP1, LPIN1 and AKT1; the other participants have none.
  PANTHER family ids and PTNs are deliberately not asserted.
module:
  id: mtor_complex_signaling
  label: mTOR complexes and their lysosomal and amino acid inputs
  module_type: SIGNALING_PATHWAY
  description: >-
    mTORC1 and mTORC2 kinase complexes, RHEB activation of mTORC1 under TSC control, and the
    Rag-Ragulator amino acid sensing machinery with its GATOR1, GATOR2, FLCN-FNIP and
    amino acid sensor regulators. Growth factor (PI3K-AKT) and energy (AMPK) inputs are
    included by reference to their own modules.
  concepts:
    - preferred_term: TOR signaling
      term:
        id: GO:0031929
        label: TOR signaling
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: lysosomal membrane
        term:
          id: GO:0005765
          label: lysosomal membrane
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
  parts:
    - order: 1
      role: mTORC1 growth-control kinase
      node:
        id: mtorc1
        label: mTOR complex 1 (mTORC1)
        module_type: PROTEIN_COMPLEX
        description: >-
          The rapamycin-sensitive mTOR complex. Raptor binds TOS motifs in substrates and
          presents them to the mTOR kinase domain; mLST8 binds the kinase domain and is needed
          for activity; PRAS40 and DEPTOR are inhibitory subunits whose release (PRAS40 after
          phosphorylation by AKT and by mTORC1 itself, DEPTOR after mTOR-primed SCF(betaTrCP)
          degradation) increases activity. Active mTORC1 on the lysosome phosphorylates its
          substrates, which are recorded as targets of the kinase annoton and not as parts.
        concepts:
          - preferred_term: TORC1 signaling
            term:
              id: GO:0038202
              label: TORC1 signaling
          - preferred_term: TORC1 complex
            term:
              id: GO:0031931
              label: TORC1 complex
        annotons:
          - id: mtorc1_kinase
            label: mTORC1 protein serine/threonine kinase
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: TORC1 complex
                term:
                  id: GO:0031931
                  label: TORC1 complex
                active_units:
                  - id: mtorc1_mtor
                    label: mTOR catalytic subunit
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MTOR
                        term:
                          id: UniProtKB:P42345
                          label: Serine/threonine-protein kinase mTOR
                    role: PIKK-family catalytic subunit shared with mTORC2.
                    function:
                      preferred_term: protein serine/threonine kinase activity
                      term:
                        id: GO:0004674
                        label: protein serine/threonine kinase activity
                  - id: mtorc1_rptor
                    label: raptor substrate-recruiting scaffold
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RPTOR
                        term:
                          id: UniProtKB:Q8N122
                          label: Regulatory-associated protein of mTOR
                    role: >-
                      Defining mTORC1 subunit; binds TOS motifs of S6K1 and 4E-BP1 and is the
                      docking site for the Rag heterodimer and for PRAS40.
                    function:
                      preferred_term: enzyme-substrate adaptor activity
                      term:
                        id: GO:0140767
                        label: enzyme-substrate adaptor activity
                  - id: mtorc1_mlst8
                    label: mLST8 kinase-domain-binding subunit
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MLST8
                        term:
                          id: UniProtKB:Q9BVC4
                          label: Target of rapamycin complex subunit LST8
                    role: Binds the mTOR kinase domain and stimulates kinase activity; shared with mTORC2.
                    function:
                      preferred_term: protein serine/threonine kinase activator activity
                      term:
                        id: GO:0043539
                        label: protein serine/threonine kinase activator activity
                  - id: mtorc1_akt1s1
                    label: PRAS40 inhibitory subunit
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: AKT1S1
                        term:
                          id: UniProtKB:Q96B36
                          label: Proline-rich AKT1 substrate 1
                    role: >-
                      Raptor-bound inhibitor that competes with substrates; relieved when AKT
                      (and mTORC1) phosphorylate it and 14-3-3 binds.
                    function:
                      preferred_term: protein serine/threonine kinase inhibitor activity
                      term:
                        id: GO:0030291
                        label: protein serine/threonine kinase inhibitor activity
                  - id: mtorc1_deptor
                    label: DEPTOR inhibitory subunit
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: DEPTOR
                        term:
                          id: UniProtKB:Q8TB45
                          label: DEP domain-containing mTOR-interacting protein
                    role: mTOR-binding inhibitor of both complexes.
                    function:
                      preferred_term: protein serine/threonine kinase inhibitor activity
                      term:
                        id: GO:0030291
                        label: protein serine/threonine kinase inhibitor activity
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: S6K1 (RPS6KB1) and S6K2 (RPS6KB2), hydrophobic-motif threonine
                - preferred_term: 4E-BP1 (EIF4EBP1)
                - preferred_term: ULK1 (and ATG13)
                - preferred_term: TFEB and TFE3 (Rag-dependent, RHEB-insensitive substrates)
                - preferred_term: lipin-1 (LPIN1)
                - preferred_term: PRAS40 (AKT1S1) and DEPTOR (feedback on its own inhibitors)
            processes:
              - preferred_term: TORC1 signaling
                term:
                  id: GO:0038202
                  label: TORC1 signaling
            locations:
              - preferred_term: lysosomal membrane
                term:
                  id: GO:0005765
                  label: lysosomal membrane
            role_description: >-
              Integrates RHEB and Rag inputs on the lysosomal surface and phosphorylates the
              growth, translation, autophagy and lysosome-biogenesis substrates. Unit functions
              follow experimental GOA rows: MTOR GO:0004674 (IDA/EXP), RPTOR GO:0140767 (IDA),
              MLST8 GO:0043539 (IDA), AKT1S1 and DEPTOR GO:0030291 (IDA; AKT1S1 core in its
              gene review).
            evidence:
              - source_id: PMID:12150926
                statement: Raptor binds mTOR and its substrates and is required for mTOR-catalysed 4E-BP1 phosphorylation.
                supporting_text: Thus, raptor is an essential scaffold for the mTOR-catalyzed phosphorylation of 4EBP1 and mediates TOR action in vivo.
              - source_id: PMID:12718876
                statement: mLST8 (GbetaL) binds the mTOR kinase domain and stabilises the raptor-mTOR interaction.
                supporting_text: a protein named GbetaL that binds to the kinase domain of mTOR and stabilizes the interaction of raptor with mTOR
              - source_id: PMID:17386266
                statement: PRAS40 is a raptor-binding inhibitor of mTORC1 that AKT phosphorylation relieves.
                supporting_text: Insulin stimulates Akt/PKB-mediated phosphorylation of PRAS40, which prevents its inhibition of mTORC1 in cells and in vitro.
              - source_id: PMID:19446321
                statement: DEPTOR binds mTOR and its loss activates both mTORC1 and mTORC2.
                supporting_text: Loss of DEPTOR activates S6K1, Akt, and SGK1, promotes cell growth and survival, and activates mTORC1 and mTORC2 kinase activities.
              - source_id: PMID:19211835
                statement: mTORC1 associates with the ULK1-ATG13-FIP200 complex and phosphorylates ULK1 and ATG13, which places ULK1 among the kinase targets.
                supporting_text: mTORC1 is incorporated into the ULK1-Atg13-FIP200 complex through ULK1 in a nutrient-dependent manner and mTOR phosphorylates ULK1 and Atg13.
              - source_id: PMID:32612235
                statement: TFEB is an mTORC1 substrate whose phosphorylation depends on the Rags and on FLCN rather than on RHEB.
                supporting_text: is phosphorylated by mTORC1 via a substrate-specific mechanism that is mediated by Rag GTPases
            gocam_associations:
              - model: gomodel:646ff70100000391
                activity: gomodel:646ff70100000391/646ff70100000530
                title: Canonical mTORC1 signaling (Human)
                description: MTOR protein serine/threonine kinase activity (GO:0004674) in TORC1 signaling on the lysosomal membrane.
              - model: gomodel:646ff70100000391
                activity: gomodel:646ff70100000391/646ff70100002533
                title: Canonical mTORC1 signaling (Human)
                description: RPTOR enzyme-substrate adaptor activity (GO:0140767).
              - model: gomodel:646ff70100004220
                activity: gomodel:646ff70100004220/646ff70100004444
                title: Inhibition of the canonical mTORC1 signaling by AKT1S1/PRAS40 in absence of insulin (Human)
                description: AKT1S1 protein serine/threonine kinase inhibitor activity (GO:0030291) on mTORC1.
              - model: gomodel:648d0dc100000075
                activity: gomodel:648d0dc100000075/648d0dc100000252
                title: Positive regulation of autophagy via inhibition of MTOR by DEPTOR (Human)
                description: DEPTOR protein serine/threonine kinase inhibitor activity (GO:0030291) on mTORC1.
              - model: gomodel:646ff70100002557
                activity: gomodel:646ff70100002557/646ff70100002676
