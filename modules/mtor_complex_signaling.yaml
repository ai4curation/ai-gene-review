        label: AKT activation (PI3K-AKT input)
        description: >-
          Included by reference to the AKT activation step of the PI3K-AKT-mTOR module. Active
          AKT phosphorylates TSC2 (inhibiting the RHEB GAP) and PRAS40 (relieving its
          inhibition of mTORC1). mTORC2 supplies the Ser473 phosphorylation that AKT needs for
          full activity, so this node is also an mTORC2 output.
