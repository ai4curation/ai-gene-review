id: MODULE:mitochondrial_protein_import
title: Mitochondrial protein import machinery
description: 'Nearly all mitochondrial proteins are made in the cytosol and imported. This module is the
  eukaryote-wide core of that machinery, written so that it can be evaluated in any genome: the Tom40
  outer-membrane pore through which most precursors enter; the Sam50 beta-barrel insertase; the TIM23
  presequence translocase with its Hsp70-based import motor; the TIM22 carrier insertase; the intermembrane-space
  disulfide relay; and the mitochondrial processing peptidase that removes presequences. Optional parts
  are components missing from some eukaryotic lineages: receptors that PAINT places only in opisthokonts,
  and Mia40, which kinetoplastids lack.'
status: DRAFT
scope: CONCRETE
evidence:
- source_id: file:projects/MITOCHONDRIAL_IMPORT_PATHWAYS.md
  title: Mitochondrial Import Pathways Project
  statement: Route structure (TOM-TIM23-PAM, TIM22, SAM, MIA) and the reviewed human import machinery
    used as representative members.
notes: 'Eukaryote-wide scope comes from PAINT: the IBD nodes for Tom40, Sam50, Tim23, Tim17, Tim22, Tim44,
  Pam16, Pam18, Mge1, Mia40, Erv1 and MPP beta are placed at Eukaryota (taxon:2759), whereas Tom22 and
  Tom70 are placed at Opisthokonta, so the receptors are optional. Read as a satisfiability rule, every
  non-optional part is expected in any eukaryote with a mitochondrion-related organelle, except in the
  lineages named below, which are not yet modelled as variants and so will be reported as import gaps
  rather than passes. Known exceptions: kinetoplastids replace the TIM23/TIM22 pair with a single Tim17-family
  translocase and lack Mia40, and plant and kinetoplastid outer-membrane receptors (TOM20-like, ATOM)
  are not homologous to the opisthokont ones. Mia40 is therefore optional within the disulfide relay.
  The mtHsp70 motor is grounded only at the whole Hsp70 family; a mitochondrial-subfamily selector is
  needed before that step discriminates in a genome. The Pam18 selector (PTHR12763) likewise also matches
  the paralogous DNAJC15/MCJ subfamily (PTHR12763:SF7). Not yet modelled: alpha-helical outer-membrane
  insertion (MIM/MTCH), TIM23-SORT lateral release, the Tim50 presequence receptor (its PANTHER family
  PTHR12210 is the broad FCP1-like phosphatase family, so it needs a subfamily selector), and the small
  Tim chaperones of the TIM22 route. The Drosophila compendium dmel_mitochondrial_protein_import models
  the same stage, including Tim50 and the small Tims, and is a source for extending this rule.'
