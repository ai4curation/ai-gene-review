id: MODULE:hydroxyproline_catabolism
title: Bacterial trans-4-hydroxy-L-proline catabolism to 2-oxoglutarate
description: >-
  A reusable bacterial four-reaction route that converts
  trans-4-hydroxy-L-proline, the major imino acid of host and plant collagen and
  cell-wall protein, to 2-oxoglutarate. A PLP-independent epimerase first forms
  cis-4-hydroxy-D-proline. An FAD-dependent oxidoreductase generates
  4-hydroxy-1-pyrroline-2-carboxylate, a deaminase converts that cyclic imine to
  2,5-dioxopentanoate and ammonium, and an aldehyde dehydrogenase-family enzyme
  completes oxidation to 2-oxoglutarate. The route is distributed across
  proteobacteria, firmicutes and actinobacteria, and is unrelated to the
  mammalian hydroxyproline pathway, which proceeds through hydroxyproline
  dehydrogenase and the HOGA1 aldolase to glyoxylate and pyruvate.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0019470
    title: trans-4-hydroxy-L-proline catabolic process
    statement: >-
      GO:0019470 defines the biological-process boundary from
      trans-4-hydroxy-L-proline toward central metabolism.
  - source_id: PMID:22833679
    title: >-
      Identification and characterization of D-hydroxyproline dehydrogenase and
      Delta1-pyrroline-4-hydroxy-2-carboxylate deaminase involved in novel
      L-hydroxyproline metabolism of bacteria: metabolic convergent evolution.
    statement: >-
      The study directly characterizes the P. putida and P. aeruginosa
      D-hydroxyproline dehydrogenases and the cyclic-imine deaminase, links both
      activities to hydroxyproline utilization by gene disruption, and
      establishes that the route reaches 2-oxoglutarate in four steps.
    supporting_text: >-
      Pseudomonas putida and Pseudomonas aeruginosa convert L-hydroxyproline to α-ketoglutarate via four hypothetical enzymatic steps different from known mammalian pathways
  - source_id: PMID:24980702
    title: >-
      Prediction and characterization of enzymatic activities guided by sequence
      similarity and genome neighborhood networks.
    statement: >-
      Genome-neighborhood analysis of the proline racemase superfamily lays out
      the same four reactions and their enzyme superfamilies, and shows the route
      operating outside the pseudomonads, including in Bacillus cereus and
      Streptomyces lividans.
    supporting_text: >-
      can be initiated by the epimerization of t4Hyp to cis-4-hydroxy-D-proline (c4Hyp) by 4HypE, followed by reactions catalyzed by c4Hyp oxidase (a member of the DAAO superfamily), c4Hyp imino acid dehydratase/deaminase (a member of the DHDPS superfamily), and α-ketoglutarate semialdehyde dehydrogenase (a member of the aldehyde dehydrogenase superfamily).
  - source_id: PMID:23995642
    title: Amino acid racemization in Pseudomonas putida KT2440
    statement: >-
      The KT2440 study experimentally characterizes ProR as a
      hydroxyproline-preferring epimerase and shows growth on hydroxyproline.
    supporting_text: strong epimerization activity with hydroxyproline as the substrate
  - source_id: PMID:27145750
    title: >-
      Molecular characterization of LhpR in control of hydroxyproline catabolism
      and transport in Pseudomonas aeruginosa PAO1.
    statement: >-
      In P. aeruginosa the pathway genes lie in two hydroxyproline-inducible loci
      controlled by the AraC-family regulator LhpR, and knockouts across those
      loci impair growth on L-hydroxyproline.
    supporting_text: >-
      The importance of these genes on l-Hyp catabolism was supported by
      growth phenotype analysis on knockout mutants.
  - source_id: RHEA:21152
    title: 4-hydroxyproline 2-epimerase reaction
    statement: >-
      Rhea 21152 defines reversible interconversion of
      trans-4-hydroxy-L-proline and cis-4-hydroxy-D-proline.
  - source_id: RHEA:10560
    title: 1-pyrroline-4-hydroxy-2-carboxylate deaminase reaction
    statement: >-
      Rhea 10560 defines hydrolytic deamination of the cyclic imine to
      2,5-dioxopentanoate and ammonium.
  - source_id: RHEA:11296
    title: 2,5-dioxovalerate dehydrogenase (NADP+) reaction
    statement: >-
      Rhea 11296 defines terminal oxidation of 2,5-dioxopentanoate to
      2-oxoglutarate with NADP+.
notes: >-
  The boundary starts with the stereochemical entry reaction and ends at
  2-oxoglutarate. Hydroxyproline transport (the LhpPMNO-type ABC systems),
  LhpR-mediated induction, the separate trans-3-hydroxy-L-proline branch, and
  downstream use of 2-oxoglutarate are outside the module. No generic cellular
  location is asserted: the enzymes are soluble bacterial proteins, but only
  PP_1255 has a locus-level cytoplasmic call, and that is an electronic
  inference.

  Species scope. The module is written species-neutrally. KT2440 supplies the
  only organism with all four steps grounded, and is one exemplar rather than
  the subject. P. aeruginosa PAO1 grounds the epimerase step and the second
  oxidase architecture. The terminal reaction has two exemplars:
  A. brasilense LhpG, which is the only characterized terminal dehydrogenase
  of this pathway (purified from hydroxy-L-proline-grown cells and
  hydroxyproline-inducible, as against the aldarate-inducible KGSADH-II of the
  same organism), and A. baylyi KgsD, which performs the same reaction in the
  D-glucarate pathway that converges on the same 2,5-dioxopentanoate
  intermediate.

  Cofactor. The terminal annoton is typed with the NADP+ term because the
  characterized pathway enzyme prefers NADP+, but the reaction is not
  cofactor-specific: LhpG carries both reactions with a roughly 75-fold lower
  Km for NADP+, its aldarate paralog prefers NAD+, and GO splits the reaction
  into an NADP+ and an NAD+ term with no substrate-specific neutral parent. An
  unassayed member is therefore reviewed against the proposed neutral term
  (see the PP_1256 review) rather than against either child.

  Enzyme-family grounding. Both PANTHER families whose members carry these
  steps are functionally mixed, so the module grounds those nodes on exemplars
  and InterPro signatures instead of PANTHER terms. PTHR33442 mixes
  4-hydroxyproline epimerases with trans-3-hydroxy-L-proline dehydratases in
  both of its subfamilies, and the epimerase activity arose more than once in
  that superfamily, so IPR008794 (the fold) is asserted and the activity is
  established per protein. PTHR13847:SF289 mixes the KT2440 oxidase with ThiO
  glycine oxidases and HcnC. PTHR43353:SF3 does contain both grounded terminal
  dehydrogenases, but it also holds aldehyde dehydrogenases with other
  substrates, so the narrower IPR044151 (ALDH_KGSADH) is used. Only the
  deaminase step carries a PANTHER subfamily term, PTHR12128:SF72, verified
  against panther.obo and the member index; that assertion comes from open
  maintainer PR #5076 and is retained here. PTHR43353:SF3 is the one case where
  the subfamily does track the reaction: five of its six Swiss-Prot members are
  KGSADHs, so its family review scopes the activity to SF3 with the one fatty
  aldehyde dehydrogenase recorded as a member exception. The module still
  grounds on IPR044151, because SF3 membership does not say which route a
  member serves. All four families now have FamilyReview documents recording
  this divergence.

  The oxidase step is a variant set rather than a single enzyme, because the two
  characterized enzymes are of independent origin: a single-chain FAD protein in
  P. putida and a multi-subunit FAD/FMN/[2Fe-2S] enzyme in P. aeruginosa. The
  subunit accessions of the P. aeruginosa enzyme are not asserted: the cached
  abstract names the operon as lhpABFE without mapping subunits to locus tags,
  and the full text was not available, so that variant is deliberately left
  ungrounded rather than filled with a guess. This produces a leaf-grounding
  warning, which is a real curation gap and not a modelling choice.

  The LhpBEF gap is narrow and the next pass should not re-derive it. What is
  settled, from the cited literature: the operon is lhpABFE and lhpA is PA1268,
  so the three subunits should be among the genes adjacent to PA1268. What
  blocks grounding: a UniProt query for lhpB, lhpE and lhpF in P. aeruginosa
  PAO1 returns no gene with any of those names, and the adjacent loci PA1267
  and PA1266 carry only uninformative protein names with no function comment,
  leaving a three-subunit enzyme with at most two candidates. Accessions are
  deliberately not written down here, because nothing cached in this repository
  records the locus-to-accession mapping for them; the next pass should fetch
  the adjacent loci and ground them only if UniProt names the subunits
  explicitly with evidence, or if the full text of the characterization gives
  locus tags. Note also that the neighbouring lhpD/lhpH locus is the Pyr2C
  reductase of the 3-hydroxyproline branch, which is outside this module.

  Similarly, the single-chain variant's grounding is an inference about which
  locus the characterized P. putida enzyme is: the gene review records those
  rows as IGC on the strength of the gene neighbourhood, not as a direct assay
  of Q88NF6.

  The oxidase step has no exact GO molecular-function term, so GO:0016645 is
  used as the closest donor-class parent while the substrate-specific activity
  stays explicit in the descriptor and in the proposed term in the PP_1255
  review.

  Two validator warnings are expected and accepted, and both record real
  states rather than defects in this module. The function-conformance check
  reports FAMILY_FUNCTION_UNREVIEWED for the deaminase, because the PTHR12128
  review leaves the subfamily-level scope of GO:0047425 UNRESOLVED: the
  activity is established for PP_1257 itself, but SF72 has no other assayed
  member, so claiming it subfamily-wide would overstate the evidence. It also
  reports REVIEW_DISAGREEMENT for Q88NF5 on the terminal annoton's NADP+ term,
  and that warning is doing its job. PP_1256's review moves every row off
  GO:0047533 to a proposed substrate-specific, cofactor-neutral term, because
  the protein is unassayed and the characterized members of its subfamily use
  both cofactors. The module nevertheless types the step with the NADP+ term,
  because the two characterized exemplars, LhpG and KgsD, carry it on their own
  measurements; the disagreement is about PP_1256's cofactor, not about the
  reaction the step performs. When the proposed term is created, the annoton
  and that review should be revisited together. Page QC additionally lists the multi-subunit oxidase variant as a
  leaf without representative members, for the reason given above. The
  NCBITaxon label for the module's taxonomic context is reported as
  unvalidated wherever OLS cannot be reached, as it is for every module that
  asserts a taxon.
module:
  id: hydroxyproline_catabolism
  label: Bacterial trans-4-hydroxy-L-proline catabolism
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: trans-4-hydroxy-L-proline catabolic process
      term:
        id: GO:0019470
        label: trans-4-hydroxy-L-proline catabolic process
      description: Conversion of trans-4-hydroxy-L-proline to 2-oxoglutarate.
  context:
    taxa:
      - preferred_term: Bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          The route is bacterial. Characterized members are proteobacterial, and
          genome-neighborhood analysis plus growth tests extend it to
          firmicutes and actinobacteria. The mammalian hydroxyproline pathway
          uses different enzymes and ends in glyoxylate and pyruvate.
        evidence:
          - source_id: PMID:24980702
            statement: >-
              Predicted pathway genes were confirmed by growth of Bacillus
              cereus and Streptomyces lividans on trans-4-hydroxy-L-proline as
              sole carbon source.
            supporting_text: >-
              As predicted from the GNN, Bacillus cereus ATCC14579 (cluster 4, teal) and Streptomyces lividans TK24 (cluster 11, pale green) both utilize t4Hyp as sole carbon source (Table 3)
  parts:
    - order: 1
      role: hydroxyproline stereochemical entry
      node:
        id: hydroxyproline_epimerase_step
        label: trans-4-hydroxy-L-proline epimerization
        module_type: REACTION
        annotons:
          - id: hydroxyproline_epimerase_activity
            label: 4-hydroxyproline 2-epimerase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: proline-racemase-family 4-hydroxyproline epimerases
                term:
                  id: InterPro:IPR008794
                  label: Proline racemase family
                description: >-
                  The fold is asserted rather than a PANTHER family: both
                  PTHR33442 subfamilies mix epimerases with
                  trans-3-hydroxy-L-proline dehydratases, and the epimerase
                  activity evolved more than once within the superfamily. It
                  tracks with the paired catalytic cysteines and the valine that
                  admits the 4-hydroxyl, not with subfamily membership.
                evidence:
                  - source_id: PMID:24980702
                    statement: >-
                      Two families of 4-hydroxyproline epimerases arose
                      independently in the proline racemase superfamily.
                    supporting_text: We conclude that these two families of 4HypEs evolved from divergent, but homologous, ancestors.
                  - source_id: PMID:17849014
                    statement: >-
                      Site-directed mutagenesis shows the activity depends on
                      the two catalytic cysteines and on Val60 for substrate
                      specificity.
                    supporting_text: >-
                      The absence of epimerization exhibited by the two mutants revealed that the Val60 aliphatic residue indeed accounts for OH-Pro ligand specificity and is consequently essential for HyPRE catalysis.
                representative_members:
                  - preferred_term: PA1268 / lhpA (Pseudomonas aeruginosa PAO1)
                    term:
                      id: UniProtKB:Q9I476
                      label: 4-hydroxyproline 2-epimerase
                    description: >-
                      Purified enzyme epimerizes 4-hydroxyproline with no
                      proline racemase activity; both catalytic cysteines are
                      required.
                  - preferred_term: proR (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88NF3
                      label: 4-hydroxyproline 2-epimerase
                    description: >-
                      Characterized hydroxyproline-preferring epimerase; no
                      measurable racemase activity on the 19 natural chiral
                      amino acids.
            function:
              preferred_term: 4-hydroxyproline epimerase activity
              term:
                id: GO:0047580
                label: 4-hydroxyproline epimerase activity
              substrates:
                - preferred_term: trans-4-hydroxy-L-proline
              products:
                - preferred_term: cis-4-hydroxy-D-proline
              evidence:
                - source_id: RHEA:21152
                  statement: Rhea 21152 defines the reversible epimerization.
                - source_id: PMID:23995642
                  statement: >-
                    Recombinant KT2440 ProR has strong hydroxyproline
                    epimerization activity.
                  supporting_text: strong epimerization activity with hydroxyproline as the substrate
                - source_id: PMID:17849014
                  statement: >-
                    The purified P. aeruginosa enzyme epimerizes
                    4-hydroxyproline and has no proline racemase activity.
                  supporting_text: >-
                    B. pseudomallei and P. aeruginosa recombinant proteins presented no measurable PRAC activity but demonstrated strong epimerization of OH-L/D-Pro behaving as genuine OH-Pro epimerases.
            processes:
              - preferred_term: trans-4-hydroxy-L-proline catabolic process
                term:
                  id: GO:0019470
                  label: trans-4-hydroxy-L-proline catabolic process
            role_description: >-
              Converts the common trans-L stereoisomer to the cis-D substrate
              used by the oxidative pathway. The reaction is reversible and
              favours the cis-D product at equilibrium, which is why organisms
              carrying it grow on either epimer.
    - order: 2
      role: cis-4-hydroxy-D-proline oxidation
      node:
        id: hydroxyproline_oxidase_step
        label: cis-4-hydroxy-D-proline oxidation
        module_type: REACTION
        description: >-
          Oxidation of the ProR product to the cyclic imine
          4-hydroxy-1-pyrroline-2-carboxylate. Two enzymes of independent origin
          perform this step, so it is modelled as alternative realizers of one
          required activity.
        variant_sets:
          - id: hydroxyproline_oxidase_enzyme_architecture
            label: D-hydroxyproline dehydrogenase architecture
            axis: enzyme architecture and subunit composition
            variant_kind: REALIZER
            selection: EXACTLY_ONE
            evidence:
              - source_id: PMID:22833679
                statement: >-
                  The P. putida enzyme is a homomeric FAD protein while the
                  P. aeruginosa enzyme is a multi-subunit FAD/FMN/[2Fe-2S]
                  enzyme, which the authors read as convergent evolution of the
                  same pathway step.
                supporting_text: >-
                  the former is a homomeric enzyme only containing FAD as a prosthetic group, whereas the latter is a novel heterododecameric structure consisting of three different subunits
            notes: >-
              Both enzymes show the same high specificity for D-hydroxyproline
              and reduce artificial electron acceptors in vitro; the
              physiological acceptor is unresolved for both.
            variants:
              - id: hydroxyproline_oxidase_single_chain
                label: single-chain FAD D-hydroxyproline dehydrogenase
                module_type: REACTION
                description: >-
                  The P. putida-type enzyme: one polypeptide with FAD as the
                  only prosthetic group.
                annotons:
                  - id: hydroxyproline_oxidase_activity
                    label: D-hydroxyproline dehydrogenase activity (single-chain FAD enzyme)
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: FAD-dependent oxidoreductase-family D-hydroxyproline dehydrogenases
                        term:
                          id: InterPro:IPR006076
                          label: FAD dependent oxidoreductase
                        description: >-
                          The DAAO-superfamily signature carried by the KT2440
                          enzyme. No PANTHER term is asserted: PTHR13847:SF289
                          also holds ThiO glycine oxidases and the cyanide
                          synthase subunit HcnC, so subfamily membership does
                          not imply this substrate.
                        representative_members:
                          - preferred_term: PP_1255 (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88NF6
                              label: Cis-4-hydroxy-D-proline oxidase
                            description: >-
                              The P. putida enzyme of this type was purified as
                              a homomeric FAD protein specific for
                              D-hydroxyproline. Its assignment to this
                              accession rests on the submitted protein name and
                              the hydroxyproline-locus gene neighbourhood, not
                              on a published locus tag, so the gene review
                              records those rows as IGC.
                    function:
                      preferred_term: D-hydroxyproline dehydrogenase activity
                      term:
                        id: GO:0016645
                        label: oxidoreductase activity, acting on the CH-NH group of donors
                      substrates:
                        - preferred_term: cis-4-hydroxy-D-proline
                        - preferred_term: oxidized electron acceptor
                      products:
                        - preferred_term: 4-hydroxy-1-pyrroline-2-carboxylate
                        - preferred_term: reduced electron acceptor
                      evidence:
                        - source_id: PMID:22833679
                          statement: >-
                            The P. putida homomeric FAD enzyme was characterized
                            with D-hydroxyproline and artificial electron
                            acceptors.
                          supporting_text: >-
                            D-hydroxyproline dehydrogenases from P. putida and P. aeruginosa were completely different from known bacterial proline dehydrogenases and showed similar high specificity for substrate (D-hydroxyproline) and some artificial electron acceptor(s).
                        - source_id: PMID:24980702
                          statement: >-
                            Genome-neighborhood analysis assigns this step to a
                            DAAO-superfamily oxidase next to the epimerase gene.
                          supporting_text: c4Hyp oxidase (a member of the DAAO superfamily)
                    processes:
                      - preferred_term: trans-4-hydroxy-L-proline catabolic process
                        term:
                          id: GO:0019470
                          label: trans-4-hydroxy-L-proline catabolic process
                    role_description: >-
                      Oxidizes the epimerase product to the cyclic imine
                      consumed by the deaminase. The physiological electron
                      acceptor remains unresolved.
              - id: hydroxyproline_oxidase_multisubunit
                label: multi-subunit FAD/FMN/[2Fe-2S] D-hydroxyproline dehydrogenase
                module_type: REACTION
                intentionally_ungrounded: true
                description: >-
                  The P. aeruginosa-type enzyme (LhpBEF): a heterododecamer of
                  three different subunits, with two FADs, FMN and a [2Fe-2S]
                  cluster per heterotrimeric unit. The subunit accessions are
                  deliberately not asserted, because the cached literature names
                  the operon lhpABFE without mapping subunits to locus tags.
                annotons:
                  - id: hydroxyproline_oxidase_activity_multisubunit
                    label: D-hydroxyproline dehydrogenase activity (multi-subunit flavo-iron-sulfur enzyme)
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: LhpBEF-type D-hydroxyproline dehydrogenase complex
                        description: >-
                          Heterododecamer (alpha4beta4gamma4) containing two
                          FADs, FMN and a [2Fe-2S] cluster per alpha-beta-gamma
                          unit, encoded in the P. aeruginosa lhp locus beside
                          the epimerase gene lhpA.
                        evidence:
                          - source_id: PMID:22833679
                            statement: >-
                              The P. aeruginosa enzyme is a heterododecamer of
                              three subunits carrying FAD, FMN and a [2Fe-2S]
                              cluster.
                            supporting_text: >-
                              a novel heterododecameric structure consisting of three different subunits (α(4)β(4)γ(4)), and two FADs, FMN, and [2Fe-2S] iron-sulfur cluster were contained in αβγ of the heterotrimeric unit
                          - source_id: PMID:27145750
                            statement: >-
                              The P. aeruginosa locus encodes the epimerase LhpA
                              together with the three-subunit D-Hyp
                              dehydrogenase LhpBEF.
                            supporting_text: >-
                              The first locus includes lhpABFE encoding a Hyp epimerase (LhpA) and d-Hyp dehydrogenase (LhpBEF)
                    function:
                      preferred_term: D-hydroxyproline dehydrogenase activity
                      term:
                        id: GO:0016645
                        label: oxidoreductase activity, acting on the CH-NH group of donors
                      substrates:
                        - preferred_term: cis-4-hydroxy-D-proline
                        - preferred_term: oxidized electron acceptor
                      products:
                        - preferred_term: 4-hydroxy-1-pyrroline-2-carboxylate
                        - preferred_term: reduced electron acceptor
                      evidence:
                        - source_id: PMID:22833679
                          statement: >-
                            Both the P. putida and the P. aeruginosa enzymes
                            were purified and shown to be specific for
                            D-hydroxyproline.
                          supporting_text: >-
                            D-hydroxyproline dehydrogenases from P. putida and P. aeruginosa were completely different from known bacterial proline dehydrogenases and showed similar high specificity for substrate (D-hydroxyproline) and some artificial electron acceptor(s).
                    processes:
                      - preferred_term: trans-4-hydroxy-L-proline catabolic process
                        term:
                          id: GO:0019470
                          label: trans-4-hydroxy-L-proline catabolic process
                    role_description: >-
                      Performs the same oxidation as the single-chain enzyme in
                      organisms that encode the multi-subunit form.
    - order: 3
      role: cyclic-imine deamination
      node:
        id: hydroxyproline_deaminase_step
        label: 4-hydroxy-1-pyrroline-2-carboxylate deamination
        module_type: REACTION
        annotons:
          - id: hydroxyproline_deaminase_activity
            label: 1-pyrroline-4-hydroxy-2-carboxylate deaminase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DHDPS/NAL-superfamily hydroxyproline-pathway deaminases
                term:
                  id: PANTHER:PTHR12128:SF72
                  label: DIHYDRODIPICOLINATE SYNTHASE
                description: >-
                  The subfamily holding the KT2440 deaminase. Its PANTHER label
                  is inherited from the family and names the ancestral
                  dihydrodipicolinate synthase activity, not this reaction: the
                  deaminase is a hydrolase that retains the family's
                  pyruvate-binding site, and pyruvate inhibits it
                  competitively. Whether every member of the subfamily is a
                  deaminase is untested, so the subfamily's own review records
                  the activity as unresolved at subfamily level.
                evidence:
                  - source_id: PMID:22833679
                    statement: >-
                      The deaminase is an unusual member of the
                      dihydrodipicolinate synthase/N-acetylneuraminate lyase
                      family and is competitively inhibited by pyruvate.
                    supporting_text: >-
                      Pyr4H2C deaminase is a unique member of the dihydrodipicolinate synthase/N-acetylneuraminate lyase protein family, and its activity was competitively inhibited by pyruvate
                  - source_id: file:interpro/panther/PTHR12128/PTHR12128-review.yaml
                    statement: >-
                      The family review records SF72 as diverged from the
                      ancestral synthase activity and the subfamily-level scope
                      of the deaminase activity as unresolved.
                    supporting_text: >-
                      It is a hydrolase/deaminase, not a DHDPS-type lyase, although it keeps the family's
                representative_members:
                  - preferred_term: PP_1257 (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88NF4
                      label: 1-pyrroline-4-hydroxy-2-carboxylate deaminase
                    description: >-
                      Characterized Pyr4H2C deaminase; gene disruption abolishes
                      growth on L- and D-hydroxyproline but not on proline.
            function:
              preferred_term: 1-pyrroline-4-hydroxy-2-carboxylate deaminase activity
              term:
                id: GO:0047425
                label: 1-pyrroline-4-hydroxy-2-carboxylate deaminase activity
              substrates:
                - preferred_term: 4-hydroxy-1-pyrroline-2-carboxylate
                - preferred_term: water
                - preferred_term: proton
              products:
                - preferred_term: 2,5-dioxopentanoate
                - preferred_term: ammonium
              evidence:
                - source_id: PMID:22833679
                  statement: >-
                    Biochemical characterization and gene disruption establish
                    the hydroxyproline-specific deaminase role.
                  supporting_text: >-
                    disruption of Pyr4H2C deaminase genes led to loss of growth on L-hydroxyproline
                - source_id: RHEA:10560
                  statement: Rhea 10560 defines the hydrolytic deamination.
            processes:
              - preferred_term: trans-4-hydroxy-L-proline catabolic process
                term:
                  id: GO:0019470
                  label: trans-4-hydroxy-L-proline catabolic process
            role_description: >-
              Releases the substrate nitrogen as ammonium and opens the ring to
              give the aldehyde used by the terminal dehydrogenase. Because the
              deaminase is specific to this route, its loss abolishes growth on
              hydroxyproline while leaving proline catabolism intact.
    - order: 4
      role: terminal oxidation to 2-oxoglutarate
      node:
        id: hydroxyproline_terminal_dehydrogenase_step
        label: 2,5-dioxopentanoate oxidation
        module_type: REACTION
        description: >-
          The shared terminal reaction of several aldarate, pentose and imino
          acid routes, all of which converge on 2,5-dioxopentanoate
          (alpha-ketoglutaric semialdehyde).
        annotons:
          - id: hydroxyproline_terminal_dehydrogenase_activity
            label: 2,5-dioxovalerate dehydrogenase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: alpha-ketoglutaric-semialdehyde dehydrogenase (KGSADH) enzymes
                term:
                  id: InterPro:IPR044151
                  label: Alpha-ketoglutaric semialdehyde dehydrogenase
                description: >-
                  The KGSADH subgroup signature is asserted rather than
                  PANTHER:PTHR43353:SF3. Five of SF3's six Swiss-Prot members
                  are KGSADHs, so the subfamily is good evidence for the
                  substrate, but it says nothing about which route a member
                  serves: its members work in the hydroxyproline and aldarate
                  pathways, and one member is a fatty aldehyde dehydrogenase. The subgroup is itself convergent: three
                  KGSADH types arose separately in bacteria, and cofactor
                  preference differs between them.
                evidence:
                  - source_id: PMID:17202142
                    statement: >-
                      Azospirillum brasilense has NAD+-preferring and
                      NADP+-preferring KGSADH isozymes with the same substrate
                      specificity, the latter induced by hydroxy-L-proline.
                    supporting_text: "NAD(+)-dependent KGSADH-II and NADP(+)-dependent KGSADH-III"
                representative_members:
                  - preferred_term: LhpG (Azospirillum brasilense)
                    term:
                      id: UniProtKB:Q08IB7
                      label: Alpha-ketoglutaric semialdehyde dehydrogenase 3
                    description: >-
                      KGSADH-III, the only characterized terminal
                      dehydrogenase of this pathway: purified from
                      hydroxy-L-proline-grown cells, hydroxyproline-inducible,
                      and distinct from the aldarate-inducible KGSADH-II of
                      the same organism. It carries both cofactor reactions,
                      preferring NADP+ about 75-fold on Km.
                  - preferred_term: ACIAD0131 / kgsD (Acinetobacter baylyi ADP1)
                    term:
                      id: UniProtKB:Q6FFQ0
                      label: Alpha-ketoglutaric semialdehyde dehydrogenase
                    description: >-
                      Characterized KGSADH with the curated NADP+-coupled
                      Rhea 11296 reaction. Its own pathway is D-glucarate
                      degradation, which converges on the same intermediate, so
                      it exemplifies the reaction rather than a hydroxyproline
                      role.
                  - preferred_term: PP_1256 (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88NF5
                      label: 2,5-dioxovalerate dehydrogenase
                    description: >-
                      Synteny-favored KT2440 candidate, in the same PANTHER
                      subfamily as the characterized KgsD; PP_2585 and PP_3602
                      carry the same EC assignment and no experiment has
                      resolved which paralog carries pathway flux.
            function:
              preferred_term: 2,5-dioxovalerate dehydrogenase (NADP+) activity
              term:
                id: GO:0047533
                label: 2,5-dioxovalerate dehydrogenase (NADP+) activity
              substrates:
                - preferred_term: 2,5-dioxopentanoate
                - preferred_term: NADP+
                - preferred_term: water
              products:
                - preferred_term: 2-oxoglutarate
                - preferred_term: NADPH
                - preferred_term: proton
              evidence:
                - source_id: RHEA:11296
                  statement: Rhea 11296 defines the NADP+-dependent reaction.
                - source_id: file:ACIAD/ACIAD0131/ACIAD0131-uniprot.txt
                  statement: >-
                    UniProt curates the NADP+-coupled reaction for A. baylyi
                    KgsD from the biochemical characterization of the purified
                    enzyme.
                  supporting_text: >-
                    Reaction=2,5-dioxopentanoate + NADP(+) + H2O = 2-oxoglutarate + NADPH +
                - source_id: file:AZOBR/LhpG/LhpG-uniprot.txt
                  statement: >-
                    The characterized hydroxyproline-pathway isozyme of
                    A. brasilense performs this reaction and prefers NADP+,
                    which is why the NADP+ term heads this annoton.
                  supporting_text: >-
                    Involved in hydroxy-L-proline metabolism. Prefers NADP(+) to NAD(+) as a
                    cosubstrate.
                - source_id: RHEA:47152
                  statement: >-
                    Rhea 47152 defines the alternative NAD+-dependent reaction,
                    which the NAD+-preferring KGSADH isozymes perform. GO splits
                    this reaction into an NADP+ and an NAD+ term (GO:0044104)
                    with no substrate-specific cofactor-neutral parent, so an
                    unassayed member such as PP_1256 is reviewed against a
                    proposed neutral term instead.
            processes:
              - preferred_term: trans-4-hydroxy-L-proline catabolic process
                term:
                  id: GO:0019470
                  label: trans-4-hydroxy-L-proline catabolic process
            role_description: >-
              Produces 2-oxoglutarate and completes hydroxyproline carbon entry
              into central metabolism. The same activity serves the aldarate and
              L-arabinose routes, so an organism may use one shared enzyme for
              several pathways.
