  notes: >-
    GENERALIZED (YeastPathways crosswalk, 2026-10) from the earlier mammalian
    module to cover fungi and plants. The mammalian realization is kept as the
    animal lineage variant: human GAD1/GAD2 (PTHR45677), ABAT (P80404) and
    ALDH5A1 (P51649), grounded in the human Reactome reactions and the completed
    human gene reviews. In mammals GAD is cytosolic, while ABAT and ALDH5A1 are
    in the mitochondrial matrix, so GABA must be imported. GAD1 deficiency causes
    spastic paraplegia, cerebral palsy or developmental and epileptic
    encephalopathy, ABAT deficiency causes GABA-transaminase deficiency, and
    ALDH5A1 deficiency causes SSADH deficiency (4-hydroxybutyric aciduria). ABAT
    also transaminates beta-amino acids, which links it to thymine catabolism. In
    yeasts that function belongs to a separate paralog in the S. kluyveri lineage
    (PYD4; PMID:17355287). Fungal grounding: S. cerevisiae GAD1, UGA1 and UGA2
    (YeastCyc GLUDEG-I-PWY-1 and YEAST-4AMINOBUTMETAB-PWY; all three gene
    assignments retained). S. pombe uga1, ssd1 and ssd2 come from the PomBase
    GABA-catabolism model. YeastCyc corrections: none to gene content. The
    GLUDEG-I-PWY-1 comment notes that GDH2 glutamate dehydrogenase, not this
    shunt, is the main route of glutamate degradation in S. cerevisiae.
    Compartments differ by lineage. S. cerevisiae UGA1 and UGA2 are cytosolic
    (UniProt, PMID:11914276, PMID:14562095), whereas the PomBase model places
    S. pombe uga1, ssd1 and ssd2 in the mitochondrial matrix. Because of this,
    no location is asserted on the catabolic annotons. GO-CAM disagreements:
    the PomBase model types ssd1/ssd2 as NAD+-specific (GO:0004777), while
    UniProt names them NADP+-dependent. The SGD models have no causal links. The
    PomBase model's plasma-membrane and mitochondrial GABA import activities are
    enabled by unidentified proteins and are outside the module. S. pombe has no
    glutamate decarboxylase, so the GAD part is optional. The uptake permeases
    (S. cerevisiae UGA4, PUT4, GAP1) and the UGA3/DAL81 transcriptional control
    are excluded. Scope: eukaryotic GABA shunt; the bacterial GabT/GabD
    pathway (for example in P. putida) and its transport and regulation belong
    in a separate bacterial module.
  knowledge_gaps:
    - gap_statement: >-
        The mitochondrial GABA-import step is not represented by a confidently
        assigned participant in this module.
      boundary: >-
        Applies to lineages where GABA catabolism is mitochondrial (animals,
        plants, and S. pombe per the PomBase model), not to the cytosolic S.
        cerevisiae pathway. The chemical handoff from GAD-produced or imported
        GABA to the matrix transaminase is retained, but a transporter should not
        be asserted without direct molecular evidence.
      gap_kind:
        - BIOLOGY
      dark_aspect: RESIDUAL_SUBGAP
      status: OPEN
      significance: >-
        GABA must cross the mitochondrial inner membrane to connect cytosolic
        synthesis or uptake to matrix GABA transaminase, so identifying the
        carrier is necessary to explain control of GABA-shunt flux.
      resolution: >-
        Identify the inner-membrane carrier by mitochondrial transport assays,
        loss-of-function genetics, and rescue with a molecularly defined transporter.
