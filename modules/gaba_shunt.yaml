id: MODULE:gaba_shunt
title: GABA shunt (glutamate to GABA to succinate)
description: >-
  Three-step pathway, found in animals, plants and fungi, that converts
  L-glutamate to succinate through gamma-aminobutyrate (GABA) and succinate
  semialdehyde. It bypasses the 2-oxoglutarate-to-succinate segment of the TCA
  cycle. A pyridoxal-phosphate glutamate decarboxylase first converts
  L-glutamate to GABA and CO2 in the cytosol. A pyridoxal-phosphate GABA
  transaminase then transfers the amino group of GABA to an acceptor 2-oxo acid,
  giving succinate semialdehyde. Finally, succinate-semialdehyde dehydrogenase
  oxidizes succinate semialdehyde to succinate with NAD+ or NADP+. The
  chemistry is conserved, but the implementations differ between lineages.
  Animal glutamate decarboxylases form a family separate from the
  calmodulin-binding decarboxylases of plants and fungi. Animal and fungal GABA
  transaminases use 2-oxoglutarate and so regenerate glutamate, whereas the
  main plant enzyme uses pyruvate or glyoxylate. GABA catabolism takes place
  in the mitochondrial matrix of animals and plants but in the cytosol of
  budding yeast. In animals the shunt makes and clears the inhibitory
  neurotransmitter GABA. In plants it responds to stress and makes the GABA
  gradient that guides pollen tubes. In yeasts it lets GABA serve as a
  nitrogen source and helps cells tolerate oxidative stress. Organisms that
  lack glutamate decarboxylase, such as fission yeast, can still degrade GABA
  taken up from outside.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006540
    title: GABA shunt
    statement: >-
      The module is grounded in the GO GABA shunt (GO:0006540): glutamate -> GABA ->
      succinate semialdehyde -> succinate.
  - source_id: GO:0009450
    title: GABA catabolic process
    statement: >-
      Process term for the two catabolic steps (transamination and
      succinate-semialdehyde oxidation), which also act alone on imported GABA.
  - source_id: YeastPathways:GLUDEG-I-PWY-1
    title: glutamate degradation I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists GAD1 (glutamate decarboxylase), UGA1 (4-aminobutyrate
      aminotransferase) and UGA2 (succinate-semialdehyde dehydrogenase
      [NAD(P)+]). All three were retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLUDEG-I-PWY-1
  - source_id: YeastPathways:YEAST-4AMINOBUTMETAB-PWY
    title: 4-aminobutyrate degradation (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists UGA1 and UGA2 for GABA degradation; both reactions are
      the catabolic half of this module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=YEAST-4AMINOBUTMETAB-PWY
  - source_id: Reactome:R-HSA-888572
    title: PXLP-K405-GAD1 decarboxylates L-Glu to form GABA
    statement: >-
      Reactions follow the human Reactome GABA-metabolism reactions R-HSA-888572 (GAD1),
      R-HSA-916855 (ABAT) and R-HSA-888548 (ALDH5A1).
  - source_id: file:human/GAD1/GAD1-ai-review.yaml
    title: GAD1 gene review (human)
    statement: >-
      The glutamate-decarboxylation (GABA synthesis) step (UniProtKB:Q99259, GO:0004351)
      matches the completed human GAD1 review.
  - source_id: file:human/ABAT/ABAT-ai-review.yaml
    title: ABAT gene review (human)
    statement: >-
      The GABA-transamination step (UniProtKB:P80404, GO:0034386) matches the completed
      human ABAT review.
  - source_id: file:human/ALDH5A1/ALDH5A1-ai-review.yaml
    title: ALDH5A1 gene review (human)
    statement: >-
      The succinate-semialdehyde-dehydrogenase step (UniProtKB:P51649, GO:0004777) matches
      the completed human ALDH5A1 review.
  - source_id: PMID:11031268
    title: Expression of a glutamate decarboxylase homologue is required for normal oxidative stress tolerance in Saccharomyces cerevisiae.
    statement: >-
      Identifies S. cerevisiae GAD1 as a plant-like, calmodulin-binding
      glutamate decarboxylase and UGA5 (UGA2) as succinate-semialdehyde
      dehydrogenase; the glutamate-to-succinate pathway is needed for normal
      oxidative stress tolerance.
    supporting_text: >-
      The yeast GAD also bound to calmodulin as did the plant enzyme, suggesting
      a conservation of calcium regulation of this protein.
  - source_id: PMID:3888627
    title: Mutations affecting the enzymes involved in the utilization of 4-aminobutyric acid as nitrogen source by the yeast Saccharomyces cerevisiae.
    statement: >-
      Genetic evidence that GABA transaminase and succinate-semialdehyde
      dehydrogenase make up the GABA utilization pathway of S. cerevisiae.
    supporting_text: >-
      We present genetic evidence for the enzymes 4-aminobutyrate: 2-oxoglutarate
      aminotransferase (EC 2.6.1.19) and succinate-semialdehyde dehydrogenase
      [NAD(P)+] (EC 1.2.1.16) constituting the functional pathway for the utilization
      of 4-aminobutyric acid as a nitrogen source by Saccharomyces cerevisiae.
  - source_id: PMID:17355287
    title: A gene duplication led to specialized gamma-aminobutyrate and beta-alanine aminotransferase in yeast.
    statement: >-
      Purified S. cerevisiae and S. pombe Uga1 are PLP-dependent GABA
      transaminases that use 2-oxoglutarate, not pyruvate, and do not
      transaminate beta-alanine.
    supporting_text: >-
      SpUga1p and ScUga1p transaminate only GABA and not BAL.
  - source_id: PMID:19264755
    title: >-
      Biochemical characterization, mitochondrial localization, expression, and potential
      functions for an Arabidopsis gamma-aminobutyrate transaminase that utilizes both
      pyruvate and glyoxylate.
    statement: >-
      The Arabidopsis GABA transaminase is mitochondrial and uses pyruvate and
      glyoxylate but not 2-oxoglutarate.
    supporting_text: >-
      purified recombinant GABA-T has both pyruvate- and
      glyoxylate-dependent activities, but cannot utilize 2-oxoglutarate as amino
      acceptor.
  - source_id: PMID:12859897
    title: Pollen tube growth and guidance is regulated by POP2, an Arabidopsis gene that controls GABA levels.
    statement: >-
      Arabidopsis POP2 encodes the GABA transaminase; pop2 flowers accumulate
      GABA and pollen tubes are misguided.
    supporting_text: >-
      The
      Arabidopsis POP2 gene encodes a transaminase that degrades GABA and contributes
      to the formation of a gradient leading up to the micropyle.
  - source_id: PMID:10517851
    title: Plant succinic semialdehyde dehydrogenase. Cloning, purification, localization in mitochondria, and regulation by adenine nucleotides.
    statement: >-
      Arabidopsis SSADH1 is a mitochondrial matrix, NAD+-specific
      succinate-semialdehyde dehydrogenase.
    supporting_text: >-
      Fractionation of plant mitochondria revealed its
      localization in the matrix.
module:
  id: gaba_shunt
  label: GABA shunt (glutamate to GABA to succinate)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: GABA shunt
      term:
        id: GO:0006540
        label: GABA shunt
      description: >-
        Synthesis of GABA from glutamate and its catabolism to succinate, bypassing part
        of the TCA cycle.
  context:
    taxa:
      - preferred_term: animals
        term:
          id: NCBITaxon:33208
          label: Metazoa
      - preferred_term: green plants
        term:
          id: NCBITaxon:33090
          label: Viridiplantae
      - preferred_term: fungi
        term:
          id: NCBITaxon:4751
          label: Fungi
  gocam_associations:
    - model: gomodel:YeastPathways_GLUDEG-I-PWY-1
      title: 'glutamate degradation I - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion for S. cerevisiae: GAD1 (GO:0004351), UGA1 (GO:0034386)
        and UGA2 (GO:0009013), all in cytosol, no causal links.
    - model: gomodel:YeastPathways_YEAST-4AMINOBUTMETAB-PWY
      title: '4-aminobutyrate degradation - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion of the catabolic half only: UGA1 and UGA2 in cytosol.
    - model: gomodel:696022cd00001857
      title: gamma-aminobutyric acid catabolic process (GO:0009450)
      description: >-
        PomBase S. pombe model of GABA catabolism: GABA import across the
        plasma membrane and the mitochondrial membrane by unidentified
        transporters, uga1 GABA transaminase and the ssd1/ssd2
        succinate-semialdehyde dehydrogenases in the mitochondrial matrix, and
        succinate passed on to succinate dehydrogenase (sdh1). There is no
        glutamate decarboxylase in this model. The transport and sdh1
        activities are outside this module.
  parts:
    - order: 1
      role: GABA synthesis (glutamate decarboxylation)
      optional: true
      notes: >-
        Optional because some lineages lack glutamate decarboxylase. For
        example, S. pombe has no glutamate decarboxylase in UniProt and its
        PomBase model starts from imported GABA.
      node:
        id: gad_step
        label: L-glutamate to GABA + CO2
        module_type: REACTION
        variant_sets:
          - id: gad_family_variants
            label: Animal versus plant/fungal glutamate decarboxylase families
            axis: enzyme family (lineage)
            selection: EXACTLY_ONE
            notes: >-
              Both families are PLP-dependent group II decarboxylases with the same
              activity, but PANTHER puts them in different families: animal GAD1
              and GAD2 in PTHR45677, and the plant and fungal enzymes in PTHR43321.
              The plant and yeast enzymes bind calmodulin.
            variants:
              - id: animal_gad
                label: Animal glutamate decarboxylases (GAD1/GAD2)
                module_type: REACTION
                annotons:
                  - id: gad_activity
                    label: "GAD1/GAD2: glutamate decarboxylase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Animal glutamate decarboxylase family (GAD1/GAD2)
                        family_terms:
                          - id: PANTHER:PTHR45677:SF5
                            label: GLUTAMATE DECARBOXYLASE 1
                          - id: PANTHER:PTHR45677:SF15
                            label: GAD67
                          - id: PANTHER:PTHR45677:SF11
                            label: GLUTAMATE DECARBOXYLASE 2
                          - id: PANTHER:PTHR45677:SF10
                            label: GLUTAMATE DECARBOXYLASE
                        representative_members:
                          - preferred_term: GAD1 (human, GAD67)
                            term:
                              id: UniProtKB:Q99259
                              label: Glutamate decarboxylase 1
                          - preferred_term: GAD2 (human, GAD65)
                            term:
                              id: UniProtKB:Q05329
                              label: Glutamate decarboxylase 2
                    function:
                      preferred_term: glutamate decarboxylase activity
                      term:
                        id: GO:0004351
                        label: glutamate decarboxylase activity
                      substrates:
                        - preferred_term: L-glutamate
                      products:
                        - preferred_term: gamma-aminobutyric acid (GABA)
                        - preferred_term: CO2
                      evidence:
                        - source_id: EC:4.1.1.15
                          statement: glutamate decarboxylase; PLP-dependent; GAD1/GAD67 constitutive, GAD2/GAD65 synaptic
                        - source_id: Reactome:R-HSA-888572
                          statement: "PXLP-K405-GAD1 decarboxylates L-Glu to form GABA (human Reactome reaction)"
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      PLP-dependent decarboxylation of glutamate to the inhibitory neurotransmitter
                      GABA. GAD1 (GAD67) is the constitutive cytosolic isoform; GAD2 (GAD65) is
                      membrane-associated at synaptic vesicles. GAD1 deficiency -> spastic paraplegia /
                      cerebral palsy / epileptic encephalopathy.
              - id: plant_fungal_gad
                label: Calmodulin-binding plant and fungal glutamate decarboxylases
                module_type: REACTION
                annotons:
                  - id: plant_fungal_gad_activity
                    label: Plant/fungal glutamate decarboxylase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Plant and fungal glutamate decarboxylase family
                        term:
                          id: PANTHER:PTHR43321
                          label: GLUTAMATE DECARBOXYLASE
                        representative_members:
                          - preferred_term: GAD1 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:Q04792
                              label: Glutamate decarboxylase
                            description: >-
                              S. cerevisiae GAD1/YMR250W; binds calmodulin and is
                              needed for normal oxidative stress tolerance
                              (PMID:11031268).
                          - preferred_term: GAD1 (Arabidopsis thaliana)
                            term:
                              id: UniProtKB:Q42521
                              label: Glutamate decarboxylase 1
                            description: Arabidopsis GAD1/At5g17330.
                    function:
                      preferred_term: glutamate decarboxylase activity
                      term:
                        id: GO:0004351
                        label: glutamate decarboxylase activity
                      substrates:
                        - preferred_term: L-glutamate
                      products:
                        - preferred_term: gamma-aminobutyric acid (GABA)
                        - preferred_term: CO2
                      evidence:
                        - source_id: EC:4.1.1.15
                          statement: glutamate decarboxylase
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      PLP-dependent glutamate decarboxylase with a C-terminal
                      calmodulin-binding region; in yeast it supplies GABA for the
                      shunt that buffers oxidative stress.
                    gocam_associations:
                      - model: gomodel:YeastPathways_GLUDEG-I-PWY-1
                        activity: gomodel:GLUTDECARBOX-RXN
                        title: 'glutamate degradation I - imported from: Saccharomyces Genome Database'
                        description: S. cerevisiae GAD1 enables GO:0004351 in cytosol.
                    evidence:
                      - source_id: PMID:11031268
                        statement: S. cerevisiae GAD1 is a plant-like glutamate decarboxylase.
                        supporting_text: >-
                          we identify a
                          Saccharomyces cerevisiae homologue of the GABA-producing enzyme glutamate
                          decarboxylase (GAD) that is required for normal oxidative stress tolerance.
    - order: 2
      role: GABA transamination (first catabolic step)
      node:
        id: abat_step
        label: GABA + acceptor 2-oxo acid to succinate semialdehyde + amino acid
        module_type: REACTION
        variant_sets:
          - id: gaba_t_acceptor_variants
            label: 2-oxoglutarate-dependent versus pyruvate-dependent GABA transaminase
            axis: amino-group acceptor (enzyme family)
            selection: ONE_OR_MORE
            notes: >-
              Animal and fungal GABA transaminases (PTHR43206) use 2-oxoglutarate,
              so the transamination regenerates the glutamate consumed by GAD and
              closes the shunt. The main plant enzyme (POP2, PTHR42684) uses
              pyruvate or glyoxylate, giving alanine or glycine instead.
            variants:
              - id: oxoglutarate_gaba_t
                label: 2-oxoglutarate-dependent GABA transaminase (ABAT/UGA1)
                module_type: REACTION
                annotons:
                  - id: abat_activity
                    label: "ABAT/UGA1: 4-aminobutyrate:2-oxoglutarate aminotransferase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: 4-aminobutyrate aminotransferase family (ABAT/UGA1)
                        family_terms:
                          - id: PANTHER:PTHR43206:SF1
                            label: 4-AMINOBUTYRATE AMINOTRANSFERASE, MITOCHONDRIAL
                          - id: PANTHER:PTHR43206:SF4
                            label: 4-AMINOBUTYRATE AMINOTRANSFERASE, MITOCHONDRIAL
                        representative_members:
                          - preferred_term: ABAT (human)
                            term:
                              id: UniProtKB:P80404
                              label: 4-aminobutyrate aminotransferase, mitochondrial
                          - preferred_term: UGA1 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P17649
                              label: 4-aminobutyrate aminotransferase
                            description: >-
                              S. cerevisiae UGA1/YGR019W, induced by GABA; cytosolic.
                          - preferred_term: uga1 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:O13837
                              label: 4-aminobutyrate aminotransferase
                            description: >-
                              S. pombe uga1/SPAC19D5.07; placed in the mitochondrial
                              matrix in the PomBase model.
                    function:
                      preferred_term: 4-aminobutyrate:2-oxoglutarate transaminase activity
                      term:
                        id: GO:0034386
                        label: 4-aminobutyrate:2-oxoglutarate transaminase activity
                      substrates:
                        - preferred_term: gamma-aminobutyric acid (GABA)
                        - preferred_term: 2-oxoglutarate
                      products:
                        - preferred_term: succinate semialdehyde
                        - preferred_term: L-glutamate
                      evidence:
                        - source_id: EC:2.6.1.19
                          statement: 4-aminobutyrate aminotransferase (GABA transaminase); PLP-dependent; regenerates glutamate
                        - source_id: Reactome:R-HSA-916855
                          statement: "PXLP-K357-ABAT dimer:2Fe-2S transforms GABA to SUCCSA (human Reactome reaction)"
                    processes:
                      - preferred_term: GABA catabolic process
                        term:
                          id: GO:0009450
                          label: GABA catabolic process
                    role_description: >-
                      PLP-dependent GABA transaminase: transfers GABA's amino group to
                      2-oxoglutarate, yielding succinate semialdehyde and regenerating glutamate.
                      Human ABAT is in the mitochondrial matrix (deficiency =
                      GABA-transaminase deficiency); S. cerevisiae UGA1 is cytosolic. No
                      location is asserted for the role because it differs
                      between lineages.
                    gocam_associations:
                      - model: gomodel:YeastPathways_GLUDEG-I-PWY-1
                        activity: gomodel:GABATRANSAM-RXN
                        title: 'glutamate degradation I - imported from: Saccharomyces Genome Database'
                        description: UGA1 enables GO:0034386 in cytosol.
                      - model: gomodel:YeastPathways_YEAST-4AMINOBUTMETAB-PWY
                        activity: gomodel:GABATRANSAM-RXN
                        title: '4-aminobutyrate degradation - imported from: Saccharomyces Genome Database'
                        description: UGA1 enables GO:0034386 in cytosol.
                      - model: gomodel:696022cd00001857
                        activity: gomodel:696022cd00001857/696022cd00001858
                        title: gamma-aminobutyric acid catabolic process (GO:0009450)
                        description: >-
                          S. pombe uga1 enables GO:0034386 in the mitochondrial
                          matrix, part of GO:0009450, with GABA as input and
                          succinate semialdehyde (4-oxobutanoate) as output.
                    evidence:
                      - source_id: PMID:17355287
                        statement: S. cerevisiae and S. pombe Uga1 use 2-oxoglutarate as amino acceptor.
                        supporting_text: >-
                          alpha-ketoglutarate, and not pyruvate, as the
                          amino group acceptor.
              - id: pyruvate_gaba_t
                label: Pyruvate/glyoxylate-dependent GABA transaminase (plants)
                module_type: REACTION
                annotons:
                  - id: plant_gaba_t_activity
                    label: "POP2: 4-aminobutyrate:pyruvate aminotransferase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Plant pyruvate-dependent GABA transaminase (class III aminotransferase)
                        term:
                          id: PANTHER:PTHR42684
                          label: ADENOSYLMETHIONINE-8-AMINO-7-OXONONANOATE AMINOTRANSFERASE
                        representative_members:
                          - preferred_term: POP2 (Arabidopsis thaliana)
                            term:
                              id: UniProtKB:Q94CE5
                              label: Gamma-aminobutyrate transaminase POP2, mitochondrial
                            description: >-
                              Arabidopsis POP2/GABA-T/At3g22200, mitochondrial.
                    function:
                      preferred_term: 4-aminobutyrate:pyruvate transaminase activity
                      term:
                        id: GO:0034387
                        label: 4-aminobutyrate:pyruvate transaminase activity
                      substrates:
                        - preferred_term: gamma-aminobutyric acid (GABA)
                        - preferred_term: pyruvate
                      products:
                        - preferred_term: succinate semialdehyde
                        - preferred_term: L-alanine
                    processes:
                      - preferred_term: GABA catabolic process
                        term:
                          id: GO:0009450
                          label: GABA catabolic process
                    locations:
                      - preferred_term: mitochondrial matrix
                        term:
                          id: GO:0005759
                          label: mitochondrial matrix
                    role_description: >-
                      Mitochondrial plant GABA transaminase that uses pyruvate or
                      glyoxylate, not 2-oxoglutarate. pop2 mutants accumulate GABA
                      in flowers and show defective pollen-tube guidance.
                    evidence:
                      - source_id: PMID:19264755
                        statement: Arabidopsis GABA-T uses pyruvate and glyoxylate, not 2-oxoglutarate.
                        supporting_text: >-
                          cannot utilize 2-oxoglutarate as amino
                          acceptor.
                      - source_id: PMID:12859897
                        statement: POP2 encodes the Arabidopsis GABA-degrading transaminase.
                        supporting_text: >-
                          Arabidopsis POP2 gene encodes a transaminase that degrades GABA
    - order: 3
      role: oxidation to succinate (feeds TCA cycle)
      node:
        id: aldh5a1_step
        label: succinate semialdehyde + NAD(P)+ to succinate + NAD(P)H
        module_type: REACTION
        annotons:
          - id: aldh5a1_activity
            label: "ALDH5A1/UGA2: succinate-semialdehyde dehydrogenase (SSADH)"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Succinate-semialdehyde dehydrogenase family (ALDH5A1/UGA2)
                family_terms:
                  - id: PANTHER:PTHR43353:SF5
                    label: SUCCINATE-SEMIALDEHYDE DEHYDROGENASE, MITOCHONDRIAL
                  - id: PANTHER:PTHR43353:SF12
                    label: SUCCINATE-SEMIALDEHYDE DEHYDROGENASE C139.05 [NADP(+)]-RELATED
                representative_members:
