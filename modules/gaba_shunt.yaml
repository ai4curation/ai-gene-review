                  - preferred_term: UGA2 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P38067
                      label: Succinate-semialdehyde dehydrogenase [NADP(+)]
                    description: >-
                      S. cerevisiae UGA2 (UGA5)/YBR006W; cytosolic, induced by
                      GABA and by H2O2 (PMID:11031268).
                  - preferred_term: ssd1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:Q9US47
                      label: Succinate-semialdehyde dehydrogenase [NADP(+)] 1
                    description: S. pombe ssd1/SPAC1002.12c.
                  - preferred_term: ssd2 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:Q9UTM8
                      label: Succinate-semialdehyde dehydrogenase [NADP(+)] 2
                    description: S. pombe ssd2/SPAC139.05.
                  - preferred_term: SSADH1/ALDH5F1 (Arabidopsis thaliana)
                    term:
                      id: UniProtKB:Q9SAK4
                      label: Succinate-semialdehyde dehydrogenase, mitochondrial
                    description: >-
                      Arabidopsis SSADH1/At1g79440; NAD+-specific, mitochondrial
                      matrix (PMID:10517851).
            function:
              preferred_term: succinate-semialdehyde dehydrogenase [NAD(P)+] activity
              term:
                id: GO:0009013
                label: succinate-semialdehyde dehydrogenase [NAD(P)+] activity
              substrates:
                - preferred_term: succinate semialdehyde
                - preferred_term: NAD+ or NADP+
              products:
                - preferred_term: succinate
                - preferred_term: NADH or NADPH
              evidence:
                - source_id: EC:1.2.1.24
                  statement: succinate-semialdehyde dehydrogenase (NAD+); human ALDH5A1 and plant SSADH1
                - source_id: EC:1.2.1.16
                  statement: succinate-semialdehyde dehydrogenase [NAD(P)+]; the EC number YeastCyc gives for UGA2
                - source_id: Reactome:R-HSA-888548
                  statement: "ALDH5A1 dehydrogenates SUCCSA to SUCCA (human Reactome reaction)"
            processes:
              - preferred_term: GABA catabolic process
                term:
                  id: GO:0009450
                  label: GABA catabolic process
            role_description: >-
              Oxidation of succinate semialdehyde to succinate, which enters the
              TCA cycle, completing the GABA shunt. The step is annotated with the
              cofactor-neutral term GO:0009013 because the animal and plant
              enzymes are NAD+-specific (GO:0004777, a child term) while the
              yeast enzymes are named NADP+-dependent. Human deficiency = SSADH
              deficiency (4-hydroxybutyric / GHB aciduria). The enzyme is in the
              mitochondrial matrix in animals and plants and in the cytosol in S.
              cerevisiae.
            gocam_associations:
              - model: gomodel:YeastPathways_GLUDEG-I-PWY-1
                activity: gomodel:RXN0-5293
                title: 'glutamate degradation I - imported from: Saccharomyces Genome Database'
                description: UGA2 enables GO:0009013 in cytosol.
              - model: gomodel:YeastPathways_YEAST-4AMINOBUTMETAB-PWY
                activity: gomodel:RXN0-5293
                title: '4-aminobutyrate degradation - imported from: Saccharomyces Genome Database'
                description: UGA2 enables GO:0009013 in cytosol.
              - model: gomodel:696022cd00001857
                activity: gomodel:696022cd00001857/696022cd00001878
                title: gamma-aminobutyric acid catabolic process (GO:0009450)
                description: >-
                  S. pombe ssd1 enables GO:0004777 (NAD+) in the mitochondrial
                  matrix, although UniProt names the protein NADP+-dependent.
              - model: gomodel:696022cd00001857
                activity: gomodel:696022cd00001857/696022cd00001894
                title: gamma-aminobutyric acid catabolic process (GO:0009450)
                description: S. pombe ssd2 enables GO:0004777 in the mitochondrial matrix.
            evidence:
              - source_id: PMID:10517851
                statement: Plant SSADH1 is NAD+-specific.
                supporting_text: >-
                  exclusively used NAD+ as a cofactor
  connections:
    - source: gad_step
      target: abat_step
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: >-
        The GABA made by glutamate decarboxylase is the transaminase substrate
