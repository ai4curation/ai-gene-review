knowledge_gaps:
  - gap_statement: >-
      The identity of the peptides exported by HAF-1, and the mechanism by
      which peptide export reduces the mitochondrial import of ATFS-1, are
      unknown.
    boundary: >-
      HAF-1 and ClpP are needed for peptide efflux from isolated mitochondria
      and for ATFS-1 nuclear accumulation, but no peptide species has been
      identified and no direct effect of peptides on the import machinery has
      been shown.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Links the sensing arm to the import checkpoint; without it the two
      upstream parts are connected only genetically.
    resolution: >-
      Peptidomics of material exported from wild-type versus haf-1 and clpp-1
      mitochondria under stress, and in vitro import assays testing whether
      those peptides reduce ATFS-1 import.
    provenance:
      - reference_id: PMID:20188671
        supporting_text: >-
          These observations suggest a simple model whereby perturbation of the
          protein-folding environment in the mitochondrial matrix promotes
          ClpP-mediated generation of peptides
  - gap_statement: >-
      HAF-1 peptide transport has not been reconstituted with purified
      protein, so whether HAF-1 transports peptides directly or is needed
      indirectly for efflux is unresolved.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Determines whether the ABC-type peptide transporter MF on HAF-1 is direct.
    resolution: >-
      Reconstitute HAF-1 in proteoliposomes and measure ATP-dependent peptide
      translocation; test Walker-A mutants in vivo.
    provenance:
      - reference_id: PMID:20188671
        supporting_text: >-
          Peptide efflux from isolated mitochondria was ATP dependent and
          required HAF-1 and the protease ClpP.
  - gap_statement: >-
      How nuclear ATFS-1 and the DVE-1/UBL-5 complex cooperate at UPRmt
      target promoters, and whether DVE-1 recruitment depends on ATFS-1, is not
      known.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      The two transcriptional arms are modeled in parallel; their
      hierarchy and physical relationship are undetermined.
    resolution: >-
      DVE-1 and ATFS-1 ChIP-seq in atfs-1 and dve-1 mutants under
      mitochondrial stress; co-immunoprecipitation of ATFS-1 with DVE-1/UBL-5.
    provenance:
      - reference_id: PMID:17925224
        supporting_text: >-
          Unfolded protein stress in the mitochondria correlates with complex
          formation between a homeodomain-containing transcription factor
          DVE-1 and the small ubiquitin-like protein UBL-5
  - gap_statement: >-
      The molecular activity of LIN-65 in supporting MET-2-dependent H3K9
      dimethylation during mitochondrial stress is unknown.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      LIN-65 is the only core chromatin-arm member without an assigned
      molecular function.
    resolution: >-
      Test whether LIN-65 is required for MET-2 nuclear import, stability or
      catalytic activity in vitro and in vivo.
    provenance:
      - reference_id: PMID:27133166
        supporting_text: >-
          the histone methyltransferase met-2 and the nuclear co-factor lin-65
