    - order: 5
      role: induced mitochondrial chaperone output
      node:
        id: chaperone_output
        label: HSP-6 and HSP-60 matrix chaperone output
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The mitochondrial HSP70 HSP-6 and the chaperonin HSP-60 are the
          best-characterized induced genes and the reporters used to define the
          pathway. Their induction raises matrix folding capacity.
        context:
          cellular_components:
            - preferred_term: mitochondrial matrix
              term:
                id: GO:0005759
                label: mitochondrial matrix
        annotons:
