id: MODULE:c_elegans_mitochondrial_upr
title: Mitochondrial unfolded protein response in Caenorhabditis elegans
description: >-
  The mitochondrial unfolded protein response (UPRmt) is a
  mitochondria-to-nucleus signaling pathway that raises the expression of
  nuclear genes encoding mitochondrial chaperones and proteases when protein
  folding in the mitochondrial matrix is disturbed. In Caenorhabditis elegans
  the pathway was defined by genetic screens with the hsp-6 (mtHSP70) and
  hsp-60 (HSP60) promoter reporters. Misfolded matrix proteins are degraded by
  the ClpP protease CLPP-1, and the resulting peptides leave the matrix through
  the inner-membrane ABC transporter HAF-1. The central transcription factor is
  the bZIP protein ATFS-1, which carries both an N-terminal mitochondrial
  targeting sequence and a nuclear localization signal. In healthy cells ATFS-1
  is imported into mitochondria and degraded; when mitochondrial import
  efficiency falls, part of the ATFS-1 pool stays in the cytosol, enters the
  nucleus and activates chaperone, protease, glycolysis and innate-immunity
  genes. ATFS-1 that does reach the matrix binds mitochondrial DNA and limits
  OXPHOS transcript accumulation. A chromatin arm acts alongside ATFS-1: the
  homeodomain protein DVE-1 and the ubiquitin-like protein UBL-5 form a complex
  that relocates to the nucleus and binds mitochondrial chaperone promoters,
  while the H3K9 methyltransferase MET-2 and its nuclear cofactor LIN-65 compact
  bulk chromatin and the H3K27 demethylase JMJD-3.1 is needed for full UPRmt
  induction. The induced matrix chaperones HSP-6 and HSP-60 are both the
  standard reporters and the protective output of the response.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:15280428
    title: Compartment-specific perturbation of protein handling activates genes encoding mitochondrial chaperones.
    statement: >-
      Defines the C. elegans UPRmt: hsp-6 and hsp-60 are selectively induced
      by perturbed mitochondrial protein handling, and not by heat shock or ER
      stress.
    supporting_text: >-
      hsp-6 and hsp-60 induction was specific to perturbed mitochondrial
      protein handling, as neither heat-shock nor endoplasmic reticulum stress
      nor manipulations that impair mitochondrial steps in intermediary
      metabolism or ATP synthesis activated the mitochondrial chaperone genes.
  - source_id: PMID:20188671
    title: The matrix peptide exporter HAF-1 signals a mitochondrial UPR by activating the transcription factor ZC376.7 in C. elegans.
    statement: >-
      Model of the sensing arm: ClpP generates peptides from misfolded matrix
      proteins, and their HAF-1-dependent export contributes to UPRmt
      signaling.
    supporting_text: >-
      perturbation of the protein-folding environment in the mitochondrial
      matrix promotes ClpP-mediated generation of peptides whose
      haf-1-dependent export from the matrix contributes to UPR(mt) signaling
      across the mitochondrial inner membrane.
  - source_id: PMID:22700657
    title: Mitochondrial import efficiency of ATFS-1 regulates mitochondrial UPR activation.
    statement: >-
      The key regulatory point is the mitochondrial import efficiency of
      ATFS-1.
    supporting_text: >-
      We found that the key point of regulation is the mitochondrial import
      efficiency of ATFS-1.
  - source_id: PMID:22719267
    title: Protective coupling of mitochondrial function and protein synthesis via the eIF2α kinase GCN-2.
    statement: >-
      A parallel GCN-2/eIF2alpha translational arm protects mitochondria
      during stress and is complementary to, not part of, HAF-1/ATFS-1
      chaperone induction.
    supporting_text: >-
      Our data demonstrate that GCN-2-dependent translational control acts in
      a mitochondrial protective signaling pathway complementary to the
      regulation of mitochondrial chaperone gene expression mediated by HAF-1
      and ATFS-1.
  - source_id: file:genes/worm/atfs-1/atfs-1-ai-review.yaml
    title: worm atfs-1 gene review
    statement: >-
      Core functions: RNA polymerase II-specific transcription activator in the
      nucleoplasm for the UPRmt and for defense against Gram-negative bacteria,
      and mitochondrial transcription factor activity in the matrix.
  - source_id: file:genes/worm/clpp-1/clpp-1-ai-review.yaml
    title: worm clpp-1 gene review
    statement: >-
      Core functions: ATP-dependent peptidase and serine-type endopeptidase
      activity in the mitochondrial matrix, acting in the UPRmt and misfolded
      protein quality control.
notes: >-
  Boundary. This concrete C. elegans module covers the ATFS-1-centred UPRmt:
  generation and export of the matrix stress signal (CLPP-1, HAF-1), the
  ATFS-1 import checkpoint, nuclear transcriptional activation by ATFS-1, the
  chromatin arm (DVE-1/UBL-5, LIN-65, MET-2, JMJD-3.1) and the induced matrix
  chaperones (HSP-6, HSP-60). It is modeled as five ordered parts.

  Left out. The GCN-2/eIF2alpha translational arm is activated by
  mitochondrial dysfunction but is complementary to and independent of
  ATFS-1 activation (PMID:22719267), so it belongs with the integrated stress
  response; the gcn-2 review lists it as a core UPRmt process, which is
  recorded here only as context. The neuronal and germline signals that
  switch on UPRmt in the intestine cell-non-autonomously (serotonin, the
  retromer-dependent Wnt EGL-20 signal, PMID:30057120) are upstream
  inter-tissue regulation and are not modeled. The H3K9me2 demethylase
  JMJD-1.2 acts with JMJD-3.1 (PMID:27133168) but has no review yet and is
  only named. The SUMO peptidase ULP-4 and the NuRD/HDA-1 regulators
  (PMID:30642431, PMID:32789178, PMID:32934238) are modulators, not core
  parts. The matrix LON protease that degrades imported ATFS-1 is not named in
  the cached abstracts and is not modeled. Downstream innate immunity and
  lifespan extension are outputs of the transcriptional program and are not
  included as module processes.

  ATFS-1 dual targeting. ATFS-1 appears in two parts, each with its own
  annoton, because it performs two activities in two compartments: in the
  matrix it binds mitochondrial DNA promoters (mitochondrial transcription
  factor activity) before degradation, and in the nucleus it activates RNA
  polymerase II transcription. The import-checkpoint part negatively
  regulates the nuclear part.

  UniProt. The atfs-1 review uses Q23272 (the reviewed entry for ZC376.7);
  this is used throughout. HAF-1 (O45278) has no gene review; its MF term
  rests on the mitochondrial peptide efflux assay of PMID:20188671.

  Related modules. ATFS-1-dependent transcription of mitophagy genes is
  treated in MODULE:c_elegans_mitophagy, the cytosolic heat shock response in
  MODULE:c_elegans_heat_shock_response and the ER UPR in
  MODULE:c_elegans_er_unfolded_protein_response.

  Comparison with the human UPRmt. In mammals ATF5 is the ATFS-1 functional
  counterpart and the OMA1-DELE1-HRI branch feeds eIF2alpha phosphorylation;
  neither the DELE1 branch nor a HAF-1 orthologue role is established in
  worms, so this module stays species-scoped.
module:
  id: c_elegans_mitochondrial_upr
  label: Mitochondrial unfolded protein response in C. elegans
  module_type: SIGNALING_PATHWAY
  description: >-
    Mitochondria-to-nucleus pathway in which matrix proteolysis, peptide
    export and reduced import of ATFS-1 lead to nuclear ATFS-1 and DVE-1/UBL-5
    activity on a remodelled chromatin template, inducing mitochondrial
    chaperone genes.
  concepts:
    - preferred_term: mitochondrial unfolded protein response
      term:
        id: GO:0034514
        label: mitochondrial unfolded protein response
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    conditions:
      - preferred_term: >-
          mitochondrial protein-folding stress (e.g. spg-7 or hsp-6 RNAi,
          mitochondrial respiratory chain defects, mtDNA depletion)
  parts:
    - order: 1
      role: matrix stress signal generation and export
      node:
        id: matrix_signal_generation
        label: CLPP-1 proteolysis and HAF-1 peptide export
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Misfolded matrix proteins are degraded by the CLPP-1 protease and the
          resulting peptides are exported across the inner membrane by HAF-1.
          Both are genetically required for nuclear accumulation of ATFS-1 and
          for induction of hsp-60 and hsp-6 reporters. Peptide efflux from
          isolated mitochondria is ATP-dependent and needs both HAF-1 and
          ClpP.
        context:
          cellular_components:
            - preferred_term: mitochondrial matrix
              term:
                id: GO:0005759
                label: mitochondrial matrix
        annotons:
          - id: clpp1_matrix_protease
            label: CLPP-1 matrix ATP-dependent protease
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CLPP-1
                term:
                  id: UniProtKB:Q27539
                  label: ATP-dependent Clp protease proteolytic subunit 1, mitochondrial
            function:
              preferred_term: ATP-dependent peptidase activity
              term:
                id: GO:0004176
                label: ATP-dependent peptidase activity
              description: >-
                Proteolytic chamber of the ClpXP protease, following the
                clpp-1 review core function. The ATPase partner (CLPX) is not
                modeled.
              substrates:
                - preferred_term: misfolded mitochondrial matrix proteins
              products:
                - preferred_term: peptides
            processes:
              - preferred_term: mitochondrial unfolded protein response
                term:
                  id: GO:0034514
                  label: mitochondrial unfolded protein response
              - preferred_term: protein quality control for misfolded or incompletely synthesized proteins
                term:
                  id: GO:0006515
                  label: protein quality control for misfolded or incompletely synthesized proteins
            locations:
              - preferred_term: mitochondrial matrix
                term:
                  id: GO:0005759
                  label: mitochondrial matrix
            role_description: >-
              Generates the peptide signal from misfolded matrix proteins.
              Reduced clpp-1 activity attenuates DVE-1 nuclear redistribution,
              promoter binding and the downstream UPRmt.
            evidence:
              - source_id: PMID:17925224
                title: ClpP mediates activation of a mitochondrial unfolded protein response in C. elegans.
                statement: >-
                  DVE-1 nuclear redistribution, promoter binding and the UPRmt
                  are attenuated when clpp-1 activity is reduced.
                supporting_text: >-
                  These events and the downstream UPR(mt) are attenuated in
                  animals with reduced activity of clpp-1, which encodes a
                  mitochondrial matrix protease homologous to bacterial ClpP.
          - id: haf1_peptide_exporter
            label: HAF-1 inner-membrane peptide exporter
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HAF-1
                term:
                  id: UniProtKB:O45278
                  label: HAlF transporter (PGP related)
            function:
              preferred_term: ABC-type peptide transporter activity
              term:
                id: GO:0015440
                label: ABC-type peptide transporter activity
              description: >-
                Inferred from ATP-dependent, HAF-1-dependent peptide efflux
                from isolated mitochondria; transport by purified HAF-1 has not
                been reconstituted.
              substrates:
                - preferred_term: CLPP-1-generated matrix peptides
            processes:
              - preferred_term: mitochondrial unfolded protein response
                term:
                  id: GO:0034514
                  label: mitochondrial unfolded protein response
            locations:
              - preferred_term: mitochondrial inner membrane
                term:
                  id: GO:0005743
                  label: mitochondrial inner membrane
            role_description: >-
              Mitochondria-localized ABC protein required for UPRmt signaling
              and for nuclear localization of ATFS-1 under mitochondrial
              stress.
            evidence:
              - source_id: PMID:20188671
                title: The matrix peptide exporter HAF-1 signals a mitochondrial UPR by activating the transcription factor ZC376.7 in C. elegans.
                statement: Peptide efflux from isolated mitochondria needs ATP, HAF-1 and ClpP.
                supporting_text: >-
                  Peptide efflux from isolated mitochondria was ATP dependent
                  and required HAF-1 and the protease ClpP.
              - source_id: PMID:20188671
                title: The matrix peptide exporter HAF-1 signals a mitochondrial UPR by activating the transcription factor ZC376.7 in C. elegans.
                statement: haf-1 deletion blocks nuclear localization of ATFS-1 (ZC376.7) under stress.
                supporting_text: >-
                  Defective UPR(mt) signaling in the haf-1-deleted worms was
                  associated with failure of the bZIP protein, ZC376.7, to
                  localize to nuclei in worms with perturbed mitochondrial
                  protein folding
              - source_id: PMID:22719267
                title: Protective coupling of mitochondrial function and protein synthesis via the eIF2α kinase GCN-2.
                statement: HAF-1 is localized to the mitochondrial inner membrane.
                supporting_text: >-
                  the mitochondrial inner membrane-localized peptide
                  transporter HAF-1
        connections:
          - source: clpp1_matrix_protease
            target: haf1_peptide_exporter
            connection_type: PROVIDES_INPUT_FOR
            description: CLPP-1-generated peptides are the proposed HAF-1 export cargo.
    - order: 2
      role: ATFS-1 mitochondrial import checkpoint
      node:
        id: atfs1_import_checkpoint
        label: ATFS-1 mitochondrial import and matrix activity
        module_type: REGULATORY_STEP
        description: >-
          ATFS-1 has an N-terminal mitochondrial targeting sequence that is
          essential for UPRmt repression. In unstressed cells ATFS-1 is
          efficiently imported into mitochondria and degraded, so it does not
          reach the nucleus. The import efficiency of ATFS-1 thus reports the
          capacity of mitochondrial protein import. Imported ATFS-1 also binds
          OXPHOS gene promoters in mitochondrial DNA and limits OXPHOS
          transcript accumulation during stress.
        annotons:
          - id: atfs1_matrix
            label: ATFS-1 in the mitochondrial matrix
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ATFS-1
                term:
                  id: UniProtKB:Q23272
                  label: Stress activated transcription factor atfs-1
            function:
              preferred_term: mitochondrial transcription factor activity
              term:
                id: GO:0034246
                label: mitochondrial transcription factor activity
              targets:
                - preferred_term: mtDNA OXPHOS gene promoters
            processes:
              - preferred_term: mitochondrial transcription
                term:
                  id: GO:0006390
                  label: mitochondrial transcription
            locations:
              - preferred_term: mitochondrial matrix
                term:
                  id: GO:0005759
                  label: mitochondrial matrix
            role_description: >-
              Import of ATFS-1 into the matrix, followed by its degradation,
              keeps the nuclear response off. The matrix pool binds mtDNA and
              tunes OXPHOS transcript levels.
            evidence:
              - source_id: PMID:22700657
                title: Mitochondrial import efficiency of ATFS-1 regulates mitochondrial UPR activation.
                statement: >-
                  ATFS-1 has an MTS and an NLS; the MTS is essential for UPRmt
                  repression.
                supporting_text: >-
                  In addition to a nuclear localization sequence, ATFS-1 has an
                  N-terminal mitochondrial targeting sequence that is essential
                  for UPR(mt) repression. Normally, ATFS-1 is imported into
                  mitochondria and degraded.
              - source_id: PMID:25773600
                title: Mitochondrial and nuclear accumulation of the transcription factor ATFS-1 promotes OXPHOS recovery during the UPR(mt).
                statement: ATFS-1 binds OXPHOS gene promoters in both nuclear and mitochondrial genomes.
                supporting_text: >-
                  ATFS-1 bound directly to OXPHOS gene promoters in both the
                  nuclear and mitochondrial genomes.
    - order: 3
      role: nuclear transcriptional activation by ATFS-1
      node:
        id: atfs1_nuclear_activation
        label: Nuclear ATFS-1 transcriptional activation
        module_type: MOLECULAR_FUNCTION
        description: >-
          When import efficiency falls during mitochondrial stress, a fraction
          of ATFS-1 stays in the cytosol and enters the nucleus through its
          NLS, where it activates genes for mitochondrial chaperones, OXPHOS
          assembly factors, glycolysis and innate immunity.
        annotons:
          - id: atfs1_nuclear
            label: ATFS-1 nuclear transcriptional activator
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ATFS-1
                term:
                  id: UniProtKB:Q23272
                  label: Stress activated transcription factor atfs-1
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
              targets:
                - preferred_term: hsp-6, hsp-60 and other mitochondrial protective gene promoters
            processes:
              - preferred_term: mitochondrial unfolded protein response
                term:
                  id: GO:0034514
                  label: mitochondrial unfolded protein response
            locations:
              - preferred_term: nucleoplasm
                term:
                  id: GO:0005654
                  label: nucleoplasm
            role_description: >-
              The transcription factor that executes the UPRmt in the nucleus.
            evidence:
              - source_id: PMID:22700657
                title: Mitochondrial import efficiency of ATFS-1 regulates mitochondrial UPR activation.
                statement: Reduced import during stress lets ATFS-1 accumulate in the cytosol and reach the nucleus.
                supporting_text: >-
                  during mitochondrial stress, we found that import efficiency
                  was reduced, allowing a percentage of ATFS-1 to accumulate in
                  the cytosol and traffic to the nucleus.
              - source_id: PMID:25274306
                title: Mitochondrial UPR-regulated innate immunity provides resistance to pathogen infection.
                statement: Nuclear trafficking of ATFS-1 depends on its NLS and activates a protective transcriptional response.
                supporting_text: >-
                  Because ATFS-1 has a nuclear localization sequence (NLS), it
                  then traffics to the nucleus where it activates a protective
                  transcriptional response
              - source_id: PMID:25773600
                title: Mitochondrial and nuclear accumulation of the transcription factor ATFS-1 promotes OXPHOS recovery during the UPR(mt).
                statement: ATFS-1 ChIP-seq targets include chaperone, OXPHOS assembly factor and glycolysis genes.
                supporting_text: >-
                  in addition to regulating mitochondrial chaperone, OXPHOS
                  complex assembly factor, and glycolysis genes
    - order: 4
      role: chromatin arm that makes UPRmt target genes accessible
      node:
        id: chromatin_arm
        label: DVE-1/UBL-5 and chromatin reorganization
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Mitochondrial stress causes DVE-1 and UBL-5 to form a complex and
          accumulate in nuclei, where DVE-1 binds mitochondrial chaperone
          promoters. In parallel, MET-2 with its nuclear cofactor LIN-65
          deposits H3K9me2 and compacts most of the genome, while the regions
          that stay open are bound by DVE-1. The H3K27 demethylase JMJD-3.1 is
          needed for full UPRmt induction and for mitochondrial stress-induced
          longevity.
        context:
          cellular_components:
            - preferred_term: nucleus
              term:
                id: GO:0005634
                label: nucleus
        annotons:
          - id: dve1_activator
            label: DVE-1 homeodomain transcription factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DVE-1
                term:
                  id: UniProtKB:Q86MI0
                  label: Homeobox protein dve-1
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
              targets:
                - preferred_term: hsp-60 and other mitochondrial chaperone gene promoters
            processes:
              - preferred_term: mitochondrial unfolded protein response
                term:
                  id: GO:0034514
                  label: mitochondrial unfolded protein response
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              SATB-like homeodomain factor whose nuclear redistribution and
              enhanced binding to chaperone promoters accompany UPRmt
              activation; it binds the chromatin regions left open after
              MET-2/LIN-65-dependent compaction.
            evidence:
              - source_id: PMID:17925224
                title: ClpP mediates activation of a mitochondrial unfolded protein response in C. elegans.
                statement: >-
                  UPRmt activation correlates with DVE-1 nuclear
                  redistribution and enhanced binding to mitochondrial
                  chaperone promoters.
                supporting_text: >-
                  Activation of the UPR(mt) correlates temporally and spatially
                  with nuclear redistribution of DVE-1 and with its enhanced
                  binding to the promoters of mitochondrial chaperone genes.
          - id: ubl5_coactivator
            label: UBL-5 DVE-1-associated coactivator
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: UBL-5
                term:
                  id: UniProtKB:P91302
                  label: Ubiquitin-like protein 5
            function:
              preferred_term: transcription coactivator activity
              term:
                id: GO:0003713
                label: transcription coactivator activity
            processes:
              - preferred_term: mitochondrial unfolded protein response
                term:
                  id: GO:0034514
                  label: mitochondrial unfolded protein response
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Ubiquitin-like protein that complexes with DVE-1 under
              mitochondrial stress and accumulates in nuclei. It is not a
              conjugated modifier (it lacks the C-terminal di-glycine).
            evidence:
              - source_id: PMID:17925224
                title: ClpP mediates activation of a mitochondrial unfolded protein response in C. elegans.
                statement: Mitochondrial unfolded protein stress correlates with DVE-1-UBL-5 complex formation.
                supporting_text: >-
                  Unfolded protein stress in the mitochondria correlates with
                  complex formation between a homeodomain-containing
                  transcription factor DVE-1 and the small ubiquitin-like
                  protein UBL-5
              - source_id: PMID:16816413
                title: Ubiquitin-like protein 5 positively regulates chaperone gene expression in the mitochondrial unfolded protein response.
                statement: UBL-5 accumulates in nuclei under mitochondrial stress and acts in a nuclear step of the UPRmt.
                supporting_text: >-
                  Induction of mitochondrial stress promotes accumulation of
                  GFP-tagged UBL-5 in nuclei of transgenic worms, suggesting
                  that UBL-5 effects a nuclear step required for mounting a
                  response to the threat of mitochondrial protein misfolding.
          - id: met2_h3k9_methyltransferase
            label: MET-2 H3K9 dimethyltransferase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MET-2
                term:
                  id: UniProtKB:P34544
                  label: Histone-lysine N-methyltransferase met-2
            function:
              preferred_term: histone H3K9 dimethyltransferase activity
              term:
                id: GO:0140942
                label: histone H3K9 dimethyltransferase activity
            processes:
              - preferred_term: mitochondrial unfolded protein response
                term:
                  id: GO:0034514
                  label: mitochondrial unfolded protein response
              - preferred_term: heterochromatin formation
                term:
                  id: GO:0031507
                  label: heterochromatin formation
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              SETDB1-family methyltransferase whose H3K9 dimethylation is
              required for UPRmt activation; it silences bulk chromatin while
              selected loci open for DVE-1.
            evidence:
              - source_id: PMID:27133166
                title: Mitochondrial Stress Induces Chromatin Reorganization to Promote Longevity and UPR(mt).
                statement: UPRmt activation requires H3K9 dimethylation by MET-2 and the nuclear cofactor LIN-65.
                supporting_text: >-
                  Mitochondrial stress response activation requires the
                  di-methylation of histone H3K9 through the activity of the
                  histone methyltransferase met-2 and the nuclear co-factor
                  lin-65.
          - id: lin65_cofactor
            label: LIN-65 nuclear cofactor of MET-2
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LIN-65
                term:
                  id: UniProtKB:Q95XN0
                  label: LIN-65L
            processes:
              - preferred_term: mitochondrial unfolded protein response
                term:
                  id: GO:0034514
                  label: mitochondrial unfolded protein response
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Nuclear cofactor required with MET-2 for stress-induced H3K9
              dimethylation and UPRmt. No molecular function is asserted, in
              line with the lin-65 review: how LIN-65 supports MET-2 activity
              is not known.
            evidence:
              - source_id: PMID:27133166
                title: Mitochondrial Stress Induces Chromatin Reorganization to Promote Longevity and UPR(mt).
                statement: >-
                  Remaining open chromatin is bound by DVE-1 after global
                  silencing.
                supporting_text: >-
                  While globally the chromatin becomes silenced by these marks,
                  remaining portions of the chromatin open up, at which point
                  the binding of canonical stress responsive factors such as
                  DVE-1 occurs.
          - id: jmjd31_demethylase
            label: JMJD-3.1 H3K27 demethylase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: JMJD-3.1
                term:
                  id: UniProtKB:Q95QK3
                  label: Lysine-specific demethylase jmjd-3.1
            function:
              preferred_term: histone H3K27me2/H3K27me3 demethylase activity
              term:
                id: GO:0071558
                label: histone H3K27me2/H3K27me3 demethylase activity
            processes:
              - preferred_term: mitochondrial unfolded protein response
                term:
                  id: GO:0034514
                  label: mitochondrial unfolded protein response
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              JMJD3-family demethylase that, with JMJD-1.2, positively
              regulates UPRmt induction and mitochondrial stress-induced
              longevity.
            evidence:
              - source_id: PMID:27133168
                title: Two Conserved Histone Demethylases Regulate Mitochondrial Stress-Induced Longevity.
                statement: Loss of jmjd-1.2 or jmjd-3.1 suppresses UPRmt induction and longevity.
                supporting_text: >-
                  Reduction of function of the demethylases potently suppresses
                  longevity and UPR(mt) induction, while gain of function is
                  sufficient to extend lifespan in a UPR(mt)-dependent manner.
        connections:
          - source: met2_h3k9_methyltransferase
            target: dve1_activator
            connection_type: POSITIVELY_REGULATES
            description: >-
              MET-2/LIN-65-dependent chromatin compaction leaves selected
