                  Mammalian interaction mapping divides IFT-B into core and
                  peripheral subcomplexes; the DYF-3 ortholog Cluap1/IFT38 is a
                  peripheral subunit.
                supporting_text: >-
                  we determined the overall architecture of the IFT-B complex,
                  which can be divided into core and peripheral subcomplexes
