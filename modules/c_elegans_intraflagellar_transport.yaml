      term:
        id: GO:0042073
        label: intraciliary transport
      description: >-
        Module-level process. The anterograde and retrograde branches are
        placed on the motor parts.
    - preferred_term: non-motile cilium assembly
      term:
        id: GO:1905515
        label: non-motile cilium assembly
      description: >-
        The outcome that IFT serves in worm sensory neurons; IFT mutants have
        truncated sensory cilia.
