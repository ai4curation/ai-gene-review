id: MODULE:c_elegans_intraflagellar_transport
title: Intraflagellar transport in Caenorhabditis elegans sensory cilia
description: >-
  Intraflagellar transport (IFT) is the bidirectional, motor-driven movement of
  large protein trains along the ciliary axoneme that builds and maintains
  cilia. In Caenorhabditis elegans it operates in the non-motile sensory cilia
  of about 60 ciliated neurons, chiefly the amphid and phasmid chemosensory
  neurons. IFT trains are built from two multisubunit complexes: IFT-B
  (OSM-5/IFT88, OSM-6/IFT52, CHE-13/IFT57, CHE-2/IFT80, DYF-1/IFT70,
  DYF-3/IFT38, DYF-6/IFT46, DYF-11/IFT54 and DYF-13/IFT56) and IFT-A
  (CHE-11/IFT140, DAF-10/IFT122 and DYF-2/IFT144). Two kinesin-2 motors drive
  anterograde transport. Heterotrimeric kinesin-II (KLP-11, KLP-20 and the
  non-motor subunit KAP-1) imports trains through the ciliary base and
  transition zone and moves them along the doublet microtubules of the middle
  segment. The homodimeric kinesin-2 OSM-3 takes over in a handover zone on the
  proximal axoneme and is the only motor that moves trains along the singlet
  microtubules of the distal segment to the ciliary tip. The IFT-B subunit
  DYF-1 is required for OSM-3 to dock onto and move IFT particles. At the tip
  trains turn around and are returned to the base by IFT-dynein (cytoplasmic
  dynein-2), whose heavy chain is CHE-3 and light intermediate chain XBX-1. The
  ciliary MAK/RCK-family kinase DYF-5 regulates motor docking and undocking and
  phosphorylates the tubulin-binding module of IFT-74, promoting tubulin
  unloading and limiting cilium length. The BBSome couples IFT-A and IFT-B and
  regulates IFT assembly at the base and turnaround at the tip. Loss of IFT-B,
  IFT-A, kinesin-2 or dynein-2 function causes truncated or malformed sensory
  cilia, failure to take up lipophilic dyes and chemosensory defects.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:15489852
    title: Two anterograde intraflagellar transport motors cooperate to build sensory cilia on C. elegans neurons.
    statement: >-
      Kinesin-II and OSM-3 kinesin act redundantly along the middle-segment
      doublets, and OSM-3 alone builds the distal segment, creating two
      sequential anterograde pathways.
    supporting_text: >-
      the two motors function redundantly to transport IFT particles along
      doublet microtubules adjacent to the transition zone to form the axoneme
      middle segment. Next, Osm-3-kinesin alone transports IFT particles along
      the distal singlet microtubules to stabilize the distal segment.
  - source_id: PMID:17314406
    title: 'Sensory ciliogenesis in Caenorhabditis elegans: assignment of IFT components into distinct modules based on transport and phenotypic profiles.'
    statement: >-
      Transport and phenotypic profiling divides the worm IFT machinery into
      IFT-A, IFT-B, BBS, motor and cargo modules.
    supporting_text: >-
      the C. elegans IFT machinery has a modular design, consisting of modules
      IFT-subcomplex A, IFT-subcomplex B, and a BBS protein complex, in addition
      to motor and cargo modules
  - source_id: PMID:11301258
    title: An autosomal recessive polycystic kidney disease gene homolog is involved in intraflagellar transport in C. elegans ciliated sensory neurons.
    statement: >-
      IFT-B (OSM-5) and IFT-A (DAF-10, CHE-11) polypeptides and CHE-2 move at
      the same rate in worm sensory cilia.
    supporting_text: >-
      We demonstrate that OSM-5 (a Complex B polypeptide), DAF-10 and CHE-11
      (two Complex A polypeptides), and CHE-2 [10], a previously uncategorized
      IFT polypeptide, all move at the same rate in C. elegans sensory cilia.
  - source_id: file:modules/bbsome.yaml
    title: BBSome ciliary trafficking complex module
    statement: >-
      The BBSome, which acts as an IFT adaptor that couples IFT-A and IFT-B and
      regulates IFT turnaround, is modelled in its own module and is referenced
      here as an interface rather than duplicated.
  - source_id: file:projects/CAEEL_CILIOPATHY.md
    title: C. elegans Ciliopathy/IFT Pathway Project
    statement: >-
      Project page listing the worm IFT-B, IFT-A, kinesin-2 and dynein-2 genes
      whose gene reviews ground the members of this module.
notes: >-
  Boundary. This is a concrete C. elegans module for the IFT machine itself:
  the IFT-B and IFT-A train complexes, the two anterograde kinesin-2 motors
  with their middle/distal segment division of labour, the retrograde
  IFT-dynein, and the DYF-5 kinase that regulates motor behaviour. The
  ciliary transition zone (MODULE:c_elegans_ciliary_transition_zone) is a
  separate module; IFT trains pass through it, and IFT and transition-zone
  proteins act at different steps of ciliogenesis. The DAF-19 RFX
  transcription factor that drives expression of most of these genes is
  regulatory context, not a part.

  Relation to MODULE:bbsome. The BBSome is modelled separately. In worms
  BBS-7 and BBS-8 hold IFT-A and IFT-B together so that both motors move the
  same train (in bbs-7/bbs-8 mutants IFT-A is moved by kinesin-II and IFT-B
  by OSM-3 separately; PMID:16049494), and the BBSome binds anterograde
  trains in a DYF-2- and BBS-1-dependent manner and is needed for turnaround
  at the tip (PMID:22922713). Those interactions are recorded as an interface
  in the IFT-A part and the turnaround connection, not as BBSome membership.

  Members. All members with a UniProt accession have a completed gene review
  under genes/worm/. Molecular functions follow those reviews' core
  functions. Where a review asserts no MF (CHE-2, DYF-3, DYF-6), only a
  preferred_term is given. KAP-1, the non-motor kinesin-II subunit, has no
  gene review and two unreviewed UniProt entries (H2KZP1, G5EEE6) for the same
  gene, so it is named in text without an accession. Further worm IFT
  subunits without gene reviews (OSM-1/IFT172, IFT-20, IFT-74, IFT-81,
  IFT-139, IFT-43, IFTA-1) are not modelled as members. The IFT-74/81 tubulin
  module is mentioned only as the DYF-5 substrate.

  Ciliary segments. Worm amphid channel cilia have a transition zone, a
  middle segment of doublet microtubules and a distal segment of singlet
  microtubules. Segment-level anatomy is described in prose because GO has
  no terms for ciliary middle or distal segments.
