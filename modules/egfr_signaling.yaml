id: MODULE:egfr_signaling
title: EGFR signaling pathway module
description: >-
  Bilaterian EGFR signaling couples an EGF-family ligand to an EGFR/ERBB-family
  receptor tyrosine kinase, creates phosphotyrosine docking sites for GRB2/drk/Sem-5
  adaptors and SOS Ras GEFs, and routes the signal through Ras-RAF-MEK-ERK. The
  conserved invertebrate and vertebrate core is represented with fly and worm
  variants, while vertebrate ERBB heterodimer and PI3K branches are kept as optional
  extensions.
status: DRAFT
evidence:
  - source_id: file:modules/egfr_signaling-deep-research-falcon.md
    title: EGFR signaling pathway Falcon module review
    statement: >-
      Falcon/Edison module review generated 2026-06-28 is linked as supporting
      evidence for module boundaries, conserved Bilaterian deployment, core
      mechanism, variation, constraints, and failure modes; open questions in
      that report require manual review before promotion to curated knowledge gaps.
  - source_id: GO:0007173
    title: epidermal growth factor receptor signaling pathway
    statement: >-
      The module is grounded in the GO biological process term for epidermal
      growth factor receptor signaling pathway.
  - source_id: gomodel:67c10cc400009089
    title: EGF signaling pathway (Human)
    statement: >-
      Human production GO-CAM grounding for EGF, EGFR, GRB2, and SOS1 in a
      direct EGF-to-EGFR-to-GRB2/SOS pathway.
  - source_id: gomodel:60ad85f700001873
    title: epidermal growth factor receptor signaling pathway via spi-Egfr (D.mel)
    statement: >-
      Drosophila production GO-CAM grounding for the conserved Spi/Egfr/drk/Sos/
      Ras85D/Raf/Dsor1/rolled route to Ras-MAPK output.
  - source_id: PANTHER:PTN000698827
    title: PAINT node PTN000698827 for EGFR-family signaling
    statement: >-
      Local PAINT IBD node in PTHR24416 with Bilaterian seeds including
      human EGFR, Drosophila Egfr, and C. elegans let-23 for P:GO:0007173
      and related EGFR pathway terms; PAINT date 20260828.
  - source_id: PANTHER:PTN001230349
    title: PAINT node PTN001230349 for receptor tyrosine kinase activity
    statement: >-
      Local PAINT IBD node in PTHR24416 with propagated terms including
      F:GO:0004714 and P:GO:0007169 for metazoan receptor tyrosine kinases;
      PAINT date 20260828.
  - source_id: PANTHER:PTN005273574
    title: PAINT node PTN005273574 for GRB2/drk/Sem-5 adaptors
    statement: >-
      Local PAINT IBD node in PTHR46037 with human GRB2, Drosophila drk, and
      C. elegans sem-5 seed support for plasma-membrane recruitment, phosphotyrosine
      binding, EGFR binding, and signal transduction terms; PAINT date 20260530.
  - source_id: PANTHER:PTN008302071
    title: PAINT node PTN008302071 for PIK3R1
    statement: >-
      Local PAINT IBD node in PTHR10155 with propagated terms for the
      phosphatidylinositol 3-kinase complex; PAINT date 20240516.
notes: >-
  The module is intentionally centered on the conserved Bilaterian EGFR ->
  GRB2/SOS -> Ras/MAPK path. Human EGF/EGFR, Drosophila Spi/Egfr, and
  C. elegans LIN-3/LET-23 are alternative receptor-layer realizations, whereas
  the SH2/SH3 adaptor, Ras GEF, Ras, RAF, MEK, and ERK tiers are represented
  as broad families with human, fly, and worm exemplars. Vertebrate ERBB2/PI3K
  signaling remains optional because ERBB heterodimerization and strong PI3K
  recruitment are vertebrate-specific elaborations rather than requirements for
  fly or worm EGFR signaling. The Ras/MAPK tier is the same biological sidecar
  detailed in MODULE:erk_cascade.
