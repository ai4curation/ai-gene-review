id: MODULE:dmel_mon1_ccz1_complex
title: Mon1-Ccz1 Rab7 exchange factor complex in Drosophila melanogaster
description: >-
  The Mon1-Ccz1 complex is the guanine nucleotide exchange factor for Rab7. Recruited to endosomes
  by Rab5 and phosphoinositides, it activates Rab7 and thereby drives Rab5-to-Rab7 conversion
  during endosome maturation, and it also acts on autophagosomes. Active Rab7 recruits the
  HOPS tethering complex for fusion with lysosomes. In metazoans the complex contains a third
  subunit, RMC1, whose Drosophila ortholog is Bulli; it is needed for full activity of the
  complex in vivo.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000153
  title: 'FlyBase gene group MCC: Mon1-ccz1 complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as mon1-ccz1 complex (MCC); this
    module models that group.
- source_id: GO:0035658
  title: Mon1-Ccz1 complex
  statement: >-
    GO term grounding the module as Mon1-Ccz1 complex.
notes: >-
  Decomposition. Mon1 and Ccz1 form the catalytic heterodimer; Bulli (RMC1) is modelled as
  a separate accessory part because its precise contribution to activity and membrane targeting
  in vivo is less defined. FlyBase groups realized by this module: MCC (FBgg0000153). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_mon1_ccz1_complex.yaml; none of the member genes has a gene review
  yet unless noted.
