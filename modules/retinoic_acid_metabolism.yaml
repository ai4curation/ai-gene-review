              statement: ALDH1A1 is a known retinaldehyde-to-RA enzyme that also oxidises 3-deoxyglucosone.
              supporting_text: aldehyde dehydrogenase 1A1 (ALDH1A1), an enzyme known to catalyze the oxidation
                of retinaldehyde to retinoic acid.
        - id: aldh1a3_variant
          label: ALDH1A3 (RALDH3)
          module_type: REACTION
          annotons:
          - id: aldh1a3_retinal_dehydrogenase
            label: ALDH1A3 retinal dehydrogenase (NAD+)
            participant:
