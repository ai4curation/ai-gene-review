              gene_product:
                preferred_term: ALDH1A2 (RALDH2)
                term:
                  id: UniProtKB:O94788
                  label: Retinal dehydrogenase 2
            function:
              preferred_term: retinal dehydrogenase (NAD+) activity
              term:
                id: GO:0001758
                label: retinal dehydrogenase (NAD+) activity
              substrates:
              - preferred_term: all-trans-retinal
                term:
                  id: CHEBI:17898
                  label: all-trans-retinal
              - preferred_term: NAD+
                term:
                  id: CHEBI:57540
                  label: NAD(1-)
              products:
              - preferred_term: all-trans-retinoate
                term:
                  id: CHEBI:35291
                  label: all-trans-retinoate
              - preferred_term: NADH
                term:
                  id: CHEBI:57945
                  label: NADH(2-)
            processes:
            - preferred_term: retinoic acid biosynthetic process
              term:
                id: GO:0002138
                label: retinoic acid biosynthetic process
            locations:
            - preferred_term: cytosol
              term:
                id: GO:0005829
                label: cytosol
            role_description: >-
              The dominant embryonic and spermatogenic atRA-synthesising enzyme. GO:0001758 is its
              experimental GOA function (IDA, PMID:29240402).
            evidence:
            - source_id: PMID:29240402
              statement: ALDH1A2 is the primary RA-synthesising enzyme in mammalian spermatogenesis.
              supporting_text: ALDH1A2 is the primary RA-synthesizing enzyme in mammalian spermatogenesis
                and is therefore considered a viable drug target for male contraceptive development.
        - id: aldh1a1_variant
          label: ALDH1A1 (RALDH1)
          module_type: REACTION
          annotons:
          - id: aldh1a1_retinal_dehydrogenase
            label: ALDH1A1 retinal dehydrogenase (NAD+)
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ALDH1A1 (RALDH1)
                term:
                  id: UniProtKB:P00352
                  label: Aldehyde dehydrogenase 1A1
            function:
              preferred_term: retinal dehydrogenase (NAD+) activity
              term:
                id: GO:0001758
                label: retinal dehydrogenase (NAD+) activity
              substrates:
              - preferred_term: all-trans-retinal
                term:
                  id: CHEBI:17898
                  label: all-trans-retinal
              - preferred_term: NAD+
                term:
                  id: CHEBI:57540
                  label: NAD(1-)
              products:
              - preferred_term: all-trans-retinoate
                term:
                  id: CHEBI:35291
                  label: all-trans-retinoate
              - preferred_term: NADH
                term:
                  id: CHEBI:57945
                  label: NADH(2-)
            locations:
            - preferred_term: cytosol
              term:
                id: GO:0005829
                label: cytosol
            role_description: >-
              Broad-specificity cytosolic aldehyde dehydrogenase, abundant in liver, that oxidises
              retinal to atRA. Its experimental GOA functions are the generic aldehyde dehydrogenase (NAD+)
