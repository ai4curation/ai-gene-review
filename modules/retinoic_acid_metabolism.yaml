id: MODULE:retinoic_acid_metabolism
title: All-trans-retinoic acid metabolism — RBP4/STRA6 retinol delivery, CRBP1 binding, RDH10/DHRS3 retinol-retinal
  interconversion, ALDH1A1-3 retinal oxidation, CRABP1/2 binding and CYP26A1/B1/C1 catabolism
description: >-
  All-trans-retinoic acid (atRA), the most potent vitamin A metabolite, is made on demand inside
  target cells from circulating retinol and is cleared by oxidative catabolism, so that its tissue
  level is set by the balance of local synthesis and local destruction. Retinol travels in plasma
  bound to retinol-binding protein 4 (RBP4), which circulates as a complex with the transthyretin
  (TTR) tetramer. The multi-pass membrane receptor STRA6 binds holo-RBP4 and moves retinol into the
  cell, where it is bound by cellular retinol-binding protein 1 (CRBP1, RBP1). The first and
  rate-limiting step of synthesis is the reversible, membrane-associated oxidation of all-trans-retinol
  to all-trans-retinal by the short-chain dehydrogenase/reductase RDH10. RDH10 works together with
  the retinaldehyde reductase DHRS3: the two proteins activate each other, and DHRS3 reduces
  retinal back to retinol, so the pair sets the flux of retinal toward acid. Cytosolic medium-chain
  alcohol dehydrogenases can also oxidise retinol. The second step, the oxidation of retinal to atRA,
  is irreversible and is catalysed by the NAD+-dependent retinaldehyde dehydrogenases ALDH1A1,
  ALDH1A2 and ALDH1A3, whose distinct tissue patterns define where atRA is produced in the embryo.
  Cellular retinoic acid-binding proteins bind atRA in the cytosol: CRABP2 delivers it to the
  nuclear retinoic acid receptors, and CRABP1 sequesters it and favours its catabolism. atRA is
  inactivated by the cytochrome P450 retinoic acid hydroxylases CYP26A1, CYP26B1 and CYP26C1, which
  form 4-hydroxy-, 4-oxo- and 18-hydroxy-atRA in the endoplasmic reticulum; CYP26A1 and DHRS3 are
  induced by atRA, giving negative feedback on its own level. Retinol not used for synthesis can be
  stored as retinyl esters, made by LRAT and hydrolysed back to retinol by retinyl ester hydrolases
  such as the carboxylesterase CES1. Loss of RDH10 or ALDH1A2 in mouse abolishes embryonic atRA
  synthesis, CYP26B1 deficiency causes craniosynostosis and skeletal anomalies, and STRA6 and RBP4
  defects cause microphthalmia and coloboma.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PW:0001004
  title: retinoic acid metabolic pathway
  statement: >-
    The module boundary follows the RGD Pathway Ontology record and diagram for this term. The diagram
    draws circulating retinol associated with Rbp4 and Ttr, Rbp4 associated with Stra6, cellular retinol
    bound to Rbp1 and reversibly converted to retinal, retinal irreversibly converted to all-trans retinoic
    acid, atRA associated with Crabp1, Crabp2 and Fabp5 and feeding the atRA CYPs and the retinoic acid
    signaling pathway (PW:0001014), and retinol exchanged with the retinyl ester pool (Lrat, CES1, apo-Rbp1).
    The RGD human gene set is ALDH1A1, ALDH1A2, ALDH1A3, CES1, CRABP1, CRABP2, CYP26A1, CYP26B1, CYP26C1,
    DHRS9, FABP5, LRAT, RBP1, RBP4, RDH10, RDH16, STRA6 and TTR. Derived through projects/RGD_PATHWAY_ONTOLOGY
    (pathways/PW_0001004.yaml).
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001004.yaml
  title: RGD PW:0001004 record text (project snapshot)
  statement: >-
    The RGD record places the reversible retinol-retinal step before the irreversible retinal dehydrogenase
    step that commits retinal to atRA.
  supporting_text: In other cells, retinal is the substrate for retinal dehydrogenases that irreversible
    convert it to all-trans retinoic acid (atRA) and other derivatives with atRA being the most potent molecule.
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001004.yaml
  title: RGD PW:0001004 record text (project snapshot)
  statement: >-
    The RGD record assigns CRABP2 to delivery of atRA to the RARs and CRABP1 to atRA catabolism.
  supporting_text: Crabp1 on the other hand, relates to the processing and catabolism of retinoic acid.
- source_id: GO:0042573
  title: retinoic acid metabolic process
  statement: >-
    The skos:closeMatch GO mapping of PW:0001004 (RGD page GO xref, PW definition xref and lexical match;
    projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). Used as the module-level concept; its children
    GO:0002138 retinoic acid biosynthetic process and GO:0034653 retinoic acid catabolic process are placed
    on the synthesis and catabolism steps.
- source_id: PMID:17473173
  title: RDH10 is essential for synthesis of embryonic retinoic acid and is required for limb, craniofacial,
    and organ development.
  statement: >-
    Genetic evidence that retinol oxidation by RDH10, not redundant cytosolic alcohol dehydrogenases, is the
    first and critical step of embryonic atRA synthesis.
  supporting_text: Thus, we show that the first oxidative step of Vitamin A metabolism, which is catalyzed
    in large part by the retinol dehydrogenase RDH10, is critical for the spatiotemporal synthesis of RA.
- source_id: PMID:9228017
  title: cDNA cloning of human retinoic acid-metabolizing enzyme (hP450RAI) identifies a novel family of
    cytochromes P450.
  statement: >-
    The atRA-inducible CYP26A1 hydroxylase closes a negative feedback loop on atRA level.
  supporting_text: We conclude that this enzyme plays a key role in RA metabolism, functioning in a feedback
    loop where RA levels are controlled in an autoregulatory manner.
module:
  id: retinoic_acid_metabolism
  label: All-trans-retinoic acid metabolism
  module_type: METABOLIC_PATHWAY
  concepts:
  - preferred_term: retinoic acid metabolic process
    term:
      id: GO:0042573
      label: retinoic acid metabolic process
    description: >-
      The closeMatch of PW:0001004. Covers both the synthesis and the catabolism of atRA, which this
      module models as one life cycle because the two arms together set the local atRA level.
  context:
    taxa:
    - preferred_term: Homo sapiens
      term:
        id: NCBITaxon:9606
        label: Homo sapiens
    cellular_components:
    - preferred_term: endoplasmic reticulum membrane
      term:
        id: GO:0005789
        label: endoplasmic reticulum membrane
      description: >-
        Where the membrane-bound steps act: retinol oxidation by RDH10 with DHRS3, and atRA hydroxylation
        by the CYP26 enzymes.
    - preferred_term: cytosol
      term:
        id: GO:0005829
        label: cytosol
      description: >-
        Where the soluble steps act: CRBP1 retinol binding, retinal oxidation by the ALDH1A enzymes and
        atRA binding by the CRABPs. Listed beside the ER membrane because the pathway alternates between
        the two compartments, not as a refinement of one by the other.
  parts:
  - order: 1
    role: plasma retinol delivery and receptor-mediated uptake
    node:
      id: retinol_delivery_uptake
      label: RBP4-TTR transport of retinol and STRA6-mediated uptake
      module_type: TRANSPORT_STEP
      description: >-
        Holo-RBP4 carries all-trans-retinol in plasma as a complex with the TTR tetramer, which keeps the
        small RBP4 from glomerular filtration. STRA6 at the plasma membrane binds holo-RBP4 and transfers
        retinol into the cell. The visual cycle module starts from retinol already in the RPE and does not
        model this step, so it is modelled here rather than referenced.
      concepts:
      - preferred_term: retinol transport
        term:
          id: GO:0034633
          label: retinol transport
      evidence:
      - source_id: PMID:17255476
        statement: STRA6 is the RBP receptor that takes up vitamin A from the vitamin A-RBP complex.
        supporting_text: STRA6 binds to RBP with high affinity and has robust vitamin A uptake activity
          from the vitamin A-RBP complex.
      annotons:
      - id: rbp4_retinol_carrier
        label: RBP4 plasma retinol carrier
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: RBP4
            term:
              id: UniProtKB:P02753
              label: Retinol-binding protein 4
        function:
          preferred_term: molecular carrier activity
          term:
            id: GO:0140104
            label: molecular carrier activity
          substrates:
          - preferred_term: all-trans-retinol
            term:
              id: CHEBI:17336
              label: all-trans-retinol
        processes:
        - preferred_term: retinol transport
          term:
            id: GO:0034633
            label: retinol transport
        locations:
        - preferred_term: extracellular region
          term:
            id: GO:0005576
            label: extracellular region
        role_description: >-
          Lipocalin that binds one all-trans-retinol (retinol binding, GO:0019841, IDA in human GOA) and
          carries it from liver to peripheral tissues. The carrier activity follows the mouse GO-CAM
          that models Rbp4 this way.
        evidence:
        - source_id: PMID:571335
          statement: Human RBP4 exists as apo and holo forms that differ by bound retinol and binds prealbumin
            (transthyretin).
          supporting_text: The anodal of the two bands was therefore probably the apo form and the cathodal
            the holo form of the same retinol-binding protein.
        gocam_associations:
        - model: gomodel:67086be200001721
          activity: gomodel:67086be200001721/67086be200001793
          title: Retinoid Metabolic Process 2 (Mouse)
          description: >-
            Mouse Rbp4 GO:0140104 molecular carrier activity in the extracellular region, downstream of
            Pnpla2 retinyl ester hydrolysis in hepatic stellate cells.
      - id: ttr_rbp4_partner
        label: TTR stabilisation of circulating holo-RBP4
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: TTR
            term:
              id: UniProtKB:P02766
              label: Transthyretin
        function:
          preferred_term: molecular sequestering activity
          term:
            id: GO:0140313
            label: molecular sequestering activity
        locations:
        - preferred_term: extracellular region
          term:
            id: GO:0005576
            label: extracellular region
        role_description: >-
          The thyroxine-carrying tetramer that binds holo-RBP4 and so retains it in plasma. Retinol is
          not its own ligand; TTR is an accessory of the RBP4 carrier. The function term follows the mouse
          GO-CAM and the Reactome-derived human annotation (TAS); TTR has no experimental molecular function
          in human GOA other than self-association.
        evidence:
        - source_id: PMID:571335
          statement: Most urinary RBP binds prealbumin (transthyretin) in vitro.
          supporting_text: More than 85% of the retinol-binding protein in the urine bound to prealbumin-Sephrose.
        gocam_associations:
        - model: gomodel:67086be200001721
          activity: gomodel:67086be200001721/67086be200001792
          title: Retinoid Metabolic Process 2 (Mouse)
          description: Mouse Ttr GO:0140313 molecular sequestering activity in the retinoid metabolic process.
      - id: stra6_retinol_uptake
        label: STRA6 retinol transmembrane transporter (RBP4 receptor)
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: STRA6
            term:
              id: UniProtKB:Q9BX79
              label: Receptor for retinol uptake STRA6
        function:
          preferred_term: retinol transmembrane transporter activity
          term:
            id: GO:0034632
            label: retinol transmembrane transporter activity
          substrates:
          - preferred_term: all-trans-retinol (from holo-RBP4)
            term:
              id: CHEBI:17336
              label: all-trans-retinol
        processes:
        - preferred_term: retinol transport
          term:
            id: GO:0034633
            label: retinol transport
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: >-
          Multi-pass membrane receptor for holo-RBP4 that transfers retinol into the cell (GO:0034632, IDA,
          PMID:21901792). Uptake is coupled to intracellular acceptors, CRBP1 and LRAT, which drain the
          retinol; the uptake is bidirectional in vitro.
        evidence:
        - source_id: PMID:21901792
          statement: A disease-associated STRA6 mutant is mislocalised and has reduced vitamin A uptake, and
            the eye phenotype is reproduced by inhibiting RA synthesis.
          supporting_text: We have shown that the G304K mutant STRA6 protein is mislocalized and has severely
            reduced vitamin A uptake activity.
  - order: 2
    role: intracellular retinol binding
    node:
      id: cellular_retinol_binding
      label: CRBP1 (RBP1) binding of cellular all-trans-retinol
      module_type: TRANSPORT_STEP
      description: >-
        CRBP1 binds incoming retinol with nanomolar affinity, protects it from non-specific oxidation and
        presents it to the membrane-bound enzymes, both the RDH10 dehydrogenase and LRAT. The ratio of apo- to
        holo-CRBP1 steers retinol between atRA synthesis and retinyl ester storage, which is why the
        RGD diagram draws apo-Rbp1 inhibiting Lrat and favouring ester hydrolysis.
      annotons:
      - id: rbp1_retinol_binding
        label: CRBP1 all-trans-retinol binding
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: RBP1 (CRBP1)
            term:
              id: UniProtKB:P09455
              label: Retinol-binding protein 1
        function:
          preferred_term: all-trans-retinol binding
          term:
            id: GO:1904768
            label: all-trans-retinol binding
        locations:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        role_description: >-
          Intracellular lipocalin-fold (FABP family) retinol chaperone. GO:1904768 is its experimental
          molecular function (IDA, PMID:28057518) and the activity the mouse GO-CAMs use.
        evidence:
        - source_id: PMID:28057518
          statement: Apo-CRBP1 binds retinol stoichiometrically with nanomolar affinity.
          supporting_text: An approximately stoichiometric binding of retinol to wild type apo-CRBP1
            (Kd∼4.5nM)
        gocam_associations:
        - model: gomodel:66f5faaa00001204
          activity: gomodel:66f5faaa00001204/66f5faaa00001307
          title: Retinoid Metabolic Process 1 (Mouse)
          description: Mouse Rbp1 GO:1904768 all-trans-retinol binding, part of retinoid metabolic process.
  - order: 3
    role: reversible retinol-retinal interconversion (rate-limiting step of synthesis)
    node:
      id: retinol_retinal_interconversion
      label: RDH10-DHRS3 retinol dehydrogenase/retinaldehyde reductase pair
      module_type: REACTION
      description: >-
        RDH10 oxidises all-trans-retinol to all-trans-retinal at the ER and lipid-droplet membrane. DHRS3
        reduces all-trans-retinal back to retinol. The two SDRs activate each other when co-expressed: DHRS3
        reaches its full reductase activity only with RDH10 present, and RDH10 retinol dehydrogenase activity
        rises with DHRS3, with neither needing to be catalytically active to activate the other. Because DHRS3
        is induced by atRA, the pair forms a feedback loop that limits retinal supply. No GO cellular component
        term exists for the RDH10-DHRS3 association, so it is modelled as two annotons in one node rather
        than as a named complex.
      concepts:
      - preferred_term: retinol metabolic process
        term:
          id: GO:0042572
          label: retinol metabolic process
      evidence:
      - source_id: PMID:24733397
        statement: DHRS3 needs RDH10 for full reductase activity and RDH10 is reciprocally activated by DHRS3.
        supporting_text: This study demonstrates that DHRS3 requires the presence of retinol dehydrogenase
          10 (RDH10) to display its full catalytic activity.
      - source_id: PMID:24733397
        statement: The mutual activation does not depend on the catalytic activity of the activating partner.
        supporting_text: Neither RDH10 nor DHRS3 has to be itself catalytically active to activate each other.
      annotons:
      - id: rdh10_retinol_dehydrogenase
        label: RDH10 all-trans-retinol dehydrogenase
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: RDH10
            term:
              id: UniProtKB:Q8IZV5
              label: Retinol dehydrogenase 10
        function:
          preferred_term: all-trans-retinol dehydrogenase (NAD+) activity
          term:
            id: GO:0004745
            label: all-trans-retinol dehydrogenase (NAD+) activity
          substrates:
          - preferred_term: all-trans-retinol
            term:
              id: CHEBI:17336
              label: all-trans-retinol
          - preferred_term: NAD+
            term:
              id: CHEBI:57540
              label: NAD(1-)
          products:
          - preferred_term: all-trans-retinal
            term:
              id: CHEBI:17898
              label: all-trans-retinal
          - preferred_term: NADH
            term:
              id: CHEBI:57945
              label: NADH(2-)
        processes:
        - preferred_term: retinoic acid biosynthetic process
          term:
            id: GO:0002138
            label: retinoic acid biosynthetic process
        locations:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        role_description: >-
          The main retinol dehydrogenase for atRA synthesis; the mouse trex mutant lacks retinol oxidase
          activity and dies at midgestation with RA deficiency. GO:0004745 is its experimental GOA
          function (IDA, PMID:12407145 and PMID:19458327). Cofactor use is not settled: the first
          characterisation reported a preference for NADP, while later work found NAD+ more effective;
          the GOA term is kept.
        evidence:
        - source_id: PMID:12407145
          statement: Recombinant human RDH10 oxidises all-trans-retinol to all-trans-retinal.
          supporting_text: Human RDH10 expressed in COS cells oxidized all-trans retinol to all-trans retinal.
        - source_id: PMID:19458327
          statement: RDH10 uses both NAD+ and NADP+, with NAD+ giving more robust activity (11-cis substrate).
          supporting_text: RDH10 can use both NAD(+) and NADP(+) as cofactors for 11-cis-RDH activity, although
            NAD(+) cofactor confers more robust activity.
        - source_id: PMID:17473173
          statement: The trex RDH10 mutant cannot oxidise retinol and gives insufficient RA signalling.
          supporting_text: we determined that RDH10(trex) mutant protein lacks the ability to oxidize retinol
            to retinal, resulting in insufficient RA signaling.
      - id: dhrs3_retinaldehyde_reductase
        label: DHRS3 all-trans-retinaldehyde reductase (RDH10-activated)
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: DHRS3
            term:
              id: UniProtKB:O75911
              label: Short-chain dehydrogenase/reductase 3
        function:
          preferred_term: all-trans-retinol dehydrogenase (NADP+) activity
          term:
            id: GO:0052650
            label: all-trans-retinol dehydrogenase (NADP+) activity
          substrates:
          - preferred_term: all-trans-retinal
            term:
              id: CHEBI:17898
              label: all-trans-retinal
          - preferred_term: NADPH
            term:
              id: CHEBI:57783
              label: NADPH(4-)
          products:
          - preferred_term: all-trans-retinol
            term:
              id: CHEBI:17336
              label: all-trans-retinol
          - preferred_term: NADP+
            term:
              id: CHEBI:58349
              label: NADP(3-)
        locations:
        - preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        role_description: >-
          NADPH-dependent reductase working in the reverse direction to RDH10; this activity is the core
          function in the completed human DHRS3 review. The same DHRS3 role is also drawn, as retinoid
          buffering, in modules/retinoid_visual_cycle.yaml (node retinoid_buffering); here it is modelled
          with its RDH10 partner because the mutual activation is what makes it a control point of atRA synthesis.
          The substrates and products are written in the reduction direction it works in here, although GO
          names GO:0052650 in the oxidation (dehydrogenase) direction; GO activity terms cover both
          directions of a reversible reaction, and GOA uses this term for the reductase.
        evidence:
        - source_id: file:human/DHRS3/DHRS3-ai-review.yaml
          statement: Core function GO:0052650, NADPH-dependent all-trans-retinaldehyde reductase buffering
            retinaldehyde supply for atRA synthesis.
        - source_id: PMID:24733397
          statement: RDH10-activated DHRS3 reduces retinaldehyde back to retinol and slows atRA synthesis.
          supporting_text: The RDH10-activated DHRS3 acts as a robust high affinity all-trans-retinaldehyde-specific
            reductase that effectively converts retinaldehyde back to retinol, decreasing the rate of retinoic
            acid biosynthesis.
        gocam_associations:
        - model: gomodel:67086be200002705
          activity: gomodel:67086be200002705/67086be200002846
          title: Retinoid Metabolic Process 4 (Mouse)
          description: Mouse Dhrs3 GO:0052650 all-trans-retinol dehydrogenase (NADP+) activity.
  - order: 4
    role: irreversible oxidation of retinal to all-trans-retinoic acid
    node:
      id: retinal_oxidation
      label: Retinaldehyde dehydrogenases ALDH1A1, ALDH1A2 and ALDH1A3
      module_type: REACTION
      description: >-
        Cytosolic NAD+-dependent class 1 aldehyde dehydrogenases oxidise all-trans-retinal to atRA through a
        catalytic cysteine. The reaction is irreversible and commits retinal to atRA. The three paralogues
        catalyse the same reaction and differ in tissue and developmental expression (ALDH1A2 is the main
        embryonic and testicular enzyme, ALDH1A1 is abundant in liver and also oxidises other aldehydes,
        ALDH1A3 acts in the developing eye and nasal region), so they are modelled as variants.
      concepts:
      - preferred_term: retinoic acid biosynthetic process
        term:
          id: GO:0002138
          label: retinoic acid biosynthetic process
      variant_sets:
      - id: raldh_paralog
        label: Retinaldehyde dehydrogenase paralogue
        axis: enzyme paralogue (ALDH1A1/ALDH1A2/ALDH1A3, differing in tissue and developmental expression)
        selection: ONE_OR_MORE
        variants:
        - id: aldh1a2_variant
          label: ALDH1A2 (RALDH2)
          module_type: REACTION
          annotons:
          - id: aldh1a2_retinal_dehydrogenase
            label: ALDH1A2 retinal dehydrogenase (NAD+)
            participant:
