notes: >-
  Boundary. The module covers the three FlyBase members. The malate-aspartate shuttle partners
  (malate dehydrogenases and mitochondrial carriers) and asparaginase-mediated asparagine
  breakdown are not parts. Enzyme functions are assigned by orthology to the conserved mammalian
