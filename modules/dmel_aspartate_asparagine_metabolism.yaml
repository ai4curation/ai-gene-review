id: MODULE:dmel_aspartate_asparagine_metabolism
title: L-aspartate and L-asparagine metabolism in Drosophila melanogaster
description: >-
  Aspartate aminotransferases interconvert oxaloacetate and L-aspartate by transferring an
  amino group from L-glutamate, producing 2-oxoglutarate. Drosophila has a cytosolic isozyme
  (Got1) and a mitochondrial isozyme (Got2), which also act in the malate-aspartate shuttle.
  Asparagine synthetase (Asns) then converts aspartate to L-asparagine in an ATP-dependent
  reaction that uses glutamine as the nitrogen donor.
status: DRAFT
scope: CONCRETE
