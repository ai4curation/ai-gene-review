    models that group.
- source_id: GO:0016010
  title: dystrophin-associated glycoprotein complex
  statement: >-
    GO term grounding the module as dystrophin-associated glycoprotein complex.
notes: >-
  Extracellular ligands (laminins, perlecan) and dystroglycan glycosylation enzymes are context,
  not parts. Syntrophins and dystrophin/dystrobrevin are modelled per gene because their assembly
  into stable subcomplexes has not been shown in Drosophila. FlyBase groups realized by this
  module: DGC (FBgg0000473), SYN (FBgg0000479), DYS-REL (FBgg0000480), SCG (FBgg0000481).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_dystrophin_glycoprotein_complex.yaml;
  none of the member genes has a gene review yet unless noted.
