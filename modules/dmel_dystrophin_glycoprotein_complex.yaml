id: MODULE:dmel_dystrophin_glycoprotein_complex
title: Dystrophin glycoprotein complex in Drosophila melanogaster
description: >-
  The dystrophin glycoprotein complex (DGC) links the actin cytoskeleton to the extracellular
  matrix across the plasma membrane, mainly in muscle. Dystroglycan (Dg) spans the membrane:
  its extracellular part binds laminin and other matrix proteins and its cytoplasmic tail
  binds dystrophin, which in turn binds actin. Sarcoglycans form a transmembrane subcomplex
  that stabilizes the link, and the cytoplasmic adaptors dystrobrevin and syntrophins bind
  dystrophin and recruit signaling proteins. Drosophila has single dystrophin (Dys) and dystroglycan
  genes, one dystrobrevin, three sarcoglycans and two syntrophin-like genes. Loss of Dys or
  Dg causes age-dependent muscle degeneration, and Dg also acts in epithelial polarity and
  in the oocyte.
status: DRAFT
scope: CONCRETE
