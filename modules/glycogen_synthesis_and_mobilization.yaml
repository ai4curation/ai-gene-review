            connection_type: PROVIDES_INPUT_FOR
            description: >-
              Debranching exposes linear alpha-1,4 chain ends for continued
              GlgP phosphorolysis.
            chaining_status: VERIFIED
            chaining_note: >-
              The debranched polymer is the recurring GlgP substrate.
  connections:
    - source: glgb_branch_formation
      target: glgp_chain_phosphorolysis
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Branched glycogen produced by the synthetic arm is the stored polymer
        mobilized by GlgP and GlgX.
      chaining_status: VERIFIED
      chaining_note: >-
        This is a storage-to-mobilization connection across physiological time,
        not an assertion that synthesis directly triggers catabolism.
  knowledge_gaps:
    - gap_statement: >-
        Q88FN9 nucleotide-sugar donor specificity has not been measured
        directly. UDP-glucose specificity is assigned from the experimentally
        characterized PAO1 ortholog in the same PTHR45825:SF8 subfamily and the
        shared GlgC-negative Pseudomonas pathway architecture.
      boundary: >-
        The module places Q88FN9 in the Pseudomonas UDP-glucose variant on
        ortholog and pathway-context evidence. Direct Q88FN9 kinetics remain
        the residual gap and would test that transferred assignment.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The partitioned KT2440 locus also encodes TreY-TreZ and
        TreS-Mak-GlgE alpha-glucan routes, but the fate of Q88FN9-derived
        alpha-glucan and its physiological division of labor with GlgE-derived
        polymer are unresolved in KT2440.
      boundary: >-
        Those routes remain in their own reusable modules. This module includes
        only canonical glycogen synthesis and mobilization reactions.
      gap_kind:
        - BIOLOGY
