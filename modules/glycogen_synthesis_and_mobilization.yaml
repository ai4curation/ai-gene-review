            target: glgx_branch_removal
            connection_type: PROVIDES_INPUT_FOR
            description: >-
              GlgP shortens outer chains until branch-proximal glycogen becomes
              substrate for GlgX.
            chaining_status: VERIFIED
            chaining_note: >-
              The connection represents iterative polymer remodeling rather
              than a single small-molecule intermediate.
          - source: glgx_branch_removal
