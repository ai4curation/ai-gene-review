                        statement: >-
                          EC 3.2.1.196 defines GlgX release of short DP3-DP4
                          branches from limit dextrin.
                      - source_id: PMID:15687211
                        statement: >-
                          E. coli GlgX preferentially hydrolyzes branches of
                          three or four glucose residues during glycogen
                          catabolism.
                      - source_id: PMID:33872310
                        statement: >-
                          Purified P. aeruginosa GlgX preferentially released a
                          DP4 maltooligosaccharide from glycogen.
                      - source_id: file:PSEPK/glgX/glgX-uniprot.txt
                        statement: >-
                          Q88FN4 carries the GlgX-specific IPR011837 signature
                          and PANTHER family PTHR43002; its legacy GO:0004135
                          mapping is not used as reaction evidence.
                  processes:
                    - preferred_term: glycogen catabolic process
                      term:
                        id: GO:0005980
                        label: glycogen catabolic process
                  role_description: >-
                    Removes branch points exposed during GlgP action, restoring
                    linear chain ends that can re-enter phosphorolysis.
        connections:
