id: MODULE:glycogen_synthesis_and_mobilization
title: Bacterial glycogen and related alpha-glucan metabolism
description: >-
  A reusable bacterial storage-carbon module that distinguishes canonical
  GlgC/ADP-glucose-dependent glycogen synthesis from Pseudomonas
  UDP-glucose-dependent production of linear alpha-glucan by GlgA. In
  Pseudomonas, most GlgA-derived linear glucan enters the
  TreY/TreZ and TreS-Mak-GlgE network. GlgB can branch GlgA-derived polymer,
  but that connection is modeled as an unverified capability whose physiological
  contribution is unknown. The mobilization arm
  represents GlgP phosphorolysis and GlgX branch removal, while leaving the
  physiological partitioning of these enzymes among bacterial glycogen and
  related branched alpha-glucan pools unresolved. The module ends at glucose
  1-phosphate; phosphoglucomutase and central carbon metabolism are downstream.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0005977
    title: glycogen metabolic process
    statement: >-
      GO:0005977 provides the process boundary encompassing both glycogen
      biosynthesis and glycogen catabolism.
  - source_id: UniProtKB:P0A6V1
    title: Escherichia coli GlgC glucose-1-phosphate adenylyltransferase
    statement: >-
      Reviewed P0A6V1 grounds the canonical bacterial production of ADP-glucose
      from glucose 1-phosphate and ATP.
  - source_id: PMID:33872310
    title: Trehalose and alpha-glucan mediate distinct abiotic stress responses in Pseudomonas aeruginosa
    statement: >-
      Purified P. aeruginosa PAO1 GlgA preferentially used UDP-glucose, PAO1
      lacks glgC, and its GalU supplies UDP-glucose; the same study directly
      assayed PAO1 GlgP and GlgX activities.
  - source_id: file:PSEPK/galU/galU-uniprot.txt
    title: UniProtKB entry for PSEPK GalU
    statement: >-
      Q88GA4 is the KT2440 UTP:glucose-1-phosphate uridylyltransferase that
      supplies the shared UDP-glucose pool used by several pathways.
  - source_id: file:PSEPK/glgA/glgA-uniprot.txt
    title: UniProtKB entry for PSEPK GlgA
    statement: >-
      Q88FN9 is a reviewed glycogen synthase assigned to glycogen biosynthesis.
      Its record contains conflicting donor-specific electronic annotations;
      experimental UDP-glucose specificity applies to the PAO1 homolog.
  - source_id: file:PSEPK/glgB/glgB-uniprot.txt
    title: UniProtKB entry for PSEPK GlgB
    statement: >-
      Q88FN1 is a reviewed branching enzyme that introduces alpha-1,6 linkages
      into growing alpha-1,4-glucan chains.
  - source_id: file:PSEPK/glgP/glgP-uniprot.txt
    title: UniProtKB entry for PSEPK GlgP
    statement: >-
      Q88CY8 is assigned glycogen phosphorylase activity and glycogen catabolic
      process.
  - source_id: file:PSEPK/glgX/glgX-uniprot.txt
    title: UniProtKB entry for PSEPK GlgX
    statement: >-
      Q88FN4 is assigned amylo-alpha-1,6-glucosidase activity and glycogen
      catabolic process.
notes: >-
  This bacterial turnover module complements the existing glycogen
  biosynthesis and glycogenolysis modules; it does not replace their
  eukaryotic boundaries.
  Family selectors make the reaction roles reusable; representative members
  identify concrete implementations rather than restricting the module to
  PSEPK. KT2440 supplies exact GalU, GlgA, GlgB, GlgP, and GlgX exemplars. No
  GlgC or other EC 2.7.7.27 candidate is present in the current KT2440 UniProt
  metadata. Pseudomonas aeruginosa PAO1 has the same absence and its purified
  GlgA prefers UDP-glucose, so the Pseudomonas GalU/UDP-glucose route is modeled
  as a leading family-level hypothesis for linear glucan formation. GalU is a
  pleiotropic nucleotide-sugar supplier rather than a dedicated glycogen
  enzyme. Current curation supports UDP-glucose specificity by transfer from
  the assayed same-subfamily PAO1 ortholog while retaining direct Q88FN9
  kinetics as a knowledge gap. The Pseudomonas linear product is routed
  primarily to neighboring TreY/TreZ and TreS-Mak-GlgE modules. The species-aware
  OpenScientist report's claim that the UDP-glucose route is unsupported is not
  retained because it missed the direct PAO1 GlgA donor assay in PMID:33872310.
