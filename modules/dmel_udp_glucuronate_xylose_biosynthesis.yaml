id: MODULE:dmel_udp_glucuronate_xylose_biosynthesis
title: UDP-glucuronate and UDP-xylose biosynthesis in Drosophila melanogaster
description: >-
  UDP-glucuronic acid and UDP-xylose are the sugar donors for proteoglycan glycosaminoglycan
  chains and for other glucuronidated and xylosylated molecules. UDP-glucose pyrophosphorylase
  (Ugp) makes UDP-glucose from glucose-1-phosphate and UTP, and UDP-glucose 6-dehydrogenase
  (Sugarless, sgl) oxidises it to UDP-glucuronic acid in the cytosol. The nucleotide-sugar
  transporter Fringe connection (frc) imports UDP-glucuronic acid and other UDP sugars into
  the ER and Golgi lumen, where UDP-glucuronic acid decarboxylase (Uxs) converts UDP-glucuronic
  acid to UDP-xylose. Sugarless and Fringe connection were identified genetically through
  their requirement for Wingless and other heparan sulfate proteoglycan-dependent signalling.
status: DRAFT
scope: CONCRETE
evidence:
