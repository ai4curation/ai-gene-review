notes: >-
  Boundary. The module ends with the nucleotide sugars; their use by glycosyltransferases
  (for example xylosyltransferase Oxt and the glucuronyltransferases) is in dmel_glycosaminoglycan_biosynthesis
  and other glycosylation modules. Ugp also supplies UDP-glucose for glycogen and trehalose
  synthesis. frc and sgl are in both FlyBase groups and appear once. Fringe connection transports
  several UDP sugars (UDP-glucuronic acid, UDP-GlcNAc, UDP-xylose and others); the annoton
  gives the UDP-glucuronate transport activity relevant here. Placing Uxs after import assumes
  a lumenal enzyme, as for its mammalian ortholog UXS1; the topology of fly Uxs has not been
  determined. FlyBase groups realized by this module: UDPGAB (FBgg0002049), UDPXYLB (FBgg0002054).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_udp_glucuronate_xylose_biosynthesis.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
