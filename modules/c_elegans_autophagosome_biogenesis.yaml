id: MODULE:c_elegans_autophagosome_biogenesis
title: Autophagosome biogenesis and maturation in Caenorhabditis elegans
description: >-
  Macroautophagy in Caenorhabditis elegans follows the conserved eukaryotic
  sequence of nucleation, expansion, cargo capture and lysosomal delivery, but
  with metazoan-specific features. A class III phosphatidylinositol 3-kinase
  (PI3K) complex built around the Beclin 1 ortholog BEC-1 and the lipid kinase
  VPS-34 (LET-512) produces phosphatidylinositol 3-phosphate (PI3P) on early
  autophagic membranes. EPG-8, a divergent Atg14 homolog that binds BEC-1,
  directs this complex to autophagy. The WD40 PROPPIN ATG-18 (WIPI1/2
  ortholog) reads PI3P through its FRRG motif and acts in autophagosome
  formation, distinct from its paralog EPG-6 (WIPI4), which works with ATG-2.
  The worm has two Atg8 family proteins with different roles. The
  GABARAP-type LGG-1 is cleaved by ATG-4 and conjugated to
  phosphatidylethanolamine. Cleavage is needed to start autophagosome
  formation, and the lipidated form helps recognise cargo. LGG-1 acts upstream
  of the LC3-type LGG-2, which is recruited to LGG-1-positive autophagosomes
  and drives their maturation and tethering to lysosomes through the HOPS
  subunit VPS-39. Fusion with late endosomes and lysosomes needs EPG-5, a
  metazoan-specific RAB-7 effector that also binds LGG-1 and SNARE complexes,
  so that autophagosomes fuse with the correct partner and become degradative
  autolysosomes. Selective cargo, such as aggregates of the p62 homolog
  SQST-1, is linked to LGG-1-labelled membranes by cargo receptors and the
  scaffold EPG-7.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:20550938
    title: C. elegans screen identifies autophagy genes specific to multicellular organisms.
    statement: >-
      Genetic screens in C. elegans define metazoan-specific autophagy genes
      (epg-2 to epg-5) acting at discrete steps, including EPG-5 in formation
      of degradative autolysosomes.
    supporting_text: >-
      Genetic analysis reveals that epg-2, -3, -4, and -5 define discrete
      genetic steps of the autophagy pathway.
  - source_id: PMID:21802374
    title: The WD40 repeat PtdIns(3)P-binding protein EPG-6 regulates progression of omegasomes to autophagosomes.
    statement: >-
      Hierarchical analysis of worm autophagy genes in aggregate degradation:
      the UNC-51 complex, EPG-8/Atg14 and lipidated LGG-1 binding to
      aggregates are required for omegasome formation; the two PI3P effectors
      EPG-6 and ATG-18 act differently.
    supporting_text: >-
      We also established the hierarchical relationship of autophagy genes in
      degradation of protein aggregates and revealed that the UNC-51/Atg1
      complex, EPG-8/Atg14, and binding of lipidated LGG-1 to protein
      aggregates are required for omegasome formation.
  - source_id: PMID:24374177
    title: The C. elegans LC3 acts downstream of GABARAP to degrade autophagosomes by interacting with the HOPS subunit VPS39.
    statement: >-
      Sequential requirement of LGG-1, LGG-2, RAB-7 and HOPS in generating
      autolysosomes.
    supporting_text: >-
      Genetic analyses sustain a sequential implication of LGG-1, LGG-2,
      RAB-7, and HOPS complex to generate autolysosomes.
  - source_id: file:modules/phagophore_assembly_site.yaml
    title: Phagophore assembly site (PAS) module (budding yeast)
    statement: >-
      The yeast module that models the Atg1-complex condensate, Atg9
      vesicles, PI3K complex I, Atg2-Atg18 and the Atg8 conjugation system at
      the PAS. Those conserved steps are cross-referenced, not duplicated,
      here.
  - source_id: file:genes/worm/lgg-1/lgg-1-ai-review.yaml
    title: worm lgg-1 gene review
    statement: >-
      Core function of LGG-1 is PE-conjugated membrane anchoring in
      autophagosome assembly; LGG-1 acts upstream of LGG-2.
  - source_id: file:genes/worm/lgg-2/lgg-2-ai-review.yaml
    title: worm lgg-2 gene review
    statement: >-
      Core function of LGG-2 is lipidated membrane association in
      autophagosome maturation and autophagosome-lysosome fusion.
notes: >-
  Boundary. This is a concrete C. elegans module for bulk and selective
  macroautophagy from nucleation of the autophagic membrane to the
  autolysosome. It has five parts in pathway order: PI3K complex nucleation
  (BEC-1, VPS-34), the PI3P effector step (ATG-18), Atg8-family membrane
  anchoring in biogenesis (LGG-1), cargo recruitment (SQST-1, optional), and
  maturation and lysosome fusion (LGG-2, EPG-5). Upstream regulation by TOR,
  transcriptional induction by HLH-30/TFEB and PHA-4, and lysosome-derived
  lipid signals are outside the boundary. HLH-30 and the LIPL-4 lipid branch
  are modelled in MODULE:c_elegans_lysosomal_lipid_signaling. Mitochondrion-
  specific receptors (DCT-1, ALLO-1 and others) are modelled in
  MODULE:c_elegans_mitophagy.

  Relation to MODULE:phagophore_assembly_site. The yeast module covers the
  conserved core: the Atg1 complex condensate, Atg9 vesicles, PI3K complex I,
  the Atg2-Atg18 lipid-transfer bridge and the Atg8 conjugation system. This
  module does not repeat that machinery. It keeps only the worm members that
  have gene reviews and the metazoan-specific steps that the yeast module
  cannot show: the omegasome/ER origin of autophagosomes, the split of Atg8
  into GABARAP-type LGG-1 and LC3-type LGG-2 with sequential roles, and EPG-5
  as a RAB-7 effector at fusion. Worm components that are present but not
  modelled as annotons here because they lack gene reviews in this
  repository: UNC-51/Atg1, ATG-13, EPG-1, EPG-9, ATG-9, EPG-8/Atg14, VPS-15,
  EPG-6/WIPI4, ATG-2, ATG-4.1/ATG-4.2, ATG-7, ATG-3, ATG-5, ATG-16.1/16.2,
  EPG-3/VMP1, EPG-4/EI24, VPS-39 and EPG-7. VPS-34 (Q9TXI7, Swiss-Prot) is
  included without a gene review because it is the catalytic subunit of the
  nucleation step.

  BEC-1 also acts in the PI3KC3-C2 complex in endosome-to-Golgi retrograde
  transport and phagosome maturation (PMID:21183797). ATG-18, EPG-5 and LGG-1
  also act in phagocytes to degrade apoptotic corpses (PMID:22451698). These
  roles are noted in the gene reviews and are outside this module.

  Lipidation nuance. A 2023 study (PMID:37395461) shows that LGG-1 cleavage,
  not PE conjugation, is essential for autophagosome initiation and for
  development, while the lipidated form helps recognise cargo and degrade
  autophagosomes. The LGG-1 annoton keeps phosphatidylethanolamine binding
  as its MF to match the lgg-1 gene review core function, and this caveat is
  recorded in the annoton description.
module:
  id: c_elegans_autophagosome_biogenesis
  label: Autophagosome biogenesis and maturation in C. elegans
  module_type: BIOLOGICAL_PROCESS
  description: >-
    PI3K-complex nucleation, PI3P effector recruitment, LGG-1 membrane
    anchoring, cargo recruitment and LGG-2/EPG-5-dependent maturation and
    lysosome fusion of autophagosomes in C. elegans.
  concepts:
    - preferred_term: macroautophagy
      term:
        id: GO:0016236
        label: macroautophagy
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    cellular_components:
      - preferred_term: cytoplasm
        term:
          id: GO:0005737
          label: cytoplasm
  parts:
    - order: 1
      role: autophagic membrane nucleation by the class III PI3K complex
      node:
        id: pi3k_nucleation
        label: BEC-1/VPS-34 class III PI3K nucleation
        module_type: PROTEIN_COMPLEX
        description: >-
          The class III PI3K complex I (VPS-34, VPS-15, BEC-1 and the Atg14
          homolog EPG-8) makes PI3P on ER-associated omegasomes and
          phagophores. BEC-1 is the scaffold subunit and is needed for
          VPS-34 function. EPG-8 binds BEC-1 directly and directs the complex
          to autophagy. A second complex containing BEC-1 (PI3KC3-C2) acts in
          endocytic trafficking and is outside this module.
        concepts:
          - preferred_term: phosphatidylinositol 3-kinase complex, class III, type I
            term:
              id: GO:0034271
              label: phosphatidylinositol 3-kinase complex, class III, type I
          - preferred_term: autophagosome assembly
            term:
              id: GO:0000045
              label: autophagosome assembly
        annotons:
          - id: vps34_kinase
            label: VPS-34 phosphatidylinositol 3-kinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: VPS-34 (LET-512)
                term:
                  id: UniProtKB:Q9TXI7
                  label: Phosphatidylinositol 3-kinase catalytic subunit type 3
            function:
              preferred_term: 1-phosphatidylinositol-3-kinase activity
              term:
                id: GO:0016303
                label: 1-phosphatidylinositol-3-kinase activity
              substrates:
                - preferred_term: 1-phosphatidyl-1D-myo-inositol
              products:
                - preferred_term: 1-phosphatidyl-1D-myo-inositol 3-phosphate
            processes:
              - preferred_term: phosphatidylinositol-3-phosphate biosynthetic process
                term:
                  id: GO:0036092
                  label: phosphatidylinositol-3-phosphate biosynthetic process
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            role_description: >-
              Catalytic subunit that makes PI3P at the site of autophagosome
              formation. Its activity depends on BEC-1.
            evidence:
              - source_id: PMID:16111945
                title: Inactivation of the autophagy gene bec-1 triggers apoptotic cell death in C. elegans.
                statement: >-
                  BEC-1 is needed for the function of the class III PI3K
                  LET-512/VPS-34, which is required for autophagy.
                supporting_text: >-
                  We demonstrate that BEC-1 is necessary for the function of
                  the class III PI3 kinase LET-512/Vps34, an essential protein
                  required for autophagy, membrane trafficking, and endocytosis.
          - id: bec1_scaffold
            label: BEC-1 class III PI3K complex adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BEC-1
                term:
                  id: UniProtKB:Q22592
                  label: Beclin homolog
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
              description: >-
                BEC-1 links VPS-34 to the autophagy-specific subunit EPG-8
                (Atg14 homolog). BEC-1 also binds CED-9, which is outside
                this module.
            processes:
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            role_description: >-
              Non-catalytic scaffold that holds together the autophagy-specific
              class III PI3K complex.
            evidence:
              - source_id: PMID:21116129
                title: The coiled-coil domain protein EPG-8 plays an essential role in the autophagy pathway in C. elegans.
                statement: >-
                  EPG-8, a divergent Atg14 homolog, binds BEC-1 directly.
                  Without EPG-8, lipidated LGG-1 accumulates but does not form
                  puncta.
                supporting_text: >-
                  EPG-8 directly interacts with the C. elegans Beclin 1
                  homolog, BEC-1. Our study demonstrates that epg-8 may
                  function as a highly divergent homolog of the yeast autophagy
                  gene Atg14.
              - source_id: PMID:12958363
                title: Autophagy genes are essential for dauer development and life-span extension in C. elegans.
                statement: >-
                  bec-1 is the worm ortholog of APG6/VPS30/beclin 1 and is
                  required for dauer morphogenesis and lifespan extension.
                supporting_text: >-
                  bec-1, the C. elegans ortholog of the yeast and mammalian
                  autophagy gene APG6/VPS30/beclin1, is essential for normal
                  dauer morphogenesis and life-span extension
    - order: 2
      role: PI3P effector recruitment to early autophagic membranes
      node:
        id: pi3p_effector
        label: ATG-18 PI3P effector
        module_type: MOLECULAR_FUNCTION
        description: >-
          ATG-18 (WIPI1/2) binds PI3P through its FRRG motif and acts in
          autophagosome formation. Its paralog EPG-6 (WIPI4) works with ATG-2
          to move omegasomes forward to autophagosomes; the two PI3P effectors
          have different roles. The Atg2-Atg18 lipid-transfer bridge is
          modelled in the yeast PAS module.
        annotons:
          - id: atg18_pi3p_binding
            label: ATG-18 PI3P binding
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ATG-18
                term:
                  id: UniProtKB:O16466
                  label: Autophagy-related protein 18
            function:
              preferred_term: phosphatidylinositol-3-phosphate binding
              term:
                id: GO:0032266
                label: phosphatidylinositol-3-phosphate binding
            processes:
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            role_description: >-
              Reads PI3P made by the BEC-1/VPS-34 complex and recruits
              downstream autophagy machinery.
            evidence:
              - source_id: PMID:21802374
                title: The WD40 repeat PtdIns(3)P-binding protein EPG-6 regulates progression of omegasomes to autophagosomes.
                statement: ATG-18 is a PI3P effector with a role in autophagosome formation that differs from EPG-6.
                supporting_text: >-
                  Another WD40 repeat PtdIns(3)P effector, ATG-18, plays a
                  distinct role in autophagosome formation.
              - source_id: PMID:22451698
                title: Autophagy genes function sequentially to promote apoptotic cell corpse degradation in the engulfing cell.
                statement: The FRRG motif of ATG-18 is its PI3P binding site.
                supporting_text: >-
                  FRRG (amino acids 227–230) in ATG-18 was identified as the
                  PI(3)P binding site
    - order: 3
      role: Atg8-family membrane anchoring in autophagosome biogenesis
      node:
        id: lgg1_biogenesis
        label: LGG-1 (GABARAP) in autophagosome formation
        module_type: MOLECULAR_FUNCTION
        description: >-
          LGG-1 is cleaved after Gly-116 by ATG-4 and conjugated to
          phosphatidylethanolamine by the ATG-7/ATG-3/ATG-12-ATG-5-ATG-16
          system (modelled for yeast in the PAS module). LGG-1 complements
          yeast atg8, binds LIR-containing receptors and autophagy proteins,
          and is needed for LGG-2 to localise to autophagosomes.
        annotons:
          - id: lgg1_pe_anchor
            label: LGG-1 phosphatidylethanolamine conjugate
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LGG-1
                term:
                  id: UniProtKB:Q09490
                  label: Protein lgg-1
            function:
              preferred_term: phosphatidylethanolamine binding
              term:
                id: GO:0008429
                label: phosphatidylethanolamine binding
              description: >-
                Covalent PE conjugation, as in the lgg-1 gene review core
                function. The cleaved, non-lipidated form is enough for
                autophagosome initiation and for development, so PE
                conjugation mainly helps recognise cargo and degrade
                autophagosomes (PMID:37395461).
            processes:
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: autophagosome membrane
                term:
                  id: GO:0000421
                  label: autophagosome membrane
            role_description: >-
              GABARAP-type Atg8 protein that marks the growing autophagic
              membrane and acts upstream of LGG-2.
            evidence:
              - source_id: PMID:37395461
                title: LGG-1/GABARAP lipidation is not required for autophagy and development in Caenorhabditis elegans.
                statement: >-
                  Cleavage of LGG-1 into form I is essential for
                  autophagosome initiation; lipidated form II helps recognise
                  cargo and degrade autophagosomes.
                supporting_text: >-
                  The cleavage of LGG-1 into form I is essential for
                  autophagosome initiation and biogenesis while form II is
                  involved in cargo recognition and autophagosome degradation.
              - source_id: PMID:20523114
                title: The autophagosomal protein LGG-2 acts synergistically with LGG-1 in dauer formation and longevity in C. elegans.
                statement: LGG-1, but not LGG-2, functionally complements yeast atg8.
                supporting_text: >-
                  LGG-1 but not LGG-2 is able to functionally complement the
                  atg8 mutant yeast.
              - source_id: PMID:26687600
                title: Structural Basis of the Differential Function of the Two C. elegans Atg8 Homologs, LGG-1 and LGG-2, in Autophagy.
                statement: >-
                  LGG-1 is essential for aggregate degradation, while LGG-2
                  has cargo- and stage-specific roles; the two have different
                  LIR-binding pockets.
                supporting_text: >-
                  lgg-1 is essential for degradation of protein aggregates,
                  while lgg-2 has cargo-specific and developmental-stage-specific
                  roles in aggregate degradation.
    - order: 4
      role: selective cargo recruitment to LGG-1-labelled membranes
      optional: true
      notes: >-
        Optional because SQST-1 and EPG-7 are needed for selective aggregate
        degradation but not for bulk starvation-induced autophagy.
      node:
        id: cargo_recruitment
        label: SQST-1 cargo receptor
        module_type: MOLECULAR_FUNCTION
        description: >-
          SQST-1 (p62) binds ubiquitinated cargo through its UBA domain and
          Atg8-family proteins through a LIR motif. The scaffold EPG-7 links
          SQST-1 aggregates to the autophagy machinery and is needed for
          SQST-1 aggregates to associate with LGG-1 puncta. Other worm
          receptors (for example SEPA-1 for P granules) follow the same
          logic.
        annotons:
          - id: sqst1_receptor
            label: SQST-1 autophagy cargo receptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SQST-1
                term:
                  id: UniProtKB:Q22436
                  label: ZZ-type domain-containing protein
            function:
              preferred_term: autophagy cargo adaptor activity
              term:
                id: GO:0160247
                label: autophagy cargo adaptor activity
            processes:
              - preferred_term: aggrephagy
                term:
                  id: GO:0035973
                  label: aggrephagy
            locations:
              - preferred_term: autophagosome
                term:
                  id: GO:0005776
                  label: autophagosome
            role_description: >-
              Links ubiquitinated protein aggregates to LGG-1-decorated
              autophagic membranes.
            evidence:
              - source_id: PMID:23530068
                title: The scaffold protein EPG-7 links cargo-receptor complexes with the autophagic assembly machinery.
                statement: >-
                  SQST-1 binds EPG-7; without EPG-7, SQST-1 aggregates do not
                  associate properly with LGG-1 puncta.
                supporting_text: >-
                  SQST-1 directly interacts with EPG-7 and colocalizes with
                  EPG-7 aggregates in autophagy mutants. Mutations in epg-7
                  impair association of SQST-1 aggregates with LGG-1/Atg8
                  puncta.
    - order: 5
      role: autophagosome maturation and fusion with late endosomes/lysosomes
      node:
        id: maturation_fusion
        label: LGG-2 and EPG-5 in autophagosome maturation and lysosome fusion
        module_type: BIOLOGICAL_PROCESS
        description: >-
          LGG-2 (LC3) is recruited to LGG-1-positive autophagosomes, controls
          their maturation and helps tether them to lysosomes by binding the
          HOPS subunit VPS-39. EPG-5 is a metazoan-specific RAB-7 effector.
          It binds RAB-7 and VAMP7/8 on late endosomes and lysosomes, and
          LGG-1 and STX17-SNAP29 on autophagosomes. It stabilises the correct
          trans-SNARE complex so that autophagosomes fuse with the right
          partner. Without EPG-5, non-degradative hybrid vesicles build up.
        concepts:
          - preferred_term: autophagosome maturation
            term:
              id: GO:0097352
              label: autophagosome maturation
          - preferred_term: autophagosome-lysosome fusion
            term:
              id: GO:0061909
              label: autophagosome-lysosome fusion
        annotons:
          - id: lgg2_maturation
            label: LGG-2 lipidated LC3-type Atg8 in maturation
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LGG-2
                term:
                  id: UniProtKB:Q23536
                  label: Protein lgg-2
            function:
              preferred_term: phosphatidylethanolamine binding
              term:
                id: GO:0008429
                label: phosphatidylethanolamine binding
              description: >-
                C-terminal Gly-130 PE conjugation, which LGG-2 needs to
                localise to autophagosomes (lgg-2 gene review core function).
            processes:
              - preferred_term: autophagosome maturation
                term:
                  id: GO:0097352
                  label: autophagosome maturation
              - preferred_term: autophagosome-lysosome fusion
                term:
                  id: GO:0061909
                  label: autophagosome-lysosome fusion
            locations:
              - preferred_term: autophagosome membrane
                term:
                  id: GO:0000421
                  label: autophagosome membrane
            role_description: >-
              LC3-type Atg8 protein that acts after LGG-1 and helps tether
              autophagosomes to lysosomes through VPS-39.
            evidence:
              - source_id: PMID:24374177
                title: The C. elegans LC3 acts downstream of GABARAP to degrade autophagosomes by interacting with the HOPS subunit VPS39.
                statement: >-
                  LGG-2 controls the maturation of LGG-1-positive
                  autophagosomes and binds VPS-39 to tether them to
                  lysosomes.
                supporting_text: >-
                  LGG-2 controls the maturation of LGG-1-positive
                  autophagosomes and facilitates the tethering with the
                  lysosomes through a direct interaction with the VPS-39 HOPS
                  complex subunit.
              - source_id: PMID:20523114
                title: The autophagosomal protein LGG-2 acts synergistically with LGG-1 in dauer formation and longevity in C. elegans.
                statement: The C-terminal glycine of LGG-2 is needed for its modification and autophagosome localisation.
                supporting_text: >-
                  The C-terminal glycine residue of LGG-2 is essential for
                  post-translational modification and localization to the
                  autophagosomes.
          - id: epg5_rab7_effector
            label: EPG-5 RAB-7 effector tether
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EPG-5
                term:
                  id: UniProtKB:Q18892
                  label: Ectopic P granules protein 5
            function:
              preferred_term: small GTPase binding
              term:
                id: GO:0031267
                label: small GTPase binding
              description: >-
                Binds RAB-7 as an effector (epg-5 gene review core function).
                EPG-5 also binds SNAREs (GO:0000149), which is how it chooses
                the fusion partner. The mechanism was worked out mainly in
                mammalian cells with C. elegans LGG-1 binding data.
            processes:
              - preferred_term: autophagosome-lysosome fusion
                term:
                  id: GO:0061909
                  label: autophagosome-lysosome fusion
            locations:
              - preferred_term: late endosome membrane
                term:
                  id: GO:0031902
                  label: late endosome membrane
            role_description: >-
              Metazoan-specific tether that decides which membranes
              autophagosomes fuse with, so that degradative autolysosomes
              form.
            evidence:
              - source_id: PMID:27588602
                title: The Vici Syndrome Protein EPG5 Is a Rab7 Effector that Determines the Fusion Specificity of Autophagosomes with Late Endosomes/Lysosomes.
                statement: >-
                  EPG5 is recruited by Rab7 and VAMP7/8 and binds LC3/LGG-1
                  and STX17-SNAP29 on autophagosomes.
                supporting_text: >-
                  EPG5 is recruited to late endosomes/lysosomes by direct
                  interaction with Rab7 and the late endosomal/lysosomal
                  R-SNARE VAMP7/8. EPG5 also binds to LC3/LGG-1 (mammalian and
                  C. elegans Atg8 homolog, respectively) and to assembled
                  STX17-SNAP29 Qabc SNARE complexes on autophagosomes.
              - source_id: PMID:20550938
                title: C. elegans screen identifies autophagy genes specific to multicellular organisms.
                statement: The mammalian EPG-5 homolog is needed to form degradative autolysosomes.
                supporting_text: >-
                  EI24 and mEPG5 are required for formation of degradative
                  autolysosomes.
        connections:
          - source: lgg2_maturation
            target: epg5_rab7_effector
            connection_type: PRECEDES
            description: >-
              Genetics places LGG-2 before RAB-7/HOPS-dependent
              autolysosome formation, where EPG-5 acts. LGG-2 and EPG-5 may
              also act partly in parallel.
  connections:
    - source: pi3k_nucleation
      target: pi3p_effector
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        PI3P made by VPS-34 in the BEC-1 complex is the lipid that ATG-18
        binds.
    - source: pi3p_effector
      target: lgg1_biogenesis
      connection_type: PRECEDES
      description: >-
        PI3P effectors act at the omegasome/phagophore before and during
        LGG-1-positive membrane growth. The order between ATG-18 and LGG-1
        recruitment in worms is not fully resolved (see knowledge_gaps).
    - source: cargo_recruitment
      target: lgg1_biogenesis
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Cargo receptors bind LGG-1 through LIR motifs and bring cargo into
        the forming autophagosome.
    - source: lgg1_biogenesis
      target: maturation_fusion
      connection_type: PRECEDES
      description: >-
        LGG-1 is needed for LGG-2 to localise to autophagosomes, and LGG-2
        then drives maturation.
      evidence:
        - source_id: PMID:24374177
          title: The C. elegans LC3 acts downstream of GABARAP to degrade autophagosomes by interacting with the HOPS subunit VPS39.
          statement: LGG-1 acts upstream of LGG-2.
          supporting_text: >-
            LGG-1 acts upstream of LGG-2 to allow its localization to
            autophagosomes.
knowledge_gaps:
  - gap_statement: >-
      Which PE-conjugation-independent activity of cleaved LGG-1 (form I)
      supports autophagosome initiation is unknown, as is how the
      non-lipidated protein is recruited to nascent membranes.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Conflicts with the standard model in which Atg8 lipidation drives
      phagophore expansion, and affects how the Atg8-family MF should be
      described.
    resolution: >-
      Identify the binding partners of LGG-1(G116A) form I on nascent
      autophagic membranes, and image phagophore expansion in lgg-1(G116A)
      embryos at high resolution.
    provenance:
      - reference_id: PMID:37395461
        supporting_text: >-
          The cleavage of LGG-1 into form I is essential for autophagosome
          initiation and biogenesis while form II is involved in cargo
          recognition and autophagosome degradation.
  - gap_statement: >-
      How ATG-18 and EPG-6, two PI3P-binding PROPPINs, divide the work of
      autophagosome formation in C. elegans is unclear. It is also unknown
      whether ATG-18 joins a lipid-transfer complex with ATG-2 as yeast
      Atg18 does.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether the yeast Atg2-Atg18 bridge can be transferred to
      ATG-18 or belongs to EPG-6 in metazoans.
    resolution: >-
      Compare ATG-2 binding and membrane-tethering activity of ATG-18 and
      EPG-6 in vitro, and map the step blocked in atg-18 versus epg-6
      mutants by electron microscopy.
    provenance:
      - reference_id: PMID:21802374
        supporting_text: >-
          EPG-6 directly interacts with ATG-2. epg-6 and atg-2 regulate
          progression of omegasomes to autophagosomes, and their loss of
          function causes accumulation of enlarged early autophagic
          structures.
