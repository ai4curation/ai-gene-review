knowledge_gaps:
  - gap_statement: >-
      It is unresolved whether mTORC2 itself phosphorylates the PKC turn motif and
      hydrophobic motif, or whether it acts indirectly, for example by enabling
      autophosphorylation of the C-terminal tail or by activating another kinase.
    boundary: >-
      Genetic ablation of RICTOR, SIN1 or mTOR abolishes PKCalpha turn-motif
      phosphorylation and blocks maturation, and mTORC2 can phosphorylate the
      corresponding Akt sites in vitro. Direct mTORC2 phosphorylation of the PKC turn
      motif in vitro has not been established in the cited work.
    status: OPEN
    gap_kind:
      - BIOLOGY
    significance: >-
      Determines whether mTORC2 is drawn as a kinase acting on PKC or as an indirect
      requirement, and so whether mTORC2 inhibitors act on PKC by removing a direct
      priming step.
    provenance:
      - reference_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000840.yaml
        supporting_text: Whether the role of mTORC2 is direct or indirect, via activation of an upstream kinase, is currently unclear.
      - reference_id: PMID:18566587
        supporting_text: Ablation of mTORC2 components (Rictor, Sin1 or mTOR) abolished phosphorylation on the TM of both PKCalpha and Akt and HM of Akt and decreased HM phosphorylation of PKCalpha.
  - gap_statement: >-
      How atypical PKCs become catalytically competent without HSP90-CDC37 and without
      DAG, and whether PDPK1 phosphorylation of aPKC is truly agonist-gated in vivo or
      constitutive, is not settled.
    boundary: >-
      Atypical PKCs do not co-immunoprecipitate with HSP90-CDC37, and PDPK1
      phosphorylates PKC zeta Thr410 in a PIP3-enhanced manner, but the maturation
      route of the aPKC tail is not defined.
    status: OPEN
    gap_kind:
      - BIOLOGY
    significance: >-
      The atypical variant's maturation sub-step cannot be modelled with confidence, so
      the module draws only the shared PDPK1 input for aPKC.
    provenance:
      - reference_id: PMID:19091746
        supporting_text: Co-immunoprecipitation studies reveal that conventional and novel, but not atypical, PKC isozymes bind the chaperones Hsp90 and Cdc37 through a PXXP-dependent mechanism.
