  variant_sets:
    - id: lysis_lysogeny_decision_circuit
      label: Temperate phage lysis-lysogeny decision circuit
      axis: regulatory signal integration and transcriptional switch
      selection: EXACTLY_ONE
      notes: Temperate phages evaluate host physiological state, multiplicity of infection, or extracellular phage-encoded peptide concentration to choose between lytic replication and lysogenic latency.
      variants:
        - id: lambdoid_cII_cI_cro_bistable_switch
          label: Lambdoid CII/CIII host-protease sensing and CI-Cro bistable switch (lambda/P22-type)
          module_type: BIOLOGICAL_PROCESS
          description: Phage-encoded CIII inhibits host FtsH (HflB) protease to stabilize the CII transcriptional activator at high multiplicity of infection; CII activates the pRE, pI, and paQ promoters to express the CI master repressor and Int integrase while Cro competes at oR/oL to drive lytic gene expression.
          parts:
            - order: 1
              role: CII/CIII commitment to latency establishment
              node:
                id: cii_ciii_latency_commitment
                label: CII transcriptional activation and CIII protease inhibition
                module_type: BIOLOGICAL_PROCESS
                annotons:
                  - id: cii_activator_activity
                    label: CII activation of lysogenic promoters pRE, pI, and paQ
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: DNA-binding transcription factor activity
                        term:
                          id: GO:0003700
                          label: DNA-binding transcription factor activity
                      gene_product:
                        preferred_term: cII (Escherichia phage lambda)
                        term:
                          id: UniProtKB:P03042
                          label: Regulatory protein cII
                      description: Lambdoid CII transcription activator (stabilized by CIII inhibition of host FtsH protease) that activates CI repressor and Int integrase transcription.
                    function:
                      preferred_term: DNA-binding transcription factor activity
                      term:
                        id: GO:0003700
                        label: DNA-binding transcription factor activity
                    processes:
                      - preferred_term: latency-replication decision
                        term:
                          id: GO:0098689
                          label: latency-replication decision
                      - preferred_term: establishment of viral latency
                        term:
                          id: GO:0019043
                          label: establishment of viral latency
                    locations:
                      - preferred_term: host cell cytoplasm
                        term:
                          id: GO:0030430
                          label: host cell cytoplasm
                    role_description: Integrates MOI and host protease status to activate transcription of the lysogenic repressor and integrase.
            - order: 2
              role: CI-Cro bistable operator maintenance and SOS induction
              node:
                id: ci_cro_bistable_maintenance
                label: CI repressor maintenance of latency and RecA-stimulated induction
                module_type: BIOLOGICAL_PROCESS
                annotons:
                  - id: ci_repressor_maintenance
                    label: CI master repressor operator binding and SOS autocleavage
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: DNA-binding transcription factor activity
                        term:
