id: MODULE:phage_temperate_latency_switch
title: Temperate Bacteriophage Lysis-Lysogeny Decision, Prophage Integration, and Induction
description: 'A reusable module capturing the regulatory decision (`GO:0098689`), establishment (`GO:0019043`), maintenance (`GO:0019044`), and induction/release (`GO:0019046`, `GO:0032359`) of viral latency (lysogeny) in temperate bacteriophages. Two orthogonal variant axes are modeled: (1) the bistable lysis-lysogeny decision circuit (`CI`/`Cro`/`CII`/`CIII` host-protease sensing in lambdoid phages, `C` repressor/Cox switch in P2-like phages, and the arbitrium `AimP`/`AimR`/`AimX` peptide quorum-sensing circuit in Bacillus SPbeta/phi3T phages), and (2) the prophage maintenance state (`GO:0075713` site-specific integrated chromosomal prophage via tyrosine/serine integrase vs. `GO:0075720` extrachromosomal circular or `GO:0075530` linear telomeric plasmid prophage in P1 and N15 vs. replicative transposition prophage integration via DDE transposase `GO:0004803` / `GO:0015074` in Mu-like phages).'
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:28099413
    title: Communication between viruses guides lysis-lysogeny decisions.
    statement: Bacillus phages phi3T and SPbeta use the arbitrium peptide signaling system (AimP peptide, AimR receptor transcription factor, and AimX non-coding RNA regulator) to guide the lysis-lysogeny decision across infection cycles.
    supporting_text: Here we show that viruses (phages) of the SPbeta group use a small-molecule communication system to coordinate lysis-lysogeny decisions.
  - source_id: file:projects/PHAGES.md
    title: Bacteriophage Genome & Module Curation Plan
    statement: Defines the temperate phage latency-replication decision and prophage maintenance variant sets and notes that GO uses general viral latency terms (`GO:0019042`) in place of "lysogeny".
    supporting_text: In phages, the **temperate latency module** (`GO:0098689` latency-replication decision, `GO:0075713` proviral integration, `GO:0032359` provirus excision) is **biologically absent** in obligately lytic genomes (T4, T7, φX174, MS2, φ29).
notes: Curated for the Bacteriophage Genome & Module Curation project. Gene Ontology does not contain terms labeled "lysogeny" or "prophage induction"; temperate phage curators must use the viral latency hierarchy (`GO:0098689` latency-replication decision, `GO:0019042` viral latency, `GO:0019043` establishment of viral latency, `GO:0075713` establishment of integrated proviral latency, `GO:0075720` establishment of episomal latency, `GO:0075530` establishment of latency as a linear episome, `GO:0019044` maintenance of viral latency, `GO:0019046` release from viral latency, and `GO:0032359` provirus excision).
module:
  id: phage_temperate_latency_switch
  label: Temperate Bacteriophage Lysis-Lysogeny Switch and Prophage Maintenance
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: latency-replication decision
      term:
        id: GO:0098689
        label: latency-replication decision
      description: Regulatory decision by a temperate bacteriophage between entering the lytic reproductive cycle or establishing dormant prophage latency.
    - preferred_term: viral latency
      term:
        id: GO:0019042
        label: viral latency
      description: Dormant persistence of the phage genome within the bacterial host (lysogeny).
    - preferred_term: release from viral latency
      term:
        id: GO:0019046
        label: release from viral latency
      description: Reactivation (prophage induction) of a dormant prophage into the lytic cycle.
