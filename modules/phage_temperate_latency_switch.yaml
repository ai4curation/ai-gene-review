                      - preferred_term: host cell cytoplasm
                        term:
                          id: GO:0030430
                          label: host cell cytoplasm
                    role_description: Silences lytic promoters during prophage maintenance and undergoes RecA*-stimulated cleavage upon host DNA damage to trigger prophage induction.
