                        term:
                          id: UniProtKB:P03034
                          label: Repressor protein cI
                      description: Master lysogenic repressor CI (and competing lytic repressor Cro) binding oR/oL operators to maintain viral latency until host SOS-activated RecA* stimulates CI autoproteolysis (`GO:0019046`).
                    function:
                      preferred_term: DNA-binding transcription factor activity
                      term:
                        id: GO:0003700
                        label: DNA-binding transcription factor activity
                    processes:
                      - preferred_term: latency-replication decision
                        term:
                          id: GO:0098689
                          label: latency-replication decision
