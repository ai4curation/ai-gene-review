id: MODULE:dmel_gtpbp3_mto1_complex
title: GTPBP3-MTO1 mitochondrial tRNA modification complex in Drosophila melanogaster
description: >-
  GTPBP3 and MTO1, the mitochondrial orthologs of bacterial MnmE and MnmG, act together to
  install a taurinomethyl group at the wobble uridine (U34) of several mitochondrial tRNAs,
  forming taurinomethyluridine (taum5U). This modification supports accurate decoding during
  mitochondrial translation. GTPBP3 is a GTPase that binds the methylene donor, and MTO1 is
  an FAD-dependent enzyme. In Drosophila the orthologs are CG18528 (GTPBP3) and CG4610 (MTO1).
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002142
  title: 'FlyBase gene group GBP3MC: Gtpbp3-mto1 complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as gtpbp3-mto1 complex (GBP3MC);
    this module models that group.
- source_id: GO:7770010
  title: GTPBP3-MTO1 complex
  statement: >-
    GO term grounding the module as GTPBP3-MTO1 complex.
notes: >-
  Modelled one part per subunit. Subunit functions are inferred by orthology to human GTPBP3
  and MTO1 and bacterial MnmE and MnmG; neither Drosophila protein has been characterized
  biochemically. GTPase activity is assigned to CG18528 on the basis of its conserved TrmE-type
  G domain. FlyBase groups realized by this module: GBP3MC (FBgg0002142). Participants were
  generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_gtpbp3_mto1_complex.yaml; none of the member genes has a gene review
  yet unless noted.
