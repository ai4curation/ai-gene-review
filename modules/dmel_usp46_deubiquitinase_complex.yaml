notes: >-
  GO has no specific term for the USP12/46-UAF1-WDR20 complex; the module is grounded to the
  generic peptidase complex term. FlyBase groups realized by this module: USP46-C (FBgg0001865).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_usp46_deubiquitinase_complex.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
