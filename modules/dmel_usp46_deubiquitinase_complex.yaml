id: MODULE:dmel_usp46_deubiquitinase_complex
title: Usp12/46 deubiquitinase complex in Drosophila melanogaster
description: >-
  Usp12-46 is the single Drosophila ortholog of the human ubiquitin-specific proteases USP12
  and USP46. As in humans, it forms a complex with two WD40 proteins, Uaf1 (WDR48) and Wdr20,
  which bind the catalytic domain and stimulate its deubiquitinase activity. In Drosophila,
  Usp12-46 with Uaf1 and Wdr20 has been reported to deubiquitylate and stabilize signalling
  components, including the Notch receptor and Arrow in Wingless signalling.
status: DRAFT
scope: CONCRETE
