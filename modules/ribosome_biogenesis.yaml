    - order: 5
      role: ITS1 cleavage separating the pre-40S and pre-60S particles
      node:
        id: its1_cleavage
        label: Endonucleolytic cleavage at ITS1 site 2 separates the small and large subunit precursors
        module_type: BIOLOGICAL_PROCESS
        description: >-
          In human cells ITS1 is cut first at site 2 (2a), which separates the 21S precursor of
          18S rRNA from the 32S precursor of 5.8S and 28S rRNA; an alternative route starts at
          site E. Cleavage needs RRP5 (PDCD11), NOL12, RBM28 and the large-subunit PeBoW
          protein BOP1, and is followed by 3'-5' trimming of the 21S precursor by the exosome
          and 5'-3' trimming by XRN2. The endonuclease that cuts site 2 has not been
          identified.
        concepts:
          - preferred_term: endonucleolytic cleavage in ITS1
            term:
              id: GO:0000447
              label: endonucleolytic cleavage in ITS1 to separate SSU-rRNA from 5.8S rRNA and LSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
        knowledge_gaps:
          - gap_statement: >-
              The endonuclease that cleaves human ITS1 at site 2 (2a) is unknown. Depletion of
              RNase MRP, which cuts the equivalent site A3 in yeast, causes no clear ITS1 defect
              in human cells, and the factors known to be required (RRP5, NOL12, RBM28, BOP1)
              have no nuclease activity.
            boundary: >-
              Firmly established: ITS1 removal starts with an endonucleolytic cleavage that needs
              large-subunit biogenesis factors and is followed by exonuclease trimming
              (PMID:23439679).
            gap_kind:
              - BIOLOGY
