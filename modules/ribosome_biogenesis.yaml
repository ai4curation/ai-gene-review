          AAA ATPase midasin (MDN1), recruited by SUMO-modified PELP1, remodels the nucleoplasmic
          pre-60S, which in yeast releases the GTPase Nug2 (human GNL2) from the NMD3 binding
          site and licenses export. ITS2 endonuclease cleavage by the LAS1L-NOL9 complex and
          the many other pre-60S factors are not on the RGD list and are not modelled.
