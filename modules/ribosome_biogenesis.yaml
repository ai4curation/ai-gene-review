id: MODULE:ribosome_biogenesis
title: Human cytoplasmic ribosome biogenesis — rDNA transcription by reference, box C/D and H/ACA snoRNP modification, the SSU processome and 5' ETS processing, exonucleolytic spacer removal by XRN2 and the nuclear exosome, ITS1 cleavage, nuclear pre-40S and pre-60S maturation, CRM1-dependent export, and cytoplasmic 40S and 60S maturation
description: >-
  Ribosome biogenesis builds the cytoplasmic 40S and 60S ribosomal subunits from four rRNAs
  and about 80 ribosomal proteins. In human cells RNA polymerase I transcribes the 47S
  precursor rRNA (pre-rRNA), in which the 18S, 5.8S and 28S rRNAs are separated by internal
  transcribed spacers (ITS1, ITS2) and flanked by external transcribed spacers (5' ETS,
  3' ETS); the 5S rRNA is made separately by RNA polymerase III. While it is transcribed,
  the pre-rRNA is modified at specific sites by small nucleolar ribonucleoproteins
  (snoRNPs): box C/D snoRNPs, whose catalytic subunit is the methyltransferase fibrillarin,
  add 2'-O-methyl groups, and box H/ACA snoRNPs, whose catalytic subunit is the
  pseudouridine synthase dyskerin, convert uridines to pseudouridines; the snoRNA in each
  particle selects the site by base pairing. The 5' part of the transcript assembles the
  small subunit (SSU) processome, a nucleolar particle built from the UTP-A and UTP-B
  subcomplexes, the U3 snoRNP, the MPP10 subcomplex, the BMS1-RCL1 GTPase pair and the PIN
  domain proteins UTP23 and UTP24, which folds the 18S rRNA domains and directs cleavages in
  the 5' ETS; the DEAH-box helicase DHX37 then releases the U3 snoRNA so that the central
  pseudoknot can form. Cleavage in ITS1 separates the pre-40S and pre-60S particles, and each
  endonucleolytic cleavage is followed by exonucleolytic trimming and spacer degradation by
  the 5'-3' exonuclease XRN2 and the nuclear RNA exosome with its helicase MTR4 and cofactors
  C1D and MPP6. The pre-60S particle matures in the nucleolus and nucleoplasm with the PeBoW
  complex (PES1, BOP1, WDR12) and the AAA ATPase midasin (MDN1); the pre-40S particle
  acquires late factors such as bystin (ENP1), PNO1, RRP12 and LTV1, with the endonuclease
  NOB1 bound in an inactive state. Both particles leave the nucleus through the nuclear pore
  by the exportin CRM1 (XPO1) and Ran-GTP, with NMD3 as the CRM1 adaptor of pre-60S and
  exportin 5 as a second pre-60S exportin. In the cytoplasm the RIO kinases and casein kinase
  1 delta and epsilon drive the release of the late pre-40S factors, and NOB1 cleaves the
  18S-E pre-rRNA at site 3 to form the 18S rRNA 3' end; on the 60S side, the GTPase EFL1 with
  SBDS removes the anti-association factor eIF6 and ERI1 trims the 3' end of the 5.8S rRNA,
  giving subunits that can join in translation initiation.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001066
    title: ribosome biogenesis pathway
    statement: >-
      The RGD Pathway Ontology diagram for ribosome biogenesis. It draws pre-rRNA transcription
      by Pol I, 5' ETS and ITS1 cleavage/processing, box C/D and box H/ACA modification, RNA
      helicases, the pre-40S and pre-60S particles, Mdn1 and Gnl2 on pre-60S, Nmd3, Ltv1 and
      Xpo1 export with Ran, Xpo5, Nup214 and Nup88, cytoplasmic maturation by Nob1 and Eri1,
      and Eif6 release from 60S with Gnb2l1 (RACK1) and Prkcb. This module covers the pathway
      except the ribosomal proteins (modelled in cytoplasmic_ribosome) and Pol I and Pol III
      transcription (modelled in rna_polymerase_i_transcription and
      rna_polymerase_iii_transcription). Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0001066.yaml and item 5 of the translation and ribosome biogenesis split
      plan in broad_pathway_split_plans.md).
  - source_id: GO:0042254
    title: ribosome biogenesis
    statement: >-
      The GO process mapped to PW:0001066 (skos:closeMatch, from the PW definition
      cross-reference and a lexical match, projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml).
      It is the module concept.
  - source_id: PMID:25346433
    title: An overview of pre-ribosomal RNA processing in eukaryotes.
    statement: In human cells the ITS1 is cleaved first, and the pre-40S particle is exported before the final 18S rRNA 3' end is made by NOB1 in the cytoplasm.
    supporting_text: After nuclear export, the PIN domain-containing protein NOB1 likely cleaves the 18S-E pre-rRNA at site 3, which yields the mature 18S rRNA.
  - source_id: PMID:25346433
    title: An overview of pre-ribosomal RNA processing in eukaryotes.
    statement: XRN2 trims the products of every intermediate endonucleolytic cleavage, so exonucleolytic processing is modelled as one step fed by the cleavage steps.
    supporting_text: Therefore, processing by XRN2 follows all the intermediate endonucleolytic cleavages in pre-rRNA processing, namely A′, A0 in the 5′-ETS, E and 2 in the ITS1, and 4 in the ITS2.
  - source_id: PMID:12773398
    title: Coordinated nuclear export of 60S ribosomal subunits and NMD3 in vertebrates.
    statement: Both subunits are exported by CRM1 and Ran-GTP in vertebrate cells.
    supporting_text: in vertebrate cells, transport of both subunits requires the export receptor CRM1 and Ran.GTP
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001066 (ribosome biogenesis pathway,
  checked in .cache/rgd_pw/pw.obo) through the RGD_PATHWAY_ONTOLOGY project's diagram->module
  route (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, flagged broad), as
  item 5 of the translation and ribosome biogenesis split plan in
  projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md. The mapped GO process
  GO:0042254 ribosome biogenesis was checked in go-basic.obo (2026-07-26). RGD curates 138
  human genes to PW:0001066 (non-IEA rows in .cache/rgd_pw/homo_genes_pw): 81 ribosomal
  proteins, the three ubiquitin/FUBI-ribosomal protein fusions (FAU, UBA52, RPS27A), RACK1,
  and 57 other genes. Of those 57, 46 are participants here: BMS1 BOP1 BYSL C1D CSNK1D CSNK1E
  DHX37 DIS3 DKC1 EIF6 ERI1 EXOSC10 EXOSC5 FBL FCF1 GAR1 HEATR1 IMP3 IMP4 LTV1 MDN1 MPHOSPH10
  MTREX NHP2 NMD3 NOB1 NOL12 NOP10 NOP56 NOP58 PDCD11 PES1 PNO1 RAN RBM28 RCL1 RIOK1 RIOK2
  RIOK3 RRP12 SNU13 UTP23 WDR3 XPO1 XPO5 XRN2. Four participants were added outside the RGD
  list, each with cited human evidence: WDR12 (third PeBoW subunit, PMID:16738141 and
  PMID:17353269), MPHOSPH6 (the exosome cofactor MPP6 that RGD's text names, PMID:17412707),
  and EFL1 and SBDS (the eIF6 release machinery, PMID:21536732). That makes 50 gene products,
  so the 40S and 60S branches are kept in one module rather than split into sub-modules; the
  deferrals are listed below. Molecular functions were taken from each protein's
  experimental human GOA rows in QuickGO (November 2026) and, where a gene review exists, its
  core functions (DKC1, CSNK1D, EFL1). Curator choices without a matching experimental GOA
  function or process row, each explained in its annoton: RNA 2'-O-methyltransferase activity
  of FBL and of the box C/D complex (IDA rRNA methylation process row, IBA rRNA
  methyltransferase and Rhea-derived IEA rows only), ATP hydrolysis activity chosen for DHX37
  over the helicase term it lacks, and the processes of XPO5 (large subunit export,
  PMID:21048991), LTV1 (small subunit export, following RGD) and CSNK1D/CSNK1E (maturation of
  SSU-rRNA, PMID:24424021). Many units carry no function because their only experimental
  function rows are proteome-wide RNA binding (HDA); this is stated in each annoton. FBL's
  reaction is grounded to RHEA:48628 (from the FBL UniProt record) with ChEBI labels checked
  in OLS. UniProt accessions and recommended names are from the local gene folders (CSNK1D,
  DKC1, EFL1) and UniProt REST (November 2026).

  Boundary decisions. (1) Ribosomal proteins, RACK1 and the three fusion genes are modelled
  once in cytoplasmic_ribosome and are not units here. Ribosome biogenesis is not assigned to
  them: they are built into the product, and depletion phenotypes show necessity, not that they
  perform a step; none was judged a bona fide assembly factor. (2) rRNAs and snoRNAs are RNAs,
  not gene products in this model; the snoRNP complexes stand for the particles, and only their
  proteins are units. No snoRNA or microRNA host gene is a participant. (3) Pol I transcription
  is a module_ref part (rna_polymerase_i_transcription). Pol III transcription of 5S rRNA
  (rna_polymerase_iii_transcription), 5S RNP assembly and the 5S rRNA partners RGD draws are
  outside this module. (4) The U3 snoRNP is a box C/D snoRNP: its core proteins are the
  box_cd_snornp annoton, and the U3-specific RRP9 (U3-55K) is not enumerated. (5) The SSU
  processome is one complex annoton with the nine RGD-listed subunits. Its other UTP-A, UTP-B
  and UTP-C subunits and the rest of the human processome (UTP4, WDR43, UTP15, NOL6, PWP2, TBL3,
  UTP18, WDR36, UTP6, RRP7A, UTP14A and others, several on RGD's KEGG-derived IEA list) are
  members not enumerated, to keep the module at the depth RGD curates; a later revision could
  list them from the human processome structures (PMID:34516797). (6) The nuclear exosome is a
  minimal complex annoton: the RGD-listed EXOSC10, DIS3, EXOSC5, MTREX and C1D plus MPHOSPH6;
  the other eight core subunits are not enumerated. There is no human exosome module
  (dmel_rna_exosome is a fly analogue and was used for structure only). (7) RNase MRP is not
  modelled. None of its protein subunits is on the RGD-curated list (POP1, POP4, POP5, POP7,
  RPP25, RPP30, RPP38 and RPP40 come only from the KEGG IEA import), its RNA is not a gene
  product here, and in human cells its knockdown gave no clear ITS1 processing defect
  (PMID:23439679, "RNA interference-mediated knockdown of the endoribonuclease MRP did not
  result in a clear defect in ITS1 processing"); dmel_rnase_p_mrp is a structural analogue
  only. (8) PALS2 is excluded as a probable RGD gene mix-up. RGD's diagram text names the
  exosome cofactors "Dis3 and associated factors Mpp6, C1D and Sklv2l2", and the exosome
  cofactor MPP6 is M-phase phosphoprotein 6 (MPHOSPH6), whereas PALS2's former symbol MPP6
  means membrane palmitoylated protein 6, a MAGUK scaffold with no ribosome biogenesis role.
  MPHOSPH6 is added instead. (9) PRKCB is excluded. RGD draws PKC phosphorylating eIF6 to
  release it with RACK1, but in mammalian cells eIF6 release is catalysed by EFL1 and SBDS and
  does not need eIF6 Ser235 phosphorylation (PMID:21536732, quoted on efl1_sbds_eif6_release);
  any PKC role is regulatory and the isoform was not established. (10) NUP214 and NUP88 are
  excluded: they are general nuclear pore components, NUP88 is already a part of
  nuclear_pore_transport_core, and the only human ribosome evidence found was NUP214 among
  hits of an RNAi screen for subunit export (PMID:21048991). (11) GNL2 is deferred: RGD cites a
  yeast study of Nug2 and Rea1 (PMID:24240281), and no human experimental row or cached human
  paper places GNL2 in pre-60S maturation. (12) The DEAD/DEAH helicases DDX10, DDX18, DDX24,
  DDX56 and DHX15 are deferred: RGD's only source is a helicase review centred on yeast, and
  their human GOA rows are proteome-wide RNA binding and TAS helicase activity, with no
  experimental row or cached human study placing them in a ribosome biogenesis step. DHX15 is
  also the spliceosomal Prp43 homologue. DHX37 is kept on direct human evidence. (13) Factors
  not on the RGD-curated list and not added: the other pre-60S factors (for example GNL3,
  GNL3L, GTPBP4, NVL, AFG2A, LSG1, LAS1L-NOL9 for ITS2, the PELP1-TEX10-WDR18 rixosome) and
  pre-40S factors (TSR1), the NXF/NXT mRNA exporters, NAT10, EMG1, TCOF1, DROSHA and TAF9 from
  the KEGG IEA list. They are candidates for a revision with human evidence. (14) Exonucleolytic
  processing is one part fed by the cleavage steps (PROVIDES_INPUT_FOR) rather than a step in
  the PRECEDES chain, because XRN2 and the exosome act after every endonucleolytic cleavage
  (PMID:25346433). ERI1 is the cytoplasmic 5.8S trimming step and sits with 60S maturation.
  (15) Order. Parts are linked by PRECEDES as RGD and PMID:25346433 describe: transcription,
  co-transcriptional modification and SSU processome assembly, ITS1 cleavage, nuclear pre-40S
  and pre-60S maturation, export, and cytoplasmic 40S and 60S maturation. Within cytoplasmic
  40S maturation, CK1- and RIOK2-dependent release precedes the RIOK1-dependent release of NOB1
  and PNO1 and site 3 cleavage (PMID:22072790). (16) Two knowledge gaps are recorded: the
  nucleases for the 5' ETS sites and for ITS1 site 2 are not identified in human cells.

  GO-CAM links. gocams/index.tsv was searched for all participants and the excluded RGD genes.
  No GO-CAM models a cytoplasmic ribosome biogenesis activity of any of them, so there are no
  gocam_associations. Hits outside this module were not linked: DDX56 protein sequestering
  activity in an FMDV 3A model (gomodel:62e3212700001602), RAN G protein activity in PKM2
  nuclear export (gomodel:61f34dd300000863), XPO1 in m6A mRNA export
  (gomodel:63894f2500001748) and RIOK3 in ribosome stalling-induced 40S degradation
  (gomodel:68b0f0d000005302). The seed's best_gocam (gomodel:62900b6400000022, PARP16) concerns
  ribosomal proteins and belongs to cytoplasmic_ribosome. PANTHER family ids and PTNs are not
  asserted, and no ontology terms are requested: GO has terms for each modelled step.

  Possible upstream issues (queries only, full texts not read). (a) RGD annotates PALS2 to
  PW:0001066 (TAS, PMID:25346433) where MPHOSPH6 appears intended, see (8). (b) NUP214 has an
  IDA row for nuclear export signal receptor activity (PMID:10358091); a nucleoporin is not an
  export receptor, and the row may describe NES binding by the FG region. The cached abstract
  describes a new Rev-NES-binding protein it names NLP-1 (nucleoporin-like protein 1), not
  NUP214, so the row is also a wrong-gene candidate; the full text, which may assay NUP214 as a
  comparator, was not read, so this stays a query. (c) GOA has no
  ribosomal large subunit export row for XPO5 although PMID:21048991 shows it, and no
  maturation of SSU-rRNA row for CSNK1D or CSNK1E despite PMID:24424021.
module:
  id: ribosome_biogenesis
  label: Human cytoplasmic ribosome biogenesis
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: ribosome biogenesis
      term:
        id: GO:0042254
        label: ribosome biogenesis
      description: The GO process mapped to PW:0001066.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
  parts:
    - order: 1
      role: pre-rRNA transcription by RNA polymerase I (by reference)
      node:
        id: prerrna_transcription
        label: RNA polymerase I transcribes the 47S pre-rRNA in the nucleolus
        module_type: BIOLOGICAL_PROCESS
        module_ref: rna_polymerase_i_transcription
        description: >-
          Pol I transcription of the rDNA, modelled in rna_polymerase_i_transcription and not
          repeated here. The 5S rRNA is transcribed by RNA polymerase III
          (rna_polymerase_iii_transcription); its maturation and its partners are not modelled
          in this module.
    - order: 2
      role: snoRNA-guided pre-rRNA modification
      node:
        id: snorna_guided_modification
        label: Box C/D snoRNPs 2'-O-methylate and box H/ACA snoRNPs pseudouridylate the pre-rRNA
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Co-transcriptional modification of the pre-rRNA at sites chosen by base pairing of
          the guide snoRNA. Each box C/D snoRNP carries two copies of the core proteins SNU13
          (15.5K), NOP56, NOP58 and fibrillarin, the 2'-O-methyltransferase; each box H/ACA
          snoRNP carries dyskerin, the pseudouridine synthase, with NOP10, NHP2 and GAR1.
          Several snoRNPs (U3, U8, U13, U14 among the box C/D) act as chaperones of pre-rRNA
          folding and cleavage rather than as guides; U3 is the SSU processome's snoRNP. The
          snoRNAs are RNAs, not gene products in this model, and snoRNP assembly factors are
          out of scope.
        concepts:
          - preferred_term: rRNA modification
            term:
              id: GO:0000154
              label: rRNA modification
        annotons:
          - id: box_cd_snornp
            label: Box C/D snoRNP (FBL, NOP56, NOP58, SNU13) 2'-O-methylates pre-rRNA
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: box C/D snoRNP
                term:
                  id: GO:0031428
                  label: box C/D methylation guide snoRNP complex
                active_units:
                  - id: fbl_unit
                    label: FBL (fibrillarin)
                    role: Catalytic subunit; S-adenosyl-L-methionine-dependent 2'-O-methyltransferase positioned on the target nucleotide by the guide snoRNA.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: FBL
                        term:
                          id: UniProtKB:P22087
                          label: rRNA 2'-O-methyltransferase fibrillarin
                    function:
                      preferred_term: RNA 2'-O-methyltransferase activity
                      term:
                        id: GO:0062105
                        label: RNA 2'-O-methyltransferase activity
                      substrates:
                        - preferred_term: ribonucleotide residue in rRNA
                          term:
                            id: CHEBI:90675
                            label: ribonucleotide residue(1-)
                        - preferred_term: S-adenosyl-L-methionine
                          term:
                            id: CHEBI:59789
                            label: S-adenosyl-L-methionine zwitterion
                      products:
                        - preferred_term: 2'-O-methylribonucleotide residue in rRNA
                          term:
                            id: CHEBI:90676
                            label: 2'-O-methylribonucleotide(1-) residue
                        - preferred_term: S-adenosyl-L-homocysteine
                          term:
                            id: CHEBI:57856
                            label: S-adenosyl-L-homocysteine zwitterion
                        - preferred_term: hydron
                          term:
                            id: CHEBI:15378
                            label: hydron
                      evidence:
                        - source_id: RHEA:48628
                          statement: >-
                            a ribonucleotide in rRNA + S-adenosyl-L-methionine = a
                            2'-O-methylribonucleotide in rRNA + S-adenosyl-L-homocysteine + H(+),
                            the rRNA reaction on the FBL UniProt record (P22087, by similarity to
                            yeast Nop1) and one of the Rhea cross-references of GO:0062105.
                  - id: nop56_unit
                    label: NOP56
                    role: Core box C/D protein bound to the C'/D' motif; with NOP58 forms the coiled-coil platform that holds fibrillarin.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NOP56
                        term:
                          id: UniProtKB:O00567
                          label: Nucleolar protein 56
                    function:
                      preferred_term: snoRNA binding
                      term:
                        id: GO:0030515
                        label: snoRNA binding
                  - id: nop58_unit
                    label: NOP58
                    role: Core box C/D protein bound to the C/D motif.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NOP58
                        term:
                          id: UniProtKB:Q9Y2X3
                          label: Nucleolar protein 58
                    function:
                      preferred_term: snoRNA binding
                      term:
                        id: GO:0030515
                        label: snoRNA binding
                  - id: snu13_unit
                    label: SNU13 (15.5K)
                    role: Binds the kink-turn formed by boxes C and D and nucleates snoRNP assembly; also a U4/U6.U5 tri-snRNP protein.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SNU13
                        term:
                          id: UniProtKB:P55769
                          label: NHP2-like protein 1
                    function:
                      preferred_term: box C/D sno(s)RNA binding
                      term:
                        id: GO:0034512
                        label: box C/D sno(s)RNA binding
            function:
              preferred_term: RNA 2'-O-methyltransferase activity
              term:
                id: GO:0062105
                label: RNA 2'-O-methyltransferase activity
            processes:
              - preferred_term: snoRNA guided rRNA 2'-O-methylation
                term:
                  id: GO:0000452
                  label: snoRNA guided rRNA 2'-O-methylation
            locations:
              - preferred_term: nucleolus
                term:
                  id: GO:0005730
                  label: nucleolus
            role_description: >-
              Fibrillarin is the catalytic subunit (RGD's description says so, and UniProt
              records the rRNA 2'-O-methylation reaction). Its experimental human GOA rows are
              rRNA methylation (IDA, PMID:30540930) as a process and histone H2AQ104
              methyltransferase activity as a function; the RNA 2'-O-methyltransferase activity
              is a curator choice resting on the IDA rRNA methylation row, the IBA rRNA
              methyltransferase row and the Rhea-derived row, and it is placed on FBL and on
              the complex, not on the other subunits. NOP56 and NOP58 carry snoRNA binding
              (IDA, PMID:17636026) and SNU13 box C/D sno(s)RNA binding (IDA, PMID:11081632).
              The histone glutamine methylation of fibrillarin, which acts on rDNA chromatin, is
              outside this module.
            evidence:
              - source_id: PMID:30540930
                statement: Human fibrillarin catalyses 2'-O-methylation of pre-rRNA as well as histone H2A Q104 methylation.
                supporting_text: Fibrillarin (FBL) is a dual-function nucleolar protein that catalyzes 2'-O methylation of pre-rRNA and methylation of histone H2A at glutamine 104
              - source_id: PMID:24550520
                statement: The core box C/D proteins are SNU13, NOP56, NOP58 and fibrillarin; the U3 snoRNP adds the U3-specific RRP9.
                supporting_text: The U3 snoRNP contains the U3 snoRNA, the U3-specific protein Rrp9 (U3-55K in humans), and the core box C/D proteins, Snu13 (15.5K), Nop56, Nop58, and Nop1 (fibrillarin)
              - source_id: PMID:11081632
                statement: The 15.5K protein binds the box C/D motif.
                supporting_text: the box C/D motif binds Snu13p/ 15.5 kD in vitro
              - source_id: PMID:17636026
                statement: Box C/D snoRNPs are required for processing and modification of rRNA.
                supporting_text: The box C/D small nucleolar RNPs (snoRNPs) are essential for the processing and modification of rRNA.
          - id: box_haca_snornp
            label: Box H/ACA snoRNP (DKC1, NOP10, NHP2, GAR1) pseudouridylates pre-rRNA
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: box H/ACA snoRNP
                term:
                  id: GO:0031429
                  label: box H/ACA snoRNP complex
                active_units:
                  - id: dkc1_unit
                    label: DKC1 (dyskerin)
                    role: Catalytic subunit; pseudouridine synthase that isomerises the target uridine positioned by the guide snoRNA.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: DKC1
                        term:
                          id: UniProtKB:O60832
                          label: H/ACA ribonucleoprotein complex subunit DKC1
                    function:
                      preferred_term: pseudouridine synthase activity
                      term:
                        id: GO:0009982
                        label: pseudouridine synthase activity
                  - id: nop10_unit
                    label: NOP10
                    role: Core H/ACA protein bound to dyskerin.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NOP10
                        term:
                          id: UniProtKB:Q9NPE3
                          label: H/ACA ribonucleoprotein complex subunit 3
                    function:
                      preferred_term: box H/ACA snoRNA binding
                      term:
                        id: GO:0034513
                        label: box H/ACA snoRNA binding
                  - id: nhp2_unit
                    label: NHP2
                    role: Core H/ACA protein that binds the snoRNA hairpin.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NHP2
                        term:
                          id: UniProtKB:Q9NX24
                          label: H/ACA ribonucleoprotein complex subunit 2
                    function:
                      preferred_term: box H/ACA snoRNA binding
                      term:
                        id: GO:0034513
                        label: box H/ACA snoRNA binding
                  - id: gar1_unit
                    label: GAR1
                    role: Core H/ACA protein that joins the assembled particle and promotes substrate turnover.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: GAR1
                        term:
                          id: UniProtKB:Q9NY12
                          label: H/ACA ribonucleoprotein complex subunit 1
                    function:
                      preferred_term: box H/ACA snoRNA binding
                      term:
                        id: GO:0034513
                        label: box H/ACA snoRNA binding
            function:
              preferred_term: pseudouridine synthase activity
              term:
                id: GO:0009982
                label: pseudouridine synthase activity
            processes:
              - preferred_term: snoRNA guided rRNA pseudouridine synthesis
                term:
                  id: GO:0000454
                  label: snoRNA guided rRNA pseudouridine synthesis
            locations:
              - preferred_term: nucleolus
                term:
                  id: GO:0005730
                  label: nucleolus
            role_description: >-
              Dyskerin carries pseudouridine synthase activity (IMP, PMID:25219674), the core
              function of the DKC1 gene review (genes/human/DKC1), which gives snoRNA guided
              rRNA pseudouridine synthesis as its process. NOP10, NHP2 and GAR1 carry box H/ACA
              snoRNA binding (IPI, PMID:18082603 and PMID:10757788) and no catalytic function.
              The same four proteins form the H/ACA part of telomerase, which is outside this
