                supporting_text: SBDS and the GTPase elongation factor-like 1 (EFL1) directly catalyze eIF6 removal in mammalian cells by a mechanism that requires GTP binding and hydrolysis by EFL1 but not phosphorylation of eIF6 Ser 235
          - id: sbds_eif6_release
