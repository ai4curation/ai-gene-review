                  id: GO:0005730
                  label: nucleolus
            role_description: >-
              The nine units are the SSU processome proteins on the RGD list. All carry
              ribosomal small subunit biogenesis from the human SSU processome structures (IDA,
              PMID:34516797) and were tested by depletion in PMID:24550520; their experimental
              molecular-function rows are only RNA binding from proteome-wide screens (HDA), so
              no unit and not the complex is given a molecular function. BMS1 is a GTPase and
              UTP23 and UTP24 are PIN-domain proteins by sequence and by analogy to yeast, but
              no human experimental row supports a GTPase or nuclease function, so none is
              asserted. The other UTP-A, UTP-B and UTP-C subunits (UTP4, WDR43, UTP15, NOL6,
              PWP2, TBL3, UTP18, WDR36, UTP6, RRP7A and others), RRP9 and the many further
              processome proteins of the human structures are members of the complex that RGD
              does not list; they are not enumerated (see notes).
            evidence:
              - source_id: PMID:34516797
                statement: The human SSU processome couples RNA folding to cleavage and processing in early small subunit maturation.
                supporting_text: The human small subunit processome mediates early maturation of the small ribosomal subunit by coupling RNA folding to subsequent RNA cleavage and processing steps.
              - source_id: PMID:24550520
                statement: UTP-A, UTP-B, U3 snoRNP, BMS1/RCL1, MPP10 subcomplex, UTP23 and UTP24 are all needed for 18S rRNA production in human cells.
