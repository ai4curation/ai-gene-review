    - order: 4
      role: exonucleolytic trimming and spacer degradation
      node:
        id: exonucleolytic_processing
        label: XRN2 and the nuclear exosome trim pre-rRNA ends and degrade excised spacers after each endonucleolytic cleavage
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Every endonucleolytic cleavage in human pre-rRNA processing is followed by
          exonucleolytic processing. The 5'-3' exonuclease XRN2 trims downstream products and
          degrades excised 5' ETS and ITS1 fragments from their 5' ends; the nuclear RNA
          exosome, with its catalytic subunits EXOSC10 (RRP6) and DIS3, the helicase MTR4 and
          the cofactors C1D and MPP6, degrades the 5' ETS A'-A0 fragment, trims the 18S-E
          precursor 3' end in ITS1 and processes the 3' end of 5.8S rRNA from ITS2. Final
          cytoplasmic trimming of 5.8S by ERI1 is in cytoplasmic_60s_maturation. RNase MRP is
          not modelled (see notes).
