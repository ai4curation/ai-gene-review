      role: cytoplasmic 60S maturation
      node:
        id: cytoplasmic_60s_maturation
        label: EFL1 and SBDS release eIF6, and ERI1 trims the 5.8S rRNA 3' end
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Exported pre-60S particles carry eIF6, which binds the intersubunit face and prevents
          joining with 40S subunits. The GTPase EFL1, with SBDS, removes eIF6 in a step that
          needs GTP binding and hydrolysis by EFL1, licensing the 60S subunit for translation.
          The 3'-5' exonuclease ERI1 removes the last few nucleotides from the 3' end of the
          5.8S rRNA precursor in the cytoplasm. Release of NMD3 by LSG1 and of other shuttling
          factors is not modelled.
        concepts:
          - preferred_term: cytosolic ribosome assembly
            term:
              id: GO:0042256
              label: cytosolic ribosome assembly
        annotons:
          - id: eif6_antiassociation
            label: EIF6 binds the 60S intersubunit face and blocks premature subunit joining
            participant:
