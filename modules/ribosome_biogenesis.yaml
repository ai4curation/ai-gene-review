                  label: cytosolic ribosome assembly
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              EIF6 carries ribosome binding (IDA) and cytosolic ribosome assembly (IMP), both
              from PMID:21536732. It joins pre-60S in the nucleolus; it is placed here because
              its removal is the modelled step. Despite its name it is a 60S biogenesis factor,
              not part of translation_initiation.
            evidence:
              - source_id: PMID:21536732
                statement: eIF6 removal is critical for late cytoplasmic 60S maturation.
                supporting_text: Removal of the assembly factor eukaryotic initiation factor 6 (eIF6) is critical for late cytoplasmic maturation of 60S ribosomal subunits.
