    - order: 6
      role: nuclear pre-60S maturation
      node:
        id: nuclear_pre60s_maturation
        label: The PeBoW complex and midasin drive nucleolar and nucleoplasmic pre-60S maturation and 32S processing
        module_type: BIOLOGICAL_PROCESS
        description: >-
          After ITS1 cleavage the pre-60S particle matures through nucleolar and nucleoplasmic
          intermediates while ITS2 is removed from the 32S pre-rRNA to give the 5.8S and 28S
