                statement: The three core H/ACA-motif binding proteins (dyskerin, NHP2, NOP10) are shared with telomerase.
                supporting_text: All three core H/ACA-motif binding proteins are telomerase holoenzyme components
    - order: 3
      role: SSU processome assembly and 5' ETS processing
      node:
        id: ssu_processome
        label: The SSU processome folds the 5' part of the pre-rRNA, directs 5' ETS cleavages, and DHX37 releases the U3 snoRNA
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The small subunit processome assembles on the 5' ETS and 18S rRNA domains of the
          nascent transcript. UTP-A (tUTP), recruited first and linking processing to Pol I
          transcription, is the only subcomplex essential for the metazoan-specific A'
          cleavage; UTP-B, the U3 snoRNP (a box C/D snoRNP with the U3-specific RRP9), the
          MPP10-IMP3-IMP4 subcomplex, the BMS1-RCL1 pair and the PIN domain proteins UTP23
          and UTP24 are needed for cleavages at A0 and site 1 that release the 18S 5' end.
          Structures of the human particle show that the RNA folding state is coupled to the
          enzymes that act on it: targeted exosome degradation of the 5' ETS,
          protein-guided endonucleolytic cleavage and controlled unwinding. The DEAH-box
          helicase DHX37 then removes the U3 snoRNA, allowing the central pseudoknot of the
          small subunit to form. The identity of the endonuclease for each 5' ETS site is not
          settled in human cells (UTP24 is a candidate; see the knowledge gap).
        concepts:
          - preferred_term: maturation of SSU-rRNA from tricistronic rRNA transcript
            term:
              id: GO:0000462
              label: maturation of SSU-rRNA from tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
          - preferred_term: endonucleolytic cleavage in 5'-ETS
            term:
              id: GO:0000480
              label: endonucleolytic cleavage in 5'-ETS of tricistronic rRNA transcript (SSU-rRNA, 5.8S rRNA, LSU-rRNA)
        knowledge_gaps:
          - gap_statement: >-
              The endonucleases that cut the human pre-rRNA at 5' ETS sites A' and A0 and at
              site 1 are not identified. UTP23 and UTP24 are PIN-domain proteins of the SSU
              processome whose depletion blocks 18S rRNA production, but the cited human work
              shows no cleavage by either protein, and A' cleavage, which needs only UTP-A, has no
              assigned nuclease.
            boundary: >-
              Firmly established: the cleavages and their order are mapped, and the UTP-A,
              UTP-B, U3 snoRNP, MPP10, BMS1-RCL1, UTP23 and UTP24 components are required for
              them (PMID:24550520).
            gap_kind:
              - BIOLOGY
