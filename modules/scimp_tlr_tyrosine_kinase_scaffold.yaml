notes: >-
  Evidence is mostly from mouse macrophages (bone-marrow-derived and RAW264.7); human support is a
  THP-1 experiment (PMID:35337798) and the conserved human TLR4 Y674 (PMID:37058370). Human gene
  products are used as members for consistency with tlr4_md2_lps_signaling. SCIMP is
  immune-restricted, so the branch is specific to antigen-presenting cells. GRB2 and SLP65 (BLNK)
  also dock on phospho-SCIMP after LPS, but what they contribute to TLR output is unknown, so they
  are not modelled as parts. No production GO-CAM includes SCIMP. The same scaffold acts downstream
  of TLR1/2, TLR3 and TLR7 and of Dectin-1, but receptor binding and kinase recruitment have only
  been shown for TLR4 (and TLR2 binding), so TLR4 is the modelled receptor.
