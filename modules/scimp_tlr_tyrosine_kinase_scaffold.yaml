id: MODULE:scimp_tlr_tyrosine_kinase_scaffold
title: SCIMP-scaffolded TLR tyrosine phosphorylation module
description: >-
  A non-TIR adaptor branch of Toll-like receptor signalling in macrophages. After LPS activates
  TLR4 (see modules/tlr4_md2_lps_signaling.yaml), the palmitoylated transmembrane adaptor SCIMP
  binds the TLR4 TIR domain. SCIMP carries the Src-family kinase LYN constitutively on its
  proline-rich region and, once its tyrosines are phosphorylated, recruits SYK through both SYK SH2
  domains. LYN and SYK phosphorylate TLR4 on its TIR domain (mouse Y672, human Y674), and SCIMP
  recruits ERK1/2 to TLR4 in membrane ruffles, leading to c-FOS activation and a selective IL-6 and
  IL-12p40 response. CSK, docking on a separate SCIMP phosphotyrosine, provides negative feedback.
  The branch runs alongside the TIRAP-MYD88 and TRAM-TRIF branches and does not replace them.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: PMID:28098138
  statement: SCIMP is a non-TIR adaptor that binds the TLR4 TIR domain after LPS stimulation.
  supporting_text: SCIMP is a non-TIR-containing adaptor, binding directly to the TLR4-TIR domain in
    response to lipopolysaccharide.
