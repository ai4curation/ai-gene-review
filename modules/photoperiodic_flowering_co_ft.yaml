id: MODULE:photoperiodic_flowering_co_ft
title: Photoperiodic (long-day) flowering via the CONSTANS-FLOWERING LOCUS T pathway (Arabidopsis)
description: >-
  The external-coincidence mechanism by which Arabidopsis measures day length and converts long days
  into flowering. In leaf phloem companion cells the morning-phased Dof repressors (CYCLING DOF FACTORs,
  represented by CDF1) bind the CONSTANS (CO) and FLOWERING LOCUS T (FT) promoters and repress them,
  partly by recruiting TOPLESS. In long-day afternoons the clock-phased FKF1 and GIGANTEA (GI)
  proteins coincide with light; blue-light activation of the FKF1 LOV domain promotes FKF1-GI complex
  formation on the CO promoter and SCF(FKF1)-dependent degradation of the CDFs, relieving CO
  repression. CO protein is unstable in the dark because the COP1-SPA E3 ubiquitin ligase targets it
  for proteasomal degradation; in the light, photoactivated CRY2 (blue) and phyA (far-red) inhibit
  COP1-SPA and FKF1 binds and stabilizes CO, so CO protein accumulates only when CO mRNA expression
  overlaps with light at the end of a long day. CO, in an NF-Y-like trimer with NF-YB/NF-YC, binds
  CORE (CCACA) elements and activates FT transcription in companion cells. FT protein (florigen) moves
  through the phloem to the shoot apical meristem, where 14-3-3 proteins bridge it to the
  phosphorylated bZIP transcription factor FD; this florigen activation complex activates floral
  integrator and floral meristem identity genes such as SOC1 and AP1, committing the meristem to
  flowering. The circadian oscillator that phases GI, FKF1, CDF and CO expression, phytochrome-mediated
  photomorphogenesis, FT transport machinery and the vernalization/autonomous pathways are outside
  this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:17872410
    title: FKF1 and GIGANTEA complex formation is required for day-length measurement in Arabidopsis.
    statement: Blue-light-dependent FKF1-GI complex on the CO promoter controls CDF1 stability and CO timing.
    supporting_text: >-
      Thus, the FKF1-GI complex forms on the CO promoter in late afternoon to regulate CO expression,
      providing a mechanistic view of how the coincidence of light with circadian timing regulates
      photoperiodic flowering.
  - source_id: PMID:22628657
    title: FKF1 conveys timing information for CONSTANS stabilization in photoperiodic flowering.
    statement: FKF1 both stabilizes CO protein and removes CDF1 repressors from CO and FT.
    supporting_text: >-
      In addition, FKF1 simultaneously removes CYCLING DOF FACTOR 1 (CDF1), which represses CO and
      FLOWERING LOCUS T (FT) transcription.
  - source_id: PMID:18296627
    title: COP1-mediated ubiquitination of CONSTANS is implicated in cryptochrome regulation of flowering
      in Arabidopsis.
    statement: CO is degraded in darkness by COP1, stabilized by cryptochrome signalling, and activates FT in
      leaves; FT protein moves to the shoot apex.
    supporting_text: >-
      Under LDs, the transcription of FLOWERING LOCUS T (FT) is activated by CONSTANS (CO) in leaf, and
      the FT protein moves to the shoot apex to induce flowering.
  - source_id: PMID:17446353
    title: FT protein movement contributes to long-distance signaling in floral induction of Arabidopsis.
    statement: FT protein produced in phloem moves to the apex as a long-distance signal.
    supporting_text: >-
      We conclude that FT protein acts as a long-distance signal that induces Arabidopsis flowering.
  - source_id: PMID:16099979
    title: FD, a bZIP protein mediating signals from the floral pathway integrator FT at the shoot apex.
    statement: FD and FT act together at the shoot apex to activate AP1.
    supporting_text: >-
      FD and FT are interdependent partners through protein interaction and act at the shoot apex to
      promote floral transition and to initiate floral development through transcriptional activation
      of a floral meristem identity gene, APETALA1 (AP1).
notes: >-
  Concrete Arabidopsis instance; each annoton is grounded on a reviewed gene in genes/ARATH and its
  function term matches that review's core_functions. CDF1 represents the redundant CDF1/2/3/5
  repressors; LKP2 and the COP1 partners SPA2-4 are omitted for compactness. ZTL is included as an
  optional, minor contributor to CDF turnover; it is better known for its clock role (separate module).
  The ZTL annoton is grounded on the Swiss-Prot entry Q94BT6 (ADO1_ARATH, At5g57360), to which the
  ZTL gene review was re-grounded from the alternative gene-model entry F4KAN2. Circadian
  oscillator components (CCA1/LHY, PRRs, TOC1, ELF3/ELF4/LUX) that
  phase GI, FKF1, CDF and CO expression, and phytochrome-B photomorphogenesis, are context modules and
  are referenced only in prose. 14-3-3 proteins of the florigen activation complex, NF-YB/NF-YC
  partners of CO, and FT transport factors (FTIP1, NaKR3) are not modelled. The SPA1 annoton
  (UniProtKB:Q9SYX2) is grounded on the ARATH/SPA1 review, which this branch carries. No production GO-CAM in
  gocams/index.tsv contains these Arabidopsis gene products, so no gocam_associations are given.
module:
  id: photoperiodic_flowering_co_ft
  label: Photoperiodic flowering via CO-FT
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: long-day photoperiodism, flowering
      term:
        id: GO:0048574
        label: long-day photoperiodism, flowering
      description: >-
        Flowering promoted by long days, measured by coincidence of light with clock-phased CO
        expression and transmitted by FT florigen.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: blue-light-gated clearance of CDF repressors
      node:
        id: cdf_clearance
        label: FKF1-GI-dependent degradation of CDF repressors
        module_type: REGULATORY_STEP
        description: >-
          In long-day afternoons, blue light absorbed by the FKF1 LOV domain promotes FKF1-GI complex
          formation; SCF(FKF1) binds the CDF repressors on the CO and FT promoters and targets them for
          proteasomal degradation.
        annotons:
          - id: fkf1_blue_light_photoreceptor
            label: "FKF1: LOV-domain blue-light photoreceptor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FKF1 (At1g68050)
                term:
                  id: UniProtKB:Q9C9W9
                  label: Adagio protein 3
            function:
              preferred_term: photoreceptor activity
              term:
                id: GO:0009881
                label: photoreceptor activity
            processes:
              - preferred_term: response to blue light
                term:
                  id: GO:0009637
                  label: response to blue light
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Senses blue light in the afternoon through its flavin-binding LOV domain; light enhances
              binding to GI.
            evidence:
              - source_id: PMID:17872410
                statement: FKF1 and GI form a complex in a blue-light-dependent manner.
                supporting_text: >-
                  We demonstrate that FKF1 and GI proteins form a complex in a blue-light-dependent
                  manner.
          - id: fkf1_scf_substrate_adaptor
            label: "FKF1: SCF substrate adaptor for CDF degradation"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FKF1 (At1g68050)
                term:
                  id: UniProtKB:Q9C9W9
                  label: Adagio protein 3
            function:
              preferred_term: ubiquitin-like ligase-substrate adaptor activity
              term:
                id: GO:1990756
                label: ubiquitin-like ligase-substrate adaptor activity
            processes:
              - preferred_term: ubiquitin-dependent protein catabolic process
                term:
                  id: GO:0006511
                  label: ubiquitin-dependent protein catabolic process
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: F-box subunit that recruits CDF1 and its homologs to SCF for degradation.
            evidence:
              - source_id: PMID:16002617
                statement: FKF1 binds CDF1 and is required for its daily degradation.
                supporting_text: >-
                  FKF1 physically interacts with CDF1, and CDF1 protein is more stable in fkf1 mutants.
          - id: gi_fkf1_partner
            label: "GI: FKF1-binding partner required for CDF turnover"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GIGANTEA (At1g22770)
                term:
                  id: UniProtKB:Q9SQI2
                  label: Protein GIGANTEA
            function:
              preferred_term: ubiquitin protein ligase binding
              term:
                id: GO:0031625
                label: ubiquitin protein ligase binding
            processes:
              - preferred_term: positive regulation of long-day photoperiodism, flowering
                term:
                  id: GO:0048578
                  label: positive regulation of long-day photoperiodism, flowering
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Binds and stabilizes FKF1 (and ZTL), binds CDF1, and is needed for FKF1-dependent CDF
              degradation on the CO promoter.
            evidence:
              - source_id: PMID:17872410
                statement: FKF1 function depends on GI, which binds CDF1 and controls its stability.
                supporting_text: >-
                  FKF1 function is dependent on GI, which interacts with a CO repressor, CYCLING DOF
                  FACTOR 1 (CDF1), and controls CDF1 stability.
              - source_id: PMID:19619493
                statement: GI stabilizes FKF1, reducing CDF2 abundance.
                supporting_text: >-
                  We show that GI stabilizes FKF1, thereby reducing CDF2 abundance and allowing
                  transcription of CO.
          - id: ztl_minor_cdf_adaptor
            label: "ZTL: FKF1-family F-box adaptor (minor CDF contribution)"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ZEITLUPE (At5g57360)
                term:
                  id: UniProtKB:Q94BT6
                  label: Adagio protein 1
            function:
              preferred_term: ubiquitin-like ligase-substrate adaptor activity
              term:
                id: GO:1990756
                label: ubiquitin-like ligase-substrate adaptor activity
            processes:
              - preferred_term: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
                term:
                  id: GO:0031146
                  label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
            role_description: >-
              FKF1/LKP2 paralog that, like FKF1, is stabilized by GI and contributes redundantly to
              CDF degradation; its main role is in clock protein turnover, and it is modelled here only
              as a minor contributor to CDF clearance.
            evidence:
              - source_id: PMID:25600594
                statement: GI stabilizes the F-box proteins FKF1, ZTL and LKP2 to degrade CDF proteins.
                supporting_text: >-
                  A major function of GI is to stabilize the F–box proteins FKF1, ZTL and LKP2 to
                  degrade CDF proteins, promoting CO and FT transcription and flowering
            notes: Optional; see ZTL review and the circadian clock module for its primary role.
    - order: 2
      role: morning repression of CO and FT transcription
      node:
        id: cdf_repression
        label: CDF repression of CO and FT
        module_type: REGULATORY_STEP
        description: >-
          Morning-phased CDF Dof factors bind Dof sites in the CO and FT promoters in companion cells and
          repress transcription, in part through the TOPLESS co-repressor.
        annotons:
          - id: cdf1_repressor
            label: "CDF1: Dof transcriptional repressor of CO and FT"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CDF1 (At5g62430)
                term:
                  id: UniProtKB:Q8W1E3
                  label: Cyclic dof factor 1
            function:
              preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
              term:
                id: GO:0001227
                label: DNA-binding transcription repressor activity, RNA polymerase II-specific
            processes:
              - preferred_term: negative regulation of long-day photoperiodism, flowering
                term:
                  id: GO:0048579
                  label: negative regulation of long-day photoperiodism, flowering
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Represses CO and FT; represents the redundant CDF1/2/3/5 group.
            evidence:
              - source_id: PMID:16002617
                statement: CDF1 binds the CO promoter and represses CO.
                supporting_text: >-
                  CDF1 and CO are expressed in the same tissues, and CDF1 binds to the CO promoter.
              - source_id: PMID:22628657
                statement: CDF1 represses FT directly.
                supporting_text: >-
                  These results indicate that CDF1 protein represses FT transcription independently of
                  CO transcription.
              - source_id: PMID:28752516
                statement: TPL recruitment confers CDF1 repressive activity.
                supporting_text: >-
                  This TPL interaction confers a repressive function on CDF1, as mutations of the
                  N-terminal TPL binding domain largely impair the ability of CDF1 protein to repress
                  its targets.
    - order: 3
      role: COP1-SPA degradation of CO and its light-dependent inhibition
      node:
        id: co_stabilization
        label: COP1-SPA degradation of CO and its photoreceptor inhibition
        module_type: REGULATORY_STEP
        description: >-
          In darkness the COP1-SPA E3 ligase ubiquitinates CO for proteasomal degradation. Blue-light
          activated CRY2 binds SPA1 and COP1 and suppresses COP1-SPA activity; phyA and cryptochrome
          light signals stabilize CO protein in long days; FKF1 binds and stabilizes CO in long-day
          afternoons.
        annotons:
          - id: cop1_e3_ligase
            label: "COP1: E3 ubiquitin ligase degrading CO at night"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: COP1 (At2g32950)
                term:
                  id: UniProtKB:P43254
                  label: E3 ubiquitin-protein ligase COP1
            function:
              preferred_term: ubiquitin protein ligase activity
              term:
                id: GO:0061630
                label: ubiquitin protein ligase activity
            processes:
              - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
                term:
                  id: GO:0043161
                  label: proteasome-mediated ubiquitin-dependent protein catabolic process
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            evidence:
              - source_id: PMID:18296627
                statement: COP1 ubiquitinates CO and reduces CO levels.
                supporting_text: >-
                  In addition, COP1 physically interacts with CO and functions as an E3 ligase,
                  ubiquitinating CO in vitro and reducing CO levels in vivo.
          - id: spa1_cop1_activator
            label: "SPA1: COP1-associated activator of CO degradation"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SPA1 (At2g46340)
                term:
                  id: UniProtKB:Q9SYX2
                  label: Protein SUPPRESSOR OF PHYA-105 1
            function:
              preferred_term: ubiquitin-protein transferase activator activity
              term:
                id: GO:0097027
                label: ubiquitin-protein transferase activator activity
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Represents SPA1-4; enhances COP1 E3 activity toward CO.
            evidence:
              - source_id: PMID:21514160
                statement: SPA1 mediates blue-light suppression of COP1-dependent CO proteolysis downstream of CRY2.
                supporting_text: >-
                  We demonstrate that SPA1 acts genetically downstream from CRY2 to mediate blue light
                  suppression of the COP1-dependent proteolysis of the flowering-time regulator
                  CONSTANS (CO).
          - id: cry2_blue_light_receptor
            label: "CRY2: blue-light receptor inhibiting COP1-SPA"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CRY2 (At1g04400)
                term:
                  id: UniProtKB:Q96524
                  label: Cryptochrome-2
            function:
              preferred_term: blue light photoreceptor activity
              term:
                id: GO:0009882
                label: blue light photoreceptor activity
            processes:
              - preferred_term: blue light signaling pathway
                term:
                  id: GO:0009785
                  label: blue light signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            evidence:
              - source_id: PMID:21514160
                statement: Blue-light-dependent CRY2-SPA1 interaction stimulates CRY2-COP1 interaction.
                supporting_text: >-
                  We further show that blue light-dependent CRY2-SPA1 interaction stimulates CRY2-COP1
                  interaction.
          - id: phya_far_red_receptor
            label: "phyA: far-red light receptor contributing to CO stabilization"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PHYA (At1g09570)
                term:
                  id: UniProtKB:P14712
                  label: Phytochrome A
            function:
              preferred_term: far-red light photoreceptor activity
              term:
                id: GO:0031516
                label: far-red light photoreceptor activity
            processes:
              - preferred_term: far-red light signaling pathway
                term:
                  id: GO:0010018
                  label: far-red light signaling pathway
            role_description: >-
              Far-red/dusk light input that stabilizes CO protein (with CRY2) late in long days;
              primary phyA photomorphogenesis roles belong to a separate module.
            evidence:
              - source_id: PMID:14963328
                statement: Photoreceptors regulate CO protein stability; light stabilizes nuclear CO in the evening.
                supporting_text: >-
                  We show that light stabilizes nuclear CO protein in the evening, whereas in the morning
                  or in darkness the protein is degraded by the proteasome.
              - source_id: PMID:22628657
                statement: phyA and cryptochrome light signals stabilize CO protein in long days.
                supporting_text: >-
                  Light signals perceived by phytochrome A (phyA) and cryptochrome (cry) photoreceptors
                  stabilize CO protein in long days
              - source_id: PMID:18388858
                statement: phyA and cry2 mutations delay flowering and reduce CO protein accumulation.
                supporting_text: >-
                  Mutations in the genes encoding the photoreceptors phytochrome A (phyA) and cryptochrome
                  2 (cry2) delay flowering, and these mutations also reduce the accumulation of CO protein
            notes: >-
              Grounded via the PHYA gene review. The primary study (Valverde et al. 2004, PMID:14963328)
              is cached as abstract only, which names photoreceptors generically; the phyA-specific
              statements are from later cached full texts citing it.
    - order: 4
      role: CO activation of FT in phloem companion cells
      node:
        id: ft_induction
        label: CO-dependent FT transcription in leaf companion cells
        module_type: REGULATORY_STEP
        description: >-
          Stabilized CO forms an NF-Y-like trimer with NF-YB/NF-YC, binds CORE (CCACA) elements in the
          FT promoter and activates FT transcription in leaf phloem companion cells.
        annotons:
          - id: co_ft_activator
            label: "CO: DNA-binding transcriptional activator of FT"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CONSTANS (At5g15840)
                term:
                  id: UniProtKB:Q39057
                  label: Zinc finger protein CONSTANS
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
            processes:
              - preferred_term: positive regulation of long-day photoperiodism, flowering
                term:
                  id: GO:0048578
                  label: positive regulation of long-day photoperiodism, flowering
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            evidence:
              - source_id: PMID:28526714
                statement: CO-NF-YB/NF-YC trimer binds the FT CORE element.
                supporting_text: >-
                  forms a trimer with Arabidopsis thaliana NF-YB2/NF-YC3 to efficiently bind the CORE
                  element of the FLOWERING LOCUS T promoter.
    - order: 5
      role: florigen action at the shoot apical meristem
      node:
        id: florigen_action
        label: FT-FD florigen activation complex at the shoot apex
        module_type: REGULATORY_STEP
        description: >-
          FT protein, after phloem transport to the shoot apex, binds 14-3-3 proteins and the
          phosphorylated bZIP FD; the complex activates SOC1, AP1 and other floral genes, and SOC1
          relays the signal to floral meristem identity genes.
        annotons:
          - id: ft_florigen_coactivator
            label: "FT: mobile florigen, transcription coactivator"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FLOWERING LOCUS T (At1g65480)
                term:
                  id: UniProtKB:Q9SXZ2
                  label: Protein FLOWERING LOCUS T
            function:
              preferred_term: transcription coactivator activity
              term:
                id: GO:0003713
                label: transcription coactivator activity
            processes:
              - preferred_term: positive regulation of flower development
                term:
                  id: GO:0009911
                  label: positive regulation of flower development
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            evidence:
              - source_id: PMID:17446353
                statement: FT protein expressed in phloem moves to the apex.
                supporting_text: >-
                  FT fusion proteins expressed specifically in phloem cells move to the apex and move
                  long distances between grafted plants.
          - id: fd_bzip_activator
            label: "FD: bZIP DNA-binding partner of FT"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FD (At4g35900)
                term:
                  id: UniProtKB:Q84JK2
                  label: Protein FD
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
            processes:
              - preferred_term: positive regulation of flower development
                term:
                  id: GO:0009911
                  label: positive regulation of flower development
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            evidence:
              - source_id: PMID:16099980
                statement: A complex of FT and FD activates floral identity genes.
                supporting_text: >-
                  A complex of FT and FD proteins in turn can activate floral identity genes such as
                  APETALA1 (AP1).
              - source_id: PMID:25661797
                statement: FD Thr282 phosphorylation by CPKs is needed for 14-3-3-mediated complex formation with FT.
                supporting_text: >-
                  which is a crucial residue for the complex formation with FT via 14-3-3.
          - id: soc1_floral_integrator
            label: "SOC1: MADS-box floral integrator downstream of FT-FD"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SOC1 (At2g45660)
                term:
                  id: UniProtKB:O64645
                  label: MADS-box protein SOC1
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
              - preferred_term: vegetative to reproductive phase transition of meristem
                term:
                  id: GO:0010228
                  label: vegetative to reproductive phase transition of meristem
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Output integrator gene activated at the apex by the florigen complex.
            evidence:
              - source_id: PMID:30770462
                statement: SOC1 is a high-confidence in vivo FD target at the shoot apex.
                supporting_text: >-
                  The 595 peak regions shared between the replicates mapped to 572 individual genes, which
                  we consider high-confidence in vivo targets of FD at the SAM and include important
                  flowering-related genes such as AP1 , FUL , SOC1 , and SEP3 .
              - source_id: PMID:30770462
                statement: FD overexpression strongly induces SOC1.
                supporting_text: >-
                  Reverse transcription quantitative-PCR (RT-qPCR) assays confirmed that both SOC1 and AP1
                  were strongly upregulated in p35S :: FD
  connections:
    - source: cdf_clearance
      target: cdf_repression
      connection_type: NEGATIVELY_REGULATES
      description: FKF1-GI-dependent degradation removes CDF repressors from CO and FT promoters in long-day afternoons.
      evidence:
        - source_id: PMID:22628657
          statement: FKF1 removes CDF1, which represses CO and FT.
          supporting_text: >-
            FKF1 simultaneously removes CYCLING DOF FACTOR 1 (CDF1), which represses CO and FLOWERING
            LOCUS T (FT) transcription.
    - source: cdf_repression
      target: ft_induction
      connection_type: NEGATIVELY_REGULATES
      description: CDFs repress CO transcription and FT transcription directly.
    - source: co_stabilization
      target: ft_induction
      connection_type: NEGATIVELY_REGULATES
      description: >-
        COP1-SPA-mediated degradation of CO limits FT activation; photoreceptor inhibition of COP1-SPA
        (and FKF1 binding to CO) relieves this in the light.
    - source: ft_induction
      target: florigen_action
      connection_type: PROVIDES_INPUT_FOR
      description: FT protein made in companion cells travels through the phloem to the shoot apex.
