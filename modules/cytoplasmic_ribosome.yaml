          preferred_term: structural constituent of ribosome
          term:
            id: GO:0003735
            label: structural constituent of ribosome
        processes:
        - preferred_term: cytoplasmic translation
          term:
            id: GO:0002181
            label: cytoplasmic translation
        role_description: >-
          Each ribosomal protein unit carries structural constituent of ribosome, taken from its experimental
          human GOA row: IDA from the human 80S cryo-EM structure (PMID:23636399) for nearly every
          unit, with HDA rows from 40S proteomics (PMID:15883184) and IMP rows from knockdown studies.
          These are structural roles, not activities, and no unit carries a catalytic or decoding activity.
          RACK1 carries ribosome binding, the core function of its gene review and an IDA row (PMID:28132843),
          rather than structural constituent, for which it has no experimental human row. Units left
          without a function (RPS4Y2, RPS27L, RPL41) have no experimental human molecular-function
          row; they are included because RGD, Complex Portal or UniProt list them as 40S constituents
          (RPL41 also has experimental cellular-component rows, which place it in the 60S subunit).
          The decoding activity of the 40S subunit depends on 18S rRNA and has no GO molecular function
          term; the subunit-level function here, structural constituent of ribosome, follows the curators'
          own use of that term for ribosomal-subunit complexes in human GO-CAMs. Paralogue units are
          alternatives at one position, not additional proteins: each ribosome carries one eS4 (RPS4X,
          or in males RPS4Y1 or RPS4Y2) and one eS27 (RPS27 or RPS27L).
        evidence:
        - source_id: PMID:23636399
          statement: >-
            Cryo-EM structure of the human 80S ribosome, the source of the IDA structural-constituent
            rows on the ribosomal proteins.
          supporting_text: >-
            Here we present structures of Drosophila melanogaster and Homo sapiens 80S ribosomes in
            complex with the translation factor eEF2, E-site transfer RNA and Stm1-like proteins
        - source_id: PMID:25901680
          statement: Near-atomic structure of the human 80S ribosome, including the subunit interface.
          supporting_text: >-
            Here we report the near-atomic structure of the human ribosome derived from high-resolution
            single-particle cryo-electron microscopy and atomic model building.
