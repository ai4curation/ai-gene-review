notes: |-
  Derived from the RGD Pathway Ontology diagrams PW:0000101 (translation pathway) and PW:0001066
  (ribosome biogenesis pathway) through the RGD_PATHWAY_ONTOLOGY project, as module 1 of the
  translation split plan (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md; seeds in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, both flagged broad, 180 and 138
  RGD-curated human genes). Both seeds contain the same 82 ribosome genes, 81 ribosomal proteins
  (46 RPL, 35 RPS) and RACK1, and this module models them once; the sibling modules
  translation_initiation, translation_elongation_and_termination and
  nonsense_mediated_mrna_decay, and the later ribosome biogenesis module, refer to this one
  rather than listing ribosomal proteins. The node ids small_subunit and large_subunit, and the
  annoton ids small_subunit_complex, large_subunit_complex and peptidyl_transferase_centre, are
  intended as stable reference points (for example cytoplasmic_ribosome#small_subunit). PW
  children (PW:0000580 initiation, PW:0000581 elongation, PW:0000582 termination) belong to the
  sibling modules and are not evidence sources here. UniProt accessions and recommended names are
  from UniProt REST (November 2026), cross-checked against the local UniProt files for the five
  members with gene reviews (RACK1, RPL18A, RPL36A, RPL36AL, RPS3). Molecular functions are from
  each protein's experimental human GOA rows in QuickGO (November 2026). The structure follows
  modules/dmel_cytoplasmic_ribosome.yaml (structure only; no Drosophila evidence is used).

  Boundary and modelling decisions. (1) rRNAs are not participants. The 18S, 28S, 5.8S and 5S
  rRNAs are the ribosome's catalytic and decoding core, but they are not gene products in this
  model, so the complex descriptors stand for the ribonucleoprotein subunits as wholes and only
  proteins are listed as units. (2) Structural constituent of ribosome on the units. GO defines
  it as the action of a molecule that contributes to the structural integrity of the ribosome:
  a structural role, not a catalytic one, and a property of each protein in the assembled
  particle. Human GOA asserts it on 77 of the ribosomal proteins by IDA from the human 80S
  structure (PMID:23636399), with further IDA, HDA and IMP rows, and all four human gene reviews
  of ribosomal proteins in this repository (RPL18A, RPL36A, RPL36AL, RPS3) keep it as the core
  function. It is therefore placed on each unit that has such a row (or, for RPL36AL, the gene
  review core function), and on no unit without one. This is the only function the ribosomal
  protein units carry; no unit carries a catalytic, decoding or channel activity. (3) The
  ribosome's own molecular functions sit on the complexes. Peptidyl transferase activity is
  catalysed by the 28S rRNA (the GO definition says so) and is placed on the 60S complex
  annoton peptidyl_transferase_centre, which lists no protein units; human GOA asserts it only on
  the Complex Portal 60S complexes. Decoding by the 40S subunit is rRNA-centred too and has no GO
  molecular function term; it is described in prose, and no ontology request is made because
  GO represents ribosome activity through the structural-constituent term and the translation
  process. The two subunit annotons carry structural constituent of ribosome at subunit level,
  as the human GO-CAMs pinned here do for the 60S complex. (4) RACK1 is a 40S constituent. It
  sits on the head of the 40S subunit in the human 80S structures, UniProt and Complex Portal
  (CPX-5223) list it as a 40S component, and RGD draws it binding the 40S subunit. Its only
  experimental human cellular-component evidence for the 40S subunit is indirect (Complex
  Portal NAS; cytoplasm EXP from PMID:23636399), so it carries ribosome binding, the core
  function of its gene review, rather than structural constituent. Its signalling-scaffold
  functions are outside this module. (5) Paralogues are alternatives at one position, listed as
  units with their roles stated rather than as variant sets. Each ribosome carries one protein
  per position: eS4 from RPS4X or, in males, RPS4Y1 (shown in human ribosomes, PMID:8139551) or
  RPS4Y2 (sequence and curated complex membership only); eS27 from RPS27 or RPS27L; uL3 from
  RPL3 or the striated-muscle RPL3L; uL16 from RPL10 or the testis-specific RPL10L; eL39 from
  RPL39 or the male germ-cell RPL39L; eL42 from RPL36A or the ubiquitous RPL36AL. Complex Portal
  defines a canonical 60S (CPX-5183), a testis 60S with RPL10L and RPL39L (CPX-7664) and a
  striated muscle 60S with RPL3L (CPX-7665); variant sets were not used because they would
  repeat 46 shared units for each tissue and because, apart from these Complex Portal entries,
  which paralogue combinations coexist in single ribosomes is not established for every
  position. RPS27L is included because RGD and Complex Portal list it; its incorporation into
  human ribosomes rests on its near-identity to RPS27, not on experimental human evidence.
  (6) Members added beyond the RGD list: RPL41 (eS32, formerly eL41), a core constituent in
  Complex Portal and in GOA (HDA and IDA cellular-component rows), and the paralogues RPL3L,
  RPL10L, RPL36AL and RPL39L, which RGD omits. RPL41 is placed in the small subunit, following
  UniProt (eS32, a small-subunit protein forming an intersubunit bridge); GOA and Complex Portal
  place it in the 60S subunit, and the human pre-60S structures lack it (PMID:32669547). It has
  no experimental molecular-function row and is a unit without a function. (7) Excluded:
  RPL22L1 and RPL26L1 (Complex Portal lists them as alternatives to RPL22 and RPL26, but they
  have no experimental human evidence of incorporation and RGD omits them; candidates for a
  later revision), RPL7L1 (a ribosome biogenesis factor despite its name), the newly named RPSA2
  and the ribosomal protein pseudogene entries, and the mitochondrial ribosomal proteins (the
  mitoribosome is in mitochondrial_translation). The ubiquitin and FUBI moieties released from
  RPS27A, UBA52 and FAU are not ribosome constituents. (8) Processes. All annotons carry
  cytoplasmic translation, the cytosolic child of the PW:0000101 mapped process. Ribosome
  biogenesis (the PW:0001066 mapped process) is not assigned to the ribosomal proteins: they are
  required for biogenesis because they are built into its product, and the steps are performed
  by the biogenesis factors, snoRNPs and nucleases of the later ribosome biogenesis module, so
  necessity evidence (for example IMP rows for rRNA processing after knockdown, PMID:18697920)
  is not read as participation. Extra-ribosomal roles of individual proteins (RPS3 in DNA repair,
  RPL5 and RPL11 in the p53-MDM2 response, RPSA as a laminin receptor, RACK1 as a signalling
  scaffold, RPS27L as a p53 target) are outside this module. (9) Out of scope and modelled
  elsewhere: initiation factors (translation_initiation), elongation and termination factors
  and ABCE1 recycling (translation_elongation_and_termination), nonsense-mediated decay
  (nonsense_mediated_mrna_decay), the ER-bound ribosome and SRP targeting
  (er_cotranslational_translocation), mRNA export (mrna_nuclear_export), the mitoribosome
  (mitochondrial_translation), and ribosome biogenesis, a later module. snoRNA and microRNA host
  genes in the RGD lists are not participants. PANTHER family ids and PTNs are deliberately not
  asserted.

  GO-CAM links. In gocams/index.tsv the human models that contain ribosomal proteins or the
  ribosomal subunit complexes all give them structural constituent of ribosome with cytoplasmic
  translation or a ribosome-recycling process. RPS6 (gomodel:62900b6400000022, PARP16
  mono-ADP-ribosylation, and fifteen mTORC1 signalling models) and RPS7
  (gomodel:6606056e00001669) are pinned to small_subunit_complex; RPL24
  (gomodel:62900b6400000022), RPL3 (gomodel:62f58d8800005377, METTL18 histidine methylation) and
  the cytosolic large ribosomal subunit complex (gomodel:65f3ae5c00000170 and
  gomodel:65f3ae5c00000257, RPL26 ufmylation; gomodel:6690711d00002607 and
  gomodel:6690711d00002652, angiogenin) are pinned to large_subunit_complex. Not pinned: the
  second 60S activity in gomodel:6690711d00002607, which gives the 60S complex ribonuclease
  inhibitor activity while directly positively regulating angiogenin ribonuclease activity,
  although the cited paper (PMID:38718836) reports that the ribosome activates angiogenin bound
  in the A site of the 80S ribosome (a possible upstream error); and RPSA in
  gomodel:65c57c3400002054, which models a DNA-binding antiviral role outside this module. The
  seed best_gocam for PW:0000101 (gomodel:63e5937500001319, eRF1-eRF3 termination and ABCE1)
  belongs to translation_elongation_and_termination.
