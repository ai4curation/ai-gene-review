id: MODULE:cytoplasmic_ribosome
title: Human cytosolic 80S ribosome — the 40S decoding subunit and the 60S peptidyl-transferase subunit, with their ribosomal proteins as structural units and tissue-specific paralogue alternatives (RPS4Y1/RPS4Y2, RPS27L, RPL3L, RPL10L, RPL36AL, RPL39L)
description: >-
  The cytosolic 80S ribosome translates nuclear-encoded mRNAs in the cytosol and, when bound to
  the endoplasmic reticulum, on its surface. It consists of a small 40S subunit, built on the 18S
  rRNA with 33 ribosomal proteins and RACK1, and a large 60S subunit, built on the 28S, 5.8S and
  5S rRNAs with 46 ribosomal proteins. The 40S subunit binds mRNA, scans it during initiation and
  carries the decoding centre in which codon-anticodon pairing is checked at the A site. The 60S
  subunit carries the peptidyl transferase centre, an all-RNA active site in the 28S rRNA that
  forms each peptide bond, the polypeptide exit tunnel, and the GTPase-associated centre and
  P-stalk that bind the translational GTPases. The two subunits join at initiation and are split
  again after termination. The ribosomal proteins are named by the universal (u) and
  eukaryote-specific (e) nomenclature; they fold and stabilise the rRNA and line the functional
  sites, and three of them (eS30, eS31, eL40) are made as fusions with ubiquitin or the
  ubiquitin-like FUBI and cleaved before assembly. Several positions have paralogues that are
  alternatives rather than extra subunits: a Y-encoded eS4 in males, a striated-muscle uL3
  (RPL3L), testis-specific uL16 and eL39 (RPL10L, RPL39L), and the ubiquitous eL42 paralogue
  RPL36AL.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PW:0000101
  title: translation pathway
  statement: >-
    RGD curates 82 ribosome-associated human genes to this pathway (the 81 ribosomal proteins
    RPSA, RPS2 to RPS29 including RPS4X, RPS4Y1, RPS4Y2, RPS27A, RPS27L and FAU, RPL3 to RPL39
    including RPL36A, RPLP0 to RPLP2 and UBA52, plus RACK1), and its text places the ribosome
    at the core of translation. This module realises the ribosome part of the pathway under
    the split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md.
- source_id: PW:0001066
  title: ribosome biogenesis pathway
  statement: >-
    RGD curates the same 82 genes to ribosome biogenesis, whose end product is the mature 80S
    ribosome modelled here. The biogenesis factors themselves are a separate, later module.
