      - id: peptidyl_transferase_centre
        label: The 28S rRNA of the 60S subunit catalyses peptide bond formation
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: Cytosolic 60S ribosomal subunit (28S rRNA peptidyl transferase centre)
            term:
              id: GO:0022625
              label: cytosolic large ribosomal subunit
        function:
          preferred_term: peptidyltransferase activity
          term:
            id: GO:0000048
            label: peptidyltransferase activity
        processes:
        - preferred_term: cytoplasmic translation
          term:
            id: GO:0002181
            label: cytoplasmic translation
        role_description: >-
          Peptidyl transfer is catalysed by rRNA, so this activity is placed on the 60S complex as
          a whole and on no protein unit; the descriptor deliberately lists no active units. The ribozyme
          mechanism was established on the archaeal large subunit, where only rRNA contacts the substrates
          (PMID:10937990), and the GO term definition states that the reaction is catalysed by a ribozyme.
          In human GOA the activity is asserted on the Complex Portal 60S complexes (CPX-5183 and CPX-7665,
          NAS) and on no ribosomal protein. rRNAs are not gene products in this model, so the catalytic
          entity itself is not a participant.
        evidence:
        - source_id: PMID:10937990
          statement: The large-subunit active site is all RNA; the ribosome is a ribozyme.
          supporting_text: >-
            we establish that the ribosome is a ribozyme and address the catalytic properties of its
            all-RNA active site
        - source_id: PMID:10937990
          statement: No protein side chain lies near the peptide bond being formed.
          supporting_text: >-
            there are no protein side-chain atoms closer than about 18 angstroms to the peptide bond
            being synthesized
        - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000101.yaml
          statement: RGD assigns the peptidyl transferase reaction to the 60S subunit.
          supporting_text: the large 60S subunit carries out the peptidyl transferase reaction
