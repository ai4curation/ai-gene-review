        role_description: >-
          As for the 40S subunit, each ribosomal protein unit carries structural constituent of ribosome
          from its experimental human GOA rows (IDA from PMID:23636399, PMID:25957688 and PMID:32669547;
          HDA from 60S proteomics, PMID:12962325), and RPL36AL from the core function of its gene review;
          no unit carries a catalytic activity. RPL3L and RPL39L have experimental 60S cellular-component
          rows (HDA, IPI) but no experimental molecular-function row, and are units without a function.
          Four positions have paralogue alternatives, and each ribosome carries one protein at each:
          uL3 (RPL3, or RPL3L in heart and skeletal muscle), uL16 (RPL10, or RPL10L in testis), eL39
          (RPL39, or RPL39L in male germ cells) and eL42 (RPL36A or the ubiquitous RPL36AL). Complex
          Portal records the tissue-specific combinations as separate 60S variants (canonical CPX-5183,
          testis CPX-7664, striated muscle CPX-7665); here they are listed in one descriptor with their
          roles stated, rather than as variant sets that would repeat 46 shared units three times.
          The subunit-level function follows the GO-CAMs pinned here, which give the 60S complex structural
          constituent of ribosome.
        evidence:
        - source_id: PMID:25957688
          statement: >-
            Cryo-EM of ex vivo human polysomes resolves actively translating ribosomes in elongation,
            decoding and termination states.
          supporting_text: >-
            Here, we have used cryo-electron microscopy to image ex-vivo-derived human polysomes as
            a source of actively translating ribosomes.
        - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001066.yaml
          statement: >-
            RGD counts three rRNAs and 49 ribosomal proteins in the 60S subunit (its count includes
            paralogues).
          supporting_text: subunit is composed of three rRNAs and 49 ribosomal proteins (RLS)
