                  statement: "FAH cleaves 4FAA (human Reactome reaction)"
            role_description: >-
              Terminal hydrolysis releases fumarate and acetoacetate for central
              metabolism.
  connections:
    - source: tat_step
      target: hpd_step
      connection_type: PROVIDES_INPUT_FOR
      description: 4-hydroxyphenylpyruvate from TAT is the substrate of HPD.
    - source: hpd_step
      target: hgd_step
      connection_type: PROVIDES_INPUT_FOR
      description: Homogentisate from HPD is the substrate of HGD.
    - source: hgd_step
      target: gstz1_step
      connection_type: PROVIDES_INPUT_FOR
      description: 4-maleylacetoacetate from HGD is isomerised by GSTZ1/MAAI.
    - source: gstz1_step
      target: fah_step
      connection_type: PROVIDES_INPUT_FOR
      description: 4-fumarylacetoacetate from GSTZ1 is hydrolysed by FAH.
  notes: >-
    Five reaction leaves use exact PSEPK and human UniProt exemplars with
    family-level selectors and Rhea master reactions whose substrates and
    products are displayed in the physiological pathway direction. Phenylalanine
    and other aromatic compounds may enter the shared homogentisate lower
    pathway, but their distinct upstream reactions are outside this L-tyrosine
    module.
