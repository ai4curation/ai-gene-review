            label: Tyrosine transaminase family variants
            axis: enzyme family
            selection: EXACTLY_ONE
            variants:
              - id: eukaryotic_tat_variant
                label: Eukaryotic TAT-family implementation
                module_type: REACTION
                annotons:
                  - id: tat_activity
                    label: "TAT: tyrosine aminotransferase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Tyrosine aminotransferase subfamily (TAT)
                        term:
                          id: PANTHER:PTHR45744:SF2
                          label: TYROSINE AMINOTRANSFERASE
                        representative_members:
                          - preferred_term: TAT (human)
                            term:
                              id: UniProtKB:P17735
                              label: Tyrosine aminotransferase
                    function:
                      preferred_term: L-tyrosine:2-oxoglutarate transaminase activity
                      term:
                        id: GO:0004838
                        label: L-tyrosine:2-oxoglutarate transaminase activity
                      substrates:
