  label: L-tyrosine catabolism
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: L-tyrosine catabolic process
      term:
        id: GO:0006572
        label: L-tyrosine catabolic process
      description: >-
        Five-step cytoplasmic degradation of L-tyrosine to fumarate and
        acetoacetate.
  context:
    cellular_components:
      - preferred_term: cytoplasm
        term:
          id: GO:0005737
          label: cytoplasm
  parts:
    - order: 1
      role: transamination (entry step)
      node:
