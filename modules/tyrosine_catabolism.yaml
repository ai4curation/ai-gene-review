                          statement: L-tyrosine and 2-oxoglutarate transamination.
                        - source_id: EC:2.6.1.5
                          statement: tyrosine transaminase
                        - source_id: Reactome:R-HSA-71155
                          statement: "TAT deaminates tyrosine (human Reactome reaction)"
                    role_description: >-
                      Eukaryotic TAT-family catalyst for the PLP-dependent entry
                      reaction that commits the tyrosine carbon skeleton to
                      homogentisate-pathway catabolism.
              - id: bacterial_tyrb_variant
                label: Bacterial TyrB-family implementation
                module_type: REACTION
                annotons:
                  - id: tyrb_activity
                    label: "TyrB: bacterial aromatic-amino-acid aminotransferase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Bacterial aromatic-amino-acid aminotransferase subfamily
                        term:
                          id: PANTHER:PTHR11879:SF37
                          label: AROMATIC-AMINO-ACID AMINOTRANSFERASE
                        representative_members:
                          - preferred_term: TyrB (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88LG1
                              label: Aromatic-amino-acid aminotransferase
                            description: PSEPK tyrB/PP_1972.
                          - preferred_term: AmaC (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88GX7
                              label: Aminotransferase
                            description: PSEPK amaC/PP_3590.
                    function:
                      preferred_term: L-tyrosine:2-oxoglutarate transaminase activity
                      term:
                        id: GO:0004838
                        label: L-tyrosine:2-oxoglutarate transaminase activity
                      substrates:
                        - preferred_term: L-tyrosine
                        - preferred_term: 2-oxoglutarate
                      products:
                        - preferred_term: 4-hydroxyphenylpyruvate
                        - preferred_term: L-glutamate
                      evidence:
                        - source_id: RHEA:15093
                          statement: L-tyrosine and 2-oxoglutarate transamination.
                        - source_id: EC:2.6.1.57
                          statement: aromatic-amino-acid transaminase
                        - source_id: file:PSEPK/tyrB/tyrB-ai-review.yaml
                          statement: The curated PSEPK review supports TyrB-catalyzed tyrosine transamination.
                        - source_id: file:PSEPK/amaC/amaC-ai-review.yaml
                          statement: The curated PSEPK review supports AmaC-dependent growth on L-tyrosine as a nitrogen source.
                    role_description: >-
                      Bacterial class-I PLP aromatic-amino-acid aminotransferase
                      that provides the same pathway-entry reaction through
                      TyrB/AmaC-family enzymes without implying orthology to
                      eukaryotic TAT.
    - order: 2
      role: oxidative decarboxylation to homogentisate
      node:
