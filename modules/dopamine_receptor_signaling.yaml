    - order: 8
      role: DARPP-32/PP1 control of STEP and the ERK branch
      node:
        id: dopa_step_erk
        label: STEP (PTPN5) regulation of ERK downstream of PP1
        module_type: REGULATORY_STEP
        description: >-
          Dopamine signalling reaches the ERK cascade through DARPP-32/PP1. The striatal
          tyrosine phosphatase STEP (PTPN5) dephosphorylates and inactivates ERK; PKA keeps
          STEP phosphorylated and inactive, while PP1 (and Ca2+/calcineurin) dephosphorylate
          and activate it, so PP1 inhibition by DARPP-32 sustains ERK activity.
        annotons:
          - id: ptpn5_step
            label: STEP (PTPN5) tyrosine phosphatase inactivation of ERK
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PTPN5 (STEP)
                term:
                  id: UniProtKB:P54829
                  label: Tyrosine-protein phosphatase non-receptor type 5
            function:
              preferred_term: protein tyrosine phosphatase activity
              term:
                id: GO:0004725
                label: protein tyrosine phosphatase activity
            processes:
              - preferred_term: negative regulation of ERK1 and ERK2 cascade
                term:
                  id: GO:0070373
                  label: negative regulation of ERK1 and ERK2 cascade
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Dephosphorylates the ERK activation-loop tyrosine; inactive when
              PKA-phosphorylated, active when PP1 dephosphorylates it, so it links the
              cAMP/PP1 core to ERK.
            evidence:
              - source_id: PMID:12483215
                statement: Calcineurin dephosphorylation activates STEP, which limits ERK activity.
                supporting_text: >-
                  activation of NMDA receptors led to activation of STEP, which limited the
                  duration of ERK activity
              - source_id: PMID:15608059
                statement: PKA phosphorylation inactivates STEP; PP1 (controlled by DARPP-32) dephosphorylates and activates it.
                supporting_text: >-
                  Phosphatases of the STEP family lose their ability to dephosphorylate ERK
                  when they are phosphorylated by PKA on a regulatory serine residue within
                  their ERK-binding domain, termed the kinase interaction motif
    - order: 9
