                  dopamine-dependent behaviors, loss of Akt regulation by dopamine in the
                  striatum
  connections:
    - source: dopa_d1_golf
      target: dopa_adcy5
      connection_type: POSITIVELY_REGULATES
      description: D1-like receptors via Golf/Gs stimulate ADCY5.
    - source: dopa_adcy5
      target: dopa_pka
      connection_type: PROVIDES_INPUT_FOR
      description: cAMP produced by ADCY5 activates PKA.
    - source: dopa_pka
      target: dopa_darpp32_pp1
      connection_type: POSITIVELY_REGULATES
      description: PKA phosphorylates DARPP-32 Thr34, activating its PP1-inhibitory function.
    - source: dopa_d2_gio
      target: dopa_adcy5
      connection_type: NEGATIVELY_REGULATES
      description: D2-like receptors via Gi/o inhibit ADCY5, lowering cAMP.
    - source: dopa_darpp32_switch
      target: dopa_darpp32_pp1
      connection_type: NEGATIVELY_REGULATES
      description: >-
        CDK5 (Thr75) and calcineurin (Thr34) oppose the active DARPP-32/PP1-inhibitory state,
        while the PP2A holoenzymes and CK1 tune the switch.
    - source: dopa_pka
      target: dopa_darpp32_switch
      connection_type: POSITIVELY_REGULATES
      description: >-
        PKA activates the B56-delta PP2A holoenzyme (via B56-delta phosphorylation), the
        cAMP route to Thr75 dephosphorylation.
    - source: dopa_termination
      target: dopa_d1_golf
      connection_type: NEGATIVELY_REGULATES
      description: GRK/arrestin desensitisation and RGS GAP activity terminate D1-like signalling.
    - source: dopa_termination
      target: dopa_d2_gio
      connection_type: NEGATIVELY_REGULATES
      description: >-
        GRK/arrestin desensitisation and the RGS9-2 complex (D2-selective GAP) terminate
        D2-like signalling.
    - source: dopa_darpp32_pp1
      target: dopa_step_erk
      connection_type: POSITIVELY_REGULATES
      description: >-
        DARPP-32 inhibition of PP1 keeps STEP phosphorylated/inactive, sustaining ERK
        activity downstream of D1 signalling.
    - source: dopa_d2_gio
      target: dopa_arrestin_akt
      connection_type: PROVIDES_INPUT_FOR
      description: D2-class receptors seed the G protein-independent beta-arrestin-2/PP2A/AKT arm.
