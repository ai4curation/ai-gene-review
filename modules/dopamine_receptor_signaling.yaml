id: MODULE:dopamine_receptor_signaling
title: Dopamine receptor signaling — D1-like Golf/Gs and D2-like Gi/o control of adenylyl cyclase, the cAMP/PKA/DARPP-32/PP1 switch, and GRK/arrestin/RGS termination in striatal neurons
description: >-
  Dopamine signals through five G protein-coupled receptors split into two classes with
  opposite effects on adenylyl cyclase. The D1-like receptors (DRD1 and DRD5) couple
  through the stimulatory G alpha subunits — in the striatum chiefly the Golf variant GNAL
  rather than ubiquitous Gs — to activate adenylyl cyclase type 5 (ADCY5), raising cAMP and
  activating cAMP-dependent protein kinase (PKA). The D2-like receptors (DRD2, DRD3 and
  DRD4) couple through the inhibitory G alpha subunits GNAI2 and GNAO1 to inhibit ADCY5 and
  lower cAMP. The signal converges on a single bistable integrator, the phosphoprotein
  DARPP-32 (PPP1R1B). When PKA phosphorylates DARPP-32 at threonine 34 it becomes a potent
  inhibitor of protein phosphatase 1 (PP1, the PPP1CA/PPP1CB/PPP1CC catalytic subunits),
  amplifying phosphorylation of PP1 substrates downstream of D1 signalling. The switch is
  governed by a network of kinases and phosphatases acting on distinct residues: CDK5
  phosphorylates threonine 75, converting DARPP-32 into a competitive inhibitor of PKA;
  a PKA-activated PP2A holoenzyme with the B56-delta regulatory subunit (PPP2R5D) and a
  Ca2+-activated PP2A holoenzyme with the PR72 subunit (PPP2R3A) dephosphorylate threonine
  75; the Ca2+/calmodulin phosphatase calcineurin (PPP3CA/PPP3CB/PPP3CC) dephosphorylates
  threonine 34; and casein kinase 1 (CSNK1A1) phosphorylates serine 137 to protect
  phospho-threonine 34 from calcineurin. Receptor output is terminated by G protein-coupled
  receptor kinases (GRK2, GRK3, GRK5, GRK6), which phosphorylate agonist-occupied receptors
  so that beta-arrestins (ARRB1, ARRB2) uncouple them from G proteins and drive
  internalisation, and by regulators of G protein signalling, most prominently the
  striatal RGS9-2/G-beta-5/R7BP GAP complex (RGS9, GNB5, RGS7BP) that accelerates GTP
  hydrolysis on the D2-coupled G alpha subunits. Dopamine signalling also reaches the ERK
  cascade through DARPP-32-dependent control of the striatal tyrosine phosphatase STEP
  (PTPN5), and D2 receptors engage a G protein-independent arrestin arm in which ARRB2
  scaffolds PP2A onto AKT.
status: DRAFT
scope: CONCRETE
