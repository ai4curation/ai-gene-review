id: MODULE:dmel_elg1_rfc_like_complex
title: Elg1 RFC-like complex in Drosophila melanogaster
description: >-
  Replication factor C (RFC) is a pentameric AAA+ clamp loader made of one large subunit and
  four small subunits. In the Elg1 RFC-like complex the large subunit Rfc1 is replaced by
  Elg1 (ATAD5 in mammals), while the four small RFC subunits are shared. In yeast and human
  cells this complex unloads the PCNA sliding clamp from DNA after Okazaki fragment ligation,
  and its loss raises genome instability.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000599
  title: 'FlyBase gene group ELG1-C: Elg1 complex'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as elg1 complex (ELG1-C); this
    module models that group.
- source_id: GO:0031391
  title: Elg1 RFC-like complex
  statement: >-
    GO term grounding the module as Elg1 RFC-like complex.
notes: >-
  The PCNA-unloading role is inferred from yeast and human Elg1/ATAD5; it has not been tested
  biochemically for the Drosophila complex. FlyBase groups realized by this module: ELG1-C
  (FBgg0000599). Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_elg1_rfc_like_complex.yaml;
  none of the member genes has a gene review yet unless noted.
