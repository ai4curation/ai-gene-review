    - order: 3
      role: positioning and membrane anchoring of the site
      node:
        id: pas_positioning
        label: Positioning of the PAS at the vacuolar membrane
        module_type: REGULATORY_STEP
        description: >-
          The PAS condensate is not free-floating. Vac8 tethers it to the
          vacuolar membrane through Atg13 and holds it there for the whole of
          autophagosome biogenesis, creating a confined space between the ER and
          the vacuole. Tethering is by specific protein-protein interaction with
          the droplet, which is what explains the vacuolar localization of the
          site. The vacuolar membrane is not intrinsically special: ectopic Vac8
          redirects autophagosome formation to the nuclear membrane.
        concepts:
          - preferred_term: vacuole-isolation membrane contact site
            term:
              id: GO:0120095
              label: vacuole-isolation membrane contact site
        annotons:
          - id: vac8_pas_anchor
            label: Vac8 anchoring of the PAS to the vacuolar membrane
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: Vac8 (S. cerevisiae)
                term:
                  id: UniProtKB:P39968
                  label: Vacuolar protein 8
            function:
              preferred_term: vacuolar membrane tether and nucleation hub for the PAS
              description: >-
                Armadillo-repeat tether that anchors the PAS via Atg13 and, in
                selective autophagy, recruits the cargo complex via Atg11 and the
                PI3K complex. No exact GO molecular-function term is asserted;
                GO's tether-activity terms are ER-centric.
              targets:
                - preferred_term: Atg13 (S. cerevisiae)
                  term:
                    id: UniProtKB:Q06628
                    label: Autophagy-related protein 13
                - preferred_term: Atg11 (S. cerevisiae)
                  term:
                    id: UniProtKB:Q12527
                    label: Autophagy-related protein 11
            locations:
              - preferred_term: fungal-type vacuole membrane
                term:
                  id: GO:0000329
                  label: fungal-type vacuole membrane
            evidence:
              - source_id: PMID:31649143
                statement: Vac8 is a vacuolar tether that anchors the PAS via Atg13 throughout autophagosome biogenesis.
                supporting_text: >-
                  We show that Vac8 constitutes a vacuolar tether that stably
                  anchors the PAS to the vacuole throughout autophagosome
                  biogenesis via the PAS component Atg13.
              - source_id: PMID:34893607
                statement: Vac8 is a central hub that nucleates the PAS at the vacuolar membrane in selective autophagy, recruiting cargo via Atg11 and the PI3K complex.
                supporting_text: >-
                  Here we show that Vac8 acts as a central hub to nucleate the
                  phagophore assembly site at the vacuolar membrane during
                  selective autophagy.
              - source_id: PMID:34893607
                statement: The vacuolar membrane is not specifically required - ectopic Vac8 redirects autophagosome formation to the nuclear membrane.
                supporting_text: >-
                  Importantly, ectopic Vac8 redirects autophagosome formation to
                  the nuclear membrane, indicating that the vacuolar membrane is
                  not specifically required.
          - id: atg1_droplet_membrane_tethering
            label: Protein-protein tethering of the Atg1 droplet to membrane
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: Atg1/ULK1 kinase complex
                term:
                  id: GO:1990316
                  label: Atg1/ULK1 kinase complex
            role_description: >-
              Reconstituted Atg1-complex droplets are tethered to membranes by
              specific protein-protein interactions, which accounts for the
              vacuolar localization of the PAS in cells.
            evidence:
              - source_id: PMID:32025038
                statement: Atg1-complex droplets tether to membranes via specific protein-protein interactions, explaining PAS vacuolar localization.
                supporting_text: >-
                  In vitro experiments show that Atg1-complex droplets can be
                  tethered to membranes via specific protein-protein
                  interactions, explaining the vacuolar membrane localization of
                  the PAS in vivo.
    - order: 4
      role: turnover and disassembly of the site
      node:
        id: pas_turnover
        label: Turnover and disassembly of the PAS
        module_type: REGULATORY_STEP
        description: >-
          The site takes itself apart. Atg1, activated by Atg8-PE on the growing
          phagophore, phosphorylates Atg13; that phosphorylation dissociates the
          Atg1 complex and drives rapid turnover of its subunits at the PAS. The
          same phosphorylation that blocks Atg1-complex phase separation in vitro
          is therefore the physiological off-switch for the condensate, closing a
          negative-feedback loop from the product membrane back onto the site
          that made it.
        annotons:
          - id: atg1_atg13_phosphorylation_dissolution
            label: Atg1-dependent Atg13 phosphorylation and Atg1 complex dissociation
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: Atg1 (S. cerevisiae)
                term:
                  id: UniProtKB:P53104
                  label: Serine/threonine-protein kinase ATG1
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: Atg13 (S. cerevisiae)
                  term:
                    id: UniProtKB:Q06628
                    label: Autophagy-related protein 13
            processes:
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            role_description: >-
              Disassembly mechanism of the site: phosphorylated Atg13 no longer
              holds the complex together, so subunits exchange rapidly rather
              than remaining as a stable condensate.
            evidence:
              - source_id: PMID:34798055
                statement: Atg1-dependent Atg13 phosphorylation dissociates the Atg1 complex and drives rapid subunit turnover at the PAS.
                supporting_text: >-
                  Atg1-dependent phosphorylation of Atg13 triggers Atg1 complex
                  dissociation, enabling rapid turnover of Atg1 complex subunits
                  at the pre-autophagosomal structure (PAS).
              - source_id: PMID:32025038
                statement: Phosphorylation that inhibits Atg1-complex phase separation impairs PAS formation, linking the same modification to condensate dissolution.
                supporting_text: >-
                  point mutations or phosphorylation that inhibit phase
                  separation impair PAS formation in vivo
  variant_sets:
    - id: pas_scaffolding_route
      label: Scaffolding route that nucleates the site
      axis: induction route / cargo selectivity
      selection: EXACTLY_ONE
      notes: >-
        The two routes build the same kind of condensate at the same place but
        use different upstream scaffolds, and the Atg17-Atg31-Atg29 complex is
        specifically required for the starvation-induced route.
      variants:
        - id: bulk_starvation_route
          label: Starvation-induced bulk autophagy (Atg17-scaffolded)
          module_type: CELLULAR_COMPONENT
          description: >-
            Nitrogen starvation and TORC1 inactivation dephosphorylate Atg13,
            which then bridges Atg1 to the Atg17-Atg31-Atg29 scaffold. Cargo is
            non-selective.
          annotons:
            - id: bulk_route_atg17_requirement
              label: Atg17-Atg31-Atg29 requirement for the starvation route
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: Atg17 (S. cerevisiae)
                  term:
                    id: UniProtKB:Q06410
                    label: Autophagy-related protein 17
              locations:
                - preferred_term: phagophore assembly site
                  term:
                    id: GO:0000407
                    label: phagophore assembly site
              role_description: >-
                Scaffold whose requirement is specific to starvation-induced
                autophagy; selective autophagy can proceed without it.
              evidence:
                - source_id: PMID:19755117
                  statement: Atg17, Atg29, and Atg31 are specifically required for starvation-induced autophagosome formation and for PAS organization.
                  supporting_text: >-
                    Atg17, Atg29, and Atg31/Cis1 are specifically required for
                    autophagosome formation by acting as a scaffold complex
                    essential for pre-autophagosomal structure (PAS)
                    organization.
        - id: selective_cargo_route
          label: Selective autophagy and the Cvt pathway (Atg11-scaffolded)
          module_type: CELLULAR_COMPONENT
          description: >-
            Cargo-bound receptors recruit the Atg11 scaffold, which Vac8 holds at
            the vacuolar membrane; cargo-dependent clustering plus Vac8-dependent
            sequestering of early Atg factors, with local Atg1 activation, builds
            the site. Operates constitutively rather than on starvation.
          concepts:
            - preferred_term: cytoplasm to vacuole targeting by the Cvt pathway
              term:
                id: GO:0032258
                label: cytoplasm to vacuole targeting by the Cvt pathway
          annotons:
            - id: atg11_cargo_scaffold
              label: Atg11 cargo-linked scaffold
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: Atg11 (S. cerevisiae)
                  term:
                    id: UniProtKB:Q12527
                    label: Autophagy-related protein 11
              function:
                preferred_term: protein-macromolecule adaptor activity
                term:
                  id: GO:0030674
                  label: protein-macromolecule adaptor activity
                description: >-
                  Links cargo-receptor complexes to Vac8 and to the Atg1
                  machinery, taking the structural role that Atg17 plays in the
                  starvation route.
              processes:
                - preferred_term: cytoplasm to vacuole targeting by the Cvt pathway
                  term:
                    id: GO:0032258
                    label: cytoplasm to vacuole targeting by the Cvt pathway
              locations:
                - preferred_term: phagophore assembly site
                  term:
                    id: GO:0000407
                    label: phagophore assembly site
              evidence:
                - source_id: PMID:34893607
                  statement: Vac8 recruits the cargo complex via the Atg11 scaffold to nucleate the PAS in selective autophagy.
                  supporting_text: >-
                    Vac8 directly recruits the cargo complex via the Atg11
                    scaffold.
                - source_id: PMID:34893607
                  statement: Cargo clustering plus Vac8-dependent sequestering of early Atg factors and local Atg1 activation promote PAS assembly.
                  supporting_text: >-
                    Cargo-dependent clustering and Vac8-dependent sequestering of
                    these early autophagy factors, along with local Atg1
                    activation, promote phagophore assembly site assembly at the
                    vacuole.
  connections:
    - source: pas_nucleation
      target: pas_composition
      connection_type: PRECEDES
      description: >-
        Scaffold-driven phase separation creates the condensate onto which the
        membrane component and the downstream machinery are loaded.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Protein recruitment and phase separation, not a reaction chain with a
        shared small-molecule intermediate.
    - source: atg17_atg31_atg29_scaffold
      target: atg1_complex_phase_separation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Atg17 is the most upstream organizer; the Atg1 complex assembles onto it
        and phase-separates.
    - source: pas_positioning
      target: pas_nucleation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Vac8 tethering both localizes the condensate and, in the selective route,
        nucleates it by concentrating cargo and early Atg factors.
    - source: pas_composition
      target: pas_turnover
      connection_type: PRECEDES
      description: >-
        Atg8 lipidated by the machinery at the site activates Atg1, which then
        dismantles the Atg1 complex.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Signalling feedback between membrane state and condensate state, not a
        metabolic chain.
    - source: pas_atg8_conjugation
      target: atg1_atg13_phosphorylation_dissolution
      connection_type: POSITIVELY_REGULATES
      description: >-
        Atg8-PE produced on the growing phagophore activates Atg1, closing the
        negative-feedback loop that disassembles the site.
    - source: atg1_atg13_phosphorylation_dissolution
      target: atg1_complex_phase_separation
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Atg13 phosphorylation is the off-switch for the condensate: it dissociates
        the complex and is the same modification that blocks phase separation in
        vitro.
