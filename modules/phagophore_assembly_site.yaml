                  evidence:
                    - source_id: PMID:22826123
                      statement: Atg9 vesicles assemble individually into the PAS and end up in the outer autophagosomal membrane.
                      supporting_text: >-
                        During starvation, several Atg9 vesicles assembled
                        individually into the preautophagosomal structure, and
                        eventually, they are incorporated into the autophagosomal
                        outer membrane.
                    - source_id: PMID:22826123
                      statement: Only a few Atg9 vesicles are needed per round of autophagosome formation.
                      supporting_text: >-
                        only a few Atg9 vesicles were required for a single round
                        of autophagosome formation
                - id: atg1_eat_vesicle_tethering
                  label: Atg1 EAT-domain tethering of Atg9 vesicles
                  participant:
