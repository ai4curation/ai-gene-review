id: MODULE:phagophore_assembly_site
title: Phagophore assembly site (PAS)
description: >-
  The phagophore assembly site (PAS, historically the pre-autophagosomal
  structure) is the single perivacuolar punctum in budding yeast at which the
  autophagy machinery is concentrated and from which the phagophore emerges. It
  is not a membrane-bounded organelle: the PAS is a liquid-like condensate of Atg
  proteins, nucleated by phase separation of the Atg1 kinase complex on an
  Atg17-Atg31-Atg29 scaffold (starvation-induced bulk autophagy) or on an
  Atg11-cargo scaffold (selective autophagy and the Cvt pathway), and tethered to
  the vacuolar membrane by Vac8. Membrane is present at the PAS but is a
  component of it rather than its boundary: a small number of Atg9 vesicles
  cluster at the site and are incorporated into the outer autophagosomal
  membrane, and the downstream machinery - the class III PI3K complex I, the
  Atg2-Atg18 lipid transfer bridge, and the Atg8 conjugation system - is
  recruited onto the condensate in a defined hierarchy. The site is dismantled
  from within: Atg1, activated by lipidated Atg8 on the growing phagophore,
  phosphorylates Atg13 and triggers dissociation and rapid turnover of Atg1
  complex subunits at the PAS. This module models the PAS as a cellular component
  with a nucleation step, a composition, a positioning mechanism, and a turnover
  step.
status: DRAFT
scope: CONCRETE
references:
