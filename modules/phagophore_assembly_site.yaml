  - id: file:modules/phagophore_organelle_contact_site.yaml
    title: "Module: phagophore-organelle membrane contact site"
evidence:
  - source_id: PMID:32025038
    title: Phase separation organizes the site of autophagosome formation.
    statement: >-
      Establishes the physical nature of the whole module: the PAS is a
      liquid-like condensate of Atg proteins formed by phase separation of the
      Atg1 complex, and phosphorylation or point mutations that block phase
      separation block PAS formation in vivo.
    supporting_text: >-
      Here we show that the PAS is in fact a liquid-like condensate of Atg
      proteins.
  - source_id: PMID:17295840
    title: Hierarchy of Atg proteins in pre-autophagosomal structure organization.
    statement: >-
      Defines the recruitment hierarchy used to order this module's parts, with
      Atg17 as the most upstream scaffold.
    supporting_text: >-
      This analysis suggests that Atg17p is the most basic protein in PAS
      organization: when it is specifically targeted to the plasma membrane,
      other Atg proteins are recruited to that location, suggesting that Atg17p
      acts as a scaffold protein to organize Atg proteins to the PAS.
  - source_id: file:modules/phagophore_organelle_contact_site.yaml
    title: "Module: phagophore-organelle membrane contact site"
    statement: >-
      Sibling module. The PAS is the organizing hub at which the phagophore-ER
      contact site is built; that module owns the ATG2/WIPI4/ATG9 bridging
      machinery and the lipid conduit, and is deliberately not duplicated here.
notes: >-
  Boundary decisions. This module is the PAS as GO:0000407 defines it: the
  punctate site at which the Atg machinery assembles. Its core is therefore the
  scaffolding and condensate machinery that makes the site exist (Atg17-Atg31-
  Atg29 or Atg11, Atg1-Atg13, Vac8) plus the membrane and downstream machinery
  concentrated there. The mechanics of lipid delivery across the phagophore-ER
  junction are a separate object and live in
  MODULE:phagophore_organelle_contact_site; Atg2, Atg18, and Atg9 appear here
  only as PAS residents, with their molecular functions modeled in that module.
  Also excluded: autophagosome closure and fusion, cargo receptor biology beyond
  the Atg11 scaffolding interaction, and TORC1 signalling upstream of Atg13
  dephosphorylation.

  Species scope. The PAS as a single discrete punctum is a yeast concept and this
  module is deliberately concrete about that: the scaffold subunits Atg17, Atg29,
  and Atg31 have no mammalian orthologues (FIP200/RB1CC1 is the functional
  counterpart within the ULK1 complex), and Atg101 is absent from S. cerevisiae
  though present in S. pombe and mammals. Whether mammals have a PAS equivalent
  at all is recorded as a knowledge gap rather than assumed.

  Ontology. Two structures central to this module have no GO term: the
  Atg17-Atg29-Atg31 scaffold complex, and the Atg9 vesicle (and its membrane).
  The absence of the latter is a direct contributor to the GO:0034045 "phagophore
  assembly site membrane" problem recorded in the knowledge gaps.
knowledge_gaps:
  - gap_statement: >-
      GO:0034045 "phagophore assembly site membrane" does not pick out a unique
      structure. Its definition ("a cellular membrane associated with the
      phagophore assembly site") is satisfied by at least three distinct
      membranes - the phagophore itself, the clustered Atg9-vesicle membranes,
      and the adjacent ER/omegasome membrane - and the PAS it refers to is a
      protein condensate rather than a membrane compartment, so "the membrane of
      the PAS" has no single referent.
    boundary: >-
      Two facts sharpen this. First, GO:0034045 carries "phagophore" and
      "isolation membrane" as related synonyms and "PAS membrane" as its exact
      synonym, while GO:0061908 "phagophore" is a separate term whose own related
      synonym is "isolation membrane" - so the same two strings name two
      different cellular components (verifiable in QuickGO/OLS). Second, the PAS
      was shown in 2020 to be a liquid-like Atg-protein condensate. Existing GOA
      annotations to GO:0034045 mix the readings: ATG5, ATG16, and ATG2A/B are
      phagophore-membrane residents, whereas ATG1 and ATG101 are condensate
      components that are not membrane-integral.
    gap_kind:
      - ONTOLOGY
      - CURATION
    dark_aspect: CC_DARK
    significance: >-
      Annotations made to GO:0034045 are not interoperable: a consumer cannot
      tell whether a protein was placed on the phagophore membrane, on Atg9
      vesicles, or merely at the PAS. It also silently competes with GO:0061908
      for the same meaning.
    resolution: >-
      Split the readings. Retire the "phagophore" and "isolation membrane"
      synonyms from GO:0034045 in favour of GO:0061908, add an "Atg9 vesicle
      membrane" term for the vesicular membrane clustered at the site, and either
      restrict GO:0034045 to that membrane or obsolete it and re-annotate its
      existing uses to GO:0061908, the new vesicle term, or an ER-phagophore
      contact-site term. Reviewing the current GO:0034045 annotation set would be
      the natural first step.
    provenance:
      - reference_id: PMID:32025038
        supporting_text: >-
          Here we show that the PAS is in fact a liquid-like condensate of Atg
          proteins.
      - reference_id: PMID:22826123
        supporting_text: >-
          During starvation, several Atg9 vesicles assembled individually into
          the preautophagosomal structure, and eventually, they are incorporated
          into the autophagosomal outer membrane.
    proposed_terms:
      - proposed_name: Atg9 vesicle membrane
        proposed_definition: >-
          The membrane of a small Atg9-containing vesicle of the type that
          clusters at the phagophore assembly site and is incorporated into the
          outer autophagosomal membrane during autophagosome formation.
        justification: >-
          Gives the vesicular membrane at the PAS a term of its own, so that
          "phagophore assembly site membrane" no longer has to stand in for it,
          for the phagophore membrane, and for the adjacent ER membrane at once.
  - gap_statement: >-
      How much of the phagophore membrane originates from membrane already
      resident at the PAS is unquantified: the number of Atg9 vesicles consumed
      per autophagosome is small, but the fraction of final autophagosomal
      surface they contribute, versus lipid delivered by Atg2-mediated transfer
      from the ER, has not been measured.
    boundary: >-
      It is established that Atg9 vesicles assemble individually into the PAS and
      end up in the outer autophagosomal membrane, that only a few are needed per
      round, and separately that Atg2 transfers lipid from the ER to the
      phagophore. What is missing is the accounting between the two routes.
    gap_kind:
      - BIOLOGY
    dark_aspect: CC_DARK
    significance: >-
      The answer determines whether the PAS should be modeled as a membrane
      source or purely as an organizing hub with a seed, which in turn affects
      how PAS-resident proteins should be annotated.
    resolution: >-
      Quantitative correlative light-electron microscopy or lipidomics of
      staged phagophores in strains where Atg9 vesicle delivery and Atg2 transfer
      are separately impaired.
    provenance:
      - reference_id: PMID:22826123
        supporting_text: >-
          only a few Atg9 vesicles were required for a single round of
          autophagosome formation
  - gap_statement: >-
      Whether mammalian cells have a structure equivalent to the yeast PAS is
      unsettled, yet GO:0000407 - whose definition is drawn from the yeast
      punctum - is applied to mammalian proteins.
    boundary: >-
      In yeast the PAS is a single perivacuolar punctum generated close to the ER
      but always near the vacuole. In mammals, autophagosome formation sites form
      throughout the cytosol in specialized ER subdomains, and the scaffold
      subunits that define the yeast PAS (Atg17, Atg29, Atg31) have no mammalian
      orthologues. Whether the mammalian ULK1 punctum/omegasome is the same kind
      of object or merely an analogue is not established.
    gap_kind:
      - BIOLOGY
      - CURATION
    dark_aspect: CC_DARK
    significance: >-
      If the structures are not equivalent, cross-species GO:0000407 annotations
      and IBA propagation across the yeast/metazoan boundary assert an identity
      that has not been demonstrated.
    resolution: >-
      Test whether mammalian ULK1-complex puncta are phase-separated condensates
      with the material properties and scaffold-dependence shown for the yeast
      PAS; failing that, split GO:0000407 into taxon-appropriate children.
    provenance:
      - reference_id: PMID:31649143
        supporting_text: >-
          In mammals, autophagosome formation sites form throughout the cytosol
          in specialized subdomains of the endoplasmic reticulum (ER). In yeast,
          the PAS is also generated close to the ER, but always in the vicinity
          of the vacuole.
module:
  id: phagophore_assembly_site
  label: Phagophore assembly site (PAS)
  module_type: CELLULAR_COMPONENT
  description: >-
    A phase-separated condensate of Atg proteins, anchored at the vacuolar
    membrane, at which the autophagy machinery is concentrated and the phagophore
    is nucleated. Modeled as nucleation, composition, positioning, and turnover.
  concepts:
    - preferred_term: phagophore assembly site
      term:
        id: GO:0000407
        label: phagophore assembly site
      description: >-
        Historically the pre-autophagosomal structure (PAS). GO's definition -
        punctate structures proximal to the ER where the Atg machinery assembles
        on autophagy induction - matches the yeast punctum modeled here.
    - preferred_term: autophagosome assembly
      term:
        id: GO:0000045
        label: autophagosome assembly
      description: The process the site organizes.
  context:
    taxa:
      - preferred_term: Saccharomyces cerevisiae
        description: >-
          The concrete scope of this module. The PAS as a single discrete punctum
          is defined in budding yeast; the scaffold subunits Atg17, Atg29, and
          Atg31 are fungal and have no mammalian orthologues. Whether a mammalian
          equivalent exists is recorded as a knowledge gap.
    cellular_components:
      - preferred_term: phagophore assembly site
        term:
          id: GO:0000407
          label: phagophore assembly site
      - preferred_term: fungal-type vacuole membrane
        term:
          id: GO:0000329
          label: fungal-type vacuole membrane
        description: The membrane the PAS condensate is tethered to in budding yeast.
    conditions:
      - preferred_term: macroautophagy-inducing conditions
        term:
          id: GO:0016236
          label: macroautophagy
        description: >-
          The site forms constitutively for the Cvt pathway and is strongly
          induced by nitrogen starvation and by TORC1 inactivation.
  parts:
    - order: 1
      role: scaffold-driven nucleation of the condensate
      node:
        id: pas_nucleation
        label: Nucleation of the PAS condensate
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Autophagy induction dephosphorylates Atg13, letting it bridge Atg1 to
          the Atg17-Atg31-Atg29 scaffold. The assembled Atg1 complex undergoes
          liquid-liquid phase separation, and the resulting droplet is the PAS.
          Mutations or phosphorylation events that block phase separation in
          vitro block PAS formation in vivo, so the condensate is not incidental
          to the site - it is the site.
        annotons:
          - id: atg17_atg31_atg29_scaffold
            label: Atg17-Atg31-Atg29 scaffold complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: Atg17-Atg31-Atg29 ternary complex
                description: >-
                  Constitutive, dimeric, equimolar ternary complex forming a
                  double-crescent scaffold. No GO cellular-component term exists
                  for it. Fungal-specific; the mammalian ULK1 complex uses
                  FIP200/RB1CC1 in this structural role.
                active_units:
                  - id: atg17_unit
                    label: Atg17 subunit
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Atg17 (S. cerevisiae)
                        term:
                          id: UniProtKB:Q06410
                          label: Autophagy-related protein 17
                    role: crescent-shaped scaffold; the most upstream PAS organizer
                  - id: atg31_unit
                    label: Atg31 subunit
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Atg31 (S. cerevisiae)
                        term:
                          id: UniProtKB:Q12421
                          label: Autophagy-related protein 31
                    role: scaffold subunit; phosphorylated form is part of the ternary complex
                  - id: atg29_unit
                    label: Atg29 subunit
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Atg29 (S. cerevisiae)
                        term:
                          id: UniProtKB:Q12092
                          label: Autophagy-related protein 29
                    role: scaffold subunit
            function:
              preferred_term: molecular condensate scaffold activity
              term:
                id: GO:0140693
                label: molecular condensate scaffold activity
              description: >-
                Scaffolding role in organizing the Atg proteins into the PAS
                condensate. Atg17 targeted ectopically to the plasma membrane
                recruits the other Atg proteins there.
            processes:
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            evidence:
              - source_id: PMID:17295840
                statement: Atg17 is the most upstream PAS organizer and acts as a scaffold.
                supporting_text: >-
                  This analysis suggests that Atg17p is the most basic protein in
                  PAS organization: when it is specifically targeted to the
                  plasma membrane, other Atg proteins are recruited to that
                  location, suggesting that Atg17p acts as a scaffold protein to
                  organize Atg proteins to the PAS.
              - source_id: PMID:19755117
                statement: Atg17, Atg29, and Atg31 form a constitutive equimolar ternary complex that is a functional unit for autophagosome formation.
                supporting_text: >-
                  Here, we show that these proteins constitutively form an
                  Atg17-Atg29-Atg31 ternary complex, in which phosphorylated
                  Atg31 is included.
              - source_id: PMID:23219485
                statement: Atg17-Atg31-Atg29 assembles with Atg1 and Atg13 on autophagy induction to initiate phagophore formation.
                supporting_text: >-
                  Upon induction of autophagy, Atg17-Atg31-Atg29 assembles with
                  Atg1 and Atg13, which in turn initiates the formation of the
                  phagophore.
          - id: atg1_complex_phase_separation
            label: Atg1 complex phase separation into the PAS droplet
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: Atg1/ULK1 kinase complex
                term:
                  id: GO:1990316
                  label: Atg1/ULK1 kinase complex
                active_units:
                  - id: atg1_unit
                    label: Atg1 kinase subunit
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Atg1 (S. cerevisiae)
                        term:
                          id: UniProtKB:P53104
                          label: Serine/threonine-protein kinase ATG1
                    role: initiating serine/threonine kinase
                    function:
                      preferred_term: protein serine/threonine kinase activity
                      term:
                        id: GO:0004674
                        label: protein serine/threonine kinase activity
                  - id: atg13_unit
                    label: Atg13 subunit
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Atg13 (S. cerevisiae)
                        term:
                          id: UniProtKB:Q06628
                          label: Autophagy-related protein 13
                    role: >-
                      intrinsically disordered bridge between Atg1 and the Atg17
                      scaffold; its phosphorylation state is the switch for both
                      condensate formation and condensate dissolution
                    function:
                      preferred_term: kinase activator activity
                      term:
                        id: GO:0019209
                        label: kinase activator activity
            function:
              preferred_term: molecular condensate scaffold activity
              term:
                id: GO:0140693
                label: molecular condensate scaffold activity
              description: >-
                The Atg1 complex is the phase-separating component; the droplet
                it forms is the PAS.
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            evidence:
              - source_id: PMID:32025038
                statement: The PAS is a liquid-like condensate of Atg proteins.
                supporting_text: >-
                  Here we show that the PAS is in fact a liquid-like condensate
                  of Atg proteins.
              - source_id: PMID:32025038
                statement: >-
                  The Atg1 complex phase-separates in vitro, and mutations or
                  phosphorylation that block phase separation block PAS formation
                  in vivo.
                supporting_text: >-
                  The autophagy-initiating Atg1 complex undergoes phase
                  separation to form liquid droplets in vitro, and point
                  mutations or phosphorylation that inhibit phase separation
                  impair PAS formation in vivo.
    - order: 2
      role: composition of the assembled site
      node:
        id: pas_composition
        label: Composition of the PAS
        module_type: CELLULAR_COMPONENT
        description: >-
          Three layers occupy the site: the protein condensate itself, a small
          amount of vesicular membrane clustered within it, and the downstream
          machinery recruited onto it in a defined hierarchy. Separating these is
          the point of the module - conflating the second and third layers is
          what makes GO:0034045 unusable.
        concepts:
          - preferred_term: phagophore assembly site
            term:
              id: GO:0000407
              label: phagophore assembly site
        parts:
          - order: 1
            role: membrane component clustered within the site
            node:
              id: pas_membrane_component
              label: Atg9 vesicle cluster at the PAS
              module_type: CELLULAR_COMPONENT
              description: >-
                A small number of Atg9-containing vesicles assemble individually
                into the PAS and are ultimately incorporated into the outer
                autophagosomal membrane. This is the membrane that is genuinely
                resident at the site, as distinct from the phagophore membrane
                that grows out of it and from the nearby ER. GO has no term for
                the Atg9 vesicle or its membrane.
              annotons:
                - id: atg9_vesicle_membrane_seed
