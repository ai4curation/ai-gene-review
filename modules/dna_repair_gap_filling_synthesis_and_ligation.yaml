                statement: Three-subunit human Pol delta, which binds PCNA through POLD3 (p66), shows PCNA-dependent DNA replication.
                supporting_text: only reconstituted three-subunit DNA polymerase delta displayed PCNA-dependent DNA replication that could be inhibited by the PCNA-binding domain of p21(Cip1)
              - source_id: PMID:20227374
