        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: PCNA loading at the primer terminus of the gap
      node:
        id: clamp_loading
        label: An RFC-family clamp loader loads PCNA at the 3'-OH primer terminus
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The clamp loader binds the primer-template junction with ATP, opens a PCNA ring and
          closes it around the duplex; ATP hydrolysis releases the loader. The canonical
          RFC1-RFC complex serves both pathways and is the loader for Pol delta; in NER the
          alternative CTF18-RFC, which replaces RFC1 by CHTF18 on the same RFC2-RFC5 core, is
          needed for Pol epsilon recruitment.
        variant_sets:
          - id: clamp_loader
            label: Clamp loader
            axis: RFC-family clamp loader (large subunit) that loads PCNA for the repair polymerase
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            variants:
              - id: rfc1_rfc_variant
                label: Replication factor C (RFC1-RFC5), NER and MMR
                module_type: MOLECULAR_FUNCTION
                annotons:
                  - id: rfc_clamp_loader
                    label: RFC1-RFC loads PCNA
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: replication factor C (RFC1-RFC5)
                        term:
                          id: GO:0005663
                          label: DNA replication factor C complex
                        active_units:
                          - id: rfc_rfc1
                            label: RFC1 large subunit
                            role: >-
                              Large subunit that defines the canonical loader; a stable RFC2-RFC5
                              subcomplex lacking it hydrolyses ATP but is not stimulated by PCNA
                              and does not support replication (PMID:9488738). No experimental
                              molecular function row in human GOA.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: RFC1
                                term:
                                  id: UniProtKB:P35251
                                  label: Replication factor C subunit 1
                          - id: rfc_rfc2
                            label: RFC2 small subunit
                            role: AAA+ small subunit of the shared RFC2-RFC5 core.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: RFC2
                                term:
                                  id: UniProtKB:P35250
                                  label: Replication factor C subunit 2
                          - id: rfc_rfc3
                            label: RFC3 small subunit
                            role: AAA+ small subunit of the shared RFC2-RFC5 core.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: RFC3
                                term:
                                  id: UniProtKB:P40938
                                  label: Replication factor C subunit 3
                          - id: rfc_rfc4
                            label: RFC4 small subunit
                            role: AAA+ small subunit of the shared RFC2-RFC5 core.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: RFC4
                                term:
                                  id: UniProtKB:P35249
                                  label: Replication factor C subunit 4
