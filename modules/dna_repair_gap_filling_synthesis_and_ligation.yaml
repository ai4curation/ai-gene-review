id: MODULE:dna_repair_gap_filling_synthesis_and_ligation
title: Human DNA repair gap filling — RFC (or CTF18-RFC) loading of PCNA, gap-filling synthesis by Pol delta, Pol epsilon or Pol kappa, and nick sealing by LIG1 or LIG3-XRCC1, the shared late steps of nucleotide excision repair and mismatch repair
description: >-
  Excision repair pathways remove a damaged or mismatched stretch of one DNA strand and
  leave a single-stranded gap whose 3'-OH primer terminus faces an intact template strand.
  The last two steps, gap-filling DNA synthesis and nick sealing, use the same replication
  proteins in nucleotide excision repair (NER) and in mismatch repair (MMR). The clamp
  loader replication factor C (RFC, RFC1-RFC5) binds the primer terminus with ATP, opens
  the homotrimeric sliding clamp PCNA and closes it around the DNA. PCNA then tethers a
  DNA polymerase to the template so that it synthesises the patch processively. In MMR
  the polymerase is DNA polymerase delta (POLD1-POLD4), recruited through its POLD3
  subunit, and the reaction has been reconstituted with purified human proteins. In NER,
  which fills a gap of about 30 nucleotides, three polymerases share the work in human
  cells: Pol delta together with the Y-family polymerase kappa for about half of repair
  synthesis, and DNA polymerase epsilon (POLE, POLE2-POLE4), loaded through the
  alternative clamp loader CTF18-RFC, for the rest. The remaining nick, between the 3' end
  of the new patch and the 5'-phosphate of the original strand, is sealed by an
  ATP-dependent DNA ligase that forms an enzyme-AMP intermediate: DNA ligase 1 (LIG1) in
  both pathways, and in NER also the DNA ligase III alpha-XRCC1 complex. Damage or
  mismatch recognition, incision and excision belong to the parent pathways and are
  outside this module, as are base excision repair gap filling by DNA polymerase beta,
  translesion synthesis, and Okazaki fragment maturation.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0000731
    title: DNA synthesis involved in DNA repair
    statement: >-
      The module's process concept, chosen because no GO term covers repair synthesis and
      ligation across excision repair pathways. Its label fits the module, but its current
      definition (synthesis that proceeds from a broken 3' end on a homologous intact
      duplex) describes recombinational synthesis, although the term also parents
      UV-damage excision repair synthesis. A definition change is requested in
      proposed_ontology_changes. There is no live GO process term for DNA ligation: the
      ligation process terms were obsoleted as molecular functions, so the sealing step is
      captured by DNA ligase (ATP) activity on the ligase annotons.
  - source_id: GO:0006297
    title: nucleotide-excision repair, DNA gap filling
    statement: >-
      The NER-specific process for the same steps, whose definition names both the DNA
      polymerase and the DNA ligase, and which cross-references the Reactome event
      Gap-filling DNA repair synthesis and ligation in GG-NER. It is the process of the
      NER-branch annotons. GO has no corresponding mismatch repair child, so MMR-branch
      annotons carry mismatch repair itself.
  - source_id: PMID:20227374
    title: Three DNA polymerases, recruited by different mechanisms, carry out NER repair synthesis in human cells.
    statement: >-
      In human fibroblasts NER repair synthesis is done by Pol kappa with Pol delta,
      loaded by RFC1-RFC, POLD3 and PCNA, and by Pol epsilon, loaded by CTF18-RFC.
    supporting_text: We report that, in human fibroblasts, approximately half of the repair synthesis requires both pol kappa and pol delta, and both polymerases can be recovered in the same repair complexes.
  - source_id: PMID:7697716
    title: Mammalian DNA nucleotide excision repair reconstituted with purified protein components.
    statement: >-
      Human NER repair synthesis was completed in vitro by Pol epsilon, RFC, PCNA and DNA
      ligase I added to the reconstituted incision reaction.
    supporting_text: Complete repair synthesis was achieved by combining these factors with DNA polymerase epsilon, RFC, PCNA, and DNA ligase I.
  - source_id: PMID:16143102
    title: Reconstitution of 5'-directed human mismatch repair in a purified system.
    statement: >-
      Human MMR was reconstituted with PCNA, RFC, Pol delta and ligase I as its late
      factors.
    supporting_text: The reconstituted system includes MutSalpha or MutSbeta, MutLalpha, RPA, EXO1, HMGB1, PCNA, RFC, polymerase delta, and ligase I.
  - source_id: PMID:33510387
    title: Mispair-bound human MutS-MutL complex triggers DNA incisions and activates mismatch repair.
    statement: In human MMR, Pol delta fills the gap with PCNA and RPA, and LIG1 seals the nick.
    supporting_text: The DNA gap is filled by DNA polymerase δ in concerted reactions with PCNA and RPA, and the nick is ligated by ligase I.
notes: >-
  Origin. A shared-machinery module requested in projects/RGD_PATHWAY_ONTOLOGY.md (eleventh
  set and Next steps: factor a human DNA gap-filling module out of the NER and mismatch
  repair modules). It is not derived from a single RGD pathway, and no RGD Pathway Ontology
  term matches it, so no PW id is cited as evidence. The candidates checked in
  .cache/rgd_pw/pw.obo were the NER pathway (PW:0000130) and the mismatch repair pathway
  (PW:0000662), which this module covers only in part (their late steps), the DNA strand
  elongation pathway (PW:0002660), which is defined by DNA replication, and the base excision
  repair pathway (PW:0000129), whose gap filling uses Pol beta and is out of scope. The RGD
  gene lists of the NER and MMR pathways include the RFC, PCNA, POLD and LIG1 members. The
  module is meant to be referenced from nucleotide_excision_repair (repair_synthesis and
  ligation nodes) and eukaryotic_mismatch_repair (pcna_loading, pold_resynthesis and
  lig1_ligation nodes), which currently model the same proteins inline; it does not itself
  use module_ref towards them, so that pointing them here cannot create a reference cycle.
  The coordinator decides whether to repoint them.

  Members and grounding. UniProt accessions and labels are from UniProt REST (November 2026)
  and the local POLD2, POLE4 and LIG3 records. Molecular functions follow each protein's
  experimental human GOA rows in QuickGO (November 2026). Functions not backed by an
  experimental row on the exact term are stated on their annotons: DNA clamp loader activity
  on the RFC1-RFC complex (the only experimental clamp loader rows, contributes_to on
  RFC2-RFC5, come from a CTF18-RFC assay), DNA polymerase processivity factor activity on
  PCNA (IBA-level), and DNA ligase (ATP) activity on LIG1 (experimental rows are on the parent
  DNA ligase activity). The polymerase reaction is grounded to RHEA:22508 (in the UniProt
  catalytic-activity lines of POLD1, POLE and POLK); the ligase reaction (EC 6.5.1.1) has no
  Rhea entry (Rhea query for EC 6.5.1.*, November 2026), so its ATP, AMP and diphosphate are
  grounded to ChEBI only. ChEBI labels were checked in OLS. Gene reviews exist for POLD2,
  POLE4 and LIG3. No PANTHER family or PTN ids are asserted.

  Boundary decisions. (1) Polymerases are included only where there is human evidence in NER
  or MMR gap filling: Pol delta for both (purified human MMR, PMID:16143102; human
  fibroblast NER, PMID:20227374), Pol epsilon and Pol kappa for NER only (PMID:20227374,
  PMID:7697716). Pol epsilon is not in the reconstituted human MMR reaction and has no human
  MMR gap-filling evidence; Pol kappa's NER evidence is human (PMID:20227374) as well as mouse
  (not cited). Pol beta, Pol lambda and the other gap-filling polymerases of base excision
  repair and end joining are excluded. (2) CTF18-RFC is a clamp-loader variant because the
  NER Pol epsilon route depends on it (PMID:20227374); its DSCC1-CHTF8 module is not needed
  for clamp loading and is named here only. ATAD5-RFC (a PCNA unloader) and the RAD17-RFC
  checkpoint loader are excluded. (3) PCNA monoubiquitination by RAD18-RAD6, which recruits
  Pol kappa in NER, is regulation of this step, not a part; it is recorded in
  nucleotide_excision_repair's notes and belongs with translesion synthesis. (4) RPA, which
  coats the gap and works with Pol delta in MMR, is modelled in the parent modules (the
  rpa_ssdna node of nucleotide_excision_repair and rpa_gap_protection of
  eukaryotic_mismatch_repair) because it also acts in their earlier steps; it is not
  repeated here. FEN1 and the Okazaki fragment maturation steps of replication are outside
  the module, since excision repair gaps have no RNA primer or displaced flap. (5) LIG3-XRCC1
  is kept as an NER ligase variant with its weaker evidence stated on the annoton. The paper
  that made it the NER ligase of non-dividing human cells (Moser et al. 2007, PMID:17643379)
  was retracted in 2021 for data manipulation; it is not cited as evidence. Reactome's
  ligation events cite Arakawa et al. 2012 (DT40 replication) and Paul-Konietzko et al. 2015
  (DT40 NER, PMID:26131740); the second is the cited support and is non-human. The parent
  nucleotide_excision_repair module still describes LIG3-XRCC1 as the main NER ligase in
  quiescent cells, which rests on the retracted paper. (6) Process terms: the module concept
  is DNA synthesis involved in DNA repair, used in the sense of its label, with a definition
  change requested; NER-branch annotons carry nucleotide-excision repair, DNA gap filling,
  whose definition covers polymerase and ligase; MMR-branch annotons carry mismatch repair,
  because GO has no MMR gap-filling child. The process terms for DNA ligation are obsolete
  (they represented a molecular function), so the ligation step has no process concept of
  its own.

  GO-CAM. No production GO-CAM model in gocams/index.tsv contains any member (searched by all
  member accessions and by yeast and fission-yeast orthologue symbols); the only NER models
  (KAT5, USP44-DDB2) stop at incision. No gocam_associations are recorded.

  Observations for upstream review. (a) RFC2, RFC3, RFC4, RFC5 and CHTF18 carry
  contributes_to single-stranded DNA helicase activity (IDA, PMID:12930902); the abstract of
  that paper reports clamp loading, DNA binding and weak ATPase activity by CTF18-RFC and no
  helicase activity (abstract only checked; a query, not a claim). (b) The contributes_to DNA
  clamp loader rows on RFC2-RFC5 rest on the CTF18-RFC paper, and RFC1 has no clamp loader
  row; the canonical RFC1-RFC complex has no experimental clamp loader annotation in human
  GOA. (c) GO:0000731's definition is recombination-specific although its label is general
  and it parents an excision repair synthesis term (see proposed_ontology_changes).
proposed_ontology_changes:
  - change_type: NODE_TEXT_DEFINITION_CHANGE
    ontology: GO
    about_node:
      id: GO:0000731
      label: DNA synthesis involved in DNA repair
    old_value: Synthesis of DNA that proceeds from the broken 3' single-strand DNA end and uses the homologous intact duplex as the template.
    new_value: >-
      Synthesis of DNA that is part of a DNA repair process, in which a DNA polymerase extends
      a 3'-OH terminus, such as a broken 3' single-strand end or the primer terminus of a
      single-strand gap left by excision of damaged or mismatched nucleotides, using an intact
      DNA strand as the template.
    change_dsl: >-
      change definition of GO:0000731 from 'Synthesis of DNA that proceeds from the broken 3'
      single-strand DNA end and uses the homologous intact duplex as the template.' to
      'Synthesis of DNA that is part of a DNA repair process, in which a DNA polymerase extends
      a 3'-OH terminus, such as a broken 3' single-strand end or the primer terminus of a
      single-strand gap left by excision of damaged or mismatched nucleotides, using an intact
      DNA strand as the template.'
    origin: SELF_PROPOSED
    confidence: PROBABLE
    justification: >-
      The label is general, but the definition describes only recombinational repair
      synthesis (a broken 3' end extended on a homologous duplex), for which GO already has
      the child GO:0043150 DNA synthesis involved in double-strand break repair via
      homologous recombination. The term also parents GO:1904161 DNA synthesis involved in
      UV-damage excision repair, whose synthesis fills an excision gap and uses no homologous
      duplex, so the definition already contradicts one of its children. Gap-filling
      synthesis in nucleotide excision repair and mismatch repair, by Pol delta, Pol epsilon
      and Pol kappa from the 3'-OH left by incision, has no general process term; the
      NER-specific GO:0006297 exists, but MMR has no counterpart. Generalising the definition
      lets the existing term carry repair synthesis in any repair pathway, matching its label
      and children, without a new term.
    supported_by:
      - reference_id: PMID:20227374
        supporting_text: Pol kappa is recruited to repair sites by ubiquitinated PCNA and XRCC1 and pol delta by the classical replication factor complex RFC1-RFC, together with a polymerase accessory factor, p66, and unmodified PCNA.
      - reference_id: PMID:33510387
        supporting_text: The DNA gap is filled by DNA polymerase δ in concerted reactions with PCNA and RPA, and the nick is ligated by ligase I.
module:
