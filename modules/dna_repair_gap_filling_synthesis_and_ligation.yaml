        label: Sealing of the repair patch by LIG1 or LIG3-XRCC1
        module_type: BIOLOGICAL_PROCESS
        description: >-
          An ATP-dependent DNA ligase joins the 3'-OH of the new patch to the 5'-phosphate of
          the downstream strand through enzyme-AMP and DNA-AMP intermediates, releasing AMP.
          LIG1 is the ligase of both reconstituted reactions; LIG3 with XRCC1 can complete NER.
