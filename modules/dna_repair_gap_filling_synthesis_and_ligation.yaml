                    role_description: >-
                      LIG3 carries DNA ligase (ATP) activity by EXP (PMID:10207110,
                      PMID:20518483) and its UniProt catalytic activity is experimentally
                      supported. The NER role rests on weaker evidence than the LIG1 role: the
                      human study that proposed LIG3-XRCC1 as the NER ligase of non-dividing
                      cells (PMID:17643379) was retracted in 2021, and the remaining direct
                      genetic evidence is from chicken DT40 cells, where LIG3 substitutes for
                      LIG1 in NER independently of the cell cycle (PMID:26131740). Human
                      evidence that XRCC1 acts at NER repair sites comes from Pol kappa
                      recruitment (PMID:20227374). Kept as a variant because Reactome and the
                      LIG3 gene review accept it; the quiescent-cell specialisation is not
                      asserted.
                    evidence:
                      - source_id: Reactome:R-HSA-5690997
                        statement: Reactome lets LIG1 or LIG3 ligate the NER patch in GG-NER and TC-NER.
                        supporting_text: Two DNA ligases, LIG1 and LIG3, can perform the ligation in global genome NER (GG-NER), as well as in transcription-coupled NER (TC-NER)
                      - source_id: PMID:26131740
                        statement: In chicken DT40 cells LIG3 substitutes for LIG1 in NER (non-human evidence).
                        supporting_text: Our results demonstrate an impressive and previously undocumented potential of Lig3 to substitute for Lig1 in removing helix-distorting DNA lesions by NER in proliferating cells.
