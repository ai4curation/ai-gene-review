                        statement: Purified human LIG3alpha-XRCC1 is active on nicked DNA.
                        supporting_text: By contrast, hLigIIIbeta and the hLigIIIalpha/XRCC1 and hLigIV/XRCC4 complexes are active on both nicked and linear duplex DNA substrates.
