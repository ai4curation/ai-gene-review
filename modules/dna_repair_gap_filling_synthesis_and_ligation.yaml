      term:
        id: GO:0000731
        label: DNA synthesis involved in DNA repair
      description: >-
        Used in the sense of its label (repair synthesis from a 3'-OH terminus on an intact
        template); see the definition change requested in proposed_ontology_changes.
    - preferred_term: nucleotide-excision repair, DNA gap filling
      term:
        id: GO:0006297
        label: nucleotide-excision repair, DNA gap filling
      description: The NER instance of the module, covering both synthesis and ligation.
  context:
