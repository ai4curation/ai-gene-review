  connections:
    - source: clamp_loading
      target: pcna_clamp_step
      connection_type: PROVIDES_INPUT_FOR
      description: The loader leaves a closed PCNA ring on the primer terminus.
    - source: pcna_clamp_step
      target: gap_filling_synthesis
      connection_type: POSITIVELY_REGULATES
      description: PCNA tethers the polymerase and makes synthesis processive.
    - source: gap_filling_synthesis
      target: nick_ligation
      connection_type: PROVIDES_INPUT_FOR
      description: The completed patch leaves a nick between its 3'-OH and the 5'-phosphate of the downstream strand.
knowledge_gaps:
  - gap_statement: >-
      What decides which polymerase fills a given NER gap in human cells (Pol delta with Pol
      kappa versus Pol epsilon), how a low-fidelity Y-family polymerase is kept accurate when
      it shares patches with Pol delta, and why the choice depends on proliferation state,
      are not known.
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      Whether the DNA ligase III alpha-XRCC1 complex seals NER patches in human cells, and in
      which cell-cycle states, is unresolved: the human study proposing it as the ligase of
      non-dividing cells was retracted, and the remaining genetic evidence comes from chicken
      DT40 cells.
    gap_kind:
      - BIOLOGY
