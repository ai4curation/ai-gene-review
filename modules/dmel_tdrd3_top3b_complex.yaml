id: MODULE:dmel_tdrd3_top3b_complex
title: Tdrd3-Top3beta topoisomerase complex in Drosophila melanogaster
description: >-
  Topoisomerase 3-beta (TOP3B) is a type IA topoisomerase that can act on both DNA and RNA.
  It forms a conserved complex with the Tudor-domain protein TDRD3, which stimulates its activity,
  recruits it to messenger ribonucleoprotein complexes and links it to the fragile X protein
  FMRP. In Drosophila, Top3beta and Tdrd3 associate with each other and with Fmr1, and the
  complex has been implicated in synapse formation and in mRNA translation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001994
  title: 'FlyBase gene group TDRD3-TOP3B: Tdrd3-top3b type ia topoisomerase complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as tdrd3-top3b type ia topoisomerase
    complex (TDRD3-TOP3B); this module models that group.
- source_id: GO:0140225
  title: DNA topoisomerase III-beta-TDRD3 complex
  statement: >-
    GO term grounding the module as DNA topoisomerase III-beta-TDRD3 complex.
notes: >-
  Modelled one part per subunit. Top3beta is given DNA topoisomerase activity; RNA topoisomerase
  activity has been reported for TOP3B including in flies but is not asserted here. Fmr1 is
  a partner, not a FlyBase member, and is not a part. FlyBase groups realized by this module:
  TDRD3-TOP3B (FBgg0001994). Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_tdrd3_top3b_complex.yaml;
  none of the member genes has a gene review yet unless noted.
