id: MODULE:hydroxypropionate_bicycle
title: 3-hydroxypropionate bicycle
description: >-
  The 3-hydroxypropionate bicycle of Chloroflexus aurantiacus, which fixes two
  bicarbonate molecules per turn using two biotin-dependent carboxylases and no
  oxygen-sensitive ferredoxin chemistry at all. The first cycle carboxylates
  acetyl-CoA to malonyl-CoA, reduces that to 3-hydroxypropionate, reactivates
  and reduces it to propionyl-CoA, carboxylates again to methylmalonyl-CoA, and
  rearranges that to succinyl-CoA, which is converted through to
  (S)-malyl-CoA and cleaved to release glyoxylate and regenerate acetyl-CoA.
  The second cycle exists because glyoxylate is not directly usable: it is
  condensed with propionyl-CoA and processed to citramalyl-CoA, whose cleavage
  yields pyruvate for biosynthesis and returns acetyl-CoA to the first cycle.
  Hence "bicycle" - two cycles sharing the propionyl-CoA node. Being
  oxygen-insensitive, it works in the aerobic and microaerophilic conditions
  that exclude MODULE:reductive_tca_cycle and MODULE:wood_ljungdahl_pathway,
  with which it is a sibling, as it is of
  MODULE:calvin_benson_bassham_cycle. The distinct archaeal
  3-hydroxypropionate/4-hydroxybutyrate cycle of the Sulfolobales is a
  different pathway and is not modelled here.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0043427
    title: carbon fixation by 3-hydroxypropionate cycle
    statement: Defines the process this module decomposes.
  - source_id: UniProtKB:Q6QQP7
    title: Malonyl-CoA reductase (Chloroflexus aurantiacus)
    statement: >-
      The bifunctional reductase that gives the pathway its name, from the
      organism in which the bicycle was characterized.
notes: >-
  Grounded on Chloroflexus aurantiacus. Two honest gaps are recorded rather
  than papered over. First, there is no GO molecular-function term for
  malonyl-CoA reductase (EC 1.2.1.75): the closest candidates are the
  malonate-semialdehyde dehydrogenase terms, which describe only half of this
  bifunctional enzyme's chemistry, so the annoton carries a free-text function
  and no `term`, and the ontology gap is the one thing in this module worth
  raising with GO. Second, propionyl-CoA synthase (Pcs) could not be resolved
  to a UniProt accession, and the search below was run twice rather than left
  at a first attempt. Entries named "Propionyl-CoA synthase"
  do exist, but all are 218-aa environmental Chloroflexus sp. records flagged
  `Fragment` at protein-existence level 4, carrying only PF00501
  (AMP-dependent synthetase/ligase) - that is a fragment of the first of the
  enzyme's three activities, not the trifunctional protein, and none is
  C. aurantiacus. Searching EC 6.2.1.36 returns only archaeal
  3-hydroxypropionyl-CoA synthetases from the unrelated 3-HP/4-HB cycle.
  C. aurantiacus does contain a 1822-aa protein (UniProtKB:A9WEU4) annotated
  "acetate--CoA ligase", a length consistent with the trifunctional
  architecture and a first activity consistent with the name, but that is a
  hypothesis and is deliberately NOT asserted as the representative member:
  nothing ties it to the characterised Pcs beyond length and domain class.
  Recorded here so the next attempt starts from this rather than repeating it. Pcs is
  nonetheless modelled, because its three activities each have GO terms
  (GO:0043955, GO:0043956, GO:0043957) and the trifunctional architecture is
  well established. The shared steps between succinyl-CoA and (S)-malyl-CoA,
  and the mesaconyl-CoA isomerization and hydration of the second cycle, are
  real but not separately decomposed: they are conventional CoA-ester
  chemistry and not diagnostic of the pathway. Several second-cycle enzymes
  are bifunctional or trifunctional in this organism, so counting proteins
  will not give the number of steps.
module:
  id: hydroxypropionate_bicycle
  label: 3-hydroxypropionate bicycle
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: carbon fixation by 3-hydroxypropionate cycle
      term:
        id: GO:0043427
        label: carbon fixation by 3-hydroxypropionate cycle
      description: >-
        Oxygen-insensitive CO2 fixation using two biotin-dependent
        carboxylations.
    - preferred_term: carbon fixation
      term:
        id: GO:0015977
        label: carbon fixation
  parts:
    - order: 1
      role: first carboxylation
      node:
        id: hp_acetyl_coa_carboxylation
        label: Acetyl-CoA carboxylase fixation of bicarbonate
        module_type: REACTION
        annotons:
          - id: hp_accabc
            label: Biotin-dependent acetyl-CoA carboxylase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: acetyl-CoA carboxylase (biotin-dependent, multi-subunit)
                representative_members:
                  - preferred_term: accD (Chloroflexus aurantiacus strain A)
                    term:
                      id: UniProtKB:A9WBQ9
                      label: >-
                        Acetyl-coenzyme A carboxylase carboxyl transferase
                        subunit beta
            function:
              preferred_term: acetyl-CoA carboxylase activity
              term:
                id: GO:0003989
                label: acetyl-CoA carboxylase activity
              substrates:
                - preferred_term: acetyl-CoA
                - preferred_term: bicarbonate
                - preferred_term: ATP
              products:
                - preferred_term: malonyl-CoA
                - preferred_term: ADP
                - preferred_term: phosphate
            role_description: >-
              The first of the two fixation steps. Biotin-dependent
              carboxylation is oxygen-tolerant, which is the pathway's defining
              advantage over the ferredoxin-dependent routes. The
              representative is the carboxyltransferase subunit; the complete
              enzyme also needs the biotin carboxylase and carrier components.
    - order: 2
      role: malonyl-CoA reduction to 3-hydroxypropionate
      node:
        id: hp_malonyl_coa_reduction
        label: Malonyl-CoA reductase double reduction
        module_type: REACTION
        annotons:
          - id: hp_mcr
            label: Bifunctional malonyl-CoA reductase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: malonyl-CoA reductase (Mcr)
                representative_members:
                  - preferred_term: mcr (Chloroflexus aurantiacus; unreviewed)
                    term:
                      id: UniProtKB:Q6QQP7
                      label: Malonyl-CoA reductase
            function:
              preferred_term: malonyl-CoA reductase activity (NADPH, bifunctional)
              description: >-
                Reduces malonyl-CoA to malonate semialdehyde and on to
                3-hydroxypropionate, using two NADPH and releasing CoA. No GO
                term exists for this activity (EC 1.2.1.75): the
                malonate-semialdehyde dehydrogenase terms cover only the first
                half, so no `term` is asserted here. This is an ontology gap,
                not an unresolved identifier.
              substrates:
                - preferred_term: malonyl-CoA
                - preferred_term: NADPH
              products:
                - preferred_term: 3-hydroxypropionate
                - preferred_term: coenzyme A
                - preferred_term: NADP+
            role_description: >-
              The pathway's eponymous step, and the one that takes the fixed
              carbon out of thioester chemistry into a free hydroxy acid.
    - order: 3
      role: reactivation and reduction to propionyl-CoA
      node:
        id: hp_propionyl_coa_formation
        label: Propionyl-CoA synthase, a trifunctional enzyme
        module_type: REACTION
        annotons:
          - id: hp_pcs
            label: Propionyl-CoA synthase (Pcs)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: propionyl-CoA synthase (trifunctional Pcs)
                description: >-
                  No UniProt accession could be resolved for Pcs in this
                  organism, so the descriptor names no representative member
                  rather than asserting an unverified one.
            function:
              preferred_term: 3-hydroxypropionyl-CoA synthetase activity
              term:
                id: GO:0043955
                label: 3-hydroxypropionyl-CoA synthetase activity
              substrates:
                - preferred_term: 3-hydroxypropionate
                - preferred_term: coenzyme A
                - preferred_term: ATP
              products:
                - preferred_term: 3-hydroxypropionyl-CoA
                - preferred_term: AMP
                - preferred_term: diphosphate
            role_description: >-
              One polypeptide carrying three consecutive activities: the
              CoA-ligase shown here, then 3-hydroxypropionyl-CoA dehydratase
              (GO:0043956) giving acryloyl-CoA, then acryloyl-CoA reductase
              (GO:0043957) giving propionyl-CoA. Modelled as one annoton
              because the intermediates are not released.
    - order: 4
      role: second carboxylation
      node:
        id: hp_propionyl_coa_carboxylation
        label: Propionyl-CoA carboxylase fixation of the second bicarbonate
        module_type: REACTION
        annotons:
          - id: hp_pcc
            label: Biotin-dependent propionyl-CoA carboxylase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: propionyl-CoA carboxylase activity
                term:
                  id: GO:0004658
                  label: propionyl-CoA carboxylase activity
              description: >-
                In this organism the same biotin-dependent carboxylase
                machinery serves both carboxylation steps, so the two parts may
                be realized by one enzyme with broad specificity.
            function:
              preferred_term: propionyl-CoA carboxylase activity
              term:
                id: GO:0004658
                label: propionyl-CoA carboxylase activity
              substrates:
                - preferred_term: propionyl-CoA
                - preferred_term: bicarbonate
                - preferred_term: ATP
              products:
                - preferred_term: (S)-methylmalonyl-CoA
                - preferred_term: ADP
                - preferred_term: phosphate
            role_description: The second and last CO2-fixing step of the first cycle.
    - order: 5
      role: rearrangement to succinyl-CoA
      node:
        id: hp_methylmalonyl_rearrangement
        label: Epimerization and mutase rearrangement to succinyl-CoA
        module_type: REACTION
        annotons:
          - id: hp_mce
            label: Methylmalonyl-CoA epimerase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: methylmalonyl-CoA epimerase activity
                term:
                  id: GO:0004493
                  label: methylmalonyl-CoA epimerase activity
            function:
              preferred_term: methylmalonyl-CoA epimerase activity
              term:
                id: GO:0004493
                label: methylmalonyl-CoA epimerase activity
              substrates:
                - preferred_term: (S)-methylmalonyl-CoA
              products:
                - preferred_term: (R)-methylmalonyl-CoA
            role_description: >-
              The mutase requires the (R) epimer, which the carboxylase does
              not produce.
          - id: hp_mcm
            label: Methylmalonyl-CoA mutase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: methylmalonyl-CoA mutase activity
                term:
                  id: GO:0004494
                  label: methylmalonyl-CoA mutase activity
            function:
              preferred_term: methylmalonyl-CoA mutase activity
              term:
                id: GO:0004494
                label: methylmalonyl-CoA mutase activity
              substrates:
                - preferred_term: (R)-methylmalonyl-CoA
              products:
                - preferred_term: succinyl-CoA
            role_description: >-
              A coenzyme-B12 radical rearrangement; the one cobalamin
              requirement of the pathway.
    - order: 6
      role: glyoxylate release and acetyl-CoA regeneration
      node:
        id: hp_malyl_coa_cleavage
        label: (S)-malyl-CoA lyase cleavage closing the first cycle
        module_type: REACTION
        annotons:
          - id: hp_mcl
            label: (S)-malyl-CoA lyase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: malyl-CoA lyase activity
                term:
                  id: GO:0050083
                  label: malyl-CoA lyase activity
            function:
              preferred_term: malyl-CoA lyase activity
              term:
                id: GO:0050083
                label: malyl-CoA lyase activity
              substrates:
                - preferred_term: (S)-malyl-CoA
              products:
                - preferred_term: acetyl-CoA
                - preferred_term: glyoxylate
            role_description: >-
              Regenerates the acetyl-CoA acceptor and releases glyoxylate.
              Succinyl-CoA reaches (S)-malyl-CoA through conventional CoA-ester
              steps that this module does not decompose.
    - order: 7
      role: second cycle - glyoxylate assimilation to pyruvate
      node:
        id: hp_glyoxylate_assimilation
        label: Condensation with propionyl-CoA and cleavage to pyruvate
        module_type: REACTION
        annotons:
          - id: hp_citramalyl_lyase
            label: (3S)-citramalyl-CoA lyase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: malyl-CoA/citramalyl-CoA lyase activity
                term:
                  id: GO:0050083
                  label: malyl-CoA lyase activity
              description: >-
                The same lyase family serves both cleavages in this organism;
                GO has no separate citramalyl-CoA lyase term in the bacterial
                pathway sense, so the family term is used and the substrate is
                stated explicitly.
            function:
              preferred_term: malyl-CoA lyase activity
              term:
                id: GO:0050083
                label: malyl-CoA lyase activity
              substrates:
                - preferred_term: (3S)-citramalyl-CoA
              products:
                - preferred_term: pyruvate
                - preferred_term: acetyl-CoA
            role_description: >-
              Closes the second cycle: glyoxylate is condensed with
              propionyl-CoA and processed through mesaconyl-CoA to
              citramalyl-CoA, whose cleavage yields the pyruvate that leaves
              for biosynthesis and the acetyl-CoA that re-enters the first
              cycle. This is why the pathway is a bicycle rather than a cycle
              with a side branch.
  connections:
    - source: hp_acetyl_coa_carboxylation
      target: hp_malonyl_coa_reduction
      connection_type: PRECEDES
      description: Malonyl-CoA is reduced to the free hydroxy acid.
    - source: hp_malonyl_coa_reduction
      target: hp_propionyl_coa_formation
      connection_type: PRECEDES
      description: >-
        3-hydroxypropionate is re-activated to its CoA ester and reduced to
        propionyl-CoA.
    - source: hp_propionyl_coa_formation
      target: hp_propionyl_coa_carboxylation
      connection_type: PRECEDES
      description: Propionyl-CoA accepts the second bicarbonate.
      chaining_status: VERIFIED
      chaining_note: >-
        Continuous: propionyl-CoA is the end product of the trifunctional Pcs
        and the substrate of EC 6.4.1.3. The automated check cannot see it
        because Pcs is modelled as a single annoton carrying only the first of
        its three activities, so the stated products stop at
        3-hydroxypropionyl-CoA; the two intervening activities
        (3-hydroxypropionyl-CoA dehydratase GO:0043956, acryloyl-CoA reductase
        GO:0043957) are named in that annoton's role_description rather than
        given their own nodes, since their intermediates are not released.
    - source: hp_propionyl_coa_carboxylation
      target: hp_methylmalonyl_rearrangement
      connection_type: PRECEDES
      description: Methylmalonyl-CoA is epimerized and rearranged.
    - source: hp_methylmalonyl_rearrangement
      target: hp_malyl_coa_cleavage
      connection_type: PRECEDES
      description: >-
        Succinyl-CoA is carried through to (S)-malyl-CoA by steps this module
        does not decompose.
      chaining_status: VERIFIED
      chaining_note: >-
        Continuity is established chemistry; the break is deliberate
        granularity. Succinyl-CoA reaches (S)-malyl-CoA through conventional
        CoA-ester steps (succinyl-CoA:(S)-malate CoA transferase, succinate
        semialdehyde and mesaconyl-CoA chemistry depending on the organism)
        that are not diagnostic of this pathway and are left undecomposed, so
        no shared intermediate appears between the two modelled nodes.
    - source: hp_malyl_coa_cleavage
      target: hp_acetyl_coa_carboxylation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Regenerated acetyl-CoA is the acceptor for the first carboxylation,
        closing the first cycle.
    - source: hp_malyl_coa_cleavage
      target: hp_glyoxylate_assimilation
      connection_type: PROVIDES_INPUT_FOR
      description: Released glyoxylate enters the second cycle.
    - source: hp_propionyl_coa_formation
      target: hp_glyoxylate_assimilation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Propionyl-CoA is the condensation partner for glyoxylate; this shared
        node is what joins the two cycles.
    - source: hp_glyoxylate_assimilation
      target: hp_acetyl_coa_carboxylation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The second cycle also returns acetyl-CoA to the first carboxylation.
