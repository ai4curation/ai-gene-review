id: MODULE:dmel_threonylcarbamoyl_transferase_complex
title: KEOPS threonylcarbamoyl transferase complex in Drosophila melanogaster
description: >-
  The KEOPS (EKC) complex transfers a threonylcarbamoyl group onto adenosine 37 of tRNAs that
  decode ANN codons, forming t6A, a modification needed for accurate decoding. Threonylcarbamoyl-AMP
  is supplied by a separate enzyme (Sua5/YRDC). The catalytic subunit is the Kae1/OSGEP ortholog
  (Tcs3 in flies); Bud32/TP53RK (Tcs5) is an atypical kinase-like ATPase subunit and Pcc1/LAGE3
  (Tcs6) is a small dimerization subunit. In Drosophila, KEOPS subunits are required for growth.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001634
  title: 'FlyBase gene group TCTC: Threonyl-carbamoyl transferase complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as threonyl-carbamoyl transferase
    complex (TCTC); this module models that group.
- source_id: GO:0000408
  title: EKC/KEOPS complex
  statement: >-
    GO term grounding the module as EKC/KEOPS complex.
notes: >-
  Modelled one part per subunit. The Cgi121 (TPRKB) and Gon7 subunits found in yeast and human
  KEOPS are not in the FlyBase group and are not included. The mitochondrial t6A enzyme (OSGEPL1
  ortholog) and YRDC are outside this module. FlyBase groups realized by this module: TCTC
  (FBgg0001634). Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_threonylcarbamoyl_transferase_complex.yaml;
  none of the member genes has a gene review yet unless noted.
