id: MODULE:dmel_nalcn_channel_complex
title: NALCN sodium leak channel complex in Drosophila melanogaster
description: >-
  NALCN is a voltage-insensitive cation channel that carries a background sodium leak current
  and so sets the resting membrane potential and excitability of neurons. Its pore-forming
  subunit, encoded in Drosophila by narrow abdomen (na), assembles with the large accessory
  proteins unc79 and unc80 and with Mid1, a protein related to yeast Mid1 and to the mammalian
  NALCN accessory factor NALF1 (FAM155A). In flies, na and its partners are needed for normal
  locomotor activity and circadian rhythmic behavior.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001886
  title: 'FlyBase gene group NALCN: Sodium leak channel complex'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as sodium leak channel complex
    (NALCN); this module models that group.
- source_id: FB:FBgg0002195
  title: 'FlyBase gene group NALCN-CH: Sodium leak channel subunits'
  statement: >-
    FlyBase release FB2026_03 groups 1 D. melanogaster genes as sodium leak channel subunits
    (NALCN-CH); this module models that group.
- source_id: GO:0034706
  title: sodium channel complex
  statement: >-
    GO term grounding the module as sodium channel complex.
notes: >-
  The FlyBase NALCN-CH group contains only the pore subunit na, which is already a member
  of NALCN. Each subunit is modelled as a part; the accessory subunits are not assigned a
  molecular function. FlyBase groups realized by this module: NALCN (FBgg0001886), NALCN-CH
  (FBgg0002195). Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_nalcn_channel_complex.yaml;
  none of the member genes has a gene review yet unless noted.
