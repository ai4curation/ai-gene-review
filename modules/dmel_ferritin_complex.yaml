id: MODULE:dmel_ferritin_complex
title: Ferritin complexes in Drosophila melanogaster
description: >-
  Insect ferritins store and transport iron. The main Drosophila ferritin is a 24-subunit
  shell made of equal numbers of heavy-chain homolog (Fer1HCH) and light-chain homolog (Fer2LCH)
  subunits; unlike mammalian ferritin it is largely made in the secretory pathway and is present
  in the hemolymph. The heavy-chain subunit carries the ferroxidase centre that oxidises Fe(II)
  for storage as Fe(III) in the mineral core. Ferritin in the midgut iron cell region takes
  up dietary iron and is needed for iron export to the rest of the body. A third gene, Fer3HCH,
  encodes a mitochondrial ferritin expressed mainly in the testis.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000649
  title: 'FlyBase gene group FER: Ferritins'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as ferritins (FER); this module
    models that group.
- source_id: GO:0070288
  title: ferritin complex
  statement: >-
    GO term grounding the module as ferritin complex.
notes: >-
  Fer3HCH is a heavy-chain-type ferritin targeted to mitochondria; it is modelled as a separate
  part with no molecular function because its ferroxidase activity is inferred from sequence.
  The subunit stoichiometry (12 heavy and 12 light chains) applies to the Fer1HCH-Fer2LCH
  ferritin. Iron import and export transporters and the iron regulatory protein system that
  controls Fer1HCH translation are outside the module. FlyBase groups realized by this module:
  FER (FBgg0000649). Participants were generated from the FlyBase gene-group membership and
  mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_ferritin_complex.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
