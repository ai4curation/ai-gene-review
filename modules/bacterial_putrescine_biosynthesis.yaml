id: MODULE:bacterial_putrescine_biosynthesis
title: Bacterial putrescine biosynthesis by arginine and ornithine routes
description: >-
  A reusable bacterial module for putrescine supply through alternative
  amino-acid routes. In the two-reaction arginine/agmatine route, SpeA
  decarboxylates L-arginine to agmatine and SpeB hydrolyzes agmatine to
  putrescine. In the direct ornithine route, SpeC decarboxylates L-ornithine to
  putrescine. Organisms may encode either or both routes. Upstream amino-acid
  supply, downstream spermidine synthesis, uptake, and putrescine catabolism
  are outside the boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:12634339
    title: Identification of the putrescine biosynthetic genes in Pseudomonas aeruginosa and characterization of agmatine deiminase and N-carbamoylputrescine amidohydrolase of the arginine decarboxylase pathway.
    statement: >-
      Same-genus genetics establishes arginine-derived and direct ornithine
      routes as alternative ways to supply putrescine.
    supporting_text: >-
      Putrescine can be synthesized either directly from ornithine by ornithine
      decarboxylase (ODC; the speC product) or indirectly from arginine via
      arginine decarboxylase (ADC; the speA product).
  - source_id: PMID:28862813
    title: Polyamine is a critical determinant of Pseudomonas chlororaphis O6 for GacS-dependent bacterial cell growth and biocontrol capacity.
    statement: >-
      Disrupting both SpeA and SpeC eliminated polyamine production in a
      related pseudomonad, supporting route redundancy.
    supporting_text: >-
      Polyamine production was reduced in the speC mutant, and was eliminated
      in the speAspeC mutant.
  - source_id: PMID:40673658
    title: The Pseudomonas aeruginosa Type VI secretion system toxin Tse8 evolved from a novel N-carbamoylputrescine amidohydrolase.
    statement: Direct agmatinase conversion is an established route from agmatine to putrescine.
    supporting_text: >-
      There are currently three known routes from agmatine to putrescine,
      including direct conversion by agmatinase.
  - source_id: UniProtKB:Q88QC7
    title: Pseudomonas putida KT2440 SpeA
    statement: Q88QC7 is the exact KT2440 biosynthetic arginine decarboxylase exemplar.
  - source_id: UniProtKB:Q88KU3
    title: Pseudomonas putida KT2440 SpeB
    statement: Q88KU3 is the exact KT2440 candidate agmatinase exemplar.
  - source_id: UniProtKB:Q88PI6
    title: Pseudomonas putida KT2440 SpeC
    statement: Q88PI6 is the exact KT2440 ornithine decarboxylase exemplar.
  - source_id: UniProtKB:P21170
    title: Escherichia coli K-12 SpeA
    statement: Reviewed, experimentally supported biosynthetic arginine decarboxylase exemplar.
  - source_id: UniProtKB:P60651
    title: Escherichia coli K-12 SpeB
    statement: Reviewed, experimentally supported agmatinase exemplar used as the orthology anchor.
  - source_id: UniProtKB:Q9HVQ3
    title: Pseudomonas aeruginosa PAO1 SpeC
    statement: PA4519 is the same-genus ornithine decarboxylase implicated genetically in PMID:12634339.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_putrescine_biosynthesis__ppu00330-deep-research-openscientist.md
    title: OpenScientist PSEPK module, pathway, and taxon review
    statement: >-
      The report evaluates route satisfiability against the KT2440 proteome and
      separates core candidates from neighboring ppu00330 functions.
notes: >-
  The route choice is modeled with variants rather than three optional linear
  steps: SpeA and SpeB are connected only inside the arginine/agmatine route,
  while SpeC is an independent alternative. The module is species-neutral;
  KT2440 proteins are exact exemplars rather than universal members. The
  lineage-variable AguA plus N-carbamoylputrescine-amidohydrolase route is not
  modeled here because the commissioned KT2440 review found AguA but no
  verified completing enzyme. PP_3019 remains an untested candidate, and
  convergently evolved AguY enzymes mean absence of a canonical AguB does not
  prove absence of activity. The consolidated OpenScientist module+ppu00330+
  PSEPK report and its HTML/PDF artifacts were consumed; no separate gene-level
  or generic-module report files materialized in this worktree.
