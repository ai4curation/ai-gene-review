  knowledge_gaps:
    - gap_statement: >-
        Relative route usage and redundancy vary among bacteria and have not
        been measured directly in Pseudomonas putida KT2440.
      boundary: >-
        Retain both established alternatives without requiring both for module
        satisfaction or connecting SpeC linearly to SpeA-SpeB.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        KT2440 contains AguA but lacks a verified canonical or noncanonical
        N-carbamoylputrescine amidohydrolase completing that alternative branch.
      boundary: >-
        Exclude the incomplete branch from the core reusable route model until
        a completing activity is identified.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        TIGR01230 and shared InterPro signatures do not distinguish SpeB
        agmatinase from the PP_4523 K12255 guanidinobutyrase paralog.
      boundary: >-
        Require K01480/EC 3.5.3.11 orthology for the agmatinase step and exclude
        PP_4523 unless substrate-specific experiments overturn that split.
      gap_kind:
        - BIOLOGY
