id: MODULE:aps_dependent_assimilatory_sulfate_reduction
title: APS-dependent assimilatory sulfate reduction
description: >-
  A reusable pathway that converts sulfate to sulfide through adenosine
  5'-phosphosulfate (APS) and sulfite. The module contains sulfate activation by
  ATP sulfurylase, thioredoxin-dependent APS reduction, and assimilatory sulfite
  reduction. It represents the direct APS branch rather than the alternative
  APS-kinase/PAPS-reductase route. Sulfate import is upstream, whereas siroheme
  synthesis and incorporation of sulfide into cysteine are supporting or
  downstream biology outside the pathway boundary.
status: DRAFT
evidence:
  - source_id: GO:0000103
    title: sulfate assimilation
    statement: GO:0000103 provides the biological-process context.
  - source_id: RHEA:18133
    title: sulfate adenylyltransferase reaction
    statement: RHEA:18133 defines ATP-dependent formation of APS from sulfate.
  - source_id: RHEA:21976
    title: adenylyl-sulfate reductase reaction
    statement: >-
      RHEA:21976 defines the reversible thioredoxin-dependent APS/sulfite
      reaction catalyzed physiologically toward sulfite during assimilation.
  - source_id: GO:0050311
    title: sulfite reductase (ferredoxin) activity
    statement: >-
      GO:0050311 captures the ferredoxin-fed sulfite-reductase implementation
      supported as the current Pseudomonas model.
  - source_id: PANTHER:PTHR32439
    title: ferredoxin sulfite/nitrite reductase family
    statement: >-
      This broad siroheme-reductase family contains characterized
      ferredoxin-dependent sulfite reductases such as UniProtKB:P9WJ02 and
      distinguishes that implementation from the PTHR11493 classical CysI
      family when combined with the required molecular function.
  - source_id: GO:0004783
    title: sulfite reductase (NADPH) activity
    statement: >-
      GO:0004783 captures the classical CysJ/CysI NADPH-dependent bacterial
      implementation.
  - source_id: PMID:16387658
    title: Molecular basis for G protein control of the prokaryotic ATP sulfurylase.
    statement: >-
      Biochemistry and structure establish the proteobacterial CysD/CysN
      complex and energetic coupling of CysN GTP turnover to APS formation.
  - source_id: PMID:23794620
    title: Role for ferredoxin:NAD(P)H oxidoreductase (FprA) in sulfate assimilation and siderophore biosynthesis in Pseudomonads.
    statement: >-
      Pseudomonas genetics support an FprA-fed CysI sulfite-reduction system
      distinct from enterobacterial CysJ/CysI.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__aps_dependent_assimilatory_sulfate_reduction__ppu00920-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00920 satisfiability review
    statement: >-
      The species-aware review evaluates whether the curated PSEPK genes
      satisfy this module within the wider sulfur-metabolism map.
  - source_id: file:PSEPK/cysD/cysD-ai-review.yaml
    title: PSEPK cysD gene review
    statement: Q88NA9 supplies the ATP sulfurylase catalytic subunit.
  - source_id: file:PSEPK/cysNC/cysNC-ai-review.yaml
    title: PSEPK cysNC gene review
    statement: Q88NA8 supplies the ATP sulfurylase regulatory GTPase subunit.
  - source_id: file:PSEPK/cysH/cysH-ai-review.yaml
    title: PSEPK cysH gene review
    statement: Q88KG2 supplies the APS-to-sulfite reaction.
  - source_id: file:PSEPK/cysI/cysI-ai-review.yaml
    title: PSEPK cysI gene review
    statement: Q88KB9 supplies the sulfite-reductase catalytic hemoprotein.
  - source_id: file:PSEPK/fpr-I/fpr-I-ai-review.yaml
    title: PSEPK fpr-I gene review
    statement: Q88MD5 supplies the FprA-type electron-transfer role.
module:
  id: aps_dependent_assimilatory_sulfate_reduction
  label: APS-dependent assimilatory sulfate reduction
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: sulfate assimilation
      term:
        id: GO:0000103
        label: sulfate assimilation
      description: >-
        The module covers the reductive sulfate-to-sulfide branch, not sulfate
        uptake or downstream sulfur incorporation.
  parts:
    - order: 1
      role: sulfate activation
      node:
        id: sulfate_activation_step
        label: Sulfate activation to APS
        module_type: REACTION
        annotons:
          - id: cysdn_atp_sulfurylase
            label: CysD/CysN ATP sulfurylase
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: proteobacterial CysD/CysN ATP sulfurylase
                description: >-
                  Heteromeric sulfate adenylyltransferase with a CysD
                  nucleotidyltransferase subunit and a regulatory CysN GTPase.
                active_units:
                  - id: cysd_catalytic_subunit
                    label: CysD sulfate adenylyltransferase subunit 2
                    role: Catalytic ATP-utilizing sulfate-adenylation subunit.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: CysD sulfate adenylyltransferase subunit 2 family
                        term:
                          id: PANTHER:PTHR43196:SF1
                          label: SULFATE ADENYLYLTRANSFERASE SUBUNIT 2
                        representative_members:
                          - preferred_term: PSEPK CysD
                            term:
                              id: UniProtKB:Q88NA9
                              label: Sulfate adenylyltransferase subunit 2
                          - preferred_term: Escherichia coli K-12 CysD
                            term:
                              id: UniProtKB:P21156
                              label: Sulfate adenylyltransferase subunit 2
                    function:
                      preferred_term: sulfate adenylyltransferase (ATP) activity
                      term:
                        id: GO:0004781
                        label: sulfate adenylyltransferase (ATP) activity
                  - id: cysn_regulatory_gtpase_subunit
                    label: CysN regulatory GTPase subunit
                    role: Couples GTP hydrolysis to APS formation by CysD.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: CysN sulfate adenylyltransferase regulatory subunits
                        term:
                          id: InterPro:IPR011779
                          label: sulfate adenylyltransferase large subunit
                        representative_members:
                          - preferred_term: PSEPK CysNC
                            term:
                              id: UniProtKB:Q88NA8
                              label: Sulfate adenylyltransferase subunit 1
                          - preferred_term: Escherichia coli K-12 CysN
                            term:
                              id: UniProtKB:P23845
                              label: Sulfate adenylyltransferase subunit 1
                    function:
                      preferred_term: GTPase activity
                      term:
                        id: GO:0003924
                        label: GTPase activity
            function:
              preferred_term: sulfate adenylyltransferase (ATP) activity
              term:
                id: GO:0004781
                label: sulfate adenylyltransferase (ATP) activity
              substrates:
                - preferred_term: sulfate
                - preferred_term: ATP
                - preferred_term: proton
              products:
                - preferred_term: adenosine 5'-phosphosulfate
                - preferred_term: diphosphate
            role_description: Forms APS as the activated sulfate intermediate.
    - order: 2
      role: APS reduction
      node:
        id: aps_reduction_step
        label: APS reduction to sulfite
        module_type: REACTION
        annotons:
          - id: cysH_aps_reductase
            label: Thioredoxin-dependent APS reductase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CysH APS reductases
                term:
                  id: InterPro:IPR011798
                  label: APS reductase
                representative_members:
                  - preferred_term: PSEPK CysH
                    term:
                      id: UniProtKB:Q88KG2
                      label: Adenosine 5'-phosphosulfate reductase
            function:
              preferred_term: adenylyl-sulfate reductase (thioredoxin) activity
              term:
                id: GO:0043866
                label: adenylyl-sulfate reductase (thioredoxin) activity
              substrates:
                - preferred_term: adenosine 5'-phosphosulfate
                - preferred_term: reduced thioredoxin
              products:
                - preferred_term: sulfite
                - preferred_term: AMP
                - preferred_term: oxidized thioredoxin
            role_description: Reduces APS directly to sulfite without a PAPS intermediate.
    - order: 3
      role: sulfite reduction
      node:
        id: sulfite_reduction_step
        label: Assimilatory reduction of sulfite to sulfide
        module_type: REACTION
        variant_sets:
          - id: sulfite_reductase_electron_donor_architecture
            label: Sulfite-reductase electron-donor architecture
            axis: immediate electron-transfer system
            selection: EXACTLY_ONE
            notes: >-
              The catalytic siroheme/iron-sulfur hemoprotein is conserved, but
              lineages differ in whether electrons arrive through a separate
              CysJ flavoprotein or a ferredoxin/Fpr system.
            variants:
              - id: ferredoxin_fpr_cysi_route
                label: Ferredoxin/Fpr-fed CysI route
                module_type: REACTION
                description: >-
                  A CysI-family sulfite reductase receives reducing equivalents
                  from reduced ferredoxin or directly from a type-1 Fpr enzyme.
                  This architecture occurs in bacterial systems that lack the
                  classical CysJ diflavin partner.
                annotons:
                  - id: ferredoxin_dependent_cysi_activity
                    label: Ferredoxin-dependent CysI activity
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: ferredoxin sulfite/nitrite reductase family
                        term:
                          id: PANTHER:PTHR32439
                          label: FERREDOXIN--NITRITE REDUCTASE, CHLOROPLASTIC
                        representative_members:
                          - preferred_term: PSEPK CysI
                            term:
                              id: UniProtKB:Q88KB9
                              label: Sulfite reductase hemoprotein beta subunit
                          - preferred_term: Mycobacterium tuberculosis Sir
                            term:
                              id: UniProtKB:P9WJ02
                              label: Sulfite reductase [ferredoxin]
                      required_function:
                        preferred_term: sulfite reductase (ferredoxin) activity
                        term:
                          id: GO:0050311
                          label: sulfite reductase (ferredoxin) activity
                      notes: >-
                        PTHR32439 is broader than sulfite reductases and the
                        Q88KB9 subfamily label is not functionally reliable.
                        The required function and characterized P9WJ02 exemplar
                        delimit this selector; the classical CysJ/CysI branch
                        instead uses PTHR11493:SF47.
                    function:
                      preferred_term: sulfite reductase (ferredoxin) activity
                      term:
                        id: GO:0050311
                        label: sulfite reductase (ferredoxin) activity
                      substrates:
                        - preferred_term: sulfite
                        - preferred_term: reduced ferredoxin
                      products:
                        - preferred_term: sulfide
                        - preferred_term: oxidized ferredoxin
                        - preferred_term: water
                    role_description: Performs the six-electron reduction of sulfite.
                  - id: fpr_electron_supply
                    label: Fpr electron supply
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: bacterial type-1 ferredoxin--NADP reductases
                        term:
                          id: PANTHER:PTHR47878:SF1
                          label: FLAVODOXIN_FERREDOXIN--NADP REDUCTASE
                        representative_members:
                          - preferred_term: PSEPK Fpr-I
                            term:
                              id: UniProtKB:Q88MD5
                              label: Ferredoxin--NADP reductase
                    function:
                      preferred_term: ferredoxin-NADP+ reductase activity
                      term:
                        id: GO:0004324
                        label: ferredoxin-NADP+ reductase activity
                    role_description: >-
                      Supplies reducing equivalents to the CysI system through
                      ferredoxin or direct electron transfer.
              - id: cysji_nadph_route
                label: CysJ/CysI NADPH-dependent route
                module_type: REACTION
                description: >-
                  The classical enterobacterial implementation uses a CysJ
                  diflavin subunit to transfer electrons from NADPH to the CysI
                  siroheme/iron-sulfur catalytic subunit.
                annotons:
                  - id: cysji_nadph_sulfite_reductase
                    label: CysJ/CysI NADPH sulfite reductase
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: CysJ/CysI sulfite reductase complex
                        term:
                          id: GO:0009337
                          label: sulfite reductase complex (NADPH)
                        active_units:
                          - id: cysj_flavoprotein_subunit
                            label: CysJ flavoprotein electron-transfer subunit
                            role: Transfers electrons from NADPH to CysI.
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: CysJ NADPH sulfite-reductase flavoproteins
                                term:
                                  id: PANTHER:PTHR19384:SF128
                                  label: NADPH OXIDOREDUCTASE A
                                representative_members:
                                  - preferred_term: Escherichia coli K-12 CysJ
                                    term:
                                      id: UniProtKB:P38038
                                      label: Sulfite reductase [NADPH] flavoprotein alpha-component
                          - id: cysi_nadph_hemoprotein_subunit
                            label: CysI hemoprotein catalytic subunit
                            role: Reduces sulfite at the siroheme/iron-sulfur center.
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: NADPH-dependent CysI hemoproteins
                                term:
                                  id: PANTHER:PTHR11493:SF47
                                  label: SULFITE REDUCTASE [NADPH] SUBUNIT BETA
                                representative_members:
                                  - preferred_term: Escherichia coli K-12 CysI
                                    term:
                                      id: UniProtKB:P17846
                                      label: Sulfite reductase [NADPH] hemoprotein beta-component
                    function:
                      preferred_term: sulfite reductase (NADPH) activity
                      term:
                        id: GO:0004783
                        label: sulfite reductase (NADPH) activity
                      substrates:
                        - preferred_term: sulfite
                        - preferred_term: NADPH
                        - preferred_term: proton
                      products:
                        - preferred_term: sulfide
                        - preferred_term: NADP+
                        - preferred_term: water
                    role_description: Performs NADPH-dependent reduction of sulfite to sulfide.
  connections:
    - source: sulfate_activation_step
      target: aps_reduction_step
      connection_type: PROVIDES_INPUT_FOR
      description: ATP sulfurylase supplies APS to CysH.
    - source: aps_reduction_step
      target: sulfite_reduction_step
      connection_type: PROVIDES_INPUT_FOR
      description: CysH supplies sulfite to the terminal sulfite-reduction system.
  notes: >-
    This module deliberately represents the direct APS-reduction route. An
    APS-kinase/PAPS-reductase branch should be modeled as a separate route
    variant rather than adding a PAPS step to every instance. Exact UniProt
    exemplars delimit the CysD/CysN, ferredoxin/Fpr, and CysJ/CysI
    implementations without restricting the module taxonomically. No molecular
    function or location is duplicated at module level, and no ancestral PTN
    node is asserted without verified PAINT IBD evidence.
