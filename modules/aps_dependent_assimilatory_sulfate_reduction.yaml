  notes: >-
    ALIGN with YeastPathways (2026-10): the module, which previously
    represented only the direct APS-reductase route, now models the
    APS-kinase/PAPS-reductase route as an explicit variant of the APS-to-sulfite
    step instead of a separate module, and the slug is kept for continuity
    even though the title now names both routes. Fungal implementations were
    added at every step: a homo-oligomeric Sat/Met3-type ATP sulfurylase
    variant (MET3, S. pombe sua1) beside CysD/CysN; the PAPS route with APS
    kinase (MET14, met14, E. coli CysC), PAPS reductase (MET16, met16, E. coli
    CysH) and its thioredoxin reductant (TRX1, TRX2, S. pombe trx1); and a
    fungal Met10/Met5 NADPH sulfite-reductase variant beside the CysJ/CysI and
    ferredoxin/Fpr variants. Pseudomonas aeruginosa CysH (biochemically an
    APS-specific reductase) was added as an exemplar of the direct route.
    YeastCyc assessment (SO4ASSIM-PWY, PWY-781, PWY-5340) - all catalyst
    assignments (MET3, MET14, MET16, MET10 + MET5) are correct; YeastCyc
    omits the thioredoxins TRX1/TRX2, whose combined loss causes methionine
    auxotrophy (PMID:2026619), and the siroheme enzymes MET1 and MET8, which
    are required for sulfite reductase activity but are modelled in
    siroheme_biosynthesis. Adenosine 3',5'-bisphosphate released by MET16 is
    recycled by a separate phosphatase (MET22), and thioredoxin is
    regenerated by NADPH-thioredoxin reductase; both are supporting biology
    outside the boundary. PWY-5340 (sulfate activation for sulfonation) is
    the MET3 + MET14 prefix of the PAPS route and is not a separate module;
    the animal bifunctional PAPS synthase plus Golgi import is modelled in
    paps_sulfate_activation. Compartment: every S. cerevisiae and S. pombe
    activity is cytosolic in the GO-CAMs, but plant enzymes are plastid
    localized, so no module-level compartment is asserted. GO-CAM
    comparison - the YeastPathways models agree on genes and functions but
    have no causal edges and omit thioredoxin; the PomBase model includes
    trx1 (typed GO:0009055 electron transfer activity rather than the
    disulfide-reductase activity used here) and represents the sulfite
    reductase as two separate GO:0004783 activities enabled by sir1 and met10
    rather than one activity of the heteromeric complex. Retained from the
    previous version: exact UniProt exemplars delimit the CysD/CysN,
    ferredoxin/Fpr, and CysJ/CysI implementations without restricting the
    module taxonomically; the Fpr-linked variant records electron-supply
    architecture while leaving the immediate donor as a concrete-system
    knowledge gap; no molecular function is duplicated at module level; and
    PTN001249481 is asserted only from the local PTHR43196 PAINT IBD record.
