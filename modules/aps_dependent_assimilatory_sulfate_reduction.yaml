          labels. The Pseudomonas Fpr-linked route has an unresolved intervening carrier; the ferredoxin-linked
          route, enterobacterial diflavin complex and fungal hemoflavoprotein are distinct implementations.
          Cofactor synthesis and reductant regeneration are outside the minimal boundary. EXACTLY_ONE
          selects one implementation for a concrete reaction instance, not mutually exclusive gene repertoires
          across an entire organism.
