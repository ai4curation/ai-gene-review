id: MODULE:aps_dependent_assimilatory_sulfate_reduction
title: Assimilatory sulfate reduction to sulfide (APS and PAPS routes)
description: >-
  A reusable pathway that reduces inorganic sulfate to sulfide for
  incorporation into sulfur amino acids. Sulfate is first activated by ATP
  sulfurylase to adenosine 5'-phosphosulfate (APS), because the sulfate/sulfite
  couple is too electronegative for reduction by physiological donors. The
  activated sulfate is then reduced to sulfite by one of two routes: directly,
  by a thioredoxin-dependent APS reductase (many bacteria, and plants), or
  after phosphorylation of APS by APS kinase to 3'-phosphoadenosine
  5'-phosphosulfate (PAPS), by a thioredoxin-dependent PAPS reductase that
  releases sulfite and adenosine 3',5'-bisphosphate (enterobacteria and
  fungi). Finally a siroheme- and iron-sulfur-containing sulfite reductase
  performs the six-electron reduction of sulfite to sulfide, receiving
  electrons either from NADPH through a flavoprotein subunit (enterobacterial
  CysJ/CysI and the fungal Met10/Met5 alpha2beta2 enzyme) or from reduced
  ferredoxin. ATP sulfurylase itself is either a heterodimeric GTPase-coupled
  CysD/CysN enzyme (proteobacteria) or a homo-oligomeric enzyme (fungi,
  plants and many bacteria). Sulfate import is upstream; siroheme synthesis,
  thioredoxin regeneration, recycling of adenosine 3',5'-bisphosphate, and
  incorporation of sulfide into homocysteine or cysteine are supporting or
  downstream biology outside the pathway boundary.
status: DRAFT
evidence:
  - source_id: GO:0000103
    title: sulfate assimilation
    statement: GO:0000103 provides the biological-process context.
  - source_id: RHEA:18133
    title: sulfate adenylyltransferase reaction
    statement: RHEA:18133 defines ATP-dependent formation of APS from sulfate.
  - source_id: RHEA:21976
    title: adenylyl-sulfate reductase reaction
    statement: >-
      RHEA:21976 defines the reversible thioredoxin-dependent APS/sulfite
      reaction catalyzed physiologically toward sulfite during assimilation.
  - source_id: GO:0004020
    title: adenylylsulfate kinase activity
    statement: APS kinase step of the PAPS route.
  - source_id: GO:0004604
    title: phosphoadenylyl-sulfate reductase (thioredoxin) activity
    statement: PAPS reductase step of the PAPS route.
  - source_id: GO:0050311
    title: sulfite reductase (ferredoxin) activity
    statement: >-
      GO:0050311 captures a ferredoxin-fed sulfite-reductase implementation;
      the immediate donor must still be established in each concrete system.
  - source_id: PANTHER:PTHR32439
    title: ferredoxin sulfite/nitrite reductase family
    statement: >-
      This broad siroheme-reductase family contains characterized
      ferredoxin-dependent sulfite reductases such as UniProtKB:P9WJ02. Family
      membership alone does not distinguish donor architecture; the
      GO:0050311 required-function constraint defines this implementation.
  - source_id: GO:0004783
    title: sulfite reductase (NADPH) activity
    statement: >-
      GO:0004783 captures the NADPH-dependent implementations (enterobacterial
      CysJ/CysI and fungal Met10/Met5).
  - source_id: YeastPathways:SO4ASSIM-PWY
    title: assimilatory sulfate reduction I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Four reactions with MET3 (ATP sulfurylase), MET14 (APS kinase), MET16
      (PAPS reductase) and MET10 + MET5 (NADPH sulfite reductase). All
      assignments were retained; the thioredoxins (TRX1, TRX2) that supply
      reducing equivalents to MET16 are absent from the gene list and were
      added as the PAPS-reductase electron-donor role.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=SO4ASSIM-PWY
  - source_id: YeastPathways:PWY-781
    title: sulfate assimilation pathway (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Same four reactions and catalysts as SO4ASSIM-PWY, with a comment
      covering sulfate uptake (SUL1, SUL2, outside this module), the
      activation-reduction sequence and Met4-dependent regulation.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-781
  - source_id: YeastPathways:PWY-5340
    title: sulfate activation (for sulfonation) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      MET3 and MET14 producing PAPS; this is the activation prefix of the PAPS
      route of this module and is not modelled separately.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5340
  - source_id: PMID:9409150
    title: Metabolism of sulfur amino acids in Saccharomyces cerevisiae.
    statement: Review of the S. cerevisiae sulfate assimilation pathway cited by YeastPathways.
  - source_id: PMID:197388
    title: >-
      Methionine biosynthesis in Saccharomyces cerevisiae. II. Gene-enzyme
      relationships in the sulfate assimilation pathway.
    statement: >-
      Classical gene-enzyme mapping of the yeast sulfate assimilation
      pathway, the basis of the MET3, MET14 and MET16 assignments in GOA.
  - source_id: PMID:11157739
    title: Crystal structure of ATP sulfurylase from Saccharomyces cerevisiae, a key enzyme in sulfate activation.
    statement: >-
      Yeast ATP sulfurylase (MET3) is a homohexamer, in contrast to the
      heterodimeric CysD/CysN enzyme.
    supporting_text: >-
      The enzyme consists of six identical subunits arranged in two stacked
      rings in a D:3 symmetric assembly.
  - source_id: PMID:18388974
    title: Cloning of the ATP sulphurylase gene of Schizosaccharomyces pombe by functional complementation.
    statement: >-
      S. pombe sua1 encodes ATP sulfurylase and complements an S. cerevisiae
      met3 mutation.
    supporting_text: >-
      The cloned sua1 gene also complemented the met3 (ATP sulphurylase
      deficient) mutation in Saccharomyces cerevisiae.
  - source_id: PMID:1654509
    title: Cloning, nucleotide sequence, and regulation of MET14, the gene encoding the APS kinase of Saccharomyces cerevisiae.
    statement: MET14 encodes S. cerevisiae APS kinase.
    supporting_text: >-
      The MET14 gene of Saccharomyces cerevisiae, encoding APS kinase
      (ATP:adenylylsulfate-3'-phosphotransferase, EC 2.7.1.25), has been
      cloned.
  - source_id: PMID:2203779
    title: >-
      Gene-enzyme relationship in the sulfate assimilation pathway of
      Saccharomyces cerevisiae. Study of the 3'-phosphoadenylylsulfate
      reductase structural gene.
    statement: MET16 is the structural gene for yeast PAPS reductase, which is similar to E. coli CysH.
    supporting_text: >-
      we show that MET16 is the structural gene for PAPS reductase and that
      the yeast and the Escherichia coli enzymes display significant
      similarities.
  - source_id: PMID:3060034
    title: 'Yeast PAPS reductase: properties and requirements of the purified enzyme.'
    statement: Purified yeast PAPS reductase requires reduced thioredoxin as cosubstrate.
    supporting_text: Reduced thioredoxin is required as cosubstrate.
  - source_id: PMID:2026619
    title: Thioredoxin deficiency in yeast prolongs S phase and shortens the G1 interval of the cell cycle.
    statement: >-
      A trx1 trx2 double deletion is a methionine auxotroph, showing that the
      cytosolic thioredoxins are required in vivo for sulfate assimilation.
    supporting_text: >-
      Surprisingly, the loss of both thioredoxins also leads to methionine
      auxotrophy. Thus yeast glutaredoxin is unable to substitute for
      thioredoxin in sulfate assimilation.
  - source_id: PMID:10613872
    title: Identification of a new class of 5'-adenylylsulfate (APS) reductases from sulfate-assimilating bacteria.
    statement: >-
      Pseudomonas aeruginosa CysH is an APS reductase that bypasses PAPS,
      distinct from the E. coli PAPS reductase; this separates the two
      routes of the module.
    supporting_text: >-
      Purified P. aeruginosa CysH expressed as a His-tagged recombinant
      protein is able to reduce APS, but not PAPS.
  - source_id: PMID:6751400
    title: Studies on yeast sulfite reductase. IV. Structure and steady-state kinetics.
    statement: Yeast NADPH-sulfite reductase is an alpha2beta2 hemoflavoprotein.
    supporting_text: >-
      The enzyme consists of two types of subunit, alpha and beta, having
      molecular weights of 116,000 and 167,000, respectively. The subunit
      structure is suggested to be alpha 2 beta 2.
  - source_id: PMID:7928966
    title: >-
      Two divergent MET10 genes, one from Saccharomyces cerevisiae and one
      from Saccharomyces carlsbergensis, encode the alpha subunit of sulfite
      reductase and specify potential binding sites for FAD and NADPH.
    statement: >-
      MET10 encodes the flavoprotein alpha subunit, related to E. coli CysJ
      but lacking obvious FMN-binding motifs.
    supporting_text: >-
      suggests that the yeast assimilatory sulfite reductase is a distinct
      type of sulfite reductase.
  - source_id: PMID:1479340
    title: Physiological analysis of mutants of Saccharomyces cerevisiae impaired in sulphate assimilation.
    statement: >-
      MET5 and MET10 (subunits) and MET1, MET8 (siroheme synthesis) are needed
      for active sulfite reductase.
    supporting_text: >-
      the products of at least five genes are needed for the synthesis of an
      enzymically active sulphite reductase. These genes are MET1, MET5, MET8,
      MET10 and MET20.
  - source_id: PMID:16387658
    title: Molecular basis for G protein control of the prokaryotic ATP sulfurylase.
    statement: >-
      Biochemistry and structure establish the proteobacterial CysD/CysN
      complex and energetic coupling of CysN GTP turnover to APS formation.
  - source_id: PMID:23794620
    title: Role for ferredoxin:NAD(P)H oxidoreductase (FprA) in sulfate assimilation and siderophore biosynthesis in Pseudomonads.
    statement: >-
      Pseudomonas genetics support an FprA-fed CysI sulfite-reduction system
      distinct from enterobacterial CysJ/CysI.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__aps_dependent_assimilatory_sulfate_reduction__ppu00920-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00920 satisfiability review
    statement: >-
      The species-aware review evaluates whether the curated PSEPK genes
      satisfy this module within the wider sulfur-metabolism map.
  - source_id: file:modules/aps_dependent_assimilatory_sulfate_reduction-deep-research-openscientist.md
    title: OpenScientist research for APS-dependent assimilatory sulfate reduction
    statement: >-
      The generic review supports the activate-reduce-reduce boundary and
      cross-lineage variation in enzyme and electron-supply architectures. Its
      organism-mixed mechanistic claims were treated as retrieval context, not
      as evidence that any one concrete lineage uses every described feature.
  - source_id: file:PSEPK/cysD/cysD-ai-review.yaml
    title: PSEPK cysD gene review
    statement: Q88NA9 supplies the ATP sulfurylase catalytic subunit.
  - source_id: file:PSEPK/cysNC/cysNC-ai-review.yaml
    title: PSEPK cysNC gene review
    statement: Q88NA8 supplies the ATP sulfurylase regulatory GTPase subunit.
  - source_id: file:PSEPK/cysH/cysH-ai-review.yaml
    title: PSEPK cysH gene review
    statement: Q88KG2 supplies the APS-to-sulfite reaction.
  - source_id: file:PSEPK/cysI/cysI-ai-review.yaml
    title: PSEPK cysI gene review
    statement: Q88KB9 supplies the sulfite-reductase catalytic hemoprotein.
  - source_id: file:PSEPK/fpr-I/fpr-I-ai-review.yaml
    title: PSEPK fpr-I gene review
    statement: Q88MD5 supplies the FprA-type electron-transfer role.
