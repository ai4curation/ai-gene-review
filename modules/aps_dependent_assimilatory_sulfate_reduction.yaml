  notes: 'Union of supported assimilatory implementations, not a claim that every member of these clades
    possesses the complete pathway. Individual activities, substrates and electron donors require target-specific
    evidence; dissimilatory sulfate reduction and animal PAPS synthesis are outside scope. This template
    distinguishes sulfate activation, substrate-specific APS/PAPS reduction and terminal sulfite reduction.
    Fungal GO-CAM anchors remain; enzyme families are constrained by functional evidence. Plant APR1 is
    glutathione-dependent with a fused redox domain, and plant APS kinase used for sulfation is not evidence
    for a PAPS-reductive pathway. The native carrier in Pseudomonas Fpr-linked reduction is unresolved.
    The old P9WJ02 CDC1551 exemplar was corrected to characterized H37Rv P9WJ03. No module-wide compartment
    is asserted: fungal cytosol and plant plastids are distinct. Siroheme biosynthesis, redox regeneration,
    PAP recycling and downstream sulfide incorporation remain separate. Existing OpenScientist reports
    are discovery material, not primary evidence. Detailed source limits and provider failures are recorded
    in module notes.'
