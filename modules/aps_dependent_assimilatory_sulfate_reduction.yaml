    - order: 2
      role: reduction of activated sulfate to sulfite
      node:
        id: aps_reduction_step
        label: Reduction of activated sulfate to sulfite
        module_type: METABOLIC_PATHWAY
        description: >-
          APS is reduced to sulfite either directly or after phosphorylation
          to PAPS. Both routes use thioredoxin-dependent reductases of the
          same PAPS-reductase fold (Pfam PF01507), but the substrate
          specificity (APS versus PAPS) must be established experimentally
          for each enzyme.
        variant_sets:
          - id: sulfate_reduction_route
            label: APS versus PAPS reduction route
            axis: substrate route
            selection: ONE_OR_MORE
            notes: >-
              Most organisms use one route: plants and many bacteria (e.g.
              Pseudomonas) reduce APS directly, whereas enterobacteria and
              fungi phosphorylate APS to PAPS and reduce PAPS. ONE_OR_MORE is
              used because a genome may encode both an APS kinase and an APS
              reductase.
