        'de novo' L-methionine biosynthetic process (GO:0071266), sulfate
        assimilation (GO:0000103), sulfite transmembrane transport
        (GO:0000316), sulfate import across plasma membrane (GO:1902434)
      description: >-
        PomBase S. pombe model. Module-relevant activities are sua1
