id: MODULE:tres_mak_glge_branched_alpha_glucan_biosynthesis
title: TreS-Mak-GlgE branched alpha-glucan biosynthesis
description: >-
  A reusable bacterial pathway that channels trehalose into branched
  alpha-glucan. Trehalose synthase operating in the catabolic direction forms
  maltose, maltokinase converts maltose to alpha-maltose 1-phosphate, GlgE uses
  that activated donor to extend alpha-1,4-glucan chains by maltosyl units, and
  GlgB introduces alpha-1,6 branches. TreS and Mak may be separate proteins or
  domains of one fusion protein; that architectural variation does not change
  the four reaction roles.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0030979
    title: alpha-glucan biosynthetic process
    statement: >-
      GO:0030979 captures formation of alpha-glucan represented by the
      GlgE-dependent extension and GlgB-dependent branching reactions.
  - source_id: file:PSEPK/treSB/treSB-uniprot.txt
    title: UniProtKB entry for PSEPK TreSB
    statement: >-
      Q88FN0 carries both trehalose synthase EC 5.4.99.16 and maltokinase
      EC 2.7.1.175 reactions.
  - source_id: file:PSEPK/glgE/glgE-uniprot.txt
    title: UniProtKB entry for PSEPK GlgE
    statement: >-
      Q88FM9 is assigned the maltose-1-phosphate-dependent alpha-glucan
      extension reaction Rhea 42692.
  - source_id: file:PSEPK/glgB/glgB-uniprot.txt
    title: UniProtKB entry for PSEPK GlgB
    statement: >-
      Q88FN1 is a reviewed 1,4-alpha-glucan branching enzyme.
notes: >-
  The Pseudomonas putida KT2440 implementation uses a bifunctional TreS-Mak
  fusion (TreSB), represented as the same UniProt exemplar in two reaction
  leaves. This is an implementation detail, not a reason to merge the
  reactions. The module starts with trehalose and ends with branched
  alpha-glucan; trehalose biosynthesis, glucan priming, degradation, and
  downstream storage-envelope roles are outside its boundary. The broad GO
  terms used for Mak and GlgE are supplemented by exact EC and Rhea chemistry.
module:
  id: tres_mak_glge_branched_alpha_glucan_biosynthesis
  label: TreS-Mak-GlgE branched alpha-glucan biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: alpha-glucan biosynthetic process
      term:
        id: GO:0030979
        label: alpha-glucan biosynthetic process
      description: Biosynthesis of branched alpha-glucan through the GlgE route.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          The pathway is found in bacterial lineages with TreS, Mak, GlgE, and
          GlgB activities.
  parts:
    - order: 1
      role: trehalose isomerization to maltose
      node:
        id: tres_maltose_formation
        label: TreS-dependent maltose formation
        module_type: REACTION
        annotons:
          - id: tres_activity
            label: TreS trehalose synthase activity in the maltose-forming direction
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TreS trehalose synthase family
                term:
                  id: PANTHER:PTHR10357:SF219
                  label: MALTOSE ALPHA-D-GLUCOSYLTRANSFERASE
                representative_members:
                  - preferred_term: TreS-Mak fusion (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88FN0
                      label: Maltokinase
                    description: >-
                      PSEPK treSB/PP_4059 carries both EC 5.4.99.16 and
                      EC 2.7.1.175.
                  - preferred_term: TreS (Mycobacterium tuberculosis H37Rv)
                    term:
                      id: UniProtKB:P9WQ19
                      label: Trehalose synthase/amylase TreS
                    description: >-
                      Reviewed exemplar of the split TreS architecture.
                ancestral_nodes:
                  - preferred_term: Bacterial TreS function node PTN000039847
                    term:
                      id: PANTHER:PTN000039847
                      label: PTN000039847
                    description: >-
                      PAINT IBD node in PTHR10357 supporting
                      maltose alpha-D-glucosyltransferase activity, seeded by
                      UniProtKB:P9WQ19.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          Local PTHR10357 PAINT data assigns GO:0047471 to
                          PTN000039847 with UniProtKB:P9WQ19 as the seed.
            function:
              preferred_term: maltose alpha-D-glucosyltransferase activity
              term:
                id: GO:0047471
                label: maltose alpha-D-glucosyltransferase activity
              substrates:
                - preferred_term: alpha,alpha-trehalose
              products:
                - preferred_term: D-maltose
              evidence:
                - source_id: RHEA:15145
                  title: maltose-trehalose isomerization
                  statement: >-
                    Rhea 15145 defines the reversible EC 5.4.99.16 reaction;
                    the maltose-forming direction supplies this pathway.
                - source_id: file:PSEPK/treSB/treSB-uniprot.txt
                  statement: Q88FN0 carries EC 5.4.99.16.
            role_description: Converts trehalose to the maltokinase substrate.
    - order: 2
      role: maltose 1-phosphate formation
      node:
        id: mak_maltose_1_phosphate_formation
        label: Mak-dependent alpha-maltose 1-phosphate formation
        module_type: REACTION
        annotons:
          - id: mak_activity
            label: Mak maltokinase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: maltokinase family
                representative_members:
                  - preferred_term: TreS-Mak fusion (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88FN0
                      label: Maltokinase
                    description: >-
                      The C-terminal Mak region of the PSEPK fusion performs
                      EC 2.7.1.175.
                  - preferred_term: Mak (Mycobacterium tuberculosis H37Rv)
                    term:
                      id: UniProtKB:O07177
                      label: Maltokinase
                    description: >-
                      Reviewed standalone maltokinase exemplar from the split
                      TreS-Mak architecture.
            function:
              preferred_term: carbohydrate kinase activity
              term:
                id: GO:0019200
                label: carbohydrate kinase activity
              substrates:
                - preferred_term: D-maltose
                - preferred_term: ATP
              products:
                - preferred_term: alpha-maltose 1-phosphate
                - preferred_term: ADP
              evidence:
                - source_id: RHEA:31915
                  title: maltokinase reaction
                  statement: >-
                    Rhea 31915 defines ATP-dependent phosphorylation of
                    D-maltose to alpha-maltose 1-phosphate.
                - source_id: file:PSEPK/treSB/treSB-uniprot.txt
                  statement: Q88FN0 carries EC 2.7.1.175 and Rhea 31915.
            processes:
              - preferred_term: alpha-glucan biosynthetic process
                term:
                  id: GO:0030979
                  label: alpha-glucan biosynthetic process
            role_description: Produces the activated maltosyl donor used by GlgE.
    - order: 3
      role: alpha-1,4-glucan chain extension
      node:
        id: glge_alpha_glucan_extension
        label: GlgE-dependent alpha-glucan extension
        module_type: REACTION
        annotons:
          - id: glge_activity
            label: GlgE maltose-1-phosphate maltosyltransferase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GlgE maltosyltransferase family
                term:
                  id: PANTHER:PTHR47786
                  label: ALPHA-1,4-GLUCAN:MALTOSE-1-PHOSPHATE MALTOSYLTRANSFERASE
                representative_members:
                  - preferred_term: GlgE (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88FM9
                      label: Alpha-1,4-glucan:maltose-1-phosphate maltosyltransferase
                  - preferred_term: GlgE (Mycobacterium tuberculosis H37Rv)
                    term:
                      id: UniProtKB:P9WQ17
                      label: Alpha-1,4-glucan:maltose-1-phosphate maltosyltransferase
            function:
              preferred_term: hexosyltransferase activity
              term:
                id: GO:0016758
                label: hexosyltransferase activity
              substrates:
                - preferred_term: alpha-maltose 1-phosphate
                - preferred_term: alpha-1,4-glucan acceptor
              products:
                - preferred_term: alpha-1,4-glucan extended by two glucose residues
                - preferred_term: phosphate
              evidence:
                - source_id: RHEA:42692
                  title: GlgE maltosyltransferase reaction
                  statement: >-
                    Rhea 42692 defines transfer of a maltosyl unit from
                    alpha-maltose 1-phosphate to alpha-1,4-glucan.
                - source_id: file:PSEPK/glgE/glgE-uniprot.txt
                  statement: Q88FM9 carries EC 2.4.99.16 and Rhea 42692.
            processes:
              - preferred_term: alpha-glucan biosynthetic process
                term:
                  id: GO:0030979
                  label: alpha-glucan biosynthetic process
            role_description: Builds the linear alpha-1,4-glucan backbone.
    - order: 4
      role: alpha-glucan branching
      node:
        id: glgb_alpha_glucan_branching
        label: GlgB-dependent alpha-1,6 branching
        module_type: REACTION
        annotons:
          - id: glgb_activity
            label: GlgB 1,4-alpha-glucan branching activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GlgB alpha-glucan branching-enzyme family
                term:
                  id: PANTHER:PTHR43651
                  label: 1,4-ALPHA-GLUCAN-BRANCHING ENZYME
                representative_members:
                  - preferred_term: GlgB (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88FN1
                      label: 1,4-alpha-glucan branching enzyme GlgB
                  - preferred_term: GlgB (Mycobacterium tuberculosis H37Rv)
                    term:
                      id: UniProtKB:P9WN45
                      label: 1,4-alpha-glucan branching enzyme GlgB
            function:
              preferred_term: 1,4-alpha-glucan branching enzyme activity
              term:
                id: GO:0003844
                label: 1,4-alpha-glucan branching enzyme activity
              substrates:
                - preferred_term: alpha-1,4-glucan chain
              products:
                - preferred_term: alpha-1,4-glucan containing alpha-1,6 branches
              evidence:
                - source_id: EC:2.4.1.18
                  title: 1,4-alpha-glucan branching enzyme
                  statement: >-
                    EC 2.4.1.18 transfers a segment of an alpha-1,4-glucan
                    chain to a primary hydroxyl group to form a branch.
                - source_id: file:PSEPK/glgB/glgB-uniprot.txt
                  statement: >-
                    The reviewed Q88FN1 record assigns EC 2.4.1.18 and
                    GO:0003844.
            processes:
              - preferred_term: alpha-glucan biosynthetic process
                term:
                  id: GO:0030979
                  label: alpha-glucan biosynthetic process
            role_description: Converts extended linear chains into branched alpha-glucan.
  connections:
    - source: tres_maltose_formation
      target: mak_maltose_1_phosphate_formation
      connection_type: PROVIDES_INPUT_FOR
      description: TreS supplies D-maltose to Mak.
      chaining_status: VERIFIED
      chaining_note: Rhea 15145 maltose is the substrate of Rhea 31915.
    - source: mak_maltose_1_phosphate_formation
      target: glge_alpha_glucan_extension
      connection_type: PROVIDES_INPUT_FOR
      description: Mak supplies alpha-maltose 1-phosphate to GlgE.
      chaining_status: VERIFIED
      chaining_note: Rhea 31915 product matches the donor in Rhea 42692.
    - source: glge_alpha_glucan_extension
      target: glgb_alpha_glucan_branching
      connection_type: PROVIDES_INPUT_FOR
      description: GlgB branches the alpha-1,4-glucan chains extended by GlgE.
      chaining_status: VERIFIED
      chaining_note: >-
        Both reactions act on the alpha-glucan polymer; polymer-chain length
        and branching state are represented at class level.
  knowledge_gaps:
    - gap_statement: >-
        GO lacks a substrate-specific molecular-function term for maltokinase
        activity (EC 2.7.1.175).
      boundary: >-
        The Mak leaf uses GO:0019200 carbohydrate kinase activity together
        with Rhea 31915 to preserve the exact maltose-to-alpha-maltose
        1-phosphate chemistry.
      gap_kind:
        - ONTOLOGY
    - gap_statement: >-
        GO lacks a substrate-specific molecular-function term for the GlgE
        alpha-1,4-glucan:maltose-1-phosphate maltosyltransferase reaction
        (EC 2.4.99.16).
      boundary: >-
        The GlgE leaf uses GO:0016758 with Rhea 42692, while the gene review
        proposes a term under GO:0016757 that captures transfer of a maltosyl
        disaccharide rather than a single hexosyl group.
      gap_kind:
        - ONTOLOGY
