      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  concepts:
    - preferred_term: phosphoenolpyruvate-dependent sugar phosphotransferase system
      term:
        id: GO:0009401
        label: phosphoenolpyruvate-dependent sugar phosphotransferase system
      description: Protein-phosphorelay-coupled fructose uptake and phosphorylation.
    - preferred_term: fructose catabolic process
      term:
        id: GO:0006001
        label: fructose catabolic process
      description: Conversion of imported fructose into a central-carbon intermediate.
  parts:
    - order: 1
      role: phosphoryl relay from phosphoenolpyruvate to the fructose-specific EIIA domain
      node:
        id: fructose_pts_phosphorelay
        label: PEP-to-EIIA(Fru) phosphorelay
        module_type: BIOLOGICAL_PROCESS
        variant_sets:
          - id: fructose_relay_architecture
            label: Fused or split fructose PTS relay
            axis: relay protein architecture
            variant_kind: ROUTE
            selection: ONE_OR_MORE
            notes: >-
              Both routes deliver a phosphorylated EIIA(Fru) histidine to the permease. The
              fused route keeps enzyme I, HPr and EIIA on one protein; the split route uses
              the general enzyme I, shared with other PTS sugars, and the FPr fusion of HPr
              and EIIA.
            variants:
              - id: fused_relay_variant
                label: Fused EI-HPr-EIIA(Fru) multiphosphoryl transfer protein
                module_type: REACTION
                annotons:
                  - id: fused_frub_pep_phosphotransferase
                    label: FruB PEP-protein phosphotransferase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: fused EI-HPr-EIIA(Fru) proteins of the enzyme I family
                        term:
                          id: PANTHER:PTHR46244
                          label: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
                        description: >-
                          PTHR46244 also contains standalone enzyme I and nitrogen-regulatory
                          EI(Ntr); this variant requires the EIIA(Fru) and HPr domains on the
                          same polypeptide.
                        representative_members:
                          - preferred_term: fruB (PSEPK)
                            term:
                              id: UniProtKB:Q88PQ5
                              label: phosphoenolpyruvate--protein phosphotransferase
                            description: >-
                              Pseudomonas putida KT2440 fused EI-HPr-EIIA(Fru)
                              multiphosphoryl transfer protein.
                          - preferred_term: fruB (XANCP)
                            term:
                              id: UniProtKB:P45597
                              label: multiphosphoryl transfer protein
                            description: >-
                              Xanthomonas campestris fused EI-HPr-EIIA(Fru) protein with
                              native-strain uptake genetics.
                    function:
                      preferred_term: phosphoenolpyruvate-protein phosphotransferase activity
                      term:
                        id: GO:0008965
                        label: phosphoenolpyruvate-protein phosphotransferase activity
                      substrates:
                        - preferred_term: phosphoenolpyruvate
                        - preferred_term: L-histidyl protein
                      products:
                        - preferred_term: pyruvate
                        - preferred_term: N(pros)-phospho-L-histidyl protein
                      evidence:
                        - source_id: RHEA:23880
                          title: phosphoenolpyruvate-protein phosphotransferase reaction
                          statement: >-
                            Rhea 23880 defines phosphate transfer from phosphoenolpyruvate to
                            a protein histidine.
                    processes:
                      - preferred_term: phosphoenolpyruvate-dependent sugar phosphotransferase system
                        term:
                          id: GO:0009401
                          label: phosphoenolpyruvate-dependent sugar phosphotransferase system
                    locations:
                      - preferred_term: cytoplasm
                        term:
                          id: GO:0005737
                          label: cytoplasm
                    role_description: >-
                      Introduces phosphate from PEP at the EI region; the fused HPr and EIIA
                      domains relay it to the EIIB domain of the permease. GO:0008965 covers
                      the PEP entry step only; the EIIA-to-EIIB transfer has no GO term and is
                      represented by the connection to the permease.
              - id: split_relay_variant
                label: General enzyme I with the FPr HPr-EIIA(Fru) protein
                module_type: BIOLOGICAL_PROCESS
                annotons:
                  - id: general_enzyme_i_activity
                    label: General PTS enzyme I
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: sugar-PTS enzyme I
                        term:
                          id: PANTHER:PTHR46244
                          label: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
                        description: >-
                          Standalone sugar-PTS enzyme I; nitrogen-regulatory EI(Ntr) in the same
                          family phosphorylates NPr rather than HPr and does not qualify.
                        representative_members:
                          - preferred_term: ptsI (ECOLI)
                            term:
                              id: UniProtKB:P08839
                              label: Phosphoenolpyruvate-protein phosphotransferase
                            description: >-
                              Escherichia coli general enzyme I, characterized kinetically and
                              structurally.
                    function:
                      preferred_term: phosphoenolpyruvate-protein phosphotransferase activity
                      term:
                        id: GO:0008965
                        label: phosphoenolpyruvate-protein phosphotransferase activity
                      substrates:
                        - preferred_term: phosphoenolpyruvate
                        - preferred_term: L-histidyl protein
                      products:
                        - preferred_term: pyruvate
                        - preferred_term: N(pros)-phospho-L-histidyl protein
                      evidence:
                        - source_id: RHEA:23880
                          title: phosphoenolpyruvate-protein phosphotransferase reaction
                          statement: >-
                            Rhea 23880 defines phosphate transfer from phosphoenolpyruvate to
                            a protein histidine.
                        - source_id: PMID:12705838
                          title: 'Enzyme I of the phosphotransferase system: induced-fit protonation of the reaction transition state by Cys-502.'
                          statement: Purified E. coli enzyme I uses PEP as phosphoryl donor.
                          supporting_text: EI(C502A) is 10 000 times less active than wild-type EI [EI(wt)] with PEP as the substrate
                    processes:
                      - preferred_term: phosphoenolpyruvate-dependent sugar phosphotransferase system
                        term:
                          id: GO:0009401
                          label: phosphoenolpyruvate-dependent sugar phosphotransferase system
                    locations:
                      - preferred_term: cytoplasm
                        term:
                          id: GO:0005737
                          label: cytoplasm
                    role_description: >-
                      Autophosphorylates from PEP and phosphorylates the HPr-like domain of
                      FPr; the same enzyme serves the other PTS sugars through HPr.
                  - id: fpr_hpr_eiia_relay
                    label: FPr HPr-like and EIIA(Fru) relay
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: FPr multiphosphoryl transfer proteins
                        term:
                          id: PANTHER:PTHR30181:SF3
                          label: MULTIPHOSPHORYL TRANSFER PROTEIN
                        description: >-
                          Enterobacterial, pasteurellacean and vibrio FPr proteins fusing EIIA(Fru)
                          to an HPr-like domain. SF3 also contains an EIICB permease, so the
                          domain architecture, not the subfamily, defines the role.
                        representative_members:
                          - preferred_term: fruB (ECOLI)
                            term:
                              id: UniProtKB:P69811
                              label: Multiphosphoryl transfer protein
                            description: >-
                              Escherichia coli FPr, the fructose-induced HPr substitute and
                              EIIA(Fru) donor to FruA.
                    function:
                      preferred_term: PTS EIIA-to-EIIB phosphotransferase activity
                      substrates:
                        - preferred_term: N(pros)-phospho-L-histidyl protein
                      products:
                        - preferred_term: L-histidyl protein
                      evidence:
                        - source_id: PMID:8626640
                          title: Function of the duplicated IIB domain and oligomeric structure of the fructose permease of Escherichia coli.
                          statement: FPr (DTP) is the phosphoryl donor to the FruA EIIB domains.
                          supporting_text: the B' domain of the fructose permease functions to facilitate phosphoryl transfer between DTP and the permease
                    processes:
                      - preferred_term: fructose import across plasma membrane
                        term:
                          id: GO:1990539
                          label: fructose import across plasma membrane
                    locations:
                      - preferred_term: cytoplasm
                        term:
                          id: GO:0005737
                          label: cytoplasm
                    role_description: >-
                      Receives phosphate from enzyme I on its HPr-like domain and passes it
                      through its EIIA(Fru) domain to the permease. The activity has no GO
                      term; the FPr gene review proposes one.
        connections:
          - source: general_enzyme_i_activity
            target: fpr_hpr_eiia_relay
            connection_type: PROVIDES_INPUT_FOR
            description: Enzyme I phosphorylates the HPr-like domain of FPr.
    - order: 2
      role: fructose import coupled to fructose 1-phosphate formation
      node:
        id: fructose_pts_import
        label: Fructose-specific EIIB-EIIC transport and phosphorylation
        module_type: REACTION
        annotons:
          - id: fructose_eiibc_transport
            label: Fructose-specific EIIB-EIIC transport and phosphorylation
            participant:
              selector_type: FAMILY
              family:
                preferred_term: fructose-specific PTS EIIB-EIIC proteins
                term:
                  id: PANTHER:PTHR30505
                  label: FRUCTOSE-LIKE PERMEASE
                representative_members:
                  - preferred_term: fruA (PSEPK)
                    term:
                      id: UniProtKB:Q88PQ3
                      label: protein-N(pi)-phosphohistidine--D-fructose phosphotransferase
                    description: Pseudomonas putida KT2440 EIIB-EIIC fusion.
                  - preferred_term: fruA (ECOLI)
                    term:
                      id: UniProtKB:P20966
                      label: PTS system fructose-specific EIIB'BC component
                    description: Escherichia coli EIIB'BC permease served by FPr.
            function:
              preferred_term: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
              term:
                id: GO:0022877
                label: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
              substrates:
                - preferred_term: D-fructose (outside)
                - preferred_term: N(pros)-phospho-L-histidyl protein
              products:
                - preferred_term: beta-D-fructose 1-phosphate (inside)
                - preferred_term: L-histidyl protein
              evidence:
                - source_id: RHEA:49252
                  title: PTS fructose transport-phosphorylation reaction
                  statement: >-
                    Rhea 49252 defines coupled import and phosphorylation of D-fructose to
                    intracellular D-fructose 1-phosphate.
            processes:
              - preferred_term: fructose transmembrane transport
                term:
                  id: GO:0015755
                  label: fructose transmembrane transport
              - preferred_term: phosphoenolpyruvate-dependent sugar phosphotransferase system
                term:
                  id: GO:0009401
                  label: phosphoenolpyruvate-dependent sugar phosphotransferase system
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Receives phosphate from the EIIA(Fru) domain through its EIIB relay and couples
              fructose translocation through EIIC to formation of intracellular fructose
              1-phosphate.
    - order: 3
      role: fructose 1-phosphate conversion to fructose 1,6-bisphosphate
      node:
        id: fruk_f1p_phosphorylation
        label: FruK-dependent fructose 1-phosphate phosphorylation
        module_type: REACTION
        annotons:
          - id: fruk_activity
            label: 1-phosphofructokinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: 1-phosphofructokinase family
                term:
                  id: PANTHER:PTHR46566
                  label: 1-PHOSPHOFRUCTOKINASE-RELATED
                representative_members:
                  - preferred_term: fruK (PSEPK)
                    term:
                      id: UniProtKB:Q88PQ4
                      label: 1-phosphofructokinase
                    description: Pseudomonas putida KT2440 FruK.
                  - preferred_term: fruK (ECOLI)
                    term:
                      id: UniProtKB:P0AEW9
                      label: 1-phosphofructokinase
                    description: Escherichia coli FruK.
                ancestral_nodes:
                  - preferred_term: PAINT node PTN001317471
                    term:
                      id: PANTHER:PTN001317471
                      label: PTN001317471
                    description: >-
                      Local PAINT IBD node in PTHR46566 supporting broad GO:0008443
                      phosphofructokinase activity, seeded by P0AEW9 with PfkB (P06999); it
                      does not by itself establish 1-phosphate substrate specificity.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN001317471 in PTHR46566.
            function:
              preferred_term: 1-phosphofructokinase activity
              term:
                id: GO:0008662
                label: 1-phosphofructokinase activity
              substrates:
                - preferred_term: beta-D-fructose 1-phosphate
                - preferred_term: ATP
              products:
                - preferred_term: beta-D-fructose 1,6-bisphosphate
                - preferred_term: ADP
                - preferred_term: proton
              evidence:
                - source_id: RHEA:14213
                  title: 1-phosphofructokinase reaction
                  statement: >-
                    Rhea 14213 defines ATP-dependent phosphorylation of beta-D-fructose
                    1-phosphate.
            processes:
              - preferred_term: fructose catabolic process
                term:
                  id: GO:0006001
                  label: fructose catabolic process
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Converts the product of PTS import into fructose 1,6-bisphosphate for
              downstream central carbon metabolism.
  connections:
    - source: fructose_pts_phosphorelay
      target: fructose_pts_import
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Phosphorylated EIIA(Fru), from either relay route, phosphorylates the EIIB domain of
        the fructose permease.
    - source: fructose_pts_import
      target: fruk_f1p_phosphorylation
      connection_type: PROVIDES_INPUT_FOR
      description: The fructose PTS supplies intracellular fructose 1-phosphate to FruK.
  notes: >-
    Scope is abstract: exemplars from Pseudomonas putida KT2440 and Xanthomonas (fused relay)
    and Escherichia coli K-12 (split relay) delimit family-level roles without restricting the
    module taxonomically. The fused-relay route alone is modelled in detail, with more
    exemplars and an explicit internal relay step, in the concrete module
    bacterial_fructose_pts_catabolism. Enterobacterial FPr lacks enzyme I and depends on the
    general PtsI shared with other PTS sugars. PTNs from source GOA are TreeGrafter or
    combined-IEA provenance only, except PTN001317471, a PAINT IBD node for the broad
    phosphofructokinase parent term. GO has no term for the EIIA-to-EIIB phosphotransfer; the
    FPr and P. putida FruB gene reviews propose one. Transcriptional regulation,
    phosphoenolpyruvate supply, and PTS cross-talk are not required catalytic parts of this
    module.
