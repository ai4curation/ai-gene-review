      description: >-
        The fructose PTS supplies intracellular fructose 1-phosphate to FruK.
  notes: >-
    Exact UniProt exemplars delimit the family-level roles without restricting
    the module taxonomically. The phosphorelay may be encoded as a fused
    EI-HPr-EIIA(Fru) protein or as split components; both implement the same
    leaf role. PTNs encountered in source GOA are TreeGrafter or combined-IEA
    provenance only, not PAINT ancestral-state assertions. Transcriptional regulation,
    phosphoenolpyruvate supply, and PTS cross-talk are not required catalytic
    parts of this module.
