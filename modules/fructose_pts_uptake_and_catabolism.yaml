id: MODULE:fructose_pts_uptake_and_catabolism
title: Bacterial fructose PTS uptake and entry into central carbon catabolism
description: >-
  A reusable bacterial module in which a fructose-specific phosphoenolpyruvate-dependent
  phosphotransferase system (PTS) imports fructose while converting it to fructose
  1-phosphate, and 1-phosphofructokinase then converts fructose 1-phosphate to fructose
  1,6-bisphosphate. Phosphate from phosphoenolpyruvate reaches the fructose-specific EIIA
  domain by one of two architectures: a fused EI-HPr-EIIA(Fru) multiphosphoryl transfer
  protein, or a standalone general enzyme I that phosphorylates an HPr-EIIA(Fru) fusion
  protein (FPr). The phosphorylated EIIA domain then feeds an EIIB-EIIC permease that
  translocates and phosphorylates fructose. The module stops at fructose 1,6-bisphosphate.
  Downstream central-carbon reactions, PTS regulatory cross-talk, transcriptional control,
  and pathways for other hexoses are outside the boundary.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0006001
    title: fructose catabolic process
    statement: GO:0006001 supplies the biological-process context for the two-step route.
  - source_id: PMID:18296519
    title: Evidence of in vivo cross talk between the nitrogen-related and fructose-related branches of the carbohydrate phosphotransferase system of Pseudomonas putida.
    statement: >-
      Genetic analysis establishes FruA and FruB as the complete fructose-intake
      phosphotransferase system in Pseudomonas putida KT2440, the fused-relay exemplar.
  - source_id: PMID:27933319
    title: A Metabolic Widget Adjusts the Phosphoenolpyruvate-Dependent Fructose Influx in Pseudomonas putida.
    statement: >-
      The KT2440 study identifies the fruBKA locus, the FruB and FruA polyprotein
      architectures, and FruK as 1-phosphofructokinase.
  - source_id: PMID:7006754
    title: 'Resolution of the phosphoenolpyruvate: fructose phosphotransferase system of Escherichia coli into two components: enzyme IIfructose and fructose-induced HPr-like protein (FPr).'
    statement: >-
      In Escherichia coli the fructose PTS uses FPr, an HPr substitute, together with
      enzyme IIfructose, the split-relay exemplar.
  - source_id: PMID:8626640
    title: Function of the duplicated IIB domain and oligomeric structure of the fructose permease of Escherichia coli.
    statement: >-
      The E. coli fructose permease FruA receives phosphate from the IIA-FPr protein
      through its EIIB domains; its EIIB cysteine is essential for transport.
  - source_id: PANTHER:PTN002412130
    title: FruA TreeGrafter support node
    statement: >-
      Current PSEPK GOA uses this exact node as TreeGrafter/combined electronic
      support for FruA activity and pathway annotations.
  - source_id: PANTHER:PTN002238739
    title: FruK TreeGrafter support node
    statement: >-
      Current PSEPK GOA uses this exact node as TreeGrafter/combined electronic
      support for FruK activity and localization annotations.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__fructose_pts_uptake_and_catabolism__ppu00051-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00051 satisfiability review
    statement: >-
      The species-aware review finds the module satisfied by the KT2440 fruBKA locus and
      identifies the broader KEGG map as an overinclusive candidate source.
  - source_id: file:PSEPK/fruB/fruB-ai-review.yaml
    title: PSEPK fruB gene review
    statement: Q88PQ5 supplies the fused EI-HPr-EIIA(Fru) phosphorelay.
  - source_id: file:ECOLI/ptsI/ptsI-ai-review.yaml
    title: ECOLI ptsI gene review
    statement: P08839 supplies the general enzyme I PEP-protein phosphotransferase activity.
  - source_id: file:ECOLI/fruB/fruB-ai-review.yaml
    title: ECOLI fruB gene review
    statement: P69811 (FPr) supplies the HPr-like and EIIA(Fru) relay steps without an enzyme I region.
  - source_id: file:PSEPK/fruA/fruA-ai-review.yaml
    title: PSEPK fruA gene review
    statement: Q88PQ3 supplies the membrane EIIB-EIIC transport-phosphorylation step.
  - source_id: file:ECOLI/fruA/fruA-ai-review.yaml
    title: ECOLI fruA gene review
    statement: P20966 supplies the E. coli EIIB'BC transport-phosphorylation step.
  - source_id: file:PSEPK/fruK/fruK-ai-review.yaml
    title: PSEPK fruK gene review
    statement: Q88PQ4 supplies 1-phosphofructokinase activity.
  - source_id: file:ECOLI/fruK/fruK-ai-review.yaml
    title: ECOLI fruK gene review
    statement: P0AEW9 supplies 1-phosphofructokinase activity in E. coli.
module:
  id: fructose_pts_uptake_and_catabolism
  label: Bacterial fructose PTS uptake and entry into central carbon catabolism
  module_type: METABOLIC_PATHWAY
  context:
