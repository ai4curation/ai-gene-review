id: MODULE:riboflavin_biosynthesis
title: De novo riboflavin biosynthesis and flavin cofactor activation
description: >-
  De novo synthesis of riboflavin (vitamin B2) from GTP and ribulose
  5-phosphate, followed by conversion of riboflavin to the active flavin
  cofactors FMN and FAD, as found in bacteria, fungi and plants. The ring
  pathway has two converging branches. In the GTP-derived pyrimidine branch,
  GTP cyclohydrolase II opens the imidazole ring of GTP; the product then
  undergoes deamination of the pyrimidine ring and reduction of the ribosyl
  side chain, and the resulting phosphorylated intermediate is
  dephosphorylated. The order of deamination and reduction differs by lineage:
  bacteria deaminate first and then reduce, usually with one bifunctional RibD
  protein, whereas fungi reduce first and then deaminate, with two separate
  proteins. The ribulose-5-phosphate branch makes the four-carbon donor
  3,4-dihydroxy-2-butanone 4-phosphate. The two branches converge at lumazine
  synthase, and riboflavin synthase then forms riboflavin by a dismutation of
  two lumazine molecules. Riboflavin kinase converts riboflavin to FMN and FMN
  adenylyltransferase converts FMN to FAD. In many bacteria both activation
  steps are carried out by one bifunctional RibF protein, whereas eukaryotes
  use a monofunctional riboflavin kinase and a separate FAD synthase.
status: DRAFT
evidence:
  - source_id: YeastPathways:YEAST-RIBOSYN-PWY
    title: riboflavin, FMN and FAD biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Source pathway for the fungal variant. It lists RIB1 (GTP cyclohydrolase
      II), RIB7 (reduction of the ribosyl side chain), RIB2 (deamination), RIB3
      (DHBP synthase), RIB4 (lumazine synthase), RIB5 (riboflavin synthase),
      FMN1 (riboflavin kinase) and FAD1 (FAD synthetase), and states that
      reduction precedes deamination in yeast. All eight gene assignments are
      kept. The dephosphorylation of 5-amino-6-(5-phospho-D-ribitylamino)uracil
      (RIBOPHOSPHAT-RXN) and the YeastCyc deamination/reduction reactions in the
      bacterial order (RXN-10058, RXN-10057) have no assigned yeast gene. One
      YeastCyc citation (PMID 2437875) resolves to an unrelated clinical paper
      and was not used.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=YEAST-RIBOSYN-PWY
  - source_id: GO:0009231
    title: riboflavin biosynthetic process
    statement: >-
      GO biological-process term for de novo riboflavin biosynthesis; used as
      the primary process grounding for the ring-synthesis part of the module.
  - source_id: GO:0009398
    title: FMN biosynthetic process
    statement: >-
      GO biological-process term for phosphorylation of riboflavin to FMN,
      represented here as the first flavin-cofactor activation step.
  - source_id: GO:0006747
    title: FAD biosynthetic process
    statement: >-
      GO biological-process term for adenylylation of FMN to FAD, represented
      here as the terminal flavin-cofactor activation step.
  - source_id: GO:0043726
    title: 5-amino-6-(5-phosphoribitylamino)uracil phosphatase activity
    statement: >-
      GO molecular-function term for the required dephosphorylation between the
      reductase/deaminase product and the dephosphorylated lumazine synthase
      substrate.
  - source_id: KEGG:map00740
    title: Riboflavin metabolism
    statement: >-
      KEGG pathway context for riboflavin-ring synthesis and downstream FMN/FAD
      metabolism; species-specific map members need curator filtering because
      flavin reductases, flavin-derived cofactor enzymes, and unrelated hydrolases
      can appear in the same map.
  - source_id: PMID:9068650
    title: 'Biosynthesis of riboflavin: characterization of the bifunctional deaminase-reductase of Escherichia coli and Bacillus subtilis.'
    statement: >-
      E. coli RibD and B. subtilis RibG are bifunctional deaminase/reductase
      proteins, and their sequences are similar to S. cerevisiae RIB7.
    supporting_text: >-
      code for bifunctional proteins catalyzing the second and third steps in the
      biosynthesis of riboflavin, i.e., the deamination of
      2,5-diamino-6-ribosylamino-4(3H)-pyrimidinone 5'-phosphate (deaminase) and the
      subsequent reduction of the ribosyl side chain (reductase)
  - source_id: PMID:15466869
    title: Pseudouridylation at position 32 of mitochondrial and cytoplasmic tRNAs requires two distinct enzymes in Saccharomyces cerevisiae.
    statement: >-
      S. cerevisiae Rib2/Pus8p is a fused protein whose C-terminal domain is the
      riboflavin-pathway DRAP deaminase and whose N-terminal domain is a tRNA
      pseudouridine synthase; the protein is cytoplasmic.
    supporting_text: >-
      its C-terminal domain has a DRAP-deaminase
      activity required for riboflavin biogenesis in the cytoplasm, whereas its
      N-terminal domain carries the tRNA:Psi32-synthase activity
  - source_id: PMID:12595523
    title: Yeast dihydroxybutanone phosphate synthase, an enzyme of the riboflavin biosynthetic pathway, has a second unrelated function in expression of mitochondrial respiration.
    statement: >-
      RIB3 encodes DHBP synthase; most of the protein is cytosolic, with a small
      fraction in the mitochondrial intermembrane space.
  - source_id: PMID:7559556
    title: The Saccharomyces cerevisiae RIB4 gene codes for 6,7-dimethyl-8-ribityllumazine synthase involved in riboflavin biosynthesis. Molecular characterization of the gene and purification of the encoded protein.
    statement: RIB4 encodes lumazine synthase; its deletion causes riboflavin auxotrophy.
  - source_id: PMID:7814407
    title: Riboflavin biosynthesis in Saccharomyces cerevisiae. Cloning, characterization, and expression of the RIB5 gene encoding riboflavin synthase.
    statement: RIB5 encodes a monofunctional riboflavin synthase.
    supporting_text: >-
      Saccharomyces cerevisiae has a monofunctional riboflavin synthase that catalyzes
      the formation of riboflavin from 6,7-dimethyl-8-ribityllumazine.
  - source_id: PMID:10887197
    title: Molecular characterization of FMN1, the structural gene for the monofunctional flavokinase of Saccharomyces cerevisiae.
    statement: >-
      FMN1 encodes a monofunctional riboflavin kinase without FAD synthetase
      activity, found in microsomes and in the mitochondrial inner membrane.
    supporting_text: >-
      In contrast to bifunctional prokaryotic flavokinase/FAD synthetase
      enzymes, the yeast enzyme did not show accompanying FAD synthetase activity.
  - source_id: PMID:7799934
    title: Cloning and characterization of FAD1, the structural gene for flavin adenine dinucleotide synthetase of Saccharomyces cerevisiae.
    statement: >-
      FAD1 encodes the essential yeast FAD synthetase; wild-type mitochondria
      have no FAD synthetase activity, so FAD is made outside the mitochondrion.
  - source_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
    title: PSEPK UniProt metadata inventory
    statement: >-
      Local UniProt-derived inventory provides the Pseudomonas putida KT2440
      exemplar accessions and GO/EC metadata used to ground representative
      members in this module.
  - source_id: file:projects/P_PUTIDA/data/psepk_uniprot_metadata.tsv
    title: PSEPK UniProt functional metadata
    statement: >-
      The Q88Q93 record assigns both riboflavin kinase and FMN
      adenylyltransferase activities to the bifunctional KT2440 RibF protein.
  - source_id: file:modules/riboflavin_biosynthesis-deep-research-openscientist.md
    title: OpenScientist module research for riboflavin biosynthesis
    statement: >-
      Provider-generated module research supports the reusable bacterial pathway
      boundary from de novo riboflavin-ring synthesis through FMN/FAD activation
      and highlights cross-organism gene-name differences.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__riboflavin_biosynthesis__ppu00740-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00740 riboflavin satisfiability research
    statement: >-
      Provider-generated species/pathway research supports KT2440 pathway
      satisfiability, separates core rib genes from KEGG-map spillover, and
      flags ribAB-I/ribAB-II as DHBP/RibBX candidates rather than GTP
      cyclohydrolase II exemplars pending targeted gene review.
  - source_id: file:interpro/panther/PTHR23293/PTHR23293-paint.tsv
    title: PANTHER PAINT annotations for the eukaryotic FAD synthase family
    statement: >-
      PTN000591373 carries the GO:0003919 FMN adenylyltransferase assertion for
      the PTHR23293 FAD synthase lineage, including human FLAD1.
notes: >-
  The module deliberately separates riboflavin-ring synthesis from general
  flavoprotein use, FMN-dependent reductases, prenylated-FMN cofactor formation,
  and cobalamin lower-ligand biosynthesis. Those processes consume or transform
  flavins but are not required steps in de novo riboflavin formation. The
  downstream FMN/FAD activation step is included because bacterial RibF-family
  enzymes often connect riboflavin synthesis directly to active flavin-cofactor
  supply; animal-only uptake of dietary riboflavin is covered separately by
  modules/flavin_cofactor_biosynthesis.yaml and
  modules/riboflavin_uptake_and_cofactor_synthesis.yaml. Human RFK and FLAD1
  are included below only as cross-organism representatives of the shared
  activation activities, not as members of a de novo route. In the Pseudomonas
  putida KT2440 instantiation, OpenScientist flagged ribAB-I and ribAB-II as
  RibBX-like DHBP synthase candidates with apparently degenerate C-terminal
  GTP-CHII-fold domains, so this module does not use them as GTP cyclohydrolase
  II exemplars. Fungal alignment (YeastPathways YEAST-RIBOSYN-PWY and the
  PomBase model 6796b94c00000731): the deamination/reduction pair is modelled as
  an order variant set. GO has no separate terms for the fungal-order
  substrates: GO:0043723 (deamination of the ribityl intermediate) was made
  obsolete and merged into GO:0008835, and GO:0008703 is defined on the
  bacterial-order (deaminated) substrate although the fungal reductase acts on
  the non-deaminated intermediate (EC 1.1.1.302 rather than EC 1.1.1.193). The
  fungal annotons therefore use GO:0008835 and GO:0008703, as SGD and PomBase
  do, and record the substrate difference in the function description. The
  fungal deaminase domain is fused to unrelated N-terminal domains (a tRNA
  pseudouridine synthase in S. cerevisiae RIB2, a lysine methyltransferase in
  S. pombe rib2), so no single PANTHER family is asserted for it. GO-CAM notes:
  the SGD model types RIB2 (RXN3O-164) only with the root term GO:0003674 and
  places all activities in cytosol; the PomBase model also includes urg1 as a
  second GTP cyclohydrolase II. urg1 is a uracil-regulated protein in a
  different PANTHER family (PTHR47259) and is not used here as a riboflavin
  pathway exemplar; the PomBase model's mitochondrial FAD transporter flx1 lies
  outside this module boundary.
module:
  id: riboflavin_biosynthesis
  label: De novo riboflavin biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: riboflavin biosynthetic process
      term:
        id: GO:0009231
        label: riboflavin biosynthetic process
      description: De novo formation of riboflavin from GTP and ribulose 5-phosphate.
    - preferred_term: FMN biosynthetic process
      term:
        id: GO:0009398
        label: FMN biosynthetic process
      description: Phosphorylation of riboflavin to flavin mononucleotide.
    - preferred_term: FAD biosynthetic process
      term:
        id: GO:0006747
        label: FAD biosynthetic process
      description: Adenylylation of FMN to flavin adenine dinucleotide.
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          The ring-synthesis enzymes are soluble cytosolic proteins in bacteria
          and fungi. Yeast riboflavin kinase is also found in microsomes and the
          mitochondrial inner membrane (PMID:10887197).
  gocam_associations:
    - model: gomodel:YeastPathways_YEAST-RIBOSYN-PWY
      title: 'riboflavin, FMN and FAD biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD YeastPathways conversion for S. cerevisiae with eight cytosolic
        activities (RIB1, RIB7, RIB2, RIB3, RIB4, RIB5, FMN1, FAD1) and no
        causal edges. RIB2 is typed only with GO:0003674.
    - model: gomodel:6796b94c00000731
      title: riboflavin biosynthetic process (GO:0009231), FMN biosynthetic process (GO:0009398),  FAD biosynthetic process (GO:0006747)
      description: >-
        PomBase S. pombe model with rib1, rib2, rib7, rib3, rib4, rib5, fmn1
        and nad1, an unassigned phosphatase activity, a second GTP
        cyclohydrolase II (urg1) and the mitochondrial FAD transporter flx1.
  parts:
    - order: 1
      role: GTP-derived pyrimidine branch
      node:
        id: gtp_pyrimidine_branch
        label: GTP-derived pyrimidine branch
        module_type: METABOLIC_PATHWAY
        description: >-
          Converts GTP through the early pyrimidine intermediates that provide
          the nitrogen-containing portion of the riboflavin ring.
        parts:
          - order: 1
            role: GTP cyclohydrolase II
            node:
              id: gtp_cyclohydrolase_ii_step
              label: GTP to 2,5-diamino-6-ribosylamino-4(3H)-pyrimidinone 5'-phosphate
              module_type: REACTION
              annotons:
                - id: gtp_cyclohydrolase_ii_activity
                  label: "RibA/RIB1: GTP cyclohydrolase II"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: RibA GTP cyclohydrolase II family
                      family_terms:
                        - id: PANTHER:PTHR21327:SF29
                          label: GTP CYCLOHYDROLASE-2
                        - id: PANTHER:PTHR21327:SF18
                          label: 3,4-DIHYDROXY-2-BUTANONE 4-PHOSPHATE SYNTHASE
                        - id: PANTHER:PTHR21327:SF48
                          label: BIFUNCTIONAL RIBOFLAVIN BIOSYNTHESIS PROTEIN RIBA 1, CHLOROPLASTIC
                        - id: PANTHER:PTHR21327:SF39
                          label: BIFUNCTIONAL RIBOFLAVIN BIOSYNTHESIS PROTEIN RIBA 1, CHLOROPLASTIC-RELATED
                      representative_members:
                        - preferred_term: ribA (Pseudomonas putida KT2440)
                          term:
                            id: UniProtKB:Q88QH1
                            label: GTP cyclohydrolase-2
                        - preferred_term: RIB1 (Saccharomyces cerevisiae)
                          term:
                            id: UniProtKB:P38066
                            label: GTP cyclohydrolase-2
                          description: S. cerevisiae RIB1/YBL033C (PANTHER PTHR21327:SF29).
                        - preferred_term: rib1 (Schizosaccharomyces pombe)
                          term:
                            id: UniProtKB:Q9P7M9
                            label: Probable GTP cyclohydrolase-2
                          description: S. pombe rib1/SPAP27G11.09c (PANTHER PTHR21327:SF29).
                  function:
                    preferred_term: GTP cyclohydrolase II activity
                    term:
                      id: GO:0003935
                      label: GTP cyclohydrolase II activity
                    substrates:
                      - preferred_term: GTP
                    products:
                      - preferred_term: 2,5-diamino-6-ribosylamino-4(3H)-pyrimidinone 5'-phosphate
                    evidence:
                      - source_id: EC:3.5.4.25
                        statement: GTP cyclohydrolase II.
                  gocam_associations:
                    - model: gomodel:YeastPathways_YEAST-RIBOSYN-PWY
                      activity: gomodel:GTP-CYCLOHYDRO-II-RXN
                      title: 'riboflavin, FMN and FAD biosynthesis - imported from: Saccharomyces Genome Database'
