id: MODULE:bacterial_glycerol_uptake_catabolism
title: Bacterial glycerol uptake and catabolism through glycerol 3-phosphate
description: Bacterial glycerol uptake and conversion to dihydroxyacetone phosphate through a GlpF facilitator,
  ATP-dependent glycerol kinase and a quinone-linked GlpD-type glycerol-3-phosphate dehydrogenase. GlpF
  permits facilitated diffusion, while phosphorylation traps glycerol as sn-glycerol 3-phosphate. GlpD
  transfers electrons from this intermediate to a quinone acceptor. The route can supply respiratory metabolism
  under oxygenated conditions; the traditionally named aerobic E. coli GlpD also supports nitrate respiration
  without oxygen.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0019563
  title: glycerol catabolic process
  statement: GO:0019563 captures conversion of glycerol into metabolic intermediates.
- source_id: PMID:25827416
  title: The glycerol-dependent metabolic persistence of Pseudomonas putida KT2440 reflects the regulatory
    logic of the GlpR repressor.
  statement: A P. putida KT2440 study identifies GlpF-mediated uptake, GlpK phosphorylation, and ubiquinone-dependent
    GlpD oxidation as the KT2440 instance of the route.
- source_id: file:PSEPK/glpF/glpF-ai-review.yaml
  title: PSEPK glpF gene review
  statement: Q88NX7 is curated as a plasma-membrane glycerol channel rather than an energy-coupled transporter.
- source_id: file:PSEPK/glpK/glpK-ai-review.yaml
  title: PSEPK glpK gene review
  statement: Q88NX8 is the ATP-dependent glycerol kinase performing the first intracellular reaction.
- source_id: file:PSEPK/glpD/glpD-ai-review.yaml
  title: PSEPK glpD gene review
  statement: Q88NY0 is curated as the FAD-dependent glycerol-3-phosphate:quinone dehydrogenase.
- source_id: file:ECOLI/glpF/glpF-ai-review.yaml
  title: ECOLI glpF gene review
  statement: P0AER0 is curated as the E. coli inner-membrane glycerol channel that conducts passive glycerol
    uptake.
- source_id: file:ECOLI/glpK/glpK-ai-review.yaml
  title: ECOLI glpK gene review
  statement: P0A6F3 is curated as the ATP-dependent glycerol kinase that traps imported glycerol as sn-glycerol
    3-phosphate.
- source_id: file:ECOLI/glpD/glpD-ai-review.yaml
  title: ECOLI glpD gene review
  statement: P13035 is curated as the aerobic glycerol-3-phosphate:quinone dehydrogenase that feeds the
    respiratory quinone pool.
- source_id: file:interpro/panther/PTHR43829/PTHR43829-review.yaml
  title: PTHR43829 aquaglyceroporin family review
  statement: Glycerol channel activity is assessed as family-wide from the PAINT root node PTN000440994,
    with LarD as the documented loss.
- source_id: file:interpro/panther/PTHR10196/PTHR10196-review.yaml
  title: PTHR10196 FGGY sugar kinase family review
  statement: Glycerol kinase activity is assessed as SUBFAMILY_ONLY for SF69, which holds E. coli and
    P. putida GlpK.
- source_id: file:interpro/panther/PTHR11985/PTHR11985-review.yaml
  title: PTHR11985 FAD-dependent glycerol-3-phosphate dehydrogenase family review
  statement: The family contains quinone-linked dehydrogenases, GlpA complex subunits and oxygen-dependent
    oxidases. Bacillus GlpD is SF35 while the E. coli/Pseudomonas exemplars are SF15; activity-qualified
    selection avoids treating either subfamily name as substrate-acceptor evidence.
notes: 'The Bacteria context describes this reaction-defined implementation where present, not a universal
  bacterial pathway. E. coli and P. putida are the original exemplars; Bacillus subtilis adds a distinct
  bacterial lineage, with quinone specificity supported by reviewed UniProt/PAINT synthesis rather than
  a purified Bacillus acceptor assay. Experimental strains and assay limits are documented in the gene
  reviews. GlpD is an enzyme designation, not a rule that oxygen is its direct substrate or that all homologs
  have the same membrane topology. E. coli active GlpD is monotopic on the cytoplasmic face of the plasma
  membrane; Pseudomonas topology is inferred, and Bacillus membrane association remains under review.
  The separate GlpABC complex, O2/peroxide-producing GlpO enzymes, glycerol dehydrogenase/DhaKLM route,
  alternative uptake systems, phospholipid-derived glycerol phosphate and downstream quinol reoxidation
  lie outside this model. GlpF is required for this defined channel route; other routes or passive diffusion
  can explain glycerol utilization when GlpF is absent. GlpR and PTS regulatory interactions are supporting
  context, not required chemical steps. Family labels cannot establish electron-acceptor specificity:
  SF35 contains Bacillus GlpD, anaerobic GlpA and oxidases. PTHR11985 is consequently qualified by the
  quinone activity; the same-family oxidase and isolated GlpA are negative controls, not substitute complete
  GlpD witnesses. PTHR10196:SF69 and PTHR43829:SF9 membership also require the stated activities. No new
  PAINT node placement is inferred. The 2019 Pseudomonas review uses ubiquinol-dependent wording at one
  point; primary enzyme and pathway evidence support quinone as oxidized acceptor and quinol as product.'
