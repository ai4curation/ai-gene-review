id: MODULE:bacterial_glycerol_uptake_catabolism
title: Bacterial glycerol uptake and catabolism through glycerol 3-phosphate
description: >-
  A reusable bacterial module for channel-mediated glycerol uptake followed by
  conversion to dihydroxyacetone phosphate. GlpF facilitates glycerol movement
  across the cytoplasmic membrane, GlpK traps intracellular glycerol as
  sn-glycerol 3-phosphate, and FAD-dependent GlpD oxidizes that intermediate to
  dihydroxyacetone phosphate while reducing the respiratory quinone pool.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0019563
    title: glycerol catabolic process
    statement: >-
      GO:0019563 captures conversion of glycerol into metabolic intermediates.
  - source_id: PMID:25827416
    title: >-
      The glycerol-dependent metabolic persistence of Pseudomonas putida
      KT2440 reflects the regulatory logic of the GlpR repressor.
    statement: >-
      The organism-specific study identifies GlpF-mediated uptake, GlpK
      phosphorylation, and ubiquinone-dependent GlpD oxidation in KT2440.
  - source_id: file:PSEPK/glpF/glpF-ai-review.yaml
    title: PSEPK glpF gene review
    statement: >-
      Q88NX7 is curated as a plasma-membrane glycerol channel rather than an
      energy-coupled transporter.
  - source_id: file:PSEPK/glpK/glpK-ai-review.yaml
    title: PSEPK glpK gene review
    statement: >-
      Q88NX8 is the ATP-dependent glycerol kinase performing the first
      intracellular reaction.
  - source_id: file:PSEPK/glpD/glpD-ai-review.yaml
    title: PSEPK glpD gene review
    statement: >-
      Q88NY0 is curated as the FAD-dependent
      glycerol-3-phosphate:quinone dehydrogenase.
notes: >-
  The module starts with extracellular glycerol and ends with
  dihydroxyacetone phosphate plus reduced quinone. Passive channel transport
  does not itself consume ATP; phosphorylation by GlpK provides metabolic
  trapping. Alternative active glycerol transporters, glycerol dehydrogenase
  routes, phospholipid-derived glycerol 3-phosphate, quinol reoxidation, and
  downstream glycolysis are outside the boundary. PSEPK-specific transcription
  and regulation at the glp locus are supporting context, not required parts.
module:
  id: bacterial_glycerol_uptake_catabolism
  label: Bacterial glycerol uptake and catabolism
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: glycerol catabolic process
