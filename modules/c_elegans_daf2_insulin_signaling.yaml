id: MODULE:c_elegans_daf2_insulin_signaling
title: DAF-2 insulin/IGF-1-like signaling to DAF-16/FOXO in Caenorhabditis elegans
description: >-
  In Caenorhabditis elegans a large family of insulin-like peptides, secreted
  mainly by neurons, acts through a single insulin/IGF-1 receptor tyrosine
  kinase, DAF-2. Active DAF-2 signals through the class I PI3K catalytic
  subunit AGE-1 to generate phosphatidylinositol 3,4,5-trisphosphate (PIP3),
  which the PTEN lipid phosphatase DAF-18 removes. PIP3 supports activation of
  the 3-phosphoinositide-dependent kinase PDK-1, which in turn activates a
  kinase complex of AKT-1, AKT-2 and SGK-1. These kinases phosphorylate the
  FOXO transcription factor DAF-16, and phosphorylated DAF-16 is bound by the
  14-3-3 protein FTT-2 and held in the cytoplasm. When ligand input falls, as
  in poor food or high pheromone conditions, or when the pathway is
  genetically reduced, DAF-16 enters the nucleus and regulates a broad
  transcriptional program that includes stress-resistance genes such as the
  mitochondrial manganese superoxide dismutase sod-3, as well as antimicrobial
  and metabolic genes. The pathway controls the dauer diapause decision,
  adult lifespan, stress resistance and fat storage, and DAF-16 is its major
  output.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:24671950
    title: A Caenorhabditis elegans developmental decision requires insulin signaling-mediated neuron-intestine communication.
    statement: >-
      Summary of the canonical cascade: one insulin-like receptor, a
      PI3K/PDK/AKT kinase cascade, and phosphorylation and cytoplasmic
      retention of DAF-16.
    supporting_text: >-
      DAF-2 activation initiates the phosphorylation of a kinase cascade,
      composed of PI3K/AGE-1 (Morris et al., 1996), PDK/PDK-1 and AKTs (AKT-1
      and AKT-2) (Paradis and Ruvkun, 1998; Paradis et al., 1999), which leads
      to the phosphorylation and cytoplasmic retention of DAF-16
  - source_id: PMID:24671950
    title: A Caenorhabditis elegans developmental decision requires insulin signaling-mediated neuron-intestine communication.
    statement: DAF-2 is the only insulin-like peptide receptor in C. elegans.
    supporting_text: >-
      C. elegans has a single ILP receptor (InR), DAF-2
  - source_id: PMID:11747821
    title: Regulation of C. elegans DAF-16 and its human ortholog FKHRL1 by the daf-2 insulin-like signaling pathway.
    statement: >-
      Removing the AKT consensus sites from DAF-16 is enough to cause dauer
      arrest, so DAF-16 is the major output of the pathway.
    supporting_text: >-
      We show that the absence of AKT consensus sites on DAF-16 is sufficient
      to cause dauer arrest in daf-2(+) animals, proving that daf-16 is the
      major output of insulin signaling in C. elegans.
  - source_id: PMID:9885576
    title: The C. elegans PTEN homolog, DAF-18, acts in the insulin receptor-like metabolic signaling pathway.
    statement: Linear order of the core pathway from DAF-2 to DAF-16.
    supporting_text: >-
      An insulin-like signaling pathway, from the DAF-2 receptor, the AGE-1
      phosphoinositide 3-kinase, and the AKT-1/AKT-2 serine/threonine kinases
      to the DAF-16 Fork head transcription factor, regulates the metabolism,
      development, and life span of Caenorhabditis elegans.
  - source_id: PMID:16777605
    title: C. elegans SIR-2.1 interacts with 14-3-3 proteins to activate DAF-16 and extend life span.
    statement: >-
      SIR-2.1 and 14-3-3 proteins activate DAF-16 in a stress-dependent route
      that runs in parallel to insulin-like signaling. SIR-2.1 is therefore a
      DAF-16 modulator outside this module, not a pathway member.
    supporting_text: >-
      We propose the existence of a stress-dependent pathway in which SIR-2.1
      and 14-3-3 act in parallel to the insulin-like pathway to activate DAF-16
      and extend life span.
  - source_id: PMID:15574588
    title: The AMP-activated protein kinase AAK-2 links energy levels and insulin-like signals to lifespan in C. elegans.
    statement: >-
      AMPK (AAK-2) is needed for the lifespan extension caused by reduced
      insulin-like signaling. It is an energy-sensing modulator of the output,
      not a step in the receptor-to-DAF-16 relay.
    supporting_text: >-
      either an environmental stressor that increases the AMP:ATP ratio or
      mutations that lower insulin-like signaling extend lifespan in an
      aak-2-dependent manner
  - source_id: file:genes/worm/daf-2/daf-2-ai-review.yaml
    title: worm daf-2 gene review
    statement: >-
      The daf-2 review accepts transmembrane receptor protein tyrosine kinase
      activity in the insulin receptor signaling pathway as the DAF-2 core
      function.
  - source_id: file:genes/worm/daf-16/daf-16-ai-review.yaml
    title: worm daf-16 gene review
    statement: >-
      The daf-16 review accepts RNA polymerase II-specific DNA-binding
      transcription factor activity in the nucleus as the DAF-16 core
      function, deployed in lifespan, dauer, oxidative stress and immunity.
  - source_id: file:genes/worm/sod-3/sod-3-ai-review.yaml
    title: worm sod-3 gene review
    statement: >-
      The sod-3 review accepts mitochondrial matrix superoxide dismutase
      activity and treats sod-3 as a canonical, low-basal, DAF-16-inducible
      target gene.
  - source_id: file:modules/insulin_receptor_signaling.yaml
    title: Insulin receptor signaling pathway module
    statement: >-
      Taxon-neutral insulin receptor module whose receptor, PI3K and AKT/FOXO
      parts this nematode module instantiates.
  - source_id: file:modules/pi3k_akt_mtor.yaml
    title: Generic PI3K-AKT-mTOR signaling module
    statement: >-
      Reusable PI3K-PIP3-PDK1-AKT axis. This module instantiates its PI3K,
      PIP3/PDK1, AKT activation and PTEN negative-regulation parts, but not its
      mTORC1 branch.
notes: >-
  Boundary. A concrete C. elegans signaling module running from insulin-like
  peptide ligands at DAF-2 to DAF-16-dependent transcription. The root parts
  are the ligand family, the receptor, the AGE-1 PI3K step, the opposing
  DAF-18 PTEN step, PDK-1, the AKT-1/AKT-2/SGK-1 kinase step, FTT-2
  cytoplasmic retention of DAF-16, DAF-16 transcription, and one
  representative DAF-16 target (SOD-3). SOD-3 is included as an example of
  the DAF-16 output program, not as a signaling component. Its causal
  contribution to the daf-2 longevity phenotype is doubtful (see
  knowledge_gaps), so it should be read as a well-characterized readout.

  Relation to generic modules. MODULE:insulin_receptor_signaling models
  receptor activation, IRS docking and PI3K recruitment, then AKT/FOXO
  output. MODULE:pi3k_akt_mtor models PI3K, PIP3/PDK1, AKT activation, an
  mTORC1 branch and PTEN-type negative regulation. This module is a worm
  instance of the shared trunk. It omits the IRS adaptor step: the worm IRS
  ortholog IST-1 and the p50/p55 PI3K adaptor AAP-1 potentiate DAF-2
  signaling but are not required under most conditions (PMID:12393910), and
  neither has a gene review yet. AAP-1 is mentioned as the AGE-1 partner in
  the PI3K complex but is not modeled as a separate part. The module also
  omits the mTORC1 branch. It adds SGK-1 as a co-equal effector kinase with
  the AKTs and an explicit 14-3-3 retention step.

  Modulators kept outside the module. SIR-2.1 (Q21921) binds the 14-3-3
  proteins and activates DAF-16 in a stress-dependent route that runs in
  parallel to insulin-like signaling and is not needed for daf-2 lifespan
  regulation (PMID:16777605). AAK-2/AMPK (Q95ZQ4) is required for the
  lifespan extension of reduced insulin signaling (PMID:15574588), but it is
  an energy-sensing input to longevity, not a step between DAF-2 and DAF-16.
  Both are cited as context in the top-level evidence and are not modeled as
  parts. The other known DAF-16 inputs (germline signals, JNK-1, TGF-beta
  DAF-7 at the dauer decision) and DAF-2 outputs other than DAF-16 (such as
  SKN-1 inhibition) are also outside this boundary.

  Ligands. C. elegans encodes about 40 insulin-like peptides with agonist and
  antagonist activities and extensive redundancy. They are represented as a
  family role, with INS-6 and DAF-28 as representative agonists implicated in
  the neuron-to-intestine dauer decision (PMID:24671950). Both
  representatives have gene reviews with hormone activity (GO:0005179) as
  their core function. The daf-28(sa191) allele is a dominant-negative
  processing mutant thought to poison other insulins, so its dauer phenotype
  reports on agonist ILP signaling as a whole rather than on DAF-28 alone
  (PMID:12654727).

  Grounding. Every grounded protein has a C. elegans gene review, and each
  annoton function matches the core molecular function of that review:
  INS-6 P56174 and DAF-28 Q9NEK7 (hormone activity; Q9NEK7 is an unreviewed
  TrEMBL entry), DAF-2 Q968Y9, AGE-1 Q94125, DAF-18 G5EE01, PDK-1 Q9Y1J3,
  AKT-1 Q17941, AKT-2 Q9XTG7, SGK-1 Q2PJ68, FTT-2 Q20655, DAF-16 O16850 and
  SOD-3 P41977. The AGE-1 MF is the class I PI3K activity (GO:0046934), as in
  the age-1 review: p110 homology, the AAP-1 partnership and the near-absence
  of PIP3 in age-1-null animals (PMID:23543623) support it, while the
  broader GOA GO:0016303 rows are kept there as non-core. The PDK-1 MF is
  3-phosphoinositide-dependent protein kinase activity (GO:0004676), as in
  the pdk-1 review: UniProt cross-references a PDK1-type PH domain on this
  entry (InterPro IPR033931, Pfam PF14593, SMART SM00233), and the
  phospholipid-independent PIAK form is defined by lacking that PH domain
  (PMID:11274160). GOA carries only the parent GO:0004674.
  DAF-18 also has protein phosphatase activity toward the VAB-1 Eph receptor
  (PMID:19853560), and SGK-1 is also the main effector of TORC2, acting
  through PQM-1 independently of DAF-16 (PMID:27401555). Those roles are
  outside this module and are recorded in the annoton notes only.
module:
  id: c_elegans_daf2_insulin_signaling
  label: DAF-2 insulin/IGF-1-like signaling to DAF-16 in C. elegans
  module_type: SIGNALING_PATHWAY
  description: >-
    Insulin-like peptides activate DAF-2, which signals through AGE-1 PI3K
    (opposed by DAF-18 PTEN), PDK-1 and AKT-1/AKT-2/SGK-1 to phosphorylate
    DAF-16/FOXO and hold it in the cytoplasm with FTT-2. Reduced signaling
    lets DAF-16 enter the nucleus and induce targets such as sod-3.
  concepts:
    - preferred_term: insulin receptor signaling pathway
      term:
        id: GO:0008286
        label: insulin receptor signaling pathway
    - preferred_term: dauer larval development
      term:
        id: GO:0040024
        label: dauer larval development
      description: >-
        Developmental process controlled by the module. Reduced signaling
        causes DAF-16-dependent dauer arrest.
    - preferred_term: determination of adult lifespan
      term:
        id: GO:0008340
        label: determination of adult lifespan
      description: >-
        Physiological process controlled by the module. Reduced signaling
        extends lifespan in a daf-16-dependent manner.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    conditions:
      - preferred_term: food availability and dauer pheromone levels
  parts:
    - order: 1
      role: insulin-like peptide ligands
      node:
        id: ilp_ligands
        label: Insulin-like peptide ligands of DAF-2
        module_type: MOLECULAR_FUNCTION
        description: >-
          A large, partly redundant family of insulin-like peptides, expressed
          mainly in neurons, that act on DAF-2 as agonists or antagonists.
        annotons:
          - id: ilp_hormone
            label: insulin-like peptide (agonist) acting on DAF-2
            participant:
              selector_type: FAMILY
              family:
                preferred_term: C. elegans insulin-like peptide (INS) family
                representative_members:
                  - preferred_term: INS-6
                    term:
                      id: UniProtKB:P56174
                      label: Probable insulin-like peptide beta-type 5
                  - preferred_term: DAF-28
                    term:
                      id: UniProtKB:Q9NEK7
                      label: Uncharacterized protein
            function:
              preferred_term: hormone activity
              term:
                id: GO:0005179
                label: hormone activity
              description: >-
                Agonist peptides such as INS-6 and DAF-28 promote DAF-2
                signaling. Other family members (for example INS-1) antagonize
                it. Hormone activity is the core MF in both the ins-6 and
                daf-28 gene reviews.
            processes:
              - preferred_term: insulin receptor signaling pathway
                term:
                  id: GO:0008286
                  label: insulin receptor signaling pathway
              - preferred_term: negative regulation of dauer entry
                term:
                  id: GO:1905910
                  label: negative regulation of dauer entry
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Secreted ligand input. Neuronal ILPs signal to DAF-2 in other
              tissues, including the intestine.
            evidence:
              - source_id: PMID:11274053
                title: Regulation of DAF-2 receptor signaling by human insulin and ins-1, a member of the unusually large and diverse C. elegans insulin gene family.
                statement: The ins genes are a large family expressed mainly in neurons.
                supporting_text: >-
                  The ins genes are primarily expressed in neurons, including
                  sensory neurons, a subset of which are required for
                  reproductive development.
              - source_id: PMID:24671950
                title: A Caenorhabditis elegans developmental decision requires insulin signaling-mediated neuron-intestine communication.
                statement: >-
                  INS-4/INS-6 behave as agonists and INS-1/INS-18 as antagonists
                  of DAF-2 in the dauer decision.
                supporting_text: >-
                  INS-4/INS-6 and INS-1/INS-18 are therefore likely to be among
                  the agonistic and antagonistic DAF-2 ligands that suppress
                  and activate DAF-16, respectively, during dauer formation.
              - source_id: PMID:12654727
                title: daf-28 encodes a C. elegans insulin superfamily member that is regulated by environmental cues and acts in the DAF-2 signaling pathway.
                statement: >-
                  The dauer-arrest allele daf-28(sa191) is dominant negative
                  and likely interferes with other insulins as well.
                supporting_text: >-
                  This DAF-28 mutant is likely to be poisonous to wild-type
                  DAF-28 and other insulins.
            notes: >-
              daf-28(sa191) phenotypes report on agonist ILP signaling as a
              whole, not on DAF-28 alone. DAF-28 has the larger role in
              preventing dauer entry and INS-6 the larger role in promoting
              dauer exit.
    - order: 2
      role: insulin/IGF-1 receptor tyrosine kinase
      node:
        id: daf2_receptor
        label: DAF-2 receptor activation
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: daf2_rtk
            label: DAF-2 insulin/IGF-1 receptor tyrosine kinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DAF-2
                term:
                  id: UniProtKB:Q968Y9
                  label: Insulin-like receptor
            function:
              preferred_term: transmembrane receptor protein tyrosine kinase activity
              term:
                id: GO:0004714
                label: transmembrane receptor protein tyrosine kinase activity
            processes:
              - preferred_term: insulin receptor signaling pathway
                term:
                  id: GO:0008286
                  label: insulin receptor signaling pathway
              - preferred_term: negative regulation of dauer entry
                term:
                  id: GO:1905910
                  label: negative regulation of dauer entry
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Sole insulin-like receptor. Its activity prevents dauer arrest
              and shortens lifespan by keeping DAF-16 inactive.
            evidence:
              - source_id: PMID:9252323
                title: daf-2, an insulin receptor-like gene that regulates longevity and diapause in Caenorhabditis elegans.
                statement: daf-2 encodes an insulin receptor family member that regulates diapause and lifespan.
                supporting_text: >-
                  daf-2, a key gene in the genetic pathway that mediates this
                  endocrine signaling, encodes an insulin receptor family
                  member.
    - order: 3
      role: PI3K generation of PIP3
      node:
        id: age1_pi3k
        label: AGE-1 class I PI3K step
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: age1_kinase
            label: AGE-1 PI3K catalytic subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: AGE-1
                term:
                  id: UniProtKB:Q94125
                  label: Phosphatidylinositol 3-kinase age-1
            function:
              preferred_term: 1-phosphatidylinositol-4,5-bisphosphate 3-kinase activity
              term:
                id: GO:0046934
                label: 1-phosphatidylinositol-4,5-bisphosphate 3-kinase activity
              description: >-
                Class I PI3K activity, the core MF of the age-1 review. It
                rests on p110 homology, the AAP-1 regulatory-subunit
                partnership and the loss of PIP3 in age-1-null animals.
            processes:
              - preferred_term: insulin receptor signaling pathway
                term:
                  id: GO:0008286
                  label: insulin receptor signaling pathway
              - preferred_term: phosphatidylinositol 3-kinase/protein kinase B signal transduction
                term:
                  id: GO:0043491
                  label: phosphatidylinositol 3-kinase/protein kinase B signal transduction
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Lipid kinase downstream of DAF-2 that produces the PIP3 second
              messenger needed for PDK-1/AKT activation. It acts as the
              catalytic subunit of a PI3K complex with the p50/p55 adaptor
              AAP-1.
            evidence:
              - source_id: PMID:8700226
                title: A phosphatidylinositol-3-OH kinase family member regulating longevity and diapause in Caenorhabditis elegans.
                statement: age-1 encodes a PI3K catalytic subunit homolog that controls lifespan and dauer.
                supporting_text: >-
                  age-1 encodes a homologue of mammalian
                  phosphatidylinositol-3-OH kinase (PI(3)K) catalytic subunits.
              - source_id: PMID:23543623
                title: Extreme Depletion of PIP3 Accompanies the Increased Life Span and Stress Tolerance of PI3K-null C. elegans Mutants.
                statement: PIP3 is nearly absent in age-1-null animals.
                supporting_text: >-
                  PIP3 is significantly reduced in first-generation age-1(mg44)
                  homozygotes, and is below detectable limits in their
                  second-generation progeny
    - order: 4
      role: PTEN opposition of PIP3 signaling
      node:
        id: daf18_pten
        label: DAF-18 PTEN removal of PIP3
        module_type: REGULATORY_STEP
        annotons:
          - id: daf18_phosphatase
            label: DAF-18 PIP3 3-phosphatase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DAF-18
                term:
                  id: UniProtKB:G5EE01
                  label: >-
                    Phosphatidylinositol 3,4,5-trisphosphate 3-phosphatase and
                    dual-specificity protein phosphatase daf-18
            function:
              preferred_term: phosphatidylinositol-3,4,5-trisphosphate 3-phosphatase activity
              term:
                id: GO:0016314
                label: phosphatidylinositol-3,4,5-trisphosphate 3-phosphatase activity
            processes:
              - preferred_term: negative regulation of insulin receptor signaling pathway
                term:
                  id: GO:0046627
                  label: negative regulation of insulin receptor signaling pathway
              - preferred_term: negative regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction
                term:
                  id: GO:0051898
                  label: negative regulation of phosphatidylinositol 3-kinase/protein kinase B signal transduction
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Negative regulator acting between AGE-1 and the AKT kinases,
              most likely by lowering PIP3 levels.
            evidence:
              - source_id: PMID:9885576
                title: The C. elegans PTEN homolog, DAF-18, acts in the insulin receptor-like metabolic signaling pathway.
                statement: daf-18 suppression of age-1 needs AKT-1/AKT-2, placing DAF-18 between AGE-1 and the AKTs.
                supporting_text: >-
                  The suppression of age-1 mutations by a daf-18 mutation
                  depends on AKT-1/AKT-2 signaling, showing that DAF-18 acts
                  between AGE-1 and the AKT input to DAF-16 transcriptional
                  regulation.
              - source_id: PMID:9885576
                title: The C. elegans PTEN homolog, DAF-18, acts in the insulin receptor-like metabolic signaling pathway.
                statement: The proposed mechanism is lowering PIP3 to limit AKT activation.
                supporting_text: >-
                  DAF-18 PTEN may normally limit AKT-1 and AKT-2 activation by
                  decreasing PIP3 levels.
              - source_id: PMID:19853560
                title: A role for C. elegans Eph RTK signaling in PTEN regulation.
                statement: >-
                  DAF-18 also acts as a protein phosphatase against the VAB-1
                  Eph receptor, a role outside this module.
                supporting_text: >-
                  We also present evidence that DAF-18 has protein phosphatase
                  activity to antagonize VAB-1 action.
            notes: >-
              DAF-18 is not insulin-pathway-exclusive. The daf-18 review keeps
              protein tyrosine phosphatase activity (GO:0004725, toward VAB-1)
              as a second core function, which this module does not model.
    - order: 5
      role: PDK1 activation of AGC kinases
      node:
        id: pdk1_step
        label: PDK-1 transduction of PI3K signals
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: pdk1_kinase
            label: PDK-1 3-phosphoinositide-dependent protein kinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PDK-1
                term:
                  id: UniProtKB:Q9Y1J3
                  label: 3-phosphoinositide-dependent protein kinase 1
            function:
              preferred_term: 3-phosphoinositide-dependent protein kinase activity
              term:
                id: GO:0004676
                label: 3-phosphoinositide-dependent protein kinase activity
              description: >-
                Follows the pdk-1 review core function. PDK-1 carries a
                PDK1-type PH domain, which the PH-less PIAK form lacks
                (PMID:11274160). See module notes.
              targets:
                - preferred_term: AKT-1, AKT-2 and SGK-1
            processes:
              - preferred_term: insulin receptor signaling pathway
                term:
                  id: GO:0008286
                  label: insulin receptor signaling pathway
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Necessary and sufficient to pass AGE-1 PI3K signals on to
              AKT-1/AKT-2, and required for SGK-1 activation.
            evidence:
              - source_id: PMID:10364160
                title: A PDK1 homolog is necessary and sufficient to transduce AGE-1 PI3 kinase signals that regulate diapause in Caenorhabditis elegans.
                statement: The major PDK-1 function is to transduce AGE-1 signals to AKT-1 and AKT-2.
                supporting_text: >-
                  This indicates that the major function of C. elegans PDK1 is
                  to transduce signals from AGE-1 to AKT-1 and AKT-2.
              - source_id: PMID:11274160
                title: Caenorhabditis elegans PIAK, a phospholipid-independent kinase that activates the AKT/PKB survival kinase.
                statement: PDK-1 has the phospholipid-binding PH domain that the PIAK form lacks.
                supporting_text: >-
                  PIAK is highly homologous to C. elegans and mammalian PDK 1
                  with the exception that the novel kinase lacks a phospholipid
                  binding pleckstrin homology domain.
    - order: 6
      role: AKT/SGK phosphorylation of DAF-16
      node:
        id: akt_sgk_kinases
        label: AKT-1/AKT-2/SGK-1 kinase complex
        module_type: MOLECULAR_FUNCTION
        description: >-
          AKT-1, AKT-2 and SGK-1 form a protein complex, depend on PDK-1, and
          can each phosphorylate DAF-16 directly. AKT-1/AKT-2 matter more for
          the dauer decision, SGK-1 more for development, stress resistance and
          lifespan.
        annotons:
          - id: akt1_kinase
            label: AKT-1 protein kinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: AKT-1
                term:
                  id: UniProtKB:Q17941
                  label: Serine/threonine-protein kinase akt-1
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: DAF-16
                  term:
                    id: UniProtKB:O16850
                    label: Forkhead box protein O
            processes:
              - preferred_term: insulin receptor signaling pathway
                term:
                  id: GO:0008286
                  label: insulin receptor signaling pathway
              - preferred_term: negative regulation of protein localization to nucleus
                term:
                  id: GO:1900181
                  label: negative regulation of protein localization to nucleus
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Phosphorylates DAF-16 and keeps it out of the nucleus. Its PH
              domain binds PIP3 at the plasma membrane, where PDK-1 activates
              it.
            notes: >-
              The akt-1 review has two core MFs, protein serine/threonine
              kinase activity and phosphatidylinositol-3,4,5-trisphosphate
              binding (GO:0005547). This annoton carries the kinase activity
              that acts on DAF-16. PIP3 binding is the PH-domain step that
              couples it to AGE-1 output.
            evidence:
              - source_id: PMID:9716402
                title: Caenorhabditis elegans Akt/PKB transduces insulin receptor-like signals from AGE-1 PI3 kinase to the DAF-16 transcription factor.
                statement: AKT-1 and AKT-2 act mainly to antagonize DAF-16.
                supporting_text: >-
