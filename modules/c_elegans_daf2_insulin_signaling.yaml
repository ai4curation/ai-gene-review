knowledge_gaps:
  - gap_statement: >-
      The DAF-2 pathway has outputs to DAF-16 that do not run through the
      AKT/SGK phosphorylation sites, and their nature is unknown.
    boundary: >-
      DAF-16 lacking the AKT consensus sites accumulates in nuclei but has
      little effect on lifespan. Genetic data also point to a DAF-2-to-DAF-16
      route that does not need AKT-1, AKT-2 or SGK-1.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Nuclear localization alone does not explain DAF-16 activation, so the
      cytoplasmic-retention model in this module is incomplete.
    resolution: >-
      Identify DAF-2-dependent DAF-16 modifications other than the AKT sites
      (phosphoproteomics of daf-2 vs wild type in akt-1;akt-2;sgk-1 mutant
      backgrounds) and test them with site mutants in vivo.
    provenance:
      - reference_id: PMID:11381260
        supporting_text: >-
          Disrupting Akt-consensus phosphorylation sites in DAF-16 causes
          nuclear accumulation in wild-type animals, but, surprisingly, has
          little effect on lifespan. Thus the DAF-2 pathway must have
          additional outputs.
      - reference_id: PMID:15068796
        supporting_text: >-
          Our data also suggest the existence of a second pathway from DAF-2
          to DAF-16 that does not depend on AKT-1, AKT-2, and SGK-1.
  - gap_statement: >-
      Which of the roughly 40 insulin-like peptides bind DAF-2 directly, and
      what decides whether a given peptide acts as an agonist or an
      antagonist, is unknown.
    boundary: >-
      Agonist and antagonist roles are inferred from overexpression and
      deletion genetics. Direct DAF-2 binding has not been shown for most
      peptides.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines how the ligand family encodes environmental information
      into DAF-2 activity.
    resolution: >-
      Receptor-binding and receptor-activation assays with purified ILPs on
      DAF-2 ectodomain or DAF-2-expressing cells.
    provenance:
      - reference_id: PMID:11274053
        supporting_text: >-
          Because we expected the DAF-2 ligands, like the insulin and IGF-I
          ligands, to act as receptor agonists, it was surprising that
          overexpression of ins-1 antagonizes rather than activates DAF-2
          signaling.
  - gap_statement: >-
      Whether induction of sod-3 by DAF-16 contributes causally to the
      longevity of daf-2 mutants, or is mainly a readout of DAF-16 activity,
      is unresolved.
    boundary: >-
      Removing both mitochondrial MnSODs did not suppress daf-2 longevity in
      the studies summarized by PMID:23895727.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Decides whether SOD-3 is a functional effector or only a marker of this module's output.
    resolution: >-
      Tissue-specific sod-3 restoration or deletion in daf-2 mutants with
      lifespan and oxidative-stress endpoints.
    provenance:
      - reference_id: PMID:23895727
        supporting_text: >-
          These studies suggested that upregulation of sod-3 (and presumably
          decreased superoxide damage to mitochondria) did not significantly
          contribute to the long life span of daf-2.
