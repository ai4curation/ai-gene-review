id: MODULE:dmel_cct_chaperonin
title: Chaperonin containing TCP-1 (CCT/TRiC) in Drosophila melanogaster
description: >-
  The chaperonin containing TCP-1 (CCT, also called TRiC) is the group II chaperonin of the
  eukaryotic cytosol. It is a double ring in which each ring contains one copy of each of
  eight paralogous subunits (CCT1-CCT8) in a fixed order. Substrates bind in the central cavity,
  and ATP hydrolysis by the subunits closes a built-in lid and drives folding of the enclosed
  polypeptide. Major substrates include actin and tubulin, which receive newly made chains
  partly from prefoldin.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000505
  title: 'FlyBase gene group CCT: Chaperonin containing tcp-1 complex'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as chaperonin containing tcp-1
    complex (CCT); this module models that group.
- source_id: FB:FBgg0002199
  title: 'FlyBase gene group HSP60-II: Heat shock protein 60 chaperonins - group ii'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as heat shock protein 60 chaperonins
    - group ii (HSP60-II); this module models that group.
- source_id: GO:0005832
  title: chaperonin-containing T-complex
  statement: >-
    GO term grounding the module as chaperonin-containing T-complex.
notes: >-
  CCT has no stable subcomplexes, so each of the eight subunits is modelled as a part. The
  FlyBase groups CCT and HSP60-II have identical membership. The ATP-dependent folding activity
  belongs to the assembled complex, so no molecular function is assigned to single subunits.
  FlyBase groups realized by this module: CCT (FBgg0000505), HSP60-II (FBgg0002199). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_cct_chaperonin.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
