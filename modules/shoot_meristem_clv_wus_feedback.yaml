id: MODULE:shoot_meristem_clv_wus_feedback
title: CLAVATA-WUSCHEL negative feedback loop in shoot apical meristem stem-cell homeostasis
description: >-
  The size of the stem-cell pool in the shoot apical meristem is held steady by a two-cell-layer
  negative feedback loop. The homeodomain transcription factor WUSCHEL (WUS) is made in the organizing
  center (OC), moves through plasmodesmata into the overlying central zone, and there both specifies
  stem-cell fate and directly activates CLAVATA3 (CLV3). CLV3 is processed and secreted as an
  arabinosylated 12/13-amino-acid CLE peptide. It is perceived at the plasma membrane of the
  underlying cells by parallel receptor systems: the LRR receptor kinase CLV1 and its paralogs BAM1/BAM2,
  which bind the peptide directly, and a heteromeric complex of the kinase-less LRR receptor-like
  protein CLV2 with the pseudokinase CORYNE (CRN). Whether CLV2/CRN binds the ligand directly is
  disputed; it acts at least as a co-receptor. Receptor signalling, relayed through CIK co-receptor
  kinases and PBL-type cytoplasmic kinases, represses WUS transcription and confines the OC. More stem
  cells therefore make more CLV3, which reduces WUS and so limits stem-cell number. When CLV1 is lost,
  BAM genes are de-repressed in the meristem centre and partly compensate. The KNOX homeodomain protein
  SHOOT MERISTEMLESS (STM), which keeps meristem cells undifferentiated and interacts genetically with
  the CLV genes, is shown only as optional context. RPK2, the CIK and PBL relay kinases, CLE processing,
  floral-meristem termination by AGAMOUS, and the root CLE40-ACR4 and CLE45-BAM3 pathways are outside
  this module boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:10761929
    statement: CLV genes repress WUS, and WUS induces the stem-cell marker CLV3, which forms a feedback loop
      between stem cells and the organizing center.
    supporting_text: >-
      Our data suggest that the shoot meristem has properties of a self-regulatory system in which
      WUS/CLV interactions establish a feedback loop between the stem cells and the underlying organizing
      center.
  - source_id: PMID:21979915
    statement: WUS protein moves from the OC to the central zone, where it binds the CLV3 promoter and
      activates its transcription.
    supporting_text: >-
      the WUS protein, after being synthesized in cells of the OC, migrates into the CZ, where it
      activates CLV3 transcription by binding to its promoter elements.
  - source_id: PMID:21705761
    statement: CLV1, CLV2 and CRN restrict WUS expression, and CLV1/BAM1 and CLV2/CRN act as parallel
      complexes in the shoot meristem.
    supporting_text: >-
      Our results suggest a model in which CLV1/BAM1 and CLV2/CRN complexes act in separate, parallel
      pathways in shoot meristems
  - source_id: PMID:28355208
    statement: In clv1 mutants, CLV1-related BAM receptor kinases are expressed ectopically and buffer
      stem-cell proliferation.
    supporting_text: >-
      in the absence of CLV1, CLV1-related receptor kinases are ectopically expressed but also buffer stem
      cell proliferation through the auto-repression of their own expression.
module:
  id: shoot_meristem_clv_wus_feedback
  label: CLV-WUS stem-cell feedback loop (shoot apical meristem)
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: homeostasis of number of meristem cells
      term:
        id: GO:0007639
        label: homeostasis of number of meristem cells
      description: The output of the loop is a steady-state stem-cell pool in the shoot meristem.
    - preferred_term: stem cell population maintenance
      term:
        id: GO:0019827
        label: stem cell population maintenance
      description: WUS-driven stem-cell specification is the positive arm of the loop.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: Members are grounded in Arabidopsis. The CLV3-receptor-WUS loop is conserved in
          other angiosperms (for example maize and tomato), but those orthologs are not modelled here.
  parts:
    - order: 1
      role: organizing-center transcription factor (positive arm)
      node:
        id: wus_organizing_center
        label: WUS stem-cell-promoting transcription factor
        module_type: REGULATORY_STEP
        description: >-
          WUS is transcribed in the organizing center. The protein moves into the central zone, where it
          maintains stem-cell identity and binds the CLV3 promoter to activate CLV3.
        annotons:
          - id: wus_tf
            label: "WUS: homeodomain DNA-binding transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: WUS
                term:
                  id: UniProtKB:Q9SB92
                  label: Protein WUSCHEL
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: stem cell population maintenance
                term:
                  id: GO:0019827
                  label: stem cell population maintenance
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Non-cell-autonomous stem-cell inducer. It activates CLV3, its own negative
              regulator.
            evidence:
              - source_id: PMID:21979915
                statement: WUS is made in the OC and activates CLV3 in the central zone.
                supporting_text: >-
                  WUS specifies stem cell fate and also restricts its own levels by activating a negative
                  regulator, CLAVATA3 (CLV3), in adjacent cells of the central zone (CZ).
    - order: 2
      role: stem-cell-derived peptide ligand
      node:
        id: clv3_ligand
        label: CLV3 CLE peptide signal
        module_type: REGULATORY_STEP
        description: >-
          CLV3 is expressed in central-zone stem cells and secreted into the apoplast as a processed,
          arabinosylated CLE peptide. It reports stem-cell number to the cells beneath.
        annotons:
          - id: clv3_peptide
            label: "CLV3: secreted CLE peptide ligand of CLV1/BAM receptor kinases"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CLV3
                term:
                  id: UniProtKB:Q9XF04
                  label: Protein CLAVATA 3
            function:
              preferred_term: receptor serine/threonine kinase binding
              term:
                id: GO:0033612
                label: receptor serine/threonine kinase binding
              description: GO has no plant peptide-hormone activity term. This follows the CLV3 gene
                review, which describes the ligand-receptor kinase interaction.
            processes:
              - preferred_term: regulation of meristem structural organization
                term:
                  id: GO:0009934
                  label: regulation of meristem structural organization
            locations:
              - preferred_term: apoplast
                term:
                  id: GO:0048046
                  label: apoplast
            role_description: Mobile negative-feedback signal from the stem cells.
            evidence:
              - source_id: PMID:10082464
                statement: CLV3 encodes a small extracellular protein that acts non-autonomously with CLV1
                  as a putative ligand-receptor pair.
                supporting_text: >-
                  These proteins may act as a ligand-receptor pair in a signal transduction pathway,
                  coordinating growth between adjacent meristematic regions.
              - source_id: PMID:18202283
                statement: The CLV3 peptide binds the CLV1 ectodomain directly.
                supporting_text: >-
                  the CLV3 peptide directly binds the CLV1 ectodomain with a dissociation constant of
                  17.5 nM
    - order: 3
      role: CLV3 perception at the plasma membrane
      node:
        id: clv3_perception
        label: Parallel CLV3 receptor systems
        module_type: SIGNALING_PATHWAY
        description: >-
          Two receptor systems that act at the same time sense CLV3 at the plasma membrane of OC and
          rib-zone cells: CLV1-family receptor kinases (CLV1, BAM1, BAM2) and the CLV2/CRN complex.
          Either system alone gives partial repression of WUS. Loss of both (for example clv1 bam1 or
          clv1 clv2) strongly enlarges the meristem. CIK co-receptor kinases and PBL34/35/36
          cytoplasmic kinases relay the signal and are outside this module boundary.
        variant_sets:
          - id: clv3_receptor_systems
            label: CLV3 receptor systems
            axis: receptor architecture (ligand-binding receptor kinase versus kinase-less co-receptor complex)
            selection: ONE_OR_MORE
            notes: Both systems are present in the meristem and contribute additively, so this is not an
              either/or choice.
            evidence:
              - source_id: PMID:20626648
                statement: CLV2/CRN and CLV1/BAM form two distinct receptor complexes.
                supporting_text: >-
                  In this study we find evidence for two distinct receptor complexes involved in stem cell
                  regulation in Arabidopsis, CLV2/CRN and CLV1/BAM.
            variants:
              - id: clv1_bam_receptor_kinases
                label: CLV1-family LRR receptor kinases
                module_type: PROTEIN_COMPLEX
                description: >-
                  CLV1 homomers and CLV1/BAM heteromers. Their LRR ectodomains bind CLV3 directly, and
                  their kinase domains phosphorylate CIK and PBL substrates. In the wild type, BAM1 is
                  mainly peripheral. It is up-regulated centrally in clv1 mutants, and clv1 bam1 double
                  mutants have strongly enlarged meristems with expanded WUS.
                annotons:
                  - id: clv1_receptor_kinase
                    label: "CLV1: CLV3 receptor kinase"
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CLV1
                        term:
                          id: UniProtKB:Q9SYQ8
                          label: Receptor protein kinase CLAVATA1
                    function:
                      preferred_term: transmembrane receptor protein serine/threonine kinase activity
                      term:
                        id: GO:0004675
                        label: transmembrane receptor protein serine/threonine kinase activity
                    processes:
                      - preferred_term: regulation of meristem structural organization
                        term:
                          id: GO:0009934
                          label: regulation of meristem structural organization
                    locations:
                      - &pm
                        preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: Primary high-affinity CLV3 receptor in the OC and rib zone.
                    evidence:
                      - source_id: PMID:18202283
                        statement: CLV3 binds the CLV1 ectodomain directly.
                        supporting_text: >-
                          the CLV3 peptide directly binds the CLV1 ectodomain with a dissociation
                          constant of 17.5 nM
                      - source_id: PMID:34935965
                        statement: CLV1 and BAM1 phosphorylate PBL34/35/36.
                        supporting_text: >-
                          Further biochemical assays revealed that PBL34/35/36 interacted with CLV1,
                          BAM1/3, and CIKs, and were phosphorylated by CLV1 and BAM1.
                  - id: bam1_receptor_kinase
                    label: "BAM1: CLV1-related CLE receptor kinase"
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: BAM1
                        term:
                          id: UniProtKB:O49545
                          label: Leucine-rich repeat receptor-like serine/threonine-protein kinase BAM1
                    function:
                      preferred_term: transmembrane receptor protein serine/threonine kinase activity
                      term:
                        id: GO:0004675
                        label: transmembrane receptor protein serine/threonine kinase activity
                    processes:
                      - preferred_term: regulation of meristem structural organization
                        term:
                          id: GO:0009934
                          label: regulation of meristem structural organization
                    locations:
                      - *pm
                    role_description: Redundant CLV3 receptor that buffers loss of CLV1. It has broader CLE
                      specificity than CLV1, and in the meristem flanks it may also act as a ligand sink.
                    evidence:
                      - source_id: PMID:25754504
                        statement: BAM1 binds CLV3 directly, and clv1 bam1 has an enlarged meristem with
                          expanded WUS.
                        supporting_text: >-
                          These results indicate that CLV1 and BAM1 are direct receptors that are sufficient
                          to affect the regulatory network controlling stem cell number in the SAM.
                      - source_id: PMID:18780746
                        statement: The weak phenotype of clv1 nulls depends on BAM activity.
                        supporting_text: >-
                          We show that the weak nature of the phenotype of clv1 null alleles is dependent on
                          BAM activity
              - id: clv2_crn_coreceptor_complex
                label: CLV2/CRN co-receptor complex
                module_type: PROTEIN_COMPLEX
                description: >-
                  A heteromer of the kinase-less LRR receptor-like protein CLV2 and the transmembrane
                  pseudokinase CRN. The two subunits assemble through their transmembrane domains, and each
                  is needed for the other to leave the ER. Radioligand assays reported CLE binding by CLV2
                  (Kd about 32 nM), but photoaffinity labelling did not detect it. The complex is therefore
                  modelled as a co-receptor whose signalling depends on the CRN pseudokinase domain and on
                  CIK kinases.
                annotons:
                  - id: clv2_coreceptor
                    label: "CLV2: LRR receptor-like co-receptor"
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CLV2
                        term:
                          id: UniProtKB:O80809
                          label: Receptor-like protein CLAVATA2
                    function:
                      preferred_term: coreceptor activity
                      term:
                        id: GO:0015026
                        label: coreceptor activity
                    processes:
                      - preferred_term: regulation of meristem growth
                        term:
                          id: GO:0010075
                          label: regulation of meristem growth
                    locations:
                      - *pm
                    role_description: Ectodomain-bearing subunit of the CLV2/CRN complex.
                    evidence:
                      - source_id: PMID:25754504
                        statement: CLV2/CRN shows no direct CLV3 binding by photoaffinity labelling and may
                          act as a co-receptor.
                        supporting_text: >-
                          In contrast, the CLV2/CRN complex and RPK2 are not involved in direct ligand
                          interactions but may act as co-receptors.
                      - source_id: PMID:20626648
                        statement: Radioligand binding gives a CLV2 Kd similar to that of CLV1 (contested).
                        supporting_text: >-
                          Binding was saturable for all receptors with a very similar Kd for each receptor:
                          30 nM for CLV1, 32 nM for CLV2, 26 nM for BAM1, and 36 nM for BAM2
                  - id: crn_pseudokinase_adaptor
                    label: "CRN: pseudokinase scaffold of the CLV2/CRN complex"
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CRN
                        term:
                          id: UniProtKB:Q9LYU7
                          label: Inactive leucine-rich repeat receptor-like protein kinase CORYNE
                    function:
                      preferred_term: signaling receptor complex adaptor activity
                      term:
                        id: GO:0030159
                        label: signaling receptor complex adaptor activity
                      description: CRN has no catalytic activity (NOT GO:0004672). Its kinase-like domain is
                        needed for shoot signalling as a scaffold.
                    processes:
                      - preferred_term: regulation of meristem growth
                        term:
                          id: GO:0010075
                          label: regulation of meristem growth
                    locations:
                      - *pm
                    role_description: Transmembrane pseudokinase that brings CLV2 to the plasma membrane and
                      supplies the intracellular module of the complex.
                    evidence:
                      - source_id: PMID:19933383
                        statement: CLV2 and CRN require each other for ER export and plasma-membrane
                          localization.
                        supporting_text: >-
                          We found that CLV2 and CRN require each other for export from the endoplasmic
                          reticulum and localization to the plasma membrane (PM).
                      - source_id: PMID:21398569
                        statement: CRN lacks kinase activity, and a kinase-dead allele complements.
                        supporting_text: >-
                          indicating that CRN does not require kinase activity for wild-type function
    - order: 4
      role: KNOX meristem-maintenance context
      optional: true
      node:
        id: stm_knox_context
        label: STM-dependent meristem competence (context)
        module_type: REGULATORY_STEP
        description: >-
          STM keeps meristem cells undifferentiated throughout the dome. It is needed for a meristem to
          exist, but it is not part of the CLV3-WUS feedback circuit itself. It is included as context
          because stm alleles interact genetically with clv mutations.
        annotons:
          - id: stm_tf
            label: "STM: KNOX homeodomain transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: STM
                term:
                  id: UniProtKB:Q38874
                  label: Homeobox protein SHOOT MERISTEMLESS
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
              - preferred_term: stem cell population maintenance
                term:
                  id: GO:0019827
                  label: stem cell population maintenance
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Meristem-wide factor that prevents differentiation. It provides context
              for, and is not a component of, the CLV-WUS loop.
            evidence:
              - source_id: PMID:9729492
                statement: stm and clv2 alleles suppress each other.
                supporting_text: >-
                  The stm-1 mutation dominantly suppresses clv2, and clv2 mutations suppress the strong
                  stm-1 allele, but not the weak stm-2 allele.
  connections:
    - source: wus_organizing_center
      target: clv3_ligand
      connection_type: POSITIVELY_REGULATES
      description: WUS protein moves into the central zone and activates CLV3 transcription.
      evidence:
        - source_id: PMID:21979915
          statement: WUS binds CLV3 promoter elements in the central zone.
          supporting_text: >-
            migrates into the CZ, where it activates CLV3 transcription by binding to its promoter elements.
    - source: clv3_ligand
      target: clv3_perception
      connection_type: PROVIDES_INPUT_FOR
      description: Secreted CLV3 peptide is the ligand sensed by the CLV1/BAM and CLV2/CRN receptor
        systems.
    - source: clv3_perception
      target: wus_organizing_center
      connection_type: NEGATIVELY_REGULATES
      description: CLV3 receptor signalling represses WUS transcription and confines the organizing center,
        which closes the negative feedback loop.
      evidence:
        - source_id: PMID:10761929
          statement: CLV genes repress WUS at the transcript level.
          supporting_text: >-
            the CLV genes repress WUS at the transcript level
    - source: stm_knox_context
      target: wus_organizing_center
      connection_type: PROVIDES_INPUT_FOR
      description: STM keeps the meristem undifferentiated, which provides the competent tissue in which the
        WUS-CLV3 loop operates. This is context, not a direct regulatory link.
notes: >-
  Member gene reviews: CLV1, CLV2, CRN and BAM1 were curated with this module. CLV3, WUS and STM reviews
  were used read-only. Annoton MFs match each gene review's core_functions. CLV1 and BAM1 use GO:0004675
  (the CLV1 core MF was updated from GO:0004674). CLV2 uses coreceptor activity (GO:0015026) and CRN uses
  signaling receptor complex adaptor activity (GO:0030159). No production GO-CAM in gocams/index.tsv
  contains these Arabidopsis proteins. PANTHER family ids were not asserted.
