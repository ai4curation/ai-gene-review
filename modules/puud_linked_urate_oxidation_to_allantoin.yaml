id: MODULE:puud_linked_urate_oxidation_to_allantoin
title: PuuD-linked urate oxidation to allantoin
description: >-
  A reusable three-reaction bacterial pathway in which a membrane-associated
  cytochrome c PuuD family protein initiates urate oxidation, hydroxyisourate
  hydrolase converts the resulting 5-hydroxyisourate to OHCU, and OHCU
  decarboxylase forms (S)-allantoin. The module is restricted to the
  PuuD-linked implementation of the first step and does not conflate its
  electron-transfer mechanism with the hydrogen-peroxide-producing reaction of
  soluble cofactor-independent Uox enzymes.
status: DRAFT
evidence:
  - source_id: GO:0019628
    title: urate catabolic process
    statement: >-
      GO:0019628 supplies the biological-process boundary from urate
      consumption through formation of allantoin.
  - source_id: PMID:26349049
    title: >-
      The identification of an integral membrane, cytochrome c urate oxidase
      completes the catalytic repertoire of a therapeutic enzyme.
    statement: >-
      Genetic complementation and comparative-genomic evidence identify COG3748
      PuuD proteins as the membrane-associated first step of the three-enzyme
      urate-to-allantoin route and distinguish their electron-transfer mechanism
      from soluble Uox chemistry.
    supporting_text: >-
      In living organisms, the conversion of urate into allantoin requires
      three consecutive enzymes.
  - source_id: file:PSEPK/PP_4289/PP_4289-uniprot.txt
    title: UniProtKB entry Q88F11 for PSEPK PP_4289
    statement: >-
      Q88F11 is a COG3748 protein with the urate-oxidase N-terminal domain,
      eight predicted transmembrane helices, and a C-terminal cytochrome c
      domain, matching the defining PuuD architecture.
  - source_id: file:PSEPK/pucM/pucM-uniprot.txt
    title: UniProtKB entry Q88F14 for PSEPK PucM
    statement: >-
      Q88F14 is assigned hydroxyisourate hydrolase activity and RHEA:23736.
  - source_id: file:PSEPK/pucL/pucL-uniprot.txt
    title: UniProtKB entry Q88F12 for PSEPK PucL
    statement: >-
      Q88F12 is assigned OHCU decarboxylase activity and RHEA:26301.
  - source_id: UniProtKB:P76038
    title: UniProtKB entry for Escherichia coli PuuD
    statement: >-
      The E. coli protein named PuuD is an unrelated
      gamma-glutamyl-gamma-aminobutyrate hydrolase; the shared short name does
      not imply membership in this COG3748 urate-oxidation module.
  - source_id: file:modules/puud_linked_urate_oxidation_to_allantoin-deep-research-openscientist.md
    title: OpenScientist deep research on the PuuD-linked module
    statement: >-
      The report corroborates the three-reaction boundary and explicitly
      identifies PuuD acceptor chemistry as unresolved; claims in the same
      report that write oxygen into the PuuD reaction are not imported.
    supporting_text: >-
      There is no atomic-resolution structure of PuuD, and its physiological
      electron acceptor and the coupling between the DUF989 transmembrane domain
      and the C-terminal cytochrome c remain unresolved.
