  notes: >-
    The boundary begins at urate and ends at (S)-allantoin. Urate uptake,
    upstream xanthine-to-urate formation, and downstream allantoin degradation
    are separate modules. Soluble Uox, HpxO, and HpyO are alternative
    implementations of the first pathway reaction but are intentionally not
    included in this PuuD-linked module. PP_4289/Q88F11 is the KT2440 PuuD
    candidate; PP_3099/Q88IA0 is excluded because its TssC1/VipB domain
    architecture identifies a type VI secretion sheath protein rather than a
    PuuD-family membrane oxidoreductase. Here PuuD means the COG3748
    purine-utilization D family named in PMID:26349049, not the unrelated E.
    coli PuuD gamma-glutamyl-gamma-aminobutyrate hydrolase
    (UniProtKB:P76038). Although some literature syntheses use
    oxygen-containing shorthand for the first reaction, this module does not
    assert oxygen as the PuuD acceptor while the redox partner remains unknown.
