id: MODULE:leptin_melanocortin_signaling
title: Hypothalamic leptin-melanocortin signaling module
description: >-
  The central adipostat: adipocyte-derived leptin acts on the long leptin receptor isoform of
  hypothalamic arcuate neurons, whose JAK2-STAT3 output raises POMC and lowers AGRP expression;
  prohormone convertases cleave POMC in dense-core granules to release alpha-MSH, which activates
  MC4R on second-order neurons to suppress appetite, while AGRP from a reciprocal neuronal
  population antagonises the same receptor.
status: DRAFT
evidence:
  - source_id: GO:0038108
    title: negative regulation of appetite by leptin-mediated signaling pathway
    statement: >-
      GO already names the composite process this module decomposes - appetite suppression achieved
      through the leptin-mediated signaling pathway - which is the module boundary adopted here.
  - source_id: GO:0033210
    title: leptin-mediated signaling pathway
    statement: The upstream half of the module is grounded in the GO term for leptin-mediated signaling.
  - source_id: PMID:8548812
    title: Identification and expression cloning of a leptin receptor, OB-R.
    statement: >-
      "OB-R mRNA is expressed not only in choroid plexus, but also in several other tissues, including
      hypothalamus" - establishes the hypothalamic receptor that makes the module a central pathway.
  - source_id: PMID:15207242
    title: Leptin receptor signaling in POMC neurons is required for normal body weight homeostasis.
    statement: >-
      "Mice lacking leptin signaling in POMC neurons are mildly obese, hyperleptinemic, and have
      altered expression of hypothalamic neuropeptides" - direct genetic evidence for the
      LEPR-to-POMC connection modelled here, and for POMC neurons carrying part but not all of the
      leptin signal.
  - source_id: PMID:2023902
    title: PC1 and PC2 are proprotein convertases capable of cleaving proopiomelanocortin at distinct
      pairs of basic residues.
    statement: >-
      "PC1 cleaves POMC into corticotropin and beta-lipotropin" and "PC2 cleaves POMC at the five
      pairs of basic residues analyzed, whereas PC1 cleaves two of them preferentially" - the basis
      for modelling POMC maturation as two convertase roles rather than one.
  - source_id: PMID:17229951
    title: Clinical and molecular genetic spectrum of congenital deficiency of the leptin receptor.
    statement: >-
      "Affected subjects were characterized by hyperphagia, severe obesity, alterations in immune
      function, and delayed puberty due to hypogonadotropic hypogonadism" - human loss-of-function
      evidence that the receptor step is required for the module's output.
  - source_id: PMID:27187081
    title: 'PCSK1 Mutations and Human Endocrinopathies: From Obesity to Gastrointestinal Disorders.'
    statement: >-
      Human PCSK1 loss of function produces "obesity, malabsorptive diarrhea, hypogonadotropic
      hypogonadism, altered thyroid and adrenal function" - the processing step is required, though
      its phenotype is broader than this module because PC1/3 serves many precursors.
  - source_id: file:interpro/panther/PTHR23037/PTHR23037-paint.tsv
    title: PTHR23037 PAINT IBD rows
    statement: >-
      PANTHER:PTN002745476 in PTHR23037 carries F:GO:0004896 and C:GO:0043235 IBD rows whose seed
      list includes UniProtKB:P48357, so the node is the cytokine-receptor ancestor through which
      LEPR inherits receptor-complex function.
  - source_id: file:interpro/panther/PTHR22750/PTHR22750-paint.tsv
    title: PTHR22750 PAINT IBD rows
    statement: >-
      PANTHER:PTN002733667 in PTHR22750 carries an F:GO:0004980 IBD row seeded by UniProtKB:P32245
      (MC4R), i.e. the melanocyte-stimulating hormone receptor function is placed at a node that MC4R
      itself grounds.
notes: >-
  Scope: this module is the hypothalamic appetite-suppressing arm only. Leptin's peripheral actions
  (angiogenesis, T-cell responses, bone mass, beta-cell function) and POMC's non-hypothalamic
  products (ACTH-driven adrenal steroidogenesis, alpha-MSH acting at MC1R in skin) are deliberately
  outside the boundary; they are recorded in the member gene reviews instead. JAK2, STAT3, SOCS3 and
  PTP1B are the intracellular transduction and feedback machinery; the generic motif is already
  modelled in modules/jak_stat_signaling.yaml, so this module asserts the receptor's STAT output as
  a function rather than re-modelling the kinase cascade.

  PANTHER grounding: family ids and subfamily names were read from the committed PANTHER
  classifications (interpro/panther/*-entries.csv and the release-pinned human classification), never
  written from memory, and every family declared here contains its own representative member. Note
  that the two PANTHER sources disagree about LEPR: the committed PTHR23037 entries file places
  P48357 at PTHR23037:SF44 while the pinned release classification places it at PTHR23036:SF109.
  PTHR23037 is used here because the PAINT node cited above (PTN002745476, seeded by P48357) lives in
  that family; the discrepancy is recorded rather than silently resolved. PTN anchors are asserted
  only where a local PAINT row names the node together with the member accession; the two convertases
  carry no PTN anchor (the nodes named in the PCSK1 GOA WITH/FROM field are not in the local PAINT
  index, so they are not asserted here) and are grounded as UniProt gene products at the subfamily
  level named in the PANTHER classification, because dibasic-site prohormone specificity is not a
  property of the whole PTHR42884 family.
module:
  id: leptin_melanocortin_signaling
  label: Hypothalamic leptin-melanocortin signaling
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: negative regulation of appetite by leptin-mediated signaling pathway
      term:
        id: GO:0038108
        label: negative regulation of appetite by leptin-mediated signaling pathway
      description: >-
        The composite process: leptin signalling in the hypothalamus reduces food intake. The module
        decomposes it into hormone release, receptor activation, prohormone processing, melanocortin
        receptor agonism and the antagonistic AGRP arm.
    - preferred_term: energy homeostasis
      term:
        id: GO:0097009
        label: energy homeostasis
      description: >-
        The module's physiological output: matching energy intake to stored energy, which fails in
        leptin, leptin-receptor, PCSK1, POMC and MC4R deficiency alike.
  context:
    taxa:
      - preferred_term: mammals
        term:
          id: NCBITaxon:40674
          label: Mammalia
    cellular_components:
      - preferred_term: extracellular region
        term:
          id: GO:0005576
          label: extracellular region
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
      - preferred_term: secretory granule lumen
        term:
          id: GO:0034774
          label: secretory granule lumen
    anatomical_locations:
      - preferred_term: arcuate nucleus of hypothalamus
        term:
          id: UBERON:0001932
          label: arcuate nucleus of hypothalamus
  parts:
    - order: 1
      role: adipostatic hormone release
      node:
        id: leptin_signal_generation
        label: Leptin release as an adipostatic signal
        module_type: REGULATORY_STEP
        description: >-
          Adipocytes secrete leptin in proportion to fat mass, so circulating leptin reports stored
          energy to the brain. Absence of the hormone, like absence of its receptor, produces
          hyperphagic obesity.
        concepts:
          - preferred_term: hormone activity
            term:
              id: GO:0005179
              label: hormone activity
        annotons:
          - id: leptin_hormone
            label: Leptin
            participant:
              selector_type: FAMILY
              family:
                preferred_term: leptin, the adipocyte adipostatic hormone
                term:
                  id: PANTHER:PTHR11724
                  label: LEPTIN
                representative_members:
                  - preferred_term: LEP
                    term:
                      id: UniProtKB:P41159
                      label: Leptin
            function:
              preferred_term: hormone activity
              term:
                id: GO:0005179
                label: hormone activity
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Secreted ligand of the module; binds the leptin receptor ectodomain and drives the
              ligand-induced receptor assembly that initiates signalling.
            evidence:
              - source_id: PMID:36959263
                statement: >-
                  "The adipokine Leptin activates its receptor LEP-R in the hypothalamus to regulate
                  body weight" - leptin is the activating ligand of the hypothalamic step.
    - order: 2
      role: hypothalamic leptin receptor activation
      node:
        id: leptin_receptor_activation
        label: Leptin receptor activation and STAT output
        module_type: REGULATORY_STEP
        description: >-
          Leptin binding to the long receptor isoform assembles higher-order leptin:receptor
          complexes at the neuronal plasma membrane. Receptor-associated JAK2 is activated and
          phosphorylates STAT3, whose transcriptional programme raises POMC and represses AGRP in
          arcuate neurons. Only the long isoform signals; the short and soluble isoforms do not.
        concepts:
          - preferred_term: leptin-mediated signaling pathway
            term:
              id: GO:0033210
              label: leptin-mediated signaling pathway
        annotons:
          - id: leptin_receptor
            label: Leptin receptor (long signalling isoform)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: leptin receptor within the class I cytokine receptor family
                term:
                  id: PANTHER:PTHR23037
                  label: CYTOKINE RECEPTOR
                representative_members:
                  - preferred_term: LEPR
                    term:
                      id: UniProtKB:P48357
                      label: Leptin receptor
                ancestral_nodes:
                  - preferred_term: PAINT node PTN002745476 in PTHR23037
                    term:
                      id: PANTHER:PTN002745476
                      label: PTN002745476
                    description: >-
                      Local PAINT IBD node in PTHR23037 propagating F:GO:0004896 and C:GO:0043235;
                      its seed list includes UniProtKB:P48357, so LEPR is one of the descendant
                      evidences behind the node as well as a recipient of it.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          IBD propagation from PAINT node PTN002745476 in PTHR23037, recorded in
                          interpro/panther/PTHR23037/PTHR23037-paint.tsv.
            function:
              preferred_term: leptin receptor activity
              term:
                id: GO:0038021
                label: leptin receptor activity
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Transduces the hormone signal across the membrane of arcuate neurons; its STAT arm is
              what couples nutritional state to melanocortin gene expression.
            evidence:
              - source_id: file:genes/human/LEPR/LEPR-uniprot.txt
                statement: >-
                  "Control of energy homeostasis and melanocortin" production - stimulation of POMC
                  and repression of AgRP transcription - "is mediated by STAT3 signaling".
              - source_id: PMID:17229951
                statement: >-
                  "All missense mutations resulted in impaired receptor signaling" in patients with
                  hyperphagic severe obesity, so this step is required for the module's output.
    - order: 3
      role: POMC expression and prohormone maturation
      node:
        id: pomc_processing
        label: POMC synthesis and convertase processing to alpha-MSH
        module_type: REGULATORY_STEP
        description: >-
          Leptin-driven STAT3 signalling raises POMC transcription in arcuate neurons. The POMC
          precursor enters dense-core secretory granules, where prohormone convertase 1/3 makes the
          first cleavages (releasing ACTH and beta-lipotropin) and convertase 2, with
          carboxypeptidase E and downstream amidation and acetylation, completes the conversion to
          alpha-MSH. The precursor is inert until cleaved, which is why convertase loss mimics
          melanocortin deficiency.
        concepts:
          - preferred_term: peptide hormone processing
            term:
              id: GO:0016486
              label: peptide hormone processing
        annotons:
          - id: pomc_precursor
            label: Proopiomelanocortin precursor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: proopiomelanocortin, the melanocortin precursor
                term:
                  id: PANTHER:PTHR11416
                  label: PRO-OPIOMELANOCORTIN
                representative_members:
                  - preferred_term: POMC
                    term:
                      id: UniProtKB:P01189
                      label: Pro-opiomelanocortin
            function:
              preferred_term: type 4 melanocortin receptor binding
              term:
                id: GO:0031782
                label: type 4 melanocortin receptor binding
            locations:
              - preferred_term: secretory granule lumen
                term:
                  id: GO:0034774
                  label: secretory granule lumen
            role_description: >-
              Substrate of the processing step and, once cleaved, source of the alpha-MSH agonist
              that acts at MC4R in the next step.
            evidence:
              - source_id: file:genes/human/POMC/POMC-ai-review.yaml
                statement: >-
                  The POMC gene review records type 4 melanocortin receptor binding (GO:0031782) with
                  negative regulation of appetite and energy homeostasis as a core function of the
                  alpha-MSH product, acting in the hypothalamus.
          - id: pcsk1_convertase
            label: Prohormone convertase 1/3
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PCSK1 (prohormone convertase 1/3, PANTHER subfamily PTHR42884:SF14
                  NEUROENDOCRINE CONVERTASE 1)
                term:
                  id: UniProtKB:P29120
                  label: Neuroendocrine convertase 1
            function:
              preferred_term: serine-type endopeptidase activity
              term:
                id: GO:0004252
                label: serine-type endopeptidase activity
            locations:
              - preferred_term: secretory granule lumen
                term:
                  id: GO:0034774
                  label: secretory granule lumen
            role_description: >-
              Makes the first, obligatory cleavages of POMC at paired basic residues, releasing ACTH
              and beta-lipotropin and thereby committing the precursor to the melanocortin route.
            evidence:
              - source_id: PMID:2023902
                statement: >-
                  "PC1 cleaves POMC into corticotropin and beta-lipotropin" - the first processing
                  step of the melanocortin route.
              - source_id: file:genes/human/PCSK1/PCSK1-uniprot.txt
                statement: >-
                  "Substrates include POMC, renin, oxytocin, vasopressin, enkephalin, dynorphin,
                  somatostatin, insulin and AGRP" - PC1/3 matures both the agonist and the antagonist
                  arms of this module.
          - id: pcsk2_convertase
            label: Prohormone convertase 2
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PCSK2 (prohormone convertase 2, PANTHER subfamily PTHR42884:SF13
                  NEUROENDOCRINE CONVERTASE 2)
                term:
                  id: UniProtKB:P16519
                  label: Neuroendocrine convertase 2
            function:
              preferred_term: serine-type endopeptidase activity
              term:
                id: GO:0004252
                label: serine-type endopeptidase activity
            locations:
              - preferred_term: secretory granule lumen
                term:
                  id: GO:0034774
                  label: secretory granule lumen
            role_description: >-
              Completes POMC maturation in neurons by cleaving at the additional basic-residue pairs
              that PC1/3 leaves intact, which is the step that actually liberates alpha-MSH.
            evidence:
              - source_id: PMID:2023902
                statement: >-
                  "PC2 cleaves POMC at the five pairs of basic residues analyzed, whereas PC1 cleaves
                  two of them preferentially" and PC2 generates "either alpha MSH or desacetyl-alpha
                  MSH".
    - order: 4
      role: melanocortin receptor agonism
      node:
        id: mc4r_agonism
        label: alpha-MSH activation of MC4R
        module_type: REGULATORY_STEP
        description: >-
          alpha-MSH released from arcuate POMC neurons activates MC4R on second-order neurons,
          notably in the paraventricular nucleus. The receptor couples to Gs, raising cAMP, and the
          resulting signal suppresses food intake and supports energy expenditure. This is the
          effector node of the module and the commonest monogenic obesity locus in humans.
        concepts:
          - preferred_term: negative regulation of appetite
            term:
              id: GO:0032099
              label: negative regulation of appetite
        annotons:
          - id: mc4_receptor
            label: Melanocortin 4 receptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: melanocortin receptor 4 within the class A G-protein-coupled receptors
                term:
                  id: PANTHER:PTHR22750
                  label: G-PROTEIN COUPLED RECEPTOR
                representative_members:
                  - preferred_term: MC4R
                    term:
                      id: UniProtKB:P32245
                      label: Melanocortin receptor 4
                ancestral_nodes:
                  - preferred_term: PAINT node PTN002733667 in PTHR22750
                    term:
                      id: PANTHER:PTN002733667
                      label: PTN002733667
                    description: >-
                      Local PAINT IBD node in PTHR22750 propagating F:GO:0004980 melanocyte-stimulating
                      hormone receptor activity, seeded by UniProtKB:P32245 itself.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          IBD propagation from PAINT node PTN002733667 in PTHR22750, recorded in
                          interpro/panther/PTHR22750/PTHR22750-paint.tsv.
            function:
              preferred_term: melanocyte-stimulating hormone receptor activity
              term:
                id: GO:0004980
                label: melanocyte-stimulating hormone receptor activity
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Effector receptor of the module: converts the alpha-MSH concentration set by the
              preceding steps into a cAMP signal that suppresses appetite.
            evidence:
              - source_id: file:genes/human/MC4R/MC4R-ai-review.yaml
                statement: >-
                  The MC4R gene review's core function is melanocyte-stimulating hormone receptor
                  activity (GO:0004980) coupling to adenylate cyclase activation and negative
                  regulation of appetite, at the plasma membrane of paraventricular neurons.
    - order: 5
      role: competitive antagonism of the effector receptor
      node:
        id: agrp_antagonism
        label: AGRP antagonism of MC4R
        module_type: REGULATORY_STEP
        description: >-
          AGRP, released from a reciprocally regulated arcuate neuronal population whose expression
          leptin suppresses, binds MC4R and opposes alpha-MSH, acting as an antagonist and inverse
          agonist. The appetite set-point is therefore the balance of two POMC- and AGRP-derived
          signals at one receptor, not the agonist alone.
        annotons:
          - id: agrp_antagonist
            label: Agouti-related protein
            participant:
              selector_type: FAMILY
              family:
                preferred_term: agouti-related protein, the endogenous melanocortin receptor antagonist
                term:
                  id: PANTHER:PTHR16551
                  label: AGOUTI RELATED
                representative_members:
                  - preferred_term: AGRP
                    term:
                      id: UniProtKB:O00253
                      label: Agouti-related protein
            function:
              preferred_term: type 4 melanocortin receptor binding
              term:
                id: GO:0031782
                label: type 4 melanocortin receptor binding
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Orexigenic ligand that competes with alpha-MSH at MC4R; its precursor is itself a PC1/3
              substrate, so the processing step serves both arms.
            evidence:
              - source_id: file:genes/human/MC4R/MC4R-ai-review.yaml
                statement: >-
                  The MC4R review records AgRP binding as a core function of the receptor, with AgRP
                  antagonising agonist signalling and acting as an inverse agonist that stimulates
                  food intake.
              - source_id: file:genes/human/LEPR/LEPR-uniprot.txt
                statement: >-
                  "Control of energy homeostasis and melanocortin" production by the receptor includes
                  "full repression of AgRP transcription", placing the antagonist arm under leptin
                  control.
  connections:
    - source: leptin_signal_generation
      target: leptin_receptor_activation
      connection_type: CAUSES
      description: Circulating leptin binds and activates the hypothalamic leptin receptor.
    - source: leptin_receptor_activation
      target: pomc_processing
      connection_type: POSITIVELY_REGULATES
      description: >-
        Receptor STAT3 signalling raises POMC transcription in arcuate neurons, increasing the
        precursor available to the convertases.
    - source: pomc_processing
      target: mc4r_agonism
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Convertase processing of POMC supplies the alpha-MSH that activates MC4R; the uncleaved
        precursor cannot act on the receptor.
    - source: agrp_antagonism
      target: mc4r_agonism
      connection_type: NEGATIVELY_REGULATES
      description: AGRP competes with alpha-MSH at MC4R and opposes the anorexigenic signal.
    - source: leptin_receptor_activation
      target: agrp_antagonism
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Leptin receptor STAT3 signalling represses AGRP expression, so the antagonist arm falls as
        the agonist arm rises.
