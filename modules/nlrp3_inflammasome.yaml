    - order: 2
      optional: true
      role: >-
        NEK7 licensing of NLRP3 - non-catalytic, compensable regulation of sensor
        activation rather than a step in the chain
      node:
        id: nek7_licensing
        label: NEK7 licensing of NLRP3 (optional)
        module_type: REGULATORY_STEP
        description: >-
          Acting downstream of potassium efflux and at the microtubule organizing
          centre, NEK7 binds the NLRP3 leucine-rich repeat, opens the autoinhibited
          cage and bridges adjacent NLRP3 subunits in the assembled disc, of which
          it is a stoichiometric subunit. The role is kinase-independent. It is
          modelled as optional regulation because human myeloid cells can dispense
          with it: IKKbeta-driven recruitment of NLRP3 to PI4P makes NEK7 redundant
          and is reported as the predominant human priming route, and raising NLRP3
          abundance makes activation independent of both NEK7 and priming.
        concepts:
          - preferred_term: positive regulation of NLRP3 inflammasome complex assembly
            term:
              id: GO:1900227
              label: positive regulation of NLRP3 inflammasome complex assembly
        annotons:
          - id: nek7_nlrp3_licensing
            label: NEK7 non-catalytic activation of NLRP3
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NEK7
                term:
                  id: UniProtKB:Q8TDX7
                  label: Serine/threonine-protein kinase Nek7
            function:
              preferred_term: molecular function activator activity
              term:
                id: GO:0140677
                label: molecular function activator activity
              targets:
                - preferred_term: NLRP3 leucine-rich repeat domain
              description: >-
                Deliberately not a kinase activity. Kinase-dead NEK7 rescues
                inflammasome activation, and the local PAINT row propagating
