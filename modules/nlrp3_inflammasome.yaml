    - source: gsdmd_pore_formation
      target: ninj1_membrane_rupture
      connection_type: CAUSES
      description: >-
        Gasdermin pores precede and trigger NINJ1-dependent rupture; the pore stage
        is survivable and NINJ1 is what makes the outcome terminal. The same NINJ1
