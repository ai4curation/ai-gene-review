                  label: protein homooligomerization
              - preferred_term: pyroptosome complex assembly
                term:
                  id: GO:1904270
                  label: pyroptosome complex assembly
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Self-polymerisation is the amplification mechanism: one nucleation
