            term:
              id: GO:0061703
              label: pyroptosome complex
            description: >-
              The condensed, one-per-cell ASC assembly. Retained alongside
              GO:0061702 canonical inflammasome complex because the speck is the
              supramolecular form the adaptor takes, not a synonym for the
              three-component complex.
