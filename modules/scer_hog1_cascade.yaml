id: MODULE:scer_hog1_cascade
title: Budding yeast (S. cerevisiae) high-osmolarity (Ssk2-Pbs2-Hog1) MAPK cascade module
description: >-
  A decomposition of the Saccharomyces cerevisiae high-osmolarity glycerol (HOG)
  MAP kinase cascade, the osmostress-activated fungal realization of the generic
  three-tier MAP kinase relay (MODULE:mapk_relay). High external osmolarity is
  sensed by two functionally redundant upstream branches that converge on the
  single MAP2K Pbs2. In the Sln1 branch the hybrid histidine kinase Sln1 is
  constitutively active in the absence of stress and keeps phosphate flowing
  through the Hpt protein Ypd1 to the response regulator Ssk1, holding the
  cascade off; a drop in turgor silences Sln1, Ssk1 accumulates unphosphorylated
  and binds and activates the MAP3Ks Ssk2/Ssk22, so in this section of the
  pathway signalling output runs inversely to phosphorylation. In the Sho1
  branch the tetraspan osmosensor Sho1, with the signalling mucins Msb2 and Hkr1
  and the adaptor Ste50, assembles a membrane complex that brings the MAP3K
  Ste11 to Pbs2, which also acts as the scaffold of this branch. Pbs2 then dually
  phosphorylates the MAPK Hog1 on its TGY activation-loop motif. Active Hog1
  translocates to the nucleus and activates transcription factors (Hot1,
  Msn2/Msn4, Sko1) that induce glycerol-biosynthesis and stress-response genes
  restoring osmotic balance. The kinase relay - Ssk2/Ssk22 -> Pbs2 -> Hog1 - is
  declared as an inner bundle that `conforms_to` mapk_relay, while the two
  osmosensing inputs and the Hog1 transcriptional output are this cascade's free
  extensions around the conforming core. Grounded in GO:0007231 (osmosensory
  signaling pathway).
status: DRAFT
evidence:
  - source_id: GO:0007231
    title: osmosensory signaling pathway
    statement: >-
      The module is grounded in the GO biological process term for osmosensory
      signaling, the process driven by the yeast HOG pathway.
  - source_id: GO:0000165
    title: MAPK cascade
    statement: >-
      The relay tier conforms to the generic three-tier MAPK cascade motif
      (MODULE:mapk_relay).
  - source_id: GO:0007234
    title: osmosensory signaling via phosphorelay pathway
    statement: >-
      Grounds the Sln1 branch: the GO term for osmosensory signalling mediated
      by a phosphorelay, whose definition names the Sln1 histidine kinase as the
      osmosensor.
  - source_id: GO:0007232
    title: osmosensory signaling pathway via Sho1 osmosensor
    statement: >-
      Grounds the Sho1 branch as a distinct osmosensory input; Sho1, Msb2, Hkr1,
      Ste50, Ste11 and Pbs2 all carry this term in GOA.
  - source_id: PMID:8808622
    title: >-
      Yeast HOG1 MAP kinase cascade is regulated by a multistep phosphorelay
      mechanism in the SLN1-YPD1-SSK1 "two-component" osmosensor
    statement: >-
      Establishes the Sln1-Ypd1-Ssk1 phosphorelay and its phosphotransfer
      chemistry: autophosphorylation of Sln1 His576, then transfer to Sln1
      Asp1144, to Ypd1 His64, and finally to Ssk1 Asp554.
  - source_id: PMID:8183345
    title: A two-component system that regulates an osmosensing MAP kinase cascade in yeast
    statement: >-
      The original identification of a two-component osmosensing system acting
      upstream of the HOG MAP kinase cascade in yeast.
  - source_id: PMID:9482735
    title: >-
      Activation of the yeast SSK2 MAP kinase kinase kinase by the SSK1
      two-component response regulator
    statement: >-
      Shows that the Ssk1 receiver domain binds an N-terminal segment of Ssk2
      and that this binding licenses intramolecular Ssk2 autophosphorylation,
      which is the step connecting the phosphorelay to the kinase relay.
  - source_id: PMID:9180081
    title: >-
      Osmotic activation of the HOG MAPK pathway via Ste11p MAPKKK: scaffold
      role of Pbs2p MAPKK
    statement: >-
      Establishes the Sho1-branch route in which Ste11 acts as the MAP3K and
      Pbs2 itself serves as the scaffold that brings the branch components
      together.
  - source_id: PMID:42545736
    title: >-
      Hybrid histidine kinases shape the architecture of the high osmolarity
      glycerol (HOG) pathway: from Saccharomyces cerevisiae to the priority
      pathogen Aspergillus fumigatus and other filamentous fungi
    statement: >-
      Review used to revise the branch architecture: it sets out the inverse
      relationship between phosphorelay phosphorylation and MAPK output, the
      turgor-dependence of Sln1 kinase activity, Ypd1 as the shared hub
      delivering phosphate to both Ssk1 and Skn7, and the expansion of hybrid
      histidine kinases in filamentous fungi relative to the single Sln1 of S.
      cerevisiae.
    supporting_text: >-
      Two distinct membrane-associated sensors, Sln1p and Sho1p, initiate
      separate upstream signaling pathways that converge at the level of Pbs2p
notes: >-
  This module is the Saccharomyces cerevisiae HOG-pathway realization of the
  generic three-tier MAP kinase relay (MODULE:mapk_relay), and embeds two nested
  conforming bundles: the inner `sln1_phosphorelay` node bundles the Sln1 ->
  Ypd1 -> Ssk1 tiers and conforms to MODULE:two_component_relay, and the inner
  `hog1_relay` node bundles the Ssk2/Ssk22 -> Pbs2 -> Hog1 tiers and conforms to
  mapk_relay. The Sho1 branch and the downstream Hog1 transcriptional output are
  this cascade's free extensions around the conforming cores. Representative
  UniProt members (Sln1 P39928, Ypd1 Q07688, Ssk1 Q07084, Ssk2 P53599, Ssk22
  P25390, Pbs2 P08018, Hog1 P32485, Sho1 P40073, Msb2 P32334, Hkr1 P41809,
  Ste50 P25344, Ste11 P23561) were verified against UniProt. No matching
  UniProt-seed PAINT IBD rows were found in the local interpro/panther cache for
  these S. cerevisiae exemplars, so this species-specific cascade is not assigned
  a PTN ancestry anchor in this pass.

  Signalling polarity. The Sln1 branch is a derepression circuit: Sln1 is a
  kinase under non-stress conditions and the continuous phosphate flow through
  Ypd1 to Ssk1 keeps the MAP kinase module off, so phosphorylation of the relay
  and output of the cascade run in opposite directions. Only unphosphorylated
  Ssk1 binds Ssk2/Ssk22, and efficient activation requires a dimer of
  unphosphorylated Ssk1, which makes the step effectively thresholded. Because
  Ypd1 binding shields the Ssk1 aspartyl phosphate from hydrolysis, phospho-Ssk1
  is long-lived in cells, so how the relay is reset quickly enough for a rapid
  response is unresolved (no dedicated phospho-aspartate phosphatase is known);
  this is recorded as a knowledge gap rather than modelled.

  Branch scope. Ypd1 also delivers phosphate to the nuclear response regulator
  Skn7, which is not part of the canonical HOG kinase cascade but is a branch of
  the same multistep phosphorelay and contributes to hyperosmotic adaptation in
  several filamentous fungi. Skn7 is deliberately not modelled as a part here,
  because this module's boundary is the route from osmosensing to Hog1; the Skn7
  arm belongs with its own transcriptional outputs.

  Species scope. The single hybrid histidine kinase Sln1 is the S. cerevisiae
  exception rather than the fungal rule: filamentous fungi, including the
  priority pathogen Aspergillus fumigatus, encode many functionally distinct
  hybrid histidine kinases feeding one Ypd1 hub, and the group III kinases of
  that expanded repertoire are the target of the phenylpyrrole fungicide
  fludioxonil, which is thought to act by driving a kinase-to-phosphatase
  transition. This module is kept S. cerevisiae-specific: the filamentous-fungal
  repertoire is a different architecture (many sensors, one Hpt bottleneck) and
  would be a separate module rather than extra members here.

  PANTHER grounding: kinase-tier family descriptors carry family-level PTHR ids
  checked against interpro/panther membership (PTHR24055 for every MAPK tier,
  PTHR48013 for all MAP2Ks, including MEK1/MEK2, MKK3/4/5/6/7 and Pbs2/Ste7, per
  the current PANTHER classification, PTHR24361 for MEKK2/MEKK3). PANTHER
  subfamilies are deliberately not used for those tiers: they are not clean
  paralog groups there (e.g. PTHR48013:SF9, named for MEK5, also contains yeast
  Ste7 and plant MKKs), so branch identity is carried by the representative
  members and the PTN evidence rather than by a subfamily id. The Ssk2/Ssk22
  descriptor is the exception: both Ssk2 (P53599) and Ssk22 (P25390) are placed
  in PTHR48016:SF32 in the PANTHER 19.0 member index, so that subfamily is used.
module:
  id: scer_hog1_cascade
  label: Budding yeast (S. cerevisiae) high-osmolarity (Ssk2-Pbs2-Hog1) cascade
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: osmosensory signaling pathway
      term:
        id: GO:0007231
        label: osmosensory signaling pathway
      description: The yeast HOG osmostress MAPK pathway, Ssk2/Ssk22 -> Pbs2 -> Hog1.
  context:
    taxa:
      - preferred_term: Saccharomyces cerevisiae
        term:
          id: NCBITaxon:4932
          label: Saccharomyces cerevisiae
        description: >-
          The HOG cascade is a budding-yeast (S. cerevisiae) osmostress pathway;
          the three-tier relay is conserved with the metazoan stress-activated
          MAPK cascades (it is the fungal counterpart of the p38 cascade), but
          the ortholog set (Ssk2/Pbs2/Hog1) is S. cerevisiae specific.
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: Sln1 phosphorelay osmosensing input (conforms to two_component_relay)
      node:
        id: sln1_phosphorelay
        label: Sln1 -> Ypd1 -> Ssk1 osmosensing phosphorelay
        module_type: SIGNALING_PATHWAY
        description: >-
          High external osmolarity is sensed by the Sln1 two-component
          phosphorelay. In the absence of stress the hybrid sensor kinase Sln1
          autophosphorylates on a conserved histidine, passes the phosphoryl
          group to the aspartate of its own receiver domain, and from there to a
          histidine of the Hpt intermediate Ypd1, which delivers it to the
          receiver aspartate of the response regulator Ssk1 (His -> Asp -> His
          -> Asp). This flow is constitutive and keeps the MAP kinase module
          off. A drop in turgor silences the Sln1 kinase, Ssk1 accumulates
          unphosphorylated, and only in that state does it bind and activate the
          Ssk2/Ssk22 MAP3K tier, so the branch operates by derepression. The
          Sho1 branch (modelled separately) feeds the same MAP2K. This bundle is
          an instance of the generic two-component phosphorelay.
        evidence:
          - source_id: PMID:8808622
            statement: >-
              Defines the tiers and the phosphotransfer order of the branch.
              Sln1 is a transmembrane protein with an extracellular sensor
              domain and cytoplasmic histidine-kinase and receiver domains, and
              Ypd1 binds both Sln1 and Ssk1 to mediate the multistep transfer.
          - source_id: PMID:42545736
            statement: >-
              States the branch's inverse logic: the Sln1 kinase is active in
              the absence of stress and the continuous phosphate flow keeps the
              pathway inactive.
            supporting_text: >-
              In the Sln1p branch, the membrane-bound HHK Sln1p transfers
              phosphoryl groups to the soluble Hpt protein Ypd1p to keep the
              pathway in an inactive state.
        conforms_to:
          - template: two_component_relay
            status: EXACT
            notes: >-
              Sln1 (sensor, GO:0000155) -> Ypd1 (Hpt, GO:0009927) -> Ssk1
              (response regulator, GO:0000156) fills the linear phosphorelay
              tiers with the canonical His->Asp transfer topology.
        parts:
          - order: 1
            role: sensor kinase tier (Sln1)
            node:
              id: sln1_sensor
              label: Sln1 sensor histidine kinase autophosphorylation
              module_type: REACTION
              description: >-
                The osmosensor histidine kinase Sln1 autophosphorylates and
                feeds the relay. Its kinase activity reports turgor pressure and
                depends on contact between its periplasmic region and the cell
                wall, so hyperosmotic shrinkage, cell-wall removal or nystatin
                all silence it and thereby activate the pathway.
              annotons:
                - id: sln1_activity
                  label: Sln1 phosphorelay sensor kinase activity
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: Sln1
                      description: Budding-yeast osmosensor histidine kinase.
                      term:
                        id: UniProtKB:P39928
                        label: Osmosensing histidine protein kinase SLN1
                  function:
                    preferred_term: phosphorelay sensor kinase activity
                    term:
                      id: GO:0000155
                      label: phosphorelay sensor kinase activity
                    targets:
                      - preferred_term: Ypd1
                  processes:
                    - preferred_term: osmosensory signaling via phosphorelay pathway
                      term:
                        id: GO:0007234
                        label: osmosensory signaling via phosphorelay pathway
                  locations:
                    - preferred_term: plasma membrane
                      term:
                        id: GO:0005886
                        label: plasma membrane
                  role_description: >-
                    Senses turgor and initiates the phosphorelay; because the
                    kinase is active without stress, its silencing is the
                    activating event.
                  evidence:
                    - source_id: PMID:12821642
                      title: >-
                        Yeast osmosensor Sln1 and plant cytokinin receptor Cre1
                        respond to changes in turgor pressure
                      statement: >-
                        Reductions in turgor by hyperosmotic stress, nystatin or
                        cell-wall removal activate Hog1 specifically through the
                        Sln1 branch, and the integrity of the Sln1 periplasmic
                        region is essential for sensing.
                    - source_id: PMID:8808622
                      statement: >-
                        The relay is initiated by autophosphorylation of Sln1 at
                        His576, which is then transferred to Sln1 Asp1144.
          - order: 2
            role: Hpt tier (Ypd1)
            node:
              id: ypd1_hpt
              label: Ypd1 histidine phosphotransfer
              module_type: REACTION
              description: >-
                The Hpt intermediate Ypd1 shuttles the phosphoryl group from
                Sln1 to Ssk1. It is small enough to cross the nuclear pore and
                is the single hub of the branch: besides Ssk1 it also
                phosphorylates the nuclear response regulator Skn7, which is
                outside this module's boundary.
              annotons:
                - id: ypd1_activity
                  label: Ypd1 histidine phosphotransfer kinase activity
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: Ypd1
                      description: Budding-yeast phosphorelay intermediate (Hpt) protein.
                      term:
                        id: UniProtKB:Q07688
                        label: Phosphorelay intermediate protein YPD1
                  function:
                    preferred_term: histidine phosphotransfer kinase activity
                    term:
                      id: GO:0009927
                      label: histidine phosphotransfer kinase activity
                    targets:
                      - preferred_term: Ssk1
                  processes:
                    - preferred_term: osmosensory signaling via phosphorelay pathway
                      term:
                        id: GO:0007234
                        label: osmosensory signaling via phosphorelay pathway
                  role_description: >-
                    Relays the phosphoryl group from Sln1 to Ssk1, and shields
                    the Ssk1 aspartyl phosphate from hydrolysis while bound.
                  evidence:
                    - source_id: PMID:8808622
                      statement: >-
                        Ypd1 accepts the phosphoryl group on His64 and transfers
                        it to Ssk1 Asp554.
                    - source_id: PMID:42545736
                      statement: >-
                        Ypd1 shuttles between cytoplasm and nucleus and
                        phosphorylates both the cytoplasmic Ssk1 and the nuclear
                        Skn7, making it the hub of the multistep phosphorelay.
                      supporting_text: >-
                        While shuttling between the cytoplasm and the nucleus,
                        it can transfer phosphoryl groups to Asp residues in the
                        two response regulators of S. cerevisiae: the
                        cytoplasmic Ssk1p and the nuclear Skn7p
          - order: 3
            role: response regulator tier (Ssk1)
            node:
              id: ssk1_rr
              label: Ssk1 response regulator
              module_type: REACTION
              description: >-
                The response regulator Ssk1 receives the phosphoryl group;
                phosphorylated Ssk1 cannot bind Ssk2 or Ssk22, while the
                unphosphorylated (high-osmolarity) form binds the N-terminal
                region of the MAP3K and relieves its autoinhibition. Efficient
                activation needs a dimer of unphosphorylated Ssk1, which makes
                the step respond only once most of the pool is dephosphorylated.
              annotons:
                - id: ssk1_activity
                  label: Ssk1 phosphorelay response regulator activity
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: Ssk1
                      description: Budding-yeast osmolarity two-component response regulator.
                      term:
                        id: UniProtKB:Q07084
                        label: Osmolarity two-component system protein SSK1
                  function:
                    preferred_term: phosphorelay response regulator activity
                    term:
                      id: GO:0000156
                      label: phosphorelay response regulator activity
                  processes:
                    - preferred_term: osmosensory signaling pathway
                      term:
                        id: GO:0007231
                        label: osmosensory signaling pathway
                  processes:
                    - preferred_term: osmosensory signaling via phosphorelay pathway
                      term:
                        id: GO:0007234
                        label: osmosensory signaling via phosphorelay pathway
                  role_description: >-
                    Couples the phosphorelay state to the Ssk2/Ssk22 MAP3K tier,
                    with the unphosphorylated form as the active species.
                  evidence:
                    - source_id: PMID:9482735
                      statement: >-
                        The Ssk1 receiver domain interacts with an N-terminal
                        segment of Ssk2, and this interaction is required for
                        the rapid intramolecular autophosphorylation of Ssk2
                        that activates the kinase.
                    - source_id: PMID:42545736
                      statement: >-
                        Phosphorylated Ssk1 is inactive and cannot bind Ssk2 or
                        Ssk22, and efficient MAP3K activation requires a dimer
                        of two unphosphorylated Ssk1 molecules.
                      supporting_text: >-
                        The activity of both proteins is tightly regulated by
                        Ssk1p; in its phosphorylated stage, Ssk1p is inactive
                        and unable to bind to either Ssk2p or Ssk22
        connections:
          - source: sln1_sensor
            target: ypd1_hpt
            connection_type: CAUSES
            description: Sln1 transfers its phosphoryl group to Ypd1.
          - source: ypd1_hpt
            target: ssk1_rr
            connection_type: CAUSES
            description: Ypd1 delivers the phosphoryl group to Ssk1.
    - order: 2
      role: Sho1 branch osmosensing input
      node:
        id: sho1_branch
        label: Sho1/Msb2/Hkr1 -> Ste50 -> Ste11 osmosensing branch
        module_type: SIGNALING_PATHWAY
        description: >-
          The second, functionally redundant osmosensing input. The tetraspan
          membrane protein Sho1 both senses high osmolarity, through
          osmolarity-induced structural changes in its transmembrane domains,
          and scaffolds the branch: its SH3 domain binds a proline-rich motif of
          Pbs2 and its transmembrane interfaces bind the mucin-like
          transmembrane proteins Msb2 and Hkr1 and the membrane anchor Opy2.
          Stress-induced binding of Sho1 to the cytoplasmic adaptor Ste50
          recruits the MAP3K Ste11, which phosphorylates and activates Pbs2.
          Unlike the Sln1 branch this input is activating rather than
          derepressing, and it converges on Pbs2 rather than on Ssk2/Ssk22.
        evidence:
          - source_id: PMID:9180081
            statement: >-
              Establishes Ste11 as the MAP3K of this branch and Pbs2 as its
              scaffold, i.e. the branch converges at the MAP2K tier.
          - source_id: PMID:42545736
            statement: >-
              Summarises the branch: osmolarity-induced Sho1-Ste50 binding, and
              Sho1 interaction with the mucins Msb2 and Hkr1 that recruit Ste11
              and Pbs2.
            supporting_text: >-
              Sho1p also interacts with the mucin-like transmembrane proteins
              Msb2p and Hkr1p, which sense environmental signals, recruit the
              MAPKKK Ste11p and the MAPKK Pbs2p and finally activate the MAPK
              Hog1p
        parts:
          - order: 1
            role: membrane osmosensing and scaffolding (Sho1, Msb2, Hkr1)
            node:
              id: sho1_osmosensing
              label: Sho1 osmosensor and signalling-mucin complex
              module_type: REGULATORY_STEP
              description: >-
                Sho1 oligomerises in the membrane and changes conformation on
                hyperosmotic shift; the signalling mucins Msb2 and Hkr1 are the
                most upstream known elements of the branch and act only in the
                presence of Sho1.
              annotons:
                - id: sho1_osmosensor_activity
                  label: Sho1 osmosensor activity
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: Sho1
                      description: >-
                        Four-transmembrane osmosensor with a cytoplasmic SH3
                        domain.
                      term:
                        id: UniProtKB:P40073
                        label: High osmolarity signaling protein SHO1
                  function:
                    preferred_term: osmosensor activity
                    term:
                      id: GO:0005034
                      label: osmosensor activity
                  processes:
                    - preferred_term: osmosensory signaling pathway via Sho1 osmosensor
                      term:
                        id: GO:0007232
                        label: osmosensory signaling pathway via Sho1 osmosensor
                  locations:
                    - preferred_term: plasma membrane
                      term:
                        id: GO:0005886
                        label: plasma membrane
                  role_description: >-
                    Senses the hyperosmotic shift at the membrane and nucleates
                    the branch complex.
                  evidence:
                    - source_id: PMID:25898136
                      title: >-
                        Osmosensing and scaffolding functions of the oligomeric
                        four-transmembrane domain osmosensor Sho1
                      statement: >-
                        High external osmolarity induces structural changes in
                        the Sho1 transmembrane domains and Sho1 binding to
                        Ste50, leading to Hog1 activation; the Sho1 oligomer
                        also scaffolds Opy2 and Hkr1.
                    - source_id: PMID:7624781
                      title: >-
                        Activation of yeast PBS2 MAPKK by MAPKKKs or by binding
                        of an SH3-containing osmosensor
                      statement: >-
                        The source of GOA's osmosensor-activity (GO:0005034,
                        IPI) and HOG-pathway annotations for Sho1: binding of
                        the SH3-containing osmosensor to Pbs2 activates the
                        MAP2K.
                - id: sho1_scaffold_activity
                  label: Sho1 MAP kinase scaffold activity
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: Sho1
                      term:
                        id: UniProtKB:P40073
                        label: High osmolarity signaling protein SHO1
                  function:
                    preferred_term: MAP kinase scaffold activity
                    term:
                      id: GO:0005078
                      label: MAP kinase scaffold activity
                    targets:
                      - preferred_term: Pbs2 proline-rich SH3-binding motif
                  role_description: >-
                    Holds the branch components together; the sensing and
                    scaffolding roles are kept as separate annotons because the
                    SH3-mediated assembly is a distinct activity from
                    osmosensing.
                  evidence:
                    - source_id: PMID:15200958
                      title: >-
                        Protein-protein interaction affinity plays a crucial role
                        in controlling the Sho1p-mediated signal transduction
                        pathway in yeast
                      statement: >-
                        Graded weakening of the Sho1 SH3 domain's affinity for
                        Pbs2 produces a proportional loss of HOG-pathway output,
                        establishing the SH3-Pbs2 interaction as the functional
                        link of this branch.
                - id: mucin_osmosensor_activity
                  label: Msb2/Hkr1 signalling-mucin osmosensing
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: Msb2/Hkr1 signalling mucins
                      description: >-
                        Mucin-like transmembrane proteins that act upstream of
                        Sho1 and define two sub-branches; they share a PANTHER
                        family.
                      term:
                        id: PANTHER:PTHR35778
                        label: SIGNALING MUCIN HKR1-RELATED
                      representative_members:
                        - preferred_term: Msb2
                          term:
                            id: UniProtKB:P32334
                            label: Signaling mucin MSB2
                        - preferred_term: Hkr1
                          term:
                            id: UniProtKB:P41809
                            label: Signaling mucin HKR1
                  function:
                    preferred_term: osmosensor activity
                    term:
                      id: GO:0005034
                      label: osmosensor activity
                  processes:
                    - preferred_term: osmosensory signaling pathway via Sho1 osmosensor
                      term:
                        id: GO:0007232
                        label: osmosensory signaling pathway via Sho1 osmosensor
                  locations:
                    - preferred_term: plasma membrane
                      term:
                        id: GO:0005886
                        label: plasma membrane
                  role_description: >-
                    Candidate osmosensors of the branch, each forming a separate
                    complex with Sho1 and defining its own sub-branch.
                  notes: >-
                    The osmosensor activity follows GOA, where it rests on
                    genetic evidence: MSB2 GO:0005034 IMP (PMID:12052881, SGD)
                    and HKR1 GO:0005034 IGI with MSB2 (PMID:17627274, SGD), with
                    a PANTHER IBA (PTN002183784) on both. Neither protein has
                    been shown to transduce an osmotic stimulus directly; the
                    authors call them potential osmosensors, and the physical
                    input is recorded as a knowledge gap.
                  evidence:
                    - source_id: PMID:12052881
                      title: >-
                        A third osmosensing branch in Saccharomyces cerevisiae
                        requires the Msb2 protein and functions in parallel with
                        the Sho1 branch.
                      statement: >-
                        Msb2 was identified in a screen for a second osmosensor
                        upstream of Ste11 and is partially redundant with Sho1;
                        this is the source of the SGD IMP annotation of MSB2 to
                        GO:0005034.
                      supporting_text: >-
                        These observations indicate that Msb2 is partially
                        redundant with the Sho1 osmosensing branch for the
                        activation of Ste11.
                    - source_id: PMID:17627274
                      statement: >-
                        Source of the SGD IGI annotation of HKR1 to GO:0005034;
                        the authors present both mucins as potential, not
                        demonstrated, osmosensors.
                      supporting_text: >-
                        we show that the mucin-like transmembrane proteins Hkr1
                        and Msb2 are the potential osmosensors for the SHO1
                        branch
                    - source_id: PMID:17627274
                      title: >-
                        Transmembrane mucins Hkr1 and Msb2 are putative
                        osmosensors in the SHO1 branch of yeast HOG pathway
                      statement: >-
                        Hyperactive Hkr1 and Msb2 activate the pathway only when
                        Sho1 is present, whereas a hyperactive Sho1 mutant acts
                        without them, placing the mucins most upstream in the
                        branch.
          - order: 2
            role: adaptor-mediated MAP3K recruitment (Ste50, Ste11)
            node:
              id: ste50_ste11_activation
              label: Ste50-dependent Ste11 MAP3K activation of Pbs2
              module_type: REACTION
              description: >-
                The adaptor Ste50 links the sensing complex to the MAP3K Ste11,
                whose kinase activity is directed onto Pbs2 in the Sho1 branch.
                Ste50 also associates with the membrane anchor Opy2, and the
                same Ste50-Ste11 pair serves other MAPK pathways, so pathway
