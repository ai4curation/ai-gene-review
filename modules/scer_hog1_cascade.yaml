  connections:
    - source: sln1_phosphorelay
      target: hog1_relay
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The Sln1 phosphorelay (via unphosphorylated Ssk1) activates the
        Ssk2/Ssk22 MAP3K tier; under non-stress conditions the same relay holds
        that tier off.
    - source: sho1_branch
      target: hog1_relay
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The Sho1 branch enters the relay one tier lower, at Pbs2: Ste11
        phosphorylates the MAP2K directly, so this branch does not use the
        Ssk2/Ssk22 tier.
    - source: hog1_relay
      target: hog1_output
      connection_type: PROVIDES_INPUT_FOR
      description: Active Hog1 drives the osmostress transcriptional program.
  knowledge_gaps:
    - gap_statement: >-
        How the Sln1 branch is reset fast enough for a rapid osmotic response is
        unknown: phosphorylated Ssk1 is intrinsically short-lived but is
        stabilised for hours in cells by bound Ypd1, and no phospho-aspartate
        phosphatase acting on Ssk1 has been identified; back-transfer through a
        kinase-to-phosphatase switch upstream is one proposed mechanism.
      boundary: >-
        Model the phosphorelay by its tiers and the derepression logic; do not
        assert a dedicated Ssk1 phosphatase or a back-transfer reaction as part
        of the module.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The proximal physical stimulus of the Sho1 branch is not resolved: Sho1,
        Msb2 and Hkr1 are each described as putative osmosensors and the branch
        responds to the same hyperosmotic shift as the Sln1 branch, but what each
        protein actually detects, and how the two sub-branches differ in input,
        are unknown.
      boundary: >-
        Assign osmosensor activity as GOA does (IMP for MSB2, IGI for HKR1;
        genetic evidence only) and describe the complex
        architecture; do not assert a distinct stimulus for Msb2 versus Hkr1.
      gap_kind:
        - BIOLOGY
