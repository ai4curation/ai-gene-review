id: MODULE:dmel_micos_complex
title: MICOS complex in Drosophila melanogaster
description: >-
  The mitochondrial contact site and cristae organizing system (MICOS) is an inner membrane
  complex enriched at crista junctions. It stabilises crista junctions, shapes cristae and
  links the inner membrane to the outer membrane. MICOS is made of two subcomplexes: a Mic60
  subcomplex, built on Mitofilin (Mic60) with the CHCH-domain protein Chchd3 (Mic19), and
  a Mic10 subcomplex containing the membrane-bending protein Mic10 together with QIL1 (Mic13)
  and the apolipoprotein-domain protein Mic26-27. Drosophila has three Mic10 paralogs: Mic10b
  is broadly expressed, whereas Mic10a and Mic10c are testis-specific.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001942
  title: 'FlyBase gene group MICOS: Mitochondrial contact site and cristae organizing system
    complexes'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as mitochondrial contact site
    and cristae organizing system complexes (MICOS); this module models that group.
- source_id: GO:0061617
  title: MICOS complex
  statement: >-
    GO term grounding the module as MICOS complex.
notes: >-
  The three FlyBase MICOS variants differ only in the Mic10 paralog and are modelled as one
  complex with a Mic10 variant set. The assignment of subunits to the Mic60 and Mic10 subcomplexes
  follows the conserved yeast and mammalian organisation. FlyBase groups realized by this
  module: MICOS (FBgg0001942). Subgroups folded into it: MICOS-C10B, MICOS-C10C, MICOS-C10A.
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_micos_complex.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
