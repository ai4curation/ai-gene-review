id: MODULE:dmel_cohesin_complexes
title: Mitotic and meiotic cohesin complexes in Drosophila melanogaster
description: >-
  Cohesin is a ring-shaped SMC complex that holds sister chromatids together from DNA replication
  until anaphase and also organizes interphase chromatin into loops. The ring is built from
  the SMC1-SMC3 heterodimer, whose ATPase heads are bridged by a kleisin subunit, which in
  turn binds a stromalin (SA) subunit. In mitotic cells the kleisin is Rad21, encoded in Drosophila
  by verthandi (vtd), and the SA subunit is SA1; separase cleavage of Rad21 opens the ring
  at anaphase. Drosophila meiosis uses meiosis-specific cohesion proteins: C(2)M, a kleisin-family
  protein required for synaptonemal complex formation, and Solo and Sunn, which are required
  for meiotic centromeric cohesion.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000156
  title: 'FlyBase gene group COHSN: Mitotic cohesin complex'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as mitotic cohesin complex (COHSN);
    this module models that group.
- source_id: FB:FBgg0001799
  title: 'FlyBase gene group COHSN-SOLO-SUNN: Meiotic cohesin complex solo-sunn variant'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as meiotic cohesin complex solo-sunn
    variant (COHSN-SOLO-SUNN); this module models that group.
- source_id: FB:FBgg0001800
  title: 'FlyBase gene group COHSN-C2M-SA: Meiotic cohesin complex c2m-sa variant'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as meiotic cohesin complex c2m-sa
    variant (COHSN-C2M-SA); this module models that group.
- source_id: GO:0008278
  title: cohesin complex
  statement: >-
    GO term grounding the module as cohesin complex.
notes: >-
  The three FlyBase groups (COHSN, COHSN-SOLO-SUNN, COHSN-C2M-SA) share SMC1 and SMC3, which
  are modelled once as the core part; the variant-specific subunits form a variant set. The
  meiotic complex term is placed on the meiotic variant nodes even though each node lists
  only its non-SMC subunits. Cohesin loaders (Nipped-B, Mau-2), Pds5, Wapl, separase and shugoshin
  (MEI-S332) are regulators outside the module. FlyBase groups realized by this module: COHSN
  (FBgg0000156), COHSN-SOLO-SUNN (FBgg0001799), COHSN-C2M-SA (FBgg0001800). Participants were
  generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_cohesin_complexes.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
