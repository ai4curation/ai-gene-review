id: MODULE:glucarate_galactarate_catabolism
title: Bacterial D-glucarate and D-galactarate catabolism
description: >-
  A bacterial aldarate catabolic pathway in which substrate-specific
  dehydratases convert D-glucarate (glucarate dehydratase, GudD) or
  D-galactarate (galactarate dehydratase, GarD) to the common intermediate
  5-dehydro-4-deoxy-D-glucarate (5-keto-4-deoxy-D-glucarate, KDG). Two
  alternative downstream routes then dispose of KDG. In the oxidative route of
  Pseudomonas, Acinetobacter and other Proteobacteria and Actinobacteria, KDG
  dehydratase (KDGDH) forms 2,5-dioxopentanoate (alpha-ketoglutaric
  semialdehyde), which alpha-ketoglutaric semialdehyde dehydrogenase (KGSADH)
  oxidizes to 2-oxoglutarate. In the aldolase route of Escherichia coli and
  other Enterobacteriaceae, KDG aldolase (GarL) cleaves KDG to pyruvate and
  tartronate semialdehyde. Tartronate semialdehyde reductase (GarR) then forms
  D-glycerate, and glycerate 2-kinase (GarK) phosphorylates it to
  2-phosphoglycerate. Organisms can encode either or both substrate-entry
  reactions.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: file:modules/glucarate_galactarate_catabolism-deep-research-openscientist.md
    title: OpenScientist review of bacterial glucarate and galactarate catabolism
    statement: >-
      Module-level retrieval supports the alternative substrate-entry branches,
      their convergence on a common intermediate, and exclusion of transport,
      regulation, and downstream central metabolism.
  - source_id: GO:0042838
    title: D-glucarate catabolic process
    statement: >-
      GO:0042838 captures the D-glucarate branch entered by GudD and either
      downstream route.
  - source_id: GO:0046392
    title: D-galactarate catabolic process
    statement: >-
      GO:0046392 captures the D-galactarate branch entered by GarD and either
      downstream route.
  - source_id: PMID:9772162
    title: 'Evolution of enzymatic activities in the enolase superfamily: characterization of the (D)-glucarate/galactarate catabolic pathway in Escherichia coli.'
    statement: >-
      Defines the enterobacterial route: GudD and GarD entry, GarL aldolase,
      GarR reductase and a glycerate kinase forming 2-phosphoglycerate.
    supporting_text: >-
      These encode, in
      three transcriptional units, (D)-glucarate dehydratase (GlucD), galactarate
      dehydratase, 5-keto-4-deoxy-(D)-glucarate aldolase, tartronate semialdehyde
      reductase, a glycerate kinase that generates 2-phosphoglycerate as product
  - source_id: PMID:18364348
    title: New insights into the alternative D-glucarate degradation pathway.
    statement: >-
      Defines the oxidative ("alternative") route in Acinetobacter baylyi ADP1
      by genome-wide deletion profiling and in vitro reconstitution with
      purified GudD, KDGDH and KGSADH.
    supporting_text: >-
      We describe here the kinetic characterization of D-glucarate
      dehydratase, d-5-keto-4-deoxyglucarate dehydratase, and of cooperative
      alpha-ketoglutarate semialdehyde dehydrogenase.
  - source_id: PMID:25823014
    title: An in vivo metabolic approach for deciphering the product specificity of glycerate kinase proves that both E. coli's glycerate kinases generate 2-phosphoglycerate.
    statement: >-
      Establishes 2-phosphoglycerate as the GarK product, fixing the end point
      of the aldolase route.
    supporting_text: both E. coli's glycerate kinases produce 2-phosphoglycerate
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
    title: OpenScientist PSEPK glucarate and galactarate catabolism synthesis
    statement: >-
      Species-aware retrieval supports the oxidative route in P. putida KT2440
      and identifies aldarate-locus PP_3602 as the leading terminal-enzyme
      candidate, while leaving its distinction from other EC 1.2.1.26 paralogs
      untested.
  - source_id: PMID:17202142
    title: alpha-ketoglutaric semialdehyde dehydrogenase isozymes involved in metabolic pathways of D-glucarate, D-galactarate, and hydroxy-L-proline. Molecular and metabolic convergent evolution.
    statement: >-
      Biochemical characterization in Azospirillum brasilense establishes high
      alphaKGSA specificity with pathway-linked NAD+- and NADP+-dependent
      KGSADH isozymes.
    supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
  - source_id: PMID:16835232
    title: 'A novel alpha-ketoglutaric semialdehyde dehydrogenase: evolutionary insight into an alternative pathway of bacterial L-arabinose metabolism.'
    statement: >-
      Orthologous A. brasilense enzymology supports alphaKGSA as a preferred
      substrate of the KGSADH reaction class.
    supporting_text: "Higher catalytic efficiency of ALDH was found with alphaKGSA and succinic semialdehyde among the tested aldehyde substrates."
notes: >-
  Boundary: from the substrate-specific aldarate dehydratases to the first
  central-metabolism product, 2-oxoglutarate (oxidative route) or
  2-phosphoglycerate (aldolase route; the pyruvate released by GarL also enters
  central metabolism). Aldarate uptake (GudP/GarP), upstream uronate oxidation
  (Udh), regulation (SdaR, CdaR) and downstream central metabolism are outside
  the module. The two entry reactions are ONE_OR_MORE alternatives because a
  genome may support either substrate or both. The two KDG-disposal routes are
  ROUTE alternatives with different chemistry; a genome normally encodes one.
  The module was generalized from a P. putida KT2440 draft. KT2440 remains an
  exemplar of the oxidative route, alongside the biochemically characterized A.
  baylyi ADP1 enzymes, and E. coli K-12 is the exemplar of the aldolase route.
  Representative members are limited to proteins with experimental evidence or
  reviewed family-rule support in those organisms. The uncharacterized
  Arthrobacter KDGDH used earlier was dropped. KT2440 encodes three KGSADH
  paralogs in PANTHER PTHR43353:SF3 (Q88GW5/PP_3602, Q88NF5/PP_1256,
  Q88JR4/PP_2585); only the aldarate-locus PP_3602 is a representative, and
  its NAD+ versus NADP+ preference is unmeasured. ADP1 KGSADH Q6FFQ0 has the
  NADP+-linked reaction recorded experimentally. Family-review notes: the
  PTHR21599 root PAINT node for glycerate 2-kinase is truthfully UNRESOLVED
  (product specificity is untested outside the Enterobacteriaceae), and the
  PTHR12128 DapA-activity scope is UNRESOLVED because SF66 is mixed. Neither
  affects the subfamily-level assessments that ground these annotons. Module
  QC may report FAMILY_FUNCTION_UNREVIEWED warnings arising from these
  truthful UNRESOLVED verdicts. Two function-conformance warnings are expected.
  (1) gudd_activity reports FAMILY_SCOPE_RESTRICTED for GO:0016836
  (hydro-lyase activity), an ancestor of the annoton function GO:0008872. The
  PTHR48080 review scopes that parent SUBFAMILY_ONLY to a list that includes
  SF4, and scopes GO:0008872 itself SUBFAMILY_ONLY to SF4, which the check
  reports as FAMILY_SUPPORTED. The warning arises because the validator
  treats a SUBFAMILY_ONLY assessment of an ancestor term as restricting
  even when the grounded subfamily is inside its allowed list; it does not
  indicate a scope problem. (2) The KGSADH annoton reports
  ANNOTATION_SUPPORTED, not CORE_SUPPORTED, for PP_3602. Like its paralog
  PP_1256, PP_3602's core function is the proposed cofactor-neutral term
  "2,5-dioxovalerate dehydrogenase [NAD(P)+] activity", which has no GO id
  yet; its retained GO:0004030 annotation supports the annoton function.
  Molecular functions are confined to the
  reaction annotons; no generic cytoplasmic localization is asserted.
