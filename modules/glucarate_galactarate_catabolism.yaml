id: MODULE:glucarate_galactarate_catabolism
title: Glucarate and galactarate catabolism to 2-oxoglutarate
description: >-
  A reusable three-stage aldarate catabolic route in which substrate-specific
  dehydratases convert D-glucarate or D-galactarate to the common intermediate
  5-dehydro-4-deoxy-D-glucarate. A second dehydratase then forms
  2,5-dioxopentanoate, which an aldehyde dehydrogenase-family enzyme oxidizes to
  2-oxoglutarate. Organisms can encode either or both substrate-entry reactions.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: file:modules/bacterial_glucarate_and_galactarate_catabolism-deep-research-openscientist.md
    title: OpenScientist review of bacterial glucarate and galactarate catabolism
    statement: >-
      Module-level retrieval supports the alternative substrate-entry branches,
      their convergence on a two-reaction route to 2-oxoglutarate, and exclusion
      of transport, regulation, and downstream central metabolism.
  - source_id: GO:0042838
    title: D-glucarate catabolic process
    statement: >-
      GO:0042838 captures the D-glucarate branch represented by GudD and the
      common downstream reactions.
  - source_id: GO:0046392
    title: D-galactarate catabolic process
    statement: >-
      GO:0046392 captures the D-galactarate branch represented by GarD and the
      common downstream reactions.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__glucarate_galactarate_catabolism__ppu00053-deep-research-openscientist.md
    title: OpenScientist PSEPK glucarate and galactarate catabolism synthesis
    statement: >-
      Species-aware retrieval supports the three-stage boundary and identifies
      aldarate-locus PP_3602 as the leading terminal-enzyme candidate, while
      leaving its distinction from other EC 1.2.1.26 paralogs untested.
  - source_id: RHEA:14573
    title: glucarate dehydratase reaction
    statement: >-
      Rhea 14573 defines dehydration of D-glucarate to
      5-dehydro-4-deoxy-D-glucarate.
  - source_id: RHEA:16005
    title: galactarate dehydratase reaction
    statement: >-
      Rhea 16005 defines dehydration of galactarate to the same common
      5-dehydro-4-deoxy-D-glucarate intermediate.
  - source_id: RHEA:24608
    title: 5-dehydro-4-deoxyglucarate dehydratase reaction
    statement: >-
      Rhea 24608 defines conversion of the common intermediate to
      2,5-dioxopentanoate, carbon dioxide, and water.
  - source_id: RHEA:11296
    title: 2,5-dioxovalerate dehydrogenase (NADP+) reaction
    statement: >-
      Rhea 11296 defines oxidation of 2,5-dioxopentanoate to 2-oxoglutarate
      with NADP+.
  - source_id: RHEA:47152
    title: 2,5-dioxovalerate dehydrogenase (NAD+) reaction
    statement: >-
      Rhea 47152 defines the corresponding oxidation with NAD+; the preferred
      cofactor of the KT2440 paralogs has not been measured.
  - source_id: PMID:17202142
    title: alpha-ketoglutaric semialdehyde dehydrogenase isozymes involved in metabolic pathways of D-glucarate, D-galactarate, and hydroxy-L-proline. Molecular and metabolic convergent evolution.
    statement: >-
      Biochemical characterization in Azospirillum brasilense establishes high
      alphaKGSA specificity with pathway-linked NAD+- and NADP+-dependent
      KGSADH isozymes.
    supporting_text: "KGSADH-II and KGSADH-III showed similar high substrate specificity for alphaKGSA and different coenzyme specificity"
  - source_id: PMID:16835232
    title: 'A novel alpha-ketoglutaric semialdehyde dehydrogenase: evolutionary insight into an alternative pathway of bacterial L-arabinose metabolism.'
    statement: >-
      Orthologous A. brasilense enzymology supports alphaKGSA as a preferred
      substrate of the KGSADH reaction class.
    supporting_text: "Higher catalytic efficiency of ALDH was found with alphaKGSA and succinic semialdehyde among the tested aldehyde substrates."
  - source_id: file:PSEPK/PP_3599/PP_3599-uniprot.txt
    title: UniProtKB entry for PSEPK PP_3599
    statement: >-
      Reviewed Q88GW8 grounds the shared KDGDH reaction in Pseudomonas putida
      KT2440.
notes: >-
  The boundary starts at the substrate-specific aldarate dehydratases and ends
  at 2-oxoglutarate. Aldarate uptake, upstream uronate production, and
  downstream central metabolism are outside the module. The two entry reactions
  are ONE_OR_MORE alternatives because a genome may support either substrate or
  both. The PSEPK OpenScientist synthesis supports this boundary but is treated
  as retrieval context; exact functions remain grounded in GO, Rhea, UniProt,
  PANTHER, and PAINT records. Molecular functions are confined to the reaction
  annotons; no generic cytoplasmic localization is asserted. KT2440 encodes
  three KGSADH-family paralogs (Q88GW5, Q88NF5, and Q88JR4). Only the
  synteny-favored Q88GW5 is represented in the aldarate reaction leaf;
  Q88NF5 and Q88JR4 remain comparison paralogs rather than pathway members.
  NAD+ versus NADP+ preference has not been established for Q88GW5.
