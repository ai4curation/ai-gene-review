        label: SUFU release and Fused-family phosphorylation of Ci/GLI
        module_type: REGULATORY_STEP
        description: >-
          Active Smoothened blocks the processing cassette and drives the
          opposite reaction: Suppressor of fused releases full-length Ci/GLI,
          and Fused-family kinases phosphorylate it on conserved sites that
          promote activator function. The compartment in which this happens is
          the main lineage difference in the pathway and is modeled as a variant.
        concepts:
