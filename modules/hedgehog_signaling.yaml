    - order: 6
      role: Transcriptional output
      node:
        id: ci_gli_transcriptional_output
        label: Ci/GLI activator-driven target-gene expression
        module_type: REGULATORY_STEP
        description: >-
          The activator form of Ci/GLI enters the nucleus and induces Hedgehog
          target genes, among them the pathway's own negative regulators
          (patched, and HHIP in vertebrates) and, in vertebrates, the
          amplifying paralog GLI1. The balance between activator and repressor
          forms, not the presence of ligand alone, is what the target genes read.
        annotons:
