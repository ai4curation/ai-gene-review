  connections:
    - source: hh_ligand_biogenesis
      target: hh_reception
      connection_type: PROVIDES_INPUT_FOR
      description: The released dually lipidated ligand is the input to the receiving cell.
    - source: hh_reception
      target: smo_activation
      connection_type: CAUSES
      description: >-
        Ligand-bound Patched stops restricting Smoothened, which is what
        activates the transducer.
    - source: patched_receptor
      target: smo_transducer
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Unliganded Patched holds Smoothened off; this is the edge the ligand
        removes, and it is the reason the pathway is drawn as de-repression.
    - source: smo_activation
      target: ci_gli_repressor_processing
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Active Smoothened shuts down the PKA-primed processing cassette, chiefly
        by inhibiting PKA.
    - source: smo_activation
      target: ci_gli_activation
      connection_type: CAUSES
      description: Active Smoothened drives SUFU release and Fused-family phosphorylation.
    - source: ci_gli_repressor_processing
      target: ci_gli_transcriptional_output
      connection_type: NEGATIVELY_REGULATES
      description: The repressor form silences the same target genes the activator induces.
    - source: ci_gli_activation
      target: ci_gli_transcriptional_output
      connection_type: CAUSES
      description: The activator form induces Hedgehog target genes.
    - source: ci_gli_transcriptional_output
      target: hh_reception
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Target-gene feedback: patched is itself a Hedgehog target gene, and in
        vertebrates so is HHIP, so output raises the reception threshold.
