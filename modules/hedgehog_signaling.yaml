            term:
              id: GO:0045880
              label: positive regulation of smoothened signaling pathway
        evidence:
          - source_id: PMID:31279575
            title: Phosphorylation of Ci/Gli by Fused Family Kinases Promotes Hedgehog Signaling.
            statement: >-
              Drosophila Fu phosphorylates Ci, and the vertebrate kinases ULK3
              and STK36 phosphorylate GLI2 on conserved sites, making this a
              single conserved activation step with lineage-specific kinases.
            supporting_text: >-
              Furthermore, we provide evidence that Sonic hedgehog (Shh)
              activates Gli2 by stimulating its phosphorylation on conserved
              sites through the Fu-family kinases ULK3 and mFu/STK36 in a manner
              depending on Gli2 ciliary localization.
