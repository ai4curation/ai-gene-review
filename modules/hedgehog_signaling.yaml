                      label: PTN001836086
                    description: >-
                      PTHR45718 node with IBD support for the smoothened
                      signaling pathway (P:GO:0007224). Its seeds are the mouse
                      and human GLI paralogs and zebrafish gli genes; Drosophila
                      ci sits in the same family but is not a seed of this node,
