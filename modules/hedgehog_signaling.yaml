id: MODULE:hedgehog_signaling
title: Pan-metazoan Hedgehog/Smoothened signaling pathway module
description: >-
  A taxon-neutral decomposition of Hedgehog (Hh) signaling, the metazoan
  cell-cell communication system in which a dually lipidated Hedgehog ligand
  released by a signal-sending cell controls the activator/repressor balance of
  Ci/GLI zinc-finger transcription factors in a receiving cell. The module is
  written around the segments that are shared from cnidarians and insects to
  vertebrates: autocatalytic cholesterol-coupled processing and N-terminal
  palmitoylation of the ligand; reception by the twelve-pass Patched receptor
  and its Ig/fibronectin-domain co-receptors; relief of Patched-mediated
  restriction of sterol access to the class-F receptor Smoothened; kinase-driven
  proteolytic processing of Ci/GLI into a transcriptional repressor when the
  pathway is off; and Smoothened-dependent conversion of Ci/GLI into an
  activator through Suppressor of fused, Fused-family kinases, and a kinesin-4
  scaffold. Where lineages differ they are modeled as variants on an explicit
  axis rather than as separate pathways: the vertebrate implementation runs the
  activation step in the primary cilium with GPR161, intraflagellar transport,
  and KIF7, while the Drosophila implementation runs the equivalent step on a
  cytoplasmic Hedgehog signaling complex nucleated by the Costal-2 kinesin at
  the plasma membrane. Sonic hedgehog (SHH) is the vertebrate exemplar ligand,
  but it is one of three vertebrate paralogs of the single ancestral Hedgehog
  ligand and is used here only as a representative member.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0007224
    title: smoothened signaling pathway
    statement: >-
      The module core is grounded in the GO biological-process term for
      Hedgehog signal transduction through Smoothened.
  - source_id: PMID:24311597
    title: Structural basis of SUFU-GLI interaction in human Hedgehog signalling regulation.
    statement: Hedgehog signaling is a broadly conserved metazoan developmental pathway.
    supporting_text: >-
      Hedgehog signalling plays a fundamental role in the control of metazoan
      development, cell proliferation and differentiation
  - source_id: PMID:19592253
    title: >-
      The mammalian Cos2 homolog Kif7 plays an essential role in modulating Hh
      signal transduction during development.
    statement: >-
      The pathway framework is conserved across animals while individual
      components differ between lineages, which is why lineage-specific steps
      are modeled here as variants of a shared core.
    supporting_text: >-
      The Hedgehog (Hh) signaling pathway regulates development in animals
      ranging from flies to humans. Although its framework is conserved,
      differences in pathway components have been reported.
  - source_id: PMID:31279575
    title: Phosphorylation of Ci/Gli by Fused Family Kinases Promotes Hedgehog Signaling.
    statement: >-
      Fused-family kinase phosphorylation of Ci/GLI is a conserved activation
      mechanism shared by Drosophila Fu and the vertebrate kinases STK36 and
      ULK3, supporting a single pan-metazoan activation step.
    supporting_text: >-
      Hence, Fu-family kinase-mediated phosphorylation of Ci/Gli serves as a
      conserved mechanism that activates the Hh pathway transcription factor.
  - source_id: PMID:16204193
    title: The function and expansion of the Patched- and Hedgehog-related homologs in C. elegans.
    statement: >-
      The module is pan-metazoan but not universal in metazoans: nematodes lack
      recognizable Hedgehog and Smoothened while retaining expanded
      Patched-related and Hedgehog-related families.
    supporting_text: >-
      In Caenorhabditis elegans, the Hh signaling pathway has undergone
      considerable divergence. Surprisingly, obvious Smo and Hh homologs are
      absent whereas PTC, PTC-related (PTR), and a large family of nematode
      Hh-related (Hh-r) proteins are present.
  - source_id: PANTHER:PTN001726121
    title: PAINT Hedgehog ligand ancestral node
    statement: >-
      Local PAINT IBD rows place patched binding and smoothened signaling
      pathway participation at a PTHR11889 node whose seeds span Drosophila hh
      (FB:FBgn0004644), mouse, zebrafish, and the three human Hedgehog ligands,
      which is the evolutionary anchor for treating the ligand step as ancestral.
  - source_id: PANTHER:PTN000885245
    title: PAINT Smoothened ancestral node
    statement: >-
      Local PAINT IBD rows support smoothened signaling pathway participation,
      patched binding, and ciliary localization at a PTHR11309 node seeded by
      Drosophila smo (FB:FBgn0003444), mouse, zebrafish, and human SMO.
  - source_id: PANTHER:PTN000859153
    title: PAINT Suppressor of fused ancestral node
    statement: >-
      Local PAINT IBD rows support protein sequestering activity and negative
      regulation of the smoothened signaling pathway at a PTHR10928 node whose
      seeds include Drosophila Su(fu) (FB:FBgn0005355), mouse, zebrafish, and
      human SUFU.
  - source_id: PANTHER:PTN001836086
    title: PAINT Ci/GLI ancestral node
    statement: >-
      Local PAINT IBD rows support smoothened signaling pathway participation at
      a PTHR45718 node seeded by the mouse and human GLI paralogs and zebrafish
      gli genes; Drosophila ci belongs to the same family but is not among the
      seeds of this node.
  - source_id: Reactome:R-HSA-445448
    title: HHIP binds Hedgehog
    statement: >-
      Secreted HHIP sequestration of Hedgehog ligand is curated as a distinct
      reception-tier event, modeled here in the vertebrate accessory variant.
  - source_id: Reactome:R-HSA-5610766
    title: >-
      The intraflagellar transport A (IFT-A) complex is required for the transit
      of GLI:SUFU complexes to the ciliary base
    statement: >-
      Intraflagellar transport of GLI:SUFU complexes is specific to the
      cilium-based vertebrate implementation of the activation step.
  - source_id: Reactome:R-HSA-5610767
    title: >-
      The intraflagellar transport B (IFT-B) complex is required for the transit
      of GLI:SUFU complexes to the ciliary tip
    statement: >-
      Anterograde intraflagellar transport delivers GLI:SUFU to the ciliary tip
      in the vertebrate variant.
  - source_id: Reactome:R-HSA-5635839
    title: "ULK3:SUFU dissociates"
    statement: >-
      Release of GLI from SUFU downstream of a Fused-family kinase is curated as
      a discrete step of the activation segment.
notes: >-
  Boundary decisions. This document replaces an earlier, explicitly vertebrate
  sketch of the same module id; the pan-metazoan scope is the requested change,
  so the ciliary machinery that was previously stated as module-level context
  now sits inside the vertebrate variant, where it belongs. Ligand biogenesis is
  kept inside the module because Hedgehog performs its own autoproteolysis and
  cholesterol transfer, so those are activities of a core participant rather
  than upstream biology. Transcriptional targets, tissue-level patterning
  outcomes, and pathway-level crosstalk (Wnt, BMP, primary-cilium assembly) are
  deliberately outside the boundary. HHIP, SCUBE2, and GAS1 are vertebrate
  accessories and are modeled as an optional reception-tier variant rather than
  as core steps; glypicans are modeled alongside them because the same
  heparan-sulfate proteoglycan role is documented in both flies (dally) and
  vertebrates.

  Taxon scope. "Pan-metazoan" here means the module is written for the animal
  clade in which ligand, receptor, transducer, and Ci/GLI effector co-occur,
  which includes cnidarians, most protostomes, and vertebrates. It is not a
  claim of universality: nematodes have lost recognizable Hedgehog and
  Smoothened while expanding Patched-related and Hedgehog-related families
  (PMID:16204193), and any realization in that lineage would be a different
  module, not a variant of this one.

  Grounding provenance. Every UniProt exemplar was taken from a local artifact
  rather than recalled: the PANTHER family entry tables under interpro/panther/
  and the cached GO-CAM activity index gocams/index.tsv. PANTHER family and
  subfamily labels are copied verbatim from interpro/panther/panther.obo, and
  the four PTN ancestral nodes are resolved from the committed PAINT IBD slices.
  Where the pathway has a genuine component whose accession could not be
  verified from a local artifact in this environment, no identifier was invented
  (see knowledge_gaps): the Dispatched release transporter carries no term and
  no representative member, and the Drosophila orthologs of Patched, Fused, and
  Slimb are named only in prose. `just refresh-panther-members` could not be run
  (data.pantherdb.org is blocked by the same egress policy), so several cited
  accessions are absent from interpro/panther/panther-members.tsv and the
  validator reports them as unchecked; each was instead confirmed by hand
  against the committed interpro/panther/<PTHR>/<PTHR>-entries.csv table, which
  lists the same accession, gene symbol, organism, and subfamily.

  Deep research. A module deep-research run was attempted with
  `just module-deep-research-openscientist hedgehog_signaling` and failed
  because the provider host is blocked by this environment's network egress
  policy (403). No deep-research file is therefore present, and none was
  hand-written in place of one.
knowledge_gaps:
  - gap_statement: >-
      The biochemical mechanism by which ligand-free Patched restricts
      Smoothened remains undetermined: whether Patched depletes an activating
      sterol from the Smoothened-accessible leaflet, exports an inhibitor, or
      acts by direct contact is not settled.
    boundary: >-
      It is established that Patched is a twelve-pass RND-like protein with a
      sterol-sensing domain, that it binds the palmitoylated N-terminus of
      Hedgehog, that it moves sterols, and that Hedgehog binding relieves its
      repression of Smoothened; what the transported species is in vivo, and
      whether transport alone accounts for repression, is not.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      This is the one step of the core pathway with no agreed molecular
      mechanism, and it is the step targeted indirectly by every clinical
      Smoothened inhibitor.
    provenance:
      - reference_id: PMID:29995851
        reference_section_type: INTRODUCTION
        supporting_text: >-
          How Patched inhibits Smo is enigmatic but there are studies showing
          that Patched may act indirectly by releasing a small molecule to
          regulate Smo
  - gap_statement: >-
      Which of the two Smoothened-to-PKA mechanisms dominates in vivo, direct
      pseudosubstrate inhibition of the PKA catalytic subunit or Gi-mediated
      lowering of cAMP, is not resolved, and whether the Drosophila pathway uses
      the pseudosubstrate route at all is untested here.
    boundary: >-
      Both mechanisms are demonstrated: Smoothened carries a PKA-inhibitor motif
      that blocks the PKA catalytic site, and Smoothened couples to Gi.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    provenance:
      - reference_id: PMID:36202993
        reference_section_type: ABSTRACT
        supporting_text: >-
          Here we show that SMO uses a decoy substrate sequence to physically
          block the active site of the cAMP-dependent protein kinase (PKA)
          catalytic subunit (PKA-C) and extinguish its enzymatic activity.
  - gap_statement: >-
      Almost none of this module's participants has a curated gene review in this
      repository, so the module's leaf claims rest on PANTHER family membership,
      PAINT nodes and GO-CAM activities rather than on gene-level adjudication of
      each protein's own annotations.
    boundary: >-
      Three of the twenty-seven human exemplars are reviewed. SHH and SMO are
      substantive and now carry no unresolved annotations; GSK3B is complete but
      incidental here, since its only Hedgehog annotation is an electronic
      negative-regulation term kept as non-core. None of the Drosophila exemplars
      is reviewed: the repository holds 134 Drosophila genes, and hh, ptc, smo, ci,
      cos, fu, Su(fu), rasp, ihog, dally, disp and slmb are all absent.
    gap_kind:
      - CURATION
    status: OPEN
    significance: >-
      The pan-metazoan claim is carried by the invertebrate members, and those are
      exactly the ones with no gene-level review. Until Drosophila hh, ptc, smo and
      ci are curated, the protostome half of every assertion here rests on family
      and PAINT evidence alone.
    resolution: >-
      Seed and curate, in this order: PTCH1, SUFU, GLI3, GLI2 and KIF7 on the human
      side, where the least-examined core components sit; then Drosophila hh, ptc,
      smo and ci, which close the pan-metazoan gap; then GPR161, HHAT and STK36.
      Each needs `just fetch-gene`, which calls UniProt and QuickGO, so this is
      blocked in any environment whose egress policy denies those hosts.
  - gap_statement: >-
      The Dispatched release transporter, the Drosophila Patched, Fused, and
      Slimb orthologs, and the Drosophila Suppressor of fused protein could not
      be grounded to verified UniProt accessions from the local artifacts
      available in this session, so those participants are described without
      identifiers.
    boundary: >-
      The biology of each is well established in the literature, and the
      Drosophila Su(fu) gene appears as a PAINT seed (FB:FBgn0005355) for the
      SUFU ancestral node cited here, so the clade-level claim is supported even
      where the protein accession is not recorded.
    gap_kind:
      - CURATION
    status: OPEN
    resolution: >-
      Add the missing accessions from UniProt (or from a PANTHER family slice
      cached for the relevant families) and attach them as representative
      members; this is a data-availability gap, not a biological one. The
      Dispatched family itself is present in the local PANTHER OBO, but no
      member table is cached for it under interpro/panther/, and the UniProt
      and PANTHER services are unreachable from this environment.
    provenance:
      - reference_id: file:interpro/panther/panther.obo
        supporting_text: "name: PROTEIN DISPATCHED-RELATED"
module:
  id: hedgehog_signaling
  label: Pan-metazoan Hedgehog/Smoothened signaling pathway
  module_type: SIGNALING_PATHWAY
  description: >-
    Hedgehog ligand made in one cell is processed, lipidated, and released;
    reception by Patched on a second cell relieves Patched-mediated restriction
    of Smoothened; the resulting Smoothened activity switches Ci/GLI output from
    a proteolytically generated repressor to a full-length activator.
  concepts:
    - preferred_term: smoothened signaling pathway
      term:
        id: GO:0007224
        label: smoothened signaling pathway
      description: >-
        The series of molecular signals generated as a consequence of activation
        of Smoothened by a Hedgehog ligand bound to Patched.
    - preferred_term: pattern specification process
      term:
        id: GO:0007389
        label: pattern specification process
      description: >-
        The ancestral output of the pathway across animals: concentration- and
        duration-dependent Ci/GLI activity assigns positional cell fates.
  context:
    taxa:
      - preferred_term: metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
        description: >-
          Ligand, Patched receptor, Smoothened transducer, Suppressor of fused,
          and Ci/GLI effectors co-occur from cnidarians through insects to
          vertebrates. Nematodes are the well-documented exception.
    cellular_components:
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
        description: Where reception and transduction occur in every lineage.
      - preferred_term: cytoplasm
        term:
          id: GO:0005737
          label: cytoplasm
        description: Where the Ci/GLI processing and activation complexes assemble.
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
        description: Where the Ci/GLI activator and repressor forms act.
  parts:
    - order: 1
      role: Hedgehog ligand biogenesis and release (signal-sending cell)
      node:
        id: hh_ligand_biogenesis
        label: Hedgehog autoprocessing, dual lipidation, and release
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The Hedgehog precursor is its own processing enzyme. Its C-terminal
          Hint/Hog domain cleaves the protein and couples cholesterol to the new
          C-terminus of the N-terminal signaling domain; a membrane-bound
          O-acyltransferase (HHAT in vertebrates, Rasp/Skinny hedgehog in
          Drosophila) then palmitoylates the new N-terminus. The doubly
          lipidated product is membrane-tethered and requires a dedicated
          release transporter to leave the producing cell.
        evidence:
          - source_id: PMID:29995851
            title: Structures of human Patched and its complex with native palmitoylated sonic hedgehog.
            statement: >-
              Autocatalytic cholesterol coupling in the endoplasmic reticulum
              followed by acyltransferase-mediated palmitoylation produces the
              mature, dually lipidated ligand.
            supporting_text: >-
              The Hh precursor undergoes autocatalytic processing in the
              endoplasmic reticulum to release an amino-terminal signaling
              domain (Hh-N) with cholesterol covalently coupled to its carboxyl
              terminus.
          - source_id: PMID:24342078
            title: A new role for Hedgehogs in juxtacrine signaling.
            statement: >-
              The cholesterol-tethered product is actively released by Dispatched
              together with a secreted accessory protein in vertebrates, so
              release is a distinct step rather than passive diffusion.
            supporting_text: >-
              The processed N-terminal fragment would be retained in the cell by
              its cholesterol tail, except it is actively secreted by the
              synergistic actions of Disp and the secreted protein Scube2
        annotons:
          - id: hh_autoprocessing
            label: Hedgehog precursor autoproteolysis
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Hedgehog ligand family (Hint/Hog autoprocessing domain)
                term:
                  id: PANTHER:PTHR11889
                  label: HEDGEHOG
                description: >-
                  The single ancestral Hedgehog ligand family; vertebrates carry
                  the SHH/IHH/DHH paralogs and Drosophila the single hh gene.
                representative_members:
                  - preferred_term: SHH (human)
                    term:
                      id: UniProtKB:Q15465
                      label: Sonic hedgehog protein
                  - preferred_term: hh (Drosophila melanogaster)
                    term:
                      id: UniProtKB:Q02936
                      label: Protein hedgehog
            function:
              preferred_term: intramolecular autoproteolysis of the Hedgehog precursor
              term:
                id: GO:0004175
                label: endopeptidase activity
              substrates:
                - preferred_term: Hedgehog precursor protein
              products:
                - preferred_term: Hedgehog N-terminal signaling domain
                - preferred_term: Hedgehog C-terminal autoprocessing domain
            processes:
              - preferred_term: protein autoprocessing
                term:
                  id: GO:0016540
                  label: protein autoprocessing
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              The ligand cleaves itself; no separate protease is required, which
              is why this step is inside the module rather than upstream of it.
            gocam_associations:
              - model: gomodel:696022cd00000016
                activity: gomodel:696022cd00000016/696022cd00000036
                title: Protein maturation of SHH by autocleavage, autocholesterylation and palmitoylation by HHAT (Human).
          - id: hh_cholesterol_transfer
            label: Hedgehog cholesterol transfer
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Hedgehog ligand family (Hint/Hog autoprocessing domain)
                term:
                  id: PANTHER:PTHR11889
                  label: HEDGEHOG
                representative_members:
                  - preferred_term: SHH (human)
                    term:
                      id: UniProtKB:Q15465
                      label: Sonic hedgehog protein
            function:
              preferred_term: cholesterol transfer onto the Hedgehog signaling domain
              term:
                id: GO:0140853
                label: cholesterol-protein transferase activity
              substrates:
                - preferred_term: cholesterol
                - preferred_term: Hedgehog N-terminal signaling domain
              products:
                - preferred_term: C-terminally cholesterylated Hedgehog signaling domain
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Couples cholesterol to the signaling domain in the same reaction
              cycle as cleavage, tethering the ligand to the membrane and setting
              up the requirement for an active release step.
            gocam_associations:
              - model: gomodel:696022cd00000016
                activity: gomodel:696022cd00000016/696022cd00000045
                title: Protein maturation of SHH by autocleavage, autocholesterylation and palmitoylation by HHAT (Human).
          - id: hh_n_palmitoylation
            label: Hedgehog N-terminal palmitoylation
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Hedgehog acyltransferase family (HHAT / Rasp)
                term:
                  id: PANTHER:PTHR13285
                  label: ACYLTRANSFERASE
                description: >-
                  Membrane-bound O-acyltransferase family containing vertebrate
                  HHAT and Drosophila Rasp; the family term is broader than the
                  Hedgehog-acylating role, which the two representative members
                  pin down.
                representative_members:
                  - preferred_term: HHAT (human)
                    term:
                      id: UniProtKB:Q5VTY9
                      label: Protein-cysteine N-palmitoyltransferase HHAT
                  - preferred_term: rasp (Drosophila melanogaster)
                    term:
                      id: UniProtKB:Q9VZU2
                      label: Protein-cysteine N-palmitoyltransferase Rasp
            function:
              preferred_term: palmitoylation of the Hedgehog N-terminal cysteine
              term:
                id: GO:0019706
                label: protein-cysteine S-palmitoyltransferase activity
              substrates:
                - preferred_term: cholesterylated Hedgehog signaling domain
                - preferred_term: palmitoyl-CoA
              products:
                - preferred_term: dually lipidated Hedgehog signaling domain
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Required for high-activity ligand: the palmitate is the dominant
              contact in the Patched interface, so this step licenses reception
              rather than merely decorating the ligand.
            gocam_associations:
              - model: gomodel:696022cd00000016
                activity: gomodel:696022cd00000016/696022cd00000024
                title: Protein maturation of SHH by autocleavage, autocholesterylation and palmitoylation by HHAT (Human).
          - id: hh_release_transporter
            label: Dispatched-type Hedgehog release transporter
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Dispatched RND-family Hedgehog release transporter
                description: >-
                  Twelve-pass RND-family transporter (Drosophila disp, vertebrate
                  DISP1) required to release cholesterol-tethered Hedgehog from
                  the producing cell. No PANTHER id or representative accession
                  is asserted because neither could be verified against a local
                  artifact; see the module knowledge_gaps.
            function:
              preferred_term: release of membrane-tethered lipidated Hedgehog ligand
            processes:
              - preferred_term: positive regulation of smoothened signaling pathway
                term:
                  id: GO:0045880
                  label: positive regulation of smoothened signaling pathway
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Conserved in flies and vertebrates; without it the processed
              ligand stays on the producing cell and long-range signaling fails.
          - id: mature_hh_ligand
            label: Mature dually lipidated Hedgehog ligand
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Hedgehog ligand family (mature N-terminal signaling domain)
                term:
                  id: PANTHER:PTHR11889
                  label: HEDGEHOG
                representative_members:
                  - preferred_term: SHH (human)
                    term:
                      id: UniProtKB:Q15465
                      label: Sonic hedgehog protein
                  - preferred_term: IHH (human)
                    term:
                      id: UniProtKB:Q14623
                      label: Indian hedgehog protein
                  - preferred_term: DHH (human)
                    term:
                      id: UniProtKB:O43323
                      label: Desert hedgehog protein
                  - preferred_term: hh (Drosophila melanogaster)
                    term:
                      id: UniProtKB:Q02936
                      label: Protein hedgehog
                ancestral_nodes:
                  - preferred_term: PAINT Hedgehog ligand node PTN001726121
                    term:
                      id: PANTHER:PTN001726121
                      label: PTN001726121
                    description: >-
                      PTHR11889 node with IBD support for patched binding
                      (F:GO:0005113), smoothened signaling pathway
                      (P:GO:0007224), and extracellular localization
                      (C:GO:0005576). Its seeds include Drosophila hh
                      (FB:FBgn0004644) alongside mouse, zebrafish, chicken, and
                      the three human ligands, so the ligand role is inferred to
                      predate the protostome/deuterostome split.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN001726121 in PTHR11889.
            function:
              preferred_term: Hedgehog morphogen activity
              term:
                id: GO:0016015
                label: morphogen activity
              targets:
                - preferred_term: Patched receptor
            processes:
              - preferred_term: smoothened signaling pathway
                term:
                  id: GO:0007224
                  label: smoothened signaling pathway
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              The diffusible output of this part and the input to reception;
              acts over a concentration gradient, and in the DHH case largely by
              cell contact rather than at a distance.
            gocam_associations:
              - model: gomodel:696022cd00000016
                activity: gomodel:696022cd00000016/696022cd00000017
                title: Protein maturation of SHH by autocleavage, autocholesterylation and palmitoylation by HHAT (Human).
        connections:
          - source: hh_autoprocessing
            target: hh_cholesterol_transfer
            connection_type: PRECEDES
            description: >-
              Cleavage and cholesterol transfer are two activities of one
              autoprocessing cycle of the same molecule.
            chaining_status: NOT_APPLICABLE
            chaining_note: >-
              Protein-modification steps, not CoA-carrier metabolism; the
              reaction-continuity check does not apply.
          - source: hh_cholesterol_transfer
            target: hh_n_palmitoylation
            connection_type: PRECEDES
            description: The cholesterylated signaling domain is the acyltransferase substrate.
            chaining_status: NOT_APPLICABLE
            chaining_note: Protein-modification chain rather than a CoA-carrier metabolic chain.
          - source: hh_n_palmitoylation
            target: hh_release_transporter
            connection_type: PROVIDES_INPUT_FOR
            description: The dually lipidated ligand is the cargo of the release transporter.
          - source: hh_release_transporter
            target: mature_hh_ligand
            connection_type: CAUSES
            description: Release converts the membrane-tethered product into the diffusible signal.
    - order: 2
      role: Ligand reception at the receiving-cell surface
      node:
        id: hh_reception
        label: Hedgehog reception by Patched and its co-receptors
        module_type: REGULATORY_STEP
        description: >-
          Patched is the ligand-binding receptor and, in the unliganded state,
          the pathway's brake: it restricts Smoothened activity and is relieved
          by ligand binding. Ig/fibronectin-domain co-receptors (Ihog and Boi in
          Drosophila, CDON and BOC in vertebrates) capture ligand and present it
