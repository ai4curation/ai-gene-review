id: MODULE:alginate_polymerization_export
title: Alginate polymerization and export
description: 'A bacterial synthase-dependent alginate-production module: Alg8 polymerizes mannuronate
  with the c-di-GMP-responsive Alg44 partner, periplasmic AlgG and AlgKX support polymer handling, and
  the AlgE outer-membrane channel mediates export. AlgG epimerization changes polymer composition, while
  AlgL removes misplaced periplasmic polymer in a background-dependent homeostasis role. AlgX acetyltransferase
  chemistry, precursor synthesis, extracellular epimerases and upstream regulation are separate processes.'
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: PMID:24034361
  statement: Comparative review establishes the bacterial module boundary and genus-level
    alternatives.
- source_id: PMID:40821665
  statement: Azotobacter review informs source-specific regulation and physiological differences.
- source_id: PMID:25968647
  statement: Direct Pseudomonas experiments link polymerization, subunit interactions and polymer
    modification.
- source_id: PMID:36494359
  statement: Direct KT2440 AlgKX structure/binding and P. aeruginosa interface mutants establish
    polymer-handling roles.
notes: The abstract module distinguishes demonstrated activities from homolog inference. Families
  with substrate-diverse PANTHER assignments are described by verified members and relevant
  domain/function constraints rather than asserted as substrate-specific subfamilies. Alg44 is not
  assigned intrinsic polymerase catalysis. AlgG catalytic activity can be dispensable while its
  polymer-protection role remains required in the characterized P. aeruginosa background. AlgL is an
  optional homeostasis branch, not a required catalytic component of the synthase. AlgKX polymer
  handling is distinct from AlgX acetylation. Exact AlgG chemistry lacks a specific GO MF term and
  is represented with the valid broader GO term plus RHEA:45572; this ontology limitation is not a
  biological knowledge gap. Step order is presentational; the complete dynamic export mechanism has
  not been reconstructed.
