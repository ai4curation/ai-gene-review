id: MODULE:alginate_polymerization_export
title: Alginate polymerization and export
description: >-
  A synthase-dependent bacterial exopolysaccharide module in which the
  inner-membrane Alg8-Alg44 complex polymerizes GDP-mannuronate, periplasmic
  proteins guide and modify the nascent alginate chain, AlgL removes escaped
  polymer, and the AlgE outer-membrane channel exports the product. Precursor
  synthesis, O-acetylation chemistry, and transcriptional regulation are
  separate modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0042121
    title: alginic acid biosynthetic process
    statement: Defines production of the alginate polysaccharide.
  - source_id: GO:0047643
    title: alginate synthase activity
    statement: Defines the polymerization function contributed by the Alg8-Alg44 complex.
  - source_id: RHEA:45572
    title: mannuronan C5-epimerase reaction
    statement: Defines AlgG conversion of mannuronate residues to guluronate residues in alginate.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__alginate-polymerization-export__ppu00543-deep-research-openscientist.md
    title: OpenScientist PSEPK alginate polymerization and export synthesis
    statement: Species-aware retrieval resolves the dedicated alginate operon from the broad exopolysaccharide overview map.
  - source_id: UniProtKB:Q88NC5
    title: Reviewed Pseudomonas putida KT2440 Alg8 exemplar
    statement: Anchors the concrete module to the reviewed KT2440 glycosyltransferase Alg8 sequence.
  - source_id: UniProtKB:Q52463
    title: Reviewed Pseudomonas aeruginosa Alg8 exemplar
    statement: Provides a characterized mannuronan-synthase family exemplar for the catalytic subunit.
  - source_id: UniProtKB:P18895
    title: Reviewed Pseudomonas aeruginosa AlgE exemplar
    statement: Provides a reviewed alginate outer-membrane channel exemplar.
  - source_id: PMID:25968647
    title: Alginate Polymerization and Modification Are Linked in Pseudomonas aeruginosa.
    statement: Directly supports the membrane-embedded Alg8-Alg44 polymerase-copolymerase partnership.
    supporting_text: Alg8 directly interacts with the proposed copolymerase Alg44 while embedded in the cytoplasmic membrane.
  - source_id: PMID:25817996
    title: Dimeric c-di-GMP is required for post-translational regulation of alginate production in Pseudomonas aeruginosa.
    statement: Defines cytoplasmic dimeric c-di-GMP sensing by the Alg44 PilZ domain.
    supporting_text: structure of the cytoplasmic region of Alg44 in complex with dimeric self-intercalated c-di-GMP
  - source_id: PMID:23503314
    title: Insights into the assembly of the alginate biosynthesis machinery in Pseudomonas aeruginosa.
    statement: Supports an envelope-spanning Alg8-Alg44-AlgK-AlgX-AlgE complex.
    supporting_text: Overall experimental evidence was provided for the existence of a multiprotein complex required for alginate polymerization and secretion.
notes: >-
  The polymerase is modeled as a two-part synthase complex: Alg8 supplies
  catalysis and Alg44 binds cyclic-di-GMP and contributes regulatory
  copolymerase function. AlgG maturation and AlgL quality control are optional
  parts because polymerization/export can be distinguished from product
  composition and escaped-polymer removal. AlgI, AlgJ, AlgF, and the
  O-acetyltransferase activity of AlgX belong to the separate alginate
  O-acetylation module.
