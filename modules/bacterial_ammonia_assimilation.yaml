id: MODULE:bacterial_ammonia_assimilation
title: Bacterial NADPH-dependent GS–GOGAT ammonia assimilation
description: Glutamine synthetase and a two-chain NADPH-dependent glutamate synthase couple ammonium incorporation
  to net L-glutamate synthesis. GS uses ATP to amidate L-glutamate; GOGAT transfers the glutamine amide
  nitrogen to 2-oxoglutarate using NADPH, yielding two glutamates. One glutamate replenishes the GS substrate
  pool, giving one net glutamate per turn. This chemistry occurs in Pseudomonas putida, Escherichia coli,
  Bacillus subtilis and Azospirillum brasilense, with differences in enzyme families, regulation, assembly
  and physiological dependence.
status: COMPLETE
scope: CONCRETE
module:
  id: bacterial_ammonia_assimilation
  label: Bacterial NADPH-dependent GS–GOGAT ammonia assimilation
  module_type: METABOLIC_PATHWAY
  concepts:
  - preferred_term: ammonia assimilation cycle
    term:
      id: GO:0019676
      label: ammonia assimilation cycle
  context:
    taxa:
    - preferred_term: Bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
    notes: The reviewed implementations are Pseudomonas putida KT2440, Escherichia coli K-12, Bacillus
      subtilis 168 and sequence-defined Azospirillum brasilense products. Bacterial taxon context does
      not assert presence in every bacterium.
  variant_sets:
