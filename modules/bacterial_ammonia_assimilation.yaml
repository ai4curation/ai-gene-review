                  subunits.
                active_units:
                  - id: gltb_catalytic_large_subunit
                    label: GltB catalytic large subunit
                    role: >-
                      Hydrolyzes L-glutamine, channels ammonia, and performs
                      FMN-dependent reductive amination of 2-oxoglutarate.
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: glutaminase activity
                        term:
                          id: GO:0004359
                          label: glutaminase activity
                      family:
