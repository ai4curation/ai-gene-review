  id: bacterial_ammonia_assimilation
  label: Bacterial NADPH-dependent GS-GOGAT ammonia assimilation
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: ammonia assimilation cycle
      term:
        id: GO:0019676
        label: ammonia assimilation cycle
      description: >-
        Coupled GS-GOGAT reactions that incorporate inorganic ammonium into
        glutamine and glutamate.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          This module represents the bacterial GlnA-GltB/GltD implementation.
  parts:
