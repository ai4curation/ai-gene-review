  statement: Native Bacillus structure independently corroborates complementary subunit chemistry.
  supporting_text: The higher resolution did permit unambiguous assignment of two 4Fe-4S clusters in GltB,
    and a 3Fe-4S clusters and FMN in GltA.
- source_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3973380/?report=xml
  statement: The review supplies an explicit cyclic synthesis and network-boundary interpretation.
  supporting_text: Net glutamate production from 2-oxoglutarate can hereby be achieved not only by GDH
    alone but also by GS-GOGAT coupled together. The latter process expends one ATP.
notes: 'Direct GDH assimilation is an alternative in E. coli and some other bacteria, not a third required
  step or a universal property of every GDH. Native B. subtilis RocG/GudB physiology is primarily catabolic
  under the studied conditions, while C. glutamicum GOGAT is dispensable in tested regimes. High-affinity
  language and numeric kinetic values are not generalized from conserved chemistry. Ferredoxin- and NADH-linked
  GOGAT, transport, nitrogen fixation/reduction, PII/Ntr signaling, GlnA adenylylation and GlnR/TnrA regulation
  are outside the minimal catalytic requirement; their actual gene functions remain in the member reviews.
  The broader nitrogen_cycle module is a coarse neighboring view. No ancestral PTN is asserted: the old
  broad nodes are unnecessary for exact-product requirements and do not establish NADPH specificity or
  universal localization.'
