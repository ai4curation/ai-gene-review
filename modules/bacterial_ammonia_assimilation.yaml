references:
- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC3973380/?report=xml
  title: 'Nitrogen Assimilation in Escherichia coli: Putting Molecular Data into a Systems Perspective'
  findings:
  - statement: E. coli GS–GOGAT and GDH can both produce net glutamate, with ATP expenditure by the coupled
      cycle.
    supporting_text: Net glutamate production from 2-oxoglutarate can hereby be achieved not only by GDH
      alone but also by GS-GOGAT coupled together. The latter process expends one ATP.
  - statement: The large and small chains have complementary glutamine-processing and NADPH electron-input
      functions.
    supporting_text: The GltB protein comprises an amidotransferase domain coupled to a synthase domain
      through an intramolecular ammonium tunnel. The GltD protein delivers the reducing equivalents from
      NADPH to the active site.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review recovered by the normal URL fetcher and read for central chemistry, subunits,
      regulation and physiological boundaries. Canonical PMID24296575 remains an abstract cache. Native
      and comparative primary studies below corroborate the reaction mechanism; comparative Km values
      are not exported to all bacteria.
- id: PMID:24296575
  title: 'Nitrogen assimilation in Escherichia coli: putting molecular data into a systems perspective.'
  findings:
  - statement: The E. coli network includes two assimilation pathways plus transport, signaling and regulation.
    supporting_text: 'two ammonium assimilation pathways (glutamine synthetase

      [GS]-glutamate synthase [glutamine 2-oxoglutarate amidotransferase {GOGAT}] and

      glutamate dehydrogenase [GDH])'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Canonical abstract read; full text is independently cached at the cited PMC URL. Distinguish
      catalytic requirements from network regulation.
- id: PMID:12730324
  title: Nitrogen assimilation and global regulation in Escherichia coli.
  findings:
  - statement: The E. coli Ntr network integrates assimilation with other metabolism.
    supporting_text: 'a network of interacting global regulators

      that senses different aspects of metabolism integrates nitrogen assimilation

      with other metabolic processes.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Review abstract read; Annual Reviews full-text fetch returned HTTP 403. This supplies
      regulatory scope, not a catalytic assay or essentiality claim.
- id: PMID:18421771
  title: 'Structure-function studies of glutamate synthases: a class of self-regulated iron-sulfur flavoenzymes
    essential for nitrogen assimilation.'
  findings:
  - statement: The common GOGAT catalytic region couples an amidotransferase to a flavin synthase through
      an ammonia tunnel.
    supporting_text: 'a PurF- (Type II- or Ntn-) type amidotransferase

      domain is coupled to the synthase domain'
  - statement: The second module supplies FAD-dependent pyridine-nucleotide oxidation.
    supporting_text: acts as a FAD-dependent NAD(P)H oxidoreductase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Review abstract read; full publisher retrieval returned HTTP 403. Claims corroborated
      by primary PMID:10785395,11188694,31473159 and full PMID:34931064. Its title does not establish
      universal physiological essentiality or NADPH specificity of every family member.
- id: PMID:22625175
  title: 'Control of glutamate homeostasis in Bacillus subtilis: a complex interplay between ammonium
    assimilation, glutamate biosynthesis and degradation.'
  findings:
  - statement: B. subtilis combines GS and GOGAT for glutamate biosynthesis.
    supporting_text: 'Glutamate, the major amino group donor in anabolism, is synthesized by the

      combined action of the glutamine synthetase (GS) and the glutamate synthase

      (GOGAT) in Bacillus subtilis.'
  - statement: Feedback-inhibited GS activates GlnR and inhibits TnrA DNA binding.
    supporting_text: 'FBI-GS binds to and

      activates GlnR.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Review abstract read; publisher retrieval returned HTTP 403. Native PMID:18326565 and
      full PMID:18195355,25691471,35778410 corroborate physiology and regulatory mechanisms; GDH catabolic
      scope is not chemical irreversibility.
- id: PMID:23535029
  title: Transcription factor TnrA inhibits the biosynthetic activity of glutamine synthetase in Bacillus
    subtilis.
  findings:
  - statement: Native B. subtilis GS performs ATP-dependent glutamine synthesis.
    supporting_text: 'GS catalyses the

      ATP-dependent synthesis of glutamine from glutamate and ammonium.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract read. Mechanistic GS substrate complexes in full PMID:24158439 corroborate
      chemistry; reciprocal TnrA regulation is not made a mandatory cycle component.
- id: PMID:24158439
  title: Structures of the Bacillus subtilis glutamine synthetase dodecamer reveal large intersubunit
    catalytic conformational changes linked to a unique feedback inhibition mechanism.
  findings:
  - statement: Native B. subtilis substrate-bound GS contacts glutamate and magnesium.
    supporting_text: The glutamate substrate peptide carboxyl and amide groups interact with Arg 298 and
      His 245 , whereas its side chain carboxyl interacts with a Mg 2+ ion.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full native structural and mutant study read. Catalytic-state-dependent metal binding
      and feedback inhibition are specific evidence; no universal oligomer size or affinity is inferred.
- id: PMID:10785395
  title: Functional properties of recombinant Azospirillum brasilense glutamate synthase, a complex iron-sulfur
    flavoprotein.
  findings:
  - statement: Recombinant A. brasilense GOGAT has an active alpha/beta protomer.
    supporting_text: 'Its catalytically

      active alphabeta protomer is composed of two dissimilar subunits'
  - statement: The reaction uses NADPH and glutamine to reductively aminate 2-oxoglutarate.
    supporting_text: 'catalyses the NADPH-dependent reductive transfer of glutamine amide group

      to the C(2) carbon of 2-oxoglutarate to yield L-glutamate.'
  - statement: The pyridine-nucleotide FAD site is in beta.
    supporting_text: 'one FAD (at Site 1, the pyridine

      nucleotide site within the beta subunit)'
  - statement: The FMN substrate site is in alpha.
    supporting_text: 'one FMN (at Site 2, the

      2-oxoglutarate/L-glutamate site in the alpha subunit)'
  - statement: Pyridine-nucleotide binding requires the 2-prime phosphate.
    supporting_text: 'the strict

      requirement of a 2''-phosphate group in the pyridine nucleotide for binding to

      glutamate synthase (GltS) was established.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract read. Recombinant protein expressed in E. coli is A. brasilense GOGAT,
      not native E. coli enzyme. The assay strain is not relabeled Sp7. The older paper left the two [4Fe–4S]
      cluster positions unresolved; PMID:31473159 resolves them.
- id: PMID:31473159
  title: Cryo-EM Structures of Azospirillum brasilense Glutamate Synthase in Its Oligomeric Assemblies.
  findings:
  - statement: GOGAT forms two glutamates from glutamine and 2-oxoglutarate.
    supporting_text: 'catalyzes the reductive synthesis of two L-Glu molecules from

      L-Gln and 2-oxo-glutarate.'
  - statement: Cryo-EM places FAD and both [4Fe–4S] clusters in beta.
    supporting_text: 'allows unequivocal location of the

      FAD cofactor and of two electron transfer [4Fe-4S]+1,+2 clusters within βGltS.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract read; full text not recovered. Exact target records cross-reference
      the structures. Multiple oligomeric assemblies are reported, so alpha/beta denotes the functional
      catalytic unit rather than a universal whole-enzyme oligomer.
- id: PMID:11188694
  title: Cross-talk and ammonia channeling between active centers in the unexpected domain arrangement
    of glutamate synthase.
  findings:
  - statement: The large GOGAT core channels ammonia between the glutaminase and synthase sites.
    supporting_text: Channeling of the ammonia intermediate is brought about by an internal tunnel of
      31 A length, which runs from the site of L-glutamine hydrolysis to the site of L-glutamate synthesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary structural abstract read. Comparative bacterial core structure supports mechanistic
      allocation; it is not a KT2440 experiment.
- id: PMID:34931064
  title: A counter-enzyme complex regulates glutamate metabolism in Bacillus subtilis.
  findings:
  - statement: Native-species GltAB is a heterodimer.
    supporting_text: heterodimeric enzyme composed of two subunits, GltA and GltB, which is involved in
      glutamate synthesis starting from glutamine and AKG
  - statement: Native cryo-EM assigns cofactors to their actual subunits.
    supporting_text: The higher resolution did permit unambiguous assignment of two 4Fe-4S clusters in
      GltB, and a 3Fe-4S clusters and FMN in GltA.
  - statement: Electron transfer starts from GltB-bound NADPH and feeds the GltA synthase center.
    supporting_text: These co-factors play a key role is shuttling electrons from the GltB-bound NADPH
      to 2-iminoglurate that is formed in the synthase domain of GltA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full native B. subtilis NCIB3610 study read. Exact strain 168 domain architecture supports
      conserved catalytic transfer; active GudB inhibition in 3610 is not asserted as ordinary 168 physiology.
      GltAB heterodimers and GudB6–GltA6B6 assemblies are distinct.
- id: PMID:2887545
  title: Assimilation of 13NH4+ by Azospirillum brasilense grown under nitrogen limitation and excess.
  findings:
  - statement: Native isotope tracer/inhibitor data support GS–GOGAT assimilation under the tested nitrogen
      regimes.
    supporting_text: 'These results imply that the GS-GOGAT pathway is the primary route of NH4+

      assimilation by A. brasilense grown with excess or limiting nitrogen'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract read; accessible text does not identify the strain. Species-level flux
      evidence corroborates the sequence-defined Sp7 panel without becoming an exact Sp7 enzyme experiment.
- id: PMID:2878685
  title: Nucleotide sequence of the Azospirillum brasilense Sp7 glutamine synthetase structural gene.
  findings:
  - statement: The A. brasilense Sp7 glnA gene encodes the sequence-defined GS subunit.
    supporting_text: The gene encodes a 468 residue polypeptide of MW 51,917.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary sequence abstract read; links GlnA to Sp7, not all later assay preparations
      to the same strain.
