                          statement: >-
                            The large subunit's N-terminal glutamine
                            amidotransferase domain hydrolyzes glutamine and
                            supplies channelled ammonia to the synthase site.
                  - id: gltd_electron_transfer_small_subunit
                    label: GltD electron-transfer small subunit
                    role: >-
                      Accepts reducing equivalents from NADPH through FAD and
                      iron-sulfur centers and transfers them to GltB.
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: oxidoreductase activity, acting on NAD(P)H
                        term:
                          id: GO:0016651
                          label: oxidoreductase activity, acting on NAD(P)H
                      family:
                        preferred_term: GltD glutamate synthase small-subunit family
                        term:
                          id: PANTHER:PTHR42783:SF3
                          label: GLUTAMATE SYNTHASE [NADPH] SMALL CHAIN-RELATED
                        description: >-
                          The exact SF3 label is retained verbatim. Its local
                          member set contains both bacterial GltD exemplars;
                          the word RELATED does not weaken their reviewed
                          small-chain assignments.
                        representative_members:
                          - preferred_term: GltD (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88CV5
                              label: Glutamate synthase (NADPH) beta subunit
                            description: PSEPK gltD/PP_5075.
                          - preferred_term: GltD (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P09832
                              label: Glutamate synthase [NADPH] small chain
                            description: >-
                              Reviewed bacterial small-chain exemplar linked
                              to Rhea 15501 in UniProtKB.
                    function:
                      preferred_term: oxidoreductase activity, acting on NAD(P)H
                      term:
                        id: GO:0016651
                        label: oxidoreductase activity, acting on NAD(P)H
                      evidence:
                        - source_id: file:modules/bacterial_ammonia_assimilation-deep-research-openscientist.md
                          statement: >-
                            Module research assigns the FAD/NADPH-binding and
                            iron-sulfur electron-transfer role to the small
                            subunit; reviewed P09832 grounds that subunit family.
            function:
              preferred_term: glutamate synthase (NADPH) activity
              term:
                id: GO:0004355
                label: glutamate synthase (NADPH) activity
              substrates:
                - preferred_term: L-glutamine
                - preferred_term: 2-oxoglutarate
                - preferred_term: NADPH
              products:
                - preferred_term: L-glutamate
                  description: >-
                    Stoichiometric coefficient 2 in the physiological
                    glutamine-to-glutamate direction of Rhea 15501.
                - preferred_term: NADP+
              notes: >-
                GO:0004355 is asserted on the complete GltB/GltD activity.
                GltB directly enables GO:0004359 and GltD directly enables
                GO:0016651; each subunit contributes to the donor-general
                GO:0015930 and NADPH-specific GO:0004355 overall reactions but
                does not alone enable either one.
              evidence:
                - source_id: RHEA:15501
                  title: NADPH-dependent glutamate synthase reaction
                  statement: >-
                    Rhea 15501 defines conversion of L-glutamine and
                    2-oxoglutarate to two L-glutamate molecules using NADPH.
            processes:
              - preferred_term: ammonia assimilation cycle
                term:
                  id: GO:0019676
                  label: ammonia assimilation cycle
            role_description: >-
              Converts glutamine-bound nitrogen and 2-oxoglutarate into the
              cellular glutamate pool while regenerating the GlnA substrate.
  connections:
    - source: glna_glutamine_formation
      target: gltbd_glutamate_formation
      connection_type: PROVIDES_INPUT_FOR
      description: L-glutamine produced by GlnA is consumed by GltB/GltD.
      chaining_status: VERIFIED
      chaining_note: >-
        The product L-glutamine of Rhea 16169 is a substrate of Rhea 15501.
    - source: gltbd_glutamate_formation
      target: glna_glutamine_formation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        One of the two L-glutamate molecules produced by GltB/GltD replenishes
        the substrate used by GlnA, closing the cycle; the other is the net
        assimilatory product.
      chaining_status: VERIFIED
      chaining_note: >-
        L-glutamate is a product of Rhea 15501 and a substrate of Rhea 16169.
  knowledge_gaps:
    - gap_statement: >-
        The relative flux through GS-GOGAT and direct GdhA-mediated ammonium
        assimilation varies with organism, nitrogen concentration, and carbon
        status.
      boundary: >-
        This module asserts the conserved high-affinity GS-GOGAT cycle only;
        direct glutamate-dehydrogenase assimilation is modeled separately.
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: >-
        Prevents treating presence of a GdhA-family enzyme as evidence that
        direct reductive amination carries substantial assimilatory flux.
      resolution: >-
        Quantify GS-GOGAT and GdhA flux across ammonium and carbon regimes
        using matched mutants and isotope-resolved nitrogen incorporation.
      provenance:
        - reference_id: file:modules/bacterial_ammonia_assimilation-deep-research-openscientist.md
          supporting_text: >-
            The choice between GS–GOGAT and GDH is condition-dependent and reflects an energy-versus-affinity trade-off.
          reference_section_type: RESULTS
