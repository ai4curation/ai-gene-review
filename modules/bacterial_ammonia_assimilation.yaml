                term:
                  id: GO:0019676
                  label: ammonia assimilation cycle
            role_description: >-
              Captures ammonium in L-glutamine, which supplies the amide
              nitrogen used by the second reaction.
    - order: 2
      role: glutamine-dependent reductive amination of 2-oxoglutarate
      node:
        id: gltbd_glutamate_formation
        label: GltB/GltD-dependent L-glutamate formation
        module_type: REACTION
        description: >-
          The two-subunit NADPH-dependent glutamate synthase couples glutamine
          hydrolysis and 2-oxoglutarate reductive amination to produce two
          molecules of L-glutamate.
        annotons:
          - id: gltbd_complex_activity
            label: GltB/GltD NADPH-dependent glutamate synthase activity
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: bacterial NADPH-dependent glutamate synthase complex
                term:
                  id: GO:0009342
                  label: glutamate synthase complex (NADPH)
                description: >-
                  The holoenzyme carries GO:0004355 through the complementary
