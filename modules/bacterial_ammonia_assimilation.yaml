id: MODULE:bacterial_ammonia_assimilation
title: Bacterial NADPH-dependent GS-GOGAT ammonia assimilation
description: >-
  A reusable bacterial module for high-affinity assimilation of ammonium
  through the NADPH-dependent glutamine synthetase-glutamate synthase
  (GS-GOGAT) cycle.
  Glutamine synthetase first ligates ammonium to L-glutamate, forming
  L-glutamine. The NADPH-dependent GltB/GltD glutamate synthase complex then
  transfers the glutamine amide nitrogen to 2-oxoglutarate, producing two
  molecules of L-glutamate and regenerating the substrate for glutamine
  synthetase. Direct reductive amination by NAD(P)-dependent glutamate
  dehydrogenase is a distinct, generally lower-affinity alternative and is not
  a required part of this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: file:modules/bacterial_ammonia_assimilation-deep-research-openscientist.md
    title: Reusable-module research for bacterial GS-GOGAT assimilation
    statement: >-
      The two-reaction GlnA-GltB/GltD cycle is the catalytic core; ammonium
      transport, PII signaling, GlnA regulation, and direct
      glutamate-dehydrogenase assimilation are adjacent or alternative
      systems rather than required module parts.
  - source_id: GO:0019676
    title: ammonia assimilation cycle
    statement: >-
      GO:0019676 captures the coupled glutamine synthetase and glutamate
      synthase cycle represented by the two ordered reactions.
  - source_id: RHEA:16169
    title: glutamine synthetase reaction
    statement: >-
      Rhea 16169 defines ATP-dependent ligation of ammonium to L-glutamate,
      producing L-glutamine.
  - source_id: RHEA:15501
    title: NADPH-dependent glutamate synthase reaction
    statement: >-
      Rhea 15501 defines transfer of the L-glutamine amide nitrogen to
      2-oxoglutarate, producing two L-glutamate molecules.
  - source_id: file:PSEPK/glnA/glnA-ai-review.yaml
    title: PSEPK glnA gene review
    statement: >-
      The review identifies Q88CY3 as the ATP-dependent glutamine synthetase
      that performs the ammonia-entry reaction.
  - source_id: file:PSEPK/gltB/gltB-ai-review.yaml
    title: PSEPK gltB gene review
    statement: >-
      The review identifies Q88CV4 as the catalytic large subunit of
      NADPH-dependent glutamate synthase and accepts its role in the ammonia
      assimilation cycle.
  - source_id: file:PSEPK/gltD/gltD-ai-review.yaml
    title: PSEPK gltD gene review
    statement: >-
      The review identifies Q88CV5 as the FAD- and iron-sulfur-dependent
      electron-transfer subunit of the GltB/GltD glutamate synthase complex.
notes: >-
  The module is species-neutral and is grounded by Pseudomonas putida KT2440
  and Escherichia coli K-12 exemplars. GdhA-family glutamate dehydrogenases can
  connect ammonium directly to glutamate, but reaction direction and
  physiological contribution depend on organism and nitrogen regime; that
  route is therefore an explicit boundary alternative rather than a third
  required step. Nitrogen sensing, PII signaling, GlnA adenylylation, ammonium
  transport, nitrate reduction, and downstream amino-acid biosynthesis are
  outside the core. Ferredoxin- and NADH-linked glutamate synthases are
  distinct implementations of the broader GS-GOGAT logic; this module is
  deliberately scoped to the bacterial NADPH-dependent GltB/GltD route. The
  broader `ammonia_assimilation` node in `modules/nitrogen_cycle.yaml` is a
  coarse nitrogen-cycle view of the same chemistry; this module is the focused
  reusable reaction-level treatment.
module:
  id: bacterial_ammonia_assimilation
  label: Bacterial NADPH-dependent GS-GOGAT ammonia assimilation
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: ammonia assimilation cycle
      term:
        id: GO:0019676
        label: ammonia assimilation cycle
      description: >-
        Coupled GS-GOGAT reactions that incorporate inorganic ammonium into
        glutamine and glutamate.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          This module represents the bacterial GlnA-GltB/GltD implementation.
  parts:
    - order: 1
      role: ATP-dependent ammonium incorporation into L-glutamine
      node:
        id: glna_glutamine_formation
        label: GlnA-dependent L-glutamine formation
        module_type: REACTION
        description: >-
          Glutamine synthetase ligates free ammonium to L-glutamate, consuming
          ATP and producing L-glutamine.
        annotons:
          - id: glna_activity
            label: GlnA glutamine synthetase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial GlnA glutamine synthetase family
                term:
                  id: PANTHER:PTHR43407:SF2
                  label: GLUTAMINE SYNTHETASE
                representative_members:
                  - preferred_term: GlnA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88CY3
                      label: Glutamine synthetase
                    description: PSEPK glnA/PP_5046.
                  - preferred_term: GlnA (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A9C5
                      label: Glutamine synthetase
                ancestral_nodes:
                  - preferred_term: PAINT glutamine synthetase node PTN000464923
                    term:
                      id: PANTHER:PTN000464923
                      label: PTN000464923
                    description: >-
                      Canonical PTHR43407 PAINT IBD node supporting
                      glutamine synthetase activity, seeded in part by the
                      E. coli GlnA exemplar.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          Local PTHR43407 PAINT data assigns GO:0004356 to
                          PTN000464923 with UniProtKB:P0A9C5 among the seeds.
            function:
              preferred_term: glutamine synthetase activity
              term:
                id: GO:0004356
                label: glutamine synthetase activity
              substrates:
                - preferred_term: L-glutamate
                - preferred_term: ammonium
                - preferred_term: ATP
              products:
                - preferred_term: L-glutamine
                - preferred_term: ADP
                - preferred_term: phosphate
              evidence:
                - source_id: RHEA:16169
                  title: glutamine synthetase reaction
                  statement: >-
                    Rhea 16169 defines formation of L-glutamine from
                    L-glutamate, ammonium, and ATP.
                - source_id: file:PSEPK/glnA/glnA-ai-review.yaml
                  statement: >-
                    The PSEPK review accepts GO:0004356 as the core function of
                    Q88CY3.
            processes:
              - preferred_term: ammonia assimilation cycle
                term:
                  id: GO:0019676
                  label: ammonia assimilation cycle
            role_description: >-
              Captures ammonium in L-glutamine, which supplies the amide
              nitrogen used by the second reaction.
    - order: 2
      role: glutamine-dependent reductive amination of 2-oxoglutarate
      node:
        id: gltbd_glutamate_formation
        label: GltB/GltD-dependent L-glutamate formation
        module_type: REACTION
        description: >-
          The two-subunit NADPH-dependent glutamate synthase couples glutamine
          hydrolysis and 2-oxoglutarate reductive amination to produce two
          molecules of L-glutamate.
        annotons:
          - id: gltbd_complex_activity
            label: GltB/GltD NADPH-dependent glutamate synthase activity
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: bacterial NADPH-dependent glutamate synthase complex
                active_units:
                  - id: gltb_catalytic_large_subunit
                    label: GltB catalytic large subunit
                    role: >-
                      Hydrolyzes L-glutamine, channels ammonia, and performs
                      FMN-dependent reductive amination of 2-oxoglutarate.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: GltB glutamate synthase large-subunit family
                        term:
                          id: PANTHER:PTHR11938:SF148
                          label: GLUTAMATE SYNTHASE [NADPH] LARGE CHAIN
                        representative_members:
                          - preferred_term: GltB (Pseudomonas putida KT2440)
