  title: 'Glutamate metabolism in Bacillus subtilis: gene expression and enzyme activities evolved to
    avoid futile cycles and to allow rapid responses to perturbations of the system.'
  findings:
  - statement: Native B. subtilis GDH does not replace anabolic GOGAT under studied conditions.
    supporting_text: 'Both RocG and GudB1 were unable to catalyze the anabolic reaction, most probably

      because of their very high K(m) values for ammonium.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract read; full recovery failures recorded. High-ammonium reverse activity
      and heterologous E. coli GDH rescue are distinct from effective native assimilation.
- id: PMID:35285712
  title: 'Nitrogen Metabolism in Pseudomonas putida: Functional Analysis Using Random Barcode Transposon
    Sequencing.'
  findings:
  - statement: The exact KT2440 GOGAT loci encode the two-chain enzyme.
    supporting_text: GltB (PP_5076) and GltD (PP_5075) comprise the glutamate synthase (GOGAT) of P. putida
  - statement: KT2440 GOGAT fitness depends on nitrogen source and glutamate supply.
