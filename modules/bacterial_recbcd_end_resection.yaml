  connections:
    - source: recc_end_engagement
      target: recbd_unwinding
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: RecC organizes end engagement before the RecB and RecD motors unwind the duplex.
    - source: recbd_unwinding
      target: recc_resection_switch
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: Processive unwinding exposes the lineage-specific signal that can alter resection behavior.
    - source: recc_resection_switch
      target: recb_resection
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: The switch biases RecB nuclease processing toward production of a recombinogenic 3-prime tail.
    - source: recb_resection
      target: recbcd_reca_loading
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: RecB resection directly produces the 3-prime single-stranded DNA substrate loaded with RecA.
  knowledge_gaps:
    - gap_statement: The sequence or structural signal controlling the RecBCD recombinogenic switch in Pseudomonas, including KT2440, is unknown.
      boundary: >-
        Do not transfer the E. coli Chi octamer to Pseudomonas. Treat switch
        identity as taxon-dependent and unresolved unless directly demonstrated.
      gap_kind:
        - BIOLOGY
    - gap_statement: How RecB, RecC and RecD divide motor, switch and RecA-loading roles has not been tested biochemically for any Pseudomonas RecBCD.
      boundary: >-
        KT2440 subunit roles are inferred from E. coli and from P. syringae
        genetics. In P. syringae, loss of RecD gives a DNA-repair defect unlike
        that of E. coli, so the roles should not be assumed to be identical.
      gap_kind:
        - BIOLOGY
