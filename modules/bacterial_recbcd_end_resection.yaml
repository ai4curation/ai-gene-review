id: MODULE:bacterial_recbcd_end_resection
title: Bacterial RecBCD double-strand-end resection
description: >-
  A reusable bacterial homologous-recombination initiation module in which the
  RecBCD complex engages a double-strand DNA end, the oppositely directed RecB
  and RecD motors unwind the duplex, RecC participates in a taxon-dependent
  recombinogenic switch, the RecB nuclease produces a 3-prime single-stranded
  tail, and RecB promotes RecA loading. The identity and even sequence dependence
  of the switch vary among bacteria. RecFOR single-strand-gap repair, RecA strand
  exchange, RuvABC branch migration and resolution, replication restart, and
  bacterial nonhomologous end joining are separate modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0000724
    title: double-strand break repair via homologous recombination
    statement: Defines the double-strand-break repair process initiated by RecBCD end resection.
  - source_id: GO:0009338
    title: exodeoxyribonuclease V complex
    statement: Defines the RecB-RecC-RecD complex that performs the pathway's coupled motor and nuclease activities.
  - source_id: RHEA:13065
    title: ATP hydrolysis reaction
    statement: Defines the ATPase chemistry that powers the RecB and RecD motors.
  - source_id: PANTHER:PTN000116141
    title: PAINT RecB/UvrD-family directional-helicase node
    statement: >-
      The local PTHR11070 PAINT table assigns 3-prime-to-5-prime DNA helicase
      activity to this ancestral node using RecB and UvrD-family experimental seeds.
  - source_id: PMID:20195537
    title: All three subunits of RecBCD enzyme are essential for DNA repair and low-temperature growth in the Antarctic Pseudomonas syringae Lz4W
    statement: >-
      Pseudomonad genetics supports a functional three-subunit RecBCD complex and
      shows that RecD loss causes a DNA-repair defect that differs from E. coli.
    supporting_text: sensitive to DNA-damaging agents and fail to grow at 4 degrees C.
  - source_id: PMID:2559208
    title: Activation of Chi recombinational hotspots by RecBCD-like enzymes from enteric bacteria
    statement: >-
      Primary clone experiments show that P. aeruginosa and P. putida RecBCD-like
      enzymes confer recombination and ATP-dependent nuclease activity but do not
      activate the E. coli Chi hotspot.
    supporting_text: proficiency and ATP-dependent nuclease activity, but neither Chi hotspot
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__recbcd-end-resection__ppu03440-deep-research-openscientist.md
    title: OpenScientist PSEPK RecBCD end-resection synthesis
    statement: >-
      Species-aware retrieval resolves the contiguous KT2440 recD-recB-recC
      operon, confirms the expected subunit domains, and identifies the
      Pseudomonas-specific Chi-recognition boundary.
  - source_id: PMID:15538360
    title: Crystal structure of RecBCD enzyme reveals a machine for processing DNA breaks.
    statement: >-
      Structure of E. coli RecBCD bound to DNA shows RecC splitting the duplex so the separated
      strands run to the RecB and RecD motors, and places Chi recognition in a RecC tunnel.
    supporting_text: the DNA duplex has been split across the RecC subunit to create a fork with the separated strands each heading towards different helicase motor subunits
  - source_id: PMID:12815438
    title: RecBCD enzyme is a bipolar DNA helicase.
    statement: E. coli RecBCD is a bipolar helicase with RecD as a 5'-to-3' motor opposite the RecB 3'-to-5' motor.
    supporting_text: RecD protein is also a DNA helicase, but one that possesses a 5' --> 3'
notes: >-
  The module is species-neutral. It represents the RecBCD system of Proteobacteria, Actinobacteria
  and other RecBCD-encoding bacteria, not the analogous AddAB system of Firmicutes, which uses a
  different subunit set (AddA, AddB) and has a nuclease in each subunit. E. coli K-12 is the
  experimental exemplar for every RecBCD role. P. putida KT2440 is a second, inferred exemplar for
  the Pseudomonas lineage, whose RecBCD-like enzymes are recombination-proficient but do not respond
  to the E. coli Chi octamer. The sequence-dependent switch is kept as a mechanistic part because it
  is central in characterized RecBCD systems, but the module does not require the E. coli Chi
  octamer. Only RecB carries the nuclease active site. RecC and RecD contribute to Exonuclease V
  activity as subunits (their gene reviews record contributes_to), so the nuclease annoton is
  placed on RecB alone. Family selectors were chosen to exclude non-RecBCD paralogs.
  RecB is selected with PTHR11070:SF23, a RecB-only subfamily. RecC is selected with NCBIfam
  TIGR01450, because the only PANTHER subfamily of PTHR30591 (SF1) mixes RecC with AddB/RexB. RecD is
  selected with NCBIfam TIGR01447 plus cognate RecB-RecC context, because PTHR43788:SF6 also contains
  standalone RecD2 helicases and eukaryotic HELB. All four PANTHER families have family reviews,
  and PTHR11070, PTHR30591 and PTHR43788 were written for this module. Their PAINT placement,
  including a PTHR30591 slice artefact and RecD2/HELB over-propagation, is documented in
  analysis/module_audits/bacterial_recbcd_end_resection/RESULTS.md.
