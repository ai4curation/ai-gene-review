id: MODULE:glycolate_glyoxylate_assimilation
title: Bacterial glycolate and glyoxylate assimilation (glycerate pathway)
description: >-
  A bacterial central-carbon module that converts glycolate and glyoxylate into
  D-glycerate, which re-enters core carbon metabolism. The core starts with
  oxidation of glycolate to glyoxylate by the membrane-associated, three-subunit
  GlcDEF glycolate oxidase/dehydrogenase (FAD-linked GlcD and GlcE plus the
  iron-sulfur subunit GlcF). Glyoxylate carboligase (Gcl), a thiamine
  diphosphate enzyme, then condenses two glyoxylate molecules into tartronate
  semialdehyde with release of carbon dioxide, and tartronate semialdehyde
  reductase (GlxR) reduces tartronate semialdehyde to D-glycerate with NADH or
  NADPH. Two accessory steps can feed the core: phosphoglycolate phosphatase
  supplies glycolate from 2-phosphoglycolate, and hydroxypyruvate isomerase (Hyi)
  interconverts hydroxypyruvate and tartronate semialdehyde. The pathway is best
  characterized in Escherichia coli K-12 and Pseudomonas putida KT2440, and the
  same gene set is found widely in Proteobacteria. Glycerate kinase, the
  glyoxylate shunt and the eukaryotic photorespiratory C2 cycle lie outside this
  module.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0046487
    title: glyoxylate metabolic process
    statement: >-
      GO:0046487 grounds the module as metabolism of glyoxylate and connected
      two-carbon inputs.
  - source_id: PMID:8606183
    title: >-
      glc locus of Escherichia coli: characterization of genes encoding the
      subunits of glycolate oxidase and the glc regulator protein.
    statement: >-
      Insertion mutations in glcD, glcE or glcF each abolish glycolate oxidase
      activity in E. coli, establishing GlcDEF as a three-subunit enzyme required
      for glycolate utilization.
  - source_id: PMID:8440684
    title: >-
      Molecular cloning, DNA sequencing, and biochemical analyses of Escherichia
      coli glyoxylate carboligase. An enzyme of the acetohydroxy acid
      synthase-pyruvate oxidase family.
    statement: >-
      E. coli Gcl condenses two glyoxylate molecules to tartronate semialdehyde,
      the committed step of the glycerate pathway.
  - source_id: PMID:10601204
    title: >-
      Genetic analysis of a chromosomal region containing genes required for
      assimilation of allantoin nitrogen and linked glyoxylate metabolism in
      Escherichia coli.
    statement: >-
      Places gcl, hyi and glxR (with glycerate kinase glxK) in the E. coli
      allantoin/glyoxylate gene cluster and links the cluster to glyoxylate
      assimilation.
  - source_id: PMID:10561547
    title: >-
      Biochemical evidence that Escherichia coli hyi (orf b0508, gip) gene
      encodes hydroxypyruvate isomerase.
    statement: >-
      E. coli Hyi interconverts hydroxypyruvate and tartronate semialdehyde.
  - source_id: PMID:13129953
    title: >-
      Role of 2-phosphoglycolate phosphatase of Escherichia coli in metabolism of
      the 2-phosphoglycolate formed in DNA repair.
    statement: >-
      E. coli Gph dephosphorylates 2-phosphoglycolate released by repair of
      3'-phosphoglycolate DNA ends, producing glycolate that the glc system can
      oxidize.
  - source_id: file:modules/glycolate_glyoxylate_assimilation-deep-research-openscientist.md
    title: OpenScientist module review for bacterial glycolate/glyoxylate assimilation
    statement: >-
      The generic module report identifies glycolate oxidation, glyoxylate
      carboligation and tartronate-semialdehyde reduction as the obligatory
      backbone, treats phosphoglycolate dephosphorylation as a conditional feeder
      and hydroxypyruvate isomerization as an accessory branch, and records the
      pathway in Proteobacteria and Cyanobacteria with a different (peroxisomal,
      O2-dependent) glycolate oxidase in plants.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__glycolate_glyoxylate_assimilation__ppu00630-deep-research-openscientist.md
    title: OpenScientist species/pathway review for PSEPK ppu00630
    statement: >-
      The species-aware report supports GlcDEF, Gcl, Hyi and GlxR as the
      physiologically relevant P. putida KT2440 core, flags phosphoglycolate
      phosphatase as housekeeping salvage rather than the entry route, and
      records GclR-mediated conditional expression as a pathway caveat.
  - source_id: KEGG:ppu00630
    title: Pseudomonas putida KT2440 glyoxylate and dicarboxylate metabolism
    statement: >-
      The P. putida KT2440 partition table assigns PP_0094, PP_0416, PP_1907,
      glcD, glcE, glcF, gcl, hyi and glxR as primary genes in the ppu00630
      bucket.
  - source_id: file:projects/P_PUTIDA/data/psepk_pathway_partition.tsv
    title: PSEPK pathway partition table
    statement: >-
      The partition table separates the nine primary ppu00630 genes from broad
      KEGG spillover involving catalases, formate dehydrogenases, one-carbon
      enzymes, glycine cleavage, TCA/glyoxylate shunt enzymes and other
      neighboring carbon-metabolism steps.
  - source_id: file:projects/P_PUTIDA/batches/ppu00630_glycolate_glyoxylate_assimilation.tsv
    title: PSEPK ppu00630 batch table
    statement: >-
      The batch table records the full 62-member KEGG ppu00630 map and marks the
      nine primary-bucket genes selected for the P. putida module pass.
notes: >-
  Taxonomic scope: the GlcDEF plus Gcl/GlxR route (the bacterial glycerate
  pathway) is characterized genetically and biochemically in Escherichia coli
  K-12 and is present as the same gene set in Pseudomonas putida KT2440, so both
  organisms are carried as representative members of every step. The module
  report also places the route in other Proteobacteria and, as one of three
  parallel glyoxylate routes, in Synechocystis; no further organism is added
  here because none has a reviewed gene set in this corpus. The module is kept
  bacterial: plants and animals oxidize glycolate with a peroxisomal,
  O2-dependent FMN glycolate oxidase of an unrelated family and route
  glyoxylate through aminotransferases (photorespiration), so neither the GlcDEF
  nor the Gcl/GlxR step generalizes to eukaryotes.
  Boundary: the core is GlcDEF, Gcl and GlxR. Phosphoglycolate phosphatase is
  optional because its main bacterial source of 2-phosphoglycolate is DNA repair
  (E. coli Gph) or, in organisms with Rubisco, photorespiration; P. putida
  KT2440 lacks the Calvin-cycle context, so PP_0416 is housekeeping salvage.
  PP_1907 and PP_0094 (other HAD phosphatase candidates in the KEGG ppu00630
  bucket) are not modelled. Hyi is optional: disrupting E. coli hyi does not
  stop growth on glyoxylate or glycolate, and Hyi links hydroxypyruvate (from
  serine or glycerate) to the tartronate-semialdehyde node rather than carrying
  glyoxylate carbon. In P. putida KT2440 the gcl-hyi-glxR branch is repressed by
  GclR in wild type and derepressed in ethylene-glycol-adapted strains, so it is
  genetically present but conditionally active. Glycerate kinase (GlxK/GarK),
  malate synthase/isocitrate lyase (glyoxylate shunt), catalase, formate
  dehydrogenase, glycine cleavage and one-carbon folate steps are excluded.
  Family grounding uses NCBIfam equivalog families for GlcD, GlcF, Gcl, Hyi,
  GlxR and Gph, and the PANTHER subfamily PTHR11748:SF103 for GlcE (the parent
  PTHR11748 family is functionally heterogeneous; see its family review).
module:
  id: glycolate_glyoxylate_assimilation
  label: Bacterial glycolate and glyoxylate assimilation (glycerate pathway)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: glyoxylate metabolic process
      term:
        id: GO:0046487
        label: glyoxylate metabolic process
      description: >-
        Process-level grounding for glyoxylate conversion and the linked
        glycolate oxidation step.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          Bacterial glycerate pathway using a GlcDEF-type glycolate
          dehydrogenase and Gcl/GlxR downstream enzymes; characterized in
          Proteobacteria (E. coli, P. putida).
  parts:
    - order: 1
      role: optional phosphoglycolate salvage input to glycolate
      optional: true
      node:
        id: phosphoglycolate_dephosphorylation
        label: Optional 2-phosphoglycolate to glycolate salvage
        module_type: REACTION
        description: >-
          A phosphoglycolate phosphatase hydrolyzes 2-phosphoglycolate to
          glycolate and phosphate. This route supplies glycolate in organisms or
          conditions with appreciable 2-phosphoglycolate production (DNA repair
          of 3'-phosphoglycolate ends, Rubisco oxygenation), but it is optional
          for the glycolate/glyoxylate assimilation core.
        annotons:
          - id: phosphoglycolate_phosphatase
            label: Phosphoglycolate phosphatase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial phosphoglycolate phosphatase family
                term:
                  id: NCBIfam:TIGR01449
                  label: phosphoglycolate phosphatase
                representative_members:
                  - preferred_term: gph (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P32662
                      label: Phosphoglycolate phosphatase
                    description: Escherichia coli K-12 gph/b3385.
                  - preferred_term: PP_0416 (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88QS2
                      label: Phosphoglycolate phosphatase
                    description: Pseudomonas putida KT2440 PP_0416.
            function:
              preferred_term: phosphoglycolate phosphatase activity
              term:
                id: GO:0008967
                label: phosphoglycolate phosphatase activity
              substrates:
                - preferred_term: 2-phosphoglycolate
              products:
                - preferred_term: glycolate
                - preferred_term: phosphate
              evidence:
                - source_id: PMID:13129953
                  statement: >-
                    Purified E. coli Gph hydrolyzes 2-phosphoglycolate, and gph
                    mutants accumulate 2-phosphoglycolate generated by DNA repair.
                - source_id: file:ECOLI/gph/gph-ai-review.yaml
                  statement: >-
                    The E. coli gph review accepts phosphoglycolate phosphatase
                    activity as its core function.
                - source_id: file:PSEPK/PP_0416/PP_0416-uniprot.txt
                  statement: >-
                    UniProtKB:Q88QS2 is a reviewed, HAMAP-classified bacterial
                    phosphoglycolate phosphatase.
            processes:
              - preferred_term: glycolate biosynthetic process
                term:
                  id: GO:0046295
                  label: glycolate biosynthetic process
            role_description: >-
              Optional hydrolytic source of glycolate from 2-phosphoglycolate.
              In P. putida KT2440 this is housekeeping salvage rather than the
              physiological glycolate-entry route.
    - order: 2
      role: glycolate oxidation to glyoxylate
      node:
        id: glcdef_glycolate_dehydrogenase
        label: GlcDEF glycolate dehydrogenase complex
        module_type: PROTEIN_COMPLEX
        description: >-
          A membrane-associated, three-subunit bacterial glycolate
          oxidase/dehydrogenase oxidizes glycolate to glyoxylate. GlcD and GlcE
          are FAD-binding subunits of the PCMH/VAO fold and GlcF carries
          iron-sulfur clusters for electron transfer; electrons go to a
          membrane acceptor rather than to O2. All three subunits are required
          for activity. The E. coli enzyme also oxidizes D-lactate.
        concepts:
          - preferred_term: glycolate oxidase complex
            term:
              id: GO:0009339
              label: glycolate oxidase complex
        annotons:
          - id: glcdef_glycolate_dehydrogenase_activity
            label: GlcDEF glycolate dehydrogenase activity
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: bacterial GlcDEF glycolate oxidase complex
                term:
                  id: GO:0009339
                  label: glycolate oxidase complex
                active_units:
                  - id: glcd_flavoprotein_subunit
                    label: GlcD FAD-linked catalytic subunit
                    role: >-
                      FAD-containing subunit that carries the glycolate
                      dehydrogenase chemistry.
                    stoichiometry: "1"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: GlcD glycolate oxidase subunit family
                        term:
                          id: NCBIfam:TIGR00387
                          label: glycolate oxidase subunit GlcD
                        representative_members:
                          - preferred_term: glcD (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P0AEP9
                              label: Glycolate oxidase subunit GlcD
                            description: Escherichia coli K-12 glcD/b2979.
                          - preferred_term: glcD (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88GH8
                              label: Glycolate oxidase, putative FAD-linked subunit
                            description: Pseudomonas putida KT2440 glcD/PP_3745.
                  - id: glce_fad_binding_subunit
                    label: GlcE FAD-binding subunit
                    role: >-
                      Second FAD-binding subunit of the complex, required for
                      activity.
                    stoichiometry: "1"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: GlcE glycolate oxidase subunit subfamily
                        term:
                          id: PANTHER:PTHR11748:SF103
                          label: GLYCOLATE OXIDASE SUBUNIT GLCE
                        representative_members:
                          - preferred_term: glcE (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P52073
                              label: Glycolate oxidase subunit GlcE
                            description: Escherichia coli K-12 glcE/b4468.
                          - preferred_term: glcE (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88GH7
                              label: Glycolate oxidase, putative FAD-binding subunit
                            description: Pseudomonas putida KT2440 glcE/PP_3746.
                  - id: glcf_iron_sulfur_subunit
                    label: GlcF iron-sulfur subunit
                    role: >-
                      Iron-sulfur electron-transfer subunit linking the flavin
                      subunits to the membrane electron acceptor.
                    stoichiometry: "1"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: GlcF glycolate oxidase iron-sulfur subunit family
                        term:
                          id: NCBIfam:NF008434
                          label: glycolate oxidase subunit GlcF
                        representative_members:
                          - preferred_term: glcF (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P52074
                              label: Glycolate oxidase iron-sulfur subunit
                            description: Escherichia coli K-12 glcF/b4467.
                          - preferred_term: glcF (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88GH6
                              label: Glycolate oxidase iron-sulfur subunit
                            description: Pseudomonas putida KT2440 glcF/PP_3747.
            function:
              preferred_term: glycolate dehydrogenase activity
              term:
                id: GO:0019154
                label: glycolate dehydrogenase activity
              substrates:
                - preferred_term: glycolate
              products:
                - preferred_term: glyoxylate
              cofactors:
                - preferred_term: FAD
                  term:
                    id: GO:0071949
                    label: FAD binding
                - preferred_term: 4 iron, 4 sulfur cluster
                  term:
                    id: GO:0051539
                    label: 4 iron, 4 sulfur cluster binding
              evidence:
                - source_id: PMID:8606183
                  statement: >-
                    Insertion mutants in any of glcD, glcE or glcF lose glycolate
                    oxidase activity, so the activity belongs to the complex.
                - source_id: PMID:4557653
                  statement: >-
                    The E. coli membrane-associated glycolate oxidoreductase
                    oxidizes glycolate (and D-lactate) with artificial electron
                    acceptors but not O2.
                - source_id: file:ECOLI/glcD/glcD-ai-review.yaml
                  statement: >-
                    The E. coli glcD review records glycolate dehydrogenase
                    activity as the GlcD core function within the complex.
            processes:
              - preferred_term: glycolate catabolic process
                term:
                  id: GO:0046296
                  label: glycolate catabolic process
            role_description: >-
              Oxidizes glycolate to glyoxylate, the entry step of the pathway.
    - order: 3
