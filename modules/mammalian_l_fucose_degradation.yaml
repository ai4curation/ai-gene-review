evidence:
  - source_id: GO:0042355
    title: L-fucose catabolic process
    statement: >-
      The module is grounded in GO:0042355 L-fucose catabolic process, which
      human HSD17B14 carries by IDA (PMID:38944119).
  - source_id: PMID:42509779
    title: Orphan Enzymes in the Mammalian L-Fucose Degradation Pathway.
    statement: >-
      Only two of the five mammalian steps are deorphaned (HSD17B14, ENOSF1);
      BDH2 is a candidate for the third dehydrogenase step.
    supporting_text: >-
      L-fucose dehydrogenase (HSD17B14) and L-fuconate dehydratase (ENOSF1)
      remain the only molecularly characterized (deorphaned) mammalian enzymes
      to date
  - source_id: PMID:42509779
    title: Orphan Enzymes in the Mammalian L-Fucose Degradation Pathway.
    statement: >-
      Taxon scope: the pathway is active in human, cat, guinea pig, rabbit and
      pig but not effectively in rat.
    supporting_text: >-
      Similar results were observed in cats, guinea pigs, and rabbits, whereas
      rats appeared unable to effectively catabolize the monosaccharide
  - source_id: PMID:38944119
    title: Hydroxysteroid 17-β dehydrogenase 14 (HSD17B14) is an L-fucose dehydrogenase,
      the initial enzyme of the L-fucose degradation pathway.
    statement: >-
      Rat HSD17B14 is essentially inactive on L-fucose, consistent with the
      absence of the pathway in rat.
    supporting_text: >-
      Notably, the minimal activity of rat HSD17B14 towards L-fucose aligns with
      the absence of L-fucose metabolism observed in this species.
notes: >-
  Boundary. IN: the five cytosolic reactions from beta-L-fucose to pyruvate plus
  L-lactate (fucose dehydrogenase, fuconolactonase, fuconate dehydratase,
  2-keto-3-deoxy-L-fuconate 4-dehydrogenase, 2,4-diketo-3-deoxy-L-fuconate
  hydrolase). OUT, as separate or upstream/downstream biology: (1) supply of
  free L-fucose by plasma-membrane uptake (GLUT1/SLC2A1, macropinocytosis) and by
  lysosomal alpha-L-fucosidases FUCA1/FUCA2 with an unidentified lysosomal efflux
  route; (2) FUOM L-fucose mutarotase, which equilibrates the anomers for both
  this pathway and salvage, and whose only mammalian cellular phenotype concerns
  GDP-L-fucose salvage (PMID:17602138); it is not annotated to GO:0042355 and is
  not added here; (3) the competing salvage fate FCSK (L-fucokinase) and FPGT
  (fucose-1-phosphate guanylyltransferase) and de novo GDP-L-fucose synthesis
  (GMDS/GFUS); (4) downstream metabolism of pyruvate and L-lactate; (5) the
  bacterial phosphorylative FucI/FucK/FucA pathway, which is absent from
  mammals.

  Orphan modelling. The two orphan steps use ANY_WITH_FUNCTION participants with
  the reaction pinned by Rhea and EC, and a step-level knowledge gap stating
  the unknown enzyme. FAHD1 has been proposed for the terminal hydrolase on
  sequence similarity to bacterial FAH-family 2,4-diketo-3-deoxy-L-rhamnonate
  hydrolases, but it is mitochondrial and has never been assayed on the
  substrate, so it is not listed as a participant. Regucalcin (RGN, aldonolactonase)
  and 6-phosphogluconolactonase are discussed as possible secondary
  fuconolactonases but have not been tested, and are also not listed.

  BDH2 is modelled as a GENE_PRODUCT participant because recombinant human BDH2
  is active on 2-keto-3-deoxy-L-fuconate (PMID:38918500), but its better-supported
  physiological activity is 4-oxo-L-proline reductase (GO:0016617,
  PMID:35150746), and no loss-of-function or flux evidence links it to fucose
  catabolism. It is not proposed as a NEW L-fucose catabolic process annotation.

  Ontology gaps (not biological gaps). GO has no molecular-function terms for
  L-fucono-1,4/1,5-lactonase (EC 3.1.1.120; RHEA:75219, RHEA:75223),
  2-keto-3-deoxy-L-fuconate 4-dehydrogenase (EC 1.1.1.434; RHEA:75191) or
  2,4-diketo-3-deoxy-L-fuconate hydrolase (EC 3.7.1.26; RHEA:62376). These
  annotons therefore carry a preferred_term and Rhea/EC evidence but no GO id.
  The fucose dehydrogenase step uses GO:0047834 D-threo-aldose 1-dehydrogenase
  activity, whose GO xrefs include the L-fucose reaction RHEA:81515.

  Gene reviews for HSD17B14, ENOSF1 and BDH2 do not yet exist in this
  repository; they are the obvious next curation targets.
knowledge_gaps:
  - gap_statement: >-
      The physiological purpose of mammalian L-fucose catabolism is unknown:
      fuel use, clearance of free L-fucose (to support lysosomal defucosylation,
      limit glycation, or restrict microbial access to fucose) and production of
      signalling catabolites have all been proposed, but none has been tested.
    boundary: >-
      Applies to the whole module. The chemistry of each step is not in doubt;
      what the pathway is for, and in which cells it operates in vivo, is.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      Without a known role the pathway cannot be linked to phenotypes or
      disease, and annotating its genes to downstream processes would be
      speculative.
    resolution: >-
      Trace 13C-L-fucose in wild-type versus HSD17B14- or ENOSF1-knockout
      hepatocyte or proximal-tubule models, and phenotype knockout animals for
      free-fucose levels, lysosomal storage and fucosylation.
    provenance:
      - reference_id: PMID:42509779
        supporting_text: The physiological role of this catabolic route remains enigmatic.
module:
  id: mammalian_l_fucose_degradation
  label: L-fucose degradation (mammalian non-phosphorylative pathway)
  module_type: METABOLIC_PATHWAY
  description: >-
    Five sequential cytosolic reactions converting beta-L-fucose to pyruvate and
    L-lactate, two of which have no assigned mammalian gene.
  concepts:
    - preferred_term: L-fucose catabolic process
      term:
        id: GO:0042355
        label: L-fucose catabolic process
      description: >-
        Breakdown of free L-fucose; here restricted to the mammalian oxidative
        route ending in pyruvate and L-lactate.
  context:
    taxa:
      - preferred_term: human
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
        description: >-
          Human proteins are used as the concrete participants. The pathway
          biochemistry was established largely in pig and rabbit liver; it is
          weak or absent in rat.
  parts:
    - order: 1
      role: oxidation of L-fucose (deorphaned)
      node:
        id: fucose_dehydrogenase_step
        label: beta-L-fucose + NAD+ to L-fucono-1,5-lactone + NADH
        module_type: REACTION
        annotons:
          - id: hsd17b14_fucose_dehydrogenase
            label: "HSD17B14: L-fucose dehydrogenase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HSD17B14 (human)
                term:
                  id: UniProtKB:Q9BPX1
                  label: L-fucose dehydrogenase
            function:
              preferred_term: L-fucose dehydrogenase activity (D-threo-aldose 1-dehydrogenase)
              term:
                id: GO:0047834
                label: D-threo-aldose 1-dehydrogenase activity
              substrates:
                - preferred_term: L-fucopyranose
                  term:
                    id: CHEBI:2181
                    label: L-fucopyranose
                - preferred_term: NAD+
                  term:
                    id: CHEBI:57540
                    label: NAD(1-)
              products:
                - preferred_term: L-fucono-1,5-lactone
                  term:
                    id: CHEBI:81457
                    label: L-fucono-1,5-lactone
                - preferred_term: NADH
                  term:
                    id: CHEBI:57945
                    label: NADH(2-)
              evidence:
                - source_id: RHEA:81515
                  statement: L-fucose + NAD(+) = L-fucono-1,5-lactone + NADH + H(+)
                - source_id: EC:1.1.1.122
                  statement: D-threo-aldose 1-dehydrogenase (L-fucose dehydrogenase)
                - source_id: PMID:38944119
                  title: Hydroxysteroid 17-β dehydrogenase 14 (HSD17B14) is an L-fucose dehydrogenase,
                    the initial enzyme of the L-fucose degradation pathway.
                  statement: >-
                    Recombinant rabbit and human HSD17B14 oxidize L-fucose to the
                    1,5-lactone, which rapidly rearranges to the 1,4-lactone.
                  supporting_text: >-
                    However, the initial product of the reaction is
                    L-fucono-1,5-lactone, which is unstable and rapidly transforms
                    to L-fucono-1,4-lactone
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Committing oxidation of the beta-pyranose of L-fucose. Prefers
              L-fucose over D-arabinose and L-galactose; estradiol, the substrate
              after which the protein was named, is a very poor substrate.
    - order: 2
      role: lactone hydrolysis (ORPHAN)
      node:
        id: fuconolactone_hydrolysis_step
        label: L-fucono-1,4-lactone + H2O to L-fuconate
        module_type: REACTION
        description: >-
          The 1,5-lactone produced by HSD17B14 rearranges non-enzymatically to the
          slowly hydrolysing 1,4-lactone, so an L-fuconolactonase is expected to
          be needed for efficient flux. Activity has been detected only in
          preliminary work on rabbit liver; no mammalian gene is assigned.
        annotons:
          - id: orphan_fuconolactonase
            label: "Orphan: L-fuconolactonase (no mammalian gene assigned)"
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: L-fucono-1,4-lactonase activity
                description: >-
                  Hydrolysis of L-fucono-1,4-lactone (and/or the 1,5-lactone)
                  to L-fuconate. No GO term exists.
              description: >-
                Unidentified mammalian hydrolase. Candidates discussed but not
                tested: regucalcin (RGN), 6-phosphogluconolactonase, or an
                uncharacterized hydrolase. No mammalian homologue of the
                bacterial amidohydrolase-superfamily fuconolactonase is known.
            function:
              preferred_term: L-fucono-1,4-lactonase activity
              substrates:
                - preferred_term: L-fucono-1,4-lactone
                  term:
                    id: CHEBI:189082
                    label: L-fucono-1,4-lactone
                - preferred_term: water
                  term:
                    id: CHEBI:15377
                    label: water
              products:
                - preferred_term: L-fuconate
                  term:
                    id: CHEBI:21291
                    label: L-fuconate
              evidence:
                - source_id: RHEA:75223
                  statement: L-fucono-1,4-lactone + H2O = L-fuconate + H(+)
                - source_id: RHEA:75219
                  statement: L-fucono-1,5-lactone + H2O = L-fuconate + H(+)
                - source_id: EC:3.1.1.120
                  statement: L-fucono-1,5-lactonase; bacterial enzyme (Burkholderia multivorans BmulJ_04915)
                - source_id: PMID:23214453
                  title: Discovery of an L-fucono-1,5-lactonase from cog3618 of the amidohydrolase superfamily.
                  statement: Bacterial precedent for an enzymatic fuconolactonase step.
                  supporting_text: >-
                    The highest activity was shown for L-fucono-1,4-lactone
            role_description: >-
              Converts the stable 1,4-lactone into L-fuconate, the substrate of
              ENOSF1.
        knowledge_gaps:
          - gap_statement: >-
              The enzyme that hydrolyses L-fuconolactone to L-fuconate in
              mammalian cells has not been identified, and the activity itself
              has not been characterized in mammalian tissue.
            boundary: >-
              Restricted to the lactone hydrolysis step; the non-enzymatic
              1,5- to 1,4-lactone rearrangement is established.
            gap_kind:
              - BIOLOGY
            dark_aspect: RESIDUAL_SUBGAP
            status: OPEN
            significance: >-
              Without this enzyme L-fucono-1,4-lactone accumulates in vitro,
              so the step may limit flux through the pathway.
            resolution: >-
              Assay recombinant known mammalian lactonases (RGN,
              6-phosphogluconolactonase and others) on L-fucono-1,4-lactone; if
              negative, purify the rabbit or pig liver activity and identify
              co-purifying hydrolases by mass spectrometry.
            provenance:
              - reference_id: PMID:42509779
                supporting_text: L-Fuconolactonase has never been detected in mammalian tissues.
              - reference_id: PMID:38944119
                supporting_text: >-
                  Since we only observed an accumulation of L-fucono-1,4-lactone,
                  and not L-fuconate, during the enzymatic reaction
    - order: 3
      role: dehydration of L-fuconate (deorphaned)
      node:
        id: fuconate_dehydratase_step
        label: L-fuconate to 2-keto-3-deoxy-L-fuconate + H2O
        module_type: REACTION
        annotons:
          - id: enosf1_fuconate_dehydratase
            label: "ENOSF1 (rTS-gamma): L-fuconate dehydratase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ENOSF1 (human)
                term:
                  id: UniProtKB:Q7L5Y1
                  label: Mitochondrial enolase superfamily member 1
                description: >-
                  The rTS-gamma isoform was assayed; rTS-beta lacks the activity.
                  Subcellular localization is unresolved (originally proposed
                  mitochondrial, later questioned), so no location is asserted.
            function:
              preferred_term: L-fuconate dehydratase activity
              term:
                id: GO:0050023
                label: L-fuconate dehydratase activity
              substrates:
                - preferred_term: L-fuconate
                  term:
                    id: CHEBI:21291
                    label: L-fuconate
              products:
                - preferred_term: 2-keto-3-deoxy-L-fuconate
                  term:
                    id: CHEBI:37448
                    label: 2-dehydro-3-deoxy-L-fuconate
                - preferred_term: water
                  term:
                    id: CHEBI:15377
                    label: water
              cofactors:
                - preferred_term: Mg2+
              evidence:
                - source_id: RHEA:22772
                  statement: L-fuconate = 2-dehydro-3-deoxy-L-fuconate + H2O
                - source_id: EC:4.2.1.68
                  statement: L-fuconate dehydratase
                - source_id: PMID:24697329
                  title: Enzymatic and structural characterization of rTSγ provides insights into the
                    function of rTSβ.
                  statement: Kinetic characterization of recombinant human rTS-gamma.
                  supporting_text: the kinetic data establish rTSγ as an l-fuconate dehydratase.
            role_description: >-
              Mg2+-dependent enolase-superfamily dehydratase converting L-fuconate
              to 2-keto-3-deoxy-L-fuconate.
    - order: 4
      role: 4-oxidation of 2-keto-3-deoxy-L-fuconate (candidate gene)
      node:
        id: kdf_dehydrogenase_step
        label: 2-keto-3-deoxy-L-fuconate + NAD+ to 2,4-diketo-3-deoxy-L-fuconate + NADH
        module_type: REACTION
        description: >-
          The pork-liver enzyme was purified in 1975 but never sequenced. Human
          BDH2, an SDR homologous to the bacterial L-KDF 4-dehydrogenase, is
          active on the substrate in vitro and is the leading candidate.
        annotons:
          - id: bdh2_kdf_dehydrogenase
            label: "BDH2 (candidate): 2-keto-3-deoxy-L-fuconate 4-dehydrogenase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BDH2 (human)
                term:
                  id: UniProtKB:Q9BUT1
                  label: Dehydrogenase/reductase SDR family member 6
                description: >-
                  Candidate only: in vitro activity on the substrate, no in vivo
                  evidence that BDH2 carries this flux. Its best-supported
                  activity is 4-oxo-L-proline reductase.
            function:
              preferred_term: 2-keto-3-deoxy-L-fuconate 4-dehydrogenase activity
              description: No GO term exists for this reaction.
              substrates:
                - preferred_term: 2-keto-3-deoxy-L-fuconate
                  term:
                    id: CHEBI:37448
                    label: 2-dehydro-3-deoxy-L-fuconate
                - preferred_term: NAD+
                  term:
                    id: CHEBI:57540
                    label: NAD(1-)
              products:
                - preferred_term: 2,4-diketo-3-deoxy-L-fuconate
                  term:
                    id: CHEBI:131847
                    label: 2,4-didehydro-3-deoxy-L-rhamnonate
                - preferred_term: NADH
                  term:
                    id: CHEBI:57945
                    label: NADH(2-)
              evidence:
                - source_id: RHEA:75191
                  statement: >-
                    2-dehydro-3-deoxy-L-fuconate + NAD(+) =
                    2,4-didehydro-3-deoxy-L-rhamnonate + NADH + H(+)
                - source_id: EC:1.1.1.434
                  statement: 2-keto-3-deoxy-L-fuconate 4-dehydrogenase
                - source_id: PMID:38918500
                  title: Crystal structure of L-2-keto-3-deoxyfuconate 4-dehydrogenase reveals a unique
                    binding mode as a α-furanosyl hemiketal of substrates.
                  statement: Recombinant human BDH2 oxidizes L-KDF in vitro.
                  supporting_text: Dehydrogenase activity for l-KDF was also detected in BDH2
                - source_id: PMID:1158860
                  title: L-fucose metabolism in mammals. Purification of pork liver 2-keto-3-deoxy-L-fuconate:NAD+
                    oxidoreductase by NAD+-Agarose affinity chromatography.
                  statement: The native mammalian activity is a soluble NAD+-dependent dehydrogenase.
                  supporting_text: >-
                    soluble NAD+-dependent dehydrogenase which acts on both
                    2-keto-3-deoxy-L-fuconate and 2-keto-3-deoxy-D-arabonate
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Oxidizes C4 of 2-keto-3-deoxy-L-fuconate (bound as the
              alpha-furanosyl hemiketal) to give the diketo acid.
        knowledge_gaps:
          - gap_statement: >-
              It is not known whether BDH2 is the physiological
              2-keto-3-deoxy-L-fuconate dehydrogenase, as opposed to a
              promiscuous SDR whose main roles lie in 4-oxo-L-proline, ketone
              body or 2,5-dihydroxybenzoate metabolism.
            boundary: >-
              In vitro activity is established; identity of the native enzyme
              and contribution in cells are not.
            gap_kind:
              - BIOLOGY
            dark_aspect: RESIDUAL_SUBGAP
            status: NARROWING
            significance: >-
              Decides whether the pathway has three or only two assigned genes
              and whether BDH2 should carry an L-fucose catabolic process
              annotation.
            resolution: >-
