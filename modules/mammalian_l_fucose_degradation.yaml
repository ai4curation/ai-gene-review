  - id: PMID:38944119
    title: Hydroxysteroid 17-β dehydrogenase 14 (HSD17B14) is an L-fucose dehydrogenase,
      the initial enzyme of the L-fucose degradation pathway.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Primary paper (J Biol Chem 2024, full text cached). Native enzyme purified
        from rabbit liver, identified by MS as HSD17B14; recombinant rabbit and
        human enzymes oxidize L-fucose to L-fucono-1,5-lactone (MS and NMR).
        Also reports non-enzymatic 1,5- to 1,4-lactone rearrangement and the
        negligible activity of rat HSD17B14. Basis of the GOA IDA rows for
        GO:0047834 and GO:0042355 on human HSD17B14.
  - id: PMID:24697329
    title: Enzymatic and structural characterization of rTSγ provides insights into the
      function of rTSβ.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Primary paper (Biochemistry 2014, full text cached). Recombinant human
        rTS-gamma (ENOSF1) kinetics and crystal structure; establishes L-fuconate
        dehydratase activity. Basis of the GOA IDA row for GO:0050023 on
        ENOSF1.
  - id: PMID:17144652
    title: 'Evolution of enzymatic activities in the enolase superfamily: L-fuconate dehydratase
