id: MODULE:mammalian_l_fucose_degradation
title: L-fucose degradation (mammalian non-phosphorylative pathway)
description: >-
  Catabolism of free cytosolic L-fucose to pyruvate and L-lactate by a
  five-reaction, non-phosphorylative (oxidative) route described biochemically
  in pig and rabbit liver and kidney and in human. beta-L-Fucose is oxidized by
  NAD+-dependent L-fucose dehydrogenase (HSD17B14) to L-fucono-1,5-lactone,
  which rearranges non-enzymatically to L-fucono-1,4-lactone; a lactonase that
  has not been molecularly identified in mammals hydrolyses the lactone to
  L-fuconate; L-fuconate dehydratase (ENOSF1, the rTS-gamma isoform) forms
  2-keto-3-deoxy-L-fuconate; an NAD+-dependent 2-keto-3-deoxy-L-fuconate
  4-dehydrogenase (BDH2 is the leading candidate) forms
  2,4-diketo-3-deoxy-L-fuconate; and an unidentified hydrolase cleaves this to
  pyruvate and L-lactate. Two of the five steps therefore have no assigned gene
  and a third has a candidate whose physiological role is unsettled. The route
  is chemically analogous to the bacterial non-phosphorylative pathway
  (Xanthomonas, Burkholderia, Herbaspirillum) and is distinct from the
  phosphorylative FucI/FucK/FucA route of Escherichia coli, from the salvage of
  L-fucose to GDP-L-fucose, and from lysosomal release of L-fucose from
  glycoconjugates. The pathway is not universal in mammals: rats oxidize little
  L-fucose and rat HSD17B14 has negligible L-fucose dehydrogenase activity.
status: DRAFT
scope: CONCRETE
