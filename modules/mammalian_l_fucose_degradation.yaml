  - id: PMID:23214453
    title: Discovery of an L-fucono-1,5-lactonase from cog3618 of the amidohydrolase superfamily.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Full text cached. Burkholderia multivorans BmulJ_04915 L-fuconolactonase
        (EC 3.1.1.120); documents the non-enzymatic 1,5- to 1,4-lactone
        rearrangement. Bacterial precedent for the orphan mammalian lactonase
        step; no mammalian protein is identified.
  - id: PMID:38918500
    title: Crystal structure of L-2-keto-3-deoxyfuconate 4-dehydrogenase reveals a unique
