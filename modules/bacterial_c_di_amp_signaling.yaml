  connections:
  - source: c_di_amp_synthesis
    target: c_di_amp_hydrolysis
    connection_type: PRECEDES
    description: Cyclase-made c-di-AMP is the substrate of GdpP and PgpH. Cyclase and phosphodiesterase
      act on the same pool in opposition, and the steady-state level, which must stay within a narrow
      window, is set by their relative activities; that opposition is a shared-pool effect, not a regulation
      of one enzyme by the other, and is not encoded as a regulatory edge.
    chaining_status: VERIFIED
    chaining_note: Product of the cyclase step (c-di-AMP, CHEBI:71578) is the substrate of the first hydrolysis
      step.
    evidence:
    - *id002
    - *id005
    - *id007
  - source: c_di_amp_hydrolysis
    target: papa_clearance
    connection_type: PRECEDES
    description: The pApA made by GdpP or PgpH is the substrate of the Pde2/NrnA step.
    chaining_status: VERIFIED
    chaining_note: Product of the first step (pApA, CHEBI:131579) is the substrate of the second; the
      chain ends at AMP.
    evidence:
    - *id007
    - *id009
  - source: papa_clearance
    target: gdpp_phosphodiesterase
    connection_type: POSITIVELY_REGULATES
    description: Where the S. aureus Pde2 extension is present, pApA clearance relieves inhibition of
      GdpP. This is an indirect substrate-pool effect, not direct protein activation and not an assertion
      about PgpH.
    evidence:
    - *id010
  - source: c_di_amp_synthesis
    target: c_di_amp_reception
    connection_type: PROVIDES_INPUT_FOR
    description: Cyclase-made c-di-AMP is the ligand bound by the receptors.
    evidence:
    - *id012
    - *id020
  - source: c_di_amp_hydrolysis
    target: c_di_amp_reception
    connection_type: NEGATIVELY_REGULATES
    description: Hydrolysis consumes the ligand pool available for receptor binding. Lower occupancy has
      receptor-specific downstream effects; no universal sign on transport or metabolism is implied.
    evidence:
    - *id005
    - *id007
    - *id012
  knowledge_gaps:
  - gap_statement: The direct physiological targets of DarA/PstA remain unresolved despite structural
      ligand-binding and genetic phenotypes.
    boundary: Retain binding without assigning the unknown target activity or a universal uptake-inhibition
      effect.
    gap_kind:
    - BIOLOGY
    provenance:
    - reference_id: PMID:42535852
      supporting_text: its downstream function in S. aureus remains unclear.
    - reference_id: PMID:38832794
      supporting_text: 'Suppressor screens with darA mutants reveal compensatory mechanisms

        involving the accumulation of osmoprotectants, particularly potassium and

        citrulline.'
  - gap_statement: How c-di-AMP occupancy of OpuCA changes native transporter turnover remains incompletely
      resolved; the isolated ATPase assay did not establish nucleotide inhibition.
    boundary: Keep carnitine uptake regulation separate from a claimed direct inhibition of ATP hydrolysis.
    gap_kind:
    - BIOLOGY
    provenance:
    - reference_id: PMID:27531650
      supporting_text: the protein had very weak ATPase activity, which was not sensitive to the concentration
        of c-di-AMP.
  - gap_statement: The physiological relative contributions of Pde2 linear-dinucleotide, nanoRNA and cyclic-substrate
      turnover require further resolution.
    boundary: Represent pApA clearance supported by S. aureus experiments; do not infer a physiological
      cyclic-substrate bypass from weak in vitro activity.
    gap_kind:
    - BIOLOGY
    - ONTOLOGY
    provenance:
    - reference_id: PMID:27834680
