id: MODULE:bacterial_c_di_amp_signaling
title: Bacterial cyclic di-AMP second-messenger signalling
description: >-
  A reusable second-messenger motif, predominantly of Gram-positive bacteria, in
  which cyclic di-AMP (c-di-AMP) reports ionic and osmotic sufficiency.
  Diadenylate cyclases condense two ATP molecules into c-di-AMP; the
  membrane-anchored CdaA/DacA class is the only cyclase in many Firmicutes,
  while DisA and CdaS are additional cytoplasmic classes in spore-formers.
  Degradation is two-tiered: DHH/DHHA1 phosphodiesterases of the GdpP class, and
  the unrelated 7TMR-HD PgpH class, open c-di-AMP to the linear dinucleotide
  pApA, and a second cytoplasmic DHH/DHHA1 enzyme (Pde2/NrnA class) clears pApA
  to AMP, which matters because pApA feedback-inhibits GdpP. Receptors convert
  c-di-AMP binding into inhibition of potassium and compatible-solute uptake:
  RCK_C-domain gating subunits of Ktr/Trk potassium systems and of cation/proton
  antiporters, the USP domain of the KdpD sensor kinase, the tandem CBS domains
  of the OpuC ATPase, and the PII-like receptors DarA/PstA. Because every
  characterised receptor restrains an uptake system, high c-di-AMP corresponds
  to restrained turgor and a reinforced envelope, and both depletion and
  accumulation impair fitness.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: PMID:42535852
    title: Cyclic di-AMP signaling and regulation in Staphylococcus aureus.
    statement: >-
      Review defining the module boundary: synthesis by a single DacA/CdaA-class
      cyclase, sequential degradation by GdpP then Pde2, and a defined receptor
      set acting on ion and osmolyte transport.
    supporting_text: >-
      These effects are mediated by a defined set of c-di-AMP receptors in S.
      aureus, including KtrA, CpaA, KdpD, PstA, and OpuCA.
  - source_id: PMID:23671116
    title: Systematic identification of conserved bacterial c-di-AMP receptor proteins.
    statement: >-
      Systematic affinity and DRaCALA screens identified KtrA, CpaA, KdpD and
      PstA as c-di-AMP receptors that are widely distributed beyond S. aureus,
      and mapped the binding activity of KtrA and CpaA to the RCK_C domain.
notes: >-
  Boundary. The module is the messenger motif: synthesis, two-step degradation,
  and the receptor step at which c-di-AMP binding changes the activity of a
  target. The transport systems the receptors act on are their own modules; the
  Kdp system whose induction c-di-AMP suppresses through KdpD is modelled in
  MODULE:bacterial_kdp_potassium_homeostasis, and this module deliberately does
  not restate the KdpD/KdpE phosphorelay or the KdpFABC pump. Extracellular
  c-di-AMP sensing by the host (STING, inflammasome) is a host pathway and is
  out of scope; MODULE:cgas_sting_signaling covers the receiving side.

  Degradation is modelled as two sequential parts rather than one, because the
  two steps are catalysed by different enzymes, have different GO terms
  available (only the c-di-AMP step has one) and are coupled by pApA feedback
  inhibition of GdpP, which is the reason the second step exists.

  Representatives. S. aureus DacA (UniProtKB:Q2FW92) is the exemplar cyclase but
  is unreviewed in UniProt and its GO:0106408 is IEA only; the experimentally
  grounded diadenylate-cyclase annotations sit on B. subtilis DisA
  (UniProtKB:P37573, EXP from PMID:18439896) and on CdaA/DacA of B. subtilis and
  L. monocytogenes, so both are carried as representatives. Likewise the
  GO:0106409 EXP annotations are on B. subtilis GdpP and L. monocytogenes PgpH,
  while the S. aureus orthologues carry IEA, so the Firmicute exemplars are used
  for the enzyme roles and the S. aureus proteins are named as the species
  instantiation. S. aureus Pde2 corresponds to SAUSA300_1650
  (UniProtKB:A0A0H2XFX6, PANTHER PTHR47618:SF1, the NrnA subfamily), and its
  pApA-preferring activity is from PMID:27834680.

  Receptor-side caveats. PstA binds c-di-AMP with high affinity but its
  downstream target is unknown, so it is given the binding function and no
  process. The CpaA output direction (stimulated potassium export) is the
  review's reading of a predicted antiporter and is recorded as such. DarA is
  the B. subtilis PII-like receptor with structural evidence; GOA currently
  carries no c-di-AMP binding annotation for it (only cytoplasm), so GO:0180001
  is asserted here from the structural literature rather than copied from GOA,
  and that annotation gap is worth reporting. GO:0180001 (cyclic-di-AMP
  binding) exists and is used; its only experimental annotation in GOA is on a
  coral STING, so the bacterial receptor side of this term is essentially
  uncurated.
module:
  id: bacterial_c_di_amp_signaling
  label: Bacterial cyclic di-AMP second-messenger signalling
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: cyclic di-AMP
      term:
        id: CHEBI:71578
        label: cyclic di-AMP
      description: >-
        The second messenger whose synthesis, hydrolysis and recognition define
        the module.
  context:
    taxa:
      - preferred_term: Bacillota (Firmicutes)
        term:
          id: NCBITaxon:1239
          label: Bacillota
        description: >-
          c-di-AMP signalling is most widespread in Gram-positive bacteria,
          where CdaA is often the only cyclase; it also occurs in mycobacteria
          and in some Gram-negative lineages, so the taxon is a centre of
          gravity rather than a limit.
  parts:
    - order: 1
      role: c-di-AMP synthesis by diadenylate cyclases
      node:
        id: c_di_amp_synthesis
        label: Diadenylate cyclase synthesis of c-di-AMP
        module_type: REACTION
        description: >-
          A DAC domain condenses two ATP molecules into c-di-AMP with release of
          pyrophosphate. The reaction needs the domain to oligomerise: the
          isolated DacA catalytic domain is a dimer whose active sites face
          outward and only a higher-order head-to-head assembly is catalytic.
          Cyclase classes differ in their regulatory context rather than in the
          chemistry: membrane-anchored CdaA/DacA is coupled to cell-wall
          precursor metabolism through GlmM and to the membrane protein
          YbbR/CdaR, DisA is a DNA-scanning octamer suppressed by branched DNA,
          and CdaS acts in spore germination.
        annotons:
          - id: dac_cyclase_activity
            label: DAC-domain diadenylate cyclase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: diadenylate cyclases (DAC/DisA_N domain)
                description: >-
                  The CdaA/DacA, DisA, CdaS and CdaM classes share the DAC
                  (DisA_N) catalytic domain; PANTHER places CdaA, DisA and CdaS
                  in one family with class-specific subfamilies.
                term:
                  id: PANTHER:PTHR34185
                  label: DIADENYLATE CYCLASE
                family_terms:
                  - id: PANTHER:PTHR34185:SF1
                    label: DIADENYLATE CYCLASE
                  - id: PANTHER:PTHR34185:SF3
                    label: DNA INTEGRITY SCANNING PROTEIN DISA
                representative_members:
                  - preferred_term: CdaA (Bacillus subtilis)
                    term:
                      id: UniProtKB:Q45589
                      label: Cyclic di-AMP synthase CdaA
                    description: >-
                      Membrane-anchored cyclase of the class that is the sole
                      c-di-AMP source in many Firmicutes; GOA records cyclase
                      activity by IDA and plasma-membrane localisation by IDA.
                  - preferred_term: DacA (Listeria monocytogenes)
                    term:
                      id: UniProtKB:Q8Y5E4
                      label: Diadenylate cyclase DacA
                    description: >-
                      CdaA-class cyclase, the sole cyclase of L. monocytogenes,
                      with IDA cyclase activity in GOA.
                  - preferred_term: DisA (Bacillus subtilis)
                    term:
                      id: UniProtKB:P37573
                      label: DNA integrity scanning protein DisA
                    description: >-
                      Octameric DNA-binding cyclase; the founding experimental
                      demonstration of diadenylate cyclase activity, suppressed
                      by Holliday-junction DNA.
                    evidence:
                      - source_id: PMID:18439896
                        title: >-
                          Structural biochemistry of a bacterial checkpoint
                          protein reveals diadenylate cyclase activity regulated
                          by DNA recombination intermediates.
                        statement: >-
                          Shows that the DisA nucleotide-binding domains are
                          diadenylate cyclases making c-di-AMP, and that
                          branched nucleic acids suppress the activity.
                  - preferred_term: DacA (Staphylococcus aureus)
                    term:
                      id: UniProtKB:Q2FW92
                      label: Diadenylate cyclase DacA
                    description: >-
                      The single S. aureus cyclase: three N-terminal
                      transmembrane helices plus a cytosolic DAC domain,
                      essential for viability in rich medium, inhibited by
                      direct GlmM binding. Its GO:0106408 is IEA only.
                    evidence:
                      - source_id: PMID:42535852
                        statement: >-
                          DacA architecture, essentiality and oligomerisation
                          requirement in S. aureus.
                        supporting_text: >-
                          In S. aureus, c-di-AMP is synthesized by DacA, a
                          membrane-bound diadenylate cyclase with three
                          N-terminal transmembrane helices and a cytosolic DAC
                          domain
            function:
              preferred_term: diadenylate cyclase activity
              term:
                id: GO:0106408
                label: diadenylate cyclase activity
              substrates:
                - preferred_term: ATP
                  term:
                    id: CHEBI:15422
                    label: ATP
              products:
                - preferred_term: cyclic di-AMP
                  term:
                    id: CHEBI:71578
                    label: cyclic di-AMP
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
                description: >-
                  Applies to the CdaA/DacA class, which is membrane-anchored;
                  DisA and CdaS are cytoplasmic.
            role_description: >-
              Sets the input arm of the module, coupling membrane and cell-wall
              state (CdaA class) or DNA integrity (DisA) to c-di-AMP production.
    - order: 2
      role: c-di-AMP hydrolysis to pApA
      node:
        id: c_di_amp_hydrolysis
        label: Phosphodiesterase hydrolysis of c-di-AMP to pApA
        module_type: REACTION
        description: >-
          Two unrelated phosphodiesterase classes open one phosphodiester bond
          of c-di-AMP to give the linear dinucleotide pApA. GdpP-class enzymes
          are membrane-anchored and carry a PAS sensory domain, a degenerate
          GGDEF domain and the DHH/DHHA1 catalytic pair; PgpH-class enzymes use
          an HD domain in a 7TMR-HD architecture. Both are inhibited by
          (p)ppGpp, linking c-di-AMP turnover to the stringent response, and
          GdpP is additionally inhibited by its own product pApA. Which classes
          are present is lineage-specific: staphylococci have GdpP but no PgpH.
        variant_sets:
          - id: c_di_amp_pde_classes
            label: c-di-AMP phosphodiesterase class
            axis: enzyme family
            selection: ONE_OR_MORE
            variants:
              - id: gdpp_phosphodiesterase
                label: GdpP-class DHH/DHHA1 phosphodiesterase
                module_type: REACTION
                description: >-
                  Membrane-anchored PAS-GGDEF-DHH/DHHA1 protein; the DHH/DHHA1
                  domain hydrolyses c-di-AMP to pApA, the degenerate GGDEF
                  domain has ATPase activity rather than cyclase activity and
                  contributes to regulation, and the PAS domain binds heme,
                  which inhibits hydrolysis. In S. aureus GdpP is the major
                  c-di-AMP phosphodiesterase: loss-of-function raises c-di-AMP
                  markedly and is selected under beta-lactam pressure.
                annotons:
                  - id: gdpp_pde_activity
                    label: GdpP-class c-di-AMP phosphodiesterase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: GdpP-class c-di-AMP phosphodiesterases
                        term:
                          id: PANTHER:PTHR47618:SF2
                          label: CYCLIC-DI-AMP PHOSPHODIESTERASE GDPP
                        representative_members:
                          - preferred_term: GdpP (YybT) (Bacillus subtilis)
                            term:
                              id: UniProtKB:P37484
                              label: Cyclic-di-AMP phosphodiesterase GdpP
                            description: >-
                              The founding member, with EXP GO:0106409 in GOA
                              and plasma-membrane localisation; ppGpp is a
                              strong competitive inhibitor of its DHH/DHHA1
                              domain.
                            evidence:
                              - source_id: PMID:19901023
                                title: >-
                                  YybT is a signaling protein that contains a
                                  cyclic dinucleotide phosphodiesterase domain
                                  and a GGDEF domain with ATPase activity.
                                statement: >-
                                  The DHH/DHHA1 domain hydrolyses c-di-AMP to
                                  5'-pApA with physiologically relevant Km,
                                  ppGpp competitively inhibits it, and the
                                  atypical GGDEF domain is an ATPase rather
                                  than a cyclase.
                          - preferred_term: GdpP (Staphylococcus aureus)
                            term:
                              id: UniProtKB:Q2G2T6
                              label: Cyclic-di-AMP phosphodiesterase
                            description: >-
                              SAOUHSC_00015, the S. aureus GdpP; the major S. aureus c-di-AMP
                              phosphodiesterase, whose inactivation raises
                              c-di-AMP, thickens peptidoglycan and rescues
                              lipoteichoic-acid-deficient cells.
                            evidence:
                              - source_id: PMID:21909268
                                title: >-
                                  c-di-AMP is a new second messenger in
                                  Staphylococcus aureus with a role in
                                  controlling cell size and envelope stress.
                                statement: >-
                                  GdpP has in vitro phosphodiesterase activity
                                  on c-di-AMP, gdpP mutants accumulate c-di-AMP
                                  in vivo, and the resulting envelope changes
                                  allow growth without lipoteichoic acid.
                    function:
                      preferred_term: cyclic-di-AMP phosphodiesterase activity
                      term:
                        id: GO:0106409
                        label: cyclic-di-AMP phosphodiesterase activity
                      substrates:
                        - preferred_term: cyclic di-AMP
                          term:
                            id: CHEBI:71578
                            label: cyclic di-AMP
                      products:
                        - preferred_term: pApA
                          term:
                            id: CHEBI:131579
                            label: pApA
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Principal route of c-di-AMP removal, gated by heme at its
                      PAS domain, by ppGpp, and by its own product pApA.
              - id: pgph_phosphodiesterase
                label: PgpH-class 7TMR-HD phosphodiesterase
                module_type: REACTION
                description: >-
                  An HD-domain c-di-AMP phosphodiesterase in a 7TMR-HD membrane
                  architecture, unrelated to the DHH/DHHA1 enzymes but
                  catalysing the same step to 5'-pApA and likewise inhibited by
                  ppGpp. Present in Listeria and Bacillus, absent from
                  staphylococci.
                annotons:
                  - id: pgph_pde_activity
                    label: PgpH-class c-di-AMP phosphodiesterase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PgpH-class c-di-AMP phosphodiesterases
                        term:
                          id: PANTHER:PTHR36442
                          label: CYCLIC-DI-AMP PHOSPHODIESTERASE PGPH
                        representative_members:
                          - preferred_term: PgpH (Listeria monocytogenes)
                            term:
                              id: UniProtKB:A0A0H3GGY3
                              label: Cyclic-di-AMP phosphodiesterase PgpH
                            description: >-
                              Identified by chemical proteomics as a c-di-AMP
                              target and shown to hydrolyse it through its HD
                              domain; EXP GO:0106409 in GOA.
                            evidence:
                              - source_id: PMID:25583510
                                title: >-
                                  An HD-domain phosphodiesterase mediates
                                  cooperative hydrolysis of c-di-AMP to affect
                                  bacterial growth and virulence.
                                statement: >-
                                  The PgpH HD domain binds c-di-AMP with high
                                  affinity and specifically hydrolyses it to
                                  5'-pApA; activity is inhibited by ppGpp.
                    function:
                      preferred_term: cyclic-di-AMP phosphodiesterase activity
                      term:
                        id: GO:0106409
                        label: cyclic-di-AMP phosphodiesterase activity
                      substrates:
                        - preferred_term: cyclic di-AMP
                          term:
                            id: CHEBI:71578
                            label: cyclic di-AMP
                      products:
                        - preferred_term: pApA
                          term:
                            id: CHEBI:131579
                            label: pApA
                    role_description: >-
                      A second, structurally unrelated route from c-di-AMP to
                      pApA in the lineages that encode it.
    - order: 3
      role: pApA clearance to AMP
      node:
        id: papa_clearance
        label: Pde2/NrnA-class hydrolysis of pApA to AMP
        module_type: REACTION
        description: >-
          A cytoplasmic DHH/DHHA1 enzyme of the NrnA class hydrolyses pApA to
          AMP. It can also hydrolyse c-di-AMP but prefers the linear
          dinucleotide, and its physiological point is to prevent pApA
          accumulation: pApA inhibits GdpP, so without this step the first
          degradation step stalls. The step therefore belongs to the module even
          though it does not act on the messenger itself.
        annotons:
          - id: pde2_activity
            label: Pde2/NrnA-class pApA hydrolase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Pde2/NrnA-class DHH/DHHA1 hydrolases
                term:
                  id: PANTHER:PTHR47618:SF1
                  label: BIFUNCTIONAL OLIGORIBONUCLEASE AND PAP PHOSPHATASE NRNA
                representative_members:
                  - preferred_term: Pde2 (Staphylococcus aureus)
                    term:
                      id: UniProtKB:A0A0H2XFX6
                      label: Pde2 (SAUSA300_1650)
                    description: >-
                      Standalone cytoplasmic DHH/DHHA1 protein; hydrolyses
                      c-di-AMP but preferentially converts pApA to AMP, and
                      pApA was first detected in S. aureus in a pde2 mutant.
                    evidence:
                      - source_id: PMID:27834680
                        title: >-
                          New Insights into the Cyclic Di-adenosine
                          Monophosphate (c-di-AMP) Degradation Pathway and the
                          Requirement of the Cyclic Dinucleotide for Acid
                          Stress Resistance in Staphylococcus aureus.
                        statement: >-
                          Pde2 is a second, cytoplasmic DHH/DHHA1
                          phosphodiesterase that prefers pApA over c-di-AMP, and
                          pApA participates in feedback inhibition of
                          GdpP-dependent c-di-AMP hydrolysis.
            function:
              preferred_term: pApA hydrolase activity
              description: >-
                Deliberately carries no GO id: GO:0106409 is specific to the
                c-di-AMP to pApA step, and the former oligoribonucleotidase term
                GO:0034611 is obsolete, so no term describes hydrolysis of the
                linear dinucleotide pApA to AMP. See knowledge_gaps.
              substrates:
                - preferred_term: pApA
                  term:
                    id: CHEBI:131579
                    label: pApA
              products:
                - preferred_term: adenosine 5'-monophosphate
                  term:
                    id: CHEBI:16027
                    label: adenosine 5'-monophosphate
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Keeps pApA low so that the GdpP step can continue; the second
              tier of degradation rather than a messenger-removing step itself.
    - order: 4
      role: c-di-AMP recognition by receptor proteins
      node:
        id: c_di_amp_reception
        label: Protein receptors of c-di-AMP
        module_type: REGULATORY_STEP
        description: >-
          Receptors bind c-di-AMP through one of several unrelated ligand-binding
          modules and, in every characterised case, restrain an uptake system:
          RCK_C-domain gating subunits of Ktr/Trk potassium uptake systems and of
          cation/proton antiporters, the USP domain of the KdpD sensor kinase
          (suppressing induction of the high-affinity Kdp system), the tandem
          CBS domains of the OpuC ATPase (reducing compatible-solute import),
          and PII-like trimers. c-di-AMP therefore reads as a signal of ionic
          and osmotic sufficiency, and the receptor set, not a single effector,
          is what makes both depletion and accumulation of the messenger
          deleterious.
        variant_sets:
          - id: c_di_amp_receptor_modules
            label: c-di-AMP receptor module
            axis: ligand-binding module
            selection: ONE_OR_MORE
            variants:
              - id: rck_c_receptor
                label: RCK_C-domain receptor
                module_type: REGULATORY_STEP
                description: >-
                  The RCK_C domain is the most widely distributed bacterial
                  c-di-AMP binding module. In the Ktr/Trk potassium systems it
                  is carried by the cytoplasmic gating subunit (KtrA in S.
                  aureus, CabP in S. pneumoniae), where c-di-AMP binding locks a
                  conformation that suppresses uptake through the membrane
                  subunit; the same domain in the cation/proton antiporter CpaA
                  binds c-di-AMP with the opposite consequence for potassium
                  flux.
                annotons:
                  - id: rck_c_binding
                    label: RCK_C-domain c-di-AMP binding
                    participant:
                      selector_type: DOMAIN
                      domain:
                        preferred_term: RCK_C domain
                        term:
                          id: InterPro:IPR006037
                          label: Regulator of K+ conductance, C-terminal domain
                        description: >-
                          Found in channels, transporters and antiporters across
                          all kingdoms; in c-di-AMP-producing bacteria a subset
                          of these domains binds the dinucleotide.
                      required_function:
                        preferred_term: cyclic-di-AMP binding
                        term:
                          id: GO:0180001
                          label: cyclic-di-AMP binding
                      description: >-
                        Representative exemplars: S. aureus KtrA
                        (UniProtKB:A0A0H2XI70, SAUSA300_0988), S. aureus CpaA
                        (UniProtKB:A0A0H2XH32, SAUSA300_0911) and S. pneumoniae
                        CabP (UniProtKB:A0ACD7PP93).
                    function:
                      preferred_term: cyclic-di-AMP binding
                      term:
                        id: GO:0180001
                        label: cyclic-di-AMP binding
                      substrates:
                        - preferred_term: cyclic di-AMP
                          term:
                            id: CHEBI:71578
                            label: cyclic di-AMP
                      evidence:
                        - source_id: PMID:23671116
                          statement: >-
                            KtrA was identified by affinity pull-down as a
                            c-di-AMP receptor, the binding activity was mapped
                            to its RCK_C domain, and the same domain in the
                            predicted antiporter CpaA also binds c-di-AMP.
                        - source_id: PMID:24272783
                          title: >-
                            Cyclic di-AMP impairs potassium uptake mediated by a
                            cyclic di-AMP binding protein in Streptococcus
                            pneumoniae.
                          statement: >-
                            CabP binds c-di-AMP specifically, interacts with the
                            potassium transporter SPD_0076, and elevated
                            c-di-AMP impairs both the interaction and potassium
                            uptake.
                    role_description: >-
                      Couples the c-di-AMP level to the gating of potassium
                      uptake and cation/proton exchange.
              - id: usp_receptor
                label: USP-domain receptor (KdpD)
                module_type: REGULATORY_STEP
                description: >-
                  The sensor histidine kinase KdpD carries a cytoplasmic
                  universal stress protein (USP) domain that binds c-di-AMP
                  through a conserved SXS-X20-FTAXY motif. Binding inhibits KdpD
                  autokinase activity, so the high-affinity Kdp potassium system
                  is not induced while c-di-AMP is high; the Kdp system itself
                  is modelled in MODULE:bacterial_kdp_potassium_homeostasis.
                annotons:
                  - id: kdpd_usp_binding
                    label: KdpD USP-domain c-di-AMP binding
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: c-di-AMP-binding KdpD sensor kinases
                        description: >-
                          A subclass of KdpD proteins in c-di-AMP-producing
                          bacteria whose USP domain has acquired dinucleotide
                          binding; not all KdpD proteins bind c-di-AMP.
                        term:
                          id: PANTHER:PTHR45569
                          label: SENSOR PROTEIN KDPD
                        representative_members:
                          - preferred_term: KdpD (Staphylococcus aureus)
                            term:
                              id: UniProtKB:Q2FWH7
                              label: Sensor histidine kinase KdpD
                            description: >-
                              Binds c-di-AMP through its N-terminal cytoplasmic
                              USP domain with micromolar affinity; binding
                              prevents salt-stress upregulation of the kdpFABC
                              operon.
                            evidence:
                              - source_id: PMID:26195599
                                title: >-
                                  Binding of Cyclic Di-AMP to the Staphylococcus
                                  aureus Sensor Kinase KdpD Occurs via the
                                  Universal Stress Protein Domain and
                                  Downregulates the Expression of the Kdp
                                  Potassium Transporter.
                                statement: >-
                                  Maps c-di-AMP binding to the KdpD USP domain
                                  and its conserved motif residues, and shows
                                  binding inhibits kdpFABC induction under salt
                                  stress.
                    function:
                      preferred_term: cyclic-di-AMP binding
                      term:
                        id: GO:0180001
                        label: cyclic-di-AMP binding
                      substrates:
                        - preferred_term: cyclic di-AMP
                          term:
                            id: CHEBI:71578
                            label: cyclic di-AMP
                    role_description: >-
                      Converts a high c-di-AMP level into suppression of the
                      KdpD/KdpE phosphorelay, blocking induction of inducible
                      high-affinity potassium uptake.
              - id: cbs_receptor
                label: CBS-domain receptor (OpuCA)
                module_type: REGULATORY_STEP
                description: >-
                  The ATPase subunit of the OpuC compatible-solute importer
                  carries tandem cystathionine-beta-synthase (CBS) domains that
                  bind c-di-AMP in the cleft between them; binding inhibits the
                  ATPase and so reduces carnitine uptake.
                annotons:
                  - id: opuca_cbs_binding
                    label: OpuCA CBS-domain c-di-AMP binding
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: OpuC-type compatible-solute import ATPases
                        description: >-
                          ABC-transporter ATPases with tandem CBS domains that
                          bind c-di-AMP; the PANTHER subfamily name reflects the
                          related choline transporter OpuBA.
                        term:
