          label: GdpP-class DHH/DHHA1 phosphodiesterase
          module_type: REACTION
          description: Membrane-associated GdpP enzymes use DHH/DHHA1 domains for cyclic-di-AMP hydrolysis.
            The B. subtilis atypical GGDEF domain has ATPase activity, whereas S. aureus GdpP has little
            or no such activity. Heme/NO regulation was characterized in Bacillus/Geobacillus YybT proteins
            and is not asserted for every ortholog.
          annotons:
          - id: gdpp_pde_activity
            label: GdpP-class c-di-AMP phosphodiesterase
            participant:
