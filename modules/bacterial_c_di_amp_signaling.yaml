  connections:
    - source: c_di_amp_synthesis
      target: c_di_amp_hydrolysis
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Cyclase and phosphodiesterase act on the same pool in opposition; the
        steady-state level, which must stay within a narrow window, is set by
        their relative activities.
    - source: c_di_amp_hydrolysis
      target: papa_clearance
      connection_type: PRECEDES
      description: >-
        The pApA made by GdpP or PgpH is the substrate of the Pde2/NrnA step.
      chaining_status: VERIFIED
      chaining_note: >-
        Product of the first step (pApA, CHEBI:131579) is the substrate of the
        second; the chain ends at AMP.
    - source: papa_clearance
      target: c_di_amp_hydrolysis
      connection_type: POSITIVELY_REGULATES
      description: >-
        By keeping pApA low, the clearance step relieves pApA feedback
        inhibition of GdpP and so sustains c-di-AMP hydrolysis.
    - source: c_di_amp_synthesis
      target: c_di_amp_reception
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Cyclase-made c-di-AMP is the ligand bound by the receptors.
    - source: c_di_amp_hydrolysis
      target: c_di_amp_reception
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Hydrolysis lowers receptor occupancy, releasing the restraint on
        potassium and osmolyte uptake.
  knowledge_gaps:
    - gap_statement: >-
        The upstream signals that set cyclase activity are unresolved: GlmM
        binding couples DacA to cell-wall precursor metabolism, but what YbbR
        (CdaR) senses, and which environmental or metabolic cue tunes DacA in
        vivo, are not known.
      boundary: >-
        Describe the cyclase by its activity, membrane anchoring and
        oligomerisation requirement; do not assert a sensed ligand.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The downstream target of the PII-like receptors DarA and PstA is
        unidentified, so the fraction of c-di-AMP signalling that runs through
        the most abundant receptor class cannot be assigned to any process.
      boundary: >-
        Assert c-di-AMP binding only for these receptors; leave process
        assertions to receptors whose target is known.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Whether heme binding to the GdpP PAS domain, and pApA accumulation,
        operate as physiological regulators of c-di-AMP turnover in vivo, and
        what signals distinguish GdpP from Pde2 regulation, is not established.
      boundary: >-
        Record heme and pApA as inhibitors of the enzyme step without asserting
        a physiological condition in which that inhibition is the operative
        control.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        No GO molecular-function term describes hydrolysis of the linear
        dinucleotide pApA to AMP: GO:0106409 covers only the c-di-AMP to pApA
        step and the oligoribonucleotidase term GO:0034611 is obsolete, so the
        second tier of c-di-AMP degradation cannot be annotated.
      boundary: >-
        Leave the Pde2/NrnA annoton's molecular function without a GO id and
        record substrates and products with ChEBI instead.
      gap_kind:
        - ONTOLOGY
        - BIOLOGY
      proposed_terms:
        - proposed_name: pApA hydrolase activity
          proposed_definition: >-
            Catalysis of the reaction: 5'-O-phosphonoadenylyl-(3'-5')-adenosine
            (pApA) + H2O = 2 AMP. The activity of Pde2/NrnA-class DHH/DHHA1
            enzymes that clear the linear product of c-di-AMP hydrolysis and so
            relieve pApA inhibition of GdpP.
