                    title: YybT is a signaling protein that contains a cyclic dinucleotide phosphodiesterase
                      domain and a GGDEF domain with ATPase activity.
                    statement: The DHH/DHHA1 domain hydrolyses c-di-AMP to 5'-pApA with physiologically
                      relevant Km, ppGpp competitively inhibits it, and the atypical GGDEF domain is an
