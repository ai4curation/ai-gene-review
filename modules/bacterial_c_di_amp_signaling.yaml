                  id: PANTHER:PTHR47618:SF2
                  label: CYCLIC-DI-AMP PHOSPHODIESTERASE GDPP
                representative_members:
                - preferred_term: GdpP (YybT) (Bacillus subtilis)
                  term:
                    id: UniProtKB:P37484
                    label: Cyclic-di-AMP phosphodiesterase GdpP
                  description: B. subtilis GdpP/YybT, the founding DHH/DHHA1 c-di-AMP phosphodiesterase.
                  evidence:
