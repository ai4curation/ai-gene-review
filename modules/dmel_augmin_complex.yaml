id: MODULE:dmel_augmin_complex
title: Augmin (HAUS) complex in Drosophila melanogaster
description: >-
  Augmin is an eight-subunit complex that recruits the gamma-tubulin ring complex to the sides
  of existing microtubules, so that new microtubules branch from old ones. This microtubule-dependent
  nucleation amplifies microtubule number within the mitotic and meiotic spindle. In Drosophila
  the complex was first identified in S2 cells, where loss of augmin subunits reduces spindle
  microtubule density.
status: DRAFT
scope: CONCRETE
