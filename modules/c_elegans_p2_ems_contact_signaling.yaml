id: MODULE:c_elegans_p2_ems_contact_signaling
title: P2/EMS contact signaling in the four-cell Caenorhabditis elegans embryo
description: >-
  In the four-cell Caenorhabditis elegans embryo the germline blastomere P2
  touches the endomesodermal precursor EMS, and two partly redundant signals
  pass across that contact. In the Wnt arm, P2 makes the Wnt ligand MOM-2,
  which acts through the Frizzled receptor MOM-5. In the Src arm, the
  transmembrane pseudokinase MES-1 accumulates at the P2/EMS contact and is
  needed there to activate the cytoplasmic tyrosine kinase SRC-1. Loss of
  either arm alone gives at most partial EMS defects, but together the arms
  are required for the two EMS responses. First, the EMS nucleus-centrosome complex rotates so that the
  spindle forms on the anterior-posterior axis, a step that needs the cortical
  regulator LET-99 (in the Src arm) and the NuMA-related force-generator
  adaptor LIN-5. Second, the daughter that touches P2 becomes the endoderm
  precursor E. In the responding cell the MAP3K MOM-4 and the
  beta-catenin-related WRM-1 activate the Nemo-like kinase LIT-1, which
  phosphorylates the TCF protein POP-1 and lowers its nuclear level in E, so
  that endoderm genes can be expressed there. MES-1 and
  SRC-1 also signal back into P2 (and later P3): they orient P2 polarity, the
  asymmetric cortical distribution of the TPR-GoLoco proteins GPR-1/GPR-2, and
  the spindle toward the contact, so that the germline divisions are unequal
  and the germ plasm is passed to P4. Without MES-1 the P2 and P3 divisions
  become symmetric and P4 adopts the muscle fate of its sister D.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:12110172
    title: SRC-1 and Wnt signaling act together to specify endoderm and to control cleavage orientation in early C. elegans embryos.
    statement: >-
      SRC-1 and MES-1 are needed for phosphotyrosine at the P2/EMS contact,
      enhance the endoderm and EMS spindle defects of Wnt pathway mutants, and
      signal in both directions across the contact.
    supporting_text: >-
      SRC-1 and MES-1 signal bidirectionally to control cell fate and division
      orientation in both EMS and P2.
  - source_id: PMID:12110172
    title: SRC-1 and Wnt signaling act together to specify endoderm and to control cleavage orientation in early C. elegans embryos.
    statement: The Wnt and Src arms act in parallel in the one responding cell.
    supporting_text: >-
      Our findings suggest that Wnt and Src signaling function in parallel to
      control developmental outcomes within a single responding cell.
  - source_id: PMID:39891664
    title: The Rac1 homolog CED-10 is a component of the MES-1/SRC-1 pathway for asymmetric division of the Caenorhabditis elegans EMS blastomere.
    statement: >-
      Recent summary of the two partly redundant pathways and the two EMS
      outputs, spindle rotation and endoderm induction in the daughter that
      contacts P2.
    supporting_text: >-
      One pathway involves a Wnt signal from the neighboring P2 cell, while
      the other pathway is defined by the receptor-like MES-1 transmembrane
      protein localized at the EMS-P2 cell contact and the cytoplasmic kinase
      SRC-1.
  - source_id: PMID:9288750
    title: Wnt signaling and an APC-related gene specify endoderm in early C. elegans embryos.
    statement: P2 signaling polarizes EMS and leads to endoderm formation.
    supporting_text: >-
      In a 4-cell stage C. elegans embryo, signaling by the P2 blastomere
      induces anterior-posterior polarity in the adjacent EMS blastomere,
      leading to endoderm formation.
  - source_id: file:worm/mes-1/mes-1-ai-review.yaml
    title: mes-1 gene review
    statement: >-
      The mes-1 review gives MES-1 two core functions from the P2/EMS contact:
      orienting the unequal P2 and P3 divisions, and, in parallel with Wnt
      signaling, EMS spindle orientation and endoderm specification. It removes
      the kinase activity rows because MES-1 is a predicted pseudokinase.
  - source_id: file:worm/mom-4/mom-4-ai-review.yaml
    title: mom-4 gene review
    statement: >-
      The mom-4 review takes MAP kinase kinase kinase activity toward LIT-1 as
      the MOM-4 core function, acting in EMS to lower nuclear POP-1 and specify
      endoderm.
  - source_id: file:worm/gpr-1/gpr-1-ai-review.yaml
    title: gpr-1 gene review
    statement: >-
      The gpr-1 review takes GDP-dissociation inhibitor activity for G-alpha in
      the cortical force-generating complex as the GPR-1 core function in
      spindle positioning.
  - source_id: file:modules/wnt_signaling.yaml
    title: Generic Wnt signaling pathway module
    statement: >-
      The taxon-neutral Wnt module. Its ligand and Frizzled tiers correspond to
      MOM-2 and MOM-5 here, but its canonical destruction-complex branch does
      not describe the WRM-1/LIT-1/POP-1 output used in EMS.
  - source_id: file:modules/primordial_germ_cell_specification.yaml
    title: Primordial germ cell specification module
    statement: >-
      The unequal P2 and P3 divisions oriented by this module deliver the germ
      plasm to P4, the germline founder, in the preformation variant of that
      module.
notes: >-
  Boundary. A concrete C. elegans module for the signals that cross the
  P2/EMS contact at the four-cell stage and their immediate outputs. Root
  parts: the MOM-2/MOM-5 Wnt arm; the MES-1/SRC-1 Src arm; the EMS endoderm
  output (MOM-4, WRM-1, LIT-1, POP-1); the EMS spindle output (LET-99, LIN-5);
  and the reciprocal P2 output (GPR-1/GPR-2). The two arms are modelled as
  parallel inputs that both regulate each EMS output, following Bei et al.
  (PMID:12110172) and Liro and Rose (PMID:27672093). The WRM-1/LIT-1/POP-1
  asymmetry machinery is reused in many later anterior-posterior divisions,
  and the force-generating machinery is used in every division; only their use
  in EMS and P2 is modelled. Endoderm gene regulation downstream of POP-1
  (SKN-1, SYS-1, the END and MED factors) is out of scope. The P2-to-ABp
  APX-1/GLP-1 Notch signal from the same cell is a separate signal, in the
  notch_signaling module.

  Members not given annotons. Wnt secretion needs MOM-1 (Porcupine) and
  MOM-3/MIG-14 (Wntless) in P2, and the Dishevelled proteins DSH-2 and MIG-5
  are needed in the Wnt arm. The Rac CED-10 and the branched-actin regulator
  ARX-2 act upstream of or at the level of SRC-1 in EMS (PMID:39891664), and
  the kinase PIG-1 acts in the Src arm for EMS spindle positioning, while
  PAR-1 acts in the Wnt arm (PMID:30213539). PAR-2 orientation in P2 and P3
  also follows MES-1/SRC-1 (PMID:20823070). These are named in text only. The
  maternal 3'-UTR-binding proteins PIE-1, POS-1 and MEX-1 promote translation
  of mom-2 mRNA in P2 (PMID:24131629, PMID:30279189). That is upstream supply
  of the ligand, not part of the signal, and PIE-1 and POS-1 are modelled in
  primordial_germ_cell_specification instead.

  Grounding. MES-1 G5EBL2, MOM-4 Q9XTC6 and GPR-1 Q95QJ7 come from their gene
  reviews. The other accessions come from UniProt REST (organism 6239, all
  Swiss-Prot): MOM-2 Q10459, MOM-5 A0A0K3AWM6, SRC-1 G5EE56, LIT-1 Q9U9Y8,
  WRM-1 Q10953, POP-1 Q10666, LET-99 Q21341 and LIN-5 P45970. These eight have
  no gene reviews yet, so their molecular functions follow the cited papers
  and are not checked against a review. MES-1 has no molecular function: its
  review removes the kinase rows, since the kinase domain lacks the
  catalytic-loop and DFG aspartates, and no binding activity is established.
  LET-99 is modelled without a molecular function because none is known.
  GPR-1 is placed only in the P2 output: GPR-1/GPR-2 are asymmetric in P2 but
  symmetric in EMS (PMID:21903670), so an earlier report of GPR-1/2 asymmetry
  in EMS (PMID:14534135) is not followed. No production GO-CAM covers these
  genes.
module:
  id: c_elegans_p2_ems_contact_signaling
  label: P2/EMS contact signaling in the four-cell C. elegans embryo
  module_type: SIGNALING_PATHWAY
  description: >-
    Partly redundant MOM-2/MOM-5 Wnt and MES-1/SRC-1 signals across the
    P2/EMS contact orient the EMS spindle and induce endoderm in the E
    daughter. MES-1/SRC-1 also signal back into P2 to orient its unequal
    division.
  concepts:
    - preferred_term: cell-cell signaling involved in cell fate commitment
      term:
        id: GO:0045168
        label: cell-cell signaling involved in cell fate commitment
      description: >-
        The P2 signal commits the EMS daughter that contacts P2 to the
        endoderm (E) fate. The division-orientation outputs are placed on the
        parts that drive them.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    cellular_components:
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
        description: The P2/EMS cell contact, where MES-1 and SRC-1-dependent phosphotyrosine accumulate.
    anatomical_locations:
      - preferred_term: four-cell embryo, P2 and EMS blastomeres
        description: >-
          The germline blastomere P2 (signal-sending for Wnt, and responding
          for its own division orientation) and its ventral neighbour EMS. The
          same MES-1/SRC-1 contact recurs between P3 and E.
  parts:
    - order: 1
      role: Wnt arm from P2 to EMS
      node:
        id: mom2_mom5_wnt_arm
        label: MOM-2 Wnt signal and MOM-5 Frizzled
        module_type: SIGNALING_PATHWAY
        description: >-
          P2 secretes the Wnt MOM-2, which is received through the Frizzled
          receptor MOM-5. Loss of this arm alone reduces endoderm and delays
          EMS spindle rotation.
        concepts:
          - preferred_term: Wnt signaling pathway
            term:
              id: GO:0016055
              label: Wnt signaling pathway
        annotons:
          - id: mom2_wnt_ligand
            label: MOM-2 Wnt ligand from P2
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MOM-2
                term:
                  id: UniProtKB:Q10459
                  label: Protein mom-2
            function:
              preferred_term: frizzled binding
              term:
                id: GO:0005109
                label: frizzled binding
            processes:
              - preferred_term: Wnt signaling pathway
                term:
                  id: GO:0016055
                  label: Wnt signaling pathway
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Secreted Wnt required in the signaling cell P2 for EMS to make
              endoderm.
            evidence:
              - source_id: PMID:9288749
                title: Wnt signaling polarizes an early C. elegans blastomere to distinguish endoderm from mesoderm.
                statement: mom-2 encodes a Wnt and is needed in P2, the signaling cell.
                supporting_text: >-
                  mom-1, mom-2, and mom-3 are required in the signaling cell,
                  P2, while mom-4 is required in EMS
              - source_id: PMID:9288749
                title: Wnt signaling polarizes an early C. elegans blastomere to distinguish endoderm from mesoderm.
                statement: MOM-2 is a member of the Wnt family.
                supporting_text: >-
                  The sequence of mom-2 predicts that it encodes a member of the
                  Wnt family of secreted glycoproteins
          - id: mom5_frizzled_receptor
            label: MOM-5 Frizzled receptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MOM-5
                term:
                  id: UniProtKB:A0A0K3AWM6
                  label: Protein mom-5
            function:
              preferred_term: Wnt receptor activity
              term:
                id: GO:0042813
                label: Wnt receptor activity
            processes:
              - preferred_term: Wnt signaling pathway
                term:
                  id: GO:0016055
                  label: Wnt signaling pathway
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Frizzled receptor of the MOM-2 signal, needed for endoderm
              specification and for timely EMS spindle orientation.
            evidence:
              - source_id: PMID:39891664
                title: The Rac1 homolog CED-10 is a component of the MES-1/SRC-1 pathway for asymmetric division of the Caenorhabditis elegans EMS blastomere.
                statement: Endoderm specification needs MOM-2 from P2 and the Frizzled receptor MOM-5.
                supporting_text: >-
                  Endoderm fate specification requires the Wnt ligand (MOM-2 in
                  C. elegans, expressed in the P2 cell), the transmembrane
                  Frizzled receptor (MOM-5), and other conserved Wnt pathway
                  components
              - source_id: PMID:30213539
                title: The kinases PIG-1 and PAR-1 act in redundant pathways to regulate asymmetric division in the EMS blastomere of C. elegans.
                statement: MOM-2, MOM-5 and the Dishevelled proteins are also needed for timely spindle orientation.
                supporting_text: >-
                  A subset of Wnt signaling components, such as the Wnt ligand
                  (MOM-2 in C. elegans), the Frizzled receptor (MOM-5), and the
                  Disheveled adaptor proteins (DSH-2 and MIG-5) are also
                  required for timely spindle orientation.
        connections:
          - source: mom2_wnt_ligand
            target: mom5_frizzled_receptor
            connection_type: POSITIVELY_REGULATES
            description: MOM-2 from P2 signals through the Frizzled receptor MOM-5.
    - order: 2
      role: MES-1/SRC-1 arm at the P2/EMS contact
      node:
        id: mes1_src1_arm
        label: MES-1 transmembrane pseudokinase and SRC-1 tyrosine kinase
        module_type: SIGNALING_PATHWAY
        description: >-
          MES-1 accumulates in a crescent at the contact between the germline
          blastomere and its endodermal neighbour (P2/EMS, then P3/E), and its
          localization needs MES-1 in both cells. MES-1 is required for
          SRC-1-dependent tyrosine phosphorylation at the contact. The arm
          signals in both directions: into EMS (spindle rotation, endoderm) and
          back into P2 and P3 (division orientation). No GO process term covers
          this signal specifically.
        annotons:
          - id: mes1_contact_pseudokinase
            label: MES-1 receptor-like pseudokinase at the P2/EMS contact
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MES-1
                term:
                  id: UniProtKB:G5EBL2
                  label: Protein mes-1
            processes:
              - preferred_term: establishment of mitotic spindle orientation
                term:
                  id: GO:0000132
                  label: establishment of mitotic spindle orientation
              - preferred_term: endodermal cell fate specification
                term:
                  id: GO:0001714
                  label: endodermal cell fate specification
              - preferred_term: asymmetric cell division
                term:
                  id: GO:0008356
                  label: asymmetric cell division
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Single-pass transmembrane protein with an extracellular domain
              and a cytoplasmic kinase-like domain predicted to be inactive. It
              provides the contact-restricted cue and is needed to activate
              SRC-1 there. No molecular function is asserted; how it activates
              SRC-1 is not known.
            evidence:
              - source_id: PMID:11003841
                title: MES-1, a protein required for unequal divisions of the germline in early C. elegans embryos, resembles receptor tyrosine kinases and is localized to the boundary between the germline and gut cells.
                statement: MES-1 is a receptor tyrosine kinase-like protein predicted to lack kinase activity.
                supporting_text: >-
                  mes-1 encodes a receptor tyrosine kinase-like protein, though
                  it lacks several residues conserved in all kinases and
                  therefore is predicted not to have kinase activity.
              - source_id: PMID:11003841
                title: MES-1, a protein required for unequal divisions of the germline in early C. elegans embryos, resembles receptor tyrosine kinases and is localized to the boundary between the germline and gut cells.
                statement: MES-1 is at the germline/gut cell junction in four- to 24-cell embryos.
                supporting_text: >-
                  MES-1 is present in four- to 24-cell embryos, where it is
                  localized in a crescent at the junction between the germline
                  cell and its neighboring gut cell.
              - source_id: PMID:39891664
                title: The Rac1 homolog CED-10 is a component of the MES-1/SRC-1 pathway for asymmetric division of the Caenorhabditis elegans EMS blastomere.
                statement: MES-1 is needed for SRC-1 activation at the EMS-P2 contact.
                supporting_text: >-
                  Further, MES-1 is required for activation of SRC-1 at the
                  EMS-P2 contact, based on the staining pattern of an antibody
                  that detects SRC-1-dependent tyrosine phosphorylation
              - source_id: file:worm/mes-1/mes-1-ai-review.yaml
                title: mes-1 gene review
                statement: >-
                  The review's core functions place MES-1 at the plasma
                  membrane of the P2/EMS contact in asymmetric cell division,
                  establishment of mitotic spindle localization and
                  orientation, and endodermal cell fate specification, with no
                  molecular function.
          - id: src1_tyrosine_kinase
            label: SRC-1 Src-family tyrosine kinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SRC-1
                term:
                  id: UniProtKB:G5EE56
                  label: Tyrosine protein-kinase src-1
            function:
              preferred_term: non-membrane spanning protein tyrosine kinase activity
              term:
                id: GO:0004715
                label: non-membrane spanning protein tyrosine kinase activity
            processes:
              - preferred_term: establishment of mitotic spindle orientation
                term:
                  id: GO:0000132
                  label: establishment of mitotic spindle orientation
              - preferred_term: endodermal cell fate specification
                term:
                  id: GO:0001714
                  label: endodermal cell fate specification
            locations:
              - preferred_term: cell cortex
                term:
                  id: GO:0005938
                  label: cell cortex
            role_description: >-
              Cytoplasmic kinase at the cell cortex of all contacts, slightly
              enriched at the EMS-P2 contact, whose MES-1-dependent activity
              produces the phosphotyrosine signal there.
            evidence:
              - source_id: PMID:12110172
                title: SRC-1 and Wnt signaling act together to specify endoderm and to control cleavage orientation in early C. elegans embryos.
                statement: src-1 and mes-1 are needed for phosphotyrosine accumulation between P2 and EMS.
                supporting_text: >-
                  two tyrosine kinase-related genes, src-1 and mes-1, are
                  required for the accumulation of phosphotyrosine between P2
                  and EMS
              - source_id: PMID:39891664
                title: The Rac1 homolog CED-10 is a component of the MES-1/SRC-1 pathway for asymmetric division of the Caenorhabditis elegans EMS blastomere.
                statement: Endogenous SRC-1::GFP is cortical at all contacts and slightly enriched at the EMS-P2 contact.
                supporting_text: >-
                  SRC-1::GFP was cortically localized to all cell contacts at
                  the 4-cell stage.
        connections:
          - source: mes1_contact_pseudokinase
            target: src1_tyrosine_kinase
            connection_type: POSITIVELY_REGULATES
            description: >-
              MES-1 is required for SRC-1-dependent tyrosine phosphorylation at
              the P2/EMS contact. The mechanism is not known.
    - order: 3
      role: endoderm induction in the E daughter of EMS
      node:
        id: ems_endoderm_induction
        label: WRM-1/LIT-1 lowering of nuclear POP-1 in E
        module_type: DEVELOPMENTAL_PROCESS
        description: >-
          In the responding cell the MAP3K MOM-4 and the beta-catenin-related
          WRM-1 activate the Nemo-like kinase LIT-1. LIT-1, with WRM-1 as its
          substrate-binding subunit, phosphorylates POP-1 and lowers its
          nuclear level in the daughter that contacts P2, which becomes the
          endoderm precursor E. Loss of SRC-1 enhances the POP-1 nuclear
          export defect of Wnt pathway mutants, so both arms feed this output.
        concepts:
          - preferred_term: endodermal cell fate specification
            term:
              id: GO:0001714
              label: endodermal cell fate specification
        annotons:
          - id: mom4_map3k
            label: MOM-4 MAP3K activating LIT-1
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MOM-4
                term:
                  id: UniProtKB:Q9XTC6
                  label: Mitogen-activated protein kinase kinase kinase mom-4
            function:
              preferred_term: MAP kinase kinase kinase activity
              term:
                id: GO:0004709
                label: MAP kinase kinase kinase activity
              targets:
                - preferred_term: LIT-1 activation-loop Thr220
            processes:
              - preferred_term: endodermal cell fate specification
                term:
                  id: GO:0001714
                  label: endodermal cell fate specification
            role_description: >-
              Required in EMS, not in P2. Phosphorylates LIT-1 Thr220 directly,
              without an intervening MAP2K.
            evidence:
              - source_id: PMID:10488343
                title: MOM-4, a MAP kinase kinase kinase-related protein, activates WRM-1/LIT-1 kinase to transduce anterior/posterior polarity signals in C. elegans.
                statement: MOM-4 stimulates WRM-1/LIT-1-dependent phosphorylation of POP-1.
                supporting_text: >-
                  encodes a MAP kinase kinase kinase-related protein that
                  stimulates the WRM-1/LIT-1-dependent phosphorylation of POP-1
              - source_id: PMID:25548171
                title: β-Catenin-related protein WRM-1 is a multifunctional regulatory subunit of the LIT-1 MAPK complex.
                statement: MOM-4 can directly phosphorylate LIT-1 Thr220, which LIT-1 activity needs.
                supporting_text: >-
                  T220 can be phosphorylated either through LIT-1
                  autophosphorylation or directly by the upstream MAP3K MOM-4.
              - source_id: file:worm/mom-4/mom-4-ai-review.yaml
                title: mom-4 gene review
                statement: >-
                  Core function: MAP kinase kinase kinase activity, acting in
                  EMS in endodermal cell fate specification.
          - id: wrm1_lit1_subunit
            label: WRM-1 substrate-binding subunit of the LIT-1 kinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: WRM-1
                term:
                  id: UniProtKB:Q10953
                  label: Armadillo repeat-containing protein wrm-1
            function:
              preferred_term: protein serine/threonine kinase activator activity
              term:
                id: GO:0043539
                label: protein serine/threonine kinase activator activity
            processes:
              - preferred_term: endodermal cell fate specification
                term:
                  id: GO:0001714
                  label: endodermal cell fate specification
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Beta-catenin-related protein that binds LIT-1 and POP-1, promotes
              LIT-1 activation and carries the kinase complex into the nucleus.
              Signaling retains it in the nucleus of the responding daughter.
            evidence:
              - source_id: PMID:25548171
                title: β-Catenin-related protein WRM-1 is a multifunctional regulatory subunit of the LIT-1 MAPK complex.
                statement: WRM-1 is the substrate-binding subunit for LIT-1 and takes the complex into the nucleus.
                supporting_text: >-
                  In addition, we show that WRM-1 is essential for the
                  translocation of the LIT-1 kinase complex to the nucleus, the
                  site of its TCF substrate.
              - source_id: PMID:16077004
                title: Wnt signaling drives WRM-1/beta-catenin asymmetries in early C. elegans embryos.
                statement: Wnt signaling retains WRM-1 in the nuclei of responding cells.
                supporting_text: >-
                  While WRM-1 protein initially accumulates in the nuclei of all
                  cells, signaling promotes the retention of WRM-1 in nuclei of
                  responding cells.
          - id: lit1_nlk_kinase
            label: LIT-1 Nemo-like kinase phosphorylating POP-1
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LIT-1
                term:
                  id: UniProtKB:Q9U9Y8
                  label: Serine/threonine kinase NLK
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: POP-1
            processes:
              - preferred_term: endodermal cell fate specification
                term:
                  id: GO:0001714
                  label: endodermal cell fate specification
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              With WRM-1, phosphorylates POP-1 and lowers its nuclear level in
              the E daughter.
            evidence:
              - source_id: PMID:10488343
                title: MOM-4, a MAP kinase kinase kinase-related protein, activates WRM-1/LIT-1 kinase to transduce anterior/posterior polarity signals in C. elegans.
                statement: WRM-1 and LIT-1 form a kinase complex that phosphorylates POP-1.
                supporting_text: >-
                  WRM-1 and LIT-1 form a kinase complex that can directly
                  phosphorylate POP-1
              - source_id: PMID:25548171
                title: β-Catenin-related protein WRM-1 is a multifunctional regulatory subunit of the LIT-1 MAPK complex.
                statement: Activation-loop Thr220 phosphorylation is needed for LIT-1 kinase activity.
                supporting_text: >-
                  we show that phosphorylation of T220 in the activation loop is
                  essential for LIT-1 kinase activity in vivo and in vitro
          - id: pop1_tcf
            label: POP-1 TCF output of the polarity signal
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: POP-1
                term:
                  id: UniProtKB:Q10666
                  label: Protein pop-1
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
              - preferred_term: endodermal cell fate specification
                term:
                  id: GO:0001714
                  label: endodermal cell fate specification
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              The sole C. elegans TCF. Its nuclear level is lowered in E but not
              in its sister MS, which lets endoderm genes be expressed in E.
            evidence:
              - source_id: PMID:9288749
                title: Wnt signaling polarizes an early C. elegans blastomere to distinguish endoderm from mesoderm.
