knowledge_gaps:
  - gap_statement: >-
      The molecular activity of MES-1 is unknown. It is not known what the
      MES-1 extracellular domain binds across the P2/EMS contact, or how the
      predicted pseudokinase domain leads to SRC-1 activation.
    boundary: >-
      MES-1 is a transmembrane receptor-like protein whose kinase domain lacks
      conserved catalytic residues, and it is required for SRC-1-dependent
      phosphotyrosine at the contact. A homotypic MES-1/MES-1 interaction has
      been proposed but not shown, and no ligand, binding partner or direct
      SRC-1 contact has been identified.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This decides whether MES-1 is a receptor, an adhesion-like positional
      cue, or a scaffold for SRC-1, and so how a contact-restricted signal is
      read in both cells.
    resolution: >-
      Identify MES-1 ectodomain partners by proximity labelling at the P2/EMS
      contact and by binding assays, and test SRC-1 binding and activation
      with MES-1 cytoplasmic-domain mutants in vivo.
    provenance:
      - reference_id: PMID:11003841
        supporting_text: >-
          though it lacks several residues conserved in all kinases and
          therefore is predicted not to have kinase activity
        reference_section_type: ABSTRACT
  - gap_statement: >-
      How the Wnt and Src arms converge on WRM-1 and POP-1 asymmetry in EMS
      is not known, including which SRC-1 substrates act in endoderm
      induction and in spindle rotation.
    boundary: >-
      Genetics places the two arms in parallel for both outputs, and SRC-1
      loss enhances the POP-1 nuclear export defect of Wnt mutants, but no
      SRC-1 substrate in this pathway has been identified.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This would show whether the arms meet at the WRM-1/LIT-1 complex, at
      the nuclear anchoring step, or only at the level of cell fate.
    resolution: >-
      Phosphoproteomics of four-cell embryos with and without SRC-1 activity,
      followed by phosphosite mutants of candidate substrates scored for
      POP-1 asymmetry and EMS spindle rotation in a Wnt-sensitized background.
    provenance:
      - reference_id: PMID:20298434
        supporting_text: >-
          However, how Wnt and Src signaling control asymmetric
          WRM-1/β-catenin and POP-1/TCF nuclear localization remains to be
          elucidated.
        reference_section_type: INTRODUCTION
