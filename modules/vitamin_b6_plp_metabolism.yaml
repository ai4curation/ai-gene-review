id: MODULE:vitamin_b6_plp_metabolism
title: Vitamin B6 (pyridoxal 5'-phosphate) supply by PdxS/PdxT synthesis or vitamer salvage, and PLP homeostasis
description: >-
  Pyridoxal 5'-phosphate (PLP) is the active form of vitamin B6 and the
  cofactor of a large set of enzymes, including transaminases, decarboxylases
  and racemases of amino-acid, one-carbon, heme and neurotransmitter metabolism.
  Cells obtain PLP in two ways. Fungi, plants, archaea and many bacteria can
  make PLP de novo with the two-subunit PLP synthase: the PdxT (SNO) subunit
  hydrolyses glutamine and passes the ammonia to the PdxS (SNZ/PDX1) subunit,
  which builds PLP directly from ribose 5-phosphate and glyceraldehyde
  3-phosphate. This route does not use deoxyxylulose 5-phosphate; the
  separate DXP-dependent route of some bacteria is described in
  modules/pyridoxal_5_phosphate_biosynthesis.yaml. All cells can also salvage
  the B6 vitamers. Pyridoxal kinase (PDXK; BUD16 in budding yeast)
  phosphorylates pyridoxal, pyridoxine and pyridoxamine with ATP to PLP,
  pyridoxine 5'-phosphate (PNP) and pyridoxamine 5'-phosphate (PMP), and the
  FMN-dependent PNP/PMP oxidase (PNPO; PDX3 in yeast) oxidises PNP and PMP to
  PLP. Animals cannot make PLP de novo and depend on salvage of dietary
  vitamers. In mammals, PLP levels are also tuned by the magnesium-dependent
  pyridoxal phosphatase PDXP (chronophin), which dephosphorylates PLP back to
  pyridoxal and also dephosphorylates the actin regulator cofilin. Inherited
  PNPO deficiency causes a PLP-responsive neonatal epileptic encephalopathy.
status: DRAFT
evidence:
  - source_id: YeastPathways:PLPSAL-PWY
    title: pyridoxal 5'-phosphate salvage I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Source pathway for the fungal salvage exemplars: BUD16 pyridoxal kinase
      (three vitamer reactions) and PDX3 PNP/PMP oxidase. Both assignments are
      kept. The frame comment states that S. cerevisiae also makes PLP by the
      fungal-type de novo pathway, whose SNZ1/SNO1 genes are not in this frame
      and are added here as the de novo entry variant.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PLPSAL-PWY
  - source_id: GO:0009443
    title: pyridoxal 5'-phosphate salvage
    statement: The salvage variant carries out pyridoxal 5'-phosphate salvage (GO:0009443) from B6 vitamers.
  - source_id: GO:0042823
    title: pyridoxal 5'-phosphate biosynthetic process
    statement: >-
      Common parent of the salvage and de novo routes; used for the PdxS/PdxT
      variant.
  - source_id: GO:0042816
    title: vitamin B6 metabolic process
    statement: The module as a whole is part of vitamin B6 metabolic process (GO:0042816).
  - source_id: file:human/PDXK/PDXK-ai-review.yaml
    title: PDXK gene review (human)
    statement: The vitamer-phosphorylation step (UniProtKB:O00764, GO:0008478) matches the completed human PDXK review.
  - source_id: file:human/PNPO/PNPO-ai-review.yaml
    title: PNPO gene review (human)
    statement: The PNP/PMP->PLP oxidation step (UniProtKB:Q9NVS9, GO:0004733) matches the completed human PNPO review.
  - source_id: file:human/PDXP/PDXP-ai-review.yaml
    title: PDXP gene review (human)
    statement: The PLP dephosphorylation (homeostasis) step (UniProtKB:Q96GD0, GO:0033883) matches the completed human PDXP review.
  - source_id: PMID:10430950
    title: A highly conserved sequence is a novel gene involved in de novo vitamin B6 biosynthesis.
    statement: >-
      The fungal SOR1/PDX1 (SNZ) protein is required for de novo pyridoxine
      synthesis, and organisms encode either this protein or the E. coli
      (DXP-dependent) genes, indicating two separate de novo routes.
    supporting_text: >-
      Sequence database analysis demonstrated that organisms encode either SOR1 or E.
      coli pyridoxine biosynthesis genes, but not both
  - source_id: PMID:15771487
    title: Reconstitution and biochemical characterization of a new pyridoxal-5'-phosphate biosynthetic pathway.
    statement: Reconstitution of PLP synthesis with B. subtilis PdxS (YaaD) and PdxT (YaaE).
  - source_id: PMID:17189272
    title: Reaction mechanism of pyridoxal 5'-phosphate synthase. Detection of an enzyme-bound chromophoric intermediate.
    statement: >-
      Pdx1 (PdxS) is the synthase subunit and Pdx2 (PdxT) the glutaminase;
      ribose 5-phosphate is the preferred C5 substrate.
    supporting_text: >-
      distinguished by the presence of two genes, Pdx1 and Pdx2, encoding the
      synthase and glutaminase subunit of PLP synthase, respectively
  - source_id: PMID:14764090
    title: Characterization of the products of the genes SNO1 and SNZ1 involved in pyridoxine synthesis in Saccharomyces cerevisiae.
    statement: >-
      Coexpressed Sno1p and Snz1p form a complex with glutaminase activity,
      Sno1p being the glutaminase subunit.
  - source_id: PMID:12271461
    title: Functional analysis of yeast gene families involved in metabolism of vitamins B1 and B6.
    statement: >-
      SNZ1 and SNO1 are required for growth without vitamin B6; the SNZ2/SNZ3
      and SNO2/SNO3 copies are not, and are linked to thiamine synthesis.
    supporting_text: >-
      In media lacking vitamin B(6), SNZ1 and SNO1 were both required for growth in certain
      conditions, but neither SNZ2, SNZ3, SNO2 nor SNO3 were required.
  - source_id: PMID:17696614
    title: A screen for suppressors of gross chromosomal rearrangements identifies a conserved role for PLP in preventing DNA lesions.
    statement: BUD16 encodes yeast pyridoxal kinase.
  - source_id: PMID:7896706
    title: 'Sterol uptake induced by an impairment of pyridoxal phosphate synthesis in Saccharomyces cerevisiae: cloning and sequencing of the PDX3 gene encoding pyridoxine (pyridoxamine) phosphate oxidase.'
    statement: PDX3 encodes the yeast PNP/PMP oxidase.
  - source_id: PMID:15483325
    title: Evolution of vitamin B6 (pyridoxine) metabolism by gain and loss of genes.
    statement: >-
      Comparative genomics of the de novo, fungal-type and salvage PLP
      pathways; cited by YeastPathways.
notes: >-
  Generalised from a human salvage/homeostasis module. The human content (PDXK,
  PNPO, PDXP and their gene reviews) is kept; fungal exemplars and a de novo
  entry are added. The PLP supply part is a ONE_OR_MORE variant set because
  fungi, plants and many bacteria have both the PdxS/PdxT synthase and
  salvage, whereas animals have only salvage. The PdxS/PdxT synthase is
  modelled with a separate annoton per subunit: the PdxS (SNZ) annoton carries
  the overall PLP synthase activity (GO:0036381) and the PdxT (SNO) annoton
  carries glutaminase activity (GO:0004359), as in the SNO2 gene review. Only
  SNZ1/SNO1 are used as S. cerevisiae exemplars; the SNZ2/SNZ3/SNO2/SNO3 copies
  are induced by thiamine limitation and appear to supply PLP for thiamine
  pyrimidine synthesis (modules/eukaryotic_thiamine_biosynthesis.yaml).
  S. cerevisiae BUD17, a pyridoxal kinase paralogue of BUD16, is not used
  because its activity has not been established. The PDXP homeostasis part is
  optional and characterised in mammals; no fungal PLP phosphatase is
  assigned. Vitamer uptake (S. cerevisiae TPN1) is outside the module. GO-CAM
  notes: the SGD model (PLPSAL-PWY) has only BUD16 and PDX3 and no causal
  edges. The PomBase model adds snz1/sno1 (with sno1 glutaminase directly
  positively regulating snz1 synthase), two pyridoxal kinases (SPCC18.10 and
  SPAC6F6.11c), pdx3, and two pyridoxal reductases (plr1, akr7; pyridoxine
  4-dehydrogenase, GO:0050236) that interconvert pyridoxal and pyridoxine; the
  reductases are vitamer interconversion rather than PLP formation and are
  outside this module. PomBase gives pdx3 no location and places it in
  pyridoxine biosynthesis and pyridoxamine metabolism rather than PLP salvage.
