id: MODULE:dmel_sulfide_oxidation
title: Mitochondrial sulfide oxidation in Drosophila melanogaster
description: >-
  Hydrogen sulfide produced by cysteine catabolism and gut microbes is detoxified in the mitochondrial
  matrix. Sulfide:quinone oxidoreductase (Sqor) oxidises sulfide to a protein-bound persulfide,
  passing the electrons to ubiquinone in the respiratory chain. The persulfide sulfur is then
  oxidised to sulfite by the persulfide dioxygenase ETHE1 (CG30022 in flies) or transferred
  to sulfite to form thiosulfate. Sulfite oxidase (shop) oxidises sulfite to sulfate, and
  the mitochondrial dicarboxylate carrier (Dic1) can export thiosulfate and sulfate in exchange
  for other anions.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002230
  title: 'FlyBase gene group SULOXID: Sulfide oxidation'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as sulfide oxidation (SULOXID);
    this module models that group.
- source_id: GO:0019418
  title: sulfide oxidation
  statement: >-
    GO term grounding the module as sulfide oxidation.
notes: >-
  Boundary. The sulfurtransferase (rhodanese) step that makes thiosulfate is not in the FlyBase
  group and is not modelled. CG30022 is the fly ortholog of ETHE1 (UniProt names it persulfide
  dioxygenase ETHE1); its activity and those of Sqor follow orthology and have not been assayed
  in flies, and CG30022 is grounded to its FlyBase gene id because the generator's index has
  no UniProt accession for it. Dic1 transport of thiosulfate, sulfate and dicarboxylates has
  been shown in reconstituted proteoliposomes; Dic1 also transports malate, succinate and
  phosphate, so its role here is one of several. Sulfite oxidase also handles sulfite from
  cysteine catabolism. FlyBase groups realized by this module: SULOXID (FBgg0002230). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_sulfide_oxidation.yaml; none of the member genes has a gene review
  yet unless noted.
