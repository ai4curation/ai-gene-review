    - source: npc_translocation
      target: cytoplasmic_remodelling
      connection_type: PRECEDES
      description: >-
        The emerging mRNP is remodelled by DDX19-GLE1-IP6 at the cytoplasmic filaments, which
        releases NXF1 and ALYREF for recycling.
    - source: crm1_mrna_export
      target: npc_translocation
      connection_type: PRECEDES
      description: >-
        Adaptor-CRM1-RanGTP-mRNA complexes cross the same pore; their release depends on Ran
        GTP hydrolysis rather than on DDX19.
knowledge_gaps:
  - gap_statement: >-
      How the cytoplasmic DDX19-GLE1-IP6 cycle releases NXF1 and ALYREF from the mRNP in human
      cells is not established. The activation mechanism was defined with yeast Dbp5, Gle1 and
      Nup159, and the human DDX19-NUP214 structures show that NUP214 and RNA binding are
      mutually exclusive, but which human mRNP proteins DDX19 displaces, how many ATP cycles one
      mRNP needs, and whether human GLE1 requires IP6 to the same degree are not known.
    boundary: >-
      The remodelling step is modelled with DDX19B, GLE1 and NUP214 as separate annotons, with
      the release of export factors stated in prose rather than as a has-output relation.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This step is what makes export directional and recycles the export factors, and human
      GLE1 mutations cause lethal congenital contracture syndrome, so the human mechanism
      bears directly on disease interpretation.
    resolution: >-
      Reconstitution of human DDX19B ATPase and RNA release with GLE1, IP6 and NUP214 using
      purified human mRNPs carrying NXF1-NXT1 and ALYREF, combined with single-molecule imaging
      of export-factor release at the pore in cells expressing IP6-binding-deficient GLE1.
    provenance:
      - reference_id: PMID:19219046
        supporting_text: These results suggest a framework for the consecutive steps leading to the release of mRNA at the final stages of nuclear export.
  - gap_statement: >-
      The share of cellular mRNA exported by CRM1 rather than NXF1, and the endogenous cargoes
      of NXF3, are undefined. Each CRM1 adaptor route was described with a handful of reporter
      or candidate mRNAs.
    boundary: >-
      The CRM1 route is an optional part, and its adaptors a ONE_OR_MORE ROUTE variant set; NXF3
      is modelled without named cargo.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Whether the CRM1 route is a minor specialised pathway or a regulated switch for whole
      mRNA classes (for example in proliferation through eIF4E, or in stress through HuR)
      decides whether it should be treated as part of core mRNA export or as regulation.
    resolution: >-
      Transcriptome-wide nuclear/cytoplasmic fractionation sequencing after acute,
      degron-mediated depletion of NXF1 versus XPO1 (and of each adaptor), with CLIP of NXF3
      in testis-derived cells to identify its cargoes.
    provenance:
      - reference_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001587.yaml
        supporting_text: The bulk of mRNA is exported via the NXF1-NXT1 system while a smaller subset of mRNA and other RNA particles are exported via CRM1.
