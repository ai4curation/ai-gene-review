    - order: 5
      role: mRNP remodelling and release at the cytoplasmic filaments
      node:
        id: cytoplasmic_remodelling
        label: DDX19-GLE1-IP6 remodelling at the cytoplasmic face
        module_type: BIOLOGICAL_PROCESS
        description: >-
          As the mRNP emerges, the DEAD-box ATPase DDX19 (Dbp5), held on the cytoplasmic
          filaments by NUP214, is activated by GLE1 bound to inositol hexakisphosphate (IP6).
          GLE1-IP6 stimulates RNA-dependent ATP hydrolysis and RNA release, and NUP214 binding is
          mutually exclusive with RNA binding, so the cycle strips export factors (NXF1, ALYREF)
          from the mRNA and keeps export directional. The mechanism was worked out mainly in
          yeast (Dbp5, Gle1, Nup159) and with crystal structures of the human DDX19-NUP214 pair.
        evidence:
          - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001587.yaml
            statement: RGD record text for the remodelling step.
            supporting_text: Ddx19 is specifically bound to Nup214 and its RNA-dependent ATPase activity relies on Gle1-IP6 stimulation and Nup214-triggered ADP release.
          - source_id: PMID:16783363
            statement: Gle1 and IP6 together stimulate the RNA-dependent ATPase of Dbp5 (yeast).
            supporting_text: Here, we show that Gle1 and InsP6 act together to stimulate the RNA-dependent ATPase activity of the essential DEAD-box protein Dbp5.
          - source_id: PMID:21441902
            statement: Structural basis of DDX19/Dbp5 activation by Gle1-IP6 and its NUP214/Nup159 anchor.
            supporting_text: Dbp5 is localized to the NPC via an interaction with Nup159 (NUP214 in vertebrates) and is locally activated there by Gle1 together with the small-molecule inositol hexakisphosphate (InsP(6)).
          - source_id: Reactome:R-HSA-75098
            statement: Reactome reaction for release of export factors at the cytosolic face.
            supporting_text: At the end of this reaction, 1 molecule of 'THOC4(Aly/Ref)', 1 molecule of 'Mature mRNP Complex', 1 molecule of 'SRm160', and 1 molecule of 'TAP' are present.
        annotons:
          - id: ddx19b_remodelling
            label: DDX19B RNA-dependent ATPase remodelling the mRNP
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DDX19B
