id: MODULE:cdp_dag_phospholipid_synthesis
title: CDP-diacylglycerol pathway of phospholipid synthesis (PS, PE, PC by methylation, PI, PG and cardiolipin)
description: >-
  In the CDP-diacylglycerol (CDP-DAG) pathway, phosphatidic acid is activated with CTP to the liponucleotide
  CDP-DAG, which then donates its phosphatidyl group to a polar head-group acceptor, releasing CMP. Different
  CDP-alcohol phosphatidyltransferases use serine (phosphatidylserine synthase), myo-inositol
  (phosphatidylinositol synthase) and glycerol-3-phosphate (phosphatidylglycerophosphate synthase). In the
  aminophospholipid branch, phosphatidylserine (PS) is decarboxylated to phosphatidylethanolamine (PE) by
  pyruvoyl-dependent PS decarboxylases, and PE is converted to phosphatidylcholine (PC) by three successive
  S-adenosylmethionine-dependent N-methylations, performed by two enzymes in fungi or by a single PEMT enzyme in
  animals. In the mitochondrial branch, phosphatidylglycerophosphate is dephosphorylated to phosphatidylglycerol
  (PG), which is condensed with a second CDP-DAG by a eukaryotic CDP-alcohol phosphotransferase-type cardiolipin
  synthase to form cardiolipin. The pathway is distributed between compartments: CDP-DAG for PS and PI is made in
  the endoplasmic reticulum, whereas cardiolipin synthesis uses CDP-DAG made in the mitochondrial inner membrane
  by a distinct, Tam41-type CDP-DAG synthase; the major PS decarboxylase acts in the mitochondrial inner membrane
  and a second one in the endomembrane system, so PS and PE must move between the ER and mitochondria. In
  fungi this route makes PE and PC when ethanolamine and choline are not supplied, whereas the Kennedy pathway
  makes them from those precursors.
status: DRAFT
scope: CONCRETE
