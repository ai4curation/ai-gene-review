id: MODULE:phagosome_maturation
title: Phagosome maturation
description: >-
  Phagosome maturation turns the nascent phagosome, which has no microbicidal
  or degradative activity, into a phagolysosome. It does so through an ordered
  series of fusion and fission events with endocytic and lysosomal
  compartments. The sealed phagosome first recruits active Rab5, and the class
  III PI3K VPS34 makes PI(3)P on its membrane. The Mon1-Ccz1 complex, a Rab5
  effector and Rab7 GEF, then hands the vacuole over to Rab7. Rab7 and its
  effectors, together with LAMP proteins and the HOPS tethering complex, drive
  microtubule-dependent movement and fusion with late endosomes and lysosomes.
  The V-ATPase acidifies the lumen as it is delivered. In professional
  phagocytes the NOX2 NADPH oxidase also assembles on the phagosomal membrane
  and produces superoxide into the lumen. The same machinery degrades
  internalized microbes and engulfed apoptotic cells, and its core is
  conserved between C. elegans and mammals.
status: DRAFT
references:
