          phagosome with late endosomes and lysosomes. In C. elegans, HOPS acts
          downstream of RAB-7 recruitment. In animals, Rab7 also recruits RILP
          and the dynein-dynactin motor, which move the phagosome toward the
          cell center and extend tubules toward late endocytic compartments, and
          LAMP-1/LAMP-2 are needed for Rab7 recruitment and fusion.
