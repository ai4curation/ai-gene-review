id: MODULE:phagosome_maturation
title: Phagosome maturation
description: >-
  Phagosome maturation turns the nascent phagosome, which has no microbicidal
  or degradative activity, into a phagolysosome. It does so through an ordered
  series of fusion and fission events with endocytic and lysosomal
  compartments. The sealed phagosome first recruits active Rab5, and the class
  III PI3K VPS34 makes PI(3)P on its membrane. PIKfyve converts part of this
  PI(3)P to PI(3,5)P2. The Mon1-Ccz1 complex, a Rab5 effector and Rab7 GEF,
  then hands the vacuole over to Rab7. Rab7 and the HOPS tethering complex drive
  fusion with late endosomes and lysosomes, and the V-ATPase delivered by these
  fusions acidifies the lumen. This core machinery is shared by eukaryotes and
  works the same way in amoebae that eat bacteria, in nematode and fly cells
  that clear apoptotic corpses, and in mammalian macrophages. Animals add
  lineage-specific parts: the Rab7 effector RILP and LAMP membrane proteins.
  In vertebrate professional phagocytes, the NOX2 NADPH oxidase also assembles
  on the phagosomal membrane and produces superoxide into the lumen.
status: DRAFT
scope: ABSTRACT
