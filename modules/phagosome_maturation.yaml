  connections:
    - source: early_phagosome_stage
      target: rab5_to_rab7_conversion
      connection_type: PRECEDES
      description: GTP-Rab5 on the early phagosome recruits the Mon1-Ccz1 complex, and VPS34-made PI(3)P is the substrate for PIKfyve.
    - source: rab5_to_rab7_conversion
      target: phagosome_lysosome_fusion
      connection_type: PRECEDES
      description: >-
        Rab7 activation by Mon1-Ccz1 and PIKfyve-dependent Rab7 acquisition are
        needed for fusion with late endosomes and lysosomes.
    - source: phagosome_lysosome_fusion
      target: phagosome_acidification
      connection_type: PRECEDES
      description: >-
        Most V-ATPase reaches the phagosome by fusion with late endocytic
        compartments, so full acidification depends on the fusion step. An
        earlier, smaller drop in pH is less well understood.
knowledge_gaps:
  - gap_statement: >-
      The molecular activity by which LAMP-1/LAMP-2 enable Rab7 recruitment and
      phagosome-lysosome fusion is unknown.
    boundary: >-
      Phagosomes lacking both LAMPs reach the Rab5/PI(3)P stage but do not
      recruit Rab7 or fuse with lysosomes. The defect is attributed to impaired
      organelle motility along microtubules.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      LAMPs are needed for this step but cannot be given a molecular function,
      so the LAMP annoton has no function.
    resolution: >-
      Find the LAMP-dependent effector (for example a motor adaptor or a lipid
      or cholesterol transfer activity) that is missing from LAMP-null
      phagosomes.
    provenance:
      - reference_id: PMID:17245426
        supporting_text: We attribute the deficiency to impaired organellar motility along microtubules.
  - gap_statement: >-
      The mechanism and molecular basis of early phagosome acidification, before
      V-ATPase is delivered by fusion, are not well understood.
    boundary: >-
      Most phagosomal acidification is done by V-ATPases delivered at later
      maturation stages.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      The acidification part covers only the V-ATPase component. An earlier
      contributor, if one exists, is not modelled.
    resolution: Measure phagosomal pH in the first minutes after sealing while V-ATPase is inhibited, and identify the transporters responsible.
    provenance:
      - reference_id: PMID:18813294
        supporting_text: an `early' acidification step that results in a relatively small drop in pH and is not well understood
  - gap_statement: >-
      Which PI(3,5)P2 effector links PIKfyve activity to the fusion that
      delivers Rab7 and V-ATPase to the phagosome is unknown.
    boundary: >-
      PIKfyve loss leaves Rab5 dynamics intact but blocks fusion with Rab7- and
      V-ATPase-positive endosomes in Dictyostelium.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      The PIKfyve annoton has a defined activity, but the step it controls
      cannot yet be tied to a downstream effector in the fusion part.
    resolution: >-
      Screen Dictyostelium PI(3,5)P2-binding proteins for loss-of-function
      mutants that copy the PIKfyve-null failure to acquire Rab7 and V-ATPase.
    provenance:
      - reference_id: PMID:41852341
        supporting_text: Disruption of PIKfyve results in severe defects in phagosomal maturation but the underlying mechanism remains unclear.
