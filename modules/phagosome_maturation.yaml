    title: A pathway for phagosome maturation during engulfment of apoptotic cells.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        Europe PMC-verified; full text cached (Kinchen et al. 2008). C. elegans
