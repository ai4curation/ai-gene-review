knowledge_gaps:
  - gap_statement: >-
      The molecular activity by which LAMP-1/LAMP-2 enable Rab7 recruitment and
      phagosome-lysosome fusion is unknown.
    boundary: >-
      Phagosomes lacking both LAMPs reach the Rab5/PI(3)P stage but do not
      recruit Rab7 or fuse with lysosomes. The defect is attributed to impaired
      organelle motility along microtubules.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      LAMPs are needed for this step but cannot be given a molecular function,
      so the LAMP annoton has no function.
    resolution: >-
      Find the LAMP-dependent effector (for example a motor adaptor or a lipid
      or cholesterol transfer activity) that is missing from LAMP-null
      phagosomes.
    provenance:
      - reference_id: PMID:17245426
        supporting_text: We attribute the deficiency to impaired organellar motility along microtubules.
  - gap_statement: >-
      The mechanism and molecular basis of early phagosome acidification, before
      V-ATPase is delivered by fusion, are not well understood.
    boundary: >-
      Most phagosomal acidification is done by V-ATPases delivered at later
      maturation stages.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      The acidification part covers only the V-ATPase component. An earlier
      contributor, if one exists, is not modelled.
    resolution: Measure phagosomal pH in the first minutes after sealing while V-ATPase is inhibited, and identify the transporters responsible.
    provenance:
      - reference_id: PMID:18813294
        supporting_text: an `early' acidification step that results in a relatively small drop in pH and is not well understood
