          the class III PI3K VPS34, which makes a short-lived PI(3)P pool on the
          phagosomal membrane. Dynamin is also enriched on nascent phagosomes:
          in C. elegans DYN-1 sets how quickly PI(3)P and RAB-7 appear, and in
          Dictyostelium dynamin A is needed for normal acidification.
