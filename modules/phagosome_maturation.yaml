  - id: PMID:20052281
    title: Retrieval of the vacuolar H-ATPase from phagosomes revealed by live cell imaging.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Europe PMC-verified; full text cached (Clarke et al. 2010). VatM-GFP
        imaging of V-ATPase delivery to and retrieval from Dictyostelium
        phagosomes.
  - id: PMID:21606208
    title: Actin polymerization driven by WASH causes V-ATPase retrieval and vesicle neutralization before exocytosis.
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: >-
        Europe PMC-verified; full text cached (Carnell et al. 2011). WASH
        retrieves V-ATPase from Dictyostelium phagosomes before exocytosis.
        Cited only to mark the module boundary; this step belongs to
        phagosome resolution and is not modelled here.
evidence:
  - source_id: GO:0090382
    title: phagosome maturation
    statement: >-
      The module is grounded in the GO process for phagosome maturation. Its
      fusion and acidification parts are grounded in the child processes
      phagosome-lysosome fusion (GO:0090385) and phagosome acidification
      (GO:0090383).
  - source_id: PMID:22560866
    title: How nascent phagosomes mature to become phagolysosomes.
    statement: Maturation is an ordered series of fusions that ends in a degradative phagolysosome.
    supporting_text: Maturation entails orderly sequential fusion of the phagosomal vacuole with specialized endocytic and secretory compartments.
  - source_id: PMID:18351800
    title: Phagocytic receptor CED-1 initiates a signaling pathway for degrading engulfed apoptotic cells.
    statement: >-
      Time-lapse imaging in C. elegans gives the order of events on the phagosome
      that the parts of this module follow.
    supporting_text: sequential enrichment on phagocytic membranes of phagocytic receptor cell death abnormal 1
  - source_id: PMID:30730983
    title: PIKfyve/Fab1 is required for efficient V-ATPase and hydrolase delivery to phagosomes, phagosomal killing, and restriction of Legionella infection.
    statement: >-
      Dictyostelium is used as a model phagocyte for phagosome maturation, so
      the module applies to amoebae as well as animals.
    supporting_text: >-
      Here, we analyse the role of the phosphoinositide (PI) 5-kinase PIKfyve in
      phagosome maturation and killing, using the amoeba and model phagocyte
      Dictyostelium discoideum.
  - source_id: file:modules/phagocytic_engulfment.yaml
    title: "Module: Phagocytic engulfment"
    statement: Sibling module. It supplies the sealed nascent phagosome that this module matures.
notes: >-
  Boundary: this module starts with the sealed nascent phagosome and ends with a
  degradative phagolysosome. Excluded: particle recognition and engulfment
  (MODULE:phagocytic_engulfment); hydrolases and cargo export
  (MODULE:phagolysosomal_cargo_degradation); MHC class II antigen processing on
  phagosomes; LC3-associated phagocytosis; pathogen subversion of maturation;
  and phagosome resolution. Resolution includes the WASH-driven retrieval of
  V-ATPase and reneutralisation before exocytosis in Dictyostelium
  (PMID:21606208), and the vacuolin and LvsB steps of the amoebal
  post-lysosomal stage.


  Taxon scope: the core parts (Rab5, VPS34, dynamin, PIKfyve, Mon1-Ccz1, Rab7,
  HOPS, V-ATPase) are grounded on PANTHER families with members from mammals,
  C. elegans, Drosophila, Dictyostelium and, for orientation, the yeast
  vacuole homologs. Loss-of-function evidence comes from mouse and human cells,
  C. elegans and Dictyostelium. RILP and LAMP-1/LAMP-2 are animal-specific
  annotons and NOX2 is an optional vertebrate part.


  Family grounding follows PANTHER's own classification files. Where it
  differs from the UniProt PANTHER cross-reference the difference is noted on
  the family. RAB5 was previously left as a human gene product because its
  UniProt cross-reference (PTHR47978) has no PANTHER name; PANTHER's
  classification puts the Rab5 orthologs in PTHR24073.
