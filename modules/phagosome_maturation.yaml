      correctness: VERIFIED
      review_notes: >-
        PubMed-verified review (Kinchen & Ravichandran 2008); full text cached.
        Source for V-ATPase delivery and for HOPS acting downstream of RAB-7
        recruitment in C. elegans.
  - id: PMID:11581283
    title: Distinct roles of class I and class III phosphatidylinositol 3-kinases in phagosome formation and maturation.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached. VPS34 makes PI(3)P on the sealed
        phagosome and is required for phagolysosome formation.
  - id: PMID:20305638
    title: Identification of two evolutionarily conserved genes regulating processing of engulfed apoptotic cells.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached. SAND-1/Mon1 and CCZ-1 are needed for
        the RAB-5 to RAB-7 transition on apoptotic-cell phagosomes in worms and
        mammals.
  - id: PMID:18351800
    title: Phagocytic receptor CED-1 initiates a signaling pathway for degrading engulfed apoptotic cells.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached. Gives the order CED-1, DYN-1, PI(3)P,
        RAB-7 on C. elegans phagosomes, and shows that RAB-7 is needed for
        lysosome recruitment and fusion.
  - id: PMID:12944476
    title: "Phagosomes fuse with late endosomes and/or lysosomes by extension of membrane protrusions along microtubules: role of Rab7 and RILP."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified; Rab7 and its effector RILP are needed for phagosome fusion with late endosomes and lysosomes.
  - id: PMID:17245426
    title: LAMP proteins are required for fusion of lysosomes with phagosomes.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified. LAMP-1/LAMP-2 double deficiency stops maturation after
        the Rab5/PI(3)P stage. The molecular basis is attributed to impaired
        motility rather than to a defined activity.
  - id: PMID:7719350
    title: Mouse model of X-linked chronic granulomatous disease, an inherited defect in phagocyte superoxide production.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified. gp91phox (CYBB/NOX2) null mice lack phagocyte superoxide
        production and are more susceptible to infection.
evidence:
  - source_id: GO:0090382
    title: phagosome maturation
    statement: >-
      The module is grounded in the GO process for phagosome maturation. Its
      fusion and acidification parts are grounded in the child processes
      phagosome-lysosome fusion (GO:0090385) and phagosome acidification
      (GO:0090383).
  - source_id: PMID:22560866
    title: How nascent phagosomes mature to become phagolysosomes.
    statement: Maturation is an ordered series of fusions that ends in a degradative phagolysosome.
    supporting_text: Maturation entails orderly sequential fusion of the phagosomal vacuole with specialized endocytic and secretory compartments.
  - source_id: PMID:18351800
    title: Phagocytic receptor CED-1 initiates a signaling pathway for degrading engulfed apoptotic cells.
    statement: >-
      Time-lapse imaging in C. elegans gives the order of events on the phagosome
      that the parts of this module follow.
    supporting_text: sequential enrichment on phagocytic membranes of phagocytic receptor cell death abnormal 1
  - source_id: file:modules/phagocytic_engulfment.yaml
    title: "Module: Phagocytic engulfment"
    statement: Sibling module. It supplies the sealed nascent phagosome that this module matures.
notes: >-
  Boundary: this module starts with the sealed nascent phagosome and ends with a
  degradative phagolysosome. Excluded: particle recognition and engulfment
  (MODULE:phagocytic_engulfment); lysosomal hydrolases and their cargo
  (separate lysosomal degradation modules); MHC class II antigen processing on
  phagosomes; LC3-associated phagocytosis; pathogen subversion of maturation;
  and phagosome resolution and membrane recycling.

  The NOX2 oxidative-burst part is optional. It is restricted to professional
  phagocytes and is not needed for maturation itself. It is included because
  its activity is a defining phagosomal output in neutrophils and macrophages.

  RAB5 is grounded with a human gene product and no PANTHER family, because the
  UniProt PANTHER cross-reference for RAB5A (PTHR47978) has no family name in
  the local PANTHER release.
