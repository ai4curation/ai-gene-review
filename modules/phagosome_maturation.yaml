    title: Distinct roles of class I and class III phosphatidylinositol 3-kinases in phagosome formation and maturation.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached. VPS34 makes PI(3)P on the sealed
        phagosome and is required for phagolysosome formation.
  - id: PMID:20305638
    title: Identification of two evolutionarily conserved genes regulating processing of engulfed apoptotic cells.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached. SAND-1/Mon1 and CCZ-1 are needed for
        the RAB-5 to RAB-7 transition on apoptotic-cell phagosomes in worms and
        mammals.
  - id: PMID:18351800
    title: Phagocytic receptor CED-1 initiates a signaling pathway for degrading engulfed apoptotic cells.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified; full text cached. Gives the order CED-1, DYN-1, PI(3)P,
        RAB-7 on C. elegans phagosomes, and shows that RAB-7 is needed for
        lysosome recruitment and fusion.
  - id: PMID:12944476
    title: "Phagosomes fuse with late endosomes and/or lysosomes by extension of membrane protrusions along microtubules: role of Rab7 and RILP."
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: PubMed-verified; Rab7 and its effector RILP are needed for phagosome fusion with late endosomes and lysosomes.
  - id: PMID:17245426
    title: LAMP proteins are required for fusion of lysosomes with phagosomes.
    reference_review:
      relevance: HIGH
      correctness: VERIFIED
      review_notes: >-
        PubMed-verified. LAMP-1/LAMP-2 double deficiency in mouse cells stops
        maturation after the Rab5/PI(3)P stage. The molecular basis is
        attributed to impaired motility rather than to a defined activity.
  - id: PMID:7719350
    title: Mouse model of X-linked chronic granulomatous disease, an inherited defect in phagocyte superoxide production.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
