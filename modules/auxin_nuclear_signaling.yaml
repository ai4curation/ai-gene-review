id: MODULE:auxin_nuclear_signaling
title: Canonical nuclear auxin signaling in land plants
description: Canonical nuclear auxin signaling couples TIR1/AFB–Aux/IAA co-receptor assembly to regulated
  transcription by ARF proteins. Auxin enhances receptor–degron association, enabling SCF-dependent Aux/IAA
  turnover and reducing corepression of class-A ARFs. This circuit is represented by native Arabidopsis
  and Marchantia implementations within land plants; older algal ARF DNA-binding systems alone do not
  establish the complete circuit. Arabidopsis TIR1 also produces cAMP, and separation-of-function experiments
  show that substrate degradation alone does not guarantee transcriptional activation. The downstream
  cAMP effector remains unidentified, and MpTIR1 AC activity is untested. Marchantia class-B MpARF2 provides
  an additional active TOPLESS-recruiting repression and DNA-competition branch. Paralog combinations,
  expression domains and promoter/chromatin contexts determine output; neither all ARFs nor all Aux/IAAs
  share one regulatory behavior. Auxin synthesis/transport, rapid cytoplasmic or cell-surface pathways,
  noncanonical receptor routes and the downstream developmental programs are outside this boundary.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:42590969
  statement: The canonical nuclear circuit must be distinguished from older ARF DNA-regulatory capacity.
  supporting_text: algal ARFs are not connected to a canonical auxin response pathway
- source_id: PMID:36529527
  statement: Native MpTIR1 binds the MpIAA DII-containing fragment auxin-dependently; DII mutation prevents
    recruitment.
  supporting_text: The MpTIR1-3xFLAG proteins showed interactions with MpIAA only when auxin was added
    to the mixture
- source_id: PMID:40044868
  statement: Matched ccvTIR1 ACm1/ACm3 lines retain degradation of full-length IAA6/IAA7/IAA8/IAA17 reporters.
  supporting_text: comparable cvxIAA-induced degradation of all these Aux/IAAs in pTIR1::ccvTIR1, pTIR1::ccvTIR1ACm1
    and pTIR1::ccvTIR1ACm3
- source_id: PMID:40044868
  statement: The same catalytic mutants reduce or eliminate DR5 transcriptional reporter activation, separating
    turnover from sufficient transcriptional output.
  supporting_text: cvxIAA-induced DR5::Luc activation was strongly reduced in pTIR1::ccvTIR1ACm1 and completely
    lost in the pTIR1::ccvTIR1ACm3 line
references:
- id: PMID:42590969
  title: 'AUXIN RESPONSE FACTORs: from transcription factors to auxin effectors.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full 2026 review inspected. Comparative synthesis distinguishes ancient ARF DNA effectors
      from later canonical nuclear auxin signaling; it does not experimentally prove every inferred ancestral
      state.
  findings:
  - statement: Algal ARFs do not establish a canonical nuclear auxin circuit.
    supporting_text: algal ARFs are not connected to a canonical auxin response pathway
  - statement: Class-A activation emerged within a diversified ARF framework.
    supporting_text: giving rise to the A‐ and B‐class lineages
- id: PMID:42492494
  title: Auxin signaling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 2026 Cell review available as abstract only. The abstract explicitly separates the coherent
      nuclear pathway framework from recent rapid-response mechanisms; detailed mechanisms are grounded
      in primaries, not uninspected review text.
  findings:
  - statement: Rapid responses include mechanisms outside this nuclear module.
    supporting_text: This involves widespread protein phosphorylation, new roles for NAP components
- id: PMID:40265222
  title: Unresolved roles of Aux/IAA proteins in auxin responses.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full 2025 review inspected. Distinguishes canonical degron-containing Aux/IAAs from
      noncanonical stable proteins and poses cAMP questions. Its unresolved degradation question must
      be read alongside later/direct separation experiments in PMID40044868.
  findings:
  - statement: AC is enhanced by assembly of the co-receptor.
    supporting_text: The AC activity is stimulated in vitro by the TIR1/AFBs–Aux/IAA co‐receptor assembly
      mediated by auxin
  - statement: Noncanonical Aux/IAAs remain involved in signaling despite distinct degradation behavior.
    supporting_text: making them stable even in the presence of auxin
- id: PMID:41249070
  title: 'Role of cAMP in TIR1/AFB auxin signaling: open issues.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The cache metadata labels this PRIMARY_RESEARCH, but the publication identifies itself
      as a Forum article; treated here as interpretive synthesis, not a new experiment. Full published
      text was normally fetched from ISTA and assessed separately.
  findings:
  - statement: The article frames unresolved mechanisms following discovery of receptor-produced cAMP.
    supporting_text: leaving many open questions and gaps in our understanding
- id: file:publications/url_https___research-explorer.ista.ac.at_download_20725_22413_2026_TrendsPlantScience_Friml.pdf.md
  title: 'Role of cAMP in TIR1/AFB auxin signaling: open issues'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full published Forum PDF of PMID41249070 inspected. Distinguishes preserved Aux/IAA
      degradation from compromised transcription, proposes possible cAMP targets, and discusses low purified
      rates. Speculative direct cAMP action on ARFs is not promoted to an established interaction.
  findings:
  - statement: The downstream cAMP mechanism is an explicit open problem.
    supporting_text: function and downstream targets of TIR1/AFB-produced cAMP
  - statement: Purified low activity cannot be assumed to determine native flux.
    supporting_text: Whether this reﬂects similarly low activ- ity and a modest auxin effect in vivo re-
      mains unclear.
- id: PMID:17410169
  title: Mechanism of auxin perception by the TIR1 ubiquitin ligase.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary TIR1 structural abstract directly supports ligand/substrate molecular glue and
      InsP6. It is not a structure of AFB2 or MpTIR1.
  findings:
  - statement: TIR1 has an integral structural cofactor.
    supporting_text: the leucine-rich repeat domain of TIR1 contains an unexpected inositol hexakisphosphate
      co-factor
- id: PMID:22466420
  title: A combinatorial TIR1/AFB-Aux/IAA co-receptor system for differential sensing of auxin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary co-receptor study inspected. Pair-specific interaction assays include AFB2,
      whereas TIR1/IAA7 ligand-binding constants must not be generalized to every pair.
  findings:
  - statement: Both receptor and Aux/IAA determine high-affinity co-receptor behavior.
    supporting_text: TIR1 and the Aux/IAA are both necessary and sufficient for auxin binding and act
      as auxin co-receptors
- id: PMID:11713520
  title: Auxin regulates SCF(TIR1)-dependent degradation of AUX/IAA proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract directly establishes auxin-stimulated SCF(TIR1) interaction with IAA7/IAA17
      and turnover. It supports the degradation branch, not sufficiency of degradation for every transcriptional
      response.
  findings:
  - statement: Auxin stimulates substrate recruitment and degradation.
    supporting_text: auxin stimulates binding of SCF(TIR1) to the AUX/IAA proteins, and their degradation
- id: PMID:15992545
  title: Plant development is regulated by a family of auxin receptor F box proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary abstract reports AFB1/2/3 auxin-dependent interaction and BDL stabilization
      in receptor mutant combinations; redundancy does not make each paralog universally essential.
  findings:
  - statement: Family receptors target BDL in the tested contexts.
    supporting_text: all TIR1/AFB proteins interact with BDL, and BDL is stabilized in triple mutant plants
- id: PMID:20018756
  title: Complex regulation of the TIR1/AFB family of auxin receptors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full native study inspected during receptor review; TIR1/AFB2 dominate seedling-root
      responses but differ in regulation and substrate behavior.
  findings:
  - statement: Native seedling-root receptor contributions are directly demonstrated.
    supporting_text: TIR1 and AFB2 are the dominant auxin receptors in the seedling root
- id: PMID:18258861
  title: TOPLESS mediates auxin-dependent transcriptional repression during Arabidopsis embryogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Accessible primary abstract directly identifies IAA12–TPL physical interaction and requirement
      for BDL repression. This supports a specific embryonic example, not universal stoichiometry of every
      Aux/IAA/TPL/ARF complex.
  findings:
  - statement: IAA12 recruits TOPLESS in a demonstrated auxin-repression context.
    supporting_text: We show that TOPLESS (TPL) can physically interact with IAA12/BODENLOS (IAA12/BDL)
- id: PMID:14742873
  title: Aux/IAA proteins contain a potent transcriptional repression domain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full article includes engineered repression-domain assays, notably IAA17. Transferable
      domain activity is distinguished from native pairwise recruitment of every protein.
  findings:
  - statement: Aux/IAA domain I is an active repression domain.
    supporting_text: domain I in Aux/IAA proteins is an active repression domain that is transferable
      and dominant over activation domains
- id: PMID:24706860
  title: Molecular basis for AUXIN RESPONSE FACTOR protein interaction and the control of auxin response
    repression.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Accessible full extraction and abstract report ARF7 PB1 interface mutants and IAA17
      interaction; the exact tested pair is retained.
  findings:
  - statement: PB1-interface mutation prevents ARF7–IAA17 association.
    supporting_text: Mutation of interface residues in the ARF7 PB1 domain yields monomeric protein and
      abolishes interaction with both itself and IAA17
- id: PMID:34075876
  title: Repression by the Arabidopsis TOPLESS corepressor requires association with the core mediator
    complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary study uses synthetic yeast and plant tests to establish TPL–Mediator repression;
      no universal TPL catalytic activity or obligatory HDAC complement is inferred.
  findings:
  - statement: Mediator contacts contribute to repression in both tested systems.
    supporting_text: Interactions between TPL and Mediator were required to fully repress transcription
      in both yeast and plants
- id: PMID:19369397
  title: DORNROSCHEN is a direct target of the auxin response factor MONOPTEROS in the Arabidopsis embryo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ARF5 native DRN promoter occupancy and target expression; accessible abstract.
  findings:
  - statement: ARF5 native DRN promoter occupancy and target expression; accessible abstract.
    supporting_text: MP binds in vivo to two AuxRE-spanning fragments in the DRN promoter
- id: PMID:15923351
  title: AUXIN RESPONSE FACTOR7 restores the expression of auxin-responsive genes in mutant Arabidopsis
    leaf mesophyll protoplasts.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ARF7 protoplast complementation demonstrates activation in the tested cells.
  findings:
  - statement: ARF7 protoplast complementation demonstrates activation in the tested cells.
    supporting_text: Expression of the reporter and natural genes was restored in an auxin-dependent manner
- id: PMID:15960621
  title: NPH4/ARF7 and ARF19 promote leaf expansion and auxin-induced lateral root formation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: ARF19 activation is directly tested; class-A inference is not assigned to class-B/C
      ARFs.
  findings:
  - statement: ARF19 activation is directly tested; class-A inference is not assigned to class-B/C ARFs.
    supporting_text: We show that ARF19, the fifth Q-rich ARF, also activates transcription
- id: PMID:17259263
  title: ARF7 and ARF19 regulate lateral root formation via direct activation of LBD/ASL genes in Arabidopsis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native roots and direct-target evidence support ARF7/ARF19 LBD regulation.
  findings:
  - statement: Native roots and direct-target evidence support ARF7/ARF19 LBD regulation.
    supporting_text: ARF7 and ARF19 directly regulate the auxin-mediated transcription
- id: PMID:14729917
  title: MASSUGU2 encodes Aux/IAA19, an auxin-regulated protein that functions together with the transcriptional
    activator NPH4/ARF7 to regulate differential growth responses of hypocotyl and formation of lateral
    roots in Arabidopsis thaliana.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary source directly supports ARF7–IAA19 interaction and quantified feedback;
      neither every Aux/IAA nor every species inherits this quantitative relationship.
  findings:
  - statement: Full primary source directly supports ARF7–IAA19 interaction and quantified feedback; neither
      every Aux/IAA nor every species inherits this quantitative relationship.
    supporting_text: auxin inducibility of MSG2/IAA19 gene expression is reduced by 65% in nph4/arf7
- id: PMID:36289340
  title: Adenylate cyclase activity of TIR1/AFB auxin receptors in plants.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only PubMed cache; complete author manuscript independently inspected. TIR1,
      AFB1/AFB5 and moss proteins were assayed, while failed AFB2 expression and untested MpTIR1 prevent
      automatic target activity transfer.
  findings:
  - statement: Direct TIR1 AC evidence is documented in the institutional full text.
- id: file:publications/url_https___pure.coventry.ac.uk_ws_portalfiles_portal_60931587_Post_Print.pdf.md
  title: Adenylate cyclase activity of TIR1/AFB auxin receptors in plants
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full author-accepted manuscript of PMID36289340. TIR1 full-length Sf9 and truncated
      bacterial assays, motif controls and Aux/IAA stimulation support genuine catalytic activity; metal
      preference/rates remain construct-specific.
  findings:
  - statement: Purified full-length TIR1 catalyzes cAMP production.
    supporting_text: Vmax = 7.462 fmol/min/µg and KM = 0.644 mM for TIR1
- id: PMID:40044868
  title: TIR1-produced cAMP as a second messenger in transcriptional auxin signalling.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article inspected. ACm1/ACm3 preserve ASK1 binding and Aux/IAA degradation
      but impair transcription. Local unrelated-AC fusion bypass is engineered sufficiency, not a natural
      direct cAMP–ARF binding result.
  findings:
  - statement: Matched TIR1 AC mutants retain full-length IAA turnover.
    supporting_text: comparable cvxIAA-induced degradation of all these Aux/IAAs in pTIR1::ccvTIR1, pTIR1::ccvTIR1ACm1
      and pTIR1::ccvTIR1ACm3
  - statement: The same mutant constructs impair DR5 transcriptional activation.
    supporting_text: cvxIAA-induced DR5::Luc activation was strongly reduced in pTIR1::ccvTIR1ACm1 and
      completely lost in the pTIR1::ccvTIR1ACm3 line
- id: PMID:36529527
  title: Auxin signaling is essential for organogenesis but not for cell survival in the liverwort Marchantia
    polymorpha.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full native Marchantia study maps the exact receptor locus, directly tests MpTIR1–MpIAA
      recruitment and conditional DII turnover, and distinguishes organogenesis from cell survival. Native
      full SCF reconstitution and receptor AC activity are not demonstrated.
  findings:
  - statement: Native receptor recruitment depends on auxin.
    supporting_text: The MpTIR1-3xFLAG proteins showed interactions with MpIAA only when auxin was added
      to the mixture
  - statement: Marchantia AC remains untested.
    supporting_text: It would be interesting to examine whether MpTIR1 has adenylate cyclase activity
- id: PMID:26020649
  title: A Simple Auxin Transcriptional Response System Regulates Multiple Morphogenetic Processes in
    the Liverwort Marchantia polymorpha.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full native/engineered Marchantia study; maps publication-linked KP877967–970 clones.
      Forced MpTPL-domain fusions establish imposed repression, not native MpIAA–MpTPL binary recruitment.
      Read with correction PMID26901620.
  findings:
  - statement: Native knockdown supports MpIAA repression.
    supporting_text: knock-down MpIAA lines were auxin hypersensitive
- id: PMID:26901620
  title: 'Correction: A Simple Auxin Transcriptional Response System Regulates Multiple Morphogenetic
    Processes in the Liverwort Marchantia polymorpha.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Published correction to PMID26020649 addresses flipped/reused control photographs, a
      mislabeled knockdown panel and vector/method details. Corrected controls and independent native
      studies are used; sequence mappings and all molecular claims are not discarded wholesale.
  findings:
  - statement: The correction explicitly identifies a mislabeled figure panel.
    supporting_text: Fig 2B was mislabeled
- id: PMID:26020919
  title: Auxin-Mediated Transcriptional System with a Minimal Set of Components Is Critical for Morphogenesis
    through the Life Cycle in Marchantia polymorpha.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full independent native Marchantia study uses an 825-aa same-locus MpIAA construct,
      distinct from the selected 828-aa KP877968 clone. Repression/GR perturbations and heterologous interaction/transactivation
      assays are kept distinct.
  findings:
  - statement: Stabilized MpIAA can suppress native reporter induction.
    supporting_text: plants completely repressed auxin-dependent expression of the GUS reporter gene
- id: PMID:32415296
  title: Design principles of a minimal auxin response system.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: PubMed abstract plus normally fetched complete institutional paper inspected. Native
      MpARF1/2 genetics, DNA competition and LFG-dependent MpTPL recruitment are distinguished from Arabidopsis-protoplast
      interaction, tobacco peptide assays and engineered chimeras.
  findings:
  - statement: Native class-A and class-B roles differ.
- id: file:publications/url_https___edepot.wur.nl_523089.md
  title: https://edepot.wur.nl/523089
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Complete published PMID32415296 from the WUR institutional repository. Full MpARF2–MpTPL
      FRET–FLIM is in Arabidopsis protoplasts, short-peptide repression in tobacco, and induced target
      repression/conditional-loss physiology in Marchantia. Historical sequence and domain-construct identifiers
      are preserved in gene notes.
  findings:
  - statement: Full MpARF2 recruits MpTPL for active repression.
    supporting_text: while MpARF1 activates transcription, MpARF2 and MpARF3 recruit MpTPL to repress
      transcription
- id: PMID:40168121
  title: A conserved ARF-DNA interface underlies auxin-triggered transcriptional response.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary native Marchantia mutant transcriptomics and protein–DNA interface work.
      MpARF2 B3 transplanted into MpARF1 tests a chimera; it does not establish native MpARF2 activation.
      Cell/bulk-tissue context limits any universal claim.
  findings:
  - statement: DNA-interface competence is separable from native whole-protein regulatory sign.
notes: Exact gene-product selectors constrain functional claims; verified PANTHER subfamilies record classification
  without transferring activity to all members. Each native implementation requires receptor/adaptor,
  corepressor machinery and activator-ARF roles; the characterized TIR1 arm additionally requires its
  AC atom. AFB2 and Marchantia AC dependence remains unresolved, so their structural coverage is not a
  claim of AC-independent sufficiency. Feedback and MpARF2 modulation are optional contexts and cannot
  satisfy the circuit alone. No degradation-to-activation CAUSES edge is asserted. Generic SCF core, E1/E2,
  ubiquitin, proteasome, transcription machinery and ligand/cofactor supply are required boundary assumptions.
  MpTPL participation in canonical MpIAA repression includes conserved inference; engineered fusions and
  added-NLS promoter reporters are not native interaction/localization proofs. Current provider runs failed
  authentication/quota; manual primary-source research is documented. No bounded-index GO-CAM match was
  found for the 14 selected accessions. PR5076 overlaps earlier broad family additions; exact-member classification
  avoids its implied broad functional transfer.
knowledge_gaps:
- gap_statement: The native molecular target that senses TIR1-produced cAMP and changes transcriptional
    competence remains unidentified.
  boundary: Purified TIR1 catalysis and Arabidopsis separation-of-function/local-AC experiments support
    a causal cAMP contribution while preserving Aux/IAA turnover.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Distinguishes direct action on ARF/Aux-IAA proteins from an intervening effector without
    inventing either mechanism.
  resolution: Identify direct cAMP-binding targets and test mutations that alter cAMP response while preserving
    core receptor/ARF functions.
  provenance:
  - reference_id: file:publications/url_https___research-explorer.ista.ac.at_download_20725_22413_2026_TrendsPlantScience_Friml.pdf.md
    supporting_text: function and downstream targets of TIR1/AFB-produced cAMP
- gap_statement: Whether native MpTIR1 catalyzes cAMP production and whether that activity participates
    in Marchantia transcriptional auxin responses is unresolved.
  boundary: Native MpTIR1-dependent MpIAA recruitment, turnover and organogenesis are established; Arabidopsis
    and moss enzymology does not constitute a direct Marchantia measurement.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Measure purified MpTIR1 activity with appropriate controls and test catalytic separation-of-function
    variants in the native plant.
  provenance:
  - reference_id: PMID:36529527
    supporting_text: It would be interesting to examine whether MpTIR1 has adenylate cyclase activity
- gap_statement: Whether AFB2 itself catalyzes cAMP production and how that capacity contributes to native
    transcriptional signaling remains unresolved.
  boundary: Native auxin-dependent Aux/IAA interactions and receptor signaling are established. The 2022
    bacterial AC screen could not assess AFB2 because protein was not detectably expressed.
  gap_kind:
  - BIOLOGY
  status: OPEN
  resolution: Assay properly folded purified AFB2 and test catalytic separation-of-function mutants in
    its native signaling context.
  provenance:
  - reference_id: file:publications/url_https___pure.coventry.ac.uk_ws_portalfiles_portal_60931587_Post_Print.pdf.md
    supporting_text: Due to lack of detectable protein, the AC activity of the other 4 TIR1/AFBs could
      not be assessed.
