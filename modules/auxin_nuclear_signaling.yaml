id: MODULE:auxin_nuclear_signaling
title: Nuclear auxin signaling (TIR1/AFB-Aux/IAA-TOPLESS-ARF module)
description: >
  Nuclear auxin signaling converts intracellular auxin (indole-3-acetic acid, IAA) levels into
  changes in gene transcription through a short, derepression-based pathway. At low auxin,
  AUXIN RESPONSE FACTOR (ARF) transcription factors sit on auxin-response elements (AuxREs) in
  target promoters through their B3 DNA-binding domains, but activator ARFs (class A, e.g.
  ARF5/MONOPTEROS, ARF7/NPH4 and ARF19) are kept inactive by Aux/IAA repressors. Aux/IAAs bind
  the ARF C-terminal PB1 domain through their own PB1 domain and recruit the Groucho/Tup1-type
  co-repressor TOPLESS (TPL) and its TPL-related paralogs through an EAR (LxLxL) motif in
  domain I; TPL represses transcription by engaging the Mediator complex and histone
  deacetylases. Auxin is perceived by a co-receptor formed by an LRR F-box protein of the
  TIR1/AFB family and the domain II degron of an Aux/IAA: auxin binds the bottom of the
  TIR1/AFB pocket and acts as molecular glue that stabilizes Aux/IAA binding. Because the
  TIR1/AFB protein is the substrate-recognition subunit of an SCF (ASK1-CUL1-RBX1) E3 ligase,
  co-receptor assembly leads to Aux/IAA polyubiquitination and rapid proteasomal degradation,
  which removes the Aux/IAA-TPL repressor from ARFs and allows ARF-dependent activation of
  early auxin-responsive genes, including Aux/IAA genes themselves (negative feedback).
  Specific responses arise from combinations of co-expressed pairs, such as BODENLOS/IAA12
  with MONOPTEROS/ARF5 in embryonic root initiation, and IAA14/IAA18/IAA19 with ARF7 and
  ARF19 in lateral root formation and tropic growth. Auxin biosynthesis, polar auxin
  transport (a separate module), non-transcriptional auxin responses and the downstream
  developmental programs are outside this module's boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009734
    title: auxin-activated signaling pathway
    statement: The module is grounded in the GO biological process term for auxin-activated signaling.
  - source_id: PMID:17410169
    title: Mechanism of auxin perception by the TIR1 ubiquitin ligase.
    statement: Auxin binds the TIR1 LRR pocket and acts as molecular glue for Aux/IAA degron binding.
    supporting_text: >-
      auxin enhances the TIR1-substrate interactions by acting as a 'molecular glue'
  - source_id: PMID:22466420
    title: A combinatorial TIR1/AFB-Aux/IAA co-receptor system for differential sensing of auxin.
    statement: TIR1/AFB and Aux/IAA proteins together form the auxin co-receptor.
    supporting_text: >-
      TIR1 and the Aux/IAA are both necessary and sufficient for auxin binding and act as auxin
      co-receptors
  - source_id: PMID:15992545
    title: Plant development is regulated by a family of auxin receptor F box proteins.
    statement: AFB1-3 act with TIR1 as auxin receptors; all bind BDL/IAA12.
    supporting_text: >-
      all TIR1/AFB proteins interact with BDL, and BDL is stabilized in triple mutant plants
  - source_id: PMID:11713520
    title: Auxin regulates SCF(TIR1)-dependent degradation of AUX/IAA proteins.
    statement: SCF(TIR1) binds Aux/IAA domain II in an auxin-stimulated manner and is required for
      Aux/IAA degradation.
    supporting_text: >-
      auxin stimulates binding of SCF(TIR1) to the AUX/IAA proteins, and their degradation
  - source_id: PMID:18258861
    title: TOPLESS mediates auxin-dependent transcriptional repression during Arabidopsis
      embryogenesis.
    statement: TPL binds the IAA12/BDL EAR motif and is required for IAA12 repression of ARF5/MP.
    supporting_text: >-
      These observations show that TPL is a transcriptional co-repressor
  - source_id: PMID:14742873
    title: Aux/IAA proteins contain a potent transcriptional repression domain.
    statement: Aux/IAA domain I is a transferable active repression domain; Aux/IAAs repress by
      dimerizing with ARFs on AuxREs.
    supporting_text: >-
      Repression is thought to result from Aux/IAA proteins dimerizing with auxin response factor
      (ARF) transcriptional activators that reside on auxin-responsive promoter elements
  - source_id: PMID:24706860
    title: Molecular basis for AUXIN RESPONSE FACTOR protein interaction and the control of auxin
      response repression.
    statement: ARF7 and IAA17 interact through PB1 domains.
    supporting_text: >-
      Mutation of interface residues in the ARF7 PB1 domain yields monomeric protein and abolishes
      interaction with both itself and IAA17
  - source_id: PMID:21734647
    title: The auxin signalling network translates dynamic input into robust patterning at the
      shoot apex.
    statement: Most Aux/IAAs can interact with all ARF activators.
    supporting_text: >-
      In this network, the vast majority of the Aux/IAAs interact with all the ARF activators,
      suggesting that most Aux/IAAs have the potential to act as repressors of the transcriptional
      activity of ARF activators
  - source_id: PMID:15889151
    title: Developmental specificity of auxin response by pairs of ARF and Aux/IAA transcriptional
      regulators.
    statement: Specific developmental responses depend on co-expressed ARF-Aux/IAA pairs.
    supporting_text: >-
      Our results suggest that auxin signals are converted into specific responses by matching
      pairs of coexpressed ARF and Aux/IAA proteins
  - source_id: PMID:34075876
    title: Repression by the Arabidopsis TOPLESS corepressor requires association with the core
      mediator complex.
    statement: TPL represses through Mediator subunits MED21 and MED10.
    supporting_text: >-
      Interactions between TPL and Mediator were required to fully repress transcription in both
      yeast and plants
notes: >-
  Concrete Arabidopsis instantiation. Members are grounded by exact UniProtKB accessions taken from
  the gene folders (TIR1 Q570C0, AFB2 Q9LW29, IAA12 Q38830, IAA17 P93830, TPL Q94AI7, ARF5 P93024,
  ARF7 P93022, ARF19 Q8RYC8). PANTHER family ids are deliberately omitted from family descriptors
  (representative members ground the roles). Annoton molecular functions match the gene reviews'
  core functions: auxin receptor activity and ubiquitin-like ligase-substrate adaptor activity
  (TIR1, AFB2), transcription corepressor activity (IAA12, IAA17, TPL), ubiquitin protein ligase
  binding for the Aux/IAA degron (IAA12, IAA17) and DNA-binding transcription factor activity for
  activator ARFs (ARF5 core; ARF7/ARF19 core DNA-binding transcription activator activity is a
  subclass). The ASK1/CUL1/RBX1 SCF scaffold, the 26S proteasome, TPL-related paralogs (TPR1-4),
  repressor ARFs (class B), and ARF-independent auxin responses are not modeled. No production
  GO-CAM in gocams/index.tsv contains these gene products. TPL is shared with the jasmonate
  COI1-JAZ module (modules/jasmonate_coi1_jaz_signaling.yaml), where it is recruited by NINJA.
  Automated module deep research was not run for this module.
