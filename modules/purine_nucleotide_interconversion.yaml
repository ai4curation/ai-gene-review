  connections:
    - source: adss_step
      target: adsl_amp_step
      connection_type: PRECEDES
      description: Adenylosuccinate is cleaved to AMP and fumarate.
      chaining_status: NOT_APPLICABLE
      chaining_note: No CoA-carrier intermediate; continuity is via adenylosuccinate.
    - source: adsl_amp_step
      target: adenylate_kinase_step
      connection_type: PROVIDES_INPUT_FOR
      description: AMP is phosphorylated to ADP.
    - source: impdh_step
      target: gmps_step
      connection_type: PRECEDES
      description: XMP from IMP dehydrogenase is aminated to GMP by GMP synthase.
      chaining_status: NOT_APPLICABLE
      chaining_note: No CoA-carrier intermediate; continuity is via XMP.
    - source: gmps_step
      target: guanylate_kinase_step
      connection_type: PROVIDES_INPUT_FOR
      description: GMP is phosphorylated to GDP.
    - source: guanylate_kinase_step
      target: ndp_kinase_step
      connection_type: PROVIDES_INPUT_FOR
      description: GDP is phosphorylated to GTP.
    - source: ndp_kinase_step
      target: adss_step
      connection_type: PROVIDES_INPUT_FOR
      description: GTP is the phosphate donor of adenylosuccinate synthetase (cross-regulation of the two arms).
    - source: ampd_step
      target: adss_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        AMP deaminase regenerates IMP, which adenylosuccinate synthetase re-uses toward AMP
        (the purine nucleotide cycle).
    - source: ampd_step
      target: impdh_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        IMP regenerated by AMP deaminase can also be routed to GMP synthesis via IMP
        dehydrogenase.
  notes: >-
    GENERALIZE from the earlier human-only module. The human enzymes and
    disorders are retained (ADSS1 Q8N142, ADSL P30566, IMPDH1 P20839 / IMPDH2
    P12268, GMPS P49915, AMPD1 P23109 / AMPD2 Q01433 / AMPD3 Q01432; GO
    molecular-function terms from the human GOA records; Reactome reaction ids
    verified against the local reactome cache) and S. cerevisiae exemplars
    added from the YeastPathways crosswalk (PWY-7219, PWY-7221, PWY-6126-1,
    PWY-6125): ADE12, ADE13, IMD2/IMD3/IMD4, GUA1, ADK1, GUK1, YNK1 and AMD1.
    Boundary changes: the adenylosuccinate lyase AMP step (previously only
    mentioned) is now an explicit part, and the adenylate kinase, guanylate
    kinase and NDP kinase steps that complete ADP/GTP formation in the
    YeastCyc frames were added; ATP formation from ADP (oxidative and
    substrate-level phosphorylation) stays outside. The ribonucleotide
    reductase and dNDP kinase reactions of the YeastCyc superpathways are
    modelled in dntp_de_novo_synthesis, and the gene-less formate-dependent
    class III reductase reactions (RXN0-745, RXN0-746) do not occur in yeast.
    YeastCyc corrections: IMD1 (pseudogene, PMID:12746440) is correctly
    absent; ADK2 is listed as an ATP:AMP adenylate kinase in PWY-7219 but is a
    mitochondrial-matrix GTP:AMP phosphotransferase (PMID:15753074), so it is
    not used as an exemplar; AMD1 is placed by YeastCyc only in the salvage
    frames but is the AMP deaminase of this network. GO-CAM disagreement:
    YeastPathways_PWY-7219 and PWY-6126-1 annotate every activity as part_of
    GO:0046086 adenosine biosynthetic process (a nucleoside term) instead of
    AMP/ADP synthesis. No S. pombe GO-CAM is listed for this group; the S.
    pombe orthologs (ada1 AMP deaminase, gua1 IMP dehydrogenase, gua2 GMP
    synthase) appear in the PomBase purine salvage model 680ad14200001682
    (see purine_salvage_and_catabolism). Upstream, IMP comes from
    de_novo_purine_synthesis and from hypoxanthine salvage
    (purine_salvage_and_catabolism); purine_nucleotide_catabolism covers
    degradation of these nucleotides.
