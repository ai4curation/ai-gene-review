id: MODULE:purine_nucleotide_interconversion
title: Purine ribonucleotide interconversion (IMP to AMP/GMP and their di- and triphosphates)
description: >-
  Inosine monophosphate (IMP), the first complete purine nucleotide made by de
  novo synthesis or by salvage, is the branch point from which the adenine and
  guanine ribonucleotides are made. Toward AMP, adenylosuccinate synthetase
  condenses IMP with L-aspartate using GTP to form adenylosuccinate, which
  adenylosuccinate lyase cleaves to AMP and fumarate. Toward GMP, IMP
  dehydrogenase oxidises IMP to xanthosine monophosphate (XMP) with NAD+ (the
  committed, rate-limiting step of guanine-nucleotide synthesis) and GMP
  synthase aminates XMP to GMP using the amide nitrogen of glutamine. The
  monophosphates are then phosphorylated by adenylate kinase (AMP to ADP) and
  guanylate kinase (GMP to GDP), and nucleoside-diphosphate kinase transfers
  the gamma-phosphate of ATP to GDP (and other diphosphates) to make GTP; ADP
  is converted to ATP mainly by energy metabolism. AMP deaminase hydrolytically
  deaminates AMP back to IMP; with adenylosuccinate synthetase and lyase this
  forms the purine nucleotide cycle, which in animal muscle buffers the
  adenylate energy charge and releases fumarate and ammonia. Because GTP is
  required to make AMP and ATP to make GMP, these reactions cross-regulate the
  adenine and guanine nucleotide pools. The enzymes are cytosolic and
  conserved from bacteria to fungi and animals, with lineage-specific
  isozymes (for example, muscle and liver adenylosuccinate synthetases and
  three AMP deaminases in mammals, and three expressed IMP dehydrogenases in
  budding yeast). Inherited defects of the human enzymes include ADSS1 distal
  myopathy, IMPDH1 retinitis pigmentosa, IMPDH2 neurodevelopmental dystonia,
  myoadenylate deaminase (AMPD1) deficiency and AMPD2 pontocerebellar
  hypoplasia; IMP dehydrogenase is the target of mycophenolic acid and
  ribavirin.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY-7219
    title: adenosine ribonucleotides de novo biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      IMP to ADP with ADE12, ADE13 and ADK1/ADK2. ADK2 is the mitochondrial
      GTP:AMP phosphotransferase (PMID:15753074), not the main cytosolic
      ATP:AMP adenylate kinase; it is kept only as a note.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-7219
  - source_id: YeastPathways:PWY-7221
    title: guanosine ribonucleotides de novo biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: IMP to GTP with IMD2/IMD3/IMD4, GUA1, GUK1 and YNK1.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-7221
  - source_id: YeastPathways:PWY-6126-1
    title: superpathway of adenosine nucleotides de novo biosynthesis II (S. cerevisiae, SGD YeastPathways)
    statement: >-
      PWY-7219 plus ADP reduction by ribonucleotide reductase and dADP
      phosphorylation (modelled in dntp_de_novo_synthesis) and a gene-less
      formate-dependent class III reductase reaction not present in yeast.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-6126-1
  - source_id: YeastPathways:PWY-6125
    title: superpathway of guanosine nucleotides de novo biosynthesis II (S. cerevisiae, SGD YeastPathways)
    statement: >-
      PWY-7221 plus GDP reduction and dGDP phosphorylation
      (dntp_de_novo_synthesis) and a gene-less class III reductase reaction.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-6125
  - source_id: GO:0015951
    title: purine ribonucleotide interconversion
    statement: Module-level process term for the IMP/AMP/GMP interconversion network.
  - source_id: GO:0044208
    title: "'de novo' AMP biosynthetic process"
    statement: Process term for the IMP-to-AMP arm.
  - source_id: GO:0106387
    title: "'de novo' GMP biosynthetic process"
    statement: Process term for the IMP-to-GMP arm.
  - source_id: Reactome:R-HSA-73817
    title: Purine ribonucleoside monophosphate biosynthesis
    statement: >-
      Reactions follow the human Reactome purine-metabolism reactions R-HSA-111524
      (ADSS), R-HSA-73794 (IMPDH), R-HSA-73792 (GMPS) and R-HSA-76590 (AMPD).
  - source_id: PMID:10417315
    title: 'Adenylosuccinate synthase from Saccharomyces cerevisiae: homologous overexpression, purification and characterization of the recombinant protein.'
    statement: ADE12 encodes yeast adenylosuccinate synthase, the first committed step of AMP synthesis.
  - source_id: PMID:22419079
    title: Regulation of amino acid, nucleotide, and phosphate metabolism in Saccharomyces cerevisiae.
    statement: >-
      YeastBook review: ADE13 encodes adenylosuccinate lyase, used in both the
      de novo IMP pathway and the AMP branch; regulation of the AMP and GMP
      branches.
  - source_id: PMID:12746440
    title: Functional distinctions between IMP dehydrogenase genes in providing mycophenolate resistance and guanine prototrophy to yeast.
    statement: >-
      IMD1 is a transcriptionally silent pseudogene; IMD2, IMD3 and IMD4 encode
      IMP dehydrogenase, either IMD3 or IMD4 suffices for guanine prototrophy,
      and IMD2 provides inducible, mycophenolate-resistant activity. Deletion of
      all four genes causes guanine auxotrophy.
  - source_id: PMID:11035032
    title: Transcriptional regulation of the yeast gmp synthesis pathway by its end products.
    statement: >-
      Only the IMD (IMP dehydrogenase) genes of the GMP branch are repressed by
      guanine; GUA1 and GUK1 are guanine-insensitive.
  - source_id: PMID:8112582
    title: Cloning and sequencing of the GMP synthetase-encoding gene of Saccharomyces cerevisiae.
    statement: GUA1 encodes GMP synthetase; its disruption causes guanine auxotrophy.
  - source_id: PMID:2690949
    title: Characterization of AMD, the AMP deaminase gene in yeast. Production of amd strain, cloning, nucleotide sequence, and properties of the protein.
    statement: AMD1 encodes yeast AMP deaminase; amd strains grow at near normal rates.
  - source_id: PMID:1334480
    title: Cloning and expression of the essential gene for guanylate kinase from yeast.
    statement: GUK1 encodes guanylate kinase and is essential for vegetative growth.
  - source_id: PMID:11063676
    title: Yeast GMP kinase mutants constitutively express AMP biosynthesis genes by phenocopying a hypoxanthine-guanine phosphoribosyltransferase defect.
    statement: >-
      Low GMP kinase activity in guk1 (bra3) mutants causes GMP accumulation
      and feedback inhibition of HGPRT, linking guanylate kinase to purine
      pool balance.
  - source_id: PMID:1333436
    title: 'The adenylate kinase family in yeast: identification of URA6 as a multicopy suppressor of deficiency in major AMP kinase.'
    statement: >-
      AKY2 (ADK1) encodes the major yeast AMP kinase and is also imported
      into the mitochondrial intermembrane space.
  - source_id: PMID:15753074
    title: A GTP:AMP phosphotransferase, Adk2p, in Saccharomyces cerevisiae. Role of the C terminus in protein folding/stabilization, thermal tolerance, and enzymatic activity.
    statement: ADK2 encodes a mitochondrial-matrix GTP:AMP phosphotransferase.
  - source_id: PMID:1659321
    title: 'Saccharomyces cerevisiae nucleoside-diphosphate kinase: purification, characterization, and substrate specificity.'
    statement: >-
      Yeast NDP kinase is a tetramer with broad specificity for ribo- and
      deoxyribonucleoside diphosphates.
  - source_id: PMID:12472466
    title: 'Nucleoside diphosphate kinase of Saccharomyces cerevisiae, Ynk1p: localization to the mitochondrial intermembrane space.'
    statement: Ynk1p is predominantly cytosolic with a small fraction in the mitochondrial intermembrane space.
  - source_id: file:human/ADSS1/ADSS1-ai-review.yaml
    title: ADSS1 gene review (human)
    statement: >-
      The IMP -> adenylosuccinate step (UniProtKB:Q8N142, GO:0004019) matches the
      completed human ADSS1 review.
  - source_id: file:human/ADSL/ADSL-ai-review.yaml
    title: ADSL gene review (human)
    statement: >-
      The adenylosuccinate -> AMP step (UniProtKB:P30566, GO:0004018) matches the
      completed human ADSL review (also in the de novo purine module).
  - source_id: file:human/IMPDH1/IMPDH1-ai-review.yaml
    title: IMPDH1 gene review (human)
    statement: >-
      The IMP -> XMP step (UniProtKB:P20839, GO:0003938) matches the completed human
      IMPDH1 review.
  - source_id: file:human/IMPDH2/IMPDH2-ai-review.yaml
    title: IMPDH2 gene review (human)
    statement: >-
      The ubiquitous IMP -> XMP isozyme (UniProtKB:P12268, GO:0003938) matches the
      completed human IMPDH2 review.
  - source_id: file:human/GMPS/GMPS-ai-review.yaml
    title: GMPS gene review (human)
    statement: >-
      The XMP -> GMP step (UniProtKB:P49915, GO:0003922) matches the completed human
      GMPS review.
  - source_id: file:human/AMPD1/AMPD1-ai-review.yaml
    title: AMPD1 gene review (human)
    statement: >-
      The AMP -> IMP step (UniProtKB:P23109, GO:0003876) matches the completed human
      AMPD1 review.
  - source_id: file:human/AMPD2/AMPD2-ai-review.yaml
    title: AMPD2 gene review (human)
    statement: >-
      The broad/neuronal AMP -> IMP isozyme (UniProtKB:Q01433, GO:0003876) matches the
      completed human AMPD2 review.
  - source_id: file:human/AMPD3/AMPD3-ai-review.yaml
    title: AMPD3 gene review (human)
    statement: >-
      The erythrocyte AMP -> IMP isozyme (UniProtKB:Q01432, GO:0003876) matches the
      completed human AMPD3 review.
module:
  id: purine_nucleotide_interconversion
  label: Purine ribonucleotide interconversion (IMP to AMP/GMP, ADP/GDP and GTP)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: purine ribonucleotide interconversion
      term:
        id: GO:0015951
        label: purine ribonucleotide interconversion
      description: >-
        Interconversion of IMP with AMP and GMP, regeneration of IMP from AMP
        (purine nucleotide cycle) and phosphorylation to the di- and
        triphosphates.
    - preferred_term: "'de novo' AMP biosynthetic process"
      term:
        id: GO:0044208
        label: "'de novo' AMP biosynthetic process"
      description: IMP to AMP arm (parts 1-2).
    - preferred_term: "'de novo' GMP biosynthetic process"
      term:
        id: GO:0106387
        label: "'de novo' GMP biosynthetic process"
      description: IMP to GMP arm (parts 3-4).
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          The interconversion enzymes are cytosolic; adenylate kinase and
          nucleoside-diphosphate kinase have additional mitochondrial
          intermembrane-space pools in yeast.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY-7219
      title: 'adenosine ribonucleotides <i>de novo</i> biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        ADE12, ADE13 and ADK1/ADK2 in cytosol; every activity is part_of
        GO:0046086 adenosine biosynthetic process, although the pathway makes
        nucleotides, not the nucleoside.
    - model: gomodel:YeastPathways_PWY-7221
      title: 'guanosine ribonucleotides <i>de novo</i> biosynthesis - imported from: Saccharomyces Genome Database'
      description: IMD2/IMD3/IMD4, GUA1, GUK1 and YNK1, part_of GO:0106387.
    - model: gomodel:YeastPathways_PWY-6126-1
      title: 'superpathway of adenosine nucleotides <i>de novo</i> biosynthesis II - imported from: Saccharomyces Genome Database'
      description: Adds RNR and YNK1 dADP steps (dntp_de_novo_synthesis).
    - model: gomodel:YeastPathways_PWY-6125
      title: 'superpathway of guanosine nucleotides <i>de novo</i> biosynthesis II - imported from: Saccharomyces Genome Database'
      description: Adds RNR and YNK1 dGDP steps (dntp_de_novo_synthesis).
  parts:
    - order: 1
      role: IMP -> AMP (committed adenylosuccinate step)
      node:
        id: adss_step
        label: IMP + L-aspartate + GTP to adenylosuccinate + GDP + Pi
        module_type: REACTION
        annotons:
          - id: adss_activity
            label: Adenylosuccinate synthetase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Adenylosuccinate synthetase family (PurA/ADSS)
                term:
                  id: PANTHER:PTHR11846
                  label: ADENYLOSUCCINATE SYNTHETASE
                representative_members:
                  - preferred_term: ADSS1 (human, muscle isozyme)
                    term:
                      id: UniProtKB:Q8N142
                      label: Adenylosuccinate synthetase isozyme 1
                  - preferred_term: ADE12 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P80210
                      label: Adenylosuccinate synthetase
                    description: Single yeast adenylosuccinate synthase (PMID:10417315).
            function:
              preferred_term: adenylosuccinate synthase activity
              term:
                id: GO:0004019
                label: adenylosuccinate synthase activity
              substrates:
                - preferred_term: IMP
                - preferred_term: L-aspartate
                - preferred_term: GTP
              products:
                - preferred_term: adenylosuccinate (N6-(1,2-dicarboxyethyl)-AMP)
                - preferred_term: GDP
                - preferred_term: phosphate
              evidence:
                - source_id: EC:6.3.4.4
                  statement: adenylosuccinate synthetase; GTP-dependent; committed IMP->AMP step (ADSL completes to AMP + fumarate)
                - source_id: Reactome:R-HSA-111524
                  statement: "IMP + L-Aspartate + GTP => Adenylosuccinate + GDP + Pi [ADSS] (human Reactome reaction)"
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-7219
                activity: gomodel:ADENYLOSUCCINATE-SYNTHASE-RXN
                title: 'adenosine ribonucleotides <i>de novo</i> biosynthesis - imported from: Saccharomyces Genome Database'
                description: ADE12 enables GO:0004019 in cytosol.
            role_description: >-
              GTP-dependent, committed first step toward AMP. In mammals ADSS1
              is the muscle isozyme (distal myopathy on deficiency) and ADSS2
              the ubiquitous isozyme; yeast has a single enzyme, ADE12.
    - order: 2
      role: adenylosuccinate -> AMP + fumarate
      node:
        id: adsl_amp_step
        label: Adenylosuccinate to AMP + fumarate
        module_type: REACTION
        annotons:
          - id: adsl_amp_activity
            label: Adenylosuccinate lyase (AMP-forming reaction)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PurB adenylosuccinate lyases
                family_terms:
                  - id: PANTHER:PTHR43411
                    label: ADENYLOSUCCINATE LYASE
                  - id: PANTHER:PTHR43172:SF1
                    label: ADENYLOSUCCINATE LYASE
                representative_members:
                  - preferred_term: ADSL (human)
                    term:
                      id: UniProtKB:P30566
                      label: Adenylosuccinate lyase
                  - preferred_term: ADE13 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:Q05911
                      label: Adenylosuccinate lyase
                  - preferred_term: purB (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0AB89
                      label: Adenylosuccinate lyase
            function:
              preferred_term: N6-(1,2-dicarboxyethyl)AMP AMP-lyase (fumarate-forming) activity
              term:
                id: GO:0004018
                label: N6-(1,2-dicarboxyethyl)AMP AMP-lyase (fumarate-forming) activity
              substrates:
                - preferred_term: adenylosuccinate
              products:
                - preferred_term: AMP
                - preferred_term: fumarate
              evidence:
                - source_id: EC:4.3.2.2
                  statement: adenylosuccinate lyase; the same enzyme cleaves SAICAR in de novo IMP synthesis
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-7219
                activity: gomodel:AMPSYN-RXN
                title: 'adenosine ribonucleotides <i>de novo</i> biosynthesis - imported from: Saccharomyces Genome Database'
                description: ADE13 enables GO:0004018 in cytosol.
            role_description: >-
              Completes AMP synthesis. The same protein performs the SAICAR
              lyase step of de_novo_purine_synthesis; human ADSL deficiency
              causes adenylosuccinate lyase deficiency.
    - order: 3
      role: IMP -> XMP (committed, rate-limiting GMP step)
      node:
        id: impdh_step
        label: IMP + NAD+ + H2O to XMP + NADH
        module_type: REACTION
        annotons:
          - id: impdh_activity
            label: IMP dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IMP dehydrogenase family
                term:
                  id: PANTHER:PTHR11911
                  label: INOSINE-5-MONOPHOSPHATE DEHYDROGENASE RELATED
                representative_members:
                  - preferred_term: IMPDH2 (human, ubiquitous/proliferation-associated)
                    term:
                      id: UniProtKB:P12268
                      label: Inosine-5'-monophosphate dehydrogenase 2
                  - preferred_term: IMPDH1 (human, retina-enriched)
                    term:
                      id: UniProtKB:P20839
                      label: Inosine-5'-monophosphate dehydrogenase 1
                  - preferred_term: IMD2 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P38697
                      label: Inosine-5'-monophosphate dehydrogenase 2
                    description: >-
                      Guanine-repressed, drug-inducible isozyme conferring
                      mycophenolate resistance (PMID:12746440, PMID:11035032).
                  - preferred_term: IMD3 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P50095
                      label: Inosine-5'-monophosphate dehydrogenase 3
                    description: Sufficient alone for guanine prototrophy (PMID:12746440).
                  - preferred_term: IMD4 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P50094
                      label: Inosine-5'-monophosphate dehydrogenase 4
                    description: Sufficient alone for guanine prototrophy (PMID:12746440).
            function:
              preferred_term: IMP dehydrogenase activity
              term:
                id: GO:0003938
                label: IMP dehydrogenase activity
              substrates:
                - preferred_term: IMP
                - preferred_term: NAD+
              products:
                - preferred_term: xanthosine 5'-monophosphate (XMP)
                - preferred_term: NADH
              evidence:
                - source_id: EC:1.1.1.205
                  statement: IMP dehydrogenase; committed rate-limiting GMP-synthesis step; CBS/Bateman domain, filament-forming; IMPDH2 = mycophenolate/ribavirin target
                - source_id: Reactome:R-HSA-73794
                  statement: "IMP + H2O + NAD+ => XMP + NADH + H+ [IMPDH1,2] (human Reactome reaction)"
                - source_id: PMID:12746440
                  supporting_text: >-
                    The simultaneous deletion of all four IMD genes was lethal
                    unless growth media were supplemented with guanine.
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-7221
                activity: gomodel:IMP-DEHYDROG-RXN
                title: 'guanosine ribonucleotides <i>de novo</i> biosynthesis - imported from: Saccharomyces Genome Database'
                description: IMD2, IMD3 and IMD4 each enable GO:0003938 in cytosol.
            role_description: >-
              Committed, rate-limiting step of GMP synthesis and the only step
              of the GMP branch that is transcriptionally repressed by guanine in
              yeast (PMID:11035032). Human IMPDH1 (retina; RP10/LCA) and IMPDH2
              (ubiquitous; neurodevelopmental dystonia; mycophenolate/ribavirin
              target) form regulated tetramers/filaments. Yeast IMD1 is a
              pseudogene.
    - order: 4
      role: XMP -> GMP (glutamine amination)
      node:
        id: gmps_step
        label: XMP + L-glutamine + ATP to GMP + L-glutamate + AMP + PPi
        module_type: REACTION
        annotons:
          - id: gmps_activity
            label: GMP synthase (glutamine-hydrolysing)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GMP synthase family (GuaA/GMPS)
                term:
                  id: PANTHER:PTHR11922
                  label: GMP SYNTHASE-RELATED
                representative_members:
                  - preferred_term: GMPS (human)
                    term:
                      id: UniProtKB:P49915
                      label: GMP synthase [glutamine-hydrolyzing]
                  - preferred_term: GUA1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P38625
                      label: GMP synthase [glutamine-hydrolyzing]
                    description: gua1 disruption causes guanine auxotrophy (PMID:8112582).
            function:
              preferred_term: GMP synthase (glutamine-hydrolyzing) activity
              term:
                id: GO:0003922
                label: GMP synthase (glutamine-hydrolyzing) activity
              substrates:
                - preferred_term: XMP
                - preferred_term: L-glutamine
                - preferred_term: ATP
              products:
                - preferred_term: GMP
                - preferred_term: L-glutamate
                - preferred_term: AMP + diphosphate
              evidence:
                - source_id: EC:6.3.5.2
                  statement: GMP synthase (glutamine-hydrolysing); final de novo GMP step, downstream of IMPDH
                - source_id: Reactome:R-HSA-73792
                  statement: "XMP + L-Glutamine + ATP + H2O => GMP + L-Glutamate + AMP + pyrophosphate (human Reactome reaction)"
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-7221
                activity: gomodel:GMP-SYN-GLUT-RXN
                title: 'guanosine ribonucleotides <i>de novo</i> biosynthesis - imported from: Saccharomyces Genome Database'
                description: GUA1 enables GO:0003922 in cytosol.
            role_description: >-
              Aminates XMP to GMP using glutamine and ATP. Also the route by
              which salvaged xanthine (via XMP) enters the guanine nucleotide
              pool. Human GMPS has a reported USP7/p53-regulatory nuclear
              moonlighting role (non-core).
    - order: 5
      role: AMP -> ADP
      node:
        id: adenylate_kinase_step
        label: AMP + ATP to 2 ADP
        module_type: REACTION
        annotons:
          - id: adenylate_kinase_activity
            label: Adenylate kinase (ATP:AMP phosphotransferase)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: adenylate kinase family (ADK/AK1-type)
                term:
                  id: PANTHER:PTHR23359
                  label: NUCLEOTIDE KINASE
                representative_members:
                  - preferred_term: ADK1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P07170
                      label: Adenylate kinase
                    description: >-
                      ADK1/AKY2, the major yeast AMP kinase, cytosolic and in
                      the mitochondrial intermembrane space (PMID:1333436).
                  - preferred_term: AK1 (human)
                    term:
                      id: UniProtKB:P00568
                      label: Adenylate kinase isoenzyme 1
                description: >-
                  PTHR23359 is a broad nucleoside-monophosphate kinase family that
                  also contains UMP/CMP kinases (URA6, CMPK1) and the GTP:AMP
                  phosphotransferase ADK2; the leaf function restricts the
                  selector to ATP:AMP phosphotransfer.
            function:
              preferred_term: AMP kinase activity
              term:
                id: GO:0004017
                label: AMP kinase activity
              substrates:
                - preferred_term: AMP
                - preferred_term: ATP
              products:
                - preferred_term: ADP
                  description: Two ADP molecules are formed.
              evidence:
                - source_id: EC:2.7.4.3
                  statement: adenylate kinase
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
              - preferred_term: mitochondrial intermembrane space
                term:
                  id: GO:0005758
                  label: mitochondrial intermembrane space
                evidence:
                  - source_id: PMID:1333436
                    statement: Wild-type mitochondria import AKY2 (ADK1) into the intermembrane space.
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-7219
                activity: gomodel:ADENYL-KIN-RXN
                title: 'adenosine ribonucleotides <i>de novo</i> biosynthesis - imported from: Saccharomyces Genome Database'
                description: >-
                  ADK1 and ADK2 each enable GO:0004017 in cytosol; ADK2 is a
                  mitochondrial-matrix GTP:AMP phosphotransferase and is not
                  adopted here.
            role_description: >-
              Converts AMP to ADP and equilibrates the adenylate pool; ADP is
              then phosphorylated to ATP by energy metabolism.
    - order: 6
      role: GMP -> GDP
      node:
        id: guanylate_kinase_step
        label: GMP + ATP to GDP + ADP
        module_type: REACTION
        annotons:
          - id: guanylate_kinase_activity
            label: Guanylate kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: guanylate kinases
                term:
                  id: PANTHER:PTHR23117:SF13
                  label: GUANYLATE KINASE
                representative_members:
                  - preferred_term: GUK1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P15454
                      label: Guanylate kinase
                    description: Essential gene (PMID:1334480).
                  - preferred_term: GUK1 (human)
                    term:
                      id: UniProtKB:Q16774
                      label: Guanylate kinase
            function:
              preferred_term: GMP kinase activity
              term:
                id: GO:0004385
                label: GMP kinase activity
              substrates:
                - preferred_term: GMP
                - preferred_term: ATP
              products:
                - preferred_term: GDP
                - preferred_term: ADP
              evidence:
