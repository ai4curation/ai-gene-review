id: MODULE:dmel_srp_cotranslational_targeting
title: SRP-dependent cotranslational targeting in Drosophila melanogaster
description: >-
  The signal recognition particle (SRP) recognizes signal sequences and transmembrane segments
  as they emerge from the ribosome, slows elongation and delivers the ribosome-nascent chain
  complex to the SRP receptor on the endoplasmic reticulum membrane. SRP is a ribonucleoprotein
  built on the 7SL RNA. Its Alu domain (SRP9 and SRP14) arrests elongation, and its S domain
  (SRP19, SRP54, SRP68 and SRP72) binds the signal sequence through the methionine-rich domain
  of the GTPase SRP54. The receptor is a heterodimer of the GTPases SRalpha and SRbeta. GTP-dependent
  interaction of SRP54 with SRalpha transfers the nascent chain to the Sec61 translocon, and
  reciprocal GTP hydrolysis releases SRP from its receptor.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001281
  title: 'FlyBase gene group SRP: Signal recognition particle'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as signal recognition particle
    (SRP); this module models that group.
- source_id: FB:FBgg0001282
  title: 'FlyBase gene group SRPR: Signal recognition particle receptor'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as signal recognition particle
    receptor (SRPR); this module models that group.
- source_id: GO:0006614
  title: SRP-dependent cotranslational protein targeting to membrane
  statement: >-
    GO term grounding the module as SRP-dependent cotranslational protein targeting to membrane.
notes: >-
  Boundary. The module ends at handover to the translocon; Sec61 and its partners are a separate
  module (dmel_sec61_translocon). Drosophila has two 7SL RNA genes, modelled together as the
  RNA scaffold of SRP. Domain assignments follow the conserved mammalian SRP structure. FlyBase
  groups realized by this module: SRP (FBgg0001281), SRPR (FBgg0001282). Participants were
  generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_srp_cotranslational_targeting.yaml. Genes without a UniProtKB entry
  (mostly non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes
  has a gene review yet unless noted.
