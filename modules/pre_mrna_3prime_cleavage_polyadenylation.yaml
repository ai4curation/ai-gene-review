                  the 64-kDa subunit to pre-mRNAs
              - source_id: PMID:7984242
                statement: CstF77 bridges CstF64 and CstF50.
                supporting_text: >-
                  We show that the 77K subunit is required for formation of active CstF and
                  bridges the 64K and 50K subunits.
              - source_id: PMID:35177537
                statement: CstF64 and CstF64tau are both active; CstF50 is essential.
                supporting_text: Both CstF64 and 64τ are active in pre-mRNA cleavage, and CstF50 is essential.
    - order: 4
      role: cleavage factor IIm, coupling to the Pol II CTD and ATP-dependent support of cleavage
      node:
