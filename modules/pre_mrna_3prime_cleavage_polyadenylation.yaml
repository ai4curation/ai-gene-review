              - preferred_term: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
                term:
                  id: GO:0180010
                  label: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
            locations:
              - preferred_term: nucleoplasm
                term:
                  id: GO:0005654
                  label: nucleoplasm
            role_description: >-
              PCF11's function is authored as the CTD-specific child of its IDA row RNA
              polymerase II complex binding (PMID:29196535), because the contact is made by the
              CTD-interacting domain. CLP1 is given ATP binding (TAS in GOA, PMID:8896421): ATP
