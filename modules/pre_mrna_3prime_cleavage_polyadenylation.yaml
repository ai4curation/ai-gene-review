            label: CstF hexamer binds the G/U-rich downstream element
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: CstF (two copies each of CstF77, CstF64 or CstF64tau, and CstF50)
                term:
