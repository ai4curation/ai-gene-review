id: MODULE:pre_mrna_3prime_cleavage_polyadenylation
title: Human pre-mRNA 3'-end cleavage and polyadenylation — AAUAAA recognition by mPSF (CPSF1, CPSF4, WDR33, FIP1L1), UGUA enhancement by CFIm (NUDT21 with CPSF6 or CPSF7), downstream GU-rich element binding by CstF (CSTF1, CSTF3, CSTF2 or CSTF2T), CF IIm (CLP1, PCF11), RBBP6-activated cleavage by the CPSF3 endonuclease in mCF (CPSF2, SYMPK), and poly(A) addition by PAPOLA or PAPOLG with PABPN1
description: >-
  The 3' ends of almost all RNA polymerase II pre-mRNAs are made in two linked steps: an
  endonucleolytic cut at the poly(A) site, followed by addition of a poly(A) tail of about
  250 adenylates to the upstream fragment. The cis-elements are the A(A/U)UAAA
  polyadenylation signal 10-30 nucleotides upstream of the cut, a U/GU-rich downstream
  element about 30 nucleotides past it, and auxiliary UGUA motifs further upstream. Four
  multisubunit factors assemble on these elements. CPSF has two subcomplexes: mPSF
  (CPSF160/CPSF1, WDR33, CPSF30/CPSF4 and hFip1/FIP1L1), in which CPSF30 and WDR33 contact
  the AAUAAA bases on a CPSF160 scaffold and hFip1 tethers poly(A) polymerase; and mCF,
  the cleavage module of the metallo-beta-lactamase endonuclease CPSF73 (CPSF3), its
  inactive paralogue CPSF100 (CPSF2) and the scaffold symplekin (SYMPK). CstF, a dimer of
  CstF77-CstF64-CstF50 trimers (CSTF3, CSTF2 or its paralogue CSTF2T, CSTF1), binds the
  downstream element. Cleavage factor Im, a CFIm25 (NUDT21) dimer with two CFIm68 (CPSF6)
  or CFIm59 (CPSF7) subunits, binds UGUA and activates nearby poly(A) sites, which makes it
  a central regulator of alternative polyadenylation. Cleavage factor IIm is a
  PCF11-CLP1 heterodimer; PCF11 binds the Pol II C-terminal domain and couples processing
  to termination, and ATP bound to CLP1 supports cleavage. In a fully reconstituted
  system, cleavage needs mPSF, mCF, CstF, CF IIm, poly(A) polymerase and RBBP6, whose
  DWNN domain contacts and activates CPSF73; CFIm stimulates but is not essential. After
  the cut, CPSF stays on AAUAAA and, with the nuclear poly(A)-binding protein PABPN1 coating
  the growing tail, holds poly(A) polymerase (PAPOLA, or the paralogue PAPOLG) in one
  processive event that stops at about 250 nucleotides when PABPN1 disrupts the
  CPSF-polymerase contact. The downstream product is degraded by XRN2, which terminates
  transcription.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000127
    title: RNA polymerase II transcription pathway
    statement: >-
      The module covers the 3'-end processing step of the RGD RNA polymerase II
      transcription pathway. The record text describes the poly(A) signal elements and
      the processing machinery of CPSF, CstF, CF Im, CF IIm and the poly(A) polymerases,
      and the diagram draws CPSF with CstF, CstF and CF IIm with the terminating
      polymerase, and the 3'-end processing pathway as mutually affecting termination.
      Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000127.yaml) as item 4 of
      the split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md.
  - source_id: PW:0001579
    title: 3'-end pre-mRNA processing pathway
    statement: >-
      RGD pathway linked from the PW:0000127 diagram (label verified in
      .cache/rgd_pw/pw.obo, is_a PW:0001569 mRNA maturation pathway). RGD annotates 22
      human genes to it (homo_genes_pw, citing the reviews PMID:21957020 and
      PMID:24243805); this module models 20 of them, and XRN2 and DXO are left to or
      excluded with the sibling termination module (notes).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000127.yaml
    statement: The RGD record text naming the processing factors and their roles.
    supporting_text: >-
      CPSF recognizes the primary poly(A) element, recruits other complexes and catalyzes
      the cleavage reaction. CstF binds the downstream U/GU element and requires
      cooperative binding of CPSF to the upstream poly(A) signal.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000127.yaml
    statement: The RGD record text on CF Im and CF IIm.
    supporting_text: >-
      CF Im binds the upstream UGUA motif and plays a role in the cleavage step. CF IIm
      interacts with pol II CTD and CstF, its exact function is not well known.
  - source_id: GO:0180010
    title: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
    statement: >-
      Module process concept and the process on every annoton (is_a GO:0031124 mRNA
      3'-end processing; checked in go-basic 2026-07-26). PW:0000127 maps to the broader
      GO:0006366 transcription by RNA polymerase II, the process of the whole split; the
      PW:0001579 definition cross-references no GO term. Experimental in GOA for CPSF3
      (IDA PMID:8929409), CPSF6, CPSF7 and NUDT21 (IDA PMID:29276085), CSTF3 (IDA
      PMID:7984242) and PAPOLA (IDA PMID:19224921).
  - source_id: GO:0005847
    title: mRNA cleavage and polyadenylation specificity factor complex
    statement: >-
      Complex concept for the mPSF and mCF parts. GOA part_of rows by IDA for CPSF1,
      CPSF2, CPSF3, CPSF4, FIP1L1, WDR33 and SYMPK (PMID:35177536 and others).
  - source_id: PMID:21957020
    title: Pre-mRNA 3'-end processing complex assembly and function.
    statement: Review cited by RGD for PW:0001579 (RGD:9681741); two-step cleavage and polyadenylation in a complex of more than 20 proteins.
    supporting_text: >-
      The 3'-ends of almost all eukaryotic mRNAs are formed in a two-step process, an
      endonucleolytic cleavage followed by polyadenylation
  - source_id: PMID:24243805
    title: 'Means to an end: mechanisms of alternative polyadenylation of messenger RNA precursors.'
    statement: Review cited by RGD for PW:0001579 (RGD:9681742); a core complex cleaves and polyadenylates, and many proteins select among alternative sites.
    supporting_text: >-
      A core 3'-end processing complex carries out the cleavage and polyadenylation
      reactions, but many proteins have been implicated in the selection of
      polyadenylation sites among the multiple alternatives that eukaryotic genes
      typically have.
  - source_id: PMID:35177537
    title: Reconstitution of 3' end processing of mammalian pre-mRNA reveals a central role of RBBP6.
    statement: >-
      Full reconstitution from purified human proteins defines 14 essential and two
      stimulatory polypeptides; this module's parts follow that minimal set.
    supporting_text: >-
      By reconstituting the reaction from overproduced and purified proteins, we provide a
      minimal list of 14 polypeptides that are essential and two that are stimulatory for
      RNA processing.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000127 (RNA polymerase II
  transcription pathway; seed tier related_module_only, flagged broad) as item 4 of the
  Pol II split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md, with
  RGD's diagram-linked 3'-end pre-mRNA processing pathway PW:0001579 (verified in
  .cache/rgd_pw/pw.obo; it has its own RGD gene annotations, so it is cited as an
  evidence source rather than in prose only). The sibling modules of the split are
  rna_polymerase_ii_core_and_initiation, mediator_complex,
  rna_polymerase_ii_elongation_and_termination and pre_mrna_capping; none of their content
  is modelled here. PW:0000127 and PW:0001579 are the only PW evidence source_ids; the
  termination child PW:0001332, whose RGD gene list includes the cleavage factors, is
  cited by the termination sibling and named here in prose only.


  (1) RGD GENES. RGD annotates 22 human genes to PW:0001579: CLP1 CPSF1 CPSF2 CPSF3 CPSF4
  CPSF6 CPSF7 CSTF1 CSTF2 CSTF2T CSTF3 DXO FIP1L1 NUDT21 PABPN1 PAPOLA PAPOLB PAPOLG PCF11
  SYMPK WDR33 XRN2. Twenty are modelled. XRN2, the torpedo exonuclease that degrades the
  downstream cleavage product, is modelled in rna_polymerase_ii_elongation_and_termination,
  which also excludes DXO: RGD draws Dxo with Xrn2 following the yeast Rat1-Rai1
  partnership, but human DXO's experimental function is decapping and 5'-end quality
  control, not a role in cleavage or polyadenylation. One protein not on RGD's list is
  added: RBBP6, an essential factor of the fully reconstituted reaction that contacts and
  activates CPSF73 (PMID:35177537, and the companion paper PMID:35177536, which supplies many of
  the IDA and IPI GOA rows on these genes).


  (2) STRUCTURE. The root is a BIOLOGICAL_PROCESS with process concept GO:0180010
  (co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway), and
  six parts following the factors of the minimal reconstituted system: mPSF (signal
  recognition), CFIm (optional, UGUA enhancer), CstF (downstream element), CF IIm, the mCF
  cleavage module with RBBP6, and polyadenylation. CPSF is split into mPSF and mCF because
  the two subcomplexes do different steps and mPSF alone supports AAUAAA-dependent
  polyadenylation (PMID:25301781); both carry the CPSF complex term GO:0005847. CFIm and CF
  IIm carry the parent GO:0005849 (mRNA cleavage factor complex), because GO has no
  CFIm- or CF IIm-specific complex term; this is noted, not requested. CFIm is optional
  because the reconstituted system cleaves without it, although in cells it is the main
  regulator of alternative polyadenylation (GO:0110104 on its annoton). Paralogue choices
  that make mixed complexes (CSTF2 with CSTF2T; CPSF6 with CPSF7) are written as units of
  one complex; the poly(A) polymerase paralogues, which act as single enzymes, are a
  REALIZER variant set with ONE_OR_MORE selection. Connections: mPSF, CstF and CF IIm
  PRECEDE cleavage; CFIm POSITIVELY_REGULATES mPSF recruitment; cleavage PRECEDES
  polyadenylation. Stoichiometry (CstF and CFIm dimers) is stated in prose only.


  (3) MOLECULAR FUNCTIONS. Experimental in GOA (QuickGO, November 2026) and used as is:
  CPSF3 GO:0004521 RNA endonuclease activity (IMP PMID:30507380; direct biochemistry in
  PMID:17128255); PAPOLA and PAPOLG GO:1990817 poly(A) RNA polymerase activity (IDA/EXP).
  Authored refinements of an experimental parent row: PCF11 GO:0099122 RNA polymerase II
  C-terminal domain binding (GOA IDA GO:0000993, PMID:29196535); CSTF2 GO:0036002 pre-mRNA
  binding (GOA IDA GO:0003723, PMID:1741396), given to CSTF2T by paralogy; NUDT21
  GO:0003730 mRNA 3'-UTR binding, the parent of its IDA rows to GO:0035925 (mRNA 3'-UTR
  AU-rich region binding), chosen because UGUA is not an AU-rich element as that term
  defines it. Authored without an experimental GOA row for the term: CPSF4 and WDR33
  GO:0003730 (cross-linking and cryo-EM, PMID:25301780, PMID:25301781, PMID:29208711; GO
  has no polyadenylation-signal binding term, requested in proposed_new_terms); FIP1L1
  GO:0060090 molecular adaptor activity (bridges CPSF160 and poly(A) polymerase, and docks
  the CFIm68/59 RS domains); CLP1 GO:0005524 ATP binding (GOA TAS PMID:8896421; the ATP
  role is experimental in PMID:35177537); RBBP6 GO:0008047 enzyme activator activity;
  PABPN1 GO:0008143 poly(A) binding (bovine protein, PMID:12637556); PAPOLB GO:1990817 (IBA
  and by similarity only). Subunits given no function, as structural or regulatory parts
  of a complex assayed as a whole: CPSF1 (scaffold), CPSF2 (inactive paralogue of CPSF73),
  SYMPK (scaffold), CSTF1, CSTF3, CPSF6 and CPSF7 (whose activating contact with hFip1 is
  protein binding only). GO:0005515 protein binding is not used. Poly(A) polymerase
  substrates and products are grounded to the ChEBI participants of RHEA:11332 (labels
  checked in OLS: CHEBI:140395, CHEBI:30616, CHEBI:173115, CHEBI:33019), as listed in the
  UniProt catalytic-activity lines of PAPOLA and PAPOLG; Mg(2+) is the cofactor and is not
  modelled. CLP1's experimental ATP-dependent polyribonucleotide 5'-hydroxyl-kinase activity
  (IDA PMID:17495927) is not used: it acts in tRNA splicing, and neither kinase activity nor
  ATP hydrolysis is needed for pre-mRNA cleavage (PMID:35177537).


  (4) SUBSTRATE VERSUS PARTICIPANT. The pre-mRNA, the poly(A) signal and the Pol II CTD are
  inputs, not participants. Pol II itself (rna_polymerase_ii_core_and_initiation) is not
  part of this module: the CTD is dispensable for cleavage in the reconstituted system
  (PMID:35177537), and its role in coupling is recorded only as PCF11's CTD binding. Poly(A)
  polymerase is required for cleavage as a protein, not as an enzyme, so the cleavage step
  does not depend on the polyadenylation reaction.


  (5) BOUNDARY DECISIONS. Replication-dependent histone pre-mRNA 3' processing (U7 snRNP,
  SLBP, LSM10, LSM11, ZNF473, the histone cleavage complex that reuses mCF) is a distinct
  mechanism without polyadenylation and is not on RGD's list; it is mentioned, not
  modelled, and would be a separate module (compare the Drosophila analogue
  dmel_histone_mrna_3prime_processing). Termination (XRN2 torpedo; PCF11's role in
  dismantling the elongation complex) is in rna_polymerase_ii_elongation_and_termination.
  Capping is in pre_mrna_capping. Non-canonical poly(A) polymerases (TUT1/Star-PAP and the
  cytoplasmic TENT enzymes), cytoplasmic polyadenylation (GO:0180011), mitochondrial
  polyadenylation, poly(A) tail shortening by deadenylases, and nuclear export of the
  polyadenylated mRNA (mrna_nuclear_export) are outside the boundary. Regulators and
  accessory proteins of the 3'-end complex (the CPF-like phosphatase module with SSU72 and
  protein phosphatase 1, CDC73, PAF1C, splicing-factor couplings, IRBIT inhibition of
  poly(A) polymerase) are not parts; SSU72, CDC73 and PABPN1 had little effect on cleavage
  in the reconstituted system. The Drosophila module dmel_cleavage_polyadenylation was used
  for structure only and is not evidence for any human claim.


  (6) GO-CAM LINKS. No production GO-CAM in gocams/index.tsv (any species) contains CPSF1-7,
  NUDT21, FIP1L1, WDR33, CSTF1-3, CSTF2T, CLP1, PCF11, SYMPK, PAPOLA, PAPOLB, PAPOLG, PABPN1
  or RBBP6, and no model uses GO:0180010, GO:0031124, GO:0030846 or GO:0110104. The index's
  PomBase clp1 and fip1 rows are unrelated proteins (a Cdc14-family phosphatase and an iron
  permease) that share yeast gene symbols. No gocam_associations are recorded.


  (7) POSSIBLE UPSTREAM ISSUES (GOA). CPSF1 carries an IDA row for GO:0035925 mRNA 3'-UTR
  AU-rich region binding (PMID:7590244) for AAUAAA binding by CPSF; the polyadenylation
  signal is not an AU-rich element in the sense of that term, and later structures place
  the base contacts on CPSF30 and WDR33, with CPSF160 as scaffold. NUDT21's IDA rows to the
  same term are for UGUA binding. Both look like the nearest available term for a
  sequence-specific element GO does not have; the requested term would fix them. CPSF3's
  IMP RNA endonuclease row cites PMID:30507380, a paper whose subject is MBLAC1 as a
  histone pre-mRNA endonuclease; a direct biochemical reference (PMID:17128255) would be a
  better reference. No gene in this module has a gene review in the repository yet.
proposed_new_terms:
  - proposed_name: mRNA polyadenylation signal binding
    proposed_definition: >-
      Binding to the polyadenylation signal of a pre-mRNA, the A(A/U)UAAA hexamer located
      10-30 nucleotides upstream of the cleavage and polyadenylation site, which directs
      both 3'-end cleavage and poly(A) addition.
    justification: >-
      The defining activity of the CPSF signal-recognition subcomplex is sequence-specific
      readout of AAUAAA by CPSF30 (CPSF4) and WDR33, shown by cross-linking, reconstitution
      and a cryo-EM structure. GO has no term for it: curators have used GO:0035925 mRNA
      3'-UTR AU-rich region binding, whose definition is the UUAUUUAUU instability element,
      and this module uses the parent GO:0003730 mRNA 3'-UTR binding on the CPSF4 and WDR33
      units. The signal remains in the mature 3' UTR, so GO:0003730 is the parent. No
      equivalent request exists in modules/ (checked with export_proposed_terms).
    proposed_parent:
      id: GO:0003730
      label: mRNA 3'-UTR binding
    supported_by:
      - reference_id: PMID:29208711
        supporting_text: >-
          Strikingly, the AAUAAA PAS assumes an unusual conformation that allows this short
          motif to be bound directly by both CPSF-30 and WDR33.
      - reference_id: PMID:25301780
        supporting_text: CPSF30 and Wdr33 directly bind to AAUAAA in mammalian mRNA 3' processing.
module:
  id: pre_mrna_3prime_cleavage_polyadenylation
  label: Human pre-mRNA 3'-end cleavage and polyadenylation
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
      term:
        id: GO:0180010
        label: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: nucleoplasm
        term:
          id: GO:0005654
          label: nucleoplasm
  parts:
    - order: 1
      role: polyadenylation signal (AAUAAA) recognition and poly(A) polymerase tethering
      node:
        id: mpsf
        label: mPSF, the polyadenylation-signal recognition subcomplex of CPSF
        module_type: PROTEIN_COMPLEX
        concepts:
          - preferred_term: mRNA cleavage and polyadenylation specificity factor complex
            term:
              id: GO:0005847
              label: mRNA cleavage and polyadenylation specificity factor complex
        annotons:
          - id: mpsf_complex
            label: mPSF (CPSF1, WDR33, CPSF4, FIP1L1) binds the AAUAAA polyadenylation signal
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: mammalian polyadenylation specificity factor (mPSF)
                term:
                  id: GO:0005847
                  label: mRNA cleavage and polyadenylation specificity factor complex
                active_units:
                  - id: cpsf1_scaffold
                    label: CPSF1 (CPSF160) scaffold
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CPSF1
                        term:
                          id: UniProtKB:Q10570
                          label: Cleavage and polyadenylation specificity factor subunit 1
                  - id: wdr33_pas_binding
                    label: WDR33 contacts U3 and A6 of AAUAAA
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: WDR33
                        term:
                          id: UniProtKB:Q9C0J8
                          label: pre-mRNA 3' end processing protein WDR33
                    function:
                      preferred_term: mRNA 3'-UTR binding
                      term:
                        id: GO:0003730
                        label: mRNA 3'-UTR binding
                  - id: cpsf4_pas_binding
                    label: CPSF4 (CPSF30) zinc fingers 2 and 3 read A1, A2, A4 and A5 of AAUAAA
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CPSF4
                        term:
                          id: UniProtKB:O95639
                          label: Cleavage and polyadenylation specificity factor subunit 4
                    function:
                      preferred_term: mRNA 3'-UTR binding
                      term:
                        id: GO:0003730
                        label: mRNA 3'-UTR binding
                  - id: fip1l1_pap_tether
                    label: FIP1L1 (hFip1) tethers poly(A) polymerase to CPSF
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: FIP1L1
                        term:
                          id: UniProtKB:Q6UN15
                          label: Pre-mRNA 3'-end-processing factor FIP1
                    function:
                      preferred_term: molecular adaptor activity
                      term:
                        id: GO:0060090
                        label: molecular adaptor activity
            processes:
              - preferred_term: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
                term:
                  id: GO:0180010
                  label: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
            locations:
              - preferred_term: nucleoplasm
                term:
                  id: GO:0005654
                  label: nucleoplasm
            role_description: >-
              CPSF30 and WDR33 make the base contacts with AAUAAA, and CPSF160 is the scaffold
              that preorganizes them; CPSF1 is therefore given no function of its own. The
              mRNA 3'-UTR binding function on CPSF4 and WDR33 is curator-authored from the
              cross-linking and structural evidence below (their only experimental MF rows in
              GOA are HDA RNA binding, and for CPSF4 an IDA DNA-binding row from an unrelated
              context); GO has no term for sequence-specific binding of the polyadenylation
              signal, requested in proposed_new_terms. FIP1L1 molecular adaptor activity is
              authored (no experimental MF row beyond HDA RNA binding): hFip1 bridges CPSF160
              and poly(A) polymerase and is also the docking site for the RS domains of
              CFIm68/CFIm59. mPSF alone, with poly(A) polymerase and PABPN1, supports
              AAUAAA-dependent polyadenylation.
            evidence:
              - source_id: PMID:29208711
                statement: Cryo-EM of CPSF160-WDR33-CPSF30-AAUAAA shows direct base readout by CPSF30 and WDR33.
                supporting_text: >-
                  Strikingly, the AAUAAA PAS assumes an unusual conformation that allows this
                  short motif to be bound directly by both CPSF-30 and WDR33.
              - source_id: PMID:29208711
                statement: CPSF160 is the scaffold.
                supporting_text: >-
                  CPSF-160 functions as an essential scaffold and preorganizes CPSF-30 and
                  WDR33 for high-affinity binding to AAUAAA.
              - source_id: PMID:25301781
                statement: Four subunits form a CPSF subcomplex sufficient for AAUAAA-dependent polyadenylation.
                supporting_text: >-
                  only four (CPSF160, CPSF30, hFip1, and WDR33) are necessary and sufficient to
                  reconstitute a CPSF subcomplex active in AAUAAA-dependent polyadenylation,
                  whereas CPSF100, CPSF73, and symplekin are dispensable.
              - source_id: PMID:25301780
                statement: CPSF30 and WDR33 bind AAUAAA directly.
                supporting_text: CPSF30 and Wdr33 directly bind to AAUAAA in mammalian mRNA 3' processing.
              - source_id: PMID:21957020
                statement: CPSF anchors poly(A) polymerase through CPSF160 and hFip1.
                supporting_text: >-
                  Following cleavage, CPSF remains bound to the A(A/U)UAAA element and anchors
                  PAP to the RNA for polyadenylation through direct interactions between
                  CPSF160, hFip1 and PAP
    - order: 2
      role: upstream UGUA enhancer recognition and activation of the poly(A) site
      optional: true
      node:
        id: cfim
        label: Cleavage factor Im (NUDT21 dimer with CPSF6 or CPSF7)
        module_type: PROTEIN_COMPLEX
        concepts:
          - preferred_term: mRNA cleavage factor complex
            term:
              id: GO:0005849
              label: mRNA cleavage factor complex
        annotons:
          - id: cfim_complex
            label: CFIm binds UGUA motifs and activates enhancer-containing poly(A) sites
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: cleavage factor Im (CFIm25 dimer with CFIm68 or CFIm59)
                term:
                  id: GO:0005849
                  label: mRNA cleavage factor complex
                active_units:
                  - id: nudt21_ugua_binding
                    label: NUDT21 (CFIm25) dimer binds UGUA
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NUDT21
                        term:
                          id: UniProtKB:O43809
                          label: Cleavage and polyadenylation specificity factor subunit 5
                    function:
                      preferred_term: mRNA 3'-UTR binding
                      term:
                        id: GO:0003730
                        label: mRNA 3'-UTR binding
                  - id: cpsf6_cfim68
                    label: CPSF6 (CFIm68) large subunit; RS domain binds FIP1L1
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CPSF6
                        term:
                          id: UniProtKB:Q16630
                          label: Cleavage and polyadenylation specificity factor subunit 6
                  - id: cpsf7_cfim59
                    label: CPSF7 (CFIm59) large subunit, redundant with CPSF6
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CPSF7
                        term:
                          id: UniProtKB:Q8N684
                          label: Cleavage and polyadenylation specificity factor subunit 7
            processes:
              - preferred_term: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
                term:
                  id: GO:0180010
                  label: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
              - preferred_term: mRNA alternative polyadenylation
                term:
                  id: GO:0110104
                  label: mRNA alternative polyadenylation
            locations:
              - preferred_term: nucleoplasm
                term:
                  id: GO:0005654
                  label: nucleoplasm
            role_description: >-
              A heterotetramer of two CFIm25 subunits with two CFIm68 or two CFIm59 subunits;
              CFIm68 and CFIm59 are functionally redundant and are written as alternative
              units of one complex. CFIm25 binds UGUA; the function is curator-authored as the
              parent mRNA 3'-UTR binding of NUDT21's IDA rows (mRNA 3'-UTR AU-rich region
              binding, PMID:20479262 and PMID:21295486), because UGUA is not an AU-rich
              element in the sense of that term's definition. CPSF6 and CPSF7 get no function:
              their activating RS domains bind hFip1, for which GO offers only protein
              binding. The part is optional because CFIm stimulates but is not required for
              cleavage of a model substrate in the reconstituted system; in cells it is the
              major regulator of alternative polyadenylation (IMP rows for NUDT21, CPSF6 and
              CPSF7).
            evidence:
              - source_id: PMID:35177537
                statement: CF I subunit composition and UGUA recognition.
                supporting_text: >-
                  CF I consists of a dimer of CF I-25 and two copies of CF I-59 or CF I-68
                  (Rüegsegger et al. 1998; Yang et al. 2011) and recognizes UGUA motifs
                  upstream of AAUAAA
              - source_id: PMID:35177537
                statement: CF I is stimulatory, not essential, in the reconstituted cleavage reaction.
                supporting_text: >-
                  A titration experiment confirmed that CF I was stimulatory for cleavage of
                  the SV40 late RNA but not essential
              - source_id: PMID:20479262
                statement: Crystal structures of the CFIm25 dimer bound to UGUA RNA; CFIm25 is an inactive Nudix fold.
                supporting_text: >-
                  CFI(m)25 is the first Nudix protein to be reported to bind RNA in a
                  sequence-specific manner.
              - source_id: PMID:20695905
                statement: CFIm is a heterotetramer and controls alternative polyadenylation; the large subunits are redundant.
                supporting_text: >-
                  CFIm forms stable heterotetramers through dimerization of CFIm25 and (ii)
                  the CFIm complex per se is responsible for the control of alternative
                  polyadenylation. (iii) However, the structurally related CFIm68 and CFIm59
                  are functionally redundant
              - source_id: PMID:29276085
                statement: CFIm activates enhancer-containing poly(A) sites through RS-domain contacts with Fip1.
                supporting_text: >-
                  the CFIm activator functions are mediated by the arginine-serine repeat (RS)
                  domains of CFIm68/59, which bind specifically to an RS-like region in the
                  CPSF subunit Fip1
    - order: 3
      role: downstream U/GU-rich element recognition
      node:
        id: cstf
        label: Cleavage stimulation factor (CstF)
        module_type: PROTEIN_COMPLEX
        concepts:
