  connections:
    - source: mpsf
      target: mcf_cleavage
      connection_type: PRECEDES
      description: >-
        AAUAAA-bound mPSF, with CstF on the downstream element and CF IIm, positions mCF;
        RBBP6 activates CPSF73, which cuts at the poly(A) site.
    - source: cstf
      target: mcf_cleavage
      connection_type: PRECEDES
      description: CstF binding of the downstream element is required for cleavage.
    - source: cfiim
      target: mcf_cleavage
      connection_type: PRECEDES
      description: CF IIm, with ATP bound to CLP1, is required for cleavage.
    - source: cfim
      target: mpsf
      connection_type: POSITIVELY_REGULATES
      description: >-
        CFIm bound at UGUA enhancers recruits CPSF through RS-domain contacts with hFip1,
        activating nearby poly(A) sites and shaping alternative polyadenylation.
    - source: mcf_cleavage
      target: polyadenylation
      connection_type: PRECEDES
      description: >-
        The upstream cleavage product, still bound by CPSF at AAUAAA, is polyadenylated by
