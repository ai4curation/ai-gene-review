                  polyadenylation activity from HeLa cell nuclear extract.
              - source_id: PMID:21957020
                statement: PCF11 binds the CTD through its CID.
                supporting_text: >-
                  Pcf11 binds to the RNAP II CTD in a phosphorylation-dependent manner via its
                  CTD-interacting domain (CID domain)
    - order: 5
