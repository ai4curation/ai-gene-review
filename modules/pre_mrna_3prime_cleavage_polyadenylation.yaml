              ATP-dependent polyribonucleotide 5'-hydroxyl-kinase activity (IDA PMID:17495927)
              belongs to tRNA splicing and is not used here, because neither the kinase nor
              ATP hydrolysis is needed for pre-mRNA cleavage. PCF11's role in terminating
              transcription is modelled in the sibling module
              rna_polymerase_ii_elongation_and_termination, not here.
            evidence:
              - source_id: PMID:35177537
                statement: CF II is a PCF11-CLP1 heterodimer; PCF11 binds the CTD and couples processing to termination.
                supporting_text: >-
                  CF II is a heterodimer of hPcf11 and hClp1 (Schäfer et al. 2018). Pcf11 binds
                  the Pol II C-terminal domain (CTD) and is important for the coupling of 3′ end
                  processing to transcription termination
              - source_id: PMID:35177537
                statement: ATP bound to CLP1 supports cleavage; hydrolysis is not needed.
                supporting_text: >-
