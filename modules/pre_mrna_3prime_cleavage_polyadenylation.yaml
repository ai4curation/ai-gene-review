                      preferred_term: pre-mRNA binding
                      term:
                        id: GO:0036002
                        label: pre-mRNA binding
                  - id: cstf2t_rrm
                    label: CSTF2T (CstF64tau) paralogue, interchangeable with CSTF2
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CSTF2T
                        term:
                          id: UniProtKB:Q9H0L4
                          label: Cleavage stimulation factor subunit 2 tau variant
                    function:
                      preferred_term: pre-mRNA binding
                      term:
                        id: GO:0036002
                        label: pre-mRNA binding
                  - id: cstf1_wd40
                    label: CSTF1 (CstF50) tunes element recognition and is essential for cleavage
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CSTF1
                        term:
                          id: UniProtKB:Q05048
                          label: Cleavage stimulation factor subunit 1
            processes:
              - preferred_term: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
                term:
                  id: GO:0180010
                  label: co-transcriptional mRNA 3'-end processing, cleavage and polyadenylation pathway
            locations:
              - preferred_term: nucleoplasm
                term:
                  id: GO:0005654
                  label: nucleoplasm
            role_description: >-
              CstF binds the U/GU-rich element downstream of the cleavage site through the
              CstF64 RRM, with CstF77 raising its affinity and CstF50 tuning specificity.
              Pre-mRNA binding on CSTF2 is curator-authored as a child of its IDA RNA binding
              row (PMID:1741396); the bound element lies downstream of the cut and is never part
              of the mRNA, so pre-mRNA binding rather than mRNA 3'-UTR binding is used. CSTF2T
              is given the same function by paralogy (its GOA has HDA RNA binding only); CstF64
              and CstF64tau are both active and can form mixed complexes, so they are written as
              units of one complex rather than as variants. CSTF3 and CSTF1 get no function of
              their own.
            evidence:
              - source_id: PMID:29186539
                statement: CstF is a hexamer that recognizes G/U-rich sequences downstream of the polyadenylation signal.
                supporting_text: >-
                  Cleavage stimulation factor (CstF) is a highly conserved protein complex
                  composed of three subunits that recognizes G/U-rich sequences downstream of
                  the polyadenylation signal of eukaryotic mRNAs.
              - source_id: PMID:29186539
                statement: Roles of CstF77 and CstF50 in RNA recognition by the CstF64 RRM.
                supporting_text: >-
                  We further demonstrate that CstF-77 boosts the affinity of the CstF-64 RRM to
                  the RNA targets and CstF-50 fine tunes the ability of the complex to
                  recognize G/U sequences of certain lengths and content.
              - source_id: PMID:1741396
