    glutathione-hydrolase entries are not included because they do not define
    taurine uptake or the TauD cleavage reaction. No PAINT ancestral node is
    asserted: the PTN identifiers in current PSEPK GOA are TreeGrafter or
    combined electronic supports rather than canonical IBA ancestral-state
    evidence.
