id: MODULE:taurine_uptake_and_desulfonation
title: Bacterial taurine uptake and desulfonation
description: >-
  A reusable two-part bacterial module in which the TauABC ATP-binding cassette
  transporter imports extracellular taurine and TauD oxidatively cleaves the
  imported sulfonate to aminoacetaldehyde and sulfite. The module represents
  acquisition of taurine as a sulfur source. Downstream aminoacetaldehyde
  metabolism, sulfite assimilation, sulfur-starvation regulation, and
  alternative organosulfonate transport or cleavage systems are outside the
  boundary.
status: DRAFT
evidence:
  - source_id: GO:0015734
    title: taurine transmembrane transport
    statement: GO:0015734 provides the biological-process context for TauABC-mediated uptake.
  - source_id: PMID:22221834
    title: The Fe(II)/alpha-ketoglutarate-dependent taurine dioxygenases from Pseudomonas putida and Escherichia coli are tetramers.
    statement: >-
      Biochemical, kinetic, and structural work directly establishes the
      Pseudomonas putida TauD reaction and tetrameric assembly.
  - source_id: PMID:8808933
    title: >-
      Identification of sulfate starvation-regulated genes in Escherichia coli:
      a gene cluster involved in the utilization of taurine as a sulfur source.
    statement: >-
      Gene disruption and sequence analysis establish TauABC as a taurine
      uptake system and distinguish its binding, ATPase, and membrane units.
  - source_id: PMID:17203388
    title: Functional characteristics of TauA binding protein from TauABC Escherichia coli system.
    statement: >-
      Purified E. coli TauA binds taurine with high affinity and specificity.
  - source_id: file:modules/taurine_uptake_and_desulfonation-deep-research-openscientist.md
    title: OpenScientist research for bacterial taurine uptake and desulfonation
    statement: >-
      The generic review evaluates the TauABC-TauD boundary, transport-complex
      organization, reaction chemistry, and known alternatives.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__taurine_uptake_and_desulfonation__ppu00430-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00430 satisfiability review
    statement: >-
      The species-aware review evaluates TauABC and TauD in Pseudomonas putida
      KT2440 against the broader taurine and hypotaurine metabolism map.
  - source_id: file:PSEPK/tauA/tauA-ai-review.yaml
    title: PSEPK tauA gene review
    statement: Q88RA0 supplies the periplasmic taurine-binding unit.
  - source_id: file:PSEPK/tauB/tauB-ai-review.yaml
    title: PSEPK tauB gene review
    statement: Q88RA1 supplies the ATP-coupling units of TauABC.
  - source_id: file:PSEPK/tauC/tauC-ai-review.yaml
    title: PSEPK tauC gene review
    statement: Q88RA2 supplies the transmembrane units of TauABC.
  - source_id: file:PSEPK/tauD/tauD-ai-review.yaml
    title: PSEPK tauD gene review
    statement: Q88RA3 supplies taurine dioxygenase activity.
