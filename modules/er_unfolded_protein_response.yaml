                activity: gomodel:5b528b1100000489/5b528b1100000541
                title: XBP-1 is a cell-nonautonomous regulator of stress resistance and longevity
              - model: gomodel:689e7a5d00000567
                activity: gomodel:689e7a5d00000567/689e7a5d00000580
                title: Activation of XBP1 by IRE1 in UPR (Human)
        variant_sets:
