              - source_id: PMID:9323131
                title: The transmembrane kinase Ire1p is a site-specific endonuclease that initiates mRNA splicing in the unfolded protein response.
                statement: Yeast Ire1 cleaves HAC1 mRNA at both splice junctions.
                supporting_text: >-
                  it is a site-specific endoribonuclease that cleaves HAC1
                  mRNA specifically at both splice junctions.
            gocam_associations:
