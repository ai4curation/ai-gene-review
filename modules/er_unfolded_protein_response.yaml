    - order: 4
      role: ER HSP70 (BiP) chaperone as transducer repressor and UPR output
      node:
        id: bip_chaperones
        label: BiP ER HSP70 chaperones
        module_type: BIOLOGICAL_PROCESS
        description: >-
          BiP (human HSPA5; worm paralogs HSP-4 and HSP-3) is the ER-luminal
          HSP70. It folds client proteins in an ATP-dependent cycle, and in
          unstressed mammalian cells it binds the luminal domains of IRE1,
          PERK and ATF6 and keeps them inactive until misfolded clients
          titrate it away. BiP is also a major UPR target. In C. elegans hsp-4
          is strongly stress-inducible and is the standard UPR-ER reporter,
          while hsp-3 is expressed at higher basal levels; direct binding of
          either paralog to the worm transducers has not been shown.
