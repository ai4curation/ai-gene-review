id: MODULE:er_unfolded_protein_response
title: Endoplasmic reticulum unfolded protein response
description: >-
  The endoplasmic reticulum unfolded protein response (UPR-ER) matches the
  folding capacity of the ER to the load of client proteins entering it. In
  animals ER stress is sensed by three ER-membrane transducers. The
  kinase-endoribonuclease IRE1 removes a small intron from the XBP1 mRNA, and
  the spliced mRNA encodes the active bZIP transcription factor XBP1s, which
  induces chaperone, folding and ER-associated degradation genes, including
  the BiP gene. The eIF2alpha kinase PERK phosphorylates eIF2alpha to
  attenuate general translation and so reduce client load; reduced ternary
  complex favours translation of the uORF-containing ATF4 mRNA, and ATF4 then
  activates cytoprotective genes. ATF6 is an ER-membrane-anchored bZIP factor
  that is released by intramembrane proteolysis and enters the nucleus. The
  ER HSP70 BiP is both a luminal folding chaperone and a UPR target, and its
  binding to the luminal domains of the transducers keeps them inactive until
  misfolded proteins compete it away. The IRE1 arm is the ancestral eukaryotic
  core: budding yeast has only Ire1 and its spliced-mRNA target Hac1, an
  unrelated bZIP factor that plays the XBP1 role, while the PERK and ATF6 arms
  are animal additions. The arms are partly redundant; in C. elegans, loss of
  the IRE1-XBP1 arm together with PERK or ATF6 causes larval arrest, and
  neuronal XBP1s can activate the UPR-ER in distant tissues.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:22125500
    title: Physiological IRE-1-XBP-1 and PEK-1 signaling in Caenorhabditis elegans larval development and immunity.
    statement: The three metazoan UPR-ER arms are mediated by IRE-1, PERK/PEK-1 and ATF-6.
    supporting_text: >-
      Endoplasmic reticulum (ER) stress activates the Unfolded Protein
      Response, a compensatory signaling response that is mediated by the
      IRE-1, PERK/PEK-1, and ATF-6 pathways in metazoans.
  - source_id: PMID:11779464
    title: XBP1 mRNA is induced by ATF6 and spliced by IRE1 in response to ER stress to produce a highly active transcription factor.
    statement: >-
      In yeast Ire1 splicing of HAC1 mRNA produces the UPR transcription
      factor; mammals instead splice XBP1 and also use the ATF6 pathway.
    supporting_text: >-
      In yeast, the transmembrane protein kinase/endoribonuclease Ire1p
      activated by endoplasmic reticulum stress cleaves HAC1 mRNA, leading to
      production of the transcription factor Hac1p that activates the unfolded
      protein response (UPR). In mammals, no Hac1p counterpart has yet been
      discovered despite the presence of Ire1p homologs in the endoplasmic
      reticulum. Instead, the transcription factor ATF6 specific to the
      mammalian UPR is regulated by intramembrane proteolysis.
  - source_id: PMID:10854322
    title: Dynamic interaction of BiP and ER stress transducers in the unfolded-protein response.
    statement: >-
      In mammalian cells BiP binds the luminal domains of PERK and IRE1 and
      represses them until misfolding releases it.
    supporting_text: >-
      These findings are consistent with a model in which BiP represses
      signalling through PERK and IRE1 and protein misfolding relieves this
      repression by effecting the release of BiP from the PERK and IRE1
      lumenal domains.
  - source_id: PMID:11779465
    title: Complementary signaling pathways regulate the unfolded protein response and are required for C. elegans development.
    statement: >-
      ire-1-mediated xbp-1 splicing is required for UPR transcription, and
      ire-1/xbp-1 acts with pek-1 in complementary pathways essential for
      development.
    supporting_text: >-
      C. elegans requires ire-1-mediated splicing of xbp-1 mRNA for UPR gene
      transcription and survival upon ER stress. In addition, ire-1/xbp-1 acts
      with pek-1, a protein kinase that mediates translation attenuation, in
      complementary pathways that are essential for worm development and
      survival.
  - source_id: PMID:16184190
    title: Genetic interactions due to constitutive and inducible gene regulation mediated by the unfolded protein response in C. elegans.
    statement: >-
      Loss of ire-1 or xbp-1 is synthetically lethal with loss of atf-6 or
      pek-1.
    supporting_text: >-
      deletion of either ire-1 or xbp-1 is synthetically lethal with deletion
      of either atf-6 or pek-1, both producing a developmental arrest at
      larval stage 2.
  - source_id: PMID:16184190
    title: Genetic interactions due to constitutive and inducible gene regulation mediated by the unfolded protein response in C. elegans.
    statement: >-
      The arms act mainly through non-overlapping target sets; atf-6 drives
      constitutive UPR genes and pek-1 about a quarter of inducible ones.
    supporting_text: >-
      As pek-1 and atf-6 mainly act through sets of nonoverlapping targets
      that are different from ire-1 and xbp-1 targets, at least two
      coordinated responses are required to alleviate ER stress by distinct
      mechanisms.
  - source_id: PMID:23791175
    title: XBP-1 is a cell-nonautonomous regulator of stress resistance and longevity.
    statement: Neuronal XBP-1s activates the UPR-ER in distal, non-neuronal tissues.
    supporting_text: >-
      Neuronally derived XBP-1s was sufficient to rescue stress resistance,
      increase longevity, and activate the UPR(ER) in distal, non-neuronal
      cell types through a cell-nonautonomous mechanism.
  - source_id: file:genes/worm/ire-1/ire-1-ai-review.yaml
    title: worm ire-1 gene review
    statement: >-
      Core functions: RNA endonuclease and protein serine/threonine kinase
      activity at the ER membrane in the IRE1-mediated UPR.
  - source_id: file:genes/human/ERN1/ERN1-ai-review.yaml
    title: human ERN1 gene review
    statement: >-
      Core functions: RNA endonuclease (XBP1 splicing) and protein
      serine/threonine kinase activity at the ER membrane in the
      IRE1-mediated UPR.
  - source_id: file:genes/yeast/IRE1/IRE1-ai-review.yaml
    title: yeast IRE1 gene review
    statement: >-
      Core functions: protein serine/threonine kinase and RNA endonuclease
      (HAC1 mRNA splicing) activity in the IRE1-mediated UPR.
  - source_id: file:genes/human/HSPA5/HSPA5-ai-review.yaml
    title: human HSPA5 gene review
    statement: >-
      Core functions: ATP-dependent protein folding chaperone in the ER lumen,
      and protein sequestering activity that negatively regulates the IRE1,
      PERK and ATF6 branches.
  - source_id: file:genes/worm/pek-1/pek-1-ai-review.yaml
    title: worm pek-1 gene review
    statement: "Core function: eukaryotic translation initiation factor 2alpha kinase activity."
  - source_id: file:genes/worm/eif-2alpha/eif-2alpha-ai-review.yaml
    title: worm eif-2alpha gene review
    statement: >-
      Core functions: translation initiation factor activity in translational
      initiation and, as the phosphorylated regulatory node, in the
      PERK-mediated unfolded protein response.
notes: >-
  Boundary. This module covers the three UPR-ER transducer arms (IRE1/XBP1,
  PERK/eIF2alpha/ATF4 and ATF6) and the ER HSP70 BiP, which is both a
  regulator of the transducers and a transcriptional output. It has four
  parts. It replaces the earlier C. elegans-only module
  MODULE:c_elegans_er_unfolded_protein_response; all worm members and their
  evidence are kept as representative members.

  Taxon scope. The module context is Metazoa (NCBITaxon:33208), the clade
  over which the three-arm boundary holds. The IRE1 arm is older: PAINT node
  PTN000359335 places IRE1-mediated UPR at an ancestral eukaryotic IRE1 node
  (donors include plant, fungal, fly and mouse genes). Its output varies by
  lineage and is modeled as the variant set ire1_output_transcription_factor
  (XBP1 in animals, the unrelated bZIP Hac1 in budding yeast). The yeast
  variant documents the ancestral single-arm core and lies outside the
  module's metazoan context. Yeast Ire1 also binds unfolded proteins
  directly, whereas mammalian IRE1alpha activation depends mainly on BiP
  release (PMID:19538957). The tRNA ligase that completes splicing (yeast
  Trl1; RtcB in animals) is not modeled.

  Representatives. Each role is a FAMILY selector with the worm protein and
  one human exemplar (plus yeast Ire1 and Hac1 for the IRE1 arm). All
  accessions follow their gene reviews (worm ire-1 Q09499, xbp-1 G5EE07,
  pek-1 Q19192, eif-2alpha Q9BKU3, atf-4 Q22156, atf-6 Q20435, hsp-4 P20163,
  hsp-3 P27420; human ERN1 O75460, XBP1 P17861, EIF2AK3 Q9NZJ5, ATF4 P18848,
  ATF6 P18850, HSPA5 P11021; yeast IRE1 P32361, HAC1 P41546). PANTHER family
  ids are those that UniProt assigns to every listed representative; PERK
  sits in the broad eIF2alpha kinase family PTHR11042 (which also contains
  GCN2, HRI and PKR), so that family term is wider than the role; UniProt
  places worm PEK-1 and human PERK in different subfamilies (SF91, SF166).
  BiP is
  grounded on the BiP subfamily PTHR19375:SF380 of the HSP70 family.

  Transcription factor terms. The XBP1 and ATF6 annotons use DNA-binding
  transcription activator activity (GO:0001228) as chosen by the human XBP1
  and ATF6 reviews; the worm xbp-1 and atf-6 reviews use the parent term
  GO:0000981, and the yeast HAC1 review also uses GO:0000981. Human XBP1
  acts as the spliced isoform XBP1s (P17861-2 in GO-CAM
  gomodel:689e7a5d00000567).

  eIF2alpha. eIF2alpha (worm EIF-2alpha, Q9BKU3) is modeled as a
  participant of the PERK arm, following its gene review, which places it in
  the PERK-mediated UPR on the grounds that phosphorylated eIF2alpha does the
  attenuation work: it converts eIF2 into an inhibitor of its own recycling
  by eIF2B. The function term is its ordinary translation initiation factor
  activity (GO:0003743), negatively regulated by PERK. GO has no
  molecular-function term for the inhibitory activity of phosphorylated eIF2
  toward eIF2B, so the annoton records the participant correctly but not the
  attenuating activity itself; this tension is noted on the annoton and is
  an ontology question, not a knowledge gap. Human EIF2S1 has no gene review
  and is not listed.

  Integrated stress response. GCN2 is a second eIF2alpha kinase activated
  by amino-acid limitation and, in worms, by mitochondrial stress
  (PMID:22719267, PMID:23692540), not by ER stress. It belongs with the
  integrated stress response, of which the PERK branch is the ER-specific
  input. ATF4 is included as the output of the PERK branch; in mammals PERK
  dependence of ATF4 translation is shown (PMID:11106749), but in C.
  elegans the dependence of ATF-4 induction on PEK-1 itself has not been
  tested (see knowledge_gaps). Its process term is integrated stress
  response signaling, following the atf-4 review.

  Left out. Site-1 and Site-2 proteases that process ATF6 in mammals
  (PMID:11163209) are activation machinery and are not modeled as parts (C.
  elegans has no clear S1P homolog, PMID:16184190). The C. elegans ABU/PQN
  "activated in blocked UPR" genes (PMID:12186849) are a compensatory
  response in xbp-1 mutants. The neuronal signal for cell-non-autonomous
  UPR-ER activation in worms (small clear vesicle release, PMID:23791175) is
  inter-tissue regulation and not modeled as a part. ERAD and ER-phagy are
  downstream proteostasis outputs.

  Related modules. The mitochondrial UPR is MODULE:mitochondrial_upr and the
  HSF1 cytosolic heat shock response is MODULE:heat_shock_response.

  GO-CAM. C. elegans model gomodel:5b528b1100000489 links IRE-1 RNA
  endonuclease activity to XBP-1 in intestine and neurons. Human models
  gomodel:689e7a5d00000567 (IRE1, BiP sequestering, XBP1s),
  gomodel:66b5638000000624 (PERK and ATF4) and gomodel:66b5638000000739
  (BiP inhibition of PERK) are linked on the matching annotons.
module:
  id: er_unfolded_protein_response
  label: ER unfolded protein response
  module_type: SIGNALING_PATHWAY
  description: >-
    Three ER-membrane stress transducers (IRE1, PERK, ATF6) and the ER HSP70
    BiP that restrains them and is induced by them; the IRE1 arm is the
    ancestral eukaryotic core.
  concepts:
    - preferred_term: endoplasmic reticulum unfolded protein response
      term:
        id: GO:0030968
        label: endoplasmic reticulum unfolded protein response
  context:
    taxa:
      - preferred_term: Metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
    conditions:
      - preferred_term: >-
          ER protein-folding stress (tunicamycin, DTT, thapsigargin; also
          physiological secretory load, elevated temperature and immune
          activation)
  parts:
    - order: 1
      role: IRE1 splicing arm with a spliced-mRNA bZIP output
      node:
        id: ire1_xbp1_arm
        label: IRE1 unconventional mRNA splicing and XBP1/HAC1 transcription
        module_type: SIGNALING_PATHWAY
        description: >-
          Under ER stress IRE1 oligomerizes and trans-autophosphorylates, and
          its cytosolic endoribonuclease removes a small intron from the mRNA
          of its bZIP target (XBP1 in animals, HAC1 in budding yeast). The
          spliced mRNA encodes the active transcription factor, which binds
          UPR-element promoters, including the BiP locus, and drives most
          inducible UPR genes.
        concepts:
          - preferred_term: IRE1-mediated unfolded protein response
            term:
              id: GO:0036498
              label: IRE1-mediated unfolded protein response
        annotons:
          - id: ire1_kinase
            label: IRE1 trans-autophosphorylation kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IRE1 kinase-endoribonucleases
                term:
                  id: PANTHER:PTHR13954
                  label: IRE1-RELATED
                representative_members:
                  - preferred_term: IRE-1 (worm)
                    term:
                      id: UniProtKB:Q09499
                      label: Serine/threonine-protein kinase/endoribonuclease ire-1
                  - preferred_term: ERN1/IRE1alpha (human)
                    term:
                      id: UniProtKB:O75460
                      label: Serine/threonine-protein kinase/endoribonuclease IRE1
                  - preferred_term: Ire1 (budding yeast)
                    term:
                      id: UniProtKB:P32361
                      label: Serine/threonine-protein kinase/endoribonuclease IRE1
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              description: >-
                Trans-autophosphorylation within IRE1 oligomers that licenses
                the RNase; a core function in the worm, human and yeast
                reviews.
              targets:
                - preferred_term: IRE1 activation loop (autophosphorylation)
            processes:
              - preferred_term: IRE1-mediated unfolded protein response
                term:
                  id: GO:0036498
                  label: IRE1-mediated unfolded protein response
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Kinase activity of the ER stress sensor; activates its own RNase.
            evidence:
              - source_id: PMID:21317875
                title: Structure of the Ire1 autophosphorylation complex and implications for the unfolded protein response.
                statement: IRE1 XBP1-splicing RNase activity depends on autophosphorylation.
                supporting_text: >-
                  We show that the Xbp1-specific ribonuclease activity depends
                  on autophosphorylation
              - source_id: PMID:9323131
                title: The transmembrane kinase Ire1p is a site-specific endonuclease that initiates mRNA splicing in the unfolded protein response.
                statement: Yeast Ire1 is a bifunctional kinase and site-specific endoribonuclease.
                supporting_text: >-
                  We show that Ire1p is a bifunctional enzyme: in addition to
                  being a kinase, it is a site-specific endoribonuclease that
                  cleaves HAC1 mRNA specifically at both splice junctions.
          - id: ire1_endoribonuclease
            label: IRE1 XBP1/HAC1 mRNA endoribonuclease
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IRE1 kinase-endoribonucleases
                term:
                  id: PANTHER:PTHR13954
                  label: IRE1-RELATED
                representative_members:
                  - preferred_term: IRE-1 (worm)
                    term:
                      id: UniProtKB:Q09499
                      label: Serine/threonine-protein kinase/endoribonuclease ire-1
                  - preferred_term: ERN1/IRE1alpha (human)
                    term:
                      id: UniProtKB:O75460
                      label: Serine/threonine-protein kinase/endoribonuclease IRE1
                  - preferred_term: Ire1 (budding yeast)
                    term:
                      id: UniProtKB:P32361
                      label: Serine/threonine-protein kinase/endoribonuclease IRE1
                ancestral_nodes:
                  - preferred_term: PAINT IRE1 node PTN000359335
                    term:
                      id: PANTHER:PTN000359335
                      label: PTN000359335
                    description: >-
                      Eukaryotic IRE1 node in PTHR13954 carrying IBD support
                      for RNA endonuclease activity and IRE1-mediated
                      unfolded protein response (donors include Arabidopsis,
                      Candida, Drosophila, mouse and yeast genes). Worm
                      ire-1, human ERN1 and yeast IRE1 all carry it in GOA
                      WITH/FROM.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000359335 in PTHR13954.
            function:
              preferred_term: RNA endonuclease activity
              term:
                id: GO:0004521
                label: RNA endonuclease activity
              substrates:
                - preferred_term: unspliced XBP1 mRNA (animals) or HAC1 mRNA (yeast)
              products:
