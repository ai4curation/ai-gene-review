knowledge_gaps:
  - gap_statement: >-
      Whether ATF-4 induction during ER stress in C. elegans requires PEK-1,
      or can also be supplied by GCN-2, has not been tested.
    boundary: >-
      ER stress induces eIF2alpha phosphorylation in a PEK-1-dependent manner
      and induces the uORF-regulated atf-4 reporter, but the two have not been
      linked genetically in worms. In mammals PERK drives ATF4 translation.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Determines whether ATF-4 is a PEK-1-arm output or a shared ISR output in the worm UPR-ER.
    resolution: >-
      Measure Patf-4(uORF)::GFP and ATF-4 targets after tunicamycin in
      pek-1, gcn-2 and pek-1; gcn-2 mutants and in eIF2alpha S49A knock-in
      animals.
    provenance:
      - reference_id: PMID:35181679
        supporting_text: >-
          Compounds that induce ER stress and elicit the ISR, including
          tunicamycin (TM) or dithiothreitol (DTT), also strongly induced
          Patf-4(uORF)::GFP expression
  - gap_statement: >-
      The protease that processes C. elegans ATF-6 is unknown; worms have no
      identifiable Site-1 protease homolog, unlike mammals where S1P and S2P
      process ATF6.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: The activation mechanism of the ATF6 arm in nematodes is undefined.
    resolution: >-
      Detect ATF-6 cleavage products after ER stress and test candidate
      intramembrane proteases (the S2P homolog and others) for requirement.
    provenance:
      - reference_id: PMID:16184190
        supporting_text: >-
          Since C. elegans does not have an identifiable S1P homolog, S2P might
          be the only protease that cleaves ATF-6.
  - gap_statement: >-
      Whether HSP-4 and/or HSP-3 bind and restrain the luminal domains of
      worm IRE-1, PEK-1 and ATF-6, and whether the two paralogs divide this
      role, is not established.
