    - order: 3
      role: ATF6 membrane-anchored transcription factor arm
      node:
        id: atf6_arm
        label: ATF6 arm
        module_type: SIGNALING_PATHWAY
        description: >-
          ATF6 is a type II ER-membrane bZIP factor. In mammals ER stress
          moves it to the Golgi, where Site-1 and Site-2 proteases release
          its cytosolic bZIP domain, which enters the nucleus and induces
          chaperone genes, including BiP, and XBP1. In worms ATF-6 regulates
          few inducible but many constitutive UPR genes, binds promoters
          directly under ER stress, and controls ER calcium buffering through
          calreticulin.
