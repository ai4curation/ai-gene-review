      - BIOLOGY
    status: OPEN
    significance: >-
      The negative BiP-to-transducer connections are shown for mammalian BiP
      and are inferred for nematodes.
    resolution: >-
      Co-immunoprecipitation of tagged HSP-3 and HSP-4 with IRE-1, PEK-1 and
