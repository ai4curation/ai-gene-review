          the ER. Reduced ternary complex favours translation of ATF4, whose
          5' UTR uORFs make it a translational-control reporter; ATF4 then
          activates chaperone, amino-acid and cytoprotective genes. In worms
          PEK-1 is required for about a quarter of inducible UPR genes but not
          for constitutive UPR genes.
