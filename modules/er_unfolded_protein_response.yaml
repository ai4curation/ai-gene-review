              - source_id: PMID:11780124
                title: IRE1 couples endoplasmic reticulum load to secretory capacity by processing the XBP-1 mRNA.
                statement: Mutation of ire-1 or xbp-1 abolishes the worm UPR.
                supporting_text: >-
