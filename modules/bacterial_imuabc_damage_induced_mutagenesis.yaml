id: MODULE:bacterial_imuabc_damage_induced_mutagenesis
title: Bacterial ImuABC damage-induced mutagenesis
description: >-
  A reusable bacterial module for SOS-regulated, error-prone DNA synthesis by
  an ImuA-ImuB-DnaE2 cassette. RecA-dependent DNA-damage signaling and a
  LexA-family repressor provide a common but regulon-specific induction gate.
  ImuA and catalytically inactive ImuB organize access of the DnaE2 polymerase
  to stalled or damaged replication intermediates, where DnaE2 performs
  damage-tolerant, mutagenic DNA synthesis. Canonical nucleotide excision,
  homologous recombination, and constitutive chromosome replication are outside
  the module boundary.
status: DRAFT
evidence:
  - source_id: GO:0019985
    title: translesion synthesis
    statement: GO:0019985 provides the defining biological-process boundary; mutagenic output is condition-dependent.
  - source_id: PMID:15458417
    title: Widespread distribution of a lexA-regulated DNA damage-inducible multiple gene cassette in the Proteobacteria phylum.
    statement: The study identifies a conserved LexA-regulated, DNA-damage-inducible cassette containing imuA, imuB, and dnaE2-family genes.
  - source_id: PMID:15886391
    title: Experimental definition of the ImuA-ImuB-DnaE2 mutagenesis unit
    statement: >-
      Ortholog deletion genetics establishes all three cassette proteins as a
      cooperating damage-tolerance and mutagenesis system.
  - source_id: PMID:20615954
    title: Mechanistic dissection of ImuB adaptor and DnaE2 catalytic roles
    statement: >-
      ImuB binds ImuA, DnaE2, and the beta clamp but lacks polymerase catalytic
      residues; DnaE2 supplies the polymerase activity.
  - source_id: PMID:17331811
    title: Pseudomonas putida ImuB and DnaE2 mutation phenotypes
    statement: >-
      Species-specific experiments show antagonistic, condition-dependent
      effects of ImuB and DnaE2 on stationary-phase and UV mutagenesis.
  - source_id: PMID:28118378
    title: Pseudomonas ImuC and DinB alkylation-damage tolerance
    statement: P. putida ImuC/DnaE2 contributes to tolerance of methylating DNA damage.
  - source_id: PMID:37625357
    title: Pseudomonas ImuBC contribution to ciprofloxacin-resistance mutations
    statement: >-
      P. aeruginosa experiments provide close-relative evidence that ImuBC
      contributes to antibiotic-resistance mutation generation.
  - source_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
    title: PSEPK UniProt metadata table
    statement: PP_3116 through PP_3119 provide exact KT2440 exemplars for LexA2, ImuA, ImuB, and DnaE2; Q88ME4 provides the RecA signal exemplar.
notes: >-
  The three-part ImuA-ImuB-DnaE2 effector is the reusable core. RecA and LexA
  regulation are represented as optional upstream parts because cassette
  control and LexA paralog assignment vary among bacteria. In KT2440 the local
  cassette repressor is LexA2 rather than the principal LexA1 SOS repressor.
module:
  id: bacterial_imuabc_damage_induced_mutagenesis
  label: bacterial ImuABC damage-induced mutagenesis
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: translesion synthesis
      term:
        id: GO:0019985
        label: translesion synthesis
      description: Damage-tolerant DNA synthesis across blocking lesions, with condition-dependent mutagenic output.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: RecA-dependent DNA-damage signaling
      optional: true
      node:
        id: reca_damage_signal
        label: activated RecA damage signal
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: reca_damage_sensor
            label: RecA nucleoprotein damage sensor
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: ATP-dependent DNA damage sensor activity
                term:
                  id: GO:0140664
                  label: ATP-dependent DNA damage sensor activity
              family:
                preferred_term: bacterial RecA family
                term:
                  id: PANTHER:PTHR45900
                  label: RecA family
                representative_members:
                  - preferred_term: PSEPK RecA
                    term:
                      id: UniProtKB:Q88ME4
                      label: Protein RecA
                    description: Pseudomonas putida KT2440 recA/PP_1629.
            function:
              preferred_term: ATP-dependent DNA damage sensor activity
              term:
                id: GO:0140664
                label: ATP-dependent DNA damage sensor activity
              evidence:
                - source_id: file:PSEPK/recA/recA-ai-review.yaml
                  statement: The curated KT2440 RecA review identifies its activated ssDNA filament as the SOS damage sensor.
            processes:
              - preferred_term: SOS response
                term:
                  id: GO:0009432
                  label: SOS response
            role_description: Couples damage-generated single-stranded DNA to LexA-family repressor autocleavage.
    - order: 2
      role: LexA-family repression and damage-induced derepression
      optional: true
      node:
        id: lexa_cassette_gate
        label: LexA cassette regulatory gate
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: lexa_cassette_repressor
            label: cassette-specific LexA repressor
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: DNA-binding transcription repressor activity
                term:
                  id: GO:0001217
                  label: DNA-binding transcription repressor activity
              family:
                preferred_term: LexA repressor family
                term:
                  id: PANTHER:PTHR33516
                  label: LexA repressor family
                representative_members:
                  - preferred_term: PSEPK LexA2
                    term:
                      id: UniProtKB:P59479
                      label: LexA repressor 2
                    description: Pseudomonas putida KT2440 lexA2/PP_3116, the local imuA-imuB-dnaE2 cassette repressor.
            function:
              preferred_term: DNA-binding transcription repressor activity
              term:
                id: GO:0001217
                label: DNA-binding transcription repressor activity
              evidence:
                - source_id: file:PSEPK/lexA2/lexA2-ai-review.yaml
                  statement: The curated KT2440 review identifies LexA2 as the repressor of its local damage-inducible cassette.
            processes:
              - preferred_term: negative regulation of DNA-templated transcription
                term:
                  id: GO:0045892
                  label: negative regulation of DNA-templated transcription
            role_description: Represses cassette transcription until the DNA-damage signal triggers LexA-family autocleavage and derepression.
    - order: 3
      role: ImuA translesion-synthesis accessory function
      node:
        id: imua_accessory
        label: ImuA accessory step
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: imua_accessory_protein
            label: ImuA translesion-synthesis accessory protein
            participant:
              selector_type: FAMILY
              family:
                preferred_term: ImuA family
                term:
                  id: InterPro:IPR047610
                  label: Translesion DNA synthesis-associated protein ImuA
                representative_members:
                  - preferred_term: PSEPK ImuA
                    term:
                      id: UniProtKB:Q88I84
                      label: Translesion DNA synthesis-associated protein ImuA
                    description: Pseudomonas putida KT2440 PP_3117.
            processes:
              - preferred_term: translesion synthesis
                term:
                  id: GO:0019985
                  label: translesion synthesis
            evidence:
              - source_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
                statement: Q88I84 carries the ImuA-specific IPR047610 and PTHR35369:SF3 assignments.
            role_description: Accessory cassette component required for effective DnaE2-dependent damage-induced synthesis.
    - order: 4
      role: ImuB polymerase-recruitment scaffold
      node:
        id: imub_recruitment
        label: ImuB recruitment step
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: imub_accessory_protein
            label: ImuB translesion-synthesis accessory protein
            participant:
              selector_type: FAMILY
              family:
                preferred_term: ImuB/IMS family
                term:
                  id: Pfam:PF00817
                  label: ImpB/MucB/SamB family
                representative_members:
                  - preferred_term: PSEPK ImuB
                    term:
                      id: UniProtKB:Q88I83
                      label: ImuB
                    description: Pseudomonas putida KT2440 imuB/PP_3118.
            processes:
              - preferred_term: translesion synthesis
                term:
                  id: GO:0019985
                  label: translesion synthesis
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
            evidence:
              - source_id: file:PSEPK/imuB/imuB-uniprot.txt
                statement: Q88I83 carries the IMS/PF00817 and UmuC-fold assignments but is not annotated as the cassette polymerase.
              - source_id: PMID:20615954
                statement: Ortholog ImuB binds ImuA, DnaE2, and the beta clamp and lacks polymerase active-site residues.
            role_description: Catalytically inactive polymerase-like adaptor that recruits DnaE2 and replication-clamp machinery to damaged DNA.
    - order: 5
      role: DnaE2-dependent mutagenic DNA synthesis
      node:
        id: dnae2_mutagenic_synthesis
        label: DnaE2 error-prone DNA synthesis
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: dnae2_polymerase
            label: DnaE2 error-prone DNA polymerase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: DNA-directed DNA polymerase activity
                term:
                  id: GO:0003887
                  label: DNA-directed DNA polymerase activity
              family:
                preferred_term: DnaE2 family
                term:
                  id: InterPro:IPR023073
                  label: Error-prone DNA polymerase DnaE2
                representative_members:
                  - preferred_term: PSEPK DnaE2
                    term:
                      id: UniProtKB:Q88I82
                      label: Error-prone DNA polymerase
                    description: Pseudomonas putida KT2440 dnaE2/PP_3119.
            function:
              preferred_term: DNA-directed DNA polymerase activity
              term:
                id: GO:0003887
                label: DNA-directed DNA polymerase activity
              substrates:
                - preferred_term: damaged or lesion-containing DNA primer-template
                - preferred_term: deoxyribonucleoside triphosphates
              products:
                - preferred_term: extended DNA containing damage-bypass synthesis
              evidence:
                - source_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
                  statement: Reviewed HAMAP MF_01902 identifies Q88I82 as an error-prone DNA polymerase involved in damage-induced mutagenesis.
                - source_id: PMID:28118378
                  statement: P. putida ImuC/DnaE2 contributes to methylation-damage tolerance.
            processes:
              - preferred_term: translesion synthesis
                term:
                  id: GO:0019985
                  label: translesion synthesis
            role_description: Performs damage-tolerant DNA synthesis after ImuA/ImuB-dependent recruitment; mutational output is context dependent.
  connections:
    - source: reca_damage_signal
      target: lexa_cassette_gate
      connection_type: POSITIVELY_REGULATES
      description: Activated RecA promotes LexA-family autocleavage; application to KT2440 LexA2 is a family-level inference rather than a direct cleavage result.
    - source: lexa_cassette_gate
      target: imua_accessory
      connection_type: NEGATIVELY_REGULATES
      description: Intact cassette-associated LexA represses transcription of the ImuABC effector genes.
    - source: imua_accessory
      target: imub_recruitment
      connection_type: PROVIDES_INPUT_FOR
      description: ImuA engages the ImuB-centered adaptor before DnaE2 recruitment.
    - source: imub_recruitment
      target: dnae2_mutagenic_synthesis
      connection_type: PROVIDES_INPUT_FOR
      description: ImuB recruits or organizes DnaE2 at the damaged replication intermediate.
