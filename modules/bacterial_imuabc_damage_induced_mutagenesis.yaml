id: MODULE:bacterial_imuabc_damage_induced_mutagenesis
title: Bacterial ImuABC damage-induced mutagenesis
description: >-
  A reusable bacterial module for SOS-regulated, damage-tolerant DNA synthesis by
  an ImuA-ImuB-DnaE2 cassette, also called ImuABC because the polymerase is
  named ImuC in Pseudomonas and DnaE2 elsewhere. The cassette is the
  non-orthologous replacement of the enterobacterial umuDC (DNA polymerase V)
  system. RecA-dependent DNA-damage
  signalling and a LexA-family repressor provide a common but regulon-specific
  induction gate. An accessory protein of the ImuA type and the catalytically
  inactive, UmuC-fold ImuB organize access of the DnaE2 polymerase to stalled or
  damaged replication intermediates, ImuB tethering the complex to the
  replication clamp; DnaE2 then performs the nucleotide-insertion step across the
  lesion. The synthesis is damage-tolerant and usually mutagenic, which is why
  the cassette drives induced mutagenesis and, in pathogens, the emergence of
  antibiotic resistance. Canonical nucleotide excision repair, homologous
  recombination, and constitutive chromosome replication are outside the module
  boundary.
status: COMPLETE
scope: ABSTRACT
evidence:
  - source_id: GO:0019985
    title: translesion synthesis
    statement: >-
      GO:0019985 provides the defining biological-process boundary. The parent
      term rather than its mutagenic child GO:0042276 is used module-wide
      because the mutational output is condition-dependent in at least one
      exemplar; see notes.
    supporting_text: >-
      The replication of damaged DNA by synthesis across a lesion in the template
      strand; a specialized DNA polymerase or replication complex inserts a
      defined nucleotide across from the lesion which allows DNA synthesis to
      continue beyond the lesion.
  - source_id: PMID:15458417
    title: Widespread distribution of a lexA-regulated DNA damage-inducible multiple gene cassette in the Proteobacteria phylum.
    statement: >-
      The cassette is a conserved, LexA-regulated, DNA-damage-inducible unit
      found across many Proteobacteria families, with its own encoded LexA as the
      local repressor.
    supporting_text: >-
      these genes constitute a DNA damage-inducible operon that is regulated by
      its own encoded LexA protein
  - source_id: PMID:15886391
    title: An SOS-regulated operon involved in damage-inducible mutagenesis in Caulobacter crescentus.
    statement: >-
      Deletion genetics in Caulobacter crescentus establish all three cassette
      proteins as one cooperating damage-tolerance and mutagenesis system,
      induced by damage in a recA-dependent manner.
    supporting_text: >-
      The results show that the dnaE2 operon is upregulated in response to DNA
      damage in a recA-dependent manner, and demonstrate that all three genes
      that compose this expression unit are involved in UV and mitomycin
      C-induced mutagenesis.
  - source_id: PMID:15886391
    title: An SOS-regulated operon involved in damage-inducible mutagenesis in Caulobacter crescentus.
    statement: >-
      imuB and dnaE2 always co-occur across bacterial genomes even when the
      operon structure differs, which is what makes the effector a reusable
      module rather than a lineage-specific operon.
    supporting_text: >-
      It is very interesting to note that, independently of being organized as
      single transcriptional units or as independent genes, imuB and dnaE2 always
      co-exist in bacterial genomes, strongly suggesting that their activities are
      interconnected.
  - source_id: PMID:20615954
    title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent mutagenesis in Mycobacterium tuberculosis.
    statement: >-
      In Mycobacterium tuberculosis the two accessory factors are individually
      essential for induced mutagenesis and damage tolerance; ImuB binds ImuA',
      DnaE2 and the beta clamp but lacks the polymerase catalytic residues, while
      DnaE2 supplies the catalytic step.
    supporting_text: >-
      Here, we confirm that Rv3395c (designated imuA ′) and Rv3394c ( imuB ) are
      individually essential for induced mutagenesis and damage tolerance.
  - source_id: PMID:20615954
    title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent mutagenesis in Mycobacterium tuberculosis.
    statement: >-
      The cassette is the non-orthologous replacement of the umuDC system, so a
      genome carrying it typically has no DNA polymerase V; this is the module's
      relationship to the enterobacterial mutasome.
    supporting_text: >-
      Therefore, although broadly consistent with the identification of the imuA
      ′- imuB-dnaE2 cassette as the nonorthologous replacement of the umuDC system
      ( 5 ), our data reveal a “mutasome” comprising distinct components
  - source_id: PMID:17331811
    title: Study of involvement of ImuB and DnaE2 in stationary-phase mutagenesis in Pseudomonas putida.
    statement: >-
      Pseudomonas putida is the documented exception to uniformly mutagenic
      output: ImuB and DnaE2 have antagonistic effects, and DnaE2 suppresses
      stationary-phase base substitutions.
    supporting_text: >-
      it acted as an anti-mutator in accumulation of base substitution
  - source_id: PMID:28118378
    title: DNA Polymerases ImuC and DinB Are Involved in DNA Alkylation Damage Tolerance in Pseudomonas aeruginosa and Pseudomonas putida.
    statement: >-
      Pseudomonas ImuC/DnaE2 contributes to tolerance of methylating DNA damage,
      extending the damage types the cassette handles beyond UV and mitomycin C.
    supporting_text: >-
      polymerases ImuC and DinB ensured a protective role against N- and
      O-methylation
  - source_id: PMID:37625357
    title: DinB (DNA polymerase IV), ImuBC and RpoS contribute to the generation of ciprofloxacin-resistance mutations in Pseudomonas aeruginosa.
    statement: >-
      In Pseudomonas aeruginosa the cassette contributes to the generation of
      antibiotic-resistance mutations, the clinically relevant output of the
      module.
    supporting_text: >-
      are also involved in generating CipR mutations in this organism, since the
      yields of CipR mutations were substantially decreased in imuB- or
      imuC-defective cells compared to wild-type
  - source_id: PMID:12705867
    title: DnaE2 polymerase contributes to in vivo survival and the emergence of drug resistance in Mycobacterium tuberculosis.
    statement: >-
      In M. tuberculosis the DnaE2-dependent output drives survival after damage,
      virulence and the emergence of drug resistance in vivo.
    supporting_text: >-
      and can contribute directly to the emergence of drug resistance in vivo
  - source_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
    title: PSEPK UniProt metadata table
    statement: >-
      PP_3116 through PP_3119 provide exact KT2440 exemplars for LexA2, ImuA,
      ImuB and DnaE2; Q88ME4 provides the RecA signal exemplar.
    supporting_text: PP_3119
notes: >-
  Scope. The three-part ImuA-ImuB-DnaE2 effector is the reusable core and the
  module is deliberately species-neutral (scope ABSTRACT, context Bacteria). The
  generalization is not an inference from sequence conservation: the cassette is
  characterized experimentally in three distant lineages, with deletion genetics
  in the alphaproteobacterium Caulobacter crescentus (PMID:15886391), deletion,
  complementation, two-hybrid and clamp-motif-allele work in the actinobacterium
  Mycobacterium tuberculosis (PMID:20615954), and mutagenesis and
  damage-tolerance genetics in the gammaproteobacteria Pseudomonas putida and
  P. aeruginosa (PMID:17331811, PMID:28118378, PMID:37625357). KT2440 is retained
  as one exemplar among three rather than as the subject of the module.

  Accessory step as a variant set. The ImuA role is the one part of the cassette
  that is not a single protein family. Proteobacteria use ImuA; actinobacteria
  have no ImuA homolog at all and use ImuA' (M. tuberculosis Rv3395c), a protein
  with a RecA-like fold that is restricted largely to actinomycetes. This is a
  non-orthologous replacement, so it is modelled as a REALIZER variant set
  (alternative carriers of one required accessory role) rather than as one family
  descriptor. Even within the proteobacterial variant the grounding is split
  across two InterPro families: P. putida ImuA carries IPR047610 and
  PANTHER PTHR35369:SF3, while Caulobacter ImuA carries IPR017026 and has no
  PANTHER assignment, so no PANTHER id is asserted for that variant.

  No molecular function is asserted for either accessory protein. This is
  deliberate: no catalytic, DNA-binding or adaptor activity has been demonstrated
  for any ImuA or ImuA' protein. Both gene reviews record this as a knowledge gap
  with dark_aspect MF_DARK, and the module would otherwise have to invent a
  function to fill the slot. Only the ImuB adaptor activity and the DnaE2
  polymerase activity are asserted.

  Process term. GO:0019985 translesion synthesis is used throughout rather than
  its mutagenic child GO:0042276, because the output is condition-dependent in
  P. putida, where DnaE2 acts as an anti-mutator for stationary-phase base
  substitutions while ImuB promotes mutation (PMID:17331811). The Caulobacter and
  M. tuberculosis gene reviews do use GO:0042276, where induced mutagenesis is
  demonstrated for the whole cassette; the module stays at the parent so that no
  step disagrees with the review of any of its exemplars.

  Family reviews. All four PANTHER families reached by the module's participants
  now have reviews: PTHR45900 (RecA), PTHR33516 (LexA), PTHR35369 (SulA plus
  ImuA/ImuB) and PTHR32294 (DnaE/DnaE2/PolC). Two are too broad to be used as
  module descriptors and are recorded for the subfamily split only. PTHR35369 is
  the clearest case: its PAINT node for DNA repair sits at the family root and so
  reaches the SulA cell-division inhibitors, which is why the module grounds ImuB
  on the Pfam IMS domain and the subfamily PTHR35369:SF2 rather than on the
  family. PTHR45900's review reports two root-placed PAINT assertions that
  over-reach, one of them directly relevant here: GO:0009355 DNA polymerase V
  complex propagates to mycobacterial RecA, whose lineage replaced umuDC with
  this very cassette.

  Regulatory parts. RecA and LexA are optional because cassette control and LexA
  paralog assignment vary among bacteria. In KT2440 the local cassette repressor
  is LexA2 rather than the principal LexA1 SOS repressor; the PTHR33516 review
  leaves the family-level SOS response claim UNRESOLVED for exactly this reason.
  The module does not assert that any particular LexA paralog gates the cassette
  in an arbitrary genome, and the connection from the RecA signal to the LexA
  gate is a family-level inference rather than a measured cleavage result for any
  one paralog.
module:
  id: bacterial_imuabc_damage_induced_mutagenesis
  label: bacterial ImuABC damage-induced mutagenesis
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: translesion synthesis
      term:
        id: GO:0019985
        label: translesion synthesis
      description: >-
        Damage-tolerant DNA synthesis across blocking lesions, with
        condition-dependent mutagenic output.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          Experimentally characterized in Alphaproteobacteria (Caulobacter),
          Gammaproteobacteria (Pseudomonas) and Actinomycetota
          (Mycobacterium); imuB and dnaE2 co-occur much more widely.
  parts:
    - order: 1
      role: RecA-dependent DNA-damage signaling
      optional: true
      node:
        id: reca_damage_signal
        label: activated RecA damage signal
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: reca_damage_sensor
            label: RecA nucleoprotein damage sensor
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: ATP-dependent DNA damage sensor activity
                term:
                  id: GO:0140664
                  label: ATP-dependent DNA damage sensor activity
              family:
                preferred_term: bacterial RecA family
                term:
                  id: PANTHER:PTHR45900
                  label: RECA
                representative_members:
                  - preferred_term: recA (PSEPK)
                    term:
                      id: UniProtKB:Q88ME4
                      label: Protein RecA
                    description: Pseudomonas putida KT2440 recA/PP_1629.
            function:
              preferred_term: ATP-dependent DNA damage sensor activity
              term:
                id: GO:0140664
                label: ATP-dependent DNA damage sensor activity
              evidence:
                - source_id: file:PSEPK/recA/recA-ai-review.yaml
                  statement: >-
                    The curated KT2440 RecA review identifies the activated
                    ssDNA filament as the SOS damage sensor and accepts this
                    activity as a core function.
                  supporting_text: >-
                    SOS co-protease activity - the activated RecA filament
                    (RecA*) acts as an ATP-dependent DNA-damage sensor that
                    stimulates autocatalytic cleavage of the LexA repressor,
                    inducing the SOS response.
                - source_id: file:PSEPK/recA/recA-uniprot.txt
                  statement: >-
                    The curated HAMAP function statement records the
                    LexA-activating step the sensing activity performs.
                  supporting_text: 'CC       DNAs. It interacts with LexA causing its activation and leading to its'
                - source_id: file:interpro/panther/PTHR45900/PTHR45900-review.yaml
                  statement: >-
                    The family review scopes this activity as FAMILY_WIDE, while
                    noting that the downstream repressor-cleavage consequence
                    requires a LexA-family repressor to act on.
                  supporting_text: >-
                    Forming the activated, ATP- and ssDNA-bound filament is how a
                    RecA protein registers damage
            processes:
              - preferred_term: SOS response
                term:
                  id: GO:0009432
                  label: SOS response
            role_description: >-
              Couples damage-generated single-stranded DNA to LexA-family
              repressor autocleavage.
    - order: 2
      role: LexA-family repression and damage-induced derepression
      optional: true
      node:
        id: lexa_cassette_gate
        label: LexA cassette regulatory gate
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: lexa_cassette_repressor
            label: cassette-specific LexA repressor
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: DNA-binding transcription repressor activity
                term:
                  id: GO:0001217
                  label: DNA-binding transcription repressor activity
              family:
                preferred_term: LexA repressor family
                term:
                  id: PANTHER:PTHR33516
                  label: LEXA REPRESSOR
                representative_members:
                  - preferred_term: lexA2 (PSEPK)
                    term:
                      id: UniProtKB:P59479
                      label: LexA repressor 2
                    description: >-
                      Pseudomonas putida KT2440 lexA2/PP_3116, the local
                      imuA-imuB-dnaE2 cassette repressor rather than the
                      principal LexA1 SOS repressor.
            function:
              preferred_term: DNA-binding transcription repressor activity
              term:
                id: GO:0001217
                label: DNA-binding transcription repressor activity
              evidence:
                - source_id: file:PSEPK/lexA2/lexA2-ai-review.yaml
                  statement: >-
                    The curated KT2440 review identifies LexA2 as the repressor
                    of its local damage-inducible cassette and accepts this
                    activity as its core function.
                  supporting_text: >-
                    LexA2 binds cis-regulatory DNA and represses transcription of
                    its DNA-damage-inducible cassette/prophage-associated
                    regulon.
                - source_id: file:PSEPK/lexA2/lexA2-uniprot.txt
                  statement: >-
                    The curated LexA rule records the repression and the
                    RecA-triggered autocleavage that relieves it.
                  supporting_text: 'CC   -!- FUNCTION: Represses a number of genes involved in the response to DNA'
                - source_id: file:interpro/panther/PTHR33516/PTHR33516-review.yaml
                  statement: >-
                    The family review scopes repressor activity as FAMILY_WIDE
                    but leaves the SOS response claim unresolved, because which
                    genes a member represses varies between principal LexA
                    proteins and narrow-regulon paralogs.
                  supporting_text: >-
                    Whether a given family member belongs to the SOS response
                    depends on what it represses, not on what it is.
            processes:
              - preferred_term: negative regulation of DNA-templated transcription
                term:
                  id: GO:0045892
                  label: negative regulation of DNA-templated transcription
            role_description: >-
              Represses cassette transcription until the DNA-damage signal
              triggers LexA-family autocleavage and derepression.
    - order: 3
      role: ImuA-type accessory function
      node:
        id: imua_accessory
        label: accessory step of the mutagenesis cassette
        module_type: BIOLOGICAL_PROCESS
        description: >-
          A required accessory protein that acts with ImuB, supplied by
          different, non-homologous families in different lineages. No molecular
          function is asserted for either carrier: none has been demonstrated.
        variant_sets:
          - id: imua_accessory_carrier
            label: ImuA versus ImuA'
            axis: lineage-specific accessory protein family
            variant_kind: REALIZER
            selection: EXACTLY_ONE
            notes: >-
              A REALIZER set: the two variants are alternative carriers of one
              accessory role, not alternative routes to the outcome. They are not
              homologs, which is why the role cannot be grounded on a single
              family descriptor.
            evidence:
              - source_id: PMID:15886391
                statement: >-
                  ImuA homologs are absent from Actinomycetales, where genomic
                  context points to a RecA-like protein instead.
                supporting_text: >-
                  Although proteins with significant similarity to ImuA cannot be
                  found in Actinomycetales, the genomic context analysis suggests
                  that the RecA-like protein encoded by M.tuberculosis Rv3395 may
                  represent a functional counterpart of ImuA in these organisms.
              - source_id: PMID:20615954
                statement: >-
                  The actinobacterial carrier is a protein of unknown function
                  restricted largely to actinomycetes, designated ImuA'.
                supporting_text: >-
                  which encodes a protein of unknown function restricted
                  primarily to actinomycetes
            variants:
              - id: imua_proteobacterial
                label: proteobacterial ImuA
                module_type: BIOLOGICAL_PROCESS
                annotons:
                  - id: imua_accessory_protein
                    label: ImuA translesion-synthesis accessory protein
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: ImuA accessory proteins of the imuA-imuB-dnaE2 cassette
                        description: >-
                          Split across two InterPro families that do not
                          correspond to one PANTHER subfamily, so no PANTHER id
                          is asserted: Pseudomonas ImuA carries IPR047610 and
                          PANTHER PTHR35369:SF3, Caulobacter ImuA carries
                          IPR017026 and has no PANTHER assignment.
                        family_terms:
                          - id: InterPro:IPR047610
                            label: Translesion DNA synthesis-associated protein ImuA
                          - id: InterPro:IPR017026
                            label: Inducible mutagenesis protein A
                        representative_members:
                          - preferred_term: imuA (CAUVC)
                            term:
                              id: UniProtKB:Q9A3J1
                              label: Protein ImuA
                            description: >-
                              Caulobacter crescentus CB15 imuA/CC_3213; deletion
                              abolishes mitomycin C-induced mutagenesis and
                              sensitizes cells to UV and mitomycin C.
                          - preferred_term: PP_3117 (PSEPK)
                            term:
                              id: UniProtKB:Q88I84
                              label: Translesion DNA synthesis-associated protein ImuA
                            description: Pseudomonas putida KT2440 PP_3117.
                    processes:
                      - preferred_term: translesion synthesis
                        term:
                          id: GO:0019985
                          label: translesion synthesis
                    evidence:
                      - source_id: PMID:15886391
                        statement: >-
                          Deletion of the Caulobacter imuA ortholog establishes a
                          requirement in damage tolerance, complemented by the
                          wild-type allele.
                        supporting_text: >-
                          The genes imuA and imuB encode previously
                          uncharacterized proteins, which are shown here for the
                          first time to be involved in DNA damage tolerance.
                      - source_id: file:PSEPK/PP_3117/PP_3117-uniprot.txt
                        statement: >-
                          Q88I84 carries the ImuA-specific IPR047610 family and
                          the NCBIfam ImuA_translesion model.
                        supporting_text: 'DR   NCBIfam; NF033429; ImuA_translesion; 1.'
                    role_description: >-
                      Accessory cassette component required for effective
                      DnaE2-dependent damage-induced synthesis; no molecular
                      activity has been demonstrated for it.
                    notes: >-
                      Function deliberately unasserted. Both gene reviews record
                      an MF_DARK knowledge gap: the protein has a P-loop or
                      RecA-like fold but no tested DNA-binding, nucleotide or
                      adaptor activity.
              - id: imua_prime_actinobacterial
                label: actinobacterial ImuA'
                module_type: BIOLOGICAL_PROCESS
                annotons:
                  - id: imua_prime_accessory_protein
                    label: ImuA' translesion-synthesis accessory protein
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: actinobacterial ImuA' accessory proteins
                        description: >-
                          Largely actinomycete-restricted proteins with a
                          RecA-like fold lacking RecA's C-terminal domain and
                          nucleotide-binding motif; not homologs of
                          proteobacterial ImuA. InterPro describes them only as
                          two uncharacterized domains (IPR060348 N-terminal,
                          IPR059514 C-terminal), so no family id is asserted.
                        representative_members:
                          - preferred_term: Rv3395c (MYCTU)
                            term:
                              id: UniProtKB:P9WKZ9
                              label: Uncharacterized protein Rv3395c
                            description: >-
                              Mycobacterium tuberculosis H37Rv Rv3395c, named
                              ImuA'; individually essential for induced
                              mutagenesis and damage tolerance and binds ImuB
                              through the C-terminal regions of both proteins.
                    processes:
                      - preferred_term: translesion synthesis
                        term:
                          id: GO:0019985
                          label: translesion synthesis
                    evidence:
                      - source_id: PMID:20615954
                        statement: >-
                          Rv3395c is individually essential for induced
                          mutagenesis and damage tolerance.
                        supporting_text: >-
                          Here, we confirm that Rv3395c (designated imuA ′) and
                          Rv3394c ( imuB ) are individually essential for induced
                          mutagenesis and damage tolerance.
                      - source_id: PMID:20615954
                        statement: >-
                          ImuA' binds ImuB directly through the C-terminal
                          regions of both proteins and does not self-associate
                          like RecA.
                        supporting_text: >-
                          We observed the direct interaction of ImuA′ with ImuB
                          involving the C-terminal regions of both proteins;
                          however, no evidence of ImuA′ self-association was
                          detected that might indicate RecA-like filamentation (
                          40 ).
                    role_description: >-
                      Non-orthologous replacement of ImuA in actinobacteria:
                      required for cassette function and bound by ImuB, with no
                      demonstrated molecular activity.
                    notes: >-
                      Function deliberately unasserted, as for proteobacterial
                      ImuA. UniProt's only localization claim for this protein is
                      a predicted single-pass membrane anchor, which its gene
                      review flags as an over-annotation and records as a CC_DARK
                      gap; the module therefore asserts no location for the step.
    - order: 4
      role: ImuB polymerase-recruitment scaffold
      node:
        id: imub_recruitment
        label: ImuB recruitment step
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: imub_accessory_protein
            label: ImuB translesion-synthesis accessory protein
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: protein-macromolecule adaptor activity
                term:
                  id: GO:0030674
                  label: protein-macromolecule adaptor activity
              family:
                preferred_term: ImuB catalytically inactive UmuC-fold adaptors
                description: >-
                  UmuC/Y-family folds that have lost the catalytic carboxylates.
                  The Pfam IMS domain is the primary grounding; the PANTHER
                  subfamily is given as well, since the PTHR35369 family itself
                  also contains the SulA cell-division inhibitors.
                term:
                  id: Pfam:PF00817
                  label: ImpB/MucB/SamB family
                family_terms:
                  - id: PANTHER:PTHR35369:SF2
                    label: BLR3025 PROTEIN
                representative_members:
                  - preferred_term: imuB (CAUVC)
                    term:
                      id: UniProtKB:Q9A3J2
                      label: Protein ImuB
                    description: >-
                      Caulobacter crescentus CB15 imuB/CC_3212; epistatic with
                      dnaE2 and shares its UV mutational signature.
                  - preferred_term: Rv3394c (MYCTU)
                    term:
                      id: UniProtKB:O50419
                      label: UmuC domain-containing protein
                    description: >-
                      Mycobacterium tuberculosis H37Rv Rv3394c, named ImuB; binds
                      ImuA', DnaE1, DnaE2 and the beta clamp, and its
                      clamp-binding motif is required for cassette function.
                  - preferred_term: imuB (PSEPK)
                    term:
                      id: UniProtKB:Q88I83
                      label: ImuB
                    description: Pseudomonas putida KT2440 imuB/PP_3118.
            processes:
              - preferred_term: translesion synthesis
                term:
                  id: GO:0019985
                  label: translesion synthesis
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
              targets:
                - preferred_term: ImuA-type accessory protein
                - preferred_term: DnaE2 error-prone polymerase
                - preferred_term: DNA polymerase III beta sliding clamp
              evidence:
                - source_id: PMID:20615954
                  statement: >-
                    ImuB binds ImuA', DnaE2 and the beta clamp, and disrupting
                    the clamp-binding motif alone abolishes cassette function.
                  supporting_text: >-
                    Notably, disruption of this motif in the imuB AAAAGG allele
                    eliminated cassette function, strongly implying that
                    ImuB—through β—is required to mediate access of DnaE2 to the
                    replication fork.
                - source_id: PMID:20615954
                  statement: >-
                    ImuB proteins lack the active-site residues required for
                    polymerase activity, so the adaptor role is not a polymerase
                    role.
                  supporting_text: >-
                    Despite retaining structural features characteristic of
                    Y-family members, ImuB homologs lack conserved active-site
                    amino acids required for polymerase activity.
                - source_id: file:interpro/panther/PTHR35369/PTHR35369-review.yaml
                  statement: >-
                    The family review scopes the adaptor activity to SF2 only and
                    marks polymerase activity NOT_APPLICABLE for the whole
                    family.
                  supporting_text: >-
                    No member of this family is a DNA polymerase.
            role_description: >-
              Catalytically inactive polymerase-like adaptor that recruits DnaE2
              and tethers the complex to the replication clamp at damaged DNA.
    - order: 5
      role: DnaE2-dependent damage-tolerant DNA synthesis
      node:
        id: dnae2_mutagenic_synthesis
        label: DnaE2 lesion-bypass DNA synthesis
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: dnae2_polymerase
            label: DnaE2 error-prone DNA polymerase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: DNA-directed DNA polymerase activity
                term:
                  id: GO:0003887
                  label: DNA-directed DNA polymerase activity
              family:
                preferred_term: DnaE2 damage-inducible type-C polymerases
                description: >-
                  Second, non-essential copies of the DNA polymerase III alpha
                  subunit. The InterPro family is the primary grounding; the
                  PANTHER subfamily separates them from the replicative DnaE and
                  PolC subfamilies of PTHR32294.
                  No PAINT ancestral node is asserted for this role: the only IBD
                  node in PTHR32294 (PTN000793159, polymerase activity) is seeded
                  by E. coli DnaE rather than by any DnaE2, and it is adjudicated
                  in that family's review instead.
                term:
                  id: InterPro:IPR023073
                  label: DNA polymerase, error-prone
                family_terms:
                  - id: PANTHER:PTHR32294:SF4
                    label: ERROR-PRONE DNA POLYMERASE
                representative_members:
                  - preferred_term: dnaE2 (MYCTU)
                    term:
                      id: UniProtKB:P9WNT5
                      label: Error-prone DNA polymerase
                    description: >-
                      Mycobacterium tuberculosis H37Rv dnaE2/Rv3370c;
                      active-site substitution reproduces the deletion
                      phenotype, which is what identifies DnaE2 as the catalytic
                      component.
                  - preferred_term: dnaE2 (CAUVC)
                    term:
                      id: UniProtKB:Q9A3J3
                      label: Error-prone DNA polymerase
                    description: >-
                      Caulobacter crescentus CB15 dnaE2/CC_3211; deletion
                      abolishes mitomycin C-induced mutagenesis and changes the
                      UV mutational spectrum.
                  - preferred_term: dnaE2 (PSEPK)
                    term:
                      id: UniProtKB:Q88I82
                      label: Error-prone DNA polymerase
                    description: Pseudomonas putida KT2440 dnaE2/PP_3119.
            function:
              preferred_term: DNA-directed DNA polymerase activity
              term:
                id: GO:0003887
                label: DNA-directed DNA polymerase activity
              substrates:
                - preferred_term: damaged or lesion-containing DNA primer-template
                - preferred_term: deoxyribonucleoside triphosphates
              products:
                - preferred_term: extended DNA containing damage-bypass synthesis
              evidence:
                - source_id: PMID:20615954
                  statement: >-
                    Substituting the DnaE2 catalytic residues reproduces the
                    deletion phenotype, establishing that DnaE2 itself performs
                    the bypass synthesis.
                  supporting_text: >-
                    In contrast, replacement of DnaE2 catalytic residues
                    reproduces the dnaE2 gene deletion phenotype, strongly
                    implying a direct role for the α-subunit in mutagenic lesion
                    bypass.
                - source_id: file:PSEPK/dnaE2/dnaE2-uniprot.txt
                  statement: >-
                    Reviewed HAMAP MF_01902 identifies Q88I82 as an error-prone
                    DNA polymerase involved in damage-induced mutagenesis and
                    not the major replicative polymerase.
                  supporting_text: 'CC   -!- FUNCTION: DNA polymerase involved in damage-induced mutagenesis and'
                - source_id: file:interpro/panther/PTHR32294/PTHR32294-review.yaml
                  statement: >-
                    The family review scopes polymerase activity as FAMILY_WIDE
                    while restricting replication and proofreading to the
                    replicative subfamilies, which is the distinction this
                    annoton depends on.
                  supporting_text: >-
                    Templated nucleotidyl transfer is the defining chemistry of
                    the type-C fold
            processes:
              - preferred_term: translesion synthesis
                term:
                  id: GO:0019985
                  label: translesion synthesis
            role_description: >-
              Performs damage-tolerant DNA synthesis after ImuA/ImuB-dependent
              recruitment; the mutational output is usually but not invariably
              mutagenic.
  connections:
    - source: reca_damage_signal
      target: lexa_cassette_gate
      connection_type: POSITIVELY_REGULATES
      description: >-
        Activated RecA promotes LexA-family autocleavage. Applying this to a
        particular cassette repressor, such as KT2440 LexA2, is a family-level
        inference rather than a direct cleavage result for that paralog.
    - source: lexa_cassette_gate
      target: imua_accessory
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Intact cassette-associated LexA represses transcription of the
        ImuA-ImuB-DnaE2 effector genes; all three are induced together after
        damage.
    - source: imua_accessory
      target: imub_recruitment
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The accessory protein engages the ImuB-centered adaptor before DnaE2
        recruitment; in M. tuberculosis the ImuA'-ImuB interaction is direct and
        involves the C-terminal regions of both proteins.
    - source: imub_recruitment
      target: dnae2_mutagenic_synthesis
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        ImuB recruits DnaE2 and, through the beta clamp, mediates its access to
        the replication fork at the damaged template.
