id: MODULE:bacterial_imuabc_damage_induced_mutagenesis
title: Bacterial ImuABC damage-induced mutagenesis
description: >-
  A bacterial ImuA-type accessory protein, ImuB adaptor and DnaE2/ImuC polymerase cooperate in damage-tolerant
  DNA synthesis. This family-grounded realization spans experimentally characterized bacterial lineages
  without asserting that every bacterium carries the cassette. ImuB couples the accessory protein and
  polymerase to the replication clamp; DnaE2 supplies DNA synthesis. RecA signaling and LexA-family repression
  are optional, regulon-specific induction context. Mutational output depends on the organism, damage
  and growth state: induced mutagenesis and stationary-phase antimutator effects need not conflict. Nucleotide
  excision repair, homologous recombination and bulk chromosome replication are outside the module boundary,
  although translesion synthesis itself participates in the broader GO process DNA replication.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0019985
  title: translesion synthesis
  statement: >-
    GO:0019985 provides the defining biological-process boundary. The parent
    term rather than its mutagenic child GO:0042276 is used module-wide
    because the mutational output is condition-dependent in at least one
    exemplar; see notes.
  supporting_text: >-
    The replication of damaged DNA by synthesis across a lesion in the template
    strand; a specialized DNA polymerase or replication complex inserts a
    defined nucleotide across from the lesion which allows DNA synthesis to
    continue beyond the lesion.
- source_id: PMID:15458417
  title: Widespread distribution of a lexA-regulated DNA damage-inducible multiple gene cassette in
    the Proteobacteria phylum.
  statement: >-
    The cassette is a conserved, LexA-regulated, DNA-damage-inducible unit
    found across many Proteobacteria families, with its own encoded LexA as the
    local repressor.
  supporting_text: >-
    these genes constitute a DNA damage-inducible operon that is regulated by
    its own encoded LexA protein
- source_id: PMID:15886391
  title: An SOS-regulated operon involved in damage-inducible mutagenesis in Caulobacter crescentus.
  statement: >-
    Deletion genetics in Caulobacter crescentus establish all three cassette
    proteins as one cooperating damage-tolerance and mutagenesis system,
    induced by damage in a recA-dependent manner.
  supporting_text: >-
    The results show that the dnaE2 operon is upregulated in response to DNA
    damage in a recA-dependent manner, and demonstrate that all three genes
    that compose this expression unit are involved in UV and mitomycin
    C-induced mutagenesis.
- source_id: PMID:15886391
  title: An SOS-regulated operon involved in damage-inducible mutagenesis in Caulobacter crescentus.
  statement: >-
    In the genomes examined in this 2005 study, imuB and dnaE2 co-occurred despite variable operon organization.
    This historical survey supports coupling, not a universal present-day genome rule or demonstrated
    activity from co-occurrence alone.
  supporting_text: >-
    It is very interesting to note that, independently of being organized as
    single transcriptional units or as independent genes, imuB and dnaE2 always
    co-exist in bacterial genomes, strongly suggesting that their activities are
    interconnected.
- source_id: PMID:20615954
  title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent
    mutagenesis in Mycobacterium tuberculosis.
  statement: >-
    M. tuberculosis deletion genetics and interactions of its proteins, together with M. smegmatis functional
    dissection, establish an accessory-dependent DnaE2 system. The individual deletion, catalytic-site
    and clamp-function experiments must retain their assay-organism attribution.
  supporting_text: >-
    Here, we confirm that Rv3395c (designated imuA ′) and Rv3394c ( imuB ) are
    individually essential for induced mutagenesis and damage tolerance.
- source_id: PMID:20615954
  title: Essential roles for imuA'- and imuB-encoded accessory factors in DnaE2-dependent
    mutagenesis in Mycobacterium tuberculosis.
  statement: >-
    The ImuA-type accessory/ImuB/DnaE2 system is a mechanistically distinct alternative to UmuDC-mediated
    translesion synthesis. The functional replacement description alone does not establish mutual genomic
    exclusion; coexistence or absence requires genome-specific evidence.
  supporting_text: >-
    Therefore, although broadly consistent with the identification of the imuA
    ′- imuB-dnaE2 cassette as the nonorthologous replacement of the umuDC system
    ( 5 ), our data reveal a “mutasome” comprising distinct components
- source_id: PMID:17331811
  title: Study of involvement of ImuB and DnaE2 in stationary-phase mutagenesis in Pseudomonas
    putida.
  statement: >-
    Pseudomonas putida is the documented exception to uniformly mutagenic
    output: ImuB and DnaE2 have antagonistic effects, and DnaE2 suppresses
    stationary-phase base substitutions.
  supporting_text: >-
    it acted as an anti-mutator in accumulation of base substitution
- source_id: PMID:28118378
  title: DNA Polymerases ImuC and DinB Are Involved in DNA Alkylation Damage Tolerance in
    Pseudomonas aeruginosa and Pseudomonas putida.
  statement: >-
    Pseudomonas ImuC/DnaE2 contributes to alkylation-damage tolerance and induced mutagenesis. These outcomes
    differ from the stationary-phase base-substitution assay and prevent interpreting its antimutator
    result as a universal absence of mutagenic function.
  supporting_text: >-
    polymerases ImuC and DinB ensured a protective role against N- and
    O-methylation
- source_id: PMID:37625357
  title: DinB (DNA polymerase IV), ImuBC and RpoS contribute to the generation of
    ciprofloxacin-resistance mutations in Pseudomonas aeruginosa.
  statement: >-
    In Pseudomonas aeruginosa the cassette contributes to the generation of
    antibiotic-resistance mutations, the clinically relevant output of the
    module.
  supporting_text: >-
    are also involved in generating CipR mutations in this organism, since the
    yields of CipR mutations were substantially decreased in imuB- or
    imuC-defective cells compared to wild-type
- source_id: PMID:12705867
  title: DnaE2 polymerase contributes to in vivo survival and the emergence of drug resistance in
    Mycobacterium tuberculosis.
  statement: >-
    In M. tuberculosis the DnaE2-dependent output drives survival after damage,
    virulence and the emergence of drug resistance in vivo.
  supporting_text: >-
    and can contribute directly to the emergence of drug resistance in vivo
- source_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
  title: PSEPK UniProt metadata table
  statement: >-
    PP_3116 through PP_3119 provide exact KT2440 exemplars for LexA2, ImuA,
    ImuB and DnaE2; Q88ME4 provides the RecA signal exemplar.
  supporting_text: PP_3119
- source_id: PMID:21475246
  title: 'Breaking the rules: bacteria that use several DNA polymerase IIIs.'
  statement: >-
    Narrative review distinguishing bacterial C-family replicases from the damage-induced ImuC system.
    Polymerase fold does not identify which replication role a member performs.
  supporting_text: Yet another group of bacteria encode a second Pol III (ImuC)
- source_id: PMID:36288458
  title: Sending out an SOS - the bacterial DNA damage response.
  statement: >-
    Comparative SOS review documents lineage-specific regulons and alternative TLS systems, supporting
    optional RecA/LexA context and taxon-specific cassette assessment.
- source_id: PMID:38591662
  title: Myxococcus xanthus translesion DNA synthesis protein ImuA is an ATPase enhanced by DNA.
  statement: >-
    Purified Myxococcus ImuA has DNA-enhanced ATPase activity and DNA binding. These tested activities
    invalidate a universal no-activity statement, but do not establish the same activities in the existing
    Caulobacter, Pseudomonas or mycobacterial exemplars.
  supporting_text: ImuA is an ATPase, with ATPase activity enhanced in the presence of DNA.
- source_id: PMID:34190612
  title: ImuA Facilitates SOS Mutagenesis by Inhibiting RecA-Mediated Activity in Myxococcus
    xanthus.
  statement: >-
    Myxococcus ImuA interacts with RecA1 and suppresses its recombinase activity. The study did not detect
    ImuA DNA binding; the later positive assay must be interpreted with this negative result rather than
    erasing it.
- source_id: PMID:37530405
  title: Investigating the composition and recruitment of the mycobacterial ImuA'-ImuB-DnaE2
    mutasome.
  statement: >-
    M. smegmatis live-cell recruitment and biochemical evidence support an ImuB clamp-associated assembly
    role. Co-localization alone does not establish an active complete mutasome or native M. tuberculosis
    dynamics.
- source_id: PMID:39706264
  title: The RecA-NT homology motif in ImuB mediates the interaction with ImuA', which is essential
    for DNA damage-induced mutagenesis.
  statement: >-
    M. smegmatis ImuA′-ImuB structural and biochemical work refines accessory-complex assembly; organism-specific
    structure and functional tests do not establish universal ImuA-family ATPase chemistry.
- source_id: PMID:30916324
  title: New insights into the structures and interactions of bacterial Y-family DNA polymerases.
  statement: >-
    Computational comparative analysis distinguishes Y-family catalytic proteins from inactive ImuB and
    predicts interaction relationships. Predictions are not direct complex measurements.
- source_id: PMID:41728957
  title: Diversity and distribution of bacterial DNA polymerases.
  statement: >-
    Large comparative polymerase survey supports distinguishing DnaE2 from DnaE1/DnaE3/PolC and reports
    variable proofreading signatures. Predicted assemblies and genome co-occurrence do not prove complete
    cassette capacity.
notes: >-
  Scope. CONCRETE denotes this specific, family-grounded bacterial realization, not a single species.
  Bacteria is an envelope for a patchy distribution. Complete cassette function is supported in Caulobacter,
  pseudomonads and mycobacteria; individual Myxococcus accessory-protein assays provide additional mechanistic
  comparison. Co-occurrence, a polymerase fold or a predicted complex does not establish a complete active
  cassette in an arbitrary genome.


  Accessory proteins. ImuA and actinobacterial ImuA′ are modeled as distinct family realizers of one accessory
  role. Their divergent sequence classifications do not establish non-homology of every structural component.
  The earlier universal no-activity claim is contradicted by PMID:38591662: purified Myxococcus ImuA binds
  DNA and hydrolyzes ATP. This does not grant those activities to Caulobacter/Pseudomonas ImuA or mycobacterial
  ImuA′. The 2021 Myxococcus study did not detect DNA binding; the 2024 study discusses the assay dependence
  of that result. Its ImuB experiments used a truncated protein, and its proposed trimeric mutasome and
  ATP-dependent assembly cycle remain models.


  Assay organisms. PMID:20615954 combines M. tuberculosis deletion genetics and yeast two-hybrid assays
  of its proteins with M. smegmatis individual accessory deletion, catalytic and clamp-dependent functional
  tests. PMID:37530405 and PMID:39706264 add M. smegmatis imaging and purified-complex evidence. These
  cannot be relabeled as native M. tuberculosis dynamics or stoichiometry.


  Process scope. GO:0019985 translesion synthesis encompasses condition-dependent mutational output. P.
  putida DnaE2 suppresses stationary-phase base substitutions in PMID:17331811, while PMID:28118378 finds
  ImuC-dependent induced mutagenesis. Neither observation cancels the other. QuickGO is_a/part_of closure
  places translesion synthesis under GO:0006260 DNA replication; absence of a housekeeping replicase role
  does not make that broad process false.


  Capacity boundary. Effector-cassette checks assume compatible host clamp/replication machinery and active proteins. Optional regulatory nodes do not establish native expression, RecA/LexA-independent induction, or autonomous purified lesion bypass.

  Regulation. RecA and LexA are optional because induction and paralog assignment vary. KT2440 LexA2 regulates
  a local damage-response cassette; a narrower regulon alone does not exclude SOS participation. No universal
  cassette-specific LexA paralog or directly measured cleavage reaction is inferred from family membership.
