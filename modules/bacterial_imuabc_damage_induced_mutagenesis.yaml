                    proteins in yeast; mycobacterial genetics includes M. tuberculosis cassette deletions
                    and M. smegmatis individual accessory deletion. These are distinct evidence scopes.
            processes:
            - preferred_term: translesion synthesis
              term:
                id: GO:0019985
                label: translesion synthesis
            evidence:
            - source_id: PMID:20615954
              statement: >-
                The paper combines M. tuberculosis cassette genetics with M. smegmatis individual-deletion
                experiments. Its aggregate conclusion supports the ImuA′ accessory role without making
                every single-gene assay native to M. tuberculosis.
              supporting_text: >-
                Here, we confirm that Rv3395c (designated imuA ′) and
                Rv3394c ( imuB ) are individually essential for induced
