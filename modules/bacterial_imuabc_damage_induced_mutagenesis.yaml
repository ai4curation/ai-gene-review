  connections:
  - source: reca_damage_signal
    target: lexa_cassette_gate
    connection_type: POSITIVELY_REGULATES
    description: >-
      Activated RecA promotes LexA-family autocleavage. Applying this to a
      particular cassette repressor, such as KT2440 LexA2, is a family-level
      inference rather than a direct cleavage result for that paralog.
  - source: lexa_cassette_gate
    target: imua_accessory
    connection_type: NEGATIVELY_REGULATES
    description: >-
      Cassette-associated LexA can repress effector transcription in characterized regulons. Organization,
      paralog identity and induction timing vary by lineage; neither synchronous induction nor one operon
      is required by this module.
  - source: imua_accessory
    target: imub_recruitment
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      The accessory protein interacts with the ImuB-centered assembly. This functional dependency does
      not assert a universal temporal order of partner recruitment. M. tuberculosis proteins were tested
      by yeast two-hybrid, and M. smegmatis purified-complex evidence resolves a specific assembly interface.
  - source: imub_recruitment
    target: dnae2_mutagenic_synthesis
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      ImuB recruits DnaE2 and, through the beta clamp, mediates its access to
      the replication fork at the damaged template.
