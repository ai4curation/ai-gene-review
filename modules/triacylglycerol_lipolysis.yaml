id: MODULE:triacylglycerol_lipolysis
title: Intracellular triacylglycerol lipolysis (ABHD5-ATGL, HSL, MGLL)
description: Neutral (cytoplasmic) lipolysis is the stepwise hydrolysis of triacylglycerol stored in cytoplasmic lipid droplets
  to glycerol and three fatty acids. Adipose triglyceride lipase (ATGL/PNPLA2) catalyzes the first, rate-limiting step, hydrolyzing
  triacylglycerol to diacylglycerol on the lipid droplet surface; its activity is strongly stimulated by the non-catalytic
  co-activator ABHD5 (CGI-58). Hormone-sensitive lipase (HSL/LIPE) then hydrolyzes diacylglycerol to monoacylglycerol, and
  monoglyceride lipase (MGLL) completes the pathway by hydrolyzing monoacylglycerol to glycerol and a fatty acid. The pathway
  operates in adipocytes, where it supplies fatty acids to other tissues during fasting, and in most other cells including
  skeletal and cardiac muscle. Biallelic loss of ABHD5 causes neutral lipid storage disease with ichthyosis (Chanarin-Dorfman
  syndrome) and biallelic loss of PNPLA2 causes neutral lipid storage disease with myopathy; both show triacylglycerol accumulation
  in cytoplasmic droplets of many tissues.
status: DRAFT
evidence:
- source_id: GO:0019433
  title: triglyceride catabolic process
  statement: The module is grounded in triglyceride catabolic process (GO:0019433), the hydrolysis of triacylglycerol to glycerol
    and fatty acids.
- source_id: file:human/PNPLA2/PNPLA2-ai-review.yaml
  title: PNPLA2 gene review (human)
  statement: The ATGL step (UniProtKB:Q96AD5, GO:0004806 triacylglycerol lipase activity on lipid droplets) matches the completed
    human PNPLA2 review.
- source_id: file:human/ABHD5/ABHD5-ai-review.yaml
  title: ABHD5 gene review (human)
  statement: The ABHD5 co-activator step (UniProtKB:Q8WTS1, GO:0060229 lipase activator activity) matches the completed human
    ABHD5 review, which removes the contested intrinsic acyltransferase and hydrolase activities.
- source_id: file:human/LIPE/LIPE-ai-review.yaml
  title: LIPE gene review (human)
  statement: The HSL diacylglycerol lipase step (UniProtKB:Q05469, GO:0120516) matches the completed human LIPE review.
- source_id: PMID:16679289
  title: Adipose triglyceride lipase-mediated lipolysis of cellular fat stores is activated by CGI-58 and defective in Chanarin-Dorfman
    Syndrome.
  statement: CGI-58/ABHD5 binds ATGL and stimulates its triacylglycerol hydrolase activity.
  supporting_text: CGI-58 interacts with ATGL, stimulating its TG hydrolase activity up to 20-fold.
