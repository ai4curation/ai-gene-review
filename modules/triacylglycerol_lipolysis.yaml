  notes: Intracellular (neutral) triacylglycerol lipolysis, grounded to the completed human PNPLA2, ABHD5 and LIPE gene reviews.
    MGLL has no gene review yet, so its PANTHER family id is left unasserted and its step is grounded to the Reactome acyl-chain
    remodeling summary. Inhibitory regulators (G0S2, perilipins, PLIN5 sequestration of ABHD5) and hormonal control of HSL
    by PKA phosphorylation are not yet modelled. Lysosomal acid lipolysis (LIPA, lysosomal lumen) is a separate pathway acting
    on endocytosed and autophagocytosed lipid and is not part of this module.
