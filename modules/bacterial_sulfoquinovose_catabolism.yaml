              - id: sulfo_smo_route
                label: Sulfo-SMO route (SQ monooxygenase and 6-dehydroglucose reductase)
                module_type: METABOLIC_PATHWAY
                description: >-
                  Oxidative desulfurization route characterized in
                  Agrobacterium tumefaciens C58 (also called sulfo-ASMO): the
                  FMNH2-dependent SQ monooxygenase SmoC, supplied with reduced
                  FMN by the NADH-dependent flavin reductase SmoA, cleaves the
                  C-S bond of SQ to release sulfite and 6-dehydroglucose, which
                  the NADPH-dependent reductase SmoB reduces to glucose.
                evidence:
                  - source_id: PMID:35074914
                    title: Oxidative desulfurization pathway for complete catabolism of sulfoquinovose by bacteria.
                    statement: >-
                      Defines the sulfo-SMO route in A. tumefaciens, in which
                      all six SQ carbons are used and sulfite is released.
                    supporting_text: >-
                      A sulfoquinovosidase hydrolyzes the SQ glycoside and the
                      liberated SQ is acted on by a flavin
                      mononucleotide-dependent sulfoquinovose monooxygenase, in
                      concert with an NADH-dependent flavin reductase, to
                      release sulfite and 6-oxo-glucose. An NAD(P)H-dependent
                      oxidoreductase reduces the 6-oxo-glucose to glucose,
                      enabling entry into primary metabolic pathways.
