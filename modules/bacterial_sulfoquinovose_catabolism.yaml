                    statement: SqvA is a sulfofructose transaldolase that forms F6P and SLA.
                    supporting_text: >-
                      in which sulfosugar cleavage is catalyzed by the
                      transaldolase SqvA, which converts
                      6-deoxy-6-sulfofructose and glyceraldehyde 3-phosphate
                      into fructose -6-phosphate and (S)-sulfolactaldehyde.
