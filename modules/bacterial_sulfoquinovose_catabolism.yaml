      description: >-
        Sulfoquinovosidase supplies free SQ to whichever catabolic route the
        organism carries.
      chaining_status: MAPPING_GAP
      chaining_note: >-
        Anomeric break. The sulfoquinovosidase releases 6-sulfo-alpha-D-quinovose
        (RHEA:70727, RHEA:49452). The sulfo-ED dehydrogenase (RHEA:47896) and
        the sulfo-SMO monooxygenase (RHEA:70775) take unspecified
        6-sulfo-D-quinovose and chain directly, but the YihS and SqvD/SftI
        isomerases of the sulfo-EMP and sulfo-SFT routes consume
        6-sulfo-beta-D-quinovose (RHEA:40439). The intervening alpha-to-beta
        mutarotation is known chemistry, catalysed by the SQ mutarotases YihR
        (sulfo-EMP) and SqvB (sulfo-SFT) per PMID:41676062 and also occurring
        spontaneously in solution; it has a Rhea reaction (RHEA:59228, EC
        5.1.3.43) but no GO mapping and no UniProtKB entry carrying the
        activity (checked 2026-10-10), so it is not modeled as a part and the
        continuity is recorded here rather than asserted as VERIFIED.
knowledge_gaps:
  - gap_statement: >-
      It is unknown how sulfo-EMP organisms that lack a YihQ ortholog, such as
      Arthrobacter and related Actinobacteria, release SQ from sulfoquinovosyl
      glycosides, although they grow on these glycosides.
    boundary: >-
      The sulfoquinovosidase step is modeled as optional with GH31 exemplars
      only; the enzyme used by these organisms is not asserted.
    gap_kind:
      - BIOLOGY
    status: OPEN
    resolution: >-
      Activity-guided fractionation or proteomics of Arthrobacter grown on
      methyl alpha-sulfoquinovoside, followed by recombinant assay of candidate
      glycoside hydrolases, would identify the enzyme.
    provenance:
      - reference_id: PMID:41676062
        supporting_text: >-
          Despite this, they retain the ability to utilize sulfoquinovoside and
          methyl α-sulfoquinovoside, suggesting the involvement of unknown or
          non-specific sulfoquinovosidases in the catalysis.
        reference_section_type: RESULTS
