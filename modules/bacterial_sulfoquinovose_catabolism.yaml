id: MODULE:bacterial_sulfoquinovose_catabolism
title: Bacterial sulfoquinovose catabolism (sulfoglycolysis and sulfo-SMO)
description: >-
  A reusable bacterial module for breakdown of sulfoquinovose (SQ;
  6-deoxy-6-sulfo-D-glucose), the polar head group of the plant and
  cyanobacterial sulfolipid sulfoquinovosyl diacylglycerol. An optional
  glycoside hydrolase first releases free SQ from sulfoquinovosyl glycerides.
  SQ is then consumed by one of several alternative, biochemically
  characterized routes. Three C-C bond cleavage (sulfoglycolytic) routes split
  the C6 sulfosugar into a non-sulfonated C3 unit used for growth and the C3
  organosulfonate 3-sulfolactaldehyde (SLA), which is then reduced to
  2,3-dihydroxypropane-1-sulfonate (DHPS) or oxidized to 3-sulfolactate (SL)
  for excretion: the sulfo-EMP route (SQ isomerase, sulfofructose kinase,
  sulfofructose-1-phosphate aldolase), the sulfo-ED route (SQ dehydrogenase,
  sulfogluconolactonase, sulfogluconate dehydratase, KDSG aldolase), and the
  sulfo-SFT route (SQ isomerase and sulfofructose transaldolase). In the
  oxidative sulfo-SMO route a two-component flavin-dependent SQ monooxygenase
  cleaves the C-S bond, releasing sulfite and 6-dehydroglucose, which is
  reduced to glucose so that all six carbons are used. Uptake, regulation,
  and downstream mineralization of DHPS, SL or sulfite by other enzymes or
  community members are outside the module boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:41676062
    title: Advances in microbial sulfoquinovose catabolism.
    statement: >-
      Trigger review. Summarizes the C-S cleavage (sulfo-ASMO/SMO, sulfo-ASDO)
      and C-C cleavage (sulfo-EMP, sulfo-ED, sulfo-TAL/SFT, sulfo-TK) routes
      for SQ degradation and their short-chain sulfonate products; used to set
      the module boundary and the axis of route variation, with each modeled
      step grounded in primary literature below.
    supporting_text: >-
      Microorganisms employ two principal classes of catabolic pathways to
      degrade SQ: (i) C-S bond cleavage pathways, including the sulfo-ASMO
      (alkanesulfonate monooxygenase-dependent) and sulfo-ASDO (alkanesulfonate
      dioxygenase-dependent) pathways, which release glucose and sulfite; and
      (ii) C-C bond cleavage pathways, including sulfo-EMP
  - source_id: PMID:41676062
    title: Advances in microbial sulfoquinovose catabolism.
    statement: >-
      SQ degradation pathways are so far known only from bacteria, supporting
      a Bacteria-scoped module.
    supporting_text: >-
      Currently, all known SQ degradation pathways are restricted to bacteria
      and no characterized pathways exist in eukaryotes or archaea
notes: >-
  Boundary decision. The routes share one input (SQ, released by an
  optional sulfoquinovosidase) and one ecological role (use of the sulfosugar
  as carbon and energy source), but no route-defining enzyme is shared across
  all of them; SQ isomerase is shared only by sulfo-EMP and sulfo-SFT, and
  SLA dehydrogenase only by sulfo-ED and sulfo-SFT. They are therefore modeled
  as alternative implementations in a single route variant_set
  (selection ONE_OR_MORE, because some bacteria carry more than one route)
  rather than as four standalone modules, with each variant carrying its own
  ordered parts and connections. The terminal SLA reduction or oxidation is
  modeled inside each route with the enzyme documented for that route's
  exemplar organism; the same SLA-redox alternatives recur across routes
  (for example, Arthrobacter sulfo-EMP clusters use an SLA dehydrogenase
  instead of YihU, and anaerobic sulfo-SFT clusters use an SLA reductase
  instead of SftD/SlaB), as summarized in PMID:41676062 and PMID:32919372.
  Not modeled: the sulfo-ASDO route (Fe(II)/2-oxoglutarate-dependent SQ
  dioxygenase SqoD) and the sulfo-TK route (SF transketolase SqwGH), which
  have fewer characterized reference proteins in UniProtKB; the
  EMP2-specific kinase and aldolase SqiK and SqiA of the sulfo-EMP2 variant
  (its isomerase SqvD is shared with sulfo-SFT and is modeled there); the SQ
  mutarotases YihR/SqvB (EC 5.1.3.43, RHEA:59228), because no UniProtKB entry
  carries that activity (E. coli YihR, P32139, is still named "Uncharacterized
  protein YihR") and GO has no term mapped to RHEA:59228, so the
  alpha-to-beta anomer step is recorded on the top-level connection instead; SQ and
  sulfoquinovosyl glyceride uptake systems (YihO, SmoEFGH); the
  transcriptional repressor CsqR; and downstream desulfonation of DHPS, SL,
  isethionate or 3-sulfopropionate (HpsGH, SuyAB, IseG, HpfG and related
  enzymes), which is a distinct community-level module. Reaction chaining
  across the non-CoA sulfosugar intermediates was checked manually against
  the cited Rhea equations. Ontology gaps noted for GO editors: GO has
  specific molecular-function terms only for the sulfo-EMP reactions
  (GO:0061593, GO:0061594, GO:0061595, GO:0061596) and for sulfoquinovosidase
  (GO:1990929); the sulfo-ED (EC 1.1.1.390, 3.1.1.99, 4.2.1.162, 4.1.2.58),
  sulfo-SFT (EC 2.2.1.14), SQ monooxygenase (EC 1.14.14.181) and
  6-dehydroglucose reductase (EC 1.1.1.432) reactions have Rhea entries but
  no rhea2go/ec2go mapping, so their annotons use the nearest existing parent
  GO term with the exact Rhea reaction as evidence. GO:0061722
  sulphoglycolysis (is_a GO:1902777) is defined as "The chemical reactions and
  pathways resulting in the breakdown of 6-sulfoquinovose(1-) resulting in the
  formation of glycerone phosphate (DHAP) and pyruvate." (OLS, checked
  2026-10-10). That covers the DHAP-forming sulfo-EMP route and the
  pyruvate-forming sulfo-ED route, but not the F6P-forming sulfo-SFT route or
  the sulfite-releasing sulfo-SMO route; the root concept therefore uses the
  broader parent GO:1902777.
  Adjacency. The SmoC/SmoA step is an SQ-specific instance of the
  two-component reduced-flavin desulfonation motif modeled abstractly in
  modules/bacterial_alkanesulfonate_uptake_desulfonation.yaml
  (ssued_desulfonation): SmoA fills the reductase tier (GO:0052874 FMN
  reductase, NADH) and SmoC the oxygenase tier (GO:0008726), differing from the
  SsuE/SsuD abstract motif only in the SQ-specific substrate and the NADH
  versus NADPH reductase cofactor. A formal conforms_to is not declared because
  this module collapses the two-component system into one reaction node rather
  than the template's two parts, but that module covers promiscuous SsuD/SsuE
  alkanesulfonate desulfonation, so there is no overlap in members. Downstream
  desulfonation of DHPS, SL and sulfite is left to
  community-level modules as stated above.
module:
  id: bacterial_sulfoquinovose_catabolism
  label: Bacterial sulfoquinovose catabolism
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: 6-sulfoquinovose(1-) catabolic process
      term:
        id: GO:1902777
        label: 6-sulfoquinovose(1-) catabolic process
      description: >-
        Breakdown of sulfoquinovose by any of the represented sulfoglycolytic
        or oxidative desulfurization routes.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: optional release of free sulfoquinovose from sulfoquinovosyl glycosides
      optional: true
      node:
        id: sq_glycoside_hydrolysis
        label: Sulfoquinovosidase release of sulfoquinovose
        module_type: REACTION
        annotons:
          - id: sulfoquinovosidase
            label: Sulfoquinovosidase (YihQ/SmoI type)
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: sulfoquinovosidase activity
                term:
                  id: GO:1990929
                  label: sulfoquinovosidase activity
              family:
                preferred_term: GH31 sulfoquinovosidases
                term:
                  id: PANTHER:PTHR46959:SF2
                  label: SULFOQUINOVOSIDASE
                description: >-
                  Glycoside hydrolase family 31 sulfoquinovosidases with a
                  sulfonate-binding pocket. Other sulfoquinovosidase families
                  (for example GH188) are known but not represented here.
                representative_members:
                  - preferred_term: YihQ (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P32138
                      label: Sulfoquinovosidase
                  - preferred_term: SmoI (Agrobacterium fabrum C58)
                    term:
                      id: UniProtKB:A9CEZ0
                      label: Sulfoquinovosidase
            function:
              preferred_term: sulfoquinovosidase activity
              term:
                id: GO:1990929
                label: sulfoquinovosidase activity
              substrates:
                - preferred_term: sulfoquinovosyl glycerol or sulfoquinovosyl diacylglycerol
                - preferred_term: water
              products:
                - preferred_term: 6-sulfo-alpha-D-quinovose
                - preferred_term: glycerol or 1,2-diacyl-sn-glycerol
              evidence:
                - source_id: RHEA:70727
                  statement: >-
                    3-(6-sulfo-alpha-D-quinovosyl)glycerol + H2O =
                    6-sulfo-alpha-D-quinovose + glycerol.
                - source_id: RHEA:49452
                  statement: >-
                    a 6-sulfo-alpha-D-quinovosyldiacylglycerol + H2O =
                    6-sulfo-alpha-D-quinovose + a 1,2-diacyl-sn-glycerol.
            processes:
              - preferred_term: 6-sulfoquinovose(1-) catabolic process
                term:
                  id: GO:1902777
                  label: 6-sulfoquinovose(1-) catabolic process
            role_description: >-
              Hydrolyzes the alpha-glycosidic bond of sulfoquinovosyl glycerides
              to supply free SQ. Optional because free SQ can also be taken up
              directly and some sulfo-EMP organisms lack a YihQ ortholog.
            evidence:
              - source_id: PMID:26878550
                title: YihQ is a sulfoquinovosidase that cleaves sulfoquinovosyl diacylglyceride sulfolipids.
                statement: E. coli YihQ is a dedicated sulfoquinovosidase upstream of sulfoglycolysis.
                supporting_text: >-
                  We have identified Escherichia coli YihQ as the first
                  dedicated sulfoquinovosidase and the gateway enzyme to
                  sulfoglycolytic pathways.
              - source_id: PMID:35074914
                title: Oxidative desulfurization pathway for complete catabolism of sulfoquinovose by bacteria.
                statement: >-
                  In the sulfo-SMO cluster, SmoI hydrolyzes SQGro before C-S
                  cleavage, because SmoC does not act on the glycoside.
                supporting_text: >-
                  As such, the hydrolysis of SQGro by SmoI necessarily precedes
                  oxidative desulfurization by SmoC.
    - order: 2
      role: route-specific catabolism of free sulfoquinovose
      node:
        id: sq_catabolic_routes
        label: Alternative sulfoquinovose catabolic routes
        module_type: METABOLIC_PATHWAY
        variant_sets:
          - id: sq_catabolic_route
            label: Sulfoquinovose catabolic route
            axis: >-
              bond cleaved and enzyme set (C-C cleavage by aldolase or
              transaldolase versus oxidative C-S cleavage)
            selection: ONE_OR_MORE
            evidence:
              - source_id: PMID:41676062
                title: Advances in microbial sulfoquinovose catabolism.
                statement: >-
                  C-C cleavage routes yield C3 organosulfonates that must be
                  desulfonated separately, whereas C-S cleavage routes release
                  sulfite directly.
                supporting_text: >-
                  For the C-S bond cleavage pathways, SQ is directly
                  desulfurized to yield glucose, which can be further
                  metabolized via glycolysis or other pathways. In contrast,
                  C-C bond cleavage pathways produce short-chain sulfonated
                  carbohydrates, which require additional desulfurization or
                  further degradation steps.
            variants:
              - id: sulfo_emp_route
                label: Sulfo-EMP route (YihS-YihV-YihT-YihU)
                module_type: METABOLIC_PATHWAY
                description: >-
                  Embden-Meyerhof-like sulfoglycolysis characterized in
                  Escherichia coli K-12: SQ is isomerized to
                  6-deoxy-6-sulfofructose (SF), phosphorylated to SF
                  1-phosphate (SFP), and split by an aldolase into DHAP and
                  SLA; SLA is reduced to DHPS for excretion.
                concepts:
                  - preferred_term: sulphoglycolysis
                    term:
                      id: GO:0061722
                      label: sulphoglycolysis
                evidence:
                  - source_id: PMID:24463506
                    title: Sulphoglycolysis in Escherichia coli K-12 closes a gap in the biogeochemical sulphur cycle.
                    statement: >-
                      The four sulfo-EMP reactions were established with purified
                      E. coli enzymes; DHAP supports growth and DHPS is excreted.
                    supporting_text: >-
                      SQ is catabolised through four newly discovered reactions
                      that we established using purified, heterologously
                      expressed enzymes: SQ isomerase,
                      6-deoxy-6-sulphofructose (SF) kinase,
                      6-deoxy-6-sulphofructose-1-phosphate (SFP) aldolase, and
                      3-sulpholactaldehyde (SLA) reductase.
                  - source_id: PMID:33791429
                    title: Molecular Basis of Sulfosugar Selectivity in Sulfoglycolysis.
                    statement: >-
                      Structural and kinetic analysis shows the three core
                      sulfo-EMP enzymes are specific for sulfosugar substrates
                      rather than glycolytic analogues.
                    supporting_text: >-
                      Our data show that despite the superficial similarity of
                      this pathway to glycolysis, the sulfoglycolytic enzymes are
                      specific for SQ metabolites and are not catalytically
                      active on related metabolites from glycolytic pathways.
                parts:
                  - order: 1
                    role: SQ to sulfofructose isomerization
                    node:
                      id: emp_sq_isomerization
                      label: YihS sulfoquinovose isomerization
                      module_type: REACTION
                      annotons:
                        - id: yihs_sq_isomerase
                          label: Sulfoquinovose isomerase (YihS)
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: sulfoquinovose isomerase activity
                              term:
                                id: GO:0061593
                                label: sulfoquinovose isomerase activity
                            family:
                              preferred_term: YihS-type sulfoquinovose isomerase
                              term:
                                id: PANTHER:PTHR15108
                                label: N-ACYLGLUCOSAMINE-2-EPIMERASE
                              representative_members:
                                - preferred_term: YihS (Escherichia coli K-12)
                                  term:
                                    id: UniProtKB:P32140
                                    label: Sulfoquinovose isomerase
                          function:
                            preferred_term: sulfoquinovose isomerase activity
                            term:
                              id: GO:0061593
                              label: sulfoquinovose isomerase activity
                            substrates:
                              - preferred_term: 6-sulfo-beta-D-quinovose
                            products:
                              - preferred_term: 6-deoxy-6-sulfo-D-fructose
                            evidence:
                              - source_id: RHEA:40439
                                statement: 6-sulfo-beta-D-quinovose = 6-deoxy-6-sulfo-D-fructose.
                          processes:
                            - preferred_term: sulphoglycolysis
                              term:
                                id: GO:0061722
                                label: sulphoglycolysis
                          role_description: >-
                            Aldose-ketose isomerization that commits SQ to the
                            sulfo-EMP route; acts preferentially on the beta
                            anomer.
                  - order: 2
                    role: sulfofructose phosphorylation
                    node:
                      id: emp_sf_phosphorylation
                      label: YihV sulfofructose phosphorylation
                      module_type: REACTION
                      annotons:
                        - id: yihv_sf_kinase
                          label: 6-deoxy-6-sulfofructose kinase (YihV)
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: 6-deoxy-6-sulfofructose kinase activity
                              term:
                                id: GO:0061594
                                label: 6-deoxy-6-sulfofructose kinase activity
                            family:
                              preferred_term: YihV-type sulfofructose kinase
                              term:
                                id: PANTHER:PTHR10584:SF157
                                label: SULFOFRUCTOSE KINASE
                              representative_members:
                                - preferred_term: YihV (Escherichia coli K-12)
                                  term:
                                    id: UniProtKB:P32143
                                    label: Sulfofructose kinase
                          function:
                            preferred_term: 6-deoxy-6-sulfofructose kinase activity
                            term:
                              id: GO:0061594
                              label: 6-deoxy-6-sulfofructose kinase activity
                            substrates:
                              - preferred_term: 6-deoxy-6-sulfo-D-fructose
                              - preferred_term: ATP
                            products:
                              - preferred_term: 6-deoxy-6-sulfo-D-fructose 1-phosphate
                              - preferred_term: ADP
                            evidence:
                              - source_id: RHEA:40443
                                statement: >-
                                  6-deoxy-6-sulfo-D-fructose + ATP =
                                  6-deoxy-6-sulfo-D-fructose 1-phosphate + ADP + H(+).
                          processes:
                            - preferred_term: sulphoglycolysis
                              term:
                                id: GO:0061722
                                label: sulphoglycolysis
                          role_description: >-
                            ATP-dependent phosphorylation of SF; the
                            allosterically regulated step of the route.
                  - order: 3
                    role: sulfofructose-1-phosphate aldol cleavage
                    node:
                      id: emp_sfp_aldol_cleavage
                      label: YihT sulfofructose-1-phosphate aldol cleavage
                      module_type: REACTION
                      annotons:
                        - id: yiht_sfp_aldolase
                          label: Sulfofructose-1-phosphate aldolase (YihT)
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: 6-deoxy-6-sulfofructose-1-phosphate aldolase activity
                              term:
                                id: GO:0061595
                                label: 6-deoxy-6-sulfofructose-1-phosphate aldolase activity
                            family:
                              preferred_term: YihT-type class I SFP aldolase
                              term:
                                id: PANTHER:PTHR39340:SF1
                                label: SULFOFRUCTOSEPHOSPHATE ALDOLASE
                              representative_members:
                                - preferred_term: YihT (Escherichia coli K-12)
                                  term:
                                    id: UniProtKB:P32141
                                    label: Sulfofructosephosphate aldolase
                          function:
                            preferred_term: 6-deoxy-6-sulfofructose-1-phosphate aldolase activity
                            term:
                              id: GO:0061595
                              label: 6-deoxy-6-sulfofructose-1-phosphate aldolase activity
                            substrates:
                              - preferred_term: 6-deoxy-6-sulfo-D-fructose 1-phosphate
                            products:
                              - preferred_term: (2S)-3-sulfolactaldehyde
                              - preferred_term: dihydroxyacetone phosphate
                            evidence:
                              - source_id: RHEA:40515
                                statement: >-
                                  6-deoxy-6-sulfo-D-fructose 1-phosphate =
                                  (2S)-3-sulfolactaldehyde + dihydroxyacetone phosphate.
                          processes:
                            - preferred_term: sulphoglycolysis
                              term:
                                id: GO:0061722
                                label: sulphoglycolysis
                          role_description: >-
                            Splits SFP into DHAP, which enters glycolysis, and
                            the organosulfonate SLA.
                  - order: 4
                    role: sulfolactaldehyde reduction
                    node:
                      id: emp_sla_reduction
                      label: YihU sulfolactaldehyde reduction to DHPS
                      module_type: REACTION
                      annotons:
                        - id: yihu_sla_reductase
                          label: 3-sulfolactaldehyde reductase (YihU)
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: 3-sulfolactaldehyde reductase activity
                              term:
                                id: GO:0061596
                                label: 3-sulfolactaldehyde reductase activity
                            family:
                              preferred_term: YihU-type NADH-dependent SLA reductase
                              term:
                                id: PANTHER:PTHR22981
                                label: 3-HYDROXYISOBUTYRATE DEHYDROGENASE-RELATED
                              representative_members:
                                - preferred_term: YihU (Escherichia coli K-12)
                                  term:
                                    id: UniProtKB:P0A9V8
                                    label: 3-sulfolactaldehyde reductase
                          function:
                            preferred_term: 3-sulfolactaldehyde reductase activity
                            term:
                              id: GO:0061596
                              label: 3-sulfolactaldehyde reductase activity
                            substrates:
                              - preferred_term: (2S)-3-sulfolactaldehyde
                              - preferred_term: NADH
                            products:
                              - preferred_term: (2S)-3-sulfopropanediol (DHPS)
                              - preferred_term: NAD+
                            evidence:
                              - source_id: RHEA:40511
                                statement: >-
                                  (2S)-3-sulfopropanediol + NAD(+) =
                                  (2S)-3-sulfolactaldehyde + NADH + H(+), operating
                                  in the SLA-reducing direction in the pathway.
                          processes:
                            - preferred_term: 6-sulfoquinovose(1-) catabolic process
                              term:
                                id: GO:1902777
                                label: 6-sulfoquinovose(1-) catabolic process
                          role_description: >-
                            Reduces SLA to DHPS, regenerating NAD+; DHPS is
                            excreted. YihU also reduces succinic semialdehyde,
                            a separate non-core activity.
                connections:
                  - source: emp_sq_isomerization
                    target: emp_sf_phosphorylation
                    connection_type: PROVIDES_INPUT_FOR
                    description: YihS supplies 6-deoxy-6-sulfofructose to YihV.
                    chaining_status: VERIFIED
                    chaining_note: SF is the product of RHEA:40439 and the substrate of RHEA:40443.
                  - source: emp_sf_phosphorylation
                    target: emp_sfp_aldol_cleavage
                    connection_type: PROVIDES_INPUT_FOR
                    description: YihV supplies sulfofructose 1-phosphate to YihT.
                    chaining_status: VERIFIED
                    chaining_note: SFP is the product of RHEA:40443 and the substrate of RHEA:40515.
                  - source: emp_sfp_aldol_cleavage
                    target: emp_sla_reduction
                    connection_type: PROVIDES_INPUT_FOR
                    description: YihT supplies (2S)-3-sulfolactaldehyde to YihU.
                    chaining_status: VERIFIED
                    chaining_note: (2S)-SLA is a product of RHEA:40515 and the substrate of RHEA:40511.
              - id: sulfo_ed_route
                label: Sulfo-ED route (SQ dehydrogenase to KDSG aldolase)
                module_type: METABOLIC_PATHWAY
                description: >-
                  Entner-Doudoroff-like sulfoglycolysis characterized in
                  Pseudomonas putida SQ1: SQ is oxidized to
                  6-deoxy-6-sulfogluconolactone, hydrolyzed to
                  6-deoxy-6-sulfogluconate, dehydrated to
                  2-keto-3,6-dideoxy-6-sulfogluconate (KDSG), and split into
                  pyruvate and SLA; SLA is oxidized to SL for excretion.
                concepts:
                  - preferred_term: sulphoglycolysis
                    term:
                      id: GO:0061722
                      label: sulphoglycolysis
                evidence:
                  - source_id: PMID:26195800
                    title: Entner-Doudoroff pathway for sulfoquinovose degradation in Pseudomonas putida SQ1.
                    statement: >-
                      The complete sulfo-ED pathway was reconstituted in vitro
                      from five heterologously produced P. putida SQ1 enzymes.
                    supporting_text: >-
                      It involves an NAD(+)-dependent SQ dehydrogenase,
                      6-deoxy-6-sulfogluconolactone (SGL) lactonase,
                      6-deoxy-6-sulfogluconate (SG) dehydratase, and
                      2-keto-3,6-dideoxy-6-sulfogluconate (KDSG) aldolase.
                parts:
                  - order: 1
                    role: SQ oxidation
                    node:
                      id: ed_sq_oxidation
                      label: SQ dehydrogenase oxidation to sulfogluconolactone
                      module_type: REACTION
                      annotons:
                        - id: ed_sq_dehydrogenase
                          label: Sulfoquinovose 1-dehydrogenase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: sulfo-ED NAD+-dependent SQ dehydrogenase
                              term:
                                id: PANTHER:PTHR43639:SF1
                                label: SHORT-CHAIN DEHYDROGENASE_REDUCTASE FAMILY PROTEIN
                              representative_members:
                                - preferred_term: PpSQ1_00405 (Pseudomonas putida SQ1 SQ dehydrogenase)
                                  term:
                                    id: UniProtKB:P0DOV5
                                    label: Sulfoquinovose 1-dehydrogenase
                          function:
                            preferred_term: sulfoquinovose 1-dehydrogenase (NAD+) activity (EC 1.1.1.390)
                            term:
                              id: GO:0016616
                              label: oxidoreductase activity, acting on the CH-OH group of donors, NAD or NADP as acceptor
                            substrates:
                              - preferred_term: 6-sulfo-D-quinovose
                              - preferred_term: NAD+
                            products:
                              - preferred_term: 6-deoxy-6-sulfo-D-glucono-1,5-lactone
                              - preferred_term: NADH
                            evidence:
                              - source_id: RHEA:47896
                                statement: >-
                                  6-sulfo-D-quinovose + NAD(+) =
                                  6-deoxy-6-sulfo-D-glucono-1,5-lactone + NADH + H(+).
                          processes:
                            - preferred_term: sulphoglycolysis
                              term:
                                id: GO:0061722
                                label: sulphoglycolysis
                          role_description: >-
                            NAD+-dependent oxidation of SQ at C1. No specific
                            GO molecular-function term exists; the parent term
                            is used with the exact Rhea reaction.
                  - order: 2
                    role: sulfogluconolactone hydrolysis
                    node:
                      id: ed_sgl_hydrolysis
                      label: Sulfogluconolactonase ring opening
                      module_type: REACTION
