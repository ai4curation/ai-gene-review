id: MODULE:dmel_larval_serum_protein_hexamers
title: Larval serum protein hexamerins in Drosophila melanogaster
description: >-
  Larval serum proteins (LSPs) are hexamerins, storage proteins related to arthropod hemocyanins
  that have lost the copper-binding oxygen-carrying function. They are made in large amounts
  by the larval fat body, secreted into the hemolymph, and taken back up by the fat body at
  the end of the third instar, where they are stored in granules and broken down to supply
  amino acids for metamorphosis. Lsp1 hexamers are made of the alpha, beta and gamma chains
  (Lsp1alpha, Lsp1beta, Lsp1gamma) in various combinations, and Lsp2 forms a separate hexamer.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001752
  title: 'FlyBase gene group LSP: Larval serum protein subunits'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as larval serum protein subunits
    (LSP); this module models that group.
- source_id: FB:FBgg0001781
  title: 'FlyBase gene group LSP1: Lsp1 complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as lsp1 complex (LSP1); this
    module models that group.
- source_id: GO:0140089
  title: protein storage
  statement: >-
    GO term grounding the module as protein storage.
notes: >-
  No GO cellular component term specifically describes a hexamerin complex, so the module
  is grounded to the protein storage process instead; the parts are labelled as Lsp1 and Lsp2
  hexamers. Lsp2 forms homohexamers and is modelled as a single-gene part. Lsp1 hexamers mix
  the three Lsp1 chains in several combinations; the exact subunit stoichiometries are not
  modelled. Receptor-mediated uptake of LSPs by the fat body at the end of larval life is
  outside the module. Lsp2 is also expressed in the adult fat body. FlyBase groups realized
  by this module: LSP (FBgg0001752), LSP1 (FBgg0001781). Participants were generated from
  the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_larval_serum_protein_hexamers.yaml. Genes without a UniProtKB entry
  (mostly non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes
  has a gene review yet unless noted.
