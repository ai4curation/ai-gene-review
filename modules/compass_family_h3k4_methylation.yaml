                                - source_id: RHEA:60264
                                  statement: L-lysyl(4)-[histone H3] + S-adenosyl-L-methionine = N(6)-methyl-L-lysyl(4)-[histone H3] + S-adenosyl-L-homocysteine + H(+); the first methylation step.
                                - source_id: RHEA:60268
