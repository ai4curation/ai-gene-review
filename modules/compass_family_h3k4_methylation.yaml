id: MODULE:compass_family_h3k4_methylation
title: Human COMPASS-family histone H3K4 methyltransferase complexes — the shared WRAD core (WDR5, RBBP5, ASH2L, DPY30) stimulating the SET-domain methyltransferase of three branches, SET1A/SET1B (with CFP1, WDR82 and HCF-1), MLL1/MLL2 (with menin and HCF-1) and MLL3/MLL4 (with PTIP, PA1, NCOA6 and UTX)
description: >-
  Methylation of histone H3 lysine 4 (H3K4), a mark of active promoters and enhancers, is
  deposited in human cells chiefly by six COMPASS-family complexes, each built around one
  SET-domain lysine methyltransferase of the KMT2 family: SETD1A, SETD1B, KMT2A (MLL1),
  KMT2B (MLL2), KMT2C (MLL3) or KMT2D (MLL4). All six share a four-subunit core, WRAD (WDR5,
  RBBP5, ASH2L and DPY30). The isolated SET domains are slow, mostly monomethylating enzymes;
  WDR5 binds the methyltransferase and bridges it to the RBBP5-ASH2L heterodimer, which binds
  the SET domain and stimulates its activity by orders of magnitude, while DPY30 binds ASH2L.
  The complexes fall into three branches by their branch-specific subunits. The SET1A and
  SET1B complexes carry CFP1 (CXXC1), which binds unmethylated CpG dinucleotides, and WDR82,
  which binds the Ser5-phosphorylated C-terminal domain of RNA polymerase II; they are the
  most active H3K4 trimethylases in vitro and are responsible for most H3K4 trimethylation
  near transcription start sites. The MLL1 and MLL2 complexes carry menin, which links them to
  the chromatin anchor LEDGF and to transcription factors and is required for H3K4
  methylation of the HOX loci; HCF-1 is found in both the SET1 and MLL1 complexes. The MLL3
  and MLL4 complexes carry PTIP, PA1, NCOA6 and the H3K27 demethylase UTX; MLL3 and MLL4 are
  the major H3K4 monomethylases of enhancers and are required for enhancer activation during
  differentiation.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001338
    title: histone modification pathway
    statement: >-
      RGD curates the COMPASS genes ASH2L, CXXC1, DPY30, HCFC1, KDM6A, KMT2A, KMT2B, KMT2C,
      KMT2D, MEN1, NCOA6, PAGR1, PAXIP1, RBBP5, SETD1A, SETD1B, WDR5 and WDR82 to this
      pathway (TAS, PMID:22663077 for all eighteen), and its diagram draws "COMPASS
      complexes" acting on lysine and positively affecting gene expression. This module
      realises the COMPASS part of the pathway, item 2 of the histone modification split plan
      in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001338.yaml
    statement: RGD describes COMPASS as the six mammalian H3K4 di- and trimethylating complexes of Trithorax-group enzymes with core and accessory subunits.
    supporting_text: COMPASS di- and tri-methylates K4 with activating
  - source_id: GO:0045815
    title: transcription initiation-coupled chromatin remodeling
    statement: >-
      PW:0001338 has no GO process mapping, and GO has obsoleted every histone H3K4
      methylation process term because each represents a molecular function. The module's
      process concept is therefore the trithorax-group process GO:0045815, whose GO comment
      names trithorax group members as its exemplars and which human GOA uses for KMT2A
      (IDA, PMID:19556245) and MEN1 (IMP, PMID:14992727). The H3K4 methylation itself is
      carried by the molecular function GO:0042800 and its children on the catalytic
      annotons.
  - source_id: PMID:22663077
    title: 'The COMPASS family of histone H3K4 methylases: mechanisms of regulation in development and disease pathogenesis.'
    statement: Human cells have six Set1 homologues, each forming a COMPASS or COMPASS-like complex.
    supporting_text: In human cells, Set1A, Set1B, MLL1, MLL2, MLL3 and MLL4 are homologs of yeast Set1
  - source_id: PMID:23508102
    title: Quantitative dissection and stoichiometry determination of the human SET1/MLL histone methyltransferase complexes.
    statement: Quantitative proteomics defines the composition and stoichiometry of the six human SET1/MLL complexes.
    supporting_text: At least six different COMPASS-like multisubunit (SET1/MLL) complexes that contain methyltransferase activity for H3K4 have been described
  - source_id: PMID:25561738
    title: Biochemical reconstitution and phylogenetic comparison of human SET1 family core complexes involved in histone methylation.
    statement: All six human SET1-family core complexes were reconstituted; WRAD stimulates every SET domain.
    supporting_text: In the presence of WRAD, all SET1 family members showed stimulated monomethyltransferase activity but differed in their di- and trimethylation activities.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001338 (histone modification pathway)
  through the RGD_PATHWAY_ONTOLOGY project, as item 2 of the histone modification split plan
  (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md; seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, flagged broad, 173 RGD-curated human
  genes, no GO mapping). PW:0001338 is the only PW evidence source: it has no PW children
  carrying COMPASS genes, and its diagram node "COMPASS complexes" links only to an RGD web
  page, not to a PW id. Membership follows RGD exactly. The eighteen genes RGD annotates to
  PW:0001338 from the COMPASS review (TAS, PMID:22663077) are all participants: WDR5, RBBP5,
  ASH2L and DPY30 (WRAD); SETD1A, SETD1B, CXXC1 and WDR82 (SET1 branch); KMT2A, KMT2B and
  MEN1 (MLL1/2 branch); HCFC1 (SET1 and MLL1 branches); KMT2C, KMT2D, PAXIP1, PAGR1, NCOA6
  and KDM6A (MLL3/4 branch). No gene outside the RGD list is added. Excluded RGD genes: KMT2E,
  annotated to PW:0001338 from a separate source, is a SET-domain protein that is not a
  COMPASS subunit and lacks robust H3K4 methyltransferase activity; KDM6B is a demethylase
  not stably part of the MLL3/4 complex; both are left to their own modules. Subunits found by
  proteomics but not on the RGD list (BOD1, BOD1L1, OGT, LEDGF/PSIP1, the MOF/NSL proteins)
  are named here only. UniProt accessions and recommended names are from UniProt REST
  (November 2026); molecular functions are from each protein's experimental human GOA rows in
  QuickGO (November 2026). Of the members only MEN1 and HCFC1 have gene reviews in this
  repository; their core functions (protein-macromolecule adaptor activity for both, and
  MLL1/2 complex membership for menin) are used unchanged. The structure follows
  modules/dmel_compass_family_complexes.yaml (structure only; no Drosophila evidence is used).

  GO process. GO has obsoleted every histone H3K4 methylation process term (histone H3-K4
  methylation, mono-, di- and trimethylation and their regulation terms), each with the
  comment that it represents a molecular function, so no process names H3K4 methylation and
  no new process term is requested: GO deliberately moved this content to the molecular
  functions histone H3K4 methyltransferase activity and its mono-, di- and trimethyltransferase
  children. The module concept for the process is GO:0045815 transcription initiation-coupled
  chromatin remodeling, whose GO comment cites the trithorax group as its example and which
  human GOA already uses for KMT2A and MEN1; the complex concept is GO:0035097 histone
  methyltransferase complex, the parent of the three branch complex terms. GO has no term
  that distinguishes promoter H3K4me3 from enhancer H3K4me1, so that distinction is carried
  by the molecular function terms and role text.

  Boundary and modelling decisions. (1) WRAD modelled once. The shared core is part 1, a
  single complex annoton, and the three branches are variants of part 2; one
  POSITIVELY_REGULATES connection from WRAD to the catalytic part stands for stimulation of
  whichever methyltransferase is present. Writing the four WRAD units into each of six
  complexes would repeat them six times; the branch complex terms (Set1C/COMPASS, MLL1/2
  complex, MLL3/4 complex) are placed on the branch nodes and describe whole complexes
  including WRAD. (2) Catalysis is on the KMT2 subunit. Each methyltransferase is a gene
  product annoton with its own activity, as all six SET domains monomethylate H3K4 alone and
  all carry experimental methyltransferase rows. WRAD subunits get no catalytic function; the
  WRAD complex carries the curator-authored regulator term methyltransferase regulator
  activity, because WRAD was assayed as an added subcomplex that binds and stimulates the
  isolated SET domain. The reported intrinsic methyltransferase activity of the non-SET
  subunits (PMID:19556245) is not adopted. (3) Paralogues as nested variant sets. Within each
  branch the two catalytic paralogues (SETD1A/SETD1B, KMT2A/KMT2B, KMT2C/KMT2D) are an
  EXACTLY_ONE variant set, so the module encodes the six complexes; the branch-specific
  subunits are one complex annoton per branch, shared by both paralogue complexes of that
  branch. HCF-1 is written in both the SET1 and the MLL1/2 branch annotons. (4) Molecular
  function terms. SETD1A, SETD1B, KMT2A and KMT2B carry histone H3K4 methyltransferase
  activity (up to three methyl groups). The trimethyltransferase child is not used: the SET1
  complexes produce most H3K4me3 in cells (PMID:18838538) but the SETD1B row is
  contributes_to from the whole complex, and the KMT2A trimethyltransferase row is a
  gene-specific ChIP study, while reconstituted MLL1 core complex stops at H3K4me2. KMT2C and
  KMT2D carry the monomethyltransferase child term, supported by EXP rows for both and by
  their role as the main enhancer H3K4 monomethylases (PMID:24081332). (5) Chemistry. SAM,
  SAH, the histone H3 lysine-4 residue states and H+ are grounded from RHEA:60264, RHEA:60268
  and RHEA:60272 with ChEBI labels checked in OLS; histone H3 itself is a substrate, not a
  participant, and is not listed as a unit. (6) Authored functions. Two functions are not
  backed by an experimental GOA row on that exact term: WRAD methyltransferase regulator
  activity (above) and WDR82 RNA polymerase II C-terminal domain phosphoserine binding (from
  the binding assay of PMID:17998332). (7) Readers. WDR5 has reader rows but is in the module
  as a WRAD subunit; its reader function is not written as its role (see the WRAD annoton).
  The PHD and bromodomain readers of the KMT2 proteins themselves are not modelled as
  separate activities. (8) KDM6A split. UTX is a substoichiometric unit of the MLL3/4 branch
  here without a function; its H3K27me2/me3 demethylase activity belongs to the sibling module
  histone_lysine_demethylation, which should list it as the catalytic unit. (9) Out of scope:
  menin's corepressor roles with JunD and NF-kB; the DNA-damage roles of PTIP; KMT2A
  rearrangements in leukemia and the menin-MLL fusion interface; H2B monoubiquitination,
  which RGD notes H3K4 trimethylation depends on, belongs to its own ubiquitination
  machinery; the H3K4 demethylases (KDM1A, KDM5A-D) are in histone_lysine_demethylation, and
  Polycomb antagonism is in polycomb_repressive_complexes.

  GO-CAM links. gocams/index.tsv (November 2026) contains no production model with any of
  the eighteen members, so no gocam_associations are recorded. The seed's best_gocam
  (CDKN1A induction via PCAF-SAGA) contains no COMPASS subunit. PANTHER family ids and PTNs
  are deliberately not asserted.

  Possible upstream issue (query only, not read in full). WDR5 carries an IDA row for
  GO:0140004 histone H3Q5ser reader activity from PMID:16600877, a 2006 structure paper on
  WDR5 recognition of methylated H3K4; histone serotonylation was described much later, so
  the row may be a remapping from an older histone-binding term. Recorded for a CHECK request
  to GOA, not as a correction.
module:
  id: compass_family_h3k4_methylation
  label: Human COMPASS-family H3K4 methyltransferase complexes
  module_type: PROTEIN_COMPLEX
  description: >-
    The shared WRAD core and the three branches of SET-domain catalytic complexes (SET1A/B,
    MLL1/2, MLL3/4) that methylate histone H3 lysine 4.
  concepts:
    - preferred_term: histone methyltransferase complex
      term:
        id: GO:0035097
        label: histone methyltransferase complex
    - preferred_term: transcription initiation-coupled chromatin remodeling
      term:
        id: GO:0045815
        label: transcription initiation-coupled chromatin remodeling
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: chromatin
        term:
          id: GO:0000785
          label: chromatin
  parts:
    - order: 1
      role: shared stimulatory core (WRAD), present in all six complexes
      node:
        id: wrad_core
        label: WRAD core (WDR5, RBBP5, ASH2L, DPY30)
        module_type: PROTEIN_COMPLEX
        description: >-
          The four-subunit core shared by every COMPASS-family complex. WDR5 binds the
          WIN motif next to the SET domain of the methyltransferase and bridges it to the
          RBBP5-ASH2L heterodimer, which binds the SET domain and stimulates catalysis; DPY30
          dimers bind ASH2L. Modelled once here and reused by all three catalytic branches
          through the connection to the catalytic part.
        annotons:
          - id: wrad_stimulation
            label: WRAD binds the KMT2 SET domain and stimulates its H3K4 methyltransferase activity
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: WRAD core (WDR5-RBBP5-ASH2L-DPY30)
                active_units:
                  - id: unit_wdr5
                    label: WDR5
                    role: WD40 propeller that binds the WIN motif of the KMT2 methyltransferase and the histone H3 tail, bridging the catalytic subunit to RBBP5-ASH2L
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: WDR5
                        term:
                          id: UniProtKB:P61964
                          label: WD repeat-containing protein 5
                  - id: unit_rbbp5
                    label: RBBP5
                    role: forms the heterodimer with ASH2L that binds and activates the SET domain
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RBBP5
                        term:
                          id: UniProtKB:Q15291
                          label: Retinoblastoma-binding protein 5
                  - id: unit_ash2l
                    label: ASH2L
                    role: forms the heterodimer with RBBP5 that binds and activates the SET domain; docking site for DPY30
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ASH2L
                        term:
                          id: UniProtKB:Q9UBL3
                          label: Set1/Ash2 histone methyltransferase complex subunit ASH2
                  - id: unit_dpy30
                    label: DPY30
                    role: dimeric subunit bound directly to ASH2L
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: DPY30
                        term:
                          id: UniProtKB:Q9C005
                          label: Protein dpy-30 homolog
            function:
              preferred_term: methyltransferase regulator activity
              term:
                id: GO:0141107
                label: methyltransferase regulator activity
            processes:
              - preferred_term: transcription initiation-coupled chromatin remodeling
                term:
                  id: GO:0045815
                  label: transcription initiation-coupled chromatin remodeling
            locations:
              - preferred_term: chromatin
                term:
                  id: GO:0000785
                  label: chromatin
            role_description: >-
              WRAD carries no catalytic function in this module. Its subunits were added as a
              subcomplex (or as the RBBP5-ASH2L heterodimer plus WDR5) to isolated KMT2 SET
              domains, which they bound and stimulated about 600-fold for MLL1
              (PMID:19556245) and for every family member (PMID:25561738, PMID:26886794), so
              the complex-level function is the regulator term methyltransferase regulator
              activity. This term is curator-authored: no human GOA row asserts it for any
              WRAD subunit; their experimental molecular-function rows are WDR5 histone
              reader rows (PMID:18840606, PMID:16600877), RBBP5 histone binding, ASH2L
              cis-regulatory region binding and DPY30 self-association. Those are not used as
              unit functions: the WDR5 pocket that binds the H3 tail is the same pocket that
              binds the KMT2 WIN motif (PMID:18840606), so its reader rows do not describe its
              role in the complex. Patel et al. (PMID:19556245) reported a weak
              methyltransferase activity of the non-SET components; it is not adopted, since
              later reconstitutions explain the dimethylation by stimulation of the SET
              domain (PMID:26886794).
            evidence:
              - source_id: PMID:16878130
                statement: The MLL1 core complex is the SET-domain catalytic subunit plus RbBP5, Ash2L and WDR5; WDR5 links the catalytic unit to the platform and to the substrate.
                supporting_text: we demonstrate that WDR5 mediates interactions of the MLL1 catalytic unit both with the common structural platform and with the histone substrate
              - source_id: PMID:19556245
                statement: The isolated MLL1 SET domain is a slow monomethyltransferase and WRAD increases its activity about 600-fold.
                supporting_text: a complex containing the MLL1 SET domain, WDR5, RbBP5, Ash2L, and DPY-30, displays a marked approximately 600-fold increase in enzymatic activity but only to the dimethyl form of H3K4
              - source_id: PMID:26886794
                statement: The RBBP5-ASH2L heterodimer binds and activates the MLL family methyltransferases, with WDR5 as the bridging molecule for MLL1.
                supporting_text: our biochemical and structural analyses reveal how RBBP5–ASH2L binds and activates MLL family methyltransferases through a conserved mechanism
              - source_id: PMID:17500065
                statement: DPY30 binds ASH2L directly, and WDR5, RBBP5, ASH2L and DPY30 form the subcomplex shared by all human Set1-like complexes.
                supporting_text: The evolutionarily conserved hDPY-30, ASH2L, RBBP5, and WDR5 likely constitute a subcomplex that is shared by all human Set1-like HMT complexes.
              - source_id: PMID:18840606
                statement: WDR5 uses its histone H3-binding pocket to bind MLL.
                supporting_text: we find that WDR5 utilizes the same pocket shown to bind histone H3 for this MLL interaction
    - order: 2
      role: SET-domain catalytic complexes (three branches, six paralogous complexes)
      node:
        id: kmt2_catalytic_complexes
        label: COMPASS-family catalytic complexes
        module_type: PROTEIN_COMPLEX
        description: >-
          The six KMT2 methyltransferases with their branch-specific subunits. Each complex
          contains one methyltransferase and the WRAD core of part 1.
        variant_sets:
          - id: compass_branches
            label: SET1A/B, MLL1/2 or MLL3/4 branch
            axis: COMPASS branch (catalytic subunit subfamily and its branch-specific subunits)
            selection: ONE_OR_MORE
            variants:
              - id: set1_branch
                label: SET1A/SET1B COMPASS complexes
                module_type: PROTEIN_COMPLEX
                description: >-
                  SETD1A or SETD1B with CFP1 (CXXC1), WDR82 and HCF-1; the two complexes
                  differ only in the catalytic subunit and are the main H3K4 trimethylases
                  near transcription start sites.
                concepts:
                  - preferred_term: Set1C/COMPASS complex
                    term:
                      id: GO:0048188
                      label: Set1C/COMPASS complex
                annotons:
                  - id: set1_branch_subunits
                    label: CFP1, WDR82 and HCF-1 target the SET1 complexes to CpG-island promoters and to initiating RNA polymerase II
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: SET1A/B branch-specific subunits
                        term:
                          id: GO:0048188
                          label: Set1C/COMPASS complex
                        active_units:
                          - id: unit_cxxc1
                            label: CXXC1 (CFP1)
                            role: CXXC domain binds unmethylated CpG; directs SET1 complexes to CpG islands
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: CXXC1
                                term:
                                  id: UniProtKB:Q9P0U4
                                  label: CXXC-type zinc finger protein 1
                            function:
                              preferred_term: unmethylated CpG binding
                              term:
                                id: GO:0045322
                                label: unmethylated CpG binding
                          - id: unit_wdr82
                            label: WDR82
                            role: binds the RNA recognition motif of SETD1A and the Ser5-phosphorylated Pol II CTD, tethering SET1 complexes to initiating polymerase
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: WDR82
                                term:
                                  id: UniProtKB:Q6UXN9
                                  label: WD repeat-containing protein 82
                            function:
                              preferred_term: RNA polymerase II C-terminal domain phosphoserine binding
                              term:
                                id: GO:1990269
                                label: RNA polymerase II C-terminal domain phosphoserine binding
                          - id: unit_hcfc1_set1
                            label: HCFC1 (HCF-1)
                            role: tethers the SET1/ASH2 complex to the SIN3 deacetylase complex and to transcription factors such as VP16
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: HCFC1
                                term:
                                  id: UniProtKB:P51610
                                  label: Host cell factor 1
                            function:
                              preferred_term: protein-macromolecule adaptor activity
                              term:
                                id: GO:0030674
                                label: protein-macromolecule adaptor activity
                    locations:
                      - preferred_term: chromatin
                        term:
                          id: GO:0000785
                          label: chromatin
                    role_description: >-
                      The branch-specific subunits carry no methyltransferase function.
                      CXXC1 unmethylated CpG binding is an IDA row (PMID:10688657). WDR82 has
                      no experimental molecular-function row in human GOA; RNA polymerase II
                      C-terminal domain phosphoserine binding is curator-authored from the
                      binding assay of PMID:17998332, which found binding to the
                      Ser5-phosphorylated but not the unphosphorylated or Ser2-phosphorylated
                      CTD. HCF-1 protein-macromolecule adaptor activity follows the core
                      function of the HCFC1 gene review in this repository (IPI,
                      PMID:23629655) and the tethering reported in PMID:12670868.
                    evidence:
                      - source_id: PMID:17355966
                        statement: SET1A and SET1B complexes share CFP1, RBBP5, ASH2, WDR5 and WDR82 and differ only in the catalytic subunit.
                        supporting_text: These data reveal two human protein complexes that differ only in the identity of the catalytic histone methyltransferase.
                      - source_id: PMID:10688657
                        statement: CFP1 (hCGBP) binds CpG motifs but not methylated or mutated ones.
                        supporting_text: hCGBP fails to bind oligonucleotides in which the CpG motif is either mutated or methylated
                      - source_id: PMID:17998332
                        statement: WDR82 binds the Ser5-phosphorylated Pol II CTD and targets SETD1A-mediated H3K4 trimethylation to transcription start sites.
                        supporting_text: additionally binds to the Ser5-phosphorylated C-terminal domain of RNA polymerase II, which is involved in initiation of transcription, but does not bind to an unphosphorylated or Ser2-phosphorylated C-terminal domain
                      - source_id: PMID:18838538
                        statement: WDR82 is specific to the SET1 complexes, and the SET1 complex is a more robust H3K4 trimethylase than the MLL complexes.
                        supporting_text: Wdr82, which associates with chromatin in a histone H2B ubiquitination-dependent manner, is a specific component of Set1 complexes but not that of MLL1-4 complexes
                      - source_id: PMID:12670868
                        statement: HCF-1 tethers the SIN3 and SET1/ASH2 complexes together.
                        supporting_text: HCF-1 tethers the Sin3 and Set1/Ash2 transcriptional regulatory complexes together
                variant_sets:
                  - id: set1_catalytic_paralogs
                    label: SETD1A or SETD1B
                    axis: catalytic paralogue
                    selection: EXACTLY_ONE
                    variants:
                      - id: setd1a_catalytic
                        label: SETD1A methyltransferase
                        annotons:
