id: MODULE:plant_nlr_resistosome_signaling
title: Plant NLR resistosome activation and signalling
description: >-
  Effector-triggered immunity by plant NB-LRR receptors. Direct or indirect recognition of a pathogen
  effector switches the NB-ARC domain from ADP- to ATP-bound and drives oligomerisation into a
  resistosome. The N-terminal signalling domain then determines the output chemistry: coiled-coil (CC)
  domains assemble a funnel that acts as a calcium-permeable cation channel, whereas TIR domains assemble
  paired active sites with NAD+-cleaving activity whose nucleotide products are received by EDS1-family
  heterodimers, which in turn recruit helper RNLs that are themselves calcium channels. Both branches
  converge on Ca2+ influx and the hypersensitive response.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: PMID:41614442
    title: Molecular mechanisms of plant NLR activation and signalling.
    statement: >-
      Review (Plant J 2026) that triggered this module. It frames the CNL/TNL split, resistosome
      stoichiometries and the EDS1-RNL modules represented here; the structural and enzymatic claims below
      are grounded in the primary papers it cites.
    supporting_text: Effector recognition triggers NLR oligomerisation into complexes termed resistosomes,
      which initiate immune signalling.
  - source_id: PMID:41614442
    statement: Ca2+ signalling is the convergence point of the CNL subfamilies.
    supporting_text: Overall, different subfamilies of CNLs form calcium channels upon effector recognition,
      establishing Ca2+ signalling as a convergence point in NLR activation.
module:
  id: plant_nlr_resistosome_signaling
  label: Plant NLR resistosome signalling
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: nucleotide-binding domain, leucine rich repeat containing receptor signaling pathway
      term:
        id: GO:0035872
        label: nucleotide-binding domain, leucine rich repeat containing receptor signaling pathway
      description: >-
        The plant instance of NLR signalling. The GO term is architecture-based and carries no taxon
        constraint, so it covers plant NB-LRR receptors as well as metazoan NLRs; the metazoan instance is
        modules/nlr_signaling.yaml.
    - preferred_term: plant-type hypersensitive response
      term:
        id: GO:0009626
        label: plant-type hypersensitive response
      description: The localised cell-death output that defines effector-triggered immunity.
  context:
    taxa:
      - preferred_term: flowering plants
        term:
          id: NCBITaxon:3398
          label: Magnoliopsida
  parts:
    - order: 1
      role: effector recognition and resistosome assembly
      node:
        id: effector_recognition_resistosome
        label: Effector recognition and resistosome assembly
        module_type: REGULATORY_STEP
        description: >-
          The LRR domain, often extended by a C-terminal jelly-roll/Ig-like domain in TNLs, either binds
          the effector directly or monitors effector-induced modification of a host decoy. Recognition
          releases ADP from the NB-ARC domain; subsequent ATP binding and oligomerisation produce the
          resistosome. Stoichiometry tracks the N-terminal domain class rather than the recognition mode.
        variant_sets:
          - id: recognition_architecture
            label: Receptor architecture and recognition mode
            axis: N-terminal signalling domain class and effector recognition mode
            selection: EXACTLY_ONE
            variants:
              - id: cnl_indirect_recognition
                label: CNL with indirect recognition via a decoy kinase (ZAR1)
                module_type: REGULATORY_STEP
                description: >-
                  ZAR1 is pre-complexed with the pseudokinase RKS1 through its LRR. The Xanthomonas
                  effector AvrAC uridylylates the host kinase PBL2, and uridylylated PBL2 is recognised
                  exclusively through RKS1. Ligand binding stabilises the RKS1 activation segment, which
                  sterically blocks ADP binding by ZAR1; ATP binding then drives assembly of a wheel-like
                  pentameric resistosome.
                annotons:
                  - id: zar1_sensor
                    label: ZAR1 sensor CNL
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ZAR1
                        term:
                          id: UniProtKB:Q38834
                          label: Disease resistance RPP13-like protein 4
                    function:
                      preferred_term: immune receptor activity
                      term:
                        id: GO:0140375
                        label: immune receptor activity
                    processes:
                      - preferred_term: defense response to bacterium
                        term:
                          id: GO:0042742
                          label: defense response to bacterium
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Sensor CNL that oligomerises into the pentameric resistosome. GOA supports immune
                      receptor function indirectly via defence-response IMP annotations (PMID:28288096,
                      PMID:30948526) and plasma-membrane localisation by EXP (PMID:30948527).
                    evidence:
                      - source_id: PMID:30948526
                        statement: PBL2-UMP is recognised through RKS1 and blocks ZAR1 ADP binding.
                        supporting_text: Recognition of PBL2UMP is exclusively through RKS1, which interacts
                          with ZAR1LRR PBL2UMP binding stabilizes the RKS1 activation segment, which sterically
                          blocks ZAR1 adenosine diphosphate (ADP) binding.
                      - source_id: PMID:30948527
                        statement: The active ZAR1-RKS1-PBL2UMP complex is a wheel-like pentameric resistosome.
                        supporting_text: The cryo-electron microscopy structure reveals a wheel-like pentameric
                          ZAR1 resistosome.
                  - id: rks1_pseudokinase
                    label: RKS1 pseudokinase adaptor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RKS1 (ZRK1)
                        term:
                          id: UniProtKB:Q9SVY5
                          label: Serine/threonine-protein kinase ZRK1
                    function:
                      preferred_term: signaling adaptor activity
                      term:
                        id: GO:0035591
                        label: signaling adaptor activity
                      targets:
                        - preferred_term: ZAR1
                          term:
                            id: UniProtKB:Q38834
                            label: Disease resistance RPP13-like protein 4
                    role_description: >-
                      Pseudokinase that is constitutively bound to the ZAR1 LRR and is the actual
                      recognition surface for the modified decoy. It is an adaptor, not an active kinase,
                      in this role.
                    evidence:
                      - source_id: PMID:30948526
                        statement: ZAR1 is pre-complexed with the RKS1 pseudokinase, which binds the modified
                          decoy kinase.
                        supporting_text: the latter (PBL2UMP) acts as a ligand to activate the NLR ZAR1
                          precomplexed with the RKS1 pseudokinase
                  - id: pbl2_decoy
                    label: PBL2 uridylylated decoy kinase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PBL2
                        term:
                          id: UniProtKB:O49839
                          label: Probable serine/threonine-protein kinase PBL2
                    role_description: >-
                      Host kinase uridylylated by the effector AvrAC; the modified form is the ligand that
                      activates the ZAR1-RKS1 pair. Modelled without a function term because its role here
                      is to be modified and recognised, not to catalyse a step of this module.
                    evidence:
                      - source_id: PMID:30948526
                        statement: AvrAC uridylylates PBL2, and PBL2-UMP acts as the activating ligand.
                        supporting_text: The Xanthomonas campestris pv. campestris effector AvrAC uridylylates
                          the Arabidopsis PBL2 kinase
              - id: tnl_direct_recognition
                label: TNL with direct effector recognition (RPP1, ROQ1)
                module_type: REGULATORY_STEP
                description: >-
                  TNLs bind their effectors directly through the LRR and a C-terminal jelly-roll/Ig-like
                  domain (C-JID), and assemble into tetramers. Tetramerisation juxtaposes the TIR domains
                  through symmetric AE and asymmetric BE interfaces, creating two composite active sites
                  and switching on NAD+-cleaving activity.
                annotons:
                  - id: rpp1_tnl
                    label: RPP1 sensor TNL
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RPP1
                        term:
                          id: UniProtKB:F4J339
                          label: Probable disease resistance protein RPP1
                    function:
                      preferred_term: immune receptor activity
                      term:
                        id: GO:0140375
                        label: immune receptor activity
                    processes:
                      - preferred_term: innate immune response-activating signaling pathway
                        term:
                          id: GO:0002758
                          label: innate immune response-activating signaling pathway
                    role_description: >-
                      Sensor TNL that binds the oomycete effector ATR1 directly and tetramerises. GOA
                      carries GO:0002758 by IMP (PMID:20601497) and the NADase activity GO:0061809 by
                      IDA/IMP (PMID:38480885); the enzymatic role is modelled in part 2.
                    evidence:
                      - source_id: PMID:33273071
                        statement: ATR1 binds the C-JID and LRRs of RPP1 to induce a tetramer required for
                          NADase activity.
                        supporting_text: Biochemical and functional analyses show that ATR1 binds to the C-JID
                          and the LRRs to induce an RPP1 tetrameric assembly required for nicotinamide adenine
                          dinucleotide hydrolase (NADase) activity.
                      - source_id: PMID:33273071
                        statement: Tetramerisation creates two active sites, each an asymmetric TIR homodimer.
                        supporting_text: RPP1 tetramerization creates two potential active sites, each formed
                          by an asymmetric TIR homodimer.
                  - id: roq1_tnl
                    label: ROQ1 sensor TNL
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ROQ1
                        term:
                          id: UniProtKB:A0A290U7C4
                          label: Disease resistance protein Roq1
                    function:
                      preferred_term: immune receptor activity
                      term:
                        id: GO:0140375
                        label: immune receptor activity
                    role_description: >-
                      Nicotiana benthamiana TNL that recognises the Xanthomonas effector XopQ directly and
                      forms a tetrameric resistosome, demonstrating that the TNL mechanism is conserved
                      beyond Arabidopsis.
                    evidence:
                      - source_id: PMID:33273074
                        statement: ROQ1 binds XopQ directly and forms a tetramer that brings the TIR domains
                          together for signalling.
                        supporting_text: ROQ1 directly binds to both the predicted active site and surface
                          residues of XopQ while forming a tetrameric resistosome that brings together the TIR
                          domains for downstream immune signaling.
        annotons: []
    - order: 2
      role: resistosome output chemistry
      node:
        id: resistosome_output
        label: Resistosome output chemistry
        module_type: REGULATORY_STEP
        description: >-
          The assembled resistosome converts recognition into one of two biochemical outputs, set by the
          N-terminal domain class. CC domains refold so that the N-terminal amphipathic alpha-1 helix
          protrudes from the ring and inserts into the plasma membrane, forming a funnel that conducts
          Ca2+. TIR domains instead become NAD+-cleaving enzymes, generating nucleotide second messengers
          rather than conducting ions themselves.
        variant_sets:
          - id: output_chemistry
            label: CC channel versus TIR enzyme output
            axis: N-terminal signalling domain chemistry
            selection: EXACTLY_ONE
            variants:
              - id: cc_calcium_channel_output
                label: CC-domain calcium-permeable channel
                module_type: REACTION
                description: >-
                  In the pentameric CNL resistosome the alpha-1 helices form a funnel-shaped pore. The
                  channel is cation-selective and Ca2+-permeable, and a conserved acidic residue in the
                  pore is required both for conductance and for cell death.
                annotons:
                  - id: zar1_channel
                    label: ZAR1 resistosome calcium channel
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ZAR1
                        term:
                          id: UniProtKB:Q38834
                          label: Disease resistance RPP13-like protein 4
                    function:
                      preferred_term: calcium channel activity
                      term:
                        id: GO:0005262
                        label: calcium channel activity
                    processes:
                      - preferred_term: plant-type hypersensitive response
                        term:
                          id: GO:0009626
                          label: plant-type hypersensitive response
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      The channel is a property of the assembled pentamer rather than of a ZAR1 monomer,
                      so this annoton asserts the activity of the oligomer, grounded on its subunit. GOA
                      has no channel annotation for ZAR1; this is a module-level reading of
                      PMID:33984278 and is flagged as such rather than proposed as a new annotation.
                    evidence:
                      - source_id: PMID:33984278
                        statement: The pre-assembled ZAR1 resistosome is a calcium-permeable cation-selective
                          channel, dependent on pore residue Glu11.
                        supporting_text: Pre-assembled ZAR1 resistosome was readily incorporated into planar
                          lipid-bilayers and displayed calcium-permeable cation-selective channel activity.
                      - source_id: PMID:33984278
                        statement: Glu11-dependent Ca2+ influx leads to ROS production and cell death in planta.
                        supporting_text: we show that activation of ZAR1 in the plant cell led to Glu11-dependent
                          Ca2+ influx, perturbation of subcellular structures, production of reactive oxygen
                          species, and cell death
                      - source_id: PMID:30948527
                        statement: Fold switching releases the N-terminal amphipathic helix to form a
                          funnel required for membrane association and cell death.
                        supporting_text: Structural remodeling and fold switching during activation release the
                          very N-terminal amphipathic α helix of ZAR1 to form a funnel-shaped structure that is
                          required for the plasma membrane association, cell death triggering, and disease
                          resistance
              - id: tir_nadase_output
                label: TIR-domain NAD+ cleavage producing nucleotide second messengers
                module_type: REACTION
                description: >-
                  Paired TIR active sites cleave NAD+, releasing nicotinamide and forming a
                  glycosyl-enzyme intermediate that is resolved by water, by cyclisation, or by adduct
                  formation with ATP or ADPR. The products relevant to signalling are pRib-AMP and
                  pRib-ADP, which activate EDS1-PAD4, and ADPr-ATP and di-ADPR, which activate
                  EDS1-SAG101.
                annotons:
                  - id: tir_nadase
                    label: TNL TIR-domain NADase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RPP1
                        term:
                          id: UniProtKB:F4J339
                          label: Probable disease resistance protein RPP1
                    function:
                      preferred_term: NAD+ nucleosidase activity, cyclic ADP-ribose generating
                      term:
                        id: GO:0061809
                        label: NAD+ nucleosidase activity, cyclic ADP-ribose generating
                      substrates:
                        - preferred_term: NAD+
                          term:
                            id: CHEBI:57540
                            label: NAD(1-)
                      products:
                        - preferred_term: nicotinamide
                          term:
                            id: CHEBI:17154
                            label: nicotinamide
                    processes:
                      - preferred_term: plant-type hypersensitive response
                        term:
                          id: GO:0009626
                          label: plant-type hypersensitive response
                    role_description: >-
                      Enzymatic output of the TNL resistosome. GOA annotates RPP1 with GO:0061809 by IDA
                      and IMP (PMID:38480885), and UniProt records both NAD+ hydrolysis (RHEA:16301) and
                      2'cADPR synthesis (RHEA:75299) for the orthologous ROQ1, so the cyclising form of
                      the term is the right fit for plant TIRs.
                    evidence:
                      - source_id: PMID:35857645
                        statement: TIR-containing proteins produce pRib-AMP and pRib-ADP in vitro and in planta.
                        supporting_text: we show that TIR-containing proteins catalyze the production of
                          2'-(5''-phosphoribosyl)-5'-adenosine monophosphate (pRib-AMP) and diphosphate
                          (pRib-ADP) in vitro and in planta
                      - source_id: PMID:35857644
                        statement: TIRs also ADP-ribosylate ATP and ADPR to form ADPr-ATP and di-ADPR.
                        supporting_text: we show that TIR-containing proteins catalyze adenosine diphosphate
                          (ADP)-ribosylation of adenosine triphosphate (ATP) and ADP ribose (ADPR) through ADPR
                          polymerase-like and NADase activity, forming ADP-ribosylated ATP (ADPr-ATP) and
                          ADPr-ADPR (di-ADPR), respectively
                      - source_id: PMID:41614442
                        statement: Plant TIR NADase chemistry proceeds through a glycosyl-enzyme intermediate
                          resolved by water, cyclisation or adduct formation.
                        supporting_text: In summary, plant TIR domains possess NADase activity, where the Nam
                          moiety is cleaved and a glycosyl‐enzyme intermediate is formed.
    - order: 3
      role: second-messenger relay to helper RNLs
      optional: true
      node:
        id: eds1_rnl_relay
        label: EDS1-family receptor modules and helper RNL channels
        module_type: REGULATORY_STEP
        description: >-
          This part runs only downstream of the TIR branch. EDS1 heterodimerises with PAD4 or SAG101; the
          heterodimer is the receptor for the TIR-derived nucleotides, binding them in a pocket formed by
          the two EP domains. Ligand binding rotates the partner EP domain, which licenses association
          with a helper RNL through the RNL LRR domain. The recruited RNL is itself a Ca2+-permeable
          channel, so the TIR branch reaches the same Ca2+ output as the CC branch by proxy. Pairing is
          exclusive: pRib-AMP/pRib-ADP select EDS1-PAD4-ADR1, ADPr-ATP/di-ADPR select EDS1-SAG101-NRG1.
        variant_sets:
          - id: eds1_rnl_modules
            label: EPA versus ESN signalling module
            axis: EDS1 partner, ligand specificity and helper RNL
            selection: EXACTLY_ONE
            variants:
              - id: epa_module
                label: EDS1-PAD4-ADR1 (EPA) module
                module_type: REGULATORY_STEP
                description: >-
                  EDS1-PAD4 binds pRib-AMP and pRib-ADP; the PAD4 EP domain rotates and the heterodimer
                  recruits ADR1.
                annotons:
                  - id: eds1_pad4_receptor
                    label: EDS1-PAD4 second-messenger receptor
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: EDS1-PAD4 heterodimer
                        term:
                          id: GO:0106093
                          label: EDS1 disease-resistance complex
                        active_units:
                          - id: epa_eds1
                            label: EDS1
                            role: Shared lipase-like subunit contributing one half of the ligand pocket
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: EDS1
                                term:
                                  id: UniProtKB:Q9SU72
                                  label: Protein EDS1
                          - id: epa_pad4
                            label: PAD4
                            role: Partner whose EP domain rotates on ligand binding and mediates most of the
                              ADR1 interface
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: PAD4
                                term:
                                  id: UniProtKB:Q9S745
                                  label: Lipase-like PAD4
                    function:
                      preferred_term: signaling adaptor activity
                      term:
                        id: GO:0035591
                        label: signaling adaptor activity
                      targets:
                        - preferred_term: ADR1
                          term:
                            id: UniProtKB:Q9FW44
                            label: Disease resistance protein ADR1
                    locations:
                      - preferred_term: nucleus
                        term:
                          id: GO:0005634
                          label: nucleus
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Ligand-gated adaptor. The EDS1 and PAD4 gene reviews both select GO:0035591, and
                      GOA places EDS1-family proteins in GO:0106093 by IDA (PMID:16040633), so the
                      complex-level grounding and the adaptor function are both curator-supported.
                    evidence:
                      - source_id: PMID:35857645
                        statement: EDS1-PAD4 is the receptor for pRib-AMP and pRib-ADP and is allosterically
                          promoted to interact with ADR1-L1 but not NRG1A.
                        supporting_text: Biochemical and structural data demonstrate that EDS1-PAD4 is a receptor
                          complex for pRib-AMP and pRib-ADP, which allosterically promote EDS1-PAD4 interaction
                          with ADR1-L1 but not NRG1A.
                      - source_id: PMID:41614442
                        statement: pRib-ADP binding rotates the PAD4 EP domain by about 20 degrees.
                        supporting_text: upon pRib‐ADP binding at the pocket formed by EP domains of EDS1 and
                          PAD4, the EP domain of PAD4 undergoes ~20° rotation
                  - id: adr1_channel
                    label: ADR1 helper RNL channel
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ADR1
                        term:
                          id: UniProtKB:Q9FW44
                          label: Disease resistance protein ADR1
                    function:
                      preferred_term: calcium channel activity
                      term:
                        id: GO:0005262
                        label: calcium channel activity
                    processes:
                      - preferred_term: plant-type hypersensitive response
                        term:
                          id: GO:0009626
                          label: plant-type hypersensitive response
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Helper RNL recruited by EDS1-PAD4. Channel activity requires conserved negatively
                      charged N-terminal residues, mirroring the CC funnel of sensor CNLs.
                    evidence:
                      - source_id: PMID:34140391
                        statement: ADR1-mediated Ca2+ influx and cell death require conserved negatively charged
                          N-terminal residues, and helper NLRs form Ca2+-permeable cation channels.
                        supporting_text: Ca2+ influx and cell death mediated by NRG1.1 and ACTIVATED DISEASE
                          RESISTANCE 1 (ADR1), another helper NLR, required conserved negatively charged
                          N-terminal residues.
                      - source_id: PMID:34099661
                        statement: EDS1-PAD4 associates with ADR1 in the immune-activated state.
                        supporting_text: An EDS1-SAG101 complex interacts with NRG1, and EDS1-PAD4 with ADR1,
                          in an immune-activated state.
              - id: esn_module
                label: EDS1-SAG101-NRG1 (ESN) module
                module_type: REGULATORY_STEP
                description: >-
                  EDS1-SAG101 binds ADPr-ATP and di-ADPR; the SAG101 EP domain rotates and the heterodimer
                  recruits NRG1A through its LRR and WHD.
                annotons:
                  - id: eds1_sag101_receptor
                    label: EDS1-SAG101 second-messenger receptor
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: EDS1-SAG101 heterodimer
                        term:
                          id: GO:0106093
                          label: EDS1 disease-resistance complex
                        active_units:
                          - id: esn_eds1
                            label: EDS1
                            role: Shared lipase-like subunit contributing one half of the ligand pocket
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: EDS1
                                term:
                                  id: UniProtKB:Q9SU72
                                  label: Protein EDS1
                          - id: esn_sag101
                            label: SAG101
                            role: Partner whose EP domain rotates on ligand binding and forms the NRG1A
                              interface
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: SAG101
                                term:
                                  id: UniProtKB:Q4F883
                                  label: Senescence-associated carboxylesterase 101
                    function:
                      preferred_term: signaling adaptor activity
                      term:
                        id: GO:0035591
                        label: signaling adaptor activity
                      targets:
                        - preferred_term: NRG1.1
                          term:
                            id: UniProtKB:Q9FKZ1
                            label: Probable disease resistance protein At5g66900
                    locations:
                      - preferred_term: nucleus
                        term:
                          id: GO:0005634
                          label: nucleus
                    role_description: >-
                      Ligand-gated adaptor for the NRG1 branch. SAG101 is annotated to GO:0106093 by IDA
                      and to the nucleus by IDA (PMID:16040633), supporting both the complex and its
                      location.
                    evidence:
                      - source_id: PMID:35857644
                        statement: ADPr-ATP or di-ADPR binding allosterically promotes EDS1-SAG101 interaction
                          with NRG1A.
                        supporting_text: Specific binding of ADPr-ATP or di-ADPR allosterically promotes
                          EDS1-SAG101 interaction with helper NLR N requirement gene 1A (NRG1A) in vitro and in
                          planta.
                      - source_id: PMID:34099661
                        statement: NRG1 interacts with EDS1 and SAG101, but not PAD4, on effector recognition.
                        supporting_text: we show effector recognition-dependent interaction of NRG1 with EDS1
                          and SAG101, but not PAD4.
                  - id: nrg1_channel
                    label: NRG1 helper RNL channel
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NRG1.1
                        term:
                          id: UniProtKB:Q9FKZ1
                          label: Probable disease resistance protein At5g66900
                    function:
                      preferred_term: calcium channel activity
                      term:
                        id: GO:0005262
                        label: calcium channel activity
                    processes:
                      - preferred_term: plant-type hypersensitive response
                        term:
                          id: GO:0009626
                          label: plant-type hypersensitive response
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Helper RNL recruited by EDS1-SAG101. Accession Q9FKZ1 is At5g66900, confirmed as
                      NRG1.1 from the construct description in PMID:34099661; UniProt gene-name search for
                      "NRG1" does not retrieve it, so the mapping is recorded here explicitly.
                    evidence:
                      - source_id: PMID:34140391
                        statement: Active NRG1.1 oligomerises, is enriched in plasma-membrane puncta and confers
                          cytoplasmic Ca2+ influx.
                        supporting_text: Active NRG1.1 oligomerized, was enriched in plasma membrane puncta, and
                          conferred cytoplasmic calcium ion (Ca2+) influx in plant and human cells.
                      - source_id: PMID:34140391
                        statement: Voltage-clamp recordings show helper NLRs are Ca2+-permeable cation channels
                          that directly regulate cytoplasmic Ca2+ and cell death.
                        supporting_text: Whole-cell voltage-clamp recordings demonstrated that Arabidopsis helper
                          NLRs form Ca2+-permeable cation channels to directly regulate cytoplasmic Ca2+ levels
                          and consequent cell death.
  connections:
    - source: effector_recognition_resistosome
      target: resistosome_output
      connection_type: CAUSES
      description: Oligomerisation into the resistosome creates the CC funnel or the paired TIR active
        sites, so recognition determines which output chemistry is switched on.
    - source: resistosome_output
      target: eds1_rnl_relay
      connection_type: PROVIDES_INPUT_FOR
      description: TIR-derived nucleotides are the ligands received by the EDS1 heterodimers. This
        connection applies only to the TIR branch; the CC branch conducts Ca2+ directly and does not use
        this part, which is why part 3 is marked optional.
notes: >-
  Boundary. The module starts at effector recognition and ends at the Ca2+-conducting resistosome or
  RNL channel. Upstream PRR/PTI signalling and the downstream transcriptional and salicylate programmes
  are separate biology and are left out.

  Why one module with variant sets rather than separate CNL and TNL modules. The two branches share the
  same backbone - LRR-mediated recognition, NB-ARC nucleotide switch, oligomerisation - and converge on
  the same Ca2+ output. Splitting them would duplicate parts 1 and 2 and hide the convergence, so the
  N-terminal domain class is modelled as the variation axis instead. Part 3 is optional because it is
  reached only from the TIR variant.

  Deliberately kept as prose, not modelled as annotons:

  (1) NRC networks. The helper NRCs of asterids form hexameric resistosomes and act downstream of sensor
  CNLs without being incorporated into the active complex. The key structures (NbNRC2 PDB 9FP6, SlNRC3
  9RI9, NbNRC4 9CC8), the AVRcap1b inhibition mechanism and the inositol-phosphate cofactor come from
  very recent work and in several cases from preprints cited by PMID:41614442 (Guo et al. 2025, Seager et
  al. 2025). The activation-and-release model would also need a connection type this module cannot yet
  assert cleanly, since no hetero-oligomer between sensor and helper has been demonstrated. Revisit when
  the primary papers are published and the NRC accessions are in reviewed UniProt entries; N. benthamiana
  NRC2 has no reviewed accession at present.

  (2) Other CNL architectures. Sr35 (wheat) is a directly-recognising pentameric CNL and would fit the
  cnl_direct variant, but its only UniProt record is the unreviewed S5ABD6, whose protein name is "CNL9";
  rather than attach a confusing label, the direct-recognition CNL case is represented here by the TNL
  direct variant and by this note. MLA13 forms a heterodimer with its effector with no resistosome
  detected, and CCG10-NLRs such as RPS2 may be octameric - both are single recent reports and neither is
  modelled.

  (3) 2'cADPR. It is a biomarker of TNL activation and a plausible precursor of pRib-AMP, but it does not
  itself activate the EDS1 complexes, so it is not modelled as a messenger of this pathway.

  (4) NRG1C. The truncated NRG1C variant inhibits ESN signalling by sequestering EDS1-SAG101. This is
  negative regulation of part 3 rather than a step of it.

  Channel activities on ZAR1, ADR1 and NRG1.1 are asserted at module level from electrophysiology, and
  GOA currently carries no calcium-channel annotation for any of them. They are recorded here as module
  claims with their primary evidence; whether they should become gene annotations is a question for the
  respective gene reviews (ARATH EDS1, PAD4, RPM1 and RPS2 reviews exist; ZAR1, ADR1, NRG1.1, RPP1 and
  SAG101 have no gene folder yet).
