id: MODULE:bacterial_rna_degradation
title: Gammaproteobacterial RNase E-centered RNA degradation
description: >-
  Reusable RNA-degradation module in which RNase E initiates decay, an
  optional recruited DEAD-box helicase assists with structured substrates,
  and a 3'-to-5' exoribonuclease completes processive degradation. RhlB/RhlE
  and PNPase/RNase R are represented as lineage-variable implementations.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006402
    title: mRNA catabolic process
    statement: Grounds the RNA-decay process implemented by this module.
  - source_id: KEGG:ppu03018
    title: Pseudomonas putida KT2440 RNA degradation
    statement: >-
      Provides a broad discovery set of PSEPK RNA-metabolism proteins; module
      membership requires independent functional or interaction evidence.
  - source_id: PMID:16275923
    title: RhlB helicase rather than enolase is the beta-subunit of the Escherichia coli polynucleotide phosphorylase (PNPase)-exoribonucleolytic complex
    statement: >-
      Establishes direct RhlB-PNPase coupling during degradation of structured
      RNA and distinguishes that functional complex from enolase association.
  - source_id: PMID:40096066
    title: Critical functions and key interactions mediated by the RNase E scaffolding domain in Pseudomonas aeruginosa
    statement: >-
      Maps Pseudomonas RNase E scaffold interactions with RhlB and PNPase.
  - source_id: PMID:15705581
    title: Exoribonuclease R interacts with endoribonuclease E and an RNA helicase in the psychrotrophic bacterium Pseudomonas syringae Lz4W.
    statement: >-
      Establishes a same-genus RNase E-RhlE-RNase R degradation-complex variant.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_rna_degradation__ppu03018-deep-research-openscientist.md
    title: OpenScientist PSEPK RNase E-centered RNA degradation review
    statement: >-
      Species-aware synthesis of the pathway boundary, partner alternatives,
      and evidence for the selected PSEPK proteins.
  - source_id: file:PSEPK/rne/rne-ai-review.yaml
    title: PSEPK rne annotation review
    statement: Curated review of the initiating RNase E activity.
  - source_id: file:PSEPK/rhlB/rhlB-ai-review.yaml
    title: PSEPK rhlB annotation review
    statement: Curated review of the RhlB helicase implementation.
  - source_id: file:PSEPK/rhlE/rhlE-ai-review.yaml
    title: PSEPK rhlE annotation review
    statement: Curated review of the alternative RhlE helicase implementation.
  - source_id: file:PSEPK/pnp/pnp-ai-review.yaml
    title: PSEPK pnp annotation review
    statement: Curated review of the PNPase exonuclease implementation.
  - source_id: file:PSEPK/rnr/rnr-ai-review.yaml
    title: PSEPK rnr annotation review
    statement: Curated review of the alternative RNase R implementation.
notes: >-
  The boundary is RNase E-mediated cleavage plus conditional helicase-assisted
  and exonuclease-mediated RNA decay. It does not reproduce the broad KEGG
  bucket: RppH priming, PAP I, Hfq regulation, polyphosphate metabolism,
  chaperones, RecQ, Rho, and ribosome-biogenesis machinery are adjacent but
  outside this module. Enolase is excluded because its physical association
  has not been established for the PSEPK realization. The helicase part is
  optional because not every RNA substrate requires unwinding and exact
  partner composition varies among Gammaproteobacteria. Connections describe
  functional flow rather than an obligatory sequence for every substrate.
  Molecular functions are asserted only on leaf annotons.
