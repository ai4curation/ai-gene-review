id: MODULE:bacterial_rna_degradation
title: Gammaproteobacterial RNase E-centered RNA degradation
description: >-
  Reusable gammaproteobacterial RNA-degradation module in which the
  membrane-associated endoribonuclease RNase E initiates decay by 5'-end-
  dependent internal cleavage and its disordered C-terminal scaffold recruits
  a DEAD-box helicase and a processive 3'-to-5' exoribonuclease. The helicase
  unwinds structured decay intermediates so that the exonuclease can complete
  degradation. The canonical Escherichia coli degradosome uses RhlB and the
  phosphorolytic PNPase; RhlE and the hydrolytic RNase R are alternative
  partners in Pseudomonas, so helicase and exonuclease identity are modeled as
  lineage-variable implementations.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0006402
    title: mRNA catabolic process
    statement: Grounds the RNA-decay process implemented by this module.
  - source_id: KEGG:ppu03018
    title: Pseudomonas putida KT2440 RNA degradation
    statement: >-
      Provides a broad discovery set of PSEPK RNA-metabolism proteins; module
      membership requires independent functional or interaction evidence.
  - source_id: PMID:16275923
    title: RhlB helicase rather than enolase is the beta-subunit of the Escherichia coli polynucleotide phosphorylase (PNPase)-exoribonucleolytic complex
    statement: >-
      Establishes direct RhlB-PNPase coupling during degradation of structured
      RNA and distinguishes that functional complex from enolase association.
  - source_id: PMID:40096066
    title: Critical functions and key interactions mediated by the RNase E scaffolding domain in Pseudomonas aeruginosa
    statement: >-
      Maps Pseudomonas RNase E scaffold interactions with RhlB and PNPase.
  - source_id: PMID:15705581
    title: Exoribonuclease R interacts with endoribonuclease E and an RNA helicase in the psychrotrophic bacterium Pseudomonas syringae Lz4W.
    statement: >-
      Establishes a same-genus RNase E-RhlE-RNase R degradation-complex variant.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_rna_degradation__ppu03018-deep-research-openscientist.md
    title: OpenScientist PSEPK RNase E-centered RNA degradation review
    statement: >-
      Species-aware synthesis of the pathway boundary, partner alternatives,
      and evidence for the selected PSEPK proteins.
  - source_id: file:PSEPK/rne/rne-ai-review.yaml
    title: PSEPK rne annotation review
    statement: Curated review of the initiating RNase E activity.
  - source_id: file:PSEPK/rhlB/rhlB-ai-review.yaml
    title: PSEPK rhlB annotation review
    statement: Curated review of the RhlB helicase implementation.
  - source_id: file:PSEPK/rhlE/rhlE-ai-review.yaml
    title: PSEPK rhlE annotation review
    statement: Curated review of the alternative RhlE helicase implementation.
  - source_id: file:PSEPK/pnp/pnp-ai-review.yaml
    title: PSEPK pnp annotation review
    statement: Curated review of the PNPase exonuclease implementation.
  - source_id: file:PSEPK/rnr/rnr-ai-review.yaml
    title: PSEPK rnr annotation review
    statement: Curated review of the alternative RNase R implementation.
  - source_id: PMID:7891559
    title: A protein complex mediating mRNA degradation in Escherichia coli.
    statement: >-
      Identifies the E. coli multiprotein complex containing RNase E and PNPase
      that mediates mRNA degradation.
  - source_id: PMID:8610017
    title: A DEAD-box RNA helicase in the Escherichia coli RNA degradosome.
    statement: >-
      Identifies RhlB as the degradosome helicase whose ATP-dependent activity
      aids PNPase degradation of structured RNA.
  - source_id: PMID:15554979
    title: 'The RNase E of Escherichia coli has at least two binding sites for DEAD-box RNA helicases: functional replacement of RhlB by RhlE.'
    statement: >-
      Shows a second helicase-binding site on RNase E and that RhlE can replace
      RhlB in a reconstituted scaffold-PNPase complex.
  - source_id: PMID:15664199
    title: An important role for RNase R in mRNA decay.
    statement: >-
      Establishes RNase R as a 3'-to-5' exoribonuclease of mRNA decay that
      removes structured fragments.
  - source_id: file:ECOLI/rne/rne-ai-review.yaml
    title: E. coli K-12 rne annotation review
    statement: Curated review of the reference RNase E (scaffold and catalytic activity).
  - source_id: file:ECOLI/rhlB/rhlB-ai-review.yaml
    title: E. coli K-12 rhlB annotation review
    statement: Curated review of the reference degradosome helicase RhlB.
  - source_id: file:ECOLI/rhlE/rhlE-ai-review.yaml
    title: E. coli K-12 rhlE annotation review
    statement: Curated review of RhlE, a ribosome-assembly helicase that can substitute for RhlB in reconstitution.
  - source_id: file:ECOLI/pnp/pnp-ai-review.yaml
    title: E. coli K-12 pnp annotation review
    statement: Curated review of the reference degradosome exonuclease PNPase.
  - source_id: file:ECOLI/rnr/rnr-ai-review.yaml
    title: E. coli K-12 rnr annotation review
    statement: Curated review of RNase R, the hydrolytic structured-RNA exonuclease.
notes: >-
  The boundary is RNase E-mediated cleavage plus conditional helicase-assisted
  and exonuclease-mediated RNA decay. It does not reproduce the broad KEGG
  bucket: RppH priming, PAP I, Hfq regulation, polyphosphate metabolism,
  chaperones, RecQ, Rho, and ribosome-biogenesis machinery are adjacent but
  outside this module. Enolase is excluded because its physical association
  has not been established for the PSEPK realization and it contributes no
  catalytic step to decay. The scope is Gammaproteobacteria: RNase E with a
  partner-recruiting C-terminal scaffold is the shared organizing principle
  there, while partner composition differs further afield and Firmicutes
  degrade RNA through RNase Y/J instead of RNase E, so a broader taxon would
  not share this decomposition. E. coli K-12 and P. putida KT2440 are the
  exemplars; every grounded protein has a complete gene review. The helicase
  part is optional because not every substrate requires unwinding. E. coli
  RhlE is primarily a ribosome-assembly helicase and replaces RhlB only in
  reconstitution; it is the characterised RhlE-subfamily exemplar for the
  Pseudomonas RhlE-containing variant, not a claim that E. coli RhlE is a
  degradosome subunit in vivo. Likewise E. coli RNase R acts in mRNA decay but
  is not a stable degradosome subunit. Family descriptors use InterPro entries
  (IPR028878, IPR023554, IPR028622, IPR012162, IPR011805) rather than PANTHER:
  the member PANTHER families (PTHR30001, PTHR47959, PTHR11252, PTHR23355) are
  reviewed, but their subfamilies do not isolate the degradosome forms
  (PTHR30001:SF1 includes a plastid RNE and SF0 mixes RNase G with non-gamma
  RNase E; PTHR47959:SF13 mixes RhlE with eukaryotic gemin3, MRH4 and DDX31;
  PTHR23355:SF9 groups RNase R with eukaryotic DIS3L2). PNPase is annotated
  with polyribonucleotide nucleotidyltransferase activity rather than
  GO:0000175, which GO places under hydrolytic exonuclease activity.
  Connections describe functional flow rather than an obligatory sequence for
  every substrate. Molecular functions are asserted only on leaf annotons.
