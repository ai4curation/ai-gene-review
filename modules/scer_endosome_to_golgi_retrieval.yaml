id: MODULE:scer_endosome_to_golgi_retrieval
title: Budding yeast (S. cerevisiae) endosome-to-Golgi retrieval by SNX-BAR coats and the dynamin Vps1
description: >-
  Saccharomyces cerevisiae returns transmembrane proteins from endosomes to the trans-Golgi network
  in tubular carriers. A sorting-nexin coat deforms the endosomal membrane into a tubule and sorts cargo
  into it, and the dynamin-related GTPase Vps1 cuts the tubule free. Two coat routes are modelled. In the
  retromer route the cargo-selective subcomplex Vps35-Vps26-Vps29 reads bipartite sorting signals in
  cargo tails such as that of the CPY receptor Vps10, and the SNX-BAR heterodimer Vps5-Vps17 binds the
  subcomplex through the Vps5 N-terminal tail and bends the membrane. In the Mvp1 route the SNX-BAR protein
  Mvp1 deforms the membrane, sorts its own cargo (for example Vps55) and recruits Vps1. Grounded in
  GO:0042147 (retrograde transport, endosome to Golgi).
status: DRAFT
scope: CONCRETE
evidence:
- source_id: GO:0042147
  title: retrograde transport, endosome to Golgi
  statement: The module is grounded in the GO biological process for retrograde transport from endosomes
    to the trans-Golgi network.
- source_id: PMID:9700157
  title: A membrane coat complex essential for endosome-to-Golgi retrograde transport in yeast.
  statement: Defines yeast retromer as two subcomplexes with distinct jobs, cargo selection and coat assembly.
  supporting_text: Based on these findings we propose a model in which Vps35p/Vps29p/Vps26p function to select
    cargo for retrieval, and Vps5p/Vps17p assemble onto the membrane to promote vesicle formation.
- source_id: PMID:34524084
  title: A PX-BAR protein Mvp1/SNX8 and a dynamin-like GTPase Vps1 drive endosomal recycling.
  statement: Mvp1 runs a second SNX-BAR recycling route, distinct from retromer, that also ends with Vps1
    scission.
  supporting_text: the SNX-BAR protein, Mvp1, mediates an endosomal recycling pathway that is mechanistically
    distinct from the retromer and Snx4 pathways
- source_id: PMID:24567361
  title: Fission of SNX-BAR-coated endosomal retrograde transport carriers is promoted by the dynamin-related
    protein Vps1.
  statement: Vps1 cuts the SNX-BAR-coated tubules that carry retrograde cargo out of the endosome.
  supporting_text: Vps1 is required for fission of cargo-containing, SNX-BAR–coated tubules from the endosome.
- source_id: gomodel:693b3c0900002174
  title: retrograde transport endosome to Golgi (GO:0042147) (partial)
  statement: >-
    Orthologous S. pombe GO-CAM. It models the retromer cargo-selective complex (cargo adaptor activity,
    GO:0140312) upstream of the retromer tubulation complex (membrane bending activity, GO:0180020, part of
    endosome membrane tubulation), with Snx3 as a protein-membrane adaptor upstream of the cargo-selective
    complex. It has no dynamin step. Cited as cross-species support for the decomposition, not pinned to the
    S. cerevisiae annotons.
notes: >-
  Decomposition. The retrieval process is split into a cargo-sorting tubule coat (part 1) and carrier
  scission (part 2). The coat is a variant set of routes, because Mvp1 recycles a different cargo set by
  a mechanism distinct from retromer (PMID:34524084), and both routes use Vps1 (PMID:24567361, PMID:34524084).
  Retromer is modelled as its two subcomplexes, so that cargo adaptor activity sits on the cargo-selective
  subcomplex and membrane bending on the tubulation complex. The SGD/ComplexPortal pentamer (GO:0030904)
  is given as the route's concept. This follows the member reviews: the Vps35, Pep8 (Vps26) and Vps29
  reviews accept contributes_to cargo adaptor activity, and the Vps5 review marks that term over-annotated
  for the SNX-BAR subunit. Vps10 is a cargo of the retromer route (and the reference cargo of the field),
  not a participant. Its own receptor activity belongs to the CPY sorting pathway, outside this module.
  Left out of the module, pending gene reviews: the cargo-specific adaptor Snx3/Grd19 (PMID:17420293); the
  Snx4-Atg20/Snx41 route; Ypt7, which recruits the cargo-selective subcomplex and is displaced when the
  SNX-BAR coat assembles (PMID:28100638); the Atg18 CROP complex, which competes with Vps5-Vps17 for the
  subcomplex; and the Golgi-side GARP tethering and SNARE fusion steps. Member reviews:
  genes/yeast/{VPS35,PEP8,VPS29,VPS5,VPS17,MVP1,PEP1,VPS1}.
