                    evidence:
                      - source_id: PMID:40168997
                        title: Sequential membrane- and protein-bound organelles compartmentalize genomes during phage infection.
                        statement: Establishes the EPI vesicle as a functional precursor compartment.
                        supporting_text: >-
                          Early phage genes are expressed from the EPI vesicle,
                          demonstrating its functionality as a prokaryotic,
                          transcriptionally active, membrane-bound organelle.
                      - source_id: PMID:40168997
                        statement: >-
                          Establishes the ordering: transfer into the phage
                          nucleus is a precondition for genome replication.
                        supporting_text: >-
                          We also show that the phage nucleus is essential, with
                          genome replication beginning after the injected DNA is
                          transferred from the EPI vesicle to the phage nucleus.
    - order: 2
      role: host system recruitment
      node:
        id: vf_host_recruitment
        label: Recruitment and remodelling of host systems around the factory
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The factory is not self-sufficient. It draws in host membranes and
          lipids for its boundary, host cytoskeleton for its position and
          structural integrity, host mitochondria for the ATP its
          morphogenesis consumes, and in some lineages host transcription
          factors it does not encode. These recruitments are modelled as a
          variant set because different viruses recruit different subsets, not
          as a fixed sequence.
        evidence:
          - source_id: PMID:42734359
            statement: Source review framing for this part.
            supporting_text: >-
              VFs recruit host lipids, cytoskeletal elements, and metabolic
              enzymes, effectively reprogramming the intracellular environment to
              favor viral replication.
        variant_sets:
          - id: vf_recruited_host_system_axis
            label: Recruited host system
            axis: host system co-opted by the factory
            selection: ONE_OR_MORE
            variants:
              - id: vf_intermediate_filament_cage
                label: Intermediate filament cage around the factory
                module_type: MODULE
                description: >-
                  Vimentin collapses from its dispersed cytoplasmic network into
                  a cage surrounding the perinuclear factory, the same
                  rearrangement the cell makes around an aggresome. This is the
                  strongest evidence that factories of the large cytoplasmic DNA
                  viruses co-opt a pre-existing host response rather than
                  building a structure from scratch.
                annotons:
                  - id: vf_vimentin_cage
                    label: Host vimentin forming the factory cage
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: human vimentin
                        term:
                          id: UniProtKB:P08670
                          label: Vimentin
                        description: >-
                          Host, not viral: this annoton records a host protein
                          recruited by the factory.
                    function:
                      preferred_term: structural constituent of cytoskeleton
                      term:
                        id: GO:0005200
                        label: structural constituent of cytoskeleton
                    locations:
                      - preferred_term: intermediate filament
                        term:
                          id: GO:0005882
                          label: intermediate filament
                    role_description: >-
                      Structural cage enclosing the factory; required for the
                      structural integrity of ASFV and Ebola virus factories.
                      Assembly of both the cage and the factory requires an
                      intact microtubule network and occurs near the microtubule
                      organizing center.
                    evidence:
                      - source_id: PMID:11331297
                        title: Aggresomes resemble sites specialized for virus assembly.
                        statement: >-
                          Establishes the vimentin cage and mitochondrial
                          recruitment as shared between aggresomes and ASFV
                          factories.
                        supporting_text: >-
                          Both structures caused rearrangement of intermediate
                          filaments and the collapse of vimentin into
                          characteristic cages, and both recruited mitochondria
                          and cellular chaperones.
              - id: vf_mitochondrial_recruitment
                label: Mitochondrial recruitment to the factory periphery
                module_type: MODULE
                description: >-
                  Mitochondria migrate en masse along microtubules to the
                  factory and cluster at its periphery, adopting the
                  ultrastructure of actively respiring organelles. The
                  recruitment is selective for factories containing assembling
                  particles rather than precursor membranes, consistent with
                  supplying the ATP that morphogenesis consumes.
                annotons:
                  - id: vf_mitochondrion_recruitment
                    label: Directed migration of host mitochondria to the factory
                    participant:
                      selector_type: ANY_PARTICIPANT
                      description: >-
                        The viral factor that triggers or targets the migration
                        is unidentified; see the module-level knowledge gap.
                    locations:
                      - preferred_term: host cell mitochondrion
                        term:
                          id: GO:0033650
                          label: host cell mitochondrion
                    role_description: >-
                      Places an ATP source immediately outside the factory
                      boundary during the assembly phase.
                    evidence:
                      - source_id: PMID:9696857
                        title: Migration of mitochondria to viral assembly sites in African swine fever virus-infected cells.
                        statement: Establishes active, directed recruitment rather than passive co-localisation.
                        supporting_text: >-
                          Immunofluorescence microscopy revealed that these
                          accumulations of mitochondria are originated by a
                          massive migration of the organelle to the virus
                          assembly sites.
                      - source_id: PMID:9696857
                        statement: >-
                          Supports selectivity for assembly-stage factories, the
                          basis for the energetic interpretation.
                        supporting_text: >-
                          These clusters surround viral factories that contain
                          assembling particles but not factories where only
                          precursor membranes are seen.
              - id: vf_lipid_microenvironment
                label: Host lipid-kinase recruitment generating a distinct membrane lipid composition
                module_type: MODULE
                description: >-
                  Picornaviral and some flaviviral replication organelles are
                  not merely shaped host membrane but chemically distinct from
                  it: viral proteins redirect Arf1/GBF1 effector recruitment to
                  enrich the organelle in phosphatidylinositol-4-phosphate,
                  which the viral RNA polymerase binds directly.
                annotons:
                  - id: vf_pi4k_recruitment
                    label: Host phosphatidylinositol 4-kinase generating the PI4P-rich factory membrane
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: human phosphatidylinositol 4-kinase beta (PI4KB)
                        term:
                          id: UniProtKB:Q9UBF8
                          label: Phosphatidylinositol 4-kinase beta
                    function:
                      preferred_term: 1-phosphatidylinositol 4-kinase activity
                      term:
                        id: GO:0004430
                        label: 1-phosphatidylinositol 4-kinase activity
                    role_description: >-
                      Host enzyme recruited to the nascent replication organelle;
                      its product PI4P both defines the organelle's lipid
                      identity and is the direct binding partner of the viral
                      RNA-dependent RNA polymerase, coupling membrane composition
                      to polymerase localisation.
                    evidence:
                      - source_id: PMID:20510927
                        title: Viral reorganization of the secretory pathway generates distinct organelles for RNA replication.
                        statement: Establishes PI4P as functionally required, not merely enriched.
                        supporting_text: >-
                          The PI4P-rich lipid microenvironment is essential for
                          both enteroviral and flaviviral RNA replication;
                          PI4KIIIbeta inhibition interferes with this process; and
                          enteroviral RNA polymerases specifically bind PI4P.
              - id: vf_host_transcription_machinery_recruitment
                label: Transient recruitment of host nuclear transcription machinery
                module_type: MODULE
                description: >-
                  Marseilleviridae were assumed to be fully cytoplasmic on gene
                  content alone, but their virions do not package a transcription
                  apparatus. Instead the factory transiently draws host nuclear
                  transcription machinery out to the cytoplasm, the host nucleus
                  becoming briefly leaky and then recovering. A striking case of
                  a factory importing a function rather than encoding it.
                annotons:
                  - id: vf_nuclear_factor_recruitment
                    label: Recruitment of host nuclear transcription machinery to the cytoplasmic factory
                    participant:
                      selector_type: ANY_PARTICIPANT
                      description: >-
                        The virion-delivered factor responsible is unidentified;
                        see the module-level knowledge gap.
                    processes:
                      - preferred_term: DNA-templated viral transcription
                        term:
                          id: GO:0039695
                          label: DNA-templated viral transcription
                    locations:
                      - preferred_term: cytoplasmic viral factory
                        term:
                          id: GO:0039714
                          label: cytoplasmic viral factory
                    role_description: >-
                      Supplies the transcription activity the virion does not
                      carry, making an otherwise cytoplasmic replication cycle
                      nucleus-dependent.
                    evidence:
                      - source_id: PMID:28429720
                        title: Noumeavirus replication relies on a transient remote control of the host nucleus.
                        statement: Establishes the recruitment and its transience.
                        supporting_text: >-
                          However, instead of delivering their DNA to the nucleus,
                          the Marseilleviridae initiate their replication by
                          transiently recruiting the nuclear transcription
                          machinery to their cytoplasmic viral factory.
              - id: vf_phage_spindle_positioning
                label: Phage tubulin spindle positioning the factory and delivering capsids
                module_type: MODULE
                description: >-
                  The bacterial counterpart of cytoskeletal recruitment, except
                  that the cytoskeleton is virus-encoded: a tubulin-like protein
                  builds a bipolar spindle that centres the phage nucleus and
                  later trafficks empty capsids to its surface for packaging.
                annotons:
                  - id: vf_phuz_spindle
                    label: PhuZ spindle centring the phage nucleus
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PhuZ phage tubulin
                        description: Grounded by representative members; not in PANTHER.
                        representative_members:
                          - preferred_term: PhuZ (Pseudomonas phage 201phi2-1 phage tubulin)
                            term:
                              id: UniProtKB:B3FK34
                              label: Phage tubulin-like protein
                          - preferred_term: PhuZ (Pseudomonas phage phiKZ phage tubulin)
                            term:
                              id: UniProtKB:Q8SDC3
                              label: Phage tubulin-like protein
                    function:
                      preferred_term: GTPase activity
                      term:
                        id: GO:0003924
                        label: GTPase activity
                      description: >-
                        Curated in UniProt. Dynamic instability, and hence GTP
                        hydrolysis, is required for correct positioning.
                    processes:
                      - preferred_term: positive regulation of viral life cycle
                        term:
                          id: GO:1903902
                          label: positive regulation of viral life cycle
                    locations:
                      - preferred_term: host cell cytoplasm
                        term:
                          id: GO:0030430
                          label: host cell cytoplasm
                    role_description: >-
                      Positions the compartment at midcell by pushing, and later
                      delivers cytoplasmically assembled capsids to the shell
                      surface for genome packaging.
                    evidence:
                      - source_id: PMID:22726436
                        title: A phage tubulin assembles dynamic filaments by an atypical mechanism to center viral DNA within the host cell.
                        statement: Establishes the positioning function.
                        supporting_text: >-
                          PhuZ forms a filamentous array that is required for
                          positioning phage DNA within the bacterial cell.
                      - source_id: PMID:22726436
                        statement: Establishes that filament dynamics, not mere presence, is what is required.
                        supporting_text: >-
                          Correct positioning to the cell center and optimal phage
                          reproduction only occur when the PhuZ filament is
                          dynamic.
    - order: 3
      role: viral transcription within the factory
      node:
        id: vf_transcription
        label: Viral transcription inside the factory
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Transcription occurs at defined sites within the factory, and its
          products leave. Where the geometry has been resolved - mimivirus and
          the phage nucleus - transcription is physically separated from
          translation, which occurs in a ring or zone immediately outside the
          compartment. That separation is a defining property of the factory
          rather than an incidental one, and it is the observation the viral
          eukaryogenesis argument rests on.
        concepts:
          - preferred_term: viral transcription
            term:
              id: GO:0019083
              label: viral transcription
        evidence:
          - source_id: PMID:40511921
            title: Mimivirus transcription and translation occur at well-defined locations within amoeba host cells.
            statement: Establishes spatially defined intra-factory transcription and extra-factory translation.
            supporting_text: >-
              Although viral mRNA localization changes depend on the infection
              stage, transcription occurs at well-defined spots within the viral
              factory.
          - source_id: PMID:40511921
            statement: Establishes the translation ring outside the factory.
            supporting_text: >-
              When transported outside of the viral factory, the translation of
              viral mRNA takes place in a well-defined ring surrounding it.
          - source_id: PMID:41513996
            title: A giant virus forms a specialized subcellular environment within its amoeba host for efficient translation.
            statement: >-
              Independent confirmation that the peri-factory zone is a distinct
              translational environment, not merely where ribosomes happen to be.
            supporting_text: >-
              Using in situ labelling, we found that viral mRNAs and newly
              synthesized proteins were localized in the periphery of the viral
              factory, suggesting that APMV creates a discrete subcellular
              environment to facilitate translation.
        variant_sets:
          - id: vf_transcriptase_chemistry_axis
            label: Template chemistry of intra-factory transcription
            axis: genome template type
            selection: EXACTLY_ONE
            variants:
              - id: vf_dna_templated_transcription
                label: DNA-templated transcription
                module_type: REACTION
                concepts:
                  - preferred_term: DNA-templated viral transcription
                    term:
                      id: GO:0039695
                      label: DNA-templated viral transcription
                description: >-
                  Cytoplasmic DNA viruses (poxviruses, Nucleocytoviricota) carry
                  their own multisubunit RNA polymerase into the factory, which
                  is what allows a DNA virus to transcribe outside the nucleus at
                  all. Marseilleviridae are the exception that proves the point:
                  lacking a packaged polymerase, they must recruit the host's.
                annotons:
                  - id: vf_viral_dna_dependent_rna_polymerase
                    label: Virus-encoded DNA-directed RNA polymerase acting inside the factory
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: DNA-directed RNA polymerase activity
                        term:
                          id: GO:0003899
                          label: DNA-directed RNA polymerase activity
                    function:
                      preferred_term: DNA-directed RNA polymerase activity
                      term:
                        id: GO:0003899
                        label: DNA-directed RNA polymerase activity
                    processes:
