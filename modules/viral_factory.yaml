              - id: vf_protein_shell_boundary
                label: Self-assembled proteinaceous shell boundary (phage nucleus)
                module_type: CELLULAR_COMPONENT
                description: >-
                  The boundary is a single-layer protein lattice with ~2 nm
                  pores, built de novo by the virus rather than borrowed from the
                  host. It is selectively permeable: nucleotides and small
                  proteins enter, but ribosomes and host nucleases are excluded,
                  so transcription inside is physically separated from
                  translation outside. In Chimalliviridae this shell is preceded
                  by a transient membrane-bound compartment, making the two
                  boundary mechanisms sequential within one infection.
                notes: >-
                  Caveat carried from the source review: these phage compartments
                  are conventionally described as analogous to, rather than
                  instances of, viral factories, and GO has no term for them.
                  They are retained here as a boundary variant because they meet
                  this module's functional definition; see the module-level
                  ontology knowledge gap.
                annotons:
                  - id: vf_chimallin_shell
                    label: Chimallin nuclear shell lattice
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Chimallin (ChmA) phage nuclear shell protein
                        description: >-
                          Grounded by representative members; PANTHER does not
                          classify these phage proteins.
                        representative_members:
                          - preferred_term: ChmA (Pseudomonas phage 201phi2-1 chimallin gp105)
                            term:
                              id: UniProtKB:B3FIW8
                              label: Chimallin
                          - preferred_term: ChmA (Pseudomonas phage phiKZ chimallin gp54)
                            term:
                              id: UniProtKB:Q8SDA8
                              label: Chimallin
                    function:
                      preferred_term: structural molecule activity
                      term:
                        id: GO:0005198
                        label: structural molecule activity
                      description: >-
                        The only available molecular-function grounding; no term
                        expresses "self-assembling compartment shell subunit".
                    locations:
                      - preferred_term: host cell cytoplasm
                        term:
                          id: GO:0030430
                          label: host cell cytoplasm
                        description: >-
                          The only cellular-component term these proteins can
                          currently carry, which is the ontology gap recorded at
                          module level.
                    role_description: >-
                      Self-assembles as a flexible sheet into a closed
                      micrometre-scale compartment around the replicating phage
                      genome; the sole principal component of the shell.
                    evidence:
                      - source_id: PMID:35922510
                        title: Architecture and self-assembly of the jumbo bacteriophage nuclear shell.
                        statement: Establishes chimallin as the principal and sufficient shell component.
                        supporting_text: >-
                          we show that chimallin self-assembles as a flexible
                          sheet into closed micrometre-scale compartments.
                      - source_id: PMID:28082593
                        title: Assembly of a nucleus-like structure during viral replication in bacteria.
                        statement: >-
                          Establishes functional segregation across the shell:
                          replication and transcription inside, translation
                          outside.
                        supporting_text: >-
                          Proteins involved in DNA replication and transcription
                          localized inside the compartment, whereas proteins
                          involved in translation and nucleotide synthesis
                          localized outside.
                      - source_id: PMID:37667030
                        title: Identification of the bacteriophage nucleus protein interaction network.
                        statement: >-
                          Supports treating the shell as an interaction hub with
                          accessory components rather than a bare lattice.
                  - id: vf_epi_vesicle_precursor
                    label: Membrane-bound early phage infection vesicle preceding the shell
                    participant:
                      selector_type: ANY_PARTICIPANT
                      description: >-
                        The protein(s) that build or maintain the EPI vesicle
                        membrane compartment are not identified; the compartment
                        is defined by imaging and by the arrest phenotype.
                    processes:
                      - preferred_term: DNA-templated viral transcription
                        term:
                          id: GO:0039695
                          label: DNA-templated viral transcription
                    locations:
                      - preferred_term: host cell cytoplasm
                        term:
                          id: GO:0030430
                          label: host cell cytoplasm
                    role_description: >-
                      A transcriptionally active, membrane-bound compartment that
                      holds the injected genome before it is transferred into the
