id: MODULE:viral_factory
title: Viral factory (virus-induced replication microcompartment)
description: >-
  A viral factory (VF) is a virus-induced intracellular microcompartment that
  concentrates the viral genome, the replication and transcription machinery,
  and the structural proteins of the progeny virion into one place, raising the
  local concentration of every reactant in the replication cycle while screening
  replication intermediates from host nucleic-acid sensors and nucleases. The
  module is deliberately mechanism-neutral at its core and taxon-spanning: what
  makes a VF a VF is the compartment boundary plus the co-localised replication,
  transcription, and assembly programme, not any one way of drawing the
  boundary. Three boundary mechanisms are modelled as variants along a single
  axis - a host-membrane-derived boundary (spherules, tubes, double-membrane
  vesicles, convoluted ER), a membraneless biomolecular condensate formed by
  liquid-liquid phase separation, and a self-assembled proteinaceous shell -
  because the same downstream programme runs inside all three. Around that core
  the module places the recruitment of host systems the factory depends on
  (cytoskeleton, mitochondria, donor membranes, host lipid kinases, in some
  lineages host transcription machinery), the shielding of replication
  intermediates from host defences, non-lytic egress, and the antagonists that
  act on the factory itself.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: PMID:42734359
    title: The organization and dynamics of viral factories.
    statement: >-
      Source review for this module: defines viral factories as virus-induced
      microcompartments hosting genome replication, transcription, and virion
      assembly, and frames the membrane-bound / phase-separated / protein-shell
      diversity the module represents as a variant axis.
    supporting_text: >-
      Viral factories (VFs) are dynamic, virus-induced microcompartments that
      serve as centralized hubs in the host cell for viral genome replication,
      transcription, and virion assembly.
  - source_id: PMID:42734359
    statement: >-
      Supports modelling the compartment boundary as a variant axis rather than
      as a fixed property of the module.
    supporting_text: >-
      Some are enclosed by host-derived membranes, while others exist as
      biomolecular condensates from liquid-liquid phase separation.
  - source_id: PMID:42734359
    statement: >-
      Supports a distinct host-recruitment part alongside the viral replication
      programme.
    supporting_text: >-
      VFs recruit host lipids, cytoskeletal elements, and metabolic enzymes,
      effectively reprogramming the intracellular environment to favor viral
      replication.
  - source_id: GO:0039713
    title: viral factory
    statement: >-
      Ontology grounding for the module as a whole. The GO definition already
      carries both halves of the module's boundary: replication efficiency and
      shielding from host defences.
  - source_id: PMID:24549844
    title: Reovirus forms neo-organelles for progeny particle assembly within reorganized cell membranes.
    statement: >-
      Independent statement of the same three-part functional definition used
      here (concentration, defence evasion, coordinated release), from a dsRNA
      virus system.
    supporting_text: >-
      These highly specialized structures concentrate viral replication proteins
      and nucleic acids, prevent the activation of cell-intrinsic defenses, and
      coordinate the release of progeny particles.
notes: >-
  Scope decisions. (1) The module is ABSTRACT: the boundary it draws is the
  factory itself, which recurs across RNA and DNA viruses of eukaryotes and
  across jumbo phages of bacteria, so most leaf roles are selectors with
  orienting representative members rather than a species-specific member list.
  Representative members are examples only; where a strain-specific reference
  entry exists it is cited, and representatives within one family descriptor may
  come from different reference strains.

  (2) Phage nuclei are included as a boundary variant, with a caveat. The source
  review is explicit that the chimallin-shelled compartments of Chimalliviridae
  are "not considered true VFs", and GO has no term for them. They are modelled
  here anyway because they satisfy the module's functional definition exactly -
  a boundary that concentrates replication and transcription, excludes
  translation, and blocks host nucleases - and because treating the boundary
  mechanism as the variant axis is the whole point of the module. The caveat is
  recorded on the variant node itself, not hidden here.

  (3) Translation is deliberately outside the module. In every system where it
  has been localised - mimivirus, and the phage nucleus - translation happens
  outside the factory, and that exclusion is a property worth stating rather
  than a part to include.

  (4) Host restriction factors and virophages are grouped as one optional
  "antagonists" part rather than scattered as negative regulation on individual
  steps, because both act on the assembled factory as a unit.
knowledge_gaps:
  - gap_statement: >-
      No GO term denotes a proteinaceous (non-membrane, non-condensate) viral
      replication compartment such as the chimallin-bounded phage nucleus, and
      no term denotes the phage nuclear shell itself.
    boundary: >-
      The structure is solved and its principal component identified: the shell
      assembles primarily from chimallin (ChmA), which self-assembles into
      closed micrometre-scale compartments, and chimallin proteins carry only
      GO:0030430 host cell cytoplasm in UniProt. GO's viral-factory branch
      (GO:0039713 and descendants) is built entirely around eukaryotic
      host-cell compartments and has no prokaryotic-host member.
    gap_kind:
      - ONTOLOGY
      - CURATION
    dark_aspect: CC_DARK
    status: OPEN
    significance: >-
      Without a term, the best-characterised example of viral
      compartmentalisation outside eukaryotes cannot be annotated at all, and
      the convergence between phage nuclei and eukaryotic viral factories - the
      comparison the source review is built around - is invisible to any
      GO-based analysis.
    resolution: >-
      A cellular-component term for the phage nucleus / phage nuclear shell, and
      a decision on whether GO:0039713 viral factory should be generalised to
      prokaryotic hosts or given a sibling.
    provenance:
      - reference_id: PMID:35922510
        reference_section_type: ABSTRACT
        supporting_text: >-
          Here we find that the bacteriophage nuclear shell assembles primarily
          from one protein, which we name chimallin (ChmA).
      - reference_id: PMID:42734359
        reference_section_type: DISCUSSION
        full_text_unavailable: true
        supporting_text: >-
          These structures and organization tactics in phage infection, while
          not considered true VFs, are a tribute to the importance of
          compartmentalization in viral infection.
    proposed_terms:
      - proposed_name: phage nuclear shell
        proposed_definition: >-
          A proteinaceous shell assembled by a bacteriophage in the cytoplasm of
          its bacterial host that encloses the replicating phage genome,
          separating phage DNA replication and transcription from host
          translation machinery and from host nucleic-acid-targeting defence
          systems.
        justification: >-
          The structure is compositionally defined (chimallin/ChmA), structurally
          solved, and functionally characterised, but has no ontology grounding;
          curators can currently annotate chimallin only to host cell cytoplasm.
        proposed_parent:
          id: GO:0039713
          label: viral factory
        supported_by:
          - reference_id: PMID:35922510
            reference_section_type: ABSTRACT
            supporting_text: >-
              In response, one family of large bacteriophages uses a nucleus-like
              compartment to protect its replicating genomes by excluding host
              defence factors
          - reference_id: PMID:28082593
            reference_section_type: ABSTRACT
            supporting_text: >-
              Using fluorescence microscopy and cryo-electron tomography, we
              showed that Pseudomonas chlororaphis phage 201φ2-1 assembled a
              compartment that separated viral DNA from the cytoplasm.
  - gap_statement: >-
      GO's viral-factory compartment terms are essentially uncurated for the
      phase-separated factories, even where the scaffold protein and the
      LLPS mechanism are established.
    boundary: >-
      GO:0039713 viral factory and its cytoplasmic, nuclear and double-membrane
      vesicle children do carry reviewed UniProt annotations (reovirus mu-NS,
      HSV-1 ICP8, coronavirus pp1a), but GO:0039716 viroplasm viral factory and
      GO:0039717 spherule viral factory have none, and none of the
      best-characterised condensate scaffolds - rabies N/P, measles N/P, Ebola
      NP, rotavirus NSP2/NSP5, vaccinia H5 - carries any viral-factory term,
      although SARS-CoV-2 N does carry GO:0140693 molecular condensate scaffold
      activity.
    gap_kind:
      - CURATION
    dark_aspect: CC_DARK
    status: OPEN
    significance: >-
      The LLPS factories are where the mechanism is best understood and the
      annotation is thinnest, so any GO-based survey of viral factories will
      systematically under-represent exactly the lineages the field has moved to.
    resolution: >-
      Curate GO:0039716 / GO:0039714 (and GO:0140693 where the scaffolding role
      is demonstrated) onto the nucleoprotein/phosphoprotein pairs and viroplasm
      proteins cited in this module.
    provenance:
      - reference_id: PMID:34524703
        reference_section_type: ABSTRACT
        supporting_text: >-
          Here we show that replication factories of rotaviruses represent
          protein-RNA condensates that are formed via liquid-liquid phase
          separation of the viroplasm-forming proteins NSP5 and rotavirus RNA
          chaperone NSP2.
  - gap_statement: >-
      The viral factor(s) that recruit host mitochondria to the factory
      periphery, and the mechanism by which the Marseilleviridae virion
      transiently recruits host nuclear transcription machinery to a cytoplasmic
      factory, are both unidentified.
    boundary: >-
      Both recruitments are established phenomenologically. Mitochondrial
      clustering around the ASFV factory is a directed, microtubule-dependent
      migration, blocked by nocodazole; and Marseilleviridae virions are known
      not to carry their own transcription machinery, making the recruitment
      necessary rather than incidental. What is missing in each case is the
      identity of the protein that does the recruiting.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      These are the two host-recruitment steps the module cannot ground to any
      participant, so the host-recruitment part stays abstract exactly where the
      viral effector would be the drug target.
    resolution: >-
      Identify the viral gene products required for mitochondrial repositioning
      and for nuclear-factor recruitment (e.g. by targeted deletion combined with
      the imaging assays already established in these systems).
    provenance:
      - reference_id: PMID:9696857
        reference_section_type: ABSTRACT
        supporting_text: >-
          The clustering of mitochondria around the viral factory was blocked in
          the presence of the microtubule-disassembling drug nocodazole,
          indicating that these filaments are implicated in the transport of the
          mitochondria to the virus assembly sites.
      - reference_id: PMID:28429720
        reference_section_type: ABSTRACT
        supporting_text: >-
          Unexpectedly, we find that their virions do not incorporate the
          virus-encoded transcription machinery, making their replication
          nucleus-dependent.
module:
  id: viral_factory
  label: Viral factory (virus-induced replication microcompartment)
  module_type: ORGANELLE_LIFECYCLE
  description: >-
    Biogenesis and operation of the virus-induced compartment: a boundary is
    drawn in the host cell, host systems are recruited to and around it, viral
    transcription and genome replication run inside it, progeny virions are
    assembled and packaged within it, and replication intermediates are screened
    from host defences throughout.
  concepts:
    - preferred_term: viral factory
      term:
        id: GO:0039713
        label: viral factory
      description: >-
        The compartment itself. GO's definition already couples the two
        functions this module separates into parts: raising replication
        efficiency, and shielding the virus from host defences.
    - preferred_term: viral replication complex formation and maintenance
      term:
        id: GO:0046786
        label: viral replication complex formation and maintenance
      description: The process view of factory biogenesis.
    - preferred_term: viral replication complex
      term:
        id: GO:0019034
        label: viral replication complex
  context:
    taxa:
      - preferred_term: Viruses
        term:
          id: NCBITaxon:10239
          label: Viruses
        description: >-
          The module spans RNA and DNA viruses of eukaryotes; the protein-shell
          boundary variant extends it to jumbo phages of bacteria.
    cellular_components:
      - preferred_term: viral factory
        term:
          id: GO:0039713
          label: viral factory
      - preferred_term: host cell cytoplasm
        term:
          id: GO:0030430
          label: host cell cytoplasm
        description: >-
          The default location; nuclear factories (herpesviruses,
          adenoviruses, polyomaviruses, EBV) are the alternative and are
          modelled on the condensate and membrane variants where relevant.
    conditions:
      - preferred_term: productive infection of a host cell
        description: >-
          The factory exists only during infection; it is built, used, and
          dispersed within one replication cycle rather than inherited.
      - preferred_term: compartment boundary mechanism is lineage-specific
        description: >-
          Membrane-derived, condensate, and proteinaceous-shell boundaries are
          alternative solutions to the same problem, and a single virus may use
          more than one (SARS-CoV-2 uses double-membrane vesicles for RNA
          synthesis and a separate nucleoprotein condensate for packaging).
  parts:
    - order: 1
      role: compartment boundary formation
      node:
        id: vf_boundary
        label: Compartment nucleation and boundary formation
        module_type: CELLULAR_COMPONENT
        description: >-
          Establishment of the physical boundary that separates factory contents
          from bulk cytoplasm or nucleoplasm. The boundary is what makes the
          factory a compartment; the variants below are the three physically
          distinct ways it is drawn.
        concepts:
          - preferred_term: viral factory
            term:
              id: GO:0039713
              label: viral factory
        variant_sets:
          - id: vf_boundary_mechanism_axis
            label: Compartment boundary mechanism
            axis: physical basis of the compartment boundary
            selection: ONE_OR_MORE
            notes: >-
              ONE_OR_MORE rather than EXACTLY_ONE: coronaviruses run a
              membrane-bounded replication organelle and a separate
              nucleoprotein condensate in the same cell, and Chimalliviridae
              pass through a membrane-bound vesicle before building the protein
              shell.
            variants:
              - id: vf_membrane_boundary
                label: Host-membrane-derived boundary
                module_type: CELLULAR_COMPONENT
                description: >-
                  The boundary is a host membrane deformed by viral proteins into
                  an invagination (spherule), a tube, a double-membrane vesicle,
                  or a convoluted network. The lumen is topologically separated
                  from the cytosol, so a pore or neck is required to import
                  nucleotides and export progeny RNA.
                concepts:
                  - preferred_term: spherule viral factory
                    term:
                      id: GO:0039717
                      label: spherule viral factory
                  - preferred_term: double membrane vesicle viral factory
                    term:
                      id: GO:0039718
                      label: double membrane vesicle viral factory
                  - preferred_term: tube viral factory
                    term:
                      id: GO:0039719
                      label: tube viral factory
                annotons:
                  - id: vf_membrane_remodeling
                    label: Viral membrane-remodelling protein deforming a host organelle membrane
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: membrane bending activity
                        term:
                          id: GO:0180020
                          label: membrane bending activity
                      description: >-
                        Typically a multi-spanning or amphipathic-helix-bearing
                        non-structural protein of the replicase (coronavirus
                        nsp3/nsp4/nsp6, flavivirus NS4A/NS4B, alphavirus nsP1,
                        tombusvirus p33).
                    function:
                      preferred_term: membrane bending activity
                      term:
                        id: GO:0180020
                        label: membrane bending activity
                      targets:
                        - preferred_term: host endomembrane donating the factory boundary
                    processes:
                      - preferred_term: symbiont-mediated perturbation of host membrane
                        term:
                          id: GO:0141171
                          label: symbiont-mediated perturbation of host membrane
                    role_description: >-
                      Deforms a donor host membrane into the closed or necked
                      geometry that defines the factory lumen.
                    evidence:
                      - source_id: PMID:19380115
                        title: Composition and three-dimensional architecture of the dengue virus replication and assembly sites.
                        statement: >-
                          Establishes an ER-derived, vesicle-and-pore boundary
                          containing the dsRNA replication intermediate.
                        supporting_text: >-
                          Using electron microscopy, we find Dengue virus
                          (DENV)-induced vesicles, convoluted membranes, and
                          virus particles to be endoplasmic reticulum
                          (ER)-derived, and we detect double-stranded RNA, a
                          presumed marker of RNA replication, inside
                          virus-induced vesicles.
                  - id: vf_dmv_export_pore
                    label: Double-membrane-spanning export pore of the coronavirus replication organelle
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SARS-CoV-2 replicase polyprotein 1a (nsp3 pore component)
                        term:
                          id: UniProtKB:P0DTC1
                          label: Replicase polyprotein 1a
                        description: >-
                          Carries GO:0039718 double membrane vesicle viral
                          factory in UniProt. The pore core is a hexameric
                          assembly of a large viral transmembrane protein
                          released from this polyprotein; the original study
                          identifies nsp3 as the leading candidate subunit
                          rather than establishing it.
                    locations:
                      - preferred_term: double membrane vesicle viral factory
                        term:
                          id: GO:0039718
                          label: double membrane vesicle viral factory
                      - preferred_term: double membrane vesicle viral factory membrane
                        term:
                          id: GO:0062242
                          label: double membrane vesicle viral factory membrane
                    processes:
                      - preferred_term: double membrane vesicle viral factory assembly
                        term:
                          id: GO:0140526
                          label: double membrane vesicle viral factory assembly
                    role_description: >-
                      Solves the topological problem created by a sealed
                      membrane boundary: exports newly synthesised genomes and
                      mRNAs from the DMV lumen to the cytosol for translation
                      and packaging. No molecular-function term is asserted -
                      the pore's transport activity has not been reconstituted.
                    evidence:
                      - source_id: PMID:32763915
                        title: A molecular pore spans the double membrane of the coronavirus replication organelle.
                        statement: Establishes the pore and its role in RNA export from the sealed DMV.
                        supporting_text: >-
                          In this study, we used cellular cryo-electron
                          microscopy to visualize a molecular pore complex that
                          spans both membranes of the double-membrane vesicle and
                          would allow export of RNA to the cytosol.
                      - source_id: PMID:32511245
                        title: "A unifying structural and functional model of the coronavirus replication organelle: Tracking down RNA synthesis."
                        statement: >-
                          Establishes the DMV, rather than any other
                          virus-induced membrane structure, as the site of
                          coronaviral RNA synthesis.
                        supporting_text: >-
                          Our results provide a unifying model of the CoV RO and
                          clearly establish DMVs as the central hub for viral RNA
                          synthesis and a potential drug target in CoV infection.
                variant_sets:
                  - id: vf_membrane_donor_axis
                    label: Host organelle donating the boundary membrane
                    axis: donor organelle
                    selection: EXACTLY_ONE
                    notes: >-
                      The donor is a fixed, lineage-specific choice, which is why
                      this axis is EXACTLY_ONE while the boundary-mechanism axis
                      above is not.
                    variants:
                      - id: vf_er_ergic_donor
                        label: Endoplasmic reticulum / ERGIC-derived boundary
                        module_type: CELLULAR_COMPONENT
                        description: >-
                          Flaviviruses invaginate the rough ER into vesicle
                          packets and convoluted membranes; coronaviruses derive
                          double-membrane vesicles from the ER-Golgi
                          intermediate compartment.
                        context:
                          cellular_components:
                            - preferred_term: host cell endoplasmic reticulum
                              term:
                                id: GO:0044165
                                label: host cell endoplasmic reticulum
                            - preferred_term: host cell endoplasmic reticulum-Golgi intermediate compartment
                              term:
                                id: GO:0044172
                                label: host cell endoplasmic reticulum-Golgi intermediate compartment
                        annotons:
                          - id: vf_dengue_er_invagination
                            label: Flaviviral polyprotein driving ER invagination
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: Dengue virus 2 genome polyprotein (NS4A/NS4B membrane-remodelling region)
                                term:
                                  id: UniProtKB:P18356
                                  label: Genome polyprotein
                            locations:
                              - preferred_term: host cell endoplasmic reticulum
                                term:
                                  id: GO:0044165
                                  label: host cell endoplasmic reticulum
                            processes:
                              - preferred_term: viral RNA genome replication
                                term:
                                  id: GO:0039694
                                  label: viral RNA genome replication
                            role_description: >-
                              Representative of the flaviviral replication
                              organelle: a single ER-derived network carrying
                              both the replication vesicles and, apposed to
                              their pores, the budding sites.
                            evidence:
                              - source_id: PMID:19380115
                                statement: >-
                                  Establishes that the vesicles, convoluted
                                  membranes, and budding particles form one
                                  ER-derived network.
                                supporting_text: >-
                                  Electron tomography (ET) shows DENV-induced
                                  membrane structures to be part of one
                                  ER-derived network.
                      - id: vf_plasma_membrane_donor
                        label: Plasma-membrane-derived boundary
                        module_type: CELLULAR_COMPONENT
                        description: >-
                          Alphaviruses generate spherules by deforming the host
                          plasma membrane; in chikungunya virus these persist at
                          the plasma membrane rather than being internalised.
                        context:
                          cellular_components:
                            - preferred_term: host cell plasma membrane
                              term:
                                id: GO:0020002
                                label: host cell plasma membrane
                        annotons:
                          - id: vf_alphavirus_spherule
                            label: Alphaviral non-structural polyprotein forming a plasma-membrane spherule
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: Chikungunya virus non-structural polyprotein P1234
                                term:
                                  id: UniProtKB:Q8JUX6
                                  label: Polyprotein P1234
                                description: >-
                                  Carries GO:0020002 host cell plasma membrane in
                                  UniProt; nsP1 provides the membrane-binding
                                  amphipathic anchor and nsP4 the polymerase.
                            function:
                              preferred_term: RNA-directed RNA polymerase activity
                              term:
                                id: GO:0003968
                                label: RNA-directed RNA polymerase activity
                            locations:
                              - preferred_term: host cell plasma membrane
                                term:
                                  id: GO:0020002
                                  label: host cell plasma membrane
                            processes:
                              - preferred_term: viral RNA genome replication
                                term:
                                  id: GO:0039694
                                  label: viral RNA genome replication
                            role_description: >-
                              Both builds and occupies the spherule: the
                              replication complex sits at the spherule neck,
                              which stays open to the cytosol so nascent RNA is
                              extruded rather than exported through a pore.
                            evidence:
                              - source_id: PMID:38940586
                                title: In situ fate of Chikungunya virus replication organelles.
                                statement: >-
                                  Establishes the spherule as the
                                  membranous replication organelle housing the
                                  replication complex.
                                supporting_text: >-
                                  Replication of the viral RNA genome occurs in
                                  specialized membranous replication organelles
                                  (ROs) or spherules, which contain the viral
                                  replication complex.
                              - source_id: PMID:38940586
                                statement: >-
                                  Supports persistence and continued growth of
                                  the plasma-membrane spherule rather than its
                                  internalisation.
                                supporting_text: >-
                                  We evidence the late persistence of CHIKV ROs
                                  at the plasma membrane with a crowned protein
                                  complex at the spherule neck similar to the
                                  recently resolved replication complex.
                      - id: vf_peroxisome_donor
                        label: Peroxisome-derived boundary
                        module_type: CELLULAR_COMPONENT
                        description: >-
                          Tombusviruses build spherules on the peroxisomal
                          boundary membrane (and on the ER when peroxisomes are
                          absent), the clearest case of a factory boundary drawn
                          on an organelle unrelated to the secretory pathway.
                        context:
                          cellular_components:
                            - preferred_term: host cell peroxisome
                              term:
                                id: GO:0120149
                                label: host cell peroxisome
                        annotons:
                          - id: vf_tombusvirus_spherule
                            label: Tombusviral replication protein forming a peroxisomal spherule
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: Tomato bushy stunt virus p92 replicase (and its p33 cleavage product)
                                term:
                                  id: UniProtKB:P15962
                                  label: RNA-directed RNA polymerase
                                description: >-
                                  p33, the N-terminal product of this ORF, is the
                                  membrane-bound spherule-forming protein; p92 is
                                  the read-through polymerase.
                            function:
                              preferred_term: RNA-directed RNA polymerase activity
                              term:
                                id: GO:0003968
                                label: RNA-directed RNA polymerase activity
                            processes:
                              - preferred_term: viral RNA genome replication
                                term:
                                  id: GO:0039694
                                  label: viral RNA genome replication
                            role_description: >-
                              Membrane-anchored replicase that both nucleates the
                              spherule and carries out RNA synthesis inside it.
                            evidence:
                              - source_id: PMID:42734359
                                statement: >-
                                  Source review: places tombusvirus and
                                  bromovirus spherules on host peroxisomes and
                                  ER respectively.
                                notes: >-
                                  Claim taken from the review body. Only the
                                  abstract of this review is cached locally, so
                                  no verbatim quote is asserted here.
              - id: vf_condensate_boundary
                label: Biomolecular condensate boundary (liquid-liquid phase separation)
                module_type: CELLULAR_COMPONENT
                description: >-
                  The boundary is a phase boundary rather than a membrane: viral
                  scaffold proteins with intrinsically disordered regions, in
                  concert with the viral genome, demix from the cytoplasm or
                  nucleoplasm into a liquid condensate. Because the boundary is
                  permeable to small molecules and to diffusing macromolecules,
                  no pore is needed; concentration and selective partitioning do
                  the work instead. The recurring architecture across
                  Mononegavirales is a nucleoprotein-phosphoprotein pair, at
                  least one of which contributes an essential disordered region.
                concepts:
                  - preferred_term: viroplasm viral factory
                    term:
                      id: GO:0039716
                      label: viroplasm viral factory
                  - preferred_term: cytoplasmic viral factory
                    term:
                      id: GO:0039714
                      label: cytoplasmic viral factory
                  - preferred_term: nuclear viral factory
                    term:
                      id: GO:0039715
                      label: nuclear viral factory
                    description: >-
                      The nuclear case: EBV EBNA2/EBNALP condensates form in the
                      nucleus rather than the cytoplasm.
                annotons:
                  - id: vf_nucleoprotein_condensate_scaffold
                    label: Mononegavirales nucleoprotein condensate scaffold
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Mononegavirales nucleoprotein (N/NP)
                        description: >-
                          No PANTHER family is asserted: these are viral
                          nucleoproteins outside PANTHER's classification, so the
                          descriptor is grounded by representative members only.
                          Representatives are reference entries from different
                          strains of each virus.
                        representative_members:
                          - preferred_term: N (rabies virus nucleoprotein)
                            term:
                              id: UniProtKB:P16285
                              label: Nucleoprotein
                          - preferred_term: N (measles virus nucleoprotein)
                            term:
                              id: UniProtKB:P04851
                              label: Nucleoprotein
