    - order: 5
      role: virion assembly and genome packaging
      node:
        id: vf_assembly
        label: Virion assembly and genome packaging at the factory
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The factory's late programme. Where it has been resolved, assembly is
          spatially ordered: in giant viruses morphogenesis initiates centrally
          and matures toward the factory periphery; in jumbo phages capsids
          assemble on the cytoplasmic membrane and dock on the shell surface to
          be filled. Either way, packaging happens at the boundary, which is why
          assembly and the boundary cannot be separated into independent modules.
        concepts:
          - preferred_term: virion assembly
            term:
              id: GO:0019068
              label: virion assembly
          - preferred_term: viral genome packaging
            term:
              id: GO:0019072
              label: viral genome packaging
          - preferred_term: host cell viral assembly compartment
            term:
              id: GO:0072517
              label: host cell viral assembly compartment
        annotons:
          - id: vf_capsid_assembly
            label: Structural protein assembling the capsid within the factory
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: structural constituent of virion
                term:
                  id: GO:0039660
                  label: structural constituent of virion
              description: >-
                Typically the major capsid protein; ASFV p72 is given as an
                orienting example of an NCLDV double-jelly-roll capsid protein
                concentrated in the factory.
            function:
              preferred_term: structural constituent of virion
              term:
                id: GO:0039660
                label: structural constituent of virion
            processes:
              - preferred_term: viral capsid assembly
                term:
                  id: GO:0019069
                  label: viral capsid assembly
            locations:
              - preferred_term: host cell viral assembly compartment
                term:
                  id: GO:0072517
                  label: host cell viral assembly compartment
            role_description: >-
              Concentrated into the factory to near-exclusivity, which is the
              original observation that motivated the aggresome comparison.
            evidence:
              - source_id: PMID:11331297
                statement: >-
                  Establishes selective concentration of viral structural
                  proteins and exclusion of host proteins.
                supporting_text: >-
                  Factories exclude host proteins, suggesting that they are novel
                  subcellular structures induced by viruses.
          - id: vf_asfv_capsid_example
            label: ASFV major capsid protein p72 as a factory-assembled structural protein
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: African swine fever virus major capsid protein p72
                term:
                  id: UniProtKB:P22776
                  label: Hexon protein p72
            function:
              preferred_term: structural constituent of virion
              term:
                id: GO:0039660
                label: structural constituent of virion
            processes:
              - preferred_term: virion assembly
                term:
                  id: GO:0019068
                  label: virion assembly
            role_description: >-
              Concrete grounding for the abstract capsid role: supplies roughly a
              third of virion mass and is almost exclusively localised to the
              perinuclear factory during infection.
          - id: vf_genome_packaging_at_boundary
            label: Genome packaging into preassembled capsids at the factory boundary
            participant:
              selector_type: ANY_PARTICIPANT
              description: >-
                The packaging apparatus differs by lineage (portal/terminase in
                phages, vertex-associated machinery in NCLDVs) and is not
                resolved to a single selector here.
            processes:
              - preferred_term: viral genome packaging
                term:
                  id: GO:0019072
                  label: viral genome packaging
            role_description: >-
              In the phage nucleus the geometry is explicit: capsids assemble
              outside the compartment, are trafficked to its surface, and are
              filled there, so the shell is both the container of the genome and
              the docking surface for packaging.
            evidence:
              - source_id: PMID:28082593
                statement: Establishes packaging at the compartment surface.
                supporting_text: >-
                  Later during infection, viral capsids assembled on the
                  cytoplasmic membrane and moved to the surface of the compartment
                  for DNA packaging.
    - order: 6
      role: shielding from host defences
      node:
        id: vf_shielding
        label: Shielding of replication intermediates from host defences
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Compartmentalisation is simultaneously a concentration device and a
          concealment device, and GO's definition of a viral factory names both.
          The shielding is a consequence of the boundary rather than a separate
          machine, which is why this part carries a CAUSES edge from boundary
          formation rather than sitting in the temporal chain.
        concepts:
          - preferred_term: symbiont-mediated evasion of host immune response
            term:
              id: GO:0042783
              label: symbiont-mediated evasion of host immune response
          - preferred_term: symbiont-mediated perturbation of host defenses
            term:
              id: GO:0030682
              label: symbiont-mediated perturbation of host defenses
        variant_sets:
          - id: vf_shielding_mechanism_axis
            label: Shielding mechanism
            axis: how the boundary excludes the host defence effector
            selection: ONE_OR_MORE
            variants:
              - id: vf_nuclease_exclusion
                label: Steric exclusion of host nucleases by the protein shell
                module_type: MODULE
                description: >-
                  The cleanest demonstration that compartmentalisation alone
                  confers immunity: the phage shell blocks CRISPR-Cas and
                  restriction enzymes without any anti-CRISPR chemistry, and the
                  protection is lost when the nuclease is engineered to enter.
                  The complementary result - sensitivity to RNA-targeting Cas13a,
                  whose substrate leaves the compartment - shows the barrier is
                  spatial rather than biochemical.
                annotons:
                  - id: vf_chimallin_nuclease_exclusion
                    label: Chimallin shell excluding host CRISPR-Cas and restriction nucleases
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Chimallin (ChmA) phage nuclear shell protein
                        representative_members:
                          - preferred_term: ChmA (Pseudomonas phage phiKZ chimallin gp54)
                            term:
                              id: UniProtKB:Q8SDA8
                              label: Chimallin
                    processes:
                      - preferred_term: symbiont-mediated suppression of host CRISPR-cas system
                        term:
                          id: GO:0098672
                          label: symbiont-mediated suppression of host CRISPR-cas system
                    role_description: >-
                      Physically segregates the phage genome from host immunity
                      nucleases for the whole infection.
                    evidence:
                      - source_id: PMID:31819262
                        title: A bacteriophage nucleus-like compartment shields DNA from CRISPR nucleases.
                        statement: Establishes exclusion of Cas and restriction enzymes by the compartment.
                        supporting_text: >-
                          Cas proteins and restriction enzymes are unable to access
                          the phage DNA throughout the infection, but engineering
                          the relocalization of EcoRI inside the compartment
                          enables targeting of the phage and protection of host
                          cells.
              - id: vf_membrane_sequestration_of_replication_intermediates
                label: Membrane sequestration of double-stranded replication intermediates
                module_type: MODULE
                description: >-
                  In membrane-bounded factories the double-stranded replication
                  intermediate, the ligand for cytosolic pattern-recognition
                  receptors, sits inside a sealed lumen. This is the most widely
                  invoked - and the least directly demonstrated - shielding
                  mechanism: the dsRNA has been localised inside the vesicles,
                  but the causal link to reduced sensing is usually inferred.
                annotons:
                  - id: vf_dsrna_sequestration
                    label: Sequestration of the replication intermediate inside the factory lumen
                    participant:
                      selector_type: ANY_PARTICIPANT
                      description: >-
                        The property belongs to the compartment rather than to a
                        single gene product.
                    processes:
                      - preferred_term: symbiont-mediated evasion of host immune response
                        term:
                          id: GO:0042783
                          label: symbiont-mediated evasion of host immune response
                    locations:
                      - preferred_term: double membrane vesicle viral factory
                        term:
                          id: GO:0039718
                          label: double membrane vesicle viral factory
                    role_description: >-
                      Keeps the dsRNA replication intermediate out of the cytosol
                      where it would be sensed.
                    evidence:
                      - source_id: PMID:19380115
                        statement: >-
                          Establishes that the dsRNA intermediate is inside the
                          virus-induced vesicles.
                        supporting_text: >-
                          we detect double-stranded RNA, a presumed marker of RNA
                          replication, inside virus-induced vesicles.
                      - source_id: PMID:24549844
                        statement: Statement of the defence-evasion function of the compartment.
                        supporting_text: >-
                          prevent the activation of cell-intrinsic defenses
    - order: 7
      role: egress from the factory
      optional: true
      node:
        id: vf_egress
        label: Non-lytic egress of progeny virions from the factory
        module_type: TRANSPORT_STEP
        description: >-
          Optional because many infections end in lysis. Where non-lytic egress
          has been resolved, the route runs through host organelles recruited to
          the factory: reovirus virions pass from the inclusion into modified,
          de-acidified lysosome-derived sorting organelles that bud membranous
          carriers to the plasma membrane. Exocytosis-like release is also
          inferred for pandoraviruses and cedratviruses from vesicle
          accumulation in the absence of lysis.
        annotons:
          - id: vf_lysosomal_sorting_organelle_egress
            label: Lysosome-derived sorting organelle carrying virions out of the factory
            participant:
              selector_type: ANY_PARTICIPANT
              description: >-
                The viral factor directing lysosome recruitment and
                de-acidification is not identified.
            locations:
              - preferred_term: host cell lysosome
                term:
                  id: GO:0044187
                  label: host cell lysosome
            role_description: >-
              Receives mature virions from the inclusion through membrane-fusion
              points and delivers them to the plasma membrane in membranous
              carriers, without lysing the cell.
            evidence:
              - source_id: PMID:32356864
                title: A modified lysosomal organelle mediates nonlytic egress of reovirus.
                statement: Establishes a continuous membrane route from the factory to the cell surface.
                supporting_text: >-
                  ET of VI-SO-MC interfaces demonstrated that these compartments
                  are connected by membrane-fusion points, through which mature
                  virions are transported.
              - source_id: PMID:32356864
                statement: >-
                  Establishes that the organelle is a modified host lysosome,
                  connecting this step to the host-recruitment part.
                supporting_text: >-
                  Reovirus infection induces an increase in the number and size of
                  lysosomes and modifies the pH of these organelles from
    - order: 8
      role: antagonists of the factory
      optional: true
      node:
        id: vf_antagonists
        label: Antagonists acting on the assembled factory
        module_type: REGULATORY_STEP
        description: >-
          Two unrelated classes of antagonist converge on the factory as a unit
          rather than on any individual step: host restriction proteases that
          accumulate in replication compartments, and virophages that parasitise
          the giant-virus factory as a replication niche. Grouped as one optional
          part because both presuppose a fully formed factory.
        concepts:
          - preferred_term: negative regulation of viral genome replication
            term:
              id: GO:0045071
              label: negative regulation of viral genome replication
        annotons:
          - id: vf_fam111a_restriction
            label: Host FAM111A restricting replication in the factory
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: human serine protease FAM111A
                term:
                  id: UniProtKB:Q96PZ2
                  label: Serine protease FAM111A
                description: >-
                  Carries GO:0045071 negative regulation of viral genome
                  replication and GO:0008236 serine-type peptidase activity in
                  UniProt.
            function:
              preferred_term: serine-type peptidase activity
              term:
                id: GO:0008236
                label: serine-type peptidase activity
            processes:
              - preferred_term: negative regulation of viral genome replication
                term:
                  id: GO:0045071
                  label: negative regulation of viral genome replication
            role_description: >-
              Host range restriction factor counteracted by the SV40 large T
              antigen C-terminal region; its proteolytic activity is the presumed
              but not demonstrated basis of the restriction.
            evidence:
              - source_id: PMID:23093934
                title: Identification of FAM111A as an SV40 host range restriction and adenovirus helper factor.
                statement: Establishes FAM111A as a restriction factor targeted by SV40 LT.
                supporting_text: >-
                  FAM111A functions as a host range restriction factor that is
                  specifically targeted by SV40 LT.
          - id: vf_fam111b_restriction
            label: Host FAM111B accumulating in replication compartments
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: human serine protease FAM111B
                term:
                  id: UniProtKB:Q6SJ93
                  label: Serine protease FAM111B
            function:
              preferred_term: serine-type peptidase activity
              term:
                id: GO:0008236
                label: serine-type peptidase activity
            processes:
              - preferred_term: negative regulation of viral genome replication
                term:
                  id: GO:0045071
                  label: negative regulation of viral genome replication
            locations:
              - preferred_term: replication compartment
                term:
                  id: GO:0046809
                  label: replication compartment
            role_description: >-
              The paralog that actually restricts murine cytomegalovirus in
              primate cells, and the clearest case of a host factor localising to
              the factory itself. Present in primates and absent in rodents,
              which is why MCMV has no countermeasure for it.
            evidence:
              - source_id: PMID:39494906
                title: E2F3-dependent activation of FAM111B restricts mouse cytomegalovirus replication in primate cells.
                statement: Establishes which paralog restricts, against the prior expectation.
                supporting_text: >-
                  we demonstrated that FAM111B, but not its paralog FAM111A,
                  suppresses MCMV replication in human and rhesus macaque cells.
              - source_id: PMID:39494906
                statement: Establishes localisation to the replication compartment.
                supporting_text: >-
                  By immunofluorescence, we detected FAM111B predominantly in the
                  nucleus of infected cells with enrichment in viral replication
                  compartments, suggesting that it might play a role during viral
                  replication.
          - id: vf_virophage_parasitism
            label: Virophage parasitising the giant-virus factory
            participant:
              selector_type: ANY_PARTICIPANT
              description: >-
                A small dsDNA virophage, e.g. Sputnik; no reviewed UniProt entry
                is asserted for its gene products here.
            locations:
              - preferred_term: cytoplasmic viral factory
                term:
                  id: GO:0039714
                  label: cytoplasmic viral factory
            role_description: >-
              Cannot replicate in the amoeba alone and depends on the giant-virus
              factory as its replication niche, reducing the giant virus's
              infectious progeny. Evidence that the factory is a resource
              exploitable by a third party - the strongest functional analogy
              between a factory and a cellular organelle.
            evidence:
              - source_id: PMID:18690211
                title: The virophage as a unique parasite of the giant mimivirus.
                statement: Establishes obligate dependence on the giant-virus factory.
                supporting_text: >-
                  Sputnik cannot multiply in Acanthamoeba castellanii but grows
                  rapidly, after an eclipse phase, in the giant virus factory found
                  in amoebae co-infected with APMV4.
  connections:
    - source: vf_host_recruitment
      target: vf_boundary
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Host membranes, lipids, and cytoskeleton supply the material and the
        position of the boundary.
      chaining_status: NOT_APPLICABLE
      chaining_note: Non-metabolic edge; no reaction intermediate to chain.
    - source: vf_boundary
      target: vf_transcription
      connection_type: PRECEDES
      description: >-
        The compartment is established before transcription is localised within
        it. The Chimalliviridae EPI vesicle makes this explicit: early genes are
        transcribed from within a membrane-bound compartment.
      chaining_status: NOT_APPLICABLE
      chaining_note: Ordering of compartment biogenesis before its contents; not a reaction chain.
    - source: vf_transcription
      target: vf_genome_replication
      connection_type: PRECEDES
      description: >-
        Early transcription supplies the replication proteins; in
        Chimalliviridae replication begins only after the genome is transferred
        from the transcriptionally active EPI vesicle into the phage nucleus.
      chaining_status: NOT_APPLICABLE
      chaining_note: Temporal/regulatory ordering, not metabolite continuity.
    - source: vf_genome_replication
      target: vf_assembly
      connection_type: PRECEDES
      description: Genomes must be synthesised before they are packaged.
      chaining_status: NOT_APPLICABLE
      chaining_note: Temporal ordering of the late programme; not a reaction chain.
    - source: vf_assembly
      target: vf_egress
      connection_type: PRECEDES
      description: Mature virions leave the factory after packaging.
      chaining_status: NOT_APPLICABLE
      chaining_note: Temporal ordering; not a reaction chain.
    - source: vf_boundary
      target: vf_shielding
      connection_type: CAUSES
      description: >-
        Shielding is a consequence of the boundary, not an independent activity:
        the same barrier that concentrates the replication machinery excludes
        the host effectors that would act on it.
    - source: vf_antagonists
      target: vf_genome_replication
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Host restriction proteases accumulate in the replication compartment and
        suppress genome replication there; virophages divert factory output to
        their own progeny.
