                annotons:
                  - id: vf_mononegavirales_l_polymerase
                    label: Mononegavirales large (L) polymerase inside the condensate factory
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Mononegavirales large structural protein (L)
                        description: Grounded by representative members; not in PANTHER.
                        representative_members:
                          - preferred_term: L (rabies virus large structural protein)
                            term:
                              id: UniProtKB:A3F5L9
                              label: Large structural protein
                          - preferred_term: L (measles virus RNA-directed RNA polymerase L)
                            term:
                              id: UniProtKB:P12576
                              label: RNA-directed RNA polymerase L
                          - preferred_term: L (Zaire ebolavirus RNA-directed RNA polymerase L)
                            term:
                              id: UniProtKB:Q05318
                              label: RNA-directed RNA polymerase L
                    function:
                      preferred_term: RNA-directed RNA polymerase activity
                      term:
                        id: GO:0003968
                        label: RNA-directed RNA polymerase activity
                    processes:
