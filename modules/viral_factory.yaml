                        term:
                          id: GO:0039693
                          label: viral DNA genome replication
                    role_description: >-
                      Replicates the genome within the factory. In vaccinia the
                      ER-derived membranes surrounding early factories coincide
                      with active DNA replication and disperse as the factory
