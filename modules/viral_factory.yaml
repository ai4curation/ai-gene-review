    - order: 4
      role: genome replication within the factory
      node:
        id: vf_genome_replication
        label: Viral genome replication inside the factory
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Genome synthesis is the function the compartment exists to accelerate
          and to hide. Its position within the factory is the best-established
          fact about coronaviral and flaviviral replication organelles, and the
          step that phage nucleus formation gates.
        concepts:
          - preferred_term: viral genome replication
            term:
              id: GO:0019079
              label: viral genome replication
          - preferred_term: viral replication complex
            term:
              id: GO:0019034
              label: viral replication complex
        variant_sets:
          - id: vf_replication_chemistry_axis
            label: Genome chemistry of intra-factory replication
            axis: genome type
            selection: EXACTLY_ONE
            variants:
