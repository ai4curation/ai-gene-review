                        term:
                          id: GO:0019083
                          label: viral transcription
                    locations:
                      - preferred_term: cytoplasmic viral factory
                        term:
                          id: GO:0039714
                          label: cytoplasmic viral factory
                    role_description: >-
                      Recruited into the condensate by the phosphoprotein, where
                      it clusters into foci whose spacing changes when
                      replication is switched on.
                    evidence:
                      - source_id: PMID:37443171
                        statement: >-
                          Establishes that the polymerase is spatially organised
