  - source_id: GO:0005991
    title: trehalose metabolic process
    statement: Module-level process concept covering synthesis and hydrolysis of trehalose.
  - source_id: GO:0005992
    title: trehalose biosynthetic process
    statement: Process concept for the TPS/TPP synthesis arm.
  - source_id: GO:0005993
    title: trehalose catabolic process
    statement: Process concept for the trehalase hydrolysis arm.
  - source_id: GO:0005946
    title: alpha,alpha-trehalose-phosphate synthase complex (UDP-forming)
    statement: Complex term for the fungal TPS1/TPS2/TSL1/TPS3 trehalose synthase complex.
  - source_id: YeastPathways:TRESYN-PWY
    title: trehalose biosynthesis I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists TREHALOSE6PSYN-RXN (TPS1) and TREHALOSEPHOSPHA-RXN (TPS2).
      Both assignments were retained. The pathway comment describes the
      regulatory subunits TSL1 and TPS3 but they are not attached to any
      reaction; they were added here as regulatory subunits of the complex.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=TRESYN-PWY
  - source_id: YeastPathways:TREDEG-YEAST-PWY
    title: trehalose degradation (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists TREHALA-RXN with NTH1 and ATH1. Both were retained in
      different compartment variants. NTH2, the NTH1 paralog shown to be a
      functional cytosolic trehalase (PMID:18065618), was added.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=TREDEG-YEAST-PWY
  - source_id: PMID:11152943
    title: Reserve carbohydrates metabolism in the yeast Saccharomyces cerevisiae.
    statement: >-
      Review of synthesis and degradation of the two yeast glucose stores,
      glycogen and trehalose, and their regulation (cited by YeastPathways for
      both trehalose frames).
    supporting_text: >-
      Glycogen and trehalose are the two glucose stores of yeast cells.
  - source_id: PMID:9837904
    title: Composition and functional analysis of the Saccharomyces cerevisiae trehalose synthase complex.
    statement: >-
      Tps1 (TPS) and Tps2 (TPP) are in the trehalose synthase complex with
      regulatory subunits Tsl1 and Tps3; deletion of TPS1 abolishes TPS
      activity, deletion of TPS2 abolishes TPP activity, and TSL1/TPS3 are
      partially redundant subunits needed for full activity and stability.
    supporting_text: >-
      We conclude that Tps3 is a fourth subunit of the complex with functions
      partially redundant to those of Tsl1.
  - source_id: PMID:1425702
    title: Characterization of the 56-kDa subunit of yeast trehalose-6-phosphate synthase and cloning of its gene reveal its identity with the product of CIF1, a regulator of carbon catabolite inactivation.
    statement: TPS1 encodes the 56-kDa trehalose-6-phosphate synthase subunit.
    supporting_text: >-
      A mutant obtained by disruption of TPS1 had a very low activity of
      trehalose-6-phosphate synthase
  - source_id: PMID:8444170
    title: Disruption of TPS2, the gene encoding the 100-kDa subunit of the trehalose-6-phosphate synthase/phosphatase complex in Saccharomyces cerevisiae, causes accumulation of trehalose-6-phosphate and loss of trehalose-6-phosphate phosphatase activity.
    statement: TPS2 is the structural gene for trehalose-6-phosphate phosphatase.
    supporting_text: >-
      These results suggest that TPS2 codes for the
      structural gene of the trehalose-6-phosphate phosphatase.
  - source_id: PMID:8404905
    title: Cloning of two related genes encoding the 56-kDa and 123-kDa subunits of trehalose synthase from the yeast Saccharomyces cerevisiae.
    statement: >-
      TSL1 encodes the 123-kDa subunit; its N-terminal region modulates the
      phosphate inhibition and fructose 6-phosphate activation of T6P synthase.
    supporting_text: >-
      These results
      suggest that this N-terminal part confers regulatory properties upon the
      Tre6P synthase activity.
  - source_id: PMID:8809751
    title: Evidence for trehalose-6-phosphate-dependent and -independent mechanisms in the control of sugar influx into yeast glycolysis.
    statement: >-
      T6P inhibits yeast hexokinases, a signalling role of the pathway
      intermediate that is outside the module boundary.
    supporting_text: >-
      Furthermore, we have confirmed that tre-6-P inhibits the hexokinases in vitro.
  - source_id: PMID:8444853
    title: Molecular analysis of the neutral trehalase gene from Saccharomyces cerevisiae.
    statement: NTH1 encodes the neutral trehalase.
    supporting_text: >-
      The gene of neutral trehalase was cloned by complementation of a
      neutral trehalase-deficient yeast mutant
  - source_id: PMID:18065618
    title: 'New insights into trehalose metabolism by Saccharomyces cerevisiae: NTH2 encodes a functional cytosolic trehalase, and deletion of TPS1 reveals Ath1p-dependent trehalose mobilization.'
    statement: NTH2 encodes a functional trehalase involved in trehalose mobilization.
    supporting_text: >-
      we showed that NTH2,
      a paralog of NTH1, encodes a functional trehalase that is implicated in
      trehalose mobilization.
  - source_id: PMID:8764988
    title: Purification and biochemical characterization of the ATH1 gene product, vacuolar acid trehalase, from Saccharomyces cerevisiae.
    statement: Purified acid trehalase is the ATH1 gene product.
    supporting_text: >-
      We have purified
      ATH and shown that it is the ATH1 gene product
  - source_id: PMID:15128531
    title: Two distinct pathways for trehalose assimilation in the yeast Saccharomyces cerevisiae.
    statement: >-
      More than 90% of Ath1 activity is extracellular, so the acid trehalase
      acts mainly outside the plasma membrane rather than in the vacuole.
    supporting_text: >-
      we showed that more than 90% of the activity
      of Ath1p is extracellular, splitting of the disaccharide into glucose.
  - source_id: PMID:8045430
    title: Analysis of the otsBA operon for osmoregulatory trehalose synthesis in Escherichia coli and homology of the OtsA and OtsB proteins to the yeast trehalose-6-phosphate synthase/phosphatase complex.
    statement: >-
      E. coli OtsA (TPS) and OtsB (TPP) are separate enzymes. OtsA is
      homologous to TPS1, the N-terminal part of TPS2 and an internal region of
      TSL1; OtsB is homologous only to the C-terminal part of TPS2.
    supporting_text: >-
      OtsB has homology to the C-terminal
      part of TPS2, but no homology to the other subunits.
  - source_id: PMID:12498887
    title: Insights into trehalose synthesis provided by the structure of the retaining glucosyltransferase OtsA.
    statement: >-
      Structure of E. coli OtsA, the retaining GT-20 glucosyltransferase that
      condenses UDP-glucose and glucose 6-phosphate.
    supporting_text: >-
      The
      classical pathway for trehalose synthesis involves the condensation of
      UDP-glucose and glucose-6-phosphate to afford trehalose-6-phosphate, catalyzed
      by the retaining glycosyltransferase OtsA.
  - source_id: PMID:8021171
    title: Trehalose-6-P synthase is dispensable for growth on glucose but not for spore germination in Schizosaccharomyces pombe.
    statement: >-
      S. pombe tps1+ encodes trehalose-6-phosphate synthase that complements a
      S. cerevisiae tps1 mutant.
    supporting_text: >-
      The tps1+ gene expressed from its
      own promoter could complement the lack of trehalose-6-P synthase in S.
      cerevisiae tps1 mutants.
  - source_id: PMID:11004189
    title: Characterization of tpp1(+) as encoding a main trehalose-6P phosphatase in the fission yeast Schizosaccharomyces pombe.
    statement: S. pombe tpp1+ encodes the main trehalose-6-phosphate phosphatase.
    supporting_text: >-
      Disruption of tpp1(+) caused in vivo accumulation of trehalose-6P
      upon heat shock
  - source_id: PMID:12153582
    title: Molecular interaction of neutral trehalase with other enzymes of trehalose metabolism in the fission yeast Schizosaccharomyces pombe.
    statement: >-
      S. pombe Tps1, Tpp1 and the neutral trehalase Ntp1 interact in vitro and
      form complexes.
    supporting_text: >-
      tps1+ (coding for
      trehalose-6-P synthase, Tps1p), ntp1+ (encoding neutral trehalase, Ntp1p) and
      tpp1+ (that codes for trehalose-6-P phosphatase, Tpp1p), interact in vitro with
      each other and with themselves to form protein complexes.
  - source_id: PANTHER:PTHR10788
    title: TREHALOSE-6-PHOSPHATE SYNTHASE
    statement: >-
      GT-20 family containing TPS (OtsA, TPS1), the fungal TPS2-type
      phosphatases and the TSL1/TPS3 regulatory subunits, as subfamilies.
