id: MODULE:trehalose_metabolism
title: Trehalose synthesis via trehalose 6-phosphate and trehalase hydrolysis
description: >-
  Trehalose (alpha-D-glucopyranosyl alpha-D-glucopyranoside) is a non-reducing
  glucose disaccharide used as a reserve carbohydrate and stress protectant by
  fungi, bacteria, invertebrates and plants. This module covers its synthesis
  through the phosphorylated intermediate and its hydrolysis. A retaining
  glycosyltransferase of GT-20 family, trehalose-6-phosphate synthase (TPS,
  OtsA), transfers glucose from UDP-glucose to glucose 6-phosphate to form
  alpha,alpha-trehalose 6-phosphate (T6P). A HAD-superfamily
  trehalose-6-phosphate phosphatase (TPP, OtsB) then removes the phosphate to
  release free trehalose. The phosphatase is either a standalone OtsB-type
  enzyme (bacteria, plants) or the C-terminal phosphatase domain of a larger
  TPS2-type protein that also carries an inactive GT-20-like domain (fungi). In
  yeasts the two catalytic subunits form a cytosolic trehalose synthase complex
  together with large TSL1/TPS3-type regulatory subunits, which also carry
  GT-20-like domains and are needed for full activity and stability of the
  complex. Trehalose is hydrolysed to two glucose molecules by trehalases. A
  cytosolic glycoside hydrolase family 37 neutral trehalase mobilises
  intracellular trehalose, and an extracellular or periplasmic trehalase (GH65
  acid trehalase in budding yeast, GH37 TreA in enterobacteria) hydrolyses
  external trehalose. T6P also acts as a signalling metabolite (for example as
  a hexokinase inhibitor in budding yeast), which is a separate role of the
  pathway intermediate. The other trehalose routes (TreY/TreZ and TreS from
  alpha-glucans, trehalose phosphorylases), the supply of UDP-glucose and
  glucose 6-phosphate, and trehalose transport are outside the boundary.
status: DRAFT
scope: CONCRETE
