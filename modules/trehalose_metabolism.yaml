  notes: >-
    NEW module (YeastPathways crosswalk, 2026-10) generalising TRESYN-PWY and
    TREDEG-YEAST-PWY into the OtsA/OtsB-type (TPS/TPP) trehalose synthesis plus
    trehalase hydrolysis module found in fungi, bacteria, invertebrates and
    plants. Corrections and additions to YeastCyc: (1) TSL1 and TPS3 are
    described in the TRESYN-PWY comment but not attached to a reaction; they are
    modelled as an optional regulatory-subunit part of the trehalose synthase
    complex (GO:0005946). Their function is regulatory, not catalytic, so they
    get GO:0030234 enzyme regulator activity, matching the PomBase GO-CAM. (2)
    NTH2 is added as a second cytosolic trehalase (PMID:18065618). Its
    physiological contribution is minor compared with NTH1. (3) ATH1 is placed
    in the periplasmic space rather than the vacuole: more than 90% of Ath1
    activity is extracellular (PMID:15128531). The YeastCyc comment agrees.
    Both catalytic yeast subunits are cytosolic, as in the YeastPathways GO-CAM.
    Architecture: the TPP step has a fungal TPS2-type variant and a standalone
    OtsB variant. In S. pombe both tps2 (SPAC3G6.09c) and tpp1
    (SPAC19G12.15c) are TPS2-type proteins; tpp1 is the main phosphatase by
    genetics (PMID:11004189), and the GO-CAM types both as TPP. S. pombe
    SPAC22F8.05 is a regulator in the GO-CAM only on phylogenetic grounds and
    falls in a different PANTHER subfamily (SF119) from TSL1/TPS3 (SF15); its
    role is not experimentally established. GO-CAM disagreements: the
    YeastPathways TRESYN-PWY model omits TSL1/TPS3 and has no causal edge
    between TPS and TPP; there is no YeastPathways GO-CAM for TREDEG-YEAST-PWY.
    The PomBase model includes pgm1, uge1 and gal10 sugar-phosphate supply
    activities (Leloir pathway) that are outside this module. Out of scope:
    TreY/TreZ and TreS routes (modules trey_trez_trehalose_biosynthesis and
    bacterial_trehalose_synthesis_from_alpha_glucans), trehalose
    phosphorylases, trehalose transport (AGT1/MAL11), the PKA/Bmh control of
    NTH1, and T6P signalling to hexokinase (PMID:8809751). In plants most
    TPS-like and TPP-like genes are regulatory or signalling proteins; plant
    exemplars are not included.
