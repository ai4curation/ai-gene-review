id: MODULE:translation_initiation
title: Human cap-dependent translation initiation — eIF2 ternary complex and its eIF2B exchange factor, 43S preinitiation complex assembly with eIF1, eIF1A and eIF3, eIF4F-mediated mRNA activation and 43S recruitment, scanning and start codon recognition with eIF5 as GAP, and eIF5B-catalysed subunit joining
description: >-
  Translation initiation assembles an elongation-competent 80S ribosome whose P site holds
  the initiator methionyl-tRNA base-paired to the start codon. On most cytoplasmic mRNAs it
  is cap-dependent and works by scanning. eIF2, a heterotrimer whose gamma subunit binds GTP
  and Met-tRNAi, forms the ternary complex (TC), and the decameric eIF2B regenerates
  eIF2-GTP from the eIF2-GDP released after each round. eIF1, eIF1A and the 13-subunit eIF3
  bind the 40S subunit, hold it in an open conformation and recruit the TC; eIF5 joins
  through eIF2-beta, giving the 43S preinitiation complex (PIC). The mRNA is activated by
  eIF4F: the cap-binding protein eIF4E, the DEAD-box helicase eIF4A and the scaffold eIF4G,
  which also binds poly(A)-binding protein (closing the mRNA loop) and eIF3. eIF4B or eIF4H
  stimulates eIF4A, and the cap-eIF4E-eIF4G-eIF3-40S chain of contacts loads the 43S
  complex near the cap. The PIC then scans the 5' UTR, helped by eIF4A, eIF4B, eIF4G and,
  on highly structured leaders, the 40S-bound DExH helicase DHX29. eIF1 and eIF1A keep the
  complex scanning-competent and reject non-AUG and poor-context triplets; when the
  anticodon pairs with an AUG in good context, eIF1 is displaced, the eIF5-stimulated
  hydrolysis of eIF2-bound GTP becomes irreversible by Pi release, and the 48S complex
  closes. eIF2-GDP and eIF5 leave, and the GTPase eIF5B, bound to the eIF1A C-terminal tail,
  joins the 60S subunit; GTP hydrolysis then releases eIF5B and eIF1A from the 80S
  initiation complex, which begins elongation.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000101
    title: translation pathway
    statement: >-
      The RGD Pathway Ontology diagram for translation. Its initiation section draws the
      eIF2 trimer with Met-tRNA and GTP, eIF2B recycling eIF2-GDP, eIF1, eIF1A, eIF3 and eIF5
      on the 40S subunit forming the 43S PIC, eIF4E, eIF4A and eIF4G with Pabpc1, eIF4B,
      eIF4H and Dhx29 preparing the mRNA, eIF3 bound to eIF4G, and eIF5B with eIF1A joining
      the 60S subunit to the 48S complex. This module covers that section; the ribosome,
      elongation, termination and mRNA surveillance are covered by sibling modules. Derived
      through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000101.yaml and the translation
      split plan in broad_pathway_split_plans.md).
  - source_id: PW:0000580
    title: translation initiation pathway
    statement: >-
      RGD's child pathway of PW:0000101 for initiation (34 RGD-curated human genes). Every
      gene on it except EIF4G2 is a participant of this module.
  - source_id: GO:0006412
    title: translation
    statement: >-
      The GO process mapped to PW:0000101 (skos:closeMatch, from the PW definition
      cross-reference in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is broader
      than this module.
  - source_id: GO:0006413
    title: translational initiation
    statement: >-
      The GO process mapped to PW:0000580 (definition cross-reference and lexical match in
      projects/RGD_PATHWAY_ONTOLOGY/data/pw_go_mappings.sssom.yaml). The module concept uses
      its descendant cap-dependent translational initiation, because the module models the
      scanning route only.
  - source_id: PMID:20094052
    title: The mechanism of eukaryotic translation initiation and principles of its regulation.
    statement: Initiation has two stages, 48S complex formation with codon-anticodon pairing in the P site and joining of the 60S subunit; the parts of this module follow the stages of the review's Figure 1.
    supporting_text: "It requires at least 9 eukaryotic initiation factors (eIFs; Table 1) and comprises two steps: first, formation of 48S initiation complexes with established codon-anticodon base-pairing in the P-site of the 40S ribosomal subunits, and second, joining of 48S complexes with 60S subunits."
  - source_id: PMID:20094052
    title: The mechanism of eukaryotic translation initiation and principles of its regulation.
    statement: Scanning is the mechanism used by most mRNAs; IRES-driven initiation is the exception and is not modelled here.
    supporting_text: Although most mRNAs use the scanning mechanism, initiation on a few is mediated by IRESs (Box 1).
  - source_id: PMID:24499181
    title: The scanning mechanism of eukaryotic translation initiation.
    statement: The second GTPase of initiation, eIF5B, joins the 60S subunit and yields the elongation-competent 80S initiation complex.
    supporting_text: A second GTPase, eIF5B, catalyzes the joining of the 60S subunit to produce an 80S initiation complex that is competent for elongation.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000101 (translation pathway) through
  the RGD_PATHWAY_ONTOLOGY project's diagram->module route (seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, flagged broad), as item 2 of the
  translation split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md. Both
  PW ids were checked against .cache/rgd_pw/pw.obo: PW:0000101 "translation pathway" and its
  child PW:0000580 "translation initiation pathway". RGD curates 34 human genes to
  PW:0000580 (.cache/rgd_pw/homo_genes_pw): DHX29 EIF1 EIF1AX EIF2B1 EIF2B2 EIF2B3 EIF2B4
  EIF2B5 EIF2S1 EIF2S2 EIF2S3 EIF3A EIF3B EIF3C EIF3D EIF3E EIF3F EIF3G EIF3H EIF3I EIF3J
  EIF3K EIF3L EIF3M EIF4A1 EIF4A2 EIF4B EIF4E EIF4G1 EIF4G2 EIF4H EIF5 EIF5B PABPC1. The
  genes curated directly to PW:0000101 are ribosomal proteins only, which are modelled in
  the sibling module cytoplasmic_ribosome. Thirty-four gene products are participants: the
  33 PW:0000580 genes other than EIF4G2, plus EIF4G3, the second eIF4F scaffold, which RGD
  does not list. Molecular functions were taken from each protein's experimental GO
  annotations in QuickGO (November 2026) and, where a gene review exists, from its core
  functions (EIF2S1, EIF2S3, EIF2B1-EIF2B5, EIF3E, EIF3F, EIF3G, EIF3J). Six assignments
  are curator choices without a matching experimental GOA row on the participant, each
  explained in its annoton: methionyl-initiator methionine tRNA binding and GTPase activity
  of EIF2S3 (both core functions of the EIF2S3 review), translation initiation factor
  activity of EIF1AX, EIF4B and EIF4H (IBA or TAS only), cap-dependent translation
  initiation factor activity of the eIF4F complex, molecular adaptor activity of EIF4G1
  (TAS), RNA helicase activity of EIF4A1 (IBA and TAS), and GTPase activator activity of
  EIF5 (no row; the GAP role is from PMID:20094052). UniProt accessions are from the gene
  folders where present and otherwise from UniProt REST (November 2026), with the current
  recommended names as labels.

  Boundary decisions. (1) Ribosome. The 40S and 60S subunits and their proteins are not
  re-listed; they are modelled once in cytoplasmic_ribosome, drafted in parallel. A
  module_ref was not used because that module did not yet exist in modules/ when this draft
  was written; the coordinator can add one (for example a context part pointing to the
  40S subunit node) once both are merged. (2) Scope is the cap-dependent scanning route
  (GO:0002191), which RGD draws and which most mRNAs use. IRES-driven, eIF4E-independent
  (eIF3d cap binding, DAP5), m6A-driven and leaderless initiation are out of scope.
  Reinitiation after uORFs, translation reinitiation factors and alternative initiator
  delivery (EIF2D, DENR-MCTS1, EIF2A) are not on the RGD list and are not modelled.
  (3) Regulation is out of the core, as the split plan asks. The four eIF2-alpha kinases
  (EIF2AK1 HRI, EIF2AK2 PKR, EIF2AK3 PERK, EIF2AK4 GCN2) and the PPP1R15A and PPP1R15B
  phosphatase subunits are modelled in integrated_stress_response, whose eif2_eif2b_recycling
  step uses the same eIF2 and eIF2B complexes; this module supplies the initiation step that
  the ISR acts on and does not duplicate the kinases. The eIF4E-binding proteins (EIF4EBP1,
  EIF4EBP2, EIF4EBP3), mTORC1 and the MNK kinases (MKNK1, MKNK2) regulate eIF4F assembly or
  eIF4E phosphorylation; none is on the RGD list, none performs a step of initiation, and
  no human module covers them yet; they are mentioned only in the EIF4E unit role.
  (4) EIF4G2 (DAP5, p97) is excluded although RGD lists it: it lacks the eIF4E-binding
  region and so is not an eIF4F subunit (PMID:20094052); it supports eIF4E-independent
  initiation, which is out of scope. (5) eIF4F is one complex annoton with five units, of
  which EIF4G1 and EIF4G3, and EIF4A1 and EIF4A2, are alternatives (each eIF4F holds one
  eIF4G and one eIF4A). Paralogues not modelled: EIF4E2 (4EHP) and EIF4E3, which are
  translational repressors or minor cap-binding proteins, EIF4E1B, EIF1B, EIF1AY (the
  Y-linked eIF1A paralogue), EIF3CL (an EIF3C duplicate encoding the same protein; EIF3C
  stands for both) and EIF4A3, the exon junction complex helicase used in
  mrna_nuclear_export and nonsense_mediated_mrna_decay. (6) eIF3 is modelled at the
  complex level, as the split plan asks: 13 units, no unit function (reasons in the
  annoton). (7) eIF2 GTP hydrolysis is a second annoton for EIF2S3 (eif2_gtp_hydrolysis),
  because the gamma subunit has two roles in two steps (Met-tRNAi binding in the ternary
  complex and GTP hydrolysis at the start codon), and the eIF5 GAP needs a target. eIF1 and
  eIF1A are annotons of the 43S step only; their roles in scanning and start codon
  fidelity are described in that step's node. (8) PABPC1, eIF4B and eIF4H are annotons that
  positively regulate eIF4F, since PMID:20094052 and RGD treat them as stimulatory: PABP is
  not essential (PMID:20094052). Other cytoplasmic poly(A)-binding proteins (PABPC3,
  PABPC4) are not on the RGD list and are not modelled. (9) DHX29 is kept because RGD lists
  it and it acts on the 40S subunit in scanning; DDX3X, which has a disputed initiation
  role, is not on the list and is excluded. (10) Post-termination ribosome recycling by
  ABCE1 with eIF3, eIF1, eIF1A and eIF3j, which supplies free 40S subunits, is left to
  translation_elongation_and_termination; eIF6 and eIF5A, despite their names, are 60S
  biogenesis and elongation factors and are not modelled here. (11) Substrate versus
  participant: the mRNA, the cap, the poly(A) tail and Met-tRNAi are inputs, not
  participants; the 40S and 60S subunits are the ribosome module's. (12) Processes. GO has
  terms for ternary complex formation (GO:0001677), preinitiation complex formation
  (GO:0001731, used for both 43S assembly and mRNA recruitment, because its definition
  joins the small subunit, ternary complex and mRNA) and 60S joining (GO:0001732), but none
  for scanning or start codon recognition. Two terms are requested in proposed_new_terms
  (translation preinitiation complex scanning; translation start codon recognition), and
  the step meanwhile uses the module process GO:0002191. eIF2B's process is cytoplasmic
  translational initiation, as in its gene reviews and in integrated_stress_response.
  (13) Parts are linked by PRECEDES in the order RGD and PMID:20094052 describe: ternary
  complex, 43S PIC, mRNA activation and attachment, scanning and start codon recognition,
  subunit joining; mRNA activation by eIF4F proceeds independently of 43S assembly and the
  two meet at attachment. A PROVIDES_INPUT_FOR edge from eIF2 GTP hydrolysis to eIF2B closes
  the eIF2 cycle.

  GO-CAM links. gocams/index.tsv was searched for all 34 participants, EIF4G2, the eIF2
  kinases, PPP1R15A/B and the 4E-BPs. No human model contains an eIF2B, eIF3, eIF1, eIF1A,
  eIF4E, eIF4B, eIF4H, PABPC1, DHX29, eIF5 or eIF5B activity. EIF2S1 appears in 13 human
  models, almost all integrated stress response models; its 12 cap-dependent translation
  initiation factor activities, and the two EIF2S2 translation initiation factor activities
  (in the poxvirus OPG043 and KSHV ORF57 PKR models), are linked on the eIF2 annoton. The
  IRES-mediated translation initiation factor activities of EIF2S1 in the same models and
  its root molecular_function activity in the mitophagy model are not linked. EIF4A1 and
  EIF4G3 (FXR1 phase-separation models) carry translation initiation factor activity and
  are linked on the eIF4F annoton. The kinases and PPP1R15 subunits are left to
  integrated_stress_response. PANTHER family ids and PTNs are deliberately not asserted.

  Possible upstream issues (queries only). (a) GO:0160296 cap-dependent translation
  initiation factor activity is defined as recognising and binding the cap, but EIF2S1
  carries it in GOA (IDA, PMID:16289705, alongside IRES-mediated translation initiation
  factor activity from the same paper) and in the ISR GO-CAMs listed above. eIF2 does not
  bind the cap; these rows look like a mechanical split of GO:0003743 rows and might be
  better as GO:0003743. Not recorded as a source defect, because this module does not
  review the rows and the full text was not read. (b) EIF3I carries translation initiation
  factor activity as an enables row (IDA, PMID:17581632) where the other subunits carry the
  same paper's complex-level assay as contributes_to rows; contributes_to looks intended.
proposed_new_terms:
  - proposed_name: translation preinitiation complex scanning
    proposed_definition: >-
      The process in which a translation preinitiation complex, after attaching to the 5'
      end of an mRNA, moves in the 5' to 3' direction along the 5' untranslated region
      while its initiator methionyl-tRNA inspects successive triplets for a start codon.
    justification: >-
      GO has no term for ribosomal scanning, the defining step of cap-dependent
      translational initiation, although GO:0003743 translation initiation factor activity
      cross-references the Reactome event "Ribosomal scanning". Scanning needs eIF1, eIF1A,
      eIF3, eIF4A, eIF4B and eIF4G, and DHX29 on structured leaders; the scanning step of this
      module (node scanning_and_start_codon_recognition) currently uses the parent process
      GO:0002191. Proposed as part_of cap-dependent translational initiation.
    proposed_parent:
      id: GO:0002191
      label: cap-dependent translational initiation
    proposed_mappings:
      - predicate: skos:closeMatch
        target_term:
          id: Reactome:R-HSA-72621
          label: Ribosomal scanning
    supported_by:
      - reference_id: PMID:20094052
        supporting_text: The 43S complex then scans the 5’-untranslated region (5’-UTR) in the 5’→3’ direction to the initiation codon (Fig.1).
      - reference_id: PMID:20094052
        supporting_text: Omission of eIF1A substantially reduces this ability and lack of eIF1 almost abrogates this ability
  - proposed_name: translation start codon recognition
    proposed_definition: >-
      The process in which a scanning translation preinitiation complex establishes base
      pairing between the anticodon of the initiator methionyl-tRNA and a start codon in the
      ribosomal P site, discriminates against non-AUG codons and AUG codons in poor context,
      and converts to the closed, scanning-arrested 48S initiation complex.
    justification: >-
      GO has no process term for start codon selection in translation (only transcriptional
      start site selection exists), although GO:0003743 cross-references the Reactome event
      "Start codon recognition" and the GO:0033290 eukaryotic 48S preinitiation complex
      definition describes this step. eIF1, eIF1A, eIF2 and eIF5 act in it. Proposed as
      part_of cytoplasmic translational initiation, since IRES-driven initiation can also
      require it.
    proposed_parent:
      id: GO:0002183
      label: cytoplasmic translational initiation
    proposed_mappings:
      - predicate: skos:closeMatch
        target_term:
          id: Reactome:R-HSA-72697
          label: Start codon recognition
    supported_by:
      - reference_id: PMID:20094052
        supporting_text: eIF1 plays the key role in maintaining the fidelity of initiation.
      - reference_id: PMID:20094052
        supporting_text: It enables 43S complexes to discriminate against non-AUG triplets and AUG triplets that have poor context
module:
  id: translation_initiation
  label: Human cap-dependent translation initiation
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: cap-dependent translational initiation
      term:
        id: GO:0002191
        label: cap-dependent translational initiation
      description: The scanning route of cytoplasmic translational initiation; a descendant of the GO process mapped to PW:0000580.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
  parts:
    - order: 1
      role: ternary complex formation and eIF2 recycling
      node:
        id: ternary_complex_formation
        label: eIF2 binds GTP and Met-tRNAi to form the ternary complex; eIF2B regenerates eIF2-GTP from eIF2-GDP
        module_type: BIOLOGICAL_PROCESS
        description: >-
          eIF2-GTP binds the initiator methionyl-tRNA to form the ternary complex (TC) that
          delivers Met-tRNAi to the 40S subunit. eIF2 leaves the ribosome after start codon
          recognition as eIF2-GDP, which cannot bind Met-tRNAi; the decameric exchange factor
          eIF2B releases GDP so that GTP can bind and a new TC can form. This exchange is the
          step inhibited when eIF2-alpha is phosphorylated in the integrated stress response
          (modelled in integrated_stress_response, not here).
        concepts:
          - preferred_term: formation of translation initiation ternary complex
            term:
              id: GO:0001677
              label: formation of translation initiation ternary complex
        annotons:
          - id: eif2_complex
            label: eIF2 (EIF2S1, EIF2S2, EIF2S3) binds GTP and Met-tRNAi as the ternary complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: eIF2
                term:
                  id: GO:0005850
                  label: eukaryotic translation initiation factor 2 complex
                active_units:
                  - id: eif2_alpha
                    label: EIF2S1 (eIF2-alpha)
                    role: Regulatory subunit; contacts the -3 position of the start codon context in the 48S complex and carries Ser51 (Ser52 counting the initiator methionine), whose phosphorylation turns eIF2-GDP into an inhibitor of eIF2B.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: EIF2S1
                        term:
                          id: UniProtKB:P05198
                          label: Eukaryotic translation initiation factor 2 subunit 1
                  - id: eif2_beta
                    label: EIF2S2 (eIF2-beta)
                    role: Binds eIF2-gamma, and through its N-terminal lysine boxes binds eIF5 and eIF2B-epsilon.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: EIF2S2
                        term:
                          id: UniProtKB:P20042
                          label: Eukaryotic translation initiation factor 2 subunit 2
                  - id: eif2_gamma
                    label: EIF2S3 (eIF2-gamma)
                    role: Core G-protein subunit that binds GTP and Met-tRNAi and to which eIF2-alpha and eIF2-beta bind; its GTP is hydrolysed at the start codon (annoton eif2_gtp_hydrolysis).
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: EIF2S3
                        term:
                          id: UniProtKB:P41091
                          label: Eukaryotic translation initiation factor 2 subunit 3
                    function:
                      preferred_term: methionyl-initiator methionine tRNA binding
                      term:
                        id: GO:1990856
                        label: methionyl-initiator methionine tRNA binding
            function:
              preferred_term: translation initiation factor activity
              term:
                id: GO:0003743
                label: translation initiation factor activity
            processes:
              - preferred_term: formation of translation initiation ternary complex
                term:
                  id: GO:0001677
                  label: formation of translation initiation ternary complex
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The complex carries translation initiation factor activity: all three subunits
              have IDA rows for it from a reconstituted human system (PMID:16289705). EIF2S3
              is typed methionyl-initiator methionine tRNA binding, a core function of the
              EIF2S3 gene review (genes/human/EIF2S3) that is supported by the MEHMO-syndrome
              eIF2-gamma mutant defective in Met-tRNAi binding (PMID:30517694); there is no
              experimental GOA row for that term on EIF2S3, so this is a curator choice taken
              from the review. EIF2S1 and EIF2S2 are units without a function of their own:
              their experimental rows are the complex-level initiation factor activity and
              ribosome binding. The guanyl-nucleotide exchange factor inhibitor activity of
              phosphorylated EIF2S1 is regulation and belongs to integrated_stress_response.
            evidence:
              - source_id: PMID:23063529
                statement: eIF2 with GTP and Met-tRNAi forms the ternary complex, which binds the 40S subunit and scans for the AUG; eIF2-gamma is the core subunit.
                supporting_text: Together with GTP and initiator methionyl-tRNA, translation initiation factor eIF2 forms a ternary complex that binds the 40S ribosome and then scans an mRNA to select the AUG start codon for protein synthesis.
