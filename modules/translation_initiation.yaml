      node:
        id: mrna_activation_and_recruitment
        label: eIF4F binds the cap, eIF4A unwinds the cap-proximal region with eIF4B or eIF4H, PABP closes the loop, and eIF4G-eIF3 loads the 43S complex
        module_type: BIOLOGICAL_PROCESS
        description: >-
