    - order: 4
      role: scanning, start codon recognition and commitment
      node:
        id: scanning_and_start_codon_recognition
        label: The 48S complex scans the 5' UTR to the start codon; AUG recognition displaces eIF1 and makes eIF5-stimulated GTP hydrolysis by eIF2 irreversible
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The attached complex moves 5' to 3' along the leader. Scanning needs the open
          conformation induced by eIF1 and eIF1A (annotons of part pic_43s_formation) and is
          assisted by eIF4A, eIF4B and eIF4G (part mrna_activation_and_recruitment) and, on
          highly structured leaders, by DHX29 bound to the 40S subunit. eIF1 rejects non-AUG
          and poor-context triplets. Base pairing of Met-tRNAi with an AUG in good context
          tightens eIF1A binding and displaces eIF1, which switches the complex to the closed
          state. eIF5, bound to eIF2-beta, is the GTPase-activating protein for eIF2-gamma;
          GTP is hydrolysed during scanning, but Pi release, which commits the ribosome to
          the codon, waits for eIF1 displacement. GO has no term for scanning or for start
          codon recognition; two are requested in proposed_new_terms, and the step uses the
          module process meanwhile.
        concepts:
          - preferred_term: cap-dependent translational initiation
            term:
              id: GO:0002191
              label: cap-dependent translational initiation
        annotons:
          - id: dhx29_scanning
            label: DHX29 binds the 40S subunit and drives scanning through structured 5' UTRs
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DHX29
                term:
                  id: UniProtKB:Q7Z478
                  label: ATP-dependent RNA helicase DHX29
            function:
              preferred_term: ribonucleoside triphosphate phosphatase activity
              term:
                id: GO:0017111
                label: ribonucleoside triphosphate phosphatase activity
            processes:
              - preferred_term: cap-dependent translational initiation
                term:
                  id: GO:0002191
                  label: cap-dependent translational initiation
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Typed with its 40S-dependent NTPase activity (IMP, PMID:23047696) because that
              is what the literature demonstrates for DHX29: 40S-stimulated NTP hydrolysis,
              not duplex unwinding, so the helicase term is not used whatever the strength
              of its IBA row.
              It also has experimental rows for ribosomal small subunit binding (IDA,
              PMID:23706745) and translation activator activity (IMP, PMID:20018725). RGD
              draws Dhx29 as positively affecting the 43S PIC and lists it on PW:0000580.
            evidence:
              - source_id: PMID:20094052
                statement: DHX29 binds 40S subunits and is needed for scanning through highly structured leaders in vitro; its depletion impairs translation in cells.
                supporting_text: Mammalian DExH-box protein DHX29 binds 40S subunits directly and is required for efficient scanning through highly structured
          - id: eif5_gap
            label: eIF5 (EIF5) activates GTP hydrolysis by 40S-bound eIF2
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EIF5
                term:
                  id: UniProtKB:P55010
                  label: Eukaryotic translation initiation factor 5
            function:
              preferred_term: GTPase activator activity
              term:
                id: GO:0005096
                label: GTPase activator activity
            processes:
              - preferred_term: cap-dependent translational initiation
                term:
                  id: GO:0002191
                  label: cap-dependent translational initiation
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              eIF5 joins the 43S complex bound to eIF2-beta and acts as the GAP for
              eIF2-gamma, only in ternary complexes bound to the 40S subunit. GTPase activator
              activity has no GOA row on human EIF5 (its non-electronic rows are IBA rows for
              GDP-dissociation inhibitor activity, eIF2 binding and translation initiation
              factor activity); the typing is a curator choice from the review cited. The GDI
              activity of eIF5 on eIF2-GDP after release is part of eIF2 recycling and is not
              modelled separately.
            evidence:
              - source_id: PMID:20094052
                statement: eIF5 is the eIF2-specific GAP that mediates commitment to the start codon.
                supporting_text: The commitment step is mediated by eIF5, an eIF2-specific GTPase-activating protein (GAP)
              - source_id: PMID:20094052
                statement: eIF5 binds eIF2-beta and stimulates eIF2-gamma GTPase only in 40S-bound ternary complexes.
                supporting_text: "eIF5 binds eIF2’s β-subunit but induces the GTPase activity of eIF2’s γ-subunit only in eIF2–GTP–Met-tRNAMeti complexes that are bound to 40S subunits"
          - id: eif2_gtp_hydrolysis
            label: eIF2-gamma (EIF2S3) hydrolyses its GTP at the start codon
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EIF2S3
                term:
                  id: UniProtKB:P41091
                  label: Eukaryotic translation initiation factor 2 subunit 3
            function:
              preferred_term: GTPase activity
              term:
                id: GO:0003924
                label: GTPase activity
            processes:
              - preferred_term: cap-dependent translational initiation
                term:
                  id: GO:0002191
                  label: cap-dependent translational initiation
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The second role of the eIF2 gamma subunit, written as its own annoton so that
              the GAP connection has a target. GTPase activity is a core function of the
              EIF2S3 gene review; no experimental GOA row assigns it, so this is a curator
              choice from that review. eIF1 restrains Pi release until the AUG is recognised;
              eIF2-GDP then leaves and is recycled by eIF2B (part ternary_complex_formation).
            evidence:
              - source_id: PMID:20094052
                statement: AUG recognition tightens eIF1A binding and displaces eIF1, closing the complex on the mRNA.
                supporting_text: "Establishment of codon–anticodon base-pairing is accompanied by tightening of the eIF1A-40S interaction41 and eIF1’s displacement from near the P-site3,10,42, which switches the complex to a ‘closed’ conformation locked onto the mRNA."
              - source_id: PMID:20094052
                statement: eIF1 discriminates against non-AUG and poor-context triplets.
                supporting_text: It enables 43S complexes to discriminate against non-AUG triplets and AUG triplets that have poor context
        connections:
          - source: eif5_gap
            target: eif2_gtp_hydrolysis
            connection_type: POSITIVELY_REGULATES
            description: eIF5 activates GTP hydrolysis by eIF2-gamma in the 40S-bound ternary complex.
    - order: 5
      role: 60S subunit joining
      node:
        id: subunit_joining
        label: eIF5B, bound to the eIF1A C-terminal tail, joins the 60S subunit to the 48S complex and leaves after GTP hydrolysis
        module_type: BIOLOGICAL_PROCESS
        description: >-
          After eIF2-GDP and eIF5 leave, eIF5B-GTP, recruited by the eIF1A C-terminal tail,
          occupies the intersubunit cleft and promotes joining of the 60S subunit, displacing
          remaining eIF1, eIF1A, eIF3 and eIF2-GDP. GTP hydrolysis is not needed for joining
          but releases eIF5B, with eIF1A, from the 80S initiation complex, which is then ready
          for the first elongation cycle (translation_elongation_and_termination). The 60S
          subunit is modelled in cytoplasmic_ribosome.
        concepts:
          - preferred_term: formation of cytoplasmic translation initiation complex
            term:
              id: GO:0001732
              label: formation of cytoplasmic translation initiation complex
        annotons:
          - id: eif5b_subunit_joining
            label: eIF5B (EIF5B) joins the 60S subunit to the 48S complex
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EIF5B
                term:
                  id: UniProtKB:O60841
                  label: Eukaryotic translation initiation factor 5B
            function:
              preferred_term: translation initiation factor activity
              term:
                id: GO:0003743
                label: translation initiation factor activity
            processes:
              - preferred_term: formation of cytoplasmic translation initiation complex
                term:
                  id: GO:0001732
                  label: formation of cytoplasmic translation initiation complex
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Translation initiation factor activity (IDA, PMID:10432305). eIF5B also has a
              ribosome-dependent GTPase activity (IDA, PMID:10659855), but hydrolysis is
              needed for its release rather than for joining, so the joining activity is the
              typed function. It is the IF2 homologue.
            evidence:
              - source_id: PMID:10659855
                statement: eIF5B, the IF2 homologue, is required for subunit joining and has a ribosome-dependent GTPase activity.
                supporting_text: mediates joining of subunits and has a ribosome-dependent GTPase
              - source_id: PMID:20094052
                statement: GTP hydrolysis by eIF5B is needed for its release, not for joining.
                supporting_text: Hydrolysis of eIF5B-bound GTP is not required for subunit-joining, but is essential for eIF5B
              - source_id: PMID:17242201
                statement: eIF1A recruits eIF5B before joining, and both leave the 80S complex together after GTP hydrolysis (yeast).
                supporting_text: binds to the factor eIF1A and catalyzes ribosomal subunit joining
