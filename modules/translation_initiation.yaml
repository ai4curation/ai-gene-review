          eIF3; and eIF4A, stimulated by eIF4G and by eIF4B or eIF4H, unwinds secondary
          structure near the cap so that the 43S complex can attach. The 43S complex is
          recruited by the chain of contacts cap-eIF4E-eIF4G-eIF3-40S, with eIF4G binding the
          c, d and e subunits of eIF3. PABPC1 bound to the poly(A) tail binds eIF4G and
          circularises the mRNA; this stimulates initiation but is not essential.
