id: MODULE:dmel_elongator_complex
title: Elongator complex in Drosophila melanogaster
description: >-
  Elongator is a conserved six-subunit complex that modifies uridines at the wobble position
  (U34) of tRNAs by adding a carboxymethyl group, the first step towards mcm5U and mcm5s2U,
  which are needed for efficient and accurate decoding. It is formed by two subcomplexes.
  Elp1, Elp2 and Elp3 form the core subcomplex; Elp3 is the catalytic subunit, a radical SAM
  enzyme with an acetyltransferase domain, and Elp1 is the scaffold. Elp4, Elp5 and Elp6 form
  a hetero-hexameric RecA-like ring (two copies of each) that binds tRNA and ATP. In Drosophila,
  Elp3 is required for larval development and neuronal function.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001820
  title: 'FlyBase gene group ELP: Elongator holoenzyme complex'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as elongator holoenzyme complex
    (ELP); this module models that group.
- source_id: GO:0033588
  title: elongator holoenzyme complex
  statement: >-
    GO term grounding the module as elongator holoenzyme complex.
notes: >-
  The split into Elp1-3 and Elp4-6 subcomplexes follows the conserved architecture defined
  in yeast and human; FlyBase groups all six subunits in ELP. Elongator was first described
  as an RNA polymerase II elongation factor, but its established direct activity is tRNA modification,
  so transcription elongation is not a process here. FlyBase groups realized by this module:
  ELP (FBgg0001820). Participants were generated from the FlyBase gene-group membership and
  mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_elongator_complex.yaml;
  none of the member genes has a gene review yet unless noted.
