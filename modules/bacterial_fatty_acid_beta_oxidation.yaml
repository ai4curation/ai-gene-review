id: MODULE:bacterial_fatty_acid_beta_oxidation
title: Bacterial fatty acid beta-oxidation spiral
description: >-
  A reusable bacterial four-reaction spiral that shortens a fatty acyl-CoA by two carbon atoms per turn.
  An acyl-CoA dehydrogenase forms a trans-2-enoyl-CoA, an enoyl-CoA hydratase forms a (3S)-3-hydroxyacyl-CoA,
  a hydroxyacyl-CoA dehydrogenase forms a 3-oxoacyl-CoA, and a thiolase releases acetyl-CoA plus a chain-shortened
  acyl-CoA that re-enters the first reaction. In the aerobic pathway of enterobacteria and pseudomonads
  the first reaction is carried out by the FadE acyl-CoA dehydrogenase and the other three by the cytoplasmic
  alpha2beta2 FadBA complex, whose FadB subunit carries the hydratase and dehydrogenase and whose FadA
  subunit is the thiolase. Free-fatty-acid activation and unsaturated-fatty-acid auxiliary reactions are
  outside the core spiral.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0006635
  title: fatty acid beta-oxidation
  statement: Defines the biological process represented by the four-reaction spiral.
- source_id: PMID:12057976
  title: The enigmatic Escherichia coli fadE gene is yafH.
  statement: >-
    Identifies FadE as the acyl-CoA dehydrogenase of the E. coli fad regulon; fadE mutants cannot grow
    on medium- or long-chain fatty acids.
- source_id: PMID:368024
  title: >-
    Five different enzymatic activities are associated with the multienzyme complex of fatty acid oxidation
    from Escherichia coli.
  statement: >-
    The purified E. coli FadBA complex carries the hydratase, dehydrogenase and thiolase activities of
    the spiral.
- source_id: file:ECOLI/fadB/fadB-ai-review.yaml
  title: E. coli fadB gene review
  statement: >-
    P21177 has experimentally supported enoyl-CoA hydratase and (3S)-3-hydroxyacyl-CoA dehydrogenase activities
    as the alpha subunit of the FadBA complex.
- source_id: file:PSEPK/fadB/fadB-ai-review.yaml
  title: PSEPK fadB gene review
  statement: Q88L02 is the HAMAP-typed FadB of Pseudomonas putida KT2440, orthologous to E. coli FadB.
notes: >-
  Species-neutral module with two exemplar organisms: Escherichia coli K-12, where every step has experimental
  support (FadE, PMID:12057976; FadBA, PMID:368024, PMID:8454629, PMID:8755745), and Pseudomonas putida
  KT2440, whose FadE, FadB and FadA are assigned by orthology (same PANTHER subfamilies, HAMAP FadA/FadB
  rules). The FadE-FadBA architecture is characteristic of gammaproteobacteria (the FadA subfamily PTHR43853:SF11
  and the FadB-containing PTHR43612:SF3 are dominated by Escherichia, Pseudomonas, Shewanella, Vibrio,
  Yersinia and Acinetobacter); other bacteria such as Bacillus subtilis realize the same four reactions
  with different enzymes, which this module does not yet model. The anaerobic FadIJ (YfcYX) complex of
  E. coli is a paralogous realization that is also not modelled. FadD-dependent ligation of free fatty
  acids to CoA is an optional entry process, not a spiral reaction. Enoyl-CoA isomerases, 2,4-dienoyl-CoA
  reductases, and related enzymes required for unsaturated substrates are auxiliary (FadB itself carries
  a delta3-delta2-enoyl-CoA isomerase activity, recorded in its gene reviews). Alkane oxidation, phenylacetate
  degradation, glutaryl-CoA oxidation, PHA metabolism, transport, and specialty acyl-CoA pathways are
  separate modules. Family grounding: FadE uses PANTHER:PTHR48083:SF18 and FadA PANTHER:PTHR43853:SF11,
  subfamilies whose members are FadE and FadA orthologues respectively (family reviews in interpro/panther/PTHR48083
  and PTHR43853). FadB uses PANTHER:PTHR43612:SF3, which besides FadB contains the anaerobic FadJ and
  some animal HADHA orthologues; all carry the same hydratase and dehydrogenase activities (review in
  interpro/panther/PTHR43612), and InterPro IPR012799 is noted as the stricter FadB equivalog. The PTHR48083
  review records that the root-placed acyl-CoA dehydrogenase and beta-oxidation IBDs need pruning from
  the HsaA monooxygenase subfamily SF19, which does not affect SF18; the PTHR43853 review records that
  the root-placed beta-oxidation and phenylacetate IBDs are too broad for PaaJ and FadA respectively.
  In P. putida KT2440 other acyl-CoA dehydrogenase, hydratase and thiolase paralogues exist whose physiological
  substrates are unresolved; family or KEGG ppu00071 membership alone does not assign them to the core
  spiral. Molecular functions and exact chemistry are asserted only on leaf annotons; no generic cytoplasmic
  location is asserted at module level. Member gene reviews apply one rule to ancestor terms: an ancestor
  of an accepted term is ACCEPTed when it names the reaction class or pathway shared by the module's steps
  (GO:0003995 acyl-CoA dehydrogenase activity, GO:0006635 fatty acid beta-oxidation), and marked TOO_GENERAL
  when it names only a broad chemistry or metabolism category (oxidoreductase, acyltransferase, lyase,
  fatty acid metabolic or catabolic process, lipid catabolic process).
