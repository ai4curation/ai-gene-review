id: MODULE:bacterial_fatty_acid_beta_oxidation
title: Bacterial fatty acid beta-oxidation spiral
description: A four-reaction bacterial mechanism that converts an accepted fatty acyl-CoA into acetyl-CoA
  and a two-carbon-shorter acyl-CoA. Dehydrogenation, hydration, NAD-dependent oxidation and thiolysis
  are implemented by distinct enzyme families and compatible multifunctional complexes. The sampled enterobacterial,
  pseudomonad, mycobacterial and Bacillus systems differ in assembly, substrate range, electron-transfer
  evidence and native endpoint. Fatty-acid transport/activation, cofactor recycling, unsaturated-substrate
  auxiliary reactions and odd-chain product disposal are external requirements rather than hidden steps
  of this core.
status: COMPLETE
scope: CONCRETE
references:
- id: PMID:35892328
  title: Degradation of Exogenous Fatty Acids in Escherichia coli.
  findings:
  - statement: E. coli fatty-acid oxidation has no experimentally identified dedicated ETF in this review;
      do not impose ETF as the universal FadE electron acceptor.
    supporting_text: no ETF system required specifically during growth on FAs has been identified
  - statement: The Putida implementation must be checked at the paralog and strain level because the review
      distinguishes two beta-oxidation systems.
    supporting_text: Pseudomonas putida displays two β-oxidation machineries
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read for the comparative beta-oxidation and respiratory-chain sections. Useful
      for E. coli framing and bacterial diversity; its proposed electron-transfer mechanisms are not direct
      biochemical assignments.
- id: PMID:23500459
  title: 'Bacterial lipids: metabolism and membrane homeostasis.'
  findings:
  - statement: Fatty acids activated to CoA can enter phospholipid incorporation or degradation; activation
      alone does not establish spiral flux.
    supporting_text: they can be placed directly into phospholipids
  - statement: The review uses E. coli to illustrate regulatory coordination; regulatory similarity does
      not supply a catalytic step assignment.
    supporting_text: repressor of genes involved in fatty acid degradation
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text inspected for synthesis-versus-degradation routing and FadR context. Broad
      lipid review, not direct evidence for a specific beta-oxidation protein or electron acceptor.
- id: PMID:40057486
  title: Pseudomonas aeruginosa acyl-CoA dehydrogenases and structure-guided inversion of their substrate
    specificity.
  findings:
  - statement: The two measured Pseudomonas FadE enzymes have different chain-length preferences; a family
      label is insufficient to infer the exact substrate range.
    supporting_text: 'FadE2 exclusively

      utilizes medium-chain acyl-CoAs'
  - statement: ETF electron transfer remains a proposal in this primary study; it must not be promoted
      into demonstrated native chemistry.
    supporting_text: predicted (but not experimentally proven)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected for the two Pseudomonas enzymes, their substrate preferences and
      the explicitly unresolved ETF proposal. Proteomics in clinical isolate Pa10348, PA14 mutant phenotypes
      and recombinant enzyme assays must be distinguished before mapping accessions.
- id: PMID:26300876
  title: Role of fatty acids in Bacillus environmental adaptation.
  findings:
  - statement: Bacillus has a regulated set of distinct fatty-acid degradation operons; gene availability
      and induction depend on context, and enterobacterial FadBA architecture must not be assumed from
      the same gene symbols.
    supporting_text: FadR represses FA β-oxidation degradation by repressing five fad operons
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Full text inspected for the degradation-regulation section and the distinction from
      branched-chain fatty-acid biosynthesis. Use as comparative architecture/regulation context, not
      as purified catalytic or universal substrate evidence.
- id: PMID:17919287
  title: Regulation of fatty acid metabolism in bacteria.
  findings:
  - statement: The same FadR name denotes regulatory contexts that need species-specific interpretation;
      degradation and synthesis regulation are distinguished in Bacillus.
    supporting_text: regulators, FadR (YsiA) and FapR.
  reference_review:
    relevance: MEDIUM
    correctness: VERIFIED
    review_notes: Cached abstract read; it directly compares E. coli and B. subtilis regulators. It supports
      regulatory divergence, not an individual enzyme assay.
- id: PMID:12057976
  title: The enigmatic Escherichia coli fadE gene is yafH.
  findings:
  - statement: E. coli FadE is established by gene disruption/complementation, not by a purified ETF-coupled
      reaction.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract plus separately acquired full primary, with strain and regulatory backgrounds
      documented in the cited source analysis. Identifies FadE by genetics; does not identify or reconstitute
      a physiological ETF relay.
- id: PMID:16385050
  title: The beta-oxidation systems of Escherichia coli and Salmonella enterica are not functionally equivalent.
  findings:
  - statement: Homologous E. coli and Salmonella spirals give different fatty-acid-utilization and intermediate-clearance
      outcomes under specified regulatory backgrounds.
    supporting_text: Exchange of homologous genes between the two organisms
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and full primary were examined through the exact LT2 genomic-construct
      and strain audit. Whole-cell acyl-CoA profiles and genetic exchanges must not be described as isolated-enzyme
      specificity measurements.
- id: PMID:368024
  title: Five different enzymatic activities are associated with the multienzyme complex of fatty acid
    oxidation from Escherichia coli.
  findings:
  - statement: The purified E. coli complex combines hydration, hydroxyacyl-CoA oxidation and thiolysis;
      auxiliary activities exist in this implementation.
    supporting_text: previously identified enoyl-CoA hydratase, L-3-hydroxyacyl-CoA dehydrogenase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Accessible abstract directly reports the purified E. coli multienzyme activities. Historical
      subunit naming and additional epimerase/isomerase chemistry are not universal claims for every ortholog.
- id: PMID:9396725
  title: Reconstitution, morphology and crystallization of a fatty acid beta-oxidation multienzyme complex
    from Pseudomonas fragi.
  findings:
  - statement: A compatible alpha partner is required for detectable P. fragi beta-subunit thiolase activity
      in the isolated-subunit experiment.
    supporting_text: the beta-dimer alone does not exhibit 3-oxoacyl-CoA thiolase activity
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The accessible primary abstract directly separates isolated alpha, isolated beta and
      reconstituted Pseudomonas fragi complex. Published faoA/faoB correspond to current fadB/fadA; identity
      is independently verified from sequences.
- id: PMID:2361950
  title: Purification of the multienzyme complex for fatty acid oxidation from Pseudomonas fragi and reconstitution
    of the fatty acid oxidation system.
  findings:
  - statement: The reconstituted P. fragi oxidation endpoint is conditional on supplied entry enzymes
      and must not be attributed to its FadBA pair alone.
    supporting_text: acyl-CoA synthetase and acyl-CoA oxidase
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Accessible primary abstract. The complete in vitro system adds an acyl-CoA synthetase
      and acyl-CoA oxidase; that does not identify a native matched FadE or its acceptor.
- id: PMID:23496842
  title: Structure of mycobacterial β-oxidation trifunctional enzyme reveals its altered assembly and
    putative substrate channeling pathway.
  findings:
  - statement: The mycobacterial TFE shares the catalytic sequence while differing in quaternary assembly.
    supporting_text: quaternary assembly is strikingly different
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and sequence-grounded H37Rv structural study. Current proteins are Rv0860/FadB
      O53872 and Rv0859/FadA O53871, not the distinct FadA2. Structural assembly differs from P. fragi.
- id: PMID:34371166
  title: Substrate specificity and conformational flexibility properties of the Mycobacterium tuberculosis
    β-oxidation trifunctional enzyme.
  findings:
  - statement: The mycobacterial TFE favors medium/long-chain substrates; a generic four-step inventory
      does not guarantee completion through every shortened intermediate.
    supporting_text: preferred substrates for MtTFE
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract plus genuine author PDF, whose provenance and key measurements are recorded
      in MYCTU/fadB source analysis. Qualitative thiolase assays and coupled hydration/HAD assays are
      distinguished.
- id: PMID:17189250
  title: Organization and function of the YsiA regulon of Bacillus subtilis involved in fatty acid degradation.
  findings:
  - statement: Bacillus degradation depends on particular native genes under tested palmitate conditions;
      a family hit alone does not prove pathway flux.
    supporting_text: affected the utilization of palmitic acid
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract plus genuine author-uploaded full paper reviewed for 168-derived pMUTIN
      strains, palmitate utilization and downstream-induction controls. ETF mutants support native dependency,
      not an isolated electron-transfer reaction.
- id: file:ECOLI/fadE/fadE-source-analysis/enterobacterial-evidence.md
  title: enterobacterial evidence
  findings:
  - statement: C8/C10/C12 growth tests in the FadE identification study use a fadR derivative; the later
      study exchanges sequence-verified LT2 fadE and fadBA constructs.
  - statement: The absence of an identified ETF candidate does not exclude ETF biochemically, but prevents
      a confident ETF-specific assertion.
    supporting_text: no candidates for an ETF homologue in the FadR regulon
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Scoped full-primary excerpts and construct/background analysis with source URLs and
      hashes; shared publication caches remain unchanged.
- id: file:PSEPK/fadB/fadB-source-analysis/primary-scope.md
  title: primary scope
  findings:
  - statement: PP2136/PP2137 have native fatty-acid fitness evidence; PP1893 is an inferred FadE rather
      than the primary native dehydrogenase established by that study.
    supporting_text: primary long-chain thiolase appears to be the fadA homolog PP_2137
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native KT2440 transposon-fitness results were read in genuine full PMID32826213, with
      provenance retained. This distinguishes exact loci from purified kinetics and explains the unresolved
      aromatic-pathway comparator identity.
- id: file:MYCTU/fadB/fadB-source-analysis/primary-scope.md
  title: primary scope
  findings:
  - statement: Mycobacterial TFE thiolysis is detected on C10/C16 substrates but not acetoacetyl-CoA in
      the reported assay; unrestricted repeated shortening is not established.
    supporting_text: no thiolase activity is detected with the substrate acetoacetyl-CoA.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary34371166 author-PDF excerpts plus assay interpretation and exact structural sequence
      bridge. Negative acetoacetyl-CoA assay is detection-limited, not an evolutionary-loss claim.
- id: file:BACSU/fadB/fadB-source-analysis/direct-assay.md
  title: direct assay
  findings:
  - statement: Bacillus FadB has direct purified-enzyme hydration evidence rather than only a pathway-genetics
      assignment.
    supporting_text: FadBBs is active in the hydratation of crotonyl-CoA
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Direct168 ysiB/fadB cloning and recombinant assay from the author-deposited publisher
      PDF DOI10.1007/s13213-010-0121-5. Crotonyl-CoA conversion is measured; product stereochemistry and
      broad chain-length range were not independently resolved.
notes: Comparative scientific review complete; publication and merge gates are tracked separately. Nineteen
  reviewed member proteins ground the four required reactions through eight families. The first reaction
  uses a proposed acceptor-unspecified activity because existing acyl-CoA dehydrogenase GO terms specify
  ETF. Omission of that GO ID is deliberate and does not deny the dehydrogenation reaction. Compiler satisfiability
  represents the four chemical roles; compatible partner, substrate, cofactor and evidence-level conditions
  are separately checked by curated endpoint witnesses. Gene review rows are preserved, including inherited
  proposals; no phenotype is silently promoted to isolated kinetics.
