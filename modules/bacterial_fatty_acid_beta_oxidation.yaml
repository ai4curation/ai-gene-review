id: MODULE:bacterial_fatty_acid_beta_oxidation
title: Bacterial fatty acid beta-oxidation spiral
description: >-
  A reusable bacterial four-reaction spiral that shortens a fatty acyl-CoA by
  two carbon atoms per turn. An acyl-CoA dehydrogenase forms a trans-2-enoyl-CoA,
  an enoyl-CoA hydratase forms a (3S)-3-hydroxyacyl-CoA, a hydroxyacyl-CoA
  dehydrogenase forms a 3-oxoacyl-CoA, and a thiolase releases acetyl-CoA plus a
  chain-shortened acyl-CoA that re-enters the first reaction. Bacterial pathway
  architecture can use separate enzymes or a multifunctional FadBA complex;
  free-fatty-acid activation and unsaturated-fatty-acid auxiliary reactions are
  outside the core spiral.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006635
    title: fatty acid beta-oxidation
    statement: Defines the biological process represented by the four-reaction spiral.
  - source_id: file:PSEPK/fadE/fadE-uniprot.txt
    title: PSEPK FadE UniProt record
    statement: >-
      Q88LN6 is assigned long- and medium-chain acyl-CoA dehydrogenase reactions
      that reduce electron-transfer flavoprotein during beta oxidation.
  - source_id: file:PSEPK/fadB/fadB-ai-review.yaml
    title: PSEPK fadB gene review
    statement: >-
      Q88L02 supplies the enoyl-CoA hydratase and (3S)-3-hydroxyacyl-CoA
      dehydrogenase activities of the FadBA complex.
  - source_id: file:PSEPK/fadA__Q88L01/fadA__Q88L01-uniprot.txt
    title: PSEPK FadA UniProt record
    statement: >-
      Q88L01 is the thiolase subunit of the FadBA complex and releases
      acetyl-CoA plus a chain-shortened acyl-CoA in the final reaction.
notes: >-
  The module is species-neutral and uses Pseudomonas putida KT2440 as a
  bacterial realization. FadD-dependent ligation of free fatty acids to CoA is
  an optional entry process, not a spiral reaction. Enoyl-CoA isomerases,
  2,4-dienoyl-CoA reductases, and related enzymes required for unsaturated
  substrates are auxiliary. Alkane oxidation, phenylacetate degradation,
  glutaryl-CoA oxidation, PHA metabolism, transport, and specialty acyl-CoA
  pathways are separate modules. Molecular functions and exact chemistry are
  asserted only on leaf annotons; no generic cytoplasmic location is asserted
  at module level.
