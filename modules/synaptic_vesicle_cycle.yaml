id: MODULE:synaptic_vesicle_cycle
title: Synaptic vesicle cycle (umbrella)
description: >-
  The life cycle of the synaptic vesicle at a presynaptic terminal, modeled as
  an organelle lifecycle with five stages: (1) neurotransmitter loading, in
  which the V-ATPase acidifies the lumen and a vesicular transporter fills the
  vesicle; (2) reserve-pool clustering, in which synapsins tether loaded
  vesicles into a phase-separated cluster from which they are mobilised on
  demand; (3) exocytosis, in which vesicles are recruited to the active zone,
  primed by Munc13/Munc18-1, and fused by the SNARE machinery when
  synaptotagmin senses Ca2+ entering through Cav2 channels; (4) endocytosis, in
  which vesicle membrane and proteins are retrieved by clathrin-dependent or
  ultrafast/bulk routes and re-formed by dynamin fission and auxilin/HSC70
  uncoating; and (5) maturation, in which the regenerated vesicle regains its
  full protein complement and is returned to the loading stage. Stages 1, 3 and
  4 are elaborated in separate modules; this umbrella carries the cycle
  topology and the hallmark machinery of each stage. Exemplars are human; the
  cycle is conserved at metazoan chemical synapses. Grounded in GO:0099504
  (synaptic vesicle cycle).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0099504
    title: synaptic vesicle cycle
    statement: The umbrella module is grounded in the GO process for the synaptic vesicle cycle.
  - source_id: PMID:24183019
    title: 'Neurotransmitter release: the last millisecond in the life of a synaptic vesicle.'
    statement: Review laying out the loading -> docking/priming -> fusion -> retrieval cycle and its molecular machinery.
  - source_id: PMID:17110340
    title: Molecular anatomy of a trafficking organelle.
    statement: Quantitative inventory of the synaptic vesicle proteome (V-ATPase, transporters, SNAREs, synaptotagmin, synapsins, synaptophysin, SV2).
  - source_id: PMID:20438797
    title: 'The synapsins: key actors of synapse function and plasticity.'
    statement: Review of synapsin-dependent tethering of the reserve pool and its phosphorylation-regulated mobilisation.
  - source_id: PMID:28279363
    title: 'Synaptic Vesicle Clusters at Synapses: A Distinct Liquid Phase?'
    statement: Proposes that synapsin-mediated vesicle clusters are a liquid phase, framing the reserve-pool stage.
notes: >-
  Umbrella over MODULE:synaptic_vesicle_neurotransmitter_loading,
  MODULE:synaptic_vesicle_exocytosis and MODULE:synaptic_vesicle_endocytosis.
  Each stage node here carries only the hallmark participants needed to
  identify the stage; the detailed decomposition (variants, complexes, PAINT
  anchors) lives in the stage modules. Reserve-pool clustering and vesicle
  maturation are modeled directly here because they do not warrant standalone
  modules. Dense-core vesicle and neuropeptide release are out of scope.
knowledge_gaps:
  - gap_statement: >-
      The molecular steps of synaptic vesicle maturation (how a regenerated
      vesicle re-acquires its full protein complement and release competence)
      are poorly defined beyond synaptophysin-assisted VAMP2 sorting, and the
      function of the abundant vesicle protein SV2 remains unknown.
    boundary: >-
      The vesicle proteome is quantitatively known, and synaptophysin, VAMP2
      and SV2 are established stoichiometric residents of the mature vesicle.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Determines whether maturation deserves its own module parts or should be folded into endocytosis.
    resolution: Time-resolved proteomics of regenerated vesicles after ultrafast endocytosis and SV2 structure-function work.
  - gap_statement: >-
      Whether synapsin-driven liquid-liquid phase separation, rather than
      actin tethering, is the dominant mechanism maintaining the reserve pool
      in vivo has not been settled.
    boundary: >-
      Synapsins are required for reserve-pool maintenance and form
      vesicle-containing condensates in vitro.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Decides whether the clustering annoton should carry a condensate-scaffold rather than a cytoskeletal-anchor molecular function.
    resolution: In-vivo perturbation of synapsin IDR phase behaviour without disrupting actin binding.
    provenance:
      - reference_id: PMID:28279363
        supporting_text: could underlie the formation of synaptic vesicle (SV)
        reference_section_type: ABSTRACT
