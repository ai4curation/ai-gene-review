  notes: >-
    NEW module from the YeastPathways crosswalk (YEAST-RNT-SALV,
    YEAST-SALV-PYRMID-DNTP) and the PomBase model 69a0c46f00003691, scoped to
    fungal pyrimidine base/nucleoside salvage with animal and bacterial
    alternatives as variants. All YeastCyc catalysts (FUR1, URK1, CDD1, URH1,
    FCY1, URA6, YNK1) are correct; the CDP-to-CTP step (YNK1) is the NDP kinase
    step of de_novo_pyrimidine_synthesis and is not repeated. The defining
    realisation caveats are absences: S. cerevisiae and S. pombe have no
    thymidine kinase, uridine/thymidine phosphorylase or deoxyuridine kinase
    (the gene-less THYKI-RXN, THYM-PHOSPH-RXN, URA-PHOSPH-RXN and DURIDKI-RXN
    of YEAST-SALV-PYRMID-DNTP; no S288C or S. pombe UniProt protein carries EC
    2.7.1.21, 2.4.2.3 or 2.4.2.4, checked 2026-10-06), so the thymidine kinase
    part is optional and has only animal/bacterial exemplars; deoxyuridine
    cannot replace uracil for ura- yeast. Deoxycytidine is handled by URK1 and
    URH1 (PMID:12111094). GO-CAM disagreements: FCY1 carries the obsolete
    GO:0102480 and URA6 the obsolete GO:0004127; URK1 cytidine phosphorylation
    uses GO:0004849 rather than GO:0043771. In the PomBase model, uracil
    phosphoribosyltransferase activity is asserted for three proteins: Q9HE15
    (SPAC1399.04c, a UPRT domain protein classified by PANTHER as a uridine
    kinase-family member), O13867 (SPAC1B3.01c) and urg2 (Q9US43, a
    plastid-type UPRT, PTHR32315:SF4); only O13867, annotated part_of uracil
    salvage, is used as an exemplar, and the PomBase cytidine kinase
    SPAC227.14 (Q9UTC5) is noted but not used. The PomBase S. pombe fcy1
    (O59834) is classified by PANTHER in the TAD2 subfamily; it is retained as
    an exemplar because PomBase asserts cytosine deaminase activity. Uptake
    permeases (FUR4 uracil, FUI1 uridine, FCY2 purine-cytosine) are transport
    steps outside the enzymatic core, as are the 5'-nucleotidases and the
    pyrimidine catabolism activities of the PomBase model
    (pyrimidine_nucleotide_catabolism). Downstream, UMP and CDP join
    de_novo_pyrimidine_synthesis (UTP/CTP) and dntp_de_novo_synthesis.
