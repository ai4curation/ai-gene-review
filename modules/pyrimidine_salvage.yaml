id: MODULE:pyrimidine_salvage
title: Pyrimidine base and nucleoside salvage
description: >-
  Recycling of preformed pyrimidine bases and ribonucleosides, taken up from
  the environment or released by RNA and nucleotide turnover, into UMP and
  CMP. Uracil is converted directly to UMP by uracil
  phosphoribosyltransferase with PRPP. Uridine and cytidine are
  phosphorylated by uridine-cytidine kinase to UMP and CMP; alternatively,
  cytidine is deaminated to uridine by cytidine deaminase, and the
  ribonucleosides are cleaved to their free bases either by a nucleoside
  hydrolase (fungi and protists) or by uridine phosphorylase (animals and
  bacteria). Cytosine is deaminated to uracil by cytosine deaminase, an
  enzyme present in fungi and bacteria but absent from animals; this is why
  the antifungal prodrug 5-fluorocytosine is selectively toxic to fungi.
  CMP made by salvage is phosphorylated to CDP by UMP/CMP kinase, and UMP
  joins the de novo product for conversion to UTP and CTP. The same enzymes
  act on some deoxyribonucleosides (deoxycytidine is phosphorylated or
  cleaved), but thymidine salvage requires thymidine kinase, which animals
  and many bacteria have and budding and fission yeasts lack. Uptake of
  pyrimidine bases and nucleosides by plasma-membrane permeases precedes the
  module.
status: DRAFT
evidence:
  - source_id: YeastPathways:YEAST-RNT-SALV
    title: salvage pathways of pyrimidine ribonucleotides (S. cerevisiae, SGD YeastPathways)
    statement: >-
      FUR1, URK1 (uridine and cytidine), CDD1, URH1 (uridine and cytidine),
      FCY1, URA6 (CMP kinase) and YNK1 (CDP kinase); the comment describes
      uptake by Fur4p, Fcy2p and Fui1p.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=YEAST-RNT-SALV
  - source_id: YeastPathways:YEAST-SALV-PYRMID-DNTP
    title: salvage pathways of pyrimidine deoxyribonucleotides (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Deoxycytidine phosphorylation (URK1), deamination (CDD1) and cleavage
      (URH1); deoxyuridine kinase, uridine/thymidine phosphorylase and
      thymidine kinase reactions are listed without genes because S.
      cerevisiae lacks them.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=YEAST-SALV-PYRMID-DNTP
  - source_id: GO:0008655
    title: pyrimidine-containing compound salvage
    statement: Module-level process term.
  - source_id: PMID:2189783
    title: 'The FUR1 gene of Saccharomyces cerevisiae: cloning, structure and expression of wild-type and mutant alleles.'
    statement: FUR1 encodes uracil phosphoribosyltransferase, converting uracil to UMP in the salvage pathway.
  - source_id: PMID:2169608
    title: The URK1 gene of Saccharomyces cerevisiae encoding uridine kinase.
    statement: Identification of URK1 as the yeast uridine kinase gene.
  - source_id: PMID:10501935
    title: 'New insights into the pyrimidine salvage pathway of Saccharomyces cerevisiae: requirement of six genes for cytidine metabolism.'
    statement: >-
      CDD1 encodes cytidine deaminase; cytidine enters through Fcy2p, is
      cleaved to cytosine by Urh1p or phosphorylated to CMP by Urk1p, and
      cytosine deaminase (Fcy1p) is limiting for cytidine use as a UMP
      precursor.
  - source_id: PMID:12111094
    title: The URH1 uridine ribohydrolase of Saccharomyces cerevisiae.
    statement: >-
      URH1 encodes a nucleoside hydrolase active on uridine, cytidine and
      deoxycytidine, related to protozoan inosine-uridine nucleoside
      hydrolases.
  - source_id: PMID:9000374
    title: Characterization of the Saccharomyces cerevisiae FCY1 gene encoding cytosine deaminase and its homologue FCA1 of Candida albicans.
    statement: >-
      FCY1 disruption abolishes cytosine deaminase and confers
      5-fluorocytosine resistance; Fcy1p resembles cytidine/CMP deaminases,
      not E. coli cytosine deaminase.
  - source_id: PMID:1333436
    title: 'The adenylate kinase family in yeast: identification of URA6 as a multicopy suppressor of deficiency in major AMP kinase.'
    statement: URA6 UMP kinase also phosphorylates CMP.
  - source_id: PMID:9485596
    title: The ORF YBL042 of Saccharomyces cerevisiae encodes a uridine permease.
    statement: FUI1 (YBL042C) encodes the uridine permease (uptake, outside the module core).
  - source_id: PMID:23670538
    title: Nucleotide degradation and ribose salvage in yeast.
    statement: Urh1 releases ribose from pyrimidine nucleosides during starvation; pnp1 urh1 double mutants fail to salvage nucleotides.
  - source_id: PMID:14500848
    title: Reconstitution of an efficient thymidine salvage pathway in Saccharomyces cerevisiae.
    statement: >-
      Thymidine salvage in budding yeast requires expression of a heterologous
      nucleoside kinase and nucleoside transporter.
  - source_id: PMID:15157888
    title: In vivo labeling of fission yeast DNA with thymidine and thymidine analogs.
    statement: >-
      Yeasts neither take up exogenous thymidine efficiently nor phosphorylate
      it; fission yeast needs human ENT1 and herpes simplex virus thymidine
      kinase to incorporate thymidine.
  - source_id: PMID:5729618
    title: 'Thymidine kinase: evidence for its absence from Neurospora crassa and some other micro-organisms, and the relevance of this to the specific labelling of deoxyribonucleic acid.'
    statement: Classic evidence that thymidine kinase is absent from several fungi.
module:
  id: pyrimidine_salvage
  label: Pyrimidine base and nucleoside salvage
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: pyrimidine-containing compound salvage
      term:
        id: GO:0008655
        label: pyrimidine-containing compound salvage
      description: Conversion of uracil, cytosine, uridine and cytidine to UMP and CMP.
  context:
    taxa:
      - preferred_term: Fungi
        term:
          id: NCBITaxon:4751
          label: Fungi
        description: >-
          The scope is centred on fungi (cytosine deaminase, nucleoside
          hydrolase, no thymidine kinase); animal and bacterial alternatives
          are modelled as variants or optional parts.
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
  gocam_associations:
    - model: gomodel:YeastPathways_YEAST-RNT-SALV
      title: 'salvage pathways of pyrimidine ribonucleotides - imported from: Saccharomyces Genome Database'
      description: >-
        FUR1, URK1, FCY1, CDD1, URH1, URA6 and YNK1 in cytosol, part_of
        GO:0010138. FCY1 is given the obsolete GO:0102480 (5-fluorocytosine
        deaminase) and URA6 the obsolete GO:0004127.
    - model: gomodel:YeastPathways_YEAST-SALV-PYRMID-DNTP
      title: 'salvage pathways of pyrimidine deoxyribonucleotides - imported from: Saccharomyces Genome Database'
      description: URK1, CDD1 and URH1 acting on deoxycytidine, part_of GO:0043099.
    - model: gomodel:69a0c46f00003691
      title: pyrimidine nucleobase metabolic process (GO:0006206)
      description: >-
        PomBase S. pombe model combining salvage (three uracil
        phosphoribosyltransferases, urk1, a putative cytidine kinase, fcy1,
        cdd1, urh1/urh2) with de novo UMP and CTP synthesis
        (de_novo_pyrimidine_synthesis), 5'-nucleotidases and an uncharacterised
        pyrimidine catabolism branch.
  parts:
    - order: 1
      role: uracil phosphoribosylation
      node:
        id: uracil_prt_step
        label: uracil + PRPP to UMP + PPi
        module_type: REACTION
        annotons:
          - id: uracil_prt_activity
            label: Uracil phosphoribosyltransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Upp-type uracil phosphoribosyltransferases
                description: >-
                  No single PANTHER family covers the fungal and bacterial
                  enzymes (FUR1 is unclassified, E. coli Upp is in
                  PTHR32315:SF4), so no family id is asserted.
                representative_members:
                  - preferred_term: FUR1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P18562
                      label: Uracil phosphoribosyltransferase
                    description: PMID:2189783.
                  - preferred_term: SPAC1B3.01c (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:O13867
                      label: Uracil phosphoribosyltransferase 1
                  - preferred_term: upp (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A8F0
                      label: Uracil phosphoribosyltransferase
            function:
              preferred_term: uracil phosphoribosyltransferase activity
              term:
                id: GO:0004845
                label: uracil phosphoribosyltransferase activity
              substrates:
                - preferred_term: uracil
                - preferred_term: PRPP
              products:
                - preferred_term: UMP
                - preferred_term: diphosphate
              evidence:
                - source_id: EC:2.4.2.9
                  statement: uracil phosphoribosyltransferase
                - source_id: PMID:2189783
                  supporting_text: >-
                    The FUR1 gene of Saccharomyces cerevisiae encodes uracil
                    phosphoribosyltransferase (UPRTase) which catalyses the
                    conversion of uracil into uridine 5'-monophosphate (UMP) in
                    the pyrimidine salvage pathway.
            gocam_associations:
              - model: gomodel:YeastPathways_YEAST-RNT-SALV
                activity: gomodel:URACIL-PRIBOSYLTRANS-RXN
                title: 'salvage pathways of pyrimidine ribonucleotides - imported from: Saccharomyces Genome Database'
                description: FUR1 enables GO:0004845 in cytosol.
              - model: gomodel:69a0c46f00003691
                activity: gomodel:69a0c46f00003691/69a0c46f00004406
                title: pyrimidine nucleobase metabolic process (GO:0006206)
                description: S. pombe SPAC1B3.01c enables GO:0004845, part_of uracil salvage.
            role_description: >-
              Single step from uracil to UMP; target of 5-fluorouracil
              activation, so fur1 mutants are 5-FU resistant.
    - order: 2
      role: uridine and cytidine phosphorylation
      node:
        id: uridine_cytidine_kinase_step
        label: uridine/cytidine + ATP (or GTP) to UMP/CMP
        module_type: REACTION
        annotons:
