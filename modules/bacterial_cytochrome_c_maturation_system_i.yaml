id: MODULE:bacterial_cytochrome_c_maturation_system_i
title: Bacterial cytochrome c maturation system I
description: >-
  A reusable bacterial module for covalent attachment of heme to exported
  c-type cytochrome apoproteins by cytochrome c maturation system I. The
  canonical CcmABCDEFGH machinery combines CcmCDE-dependent heme trafficking
  and holo-CcmE formation, downstream CcmAB-dependent energy coupling, CcmG/CcmH thiol
  reduction, and CcmF/CcmH-dependent heme ligation. Lineage-dependent
  CcmI/CycH-family factors can support the ligation stage. Sec-dependent
  apocytochrome export, upstream DsbD electron delivery, and heme biosynthesis
  are external dependencies.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0018063
    title: cytochrome c-heme linkage
    statement: >-
      GO:0018063 defines the process boundary as covalent linkage of heme to
      cytochrome c.
  - source_id: GO:0004408
    title: holocytochrome-c synthase activity
    statement: >-
      GO:0004408 defines the terminal molecular function as conversion of
      apocytochrome c and heme to holocytochrome c.
  - source_id: PMID:10339610
    title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires the CcmC protein, which may function independently of the ABC-transporter CcmAB.
    statement: >-
      Direct experiments distinguish the CcmAB energy-coupling subcomplex from
      the CcmC-dependent heme-transfer step and place CcmD in stabilization of
      membrane-associated CcmE.
  - source_id: PMID:17419738
    title: Loss of ATP hydrolysis activity by CcmAB results in loss of c-type cytochrome synthesis and incomplete processing of CcmE.
    statement: >-
      CcmAB ATP hydrolysis is required for efficient processing and release of
      holo-CcmE rather than an established heme-export reaction.
  - source_id: PMID:19721088
    title: "Cytochrome c biogenesis: mechanisms for covalent modifications and trafficking of heme and for heme-iron redox control."
    statement: >-
      The system I framework separates CcmABCD/CcmE heme handling from
      CcmF/CcmH-dependent heme-iron reduction and ligation.
  - source_id: PMID:18753134
    title: "The cytochrome c maturation components CcmF, CcmH, and CcmI form a membrane-integral multisubunit heme ligation complex."
    statement: >-
      Biochemical evidence supports a membrane-integral CcmF/CcmH ligation
      complex with a lineage-dependent CcmI-family accessory.
  - source_id: PMID:20544959
    title: >-
      Structural and functional characterization of CcmG from Pseudomonas
      aeruginosa, a key component of the bacterial cytochrome c maturation
      apparatus.
    statement: >-
      Structural analysis supports CcmG thiol-disulfide reductase activity and
      proposes a CcmH-apocytochrome mixed disulfide as a physiological substrate.
  - source_id: PMID:28634234
    title: The thioreduction component CcmG confers efficiency and the heme ligation component CcmH ensures stereo-specificity during cytochrome c maturation.
    statement: >-
      Reconstituted biochemistry separates the efficiency contribution of CcmG
      from the stereospecific ligation role of CcmH.
  - source_id: PMID:8231805
    title: Formation of several bacterial c-type cytochromes requires a novel membrane-anchored protein that faces the periplasm.
    statement: >-
      Disruption of a characterized CycH-family ortholog causes broad loss of
      c-type cytochromes.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_cytochrome_c_maturation_system_i__ppu02010-deep-research-openscientist.md
    title: PSEPK cytochrome c maturation system I module/pathway/taxon research
    statement: >-
      The report confirms that the nine selected PSEPK proteins cover the
      internal module and distinguishes PP_5748 CcmH from PP_4320 CcmI/CycH.
      Its recommendation to assign heme transport to CcmABC is rejected because
      it conflicts with direct experimental evidence.
  - source_id: file:modules/bacterial_cytochrome_c_maturation_system_i-deep-research-openscientist.md
    title: Generic bacterial cytochrome c maturation system I research
    statement: >-
      The report supports CcmABCD physical assembly, CcmE heme chaperoning, the
      CcmG/CcmH redox relay, and CcmF/CcmH ligation. Its membrane-trafficking
      language is interpreted as intramachinery heme handling, not a literal
      CcmAB heme-export function.
module:
  id: bacterial_cytochrome_c_maturation_system_i
  label: Bacterial cytochrome c maturation system I
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: cytochrome c-heme linkage
      term:
        id: GO:0018063
        label: cytochrome c-heme linkage
      description: >-
        System I covalently attaches heme to the CXXCH motif of an exported
        c-type cytochrome apoprotein.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: heme trafficking and holo-CcmE formation
      node:
        id: ccmabcde_heme_trafficking
        label: CcmABCDE heme trafficking and holo-CcmE formation
        module_type: BIOLOGICAL_PROCESS
        description: >-
          CcmC binds heme and loads it covalently onto CcmE with support from
          CcmD, after which CcmAB supplies ATP-dependent energy coupling for
          holo-CcmE processing and release. CcmA-D can associate in a larger
          membrane complex, while the CcmAB energy-coupling and CcmCDE
          heme-loading roles remain functionally distinguishable. The transported
          substrate or coupled transition of CcmAB remains unresolved.
        parts:
          - order: 1
            role: heme transfer and covalent loading of CcmE
            node:
              id: ccmcde_holo_ccme_formation
              label: CcmCDE holo-CcmE-forming assembly
              module_type: PROTEIN_COMPLEX
              annotons:
                - id: ccmc_heme_handling_subunit
                  label: CcmC heme-handling subunit
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: CcmC cytochrome-c-biogenesis family
                      term:
                        id: InterPro:IPR003557
                        label: Cyt_c_biogenesis_CcmC
                      representative_members:
                        - preferred_term: CcmC (Pseudomonas putida KT2440)
                          term:
                            id: UniProtKB:Q88EX7
                            label: Heme exporter protein C
                  function:
                    preferred_term: heme binding
                    term:
                      id: GO:0020037
                      label: heme binding
                  role_description: >-
                    Binds membrane-associated heme and supports covalent heme
                    transfer to CcmE; literal heme transmembrane transport is
                    not asserted.
                - id: ccmd_accessory_subunit
                  label: CcmD accessory subunit
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: CcmD cytochrome-c-maturation family
                      term:
