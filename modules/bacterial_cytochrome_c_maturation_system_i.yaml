id: MODULE:bacterial_cytochrome_c_maturation_system_i
title: Bacterial cytochrome c maturation system I
description: >-
  A reusable bacterial module for covalent attachment of heme to exported
  c-type cytochrome apoproteins by the Ccm (system I) machinery. The module
  comprises CcmABCD-dependent heme handling, covalent loading of the CcmE heme
  chaperone, reductive preparation of apocytochrome CXXCH motifs, and
  CcmF/CcmH-dependent heme ligation, with lineage-variable CycH-family factors
  supporting maturation by a molecular mechanism that remains unresolved. General
  Sec export of apocytochromes and upstream DsbD electron delivery are external
  dependencies rather than parts of this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0017003
    title: protein-heme linkage
    statement: GO:0017003 provides the process boundary for covalent heme attachment to apocytochromes.
  - source_id: GO:0017004
    title: cytochrome complex assembly
    statement: GO:0017004 provides broader assembly context for the Ccm machinery.
  - source_id: file:PSEPK/ccmA/ccmA-uniprot.txt
    title: UniProtKB entry for PSEPK CcmA
    statement: Q88EX5 is the ATPase of the CcmAB heme-handling transporter complex.
  - source_id: file:PSEPK/ccmE/ccmE-uniprot.txt
    title: UniProtKB entry for PSEPK CcmE
    statement: Q88EX9 is the heme chaperone required for c-type cytochrome biogenesis.
  - source_id: file:PSEPK/ccmG/ccmG-uniprot.txt
    title: UniProtKB entry for PSEPK CcmG
    statement: Q88EY1 is a periplasmic thioredoxin-family CcmG/DsbE protein.
  - source_id: file:PSEPK/ccmF/ccmF-uniprot.txt
    title: UniProtKB entry for PSEPK CcmF
    statement: Q88EY0 is the membrane holocytochrome-c synthetase component.
  - source_id: PMID:19721088
    title: "Cytochrome c biogenesis: mechanisms for covalent modifications and trafficking of heme and for heme-iron redox control."
    statement: The system I framework separates CcmABCD/CcmE heme handling from CcmFH-dependent reduction and ligation.
  - source_id: PMID:10339610
    title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires the CcmC protein, which may function independently of the ABC-transporter CcmAB.
    statement: Direct experiments establish CcmC-dependent covalent heme loading of the CcmE chaperone.
  - source_id: PMID:28634234
    title: The thioreduction component CcmG confers efficiency and the heme ligation component CcmH ensures stereo-specificity during cytochrome c maturation.
    statement: Biochemistry supports both direct CcmG reduction of apocytochrome and resolution of CcmH-apocytochrome intermediates.
  - source_id: PMID:8231805
    title: Formation of several bacterial c-type cytochromes requires a novel membrane-anchored protein that faces the periplasm.
    statement: Disruption of a characterized CycH-family ortholog causes broad loss of c-type cytochromes.
