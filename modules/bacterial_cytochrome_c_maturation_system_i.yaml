                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: CcmH cytochrome-c-maturation family
                              term:
                                id: PANTHER:PTHR47870:SF1
                                label: CYTOCHROME C-TYPE BIOGENESIS PROTEIN CCMH
                              representative_members:
                                - preferred_term: CcmH (Pseudomonas putida KT2440)
                                  term:
                                    id: UniProtKB:A0A140FWM4
                                    label: Cytochrome c-type biogenesis protein
                  function:
                    preferred_term: holocytochrome-c synthase activity
                    term:
