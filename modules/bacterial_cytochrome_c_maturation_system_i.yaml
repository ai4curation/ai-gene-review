notes: >-
  The CcmABCD complex is represented as heme handling rather than literal
  extracellular heme export: its ATP-dependent role supports CcmE loading and
  release during cytochrome-c maturation, while the transported substrate and
  detailed coupling remain incompletely resolved. General DsbD-mediated
  electron supply and Sec-dependent export of apocytochromes are connected
  modules. PSEPK CycH is the CycH-family TPR exemplar; CcmH and CycH are distinct
  proteins. CycH-family factors are not universal requirements of every system I
  lineage, and their direct molecular mechanism remains unresolved.
