id: MODULE:bacterial_cytochrome_c_maturation_system_i
title: Bacterial cytochrome c maturation system I
description: Bacterial cytochrome c maturation System I couples heme handling and ATP-dependent processing
  to covalent attachment of heme to exported c-type cytochrome apoproteins. The canonical histidine-CcmE
  route uses CcmG-supported redox preparation and CcmFH ligation, with lineage-dependent fused or separate
  CcmI-like accessories. The experimentally reconstructed G20 System I* route uses cysteine-linked CcmE
  and functions without CcmG/H; its CcmI enhances yield. Sec export, heme biosynthesis and lineage-specific
  upstream reductant supply are external dependencies. Archaeal and mitochondrial implementations are
  outside this bacterial module.
status: COMPLETE
scope: ABSTRACT
evidence:
- source_id: GO:0018063
  title: cytochrome c-heme linkage
  statement: GO:0018063 defines the process boundary as covalent linkage of heme to cytochrome c.
- source_id: GO:0004408
  title: holocytochrome-c synthase activity
  statement: GO:0004408 defines the terminal molecular function as conversion of apocytochrome c and heme
    to holocytochrome c.
- source_id: PMID:10339610
  title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires the CcmC protein,
    which may function independently of the ABC-transporter CcmAB.
  statement: Direct experiments distinguish the CcmAB energy-coupling subcomplex from the CcmC-dependent
    heme-transfer step. Its proposal that CcmD stabilizes membrane-associated CcmE is disputed by PMID:18326572,
    which found CcmD dispensable for heme transfer to CcmE but required for holo-CcmE release.
- source_id: PMID:18326572
  title: Topology and function of CcmD in cytochrome c maturation.
  statement: In E. coli, CcmD is a component of the CcmABC complex that is not needed for heme transfer
    to CcmE but is absolutely required for release of holo-CcmE from CcmABCD.
- source_id: PMID:17419738
  title: Loss of ATP hydrolysis activity by CcmAB results in loss of c-type cytochrome synthesis and incomplete
    processing of CcmE.
  statement: Purified CcmAB ATPase and K40D perturbation distinguish ATP-dependent maturation/processing
    from retained CcmE heme attachment in E. coli.
- source_id: PMID:19721088
  title: 'Cytochrome c biogenesis: mechanisms for covalent modifications and trafficking of heme and for
    heme-iron redox control.'
  statement: The System I synthesis distinguishes CcmABCD/CcmE heme handling, proposed CcmF-associated
    heme-iron reduction and CcmH-linked apocytochrome redox handling/ligation; it does not identify CcmH
    as a heme-iron reductase.
- source_id: PMID:18753134
  title: The cytochrome c maturation components CcmF, CcmH, and CcmI form a membrane-integral multisubunit
    heme ligation complex.
  statement: Tagged Rhodobacter F/H/I components associate in membrane-derived material; exact strain/construct
    limits are recorded and no universal obligate FHI stoichiometry is inferred.
- source_id: PMID:20544959
  title: Structural and functional characterization of CcmG from Pseudomonas aeruginosa, a key component
    of the bacterial cytochrome c maturation apparatus.
  statement: Structural analysis supports CcmG thiol-disulfide reductase activity and proposes a CcmH-apocytochrome
    mixed disulfide as a physiological substrate.
- source_id: PMID:28634234
  title: The thioreduction component CcmG confers efficiency and the heme ligation component CcmH ensures
    stereo-specificity during cytochrome c maturation.
  statement: Reconstituted biochemistry separates the efficiency contribution of CcmG from the stereospecific
    ligation role of CcmH.
- source_id: PMID:8231805
  title: Formation of several bacterial c-type cytochromes requires a novel membrane-anchored protein
    that faces the periplasm.
  statement: Bradyrhizobium CycH supports most tested cellular c-type cytochromes, with cytochrome c1
    spared; accessory dependence is substrate-specific.
- source_id: PMID:9712585
  title: Prototype of a heme chaperone essential for cytochrome c maturation.
  statement: E. coli CcmE binds heme covalently through a histidine and delivers it to apocytochrome c,
    defining the heme-chaperone step.
- source_id: PMID:16824107
  title: ABC transporter-mediated release of a haem chaperone allows cytochrome c biogenesis.
  statement: Canonical E. coli holo-CcmE is trapped in a CcmC-associated complex without functional CcmAB;
    ATP-dependent release is supported but does not exclude additional heme-handling roles.
- source_id: PMID:19629033
  title: A conserved haem redox and trafficking pathway for cofactor attachment.
  statement: E. coli CcmF heme-b and in-vitro quinol:heme oxidoreductase data support a proposed heme-redox
    step; these do not establish the same required quinone site or electron donor in System I*.
- source_id: PMID:11744735
  title: A bacterial cytochrome c heme lyase. CcmF forms a complex with the heme chaperone CcmE and CcmH
    but not with apocytochrome c.
  statement: E. coli CcmF interacts with holo-CcmE and CcmH, supporting a CcmFH heme lyase complex.
- source_id: PMID:9537397
  title: The active-site cysteines of the periplasmic thioredoxin-like protein CcmG of Escherichia coli
    are important but not essential for cytochrome c maturation in vivo.
  statement: 'E. coli CcmG deletion and active-site-cysteine mutations have different outcomes: low maturation
    persists in the cysteine variants and exogenous thiols can improve these, whereas deletion is not
    rescued by those thiols.'
- source_id: PMID:40460019
  title: Mechanisms and Control of Heme Transport and Incorporation into Cytochrome c.
  statement: Recent synthesis compares structures and mechanisms of three maturation systems; bacterial
    System I/II must be distinguished from mitochondrial System III.
- source_id: PMID:21958041
  title: Cytochrome c biogenesis System I.
  statement: System I* uses a cysteine-bearing CcmE and can omit the canonical CcmG/H requirement in characterized
    strains; not every cysteine-CcmE lineage lacks CcmH.
- source_id: PMID:24631867
  title: 'Cytochrome c biogenesis System I: an intricate process catalyzed by a maturase supercomplex?'
  statement: Ccm components occur in distinct gene arrangements and CcmI is separate in Rhodobacter but
    fused to CcmH in E. coli.
- source_id: PMID:40026579
  title: Complexation of CcmB with CcmACD safeguards heme translocation for cytochrome c maturation.
  statement: The authors assign CcmB a heme-translocase role and complexation with CcmACD a routing role
    toward maturation.
- source_id: PMID:40167305
  title: Biochemical mapping reveals a conserved heme transport mechanism via CcmCD in System I bacterial
    cytochrome c biogenesis.
  statement: Mapped heme contacts span cytoplasmic acceptance and a proposed CcmC membrane channel leading
    to the WWD domain.
- source_id: PMID:37626034
  title: Architecture of the Heme-translocating CcmABCD/E complex required for Cytochrome c maturation.
  statement: E. coli CcmABCD forms a structurally resolved complex associated with CcmE; the structural
    transport model needs comparison with the two conflicting 2025 studies.
- source_id: PMID:21956106
  title: CcmI subunit of CcmFHI heme ligation complex functions as an apocytochrome c chaperone during
    c-type cytochrome maturation.
  statement: Rhodobacter CcmI binds apocytochrome c; full-length tagged construct donor and domain-specific
    MT1131 cloning are distinguished in the individual review.
- source_id: PMID:20466730
  title: c-Type cytochrome biogenesis can occur via a natural Ccm system lacking CcmH, CcmG, and the heme-binding
    histidine of CcmE.
  statement: The G20 cassette produces mature heterologous c-type cytochromes without CcmG/H and uses
    Cys127-linked CcmE. CcmI deletion retains product; further CcmD deletion removes detectable product.
    Full-text donor/deletion evidence and corrected detection limits are recorded in the source analysis.
- source_id: PMID:24044352
  title: Probing heme delivery processes in cytochrome c biogenesis System I.
  statement: CcmA/F/C mutagenesis separates ATP-dependent heme handling from downstream ligation; the
    experimental CcmC residue numbering differs from the current reference sequence by 18 residues.
- source_id: file:genes/OLEA2/ccmE/ccmE-source-analysis/primary-evidence.md
  title: G20 System I* primary evidence and identity
  statement: Records exact donor evidence, native sequence/CDS comparisons, CcmC numbering limits, sequential
    CcmI/CcmD truncation interpretation and the corrected detection sensitivity.
- source_id: PMID:18786143
  title: Compensatory thio-redox interactions between DsbA, CcdA and CcmG unveil the apocytochrome c holdase
    role of CcmG during cytochrome c maturation.
  statement: In Rhodobacter DsbA-null backgrounds, CcmG/CcdA redox requirements can be bypassed, while
    thiol-inactive CcmG improves maturation and binds apocytochrome in vitro; CcmH remains required under
    those tested conditions.
- &id001
  source_id: PMID:24397552
  title: 'The CcmFH complex is the system I holocytochrome c synthetase: engineering cytochrome c maturation
    independent of CcmABCDE.'
  statement: Engineered E. coli CcmFGH-only expression produces covalently attached, correctly processed
    holocytochromes without CcmABCDE, supporting terminal synthase chemistry in the CcmFH apparatus. Engineered
    heme/expression conditions do not establish that native cells ordinarily dispense with upstream delivery.
