notes: >-
  This module represents the canonical system I boundary. CcmAB is modeled as
  an ATP-dependent energy-coupling subcomplex, not as a literal heme exporter.
  CcmCDE performs heme transfer and holo-CcmE formation, while CcmG and CcmH
  provide the thiol-redox dependency that converges with holo-CcmE at the
  CcmF/CcmH ligation complex. CcmH therefore appears in both the redox and
  ligation roles. CcmI/CycH-family accessories are lineage dependent: a
  separate CycH protein in Pseudomonas and Bradyrhizobium, a TPR domain fused
  to CcmH in E. coli. General Sec export, DsbD electron supply, and heme
  biosynthesis remain outside the module. Taxonomic scope: the Ccm proteins
  are conserved across system I organisms, and the module is grounded with
  experimentally characterized E. coli K-12 representatives alongside
  Pseudomonas putida KT2440 exemplars. Firmicutes, Actinobacteria,
  cyanobacteria and chloroplasts use the unrelated system II (CcsBA/ResBC),
  and fungal and animal mitochondria use system III (holocytochrome c
  synthase, HCCS), so the module is not generalized to Bacillus,
  Mycobacterium, yeast or human; the NCBITaxon:2 context marks the bacterial
  origin of the pathway rather than universality across bacteria. Plant
  mitochondrial homologs (e.g. Arabidopsis CCME, CCMFN1, ABCI1) fall in the
  same PANTHER families but have not been reviewed here. Family groundings
  use PANTHER subfamilies; PTHR30071:SF1 also contains system II CcsA/ResC and
  PTHR42852:SF6 contains system II ResA, so only the molecular functions
  shared with those members (heme binding, protein-disulfide reductase
  activity) are asserted at family level, and the system I-specific roles
  are carried by the module structure.
