              term:
                id: GO:0015035
                label: protein-disulfide reductase activity
            role_description: >-
              Supplies thiol-reducing activity by reducing apocytochrome
              disulfides and/or resolving CcmH-apocytochrome mixed-disulfide
              intermediates, depending on system architecture.
          - id: ccmh_redox_component
            label: CcmH redox component
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CcmH cytochrome-c-maturation family
                term:
