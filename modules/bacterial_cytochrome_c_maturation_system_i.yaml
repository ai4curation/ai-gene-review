- id: PMID:10339610
  title: Heme transfer to the heme chaperone CcmE during cytochrome c maturation requires the CcmC protein,
    which may function independently of the ABC-transporter CcmAB.
  findings:
  - statement: Direct experiments distinguish the CcmAB energy-coupling subcomplex from the CcmC-dependent
      heme-transfer step. Its proposal that CcmD stabilizes membrane-associated CcmE is disputed by PMID:18326572,
      which found CcmD dispensable for heme transfer to CcmE but required for holo-CcmE release.
  - statement: E. coli CcmC is required for heme loading of CcmE independently of CcmAB in the reported
      assays.
