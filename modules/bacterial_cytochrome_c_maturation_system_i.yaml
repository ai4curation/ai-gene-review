- id: PMID:20466730
  title: c-Type cytochrome biogenesis can occur via a natural Ccm system lacking CcmH, CcmG, and the heme-binding
    histidine of CcmE.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal cache is abstract-only; full PMC HTML was independently read for donor, construct
      and deletion results. Committed G20 source analysis documents provenance, exact-sequence limits
      and the 2011 erratum correcting detection sensitivity.
  findings:
  - statement: The G20 cassette produces mature heterologous c-type cytochromes without CcmG/H and uses
      Cys127-linked CcmE. CcmI deletion retains product; further CcmD deletion removes detectable product.
      Full-text donor/deletion evidence and corrected detection limits are recorded in the source analysis.
  - statement: CcmB is encoded in the functional G20 cassette; its specific mechanical role is inferred,
      not individually assayed in this reconstruction.
  - statement: Sequential cassette truncations distinguish optional CcmI from required CcmD under the
      reported heterologous conditions; source analysis records the 2011 detection-limit correction.
  - statement: Heme-containing peptide analysis and Cys127 variants support cysteine-linked CcmE; canonical
      and G20 CcmE proteins are not functionally interchangeable.
  - statement: CcmI deletion reduces but does not eliminate mature c550, so this role is optional under
      the tested conditions.
- id: PMID:24044352
  title: Probing heme delivery processes in cytochrome c biogenesis System I.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary evidence interpreted with the source/construct limitations in the individual
      gene reviews and module source analysis.
  findings:
  - statement: CcmA/F/C mutagenesis separates ATP-dependent heme handling from downstream ligation; the
      experimental CcmC residue numbering differs from the current reference sequence by 18 residues.
  - statement: G20 CcmA Walker-A perturbation supports ATP-dependent maturation and differs from canonical
      accumulation of holo-CcmE.
  - statement: Experimental CcmC histidine substitutions disrupt heme loading; donor locus is established
      but exact assayed full-sequence equivalence is not.
  - statement: CcmF conserved-histidine mutations block cytochrome formation while altered holo-CcmE accumulation
      distinguishes loading and ligation roles; P147A retains maturation.
- id: PMID:18786143
  title: Compensatory thio-redox interactions between DsbA, CcdA and CcmG unveil the apocytochrome c holdase
    role of CcmG during cytochrome c maturation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary paper distinguishes altered redox-genetic backgrounds and engineered CcmG
      from ordinary canonical architecture. SB1003-reference transfer and constructs are qualified in
      the helX review.
  findings:
  - statement: In Rhodobacter DsbA-null backgrounds, CcmG/CcdA redox requirements can be bypassed, while
      thiol-inactive CcmG improves maturation and binds apocytochrome in vitro; CcmH remains required
      under those tested conditions.
  - statement: Thiol-independent CcmG substrate handling is a distinct molecular role from protein-disulfide
      reduction; loss of reductase chemistry is not equivalent to removal of the protein.
- id: PMID:24397552
  title: 'The CcmFH complex is the system I holocytochrome c synthetase: engineering cytochrome c maturation
    independent of CcmABCDE.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary functional-reconstruction evidence; distinguish collective CcmFGH-only
      activity in engineered cells from purified F alone or a native upstream-independent route.
  findings:
  - statement: Engineered E. coli CcmFGH-only expression produces covalently attached, correctly processed
      holocytochromes without CcmABCDE, supporting terminal synthase chemistry in the CcmFH apparatus.
