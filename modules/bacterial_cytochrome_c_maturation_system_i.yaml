        trafficking rather than a mapped small-molecule reaction chain.
    - source: ccmgh_redox_preparation
      target: ccmfh_heme_ligation
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        The redox branch supplies ligation-competent CXXCH cysteines to the
        CcmF/CcmH complex.
notes: >-
  This module represents the canonical bacterial system I boundary. CcmAB is
  modeled as an ATP-dependent energy-coupling subcomplex, not as a literal heme
  exporter. CcmCDE performs heme transfer and holo-CcmE formation, while CcmG
  and CcmH provide the thiol-redox dependency that converges with holo-CcmE at
  the CcmF/CcmH ligation complex. CcmH therefore appears in both the redox and
  ligation roles. CcmI/CycH-family accessories are lineage dependent. General
  Sec export, DsbD electron supply, and heme biosynthesis remain outside the
  module.
