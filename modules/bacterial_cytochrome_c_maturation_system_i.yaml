- id: PMID:24631867
  title: 'Cytochrome c biogenesis System I: an intricate process catalyzed by a maturase supercomplex?'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review with full text, emphasizing Rhodobacter interactions. Its maturase
      supercomplex and temporal sequence are hypotheses, not a universally established obligatory complex.
  findings:
  - statement: Ccm components occur in distinct gene arrangements and CcmI is separate in Rhodobacter
      but fused to CcmH in E. coli.
  - statement: The proposed supercomplex and chronological thioredox sequence are explicitly conditional.
  - statement: Comparative Rhodobacter-centered synthesis supports interacting heme-delivery and apocytochrome-handling
      branches; a single obligatory maturase supercomplex remains a hypothesis.
- id: PMID:40026579
  title: Complexation of CcmB with CcmACD safeguards heme translocation for cytochrome c maturation.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full primary study: CcmB overproduction, heme loss/sensitivity, complementation, modeling
      and mutagenesis support its proposed translocase role. Main experimental model is Shewanella; exact
      donor identity for other homologs and physiologically assembled complexes needs separate checking.
      Its conduit assignment is disputed by PMID40167305.'
  findings:
  - statement: The authors assign CcmB a heme-translocase role and complexation with CcmACD a routing
      role toward maturation.
  - statement: Excess free CcmB can drain cellular heme; this phenotype does not by itself settle which
      subunit conducts native maturation-associated transmembrane flux.
  - statement: Shewanella MR1 deletion/complementation and overproduction assays support the proposed
      CcmB heme-translocation role, with conditional excess-free-CcmB phenotypes.
- id: PMID:40167305
  title: Biochemical mapping reveals a conserved heme transport mechanism via CcmCD in System I bacterial
    cytochrome c biogenesis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary study maps engineered cysteine/heme crosslinks in CcmCD and explicitly
      disputes CcmB-channel proposals. Contact mapping plus holoCcmE formation without CcmAB supports
      its model; distinguish this from a purified vectorial-flux measurement or proof that all taxa use
      an identical conduit.
  findings:
  - statement: Mapped heme contacts span cytoplasmic acceptance and a proposed CcmC membrane channel leading
      to the WWD domain.
  - statement: The study distinguishes proposed energy-independent transport from CcmAB ATP-dependent
      holoCcmE release.
  - statement: Engineered cysteine/heme contacts support the authors' proposed CcmCD acceptance/channel
      model; contact mapping is not an isolated vectorial-flux measurement.
  - statement: Engineered CcmD cysteine contacts support heme contact in the assembly, distinct from an
      earlier negative wild-type binding assay.
  - statement: The alternative CcmCD contact-mapping model explicitly disputes CcmB as the native conduit;
      retain this disagreement rather than selecting by publication date.
