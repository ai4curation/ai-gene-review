                        label: HEME EXPORTER PROTEIN D
                      representative_members:
                        - preferred_term: CcmD (Pseudomonas putida KT2440)
                          term:
                            id: UniProtKB:Q88EX8
                            label: Heme exporter protein D
                  role_description: >-
                    Stabilizes membrane-associated CcmE and supports
                    accumulation of holo-CcmE.
                - id: ccme_heme_chaperone
                  label: CcmE heme chaperone
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: CcmE heme-chaperone family
                      term:
                        id: InterPro:IPR004329
                        label: CcmE
                      representative_members:
                        - preferred_term: CcmE (Pseudomonas putida KT2440)
