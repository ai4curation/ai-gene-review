notes: 'The bacterial taxon is a scope boundary, not a universality assertion. Complete reviewed exemplar
  panels cover E. coli K-12, P. putida KT2440 and the G20 System I* cassette; RHOCB SB1003-reference proteins
  and SHEON MR1 CcmB provide selected experimentally informative roles, not complete-route panels. Rhodobacter
  assay strains/constructs and the G20 CcmC numbering discrepancy are documented in individual source
  analyses. Family labels alone do not define role: PTHR47870 SF1 contains both redox CcmH and accessory
  CcmI, PTHR30071 includes other heme-handling systems, and PTHR34128 includes both CcmE linkage chemistries.
  No ancestral node is invented for newly added exemplars. Conflicting CcmB and CcmCD conduit models remain
  explicit; structural/contact and conditional overproduction evidence do not settle a universal native
  conduit. System II and mitochondrial System III are separate implementations outside this boundary.
  CcmG redox bypasses in altered backgrounds and thiol-independent handling mean this canonical route
  is not an exhaustive list of all experimental rescue configurations. Engineered CcmFGH-only expression
  can bypass CcmABCDE under special heme/expression conditions (PMID:24397552); the canonical capacity
  route models ordinary upstream delivery, not all synthetic bypasses.'
