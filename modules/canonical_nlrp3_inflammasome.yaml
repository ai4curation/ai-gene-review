id: MODULE:canonical_nlrp3_inflammasome
title: Canonical NLRP3 inflammasome assembly and pyroptotic output
description: >-
  Assembly of the canonical NLRP3 inflammasome and its executioner output. Inactive NLRP3 is a
  membrane-associated ADP-bound cage; NEK7 licenses its conversion into an active ATP-bound disc whose
  pyrin-domain filament nucleates ASC (PYCARD) filaments. ASC CARD filaments recruit caspase-1 and
  activate it by induced proximity; caspase-1 matures pro-IL-1beta and pro-IL-18 and cleaves gasdermin D,
  whose N-terminal fragment forms plasma-membrane pores that release the mature cytokines and drive
  pyroptosis.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: PMID:41062723
    title: >-
      Molecular mechanisms and regulation of inflammasome activation and signaling: sensing of pathogens
      and damage molecular patterns.
    statement: >-
      Review (Cell Mol Immunol 2025) that triggered this module. It states the canonical
      sensor-ASC-caspase-1-GSDMD architecture modelled here; mechanistic claims in the parts below are
      grounded in the primary papers it cites.
    supporting_text: The inflammasome is a cytoplasmic protein complex that contains an inflammasome sensor
      protein, the adaptor protein called apoptosis-associated speck-like protein containing a CARD (known
      as ASC or PYCARD), and the cysteine protease caspase-1
module:
  id: canonical_nlrp3_inflammasome
  label: Canonical NLRP3 inflammasome
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: inflammasome-mediated signaling pathway
      term:
        id: GO:0141084
        label: inflammasome-mediated signaling pathway
      description: The module is the NLRP3 instance of this pathway, from licensed sensor to gasdermin D
        pore.
    - preferred_term: NLRP3 inflammasome complex
      term:
        id: GO:0072559
        label: NLRP3 inflammasome complex
      description: The NLRP3-PYCARD-caspase-1 complex assembled by parts 1-3. NEK7 is a licensing factor
        seen in the active disc but is not part of the GO complex definition.
  context:
    taxa:
      - preferred_term: mammals
        term:
          id: NCBITaxon:40674
          label: Mammalia
  parts:
    - order: 1
      role: licensed sensor
      node:
        id: nlrp3_licensed_sensor
        label: NEK7-licensed NLRP3 sensor oligomer
        module_type: REGULATORY_STEP
        description: >-
          Inactive ADP-bound NLRP3 forms membrane-associated cages. Activating stimuli disperse the
          trans-Golgi network; NLRP3 binds phosphatidylinositol 4-phosphate on the dispersed vesicles and
          is assembled at the microtubule organizing center. NEK7, through its C-terminal lobe and
          independently of kinase activity, bridges adjacent NLRP3 subunits and breaks the inactive cage,
          yielding an ATP-bound disc with a central pyrin-domain filament.
        annotons:
          - id: nlrp3_sensor
            label: NLRP3 sensor and ASC-nucleating scaffold
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NLRP3
                term:
                  id: UniProtKB:Q96P20
                  label: NACHT, LRR and PYD domains-containing protein 3
            function:
              preferred_term: signaling adaptor activity
              term:
                id: GO:0035591
                label: signaling adaptor activity
              targets:
                - preferred_term: PYCARD
                  term:
                    id: UniProtKB:Q9ULZ3
                    label: Apoptosis-associated speck-like protein containing a CARD
            processes:
              - preferred_term: NLRP3 inflammasome complex assembly
                term:
                  id: GO:0044546
                  label: NLRP3 inflammasome complex assembly
            locations:
              - preferred_term: trans-Golgi network membrane
                term:
                  id: GO:0032588
                  label: trans-Golgi network membrane
              - preferred_term: microtubule organizing center
                term:
                  id: GO:0005815
                  label: microtubule organizing center
            role_description: >-
              Sensor whose oligomerised pyrin domains nucleate ASC filaments. GO has no term for the
              sensing activity itself; the NLRP3 gene review proposes "inflammasome sensor activity", and
              both that review and GO-CAM 635b1e3e00001811 use signaling adaptor activity for the
              ASC-nucleating role modelled here.
            evidence:
              - source_id: PMID:30487600
                statement: Diverse stimuli disperse the TGN; NLRP3 binds PtdIns4P on the dispersed TGN, which
                  scaffolds NLRP3 aggregation and ASC polymerization.
                supporting_text: NLRP3 is recruited to the dispersed TGN (dTGN) through ionic bonding between
                  its conserved polybasic region and negatively charged phosphatidylinositol-4-phosphate (PtdIns4P)
                  on the dTGN.
              - source_id: PMID:34861190
                statement: Endogenous inactive mouse NLRP3 is a membrane-localized double-ring cage that shields
                  the pyrin domains.
                supporting_text: an endogenous, stimulus-responsive form of full-length mouse NLRP3 is a 12-
                  to 16-mer double-ring cage held together by LRR-LRR interactions with the pyrin domains shielded
                  within the assembly to avoid premature activation
              - source_id: PMID:35114687
                statement: Inactive human NLRP3 is an ADP-bound decamer.
                supporting_text: Inactive, ADP-bound NLRP3 is a decamer composed of homodimers of intertwined
                  leucine-rich repeat (LRR) domains that assemble back-to-back as pentamers.
              - source_id: PMID:36442502
                statement: In the active disc the NLRP3 pyrin domains form a filament that recruits ASC.
                supporting_text: The N-terminal PYDs from all NLRP3 subunits combine to form a PYD filament
                  that recruits ASC PYD to elicit downstream signalling.
              - source_id: PMID:32943500
                statement: NLRP3 inflammasome assembly and caspase activation occur at the MTOC.
                supporting_text: inflammasome assembly, caspase activation, and IL-1β conversion occur at the
                  microtubule-organizing center (MTOC)
            gocam_associations:
              - model: gomodel:635b1e3e00001811
                activity: gomodel:635b1e3e00001811/635b1e3e00001821
                title: The NLRP3 inflammasome (Human)
                notes: Same MF (GO:0035591) and MTOC location. The model additionally types NLRP3 with
                  molecular sensor activity, PtdIns4P binding and cysteine-type endopeptidase activator
                  activity; this module keeps the adaptor/scaffold role on this annoton.
          - id: nek7_licensing
            label: NEK7 licensing of NLRP3
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NEK7
                term:
                  id: UniProtKB:Q8TDX7
                  label: Serine/threonine-protein kinase Nek7
            function:
              preferred_term: molecular function activator activity
              term:
                id: GO:0140677
                label: molecular function activator activity
              targets:
                - preferred_term: NLRP3
                  term:
                    id: UniProtKB:Q96P20
                    label: NACHT, LRR and PYD domains-containing protein 3
            processes:
              - preferred_term: positive regulation of NLRP3 inflammasome complex assembly
                term:
                  id: GO:1900227
                  label: positive regulation of NLRP3 inflammasome complex assembly
            locations:
              - preferred_term: microtubule organizing center
                term:
                  id: GO:0005815
                  label: microtubule organizing center
            role_description: >-
              Kinase-independent licensing factor: NEK7 binds the NLRP3 LRR, bridges adjacent NLRP3
              subunits, and is proposed to break the inactive cage so the active disc can form. The
              modelled function is activation of NLRP3, not NEK7 kinase activity, which is dispensable.
            evidence:
              - source_id: PMID:26814970
                statement: NEK7 acts downstream of potassium efflux to regulate NLRP3 oligomerization, and its
                  catalytic activity is dispensable.
                supporting_text: NLRP3 associated with the catalytic domain of NEK7, but the catalytic activity
                  of NEK7 was shown to be dispensable for activation of the NLRP3 inflammasome.
              - source_id: PMID:26642356
                statement: NEK7 binds the NLRP3 LRR domain kinase-independently and is required for the
                  NLRP3-ASC complex, ASC oligomerization and caspase-1 activation.
                supporting_text: Activation of the NLRP3 inflammasome required NEK7, which bound to the
                  leucine-rich repeat domain of NLRP3 in a kinase-independent manner downstream of the induction
                  of mitochondrial reactive oxygen species (ROS).
              - source_id: PMID:31189953
                statement: NEK7 bridges adjacent NLRP3 subunits with bipartite interactions to mediate activation.
                supporting_text: These data suggest that NEK7 bridges adjacent NLRP3 subunits with bipartite
                  interactions to mediate the activation of the NLRP3 inflammasome.
              - source_id: PMID:36442502
                statement: NEK7 is proposed to break the inactive NLRP3 cage to allow the active disc to form.
                supporting_text: we propose that the role of NEK7 is to break the inactive cage to transform
                  NLRP3 into the active NLRP3 inflammasome disc
            gocam_associations:
              - model: gomodel:635b1e3e00001811
                activity: gomodel:635b1e3e00001811/635b1e3e00001959
                title: The NLRP3 inflammasome (Human)
                notes: Identical typing (GO:0140677, GO:1900227, MTOC).
    - order: 2
      role: adaptor filament
      node:
        id: asc_adaptor_filament
        label: ASC (PYCARD) filament assembly
        module_type: REGULATORY_STEP
        description: >-
          The NLRP3 pyrin-domain filament nucleates polymerization of ASC pyrin domains into long helical
          filaments. This clusters the ASC CARDs, which in turn nucleate caspase-1 CARD filaments. ASC is
          the bipartite adaptor that converts sensor oligomerization into protease activation, and the
          resulting macromolecular assembly is the ASC speck.
        annotons:
          - id: pycard_adaptor
            label: ASC bipartite adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PYCARD
                term:
                  id: UniProtKB:Q9ULZ3
                  label: Apoptosis-associated speck-like protein containing a CARD
            function:
              preferred_term: signaling adaptor activity
              term:
                id: GO:0035591
                label: signaling adaptor activity
              targets:
                - preferred_term: CASP1
                  term:
                    id: UniProtKB:P29466
                    label: Caspase-1
            processes:
              - preferred_term: NLRP3 inflammasome complex assembly
                term:
                  id: GO:0044546
                  label: NLRP3 inflammasome complex assembly
              - preferred_term: protein homooligomerization
                term:
                  id: GO:0051260
                  label: protein homooligomerization
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Adaptor that bridges the sensor and the protease: its PYD polymerizes on the NLRP3 PYD
              filament and its clustered CARDs nucleate caspase-1 CARD filaments. GOA supports both the
              assembly role (GO:0044546 IDA) and homooligomerization (GO:0051260 IDA).
            evidence:
              - source_id: PMID:24630722
                statement: Activated NLRP3 nucleates ASC PYD filaments, which cluster the ASC CARD and in turn
                  nucleate caspase-1 CARD filaments, activating it by induced proximity.
                supporting_text: Activated AIM2 and NLRP3 nucleate PYD filaments of ASC, which, in turn, cluster
                  the CARD of ASC. ASC thus nucleates CARD filaments of caspase-1, leading to proximity-induced
                  activation.
              - source_id: PMID:24630722
                statement: ASC bridges sensor and caspase-1 via PYD-PYD and CARD-CARD interactions.
                supporting_text: The adaptor protein ASC bridges the sensor proteins and caspase-1 to form ternary
                  inflammasome complexes, achieved through pyrin domain (PYD) interactions between sensors and
                  ASC and through caspase activation and recruitment domain (CARD) interactions between ASC and
                  caspase-1.
              - source_id: PMID:41062723
                statement: Recruited ASC forms a helical filament to which caspase-1 binds via the ASC CARD.
                supporting_text: Recruited ASC proteins form a long helical filament where caspase-1 binds to
                  the ASC CARD as the presumed last step of inflammasome formation
    - order: 3
      role: effector protease
      node:
        id: caspase1_effector
        label: Caspase-1 activation and substrate cleavage
        module_type: REACTION
        description: >-
          Caspase-1 recruited to the ASC CARD filament is activated by induced proximity and autoprocessing.
          Active caspase-1 cleaves the inactive precursors of IL-1beta and IL-18 to their mature forms and
          cleaves gasdermin D in the linker between its N- and C-terminal domains.
        annotons:
          - id: casp1_protease
            label: Caspase-1 inflammatory protease
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CASP1
                term:
                  id: UniProtKB:P29466
                  label: Caspase-1
            function:
              preferred_term: cysteine-type endopeptidase activity
              term:
                id: GO:0004197
                label: cysteine-type endopeptidase activity
              substrates:
                - preferred_term: pro-IL-1beta
                  term:
                    id: UniProtKB:P01584
                    label: Interleukin-1 beta
                - preferred_term: pro-IL-18
                  term:
                    id: UniProtKB:Q14116
                    label: Interleukin-18
                - preferred_term: gasdermin D
                  term:
                    id: UniProtKB:P57764
                    label: Gasdermin-D
            processes:
              - preferred_term: protein maturation
                term:
                  id: GO:0051604
                  label: protein maturation
              - preferred_term: positive regulation of inflammatory response
                term:
                  id: GO:0050729
                  label: positive regulation of inflammatory response
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The single catalytic output of the canonical complex: cytokine maturation plus gasdermin D
              cleavage. Both branches are required for the module's output, since IL-1beta release depends
              on the GSDMD pore.
            evidence:
              - source_id: PMID:41062723
                statement: Caspase-1 cleaves pro-IL-1beta and pro-IL-18 to their bioactive forms and also
                  cleaves gasdermin D.
                supporting_text: Among these substrates are pro-interleukin-1β (IL-1β) and pro-IL-18, which,
                  via caspase-1-dependent cleavage, are converted to their biologically active forms [4, 5].
                  Caspase-1 also cleaves the pore-forming protein gasdermin D (GSDMD)
              - source_id: PMID:26375003
                statement: Caspase-1 and caspase-4/5/11 cleave the linker between the gasdermin-N and
                  gasdermin-C domains of GSDMD, which is required and sufficient for pyroptosis.
                supporting_text: Caspase-1 and caspase-4/5/11 specifically cleaved the linker between the
                  amino-terminal gasdermin-N and carboxy-terminal gasdermin-C domains in GSDMD, which was
                  required and sufficient for pyroptosis.
            gocam_associations:
              - model: gomodel:635b1e3e00001811
                activity: gomodel:635b1e3e00001811/635b1e3e00001870
                title: The NLRP3 inflammasome (Human)
                notes: Same MF/BP/CC typing (GO:0004197, GO:0051604, cytosol). The model splits caspase-1
                  into several activities, one per substrate; this module keeps one annoton with the
                  substrates listed.
    - order: 4
      role: pore-forming executioner
      node:
        id: gsdmd_pore_executioner
        label: Gasdermin D pore formation
        module_type: REGULATORY_STEP
        description: >-
          Cleavage releases the gasdermin D N-terminal fragment from C-terminal autoinhibition. GSDMD-NT
          binds inner-leaflet phosphoinositides and phosphatidylserine, oligomerizes and forms large
          transmembrane pores. The pore conduit is negatively charged and preferentially passes the mature
          cytokines over their acidic precursors; pore accumulation drives osmotic swelling and pyroptosis.
        annotons:
          - id: gsdmd_nt_pore
            label: GSDMD N-terminal fragment pore
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GSDMD N-terminal fragment
                term:
                  id: UniProtKB:P57764-PRO_0000437526
                  label: Gasdermin-D, N-terminal
            function:
              preferred_term: wide pore channel activity
              term:
                id: GO:0022829
                label: wide pore channel activity
              cargo:
                - preferred_term: mature IL-1beta
                  term:
                    id: UniProtKB:P01584
                    label: Interleukin-1 beta
                - preferred_term: mature IL-18
                  term:
                    id: UniProtKB:Q14116
                    label: Interleukin-18
            processes:
              - preferred_term: pyroptotic inflammatory response
                term:
                  id: GO:0070269
                  label: pyroptotic inflammatory response
              - preferred_term: pyroptotic cell death
                term:
                  id: GO:0141201
                  label: pyroptotic cell death
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Terminal executioner. Matches the GSDMD gene review, which uses wide pore channel activity
              with pyroptotic inflammatory response and pyroptotic cell death at the plasma membrane, and
              the GO-CAM, which models the processed GSDMD-NT chain rather than the precursor.
            evidence:
              - source_id: PMID:27383986
                statement: GSDMD-NT oligomerizes in membranes to form pores and binds inner-leaflet
                  phosphoinositides and phosphatidylserine.
                supporting_text: Here we show that GSDMD-NT oligomerizes in membranes to form pores that are
                  visible by electron microscopy. GSDMD-NT binds to phosphatidylinositol phosphates and
                  phosphatidylserine (restricted to the cell membrane inner leaflet)
              - source_id: PMID:33883744
                statement: The GSDMD pore conduit is predominantly negatively charged and favours passage of
                  mature IL-1beta and IL-18 over their precursors.
                supporting_text: The GSDMD pore conduit is predominantly negatively charged.
              - source_id: PMID:33883744
                statement: Electrostatic filtering by the pore selects mature cytokines over precursors.
                supporting_text: the pores favour the passage of IL-1β and IL-18 over that of their precursors
              - source_id: PMID:41062723
                statement: GSDMD pores release the bioactive cytokines and cause the osmotic lysis called
                  pyroptosis.
                supporting_text: The build-up of GSDMD pores on the plasma membrane creates osmosis and the
                  influx of water into the cell, causing the typical ballooning morphology and eventual lysis
                  of the cell, called pyroptosis
            gocam_associations:
              - model: gomodel:635b1e3e00001811
                activity: gomodel:635b1e3e00001811/635b1e3e00001926
                title: The NLRP3 inflammasome (Human)
                notes: The model types this activity as GO:0022829 with protein secretion; this module uses
                  the pyroptosis process terms, matching the GSDMD gene review, and records the cytokines as
                  cargo instead.
  connections:
    - source: nlrp3_licensed_sensor
      target: asc_adaptor_filament
      connection_type: CAUSES
      description: The NLRP3 pyrin-domain filament nucleates ASC pyrin-domain polymerization.
    - source: asc_adaptor_filament
      target: caspase1_effector
      connection_type: CAUSES
      description: Clustered ASC CARDs nucleate caspase-1 CARD filaments, activating the protease by induced
        proximity.
    - source: caspase1_effector
      target: gsdmd_pore_executioner
      connection_type: PROVIDES_INPUT_FOR
      description: Caspase-1 cleaves gasdermin D, releasing the pore-forming N-terminal fragment.
    - source: gsdmd_pore_executioner
      target: nlrp3_licensed_sensor
      connection_type: POSITIVELY_REGULATES
      description: Potassium efflux through GSDMD pores feeds back on the sensor. This is also the step at
        which the non-canonical caspase-4/5/11 route engages the canonical NLRP3 inflammasome, since those
        caspases cleave GSDMD directly and the resulting K+ efflux activates NLRP3.
notes: >-
  Scope: the canonical NLRP3 route only, sensor through executioner. Deliberately excluded:

  (1) Priming. Canonical NLRP3 activation is two-step, and the first step is transcriptional licensing by
  TLR/NF-kB signalling plus poising post-translational modifications. That is upstream regulation of this
  module's sensor, not a part of it, and the TLR modules already in modules/ are its natural home.

  (2) The many proximal activation triggers (K+ efflux via P2X7/TWIK2, Ca2+ flux, lysosomal rupture,
  mitochondrial damage, ER stress). These converge on the sensor from outside and would swamp the module
  without adding mechanism to the assembly chain.

  (3) Other inflammasomes. PMID:41062723 reviews NLRP1, NLRP6, NLRP7, NLRP9, NLRP10, NLRP12, NAIP-NLRC4,
  AIM2, Pyrin, IFI16, CARD8 and MxA, plus the non-canonical caspase-4/5/11 route. Several share parts 2-4
  of this module verbatim (ASC filament, caspase-1, GSDMD) and differ only in the sensor, so they are
  better modelled later as sensor variants over a shared effector core than duplicated here. Two have
  mechanisms that do not fit this module's shape at all and should not be forced into it: NLRP1 and CARD8
  are activated by *functional degradation* - after FIIND autoproteolysis the N-terminal fragment is
  degraded, releasing a UPA-CARD that oligomerizes - and NAIP-NLRC4 places ligand recognition on NAIP
  rather than on the NLR that builds the platform, with caspase-1 recruited with or without ASC. The
  non-canonical route is a separate sensing module whose only link to this one is the K+ efflux feedback
  recorded in connections; CASP4's own gene review already models it with GO:0160074/GO:0160075.

  Representation choices: NEK7 is modelled as a licensing annoton inside part 1 rather than as its own
  part, because it does not act in sequence - it converts the sensor between conformational states. The
  NLRP3 sensing activity itself has no GO term; the NLRP3 gene review proposes "inflammasome sensor
  activity" and this module therefore carries only the adaptor/scaffold role for NLRP3. GSDMD is grounded
  on the processed chain UniProtKB:P57764-PRO_0000437526, following the GO-CAM and the GSDMD gene review,
  since the pore is formed by the cleavage product and not the autoinhibited precursor.
