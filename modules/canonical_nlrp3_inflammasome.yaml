              - model: gomodel:635b1e3e00001811
                activity: gomodel:635b1e3e00001811/635b1e3e00001894
                title: The NLRP3 inflammasome (Human)
                notes: >-
                  The pro-IL-18 cleavage node, the second dead end, with the same
                  typing and the same missing edge to the pore. Its occurs_in cytosol
                  is cited to PMID:20197547, a sphingosine-kinase cleavage paper
                  unrelated to IL-18; the location is right but the reference is not
                  the support for it, so this annoton's cytosol assertion does not
                  rest on it.
            evidence:
              - source_id: PMID:26611636
                title: Gasdermin D is an executor of pyroptosis and required for interleukin-1β secretion.
                statement: >-
                  GSDMD is required for secretion but not for proteolytic maturation
                  of IL-1 beta, which separates this annoton's claim from the pore
                  annoton's.
                supporting_text: >-
                  Gene deletion of GSDMD demonstrated that GSDMD is required for
                  pyroptosis and for the secretion but not proteolytic maturation of
                  IL-1β in both canonical and non-canonical inflammasome responses.
    - order: 6
      role: >-
        gasdermin-D pore formation - the lytic effector step and the conduit for
        mature cytokines
      node:
        id: gsdmd_pore_formation
        label: Gasdermin-D N-terminal fragment pore formation
        module_type: REGULATORY_STEP
        description: >-
          Released from autoinhibition, GSDMD-NT binds inner-leaflet acidic
          phospholipids, oligomerises in the plasma membrane and forms large
          ring-shaped transmembrane pores. The pore does two things at once: it
          conducts the mature interleukin-1-family cytokines out of the cell,
          preferentially over their precursors, and it drives the osmotic
          catastrophe of pyroptosis.
