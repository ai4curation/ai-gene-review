            evidence:
              - source_id: PMID:26375003
                title: Cleavage of GSDMD by inflammatory caspases determines pyroptotic cell death.
                statement: >-
                  Linker cleavage releases the autoinhibition of the gasdermin-N
                  domain, which has intrinsic pyroptosis-inducing activity.
                supporting_text: >-
                  The cleavage released the intramolecular inhibition on the
                  gasdermin-N domain that showed intrinsic pyroptosis-inducing
                  activity.
              - source_id: PMID:32553275
                title: >-
                  Caspase-1 Engages Full-Length Gasdermin D through Two Distinct
                  Interfaces That Mediate Caspase Recruitment and Substrate Cleavage.
                statement: >-
                  Substrate engagement uses a second interface beyond the active
                  site, so recognition of GSDMD is a specific property of this
                  protease rather than generic YVAD cleavage.
                supporting_text: >-
                  This "exosite" interface endows an additional function for the
                  GSDMD C-terminal domain as a caspase-recruitment module
              - source_id: PANTHER:PTN008720308
                statement: >-
                  IBD propagation of F:GO:0004197 cysteine-type endopeptidase activity
                  at PAINT node PTN008720308 in PTHR47901, seeded by UniProtKB:P29466
                  and MGI:MGI:96544.
          - id: casp1_cytokine_precursor_cleavage
            label: Caspase-1 maturation of pro-IL-1 beta and pro-IL-18
            participant:
              selector_type: FAMILY
              family:
                preferred_term: caspase-1 ortholog group
                term:
                  id: PANTHER:PTHR47901:SF3
                  label: CASPASE-1
                representative_members:
                - preferred_term: CASP1 (human)
                  term:
                    id: UniProtKB:P29466
                    label: Caspase-1
                - preferred_term: Casp1 (mouse)
                  term:
                    id: UniProtKB:P29452
                    label: Caspase-1
                description: >-
                  The caspase-1 subfamily. The inflammatory caspases CASP4/CASP5 (human)
                  and Casp11 (mouse) cleave gasdermin D as well, but they do so from the
                  non-canonical LPS-sensing route without NLRP3 or ASC, so they are not
                  modelled here as alternative realizers of this step.
            function:
              preferred_term: cysteine-type endopeptidase activity
              term:
                id: GO:0004197
                label: cysteine-type endopeptidase activity
              substrates:
                - preferred_term: pro-interleukin-1 beta (cleaved at Asp116-Ala117)
                - preferred_term: pro-interleukin-18 (cleaved at Asp36-Tyr37)
              products:
                - preferred_term: mature interleukin-1 beta
                - preferred_term: mature interleukin-18
            processes:
              - preferred_term: cytokine precursor processing
                term:
                  id: GO:0140447
                  label: cytokine precursor processing
              - preferred_term: positive regulation of interleukin-1 beta production
                term:
                  id: GO:0032731
                  label: positive regulation of interleukin-1 beta production
              - preferred_term: positive regulation of interleukin-18 production
                term:
                  id: GO:0032741
                  label: positive regulation of interleukin-18 production
            locations:
