            gocam_associations:
              - model: gomodel:635b1e3e00001811
                activity: gomodel:635b1e3e00001811/635b1e3e00001881
                title: The NLRP3 inflammasome (Human)
                notes: >-
                  The pro-IL-1 beta cleavage node (GO:0004197, has_input pro-IL-1
                  beta, enabled_by reference PMID:1574116). It is a dead end in the
                  model: no edge connects the mature cytokine it produces to the
                  GSDMD pore (1926) that releases it, or to the IL1B cytokine node
