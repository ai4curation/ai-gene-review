id: MODULE:canonical_nlrp3_inflammasome
title: Canonical NLRP3 inflammasome assembly and pyroptotic output
description: >-
  A decomposition of the canonical NLRP3 inflammasome: the cytosolic
  sensor-adaptor-protease platform that converts a diffuse cellular perturbation
  into active caspase-1, and the lytic execution arm that caspase-1 then
  triggers. The chain is linear and each hand-off is a change of molecular
  currency rather than of chemistry: NLRP3 senses a perturbation indirectly and
  presents a pyrin-domain filament (GO:0044546), that filament nucleates ASC
  polymerisation into the one-per-cell speck (GO:0061703), the clustered ASC CARDs
  recruit procaspase-1 and permit proximity-induced autoprocessing (GO:0061702),
  the autoprocessed protease cleaves gasdermin D and the interleukin-1-family
  precursors, the released GSDMD N-terminal fragment oligomerises into wide
  plasma-membrane pores (GO:0141201), and NINJ1 finally ruptures the membrane.
  Only one of the seven steps is catalytic - caspase-1 substrate cleavage. NLRP3,
  ASC and NEK7 supply geometry, and the two terminal effectors (GSDMD and NINJ1)
  act on the membrane rather than running chemistry, so the module is best read as
  a geometry cascade with a single proteolytic step in the middle and two
  independent membrane-acting effectors at the end.

  Design intent: one ordered chain of parts, like necroptosis and unlike the
  redundant-suppressor topology of ferroptosis, because there is no second route
  from the speck to the pore. The two places where the biology is genuinely
  alternative are handled differently from each other. NEK7 licensing is an
  optional regulatory part rather than a core step, because human myeloid cells
  can activate NLRP3 without it when IKKbeta has recruited NLRP3 to PI4P
  (PMID:36384135) and because raising NLRP3 abundance makes potassium-efflux-driven
  activation independent of both NEK7 and priming (PMID:42378282). Interleukin-1
  beta and interleukin-18 are recorded as caspase-1 substrates inside the
  cleavage step and are deliberately given no annoton of their own: they are what
  the protease acts on, they perform none of the work of their own maturation, and
  their cytokine activity belongs to the receptor pathways downstream of this
  module.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: PMID:41062723
    title: >-
      Molecular mechanisms and regulation of inflammasome activation and signaling: sensing of pathogens
      and damage molecular patterns.
    statement: >-
      Review (Cell Mol Immunol 2025) that prompted the first, four-part version
      of this module. It states the canonical sensor-ASC-caspase-1-GSDMD
      architecture modelled here; mechanistic claims in the parts below are
      grounded in the primary papers it cites.
    supporting_text: The inflammasome is a cytoplasmic protein complex that contains an inflammasome sensor
      protein, the adaptor protein called apoptosis-associated speck-like protein containing a CARD (known
      as ASC or PYCARD), and the cysteine protease caspase-1
  - source_id: GO:0141084
    title: inflammasome-mediated signaling pathway
    statement: >-
      GO defines this pathway as starting with a pattern-recognition receptor,
      proceeding through assembly of the inflammasome complex to CASP1 activation
      and an inflammatory response, and sometimes continuing into pyroptosis. That
      definition is the signalling half of this module's boundary.
  - source_id: GO:0141201
    title: pyroptotic cell death
    statement: >-
      GO defines pyroptotic cell death as an inflammatory cell death process
      resulting from the activation of gasdermins, and places it under the broader
      gasdermin-dependent GO:0070269 pyroptotic inflammatory response. Because
      GO:0141201 is_a GO:0070269, the module grounds its execution arm with
      GO:0141201 alone; the inflammatory cytokine output is carried separately
      by IL-1 family production terms.
  - source_id: GO:0072559
    title: NLRP3 inflammasome complex
    statement: >-
      GO defines the NLRP3 inflammasome complex as consisting of NLRP3, PYCARD and
      caspase-1, which is exactly the three-part core this module builds; NEK7 is
      not in that definition, consistent with it being modelled here as licensing
      context. The NEK7 review nonetheless proposes NEK7 as part of GO:0072559,
      because structures show NEK7 bound to NLRP3 in the active disc; the two
      positions are compatible (NEK7 can sit in the assembled complex while its
      requirement for assembly is conditional), and the review raises the
      definition-widening question rather than asserting it silently.
  - source_id: gomodel:635b1e3e00001811
    title: The NLRP3 inflammasome (Human)
    statement: >-
      Cached production GO-CAM covering the whole human chain - NLRP3 sensing and
      PI4P binding, NEK7 activation, caspase-1 proteolysis, GSDMD pore formation
      and the released cytokines - and used as the GO-CAM anchor for most annotons
      here. Note that PYCARD appears in that model only as a molecule, not as an
      activity, so the adaptor step of this module has no counterpart activity to
      pin.
  - source_id: gomodel:663d668500001246
    title: Pyroptotic cell death mediated by GSDMD and NINJ1 (Human).
    statement: >-
      Cached production GO-CAM grounding the execution arm specifically, with
      GSDMD-NT lipid binding and pore formation followed by NINJ1 membrane
      destabilizing activity in GO:0141201, which is the two-effector arrangement
      modelled in the last two parts.
  - source_id: file:genes/human/NLRP3/NLRP3-ai-review.yaml
    title: Human NLRP3 AI gene review
    statement: >-
      The reviewed NLRP3 core functions - signaling adaptor activity, cysteine-type
      endopeptidase activator activity, PI4P binding, ATP hydrolysis and molecular
      condensate scaffold activity - are the source of the sensor-activation
      annotons. That review asserts no direct agonist-binding activity for NLRP3,
      and this module does not assert one.
  - source_id: file:genes/human/PYCARD/PYCARD-ai-review.yaml
    title: Human PYCARD AI gene review
    statement: >-
      The reviewed ASC core functions separate the bipartite adaptor role
      (GO:0035591), the activator role it thereby enables (GO:0140608) and the
      homotypic self-association that builds the speck (GO:0042802); this module
      keeps the adaptor and self-association assertions and treats the activator
      role as the connection to the caspase step rather than duplicating it.
  - source_id: file:genes/human/CASP1/CASP1-ai-review.yaml
    title: Human CASP1 AI gene review
    statement: >-
      The reviewed caspase-1 core functions distinguish CARD domain binding with
      autoprocessing from the endopeptidase activity itself, and record the three
      substrate classes (gasdermin D, pro-IL-1 beta, pro-IL-18) separately; this
      module follows that split into an activation part and a cleavage part.
  - source_id: file:genes/human/NEK7/NEK7-ai-review.yaml
    title: Human NEK7 AI gene review
    statement: >-
      The reviewed NEK7 inflammasome role is explicitly kinase-independent
      (GO:0140677 molecular function activator activity, not its mitotic
      GO:0004674 kinase activity), and the review records the human
      NEK7-independent IKKbeta route as the principal counterweight to NEK7 being
      obligatory. Both decisions are carried over here.
  - source_id: file:genes/human/GSDMD/GSDMD-ai-review.yaml
    title: Human GSDMD AI gene review
    statement: >-
      The reviewed GSDMD core functions are wide pore channel activity
      (GO:0022829) for the cleaved N-terminal fragment and acidic-phospholipid
      binding that targets it to the inner leaflet; the antibacterial effector
      role in that review is a consequence of the same activities and is outside
      this module's boundary.
  - source_id: file:genes/human/NINJ1/NINJ1-ai-review.yaml
    title: Human NINJ1 AI gene review
    statement: >-
      The reviewed NINJ1 core activity is GO:0140912 membrane destabilizing
      activity, and the review stresses that NINJ1 performs the same act
      downstream of gasdermins, MLKL, apoptosis and ferroptosis alike. This module
      therefore includes NINJ1 as the terminal step while recording that the step
      is shared with necroptosis rather than specific to pyroptosis - the same term
      is used for MLKL in modules/necroptosis.yaml, and the two descriptions are
      deliberately phrased alike.
  - source_id: PMID:30487600
    title: PtdIns4P on dispersed trans-Golgi network mediates NLRP3 inflammasome activation.
    statement: >-
      Established the one well-defined direct binding event in NLRP3 activation -
      a polybasic region binding PI4P on the dispersed trans-Golgi network - and
      that the dispersed network then scaffolds NLRP3 aggregation and ASC
      polymerisation. This is why the module's first part is a membrane-recruitment
      and platform-formation step rather than a ligand-binding step.
    supporting_text: >-
      NLRP3 is recruited to the dispersed TGN (dTGN) through ionic bonding between
      its conserved polybasic region and negatively charged
      phosphatidylinositol-4-phosphate (PtdIns4P) on the dTGN.
  - source_id: PMID:24630722
    title: Unified polymerization mechanism for the assembly of ASC-dependent inflammasomes.
    statement: >-
      Established the unified polymerisation mechanism that this module's middle
      three parts encode: sensor PYD nucleates ASC PYD filaments, clustered ASC
      CARDs nucleate caspase-1 CARD filaments, and the caspase is activated by
      proximity rather than by an allosteric ligand.
    supporting_text: >-
      ASC thus nucleates CARD filaments of caspase-1, leading to proximity-induced
      activation.
  - source_id: PMID:26375003
    title: Cleavage of GSDMD by inflammatory caspases determines pyroptotic cell death.
    statement: >-
      Identified GSDMD as the caspase-1 substrate whose interdomain cleavage is
      required and sufficient for pyroptosis, which is the hand-off from the
      proteolytic step to the execution arm in this module.
    supporting_text: >-
      Caspase-1 and caspase-4/5/11 specifically cleaved the linker between the
      amino-terminal gasdermin-N and carboxy-terminal gasdermin-C domains in GSDMD,
      which was required and sufficient for pyroptosis
  - source_id: PMID:33472215
    title: NINJ1 mediates plasma membrane rupture during lytic cell death.
    statement: >-
      Identified NINJ1 as the effector of plasma membrane rupture and showed that
      the requirement is shared across pyroptotic, necrotic and apoptotic death,
      which is the basis for making NINJ1 the terminal part while scoping the claim
      as a shared rather than pyroptosis-specific step.
    supporting_text: >-
      Ninj1-/- macrophages exhibited impaired PMR in response to diverse inducers
      of pyroptotic, necrotic and apoptotic cell death
  - source_id: PANTHER:PTN008720308
    title: PAINT node PTN008720308 for CASP1
    statement: >-
      Local PAINT IBD row in PTHR47901 propagating F:GO:0004197 cysteine-type
      endopeptidase activity, seeded by UniProtKB:P29466 and MGI:MGI:96544; cited as
      provenance that the caspase-1 proteolytic role modelled here is a
      PAINT-placed inherited function rather than a human-only observation.
  - source_id: PANTHER:PTN008720309
    title: PAINT node PTN008720309 for CASP1
    statement: >-
      Local PAINT IBD row in PTHR47901 propagating C:GO:0072559 NLRP3 inflammasome
      complex, seeded by UniProtKB:P29466; cited as provenance for caspase-1
      membership of the complex this module assembles.
notes: >-
  Boundary decisions.

  (1) Scope is the canonical NLRP3 inflammasome and the pyroptotic execution it
  triggers: sensor activation, adaptor polymerisation, caspase-1 autoactivation,
  caspase-1 substrate cleavage, GSDMD pore formation, NINJ1 membrane rupture.
  Signal 1 (priming) is explicitly out of the core. NF-kappaB-driven
  transcriptional upregulation of NLRP3 and IL1B is reached by reference to
  modules/nfkb_canonical_signaling.yaml, and the receptor biology that generates
  that signal belongs to modules/tlr4_md2_lps_signaling.yaml and
  modules/tnf_signaling.yaml. Priming does real mechanistic work - it raises NLRP3
  abundance and, through IKKbeta, moves NLRP3 into a PI4P-bound primed state - so
  it is modelled as context connected to those modules, not as a part here, and
  PMID:42378282 is cited for abundance substituting for it.

  (2) Other inflammasomes and other routes to a gasdermin pore are out of scope by
  the same logic. The non-canonical CASP4/CASP5 route to GSDMD (reviewed in
  genes/human/CASP4) reaches the same execution arm without NLRP3, ASC or
  caspase-1; NLRC4, NLRP1, AIM2, CARD8 and NLRP6 are sibling sensors on the same
  ASC/caspase-1 core; granzyme-driven GSDME cleavage is a third route into
  GO:0141201. None of them is modelled here. Those shared downstream parts
  (caspase-1 autoactivation onwards) are the natural factoring point if this module
  is later generalised to a canonical-inflammasome module with a sensor variant
  set; modules/nlr_signaling.yaml is the existing, much coarser sketch of the
  sensor layer and is not superseded by this module.

  (3) NEK7 is an optional licensing part, not an obligate core step, and this is
  the module's main judgement call. The case for including it is strong: NEK7 acts
  downstream of potassium efflux, is a stoichiometric subunit of the active disc,
  bridges adjacent NLRP3 LRRs, and is required in mouse macrophages in vivo. The
  case against making it obligatory is specific and human: when IKKbeta recruits
  NLRP3 to PI4P, NEK7 is redundant for inflammasome formation, and that
  IKKbeta-mediated route is reported as the predominant priming mechanism in human
  myeloid cells (PMID:36384135); raising NLRP3 abundance likewise renders
  potassium-efflux-driven activation independent of both NEK7 and priming
  (PMID:42378282). A part whose loss can be fully compensated in the organism the
  module is grounded in is regulation, so NEK7 carries optional: true and a
  POSITIVELY_REGULATES edge onto the sensor step rather than sitting in the chain.
  Its activity is asserted as GO:0140677 molecular function activator activity, not
  as a kinase activity: kinase-dead NEK7 rescues inflammasome activation. The
  local PAINT row for NEK7 in PTHR44329 propagates GO:0004674 protein
  serine/threonine kinase activity, which is the mitotic function and not this
  one, so it is deliberately not cited as support for the licensing role.

  (4) IL-1 beta and IL-18 are substrates, not participants. They are named in the
  substrates list of the caspase-1 cleavage annoton and nowhere else: the
  proteolysis is performed entirely by caspase-1, the precursors contribute no
  residue, no positioning and no chemistry to their own cleavage, and being
  required for the output is not the same as doing any of its work. Their cytokine
  activity (GO:0005125 in the IL-1 and IL-18 receptor pathways, as modelled in the
  cached GO-CAM) is downstream biology outside this boundary. The one thing the
  module does assert about them is a property of the pore, not of the cytokines:
  the GSDMD conduit favours the mature forms over their precursors
  (PMID:33883744), which is why cytokine release is placed on the pore annoton.
  Neither gene has a review under genes/human/, which is a further reason not to
  assert activities for them here.

  (5) Two membrane-acting effectors, two different acts. GSDMD-NT forms a defined
  wide pore and is asserted with GO:0022829, following the gene review; NINJ1 is
  asserted with GO:0140912 membrane destabilizing activity, the same term the
  necroptosis module uses for MLKL, and its description is phrased to match - both
  are lytic effectors that destabilise the bilayer rather than forming a gated
  channel. Note that GSDMD pore formation and NINJ1 rupture are not alternatives:
  the pore comes first and is survivable, rupture is terminal.

  (6) No module-level deep research exists for this module. No provider run was
  available when it was curated (the Falcon endpoint was unavailable), so there is
  deliberately no nlrp3_inflammasome-deep-research-<provider>.md file. Every
  structural claim is grounded in the six per-gene reviews under genes/human/,
  cached publications under publications/, local PAINT rows under
  interpro/panther/, and the two cached production GO-CAMs named in evidence. If
  module-level deep research is run later it should be named
  canonical_nlrp3_inflammasome-deep-research-<provider>.md.

  (7) Taxon scope is Mammalia and the roles are filled by ortholog groups, not by
  human gene products. Every annoton's participant is a FAMILY selector naming the
  PANTHER subfamily for its role, with human and mouse representatives; the ids and
  their verbatim official names were checked against interpro/panther/panther.obo
  and against each representative's own UniProt PANTHER cross-reference
  (PTHR45690:SF19 NLRP3, PTHR46985:SF2 ASC, PTHR47901:SF3 caspase-1, PTHR16399:SF15
  gasdermin-D, PTHR12316:SF19 ninjurin-1, PTHR43289:SF2 NEK7). Subfamilies, not the
  parent families, because the parents are much broader - PTHR45690 contains NLRP12
  and other NLRs, PTHR43289 is a wide kinase family - and generalising the sensor
  into sibling NLRs would make this a different module. Representative members are
  examples, not an exhaustive species list.

  Why Mammalia and not Vertebrata: NLRP3 is a vertebrate NLR and ASC, the
  inflammatory caspases and NINJ1 are conserved at least as widely, so the
  architecture is vertebrate-wide, but this chain is not. The cached zebrafish
  GO-CAM gomodel:60418ffa00001019 runs the same sensor-adaptor platform into
  caspase-a/caspase-b and gasdermin Eb, so in teleosts parts 5 and 6 are filled by
  non-orthologous proteins and the PANTHER subfamilies named above have no member
  there; NEK7 licensing is likewise characterised only in mammals. Widening the
  taxon field would assert orthologs that do not exist. The teleost implementation
  belongs in a sibling module, or in a sensor-generalised parent that factors out
  the shared ASC/caspase core, which is the same factoring point identified in (2).

  Role substitution was considered for three steps and rejected at each, so the
  module has no variant_sets and fills every role by orthology. (i) The gasdermin
  step: the other gasdermins form equivalent pores but are released by other
  proteases (GSDME by caspase-3, GSDMB by granzyme A, GSDMA by streptococcal SpeB),
  so they are not alternative realizers of a caspase-1-driven step, and GSDME is the
  effector of a separate route into GO:0141201. (ii) The protease step: CASP4/CASP5
  and mouse Casp11 cleave gasdermin D, but only from the non-canonical LPS-sensing
  route, which is out of scope by (2). (iii) Interleukin-1 beta and interleukin-18
  are the one place where two molecules genuinely alternate, but they alternate as
  substrates of one catalytic annoton, not as carriers of a role: by (4) they
  perform no part of their own cleavage, so they are listed in that annoton's
  substrates and are deliberately given no variant nodes of their own. Promoting
  them to variants would assert activities the module holds they do not have.

  (8) History. This file began as a seven-part CONCRETE decomposition named
  nlrp3_inflammasome, built from the NLRP3, PYCARD, CASP1, NEK7, GSDMD and NINJ1
  gene reviews. A separate four-part ABSTRACT overview, canonical_nlrp3_inflammasome,
  was created in #4960 and grounded on GO-CAM gomodel:635b1e3e00001811. The two
  were folded together under the canonical id and title because they modelled one
  pathway; the concrete seven-part decomposition below is kept (it carries the
  step-level gene functions the overview lacked), and the overview's GO-CAM
  grounding is retained on the matching annotons. The scope decisions in (1)-(7)
  are unchanged by the merge. module_type was widened from SIGNALING_PATHWAY (the
  overview's value) to BIOLOGICAL_PROCESS, since the merged module spans both the
  signalling assembly chain and the lytic execution arm.

  (9) CANDIDATE ASSESSED, NOT MODELLED - VPS4B at the ASC speck (PMID:42714851,
  litscan handoff #3920). A 2026 report identifies the ESCRT AAA-ATPase Vps4B as a
  component of the NLRP3 and AIM2 inflammasomes that interacts endogenously with
  ASC and caspase-1, is recruited to the speck by Ca2+ signalling downstream of
  NLRP3 and ASC polymerisation, and forms a ring encircling the ASC filament that
  disassembles and liberates the used caspase-1 CARD, so that unoccupied ASC CARDs
  are replenished and caspase-1 recruitment continues. Routing first: the handoff
  proposed modules/nlr_signaling.yaml, but that file is the coarse sensor-layer
  sketch and its own notes delegate the NLRP3 branch here, so this module is where
  the question had to be answered. If the candidate were admitted it would attach
  to the casp1_autoactivation part (order 4), which is the step that builds the
  caspase-1 CARD platform this activity would recycle.

  It is deliberately not added, for three reasons. (i) Weight: a single primary
  report, cached abstract-only here, with no independent replication. VPS4B carries
  no inflammasome GO annotation (genes/human/VPS4B/VPS4B-goa.tsv, 94 rows, none
  inflammasome- or pyroptosis-related) and appears in no cached GO-CAM
  (gocams/index.tsv), so nothing outside this one abstract places it at the speck.
  (ii) Participant identity: VPS4B is not known to act alone. UniProt records that
  it interacts with VPS4A and that the interaction suggests a heteromeric assembly,
  and ComplexPortal CPX-338 is the VPS4A/B complex; the abstract does not say
  whether VPS4A is present at the speck or redundant there, so a GENE_PRODUCT
  annoton on VPS4B alone could mis-state the functional unit, and the choice
  between that and a PROTEIN_COMPLEX participant is not determinable from the
  available evidence. (iii) Mechanism and selectivity: the reported geometry is the
  canonical VPS4 mechanism - ATP-dependent oligomerisation into stacked hexameric
  or heptameric rings that translocate a substrate polymer through a central pore,
  as for CHMP2A-CHMP3 helical tubes - which makes the activity plausible rather
  than anomalous. But the report seats the ring on the ASC filament while making
  the caspase-1 CARD polymer the substrate, and how that selectivity is achieved,
  and whether ATP hydrolysis by VPS4B is required for the inflammasome phenotype at
  all, is not established by the abstract. Asserting an ATP-driven disassembly
  activity here would therefore read mechanism into a correlation.

  (10) GO-CAM linkage. gomodel:635b1e3e00001811 is now linked at the module root
  and on every annoton with a counterpart activity, following
  gocams/635b1e3e00001811/635b1e3e00001811-review.yaml; the per-annoton notes say
  where the model and the module differ, and the root note lists the mapping in one
  place. Four of that review's findings are the reason the module is shaped as it
  is, and the module corrects rather than copies them: the mistyped molecular sensor
  entry point (associated with the sensor part, which asserts no sensing activity);
  the self-input "adaptor" node that is really the inactive ADP-bound cage and is
  drawn out of order (associated with the ATPase annoton, where the cage belongs,
  with the real adaptor role kept on the annoton that names ASC as its target);
  caspase-1 activation attributed to NLRP3, which has no CARD, while PYCARD has no
  activity at all (associated with pycard_bipartite_adaptor, which is this module's
  activity for that step, so ASC is a participant with a function and the
  sensor-to-caspase order runs NLRP3 filament -> ASC speck -> caspase-1); and the
  two dead-end CASP1 nodes (associated with the single cytokine-precursor cleavage
  annoton, whose products are released through the pore annoton, so the cleavage is
  not left unconnected to the step that releases what it makes). The review's two
  positive findings are matched as they stand: the downstream CASP1 -> GSDMD -> pore
  -> cytokine half, and NEK7 as a non-catalytic GO:0140677 activator. The model's
  terminal cytokine-activity nodes are outside this boundary by (4), and NINJ1 is
  absent from it, so part 7 is grounded only in gomodel:663d668500001246.

  (11) gocam-lint findings on 635b1e3e00001811 (uv run ai-gene-review gocam-lint
  635b1e3e00001811), and what this module does about each. Resolved: the single
  WARNING, duplicate_activity "CASP1 cysteine-type endopeptidase activity occurs 3
  times with identical context", because the module has one catalytic CASP1 annoton
  per substrate class rather than per substrate molecule, and keeps a second CASP1
  annoton that is a genuinely different function (CARD binding with autoprocessing)
  rather than a third copy of the same one; same_gene_chain "NLRP3 appears as a
  chain of 5 activities", because the module's four NLRP3 annotons are four distinct
  functions with no self-input adaptor among them and no causal chain running
  NLRP3 -> NLRP3 at all, the cage having become the resting pole of the ATPase
  switch; the three edge_evidence_copied findings, because the NLRP3 internal edges
  that copied their upstream enabled_by evidence do not exist here - the one
  remaining edge out of the sensor part carries its own structural evidence
  (PMID:36442502) - and no_narrative, since the description and these notes are the
  narrative the model lacks. Partly addressed: same_gene_chain for GSDMD-NT, reduced
  from three activities to two annotons by merging the model's two lipid-binding
  nodes, which differ only in headgroup, into one acidic-phospholipid binding
  annoton. Not treated as defects: the three binding_mf INFO findings, since each
  binding annoton here states its consequence and its process (PI4P binding
  recruits NLRP3 for assembly; GSDMD-NT lipid binding positions the fragment to
  oligomerise), which is the condition under which a binding MF is informative.

  (12) Scope changed from CONCRETE to ABSTRACT in this edit, with the participants
  converted from human gene products to PANTHER subfamilies with human and mouse
  representatives and the taxon justification rewritten; see (7). No node, annoton
  or part id was renamed or removed, because modules/il1_signaling.yaml includes
  casp1_substrate_cleavage and gsdmd_pore_formation by module_ref and such
  references resolve by id.

  Re-evaluate and add when all three are met: independent replication of the
  ASC/caspase-1 interaction and the speck-renewal phenotype; evidence fixing the
  functional unit (whether VPS4A is required, which decides the selector type); and
  an ATPase-dead separation of function showing the phenotype needs ATP hydrolysis,
  which is what would license GO:0140545 ATP-dependent protein disaggregase
  activity or GO:0051261 protein depolymerization at this step rather than a
  binding term. The admission path is then a regulatory annoton on
  casp1_autoactivation with optional: true and a POSITIVELY_REGULATES edge onto that
  node, by the same reasoning that makes NEK7 optional in (3): a factor that renews
  a platform the module already builds is regulation of throughput, not a step in
  the chain. This candidate is also recorded as a structured, queryable entry in the
  knowledge_gaps block below (status OPEN). The genes/human/VPS4B review is
  unchanged: no NEW annotation is proposed there from one abstract.

knowledge_gaps:
  - gap_statement: >-
      How structurally unrelated agonists activate NLRP3 is undetermined at the
      level of a proximal binding event: no direct agonist-binding activity is
      established, and whether potassium efflux, trans-Golgi dispersal and
      organelle damage converge on one molecular intermediate or on several
      sufficient ones is unresolved.
    boundary: >-
      Firmly established: NLRP3 binds PI4P on the dispersed trans-Golgi network
      through its polybasic region, the NACHT domain switches between an ADP-bound
      autoinhibited oligomer and an ATP-bound active disc, and the active disc
      presents a PYD filament. What is missing is the step between the stimulus and
      those events.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      The module's first part is written as a membrane-recruitment and
      platform-formation step precisely because no sensing activity can be
      asserted. If a proximal sensing event were identified it would add a part
      upstream of everything modelled here, and would decide whether NLRP3 is a
      receptor at all.
    resolution: >-
      Reconstitute candidate proximal intermediates one at a time in an
      agonist-free system - controlled potassium efflux, defined trans-Golgi
      dispersal, defined membrane PI4P - and test which are individually
      sufficient for disc assembly and caspase-1 activation.
    provenance:
      - reference_id: PMID:30487600
        reference_section_type: INTRODUCTION
        supporting_text: >-
          the mechanism by which NLRP3 is activated has remained an enigma
  - gap_statement: >-
      Whether NEK7 licensing or IKKbeta-mediated PI4P recruitment is the operative
      route to an activatable NLRP3 in a given human cell, and what determines the
      choice, is unresolved.
    boundary: >-
      Firmly established: NEK7 acts downstream of potassium efflux, bridges
      adjacent NLRP3 subunits in the active disc, and is required in mouse
      macrophages; and IKKbeta-driven recruitment of NLRP3 to PI4P renders NEK7
      redundant for inflammasome formation in human myeloid cells. What is not
      established is which route operates where, or whether they are two states of
      one mechanism.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      This is the reason NEK7 is an optional regulatory part of this module rather
      than a step in the chain. If the NEK7 route were shown to be obligatory in
      human cells the part would move into the core; if the two routes were shown
      to be independent the step would become a variant set.
    resolution: >-
      In matched human macrophage backgrounds, score inflammasome formation after
      NEK7 deletion with and without IKKbeta inhibition, across NLRP3 expression
      levels, and ask whether the two perturbations are epistatic or additive.
    provenance:
      - reference_id: PMID:36384135
        reference_section_type: ABSTRACT
        supporting_text: >-
          Our understanding of how NLRP3 priming contributes to inflammasome
          activation remains limited.
      - reference_id: PMID:26814970
        reference_section_type: ABSTRACT
        supporting_text: >-
          the molecular mechanism leading to NLRP3 activation in response to
          potassium efflux remains unknown
  - gap_statement: >-
      Whether NINJ1 filaments end the cell by excising membrane disks or by opening
      very large pores is unsettled, so the chemistry of the module's terminal step
      is undetermined.
    boundary: >-
      Firmly established: NINJ1 is required for plasma membrane rupture downstream
      of pyroptotic, necrotic and apoptotic death; it polymerises into amphipathic
      filaments through its extracellular helices; and the resulting event releases
      cytoplasmic DAMPs. The mechanism by which the filament removes membrane is
      what is open.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      The terminal annoton is asserted as GO:0140912 membrane destabilizing
      activity rather than as a pore-forming activity for exactly this reason, and
      the same choice was made for MLKL in modules/necroptosis.yaml. Settling it
      decides whether one shared term covers both effectors or whether a
      membrane-excision activity is a distinct function.
    resolution: >-
      Image and quantify the fate of the bilayer around assembled NINJ1 filaments
      in a reconstituted system, measuring released membrane material against
      solute flux through a persistent aperture.
    provenance:
      - reference_id: PMID:38614101
        reference_section_type: INTRODUCTION
        supporting_text: >-
          the mechanism by which NINJ1 oligomerizes and elicits membrane rupture
          remained unclear
      - reference_id: file:genes/human/NINJ1/NINJ1-ai-review.yaml
        reference_section_type: DATABASE_ENTRY
        supporting_text: >-
          finish by excising membrane disks or by opening very large pores is not
          settled.
  - gap_statement: >-
      Whether the assembled speck renews its caspase-1 CARD platform by a catalysed
      disassembly step, and which entity performs it, is undetermined. A single 2026
      report assigns the activity to the ESCRT AAA-ATPase VPS4B, but the paralog
      composition of the acting ring (VPS4B alone, or the heteromeric VPS4A/B
      assembly), whether ATP hydrolysis is required for the inflammasome phenotype,
      and how a ring seated on the ASC filament selects the caspase-1 CARD polymer
      rather than the filament it encircles as its substrate are all unresolved.
    boundary: >-
      Firmly established within the module: clustered ASC CARDs nucleate a caspase-1
      CARD filament and activate the zymogen by proximity (PMID:24630722), and
      interdomain-linker autoprocessing is required for pyroptosis (PMID:32051255).
      Firmly established about VPS4B, but outside any inflammasome context: it
      oligomerises on ATP binding into two stacked hexameric or heptameric rings
      that translocate ESCRT-III substrate through a central pore, it disassembles
      CHMP2A-CHMP3 helical tubes upon ATP hydrolysis (PMID:18687924, via
      genes/human/VPS4B), and it assembles heteromerically with VPS4A. What is not
      established is that any of this operates at the ASC speck: the sole report is
      cached abstract-only, VPS4B carries no inflammasome GO annotation and appears
      in no cached GO-CAM, and the module's parts currently assume the caspase-1
      platform is built without asserting that it turns over. VPS4B is accordingly
      recorded as an assessed candidate and is NOT added as a part or annoton; see
      note (9).
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      The module models caspase-1 activation as one-way assembly: the platform is
      built, the zymogen autoprocesses, the protease cleaves. A catalysed renewal
      step would make the speck a turnover device with a throughput rather than a
      terminal scaffold, and would be the first ATP-driven disassembly activity in
      the module. It would also decide whether an ESCRT ATPase belongs in
      inflammasome models as a platform-recycling factor, which is a different claim
      from the better-known ESCRT contribution to pyroptosis through plasma membrane
      repair.
    resolution: >-
      In macrophages, score speck-associated caspase-1 turnover and IL-1 beta release
      against VPS4B depletion, VPS4A depletion and double depletion, and rescue each
      with wild-type versus Walker-B ATPase-dead VPS4B; separately, reconstitute ASC
      filaments bearing caspase-1 CARD polymer with purified VPS4B and with the
      VPS4A/B assembly, and ask by cryo-EM and release assay which polymer is
      disassembled and whether ATP hydrolysis is required.
    provenance:
      - reference_id: PMID:42714851
        full_text_unavailable: true
        reference_section_type: ABSTRACT
        supporting_text: >-
          the recruitment of caspase-1 into the ASC speck for activation remains
          unclear
      - reference_id: PMID:42714851
        full_text_unavailable: true
        reference_section_type: ABSTRACT
        supporting_text: >-
          Vps4B forms a ring-like structure encircling the ASC filament and catalyzes
          the disassembly and liberation of the used caspase-1 CARD domain.
      - reference_id: file:genes/human/VPS4B/VPS4B-uniprot.txt
        record_section:
          - CC:SUBUNIT
        supporting_text: >-
          Interacts with VPS4A; the interaction suggests a heteromeric assembly with
          VPS4A.
module:
  id: canonical_nlrp3_inflammasome
  label: Canonical NLRP3 inflammasome
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: inflammasome-mediated signaling pathway
      term:
        id: GO:0141084
        label: inflammasome-mediated signaling pathway
      description: >-
        The signalling half of the module: perturbation sensing, complex assembly
        and CASP1 activation, leading to an inflammatory response.
    - preferred_term: pyroptotic cell death
      term:
        id: GO:0141201
        label: pyroptotic cell death
      description: >-
        The execution half of the module: gasdermin-dependent lytic death, which is
        a subtype of the broader GO:0070269 pyroptotic inflammatory response and is
        not an obligatory outcome of inflammasome signalling.
    - preferred_term: NLRP3 inflammasome complex
      term:
        id: GO:0072559
        label: NLRP3 inflammasome complex
      description: >-
        The NLRP3-PYCARD-caspase-1 complex assembled by parts 1, 3 and 4. NEK7 is a
        licensing factor seen in the active disc but is not part of the GO complex
        definition.
  context:

    taxa:
      - preferred_term: Mammalia
        term:
          id: NCBITaxon:40674
          label: Mammalia
        description: >-
          Mammalia is the narrowest clade in which every role of this particular
          chain is filled by one orthologous group, and it is also the widest clade
          for which that is true, so it is the scope of the module rather than a
          stand-in for one species. Each role is therefore expressed as a PANTHER
          subfamily with human and mouse representatives, not as a human gene
          product. Curator judgement on the clade boundary: NLRP3 itself is a
          vertebrate NLR, and ASC/PYCARD, the inflammatory-caspase clade and NINJ1
          are conserved more widely still, so a vertebrate-wide scope would be
          defensible for the architecture. It is not defensible for this chain,
          because outside mammals the two steps after the protease are filled by
          non-orthologous proteins: the cached zebrafish GO-CAM
          gomodel:60418ffa00001019 runs the same sensor-adaptor platform into
          caspase-a/caspase-b and gasdermin Eb rather than into caspase-1 and
          gasdermin D. A module asserted for Vertebrata would therefore claim
          orthologs that do not exist for parts 5 and 6, and NEK7 licensing is
          likewise characterised only in mammals. The teleost variant belongs in a
          sibling module, or in a sensor-generalised parent module, not in a
          widened taxon field here.
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          Sensing, adaptor polymerisation, caspase autoactivation and substrate
          cleavage all occur on cytosolic platforms. The trans-Golgi network
          membrane and the plasma membrane are asserted on the individual annotons
          that act there rather than as module-wide context.
  gocam_associations:
    - model: gomodel:635b1e3e00001811
      title: The NLRP3 inflammasome (Human)
      description: >-
        Whole-model association. This production GO-CAM covers the same chain as
        this module, from NLRP3 sensing to extracellular cytokine activity, and
        every module annoton that has a counterpart activity in it is pinned
        individually below.
      notes: >-
        Mapping and divergences, following gocams/635b1e3e00001811/635b1e3e00001811-review.yaml.
        Model activities with a module counterpart: 1847 PtdIns4P binding ->
        nlrp3_pi4p_recruitment; 1836 signaling adaptor activity (has_input PYCARD)
        -> nlrp3_pyd_filament_adaptor; 1959 NEK7 activator -> nek7_nlrp3_licensing;
        1870 CASP1 endopeptidase (has_input GSDMD) -> casp1_gsdmd_cleavage; 1881
        and 1894 (has_input pro-IL-1 beta, pro-IL-18) -> casp1_cytokine_precursor_cleavage;
        1917 and 1910 GSDMD-NT lipid binding -> gsdmd_nt_acidic_lipid_binding; 1926
        wide pore channel -> gsdmd_nt_wide_pore. Four divergences are recorded on
        the annotons they concern. (i) 1812 molecular sensor activity mistypes the
        entry point: GO:0140299 requires binding the sensed molecule and no direct
        NLRP3 agonist is known, so this module asserts no sensing activity and
        carries the switch on the ATPase instead; the gap is recorded as a
        knowledge gap. (ii) 1821, typed signaling adaptor activity with NLRP3 as
        its own has_input and placed at the MTOC upstream of PtdIns4P binding, is
        evidenced by structures of the inactive ADP-bound cage; this module
        represents that cage as the resting state of nlrp3_nacht_atp_switch and
        keeps the adaptor role on the one annoton that names a partner. (iii) 1857
        puts cysteine-type endopeptidase activator activity on NLRP3, which has no
        CARD; this module places caspase-1 activation on the ASC adaptor
        (pycard_bipartite_adaptor), with PYCARD as an activity rather than, as in
        the model, a has_input molecule only. (iv) the model has no counterpart for
        NLRP3 ATP hydrolysis, for caspase-1 CARD binding and autoprocessing, or for
        NINJ1 rupture, and its two terminal cytokine-activity nodes (1943, 1950)
        lie downstream of this module's boundary.
    - model: gomodel:663d668500001246
      title: Pyroptotic cell death mediated by GSDMD and NINJ1 (Human).
      notes: >-
        The execution arm only, and the source of the NINJ1 step that
        gomodel:635b1e3e00001811 lacks. Pinned on
        gsdmd_nt_acidic_lipid_binding and ninj1_membrane_destabilization.
  parts:
    - order: 1
      role: >-
        NLRP3 sensor activation - membrane recruitment, nucleotide switching and
        presentation of a PYD filament
      node:
        id: nlrp3_sensor_activation
        label: NLRP3 sensor activation and platform formation
        module_type: REGULATORY_STEP
        description: >-
          NLRP3 responds to a wide range of stimuli without binding any of them. A
          polybasic region binds PI4P on the dispersed trans-Golgi network, the
          dispersed network and the pericentriolar material concentrate NLRP3 into
          condensates, and the NACHT domain converts from an ADP-bound autoinhibited
          oligomer to an ATP-bound active disc whose N-terminal pyrin domains stack
          into a filament. The output of this part is that filament; nothing here is
          catalytic except the ATPase that drives the conformational switch.
        concepts:
          - preferred_term: NLRP3 inflammasome complex assembly
            term:
              id: GO:0044546
              label: NLRP3 inflammasome complex assembly
        gocam_associations:
          - model: gomodel:635b1e3e00001811
            activity: gomodel:635b1e3e00001811/635b1e3e00001812
            title: The NLRP3 inflammasome (Human)
            notes: >-
              The model's entry point, associated with this part as a whole rather
              than with any annoton in it, because the module asserts no
              corresponding activity. Node 1812 is typed GO:0140299 molecular
              sensor activity, which is defined as binding a molecule and
              eliciting a change in response to its level; no direct NLRP3 agonist
              ligand is known, the node's own references describe engagement by
              crystals and by lysosomal damage rather than binding, and the NLRP3
              gene review MARK_AS_OVER_ANNOTATED every GO:0140299 row including
              the IDA cited there. This part is therefore written as membrane
              recruitment, nucleotide switching and filament presentation, with no
              sensing activity, and the missing proximal event is recorded as the
              first knowledge gap of this module.
        annotons:
          - id: nlrp3_pi4p_recruitment
            label: NLRP3 PI4P binding at the dispersed trans-Golgi network
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NLRP3 ortholog group
                term:
                  id: PANTHER:PTHR45690:SF19
                  label: NACHT, LRR AND PYD DOMAINS-CONTAINING PROTEIN 3
                representative_members:
