    - order: 2
      optional: true
      role: >-
        NEK7 licensing of NLRP3 - non-catalytic, compensable regulation of sensor
        activation rather than a step in the chain
      node:
        id: nek7_licensing
        label: NEK7 licensing of NLRP3 (optional)
        module_type: REGULATORY_STEP
        description: >-
          Acting downstream of potassium efflux and at the microtubule organizing
          centre, NEK7 binds the NLRP3 leucine-rich repeat, opens the autoinhibited
          cage and bridges adjacent NLRP3 subunits in the assembled disc, of which
          it is a stoichiometric subunit. The role is kinase-independent. It is
          modelled as optional regulation because human myeloid cells can dispense
          with it: IKKbeta-driven recruitment of NLRP3 to PI4P makes NEK7 redundant
          and is reported as the predominant human priming route, and raising NLRP3
          abundance makes activation independent of both NEK7 and priming.
        concepts:
          - preferred_term: positive regulation of NLRP3 inflammasome complex assembly
            term:
              id: GO:1900227
              label: positive regulation of NLRP3 inflammasome complex assembly
        annotons:
          - id: nek7_nlrp3_licensing
            label: NEK7 non-catalytic activation of NLRP3
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NEK7 ortholog group
                term:
                  id: PANTHER:PTHR43289:SF2
                  label: SERINE_THREONINE-PROTEIN KINASE NEK7
                representative_members:
                - preferred_term: NEK7 (human)
                  term:
                    id: UniProtKB:Q8TDX7
                    label: Serine/threonine-protein kinase Nek7
                - preferred_term: Nek7 (mouse)
                  term:
                    id: UniProtKB:Q9ES74
                    label: Serine/threonine-protein kinase Nek7
                description: >-
                  The NEK7 subfamily. The licensing role is characterised in human and
                  mouse macrophages; the parent family PTHR43289 is much broader and the
                  PAINT rows there carry the mitotic kinase function, not this one.
            function:
              preferred_term: molecular function activator activity
              term:
                id: GO:0140677
                label: molecular function activator activity
              targets:
                - preferred_term: NLRP3 leucine-rich repeat domain
              description: >-
                Deliberately not a kinase activity. Kinase-dead NEK7 rescues
                inflammasome activation, and the local PAINT row propagating
                GO:0004674 for this family describes the mitotic function, not this
                one, so it is not cited here.
            processes:
              - preferred_term: positive regulation of NLRP3 inflammasome complex assembly
                term:
                  id: GO:1900227
                  label: positive regulation of NLRP3 inflammasome complex assembly
              - preferred_term: cellular response to potassium ion
                term:
                  id: GO:0035865
                  label: cellular response to potassium ion
            locations:
              - preferred_term: microtubule organizing center
                term:
                  id: GO:0005815
                  label: microtubule organizing center
            role_description: >-
              Licensing factor, not effector: NEK7 makes the sensor activatable and
              is built into the active disc, but performs no chemistry and can be
              bypassed. Because the NEK9- and NLRP3-binding surfaces on NEK7
              overlap and cellular NEK7 is limiting, this role is mutually
              exclusive with its mitotic one.
            gocam_associations:
              - model: gomodel:635b1e3e00001811
                activity: gomodel:635b1e3e00001811/635b1e3e00001959
                title: The NLRP3 inflammasome (Human)
                notes: Identical typing (GO:0140677, GO:1900227, MTOC).
            evidence:
              - source_id: PMID:26814970
                title: NEK7 is an essential mediator of NLRP3 activation downstream of potassium efflux.
                statement: >-
                  NEK7 was identified as an NLRP3-binding protein acting downstream
                  of potassium efflux to regulate NLRP3 oligomerization and
                  activation.
                supporting_text: >-
                  NEK7, a member of the family of mammalian NIMA-related kinases
                  (NEK proteins), as an NLRP3-binding protein that acts downstream
                  of potassium efflux to regulate NLRP3 oligomerization and
                  activation
              - source_id: PMID:26642356
                title: >-
                  NLRP3 activation and mitosis are mutually exclusive events
                  coordinated by NEK7, a new inflammasome component.
                statement: >-
                  The catalytic activity of NEK7 is dispensable for NLRP3
                  activation, which is why GO:0140677 rather than a kinase activity
                  is asserted here.
                supporting_text: >-
                  These results indicate that the kinase activity of NEK7 is
                  nonessential for activation of the NLRP3 inflammasome.
              - source_id: PMID:31189953
                title: Structural mechanism for NEK7-licensed activation of NLRP3 inflammasome.
                statement: >-
                  NEK7 bridges adjacent NLRP3 subunits, which is the structural
                  content of licensing.
                supporting_text: >-
                  In NLRP3, the LRR itself is too short to reach the adjacent LRR
                  in the hypothetical oligomer, and NEK7 bridges the gap between
                  adjacent NLRP3 subunits.
              - source_id: PMID:36384135
                title: IKKβ primes inflammasome formation by recruiting NLRP3 to the trans-Golgi network.
                statement: >-
                  The counterweight that makes this part optional rather than core:
                  NEK7 is redundant for inflammasome formation when IKKbeta has
                  recruited NLRP3 to PI4P, and that route predominates in human
                  myeloid cells.
                supporting_text: >-
                  NEK7, a mitotic spindle kinase that had previously been thought to
                  be indispensable for NLRP3 activation, was redundant for
                  inflammasome formation when IKKβ recruited NLRP3 to PI4P.
              - source_id: PMID:42378282
                title: The centrosomal hub unifies regulatory factors of NLRP3 inflammasome activation.
                statement: >-
                  NLRP3 abundance can substitute for both NEK7 and priming, a second
                  independent reason this part is compensable.
                supporting_text: >-
                  Elevated NLRP3 expression compensates for limited PCM abundance,
                  rendering K+ efflux-induced activation independent of both NEK7
                  and priming in human and mouse macrophages.
    - order: 3
      role: >-
        ASC/PYCARD adaptor polymerisation - the PYD filament is converted into a
        CARD-presenting speck
      node:
        id: asc_speck_assembly
        label: ASC filament and speck assembly
        module_type: REGULATORY_STEP
        description: >-
          ASC is nucleated by the sensor PYD filament and polymerises through
          homotypic PYD-PYD and CARD-CARD contacts, condensing into a single
          perinuclear speck (pyroptosome) per stimulated cell. The step amplifies a
          localised sensor signal into a large platform whose surface is clustered
          CARDs; like the sensor step, it is pure connectivity with no catalysis.
        concepts:
          - preferred_term: canonical inflammasome complex assembly
            term:
              id: GO:0140632
              label: canonical inflammasome complex assembly
          - preferred_term: pyroptosome complex
            term:
              id: GO:0061703
              label: pyroptosome complex
            description: >-
              The condensed, one-per-cell ASC assembly. Retained alongside
              GO:0140632 canonical inflammasome complex assembly because the speck
              is the supramolecular form the adaptor takes, not a synonym for the
              assembly process.
        annotons:
          - id: pycard_bipartite_adaptor
            label: ASC bipartite adaptor bridging sensor and procaspase-1
            participant:
              selector_type: FAMILY
              family:
                preferred_term: ASC/PYCARD ortholog group
                term:
                  id: PANTHER:PTHR46985:SF2
                  label: APOPTOSIS-ASSOCIATED SPECK-LIKE PROTEIN CONTAINING A CARD
                representative_members:
                - preferred_term: PYCARD / ASC (human)
                  term:
                    id: UniProtKB:Q9ULZ3
                    label: Apoptosis-associated speck-like protein containing a CARD
                - preferred_term: Pycard / mASC (mouse)
                  term:
                    id: UniProtKB:Q9EPB4
                    label: Apoptosis-associated speck-like protein containing a CARD
                description: >-
                  The ASC subfamily. ASC is the single bipartite adaptor of all canonical
                  inflammasomes in mammals, so the role is filled by orthology rather than
                  by alternative paralogs.
            function:
              preferred_term: signaling adaptor activity
              term:
                id: GO:0035591
                label: signaling adaptor activity
              targets:
                - preferred_term: NLRP3 pyrin domain filament
                - preferred_term: procaspase-1 CARD
            processes:
              - preferred_term: canonical inflammasome complex assembly
                term:
                  id: GO:0140632
                  label: canonical inflammasome complex assembly
              - preferred_term: NLRP3 inflammasome complex assembly
                term:
                  id: GO:0044546
                  label: NLRP3 inflammasome complex assembly
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The defining function of the protein and the hinge of the module: the
              pyrin domain receives nucleation from the sensor and the clustered
              CARDs hand the signal to procaspase-1. The same adaptor serves NLRP1,
              AIM2, NLRP6, IFI16 and pyrin, which is what makes this and the
              following parts the reusable core of canonical inflammasome signalling.
            gocam_associations:
              - model: gomodel:635b1e3e00001811
                activity: gomodel:635b1e3e00001811/635b1e3e00001857
                title: The NLRP3 inflammasome (Human)
                notes: >-
                  The model's caspase-1-activating step, associated here because
                  this module assigns it to a different protein. Node 1857 is
                  GO:0140608 cysteine-type endopeptidase activator activity with
                  has_input CASP1, enabled by NLRP3 - but NLRP3 has no CARD and does
                  not contact procaspase-1; the very paper cited there
                  (PMID:36442502) states that ASC recruits and activates caspase-1
                  through CARD-CARD interactions. In this module the bipartite ASC
                  adaptor is the activity that bridges the sensor filament to
                  procaspase-1, and PYCARD is a participant with a function rather
                  than, as in the model, a has_input molecule with no activity of
                  its own. The activator role itself is not duplicated as a second
                  ASC annoton: it is the asc_speck_assembly -> casp1_autoactivation
                  connection, consistent with the PYCARD gene review, which carries
                  GO:0140608 as a core function.
            evidence:
              - source_id: PMID:24630722
                title: Unified polymerization mechanism for the assembly of ASC-dependent inflammasomes.
                statement: >-
                  ASC bridges sensor and caspase through PYD and CARD interactions
                  respectively, forming ternary inflammasome complexes.
                supporting_text: >-
                  The adaptor protein ASC bridges the sensor proteins and caspase-1
                  to form ternary inflammasome complexes
          - id: pycard_self_oligomerization
            label: ASC self-association into filaments and the speck
            participant:
              selector_type: FAMILY
              family:
                preferred_term: ASC/PYCARD ortholog group
                term:
                  id: PANTHER:PTHR46985:SF2
                  label: APOPTOSIS-ASSOCIATED SPECK-LIKE PROTEIN CONTAINING A CARD
                representative_members:
                - preferred_term: PYCARD / ASC (human)
                  term:
                    id: UniProtKB:Q9ULZ3
                    label: Apoptosis-associated speck-like protein containing a CARD
                - preferred_term: Pycard / mASC (mouse)
                  term:
                    id: UniProtKB:Q9EPB4
                    label: Apoptosis-associated speck-like protein containing a CARD
                description: >-
                  The ASC subfamily. ASC is the single bipartite adaptor of all canonical
                  inflammasomes in mammals, so the role is filled by orthology rather than
                  by alternative paralogs.
            function:
              preferred_term: identical protein binding
              term:
                id: GO:0042802
                label: identical protein binding
              targets:
                - preferred_term: ASC/PYCARD (homotypic PYD-PYD and CARD-CARD contacts)
            processes:
              - preferred_term: protein homooligomerization
                term:
                  id: GO:0051260
                  label: protein homooligomerization
              - preferred_term: pyroptosome complex assembly
                term:
                  id: GO:1904270
                  label: pyroptosome complex assembly
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Self-polymerisation is the amplification mechanism: one nucleation
              event becomes a single large caspase-activating assembly, so the
              output of the step is a high local concentration of CARDs rather than
              a stoichiometric complex.
            evidence:
              - source_id: PMID:17599095
                title: >-
                  The pyroptosome: a supramolecular assembly of ASC dimers mediating
                  inflammatory cell death via caspase-1 activation.
                statement: >-
                  One ASC pyroptosome forms per stimulated cell and rapidly recruits
                  and activates caspase-1, leading to pyroptosis and cytokine
                  release.
                supporting_text: >-
                  Only one distinct pyroptosome in each stimulated cell is formed,
                  which rapidly recruits and activates caspase-1 resulting in
                  pyroptosis and the release of the intracellular proinflammatory
                  cytokines.
    - order: 4
      role: >-
        caspase-1 recruitment and proximity-induced autoprocessing - the zymogen
        becomes an active protease
      node:
        id: casp1_autoactivation
        label: Caspase-1 CARD filament formation and autoprocessing
        module_type: REGULATORY_STEP
        description: >-
          The procaspase-1 CARD engages the clustered ASC CARDs and polymerises
          into its own filament, so that the zymogen is activated by proximity
          rather than by an allosteric effector. Interdomain-linker
          autoprocessing then yields the p20/p10 enzyme and is required for
          pyroptosis. This is the point at which the module stops being geometry
          and becomes chemistry.
        concepts:
          - preferred_term: canonical inflammasome complex
            term:
              id: GO:0061702
              label: canonical inflammasome complex
            description: >-
              GO defines this as a cytosolic complex capable of activating
              caspase-1; the NLRP3 form of it is GO:0072559, asserted on the
              annotons that are subunits.
        annotons:
          - id: casp1_card_filament_autoprocessing
            label: Caspase-1 CARD binding and proximity-induced autoprocessing
            participant:
              selector_type: FAMILY
              family:
                preferred_term: caspase-1 ortholog group
                term:
                  id: PANTHER:PTHR47901:SF3
                  label: CASPASE-1
                representative_members:
                - preferred_term: CASP1 (human)
                  term:
                    id: UniProtKB:P29466
                    label: Caspase-1
                - preferred_term: Casp1 (mouse)
                  term:
                    id: UniProtKB:P29452
                    label: Caspase-1
                description: >-
                  The caspase-1 subfamily. The inflammatory caspases CASP4/CASP5 (human)
                  and Casp11 (mouse) cleave gasdermin D as well, but they do so from the
                  non-canonical LPS-sensing route without NLRP3 or ASC, so they are not
                  modelled here as alternative realizers of this step.
            function:
              preferred_term: CARD domain binding
              term:
                id: GO:0050700
                label: CARD domain binding
              targets:
                - preferred_term: ASC/PYCARD CARD filament
                - preferred_term: procaspase-1 CARD (self-polymerisation)
            processes:
              - preferred_term: protein autoprocessing
                term:
                  id: GO:0016540
                  label: protein autoprocessing
              - preferred_term: inflammasome-mediated signaling pathway
                term:
                  id: GO:0141084
                  label: inflammasome-mediated signaling pathway
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Recruitment and self-assembly, not substrate cleavage: the CARD
              interaction positions zymogens densely enough to autoprocess. This is
              one of the few steps in GO where the substrate of a proteolysis is
              legitimately the protease itself, hence GO:0016540.
            gocam_associations:
              - model: gomodel:635b1e3e00001811
                activity: gomodel:635b1e3e00001811/635b1e3e00001857
                title: The NLRP3 inflammasome (Human)
                notes: >-
                  No activity in the model corresponds to caspase-1 CARD binding and
                  autoprocessing: the model has three CASP1 nodes and all three are
                  substrate cleavage (GO:0004197), so the zymogen-to-protease step is
                  represented only as the incoming activator edge from node 1857.
                  That node is associated here for that reason, and on
                  pycard_bipartite_adaptor for the separate reason that the model
                  attributes it to NLRP3. This module keeps recruitment and
                  autoprocessing (this annoton, GO:0050700 with GO:0016540) distinct
                  from substrate cleavage (the next part), so that the one step where
                  the protease is its own substrate is stated explicitly rather than
                  folded into a causal edge.
            evidence:

              - source_id: PMID:24630722
                title: Unified polymerization mechanism for the assembly of ASC-dependent inflammasomes.
                statement: >-
                  Clustered ASC CARDs nucleate caspase-1 CARD filaments, activating
                  the caspase by proximity.
                supporting_text: >-
                  ASC thus nucleates CARD filaments of caspase-1, leading to
                  proximity-induced activation.
              - source_id: PMID:32051255
                title: Caspase-1 interdomain linker cleavage is required for pyroptosis.
                statement: >-
                  Autoprocessing of the interdomain linker is required for
                  pyroptosis, so the activation step is a genuine prerequisite of
                  the execution arm rather than a maturation detail.
                supporting_text: >-
                  pro-caspase-1 IDL cleavage is necessary for pyroptosis induced by
                  both ASC-dependent and ASC-independent inflammasomes
              - source_id: PANTHER:PTN008720309
                statement: >-
                  IBD propagation of C:GO:0072559 NLRP3 inflammasome complex at PAINT
                  node PTN008720309 in PTHR47901, seeded by UniProtKB:P29466.
    - order: 5
      role: >-
        caspase-1 substrate cleavage - gasdermin D activation and
        interleukin-1-family precursor maturation
      node:
        id: casp1_substrate_cleavage
        label: Caspase-1 proteolysis of gasdermin D and cytokine precursors
        module_type: REGULATORY_STEP
        description: >-
          The single catalytic step of the module. Autoprocessed caspase-1 cleaves
          after an Asp in a YVAD-like context, and its physiologically decisive
          substrates fall into two classes: full-length gasdermin D, whose
          interdomain cleavage releases the pore-forming fragment, and the
          interleukin-1 beta and interleukin-18 precursors, whose cleavage yields
          the mature cytokines. Both substrate classes are recorded here as
          substrates of caspase-1; neither cytokine is given an annoton, because
          neither performs any part of its own cleavage.
        concepts:
          - preferred_term: cytokine precursor processing
            term:
              id: GO:0140447
              label: cytokine precursor processing
        annotons:
          - id: casp1_gsdmd_cleavage
            label: Caspase-1 cleavage of gasdermin D
            participant:
              selector_type: FAMILY
              family:
                preferred_term: caspase-1 ortholog group
                term:
                  id: PANTHER:PTHR47901:SF3
                  label: CASPASE-1
                representative_members:
                - preferred_term: CASP1 (human)
                  term:
                    id: UniProtKB:P29466
                    label: Caspase-1
                - preferred_term: Casp1 (mouse)
                  term:
                    id: UniProtKB:P29452
                    label: Caspase-1
                description: >-
                  The caspase-1 subfamily. The inflammatory caspases CASP4/CASP5 (human)
                  and Casp11 (mouse) cleave gasdermin D as well, but they do so from the
                  non-canonical LPS-sensing route without NLRP3 or ASC, so they are not
                  modelled here as alternative realizers of this step.
            function:
              preferred_term: cysteine-type endopeptidase activity
              term:
                id: GO:0004197
                label: cysteine-type endopeptidase activity
              substrates:
                - preferred_term: gasdermin D (full-length, interdomain linker)
              products:
                - preferred_term: gasdermin-D N-terminal fragment (GSDMD-NT)
                - preferred_term: gasdermin-D C-terminal fragment
            processes:
              - preferred_term: pyroptotic cell death
                term:
                  id: GO:0141201
                  label: pyroptotic cell death
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The hand-off from signalling to execution. Caspase-1 engages
              full-length GSDMD through both its active site and an exosite that
              binds the GSDMD C-terminal domain, and cleaving the linker relieves
              the intramolecular autoinhibition of the N-terminal fragment.
            gocam_associations:
              - model: gomodel:635b1e3e00001811
                activity: gomodel:635b1e3e00001811/635b1e3e00001870
                title: The NLRP3 inflammasome (Human)
                notes: >-
                  The matching activity, and the only one of the model's three CASP1
                  nodes that is wired onward: GO:0004197 with has_input full-length
                  GSDMD, directly activating the two GSDMD-NT lipid-binding nodes,
                  which is the correct way to express that the cleavage generates the
                  fragment that binds. The model's part_of is the generic GO:0051604
