                  precursors
    - order: 7
      role: >-
        NINJ1 plasma membrane rupture - the terminal, shared lytic step that ends
        the cell and releases DAMPs
      node:
        id: ninj1_membrane_rupture
        label: NINJ1-mediated plasma membrane rupture
        module_type: REGULATORY_STEP
        description: >-
          Downstream of gasdermin pores, the autoinhibited NINJ1 dimer exposes the
          hydrophilic faces of its amphipathic helices and polymerises laterally
          into branched filaments and rings in the plasma membrane, so that
          membrane is lost rather than merely perforated and cytoplasmic DAMPs such
          as HMGB1 and LDH are released. The step is deliberately marked as shared:
          NINJ1 performs the same act downstream of MLKL in necroptosis, after
          apoptosis, in ferroptosis and after osmotic swelling, so it is the
          terminal part of this module without being specific to it.
        concepts:
          - preferred_term: pyroptotic cell death
            term:
              id: GO:0141201
              label: pyroptotic cell death
        annotons:
          - id: ninj1_membrane_destabilization
            label: NINJ1 membrane destabilization (terminal step)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: ninjurin-1 ortholog group
                term:
                  id: PANTHER:PTHR12316:SF19
                  label: NINJURIN-1
                representative_members:
                - preferred_term: NINJ1 (human)
                  term:
                    id: UniProtKB:Q92982
                    label: Ninjurin-1
                - preferred_term: Ninj1 (mouse)
                  term:
                    id: UniProtKB:O70131
                    label: Ninjurin-1
                description: >-
                  The ninjurin-1 subfamily. NINJ2 is a paralog in the same parent family
                  but has no established membrane-rupture role, so the terminal step is
                  filled by NINJ1 orthology alone.
            function:
              preferred_term: membrane destabilizing activity
              term:
                id: GO:0140912
                label: membrane destabilizing activity
              description: >-
                The reviewed NINJ1 core activity, and the same term the necroptosis
                module asserts for MLKL: a lytic effector that binds the membrane
                and increases its permeability to the point of rupture. A
                pore-forming or wide-pore channel activity is deliberately not
                asserted - whether the filaments excise membrane disks or open very
                large pores is unsettled, and is recorded as a knowledge gap.
            processes:
              - preferred_term: pyroptotic cell death
                term:
                  id: GO:0141201
                  label: pyroptotic cell death
              - preferred_term: cytolysis
                term:
                  id: GO:0019835
                  label: cytolysis
              - preferred_term: protein homooligomerization
                term:
                  id: GO:0051260
                  label: protein homooligomerization
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              The irreversible end of the module. Unlike every step above it, this
              one is not pathway-specific: its loss leaves the cell dying with an
              intact membrane and blunted DAMP release rather than preventing
              pyroptotic commitment.
            gocam_associations:
              - model: gomodel:663d668500001246
                activity: gomodel:663d668500001246/663d668500001406
                title: Pyroptotic cell death mediated by GSDMD and NINJ1 (Human).
                notes: >-
                  NINJ1 membrane destabilizing activity downstream of the GSDMD
                  pore, which is the arrangement modelled here. There is no NINJ1
                  activity at all in gomodel:635b1e3e00001811, so this terminal part
                  is grounded only in the execution-arm model.
            evidence:
              - source_id: PMID:33472215
                title: NINJ1 mediates plasma membrane rupture during lytic cell death.
                statement: >-
                  NINJ1 oligomerises through a conserved extracellular domain to
                  cause plasma membrane rupture.
                supporting_text: >-
                  Mechanistically, NINJ1 used an evolutionarily conserved
                  extracellular domain for oligomerization and subsequent PMR.
              - source_id: PMID:38614101
                title: NINJ1 mediates plasma membrane rupture by cutting and releasing membrane disks.
                statement: >-
                  NINJ1-mediated rupture is mechanistically distinct from gasdermin
                  pore formation, which is why the two effectors carry different
                  molecular-function terms in this module.
                supporting_text: >-
                  Therefore, NINJ1-mediated membrane disk formation is different from
                  gasdermin-mediated pore formation, resulting in membrane loss and
                  plasma membrane rupture.
  connections:
    - source: nlrp3_sensor_activation
      target: asc_speck_assembly
      connection_type: CAUSES
      description: >-
        The pyrin-domain filament of the active NLRP3 disc nucleates unidirectional
        ASC polymerisation.
      evidence:
        - source_id: PMID:36442502
          title: Cryo-EM structures of the active NLRP3 inflammasome disc.
          statement: The assembled NLRP3 PYD filament recruits the ASC pyrin domain.
          supporting_text: >-
            The N-terminal PYDs from all NLRP3 subunits combine to form a PYD
            filament that recruits ASC PYD to elicit downstream signalling.
    - source: nek7_licensing
      target: nlrp3_sensor_activation
      connection_type: POSITIVELY_REGULATES
      description: >-
        NEK7 opens the autoinhibited NLRP3 cage and bridges adjacent subunits in
        the disc, making the sensor activatable. Modelled as regulation rather than
        as a step because the requirement is compensable by IKKbeta-driven PI4P
        recruitment and by raised NLRP3 abundance.
    - source: asc_speck_assembly
      target: casp1_autoactivation
      connection_type: CAUSES
      description: >-
        Clustered ASC CARDs in the speck nucleate procaspase-1 CARD filaments,
        activating the zymogen by proximity.
      evidence:
        - source_id: PMID:24630722
          title: Unified polymerization mechanism for the assembly of ASC-dependent inflammasomes.
          statement: ASC nucleates caspase-1 CARD filaments, giving proximity-induced activation.
          supporting_text: >-
            ASC thus nucleates CARD filaments of caspase-1, leading to
            proximity-induced activation.
    - source: casp1_autoactivation
      target: casp1_substrate_cleavage
      connection_type: CAUSES
      description: >-
        Interdomain-linker autoprocessing yields the p20/p10 enzyme that cleaves
        gasdermin D and the cytokine precursors; autoprocessing is required for
        pyroptosis.
    - source: casp1_substrate_cleavage
      target: gsdmd_pore_formation
      connection_type: CAUSES
      description: >-
        Cleavage of the gasdermin-D interdomain linker releases the N-terminal
        fragment from autoinhibition, which is required and sufficient for
        pyroptosis.
      evidence:
        - source_id: PMID:26375003
          title: Cleavage of GSDMD by inflammatory caspases determines pyroptotic cell death.
          statement: >-
            Linker cleavage by caspase-1 is required and sufficient for pyroptosis.
          supporting_text: >-
            Caspase-1 and caspase-4/5/11 specifically cleaved the linker between the
            amino-terminal gasdermin-N and carboxy-terminal gasdermin-C domains in
            GSDMD, which was required and sufficient for pyroptosis
    - source: gsdmd_pore_formation
      target: ninj1_membrane_rupture
      connection_type: CAUSES
      description: >-
        Gasdermin pores precede and trigger NINJ1-dependent rupture; the pore stage
        is survivable and NINJ1 is what makes the outcome terminal. The same NINJ1
        step is reached from MLKL in modules/necroptosis.yaml, so this edge is the
        pyroptotic entry into a shared terminal effector rather than a dedicated
        one.
    - source: gsdmd_pore_formation
      target: nlrp3_sensor_activation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Potassium efflux through GSDMD pores feeds back on the sensor. This is also
        the step at which the non-canonical caspase-4/5/11 route engages the
        canonical NLRP3 inflammasome, since those caspases cleave GSDMD directly and
        the resulting K+ efflux activates NLRP3. The evidence below is from the
        caspase-11 (non-canonical) entry point, where the GSDMD N-terminal fragment
        and the resulting fall in intracellular K+ are shown to act upstream of
        NLRP3; the same K+-efflux dependence is assumed, not separately demonstrated,
        for GSDMD pores made by caspase-1 in the canonical route modelled here.
      evidence:
        - source_id: PMID:26173909
          statement: Caspase-11 acts upstream of a canonical NLRP3 inflammasome, and the drop in intracellular
            potassium it causes is required for NLRP3 activation.
          supporting_text: Furthermore, we show that active caspase-11 leads to a drop of intracellular
            potassium levels, which is necessary to activate NLRP3.
        - source_id: PMID:26375259
          statement: The caspase-11-generated gasdermin D N-terminal fragment promotes NLRP3-dependent
            caspase-1 activation cell-intrinsically, placing the pore fragment upstream of the sensor.
          supporting_text: Mechanistically, caspase-11 cleaves gasdermin D, and the resulting amino-terminal
            fragment promotes both pyroptosis and NLRP3-dependent activation of caspase-1 in a cell-intrinsic
            manner.

