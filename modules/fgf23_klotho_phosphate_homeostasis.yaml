id: MODULE:fgf23_klotho_phosphate_homeostasis
title: FGF23-alpha-Klotho endocrine axis in phosphate and vitamin D homeostasis
description: >-
  The bone-kidney endocrine axis through which the hormone FGF23 lowers serum
  phosphate and active vitamin D. In osteocytes and osteoblasts FGF23 is
  synthesised as a secreted proprotein whose activity is set post-translationally
  at a proprotein-convertase site (R176XXR179): the Golgi polypeptide
  GalNAc-transferase GALNT3 O-glycosylates Thr178, which shields the site from
  furin-type cleavage and permits secretion of intact, active hormone, whereas
  FAM20C phosphorylation of Ser180 opposes that glycosylation and favours cleavage
  into inactive N- and C-terminal fragments. Circulating intact FGF23 acts on
  kidney (and parathyroid) cells that express the single-pass transmembrane
  co-receptor alpha-Klotho, which tethers the FGF23 C-terminal tail to the
  FGFR1c ectodomain and converts the canonical receptor tyrosine kinase into a
  high-affinity FGF23 receptor. Signalling through the Klotho-FGFR1c complex
  reduces proximal-tubule sodium-phosphate cotransport (NaPi-2a/SLC34A1 and
  NaPi-2c/SLC34A3), causing phosphaturia, and lowers 1,25-dihydroxyvitamin D by
  suppressing the 25-hydroxyvitamin D 1-alpha-hydroxylase CYP27B1 and inducing
  the 24-hydroxylase CYP24A1. Loss of function at the hormone, glycosylation or
  co-receptor step causes hyperphosphatemic familial tumoral calcinosis, and
  cleavage-resistant FGF23 or excess osteocytic FGF23 production causes
  hypophosphatemic rickets.
status: DRAFT
evidence:
  - source_id: GO:0055062
    title: phosphate ion homeostasis
    statement: >-
      The axis is the principal hormonal system lowering serum phosphate; FGF23,
      alpha-Klotho and GALNT3 reviews all carry this process or its regulation.
  - source_id: PMID:17086194
    title: Klotho converts canonical FGF receptor into a specific receptor for FGF23.
    statement: >-
      Klotho binds FGF23 and, with FGFR1(IIIc), reconstitutes the FGF23 receptor
      (basis for the co-receptor and receptor annotons).
  - source_id: PMID:29342138
    title: "α-Klotho is a non-enzymatic molecular scaffold for FGF23 hormone signalling."
    statement: >-
      Crystal structure of the FGF23-FGFR1c-alpha-Klotho complex: Klotho tethers
      FGFR1c by its D3 domain and FGF23 by its C-terminal tail.
  - source_id: PMID:16638743
    title: Polypeptide GalNAc-transferase T3 and familial tumoral calcinosis. Secretion of fibroblast growth factor 23 requires O-glycosylation.
    statement: >-
      Secretion of intact FGF23 requires GALNT3-dependent O-glycosylation (basis
      for the glycosylation step and its positive effect on the hormone).
  - source_id: PMID:15040831
    title: FGF-23 is a potent regulator of vitamin D metabolism and phosphate homeostasis.
    statement: >-
      FGF23 reduces renal 1alpha-hydroxylase mRNA, increases 24-hydroxylase mRNA
      and reduces NaPi-2a, establishing the renal effector arm.
  - source_id: file:human/FGF23/FGF23-ai-review.yaml
    title: FGF23 gene review (human)
    statement: >-
      Hormone activity (GO:0005179) with negative regulation of sodium-dependent
      phosphate transport and of vitamin D biosynthesis are the core functions of
      UniProtKB:Q9GZV9.
  - source_id: file:human/KL/KL-ai-review.yaml
    title: KL gene review (human)
    statement: >-
      Coreceptor activity (GO:0015026) at the plasma membrane is the core function
      of alpha-Klotho (UniProtKB:Q9UEF7).
  - source_id: file:human/GALNT3/GALNT3-ai-review.yaml
    title: GALNT3 gene review (human)
    statement: >-
      Polypeptide N-acetylgalactosaminyltransferase activity (GO:0004653) at the
      Golgi membrane, with FGF23 Thr178 as its non-redundant physiological
      substrate, is the core function of UniProtKB:Q14435.
  - source_id: file:human/FGFR1/FGFR1-ai-review.yaml
    title: FGFR1 gene review (human)
    statement: >-
      Fibroblast growth factor receptor activity (GO:0005007) at the plasma
      membrane is a core function of UniProtKB:P11362 (review in draft).
  - source_id: file:human/CYP27B1/CYP27B1-ai-review.yaml
    title: CYP27B1 gene review (human)
    statement: >-
      Calcidiol 1-monooxygenase activity (GO:0004498) at the mitochondrial inner
      membrane is the core function of UniProtKB:O15528.
module:
  id: fgf23_klotho_phosphate_homeostasis
  label: FGF23-alpha-Klotho phosphate homeostasis axis
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: phosphate ion homeostasis
      term:
        id: GO:0055062
        label: phosphate ion homeostasis
      description: >-
        The homeostatic process the axis serves: bone-derived FGF23 lowers serum
        phosphate by inhibiting renal phosphate reabsorption.
  parts:
    - order: 1
      role: protective O-glycosylation of the FGF23 proprotein-convertase site in bone cells
      node:
        id: fgf23_glycosylation_step
        label: GALNT3 O-glycosylation of FGF23 Thr178
        module_type: REACTION
        annotons:
          - id: galnt3_activity
            label: "GALNT3: polypeptide N-acetylgalactosaminyltransferase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GALNT3
                term:
                  id: UniProtKB:Q14435
                  label: Polypeptide N-acetylgalactosaminyltransferase 3
            function:
              preferred_term: polypeptide N-acetylgalactosaminyltransferase activity
              term:
                id: GO:0004653
                label: polypeptide N-acetylgalactosaminyltransferase activity
              substrates:
                - preferred_term: UDP-N-acetyl-alpha-D-galactosamine
                - preferred_term: FGF23 Thr178 (within the R176HTR179 convertase site)
              products:
                - preferred_term: O-GalNAc-Thr178 FGF23
                - preferred_term: UDP
              evidence:
                - source_id: PMID:16638743
                  statement: Secretion of intact FGF23 requires O-glycosylation by GALNT3.
                - source_id: Reactome:R-HSA-8851619
                  statement: GALNT3 transfers GalNAc to FGF23 (human Reactome reaction).
            processes:
              - preferred_term: protein O-linked glycosylation via N-acetylgalactosamine
                term:
                  id: GO:0016266
                  label: protein O-linked glycosylation via N-acetylgalactosamine
            locations:
              - preferred_term: Golgi membrane
                term:
                  id: GO:0000139
                  label: Golgi membrane
            role_description: >-
              Golgi-resident GalNAc-transferase that glycosylates FGF23 at Thr178,
              protecting the R176XXR179 site from furin-type cleavage so that intact,
              bioactive FGF23 is secreted. Loss of function causes hyperphosphatemic
              familial tumoral calcinosis with low intact FGF23.
    - order: 2
      role: circulating phosphaturic hormone
      node:
        id: fgf23_hormone_step
        label: Intact FGF23 acting as an endocrine hormone
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: fgf23_activity
            label: "FGF23: phosphaturic hormone"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FGF23
                term:
                  id: UniProtKB:Q9GZV9
                  label: Fibroblast growth factor 23
            function:
              preferred_term: hormone activity
              term:
                id: GO:0005179
                label: hormone activity
              evidence:
                - source_id: PMID:17086194
                  statement: FGF23 acts as a hormone that derives from bone and regulates kidney functions.
            processes:
              - preferred_term: negative regulation of sodium-dependent phosphate transport
                term:
                  id: GO:2000119
                  label: negative regulation of sodium-dependent phosphate transport
              - preferred_term: negative regulation of vitamin D biosynthetic process
                term:
                  id: GO:0010957
                  label: negative regulation of vitamin D biosynthetic process
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Bone-derived secreted hormone that binds the Klotho-FGFR1c complex on
              target cells. Its activity is set by the balance between GALNT3
              O-glycosylation (protective) and FAM20C phosphorylation plus furin-type
              cleavage (inactivating) at the R176XXR179 site.
    - order: 3
      role: Klotho-dependent FGF23 receptor complex on renal tubular (and parathyroid) cells
      node:
        id: fgf23_receptor_step
        label: alpha-Klotho-FGFR1c FGF23 receptor complex
        module_type: SIGNALING_PATHWAY
        annotons:
          - id: klotho_activity
            label: "alpha-Klotho: obligate FGF23 co-receptor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: KL
                term:
                  id: UniProtKB:Q9UEF7
                  label: Klotho
            function:
              preferred_term: coreceptor activity
              term:
                id: GO:0015026
                label: coreceptor activity
              evidence:
                - source_id: PMID:29342138
                  statement: alpha-Klotho is a non-enzymatic scaffold tethering FGF23 to FGFR1c.
            processes:
              - preferred_term: fibroblast growth factor receptor signaling pathway
                term:
                  id: GO:0008543
                  label: fibroblast growth factor receptor signaling pathway
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Transmembrane co-receptor whose expression defines the FGF23 target
              tissues (kidney tubule, parathyroid); confers high-affinity FGF23
              binding on FGFR1c. Loss of function causes hyperphosphatemic tumoral
              calcinosis with high FGF23 (end-organ resistance).
          - id: fgfr1_activity
            label: "FGFR1 (IIIc isoform): signalling receptor tyrosine kinase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FGFR1
                term:
                  id: UniProtKB:P11362
                  label: Fibroblast growth factor receptor 1
            function:
              preferred_term: fibroblast growth factor receptor activity
              term:
                id: GO:0005007
                label: fibroblast growth factor receptor activity
              evidence:
                - source_id: PMID:17086194
                  statement: Klotho and FGFR1(IIIc) together reconstitute the FGF23 receptor.
            processes:
              - preferred_term: fibroblast growth factor receptor signaling pathway
                term:
                  id: GO:0008543
                  label: fibroblast growth factor receptor signaling pathway
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Principal FGF23 signalling receptor (FGFR3c and FGFR4 contribute less);
              Klotho-bound FGFR1c activates FRS2-ERK1/2 signalling that reduces
              NaPi-2a/NaPi-2c and represses CYP27B1. General FGFR signalling is
              modelled in the fgfr_signaling module.
    - order: 4
      role: renal vitamin D activation step repressed by FGF23 signalling
      node:
        id: calcitriol_synthesis_step
        label: CYP27B1 1-alpha-hydroxylation of calcidiol to calcitriol
        module_type: REACTION
        annotons:
          - id: cyp27b1_activity
            label: "CYP27B1: 25-hydroxyvitamin D 1-alpha-hydroxylase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CYP27B1
                term:
                  id: UniProtKB:O15528
                  label: 25-hydroxyvitamin D-1 alpha hydroxylase, mitochondrial
            function:
              preferred_term: calcidiol 1-monooxygenase activity
              term:
                id: GO:0004498
                label: calcidiol 1-monooxygenase activity
              substrates:
                - preferred_term: calcidiol (25-hydroxyvitamin D3)
              products:
                - preferred_term: calcitriol (1-alpha,25-dihydroxyvitamin D3)
              evidence:
                - source_id: PMID:15040831
                  statement: FGF23 reduces renal 25-hydroxyvitamin D-1alpha-hydroxylase mRNA.
            processes:
              - preferred_term: vitamin D3 biosynthetic process
                term:
                  id: GO:1901755
                  label: vitamin D3 biosynthetic process
            locations:
              - preferred_term: mitochondrial inner membrane
                term:
                  id: GO:0005743
                  label: mitochondrial inner membrane
            role_description: >-
              Proximal-tubule mitochondrial P450 that produces calcitriol; its
              transcription is suppressed by FGF23-Klotho-FGFR signalling, closing
              the feedback loop in which calcitriol induces FGF23 in bone.
  connections:
    - source: fgf23_glycosylation_step
      target: fgf23_hormone_step
      connection_type: POSITIVELY_REGULATES
      description: >-
        GALNT3 O-glycosylation of Thr178 protects FGF23 from furin-type cleavage,
        allowing secretion of intact, active hormone.
    - source: fgf23_hormone_step
      target: fgf23_receptor_step
      connection_type: POSITIVELY_REGULATES
      description: >-
        Intact FGF23 binds and activates the alpha-Klotho-FGFR1c receptor complex.
    - source: fgf23_receptor_step
      target: calcitriol_synthesis_step
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Klotho-FGFR1c signalling represses renal CYP27B1 expression, lowering
        calcitriol production.
  notes: >-
    Scope is the bone-kidney endocrine arm; parathyroid suppression of PTH secretion
    by FGF23 is noted in the FGF23 review but not modelled as a part. Parts are
    restricted to genes with ai-gene-review reviews (FGF23, GALNT3, KL, FGFR1 in
    draft, CYP27B1). Steps not yet modelled because the human genes have no review:
    FAM20C phosphorylation of FGF23 Ser180 (opposes GALNT3 glycosylation), furin-type
    proprotein-convertase cleavage at R176XXR179 (inactivation), the proximal-tubule
    sodium-phosphate cotransporters SLC34A1 (NaPi-2a) and SLC34A3 (NaPi-2c) whose
    abundance FGF23 reduces, and CYP24A1 (24-hydroxylase) which FGF23 induces. GO has
    no term for regulation of vitamin D catabolism (see the FGF23 review's suggested
    questions). Osteocyte regulators of FGF23 expression (DMP1, PHEX, ENPP1) are
    upstream regulatory context; DMP1 is reviewed but its mechanism of restraining
    FGF23 is undefined, so it is not modelled as a part. Generic FGF-FGFR signalling,
    including the endocrine FGF ligand annoton, is in the fgfr_signaling module; this
    module is the hormone-specific physiological axis. Family-level PANTHER ids are
    deliberately omitted; participants are concrete human gene products.
