id: MODULE:rna_polymerase_ii_elongation_and_termination
title: Human RNA polymerase II elongation and termination — DSIF/NELF promoter-proximal pausing, P-TEFb and super elongation complex pause release, PAF1C, SPT6, FACT and TFIIS in productive elongation, and XRN2 torpedo termination
description: >-
  After initiation, human RNA polymerase II (Pol II) transcribes some 20 to 60
  nucleotides and then pauses in the promoter-proximal region. The pause is
  stabilised by DSIF (SUPT4H1 and SUPT5H) and by the four-subunit negative
  elongation factor NELF (NELFA, NELFB, NELFCD, NELFE), which binds the polymerase
  funnel, restrains the mobile modules needed for pause release and excludes TFIIS.
  Release into productive elongation requires the kinase P-TEFb, CDK9 paired with
  cyclin T1 or cyclin T2, which phosphorylates the Pol II C-terminal domain and its
  linker, NELF and SUPT5H; NELF then leaves and DSIF becomes a positive elongation
  factor travelling with the polymerase. P-TEFb is delivered to many genes within the
  super elongation complex (SEC), in which an AF4/FMR2 scaffold (AFF4 or AFF1) binds
  P-TEFb, an ELL elongation factor with its EAF partner, and the YEATS protein ENL or
  AF9. In the activated elongation complex the PAF1 complex (PAF1, CTR9, LEO1, CDC73,
  RTF1, SKIC8) displaces NELF from the polymerase funnel, SPT6 binds the
  phosphorylated CTD linker, and the histone chaperone FACT (SUPT16H and SSRP1)
  removes and redeposits an H2A-H2B dimer so that Pol II can pass through
  nucleosomes. TFIIS (TCEA1) rescues backtracked polymerases by stimulating
  cleavage of the extruded transcript in the Pol II active site. At the end of
  protein-coding genes, cleavage of the nascent RNA at the poly(A) site by CPSF73
  leaves an uncapped 5' end on the downstream RNA that is still attached to the
  polymerase; the nuclear 5'-3' exoribonuclease XRN2 degrades it co-transcriptionally
  and, on catching the polymerase, promotes its release from the template (the
  torpedo model).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000127
    title: RNA polymerase II transcription pathway
    statement: >-
      The module covers the elongation and termination steps of the RGD RNA
      polymerase II transcription pathway. The diagram and description draw DSIF with
      the NELF complex, P-TEFb phosphorylating the CTD, DSIF and NELF, the super
      elongation complex delivering P-TEFb, the Paf1 and FACT complexes promoting
      transcription through nucleosomes, TFIIS rescuing arrested Pol II, and Xrn2
      degrading the downstream cleavage product in the torpedo model. Derived
      through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000127.yaml) following the
      split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md.
  - source_id: PW:0001331
    title: RNA polymerase II transcription elongation pathway
    statement: >-
      RGD child pathway of PW:0000127 (label verified in .cache/rgd_pw/pw.obo). RGD
      annotates 35 human genes to it; the pausing, pause-release and elongation
      parts of this module model 27 of them (reasons for the other eight in notes).
  - source_id: PW:0001332
    title: RNA polymerase II transcription termination pathway
    statement: >-
      RGD child pathway of PW:0000127 (label verified in .cache/rgd_pw/pw.obo). Of
      its 18 human genes, XRN2 is modelled here; the cleavage and polyadenylation
      factors are in the sibling module pre_mrna_3prime_cleavage_polyadenylation,
      and DXO is excluded (notes).
  - source_id: GO:0006368
    title: transcription elongation by RNA polymerase II
    statement: >-
      The GO process cross-referenced by the PW:0001331 definition; it is the
      module's process concept. PW:0000127 itself maps to the broader GO:0006366,
      which is the process of the whole split and not of this module.
  - source_id: GO:0006369
    title: termination of RNA polymerase II transcription
    statement: >-
      The GO process for the termination part. The PW:0001332 definition
      cross-references GO:0006386, which is the Pol III termination process
      (termination of RNA polymerase III transcription), not Pol II; see
      notes.
  - source_id: PMID:30135578
    title: Structure of activated transcription complex Pol II-DSIF-PAF-SPT6.
    statement: Pause release and elongation activation require P-TEFb kinase activity, the PAF1 complex and SPT6; PAF displaces NELF.
    supporting_text: Here we show that formation of an activated Pol II elongation complex in vitro requires the kinase function of the positive transcription elongation factor b (P-TEFb) and the elongation factors PAF1 complex (PAF) and SPT6.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000127 (RNA polymerase II
  transcription pathway; seed tier related_module_only, flagged broad) as item 3 of the
  Pol II split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md. The
  sibling modules of the split are rna_polymerase_ii_core_and_initiation (the 12-subunit
  enzyme, the general transcription factors including TFIIF and TFIIH), mediator_complex,
  pre_mrna_capping and pre_mrna_3prime_cleavage_polyadenylation; none of their content
  is repeated here. PW ids and labels were checked in .cache/rgd_pw/pw.obo; gene lists
  per child are from .cache/rgd_pw/homo_genes_pw. RGD annotates 35 human genes to the
  elongation child PW:0001331: AFF1 AFF4 CCNK CCNT1 CCNT2 CDC73 CDK9 CTR9 EAF1 EAF2 ELL
  ELL2 ELL3 GTF2F1 GTF2F2 LEO1 MLLT1 MLLT3 NCBP1 NCBP2 NELFA NELFB NELFCD NELFE PAF1
  RNGTT RTF1 SKIC8 SSRP1 SUPT16H SUPT4H1 SUPT5H TCEA1 TCEA2 TCEA3. Twenty-seven are
  modelled. Excluded: GTF2F1 and GTF2F2 (TFIIF, which travels with early elongating Pol
  II but is a general initiation factor modelled in rna_polymerase_ii_core_and_initiation);
  RNGTT (capping enzyme, pre_mrna_capping); NCBP1 and NCBP2 (nuclear cap-binding complex,
  which RGD draws stimulating elongation but whose work is cap binding for RNA processing
  and export, not a step of elongation); CCNK (RGD's description pairs CDK9 with cyclin K, as early reports did, but
  human cyclin K is now known chiefly as the partner of CDK12 and CDK13, PMID:22012619;
  CDK12 Ser2 phosphorylation in gene bodies is named, not modelled); TCEA2 and TCEA3
  (TFIIS paralogs without experimental human GOA rows). RGD annotates 18 human genes to
  the termination child PW:0001332: CLP1 CPSF1-4 CPSF6 CPSF7 CSTF1 CSTF2 CSTF2T CSTF3
  DXO FIP1L1 NUDT21 PCF11 SYMPK WDR33 XRN2. XRN2 is modelled; the others except DXO are
  cleavage and polyadenylation factors in pre_mrna_3prime_cleavage_polyadenylation,
  including the CPSF73 (CPSF3) cleavage that XRN2 depends on. DXO is excluded: RGD
  follows the yeast Rat1-Rai1 torpedo partnership, but human DXO's experimental function
  is decapping and deNADding of RNA 5' ends, and no human study places it in
  termination. One gene outside RGD's lists is added, SUPT6H, because human SPT6 is
  required with PAF1C for the activated elongation complex (PMID:30135578) and the split
  plan names it.

  Molecular functions are from each protein's experimental human GOA rows (QuickGO,
  November 2026) or, for AFF1, AFF4 and CDC73, the gene reviews in this repository.
  Curator-authored functions without an experimental GOA row on any subunit: PAF1
  complex and SUPT6H transcription elongation factor activity (from the reconstituted
  assays of PMID:20178742 and PMID:15060154), and the AFF4 and AFF1
  protein-macromolecule adaptor activity, which is a core function in their gene reviews.
  Complex-level functions with no unit function: DSIF and NELF RNA polymerase inhibitor
  activity (every subunit carries a contributes_to IDA row), and FACT H2A-H2B histone
  complex chaperone activity (the GOA row sits on SUPT16H alone but the assay used the
  heterodimer, which needs both subunits). Paralog alternatives (cyclin T1 or T2; AFF4 or
  AFF1; ELL, ELL2 or ELL3; EAF1 or EAF2; ENL or AF9) are listed as units of one complex
  annoton with their alternative roles stated, rather than as separate variant
  complexes. UniProt accessions and recommended names are from UniProt REST (November
  2026).

  Boundary decisions. (1) The module covers the factors that act on Pol II after
  initiation; the polymerase itself is in rna_polymerase_ii_core_and_initiation and is
  not repeated. This is also where the Pol I and Pol III modules
  (rna_polymerase_i_transcription, rna_polymerase_iii_transcription) send FACT, the PAF1
  complex and DSIF, which they exclude as general elongation factors shared with Pol II;
  those modules can now reference the nodes here (fact_complex, paf1_complex,
  dsif_complex) if they gain an elongation-accessory part. (2) DSIF is modelled once, in
  the pausing part, with its later positive role in the activated complex stated in its
  role description rather than as a second annoton. (3) Pause release uses the GO
  process positive regulation of transcription elongation by RNA polymerase II, which is
  the process of P-TEFb in all three human GO-CAMs and of AFF1 and AFF4 in their reviews.
  (4) Regulation of P-TEFb availability is out of scope: the 7SK snRNP (HEXIM1, HEXIM2,
  LARP7, MEPCE) sequesters inactive P-TEFb, BRD4 recruits it, the PNUTS-PP1 phosphatase
  and the CDK11 checkpoint (both in the GO-CAMs linked here) and PARP1 modulate pausing,
  and the CTD phosphatases RPAP2, SSU72, CTDSP1 and CTDP1 that RGD lists for the CTD
  cycle are recycling and regulation. They are named, not modelled. (5) Histone
  modification coupled to elongation (PAF1C-dependent H2B ubiquitylation by RNF20 and
  RNF40, H3K36 methylation by SETD2 with SPT6 and IWS1, H3K4 methylation) belongs to the
  histone-modification tranche, as do SAGA and ATAC; only the elongation activities of
  PAF1C, SPT6 and FACT are modelled. (6) Other elongation complexes not drawn by RGD
  are not added: elongin (ELOA, ELOB, ELOC) and the little elongation complex (ICE1,
  ICE2, ELL) for snRNA genes, which the Drosophila analogue
  dmel_rnapii_elongation_complexes includes. (7) Termination is modelled by the torpedo
  exonuclease only. The allosteric model (PCF11 and the CPA machinery changing the
  elongation complex) and the Integrator-dependent termination of snRNA and paused
  promoter-proximal transcripts are named, not modelled; XRN2 activators CDKN2AIP and
  CDKN2AIPNL and the R-loop helicase senataxin (SETX) are cited in the XRN2 annoton and
  not modelled because no human study tests the former in termination and the latter
  works on the DNA-RNA hybrid rather than on the polymerase. (8) Substrate versus
  participant: the CTD, the pausing factors and the downstream RNA are inputs of P-TEFb
  and XRN2, not participants; the GO-CAM edges have input are left to the models.

  Ontology. The PW:0001332 definition cross-references GO:0006386 (termination of RNA
  polymerase III transcription) for a Pol II pathway; GO:0006369 is the matching term.
  This is a probable RGD cross-reference error, recorded here for the coordinator
  rather than as a GO request. No GO term request is needed: every activity has a term.
  XRN2 carries an IDA row for transcription termination site sequence-specific DNA
  binding (PMID:21700224), a paper in which XRN2 is assayed by recruitment downstream of
  the poly(A) signal; an exoribonuclease with no reported DNA-binding assay makes this a
  candidate for a GOA query, and the term is not used here.

  GO-CAM links. Human models in gocams/index.tsv containing members:
  gomodel:6796b94c00002252 (pause release by PNUTS-PP1; DSIF and NELF complexes and
  CDK9), gomodel:627d95ee00001242 (P-TEFb, NELFE and PARP1; CDK9, CCNT1, NELFE; the seed's
  best_gocam), gomodel:68b0f0d000004152 (CDK11 pause checkpoint; CDK9, NELFE) and
  gomodel:69ea894900000181 (PARP1 and AFF1). The matching activities are linked on the
  annotons. Not linked: CDK9's second activity in two models (cyclin-dependent protein
  serine/threonine kinase activity, the same kinase under a parent term), NELFE chromatin
  binding (regulatory edge), and CDK9 in gomodel:617b481400000672 (KAT5 chromatin
  localization), which is not elongation. No model contains SUPT4H1 or SUPT5H as single
  proteins, PAF1C subunits, SUPT6H, FACT, the ELLs, EAFs, ENL, AF9, TCEA1 or XRN2.
  PANTHER family ids and PTNs are deliberately not asserted.
module:
  id: rna_polymerase_ii_elongation_and_termination
  label: Human RNA polymerase II elongation and termination
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: transcription elongation by RNA polymerase II
      term:
        id: GO:0006368
        label: transcription elongation by RNA polymerase II
      description: The GO process cross-referenced by PW:0001331.
    - preferred_term: termination of RNA polymerase II transcription
      term:
        id: GO:0006369
        label: termination of RNA polymerase II transcription
      description: The Pol II termination process; the module models its poly(A)-coupled torpedo branch.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: nucleoplasm
        term:
          id: GO:0005654
          label: nucleoplasm
  parts:
    - order: 1
      role: promoter-proximal pausing
      node:
        id: promoter_proximal_pausing
        label: DSIF and NELF hold Pol II in the promoter-proximal pause
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Shortly after initiation the polymerase pauses with a tilted DNA-RNA hybrid
          that impairs NTP binding. DSIF clamps the upstream DNA and exiting RNA, and
          NELF binds the polymerase funnel and trigger loop and blocks TFIIS, so the
          paused complex is stable until P-TEFb acts.
        concepts:
          - preferred_term: transcription pausing by RNA polymerase II
            term:
              id: GO:0160239
              label: transcription pausing by RNA polymerase II
        annotons:
          - id: dsif_complex
            label: DSIF (SUPT4H1-SUPT5H) binds paused Pol II and, with NELF, inhibits elongation
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: DSIF (DRB sensitivity-inducing factor)
                term:
                  id: GO:0032044
                  label: DSIF complex
                active_units:
                  - id: dsif_supt5h
                    label: SUPT5H
                    role: SPT5 (DSIF p160), the large NusG-related subunit that binds Pol II, the upstream DNA and the exiting RNA; P-TEFb substrate.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SUPT5H
                        term:
                          id: UniProtKB:O00267
                          label: Transcription elongation factor SPT5
                  - id: dsif_supt4h1
                    label: SUPT4H1
                    role: SPT4 (DSIF p14), the small zinc-finger partner of SPT5.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: SUPT4H1
                        term:
                          id: UniProtKB:P63272
                          label: Transcription elongation factor SPT4
            function:
              preferred_term: RNA polymerase inhibitor activity
              term:
                id: GO:0140870
                label: RNA polymerase inhibitor activity
            processes:
              - preferred_term: transcription pausing by RNA polymerase II
                term:
                  id: GO:0160239
                  label: transcription pausing by RNA polymerase II
            locations:
              - preferred_term: nucleoplasm
                term:
                  id: GO:0005654
                  label: nucleoplasm
            role_description: >-
              Both subunits carry contributes_to RNA polymerase inhibitor activity by IDA
              (PMID:9450929), so the function is on the complex and the units have none
              of their own. The same paper shows DSIF also stimulates elongation rate at
              limiting NTPs; after P-TEFb phosphorylation of SUPT5H, DSIF stays on the
              polymerase as a positive factor in the activated elongation complex
              (PMID:30135578). That second role is recorded here rather than as a
              duplicate annoton in the elongation part.
            evidence:
              - source_id: PMID:9450929
                statement: DSIF, purified from HeLa nuclear extract, is the human SPT4-SPT5 complex and causes Pol II pausing with DRB.
                supporting_text: Recombinant Supt4h protein, the human homolog of yeast Spt4, is functionally equivalent to DSIF p14, indicating that DSIF is composed of the human homologs of Spt4 and Spt5.
              - source_id: PMID:9450929
                statement: DSIF also stimulates elongation rate under limiting NTPs.
                supporting_text: In addition to its negative role in elongation, DSIF is able to stimulate the rate of elongation by RNA Pol II in a reaction containing limiting concentrations of ribonucleoside triphosphates.
            gocam_associations:
              - model: gomodel:6796b94c00002252
                activity: gomodel:6796b94c00002252/6796b94c00002262
                title: DSIF complex RNA polymerase inhibitor activity (GO:0140870), Transcription-pause release by the PNUTS-PP1 complex (Human)
          - id: nelf_complex
            label: NELF (NELFA-NELFB-NELFCD-NELFE) binds the Pol II funnel and represses elongation with DSIF
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: negative elongation factor (NELF)
                term:
                  id: GO:0032021
                  label: NELF complex
                active_units:
                  - id: nelf_a
                    label: NELFA
                    role: NELF-A, forms the NELF-AC lobe with NELF-C/D and contacts the polymerase funnel and trigger loop.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NELFA
                        term:
                          id: UniProtKB:Q9H3P2
                          label: Negative elongation factor A
                  - id: nelf_b
                    label: NELFB
                    role: NELF-B, forms the NELF-BE lobe with NELF-E.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NELFB
                        term:
                          id: UniProtKB:Q8WX92
                          label: Negative elongation factor B
                  - id: nelf_cd
                    label: NELFCD
                    role: NELF-C/D (TH1-like), partner of NELF-A.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NELFCD
                        term:
                          id: UniProtKB:Q8IXH7
                          label: Negative elongation factor C/D
                  - id: nelf_e
                    label: NELFE
                    role: NELF-E (RD), the RRM subunit that binds the nascent RNA; P-TEFb and PARP1 target.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: NELFE
                        term:
                          id: UniProtKB:P18615
                          label: Negative elongation factor E
                    function:
                      preferred_term: mRNA binding
                      term:
                        id: GO:0003729
                        label: mRNA binding
            function:
              preferred_term: RNA polymerase inhibitor activity
              term:
                id: GO:0140870
                label: RNA polymerase inhibitor activity
            processes:
              - preferred_term: transcription pausing by RNA polymerase II
                term:
                  id: GO:0160239
                  label: transcription pausing by RNA polymerase II
            locations:
              - preferred_term: nucleoplasm
                term:
                  id: GO:0005654
                  label: nucleoplasm
            role_description: >-
              All four subunits carry contributes_to RNA polymerase inhibitor activity by
              IDA (PMID:10199401), so the function is on the complex. NELFE alone has a
              unit function, mRNA binding (IDA, PMID:27256882), the activity the two
              NELFE GO-CAM activities use; its RNA binding is needed to establish the
              pause. NELFA's IDA molecular adaptor activity row (PMID:30135580) is not
              used because it restates its structural role in the complex.
            evidence:
              - source_id: PMID:10199401
                statement: NELF was purified from HeLa nuclear extract as a multisubunit factor that represses Pol II elongation together with DSIF, reversed by P-TEFb.
                supporting_text: This repression is reversed by P-TEFb-dependent phosphorylation of the pol II C-terminal domain.
              - source_id: PMID:30135580
                statement: In the paused complex NELF binds the polymerase funnel and restrains the mobility needed for pause release, and excludes TFIIS.
                supporting_text: NELF binds the polymerase funnel, bridges two mobile polymerase modules, and contacts the trigger loop, thereby restraining Pol II mobility that is required for pause release. NELF prevents binding of the anti-pausing transcription elongation factor IIS (TFIIS).
              - source_id: PMID:27256882
                statement: NELF-E RNA binding is needed to establish paused Pol II.
                supporting_text: we found that ADP-ribosylation of NELF-E ablates its ability to bind RNA, a function of NELF-E necessary for the establishment paused Pol II
            gocam_associations:
              - model: gomodel:6796b94c00002252
                activity: gomodel:6796b94c00002252/6796b94c00002273
                title: NELF complex RNA polymerase inhibitor activity (GO:0140870), Transcription-pause release by the PNUTS-PP1 complex (Human)
              - model: gomodel:627d95ee00001242
                activity: gomodel:627d95ee00001242/627d95ee00001298
                title: NELFE mRNA binding (GO:0003729), Regulation of transcription elongation by the P-TEFb complex, NELFE and PARP1 (Human)
              - model: gomodel:68b0f0d000004152
                activity: gomodel:68b0f0d000004152/68b0f0d000004198
                title: NELFE mRNA binding (GO:0003729), CDK11 regulates a RNA polymerase II pause-checkpoint upstream of CDK9 (Human)
        connections:
          - source: dsif_complex
            target: nelf_complex
            connection_type: PRECEDES
            description: NELF binds Pol II-DSIF; DSIF is required for NELF repression.
    - order: 2
      role: pause release
      node:
        id: pause_release
        label: P-TEFb, alone or within the super elongation complex, phosphorylates paused Pol II, DSIF and NELF to release the pause
        module_type: BIOLOGICAL_PROCESS
        description: >-
          CDK9 with cyclin T1 or T2 phosphorylates the Pol II CTD (Ser2) and the
          CTD linker, NELF and SUPT5H. NELF dissociates, DSIF becomes a positive
          factor, and PAF1C and SPT6 bind. The super elongation complex delivers
          P-TEFb together with an ELL elongation factor.
        concepts:
          - preferred_term: positive regulation of transcription elongation by RNA polymerase II
            term:
              id: GO:0032968
              label: positive regulation of transcription elongation by RNA polymerase II
        annotons:
          - id: p_tefb_complex
            label: P-TEFb (CDK9 with cyclin T1 or cyclin T2) phosphorylates the Pol II CTD and the pausing factors
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: P-TEFb (positive transcription elongation factor b)
                term:
                  id: GO:0070691
                  label: P-TEFb complex
                active_units:
                  - id: p_tefb_cdk9
                    label: CDK9
                    role: Catalytic subunit, the CTD Ser2 and linker kinase.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CDK9
                        term:
                          id: UniProtKB:P50750
                          label: Cyclin-dependent kinase 9
                    function:
                      preferred_term: RNA polymerase II CTD heptapeptide repeat kinase activity
                      term:
                        id: GO:0008353
                        label: RNA polymerase II CTD heptapeptide repeat kinase activity
                  - id: p_tefb_ccnt1
                    label: CCNT1
                    role: Cyclin T1, the major activating cyclin; mutually exclusive with cyclin T2. Its histidine-rich domain binds the CTD.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CCNT1
                        term:
                          id: UniProtKB:O60563
                          label: Cyclin-T1
                    function:
                      preferred_term: cyclin-dependent protein serine/threonine kinase activator activity
                      term:
                        id: GO:0061575
                        label: cyclin-dependent protein serine/threonine kinase activator activity
                  - id: p_tefb_ccnt2
                    label: CCNT2
                    role: Cyclin T2 (T2a and T2b splice forms), the alternative activating cyclin of CDK9.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CCNT2
                        term:
                          id: UniProtKB:O60583
                          label: Cyclin-T2
            function:
              preferred_term: RNA polymerase II CTD heptapeptide repeat kinase activity
              term:
                id: GO:0008353
                label: RNA polymerase II CTD heptapeptide repeat kinase activity
            processes:
              - preferred_term: positive regulation of transcription elongation by RNA polymerase II
                term:
                  id: GO:0032968
                  label: positive regulation of transcription elongation by RNA polymerase II
            locations:
              - preferred_term: nucleoplasm
                term:
                  id: GO:0005654
                  label: nucleoplasm
            role_description: >-
              CDK9 carries RNA polymerase II CTD heptapeptide repeat kinase activity by EXP
              and IDA (among them PMID:9499409 and PMID:29849146), the function used in
              all three human GO-CAMs that contain it. Cyclin T1 carries IDA
              cyclin-dependent protein serine/threonine kinase activator activity
              (PMID:29849146). Cyclin T2 has no experimental molecular function in human
              GOA beyond binding rows and is a unit without a function; PMID:9499409
              shows that either cyclin activates CDK9. The cyclins are alternatives,
              listed as units of one complex annoton rather than as two complexes. The
              7SK snRNP (HEXIM1, LARP7, MEPCE) that sequesters inactive P-TEFb is
              regulation and is not modelled (notes).
            evidence:
              - source_id: PMID:9499409
                statement: Human CDK9 pairs with cyclin T1 or cyclin T2, mutually exclusively, and either cyclin activates it.
                supporting_text: cyclin T1 and T2 were associated with CDK9 in a mutually exclusive manner and that almost all CDK9 was associated with either cyclin T1 or T2
              - source_id: PMID:9499409
                statement: Recombinant CDK9-cyclin T complexes have DRB-sensitive kinase activity and function in elongation in vitro.
                supporting_text: Recombinant CDK9/cyclin T1, CDK9/cyclin T2a, and CDK9/cyclin T2b produced in Sf9 cells possessed DRB-sensitive kinase activity and functioned in transcription elongation in vitro.
              - source_id: PMID:29849146
                statement: The cyclin T1 histidine-rich domain promotes CTD hyperphosphorylation by CDK9.
                supporting_text: Here we identify a histidine-rich domain in cyclin T1 that promotes the hyperphosphorylation of the CTD and stimulation of transcription by CDK9.
              - source_id: PMID:30135578
