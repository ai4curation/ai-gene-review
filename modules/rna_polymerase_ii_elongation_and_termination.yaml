    - order: 4
      role: termination
      node:
        id: torpedo_termination
        label: XRN2 degrades the downstream RNA left by poly(A)-site cleavage and terminates Pol II (torpedo)
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Cleavage at the poly(A) site by the CPSF73 endonuclease (sibling module
          pre_mrna_3prime_cleavage_polyadenylation) leaves an uncapped 5' end on the
          RNA still attached to the polymerase. XRN2 degrades it co-transcriptionally
          and promotes Pol II release on catching up.
        concepts:
          - preferred_term: termination of RNA polymerase II transcription, poly(A)-coupled
            term:
              id: GO:0030846
              label: termination of RNA polymerase II transcription, poly(A)-coupled
        annotons:
          - id: xrn2_torpedo
            label: XRN2 5'-3' exoribonuclease degrades the polymerase-attached downstream cleavage product
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: XRN2
                term:
                  id: UniProtKB:Q9H0D6
                  label: 5'-3' exoribonuclease 2
            function:
              preferred_term: 5'-3' RNA exonuclease activity
              term:
                id: GO:0004534
                label: 5'-3' RNA exonuclease activity
            processes:
              - preferred_term: termination of RNA polymerase II transcription, poly(A)-coupled
                term:
                  id: GO:0030846
                  label: termination of RNA polymerase II transcription, poly(A)-coupled
            locations:
              - preferred_term: nucleoplasm
                term:
                  id: GO:0005654
                  label: nucleoplasm
            role_description: >-
              XRN2 carries 5'-3' RNA exonuclease activity by EXP and the parent 5'-3'
              exonuclease activity by IDA (PMID:15565158). Its experimental process row
              is the parent termination of RNA polymerase II transcription (IMP,
              PMID:15565158); the poly(A)-coupled child is used because rapid XRN2
              depletion shows that its termination role on protein-coding genes needs
              prior CPSF73 cleavage and does not extend to histone or snRNA genes
              (PMID:29432121). The XTBD-containing partners CDKN2AIP and CDKN2AIPNL
              control XRN2 activity and stability (PMID:32011671), but no human study
              has tested them in termination, so they are not modelled; nor is
              senataxin (SETX), whose R-loop resolution downstream of the poly(A) signal
              is needed for XRN2 recruitment (PMID:21700224).
            evidence:
              - source_id: PMID:15565158
                statement: XRN2 degradation of the downstream cleavage product terminates human Pol II transcription.
                supporting_text: Degradation of the downstream cleavage product by Xrn2 results in transcriptional termination, as envisaged in the torpedo model.
              - source_id: PMID:29432121
                statement: Conditional XRN2 depletion shows a general role in co-transcriptional degradation of 3' flanking RNA and termination.
                supporting_text: The ability to rapidly control Xrn2 reveals a clear and general role for it in cotranscriptional degradation of 3' flanking region RNA and transcriptional termination.
              - source_id: PMID:29432121
                statement: The XRN2 effect requires prior poly(A)-site cleavage.
                supporting_text: An Xrn2 effect on termination requires prior RNA cleavage
              - source_id: PMID:32011671
                statement: XRN2 activity and stability are controlled by XTBD partners including CDKN2AIP and CDKN2AIPNL.
                supporting_text: The activity and stability of XRN2 are controlled by its binding partners, PAXT-1, CDKN2AIP and CDKN2AIPNL.
              - source_id: PMID:21700224
                statement: Senataxin resolves R-loops downstream of the poly(A) signal that otherwise block XRN2 recruitment.
                supporting_text: Upon senataxin depletion, R-loops are stabilized downstream of the poly(A) signal, preventing Xrn2 recruitment, nascent RNA degradation, and efficient termination.
  connections:
    - source: promoter_proximal_pausing
      target: pause_release
      connection_type: PRECEDES
      description: P-TEFb acts on the DSIF-NELF-paused polymerase.
    - source: p_tefb_complex
      target: nelf_complex
      connection_type: NEGATIVELY_REGULATES
      description: P-TEFb phosphorylation of NELF and the CTD reverses NELF-DSIF repression and NELF leaves the polymerase.
    - source: pause_release
      target: productive_elongation
      connection_type: PRECEDES
      description: Phosphorylation of the CTD linker and DSIF allows PAF1C and SPT6 to form the activated elongation complex.
    - source: productive_elongation
      target: torpedo_termination
      connection_type: PRECEDES
      description: Elongating Pol II passes the poly(A) signal; after CPSF73 cleavage XRN2 pursues it.
