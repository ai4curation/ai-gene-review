                  label: Exonuclease 1
            processes:
            - preferred_term: double-strand break repair via alternative nonhomologous end joining
              term:
                id: GO:0097681
                label: double-strand break repair via alternative nonhomologous end joining
            locations:
            - preferred_term: chromosome, telomeric region
              term:
                id: GO:0000781
                label: chromosome, telomeric region
            role_description: The positive activity of the dephosphorylated, TRF2-docked state. NBS1 binds
              EXO1 and brings it to telomeres; the phosphomimetic form does not.
            evidence:
