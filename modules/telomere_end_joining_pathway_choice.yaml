      are treated as context. The kinase is CDK2 in both the paper and the model.'
knowledge_gaps:
- gap_statement: How TRF2 TRFH docking of dephosphorylated NBS1 represses the initial step of ATM activation
    at telomeres is not established.
  boundary: Dephosphorylated NBS1 binds TRF2 TRFH and fails to support ATM signalling; phospho-NBS1 binds
    MRE11 and supports it. Whether docking acts by sequestering MRN, by blocking an NBS1 conformation needed
    for ATM binding, or together with TRFH-mediated DNA wrapping is untested.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: Decides whether TRF2 should be modelled as a sequestering activity, an adaptor, or an
    ATM-activation inhibitor.
  resolution: Tether non-phosphorylatable NBS1 to telomeres independently of TRF2 (TRFH-binding-dead TRF2
    background) and test ATM activation and MRN end occupancy.
  provenance:
  - reference_id: PMID:28216226
    supporting_text: The TRF2TRFH domain has been shown to repress the initial step of ATM activation (Okamoto
      et al., 2013), but the mechanism of this repression is unclear.
notes: >-
  Built 2026-11-02 from Rai et al. 2017 (PMID:28216226) to model the repair
  choice that GO-CAM gomodel:65a1f4f800002884 could not express. The choice is a
  ROUTE variant set whose two variants are regulated with opposite signs by the
  CDK2 and PP1-alpha annotons and by the TRF2 docking step; the default Boolean
  rule (on when an activator is on and no inhibitor is) gives c_nhej_route = CDK2
  AND NOT (PP1 OR docking), and alt_nhej_route = docking (checked with
  ai-gene-review module-to-bnet); lig3_ligation states activation_logic because
  it needs both EXO1 resection and PARP1. Loss of TRF2 versus loss
  of POT1-TPP1 is the trigger and is described in the variants rather than
  modelled as a participant. TAXON: Mammalia is a curator judgement. The paper
  works only in human and mouse cells and frames shelterin as mammalian; TRF2,
  POT1-TPP1 and the NBS1 CDK site have not been tested as a switch in other
  vertebrates, so Vertebrata would overreach. LINKS: ATM activation by MRN is
  included by module_ref to atm_dsb_signaling#atm_activation rather than
  duplicated (that module is human-scoped; the referenced step is general). No
  eukaryotic classical-NHEJ, alt-NHEJ, POLQ or MRN module exists in modules/
  (dmel_mrn_complex is Drosophila-specific and not referenced;
  bacterial_nonhomologous_end_joining is prokaryotic Ku-LigD), so only the
  ligases, PARP1 and EXO1 are given as leaf annotons; Ku, DNA-PKcs, XRCC4, POLQ
  and ATR are omitted. PNUTS (PPP1R10), which inhibits PP1-alpha when not held
  by TRF2, and Apollo/SNM1B, which competes with NBS1 for TRF2 TRFH in S/G2, are
  described but not modelled as parts. PANTHER subfamilies were checked against
  interpro/panther/panther.obo and against each human and mouse representative's
  UniProt PANTHER cross-reference (2026-11-02). No PTNs are asserted. Much of the
  evidence uses mouse NBS1 S433 in MEFs.
