                    id: GO:0097680
                    label: double-strand break repair via classical nonhomologous end joining
                locations:
                - preferred_term: chromosome, telomeric region
                  term:
                    id: GO:0000781
                    label: chromosome, telomeric region
                role_description: Final ligation step of classical NHEJ that fuses telomeres after TRF2 loss.
                  The rest of the classical NHEJ machinery (Ku, DNA-PKcs, XRCC4) is not modelled here.
                evidence:
                - source_id: PMID:12361565
                  statement: Fusions after TRF2 inhibition are DNA ligase IV-dependent NHEJ.
                  supporting_text: We document that telomere fusions resulting from inhibition of the telomere-protective
                    factor TRF2 are generated by DNA ligase IV-dependent nonhomologous end joining (NHEJ).
          connections:
          - source: phospho_nbn_atm_activation
            target: lig4_telomere_ligation
            connection_type: POSITIVELY_REGULATES
            description: ATM signalling at the deprotected telomere promotes its classical-NHEJ ligation.
        - id: alt_nhej_route
          label: Alternative NHEJ via TRF2-bound dephospho-NBS1, EXO1, PARP1 and ligase III (telomeres lacking
            POT1-TPP1)
          module_type: BIOLOGICAL_PROCESS
          description: >-
            TRF2-bound dephosphorylated NBS1 recruits EXO1 to telomeres lacking
            POT1-TPP1 to extend 5' resection. The single-stranded ends are joined by
            the PARP1- and ligase III-dependent, Ku-repressed alternative
            (microhomology-mediated) pathway. Fusions also need ATR, which is not
