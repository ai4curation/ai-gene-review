            representative_members:
            - preferred_term: PPP1CA (human)
              term:
                id: UniProtKB:P62136
                label: Serine/threonine-protein phosphatase PP1-alpha catalytic subunit
            - preferred_term: Ppp1ca (mouse)
              term:
                id: UniProtKB:P62137
                label: Serine/threonine-protein phosphatase PP1-alpha catalytic subunit
        function:
          preferred_term: protein serine/threonine phosphatase activity
          term:
            id: GO:0004722
            label: protein serine/threonine phosphatase activity
          targets:
          - preferred_term: NBN (NBS1)
            term:
              id: UniProtKB:O60934
              label: Nibrin
        processes:
        - preferred_term: telomere maintenance in response to DNA damage
          term:
            id: GO:0043247
            label: telomere maintenance in response to DNA damage
        locations:
        - preferred_term: chromosome, telomeric region
          term:
            id: GO:0000781
            label: chromosome, telomeric region
        role_description: Removes the S432/S433 phosphate in G1, restoring NBS1 docking on TRF2. PNUTS (PPP1R10)
          inhibits PP1-alpha when it is not held by TRF2, so it acts on this step indirectly.
        evidence:
        - source_id: PMID:28216226
          statement: PP1-alpha dephosphorylates mouse NBS1 S433 and promotes NBS1-TRF2 binding.
          supporting_text: The phosphatase PP1-α de-phosphorylates mNBS1S433 to promote interaction between
            NBS1 and TRF2 (Figure 2D).
        - &pp1_fusions
          source_id: PMID:28216226
          statement: PP1-alpha dephosphorylation suppresses fusions; PNUTS acts by inhibiting PP1-alpha.
          supporting_text: De-phosphorylation of NBS1S432/3 by PP1-α inhibits fusions, while PNUTS inhibits
            PP1-α to promote fusions.
        - source_id: PMID:28216226
          statement: PNUTS acts through PP1-alpha catalysis, not directly on NBS1-TRF2.
          supporting_text: These results suggest that PNUTS does not directly inhibit NBS1-TRF2 interaction,
            but rather influence this interaction by catalytically inhibiting PP1-α.
        gocam_associations:
        - model: gomodel:65a1f4f800002884
          activity: gomodel:65a1f4f800002884/65a1f4f800002894
          title: Phosphorylation of NBN regulates DNA repair choice at telomes (Human).
          notes: 'Consistent: protein serine/threonine phosphatase activity with has_input NBN and a positive
            edge to the NBN-TRF2 docking state.'
  - order: 2
    role: TRF2 docking of dephosphorylated NBS1
    node:
      id: trf2_nbn_docking
      label: TRF2 TRFH domain docks dephosphorylated NBS1 at telomeres
      module_type: REGULATORY_STEP
      description: >-
        TRF2, bound to telomeric DNA, uses its TRFH domain as the docking hub for the
        YQLSP motif of dephosphorylated NBS1. TRF2 is the adaptor and NBS1 (with
        MRN) the client: dephosphorylated NBS1 needs TRF2 to accumulate at functional
        telomeres. Docking keeps MRN from activating ATM and fusing functional
        telomeres. Dephosphorylated NBS1 competes with Apollo/SNM1B for the same
        TRFH surface.
      annotons:
      - id: trf2_nbs1_docking
        label: TRF2 holds dephosphorylated NBS1/MRN at telomeric chromatin
        participant:
          selector_type: FAMILY
          family:
            preferred_term: TRF2 ortholog group
            term:
              id: PANTHER:PTHR46833:SF1
              label: TELOMERIC REPEAT-BINDING FACTOR 2
            representative_members:
            - preferred_term: TERF2 (human)
              term:
                id: UniProtKB:Q15554
                label: Telomeric repeat-binding factor 2
            - preferred_term: Terf2 (mouse)
              term:
                id: UniProtKB:O35144
                label: Telomeric repeat-binding factor 2
        function:
          preferred_term: chromatin-protein adaptor activity
          term:
            id: GO:0140463
            label: chromatin-protein adaptor activity
          targets:
          - preferred_term: NBN (NBS1), dephosphorylated at S432
            term:
              id: UniProtKB:O60934
              label: Nibrin
        processes:
        - preferred_term: protection from non-homologous end joining at telomere
          term:
            id: GO:0031848
            label: protection from non-homologous end joining at telomere
        locations:
        - preferred_term: chromosome, telomeric region
          term:
            id: GO:0000781
            label: chromosome, telomeric region
        role_description: TRF2 is the hub and NBS1 the client. The bound state protects functional telomeres
          and, once POT1-TPP1 is lost, is the state that feeds the alternative-NHEJ route.
        evidence:
        - source_id: PMID:28216226
          statement: Crystal structure of the TRF2 TRFH-NBS1 complex.
          supporting_text: The crystal structure of the TRF2-NBS1 complex at 3.0 Å resolution shows that the
            NBS1 429YQLSP433 motif interacts specifically with the TRF2TRFH domain.
        - source_id: PMID:28216226
          statement: Phosphomimetic NBS1 fails to accumulate at functional telomeres, so telomere residence
            of NBS1 depends on TRF2 docking.
          supporting_text: In contrast, Flag-mNBS1S433D and Flag-mNBS1S433E failed to accumulate at functional
            telomeres (Figures 2B, 2C).
        - &sequester
          source_id: PMID:28216226
          statement: Docking likely sequesters MRN from telomere ends in G1.
          supporting_text: binding of NBS1 to the TRF2TRFH domain likely also serve to sequester the MRN complex
            away from telomere ends, preventing the activation of aberrant repair (fusions) in G1.
        - source_id: PMID:28216226
          statement: The authors call TRF2 the protein docking hub.
          supporting_text: Finally, in addition to being a protein docking hub, a recent report suggests that
            TRF2 could also wrap telomeric DNA around its TRF2TRFH domain
        gocam_associations:
        - model: gomodel:65a1f4f800002884
          activity: gomodel:65a1f4f800002884/65a1f4f800002912
          title: Phosphorylation of NBN regulates DNA repair choice at telomes (Human).
          notes: The model puts chromatin-protein adaptor activity on NBN with has_input TERF2 (part_of protection
            from NHEJ at telomere). This inverts the polarity; here TRF2 carries the adaptor activity and
            NBN is the target. The model's NBN -> TERF2 "directly positively regulates" edge has no support
            and is not reproduced.
        - model: gomodel:65a1f4f800002884
          activity: gomodel:65a1f4f800002884/65a1f4f800002885
          title: Phosphorylation of NBN regulates DNA repair choice at telomes (Human).
          notes: Second NBN adaptor node (part_of alternative NHEJ). It is the same TRF2-docked dephosphorylated
            state as 65a1f4f800002912, so both map to this single annoton. Its alternative-NHEJ context is
            modelled as the positive connection from this step to alt_nhej_route.
        - model: gomodel:65a1f4f800002884
          activity: gomodel:65a1f4f800002884/65a1f4f800002904
          title: Phosphorylation of NBN regulates DNA repair choice at telomes (Human).
          notes: TERF2 double-stranded telomeric DNA binding, cited only to a background sentence. TRF2 DNA
            binding is context (it is why TRF2 sits at telomeres), not a separate step here; TRF2's role
            in this mechanism is TRFH docking.
        - model: gomodel:65a1f4f800002884
          activity: gomodel:65a1f4f800002884/65a1f4f800002921
          title: Phosphorylation of NBN regulates DNA repair choice at telomes (Human).
          notes: Exact duplicate of 65a1f4f800002904; same mapping.
  - order: 3
    role: End-joining route at a dysfunctional telomere
    node:
      id: dysfunctional_telomere_end_joining
      label: End-joining route chosen at a deprotected telomere
      module_type: BIOLOGICAL_PROCESS
      description: >-
        The step the GO-CAM could not express. Which shelterin component is lost,
        and the NBS1 state that follows, select one of two end-joining routes.
      variant_sets:
      - id: telomere_nhej_route
        label: Classical versus alternative NHEJ of deprotected telomeres
        axis: NBS1 S432/S433 phosphorylation state (with loss of TRF2 versus loss of POT1-TPP1)
        variant_kind: ROUTE
        selection: EXACTLY_ONE
        notes: >-
          The routes are different activities, not paralogous carriers of one
          activity, so ROUTE. Phospho-NBS1 (CDK2 on, PP1-alpha off) selects the
          classical route at telomeres lacking TRF2; TRF2-bound dephospho-NBS1
          (PP1-alpha on) selects the alternative route at telomeres lacking
          POT1-TPP1. EXACTLY_ONE refers to a single repair event at one
          deprotected telomere; both routes can operate in the same cell. The
          selection is encoded by the signed connections from the switch
          annotons (part 1) and the docking step (part 2) into the two variants.
        evidence:
        - *abs_choice
        - *switch
        variants:
        - id: c_nhej_route
          label: Classical NHEJ via phospho-NBS1, MRN and ATM (telomeres lacking TRF2)
          module_type: BIOLOGICAL_PROCESS
          description: >-
            Released from TRF2, phospho-NBS1 binds MRE11 at the deprotected end; MRN
            activates ATM, and the telomeres are fused by DNA ligase IV-dependent
            classical NHEJ.
          concepts:
          - preferred_term: double-strand break repair via classical nonhomologous end joining
            term:
              id: GO:0097680
              label: double-strand break repair via classical nonhomologous end joining
          evidence:
          - source_id: PMID:28216226
            statement: Phospho-NBS1 binds MRE11 at telomere ends and enables ATM activation and C-NHEJ.
            supporting_text: Phosphorylated NBS1S432 dissociates from TRF2 but binds to MRE11 at telomeric
              ends and enables ATM activation and C-NHEJ-mediated repair of telomeres lacking TRF2-RAP1.
          - source_id: PMID:28216226
            statement: Phosphomimetic NBS1 restores ATM signalling and fusions after TRF2 loss.
            supporting_text: Surprisingly, expression of mutants hNBS1S432D or hNBS1S432E restored ATM-dependent
              DNA damage response, promoted robust 53BP1 TIF formation and generated trains of telomere-telomere
              chromosome fusions similar to cells expressing WT NBS1 (Figures 5A–5E).
          - source_id: PMID:28216226
            statement: CDK2 phosphorylation of NBS1 is essential for this route.
            supporting_text: Taken together, our data indicate that CDK2-mediated phosphorylation of NBS1S432/3
              is essential for downstream ATM signaling and C-NHEJ-mediated repair of telomeres lacking TRF2-RAP1.
          parts:
          - order: 1
            role: MRN with phospho-NBS1 activates ATM
            node:
              id: phospho_nbn_atm_activation
              label: MRN recruitment and ATM activation (phospho-NBS1 state)
              description: By reference to the ATM DSB signalling module. At a telomere lacking TRF2 the NBN
                subunit of MRN is the S432-phosphorylated form; no new GO-CAM activity exists for this step,
                which is the arm missing from gomodel:65a1f4f800002884.
              module_ref: atm_dsb_signaling#atm_activation
          - order: 2
            role: Ligation of telomere ends
            node:
