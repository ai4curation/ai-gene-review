id: MODULE:telomere_end_joining_pathway_choice
title: NBS1 phosphorylation switch for end-joining choice at dysfunctional telomeres
description: >-
  The phosphorylation state of NBS1 (NBN) at a CDK site in its TRF2-binding motif
  (human S432, mouse S433) decides how a mammalian telomere is joined once it
  loses protection. CDK2 phosphorylates the site in S/G2 and PP1-alpha removes
  the phosphate in G1. Dephosphorylated NBS1 docks on the TRFH domain of TRF2,
  which keeps MRN away from functional telomere ends. At telomeres that have lost
  TRF2, phospho-NBS1 binds MRE11, activates ATM and drives classical, DNA ligase
  IV-dependent NHEJ. At telomeres that have lost POT1-TPP1, TRF2-bound
  dephospho-NBS1 recruits EXO1 for 5' resection, and the ends are joined by the
  PARP1- and ligase III-dependent alternative (microhomology-mediated) pathway.
status: DRAFT
scope: ABSTRACT
evidence:
- &abs_choice
  source_id: PMID:28216226
  statement: The phosphorylation state of NBS1 S432 selects classical versus alternative NHEJ at dysfunctional
    telomeres.
  supporting_text: Classical-NHEJ-mediated repair of telomeres lacking TRF2 requires phosphorylated NBS1S432
    to activate ATM, while interaction of de-phosphorylated NBS1S432 with TRF2 promotes alternative-NHEJ
    repair of telomeres lacking POT1-TPP1.
- &switch
  source_id: PMID:28216226
  statement: The authors frame NBS1 S432 phosphorylation as the switch for telomere repair choice.
  supporting_text: Our data reveal that phosphorylation of NBS1S432 functions as a switch to dictate dysfunctional
    telomere repair pathway choice.
- &mammal
  source_id: PMID:28216226
  statement: The shelterin context of the mechanism is mammalian telomeres.
  supporting_text: Mammalian telomeres are composed of repetitive TTAGGG DNA sequences bound to the shelterin
    complex
- &cy_motif
  source_id: PMID:28216226
  statement: The CDK docking motif upstream of the site is shared by human and mouse NBS1.
  supporting_text: We identified an evolutionary conserved Cy motif upstream of both hNBS1S432 and mNBS1S433.
module:
  id: telomere_end_joining_pathway_choice
  label: NBS1 phosphorylation-controlled end-joining choice at dysfunctional telomeres
  module_type: REGULATORY_STEP
  description: >-
    A three-part switch. (1) CDK2 and PP1-alpha set the phosphorylation state of
    NBS1 S432/S433. (2) The TRF2 TRFH domain docks dephosphorylated NBS1 and
    holds MRN away from telomere ends, which protects functional telomeres from
    NHEJ. (3) Which shelterin component is lost, together with the NBS1 state,
    selects one of two end-joining routes: phospho-NBS1/MRN -> ATM -> classical
    NHEJ (ligase IV), or TRF2-docked dephospho-NBS1 -> EXO1 resection ->
    alternative NHEJ (PARP1, ligase III).
  concepts:
  - preferred_term: telomere maintenance in response to DNA damage
    term:
      id: GO:0043247
      label: telomere maintenance in response to DNA damage
    description: Repair of telomeres that have lost shelterin protection, which here ends in telomere-telomere
      fusion by one of two end-joining pathways.
  - preferred_term: protection from non-homologous end joining at telomere
    term:
      id: GO:0031848
      label: protection from non-homologous end joining at telomere
    description: The default state at functional telomeres, held by TRF2 docking of dephosphorylated
      NBS1.
  context:
    taxa:
    - preferred_term: mammals
      term:
        id: NCBITaxon:40674
        label: Mammalia
    cellular_components:
    - preferred_term: chromosome, telomeric region
      term:
        id: GO:0000781
        label: chromosome, telomeric region
  parts:
  - order: 1
    role: Setting the NBS1 S432/S433 phosphorylation state
    node:
      id: nbn_phospho_switch
      label: CDK2 phosphorylation and PP1-alpha dephosphorylation of NBS1 S432/S433
      module_type: REGULATORY_STEP
      description: >-
        Opposing kinase and phosphatase set the state of the CDK site in the NBS1
        TRF2-binding motif. CDK2 dominates in S/G2 and PP1-alpha in G1.
        Phosphorylation abolishes NBS1 binding to the TRF2 TRFH domain.
      evidence:
      - &pp1_g1
        source_id: PMID:28216226
        statement: PP1-alpha favours NBS1-TRF2 binding in G1, CDK2 dissociates it in S/G2.
        supporting_text: Our data suggest that de-phosphorylation of mNBS1S433 by PP1-α promotes NBS1-TRF2
          interaction in G1, while phosphorylation by CDK2 in S/G2 dissociates NBS1S432 from TRF2.
      - source_id: PMID:28216226
        statement: Phosphorylated or phosphomimetic NBS1 peptides do not bind TRF2 TRFH (ITC, human and
          mouse).
        supporting_text: indicating that for both species, phosphorylated NBS1S432/3 and the two NBS1 phosphomimetic
          mutants cannot bind to TRF2
      annotons:
      - id: cdk2_nbn_phosphorylation
        label: CDK2 phosphorylates NBS1 S432/S433
        participant:
          selector_type: FAMILY
          family:
            preferred_term: CDK2 ortholog group
            term:
              id: PANTHER:PTHR24056:SF521
              label: CYCLIN-DEPENDENT KINASE 2
            representative_members:
            - preferred_term: CDK2 (human)
              term:
                id: UniProtKB:P24941
                label: Cyclin-dependent kinase 2
            - preferred_term: Cdk2 (mouse)
              term:
                id: UniProtKB:P97377
                label: Cyclin-dependent kinase 2
        function:
          preferred_term: cyclin-dependent protein serine/threonine kinase activity
          term:
            id: GO:0004693
            label: cyclin-dependent protein serine/threonine kinase activity
          targets:
          - preferred_term: NBN (NBS1)
            term:
              id: UniProtKB:O60934
              label: Nibrin
        processes:
        - preferred_term: telomere maintenance in response to DNA damage
          term:
            id: GO:0043247
            label: telomere maintenance in response to DNA damage
        locations:
        - preferred_term: chromosome, telomeric region
          term:
            id: GO:0000781
            label: chromosome, telomeric region
        role_description: Phosphorylates NBS1 S432 (mouse S433) in S/G2, releasing NBS1 from TRF2 and enabling
          the phospho-NBS1/MRN -> ATM -> classical NHEJ route at telomeres that lack TRF2.
        evidence:
        - &abs_cdk2
          source_id: PMID:28216226
          statement: CDK2 phosphorylation of S432 in S/G2 dissociates NBS1 from TRF2.
          supporting_text: Phosphorylation of NBS1 serine 432 by CDK2 in S/G2 dissociates NBS1 from TRF2,
            promoting TRF2-Apollo/SNM1B complex formation and the protection of leading-strand telomeres.
        - source_id: PMID:28216226
          statement: Endogenous human NBS1 S432 phosphorylation depends on CDK2.
          supporting_text: we show that endogenous hNBS1S432 is phosphorylated by CDK2, and that this phosphorylation
            is reduced upon expression of a dominant negative CDK2 allele (CDK2DN) (Figure 3A)
        - source_id: PMID:28216226
          statement: Mouse NBS1 S433 phosphorylation and classical-NHEJ fusions require Cdk2.
          supporting_text: Phosphorylation of mNBS1S433 and C-NHEJ fusions require CDK2, since fusions are
            completely abolished in Cdk2−/− MEFs
        gocam_associations:
        - model: gomodel:65a1f4f800002884
          activity: gomodel:65a1f4f800002884/65a1f4f800002929
          title: Phosphorylation of NBN regulates DNA repair choice at telomes (Human).
          notes: 'Consistent: CDK2 cyclin-dependent kinase activity with has_input NBN and a negative edge
            to the NBN-TRF2 docking state. The model omits the positive consequence of the same phosphorylation,
            the classical-NHEJ route, which this module adds (c_nhej_route).'
      - id: pp1_nbn_dephosphorylation
        label: PP1-alpha dephosphorylates NBS1 S432/S433
