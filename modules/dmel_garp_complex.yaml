id: MODULE:dmel_garp_complex
title: GARP and EARP tethering complexes in Drosophila melanogaster
description: >-
  The Golgi-associated retrograde protein (GARP) complex and the endosome-associated recycling
  protein (EARP) complex are related multisubunit tethering complexes that share Vps51, Vps52
  and Vps53. GARP contains Vps54 (scattered, scat, in Drosophila) and tethers endosome-derived
  vesicles at the trans-Golgi network, supporting retrograde transport of cargo such as lysosomal
  hydrolase receptors. EARP contains Vps50 in place of Vps54 and acts in recycling from endosomes
  to the plasma membrane. Drosophila scat mutants are male sterile, with defects in spermatid
  differentiation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000466
  title: 'FlyBase gene group GARP: Golgi-associated retrograde protein complexes'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as golgi-associated retrograde
    protein complexes (GARP); this module models that group.
- source_id: GO:0000938
  title: GARP complex
  statement: >-
    GO term grounding the module as GARP complex.
- source_id: GO:1990745
  title: EARP complex
  statement: >-
    GO term grounding the module as EARP complex.
notes: >-
  Boundary. The module contains the two FlyBase-curated complexes, modelled as alternative
  variants that share the Vps51-Vps52-Vps53 core. FlyBase groups realized by this module:
  GARP (FBgg0000466). Subgroups folded into it: GARPI, GARPII. Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_garp_complex.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
