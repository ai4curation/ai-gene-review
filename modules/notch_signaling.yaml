                          term:
                            id: PANTHER:PTN000087518
                            label: PTN000087518
                          description: >-
                            Bilaterian node with IBD support for O-fucosylpeptide
                            3-beta-N-acetylglucosaminyltransferase activity and
                            regulation of Notch signaling; assessed SOUND. The
