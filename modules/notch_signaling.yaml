id: MODULE:notch_signaling
title: Canonical Notch signaling pathway module
description: >-
  A cross-species decomposition of canonical (CSL-dependent) Notch signaling, a
  contact-dependent juxtacrine pathway present across eumetazoans. A
  membrane-bound DSL-type ligand on a signal-sending cell is ubiquitylated by a
  Mind bomb or Neuralized E3 ligase and endocytosed; the resulting pulling force
  on the bound Notch receptor of the neighboring cell unfolds its negative
  regulatory region, exposing the S2 site to an ADAM10-family metalloprotease.
  The membrane-tethered remnant is then cut within its transmembrane segment by
  gamma-secretase, releasing the Notch intracellular domain (NICD). NICD enters
  the nucleus, binds the DNA-bound CSL transcription factor (RBPJ, Su(H),
  LAG-1), and together with a Mastermind-family coactivator converts CSL from a
  corepressor-bound repressor into an activator of target genes, prominently the
  HES/E(spl) and HEY bHLH repressors. Receptor competence is set beforehand in
  the ER and Golgi by POFUT1-type O-fucosylation and, in arthropods and
  vertebrates, by Fringe elongation of those O-fucose glycans, which tunes
  receptor responsiveness to Delta- versus Serrate/Jagged-type ligands. The
  module is written so that each role is a union over the lineage-specific
  implementations found in vertebrates, insects, nematodes, and cnidarians.
status: DRAFT
evidence:
  - source_id: GO:0007219
    title: Notch signaling pathway
    statement: The module is grounded in the GO biological process term for Notch signaling.
  - source_id: file:modules/notch_signaling-deep-research-falcon.md
    title: Falcon module deep research on canonical Notch signaling
    statement: >-
      Provider deep research used for boundary setting: the obligatory trunk is
      trans DSL-Notch binding, force-dependent S2 exposure, ADAM S2 cleavage,
      gamma-secretase S3 cleavage, NICD-CSL-Mastermind assembly and target
      transcription; S1 furin processing, glycosylation, ligand E3 ligases and
      cis-inhibition are treated as maturation or regulatory context.
  - source_id: gomodel:60ad85f700000309
    title: Notch signaling pathway via N-Dl (D.mel)
    statement: >-
      FlyBase production GO-CAM covering Delta ligand, Notch receptor, Kuzbanian
      S2 cleavage, Presenilin S3 cleavage and the NICD coactivator activity; the
      module trunk matches its causal order.
  - source_id: Reactome:R-HSA-212356
    title: Formation of CSL-NICD coactivator complex
    statement: Reactome models the nuclear step as NICD binding RBPJ (CSL) and recruiting MAML.
  - source_id: Reactome:R-HSA-1912372
    title: Fringe-modified Pre-NOTCH is cleaved by FURIN
    statement: >-
      Reactome places Fringe modification and furin S1 processing upstream of
      surface delivery of the mature receptor, i.e. in receptor maturation
      rather than in ligand-triggered activation.
notes: >-
  Union modeling. Each role that is filled by different, often non-homologous,
  proteins in different lineages is a variant_set. selection ONE_OR_MORE is used
  where a single organism can deploy several implementations at once (Delta-
  and Serrate/Jagged-type ligands in flies and vertebrates; Mind bomb and
  Neuralized ligand E3s; HES/E(spl) and HEY target families), so a concrete
  realization is the union of the variants present. selection EXACTLY_ONE is
  used only for the Mastermind coactivator lineage, where each organism uses one
  of three sequence-unrelated or PANTHER-disjoint solutions. Optional parts
  (Fringe, CSL default repression, cis-inhibition) are absent from at least one
  well-studied lineage (C. elegans has no Fringe and no Hairless ortholog).

  PANTHER grounding. Concrete members were checked against the family reviews
  in interpro/panther/<PTHR>/<PTHR>-review.yaml written for this module. PANTHER
  classifies Notch receptors inconsistently: vertebrate NOTCH1-3, zebrafish
  notch1a and Nematostella Notch are in PTHR45836 (Notch clade node
  PTN001933897), but Drosophila N is in PTHR22804:SF57, C. elegans LIN-12 in
  PTHR24044:SF505 and GLP-1 in PTHR24033:SF232 (PANTHER 19 tree; InterPro/UniProt
  HMM scoring gives yet other families). The receptor descriptor therefore
  follows PTHR45836 and lists the out-of-family receptors as representative
  members deliberately. PAINT node PTN002371879 (Notch binding) belongs to the
  PTHR24044 tree, not PTHR45836, and is inherited by non-ligands (NEEDS_PRUNING
  in the PTHR24044 review), so it is not used as a ligand ancestry anchor.
  Presenilin's GO:0007219 node PTN000024430 is TOO_DEEP (Dictyostelium inherits
  it), so presenilin is anchored on its catalytic node only. Drosophila
  Mastermind is misclassified by PANTHER into the Mis18 family PTHR16431 and
  C. elegans SEL-8/LAG-3 has no PANTHER family, so those coactivators are
  grounded as concrete gene products.
module:
  id: notch_signaling
  label: Canonical Notch signaling pathway
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: Notch signaling pathway
      term:
        id: GO:0007219
        label: Notch signaling pathway
      description: >-
        Cell-cell signaling initiated by a DSL-type ligand on one cell binding a
        Notch receptor on an adjacent cell and ending in CSL-dependent
        transcription.
  context:
    taxa:
      - preferred_term: Eumetazoa
        term:
          id: NCBITaxon:6072
          label: Eumetazoa
        description: >-
          Receptor, DSL ligand, CSL, Mastermind-family coactivator and HES-type
          target families are present in cnidarians and bilaterians; the Notch
          receptor PAINT node PTN001933897 is placed at Eumetazoa. CSL
          DNA-binding activity itself is older (fungal Cbf11/Cbf12), and
          gamma-secretase homologs occur in Dictyostelium and plants that lack
          Notch.
    cellular_components:
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: receptor maturation (signal-receiving cell, secretory pathway)
      node:
        id: notch_receptor_maturation
        label: Notch receptor O-glycan maturation
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Before reaching the surface, Notch EGF repeats are O-fucosylated in
          the ER by POFUT1/O-fut1, which also acts as a Notch-selective folding
          chaperone. In arthropods and vertebrates, Fringe enzymes in the Golgi
          extend O-fucose with GlcNAc, raising responsiveness to Delta-type and
          lowering responsiveness to Serrate/Jagged-type ligands. Vertebrate
          receptors are also cleaved at S1 by furin; this constitutive step
          produces the heterodimer but does not activate signaling and is not
          modeled as a separate part.
        parts:
          - order: 1
            role: EGF-repeat O-fucosylation
            node:
              id: notch_o_fucosylation
              label: POFUT1-mediated O-fucosylation of Notch EGF repeats
              module_type: REACTION
              annotons:
                - id: pofut1_fucosyltransferase
                  label: Protein O-fucosyltransferase 1
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: POFUT1/O-fut1 protein O-fucosyltransferases
                      term:
                        id: PANTHER:PTHR21420
                        label: GDP-FUCOSE PROTEIN O-FUCOSYLTRANSFERASE 1
                      representative_members:
                        - preferred_term: POFUT1 (human)
                          term:
                            id: UniProtKB:Q9H488
                            label: GDP-fucose protein O-fucosyltransferase 1
                        - preferred_term: O-fut1 (fly)
                          term:
                            id: UniProtKB:Q9V6X7
                            label: GDP-fucose protein O-fucosyltransferase 1
                      ancestral_nodes:
                        - preferred_term: PAINT POFUT1 node PTN001086401
                          term:
                            id: PANTHER:PTN001086401
                            label: PTN001086401
                          description: >-
                            Eumetazoan node with IBD support for
                            peptide-O-fucosyltransferase activity (GO:0046922)
                            and regulation of Notch signaling; assessed SOUND
                            but too shallow (fly O-fut1 and worm pfut-1 sit in
                            the sister clade and receive no IBA).
                          evidence:
                            - source_id: GO_REF:0000033
                              statement: IBD propagation from PAINT node PTN001086401 in PTHR21420.
                  function:
                    preferred_term: peptide-O-fucosyltransferase activity
                    term:
                      id: GO:0046922
                      label: peptide-O-fucosyltransferase activity
                    substrates:
                      - preferred_term: GDP-L-fucose
                      - preferred_term: Notch EGF repeat (C2-X4-5-S/T-C3 consensus)
                    products:
                      - preferred_term: O-fucosylated Notch EGF repeat
                  processes:
                    - preferred_term: protein O-linked glycosylation via fucose
                      term:
                        id: GO:0036066
                        label: protein O-linked glycosylation via fucose
                  locations:
                    - preferred_term: endoplasmic reticulum
                      term:
                        id: GO:0005783
                        label: endoplasmic reticulum
                  role_description: >-
                    Adds O-fucose to Notch EGF repeats; fly O-fut1 also acts as
                    a catalysis-independent Notch folding chaperone.
                  evidence:
                    - source_id: file:genes/DROME/O-fut1/O-fut1-ai-review.yaml
                      statement: >-
                        Gene review: core functions peptide-O-fucosyltransferase
                        activity and a catalysis-independent Notch chaperone
                        activity.
          - order: 2
            role: Fringe elongation of O-fucose (arthropods and vertebrates)
            optional: true
            node:
              id: notch_fringe_elongation
              label: Fringe GlcNAc elongation of Notch O-fucose
              module_type: REACTION
              description: >-
                Fringe beta-1,3-N-acetylglucosaminyltransferases act in the Golgi
                on POFUT1-generated O-fucose. Absent from C. elegans.
              annotons:
                - id: fringe_glcnac_transferase
                  label: Fringe O-fucosylpeptide GlcNAc-transferase
