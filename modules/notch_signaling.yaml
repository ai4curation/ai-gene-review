                            label: Beta-1,3-N-acetylglucosaminyltransferase lunatic fringe
                        - preferred_term: fng (fly)
                          term:
                            id: UniProtKB:Q24342
                            label: Fringe glycosyltransferase
                      ancestral_nodes:
