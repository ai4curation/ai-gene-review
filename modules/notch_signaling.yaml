  connections:
    - source: notch_receptor_maturation
      target: notch_receptor_engagement
      connection_type: PROVIDES_INPUT_FOR
      description: Glycosylated, folded receptor is delivered to the surface; Fringe status sets ligand preference.
    - source: notch_ligand_presentation
      target: notch_receptor_engagement
      connection_type: CAUSES
      description: Activated ligand binds the receptor in trans and applies endocytic pulling force.
    - source: notch_cis_inhibition
      target: notch_receptor_engagement
      connection_type: NEGATIVELY_REGULATES
      description: Cis ligand-receptor interactions sequester the receptor from trans activation.
    - source: notch_receptor_engagement
      target: notch_s2_cleavage
      connection_type: CAUSES
      description: Unfolding of the negative regulatory region exposes the S2 site.
    - source: notch_s2_cleavage
      target: notch_s3_cleavage
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: The S2 product NEXT is the gamma-secretase substrate (protein intermediate, not a CoA carrier).
      description: NEXT is the obligate gamma-secretase substrate.
    - source: notch_s3_cleavage
      target: notch_csl_switch
      connection_type: CAUSES
      description: Released NICD enters the nucleus and binds CSL.
    - source: notch_csl_switch
      target: notch_target_output
      connection_type: CAUSES
      description: The NICD-CSL-Mastermind complex activates target gene transcription.
  knowledge_gaps:
    - gap_statement: >-
        The C. elegans ligand-activating E3 ubiquitin ligase is not identified.
      boundary: >-
        Worm mib-1 lies in the MIB2-related PANTHER subfamily and lacks the
        Mib/HERC2 domain, and the Neuralized homolog F10D7.5 has no established
        Notch-ligand role, so the nematode realization of the ligand-activating
        E3 variant set is unresolved.
    - gap_statement: >-
        Whether nematode LAG-3/SEL-8 is a diverged Mastermind homolog or a
        functional analog is unresolved.
      boundary: >-
        SEL-8/LAG-3 has no PANTHER family and carries Pfam PF11498
        (Activator_LAG-3) rather than the MamL-1 domain; its Mastermind role
        rests on ternary-complex formation with LAG-1 and NICD.
    - gap_statement: >-
        The CSL corepressor adaptor used in nematodes and cnidarians is not
        established.
      boundary: >-
        C. elegans has no Hairless ortholog and default repression is shown only
        in the anchor cell / ventral uterine context; no cnidarian CSL
        corepressor has been characterized.
    - gap_statement: >-
        Whether cnidarian Notch signaling is canonical (Su(H)/Hes-dependent) in
        all contexts is debated.
      boundary: >-
        Nematostella Notch represses neural and cnidocyte differentiation;
        one study reports Hes-independent repression and another reports
        Hes-dependence (see genes/NEMVE/G9JWI5 review), so the cnidarian
        realization of the target-output step is provisional.
    - gap_statement: >-
        CSL-independent (non-canonical) and ligand-independent Notch signaling
        are outside this module boundary.
      boundary: >-
        RBPJ-independent NICD activities, membrane-tethered signaling before S3,
        and ligand-independent endosomal activation (e.g. after ESCRT loss) are
        not modeled here.
