id: MODULE:hippo_contact_inhibition
title: Hippo contact-inhibition kinase cassette controlling YAP/TAZ nuclear output
description: >-
  A reusable metazoan Hippo signaling motif in which membrane-proximal
  scaffold/adaptor inputs converge on a SAV1/MST kinase module to activate
  LATS-family kinases. Active LATS phosphorylates YAP/TAZ-family transcriptional
  coactivators, enabling 14-3-3 binding and cytoplasmic sequestration so that
  YAP/TAZ-dependent nuclear transcription is reduced during contact inhibition.
  The reviewed human GO-CAM realizes this cassette with NF2, WWC2, SAV1, STK3,
  LATS2, YAP1, and YWHAB activities, with TEAD4 as an input to YAP1.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: file:gocams/65a1f4f800003542/65a1f4f800003542-review.yaml
    title: Cell contact inhibition by Hippo signaling GO-CAM review
    statement: >-
      The reviewed GO-CAM captures the human WWC/SAV/MST-to-LATS-to-YAP branch
      and records NF2/Merlin plus 14-3-3-mediated YAP sequestration as
      supported activities.
  - source_id: PMID:35429439
    title: WWC proteins mediate LATS1/2 activation by Hippo kinases and imply a tumor suppression strategy.
    statement: WWC proteins scaffold SAV1 and Hippo kinases to LATS1/2 in the mammalian Hippo pathway.
    supporting_text: >-
      WWC proteins (WWC1/2/3) directly interact with LATS1/2 and SAV1, and
      SAV1, in turn, brings in MST1/2 to phosphorylate and activate LATS1/2.
  - source_id: PMID:17974916
    title: Inactivation of YAP oncoprotein by the Hippo pathway is involved in cell contact inhibition and tissue growth control.
    statement: LATS2 phosphorylates YAP2 and Hippo pathway activity promotes YAP cytoplasmic retention.
    supporting_text: Lats2, but not the kinase-inactive Lats2-KR, phosphorylated YAP2
  - source_id: PMID:17974916
    title: Inactivation of YAP oncoprotein by the Hippo pathway is involved in cell contact inhibition and tissue growth control.
    statement: 14-3-3 proteins bind phosphorylated YAP and are part of the sequestration branch.
    supporting_text: Phosphorylated YAP then associates with 14–3–3 and is sequestered in the cytoplasm
notes: >-
  The module generalizes the reviewed human GO-CAM but keeps its activities as
  concrete exemplars. The upstream WWC2/SAV1/STK3 activity stack is left as a
  scaffolded activation part rather than a linear enzyme chain: the 2022 WWC
  study supports WWC-mediated assembly of SAV1/MST with LATS1/2, whereas the
  GO-CAM necessarily serializes WWC2 -> SAV1 -> STK3 -> LATS2. NF2/Merlin is
  modelled as a separate adaptor input that promotes LATS-family activation. The
  YAP1 part is written as a YAP/TAZ-family role with a TEAD-family target rather
  than as an assertion about YAP1 alone, and MOB1A/B are omitted because the
  reviewed GO-CAM does not model them. This module conforms to the broader
  hippo_signaling module by refining its SAV/MST-LATS-YAP/TEAD core into the
  contact-inhibition-specific, GO-CAM-supported NF2, WWC/SAV/MST, LATS, YAP and
  14-3-3 sequestration cassette; the broader module covers Hippo-YAP/TAZ
  signaling across upstream inputs and YAP/TAZ fates, while this module is
  limited to the GO-CAM's contact-inhibition branch.
module:
  id: hippo_contact_inhibition
  label: Hippo contact-inhibition YAP/TAZ switch
  module_type: SIGNALING_PATHWAY
  conforms_to:
    - template: hippo_signaling
      status: WITH_DEVIATIONS
      deviations:
        - >-
          The single broad upstream scaffold/MST activation tier is split into
          separate NF2/Merlin and WWC/SAV/MST LATS-activation inputs.
        - >-
          The YAP/TEAD output tier is specialized to a YAP/TAZ-family
          transcription coactivator annoton with TEAD as its target.
        - >-
          The 14-3-3-mediated phospho-YAP sequestration branch is added as a
          contact-inhibition-specific inhibitory step.
      notes: >-
        The cassette retains the SAV/MST-LATS-YAP/TEAD core of the generic
        Hippo module, splits the upstream NF2 and WWC/SAV/MST inputs that the
        reviewed contact-inhibition GO-CAM models separately, and adds the
        14-3-3-mediated phospho-YAP sequestration branch.
