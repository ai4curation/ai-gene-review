                        description: S. pombe fol1 enables GO:0004150 in cytosol.
                    role_description: N-terminal DHNA domain of the trifunctional protein.
                  - id: fol1_hppk_activity
                    label: FOL1 pterin pyrophosphokinase domain
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: fungal FOL1 trifunctional folate synthesis proteins
                        term:
                          id: PANTHER:PTHR20941:SF1
                          label: FOLIC ACID SYNTHESIS PROTEIN FOL1
                        representative_members:
                          - preferred_term: FOL1 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P53848
                              label: Folic acid synthesis protein FOL1
