id: MODULE:tetrahydrofolate_biosynthesis
title: De novo tetrahydrofolate and folylpolyglutamate biosynthesis
description: >-
  De novo synthesis of tetrahydrofolate (THF) and its polyglutamylated forms,
  as found in bacteria, fungi, plants and many protists but absent from
  animals, which must take up preformed folate. The pathway joins two
  branches. In the pterin branch, GTP cyclohydrolase I opens the GTP
  imidazole ring to give 7,8-dihydroneopterin triphosphate; the triphosphate
  is removed (a Nudix-type pyrophosphatase followed by a phosphatase) to give
  7,8-dihydroneopterin; dihydroneopterin aldolase releases glycolaldehyde to
  give 6-hydroxymethyl-7,8-dihydropterin; and
  6-hydroxymethyl-7,8-dihydropterin pyrophosphokinase activates it as the
  diphosphate. In the p-aminobenzoate (pABA) branch, chorismate is aminated by
  glutamine-dependent aminodeoxychorismate synthase and
  4-amino-4-deoxychorismate is cleaved by aminodeoxychorismate lyase to pABA
  and pyruvate. Dihydropteroate synthase condenses the pterin diphosphate with
  pABA to 7,8-dihydropteroate, dihydrofolate synthase adds the first
  L-glutamate to give 7,8-dihydrofolate, and dihydrofolate reductase reduces
  it with NADPH to THF. Folylpolyglutamate synthase then adds further
  gamma-linked glutamates, which retain folates in cells and organelles and
  make them preferred cofactors of folate-dependent enzymes. The reaction
  chain is conserved, but enzyme architecture varies: dihydroneopterin
  aldolase, pyrophosphokinase and dihydropteroate synthase are separate
  proteins in many bacteria and a single trifunctional polypeptide in fungi;
  aminodeoxychorismate synthase is a two-subunit PabA-PabB enzyme in many
  bacteria and a fused polypeptide in fungi and plants; and dihydrofolate
  synthase and folylpolyglutamate synthase are one bifunctional FolC protein
  in many bacteria but separate proteins in fungi and plants. In eukaryotes
  the steps are split between compartments (for example, the fungal
  trifunctional pterin enzyme and plant dihydrofolate synthase are
  mitochondrial). Chorismate supply, folate salvage and transport, and the
  interconversion and use of one-carbon-substituted THF are outside the
  module.
status: DRAFT
evidence:
  - source_id: YeastPathways:FOLSYN-PWY-1
    title: superpathway of tetrahydrofolate biosynthesis and salvage (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway combining de novo THF synthesis with one-carbon
      interconversion reactions (SHM1/SHM2, ADE3/MIS1, MTD1, MET12/MET13,
      CDC21, glycine cleavage). Only the biosynthetic reactions are modelled
      here; the interconversion reactions belong to
      folate_one_carbon_interconversion and neighbouring modules.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=FOLSYN-PWY-1
  - source_id: YeastPathways:PWY3O-45
    title: folate biosynthesis II (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Lists the ten de novo reactions from GTP and chorismate to THF with FOL2,
      FOL1 (DHNA, HPPK and DHPS), ABZ1, ABZ2, FOL3 and DFR1 as catalysts. The
      dihydroneopterin triphosphate pyrophosphatase and dihydroneopterin
      monophosphate phosphatase reactions have no assigned gene.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-45
  - source_id: YeastPathways:PWY-6147
    title: 6-hydroxymethyl-dihydropterin diphosphate biosynthesis I (S. cerevisiae, SGD YeastPathways)
    statement: Pterin-branch subpathway (FOL2, FOL1; two dephosphorylation steps without genes).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-6147
  - source_id: YeastPathways:PWY-6614
    title: tetrahydrofolate biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: Dihydropteroate synthase, dihydrofolate synthase and dihydrofolate reductase (FOL1, FOL3, DFR1).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-6614
  - source_id: YeastPathways:PWY-6543
    title: 4-aminobenzoate biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: pABA branch (ABZ1, ABZ2).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-6543
  - source_id: YeastPathways:PWY3O-1874
    title: p-aminobenzoate biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: Duplicate representation of the pABA branch (ABZ1, ABZ2).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-1874
  - source_id: YeastPathways:PWY3O-20
    title: folate polyglutamylation (S. cerevisiae, SGD YeastPathways)
    statement: >-
      FOL3 adds the first glutamate and MET7 extends the glutamate chain on
      dihydrofolate, THF, 5,10-methylene-THF, 5-methyl-THF and 10-formyl-THF.
      The pathway also lists SHM1/SHM2, MET12/MET13, ADE3/MIS1 and DFR1
      reactions that are interconversion, not polyglutamylation.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-20
  - source_id: GO:0046654
    title: tetrahydrofolate biosynthetic process
    statement: Module-level process term for de novo THF formation.
  - source_id: GO:0046901
    title: tetrahydrofolylpolyglutamate biosynthetic process
    statement: Process term for the polyglutamylation part of the module.
  - source_id: GO:0008153
    title: 4-aminobenzoate biosynthetic process
    statement: Process term for the pABA branch.
  - source_id: PMID:15169867
    title: >-
      Characterization of the Saccharomyces cerevisiae Fol1 protein: starvation
      for C1 carrier induces pseudohyphal growth.
    statement: >-
      Fol1p catalyses the DHNA, HPPK and DHPS steps, is essential, and is
      located only in mitochondria.
  - source_id: PMID:15826662
    title: >-
      The three-dimensional structure of the bifunctional
      6-hydroxymethyl-7,8-dihydropterin pyrophosphokinase/dihydropteroate
      synthase of Saccharomyces cerevisiae.
    statement: >-
      In fungi DHNA, HPPK and DHPS are one polypeptide whose HPPK and DHPS
      domains each resemble the monofunctional bacterial enzymes.
  - source_id: PMID:10049741
    title: >-
      Complementation of the fol2 deletion in Saccharomyces cerevisiae by human
      and Escherichia coli genes encoding GTP cyclohydrolase I.
    statement: >-
      fol2 deletion causes folinic acid auxotrophy, rescued by E. coli folE or
      human GTP cyclohydrolase I.
  - source_id: PMID:17698004
    title: >-
      Structure and function of the E. coli dihydroneopterin triphosphate
      pyrophosphatase: a Nudix enzyme involved in folate biosynthesis.
    statement: >-
      E. coli NudB (orf17) removes pyrophosphate from dihydroneopterin
      triphosphate, and its knockout markedly reduces folate synthesis.
  - source_id: PMID:8346682
    title: Para-aminobenzoate synthase gene of Saccharomyces cerevisiae encodes a bifunctional enzyme.
    statement: >-
      The yeast PABA synthase gene (ABZ1) encodes one protein similar to both
      E. coli PabA and PabB.
  - source_id: PMID:17873082
    title: >-
      A chemogenomic screening of sulfanilamide-hypersensitive Saccharomyces
      cerevisiae mutants uncovers ABZ2, the gene encoding a fungal
      aminodeoxychorismate lyase.
    statement: Identifies ABZ2 as the fungal aminodeoxychorismate lyase.
  - source_id: PMID:10799479
    title: >-
      Polyglutamylation of folate coenzymes is necessary for methionine
      biosynthesis and maintenance of intact mitochondrial genome in
      Saccharomyces cerevisiae.
    statement: >-
      FOL3 (YMR113w) encodes dihydrofolate synthetase and MET7 encodes
      folylpolyglutamate synthetase; fol3 mutants require folinic acid.
  - source_id: PMID:10775416
    title: Disruption of cytoplasmic and mitochondrial folylpolyglutamate synthetase activity in Saccharomyces cerevisiae.
    statement: >-
      MET7 appears to encode both the cytoplasmic and mitochondrial
      folylpolyglutamate synthetase activities.
  - source_id: PMID:2985605
    title: >-
      Folylpoly-gamma-glutamate synthetase-dihydrofolate synthetase. Cloning
      and high expression of the Escherichia coli folC gene and purification
      and properties of the gene product.
    statement: Both glutamate-adding activities of E. coli are catalysed by the single FolC protein.
  - source_id: PMID:11752472
    title: >-
      Tetrahydrofolate biosynthesis in plants: molecular and functional
      characterization of dihydrofolate synthetase and three isoforms of
      folylpolyglutamate synthetase in Arabidopsis thaliana.
    statement: >-
      Plant DHFS is mitochondrial and separate from FPGS, which has
      mitochondrial, cytosolic and plastid isoforms.
  - source_id: PMID:18804690
    title: Folate-mediated one-carbon metabolism.
    statement: Review cited by YeastPathways for the folate pathways.
module:
  id: tetrahydrofolate_biosynthesis
  label: De novo tetrahydrofolate and folylpolyglutamate biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: tetrahydrofolate biosynthetic process
      term:
        id: GO:0046654
        label: tetrahydrofolate biosynthetic process
      description: Formation of THF from GTP and chorismate-derived pABA.
    - preferred_term: tetrahydrofolylpolyglutamate biosynthetic process
      term:
        id: GO:0046901
        label: tetrahydrofolylpolyglutamate biosynthetic process
      description: Extension of the folate glutamate tail by folylpolyglutamate synthase.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-45
      title: 'folate biosynthesis II - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with FOL2, FOL1 (three activities), ABZ1, ABZ2, FOL3 and
        DFR1, all placed in cytosol, part_of GO:0046656. FOL3 -> DFR1 is the
        only causal edge.
    - model: gomodel:YeastPathways_FOLSYN-PWY-1
      title: 'superpathway of tetrahydrofolate biosynthesis and salvage - imported from: Saccharomyces Genome Database'
      description: >-
        Superpathway model; every activity, including the biosynthetic ones,
        is part_of GO:0035999 tetrahydrofolate interconversion and placed in
        cytosol.
    - model: gomodel:YeastPathways_PWY-6147
      title: '6-hydroxymethyl-dihydropterin diphosphate biosynthesis I - imported from: Saccharomyces Genome Database'
    - model: gomodel:YeastPathways_PWY-6614
      title: 'tetrahydrofolate biosynthesis - imported from: Saccharomyces Genome Database'
    - model: gomodel:YeastPathways_PWY-6543
      title: '4-aminobenzoate biosynthesis - imported from: Saccharomyces Genome Database'
    - model: gomodel:YeastPathways_PWY3O-1874
      title: 'p-aminobenzoate biosynthesis - imported from: Saccharomyces Genome Database'
      description: Activities are part_of the root term GO:0009058 biosynthetic process only.
    - model: gomodel:YeastPathways_PWY3O-20
      title: 'folate polyglutamylation - imported from: Saccharomyces Genome Database'
    - model: gomodel:6870555700003085
      title: pteridine-containing compound metabolic process (GO:0042558) - cytosolic
      description: >-
        PomBase S. pombe cytosolic model with fol2, fol1 (DHNA, HPPK, DHPS),
        abz1, abz2, fol3, dfr1 and met7, plus one-carbon interconversion and
        purine formyltransferase activities that are outside this module.
    - model: gomodel:66a3e0bb00002988
      title: pteridine-containing compound metabolic process (GO:0042558) - mitochondrial
      description: >-
        PomBase S. pombe mitochondrial model with fol1, fol3, dfr1 and met7 in
        mitochondria (abz1, abz2 and the fol1 DHNA/HPPK activities in
        cytosol), a mitochondrial folate carrier (flx1), and out-of-scope
        activities (fmt1, ecm31, shm2, ade9, met9, fau1).
  parts:
    - order: 1
      role: pterin branch committed step
      node:
        id: gtp_cyclohydrolase_step
        label: GTP to 7,8-dihydroneopterin triphosphate
        module_type: REACTION
        annotons:
          - id: gtp_cyclohydrolase_i_activity
            label: GTP cyclohydrolase I (FolE/FOL2)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GTP cyclohydrolase I (FolE type)
                term:
                  id: PANTHER:PTHR11109:SF7
                  label: GTP CYCLOHYDROLASE 1
                representative_members:
                  - preferred_term: FOL2 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P51601
                      label: GTP cyclohydrolase 1
                    description: S. cerevisiae FOL2/YGR267C; fol2 deletion is a folinic acid auxotroph (PMID:10049741).
                  - preferred_term: fol2 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:O13774
                      label: GTP cyclohydrolase 1
                    description: S. pombe SPAC17A5.13.
                  - preferred_term: FolE (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A6T5
                      label: GTP cyclohydrolase 1
                    description: E. coli folE complements yeast fol2 deletion (PMID:10049741).
            function:
              preferred_term: GTP cyclohydrolase I activity
              term:
                id: GO:0003934
                label: GTP cyclohydrolase I activity
              substrates:
                - preferred_term: GTP
                - preferred_term: water
              products:
                - preferred_term: 7,8-dihydroneopterin 3'-triphosphate
                - preferred_term: formate
              evidence:
                - source_id: EC:3.5.4.16
                  statement: GTP cyclohydrolase I
            gocam_associations:
              - model: gomodel:YeastPathways_PWY3O-45
                activity: gomodel:GTP-CYCLOHYDRO-I-RXN
                title: 'folate biosynthesis II - imported from: Saccharomyces Genome Database'
                description: FOL2 enables GO:0003934.
              - model: gomodel:6870555700003085
                activity: gomodel:6870555700003085/6870555700003214
                title: pteridine-containing compound metabolic process (GO:0042558) - cytosolic
                description: S. pombe fol2 enables GO:0003934 in cytosol.
            role_description: >-
              First and committed pterin-branch step. The same enzyme also
              supplies the pterin for tetrahydrobiopterin in animals, which is
              outside this module.
    - order: 2
      role: removal of the triphosphate from dihydroneopterin triphosphate
      node:
        id: dihydroneopterin_dephosphorylation_step
        label: 7,8-dihydroneopterin triphosphate to 7,8-dihydroneopterin
        module_type: METABOLIC_PATHWAY
        description: >-
          Two hydrolytic steps: a Nudix-family pyrophosphatase releases
          diphosphate to give dihydroneopterin monophosphate, and a phosphatase
          removes the last phosphate. Only the pyrophosphatase has a
          characterised dedicated enzyme (bacterial FolQ/NudB); the
          monophosphate phosphatase is thought to be non-specific, and neither
          enzyme has been identified in yeasts.
        annotons:
          - id: dhntp_pyrophosphatase_activity
            label: Dihydroneopterin triphosphate pyrophosphatase (FolQ/NudB)
            participant:
              selector_type: ORTHOLOG_OF
              ortholog_of:
                preferred_term: NudB (Escherichia coli K-12)
                term:
                  id: UniProtKB:P0AFC0
                  label: Dihydroneopterin triphosphate diphosphatase
              description: >-
                Orthologs of the experimentally characterised E. coli Nudix
                enzyme. The PANTHER subfamily that contains NudB is named for
                diadenosine tetraphosphatases, so no PANTHER id is asserted.
            function:
              preferred_term: dihydroneopterin triphosphate pyrophosphohydrolase activity
              term:
                id: GO:0019177
                label: dihydroneopterin triphosphate pyrophosphohydrolase activity
              substrates:
                - preferred_term: 7,8-dihydroneopterin 3'-triphosphate
                - preferred_term: water
              products:
                - preferred_term: 7,8-dihydroneopterin 3'-phosphate
                - preferred_term: diphosphate
              evidence:
                - source_id: PMID:17698004
                  statement: >-
                    the product of the orf17 gene of Escherichia coli, a Nudix
                    NTP hydrolase, catalyzes the hydrolytic release of
                    pyrophosphate from dihydroneopterin triphosphate
            role_description: >-
              Bacterial implementation of the pyrophosphatase step. The yeast
              enzyme is unknown (no gene in YeastPathways).
          - id: dhnmp_phosphatase_activity
            label: Dihydroneopterin monophosphate phosphatase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: dihydroneopterin monophosphate phosphatase activity
                term:
                  id: GO:0019176
                  label: dihydroneopterin monophosphate phosphatase activity
              description: >-
                No dedicated enzyme is established in any lineage; the
                reaction is generally attributed to non-specific phosphatases.
            function:
              preferred_term: dihydroneopterin monophosphate phosphatase activity
              term:
                id: GO:0019176
                label: dihydroneopterin monophosphate phosphatase activity
              substrates:
                - preferred_term: 7,8-dihydroneopterin 3'-phosphate
                - preferred_term: water
              products:
                - preferred_term: 7,8-dihydroneopterin
                - preferred_term: phosphate
            role_description: >-
              Completes dephosphorylation; enzyme identity unknown.
    - order: 3
      role: dihydroneopterin aldolase, pterin pyrophosphokinase and dihydropteroate synthase
      node:
        id: pterin_activation_and_condensation_steps
        label: 7,8-dihydroneopterin to 7,8-dihydropteroate
        module_type: METABOLIC_PATHWAY
        description: >-
          Three consecutive reactions: dihydroneopterin aldolase (DHNA) gives
          6-hydroxymethyl-7,8-dihydropterin, HPPK pyrophosphorylates it with
          ATP, and dihydropteroate synthase (DHPS) condenses the pterin
          diphosphate with pABA to 7,8-dihydropteroate. The chemistry is the
          same in all lineages; the protein architecture differs.
        variant_sets:
          - id: folB_folK_folP_architecture_variants
            label: DHNA/HPPK/DHPS architecture variants
            axis: enzyme architecture
            selection: EXACTLY_ONE
            notes: >-
              Plants use a third arrangement (a separate DHNA and a
              mitochondrial bifunctional HPPK-DHPS); it is not modelled as a
              separate variant until a plant exemplar is curated.
            variants:
              - id: separate_folB_folK_folP_variant
                label: Separate monofunctional FolB, FolK and FolP proteins
                module_type: METABOLIC_PATHWAY
                annotons:
                  - id: folB_dhna_activity
                    label: Dihydroneopterin aldolase (FolB)
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: FolB dihydroneopterin aldolases
                        term:
                          id: PANTHER:PTHR42844:SF1
                          label: DIHYDRONEOPTERIN ALDOLASE 1-RELATED
                        representative_members:
                          - preferred_term: FolB (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P0AC16
                              label: Dihydroneopterin aldolase
                    function:
                      preferred_term: dihydroneopterin aldolase activity
                      term:
                        id: GO:0004150
                        label: dihydroneopterin aldolase activity
                      substrates:
                        - preferred_term: 7,8-dihydroneopterin
                      products:
                        - preferred_term: 6-hydroxymethyl-7,8-dihydropterin
                        - preferred_term: glycolaldehyde
                      evidence:
                        - source_id: EC:4.1.2.25
                          statement: dihydroneopterin aldolase
                    role_description: Standalone bacterial DHNA.
                  - id: folK_hppk_activity
                    label: 6-Hydroxymethyl-7,8-dihydropterin pyrophosphokinase (FolK)
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: FolK pterin pyrophosphokinases
                        term:
                          id: PANTHER:PTHR43071:SF1
                          label: 2-AMINO-4-HYDROXY-6-HYDROXYMETHYLDIHYDROPTERIDINE PYROPHOSPHOKINASE
                        representative_members:
                          - preferred_term: FolK (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P26281
                              label: 2-amino-4-hydroxy-6-hydroxymethyldihydropteridine pyrophosphokinase
                    function:
                      preferred_term: 2-amino-4-hydroxy-6-hydroxymethyldihydropteridine diphosphokinase activity
                      term:
                        id: GO:0003848
                        label: 2-amino-4-hydroxy-6-hydroxymethyldihydropteridine diphosphokinase activity
                      substrates:
                        - preferred_term: 6-hydroxymethyl-7,8-dihydropterin
                        - preferred_term: ATP
                      products:
                        - preferred_term: (7,8-dihydropterin-6-yl)methyl diphosphate
                        - preferred_term: AMP
                      evidence:
                        - source_id: EC:2.7.6.3
                          statement: 2-amino-4-hydroxy-6-hydroxymethyldihydropteridine diphosphokinase
                    role_description: Standalone bacterial HPPK.
                  - id: folP_dhps_activity
                    label: Dihydropteroate synthase (FolP)
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: FolP dihydropteroate synthases
                        term:
                          id: PANTHER:PTHR20941:SF1
                          label: FOLIC ACID SYNTHESIS PROTEIN FOL1
                        description: >-
                          PANTHER places the bacterial FolP and the fungal FOL1
                          fusion in the same subfamily; the variant is defined
                          by architecture, not by this family.
                        representative_members:
                          - preferred_term: FolP (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P0AC13
                              label: Dihydropteroate synthase
                    function:
                      preferred_term: dihydropteroate synthase activity
                      term:
                        id: GO:0004156
                        label: dihydropteroate synthase activity
                      substrates:
                        - preferred_term: (7,8-dihydropterin-6-yl)methyl diphosphate
                        - preferred_term: 4-aminobenzoate
                      products:
                        - preferred_term: 7,8-dihydropteroate
                        - preferred_term: diphosphate
                      evidence:
                        - source_id: EC:2.5.1.15
                          statement: dihydropteroate synthase (sulfonamide target)
                    role_description: Standalone bacterial DHPS.
              - id: fungal_trifunctional_fol1_variant
                label: Fungal trifunctional FOL1 (DHNA-HPPK-DHPS)
                module_type: METABOLIC_PATHWAY
                notes: >-
                  One polypeptide carries all three activities (PMID:15169867,
                  PMID:15826662). In S. cerevisiae Fol1p is located only in
                  mitochondria (PMID:15169867); the YeastPathways models place
                  all three FOL1 activities in cytosol, and the PomBase models
                  place the S. pombe fol1 DHNA and HPPK activities in cytosol
                  and DHPS in both cytosol and mitochondrial envelope.
                annotons:
                  - id: fol1_dhna_activity
                    label: FOL1 dihydroneopterin aldolase domain
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: fungal FOL1 trifunctional folate synthesis proteins
                        term:
                          id: PANTHER:PTHR20941:SF1
                          label: FOLIC ACID SYNTHESIS PROTEIN FOL1
                        representative_members:
                          - preferred_term: FOL1 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P53848
                              label: Folic acid synthesis protein FOL1
                            description: S. cerevisiae FOL1/YNL256W.
                          - preferred_term: fol1 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:Q4LB35
                              label: Folic acid synthesis protein fol1
                            description: S. pombe SPBC1734.03.
                    function:
                      preferred_term: dihydroneopterin aldolase activity
                      term:
                        id: GO:0004150
                        label: dihydroneopterin aldolase activity
                      substrates:
                        - preferred_term: 7,8-dihydroneopterin
                      products:
                        - preferred_term: 6-hydroxymethyl-7,8-dihydropterin
                        - preferred_term: glycolaldehyde
                      evidence:
                        - source_id: PMID:15169867
                          statement: >-
                            Expression of the budding yeast gene FOL1 in
                            Escherichia coli identified the folate biosynthetic
                            enzyme activities dihydroneopterin aldolase (DHNA),
                            7,8-dihydro-6-hydroxymethylpterin-pyrophosphokinase
                            (HPPK), and dihydropteroate synthase (DHPS).
                    locations:
                      - preferred_term: mitochondrion
                        term:
                          id: GO:0005739
                          label: mitochondrion
                        evidence:
                          - source_id: PMID:15169867
                            statement: >-
                              Fol1p is exclusively localized to mitochondria as
                              shown by fluorescence microscopy and immune
                              electronmicroscopy.
                    gocam_associations:
                      - model: gomodel:YeastPathways_PWY3O-45
                        activity: gomodel:H2NEOPTERINALDOL-RXN
                        title: 'folate biosynthesis II - imported from: Saccharomyces Genome Database'
                        description: FOL1 enables GO:0004150 (placed in cytosol).
                      - model: gomodel:6870555700003085
