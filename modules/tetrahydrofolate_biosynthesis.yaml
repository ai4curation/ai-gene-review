  knowledge_gaps:
    - gap_statement: >-
        The enzymes that remove the triphosphate from 7,8-dihydroneopterin
        triphosphate in yeasts are unknown. No FolQ/NudB-type Nudix
        pyrophosphatase or dedicated dihydroneopterin monophosphate
        phosphatase has been assigned in S. cerevisiae or S. pombe, and
        YeastPathways lists both reactions without genes.
      boundary: >-
        The steps are retained as required parts because the downstream FOL1
        DHNA substrate is the dephosphorylated dihydroneopterin; only the
        bacterial pyrophosphatase is grounded.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        In S. cerevisiae Fol1p (making dihydropteroate) is mitochondrial
        whereas Abz1p, Abz2p and Fol3p are reported in the cytoplasm, so a pterin
        intermediate must cross the mitochondrial membranes; the transported
        species and carrier are not established.
      boundary: >-
        Compartment is asserted only where it is experimentally shown (FOL1,
        MET7); transport is outside the enzymatic core.
      gap_kind:
        - BIOLOGY
  notes: >-
    NEW module from the YeastPathways crosswalk (FOLSYN-PWY-1, PWY-6147,
    PWY3O-45, PWY-6614, PWY-6543, PWY3O-1874, PWY3O-20). Reaction assessment:
    the ten de novo reactions of PWY3O-45 map onto parts 1-6; the two
    dephosphorylation reactions (H2NEOPTERINP3PYROPHOSPHOHYDRO-RXN,
    DIHYDRONEOPTERIN-MONO-P-DEPHOS-RXN) have no yeast gene and are grounded
    only by bacterial NudB plus an ANY_WITH_FUNCTION selector. The YeastCyc
    catalysts FOL2, FOL1, ABZ1, ABZ2, FOL3, DFR1 and MET7 are all correct; no
    yeast enzyme was missing. The five MET7 polyglutamylation reactions of
    PWY3O-20 (one per folate species) are one GO:0004326 annoton. The
    one-carbon interconversion reactions bundled into FOLSYN-PWY-1 and
    PWY3O-20 (SHM1/SHM2, ADE3/MIS1, MTD1, MET12/MET13, CDC21 and glycine
    cleavage) are excluded and belong to folate_one_carbon_interconversion,
    glycine_serine_interconversion, glycine_cleavage_system and
    thymidylate_synthesis. Compartment corrections: S. cerevisiae Fol1p is
    exclusively mitochondrial (PMID:15169867) and MET7 supplies cytosolic and
    mitochondrial FPGS (PMID:10775416), whereas all YeastPathways models put
    every activity in cytosol. GO-CAM disagreements: YeastPathways_FOLSYN-PWY-1
    annotates the biosynthetic activities as part_of GO:0035999
    tetrahydrofolate interconversion rather than a biosynthetic process;
    YeastPathways_PWY3O-1874 uses only the root term GO:0009058;
    YeastPathways_PWY3O-20 mixes interconversion enzymes into the
    polyglutamylation pathway. The PomBase models give S. pombe fol3 both
    dihydrofolate synthase and folylpolyglutamate synthase activities
    (UniProt Q9UTD0 describes only probable DHFS) and place fol1 DHPS in
    both cytosol and mitochondrial envelope; the module keeps fol3 only as a
    DHFS exemplar. Process terms follow GO:0046654 (THF biosynthesis),
    GO:0006761 (dihydrofolate biosynthesis) and GO:0046901; the YeastPathways
    and PomBase use of GO:0046656 folic acid biosynthetic process is not
    adopted because folic acid itself is not an intermediate. Variants: separate FolB/FolK/FolP versus fungal
    trifunctional FOL1; fused versus two-subunit ADC synthase; fungal ABZ2-type
    versus bacterial PabC ADC lyase (distantly related class IV PLP enzymes); monofunctional
    DHFS + FPGS versus bacterial bifunctional FolC. Lineage-specific
    alternatives not modelled as variants (no curated exemplar yet) include
    the type IB GTP cyclohydrolase FolE2, the FolM alternative dihydrofolate
    reductase, the plant bifunctional HPPK-DHPS and plastid ADC synthase, and
    archaeal routes. Chorismate synthesis (shikimate pathway), folate salvage
    and transport are outside the module.
