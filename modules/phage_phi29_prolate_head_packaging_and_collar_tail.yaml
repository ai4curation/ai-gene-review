id: MODULE:phage_phi29_prolate_head_packaging_and_collar_tail
title: Bacillus phage phi29 prolate T=3 Q=5 head assembly, pRNA-coupled DNA packaging nanomotor, collar-appendage
  tail morphogenesis, and host cell lysis
description: A reusable module representing the prolate icosahedral procapsid morphogenesis, pRNA-coupled
  ATPase DNA packaging nanomotor, short non-contractile collar-appendage-knob tail assembly, cell-wall
  teichoic acid adsorption and peptidoglycan-degrading genome ejection, and holin-endolysin host cell
  lysis of Gram-positive protein-primed podoviruses (family Salasmaviridae, exemplified by Bacillus phage
  phi29, BPPH2). During late morphogenetic gene expression from the p4/p6-activated A3 promoter, dodecameric
  head-tail connector (portal) gp10 nucleates co-assembly of concentric internal shells of scaffolding
  protein gp7 with 235 copies of major HK97/BIG2-fold capsid protein gp8 (11 pentamers and 30 hexamers
  in a prolate T=3, Q=5 lattice) and 55 trimeric gp8.5 head fibers. A ring of phage-encoded packaging
  RNA (pRNA) docks onto the gp10 portal vertex and recruits the ring-shaped FtsK/HerA-superfamily ATPase
  gp16, forming a powerful rotary/burst nanomotor that recognizes the left-end gp3-DNA complex and pumps
  the 19.3 kb linear dsDNA chromosome into the prohead (~2 bp per ATP hydrolyzed) while expelling scaffolding
  protein gp7. Upon completion of packaging, pRNA and gp16 dissociate and are replaced by the lower collar
  tube protein gp11, the distal pore-forming tail knob gp9, the peptidoglycan-hydrolyzing tail plug/morphogenesis
  enzyme gp13, and 12 trimeric gp12 pre-neck appendages (whose C-terminal intramolecular chaperone domain
  autocatalytically cleaves and releases after folding the beta-helical poly-glycerol-phosphate teichoic-acid
  hydrolase shaft). Mature virions are released from Bacillus subtilis by the dual-start holin/antiholin
  gp14 and the GH25 muramidase + LysM cell-wall-binding endolysin gp15.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0019069
  title: viral capsid assembly
  statement: Ontology grounding for gp7-scaffolded assembly of the prolate T=3, Q=5 gp8-gp8.5-gp10 procapsid.
- source_id: GO:0019073
  title: viral DNA genome packaging
  statement: Ontology grounding for ATP-driven encapsidation of the gp3-linked linear dsDNA genome by
    the gp10-pRNA-gp16 packaging motor.
- source_id: file:genes/BPPH2/8/8-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P13849 (CAPSD_BPPH2)
  statement: Establishes that phi29 major capsid protein gp8 assembles into a prolate capsid shell with
    T=3, Q=5 symmetry.
  supporting_text: Assembles to form a prolate capsid shell of about 54 nm in length and 45 nm in width,
    with a T=3, Q=5 symmetry.
- source_id: file:genes/BPPH2/10/10-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P04332 (PORT_BPPH2)
  statement: Establishes that gp10 forms the homododecameric portal vertex of the capsid and binds the
    pRNA ring and gp16 ATPase hexamer to form the active DNA-translocating motor.
  supporting_text: Forms the portal vertex of the capsid (PubMed:10801350, PubMed:19744688, PubMed:21570409).
    This portal plays critical roles in head assembly, genome packaging, neck/tail attachment, and genome
    ejection (By similarity). The portal protein multimerizes as a single ring-shaped homododecamer arranged
    around a central channel (PubMed:11812138, PubMed:21570409). Binds to the 6 packaging RNA molecules
    (pRNA) forming a double-ring structure which in turn binds to the ATPase gp16 hexamer, forming the
    active DNA-translocating motor (PubMed:11130079, PubMed:15886394).
- source_id: file:genes/BPPH2/16/16-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P11014 (TERL_BPPH2)
  statement: Establishes that gp16 is the pRNA-dependent DNA packaging ATPase motor that pumps the gp3-linked
    viral genome into the prohead at ~2 bp per ATP hydrolyzed.
  supporting_text: ATPase required for the genome encapsidation reaction (PubMed:3879485). Part of the
    active packaging motor via the binding to the packaging RNA (pRNA), itself fixed to the head-tail
    connector at the unique portal vertex of the prohead (PubMed:11130079, PubMed:18674782).
- source_id: file:genes/BPPH2/15/15-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P11187 (ENLYS_BPPH2)
  statement: Establishes that endolysin gp15 is a lysozyme that degrades host peptidoglycan following
    gp14 holin-mediated cytoplasmic membrane permeabilization.
  supporting_text: Endolysin with lysozyme activity that degrades host peptidoglycans and participates
    with the holin and spanin proteins in the sequential events which lead to the programmed host cell
    lysis releasing the mature viral particles.
module:
  id: phage_phi29_prolate_head_packaging_and_collar_tail
  label: Phage phi29 prolate head assembly, pRNA-coupled DNA packaging motor, collar-appendage tail, and
    lysis
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: viral capsid assembly
    term:
      id: GO:0019069
      label: viral capsid assembly
    description: Co-assembly of the gp10 portal, gp7 internal scaffold, gp8 prolate T=3 Q=5 capsid shell,
      and gp8.5 head fibers.
  - preferred_term: viral DNA genome packaging
    term:
      id: GO:0019073
      label: viral DNA genome packaging
    description: ATP-powered translocation of gp3-linked linear dsDNA into the procapsid by the gp10-pRNA-gp16
      motor.
  - preferred_term: viral tail assembly
    term:
      id: GO:0098003
      label: viral tail assembly
    description: Post-packaging assembly of the lower collar gp11, distal tail knob gp9, muralytic plug
      gp13, and 12 trimeric teichoic-acid-degrading appendages gp12.
  - preferred_term: viral release from host cell by cytolysis
    term:
      id: GO:0044659
      label: viral release from host cell by cytolysis
    description: Host cell lysis mediated by dual-start holin gp14 and muramidase endolysin gp15.
  parts:
