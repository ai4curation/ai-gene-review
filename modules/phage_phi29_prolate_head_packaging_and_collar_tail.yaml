            label: peptidoglycan muralytic activity
        processes:
        - preferred_term: peptidoglycan catabolic process
          term:
            id: GO:0009253
            label: peptidoglycan catabolic process
        - preferred_term: viral tail assembly
          term:
            id: GO:0098003
