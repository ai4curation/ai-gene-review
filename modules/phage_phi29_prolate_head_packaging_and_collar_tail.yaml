  connections:
  - source: phi29_prolate_procapsid_assembly
    target: phi29_prna_gp16_gp10_packaging_motor
    connection_type: PROVIDES_INPUT_FOR
    description: The empty gp8-gp8.5-gp7 prolate prohead exposes the narrow end of the dodecameric gp10
      portal to bind the pRNA ring and assemble the gp16 packaging ATPase motor.
  - source: phi29_prna_gp16_gp10_packaging_motor
    target: phi29_collar_tail_assembly_and_entry
    connection_type: PROVIDES_INPUT_FOR
    description: Completion of gp3-DNA packaging expels gp7 and triggers dissociation of pRNA and gp16
      from gp10, allowing sequential attachment of lower collar gp11, tail knob gp9, muralytic plug gp13,
      and 12 trimeric gp12 appendages.
  - source: phi29_collar_tail_assembly_and_entry
    target: phi29_holin_endolysin_lysis
    connection_type: PROVIDES_INPUT_FOR
    description: Following intracellular assembly of mature tailed phi29 virions, gp14 holin pores and
      gp15 endolysin lyse the Bacillus subtilis cell envelope to release infectious phage particles.
  context:
    taxa:
    - preferred_term: Bacillus phage phi29
      term:
        id: NCBITaxon:2884424
        label: Bacillus phage phi29
  notes: 'Exemplar phages: Bacillus phage phi29 (NCBITaxon:2884424, family Salasmaviridae): Canonical
    Gram-positive podovirus whose morphogenetic and lysis regulon (late A3 transcript) encodes scaffolding
    protein gp7, major prolate T=3 Q=5 capsid protein gp8, head fiber gp8.5, upper-collar portal connector
    gp10, pRNA-coupled DNA packaging ATPase gp16, lower collar tube connector gp11, distal tail knob gp9,
    autocatalytically processed teichoic-acid hydrolase appendage gp12, bifunctional muralytic tail plug
    gp13, dual-start holin/antiholin gp14, and modular GH25-LysM endolysin gp15.'
