        participant:
          selector_type: FAMILY
          family:
            preferred_term: Phage phi29 pre-neck appendage teichoic-acid hydrolase gp12 family
            representative_members:
            - preferred_term: 12 / gp12 (Bacillus phage phi29 pre-neck appendage protein)
              term:
                id: UniProtKB:P20345
                label: Pre-neck appendage protein
        function:
          preferred_term: structural constituent of virion
          term:
            id: GO:0039660
            label: structural constituent of virion
        processes:
        - preferred_term: virion attachment to host cell
          term:
            id: GO:0019062
            label: virion attachment to host cell
        locations:
