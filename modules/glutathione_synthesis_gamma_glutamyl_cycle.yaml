  notes: >-
    Glutathione synthesis (GO:0006750), recycling and the gamma-glutamyl cycle (GO:0006751), grounded to nine completed human gene reviews (GCLC and GSS were reviewed/merged earlier). SYNTHESIS (cytosol): GCL = GCLC (P48506 PTHR11164, GO:0004357 catalytic, rate-limiting, GSH-feedback-inhibited) + GCLM (P48507 PTHR13295, GO:1990609 modifier, in_complex GO:0017109 — non-catalytic, lowers Km/raises feedback Ki) -> GSS (P48637 PTHR11130, GO:0004363 adds glycine -> GSH). RECYCLING: GSR (P00390 PTHR42737, GO:0004362 FAD/NADPH, GSSG->2 GSH). GAMMA-GLUTAMYL CYCLE (turnover): GGT1 (P19440 PTHR11686, GO:0036374 — cell-surface Ntn-hydrolase; NB the old GO:0003840 gamma-glutamyltransferase term is OBSOLETE) -> GGCT (O75223 PTHR12935, GO:0003839) -> OPLAH (O14841 PTHR11365, GO:0017168 ATP-dependent, regenerates glutamate, closing the cycle). A parallel intracellular GSH-degradation route: CHAC1 (Q9BUX1 PTHR12192, GO:0061928; ATF4/ER-stress-induced, pro-apoptotic/ferroptotic) -> 5-oxoproline + cysteinylglycine, also feeding OPLAH. GCLM is modelled with `processes` (non-catalytic modifier). GO term ids/labels verified against the local go.db. Downstream GSH-consuming enzymes (glutathione peroxidases GPX1/4, glutathione transferases) are separate modules. Disorders: hemolytic anemia (GCLC, GSR), GSS deficiency/5-oxoprolinuria, glutathionuria (GGT1), 5-oxoprolinase deficiency (OPLAH). ALIGN (YeastPathways project, 2026-10; GLUTATHIONESYN-PWY, PWYQT-4432, PWY3O-114 and PomBase 68b0f0d000008341): the human module was made eukaryote-wide. S. cerevisiae and S. pombe exemplars were added for GCL (GSH1, gcs1; S. pombe also has the GCLM-like gcs2, S. cerevisiae has none), GSS (GSH2, gsa1), GSR (GLR1, pgr1), ChaC (GCG1, ggg1) and 5-oxoprolinase (OXP1; S. pombe oxp1 and oxp2 are adjacent complete OPLAH-family paralogs). The GGT step became a ONE_OR_MORE compartment variant set (cell-surface GGT1 in animals vs vacuolar-membrane ECM38/ggt1/ggt2 in fungi). GGCT was made optional because neither yeast has a PTHR12935 member. Two parts were added: the Cys-Gly dipeptidase (DUG1/dug1/CNDP2, an M20A family; PMID:19346245) and the optional fungal Dug2-Dug3 glutamine-amidotransferase complex (PMID:22277648). YeastCyc corrections: OXP1, GCG1, GLR1 and DUG2/DUG3 are absent from the YeastCyc glutathione frames; the frame comments that no Cys-Gly dipeptidase gene or 5-oxoprolinase is known are out of date. GO-CAM disagreements: the SGD models place ECM38 in cytosol and give ECM38 and the Cys-Gly step only root or broad MF terms. Glutathione reductase is also used by the glutathione_thioredoxin_redox_systems module.
