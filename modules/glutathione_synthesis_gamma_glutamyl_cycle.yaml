id: MODULE:glutathione_synthesis_gamma_glutamyl_cycle
title: Glutathione synthesis, recycling, and the gamma-glutamyl cycle
description: >-
  Glutathione (GSH, gamma-L-glutamyl-L-cysteinylglycine) is the most abundant cellular thiol and the central small-molecule antioxidant and redox buffer, also serving in detoxification (as GSH conjugates), cysteine storage/transport and leukotriene metabolism. Its metabolism has three linked arms. Synthesis is a two-step, ATP-dependent cytosolic route: glutamate-cysteine ligase (GCL, a heterodimer of the catalytic subunit GCLC and the regulatory modifier subunit GCLM) joins L-glutamate and L-cysteine to gamma-glutamylcysteine (the rate-limiting, feedback-controlled step), and glutathione synthetase (GSS) adds glycine to make GSH. Recycling keeps the pool reduced: glutathione-disulfide reductase (GSR), an FAD/NADPH enzyme, reduces oxidized glutathione (GSSG) back to two GSH, sustaining the high GSH/GSSG ratio. Turnover proceeds through the gamma-glutamyl cycle: the cell-surface ectoenzyme gamma-glutamyltransferase GGT1 initiates extracellular GSH breakdown by transferring/hydrolysing its gamma-glutamyl group (yielding cysteinylglycine plus a gamma-glutamyl-amino acid), gamma-glutamylcyclotransferase (GGCT) converts the gamma-glutamyl-amino acid to 5-oxoproline plus the free amino acid, and 5-oxoprolinase (OPLAH) hydrolyses 5-oxoproline back to glutamate at the expense of ATP, closing the cycle. A parallel intracellular route, the ATF4/stress-induced glutathione-specific gamma-glutamylcyclotransferase CHAC1, degrades cytosolic GSH directly to 5-oxoproline plus cysteinylglycine (promoting apoptosis/ferroptosis on GSH depletion). Inherited defects cause hemolytic anemia (GCLC, GSR), glutathione synthetase deficiency / 5-oxoprolinuria (GSS), glutathionuria (GGT1) and 5-oxoprolinase deficiency (OPLAH). In fungi the cycle is organised differently: the gamma-glutamyl transpeptidase is a vacuolar-membrane enzyme that degrades glutathione stored in the vacuole, no GGCT-type gamma-glutamylcyclotransferase is present, and a cytosolic alternative (DUG) pathway cleaves glutathione with a Dug2-Dug3 glutamine-amidotransferase complex before an M20A-family Cys-Gly dipeptidase (Dug1; human CNDP2) releases cysteine and glycine.
status: DRAFT
evidence:
  - source_id: GO:0006750
    title: glutathione biosynthetic process
    statement: GCLC/GCLM and GSS carry out glutathione biosynthesis (GO:0006750).
  - source_id: GO:0006751
    title: glutathione catabolic process
    statement: GGT1, GGCT, OPLAH and CHAC1 mediate glutathione catabolism / the gamma-glutamyl cycle (GO:0006751).
  - source_id: file:human/GCLC/GCLC-ai-review.yaml
    title: GCLC gene review (human)
    statement: The rate-limiting gamma-glutamylcysteine synthesis step (UniProtKB:P48506, GO:0004357) matches the completed human GCLC review.
  - source_id: file:human/GCLM/GCLM-ai-review.yaml
    title: GCLM gene review (human)
    statement: The GCL modifier subunit (UniProtKB:P48507, GO:1990609 + GO:0017109) matches the completed human GCLM review.
  - source_id: file:human/GSS/GSS-ai-review.yaml
    title: GSS gene review (human)
    statement: The glutathione synthetase step (UniProtKB:P48637, GO:0004363) matches the completed human GSS review.
  - source_id: file:human/GSR/GSR-ai-review.yaml
    title: GSR gene review (human)
    statement: The GSSG->2 GSH recycling step (UniProtKB:P00390, GO:0004362) matches the completed human GSR review.
  - source_id: file:human/GGT1/GGT1-ai-review.yaml
    title: GGT1 gene review (human)
    statement: The extracellular gamma-glutamyl transfer step (UniProtKB:P19440, GO:0036374) matches the completed human GGT1 review.
  - source_id: file:human/GGCT/GGCT-ai-review.yaml
    title: GGCT gene review (human)
    statement: The gamma-glutamylcyclotransferase step (UniProtKB:O75223, GO:0003839) matches the completed human GGCT review.
  - source_id: file:human/OPLAH/OPLAH-ai-review.yaml
    title: OPLAH gene review (human)
    statement: The 5-oxoprolinase (cycle-closing) step (UniProtKB:O14841, GO:0017168) matches the completed human OPLAH review.
  - source_id: file:human/CHAC1/CHAC1-ai-review.yaml
    title: CHAC1 gene review (human)
    statement: The intracellular glutathione-degrading step (UniProtKB:Q9BUX1, GO:0061928) matches the completed human CHAC1 review.
  - source_id: YeastPathways:GLUTATHIONESYN-PWY
    title: glutathione biosynthesis (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLUTATHIONESYN-PWY
    statement: GSH1 and GSH2; retained.
  - source_id: YeastPathways:PWYQT-4432
    title: glutathione degradation (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWYQT-4432
    statement: RXN-6601 (ECM38) and RXN-6622 (DUG1). The frame comment still states that the Cys-Gly dipeptidase gene is unknown, but DUG1 is assigned (PMID:19346245); DUG2/DUG3 are mentioned but not assigned to a reaction.
  - source_id: YeastPathways:PWY3O-114
    title: superpathway of glutathione metabolism (truncated gamma-glutamyl cycle) (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-114
    statement: GSH1, GSH2, ECM38 and DUG1. The comment questions whether yeast has a 5-oxoprolinase; OXP1 is one (PMID:20402795), and GCG1 is a glutathione-specific ChaC enzyme.
  - source_id: PMID:12702279
    title: An overview on glutathione in Saccharomyces versus non-conventional yeasts.
    statement: Review of glutathione metabolism in yeasts.
  - source_id: PMID:6143574
    title: Glutathione metabolism in yeast Saccharomyces cerevisiae. Evidence that gamma-glutamyltranspeptidase is a vacuolar enzyme.
    statement: Yeast gamma-GT follows vacuolar markers on fractionation.
  - source_id: PMID:11672438
    title: gamma-Glutamyl transpeptidase in the yeast Saccharomyces cerevisiae and its role in the vacuolar transport and metabolism of glutathione.
    statement: gamma-GT is bound to the vacuolar membrane and, with a Cys-Gly dipeptidase, hydrolyses vacuolar GSH.
    supporting_text: is a glycoprotein that is bound to the vacuolar membrane.
  - source_id: PMID:9202464
    title: An important role for glutathione and gamma-glutamyltranspeptidase in the supply of growth requirements during nitrogen starvation of the yeast Saccharomyces cerevisiae.
    statement: Vacuolar GSH and gamma-GT supply amino acids during nitrogen starvation.
  - source_id: PMID:12620619
    title: 'Utilization of glutathione as an exogenous sulfur source is independent of gamma-glutamyl transpeptidase in the yeast Saccharomyces cerevisiae: evidence for an alternative gluathione degradation pathway.'
    statement: GSH can be used as a sulfur source without gamma-GT, revealing an alternative degradation route.
  - source_id: PMID:17179087
    title: The alternative pathway of glutathione degradation is mediated by a novel protein complex involving three new genes in Saccharomyces cerevisiae.
    statement: DUG1, DUG2 and DUG3 are required for the alternative GSH degradation pathway; the proposed three-protein degradosome was later resolved into a (Dug2p-Dug3p)2 GATase acting upstream of the Dug1p dipeptidase (PMID:22277648).
  - source_id: PMID:22277648
    title: Glutathione degradation by the alternative pathway (DUG pathway) in Saccharomyces cerevisiae is initiated by (Dug2p-Dug3p)2 complex, a novel glutamine amidotransferase (GATase) enzyme acting on glutathione.
    statement: (Dug2p-Dug3p)2 cleaves GSH to glutamate and Cys-Gly; Dug1p acts downstream as the Cys-Gly peptidase.
  - source_id: PMID:19346245
    title: Dug1p Is a Cys-Gly peptidase of the gamma-glutamyl cycle of Saccharomyces cerevisiae and represents a novel family of Cys-Gly peptidases.
    statement: Dug1p, S. pombe dug1 and human CNDP2 are M20A Cys-Gly dipeptidases.
    supporting_text: The human orthologue CNDP2 also displays Cys-Gly peptidase activity
  - source_id: PMID:20402795
    title: 'OXP1/YKL215c encodes an ATP-dependent 5-oxoprolinase in Saccharomyces cerevisiae: functional characterization, domain structure and identification of actin-like ATP-binding motifs in eukaryotic 5-oxoprolinases.'
    statement: OXP1 is the yeast ATP-dependent 5-oxoprolinase.
  - source_id: PMID:23070364
    title: Mammalian proapoptotic factor ChaC1 and its homologues function as γ-glutamyl cyclotransferases acting specifically on glutathione.
    statement: ChaC-family enzymes, conserved across phyla, degrade glutathione to 5-oxoproline and Cys-Gly.
  - source_id: PMID:8843443
    title: Yeast glutathione reductase is required for protection against oxidative stress and is a target gene for yAP-1 transcriptional regulation.
    statement: GLR1 encodes yeast glutathione reductase.
