id: MODULE:bacterial_peptidoglycan_polymerization_crosslinking
title: Bacterial peptidoglycan polymerization and crosslinking
description: >-
  A reusable bacterial module downstream of lipid II export. It separates
  septal and lateral-wall SEDS-bPBP synthases from class-A bifunctional PBPs,
  monofunctional glycan polymerases, and D,D-carboxypeptidase-mediated stem
  peptide maturation. The module does not include cytoplasmic precursor
  synthesis, lipid II flipping, or peptidoglycan recycling.
status: DRAFT
evidence:
- source_id: file:modules/bacterial_peptidoglycan_polymerization_crosslinking-deep-research-openscientist.md
  title: Bacterial peptidoglycan polymerization and crosslinking module research
  statement: >-
    The review supports separate SEDS-bPBP, class-A PBP, monofunctional
    glycosyltransferase, and D,D-carboxypeptidase branches while treating the
    latter two as accessory rather than universally required.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_peptidoglycan_polymerization_crosslinking__ppu00550-deep-research-openscientist.md
  title: PSEPK peptidoglycan polymerization and crosslinking satisfiability research
  statement: >-
    The taxon-specific review finds all five modeled branches represented in
    KT2440, confirms two MrdA/PBP2 paralogs, and leaves their physiological
    division of labor unresolved.
- source_id: GO:0009252
  title: peptidoglycan biosynthetic process
  statement: GO supplies the biological-process scope for peptidoglycan assembly.
- source_id: file:PSEPK/ftsW/ftsW-uniprot.txt
  title: UniProtKB entry Q88N77 for PSEPK FtsW
  statement: The record identifies the septal SEDS glycan polymerase candidate.
- source_id: file:PSEPK/mrdB/mrdB-uniprot.txt
  title: UniProtKB entry Q88DL9 for PSEPK MrdB/RodA
  statement: The record identifies the lateral-wall SEDS glycan polymerase candidate.
