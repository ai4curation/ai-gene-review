id: MODULE:eukaryotic_mismatch_repair
title: Human DNA mismatch repair — MutSalpha/MutSbeta mismatch recognition, RFC-PCNA-directed MutLalpha incision, EXO1 excision with RPA protection, and POLD resynthesis with LIG1 ligation; MSH2/MSH6/MSH3/MLH1/PMS2/RFC1-5/PCNA/EXO1/HMGB1/RPA1-3/POLD1-4/LIG1
description: >-
  Post-replicative DNA mismatch repair (MMR) removes base-base mismatches and
  small insertion/deletion loops that escape the proofreading of replicative
  DNA polymerases. In human cells a mismatch is recognised by one of two MutS
  homologue heterodimers that share MSH2: MutSalpha (MSH2-MSH6) binds
  base-base mismatches and one- or two-nucleotide insertion/deletion loops,
  and MutSbeta (MSH2-MSH3) binds larger insertion/deletion loops and has only
  a limited role in base-base mismatch repair. MutSalpha is pre-enriched on
  chromatin through binding of the MSH6 PWWP domain to H3K36me3. In an
  ATP-dependent step the mismatch-bound MutS complex recruits MutLalpha
  (MLH1-PMS2). MutLalpha is a latent endonuclease whose active site lies in
  PMS2; it is activated by the mismatch, MutSalpha, ATP and the PCNA sliding
  clamp that replication factor C (RFC1-5) loads at the strand break or
  primer terminus. Because RFC loads PCNA in a fixed orientation, the
  activated MutLalpha nicks the discontinuous (newly synthesised) strand,
  which is how the daughter strand is identified. Exonuclease 1 (EXO1),
  activated by MutSalpha, removes the error-containing tract 5' to 3' from a
  nick, and excision stops after the mispair is removed through the combined
  action of MutLalpha and RPA, the heterotrimeric single-stranded DNA-binding
  protein (RPA1-RPA3) that coats and protects the gap. The chromatin protein
  HMGB1 stimulates MutSalpha-activated excision. The gap is filled by DNA
  polymerase delta (POLD1-POLD4) working with PCNA and RFC, and DNA ligase 1
  (LIG1) seals the remaining nick. Loss of MSH2, MSH6, MLH1 or PMS2 causes
  microsatellite instability and Lynch syndrome. Mismatch avoidance by
  polymerase proofreading, MMR-dependent signalling of DNA damage, meiotic
  crossover resolution and the specialised mutagenic MMR of antibody genes
  are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000662
    title: mismatch repair pathway
    statement: >-
      The module boundary follows the RGD Pathway Ontology term and its
      diagram. The PW definition names Msh proteins (MutS counterparts), Mlh
      and Pms proteins (MutL counterparts), Exo1 excision, Rpa protection of
      single-stranded DNA, and resynthesis and ligation by DNA polymerase
      delta and DNA ligase 1 with the Pcna clamp and the Rfc clamp loader.
      The diagram draws Exo1, Lig1, the Mlh and Msh members, the Rfc complex
      and the pold complex associated with Pcna. Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000662.yaml).
  - source_id: GO:0006298
    title: mismatch repair
    statement: >-
      skos:closeMatch for PW:0000662 in the project seed (RGD page GO xref, PW
      definition xref and lexical match). It is the module's process concept.
  - source_id: PMID:16143102
    title: Reconstitution of 5'-directed human mismatch repair in a purified system.
    statement: >-
      Human MMR has been reconstituted from purified components, and the
      reconstituted protein set defines the module's parts.
    supporting_text: The reconstituted system includes MutSalpha or MutSbeta, MutLalpha, RPA, EXO1, HMGB1, PCNA, RFC, polymerase delta, and ligase I.
  - source_id: PMID:16873062
    title: Endonucleolytic function of MutLalpha in human mismatch repair.
    statement: >-
      MutLalpha is a latent endonuclease activated by the mismatch, MutSalpha,
      RFC, PCNA and ATP; its incision is biased to the nicked strand.
    supporting_text: We show that human MutLalpha is a latent endonuclease that is activated in a mismatch-, MutSalpha-, RFC-, PCNA-, and ATP-dependent manner.
  - source_id: PMID:33510387
    title: Mispair-bound human MutS-MutL complex triggers DNA incisions and activates mismatch repair.
    statement: >-
      Current model of the human reaction: MutSalpha recruits MutLalpha, which
      nicks the daughter strand 5' to the mismatch; EXO1 excises from that
      nick; POLD fills the gap with PCNA and RPA, and LIG1 seals it.
    supporting_text: MutSα recruits MutLα to form a mismatch-bound complex, which initiates MMR by nicking the daughter strand 5' to the mismatch.
  - source_id: PMID:10748105
    title: Identification of a second MutL DNA mismatch repair complex (hPMS1 and hMLH1) in human epithelial cells.
    statement: >-
      MutLbeta (MLH1-PMS1) exists in human cells, but this study shows only
      complex formation and MLH1-dependent stability, not a repair activity;
      MutLbeta is therefore recorded as context, not as a part.
    supporting_text: Our data provide evidence that MutL proteins form two different complexes, MutL-alpha (hPMS2 and hMLH1) and MutL-beta (hPMS1 and hMLH1).
  - source_id: PMID:10615123
    title: 'MLH3: a DNA mismatch repair gene associated with mammalian microsatellite instability.'
    statement: >-
      MLH3 binds MLH1 (MutLgamma) and a dominant-negative MLH3 causes
      microsatellite instability, supporting at most a minor or redundant
      somatic MMR role; MutLgamma is recorded as context, not as a part.
    supporting_text: Cells in culture stably expressing a dominant-negative MLH3 protein exhibit microsatellite instability.
  - source_id: PMID:11292842
    title: 'The interacting domains of three MutL heterodimers in man: hMLH1 interacts with 36 homologous amino acid residues within hMLH3, hPMS1 and hPMS2.'
    statement: >-
      MLH3, PMS1 and PMS2 compete for the same MLH1 interaction region, so
      MutLbeta and MutLgamma draw on the MLH1 pool that MutLalpha needs.
    supporting_text: Furthermore, we show that there is competition for the interacting domain in hMLH1 among the three other MutL homologues.
notes: >-
  Derived from the RGD Pathway Ontology term PW:0000662 (mismatch repair
  pathway) through the RGD_PATHWAY_ONTOLOGY project (seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier
  related_module_only; mapped GO process mismatch repair, skos:closeMatch; the
  PW page also cross-references KEGG map03430). RGD curates 24 human genes to
  PW:0000662: EXO1 HMGB1 LIG1 MLH1 MLH3 MSH2 MSH3 MSH6 PCNA PMS1 PMS2 POLD1
  POLD2 POLD3 POLD4 RFC1 RFC2 RFC3 RFC4 RFC5 RPA1 RPA2 RPA3 RPA4. Twenty-one are
  modelled as participants; MLH3, PMS1 and RPA4 are context (decisions 1 to 3).
  The parts follow the human reaction reconstituted from purified proteins
  (PMID:16143102, PMID:16873062), which uses exactly the RGD set minus those
  three. Molecular functions were taken from each protein's experimental GO
  annotations in QuickGO (November 2026); departures are stated on the
  annotons (PCNA processivity factor activity is IBA-supported; MutSbeta uses
  the parent term mismatched DNA binding). Gene reviews exist only for HMGB1
  and POLD2.

  Boundary decisions. (1) MutLbeta (MLH1-PMS1) is context, not a part. It forms
  in human cells (PMID:10748105), but no repair activity has been shown for it,
  PMS1 is not needed in the reconstituted reaction, and PMS1 germline variants
  are not established Lynch syndrome alleles. (2) MutLgamma (MLH1-MLH3) is
  context, not a part. MLH3 carries the conserved endonuclease motif, and a
  dominant-negative MLH3 causes microsatellite instability (PMID:10615123),
  but its established role is meiotic crossover formation, and any somatic MMR
  role is minor or a backup for MutLalpha; it would be a variant of the
  incision step only if purified human MutLgamma were shown to support
  repair. MLH3, PMS1 and PMS2 compete for the same MLH1 region
  (PMID:11292842). (3) RPA4 is excluded. It is an RPA2 paralogue that forms an
  alternative RPA complex that does not support DNA replication, and there is
  no evidence that it acts in MMR; the canonical RPA1-RPA3 heterotrimer is the
  RPA of the reconstituted reaction (PMID:9430682). (4) HMGB1 is included as an
  accessory annoton in the excision step, with positive regulation of mismatch
  repair as its process (accepted in the HMGB1 gene review), because it
  stimulates MutSalpha-activated excision but is not an essential catalytic
  participant. (5) EXO1-independent excision is context. Excision from a
  MutLalpha nick without EXO1, by POLD strand displacement or another
  nuclease, is described in the literature (PMID:33510387 notes unidentified
  nucleases) but has no defined human participant set, so it is not modelled
  as an alternative route and is recorded as a knowledge gap. (6) PCNA and RFC
  are modelled as one strand-discrimination step that feeds both incision and
  resynthesis; PCNA is not duplicated in the resynthesis step. (7)
  Out of scope: polymerase proofreading (DNA replication proofreading),
  MMR-dependent DNA damage signalling and apoptosis in response to alkylating
  agents, meiotic mismatch repair and crossover resolution, somatic
  hypermutation and class-switch recombination (which use MutSalpha, EXO1 and
  polymerase eta mutagenically), and the MCM9 helicase and WRN, which modulate
  MMR but are not RGD members. MSH4 and MSH5 are meiotic MutS homologues and
  are not MMR participants.

  Related modules. No human DNA replication, PCNA, RFC or polymerase delta
  module exists in modules/ (searched for replication, PCNA, RFC, polymerase,
  ligase, clamp and repair). Drosophila modules on the shared machinery exist
  by name only: dmel_dna_polymerase_complexes, dmel_elg1_rfc_like_complex and
  dmel_9_1_1_checkpoint_clamp. The bacterial analogue is
  muth_independent_mismatch_repair (MutS, MutL endonuclease directed by the
  beta clamp, UvrD, SSB and exonucleases), which shares the mapped GO process
  but not the taxon; the two are not linked as variants because their
  participants are not orthologous at the helicase and excision steps.

  GO-CAM. No GO-CAM model in gocams/index.tsv contains a mismatch repair
  activity for any member. The seed's best GO-CAM lead
  (gomodel:5fce9b7300002336, SPModule-TREM1-DAP12) overlaps only through
  HMGB1 as an extracellular receptor ligand and is unrelated; EXO1 and RPA1
  appear only in DNA end-resection and homologous recombination models. No
  gocam_associations are recorded.

  Observations for upstream review. (a) PMS1 carries contributes_to DNA
  endonuclease activity (IDA, PMID:33510387) in human GOA, but the full text of
  that paper assays human MLH1-PMS2 and mentions PMS1 only as the yeast MutLalpha
  subunit (yeast MLH1-PMS1), so the row may be a yeast-human naming confusion.
  (b) PCNA carries purine-specific mismatch base pair DNA N-glycosylase
  activity (IDA, PMID:11005803), but the abstract of that paper reports PCNA
  binding to MSH2-MSH6 and MSH2-MSH3 and no glycosylase assay; this looks like
  a mis-selected term. (c) MLH1 and PMS2 carry meiotic mismatch repair (IDA,
  ComplexPortal) from PMID:16873062, a study of somatic MMR in human cell
  extracts; only the abstract was checked. (d) LIG1 has mismatch repair only by
  TAS and POLD subunits have no experimental mismatch repair row, although
  both are required in the reconstituted reaction (PMID:16143102). PANTHER
  family ids and PTNs are deliberately not asserted.
module:
  id: eukaryotic_mismatch_repair
  label: Human DNA mismatch repair
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: mismatch repair
      term:
        id: GO:0006298
        label: mismatch repair
      description: >-
        The GO process mapped (skos:closeMatch) to PW:0000662. Here the
        human, nick-directed, post-replicative reaction.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: mismatch recognition
      node:
        id: mismatch_recognition
        label: Mismatch recognition by a MutS homologue heterodimer
        module_type: MOLECULAR_FUNCTION
        description: >-
          MSH2 partners with MSH6 (MutSalpha) or MSH3 (MutSbeta). The two
          complexes have overlapping but distinct specificities: MutSalpha
          for base-base mismatches and small loops, MutSbeta for larger
          insertion/deletion loops. Both carry PCNA-binding motifs in their
          MSH6 or MSH3 subunit.
        variant_sets:
          - id: muts_heterodimer
            label: MutS homologue heterodimer
            axis: mismatch type (base-base mismatches and small loops versus larger insertion/deletion loops)
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            evidence:
              - source_id: PMID:8942985
                statement: >-
                  MSH2-MSH3 and MSH2-MSH6 bind mismatched DNA with overlapping
                  but not identical specificity.
                supporting_text: Analysis of the mismatched nucleotide-binding specificity of the hMSH2-hMSH3 and hMSH2-hMSH6 protein complexes showed that they have overlapping but not identical binding specificity.
              - source_id: PMID:16143102
                statement: In the reconstituted reaction MutSbeta is the preferred sensor for insertion/deletion mispairs.
                supporting_text: In this system, MutSbeta plays a limited role in repair of base-base mismatches, but it processes insertion/deletion mispairs much more efficiently than MutSalpha, which efficiently corrects both types of heteroduplexes.
            variants:
              - id: mutsalpha_variant
                label: MutSalpha (MSH2-MSH6)
                module_type: PROTEIN_COMPLEX
                annotons:
                  - id: mutsalpha_mismatch_sensor
                    label: MutSalpha ATP-dependent mismatch sensor
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: MutSalpha (MSH2-MSH6)
                        term:
                          id: GO:0032301
                          label: MutSalpha complex
                        active_units:
                          - id: mutsalpha_msh2
                            label: MSH2 subunit
                            role: Shared MutS-homologue subunit; ATPase and mismatch-binding partner in both MutSalpha and MutSbeta.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: MSH2
                                term:
                                  id: UniProtKB:P43246
                                  label: DNA mismatch repair protein Msh2
                          - id: mutsalpha_msh6
                            label: MSH6 subunit
                            role: >-
                              Mismatch-contacting subunit that confers base-base specificity; its
                              PWWP domain reads H3K36me3 and its N-terminal motif binds PCNA.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: MSH6
                                term:
                                  id: UniProtKB:P52701
                                  label: DNA mismatch repair protein Msh6
                            function:
                              preferred_term: histone H3K36me3 reader activity
                              term:
                                id: GO:0140003
                                label: histone H3K36me3 reader activity
                              evidence:
                                - source_id: PMID:23622243
                                  statement: The MSH6 PWWP domain binds H3K36me3 and recruits MutSalpha to chromatin.
                                  supporting_text: Here, we show that an epigenetic histone mark, H3K36me3, is required in vivo to recruit the mismatch recognition protein hMutSα (hMSH2-hMSH6) onto chromatin through direct interactions with the hMSH6 PWWP domain.
                    function:
                      preferred_term: ATP-dependent DNA damage sensor activity
                      term:
                        id: GO:0140664
                        label: ATP-dependent DNA damage sensor activity
                    processes:
                      - preferred_term: mismatch repair
                        term:
                          id: GO:0006298
                          label: mismatch repair
                    role_description: >-
                      Binds a base-base mismatch or a one- or two-nucleotide loop and, after
                      ATP binding, recruits MutLalpha to form the initiation complex;
                      ATP-dependent release from the mismatch later gives EXO1 access. MSH2
                      and MSH6 carry this activity as contributes_to (IDA) in human GOA.
                    evidence:
                      - source_id: PMID:33510387
                        statement: Sliding of MutSalpha is needed for final mismatch removal rather than for initiation.
                        supporting_text: Using functional MMR assays and systems preventing proteins from sliding, we show that sliding of human MutSα is required not for MMR initiation, but for final mismatch removal.
              - id: mutsbeta_variant
                label: MutSbeta (MSH2-MSH3)
                module_type: PROTEIN_COMPLEX
                annotons:
                  - id: mutsbeta_loop_sensor
                    label: MutSbeta insertion/deletion loop recognition
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: MutSbeta (MSH2-MSH3)
                        term:
                          id: GO:0032302
                          label: MutSbeta complex
                        active_units:
                          - id: mutsbeta_msh2
                            label: MSH2 subunit
                            role: Shared MutS-homologue subunit.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: MSH2
                                term:
                                  id: UniProtKB:P43246
                                  label: DNA mismatch repair protein Msh2
                          - id: mutsbeta_msh3
                            label: MSH3 subunit
                            role: Loop-specificity subunit; carries an N-terminal PCNA-binding motif.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: MSH3
                                term:
                                  id: UniProtKB:P20585
                                  label: DNA mismatch repair protein Msh3
                    function:
                      preferred_term: mismatched DNA binding
                      term:
                        id: GO:0030983
                        label: mismatched DNA binding
                    processes:
                      - preferred_term: mismatch repair
                        term:
                          id: GO:0006298
                          label: mismatch repair
                    role_description: >-
                      Binds insertion/deletion loops of one or more extra nucleotides
                      (+G, +CA, +(CA)5 in the cited gel-shift assay) but not a G/T
                      mismatch. MSH3 carries mismatched DNA binding and its children
                      dinucleotide insertion or deletion binding and dinucleotide repeat
                      insertion binding as contributes_to (IDA, PMID:8942985), and a NOT
                      annotation to guanine/thymine mispair binding; the parent term is
                      used because no experimentally annotated term covers all loop sizes.
    - order: 2
      role: PCNA loading by RFC (strand discrimination signal)
      node:
        id: pcna_loading
        label: RFC loading of the PCNA clamp at the strand discontinuity
        module_type: BIOLOGICAL_PROCESS
        description: >-
          RFC binds PCNA with ATP, opens it and closes it around primer-template
          or nicked DNA in a fixed orientation. The oriented clamp both activates
          the MutLalpha endonuclease and directs it to the discontinuous strand,
          and it is reused as the processivity factor for POLD in resynthesis.
          PCNA also binds MSH6 and MSH3.
        annotons:
          - id: rfc_clamp_loader
            label: RFC (RFC1-RFC5) DNA clamp loader
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: replication factor C (RFC1-RFC5)
                term:
                  id: GO:0005663
                  label: DNA replication factor C complex
                active_units:
                  - id: rfc_rfc1
                    label: RFC1 large subunit
                    role: Large subunit; DNA-binding and clamp-interacting.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RFC1
                        term:
                          id: UniProtKB:P35251
                          label: Replication factor C subunit 1
                  - id: rfc_rfc2
                    label: RFC2 subunit
                    role: AAA+ ATPase small subunit.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RFC2
                        term:
                          id: UniProtKB:P35250
                          label: Replication factor C subunit 2
                  - id: rfc_rfc3
                    label: RFC3 subunit
                    role: AAA+ ATPase small subunit.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RFC3
                        term:
                          id: UniProtKB:P40938
                          label: Replication factor C subunit 3
                  - id: rfc_rfc4
                    label: RFC4 subunit
                    role: AAA+ ATPase small subunit.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RFC4
                        term:
                          id: UniProtKB:P35249
                          label: Replication factor C subunit 4
                  - id: rfc_rfc5
                    label: RFC5 subunit
                    role: AAA+ ATPase small subunit.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RFC5
                        term:
                          id: UniProtKB:P40937
                          label: Replication factor C subunit 5
            function:
              preferred_term: DNA clamp loader activity
              term:
                id: GO:0003689
                label: DNA clamp loader activity
              targets:
                - preferred_term: PCNA
                  term:
                    id: UniProtKB:P12004
                    label: DNA sliding clamp PCNA
            processes:
              - preferred_term: mismatch repair
                term:
                  id: GO:0006298
                  label: mismatch repair
            role_description: >-
              RFC2-RFC5 carry DNA clamp loader activity as contributes_to (IDA,
              PMID:12930902, an assay of the RFC2-5 core shared with the
              CTF18-RFC-like complex). RFC is required for MutLalpha activation.
            evidence:
              - source_id: PMID:16873062
                statement: RFC is one of the four factors needed to activate MutLalpha incision.
                supporting_text: We show that human MutLalpha is a latent endonuclease that is activated in a mismatch-, MutSalpha-, RFC-, PCNA-, and ATP-dependent manner.
          - id: pcna_clamp
            label: PCNA sliding clamp
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: PCNA homotrimer
                term:
                  id: GO:0043626
                  label: PCNA complex
                active_units:
                  - id: pcna_protomer
                    label: PCNA protomer
                    role: Forms the homotrimeric ring; binds PIP-box motifs in MSH6, MSH3, MLH1, PMS2 and POLD.
                    stoichiometry: "3"
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PCNA
                        term:
                          id: UniProtKB:P12004
                          label: DNA sliding clamp PCNA
            function:
              preferred_term: DNA polymerase processivity factor activity
              term:
                id: GO:0030337
                label: DNA polymerase processivity factor activity
            processes:
              - preferred_term: mismatch repair
                term:
                  id: GO:0006298
                  label: mismatch repair
            role_description: >-
              The oriented clamp activates and directs MutLalpha incision and is
              the processivity factor for POLD during resynthesis. Human GOA has no
              experimental molecular function for PCNA that captures the MMR role
              (its experimental MF rows are bindings, plus a purine-specific
              mismatch DNA N-glycosylase row that looks erroneous); the processivity
              factor activity used here is IBA-supported. GO has no term for
              activation of the MutLalpha endonuclease by PCNA.
            evidence:
              - source_id: PMID:11005803
                statement: PCNA binds MSH2-MSH6 and MSH2-MSH3, and the interaction is needed before resynthesis.
                supporting_text: When human MSH3 or MSH6 peptides containing the PCNA binding motif were added to a human cell extract, mismatch repair activity was inhibited at a step preceding DNA resynthesis.
    - order: 3
      role: strand-directed incision
      node:
        id: mutlalpha_incision
        label: MutLalpha (MLH1-PMS2) endonuclease nicking of the daughter strand
        module_type: REACTION
        description: >-
          The MutS-MutLalpha initiation complex, with oriented PCNA, makes
          incisions on the discontinuous strand, chiefly 5' to the mismatch,
          giving EXO1 an entry point close to the error. The endonuclease
          active site is the PMS2 DQHA(X)2E(X)4E motif.
        annotons:
          - id: mutlalpha_endonuclease
            label: MutLalpha latent DNA endonuclease
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: MutLalpha (MLH1-PMS2)
                term:
                  id: GO:0032389
                  label: MutLalpha complex
                active_units:
                  - id: mutlalpha_mlh1
                    label: MLH1 subunit
                    role: Shared MutL-homologue subunit; ATPase and dimerisation partner of PMS2, PMS1 and MLH3.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MLH1
                        term:
                          id: UniProtKB:P40692
                          label: DNA mismatch repair protein Mlh1
                  - id: mutlalpha_pms2
                    label: PMS2 catalytic subunit
                    role: Carries the endonuclease active-site motif.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PMS2
                        term:
                          id: UniProtKB:P54278
                          label: Mismatch repair endonuclease PMS2
            function:
              preferred_term: DNA endonuclease activity
              term:
                id: GO:0004520
                label: DNA endonuclease activity
            processes:
              - preferred_term: mismatch repair
                term:
                  id: GO:0006298
                  label: mismatch repair
            role_description: >-
              MLH1 carries DNA endonuclease activity as contributes_to (IDA,
              PMID:33510387) and PMS2 as contributes_to (IBA). MutLalpha also
              terminates EXO1 excision once the mismatch is removed.
            evidence:
              - source_id: PMID:16873062
                statement: The endonuclease active site is in PMS2.
                supporting_text: The probable endonuclease active site has been localized to a PMS2 DQHA(X)(2)E(X)(4)E motif.
              - source_id: PMID:16873062
                statement: Incision is directed to the nicked strand.
                supporting_text: Incision of a nicked mismatch-containing DNA heteroduplex by this four-protein system is strongly biased to the nicked strand.
    - order: 4
      role: excision of the error-containing tract
      node:
        id: exo1_excision
        label: EXO1 5'-to-3' excision from the nick, stimulated by HMGB1
        module_type: REACTION
        description: >-
          EXO1, activated and made processive by MutSalpha, hydrolyses the
          incised strand 5' to 3' from a nick and past the mismatch. Excision
          is terminated by MutLalpha and by RPA after the mispair is removed.
          HMGB1 stimulates MutSalpha-activated excision. EXO1-independent
          excision, which explains the weak mutator phenotype of EXO1 loss, is
          recorded in notes as context and not modelled as a route.
        annotons:
          - id: exo1_exonuclease
            label: EXO1 double-stranded DNA 5'-3' exonuclease
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
