knowledge_gaps:
  - gap_statement: >-
      How the mismatch-bound MutS-MutLalpha complex communicates with the strand
      discontinuity that may lie hundreds of nucleotides away (MutS sliding,
      DNA looping, or MutLalpha recruitment by PCNA at the primer terminus) is
      not resolved, and nor is the strand signal on the leading strand, where
      no Okazaki-fragment ends exist (ribonucleotide-removal nicks have been
      proposed).
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      The identity and relative weight of EXO1-independent excision in human
      cells are unknown: whether it relies on strand displacement by POLD from
      MutLalpha nicks, on another nuclease, or on both, and why EXO1 loss gives
      only a mild mutator phenotype whereas MSH2, MLH1 or PMS2 loss gives a
      strong one.
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      Whether MutLgamma (MLH1-MLH3), which carries a conserved endonuclease
      motif, or MutLbeta (MLH1-PMS1) contributes any catalytic activity to
      somatic human mismatch repair, beyond competing with PMS2 for MLH1, has
      not been shown with purified human proteins.
    gap_kind:
      - BIOLOGY
