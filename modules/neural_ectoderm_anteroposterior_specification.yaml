id: MODULE:neural_ectoderm_anteroposterior_specification
title: Neural ectoderm anteroposterior specification module
description: 'The developmental program that, during gastrulation, subdivides newly induced neural ectoderm
  along the anteroposterior axis into two parallel, lineage-committed brain progenitors: an OTX2-positive
  anterior neural ectoderm that generates the forebrain and midbrain, and a GBX2/HOX-positive posterior
  neural ectoderm that generates the hindbrain. The module begins where germ-layer specification ends
  - with SOX2-positive neural ectoderm established under combined BMP, TGF-beta and WNT inhibition -
  and is driven by a graded posteriorising input of FGF together with retinoic acid. That input is read
  out by a pair of mutually repressive homeodomain selectors, OTX2 and GBX2, whose shared border is
  the site at which the midbrain-hindbrain (isthmic) organizer forms; displacing the border displaces
  the organizer. The two territories are already committed rather than merely differently positioned:
  challenged with the opposite region''s inducing signals they do not interconvert, and they carry diverging
  accessible-chromatin landscapes that foreshadow their regional identities. Downstream, the anterior
  territory resolves into FOXG1/SIX3 forebrain and EN1 midbrain progenitors, and the posterior territory
  into MAFB/HNF1B/HOXA3 rhombomere 5/6 hindbrain progenitors. Grounded in GO:0021999 (neural plate anterior/posterior
  regionalization). Upstream neural-versus-epidermal ectoderm allocation is supplied by modules/germ_layer_specification.yaml
  and modules/body_axis_specification.yaml; the signalling machinery is detailed in the fgfr_signaling,
  retinoic_acid_receptor_signaling, wnt_signaling, bmp_signaling and tgfb_smad_signaling modules; the
  cerebellar program that continues from the posterior territory''s rhombomere 1 is in modules/cerebellum_development.yaml.'
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: GO:0021999
  title: neural plate anterior/posterior regionalization
  statement: The module is grounded in the GO term for anteroposterior regionalization of the neural
    plate.
- source_id: PMID:42760324
  title: Two parallel neural ectoderm progenitors contribute to the developing brain.
  statement: Lineage tracing in mouse embryos and directed differentiation of human pluripotent stem
    cells establish that anterior and posterior neural ectoderm arise in parallel during gastrulation
    and are already committed to forebrain/midbrain versus hindbrain fates.
  supporting_text: 'Two parallel brain progenitors emerge simultaneously during gastrulation: anterior
    neural ectoderm (forebrain/midbrain progenitor) and posterior neural ectoderm (hindbrain progenitor).'
- source_id: PMID:10490024
  title: A role for Gbx2 in repression of Otx2 and positioning the mid/hindbrain organizer.
  statement: The shared OTX2/GBX2 border is instructive for organizer position, not a readout of it.
  supporting_text: We propose that formation of a normal MHB organizer depends on a sharp Otx2 caudal
    border and that Gbx2 is required to position and sharpen this border.
- source_id: PMID:7588062
  title: Forebrain and midbrain regions are deleted in Otx2-/- mutants due to a defective anterior neuroectoderm
    specification during gastrulation.
  statement: Loss of the anterior selector deletes the forebrain and midbrain through failed specification
    at gastrulation rather than later degeneration.
  supporting_text: These data suggest that Otx2 expression in endomesoderm and ectoderm is required
    for anterior neuroectoderm specification.
- source_id: file:human/OTX2/OTX2-ai-review.yaml
  title: OTX2 gene review
  statement: The anterior selector exemplar is reviewed in-repo, including the proposed GO:0030917 annotation
    that this module's selector-boundary part asserts.
- source_id: file:human/GBX2/GBX2-ai-review.yaml
  title: GBX2 gene review
  statement: The posterior selector exemplar is reviewed in-repo.
- source_id: file:modules/neural_ectoderm_anteroposterior_specification-deep-research-falcon.md
  title: Module deep research (falcon)
  statement: 'Independent module-level review, run after the module was drafted. It arrived at the same
    boundary decisions - treating neural induction, neural plate border specification, neuromesodermal/spinal-cord
    specification, isthmic-organizer signalling and the later regional programs as separate - and supplied
    three refinements that were folded in: the asymmetry of the two selector repression arms, the fact
    that the domains arise apart and are sharpened on contact rather than toggled, and the limits of
    the deuterostome conservation claim. Its cautions are recorded as knowledge_gaps.'
notes: 'Scope and boundary decisions. (1) The module starts at neural ectoderm, not at the epiblast:
  allocation of ectoderm to neural versus border versus surface fate under the BMP gradient already
  lives in germ_layer_specification, and duplicating it here would restate the same BMP switch twice.
  What is genuinely absent from the repo, and what this module supplies, is everything between "neural
  ectoderm exists" and "the brain has regions". (2) WNT is deliberately excluded from the posteriorising
  input even though it is a posteriorising signal. WNT activation at this stage specifies TBXT/CDX2
  neuromesodermal progenitors and spinal cord, a parallel route that produces a different kind of posterior
  character; posterior neural ectoderm is induced by FGF and retinoic acid under WNT inhibition, and
  in the embryo lies outside the domain of active WNT signalling. Modelling WNT as an input here would
  merge two distinct posterior programs. It re-enters legitimately one step later, as an inducer of
  midbrain identity within the anterior territory and of hindbrain progenitors within the posterior
  one. (3) The exemplars are curated human UniProt accessions used to orient conserved roles; the program
  itself is not human-specific. Mutually exclusive otx-positive and gbx-positive ectoderm has been observed
  in mouse, macaque, chicken and zebrafish, and in the hemichordate Saccoglossus kowalevskii, so the
  scope is set at Deuterostomia rather than Vertebrata. (4) Gene-review coverage is uneven and the derived
  QC panel will say so: OTX2, GBX2, SOX2, FGF8 and EN1 have reviews in this repo; ALDH1A2, HOXA1, FOXG1,
  SIX3, MAFB, HNF1B and HOXA3 do not yet. The UniProt groundings are exact regardless, so the leaves
  are grounded even where the gene review is missing.'
module:
  id: neural_ectoderm_anteroposterior_specification
  label: Anteroposterior specification of neural ectoderm
  module_type: DEVELOPMENTAL_PROCESS
  description: Subdivision of gastrula-stage neural ectoderm into parallel anterior (forebrain/midbrain)
    and posterior (hindbrain) progenitor populations, by a graded FGF plus retinoic acid input read
    out through mutual repression between the OTX2 and GBX2 selectors.
  concepts:
  - preferred_term: neural plate anterior/posterior regionalization
    term:
      id: GO:0021999
      label: neural plate anterior/posterior regionalization
    description: Partitioning of the neural plate/early neural ectoderm into distinct territories along
      the anteroposterior axis.
  context:
    taxa:
    - preferred_term: deuterostomes
      term:
        id: NCBITaxon:33511
        label: Deuterostomia
      description: 'Mutually exclusive otx-positive and gbx-positive ectoderm is present in mouse, macaque,
        chicken, zebrafish and the hemichordate Saccoglossus kowalevskii, so the selector pair predates
        chordates; the same otx-anterior/gbx/hox-posterior topography extends further, into the annelid
        Platynereis dumerilii. Note what is and is not claimed at this scope: the expression topography
        is ancient and broadly conserved, whereas the lineage-restriction claim that distinguishes this
        module from progressive posteriorisation has so far been demonstrated only in mouse and in human
        pluripotent-stem-cell models. Comparable expression domains are not by themselves evidence of
        homologous lineage restriction.'
    cellular_components:
    - preferred_term: nucleus
      term:
        id: GO:0005634
        label: nucleus
      description: Compartment in which the selector transcription factors act.
  annotons:
  - id: ne_sox2
    label: SOX2 neural ectoderm identity factor
    participant:
      selector_type: GENE_PRODUCT
      gene_product:
        preferred_term: SOX2
        term:
          id: UniProtKB:P48431
          label: Transcription factor SOX-2
        description: SoxB1 factor marking neural ectoderm throughout this module; both the anterior
          and the posterior territory are SOX2-positive, and the anteroposterior selectors are superimposed
          on this shared identity rather than replacing it (see file:human/SOX2/SOX2-ai-review.yaml).
    function:
      preferred_term: DNA-binding transcription factor activity
      term:
        id: GO:0000981
        label: DNA-binding transcription factor activity, RNA polymerase II-specific
    processes:
    - preferred_term: neural plate anterior/posterior regionalization
      term:
        id: GO:0021999
        label: neural plate anterior/posterior regionalization
    locations:
    - preferred_term: nucleus
      term:
        id: GO:0005634
        label: nucleus
    role_description: Shared neural ectoderm marker defining the population that this module subdivides;
      it is the label used to identify both progenitors and does not itself carry regional information.
    evidence:
    - source_id: PMID:42760324
      title: Two parallel neural ectoderm progenitors contribute to the developing brain.
      statement: Both progenitors are defined within the SOX2-positive neural ectoderm compartment,
        distinguished by OTX2 versus GBX2.
      supporting_text: 'Two parallel brain progenitors emerge simultaneously during gastrulation: anterior
        neural ectoderm (forebrain/midbrain progenitor) and posterior neural ectoderm (hindbrain progenitor).'
  parts:
  - order: 1
    role: extracellular input that biases identity posteriorly
    node:
      id: posteriorising_signal_input
      label: Graded FGF and retinoic acid posteriorising input
      module_type: REGULATORY_STEP
      description: 'The extracellular input that biases neural ectoderm towards posterior identity.
        FGF and retinoic acid are combinatorially required: either alone is insufficient to induce GBX2
        and repress OTX2. In the embryo both sources lie adjacent to the prospective posterior territory,
        and the territory itself is outside the domain of active WNT signalling.'
      concepts:
      - preferred_term: positive regulation of posterior neural plate formation by FGF receptor signaling
        term:
          id: GO:0060787
          label: positive regulation of posterior neural plate formation by fibroblast growth factor
            receptor signaling pathway
      - preferred_term: retinoic acid receptor signaling pathway
        term:
          id: GO:0048384
          label: retinoic acid receptor signaling pathway
      annotons:
      - id: fgf_posteriorising_ligand
        label: Posteriorising FGF ligand
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: FGF8
            term:
              id: UniProtKB:P55075
              label: Fibroblast growth factor 8
            description: Exemplar of the FGF ligand supplied from tissue adjacent to the prospective
              posterior neural ectoderm; FGF8 is the family member whose expression domain abuts the
              gbx-positive territory and which later marks the isthmic organizer itself (see file:human/FGF8/FGF8-ai-review.yaml).
        function:
          preferred_term: growth factor activity
          term:
            id: GO:0008083
            label: growth factor activity
        processes:
        - preferred_term: positive regulation of posterior neural plate formation by FGF receptor signaling
          term:
            id: GO:0060787
            label: positive regulation of posterior neural plate formation by fibroblast growth factor
              receptor signaling pathway
        locations:
        - preferred_term: extracellular region
          term:
            id: GO:0005576
            label: extracellular region
        role_description: Secreted posteriorising signal; required together with retinoic acid to induce
          the posterior selector and repress the anterior one.
        evidence:
        - source_id: PMID:42760324
          title: Two parallel neural ectoderm progenitors contribute to the developing brain.
          statement: FGF and retinoic acid activation with BMP, TGF-beta and WNT blockade specifies
            posterior neural ectoderm from human definitive ectoderm in 24 h, and neither signal suffices
            alone.
          notes: Cached publication record is abstract-only; statement summarises the article rather
            than quoting it.
      - id: retinoic_acid_source
        label: Retinoic acid synthesising enzyme
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: ALDH1A2
            term:
              id: UniProtKB:O94788
              label: Retinal dehydrogenase 2
            description: RALDH2, the retinaldehyde dehydrogenase whose expression domain lies immediately
              adjacent to the posterior neural ectoderm and which supplies the retinoic acid arm of
              the posteriorising input. Placed here as the source of the signal, not as a member of
              the neural ectoderm itself.
        function:
          preferred_term: retinal dehydrogenase (NAD+) activity
          term:
            id: GO:0001758
            label: retinal dehydrogenase (NAD+) activity
        processes:
        - preferred_term: retinoic acid biosynthetic process
          term:
            id: GO:0002138
            label: retinoic acid biosynthetic process
        locations:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        role_description: Generates the retinoic acid that, with FGF, is combinatorially required to
          induce posterior neural ectoderm identity.
        evidence:
        - source_id: PMID:42760324
          title: Two parallel neural ectoderm progenitors contribute to the developing brain.
          statement: In situ staining places the retinoic acid synthesis enzyme Raldh2/Aldh1a2 adjacent
            to posterior neural ectoderm in the E7.5 mouse embryo.
          notes: Cached publication record is abstract-only; statement summarises the article rather
            than quoting it.
    notes: WNT is not modelled as an input to this part. In the E7.5 embryo the gbx-positive territory
      is largely devoid of WNT reporter activity, WNT activity instead marks the posterior-most region
      where TBXT/CDX2 neuromesodermal and spinal cord progenitors lie, and posterior neural ectoderm
      induction in vitro requires WNT inhibition. FGF plus retinoic acid and WNT therefore produce two
      different kinds of posterior character, and conflating them would merge the hindbrain and spinal
      cord routes.
  - order: 2
    role: the mutually repressive selector pair that partitions the territory
    node:
      id: ap_selector_boundary
      label: Mutually repressive OTX2/GBX2 selector boundary
      module_type: DEVELOPMENTAL_PROCESS
      description: 'The core of the module. Two homeodomain selectors occupy complementary territories
        within neural ectoderm and repress one another, producing a sharp interface. The interface is
        where the midbrain-hindbrain organizer assembles, and it is instructive for organizer position:
        shifting the border relocates the organizer and correspondingly expands or reduces the brain
        regions on either side. It positions and refines organizer competence rather than being a sufficient
        linear switch - FGF8 can be initiated in neuroectoderm lacking both selectors in some experimental
        contexts. The domains also arise independently before they meet and are sharpened on contact
        rather than resolved by a single instantaneous toggle: in chick they are separate at HH4-HH8,
        overlap slightly around HH9, and are contiguous and mutually exclusive by HH10.'
      concepts:
      - preferred_term: midbrain-hindbrain boundary development
        term:
          id: GO:0030917
          label: midbrain-hindbrain boundary development
      variant_sets:
      - id: ap_neural_ectoderm_identity
        label: Parallel anterior and posterior neural ectoderm progenitors
        axis: anteroposterior neural ectoderm identity
        selection: EXACTLY_ONE
        variants:
        - id: anterior_neural_ectoderm
          label: Anterior neural ectoderm (forebrain/midbrain progenitor)
          module_type: DEVELOPMENTAL_PROCESS
          description: SOX2-positive, OTX2-positive, GBX2-negative territory induced by BMP, TGF-beta
            and WNT inhibition in the absence of FGF and retinoic acid. Committed to forebrain and midbrain
            fate; it does not acquire hindbrain identity when challenged with hindbrain-inducing signals.
          concepts:
          - preferred_term: anterior neural plate formation
            term:
              id: GO:0090017
              label: anterior neural plate formation
          annotons:
          - id: ane_otx2
            label: OTX2 anterior identity selector
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: OTX2
                term:
                  id: UniProtKB:P32243
                  label: Homeobox protein OTX2
                description: Bicoid-class homeodomain selector defining anterior neural identity; its
                  caudal border is the site of isthmic organizer formation (see file:human/OTX2/OTX2-ai-review.yaml).
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
            - preferred_term: midbrain-hindbrain boundary development
              term:
                id: GO:0030917
                label: midbrain-hindbrain boundary development
            - preferred_term: forebrain development
              term:
                id: GO:0030900
                label: forebrain development
            - preferred_term: midbrain development
              term:
                id: GO:0030901
                label: midbrain development
            locations:
            - preferred_term: nucleus
              term:
                id: GO:0005634
                label: nucleus
            role_description: Anterior selector. Confers forebrain/midbrain competence and, by the caudal
              limit of its domain, sets where along the axis the organizer forms.
            evidence:
            - source_id: PMID:7588062
              title: Forebrain and midbrain regions are deleted in Otx2-/- mutants due to a defective
                anterior neuroectoderm specification during gastrulation.
              statement: Loss of the selector removes the forebrain and midbrain through failed specification
                during gastrulation.
              supporting_text: By 9.5 dpc, homozygous mutant embryos are characterized by the absence
                of forebrain and midbrain regions.
            - source_id: PMID:42760324
              title: Two parallel neural ectoderm progenitors contribute to the developing brain.
              statement: Human OTX2-positive anterior neural ectoderm is lineage committed and does
                not convert to hindbrain under hindbrain-inducing signals.
              supporting_text: Differentiation of human pluripotent stem cells into anterior or posterior
                neural ectoderm-like cells revealed these were lineage committed to forebrain/midbrain
                versus hindbrain fates, respectively.
        - id: posterior_neural_ectoderm
          label: Posterior neural ectoderm (hindbrain progenitor)
          module_type: DEVELOPMENTAL_PROCESS
          description: SOX2-positive, GBX2-positive, OTX2-low territory induced by FGF and retinoic
            acid under BMP, TGF-beta and WNT blockade, additionally expressing anterior HOX genes. Committed
            to hindbrain fate and negative for the neuromesodermal and spinal cord markers TBXT and
            CDX2, which distinguishes it from the WNT-dependent posterior route.
          concepts:
          - preferred_term: posterior neural plate formation
            term:
              id: GO:0090018
              label: posterior neural plate formation
          annotons:
          - id: pne_gbx2
            label: GBX2 posterior identity selector
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GBX2
                term:
                  id: UniProtKB:P52951
                  label: Homeobox protein GBX-2
                description: Homeodomain selector conferring anterior-hindbrain identity by repressing
                  the anterior selector and sharpening its border (see file:human/GBX2/GBX2-ai-review.yaml).
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
            - preferred_term: midbrain-hindbrain boundary development
              term:
                id: GO:0030917
                label: midbrain-hindbrain boundary development
            - preferred_term: hindbrain development
              term:
                id: GO:0030902
                label: hindbrain development
            locations:
            - preferred_term: nucleus
              term:
                id: GO:0005634
                label: nucleus
            role_description: Posterior selector. Represses the anterior selector, positions and sharpens
              the shared border, and confers hindbrain competence.
            evidence:
            - source_id: PMID:10490024
              title: A role for Gbx2 in repression of Otx2 and positioning the mid/hindbrain organizer.
              statement: Loss of the posterior selector allows the anterior domain to expand posteriorly,
                and ectopic expression shifts the border rostrally with a functional organizer forming
                at the new position.
              supporting_text: we transiently expressed Gbx2 in the caudal Otx2 domain and found that
                the Otx2 caudal border was indeed shifted rostrally and a normal appearing organizer
                formed at this new Otx2 border.
          - id: pne_hox_anterior
            label: Anterior HOX posterior-character factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HOXA1
                term:
                  id: UniProtKB:P49639
                  label: Homeobox protein Hox-A1
                description: Exemplar of the paralogue-group-1 HOX factors (HOXA1, HOXB1) that are induced
                  together with the posterior selector and supply hindbrain-level positional identity.
                  Listed as an exemplar of the anterior HOX role, not as the sole member.
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
            - preferred_term: hindbrain development
              term:
                id: GO:0030902
                label: hindbrain development
            locations:
            - preferred_term: nucleus
              term:
                id: GO:0005634
                label: nucleus
            role_description: Supplies anteroposterior positional identity within the posterior territory,
              distinguishing hindbrain level from the more caudal spinal cord program.
            evidence:
            - source_id: PMID:42760324
              title: Two parallel neural ectoderm progenitors contribute to the developing brain.
              statement: Posterior neural ectoderm expresses the posterior markers Hoxa1 and Hoxb1 in
                vivo and HOXA1 in the human in vitro system.
              notes: Cached publication record is abstract-only; statement summarises the article rather
                than quoting it.
      connections:
      - source: ane_otx2
        target: pne_gbx2
        connection_type: NEGATIVELY_REGULATES
        description: 'The anterior selector helps exclude posterior identity from its territory. This
          arm is the weaker of the two and is asserted as such: it rests on complementary, non-overlapping
          expression domains and on reciprocal mutant phenotypes (OTX loss produces anterior and midbrain
          competence defects and repositions Fgf8), not on demonstrated occupancy of the posterior selector''s
          regulatory elements. Direct enhancer occupancy and the symmetry of the two arms remain incompletely
          defined across vertebrates.'
        notes: Asymmetry recorded deliberately rather than smoothed over. Modelling the pair as a symmetric
          toggle would overstate the anterior arm.
      - source: pne_gbx2
        target: ane_otx2
        connection_type: NEGATIVELY_REGULATES
        description: 'The posterior selector represses the anterior one and thereby positions and sharpens
          the shared border. This is the directional arm with gain- and loss-of-function support: without
          it the anterior domain expands posteriorly, and forcing it inside the anterior domain relocates
          the border and the organizer.'
        evidence:
        - source_id: PMID:10490024
          title: A role for Gbx2 in repression of Otx2 and positioning the mid/hindbrain organizer.
          statement: A sharp anterior-selector border, maintained by the posterior selector, is required
            for a normal midbrain-hindbrain organizer.
          supporting_text: We propose that formation of a normal MHB organizer depends on a sharp Otx2
            caudal border and that Gbx2 is required to position and sharpen this border.
        notes: This is the arm with both loss- and gain-of-function support in vivo, which is why the
          two arms are described differently.
      evidence:
      - source_id: file:modules/neural_ectoderm_anteroposterior_specification-deep-research-falcon.md
        title: Module deep research (falcon)
        statement: Independent review flags the asymmetry of the two repression arms and the chick timing
          of domain establishment, and cautions against reading the selector pair as a universally sufficient
          switch for organizer induction.
        supporting_text: OTX proteins reciprocally help exclude posterior identities and regulate midbrain
          competence, but “mutual repression” should be interpreted carefully.
  - order: 3
    role: regional progenitors each territory is committed to produce
    node:
      id: committed_regional_output
      label: Committed regional progenitor output
      module_type: DEVELOPMENTAL_PROCESS
      description: 'The regional progenitors each territory produces. This part exists to make the commitment
        claim modelable: the outputs are determined by which selector territory a cell came from rather
        than by the regional signals it later encounters, so the two branches do not interconvert even
        when given the other branch''s inducing conditions. WNT re-enters here legitimately, as an instructive
        signal within each territory rather than as an input to the anteroposterior split.'
      variant_sets:
      - id: regional_progenitor_outputs
        label: Regional progenitors produced by each neural ectoderm territory
        axis: brain region produced
        selection: EXACTLY_ONE
        variants:
        - id: forebrain_midbrain_progenitors
          label: Forebrain and midbrain progenitors (from anterior neural ectoderm)
          module_type: DEVELOPMENTAL_PROCESS
          description: Anterior neural ectoderm bifurcates into FOXG1/SIX3 forebrain progenitors when
            the posteriorising signals WNT and BMP are blocked and FGF is active, or into EN1 midbrain
            progenitors when WNT and FGF are active - consistent with the posterior WNT gradient across
            the developing forebrain and midbrain in vivo.
          concepts:
          - preferred_term: forebrain regionalization
            term:
              id: GO:0021871
              label: forebrain regionalization
          - preferred_term: midbrain development
            term:
              id: GO:0030901
              label: midbrain development
          annotons:
          - id: fb_foxg1
            label: FOXG1 telencephalic progenitor factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FOXG1
                term:
                  id: UniProtKB:P55316
                  label: Forkhead box protein G1
                description: Forkhead factor marking committed forebrain progenitors derived from anterior
                  neural ectoderm.
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
            - preferred_term: forebrain regionalization
              term:
                id: GO:0021871
                label: forebrain regionalization
            locations:
            - preferred_term: nucleus
              term:
                id: GO:0005634
                label: nucleus
            role_description: Marks and drives the forebrain branch of the anterior territory.
          - id: fb_six3
            label: SIX3 rostral forebrain factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SIX3
                term:
                  id: UniProtKB:O95343
                  label: Homeobox protein SIX3
                description: Homeodomain factor co-induced with FOXG1 in forebrain progenitors under
                  WNT and BMP inhibition.
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
            - preferred_term: forebrain regionalization
              term:
                id: GO:0021871
                label: forebrain regionalization
            locations:
            - preferred_term: nucleus
              term:
                id: GO:0005634
                label: nucleus
            role_description: Rostral forebrain identity factor within the anterior branch.
          - id: mb_en1
            label: EN1 midbrain identity factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EN1
                term:
                  id: UniProtKB:Q05925
                  label: Homeobox protein engrailed-1
                description: Engrailed factor marking midbrain progenitors; induced from anterior neural
                  ectoderm by combined WNT and FGF activation (see file:human/EN1/EN1-ai-review.yaml).
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
            processes:
            - preferred_term: midbrain development
              term:
                id: GO:0030901
                label: midbrain development
            locations:
            - preferred_term: nucleus
              term:
                id: GO:0005634
                label: nucleus
            role_description: Marks the midbrain branch of the anterior territory, induced where WNT
              activity is high across the anterior neural plate.
        - id: rhombomere_5_6_progenitors
          label: Rhombomere 5/6 hindbrain progenitors (from posterior neural ectoderm)
          module_type: DEVELOPMENTAL_PROCESS
