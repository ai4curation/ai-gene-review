    evidence:
    - source_id: PMID:42760324
      title: Two parallel neural ectoderm progenitors contribute to the developing brain.
      statement: 'Each territory produces only its own regional progenitors: posterior neural ectoderm
        challenged with forebrain- or midbrain-inducing signals largely fails to acquire those identities,
        and anterior neural ectoderm challenged with hindbrain conditions fails to become hindbrain.
        Human rhombomere 5/6 progenitors expressing MAFB, HNF1B and HOXA3 were generated from posterior
        neural ectoderm.'
      notes: Cached publication record is abstract-only; statement summarises the article rather than
        quoting it.
  connections:
  - source: posteriorising_signal_input
    target: ap_selector_boundary
    connection_type: PROVIDES_INPUT_FOR
    description: Combined FGF and retinoic acid activity is the extracellular input that selects the
      posterior branch of the selector variant set; in its absence, and under BMP, TGF-beta and WNT
      inhibition, neural ectoderm adopts the anterior branch by default.
  - source: ap_selector_boundary
    target: committed_regional_output
    connection_type: PRECEDES
    description: Selector identity is established first and constrains what regional progenitors can
      subsequently be induced; the chromatin landscapes of the two territories diverge before overt
      regional identity appears, which is the proposed mechanism of the commitment.
  - source: ne_sox2
    target: ap_selector_boundary
    connection_type: PART_OF
    description: The selector boundary is drawn within the SOX2-positive neural ectoderm population,
      not between it and another germ layer derivative.
knowledge_gaps:
- gap_statement: Whether a transient pan-brain progenitor exists in vivo between the emergence of the
    ectoderm germ layer and the bifurcation of anterior and posterior neural ectoderm is not established.
  boundary: 'Root module: the parallel-progenitor premise itself.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: The module is built on the two-progenitor model rather than on progressive posteriorisation
    (activation-transformation). Current evidence supports aspects of both, and the authors of the defining
    study state explicitly that a brief pan-brain progenitor cannot be excluded. Prospective clonal
    recording from pre-gastrulation through organogenesis is what would settle it.
  resolution: Prospective clonal lineage recording spanning the ectoderm-to-neural-ectoderm interval,
    rather than the sparse retrospective labelling currently available.
- gap_statement: How direct the OTX2-GBX2 repression is, and whether the two arms are mechanistically
    symmetric, is not known.
  boundary: 'ap_selector_boundary: the two NEGATIVELY_REGULATES connections.'
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: GBX2 restriction of OTX2 has loss- and gain-of-function support in vivo. The reciprocal
    arm rests on complementary domains and reciprocal phenotypes; direct enhancer occupancy, cofactor
    requirements and cross-species generality are undefined. The module asserts both arms but describes
    them differently for this reason.
  resolution: Occupancy mapping of each selector at the other's regulatory elements in a common system,
    with enhancer deletion to test necessity.
- gap_statement: Whether FGF and retinoic acid act as graded instructive signals or as permissive gates
    for the anteroposterior decision is not resolved.
  boundary: posteriorising_signal_input.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Culture perturbations establish necessity, combinatorial requirement and dose dependence,
    but in vivo measurements linking ligand concentration, exposure duration and receptor occupancy
    to selector choice are limited. The module models the input as required and combinatorial, which
    is what the evidence supports, and does not assert a gradient readout.
  resolution: Quantitative in vivo signalling reporters with controlled dose and duration, read out
    against selector choice in single cells.
- gap_statement: What establishes the initial OTX2 and GBX2 domains before the two territories come
    into contact is unknown.
  boundary: 'ap_selector_boundary: upstream of the mutual-repression connections.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Chick timing shows the domains arise apart and are sharpened on contact, so mutual repression
    refines a partition it did not create. The enhancers that integrate axial signalling into the initial
    selector choice are not characterised.
  resolution: Identification and perturbation of the early selector enhancers that read the axial input.
- gap_statement: Whether the divergent chromatin landscapes of the two territories cause commitment
    or merely correlate with it has not been tested.
  boundary: 'committed_regional_output: the PRECEDES connection from ap_selector_boundary.'
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  status: OPEN
  significance: Accessibility profiling implicates OTX2, HOX, HNF1B, MAFB, ETV1 and RAR/RXR motifs and
    shows that inappropriate regional cues do not erase the starting landscape. That establishes resistance
    to the signals tested, not irreversibility under genetic or epigenetic intervention, and the module's
    commitment claim should be read at that strength.
  resolution: Enhancer deletion, pioneer-factor perturbation and chromatin-remodeller manipulation to
    distinguish causal accessibility from correlated accessibility.
