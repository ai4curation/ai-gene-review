id: MODULE:calvin_benson_bassham_cycle
title: Calvin-Benson-Bassham reductive pentose-phosphate cycle
description: >-
  Carbon fixation by the Calvin-Benson-Bassham reductive pentose-phosphate
  cycle, as a taxon-neutral decomposition: Rubisco carboxylation of ribulose
  1,5-bisphosphate, reduction of 3-phosphoglycerate to triose phosphate, and
  regeneration of the acceptor. Two regulatory parts travel with the cycle
  because they act on its own enzymes: Rubisco activase, which removes
  inhibitory sugar phosphates from Rubisco active sites, and the CP12 redox
  scaffold, which assembles an autoinhibitory PRK-GAPDH complex in the dark and
  releases it on thioredoxin/NTRC reduction. The cycle consumes the ATP and
  NADPH produced by MODULE:thylakoid_light_reactions, and is the Rubisco
  compartment that carbon-concentrating mechanisms feed, including the algal
  MODULE:pyrenoid_ccm. It is not restricted to oxygenic phototrophs: the same
  cycle fixes carbon in anoxygenic phototrophs and in chemoautotrophs, which is
  why it is modelled separately from photosynthesis. The non-CBB fixation
  routes are siblings rather than parts: MODULE:reductive_tca_cycle,
  MODULE:wood_ljungdahl_pathway and MODULE:hydroxypropionate_bicycle. The
  carbon-concentrating mechanisms that raise CO2 at this cycle's Rubisco are
  also siblings: MODULE:c4_carbon_shuttle and MODULE:cam_carbon_shuttle each
  include this module by reference, while MODULE:pyrenoid_ccm does not - it
  models Rubisco carboxylation inline and carries no module_ref - so it feeds
  this cycle in biology without composing it in the model. Converting it is a
  separate change against that module.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: file:modules/photosynthesis-deep-research-falcon.md
    title: Photosynthesis module deep research (falcon)
    statement: >-
      Module-targeted falcon deep research, generated for the parent oxygenic
      photosynthesis module from which this module was extracted, used to
      cross-check component coverage, variants, and failure modes.
      Machine-generated citations are not yet manually adjudicated.
  - source_id: file:terms/photosynthesis/photosynthesis-notes.md
    title: Photosynthesis concept notes
    statement: >-
      Concept notes behind the module-by-module component breakdown across
      Arabidopsis, Synechocystis and Chlamydomonas.
notes: >-
  Extracted from MODULE:oxygenic_photosynthesis, which now includes this module
  by reference, so that each module stays small enough to read and can be
  reused on its own. Identifiers are grounded only where verified against the
  local GO term cache, GOlr, or UniProt; descriptors without a `term` are
  deliberate (no confident identifier yet) rather than oversights.
  Representative UniProt members are concrete orienting examples, not
  exhaustive or species-restricting claims.
module:
  id: calvin_benson_bassham_cycle
  label: Calvin-Benson-Bassham reductive pentose-phosphate cycle
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: reductive pentose-phosphate cycle
      term:
        id: GO:0019253
        label: reductive pentose-phosphate cycle
    - preferred_term: carbon fixation
      term:
        id: GO:0015977
        label: carbon fixation
  parts:
    - order: 1
      role: carboxylation
      node:
        id: rubisco_carboxylation
        label: Rubisco carboxylation of RuBP
        module_type: REACTION
        annotons:
          - id: rubisco_activity
            label: Ribulose-bisphosphate carboxylase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: ribulose-bisphosphate carboxylase activity
                term:
                  id: GO:0016984
                  label: ribulose-bisphosphate carboxylase activity
              description: >-
                Form I Rubisco (L8S8, RbcL+RbcS) in plants, algae, and
                cyanobacteria; form II (L2) in some bacteria/dinoflagellates.
            function:
              preferred_term: ribulose-bisphosphate carboxylase activity
              term:
                id: GO:0016984
                label: ribulose-bisphosphate carboxylase activity
              substrates:
                - preferred_term: ribulose 1,5-bisphosphate
                - preferred_term: CO2
              products:
                - preferred_term: 3-phosphoglycerate
            locations:
              - preferred_term: chloroplast stroma / cyanobacterial cytoplasm
                term:
                  id: GO:0009570
                  label: chloroplast stroma
            role_description: >-
              Fixes CO2 onto RuBP. The competing oxygenase reaction with O2
              produces 2-phosphoglycolate (the substrate of photorespiration).
            evidence:
              - source_id: PMID:18294858
                statement: Rubisco as the principal carboxylating enzyme with a competing oxygenase activity.
    - order: 2
      role: reduction phase
      node:
        id: cbb_reduction_phase
        label: Reduction of 3-phosphoglycerate to triose phosphate
        module_type: METABOLIC_PATHWAY
        description: >-
          ATP- and NADPH-consuming reduction of 3-phosphoglycerate via
          1,3-bisphosphoglycerate to glyceraldehyde 3-phosphate
          (phosphoglycerate kinase + chloroplastic NADP-GAPDH).
        annotons:
          - id: cbb_gapdh
            label: NADP-dependent glyceraldehyde-3-phosphate dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: chloroplastic GAPDH (GapA/GapB)
            function:
              preferred_term: glyceraldehyde-3-phosphate dehydrogenase (NADP+) (phosphorylating) activity
              description: NADPH-consuming reduction step; no confident exact GO MF id asserted here.
              substrates:
                - preferred_term: 1,3-bisphosphoglycerate
                - preferred_term: NADPH
              products:
                - preferred_term: glyceraldehyde 3-phosphate
                - preferred_term: NADP+
    - order: 3
      role: regeneration phase
      node:
        id: cbb_regeneration_phase
        label: Regeneration of ribulose 1,5-bisphosphate
        module_type: METABOLIC_PATHWAY
        description: >-
          Rearrangement of triose phosphates through transketolase,
          aldolase, fructose-1,6-bisphosphatase, and sedoheptulose-1,7-
          bisphosphatase, ending in phosphoribulokinase regeneration of RuBP.
        annotons:
          - id: cbb_prk
            label: Phosphoribulokinase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: phosphoribulokinase activity
                term:
                  id: GO:0008974
                  label: phosphoribulokinase activity
            function:
              preferred_term: phosphoribulokinase activity
              term:
                id: GO:0008974
                label: phosphoribulokinase activity
              substrates:
                - preferred_term: ribulose 5-phosphate
                - preferred_term: ATP
              products:
                - preferred_term: ribulose 1,5-bisphosphate
                - preferred_term: ADP
            role_description: Regenerates the Rubisco substrate; a major redox-regulated control point.
          - id: cbb_sbpase_fbpase
            label: Bisphosphatase regeneration steps (FBPase, SBPase)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: chloroplast FBPase / SBPase
            function:
              preferred_term: bisphosphatase regeneration steps
              description: >-
                Fructose-1,6-bisphosphatase and sedoheptulose-1,7-
                bisphosphatase; SBPase is a frequent yield-engineering target.
    - order: 4
      role: Rubisco activation and inhibitor repair
      optional: true
      node:
        id: rubisco_activation
        label: Rubisco activase and inhibitor removal
        module_type: REGULATORY_STEP
        annotons:
          - id: rubisco_activase
            label: Rubisco activase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Rubisco activase (Rca)
            function:
              preferred_term: ATP-dependent removal of inhibitory sugar phosphates from Rubisco
              description: AAA+ chaperone-like remodeling of Rubisco active sites; thermolabile.
            role_description: Restores catalytically competent Rubisco; major thermal-tolerance target.
    - order: 5
      role: redox gating of the CBB cycle
      optional: true
      node:
        id: cbb_redox_regulation
        label: CP12-mediated redox regulation
        module_type: REGULATORY_STEP
        annotons:
          - id: cp12_scaffold
            label: CP12 redox scaffold
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CP12
                representative_members:
                  - preferred_term: Chlamydomonas CP12
                    term:
                      id: UniProtKB:A6Q0K5
                      label: Calvin cycle protein CP12
            function:
              preferred_term: redox-dependent scaffolding of the PRK-GAPDH-CP12 ternary complex
              description: >-
                In the dark/oxidizing conditions CP12 assembles an
                autoinhibitory PRK-GAPDH complex; reduction (thioredoxin/
                NTRC) dissociates it to activate the cycle.
              targets:
                - preferred_term: phosphoribulokinase
                - preferred_term: glyceraldehyde-3-phosphate dehydrogenase
            role_description: Couples CBB-cycle activity to the light/redox state of the chloroplast.
            evidence:
              - source_id: PMID:33761918
                statement: CP12 forms a PRK-GAPDH ternary complex regulating the CBB cycle.
              - source_id: PMID:37549282
                statement: NTRC-dependent redox control of the PRK-CP12-GAPDH supracomplex.
        connections:
          - source: cp12_scaffold
            target: cbb_prk
            connection_type: NEGATIVELY_REGULATES
            description: CP12 inhibits PRK in the dark/oxidized state.
          - source: cp12_scaffold
            target: cbb_gapdh
            connection_type: NEGATIVELY_REGULATES
            description: CP12 inhibits GAPDH in the dark/oxidized state.
