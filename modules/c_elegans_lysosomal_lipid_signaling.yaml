id: MODULE:c_elegans_lysosomal_lipid_signaling
title: Lysosome-to-nucleus lipid signaling in Caenorhabditis elegans
description: >-
  In the Caenorhabditis elegans intestine, lysosomes send lipid signals to the
  nucleus that adjust fat metabolism and extend lifespan. The TFEB ortholog
  HLH-30 is a basic helix-loop-helix transcription factor that moves into the
  nucleus during fasting, after germline loss or when TOR signalling falls. It
  turns on autophagy and lysosome genes, and with the Max-like factor MXL-3 it
  links lysosomal lipolysis to nutrient supply. The lysosomal acid lipase
  LIPL-4, a homolog of human LIPA, is induced in these conditions and
  hydrolyses lipids at acidic pH inside the lysosome. Its activity raises the
  levels of omega-6 polyunsaturated fatty acids, which promote autophagy, and
  of the N-acylethanolamine oleoylethanolamide (OEA). The intestinal fatty
  acid-binding protein LBP-8 sits on lysosomes and binds OEA and oleic acid
  with high affinity. When LIPL-4 activity is high, LBP-8 enters the nucleus
  through an N-terminal nuclear localization signal. There, OEA binds the
  HNF4-family nuclear receptor NHR-80 directly. NHR-80 works with its partner
  NHR-49, which does not bind OEA, to switch on genes for fatty acid
  desaturation (fat-5, fat-6, fat-7) and mitochondrial beta-oxidation
  (acs-2), as well as lbp-8 itself. The pathway is needed for the long life of
  animals that overexpress LIPL-4 or LBP-8. It is independent of dietary
  restriction.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:25554789
    title: Aging. Lysosomal signaling molecules regulate longevity in Caenorhabditis elegans.
    statement: >-
      Defines the LIPL-4 to LBP-8 to NHR-49/NHR-80 lysosome-to-nucleus
      signalling pathway and identifies OEA as a lipid messenger.
    supporting_text: >-
      In the worm Caenorhabditis elegans, the lysosomal acid lipase LIPL-4
      triggered nuclear translocalization of a lysosomal lipid chaperone
      LBP-8, which promoted longevity by activating the nuclear hormone
      receptors NHR-49 and NHR-80.
  - source_id: PMID:25554789
    title: Aging. Lysosomal signaling molecules regulate longevity in Caenorhabditis elegans.
    statement: OEA binds LBP-8 and NHR-80 and activates NHR-49/NHR-80 target genes.
    supporting_text: >-
      Among them, oleoylethanolamide directly bound to LBP-8 and NHR-80
      proteins, activated transcription of target genes of NHR-49 and NHR-80,
      and promoted longevity in C. elegans.
  - source_id: PMID:23604316
    title: MXL-3 and HLH-30 transcriptionally link lipolysis and autophagy to nutrient availability.
    statement: >-
      MXL-3 and HLH-30 are transcriptional switches that couple lysosomal
      lipolysis and autophagy to nutrient availability.
    supporting_text: >-
      transcriptional switches coupling lysosomal lipolysis and autophagy to
      nutrient availability and controlling fat storage and ageing in
      Caenorhabditis elegans.
  - source_id: PMID:30713071
    title: Lysosomal Signaling Promotes Longevity by Adjusting Mitochondrial Activity.
    statement: >-
      Downstream output: LIPL-4-LBP-8 signalling increases mitochondrial
      beta-oxidation, lowers lipid storage and promotes longevity.
    supporting_text: >-
      We discovered that the induction of specific lysosomal signaling
      mediated by a LIPL-4 lysosomal acid lipase and its lipid chaperone LBP-8
      increases mitochondrial ß-oxidation to reduce lipid storage and promote
      longevity in Caenorhabditis elegans.
  - source_id: file:projects/CAEEL_LYSOSOME_NUCLEUS_LIPID_SIGNALING.md
    title: C. elegans Lysosome-to-Nucleus Lipid Signaling (OEA Pathway) project page
    statement: >-
      Defines the scope used here (signal generation, transport, nuclear
      reception) and lists the downstream targets that are not yet reviewed.
notes: >-
  Boundary. This is a concrete C. elegans signalling module with four
  parts in order: (1) HLH-30/TFEB transcriptional control of the lysosomal
  and autophagy program, an upstream input that induces lipl-4; (2) LIPL-4
  lipolysis in the lysosomal lumen; (3) LBP-8 lipid transfer from lysosome
  to nucleus; (4) the NHR-80/NHR-49 nuclear receptor pair that sets
  transcription of desaturase and beta-oxidation genes. Downstream target
  enzymes (FAT-5/6/7 delta-9 desaturases, ACS-2) are listed as targets but
  not modelled as annotons, because they are not reviewed and they are a
  metabolic output rather than part of the signal. The later mitochondrial
  step (ETC complex II, mtROS, JUN-1; PMID:30713071) is also outside the
  boundary.

  Excluded members. NHR-47 was considered and excluded: its gene review
  finds no published link to lysosomal lipid signalling, OEA or NHR-49/80.
  NHR-66 (NHR-49 partner for sphingolipid and remodelling genes) and NHR-13
  are not part of the OEA axis. DAF-16 and PHA-4 regulate lipl-4 and
  autophagy genes in germline-less animals, but they belong to germline
  longevity signalling, not this module. MXL-3 and the NAPE-PLDs NAPE-1/2
  appear in the text but have no reviews.

  Relation to MODULE:metazoan_autophagosome_biogenesis. HLH-30 induces
  autophagy genes (lgg-1, lgg-2, sqst-1, atg-18), and the omega-6 PUFAs that
  build up with LIPL-4 activity promote autophagy (PMID:23392608). Autophagy
  is in turn needed to keep lipase activity high in germline-less animals
  (PMID:21906946). The autophagy machinery itself is modelled in the
  autophagosome module. Here it is only the context that HLH-30 and the PUFA
  branch feed into.

  OEA source caveat. LIPL-4 is a triacylglycerol lipase, but OEA is made by
  NAPE-specific phospholipase D, and nape-1 loss only halves the longevity
  of LIPL-4 or LBP-8 overexpression. The LIPL-4 annoton therefore asserts
  only lipase activity, and the link from LIPL-4 to OEA is a
  PROVIDES_INPUT_FOR connection, not a reaction product of LIPL-4.
module:
  id: c_elegans_lysosomal_lipid_signaling
  label: Lysosome-to-nucleus lipid signaling in C. elegans
  module_type: SIGNALING_PATHWAY
  description: >-
    HLH-30-induced lysosomal lipolysis by LIPL-4, lysosome-to-nucleus lipid
    transfer by LBP-8, and OEA-activated NHR-80/NHR-49 transcription of lipid
    metabolism genes that promotes longevity.
  concepts:
    - preferred_term: determination of adult lifespan
      term:
        id: GO:0008340
        label: determination of adult lifespan
      description: >-
        Organism-level outcome of the pathway. Specific metabolic processes
        are placed on the annotons.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    anatomical_locations:
      - preferred_term: intestine
        term:
          id: UBERON:0000160
          label: intestine
        description: >-
          lipl-4 and lbp-8 act in intestinal cells. lbp-8 is expressed only in
          the intestine.
    conditions:
      - preferred_term: fasting, germline loss or reduced TOR signalling
  parts:
    - order: 1
      role: TFEB-family transcriptional control of the lysosomal and autophagy program
      notes: >-
        Upstream input. HLH-30 induces lipl-4 together with autophagy and
        lysosome genes. It is not needed for the LBP-8 to NHR-80 relay once
        LIPL-4 activity has been raised.
      node:
        id: hlh30_lysosomal_program
        label: HLH-30/TFEB lysosome and autophagy transcription
        module_type: REGULATORY_STEP
        description: >-
          HLH-30 stays in the cytoplasm in fed animals and moves to the
          nucleus during starvation, germline loss, low TOR activity and
          other longevity states. In the nucleus it activates autophagy
          genes, lysosome genes and lipases. Nuclear entry in germline-less
          animals needs the Mondo complex MML-1/MXL-2 acting through TOR.
        annotons:
          - id: hlh30_tf
            label: HLH-30 bHLH transcription activator
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HLH-30
                term:
                  id: UniProtKB:H2KZZ2
                  label: Helix-loop-helix protein 30
            function:
              preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
              term:
                id: GO:0000981
                label: DNA-binding transcription factor activity, RNA polymerase II-specific
              targets:
                - preferred_term: autophagy genes (lgg-1, unc-51/atg-1)
                - preferred_term: lysosomal genes
                - preferred_term: lysosomal lipase genes (lipl-4 among them)
            processes:
              - preferred_term: lysosome organization
                term:
                  id: GO:0007040
                  label: lysosome organization
              - preferred_term: positive regulation of macroautophagy
                term:
                  id: GO:0016239
                  label: positive regulation of macroautophagy
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Nutrient-responsive transcription factor that sets up the
              lysosomal and autophagic capacity, including lipase induction,
              that the pathway needs.
            evidence:
              - source_id: PMID:23925298
                title: The TFEB orthologue HLH-30 regulates autophagy and modulates longevity in Caenorhabditis elegans.
                statement: >-
                  HLH-30 regulates autophagy and is needed for lifespan
                  extension in six longevity models.
                supporting_text: >-
                  We demonstrate that hlh-30 is essential for the extended
                  lifespan of Caenorhabditis elegans in six mechanistically
                  distinct longevity models, and overexpression of HLH-30
                  extends lifespan.
              - source_id: PMID:27001890
                title: Mondo complexes regulate TFEB via TOR inhibition to promote longevity in response to gonadal signals.
                statement: >-
                  hlh-30 loss impairs autophagic flux and lysosomal function;
                  HLH-30 mainly regulates lgg-1 and unc-51/atg-1.
                supporting_text: >-
                  Previous studies showed that hlh-30 deletion affects
                  autophagic flux and lysosomal function, leading to the
                  accumulation of the lysosomal marker LMP-1::GFP
              - source_id: PMID:27001890
                title: Mondo complexes regulate TFEB via TOR inhibition to promote longevity in response to gonadal signals.
                statement: >-
                  In germline-less animals MML-1/MXL-2 represses LARS-1,
                  lowers TOR signalling and so allows HLH-30 to enter the
                  nucleus.
                supporting_text: >-
                  In germline-less animals, MML-1/MXL-2 transcriptionally
                  repress the leucyl-tRNA synthase LARS-1, a positive effector
                  of the TOR signalling pathway
    - order: 2
      role: lysosomal lipolysis that generates lipid signals
      node:
        id: lipl4_lysosomal_lipolysis
        label: LIPL-4 lysosomal acid lipolysis
        module_type: REACTION
        description: >-
          LIPL-4 is targeted to intestinal lysosomes by its signal peptide and
          hydrolyses lipids at pH 4.5. Overexpressing it in the intestine
          extends mean lifespan by 55%, but only if it reaches the lysosome.
          Higher LIPL-4 activity raises OEA and omega-6 C20 fatty acids
          (arachidonic acid, DGLA).
        annotons:
          - id: lipl4_lipase
            label: LIPL-4 triacylglycerol lipase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LIPL-4
                term:
                  id: UniProtKB:Q94252
                  label: Lipase lipl-4
            function:
              preferred_term: triacylglycerol lipase activity
              term:
                id: GO:0004806
                label: triacylglycerol lipase activity
              substrates:
                - preferred_term: triacylglycerol
              products:
                - preferred_term: fatty acids
              description: >-
                Acid lipase activity in the lysosomal lumen. OEA itself is
                made by NAPE-PLD, so the rise in OEA is an indirect
                consequence of LIPL-4 activity.
            processes:
              - preferred_term: triglyceride catabolic process
                term:
                  id: GO:0019433
                  label: triglyceride catabolic process
            locations:
              - preferred_term: lysosomal lumen
                term:
                  id: GO:0043202
                  label: lysosomal lumen
            role_description: >-
              Signal-generating enzyme whose lysosomal activity raises the
              lipid messengers carried by LBP-8.
            evidence:
              - source_id: PMID:25554789
                title: Aging. Lysosomal signaling molecules regulate longevity in Caenorhabditis elegans.
                statement: >-
                  LIPL-4 is an acid lipase in intestinal lysosomes and must
                  reach the lysosome to extend lifespan.
                supporting_text: >-
                  Lipid hydrolysis activity was decreased in lipl-4(tm4417)
                  loss-of-function mutants at pH 4.5 but not at pH 7.4 (Fig.
                  1A). FLAG-tagged LIPL-4 protein was localized to intestinal
                  lysosomes
              - source_id: PMID:25554789
                title: Aging. Lysosomal signaling molecules regulate longevity in Caenorhabditis elegans.
                statement: LIPL-4 without its signal peptide does not reach the lysosome and does not extend lifespan.
                supporting_text: >-
                  suggesting that the lysosomal activity of LIPL-4 is
                  essential for its longevity effect
              - source_id: PMID:23392608
                title: ω-6 Polyunsaturated fatty acids extend life span through the activation of autophagy.
                statement: >-
                  A fasting-induced lipase enriches omega-6 PUFAs, which
                  activate autophagy and extend lifespan (parallel branch).
                supporting_text: >-
                  Upon fasting, C. elegans induces the expression of a lipase,
                  which in turn leads to an enrichment of ω-6 PUFAs.
    - order: 3
      role: lysosome-to-nucleus lipid transfer
      node:
        id: lbp8_lipid_shuttle
        label: LBP-8 lipid chaperone shuttle
        module_type: TRANSPORT_STEP
        description: >-
          LBP-8 is the only one of nine worm FABPs that is induced by LIPL-4
          overexpression. It is mainly on intestinal lysosomes, and more of it
          moves to the nucleus when LIPL-4 activity is high. LBP-8 binds OEA
          with about three times the affinity it has for C20 fatty acids. Its
          1.3 angstrom structure shows a conserved NLS and the residues that
          bind ligand. LBP-8 without the NLS stays out of the nucleus and
          does not extend lifespan.
        annotons:
          - id: lbp8_lipid_transfer
            label: LBP-8 lipid transfer
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LBP-8
                term:
                  id: UniProtKB:O02324
                  label: Fatty acid-binding protein homolog 8
            function:
              preferred_term: lipid transfer activity
              term:
                id: GO:0120013
                label: lipid transfer activity
              substrates:
                - preferred_term: oleoylethanolamide
                - preferred_term: oleic acid
            processes:
              - preferred_term: intracellular lipid transport
                term:
                  id: GO:0032365
                  label: intracellular lipid transport
            locations:
              - preferred_term: lysosome
                term:
                  id: GO:0005764
                  label: lysosome
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Carries lysosome-derived lipid ligands, mainly OEA, into the
              nucleus to the nuclear receptors.
            evidence:
              - source_id: PMID:25554789
                title: Aging. Lysosomal signaling molecules regulate longevity in Caenorhabditis elegans.
                statement: The LBP-8 NLS is needed for nuclear entry and for lifespan extension.
                supporting_text: >-
                  However, a transgenic strain that constitutively expresses
                  LBP-8 lacking NLS (lbp-8 Tg no NLS) was excluded from nuclei
                  and showed little or no lifespan extension
              - source_id: PMID:25554789
                title: Aging. Lysosomal signaling molecules regulate longevity in Caenorhabditis elegans.
                statement: OEA binds LBP-8 more strongly than the C20 fatty acids do.
                supporting_text: >-
                  In fluorescence-based binding assays, all four lipids bound
                  to LBP-8, and the binding affinity of OEA for LBP-8 was 3
                  times higher than that of the fatty acids
              - source_id: PMID:31292465
                title: Structural characterization of life-extending Caenorhabditis elegans Lipid Binding Protein 8.
                statement: >-
                  The LBP-8 structure shows a conserved NLS and binds oleic
                  acid and OEA with high affinity.
                supporting_text: >-
                  LBP-8 shuttles lysosomal lipids into the nucleus to activate
                  lipid regulated nuclear receptors NHR-49 and NHR-80 and
                  consequently promote longevity.
    - order: 4
      role: OEA-activated nuclear receptor transcription of lipid metabolism genes
      node:
        id: nhr_reception
        label: NHR-80/NHR-49 nuclear receptor output
        module_type: REGULATORY_STEP
        description: >-
          NHR-80 binds OEA directly (Kd about 7.8 uM). NHR-49, its partner,
          does not bind OEA and is thought to act as a co-factor. Both are
          needed for longevity driven by LIPL-4 or LBP-8 and for acs-2
          induction. The NHR-49/NHR-80 pair controls the delta-9 desaturase
          genes, NHR-49 promotes beta-oxidation genes, and NHR-80 is
          specifically needed for germline-loss longevity.
        concepts:
          - preferred_term: positive regulation of fatty acid metabolic process
            term:
              id: GO:0045923
              label: positive regulation of fatty acid metabolic process
        annotons:
          - id: nhr80_oea_receptor
            label: NHR-80 OEA-activated nuclear receptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NHR-80
                term:
                  id: UniProtKB:Q8ITW8
                  label: Nuclear hormone receptor family member nhr-80
            function:
              preferred_term: ligand-modulated transcription factor activity
              term:
                id: GO:0098531
                label: ligand-modulated transcription factor activity
              substrates:
                - preferred_term: oleoylethanolamide (ligand)
              targets:
                - preferred_term: fat-5, fat-6, fat-7 delta-9 desaturase genes
                - preferred_term: acs-2
                - preferred_term: lbp-8
            processes:
              - preferred_term: positive regulation of fatty acid metabolic process
                term:
                  id: GO:0045923
                  label: positive regulation of fatty acid metabolic process
              - preferred_term: determination of adult lifespan
                term:
                  id: GO:0008340
                  label: determination of adult lifespan
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Direct nuclear receptor for OEA that turns the lysosomal lipid
              signal into transcription.
            evidence:
              - source_id: PMID:25554789
                title: Aging. Lysosomal signaling molecules regulate longevity in Caenorhabditis elegans.
                statement: NHR-80 binds OEA directly and NHR-49 does not.
                supporting_text: >-
                  However, no binding was detected between NHR-49 and OEA or
                  OEA analogue (fig. S12). Thus, NHR-80 appears to act as a
                  direct nuclear receptor of OEA and NHR-49 may function as a
                  co-factor of NHR-80.
              - source_id: PMID:16839188
                title: Genetic regulation of unsaturated fatty acid composition in C. elegans.
                statement: NHR-80 regulates delta-9 desaturase gene expression.
                supporting_text: >-
                  We have identified a novel nuclear hormone receptor, NHR-80,
                  that regulates delta-9 desaturase gene expression in
                  Caenorhabditis elegans.
              - source_id: PMID:21423649
                title: Fatty acid desaturation links germ cell loss to longevity through NHR-80/HNF4 in C. elegans.
                statement: NHR-80 is specifically needed for germline-loss longevity, through FAT-6 and oleic acid.
                supporting_text: >-
                  We show that the fatty acid desaturase, FAT-6/SCD1, is a key
                  target of NHR-80/HNF4 and promotes germline-longevity by
                  desaturating stearic acid to oleic acid (OA).
          - id: nhr49_partner
            label: NHR-49 nuclear receptor partner
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NHR-49
                term:
                  id: UniProtKB:O45666
                  label: Nuclear hormone receptor family member nhr-49
            function:
              preferred_term: nuclear receptor activity
              term:
                id: GO:0004879
                label: nuclear receptor activity
              description: >-
                Orphan receptor with no known ligand. In this pathway it is
                the NHR-80 partner needed for target-gene activation.
              targets:
                - preferred_term: acs-2 and other beta-oxidation genes
                - preferred_term: fat-5, fat-7 (with NHR-80)
            processes:
              - preferred_term: regulation of fatty acid metabolic process
                term:
                  id: GO:0019217
                  label: regulation of fatty acid metabolic process
              - preferred_term: determination of adult lifespan
                term:
                  id: GO:0008340
                  label: determination of adult lifespan
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Partner receptor needed for OEA/NHR-80 target transcription and
              for LIPL-4/LBP-8 longevity. It also carries a separate,
              NHR-66-partnered output outside this module.
            evidence:
              - source_id: PMID:22511885
                title: Coordinate regulation of lipid metabolism by novel nuclear receptor partnerships.
                statement: NHR-49 partners with NHR-80 to regulate desaturation genes and with NHR-66 for other targets.
                supporting_text: >-
                  Gene expression profiles suggest that NHR-49 partners with
                  NHR-66 to regulate sphingolipid and lipid remodeling genes
                  and with NHR-80 to regulate genes involved in fatty acid
                  desaturation.
              - source_id: PMID:25554789
                title: Aging. Lysosomal signaling molecules regulate longevity in Caenorhabditis elegans.
                statement: acs-2 induction by LIPL-4 needs both NHR-49 and NHR-80.
                supporting_text: >-
                  acs-2 transcription was increased more than 15-fold in
                  lipl-4 Tg animals; this effect was dependent on nhr-49 and
                  nhr-80, and absent in the lipl-4 Tg no SP strain
  connections:
    - source: hlh30_lysosomal_program
      target: lipl4_lysosomal_lipolysis
      connection_type: POSITIVELY_REGULATES
      description: >-
        HLH-30 (with MXL-3) couples lysosomal lipase expression, lipl-4
        included, to nutrient state. Whether HLH-30 binds the lipl-4 promoter
        directly is not established in the cached evidence.
    - source: lipl4_lysosomal_lipolysis
      target: lbp8_lipid_shuttle
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        LIPL-4 activity raises the lipid ligands, OEA most of all, that LBP-8
        binds. It also induces lbp-8 and its nuclear entry.
      evidence:
        - source_id: PMID:25554789
          title: Aging. Lysosomal signaling molecules regulate longevity in Caenorhabditis elegans.
          statement: lipl-4 loss reduces LBP-8-driven longevity, which fits LIPL-4 making the OEA that LBP-8 carries.
          supporting_text: >-
            Additionally, a loss-of-function mutant lipl-4(tm4417) reduced the
            longevity of lbp-8 Tg by 68% (fig. S14), supporting the
            possibility that LIPL-4 activity promotes the generation of
            longevity-promoting OEA carried by LBP-8.
    - source: lbp8_lipid_shuttle
      target: nhr_reception
      connection_type: POSITIVELY_REGULATES
      description: >-
        Nuclear LBP-8 is enough to activate NHR-49/NHR-80 targets (acs-2),
        and this needs its NLS.
      evidence:
        - source_id: PMID:25554789
          title: Aging. Lysosomal signaling molecules regulate longevity in Caenorhabditis elegans.
          statement: Nuclear LBP-8 reproduces the NHR-49/NHR-80 activation seen with LIPL-4.
          supporting_text: >-
            Thus, LIPL-4–induced activation of NHR-49 and NHR-80 can be
            reproduced by nuclear action of LBP-8.
    - source: nhr_reception
      target: lbp8_lipid_shuttle
      connection_type: POSITIVELY_REGULATES
      description: >-
        Positive feedback: NHR-49 and NHR-80 are needed for the rise in lbp-8
        transcription caused by LIPL-4 overexpression or OEA.
      evidence:
        - source_id: PMID:25554789
          title: Aging. Lysosomal signaling molecules regulate longevity in Caenorhabditis elegans.
          statement: lbp-8 induction by LIPL-4 depends on NHR-49 and NHR-80.
          supporting_text: >-
            Transcriptional increase of lbp-8 by lipl-4 Tg was in turn
            mediated by NHR-49 and NHR-80
knowledge_gaps:
  - gap_statement: >-
      How LIPL-4 acid lipase activity raises OEA is unknown. OEA is made from
      N-acylphosphatidylethanolamine by NAPE-PLD, not by triacylglycerol
      hydrolysis, and nape-1 loss only halves LIPL-4- and LBP-8-driven
      longevity.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether LIPL-4 makes the signal itself, supplies the oleate
      that becomes OEA, or acts more indirectly.
    resolution: >-
      Test LIPL-4 activity on NAPE and other N-acyl lipids in vitro. Trace
      labelled oleate into OEA in lipl-4 Tg animals with and without
      nape-1 and nape-2.
    provenance:
      - reference_id: PMID:25554789
        supporting_text: >-
          The nape-1(tm3860) loss-of-function mutation suppressed the lifespan
          extension in lipl-4 Tg and lbp-8 Tg by half
  - gap_statement: >-
      How LBP-8 hands OEA to NHR-80 in the nucleus is unknown: no direct
      LBP-8-NHR-80 interaction or ligand transfer has been shown. Whether
      NHR-49 has its own ligand in this pathway is also unknown.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Mammalian FABP-to-PPAR handoff is a direct protein-protein transfer.
      Whether the worm pathway works the same way decides what LBP-8 does in
      the nucleus.
    resolution: >-
      Co-immunoprecipitation and FRET between LBP-8 and NHR-80/NHR-49 in
      intestinal nuclei, and in vitro ligand transfer from OEA-loaded LBP-8
      to the NHR-80 ligand-binding domain.
    provenance:
      - reference_id: PMID:25554789
        supporting_text: >-
          Considering that FABPs are quite promiscuous in ligand binding (4),
          there may be other lipid molecules binding to LBP-8 and functioning
          in this longevity pathway.
