                label: MTUS1 (ATIP) and ZBTB16 (PLZF) AT2 interacting partners
                module_type: REGULATORY_STEP
                description: >-
                  AT2 signals through proteins that bind its C-terminal tail. MTUS1 (ATIP1)
                  transmits growth-inhibitory, G protein-independent signals; ZBTB16 (PLZF)
                  is recruited to the AT2 tail, moves to the nucleus and drives a p85-PI3K
                  transcriptional programme linked to cardiac hypertrophy.
                annotons:
                  - id: mtus1_partner
                    label: MTUS1 (ATIP1) AT2-interacting partner
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MTUS1
                        term:
                          id: UniProtKB:Q9ULD2
                          label: Microtubule-associated tumor suppressor 1
                    role_description: >-
                      The best-characterised AT2 C-terminal-tail partner; transmits
                      growth-inhibitory signals and trans-inactivates receptor tyrosine
                      kinases, independently of G protein coupling. No experimental molecular
                      function beyond protein binding is available, so no function term is
                      asserted.
                    evidence:
                      - source_id: PMID:15123706
                        statement: ATIP (MTUS1) binds the AT2 C-terminal tail and cooperates with AT2 to inhibit receptor tyrosine kinase signalling.
                        supporting_text: >-
                          ATIP1 cooperates with AT2 to transinactivate receptor tyrosine
                          kinases
                  - id: zbtb16_partner
                    label: ZBTB16 (PLZF) AT2-recruited transcription repressor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ZBTB16
                        term:
                          id: UniProtKB:Q05516
                          label: Zinc finger and BTB domain-containing protein 16
                    function:
                      preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
                      term:
                        id: GO:0001227
                        label: DNA-binding transcription repressor activity, RNA polymerase II-specific
                    locations:
                      - preferred_term: nucleus
                        term:
                          id: GO:0005634
                          label: nucleus
                    role_description: >-
                      Recruited to the AT2 C-terminal tail on Ang II stimulation; relocates to
                      the nucleus and, binding the p85-alpha PI3K gene, drives a
                      transcriptional programme behind the AT2 cardiac hypertrophic response.
                    evidence:
                      - source_id: PMID:14657020
                        statement: The AT2 C-terminus binds the transcription factor PLZF, which then upregulates p85 PI3K.
                        supporting_text: >-
                          AT 2 C-terminus binds to the transcription factor promyelocytic
                          zinc finger protein (PLZF)
                      - source_id: PMID:22558183
                        statement: PLZF is the AT2-binding protein mediating Ang II-induced cardiac hypertrophy, acting on GATA4.
                        supporting_text: >-
                          PLZF is an important AT(2) receptor binding protein in mediating Ang
                          II induced cardiac hypertrophy
