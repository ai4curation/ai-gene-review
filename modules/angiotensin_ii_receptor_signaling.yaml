knowledge_gaps:
  - gap_statement: >-
      The molecular mechanism of AT2 (AGTR2) signalling remains incompletely defined and is
      sometimes contradictory: which G protein-dependent versus -independent routes activate
      SHP-1 versus MKP-1 in which cell types, how the non-canonical helix VIII conformation
      is reconciled with reported downstream effects, and whether MTUS1 and ZBTB16 act in the
      same or parallel AT2 branches, could only be resolved by new biochemical and
      structural experiments.
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      Whether the reported AT2 C-terminal-tail partners CNKSR1, ERBB3, SLC9A6 and TIMP3
      transmit AT2 signals in vivo or only bind the receptor, and what distinct cellular
      outputs each confers, is unresolved and would require receptor-partner perturbation
      experiments; they are left out of this draft pending that evidence.
    gap_kind:
      - BIOLOGY
