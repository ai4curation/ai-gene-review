id: MODULE:ldl_receptor_mediated_endocytosis
title: LDL receptor-mediated endocytic uptake — apoB-100 ligand, LDLR internalization and recycling, PCSK9 degradation control
description: >-
  Low-density lipoprotein (LDL) carries most plasma cholesterol and is cleared mainly by hepatocyte
  LDL receptors. Each LDL particle contains one apolipoprotein B-100 molecule, whose receptor-binding
  region is the ligand for the cysteine-rich ligand-binding repeats of the LDL receptor (LDLR) at the
  cell surface. LDLR-LDL complexes cluster in clathrin-coated pits through the LDLR cytoplasmic NPxY
  motif (with the adaptor LDLRAP1/ARH in liver) and are internalized by receptor-mediated endocytosis.
  In the acidic early endosome the receptor releases LDL, which proceeds to lysosomes where cholesteryl
  esters are hydrolysed and free cholesterol is delivered to the cell; the empty receptor recycles to the
  plasma membrane for further rounds. Secreted PCSK9 binds the LDLR EGF-A repeat and, after
  co-internalization, prevents the receptor's acid-induced conformational change so that it is routed
  to lysosomes and degraded instead of recycling, lowering receptor number and LDL clearance (IDOL/MYLIP
  provides an intracellular, ubiquitin-dependent degradation route). Loss of LDLR, of the apoB-100
  receptor-binding region, or of LDLRAP1, or gain of function of PCSK9, causes familial
  hypercholesterolaemia; PCSK9 loss of function lowers LDL cholesterol and is the target of
  PCSK9-inhibitor therapy.
status: DRAFT
evidence:
  - source_id: GO:0034383
    title: low-density lipoprotein particle clearance
    statement: The module is the cellular LDLR route of low-density lipoprotein particle clearance.
  - source_id: Reactome:R-HSA-171122
    title: LDL + LDLR => LDL:LDLR complex
    statement: Ligand binding follows human Reactome reaction R-HSA-171122.
  - source_id: Reactome:R-HSA-171141
    title: LDL:LDLR complex [plasma membrane] => LDL:LDLR complex [clathrin-coated vesicle] (LDLRAP1-independent)
    statement: Internalization follows human Reactome reaction R-HSA-171141.
  - source_id: Reactome:R-HSA-171106
    title: LDLR:LDL complex => LDLR + LDL
    statement: Endosomal ligand release follows human Reactome reaction R-HSA-171106.
  - source_id: Reactome:R-HSA-171087
    title: LDLR [endosome membrane] => LDLR [plasma membrane]
    statement: Receptor recycling follows human Reactome reaction R-HSA-171087.
  - source_id: file:human/APOB/APOB-ai-review.yaml
    title: APOB gene review (human)
    statement: >-
      The ligand step (UniProtKB:P04114, GO:0050750 low-density lipoprotein particle receptor
      binding) matches the completed human APOB review.
  - source_id: file:human/LDLR/LDLR-ai-review.yaml
    title: LDLR gene review (human)
    statement: >-
      The receptor step (UniProtKB:P01130, GO:0005041, GO:0090118, clathrin-coated pit / early
      endosome) matches the completed human LDLR review.
  - source_id: file:human/PCSK9/PCSK9-ai-review.yaml
    title: PCSK9 gene review (human)
    statement: >-
      The regulatory step (UniProtKB:Q8NBP7, GO:0050750, GO:0032805) matches the completed human
      PCSK9 review.
  - source_id: Reactome:R-HSA-8865667
    title: LIPA hydrolyses sterol esters to sterols and fatty acids
    statement: Lysosomal cholesteryl-ester hydrolysis follows human Reactome reaction R-HSA-8865667.
  - source_id: file:human/LIPA/LIPA-ai-review.yaml
    title: LIPA gene review (human)
    statement: >-
      The lysosomal hydrolysis step (UniProtKB:P38571, GO:0004771 sterol ester esterase activity,
      GO:0090122, lysosomal lumen) matches the completed human LIPA review.
module:
  id: ldl_receptor_mediated_endocytosis
  label: LDL receptor-mediated endocytic uptake
  module_type: TRANSPORT_STEP
  concepts:
    - preferred_term: receptor-mediated endocytosis involved in cholesterol transport
      term:
        id: GO:0090118
        label: receptor-mediated endocytosis involved in cholesterol transport
      description: Clathrin-dependent internalization of LDL by the LDL receptor.
    - preferred_term: low-density lipoprotein particle clearance
      term:
        id: GO:0034383
        label: low-density lipoprotein particle clearance
      description: Removal of LDL from plasma by receptor-mediated uptake, mainly in liver.
  parts:
    - order: 1
      role: receptor ligand on the LDL particle
      node:
        id: apob_ligand
        label: apoB-100 presents the LDLR-binding surface of LDL
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: apob_ldlr_binding
            label: "APOB (apoB-100): LDL receptor ligand"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Apolipoprotein B-100
                term:
                  id: PANTHER:PTHR13769:SF1
                  label: APOLIPOPROTEIN B-100
                representative_members:
                  - preferred_term: APOB (human)
                    term:
                      id: UniProtKB:P04114
                      label: Apolipoprotein B-100
            function:
              preferred_term: low-density lipoprotein particle receptor binding
              term:
                id: GO:0050750
                label: low-density lipoprotein particle receptor binding
              evidence:
                - source_id: file:human/APOB/APOB-ai-review.yaml
                  statement: ApoB100 presents recognition surfaces for LDL receptors; apoB48 lacks the canonical LDLR-binding region
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              The single apoB-100 per LDL particle is the LDLR ligand; receptor-binding-region
              variants (e.g. R3527Q) cause familial defective apoB-100.
    - order: 2
      role: receptor binding, internalization, release and recycling
      node:
        id: ldlr_endocytosis
        label: LDLR binds LDL and internalizes it via clathrin-coated pits, then recycles
        module_type: TRANSPORT_STEP
        annotons:
          - id: ldlr_receptor
            label: "LDLR: low-density lipoprotein receptor"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Low-density lipoprotein receptor
                term:
                  id: PANTHER:PTHR22722:SF15
                  label: LOW-DENSITY LIPOPROTEIN RECEPTOR-RELATED
                representative_members:
                  - preferred_term: LDLR (human)
                    term:
                      id: UniProtKB:P01130
                      label: Low-density lipoprotein receptor
            function:
              preferred_term: low-density lipoprotein particle receptor activity
              term:
                id: GO:0005041
                label: low-density lipoprotein particle receptor activity
              substrates:
                - preferred_term: LDL particle (apoB-100)
              evidence:
                - source_id: Reactome:R-HSA-171122
                  statement: "LDL + LDLR => LDL:LDLR complex (human Reactome reaction)"
                - source_id: file:human/LDLR/LDLR-ai-review.yaml
                  statement: Binds apoB-100 LDL and internalizes it by clathrin-mediated endocytosis; recycles from early endosomes
            processes:
              - preferred_term: receptor-mediated endocytosis involved in cholesterol transport
                term:
                  id: GO:0090118
                  label: receptor-mediated endocytosis involved in cholesterol transport
            locations:
              - preferred_term: clathrin-coated pit
                term:
                  id: GO:0005905
                  label: clathrin-coated pit
              - preferred_term: early endosome
                term:
                  id: GO:0005769
                  label: early endosome
            role_description: >-
              Ligand-binding repeats capture LDL; the NPxY cytoplasmic motif engages clathrin
              adaptors (LDLRAP1 in hepatocytes); acid-dependent ligand release in endosomes allows
              receptor recycling. Loss of function = familial hypercholesterolaemia.
    - order: 3
      role: control of receptor number by lysosomal degradation
      node:
        id: pcsk9_degradation
        label: PCSK9 binds LDLR EGF-A and diverts it to lysosomal degradation
        module_type: REGULATORY_STEP
        annotons:
          - id: pcsk9_ldlr_binding
            label: "PCSK9: secreted LDLR-degradation chaperone"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Proprotein convertase subtilisin/kexin type 9
                term:
                  id: PANTHER:PTHR43806:SF60
                  label: PROPROTEIN CONVERTASE SUBTILISIN_KEXIN TYPE 9
                representative_members:
                  - preferred_term: PCSK9 (human)
                    term:
                      id: UniProtKB:Q8NBP7
                      label: Proprotein convertase subtilisin/kexin type 9
            function:
              preferred_term: low-density lipoprotein particle receptor binding
              term:
                id: GO:0050750
                label: low-density lipoprotein particle receptor binding
              evidence:
                - source_id: file:human/PCSK9/PCSK9-ai-review.yaml
                  statement: Binds the LDLR EGF-A repeat and prevents recycling so LDLR is degraded in lysosomes (non-catalytic)
            processes:
              - preferred_term: positive regulation of low-density lipoprotein particle receptor catabolic process
                term:
                  id: GO:0032805
                  label: positive regulation of low-density lipoprotein particle receptor catabolic process
            locations:
              - preferred_term: endosome
                term:
                  id: GO:0005768
                  label: endosome
            role_description: >-
              Acts as a non-catalytic chaperone for LDLR degradation (its protease activity is
              needed only for autoprocessing). Gain of function = familial hypercholesterolaemia;
              loss of function = low LDL cholesterol; therapeutic target.
    - order: 4
      role: lysosomal hydrolysis of LDL cholesteryl esters
      node:
        id: lipa_ce_hydrolysis
        label: Lysosomal acid lipase hydrolyses LDL-derived cholesteryl esters to free cholesterol
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: lipa_sterol_esterase
            label: "LIPA (lysosomal acid lipase): cholesteryl ester hydrolase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Lysosomal acid lipase/cholesteryl ester hydrolase
                term:
                  id: PANTHER:PTHR11005:SF26
                  label: LYSOSOMAL ACID LIPASE_CHOLESTERYL ESTER HYDROLASE
                representative_members:
                  - preferred_term: LIPA (human)
                    term:
                      id: UniProtKB:P38571
                      label: Lysosomal acid lipase/cholesteryl ester hydrolase
            function:
              preferred_term: sterol ester esterase activity
              term:
                id: GO:0004771
                label: sterol ester esterase activity
              substrates:
                - preferred_term: cholesteryl esters of endocytosed LDL
              evidence:
                - source_id: Reactome:R-HSA-8865667
                  statement: "LIPA hydrolyses sterol esters to sterols and fatty acids (human Reactome reaction)"
                - source_id: file:human/LIPA/LIPA-ai-review.yaml
                  statement: Core function GO:0004771 in the lysosomal lumen, directly involved in GO:0090122
                - source_id: PMID:1718995
                  title: Cloning and expression of cDNA encoding human lysosomal acid lipase/cholesteryl ester hydrolase. Similarities to gastric and lingual lipases.
                  statement: LIPA deacylates the cholesteryl ester and triacylglycerol core lipids of endocytosed LDL.
                  supporting_text: >-
                    The lysosomal enzyme catalyzes the deacylation of triacylglyceryl and
                    cholesteryl ester core lipids of endocytosed low density lipoproteins
            processes:
              - preferred_term: cholesterol ester hydrolysis involved in cholesterol transport
                term:
                  id: GO:0090122
                  label: cholesterol ester hydrolysis involved in cholesterol transport
            locations:
              - preferred_term: lysosomal lumen
                term:
                  id: GO:0043202
                  label: lysosomal lumen
            role_description: >-
              Acid-pH hydrolase that releases free cholesterol (and fatty acid) from the
              cholesteryl esters of LDL delivered to lysosomes, the step that makes LDL
              cholesterol available to the cell; it also hydrolyses LDL triacylglycerol.
              Complete loss = Wolman disease; residual activity = cholesteryl ester storage
              disease. Export of the released cholesterol by NPC2/NPC1 is downstream and not
              modelled (no gene reviews).
  connections:
    - source: apob_ligand
      target: ldlr_endocytosis
      connection_type: PROVIDES_INPUT_FOR
      description: ApoB-100-containing LDL is the ligand bound and internalized by LDLR.
    - source: pcsk9_degradation
      target: ldlr_endocytosis
      connection_type: NEGATIVELY_REGULATES
      description: PCSK9 binding prevents LDLR recycling and sends the receptor to lysosomes, reducing LDL uptake.
    - source: ldlr_endocytosis
      target: lipa_ce_hydrolysis
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        LDL released from the receptor in endosomes reaches lysosomes, where its
        cholesteryl esters are the substrate of lysosomal acid lipase.
  notes: >-
    Grounded to the completed human reviews of APOB (UniProtKB:P04114), LDLR (P01130) and PCSK9
    (Q8NBP7); GO terms are taken from their core_functions. PANTHER subfamily ids are those in each
    representative's UniProt cross-references, with labels copied from interpro/panther/panther.obo
    (the PTHR22722:SF15 official name is "LOW-DENSITY LIPOPROTEIN RECEPTOR-RELATED"). Reactome
    reaction ids/titles were checked against the local reactome cache. Members not modelled as parts
    because no AIGR gene review exists yet: LDLRAP1 (ARH clathrin adaptor required for hepatic LDLR
    internalization; loss causes autosomal recessive hypercholesterolaemia) and MYLIP (IDOL, LXR-induced
    E3 ligase that ubiquitinates LDLR for degradation). Part 4 adds the first downstream lysosomal
    step, cholesteryl-ester hydrolysis by LIPA (completed human LIPA review, P38571; PANTHER
    PTHR11005:SF26 from the PANTHER human classification), as in Reactome R-HSA-8865667. NPC2/NPC1
    export of the released cholesterol from lysosomes is not modelled because neither has a gene review;
    SREBP2-dependent transcriptional control of LDLR and PCSK9 is upstream regulation, not modelled.
    ApoE-mediated remnant uptake by LDLR is noted in the LDLR review but kept out of this LDL-specific
    module.
executable_models:
  - id: ldlr_endocytosis_abm
    title: Agent-based LDL particle clearance and PCSK9 receptor-degradation model
    model_type: AGENT_BASED
    derivation: DERIVED_FROM_MODULE
    description: >-
      Tracks a cohort of 100 extracellular apoB-100 LDL particles (apob_ligand) through LDLR-mediated
      clathrin endocytosis (ldlr_endocytosis) and lysosomal acid lipase cholesteryl-ester hydrolysis
      (lipa_ce_hydrolysis), gated by secreted PCSK9 chaperone activity (pcsk9_degradation).
    notes: >-
      Deterministic particle-conserving agent-based simulation (N=100 LDL particles, T=24 steps)
      derived directly from the module's PROVIDES_INPUT_FOR transport connections and the
      NEGATIVELY_REGULATES PCSK9 regulatory connection. Because pcsk9_degradation has no incoming
      transport edges, it is treated as a pure regulatory switch that defaults to inactive unless
      explicitly perturbed.
    scenarios:
      - id: normal_ldl_clearance
        label: Maximal PCSK9-independent hepatic LDL clearance (complete lysosomal cholesteryl-ester hydrolysis)
        description: >-
          In the absence of PCSK9-mediated receptor degradation (pcsk9_degradation defaults to false
          as an unstimulated pure regulator) and with functional lysosomal acid lipase, 100% of bound
          LDL particles are internalized and hydrolyzed in lysosomes.
        expected_active:
          - apob_ligand
          - ldlr_endocytosis
          - lipa_ce_hydrolysis
        expected_inactive:
          - pcsk9_degradation
        evidence:
          - source_id: Reactome:R-HSA-171141
            title: LDL:LDLR complex [plasma membrane] => LDL:LDLR complex [clathrin-coated vesicle] (LDLRAP1-independent)
            statement: Cell-surface LDLR binds apoB-100 LDL and internalizes the complex via clathrin-coated vesicles.
          - source_id: Reactome:R-HSA-8865667
            title: LIPA hydrolyses sterol esters to sterols and fatty acids
            statement: Endocytosed LDL cholesteryl esters delivered to lysosomes are hydrolyzed by LIPA.
      - id: pcsk9_gain_of_function
        label: PCSK9 gain-of-function / familial hypercholesterolaemia (LDLR degraded; extracellular LDL retention)
        description: >-
          Constitutively active PCSK9 (pcsk9_degradation: true) diverts LDLR to lysosomal degradation,
          gating off receptor-mediated LDL endocytosis and leaving 100% of LDL particles uncleared at
          apob_ligand.
        settings:
          - element: pcsk9_degradation
            active: true
        expected_active:
          - apob_ligand
          - pcsk9_degradation
        expected_inactive:
          - ldlr_endocytosis
          - lipa_ce_hydrolysis
        evidence:
          - source_id: file:human/PCSK9/PCSK9-ai-review.yaml
            statement: Secreted PCSK9 binds LDLR EGF-A and reroutes the receptor to lysosomes for degradation, reducing hepatic LDL clearance.
          - source_id: PMID:17452316
            title: Binding of proprotein convertase subtilisin/kexin type 9 to epidermal growth factor-like repeat A of low density lipoprotein receptor decreases receptor recycling and increases degradation.
            statement: PCSK9 binding to the EGF-A domain of LDLR prevents receptor recycling and reroutes LDLR from endosomes to lysosomes for degradation.
            supporting_text: >-
              These data are consistent with a model in 
              which PCSK9 binding to EGF-A interferes with an acid-dependent conformational 
              change required for receptor recycling. As a consequence, the LDLR is rerouted 
              from the endosome to the lysosome where it is degraded.
      - id: ldlr_loss_fh
        label: LDLR loss-of-function familial hypercholesterolaemia (receptor uptake blocked)
        description: >-
          Loss of LDLR function (ldlr_endocytosis: false) prevents internalization of apoB-100 LDL
          particles, retaining 100% of the cohort in the extracellular apob_ligand pool.
        settings:
          - element: ldlr_endocytosis
            active: false
        expected_active:
          - apob_ligand
        expected_inactive:
          - ldlr_endocytosis
          - pcsk9_degradation
          - lipa_ce_hydrolysis
        evidence:
          - source_id: file:human/LDLR/LDLR-ai-review.yaml
            statement: Loss-of-function mutations in LDLR abolish hepatic receptor-mediated LDL endocytosis and cause familial hypercholesterolaemia.
          - source_id: PMID:6299582
            title: "The LDL receptor locus in familial hypercholesterolemia: multiple mutations disrupt transport and processing of a membrane receptor."
            statement: Familial hypercholesterolaemia mutations at the LDLR locus disrupt receptor synthesis, transport, or LDL binding at the cell surface.
            supporting_text: >-
              We describe seven mutations that
              disrupt synthesis, processing and transport of the receptor in fibroblasts from
              77 subjects with the clinical diagnosis of homozygous familial
              hypercholesterolemia.
      - id: lipa_loss_wolman
        label: LIPA loss-of-function (Wolman disease / CESD; endolysosomal cholesteryl-ester accumulation)
        description: >-
          Inactivating lysosomal acid lipase (lipa_ce_hydrolysis: false) permits normal LDLR-mediated
          internalization of LDL particles, which then accumulate unhydrolyzed at the endolysosomal
          delivery stage (ldlr_endocytosis).
        settings:
          - element: lipa_ce_hydrolysis
            active: false
        expected_active:
          - apob_ligand
          - ldlr_endocytosis
        expected_inactive:
          - pcsk9_degradation
          - lipa_ce_hydrolysis
        evidence:
          - source_id: file:human/LIPA/LIPA-ai-review.yaml
            statement: Deficiency of lysosomal acid lipase (LIPA) blocks hydrolysis of endocytosed LDL cholesteryl esters in lysosomes, causing Wolman disease and CESD.
          - source_id: PMID:1718995
            title: Cloning and expression of cDNA encoding human lysosomal acid lipase/cholesteryl ester hydrolase. Similarities to gastric and lingual lipases.
            statement: LIPA catalyzes deacylation of cholesteryl ester and triacylglycerol core lipids of endocytosed LDL, an activity deficient in Wolman disease and cholesteryl ester storage disease.
            supporting_text: >-
              The lysosomal enzyme catalyzes
              the deacylation of triacylglyceryl and cholesteryl ester core lipids of
              endocytosed low density lipoproteins; this activity is deficient in patients
              with Wolman disease and cholesteryl ester storage disease.
