              term:
                id: GO:0004345
                label: glucose-6-phosphate dehydrogenase activity
      - order: 2
        role: 6-phosphogluconate to ribulose 5-phosphate
        node:
          id: phosphogluconate_decarboxylation
          label: 6-Phosphogluconate oxidative decarboxylation
          module_type: METABOLIC_PATHWAY
          annotons:
