    term:
      id: GO:0006740
      label: NADPH regeneration
  context:
    taxa:
    - preferred_term: Drosophila melanogaster
      term:
        id: NCBITaxon:7227
        label: Drosophila melanogaster
  parts:
  - order: 1
    role: glucose 6-phosphate to ribulose 5-phosphate with two NADPH
    node:
      id: oxidative_pentose_phosphate
      label: Oxidative pentose phosphate pathway
      module_type: METABOLIC_PATHWAY
      parts:
      - order: 1
        role: glucose 6-phosphate to 6-phosphogluconolactone
        node:
          id: g6p_dehydrogenation
          label: Glucose 6-phosphate dehydrogenation
          module_type: METABOLIC_PATHWAY
          annotons:
          - id: g6p_dehydrogenation_g6pd
            label: G6pd Glucose 6-phosphate dehydrogenation
            participant:
              selector_type: GENE_PRODUCT
