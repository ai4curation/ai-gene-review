id: MODULE:dmel_cytosolic_nadph_regeneration
title: Cytosolic NADPH regeneration in Drosophila melanogaster
description: >-
  NADPH supplies reducing power for fatty acid synthesis and for antioxidant systems such
  as glutathione and thioredoxin reduction. In Drosophila, as in other animals, it is regenerated
  outside mitochondria by three sets of NADP-dependent dehydrogenases. The oxidative branch
  of the pentose phosphate pathway produces two NADPH per glucose 6-phosphate through glucose-6-phosphate
  dehydrogenase (G6pd, Zw) and 6-phosphogluconate dehydrogenase (Pgd). NADP-dependent isocitrate
  dehydrogenase (Idh) oxidizes isocitrate to 2-oxoglutarate, and NADP-dependent malic enzyme
  (Men) decarboxylates malate to pyruvate, each reducing NADP+. Studies of fly mutants and
  allozyme variants link these enzymes to lipid accumulation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002243
  title: 'FlyBase gene group NADPHRE: Nadph regeneration'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as nadph regeneration (NADPHRE);
    this module models that group.
- source_id: GO:0006740
  title: NADPH regeneration
  statement: >-
    GO term grounding the module as NADPH regeneration.
notes: >-
  Boundary. The module covers the five FlyBase NADPH regeneration enzymes. The three parts
  are parallel sources of NADPH and are not linked by connections. The 6-phosphogluconolactonase
  step between G6pd and Pgd is not a FlyBase member and is not modelled. Mitochondrial NADPH
  sources (for example nicotinamide nucleotide transhydrogenase) are outside the module. FlyBase
  groups realized by this module: NADPHRE (FBgg0002243). Participants were generated from
  the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_cytosolic_nadph_regeneration.yaml. Genes without a UniProtKB entry
  (mostly non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes
  has a gene review yet unless noted.
module:
  id: dmel_cytosolic_nadph_regeneration
  label: Cytosolic NADPH regeneration
  module_type: METABOLIC_PATHWAY
  description: >-
    NADPH regeneration by the oxidative pentose phosphate pathway (G6pd, Pgd), NADP-isocitrate
    dehydrogenase (Idh) and malic enzymes (Men, Men-b).
