id: MODULE:bacterial_unsaturated_fatty_acid_biosynthesis
title: Bacterial unsaturated fatty acid biosynthesis
description: >-
  Formation of the cis-unsaturated acyl chains of bacterial membrane lipids.
  Bacteria introduce the double bond by one or more of several routes. In the
  oxygen-independent routes the double bond is made during type II fatty acid
  synthesis at the C10 stage: proteobacterial FabA dehydrates
  3-hydroxydecanoyl-ACP and isomerizes the resulting trans-2-decenoyl-ACP to
  cis-3-decenoyl-ACP, which FabB then commits to elongation; Enterococcus-type
  FabN, a FabZ-family dehydratase, performs the same two reactions; and
  Streptococcus-type FabM, an unrelated crotonase-fold enzyme, isomerizes
  trans-2-decenoyl-ACP made by the general dehydratase. In the oxygen-dependent
  route a membrane di-iron desaturase, such as Bacillus subtilis Des, inserts a
  cis double bond into saturated acyl chains already esterified in membrane
  phospholipids. A FabF-type condensing enzyme can extend the C16:1 product of
  the anaerobic routes to C18:1. The reduction and dehydration reactions of the
  shared elongation cycle are outside this module.
status: COMPLETE
scope: ABSTRACT
evidence:
  - source_id: GO:0006636
    title: unsaturated fatty acid biosynthetic process
    statement: >-
      GO:0006636 provides the biological-process scope for formation of
      unsaturated fatty acids.
  - source_id: PMID:8910376
    title: Roles of the FabA and FabZ beta-hydroxyacyl-acyl carrier protein dehydratases
      in Escherichia coli fatty acid biosynthesis.
    statement: >-
      Purified E. coli FabA and FabZ in reconstituted fatty acid synthesis show
      that the double bond is introduced at the 10-carbon stage by FabA and is
      detected only in the presence of FabB, and that FabA is inactive on
      long-chain unsaturated substrates.
  - source_id: PMID:19679654
    title: 'Escherichia coli unsaturated fatty acid synthesis: complex transcription of
      the fabA gene and in vivo identification of the essential reaction catalyzed by
      FabB.'
    statement: >-
      The essential FabB reaction in unsaturated fatty acid synthesis is
      elongation of the cis-3-decenoyl-ACP made by FabA.
  - source_id: PMID:12237320
    title: A new mechanism for anaerobic unsaturated fatty acid formation in Streptococcus
      pneumoniae.
    statement: >-
      S. pneumoniae FabM is a crotonase-superfamily trans-2/cis-3-decenoyl-ACP
      isomerase without dehydratase activity, moving the branch point to after
      trans-2-decenoyl-ACP formation.
  - source_id: PMID:15194690
    title: Functional replacement of the FabA and FabB proteins of Escherichia coli fatty
      acid synthesis by Enterococcus faecalis FabZ and FabF homologues.
    statement: >-
      E. faecalis FabZ1 (FabN) replaces E. coli FabA as a bifunctional
      dehydratase/isomerase, and fabA and fabB are restricted to alpha- and
      gamma-proteobacteria.
  - source_id: PMID:15980063
    title: Domain swapping between Enterococcus faecalis FabN and FabZ proteins localizes
      the structural determinants for isomerase activity.
    statement: >-
      The isomerase activity of FabN is conferred by the beta3 and beta4
      strands of the substrate tunnel, and FabN differs from its non-isomerizing
      FabZ paralog in those strands.
  - source_id: PMID:9555904
    title: A Bacillus subtilis gene induced by cold shock encodes a membrane phospholipid
      desaturase.
    statement: >-
      B. subtilis Des is a cold-induced Delta5 acyl-lipid desaturase acting on
      membrane phospholipids, and des null mutants make no unsaturated fatty
      acids after a cold shift.
  - source_id: PMID:237914
    title: Multiple forms of beta-ketoacyl-acyl carrier protein synthetase in Escherichia
      coli.
    statement: >-
      E. coli synthase II (FabF) functions in elongation of palmitoleoyl-ACP to
      cis-vaccenoyl-ACP, while synthase I (FabB) is required for unsaturated
      fatty acid synthesis.
  - source_id: file:PSEPK/fabA/fabA-uniprot.txt
    title: UniProtKB entry Q88FC4 for PSEPK FabA
    statement: >-
      The reviewed entry assigns both 3-hydroxydecanoyl-ACP dehydration and
      trans-2-decenoyl-ACP isomerization to the P. putida KT2440 FabA
      exemplar.
  - source_id: file:projects/P_PUTIDA/data/psepk_uniprot_metadata.tsv
    title: PSEPK UniProt metadata snapshot
    statement: >-
      The local UniProt metadata identifies TesA as a multifunctional
      hydrolase, TesB as an acyl-CoA thioesterase, and PP_5331 as a long-chain
      acyl-CoA thioester hydrolase; none has an ACP-dependent reaction that
      introduces or elongates cis unsaturation.
  - source_id: file:modules/bacterial_unsaturated_fatty_acid_biosynthesis-deep-research-openscientist.md
    title: OpenScientist review of bacterial FabA/FabB unsaturated-fatty-acid biosynthesis
    statement: >-
      Module-level retrieval supports the FabA dehydration/isomerization and
      FabB commitment boundary, treats FabF extension as conditional, and
      describes FabM and FabN as convergent isomerase solutions and aerobic
      desaturation as a mechanistically separate route.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_unsaturated_fatty_acid_biosynthesis__ppu01040-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu01040 satisfiability review
    statement: >-
      Species/pathway retrieval identifies the KEGG ppu01040 thioesterase set
      as outside the ACP-dependent FabA/FabB branch and supports Q88FC4,
      Q88FC3, and Q88LL4 as the KT2440 pathway implementation.
module:
  id: bacterial_unsaturated_fatty_acid_biosynthesis
  label: Bacterial unsaturated fatty acid biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: unsaturated fatty acid biosynthetic process
      term:
        id: GO:0006636
        label: unsaturated fatty acid biosynthetic process
      description: >-
        Introduction of cis unsaturation into bacterial acyl chains, during
        type II fatty acid synthesis or by desaturation of membrane lipids.
  context:
    taxa:
      - preferred_term: Bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: cis double-bond introduction
      node:
        id: cis_double_bond_introduction
        label: Introduction of the cis double bond
        module_type: METABOLIC_PATHWAY
        variant_sets:
          - id: cis_double_bond_routes
            label: Anaerobic isomerase routes or aerobic desaturation
            axis: double-bond chemistry and enzyme family
            variant_kind: ROUTE
            selection: ONE_OR_MORE
            notes: >-
              The routes differ in chemistry and enzyme family. Some bacteria
              carry more than one; for example, Pseudomonas aeruginosa has both
              FabA/FabB and oxygen-dependent desaturases, hence ONE_OR_MORE.
            variants:
              - id: fabA_fabB_route
                label: FabA/FabB route (proteobacteria)
                module_type: METABOLIC_PATHWAY
                parts:
                  - order: 1
                    role: decanoyl-branch dehydration
                    node:
                      id: fabA_hydroxydecanoyl_dehydration
                      label: FabA 3-hydroxydecanoyl-ACP dehydration
                      module_type: REACTION
                      annotons:
                        - id: fabA_dehydratase
                          label: FabA 3-hydroxydecanoyl-ACP dehydratase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: FabA-subfamily dehydratase/isomerases
                              term:
                                id: PANTHER:PTHR30272:SF8
                                label: 3-HYDROXYDECANOYL-[ACYL-CARRIER-PROTEIN] DEHYDRATASE
                              representative_members:
                                - preferred_term: fabA (Escherichia coli K-12)
                                  term:
                                    id: UniProtKB:P0A6Q3
                                    label: 3-hydroxydecanoyl-[acyl-carrier-protein] dehydratase
                                - preferred_term: fabA (Pseudomonas putida KT2440)
                                  term:
                                    id: UniProtKB:Q88FC4
                                    label: 3-hydroxydecanoyl-[acyl-carrier-protein] dehydratase
                              ancestral_nodes:
                                - preferred_term: PAINT bacterial FabA/FabZ dehydratase node
                                  term:
                                    id: PANTHER:PTN008624492
                                    label: PTN008624492
                                  description: >-
                                    Bacterial ancestral node carrying GO:0019171 and
                                    GO:0006633 in the local PTHR30272 PAINT export,
                                    seeded by E. coli FabA and FabZ.
                                  evidence:
                                    - source_id: GO_REF:0000033
                                      title: Phylogenetic annotation using PAINT
                                      statement: PAINT IBD evidence supports the ancestral-node assignment.
                                    - source_id: file:interpro/panther/PTHR30272/PTHR30272-paint.tsv
                                      title: Local PTHR30272 PAINT IBD export
                                      statement: PTN008624492 is supported by P0A6Q3 and carries GO:0019171.
                          function:
                            preferred_term: (3R)-hydroxyacyl-acyl-carrier-protein dehydratase activity
                            term:
                              id: GO:0019171
                              label: (3R)-hydroxyacyl-[acyl-carrier-protein] dehydratase activity
                            substrates:
                              - preferred_term: (3R)-hydroxydecanoyl-ACP
                            products:
                              - preferred_term: trans-2-decenoyl-ACP
                              - preferred_term: water
                          locations:
                            - preferred_term: cytosol
                              term:
                                id: GO:0005829
                                label: cytosol
                          role_description: >-
                            Generates the trans-2-decenoyl-ACP substrate for the
                            double-bond-shifting FabA reaction.
                  - order: 2
                    role: cis double-bond introduction by isomerization
                    node:
                      id: fabA_decenoyl_isomerization
                      label: FabA trans-2-decenoyl-ACP isomerization
                      module_type: REACTION
                      annotons:
                        - id: fabA_isomerase
                          label: FabA trans-2-decenoyl-ACP isomerase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: FabA-subfamily dehydratase/isomerases
                              term:
                                id: PANTHER:PTHR30272:SF8
                                label: 3-HYDROXYDECANOYL-[ACYL-CARRIER-PROTEIN] DEHYDRATASE
                              representative_members:
                                - preferred_term: fabA (Escherichia coli K-12)
                                  term:
                                    id: UniProtKB:P0A6Q3
                                    label: 3-hydroxydecanoyl-[acyl-carrier-protein] dehydratase
                                - preferred_term: fabA (Pseudomonas putida KT2440)
                                  term:
                                    id: UniProtKB:Q88FC4
                                    label: 3-hydroxydecanoyl-[acyl-carrier-protein] dehydratase
                          function:
                            preferred_term: trans-2-decenoyl-acyl-carrier-protein isomerase activity
                            term:
                              id: GO:0034017
                              label: trans-2-decenoyl-acyl-carrier-protein isomerase activity
                            substrates:
                              - preferred_term: trans-2-decenoyl-ACP
                            products:
                              - preferred_term: cis-3-decenoyl-ACP
                          locations:
                            - preferred_term: cytosol
                              term:
                                id: GO:0005829
                                label: cytosol
                          role_description: >-
                            Introduces the cis double bond at the C10 branch point.
                  - order: 3
                    role: committed unsaturated-chain elongation
                    node:
                      id: fabB_cis_decenoyl_condensation
                      label: FabB cis-3-decenoyl-ACP condensation
                      module_type: REACTION
                      annotons:
                        - id: fabB_condensing_enzyme
                          label: FabB 3-oxoacyl-ACP synthase I
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: FabB/KAS I condensing enzymes
                              term:
                                id: PANTHER:PTHR11712:SF306
                                label: 3-OXOACYL-[ACYL-CARRIER-PROTEIN] SYNTHASE 1
                              representative_members:
                                - preferred_term: fabB (Escherichia coli K-12)
                                  term:
                                    id: UniProtKB:P0A953
                                    label: 3-oxoacyl-[acyl-carrier-protein] synthase 1
                                - preferred_term: fabB (Pseudomonas putida KT2440)
                                  term:
                                    id: UniProtKB:Q88FC3
                                    label: 3-oxoacyl-[acyl-carrier-protein] synthase 1
                              ancestral_nodes:
                                - preferred_term: PAINT ketosynthase root node
                                  term:
                                    id: PANTHER:PTN000918584
                                    label: PTN000918584
                                  description: >-
                                    Local PAINT IBD node in PTHR11712 supporting
                                    GO:0004315, seeded by P0A953 and P0AAI5.
                                  evidence:
                                    - source_id: GO_REF:0000033
                                      statement: IBD propagation from PAINT node PTN000918584 in PTHR11712.
                                    - source_id: file:interpro/panther/PTHR11712/PTHR11712-paint.tsv
                                      title: Local PTHR11712 PAINT IBD export
                                      statement: PTN000918584 carries GO:0004315 with P0A953 among its seeds.
                          function:
                            preferred_term: 3-oxoacyl-acyl-carrier-protein synthase activity
                            term:
                              id: GO:0004315
                              label: 3-oxoacyl-[acyl-carrier-protein] synthase activity
                            substrates:
                              - preferred_term: cis-3-decenoyl-ACP
                              - preferred_term: malonyl-ACP
                            products:
                              - preferred_term: 3-oxo-cis-5-dodecenoyl-ACP
                              - preferred_term: holo-ACP
                              - preferred_term: carbon dioxide
                          locations:
                            - preferred_term: cytosol
                              term:
                                id: GO:0005829
                                label: cytosol
                          role_description: >-
                            Commits the FabA product to elongation before FabI can
                            reduce the trans-2 isomer, retaining the cis double bond.
              - id: fabN_route
                label: FabN route (Enterococcus-type FabZ-family dehydratase/isomerase)
                module_type: REACTION
                annotons:
                  - id: fabN_dehydratase
                    label: FabN 3-hydroxydecanoyl-ACP dehydratase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: FabZ-subfamily dehydratases (FabN-type members)
                        term:
                          id: PANTHER:PTHR30272:SF1
                          label: 3-HYDROXYACYL-[ACYL-CARRIER-PROTEIN] DEHYDRATASE
                        representative_members:
                          - preferred_term: fabZ1 / fabN (Enterococcus faecalis V583)
                            term:
                              id: UniProtKB:Q820V3
                              label: 3-hydroxyacyl-[acyl-carrier-protein] dehydratase FabZ
                    function:
                      preferred_term: (3R)-hydroxyacyl-acyl-carrier-protein dehydratase activity
                      term:
                        id: GO:0019171
                        label: (3R)-hydroxyacyl-[acyl-carrier-protein] dehydratase activity
                      substrates:
                        - preferred_term: (3R)-hydroxydecanoyl-ACP
                      products:
                        - preferred_term: trans-2-decenoyl-ACP
                        - preferred_term: water
                    role_description: >-
                      Dehydrates the C10 intermediate, as FabA does; the general
                      dehydratase activity is shared with the whole FabZ subfamily.
                  - id: fabN_isomerase
                    label: FabN trans-2-decenoyl-ACP isomerase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: >-
                          FabN-type isomerase-competent FabZ homologs (member-level
                          property, not delimited by a PANTHER subfamily)
                        representative_members:
                          - preferred_term: fabZ1 / fabN (Enterococcus faecalis V583)
                            term:
                              id: UniProtKB:Q820V3
                              label: 3-hydroxyacyl-[acyl-carrier-protein] dehydratase FabZ
                    function:
                      preferred_term: trans-2-decenoyl-acyl-carrier-protein isomerase activity
                      term:
                        id: GO:0034017
                        label: trans-2-decenoyl-acyl-carrier-protein isomerase activity
                      substrates:
                        - preferred_term: trans-2-decenoyl-ACP
                      products:
                        - preferred_term: cis-3-decenoyl-ACP
                    role_description: >-
                      Introduces the cis double bond; the activity depends on the
                      beta3/beta4 tunnel strands, so it cannot be read from FabZ
                      subfamily membership.
              - id: fabM_route
                label: FabM route (Streptococcus-type crotonase-fold isomerase)
                module_type: REACTION
                annotons:
                  - id: fabM_isomerase
                    label: FabM trans-2-decenoyl-ACP isomerase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: FabM trans-2-decenoyl-ACP isomerases
                        term:
                          id: NCBIfam:NF050134
                          label: trans-2-decenoyl-ACP isomerase
                        representative_members:
                          - preferred_term: fabM (Streptococcus pneumoniae R6)
                            term:
                              id: UniProtKB:Q8DR19
                              label: Trans-2-decenoyl-[acyl-carrier-protein] isomerase
                    function:
                      preferred_term: trans-2-decenoyl-acyl-carrier-protein isomerase activity
                      term:
                        id: GO:0034017
                        label: trans-2-decenoyl-acyl-carrier-protein isomerase activity
                      substrates:
                        - preferred_term: trans-2-decenoyl-ACP
                      products:
                        - preferred_term: cis-3-decenoyl-ACP
                    role_description: >-
                      Isomerizes trans-2-decenoyl-ACP made by the general FabZ
                      dehydratase; FabM has no dehydratase activity, so the
                      branch point lies after trans-2-decenoyl-ACP formation.
              - id: aerobic_desaturase_route
                label: Oxygen-dependent desaturation of membrane acyl chains
                module_type: REACTION
                annotons:
                  - id: des_acyl_lipid_desaturase
                    label: Des-type acyl-lipid desaturase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Bacillus Des-type membrane acyl-lipid Delta5 desaturases
                        term:
                          id: PANTHER:PTHR19353:SF73
                          label: FATTY ACID DESATURASE
                        representative_members:
                          - preferred_term: des (Bacillus subtilis 168)
                            term:
                              id: UniProtKB:O34653
                              label: Fatty acid desaturase
                    function:
                      preferred_term: acyl-lipid Delta5 desaturase (oxygen-dependent desaturase class)
                      term:
                        id: GO:0016717
                        label: oxidoreductase activity, acting on paired donors, with oxidation
                          of a pair of donors resulting in the reduction of molecular oxygen to two
                          molecules of water
                      substrates:
                        - preferred_term: palmitoyl chains of membrane phospholipids
                        - preferred_term: dioxygen
                      products:
                        - preferred_term: cis-5-hexadecenoyl chains of membrane phospholipids
                        - preferred_term: water
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Inserts a cis double bond into saturated acyl chains
                      already in membrane phospholipids; induced on a shift to
                      low temperature.
    - order: 2
      role: long-chain unsaturated-product extension
      optional: true
      node:
        id: fabF_palmitoleoyl_condensation
        label: FabF palmitoleoyl-ACP condensation
        module_type: REACTION
        annotons:
          - id: fabF_condensing_enzyme
            label: FabF 3-oxoacyl-ACP synthase II
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FabF/KAS II condensing enzymes
                term:
                  id: PANTHER:PTHR11712:SF336
                  label: 3-OXOACYL-[ACYL-CARRIER-PROTEIN] SYNTHASE, MITOCHONDRIAL
                representative_members:
                  - preferred_term: fabF (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0AAI5
                      label: 3-oxoacyl-[acyl-carrier-protein] synthase 2
                  - preferred_term: fabF (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88LL4
                      label: 3-oxoacyl-[acyl-carrier-protein] synthase 2
                ancestral_nodes:
                  - preferred_term: PAINT ketosynthase root node
                    term:
                      id: PANTHER:PTN000918584
                      label: PTN000918584
                    description: >-
                      Local PAINT IBD node in PTHR11712 supporting GO:0004315,
                      seeded by P0AAI5 and P0A953.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000918584 in PTHR11712.
                      - source_id: file:interpro/panther/PTHR11712/PTHR11712-paint.tsv
                        title: Local PTHR11712 PAINT IBD export
                        statement: PTN000918584 carries GO:0004315 with P0AAI5 among its seeds.
            function:
              preferred_term: 3-oxoacyl-acyl-carrier-protein synthase activity
              term:
                id: GO:0004315
                label: 3-oxoacyl-[acyl-carrier-protein] synthase activity
              substrates:
                - preferred_term: cis-9-hexadecenoyl-ACP
                - preferred_term: malonyl-ACP
              products:
                - preferred_term: 3-oxo-cis-11-octadecenoyl-ACP
                - preferred_term: holo-ACP
                - preferred_term: carbon dioxide
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Extends palmitoleoyl-ACP into the cis-vaccenoyl branch; shared
              FAS-II reduction reactions complete the elongation round. In E.
              coli this step sets the temperature-dependent cis-vaccenate
              content of the membrane.
  connections:
    - source: fabA_hydroxydecanoyl_dehydration
      target: fabA_decenoyl_isomerization
      connection_type: PROVIDES_INPUT_FOR
      description: The first FabA reaction supplies trans-2-decenoyl-ACP.
    - source: fabA_decenoyl_isomerization
      target: fabB_cis_decenoyl_condensation
      connection_type: PROVIDES_INPUT_FOR
      description: FabA supplies cis-3-decenoyl-ACP to FabB.
    - source: fabB_cis_decenoyl_condensation
      target: fabF_palmitoleoyl_condensation
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        FabB initiates preservation of the cis double bond through iterative
        FAS-II elongation; after intervening shared cycles produce
        palmitoleoyl-ACP, FabF can perform the C16:1-to-C18:1 condensation.
  knowledge_gaps:
    - gap_statement: >-
        The condensing enzyme that commits cis-3-decenoyl-ACP to elongation in
        FabM and FabN organisms is not established at the protein level for
        most lineages.
      boundary: >-
        E. faecalis FabF1 can replace E. coli FabB in complementation, but
        whether it or another ketosynthase performs the committed step in
        Enterococcus and Streptococcus cells, and how the cis intermediate
        escapes reduction there, has not been shown biochemically.
      gap_kind:
        - BIOLOGY
  notes: >-
    The module is abstract and species-neutral. Exemplars come from organisms
    with experimental evidence: E. coli K-12 for FabA, FabB and FabF (with P.
    putida KT2440 orthologs), S. pneumoniae for FabM, E. faecalis for FabN and
    B. subtilis for Des. The cis double-bond step is modelled as a ROUTE
    variant set because the routes use different chemistry and unrelated
    enzymes: the FabA/FabB route keeps three separate reactions because FabB
    commitment is specific to it; the FabN route is FabA-like but its isomerase
    is a member-level property within the FabZ subfamily (PTHR30272:SF1), so the
    isomerase annoton carries no PANTHER identifier while the dehydratase
    annoton uses SF1, which the family review supports family-wide; the FabM
    route is grounded on the NCBIfam model NF050134 recorded in the FabM UniProt
    record, because PANTHER PTHR42964:SF1 also holds hydratase-lyases and
    polyketide dehydratases. GO has no term for Delta5 acyl-lipid desaturase
    activity, so the Des annoton uses the oxygen-dependent desaturase class
    GO:0016717. The FabN accession Q820V3 is inferred from the "FabZ1" genome
    annotation named by Wang and Cronan (2004). P. aeruginosa DesA and DesB
    (oxygen-dependent desaturases acting on phospholipids and acyl-CoA) are
    further aerobic examples not used as exemplars because their entries are
    unreviewed. TesA, TesB, and PP_5331 of the KEGG ppu01040 map are excluded
    because they hydrolyse thioesters rather than introduce or elongate cis
    unsaturation. FabZ and the reductive FAS-II enzymes are shared-cycle
    context; the type_ii_fatty_acid_synthesis module is authoritative for the
    shared elongation cycle and this module for the unsaturated branch.
    PANTHER's official PTHR11712:SF336 label includes "MITOCHONDRIAL" even
    though the subfamily also contains bacterial FabF proteins; the label is
    retained verbatim for identifier validation and is not a localization
    assertion.
