id: MODULE:bacterial_unsaturated_fatty_acid_biosynthesis
title: Bacterial FabA/FabB unsaturated-fatty-acid biosynthesis
description: >-
  A reusable oxygen-independent branch of bacterial type-II fatty-acid
  synthesis in which FabA dehydrates 3-hydroxydecanoyl-ACP and isomerizes the
  resulting trans-2-decenoyl-ACP to cis-3-decenoyl-ACP, FabB commits that
  intermediate to elongation, and FabF can extend palmitoleoyl-ACP toward
  cis-vaccenoyl-ACP. General FAS-II reduction and dehydration reactions are
  shared with saturated-fatty-acid synthesis and are outside this focused
  branch.
status: DRAFT
evidence:
  - source_id: GO:0006636
    title: unsaturated fatty acid biosynthetic process
    statement: >-
      GO:0006636 provides the biological-process scope for formation of
      unsaturated fatty acids.
  - source_id: file:PSEPK/fabA/fabA-uniprot.txt
    title: UniProtKB entry Q88FC4 for PSEPK FabA
    statement: >-
      The reviewed entry assigns both 3-hydroxydecanoyl-ACP dehydration and
      trans-2-decenoyl-ACP isomerization to the exact KT2440 FabA exemplar.
  - source_id: file:PSEPK/fabB/fabB-uniprot.txt
    title: UniProtKB entry Q88FC3 for PSEPK FabB
    statement: >-
      The entry records condensation of cis-3-decenoyl-ACP with malonyl-ACP,
      the first elongation reaction after FabA introduces cis unsaturation.
  - source_id: file:PSEPK/fabF/fabF-uniprot.txt
    title: UniProtKB entry Q88LL4 for PSEPK FabF
    statement: >-
      The entry assigns efficient elongation of palmitoleoyl-ACP toward
      cis-vaccenoyl-ACP to the exact KT2440 FabF exemplar.
  - source_id: file:projects/P_PUTIDA/data/psepk_uniprot_metadata.tsv
    title: PSEPK UniProt metadata snapshot
    statement: >-
      The local UniProt metadata identifies TesA as a multifunctional
      hydrolase, TesB as an acyl-CoA thioesterase, and PP_5331 as a long-chain
      acyl-CoA thioester hydrolase; none has an ACP-dependent reaction that
      introduces or elongates cis unsaturation.
module:
  id: bacterial_unsaturated_fatty_acid_biosynthesis
  label: Bacterial FabA/FabB unsaturated-fatty-acid biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: unsaturated fatty acid biosynthetic process
      term:
        id: GO:0006636
        label: unsaturated fatty acid biosynthetic process
      description: >-
        Oxygen-independent introduction and preservation of cis unsaturation
        during bacterial type-II fatty-acid synthesis.
  parts:
    - order: 1
      role: decanoyl-branch dehydration
      node:
        id: fabA_hydroxydecanoyl_dehydration
        label: FabA 3-hydroxydecanoyl-ACP dehydration
        module_type: REACTION
        annotons:
          - id: fabA_dehydratase
            label: FabA 3-hydroxydecanoyl-ACP dehydratase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FabA-family dehydratase/isomerases
                term:
                  id: PANTHER:PTHR30272
                  label: 3-hydroxyacyl-[acyl-carrier-protein] dehydratase
                representative_members:
                  - preferred_term: PSEPK FabA
                    term:
                      id: UniProtKB:Q88FC4
                      label: 3-hydroxydecanoyl-[acyl-carrier-protein] dehydratase
            function:
              preferred_term: (3R)-hydroxyacyl-acyl-carrier-protein dehydratase activity
              term:
                id: GO:0019171
                label: (3R)-hydroxyacyl-[acyl-carrier-protein] dehydratase activity
              substrates:
                - preferred_term: (3R)-hydroxydecanoyl-ACP
              products:
                - preferred_term: trans-2-decenoyl-ACP
                - preferred_term: water
            role_description: >-
              Generates the trans-2-decenoyl-ACP substrate for the
              double-bond-shifting FabA reaction.
    - order: 2
      role: cis double-bond introduction
      node:
        id: fabA_decenoyl_isomerization
        label: FabA trans-2-decenoyl-ACP isomerization
        module_type: REACTION
        annotons:
          - id: fabA_isomerase
            label: FabA trans-2-decenoyl-ACP isomerase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FabA-family dehydratase/isomerases
                term:
                  id: PANTHER:PTHR30272
                  label: 3-hydroxyacyl-[acyl-carrier-protein] dehydratase
                representative_members:
                  - preferred_term: PSEPK FabA
                    term:
                      id: UniProtKB:Q88FC4
                      label: 3-hydroxydecanoyl-[acyl-carrier-protein] dehydratase
            function:
              preferred_term: trans-2-decenoyl-acyl-carrier-protein isomerase activity
              term:
                id: GO:0034017
                label: trans-2-decenoyl-acyl-carrier-protein isomerase activity
              substrates:
                - preferred_term: trans-2-decenoyl-ACP
              products:
                - preferred_term: cis-3-decenoyl-ACP
            role_description: >-
              Introduces the cis double bond at the committed branch point.
    - order: 3
      role: committed unsaturated-chain elongation
      node:
        id: fabB_cis_decenoyl_condensation
        label: FabB cis-3-decenoyl-ACP condensation
        module_type: REACTION
        annotons:
          - id: fabB_condensing_enzyme
            label: FabB 3-oxoacyl-ACP synthase I
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FabB/KAS-I condensing enzymes
                term:
                  id: PANTHER:PTHR11712
                  label: polyketide synthase-related
                representative_members:
                  - preferred_term: PSEPK FabB
                    term:
                      id: UniProtKB:Q88FC3
                      label: 3-oxoacyl-[acyl-carrier-protein] synthase 1
            function:
              preferred_term: 3-oxoacyl-acyl-carrier-protein synthase activity
              term:
                id: GO:0004315
                label: 3-oxoacyl-[acyl-carrier-protein] synthase activity
              substrates:
                - preferred_term: cis-3-decenoyl-ACP
                - preferred_term: malonyl-ACP
              products:
                - preferred_term: 3-oxo-cis-5-dodecenoyl-ACP
                - preferred_term: holo-ACP
                - preferred_term: carbon dioxide
            role_description: >-
              Commits the FabA product to elongation while retaining the cis
              double bond.
    - order: 4
      role: long-chain unsaturated-product extension
      optional: true
      node:
        id: fabF_palmitoleoyl_condensation
        label: FabF palmitoleoyl-ACP condensation
        module_type: REACTION
        annotons:
          - id: fabF_condensing_enzyme
            label: FabF 3-oxoacyl-ACP synthase II
            participant:
              selector_type: FAMILY
              family:
                preferred_term: FabF/KAS-II condensing enzymes
                term:
                  id: PANTHER:PTHR11712
                  label: polyketide synthase-related
                representative_members:
                  - preferred_term: PSEPK FabF
                    term:
                      id: UniProtKB:Q88LL4
                      label: 3-oxoacyl-[acyl-carrier-protein] synthase 2
            function:
              preferred_term: 3-oxoacyl-acyl-carrier-protein synthase activity
              term:
                id: GO:0004315
                label: 3-oxoacyl-[acyl-carrier-protein] synthase activity
              substrates:
                - preferred_term: cis-9-hexadecenoyl-ACP
                - preferred_term: malonyl-ACP
              products:
                - preferred_term: 3-oxo-cis-11-octadecenoyl-ACP
                - preferred_term: holo-ACP
                - preferred_term: carbon dioxide
            role_description: >-
              Extends palmitoleoyl-ACP into the cis-vaccenoyl branch; shared
              FAS-II reduction reactions complete the elongation round.
  connections:
    - source: fabA_hydroxydecanoyl_dehydration
      target: fabA_decenoyl_isomerization
      connection_type: PROVIDES_INPUT_FOR
      description: The first FabA reaction supplies trans-2-decenoyl-ACP.
    - source: fabA_decenoyl_isomerization
      target: fabB_cis_decenoyl_condensation
      connection_type: PROVIDES_INPUT_FOR
      description: FabA supplies cis-3-decenoyl-ACP to FabB.
    - source: fabB_cis_decenoyl_condensation
      target: fabF_palmitoleoyl_condensation
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        FabB initiates preservation of the cis double bond through iterative
        FAS-II elongation; after intervening shared cycles produce
        palmitoleoyl-ACP, FabF can perform the C16:1-to-C18:1 condensation.
  notes: >-
    Exact KT2440 accessions are representative members and do not restrict the
    module to Pseudomonas. This oxygen-independent route is often called the
    anaerobic pathway because it does not require an oxygen-dependent
    desaturase; that name does not imply that it functions only during
    anaerobic growth. TesA, TesB, and PP_5331 are excluded because their local
    records support thioester hydrolysis or other hydrolase activities, not a
    connected ACP-bound route for introducing cis unsaturation. FabZ and the
    remaining reductive FAS-II enzymes are shared-cycle context rather than
    defining members of this focused branch. This module is authoritative for
    the FabA dehydration/isomerization, FabB commitment, and optional FabF
    extension reactions. The broader type_ii_fatty_acid_synthesis module retains
    a compact copy of the FabA/FabB branch only to show where it diverges from
    the shared elongation cycle.
