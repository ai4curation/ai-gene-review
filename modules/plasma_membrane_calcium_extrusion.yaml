id: MODULE:plasma_membrane_calcium_extrusion
title: Plasma membrane calcium extrusion — ATP-driven PMCA pumps (ATP2B1-4), Na+/Ca2+ exchangers NCX (SLC8A1-3) and K+-dependent Na+/Ca2+ exchangers NCKX (SLC24A1-4) exporting cytosolic Ca2+ across the plasma membrane
description: >-
  Cells keep cytosolic free calcium near 100 nM, about four orders of magnitude below the
  extracellular concentration, and terminate calcium signals by removing calcium from
  the cytosol. Across the plasma membrane, three transporter families export calcium.
  The plasma membrane calcium ATPases PMCA1-4 (ATP2B1-4) are P-type pumps that couple
  hydrolysis of one ATP to the export of one Ca2+ (with proton counter-transport); they
  have high calcium affinity and low capacity, are activated by calcium-calmodulin, and
  require the single-pass subunit neuroplastin or basigin for activity. The
  sodium/calcium exchangers NCX1-3 (SLC8A1-3) use the inward sodium gradient to export
  one Ca2+ for three Na+; they have lower affinity but high capacity and dominate
  calcium removal in cardiomyocytes. The potassium-dependent sodium/calcium exchangers
  NCKX1-4 (SLC24A1-4) export one Ca2+ together with one K+ in exchange for four Na+,
  which lets them keep extruding calcium at low cytosolic concentration, as in rod and
  cone photoreceptor outer segments. Both exchanger families can run in reverse and admit
  calcium when the membrane is depolarized or cytosolic sodium is high. PMCA isoform
  usage and NCX/NCKX expression are tissue-specific, but the three routes act in
  parallel in most cells.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001139
    title: calcium transport pathway
    statement: >-
      RGD Pathway Ontology record for the calcium transport pathway (55 human genes curated
      by RGD). Its text describes calcium extrusion by the four plasma membrane PMCA pumps
      and by the NCX and NCKX exchangers, and its diagram draws Ca2+ pumped out and Ca2+
      exchanged with Na+ in (3) and Na+ in (4). This module models that plasma membrane
      extrusion system only; the record's other transport systems are separate modules or
      unmodelled (see notes). Human genes in scope from RGD's list: ATP2B1 ATP2B2 ATP2B3
      ATP2B4 SLC8A1 SLC8A2 SLC8A3 SLC24A1 SLC24A2 SLC24A3 SLC24A4 (SLC24A5 excluded, see
      notes). Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001139.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: The RGD record text names the four plasma membrane PMCA pumps.
    supporting_text: There are three ER/SR (SERCAs, ATP2A1-3) and four plasma membrane (PMCAs, ATP2B1-4) pumps.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: >-
      The RGD record text gives the two exchanger families and their stoichiometries, used
      for the substrates and products of the NCX and NCKX annotons.
    supporting_text: >-
      the Na+/Ca2+ exchangers (NCX or SLC8A1-3) and the Na+/Ca2+ -K+ exchangers (NCKX or
      SLC24A1-5) exchange one Ca2+ for three Na+ ions or co-transport one Ca2+ and one K+
      in exchange for four Na+, respectively
  - source_id: GO:0006816
    title: calcium ion transport
    statement: >-
      The GO process mapped to PW:0001139 (skos:closeMatch) in the project's PW-GO mappings
      (projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is too broad for this
      module, whose concept is its descendant GO:1990034 calcium ion export across plasma
      membrane (is_a GO:0070588 is_a GO:0006816), checked in go-basic 2026-07-26.
  - source_id: GO:1990034
    title: calcium ion export across plasma membrane
    statement: >-
      Module concept: the directed movement of calcium ions from inside a cell across the
      plasma membrane into the extracellular region. Carried in GOA by ATP2B1 and ATP2B3
      (IDA, PMID:18029012) and placed here on every annoton; for the exchangers and ATP2B2/
      ATP2B4 it is an authored refinement of their experimental transport rows (see notes).
  - source_id: Reactome:R-HSA-418309
    title: ATP2B1-4 transport cytosolic Ca2+ to extracellular region
    statement: Reactome reaction for PMCA-mediated calcium export.
    supporting_text: The plasma membrane Ca-ATPases 1-4 (ATP2B1-4, PMCAs) are P-type Ca2+-ATPases regulated by calmodulin.
  - source_id: Reactome:R-HSA-425561
    title: Sodium/Calcium exchangers
    statement: Reactome pathway grouping the NCX and NCKX exchanger families.
    supporting_text: the Na+/Ca2+-K+ exchanger family designated NCKX (SLC24) (five members NCKX1-5)
  - source_id: PMID:30190470
    title: Structure of the human plasma membrane Ca(2+)-ATPase 1 in complex with its obligatory subunit neuroplastin.
    statement: >-
      Cryo-EM structure of human PMCA1 with neuroplastin; neuroplastin and basigin are
      obligatory PMCA subunits.
    supporting_text: Neuroplastin (NPTN) and basigin were identified as previously unrecognized obligatory subunits of PMCAs that dramatically increase the efficiency of PMCA-mediated Ca2+ clearance
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001139 (calcium transport pathway) through
  the RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml,
  mapped GO:0006816 calcium ion transport). RGD curates 55 human genes to PW:0001139, mixing
  unrelated channel, pump and exchanger families, so the project models the record as one
  human module per transport system. This module is the plasma membrane extrusion system;
  modules/store_operated_calcium_entry.yaml (drafted in the same batch) is the store-
  operated entry system. PW:0001139 is the only PW evidence source_id; its sub-pathway
  PW:0001140 (calcium/calcium-mediated signaling) is mentioned here in prose only.


  (1) STRUCTURE. The three families are genuine, unrelated in mechanism (a P-type ATPase
  and two subfamilies of the CaCA cation/calcium antiporter superfamily), and act in
  parallel, so the root is a ONE_OR_MORE variant set of three ROUTE variants (PMCA, NCX,
  NCKX), each a transport step with its own ONE_OR_MORE REALIZER set of paralogs. There
  are no ordered parts and no connections: extrusion is one transport step realized by
  any of eleven proteins.


  (2) SUBSTRATES AND PRODUCTS. Grounded to ChEBI with labels checked in OLS (November
  2026): calcium(2+) CHEBI:29108, sodium(1+) CHEBI:29101, potassium(1+) CHEBI:29103,
  ATP(4-) CHEBI:30616, ADP(3-) CHEBI:456216, hydrogenphosphate CHEBI:43474, water
  CHEBI:15377. Compartments are given in preferred_term (cytosol, extracellular). The
  PMCA reaction follows the GO:0005388 definition (RHEA:18105, ATP + H2O + Ca2+(in) = ADP
  + phosphate + Ca2+(out)); proton counter-transport is mentioned in prose but not
  modelled, as GO's definition omits it and its stoichiometry is uncertain. Exchanger
  stoichiometries (3 Na+ : 1 Ca2+ for NCX; 4 Na+ : 1 Ca2+ + 1 K+ for NCKX) follow the
  RGD text and the GO:0005432 and GO:0008273 definitions.


  (3) MOLECULAR FUNCTIONS. From GOA (QuickGO, November 2026), checked in go-basic
  2026-07-26. PMCA: GO:0005388 P-type calcium transporter activity, EXP for ATP2B2
  (PMID:15829536, PMID:17234811; also the ATP2B2 gene review core function), IMP for
  ATP2B4 (PMID:8530416), TAS only for ATP2B1 and ATP2B3, which have IDA rows for the
  parent GO:0015085 and, for ATP2B3, IDA for the SynGO child GO:1905056; the SynGO
  "involved in" children were not used because they precompose a synaptic context.
  NCX: GO:0005432 calcium:sodium antiporter activity, IDA/IMP for SLC8A1 (PMID:1374913,
  PMID:25589784); SLC8A2 and SLC8A3 have only Reactome TAS rows (no human experimental
  row), so their activity rests on family membership. NCKX: GO:0008273 calcium,
  potassium:sodium antiporter activity, IDA for SLC24A1-4 (PMID:26631410; also
  PMID:10662833 for SLC24A2 and EXP PMID:12379639 for SLC24A4). GO:0005515 protein binding
  and the PMCA4 scaffold functions (calmodulin binding, calcineurin binding,
  nitric-oxide synthase inhibitor activity) are not used.


  (4) PROCESS ON ANNOTONS. GO:1990034 calcium ion export across plasma membrane is in GOA
  only for ATP2B1 and ATP2B3 (IDA). It is authored for ATP2B2, ATP2B4 (GOA GO:1901660
  calcium ion export, IDA), the NCX and the NCKX paralogs (GOA GO:0070588 calcium ion
  transmembrane transport, IDA or TAS). The transporter itself performs the export, so
  the term describes work the gene product does; it is not a substrate-for-participant
  substitution. The exchangers also run in reverse (GOA has calcium ion import rows by
  IDA for SLC8A1, SLC24A2 and SLC24A5), which is a known property noted here but not
  modelled as a separate step.


  (5) BOUNDARY DECISIONS. SLC24A5 (NCKX5) is on RGD's list but excluded as a participant:
  in melanocytes the native protein is in the trans-Golgi network and acts as an
  intracellular exchanger in melanogenesis (PMID:18166528), so it does not export
  calcium across the plasma membrane. SLC8B1 (NCLX) is the mitochondrial Na+/Ca2+(Li+)
  exchanger and belongs with mitochondrial calcium handling, not here. The Golgi SPCA
  pumps ATP2C1 and ATP2C2 and the ER SERCA pumps ATP2A1-3 pump into organelles, not
  across the plasma membrane; SERCA belongs to the planned er_calcium_store_cycling
  module. Neuroplastin (NPTN) and basigin (BSG), obligatory PMCA subunits
  (PMID:30190470), are not on RGD's list and are not modelled as annotons in this draft;
  adding them as accessory subunits of the PMCA route is a follow-up. Calmodulin
  activation of PMCA and the regulatory interactions of PMCA4 (14-3-3, nNOS,
  calcineurin) are regulation context.


  (6) OVERLAPS WITH OTHER MODULES. SLC24A1 and SLC24A2 are also exchanger annotons in
  modules/visual_phototransduction.yaml, where they extrude outer-segment calcium during
  the light response; ATP2B2 appears in the context of modules/hair_cell_mechanotransduction.yaml.
  Here they are modelled in their general transport role; the two modules do not
  conflict.


  (7) GO-CAM LINKS. No production GO-CAM in gocams/index.tsv (any species) contains
  ATP2B1-4, SLC8A1-3 or SLC24A1-5, so there are no gocam_associations. The seed's
  best_gocam (gomodel:65d7e4ac00002121, ITPR1-HSPA9-VDAC1 mitochondrial calcium import in
  apoptosis) is a gene-overlap lead and is unrelated to this module.


  (8) OTHER PW:0001139 GENES NOT MODELLED HERE. STIM1 STIM2 ORAI1 ORAI2 ORAI3 are in the
  store-operated entry module. Unmodelled in this batch, by symbol: voltage-gated
  channels CACNA1A CACNA1B CACNA1C CACNA1D CACNA1E CACNA1F CACNA1G CACNA1H CACNA1I CACNA1S
  and auxiliary CACNB1 CACNB2 CACNB3 CACNB4; cyclic nucleotide-gated channels CNGA1 CNGA2
  CNGA3 CNGA4 CNGB1 CNGB3; TRPV5 TRPV6; endolysosomal TPCN1 TPCN2 MCOLN1; Golgi SPCA
  pumps ATP2C1 ATP2C2; ER store genes ITPR1 ITPR2 ITPR3 RYR1 RYR2 RYR3 ATP2A1 ATP2A2
  ATP2A3; mitochondrial MCU and SLC8B1; and SLC24A5 (note 5).


  (9) GROUNDING. UniProt accessions: ATP2B2 from genes/human/ATP2B2/ATP2B2-uniprot.txt,
  the rest from UniProt REST (reviewed human entries). GO ids and labels checked against
  .cache/rgd_pw/go-basic.obo (2026-07-26); none obsolete. Only ATP2B2 has a gene review;
  the other ten participants have none yet, which is curation follow-up for the project
  plan. No PANTHER or PTN ids are asserted: every participant is a concrete human gene
  product.
