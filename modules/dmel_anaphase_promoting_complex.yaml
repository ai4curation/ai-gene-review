id: MODULE:dmel_anaphase_promoting_complex
title: Anaphase-promoting complex/cyclosome in Drosophila melanogaster
description: >-
  The anaphase-promoting complex/cyclosome (APC/C) is a large multisubunit RING E3 ubiquitin
  ligase that drives mitotic exit by targeting securin and mitotic cyclins for proteasomal
  degradation, and that keeps APC/C substrate levels low in G1. Its catalytic core is formed
  by the cullin-like subunit Apc2 (Morula) and the RING subunit Apc11 (Lemming A). A platform
  of Apc1 (Shattered), Apc4 and Apc5 (Ida) supports the core and an arc of tetratricopeptide-repeat
  subunits (Cdc27/Apc3, Cdc16/Apc6, Apc7 and Cdc23/Apc8). Substrates are recognized by Apc10
  together with a WD40 coactivator, Fizzy (Cdc20) in mitosis or Fizzy-related (Cdh1) at mitotic
  exit and during endocycles.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000074
  title: 'FlyBase gene group APC: Anaphase-promoting complex'
  statement: >-
    FlyBase release FB2026_03 groups 12 D. melanogaster genes as anaphase-promoting complex
    (APC); this module models that group.
- source_id: GO:0005680
  title: anaphase-promoting complex
  statement: >-
    GO term grounding the module as anaphase-promoting complex.
notes: >-
  FlyBase includes the coactivators Fzy and Fzr in the APC group; they are modelled as alternative
  coactivator variants. The meiosis-specific coactivator Cortex (cort) and Fizzy-related 2
  are not FlyBase members of the group and are not modelled. Subunit-to-subcomplex placement
  follows the conserved APC/C architecture. FlyBase groups realized by this module: APC (FBgg0000074).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_anaphase_promoting_complex.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
