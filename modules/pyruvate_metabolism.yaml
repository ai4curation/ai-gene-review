                      aspartate-family amino acids, gluconeogenesis and, after
                      import, the mitochondrial TCA cycle.
                    gocam_associations:
                      - model: gomodel:YeastPathways_TCA-EUK-PWY
                        activity: gomodel:PYRUVATE-CARBOXYLASE-RXN
                        title: 'TCA cycle, aerobic respiration - imported from: Saccharomyces Genome Database'
                        description: >-
                          PYC1 and PYC2 enable GO:0004736 in cytosol (YeastCyc
