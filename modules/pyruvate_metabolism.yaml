  connections:
    - source: pdc_step
      target: pc_step
      connection_type: POSITIVELY_REGULATES
      description: >-
        Acetyl-CoA produced by the PDC is the obligate allosteric activator of
        pyruvate carboxylase, coordinating the oxidative and anaplerotic fates of
        pyruvate (and, together, supplying acetyl-CoA + oxaloacetate for citrate
        synthesis / the TCA cycle). This direct coupling applies where PDC and
        PC share the mitochondrial matrix (animals); in yeasts PC is cytosolic
        and cannot sense matrix acetyl-CoA directly.
  notes: >-
    The two committed mitochondrial fates of pyruvate, grounded to the human
    enzymes of the pyruvate dehydrogenase complex — PDHA1 (UniProtKB:P08559) and
    PDHB (P11177) of E1 (GO:0004739, EC 1.2.4.1), the E2 core DLAT (P10515,
    GO:0004742, EC 2.3.1.12), the E3-binding structural subunit PDHX (O00330,
    GO:0030674) and the shared E3 DLD (P09622, GO:0004148, EC 1.8.1.4), assembled
    as GO:0045254 — and pyruvate carboxylase PC (P11498, GO:0004736, EC 6.4.1.1).
    GO molecular-function/cellular-component terms were taken from the human GOA
    records; Reactome reaction ids and titles were verified against the local
    reactome cache. Each step uses a PANTHER family selector (generic over paralogs
    and orthologs) plus a concrete human representative member; the PDC is modelled
    as a PROTEIN_COMPLEX node with its five subunit types. PDHX is deliberately
    grounded as a non-catalytic adaptor (its E2-type catalytic His is replaced by
    Ser); DLD is the shared E3 of multiple 2-oxoacid dehydrogenase complexes.
    Upstream, pyruvate comes from glycolysis (via the mitochondrial pyruvate
    carrier); downstream, PDC-derived acetyl-CoA and PC-derived oxaloacetate feed
    the TCA cycle, and PC also feeds gluconeogenesis. PDC activity is
    phospho-regulated by the PDK kinases / PDP phosphatases (not modelled here).
    ALIGN (YeastPathways project, 2026-10): S. cerevisiae (PDA1 P16387, PDB1
    P32473, LAT1 P12695, PDX1 P16451, LPD1 P09624) and S. pombe (pda1, pdb1,
    lat1, pdx1, dld1) exemplars were added to each PDC subunit role; all fall in
    the same PANTHER families as the human subunits (PTHR11516, PTHR11624,
    PTHR23151, PTHR22912), checked against UniProt PANTHER cross-references. The
    pyruvate carboxylase step became an EXACTLY_ONE compartment variant set:
    mitochondrial-matrix PC in animals versus the cytosolic PYC1/PYC2 isozymes of
    S. cerevisiae (PMID:2039506, PMID:1898090) and S. pombe pyr1 (cytoplasmic by
    similarity), so the module-level "mitochondrial matrix" context, which
    previously claimed both enzymes, was removed and the title broadened; the
    slug is unchanged. The PDC-to-PC positive-regulation connection is
    animal-specific. YeastCyc corrections: PDX1 is named in the
    PYRUVDEHYD-PWY comment but absent from its reaction gene lists, and was
    added. Out of scope here: the yeast pyruvate dehydrogenase bypass
    (pyruvate decarboxylase, acetaldehyde dehydrogenase, acetyl-CoA synthetase;
    PMID:9123965), the mitochondrial pyruvate carrier, and PDC
    kinases/phosphatases (yeast PKP1/PKP2 and PTC5/PTC6). GO-CAM disagreements:
    the YeastPathways PYRUVDEHYD-PWY conversion places all PDC activities in the
    cytosol and omits PDX1. The PomBase model 67086be200000251 types pdx1 as
    GO:0005198 structural molecule activity rather than the adaptor activity
    used here, models pkp1/ptc5 regulation, and includes upstream pyruvate
    kinase and pyruvate import, CoA import, citrate synthase, lipoylation,
    alanine transaminase and 2-isopropylmalate synthase activities that lie
    outside this module; it has no pyruvate carboxylase.
