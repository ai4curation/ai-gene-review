    - model: gomodel:YeastPathways_PYRUVDEHYD-PWY
      title: 'pyruvate decarboxylation to acetyl CoA - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with PDA1 and PDB1 (GO:0004739), LAT1 (GO:0004742) and
        LPD1 (GO:0004148) placed in the cytosol rather than the mitochondrial
        matrix; PDX1 is absent and there are no causal edges.
    - model: gomodel:67086be200000251
      title: 'pyruvate decarboxylation to acetyl-CoA (GO:0006086) '
      description: >-
        PomBase S. pombe model with mitochondrial-matrix pda1, pdb1, lat1, pdx1
        (typed as structural molecule activity) and dld1, regulated by the
        pkp1 kinase and ptc5 phosphatase, plus pyruvate kinase, the
        mitochondrial pyruvate carrier, a CoA transporter, citrate synthase,
        lipoylation, alanine transaminase and 2-isopropylmalate synthase
        activities outside this module. Pyruvate carboxylase is not in the
        model.
