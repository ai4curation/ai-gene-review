id: MODULE:pyruvate_metabolism
title: Pyruvate fates — pyruvate dehydrogenase complex and pyruvate carboxylase
description: >-
  The two committed eukaryotic fates of pyruvate that feed the TCA cycle. (1)
  Oxidative decarboxylation by the mitochondrial pyruvate dehydrogenase complex
  (PDC) links glycolysis to the TCA cycle: pyruvate + CoA + NAD+ -> acetyl-CoA +
  CO2 + NADH. Pyruvate enters the matrix through the mitochondrial pyruvate
  carrier. The PDC is a giant mitochondrial-matrix multienzyme machine built on
  a 60-mer E2 (dihydrolipoyllysine-residue acetyltransferase) core, with the
  thiamine-diphosphate-dependent E1 decarboxylase (an alpha2-beta2
  heterotetramer), the E3-binding structural subunit (protein X / E3BP) that
  anchors the dihydrolipoyl dehydrogenase E3, and E3 itself, which reoxidises
  the lipoyl arms and passes electrons to NAD+. The same subunit architecture is
  conserved from yeasts (PDA1, PDB1, LAT1, PDX1, LPD1) to animals (PDHA1, PDHB,
  DLAT, PDHX, DLD), and the E3 is shared with the 2-oxoglutarate and
  branched-chain 2-oxoacid dehydrogenases. PDC flux is switched off by
  phosphorylation of E1alpha by pyruvate dehydrogenase kinases and on by
  dephosphorylation by the phosphatases. (2) Carboxylation by the biotin-dependent
  pyruvate carboxylase (PC): pyruvate + HCO3- + ATP -> oxaloacetate, the
  principal anaplerotic reaction replenishing oxaloacetate and the committed
  first step of gluconeogenesis from pyruvate or lactate. PC is a
  mitochondrial-matrix enzyme in animals, where it is allosterically activated
  by acetyl-CoA, the PDC product, coordinating the two fates; in budding yeast
  the two PC isozymes are cytosolic, so the oxaloacetate they make must be
  imported into mitochondria to replenish the cycle. In humans, inherited
  defects cause severe lactic acidosis and neurological disease: PDHA1
  (X-linked, the commonest), PDHB, DLAT and PDHX deficiencies cause pyruvate
  dehydrogenase complex deficiency (Leigh syndrome spectrum), PC deficiency
  causes lactic acidosis with hypoglycemia, and DLD deficiency (the shared E3)
  gives a combined phenotype.
status: DRAFT
evidence:
  - source_id: YeastPathways:PYRUVDEHYD-PWY
    title: pyruvate decarboxylation to acetyl CoA (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists the E1 (PDA1, PDB1), E2 (LAT1) and E3 (LPD1)
      half-reactions; its comment describes protein X (PDX1) linking LAT1 to
      LPD1 but PDX1 is absent from the reaction gene lists and was added here.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PYRUVDEHYD-PWY
  - source_id: PMID:9123965
    title: Pyruvate metabolism in Saccharomyces cerevisiae.
    statement: >-
      Review of the three pyruvate branch-point reactions in S. cerevisiae:
      the pyruvate dehydrogenase complex, pyruvate decarboxylase (the PDH
      bypass, outside this module) and anaplerotic pyruvate carboxylase.
  - source_id: PMID:2007123
    title: Disruption and mutagenesis of the Saccharomyces cerevisiae PDX1 gene encoding the protein X component of the pyruvate dehydrogenase complex.
    statement: >-
      Protein X (PDX1) binds and positions E3 on the E2 core; pdx1 complexes
      contain E1 and E2 but lack E3 and overall activity, establishing a
      structural rather than catalytic role.
  - source_id: PMID:2039506
    title: 'Yeast pyruvate carboxylase: identification of two genes encoding isoenzymes.'
    statement: >-
      S. cerevisiae has two pyruvate carboxylase genes, PYC1 (major) and PYC2
      (10-20% residual activity in pyc1 nulls), and the residual isozyme is
      located exclusively in the cytoplasm.
  - source_id: PMID:1898090
    title: Electron microscopic localization of pyruvate carboxylase in rat liver and Saccharomyces cerevisiae by immunogold procedures.
    statement: >-
      Immunogold labelling places pyruvate carboxylase in mitochondria in rat
      liver but exclusively in the cytosol in S. cerevisiae.
  - source_id: file:genes/yeast/PYC1/PYC1-ai-review.yaml
    title: PYC1 gene review (S. cerevisiae)
    statement: >-
      The PYC1 review curates GO:0004736 pyruvate carboxylase activity in the
      cytosol as the core function of the major yeast isozyme.
  - source_id: file:genes/yeast/PYC2/PYC2-ai-review.yaml
    title: PYC2 gene review (S. cerevisiae)
    statement: >-
      The PYC2 review curates GO:0004736 in the cytosol for the minor,
      functionally redundant isozyme.
  - source_id: GO:0006090
    title: pyruvate metabolic process
    statement: >-
      The module is grounded in the GO pyruvate metabolic process (GO:0006090),
      covering the oxidative-decarboxylation (PDC) and carboxylation (PC) fates.
  - source_id: Reactome:R-HSA-70268
    title: Pyruvate metabolism
    statement: >-
      Reaction stoichiometries follow the human Reactome pyruvate-metabolism
      reactions R-HSA-9861559 (PDC synthesizes acetyl-CoA from pyruvate) and
      R-HSA-70501 (PC carboxylates pyruvate to oxaloacetate).
  - source_id: file:human/PDHA1/PDHA1-ai-review.yaml
    title: PDHA1 gene review (human)
    statement: >-
      The PDC E1-alpha grounding (UniProtKB:P08559, GO:0004739 pyruvate
      dehydrogenase (acetyl-transferring) activity, GO:0045254 complex) matches the
      completed human PDHA1 review.
  - source_id: file:human/PDHB/PDHB-ai-review.yaml
    title: PDHB gene review (human)
    statement: >-
      The PDC E1-beta grounding (UniProtKB:P11177, GO:0004739, GO:0045254) matches
      the completed human PDHB review.
  - source_id: file:human/DLAT/DLAT-ai-review.yaml
    title: DLAT gene review (human)
    statement: >-
      The PDC E2 core grounding (UniProtKB:P10515, GO:0004742 dihydrolipoyllysine-
      residue acetyltransferase activity, GO:0045254) matches the completed human
      DLAT review.
  - source_id: file:human/PDHX/PDHX-ai-review.yaml
    title: PDHX gene review (human)
    statement: >-
      The E3-binding structural subunit grounding (UniProtKB:O00330, GO:0030674
      protein-macromolecule adaptor activity, GO:0045254) matches the completed
      human PDHX review (a non-catalytic scaffold anchoring DLD).
  - source_id: file:human/DLD/DLD-ai-review.yaml
    title: DLD gene review (human)
    statement: >-
      The shared E3 grounding (UniProtKB:P09622, GO:0004148 dihydrolipoyl
      dehydrogenase (NADH) activity) matches the completed human DLD review.
  - source_id: file:human/PC/PC-ai-review.yaml
    title: PC gene review (human)
    statement: >-
      The pyruvate carboxylase grounding (UniProtKB:P11498, GO:0004736 pyruvate
      carboxylase activity) matches the completed human PC review.
