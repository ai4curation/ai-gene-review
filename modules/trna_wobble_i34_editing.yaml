id: MODULE:trna_wobble_i34_editing
title: Human ADAT2:ADAT3 tRNA wobble I34 editing complex
description: >-
  The human ADAT2:ADAT3 heterodimer edits adenosine 34 to inosine in several precursor tRNA
  families in the nucleoplasm. ADAT2 supplies the zinc-dependent catalytic deaminase active site,
  while the catalytically inactive ADAT3 subunit recognizes tRNA substrates and positions their
  anticodon loops for A34 deamination.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0052718
  title: tRNA-specific adenosine-34 deaminase complex
  statement: GO term grounding the two-subunit ADAT2:ADAT3 complex.
- source_id: Reactome:R-HSA-6782311
  title: ADAT2:ADAT3 (hetADAT) deaminates adenosine-34 in tRNAs
  statement: Reactome models the human ADAT2:ADAT3 heterodimer acting on precursor tRNAs in the nucleus.
- source_id: PMID:25916855
  title: Inosine modifications in human tRNAs are incorporated at the precursor tRNA level.
  statement: Human ADAT2 and ADAT3 form the nuclear hetADAT enzyme that modifies precursor tRNAs.
- source_id: PMID:40120092
  title: ADAT3 variants disrupt the activity of the ADAT tRNA deaminase complex and impair neuronal
    migration.
  statement: Human ADAT3 variants reduce A34-to-I34 editing activity, confirming that ADAT3 is an
    essential non-catalytic partner for the ADAT2 active site.
notes: >-
  This is a concrete human two-subunit module. GO-CAM production models were checked through
  gocams/index.tsv and none currently covers ADAT2 or ADAT3, so the module is grounded in the
  Reactome event R-HSA-6782311, direct ADAT2/ADAT3 gene reviews, and the PTHR11079 family review.
