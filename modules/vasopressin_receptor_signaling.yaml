evidence:
  - source_id: PW:0000491
    title: vasopressin signaling pathway
    statement: >-
      The module boundary follows the RGD Pathway Ontology overview diagram and record text,
      which draw Avp acting on Avpr1a (Gq alpha, phospholipase C beta, second messengers,
      calcium elevation, vasoconstriction) and on Avpr2 (Gs alpha, adenylyl cyclase, cAMP and
      the PKA pathway driving Aqp2 translocation and Aqp2 expression, and so water
      reabsorption), and name the human V1b receptor AVPR1B as the pituitary receptor.
      Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000491.yaml).
  - source_id: PW:0000713
    title: vasopressin signaling pathway via receptor type 2
    statement: >-
      The V2 branch follows the RGD diagram for the receptor type 2 subpathway: Avpr2 to Gnas
      to Adcy6, ATP to cAMP, PKA compartmentalised by Akap7 with Pde4d on Aqp2-bearing
      vesicles, PKA phosphorylation of AQP2 serine 256 and of Pde4d, the Myo5b/Rab11a/Rab11fip2
      trafficking machinery, the v-SNARE Vamp2 with the t-SNAREs Snap23 and syntaxin (3 or 4),
      and Sipa1 as an Aqp2-binding Rap1 GAP required for translocation. Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000713.yaml).
  - source_id: GO:1904117
    title: cellular response to vasopressin
    statement: >-
      Grounded in GO cellular response to vasopressin, the curated closeMatch for PW:0000491
      (and broadMatch for PW:0000713) in the project's PW-GO SSSOM mapping. GO has no
      vasopressin receptor signaling pathway term, so the receptor branches are typed with
      the coupling-class terms GO:0007200 (V1a/V1b) and GO:0007189 (V2).
  - source_id: PMID:1534149
    title: Molecular cloning of the receptor for human antidiuretic hormone.
    statement: >-
      The antidiuretic (V2) receptor stimulates adenylyl cyclase and promotes cAMP-mediated
      insertion of water pores into the luminal membrane of collecting tubule cells.
    supporting_text: >-
      which binds to specific receptors on renal collecting tubule cells, stimulates
      adenylyl cyclase and promotes the cyclic AMP-mediated incorporation of water
      pores into the luminal surface of these cells.
  - source_id: PMID:8140421
    title: Requirement of human renal water channel aquaporin-2 for vasopressin-dependent concentration of urine.
    statement: Human genetic evidence that AQP2 is the obligatory effector of V2 antidiuresis.
    supporting_text: Thus, aquaporin-2 is essential for vasopressin-dependent concentration of urine.
notes: >-
  Derived from the RGD Pathway Ontology diagrams PW:0000491 (vasopressin signaling pathway)
  and PW:0000713 (its receptor type 2 branch) through the RGD_PATHWAY_ONTOLOGY project. Both
  PW ids are listed as evidence because the module covers both. The other PW subpathways
  linked from the PW:0000491 diagram are not claimed: PW:0000712 (receptor type 1 branch)
  has no separate RGD record in the project and its content is the V1 variant here; the
  generic PW:0000227 (Galphas), PW:0000229 (Galphaq) and PW:0000543 (PKA) pathways are
  represented by reference to modules/gpcr_camp_pka_signaling.yaml and
  modules/gpcr_plc_calcium_pkc_signaling.yaml. All 17 RGD-curated human genes (ADCY6 AKAP7
  AQP2 AVP AVPR1A AVPR1B AVPR2 GNA11 GNAQ GNAS MYO5B PDE4D RAB11A RAB11FIP2 SIPA1 SNAP23
  VAMP2) are modelled. Three proteins not on the RGD gene list are added because the RGD
  text names their step and the step has no enzyme otherwise: PRKACA (the PKA catalytic
  subunit that phosphorylates AQP2 Ser256; PKA is drawn only as a pathway node) and the
  syntaxins STX3 and STX4 ("syntaxin (3 or 4)" in the PW:0000713 text). Molecular functions
  come from each protein's experimental (or, where none exists, IBA/TAS) GO annotations in
  QuickGO and from the primary literature, verified against go-basic releases/2026-07-26.

  Receptor variant set. The root module has one shared part (the AVP ligand) and a
  variant_set on receptor coupling class, mirroring modules/dopamine_receptor_signaling.yaml
  and modules/acetylcholine_signaling.yaml. V1 receptors: AVPR1A and AVPR1B both carry IDA
  vasopressin receptor activity (GO:0005000) and couple via pertussis-toxin-insensitive
  Gq/11 to phospholipase C (PMID:8106369, PMID:7929452, PMID:9322919); GNAQ and GNA11 carry
  G protein activity (GO:0003925) as their reviewed core function. No cached paper assays
  the human V1 receptors with GNAQ or GNA11 by name, so the Gq/11 assignment rests on the
  PTX-insensitive PLC coupling plus the RGD diagram's Gq alpha node; downstream PLC beta,
  IP3/calcium and DAG/PKC are included by reference to
  gpcr_plc_calcium_pkc_signaling#plc_beta_activation, not re-modelled. Vasoconstriction,
  hepatic glycogenolysis, platelet and behavioural effects of V1a and ACTH release by V1b
  are physiological outputs of other cell types and are left as prose. AVPR1B can couple
  to cAMP at very high expression (PMID:9322919); this is treated as an overexpression
  effect, not a separate branch. V2 receptor: AVPR2 (GO:0005000 IDA PMID:1534149;
  GO:0007189 IDA) couples to GNAS (P63092, Gs alpha short form, as in the GO-CAM) and ADCY6.
  ADCY6 rather than the generic module's ADCY5 is the cyclase because the RGD diagram names
  Adcy6 and Adcy6-null mice lose dDAVP-stimulated inner-medullary cAMP (PMID:20864687).

  AVP as ligand, not as a pathway participant. Per the CLAUDE.md substrate/participant rule,
  AVP is given its molecular function only: neuropeptide hormone activity (GO:0005184, IDA; a child of hormone activity and receptor ligand activity). It is not given
  cellular response to vasopressin, which is the response of the target cell to AVP, nor
  the receptor-signalling process terms; no human AVP row in GOA carries them either. The
  curated GO-CAM gomodel:67e5e74400004286 models AVP (the Arg-vasopressin chain
  P01185-PRO_0000020515) the same way: an extracellular hormone activity that directly
  positively regulates AVPR2 vasopressin receptor activity and has AVPR2 as input, part of
  renal water absorption (GO:0070295, a physiological process rather than the signalling
  pathway). The module annoton uses the parent accession P01185 with that chain noted.

  AQP2 is a participant, not merely a PKA substrate or a vesicle cargo. AQP2 has two roles
  in this module and the two are treated differently. As the phosphoacceptor of PKA and the
  cargo of the regulated vesicles it is an input: it is listed as a PKA target and is not
  annotated to exocytosis or to the signalling pathway, since cargo does none of the work
  of vesicle transport or fusion. As the apical water channel, it does the work of the
  module's output step itself: water channel activity (GO:0015250, EXP/IMP; nonfunctional
  NDI mutants in PMID:8140421) moves water across the apical membrane, which is the
  transport step of renal water absorption. That passes the "does the gene do any of the
  work" test (it is the channel, not a substrate of one), so the AQP2 annoton is a leaf
  effector with GO:0015250 and process GO:0070295 renal water absorption. Comparator check:
  GO:0070295 in human GOA is carried by AVPR2 (IDA) and HAS2/HYAL2, while AQP2 carries
  renal water homeostasis (GO:0003091, IMP) and water transport (GO:0006833, IDA/IMP) but
  not GO:0070295. Since AQP2 is itself the channel that carries out the transport, the
  module asserts GO:0070295 on the AQP2 annoton and records the absence from GOA as a
  possible curation gap rather than evidence against the role.

  PKA and the AKAP18/PDE4D compartment. The generic cAMP/PKA cascade is not re-modelled:
  the cyclase and PKA tiers point at modules/gpcr_camp_pka_signaling.yaml by module_ref
  (adenylyl_cyclase_activation and pka_creb_output), and the CREB-driven transcription of
  AQP2 that both RGD records describe is covered by that module's PKA/CREB node rather than
  duplicated here. What is specific to this pathway, and therefore modelled, is the vesicle
  compartment: AKAP18 anchors PKA on AQP2-bearing vesicles with PDE4D (PMID:15037626,
  PMID:17135396), PKA phosphorylates AQP2 Ser256 to permit exocytosis (PMID:9169447) and
  phosphorylates PDE4D to activate it (PMID:8663227, PMID:17135396), giving local negative
  feedback on cAMP. Gene-product caveats: the AQP2-vesicle AKAP is the rat AKAP18delta
  splice variant, and human AKAP7 has two reviewed entries (O43687 alpha/beta and Q9P0M2
  gamma) neither of which is the delta isoform, so the annoton uses the main human AKAP7
  entry O43687 and the isoform mismatch is recorded as a knowledge gap. Its function is
  taken as GO:0035591 signaling adaptor activity, the core function in the AKAP7 gene
  review, rather than the GOA row GO:0051018 protein kinase A binding, which is a
  protein-binding descendant and says less about the role; the review's own evidence is for
  cardiac CaV1.2 anchoring, not the AQP2 vesicle, which is why the renal claim is carried by
  the vesicle-specific papers here. PRKACA is the PKA exemplar with cAMP-dependent protein
  kinase activity (GO:0004691); the RGD diagrams draw PKA only as a pathway node, so no
  specific catalytic subunit is named by RGD.

  Trafficking machinery. The recycling step is modelled as one part with four annotons:
  RAB11A (G protein activity GO:0003925, IDA, as in the curated FIP3-Rab11 GO-CAM), its
  effector RAB11FIP2 (small GTPase binding GO:0031267), the actin-based motor MYO5B
  (microfilament motor activity GO:0000146) and SIPA1/SPA-1 (GTPase activator activity
  GO:0005096, EXP), with PMID:17156409 for the myosin Vb/Rab11/Rab11-FIP2 requirement and
  PMID:15196935 for the SPA-1 requirement. SIPA1 was flagged for checking in the task: it is
  retained, because its role is directly supported (it binds AQP2, its Rap1GAP-dead mutant
  and constitutively active Rap1 block apical trafficking, and trafficking is impaired in
  Spa-1-null mice) and the activity asserted is its own experimentally established Rap1 GAP
  activity, not a vasopressin-specific invention. RAB11FIP2's GO:0031267 rests on IEA plus
  IPI protein-kinase and Rab11 interaction rows rather than a direct-assay GTPase-binding
  annotation, which is noted here rather than hidden. The fusion step keeps the vesicle
  R-SNARE VAMP2 (SNAP receptor activity GO:0005484) and the apical Q-SNAREs SNAP23 and
  syntaxin-3/syntaxin-4 as a variant set, with the generic zippering/fusion mechanism left
  to modules/snare_fusion_cycle.yaml. VAMP3 and Munc18b (PMID:18505797) are named in the
  literature but are not on either RGD gene list and are left out; syntaxin-3 and
  syntaxin-4 are included because the PW:0000713 text names "syntaxin (3 or 4)" even though
  neither has an RGD gene link on the diagram.

  Deliberately outside the module. Vasopressin biosynthesis, processing and axonal transport
  (modelled by the curated GO-CAM gomodel:69729a3800003304) are upstream ligand supply.
  Vasoconstriction, pituitary ACTH release, platelet and behavioural effects are downstream
  physiology of the V1 arm in other cell types. AQP3 and AQP4, the constitutive basolateral
  exit route for the water that AQP2 admits, are not on either RGD gene list and are
  mentioned only here. The calcium-dependent, cAMP-dependent but PKA-independent route to
  AQP2 translocation that both RGD records mention is recorded as a knowledge gap, not
  asserted, because neither record names the mediating gene products.
knowledge_gaps:
  - gap_statement: >-
      Which human AKAP7 gene product performs the AQP2-vesicle PKA anchoring that the rat
      AKAP18delta splice variant was shown to perform is not established.
    boundary: >-
      The module grounds the anchoring step on the main human AKAP7 entry O43687; the
      experiments (PMID:15037626, PMID:17135396) used rat AKAP18delta, which corresponds to
      no reviewed human isoform entry.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether the human AQP2 shuttle uses an AKAP7 splice variant, a different
      AKAP, or several redundantly.
    resolution: >-
      Isoform-resolved proteomics and isoform-specific knockdown of AKAP7 variants in human
      collecting-duct principal cells, with AQP2 surface delivery as the readout.
  - gap_statement: >-
      The mechanism of the cAMP-dependent but PKA-independent, calcium-mediated route to
      AQP2 translocation, and which proteins carry it, is unresolved.
    boundary: >-
      Only the PKA-dependent Ser256 route is modelled; no alternative effector branch is
      asserted.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      If a parallel route exists, AQP2 delivery is not strictly PKA-gated and the V2 branch
      has an effector tier the module does not represent.
    resolution: >-
      Identify the cAMP effector (for example an Epac/Rap arm) and test AQP2 surface
      delivery in principal cells with PKA inhibited and calcium clamped.
module:
  id: vasopressin_receptor_signaling
  label: Vasopressin receptor signaling (V1a/V1b Gq and renal V2 Gs/AQP2 branches)
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: cellular response to vasopressin
      term:
        id: GO:1904117
        label: cellular response to vasopressin
      description: >-
        The target-cell response to arginine vasopressin through its three G protein-coupled
        receptors; GO has no vasopressin receptor signaling pathway term, so the coupling-class
        terms GO:0007200 and GO:0007189 type the two branches.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
        description: >-
          Members are grounded on the human proteins; the RGD diagrams are rat curation and
          several key trafficking experiments are rat or rat-derived collecting-duct lines.
    cellular_components:
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
        description: Receptors, G proteins and the cyclase act at the plasma membrane.
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: PKA, the anchored phosphodiesterase and the trafficking machinery act in the cytosol.
  parts:
    - order: 1
      role: vasopressin ligand supply to the receptors
      node:
        id: avp_ligand
        label: Arginine vasopressin as receptor ligand
        module_type: REGULATORY_STEP
        description: >-
          AVP is released from the neurohypophysis and reaches the receptors as an
          extracellular hormone. Its molecular function is receptor ligand activity; the
          signalling and response processes belong to the receiving cell, not to the hormone.
        annotons:
          - id: avp_hormone
            label: AVP neuropeptide hormone activity
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: AVP (Arg-vasopressin chain of the AVP-neurophysin 2-copeptin precursor)
                term:
                  id: UniProtKB:P01185
                  label: Vasopressin-neurophysin 2-copeptin
                description: >-
                  The active ligand is the cleaved Arg-vasopressin chain
                  (UniProtKB:P01185-PRO_0000020515), the entity used by the curated GO-CAM.
            function:
              preferred_term: neuropeptide hormone activity
              term:
                id: GO:0005184
                label: neuropeptide hormone activity
              targets:
                - preferred_term: AVPR2 (V2 receptor)
                  term:
                    id: UniProtKB:P30518
                    label: Vasopressin V2 receptor
                - preferred_term: AVPR1A (V1a receptor)
                  term:
                    id: UniProtKB:P37288
                    label: Vasopressin V1a receptor
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              The hormone that occupies the receptors. No process role is asserted: AVP
              performs none of the steps of the signalling pathway it triggers, and no human
              AVP annotation in GOA carries the receptor-signalling or cellular-response terms.
            gocam_associations:
              - model: gomodel:67e5e74400004286
                activity: gomodel:67e5e74400004286/67e5e74400004322
                title: "AVPR2 -mediated signaling G-alpha-s (\"stimulatory\", activating adenylate cyclase) following activation by vasopressin (AVP) (Human)."
                description: >-
                  The curated model types the Arg-vasopressin chain with hormone activity
                  (GO:0005179, the parent of the term used here) in the extracellular region,
                  directly positively regulating AVPR2 and part of renal water absorption; it
                  gives the hormone no signalling-pathway process.
    - order: 2
      role: receptor subtype branches and their G protein coupling
      node:
        id: vaso_receptor_branches
        label: Vasopressin receptor branches
        module_type: SIGNALING_PATHWAY
        description: >-
          The three vasopressin receptors split into a Gq/11-phospholipase C class (V1a, V1b)
          and a Gs-adenylyl cyclase class (V2). Both are real alternatives in the organism,
          expressed in different tissues, so they are modelled as a variant set on coupling
          class rather than as sequential parts.
        variant_sets:
          - id: vaso_receptor_coupling
            label: Vasopressin receptor coupling class
            axis: receptor subtype and G protein coupling class
            selection: ONE_OR_MORE
            notes: >-
              V1a (vascular smooth muscle, liver, platelets, brain) and V1b (anterior
              pituitary) signal through Gq/11 and phospholipase C; V2 (collecting-duct
              principal cells) signals through Gs, adenylyl cyclase and cAMP. A cell can
              express more than one, so one or more variants satisfy the set.
            variants:
              - id: v1_gq_branch
                label: V1a/V1b receptors -> Gq/11 -> phospholipase C
                module_type: SIGNALING_PATHWAY
                description: >-
                  AVP-occupied V1a or V1b receptors activate the Gq/11 alpha subunits, which
                  stimulate phospholipase C beta; the resulting IP3/calcium and DAG/PKC
                  signalling is the generic Gq cascade and is included by reference.
                concepts:
                  - preferred_term: phospholipase C-activating G protein-coupled receptor signaling pathway
                    term:
                      id: GO:0007200
                      label: phospholipase C-activating G protein-coupled receptor signaling pathway
                parts:
                  - order: 1
                    role: V1 receptor and Gq/11 activation
                    node:
                      id: v1_receptor_activation
                      label: V1a/V1b receptors activate G alpha q/11
                      module_type: REGULATORY_STEP
                      description: >-
                        Both V1-class receptors couple to phospholipase C through a
                        pertussis-toxin-insensitive (Gq/11) route. GNAQ and GNA11 are the
                        alpha subunits; no cached experiment pairs the human V1 receptors
                        with a named Gq paralog, so either satisfies the step.
                      annotons:
                        - id: gnaq_v1
                          label: GNAQ G protein activity
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: GNAQ (G alpha q)
                              term:
                                id: UniProtKB:P50148
                                label: Guanine nucleotide-binding protein G(q) subunit alpha
                          function:
                            preferred_term: G protein activity
                            term:
                              id: GO:0003925
                              label: G protein activity
                          processes:
                            - preferred_term: phospholipase C-activating G protein-coupled receptor signaling pathway
                              term:
                                id: GO:0007200
                                label: phospholipase C-activating G protein-coupled receptor signaling pathway
                          locations:
                            - preferred_term: cytoplasmic side of plasma membrane
                              term:
                                id: GO:0009898
                                label: cytoplasmic side of plasma membrane
                          role_description: >-
                            GTP-bound G alpha q transducer of the V1 receptors; its reviewed
                            core function is G protein activity (IDA).
                        - id: gna11_v1
                          label: GNA11 G protein activity
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: GNA11 (G alpha 11)
                              term:
                                id: UniProtKB:P29992
                                label: Guanine nucleotide-binding protein subunit alpha-11
                          function:
                            preferred_term: G protein activity
                            term:
                              id: GO:0003925
                              label: G protein activity
                          processes:
                            - preferred_term: phospholipase C-activating G protein-coupled receptor signaling pathway
                              term:
                                id: GO:0007200
                                label: phospholipase C-activating G protein-coupled receptor signaling pathway
                          locations:
                            - preferred_term: cytoplasmic side of plasma membrane
                              term:
                                id: GO:0009898
                                label: cytoplasmic side of plasma membrane
                          role_description: >-
                            The second Gq-class alpha subunit; redundant with GNAQ for this
                            step in the RGD diagram's Gq alpha node.
                      variant_sets:
                        - id: v1_receptor_members
                          label: V1-class vasopressin receptors
                          axis: receptor paralog
                          selection: ONE_OR_MORE
                          notes: >-
                            AVPR1A and AVPR1B are the two V1-class receptors. They share the
                            Gq/PLC coupling but occupy different tissues, so either (or both)
