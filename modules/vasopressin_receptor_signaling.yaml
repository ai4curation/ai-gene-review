id: MODULE:vasopressin_receptor_signaling
title: Vasopressin receptor signaling — V1a/V1b Gq/11-phospholipase C coupling and the renal V2 Gs/ADCY6/cAMP/AKAP-anchored PKA pathway driving aquaporin-2 exocytosis and water reabsorption
description: >-
  Arginine vasopressin (AVP), a neurohypophyseal nonapeptide hormone, acts through three
  G protein-coupled receptors that fall into two signalling classes. The V1a receptor
  (AVPR1A; vascular smooth muscle, liver, platelets, brain) and the V1b receptor (AVPR1B;
  anterior pituitary corticotrophs) couple to the Gq/11 alpha subunits GNAQ and GNA11,
  stimulating phospholipase C beta, inositol trisphosphate-driven calcium release and
  diacylglycerol/PKC signalling, which underlie vasoconstriction and pituitary ACTH release.
  The V2 receptor (AVPR2), on the basolateral membrane of renal collecting-duct principal
  cells, couples to the stimulatory G alpha subunit GNAS, which activates adenylyl cyclase
  type 6 (ADCY6), the dominant inner-medullary cyclase. cAMP activates protein kinase A,
  which is tethered to intracellular aquaporin-2 (AQP2)-bearing vesicles by the A-kinase
  anchoring protein AKAP18 (AKAP7) together with the cAMP phosphodiesterase PDE4D. PKA
  phosphorylates AQP2 at serine 256, which is required for the regulated exocytosis of AQP2
  vesicles. The vesicles move through a RAB11A-positive recycling compartment with the motor
  myosin Vb (MYO5B) and its Rab11 adaptor RAB11FIP2, the Rap1 GTPase-activating protein SPA-1
  (SIPA1) binds AQP2 and is required for its apical delivery, and the R-SNARE VAMP2 on the
  vesicle fuses with the apical Q-SNAREs SNAP23 and syntaxin-3 (or syntaxin-4). AQP2 water
  channels in the apical membrane then let water follow the osmotic gradient out of the
  tubular lumen, concentrating the urine. PKA also phosphorylates and activates PDE4D on the
  same vesicles, providing local negative feedback, and PKA-phosphorylated CREB drives AQP2
  transcription. Loss-of-function mutations in AVPR2 or AQP2 cause nephrogenic diabetes
  insipidus.
status: DRAFT
scope: CONCRETE
