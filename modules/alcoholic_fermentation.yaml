  notes: >-
    Boundary. The module starts at pyruvate and ends at ethanol (plus the
    optional acetoin/butanediol branch). Glycolysis (modules/emp_glycolysis.yaml)
    supplies the pyruvate and NADH. The YeastPathways superpathway
    GLUCFERMEN-PWY is that module plus this one. Acetaldehyde oxidation to
    acetate and acetyl-CoA synthesis are the opposite, oxidative fate of the same
    acetaldehyde and are in modules/pdh_bypass_acetyl_coa_synthesis.yaml.
    Glycerol formation (the other cytosolic NADH sink) and the Ehrlich pathway
    (fusel alcohols via the same PDC/ADH enzymes acting on other 2-oxo acids)
    are separate modules.

    YeastCyc corrections. In GLUCFERMEN-PWY the alcohol dehydrogenase reaction
    lists ADH1-ADH5. Only ADH1 is the fermentative enzyme. ADH2 is the
    glucose-repressed ethanol-oxidising isozyme, ADH3 a mitochondrial-matrix
    redox-shuttle enzyme, and ADH4 (iron family, mitochondrial) and ADH5 are
    minor, so they are not members of the core annoton. ADH4 is kept as an
    orienting member of the iron-ADH variant. PDC6 is an active
    decarboxylase but is a sulfur-limitation and ethanol-phase isozyme that
    cannot support fermentation on its own. ARO10 and THI3 are not
    pyruvate decarboxylases. For the acetolactate-derived acetoin in PWY3O-335,
    the ILV2/ILV6 acetohydroxyacid synthase is the mitochondrial
    branched-chain amino acid enzyme (see
    modules/branched_chain_amino_acid_biosynthesis.yaml). Diacetyl arises from
    non-enzymatic oxidative decarboxylation of leaked acetolactate. That route is
    therefore not a yeast fermentation member, and only the dedicated bacterial
    acetolactate route is modelled.

    GO-CAM disagreements. (1) Every activity in YeastPathways_GLUCFERMEN-PWY is
    part_of GO:0019658, whose current label is "bifid shunt". That is wrong for
    yeast glucose fermentation; the appropriate process is GO:0019655 pyruvate
    fermentation to ethanol (plus glycolysis). (2) The same model places
    the mitochondrial ALD4 and ALD5 in the cytosol and includes FBP1. (3)
    YeastPathways_PWY3O-335 places the ILV2/ILV6 complex (CPX-3034) in the
    cytosol, but the enzyme is mitochondrial. (4) PWY3O-981 uses the broad
    GO:1902652 secondary alcohol metabolic process, and it types BDH1's diacetyl
    reduction (ACETOINDEHYDROG-RXN) as GO:0019152 acetoin dehydrogenase (NAD+)
    activity, a reaction written in the oxidative direction. (5) The PomBase
    fermentation model 678073a900000393 contains the four pdc genes, adh1, and
    out-of-boundary activities: atd1 (acetaldehyde dehydrogenase, used here in
    the PDH-bypass module), pyk1 (glycolysis), tnr3 (thiamine diphosphokinase,
    cofactor supply) and the Phx1 transcription factor. It does not include
    adh4.
