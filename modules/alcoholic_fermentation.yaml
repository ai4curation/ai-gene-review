                title: "fermentation (GO:0006113) (S. pombe pdc101)"
              - model: gomodel:678073a900000393
                activity: gomodel:678073a900000393/678073a900000423
                title: "fermentation (GO:0006113) (S. pombe pdc102)"
              - model: gomodel:678073a900000393
                activity: gomodel:678073a900000393/678073a900000400
                title: "fermentation (GO:0006113) (S. pombe pdc201)"
              - model: gomodel:678073a900000393
                activity: gomodel:678073a900000393/678073a900000408
                title: "fermentation (GO:0006113) (S. pombe pdc202)"
