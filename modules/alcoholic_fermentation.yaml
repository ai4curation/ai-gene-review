      term:
        id: GO:0019655
        label: pyruvate fermentation to ethanol
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: Pyruvate decarboxylase and the fermentative ADHs are cytosolic in yeasts and plants.
  gocam_associations:
