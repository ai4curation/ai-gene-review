                  - id: PANTHER:PTHR43452:SF20
                    label: PYRUVATE DECARBOXYLASE 2
                  - id: PANTHER:PTHR43452:SF39
                    label: PYRUVATE DECARBOXYLASE 2
                  - id: PANTHER:PTHR43452:SF5
                    label: PYRUVATE DECARBOXYLASE 3
                  - id: PANTHER:PTHR43452:SF38
                    label: PYRUVATE DECARBOXYLASE 3-RELATED
                representative_members:
