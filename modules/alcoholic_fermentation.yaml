id: MODULE:alcoholic_fermentation
title: Alcoholic fermentation of pyruvate to ethanol
description: >-
  Alcoholic fermentation is the two-step, NAD+-regenerating branch that follows
  glycolysis in yeasts and other fungi, in plants under hypoxia, and in a few
  bacteria such as Zymomonas mobilis. A thiamine-diphosphate-dependent pyruvate
  decarboxylase removes CO2 from pyruvate to give acetaldehyde. An NADH-dependent
  alcohol dehydrogenase then reduces acetaldehyde to ethanol. That second step
  reoxidises the NADH formed at the glyceraldehyde-3-phosphate dehydrogenase step
  of glycolysis, so glycolysis can continue without respiration and the overall
  yield is two ATP per hexose. Two unrelated alcohol dehydrogenase families can
  carry out the reduction: zinc-dependent medium-chain dehydrogenases (fungal and
  plant ADH1) and the group III ("iron-containing") dehydrogenase family
  (Zymomonas ADH II and fungal ADH4-type enzymes), whose members differ in
  metal activation. Pyruvate decarboxylase also has a minor
  carboligase activity that joins acetaldehyde to a second acetaldehyde or to
  pyruvate, making acetoin. Acetoin can then be reduced to 2,3-butanediol. That
  side branch is modelled here as optional, together with the bacterial
  acetolactate route to the same product.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0019655
    title: pyruvate fermentation to ethanol
    statement: >-
      Module-level process. Its definition, the anaerobic breakdown of pyruvate
      into ethanol and CO2, matches the module boundary exactly.
  - source_id: GO:0034079
    title: butanediol biosynthetic process
    statement: >-
      Concept for the optional side branch. GO places it under pyruvate
      fermentation and lists acetolactate synthase, acetolactate decarboxylase
      and diacetyl reductase as parts, which is the bacterial route modelled
      here as a variant.
  - source_id: YeastPathways:GLUCFERMEN-PWY
    title: superpathway of glucose fermentation
    statement: >-
      Superpathway = EMP glycolysis (modules/emp_glycolysis.yaml) + this
      module + the PDH-bypass aldehyde dehydrogenases
      (modules/pdh_bypass_acetyl_coa_synthesis.yaml). From its catalyst
      lists, PDC1/PDC5/PDC6 (RXN-6161) and ADH1 (ALCOHOL-DEHYDROG-RXN) are kept
      here. ADH2-ADH5 are listed for the ADH reaction, but ADH2 is the
      glucose-repressed ethanol-oxidising isozyme (PDH bypass / ethanol
      utilisation), ADH3 is a mitochondrial redox-shuttle enzyme, and ADH4
      and ADH5 are minor. FBP1 and the ALD reactions in the frame are not
      fermentation steps.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLUCFERMEN-PWY
  - source_id: YeastPathways:PWY3O-440
    title: pyruvate fermentation to acetoin III
    statement: >-
      Source for the pyruvate-decarboxylase carboligation side reactions
      (2 acetaldehyde to acetoin, RXN3O-470; pyruvate + acetaldehyde to acetoin,
      RXN0-2022), both assigned to PDC1/PDC5/PDC6.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-440
  - source_id: YeastPathways:PWY3O-335
    title: acetoin biosynthesis
    statement: >-
      Acetolactate-derived acetoin: ILV2/ILV6 acetohydroxyacid synthase makes
      (S)-2-acetolactate, which decomposes non-enzymatically by oxidative
      decarboxylation to diacetyl, and BDH1 reduces diacetyl to acetoin. In
      yeast the acetolactate synthase is the mitochondrial branched-chain
      amino acid enzyme and diacetyl formation is a spill-over. It is therefore
      recorded in notes and not counted as a member. The bacterial catabolic
      acetolactate route (with an acetolactate decarboxylase) is modelled as a
      variant instead.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-335
  - source_id: YeastPathways:PWY3O-981
    title: superpathway of acetoin and butanediol biosynthesis
    statement: Union of PWY3O-440, PWY3O-335 and the BDH1 acetoin reduction.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-981
  - source_id: YeastPathways:PWY3O-661
    title: butanediol biosynthesis
    statement: Single-reaction frame for BDH1 (R)-acetoin reduction to (R,R)-2,3-butanediol; folded into the side branch.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-661
  - source_id: YeastPathways:PWY3O-246
    title: (R,R)-butanediol degradation
    statement: >-
      The same BDH1 reaction in the oxidative direction (growth on butanediol).
      This catabolic use is outside the fermentation boundary and is recorded
      only as the reverse of the side-branch step.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-246
  - source_id: PMID:8904337
    title: "Pyruvate decarboxylase: an indispensable enzyme for growth of Saccharomyces cerevisiae on glucose."
    statement: PDC1, PDC5 and PDC6 each encode an active pyruvate decarboxylase.
    supporting_text: >-
      In Saccharomyces cerevisiae, the structural genes PDC1, PDC5 and PDC6 each
      encode an active pyruvate decarboxylase.
  - source_id: PMID:2404950
    title: "pdc1(0) mutants of Saccharomyces cerevisiae give evidence for an additional structural PDC gene: cloning of PDC5, a gene homologous to PDC1."
    statement: PDC5 supplies the remaining activity when PDC1 is deleted, with PDC1 subject to autoregulation.
    supporting_text: >-
      The resulting pdc1(0) mutants were able to grow on glucose and still
      contained 60 to 70% of the wild-type PDC activity.
  - source_id: PMID:15864308
    title: Resurrecting ancestral alcohol dehydrogenases from yeast.
    statement: >-
      Adh1 reduces acetaldehyde to ethanol during fermentation; its paralog Adh2
      oxidises the accumulated ethanol later.
    supporting_text: >-
      Pyruvate loses carbon dioxide to produce acetaldehyde, which is reduced by
      alcohol dehydrogenase 1 (Adh1) to ethanol, which accumulates.
  - source_id: PMID:11152939
    title: Stoichiometry and compartmentation of NADH metabolism in Saccharomyces cerevisiae.
    statement: Alcoholic fermentation is the first of the NADH-reoxidation routes of yeast.
    supporting_text: At least five mechanisms of NADH reoxidation exist in S. cerevisiae.
  - source_id: PMID:6383467
    title: "Brewers' yeast pyruvate decarboxylase produces acetoin from acetaldehyde: a novel tool to study the mechanism of steps subsequent to carbon dioxide loss."
    statement: Pyruvate decarboxylase forms acetoin as a 3-4% side product and condenses acetaldehyde to acetoin.
    supporting_text: >-
      Employing this method enabled the demonstration of the catalysis of
      acetaldehyde condensation to acetoin by the enzyme.
  - source_id: PMID:10938079
    title: Characterization of a (2R,3R)-2,3-butanediol dehydrogenase as the Saccharomyces cerevisiae YAL060W gene product. Disruption and induction of the gene.
    statement: BDH1 (YAL060W) is an NAD-dependent (2R,3R)-2,3-butanediol dehydrogenase that reduces acetoin.
    supporting_text: >-
      In the presence of NADH, it could catalyze the stereospecific reduction of
      racemic acetoin
  - source_id: PMID:11306064
    title: Characterization and functional role of Saccharomyces cerevisiae 2,3-butanediol dehydrogenase.
    statement: Other enzymes besides BDH1 can metabolise 2,3-butanediol in yeast.
    supporting_text: >-
      This suggests that other enzymes, in addition to BDH, can also metabolize
      2,3-butanediol in yeast.
  - source_id: PMID:25102102
    title: A metabolic strategy to enhance long-term survival by Phx1 through stationary phase-specific pyruvate decarboxylases in fission yeast.
    statement: >-
      Fission yeast has four predicted pyruvate decarboxylases; pdc201 and
      pdc202 are induced by Phx1 in stationary phase.
    supporting_text: >-
      Among the four predicted genes for pyruvate decarboxylase, only the
      Phx1-dependent genes (pdc201+ and pdc202+) contributed to long-term survival
  - source_id: PMID:15040954
    title: A distinct type of alcohol dehydrogenase, adh4+, complements ethanol fermentation in an adh1-deficient strain of Schizosaccharomyces pombe.
    statement: >-
      Fission-yeast adh1 is the main fermentative ADH, and the ADH4-like adh4 can
      replace it. Ethanol fermentation therefore runs through either ADH family.
    supporting_text: >-
      Since the strain lacking both adh1 and adh4 genes (delta adh1 delta adh4)
      showed non-fermentative retarded growth, only these two ADHs produce
      ethanol for fermentative growth.
