                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The committed, irreversible step that diverts pyruvate away from the
              pyruvate dehydrogenase complex. In yeasts the same acetaldehyde also
              feeds the PDH bypass (modules/pdh_bypass_acetyl_coa_synthesis.yaml).
              That is why pdc1 pdc5 pdc6 null mutants cannot grow on glucose
              without added C2 compounds (PMID:8904337). The yeast isozymes also
              decarboxylate branched-chain 2-oxo acids (Ehrlich pathway), which is
              outside this module. ARO10 and the TPP-sensing regulator THI3 are
              PDC-family members that do not decarboxylate pyruvate and are not
              members here.
