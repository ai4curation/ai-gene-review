      title: "acetoin biosynthesis - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:YeastPathways_PWY3O-981
      title: "superpathway of acetoin and butanediol biosynthesis - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:678073a900000393
      title: "fermentation (GO:0006113) (S. pombe)"
  parts:
    - order: 1
      role: non-oxidative decarboxylation of pyruvate
      node:
        id: pdc_step
        label: Pyruvate to acetaldehyde + CO2
        module_type: REACTION
        annotons:
          - id: pdc_activity
            label: Pyruvate decarboxylase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: pyruvate decarboxylase activity
                term:
                  id: GO:0004737
                  label: pyruvate decarboxylase activity
              family:
