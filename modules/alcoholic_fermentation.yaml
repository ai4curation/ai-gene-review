                statement: Direct bacterial pyruvate decarboxylase purification and activity.
              - source_id: PMID:8904337
                statement: Primary yeast gene/enzyme evidence for the same reaction.
            role_description: The irreversible decarboxylation step that diverts pyruvate away from the
              pyruvate dehydrogenase complex. In yeasts the same acetaldehyde also feeds the PDH bypass
              (modules/pdh_bypass_acetyl_coa_synthesis.yaml). PDC-null mutants fail to grow in defined
              medium with glucose as sole carbon source, while complex glucose medium permits slower growth
              (PMID:8904337); the acetyl-CoA supply role must be distinguished from fermentative NADH
              recycling. The yeast isozymes also decarboxylate branched-chain 2-oxo acids (Ehrlich pathway),
              which is outside this module. ARO10 and the TPP-sensing regulator THI3 are PDC-family members
              that do not decarboxylate pyruvate and are not members here. Localization is supported for
              fungal and plant exemplars, but no direct native ZM4 localization assay is asserted. Fission-yeast
              isozyme genetics and total PDC activity do not constitute purified kinetic characterization
              of each paralog.
