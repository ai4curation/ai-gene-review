  label: Alcoholic fermentation (pyruvate to ethanol)
  module_type: METABOLIC_PATHWAY
  description: pyruvate -> acetaldehyde + CO2 -> ethanol (NADH -> NAD+); optional side branch acetaldehyde/pyruvate
    -> acetoin -> (R,R)-2,3-butanediol.
