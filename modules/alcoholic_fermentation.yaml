  notes: 'Boundary: direct pyruvate decarboxylation followed by acetaldehyde reduction, plus the existing
    optional acetoin/R,R-butanediol branch. Upstream glycolysis, cofactor synthesis, pyruvate-formate
    lyase/AdhE routes, PDH bypass, glycerol formation and Ehrlich chemistry remain separate. The terminal
    ethanol branch produces no ATP; EMP-fed yeast and ED-fed Zymomonas have different upstream yields.
    Taxa are an evidence envelope, not a distribution or universal ancestral-presence claim.


    Representative physiology is conditional. PDC6 can support partial glucose fermentation after promoter
    activation. Group III ADH does not imply iron activation in every member. Carassius subunit-level
    decarboxylase assignment is inferred and its beta2 accession is an incomplete submitted sequence,
    not evidence of native truncation. Plant ADH1 does not explain all ethanol production in mutants.


    The optional branch models a defined R,R endpoint, not all stereoisomer outputs in Klebsiella, Serratia
    or Bacillus. In yeast, leaked biosynthetic acetolactate can form diacetyl nonenzymatically and Bdh1
    can reduce it; the mitochondrial ILV2/ILV6 precursor pathway is not a native catabolic AlsS substitute.
    The current leaf carboligation activity lacks a specific GO term and is kept as explicit chemistry.


    Production GO-CAM associations are organism-specific. PomBase model 678073a900000393 supplies the
    four PDC activities and adh1; its regulator, cofactor-supply, glycolytic and acetate-producing nodes
    lie outside this module. Broad secondary-alcohol process annotations and GO:0019152 for Bdh1 diacetyl
    reduction are not intrinsically incorrect merely because a reaction can be written in the opposite
    direction. Additional imported-model discrepancies are documented in audit notes after source verification.'
references:
- id: PMID:18479436
  title: 'The alcohol dehydrogenases of Saccharomyces cerevisiae: a comprehensive review.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract provides comparative isoenzyme framing; specific isozyme assignments
      require primary studies.
  findings:
  - statement: Yeast ADH isoenzymes differ in physiological direction, regulation and compartment; alcohol-dehydrogenase
      family membership alone does not identify the dominant fermentative enzyme.
  full_text_unavailable: true
- id: PMID:27629544
  title: Zymomonas mobilis as a model system for production of biofuels and biochemicals.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached review inspected for metabolic-route context; avoid interpreting facultative
      anaerobiosis as exclusive anaerobic expression.
  findings:
  - statement: Zymomonas feeds its ethanol pathway through Entner-Doudoroff glycolysis, which conserves
      less ATP than yeast EMP glycolysis. The terminal PDC/ADH branch itself does not synthesize ATP.
    supporting_text: 50% less ATP produced relative to the EMP pathway
- id: PMID:22404754
  title: 'Energy coupling in Saccharomyces cerevisiae: selected opportunities for metabolic engineering.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract and publisher full-text passage inspected; precise ATP comparison is
      from the publisher text, not falsely quoted from the cache.
  findings:
  - statement: Energy coupling distinguishes the two-ATP EMP-fed yeast route from the one-ATP ED-fed Zymomonas
      route; a universal two-ATP statement is inappropriate for this cross-species module.
  full_text_unavailable: true
- id: PMID:35050092
  title: 'Try or Die: Dynamics of Plant Respiration and How to Survive Low Oxygen Conditions.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached review inspected; its general plant pathway model must be qualified by primary
      evidence for alternative ethanol production in ADH1-deficient plants.
  findings:
  - statement: Plant PDC forms acetaldehyde, which ADH reduces to ethanol during hypoxic metabolism; this
      regenerates NAD+ for upstream glycolysis.
    supporting_text: PDC catalyzes the decarboxylation of pyruvate, thereby generating acetaldehyde that
      is finally reduced to ethanol by ADH
- id: PMID:30861072
  title: Conservation of ethanol fermentation and its regulation in land plants.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary comparative study, not a review. No uncharacterized alternative enzyme is assigned
      from the phenotype.
  findings:
  - statement: Ethanol production is conserved across sampled land plants, but regulatory and enzymatic
      implementations differ; Arabidopsis lacking ADH1 retains substantial hypoxic ethanol production.
    supporting_text: Arabidopsis mutants devoid of ADH expression exhibited enhanced PDC activity and
      retained substantial ethanol production under hypoxic conditions.
- id: PMID:28801642
  title: Extreme anoxia tolerance in crucian carp and goldfish through neofunctionalization of duplicated
    genes creating a new ethanol-producing pyruvate decarboxylase pathway.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text inspected. The authors infer the paralog-specific complex from convergent
      evidence; this is not a purified alpha3/beta2 reconstitution or a direct ADH8a3 kinetic assay.
  findings:
  - statement: Carassius muscle ethanol production is associated with E1alpha3/E1beta2 and ADH8a3; sequence,
      expression, localization and modeling support an E1-derived mitochondrial decarboxylase implementation
      distinct from canonical PDC.
    supporting_text: the protein products of the E1α3 and E1β2 paralogs combine to produce a specific
      E1 enzyme
- id: PMID:8904337
  title: 'Pyruvate decarboxylase: an indispensable enzyme for growth of Saccharomyces cerevisiae on glucose.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary source used with the stated organism and assay limits; metadata and quotations
      checked against the cached publication.
  findings:
  - statement: PDC1, PDC5 and PDC6 each encode an active pyruvate decarboxylase.
    supporting_text: In Saccharomyces cerevisiae, the structural genes PDC1, PDC5 and PDC6 each encode
