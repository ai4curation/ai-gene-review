        id: NCBITaxon:2
        label: Bacteria
      description: Selected native bacterial implementations; this is not a universal bacterial pathway.
    - preferred_term: Eukaryota
      term:
        id: NCBITaxon:2759
        label: Eukaryota
      description: Evidence spans ascomycete yeasts, land plants and the separately evolved Carassius
        pathway; occurrence and enzyme use are lineage-specific.
    notes: The root is an evidence envelope, not a claim of ancestral presence in every descendant. Each
      variant constrains its physiological and taxonomic use. No universal compartment is asserted.
