                - preferred_term: ammonium
                - preferred_term: NADH
              evidence:
                - source_id: EC:1.4.1.2
                  statement: glutamate dehydrogenase (NAD+)
                  notes: MetaCyc:GLUTAMATE-DEHYDROGENASE-RXN
            role_description: >-
              Main route releasing ammonium from glutamate; needed to supply
              ammonium for glutamine synthesis when glutamate is the nitrogen
              source. Under nitrogen catabolite repression and carbon-source
              control (PMID:1652057). S. cerevisiae Gdh2 is cytosolic; no
              location is asserted on the family role because the PomBase
              model places S. pombe gdh2 in mitochondria (see knowledge gap).
            gocam_associations:
              - model: gomodel:67c10cc400000148
                activity: gomodel:67c10cc400000148/67e5e74400003858
                title: L-glutamate biosynthetic process (GO:0097054) (S. pombe)
                description: >-
                  S. pombe gdh2 enables GO:0004352 in the mitochondrial matrix,
                  part_of GO:0006538.
  connections:
    - source: glutamine_synthetase_step
      target: gs_gogat_route
      connection_type: PRECEDES
      description: L-glutamine made by glutamine synthetase is the amide donor for glutamate synthase.
    - source: glutamate_formation
      target: glutamine_synthetase_step
      connection_type: PRECEDES
      description: L-glutamate made by either route is the substrate of glutamine synthetase.
    - source: glutamate_deamination_step
      target: glutamine_synthetase_step
      connection_type: PRECEDES
      description: >-
        On glutamate as nitrogen source, ammonium released by NAD-dependent
        glutamate dehydrogenase is fixed by glutamine synthetase.
  knowledge_gaps:
    - gap_statement: >-
        The compartment in which fungal NADH-glutamate synthase acts is
        unresolved. S. cerevisiae Glt1 is found in mitochondrial proteomes and
        in cytoplasmic filaments, and the PomBase S. pombe model places glt1
        (and gdh2) in the mitochondrial matrix, whereas UniProt records S.
        pombe glt1 and gdh2 as cytoplasmic. S. cerevisiae Gdh2 is cytosolic by
        direct assay, so the S. pombe gdh2 placement is also in question.
      boundary: >-
        No location is asserted on either annoton. Whether glutamine-dependent
        glutamate synthesis occurs in mitochondria (requiring glutamine import
        and glutamate export) or in the cytosol changes how the GS-GOGAT cycle
        is coupled to 2-oxoglutarate supply; it needs targeted localisation of
        tagged enzymes at native expression and compartment-specific
        complementation.
      gap_kind:
        - BIOLOGY
      status: OPEN
  notes: >-
    Boundary: ammonium to L-glutamate and L-glutamine, plus the NAD-GDH
    catabolic reaction that returns glutamate nitrogen to ammonium.
    2-Oxoglutarate supply by isocitrate dehydrogenases is upstream central
    carbon metabolism and belongs to tca_cycle. YeastCyc lists only the NADP
    isozymes (ISOCITDEH-RXN: IDP1, IDP2, IDP3) and omits the mitochondrial
    NAD-dependent IDH1/IDH2, which carries the main flux and supplies most of
    the 2-oxoglutarate pool on glucose, while cytosolic IDP2 dominates on
    non-fermentable carbon (PMID:15574419). Any one isozyme suffices for
    glutamate-independent growth (PMID:8672488). IDP3 is peroxisomal and
    supplies NADPH for beta-oxidation of unsaturated fatty acids, not
    2-oxoglutarate for glutamate synthesis. Glutamine-amide transfer to other acceptors,
    nitrogen-source catabolism and nitrogen catabolite repression (Gln3, Gat1,
    Ure2, Gcn4) are outside the module. Generalisation: the module is
    fungal-scope. bacterial_ammonia_assimilation models the bacterial GS-GOGAT
    cycle, which uses GSI-type GlnA and a two-subunit NADPH-dependent GltB/GltD
    glutamate synthase (GO:0004355) rather than the GSII-type glutamine
    synthetase and single-chain NADH-dependent GLT1 of fungi; the chemistry of
    the cycle conforms. glutamate_glutamine_ammonia_hub is the animal
    arrangement, which has no glutamate synthase, a dual-cofactor mitochondrial
    GDH (GO:0004353) and glutaminases; animal GS (GLUL) belongs to the same
    PANTHER family as fungal GLN1. YeastCyc assessment: gene assignments for
    GDH1, GDH3, GLN1, GLT1 and GDH2 are correct and no S. cerevisiae enzyme
    is missing. GO-CAM disagreements: (a) YeastPathways_PWY3O-13 asserts
    IDP1 (mitochondrial) and IDP3 (peroxisomal) in the cytosol and puts all
    three isocitrate dehydrogenases part_of GO:0097054; (b) GDH2 has no
    YeastPathways GO-CAM, because PWY-3322 was not converted; (c) PomBase model
    67c10cc400000148 omits gdh1, the NADP-GDH that with GOGAT is required for
    growth on ammonium (PMID:7773104), and places glt1 and gdh2 in the
    mitochondrial matrix (see knowledge gap); (d) neither model has causal
    edges between glutamine synthetase and glutamate synthase. The PomBase
    model also contains alanine transaminase (alt1), which is modelled in
    aspartate_asparagine_metabolism, and arginine/lysine entry steps and tRNA
    ligases, which are outside both modules.
