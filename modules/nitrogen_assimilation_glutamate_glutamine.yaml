                annotons:
                  - id: nadp_glutamate_dehydrogenase_activity
                    label: NADP-dependent glutamate dehydrogenase
                    participant:
                      selector_type: FAMILY
                      gene:
                        preferred_term: GDH1 / GDH3 / gdh1 (NADP-GDH)
                      family:
                        preferred_term: hexameric NADP-specific glutamate dehydrogenases
                        family_terms:
                          - id: PANTHER:PTHR43571:SF1
                            label: NADP-SPECIFIC GLUTAMATE DEHYDROGENASE 1-RELATED
                        representative_members:
                          - preferred_term: GDH1 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P07262
                              label: NADP-specific glutamate dehydrogenase 1
                            description: >-
                              S. cerevisiae GDH1/YOR375C, the main isozyme on
                              glucose (PMID:11562373).
                          - preferred_term: GDH3 (Saccharomyces cerevisiae)
