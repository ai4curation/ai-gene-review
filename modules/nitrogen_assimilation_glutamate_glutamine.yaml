                              id: UniProtKB:P39708
                              label: NADP-specific glutamate dehydrogenase 2
                            description: >-
                              S. cerevisiae GDH3/YAL062W, glucose-repressed
                              isozyme with lower 2-oxoglutarate use
                              (PMID:9287019, PMID:11562373).
                          - preferred_term: gdh1 (Schizosaccharomyces pombe)
                            term:
                              id: UniProtKB:P78804
                              label: NADP-specific glutamate dehydrogenase
