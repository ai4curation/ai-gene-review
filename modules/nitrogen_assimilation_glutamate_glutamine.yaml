                      term:
                        id: GO:0004354
                        label: L-glutamate dehydrogenase (NADP+) activity
                      substrates:
                        - preferred_term: 2-oxoglutarate
                        - preferred_term: ammonium
                        - preferred_term: NADPH
                      products:
                        - preferred_term: L-glutamate
                        - preferred_term: NADP+
