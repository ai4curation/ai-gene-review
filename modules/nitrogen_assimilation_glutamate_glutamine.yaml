id: MODULE:nitrogen_assimilation_glutamate_glutamine
title: Fungal ammonium assimilation into glutamate and glutamine, and glutamate deamination
description: >-
  Assimilation of ammonium into the amino group of L-glutamate and the amide
  group of L-glutamine, and the reverse release of ammonium from glutamate, as
  organised in fungi and other eukaryotic microbes. Glutamate and glutamine are
  the nitrogen donors for nearly all other nitrogenous compounds, so these
  reactions sit between nitrogen-source catabolism and biosynthesis. Glutamine
  synthetase ligates ammonium to L-glutamate with ATP to give L-glutamine; it
  is the only route to glutamine and is required in every growth condition.
  Ammonium reaches glutamate by two alternative routes. In the first,
  NADP-dependent glutamate dehydrogenase reductively aminates 2-oxoglutarate
  with NADPH; in budding yeast this is the main route when glucose is
  plentiful and is carried by two isozymes, one constitutive and one induced
  on non-fermentable carbon sources. In the second, the glutamine
  synthetase-glutamate synthase (GS-GOGAT) cycle, an NADH-dependent glutamate
  synthase transfers the glutamine amide nitrogen to 2-oxoglutarate, giving two
  molecules of L-glutamate, one of which replaces the glutamate consumed by
  glutamine synthetase. Fungal glutamate synthase is a single large
  polypeptide that combines the domains carried by the separate large and small
  subunits of bacterial NADPH-dependent glutamate synthase. The GS-GOGAT cycle
  has higher affinity for 2-oxoglutarate and uses NADH rather than NADPH, and
  it becomes required for glutamate synthesis when the NADP-dependent
  dehydrogenases are absent or when glutamine is the nitrogen source. Loss of
  both routes causes glutamate auxotrophy. An NAD-dependent glutamate
  dehydrogenase runs the reaction in the catabolic direction, oxidatively
  deaminating L-glutamate to 2-oxoglutarate and ammonium; it supplies the
  ammonium for glutamine synthesis when glutamate is the nitrogen source.
  2-Oxoglutarate itself comes from isocitrate dehydrogenases of central carbon
  metabolism.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY3O-13
    title: superpathway of glutamate biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Source superpathway: GLUTDEHYD-RXN (GDH1, GDH3), GLUTAMINESYN-RXN (GLN1),
      GLUTAMATE-SYNTHASE-NADH-RXN (GLT1) and ISOCITDEH-RXN (IDP1, IDP2, IDP3).
      The glutamate and glutamine reactions are modelled; the isocitrate
      dehydrogenase reaction is 2-oxoglutarate supply and is kept outside the
      module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-13
  - source_id: YeastPathways:GLUNH3-PWY
    title: glutamate biosynthesis from ammonia (S. cerevisiae, SGD YeastPathways)
    statement: >-
      NADP-dependent glutamate dehydrogenase reaction (GDH1, GDH3); both
      assignments retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLUNH3-PWY
  - source_id: YeastPathways:GLNSYN-PWY
    title: L-glutamine biosynthesis I (S. cerevisiae, SGD YeastPathways)
    statement: Glutamine synthetase reaction (GLN1); assignment retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLNSYN-PWY
  - source_id: YeastPathways:GLUGLNSYN-PWY
    title: L-glutamate biosynthesis IV (S. cerevisiae, SGD YeastPathways)
    statement: NADH-dependent glutamate synthase reaction (GLT1); assignment retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLUGLNSYN-PWY
  - source_id: YeastPathways:PWY-3322
    title: glutamate degradation IX (S. cerevisiae, SGD YeastPathways)
    statement: >-
      NAD-dependent glutamate dehydrogenase reaction (GDH2) in the catabolic
      direction; assignment retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-3322
  - source_id: GO:0097054
    title: L-glutamate biosynthetic process
    statement: Module-level biological process.
  - source_id: GO:1901704
    title: L-glutamine biosynthetic process
    statement: Module-level biological process (glutamine synthetase step).
  - source_id: GO:0019676
    title: ammonia assimilation cycle
    statement: Biological process of the GS-GOGAT route.
  - source_id: GO:0006538
    title: L-glutamate catabolic process
    statement: Biological process of the NAD-dependent glutamate deamination part.
  - source_id: PMID:14555464
    title: Ammonia assimilation by Saccharomyces cerevisiae.
    statement: >-
      Review of the two assimilation routes in yeast: NADPH-dependent glutamate
      dehydrogenase sets the growth rate on glucose plus ammonia, whereas the
      NADH-dependent GS-GOGAT route is favoured when 2-oxoglutarate is low.
    supporting_text: >-
      the rate of growth is determined by the ability of the cell to use
      glutamate dehydrogenase to assimilate ammonia and is not affected by
      mutations resulting in the loss of glutamate synthase
  - source_id: PMID:22419079
    title: Regulation of amino acid, nucleotide, and phosphate metabolism in Saccharomyces cerevisiae.
    statement: >-
      Review: GDH1 and GLN1 assimilate ammonium on glucose, GDH3 contributes
      on ethanol, GLT1 is required when glutamine is the sole nitrogen source,
      and GDH2 releases ammonium from glutamate. Cited by YeastPathways for
      PWY3O-13.
  - source_id: PMID:11562373
    title: NADP-glutamate dehydrogenase isoenzymes of Saccharomyces cerevisiae. Purification, kinetic properties, and physiological roles.
    statement: >-
      Purified Gdh1 and Gdh3 are both biosynthetic NADP-dependent glutamate
      dehydrogenases with different allosteric properties and differential
      carbon-source regulation; Gdh2 is the catabolic NAD-dependent enzyme.
    supporting_text: >-
      two NADP(+)-dependent glutamate dehydrogenases (NADP-GDHs) encoded by
      GDH1 and GDH3 catalyze the synthesis of glutamate from ammonium and
      alpha-ketoglutarate
  - source_id: PMID:9287019
    title: GDH3 encodes a glutamate dehydrogenase isozyme, a previously unrecognized route for glutamate biosynthesis in Saccharomyces cerevisiae.
    statement: >-
      gdh1 glt1 double mutants still grow on ammonium because of GDH3; the
      gdh1 glt1 gdh3 triple mutant is a glutamate auxotroph, showing that the
      NADP-GDH and GOGAT routes are the only routes of glutamate synthesis.
    supporting_text: >-
      Triple mutants impaired in GDH1, GLT1, and GDH3 were obtained. These were
      strict glutamate auxotrophs.
  - source_id: PMID:2570348
    title: Three regulatory systems control expression of glutamine synthetase in Saccharomyces cerevisiae at the level of transcription.
    statement: GLN1 is the S. cerevisiae glutamine synthetase structural gene.
    supporting_text: >-
      The GLN1 gene of Saccharomyces cerevisiae was cloned by complementation
      of a gln1 auxotroph.
  - source_id: PMID:8923741
    title: Sequence of the GLT1 gene from Saccharomyces cerevisiae reveals the domain structure of yeast glutamate synthase.
    statement: >-
      Yeast glutamate synthase is a homotrimer of a 199 kDa GLT1 polypeptide
      carrying glutamine-, FMN-, NADH- and iron-sulfur-binding regions
      homologous to the bacterial and plant enzymes.
    supporting_text: >-
      this enzyme is a homotrimeric protein with a monomeric size of 199 kDa
  - source_id: PMID:9657994
    title: Regulation of expression of GLT1, the gene encoding glutamate synthase in Saccharomyces cerevisiae.
    statement: >-
      GLT1 is repressed by glutamate and activated by Gln3 and Gcn4; on
      ammonium GOGAT is an ancillary route of glutamate synthesis.
    supporting_text: >-
      Our results suggest that in a wild-type strain grown on ammonium, GOGAT
      constitutes an ancillary pathway for glutamate biosynthesis.
  - source_id: PMID:1975578
    title: Role of NAD-linked glutamate dehydrogenase in nitrogen metabolism in Saccharomyces cerevisiae.
    statement: >-
      GDH2 encodes the NAD-linked glutamate dehydrogenase, the main route that
      releases ammonia from glutamate; it is not normally used for glutamate
      synthesis.
    supporting_text: >-
      Our results indicate that the NAD-linked glutamate dehydrogenase
      catalyzes the major, but not sole, pathway for generation of ammonia from
      glutamate.
  - source_id: PMID:1652057
    title: Physiological and genetic analysis of the carbon regulation of the NAD-dependent glutamate dehydrogenase of Saccharomyces cerevisiae.
    statement: >-
      GDH2 expression is regulated by the carbon source as well as by
      nitrogen; cited by YeastPathways for PWY-3322.
  - source_id: PMID:7773104
    title: Glutamine synthetase/glutamate synthase ammonium-assimilating pathway in Schizosaccharomyces pombe.
    statement: >-
      S. pombe has the same two assimilation routes: gln1 mutants lacking
      glutamine synthetase are glutamine auxotrophs, and only mutants lacking
      both GOGAT and NADP-GDH fail to grow on ammonium.
    supporting_text: >-
      Double-mutant strains containing gog1-1 and gdh1-1 or gdh2-1 (mutations
      that result specifically in the abolition of NADP-GDH activity) result
      in a complete lack of growth on ammonium as sole nitrogen source
  - source_id: PMID:15574419
    title: Kinetic properties and metabolic contributions of yeast mitochondrial and cytosolic NADP+-specific isocitrate dehydrogenases.
    statement: >-
      Mitochondrial NAD-IDH (IDH1/IDH2) carries the major isocitrate flux and
      supplies the 2-oxoglutarate pool in glucose-grown cells, and IDP2 does
      so on non-fermentable carbon; loss of IDH causes glutamate auxotrophy.
    supporting_text: >-
      A substantial cellular pool of alpha-ketoglutarate is attributed to IDH
      function during glucose growth
  - source_id: PMID:8672488
    title: Expression and gene disruption analysis of the isocitrate dehydrogenase family in yeast.
    statement: >-
      Any one of the three yeast isocitrate dehydrogenases (mitochondrial NAD,
      mitochondrial NADP or cytosolic NADP) is enough for glutamate-independent
      growth, so 2-oxoglutarate supply is a redundant upstream input rather
      than a single pathway step.
    supporting_text: >-
      expression of at least one isozyme is necessary for glutamate-independent
      growth
module:
  id: nitrogen_assimilation_glutamate_glutamine
  label: Fungal ammonium assimilation into glutamate and glutamine, and glutamate deamination
  module_type: METABOLIC_PATHWAY
  concepts:
