      term:
        id: GO:0097054
        label: L-glutamate biosynthetic process
      description: Formation of L-glutamate from ammonium and 2-oxoglutarate.
    - preferred_term: L-glutamine biosynthetic process
      term:
        id: GO:1901704
        label: L-glutamine biosynthetic process
      description: Formation of L-glutamine from ammonium and L-glutamate.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-13
      title: 'superpathway of glutamate biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with GDH1, GDH3, GLN1 and GLT1 activities plus IDP1,
        IDP2 and IDP3 isocitrate dehydrogenase, all asserted in cytosol and
        part_of GO:0097054, with no causal edges.
    - model: gomodel:67c10cc400000148
      title: >-
        L-glutamate biosynthetic process (GO:0097054), L-alanine biosynthetic
        process (GO:0042852), L-alanine catabolic process (GO:0042853)
      description: >-
        PomBase S. pombe model of mitochondrial glutamate and alanine
        metabolism: cytosolic gln1, glutamine import into mitochondria,
        mitochondrial glt1 and gdh2, plus alanine transaminase, arginine and
        lysine pathway entry steps and tRNA ligases that are outside this
        module.
  parts:
    - order: 1
      role: glutamine synthesis
      node:
        id: glutamine_synthetase_step
        label: L-glutamate + ammonium + ATP to L-glutamine
        module_type: REACTION
        concepts:
          - preferred_term: L-glutamine biosynthetic process
            term:
              id: GO:1901704
              label: L-glutamine biosynthetic process
        annotons:
          - id: glutamine_synthetase_activity
            label: Glutamine synthetase
            participant:
              selector_type: FAMILY
              gene:
                preferred_term: GLN1 / gln1 (glutamine synthetase)
              family:
                preferred_term: eukaryotic type II glutamine synthetases
                description: >-
                  Fungal glutamine synthetases are GSII-type enzymes in
                  PANTHER PTHR20852, the family of the animal and plant
                  cytoplasmic enzymes; bacterial GlnA (GSI) is a different
                  PANTHER family (PTHR43407).
                family_terms:
                  - id: PANTHER:PTHR20852:SF57
                    label: GLUTAMINE SYNTHETASE 2 CYTOPLASMIC
                representative_members:
                  - preferred_term: GLN1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P32288
                      label: Glutamine synthetase
                    description: S. cerevisiae GLN1/YPR035W (PMID:2570348).
                  - preferred_term: gln1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:Q09179
                      label: Glutamine synthetase
                    description: S. pombe gln1/SPAC23H4.06 (PMID:7773104).
            function:
              preferred_term: glutamine synthetase activity
              term:
                id: GO:0004356
                label: glutamine synthetase activity
              substrates:
