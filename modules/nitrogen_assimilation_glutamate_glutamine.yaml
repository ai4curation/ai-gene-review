                - preferred_term: ammonium
                - preferred_term: ATP
              products:
                - preferred_term: L-glutamine
                - preferred_term: ADP
                - preferred_term: phosphate
              evidence:
                - source_id: EC:6.3.1.2
                  statement: glutamine synthetase
                  notes: MetaCyc:GLUTAMINESYN-RXN
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Sole route to L-glutamine and first half of the GS-GOGAT cycle;
              also fixes the ammonium released by NAD-dependent glutamate
