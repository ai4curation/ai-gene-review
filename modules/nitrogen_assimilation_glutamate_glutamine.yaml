            selection: ONE_OR_MORE
            notes: >-
              Both routes co-exist in S. cerevisiae and S. pombe and either is
              sufficient for growth on ammonium; loss of both gives glutamate
              auxotrophy (PMID:9287019, PMID:7773104). Their relative use
              depends on carbon and nitrogen source (PMID:14555464,
              PMID:11562373).
