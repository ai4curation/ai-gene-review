id: MODULE:dmel_ptw_pp1_complexes
title: PTW/PP1 phosphatase complexes in Drosophila melanogaster
description: >-
  The PTW/PP1 complex is a nuclear phosphatase complex made of the PP1-targeting subunit PNUTS,
  the DNA-binding HMG-box protein Tox4, the WD40 protein Wdr82 and a protein phosphatase 1
  catalytic subunit. In other animals it binds chromatin, dephosphorylates RNA polymerase
  II and transcription elongation factors near the ends of genes and in promoter-proximal
  regions, and is needed for chromatin reorganization at mitotic exit. Drosophila has four
  PP1 catalytic subunits (Pp1-87B, Pp1alpha-96A, Pp1-13C and Flapwing, Flw), and FlyBase defines
  a PTW complex for each.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002144
  title: 'FlyBase gene group PTWP: Ptw-pp1 phosphatase complexes'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as ptw-pp1 phosphatase complexes
    (PTWP); this module models that group.
- source_id: GO:0072357
  title: PTW/PP1 phosphatase complex
  statement: >-
    GO term grounding the module as PTW/PP1 phosphatase complex.
notes: >-
  The four FlyBase PTW-PP1 variants share PNUTS, Tox4 and Wdr82 and differ in the catalytic
  subunit; they are modelled as one targeting part plus an EXACTLY_ONE catalytic choice. Whether
  all four PP1 paralogs bind PNUTS in vivo in Drosophila is not established here. Wdr82 is
  also a subunit of the Set1/COMPASS complex. FlyBase groups realized by this module: PTWP
  (FBgg0002144). Subgroups folded into it: PTW-FLW, PTW-PP1-13C, PTW-PP1-87B, PTW-PP1ALPHA-96A.
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_ptw_pp1_complexes.yaml;
  none of the member genes has a gene review yet unless noted.
