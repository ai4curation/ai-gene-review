        statement: 'Require the actual SAM-to-SAH methyl-transfer reaction: SAM binding, a methyltransferase
          fold, radical SAM cleavage, or other alkyl transfer does not establish this module role.'
        url: https://pubmed.ncbi.nlm.nih.gov/36891755/
        supporting_text: Not all enzymes, however, utilize SAM to catalyze methylation reactions.
