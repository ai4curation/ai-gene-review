              statement: SAH hydrolase reversibly produces adenosine and homocysteine; net hydrolytic
                flux depends on product clearance, while bound NAD participates in internal redox chemistry.
              url: https://pubmed.ncbi.nlm.nih.gov/33339190/
              supporting_text: the equilibrium of the reaction is shifted far towards SAH synthesis
