id: MODULE:bacterial_methionine_cycle
title: Bacterial methionine cycle and homocysteine remethylation
description: A bacterial cycle converts L-methionine to S-adenosyl-L-methionine (SAM), uses SAM in SAH-producing
  methyl-transfer reactions, regenerates homocysteine by alternative SAH-processing chemistries, and remethylates
  homocysteine. Direct SAH hydrolysis, Pfs/LuxS cleavage and deamination followed by SIH hydrolysis have
  distinct enzyme and evidence requirements. Homocysteine remethylation varies with folate, cobalamin,
  external methyl donors and enzyme partners. De novo sulfur assimilation, donor uptake, methylthioadenosine
  salvage and downstream AI-2 reception are adjacent biology. The cycle is an open metabolic system requiring
  energy and methyl input, not a claim of universal bacterial distribution or demonstrated native flux
  in every represented species.
status: COMPLETE
evidence:
- source_id: GO:0033353
  title: L-methionine cycle
  statement: GO:0033353 provides the biological-process boundary for cyclic conversion of methionine through
    SAM, SAH, and homocysteine back to methionine.
- source_id: KEGG:map00270
  title: Cysteine and methionine metabolism
  statement: KEGG map00270 places methionine adenosyltransferase, SAH processing, and homocysteine remethylation
    within cysteine and methionine metabolism.
- source_id: UniProtKB:P0AF12
  title: Escherichia coli K-12 MtnN/Pfs UniProt record
  statement: The reviewed MtnN/Pfs record assigns the SAH nucleosidase reaction and PANTHER:PTHR46832,
    corroborating the family selector for the first step of the alternative bacterial SAH-processing route.
- source_id: UniProtKB:P45578
  title: Escherichia coli K-12 LuxS UniProt record
  statement: The reviewed LuxS record assigns S-ribosylhomocysteine lyase activity and PANTHER:PTHR35799,
    corroborating the family selector for the second step of the alternative bacterial SAH-processing
    route.
- source_id: file:genes/ECOLI/pfs/pfs-ai-review.yaml
  title: ECOLI pfs gene review
  statement: The completed E. coli pfs review grounds MtnN/Pfs as the cytosolic SAH and 5'-methylthioadenosine
    nucleosidase that supplies S-ribosylhomocysteine to LuxS.
- source_id: file:genes/ECOLI/luxS/luxS-ai-review.yaml
  title: ECOLI luxS gene review
  statement: The completed E. coli luxS review grounds LuxS as the cytosolic S-ribosylhomocysteine lyase
    that releases L-homocysteine for methionine regeneration.
