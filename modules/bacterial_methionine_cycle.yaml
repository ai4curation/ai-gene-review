      id: transmethylation
      label: SAM-dependent methyl transfer producing SAH
      module_type: REACTION
      annotons:
      - id: sam_methyltransferase_activity
        label: SAM-dependent methyltransferase role
        participant:
          selector_type: ANY_WITH_FUNCTION
          required_function:
            preferred_term: S-adenosylmethionine-dependent methyltransferase activity
            term:
              id: GO:0008757
              label: S-adenosylmethionine-dependent methyltransferase activity
            description: A bacterial methyltransferase that uses SAM as methyl donor and produces SAH;
              the acceptor varies with the methylation reaction and is not fixed by this cycle module.
          family:
            preferred_term: SAH-producing SAM-dependent methyltransferase families
            description: A collection of unrelated catalytic families sharing the SAM-to-SAH methyl-transfer
              reaction; this is not one homologous superfamily.
            representative_members:
            - preferred_term: cheR (ECOLI K-12)
              term:
                id: UniProtKB:P07364
                label: Chemotaxis protein methyltransferase
            notes: The representative is officially PANTHER:PTHR24422:SF19 (CHEMOTAXIS PROTEIN METHYLTRANSFERASE).
              That classification describes this realizer only. Other source-supported methyltransferase
              families can fill the role; neither CheR nor chemotaxis is required in every bacterium.
            evidence:
            - source_id: file:genes/ECOLI/cheR/cheR-uniprot.txt
              statement: The curated CheR reaction transfers methyl from SAM to a protein glutamyl residue
                and produces SAH; its PANTHER classification grounds one family exemplar.
          notes: 'ANY_WITH_FUNCTION remains intentional: require the actual SAM-to-SAH methyl-transfer
            reaction. SAM binding, radical-SAM cleavage and the wrong SAM diastereomer do not independently
            satisfy this role. The family collection is descriptive, not an unsupported evolutionary claim.'
