  connections:
  - source: sam_synthesis
    target: transmethylation
    connection_type: PROVIDES_INPUT_FOR
    description: SAM produced by MetK is the methyl donor used in transmethylation.
  - source: transmethylation
    target: sah_processing
    connection_type: PROVIDES_INPUT_FOR
    description: Transmethylation supplies SAH to a complete supported processing route.
  - source: sah_processing
    target: homocysteine_remethylation
    connection_type: PROVIDES_INPUT_FOR
    description: Complete SAH processing supplies homocysteine for remethylation.
  - source: homocysteine_remethylation
    target: sam_synthesis
    connection_type: PROVIDES_INPUT_FOR
    description: Remethylation regenerates methionine for another cycle.
  notes: This bacterial module is intentionally separate from the existing eukaryotic methionine_cycle,
    sam_cycle, and homocysteine_metabolism modules. De novo methionine biosynthesis remains in methionine_biosynthesis.
    Cysteine biosynthesis, transsulfuration, sulfur assimilation, methionine degradation, and methylthioadenosine
    salvage are outside this cycle boundary.
  knowledge_gaps:
  - gap_statement: The distribution and physiological use of direct AhcY versus the two-step MtnN/Pfs-LuxS
      route vary across bacterial lineages and growth conditions.
    boundary: A genome satisfies the two-step route only when both MtnN/Pfs and LuxS are supported; isolated
      MtnN-family proteins also used in MTA salvage do not establish a complete methionine-cycle route.
    gap_kind:
    - BIOLOGY
    - CURATION
  context:
    taxa:
    - preferred_term: Bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
    notes: Bacteria is an occurrence envelope, not a universal pathway-presence claim. Complete capacity
      requires the chemically matched steps, suitable methyl donor/cofactor and supported partner context.
      Genetic presence and isolated enzyme activity do not establish native cycle flux.
