id: MODULE:bacterial_methionine_cycle
title: Bacterial methionine cycle and homocysteine remethylation
description: >-
  A reusable bacterial cycle that converts L-methionine to
  S-adenosyl-L-methionine (SAM), channels SAM through methyl-transfer reactions
  that produce S-adenosyl-L-homocysteine (SAH), hydrolyzes SAH to
  L-homocysteine, and remethylates L-homocysteine to regenerate L-methionine.
  The boundary begins with methionine adenosylation and ends with methionine
  regeneration; de novo production of methionine and sulfur assimilation are
  adjacent pathways rather than parts of this cycle.
status: DRAFT
evidence:
  - source_id: GO:0033353
    title: L-methionine cycle
    statement: >-
      GO:0033353 provides the biological-process boundary for cyclic conversion
      of methionine through SAM, SAH, and homocysteine back to methionine.
  - source_id: KEGG:map00270
    title: Cysteine and methionine metabolism
    statement: >-
      KEGG map00270 places methionine adenosyltransferase, SAH processing, and
      homocysteine remethylation within cysteine and methionine metabolism.
module:
  id: bacterial_methionine_cycle
  label: Bacterial methionine cycle and remethylation
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: L-methionine cycle
      term:
        id: GO:0033353
        label: L-methionine cycle
  parts:
    - order: 1
      role: S-adenosyl-L-methionine synthesis
      node:
        id: sam_synthesis
        label: Methionine adenosylation to SAM
        module_type: REACTION
        annotons:
          - id: metk_activity
            label: Methionine adenosyltransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: S-adenosylmethionine synthetase family
                term:
                  id: PANTHER:PTHR11964
                  label: S-ADENOSYLMETHIONINE SYNTHETASE
                representative_members:
                  - preferred_term: PSEPK MetK
                    term:
                      id: UniProtKB:Q88D60
                      label: S-adenosylmethionine synthase
            function:
              preferred_term: methionine adenosyltransferase activity
              term:
                id: GO:0004478
                label: methionine adenosyltransferase activity
              substrates:
                - preferred_term: L-methionine
                  term:
                    id: CHEBI:57844
                    label: L-methionine zwitterion
                - preferred_term: ATP
                  term:
                    id: CHEBI:30616
                    label: ATP
                - preferred_term: water
                  term:
                    id: CHEBI:15377
                    label: water
              products:
                - preferred_term: S-adenosyl-L-methionine
                  term:
                    id: CHEBI:59789
                    label: S-adenosyl-L-methionine zwitterion
                - preferred_term: phosphate
                  term:
                    id: CHEBI:43474
                    label: phosphate
                - preferred_term: diphosphate
                  term:
                    id: CHEBI:33019
                    label: diphosphate(4-)
              evidence:
                - source_id: RHEA:21080
                  statement: >-
                    RHEA:21080 is the balanced MetK reaction recorded in the
                    PSEPK Q88D60 UniProt entry.
            role_description: Produces the SAM methyl donor from methionine and ATP.
    - order: 2
      role: SAM-dependent transmethylation
      node:
        id: transmethylation
        label: SAM-dependent methyl transfer producing SAH
        module_type: REACTION
        annotons:
          - id: sam_methyltransferase_activity
            label: SAM-dependent methyltransferase role
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: methyltransferase activity
                term:
                  id: GO:0008168
                  label: methyltransferase activity
                description: >-
                  A bacterial methyltransferase that uses SAM as methyl donor
                  and produces SAH; the acceptor varies with the methylation
                  reaction and is not fixed by this cycle module.
            function:
              preferred_term: SAM-dependent methyltransferase activity
              term:
                id: GO:0008168
                label: methyltransferase activity
              substrates:
                - preferred_term: S-adenosyl-L-methionine
                  term:
                    id: CHEBI:59789
                    label: S-adenosyl-L-methionine zwitterion
                - preferred_term: methyl-group acceptor
              products:
                - preferred_term: S-adenosyl-L-homocysteine
                  term:
                    id: CHEBI:57856
                    label: S-adenosyl-L-homocysteine zwitterion
                - preferred_term: methylated acceptor
            role_description: >-
              Represents the distributed set of SAM-consuming methylation
              reactions that generate SAH rather than a single dedicated enzyme.
    - order: 3
      role: S-adenosyl-L-homocysteine processing to homocysteine
      node:
        id: sah_processing
        label: Alternative bacterial SAH-processing routes
        module_type: METABOLIC_PATHWAY
        variant_sets:
          - id: sah_processing_route
            label: SAH-processing chemistry
            axis: one-step hydrolysis or two-step nucleosidase/lyase route
            selection: ONE_OR_MORE
            variants:
              - id: ahcy_route
                label: Direct AhcY hydrolysis
                module_type: REACTION
                annotons:
                  - id: ahcy_activity
                    label: Adenosylhomocysteinase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Adenosylhomocysteinase family
                        term:
                          id: PANTHER:PTHR23420
                          label: ADENOSYLHOMOCYSTEINASE
                        representative_members:
                          - preferred_term: PSEPK AhcY
                            term:
                              id: UniProtKB:A0A140FWS3
                              label: Adenosylhomocysteinase
                    function:
                      preferred_term: adenosylhomocysteinase activity
                      term:
                        id: GO:0004013
                        label: adenosylhomocysteinase activity
                      substrates:
                        - preferred_term: S-adenosyl-L-homocysteine
                          term:
                            id: CHEBI:57856
                            label: S-adenosyl-L-homocysteine zwitterion
                        - preferred_term: water
                          term:
                            id: CHEBI:15377
                            label: water
                      products:
                        - preferred_term: L-homocysteine
                          term:
                            id: CHEBI:58199
                            label: L-homocysteine zwitterion
                        - preferred_term: adenosine
                          term:
                            id: CHEBI:16335
                            label: adenosine
                      evidence:
                        - source_id: RHEA:21708
                          statement: >-
                            RHEA:21708 is the balanced AhcY reaction recorded in
                            the PSEPK A0A140FWS3 UniProt entry.
                    role_description: >-
                      Directly hydrolyzes SAH and supplies homocysteine for
                      remethylation.
              - id: mtnn_luxs_route
                label: MtnN/Pfs plus LuxS route
                module_type: METABOLIC_PATHWAY
                description: >-
                  A two-step bacterial route in which MtnN/Pfs converts SAH to
                  S-ribosylhomocysteine and LuxS releases homocysteine. Both
                  steps are required; the nucleosidase alone does not complete
                  SAH conversion to homocysteine.
                parts:
                  - order: 1
                    role: SAH nucleoside cleavage
                    node:
                      id: mtnn_step
                      label: SAH nucleosidase reaction
                      module_type: REACTION
                      annotons:
                        - id: mtnn_activity
                          label: Adenosylhomocysteine nucleosidase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: MtnN/Pfs nucleosidase family
                              term:
                                id: PANTHER:PTHR46832
                                label: 5'-METHYLTHIOADENOSINE/S-ADENOSYLHOMOCYSTEINE NUCLEOSIDASE
                              representative_members:
                                - preferred_term: Escherichia coli K-12 MtnN/Pfs
                                  term:
                                    id: UniProtKB:P0AF12
                                    label: 5'-methylthioadenosine/S-adenosylhomocysteine nucleosidase
                          function:
                            preferred_term: adenosylhomocysteine nucleosidase activity
                            term:
                              id: GO:0008782
                              label: adenosylhomocysteine nucleosidase activity
                            substrates:
                              - preferred_term: S-adenosyl-L-homocysteine
                                term:
                                  id: CHEBI:57856
                                  label: S-adenosyl-L-homocysteine zwitterion
                              - preferred_term: water
                                term:
                                  id: CHEBI:15377
                                  label: water
                            products:
                              - preferred_term: S-ribosyl-L-homocysteine
                                term:
                                  id: CHEBI:58195
                                  label: S-(5-deoxy-D-ribos-5-yl)-L-homocysteine zwitterion
                              - preferred_term: adenine
                                term:
                                  id: CHEBI:16708
                                  label: adenine
                            evidence:
                              - source_id: RHEA:17805
                                statement: >-
                                  RHEA:17805 is the balanced SAH nucleosidase
                                  reaction recorded for UniProtKB:P0AF12.
                          role_description: >-
                            Produces S-ribosylhomocysteine for the required LuxS
                            step; this enzyme can also participate in MTA salvage.
                  - order: 2
                    role: homocysteine release
                    node:
                      id: luxs_step
                      label: S-ribosylhomocysteine cleavage
                      module_type: REACTION
                      annotons:
                        - id: luxs_activity
                          label: S-ribosylhomocysteine lyase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: LuxS family
                              term:
                                id: PANTHER:PTHR35799
                                label: S-RIBOSYLHOMOCYSTEINE LYASE
                              representative_members:
                                - preferred_term: Escherichia coli K-12 LuxS
                                  term:
                                    id: UniProtKB:P45578
                                    label: S-ribosylhomocysteine lyase
                          function:
                            preferred_term: S-ribosylhomocysteine lyase activity
                            term:
                              id: GO:0043768
                              label: S-ribosylhomocysteine lyase activity
                            substrates:
                              - preferred_term: S-ribosyl-L-homocysteine
                                term:
                                  id: CHEBI:58195
                                  label: S-(5-deoxy-D-ribos-5-yl)-L-homocysteine zwitterion
                            products:
                              - preferred_term: L-homocysteine
                                term:
                                  id: CHEBI:58199
                                  label: L-homocysteine zwitterion
                              - preferred_term: 4,5-dihydroxypentane-2,3-dione
                                term:
                                  id: CHEBI:29484
                                  label: (S)-4,5-dihydroxypentane-2,3-dione
                            evidence:
                              - source_id: RHEA:17753
                                statement: >-
                                  RHEA:17753 is the balanced LuxS reaction
                                  recorded for UniProtKB:P45578.
                          role_description: >-
                            Releases homocysteine from S-ribosylhomocysteine;
                            the second product can cyclize into AI-2 signals.
                connections:
                  - source: mtnn_step
                    target: luxs_step
                    connection_type: PROVIDES_INPUT_FOR
                    description: >-
                      MtnN/Pfs supplies S-ribosylhomocysteine to LuxS.
    - order: 4
      role: homocysteine remethylation to methionine
      node:
        id: homocysteine_remethylation
        label: Folate-dependent methionine regeneration
        module_type: REACTION
        variant_sets:
          - id: methionine_synthase_route
            label: Methionine synthase route
            axis: cobalamin dependence
            selection: ONE_OR_MORE
            variants:
              - id: meth_variant
                label: Cobalamin-dependent MetH route
                module_type: REACTION
                annotons:
                  - id: meth_activity
                    label: Cobalamin-dependent methionine synthase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Methionine synthase family
                        term:
                          id: PANTHER:PTHR45833
                          label: METHIONINE SYNTHASE
                        representative_members:
                          - preferred_term: PSEPK MetH
                            term:
                              id: UniProtKB:Q88KB5
                              label: Methionine synthase
                    function:
                      preferred_term: methionine synthase activity
                      term:
                        id: GO:0008705
                        label: methionine synthase activity
                      substrates:
                        - preferred_term: 5-methyltetrahydrofolate
                          term:
                            id: CHEBI:57453
                            label: (6S)-5-methyl-5,6,7,8-tetrahydrofolate(2-)
                        - preferred_term: L-homocysteine
                          term:
                            id: CHEBI:58199
                            label: L-homocysteine zwitterion
                      products:
                        - preferred_term: tetrahydrofolate
                          term:
                            id: CHEBI:18608
                            label: (6S)-5,6,7,8-tetrahydrofolate
                        - preferred_term: L-methionine
                          term:
                            id: CHEBI:57844
                            label: L-methionine zwitterion
                      evidence:
                        - source_id: RHEA:11172
                          statement: >-
                            RHEA:11172 is the balanced MetH reaction recorded in
                            the PSEPK Q88KB5 UniProt entry.
                    role_description: >-
                      Regenerates methionine using cobalamin and
                      5-methyltetrahydrofolate.
              - id: mete_variant
                label: Cobalamin-independent MetE route
                module_type: REACTION
                annotons:
                  - id: mete_activity
                    label: Cobalamin-independent methionine synthase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Cobalamin-independent methionine synthase family
                        term:
                          id: PANTHER:PTHR30519
                          label: 5-METHYLTETRAHYDROPTEROYLTRIGLUTAMATE--HOMOCYSTEINE METHYLTRANSFERASE
                        representative_members:
                          - preferred_term: PSEPK MetE candidate
                            term:
                              id: UniProtKB:Q88JF1
                              label: 5-methyltetrahydropteroyltriglutamate-homocysteine methyltransferase
                    function:
                      preferred_term: 5-methyltetrahydropteroyltriglutamate-homocysteine S-methyltransferase activity
                      term:
                        id: GO:0003871
                        label: 5-methyltetrahydropteroyltriglutamate-homocysteine S-methyltransferase activity
                      evidence:
                        - source_id: file:PSEPK/metE/metE-ai-review.yaml
                          statement: >-
                            The PSEPK representative is a compact predicted
                            family member whose KT2440 activity remains untested.
                    role_description: >-
                      Regenerates methionine without a cobalamin cofactor.
  connections:
    - source: sam_synthesis
      target: transmethylation
      connection_type: PROVIDES_INPUT_FOR
      description: SAM produced by MetK is the methyl donor used in transmethylation.
    - source: transmethylation
      target: sah_processing
      connection_type: PROVIDES_INPUT_FOR
      description: Transmethylation produces SAH for either bacterial processing route.
    - source: sah_processing
      target: homocysteine_remethylation
      connection_type: PROVIDES_INPUT_FOR
      description: Complete SAH processing supplies homocysteine for remethylation.
    - source: homocysteine_remethylation
      target: sam_synthesis
      connection_type: PROVIDES_INPUT_FOR
      description: Remethylation regenerates methionine for another cycle.
  notes: >-
    This bacterial module is intentionally separate from the existing
    eukaryotic methionine_cycle, sam_cycle, and homocysteine_metabolism modules.
    De novo methionine biosynthesis remains in methionine_biosynthesis. Cysteine
    biosynthesis, transsulfuration, sulfur assimilation, methionine degradation,
    and methylthioadenosine salvage are outside this cycle boundary.
  knowledge_gaps:
    - gap_statement: >-
        The distribution and physiological use of direct AhcY versus the
        two-step MtnN/Pfs-LuxS route vary across bacterial lineages and growth
        conditions.
      boundary: >-
        A genome satisfies the two-step route only when both MtnN/Pfs and LuxS
        are supported; isolated MtnN-family proteins also used in MTA salvage do
        not establish a complete methionine-cycle route.
      gap_kind:
        - BIOLOGY
        - CURATION
