                module_type: REACTION
                description: >-
                  Cobalamin-independent, zinc-dependent methionine synthase that
                  requires the polyglutamylated (triglutamate) methyl-folate
                  donor. This is the only remethylation route in budding and
                  fission yeast (MET6, met26), and is also used by plants and
                  many bacteria.
                annotons:
                  - id: mete_activity
                    label: Cobalamin-independent methionine synthase activity
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: 5-methyltetrahydropteroyltriglutamate-homocysteine S-methyltransferase activity
                        term:
                          id: GO:0003871
                          label: 5-methyltetrahydropteroyltriglutamate-homocysteine S-methyltransferase activity
                      family:
