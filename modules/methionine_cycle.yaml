id: MODULE:methionine_cycle
title: Methionine (S-adenosylmethionine) cycle module
description: >-
  A taxon-neutral decomposition of the methionine / S-adenosylmethionine (SAM)
  cycle, the core methyl-group-cycling pathway that interconverts methionine,
  S-adenosyl-L-methionine, S-adenosyl-L-homocysteine, and homocysteine, with
  exits to transsulfuration (via cystathionine beta-synthase) and remethylation
  inputs from folate (via methionine synthase) and choline/betaine (via BHMT).

  This module is intentionally structured in two layers. The CATALYTIC layer
  (enzymatic steps) grounds each step to a GO molecular-function term, the same
  EC <-> GO MF alignment used by the gluconeogenesis module. The REGULATORY layer
  is captured as connections of type POSITIVELY_REGULATES / NEGATIVELY_REGULATES
  whose predicate is grounded to a Systems Biology Ontology (SBO) term that
  distinguishes the MECHANISM (competitive vs allosteric), with the effector
  represented as a ChEBI-grounded metabolite-pool node. This regulatory wiring
  (small-molecule effector -> enzyme, with mechanism and sign) is information GO
  cannot express: GO annotations attach to gene products, the effectors here are
  metabolites, and GO has no competitive-vs-allosteric distinction.

  The regulatory structure is transcribed from the biosustain Maud kinetic model
  `data/methionine/methionine_cycle.toml`. A notable showcase is METAT, where two
  isozyme forms of methionine adenosyltransferase catalyse the SAME reaction but
  are OPPOSITELY regulated by SAM: MAT-I is competitively product-inhibited by
  SAM, whereas MAT-III is allosterically activated by SAM. Isozyme-specific
  regulation of this kind is the central thing GO flattens away.

  The core chemistry (SAM synthesis, transmethylation, SAH hydrolysis,
  homocysteine remethylation) is universal; the lineage-specific pieces are
  modelled as optional parts or variants. Fungi such as budding and fission
  yeast run the cycle with single-chain SAM synthetases (two paralogues in
  S. cerevisiae), a single adenosylhomocysteinase, and a cobalamin-independent
  (MetE-type) methionine synthase that uses 5-methyltetrahydropteroyl
  triglutamate; they have no glycine N-methyltransferase or
  betaine-homocysteine methyltransferase, whereas mammals use the
  cobalamin-dependent MetH-type enzyme plus hepatic BHMT and GNMT. The
  5'-methylthioadenosine (MTA) salvage route back to methionine is a separate
  module (methionine_salvage_mta_cycle).
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY-5041
    title: S-adenosyl-L-methionine cycle II
    statement: >-
      Source pathway for the S. cerevisiae realisation: SAM1/SAM2 methionine
      adenosyltransferase, an uncatalysed generic SAM-dependent methylation
      (RXN-7605), SAH1 adenosylhomocysteinase and MET6 cobalamin-independent
      methionine synthase. All four gene assignments were retained. The
      frame omits the MTHFR step that supplies 5-methyl-THF (MET13, with minor
      MET12) and the CYS4 transsulfuration exit, which are added here as
      exemplars of existing parts.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5041
  - source_id: YeastPathways:SAM-PWY
    title: S-adenosyl-L-methionine biosynthesis
    statement: >-
      Single-reaction YeastCyc frame (SAM1/SAM2 methionine
      adenosyltransferase); folded into the SAM-forming step of this module
      rather than modelled separately.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=SAM-PWY
  - source_id: PMID:9409150
    title: Metabolism of sulfur amino acids in Saccharomyces cerevisiae.
    statement: >-
      Review of yeast sulfur amino acid metabolism, including the SAM
      synthetases, SAH hydrolysis and methionine synthase; cited by YeastCyc
      for PWY-5041 and SAM-PWY.
    supporting_text: >-
      Sulfur amino acid biosynthesis in Saccharomyces cerevisiae involves a
      large number of enzymes required for the de novo biosynthesis of
      methionine and cysteine and the recycling of organic sulfur metabolites.
  - source_id: PMID:3316224
    title: SAM1, the structural gene for one of the S-adenosylmethionine synthetases in Saccharomyces cerevisiae. Sequence and expression.
    statement: S. cerevisiae has two SAM synthetase genes, SAM1 and SAM2, homologous to E. coli MetK.
    supporting_text: >-
      Saccharomyces cerevisiae contains two genes, SAM1 and SAM2, encoding
      functional S-adenosylmethionine synthetases.
  - source_id: PMID:1903502
    title: The synthesis of the two S-adenosyl-methionine synthetases is differently regulated in Saccharomyces cerevisiae.
    statement: SAM1 and SAM2 are differentially regulated paralogues catalysing the same reaction.
    supporting_text: the expression of SAM1 and SAM2 is regulated differently
  - source_id: PMID:18591246
    title: >-
      S-adenosyl-L-homocysteine hydrolase, key enzyme of methylation
      metabolism, regulates phosphatidylcholine synthesis and triacylglycerol
      homeostasis in yeast: implications for homocysteine as a risk factor of
      atherosclerosis.
    statement: Sah1 is the sole route for SAH removal in yeast; its depletion raises SAH and inhibits SAM-dependent methylation.
    supporting_text: >-
      In eukaryotes, S-adenosyl-L-homocysteine hydrolase (Sah1) offers a single
      way for degradation of S-adenosyl-L-homocysteine
  - source_id: PMID:10600168
    title: Saccharomyces cerevisiae expresses two genes encoding isozymes of methylenetetrahydrofolate reductase.
    statement: MET13 is the physiologically required yeast MTHFR; MET12 encodes a second, dispensable isozyme.
    supporting_text: >-
      single disruption of MET13 resulted in methionine auxotrophy
  - source_id: PMID:11729203
    title: >-
      Metabolic engineering in yeast demonstrates that S-adenosylmethionine
      controls flux through the methylenetetrahydrofolate reductase reaction
      in vivo.
    statement: Yeast Met13 MTHFR is SAM-inhibited like the mammalian enzyme, so the SAM -> MTHFR feedback edge holds in fungi.
    supporting_text: >-
      Like mammalian MTHFRs, the yeast MTHFR encoded by the MET13 gene is
      NADPH-dependent and is inhibited by AdoMet in vitro.
  - source_id: GO:0033353
    title: L-methionine cycle
    statement: The module is grounded in the GO biological-process term for the methionine / S-adenosylmethionine cycle (exact synonym "S-adenosylmethionine cycle").
  - source_id: file:models/methionine/methionine_cycle.regulation.toml
    title: biosustain Methionine_model (Maud kinetic model)
    statement: >-
      Reaction set, isozymes, and the allosteric/competitive regulation wiring are
      transcribed from the Maud model data/methionine/methionine_cycle.toml.
    url: https://github.com/biosustain/Methionine_model/blob/main/data/methionine/methionine_cycle.toml
module:
  id: methionine_cycle
  label: Methionine (SAM) cycle
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: methionine cycle
      term:
        id: GO:0033353
        label: L-methionine cycle
      description: >-
        Cyclic interconversion of methionine, S-adenosyl-L-methionine,
        S-adenosyl-L-homocysteine, and homocysteine, coupling methyl-donor supply
        to folate one-carbon and transsulfuration metabolism.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY-5041
      title: "S-adenosyl-L-methionine cycle II - imported from: Saccharomyces Genome Database (S. cerevisiae)"
  parts:
    - order: 1
      role: SAM-forming step (methionine activation)
      node:
        id: metat_step
        label: Methionine -> S-adenosyl-L-methionine
        module_type: REACTION
        description: >-
          Methionine adenosyltransferase (EC 2.5.1.6) condenses methionine and
          ATP to S-adenosyl-L-methionine (SAM), the universal methyl donor. The
          isozyme forms differ in their feedback logic, so they are modelled as
          variants to carry isozyme-specific regulation. Outside vertebrate
          liver the step is carried by MAT2A-type / MetK-type synthetases
          (including both yeast paralogues), modelled as a third variant.
        concepts:
          - preferred_term: methionine adenosyltransferase reaction
        variant_sets:
          - id: mat_isozyme_form
            label: Methionine adenosyltransferase isozyme/oligomeric forms
            axis: isozyme / oligomeric form
            selection: ONE_OR_MORE
            variants:
              - id: mat1_form
                label: MAT-I (high-capacity hepatic form)
                module_type: REACTION
                annotons:
                  - id: mat1_activity
                    label: MAT-I methionine adenosyltransferase activity
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MAT-I (MAT1A-encoded high-K_m hepatic isozyme)
                        term:
                          id: UniProtKB:Q00266
                          label: S-adenosylmethionine synthase isoform type-1
                        description: >-
                          High-K_m hepatic methionine adenosyltransferase form. Subject
                          to competitive product (SAM) inhibition in the kinetic model.
                    function:
                      preferred_term: methionine adenosyltransferase activity
                      term:
                        id: GO:0004478
                        label: methionine adenosyltransferase activity
                      substrates:
                        - preferred_term: L-methionine
                        - preferred_term: ATP
                      products:
                        - preferred_term: S-adenosyl-L-methionine
                        - preferred_term: phosphate
                        - preferred_term: diphosphate
              - id: mat3_form
                label: MAT-III (low-affinity hepatic form)
                module_type: REACTION
                annotons:
                  - id: mat3_activity
                    label: MAT-III methionine adenosyltransferase activity
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MAT-III (MAT1A-encoded low-affinity hepatic isozyme)
                        term:
                          id: UniProtKB:Q00266
                          label: S-adenosylmethionine synthase isoform type-1
                        description: >-
                          Low-affinity hepatic methionine adenosyltransferase form,
                          allosterically activated by its own product SAM and by
                          methionine (feed-forward), the opposite of MAT-I.
                    function:
                      preferred_term: methionine adenosyltransferase activity
                      term:
                        id: GO:0004478
                        label: methionine adenosyltransferase activity
                      substrates:
                        - preferred_term: L-methionine
                        - preferred_term: ATP
                      products:
                        - preferred_term: S-adenosyl-L-methionine
                        - preferred_term: phosphate
                        - preferred_term: diphosphate
              - id: mat_single_chain_form
                label: MAT2A-type / MetK-type SAM synthetase (non-hepatic, fungal, bacterial)
                module_type: REACTION
                description: >-
                  The general form of the step outside vertebrate liver. Budding
                  yeast has two nearly identical, differentially regulated
                  paralogues (SAM1, SAM2); fission yeast has one (sam1).
                annotons:
                  - id: mat_single_chain_activity
                    label: Methionine adenosyltransferase (MAT2A/MetK/SAM1-type)
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: methionine adenosyltransferase activity
                        term:
                          id: GO:0004478
                          label: methionine adenosyltransferase activity
                      family:
                        preferred_term: S-adenosylmethionine synthetase family
                        term:
                          id: PANTHER:PTHR11964
                          label: S-ADENOSYLMETHIONINE SYNTHETASE
                        representative_members:
                          - preferred_term: SAM1 (S. cerevisiae)
                            term:
                              id: UniProtKB:P10659
                              label: S-adenosylmethionine synthase 1
                          - preferred_term: SAM2 (S. cerevisiae)
                            term:
                              id: UniProtKB:P19358
                              label: S-adenosylmethionine synthase 2
                          - preferred_term: sam1 (S. pombe)
                            term:
                              id: UniProtKB:O60198
                              label: S-adenosylmethionine synthase
                          - preferred_term: MAT2A (human)
                            term:
                              id: UniProtKB:P31153
                              label: S-adenosylmethionine synthase isoform type-2
                          - preferred_term: metK (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P0A817
                              label: S-adenosylmethionine synthase
                    function:
                      preferred_term: methionine adenosyltransferase activity
                      term:
                        id: GO:0004478
                        label: methionine adenosyltransferase activity
                      substrates:
                        - preferred_term: L-methionine
                        - preferred_term: ATP
                      products:
                        - preferred_term: S-adenosyl-L-methionine
                        - preferred_term: phosphate
                        - preferred_term: diphosphate
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    gocam_associations:
                      - model: gomodel:YeastPathways_PWY-5041
                        activity: gomodel:S-ADENMETSYN-RXN
                        title: "S-adenosyl-L-methionine cycle II (S. cerevisiae)"
    - order: 2
      role: bulk transmethylation (SAM-dependent methyltransferases)
      node:
        id: meth_step
        label: SAM-dependent transmethylation (general)
        module_type: REACTION
        description: >-
          Lumped node for the many SAM-dependent methyltransferases (EC 2.1.1.-)
          that transfer SAM's methyl group to acceptors (DNA, protein, small
          molecules), yielding S-adenosyl-L-homocysteine (SAH). Competitively
          product-inhibited by SAH in the kinetic model.
        annotons:
          - id: meth_activity
            label: SAM-dependent methyltransferase activity (general)
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: methyltransferase activity
                term:
                  id: GO:0008168
                  label: methyltransferase activity
            function:
              preferred_term: methyltransferase activity
              term:
                id: GO:0008168
                label: methyltransferase activity
              substrates:
                - preferred_term: S-adenosyl-L-methionine
                - preferred_term: methyl acceptor
              products:
                - preferred_term: S-adenosyl-L-homocysteine
                - preferred_term: methylated acceptor
    - order: 3
      optional: true
      role: SAM disposal / glycine sink
      notes: >-
        Vertebrate (chiefly hepatic) overflow valve. Fungi such as S.
        cerevisiae and S. pombe have no GNMT orthologue, so the cycle closes
        without this step there.
      node:
        id: gnmt_step
        label: Glycine N-methyltransferase (SAM:SAH buffering)
        module_type: REACTION
        description: >-
          Glycine N-methyltransferase (EC 2.1.1.20) methylates glycine to
          sarcosine, acting as the overflow valve that buffers the SAM:SAH ratio.
          Allosterically inhibited by 5,10-methylenetetrahydrofolate and
          competitively inhibited by SAH; activated by SAM.
        annotons:
          - id: gnmt_activity
            label: Glycine N-methyltransferase activity
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: glycine N-methyltransferase activity
                term:
                  id: GO:0017174
                  label: glycine N-methyltransferase activity
            function:
              preferred_term: glycine N-methyltransferase activity
              term:
                id: GO:0017174
                label: glycine N-methyltransferase activity
              substrates:
                - preferred_term: S-adenosyl-L-methionine
                - preferred_term: glycine
              products:
                - preferred_term: S-adenosyl-L-homocysteine
                - preferred_term: sarcosine
    - order: 4
      role: SAH hydrolysis
      node:
        id: ahc_step
        label: S-adenosyl-L-homocysteine -> L-homocysteine
        module_type: REACTION
        description: >-
          Adenosylhomocysteinase (EC 3.3.1.1) hydrolyses SAH to L-homocysteine
          and adenosine, relieving SAH product inhibition of methyltransferases.
        annotons:
          - id: ahc_activity
            label: Adenosylhomocysteinase activity
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: adenosylhomocysteinase activity
                term:
                  id: GO:0004013
                  label: adenosylhomocysteinase activity
              family:
                preferred_term: adenosylhomocysteinase family
                family_terms:
                  - id: PANTHER:PTHR23420:SF0
                    label: ADENOSYLHOMOCYSTEINASE
                  - id: PANTHER:PTHR23420:SF17
                    label: ADENOSYLHOMOCYSTEINASE
                  - id: PANTHER:PTHR23420:SF29
                    label: ADENOSYLHOMOCYSTEINASE 1
                  - id: PANTHER:PTHR23420:SF16
                    label: ADENOSYLHOMOCYSTEINASE 2
                representative_members:
                  - preferred_term: SAH1 (S. cerevisiae)
                    term:
                      id: UniProtKB:P39954
                      label: Adenosylhomocysteinase
                    description: Sole SAH-degrading enzyme in yeast (PMID:18591246).
                  - preferred_term: sah1 (S. pombe, SPBC8D2.18c)
                    term:
                      id: UniProtKB:O13639
                      label: Adenosylhomocysteinase
                  - preferred_term: AHCY (human)
                    term:
                      id: UniProtKB:P23526
                      label: Adenosylhomocysteinase
            function:
              preferred_term: adenosylhomocysteinase activity
              term:
                id: GO:0004013
                label: adenosylhomocysteinase activity
              substrates:
                - preferred_term: S-adenosyl-L-homocysteine
              products:
                - preferred_term: L-homocysteine
                - preferred_term: adenosine
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:YeastPathways_PWY-5041
                activity: gomodel:ADENOSYLHOMOCYSTEINASE-RXN
                title: "S-adenosyl-L-methionine cycle II (S. cerevisiae)"
    - order: 5
      role: homocysteine fate (remethylation vs transsulfuration)
      node:
        id: homocysteine_fate
        label: Homocysteine fate branch
        module_type: REACTION
        description: >-
          Homocysteine is either remethylated back to methionine (folate-dependent
          via methionine synthase, or betaine-dependent via BHMT) or committed to
          transsulfuration via cystathionine beta-synthase.
        variant_sets:
          - id: homocysteine_fate_axis
            label: Homocysteine disposal routes
            axis: metabolic fate
            selection: ONE_OR_MORE
            variants:
              - id: ms_route
                label: Folate-dependent remethylation, cobalamin-dependent (MetH/MTR-type methionine synthase)
                module_type: REACTION
                description: >-
                  Cobalamin-dependent methionine synthase using monoglutamyl
                  5-methyltetrahydrofolate (animals, many bacteria). Absent from
                  yeasts, which use the MetE-type enzyme below.
                annotons:
                  - id: ms_activity
                    label: Methionine synthase activity
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: methionine synthase activity
                        term:
                          id: GO:0008705
                          label: methionine synthase activity
                      family:
                        preferred_term: cobalamin-dependent methionine synthase
                        term:
