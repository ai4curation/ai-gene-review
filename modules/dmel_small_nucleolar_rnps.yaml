id: MODULE:dmel_small_nucleolar_rnps
title: Small nucleolar ribonucleoprotein complexes in Drosophila melanogaster
description: >-
  Small nucleolar ribonucleoproteins (snoRNPs) guide chemical modification and processing
  of ribosomal RNA in the nucleolus. Box H/ACA snoRNPs contain a guide RNA and four core proteins,
  the pseudouridine synthase dyskerin (Nop60B in Drosophila), Gar1, Nhp2 and Nop10, and convert
  target uridines into pseudouridine. Box C/D snoRNPs contain the methyltransferase fibrillarin
  with Nop56, Nop58 and a 15.5K protein and catalyse 2'-O-methylation of target nucleotides.
  The U3 box C/D snoRNP instead acts in early pre-rRNA cleavage within the small-subunit processome.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001761
  title: 'FlyBase gene group SRNPS: Small nucleolar ribonucleoprotein complexes'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as small nucleolar ribonucleoprotein
    complexes (SRNPS); this module models that group.
- source_id: GO:0005732
  title: sno(s)RNA-containing ribonucleoprotein complex
  statement: >-
    GO term grounding the module as sno(s)RNA-containing ribonucleoprotein complex.
notes: >-
  Parts follow FlyBase subgroups H-ACA and C-DRNP. The C/D group includes U3-55K, a U3 snoRNP-specific
  protein, so the part uses the general box C/D RNP complex term rather than the methylation-guide
  snoRNP term. The 15.5K core protein of C/D snoRNPs and the snoRNAs themselves are not in
  the FlyBase groups and are not participants. Nop60B has also been studied as minifly (mfl).
  FlyBase groups realized by this module: SRNPS (FBgg0001761). Subgroups folded into it: H-ACA,
  C-DRNP. Participants were generated from the FlyBase gene-group membership and mapped to
  UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_small_nucleolar_rnps.yaml;
  none of the member genes has a gene review yet unless noted.
