id: MODULE:hippo_signaling
title: Hippo-YAP/TAZ signaling pathway module
description: >-
  A compact Hippo pathway module. Upstream polarity, junctional, mechanical, and
  stress inputs activate the MST1/2 kinase tier, which activates LATS1/2 kinases
  through scaffolded phosphorylation. Active LATS1/2 phosphorylate YAP/TAZ,
  causing cytoplasmic retention or degradation and suppressing TEAD-dependent
  transcription. When the kinase cassette is inactive, YAP/TAZ enter the
  nucleus and coactivate TEAD transcription factors. The LATS-YAP/TAZ-TEAD core
  is conserved, but the program it controls is not. In flies and mammals
  YAP/TAZ-TEAD drives proliferation and tissue growth. In C. elegans the same
  core (WTS-1, YAP-1, EGL-44) is used for non-proliferative functions: WTS-1
  restraint of YAP-1/EGL-44 maintains apicobasal polarity of the larval
  intestine, and YAP-1/EGL-44 induces immune genes after gut-barrier damage,
  an activation that does not go through the Hippo kinases. The module is grounded in
  GO:0035329, with PAINT anchors for the MST, LATS, YAP/TAZ and TEAD tiers where
  local seed rows support the roles. Human and C. elegans members are given as
  representatives of the LATS, YAP/TAZ and TEAD tiers.
status: DRAFT
evidence:
  - source_id: GO:0035329
    title: hippo signaling
    statement: The module is grounded in the GO biological process term for Hippo signaling.
  - source_id: PMID:31358532
    statement: >-
      The LATS-to-YAP-to-TEAD core is conserved in C. elegans, where WTS-1 (LATS),
      YAP-1 (YAP/Yorkie) and EGL-44 (TEAD/Scalloped) act downstream of NFM-1
      (NF2/Merlin) to maintain apicobasal polarity of the larval intestine; worm
      WTS-1, YAP-1 and EGL-44 are therefore given as representative members of the
      LATS, YAP/TAZ and TEAD tiers.
    supporting_text: >-
      we have delineated the conserved Hippo pathway in C. elegans consisting of
      NFM-1-WTS-1-YAP-1-EGL-44
  - source_id: PMID:41746831
    statement: >-
      In C. elegans the WTS-1/YAP-1/EGL-44 core is needed for larval development
      but controls non-proliferative outputs rather than growth, so the output
      program of the module is lineage-specific.
    supporting_text: >-
      YAP-1/EGL-44 outputs are repurposed from the conventional association
      with growth control to nonproliferative developmental functions.
  - source_id: PMID:32857822
    statement: >-
      In the C. elegans intestine YAP-1 is also activated, through PP2A, when the
      gut barrier is breached, independently of the Hippo kinase cassette; the
      kinase tiers of this module are then not the regulators of the output.
    supporting_text: >-
      activation of YAP-1/YAP was independent of the Hippo pathway during disruption
