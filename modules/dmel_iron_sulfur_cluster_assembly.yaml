notes: >-
  Boundary. The module joins five FlyBase groups: the general Fe-S cluster assembly group
  (FESCA) and the four complex groups NIAUF (core ISC complex), ISA, CIA-SCAF and CTC. Every
  FESCA member is placed in one step. Fly subunit roles follow orthology to the human and
  yeast ISC and CIA proteins (for example bcn92 = Isd11/LYRM4, CG8043 = IBA57, CG13667 = NDOR1,
  CG17683 = CIAO3/NARFL, galla2 = CIAO2B); most have not been studied directly in flies. Molecular
  functions are given only to Nfs1, Fdx1, dare and Abcb7, whose activities are well conserved;
  the scaffold and carrier proteins have no clean catalytic activity. ND-ACP is also part
  of mitochondrial fatty acid synthesis (dmel_mitochondrial_fatty_acid_synthesis) and of respiratory
  complex I. The exact sulfur-containing compound exported by Abcb7 is not known. MagR has
  also been proposed as a magnetoreceptor; that proposal is not modelled. FlyBase groups realized
  by this module: NIAUF (FBgg0001989), ISA (FBgg0002072), CIA-SCAF (FBgg0002074), CTC (FBgg0002075),
  FESCA (FBgg0002125). Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_iron_sulfur_cluster_assembly.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
