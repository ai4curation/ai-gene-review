id: MODULE:dmel_iron_sulfur_cluster_assembly
title: Mitochondrial and cytosolic iron-sulfur cluster assembly in Drosophila melanogaster
description: >-
  Iron-sulfur (Fe-S) clusters are cofactors of respiratory complexes, the TCA cycle, DNA replication
  and repair enzymes and many other proteins. In eukaryotes all clusters depend on the mitochondrial
  iron-sulfur cluster (ISC) machinery. In the matrix, the cysteine desulfurase Nfs1, stabilised
  by Isd11 (bcn92) and acyl-ND-ACP, supplies sulfur and frataxin (fh) stimulates assembly
  of a [2Fe-2S] cluster on the scaffold IscU, with electrons from ferredoxin (Fdx1) and ferredoxin
  reductase (dare). The Hsc20-Hsc70-5 chaperone pair with glutaredoxin 5 transfers the cluster
  to client proteins, and the ISA proteins (MagR, CG13623) with IBA57 (CG8043) convert [2Fe-2S]
  into [4Fe-4S] clusters for mitochondrial targets. A sulfur-containing compound made by the
  ISC machinery is exported by the ABC transporter Abcb7 and used by the cytosolic iron-sulfur
  protein assembly (CIA) system: the diflavin reductase CG13667 and anamorsin (Ciapin1) supply
  electrons, the Nubp1-Nubp2 scaffold builds [4Fe-4S] clusters, and the CIA targeting complex
  (Ciao1, CG17683, galla2 and Mms19) inserts them into cytosolic and nuclear apoproteins.
status: DRAFT
scope: CONCRETE
