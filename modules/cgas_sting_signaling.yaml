id: MODULE:cgas_sting_signaling
title: cGAS-STING nucleic-acid sensing signaling pathway module
description: A cGAS or cGAS-like receptor detects cytosolic nucleic acid and synthesises a
  cyclic-dinucleotide second messenger that activates the ER adaptor STING; activated STING
  traffics to the ERGIC/Golgi and engages TBK1-family kinase signalling, which drives an innate
  immune transcriptional output. In vertebrates cGAS senses double-stranded DNA and the output
  is IRF3-dependent type I interferon; in Drosophila cGLR1 senses double-stranded RNA and the
  output is the NF-kappaB factor Relish.
status: DRAFT
evidence:
  - source_id: GO:0140896
    title: cGAS/STING signaling pathway
    statement: The module is grounded in the GO biological process term for the cGAS/STING
      signaling pathway.
  - source_id: gomodel:64c3044100001129
    title: cGAS-STING signaling in the cytosol (Human)
    statement: >-
      Production human GO-CAM (cached under gocams/64c3044100001129/) modelling the canonical
      cytosolic axis: CGAS dsDNA binding (GO:0003690), CGAS molecular condensate scaffold
      activity (GO:0140693), CGAS 2',3'-cyclic GMP-AMP synthase activity (GO:0061501), STING1
      signaling adaptor activity (GO:0035591), and TBK1 protein serine/threonine kinase activity
      (GO:0004674) driving positive regulation of type I interferon production (GO:0032481).
  - source_id: gomodel:5f46c3b700001570
    title: SPModule TBK1-IRF3 (Human)
    statement: >-
      Production human GO-CAM (cached under gocams/5f46c3b700001570/) modelling TBK1 kinase
      activity acting on IRF3, whose DNA-binding transcription activator activity (GO:0001216)
      and sequence-specific DNA binding (GO:0043565) drive the interferon transcriptional output.
  - source_id: gomodel:613aae0000000040
    title: cGAS-Sting pathway (Drosophila)
    statement: >-
      Production Drosophila GO-CAM (cached under gocams/613aae0000000040/) modelling cGlr1
      double-stranded RNA binding (GO:0003725) and 3',2'-cyclic GMP-AMP synthase activity
      (GO:0140700), cGlr2 cyclic GMP-AMP synthase activities, Sting 2',3'- and 3',2'-cyclic
      GMP-AMP binding (GO:0061507, GO:0140704), and Relish RNA polymerase II-specific
      DNA-binding transcription factor activity (GO:0000981) in defense response to virus
      (GO:0051607). It grounds the Drosophila variants and representatives.
  - source_id: PMID:34965418
    title: Orally acquired cyclic dinucleotides drive dSTING-dependent antiviral immunity in enterocytes.
    statement: >-
      Cached full text reports that protection conferred by orally acquired bacterial cyclic
      dinucleotides in Drosophila is dSTING- and dTBK1-dependent and leads to NF-kappaB-dependent
      gene expression; grounds fly IKKepsilon (dTBK1) as the Drosophila representative of the
      STING-engaged kinase role.
  - source_id: PANTHER:PTHR34339
    title: STIMULATOR OF INTERFERON GENES PROTEIN (STING family)
    statement: >-
      Local PANTHER family for STING; grounds the animal-spanning STING adaptor exemplars
      (human Q86WV6, zebrafish E7F4N7, Drosophila A0A0B4LFY9, Pacific oyster P0DUE1,
      Nematostella A7SLZ2, Stylophora coral A0A2B4SJD2). Accessions taken from the family's
      cached InterPro/PANTHER member list.
  - source_id: PANTHER:PTHR10656
    title: ITPRIP/mab-21 nucleotidyltransferase (cGAS/cGLR-containing family)
    statement: >-
      Local PANTHER family containing vertebrate cGAS (subfamily SF35) and the invertebrate
      cGAS-like receptors (cGLRs; subfamily SF42) used as the cGAS/cGLR sensor exemplars
      (human Q8N884, Drosophila A1ZA55/A8DYP7, Nematostella A7SFB5, Hydra A0A8B6XWW9). The
      family also contains non-immune Mab-21/ITPRIP members, so it is cited as the containing
      family rather than asserted as the sensor role's grounding term.
  - source_id: PANTHER:PTN000540338
    title: PAINT node PTN000540338 for TBK1
    statement: Local PAINT IBD node in PTHR22969 with propagated terms P:GO:0002218,
      P:GO:0032481; TBK1 (UniProtKB:Q9UHD2) appears among the IBD seeds; PAINT date 20240321.
  - source_id: PANTHER:PTN001491808
    title: PAINT node PTN001491808 for TBK1
    statement: Local PAINT IBD node in PTHR22969 with propagated terms C:GO:0005737,
      F:GO:0004674; TBK1 (UniProtKB:Q9UHD2) appears among the IBD seeds; PAINT date 20260601.
notes: >-
  Curated compact signaling-pathway module for the cytosolic DNA-sensing cGAS-STING axis,
  grounded in verified human UniProt exemplar accessions (CGAS Q8N884, STING1 Q86WV6, TBK1
  Q9UHD2, IRF3 Q14653), GO molecular-function/process terms confirmed against the cached
  production GO-CAM gomodel:64c3044100001129, and local PAINT IBD rows for TBK1. The IRF3-centred
  type I interferon output is the modelled effector branch; STING1's post-Golgi NF-kappaB branch
  is real but is left as context (see description) rather than modelled as a core step. TBK1 is
  grounded as a PANTHER family (PTHR22969) with PTN anchors because TBK1's accession appears in
  the local IBD seed rows; the other members are grounded by verified UniProt exemplar accessions.
  Animal-spanning exemplars are attached to the deeply conserved roles: the STING receptor and
  adaptor (PANTHER PTHR34339: human, zebrafish, Drosophila, Pacific oyster, Nematostella and
  Stylophora coral, i.e. vertebrate through cnidarian) and the cGAS/cGLR cyclic-dinucleotide
  synthase (PANTHER PTHR10656: human cGAS plus Drosophila, Nematostella and Hydra cGAS-like
  receptors). Every leaf role has a human representative and a Drosophila representative, either
  as a family representative member or as a Drosophila variant. The TBK1-family kinase role
  carries human TBK1 and fly IKKepsilon (dTBK1, FBgn0086657), which is an IBD seed of PAINT node
  PTN000540338 alongside human TBK1 and is required for dSTING-dependent antiviral gene expression
  (PMID:34965418); fly IKKbeta also acts downstream of dSTING (PMID:30119996) but is not modelled.
  The kinase annoton therefore asserts only the shared process (activation of innate immune
  response) and leaves type I interferon production to the vertebrate IRF3 variant. Two steps
  have no homologous fly counterpart and are modelled as variant sets instead of forcing a fly
  gene onto a human function: ligand sensing (vertebrate cGAS binds dsDNA; Drosophila cGLR1 binds
  dsRNA, and neither fly cGLR carries a DNA-binding annotation) and the effector transcription
  factor (vertebrate IRF3; Drosophila has no protein with the IRF DNA-binding domain, InterPro
  IPR001346, and uses the NF-kappaB factor Relish). The output variant set allows more than one
  branch because vertebrate STING also activates NF-kappaB; that vertebrate NF-kappaB branch is
  not modelled. All exemplar accessions were taken from the cached InterPro/PANTHER member lists
  or verified in UniProt. No provider deep-research report was generated for this module;
  structural claims rest on the GO-CAM models, GO terms, PANTHER families, PAINT rows, and cached
  papers cited above.
module:
  id: cgas_sting_signaling
  label: cGAS-STING nucleic-acid sensing signaling pathway
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: cGAS/STING signaling pathway
      term:
        id: GO:0140896
        label: cGAS/STING signaling pathway
      description: Cytosolic nucleic acid is sensed by cGAS or a cGAS-like receptor, which makes a
        cyclic dinucleotide to activate STING; STING engages TBK1-family kinase signalling that
        drives IRF3-dependent type I interferon in vertebrates and Relish-dependent NF-kappaB
        output in Drosophila.
  context:
    taxa:
      - preferred_term: metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
      - preferred_term: endoplasmic reticulum
        term:
          id: GO:0005783
          label: endoplasmic reticulum
      - preferred_term: Golgi apparatus
        term:
          id: GO:0005794
          label: Golgi apparatus
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: cytosolic nucleic-acid sensing and second messenger synthesis
      node:
        id: nucleic_acid_sensing
        label: cGAS/cGLR nucleic-acid sensing and cyclic-dinucleotide synthesis
        module_type: REGULATORY_STEP
        description: A cGAS or cGAS-like receptor binds its cytosolic nucleic-acid ligand and
          catalyses synthesis of a cyclic-dinucleotide second messenger from ATP and GTP. The
          ligand differs by lineage and is modelled as a variant set; the synthase activity is
          shared.
        variant_sets:
          - id: ligand_sensing_variants
            label: Nucleic-acid ligand sensing variants
            axis: ligand / taxon
            selection: ONE_OR_MORE
            notes: >-
              Vertebrate cGAS binds double-stranded DNA; Drosophila cGLR1 binds double-stranded
              RNA. Neither fly cGLR carries a DNA-binding annotation, so the vertebrate dsDNA
              function is not assigned a fly representative. The ligand of fly cGLR2 is not
              established and is not modelled here.
            variants:
              - id: vertebrate_dsdna_sensing
                label: Vertebrate cGAS double-stranded DNA sensing
                module_type: REGULATORY_STEP
                description: cGAS recognises cytosolic double-stranded DNA in a
                  sequence-independent manner and forms liquid-like condensates, the licensing
                  event for its catalytic activation.
                context:
                  taxa:
                    - preferred_term: vertebrates
                      term:
                        id: NCBITaxon:7742
                        label: Vertebrata <vertebrates>
                annotons:
                  - id: cgas_dsdna_sensor
                    label: cGAS double-stranded DNA sensor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CGAS
                        term:
                          id: UniProtKB:Q8N884
                          label: Cyclic GMP-AMP synthase (cGAMP synthase) (cGAS) (EC 2.7.7.86)
                            (2'3'-cGAMP synthase) (Mab-21 domain-containing protein 1)
                    function:
                      preferred_term: double-stranded DNA binding
                      term:
                        id: GO:0003690
                        label: double-stranded DNA binding
                      description: cGAS recognises cytosolic double-stranded DNA in a
                        sequence-independent manner, the licensing event for its catalytic
                        activation.
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    gocam_associations:
                      - model: gomodel:64c3044100001129
                        activity: gomodel:64c3044100001129/64c3044100001225
                        title: cGAS-STING signaling in the cytosol (Human)
                    role_description: Exemplar for the vertebrate cytosolic dsDNA sensor role
                      in the cGAS-STING pathway.
              - id: drosophila_dsrna_sensing
                label: Drosophila cGLR1 double-stranded RNA sensing
                module_type: REGULATORY_STEP
                description: Drosophila cGAS-like receptor 1 binds long double-stranded RNA, which
                  activates its synthesis of 3',2'-cGAMP for dSTING.
                context:
                  taxa:
                    - preferred_term: Drosophila melanogaster
                      term:
                        id: NCBITaxon:7227
                        label: Drosophila melanogaster
                annotons:
                  - id: cglr1_dsrna_sensor
                    label: cGLR1 double-stranded RNA sensor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: cGlr1
                        term:
                          id: UniProtKB:A1ZA55
                          label: Cyclic GMP-AMP synthase-like receptor 1
                    function:
                      preferred_term: double-stranded RNA binding
                      term:
                        id: GO:0003725
                        label: double-stranded RNA binding
                      description: cGLR1 recognises long double-stranded RNA, the licensing event
                        for its cyclic-dinucleotide synthase activity.
                    processes:
                      - preferred_term: response to exogenous dsRNA
                        term:
                          id: GO:0043330
                          label: response to exogenous dsRNA
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    gocam_associations:
                      - model: gomodel:613aae0000000040
                        activity: gomodel:613aae0000000040/613aae0000000203
                        title: cGAS-Sting pathway (Drosophila)
                    role_description: Exemplar for the Drosophila cytosolic dsRNA sensor role in
                      the cGAS-STING pathway.
        annotons:
          - id: cgas_cgamp_synthase
            label: cGAS/cGLR cyclic-dinucleotide synthase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: cGAS / cGAS-like nucleotidyltransferase (cGLR) sensor
                description: >-
                  The cyclic-dinucleotide-synthesising second-messenger role is conserved across
                  animals as the cGAS/cGLR clade within the Mab-21 nucleotidyltransferase family
                  (PANTHER PTHR10656). Vertebrate cGAS (subfamily SF35) senses dsDNA and makes
                  2'3'-cGAMP, whereas invertebrate cGAS-like receptors (cGLRs; subfamily SF42)
                  sense diverse ligands (e.g. dsRNA) and make other cyclic dinucleotides such as
                  3'2'-cGAMP; the family term is left unasserted because no single PANTHER
                  family/subfamily id cleanly circumscribes the immune cGAS+cGLR sensors across
                  animals (SF35 and SF42 are paralogous subfunctions).
                representative_members:
                  - preferred_term: CGAS (human, vertebrate cGAS; SF35)
                    term:
                      id: UniProtKB:Q8N884
                      label: Cyclic GMP-AMP synthase (cGAMP synthase) (cGAS) (EC 2.7.7.86)
                        (2'3'-cGAMP synthase) (Mab-21 domain-containing protein 1)
                  - preferred_term: cGlr1 (Drosophila cGAS-like receptor 1; SF42)
                    term:
                      id: UniProtKB:A1ZA55
                      label: Cyclic GMP-AMP synthase-like receptor 1
                  - preferred_term: cGlr2 (Drosophila cGAS-like receptor 2; SF42)
                    term:
                      id: UniProtKB:A8DYP7
                      label: Cyclic GMP-AMP synthase-like receptor 2
                  - preferred_term: cGAS/cGLR (Nematostella vectensis, cnidarian; SF42)
                    term:
                      id: UniProtKB:A7SFB5
                      label: Cyclic GMP-AMP synthase
                  - preferred_term: cGLR (Hydra vulgaris, cnidarian; SF42)
                    term:
                      id: UniProtKB:A0A8B6XWW9
                      label: Cyclic GMP-AMP synthase-like receptor
            function:
              preferred_term: 2',3'-cyclic GMP-AMP synthase activity
              term:
                id: GO:0061501
                label: 2',3'-cyclic GMP-AMP synthase activity
              description: Ligand-activated cGAS/cGLR synthesises a diffusible cyclic-dinucleotide
                second messenger; the vertebrate cGAS activity shown here (GO:0061501) makes
                2'3'-cGAMP from GTP and ATP, while invertebrate cGLRs make related cyclic
                dinucleotides such as 3'2'-cGAMP.
              substrates:
                - preferred_term: GTP
                  term:
                    id: CHEBI:15996
                    label: GTP
                - preferred_term: ATP
                  term:
                    id: CHEBI:15422
                    label: ATP
              products:
                - preferred_term: 2',3'-cGAMP
                  term:
                    id: CHEBI:75947
                    label: 2'-3'-cGAMP
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            gocam_associations:
              - model: gomodel:64c3044100001129
                activity: gomodel:64c3044100001129/64c3044100001189
                title: cGAS-STING signaling in the cytosol (Human)
            role_description: Exemplar for the second-messenger synthase role in the cGAS-STING
              pathway; its cyclic GMP-AMP product is the ligand that activates STING.
    - order: 2
      role: sting activation and er-to-golgi trafficking
      node:
        id: sting_activation
        label: STING activation and ER-to-Golgi trafficking
        module_type: REGULATORY_STEP
        description: STING in the ER membrane binds the cyclic-dinucleotide second messenger,
          oligomerises, exits the ER to the ERGIC and Golgi, and serves as the signalling adaptor
          that engages TBK1-family kinase signalling.
        annotons:
          - id: sting_cgamp_receptor
            label: STING cyclic GMP-AMP receptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: STING cyclic-dinucleotide receptor family/ortholog group
                term:
                  id: PANTHER:PTHR34339
                  label: STIMULATOR OF INTERFERON GENES PROTEIN
                description: >-
                  Human STING1 binds 2',3'-cGAMP with high affinity. Drosophila Sting carries a
                  curated IDA annotation for 2',3'-cGAMP binding and mounts a Sting-dependent
                  antiviral response to it in vivo (PMID:33262294), but its preferred endogenous
                  ligand is 3',2'-cGAMP, the main
                  product of fly cGLR1; in a thermal-shift assay it formed a stable complex only
                  with 3',2'-cGAMP and showed diminished affinity for 2',3'-cGAMP (PMID:34261127).
                  The shared 2',3'-cGAMP binding term is used because GO:0140704 3',2'-cyclic
                  GMP-AMP binding is not currently placed under GO:0140702 cyclic GMP-AMP binding,
                  so no single parent term covers both ligands.
                representative_members:
                  - preferred_term: STING1 (human)
                    term:
                      id: UniProtKB:Q86WV6
                      label: Stimulator of interferon genes protein (hSTING) (Endoplasmic reticulum
                        interferon stimulator) (ERIS) (Mediator of IRF3 activation) (hMITA)
                        (Transmembrane protein 173)
                  - preferred_term: Sting (Drosophila melanogaster)
                    term:
                      id: UniProtKB:A0A0B4LFY9
                      label: Stimulator of interferon genes protein homolog
            function:
              preferred_term: 2',3'-cyclic GMP-AMP binding
              term:
                id: GO:0061507
                label: 2',3'-cyclic GMP-AMP binding
              description: STING is the intracellular receptor for cGAS/cGLR-derived cyclic
                GMP-AMP; ligand binding closes the ligand-binding domain and drives higher-order
                oligomerisation. Ligand preference differs by lineage, with 2',3'-cGAMP in
                vertebrates and 3',2'-cGAMP in Drosophila.
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            gocam_associations:
              - model: gomodel:613aae0000000040
                activity: gomodel:613aae0000000040/613aae0000000211
                title: cGAS-Sting pathway (Drosophila)
            role_description: Exemplar for the cyclic-dinucleotide receptor role in the
              cGAS-STING pathway.
          - id: sting_signaling_adaptor
            label: STING signaling adaptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: STING signaling adaptor family/ortholog group
                term:
                  id: PANTHER:PTHR34339
                  label: STIMULATOR OF INTERFERON GENES PROTEIN
                description: >-
                  STING is deeply conserved across animals, from cnidarians through insects and
                  molluscs to vertebrates, marking the cGAS-STING sensor-adaptor axis as
                  pre-bilaterian. The IRF3-type I interferon output is a vertebrate elaboration;
                  in Drosophila activated STING signals to the NF-kappaB factor Relish. Both
                  outputs are modelled as variants of the final step.
                representative_members:
                  - preferred_term: STING1 (human, vertebrate)
                    term:
                      id: UniProtKB:Q86WV6
                      label: Stimulator of interferon genes protein (hSTING) (Endoplasmic reticulum
                        interferon stimulator) (ERIS) (Mediator of IRF3 activation) (hMITA)
                        (Transmembrane protein 173)
                  - preferred_term: sting1 (zebrafish, teleost)
                    term:
                      id: UniProtKB:E7F4N7
                      label: Stimulator of interferon genes protein
                  - preferred_term: Sting (Drosophila melanogaster, insect)
                    term:
                      id: UniProtKB:A0A0B4LFY9
                      label: Stimulator of interferon genes protein homolog
                  - preferred_term: STING (Magallana gigas, Pacific oyster; mollusc)
                    term:
                      id: UniProtKB:P0DUE1
                      label: Stimulator of interferon genes protein
                  - preferred_term: STING (Nematostella vectensis, sea anemone; cnidarian)
                    term:
                      id: UniProtKB:A7SLZ2
                      label: Stimulator of interferon genes protein
                  - preferred_term: STING1 (Stylophora pistillata, coral; cnidarian)
                    term:
                      id: UniProtKB:A0A2B4SJD2
                      label: Stimulator of interferon genes protein 1
            function:
              preferred_term: signaling adaptor activity
              term:
                id: GO:0035591
                label: signaling adaptor activity
              description: Oligomerised STING traffics to the ERGIC/Golgi and acts as the
                signalling scaffold for TBK1-family kinase signalling; in vertebrates its
                phosphorylated C-terminal tail recruits TBK1 and serves as an IRF3 docking site.
            locations:
              - preferred_term: Golgi apparatus
                term:
                  id: GO:0005794
                  label: Golgi apparatus
            gocam_associations:
              - model: gomodel:64c3044100001129
                activity: gomodel:64c3044100001129/64c3044100001130
                title: cGAS-STING signaling in the cytosol (Human)
            role_description: Exemplar for the central signalling-adaptor role in the cGAS-STING
              pathway.
    - order: 3
      role: tbk1 recruitment and kinase activation
      node:
        id: tbk1_activation
        label: TBK1-family kinase recruitment and activation
        module_type: REGULATORY_STEP
        description: A TBK1-family kinase is engaged by activated STING. In vertebrates TBK1 is
          recruited to oligomerised STING1, trans-autophosphorylates on Ser172, phosphorylates the
          STING1 C-terminal tail, and then phosphorylates IRF3. In Drosophila the TBK1 ortholog
          IKKepsilon (dTBK1) is required for STING-dependent, NF-kappaB-dependent antiviral gene
          expression, and IKKbeta also acts downstream of dSTING.
        annotons:
          - id: tbk1_kinase
            label: TBK1/IKKepsilon kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TBK1/IKK-related kinase family/ortholog group
                term:
                  id: PANTHER:PTHR22969
                  label: IKB KINASE
                representative_members:
                  - preferred_term: TBK1 (human)
                    term:
                      id: UniProtKB:Q9UHD2
                      label: Serine/threonine-protein kinase TBK1 (EC 2.7.11.1)
                        (NF-kappa-B-activating kinase) (T2K) (TANK-binding kinase 1)
                  - preferred_term: IKKepsilon / ik2 / dTBK1 (Drosophila melanogaster)
                    term:
                      id: UniProtKB:Q9V3Y8
                      label: I-kappaB kinase epsilon, isoform B
                    evidence:
                      - source_id: PMID:34965418
                        statement: Protection by orally acquired bacterial cyclic dinucleotides
                          is dSTING- and dTBK1-dependent and leads to NF-kappaB-dependent gene
                          expression.
                      - source_id: PANTHER:PTN000540338
                        statement: Fly IKKepsilon (FB:FBgn0086657) is an IBD seed of this TBK1
                          node together with human TBK1 for activation of innate immune response.
                ancestral_nodes:
                  - preferred_term: PAINT node PTN000540338 for TBK1
                    term:
                      id: PANTHER:PTN000540338
                      label: PTN000540338
                    description: Local PAINT IBD node in PTHR22969 with propagated terms
                      P:GO:0002218, P:GO:0032481; PAINT date 20240321.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000540338 in PTHR22969.
                  - preferred_term: PAINT node PTN001491808 for TBK1
                    term:
                      id: PANTHER:PTN001491808
                      label: PTN001491808
                    description: Local PAINT IBD node in PTHR22969 with propagated terms
                      C:GO:0005737, F:GO:0004674; PAINT date 20260601.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN001491808 in PTHR22969.
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              description: STING-engaged TBK1-family kinase activity couples adaptor activation
                to the innate immune transcriptional output. The listed targets are the
                characterised human TBK1 substrates; the direct substrates of fly IKKepsilon in
                this pathway are not established.
              targets:
                - preferred_term: STING1
                  term:
                    id: UniProtKB:Q86WV6
                    label: Stimulator of interferon genes protein (STING1)
                - preferred_term: IRF3
                  term:
                    id: UniProtKB:Q14653
                    label: Interferon regulatory factor 3 (IRF-3)
            processes:
              - preferred_term: activation of innate immune response
                term:
                  id: GO:0002218
                  label: activation of innate immune response
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            gocam_associations:
              - model: gomodel:64c3044100001129
                activity: gomodel:64c3044100001129/64c3044100001139
                title: cGAS-STING signaling in the cytosol (Human)
            role_description: Exemplar for the STING-engaged effector kinase role in the
              cGAS-STING pathway. Type I interferon production is asserted on the vertebrate IRF3
              variant rather than here, because Drosophila has no interferons.
    - order: 4
      role: innate immune transcriptional output
      node:
        id: transcriptional_output
        label: Innate immune transcriptional output
        module_type: REGULATORY_STEP
        description: The STING-engaged kinase activates an effector transcription factor that
          induces antiviral gene expression. The effector differs by lineage and is modelled as
          a variant set.
        variant_sets:
          - id: effector_transcription_factor_variants
            label: Effector transcription factor variants
            axis: transcription factor family / taxon
            selection: ONE_OR_MORE
            notes: >-
              Vertebrates use IRF3 to induce type I interferon. Drosophila has no protein with the
              IRF DNA-binding domain (InterPro IPR001346) and uses the NF-kappaB factor Relish,
              which occupies the same position but is not homologous to IRF3. More than one
              variant can apply because vertebrate STING also activates NF-kappaB; that
              vertebrate NF-kappaB branch is not modelled here.
            variants:
              - id: vertebrate_irf3_ifn_induction
                label: Vertebrate IRF3 activation and type I interferon induction
                module_type: REGULATORY_STEP
                description: TBK1-phosphorylated IRF3 dimerises, translocates to the nucleus, and
                  drives transcription of type I interferon genes.
                context:
                  taxa:
                    - preferred_term: vertebrates
