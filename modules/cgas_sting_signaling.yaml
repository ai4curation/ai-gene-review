    - order: 4
      role: irf3 activation and type i interferon induction
      node:
        id: irf3_ifn_induction
        label: IRF3 activation and type I interferon induction
        module_type: REGULATORY_STEP
        description: TBK1-phosphorylated IRF3 dimerises, translocates to the nucleus, and drives
          transcription of type I interferon genes.
        annotons:
          - id: irf3_transcription_factor
            label: IRF3 transcription activator
            participant:
