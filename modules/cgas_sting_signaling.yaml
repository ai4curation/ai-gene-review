              gene_product:
                preferred_term: IRF3
                term:
                  id: UniProtKB:Q14653
                  label: Interferon regulatory factor 3 (IRF-3)
            function:
              preferred_term: DNA-binding transcription activator activity
              term:
                id: GO:0001216
                label: DNA-binding transcription activator activity
              description: Phosphorylated, dimerised IRF3 binds interferon-stimulated response
                elements and activates transcription of type I interferon genes.
            processes:
              - preferred_term: positive regulation of type I interferon production
                term:
                  id: GO:0032481
                  label: positive regulation of type I interferon production
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            gocam_associations:
              - model: gomodel:5f46c3b700001570
                activity: gomodel:5f46c3b700001570/5f46c3b700001582
                title: SPModule TBK1-IRF3 (Human)
            role_description: Exemplar for the terminal transcription-factor role that produces
              the type I interferon output of the cGAS-STING pathway.
  connections:
    - source: cgas_dna_sensing
      target: sting_activation
      connection_type: CAUSES
      description: cGAS-synthesised 2'3'-cGAMP diffuses to and activates the STING1 adaptor.
    - source: sting_activation
      target: tbk1_activation
      connection_type: CAUSES
      description: Oligomerised, trafficked STING1 recruits and activates TBK1.
    - source: tbk1_activation
