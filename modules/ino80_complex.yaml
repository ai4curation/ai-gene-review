id: MODULE:ino80_complex
title: Human INO80 chromatin remodeling complex — INO80 Snf2 ATPase with the RUVBL1-RUVBL2, ARP5-IES6 and IES2 motor module, the ARP4-ARP8-actin-YY1 HSA module and the metazoan NFRKB-UCHL5 module; INO80/INO80B-E/ACTR5/ACTR8/ACTL6A/ACTB/RUVBL1/RUVBL2/YY1/NFRKB/MCRS1/UCHL5/TFPT
description: >-
  The human INO80 complex is an ATP-dependent chromatin remodeler of the INO80
  subfamily of SNF2 ATPases that slides nucleosomes. Its catalytic subunit
  INO80 is a scaffold whose separate domains assemble three modules. The
  Snf2-type ATPase domain, with its large insertion enclosed by a
  RUVBL1-RUVBL2 AAA+ heterohexamer, the ARP5-IES6 (ACTR5-INO80C) pair and IES2
  (INO80B), forms the motor module: the ATPase translocates DNA, ARP5-IES6
  grips the nucleosome on the opposite face and couples ATP hydrolysis to
  sliding, and IES2 stimulates the ATPase. The helicase-SANT-associated (HSA)
  and post-HSA region binds the actin-related proteins ARP4 (ACTL6A) and ARP8
  (ACTR8), nuclear actin and the zinc-finger protein YY1; ARP8 binds
  nucleosomes and YY1 binds Holliday-junction DNA. The INO80 N terminus binds
  a metazoan-specific module of NFRKB, MCRS1, TFPT, INO80D, INO80E and the
  deubiquitinase UCHL5, which is held inactive in the complex; this module is
  not required for nucleosome remodeling. INO80 positions nucleosomes at
  promoters and acts in transcription regulation, DNA double-strand break
  repair and replication-fork progression; those roles, and the other
  complexes that share RUVBL1/2, ACTL6A and actin (SRCAP, TIP60/p400, BAF), are
  context for this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001339
    title: chromatin remodeling pathway
    statement: >-
      RGD's chromatin remodeling pathway names INO80 (SWR1) as one of four
      SNF2-family remodeler groups and draws an INO80 complex node that
      positively affects gene expression and the cell cycle checkpoint pathway;
      the project models one human module per complex group and this module
      models the INO80 complex. Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0001339.yaml).
  - source_id: GO:0006338
    title: chromatin remodeling
    statement: >-
      skos:closeMatch for PW:0001339 in the project seed (PW definition xref and
      lexical match). It is carried as the process of the INO80 ATPase annoton;
      the module itself is typed by the complex term Ino80 complex.
  - source_id: GO:0031011
    title: Ino80 complex
    statement: >-
      GO term grounding the module. Every modelled subunit except ACTB has an
      IDA Ino80 complex row in human GOA (PMID:21303910 for all of them, and
      PMID:18026119 or PMID:18922472 for several).
  - source_id: PMID:16230350
    title: A mammalian chromatin remodeling complex with similarities to the yeast INO80 complex.
    statement: >-
      Purification of the human INO80 complex: orthologues of 8 of the 15 yeast
      INO80 subunits plus metazoan-specific subunits, with DNA- and
      nucleosome-activated ATPase activity and ATP-dependent nucleosome sliding.
    supporting_text: similar to the yeast INO80 complex, the hINO80 complex exhibits DNA- and nucleosome-activated ATPase activity and catalyzes ATP-dependent nucleosome sliding.
  - source_id: PMID:21303910
    title: 'Subunit organization of the human INO80 chromatin remodeling complex: an evolutionarily conserved core complex catalyzes ATP-dependent nucleosome remodeling.'
    statement: >-
      The human complex comprises three modules assembled on three domains of
      INO80; this is the architecture used for the parts.
    supporting_text: we present evidence that the human INO80 complex is composed of three modules that assemble with three distinct domains of the hIno80 ATPase.
  - source_id: PMID:29643506
    title: Structure and regulation of the human INO80-nucleosome complex.
    statement: >-
      Cryo-EM of the human INO80 core bound to a nucleosome places the RUVBL1-2
      hexamer around the motor-domain insertion and ARP5-IES6 on the opposite
      face of the nucleosome.
    supporting_text: The RUVBL1-2 heterohexamer encloses a large insertion in the C-terminal Ino80 motor domain
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001339 (chromatin remodeling
  pathway) through the RGD_PATHWAY_ONTOLOGY project (seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier
  related_module_only; mapped GO process chromatin remodeling,
  skos:closeMatch). RGD curates 74 human genes to PW:0001339 without a
  gene-linked diagram; the definition groups SNF2-family remodelers into four
  families (SWI/SNF, INO80/SWR1, ISWI, CHD) and the diagram draws separate
  complex nodes, including INO80, SRCAP and TRRAP/Tip60 for the INO80/SWR1
  family. The project models one human module per complex group; this
  module is the INO80 complex. Its 16 RGD genes (INO80 INO80B INO80C INO80D
  INO80E ACTR5 ACTR8 ACTL6A ACTB NFRKB MCRS1 UCHL5 TFPT YY1 RUVBL1 RUVBL2)
  are all modelled. The SRCAP and TIP60/p400 complexes, which share RUVBL1,
  RUVBL2, ACTL6A and actin, are drafted as separate modules; ACTR6, SRCAP,
  ZNHIT1, VPS72, YEATS4, EP400, TRRAP, KAT5 and the other TIP60 genes belong
  there, and the remaining RGD genes to the NuRD (nurd_complex), SWI/SNF and
  ISWI groups.

  Structure. The three parts are the three modules that assemble on three
  domains of INO80 in the human complex (PMID:21303910): (1) the Snf2 ATPase
  domain with IES2, IES6, RUVBL1/2 and ARP5; (2) the HSA/post-HSA region with
  ARP4, ARP8 and YY1, to which actin is added from the structural
  literature (PMID:29643506) and RGD; (3) the N terminus with the
  metazoan-specific subunits. Placement of the six metazoan-specific
  subunits in part 3 follows the module definition in PMID:21303910 (all
  metazoan-specific subunits) and their IDA Ino80 complex rows from that
  paper; the cached abstract does not name them individually, which is why
  their annotons carry no subunit-level quote. There are no human paralogue
  alternatives for any subunit, so no variant sets are used.

  Boundary decisions. (1) RUVBL1, RUVBL2, ACTL6A and ACTB are shared with
  SRCAP, TIP60/p400 and (ACTL6A, ACTB) BAF complexes, and RUVBL1/2 with R2TP;
  only their INO80 role is modelled. (2) YY1 is a subunit, not context,
  because it is part of the HSA module and required with the conserved
  subunits for remodeling by the core complex (PMID:21303910); its role as a
  sequence-specific transcription factor that targets INO80 is context, so
  the four-way junction DNA binding row from the YY1-INO80 paper
  (PMID:18026119) is used as its function rather than its DNA-binding
  transcription factor activity. (3) ACTB is included because RGD lists it
  and actin is an HSA-module subunit, but human GOA has no Ino80 complex row
  for it and the actin isoform in human INO80 is unassigned (ACTG1 is
  equally possible). (4) UCHL5 is modelled with its deubiquitinase activity
  (IDA), with the role description stating that it is latent within INO80;
  its proteasomal K48-linked chain trimming is outside the module. The
  module validator warns that the UCHL5 gene review core
  function (K48-linked deubiquitinase activity, on the proteasome) is more
  specific; the parent term is kept because linkage specificity has not been
  shown for INO80-bound UCHL5. (5) Yeast-specific subunits (the Nhp10 module
  and Ies1, Ies3, Ies4, Ies5) have no human orthologues in the complex. (6)
  INO80 roles in transcription regulation (promoter nucleosome positioning,
  Polycomb and pluripotency gene regulation), homologous recombination,
  DNA end resection, UV damage repair, replication-fork progression and
  checkpoint signalling are context, not parts; RGD's edge to the cell cycle
  checkpoint pathway is recorded here only as context. (7) Molecular
  functions come from experimental GOA rows (QuickGO, November 2026) except:
  INO80 remodeler activity is an authored refinement of its IDA
  ATP-dependent activity, acting on DNA row, supported by complex-level
  sliding assays; ARP5-IES6 nucleosomal DNA binding is the ACTR5 gene review
  core function; ACTR8 nucleosome binding is the ACTR8 gene review core
  function. INO80B, INO80C, INO80D, INO80E, TFPT, MCRS1, NFRKB, ACTL6A and
  ACTB are given no function because no experimental row describes their
  INO80 role. Gene reviews exist for ACTR5, ACTR8, ACTB and UCHL5.

  GO-CAM. No GO-CAM model in gocams/index.tsv contains an INO80 complex
  activity or any of INO80, INO80B-E, ACTR5, ACTR8, ACTL6A, NFRKB, MCRS1,
  TFPT, RUVBL1 or RUVBL2. YY1 appears only in a model of its phosphorylation
  by CK2 and caspase-7 cleavage in apoptosis, which is unrelated to INO80,
  and is not linked. The seed's best GO-CAM lead (617b481400000460, KAT5 in
  homologous recombination) overlaps the RGD list through TIP60-complex
  genes and is unrelated to INO80. No gocam_associations are recorded.

  Observations for upstream review. (a) INO80 lacks an experimental
  ATP-dependent chromatin remodeler activity row although PMID:16230350 and
  PMID:21303910 show nucleosome sliding by the purified complex; INO80 has
  it only by IEA. (b) ACTB has no Ino80 complex annotation while ACTL6A,
  ACTR5 and ACTR8 do. (c) RUVBL1 and RUVBL2 carry DNA helicase activity by
  IDA from early studies of the isolated proteins; it is not modelled here
  because no INO80 function depends on it, and ATP hydrolysis is the
  activity used. PANTHER family ids and PTNs
  are deliberately not asserted.
module:
  id: ino80_complex
  label: Human INO80 complex
  module_type: PROTEIN_COMPLEX
  description: >-
    INO80 Snf2 ATPase scaffold carrying a motor module (RUVBL1-RUVBL2, ARP5-IES6,
    IES2), an HSA module (ARP4, ARP8, actin, YY1) and a metazoan N-terminal
    module (NFRKB, UCHL5, MCRS1, TFPT, INO80D, INO80E).
  concepts:
    - preferred_term: Ino80 complex
      term:
        id: GO:0031011
        label: Ino80 complex
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: chromatin
        term:
          id: GO:0000785
          label: chromatin
  parts:
    - order: 1
      role: catalytic motor module (Snf2 ATPase, RUVBL1-RUVBL2, ARP5-IES6, IES2)
      node:
        id: ino80_motor_module
        label: INO80 motor module
        module_type: PROTEIN_COMPLEX
        description: >-
          The INO80 Snf2 ATPase domain with the RUVBL1-RUVBL2 hexamer, the
          ARP5-IES6 pair and IES2. Together with the HSA module this forms the
          evolutionarily conserved core that catalyses ATP-dependent nucleosome
          remodeling.
        evidence:
          - source_id: PMID:21303910
            statement: Remodeling is catalysed by the INO80 HSA/PTH and Snf2 ATPase domains with YY1 and the conserved subunits.
            supporting_text: ATP-dependent nucleosome remodeling by the hINO80 complex is catalyzed by a core complex comprising the hIno80 protein HSA/PTH and Snf2 ATPase domains acting in concert with YY1 and the complete set of its evolutionarily conserved subunits.
        annotons:
          - id: ino80_atpase
            label: INO80 ATP-dependent chromatin remodeler
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: INO80
                term:
                  id: UniProtKB:Q9ULG1
                  label: Chromatin-remodeling ATPase INO80
            function:
              preferred_term: ATP-dependent chromatin remodeler activity
              term:
                id: GO:0140658
                label: ATP-dependent chromatin remodeler activity
            processes:
              - preferred_term: chromatin remodeling
                term:
                  id: GO:0006338
                  label: chromatin remodeling
            role_description: >-
              Catalytic DNA translocase and scaffold of the complex. Human GOA
              has its parent ATP-dependent activity, acting on DNA (IDA,
              PMID:16298340) and ATP hydrolysis activity (EXP, PMID:21303910);
              the child remodeler term is used because the purified complex and
              its INO80-containing core slide nucleosomes (PMID:16230350,
              PMID:21303910). It is an authored refinement, also reached by an
              InterPro2GO IEA row.
          - id: ino80_ruvbl_hexamer
            label: RUVBL1-RUVBL2 AAA+ ATPase heterohexamer
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: RUVBL1-RUVBL2 heterohexamer
                active_units:
                  - id: ino80_ruvbl1
                    label: RUVBL1 (TIP49a)
                    role: AAA+ ATPase subunit of the hexamer around the Ino80 motor-domain insertion.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RUVBL1
                        term:
                          id: UniProtKB:Q9Y265
                          label: RuvB-like 1
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
                  - id: ino80_ruvbl2
                    label: RUVBL2 (TIP49b)
                    role: AAA+ ATPase subunit of the hexamer around the Ino80 motor-domain insertion.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RUVBL2
                        term:
                          id: UniProtKB:Q9Y230
                          label: RuvB-like 2
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
            role_description: >-
              Hexamer that encloses the insertion in the Ino80 motor domain and
              anchors IES2 and ARP5-IES6. ATP hydrolysis activity is EXP and IDA
              for both subunits in human GOA; their DNA helicase activity IDA rows
              are not used. RUVBL1/2 are also subunits of the SRCAP and TIP60/p400
              complexes and of R2TP; only the INO80 role is modelled here.
          - id: ino80_arp5_ies6
            label: ARP5-IES6 nucleosome grip
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: ARP5-IES6 (ACTR5-INO80C)
                active_units:
                  - id: ino80_actr5
                    label: ARP5 (ACTR5)
                    role: Actin-related protein that contacts nucleosomal DNA and H2A-H2B on the face opposite the motor.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ACTR5
                        term:
                          id: UniProtKB:Q9H9F9
                          label: Actin-related protein 5
                  - id: ino80_ino80c
                    label: IES6 (INO80C)
                    role: YL1-domain partner of ARP5.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: INO80C
                        term:
                          id: UniProtKB:Q6PI98
                          label: INO80 complex subunit C
            function:
              preferred_term: nucleosomal DNA binding
              term:
                id: GO:0031492
                label: nucleosomal DNA binding
            role_description: >-
              Grips the nucleosome opposite the motor and couples ATP hydrolysis
              to nucleosome sliding. The function is authored from the ACTR5 gene
              review core function (contributes_to nucleosomal DNA binding); there
              is no experimental molecular function row for ACTR5 or INO80C in
              human GOA.
            evidence:
              - source_id: PMID:29643506
                statement: ARP5-IES6 binds nucleosomes and couples ATPase to sliding.
                supporting_text: Arp5 binds to H2A/H2B dimers in solution and the Arp5-Ies6 complex binds to nucleosomes
              - source_id: PMID:29643506
                statement: Coupling of ATP hydrolysis to sliding.
                supporting_text: The Arp5-Ies6 subunits couple ATP hydrolysis to nucleosome sliding
          - id: ino80_ies2
            label: IES2 (INO80B) ATPase regulator
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: INO80B
                term:
                  id: UniProtKB:Q9C086
                  label: INO80 complex subunit B
            role_description: >-
              Tracks across the RUVBL1-2 hexamer toward the motor domains and
              stimulates the INO80 ATPase. No function is asserted: INO80B has no
              experimental molecular function row in human GOA, and GO has no
              specific activator term that its evidence would ground.
            evidence:
              - source_id: PMID:29643506
                statement: IES2 regulates INO80 ATPase activity.
                supporting_text: the Ies2 subunit regulates ATPase activity in both yeast and human INO80 complexes
    - order: 2
      role: HSA/post-HSA module (ARP4, ARP8, actin, YY1)
      node:
        id: ino80_hsa_module
        label: INO80 HSA module
        module_type: PROTEIN_COMPLEX
        description: >-
          The helicase-SANT-associated and post-HSA region of INO80 binds ARP4
          (ACTL6A), ARP8 (ACTR8) and actin, with YY1 in the same module. This
          module is required, with the motor module, for remodeling activity;
          it is not resolved in the human INO80-nucleosome structure.
        evidence:
          - source_id: PMID:29643506
            statement: Actin, ARP4 and ARP8 lie in the N-terminal (HSA) region missing from the cryo-EM structure.
            supporting_text: an obvious omission from our structure is the N-terminal region of the INO80 complex containing the actin, Arp4 and Arp8 subunits
        annotons:
          - id: ino80_actr8
            label: ARP8 (ACTR8) nucleosome binding
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ACTR8
                term:
                  id: UniProtKB:Q9H981
                  label: Actin-related protein 8
            function:
              preferred_term: nucleosome binding
              term:
                id: GO:0031491
                label: nucleosome binding
            role_description: >-
              Nucleosome-recognition subunit of the HSA module. The function is
              the ACTR8 gene review core function (a NEW annotation from the
              cited binding assays); human GOA has no experimental molecular
              function row for ACTR8.
            evidence:
              - source_id: PMID:22977180
                statement: Human ARP8 binds (H3-H4)2 and nucleosomes with high affinity.
                supporting_text: Our data show that Arp8 binds (H3–H4)2 with high affinity, and this property is to a large part responsible for its interaction with nucleosomes.
          - id: ino80_actl6a
            label: ARP4 (ACTL6A) HSA-bound actin-related protein
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ACTL6A
                term:
                  id: UniProtKB:O96019
                  label: Actin-like protein 6A
            role_description: >-
              Actin-related protein bound to the INO80 HSA domain with ARP8 and
              actin. No function is asserted (its only experimental molecular
              function row is a high-throughput nucleosomal DNA binding
              contribution from a mixed chromatin complex). ACTL6A is also a
              subunit of BAF and TIP60/p400 complexes; only its INO80 role is
              modelled here.
          - id: ino80_actb
            label: nuclear beta-actin (ACTB)
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ACTB
                term:
                  id: UniProtKB:P60709
                  label: Actin, cytoplasmic 1
            role_description: >-
              Monomeric nuclear actin bound to the HSA domain with ARP4 and ARP8.
              Listed by RGD; human GOA has no Ino80 complex row for ACTB, and the
              actin in purified human INO80 has not been assigned to beta- or
              gamma-actin (ACTG1). No function is asserted; ACTB's ATP hydrolysis
              activity belongs to its filament cycle (ACTB gene review).
          - id: ino80_yy1
            label: YY1 Holliday-junction binding subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: YY1
                term:
                  id: UniProtKB:P25490
                  label: Transcriptional repressor protein YY1
            function:
              preferred_term: four-way junction DNA binding
              term:
                id: GO:0000400
                label: four-way junction DNA binding
            role_description: >-
              GLI-Kruppel zinc-finger protein that assembles with the HSA module
              and is needed, with the conserved subunits, for full remodeling
              activity of the core complex (PMID:21303910). The INO80-relevant
              function is four-way junction DNA binding (IDA, PMID:18026119).
              Its sequence-specific transcription factor activity is a targeting
              role outside the module.
            evidence:
              - source_id: PMID:18026119
                statement: YY1 binds a recombination-intermediate DNA structure.
                supporting_text: YY1 preferentially bound a recombination-intermediate structure in vitro
    - order: 3
      role: metazoan-specific N-terminal module
      node:
        id: ino80_n_terminal_module
        label: INO80 N-terminal metazoan module (NFRKB, UCHL5, MCRS1, TFPT, INO80D, INO80E)
        module_type: PROTEIN_COMPLEX
        description: >-
          The INO80 N terminus binds six metazoan-specific subunits. The module
          is dispensable for ATP-dependent nucleosome remodeling in vitro; it
          holds the deubiquitinase UCHL5 through NFRKB.
        evidence:
          - source_id: PMID:21303910
            statement: The N-terminal module of metazoan-specific subunits is not required for remodeling.
            supporting_text: one that is composed of the N terminus of the hIno80 protein and all of the metazoan-specific subunits and is not required for ATP-dependent nucleosome remodeling
        annotons:
          - id: ino80_uchl5
            label: UCHL5 (UCH37) latent deubiquitinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: UCHL5
                term:
                  id: UniProtKB:Q9Y5K5
                  label: Ubiquitin carboxyl-terminal hydrolase isozyme L5
            function:
              preferred_term: cysteine-type deubiquitinase activity
              term:
                id: GO:0004843
                label: cysteine-type deubiquitinase activity
            role_description: >-
              Deubiquitinase bound to NFRKB through its C-terminal extension and
              held inactive in INO80; it can be activated by transient contact of
              INO80 with the proteasome. Deubiquitinase activity is IDA
              (PMID:18922472). Its proteasomal role is outside this module.
            evidence:
              - source_id: PMID:18922472
                statement: UCHL5 is held inactive in hINO80 and activated by the proteasome.
                supporting_text: In hINO80, Uch37 is held in an inactive state; however, it can be activated by transient interaction of the Ino80 complex with the proteasome.
              - source_id: Reactome:R-HSA-5689544
                statement: UCHL5 binds NFRKB within INO80.
                supporting_text: The C-terminal extension of UCHL5 (UCH37) binds NFRKB within the INO80 chromatin remodeling complex
          - id: ino80_nfrkb
            label: NFRKB UCHL5-docking subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NFRKB
                term:
                  id: UniProtKB:Q6P4R8
                  label: Nuclear factor related to kappa-B-binding protein
            role_description: >-
              Metazoan-specific subunit that docks UCHL5. No function is
              asserted (its only experimental molecular function row is protease
              binding, which restates the UCHL5 interaction).
          - id: ino80_mcrs1
            label: MCRS1 metazoan-specific subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MCRS1
                term:
                  id: UniProtKB:Q96EZ8
                  label: Microspherule protein 1
            role_description: >-
              FHA-domain subunit of the N-terminal module; also a subunit of the
              NSL acetyltransferase complex, which is outside this module. No
              function is asserted for its INO80 role.
          - id: ino80_tfpt
            label: TFPT (Amida) metazoan-specific subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TFPT
                term:
                  id: UniProtKB:P0C1Z6
                  label: TCF3 fusion partner
            role_description: >-
              Metazoan-specific subunit (INO80 complex subunit F); no experimental
              molecular function row.
          - id: ino80_ino80d
            label: INO80D metazoan-specific subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: INO80D
                term:
                  id: UniProtKB:Q53TQ3
                  label: INO80 complex subunit D
            role_description: >-
              Metazoan-specific subunit; no experimental molecular function row.
          - id: ino80_ino80e
            label: INO80E metazoan-specific subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: INO80E
                term:
                  id: UniProtKB:Q8NBZ0
                  label: INO80 complex subunit E
            role_description: >-
              Metazoan-specific subunit (CCDC95); no experimental molecular
              function row.
