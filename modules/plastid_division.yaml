id: MODULE:plastid_division
title: Plastid division by the FtsZ and ARC5 rings
description: Plastids divide by binary fission with a machinery built from both of their ancestries. Inside,
  the bacterium-derived tubulin-like GTPases FtsZ1 and FtsZ2 form the Z ring in the stroma, anchored to
  the inner envelope; outside, the host-derived dynamin-related GTPase ARC5 assembles on the cytosolic
  face and constricts the outer envelope. The Min system, inherited from bacteria, keeps the ring at the
  midpoint. This module is the green-lineage core of plastid division.
status: DRAFT
scope: CONCRETE
notes: 'Viridiplantae scope, with Arabidopsis representatives; PAINT places chloroplast fission at Viridiplantae
  on the FtsZ1 and FtsZ2 nodes (PTN000768282, PTN000768287). Read as a satisfiability rule, a genome needs
  FtsZ1, FtsZ2 and ARC5; MinD is optional. The FtsZ2 node records as lost the bacterial cell-division
  terms (IRD at PTN000768287). Each selector lists Arabidopsis members only, so other green lineages may
  fail for want of a selector. Partial rule: ARC6 and the outer-envelope PDV1/PDV2 proteins that link
  the two rings have no local PANTHER entry for the Arabidopsis protein and are not modelled; nor is the
  outer plastid-dividing (PD) ring.'
module:
  id: plastid_division
  label: Plastid division by the FtsZ and ARC5 rings
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: plastid fission
    term:
      id: GO:0043572
      label: plastid fission
  - preferred_term: chloroplast fission
    term:
      id: GO:0010020
      label: chloroplast fission
  context:
    taxa:
    - preferred_term: Viridiplantae
      term:
        id: NCBITaxon:33090
        label: Viridiplantae
  parts:
  - order: 1
    role: division-site positioning
    optional: true
    node:
      id: min_positioning
      label: MinD positioning
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: mind_positioning
        label: MinD division-site positioning ATPase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: MinD subfamily
            term:
              id: PANTHER:PTHR43384:SF6
              label: SEPTUM SITE-DETERMINING PROTEIN MIND HOMOLOG, CHLOROPLASTIC
            representative_members:
            - preferred_term: MIND1 (Arabidopsis)
              term:
                id: UniProtKB:Q9MBA2
                label: Septum site-determining protein minD homolog, chloroplastic
            ancestral_nodes:
            - preferred_term: PAINT node PTN000344128
              term:
                id: PANTHER:PTN000344128
                label: PTN000344128
              description: 'PANTHER PAINT ancestral node PTN000344128 in family PTHR43384, given no taxon
                in the source PAINT rows; IBD seeds from Escherichia coli and Pseudomonas aeruginosa.
                IBD GO terms at this node: C:GO:0005829, C:GO:0009898, F:GO:0005524, F:GO:0016887. PAINT
                rows dated 20170602-20260530. Arabidopsis MIND1 descends from it (its IBA rows in QuickGO
                cite PTN000344128).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000344128 in PANTHER family PTHR43384.
            description: Subfamily SF6 of PTHR43384 (plant and algal MinD). The node is shared with bacterial
              MinD. Descent is shown by the protein's IBA rows in QuickGO, which cite the node; no Arabidopsis
              gene review exists for it in this repository.
        function:
          preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
        locations:
        - preferred_term: plastid inner membrane
          term:
            id: GO:0009528
            label: plastid inner membrane
        role_description: Stromal ATPase of the Min system that keeps the Z ring at the plastid midpoint.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0016887 at PTN000344128 in PTHR43384; no gene review for the Arabidopsis
            protein here.
        - source_id: file:interpro/panther/PTHR43384/PTHR43384-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      description: Optional because MinD positions the division site rather than performing division.
  - order: 2
    role: inner ring assembly
    node:
      id: z_ring
      label: FtsZ1-FtsZ2 Z ring
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: ftsz1
        label: FtsZ1 stromal division ring GTPase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: FtsZ1 subfamily
            term:
              id: PANTHER:PTHR30314:SF12
              label: CELL DIVISION PROTEIN FTSZ HOMOLOG 1, CHLOROPLASTIC
            representative_members:
            - preferred_term: FTSZ1 (Arabidopsis)
              term:
                id: UniProtKB:Q42545
                label: Cell division protein FtsZ homolog 1, chloroplastic
            ancestral_nodes:
            - preferred_term: PAINT node PTN000768275
              term:
                id: PANTHER:PTN000768275
                label: PTN000768275
              description: 'PANTHER PAINT ancestral node PTN000768275 in family PTHR30314, given no taxon
                in the source PAINT rows; IBD seeds from Arabidopsis thaliana, Bacillus subtilis, Dictyostelium
                discoideum, Escherichia coli, Mycobacterium tuberculosis, Mycoplasma genitalium, Streptomyces
                coelicolor and Synechocystis sp.. IBD GO terms at this node: C:GO:0005737, C:GO:0032153,
                F:GO:0003924, P:GO:0051301. PAINT rows dated 20170228-20251220. Arabidopsis FTSZ1 descends
                from it (its IBA rows in QuickGO cite PTN000768275).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000768275 in PANTHER family PTHR30314.
            - preferred_term: PAINT node PTN000768282
              term:
                id: PANTHER:PTN000768282
                label: PTN000768282
              description: 'PANTHER PAINT ancestral node PTN000768282 in family PTHR30314, placed at taxon:33090;
                IBD seeds from Arabidopsis thaliana. IBD GO terms at this node: C:GO:0009535, C:GO:0070938,
                P:GO:0010020. PAINT rows dated 20170228-20260429. Arabidopsis FTSZ1 descends from it (its
                IBA rows in QuickGO cite PTN000768282).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000768282 in PANTHER family PTHR30314.
            description: Subfamily SF12 of PTHR30314, whose only member listed locally is Arabidopsis
              FTSZ1. PTN000768282 (taxon:33090, Viridiplantae) places chloroplast fission. Other lineages'
              FtsZ1 proteins are not listed, so their genomes may fail this step for want of a selector.
              Descent is shown by the protein's IBA rows in QuickGO, which cite the node; no Arabidopsis
              gene review exists for it in this repository.
        function:
          preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          description: The F IBD at PTN000768275, the root FtsZ node shared with bacterial FtsZ.
        locations:
        - preferred_term: plastid stroma
          term:
            id: GO:0009532
            label: plastid stroma
        role_description: Tubulin-like GTPase that polymerises with FtsZ2 into the stromal Z ring at the
          plastid division site.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0003924 at PTN000768275 in PTHR30314; no gene review for the Arabidopsis
            protein here.
        - source_id: file:interpro/panther/PTHR30314/PTHR30314-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
      - id: ftsz2
        label: FtsZ2 stromal division ring GTPase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: FtsZ2 subfamily
            term:
              id: PANTHER:PTHR30314:SF16
              label: CELL DIVISION PROTEIN FTSZ HOMOLOG 2-1, CHLOROPLASTIC
            representative_members:
            - preferred_term: FTSZ2-1 (Arabidopsis)
              term:
                id: UniProtKB:O82533
                label: Cell division protein FtsZ homolog 2-1, chloroplastic
            ancestral_nodes:
            - preferred_term: PAINT node PTN000768275
              term:
                id: PANTHER:PTN000768275
                label: PTN000768275
              description: 'PANTHER PAINT ancestral node PTN000768275 in family PTHR30314, given no taxon
                in the source PAINT rows; IBD seeds from Arabidopsis thaliana, Bacillus subtilis, Dictyostelium
                discoideum, Escherichia coli, Mycobacterium tuberculosis, Mycoplasma genitalium, Streptomyces
                coelicolor and Synechocystis sp.. IBD GO terms at this node: C:GO:0005737, C:GO:0032153,
                F:GO:0003924, P:GO:0051301. PAINT rows dated 20170228-20251220. Arabidopsis FTSZ2-1 descends
                from it (its IBA rows in QuickGO cite PTN000768275).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000768275 in PANTHER family PTHR30314.
            - preferred_term: PAINT node PTN000768287
              term:
                id: PANTHER:PTN000768287
                label: PTN000768287
              description: 'PANTHER PAINT ancestral node PTN000768287 in family PTHR30314, placed at taxon:33090;
                IBD seeds from Arabidopsis thaliana. IBD GO terms at this node: C:GO:0009507, P:GO:0010020.
                IRD rows at this node record as lost: C:GO:0032153 (relative to PTN000768275), P:GO:0051301
                (relative to PTN000768275). PAINT rows dated 20170228-20200809. Arabidopsis FTSZ2-1 descends
                from it (its IBA rows in QuickGO cite PTN000768287).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000768287 in PANTHER family PTHR30314.
            description: Subfamily SF16 of PTHR30314 (Arabidopsis FTSZ2-1). FTSZ2-2 (Q9LXJ0) is placed
              in SF3 with bacterial FtsZ and Dictyostelium FszA, a mitochondrial division protein, so
              SF3 is not used and FTSZ2-2 is not a representative. Descent is shown by the protein's IBA
              rows in QuickGO, which cite the node; no Arabidopsis gene review exists for it in this repository.
        function:
          preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          description: The F IBD at PTN000768275.
        locations:
        - preferred_term: plastid stroma
          term:
            id: GO:0009532
            label: plastid stroma
        role_description: Tubulin-like GTPase that forms the Z ring with FtsZ1 and links it to ARC6 in
          the inner envelope.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0003924 at PTN000768275 in PTHR30314; no gene review for the Arabidopsis
            protein here.
        - source_id: file:interpro/panther/PTHR30314/PTHR30314-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  - order: 3
    role: outer ring constriction
    node:
      id: outer_ring
      label: ARC5 outer ring
      module_type: MOLECULAR_FUNCTION
      annotons:
      - id: arc5_dynamin
        label: ARC5 dynamin-related division GTPase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: ARC5 subfamily
            term:
              id: PANTHER:PTHR11566:SF78
              label: DYNAMIN-LIKE PROTEIN ARC5
            representative_members:
            - preferred_term: ARC5 (Arabidopsis)
              term:
                id: UniProtKB:Q84N64
                label: Dynamin-like protein ARC5
            ancestral_nodes:
            - preferred_term: PAINT node PTN000170013
              term:
                id: PANTHER:PTN000170013
                label: PTN000170013
              description: 'PANTHER PAINT ancestral node PTN000170013 in family PTHR11566, given no taxon
                in the source PAINT rows; IBD seeds from Arabidopsis thaliana, Bos taurus, Caenorhabditis
                elegans, Candida albicans, Canis lupus familiaris, Dictyostelium discoideum, Drosophila
                melanogaster, Homo sapiens, Mus musculus, Rattus norvegicus, Saccharomyces cerevisiae,
                Schizosaccharomyces pombe, Sus scrofa and 2 seeds whose species is not resolved locally
                (UniProtKB:Q8IHR4, UniProtKB:Q8IJ32). IBD GO terms at this node: C:GO:0005737, C:GO:0005874,
                C:GO:0016020, F:GO:0003924, F:GO:0008017. PAINT rows dated 20170228-20260828. Arabidopsis
                ARC5 descends from it (its IBA rows in QuickGO cite PTN000170013).'
              evidence:
              - source_id: GO_REF:0000033
                statement: IBD propagation from PAINT ancestral node PTN000170013 in PANTHER family PTHR11566.
            description: Subfamily SF78 of the dynamin family PTHR11566, which holds Arabidopsis ARC5
              only. The family is not used, because it holds the dynamins of every organelle. ARC5 also
              descends from PTN000170389 (taxon:33090), which places peroxisome terms and records ARC5's
              role in peroxisome division; that node is not cited here. Descent is shown by the protein's
              IBA rows in QuickGO, which cite the node; no Arabidopsis gene review exists for it in this
              repository.
        function:
          preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          description: The F IBD at PTN000170013, the dynamin family node.
        locations:
        - preferred_term: plastid outer membrane
          term:
            id: GO:0009527
            label: plastid outer membrane
        role_description: Cytosolic dynamin-related GTPase that is recruited to the outer surface of the
          division site and constricts the outer ring.
        evidence:
        - source_id: GO_REF:0000033
          statement: PAINT IBD F:GO:0003924 at PTN000170013 in PTHR11566; no gene review for the Arabidopsis
            protein here.
        - source_id: file:interpro/panther/PTHR11566/PTHR11566-paint.tsv
          statement: PAINT ancestral-node rows for this step's family.
  connections:
  - source: min_positioning
    target: z_ring
    connection_type: PROVIDES_INPUT_FOR
    description: MinD restricts Z-ring assembly to the plastid midpoint.
  - source: z_ring
    target: outer_ring
    connection_type: PROVIDES_INPUT_FOR
    description: The Z ring marks the site where ARC5 is recruited across the envelope.
