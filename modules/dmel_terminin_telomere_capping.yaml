id: MODULE:dmel_terminin_telomere_capping
title: Terminin telomere-capping complex in Drosophila melanogaster
description: >-
  Drosophila telomeres are maintained by retrotransposons rather than telomerase, and their
  capping is sequence-independent. The terminin complex binds chromosome ends and prevents
  them from being recognised as DNA breaks and fused. It contains HOAP (encoded by caravaggio,
  cav) with HipHop, which together with HP1 form the HipHop-HOAP subcomplex, and the MTV subcomplex
  of Modigliani (Moi), Verrocchio (Ver) and Tea, which also associates with HOAP. Loss of
  terminin subunits causes telomere fusions.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001969
  title: 'FlyBase gene group HHTC: Hiphop-hoap telomere-capping complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as hiphop-hoap telomere-capping
    complex (HHTC); this module models that group.
- source_id: FB:FBgg0001970
  title: 'FlyBase gene group MTV: Mtv complex'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as mtv complex (MTV); this module
    models that group.
- source_id: GO:0000783
  title: nuclear telomere cap complex
  statement: >-
    GO term grounding the module as nuclear telomere cap complex.
notes: >-
  HOAP (cav) is listed in both FlyBase subgroups and so appears in both parts. HP1 (Su(var)205)
  is also part of the cap but is not a member of these FlyBase groups and is not added here,
  because it has many roles outside telomeres. FlyBase groups realized by this module: HHTC
  (FBgg0001969), MTV (FBgg0001970). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_terminin_telomere_capping.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
