  notes: >-
    Exact UniProt exemplars delimit each reaction role without restricting the
    module taxonomically. A multidomain protein may satisfy more than one leaf:
    GART combines PurD-, PurN-, and PurM-like roles, PAICS combines direct AIR
    carboxylase and SAICAR synthetase roles, and PurH/ATIC commonly combines the
    final two reactions. GART remains an exact fusion exemplar on the PurD and
    PurN leaves, where its reviewed domain descriptions establish those
    activities without using its whole-protein family as a reaction selector.
    The PurM leaf uses PTHR10520:SF12 because that whole-protein subfamily
    contains both standalone bacterial PurM proteins and the GART fusion; the
    leaf molecular function constrains it to the shared cyclo-ligase role. Separate
    bacterial and eukaryotic adenylosuccinate-lyase families are retained for
    the PurB leaf. Parent PANTHER families containing both standalone enzymes
    and fusion proteins are selector scaffolds constrained by the leaf
    molecular function and exemplars. No ancestral PTN node is asserted without
    verified PAINT IBD evidence.
    ALIGN with the YeastPathways crosswalk (PWY-6122-1, PWY-6123-1,
    DENOVOPURINE2-PWY, DENOVOPURINE3-PWY, PRPP-PWY-1) and the PomBase model
    663d668500001911. Fungal architecture: ADE4 (PurF), ADE5,7 / S. pombe ade1
    (PurD-PurM fusion, both leaves; PMID:3502942), ADE8 / ade5 (standalone
    PurN; fungi have no PurT), ADE6 / ade3 (large PurL), ADE2 / ade6 (fused
    PurK-PurE, modelled as the fused_ade2_n5_cair_route variant;
    PMID:9500840), ADE1 / ade7 (standalone PurC), ADE13 / ade8 (PurB) and the
    ADE16/ADE17 isozyme pair / ade10 (PurH-type bifunctional transformylase
    and cyclohydrolase; PMID:9143321, PMID:10877846). All YeastCyc catalysts
    are correct and none was missing. YeastCyc corrections: AIR carboxylation is
    drawn as the direct EC 4.1.1.21 reaction, and both YeastPathways and PomBase
    GO-CAMs annotate ADE2/ade6 with GO:0004638 (the direct, class II-type
    carboxylase term) rather than GO:0034028 + GO:0034023, although fungal
    ADE2 proceeds through free N5-CAIR. The YeastPathways models annotate the
    ADE13 SAICAR reaction with GO:0004018 (adenylosuccinate lyase) rather than
    GO:0070626. The superpathway frames DENOVOPURINE2-PWY and
    DENOVOPURINE3-PWY also contain IMP-to-AMP/GMP, NMP/NDP kinase and
    ribonucleotide reductase reactions (purine_nucleotide_interconversion,
    dntp_de_novo_synthesis) and two gene-less formate-dependent class III
    ribonucleotide reductase reactions that do not occur in yeast. PRPP-PWY-1
    places every activity under the root-level GO:0009165 and the PomBase model
    additionally includes ade9 (one-carbon supply, folate_one_carbon_interconversion).
    Regulation (outside the module core): adenine nucleotides inhibit
    Ade4p, and the intermediates SAICAR and AICAR promote Bas1-Bas2
    transcriptional activation of the ADE and HIS genes (PMID:11689683,
    PMID:15744050). PRPP supply (pentose_phosphate_pathway, PRS1-PRS5) and the
    10-formyl-THF donor (folate_one_carbon_interconversion) are upstream inputs.
