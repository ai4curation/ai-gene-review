id: MODULE:de_novo_purine_synthesis
title: De novo inosine monophosphate biosynthesis
description: >-
  A reusable pathway that assembles the purine ring on
  5-phosphoribosyl diphosphate (PRPP) to form inosine monophosphate (IMP).
  The module represents ten ordered reaction positions and separates reaction
  roles from lineage-specific protein fusions. It includes alternative
  folate-dependent PurN and ATP/formate-dependent PurT routes for GAR
  formylation, and alternative two-enzyme and direct routes for AIR
  carboxylation. IMP-to-AMP and IMP-to-GMP branches are outside the module,
  although PurB also has a second physiological role in AMP synthesis.
status: DRAFT
evidence:
  - source_id: GO:0006189
    title: "'de novo' IMP biosynthetic process"
    statement: >-
      GO:0006189 defines the pathway from PRPP through purine-ring assembly to
      IMP.
  - source_id: file:modules/de_novo_purine_synthesis-deep-research-openscientist.md
    title: OpenScientist research for de novo IMP biosynthesis
    statement: >-
      The generic pathway review supports the ordered reaction boundary,
      alternative GAR-formylation chemistry, AIR-carboxylation variants, and
      lineage-specific fusion architectures.
  - source_id: PMID:8501063
    title: Evidence for a novel glycinamide ribonucleotide transformylase in Escherichia coli
    statement: >-
      Genetic analysis establishes PurN and PurT as alternative GAR
      transformylases at the same de novo purine-biosynthesis position.
  - source_id: PMID:10574791
    title: Crystal structure of Escherichia coli PurE, an unusual mutase in the purine biosynthetic pathway
    statement: >-
      Structural and biochemical evidence distinguishes the bacterial
      PurK/PurE N5-CAIR route from direct AIR carboxylation.
  - source_id: file:human/PPAT/PPAT-ai-review.yaml
    title: Human PPAT gene review
    statement: Q06203 provides a eukaryotic exemplar for the committed first reaction.
  - source_id: file:human/GART/GART-ai-review.yaml
    title: Human GART gene review
    statement: P22102 exemplifies fusion of the PurD-, PurN-, and PurM-like reaction roles.
  - source_id: file:human/PFAS/PFAS-ai-review.yaml
    title: Human PFAS gene review
    statement: O15067 provides a eukaryotic exemplar for FGAM synthase activity.
  - source_id: file:human/PAICS/PAICS-ai-review.yaml
    title: Human PAICS gene review
    statement: P22234 exemplifies fusion of direct AIR carboxylase and SAICAR synthetase roles.
  - source_id: file:human/ADSL/ADSL-ai-review.yaml
    title: Human ADSL gene review
    statement: P30566 provides a eukaryotic exemplar for the two physiological PurB lyase activities.
  - source_id: file:human/ATIC/ATIC-ai-review.yaml
    title: Human ATIC gene review
    statement: P31939 exemplifies fusion of the final AICAR transformylase and IMP cyclohydrolase roles.
  - source_id: file:PSEPK/purF/purF-ai-review.yaml
    title: PSEPK purF gene review
    statement: Q88LD5 supplies the committed amidophosphoribosyltransferase step.
  - source_id: file:PSEPK/purD/purD-ai-review.yaml
    title: PSEPK purD gene review
    statement: Q88DK2 supplies phosphoribosylamine--glycine ligase activity.
  - source_id: file:PSEPK/purN/purN-ai-review.yaml
    title: PSEPK purN gene review
    statement: Q88MB0 supplies the folate-dependent GAR transformylase route.
  - source_id: file:PSEPK/purT/purT-ai-review.yaml
    title: PSEPK purT gene review
    statement: Q88MW1 supplies the ATP/formate-dependent GAR transformylase route.
  - source_id: file:PSEPK/purL/purL-ai-review.yaml
    title: PSEPK purL gene review
    statement: Q88P16 supplies large-type FGAM synthase activity.
  - source_id: file:PSEPK/purM/purM-ai-review.yaml
    title: PSEPK purM gene review
    statement: Q88MA9 supplies AIR synthetase activity.
  - source_id: file:PSEPK/purK/purK-ai-review.yaml
    title: PSEPK purK gene review
    statement: Q88C48 supplies N5-CAIR synthetase activity.
  - source_id: file:PSEPK/purE/purE-ai-review.yaml
    title: PSEPK purE gene review
    statement: Q88C47 supplies N5-CAIR mutase activity.
  - source_id: file:PSEPK/purC/purC-ai-review.yaml
    title: PSEPK purC gene review
    statement: Q88NG9 supplies SAICAR synthetase activity.
  - source_id: file:PSEPK/purB/purB-ai-review.yaml
    title: PSEPK purB gene review
    statement: Q88FR7 supplies SAICAR lyase activity in this module.
  - source_id: file:PSEPK/purH/purH-ai-review.yaml
    title: PSEPK purH gene review
    statement: Q88DK3 supplies the final AICAR transformylase and IMP cyclohydrolase reactions.
module:
  id: de_novo_purine_synthesis
  label: De novo inosine monophosphate biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: "'de novo' IMP biosynthetic process"
      term:
        id: GO:0006189
        label: "'de novo' IMP biosynthetic process"
      description: Assembly of inosine monophosphate from PRPP.
  parts:
    - order: 1
      role: committed phosphoribosylamine formation
      node:
        id: purF_step
        label: Amidophosphoribosyltransferase
        module_type: REACTION
        annotons:
          - id: purF_activity
            label: Glutamine PRPP amidotransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PurF amidophosphoribosyltransferases
                term:
                  id: PANTHER:PTHR11907
                  label: AMIDOPHOSPHORIBOSYLTRANSFERASE
                representative_members:
                  - preferred_term: PSEPK PurF
                    term:
                      id: UniProtKB:Q88LD5
                      label: Amidophosphoribosyltransferase
                  - preferred_term: Escherichia coli PurF
                    term:
                      id: UniProtKB:P0AG16
                      label: Amidophosphoribosyltransferase
                  - preferred_term: Human PPAT
                    term:
                      id: UniProtKB:Q06203
                      label: Amidophosphoribosyltransferase
            function:
              preferred_term: amidophosphoribosyltransferase activity
              term:
                id: GO:0004044
                label: amidophosphoribosyltransferase activity
              substrates:
                - preferred_term: 5-phosphoribosyl diphosphate
                - preferred_term: L-glutamine
                - preferred_term: water
              products:
                - preferred_term: 5-phosphoribosylamine
                - preferred_term: L-glutamate
                - preferred_term: diphosphate
            role_description: Commits PRPP to de novo purine-ring assembly.
    - order: 2
      role: glycinamide ribonucleotide formation
      node:
        id: purD_step
        label: Phosphoribosylamine--glycine ligase
        module_type: REACTION
        annotons:
          - id: purD_activity
            label: GAR synthetase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PurD phosphoribosylamine--glycine ligases
                term:
                  id: PANTHER:PTHR43472
                  label: PHOSPHORIBOSYLAMINE--GLYCINE LIGASE
                representative_members:
                  - preferred_term: PSEPK PurD
                    term:
                      id: UniProtKB:Q88DK2
                      label: Phosphoribosylamine--glycine ligase
                  - preferred_term: Escherichia coli PurD
                    term:
                      id: UniProtKB:P15640
                      label: Phosphoribosylamine--glycine ligase
                  - preferred_term: Human GART
                    term:
                      id: UniProtKB:P22102
                      label: Trifunctional purine biosynthetic protein adenosine-3
                    description: >-
                      The whole fusion is classified as PTHR10520:SF12; its
                      N-terminal ATP-grasp domain performs this PurD reaction,
                      as documented by the exact reviewed UniProt record.
            function:
              preferred_term: phosphoribosylamine-glycine ligase activity
              term:
                id: GO:0004637
                label: phosphoribosylamine-glycine ligase activity
              substrates:
                - preferred_term: 5-phosphoribosylamine
                - preferred_term: glycine
                - preferred_term: ATP
              products:
                - preferred_term: phosphoribosylglycinamide
                - preferred_term: ADP
                - preferred_term: phosphate
            role_description: Adds glycine to the growing purine precursor.
    - order: 3
      role: GAR formylation
      node:
        id: gar_transformylation_step
        label: Alternative GAR transformylation routes
        module_type: REACTION
        variant_sets:
          - id: gar_transformylase_route
            label: GAR one-carbon donor route
            axis: one-carbon donor and energy coupling
            selection: ONE_OR_MORE
            variants:
              - id: purN_folate_route
                label: Folate-dependent PurN route
                module_type: REACTION
                annotons:
                  - id: purN_activity
                    label: Folate-dependent GAR transformylase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PurN GAR transformylases
                        term:
                          id: PANTHER:PTHR43369
                          label: PHOSPHORIBOSYLGLYCINAMIDE FORMYLTRANSFERASE
                        representative_members:
                          - preferred_term: PSEPK PurN
                            term:
                              id: UniProtKB:Q88MB0
                              label: Phosphoribosylglycinamide formyltransferase
                          - preferred_term: Escherichia coli PurN
                            term:
                              id: UniProtKB:P08179
                              label: Phosphoribosylglycinamide formyltransferase
                          - preferred_term: Human GART
                            term:
                              id: UniProtKB:P22102
                              label: Trifunctional purine biosynthetic protein adenosine-3
                            description: >-
                              The whole fusion is classified as
                              PTHR10520:SF12; its C-terminal transformylase
                              domain performs this PurN reaction, as documented
                              by the exact reviewed UniProt record.
                    function:
                      preferred_term: phosphoribosylglycinamide formyltransferase activity
                      term:
                        id: GO:0004644
                        label: phosphoribosylglycinamide formyltransferase activity
                      substrates:
                        - preferred_term: phosphoribosylglycinamide
                        - preferred_term: 10-formyltetrahydrofolate
                      products:
                        - preferred_term: phosphoribosyl-N-formylglycinamide
                        - preferred_term: tetrahydrofolate
                    role_description: Uses a folate-bound one-carbon unit to form FGAR.
              - id: purT_formate_route
                label: ATP/formate-dependent PurT route
                module_type: REACTION
                annotons:
                  - id: purT_activity
                    label: Formate-dependent GAR transformylase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PurT formate-dependent GAR transformylases
                        term:
                          id: PANTHER:PTHR43055
                          label: FORMATE-DEPENDENT PHOSPHORIBOSYLGLYCINAMIDE FORMYLTRANSFERASE
                        representative_members:
                          - preferred_term: PSEPK PurT
                            term:
                              id: UniProtKB:Q88MW1
                              label: Formate-dependent phosphoribosylglycinamide formyltransferase
                          - preferred_term: Escherichia coli PurT
                            term:
                              id: UniProtKB:P33221
                              label: Formate-dependent phosphoribosylglycinamide formyltransferase
                    function:
                      preferred_term: phosphoribosylglycinamide formyltransferase 2 activity
                      term:
                        id: GO:0043815
                        label: phosphoribosylglycinamide formyltransferase 2 activity
                      substrates:
                        - preferred_term: phosphoribosylglycinamide
                        - preferred_term: formate
                        - preferred_term: ATP
                      products:
                        - preferred_term: phosphoribosyl-N-formylglycinamide
                        - preferred_term: ADP
                        - preferred_term: phosphate
                    role_description: Uses free formate and ATP to form FGAR.
    - order: 4
      role: formylglycinamidine ribonucleotide formation
      node:
        id: purL_step
        label: Phosphoribosylformylglycinamidine synthase
        module_type: REACTION
        annotons:
          - id: purL_activity
            label: FGAM synthase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: large-type PurL FGAM synthases
                term:
                  id: PANTHER:PTHR10099
                  label: PHOSPHORIBOSYLFORMYLGLYCINAMIDINE SYNTHASE
                representative_members:
                  - preferred_term: PSEPK PurL
                    term:
                      id: UniProtKB:Q88P16
                      label: Phosphoribosylformylglycinamidine synthase
                  - preferred_term: Escherichia coli PurL
                    term:
                      id: UniProtKB:P15254
                      label: Phosphoribosylformylglycinamidine synthase
                  - preferred_term: Human PFAS
                    term:
                      id: UniProtKB:O15067
                      label: Phosphoribosylformylglycinamidine synthase
            function:
              preferred_term: phosphoribosylformylglycinamidine synthase activity
              term:
                id: GO:0004642
                label: phosphoribosylformylglycinamidine synthase activity
              substrates:
                - preferred_term: phosphoribosyl-N-formylglycinamide
                - preferred_term: L-glutamine
                - preferred_term: ATP
                - preferred_term: water
              products:
                - preferred_term: phosphoribosylformylglycinamidine
                - preferred_term: L-glutamate
                - preferred_term: ADP
                - preferred_term: phosphate
            role_description: Introduces the second ring nitrogen to form FGAM.
    - order: 5
      role: aminoimidazole ribonucleotide formation
      node:
        id: purM_step
        label: Phosphoribosylformylglycinamidine cyclo-ligase
        module_type: REACTION
        annotons:
          - id: purM_activity
            label: AIR synthetase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PurM AIR synthetases
                term:
                  id: PANTHER:PTHR10520:SF12
                  label: TRIFUNCTIONAL PURINE BIOSYNTHETIC PROTEIN ADENOSINE-3
                representative_members:
                  - preferred_term: PSEPK PurM
                    term:
                      id: UniProtKB:Q88MA9
                      label: Phosphoribosylformylglycinamidine cyclo-ligase
                  - preferred_term: Escherichia coli PurM
                    term:
                      id: UniProtKB:P08178
                      label: Phosphoribosylformylglycinamidine cyclo-ligase
                  - preferred_term: Human GART
                    term:
                      id: UniProtKB:P22102
                      label: Trifunctional purine biosynthetic protein adenosine-3
                description: >-
                  PTHR10520:SF12 contains both standalone bacterial PurM
                  proteins and multidomain GART proteins. The leaf molecular
                  function and exact exemplars constrain this whole-protein
                  selector to the shared PurM cyclo-ligase role.
            function:
              preferred_term: phosphoribosylformylglycinamidine cyclo-ligase activity
              term:
                id: GO:0004641
                label: phosphoribosylformylglycinamidine cyclo-ligase activity
              substrates:
                - preferred_term: phosphoribosylformylglycinamidine
                - preferred_term: ATP
              products:
                - preferred_term: 5-aminoimidazole ribonucleotide
                - preferred_term: ADP
                - preferred_term: phosphate
            role_description: Cyclizes FGAM to form the first purine-ring intermediate AIR.
    - order: 6
      role: aminoimidazole ribonucleotide carboxylation
      node:
        id: air_carboxylation_step
        label: Alternative AIR carboxylation routes
        module_type: METABOLIC_PATHWAY
        variant_sets:
          - id: air_carboxylation_route
            label: AIR-to-CAIR implementation
            axis: direct versus N5-CAIR intermediate
            selection: EXACTLY_ONE
            variants:
              - id: two_enzyme_n5_cair_route
                label: Two-enzyme PurK/PurE route
                module_type: METABOLIC_PATHWAY
                parts:
                  - order: 1
                    role: N5-CAIR formation
                    node:
                      id: purK_substep
                      label: N5-CAIR synthetase
                      module_type: REACTION
                      annotons:
                        - id: purK_activity
                          label: ATP-dependent N5-CAIR synthetase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: PurK N5-CAIR synthetases
                              term:
                                id: PANTHER:PTHR11609
                                label: PURINE BIOSYNTHESIS PROTEIN 6/7, PUR6/7
                              representative_members:
                                - preferred_term: PSEPK PurK
                                  term:
                                    id: UniProtKB:Q88C48
                                    label: N5-carboxyaminoimidazole ribonucleotide synthase
                                - preferred_term: Escherichia coli PurK
                                  term:
                                    id: UniProtKB:P09029
                                    label: N5-carboxyaminoimidazole ribonucleotide synthase
                          function:
                            preferred_term: 5-(carboxyamino)imidazole ribonucleotide synthase activity
                            term:
                              id: GO:0034028
                              label: 5-(carboxyamino)imidazole ribonucleotide synthase activity
                            substrates:
                              - preferred_term: 5-aminoimidazole ribonucleotide
                              - preferred_term: hydrogencarbonate
                              - preferred_term: ATP
                            products:
                              - preferred_term: N5-carboxyaminoimidazole ribonucleotide
                              - preferred_term: ADP
                              - preferred_term: phosphate
                  - order: 2
                    role: CAIR rearrangement
                    node:
                      id: purE_substep
                      label: N5-CAIR mutase
                      module_type: REACTION
                      annotons:
                        - id: purE_activity
                          label: N5-CAIR mutase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: PurE N5-CAIR mutases
                              term:
                                id: PANTHER:PTHR23046
                                label: PHOSPHORIBOSYLAMINOIMIDAZOLE CARBOXYLASE CATALYTIC SUBUNIT
                              representative_members:
                                - preferred_term: PSEPK PurE
                                  term:
                                    id: UniProtKB:Q88C47
                                    label: N5-carboxyaminoimidazole ribonucleotide mutase
                                - preferred_term: Escherichia coli PurE
                                  term:
                                    id: UniProtKB:P0AG18
                                    label: N5-carboxyaminoimidazole ribonucleotide mutase
                          function:
                            preferred_term: 5-(carboxyamino)imidazole ribonucleotide mutase activity
                            term:
                              id: GO:0034023
                              label: 5-(carboxyamino)imidazole ribonucleotide mutase activity
                            substrates:
                              - preferred_term: N5-carboxyaminoimidazole ribonucleotide
                            products:
                              - preferred_term: 5-aminoimidazole-4-carboxylate ribonucleotide
                connections:
                  - source: purK_substep
                    target: purE_substep
                    connection_type: PROVIDES_INPUT_FOR
                    description: PurK supplies N5-CAIR to PurE.
              - id: direct_air_carboxylase_route
                label: Direct AIR carboxylase route
                module_type: REACTION
                annotons:
                  - id: direct_air_carboxylase_activity
                    label: Direct AIR carboxylase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: direct AIR carboxylases and PAICS-type fusion proteins
                        term:
                          id: PANTHER:PTHR43599
                          label: MULTIFUNCTIONAL PROTEIN ADE2
                        representative_members:
                          - preferred_term: Human PAICS
                            term:
                              id: UniProtKB:P22234
                              label: Multifunctional protein ADE2
                    function:
                      preferred_term: phosphoribosylaminoimidazole carboxylase activity
                      term:
                        id: GO:0004638
                        label: phosphoribosylaminoimidazole carboxylase activity
                      substrates:
                        - preferred_term: 5-aminoimidazole ribonucleotide
                        - preferred_term: carbon dioxide
                      products:
                        - preferred_term: 5-aminoimidazole-4-carboxylate ribonucleotide
                    role_description: Directly forms CAIR without a free N5-CAIR intermediate.
    - order: 7
      role: succinylaminoimidazole carboxamide ribonucleotide formation
      node:
        id: purC_step
        label: SAICAR synthetase
        module_type: REACTION
        annotons:
          - id: purC_activity
            label: SAICAR synthetase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PurC and PAICS SAICAR synthetases
                term:
                  id: PANTHER:PTHR43599
                  label: MULTIFUNCTIONAL PROTEIN ADE2
                representative_members:
                  - preferred_term: PSEPK PurC
                    term:
                      id: UniProtKB:Q88NG9
                      label: Phosphoribosylaminoimidazole-succinocarboxamide synthase
                  - preferred_term: Human PAICS
                    term:
                      id: UniProtKB:P22234
                      label: Multifunctional protein ADE2
            function:
              preferred_term: phosphoribosylaminoimidazolesuccinocarboxamide synthase activity
              term:
                id: GO:0004639
                label: phosphoribosylaminoimidazolesuccinocarboxamide synthase activity
              substrates:
                - preferred_term: 5-aminoimidazole-4-carboxylate ribonucleotide
                - preferred_term: L-aspartate
                - preferred_term: ATP
              products:
                - preferred_term: SAICAR
                - preferred_term: ADP
                - preferred_term: phosphate
            role_description: Adds aspartate to CAIR to form SAICAR.
    - order: 8
      role: aminoimidazole carboxamide ribonucleotide formation
      node:
        id: purB_step
        label: SAICAR lyase
        module_type: REACTION
        annotons:
          - id: purB_saicar_activity
            label: SAICAR lyase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PurB adenylosuccinate lyases
                family_terms:
                  - id: PANTHER:PTHR43411
                    label: ADENYLOSUCCINATE LYASE
                  - id: PANTHER:PTHR43172:SF1
                    label: ADENYLOSUCCINATE LYASE
                representative_members:
                  - preferred_term: PSEPK PurB
                    term:
                      id: UniProtKB:Q88FR7
                      label: Adenylosuccinate lyase
                  - preferred_term: Escherichia coli PurB
                    term:
                      id: UniProtKB:P0AB89
                      label: Adenylosuccinate lyase
                  - preferred_term: Human ADSL
                    term:
                      id: UniProtKB:P30566
                      label: Adenylosuccinate lyase
                    description: >-
                      Reviewed eukaryotic PurB exemplar in the distinct
                      PTHR43172:SF1 adenylosuccinate-lyase family.
            function:
              preferred_term: SAICAR lyase activity
              term:
                id: GO:0070626
                label: >-
                  (S)-2-(5-amino-1-(5-phospho-D-ribosyl)imidazole-4-carboxamido)
                  succinate lyase (fumarate-forming) activity
              substrates:
                - preferred_term: SAICAR
              products:
                - preferred_term: AICAR
                - preferred_term: fumarate
            role_description: Removes fumarate from SAICAR to form AICAR.
    - order: 9
      role: formylaminoimidazole carboxamide ribonucleotide formation
      node:
        id: purH_transformylase_step
        label: AICAR transformylase
        module_type: REACTION
        annotons:
          - id: purH_transformylase_activity
            label: AICAR transformylase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PurH and ATIC AICAR transformylases
                term:
                  id: PANTHER:PTHR11692
                  label: BIFUNCTIONAL PURINE BIOSYNTHESIS PROTEIN PURH
                representative_members:
                  - preferred_term: PSEPK PurH
                    term:
                      id: UniProtKB:Q88DK3
                      label: Bifunctional purine biosynthesis protein PurH
                  - preferred_term: Escherichia coli PurH
                    term:
                      id: UniProtKB:P15639
                      label: Bifunctional purine biosynthesis protein PurH
                  - preferred_term: Human ATIC
                    term:
                      id: UniProtKB:P31939
                      label: Bifunctional purine biosynthesis protein ATIC
            function:
              preferred_term: phosphoribosylaminoimidazolecarboxamide formyltransferase activity
              term:
                id: GO:0004643
                label: phosphoribosylaminoimidazolecarboxamide formyltransferase activity
              substrates:
                - preferred_term: AICAR
                - preferred_term: 10-formyltetrahydrofolate
              products:
                - preferred_term: FAICAR
                - preferred_term: tetrahydrofolate
            role_description: Adds the final folate-derived one-carbon unit.
    - order: 10
      role: inosine monophosphate formation
      node:
        id: purH_cyclohydrolase_step
        label: IMP cyclohydrolase
        module_type: REACTION
        annotons:
          - id: purH_cyclohydrolase_activity
            label: IMP cyclohydrolase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PurH and ATIC IMP cyclohydrolases
                term:
                  id: PANTHER:PTHR11692
                  label: BIFUNCTIONAL PURINE BIOSYNTHESIS PROTEIN PURH
                representative_members:
                  - preferred_term: PSEPK PurH
                    term:
                      id: UniProtKB:Q88DK3
                      label: Bifunctional purine biosynthesis protein PurH
                  - preferred_term: Escherichia coli PurH
                    term:
                      id: UniProtKB:P15639
                      label: Bifunctional purine biosynthesis protein PurH
                  - preferred_term: Human ATIC
                    term:
                      id: UniProtKB:P31939
                      label: Bifunctional purine biosynthesis protein ATIC
            function:
              preferred_term: IMP cyclohydrolase activity
              term:
                id: GO:0003937
                label: IMP cyclohydrolase activity
              substrates:
                - preferred_term: FAICAR
              products:
                - preferred_term: inosine monophosphate
                - preferred_term: water
            role_description: Closes the second purine ring to produce IMP.
  connections:
    - source: purF_step
      target: purD_step
      connection_type: PROVIDES_INPUT_FOR
      description: PurF supplies phosphoribosylamine to PurD.
    - source: purD_step
      target: gar_transformylation_step
      connection_type: PROVIDES_INPUT_FOR
      description: PurD supplies GAR to either transformylase route.
    - source: gar_transformylation_step
      target: purL_step
      connection_type: PROVIDES_INPUT_FOR
      description: GAR formylation supplies FGAR to PurL.
    - source: purL_step
      target: purM_step
      connection_type: PROVIDES_INPUT_FOR
      description: PurL supplies FGAM to PurM.
    - source: purM_step
      target: air_carboxylation_step
      connection_type: PROVIDES_INPUT_FOR
      description: PurM supplies AIR to the selected carboxylation route.
    - source: air_carboxylation_step
      target: purC_step
      connection_type: PROVIDES_INPUT_FOR
      description: AIR carboxylation supplies CAIR to SAICAR synthetase.
    - source: purC_step
      target: purB_step
      connection_type: PROVIDES_INPUT_FOR
      description: PurC supplies SAICAR to PurB.
    - source: purB_step
      target: purH_transformylase_step
      connection_type: PROVIDES_INPUT_FOR
      description: PurB supplies AICAR to the penultimate reaction.
    - source: purH_transformylase_step
      target: purH_cyclohydrolase_step
      connection_type: PROVIDES_INPUT_FOR
      description: AICAR transformylation supplies FAICAR for ring closure.
  notes: >-
    Exact UniProt exemplars delimit each reaction role without restricting the
    module taxonomically. A multidomain protein may satisfy more than one leaf:
    GART combines PurD-, PurN-, and PurM-like roles, PAICS combines direct AIR
    carboxylase and SAICAR synthetase roles, and PurH/ATIC commonly combines the
    final two reactions. GART remains an exact fusion exemplar on the PurD and
    PurN leaves, where its reviewed domain descriptions establish those
    activities without using its whole-protein family as a reaction selector.
    The PurM leaf uses PTHR10520:SF12 because that whole-protein subfamily
    contains both standalone bacterial PurM proteins and the GART fusion; the
    leaf molecular function constrains it to the shared cyclo-ligase role. Separate
    bacterial and eukaryotic adenylosuccinate-lyase families are retained for
    the PurB leaf. Parent PANTHER families containing both standalone enzymes
    and fusion proteins are selector scaffolds constrained by the leaf
    molecular function and exemplars. No ancestral PTN node is asserted without
    verified PAINT IBD evidence.
