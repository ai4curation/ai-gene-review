  - source_id: file:human/ADSL/ADSL-ai-review.yaml
    title: Human ADSL gene review
    statement: P30566 provides a eukaryotic exemplar for the two physiological PurB lyase activities.
  - source_id: file:human/ATIC/ATIC-ai-review.yaml
    title: Human ATIC gene review
    statement: P31939 exemplifies fusion of the final AICAR transformylase and IMP cyclohydrolase roles.
  - source_id: file:PSEPK/purF/purF-ai-review.yaml
    title: PSEPK purF gene review
    statement: Q88LD5 supplies the committed amidophosphoribosyltransferase step.
  - source_id: file:PSEPK/purD/purD-ai-review.yaml
