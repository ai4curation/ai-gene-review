id: MODULE:de_novo_purine_synthesis
title: De novo inosine monophosphate biosynthesis
description: >-
  A reusable pathway that assembles the purine ring on
  5-phosphoribosyl diphosphate (PRPP) to form inosine monophosphate (IMP).
  The module represents ten ordered reaction positions and separates reaction
  roles from lineage-specific protein fusions. It includes alternative
  folate-dependent PurN and ATP/formate-dependent PurT routes for GAR
  formylation, and alternative two-enzyme and direct routes for AIR
  carboxylation. Enzyme architecture varies widely: bacteria commonly use
  separate PurF, PurD, PurN/PurT, PurL, PurM, PurK, PurE, PurC, PurB and PurH
  proteins; animals fuse PurD, PurM and PurN in GART and direct AIR
  carboxylase with SAICAR synthetase in PAICS; fungi fuse PurD with PurM in a
  bifunctional GAR synthetase-AIR synthetase and PurK with PurE in a
  bifunctional AIR carboxylase that works through the N5-carboxyaminoimidazole
  ribonucleotide intermediate. In eukaryotes the pathway is cytosolic. The first
  enzyme, amidophosphoribosyltransferase, is feedback-inhibited by adenine
  nucleotides. IMP-to-AMP and IMP-to-GMP branches are outside the module,
  although PurB also has a second physiological role in AMP synthesis.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY-6122-1
    title: 5-aminoimidazole ribonucleotide biosynthesis II (S. cerevisiae, SGD YeastPathways)
    statement: >-
      First five reactions (PRPP to AIR) with ADE4, ADE5,7 (GAR synthetase and
      AIR synthetase), ADE8 and ADE6. Gene assignments are correct.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-6122-1
  - source_id: YeastPathways:PWY-6123-1
    title: inosine-5'-phosphate biosynthesis I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      AIR to IMP with ADE2, ADE1, ADE13 and the ADE16/ADE17 isozymes. AIR
      carboxylation is drawn as the single direct reaction AIRCARBOXY-RXN
      (EC 4.1.1.21), whereas fungal ADE2 works through the N5-CAIR
      intermediate (PMID:9500840).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-6123-1
  - source_id: YeastPathways:DENOVOPURINE2-PWY
    title: superpathway of purine nucleotides de novo biosynthesis II (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway joining this module with purine_nucleotide_interconversion
      (ADE12, ADE13, IMD2-4, GUA1, ADK1/ADK2, GUK1, YNK1) and
      ribonucleotide reduction (RNR1-4). It also lists two formate-dependent
      class III ribonucleotide reductase reactions (RXN0-745, RXN0-746) with no
      yeast gene; these are not part of yeast metabolism.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=DENOVOPURINE2-PWY
  - source_id: YeastPathways:DENOVOPURINE3-PWY
    title: de novo biosynthesis of purine nucleotides (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Same reaction set as DENOVOPURINE2-PWY plus an ammonia-dependent GMP
      synthase reaction; the comment describes the 10-step IMP pathway and its
      Bas1/Bas2 transcriptional control.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=DENOVOPURINE3-PWY
  - source_id: YeastPathways:PRPP-PWY-1
    title: superpathway of histidine, purine, and pyrimidine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Union of PRPP synthesis (PRS1-PRS5), histidine biosynthesis, de novo
      purine and pyrimidine biosynthesis and nucleotide interconversion. Only
      the IMP reactions are modelled here; the other parts belong to
      pentose_phosphate_pathway, histidine_biosynthesis,
      de_novo_pyrimidine_synthesis, purine_nucleotide_interconversion and
      dntp_de_novo_synthesis.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PRPP-PWY-1
  - source_id: GO:0006189
    title: "'de novo' IMP biosynthetic process"
    statement: >-
      GO:0006189 defines the pathway from PRPP through purine-ring assembly to
      IMP.
  - source_id: file:modules/de_novo_purine_synthesis-deep-research-openscientist.md
    title: OpenScientist research for de novo IMP biosynthesis
    statement: >-
      The generic pathway review supports the ordered reaction boundary,
      alternative GAR-formylation chemistry, AIR-carboxylation variants, and
      lineage-specific fusion architectures.
  - source_id: PMID:8501063
    title: Evidence for a novel glycinamide ribonucleotide transformylase in Escherichia coli
    statement: >-
      Genetic analysis establishes PurN and PurT as alternative GAR
      transformylases at the same de novo purine-biosynthesis position.
  - source_id: PMID:10574791
    title: Crystal structure of Escherichia coli PurE, an unusual mutase in the purine biosynthetic pathway
    statement: >-
      Structural and biochemical evidence distinguishes the bacterial
      PurK/PurE N5-CAIR route from direct AIR carboxylation.
  - source_id: PMID:9500840
    title: Biochemical role of the Cryptococcus neoformans ADE2 protein in fungal de novo purine biosynthesis.
    statement: >-
      Fungal ADE2 is a two-domain bifunctional protein: an N-terminal
      PurK-like domain forms N5-CAIR from AIR, ATP and bicarbonate and a
      C-terminal PurE-like domain converts N5-CAIR to CAIR.
  - source_id: PMID:6376509
    title: Glutamine nucleotide sequence of Saccharomyces cerevisiae ADE4 encoding phosphoribosylpyrophosphate amidotransferase.
    statement: ADE4 encodes yeast glutamine PRPP amidotransferase, homologous to the E. coli enzyme.
  - source_id: PMID:8082193
    title: 'The ade4 gene of Schizosaccharomyces pombe: cloning, sequence and regulation.'
    statement: S. pombe ade4 encodes the 533-residue amidophosphoribosyltransferase.
  - source_id: PMID:11689683
    title: Yeast AMP pathway genes respond to adenine through regulated synthesis of a metabolic intermediate.
    statement: >-
      ATP feedback inhibition of Ade4p regulates flux and the synthesis of the
      pathway intermediate SAICAR, which promotes Bas1-Bas2 activation of the
      ADE genes.
  - source_id: PMID:3502942
    title: Sequence of the bifunctional ade1 gene in the purine biosynthetic pathway of the fission yeast Schizosaccharomyces pombe.
    statement: >-
      S. pombe ade1 encodes a bifunctional protein carrying the second and
      fifth steps (GAR synthetase and AIR synthetase), homologous to S.
      cerevisiae ADE5,7.
  - source_id: PMID:9143321
    title: Saccharomyces cerevisiae expresses two genes encoding isozymes of 5-aminoimidazole-4-carboxamide ribonucleotide transformylase.
    statement: >-
      ADE16 and ADE17 encode 84%-identical AICAR transformylase isozymes;
      disruption of both causes adenine auxotrophy.
  - source_id: PMID:10877846
    title: Characterization of two 5-aminoimidazole-4-carboxamide ribonucleotide transformylase/inosine monophosphate cyclohydrolase isozymes from Saccharomyces cerevisiae.
    statement: >-
      Ade16p and Ade17p are cytosolic bifunctional AICAR transformylase/IMP
      cyclohydrolase homodimers; Ade17p is adenine-repressed and Ade16p is
      not.
  - source_id: PMID:15744050
    title: 'Revisiting purine-histidine cross-pathway regulation in Saccharomyces cerevisiae: a central role for a small molecule.'
    statement: >-
      AICAR, made both by this pathway and by histidine biosynthesis, acts as a
      regulatory metabolite; ade16 ade17 mutants are histidine auxotrophs.
  - source_id: PMID:22419079
    title: Regulation of amino acid, nucleotide, and phosphate metabolism in Saccharomyces cerevisiae.
    statement: YeastBook review of purine pathway enzymes and their Bas1/Bas2 regulation.
  - source_id: file:human/PPAT/PPAT-ai-review.yaml
    title: Human PPAT gene review
    statement: Q06203 provides a eukaryotic exemplar for the committed first reaction.
  - source_id: file:human/GART/GART-ai-review.yaml
