            role_description: >-
              The complex carries RNA polymerase II general transcription initiation factor
              activity: TBP has IDA rows for it (PMID:27193682 and others), and TAF4, TAF5,
              TAF6, TAF7, TAF10 and TAF12 carry it as contributes_to (IDA, PMID:9603525).
              Two units carry functions of their own. TBP is typed RNA polymerase II core
              promoter sequence-specific DNA binding (IDA, PMID:29111974; further IDA rows for
              cis-regulatory region binding). TAF3 is typed histone H3K4me3 reader activity
              (IDA, PMID:17884155), the one TAF whose own activity in promoter recognition is
              shown directly. The other TAFs are units without a function: their experimental
              molecular-function rows are either the complex-level initiation factor activity
              assigned to a single subunit, generic DNA or protein binding, coactivator
              activity measured in SAGA-containing preparations, or, for TAF1, kinase and
              acetyltransferase activities that are not part of this step. TAF1 and TAF2
              contact the downstream promoter in the promoter-bound structure, but their only
              direct DNA-binding rows are mutant-phenotype (IMP) rows, so no function is
              assigned.
