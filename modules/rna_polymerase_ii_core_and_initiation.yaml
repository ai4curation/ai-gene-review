id: MODULE:rna_polymerase_ii_core_and_initiation
title: Human RNA polymerase II core enzyme and transcription initiation — TFIID and TFIIA promoter recognition, TFIIB, TFIIF-escorted recruitment of the 12-subunit Pol II, TFIIE-recruited TFIIH promoter opening and CDK7 CTD Ser5 phosphorylation
description: >-
  RNA polymerase II (Pol II) transcribes all protein-coding genes and many non-coding
  genes. The enzyme has 12 subunits: the two large catalytic subunits RPB1 (POLR2A), whose
  C-terminal domain (CTD) carries the heptapeptide repeats that coordinate the
  transcription cycle, and RPB2 (POLR2B); the alpha-like assembly heterodimer RPB3-RPB11
  (POLR2C, POLR2J); the RPB4-RPB7 stalk (POLR2D, POLR2G); the TFIIS-like RPB9 (POLR2I);
  and the five RPABC subunits shared with Pol I and Pol III (POLR2E, POLR2F, POLR2H, POLR2K,
  POLR2L). Pol II cannot recognise promoters on its own. At the core promoter, the general
  transcription factors assemble with it into the preinitiation complex (PIC). TFIID, made
  of the TATA-box binding protein TBP and 13 TBP-associated factors (TAF1 to TAF13), binds
  the core promoter elements, and TBP bends the DNA at the TATA box; TFIIA stabilises the
  TBP-DNA complex. TFIIB binds TBP and the promoter asymmetrically, which sets the
  direction of assembly, and bridges TBP to the polymerase. Pol II enters bound to TFIIF
  (GTF2F1-GTF2F2). TFIIE then recruits TFIIH. The XPB translocase of the TFIIH core opens
  the promoter DNA to form the transcription bubble, and the CDK-activating kinase module
  (CDK7, cyclin H, MAT1) phosphorylates CTD Ser5, which helps the polymerase escape the
  promoter and recruits capping and pausing factors. Pol II then synthesises the first
  phosphodiester bonds and leaves the promoter.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000127
    title: RNA polymerase II transcription pathway
    statement: >-
      The RGD Pathway Ontology diagram for Pol II transcription. Its initiation section
      draws sequential PIC assembly from the TBP-containing TFIID complex, TFIIA and TFIIB,
      Pol II with TFIIF, TFIIE and TFIIH, with TFIIH unwinding the promoter and
      phosphorylating CTD Ser5. RGD lists the 12 Pol II subunits directly on PW:0000127.
      This module covers the enzyme and the initiation section of the diagram; Mediator,
      elongation, termination, capping and 3' processing are covered by sibling modules.
      Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000127.yaml and the Pol II
      split plan in broad_pathway_split_plans.md).
  - source_id: PW:0001274
    title: RNA polymerase II transcription initiation pathway
    statement: >-
      RGD's child pathway of PW:0000127 for initiation (58 RGD-curated human genes). Its
      general transcription factor genes (TFIIA, TFIIB, TFIID, TFIIE, TFIIF and TFIIH) are
      the participants of this module; its SAGA and ATAC coactivator genes are not.
  - source_id: GO:0006366
    title: transcription by RNA polymerase II
    statement: >-
      The GO process mapped to PW:0000127 (skos:relatedMatch, from the PW definition
      cross-reference in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is
      broader than this module, which stops at promoter escape.
  - source_id: GO:0006367
    title: transcription initiation at RNA polymerase II promoter
    statement: >-
      The GO process cross-referenced in the PW:0001274 definition (.cache/rgd_pw/pw.obo).
      It is the module's process concept.
  - source_id: PMID:18354501
    title: 'Structural insight into the TFIIE-TFIIH interaction: TFIIE and p53 share the binding region on TFIIH.'
    statement: Pol II has 12 subunits and needs the general transcription factors to recognise promoters; they assemble in an ordered way into the PIC.
    supporting_text: Although it is a complex enzyme comprised of 12 subunits, Pol II alone is unable to accurately recognize promoters to initiate transcription.
  - source_id: PMID:27193682
    title: Near-atomic resolution visualization of human transcription promoter opening.
    statement: Cryo-EM structures of the human PIC in the closed, open and initially transcribing states define the order of events in initiation used for the parts of this module.
    supporting_text: Here we use cryo-electron microscropy (cryo-EM) to determine near-atomic resolution structures of the human PIC in a closed state (engaged with duplex DNA), an open state (engaged with a transcription bubble), and an initially transcribing complex (containing six base pairs of DNA-RNA hybrid).
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000127 (RNA polymerase II
  transcription pathway) through the RGD_PATHWAY_ONTOLOGY project's diagram->module route
  (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, flagged broad), as item 1
  of the Pol II split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md.
  Both PW ids were checked against .cache/rgd_pw/pw.obo: PW:0000127 "RNA polymerase II
  transcription pathway" and its child PW:0001274 "RNA polymerase II transcription
  initiation pathway". RGD curates the 12 Pol II subunit genes directly to PW:0000127
  (POLR2A to POLR2L), and 58 human genes to PW:0001274: ATXN7 ATXN7L3 CCNH CDK7 DR1 ENY2
  ERCC2 ERCC3 ERCC5 GTF2A1 GTF2A2 GTF2B GTF2E1 GTF2E2 GTF2F1 GTF2F2 GTF2H1 GTF2H2 GTF2H3
  GTF2H4 GTF2H5 HCFC2 KAT14 KAT2A KAT2B MBIP MNAT1 POLE3 SGF29 SUPT20H SUPT3H SUPT7L TADA1
  TADA2A TADA2B TADA3 TAF1 TAF10 TAF11 TAF12 TAF13 TAF15 TAF2 TAF3 TAF4 TAF5 TAF5L TAF6
  TAF6L TAF7 TAF8 TAF9 TBP TRRAP USP22 WDR5 YEATS2 ZZZ3. Thirty-seven gene products are
  modelled as participants: the 12 Pol II subunits; TFIIA (GTF2A1, GTF2A2); TFIIB (GTF2B);
  TFIID (TBP and TAF1 to TAF13); TFIIE (GTF2E1, GTF2E2); TFIIF (GTF2F1, GTF2F2); and from
  TFIIH, XPB (ERCC3) and the CAK module (CDK7, CCNH, MNAT1). No gene outside the RGD lists
  is added. Molecular functions were taken from each protein's experimental GO
  annotations in QuickGO (November 2026) and, where a gene review exists, from its core
  functions (GTF2F2, ERCC3, CDK7; ERCC2 also has a review but is not a participant here).
  Two assignments are curator choices without a matching experimental GOA row on the
  participant: XPB DNA translocase activity (the ERCC3 review's core function, used also
  in the NER module; the GOA rows are ATPase and 3'-5' helicase), and the start-site
  selection process on TFIIB (from the bubble-stabilising role shown in PMID:27193682).
  UniProt labels are the current recommended names (UniProt REST, November 2026).

  Boundary decisions. (1) The module stops at promoter escape, the end of PW:0001274.
  Pausing, pause release, elongation factors and termination are in
  rna_polymerase_ii_elongation_and_termination; Mediator, including the CDK8 kinase module
  (CDK8, CCNC, CDK19, MED12, MED13 and paralogues, all on PW:0000127), is in
  mediator_complex; capping and 3' processing are in pre_mrna_capping and
  pre_mrna_3prime_cleavage_polyadenylation. TFIIF's elongation-stimulating activity is
  left to the elongation module, and CTD Ser5 phosphorylation is kept here because RGD
  draws it as a TFIIH activity in initiation. (2) The enzyme is one complex annoton with
  12 active units, as in the Pol I and Pol III modules and in
  modules/dmel_nuclear_rna_polymerases.yaml. Only RPB1 and RPB2 carry a function; the
  other subunits are units without a function because none has an experimental molecular
  function in human GOA that describes its role in the enzyme. A subunit assayed only in
  the whole enzyme gets no catalytic function of its own; its IBA rows are contributes_to
  rows for the enzyme's activity. (3) Shared subunits. The five RPABC subunits (POLR2E,
  POLR2F, POLR2H, POLR2K, POLR2L) are written with the same accessions and role text as in
  modules/rna_polymerase_i_transcription.yaml and
  modules/rna_polymerase_iii_transcription.yaml, so that each enzyme is complete where it
  is modelled; the RPAC subunits of Pol I and III have no Pol II counterpart, which uses
  the Pol II-specific RPB3 and RPB11 instead. The notes of those two modules say that no
  human Pol II module exists; this module now supplies it. POLR2J2 and POLR2J3, the
  RPB11 paralogues, are not on the RGD lists and are not modelled. (4) TFIIH is not
  re-modelled. Its seven-subunit core (XPB, XPD, p62, p52, p44, p34, p8) is the tfiih_core
  annoton of modules/nucleotide_excision_repair.yaml (node tfiih_opening). A module_ref to
  that node was considered and rejected: that node is the NER preincision step, whose
  process is nucleotide-excision repair preincision complex assembly and whose complex
  activity is the XPD helicase verifying a lesion, so including it would assert a repair
  step inside transcription initiation. Instead the two TFIIH activities that the RGD
  diagram names for transcription are written as their own annotons: XPB promoter opening
  (one gene product, since XPB is the subunit whose translocase opens the DNA) and the CAK
  module's CTD Ser5 kinase, which the NER module explicitly excludes because CAK leaves
  TFIIH during repair. ERCC2 (XPD) and GTF2H1 to GTF2H5 are RGD PW:0001274 genes covered by
  that reference; the TFIIE-alpha to p62 contact is described in the TFIIE annoton.
  ERCC5 (XPG), which RGD lists, is the NER 3' endonuclease and is modelled in the NER
  module only. (5) TFIID is one complex annoton with 14 units (TBP and TAF1 to TAF13).
  TBP and TAF3 carry their own functions (TATA-box binding and H3K4me3 reading); the other
  TAFs do not (reasons in the annoton). TAF9, TAF10 and TAF12 are also SAGA subunits and
  TAF12 also an SL1 subunit; they are listed here only for TFIID. TBP is shared with SL1
  in the Pol I module and TFIIIB in the Pol III module. TAF15 is excluded: despite its
  name it is a FET-family RNA-binding protein found in a subpopulation of TFIID, not one of
  the 13 canonical TAFs of the structures used here (PMID:27007846). Tissue-specific
  paralogues (TAF4B, TAF7L, TAF9B, TAF1L, TBPL1, TBPL2, GTF2A1L) are not on the RGD lists
  and are not modelled. (6) SAGA and ATAC are out of scope and are left to the
  histone-modification tranche: ATXN7, ATXN7L3, ENY2, KAT2A, KAT2B, KAT14, MBIP, SGF29,
  SUPT20H, SUPT3H, SUPT7L, TADA1, TADA2A, TADA2B, TADA3, TAF5L, TAF6L, TRRAP, USP22, WDR5,
  YEATS2 and ZZZ3 on PW:0001274 are coactivator acetyltransferase or deubiquitinase
  complex subunits that RGD draws as positively affecting initiation; they do not perform
  a step of PIC assembly. (7) Other RGD genes excluded: DR1 (NC2-beta), a repressor that
  binds TBP and blocks TFIIA and TFIIB; HCFC2 and POLE3, whose link to Pol II initiation is
  indirect (a host-cell factor paralogue and a DNA polymerase epsilon subunit that also
  sits in the CHRAC remodeler); and the CTD phosphatases and kinases on PW:0000127 (CTDP1,
  CTDSP1, SSU72, RPAP2, CDC14A, CDC14B, CDK9, CDK12), which act in the CTD cycle after
  escape and belong with the elongation and termination module or with no module yet.
  (8) Substrate versus participant: promoter DNA and the RPB1 CTD are substrates, not
  participants; the CTD is part of the enzyme annoton through POLR2A, and the CAK annoton
  phosphorylates it. Transcriptional activators, which RGD mentions in prose, are out of
  scope. (9) Parts follow the sequential assembly order RGD describes (TFIID, then TFIIA
  and TFIIB, Pol II with TFIIF, TFIIE and TFIIH); in cells PIC assembly need not be
  strictly sequential, and the PRECEDES connections record the order of dependencies in
  the reconstituted system.

  GO-CAM links. gocams/index.tsv was searched for all 37 participants and the excluded
  TFIIH subunits. POLR2A appears in five human models with DNA-directed RNA polymerase
  activity; the four with an initiation or general Pol II transcription context are linked
  on the enzyme annoton (the pause-release activity in gomodel:6796b94c00002252 is left to
  the elongation module). CDK7 appears in three models with RNA polymerase II CTD
  heptapeptide repeat S5 kinase activity in transcription initiation, all linked on the CAK
  annoton. TBP (two ZNF76 regulation models) and TAF7 (TRIM26 regulation model) appear with
  RNA polymerase II general transcription initiation factor activity and are linked on the
  TFIID annoton. No other participant is in a production GO-CAM. In those models POLR2A,
  CDK7, TBP and TAF7 stand alone for their complexes; this is a common GO-CAM convention
  and is not reported as an error. PANTHER family ids and PTNs are deliberately not
  asserted.
module:
