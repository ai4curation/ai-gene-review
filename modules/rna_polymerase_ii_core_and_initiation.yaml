        label: TFIID binds the core promoter and loads TBP on the TATA box; TFIIA stabilises the TBP-DNA complex
        module_type: BIOLOGICAL_PROCESS
        description: >-
          TFIID nucleates PIC assembly. Its TAFs contact the downstream promoter elements and
          position TBP to scan for and bind the TATA box, which TBP bends; TFIIA bridges the
          TBP-TATA complex to lobe B of TFIID and stabilises it. TFIID is also anchored at
          active promoters by the TAF3 PHD finger binding H3K4me3.
        concepts:
          - preferred_term: RNA polymerase II preinitiation complex assembly
            term:
              id: GO:0051123
              label: RNA polymerase II preinitiation complex assembly
        annotons:
          - id: tfiid_promoter_binding
            label: TFIID (TBP and TAF1-TAF13) recognises the core promoter and nucleates the PIC
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: TFIID
                term:
                  id: GO:0005669
                  label: transcription factor TFIID complex
                active_units:
                  - id: tfiid_tbp
                    label: TBP
                    role: TATA-box binding protein; binds and bends the TATA box and is the TFIID subunit that loads onto promoter DNA. Shared with SL1 (Pol I) and TFIIIB (Pol III).
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: TBP
                        term:
                          id: UniProtKB:P20226
                          label: TATA-box-binding protein
                    function:
                      preferred_term: RNA polymerase II core promoter sequence-specific DNA binding
                      term:
                        id: GO:0000979
                        label: RNA polymerase II core promoter sequence-specific DNA binding
                  - id: tfiid_taf1
                    label: TAF1
                    role: Largest TAF and scaffold of lobe C; with TAF2 contacts the downstream promoter (Inr, DPE); binds TBP through its N-terminal domain. Its reported kinase and acetyltransferase activities are not used here.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: TAF1
                        term:
                          id: UniProtKB:P21675
                          label: Transcription initiation factor TFIID subunit 1
                  - id: tfiid_taf2
                    label: TAF2
                    role: Lobe C subunit that with TAF1 contacts the downstream promoter elements.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: TAF2
                        term:
                          id: UniProtKB:Q6P1X5
                          label: Transcription initiation factor TFIID subunit 2
                  - id: tfiid_taf3
                    label: TAF3
