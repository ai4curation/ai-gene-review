                supporting_text: TFIID comprises the TATA-binding protein (TBP) and 13 TBP-associated factors (TAF1-13), which specifically interact with a variety of core promoter DNA sequences.
              - source_id: PMID:27007846
                statement: TAF1 and TAF2 make the main downstream promoter contacts.
                supporting_text: All core promoter elements are contacted by subunits of TFIID, with TAF1 and TAF2 mediating major interactions with the downstream promoter.
              - source_id: PMID:30442764
                statement: TFIID first binds the downstream promoter, which positions TBP to scan for and engage the TATA box.
                supporting_text: the initial binding of TFIID to the downstream promoter positions the upstream DNA and facilitates scanning of TBP for a TATA box and the subsequent engagement of the promoter
              - source_id: PMID:17884155
                statement: TFIID binds H3K4me3 directly through the TAF3 PHD finger.
                supporting_text: we show that the basal transcription factor TFIID directly binds to the H3K4me3 mark via the plant homeodomain (PHD) finger of TAF3
