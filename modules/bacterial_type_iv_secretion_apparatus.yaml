id: MODULE:bacterial_type_iv_secretion_apparatus
title: Bacterial type IV secretion apparatus
description: >-
  A species-neutral module for the envelope-spanning machine that transfers
  macromolecules from a donor bacterium directly into a recipient cell or into
  the extracellular space. A coupling protein at the inner membrane receives the
  substrate and feeds it into a channel formed by a conserved three-protein
  envelope core complex; a VirB4-family ATPase, joined in many lineages by a
  second VirB11-family ATPase, energizes translocation and the assembly of an
  extracellular pilus built from processed pilin subunits. In conjugative
  systems an outer-membrane adhesin stabilizes the donor-recipient pair. The
  cargo is excluded from this module: the same apparatus transfers a relaxase
  covalently bound to plasmid DNA in conjugative systems and unrelated protein
  effectors in others. Relaxosome assembly and DNA nicking, plasmid
  replication, events inside the recipient cell, and transcriptional regulation
  of the transfer region are also outside this module.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: GO:0044097
  title: secretion by the type IV secretion system
  statement: >-
    GO:0044097 is the cargo-agnostic process modeled here. Its two children,
    GO:0030255 protein secretion by the type IV secretion system and GO:0044098
    DNA secretion by the type IV secretion system, describe the cargo
    alternatives that this module deliberately leaves outside its boundary.
- source_id: GO:0043684
  title: type IV secretion system complex
  statement: >-
    GO:0043684 identifies the assembled machinery represented by the module
    parts. It is a complex rather than a cellular anatomical entity, so it is
    recorded here rather than used as an annoton location.
- source_id: GO:0009291
  title: unidirectional conjugation
  statement: >-
    GO:0009291 is the process the conjugative realization of this apparatus
    serves, and is the experimentally supported process annotation for the
    F-plasmid coupling protein.
- source_id: PMID:24670658
  title: Structure of a type IV secretion system.
  statement: >-
    Resolves the architecture of an assembled conjugative type IV secretion
    system, establishing the core complex and its relationship to the
    inner-membrane components as one continuous machine rather than separable
    subassemblies.
- source_id: PMID:35046412
  title: >-
    Structure of a type IV secretion system core complex encoded by multi-drug
    resistance F plasmids.
  statement: >-
    Determines the core complex of an F-type system specifically, which is the
    basis for treating the VirB7, VirB9, and VirB10 counterparts TraV, TraK, and
    TraB as one envelope-spanning part.
- source_id: PMID:7915817
  title: >-
    Analysis of the sequence and gene products of the transfer region of the F
    sex factor.
  statement: >-
    The reference description of the F transfer region and its gene products,
    used to assign F Tra proteins to the conserved roles and to keep relaxosome
    and regulatory functions outside the apparatus boundary.
- source_id: PMID:27735785
  title: The Mosaic Type IV Secretion Systems.
  statement: >-
    Reviews the conserved subassemblies across conjugative and effector
    translocator systems and the lineage-variable components, which is the basis
    for marking the second ATPase and mating-pair stabilization as optional
    parts rather than core requirements.
notes: >-
  Reusable boundary: the module begins when the coupling protein engages a
  substrate at the cytoplasmic face of the inner membrane and ends when that
  substrate leaves the apparatus. Cargo is excluded for the same reason as in
  the sibling type II, type V, and type VI modules: the machine is defined by
  its architecture, and the cargo varies from a relaxase-DNA adduct to
  standalone protein effectors.
  A naming hazard deserves recording, because it is easy to conflate proteins
  across plasmids. The Tra nomenclature is not stable between transfer systems:
  on the F plasmid TraC is the VirB4-family ATPase and TraB is a VirB10-family
  core-complex component, whereas on pKM101 TraB is itself the VirB4 homologue.
  Conserved-role assignments here therefore follow the VirB and VirD4 families,
  with F proteins named as counterparts, rather than following gene symbols
  across plasmids.
  Two consequences for grounding. The ATPase annoton is grounded on VirB4 and
  VirB11, which carry ATP hydrolysis annotations, and not on F TraC, whose GOA
  record currently holds only a plasma-membrane location. Conversely F TraB
  carries an experimentally supported ATP hydrolysis annotation whose cited
  source concerns the pKM101 VirB4 homologue of the same gene symbol; this
  module places TraB in the core complex on architectural grounds and asserts no
  ATPase activity for that part, leaving the annotation itself for gene-level
  review rather than adjudicating it here.
module:
  id: bacterial_type_iv_secretion_apparatus
  label: Bacterial type IV secretion apparatus
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: secretion by the type IV secretion system
    term:
      id: GO:0044097
      label: secretion by the type IV secretion system
    description: >-
      Transfer of a macromolecular substrate out of the donor cell through the
      assembled type IV apparatus, without commitment to the cargo type.
  context:
    taxa:
    - preferred_term: bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
      description: >-
        Diderm bacteria, where the apparatus must span two membranes; related
        systems occur in monoderms with a reduced component set.
  parts:
  - order: 1
    role: >-
      Receive the substrate at the cytoplasmic face and deliver it into the
      translocation channel
    node:
      id: substrate_coupling_protein
      label: Type IV coupling protein
      module_type: TRANSPORT_STEP
      description: >-
        The coupling protein is the entry point of the apparatus. It is anchored
        in the inner membrane, projects a hexameric cytoplasmic domain, and
        selects which substrate enters the channel. It is the component that
        makes the apparatus cargo-specific while the rest of the machine stays
        generic.
      annotons:
      - id: vird4_coupling_protein
        label: VirD4/TraD-family coupling protein
        participant:
          selector_type: FAMILY
          family:
            preferred_term: VirD4/TraD-family type IV coupling protein family
            term:
              id: PANTHER:PTHR37937:SF1
              label: "CONJUGATIVE TRANSFER: DNA TRANSPORT"
            representative_members:
            - preferred_term: TraD (Escherichia coli, F plasmid)
              term:
                id: UniProtKB:P09130
                label: Coupling protein TraD
            - preferred_term: VirD4 (Agrobacterium tumefaciens)
              term:
                id: UniProtKB:P09817
                label: Type IV secretion system-coupling protein VirD4
        function:
          preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          description: >-
            Grounded on VirD4, which carries an ATP hydrolysis annotation. The
            F counterpart TraD has an experimentally supported conjugation
            phenotype but no molecular function annotation of its own.
        processes:
        - preferred_term: secretion by the type IV secretion system
          term:
            id: GO:0044097
            label: secretion by the type IV secretion system
        - preferred_term: unidirectional conjugation
          term:
            id: GO:0009291
            label: unidirectional conjugation
          description: >-
            The conjugative realization, supported for TraD by mutant phenotype.
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: >-
          Selects and receives the substrate at the inner membrane and couples it
          to the translocation channel.
        evidence:
        - source_id: file:ECOLI/traD/traD-ai-review.yaml
          statement: >-
            The focused review grounds ATP hydrolysis for TraD as an inference
            from the characterised family member TrwB (Q04230), and accepts the
            experimentally supported conjugation process.
  - order: 2
    role: Energize substrate translocation and pilus assembly
    node:
      id: virb4_family_atpase
      label: VirB4-family translocation ATPase
      module_type: MOLECULAR_FUNCTION
      description: >-
        The VirB4-family ATPase is the one motor present in every
        characterized type IV system. It acts at the cytoplasmic face of the
        inner membrane and is required both for translocation and for building
        the extracellular pilus.
      annotons:
      - id: virb4_atpase
        label: VirB4-family ATPase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: VirB4/TraC-family type IV secretion ATPase family
            family_terms:
            - id: PANTHER:PTHR30121
              label: "UNCHARACTERIZED PROTEIN YJGR-RELATED"
            - id: PANTHER:PTHR38467
              label: "FAMILY NOT NAMED"
            representative_members:
            - preferred_term: VirB4 (Agrobacterium tumefaciens)
              term:
                id: UniProtKB:P0A3W0
                label: Type IV secretion system ATPase VirB4
            - preferred_term: TraC (Escherichia coli, F plasmid counterpart)
              term:
                id: UniProtKB:P18004
                label: Protein TraC
        function:
          preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          description: >-
            Grounded on VirB4, which carries ATP binding and ATP hydrolysis
            annotations. For the F counterpart TraC the activity is a
            family-level inference, not an existing annotation.
        processes:
        - preferred_term: secretion by the type IV secretion system
          term:
            id: GO:0044097
            label: secretion by the type IV secretion system
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: >-
          Hydrolyzes ATP to drive substrate translocation and the polymerization
          of pilin subunits into an extended pilus.
        evidence:
        - source_id: file:ECOLI/traC/traC-ai-review.yaml
          statement: >-
            The focused review of F TraC asserts no molecular function at all:
            the F protein has never been assayed for nucleotide binding or
            hydrolysis, which is why this annoton's ATPase function is grounded
            on VirB4 instead.
  - order: 3
    role: Provide a second cytoplasmic ATPase where the lineage encodes one
    optional: true
    node:
      id: virb11_family_atpase
      label: VirB11-family accessory ATPase
      module_type: MOLECULAR_FUNCTION
      description: >-
        A hexameric traffic-ATPase that is present in many type IV systems and
        absent from others. The F transfer region encodes no VirB11 counterpart,
        which is why this is an optional part rather than a core requirement.
      annotons:
      - id: virb11_atpase
        label: VirB11-family ATPase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: VirB11-family traffic ATPase family
            term:
              id: PANTHER:PTHR30486
              label: "TWITCHING MOTILITY PROTEIN PILT"
            representative_members:
            - preferred_term: VirB11 (Agrobacterium tumefaciens)
              term:
                id: UniProtKB:P0A3F8
                label: Type IV secretion system ATPase VirB11
        function:
          preferred_term: ATP hydrolysis activity
          term:
            id: GO:0016887
            label: ATP hydrolysis activity
          description: Supported for VirB11 by direct assay.
        processes:
        - preferred_term: secretion by the type IV secretion system
          term:
            id: GO:0044097
            label: secretion by the type IV secretion system
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: >-
          Provides a second ATP-hydrolyzing activity at the inner membrane in the
          lineages that encode it.
        notes: >-
          Absence of a VirB11 counterpart does not make a system incomplete. The
          F-type systems transfer DNA efficiently without one.
  - order: 4
    role: Form the envelope-spanning translocation channel
    node:
      id: envelope_core_complex
      label: Type IV secretion envelope core complex
      module_type: PROTEIN_COMPLEX
      description: >-
        Three proteins build the chamber that spans the periplasm and crosses the
        outer membrane: a small outer-membrane lipoprotein, a partner that caps
        the outer-membrane end, and a component that reaches from the inner
        membrane to the outer membrane and so defines the continuity of the
        channel.
      annotons:
      - id: virb7_lipoprotein
        label: VirB7/TraV-family outer-membrane lipoprotein
        participant:
          selector_type: FAMILY
          family:
            preferred_term: VirB7/TraV-family outer-membrane lipoprotein family
            representative_members:
            - preferred_term: VirB7 (Agrobacterium tumefaciens)
              term:
                id: UniProtKB:P0A3W4
                label: Type IV secretion system outer membrane lipoprotein VirB7
            - preferred_term: TraV (Escherichia coli, F plasmid counterpart)
              term:
                id: UniProtKB:P41069
                label: Protein TraV
        function:
          preferred_term: structural molecule activity
          term:
            id: GO:0005198
            label: structural molecule activity
        processes:
        - preferred_term: secretion by the type IV secretion system
          term:
            id: GO:0044097
            label: secretion by the type IV secretion system
        locations:
        - preferred_term: cell outer membrane
          term:
            id: GO:0009279
            label: cell outer membrane
        role_description: >-
          Anchors the core complex in the outer membrane and stabilizes its
          partner subunit.
      - id: virb9_core_subunit
        label: VirB9/TraK-family core-complex subunit
        participant:
          selector_type: FAMILY
          family:
            preferred_term: VirB9/TraK-family core-complex subunit family
            representative_members:
            - preferred_term: VirB9 (Agrobacterium tumefaciens)
              term:
                id: UniProtKB:P0A3W6
                label: Type IV secretion system protein VirB9
            - preferred_term: TraK (Escherichia coli, F plasmid counterpart)
              term:
                id: UniProtKB:P41066
                label: TraK lipoprotein
        function:
          preferred_term: structural molecule activity
          term:
            id: GO:0005198
            label: structural molecule activity
        processes:
        - preferred_term: secretion by the type IV secretion system
          term:
            id: GO:0044097
            label: secretion by the type IV secretion system
        locations:
        - preferred_term: cell outer membrane
          term:
            id: GO:0009279
            label: cell outer membrane
        role_description: >-
          Forms the outer-membrane-proximal wall of the core chamber together
          with its lipoprotein partner.
      - id: virb10_membrane_spanning_subunit
        label: VirB10/TraB-family membrane-spanning subunit
        participant:
          selector_type: FAMILY
          family:
            preferred_term: VirB10/TraB-family envelope-spanning core subunit family
            representative_members:
            - preferred_term: VirB10 (Agrobacterium tumefaciens)
              term:
                id: UniProtKB:P09783
                label: Type IV secretion system protein VirB10
            - preferred_term: TraB (Escherichia coli, F plasmid counterpart)
              term:
                id: UniProtKB:P41067
                label: Protein TraB
        function:
          preferred_term: structural molecule activity
          term:
            id: GO:0005198
            label: structural molecule activity
        processes:
        - preferred_term: secretion by the type IV secretion system
          term:
            id: GO:0044097
            label: secretion by the type IV secretion system
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
          description: >-
            Anchored in the inner membrane while reaching the outer membrane,
            which is what makes the channel continuous. Both locations are
            annotated for VirB10.
        - preferred_term: cell outer membrane
          term:
            id: GO:0009279
            label: cell outer membrane
        role_description: >-
          Bridges the two membranes and is the component through which
          inner-membrane events are communicated to the outer-membrane gate.
        evidence:
        - source_id: file:ECOLI/traB/traB-ai-review.yaml
          statement: >-
            The focused review removes the ATP hydrolysis annotation from F TraB
            as attributed from the pKM101 protein of the same gene symbol, and
            proposes the core-complex terms this annoton relies on.
        notes: >-
          No ATPase activity is asserted here. See the module notes on the Tra
          naming collision, which is the reason this family is assigned by
          architecture rather than by gene symbol. The focused review of F TraB
          adjudicated the ATP hydrolysis annotation and removed it.
  - order: 5
    role: Build the extracellular filament that contacts the recipient cell
    node:
      id: conjugative_pilus
      label: Type IV secretion pilus
      module_type: PROTEIN_COMPLEX
      description: >-
        A filament of processed pilin subunits extends from the apparatus. Pilin
        is made as a precursor, matured with the help of a dedicated membrane
        chaperone in F-type systems, and polymerized in a VirB4-dependent
        manner. The filament retracts after contact is established.
      annotons:
      - id: virb2_pilin
        label: VirB2/TraA-family pilin
        participant:
          selector_type: FAMILY
          family:
            preferred_term: VirB2/TraA-family type IV secretion pilin family
            representative_members:
            - preferred_term: TraA (Escherichia coli, F plasmid)
              term:
                id: UniProtKB:P04737
                label: Pilin
            - preferred_term: VirB2 (Agrobacterium tumefaciens)
              term:
                id: UniProtKB:P09776
                label: Type IV secretion system pilin protein VirB2
        function:
          preferred_term: structural molecule activity
          term:
            id: GO:0005198
            label: structural molecule activity
        processes:
        - preferred_term: secretion by the type IV secretion system
          term:
            id: GO:0044097
            label: secretion by the type IV secretion system
        locations:
        - preferred_term: pilus
          term:
            id: GO:0009289
            label: pilus
          description: >-
            Supported for VirB2 by direct assay. The subunit pool is also found
            in the inner membrane before polymerization.
        role_description: >-
          Polymerizes into the extracellular filament required for cell-to-cell
          contact during the early stages of transfer.
      - id: pilin_maturation_chaperone
        label: Pilin maturation chaperone
        participant:
          selector_type: FAMILY
          family:
            preferred_term: TraQ-family pilin maturation chaperone family
            representative_members:
            - preferred_term: TraQ (Escherichia coli, F plasmid)
              term:
                id: UniProtKB:P18033
                label: Protein TraQ
        processes:
        - preferred_term: secretion by the type IV secretion system
          term:
            id: GO:0044097
            label: secretion by the type IV secretion system
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: >-
          Assists maturation of the pilin precursor in the inner membrane before
          polymerization.
        notes: >-
          No molecular function is asserted. This is a lineage-variable
          accessory factor and its mechanism is not captured by an existing GO
          molecular function term.
  - order: 6
    role: Stabilize the donor-recipient pair during transfer
    optional: true
    node:
      id: mating_pair_stabilization
      label: Mating-pair stabilization
      module_type: BIOLOGICAL_PROCESS
      description: >-
        Conjugative systems carry an outer-membrane adhesin that holds donor and
        recipient together once the pilus has made contact. Effector-translocator
        systems that act on eukaryotic host cells do not use this component, so
        the part is optional.
      annotons:
      - id: tran_mating_pair_adhesin
        label: TraN-family mating-pair stabilization adhesin
        participant:
          selector_type: FAMILY
          family:
            preferred_term: TraN-family mating-pair stabilization protein family
            representative_members:
            - preferred_term: TraN (Escherichia coli, F plasmid)
              term:
                id: UniProtKB:P24082
                label: Mating pair stabilization protein TraN
        processes:
        - preferred_term: unidirectional conjugation
          term:
            id: GO:0009291
            label: unidirectional conjugation
        locations:
        - preferred_term: cell outer membrane
          term:
            id: GO:0009279
            label: cell outer membrane
          description: Supported for TraN by direct assay.
        role_description: >-
          Holds the donor and recipient envelopes together so that transfer can
          proceed after contact.
  connections:
  - source: substrate_coupling_protein
    target: envelope_core_complex
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      The coupling protein delivers the selected substrate into the channel
      formed by the core complex.
  - source: virb4_family_atpase
    target: substrate_coupling_protein
    connection_type: POSITIVELY_REGULATES
    description: >-
      The VirB4-family motor supplies the energy for translocation through the
      coupling protein, which has no motor capacity sufficient on its own.
  - source: virb4_family_atpase
    target: conjugative_pilus
    connection_type: CAUSES
    description: >-
      VirB4-family activity is required for polymerization of mature pilin
      subunits into an extended pilus.
  - source: envelope_core_complex
    target: conjugative_pilus
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      The core complex provides the outer-membrane platform from which the
      filament extends.
  - source: virb11_family_atpase
    target: virb4_family_atpase
    connection_type: POSITIVELY_REGULATES
    description: >-
      Where present, the second ATPase acts alongside the VirB4-family motor at
      the inner membrane.
  - source: mating_pair_stabilization
    target: conjugative_pilus
    connection_type: POSITIVELY_REGULATES
    description: >-
      Stabilizing the mating pair converts transient pilus-mediated contact into
      a junction that persists for the duration of transfer.
  knowledge_gaps:
  - gap_statement: >-
      How the substrate physically moves through the apparatus is unresolved.
      Whether the pilus is a conduit for the substrate or only an attachment
      device that retracts to bring the cells together is not settled, and the
      two models imply different routes through the core complex.
    boundary: >-
      Model the pilus as a part of the apparatus and connect it to the ATPase and
      the core complex without asserting that the substrate passes through the
      filament.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Several components have no molecular function term that expresses what
      they do. The core-complex subunits carry the generic structural molecule
      activity, and the pilin maturation chaperone carries none at all, so the
      distinct architectural roles of the three core proteins are invisible to
      machine reasoning.
    boundary: >-
      Keep structural molecule activity on the core subunits and assert no
      function for the maturation chaperone, recording the specific roles in
      prose instead of borrowing an inaccurate term.
    gap_kind:
    - ONTOLOGY
  - gap_statement: >-
      Conserved-role assignment across transfer systems is obstructed by
      unstable gene symbols, with the same symbol naming different families on
      different plasmids. Whether the resulting annotations have been affected
      has not been assessed systematically.
    boundary: >-
      Assign every annoton by VirB or VirD4 family membership and name F
      proteins as counterparts, flagging on the affected annoton where an
      existing annotation may reflect a same-symbol protein from another
      plasmid.
    gap_kind:
    - CURATION
