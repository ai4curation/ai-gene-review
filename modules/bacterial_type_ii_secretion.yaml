id: MODULE:bacterial_type_ii_secretion
title: Bacterial type II secretion
description: >-
  A species-neutral module for export of folded proteins from the periplasm
  across the outer membrane by the type II secretion system of diderm
  (Gram-negative) bacteria. A multiprotein inner-membrane platform recruits the
  secretion ATPase and supports assembly of a dynamic pseudopilus, which
  displaces substrates through an oligomeric outer-membrane secretin. The
  pseudopilin subunits are matured by a prepilin peptidase shared with type IV
  pilus and competence systems. Delivery of substrates into the periplasm by Sec
  or Tat, substrate folding, and unrelated fimbrial or pilus systems are outside
  this module.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0015628
  title: protein secretion by the type II secretion system
  statement: GO:0015628 defines the biological process modeled by the reusable module.
- source_id: GO:0015627
  title: type II protein secretion system complex
  statement: GO:0015627 identifies the complete envelope-spanning secretion machinery represented by the four module parts.
- source_id: KEGG:ppu03070
  title: KEGG bacterial secretion system
  statement: >-
    The broad KEGG map contains multiple secretion routes; only its canonical
    Xcp/Gsp type II branch is instantiated here.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_type_ii_secretion__ppu03070-deep-research-openscientist.md
  title: OpenScientist PSEPK ppu03070 satisfiability review
  statement: >-
    The species/pathway/taxon report was used to distinguish the Xcp/Gsp branch
    from Sec, Tat, type I, type VI, TPS, and fimbrial candidates on the broad map.
- source_id: file:projects/P_PUTIDA/batches/ppu03070_bacterial_type_ii_secretion.tsv
  title: PSEPK ppu03070 type II secretion batch
  statement: >-
    The batch table records the exact twelve-protein Xcp/Gsp implementation and
    links each protein to its focused gene review.
notes: >-
  Reusable boundary: the module begins with the assembled type II secretion
  machine acting on folded periplasmic substrates and ends with passage through
  the outer-membrane secretin. Sec and Tat are upstream substrate-delivery
  routes, not parts of this module. Type IV pili share homologous ATPase,
  platform, prepilin, and secretin folds but are distinct surface structures;
  unrelated fimbrial proteins must not be admitted solely from shared domains.
  GspN-like proteins are lineage-variable accessory factors and are not forced
  into the conserved four-part core.


  Taxonomic scope: the machinery is confined to diderm bacteria, since it ends
  at an outer membrane, and every characterized system belongs to the
  Pseudomonadota (Klebsiella Pul, Vibrio Eps, Dickeya and Pectobacterium Out,
  Pseudomonas Xcp and Hxc, Aeromonas Exe, Xanthomonas Xps). The module's taxon
  context is therefore recorded as Bacteria with that restriction stated here
  rather than as a narrower taxon, because secretin-based systems also occur in
  other diderm lineages whose machinery is not characterized.


  Exemplar policy: each family descriptor carries the Pseudomonas putida KT2440
  member of the batch this module came from plus the corresponding Pseudomonas
  aeruginosa Xcp protein, the best-characterized complete system, and the
  Klebsiella PulC connector. The criterion for admitting an exemplar is that it
  has a gene review in which every annotation is actioned, with no PENDING or
  UNDECIDED row left; that is the sense in which the module's derived QC calls a
  review complete, and it reports 24 of 24 for the groundings here. The review
  files themselves differ in their declared status: the KT2440 set, PSEAE pilD,
  PSEAE xcpQ (promoted in the change that added its core molecular function) and
  the five reviews written for this module are COMPLETE, while PSEAE xcpR, xcpS,
  xcpV, xcpW and xcpX are still DRAFT although fully actioned, having come from
  the earlier PseudoCAP batch. Promoting those five is a judgement on their own
  evidence rather than on this module, so it is left to a review of them.
  Klebsiella Pul, Vibrio Eps and Dickeya Out members of the remaining parts
  (PulD, PulE, PulF, PulG, PulI, PulJ, PulK, PulL, PulM and their Eps and Out
  counterparts) are the natural next exemplars and are named in the family
  reviews under interpro/panther/; they are not listed here until those gene
  reviews exist, so that the module's grounding stays checkable.


  Family grounding: the PANTHER families of the machinery are reviewed in
  interpro/panther/PTHR30012, PTHR30093, PTHR30258, PTHR30332, PTHR30487,
  PTHR38779, PTHR38831 and PTHR39583, and each descriptor below states its own
  grounding and the reason for it; this paragraph only summarises them. Three
  roles use a PANTHER grounding. PTHR38831 (GspK) and PTHR30487 (the prepilin
  peptidase) are used at family level: every reviewed member of the first is a
  T2SS GspK protein, and every reviewed member of the second is an A24 prepilin
  peptidase, an enzyme that type II secretion shares with type IV pilus and
  competence systems by serving all of them. PTHR38779:SF2 (GspI) and
  PTHR39583:SF2 (GspJ) are used at subfamily level: SF2 of PTHR38779 holds only
  GspI proteins, while SF2 of PTHR39583 holds the GspJ clade together with
  Bacillus ComGD and a Thermus pilin-like protein, which is why its family
  review scopes the T2SS terms to the proteobacterial clade and the node PAINT
  restricts to Pseudomonadota.

  The other roles use a T2SS-specific InterPro or NCBIfam signature that both
  exemplars carry, because the PANTHER subfamily either crosses systems or
  leaves an in-scope one out: GspF (SF0 also holds the competence protein
  ComGB), GspG (SF44 also holds three reviewed type IV major pilins and, by
  PANTHER's own classification, the GspH minor pseudopilins), GspD (SF24 also holds filamentous-phage
  pIV proteins and excludes the Xanthomonas secretin XpsD of SF25, which the
  signature does cover) and GspE (SF27 excludes both the Xanthomonas XpsE and
  the Pseudomonas HxcR ATPases; the signature recovers HxcR but not XpsE, which
  matches only the broader type II/IV secretion domain, so no grounding here
  reaches XpsE).
  GspH, GspL and GspM use a signature for a different reason, which PANTHER's
  own classification settles rather than the cached UniProt records: both GspH
  exemplars are assigned to the GspG subfamily SF44, which does not separate the
  minor from the major pseudopilin and is not confined to type II secretion,
  while the GspL and GspM exemplars are in no PANTHER family at all, neither in
  PANTHER's per-release classification nor in UniProt's cross-reference. GspM is
  the one role InterPro splits between two sibling family entries, one per
  exemplar, so it declares both. GspC is left without a family
  term because no one entry covers its exemplars: the Klebsiella connector
  carries the GspC family entry IPR001639 with NCBIfam TIGR01713, while the
  Pseudomonas XcpP proteins match no InterPro entry and no PANTHER family.
module:
  id: bacterial_type_ii_secretion
  label: Bacterial type II secretion
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: protein secretion by the type II secretion system
    term:
      id: GO:0015628
      label: protein secretion by the type II secretion system
    description: Export of folded periplasmic proteins through the type II secretion machine.
  context:
    taxa:
    - preferred_term: bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
      description: The canonical diderm-bacterial type II secretion machinery.
  parts:
  - order: 1
    role: Coordinate the motor, pseudopilus, and secretin at the inner membrane
    node:
      id: inner_membrane_platform
      label: Type II secretion inner-membrane platform
      module_type: PROTEIN_COMPLEX
      description: >-
        The GspC/F/L/M platform spans the inner membrane, recruits the GspE
        motor, and couples pseudopilus assembly to the outer-membrane secretin.
      annotons:
      - id: gspc_connector
        label: GspC envelope connector
        participant:
          selector_type: FAMILY
          family:
            preferred_term: GspC/XcpP envelope-connector family
            description: >-
              GspC connectors are bitopic inner-membrane proteins whose
              periplasmic homology (HR) domain docks on the N0 ring at the base
              of the secretin. No one family grounding covers the exemplars: the
              Pseudomonas XcpP proteins match no InterPro entry and no PANTHER
              family, and are recognised by eggNOG COG3031 and locus context,
              while the Klebsiella connector carries the GspC family entry
              IPR001639 (NCBIfam TIGR01713, PROSITE PS01141). Declaring that
              entry would leave the Pseudomonas exemplar outside its own family
              term, so no term is asserted.
            representative_members:
            - preferred_term: xcpP (PSEPK)
              term:
                id: UniProtKB:Q88P08
                label: Type II secretion pathway protein XcpP
            - preferred_term: pulC (KLEPN)
              description: >-
                The Klebsiella Pul connector: the GspC protein whose role was
                first defined, and the one resolved in the assembled machine.
              term:
                id: UniProtKB:P15643
                label: Type II secretion system protein C
              evidence:
              - source_id: file:KLEPN/pulC/pulC-ai-review.yaml
                statement: >-
                  The focused review grounds P15643 as the GspC connector, with
                  the cryo-EM stoichiometry and the HR-domain contact at the base
                  of the secretin.
        processes:
        - preferred_term: protein secretion by the type II secretion system
          term:
            id: GO:0015628
            label: protein secretion by the type II secretion system
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: Couples the inner-membrane platform to the outer-membrane secretin.
        evidence:
        - source_id: file:PSEPK/xcpP/xcpP-ai-review.yaml
          statement: The focused review identifies Q88P08 as the GspC-equivalent connector in the Xcp machine.
      - id: gspf_platform_core
        label: GspF platform core
        participant:
          selector_type: FAMILY
          family:
            preferred_term: GspF polytopic platform family
            description: >-
              Grounded on the GspF-specific entry (NCBIfam TIGR02120), which
              both exemplars carry, rather than on PANTHER PTHR30012:SF0: that
              subfamily holds the type II secretion GspF proteins but also the
              Bacillus competence platform protein ComGB, while the type IV
              pilus and competence proteins PilC, HofC, TapC and TcpE sit in
              PTHR30012:SF7. The signature is what separates GspF from PilC on
              sequence; see interpro/panther/PTHR30012/PTHR30012-review.yaml for
              the family-level adjudication.
            term:
              id: InterPro:IPR011850
              label: Type II secretion system protein GspF
            representative_members:
            - preferred_term: gspF (PSEPK)
              term:
                id: UniProtKB:Q88P05
                label: General secretion pathway protein F
            - preferred_term: xcpS (PSEAE)
              term:
                id: UniProtKB:Q00513
                label: Type II secretion system protein F
              evidence:
              - source_id: file:PSEAE/xcpS/xcpS-ai-review.yaml
                statement: >-
                  The focused review accepts the inner-membrane location and the
                  XcpRSYZ platform membership of Q00513, whose topology was
                  mapped experimentally.
        processes:
        - preferred_term: protein secretion by the type II secretion system
          term:
            id: GO:0015628
            label: protein secretion by the type II secretion system
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: Forms the central polytopic membrane-platform subunit.
        evidence:
        - source_id: file:PSEPK/gspF/gspF-ai-review.yaml
          statement: The focused review accepts inner-membrane, T2SS-complex, and T2SS-process annotations for Q88P05.
      - id: gspl_atpase_receptor
        label: GspL ATPase-facing platform subunit
        participant:
          selector_type: FAMILY
          family:
            preferred_term: GspL ATPase-facing platform family
            description: >-
              GspL proteins have a large cytoplasmic domain that binds the
              secretion ATPase, one transmembrane helix, and a periplasmic
              ferredoxin-like domain that dimerises. PANTHER assigns the
              exemplars to no family, so the descriptor uses the GspL
              periplasmic-domain signature; NCBIfam TIGR01709 covers the family
              in the members that carry it. Both exemplars match IPR025691 in the
              UniProt records cached here, but the current InterPro release has
              withdrawn the match for the P. putida protein, which now matches
              only the ATPase nucleotide-binding superfamily IPR043129; checked
              against the InterPro API on 2026-11-17. The term stays, because the
              entry is the right family concept for this role and the withdrawal
              looks like a model or threshold change rather than evidence that the
              protein is not a GspL, whose identity also rests on its position in
              the xcp locus. It is recorded here so that the next refresh of that
              record is read as a signature change and not as a new grounding
              error.
            term:
              id: InterPro:IPR025691
              label: GspL periplasmic domain
            representative_members:
            - preferred_term: xcpY (PSEPK)
              term:
                id: UniProtKB:Q88P00
                label: Type II secretion pathway protein XcpY
            - preferred_term: xcpY (PSEAE)
              term:
                id: UniProtKB:P25060
                label: Type II secretion system protein L
              evidence:
              - source_id: file:PSEAE/xcpY/xcpY-ai-review.yaml
                statement: >-
                  The focused review grounds P25060 in the XcpYZ unit that
                  recruits the XcpR ATPase and XcpS, with its topology mapped
                  experimentally.
        processes:
        - preferred_term: protein secretion by the type II secretion system
          term:
            id: GO:0015628
            label: protein secretion by the type II secretion system
        locations:
        - preferred_term: plasma membrane
          term:
