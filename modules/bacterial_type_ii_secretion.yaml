            family_terms:
            - id: InterPro:IPR007690
              label: Type II secretion system protein GspM
            - id: InterPro:IPR030927
              label: Type II secretion system protein GspM, XcpZ-type
            representative_members:
            - preferred_term: xcpZ (PSEPK)
              term:
                id: UniProtKB:Q88NZ9
                label: Type II secretion pathway protein XcpZ
            - preferred_term: xcpZ (PSEAE)
