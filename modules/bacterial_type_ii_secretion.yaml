id: MODULE:bacterial_type_ii_secretion
title: Bacterial type II secretion
description: >-
  A species-neutral module for export of folded proteins from the periplasm
  across the outer membrane by the type II secretion system. A multiprotein
  inner-membrane platform recruits the secretion ATPase and supports assembly of
  a dynamic pseudopilus, which displaces substrates through an oligomeric
  outer-membrane secretin. Delivery of substrates into the periplasm by Sec or
  Tat, substrate folding, and unrelated fimbrial or pilus systems are outside
  this module.
status: DRAFT
evidence:
- source_id: GO:0015628
  title: protein secretion by the type II secretion system
  statement: GO:0015628 defines the biological process modeled by the reusable module.
- source_id: GO:0015627
  title: type II protein secretion system complex
  statement: GO:0015627 identifies the complete envelope-spanning secretion machinery represented by the four module parts.
- source_id: KEGG:ppu03070
  title: KEGG bacterial secretion system
  statement: >-
    The broad KEGG map contains multiple secretion routes; only its canonical
    Xcp/Gsp type II branch is instantiated here.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_type_ii_secretion__ppu03070-deep-research-openscientist.md
  title: OpenScientist PSEPK ppu03070 satisfiability review
  statement: >-
    The species/pathway/taxon report was used to distinguish the Xcp/Gsp branch
    from Sec, Tat, type I, type VI, TPS, and fimbrial candidates on the broad map.
- source_id: file:projects/P_PUTIDA/batches/ppu03070_bacterial_type_ii_secretion.tsv
  title: PSEPK ppu03070 type II secretion batch
  statement: >-
    The batch table records the exact twelve-protein Xcp/Gsp implementation and
    links each protein to its focused gene review.
notes: >-
  Reusable boundary: the module begins with the assembled type II secretion
  machine acting on folded periplasmic substrates and ends with passage through
  the outer-membrane secretin. Sec and Tat are upstream substrate-delivery
  routes, not parts of this module. Type IV pili share homologous ATPase,
  platform, prepilin, and secretin folds but are distinct surface structures;
  unrelated fimbrial proteins must not be admitted solely from shared domains.
  GspN-like proteins are lineage-variable accessory factors and are not forced
  into the conserved four-part core.
