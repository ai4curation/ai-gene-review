id: MODULE:dmel_hedgehog_signaling
title: Hedgehog signaling pathway in Drosophila melanogaster
description: >-
  Hedgehog (Hh) is a secreted morphogen that is autoprocessed and modified with cholesterol
  and, by the acyltransferase Rasp, with palmitate. The transmembrane protein Dispatched releases
  lipid-modified Hh from producing cells. In receiving cells Hh binds its receptor Patched
  together with the co-receptors Ihog and Boi. In the absence of Hh, Patched keeps the seven-pass
  transmembrane protein Smoothened inactive, and the Hedgehog signaling complex of the kinesin-like
  protein Costal-2 (Cos), the kinase Fused and the zinc-finger transcription factor Cubitus
  interruptus (Ci) promotes processing of Ci into a repressor form. Hh binding relieves Patched
  inhibition, Smoothened accumulates at the plasma membrane and recruits the Cos-Fused complex,
  Ci processing is blocked and full-length Ci activates Hh target genes. The pathway patterns
  embryonic segments and the anterior-posterior axis of imaginal discs.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000978
  title: 'FlyBase gene group HH-SMO: Hedgehog signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 98 D. melanogaster genes as hedgehog signaling pathway
    (HH-SMO); this module models that group.
- source_id: FB:FBgg0001342
  title: 'FlyBase gene group HSC: Hedgehog signaling complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as hedgehog signaling complex
    (HSC); this module models that group.
- source_id: GO:0007224
  title: smoothened signaling pathway
  statement: >-
    GO term grounding the module as smoothened signaling pathway.
notes: >-
  Boundary. Core components (FlyBase HH-SMOC), Hh production (HH-PRO) and the Hedgehog signaling
  complex (HSC). Patched is listed by FlyBase only as a negative regulator (HH-SMON); it is
  added here as the Hh receptor because the pathway cannot be decomposed without it. Other
  regulators (PKA, CK1, Sgg, Su(fu), Slimb, glypicans) are not parts. Costal-2 and Fused are
  also listed by FlyBase as negative regulators, reflecting their roles in Ci processing.
  FlyBase groups realized by this module: HH-SMO (FBgg0000978), HSC (FBgg0001342). Subgroups
  folded into it: HH-SMOC, HH-PRO. FlyBase also curates regulator sets for this pathway, which
  are context and not modelled as parts: HH-SMON (negative regulators of hedgehog signaling
  pathway, 58 genes); HH-SMOP (positive regulators of hedgehog signaling pathway, 43 genes).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_hedgehog_signaling.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
