proposed_new_terms:
- proposed_name: histone acetyltransferase type B complex
  proposed_definition: >-
    A protein complex that catalyzes the acetylation of lysine residues on newly synthesized
    histone H4 that has not yet been incorporated into chromatin. In Saccharomyces cerevisiae the
    complex comprises the catalytic subunit Hat1 and the WD40 subunit Hat2, and in the nucleus
    also the histone chaperone Hif1.
  justification: >-
    The type B histone acetyltransferase is a well-characterized complex with no GO term. Its
    subunits are currently annotated to GO:0000123 histone acetyltransferase complex, which is
    part_of GO:0000785 chromatin, although the complex is defined by acting on histones that are
    not in chromatin. The proposed parent is GO:0031248 protein acetyltransferase complex rather
    than GO:0000123 for that reason; see proposed_ontology_changes. A synonym "HAT-B complex" and
    a narrow synonym "NuB4 complex" (the nuclear form) would cover common usage.
  proposed_parent:
    id: GO:0031248
    label: protein acetyltransferase complex
  supported_by:
  - reference_id: PMID:8858151
    supporting_text: This enzyme acetylates the lysine at residue 12 of free histone H4 but does not
      modify histone H4 when packaged in chromatin.
  - reference_id: PMID:14761951
    supporting_text: Hif1 is a component of a yeast heterotrimeric HAT-B complex, in which Hat2 bridges
      Hat1 and Hif1 proteins
proposed_ontology_changes:
- change_type: EDGE_DELETION
  ontology: GO
  about_node:
    id: GO:0000123
    label: histone acetyltransferase complex
  subject:
    id: GO:0000785
    label: chromatin
  predicate: BFO:0000050
  change_dsl: delete edge GO:0000123 BFO:0000050 GO:0000785
  justification: >-
    GO:0000123 is logically defined as any protein-containing complex capable of histone
    acetyltransferase activity, and it is part_of GO:0000785 chromatin, so every such complex is
    inferred to be part of chromatin. The type B enzyme is a counterexample: it acetylates soluble
    histone H4 and does not modify H4 packaged in chromatin, yet its three yeast subunits carry
    part_of GO:0000123 annotations and therefore inherit part_of chromatin. HAT-B can be
    recruited to chromatin next to a double-strand break, so the complex is sometimes on chromatin
    but not always part of it, which is what part_of asserts. The edge was added in
    geneontology/go-ontology#23892 because the previous parent, nucleoplasm, is defined to exclude
    chromosomes. A logically defined grouping class should carry no location; the specific HAT
    complexes can carry nucleus themselves. The same inconsistency affects other chromatin-acting
    complexes and is set out in a broader issue on the children of chromatin.
  origin: SELF_PROPOSED
  stance: AGREE
  confidence: PROBABLE
  request_status: NOT_FILED
  ontology_state_verified: '2026-11-14'
  affected_annotations:
  - UniProtKB:Q12341 HAT1 part_of GO:0000123 (IDA PMID:8858151, PMID:9575221; IPI PMID:8858151,
    PMID:18373695)
  - UniProtKB:P39984 HAT2 part_of GO:0000123 (IDA PMID:8858151, PMID:9575221; IPI PMID:8858151,
    PMID:18373695)
  - UniProtKB:Q12373 HIF1 part_of GO:0000123 (IDA PMID:14761951, PMID:15099519; IMP and IPI
    PMID:14761951; IPI PMID:18373695)
  supported_by:
  - reference_id: PMID:8858151
    supporting_text: This enzyme acetylates the lysine at residue 12 of free histone H4 but does not
      modify histone H4 when packaged in chromatin.
  - reference_id: PMID:16612003
    supporting_text: we found that Hat1p becomes associated with chromatin near the site of DNA
      damage
knowledge_gaps:
- gap_statement: >-
    It is unresolved whether HAT-B acts on free histone H4 or on the newly assembled H3-H4
    heterodimer in vivo.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    The answer decides whether HAT-B acetylation happens before or after H3-H4 dimerization, and
    so where it sits relative to Asf1 and Rtt109 in the new-histone pathway. Ai and Parthun found
    the nuclear complex bound to acetylated H4 and to H3, and structural work shows Hat2 binding
    the H3 tail; Poveda and Sendra found no H3 in any HAT-B immunoprecipitate.
  provenance:
  - reference_id: PMID:15099519
    supporting_text: In vivo, the nuclear Hat1p/Hat2p/Hif1p complex is bound to acetylated histone
      H4, as well as histone H3.
  - reference_id: PMID:18373695
    supporting_text: histone H3 was not found in any of the immunoprecipitates obtained with the
      different components of the HAT-B enzyme
- gap_statement: >-
    What the nuclear HAT-B complex does at chromatin next to a DNA double-strand break is unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Hat1 and Hif1 are recruited to a break and Hat1 is needed for the break-induced rise in H4 K12
    acetylation, but whether the complex acetylates histones there, delivers new histones for
    reassembly, or does something else has not been shown.
  provenance:
  - reference_id: PMID:16612003
    supporting_text: The nuclear Hat1p-associated histone chaperone Hif1p is also recruited to an
      HO-induced DSB with a similar distribution.
