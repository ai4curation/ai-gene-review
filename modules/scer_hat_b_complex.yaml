id: MODULE:scer_hat_b_complex
title: Histone acetyltransferase B (Hat1-Hat2-Hif1) complex in Saccharomyces cerevisiae
description: >-
  Histone acetyltransferase B (HAT-B) is the type B histone acetyltransferase of budding yeast.
  It acetylates newly synthesized histone H4 on lysine 12, and to a lesser extent lysine 5,
  before the histone is deposited into chromatin. The catalytic subunit Hat1 is a GNAT-family
  acetyltransferase. Hat2, a WD40 protein of the RbAp46/RbAp48/Msi1 family, binds the histone
  tails, raises Hat1's affinity for histone H4 and is needed for Hat1 to enter the nucleus. The
  Hat1-Hat2 heterodimer is found in both the cytoplasm and the nucleus. In the nucleus it binds
  a third subunit, Hif1, a NASP-family histone H3-H4 chaperone that promotes histone deposition.
  HAT-B acts on soluble, non-chromatin-bound histone H4 and does not acetylate histone H4 packaged
  in nucleosomes. Loss of HAT-B subunits impairs telomeric silencing (when combined with histone
  H3 tail mutations) and DNA double-strand break repair, and Hat1 and Hif1 are recruited to
  chromatin next to a double-strand break.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:8858151
  title: 'The major cytoplasmic histone acetyltransferase in yeast: links to chromatin replication
    and histone metabolism.'
  statement: >-
    Defines the boundary: the predominant cytoplasmic HAT activity is a Hat1-Hat2 complex that
    acetylates free histone H4 but not chromatin-packaged H4.
  supporting_text: This enzyme acetylates the lysine at residue 12 of free histone H4 but does not
    modify histone H4 when packaged in chromatin.
- source_id: PMID:14761951
  title: Hif1 is a component of yeast histone acetyltransferase B, a complex mainly localized in
    the nucleus.
  statement: >-
    Adds Hif1 as the third subunit, bridged to Hat1 through Hat2.
  supporting_text: Hif1 is a component of a yeast heterotrimeric HAT-B complex, in which Hat2 bridges
    Hat1 and Hif1 proteins
- source_id: PMID:15099519
  title: 'The nuclear Hat1p/Hat2p complex: a molecular link between type B histone acetyltransferases
    and chromatin assembly.'
  statement: >-
    The Hat1-Hat2 complex occurs in both compartments; the nuclear form copurifies with Hif1.
  supporting_text: The yeast Hat1p/Hat2p type B histone acetyltransferase complex is localized to
    both the cytoplasm and nucleus.
notes: >-
  Boundary. The module contains the three HAT-B subunits, Hat1 (catalytic), Hat2 (histone-binding
  WD40 subunit) and Hif1 (histone H3-H4 chaperone). Hat1 and Hat2 form the cytoplasmic
  heterodimer; Hif1 joins only in the nucleus, so its part is marked optional. Histone H3 and H4
  are substrates, not parts. Downstream histone chaperones and deposition factors (Asf1, CAF-1,
  Rtt106) and the H3K56 acetyltransferase Rtt109-Vps75, which also act on newly synthesized
  histones, belong to separate modules.

  Ontology. GO has no term for the type B histone acetyltransferase complex, so the module
  concept carries no GO id and the term is requested under proposed_new_terms. GOA currently
  annotates all three subunits part_of GO:0000123 histone acetyltransferase complex (IDA and
  IPI). That class is part_of GO:0000785 chromatin, so these annotations entail that HAT-B is
  part of chromatin, which contradicts the defining property of a type B enzyme. The edge is
  questioned under proposed_ontology_changes. Because GO:0000123 is logically defined as any
  complex capable of histone acetyltransferase activity, a new HAT-B term placed anywhere would
  still be classified under it, and so under chromatin, until that edge is removed.

  Substrate site. The purified complex acetylates only H4 K12 on peptide substrates, while
  recombinant Hat1 and the complex in vivo also acetylate K5 (PMID:18373695). The catalytic
  annoton uses the K12 activity, the primary and best-supported site.

  None of the three member genes had a gene review before this module; scaffolds were created
  with just fetch-gene and their annotations are still PENDING.
