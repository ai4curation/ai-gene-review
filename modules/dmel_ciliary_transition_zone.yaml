id: MODULE:dmel_ciliary_transition_zone
title: Ciliary transition zone components in Drosophila melanogaster
description: >-
  The transition zone is the region at the base of the cilium, just above the basal body,
  where Y-shaped links connect the axoneme to the ciliary membrane and form a diffusion barrier
  that controls which proteins enter the cilium. Its components include the MKS module, a
  membrane-associated complex of B9-domain proteins (B9d1, B9d2, Mks1), Cc2d2a and Tectonic,
  and Cep290, which links the barrier to the axoneme. In Drosophila, transition zone proteins
  act in the cilia of sensory neurons and in the long transition-zone-like region of spermatocyte
  cilia. Cep290, Chibby, Dilatory (Cep131) and Unc localize to the transition zone or basal
  body and are needed to assemble it and the cilium.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000607
  title: 'FlyBase gene group TZ: Transition zone components'
  statement: >-
    FlyBase release FB2026_03 groups 10 D. melanogaster genes as transition zone components
    (TZ); this module models that group.
- source_id: FB:FBgg0000608
  title: 'FlyBase gene group MKS: Mks complex'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as mks complex (MKS); this module
    models that group.
- source_id: FB:FBgg0000609
  title: 'FlyBase gene group CEP290C: Cep290 complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as cep290 complex (CEP290C);
    this module models that group.
- source_id: GO:0035869
  title: ciliary transition zone
  statement: >-
    GO term grounding the module as ciliary transition zone.
notes: >-
  FlyBase groups TZ (all transition zone components), MKS and CEP290C overlap; the MKS and
  Cep290 complexes are modelled as parts, and TZ members outside them (Cby, dila, unc) as
  a third part. CG4975 is an Ataxin-10 homolog placed with Cep290 by FlyBase. An NPHP module
  comparable to the vertebrate NPHP1-NPHP4-RPGRIP1L complex is not represented in the FlyBase
  groups and is not modelled. FlyBase groups realized by this module: TZ (FBgg0000607), MKS
  (FBgg0000608), CEP290C (FBgg0000609). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_ciliary_transition_zone.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
