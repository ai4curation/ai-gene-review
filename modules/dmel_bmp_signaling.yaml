id: MODULE:dmel_bmp_signaling
title: BMP signaling pathway in Drosophila melanogaster
description: >-
  Bone morphogenetic protein (BMP) signaling in Drosophila is triggered by the ligands Decapentaplegic
  (Dpp), Glass bottom boat (Gbb) and Screw (Scw), which act as homo- or heterodimers. Ligands
  bind heteromeric complexes of type I receptor kinases (Thickveins, Saxophone) and type II
  receptor kinases (Punt, Wishful thinking). The activated type I receptor phosphorylates
  the receptor-regulated SMAD Mad, which forms a complex with the co-SMAD Medea and accumulates
  in the nucleus. With the zinc-finger protein Schnurri, the Mad-Medea complex represses brinker
  and activates other targets. The pathway patterns the dorsal-ventral axis of the embryo
  and the wing imaginal disc, maintains germline stem cells, and regulates synaptic growth
  at the neuromuscular junction, where Gbb and Wishful thinking act.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001086
  title: 'FlyBase gene group BMP-MAD: Bmp signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 69 D. melanogaster genes as bmp signaling pathway (BMP-MAD);
    this module models that group.
- source_id: GO:0030509
  title: BMP signaling pathway
  statement: >-
    GO term grounding the module as BMP signaling pathway.
notes: >-
  Boundary. Core components only (FlyBase BMP-C). Medea and the type II receptors Punt and
  Wishful thinking are shared with the activin pathway. Extracellular modulators (Sog, Tsg,
  Tolloid, Crossveinless-2) and the repressor Brinker are FlyBase regulators and are not parts.
  Maverick is kept in the ligand part because FlyBase lists it as core, but no receptor activity
  or ligand activity is asserted for it. FlyBase groups realized by this module: BMP-MAD (FBgg0001086).
  Subgroups folded into it: BMP-C. FlyBase also curates regulator sets for this pathway, which
  are context and not modelled as parts: BMP-N (negative regulators of bmp signaling pathway,
  41 genes); BMP-P (positive regulators of bmp signaling pathway, 22 genes). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_bmp_signaling.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
