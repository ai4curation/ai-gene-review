id: MODULE:dmel_polycomb_group_complexes
title: Polycomb group repressive complexes in Drosophila melanogaster
description: >-
  Polycomb group (PcG) proteins maintain the repressed state of developmental regulators such
  as the Hox genes through cell divisions. They act through several distinct complexes recruited
  to Polycomb response elements (PREs). PRC2 trimethylates histone H3 lysine 27 through the
  E(z) methyltransferase. PRC1 binds H3K27me3 through the Polycomb chromodomain and compacts
  chromatin. dRAF and the variant PRC1-like complexes monoubiquitylate histone H2A lysine
  118 through the Sce (dRing) E3 ligase. PhoRC, built around the sequence-specific DNA-binding
  protein Pho (or its paralog Phol) and Sfmbt, helps target PcG complexes to PREs. PR-DUB,
  formed by Calypso and Asx, removes H2A ubiquitin.
status: DRAFT
scope: CONCRETE
