id: MODULE:dmel_eggshell_structural_proteins
title: Eggshell structural proteins in Drosophila melanogaster
description: >-
  The Drosophila eggshell is secreted by the somatic follicle cells that surround the oocyte
  during late oogenesis. The vitelline membrane, the innermost layer, is laid down first from
  vitelline membrane proteins (Vm26Aa, Vm26Ab, Vm26Ac, Vm32E, Vm34Ca and Vml) that are cross-linked
  into an insoluble layer. The chorion is secreted afterwards and is built from chorion proteins
  encoded mainly by two clusters: an X-linked cluster at 7F (Cp36, Cp38 and Cp7Fa-c) and an
  autosomal cluster at 66D (Cp15, Cp16, Cp18 and Cp19). The chorion gene clusters are amplified
  in follicle cells by developmentally regulated DNA re-replication, which allows the large
  and rapid synthesis of chorion proteins.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001184
  title: 'FlyBase gene group VMP: Vitelline membrane proteins'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as vitelline membrane proteins
    (VMP); this module models that group.
- source_id: FB:FBgg0001188
  title: 'FlyBase gene group CHORN: Chorion proteins'
  statement: >-
    FlyBase release FB2026_03 groups 9 D. melanogaster genes as chorion proteins (CHORN);
    this module models that group.
- source_id: GO:0007304
  title: chorion-containing eggshell formation
  statement: >-
    GO term grounding the module as chorion-containing eggshell formation.
notes: >-
  Each protein is a separate annoton (complex false): the eggshell layers are cross-linked
  extracellular structures, not defined stoichiometric complexes. Vitelline membrane proteins
  are assigned to the vitelline envelope GO component. Several eggshell components outside
  the two FlyBase groups (for example the dec-1 proteins, and peroxidases and other enzymes
  that cross-link the layers) are not modelled. The structural-constituent functions of most
  chorion and vitelline membrane proteins rest on their localization and curator inference
  rather than gene-by-gene mutant analysis. FlyBase groups realized by this module: VMP (FBgg0001184),
  CHORN (FBgg0001188). Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_eggshell_structural_proteins.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
