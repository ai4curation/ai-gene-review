id: MODULE:chylomicron_assembly_secretion
title: Chylomicron assembly and ER export in enterocytes; MTTP, APOB (apoB-48) and SAR1B
description: >-
  Dietary fat is exported from absorptive enterocytes as chylomicrons, large
  triglyceride-rich lipoproteins built on a single apolipoprotein B-48 molecule.
  In the endoplasmic reticulum, microsomal triglyceride transfer protein (MTTP,
  with protein disulfide isomerase as its small subunit) transfers neutral lipid
  onto apoB-48 as it is translated, producing a primordial lipoprotein that is
  then expanded into a pre-chylomicron. ApoB-48 is the non-exchangeable
  structural scaffold of the particle. The pre-chylomicron leaves the ER in a
  COPII-dependent carrier whose formation is started by the small GTPase SAR1B:
  GTP-bound SAR1B inserts into the ER membrane at exit sites and recruits the
  SEC23-SEC24 and SEC13-SEC31 coats. After Golgi maturation, the chylomicron is
  secreted basolaterally into lymph. The three steps correspond to three
  recessive fat-malabsorption disorders. Abetalipoproteinemia (MTTP) and
  homozygous familial hypobetalipoproteinemia 1 (APOB) block particle
  formation. Chylomicron retention disease (SAR1B) leaves particle formation
  intact but blocks ER exit.
status: DRAFT
evidence:
  - source_id: GO:0034378
    title: chylomicron assembly
    statement: >-
      The module covers chylomicron assembly (lipidation of apoB-48 in the ER) and
      the COPII-dependent ER export of the nascent particle.
  - source_id: file:human/SAR1B/SAR1B-ai-review.yaml
    title: SAR1B gene review (human)
    statement: >-
      The ER-export step (UniProtKB:Q9Y6B6, GO:0003924 GTPase activity, COPII
      vesicle coat assembly, lipoprotein transport) matches the core functions of
      the human SAR1B review.
  - source_id: file:human/APOB/APOB-ai-review.yaml
    title: APOB gene review (human)
    statement: >-
      The scaffold step (UniProtKB:P04114, GO:0005319 lipid carrier activity, ER
      lumen) matches the first core function of the human APOB review.
  - source_id: PMID:12692552
    title: Mutations in a Sar1 GTPase of COPII vesicles are associated with lipid absorption disorders.
    statement: >-
      SAR1B (SARA2) mutations cause chylomicron retention disorders. The authors
      conclude that chylomicrons are selectively recruited by the COPII machinery
      for ER export despite exceeding typical COPII vesicle size.
  - source_id: PMID:28982670
    title: "Understanding Chylomicron Retention Disease Through Sar1b Gtpase Gene Disruption: Insight From Cell Culture."
    statement: >-
      SAR1B deletion in Caco-2/15 enterocyte-like cells reduces apoB-48 and
      chylomicron secretion; a SAR1A/SAR1B double knockout almost abolishes it.
  - source_id: UniProtKB:P55157
    title: Microsomal triglyceride transfer protein large subunit
    statement: >-
      UniProt records MTTP lipid-transfer activity (triglyceride, cholesteryl ester
      and phospholipid transfer) and its requirement for apoB-containing
      lipoprotein secretion (PMID:8876250; PMID:15897609). MTTP has no
      ai-gene-review gene review yet.
notes: >-
  Scope is the enterocyte biogenesis and ER-export arm. Hepatic VLDL assembly
  uses the same MTTP and SAR1B steps with full-length apoB-100, and SURF4 acts
  as the SAR1B-paired cargo receptor for hepatic lipoprotein export
  (PMID:33186557); these are context rather than separate parts here. Golgi
  maturation and basolateral secretion are downstream of this module. SAR1A
  partially overlaps SAR1B in enterocyte chylomicron export (PMID:28982670),
  but upregulated SAR1A does not compensate in patients (PMID:21235735).
  PANTHER family ids are omitted because the participants are grounded as
  concrete human gene products.
