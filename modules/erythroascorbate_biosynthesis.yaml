  connections:
    - source: arabinose_dehydrogenase_step
      target: arabinonolactone_oxidase_step
      connection_type: PRECEDES
      description: >-
        D-arabinono-1,4-lactone made in the cytosol is oxidised by the
        mitochondrial-membrane lactone oxidase.
      chaining_status: NOT_APPLICABLE
      chaining_note: Sugar-lactone intermediates; no CoA carrier involved.
  notes: >-
    Boundary: from free D-arabinose to erythroascorbate. Recycling of oxidised
    erythroascorbate and its antioxidant reactions are outside the module.
    Homology and generalisation: PANTHER family PTHR43762 contains S. cerevisiae
    ALO1 and S. pombe alo1 (SF1, D-arabinono-1,4-lactone oxidase), rat and
    mouse Gulo (SF8) and Arabidopsis GLDH (SF1). The module therefore names the
    family, but only the fungal enzyme is a representative member, because the
    animal and plant homologs make L-ascorbate in different pathways. S. pombe
    alo1 (UniProtKB:Q9HDX8) has its own gene review; it is not listed as a
    representative because this group has no PomBase GO-CAM. The ARA1 and ARA2
    dehydrogenases are both aldo-keto reductases (UniProt similarity), but
    PANTHER places them in different families. Naming: the literature calls the
    product D-erythroascorbic acid, while IUBMB and ChEBI (since 2008) call it
    dehydro-D-arabinono-1,4-lactone; the GO process term uses the latter.
knowledge_gaps:
  - gap_statement: >-
      The physiological source of D-arabinose in yeast is unknown, and an
      ara1 ara2 double mutant still makes some erythroascorbate. Neither the
      upstream supply of the sugar nor a possible third dehydrogenase or route
      has been identified.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
