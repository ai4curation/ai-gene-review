id: MODULE:erythroascorbate_biosynthesis
title: D-erythroascorbate (dehydro-D-arabinono-1,4-lactone) biosynthesis
description: >-
  In fungi, D-erythroascorbate, the five-carbon analogue of L-ascorbate, is made
  from D-arabinose in two oxidations. The IUBMB and ChEBI name for it is
  dehydro-D-arabinono-1,4-lactone. First, a cytosolic aldo-keto-reductase-type
  D-arabinose 1-dehydrogenase oxidises D-arabinose to D-arabinono-1,4-lactone,
  using NAD+ or NADP+. Second, a membrane-bound, FAD-dependent
  D-arabinono-1,4-lactone oxidase in the mitochondria oxidises the lactone with
  O2, giving dehydro-D-arabinono-1,4-lactone and hydrogen peroxide. The terminal
  oxidase belongs to the aldonolactone oxidoreductase group of the vanillyl
  alcohol oxidase flavoprotein superfamily. Its homologs make L-ascorbate in
  animals (L-gulono-1,4-lactone oxidase) and plants (L-galactono-1,4-lactone
  dehydrogenase), and the yeast enzyme can also oxidise L-gulono- and
  L-galactono-1,4-lactone. Erythroascorbate is thought to act as an
  antioxidant: yeast cells lacking the oxidase are more sensitive to oxidative
  stress, although its importance under normal conditions is debated.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: YeastPathways:PWY3O-6-1
    title: dehydro-D-arabinono-1,4-lactone biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists RXN3O-9798 (ARA1, NAD(P)+), RXN3O-9797 (ARA2, NAD+) and
      1.1.3.37-RXN (ALO1). All three gene assignments were kept. The two
      dehydrogenases are modelled as alternative, co-occurring routes into the
      lactone. ARA2, not ARA1, is the main contributor in vivo
      (PMID:17097644, PMID:17151466). The YeastCyc and GO-CAM cytosol location
      for ALO1 was changed to the mitochondrial membrane (PMID:10094636).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-6-1
  - source_id: GO:0070485
    title: dehydro-D-arabinono-1,4-lactone biosynthetic process
    statement: The module is grounded in the GO biological-process term for erythroascorbate biosynthesis.
  - source_id: PMID:10094636
    title: D-Erythroascorbic acid is an important antioxidant molecule in Saccharomyces cerevisiae.
    statement: >-
      D-arabinono-1,4-lactone oxidase was purified from the mitochondrial
      fraction and identified as ALO1/YML086C, which has a covalent FAD-binding
      site and is 32% identical to rat L-gulono-1,4-lactone oxidase. alo1
      mutants contain no erythroascorbate and are sensitive to oxidative
      stress.
  - source_id: PMID:9920381
    title: D-arabinose dehydrogenase and its gene from Saccharomyces cerevisiae.
    statement: >-
      Cytosolic NADP+-dependent D-arabinose dehydrogenase encoded by
      YBR149W/ARA1, an aldo-keto reductase. Erythroascorbate was formed in vitro
      from D-arabinose by this dehydrogenase together with
      D-arabinono-1,4-lactone oxidase.
  - source_id: PMID:17097644
    title: >-
      NAD+-specific D-arabinose dehydrogenase and its contribution to
      erythroascorbic acid production in Saccharomyces cerevisiae.
    statement: >-
      YMR041c/ARA2, homologous to plant L-galactose dehydrogenase, is an
      NAD+-specific D-arabinose dehydrogenase whose Km for D-arabinose is
      200-fold lower than that of Ara1p. It is the main source of
      erythroascorbate made from D-arabinose.
  - source_id: PMID:17151466
    title: >-
      NADP(+)-dependent D-arabinose dehydrogenase shows a limited contribution
      to erythroascorbic acid biosynthesis and oxidative stress resistance in
      Saccharomyces cerevisiae.
    statement: >-
      Ara1p is a homodimer, and the earlier "small subunit" is a degradation
      product. An ara1 mutant still has half its normal erythroascorbate, so
      Ara1p contributes only a limited share.
  - source_id: PMID:11281285
    title: The biosynthesis of erythroascorbate in Saccharomyces cerevisiae and its role as an antioxidant.
    statement: >-
      Yeast makes erythroascorbate from D-arabinose or D-arabinono-1,4-lactone.
      This study found little antioxidant importance for erythroascorbate under
      the conditions tested.
  - source_id: PMID:26696130
    title: Recent progress on the characterization of aldonolactone oxidoreductases.
    statement: >-
      Review placing the aldonolactone oxidoreductases (animal GULO, plant
      GLDH/GULO, fungal ALO) in the flavin-dependent VAO superfamily, where they
      catalyse the terminal step of ascorbate-type biosynthesis.
