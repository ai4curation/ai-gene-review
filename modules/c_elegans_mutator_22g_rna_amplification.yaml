    - order: 6
      role: loading of 22G-RNAs into effector Argonautes
      node:
        id: effector_loading
        label: 22G-RNA effector Argonaute branches
        module_type: BIOLOGICAL_PROCESS
        description: >-
          RdRP-derived 22G-RNAs are partitioned between Argonaute clades with
          opposite effects. Mutator-dependent 22G-RNAs load WAGOs, which
          silence their targets. EGO-1-derived 22G-RNAs load CSR-1, which
          licenses expression of its targets.
        variant_sets:
          - id: twenty_two_g_branches
            label: Germline 22G-RNA Argonaute branches
            axis: Argonaute clade, RdRP and Mutator dependence
            selection: ONE_OR_MORE
            notes: >-
              The two branches coexist in every germ cell and partition the
              germline transcriptome between them. Only the WAGO branch is
              an output of the Mutator machinery modeled in parts 1-4.
            variants:
              - id: wago_silencing_branch
                label: Mutator-dependent WAGO silencing branch
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  WAGO-1 is a worm-specific Argonaute without slicer residues.
                  It binds Mutator/RdRP-derived 22G-RNAs in P granules and
                  silences transposons, pseudogenes and cryptic loci.
                annotons:
                  - id: wago1_effector
                    label: WAGO-1 22G-RNA-bound silencing Argonaute
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: WAGO-1
                        term:
                          id: UniProtKB:Q21770
                          label: Argonaute protein wago-1
                    function:
                      preferred_term: siRNA binding
                      term:
                        id: GO:0035197
                        label: siRNA binding
                    processes:
                      - preferred_term: regulatory ncRNA-mediated post-transcriptional gene silencing
                        term:
                          id: GO:0035194
                          label: regulatory ncRNA-mediated post-transcriptional gene silencing
                      - preferred_term: transposable element silencing
                        term:
                          id: GO:0010526
                          label: transposable element silencing
                    locations:
                      - preferred_term: P granule
                        term:
                          id: GO:0043186
                          label: P granule
                    role_description: >-
                      Effector Argonaute that receives amplified 22G-RNAs and
                      silences their targets. It is non-catalytic and probably
                      recruits other factors for target turnover.
                    evidence:
                      - source_id: PMID:19800275
                        title: Distinct argonaute-mediated 22G-RNA pathways direct genome surveillance in the C. elegans germline.
                        statement: >-
                          A germline 22G-RNA system depends on WAGOs including
                          WAGO-1, which localizes to P granules and silences
                          transposons, pseudogenes and cryptic loci.
                        supporting_text: >-
                          We show that, in the germline, one system is dependent
                          on worm-specific AGOs, including WAGO-1, which
                          localizes to germline nuage structures called P
                          granules. WAGO-1 silences certain genes, transposons,
                          pseudogenes, and cryptic loci.
              - id: csr1_licensing_branch
                label: Mutator-independent EGO-1/CSR-1 licensing branch
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  EGO-1 makes most of the 22G-RNAs antisense to thousands
                  of germline-expressed genes. These load CSR-1, which binds
                  chromatin at its targets. Tethering CSR-1 to a transcript
                  licenses its expression and protects it from piRNA-triggered
                  silencing. CSR-1 22G-RNA targets are not enriched for
                  Mutator target genes.
                annotons:
                  - id: ego1_rdrp
                    label: EGO-1 RNA-dependent RNA polymerase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: EGO-1
                        term:
                          id: UniProtKB:G5EBQ3
                          label: RNA-directed RNA polymerase
                    function:
                      preferred_term: RNA-directed RNA polymerase activity
                      term:
                        id: GO:0003968
                        label: RNA-directed RNA polymerase activity
                    processes:
                      - preferred_term: siRNA processing
                        term:
                          id: GO:0030422
                          label: siRNA processing
                    role_description: >-
                      Principal germline RdRP, acting with DRH-3 and EKL-1.
                      It produces the CSR-1-associated 22G-RNAs and also
                      contributes, redundantly with RRF-1, to WAGO-class
                      22G-RNAs.
                    evidence:
                      - source_id: PMID:34329465
                        title: Two isoforms of the essential C. elegans Argonaute CSR-1 differentially regulate sperm and oocyte fertility.
                        statement: CSR-1 22G-RNAs are produced by EGO-1.
                        supporting_text: >-
                          CSR-1-associated 22G-RNAs are produced by the RNA
                          dependent RNA polymerase (RdRP), EGO-1, one of four
                          RdRPs present in the worm
                      - source_id: PMID:21396820
                        title: EGO-1, a C. elegans RdRP, modulates gene expression via production of mRNA-templated short antisense RNAs.
                        statement: EGO-1 makes triphosphorylated small RNAs from mRNA templates.
                        supporting_text: >-
                          Our data support the conclusion that EGO-1 produces
                          triphosphorylated small RNAs derived from mRNA
                          templates
                      - source_id: PMID:30650636
                        title: Function and Evolution of Nematode RNAi Pathways.
                        statement: >-
                          EGO-1 and RRF-1 are redundantly required for
                          piRNA (21U-RNA)-driven 22G-RNA biogenesis, so EGO-1
                          also feeds the WAGO branch.
                        supporting_text: >-
                          The RdRPs RRF-1 and EGO-1 are redundantly required for
                          21U-RNA-driven 22G-RNA biogenesis
                  - id: csr1_licensing
                    label: CSR-1 22G-RNA-guided licensing Argonaute
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CSR-1
                        term:
                          id: UniProtKB:H2KZD5
                          label: Piwi domain-containing protein
                    function:
                      preferred_term: single-stranded RNA binding
                      term:
                        id: GO:0003727
                        label: single-stranded RNA binding
                      description: >-
                        Guide-dependent binding of target transcripts. It
                        follows the csr-1 review's licensing core function.
                    processes:
                      - preferred_term: negative regulation of gene silencing by regulatory ncRNA
                        term:
                          id: GO:0060967
                          label: negative regulation of gene silencing by regulatory ncRNA
                    locations:
                      - preferred_term: P granule
                        term:
                          id: GO:0043186
                          label: P granule
                    role_description: >-
                      Protects germline-expressed transcripts from silencing.
                      This is the self-recognition counterpart of the WAGO
                      branch.
                    evidence:
                      - source_id: PMID:24360783
                        title: Protection of germline gene expression by the C. elegans Argonaute CSR-1.
                        statement: Recruiting CSR-1 to a transcript licenses expression and protects it from piRNA silencing.
                        supporting_text: >-
                          we use an in vivo RNA tethering assay to demonstrate
                          that the recruitment of CSR-1 to a transcript licenses
                          expression of the transcript, protecting it from
                          piRNA-mediated silencing.
                      - source_id: PMID:19804758
                        title: The Argonaute CSR-1 and its 22G-RNA cofactors are required for holocentric chromosome segregation.
                        statement: CSR-1 22G-RNAs are antisense to thousands of germline-expressed genes.
                        supporting_text: >-
                          Surprisingly, the CSR-1-interacting small RNAs
                          (22G-RNAs) are antisense to thousands of
                          germline-expressed protein-coding genes.
                      - source_id: PMID:34244496
                        title: Arginine methylation promotes siRNA-binding specificity for a spermatogenesis-specific isoform of the Argonaute protein CSR-1.
                        statement: >-
                          Neither CSR-1 isoform is enriched for Mutator target
                          genes. (The quote is the second half of a sentence
                          that opens "In contrast, neither CSR-1A, CSR-1B, nor
                          CSR-1A + B".)
                        supporting_text: >-
                          are enriched for mutator target genes, which include
                          pseudogenes, repetitive elements, transposons, and
                          other germline-repressed genes
        connections:
          - source: ego1_rdrp
            target: csr1_licensing
            connection_type: PROVIDES_INPUT_FOR
            description: EGO-1-synthesized 22G-RNAs are the guides loaded into CSR-1.
