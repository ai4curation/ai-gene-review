              - source_id: PMID:18007599
                title: In vitro analyses of the production and activity of secondary small interfering RNAs in C. elegans.
                statement: RRF-1 provides the RdRP activity that makes secondary siRNAs.
                supporting_text: >-
                  The RRF-1 complex is predominantly responsible for the RdRP
