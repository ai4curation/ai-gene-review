    - order: 5
      role: RdRP synthesis of secondary 22G-RNAs
      node:
        id: rdrp_synthesis
        label: RRF-1 RNA-dependent RNA polymerase synthesis of 22G-RNAs
        module_type: MOLECULAR_FUNCTION
        description: >-
          The RdRP RRF-1 colocalizes with MUT-16 at Mutator foci. It needs
          MUT-16, and no other Mutator protein tested, for that localization.
          RRF-1 binds UG-repeat RNA, and pUG-tailed RNAs are templates for
          RdRP synthesis in vivo. RRF-1 synthesizes the unprimed,
          5'-triphosphorylated secondary 22G-RNAs that guide WAGO
          Argonautes. EGO-1, modeled in the CSR-1 branch, contributes
          partly redundantly to WAGO-class 22G-RNAs.
        annotons:
          - id: rrf1_rdrp
            label: RRF-1 RNA-dependent RNA polymerase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: RRF-1
                term:
                  id: UniProtKB:G5ECM1
                  label: RNA-directed RNA polymerase
            function:
              preferred_term: RNA-directed RNA polymerase activity
              term:
                id: GO:0003968
                label: RNA-directed RNA polymerase activity
            processes:
