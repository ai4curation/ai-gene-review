id: MODULE:c_elegans_mutator_22g_rna_amplification
title: Mutator foci 22G-RNA amplification in Caenorhabditis elegans
description: >-
  In the Caenorhabditis elegans germline, silencing guided by primary small
  RNAs is weak, and is made effective by a second round of small RNA
  synthesis. Transcripts recognized by a primary Argonaute are cut, and the
  5' fragment is given a poly(UG) tail. RNA-dependent RNA polymerases then
  use the tailed RNA as a template to synthesize abundant 22-nucleotide,
  5'-guanosine secondary siRNAs (22G-RNAs). Most of this amplification takes
  place in Mutator foci. These are perinuclear, phase-separated condensates
  that lie next to P granules at nuclear pores. The intrinsically disordered
  Q/N-rich protein MUT-16 is the scaffold of the foci. Distinct regions of
  MUT-16 recruit the RdRP RRF-1 and, through the adaptor RDE-2 (MUT-8), the
  3'-5' exoribonuclease MUT-7. The poly(UG) polymerase RDE-3 (MUT-2) also
  localizes to the foci. The 22G-RNAs made in this way are loaded into
  worm-specific Argonautes (WAGOs) that lack slicer residues, such as WAGO-1,
  and silence transposons, pseudogenes and other germline-repressed genes.
  A second germline 22G-RNA system, made by the RdRP EGO-1 and bound by the
  catalytic Argonaute CSR-1, targets most germline-expressed genes. It does
  not need the Mutator machinery, and it protects its targets from
  WAGO-mediated silencing instead of silencing them.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:22713602
    title: MUT-16 promotes formation of perinuclear mutator foci required for RNA silencing in the C. elegans germline.
    statement: >-
      Primary-siRNA silencing requires RdRP amplification; the mutator
      proteins localize to perinuclear foci adjacent to P granules, MUT-16
      is needed for the complex and for the foci, and RRF-1 colocalizes there.
    supporting_text: >-
      Here we show that each of the six mutator proteins localizes to punctate
      foci at the periphery of germline nuclei. The Mutator foci are adjacent
      to P granules but are not dependent on core P-granule components or other
      RNAi pathway factors for their formation or stability.
  - source_id: PMID:22713602
    title: MUT-16 promotes formation of perinuclear mutator foci required for RNA silencing in the C. elegans germline.
    statement: >-
      Mutator foci are proposed to be an RNA processing compartment for
      siRNA amplification.
    supporting_text: >-
      We propose that the mutator proteins and RRF-1 constitute an RNA
      processing compartment required for siRNA amplification and RNA
      silencing.
  - source_id: PMID:30036386
    title: Distinct regions of the intrinsically disordered protein MUT-16 mediate assembly of a small RNA amplification complex and promote phase separation of Mutator foci.
    statement: >-
      Mutator foci associate with nuclear pores and P granules and behave as
      phase-separated condensates.
    supporting_text: >-
      RRF-1, an RdRP, and other Mutator complex proteins localize to Mutator
      foci, which are perinuclear germline foci that associate with nuclear
      pores and P granules to facilitate small RNA amplification.
  - source_id: PMID:32338603
    title: A tudor domain protein, SIMR-1, promotes siRNA production at piRNA-targeted mRNAs in C. elegans.
    statement: >-
      The Mutator complex is the siRNA-amplifying step downstream of piRNA
      target recognition, which places the piRNA pathway upstream of this
      module.
    supporting_text: >-
      In Caenorhabditis elegans, regulation of piRNA target genes is mediated
      by the mutator complex, which synthesizes high levels of siRNAs through
      the activity of an RNA-dependent RNA polymerase.
  - source_id: file:modules/c_elegans_pirna_transgenerational_silencing.yaml
    title: piRNA-initiated transgenerational silencing in Caenorhabditis elegans
    statement: >-
      Sibling module. It covers how silencing is targeted (PRG-1/21U-RNA
      scanning) and inherited (nuclear HRDE-1 and Z granule ZNFX-1/WAGO-4).
      This module covers the amplification machinery that both use.
  - source_id: file:genes/worm/mut-16/mut-16-ai-review.yaml
    title: mut-16 gene review
    statement: >-
      Core function: MUT-16 is a molecular condensate scaffold for Mutator
      focus assembly (GO:0140693).
  - source_id: file:genes/worm/rde-2/rde-2-ai-review.yaml
    title: rde-2 gene review
    statement: >-
      Core function: RDE-2 is a molecular adaptor that bridges MUT-7 to MUT-16
      (GO:0060090).
notes: >-
  Boundary. This module is the amplification machinery: the steps between
  target recognition by a primary Argonaute and the loading of secondary
  22G-RNAs into effector Argonautes. It does not cover what selects targets.
  In the germline the main trigger is PRG-1/21U-RNA scanning; for exogenous
  RNAi it is RDE-1. It also does not cover how silencing is made heritable.
  Both are modeled in MODULE:c_elegans_pirna_transgenerational_silencing,
  which links to this module for its amplification step. The endonuclease
  RDE-8 cuts target RNA upstream of tailing. RDE-8 and the DEAD-box helicases
  MUT-14 and SMUT-1 are Mutator-focus proteins that are not modeled as
  annotons, because none of them has a gene review here. The 26G-RNA (ERGO-1,
  ALG-3/4) and somatic RRF-1 pathways are outside the germline boundary.

  Effector Argonautes. WAGO-1 is the representative cytoplasmic WAGO effector.
  The nuclear WAGO HRDE-1 and the Z granule WAGO-4 also bind Mutator-derived
  22G-RNAs. They are modeled in the piRNA/inheritance module because their
  defining role is heritability, not amplification.

  CSR-1 branch. The final part has two variants (ONE_OR_MORE). Both are
  germline RdRP-derived 22G-RNA systems, but only the WAGO branch uses the
  Mutator machinery. CSR-1 22G-RNAs are made by EGO-1, are not enriched at
  Mutator target genes, and license or protect germline-expressed genes
  instead of silencing them. The CSR-1 variant is included to make that
  contrast explicit. It is not a claim that CSR-1 acts in Mutator foci. Its
  MF follows the csr-1 review's licensing core function (single-stranded RNA
  binding). The review's separate slicer core function (GO:0070551) is not
  modeled here, because this module concerns 22G-RNA production and
  partition, not target cleavage.

  Unreviewed members. RRF-1 (G5ECM1, WormBase F26A3.8a), RDE-3/MUT-2
  (O44768) and EGO-1 (G5EBQ3) were taken from UniProt with their WormBase
  cross-references. They have no gene reviews, so their MF terms rest on the
  cited literature only. RRF-1 has three UniProtKB entries (G5ECM1, G3MU40,
  Q7JLA0). G5ECM1 is the one cross-referenced to WormBase isoform a.
module:
  id: c_elegans_mutator_22g_rna_amplification
  label: Mutator foci 22G-RNA amplification in C. elegans
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Germline secondary siRNA (22G-RNA) amplification. MUT-16 nucleates
    Mutator foci, where target RNA is poly(UG)-tailed and the RdRP RRF-1
    synthesizes 22G-RNAs. The 22G-RNAs are loaded into WAGO effector
    Argonautes. A parallel EGO-1/CSR-1 22G-RNA system does not use the
    Mutator machinery.
  concepts:
    - preferred_term: siRNA processing
      term:
        id: GO:0030422
        label: siRNA processing
      description: >-
        The GO definition includes amplification of siRNA by RNA-directed
        RNA polymerase, which is the core of this module.
    - preferred_term: regulatory ncRNA-mediated post-transcriptional gene silencing
      term:
        id: GO:0035194
        label: regulatory ncRNA-mediated post-transcriptional gene silencing
      description: >-
        The silencing output of the WAGO branch.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    cellular_components:
      - preferred_term: mutator focus
        term:
          id: GO:1990633
          label: mutator focus
        description: >-
          Location of the scaffold, exonuclease, tailing and RdRP steps. The
          effector Argonautes sit mainly in adjacent P granules.
    anatomical_locations:
      - preferred_term: germline
        description: >-
          Adult hermaphrodite germ cells, where Mutator foci form at the
          nuclear periphery.
  parts:
    - order: 1
      role: Mutator focus scaffold
      node:
        id: mutator_scaffold
        label: MUT-16 scaffolding of Mutator foci
        module_type: MOLECULAR_FUNCTION
        description: >-
          MUT-16 is required for the Mutator protein complex to form and for
          the foci to assemble at the nuclear periphery. Its C-terminal
          disordered region is necessary and sufficient for foci formation
          and gives the foci liquid-like properties. Separate regions recruit
          RRF-1 (region F) and, through RDE-2, MUT-7 (region H-I).
        annotons:
          - id: mut16_scaffold
            label: MUT-16 Mutator focus scaffold
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MUT-16
                term:
                  id: UniProtKB:O62011
                  label: MUTator
            function:
              preferred_term: molecular condensate scaffold activity
              term:
                id: GO:0140693
                label: molecular condensate scaffold activity
            processes:
              - preferred_term: siRNA processing
                term:
                  id: GO:0030422
                  label: siRNA processing
            locations:
              - preferred_term: mutator focus
                term:
                  id: GO:1990633
                  label: mutator focus
            role_description: >-
              Intrinsically disordered Q/N-rich scaffold that nucleates the
              Mutator condensate and recruits the RdRP and the
              exonuclease subcomplex.
            evidence:
              - source_id: PMID:22713602
                title: MUT-16 promotes formation of perinuclear mutator foci required for RNA silencing in the C. elegans germline.
                statement: MUT-16 is required for the Mutator complex and foci.
                supporting_text: >-
                  is specifically required for the formation of a protein
                  complex containing the mutator proteins, and in its absence,
                  Mutator foci fail to form at the nuclear periphery.
              - source_id: PMID:30036386
                title: Distinct regions of the intrinsically disordered protein MUT-16 mediate assembly of a small RNA amplification complex and promote phase separation of Mutator foci.
                statement: >-
                  MUT-16 acts as a scaffold, and its C-terminal disordered
                  region drives phase separation of the foci.
                supporting_text: >-
                  MUT-16 acts as a scaffold to recruit RRF-1 and other Mutator
                  complex proteins, and it promotes foci formation through its
                  C-terminal region.
              - source_id: PMID:30036386
                title: Distinct regions of the intrinsically disordered protein MUT-16 mediate assembly of a small RNA amplification complex and promote phase separation of Mutator foci.
                statement: Distinct MUT-16 regions recruit RRF-1 and MUT-7 (via RDE-2).
                supporting_text: >-
                  In particular, region F recruits the RdRP protein RRF-1 and
                  the H-I region recruits the exonuclease MUT-7 through its
                  interaction with RDE-2.
    - order: 2
      role: MUT-7 exoribonuclease subcomplex
      node:
        id: mut7_rde2_subcomplex
        label: RDE-2/MUT-8 bridging of the MUT-7 exoribonuclease to MUT-16
        module_type: PROTEIN_COMPLEX
        description: >-
          RDE-2 (MUT-8) has no catalytic activity. Its N-terminal region binds
          MUT-16, and its C-terminal region binds a Caenorhabditis-specific
          insertion in the MUT7-C domain of MUT-7. This tethers the 3'-5'
          exoribonuclease to Mutator foci. The interaction is needed for
          efficient RNAi. MUT-7 is required for transposon silencing, RNAi
          and germline small RNA production, but its RNA substrate in the
          amplification cycle is not defined.
        annotons:
          - id: rde2_adaptor
            label: RDE-2 adaptor linking MUT-7 to MUT-16
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: RDE-2 (MUT-8)
                term:
                  id: UniProtKB:Q19672
                  label: SH2 domain-containing protein
            function:
              preferred_term: molecular adaptor activity
              term:
                id: GO:0060090
                label: molecular adaptor activity
            processes:
              - preferred_term: regulatory ncRNA-mediated post-transcriptional gene silencing
                term:
                  id: GO:0035194
                  label: regulatory ncRNA-mediated post-transcriptional gene silencing
            locations:
              - preferred_term: mutator focus
                term:
                  id: GO:1990633
                  label: mutator focus
            role_description: >-
              Bridging adaptor. Its NTD binds MUT-16 and its CTD binds the
              MUT-7 MUT7-C insertion, so it recruits MUT-7 into Mutator foci.
            evidence:
              - source_id: PMID:39188014
                title: MUT-7 exoribonuclease activity and localization are mediated by an ancient domain.
                statement: The MUT-16 C-terminal fragment binds the MUT-8 NTD directly.
                supporting_text: >-
                  MUT-16584–724 directly binds to the NTD of MUT-8
              - source_id: PMID:39188014
                title: MUT-7 exoribonuclease activity and localization are mediated by an ancient domain.
                statement: The MUT7-C insertion binds MUT-8 and recruits MUT-7 to germ granules.
                supporting_text: >-
                  Caenorhabditis elegans MUT-7 contains a specific insertion
                  within MUT7-C, which allows binding to MUT-8 and,
                  consequently, MUT-7 recruitment to germ granules.
              - source_id: PMID:15653635
                title: RDE-2 interacts with MUT-7 to mediate RNA interference in Caenorhabditis elegans.
                statement: The RDE-2-MUT-7 interaction is needed for efficient RNAi.
                supporting_text: >-
                  Using genetic complementation analysis, we show that the
                  interaction between these two proteins is required for
                  efficient RNAi in vivo.
          - id: mut7_exonuclease
            label: MUT-7 3'-5' exoribonuclease
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MUT-7
                term:
                  id: UniProtKB:P34607
                  label: Exonuclease mut-7
            function:
              preferred_term: 3'-5'-RNA exonuclease activity
              term:
                id: GO:0000175
                label: 3'-5'-RNA exonuclease activity
              description: >-
                Ribonuclease activity of the MUT-7 family; in C. elegans and
                human MUT-7 the MUT7-C domain contributes RNA binding needed
                for activity. The in vivo substrate is not established.
            processes:
              - preferred_term: transposable element silencing
                term:
                  id: GO:0010526
                  label: transposable element silencing
            locations:
              - preferred_term: mutator focus
                term:
                  id: GO:1990633
                  label: mutator focus
            role_description: >-
              Catalytic subunit of the MUT-7/RDE-2 subcomplex. It acts
              downstream of primary siRNA formation and upstream of target
              recognition by secondary siRNAs.
            evidence:
              - source_id: PMID:39188014
                title: MUT-7 exoribonuclease activity and localization are mediated by an ancient domain.
                statement: MUT-7 family proteins are 3'-5' exoribonucleases needed for germline small RNA production.
                supporting_text: >-
                  The MUT-7 family of 3'-5' exoribonucleases is evolutionarily
                  conserved across the animal kingdom and plays essential roles
                  in small RNA production in the germline.
              - source_id: PMID:39188014
                title: MUT-7 exoribonuclease activity and localization are mediated by an ancient domain.
                statement: The MUT7-C domain is needed for MUT-7 ribonuclease activity.
                supporting_text: >-
                  in C. elegans and human MUT-7, the MUT7-C domain contributes
                  to RNA binding and is thereby crucial for ribonuclease
                  activity.
              - source_id: PMID:10535732
                title: Mut-7 of C. elegans, required for transposon silencing and RNA interference, is a homolog of Werner syndrome helicase and RNaseD.
                statement: mut-7 is required for germline transposon silencing and RNAi and encodes an RNaseD homolog.
                supporting_text: >-
                  We found one of the mutated genes, mut-7, to encode a protein
                  with homology to RNaseD.
              - source_id: PMID:15653635
                title: RDE-2 interacts with MUT-7 to mediate RNA interference in Caenorhabditis elegans.
                statement: The MUT-7/RDE-2 complex acts between siRNA formation and target recognition, possibly at amplification.
                supporting_text: >-
                  Together these data support a role for the MUT-7/RDE-2
                  complex downstream of siRNA formation, but upstream of siRNA
                  mediated target RNA recognition, possibly indicating a role
                  in the siRNA amplification step.
    - order: 3
      role: poly(UG) tailing of targeted RNA fragments
      node:
        id: pug_tailing
        label: RDE-3/MUT-2 poly(UG) tailing of target RNA
        module_type: MOLECULAR_FUNCTION
        description: >-
          After a primary Argonaute recognizes a target and RDE-8 cuts it,
          the ribonucleotidyltransferase RDE-3 (MUT-2) adds alternating U/G
          repeats to the 5' fragment. The pUG RNA then serves as an RdRP
          template. RDE-3 localizes to Mutator foci and is needed for RNAi
          and for RNAi inheritance.
        annotons:
          - id: rde3_pug_polymerase
            label: RDE-3 poly(UG) polymerase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: RDE-3 (MUT-2)
                term:
                  id: UniProtKB:O44768
                  label: PAP-associated domain-containing protein
            function:
              preferred_term: template-free RNA nucleotidyltransferase activity
              term:
                id: GO:0098680
                label: template-free RNA nucleotidyltransferase activity
              description: >-
                Template-independent addition of alternating UMP and GMP to
                the 3' end of cleaved target RNA (pUGylation). GO has no
                specific poly(UG) polymerase term.
            processes:
              - preferred_term: siRNA processing
                term:
                  id: GO:0030422
                  label: siRNA processing
            locations:
              - preferred_term: mutator focus
                term:
                  id: GO:1990633
                  label: mutator focus
            role_description: >-
              Marks cleaved target RNA with a poly(UG) tail so that it can be
              used as an RdRP template.
            evidence:
              - source_id: PMID:34428467
                title: piRNAs coordinate poly(UG) tailing to prevent aberrant and perpetual gene silencing.
                statement: RDE-3 adds pUG tails to RNAi-targeted mRNA fragments.
                supporting_text: >-
                  are modified with perfectly alternating 3’ uridine (U) and
                  guanosine (G) repeats (termed poly(UG) or pUG tails) by the
                  ribonucleotidyltransferase MUT-2/RDE-3
              - source_id: PMID:34428467
                title: piRNAs coordinate poly(UG) tailing to prevent aberrant and perpetual gene silencing.
                statement: RDE-3 localizes to Mutator foci.
                supporting_text: >-
                  RDE-3, which localizes to Mutator foci, distinct cytoplasmic
                  perinuclear germline condensates required for 22G-siRNA
                  amplification
    - order: 4
      role: RdRP synthesis of secondary 22G-RNAs
      node:
        id: rdrp_synthesis
        label: RRF-1 RNA-dependent RNA polymerase synthesis of 22G-RNAs
        module_type: MOLECULAR_FUNCTION
        description: >-
          The RdRP RRF-1 colocalizes with MUT-16 at Mutator foci. It needs
          MUT-16, and no other Mutator protein tested, for that localization.
          RRF-1 synthesizes the secondary 22G-RNAs that guide WAGO
          Argonautes.
        annotons:
          - id: rrf1_rdrp
            label: RRF-1 RNA-dependent RNA polymerase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: RRF-1
                term:
                  id: UniProtKB:G5ECM1
                  label: RNA-directed RNA polymerase
            function:
              preferred_term: RNA-directed RNA polymerase activity
              term:
                id: GO:0003968
                label: RNA-directed RNA polymerase activity
            processes:
              - preferred_term: siRNA processing
                term:
                  id: GO:0030422
                  label: siRNA processing
            locations:
              - preferred_term: mutator focus
                term:
                  id: GO:1990633
                  label: mutator focus
            role_description: >-
              Template-dependent synthesis of 22G-RNAs antisense to targeted
              transcripts. This is the amplification step itself.
            evidence:
              - source_id: PMID:22713602
                title: MUT-16 promotes formation of perinuclear mutator foci required for RNA silencing in the C. elegans germline.
                statement: RRF-1 colocalizes with MUT-16 at Mutator foci.
                supporting_text: >-
                  The RdRP RRF-1 colocalizes with MUT-16 at Mutator foci,
                  suggesting a role for Mutator foci in siRNA amplification.
              - source_id: PMID:30036386
                title: Distinct regions of the intrinsically disordered protein MUT-16 mediate assembly of a small RNA amplification complex and promote phase separation of Mutator foci.
                statement: Among the genes tested, only mut-16 is required for RRF-1 localization.
                supporting_text: >-
                  Of the genes tested, only mut-16 was required for RRF-1
                  localization
    - order: 5
      role: loading of 22G-RNAs into effector Argonautes
      node:
        id: effector_loading
        label: 22G-RNA effector Argonaute branches
        module_type: BIOLOGICAL_PROCESS
        description: >-
          RdRP-derived 22G-RNAs are partitioned between Argonaute clades with
          opposite effects. Mutator-dependent 22G-RNAs load WAGOs, which
          silence their targets. EGO-1-derived 22G-RNAs load CSR-1, which
          licenses expression of its targets.
        variant_sets:
          - id: twenty_two_g_branches
            label: Germline 22G-RNA Argonaute branches
            axis: Argonaute clade, RdRP and Mutator dependence
            selection: ONE_OR_MORE
            notes: >-
              The two branches coexist in every germ cell and partition the
              germline transcriptome between them. Only the WAGO branch is
              an output of the Mutator machinery modeled in parts 1-4.
            variants:
              - id: wago_silencing_branch
                label: Mutator-dependent WAGO silencing branch
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  WAGO-1 is a worm-specific Argonaute without slicer residues.
                  It binds Mutator/RdRP-derived 22G-RNAs in P granules and
                  silences transposons, pseudogenes and cryptic loci.
                annotons:
                  - id: wago1_effector
                    label: WAGO-1 22G-RNA-bound silencing Argonaute
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: WAGO-1
                        term:
                          id: UniProtKB:Q21770
                          label: Argonaute protein wago-1
                    function:
                      preferred_term: siRNA binding
                      term:
                        id: GO:0035197
                        label: siRNA binding
                    processes:
                      - preferred_term: regulatory ncRNA-mediated post-transcriptional gene silencing
                        term:
                          id: GO:0035194
                          label: regulatory ncRNA-mediated post-transcriptional gene silencing
                      - preferred_term: transposable element silencing
                        term:
                          id: GO:0010526
                          label: transposable element silencing
                    locations:
                      - preferred_term: P granule
                        term:
                          id: GO:0043186
                          label: P granule
                    role_description: >-
                      Effector Argonaute that receives amplified 22G-RNAs and
                      silences their targets. It is non-catalytic and probably
                      recruits other factors for target turnover.
                    evidence:
                      - source_id: PMID:19800275
                        title: Distinct argonaute-mediated 22G-RNA pathways direct genome surveillance in the C. elegans germline.
                        statement: >-
                          A germline 22G-RNA system depends on WAGOs including
                          WAGO-1, which localizes to P granules and silences
                          transposons, pseudogenes and cryptic loci.
                        supporting_text: >-
                          We show that, in the germline, one system is dependent
                          on worm-specific AGOs, including WAGO-1, which
                          localizes to germline nuage structures called P
                          granules. WAGO-1 silences certain genes, transposons,
                          pseudogenes, and cryptic loci.
              - id: csr1_licensing_branch
                label: Mutator-independent EGO-1/CSR-1 licensing branch
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  EGO-1 makes 22G-RNAs antisense to thousands of
                  germline-expressed genes. These load CSR-1, which binds
                  chromatin at its targets. Tethering CSR-1 to a transcript
                  licenses its expression and protects it from piRNA-triggered
                  silencing. CSR-1 22G-RNA targets are not enriched for
                  Mutator target genes.
                annotons:
                  - id: ego1_rdrp
                    label: EGO-1 RNA-dependent RNA polymerase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: EGO-1
                        term:
                          id: UniProtKB:G5EBQ3
                          label: RNA-directed RNA polymerase
                    function:
                      preferred_term: RNA-directed RNA polymerase activity
                      term:
                        id: GO:0003968
                        label: RNA-directed RNA polymerase activity
                    processes:
                      - preferred_term: siRNA processing
                        term:
                          id: GO:0030422
                          label: siRNA processing
                    role_description: >-
                      Germline RdRP that produces the CSR-1-associated
                      22G-RNAs.
                    evidence:
                      - source_id: PMID:34329465
                        title: Two isoforms of the essential C. elegans Argonaute CSR-1 differentially regulate sperm and oocyte fertility.
                        statement: CSR-1 22G-RNAs are produced by EGO-1.
                        supporting_text: >-
                          CSR-1-associated 22G-RNAs are produced by the RNA
                          dependent RNA polymerase (RdRP), EGO-1, one of four
                          RdRPs present in the worm
                  - id: csr1_licensing
                    label: CSR-1 22G-RNA-guided licensing Argonaute
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CSR-1
                        term:
                          id: UniProtKB:H2KZD5
                          label: Piwi domain-containing protein
                    function:
                      preferred_term: single-stranded RNA binding
                      term:
                        id: GO:0003727
                        label: single-stranded RNA binding
                      description: >-
                        Guide-dependent binding of target transcripts. It
                        follows the csr-1 review's licensing core function.
                    processes:
                      - preferred_term: negative regulation of gene silencing by regulatory ncRNA
                        term:
                          id: GO:0060967
                          label: negative regulation of gene silencing by regulatory ncRNA
                    locations:
                      - preferred_term: P granule
                        term:
                          id: GO:0043186
                          label: P granule
                    role_description: >-
                      Protects germline-expressed transcripts from silencing.
                      This is the self-recognition counterpart of the WAGO
                      branch.
                    evidence:
