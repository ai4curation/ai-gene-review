                title: MUT-16 promotes formation of perinuclear mutator foci required for RNA silencing in the C. elegans germline.
                statement: RRF-1 colocalizes with MUT-16 at Mutator foci.
                supporting_text: >-
                  The RdRP RRF-1 colocalizes with MUT-16 at Mutator foci,
                  suggesting a role for Mutator foci in siRNA amplification.
              - source_id: PMID:30036386
                title: Distinct regions of the intrinsically disordered protein MUT-16 mediate assembly of a small RNA amplification complex and promote phase separation of Mutator foci.
                statement: Among the genes tested, only mut-16 is required for RRF-1 localization.
                supporting_text: >-
