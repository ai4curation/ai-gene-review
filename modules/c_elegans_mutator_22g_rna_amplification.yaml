knowledge_gaps:
  - gap_statement: >-
      The RNA substrate and catalytic role of the MUT-7 3'-5' exoribonuclease
      in 22G-RNA amplification are unknown.
    boundary: >-
      MUT-7 is a ribonuclease that is needed for RNAi, transposon silencing
      and germline small RNA production. It is recruited to Mutator foci by
      RDE-2/MUT-8. Whether it trims target RNA, pUG RNA, RdRP products or
      some other substrate has not been shown in vivo.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Without the substrate, the exonuclease step cannot be placed in order
      relative to tailing and RdRP synthesis.
    resolution: >-
      Map MUT-7 RNA targets in vivo (CLIP) in wild type and in catalytic-dead
      mut-7 knock-in animals. Compare 22G-RNA and pUG RNA profiles and
      3'-end structures.
    provenance:
      - reference_id: PMID:15653635
        supporting_text: >-
          possibly indicating a role in the siRNA amplification step
