              - source_id: PMID:34428467
                title: piRNAs coordinate poly(UG) tailing to prevent aberrant and perpetual gene silencing.
                statement: RDE-3 localizes to Mutator foci.
                supporting_text: >-
                  RDE-3, which localizes to Mutator foci, distinct cytoplasmic
