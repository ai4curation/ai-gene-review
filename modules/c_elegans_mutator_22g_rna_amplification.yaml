                term:
                  id: GO:0030422
                  label: siRNA processing
            locations:
              - preferred_term: mutator focus
                term:
                  id: GO:1990633
                  label: mutator focus
            role_description: >-
              Template-dependent synthesis of 22G-RNAs antisense to targeted
              transcripts. This is the amplification step itself.
