  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001140.yaml
    statement: RGD names calmodulin as a constitutive component of the Ca2+-activated K+ channels.
    supporting_text: CaM is also a constitutive component of
  - source_id: GO:0019722
    title: calcium-mediated signaling
    statement: >-
      The GO process mapped to PW:0001140 (skos:narrowMatch, curated) in
