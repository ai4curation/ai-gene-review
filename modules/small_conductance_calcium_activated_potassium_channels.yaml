  connections:
    - source: kca_calmodulin_calcium_sensing
      target: kca_potassium_conduction
      connection_type: POSITIVELY_REGULATES
      description: >-
        Ca2+-bound calmodulin N-lobes bind the S4-S5 linkers and open the gate. The sensor
        and the pore are parts of one complex, so this is direct activation within the
        channel, not a signalling relay.
      evidence:
        - source_id: PMID:9774106
          statement: Ca2+ gating of SK channels works through calmodulin bound to the channel (rat SK2).
          supporting_text: SK channels are not gated by calcium binding directly to the channel alpha-subunits
