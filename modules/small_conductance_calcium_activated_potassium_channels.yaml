id: MODULE:small_conductance_calcium_activated_potassium_channels
title: Small- and intermediate-conductance calcium-activated potassium channels — KCNN1, KCNN2 and KCNN3 (SK1-3, homo- or heterotetramers) and KCNN4 (IK/SK4, homotetramer), each pore subunit carrying a constitutively bound calmodulin (CALM1/2/3) whose Ca2+-binding N-lobe opens the gate, so that a rise in cytosolic Ca2+ drives K+ efflux and membrane hyperpolarization
description: >-
  Small-conductance (SK, KCa2) and intermediate-conductance (IK, KCa3.1) calcium-activated
  potassium channels convert a rise in cytosolic Ca2+ into an outward K+ current that
  hyperpolarizes the plasma membrane. Each channel is a tetramer of six-transmembrane pore
  subunits, KCNN1, KCNN2 or KCNN3 for SK channels and KCNN4 for IK channels. The pore
  subunits contain no Ca2+-binding site of their own: one calmodulin molecule is bound to
  the intracellular calmodulin-binding domain of every subunit, independently of Ca2+, so
  that four calmodulins are integral parts of each channel. The calmodulin C-lobe stays
  attached to the channel, while Ca2+ binding to the N-lobe makes it grip the S4-S5 linker,
  which pulls the S6 bundle open; SK and IK channels are therefore voltage-independent and
  respond to submicromolar Ca2+ with high cooperativity. SK1, SK2 and SK3 can assemble as
  homotetramers or as heterotetramers with each other, whereas IK channels are KCNN4
  homotetramers with a larger unit conductance and a distinct pharmacology. In neurons SK
  channels generate the afterhyperpolarization that follows action potentials and
  shapes firing frequency and synaptic responses; SK2 and SK3 also contribute to atrial
  repolarization. IK channels act in erythrocytes (the Gardos channel), lymphocytes,
  epithelia and endothelium, where K+ efflux maintains the driving force for Ca2+ entry or
  salt and water secretion. The Ca2+ sensitivity of SK2 channels is further tuned by
  protein kinase CK2 and protein phosphatase 2A bound to the channel, which phosphorylate
  and dephosphorylate the channel-bound calmodulin.
status: DRAFT
scope: CONCRETE
