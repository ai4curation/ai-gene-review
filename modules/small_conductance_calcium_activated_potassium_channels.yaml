notes: >-
  Derived from the RGD Pathway Ontology term PW:0001140 (calcium/calcium-mediated signaling
  pathway; id and label checked in .cache/rgd_pw/pw.obo) through the RGD_PATHWAY_ONTOLOGY
  project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, flagged broad,
  mapped GO:0019722 calcium-mediated signaling). It implements the SK channel item of the
  PW:0001140 entry in the "Seeds that match only by gene overlap" section of
  projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md. PW:0001140 is the only PW
  evidence source_id. RGD's text names SK channels as Kcnn1-3, but RGD curates all four
  KCNN genes to the pathway (TAS, RGD:7204683), and KCNN4 shares the calmodulin gating
  mechanism, so the IK channel is included.


  (1) PARTICIPANTS. All participants are on the RGD human list for PW:0001140: KCNN1,
  KCNN2, KCNN3, KCNN4 and CALM1, CALM2, CALM3 (CALM1-3 are curated by RGD from
  PMID:10884684 and PMID:18083096). No participant was added from outside the RGD list.
  The three CALM genes encode one identical protein and are represented as one family
  descriptor with three representative members, the convention of camkii_signaling,
  cyclic_nucleotide_gated_channels, ampk_energy_sensing and
  calmodulin_camkii_stat1_potentiation. UniProt accessions: CALM1-3 from their
  genes/human/*-uniprot.txt files; KCNN1-4 from UniProt REST (reviewed human entries,
  November 2026); none of KCNN1-4 has a gene review in this repository yet, which is
  curation follow-up for the project plan.


  (2) STRUCTURE AND MODULE CONCEPT. The module is a BIOLOGICAL_PROCESS with two parts:
  Ca2+ sensing by the channel-bound calmodulin (part 1), which POSITIVELY_REGULATES K+
  conduction through the pore (part 2). Although sensor and pore form one complex, they are
  separate parts because their activities are distinct: calmodulin binds Ca2+ and the pore
  subunits conduct K+. The concept is GO:0071805 potassium ion transmembrane transport,
  the process every pore subunit carries by IDA in human GOA. The mapped GO:0019722
  calcium-mediated signaling is kept as evidence only: the channels respond to Ca2+ signals
  but do not relay them to downstream targets. Other candidates were checked in go-basic
  2026-07-26: GO has no afterhyperpolarization term. GO:0060081 membrane hyperpolarization
  covers it, since its definition uses the hyperpolarization after an action potential as
  its example. GO:0086009 membrane repolarization and GO:0060306 regulation of membrane
  repolarization are cardiac-framed and are not carried by these genes in experimental
  GOA. So no ontology request is needed. GO:0060081 is added as a second process on the SK
  channel annotons. This is curator-authored, from the afterhyperpolarization role
  (PMID:8781233, PMID:9774106): no experimental GOA row for KCNN1-3 asserts it. It is not
  added to the IK channel, whose cached evidence concerns conduction only; KCNN4 carries
  GO:0030322 stabilization of membrane potential by IDA, which is not used.


  (3) VARIANTS AND SELECTION. Part 2 is a REALIZER variant set on the pore-subunit
  paralogue with four variants (SK1, SK2, SK3, IK), selection ONE_OR_MORE. EXACTLY_ONE
  would be wrong because SK1-3 co-assemble: co-expressed human SK2 and SK3 form one
  population of heteromers (PMID:36502918), and SK1-SK2 heteromers are preferred, so one
  channel can realize two or three SK variants at once. Cells also often express more than
  one type. Each SK variant is therefore "an SK channel containing that paralogue", with
  pore-unit stoichiometry 1-4 per tetramer; the IK channel is four KCNN4 subunits. No
  heteromer of KCNN4 with SK1-3 is asserted. The SK and IK paralogues are variants of one
  step, not separate modules, because they share the calmodulin gating mechanism and differ
  mainly in unit conductance and pharmacology.


  (4) MOLECULAR FUNCTIONS AND THE COMPLEX-SUBUNIT RULE. Each pore subunit forms functional
  homotetrameric channels when expressed alone, and each has experimental human GOA rows
  (QuickGO, November 2026) for the specific GO term, so the function sits both on the
  pore unit and on the complex annoton. KCNN1, KCNN2 and KCNN3 enable GO:0016286 small
  conductance calcium-activated potassium channel activity (KCNN1: IDA PMID:12382077,
  PMID:17142458, PMID:8781233, PMID:9287325; KCNN2: IDA in six papers including
  PMID:12382077 and PMID:24951510; KCNN3: IDA PMID:12382077, PMID:31155282). KCNN4 enables
  GO:0022894 intermediate conductance calcium-activated potassium channel activity (IDA in
  eleven papers including PMID:9326665 and PMID:10026195). Both are children of
  GO:0015269 calcium-activated potassium channel activity, which GOA also gives to KCNN1,
  KCNN2 and KCNN4. The complex term is GO:0034705 potassium channel complex, because GO
  has no SK- or IK-specific complex term. The calmodulin unit in each complex has no
  function there; its function is modelled once, on the part 1 annoton. Calmodulin's
  function is GO:0005509 calcium ion binding (IDA on CALM1, CALM2 and CALM3, for example
  PMID:23040497 and PMID:26969752), with process GO:0005513 detection of calcium ion. These
  match the CALM3 gene review core function. Calmodulin's experimental channel-regulator
  rows (GO:0005246 calcium channel regulator activity, GO:0019855 calcium channel
  inhibitor activity) concern calcium channels and do not apply. GO:0099104 potassium
  channel activator activity would describe the gating role, but no human GOA row asserts
  it for calmodulin, and calmodulin acts here as a constitutive channel subunit, not as a
  separate activator. It is therefore named here and not used. Binding terms
  (GO:0005516 calmodulin binding on KCNN3 and KCNN4, GO:0005515 protein binding) are not
  used as functions. K+ cargo is grounded to CHEBI:29103 potassium(1+), and the gating
  Ca2+ (named in the calmodulin function description, not cargo) to CHEBI:29108
  calcium(2+); both labels were checked in OLS (November 2026).


  (5) REGULATORY PARTNERS CK2 AND PP2A ARE NOT UNITS. RGD's text and the SK2 proteomic and
  functional work (PMID:17329434, and later neurotransmitter-modulation studies in rat neurons) describe protein kinase CK2
  (CSNK2A1/CSNK2A2 with CSNK2B) and PP2A bound to SK2 and SK3 channels. In those studies,
  CK2 phosphorylates calmodulin Thr80 in closed channels and lowers Ca2+ sensitivity, and
  PP2A reverses this. The brief requires experimental human evidence that they are stable
  channel-complex units. None was found: the cached abstract of PMID:17329434 does not
  state the species of the clones; the original proteomics was on rodent brain; and no
  human GOA row links CK2 or PP2A subunits to KCNN2 or KCNN3. They are therefore recorded
  as node-level evidence on part 1 and named here, not modelled as units or parts. Their
  genes are not on the RGD PW:0001140 list. Other SK2 partners in GOA (FLNA, alpha-actinin
  ACTN2 and the L-type channel coupling of PMID:17110593) concern trafficking or local
  Ca2+ supply and are out of scope.


  (6) BOUNDARY. Upstream Ca2+ sources (voltage-gated Ca2+ channels, NMDA receptors, ER
  release) are modelled in the calcium transport modules (high_voltage_activated_calcium_channels,
  t_type_calcium_channels, er_calcium_store_cycling, store_operated_calcium_entry) and are
  context, not parts. Downstream physiology (firing-rate adaptation, synaptic plasticity,
  atrial repolarization, erythrocyte volume, T-cell activation) is not modelled. Large
  conductance BK channels (KCNMA1), which bind Ca2+ directly and are voltage-gated, are a
  different mechanism and are excluded. They are not on the RGD list.


  (7) THE OTHER 30 LEFTOVER PW:0001140 GENES. The split plan records that 60 of the 90
  directly annotated genes are in the ten calcium transport modules, camkii_signaling,
  calcium_sensing_receptor_signaling or gpcr_plc_calcium_pkc_signaling. Of the other 30,
  KCNN1-4 are this module. The rest get no catch-all module, by the plan's decision. These
  are the EF-hand Ca2+ sensors and buffers (CABP1, CABP2, CABP4, CALB2, S100A1, S100A4,
  S100B, KCNIP1-4, NCS1, RCVRN, GUCA1B, TNNC1, TNNC2, PVALB, OCM), synaptotagmins SYT1,
  SYT7 and SYT9, and CALR, CASQ1, GUCA2B, CIMIP3 and SLC24A5. They are a protein family,
  not a pathway, and each belongs in the process it serves. Examples are troponin C in
  muscle contraction, recoverin and GCAPs in phototransduction, synaptotagmins in Ca2+-
  triggered exocytosis, and KChIPs with Kv4 channels. An index module of module_refs
  would add nothing a reader cannot get from the project page.


  (8) GO-CAM LINKS. gocams/index.tsv has no production model containing KCNN1, KCNN2,
  KCNN3 or KCNN4. Calmodulin (CALM1 only) appears in four human JAK-STAT models, typed with
  calcium ion binding and protein serine/threonine kinase activator activity toward
  CaMKII. Those models describe the camkii_signaling and
  calmodulin_camkii_stat1_potentiation biology, not the channel, so no gocam_associations
  are recorded. The seed's best_gocam (gomodel:67f85f2b00004426, C5AR1 desensitization)
  is unrelated. No PANTHER or PTN ids are asserted: every participant is a concrete human
  gene product.


  (9) POSSIBLE UPSTREAM ISSUES (queries, not removals). (a) KCNN1 and KCNN4 carry TAS
  part_of GO:0008076 voltage-gated potassium channel complex (PMID:8781233, PMID:9380751),
  and CALM1-3 carry the same term by IEA ortholog projection. SK and IK channels are
  voltage-independent (PMID:9774106), so GO:0034705 potassium channel complex would fit
  better. (b) KCNN1, KCNN2 and KCNN3 carry IDA GO:0005242 inward rectifier potassium
  channel activity from PMID:12382077. The currents do rectify inwardly. But GO:0005242 is
  defined as a voltage-gated, Kir-type activity, and its placement beside GO:0016286 may
  over-type the SK channels. This is a question for the curator, since the full text was
  not read. (c) Human CK2 and PP2A have no experimental annotation linking them to the SK2
  channel complex, which may be a curation gap or may reflect the absence of human data.
module:
  id: small_conductance_calcium_activated_potassium_channels
  label: Small- and intermediate-conductance calcium-activated potassium channels
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: potassium ion transmembrane transport
      term:
        id: GO:0071805
        label: potassium ion transmembrane transport
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
  parts:
    - order: 1
      role: Ca2+ sensing by channel-bound calmodulin
      node:
        id: kca_calmodulin_calcium_sensing
        label: Ca2+ binding to the calmodulin bound to each SK or IK pore subunit
        module_type: REGULATORY_STEP
        description: >-
          One calmodulin is bound through its C-lobe to the calmodulin-binding domain of each
          pore subunit whether or not Ca2+ is present. When cytosolic Ca2+ rises, Ca2+ binds
          the calmodulin N-lobe, which then grips the S4-S5 linker of the channel and opens
          the gate. Calmodulin is the only Ca2+ sensor of the channel.
        evidence:
          - source_id: PMID:17329434
            statement: >-
              SK2 channel complexes also contain CK2 and PP2A, which set the Ca2+ sensitivity
              by phosphorylating and dephosphorylating the channel-bound calmodulin. Expression
              study whose cached abstract does not state the species of the clones; recorded as
              regulation of this step, not as complex units (see notes).
            supporting_text: native SK2 channels are multiprotein complexes that contain constitutively associated CaM, both subunits of CK2, and at least two different subunits of PP2A
          - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001140.yaml
            statement: RGD describes opposing CK2 and PP2A control of SK Ca2+ sensitivity.
            supporting_text: Casein kinase acts on closed channels to decrease Ca2+ sensitivity while
        annotons:
          - id: kca_calmodulin_ca_binding
            label: Channel-bound calmodulin binds Ca2+ and gates the SK or IK pore
            participant:
              selector_type: FAMILY
              family:
                preferred_term: calmodulin (CALM1, CALM2, CALM3; identical protein)
                representative_members:
                  - preferred_term: CALM1
                    term:
                      id: UniProtKB:P0DP23
                      label: Calmodulin-1
                  - preferred_term: CALM2
                    term:
                      id: UniProtKB:P0DP24
                      label: Calmodulin-2
                  - preferred_term: CALM3
                    term:
                      id: UniProtKB:P0DP25
                      label: Calmodulin-3
            function:
              preferred_term: calcium ion binding
              term:
                id: GO:0005509
                label: calcium ion binding
              description: >-
                Binds calcium(2+) (CHEBI:29108) at its EF hands; for the SK and IK channels the
                gating Ca2+ is bound by the N-lobe. Experimental human GOA function (IDA on
                CALM1, CALM2 and CALM3); calmodulin's experimental channel-regulator rows concern
                calcium channels only (see notes).
            processes:
              - preferred_term: detection of calcium ion
                term:
                  id: GO:0005513
                  label: detection of calcium ion
            locations:
              - preferred_term: cytoplasmic side of plasma membrane
                term:
                  id: GO:0009898
                  label: cytoplasmic side of plasma membrane
            role_description: >-
              Constitutive Ca2+-sensing subunit of SK and IK channels, four per channel. The
              C-lobe anchors calmodulin to the HA and HB helices of the pore subunit; the
              Ca2+-bound N-lobe binds the S45A helix of the S4-S5 linker, displacing S45B and
              widening the S6 gate. Arrhythmia-associated human calmodulin variants reduce SK2
              current, showing that Ca2+ binding by calmodulin is required for channel
              activation.
            evidence:
              - source_id: PMID:29724949
                statement: In the human SK4-calmodulin complex the C-lobe is bound constitutively and the N-lobe binds the S4-S5 linker only with Ca2+.
                supporting_text: The C-lobe binds to the channel constitutively, whereas the N-lobe interacts with the S4-S5 linker in a Ca2+-dependent manner.
              - source_id: PMID:29724949
                statement: Calmodulin copurifies with human SK4 with or without Ca2+.
                supporting_text: CaM was copurified with the channel in both the presence and absence of Ca2+.
              - source_id: PMID:10026195
                statement: Calmodulin binds the C-tails of human IK1 and SK3 and co-precipitates with human IK1; a Ca2+-sensing-defective calmodulin suppresses IK1 current.
                supporting_text: A mutant calmodulin, defective in Ca2+ sensing but retaining binding to the channel, dramatically reduced current amplitudes
              - source_id: PMID:27165696
                statement: Human SK2 is gated by Ca2+ through constitutively bound calmodulin, and arrhythmogenic calmodulin mutants impede SK2 activation.
                supporting_text: through a constitutive interaction between the pore-forming subunits and calmodulin
              - source_id: PMID:9774106
                statement: Ca2+ gating of SK channels is mediated by Ca2+ binding to calmodulin (rat SK2; mechanism).
                supporting_text: calcium gating of SK channels is mediated by binding of calcium to calmodulin and subsequent conformational alterations in the channel protein
    - order: 2
      role: Ca2+-activated K+ conduction through SK or IK tetramers
      node:
        id: kca_potassium_conduction
        label: Ca2+-activated K+ efflux through SK (KCNN1-3) or IK (KCNN4) channel tetramers
        module_type: TRANSPORT_STEP
        description: >-
          The opened pore conducts K+ from the cytosol to the extracellular side, down its
          electrochemical gradient, hyperpolarizing the plasma membrane. SK channels (unit
          conductance about 10 pS) are tetramers of KCNN1, KCNN2 or KCNN3 in any homo- or
          heteromeric combination; IK channels (about 39 pS inward) are KCNN4 homotetramers.
        variant_sets:
