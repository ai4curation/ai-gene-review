id: MODULE:crispr_cas_adaptive_immunity
title: CRISPR-Cas adaptive immunity
description: >-
  A reusable prokaryotic module for RNA-guided adaptive immunity against mobile
  genetic elements. The module has three obligate stages: adaptation, in which a
  Cas1-Cas2 integrase captures a protospacer from invading DNA and integrates it
  as a new spacer at the leader-proximal end of a CRISPR array; crRNA biogenesis,
  in which the transcribed array is processed into mature guides; and
  interference, in which a crRNA-loaded effector recognises a complementary
  target and destroys it. Effector architecture is the principal axis of
  variation and is modelled as alternative implementations rather than as
  separate modules: multi-subunit class 1 effectors (Cascade-Cas3, Csm/Cmr-Cas10)
  and single-protein class 2 effectors (Cas9, Cas12a, Cas13a) occupy the same
  structural slot in the pathway. Phage-encoded suppression of this module is a
  separate counter-defence module (MODULE:anti_crispr_suppression); host
  restriction-modification, BREX, retron, and other innate defence systems are
  outside the boundary, as is the laboratory use of Cas effectors as genome
  editors.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0099048
    title: CRISPR-cas system
    statement: >-
      GO:0099048 supplies the module boundary and names the same three stages
      used here as parts: acquisition of foreign DNA into CRISPR loci, crRNA
      biogenesis, and target interference.
  - source_id: PMID:17379808
    title: CRISPR provides acquired resistance against viruses in prokaryotes.
    statement: >-
      Establishes the heritable, sequence-specific nature of the system: spacer
      content determines phage resistance, which is the functional output the
      module delivers.
  - source_id: PMID:18703739
    title: Small CRISPR RNAs guide antiviral defense in prokaryotes.
    statement: >-
      Establishes that the array is transcribed and processed into small guide
      RNAs by a Cas protein complex (Cascade), separating crRNA biogenesis from
      interference as distinct stages.
  - source_id: PMID:31857715
    title: "Evolutionary classification of CRISPR-Cas systems: a burst of class 2 and derived variants."
    statement: >-
      Supplies the class 1 / class 2 effector division and the type-level
      subdivisions used as the variant axis for the interference part.
  - source_id: PMID:29522745
    title: "The Biology of CRISPR-Cas: Backward and Forward."
    statement: >-
      Review support for treating adaptation, biogenesis, and interference as
      the three canonical stages shared across all CRISPR-Cas types.
notes: >-
  Three design decisions are worth recording. First, the effector variants are
  variants rather than sibling modules because they are interchangeable
  realisations of one pathway slot; a genome may carry several systems, so
  selection is ONE_OR_MORE rather than EXACTLY_ONE. Second, primed acquisition is
  modelled as a connection from interference back to adaptation rather than as a
  fourth part, since it reuses the same Cas1-Cas2 machinery. Third, GO has no
  molecular-function term for crRNA-guided target recognition, so surveillance
  complexes carry nucleic-acid-binding terms and the gap is recorded in
  knowledge_gaps rather than papered over with an ill-fitting id.
  Exemplars are drawn from the two best-characterised concrete systems --
  Escherichia coli K-12 type I-E (Cas1 Q46896 through Cas3 P38036) and
  Pseudomonas aeruginosa PA14 type I-F (the Csy complex) -- plus the reviewed
  class 2 and type III effectors; they orient the families and are not a claim
  that the module is confined to those organisms.
module:
  id: crispr_cas_adaptive_immunity
  label: CRISPR-Cas adaptive immunity
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: CRISPR-cas system
      term:
        id: GO:0099048
        label: CRISPR-cas system
      description: >-
        RNA-guided clearance of foreign intracellular nucleic acids, comprising
        spacer acquisition, crRNA biogenesis, and target interference.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
      - preferred_term: archaea
        term:
          id: NCBITaxon:2157
          label: Archaea
        description: >-
          Both domains carry CRISPR-Cas systems; type III systems are
          particularly prominent in archaea.
  parts:
    - order: 1
      role: Adaptation - protospacer capture and spacer integration
      node:
        id: adaptation
        label: spacer acquisition
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Capture of a protospacer from invading DNA and its integration as a new
          spacer at the leader-proximal end of the CRISPR array, which is what
          makes the immunity heritable and adaptive.
        concepts:
          - preferred_term: maintenance of CRISPR repeat elements
            term:
              id: GO:0043571
              label: maintenance of CRISPR repeat elements
        annotons:
          - id: cas1_integrase
            label: Cas1 protospacer integrase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: DNA endonuclease activity
                term:
                  id: GO:0004520
                  label: DNA endonuclease activity
              family:
                preferred_term: Cas1 integrase family
                term:
                  id: InterPro:IPR002729
                  label: CRISPR-associated protein Cas1
                representative_members:
                  - preferred_term: cas1 / ygbT (Escherichia coli K-12)
                    term:
                      id: UniProtKB:Q46896
                      label: CRISPR-associated endonuclease Cas1
                    description: Escherichia coli K-12 cas1/ygbT, the type I-E integrase.
                  - preferred_term: cas1 (Pseudomonas aeruginosa PA14)
                    term:
                      id: UniProtKB:Q02ML7
                      label: CRISPR-associated endonuclease Cas1
                    description: Pseudomonas aeruginosa UCBPP-PA14 type I-F cas1.
            function:
              preferred_term: DNA endonuclease activity
              term:
                id: GO:0004520
                label: DNA endonuclease activity
              substrates:
                - preferred_term: protospacer-derived double-stranded DNA fragment
                - preferred_term: CRISPR array leader-repeat junction
              products:
                - preferred_term: CRISPR array carrying a newly integrated spacer
              evidence:
                - source_id: PMID:25707795
                  statement: >-
                    Cas1 performs the integration chemistry itself, by a
                    retroviral-integrase-like transesterification mechanism, with
                    Cas2 as the non-catalytic partner.
                - source_id: GO:0004520
                  statement: GOA records Q46896 as enabling GO:0004520 DNA endonuclease activity.
            processes:
              - preferred_term: maintenance of CRISPR repeat elements
                term:
                  id: GO:0043571
                  label: maintenance of CRISPR repeat elements
            role_description: >-
              Catalytic subunit of the adaptation complex; cleaves the
              leader-repeat junction and joins the protospacer ends into the
              array.
          - id: cas2_adaptation_subunit
            label: Cas2 adaptation complex subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Cas2 family
                term:
                  id: InterPro:IPR010152
                  label: CRISPR-associated protein Cas2 subtype
                representative_members:
                  - preferred_term: cas2 / ygbF (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P45956
                      label: CRISPR-associated endoribonuclease Cas2
                    description: Escherichia coli K-12 cas2/ygbF.
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
              description: >-
                Non-catalytic but not functionless: Cas2 is the element whose
                removal abolishes acquisition. Deleting the beta6-beta7 hairpin
                destroys complex assembly, CRISPR-DNA binding and acquisition
                while leaving the putative active site intact, whereas active-site
                substitutions (E9Q/E9A/E9R) remain fully functional. DNA binding
                is a contributes_to claim only, since Cas2 does not bind the
                substrate alone.
              targets:
                - preferred_term: Cas1 dimers within the adaptation complex
                - preferred_term: protospacer duplex (via the shared arginine clamp)
              evidence:
                - source_id: PMID:26284603
                  statement: >-
                    The structural work states the adaptor reading explicitly.
                  supporting_text: >-
                    It is probable that Cas2 acts as an adaptor protein, either
                    bringing two Cas1 dimers together or mediating interactions
                    with other components necessary for spacer acquisition.
                - source_id: PMID:25707795
                  statement: >-
                    Catalysis is Cas1's; Cas2's contribution is to the efficiency
                    of the joint reaction.
                  supporting_text: >-
                    Cas1 is the catalytic subunit and Cas2 substantially increases
                    integration activity
                - source_id: file:ECOLI/ygbF/ygbF-ai-review.yaml
                  statement: >-
                    The curated review adjudicates both GOA GO:0005515 rows to
                    GO:0030674, and adjudicates the UniProt endoribonuclease name
                    as a family-level holdover with no assay on this protein.
            processes:
              - preferred_term: maintenance of CRISPR repeat elements
                term:
                  id: GO:0043571
                  label: maintenance of CRISPR repeat elements
            evidence:
              - source_id: PMID:24793649
                statement: >-
                  Cas1-Cas2 complex formation is required for spacer acquisition
                  in vivo, and Cas2 acts as a structural rather than catalytic
                  component of the integration complex.
            role_description: >-
              Dimeric adaptor that bridges two Cas1 dimers and, with Cas1, forms
              the clamp that measures the protospacer duplex. The bridging is
              asserted as an adaptor activity; the measuring is not, because GO
              has no term for it.
    - order: 2
      role: crRNA biogenesis
      node:
        id: crrna_biogenesis
        label: crRNA biogenesis
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Conversion of the primary CRISPR array transcript into mature,
          repeat-derived guides that license the effector. The processing
          chemistry differs by system type, which is the variant axis here.
        variant_sets:
          - id: crrna_maturation_route
            label: pre-crRNA maturation route
            axis: processing enzyme architecture
            selection: ONE_OR_MORE
            notes: >-
              A genome carrying more than one CRISPR-Cas type will run more than
              one route, so ONE_OR_MORE is used; within a single system the
              routes are mutually exclusive. The RNase III route also carries a
              substrate-size bound that the Cas6 route does not: a single-spacer
              array is matured without it (PMID:23535272).
            variants:
              - id: cas6_endoribonuclease_route
                label: Cas6-family metal-independent endoribonuclease route
                module_type: REACTION
                description: >-
                  The route used by class 1 systems and by type III: a
                  Cas6-family enzyme cleaves within the repeat, either as a
                  standalone enzyme or as an integral Cascade subunit.
                annotons:
                  - id: cas6_processing_activity
                    label: Cas6-family pre-crRNA endoribonuclease
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: RNA endonuclease activity
                        term:
                          id: GO:0004521
                          label: RNA endonuclease activity
                      family:
                        preferred_term: Cas6-family pre-crRNA endoribonuclease
                        description: >-
                          Ferredoxin-fold repeat-specific endoribonucleases. The
                          subtype-specific names Cas6, Cas6e/CasE/Cse3, and
                          Cas6f/Csy4 denote orthologous activities placed
                          differently relative to the surveillance complex.
                        representative_members:
                          - preferred_term: casE / cas6e (Escherichia coli K-12)
                            term:
                              id: UniProtKB:Q46897
                              label: CRISPR system Cascade subunit CasE
                            description: >-
                              Escherichia coli K-12 cas6e/casE; the type I-E
                              processing enzyme, which is retained as a Cascade
                              subunit after cleavage.
                          - preferred_term: cas6f / csy4 (Pseudomonas aeruginosa PA14)
                            term:
                              id: UniProtKB:Q02MM2
                              label: CRISPR-associated endonuclease Cas6/Csy4
                            description: Pseudomonas aeruginosa UCBPP-PA14 type I-F cas6f.
                          - preferred_term: cas6 (Mycobacterium tuberculosis H37Rv)
                            term:
                              id: UniProtKB:P9WPJ1
                              label: CRISPR-associated endoribonuclease Cas6
                            description: >-
                              Mycobacterium tuberculosis H37Rv cas6, a type III-A
                              standalone processing enzyme.
                    function:
                      preferred_term: RNA endonuclease activity
                      term:
                        id: GO:0004521
                        label: RNA endonuclease activity
                      substrates:
                        - preferred_term: pre-crRNA (primary CRISPR array transcript)
                      products:
                        - preferred_term: mature crRNA bearing a repeat-derived 5' handle
                      evidence:
                        - source_id: GO:0004521
                          statement: >-
                            GOA records Q46897 (CasE) as enabling GO:0004521 RNA
                            endonuclease activity; Q02MM2 (Cas6f) carries the
                            parent GO:0004519 endonuclease activity.
                        - source_id: PMID:18703739
                          statement: >-
                            Establishes Cas-protein-dependent processing of the
                            array transcript into the small guide RNAs that
                            direct antiviral defence.
                    processes:
                      - preferred_term: maintenance of CRISPR repeat elements
                        term:
                          id: GO:0043571
                          label: maintenance of CRISPR repeat elements
                    role_description: >-
                      Cleaves within each repeat to release single-spacer guides;
                      in type I-E and I-F the enzyme remains bound to the product
                      and nucleates the surveillance complex.
              - id: rnase_iii_tracrrna_route
                label: tracrRNA-dependent RNase III route
                module_type: REACTION
                description: >-
                  The type II route: a trans-encoded tracrRNA base-pairs with the
                  repeat portion of pre-crRNA, and the resulting duplex is cut by
                  housekeeping RNase III rather than by a Cas enzyme.
                annotons:
                  - id: rnase_iii_processing_activity
                    label: RNase III pre-crRNA:tracrRNA duplex processing
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: ribonuclease III activity
                        term:
                          id: GO:0004525
                          label: ribonuclease III activity
                      family:
                        preferred_term: bacterial RNase III family
                        description: >-
                          Housekeeping double-strand-specific endoribonuclease
                          recruited by type II systems; it is not a Cas protein
                          and is not encoded in the cas locus.
                        representative_members:
                          - preferred_term: rnc (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P0A7Y0
                              label: Ribonuclease 3
                            description: >-
                              Escherichia coli K-12 rnc. The type II maturation
                              reaction was characterised in Streptococcus
                              pyogenes and reconstituted with the E. coli enzyme
                              in a heterologous host, so this exemplar has
                              direct functional data on a type II
                              pre-crRNA:tracrRNA substrate rather than being a
                              sequence stand-in. Note that E. coli K-12's own
                              type I-E system does not use this route; it
                              processes pre-crRNA with Cas6e.
                    function:
                      preferred_term: ribonuclease III activity
                      term:
                        id: GO:0004525
                        label: ribonuclease III activity
                      substrates:
                        - preferred_term: pre-crRNA:tracrRNA double-stranded region
                      products:
                        - preferred_term: mature crRNA:tracrRNA guide duplex
                      evidence:
                        - source_id: PMID:21455174
                          statement: >-
                            crRNA maturation in a type II system requires a
                            trans-encoded small RNA (tracrRNA) and the host factor
                            RNase III.
                        - source_id: PMID:23535272
                          statement: >-
                            An rnc-deficient Escherichia coli host carrying a
                            transplanted type II system loses plasmid immunity,
                            which is the direct functional evidence for the
                            E. coli enzyme on this substrate. The same work
                            bounds the requirement by array length.
                          supporting_text: >-
                            RNase III is not necessary for the maturation of
                            pre-crRNA containing a single CRISPR spacer
                    role_description: >-
                      Supplies the processing chemistry that type II systems do
                      not encode themselves; the output is a two-RNA guide rather
                      than a single crRNA.
    - order: 3
      role: Interference - target recognition and destruction
      node:
        id: interference
        label: target interference
        module_type: BIOLOGICAL_PROCESS
        description: >-
          crRNA-guided recognition of a complementary target and its destruction.
          Effector architecture varies more than any other part of the module and
          is modelled as a variant set over the same pathway slot.
        concepts:
          - preferred_term: defense response to virus
            term:
              id: GO:0051607
              label: defense response to virus
            description: >-
              The immune output of the module; retained at this node rather than
              at the root because it is interference, not adaptation or
              biogenesis, that clears the invader.
        variant_sets:
          - id: effector_architecture
            label: crRNA-guided effector architecture
            axis: effector subunit composition and target chemistry
            selection: ONE_OR_MORE
            notes: >-
              Class 1 effectors are multi-subunit surveillance complexes that
              recruit a separate nuclease; class 2 effectors are single proteins
              that both recognise and cleave. Genomes frequently carry several
              systems of different types, hence ONE_OR_MORE.
            evidence:
              - source_id: PMID:31857715
                statement: >-
                  Supplies the class 1 / class 2 division and the type
                  assignments used to name these variants.
            variants:
              - id: cascade_cas3_variant
                label: Class 1 type I Cascade-Cas3 interference
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  A multi-subunit Cascade surveillance complex forms a
                  PAM-licensed R-loop at the target and recruits the processive
                  Cas3 helicase-nuclease, which degrades the target DNA.
                annotons:
                  - id: cascade_surveillance_complex
                    label: Cascade crRNA-guided surveillance complex
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: Cascade (CRISPR-associated complex for antiviral defence)
                        description: >-
                          Multi-subunit class 1 surveillance complex built on a
                          Cas7 backbone around a single crRNA. Named Cascade
                          (CasABCDE) in type I-E and the Csy complex in type I-F.
                        active_units:
                          - id: cascade_large_subunit
                            label: Cas8e/Cse1 large subunit
                            role: Recognises the PAM and recruits Cas3 to the licensed R-loop.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: casA / cse1 (Escherichia coli K-12)
                                term:
                                  id: UniProtKB:Q46901
                                  label: CRISPR system Cascade subunit CasA
                                description: >-
                                  Escherichia coli K-12 casA/cse1.
                          - id: cascade_cse2_subunit
                            label: Cse2/CasB subunit
                            role: Stabilises the R-loop along the displaced strand.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: casB / cse2 (Escherichia coli K-12)
                                term:
                                  id: UniProtKB:P76632
                                  label: CRISPR system Cascade subunit CasB
                          - id: cascade_cas7_backbone
                            label: Cas7 backbone subunit
                            role: Oligomerises along the crRNA and presents the guide in segments for base pairing.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: casC / cas7 (Escherichia coli K-12)
                                term:
                                  id: UniProtKB:Q46899
                                  label: CRISPR system Cascade subunit CasC
                                description: >-
                                  The backbone surface targeted by several type I anti-CRISPR proteins.
                          - id: cascade_cas5_subunit
                            label: Cas5 subunit
                            role: Caps the crRNA 5' handle and anchors it in the complex.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: casD / cas5 (Escherichia coli K-12)
                                term:
                                  id: UniProtKB:Q46898
                                  label: CRISPR system Cascade subunit CasD
                          - id: cascade_cas6e_subunit
                            label: Cas6e processing subunit
                            role: Retains the crRNA 3' hairpin after processing it, tying biogenesis to complex assembly.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: casE / cas6e (Escherichia coli K-12)
                                term:
                                  id: UniProtKB:Q46897
                                  label: CRISPR system Cascade subunit CasE
                          - id: csy_cas7f_backbone
                            label: Cas7f/Csy3 backbone subunit
                            role: Type I-F backbone equivalent of Cas7; the surface bound by AcrIF8 and related inhibitors.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: csy3 / cas7f (Pseudomonas aeruginosa PA14)
                                term:
                                  id: UniProtKB:Q02MM1
                                  label: CRISPR-associated protein Csy3
                          - id: csy_cas8f_subunit
                            label: Cas8f/Csy1 large subunit
                            role: Type I-F large subunit; PAM recognition and Cas3 recruitment.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: csy1 / cas8f (Pseudomonas aeruginosa PA14)
                                term:
                                  id: UniProtKB:Q02ML9
                                  label: CRISPR-associated protein Csy1
                          - id: csy_cas5f_subunit
                            label: Cas5f/Csy2 subunit
                            role: Type I-F Cas5 equivalent.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: csy2 / cas5f (Pseudomonas aeruginosa PA14)
                                term:
                                  id: UniProtKB:Q02MM0
                                  label: CRISPR-associated protein Csy2
                    function:
                      preferred_term: double-stranded DNA binding
                      term:
                        id: GO:0003690
                        label: double-stranded DNA binding
                      description: >-
                        Stands in for crRNA-guided, PAM-licensed target
                        recognition and R-loop formation, for which GO has no
                        molecular-function term (see knowledge_gaps).
                      evidence:
                        - source_id: PMID:18703739
                          statement: >-
                            Cascade is the crRNA-bound complex required for
                            antiviral defence, acting upstream of target
                            degradation.
                    processes:
                      - preferred_term: CRISPR-cas system
                        term:
                          id: GO:0099048
                          label: CRISPR-cas system
                    role_description: >-
                      Finds the target, verifies the PAM, and forms the R-loop
                      that licenses nuclease recruitment; it does not itself
                      degrade the target.
                  - id: cas3_target_degradation
                    label: Cas3 helicase-nuclease target degradation
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Cas3 helicase-nuclease family
                        term:
                          id: InterPro:IPR006474
                          label: Helicase Cas3, CRISPR-associated, core
                        representative_members:
                          - preferred_term: cas3 / ygcB (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P38036
                              label: CRISPR-associated endonuclease/helicase Cas3
                            description: Escherichia coli K-12 cas3/ygcB, type I-E.
                          - preferred_term: cas3 (Pseudomonas aeruginosa PA14, type I-F)
                            term:
                              id: UniProtKB:Q02ML8
                              label: CRISPR-associated nuclease/helicase Cas3 subtype I-F/YPEST
                            description: >-
                              Pseudomonas aeruginosa UCBPP-PA14 cas3; the target
                              of the anti-CRISPR protein AcrF3.
                    function:
                      preferred_term: single-stranded DNA endonuclease activity
                      term:
                        id: GO:0000014
                        label: single-stranded DNA endonuclease activity
                      description: >-
                        The committing step, and the one the immunity phenotype
                        tracks: the HD-domain nick on the displaced strand.
                        Degradation that follows is a coupled, separable
                        activity, carried by GO:0008310 single-stranded DNA
                        3'-5' DNA exonuclease activity together with GO:0033677
                        DNA/RNA helicase activity. The helicase-motif mutant
                        K320N separates them, which is why the nick rather than
                        the exonuclease is asserted here.
                      substrates:
                        - preferred_term: R-loop-displaced single-stranded target DNA
                      products:
                        - preferred_term: nicked then processively degraded target DNA
                      evidence:
                        - source_id: PMID:22521689
                          statement: >-
                            Direct assay of the Cascade-Cas3 complex on
                            partly single-stranded substrates.
                          supporting_text: >-
                            reveals that Cas3 has endonuclease and 3′ to 5′
                            exonuclease activity on the single stranded region
                            of the DNA substrate
                        - source_id: file:ECOLI/ygcB/ygcB-ai-review.yaml
                          statement: >-
                            The curated review refines the GOA GO:0008296 row to
                            GO:0008310 on the grounds that the measured
                            exonuclease is single-strand-restricted, and retains
                            GO:0000014 as the IDA-supported committing activity.
                    processes:
                      - preferred_term: defense response to virus
                        term:
                          id: GO:0051607
                          label: defense response to virus
                      - preferred_term: CRISPR-cas system
                        term:
                          id: GO:0099048
                          label: CRISPR-cas system
                    role_description: >-
                      Recruited by the large Cascade subunit to the licensed
                      R-loop; nicks the displaced strand and then processively
                      unwinds and degrades the target, making it the committed
                      destruction step of type I systems.
              - id: cas10_csm_variant
                label: Class 1 type III Csm/Cmr-Cas10 interference with cOA signalling
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  Type III effectors are licensed by target RNA rather than DNA.
                  Target-RNA binding activates two separable Cas10 activities:
                  HD-domain degradation of the transcribed DNA, and Palm-domain
                  synthesis of cyclic oligoadenylate second messengers that
                  switch on accessory ribonucleases.
                annotons:
                  - id: csm_effector_complex
                    label: Csm/Cmr target-RNA-binding effector complex
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: Csm (type III-A) / Cmr (type III-B) effector complex
                        active_units:
                          - id: csm_cas10_thet8
                            label: Cas10/Csm1 catalytic subunit
                            role: Carries both the HD nuclease and the Palm cyclase domains that the complex activates.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: cas10 / csm1 (Thermus thermophilus HB8)
                                term:
                                  id: UniProtKB:Q53W19
                                  label: CRISPR system single-strand-specific deoxyribonuclease Cas10/Csm1
                                description: >-
                                  Thermus thermophilus HB8 cas10/csm1.
                          - id: csm_cas10_strth
                            label: Cas10/Csm1 catalytic subunit (cOA exemplar)
                            role: The orthologue in which target-RNA-triggered cyclic oligoadenylate synthesis was demonstrated.
                            participant:
                              selector_type: GENE_PRODUCT
                              gene_product:
                                preferred_term: cas10 / csm1 (Streptococcus thermophilus)
                                term:
                                  id: UniProtKB:A0A0A7HFE1
