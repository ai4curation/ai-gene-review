        stimulates Cas1-Cas2 to acquire further spacers from the same invader,
        making the module self-reinforcing rather than strictly linear.
knowledge_gaps:
  - gap_statement: >-
      GO has no molecular-function term for crRNA-guided (RNA-programmed) target
      recognition, so surveillance complexes and single effectors can only be
      annotated with generic nucleic-acid-binding and nuclease terms that do not
      distinguish them from unguided nucleases.
    boundary: >-
      The nuclease chemistry is well covered (GO:0004520, GO:0004521,
      GO:0004530); what is missing is the guide-dependence that defines the
      system.
    gap_kind:
      - ONTOLOGY
    status: OPEN
    significance: >-
      Without such a term, the defining property of every Cas effector is
      invisible to GO-based reasoning, and Cascade/Csy complexes are annotated
      indistinguishably from generic double-stranded DNA binding proteins.
    resolution: >-
      Request a molecular-function term for guide-RNA-dependent nucleic acid
      recognition, with children for RNA-guided DNA endonuclease activity and
      RNA-guided RNA endonuclease activity.
  - gap_statement: >-
      No GO term exists for cyclic oligoadenylate synthase activity, the Palm/
      cyclase output of Cas10, nor for the cOA-activated state of CARF-domain
      ribonucleases.
    boundary: >-
      GO:0001730 covers 2'-5'-oligoadenylate synthetase activity in the
      metazoan interferon system, which is a different chemistry and a different
      product; it must not be reused for Cas10.
    gap_kind:
      - ONTOLOGY
    status: OPEN
    significance: >-
      cOA signalling is the mechanism that makes type III immunity a two-tier
      system, and it is the component that anti-CRISPR ring nucleases attack; it
      currently cannot be represented at all.
    resolution: >-
      Request a cyclic oligoadenylate synthase activity term (with ChEBI
      entities for cA3-cA6 where absent) and a matching process term for cOA
      second-messenger signalling.
  - gap_statement: >-
      No GO molecular-function term expresses the molecular-ruler behaviour that
      fixes spacer length: the Cas1-Cas2 assembly measures the protospacer
      duplex (23 bp plus 5-nucleotide 3' splays, giving a 33 bp spacer) and that
      measuring is what sets the dimensions of the whole system's guides.
    boundary: >-
      Cas2's bridging role itself IS expressible, as GO:0030674
      protein-macromolecule adaptor activity, and is now asserted here. The gap
      is only the measurement, which GO:0030674 says nothing about. A separate
      curation issue is that Cas2's UniProt name records an endoribonuclease
      activity that rests on archaeal homologues with no assay on the E. coli
      protein, and which UniProt itself concedes is not required for acquisition;
      GOA carries no nuclease row for P45956, so nothing propagates today.
    gap_kind:
      - ONTOLOGY
      - CURATION
    status: OPEN
    significance: >-
      Spacer length is the parameter that makes crRNAs interchangeable across the
      pathway, and the entity that sets it currently cannot be annotated for
      doing so. The term would belong to the assembly, with Cas2 carrying it as
      contributes_to.
    resolution: >-
      Request a protospacer length determination activity term scoped to the
      assembly; separately, ask UniProt to qualify the Cas2 endoribonuclease name
      so it is not later propagated into GO.
