id: MODULE:tsh_signaling
title: Thyroid-stimulating hormone signaling pathway module
description: >-
  Secreted heterodimeric thyroid-stimulating hormone (thyrotropin, TSH), assembled in anterior
  pituitary thyrotrophs from the receptor-specificity-determining beta subunit TSHB
  (PANTHER:PTHR11515:SF5) and the common glycoprotein hormone alpha subunit CGA
  (PANTHER:PTHR11509:SF0), binds the extracellular leucine-rich-repeat domain of the
  thyroid-stimulating hormone receptor (TSHR, PANTHER:PTHR24372:SF0) at the basolateral plasma
  membrane of thyroid follicular cells. Hormone binding induces a conformational push-pull shift
  in the TSHR extracellular domain that activates the seven-transmembrane bundle to couple
  primarily to heterotrimeric Gs (GNAS, PANTHER:PTHR10218:SF348)—stimulating adenylyl cyclase and
  cAMP-dependent thyroid hormone synthesis and secretion—and at higher hormone occupancy to Gq/11
  (GNAQ, PANTHER:PTHR10218:SF329) to activate phospholipase C-beta and dual oxidase-dependent
  iodide organification, executing the thyroid-stimulating hormone signaling pathway (GO:0038194).
status: DRAFT
evidence:
  - source_id: GO:0038194
    title: thyroid-stimulating hormone signaling pathway
    statement: >-
      The module is grounded in the GO biological process term for thyroid-stimulating hormone
      signaling pathway (GO:0038194: the series of molecular signals initiated by thyroid-stimulating
      hormone binding to its receptor on the surface of a target cell).
  - source_id: PMID:36001021
    title: Novel TSHB variant (c.217A>C) causing severe central hypothyroidism and pituitary hyperplasia.
    supporting_text: >-
      TSH is a member of the glycoprotein hormone family, which includes luteinising hormone,
      follicle-stimulating hormone, and human chorionic gonadotropin. All are heterodimers of a
      common α subunit and subtype-specific β subunit, which determines the biologic specificity.
    statement: >-
      Establishes that TSH is a heterodimer of the common alpha subunit (CGA) and the
      TSH-specific beta subunit (TSHB) required for thyroid hormone synthesis.
  - source_id: Reactome:R-HSA-378952
    title: Thyrotropin is a heterodimer
    supporting_text: >-
      Like other glycoprotein hormones, TSH consists of a common alpha subunit and a beta subunit
      unique to TSH which determines its specificty. TSH binds to TSH receptor to stimulate the
      release of the hormones thyroxine (T4) and triiodothyronine (T3) (Chin and Habener 1981).
    statement: >-
      Establishes non-covalent heterodimeric assembly of CGA and TSHB into active TSH that binds
      TSHR.
  - source_id: Reactome:R-HSA-391375
    title: TSHR binds TSH/Thyrostimulin
    supporting_text: >-
      Thyroid-stimulating hormone (TSH, thyrotropin) binds thyrotropin receptor (TSHR) on the
      basolateral membrane of thyroid cells (Nagayama Y et al., 1989).
    statement: >-
      Establishes heterodimeric TSH binding to TSHR on thyroid follicular cells and activation of
      Gs signaling.
  - source_id: PANTHER:PTN000162063
    title: PAINT node PTN000162063 for glycoprotein hormone beta subunits (TSHB)
    statement: >-
      Local PAINT IBD node in PTHR11515 with propagated terms C:GO:0005576, F:GO:0005179,
      P:GO:0007186; PAINT date 20260828.
  - source_id: PANTHER:PTN002608947
    title: PAINT node PTN002608947 for glycoprotein hormone alpha chain (CGA)
    statement: >-
      Local PAINT IBD node in PTHR11509 with propagated terms C:GO:0016914, P:GO:0007186; PAINT
      date 20250320.
notes: >-
  Curated signaling-pathway module for the thyroid-stimulating hormone signaling pathway
  (GO:0038194) built with PANTHER FAMILY/subfamily selectors, explicit molecular functions,
  biological processes, and cellular locations across both obligate subunits of heterodimeric
  thyrotropin—TSHB (PANTHER:PTHR11515:SF5) and CGA (PANTHER:PTHR11509:SF0)—the thyrotropin
  receptor TSHR (PANTHER:PTHR24372:SF0), and downstream heterotrimeric Gs (GNAS,
  PANTHER:PTHR10218:SF348) and Gq (GNAQ, PANTHER:PTHR10218:SF329) alpha subunits.
