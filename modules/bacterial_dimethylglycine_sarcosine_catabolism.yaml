  title: 'Homeostasis and catabolism of choline and glycine betaine: lessons from Pseudomonas aeruginosa.'
  findings:
  - statement: The review places betaine catabolism in a subset of bacterial lineages and distinguishes
      nutrient utilization from osmoprotectant retention. It does not establish universal pathway presence
      from bacterial taxon membership.
    supporting_text: 'bacteria have catabolic pathways for the multistep conversion of choline, via

      GB, to glycine and can thereby use choline and GB as sole sources of carbon and

      nitrogen.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'ABSTRACT_ONLY: Only the accessible text supports these findings; primary experiments
      and exact strain/sequence bridges are assessed separately.'
- id: PMID:12912903
  title: Channelling and formation of 'active' formaldehyde in dimethylglycine oxidase.
  findings:
  - statement: Arthrobacter globiformis DMGO has an oxidative active site and a distinct THF-dependent
      site linked by an internal chamber. This is a genuine alternative first-step architecture; bifunctionality
      does not imply sarcosine oxidation.
    supporting_text: 'The active sites in DMGO are approximately 40 A apart,

      connected by a large irregular internal cavity.'
  - statement: Structural and product measurements couple dimethylglycine oxidation to 5,10-methylenetetrahydrofolate
      formation.
    supporting_text: in the presence of THF, 5,10-methylene-THF is formed at the expense of formaldehyde
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text read. Two catalytic regions are separated by about 40 angstroms; folinic/folic
      acid complexes and THF-dependent product assays support distinct oxidation and folate-capture chemistry.
      Static structure alone does not establish channeling efficiency; the later reporter study addresses
      that question. RCSB 1PJ5 polymer matches the frozen protein exactly.
- id: PMID:17951379
  title: Identification of two gene clusters and a transcriptional regulator required for Pseudomonas
    aeruginosa glycine betaine catabolism.
  findings:
  - statement: Native P. aeruginosa mutants place DgcAB before sarcosine and SoxBDAG after it. The screen/main
      mutants use PA14 with PAO1 locus numbering; this is ortholog evidence for KT2440, not a KT2440 reconstitution.
    supporting_text: are required for the conversion of DMG to sarcosine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. PA14 main mutants, PAO1 numbering; the NMR targets are dgcB and
      soxA. Genetic pathway placement does not identify the physiological electron acceptor.
- id: PMID:32631860
  title: Role of N,N-Dimethylglycine and Its Catabolism to Sarcosine in Chromohalobacter salexigens DSM
    3043.
  findings:
  - statement: Purified DdhC oxidizes DMG and sarcosine using artificial dye acceptors. Native gene disruptions
      implicate DdhC, Csal_0991 and EtfAB in DMG utilization; the ordered electron relay is proposed.
    supporting_text: with PMS as the electron intermediator and DCPIP or NBT as the terminal electron
      acceptor.
  - statement: The four-gene cluster is required for native DMG utilization, while sarcosine utilization
      remains possible in the tested mutants. DdhC secondary sarcosine turnover is not evidence for an
      obligatory native second-step role.
    supporting_text: the csal_0990, csal_0991, csal_0992, and csal_0993 genes are responsible for DMG
      degradation to sarcosine
  - statement: The Discussion assigns ETF as the electron acceptor of Arthrobacter DMGO, but direct primary
      DMGO kinetics and structure/mechanism studies establish oxygen-dependent turnover. This background
      statement is rejected; it does not invalidate the DdhC assays cited for the separate Dgc pathway.
    supporting_text: FAD serves as a coenzyme by passing electrons from DMG to its physiological electron
      acceptor ETF
    finding_review:
      review_notes: Earlier direct primary experiments establish O2 as DMGO acceptor. The conflicting
        2020 background sentence is not used as evidence for the module; the correction follows stronger
        direct evidence, not publication recency.
      superseded_by:
      - PMID:11926836
      - PMID:12912903
      finding_status: OVERTURNED
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text inspected. Native genetics uses rifampin-resistant ZW4-1 derived from DSM3043;
      purified recombinant DdhC carries an N-terminal His tag. Direct DdhC-to-ferredoxin-to-ETF transfer
      was not reconstituted. Verified for the DdhC assays and native genetics used here. Its Discussion
      separately assigns ETF as the physiological acceptor of Arthrobacter DMGO; that background statement
      conflicts with direct oxygen-dependent DMGO evidence in PMID11926836 and PMID12912903 and is not
      adopted.
- id: PMID:9185627
  title: Folate utilization by monomeric versus heterotetrameric sarcosine oxidases.
  findings:
  - statement: Comparative assays distinguish folate-utilizing heterotetrameric sarcosine oxidases from
      monomeric enzymes; folate changes product partitioning and does not justify a universal claim of
      zero formaldehyde release.
    supporting_text: only the heterotetrameric sarcosine oxidases can use tetrahydrofolates as substrates
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract contains comparative product assays. Do not identify an unnamed corynebacterial
      assay strain with U-96; U-96 structure and exact gene identity are supported separately.
- id: PMID:15946648
  title: Crystal structure of heterotetrameric sarcosine oxidase from Corynebacterium sp. U-96.
  findings:
  - statement: The U-96 complex places NAD and folate binding in alpha, FAD/FMN and substrate-site ligands
      in beta, and a zinc site in delta. A ligand-bound structure does not prove that every ligand is
      oxidized.
    supporting_text: The beta subunit contains dimethylglycine, FAD, and FMN
  - statement: Gamma contacts alpha; its putative folate-related structure is suggestive and does not
      establish an autonomous catalytic activity.
    supporting_text: The gamma subunit is in contact with two domains of alpha subunit
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract and exact PDB sequence mappings inspected. Dimethylglycine is a bound analogue
      here, not demonstrated SoxB substrate turnover. Complete folate-coupled chemistry is assigned to
      the assembled complex.
- id: PMID:15914915
  title: Corynebacterium sp. U-96 contains a cluster of genes of enzymes for the catabolism of sarcosine
    to pyruvate.
  findings:
  - statement: Coexpressed SoxABDG is functional; the isolated beta and beta-delta constructs are unstable
      and lack bound flavin during purification. Active-site location does not establish an autonomous
      complete folate-coupled beta-subunit activity.
    supporting_text: Functional expression of sarcosine oxidase in Escherichia coli was accomplished
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract plus independently inspected full J-STAGE PDF p955; exact short excerpt/provenance
      is in the PSEPK SoxB assembly source. Construct-specific failures do not prove autonomous activity
      chemically impossible.
- id: PMID:8779579
  title: Analysis of interaction between the Arthrobacter sarcosine oxidase and the coenzyme flavin adenine
    dinucleotide by site-directed mutagenesis.
  findings:
  - statement: TE1826 monomeric SoxA mutagenesis links FAD-binding residues to sarcosine oxidase activity.
      This monomeric enzyme is distinct from the tetrameric alpha subunit also called SoxA.
    supporting_text: Sarcosine oxidase from Arthrobacter sp. TE1826 (SoxA) tightly binds with the coenzyme
      flavin adenine dinucleotide (FAD).
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract inspected; no unreported experimental details inferred.
- id: PMID:11035956
  title: A mutant sarcosine oxidase in which activity depends on flavin adenine dinucleotide.
  findings:
  - statement: C318S weakens the covalent-flavin linkage and activity; free FAD restores mutant activity,
      distinguishing the native covalent attachment from an absolute requirement for any turnover.
    supporting_text: the activity of the mutant was recovered in the presence of flavin adenine dinucleotide
      (FAD)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract inspected; no unreported experimental details inferred.
- id: PMID:35266867
  title: Creatine utilization as a sole nitrogen source in Pseudomonas putida KT2440 is transcriptionally
    regulated by CahR.
  findings:
  - statement: The KT2440 creatine study describes SoxBDAG as downstream pathway background. It does not
      directly measure KT2440 Sox product partitioning or establish the DMG electron relay.
    supporting_text: sarcosine is then converted to glycine and formaldehyde by the tetrameric sarcosine
      oxidase (SoxBDAG)
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached full text inspected.
- id: PMID:38501746
  title: 'Choline degradation in Paracoccus denitrificans: identification of sources of formaldehyde.'
  findings:
  - statement: Paracoccus physiology links both DMG and sarcosine catabolism to formaldehyde production.
      Whole-pathway phenotypes do not identify a purified enzyme or justify importing an unverified gene
      into a representative panel.
    supporting_text: the oxidative demethylations of glycine betaine, dimethylglycine, and sarcosine as
      sources of formaldehyde.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract inspected; organism-level product evidence, not an exact enzyme/sequence
      bridge.
- id: PMID:28660361
  title: Establishment of a markerless gene deletion system in Chromohalobacter salexigens DSM 3043.
  findings:
  - statement: The deletion-system paper constructs two single mutants and a double mutant. Accessible
      figures name sarC and csal1415; they do not map four independent Sox-subunit deletions.
    supporting_text: two single-gene deletion mutants and a double-gene deletion mutant were constructed.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract and publisher figures inspected; full text/captions remain unavailable. Specific
      Csal0998-1001 subunit roles rest on domain/locus identity and comparative evidence, not four demonstrated
      individual knockout phenotypes.
- id: PMID:11422368
  title: 'Organization of the genes involved in dimethylglycine and sarcosine degradation in Arthrobacter
    spp.: implications for glycine betaine catabolism.'
  findings:
  - statement: The cloned dmg gene encodes the characterized NRRL B-2979 DMGO; the separately cloned SoxBDAG
      operon comes from a different Arthrobacter strain.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal cache abstract-only; publisher full text read via web. Native NRRL B-2979 and
      recombinant pEH1/E. coli JM109 enzyme were studied. Product and substrate-exclusion assays distinguish
      DMGO from sarcosine oxidase. SoxBDAG donor is Arthrobacter sp. 1-IN, not NRRL B-2979. Short non-cached
      excerpt is retained in the local primary-evidence source.
- id: PMID:11926836
  title: Mechanistic aspects of the covalent flavoprotein dimethylglycine oxidase of Arthrobacter globiformis
    studied by stopped-flow spectrophotometry.
  findings:
  - statement: Stopped-flow experiments directly establish dimethylglycine and molecular oxygen as reaction
      substrates.
    supporting_text: using dimethylglycine and O2 as substrates
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract explicitly reports reductive/oxidative half-reactions, oxygen dependence, peroxide
      output and covalent histidyl-48-FAD. Full kinetics paper was not acquired; no unreported assay detail
      is inferred.
- id: PMID:19369258
  title: An internal reaction chamber in dimethylglycine oxidase provides efficient protection from exposure
    to toxic formaldehyde.
  findings:
  - statement: Active-site impairment or C-terminal deletion uncouples oxidation from folate capture and
      increases formaldehyde release.
    supporting_text: uncoupling of the active sites could be achieved by mutagenesis or deletion
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Normal cache abstract-only, but full PMC HTML read independently and preserved in ignored
      cache. E. coli W3GM reporter experiments concern recombinant Arthrobacter enzyme, not native Arthrobacter
      flux. 3GSI is D552A, residues 4–830; the linear-versus-cyclic intermediate remains unresolved.
- id: file:modules/bacterial_dimethylglycine_sarcosine_catabolism-source-analysis/historical-sarcosine-dehydrogenase.md
  title: Historical C-83 sarcosine-dehydrogenase identity and assay audit
  findings:
