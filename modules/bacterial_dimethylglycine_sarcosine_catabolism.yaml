      role: dimethylglycine demethylation to sarcosine
      node:
        id: dimethylglycine_to_sarcosine
        label: Dimethylglycine conversion to sarcosine
        module_type: REACTION
        annotons:
          - id: dgca_dehydrogenase_activity
            label: DgcA dimethylglycine dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DgcA flavin oxidoreductase family
                description: >-
                  Two-domain flavoproteins (an Old Yellow Enzyme-like barrel fused to an
                  FAD/NAD(P)-binding domain) encoded in a conserved
                  dgcA-dgcB-etfA-etfB neighborhood. No PANTHER id is asserted:
                  PTHR43656 and its SF2 subfamily also contain unrelated single-domain
                  flavin oxidoreductases (see the PTHR43656 family review).
                representative_members:
                  - preferred_term: DgcA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88R24
                      label: Dimethylglycine dehydrogenase subunit
                  - preferred_term: DdhC (Chromohalobacter salexigens)
                    term:
                      id: UniProtKB:Q1QYW1
                      label: N,N-dimethylglycine/sarcosine dehydrogenase
            function:
              preferred_term: N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin) activity
              term:
                id: GO:0033694
                label: oxidoreductase activity, acting on the CH-NH group of donors, iron-sulfur protein as acceptor
              substrates:
                - preferred_term: N,N-dimethylglycine
                - preferred_term: oxidized 2[4Fe-4S] ferredoxin (DgcB)
                - preferred_term: water
              products:
                - preferred_term: sarcosine
                - preferred_term: formaldehyde
                - preferred_term: reduced 2[4Fe-4S] ferredoxin (DgcB)
                - preferred_term: 2 protons
            role_description: >-
              EC 1.5.7.3 (RHEA:74167). DdhC is active as a monomer containing
              noncovalent FAD and bound NAD(P), and the membrane ferredoxin DgcB is
              the electron acceptor it reduces, so the activity belongs to DgcA alone.
              GO has no term for this reaction; the member reviews propose
              "N,N-dimethylglycine/sarcosine dehydrogenase (ferredoxin) activity"
              under GO:0033694 (oxidoreductase activity, acting on the CH-NH group of
              donors, iron-sulfur protein as acceptor). GO:0047865 is not used because
              its definition names electron-transfer flavoprotein as the direct
              acceptor. Purified DdhC also demethylates sarcosine in vitro (RHEA:74155),
              but the disruption mutant still grows on sarcosine, so the in vivo role
              modeled here is the dimethylglycine step.
          - id: dgcb_ferredoxin_activity
            label: DgcB membrane ferredoxin electron transfer
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DgcB membrane-anchored 2[4Fe-4S] ferredoxin family
                description: >-
                  Membrane-anchored ferredoxins with a Csal_0991-like N-terminal region
                  and CCG/4Fe-4S domains, encoded beside DgcA and the pathway ETF. No
                  PANTHER id is asserted: PTHR43255:SF1 also contains archaeal
                  heterodisulfide reductase HdrC subunits and other bacterial
                  electron-transfer subunits (see the PTHR43255 family review).
                representative_members:
                  - preferred_term: DgcB (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88R23
                      label: Dimethylglycine dehydrogenase subunit
                  - preferred_term: Csal_0991 (Chromohalobacter salexigens)
                    term:
                      id: UniProtKB:Q1QYW0
                      label: Probable membrane-anchored ferredoxin
            function:
              preferred_term: electron transfer from DgcA to the pathway ETF
              term:
                id: GO:0009055
                label: electron transfer activity
            role_description: >-
              DgcB is reduced by DgcA and is proposed to reoxidize by passing electrons
              to the EtfAB heterodimer. Its disruption abolishes growth on
              dimethylglycine but not on sarcosine; direct electron transfer between
              the purified proteins has not been shown.
          - id: dimethylglycine_catabolism_etf_activity
            label: Pathway-associated electron transfer flavoprotein
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: dimethylglycine catabolism ETF heterodimer
                active_units:
                  - id: dimethylglycine_catabolism_etf_alpha
                    label: ETF alpha subunit
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: dimethylglycine catabolism ETF alpha-subunit family
                        description: >-
                          Pathway assignment requires an exact curated representative
                          in the conserved dgcA-dgcB-etfA-etfB neighborhood; generic
                          ETF alpha/FixB family membership is insufficient.
                        representative_members:
                          - preferred_term: PP_0312 (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88R22
                              label: Electron transfer flavoprotein subunit alpha
                          - preferred_term: EtfA (Chromohalobacter salexigens)
                            term:
                              id: UniProtKB:Q1QYV9
                              label: Electron transfer flavoprotein subunit alpha
                        term:
                          id: PANTHER:PTHR43153
                          label: ELECTRON TRANSFER FLAVOPROTEIN ALPHA
                  - id: dimethylglycine_catabolism_etf_beta
                    label: ETF beta subunit
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: dimethylglycine catabolism ETF beta-subunit family
                        description: >-
                          Pathway assignment requires an exact curated representative
                          paired with the pathway ETF alpha subunit beside dgcAB;
                          generic ETF beta/FixA family membership is insufficient.
                        representative_members:
                          - preferred_term: PP_0313 (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88R21
                              label: Electron transfer flavoprotein subunit beta
                          - preferred_term: EtfB (Chromohalobacter salexigens)
                            term:
                              id: UniProtKB:Q1QYV8
                              label: Electron transfer flavoprotein subunit beta
                        term:
                          id: PANTHER:PTHR21294
                          label: ELECTRON TRANSFER FLAVOPROTEIN BETA-SUBUNIT
            function:
              preferred_term: electron transfer from reduced DgcB toward an unresolved acceptor
              term:
                id: GO:0009055
                label: electron transfer activity
            role_description: >-
              The ETF heterodimer is proposed to accept reducing equivalents from
              reduced DgcB. Direct transfer and the downstream acceptor have not
              been established for KT2440.
