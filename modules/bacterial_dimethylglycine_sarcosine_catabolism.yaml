id: MODULE:bacterial_dimethylglycine_sarcosine_catabolism
title: Bacterial dimethylglycine and sarcosine catabolism
description: >-
  A reusable two-step bacterial module for sequential N-demethylation of
  dimethylglycine to sarcosine and then glycine. In the first step a DgcA-type
  flavoprotein oxidizes dimethylglycine and reduces a membrane-anchored DgcB-type
  2[4Fe-4S] ferredoxin. Reduced DgcB is proposed to pass the electrons to a
  pathway-associated heterodimeric ETF. The second step is performed either by a
  tetrahydrofolate-coupled heterotetrameric SoxABDG sarcosine oxidase or by a
  monomeric sarcosine oxidase that releases formaldehyde. Upstream glycine-betaine
  demethylation and downstream glycine cleavage or serine conversion are outside
  the module boundary.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:17951379
    title: Identification of two gene clusters and a transcriptional regulator required for Pseudomonas aeruginosa glycine betaine catabolism.
    statement: >-
      Mutant growth and isotope-tracing experiments support DgcAB-dependent
      dimethylglycine-to-sarcosine and SoxBDAG-dependent sarcosine-to-glycine
      conversion in Pseudomonas aeruginosa.
    supporting_text: "Similar experiments showed that strains with mutations in the dgcAB (PA5398-PA5399) genes, which exhibit homology to genes that encode other enzymes with demethylase activity, are required for the conversion of DMG to sarcosine."
  - source_id: PMID:35266867
    title: Creatine utilization as a sole nitrogen source in Pseudomonas putida KT2440 is transcriptionally regulated by CahR.
    statement: >-
      The KT2440 creatine-utilization study identifies SoxBDAG as pathway
      background for conversion of sarcosine to glycine and formaldehyde.
    supporting_text: "sarcosine is then converted to glycine and formaldehyde by the tetrameric sarcosine oxidase (SoxBDAG)"
  - source_id: PMID:32631860
    title: Role of N,N-Dimethylglycine and Its Catabolism to Sarcosine in Chromohalobacter salexigens DSM 3043.
    statement: >-
      Biochemical analysis directly establishes DdhC as an FAD-containing
      dimethylglycine and sarcosine dehydrogenase with bound NAD(P), while
      disruption of the adjacent ferredoxin and ETF genes supports their pathway
      participation. The ordered DdhC-to-ferredoxin-to-ETF relay is a mechanistic
      inference.
    supporting_text: "gene disruption and complementation assays indicated that the csal_0990, csal_0991, csal_0992, and csal_0993 genes are responsible for DMG degradation to sarcosine."
  - source_id: PMID:9185627
    title: Folate utilization by monomeric versus heterotetrameric sarcosine oxidases.
    statement: >-
      Biochemical comparison shows that heterotetrameric sarcosine oxidases
      efficiently couple the one-carbon unit to tetrahydrofolate, whereas
      monomeric enzymes predominantly release formaldehyde.
    supporting_text: "The results show that only the heterotetrameric sarcosine oxidases can use tetrahydrofolates as substrates"
  - source_id: PMID:15946648
    title: Crystal structure of heterotetrameric sarcosine oxidase from Corynebacterium sp. U-96.
    statement: >-
      The structure assigns NAD and folate binding to SoxA, FAD and FMN to
      SoxB, and a Cys3His-bound zinc atom to SoxD.
    supporting_text: "The alpha subunit is composed of two domains, contains NAD(+), and binds folinic acid. The beta subunit contains dimethylglycine, FAD, and FMN, and these flavins are approximately 10A apart."
  - source_id: UniProtKB:Q1QYW1
    title: Reviewed DgcA-like bacterial dimethylglycine dehydrogenase
    statement: >-
      Q1QYW1 is the directly characterized DgcA-like bacterial dehydrogenase, a
      monomer with noncovalent FAD and bound NAD(P) that reduces the [4Fe-4S]
      ferredoxin Q1QYW0 (EC 1.5.7.3). Onward transfer to ETF rests on the
      genetically required four-gene locus.
  - source_id: UniProtKB:Q1QYW0
    title: Reviewed DgcB-like membrane-anchored ferredoxin
    statement: >-
      Q1QYW0 is a reviewed membrane-anchored ferredoxin and a genetically
      required member of the Q1QYW1-associated degradation locus; direct
      electron transfer between the purified proteins has not been shown.
  - source_id: UniProtKB:Q50LF0
    title: Reviewed tetrameric sarcosine oxidase alpha subunit
    statement: >-
      Q50LF0 and its reviewed Corynebacterium partner entries ground the
      tetrahydrofolate-coupled SoxABDG complex.
  - source_id: UniProtKB:P40873
    title: Reviewed monomeric sarcosine oxidase
    statement: P40873 grounds the alternative single-chain sarcosine oxidase.
notes: >-
  The module is species-neutral. The dgcA-dgcB-etfA-etfB and soxBDAG loci are
  conserved among glycine-betaine-degrading Pseudomonadota, and monomeric
  sarcosine oxidases occur in Actinomycetota and Bacillota. Representative members
  were chosen for experimental evidence: Chromohalobacter salexigens DdhC,
  Csal_0991 and EtfAB (purified DdhC biochemistry and gene disruption of all four
  genes), Corynebacterium sp. U-96 SoxABDG (purification, cofactor analysis and
  crystal structure), and Arthrobacter sp. TE1826 monomeric sarcosine oxidase.
  Pseudomonas putida KT2440 is kept as a genome-scale exemplar with orthologous
  loci. Its own proteins are not reconstituted; DgcA and DgcB are 81% and 72%
  identical to DdhC and Csal_0991. Pseudomonas aeruginosa PAO1 dgcAB and soxBDAG
  mutant genetics (PMID:17951379) are cited as evidence, but its proteins are not
  added as members, because they would add no independent biochemical evidence.
  Family grounding: the ETF subunits are grounded on PANTHER PTHR43153 and
  PTHR21294, whose electron transfer activity is family-wide; the beta-oxidation
  process propagated to the dimethylglycine-locus ETFs is treated as
  over-annotation in their reviews. The Sox subunits are grounded on the
  subunit-specific NCBIfam TIGR01372-TIGR01375 models. PANTHER places SoxA in the
  aminomethyltransferase family (PTHR43757) and SoxB in a subfamily shared with
  FOXRED1 (PTHR13847:SF287); neither is role-specific, and both are reviewed. The
  monomeric enzyme is grounded at PTHR10961:SF7, because sarcosine oxidase activity
  is not family-wide in PTHR10961. DgcA and DgcB assert no family id: their PANTHER
  families (PTHR43656, PTHR43255) are reviewed but functionally heterogeneous.
  These choices differ deliberately from the family ids proposed for this module
  in open PR #5076. The folate-coupled SoxABDG reaction (EC 1.5.3.24) and the
  ferredoxin-linked dimethylglycine dehydrogenase reaction (EC 1.5.7.3) have no GO
  molecular-function terms; the member gene reviews carry proposed new terms.
  Subunit convention for the SoxABDG heterotetramer, applied identically to the
  Corynebacterium and KT2440 reviews: SoxB, which carries the sarcosine site and
  covalent FMN plus FAD, enables the activity, while SoxA, SoxD and SoxG
  contribute to it; their GOA enables qualifiers on sarcosine oxidase activity are
  recorded as WRONG_QUALIFIER source defects. All four use the proposed
  folate-coupled term as their core function, and GO:0008115 (the folate-free,
  formaldehyde-forming reaction) is kept as non-core. A
  bifunctional monomeric dimethylglycine oxidase (Arthrobacter globiformis DMGO)
  is a further first-step variant that is not yet modeled.
