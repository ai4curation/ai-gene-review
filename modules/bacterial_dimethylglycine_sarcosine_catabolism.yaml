id: MODULE:bacterial_dimethylglycine_sarcosine_catabolism
title: Bacterial dimethylglycine and sarcosine catabolism
description: A reusable bacterial two-stage module for oxidative demethylation of dimethylglycine to sarcosine
  and then glycine. First-stage alternatives include a DgcA/DdhC-associated pathway with genetically implicated
  electron-transfer partners and an oxygen-dependent DMGO that couples oxidation to tetrahydrofolate capture.
  The second stage may use a folate-coupled SoxABDG heterotetramer, a monomeric sarcosine oxidase, or
  a historically characterized dehydrogenase whose gene identity remains unresolved. Upstream betaine
  demethylation and downstream glycine metabolism are separate mechanisms.
status: DRAFT
scope: ABSTRACT
evidence:
- &id002
  source_id: PMID:17951379
  title: Identification of two gene clusters and a transcriptional regulator required for Pseudomonas
    aeruginosa glycine betaine catabolism.
  statement: Native P. aeruginosa mutants place DgcAB before sarcosine and SoxBDAG after it. The screen/main
    mutants use PA14 with PAO1 locus numbering; this is ortholog evidence for KT2440, not a KT2440 reconstitution.
  supporting_text: are required for the conversion of DMG to sarcosine.
- &id001
  source_id: PMID:32631860
  title: Role of N,N-Dimethylglycine and Its Catabolism to Sarcosine in Chromohalobacter salexigens DSM
    3043.
  statement: Purified DdhC oxidizes DMG and sarcosine using artificial dye acceptors. Native gene disruptions
    implicate DdhC, Csal_0991 and EtfAB in DMG utilization; the ordered electron relay is proposed.
  supporting_text: with PMS as the electron intermediator and DCPIP or NBT as the terminal electron acceptor.
- &id004
  source_id: PMID:9185627
  title: Folate utilization by monomeric versus heterotetrameric sarcosine oxidases.
  statement: Comparative assays distinguish folate-utilizing heterotetrameric sarcosine oxidases from
    monomeric enzymes; folate changes product partitioning and does not justify a universal claim of zero
    formaldehyde release.
  supporting_text: only the heterotetrameric sarcosine oxidases can use tetrahydrofolates as substrates
- &id005
  source_id: PMID:15946648
  title: Crystal structure of heterotetrameric sarcosine oxidase from Corynebacterium sp. U-96.
  statement: The U-96 complex places NAD and folate binding in alpha, FAD/FMN and substrate-site ligands
    in beta, and a zinc site in delta. A ligand-bound structure does not prove that every ligand is oxidized.
  supporting_text: The beta subunit contains dimethylglycine, FAD, and FMN
- source_id: PMID:12912903
  title: Channelling and formation of 'active' formaldehyde in dimethylglycine oxidase.
  statement: Structural and product measurements couple dimethylglycine oxidation to 5,10-methylenetetrahydrofolate
    formation.
  supporting_text: in the presence of THF, 5,10-methylene-THF is formed at the expense of formaldehyde
- source_id: PMID:38501746
  title: 'Choline degradation in Paracoccus denitrificans: identification of sources of formaldehyde.'
  statement: Paracoccus physiology links both DMG and sarcosine catabolism to formaldehyde production.
    Whole-pathway phenotypes do not identify a purified enzyme or justify importing an unverified gene
    into a representative panel.
  supporting_text: the oxidative demethylations of glycine betaine, dimethylglycine, and sarcosine as
    sources of formaldehyde.
- &id009
  source_id: file:modules/bacterial_dimethylglycine_sarcosine_catabolism-source-analysis/historical-sarcosine-dehydrogenase.md
  title: Historical C-83 sarcosine-dehydrogenase identity and assay audit
  statement: A native C-83 sarcosine-oxidizing dehydrogenase provides a biochemical alternative, but its
    gene, evolutionary family and physiological electron acceptor remain unidentified.
  supporting_text: The biochemical alternative remains explicitly ungrounded at the gene/family level.
notes: 'Comparative scope spans Pseudomonadota and Actinomycetota, without asserting universal bacterial
  distribution. Twenty-two identified proteins have individual reviews: original seventeen plus ARTGO
  DMGO and four CHRI1 Sox subunits. DgcA/DgcB family intent is described without a falsely specific PANTHER
  id; Sox subunits retain specific NCBIfam models. DMGO has verified PTHR43757:SF11 membership despite
  that subfamily name not matching its substrate. The historical C-83 alternative has no identified gene/family
  and remains a visible coverage gap. The 2017 CHRI1 deletion figures do not establish four individual
  Sox knockouts. PMID17951379 uses PA14 main mutants and PAO1 locus numbering. DgcA-to-DgcB-to-ETF ordering
  remains a mechanistic proposal. THF-dependent Sox chemistry is collective, not an autonomous core activity
  of each subunit. Whole-organism formaldehyde generation does not determine an individual enzyme sequence
  or imply complete flux from a module-capacity result. Existing PAINT data ambiguity is preserved rather
  than repaired by guessing. Module integration and validation are in progress; DRAFT records that state.'
