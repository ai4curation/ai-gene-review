id: MODULE:scer_nua4_complex
title: NuA4 histone acetyltransferase complex in Saccharomyces cerevisiae
description: NuA4 is the essential histone H4/H2A acetyltransferase of budding yeast, a 13-subunit complex
  of about 1 MDa. It acetylates the N-terminal tails of nucleosomal histones H4 and H2A and of the variant
  H2A.Z (Htz1), acting as a transcriptional coactivator, in DNA double-strand break repair and in cell
  cycle progression. The complex has three parts. The catalytic HAT module, piccolo NuA4, contains the
  MYST acetyltransferase Esa1, the Enhancer of Polycomb scaffold Epl1, the ING protein Yng2 and Eaf6;
  Epl1 activates Esa1 and binds the nucleosome, and Yng2 orients the module so that the H4 and H2A tails
  reach the active site. Piccolo NuA4 is also found as a free complex that acetylates chromatin globally
  without targeting. A rigid hub of Tra1 and an Eaf1-scaffolded core (Swc4, Arp4, Act1 and the Epl1 C-terminus),
  with Yaf9, carries the activator-binding Tra1 subunit that recruits NuA4 to promoters, and the Epl1
  C-terminus docks the HAT module onto the Eaf1 HSA domain. The Eaf3-Eaf5-Eaf7 trimer (TINTIN), anchored
  through Eaf5, adds an H3K36me3 reader and also exists apart from NuA4. Reader domains in the complex
  (the Yng2 PHD finger for H3K4me3, the Eaf3 chromodomain for H3K36me3, the Yaf9 YEATS domain for H3K27ac,
  Arp4 for phosphorylated H2A) help select nucleosomes near the recruitment site.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:15353583
  title: Regulation of chromosome stability by the histone H2A variant Htz1, the Swr1 chromatin remodeling
    complex, and the histone acetyltransferase NuA4.
  statement: NuA4 is the essential yeast HAT complex and acetylates the H4 and H2A tails.
  supporting_text: NuA4, the only essential histone acetyltransferase complex in Saccharomyces cerevisiae,
    acetylates the N-terminal tails of histones H4 and H2A.
- source_id: PMID:12782659
  title: Yeast enhancer of polycomb defines global Esa1-dependent acetylation of chromatin.
  statement: 'Defines the two forms: the free piccolo NuA4 module does non-targeted, global H4/H2A acetylation,
    while NuA4 is recruited to specific loci.'
  supporting_text: We propose that picNuA4 represents a nontargeted histone H4/H2A acetyltransferase activity
    responsible for global acetylation, whereas the NuA4 complex is recruited to specific genomic loci
    to perturb locally the dynamic acetylation/deacetylation equilibrium.
- source_id: PMID:36263929
  title: Structure and flexibility of the yeast NuA4 histone acetyltransferase complex.
  statement: The structural hub contains Tra1 and a core of Swc4, Arp4, Act1, Eaf1 and the Epl1 C-terminus.
  supporting_text: The hub contains the large Tra1 subunit and a core that includes Swc4, Arp4, Act1,
    Eaf1, and the C-terminal region of Epl1.
- source_id: PMID:36198799
  title: Structure of the NuA4 acetyltransferase complex bound to the nucleosome.
  statement: NuA4 has a HAT module and a transcription activator-binding (TRA) module.
  supporting_text: 'NuA4 comprises two major modules: the catalytic histone acetyltransferase (HAT) module
    and the transcription activator-binding (TRA) module.'
- source_id: PMID:36066422
  title: 'A balancing act: interactions within NuA4/TIP60 regulate picNuA4 function in Saccharomyces cerevisiae
    and humans.'
  statement: The Epl1 C-terminus binds the Eaf1 HSA domain, anchoring piccolo NuA4 to NuA4.
  supporting_text: picNuA4 anchors to its bigger brother via physical interactions between the C-terminus
    of Epl1 and the HSA domain of Eaf1, the NuA4 central scaffolding subunit
notes: 'Boundary. The module contains the 13 NuA4 subunits in three parts: the piccolo NuA4 HAT module
  (Esa1, Epl1, Yng2, Eaf6), the Tra1-Eaf1 hub and core (Tra1, Eaf1, Swc4, Arp4, Act1, Yaf9) and the TINTIN
  trimer (Eaf3, Eaf5, Eaf7). Histones H4, H2A and H2A.Z are substrates, not parts. Act1, Arp4, Swc4 and
  Yaf9 are shared with the SWR1 H2A.Z exchange complex, Tra1 with SAGA, and Eaf6 with the NuA3 H3 acetyltransferase;
  SWR1, SAGA and NuA3 are separate modules. Eaf3 is also a subunit of Rpd3S. The part boundaries follow
  the structural studies (PMID:36263929, PMID:36198799), which place Yaf9 outside the rigid hub; it is
  put with the hub part here as a recruitment and reader subunit.


  Two forms of the HAT module. Piccolo NuA4 is found inside NuA4 and as a free complex; Boudreault et
  al. proposed that the free form performs untargeted global acetylation and the holo-complex targeted
  acetylation. Disrupting the Epl1-Eaf1 contact releases piccolo NuA4 (PMID:36066422). The relative contributions
  of the two forms in vivo are recorded as a knowledge gap.


  Ontology. The module concept is GO:0035267 NuA4 histone acetyltransferase complex, which GO classifies
  under GO:0043189 H4/H2A histone acetyltransferase complex and GO:0000123 histone acetyltransferase complex,
  and so as part_of GO:0000785 chromatin. NuA4 acts on nucleosomes: native piccolo NuA4 strongly prefers
  chromatin to free histones, Esa1 alone cannot acetylate nucleosomes, and the HAT module binds the nucleosome
  disk face. The inherited chromatin location is therefore reasonable for this complex, which is not a
  counterexample to the GO:0000123 edge questioned in modules/scer_hat_b_complex.yaml. The only activity
  on non-chromatin histones is in vitro: recombinant Esa1 alone, or with Epl1, acetylates free histones
  (PMID:21984211), a property of partial complexes. Esa1 also acetylates non-histone proteins, such as
  Atg3 at pre-autophagosomal structures (PMID:22539722); that is a separate, non-histone activity recorded
  in the ESA1 review.


  Piccolo term. GO:0032777 piccolo histone acetyltransferase complex carries no capable_of axiom, so unlike
  NuA4 it is not classified under GO:0043189, GO:0000123 or chromatin, although it is the part of NuA4
  that does the acetylation; the missing edge is recorded under proposed_ontology_changes. Its text definition
  calls the complex heterotrimeric (Esa1, Yng2, Epl1), as first purified, whereas reconstitution and structural
  studies define the module with Eaf6 as a fourth subunit. The module follows the structural studies and
  includes Eaf6 in part 1; whether native free piccolo NuA4 contains Eaf6 is a knowledge gap, so no definition
  change is requested yet. GOA does not annotate Eaf6 to GO:0032777, and the EAF6 review does not add
  it.


  Gene reviews. ESA1, EPL1, YNG2, EAF6 and EAF3 have reviews in this repository. Their core functions
  support the annotons: histone H4 acetyltransferase activity (Esa1); acetyltransferase activator activity,
  nucleosome binding and protein-macromolecule adaptor activity, and a contribution to H4 acetylation
  (Epl1); histone H3K4me3 reader activity and a contribution to H4 acetylation (Yng2); a contribution
  to H4 acetylation (Eaf6); histone H3K36me3 reader activity (Eaf3). Tra1, Eaf1, Swc4, Arp4, Act1, Yaf9,
  Eaf5 and Eaf7 have no reviews; their annotons rest on the cited papers only, and the module validator
  reports them as lacking review support.'
