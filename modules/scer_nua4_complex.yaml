proposed_ontology_changes:
- change_type: EDGE_CREATION
  ontology: GO
  about_node:
    id: GO:0032777
    label: piccolo histone acetyltransferase complex
  subject:
    id: GO:0010485
    label: histone H4 acetyltransferase activity
  predicate: RO:0002215
  change_dsl: create edge GO:0032777 RO:0002215 GO:0010485
  justification: GO:0032777 is defined in text as an H4/H2A histone acetyltransferase complex but carries
    only is_a protein-containing complex, so a reasoner does not place it under GO:0043189 H4/H2A histone
    acetyltransferase complex or GO:0000123 histone acetyltransferase complex, unlike GO:0035267 NuA4,
    which has capable_of GO:0010485 and GO:0043998. Piccolo NuA4 is the catalytic module of NuA4 and acetylates
    nucleosomal H4 and H2A as a free complex. Adding capable_of GO:0010485 (with the parallel capable_of
    GO:0043998 edge) would classify it with the other H4/H2A acetyltransferase complexes. Through GO:0000123
    it would also inherit part_of chromatin, which is reasonable for a complex that strongly prefers chromatin
    to free histones. The text definition, which calls the complex heterotrimeric, may also need revision
    to include Eaf6 once its presence in the native complex is settled.
  origin: SELF_PROPOSED
  confidence: PROBABLE
  request_status: NOT_FILED
  ontology_state_verified: '2026-11-18'
  affected_annotations:
  - UniProtKB:Q08649 ESA1 part_of GO:0032777 (IDA PMID:12782659; IPI PMID:21984211)
  - UniProtKB:P43572 EPL1 part_of GO:0032777 (IBA; IDA PMID:12782659; IPI PMID:21984211)
  - UniProtKB:P38806 YNG2 part_of GO:0032777 (IDA PMID:12782659; IPI PMID:21984211)
  supported_by:
  - reference_id: PMID:12782659
    supporting_text: The picNuA4 complex contains Esa1, Epl1, and Yng2 as subunits and strongly prefers
      chromatin over free histones as substrate.
  - reference_id: PMID:36263929
    supporting_text: The HAT module (also known as Piccolo) contains Esa1, Yng2, Eaf6, and Epl1 and is
      responsible for the acetylation of histone H2A and H4 in target nucleosomes
knowledge_gaps:
- gap_statement: How much of global H4/H2A acetylation in vivo is done by free piccolo NuA4 rather than
    by piccolo NuA4 within NuA4 is not known.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The free module was proposed to account for untargeted, global acetylation and the holo-complex
    for targeted acetylation. Free piccolo NuA4 levels go down without Eaf1 and up without the Epl1 C-terminus,
    so the balance is regulated, but the share of each form in bulk acetylation has not been measured.
  provenance:
  - reference_id: PMID:12782659
    supporting_text: We propose that picNuA4 represents a nontargeted histone H4/H2A acetyltransferase
      activity responsible for global acetylation
  - reference_id: PMID:36066422
    supporting_text: Strikingly, loss of EAF1 or its HSA domain led to a significant decrease in the amount
      of picNuA4, while loss of the Epl1 C-terminus increased picNuA4 levels
- gap_statement: How the complete NuA4 complex engages nucleosomes is unresolved.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: One structure shows NuA4 bound to a nucleosome mainly through the HAT module, while another
    study finds that the complete complex, unlike the isolated piccolo module, does not bind nucleosomes
    stably and proposes short-lived contacts. Which holds in vivo bears on how a Tra1-recruited complex
    selects the nucleosomes it acetylates.
  provenance:
  - reference_id: PMID:36198799
    supporting_text: The nucleosome is mainly bound by the HAT module and is positioned close to a polybasic
      surface of the TRA module
  - reference_id: PMID:36417436
    supporting_text: the Piccolo module binds to nucleosomes, whereas the complete NuA4 does not
- gap_statement: Whether native piccolo NuA4 contains Eaf6, and what Eaf6 contributes to the HAT module,
    are not known.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Native piccolo NuA4 was described as Esa1, Epl1 and Yng2, whereas the reconstituted and
    crystallized module contains Eaf6. No study has tested whether Eaf6 is needed for module assembly,
    nucleosome binding or activity.
  provenance:
  - reference_id: PMID:12782659
    supporting_text: The picNuA4 complex contains Esa1, Epl1, and Yng2 as subunits
  - reference_id: PMID:36263929
    supporting_text: Reconstitution experiments and the crystal structure of the HAT module show that
      it is composed of Yng2, Eaf6, and Esa1, as well as residues 121–400 of Epl1
