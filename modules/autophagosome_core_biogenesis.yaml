id: MODULE:autophagosome_core_biogenesis
title: Core autophagy machinery for autophagosome biogenesis
description: 'Autophagosomes form from a cup-shaped phagophore that grows around cytoplasmic cargo and
  closes into a double-membrane vesicle. Formation needs a conserved set of autophagy-related (Atg) proteins:
  the Atg1/ULK kinase with Atg13 starts assembly; the class III phosphatidylinositol 3-kinase complex
  (Vps34, Vps15, Atg6/Beclin and Atg14) marks the membrane with phosphatidylinositol 3-phosphate; Atg9
  vesicles seed the membrane and the Atg2-Atg18/WIPI bridge feeds it lipid from the ER; and two ubiquitin-like
  conjugation systems link Atg12 to Atg5 and Atg8 to phosphatidylethanolamine. This module is the eukaryote-wide
  protein core, written so that it can be evaluated in any genome.'
status: DRAFT
scope: CONCRETE
notes: 'Eukaryote-wide scope: PAINT places nodes for Atg1/ULK, Vps34, Vps15, Atg6/Beclin, Atg9, Atg2,
  Atg7, Atg5, Atg12 and Atg8 at Eukaryota (taxon:2759). The Atg18/WIPI node carries no taxon and has seeds
  only from animals and budding yeast, so for that step the eukaryote-wide reach rests on the family entries
  table (yeast, Arabidopsis, Dictyostelium and human members). Each node is shown to be an ancestor of
  the human protein by its IBA rows or its IBD seeds. The Atg13, Atg3 and Atg4 families have no PAINT
  table locally, and their selectors rest on family membership. Read as a satisfiability rule, every non-optional
  part is expected in any eukaryote. Optional: Atg14, whose family is opisthokont-only in the local tables,
  and Atg16, whose family lacks the fungal protein. Molecular functions come from the human gene reviews''
  core functions (Vps15 contributes to the Vps34 kinase activity); Atg4 is untyped. Selector caveats are
  on each family: the Atg1/ULK and PROPPIN families over-match, and no Dictyostelium member is listed
  for Atg13 or Atg2. Not modelled: FIP200/Atg17 and ATG101, which have no local PANTHER entry for the
  human proteins and are not conserved as such across eukaryotes; Atg10, the E2 for Atg12 (no local entry
  for human ATG10); the Atg11 and receptor scaffolds of selective autophagy; and autophagosome closure
  and fusion with the lysosome or vacuole. The modules metazoan_autophagosome_biogenesis and phagophore_assembly_site
  describe the metazoan pathway and the yeast assembly site in more detail.'
