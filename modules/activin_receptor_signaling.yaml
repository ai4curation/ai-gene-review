- id: PMID:12660162
  title: Structures of an ActRIIB:activin A complex reveal a novel binding mode for TGF-beta ligand:receptor
    interactions.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text primary ligand/receptor structure; distinguishes the mature activin A dimer
      from an unassembled precursor and from inhibitory alpha/beta dimers.
  findings:
