      the signaling complex.
  - source_id: PMID:10746731
    title: Betaglycan binds inhibin and can mediate functional antagonism of activin signalling.
    statement: 'Inhibin antagonism is a distinct boundary mechanism: the inhibin-bound type II receptor
      fails to recruit the activin type I receptor.'
    supporting_text: Inhibins also bind type II activin receptors but do not recruit ALK4, providing a
      competitive model for the antagonism of activin by inhibin.
  - source_id: PMID:35736809
    title: The orphan ligand, activin C, signals through activin receptor-like kinase 7.
    statement: Activin C and AC are active ALK7 ligands; the older inference that activin C is only an
      antagonist cannot define the family boundary.
    supporting_text: ActC and ActAC activated SMAD2/3-dependent signaling via the type I receptor, activin
      receptor-like kinase 7 (ALK7).
  - source_id: PMID:38533769
    title: Activin E is a transforming growth factor β ligand that signals specifically through activin
      receptor-like kinase 7.
    statement: Activin E signals through ALK7 and the canonical type II receptors; its branch has distinct
      antagonist sensitivity.
    supporting_text: ActE signaled specifically through ALK7, utilized the canonical activin type II receptors,
      ActRIIA and ActRIIB, and was resistant to the extracellular antagonists follistatin and WFIKKN.
  - source_id: PMID:39595638
    title: Activins and Inhibins in Cardiovascular Pathophysiology.
    statement: The 2024 cardiovascular review provides tissue context but repeats an outdated C/E inactivity
      hypothesis. The module uses the direct ALK7 studies instead of that hypothesis.
  notes: The canonical agonist relay excludes inhibin antagonism as an initiating positive step, BMP-Mad
    output, Nodal-specific co-receptor requirements, and non-SMAD branches. These are real neighboring
    mechanisms, not false functions. ALK7-dependent activin C/E signaling and fly Babo isoform preferences
    show why ALK4/Babo examples cannot be generalized to all ligands. Human trimer stoichiometry is not
    imposed on fly complexes. Constitutive or overexpressed receptor assays are distinguished from native
    ligand assays.
