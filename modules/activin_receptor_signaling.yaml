id: MODULE:activin_receptor_signaling
title: Canonical activin receptor-SMAD signaling pathway module
description: Mature activin agonists organize type II/type I serine/threonine kinase receptor complexes.
  Type II receptors activate type I receptors, which phosphorylate activin-branch R-SMADs; R-SMAD/co-SMAD
  complexes then regulate nuclear transcription. Human activin A and native Drosophila Actbeta provide
  complementary examples, with ligand-specific receptor usage and shared BMP components explicitly distinguished.
status: COMPLETE
evidence:
- source_id: PMID:30540228
  title: Activin A in Mammalian Physiology.
  statement: Activin beta-subunit dimers and inhibin alpha/beta dimers have distinct signaling identities;
    the agonist role here denotes mature activin, not every INHBA-containing complex.
  supporting_text: Activins are dimeric glycoproteins belonging to the transforming growth factor beta
    superfamily and resulting from the assembly of two beta subunits, which may also be combined with
    alpha subunits to form inhibins.
- source_id: PMID:27328872
  title: 'Activins and Inhibins: Roles in Development, Physiology, and Disease.'
  statement: The comparative review places receptor phosphorylation, R-SMAD/co-SMAD assembly and nuclear
    transcription in the canonical relay.
  supporting_text: Phosphorylation of R-Smads triggers the association with Smad4, which is common to
    all R-Smad complexes, followed by a shift in homeostasis toward the nucleus to activate or inhibit
    the transcription of downstream target genes
- source_id: PMID:38124338
  title: 'Bone morphogenetic protein signaling: the pathway and its regulation.'
  statement: The activin and BMP branches share type II receptors, while their usual type I/R-Smad pairings
    distinguish pathway output.
  supporting_text: in Drosophila, Tkv and Sax primarily mediate BMP signals to phosphorylate Mad, while
    Babo transduces Activin signals, phosphorylating Smox (dSmad2). However, both Drosophila type II receptors,
    Punt and Wit, clearly mediate signals from both branches.
- source_id: PMID:22651914
  title: Structural studies of the TGF-βs and their receptors - insights into evolution of the TGF-β superfamily.
  statement: Structural comparisons support related but distinct receptor-assembly mechanisms across the
    TGF-beta, BMP and activin groups; family membership alone does not determine ligand specificity.
  supporting_text: These structures underscore the shared ancestry of the TGF-βs with the BMPs and activins,
    but also provide insight as to how the TGF-βs diverged from the BMPs and activins to bind and assemble
    their receptors in a distinct manner.
- source_id: PMID:34520530
  title: Myostatin/Activin Receptor Ligands in Muscle and the Development Status of Attenuating Drugs.
  statement: The ligand/receptor system is broader than activin A alone; activins, myostatin and GDF11
    share receptor components, so the examples here are not a universal one-to-one ligand/receptor map.
  supporting_text: These include the activins (Act A, B, and AB) and GDF11, both of which signal through
    the ActRII receptors, ActRIIa and ActRIIb
- source_id: PMID:18820452
  title: Distinct signaling of Drosophila Activin/TGF-beta family members.
  statement: Native Drosophila Actbeta/dACT and Daw drive Babo/Punt-dependent Smox activation in the tested
    system. This establishes native ligand wiring rather than relying only on vertebrate activin in heterologous
    assays.
  supporting_text: Only Drosophila Activin (dACT) and the Activin-like ligand Dawdle (DAW) signal through
    BABO in combination with the type II receptor PUNT and activate dSMAD2.
notes: Metazoa is a non-universal taxonomic envelope for the conserved signaling toolkit, not a claim
  that every animal has this complete native ligand-receptor relay. Directly matched ligand/receptor/SMAD
  examples in this audit are human and Drosophila. Family selectors join verified narrow PANTHER subfamilies
  with an explicit required function; they do not propagate an activin role over the broad TGF-beta, receptor-kinase
  or SMAD parent families. The old PTN000218063 anchor is omitted because its extracellular-region and
  broad TGF-beta-process support did not establish the specific activin agonist role at an ancestral node.
  The original Falcon report is retained as a research lead, not used as primary evidence. All 11 representative
  genes are being reviewed in the same change.
