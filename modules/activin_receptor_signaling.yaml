    - source_id: PMID:19192293
      title: Emergence, development and diversification of the TGF-beta signalling pathway within the
        animal kingdom.
      statement: Comparative phylogenomics reconstructs ancient SMAD pathway machinery in nonbilaterian
        and bilaterian lineages; it does not establish native activin ligand coupling in each animal.
      supporting_text: ancestral eumetazoan repertoire of four Smads, forming the basis of the pathway
        in the Placozoa, the Cnidaria, the Arthropoda, and in the Lophotrochozoa.
    - source_id: PMID:23020873
      title: Conservation and evolutionary divergence in the activity of receptor-regulated smads.
      statement: Nematostella SMAD2/3 signaling competence was assayed by heterologous expression in Xenopus.
