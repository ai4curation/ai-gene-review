      during development.
  - source_id: PMID:19766717
    title: The Drosophila Activin-like ligand Dawdle signals preferentially through one isoform of the
      Type-I receptor Baboon.
    statement: Punt and Wit are not interchangeable for every activin-family ligand.
    supporting_text: In cell culture, Dawdle signaling is active in the presence of the Type-II receptor
