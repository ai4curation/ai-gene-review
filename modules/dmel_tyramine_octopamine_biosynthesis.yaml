id: MODULE:dmel_tyramine_octopamine_biosynthesis
title: Tyramine and octopamine biosynthesis in Drosophila melanogaster
description: >-
  Octopamine, the insect counterpart of noradrenaline, and its precursor tyramine are monoamine
  neurotransmitters and neurohormones. Tyrosine is decarboxylated to tyramine by tyrosine
  decarboxylase: Tdc2 in neurons and Tdc1 in non-neural tissues. Tyramine beta-hydroxylase
  (Tbh), a copper monooxygenase of the dopamine beta-hydroxylase family that acts inside secretory
  vesicles, then hydroxylates tyramine to octopamine. Loss of Tbh removes octopamine and causes
  female sterility from a failure of ovulation, and loss of Tdc2 removes both amines from
  the nervous system.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002226
  title: 'FlyBase gene group TYROCTBI: Tyramine and octopamine biosynthesis'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as tyramine and octopamine biosynthesis
    (TYROCTBI); this module models that group.
- source_id: GO:0006589
  title: octopamine biosynthetic process
  statement: >-
    GO term grounding the module as octopamine biosynthetic process.
- source_id: GO:1901695
  title: tyramine biosynthetic process
  statement: >-
    GO term grounding the module as tyramine biosynthetic process.
notes: >-
  Tdc1 and Tdc2 are alternative enzymes for the same step with different tissue distribution,
  and each is a separate annoton. olf413 is a second dopamine-beta-hydroxylase-like monooxygenase
  that FlyBase places in this group; it has been proposed to contribute to octopamine synthesis,
  but its activity has not been measured, so it has no molecular function here. Tyramine is
  a signalling molecule in its own right, so the decarboxylation step is also the end of tyramine
  synthesis. Vesicular uptake, release and receptors are outside the module. FlyBase groups
  realized by this module: TYROCTBI (FBgg0002226). Participants were generated from the FlyBase
  gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_tyramine_octopamine_biosynthesis.yaml; none of the member genes has
  a gene review yet unless noted.
