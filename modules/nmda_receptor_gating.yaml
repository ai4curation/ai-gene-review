id: MODULE:nmda_receptor_gating
title: Human NMDA receptor family channel gating by GluN1 and its partner subunits
description: 'How the heterotetrameric receptors built on the GluN1 subunit are opened. Every receptor of this family
  contains two GluN1 subunits, which bind the co-agonist glycine or D-serine, and two partner subunits. With GluN2
  partners (GluN2A to GluN2D) the partner binds glutamate, and the channel opens only when both ligands are bound;
  the open pore conducts sodium, potassium and calcium and is blocked by magnesium at resting potential, so current
  also requires depolarisation. With GluN3 partners (GluN3A or GluN3B) both subunit types bind glycine and glutamate
  is not needed: glycine at GluN3 opens the channel, whereas glycine at GluN1 limits the current. These channels
  have low calcium permeability and no magnesium block. The module covers ligand sensing by each subunit and conduction
  by the assembled tetramer. Receptor assembly and trafficking, synaptic anchoring by PSD-95 family scaffolds, allosteric
  modulation, and signalling downstream of calcium entry are outside it.'
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:36309015
  title: Structural insights into assembly and function of GluN1-2C, GluN1-2A-2C, and GluN1-2D NMDARs.
  statement: Receptors are heterotetramers of obligatory GluN1 with GluN2 and/or GluN3.
  supporting_text: NMDARs are glycine- and glutamate-gated ion channels that exist as heterotetramers composed of
    obligatory GluN1 and GluN2(A-D) and/or GluN3(A-B)
- source_id: PMID:12805203
  title: 'Mechanisms of activation, inhibition and specificity: crystal structures of the NMDA receptor NR1 ligand-binding
    core.'
  statement: GluN1 forms the glycine site and GluN2 the glutamate site.
  supporting_text: NMDA receptors require both glycine and glutamate for activation with NR1 and NR2 forming glycine
    and glutamate sites, respectively
- source_id: PMID:38598639
  title: Structure and function of GluN1-3A NMDA receptor excitatory glycine receptor channel.
  statement: GluN1/GluN3 receptors are gated by glycine alone.
  supporting_text: Uniquely, NMDARs composed of GluN1 and GluN3 are activated exclusively by glycine
- source_id: PMID:26777280
  title: The N-terminal domain of the GluN3A subunit determines the efficacy of glycine-activated NMDA receptors.
  statement: In GluN1/GluN3 receptors glycine at GluN3 opens the channel and glycine at GluN1 inhibits it.
  supporting_text: Binding of glycine to the high-affinity GluN3 subunits triggers channel opening, whereas glycine
    binding to the low-affinity GluN1 subunits causes an auto-inhibition of the maximal glycine-inducible receptor
    current
- source_id: file:human/GRIN1/GRIN1-ai-review.yaml
  title: Human GRIN1 gene review
  statement: Glycine binding and contributing NMDA glutamate receptor activity and glycine-gated cation channel
    activity are the three core functions recorded for GluN1; the GOA glutamate binding row on GluN1 was removed.
- source_id: file:modules/nmda_receptor_gating-deep-research-openscientist.md
  title: OpenScientist module deep research for NMDA receptor family channel gating
  statement: Generated from this module as its outline, so its agreement on the boundary is not independent. It
    supplied the GluN1 auto-inhibition point for GluN1/GluN3 receptors, which was then verified against PMID:26777280;
    its other citations were not checked.
notes: 'Tri-heteromeric receptors (two different GluN2 subunits, or one GluN2 and one GluN3) exist and are not modelled
  as separate variants. The choice of partner in part 2 fixes the conduction variant in part 3: a GluN2 partner
  gives NMDA glutamate receptor activity, a GluN3 partner gives glycine-gated cation channel activity; the schema
  does not link the two variant sets, so this is stated here. Magnesium block and its relief by depolarisation are
  described in prose only. Potassium efflux is known for these channels but is not listed as a transported ion,
  to match the evidence checked. Only GRIN1 has a gene review in this repository; the six partner subunits do not,
  so status is DRAFT. PANTHER family and PAINT node descriptors are omitted because subfamily membership of each
  subunit was not verified. The seven GO-CAM models pinned here were reviewed in gocams/<model>/<model>-review.yaml.
  They type each subunit with the whole-receptor activity and add a third, complex-enabled activity; this module
  instead gives each subunit its ligand-binding step and puts conduction on the complex. The sign of GluN1 glycine
  binding differs by receptor class and is modelled as two connections; the GluN1 glycine-site GO-CAM activities
  in the two GluN3 models draw it as positive, which the GO-CAM reviews query. Location: the GluN3A glycine-site
  annoton is placed at the postsynaptic membrane, following the GO-CAM model; no location is asserted for GluN3B
  or for the GluN1/GluN3 channel, because rat GluN3B shows a presynaptic labelling pattern (PMID:23159309) and the
  GO-CAM model for it mixes pre- and postsynaptic membranes. Module deep research (OpenScientist) was run after
  the module was drafted, with the module as its outline.'
