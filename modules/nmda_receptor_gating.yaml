  connections:
  - source: glun1_coagonist_sensing
    target: glun1_glun2_conduction
    connection_type: POSITIVELY_REGULATES
    description: In GluN1/GluN2 receptors co-agonist binding to GluN1 is required for the channel to open. Corresponds
      to the GRIN1 "directly positively regulates" edge in the five GluN2 GO-CAM models.
    evidence:
    - source_id: PMID:12805203
      title: 'Mechanisms of activation, inhibition and specificity: crystal structures of the NMDA receptor NR1
        ligand-binding core.'
      statement: GluN1 forms the glycine site and GluN2 the glutamate site.
      supporting_text: NMDA receptors require both glycine and glutamate for activation with NR1 and NR2 forming
        glycine and glutamate sites, respectively
  - source: glun1_coagonist_sensing
    target: glun1_glun3_conduction
    connection_type: NEGATIVELY_REGULATES
    description: In GluN1/GluN3 receptors glycine binding to GluN1 is not needed for opening and reduces the glycine-evoked
      current. The two GluN3 GO-CAM models draw this edge as positive.
    evidence:
    - source_id: PMID:26777280
      title: The N-terminal domain of the GluN3A subunit determines the efficacy of glycine-activated NMDA receptors.
      statement: In GluN1/GluN3 receptors glycine at GluN3 opens the channel and glycine at GluN1 inhibits it.
      supporting_text: Binding of glycine to the high-affinity GluN3 subunits triggers channel opening, whereas
        glycine binding to the low-affinity GluN1 subunits causes an auto-inhibition of the maximal glycine-inducible
        receptor current
    - source_id: PMID:17047094
      title: Subunit-specific roles of glycine-binding domains in activation of NR1/NR3 N-methyl-D-aspartate receptors.
      statement: Glycine at the GluN3 subunit alone is sufficient to activate GluN1/GluN3 receptors.
      supporting_text: agonist binding to NR3 alone is sufficient to activate a significant component of NR1/NR3
        receptor currents
