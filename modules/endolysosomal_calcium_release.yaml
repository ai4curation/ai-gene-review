id: MODULE:endolysosomal_calcium_release
title: Endolysosomal calcium release — NAADP- and PI(3,5)P2-activated two-pore channels (TPCN1, TPCN2, with the NAADP-binding proteins JPT2 and LSM12) and PI(3,5)P2-activated mucolipin TRPML channels (MCOLN1, MCOLN2, MCOLN3) releasing calcium from endosomes and lysosomes into the cytosol (human)
description: >-
  Endosomes and lysosomes are acidic calcium stores whose luminal free calcium is in the
  high micromolar range. Two families of cation channels in their limiting membranes
  release this calcium into the cytosol. The two-pore channels TPC1 (TPCN1), mainly in
  endosomes, and TPC2 (TPCN2), mainly in late endosomes and lysosomes, are dimeric
  channels with two Shaker-like repeats per subunit. They are the channels through which
  the second messenger NAADP releases calcium from acidic organelles; NAADP does not bind
  the channel itself but small NAADP-binding proteins, JPT2 (HN1L) and LSM12, that
  associate with the TPCs and confer NAADP sensitivity. TPCs are also opened by the
  endolysosome-specific lipid PI(3,5)P2, and under PI(3,5)P2 they conduct mainly Na+;
  their ion selectivity is debated and appears to depend on the activating ligand, NAADP
  favouring a calcium-permeable state. NAADP-evoked endolysosomal calcium release is often
  small and local and can be amplified by calcium-induced calcium release through ER IP3
  receptors. The mucolipins TRPML1 (MCOLN1), TRPML2 (MCOLN2) and TRPML3 (MCOLN3) are
  tetrameric TRP channels of the endolysosomal system that are activated by PI(3,5)P2 and
  release calcium (TRPML1 also Fe2+ and Zn2+) from late endosomes and lysosomes; TRPML1 is
  ubiquitous, TRPML2 is enriched in immune cells and recycling endosomes, and TRPML3 in
  early endosomes and in melanocytes and hair cells. Loss of TRPML1 causes mucolipidosis
  type IV. Local calcium released by these channels drives membrane fusion and fission in
  the late endocytic pathway, lysosomal exocytosis, and activation of calcineurin, which
  dephosphorylates TFEB to induce lysosome biogenesis and autophagy.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001139
    title: calcium transport pathway
    statement: >-
      RGD Pathway Ontology record for the calcium transport pathway (55 human genes curated
      by RGD). Its text describes NAADP-gated two-pore channels releasing calcium from acidic
      endosomal and lysosomal stores and the mucolipin TRPML1 as a lysosomal and late
      endosomal calcium release channel; the diagram draws Tpcn1, Tpcn2 and Mcoln1 each
      positively affecting Ca2+ released, with NAADP associated with Tpcn1 and Tpcn2. This
      module models that endolysosomal release system only; the record's other transport
      systems are separate modules or unmodelled (see notes). Human genes in scope from
      RGD's list: TPCN1 TPCN2 MCOLN1; added with evidence: MCOLN2 MCOLN3 JPT2 LSM12.
      Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001139.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: >-
      The RGD record text names the two human two-pore channels as NAADP-gated calcium
      release channels of acidic endolysosomal stores.
    supporting_text: >-
      the two-pore segment channels represented by the two members in humans (TPCN1 and 2)
      and rodents in the family of three in most other mammals, mediate Ca2+ release from
      acidic stores in endosomic/lysosomic compartments
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: >-
      The RGD record text leaves open whether NAADP binds the TPCs directly or through an
      intermediary protein; the NAADP-binding proteins JPT2 and LSM12 identified in 2021
      answer this (part 1).
    supporting_text: >-
      Whether TPCNs and perhaps ryanodine channels directly bind NAADP or binding is mediated
      by some other intermediary protein, is not yet a fully settled issue.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: The RGD record text places TRPML1 in lysosomes and late endosomes.
    supporting_text: >-
      A member of the mucolipin family, Mcoln1 known as TRPML1, is a Ca2+ and Fe2+ release
      channel located in lysosomes and late endosomes.
  - source_id: GO:0006816
    title: calcium ion transport
    statement: >-
      The GO process mapped to PW:0001139 (skos:closeMatch) in the project's PW-GO mappings
      (projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is too broad for this
      module, whose concept is its descendant GO:1901660 calcium ion export (is_a
      GO:0006816), checked in go-basic 2026-07-26. No GO process names calcium release from
      lysosomes or endosomes; a term is requested in proposed_new_terms.
  - source_id: GO:1901660
    title: calcium ion export
    statement: >-
      Module concept: the directed movement of calcium ion out of a cell or organelle.
      Carried in GOA by MCOLN1 (IDA, PMID:25720963) and used as the process of the MCOLN1
      activity in the production GO-CAM gomodel:63c0ac2b00000641.
  - source_id: PMID:19387438
    title: NAADP mobilizes calcium from acidic organelles through two-pore channels.
    statement: TPCs identified as NAADP receptors releasing calcium from acidic organelles.
    supporting_text: Thus, TPCs form NAADP receptors that release Ca(2+) from acidic organelles, which can trigger further Ca(2+) signals via sarcoplasmic/endoplasmic reticulum.
  - source_id: PMID:32167471
    title: Agonist-mediated switching of ion selectivity in TPC2 differentially promotes lysosomal function.
    statement: >-
      TPC2 ion selectivity is debated and depends on the activating ligand; NAADP-like
      agonism gives calcium-permeable non-selective currents, PI(3,5)P2-like agonism
      Na+-selective currents.
    supporting_text: ion selectivity of the lysosomal ion channel TPC2, which is hotly debated
  - source_id: PMID:20802798
    title: PI(3,5)P(2) controls membrane trafficking by direct activation of mucolipin Ca(2+) release channels in the endolysosome.
    statement: PI(3,5)P2 directly activates the endolysosomal TRPML channels.
    supporting_text: PI(3,5)P(2), an endolysosome-specific PIP, binds and activates endolysosome-localized mucolipin transient receptor potential (TRPML) channels with specificity and potency
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001139 (calcium transport pathway) through
  the RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml,
  mapped GO:0006816 calcium ion transport). RGD curates 55 human genes to PW:0001139, mixing
  unrelated channel, pump and exchanger families, so the project models the record as one
  human module per transport system. This module is the endolysosomal release system.
  Sibling modules from the same record: store_operated_calcium_entry,
  plasma_membrane_calcium_extrusion, er_calcium_store_cycling,
  mitochondrial_calcium_uniporter, and golgi_calcium_manganese_pump (drafted in parallel
  with this one). PW:0001139 is the only PW evidence source_id; its sub-pathway PW:0001140
  (calcium/calcium-mediated signaling) is mentioned here in prose only.


  (1) STRUCTURE. Two parts. Part 1 (optional) is NAADP reception by the NAADP-binding
  proteins JPT2 and LSM12, which regulates the TPC route only. Part 2 is calcium release,
  a ONE_OR_MORE ROUTE variant set of two unrelated channel families (TPC and TRPML), each a
  ONE_OR_MORE REALIZER set of paralogs, because cells express several of them and they act
  in parallel on overlapping compartments. Each TPC paralog carries two annotons, one per
  activating ligand (NAADP; PI(3,5)P2), because the experimental record types the two
  gating modes with different activities and different permeant ions (note 3).


  (2) MEMBERS ADDED BEYOND RGD'S LIST. RGD lists TPCN1, TPCN2 and MCOLN1. MCOLN2 and MCOLN3
  are added because direct patch-clamp of endolysosomes shows PI(3,5)P2 activating TRPML2
  and TRPML3 currents (PMID:20802798), TRPML3 is characterized as a calcium channel of
  endosomes (PMID:19522758, PMID:19497048), and both have experimental endosomal and
  lysosomal membrane locations in GOA. Their channel activity is authored (note 4). JPT2
  (HN1L) and LSM12 are added as NAADP-binding proteins that confer NAADP sensitivity on
  the TPCs (PMID:33758061, PMID:34362892). They were identified independently and their
  relationship (alternative or cooperating subunits of one NAADP receptor complex) is
  unresolved; both are therefore in a ONE_OR_MORE set. JPT2 also couples NAADP to RYR1 on
  the ER in T cells (PMID:33758062); that ER route is outside this module (RYR1 is in
  er_calcium_store_cycling) and is noted only.


  (3) TPC ION SELECTIVITY: A RECORDED CONTROVERSY, NOT RESOLVED HERE. The NAADP-receptor
  papers (PMID:19387438, PMID:19620632) report TPC-dependent NAADP-evoked calcium release,
  and GOA has GO:0072345 NAADP-sensitive calcium-release channel activity by IDA for TPCN1
  (PMID:19620632) and TPCN2 (PMID:19387438, PMID:19620632, PMID:20880839, PMID:32167471).
  Endolysosome patch-clamp from TPC double-knockout mice found PI(3,5)P2-activated,
  Na+-selective channels insensitive to NAADP (PMID:23063126), and TPC1 was described as a
  voltage-gated Na+ channel (PMID:24776928); from these papers GOA has NOT rows for
  GO:0072345 (TPCN1 PMID:24776928; TPCN2 PMID:23063126), positive rows for GO:0015280
  ligand-gated sodium channel activity and GO:0097682 intracellularly
  phosphatidylinositol-3,5-bisphosphate-gated monatomic cation channel activity (both
  paralogs), GO:0005248 voltage-gated sodium channel activity for TPCN1 and NOT for
  TPCN2. The later finding that NAADP is sensed through JPT2/LSM12 rather than the
  channel protein explains why NAADP did not activate isolated TPCs, and TPC2 selectivity
  was shown to depend on the agonist (PMID:32167471): NAADP-mimetic agonism gives
  calcium-permeable non-selective currents, PI(3,5)P2-mimetic agonism Na+-selective
  currents. The module models both experimentally typed gating modes for each paralog:
  GO:0072345 for the NAADP mode (the GO definition allows NAADP to be bound by "the
  channel complex or one of its constituent parts", which covers binding by JPT2/LSM12)
  and GO:0097682 for the PI(3,5)P2 mode (cation-generic, so it does not decide Na+ versus
  calcium). Whether native PI(3,5)P2-activated TPCs release physiologically meaningful
  calcium remains open. GO:0015280 and GO:0005248 (sodium channel activities) are not
  used as separate annotons: they describe the same PI(3,5)P2- or voltage-gated pore
  whose cation-generic function is already on the PI(3,5)P2 annoton, and Na+ flux is
  recorded on that annoton's process (GO:0035725 sodium ion transmembrane transport, IDA
  for TPCN2, PMID:30860481; authored for TPCN1).


  (4) MOLECULAR FUNCTIONS. From GOA (QuickGO, November 2026), checked in go-basic
  2026-07-26. TPCN1: GO:0072345 IDA (PMID:19620632) and GO:0097682 IDA (PMID:23063126,
  PMID:24776928). TPCN2: GO:0072345 IDA (see note 3) and GO:0097682 IDA (PMID:23063126,
  PMID:30860481, PMID:32167471); GO:0080025 phosphatidylinositol-3,5-bisphosphate binding
  IDA is the ligand-binding part of the same activity and is not a separate annoton.
  MCOLN1: GO:0099604 ligand-gated calcium channel activity IDA (PMID:25720963,
  PMID:29019983), also the function in the GO-CAM; GO:0005381 iron ion transmembrane
  transporter activity IDA (PMID:18794901) is a genuine secondary activity (Fe2+ release
  from lysosomes) recorded here but outside a calcium module. MCOLN2 and MCOLN3 have no
  human experimental MF row; GOA has GO:0005262 calcium channel activity by Reactome TAS
  and GO:0072345 by IBA (PTN000252611), which is not used because mucolipins are not
  NAADP-gated in the cited literature. The module authors GO:0005262 calcium channel
  activity for MCOLN2 and MCOLN3 on the PI(3,5)P2 activation data (PMID:20802798) and the
  TRPML3 calcium channel papers (PMID:19522758, PMID:19497048). JPT2 and LSM12 have no
  experimental MF in GOA except bare protein binding (not used); GO has no NAADP binding
  term, so their function is given as free text and requested in proposed_new_terms. Their
  process GO:0051281 positive regulation of release of sequestered calcium ion into
  cytosol is authored from the cited papers. Channel annotons carry calcium(2+)
  (CHEBI:29108, label checked in OLS) as cargo, moved from the organelle lumen to the
  cytosol.


  (5) LOCATIONS (organelle policy, projects/ORGANELLES.md). Lysosome is a root organelle
  term; the module does not use it but the sub-compartment lysosomal membrane, because
  every channel is a multi-pass membrane protein and has direct lysosomal membrane rows
  (EXP/IDA/HDA) in GOA, so the membrane location is assayed rather than inferred. Endosome
  membrane terms per paralog are also from experimental GOA rows: TPCN1 endosome membrane
  (IDA PMID:19620632, PMID:23063126); TPCN2 late endosome membrane (EXP PMID:32167471);
  MCOLN1 late endosome membrane (EXP PMID:15178326, PMID:21224396); MCOLN2 recycling and
  late endosome membrane (EXP PMID:17662026); MCOLN3 early and late endosome membrane (EXP
  PMID:19497048, PMID:19522758). Plasma membrane rows for MCOLN1-3 (HPA, overexpression)
  reflect transit and lysosomal exocytosis and are not used. Parent-child pairs are
  avoided: endolysosome membrane (TPCN2 IDA) is not added beside lysosomal membrane. JPT2
  and LSM12 have no location assigned (cytosolic proteins that associate with the TPCs).


  (6) BOUNDARY DECISIONS. Upstream: PI(3,5)P2 is made by the PIKFYVE complex and NAADP by
  CD38 or SARM1 base exchange; these are activator supply, not parts, and no module exists
  for them yet. Lysosomal calcium refilling (the uptake mechanism of acidic stores is not
  identified; RGD notes a postulated Ca2+/H+ exchanger, and refilling from the ER at
  contact sites has been reported) and lumen acidification by the V-ATPase are context.
  Downstream: calcineurin (PPP3CB) dephosphorylation of TFEB, TFEB-driven lysosome
  biogenesis and autophagy (PMID:25720963), membrane fusion/fission in the late
  endocytic pathway, lysosomal exocytosis, and amplification by ER IP3 receptors
  (er_calcium_store_cycling) are context and are not modelled as parts. Viral entry rows
  (TPCN1, TPCN2, JPT2) and pigmentation rows (TPCN2) are physiological consequences, not
  parts. The ryanodine receptor as an NAADP target in T cells is noted in note 2 only.


  (7) GO-CAM LINKS. Pinned: MCOLN1 ligand-gated calcium channel activity (GO:0099604) in
  gomodel:63c0ac2b00000641 (Lysosome biogenesis by TFEB, Human), activity
  gomodel:63c0ac2b00000641/63c0ac2b00000720, with process calcium ion export and location
  lysosomal membrane; the same model has calcineurin PPP3CB and TFEB downstream, which are
  context here. No production GO-CAM in gocams/index.tsv (any species) contains TPCN1,
  TPCN2, MCOLN2, MCOLN3, JPT2 or LSM12. The seed's best_gocam (gomodel:65d7e4ac00002121)
  is unrelated.


  (8) POSSIBLE UPSTREAM ERRORS. (a) Every experimental GOA row for JPT2 (protein binding
  to TPCN1, IPI; regulation of calcium-mediated signaling, IMP; endocytosis involved in
  viral entry into host cell, IDA), and the reciprocal TPCN1-JPT2 IPI row, cite
  PMID:15094197, a 2004 Gene paper on cloning and expression of HN1 and HN1L that reports
  no TPC interaction, calcium or viral work. The content matches PMID:33758061 (Gunaratne
  et al. 2021); the rows look mis-keyed and are worth reporting to UniProt. (b) MCOLN2 and
  MCOLN3 carry GO:0072345 NAADP-sensitive calcium-release channel activity by IBA from a
  node seeded only by rat Mcoln1; no mucolipin is shown to be NAADP-gated in the papers
  cited here, so the PAINT node placement is questionable (not verified against the rat
  annotation's source paper).


  (9) OTHER PW:0001139 GENES NOT MODELLED HERE. They are in the sibling modules listed above
  or unmodelled, by symbol: voltage-gated CACNA1A-S and CACNB1-4, cyclic nucleotide-gated
  CNGA1-4, CNGB1, CNGB3, TRPV5, TRPV6.


  (10) GROUNDING. UniProt accessions from UniProt REST (reviewed human entries); no gene
  review exists for any participant, which is curation follow-up for the project plan. GO
  ids and labels checked against go-basic 2026-07-26; none obsolete. No PANTHER or PTN
  ids are asserted: every participant is a concrete human gene product.
proposed_new_terms:
  - proposed_name: release of sequestered calcium ion into cytosol by lysosome
    proposed_definition: >-
      The directed movement of calcium ions sequestered in lysosomes, late endosomes and
      related acidic organelles across their limiting membrane into the cytosol.
    justification: >-
      GO has release of sequestered calcium ion into cytosol by endoplasmic reticulum
      (GO:1903514), by sarcoplasmic reticulum (GO:0014808) and by Golgi (GO:0061454), but no
      child for the acidic endolysosomal stores, and the parent GO:0051209 is defined as
      release from the ER, Golgi apparatus or mitochondria (see proposed_ontology_changes).
      Calcium release from lysosomes and late endosomes through the two-pore channels and
      the mucolipins is well established, so annotations currently fall back to
      GO:1901660 calcium ion export, which does not say where the calcium goes. The new
      term would replace GO:1901660 as this module's concept and on its channel annotons.
    proposed_parent:
      id: GO:0051209
      label: release of sequestered calcium ion into cytosol
    supported_by:
      - reference_id: PMID:19387438
        supporting_text: Thus, TPCs form NAADP receptors that release Ca(2+) from acidic organelles, which can trigger further Ca(2+) signals via sarcoplasmic/endoplasmic reticulum.
      - reference_id: PMID:29019983
        supporting_text: Transient receptor potential mucolipin 1 (TRPML1) is a Ca2+-releasing cation channel that mediates the calcium signalling and homeostasis of lysosomes
  - proposed_name: NAADP binding
    proposed_definition: >-
      Binding to nicotinic acid adenine dinucleotide phosphate (NAADP), a calcium-mobilizing
      second messenger.
    justification: >-
      GO has NADP binding (GO:0050661) but no term for the second messenger NAADP. Two
      proteins, JPT2 (HN1L) and LSM12, bind NAADP directly (photoaffinity labelling; binding
      through the LSM12 Lsm domain) and confer NAADP sensitivity on the two-pore channels;
      their annotons in this module have no GO function term for want of this one. The
      parent is adenyl nucleotide binding, as for NADP binding.
    proposed_parent:
      id: GO:0030554
      label: adenyl nucleotide binding
    supported_by:
      - reference_id: PMID:34362892
        supporting_text: Lsm12 directly binds to NAADP via its Lsm domain, colocalizes with TPC2, and mediates the apparent association of NAADP to isolated TPC2 or TPC2-containing membranes
      - reference_id: PMID:33758062
        supporting_text: Photoaffinity labeling demonstrated direct binding of NAADP to recombinant HN1L/JPT2
proposed_ontology_changes:
  - change_type: NODE_TEXT_DEFINITION_CHANGE
    ontology: GO
    about_node:
      id: GO:0051209
      label: release of sequestered calcium ion into cytosol
    old_value: The process in which calcium ions sequestered in the endoplasmic reticulum, Golgi apparatus or mitochondria are released into the cytosolic compartment.
    new_value: The process in which calcium ions sequestered in an intracellular organelle, such as the endoplasmic reticulum, Golgi apparatus, mitochondria, endosomes or lysosomes, are released into the cytosolic compartment.
    change_dsl: >-
      change definition of GO:0051209 from 'The process in which calcium ions sequestered
      in the endoplasmic reticulum, Golgi apparatus or mitochondria are released into the
      cytosolic compartment.' to 'The process in which calcium ions sequestered in an
      intracellular organelle, such as the endoplasmic reticulum, Golgi apparatus,
      mitochondria, endosomes or lysosomes, are released into the cytosolic compartment.'
    origin: SELF_PROPOSED
    justification: >-
      The definition enumerates the ER, Golgi apparatus and mitochondria as a closed list, so
      calcium release from endosomes and lysosomes through the two-pore channels and the
      mucolipins, a well-established store, falls outside the term. Opening the list lets
      the requested child "release of sequestered calcium ion into cytosol by lysosome" sit
      under it and lets existing endolysosomal release annotations use it.
    supported_by:
      - reference_id: PMID:19387438
        supporting_text: Thus, TPCs form NAADP receptors that release Ca(2+) from acidic organelles, which can trigger further Ca(2+) signals via sarcoplasmic/endoplasmic reticulum.
module:
  id: endolysosomal_calcium_release
  label: Endolysosomal calcium release
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: calcium ion export (from endosomes and lysosomes)
      term:
        id: GO:1901660
        label: calcium ion export
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: lysosomal membrane
        term:
          id: GO:0005765
          label: lysosomal membrane
      - preferred_term: endosome membrane
        term:
          id: GO:0010008
          label: endosome membrane
  parts:
    - order: 1
      optional: true
      role: NAADP reception by NAADP-binding accessory proteins of the two-pore channels
      node:
        id: endo_naadp_reception
        label: JPT2 and LSM12 bind NAADP and confer NAADP sensitivity on TPCs
        module_type: REGULATORY_STEP
        description: >-
          NAADP made in response to extracellular stimuli is bound by small cytosolic
          NAADP-binding proteins that associate with TPC1 and TPC2 and are required for
          NAADP-evoked TPC activation. Optional because PI(3,5)P2 activates the TPCs and the
          mucolipins without NAADP.
        variant_sets:
          - id: endo_naadp_binding_proteins
            label: NAADP-binding proteins
            axis: paralog-independent alternative accessory proteins
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            notes: >-
              JPT2 and LSM12 were identified by two independent groups; whether they act in
              one complex or as alternatives is not known.
            variants:
              - id: endo_jpt2_variant
                label: JPT2 (HN1L)
                module_type: REGULATORY_STEP
                annotons:
                  - id: jpt2_naadp_reception
                    label: JPT2 NAADP binding conferring NAADP sensitivity on TPCs
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: JPT2 (HN1L)
                        term:
                          id: UniProtKB:Q9H910
                          label: Jupiter microtubule associated homolog 2
                    function:
                      preferred_term: NAADP binding (no GO term; requested in proposed_new_terms)
                    processes:
                      - preferred_term: positive regulation of release of sequestered calcium ion into cytosol
                        term:
                          id: GO:0051281
                          label: positive regulation of release of sequestered calcium ion into cytosol
                    role_description: >-
                      Photoaffinity-labelled by an NAADP probe and required for endogenous
                      NAADP-evoked, TPC-dependent calcium signals. Function is free text (no GO
                      term) and the process is authored; GOA's experimental JPT2 rows cite a
                      mis-keyed paper (notes 4 and 8).
                    evidence:
                      - source_id: PMID:33758061
                        statement: NAADP sensitivity of TPCs is conferred by NAADP-binding proteins.
                        supporting_text: NAADP action is mediated by NAADP-binding protein(s) of unknown identity that confer NAADP sensitivity to TPCs
                      - source_id: PMID:33758061
                        statement: JPT2 is a component of the NAADP receptor complex required for TPC-dependent signalling.
                        supporting_text: JPT2 is a component of the NAADP receptor complex that is essential for TPC-dependent Ca2+ signaling
              - id: endo_lsm12_variant
                label: LSM12
                module_type: REGULATORY_STEP
                annotons:
                  - id: lsm12_naadp_reception
                    label: LSM12 NAADP binding and TPC activation
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: LSM12
                        term:
                          id: UniProtKB:Q3MHD2
                          label: Protein LSM12
                    function:
                      preferred_term: NAADP binding (no GO term; requested in proposed_new_terms)
                    processes:
                      - preferred_term: positive regulation of release of sequestered calcium ion into cytosol
                        term:
                          id: GO:0051281
                          label: positive regulation of release of sequestered calcium ion into cytosol
                    role_description: >-
                      Binds NAADP directly through its Lsm domain, complexes with TPC1 and TPC2
                      and is required for NAADP-evoked TPC activation. Function free text and
                      process authored (no experimental GOA row beyond protein binding).
                    evidence:
                      - source_id: PMID:34362892
                        statement: LSM12 binds NAADP directly and mediates NAADP association with TPC2.
                        supporting_text: Lsm12 directly binds to NAADP via its Lsm domain, colocalizes with TPC2, and mediates the apparent association of NAADP to isolated TPC2 or TPC2-containing membranes
                      - source_id: PMID:34362892
                        statement: LSM12 is required for NAADP-evoked TPC activation and calcium mobilization.
                        supporting_text: Lsm12 is essential and immediately participates in NAADP-evoked TPC activation and Ca2+ mobilization from acidic stores
    - order: 2
      role: calcium release from endosomes and lysosomes into the cytosol
      node:
        id: endo_calcium_release_channels
        label: Endolysosomal calcium release channels
        module_type: MODULE
        description: >-
          Two unrelated channel families in the endolysosomal limiting membrane release luminal
          calcium: the two-pore channels and the mucolipin TRP channels. Both are activated by
          PI(3,5)P2; only the TPCs respond to NAADP.
        variant_sets:
          - id: endo_release_channel_families
            label: Endolysosomal release channel families
            axis: channel family and activating ligand
            variant_kind: ROUTE
            selection: ONE_OR_MORE
            notes: >-
              Most cells express members of both families, which act in parallel on
              overlapping endosomal and lysosomal compartments.
            variants:
              - id: endo_tpc_route
                label: Two-pore channels (TPCN1, TPCN2)
                module_type: TRANSPORT_STEP
                description: >-
                  Dimeric two-repeat channels gated by NAADP (through JPT2/LSM12) and by
                  PI(3,5)P2; NAADP favours a calcium-permeable state, PI(3,5)P2 a
