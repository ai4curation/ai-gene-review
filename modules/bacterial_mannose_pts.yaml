id: MODULE:bacterial_mannose_pts
title: Bacterial mannose-active phosphotransferase system
description: Mannose-active bacterial group translocation couples a cognate EIIA/EIIB histidyl phosphorelay
  to an EIIC/EIID membrane apparatus. Phospho-HPr supplies the relay, and phosphorylated EIIB donates
  phosphate to mannose entering the cytoplasm. EIIA and EIIB can be domains of a fused protein or separate
  chains. Substrate range and the contribution of alternative uptake systems vary across species; bacteriocin
  recognition and phage entry are distinct outputs of some membrane assemblies.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0009401
  title: phosphoenolpyruvate-dependent sugar phosphotransferase system
  statement: Defines the PEP-dependent sugar group-translocation process.
- source_id: GO:0015761
  title: mannose transmembrane transport
  statement: Defines the core mannose import process catalyzed by ManXYZ.
- source_id: GO:0022870
  title: protein-N(PI)-phosphohistidine-mannose phosphotransferase system transporter activity
  statement: Defines the ManXYZ complex-level transport and phosphorylation activity.
- source_id: file:genes/ECOLI/manX/manX-ai-review.yaml
  title: ECOLI manX gene review
  statement: The completed manX review grounds ManX as the EIIAB phosphorylating subunit of the E. coli
    mannose-specific PTS.
- source_id: file:genes/ECOLI/manY/manY-ai-review.yaml
  title: ECOLI manY gene review
  statement: The completed manY review grounds ManY as the EIIC channel component of the ManXYZ inner-membrane
    translocation subcomplex.
- source_id: file:genes/ECOLI/manZ/manZ-ai-review.yaml
  title: ECOLI manZ gene review
  statement: The completed manZ review grounds ManZ as the EIID partner of ManY in the ManXYZ inner-membrane
    translocation subcomplex.
- source_id: PMID:2951378
  title: The mannose permease of Escherichia coli consists of three different proteins. Amino acid sequence
    and function in sugar transport, sugar phosphorylation, and penetration of phage lambda DNA.
  statement: Establishes the IIIMan/ManX, II-PMan/ManY, and II-MMan/ManZ composition of E. coli mannose
    permease and the requirement for all three subunits in sugar transport and phosphorylation.
- source_id: PMID:2999119
  title: The mannose-permease of the bacterial phosphotransferase system. Gene cloning and purification
    of the enzyme IIMan/IIIMan complex of Escherichia coli.
  statement: Establishes IIMan/IIIMan complex purification, PEP-dependent phosphorylation of IIIMan/ManX,
    and the requirement for membrane IIMan and soluble ManX in 2-deoxyglucose phosphorylation.
- source_id: PMID:2681202
  title: Mannose permease of Escherichia coli. Domain structure and function of the phosphorylating subunit.
  statement: Establishes the ManX EIIA and EIIB domain architecture and their distinct histidyl phosphorylation
    sites.
- source_id: PMID:8262947
  title: The mannose transporter of Escherichia coli. Structure and function of the IIABMan subunit.
  statement: Mutational analysis supports the catalytic importance of the ManX EIIA and EIIB histidines.
- source_id: PMID:31209249
  title: Structure of the mannose transporter of the bacterial phosphotransferase system.
  statement: Cryo-EM of E. coli ManYZ establishes the ManY-ManZ membrane architecture.
- source_id: PMID:17158705
  title: How phosphotransferase system-related protein phosphorylation regulates carbohydrate metabolism
    in bacteria.
  statement: Distinguishes the PEP/EI/HPr/EIIA/EIIB phosphorelay from its extensive regulatory interactions.
    Supports an EII group-translocation boundary downstream of phospho-HPr, not a module that includes
    all PTS signaling. Its passing description of Bacillus Lev as mannose/fructose-specific is contradicted
    for mannose by primary2117666 and is not used for substrate scope.
- source_id: PMID:16339738
  title: Comparative genomic analyses of the bacterial phosphotransferase system.
  statement: 'A PubMed-indexed review with comparative-genomic analyses: mannose-class EII includes A/B
    relay and C/D membrane components, with variable fusion organization and frequent strain-level variation.
    Its older unknown-biochemical-role description of IID does not override the later ManYZ structure.
    Phylogenetic membership or a partial cassette alone cannot establish matched mannose transport capacity.'
- source_id: PMID:18647176
  title: Ins and outs of glucose transport systems in eubacteria.
  statement: The Streptococcus/Enterococcus/Lactococcus and Lactobacillus sections document broad glucose/mannose-class
    uptake, fused and split relay architectures, and alternate non-PTS uptake. ManO is not universal and
    was of unresolved function in the cited Lactobacillus context. The review supports taxon discovery,
    while exact substrates and strains require primary evidence.
- source_id: PMID:2117666
  title: Levanase operon of Bacillus subtilis includes a fructose-specific phosphotransferase system regulating
    the expression of the operon.
  statement: The abstract explicitly distinguishes Bacillus subtilis LevDEFG from mannose uptake despite
    homologous components. This is a source-positive negative control for mannose specificity, not a claim
    that all related families lack mannose activity. Full text was not acquired.
- source_id: PMID:17284603
  title: Common mechanisms of target cell recognition and immunity for class II bacteriocins.
  statement: Native Lactococcus lactis IL1403 ptnAB/C/D deletion reduces growth on glucose/mannose; the
    same paper explicitly names genome AE005176 and the three genes. Reintroduction and isolated-C/D experiments
    shown here primarily test bacteriocin receptor behavior, so receptor restoration is not relabeled
    as a complete sugar-transport reconstitution.
- source_id: PMID:38047704
  title: Lactococcus lactis mutants resistant to lactococcin A and garvicin Q reveal missense mutations
    in the sugar transport domain of the mannose phosphotransferase system.
  statement: Native IL1403 membrane-component variants have impaired mannose/glucose growth in Fig4, with
    cellobiose control and exceptions retaining sugar utilization. Bacteriocin resistance is separable
    from transport. This reinforces native C/D participation without claiming every variant abolishes
    transport or that all glucose uptake uses this system.
- source_id: PMID:12902269
  title: Characterization of Streptococcus mutans strains deficient in EIIAB Man of the sugar phosphotransferase
    system.
  statement: UA159 ManL contributes to PEP-dependent glucose/mannose uptake, while inducible alternative
    mannose transport explains the mutant growth result. Operon Fig1 identifies manL/M/N by flanking loci
    and the text gives manL length0.99kb. Genetic/regulatory phenotypes do not prove sole-route necessity
    or separate catalytic measurements for every membrane subunit.
- source_id: PMID:17951382
  title: Role of RelA of Streptococcus mutans in global control of gene expression.
  statement: This independent UA159 primary explicitly equates manL with SMU.1877 and manM with SMU.1878.
    It supports the nomenclature bridge rather than adding new transport measurements. manN is mapped
    through the adjacent third CDS in the original2003 operon figure and official genome cross-references.
- source_id: PMID:24928869
  title: Uptake and metabolism of N-acetylglucosamine and glucosamine by Streptococcus mutans.
  statement: Native UA159 assays extend the system to glucosamine/N-acetylglucosamine uptake; downstream
    ManO modulates amino-sugar uptake. This is broader cargo context, not justification to require ManO
    for the bacterial mannose module or to add downstream amino-sugar catabolism to the transport mechanism.
    Native UA159 PEP-dependent uptake assays also compare deletion of the complete manLMN operon, with
    almost no GlcNAc uptake; ManL-only complementation is partial and a stable full-operon complement
    was not obtained. Individual membrane-subunit chemistry remains a domain/operon inference, and divergent
    S. mutans lineages do not establish interchangeable interfaces.
- source_id: PMID:9004509
  title: Lactobacillus curvatus has a glucose transport system homologous to the mannose family of phosphoenolpyruvate-dependent
    phosphotransferase systems.
  statement: The assayed Lactobacillus curvatus strain is CECT904. The deposited U28163 fragment encodes
    separate complete IIA/IIB/IIC and only partial IID. Heterologous ManB complementation provides relay-function
    support, but does not establish arbitrary cross-species cassette compatibility. Original UniProt IDs
    are now inactive; no complete active quartet is asserted.
- source_id: PMID:40135874
  title: The Streptococcus pyogenes mannose phosphotransferase system (Man-PTS) influences antimicrobial
    activity and niche-specific nasopharyngeal infection.
  statement: Native Streptococcus pyogenes MGAS8232 experiments distinguish complete-manLMN from ManL-only
    complementation for mannose/galactose/GlcNAc utilization. The reported additional background mutations
    make the complementation comparison important. Antimicrobial production and host colonization are
    downstream context, not core transport roles. Exact accession bridge not established in this consultation,
    so no representative IDs proposed.
notes: The module represents a conserved functional mechanism with explicit target and interface requirements.
  It does not assert that every PTHR33799 or PTHR32502 member performs mannose transport. All four roles
  are explicit; a fused IIAB protein may fill both relay roles and the EIIB input role, while IIA-only
  proteins cannot fill EIIB. E. coli K-12, L. lactis IL1403 and S. mutans UA159 provide nine individually
  reviewed representatives. The latter two use C/D subfamilies distinct from E. coli; aliases and strain
  identities are verified in the literature consultation. Native IL1403 evidence is genetic/physiological;
  UA159 uptake and alternative-pathway phenotypes are qualified. No universal whole-complex stoichiometry,
  arbitrary mixed-species capacity, or phage/bacteriocin function is inferred. Three review articles and
  primary studies supply step-level evidence; separately acquired full texts and immutable-cache limitations
  are recorded in the audit. The real Falcon module request failed403. All nine gene reviews are complete
  with ordered source payloads preserved; capacity checks, full corpus validation and independent review
  remain pending.
