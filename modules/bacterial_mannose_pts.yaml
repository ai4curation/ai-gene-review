  knowledge_gaps:
  - gap_statement: 'Positive family and domain matches do not determine sugar specificity, compatible
      interfaces or native expression. Bacillus LevDEFG is experimentally fructose-active and not involved
      in mannose uptake. Sources: PMID:2117666.'
    boundary: Require independent substrate and partner evidence; retain LevDEFG as an alternate-cargo
      control.
    gap_kind:
    - BIOLOGY
  - gap_statement: 'The split CECT904 system has a historical complete IIA/IIB/IIC deposit but only partial
      IID and inactive UniProt records; a complete active-reference quartet has not been established.
      Sources: PMID:9004509.'
    boundary: Split relay architecture is supported, but this comparator is not counted as a complete
      reviewed reference panel. Do not substitute WDN19 or another strain.
    gap_kind:
    - BIOLOGY
  - gap_statement: 'EI/HPr supply, later sugar metabolism, global regulation, bacteriocin receptor behavior
      and phage entry are outside the EII group-translocation boundary. ManO effects on amino-sugar uptake
      do not establish universal mannose-module necessity. Sources: PMID:17158705, PMID:17284603, PMID:24928869.'
    boundary: Keep these outputs and prerequisites separate; receptor-only C/D and isolated relay controls
      must not count as complete uptake.
    gap_kind:
    - BIOLOGY
  - gap_statement: 'A native deletion phenotype reflects other uptake systems and regulation as well as
      this apparatus. UA159 manL mutants can grow faster on mannose through alternative uptake; IL1403
      growth assays do not independently measure purified transport flux. Sources: PMID:12902269, PMID:38047704.'
    boundary: Capacity is not sole-route necessity or a prediction of native growth rate.
    gap_kind:
    - BIOLOGY
  - gap_statement: A specific GO term for the EIIA-to-EIIB relay is not established here, and the generic
      transporter-complex term does not express the domain architecture.
    boundary: Use a precise reaction description for the relay and GO0022870 only for the coupled transporter
      assembly.
    gap_kind:
    - ONTOLOGY
