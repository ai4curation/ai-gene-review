id: MODULE:bacterial_mannose_pts
title: E. coli ManXYZ mannose-family PTS
description: >-
  A bacterial phosphoenolpyruvate-dependent group-translocation module in which
  the soluble/peripheral ManX EIIAB subunit relays phosphate from HPr through
  its EIIA and EIIB histidines to sugar entering through the inner-membrane
  ManY/ManZ channel. ManY and ManZ form the EIIC/EIID membrane translocation
  subcomplex, while all three subunits are required for efficient transport and
  concomitant phosphorylation of mannose-family substrates. Upstream enzyme I
  and HPr, dedicated fructose PTS systems, nitrogen-regulatory PTS signaling,
  sugar chemotaxis, and bacteriophage lambda DNA penetration are neighboring
  processes outside this transport module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009401
    title: phosphoenolpyruvate-dependent sugar phosphotransferase system
    statement: Defines the PEP-dependent sugar group-translocation process.
  - source_id: GO:0015761
    title: mannose transmembrane transport
    statement: Defines the core mannose import process catalyzed by ManXYZ.
  - source_id: GO:0022870
    title: protein-N(PI)-phosphohistidine-mannose phosphotransferase system transporter activity
    statement: Defines the ManXYZ complex-level transport and phosphorylation activity.
  - source_id: file:genes/ECOLI/manX/manX-ai-review.yaml
    title: ECOLI manX gene review
    statement: >-
      The completed manX review grounds ManX as the EIIAB phosphorylating
      subunit of the E. coli mannose-specific PTS.
  - source_id: file:genes/ECOLI/manY/manY-ai-review.yaml
    title: ECOLI manY gene review
    statement: >-
      The completed manY review grounds ManY as the EIIC channel component of
      the ManXYZ inner-membrane translocation subcomplex.
  - source_id: file:genes/ECOLI/manZ/manZ-ai-review.yaml
    title: ECOLI manZ gene review
    statement: >-
      The completed manZ review grounds ManZ as the EIID partner of ManY in the
      ManXYZ inner-membrane translocation subcomplex.
  - source_id: PMID:2951378
    title: >-
      The mannose permease of Escherichia coli consists of three different
      proteins. Amino acid sequence and function in sugar transport, sugar
      phosphorylation, and penetration of phage lambda DNA.
    statement: >-
      Establishes the IIIMan/ManX, II-PMan/ManY, and II-MMan/ManZ composition of
      E. coli mannose permease and the requirement for all three subunits in
      sugar transport and phosphorylation.
  - source_id: PMID:2999119
    title: >-
      The mannose-permease of the bacterial phosphotransferase system. Gene
      cloning and purification of the enzyme IIMan/IIIMan complex of Escherichia
      coli.
    statement: >-
      Establishes IIMan/IIIMan complex purification, PEP-dependent phosphorylation
      of IIIMan/ManX, and the requirement for membrane IIMan and soluble ManX in
      2-deoxyglucose phosphorylation.
  - source_id: PMID:2681202
    title: >-
      Mannose permease of Escherichia coli. Domain structure and function of the
      phosphorylating subunit.
    statement: >-
      Establishes the ManX EIIA and EIIB domain architecture and their distinct
      histidyl phosphorylation sites.
  - source_id: PMID:8262947
    title: >-
      The mannose transporter of Escherichia coli. Structure and function of the
      IIABMan subunit.
    statement: >-
      Mutational analysis supports the catalytic importance of the ManX EIIA and
      EIIB histidines.
  - source_id: PMID:31209249
    title: Structure of the mannose transporter of the bacterial phosphotransferase system.
    statement: >-
      Cryo-EM of E. coli ManYZ establishes the ManY-ManZ membrane architecture.
notes: >-
  ManXYZ is broad-substrate relative to many sugar PTS transporters: mannose is
  the named core substrate, but the same EII complex also imports and
  phosphorylates 2-deoxyglucose and several other hexoses or amino sugars. This
  module therefore represents the ManXYZ EII apparatus rather than trying to
  partition every secondary sugar into a separate route. Phage lambda DNA
  penetration and sugar chemotaxis use the ManYZ membrane subcomplex but are
  separate biological outputs.
