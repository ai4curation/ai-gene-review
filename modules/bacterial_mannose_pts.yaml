      target: manxyz_transport_phosphorylation
      connection_type: PROVIDES_INPUT_FOR
      description: Phosphorylated ManX EIIB His-175 donates phosphate to incoming D-mannose.
      chaining_status: VERIFIED
      chaining_note: >-
        ManX domain mapping and histidine-mutagenesis experiments establish
        His-10 as the EIIA phosphoacceptor from HPr and His-175 as the downstream
        EIIB phosphoacceptor used for sugar phosphorylation.
  knowledge_gaps:
    - gap_statement: >-
        The ManXYZ apparatus imports several secondary sugars in addition to
        mannose, but the in vivo partitioning of those fluxes among ManXYZ and
        dedicated PTS transporters is condition-dependent.
      boundary: >-
        Represent the conserved mannose-family EII group-translocation
        apparatus here; model dedicated fructose and amino-sugar systems in
        their own pathway modules.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        GO currently represents the ManXYZ EII membrane complex with the generic
        cellular-component term GO:1902495 transmembrane transporter complex.
      boundary: >-
        Use GOA's current complex term here, and request a PTS EII
        phosphotransferase/translocation complex term if recurring curation needs
        require a PTS-specific component.
      gap_kind:
        - ONTOLOGY
    - gap_statement: >-
        ManY and ManZ are sufficient for bacteriophage lambda DNA penetration,
        and the ManXYZ apparatus also functions in sugar chemotaxis, but these
        secondary outputs need curator review before they are represented as
        ManXYZ pathway modules or GO annotations.
      boundary: >-
        This module covers sugar group translocation by the ManXYZ EII complex;
        keep phage DNA penetration and sugar chemotaxis outside its process list.
      gap_kind:
        - BIOLOGY
