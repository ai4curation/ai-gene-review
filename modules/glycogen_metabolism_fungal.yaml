          label: Fungi
        description: >-
          Exemplified by budding yeast. The synthesis arm and the cytosolic
          mobilisation route are shared with animals (see the human
          glycogen_biosynthesis and glycogenolysis modules); the vacuolar
          GH15 glucoamylase route is fungal.
