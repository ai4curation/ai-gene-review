id: MODULE:glycogen_metabolism_fungal
title: Fungal glycogen synthesis and mobilisation
description: >-
  Fungi store glucose as glycogen, a branched alpha-1,4/alpha-1,6 glucan,
  through a UDP-glucose-dependent pathway like that of animals and unlike the
  ADP-glucose pathway of bacteria. Glucose 1-phosphate is activated with UTP to
  UDP-glucose by UDP-glucose pyrophosphorylase. Synthesis starts on glycogenin,
  a self-glucosylating GT-8 glucosyltransferase that attaches glucose to its own
  tyrosine residue(s) and extends a short alpha-1,4 oligosaccharide primer.
  Glycogen synthase (GT-3) elongates the primer by adding glucose from
  UDP-glucose to non-reducing ends, and the GH13 branching enzyme moves
  segments of chain to alpha-1,6 positions to create branches. Mobilisation has
  two routes. In the cytosol, glycogen phosphorylase releases glucose
  1-phosphate from chain ends until it stops near a branch, and the bifunctional
  debranching enzyme transfers the remaining short branch to another chain
  (4-alpha-glucanotransferase) and hydrolyses the single alpha-1,6-linked
  glucose (amylo-alpha-1,6-glucosidase). Alternatively, glycogen delivered to
  the vacuole by autophagy is hydrolysed to free glucose by a vacuolar GH15
  glucoamylase. Phosphoglucomutase interconverts glucose 1-phosphate and glucose
  6-phosphate, linking both arms to glycolysis. Both arms are induced by
  nutrient limitation and stress and are controlled post-translationally (for
  example by phosphorylation of glycogen synthase and phosphorylase); these
  regulatory inputs are outside the module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0005977
    title: glycogen metabolic process
    statement: Module-level process concept covering synthesis and mobilisation.
  - source_id: GO:0005978
    title: glycogen biosynthetic process
    statement: Process concept for the synthesis arm.
  - source_id: GO:0005980
    title: glycogen catabolic process
    statement: Process concept for the mobilisation arm.
  - source_id: GO:0061723
    title: glycophagy
    statement: Process concept for autophagic delivery of glycogen to the vacuole, the context of the vacuolar hydrolytic route.
  - source_id: YeastPathways:PWY3O-4031
    title: glycogen biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists glycogenin self-glucosylation and primer extension
      (GLG1, GLG2), elongation (GSY1, GSY2), branching (GLC3),
      phosphoglucomutase (PGM1, PGM2) and UDP-glucose pyrophosphorylase (UGP1,
      YHL012W). All were retained except YHL012W, which is only a probable
      UDP-glucose pyrophosphorylase paralog.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4031
  - source_id: YeastPathways:GLYCOCAT-YEAST-PWY
    title: glycogen catabolism (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists GPH1 phosphorolysis, GDB1 transferase and
      alpha-1,6-glucosidase reactions, SGA1 glucoamylase and PGM1/PGM2. All
      gene assignments were retained. Two GDB1 reactions were not adopted:
      RXN3O-4038 (glycogen to maltotetraose, an isoamylase/GlgX-type
      reaction) and AMYLOMALT-RXN (maltotetraose + glucose disproportionation),
      which are not supported by the GDB1 characterisation.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLYCOCAT-YEAST-PWY
  - source_id: PMID:11152943
    title: Reserve carbohydrates metabolism in the yeast Saccharomyces cerevisiae.
    statement: >-
      Review of synthesis and degradation of glycogen and trehalose and their
      regulation in budding yeast (cited by YeastPathways for both glycogen
      frames).
    supporting_text: >-
      In this review we present information on the regulation of
      the activity of the enzymes implicated in the pathways of synthesis and
      degradation of glycogen and trehalose
  - source_id: PMID:20412306
    title: Regulation of glycogen metabolism in yeast and bacteria.
    statement: >-
      Comparative review of yeast and bacterial glycogen metabolism, including
      the role of the vacuole in yeast glycogen metabolism.
    supporting_text: >-
      We also discuss our recent understanding of the
      important role played by the vacuole in glycogen metabolism.
  - source_id: PMID:8524228
    title: Requirement of the self-glucosylating initiator proteins Glg1p and Glg2p for glycogen accumulation in Saccharomyces cerevisiae.
    statement: >-
      GLG1 and GLG2 encode self-glucosylating glycogenin-like primers;
      disruption of both abolishes glycogen synthesis despite normal glycogen
      synthase.
    supporting_text: >-
      Disruption of
      both genes results in the inability of the cells to synthesize glycogen despite
      normal levels of glycogen synthase.
  - source_id: PMID:8900126
    title: Initiation of glycogen synthesis in yeast. Requirement of multiple tyrosine residues for function of the self-glucosylating Glg proteins in vivo.
    statement: Glg2 is glycogen-associated and needs several tyrosine residues for function in vivo.
    supporting_text: >-
      Unlike the mammalian
      counterpart, glycogenin, the yeast Glg proteins appear to require multiple Tyr
      residues for functionality.
  - source_id: PMID:16004992
    title: Glycogen synthesis in the absence of glycogenin in the yeast Saccharomyces cerevisiae.
    statement: >-
      A small fraction of glg1 glg2 colonies switch on glycogen synthesis
      stochastically, so glycogenin priming is the normal but not the only
      initiation route.
    supporting_text: >-
      we show that a small fraction of colonies from
      glg1glg2 mutants can switch on glycogen synthesis to levels comparable to
      wild-type strain.
  - source_id: PMID:1908457
    title: Two glycogen synthase isoforms in Saccharomyces cerevisiae are coded by distinct genes that are differentially controlled.
    statement: GSY1 and GSY2 encode glycogen synthases; GSY2 is the predominant, nutrient-depletion-induced isoform.
    supporting_text: >-
      The GSY2 gene product appears to be the predominant glycogen synthase
      with activity linked to nutrient depletion.
  - source_id: PMID:1634552
    title: Coordinate regulation of glycogen metabolism in the yeast Saccharomyces cerevisiae. Induction of glycogen branching enzyme.
    statement: GLC3 encodes the glycogen branching enzyme.
    supporting_text: >-
      Disruption of the branching enzyme structural gene establishes that branching enzyme activity
      is an absolute requirement for maximal glycogen synthesis.
  - source_id: PMID:2657401
    title: Molecular analysis of GPH1, the gene encoding glycogen phosphorylase in Saccharomyces cerevisiae.
    statement: GPH1 encodes glycogen phosphorylase.
    supporting_text: >-
      Haploid cells disrupted in GPH1 lacked phosphorylase activity
      and attained higher levels of intracellular glycogen
  - source_id: PMID:11094287
    title: The Saccharomyces cerevisiae YPR184w gene encodes the glycogen debranching enzyme.
    statement: >-
      GDB1 encodes a bifunctional debranching enzyme with
      alpha-1,4-glucanotransferase and alpha-1,6-glucosidase activities.
    supporting_text: >-
      Reliable measurement of alpha-1,4-glucanotransferase and
      alpha-1, 6-glucosidase activity of the yeast debranching enzyme was determined
      in strains overexpressing YPR184w.
  - source_id: PMID:2493265
    title: Characterization and localization of the sporulation glucoamylase of Saccharomyces cerevisiae.
    statement: SGA1 glucoamylase degrades glycogen and is recovered in vacuolar fractions.
    supporting_text: >-
      SGA was preferentially recovered in fractions which were enriched for the vacuolar
      hydrolases, carboxypeptidase Y and alpha-mannosidase.
  - source_id: PMID:11486014
    title: Antagonistic controls of autophagy and glycogen accumulation by Snf1p, the yeast homolog of AMP-activated protein kinase, and the cyclin-dependent kinase Pho85p.
    statement: >-
      Autophagy mutants lose glycogen stores; Gph1 and the vacuolar Sga1 appear
      to degrade physically distinct pools of glycogen.
    supporting_text: >-
      Gph1p and Sga1p may therefore
      degrade physically distinct pools of glycogen.
  - source_id: PMID:20383057
    title: A vacuolar glucoamylase, Sga1, participates in glycogen autophagy for proper asexual differentiation in Magnaporthe oryzae.
    statement: >-
      In the filamentous fungus Magnaporthe oryzae, the vacuolar glucoamylase
      Sga1 and autophagy act together in vacuolar glycogen breakdown,
      generalising the vacuolar route beyond budding yeast.
    supporting_text: >-
      Our results indicate that autophagy and Sga1
      act cooperatively in vacuolar glycogen breakdown
