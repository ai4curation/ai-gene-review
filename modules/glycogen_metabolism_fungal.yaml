  notes: >-
    NEW module (YeastPathways crosswalk, 2026-10) generalising PWY3O-4031 and
    GLYCOCAT-YEAST-PWY into one fungal glycogen module with a synthesis arm, a
    mobilisation arm (cytosolic phosphorolytic versus vacuolar hydrolytic
    routes) and the shared phosphoglucomutase link. The synthesis arm and the
    cytosolic route conform to the human glycogen_biosynthesis and
    glycogenolysis modules (same GO MFs and PANTHER families for UGP,
    glycogenin, glycogen synthase, branching enzyme, phosphorylase, debranching
    enzyme and PGM); those human modules are disease-oriented and were not
    edited. The bacterial ADP-glucose route is in glycogen_synthesis_and_mobilization,
    and the animal lysosomal acid alpha-glucosidase route (GAA, GH31) in
    lysosomal_glycogen_degradation is analogous to, but not homologous with,
    the fungal vacuolar GH15 glucoamylase route. Changes to YeastCyc: (1)
    glycogenin GLG1/GLG2 were expected to be missing from YeastCyc, but the
    current PWY3O-4031 frame does list them (GLYCOGENIN-GLUCOSYLTRANSFERASE-RXN
    and RXN-7667); they are retained as the priming step and
    the two YeastCyc glycogenin reactions are merged into one GO:0008466
    activity. Priming is required in practice, although rare glg1 glg2
    colonies can make glycogen (PMID:16004992). (2) YHL012W is listed by
    YeastCyc as a second UDP-glucose pyrophosphorylase; UniProt describes it
    only as probable and no characterisation was found, so it is not used as
    an exemplar. (3) The GDB1 reactions RXN3O-4038 (glycogen to maltotetraose)
    and AMYLOMALT-RXN are not adopted: they describe bacterial
    isoamylase/GlgX and amylomaltase/MalQ chemistry, whereas GDB1 is an
    AGL-type transferase/glucosidase (PMID:11094287). (4) SGA1 is placed in the
    vacuole (PMID:2493265, PMID:11486014), not the cytosol. GO-CAM
    disagreements: the YeastPathways models type GPH1 and the GDB1 transferase
    and glycogenin primer-extension activities only with GO:0003674, and place
    SGA1 in the cytosol. No PomBase GO-CAM is linked; S. pombe is not used as
    an exemplar. Regulation (PKA, Snf1, Pho85, Gac1/Glc7 phosphatase, Rim15)
    and the glycogen-granule proteins are outside the module.
