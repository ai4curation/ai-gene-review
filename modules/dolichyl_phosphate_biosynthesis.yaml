                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Hydrolyze dolichyl diphosphate to dolichyl phosphate + Pi. This regenerates Dol-P from the Dol-PP
              released after oligosaccharyltransferase transfers the glycan to protein. It is a recycling arm that
              feeds the same Dol-P pool as DOLK. DOLPP1 is not assigned to the de novo dephosphorylation of
              polyprenyl diphosphate to polyprenol.
  connections:
    - source: cis_prenyltransferase
      target: polyprenol_oxidation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Polyprenyl (dehydrodolichyl) diphosphate is dephosphorylated to polyprenol, which DHRSX oxidizes. The
        phosphatase that removes both phosphates in this de novo step has not been identified in humans.
      chaining_status: KNOWLEDGE_GAP
      chaining_note: >-
        cis-PT makes polyprenyl diphosphate, but DHRSX uses free polyprenol. The intervening polyprenyl diphosphate
        phosphatase (GO:0120556) step has no assigned human enzyme (PMID:42360632).
    - source: polyprenol_oxidation
      target: polyprenal_reduction
      connection_type: PROVIDES_INPUT_FOR
      description: Polyprenal from DHRSX is reduced by SRD5A3 to dolichal.
    - source: polyprenal_reduction
      target: dolichal_reduction
      connection_type: PROVIDES_INPUT_FOR
      description: Dolichal from SRD5A3 is reduced by DHRSX to dolichol.
    - source: dolichal_reduction
      target: dolichol_kinase
      connection_type: PROVIDES_INPUT_FOR
      description: Dolichol from DHRSX is phosphorylated by DOLK to Dol-P.
  knowledge_gaps:
    - gap_statement: >-
        The human enzyme or enzymes that dephosphorylate the cis-prenyltransferase product polyprenyl diphosphate
        to free polyprenol, the DHRSX substrate, are not identified.
      boundary: >-
        The reaction is chemically required between cis-PT and DHRSX. DOLPP1 is characterized for the Dol-PP to
        Dol-P recycling reaction and is not assigned to this step.
      gap_kind:
        - BIOLOGY
      resolution: >-
        Assay candidate ER and lipid-droplet lipid phosphatases (including DOLPP1) for activity on long-chain
        polyprenyl diphosphate, and test whether knockout cells accumulate polyprenyl diphosphate.
  notes: >-
    Dolichol / dolichyl-phosphate biosynthesis (GO:0043048 + GO:0016094), grounded to five completed human
    gene reviews; it consumes FPP/IPP from the isoprenoid_diphosphate_biosynthesis module and supplies the
    Dol-P glycan carrier to N-glycosylation (dolichol-linked oligosaccharide, GO:0006488) and to the
    downstream DPM1/DPM2/DPM3 + MPDU1 utilization steps (separate, already reviewed). Steps: (1) ER cis-PT
    complex = DHDDS (Q86SQ9 PTHR10291, catalytic, GO:0045547) + NUS1/NgBR (Q96E22 PTHR21528, obligate
    non-catalytic partner, contributes_to GO:0045547 via its C-terminal -RXG motif; in_complex GO:1904423)
    elongates FPP with many cis-IPP units -> dehydrodolichyl-PP; this is dephosphorylated to polyprenol by an
    unassigned polyprenyl diphosphate phosphatase (knowledge gap); (2) DHRSX (Q8N5I4 PTHR24320:SF264,
    GO:0160196) oxidizes polyprenol -> polyprenal; (3) SRD5A3 (Q9H8P0 PTHR14624, GO:0160198 polyprenal
    reductase) saturates the alpha-isoprene unit -> dolichal; (4) DHRSX (GO:0160197) reduces dolichal ->
    dolichol; (5) DOLK (Q9UPQ8 PTHR13205, GO:0004168 dolichol kinase, CTP-dependent) -> Dol-P; (6) DOLPP1
    (Q86YN1 PTHR11247, GO:0047874) dephosphorylates Dol-PP -> Dol-P + Pi in the recycling arm after OST glycan
    transfer. Revision (2026-10): an earlier version placed DOLPP1 on the de novo chain and had SRD5A3 convert
    polyprenol directly to dolichol. The 2024 identification of the DHRSX detour (PMID:38821050), its
    conservation in yeast (TDA5, PMID:42201967) and the 2026 review (PMID:42360632) replace that model. DHRSX
    has no gene review in this repository yet; its grounding is UniProtKB:Q8N5I4 and GOA EXP/IDA annotations
    to GO:0160196/GO:0160197 from PMID:38821050. Defects: DHDDS-CDG/RP59, NUS1-CDG/epileptic encephalopathy,
    DHRSX-CDG, SRD5A3-CDG, DOLK-CDG. GO term ids/labels verified with QuickGO.
