        label: Dolichyl-diphosphate phosphatase (DOLPP1)
        module_type: REACTION
        annotons:
          - id: dolpp1_activity
            label: "DOLPP1: dolichyldiphosphatase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DOLPP1 / PAP2 lipid-phosphatase (dolichyldiphosphatase) family
                term:
                  id: PANTHER:PTHR11247
                  label: PALMITOYL-PROTEIN THIOESTERASE/DOLICHYLDIPHOSPHATASE 1
                representative_members:
                  - preferred_term: DOLPP1 (human)
                    term:
                      id: UniProtKB:Q86YN1
                      label: Dolichyldiphosphatase 1
            function:
              preferred_term: dolichyldiphosphatase activity
              term:
                id: GO:0047874
                label: dolichyldiphosphatase activity
              substrates:
