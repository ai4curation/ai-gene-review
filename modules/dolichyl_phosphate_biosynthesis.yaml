              family:
                preferred_term: NUS1 / NgBR (Nogo-B receptor) family
                term:
                  id: PANTHER:PTHR21528
                  label: DEHYDRODOLICHYL DIPHOSPHATE SYNTHASE COMPLEX SUBUNIT NUS1
                representative_members:
                  - preferred_term: NUS1 (human; NgBR)
                    term:
                      id: UniProtKB:Q96E22
                      label: Dehydrodolichyl diphosphate synthase complex subunit NUS1
            function:
              preferred_term: dehydrodolichyl diphosphate synthase activity (contributing subunit)
              term:
                id: GO:0045547
                label: ditrans,polycis-polyprenyl diphosphate synthase [(2E,6E)-farnesyl diphosphate specific] activity
              substrates:
                - preferred_term: (2E,6E)-farnesyl diphosphate (FPP)
