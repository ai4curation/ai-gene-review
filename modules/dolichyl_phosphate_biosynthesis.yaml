id: MODULE:dolichyl_phosphate_biosynthesis
title: Dolichol / dolichyl-phosphate biosynthesis (cis-PT -> DHRSX -> SRD5A3 -> DHRSX -> DOLK)
description: >-
  Dolichyl phosphate (Dol-P) is the essential polyprenol lipid carrier on which the eukaryotic glycosylation
  machinery assembles and delivers glycans: it anchors the lipid-linked oligosaccharide for N-linked
  glycosylation, the mannose/glucose donors (Dol-P-Man, Dol-P-Glc) for N-glycan, O-mannose, GPI-anchor and
  C/O-mannosylation, and it is regenerated after each transfer cycle. Its biosynthesis begins where the
  isoprenoid-diphosphate trunk ends: the ER-membrane cis-prenyltransferase (cis-PT) complex — catalytic
  subunit DHDDS plus the non-catalytic partner NUS1 (NgBR) — elongates (2E,6E)-farnesyl diphosphate (FPP)
  by many cis (Z)-condensations of isopentenyl diphosphate (IPP) to the long-chain dehydrodolichyl
  diphosphate (dehydro-Dol-PP). This polyprenyl diphosphate is dephosphorylated to polyprenol by a
  phosphatase that has not been identified in humans. Polyprenol is then converted to dolichol by a
  three-step detour rather than by a single reduction. DHRSX oxidizes polyprenol to polyprenal (NAD+),
  SRD5A3 reduces the alpha-isoprene double bond of polyprenal to give dolichal (NADPH), and DHRSX reduces
  dolichal to dolichol (NADPH). Dolichol kinase DOLK then phosphorylates dolichol (CTP-dependent) to Dol-P,
  completing the carrier pool. The dolichyl-diphosphate phosphatase DOLPP1 regenerates Dol-P from the Dol-PP
  released after oligosaccharyltransferase moves the glycan onto protein. The cis-PT subunits, SRD5A3, DOLK
  and DOLPP1 are endoplasmic reticulum membrane proteins, whereas DHRSX has been localized to lipid
  droplets. Defects across this module cause congenital disorders of glycosylation (DHDDS-CDG/RP59,
  NUS1-CDG/epileptic encephalopathy, DHRSX-CDG, SRD5A3-CDG, DOLK-CDG) and inherited retinal dystrophy.
status: DRAFT
evidence:
  - source_id: GO:0043048
    title: dolichyl monophosphate biosynthetic process
    statement: The pathway culminates in dolichyl phosphate (Dol-P) synthesis (GO:0043048).
  - source_id: GO:0016094
    title: polyprenol biosynthetic process
    statement: cis-PT + reductase build the long-chain polyprenol/dolichol backbone (GO:0016094).
  - source_id: GO:0006488
    title: dolichol-linked oligosaccharide biosynthetic process
    statement: Dol-P is the carrier for the lipid-linked oligosaccharide used in N-glycosylation (GO:0006488).
  - source_id: file:human/DHDDS/DHDDS-ai-review.yaml
    title: DHDDS gene review (human)
    statement: cis-PT catalytic subunit (UniProtKB:Q86SQ9, GO:0045547) matches the completed human DHDDS review.
  - source_id: file:human/NUS1/NUS1-ai-review.yaml
    title: NUS1 gene review (human)
    statement: cis-PT non-catalytic subunit / NgBR (UniProtKB:Q96E22, contributes_to GO:0045547) matches the completed human NUS1 review.
  - source_id: file:human/DOLPP1/DOLPP1-ai-review.yaml
    title: DOLPP1 gene review (human)
    statement: Dolichyl-diphosphate phosphatase (UniProtKB:Q86YN1, GO:0047874) matches the completed human DOLPP1 review.
  - source_id: file:human/SRD5A3/SRD5A3-ai-review.yaml
    title: SRD5A3 gene review (human)
    statement: Polyprenol reductase (UniProtKB:Q9H8P0, GO:0160198) matches the completed human SRD5A3 review.
  - source_id: file:human/DOLK/DOLK-ai-review.yaml
    title: DOLK gene review (human)
    statement: Dolichol kinase (UniProtKB:Q9UPQ8, GO:0004168) matches the completed human DOLK review.
  - source_id: PMID:42360632
    title: 'From Isoprene Units to Polyprenols and Dolichols: 70 Years of Polyisoprenoid Biosynthesis Research.'
    statement: >-
      2026 review used to audit the module. It describes the 2024 revision of polyprenol-to-dolichol conversion
      from one SRD5A3 reduction to a three-step DHRSX/SRD5A3/DHRSX detour through polyprenal and dolichal. It
      also notes that polyprenols come from polyprenyl diphosphate dephosphorylation by a generic polyprenyl
      diphosphate phosphatase. The earlier module version modeled that step with DOLPP1 and omitted DHRSX.
    supporting_text: >-
      In the first step, DHRSX functions as a dehydrogenase, oxidizing polyprenol alcohol to an aldehyde
      intermediate known as polyprenal. Subsequently, SRD5A3 acts as a polyprenal reductase, utilizing NADPH to
      reduce the double bond and form dolichal. In the third and final step, DHRSX acts again, this time as a
      NADPH-dependent reductase, converting the terminal aldehyde group of dolichal back into an alcohol to
      produce dolichol [23].
  - source_id: PMID:38821050
    title: A pseudoautosomal glycosylation disorder prompts the revision of dolichol biosynthesis.
    statement: >-
      Primary evidence for the three-step detour. DHRSX (UniProtKB:Q8N5I4) performs the first (NAD+-dependent
      polyprenol dehydrogenase, GO:0160196) and third (NADPH-dependent dolichal reductase, GO:0160197) steps, and
      SRD5A3 performs only the second. DHRSX deficiency causes DHRSX-CDG.
    supporting_text: >-
      Of note, DHRSX has a unique dual substrate and
      cofactor specificity, allowing it to act as a NAD+-dependent dehydrogenase and
      as a NADPH-dependent reductase in two non-consecutive steps.
  - source_id: PMID:42201967
    title: The revised three-step detour pathway in dolichol biosynthesis is evolutionarily conserved in budding yeast.
    statement: >-
      Yeast TDA5 is a functional DHRSX ortholog: human DHRSX, but not DFG10 or SRD5A3, rescues the tda5 deletion.
      The detour is therefore conserved beyond mammals. Whether Env9 also takes part in yeast is still debated
      (PMID:42360632).
    supporting_text: >-
      These findings show that Tda5 serves the same function as DHRSX in yeast,
      thereby demonstrating conservation of the three-step detour pathway in yeast and
      supporting a broader eukaryotic framework for dolichol biosynthesis.
module:
  id: dolichyl_phosphate_biosynthesis
  label: Dolichol / dolichyl-phosphate biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
