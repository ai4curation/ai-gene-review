                  label: lipid droplet
            role_description: >-
              Third step of the polyprenol-to-dolichol detour. The same DHRSX protein acts as an NAD+-dependent dehydrogenase in step 2 and an NADPH-dependent reductase here, in two steps that are not consecutive.
    - order: 5
      role: dolichol phosphorylation -> Dol-P
      node:
