            function:
              preferred_term: dehydrodolichyl diphosphate synthase activity (cis-prenyltransferase)
              term:
                id: GO:0045547
                label: ditrans,polycis-polyprenyl diphosphate synthase [(2E,6E)-farnesyl diphosphate specific] activity
              substrates:
                - preferred_term: (2E,6E)-farnesyl diphosphate (FPP)
                - preferred_term: isopentenyl diphosphate (IPP; multiple, Mg2+)
