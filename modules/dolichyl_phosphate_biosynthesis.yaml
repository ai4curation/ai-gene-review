      term:
        id: GO:0043048
        label: dolichyl monophosphate biosynthetic process
      description: Synthesis of dolichyl phosphate (Dol-P), the glycan carrier lipid.
    - preferred_term: polyprenol biosynthetic process
      term:
        id: GO:0016094
        label: polyprenol biosynthetic process
      description: cis-prenyltransferase + reductase build the long-chain polyprenol/dolichol backbone.
    - preferred_term: dolichol-linked oligosaccharide biosynthetic process
