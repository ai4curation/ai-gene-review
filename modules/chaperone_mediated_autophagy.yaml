id: MODULE:chaperone_mediated_autophagy
title: Chaperone-mediated autophagy (HSPA8 substrate delivery and LAMP-2A translocation)
description: >-
  Chaperone-mediated autophagy (CMA) is a selective lysosomal degradation pathway for soluble
  cytosolic proteins that carry a KFERQ-like pentapeptide motif. The constitutive Hsp70 chaperone
  HSPA8/Hsc70 recognizes the motif in the cytosol and delivers the substrate to the cytosolic side of
  the lysosomal membrane, where it binds monomeric LAMP-2A, the CMA-specific splice isoform of LAMP2.
  Substrate binding drives LAMP-2A multimerization into a high-molecular-weight translocation
  complex, the unfolded substrate crosses the membrane, and it is degraded by lumenal hydrolases;
  HSPA8 then disassembles the LAMP-2A complex, returning LAMP-2A to its monomeric, substrate-binding
  state. The module covers substrate recognition and delivery, translocation through the LAMP-2A
  complex, and complex recycling. Regulation of CMA (for example lysosomal mTORC2/PHLPP1/AKT
  signalling or cathepsin A-mediated LAMP-2A turnover), the cochaperones that assist HSPA8 at the
  membrane, and the downstream consequences of degrading particular substrates (NLRP3, BBC3/PUMA,
  GPX4) are outside the boundary.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: PMID:2799391
    title: A role for a 70-kilodalton heat shock protein in lysosomal degradation of intracellular
      proteins.
    statement: An Hsp70-family protein binds the lysosomal targeting peptide regions and enhances
      lysosomal proteolysis.
    supporting_text: >-
      A 73-kilodalton (kD) intracellular protein was found to bind to peptide regions that target
      intracellular proteins for lysosomal degradation in response to serum withdrawal.
  - source_id: PMID:18644871
    title: The chaperone-mediated autophagy receptor organizes in dynamic protein complexes at the
      lysosomal membrane.
    statement: Substrates bind monomeric LAMP-2A, and translocation requires a high-molecular-weight
      LAMP-2A complex whose disassembly depends on hsc70.
    supporting_text: >-
      Substrate proteins only bind to monomeric LAMP-2A, while the efficient translocation of
      substrates requires the formation of a particular high-molecular-weight LAMP-2A complex.
notes: >-
  Built as the decomposition target for the precomposed GO:0061740 "protein targeting to lysosome
  involved in chaperone-mediated autophagy" (projects/INVOLVED_IN_PRECOMPOSITION.md): the delivery
  step is GO:0006622 protein targeting to lysosome as part of GO:0061684 chaperone-mediated autophagy.
  Human proteins are representative members (HSPA8 P11142, reviewed in genes/human/HSPA8; LAMP2
  P13473, isoform LAMP-2A P13473-1 per UniProt, no gene review yet). The HSPA8 annoton function,
  protein-macromolecule adaptor activity, matches both the HSPA8 core function and the HSPA8 activity
  in production GO-CAM gomodel:63c0ac2b00001252. That model types the LAMP2 activity as signaling
  adaptor activity (GO:0035591), which describes a signal relay rather than substrate binding and
  translocation. The cited data show LAMP-2A binds the substrate and that its multimerization is
  required for translocation, but not whether LAMP-2A itself forms the conduit. Neither
  transmembrane protein transporter activity (the conduit claim) nor cargo receptor activity
  (defined for delivery to transport vesicles) is established, so the LAMP-2A function carries
  no GO id, only a preferred term. No PANTHER family ids are asserted.
