                  term:
                    id: UniProtKB:P13647
                    label: Keratin, type II cytoskeletal 5
              function:
                preferred_term: structural constituent of cytoskeleton
                term:
                  id: GO:0005200
                  label: structural constituent of cytoskeleton
          evidence:
            - source_id: PMID:22705788
              title: Structural basis for heteromeric assembly and perinuclear organization of keratin filaments.
              statement: K5 and K14 are the pair of epidermal progenitor (basal) keratinocytes.
              supporting_text: >-
                keratins 5 and 14 (K5 and K14), expressed in progenitor
                keratinocytes of epidermis
        - id: k1_k10_suprabasal_epidermis
          label: K1/K10 (suprabasal epidermis)
          module_type: PROTEIN_COMPLEX
          annotons:
            - id: krt10_type_i
