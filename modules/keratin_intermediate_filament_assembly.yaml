knowledge_gaps:
  - gap_statement: >-
      The type II keratin that pairs with keratin 9 in suprabasal palmoplantar
      epidermis in vivo is not known.
    boundary: >-
      K9 is a type I keratin and needs a type II partner to form filaments.
      Keratin 1 has long been assumed to be the partner because it is
      co-expressed, but K1 amount and distribution are unchanged in the
      footpads of Krt9-knockout mice, where K5 is reduced. A
      co-immunoprecipitation and proteomics study proposed keratin 6C. No
      study has shown which heterodimer K9 forms in the tissue.
    gap_kind:
      - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      Without the partner, the palmoplantar variant of this module cannot be
      completed, and the dominant-negative mechanism of KRT9 mutations in
      epidermolytic palmoplantar keratoderma cannot be assigned to a defined
      heterodimer.
    resolution: >-
      Identify the endogenous K9-containing heterodimer in palmoplantar
      epidermis, for example by cross-linking mass spectrometry or
      immunoprecipitation from human palm or sole tissue and mouse footpad,
      and test candidate partners (K1, K2, K5, K6C) by loss of function for
      loss of K9 filaments.
    provenance:
      - reference_id: PMID:23962810
        supporting_text: >-
          As no change in the quantity or distribution of K1 was observed in
          Krt9−/− footpads, K9 may not interact with K1 here.
        reference_section_type: DISCUSSION
      - reference_id: PMID:23962810
        supporting_text: >-
          suggesting that K5 may be the type II keratin-binding partner of K9
          in the palmoplantar/footpad epidermis
        reference_section_type: DISCUSSION
      - reference_id: PMID:37467889
        supporting_text: >-
          we proved that keratin 6C (KRT6C) is a probable hereterodimer
          partner for KRT9
        reference_section_type: ABSTRACT
  - gap_statement: >-
      Whether keratin filament assembly in cells follows a strict sequence of
      dimer, tetramer, unit-length filament and filament, or whether lateral
      and end-to-end associations proceed in parallel, is not settled, and
      there is no atomic structure of an assembled keratin filament.
    boundary: >-
      Heterodimers and tetramers are established as stable intermediates, and
      crystal structures exist for coil 1B and coil 2B fragments of two
      keratin pairs. The order of the later steps is inferred mainly from in
      vitro assembly, and intermediate filaments are structurally
      polymorphic.
    gap_kind:
      - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      The ordered steps of this module are the standard in vitro model. If
      associations occur in parallel in cells, the PRECEDES connections
      between the later steps are a simplification.
    resolution: >-
      Time-resolved structural analysis of assembly with full-length keratin
      pairs, and cryo-electron microscopy or tomography of native keratin
      filaments at a resolution that shows tetramer packing.
    provenance:
      - reference_id: PMID:1694855
        supporting_text: >-
          there may not be a serial sequence of events leading to the
          assembly of keratin intermediate filaments, but rather a number of
          associations may take place in parallel
        reference_section_type: ABSTRACT
