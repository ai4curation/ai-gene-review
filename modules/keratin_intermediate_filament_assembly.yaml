id: MODULE:keratin_intermediate_filament_assembly
title: Keratin intermediate filament assembly (type I/type II heterodimer to 10 nm filament) module
description: >-
  Keratin intermediate filaments are obligate heteropolymers of two sequence
  classes: acidic type I keratins and basic or neutral type II keratins. One
  type I chain and one type II chain align their central alpha-helical rod
  domains in parallel and in register to form a coiled-coil heterodimer. Two
  heterodimers associate laterally, antiparallel and staggered, into an apolar
  tetramer. Tetramers associate laterally into short, full-width unit-length
  filaments, which anneal end to end and compact radially into the mature
  10 nm filament. No nucleotide or other cofactor is consumed, and the
  filament has no structural polarity. The rod domains drive dimer and
  tetramer formation, while the non-helical head and tail domains are needed
  for assembly beyond the tetramer. Any type I keratin can copolymerise with
  any type II keratin in vitro, so the pair found in a given cell is set
  mainly by which genes are co-expressed: keratin 5 with keratin 14 in basal
  keratinocytes, keratin 1 with keratin 10 in suprabasal epidermis, and
  keratin 8 with keratin 18 in simple epithelia. Missense mutations at the
  ends of the rod domain act as dominant negatives on assembly and cause
  cell-fragility disorders such as epidermolysis bullosa simplex and the
  epidermolytic keratodermas. Bundling of filaments into tonofilaments and
  their anchorage at desmosomes and hemidesmosomes by plakins are neighbouring
  mechanisms and are not parts of this module.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: Reactome:R-HSA-6805546
    title: Keratin type I binds keratin type II
    statement: >-
      Reactome's keratinization pathway starts with the type I/type II
      heterodimer; this reaction defines the first step and the two subunit
      roles of the module.
    supporting_text: >-
      The first step in keratin assembly is the formation of coiled-coil
      heterodimers consisting of an acidic type I keratin and a basic or
      neutral type II keratin
  - source_id: PMID:1694855
    title: Elucidating the early stages of keratin filament assembly.
    statement: >-
      Biochemical analysis of recombinant human K5 and K14 identified the
      heterodimer and the heterotetramer as the stable assembly intermediates.
    supporting_text: >-
      Gel filtration chromatography and chemical cross-linking were used to
      identify heterodimers and heterotetramers as the most stable building
      blocks of keratin filament assembly.
  - source_id: PMID:22705788
    title: Structural basis for heteromeric assembly and perinuclear organization of keratin filaments.
    statement: >-
      The K5/K14 coil 2B crystal structure (PDB 3TNU) gives the atomic basis
      of heteromeric pairing; the paper states the obligate heteropolymer
      character of keratin filaments.
    supporting_text: >-
      keratin intermediate filaments, which are obligate heteropolymers
      providing vital mechanical support in epithelia
  - source_id: PMID:27803112
    title: "Intermediate Filaments: Structure and Assembly."
    statement: >-
      Review of intermediate filament structure and assembly; the coiled-coil
      dimer is the common building block of all intermediate filaments.
    supporting_text: >-
      All IF proteins show a distinctly organized, extended α-helical
      conformation prone to form two-stranded coiled coils, which are the
      basic building blocks of these highly flexible, stress-resistant
      cytoskeletal filaments.
  - source_id: PMID:29610398
    title: Types I and II Keratin Intermediate Filaments.
    statement: >-
      Review of the keratin gene family; keratins are expressed as type I/type
      II pairs that depend on tissue and differentiation state.
    supporting_text: >-
      They are encoded by 54 evolutionarily conserved genes (28 type I, 26
      type II) and regulated in a pairwise and tissue type-,
      differentiation-, and context-dependent manner.
notes: >-
  Boundary. The module is the self-assembly pathway from soluble type I and
  type II keratin chains to the 10 nm filament. It has two subunit roles and
  four ordered assembly steps. The following are named neighbours and are
  deliberately outside it. (1) Tonofilament bundling (Reactome
  R-HSA-6806629), which organises finished filaments and in epidermis
  involves filaggrin. (2) Anchorage of filaments to desmosomes and
  hemidesmosomes by plakins such as desmoplakin and plectin (Reactome
  R-HSA-6809393). No desmosome or hemidesmosome module exists in modules/
  yet; when one is written it should take keratin filaments as its input and
  not be folded into this module. (3) Hair keratin-associated proteins and
  the disulfide cross-linking of hard keratins. (4) Regulation of the soluble
  pool by phosphorylation, 14-3-3 proteins and chaperones. (5) Assembly of
  type III, IV and V intermediate filaments. Vimentin, desmin and lamins
  follow the same dimer-to-tetramer logic but can form homopolymers, so the
  obligate type I/type II pairing that defines this module does not apply to
  them.

  Tissue pairs are variants, not modules. The mechanism is the same for every
  keratin pair. The pairs listed under the variant set are orienting
  examples of which type I and type II chains fill the two roles in a given
  epithelium. They are not exhaustive.

  Keratin 9. KRT9 (UniProtKB:P35527) fills the type I role in suprabasal
  palmoplantar epidermis. Its type II partner in vivo is not established, so
  the palmoplantar variant has a single grounded annoton and the partner is
  recorded as a knowledge gap. Reactome R-HSA-6805546 lists K1/K9 and K2/K9
  among interchangeable pairs, which reflects the co-expression assumption
  and not a direct demonstration.

  GO terms (all checked against QuickGO, 2026-11-26). The module process is
  GO:0045107 intermediate filament polymerization and its product is
  GO:0045095 keratin filament. Most keratin rows in GOA and PAINT use the
  broader GO:0045109 intermediate filament organization, whose definition
  (spatial distribution, meshworks, bundles) fits the bundling neighbour
  better than polymerization; GO:0045107 is not a descendant of GO:0045109.
  There is no GO complex term for the keratin heterodimer or tetramer. The
  subunit activity is GO:0005200 structural constituent of cytoskeleton at
  the family level. The epidermal variants use GO:0030280 structural
  constituent of skin epidermis where the gene carries it (KRT1 and KRT10 by
  IDA; the KRT9 gene review has it as the core function). GO:0030280 and
  GO:0005200 are siblings under GO:0005198, so neither entails the other.

  Family grounding. Type I keratins are in PANTHER:PTHR23239. Its official
  name is INTERMEDIATE FILAMENT, but the family review in
  interpro/panther/PTHR23239/ shows it holds the type I keratins plus
  phakinin (BFSP2), which is not a keratin and does not take part in this
  module. Type II keratins are in PANTHER:PTHR45616. Its official name, GATA-TYPE
  DOMAIN-CONTAINING PROTEIN, is misleading; the id was taken from the UniProt
  PANTHER cross-references of KRT5 (P13647), KRT1 (P04264) and KRT8 (P05787)
  and its subfamilies in interpro/panther/panther.obo are type II keratins.
  No PAINT ancestral node is asserted: the local PTHR23239 PAINT rows place
  keratin filament and intermediate filament organization, not a molecular
  function for the subunit role, and no PTHR45616 PAINT data is cached.

  GO-CAM. gocams/index.tsv has KRT14 (gomodel:69c59f8a00002811) and KRT15
  (gomodel:69c59f8a00001359) as structural constituents of cytoskeleton in
  two Hippo/YAP1 regulation models. Neither model represents filament
  assembly, so no gocam_associations are pinned. KRT9 is in no GO-CAM.

  Gene reviews. Of the concrete members only KRT9 has a gene review in this
  repository (genes/human/KRT9). KRT5, KRT14, KRT1, KRT10, KRT8 and KRT18
  have none yet.

  Deep research. See the history record for which module deep-research
  provider runs were attempted for this module.
module:
  id: keratin_intermediate_filament_assembly
  label: Keratin intermediate filament assembly
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: intermediate filament polymerization
      term:
        id: GO:0045107
        label: intermediate filament polymerization
      description: >-
        Assembly of type I and type II keratin chains into 10 nm filaments
        through heterodimer, tetramer and unit-length filament intermediates.
    - preferred_term: keratin filament
      term:
        id: GO:0045095
        label: keratin filament
      description: The polymer that the module produces.
  context:
    cellular_components:
      - preferred_term: cytoplasm
        term:
          id: GO:0005737
          label: cytoplasm
        description: >-
          Keratin chains are made and assembled in the cytoplasm of
          epithelial cells.
  parts:
    - order: 1
      role: type I (acidic) keratin subunit
      node:
        id: type_i_keratin_role
        label: Type I keratin subunit
        module_type: MOLECULAR_FUNCTION
        description: >-
          One of the two obligate chain types. It supplies one alpha-helical
          rod to each heterodimer. Human type I keratins are K9 to K28 and the
          hair keratins K31 to K40.
        annotons:
          - id: type_i_keratin_subunit
            label: Type I keratin as filament subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: type I (acidic) keratins
                term:
                  id: PANTHER:PTHR23239
                  label: INTERMEDIATE FILAMENT
                description: >-
                  The family also contains phakinin (BFSP2), a lens beaded
                  filament protein that is not a keratin and is not covered
                  by this role.
                representative_members:
                  - preferred_term: KRT14 (human keratin 14)
                    term:
                      id: UniProtKB:P02533
                      label: Keratin, type I cytoskeletal 14
                  - preferred_term: KRT10 (human keratin 10)
                    term:
                      id: UniProtKB:P13645
                      label: Keratin, type I cytoskeletal 10
                  - preferred_term: KRT18 (human keratin 18)
                    term:
                      id: UniProtKB:P05783
                      label: Keratin, type I cytoskeletal 18
            function:
              preferred_term: structural constituent of cytoskeleton
              term:
                id: GO:0005200
                label: structural constituent of cytoskeleton
            locations:
              - preferred_term: keratin filament
                term:
                  id: GO:0045095
                  label: keratin filament
            role_description: >-
              Pairs through its rod domain with a type II keratin; cannot
              form filaments on its own.
            evidence:
              - source_id: PMID:1691189
                title: "The coiled coil of in vitro assembled keratin filaments is a heterodimer of type I and II keratins: use of site-specific mutagenesis and recombinant protein expression."
                statement: >-
                  Cystine-locked K8 or K18 homodimers only aggregate, whereas
                  the K8/K18 heterodimer assembles into normal filaments, so
                  the two chain types are both required at the dimer level.
                supporting_text: >-
                  Thus, the obligatory heteropolymer step in keratin IF
                  assembly seems to occur preferentially at the dimer level
                  and not during tetramer formation.
    - order: 2
      role: type II (basic or neutral) keratin subunit
      node:
        id: type_ii_keratin_role
        label: Type II keratin subunit
        module_type: MOLECULAR_FUNCTION
        description: >-
          The second obligate chain type. It supplies the other rod of each
          heterodimer. Human type II keratins are K1 to K8, K71 to K80 and the
          hair keratins K81 to K86.
        annotons:
          - id: type_ii_keratin_subunit
            label: Type II keratin as filament subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: type II (basic or neutral) keratins
                term:
                  id: PANTHER:PTHR45616
                  label: GATA-TYPE DOMAIN-CONTAINING PROTEIN
                description: >-
                  PANTHER's family name is misleading. The id comes from the
                  UniProt PANTHER cross-references of the representative
                  members below.
                representative_members:
                  - preferred_term: KRT5 (human keratin 5)
                    term:
                      id: UniProtKB:P13647
                      label: Keratin, type II cytoskeletal 5
                  - preferred_term: KRT1 (human keratin 1)
                    term:
                      id: UniProtKB:P04264
                      label: Keratin, type II cytoskeletal 1
                  - preferred_term: KRT8 (human keratin 8)
                    term:
                      id: UniProtKB:P05787
                      label: Keratin, type II cytoskeletal 8
            function:
              preferred_term: structural constituent of cytoskeleton
              term:
                id: GO:0005200
                label: structural constituent of cytoskeleton
            locations:
              - preferred_term: keratin filament
                term:
                  id: GO:0045095
                  label: keratin filament
            role_description: >-
              Pairs through its rod domain with a type I keratin; cannot form
              filaments on its own.
            evidence:
              - source_id: Reactome:R-HSA-6805546
                title: Keratin type I binds keratin type II
                statement: >-
                  Lists the human type II keratins and states that pairing
                  with a type I chain is promiscuous in vitro.
                supporting_text: >-
                  In vitro, virtually any type I keratin can dimerize with
                  any type II keratin
    - order: 3
      role: heterodimer formation
      node:
        id: heterodimer_formation
        label: Parallel coiled-coil type I/type II heterodimer
        module_type: PROTEIN_COMPLEX
        description: >-
          One type I and one type II chain wind their rod domains into a
          left-handed coiled coil, parallel and in register. The heterodimer
          is far more stable than either homodimer and persists in
          concentrated urea. The rod alone is sufficient for this step.
        evidence:
          - source_id: PMID:22705788
            title: Structural basis for heteromeric assembly and perinuclear organization of keratin filaments.
            statement: Crystal structure of the K5/K14 coil 2B heterodimer (PDB 3TNU).
            supporting_text: >-
              The structure of the 2B domain of K5–K14 reveals a typical
              left-handed coiled-coil dimer, with the two α-helices oriented
              in parallel and in register
          - source_id: PMID:27595935
            title: The X-Ray Crystal Structure of the Keratin 1-Keratin 10 Helix 2B Heterodimer Reveals Molecular Surface Properties and Biochemical Insights into Human Skin Disease.
            statement: >-
              Crystal structure of the K1/K10 coil 2B heterodimer (PDB 4ZRY)
              shows the same parallel coiled-coil arrangement for a second
              keratin pair.
            supporting_text: >-
              It demonstrates a parallel, coiled-coil heterodimer with a
              predominantly hydrophobic intermolecular interface
          - source_id: PMID:1694855
            title: Elucidating the early stages of keratin filament assembly.
            statement: K5 and K14 stay associated 1:1 under strongly denaturing conditions.
            supporting_text: >-
              these keratins behave as 1:1 complexes even in 9 M urea and in
              the presence of a reducing agent
    - order: 4
      role: tetramer formation
      node:
        id: tetramer_formation
        label: Antiparallel, staggered tetramer of two heterodimers
        module_type: PROTEIN_COMPLEX
        description: >-
          Two heterodimers associate side by side in antiparallel
          orientation, staggered so that their coil 1B segments overlap (the
          A11 alignment). The tetramer therefore has no polarity. It is the
          soluble assembly unit in vitro and in cells. In the K1/K10 1B
          tetramer structure (PDB 6EC0) a hydrophobic knob on one dimer
          docks into a pocket on the other.
        evidence:
          - source_id: Reactome:R-HSA-6805573
            title: Keratin type I/type II heterodimers form tetramers
            statement: Reactome reaction for the tetramer step.
            supporting_text: Keratin dimers associate in antiparallel orientation to form tetramers
          - source_id: PMID:22705788
            title: Structural basis for heteromeric assembly and perinuclear organization of keratin filaments.
            statement: States the antiparallel, staggered arrangement of dimers in the tetramer.
            supporting_text: >-
              Tetramer formation ensues as coiled-coil dimers interact along
              their lateral surfaces with an antiparallel orientation and
              staggered alignment, such that their coil 1B subdomains overlap
          - source_id: PMID:31036554
            title: Human keratin 1/10-1B tetramer structures reveal a knob-pocket mechanism in intermediate filament assembly.
            statement: >-
              Crystal structure of the K1/K10 coil 1B heterotetramer; mutating
              the knob residues blocks tetramer and filament assembly.
            supporting_text: >-
              Mutation of both knob residues to alanine disrupted keratin 1B
              tetramer and full-length filament assembly.
    - order: 5
      role: unit-length filament formation
      node:
        id: unit_length_filament_formation
        label: Lateral association of tetramers into unit-length filaments
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Tetramers associate laterally into short, full-width particles
          called unit-length filaments, about 70 nm long and wider than the
          mature filament. Assembly beyond the tetramer needs the non-helical
          head and tail domains.
        evidence:
          - source_id: Reactome:R-HSA-6806613
            title: Keratin tetramers bind to form unit length filaments
            statement: Reactome reaction for the unit-length filament step.
            supporting_text: >-
              These are formed by the lateral association of tetramers. ULFs
              are ~ 70 nm long, with a diameter of ~20 nm.
          - source_id: Reactome:R-HSA-6805546
            title: Keratin type I binds keratin type II
            statement: The head and tail domains are needed for filament assembly, not for dimers or tetramers.
            supporting_text: >-
              The rod region is sufficient to form a heterodimer and
              subsequent tetramers, but the assembly of keratin filaments
              requires the non-helical head and tail regions
    - order: 6
      role: filament elongation and compaction
      node:
        id: filament_elongation_compaction
        label: End-to-end annealing and radial compaction into the 10 nm filament
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Unit-length filaments and short filaments anneal end to end, and
          the filament narrows to its mature diameter of about 10 nm. The
          product is the keratin filament, which neighbouring mechanisms then
          bundle and anchor.
        concepts:
          - preferred_term: intermediate filament polymerization
            term:
              id: GO:0045107
              label: intermediate filament polymerization
        evidence:
          - source_id: Reactome:R-HSA-6806610
            title: Keratin filament formation
            statement: Reactome reaction for filament formation from smaller subunits.
            supporting_text: >-
              Mammalian keratin filaments are produced by the lateral and
              longitudinal aggregation of subunits
          - source_id: Reactome:R-HSA-6806613
            title: Keratin tetramers bind to form unit length filaments
            statement: The diameter decreases as unit-length filaments mature into filaments.
            supporting_text: The diameter shrinks during formation of filaments
  variant_sets:
    - id: keratin_pair_by_epithelial_context
