id: MODULE:dmel_mitochondrial_degradosome
title: Mitochondrial degradosome in Drosophila melanogaster
description: >-
  The mitochondrial degradosome degrades mitochondrial RNA in the matrix. It is formed by
  the ATP-dependent RNA helicase Suv3, which unwinds structured RNA, and the exoribonuclease
  PNPase, which degrades RNA 3' to 5' by phosphorolysis. The complex turns over mRNAs and
  removes non-coding and antisense transcripts produced by the bidirectional transcription
  of the mitochondrial genome.
