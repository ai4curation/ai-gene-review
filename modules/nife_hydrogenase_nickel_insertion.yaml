id: MODULE:nife_hydrogenase_nickel_insertion
title: SlyD-assisted nickel insertion for E. coli NiFe hydrogenases
description: >-
  A nickel-metallocenter maturation submodule in which the cytosolic
  metallochaperone SlyD binds nickel through its histidine/cysteine-rich tail,
  stimulates nickel release from HypB, and supports nickel insertion into NiFe
  hydrogenase large subunits. SlyD's FKBP peptidyl-prolyl isomerase activity and
  general IF-domain holdase activity are real but separable from this
  hydrogenase nickel-insertion role.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0170061
    title: nickel chaperone activity
    statement: Defines the SlyD nickel-chaperone function.
  - source_id: GO:0051604
    title: protein maturation
    statement: Defines the hydrogenase large-subunit maturation process served by SlyD.
  - source_id: file:genes/ECOLI/SlyD/SlyD-ai-review.yaml
    title: ECOLI SlyD gene review
    statement: >-
      The completed E. coli SlyD review separates SlyD's nickel-chaperone,
      PPIase, and general holdase activities.
  - source_id: PMID:15569666
    title: A role for SlyD in the Escherichia coli hydrogenase biosynthetic pathway.
    statement: Establishes SlyD involvement in hydrogenase maturation.
  - source_id: PMID:17426034
    title: >-
      The role of complex formation between the Escherichia coli hydrogenase
      accessory factors HypB and SlyD.
    statement: >-
      Shows that SlyD stimulates nickel release from HypB and that the SlyD
      metal-binding tail is required for hydrogenase function in vivo.
  - source_id: PMID:17720786
    title: >-
      The peptidyl-prolyl isomerase activity of SlyD is not required for
      maturation of Escherichia coli hydrogenase.
    statement: >-
      Separates SlyD's PPIase activity from its hydrogenase-maturation function.
notes: >-
  HypB and the hydrogenase large subunits are represented as biochemical
  partners but not as curated active units until their ECOLI reviews are
  available.
