id: MODULE:golgi_calcium_manganese_pump
title: Golgi calcium and manganese pumping — secretory pathway Ca2+/Mn2+-ATPases SPCA1 (ATP2C1) and SPCA2 (ATP2C2) loading the Golgi lumen with Ca2+ and Mn2+ (human)
description: >-
  The secretory pathway Ca2+/Mn2+-ATPases (SPCAs) are P-type ATPases of the Golgi
  apparatus that use ATP hydrolysis to pump calcium and manganese ions from the cytosol
  into the Golgi lumen. Unlike the ER SERCA pumps they are insensitive to thapsigargin and
  transport Mn2+ with high affinity, a property that supplies the Mn2+ needed by luminal
  glycosyltransferases and other Mn2+-dependent enzymes and that protects cells against
  manganese toxicity by routing Mn2+ into the secretory pathway for export. Golgi calcium
  supports protein sorting, processing and glycosylation and contributes a separate,
  thapsigargin-resistant calcium store. Humans have two paralogs. SPCA1 (ATP2C1) is
  ubiquitous, sits mainly in the trans-Golgi, and is the dominant Golgi pump in most cells;
  heterozygous loss of ATP2C1 causes Hailey-Hailey disease, a blistering skin disorder in
  which keratinocyte Golgi calcium stores refill poorly. SPCA2 (ATP2C2) is restricted to
  secretory epithelia (gastrointestinal and respiratory tract, mammary gland), brain and
  testis, where it is found in Golgi and post-Golgi vesicles. In lactating mammary
  epithelium and breast cancer cells SPCA2 also reaches the plasma membrane, where it
  activates the ORAI1 channel independently of its pump activity.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001139
    title: calcium transport pathway
    statement: >-
      RGD Pathway Ontology record for the calcium transport pathway (55 human genes curated
      by RGD). Its text describes the Golgi SPCA pumps ATP2C1 and ATP2C2 as Ca2+ pumps that
      also transport Mn2+, and the diagram links Atp2c1 and Atp2c2. This module models that
      Golgi pump system only; the record's other transport systems are separate modules or
      unmodelled (see notes). Human genes in scope from RGD's list: ATP2C1 ATP2C2. Derived
      through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001139.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: >-
      The RGD record text gives the scope of the module: the two Golgi SPCA pumps and their
      Mn2+ transport, linked to luminal Mn2+-requiring enzymes.
    supporting_text: >-
      Other pumps are represented by the Golgi ATPases (SPCA, ATP2C1 and 2) which also
      transport Mn2+, a feature that probably relates to the Mn2+ requiring enzymes in the
      lumen of Golgi, such as the glycosyltransferases.
  - source_id: GO:0006816
    title: calcium ion transport
    statement: >-
      The GO process mapped to PW:0001139 (skos:closeMatch) in the project's PW-GO mappings
      (projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is too broad for this
      module, whose calcium concept is its descendant GO:0061856 Golgi calcium ion
      transmembrane transport (is_a GO:0032472 is_a GO:0006816), checked in go-basic
      2026-07-26.
  - source_id: GO:0061856
    title: Golgi calcium ion transmembrane transport
    statement: >-
      Module concept for the calcium half. GOA has its parent GO:0032472 Golgi calcium ion
      transport for ATP2C1 by IMP (PMID:14632183); the child is used here because the pumps
      move calcium across the Golgi membrane.
  - source_id: GO:0071421
    title: manganese ion transmembrane transport
    statement: >-
      Module concept for the manganese half. GO has no Golgi-specific manganese transport
      term; one is requested in proposed_new_terms.
  - source_id: PMID:11741891
    title: Functional expression in yeast of the human secretory pathway Ca(2+), Mn(2+)-ATPase defective in Hailey-Hailey disease.
    statement: High-affinity Mn2+ transport distinguishes the SPCA pumps from SERCA and PMCA pumps.
    supporting_text: suggesting that high affinity Mn(2+) transport is a unique feature of the secretory pathway Ca(2+)-ATPases
  - source_id: PMID:15831496
    title: The secretory pathway Ca2+/Mn2+-ATPase 2 is a Golgi-localized pump with high affinity for Ca2+ ions.
    statement: SPCA2 transports both Ca2+ and Mn2+.
    supporting_text: We confirmed that hSPCA2 has the ability to transport Ca(2+), demonstrated its Mn(2+)-transporting activity
  - source_id: PMID:20887894
    title: Store-independent activation of Orai1 by SPCA2 in mammary tumors.
    statement: >-
      Boundary evidence (context, not a part): plasma-membrane SPCA2 activates ORAI1
      independently of ER stores, STIM and its own ATPase activity (see notes 5).
    supporting_text: SPCA2-Orai1 signaling was independent of ER Ca(2+) stores or STIM1 and STIM2 sensors and uncoupled from Ca(2+)-ATPase activity of SPCA2
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001139 (calcium transport pathway) through
  the RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml,
  mapped GO:0006816 calcium ion transport). RGD curates 55 human genes to PW:0001139, mixing
  unrelated channel, pump and exchanger families, so the project models the record as one
  human module per transport system. This module is the Golgi pump system. Sibling modules
  from the same record: store_operated_calcium_entry, plasma_membrane_calcium_extrusion,
  er_calcium_store_cycling, mitochondrial_calcium_uniporter, and
  endolysosomal_calcium_release (drafted in parallel with this one). PW:0001139 is the only
  PW evidence source_id; its sub-pathway PW:0001140 (calcium/calcium-mediated signaling) is
  mentioned here in prose only.


  (1) STRUCTURE. The root is a ONE_OR_MORE REALIZER variant set of the two paralogs, each a
  transport step with two annotons, one for Ca2+ and one for Mn2+, because GO types the
  two reactions as separate activities (GO:0005388 and GO:0140613) and both are assayed
  for both paralogs. The two ions compete for the same transport site in one pump cycle,
  so the annotons are alternative substrates of one activity, not ordered steps; there are
  no connections. The module is deliberately short: there are no regulatory subunits or
  partner proteins with experimental support for the pumping activity.


  (2) SUBSTRATES AND PRODUCTS. Grounded to ChEBI with labels checked in OLS (November
  2026): calcium(2+) CHEBI:29108, manganese(2+) CHEBI:29035, ATP(4-) CHEBI:30616, ADP(3-)
  CHEBI:456216, hydrogenphosphate CHEBI:43474, water CHEBI:15377, hydron CHEBI:15378.
  Compartments are given in preferred_term (cytosol, Golgi lumen). The calcium reaction
  follows the GO:0005388 definition (RHEA:18105, no proton); the manganese reaction
  follows the GO:0140613 definition and RHEA:66820 (Mn2+(in) + ATP + H2O = Mn2+(out) + ADP
  + phosphate + H+), checked in Rhea. Proton counter-transport by SPCAs is not modelled.


  (3) MOLECULAR FUNCTIONS AND PROCESSES. From GOA (QuickGO, November 2026), checked in
  go-basic 2026-07-26. ATP2C1: GO:0005388 P-type calcium transporter activity EXP
  (PMID:16192278, PMID:30923126), IDA (PMID:12810057), IMP (PMID:10615129); GO:0140613
  P-type manganese transporter activity IDA (PMID:21187401). ATP2C2: GO:0005388 EXP
  (PMID:16332677, PMID:30923126), IDA (PMID:15677451, PMID:15831496); GO:0140613 EXP
  (PMID:30923126), IDA (PMID:15831496). Processes authored: GO:0061856 Golgi calcium ion
  transmembrane transport (GOA has the parent GO:0032472 and GO:0032468 Golgi calcium ion
  homeostasis for ATP2C1 by IMP) and GO:0071421 manganese ion transmembrane transport (no
  experimental GOA row for either paralog). The pump performs the transport, so the
  process describes work the gene product does. ATP2C1 phenotype rows (epidermis
  development, calcium-dependent cell-cell adhesion, actin cytoskeleton organization,
  trans-Golgi network membrane organization, NF-kappaB signalling) are downstream
  consequences of Golgi calcium loss in Hailey-Hailey keratinocytes and are not used.


  (4) LOCATIONS (organelle policy, projects/ORGANELLES.md). Golgi apparatus is a root
  organelle term; the module does not use it but the sub-compartment Golgi membrane on
  every annoton. Both proteins are multi-pass P-type pumps, so the membrane is not in
  question. ATP2C1: Golgi membrane IDA (PMID:12804581, PMID:21187401), Golgi apparatus IDA
  (PMID:11741891, HPA) and trans-Golgi network IDA (PMID:14632183). ATP2C2: Golgi
  membrane only by IBA and Reactome TAS, and the only experimental location row is plasma
  membrane (PMID:20887894); the Golgi membrane location is authored on two lines, its
  multi-pass P-type topology and Golgi-like juxtanuclear immunostaining of endogenous
  SPCA2 in human colon (PMID:15831496), with endogenous neuronal SPCA2 on trans-Golgi
  network-derived vesicles (PMID:15677451). The trans-Golgi network child is not added
  beside Golgi membrane, to avoid a sub-compartment claim resting on one paper per gene.


  (5) BOUNDARY: SPCA2-ORAI1 STORE-INDEPENDENT CALCIUM ENTRY IS CONTEXT. In breast cancer
  cells and lactating mammary epithelium SPCA2 reaches the plasma membrane and binds and
  activates ORAI1, producing constitutive calcium influx independent of ER stores, of STIM1
  and STIM2, and of SPCA2's own ATPase activity (PMID:20887894; GOA plasma membrane EXP).
  This is a different system from Golgi pumping (a channel-activating scaffold role at the
  plasma membrane, not transport by SPCA2) and it is not modelled as a part. ORAI1 and its
  store-operated gating by STIM are modelled in modules/store_operated_calcium_entry.yaml,
  which could take SPCA2 as a store-independent ORAI1 activator in a later revision; such
  an annoton would need a calcium channel regulator function that no experimental GOA row
  for ATP2C2 currently provides. Also context: SERCA pumps, which load part of the Golgi
  (the thapsigargin-sensitive cis-Golgi pool) and are modelled in er_calcium_store_cycling;
  Golgi calcium release (IP3 receptors in Golgi membranes; GO:0061454) and Golgi luminal
  calcium-binding proteins (Cab45, nucleobindin), which are not on RGD's list; TMEM165,
  a Golgi Mn2+/Ca2+ transporter of a different family that also supplies Golgi Mn2+ for
  glycosylation, not on RGD's list and not modelled here; and the dependent glycosylation
  and sorting reactions.


  (6) GO-CAM LINKS. No production GO-CAM in gocams/index.tsv (any species) contains ATP2C1
  or ATP2C2, so there are no gocam_associations. The seed's best_gocam
  (gomodel:65d7e4ac00002121) is unrelated.


  (7) OTHER PW:0001139 GENES NOT MODELLED HERE. They are in the sibling modules listed above
  or unmodelled, by symbol: voltage-gated CACNA1A-S and CACNB1-4, cyclic nucleotide-gated
  CNGA1-4, CNGB1, CNGB3, TRPV5, TRPV6.


  (8) GROUNDING. UniProt accessions from UniProt REST (reviewed human entries); neither
  gene has a gene review, which is curation follow-up for the project plan. GO ids and
  labels checked against go-basic 2026-07-26; none obsolete. No PANTHER or PTN ids are
  asserted: both participants are concrete human gene products.
proposed_new_terms:
  - proposed_name: Golgi manganese ion transmembrane transport
    proposed_definition: >-
      A process in which a manganese ion is transported from one side of a Golgi membrane to
      the other by means of some agent such as a transporter or pore.
    justification: >-
      GO has Golgi calcium ion transmembrane transport (GO:0061856) and mitochondrial
      manganese ion transmembrane transport (GO:1990540), but no Golgi counterpart for
      manganese, although Mn2+ loading of the Golgi lumen by the SPCA pumps is well
      characterized and supplies luminal Mn2+-dependent glycosyltransferases. The new term
      would replace GO:0071421 as this module's manganese concept and on the four Mn2+
      annotons.
    proposed_parent:
      id: GO:0071421
      label: manganese ion transmembrane transport
    supported_by:
      - reference_id: PMID:21187401
        supporting_text: SPCA1 is a P-type pump that transports Mn(2+) from the cytosol into the Golgi
      - reference_id: PMID:15831496
        supporting_text: We confirmed that hSPCA2 has the ability to transport Ca(2+), demonstrated its Mn(2+)-transporting activity
