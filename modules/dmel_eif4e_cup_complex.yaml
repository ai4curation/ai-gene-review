id: MODULE:dmel_eif4e_cup_complex
title: eIF4E-Cup translational repressor complex in Drosophila melanogaster
description: >-
  Cup is an ovary-enriched eIF4E-binding protein that represses translation of specific maternal
  mRNAs during oogenesis. Cup binds the cap-binding factor eIF4E1 through a motif resembling
  that of eIF4G, so that eIF4E1 bound to the mRNA cap cannot recruit eIF4G and the ribosome.
  Cup is recruited to target mRNAs such as oskar and nanos by sequence-specific RNA-binding
  repressors (Bruno and Smaug), so that these mRNAs stay silent until they are localized in
  the oocyte. Cup is also required for eIF4E localization to the oocyte.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001981
  title: 'FlyBase gene group ECUP: Eif4e-cup complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as eif4e-cup complex (ECUP);
    this module models that group.
- source_id: GO:1990500
  title: eif4e-cup complex
  statement: >-
    GO term grounding the module as eif4e-cup complex.
notes: >-
  Two-subunit complex modelled one part per subunit. Bruno (aret) and Smaug (smg), which recruit
  the complex to target mRNAs, are not FlyBase members and are not modelled as parts. eIF4E1
  also acts in general cap-dependent translation initiation with eIF4G, outside this module.
  FlyBase groups realized by this module: ECUP (FBgg0001981). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_eif4e_cup_complex.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
