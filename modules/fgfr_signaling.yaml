    - order: 3
      role: FRS docking protein and GRB2 scaffold assembly
      node:
        id: frs2_grb2_scaffold
        label: FRS/GRB2 scaffold assembly
        module_type: REGULATORY_STEP
        description: >-
          The FRS docking protein is constitutively bound to the FGFR juxtamembrane region and is
          tyrosine-phosphorylated by the activated receptor. Its phosphotyrosines recruit GRB2,
          which brings SOS and GAB1 to the membrane. This constitutive FRS docking protein is what
          separates FGFR signalling from the SHC1-based adaptors used by most other RTKs.
        variant_sets:
          - id: frs_paralog_alternatives
            label: FRS docking protein paralogs
            axis: paralog
            selection: ONE_OR_MORE
            notes: >-
              FRS2 is the main, broadly expressed docking protein; FRS3 is a paralog with the same
              PTB-domain docking architecture and FGFR binding. Both carry
              FGFR binding and RTK adaptor activity annotations in GOA, so either can realize the
              step.
            variants:
              - id: frs2_variant
                label: FRS2
                module_type: REGULATORY_STEP
                annotons:
                  - id: frs2_adaptor
                    label: FRS2 docking protein
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: FRS2 orthologs
                        term:
                          id: PANTHER:PTHR21258:SF40
                          label: FIBROBLAST GROWTH FACTOR RECEPTOR SUBSTRATE 2
                        representative_members:
                          - preferred_term: FRS2
                            term:
                              id: UniProtKB:Q8WU20
                              label: Fibroblast growth factor receptor substrate 2
                    function:
                      preferred_term: transmembrane receptor protein tyrosine kinase adaptor
                        activity
                      term:
                        id: GO:0005068
                        label: transmembrane receptor protein tyrosine kinase adaptor activity
                    role_description: Membrane-anchored docking protein phosphorylated by FGFR that
                      assembles the GRB2-SOS and GRB2-GAB1 complexes.
                    evidence:
                      - source_id: file:genes/human/FRS2/FRS2-ai-review.yaml
                        statement: 'FRS2 review: core functions RTK adaptor activity (GO:0005068) and
                          FGFR binding (GO:0005104); the PTB domain binds the FGFR juxtamembrane region
                          without a phosphotyrosine.'
              - id: frs3_variant
                label: FRS3
                module_type: REGULATORY_STEP
                annotons:
