                              includes FGF19 among its seeds.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN000160075 in
                                  PTHR11486.
                    function:
                      preferred_term: fibroblast growth factor receptor binding
                      term:
                        id: GO:0005104
                        label: fibroblast growth factor receptor binding
                    role_description: Circulating hormone-like FGF that binds a Klotho-FGFR complex.
                    evidence:
                      - source_id: PMID:17623664
                        supporting_text: Both FGF19 and FGF21 can signal through FGFR1-3 bound by
                          betaKlotho and increase glucose uptake in adipocytes expressing FGFR1.
                      - source_id: file:genes/human/FGF19/FGF19-ai-review.yaml
                        statement: 'FGF19 review: core function FGFR binding (GO:0005104) via the beta-Klotho-FGFR4
