      description: Ligand-co-receptor engagement dimerizes and activates the receptor kinase.
    - source: fgfr_receptor_activation
      target: frs2_grb2_scaffold
      connection_type: CAUSES
      description: The activated receptor phosphorylates the FRS docking protein, recruiting GRB2.
    - source: frs2_grb2_scaffold
      target: fgfr_ras_mapk_output
      connection_type: CAUSES
      description: GRB2 brings SOS to the membrane to activate Ras.
    - source: frs2_grb2_scaffold
      target: fgfr_pi3k_output
      connection_type: CAUSES
      description: GRB2 recruits GAB1, which engages p85-PI3K.
    - source: fgfr_receptor_activation
