id: MODULE:fgfr_signaling
title: FGFR signaling pathway module
description: >-
  Secreted FGF ligands, presented by heparan sulfate (paracrine FGFs) or by alpha/beta-Klotho
  co-receptors (endocrine FGFs), activate one or more FGFR receptor tyrosine kinase paralogs. The
  activated receptor phosphorylates the FRS2-family docking protein, which recruits GRB2-SOS to
  drive Ras-MAPK signalling and GRB2-GAB1-p85 to engage PI3K, while PLC-gamma binds the receptor
  directly and hydrolyses PIP2. The kinase-less paralog-like FGFRL1 attenuates signalling by
  sequestering ligand.
status: DRAFT
evidence:
  - source_id: file:modules/fgfr_signaling-deep-research-falcon.md
    title: FGFR signaling pathway Falcon module review
    statement: >-
      Falcon/Edison module review generated 2026-06-28 is linked as supporting evidence for module boundaries,
      core mechanism, variation, constraints, and failure modes; open questions in that report require
      manual review before promotion to curated knowledge gaps.
  - source_id: GO:0008543
    title: fibroblast growth factor receptor signaling pathway
    statement: The module is grounded in the GO biological process term for fibroblast growth factor
      receptor signaling pathway.
  - source_id: PANTHER:PTN004704281
    title: PAINT node PTN004704281 for the eumetazoan FGFR clade
    statement: >-
      Local PAINT IBD node in PTHR24416 (taxon Eumetazoa) with propagated terms P:GO:0008284,
      P:GO:0008543, P:GO:0043410; the GO:0008543 row is seeded by human FGFR1-4, their rodent and
      zebrafish orthologs, Drosophila breathless (FBgn0285896) and heartless (FBgn0010389), and
      C. elegans egl-15 (WBGene00001184). PAINT date 20250904.
  - source_id: PANTHER:PTN000699279
    title: PAINT node PTN000699279 for the deuterostome FGFR clade
    statement: >-
      Local PAINT IBD node in PTHR24416 (taxon Deuterostomia) with propagated terms F:GO:0005007
      and F:GO:0017134, seeded by FGFR1, FGFR2, FGFR3 and FGFR4. PAINT date 20250904.
  - source_id: PANTHER:PTN001230349
    title: PAINT node PTN001230349 for receptor tyrosine kinases
    statement: Local PAINT IBD node in PTHR24416 with propagated terms C:GO:0005886, C:GO:0043235,
      F:GO:0004714, P:GO:0007169; PAINT date 20260529.
  - source_id: PANTHER:PTN000160075
    title: PAINT node PTN000160075 for the FGF ligand family
    statement: >-
      Local PAINT IBD node in PTHR11486 with propagated terms including F:GO:0005104, F:GO:0008083,
      P:GO:0008543 and C:GO:0005576.
  - source_id: PANTHER:PTN005273574
    title: PAINT node PTN005273574 for GRB2
    statement: Local PAINT IBD node in PTHR46037 with propagated terms C:GO:0005737, C:GO:0005886,
      C:GO:0008180, F:GO:0001784, F:GO:0005154, P:GO:0007165; PAINT date 20260530.
  - source_id: PANTHER:PTN008302071
    title: PAINT node PTN008302071 for PIK3R1
    statement: Local PAINT IBD node in PTHR10155 with propagated terms C:GO:0005943; PAINT date
      20240516.
  - source_id: PMID:16597617
    title: Receptor specificity of the fibroblast growth factor family. The complete mammalian FGF
      family.
    statement: >-
      Establishes the ligand-by-receptor-paralog (and splice-isoform) specificity matrix for the
      whole mammalian FGF family, the basis for modelling receptor paralogs as a union of
      overlapping alternatives rather than as interchangeable copies.
notes: >-
  Paralog union modelling (2026-09-30). The vertebrate FGF system is a whole-genome-duplication
  expansion: four receptor kinases (FGFR1-4), about eighteen secreted FGF ligands, two FRS docking
  proteins (FRS2, FRS3) and two SOS Ras GEFs (SOS1, SOS2), whereas protostomes carry one or two
  receptors (Drosophila breathless and heartless, C. elegans egl-15). Each step that is carried by
  a paralog group is therefore modelled as a variant set with axis "paralog" and selection
  ONE_OR_MORE: a concrete realization (a cell type, tissue, or species) uses any non-empty subset
  of the paralogs, and the module step as a whole is the union of what the paralogs do. Shared
  ancestral function is recorded once per paralog through the common PAINT nodes (PTN004704281,
  PTN000699279, PTN001230349), while lineage-specific nodes (PTN002814653 for FGFR1, PTN004704289
  for FGFR4) and paralog-specific features (IIIb/IIIc splicing in FGFR1-3 only, FGFR4 recycling
  and FGF19/beta-Klotho bile-acid signalling, FGFR1c/Klotho FGF23 signalling) are recorded on the
  individual variant. Paralogs are not assumed to be interchangeable: the union says that each
  one can realize the step, not that each can substitute for every other in every context.
  FGFRL1 (sometimes called FGFR5) shares the FGFR ectodomain architecture but sits in a different
  PANTHER family (PTHR19890) and lacks a kinase domain, so it cannot satisfy the receptor kinase
  step and is modelled as a separate optional negative-regulatory part rather than as a fifth
  receptor variant. Heparan sulfate is a glycan cofactor, not a gene product, and is recorded in
  step descriptions rather than as an annoton. Negative feedback regulators (SPRY, IL17RD/SEF,
  DUSP6, CBL) and the context-dependent JAK-STAT output are outside the current boundary.
  Falcon integration (2026-06-28): Falcon findings are linked as evidence and family-level
  support; machine-generated Falcon citations remain curation support and are not manually
  adjudicated here.
module:
  id: fgfr_signaling
  label: FGFR signaling pathway
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: fibroblast growth factor receptor signaling pathway
      term:
        id: GO:0008543
        label: fibroblast growth factor receptor signaling pathway
      description: FGF ligands with heparan sulfate or Klotho co-receptors activate FGFR receptor
        tyrosine kinase paralogs, recruiting FRS2/GRB2/SOS, PI3K, and PLCG outputs for development,
        metabolism, angiogenesis, and tissue repair.
  context:
    taxa:
      - preferred_term: metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
    cellular_components:
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
  parts:
    - order: 1
      role: ligand and co-receptor engagement
      node:
        id: fgf_fgfr_binding
        label: FGF ligand and co-receptor engage FGFR
        module_type: REGULATORY_STEP
        description: >-
          A secreted FGF binds the FGFR ectodomain together with a co-receptor. Paracrine FGFs bind
          heparan sulfate with high affinity, and heparan sulfate is required for the active
          asymmetric receptor dimer. Endocrine FGFs (FGF19, FGF21, FGF23) have low heparan sulfate
          affinity, circulate systemically, and need an alpha- or beta-Klotho co-receptor to form
          a high-affinity complex.
        variant_sets:
          - id: fgf_ligand_class_alternatives
            label: FGF ligand paralog classes and their co-receptors
            axis: paralog
            selection: ONE_OR_MORE
            notes: >-
              The FGF ligand paralogs split into heparan-sulfate-dependent paracrine FGFs and
              Klotho-dependent endocrine FGFs. A given tissue can respond to either or both
              classes, so the step is the union of the two. Intracellular FGFs (FGF11-14, also
              in PTHR11486) do not signal through FGFRs and are excluded.
            evidence:
              - source_id: PMID:17623664
                supporting_text: The fibroblast growth factor (FGF) 19 subfamily of ligands, FGF19,
                  FGF21, and FGF23, function as hormones that regulate bile acid, fatty acid,
                  glucose, and phosphate metabolism in target organs through activating FGF
                  receptors (FGFR1-4).
            variants:
              - id: paracrine_fgf_variant
                label: Paracrine FGF with heparan sulfate
                module_type: REGULATORY_STEP
                description: >-
                  Canonical paracrine FGFs (FGF1, FGF2, FGF7, FGF8, FGF10 and others) bind the
                  receptor with heparan sulfate proteoglycan as cofactor. Ligand choice is
                  constrained by receptor paralog and IIIb/IIIc isoform; FGF1 is the only ligand
                  that activates every receptor isoform, while FGF7 and FGF10 are selective for
                  the epithelial FGFR2 IIIb isoform. Paracrine FGFs bind heparin/heparan sulfate
                  directly (heparin binding, GO:0008201).
                annotons:
                  - id: paracrine_fgf_ligand
                    label: Paracrine FGF ligand
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Paracrine FGF ligand paralogs
                        term:
                          id: PANTHER:PTHR11486
                          label: FIBROBLAST GROWTH FACTOR
                        representative_members:
                          - preferred_term: FGF1
                            term:
                              id: UniProtKB:P05230
                              label: Fibroblast growth factor 1
                            description: Activates all FGFR paralogs and splice isoforms.
                          - preferred_term: FGF2
                            term:
                              id: UniProtKB:P09038
                              label: Fibroblast growth factor 2
                            description: Prototypic ligand preferring IIIc receptor isoforms.
                          - preferred_term: FGF7
                            term:
                              id: UniProtKB:P21781
                              label: Fibroblast growth factor 7
                            description: Mesenchyme-derived ligand selective for FGFR2 IIIb.
                          - preferred_term: FGF10
                            term:
                              id: UniProtKB:O15520
                              label: Fibroblast growth factor 10
                            description: Mesenchyme-derived ligand for epithelial IIIb receptors.
                          - preferred_term: FGF8
                            term:
                              id: UniProtKB:P55075
                              label: Fibroblast growth factor 8
                            description: Epithelial/organizer-derived ligand for IIIc receptors.
                        ancestral_nodes:
                          - preferred_term: PAINT node PTN000160075 for the FGF ligand family
                            term:
                              id: PANTHER:PTN000160075
                              label: PTN000160075
                            description: Local PAINT IBD node in PTHR11486 with propagated terms
                              F:GO:0005104, F:GO:0008083, P:GO:0008543, C:GO:0005576.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN000160075 in
                                  PTHR11486.
                    function:
                      preferred_term: fibroblast growth factor receptor binding
                      term:
                        id: GO:0005104
                        label: fibroblast growth factor receptor binding
                    role_description: Secreted paracrine ligand that binds FGFR together with
                      heparan sulfate and triggers receptor dimerization.
                    evidence:
                      - source_id: PMID:8663044
                        supporting_text: These studies demonstrate that FGF 1 is the only FGF that
                          can activate all FGF receptor splice variants.
                      - source_id: PMID:16597617
                        statement: Completes the mitogenesis-based receptor-specificity matrix for
                          FGFs 10-23 against the seven principal FGFR isoforms.
                      - source_id: file:genes/human/FGF1/FGF1-ai-review.yaml
                        statement: 'FGF1 review: core functions FGFR binding (GO:0005104), heparin binding
                          (GO:0008201) and growth factor activity in the extracellular region.'
                      - source_id: file:genes/human/FGF2/FGF2-ai-review.yaml
                        statement: 'FGF2 review: core functions FGFR binding (GO:0005104) and heparin
                          binding (GO:0008201, NEW IDA from the FGF2-FGFR1-heparin ternary structure).'
                      - source_id: file:genes/human/FGF7/FGF7-ai-review.yaml
                        statement: 'FGF7 review: core function type 2 FGF receptor binding (GO:0005111),
                          i.e. selective for the FGFR2 IIIb isoform.'
                      - source_id: file:genes/human/FGF10/FGF10-ai-review.yaml
                        statement: 'FGF10 review: core function type 2 FGF receptor binding (GO:0005111,
                          FGFR2 IIIb, supported by the FGF10-FGFR2b crystal structure); FGF10 also activates
                          FGFR1b.'
              - id: endocrine_fgf_variant
                label: Endocrine FGF with Klotho co-receptor
                module_type: REGULATORY_STEP
                description: >-
                  Endocrine FGF19, FGF21 and FGF23 require a Klotho-family co-receptor bound to the
                  FGFR. Which receptor paralog and which Klotho is expressed decides the target
                  tissue: FGF23 acts mainly through Klotho-FGFR1c in kidney and parathyroid, FGF21
                  mainly through beta-Klotho-FGFR1c in adipose tissue (it can also signal through
                  beta-Klotho bound to FGFR2c or FGFR3c, but not efficiently through FGFR4), and
                  FGF19 through beta-Klotho-FGFR4 in hepatocytes. These ligands act as circulating
                  hormones (hormone activity, GO:0005179) and, unlike paracrine FGFs, are largely
                  non-mitogenic.
