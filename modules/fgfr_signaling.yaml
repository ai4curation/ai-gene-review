                evidence:
                  - source_id: file:interpro/panther/PTHR46037/PTHR46037-deep-research-falcon.md
                    title: PTHR46037 Falcon family review
                    statement: >-
                      Falcon family-level GO review: The current status of PTHR46037 is that no InterPro2GO
                      terms are mapped. This is a reasonable conservative position given the family's
                      functional heterogeneity, but it may represent an under-annotation of a well-characterized
