                      - preferred_term: extracellular region
                        term:
                          id: GO:0005576
                          label: extracellular region
                    role_description: Single-pass transmembrane co-receptor that binds FGFR and
                      confers high-affinity endocrine FGF binding.
                    evidence:
                      - source_id: PMID:16436388
