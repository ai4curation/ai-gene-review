  connections:
    - source: phosphoglycerate_dehydrogenase_step
      target: phosphoserine_aminotransferase_step
      connection_type: PROVIDES_INPUT_FOR
      description: SerA supplies 3-phosphooxypyruvate to SerC.
    - source: phosphoserine_aminotransferase_step
      target: phosphoserine_phosphatase_step
      connection_type: PROVIDES_INPUT_FOR
      description: SerC supplies O-phospho-L-serine to SerB.
  notes: >-
    Exact UniProt exemplars delimit the three reaction roles without
    restricting the module taxonomically. They are chosen from organisms with
    experimental evidence or curated pathway models: E. coli K-12 (SerA, SerC,
    SerB with purified-enzyme kinetics), human (PHGDH, PSAT1, PSPH), S.
    cerevisiae (SER3, SER33, SER1, SER2 with mutant and enzyme evidence) and
    S. pombe (PomBase GO-CAM), with P. putida KT2440 kept as one bacterial
    exemplar. The H. influenzae SerA exemplar (P43885) was replaced by E. coli
    SerA because every function statement in its UniProt record is by
    similarity to E. coli SerA. No cellular location or molecular function is
    repeated at module level; bacteria, fungi and animals run the pathway in
    the cytosol, but plants run it in plastids, so no compartment is asserted.
    SerC can also catalyze phosphohydroxythreonine transamination in
    DXP-dependent vitamin B6 biosynthesis (MODULE:pyridoxal_5_phosphate_biosynthesis),
    but that separate reaction is not a fourth part of this module. SerA
    proteins differ in domain architecture (ACT-only, ASB plus ACT, or no
    regulatory domain) and in L-serine feedback sensitivity; these are
    lineage-dependent regulatory properties rather than additional pathway
    parts, so no variant set is modelled. The step-3 role is defined by
    GO:0036424; any non-SerB phosphoserine phosphatase that carries that
    activity would satisfy it.
    PANTHER grounding (2026-11): step 1 lists one subfamily from each of four
    families in family_terms because phosphoglycerate dehydrogenases are split across PTHR43761
    (P. putida, S. pombe), PTHR10996:SF282 (E. coli; also yeast SER3/SER33 in
    PANTHER's own files), PTHR42789 (yeast SER3/SER33 by UniProt) and
    PTHR42938:SF22 (human PHGDH). Every one of these families also contains
    other 2-hydroxyacid dehydrogenases. PTHR43761 and PTHR42789 each have a
    single subfamily (SF1) that mixes phosphoglycerate dehydrogenases with
    PdxB, sulfolactate dehydrogenase or hydroxypyruvate reductase members, so
    their family reviews leave GO:0004617 UNRESOLVED and the validator's two
    FAMILY_FUNCTION_UNREVIEWED warnings for those groundings are intrinsic; the
    role is defined by GO:0004617; the family reviews record the subfamily-level divergence.
    The yeast SER3/SER33 and S. pombe ser3 memberships are accepted with
    source-disagreement warnings because UniProt and PANTHER classify them in
    different families. Step 2 uses the coherent PTHR43247 family rather than
    SF1, because human PSAT1 is in SF5. Steps 2 and 3 carry the PAINT nodes
    PTN000475655 and PTN000000002, from which the yeast, S. pombe, human and
    E. coli members receive IBA rows; these groundings follow PR #5076.
    ALIGN with YeastPathways (2026-10): SERSYN-PWY maps one-to-one onto the
    three parts and its catalysts (SER3, SER33, SER1, SER2) are all correct;
    no yeast enzyme is missing. The reverse-written YeastCyc transaminase
    equation (PSERTRANSAM-RXN) is the same reaction. Ser3/Ser33 also reduce
    2-oxoglutarate to D-2-hydroxyglutarate (side activity, excluded), as do
    E. coli SerA and human PHGDH. The yeast glyoxylate (AGX1 plus SHMT) and
    threonine aldolase (GLY1) routes to serine and glycine, which make the SER
    pathway conditionally dispensable on non-fermentable carbon sources, are
    in glycine_serine_interconversion. GO-CAM comparison: both models agree
    with the module (MF, process, cytosol); the YeastPathways model has no
    causal edges, and the PomBase model links ser3 -> ser1 -> ser2 with
    RO:0002413.
