  connections:
    - source: phosphoglycerate_dehydrogenase_step
      target: phosphoserine_aminotransferase_step
      connection_type: PROVIDES_INPUT_FOR
      description: SerA supplies 3-phosphooxypyruvate to SerC.
    - source: phosphoserine_aminotransferase_step
      target: phosphoserine_phosphatase_step
      connection_type: PROVIDES_INPUT_FOR
      description: SerC supplies O-phospho-L-serine to SerB.
  notes: >-
    Exact UniProt exemplars delimit the three reaction roles without
    restricting the module taxonomically. No cellular location or molecular
    function is repeated at module level. SerC can also catalyze
    phosphohydroxythreonine transamination in DXP-dependent vitamin B6
    biosynthesis, but that separate reaction is not a fourth part of this
    module. Some bacterial SerA proteins use an ACT domain for L-serine
    feedback, but effector sensitivity is a lineage- and sequence-dependent
    regulatory property rather than an additional pathway part. No ancestral
    PTN node is asserted without verified PAINT IBD evidence.
