  notes: >-
    Exact UniProt exemplars delimit the three reaction roles without
    restricting the module taxonomically. No cellular location or molecular
    function is repeated at module level; in both yeasts all three enzymes are
    cytosolic, but plants run the pathway in plastids, so no compartment is
    asserted. SerC can also catalyze phosphohydroxythreonine transamination in
    DXP-dependent vitamin B6 biosynthesis, but that separate reaction is not a
    fourth part of this module. Some bacterial SerA proteins use an ACT domain
    for L-serine feedback, but effector sensitivity is a lineage- and
    sequence-dependent regulatory property rather than an additional pathway
    part. No ancestral PTN is asserted: the local PAINT exports identify
    family-level IBD nodes but do not establish that the PSEPK targets descend
    from those nodes.
    ALIGN with YeastPathways (2026-10): SERSYN-PWY maps one-to-one onto the
    three parts and its catalysts (SER3, SER33, SER1, SER2) are all correct;
    no yeast enzyme is missing. The reverse-written YeastCyc transaminase
    equation (PSERTRANSAM-RXN) is the same reaction. The step-1 family anchor
    PTHR43761:SF1 was removed because S. cerevisiae SER3/SER33 are classified
    in PTHR42789:SF1 while S. pombe ser3 and the bacterial enzymes are in
    PTHR43761:SF1; the role is defined by GO:0004617 instead. Ser3/Ser33 also
    reduce 2-oxoglutarate to D-2-hydroxyglutarate (side activity, excluded).
    The yeast glyoxylate (AGX1 plus SHMT) and threonine aldolase (GLY1) routes
    to serine and glycine, which make the SER pathway conditionally
    dispensable on non-fermentable carbon sources, are in
    glycine_serine_interconversion. GO-CAM comparison: both models agree with
    the module (MF, process, cytosol); the YeastPathways model has no causal
    edges, and the PomBase model links ser3 -> ser1 -> ser2 with RO:0002413.
