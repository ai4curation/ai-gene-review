  - source_id: file:human/PHGDH/PHGDH-ai-review.yaml
    title: PHGDH gene review (human)
    statement: O43175 supplies the phosphoglycerate dehydrogenase step in the cytosol.
  - source_id: file:human/PSAT1/PSAT1-ai-review.yaml
    title: PSAT1 gene review (human)
    statement: Q9Y617 supplies the phosphoserine aminotransferase step in the cytosol.
  - source_id: file:human/PSPH/PSPH-ai-review.yaml
    title: PSPH gene review (human)
    statement: P78330 supplies the phosphoserine phosphatase step.
  - source_id: file:yeast/SER3/SER3-ai-review.yaml
