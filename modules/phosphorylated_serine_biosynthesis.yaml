id: MODULE:phosphorylated_serine_biosynthesis
title: Phosphorylated L-serine biosynthesis
description: >-
  A reusable three-reaction pathway that converts the glycolytic intermediate
  3-phospho-D-glycerate to L-serine through 3-phosphooxypyruvate and
  O-phospho-L-serine. NAD+-dependent D-3-phosphoglycerate dehydrogenase
  catalyses the first, committed oxidation; a pyridoxal 5'-phosphate-dependent
  phosphoserine aminotransferase transfers the amino group of L-glutamate to
  3-phosphooxypyruvate; and a Mg2+-dependent HAD-family phosphoserine
  phosphatase releases free L-serine. The module represents the conserved
  SerA, SerC and SerB reaction roles independently of genomic arrangement and
  of which paralog carries them: budding yeast, for example, has two
  phosphoglycerate dehydrogenase paralogs. L-serine made this way is also the
  main precursor of glycine and of folate one-carbon units, but those
  conversions, and the alternative glyoxylate and threonine routes to glycine
  and serine, are separate modules. Additional activities of individual
  enzymes, including 2-oxoglutarate reduction to D-2-hydroxyglutarate by
  some SerA proteins and vitamin B6 precursor transamination by some SerC
  proteins, are outside this pathway boundary.
status: DRAFT
evidence:
  - source_id: GO:0006564
    title: L-serine biosynthetic process
    statement: >-
      GO:0006564 provides the biological-process context for synthesis of
      L-serine.
  - source_id: YeastPathways:SERSYN-PWY
    title: L-serine biosynthesis I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      The SGD YeastCyc pathway lists the three reactions with SER3 and SER33
      (EC 1.1.1.95), SER1 (EC 2.6.1.52) and SER2 (EC 3.1.3.3). All four
      catalyst assignments are retained and no catalyst is missing.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=SERSYN-PWY
  - source_id: YeastPathways:PWY3O-261
    title: superpathway of serine and glycine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      The YeastCyc superpathway repeats the three SERSYN-PWY reactions; its
      SHMT, threonine aldolase and alanine:glyoxylate aminotransferase
      reactions are modelled in glycine_serine_interconversion.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-261
  - source_id: PMID:14154
    title: Transient kinetic and deuterium isotope effect studies on the catalytic mechanism of phosphoglycerate dehydrogenase
    statement: >-
      Characterized phosphoglycerate dehydrogenase is a V-type allosteric
      enzyme inhibited by serine; this grounds the regulatory context without
      making feedback control a required pathway part.
    supporting_text: Phosphoglycerate dehydrogenase corresponds to a V-type allosteric enzyme.
  - source_id: PMID:12525494
    title: Ser3p (Yer081wp) and Ser33p (Yil074cp) are phosphoglycerate dehydrogenases in Saccharomyces cerevisiae.
    statement: >-
      SER3 and SER33 are redundant phosphoglycerate dehydrogenases; only the
      double mutant lacks activity and is a serine/glycine auxotroph on glucose,
      because the alternative glyoxylate route is glucose-repressed.
    supporting_text: >-
      Unlike either single mutant, the ser3Delta ser33Delta double mutant lacks
      detectable phosphoglycerate dehydrogenase activity and is auxotrophic for
      serine or glycine for growth on glucose media.
  - source_id: PMID:1326413
    title: Genetic analysis of serine biosynthesis and glucose repression in yeast.
    statement: >-
      ser1 and ser2 mutants in the glycolytic pathway lack phosphoserine
      transaminase and phosphoserine phosphatase respectively.
    supporting_text: >-
      The ser1 mutation corresponded to phosphoserine transaminase and ser2 to
      that of phosphoserine phosphatase.
  - source_id: PMID:8017107
    title: A gene from Saccharomyces cerevisiae which codes for a protein with significant homology to the bacterial 3-phosphoserine aminotransferase.
    statement: >-
      The yeast SERC (SER1) gene encodes a 3-phosphoserine aminotransferase
      homolog whose deletion causes serine dependency.
    supporting_text: >-
      we present the sequence for this yeast SERC, and evidence that its
      deletion from the yeast genome leads to serine dependency
  - source_id: file:modules/phosphorylated_serine_biosynthesis-deep-research-openscientist.md
    title: OpenScientist research for phosphorylated L-serine biosynthesis
    statement: >-
      The generic pathway review evaluates the three conserved reaction roles,
      their chemistry, and lineage-dependent enzyme architectures.
  - source_id: file:PSEPK/serA/serA-ai-review.yaml
    title: PSEPK serA gene review
    statement: Q88CM5 supplies the phosphoglycerate dehydrogenase step.
  - source_id: file:PSEPK/serC/serC-ai-review.yaml
    title: PSEPK serC gene review
    statement: Q88M07 supplies the phosphoserine aminotransferase step.
  - source_id: file:PSEPK/serB/serB-ai-review.yaml
    title: PSEPK serB gene review
    statement: Q88DB8 supplies the phosphoserine phosphatase step.
  - source_id: file:yeast/SER3/SER3-ai-review.yaml
    title: SER3 gene review (S. cerevisiae)
    statement: Core function GO:0004617 in L-serine biosynthesis.
  - source_id: file:yeast/SER33/SER33-ai-review.yaml
    title: SER33 gene review (S. cerevisiae)
    statement: Core function GO:0004617 in L-serine biosynthesis; main isozyme on glucose.
  - source_id: file:yeast/SER1/SER1-ai-review.yaml
    title: SER1 gene review (S. cerevisiae)
    statement: Core function GO:0004648 in L-serine biosynthesis.
  - source_id: file:yeast/SER2/SER2-ai-review.yaml
    title: SER2 gene review (S. cerevisiae)
    statement: Core function GO:0036424 in L-serine biosynthesis.
