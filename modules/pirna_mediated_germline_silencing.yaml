id: MODULE:pirna_mediated_germline_silencing
title: piRNA-mediated germline silencing
description: >-
  Animal germ cells use PIWI-clade Argonautes loaded with PIWI-interacting
  RNAs (piRNAs) to recognize transposon transcripts and other foreign or
  unwanted RNAs and to silence them. The module has three conserved steps.
  First, a cytoplasmic PIWI-piRNA complex in perinuclear nuage recognizes a
  target RNA by base pairing. Second, recognition is converted into an
  amplified pool of secondary small RNAs. Third, a nuclear Argonaute carries
  small RNAs into the nucleus and silences complementary loci
  co-transcriptionally. How the second and third steps are carried out
  differs between lineages. In insects and vertebrates, amplification is the
  ping-pong cycle: piRNA-guided slicing by cytoplasmic PIWI proteins (fly
  Aubergine and Ago3, mammalian PIWIL2/MILI) cuts target and precursor
  transcripts, and the cleavage products become new piRNAs. Nematodes lack
  ping-pong. In Caenorhabditis elegans the PIWI protein PRG-1 does not need
  to slice; its targets are instead used as templates by RNA-dependent RNA
  polymerase to make secondary 22G-RNAs, which are loaded into
  nematode-specific WAGO Argonautes. The nuclear step is also carried out by
  different, non-slicing effectors: fly Piwi directs H3K9me3 heterochromatin,
  mammalian PIWIL4/MIWI2 directs de novo DNA methylation of transposons, and
  in nematodes the WAGO HRDE-1 recruits the nuclear RNAi factor NRDE-2 and
  directs H3K9me3. In C. elegans the silenced state can be inherited for
  many generations without the piRNA trigger, through the nuclear HRDE-1
  loop and a cytoplasmic loop in which the helicase ZNFX-1 and WAGO-4 form Z
  granules. Loss of the core PIWI proteins causes transposon derepression
  and sterility in flies and mice, and progressive loss of fertility in
  nematodes.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:26669262
    title: PIWI Slicing and EXD1 Drive Biogenesis of Nuclear piRNAs from Cytosolic Targets of the Mouse piRNA Pathway.
    statement: >-
      piRNA-guided PIWI proteins act in both the cytoplasm and the nucleus of
      animal germ cells. In the mouse, cytoplasmic slicing by MILI generates
      piRNAs for nuclear MIWI2.
    supporting_text: >-
      PIWI-interacting RNAs (piRNAs) guide PIWI proteins to suppress
      transposons in the cytoplasm and nucleus of animal germ cells, but how
      silencing in the two compartments is coordinated is not known.
  - source_id: PMID:17346786
    title: Discrete small RNA-generating loci as master regulators of transposon activity in Drosophila.
    statement: >-
      Sense and antisense piRNA complementarity in Drosophila implies a
      slicer-driven amplification loop (ping-pong).
    supporting_text: >-
      Complementary relationships between sense and antisense piRNA
      populations suggest an amplification loop wherein each piRNA-directed
      cleavage event generates the 5' end of a new piRNA.
  - source_id: PMID:22738724
    title: C. elegans piRNAs mediate the genome-wide surveillance of germline transcripts.
    statement: >-
      piRNAs scan the germline transcriptome by imperfect pairing. PRG-1 loss
      derepresses loci and depletes RdRP-derived 22G-RNAs. PRG-1 initiates
      silencing but does not maintain it.
    supporting_text: >-
      We show that PRG-1 is required to initiate, but not to maintain,
      silencing of transgenes engineered to contain complementarity to
      endogenous 21U-RNAs.
  - source_id: PMID:22738724
    title: C. elegans piRNAs mediate the genome-wide surveillance of germline transcripts.
    statement: Model of genome-wide scanning by piRNAs.
    supporting_text: >-
      Our findings support a model in which C. elegans piRNAs utilize their
      enormous repertoire of targeting capacity to scan the germline
      transcriptome for foreign sequences, while endogenous germline-expressed
      genes are actively protected from piRNA-induced silencing.
  - source_id: PMID:22738726
    title: piRNAs initiate an epigenetic memory of nonself RNA in the C. elegans germline.
    statement: >-
      PRG-1 initiates permanent silencing. Maintenance needs chromatin
      factors and the WAGO pathway.
    supporting_text: >-
      We show that the Piwi Argonaute PRG-1 and its genomically encoded piRNA
      cofactors initiate permanent silencing, and maintenance depends on
      chromatin factors and the WAGO Argonaute pathway.
  - source_id: PMID:22738725
    title: piRNAs can trigger a multigenerational epigenetic memory in the germline of C. elegans.
    statement: >-
      piRNA-triggered silencing becomes independent of the trigger and lasts
      at least 20 generations through a nuclear RNAi/chromatin pathway.
    supporting_text: >-
      piRNAs can trigger highly stable long-term silencing lasting at least
      20 generations. Once established, this long-term memory becomes
      independent of the piRNA trigger but remains dependent on the nuclear
      RNAi/chromatin pathway.
  - source_id: PMID:35739318
    title: The conserved helicase ZNFX-1 memorializes silenced RNAs in perinuclear condensates.
    statement: >-
      Heritable silencing involves two parallel amplification loops, a nuclear
      HRDE-1 loop and a perinuclear ZNFX-1 loop.
    supporting_text: >-
      The first loop, dependent on the nuclear Argonaute HRDE-1, targets
      nascent transcripts and reduces but does not eliminate productive
      transcription at the locus. The second loop, dependent on the conserved
      helicase ZNFX-1, targets mature transcripts and concentrates them in
      perinuclear condensates.
  - source_id: file:modules/c_elegans_mutator_22g_rna_amplification.yaml
    title: Mutator foci 22G-RNA amplification in Caenorhabditis elegans
    statement: >-
      Sibling module for the nematode amplification machinery (MUT-16,
      RDE-2/MUT-7, RDE-3, RRF-1) and the WAGO-1 effector. The nematode
      variant of the amplification part of this module points to it.
  - source_id: file:genes/worm/prg-1/prg-1-ai-review.yaml
    title: prg-1 gene review
    statement: >-
      Core function: PRG-1 binds 21U-RNAs (GO:0034583) in P granules.
  - source_id: file:genes/human/PIWIL2/PIWIL2-ai-review.yaml
    title: PIWIL2 gene review
    statement: >-
      Core functions: piRNA-guided RNA endonuclease (slicer) that drives
      secondary piRNA processing, and piRNA binding.
  - source_id: file:genes/human/PIWIL4/PIWIL4-ai-review.yaml
    title: PIWIL4 gene review
    statement: >-
      Core function: piRNA binding in the nucleus, directing piRNA-mediated
      DNA methylation of transposons. Slicer activity is dispensable.
  - source_id: file:genes/DROME/piwi/piwi-ai-review.yaml
    title: piwi gene review
    statement: >-
      Core function: piRNA binding in the nucleus, directing piRNA-mediated
      heterochromatin formation at transposons. Slicer activity is
      dispensable for silencing.
  - source_id: file:genes/worm/znfx-1/znfx-1-ai-review.yaml
    title: znfx-1 gene review
    statement: >-
      Core function: ZNFX-1 is an RNA helicase (GO:0003724) of the Z granule
      that acts in transgenerational siRNA inheritance.
notes: >-
  Renamed and generalized from the C. elegans-only module
  c_elegans_pirna_transgenerational_silencing. Slug choice. The slug says
  germline silencing rather than transposon silencing because, in
  nematodes, piRNAs scan the whole germline transcriptome for non-self
  sequences (transgenes and other foreign RNAs as well as transposons), and
  the nematode silenced state is heritable. Transposable element silencing
  remains the main conserved output and is a module concept.

  Boundary. The module covers how piRNA-guided silencing is targeted,
  amplified and imposed on chromatin, plus the nematode transgenerational
  memory. Primary piRNA biogenesis (piRNA cluster transcription, Zucchini/
  PLD6 phasing, PARN-1/PNLDC1 trimming, HENN1 2'-O-methylation, and the
  nematode USTC complex) is upstream and excluded. The pachytene piRNA
  functions of mammalian PIWIL1/MIWI in spermiogenic mRNA turnover, and the
  maternal germ plasm roles of Aubergine, are outside the boundary.

  Lineage choices. Amplification is a variant set: ping-pong (insects,
  vertebrates) versus RdRP-driven 22G-RNA synthesis (nematodes). The
  nematode amplification machinery itself is modeled in
  MODULE:c_elegans_mutator_22g_rna_amplification and is not repeated here;
  the nematode variant holds DEPS-1 (the PRG-1 partner) and the WAGO-1
  effector. Nuclear silencing is a second variant set with three lineage
  effectors (fly Piwi, mammalian PIWIL4, nematode HRDE-1 with NRDE-2). None
  of the three nuclear effectors is given an endonuclease function here: fly
  Piwi and mouse Miwi2 slicer mutants silence transposons normally, and
  HRDE-1 is a WAGO without the catalytic residues. PIWIL2 contributes to
  DNA methylation only upstream, by supplying the secondary piRNAs loaded
  into PIWIL4; it is therefore placed in the ping-pong variant, with a
  connection to PIWIL4, and not in the nuclear step. The Z granule loop is
  an optional, nematode-specific part.

  PIWI family. Recognition is a FAMILY role over PIWI-clade Argonautes.
  PANTHER puts all Argonautes, AGO and PIWI clades alike, in PTHR22891, so no
  PANTHER family id is asserted for the PIWI clade. The PAINT node
  PTN007716312 (piRNA binding IBD) is inherited by every PIWI protein in
  this module (PRG-1, PIWIL1, PIWIL2, PIWIL4, Piwi, Aub, Ago3) but not by
  HRDE-1 or the other WAGOs.

  Named but not modeled. Mammalian PIWIL1 is a pachytene effector and is
  only a representative of recognition. Ping-pong cofactors (Vasa/DDX4,
  Krimper, Qin, TDRD proteins, GTSF1, the EXD1-TDRD12 PET complex), the fly
  nuclear factors (Panoramix/SFiNX, Asterix/Gtsf1, Eggless/SetDB1, HP1a),
  the mammalian methylation machinery (SPOCD1, DNMT3C, DNMT3L), the
  nematode NRDE-1/3/4 factors, SET-25, SET-32, HPL-2 and SIMR-1, and the
  nearly inactive PRG-1 paralog PRG-2 are named only.
module:
  id: pirna_mediated_germline_silencing
  label: piRNA-mediated germline silencing
  module_type: BIOLOGICAL_PROCESS
  description: >-
    PIWI-piRNA recognition of target RNAs in germline nuage, amplification of
    the silencing signal (ping-pong slicing in insects and vertebrates;
    RdRP-derived 22G-RNAs in nematodes), and nuclear co-transcriptional
    silencing by a lineage-specific non-slicing Argonaute, with an optional
    nematode Z granule inheritance loop.
  concepts:
    - preferred_term: regulatory ncRNA-mediated gene silencing
      term:
        id: GO:0031047
        label: regulatory ncRNA-mediated gene silencing
      description: >-
        Overall process. The cytoplasmic and nuclear modes are placed on
        individual annotons.
    - preferred_term: transposable element silencing
      term:
        id: GO:0010526
        label: transposable element silencing
      description: >-
        The main conserved output. In nematodes the same system also
        silences transgenes, pseudogenes and other non-self transcripts.
  context:
    taxa:
      - preferred_term: Metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
        description: >-
          PIWI proteins and piRNAs are an animal germline system. Exemplars
          here are from human/mouse, Drosophila melanogaster and
          Caenorhabditis elegans.
    cellular_components:
      - preferred_term: perinuclear region of cytoplasm
        term:
          id: GO:0048471
          label: perinuclear region of cytoplasm
        description: >-
          Germline perinuclear nuage (P granules and Mutator foci in worms,
          nuage in flies, intermitochondrial cement/pi-bodies in mouse
          gonocytes). The specific granules are given on the annotons.
    anatomical_locations:
      - preferred_term: germline
        description: >-
          Germ cells and, in Drosophila, the somatic follicle cells of the
          ovary that also express Piwi. In nematodes, also the embryonic
          germline blastomeres through which the silenced state is passed on.
  parts:
    - order: 1
      role: piRNA-guided target recognition
      node:
        id: pirna_recognition
        label: PIWI-piRNA recognition of germline target RNAs
        module_type: MOLECULAR_FUNCTION
        description: >-
          A cytoplasmic PIWI-clade Argonaute loaded with a piRNA guide pairs
          with complementary target RNAs in perinuclear nuage. In flies Aub
          binds mostly antisense piRNAs and Ago3 mostly sense piRNAs; mouse
          MILI binds primary piRNAs. C. elegans PRG-1 binds 21U-RNAs (the
          nematode piRNAs; GO:0034583, a child of piRNA binding) and pairs
          imperfectly but extensively with its targets. PRG-1 does not need
          its slicer activity for most of its targets.
        annotons:
          - id: piwi_pirna_guide
            label: piRNA-loaded PIWI-clade Argonaute
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PIWI-clade Argonautes (cytoplasmic piRNA-binding PIWI proteins)
                description: >-
                  No PANTHER family id is given: PTHR22891 covers the whole
                  Argonaute superfamily, including the AGO clade and the
                  nematode WAGOs.
                representative_members:
                  - preferred_term: PRG-1 (C. elegans)
                    term:
                      id: UniProtKB:P90786
                      label: Piwi-like protein 1
                  - preferred_term: PIWIL1/HIWI (human)
                    term:
                      id: UniProtKB:Q96J94
                      label: Piwi-like protein 1
                  - preferred_term: PIWIL2/HILI (human)
                    term:
                      id: UniProtKB:Q8TC59
                      label: Piwi-like protein 2
                  - preferred_term: Aubergine (fly)
                    term:
                      id: UniProtKB:O76922
                      label: Protein aubergine
                  - preferred_term: Ago3 (fly)
                    term:
                      id: UniProtKB:Q7PLK0
                      label: Protein argonaute-3
                ancestral_nodes:
                  - preferred_term: PAINT piRNA binding node PTN007716312
                    term:
                      id: PANTHER:PTN007716312
                      label: PTN007716312
                    description: >-
                      PTHR22891 node with IBD for piRNA binding (GO:0034584),
                      seeded by fly, mouse, human and zebrafish PIWI
                      proteins. PRG-1, PIWIL1/2/4, Piwi, Aub and Ago3 inherit
                      it; HRDE-1 does not.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN007716312 in PTHR22891.
            function:
              preferred_term: piRNA binding
              term:
                id: GO:0034584
                label: piRNA binding
            processes:
              - preferred_term: regulatory ncRNA-mediated gene silencing
                term:
                  id: GO:0031047
                  label: regulatory ncRNA-mediated gene silencing
              - preferred_term: transposable element silencing
                term:
                  id: GO:0010526
                  label: transposable element silencing
            locations:
              - preferred_term: P granule
                term:
                  id: GO:0043186
                  label: P granule
            role_description: >-
              Guide-bound PIWI protein that scans germline transcripts and
              marks the ones it pairs with for amplification and silencing.
              Whether it also cleaves them is lineage-specific (part 2).
            evidence:
              - source_id: PMID:18571452
                title: PRG-1 and 21U-RNAs interact to form the piRNA complex required for fertility in C. elegans.
                statement: 21U-RNAs bind PRG-1 and need it to accumulate; PRG-1 is in P granules.
                supporting_text: >-
                  interact with the C. elegans Piwi family member PRG-1, and
                  depend on PRG-1 activity for their accumulation. The PRG-1
                  protein is expressed throughout development and localizes to
                  nuage-like structures called P granules.
              - source_id: PMID:22738724
                title: C. elegans piRNAs mediate the genome-wide surveillance of germline transcripts.
                statement: Targets pair imperfectly with 21U-RNAs and lose 22G-RNAs without PRG-1.
                supporting_text: >-
                  Sequences depleted of 22G-RNAs are proximal to potential
                  target sites that base pair imperfectly but extensively to
                  21U-RNAs.
              - source_id: PMID:22738724
                title: C. elegans piRNAs mediate the genome-wide surveillance of germline transcripts.
                statement: PRG-1 slicer activity is not needed for most PRG-1-dependent 22G-RNAs.
                supporting_text: >-
                  These findings suggest that Slicer activity is not necessary
                  for the rescue of most prg-1-dependent 22G-RNAs.
              - source_id: PMID:17346786
                title: Discrete small RNA-generating loci as master regulators of transposon activity in Drosophila.
                statement: Fly Piwi and Aub bind mainly antisense piRNAs; Ago3 binds mainly sense piRNAs.
                supporting_text: >-
                  Piwi and Aubergine bind RNAs that are predominantly
                  antisense to transposons, whereas Ago3 complexes contain
                  predominantly sense piRNAs.
              - source_id: PMID:29437694
                title: Mouse GTSF1 is an essential factor for secondary piRNA biogenesis.
                statement: Mouse MILI binds primary piRNAs directly and processes targets by guide pairing.
                supporting_text: >-
                  MILI binds directly to primary piRNAs and processes target
                  RNAs according to the guide sequence of primary piRNAs to
                  generate secondary piRNAs
              - source_id: file:genes/human/PIWIL1/PIWIL1-uniprot.txt
                title: PIWIL1 UniProt entry
                statement: PIWIL1 binds methylated piRNAs directly.
                supporting_text: >-
                  Directly binds methylated piRNAs, a class of 24 to 30
                  nucleotide RNAs
    - order: 2
      role: secondary small RNA amplification
      node:
        id: secondary_amplification
        label: Amplification of the silencing signal
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Target recognition is turned into a larger pool of secondary small
          RNAs complementary to the target. Insects and vertebrates use
          piRNA-guided slicing (ping-pong). Nematodes, which lack ping-pong,
          use RNA-dependent RNA polymerase to make 22G-RNAs that are loaded
          into WAGO Argonautes.
        variant_sets:
          - id: amplification_mechanism
            label: Secondary small RNA amplification mechanism
            axis: taxon / amplification mechanism
            selection: ONE_OR_MORE
            notes: >-
              Among the exemplar lineages each uses one mechanism: ping-pong
              in Drosophila and mouse, RdRP-driven 22G-RNA synthesis in C.
              elegans. ONE_OR_MORE is used because this module does not
              assert that the two mechanisms never coexist in other animals.
            variants:
              - id: ping_pong_amplification
                label: Ping-pong slicer amplification (insects, vertebrates)
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  A piRNA-guided PIWI protein cleaves a complementary
                  transcript, and the 3' cleavage fragment is processed into
                  a new piRNA loaded into a partner PIWI protein. In flies the
                  cycle is heterotypic (Aub slices transposon mRNAs to make
                  sense piRNAs for Ago3; Ago3 slices antisense cluster
                  transcripts to make antisense piRNAs for Aub). In mouse
                  fetal gonocytes the cycle is mainly within MILI, and MILI
                  slicing also produces the secondary piRNAs loaded into
                  nuclear MIWI2.
                annotons:
                  - id: aub_slicer
                    label: Aubergine antisense-piRNA-guided slicer
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Aubergine (fly)
                        term:
                          id: UniProtKB:O76922
                          label: Protein aubergine
                    function:
                      preferred_term: RNA endonuclease activity
                      term:
                        id: GO:0004521
                        label: RNA endonuclease activity
                    processes:
                      - preferred_term: secondary piRNA processing
                        term:
                          id: GO:0140965
                          label: secondary piRNA processing
                      - preferred_term: transposable element silencing by piRNA-mediated mRNA destabilization
                        term:
                          id: GO:0141009
                          label: transposable element silencing by piRNA-mediated mRNA destabilization
                    locations:
                      - preferred_term: P granule
                        term:
                          id: GO:0043186
                          label: P granule
                    role_description: >-
                      Slices transposon mRNAs guided by antisense piRNAs; the
                      cleavage products become sense piRNAs for Ago3.
                    evidence:
                      - source_id: PMID:34210982
                        title: Binding of guide piRNA triggers methylation of the unstructured N-terminal region of Aub leading to assembly of the piRNA amplification complex.
                        statement: Aub and Ago3 cooperate in the ping-pong cycle, each loading a guide into the other.
                        supporting_text: >-
                          In Drosophila, two distinct cytoplasmic PIWI proteins,
                          Aub and Ago3, cooperate in the ping-pong cycle with
                          each protein generating an RNA guide that is loaded
                          into its partner.
                  - id: ago3_slicer
                    label: Ago3 sense-piRNA-guided slicer
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: Ago3 (fly)
                        term:
                          id: UniProtKB:Q7PLK0
                          label: Protein argonaute-3
                    function:
                      preferred_term: RNA endonuclease activity
                      term:
                        id: GO:0004521
                        label: RNA endonuclease activity
                    processes:
                      - preferred_term: secondary piRNA processing
                        term:
                          id: GO:0140965
                          label: secondary piRNA processing
                    locations:
                      - preferred_term: P granule
                        term:
                          id: GO:0043186
                          label: P granule
                    role_description: >-
                      Slices antisense piRNA cluster transcripts guided by
                      sense piRNAs, producing new antisense piRNAs for Aub.
                    evidence:
                      - source_id: PMID:25049272
                        title: AGO3 Slicer activity regulates mitochondria-nuage localization of Armitage and piRNA amplification.
                        statement: Ago3 slicer activity is essential for piRNA amplification.
                        supporting_text: >-
                          We show that AGO3 Slicer activity is essential for
                          piRNA amplification and that AGO3 inhibits the
                          homotypic Aub:Aub Ping-Pong process in a
                          Slicer-independent manner.
                  - id: piwil2_slicer
                    label: PIWIL2/MILI ping-pong slicer
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PIWIL2/HILI (human; mouse MILI)
                        term:
                          id: UniProtKB:Q8TC59
                          label: Piwi-like protein 2
                    function:
                      preferred_term: RNA endonuclease activity
                      term:
                        id: GO:0004521
                        label: RNA endonuclease activity
                    processes:
                      - preferred_term: secondary piRNA processing
                        term:
                          id: GO:0140965
                          label: secondary piRNA processing
                      - preferred_term: transposable element silencing by mRNA destabilization
                        term:
                          id: GO:0141008
                          label: transposable element silencing by mRNA destabilization
                    locations:
                      - preferred_term: pi-body
                        term:
                          id: GO:0071546
                          label: pi-body
                    role_description: >-
                      Slicer-competent cytoplasmic PIWI protein of the
                      mammalian fetal germline. Its slicing drives
                      intra-MILI ping-pong and generates the secondary piRNAs
                      that load PIWIL4/MIWI2.
                    evidence:
                      - source_id: PMID:22020280
                        title: The endonuclease activity of Mili fuels piRNA amplification that silences LINE1 elements.
                        statement: >-
                          A Mili catalytic mutant fails to amplify transposon
                          piRNAs, and Miwi2 then carries far fewer piRNAs.
                        supporting_text: >-
                          Analysis of Mili-bound piRNAs from homozygous
                          Mili(DAH) fetal gonadocytes revealed a failure of
                          transposon piRNA amplification, resulting in the
                          marked reduction of piRNA bound within Miwi2
                          ribonuclear particles.
                      - source_id: PMID:22020280
                        title: The endonuclease activity of Mili fuels piRNA amplification that silences LINE1 elements.
                        statement: Mouse ping-pong is mainly intra-Mili.
                        supporting_text: >-
                          We conclude that cycles of intra-Mili secondary piRNA
                          biogenesis fuel piRNA amplification that is absolutely
                          required for LINE1 silencing.
                      - source_id: PMID:26669262
                        title: PIWI Slicing and EXD1 Drive Biogenesis of Nuclear piRNAs from Cytosolic Targets of the Mouse piRNA Pathway.
                        statement: MILI slicing products become piRNAs in both MILI and nuclear MIWI2.
                        supporting_text: >-
                          These fragments accumulate as new piRNAs within both
                          cytosolic MILI and the nuclear MIWI2.
                connections:
                  - source: aub_slicer
                    target: ago3_slicer
                    connection_type: PROVIDES_INPUT_FOR
                    description: >-
                      Aub cleavage of transposon mRNA produces the sense
                      piRNA precursors loaded into Ago3.
                  - source: ago3_slicer
                    target: aub_slicer
                    connection_type: PROVIDES_INPUT_FOR
                    description: >-
                      Ago3 cleavage of cluster transcripts produces antisense
                      piRNA precursors loaded into Aub, closing the cycle.
              - id: nematode_rdrp_22g_amplification
                label: RdRP-driven 22G-RNA amplification with WAGO effectors (nematodes)
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  In C. elegans, targets recognized by PRG-1 are passed to the
                  Mutator machinery next to P granules. There they are
                  poly(UG)-tailed and used as templates for RdRP synthesis of
                  22G-RNAs. This machinery is modeled in
                  MODULE:c_elegans_mutator_22g_rna_amplification and is not
                  repeated here. The P granule protein DEPS-1 binds PRG-1
                  directly and is needed for the hand-off. The 22G-RNAs guide
                  WAGO Argonautes, which keep silencing going after PRG-1 is
                  no longer needed; WAGO-1 stands here for the cytoplasmic
                  WAGO effector.
                context:
                  taxa:
                    - preferred_term: Caenorhabditis elegans
                      term:
                        id: NCBITaxon:6239
                        label: Caenorhabditis elegans
                      description: >-
                        Characterized in C. elegans. WAGOs are a nematode
                        Argonaute clade.
                annotons:
                  - id: deps1_prg1_partner
                    label: DEPS-1 P granule partner of PRG-1
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: DEPS-1
                        term:
                          id: UniProtKB:Q9N303
                          label: P-granule-associated protein deps-1
                    function:
                      preferred_term: molecular condensate scaffold activity
                      term:
                        id: GO:0140693
                        label: molecular condensate scaffold activity
                    processes:
                      - preferred_term: regulatory ncRNA-mediated gene silencing
                        term:
                          id: GO:0031047
                          label: regulatory ncRNA-mediated gene silencing
                    locations:
                      - preferred_term: P granule
                        term:
                          id: GO:0043186
                          label: P granule
                    role_description: >-
                      P granule scaffold that binds PRG-1 directly and
                      organizes PRG-1 condensates. It is needed for
                      piRNA-triggered secondary siRNA production but not for
                      piRNA biogenesis. This is not a claim that DEPS-1
                      recognizes targets.
                    evidence:
                      - source_id: PMID:32843637
