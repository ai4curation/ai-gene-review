              Drosophila, PIWIL4/MIWI2 in mammals, and the WAGO HRDE-1 in C.
              elegans germ cells. Piwi and PIWIL4 are PIWI-clade proteins
              loaded with piRNAs; HRDE-1 is a WAGO loaded with 22G-RNAs.
            variants:
