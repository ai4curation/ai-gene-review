    - order: 4
      role: Z granule transgenerational memory (nematodes)
      optional: true
      notes: >-
        Optional, nematode-specific part. ZNFX-1 has a human homolog (ZNFX1),
        but a Z granule inheritance loop with a WAGO partner has been shown
        only in C. elegans.
      node:
        id: z_granule_loop
        label: ZNFX-1/WAGO-4 Z granule inheritance
        module_type: BIOLOGICAL_PROCESS
        description: >-
          ZNFX-1 and WAGO-4 are in P granules of early germline blastomeres.
          Later they separate to form Z granules, which join P granules and
          Mutator foci in ordered PZM assemblages. The two proteins interact
          and are needed specifically for the inheritance phase of RNAi.
          ZNFX-1 binds silenced, poly(UG)-tailed transcripts and holds them
          in perinuclear condensates as templates for 22G-RNA amplification
          in the inheriting generation. This loop runs in parallel to the
          nuclear HRDE-1 loop.
        context:
          taxa:
