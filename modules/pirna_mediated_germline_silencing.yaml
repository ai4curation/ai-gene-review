                statement: ZNFX-1 and WAGO-4 leave P granules to define the Z granule.
                supporting_text: >-
                  Later in germline development, ZNFX-1 and WAGO-4 separate
                  from P granules to define an independent liquid-like
                  condensate that we term the Z granule.
              - source_id: PMID:29769721
                title: Spatiotemporal regulation of liquid-like condensates in epigenetic inheritance.
                statement: ZNFX-1 is a dedicated RNAi inheritance factor.
                supporting_text: >-
                  The data establish that ZNFX-1 is a dedicated RNAi
                  inheritance factor.
              - source_id: PMID:35739318
                title: The conserved helicase ZNFX-1 memorializes silenced RNAs in perinuclear condensates.
                statement: ZNFX-1 binds pUG-tailed targets and sustains amplification in the inheriting generation.
                supporting_text: >-
                  ZNFX-1 interacts with sRNA-targeted transcripts that have
