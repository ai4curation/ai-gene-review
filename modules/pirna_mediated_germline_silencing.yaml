                  transcripts and, through Asterix/Gtsf1, Panoramix/SFiNX and
                  Eggless/SetDB1, establishes H3K9me3 heterochromatin and
                  co-transcriptional silencing. Silencing needs Piwi nuclear
                  localization but not its slicer activity.
