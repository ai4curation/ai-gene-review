  connections:
    - source: pirna_recognition
      target: secondary_amplification
      connection_type: CAUSES
      description: >-
        PIWI-piRNA recognition starts secondary small RNA production at the
        target: by slicing in the ping-pong lineages, and by RdRP recruitment
        (with DEPS-1) in nematodes, where targets lose 22G-RNAs without
        PRG-1.
    - source: secondary_amplification
      target: nuclear_silencing
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Amplified secondary small RNAs guide the nuclear effector: MILI-made
        secondary piRNAs load MIWI2 in mouse, and 22G-RNAs load HRDE-1 in
        nematodes. Drosophila Piwi is loaded mostly with primary (phased)
        piRNAs, so in flies this input is partial.
    - source: piwil2_slicer
      target: piwil4_nuclear
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        MILI slicing produces the secondary piRNAs that load MIWI2 and are
        needed for its nuclear localization. This is PIWIL2's only route to
        DNA methylation.
    - source: secondary_amplification
      target: z_granule_loop
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        In nematodes, amplified 22G-RNAs guide WAGO-4. Z granule pUG
        transcripts are in turn templates for further amplification in
        progeny.
knowledge_gaps:
  - gap_statement: >-
      In C. elegans, how the nuclear HRDE-1 loop and the cytoplasmic
      ZNFX-1/WAGO-4 loop are coordinated within and across generations is
      unknown. So is the molecular basis of the hand-off from PRG-1-bound
      targets in P granules to the Mutator machinery.
    boundary: >-
      The two loops act genetically in parallel and use different
      templates (nascent versus mature transcripts). SIMR-1 foci sit between
      piRNA recognition and Mutator amplification. How a targeted transcript
      moves between the condensates has not been followed directly.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This decides whether heritable silencing is one coupled cycle or two
      separable memories, and what sets how long inheritance lasts.
    resolution: >-
      Live-image single tagged target RNAs through P granules, Mutator foci
      and Z granules in hrde-1, znfx-1 and double mutants across
      generations. Combine this with condensate-specific RNA profiling.
    provenance:
      - reference_id: PMID:35739318
        supporting_text: >-
          How the RDE-1, HRDE-1 and ZNFX-1 sRNA amplification mechanisms
          coordinate in cells and across generations will be an important
          focus for future investigations.
