notes: >-
  Boundary. The module realizes the FlyBase pigment biosynthesis group without its ommochrome
  subgroup (OMMOBI), which is modelled in a separate ommochrome module, together with the
  beta-alanine biosynthesis group. Dopamine synthesis by Pale and Ddc is upstream context
  modelled in the catecholamine biosynthesis module, and the phenoloxidase Laccase 2 and the
  cuticle proteins that are cross-linked are not FlyBase members and are not parts. Yellow
  (y) is not a member of the FlyBase pigment biosynthesis group; it was added to the melanin
  part because it is required for black melanin. Ebony and Tan also act in histamine recycling
  (histamine metabolism module). Uracil-derived beta-alanine steps are assigned by orthology
  to the pyrimidine reductive degradation enzymes. FlyBase groups realized by this module:
  PIGMBIO (FBgg0002213), BALABIO (FBgg0002218). Subgroups folded into it: MELABI, DYNADAB,
  DYNBADB. Participants were generated from the FlyBase gene-group membership and mapped to
  UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_cuticle_tanning_pigmentation.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
