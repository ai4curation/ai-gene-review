id: MODULE:dmel_cuticle_tanning_pigmentation
title: Cuticle tanning and pigmentation in Drosophila melanogaster
description: >-
  After each molt and at eclosion, the insect cuticle is hardened (sclerotized) and pigmented
  using dopamine made by tyrosine hydroxylase (Pale) and DOPA decarboxylase. Dopamine is used
  in three branches. Arylalkylamine N-acetyltransferase (Speck, Aanat1) acetylates it to N-acetyldopamine
  (NADA), the precursor of colourless sclerotin. Ebony conjugates dopamine with beta-alanine
  to N-beta-alanyldopamine (NBAD), the precursor of yellow-tan sclerotin, and Tan hydrolyses
  NBAD back to dopamine, so the Ebony-Tan balance sets cuticle colour. Oxidation of dopamine
  and DOPA by phenoloxidases yields quinones and chromes that polymerize into black and brown
  melanins; the Yellow family proteins Yellow-f and Yellow-f2 convert dopachrome and Yellow-h
  converts dopaminechrome, and Yellow itself is needed for black melanin. Beta-alanine for
  NBAD comes from decarboxylation of aspartate by Black (Adc) and from uracil degradation
  through dihydropyrimidine dehydrogenase, dihydropyrimidinase and beta-ureidopropionase.
status: DRAFT
scope: CONCRETE
