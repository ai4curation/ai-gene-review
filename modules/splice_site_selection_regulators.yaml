              term:
                id: GO:0003723
                label: RNA binding
            processes:
            - preferred_term: regulation of mRNA splicing, via spliceosome
              term:
                id: GO:0048024
                label: regulation of mRNA splicing, via spliceosome
            role_description: >-
              SR protein recruited by the nuclear m6A reader YTHDC1 to promote inclusion of targeted exons,
