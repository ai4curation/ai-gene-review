            label: SRSF4 (SRp75) activates enhancer-dependent splice-site use
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SRSF4
                term:
                  id: UniProtKB:Q08170
                  label: Serine/arginine-rich splicing factor 4
            function:
              preferred_term: pre-mRNA binding
              term:
                id: GO:0036002
                label: pre-mRNA binding
            processes:
            - preferred_term: negative regulation of mRNA splicing, via spliceosome
              term:
                id: GO:0048025
                label: negative regulation of mRNA splicing, via spliceosome
            role_description: >-
              SR protein that binds purine-rich exonic enhancers; in the tau exon 10 survey it acted as
