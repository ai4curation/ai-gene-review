id: MODULE:splice_site_selection_regulators
title: >-
  Human splice-site selection regulators: SR and SR-like enhancer-binding activators, hnRNP and SR-like
  silencer-binding repressors, and cell-type-specific splicing regulators acting on early (E/A) spliceosome
  assembly
description: >-
  Most human exons are recognised only with the help of auxiliary RNA-binding proteins that read short
  cis-acting elements in the pre-mRNA. Serine/arginine-rich (SR) proteins and the SR-like TRA2 proteins
  bind exonic splicing enhancers through their RNA recognition motifs and use their RS domains to recruit
  and stabilise U1 snRNP at the 5' splice site and U2AF at the 3' splice site, promoting exon definition
  and formation of the early (E) and prespliceosome (A) complexes. Heterogeneous nuclear ribonucleoproteins
  (hnRNPs) such as hnRNP A1, hnRNP C, hnRNP H, hnRNP L and PTBP1 bind exonic and intronic splicing silencers
  or polypyrimidine tracts and repress exon use by blocking splice-site recognition, competing with U2AF65,
  spreading cooperatively along the exon or looping out exons; the SR-like proteins SRSF10 and SRSF12
  antagonise authentic SR proteins. Cell-type-specific regulators (PTBP2, MBNL1, QKI, TIAL1 and SRRM4)
  bind their own motifs near regulated exons and activate or repress them according to position. The balance
  of these activators and repressors on each pre-mRNA determines which splice sites are used and so the
  pattern of alternative splicing.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PW:0001073
  title: spliceosome pathway
  statement: >-
    RGD curates the SR proteins SRSF1 to SRSF12, TRA2A and TRA2B, 18 hnRNP-family genes and the regulators
    PTBP1, PTBP2, MBNL1, QKI, TIAL1 and SRRM4 directly to this pathway, whose text describes SR proteins
    binding enhancers and hnRNPs binding silencers to control splice-site choice. This module realises
    that regulatory part of the pathway under the split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md
    (Spliceosome, item 3).
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001073.yaml
  statement: RGD names SR proteins and hnRNPs as the trans-acting factors for enhancers and silencers.
  supporting_text: >-
    Trans-elements, which bind to enhancers and silencers, include the members of the Ser/Arg-rich (SR)
    and heterogeneous nuclear ribonucleoprotein (hnRNP) protein families, respectively.
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001073.yaml
  statement: RGD states that these factors act by recruiting or excluding snRNP components.
  supporting_text: >-
    The cis-elements are binding sites for the trans-factors - SR proteins for enhancers, hnRNP for silencers,
    which in turn recruit snRNP subunits or prevent their association.
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001073.yaml
  statement: RGD lists the cell-type-specific regulators drawn on its diagram.
  supporting_text: >-
    Examples include but are not limited to regulators such as Ptbp1 and 2, Mbnl, Srrm, Qki and Tial1.
- source_id: GO:0048024
  title: regulation of mRNA splicing, via spliceosome
  statement: >-
    The module concept. The GO process mapped to PW:0001073 is GO:0000398 mRNA splicing, via spliceosome
    (skos:narrowMatch, projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml); the regulators modelled
    here regulate that process rather than carry it out, so the module concept is its regulation term.
- source_id: PMID:11779509
  title: >-
    Exon identity established through differential antagonism between exonic splicing silencer-bound hnRNP
    A1 and enhancer-bound SR proteins.
  statement: >-
    SR proteins bound to exonic enhancers promote exon use, whereas hnRNPs bound to exonic silencers block
    exon recognition.
  supporting_text: >-
    SR proteins recognize exonic splicing enhancer (ESE) elements and promote exon use, whereas certain
    hnRNP proteins bind to exonic splicing silencer (ESS) elements and block exon recognition
- source_id: PMID:9660960
  title: >-
    Arginine/serine-rich domains of SR proteins can function as activators of pre-mRNA splicing.
  statement: >-
    Tethered RS domains activate splicing, separating the enhancer-dependent activator function of SR
    proteins from their general role.
  supporting_text: These data demonstrate that RS domains function as splicing activators
- source_id: PMID:19061484
  title: 'The SR protein family of splicing factors: master regulators of gene expression.'
  statement: >-
    SR proteins act in constitutive splicing and as regulators of alternative splicing, and have post-splicing
    roles.
  supporting_text: >-
    They play significant roles in constitutive pre-mRNA splicing and are also important regulators of
    alternative splicing
- source_id: PMID:18380344
  title: hnRNP proteins and splicing control.
  statement: >-
    hnRNPs repress splicing by antagonising splice-site recognition or enhancer-bound proteins, and some
    hnRNPs activate splicing.
  supporting_text: >-
    Heterogeneous nuclear RNP proteins can repress splicing by directly antagonizing the recognition of
    splice sites, or can interfere with the binding of proteins bound to enhancers
notes: 'Derived from the RGD Pathway Ontology diagram PW:0001073 (spliceosome pathway) through the RGD_PATHWAY_ONTOLOGY
  project, as module 3 of the Spliceosome split plan (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md;
  seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, flagged broad, 114 RGD-curated human genes,
  no PW children). PW:0001073 is the only PW evidence source. The diagram''s pathway links (RNA polymerase
  II transcription, microRNA, chromatin modification and mRNA nuclear export pathways) are not covered
  here. The sibling modules of this tranche are spliceosomal_snrnp_biogenesis and major_spliceosome_cycle.
  Every participant is on RGD''s curated human gene list for PW:0001073 (.cache/rgd_pw/homo_genes_pw);
  no gene is added from outside it. UniProt accessions and recommended names are from UniProt REST (November
  2026). Molecular functions and processes are from each protein''s experimental human GOA rows in QuickGO
  (November 2026) or from its gene-review core function (TRA2B, HNRNPA2B1, HNRNPC, TIAL1 have reviews
  in this repository). Cited papers are those behind the GOA rows, plus classic enhancer and silencer
  papers for the SR proteins whose GOA rows are only high-throughput RNA binding.


  Membership decisions. RGD''s list has about 40 genes that are SR proteins, hnRNPs or named splicing
  regulators. Included as participants (26): the SR activators SRSF1, SRSF2, SRSF3, SRSF4, SRSF5, SRSF6,
  SRSF7, SRSF9, TRA2A and TRA2B; the repressors HNRNPA1, HNRNPA2B1, HNRNPC, HNRNPH1, HNRNPL, HNRNPM, HNRNPU,
  PTBP1, RBMX, SRSF10 and SRSF12; and the cell-type-specific regulators PTBP2, MBNL1, QKI, TIAL1 and SRRM4.
  Each has an experimental human GOA row for a splicing-regulation process, or a cited paper showing enhancer
  binding and activation (SRSF2, SRSF5). Excluded, although RGD lists them, because membership is not
  participation and none has experimental human evidence for regulating splice-site choice in GOA or in
  a cached paper: HNRNPA0 (AU-rich mRNA binding, kinase signalling), HNRNPA1L2 and RBMXL1 (IBA only),
  HNRNPA3 and HNRNPR (IC or IBA only), HNRNPAB (mRNA modification, NMD), HNRNPD (AUF1, mRNA decay and
  translation), HNRNPH3, HNRNPK (only IC for splicing; its gene-review core functions are poly(C) RNA
  packaging and transcriptional coregulation, not splice-site control), SYNCRIP (translation and mRNA
  stability), PCBP1 (poly(C) binding, translation), SRSF8 (high-throughput RNA binding and IBA only) and
  SRSF11 (SR-related protein with TAS-only splicing rows). They can be added when evidence is curated.
  SRRM1, SRRM2, PUF60, RBM17, RBM25, U2SURP, SMNDC1, ACIN1, PNN, RNPS1, DDX5 and the other RGD genes that
  are spliceosome components or EJC/ASAP factors belong to major_spliceosome_cycle or nonsense_mediated_mrna_decay
  and are not modelled here; SRRM4 is included because RGD names Srrm among its regulators and it is a
  cell-type-specific exon activator, not a core component.


  Boundary and modelling decisions. (1) Three parts, each a variant set with selection ONE_OR_MORE, one
  variant per protein: enhancer-binding SR and SR-like activators, silencer-binding hnRNP and SR-like
  repressors, and cell-type-specific regulators. The split plan asks for activator and repressor families;
  the third part holds the regulators RGD names separately (Ptbp, Mbnl, Srrm, Qki, Tial1) that are neither
  SR proteins nor classical hnRNPs, except that PTBP1 (hnRNP I) sits with the hnRNPs. The direction is
  the predominant outcome only: SRSF4, SRSF7 and SRSF9 carry experimental negative-regulation rows (tau
  exon 10), and RBMX, hnRNP U and others activate some exons; each annoton records its own process. (2)
  SRSF10 and SRSF12 are SR-like by sequence but antagonise authentic SR proteins (PMID:11684676), so they
  are placed with the repressors. (3) Functions are RNA-binding terms only. GO has no splicing-regulator
  activity term and no exonic splicing enhancer binding term; the latter is requested in proposed_new_terms.
  Each protein carries the most specific RNA-binding term its own evidence supports: pre-mRNA binding,
  pre-mRNA intronic binding, poly(U) RNA binding, mRNA binding, or plain RNA binding where the only experimental
  row is high-throughput (SRSF7, SRSF9, SRSF12, HNRNPM, PTBP2) or IDA RNA binding (SRSF3, SRSF10, HNRNPH1,
  MBNL1). Functions authored here rather than taken from an experimental GOA row: pre-mRNA binding for
  SRSF1, SRSF2, SRSF4, SRSF5 and TRA2A (from direct enhancer-binding assays in PMID:9649504, PMID:7651409,
  PMID:11779509 and PMID:9546399); pre-mRNA intronic binding for HNRNPA2B1 and RNA binding for TIAL1 are
  their gene-review core functions; TRA2B uses pre-mRNA binding (GOA IDA) rather than its review''s core
  term sequence-specific mRNA binding, to keep the enhancer-binding activators on one branch. Processes
  authored rather than taken from GOA: positive regulation of mRNA splicing, via spliceosome for TRA2A,
  and regulation of alternative mRNA splicing for SRSF2 and SRSF5 (GOA has IBA only for those two). SRRM4
  has no experimental function row except identical protein binding, so its annoton has no function. (4)
  Many of these proteins have major roles outside splicing (hnRNP A1 and hnRNP U at telomeres and chromatin,
  HNRNPA2B1 in RNA transport and pri-miRNA processing, QKI in mRNA transport, TIAL1 in translational repression
  and stress granules, SR proteins in mRNA export and NMD). Only the splice-site regulation role is modelled;
  role descriptions say what is left out. (5) The regulated step. The regulators act on early spliceosome
  assembly (E complex recognition of the splice sites by U1 snRNP and U2AF, and A complex formation).
  That step is modelled in major_spliceosome_cycle, which did not exist when this draft was written, so
  the target is a local node early_spliceosome_assembly with concept GO:1903241 U2-type prespliceosome
  assembly and no annotons; once the sibling module is merged it should become a module_ref to its E/A
  node. Connections: activators POSITIVELY_REGULATES and repressors NEGATIVELY_REGULATES that node, and
  repressors NEGATIVELY_REGULATES activators for the antagonism on shared exons. The cell-type-specific
  part has no edge because its members activate or repress according to binding position. (6) SR-protein
  kinases and phosphatases are regulation of the regulators. SRPK1, SRPK2 and CLK1 to CLK4 are not on
  RGD''s list for PW:0001073 and are excluded; they are noted here for a later regulatory extension. (7)
  The core spliceosome, the Sm and LSm rings and the snRNPs are modelled in major_spliceosome_cycle and
  spliceosomal_snrnp_biogenesis; the EJC deposited by the spliceosome is modelled in nonsense_mediated_mrna_decay;
  capping, 3''-end processing and mRNA export are in pre_mrna_capping, pre_mrna_3prime_cleavage_polyadenylation
  and mrna_nuclear_export. snRNAs are not gene products in this model.


  GO-CAM links. In gocams/index.tsv two production models contain participants. gomodel:69a0c46f00001110
  (FAM120A couples SREBP-dependent transcription and splicing of lipogenesis enzymes, Human) has SRSF1
  with RNA binding, part of positive regulation of RNA splicing, and is pinned to the SRSF1 annoton; the
  same model has SRPK2 protein serine/threonine kinase activity upstream of SRSF1, which is not pinned
  because SRPK2 is not a participant. gomodel:64e7eefa00000034 (QKI shuttles m7G-modified mRNAs into cytoplasmic
  stress granules, Human) has QKI with internal N(7)-methylguanine-containing RNA reader activity in mRNA
  transport, which is outside this module''s scope and is not pinned. No other SR protein, hnRNP or regulator
  in this module is in a production model. PANTHER family ids and PTNs are deliberately not asserted.'
proposed_new_terms:
- proposed_name: pre-mRNA exonic splicing enhancer binding
  proposed_definition: >-
    Binding to an exonic splicing enhancer, a short cis-acting sequence element within an exon of a pre-mRNA
    that promotes recognition and use of the adjacent splice sites.
  justification: >-
    The defining activity of SR proteins and TRA2 proteins is sequence-specific binding of exonic splicing
    enhancers. GO has GO:0097157 pre-mRNA intronic binding for intronic elements but no exonic counterpart,
    so the activator annotons in this module use the parent GO:0036002 pre-mRNA binding (or RNA binding
    where that is all the experimental evidence supports). The proposed term is the sibling of GO:0097157
    under GO:0036002.
  proposed_parent:
    id: GO:0036002
    label: pre-mRNA binding
  supported_by:
  - reference_id: PMID:9649504
    supporting_text: SR proteins recognize their cognate ESEs in nuclear extract by direct and specific
      binding
  - reference_id: PMID:9546399
    supporting_text: >-
      they bind efficiently and specifically to a previously characterized pre-mRNA splicing enhancer
      element
module:
  id: splice_site_selection_regulators
  label: Human splice-site selection regulators
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Enhancer-binding SR activators, silencer-binding hnRNP and SR-like repressors, and cell-type-specific
    regulators that set splice-site use by acting on early spliceosome assembly.
  concepts:
  - preferred_term: regulation of mRNA splicing, via spliceosome
    term:
      id: GO:0048024
      label: regulation of mRNA splicing, via spliceosome
  context:
    taxa:
    - preferred_term: Homo sapiens
      term:
        id: NCBITaxon:9606
        label: Homo sapiens
    cellular_components:
    - preferred_term: nucleoplasm
      term:
        id: GO:0005654
        label: nucleoplasm
  parts:
  - order: 1
    role: exonic splicing enhancer-dependent activation
    node:
      id: sr_activators
      label: Enhancer-binding SR and SR-like activators
      module_type: REGULATORY_STEP
      description: >-
        SR proteins and TRA2 proteins bind exonic splicing enhancers and promote recognition of the flanking
        splice sites. Several SR proteins repress particular exons when bound in other positions (SRSF4,
        SRSF7 and SRSF9 at tau exon 10), so the activator role is the predominant, not the only, outcome.
      concepts:
      - preferred_term: positive regulation of mRNA splicing, via spliceosome
        term:
          id: GO:0048026
          label: positive regulation of mRNA splicing, via spliceosome
      evidence:
      - source_id: PMID:9649504
        title: >-
          Identification of functional exonic splicing enhancer motifs recognized by individual SR proteins.
        statement: >-
          Individual SR proteins recognise distinct, degenerate ESE motifs and activate splicing from
          them.
        supporting_text: >-
          For SF2/ASF and SRp55, in most cases, only the cognate SR protein can efficiently recognize
          an ESE and activate splicing
      variant_sets:
      - id: sr_activator_members
        label: SR and SR-like activator family members
        axis: SR-protein paralogue and enhancer motif
        selection: ONE_OR_MORE
        variants:
        - id: srsf1_variant
          label: SRSF1 (SF2/ASF, SRp30a)
          module_type: REGULATORY_STEP
          annotons:
          - id: srsf1_activity
            label: SRSF1 (SF2/ASF, SRp30a) activates enhancer-dependent splice-site use
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SRSF1
                term:
                  id: UniProtKB:Q07955
                  label: Serine/arginine-rich splicing factor 1
            function:
              preferred_term: pre-mRNA binding
              term:
                id: GO:0036002
                label: pre-mRNA binding
            processes:
            - preferred_term: mRNA 5'-splice site recognition
              term:
                id: GO:0000395
                label: mRNA 5'-splice site recognition
            - preferred_term: positive regulation of RNA splicing
              term:
                id: GO:0033120
                label: positive regulation of RNA splicing
            role_description: >-
              Prototypical SR protein: binds purine-rich exonic splicing enhancers through its two RRMs
              and promotes exon definition and 5' splice site use, antagonising silencer-bound hnRNP A1.
              Function pre-mRNA binding is curator-authored from the direct ESE binding shown in PMID:9649504
              (its experimental GOA rows are RNA binding and mRNA binding).
            evidence:
            - source_id: PMID:9649504
              statement: >-
                SF2/ASF, SRp40 and SRp55 each recognise distinct ESE consensus motifs by direct and specific
                binding.
              supporting_text: SR proteins recognize their cognate ESEs in nuclear extract by direct and
                specific binding
            - source_id: PMID:11779509
              statement: >-
                SF2/ASF recognises ESE motifs and prevents the cooperative spreading of silencer-bound
                hnRNP A1 along the exon.
              supporting_text: only SF2/ASF prevents secondary hnRNP A1 binding
            - source_id: PMID:8940107
              statement: >-
                In transfected cells ASF/SF2 promoted inclusion of the fibronectin IIICS region (GOA IDA,
                mRNA 5'-splice site recognition).
              supporting_text: ASF/SF2 stimulated inclusion of the entire IIICS region
            gocam_associations:
            - model: gomodel:69a0c46f00001110
              activity: gomodel:69a0c46f00001110/69a0c46f00001370
              title: >-
                SRSF1 RNA binding (GO:0003723), FAM120A couples SREBP-dependent transcription and splicing
