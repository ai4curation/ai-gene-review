                (GOA IDA, regulation of mRNA splicing, via spliceosome; RNA binding).
              supporting_text: >-
                YTHDC1 promotes exon inclusion in targeted mRNAs through recruiting pre-mRNA splicing
                factor SRSF3 (SRp20) while blocking SRSF10 (SRp38) mRNA binding
        - id: srsf4_variant
          label: SRSF4 (SRp75)
          module_type: REGULATORY_STEP
          annotons:
