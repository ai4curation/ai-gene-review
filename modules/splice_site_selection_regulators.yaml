            label: SRSF2 (SC35) activates enhancer-dependent splice-site use
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SRSF2
                term:
                  id: UniProtKB:Q01130
                  label: Serine/arginine-rich splicing factor 2
            function:
              preferred_term: pre-mRNA binding
              term:
                id: GO:0036002
                label: pre-mRNA binding
            processes:
            - preferred_term: regulation of alternative mRNA splicing, via spliceosome
              term:
                id: GO:0000381
                label: regulation of alternative mRNA splicing, via spliceosome
            role_description: >-
              Single-RRM SR protein that binds exonic splicing enhancers and promotes splicing; its ESE-dependent
              activation is silenced by hnRNP A1 where SF2/ASF is not. Its experimental GOA function rows
              are only high-throughput RNA binding and its splicing-regulation process row is IBA; pre-mRNA
              binding is curator-authored from PMID:11779509.
            evidence:
            - source_id: PMID:11779509
              statement: >-
                SC35 recognises upstream ESE motifs of HIV-1 tat exon 3 and promotes splicing that the
                hnRNP A1-bound silencer blocks.
              supporting_text: Both SC35 and SF2/ASF recognize upstream ESE motifs
        - id: srsf3_variant
          label: SRSF3 (SRp20)
          module_type: REGULATORY_STEP
          annotons:
