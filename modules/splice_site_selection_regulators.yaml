  - order: 4
    role: regulated step (stand-in for the sibling major_spliceosome_cycle E/A state)
    node:
      id: early_spliceosome_assembly
      label: Early (E) complex and prespliceosome (A complex) assembly
      module_type: BIOLOGICAL_PROCESS
      description: >-
        Recognition of the 5' splice site by U1 snRNP and of the branch point and 3' splice site by SF1
        and U2AF (E complex), followed by stable U2 snRNP addition (A complex). This is the step the regulators
        act on. It is modelled, with its proteins, in the sibling module major_spliceosome_cycle; this
        node only names it as the regulatory target and carries no annotons.
      concepts:
      - preferred_term: U2-type prespliceosome assembly
        term:
          id: GO:1903241
          label: U2-type prespliceosome assembly
  connections:
  - source: sr_activators
    target: early_spliceosome_assembly
    connection_type: POSITIVELY_REGULATES
    description: >-
      Enhancer-bound SR and TRA2 proteins recruit and stabilise U1 snRNP and U2AF at the flanking splice
      sites.
  - source: silencer_repressors
    target: early_spliceosome_assembly
    connection_type: NEGATIVELY_REGULATES
    description: >-
      Silencer-bound hnRNPs block U1 snRNP or U2AF65 binding, or antagonise enhancer-bound SR proteins
      (hnRNP C competes directly with U2AF65 at 3' splice sites).
  - source: silencer_repressors
    target: sr_activators
    connection_type: NEGATIVELY_REGULATES
    description: >-
      Antagonism between silencer-bound and enhancer-bound factors on the same exon: hnRNP A1 against
      SC35 and SF2/ASF (PMID:11779509), hnRNP A1 and RBMX against TRA2B (PMID:25689357, PMID:12761049),
      and SRSF10 and SRSF12 against authentic SR proteins (PMID:11684676).
