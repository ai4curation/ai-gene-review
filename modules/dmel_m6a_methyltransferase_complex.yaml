id: MODULE:dmel_m6a_methyltransferase_complex
title: mRNA m6A methyltransferase complex in Drosophila melanogaster
description: >-
  N6-methyladenosine (m6A) is deposited on mRNA co-transcriptionally by a methyltransferase
  complex. Its catalytic core is the Mettl3-Mettl14 heterodimer, in which Mettl3 is the active
  methyltransferase and Mettl14 an inactive partner that supports RNA binding. A regulatory
  subcomplex (MACOM) of Fl(2)d, Virilizer (vir), the E3 ligase Hakai, Flacc and the RNA-binding
  protein Spenito (nito) is required for m6A deposition and specificity. In Drosophila, m6A
  modification by this complex regulates Sex-lethal pre-mRNA splicing in sex determination
  and contributes to neuronal function.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000702
  title: 'FlyBase gene group MTC: M6a methyltransferase complex'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as m6a methyltransferase complex
    (MTC); this module models that group.
- source_id: GO:0036396
  title: RNA N6-methyladenosine methyltransferase complex
  statement: >-
    GO term grounding the module as RNA N6-methyladenosine methyltransferase complex.
notes: >-
  Boundary. m6A readers (Ythdc1, Ythdf) and the snRNA methyltransferase Mettl16 are outside
  the module. FlyBase groups realized by this module: MTC (FBgg0000702). Participants were
