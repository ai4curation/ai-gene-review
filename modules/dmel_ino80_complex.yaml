id: MODULE:dmel_ino80_complex
title: INO80 chromatin remodeling complex in Drosophila melanogaster
description: >-
  The INO80 complex is an ATP-dependent chromatin remodeler of the INO80 subfamily that slides
  nucleosomes and positions the +1 nucleosome at promoters, and contributes to transcription
  regulation and DNA repair. In Drosophila it contains the Ino80 ATPase, the AAA+ ATPases
  Pontin and Reptin, actin and the actin-related proteins Arp5 and Arp8. FlyBase also places
  the Polycomb group DNA-binding protein Pho (the YY1 homolog) in the complex, consistent
  with a role of INO80 in recruiting Polycomb proteins.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000291
  title: 'FlyBase gene group INO80: Ino80 complex'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as ino80 complex (INO80); this
    module models that group.
- source_id: GO:0031011
  title: Ino80 complex
  statement: >-
    GO term grounding the module as Ino80 complex.
notes: >-
  Grouping of actin, Arp5 and Arp8 together is a coarse simplification; in yeast Arp8 and
  actin bind the HSA region while Arp5 binds the ATPase. Pho is included because FlyBase lists
  it as an INO80 subunit; it is also modelled in the PhoRC part of dmel_polycomb_group_complexes.
  FlyBase groups realized by this module: INO80 (FBgg0000291). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_ino80_complex.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
