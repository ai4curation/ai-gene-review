id: MODULE:irf3_irf7_interferon_induction
title: IRF3/IRF7 interferon-induction module
description: >-
  The shared signalling arm that turns innate-immune sensor activation into
  transcription of the type I interferon genes. Two routes phosphorylate the
  latent cytosolic transcription factors IRF3 and IRF7. In the adaptor-licensed
  route, the adaptors STING, MAVS and TRIF (downstream of cGAS, RIG-I/MDA5 and
  TLR3/TLR4) recruit the IKK-related kinase TBK1 or IKBKE, are phosphorylated
  on a conserved pLxIS motif, and use it to present IRF3 to the kinase. In
  plasmacytoid dendritic cells, TLR7 and TLR9 signal through MYD88, IRAK4,
  TRAF6, IRAK1 and IKK-alpha to phosphorylate IRF7. Phosphorylated IRFs
  dimerize and enter the nucleus. There they bind CBP/p300 and assemble with
  NF-kappaB and ATF-2/c-Jun on the interferon-beta enhancer, or drive the
  interferon-alpha genes. The sensors and receptors are modelled in their own
  modules; this module starts at the adaptor or the receptor-proximal adaptor
  and ends at interferon gene transcription.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: PMID:16979567
  statement: Type I interferon induction is controlled at transcription, mainly by IRFs.
  supporting_text: The type I IFN induction is primarily controlled at the gene transcriptional level,
    wherein a family of transcription factors, interferon regulatory factors (IRFs), plays central
    roles.
- source_id: PMID:27302953
  statement: The DNA, RNA and LPS sensing pathways converge on recruitment and activation of IRF3.
  supporting_text: These signaling pathways converge at the recruitment and activation of the transcription
    factor IRF-3 (IFN regulatory factor 3).
- source_id: PMID:15800576
  statement: IRF7 is required for interferon-alpha/beta induction through both the MyD88-independent
    and the MyD88-dependent pathways.
  supporting_text: the transcription factor IRF-7 is essential for the induction of IFN-alpha/beta genes
    via the virus-activated, MyD88-independent pathway and the TLR-activated, MyD88-dependent pathway
proposed_new_terms:
- proposed_name: IRF3/IRF7 signal transduction
  proposed_definition: >-
    An intracellular signaling cassette characterized by the phosphorylation-dependent
    activation of the transcription factor IRF3 and/or IRF7, by the IKK-related kinases
    TBK1 or IKBKE or by IRAK1 and IKK-alpha, followed by IRF dimerization and
    translocation to the nucleus, and ending with the regulation of transcription of
    target genes such as the type I interferon genes.
  justification: >-
    The arm is shared by the cGAS/STING, RIG-I/MDA5, TRIF-dependent TLR and
    MyD88-dependent TLR7/TLR9 pathways, in the way GO:0007249 canonical NF-kappaB
    signal transduction and GO:0060395 SMAD protein signal transduction are shared by
    theirs; both of those are intracellular signaling cassettes. GO has no process
    term for this arm. Production GO-CAMs therefore place its steps under GO:0032481
    positive regulation of type I interferon production, a regulation term named for
    the output, and file the same TBK1 and IRF3 activities under several different
    processes from model to model (projects/PRODUCTION_TERMS.md).
  proposed_parent:
    id: GO:0141124
    label: intracellular signaling cassette
  supported_by:
  - reference_id: PMID:27302953
    supporting_text: These signaling pathways converge at the recruitment and activation of the transcription
      factor IRF-3
  - reference_id: PMID:12702806
    supporting_text: the IkappaB kinase (IKK)-related kinases IKKepsilon and TANK-binding kinase 1 are
      components of the virus-activated kinase that phosphorylate IRF-3 and IRF-7
knowledge_gaps:
- gap_statement: The nuclear import receptor that carries phosphorylated IRF3 (and IRF7) dimers into
    the nucleus is not settled. IRF3 has a nuclear localization signal, and importin-5 (IPO5) has been
    reported to import it, but no importin has been shown to be required in infected cells.
  boundary: Affects the irf_nuclear_import step, which includes the karyopherin module by reference
    without naming the importin used by IRF cargo.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: The import step is where several viral and host inhibitors act (for example DDX56 on
    the IRF3-IPO5 interaction), so the carrier determines which of them can block interferon induction.
  resolution: Knock out or deplete candidate importins and measure nuclear accumulation of phosphorylated
    IRF3 and IRF7 and interferon-beta transcription after infection.
  provenance:
  - reference_id: PMID:31340999
    reference_section_type: ABSTRACT
    supporting_text: mechanisms for the control and regulation of IRF3 nuclear import remain largely unknown
  - reference_id: PMID:10805757
    reference_section_type: ABSTRACT
    supporting_text: We identify a nuclear localization signal (NLS) in IRF-3 that is critical for nuclear
      accumulation.
module:
  id: irf3_irf7_interferon_induction
  label: IRF3/IRF7 interferon induction
  module_type: SIGNALING_PATHWAY
  description: >-
    IRF kinase activation by one of two routes, then IRF dimerization and nuclear
    import, then interferon gene transcription. GO has no process term for the arm
    itself; the module concept is the regulation term GO uses for its output, and a
    new term is proposed (see proposed_new_terms).
  concepts:
  - preferred_term: positive regulation of type I interferon production
    term:
      id: GO:0032481
      label: positive regulation of type I interferon production
  context:
    taxa:
    - preferred_term: vertebrates
      term:
        id: NCBITaxon:7742
        label: Vertebrata <vertebrates>
  parts:
  - order: 1
    role: IRF kinase activation
    node:
      id: irf_kinase_activation
      label: IRF kinase activation
      module_type: REGULATORY_STEP
      description: >-
        A kinase phosphorylates the C-terminal serine cluster of IRF3 or IRF7. Which
        kinase, and which IRF, depends on the upstream receptor.
      variant_sets:
      - id: irf_activation_route
        label: Route to IRF phosphorylation
        axis: adaptor and kinase route
        variant_kind: ROUTE
        selection: ONE_OR_MORE
        notes: The adaptor-licensed TBK1/IKBKE route serves cytosolic DNA and RNA sensing and TLR3/TLR4
          in most cell types and activates IRF3 (and IRF7 where it is expressed). The MyD88 route is the
          TLR7/TLR9 route of plasmacytoid dendritic cells and activates IRF7.
        evidence:
        - source_id: PMID:16286015
          statement: In human cells, TLR7/8/9-induced interferon needs IRAK4, but TLR3- and TLR4-induced
            interferon does not.
          supporting_text: IFN-alpha/beta and -lambda induction via TLR-7, TLR-8, and TLR-9 was abolished
            in IRAK-4-deficient blood cells. In contrast, IFN-alpha/beta and -lambda were induced normally
            by TLR-3 and TLR-4 agonists.
        variants:
        - id: adaptor_licensed_tbk1_route
          label: Adaptor-licensed TBK1/IKBKE route
          module_type: REGULATORY_STEP
          description: >-
            The adaptor recruits TBK1 or IKBKE and is phosphorylated by it on a pLxIS
            motif; the phosphorylated motif binds IRF3 and positions it for
            phosphorylation by the same kinase. Scaffold proteins of the TANK family
            hold the kinase, and for MAVS and TRIF, TRAF3 self-ubiquitination is
            needed to bring it in.
          parts:
          - order: 1
            role: adaptor licensing
            node:
              id: adaptor_licensing
              label: pLxIS adaptor licensing
              module_type: REGULATORY_STEP
              description: >-
                Three adaptors carry the pLxIS motif, one for each sensor family. Each
                is a realizer of the same role.
