  connections:
  - source: irf_kinase_activation
    target: irf_dimerization_import
    connection_type: PRECEDES
    description: Phosphorylation of the IRF C-terminal serine cluster is what licenses dimerization and
      nuclear accumulation.
  - source: irf_dimerization_import
    target: interferon_gene_transcription
    connection_type: PRECEDES
    description: The nuclear IRF dimer is the activator that binds the interferon gene regulatory elements.
notes: >-
  First module of projects/PRODUCTION_TERMS.md. It exists because 21 production
  GO-CAMs file every step of this arm under GO:0032481 positive regulation of
  type I interferon production, a regulation term named for the output, and
  because the same TBK1 and IRF3 activities are filed under five or more
  different processes from model to model. The module gives the steps one home,
  names the interferon genes as the transcription factor's targets (17 of those
  21 models name no interferon gene), and proposes the missing process term.
  Boundary: it starts at the pLxIS adaptor or the MyD88 complex and ends at
  interferon gene transcription. The sensors and receptors upstream are in
  modules/cgas_sting_signaling.yaml, modules/rig_i_signaling.yaml and
  modules/tlr4_md2_lps_signaling.yaml, which each carry their own copy of the
  TBK1-to-IRF3 step as the tail of their pathway; this module is the shared arm
  those tails instantiate, and the overlap is deliberate rather than a
  duplication to resolve by deleting either side. Signalling by the interferon
  that results is modules/type_i_interferon_signaling.yaml. NF-kappaB activation,
  which the same adaptors and kinases also drive, is
  modules/nfkb_canonical_signaling.yaml: the enhanceosome needs both, so neither
  module is complete on its own. IRF5 is left out; it is activated by the same
  kinases but drives inflammatory cytokines rather than interferon.
