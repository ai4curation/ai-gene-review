                  supporting_text: The adaptor proteins STING (stimulator of IFN genes), MAVS (mitochondrial
                    antiviral signaling), and TRIF (TIR domain-containing adaptor inducing IFN-β) mediate
                    the recruitment of IRF-3 through a conserved pLxIS motif.
                - source_id: PMID:25636800
