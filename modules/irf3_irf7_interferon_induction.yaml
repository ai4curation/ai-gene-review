            id: GO:0005634
            label: nucleus
        role_description: The constitutively expressed IRF of most cell types; the main activator of the
          interferon-beta gene in the first wave of the response.
        evidence:
        - source_id: PMID:17574024
          statement: The interferon-beta enhanceosome contains ATF-2/c-Jun, IRF3/IRF7 and NF-kappaB.
          supporting_text: Transcriptional activation of the interferon-beta (IFN-beta) gene requires assembly
            of an enhanceosome containing ATF-2/c-Jun, IRF-3/IRF-7, and NFkappaB.
        - source_id: PMID:9660935
          statement: IRF3 and IRF7 are recruited to the endogenous interferon-beta promoter together with
            p300/CBP, ATF-2/c-Jun and NF-kappaB.
          supporting_text: in virus-infected cells, both proteins are recruited to the endogenous IFN-beta
            promoter as part of a protein complex that includes ATF-2/c-Jun and NF-kappa B
        gocam_associations:
        - model: gomodel:62b4ffe300000418
          activity: gomodel:62b4ffe300000418/62b4ffe300000438
          title: Poxvirus-CRMA inhibition of cGAS-STING signaling (Human-Poxvirus)
          notes: This model does name IFNB1 as the input of the IRF3 activity; most models in this family
            do not (see projects/PRODUCTION_TERMS.md).
        - model: gomodel:62b4ffe300003074
          activity: gomodel:62b4ffe300003074/62b4ffe300003110
          title: Poxvirus-OPG029 inhibition of host TBK1 adaptor TANK (Human-Poxvirus)
          notes: Same role; the model types IRF3 with the parent GO:0000981.
      - id: irf7_transcription_activator
        label: IRF7 transcription activator
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: IRF7
            term:
              id: UniProtKB:Q92985
              label: Interferon regulatory factor 7
        function:
          preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
          term:
            id: GO:0001228
            label: DNA-binding transcription activator activity, RNA polymerase II-specific
          targets:
          - preferred_term: IFNA2
            term:
              id: UniProtKB:P01563
              label: Interferon alpha-2
            description: IRF7 is required for the interferon-alpha genes, which IRF3 cannot drive on its own.
          - *ifnb1_target
        locations: *nucleus_location
        role_description: Required for both the interferon-alpha and the amplified interferon-beta
          response; the dominant IRF of the plasmacytoid dendritic cell route, and itself interferon-inducible.
        evidence:
        - source_id: PMID:15800576
          statement: IRF7 is essential for interferon-alpha/beta induction by both routes, and Irf7-/- mice
            lose the systemic interferon response.
          supporting_text: Consistently, Irf7-/- mice are more vulnerable than Myd88-/- mice to viral infection,
            and this correlates with a marked decrease in serum IFN levels
        - source_id: PMID:16846591
          statement: IRF3 and IRF7 are the major modulators of interferon gene expression, activated by
            TBK1/IKBKE phosphorylation.
          supporting_text: Activation of IRF-3 and IRF-7 by TBK1/IKKvarepsilon mediated phosphorylation
