  - order: 2
    role: IRF dimerization and nuclear import
    node:
      id: irf_dimerization_import
      label: IRF dimerization and nuclear import
      module_type: TRANSPORT_STEP
      description: >-
        Phosphorylation of the C-terminal serine cluster releases the
        autoinhibited conformation, the IRF dimerizes, and the dimer accumulates
        in the nucleus. This is the step that GO-CAM models of this pathway
        compress into a single causal edge from a cytosolic kinase to a nuclear
        IRF transcription factor activity (see projects/GOCAM_COMPARTMENTS.md).
        Dimerization is a change of state of the IRFs themselves; import uses
        other gene products, included here by reference. IRF3 is exported from
        resting nuclei, so the switch is a change in the balance of import and
        export, not the appearance of a new signal.
      parts:
      - order: 1
        role: IRF dimerization
        node:
          id: irf_dimerization
          label: Phospho-IRF dimerization
          module_type: REGULATORY_STEP
          description: >-
            The phosphorylated C-terminal autoinhibitory domain extends and the
            subunits pair, giving an IRF3 homodimer or an IRF3-IRF7 heterodimer.
            No other gene product is needed.
          annotons:
          - id: irf_dimer_formation
            label: Phospho-IRF dimer formation
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: interferon regulatory factor complex
                term:
                  id: GO:0097071
                  label: interferon regulatory factor complex
                description: An IRF3 homodimer, or an IRF3-IRF7 heterodimer; in plasmacytoid dendritic
                  cells, IRF7 dimers.
            function:
              preferred_term: protein dimerization activity
              term:
                id: GO:0046983
                label: protein dimerization activity
              description: Phosphorylation-dependent pairing of the extended C-terminal domains.
            locations:
            - *cytosol_location
            role_description: Converts the phosphorylated monomer into the dimer that the import machinery
              and the enhancer recognize.
            evidence:
            - source_id: PMID:14703513
              statement: IRF3 phosphorylation induces dimerization and binding of CBP/p300, and the complex
                then activates target genes in the nucleus.
              supporting_text: This phosphorylation induces dimerization and association with the coactivators
                CREB-binding protein/p300, and the resultant complex activates the target genes in the nucleus.
            - source_id: PMID:9566918
              statement: Virus infection phosphorylates IRF3 on C-terminal serine and threonine residues.
              supporting_text: IRF-3 is posttranslationally modified by protein phosphorylation at multiple
                serine and threonine residues, which are located in the carboxy terminus of IRF-3
      - order: 2
        role: IRF nuclear import
        node:
          id: irf_nuclear_import
          label: IRF dimer nuclear import
          module_type: TRANSPORT_STEP
          description: >-
            The phospho-IRF dimer is carried through the nuclear pore by the
            karyopherin import cycle, included here by reference. IRF3 has a
            nuclear localization signal and in resting cells is exported by
            CRM1/exportin-1, so it shuttles; which importin carries the activated
            dimer is not settled (see knowledge_gaps), and importin-5 (IPO5) is
            the best-supported candidate.
          module_ref: karyopherin_nuclear_protein_import
          evidence:
          - source_id: PMID:10805757
            statement: IRF3 has a nuclear localization signal and accumulates in the nucleus after
              infection and phosphorylation, where it associates with CBP and p300.
            supporting_text: Following infection and specific phosphorylation, IRF-3 accumulates in the
              nucleus where it associates with CBP and p300.
          - source_id: PMID:10805757
            statement: Resting IRF3 is held in the cytoplasm by CRM1-dependent export.
            supporting_text: The cytoplasmic localization of IRF-3 is dependent on a nuclear export signal,
              and we demonstrate IRF-3 recognition by the chromosome region maintenance 1 (CRM1) (also
              known as exportin 1) shuttling receptor.
          - source_id: PMID:31340999
            statement: IRF3 nuclear import has been reported to use IPO5, and a viral-induced inhibitor
              acts by breaking that interaction.
            supporting_text: Overexpression of DDX56 suppressed nuclear translocation of IRF3 via disrupting
              the IRF3-IOP5 interaction
      connections:
      - source: irf_dimerization
        target: irf_nuclear_import
        connection_type: PRECEDES
        description: The phospho-IRF dimer is the cargo of the import cycle.
  - order: 3
    role: interferon gene transcription
    node:
      id: interferon_gene_transcription
      label: Interferon gene transcription
      module_type: REGULATORY_STEP
      description: >-
        In the nucleus the IRF dimer binds the interferon gene regulatory
        elements and recruits CBP or p300. At the interferon-beta enhancer the IRF
        dimer occupies PRDIII-I alongside NF-kappaB and ATF-2/c-Jun in the
        enhanceosome, which is why this module ends at transcription and does not
        claim to be the only input to the gene. The interferon genes are named
        here as the targets of the transcription factor activity: the output is a
        gene product, not a free-standing "production" process.
      concepts:
      - preferred_term: positive regulation of interferon-beta production
        term:
          id: GO:0032728
          label: positive regulation of interferon-beta production
      - preferred_term: positive regulation of interferon-alpha production
        term:
          id: GO:0032727
          label: positive regulation of interferon-alpha production
      annotons:
      - id: irf3_transcription_activator
        label: IRF3 transcription activator
        participant:
