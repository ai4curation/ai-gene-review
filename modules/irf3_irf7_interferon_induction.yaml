              term:
                id: UniProtKB:Q92793
                label: Histone lysine acetyltransferase CREBBP
            - preferred_term: EP300
              term:
                id: UniProtKB:Q09472
                label: Histone acetyltransferase p300
        function:
          preferred_term: transcription coactivator activity
          term:
            id: GO:0003713
            label: transcription coactivator activity
        locations: *nucleus_location
        role_description: Binds the hydrophobic surface exposed by IRF phosphoactivation and is required
