id: MODULE:dmel_chromosomal_passenger_complex
title: Chromosomal passenger complexes in Drosophila melanogaster
description: >-
  The chromosomal passenger complex (CPC) moves from centromeres in early mitosis to the spindle
  midzone and midbody in anaphase and telophase. Its enzymatic subunit Aurora B kinase phosphorylates
  kinetochore substrates to correct erroneous microtubule attachments, supports the spindle
  assembly checkpoint and later promotes cytokinesis. INCENP binds and activates Aurora B
  and links it to the localization module, formed by Survivin (Deterin in Drosophila) and
  Borealin. In Drosophila male meiosis the Borealin paralog Australin replaces Borealin in
  a meiotic CPC.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000127
  title: 'FlyBase gene group CPC: Chromosomal passenger complexes'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as chromosomal passenger complexes
    (CPC); this module models that group.
- source_id: GO:0032133
  title: chromosome passenger complex
  statement: >-
    GO term grounding the module as chromosome passenger complex.
notes: >-
  FlyBase subgroups CPC-MIT and CPC-MEI share aurB, Incenp and Det and differ only in Borealin
  (borr) or Australin (aust); the shared kinase module is modelled once and the localization
  module as variants. FlyBase groups realized by this module: CPC (FBgg0000127). Subgroups
  folded into it: CPC-MIT, CPC-MEI. Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_chromosomal_passenger_complex.yaml; none of the member genes has a gene
  review yet unless noted.
