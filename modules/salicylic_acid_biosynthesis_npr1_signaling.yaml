id: MODULE:salicylic_acid_biosynthesis_npr1_signaling
title: Salicylic acid biosynthesis (isochorismate route) and NPR1-dependent defence signalling
description: >-
  After pathogen attack Arabidopsis makes most of its salicylic acid (SA) from chorismate through
  isochorismate. In the chloroplast stroma, isochorismate synthase 1 (ICS1, also SID2/EDS16)
  isomerizes chorismate to isochorismate; this is the committed, pathogen-induced step, and its
  paralog ICS2 contributes little. The MATE transporter EDS5 exports isochorismate to the cytosol,
  where the GH3 amidotransferase PBS3 conjugates it with glutamate to isochorismate-9-glutamate, which
  decomposes, spontaneously or with the help of the acyltransferase EPS1, into SA. SA is perceived by
  the NPR protein family: the paralogs NPR3 and NPR4 bind SA with high affinity and act as
  CUL3-ligase adaptors that control NPR1 turnover, while NPR1 itself has been reported to bind SA
  more weakly, although the relative roles of NPR1 and NPR3/NPR4 as SA receptors are debated. SA-induced
  changes in cellular redox reduce cytoplasmic NPR1 oligomers to monomers that enter the nucleus,
  where NPR1 acts as a transcription coregulator. Sumoylated NPR1 switches from WRKY repressors to TGA
  transcription factors and activates defence genes such as PR1, and NPR1 directly induces a set of
  WRKY transcription factor genes. One of these, WRKY70, is a sequence-specific transcription factor
  that promotes SA-induced pathogenesis-related gene expression, represses jasmonate-responsive
  genes and, together with WRKY54, restrains SA biosynthesis, forming a negative feedback loop. Together these steps drive local resistance and systemic acquired resistance (SAR) against
  biotrophic pathogens.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:11734859
    title: Isochorismate synthase is required to synthesize salicylic acid for plant defence.
    statement: Pathogen-induced SA in Arabidopsis is made through ICS, and this SA is required for local
      and systemic acquired resistance.
    supporting_text: SA made by this pathway is required for LAR and SAR responses.
  - source_id: PMID:31371615
    title: Isochorismate-derived biosynthesis of the plant stress hormone salicylic acid.
    statement: Downstream of ICS1, isochorismate conversion to SA needs only EDS5 (plastid export) and
      PBS3 (glutamate conjugation in the cytosol).
    supporting_text: the pathway downstream of isochorismate requires only two additional proteins
  - source_id: PMID:17096590
    title: A genomic approach to identify regulatory nodes in the transcriptional network of systemic
      acquired resistance in plants.
    statement: SAR is a transcriptional cascade induced by SA through NPR1, which directly induces WRKY
      transcription factor genes.
    supporting_text: Systemic acquired resistance (SAR) is an inducible plant defense response involving
      a cascade of transcriptional events induced by salicylic acid through the transcription cofactor
      NPR1.
  - source_id: PMID:22699612
    title: NPR3 and NPR4 are receptors for the immune signal salicylic acid in plants.
    statement: NPR3 and NPR4 are SA receptors that act as CUL3 adaptors for NPR1 degradation.
    supporting_text: NPR3 and NPR4 function as adaptors of the Cullin 3 ubiquitin E3 ligase to mediate
      NPR1 degradation in an SA-regulated manner.
notes: >-
  Boundary. The module runs from chorismate in the plastid to NPR1-dependent transcription of SA
  defence genes, including the NPR1-induced transcription factor WRKY70. It ends at transcription of
  pathogenesis-related genes; the antimicrobial activities of PR proteins, SA catabolism and
  conjugation (SA glucosides, methyl salicylate, 2,3- and 2,5-DHBA), and the N-hydroxypipecolic acid
  (NHP) branch of systemic acquired resistance (ALD1, SARD4, FMO1) are outside it. The phenylalanine
  ammonia-lyase route to SA, which supplies a minor share of pathogen-induced SA in Arabidopsis, is
  not modelled. SA-JA antagonism is recorded only as the WRKY70 repression of JA-responsive genes; the
  jasmonate pathway itself is MODULE:jasmonate_coi1_jaz_signaling.

  EDS1 and PAD4 are upstream inputs, not parts. EDS1 and PAD4 are required for pathogen-induced SA
  accumulation and amplify SA-dependent defence (PMID:11574472), and both gene reviews give
  GO:0009862 among their core processes. They do not catalyse any SA biosynthetic step and are not
  part of NPR1-dependent transcription: they act upstream, as the ligand-responsive EDS1-PAD4 adaptor
  complex that receives TIR-NLR-derived nucleotide signals and promotes ICS1 expression and SA
  accumulation. That activity (signaling adaptor activity, GO:0035591, the core molecular function in
  both gene reviews) is already modelled as the EDS1-PAD4-ADR1 variant of part 3 of
  MODULE:plant_nlr_resistosome_signaling (annoton eds1_pad4_receptor). Repeating it here would
  duplicate that annoton, so the link is recorded in prose; EDS1-PAD4 feeds this module at the level
  of ICS1 induction. Their transcriptional route to ICS1 (via SARD1 and CBP60g) is not modelled
  because those regulators have no gene reviews here.

  RPM1 and RPS2 are NLR receptors whose activation leads to SA accumulation; they belong to
  effector-triggered immunity (MODULE:plant_nlr_resistosome_signaling) and are not parts here. FLS2,
  EFR and other surface pattern recognition receptors also induce SA; their early signalling is a
  separate pattern-triggered immunity module (FLS2/EFR-BAK1), not part of this one.

  Biosynthesis steps without gene reviews. EDS5 (isochorismate export), PBS3 (isochorismate-9-glutamate
  synthesis) and EPS1 (acceleration of IC-9-Glu breakdown) are established pathway members
  (PMID:31371615) but have no gene reviews in this repository, so they are named in the description
  and the biosynthesis part description, not grounded as annotons. Isochorismate also feeds
  phylloquinone biosynthesis (ICS1 review second core function), which is outside this module.

  SA perception. NPR3 and NPR4 bind SA with high affinity and act as CUL3 E3-ligase adaptors
  controlling NPR1 turnover (PMID:22699612); NPR1 binds SA comparatively weakly in the assays of
  PMID:32788727, although reported NPR1 SA-binding affinities vary between studies and the competing
  model in which NPR1 is the principal SA receptor (with NPR3/NPR4 as co-repressors) is still argued
  in the field. The module therefore treats SA perception as unresolved between NPR1 and NPR3/NPR4,
  and the NPR1 review does not assert SA binding or receptor activity for NPR1. NPR3/NPR4 and the TGA transcription factors
  (TGA2, TGA3, TGA5, TGA6) have no gene reviews here, so the SA-perception step and the TGA partners
  are named in prose and the NPR1 annoton carries only the transcription coregulator activity from its
  review.

  WRKY70. WRKY70 is placed downstream of NPR1: its full SA induction needs NPR1, epistasis puts it
  downstream of NPR1, and NPR1 directly induces WRKY genes. The WRKY70 review asserts DNA-binding
  transcription factor activity with positive regulation of SA-mediated signalling as its core
  process. Saleh et al. 2015 instead describe WRKY70 as a transcriptional repressor that unmodified
  NPR1 associates with. PMID:17096590 reports a dual role for WRKY70 and WRKY54: wrky70 and wrky54
  wrky70 mutants over-accumulate ICS1 transcript and SA without constitutive PR gene expression, so
  WRKY70 represses SA biosynthesis while positively transducing the SA signal. This is recorded as a
  negative-regulation connection from the WRKY70 step back to the ICS1 step. The dual-role finding
  partly reconciles the activator and repressor framings, but the direct targets remain undefined
  (see knowledge gaps).

  Grounding. Gene reviews ground ICS1, NPR1 and WRKY70 (ARATH); EDS1 and PAD4 are cited in notes. No
  PANTHER family ids are asserted. No production GO-CAM in gocams/index.tsv contains these proteins.

  Curation follow-ups (not knowledge gaps). Review EDS5, PBS3, EPS1, NPR3, NPR4, TGA2/TGA3, SARD1 and
  CBP60g, then add them as members (biosynthesis steps 2-3, the SA-perception step, the TGA partners
  of NPR1, and the transcriptional induction of ICS1). A separate NHP biosynthesis module (ALD1, SARD4,
  FMO1) would complete systemic acquired resistance.
module:
  id: salicylic_acid_biosynthesis_npr1_signaling
  label: Salicylic acid biosynthesis and NPR1 signalling
  module_type: SIGNALING_PATHWAY
  description: >-
    Isochorismate-route salicylic acid biosynthesis initiated by ICS1 in the plastid, SA-triggered
    activation of the transcription coregulator NPR1 in the nucleus, and NPR1-induced WRKY70
    transcription factor activity driving SA-responsive defence gene expression.
  concepts:
    - preferred_term: salicylic acid biosynthetic process
      term:
        id: GO:0009697
        label: salicylic acid biosynthetic process
      description: Part 1 (the ICS1 step, with the EDS5/PBS3 steps described in prose).
    - preferred_term: systemic acquired resistance, salicylic acid mediated signaling pathway
      term:
        id: GO:0009862
        label: systemic acquired resistance, salicylic acid mediated signaling pathway
      description: Parts 2 and 3; the NPR1 review uses this term as a core process.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: Concrete Arabidopsis instance. The share of SA made through isochorismate versus
          phenylalanine differs between plant species.
  parts:
    - order: 1
      role: isochorismate-route SA biosynthesis (committed step, ICS1)
      node:
        id: sa_biosynthesis
        label: Chorismate to isochorismate (ICS1)
        module_type: REACTION
        description: >-
          Mg2+-dependent, reversible isomerization of chorismate to isochorismate in the chloroplast
          stroma (RHEA:18985). ICS1 is monofunctional and does not make SA itself. Isochorismate is then
          exported to the cytosol by EDS5 and conjugated to glutamate by PBS3; the resulting
          isochorismate-9-glutamate breaks down to SA spontaneously or with EPS1. Those later steps are
          not grounded as annotons (see module notes).
        annotons:
          - id: ics1_activity
            label: "ICS1: isochorismate synthase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ICS1 / SID2 (Arabidopsis)
                term:
                  id: UniProtKB:Q9S7H8
                  label: Isochorismate synthase 1, chloroplastic
            function:
              preferred_term: isochorismate synthase activity
              term:
                id: GO:0008909
                label: isochorismate synthase activity
              substrates:
                - preferred_term: chorismate
              products:
                - preferred_term: isochorismate
              evidence:
                - source_id: PMID:17190832
                  statement: ICS1 is a stromal, monofunctional isochorismate synthase; additional
                    enzymes convert isochorismate to SA.
                  supporting_text: AtICS1 is a plastid-localized, stromal protein using chloroplast
                    import assays and immunolocalization. AtICS1 acts as a monofunctional isochorismate
                    synthase
                - source_id: PMID:31371615
                  statement: Most pathogen-induced SA derives from isochorismate made by ICS1.
                  supporting_text: Most pathogen-induced SA derives from isochorismate, which is
                    generated from chorismate by the catalytic activity of ISOCHORISMATE SYNTHASE1.
                - source_id: file:ARATH/ICS1/ICS1-ai-review.yaml
                  statement: Core function GO:0008909 (GO:0009697) in the chloroplast in the ICS1 gene
                    review.
            processes:
              - preferred_term: salicylic acid biosynthetic process
                term:
                  id: GO:0009697
                  label: salicylic acid biosynthetic process
            locations:
              - preferred_term: chloroplast
                term:
                  id: GO:0009507
                  label: chloroplast
            role_description: Committed, pathogen-induced step. The paralog ICS2 (unequal redundancy)
              is not added as a member; it contributes SA detectably only in ics1 mutants
              (PMID:18451262).
    - order: 2
      role: SA-activated NPR1 transcription coregulator
      node:
        id: npr1_coregulator
        label: NPR1 transcriptional coregulation of SA defence genes
        module_type: MOLECULAR_FUNCTION
        description: >-
          SA accumulation reduces cytoplasmic NPR1 oligomers to monomers that move to the nucleus. There
          NPR1 forms complexes with TGA transcription factors at as-1 elements to activate PR genes;
          sumoylation switches NPR1 from WRKY repressors to TGA activators and also triggers its
          turnover through NPR3/NPR4-CUL3, which keeps induction transient.
        annotons:
          - id: npr1_activity
            label: "NPR1: transcription coregulator"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NPR1 (Arabidopsis)
                term:
                  id: UniProtKB:P93002
                  label: Regulatory protein NPR1
            function:
              preferred_term: transcription coregulator activity
              term:
                id: GO:0003712
                label: transcription coregulator activity
              evidence:
                - source_id: PMID:26269953
                  statement: Sumoylation switches NPR1 from WRKY repressors to TGA activators to induce
                    defence genes.
                  supporting_text: sumoylation of NPR1 by SUMO3 activates defense gene expression by
                    switching NPR1's association with the WRKY transcription repressors to TGA
                    transcription activators
                - source_id: PMID:17096590
                  statement: NPR1 directly up-regulates WRKY transcription factor genes.
                  supporting_text: We show that NPR1 directly upregulates the expression of eight WRKY
                    transcription factor genes.
                - source_id: file:ARATH/NPR1/NPR1-ai-review.yaml
                  statement: Core function GO:0003712 (GO:0009862, GO:0042742) in the nucleus in the
                    NPR1 gene review.
            processes:
              - preferred_term: systemic acquired resistance, salicylic acid mediated signaling pathway
                term:
                  id: GO:0009862
                  label: systemic acquired resistance, salicylic acid mediated signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Transcription coregulator; it binds DNA only through TGA partners. Its
              own SA binding is reported as weaker than that of NPR3 and NPR4, but whether NPR1 or
              NPR3/NPR4 is the principal SA receptor is debated (see module notes).
    - order: 3
      role: NPR1-induced WRKY transcription factor
      node:
        id: wrky70_tf
        label: WRKY70 transcriptional regulation of SA-responsive genes
        module_type: MOLECULAR_FUNCTION
        description: >-
          WRKY70, induced by SA through NPR1, is a nuclear WRKY transcription factor with a dual role:
          it promotes SA-induced defence gene expression and resistance, and (with WRKY54) represses
          ICS1 expression and SA accumulation, feeding back negatively on part 1.
        annotons:
          - id: wrky70_activity
            label: "WRKY70: DNA-binding transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: WRKY70 (Arabidopsis)
                term:
                  id: UniProtKB:Q9LY00
                  label: Probable WRKY transcription factor 70
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
              evidence:
                - source_id: PMID:14742872
                  statement: WRKY70 overexpression gives constitutive SA-induced PR gene expression and
                    resistance; WRKY70 activates SA-induced genes and represses JA-responsive genes.
                  supporting_text: We suggest that WRKY70 acts as an activator of SA-induced genes and a
                    repressor of JA-responsive genes, integrating signals from these mutually
                    antagonistic pathways.
                - source_id: file:ARATH/WRKY70/WRKY70-ai-review.yaml
                  statement: Core function GO:0003700 (GO:0080151, GO:2000022, GO:1900056) in the
                    nucleus in the WRKY70 gene review.
            processes:
              - preferred_term: positive regulation of salicylic acid mediated signaling pathway
                term:
                  id: GO:0080151
                  label: positive regulation of salicylic acid mediated signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: SA- and NPR1-induced WRKY factor with a dual role in this module, as a
              positive regulator of SA-responsive gene expression and, with WRKY54, a negative regulator
              of SA biosynthesis (ICS1 expression; see the connection back to part 1). Its repression of
              JA-responsive genes and its role in leaf senescence are outputs outside this module.
  connections:
    - source: sa_biosynthesis
      target: npr1_coregulator
      connection_type: POSITIVELY_REGULATES
      description: SA made through the isochorismate route activates NPR1-dependent transcription (via
        redox-driven NPR1 monomerization and NPR3/NPR4 perception).
      evidence:
        - source_id: PMID:17096590
          statement: SA induces the SAR transcriptional cascade through NPR1.
          supporting_text: a cascade of transcriptional events induced by salicylic acid through the
            transcription cofactor NPR1
    - source: npr1_coregulator
      target: wrky70_tf
      connection_type: POSITIVELY_REGULATES
      description: NPR1 is needed for full SA induction of WRKY70, which acts downstream of NPR1.
      evidence:
        - source_id: PMID:14742872
          statement: Full SA induction of WRKY70 needs NPR1, and epistasis places WRKY70 downstream of
            NPR1.
          supporting_text: Epistasis analysis suggested that WRKY70 is downstream of NPR1 in an
            SA-dependent signal pathway.
    - source: wrky70_tf
      target: sa_biosynthesis
      connection_type: NEGATIVELY_REGULATES
      description: Negative feedback. Basal and NPR1-induced WRKY70 (with WRKY54) represses SA
        biosynthesis; wrky70 and wrky54 wrky70 mutants over-accumulate ICS1 transcript and SA.
      evidence:
        - source_id: PMID:17096590
          statement: The SA biosynthesis gene ICS1 is upregulated in wrky54 wrky70, matching its
            elevated SA.
          supporting_text: Consistent with elevated SA levels, the SA biosynthesis gene ICS1 (encoding
            isochorismate synthase [10]) was clearly upregulated in wrky54 wrky70
        - source_id: PMID:17096590
          statement: SA accumulates in naive wrky70 and wrky54 wrky70, so basal WRKY70 and WRKY54
            actively repress SA biosynthesis.
          supporting_text: Accumulation of SA in naïve wrky70 and wrky54 wrky70 indicates that in WT
            plants, SA biosynthesis is actively repressed by basal levels of WRKY70 and WRKY54.
  knowledge_gaps:
    - gap_statement: >
        Whether WRKY70 acts in SA signalling mainly as an activator of SA-induced defence genes or as a
        repressor partner of unmodified NPR1 is unresolved, and its direct target promoters in the SA
        response are not defined.
      boundary: >-
        WRKY70 overexpression gives constitutive SA-induced PR gene expression (PMID:14742872), while
        Saleh et al. describe WRKY70 as a transcriptional repressor that NPR1 leaves when sumoylated
        (PMID:26269953). PMID:17096590 partly reconciles these framings: WRKY70 and WRKY54 act both as
        negative regulators of SA biosynthesis (ICS1 and SA over-accumulate in the mutants) and as
        positive regulators of SA signalling, so repression and activation may concern different
        targets. Which promoters WRKY70 binds directly to achieve each effect is not known.
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: Determines whether WRKY70 is a positive output of NPR1 or a brake on it, and so how
        the WRKY70 step should connect to NPR1 in this module.
      resolution: Genome-wide WRKY70 binding and transcriptome profiling in wrky70 (and wrky70 wrky54)
        mutants after SA treatment, with NPR1 sumoylation-site mutants.
      provenance:
        - reference_id: PMID:26269953
          supporting_text: How this single protein orchestrates genome-wide transcriptional
            reprogramming in response to immune stimulus remains a major question.
    - gap_statement: >
        The enzymes of the ICS-independent route that still makes SA in ics1 ics2 double mutants are
        not identified.
      boundary: >-
        ICS1 supplies most pathogen-induced SA and ICS2 contributes little; ics1 ics2 double mutants
        lack phylloquinone but still contain SA (PMID:18451262).
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: Defines how much SA biosynthesis this module covers and whether the phenylalanine
        route needs a separate module in Arabidopsis.
      resolution: Isotope labelling of SA in ics1 ics2 and pal quadruple mutant backgrounds, with
        genetic tests of candidate benzoate-to-SA enzymes.
      provenance:
        - reference_id: PMID:18451262
          supporting_text: detection of SA in the double ics1 ics2 double mutant that is completely
            devoid of phylloquinone provides genetic evidence of the existence of an ICS-independent SA
            biosynthetic pathway in Arabidopsis.
