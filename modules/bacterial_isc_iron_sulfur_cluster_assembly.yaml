knowledge_gaps:
- gap_statement: 'The in vivo role of IscA in the Isc pathway is unresolved: purified IscA can bind iron,
    assemble and transfer [2Fe-2S] clusters, and deliver iron to IscU, but which of these activities it
    performs in cells, and whether it acts upstream of IscU or downstream as a carrier to [4Fe-4S] targets,
    is not established.'
  boundary: Applies to the optional IscA step; the IscS-IscU core and the HscB-HscA cycle are not affected.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Determines whether IscA should be modeled as an iron donor, an alternative scaffold or
    a downstream cluster carrier.
  resolution: Trap IscA cluster and iron intermediates in vivo (for example by Moessbauer spectroscopy
    of whole cells expressing tagged IscA) in iscU, sufA and erpA backgrounds and follow transfer to defined
    [2Fe-2S] and [4Fe-4S] apotargets.
  provenance:
  - reference_id: PMID:15247288
    supporting_text: The results suggest that IscA is capable of recruiting intracellular iron and providing
      iron for the iron-sulfur cluster assembly in IscU
    reference_section_type: ABSTRACT
  - reference_id: PMID:11319236
    supporting_text: These results thus suggest that IscA is involved in ferredoxin cluster assembly and
      activation.
    reference_section_type: ABSTRACT
