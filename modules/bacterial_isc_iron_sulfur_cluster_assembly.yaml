id: MODULE:bacterial_isc_iron_sulfur_cluster_assembly
title: Bacterial Fdx-supported, HscBA-assisted Isc iron-sulfur cluster assembly
description: A bacterial Isc mechanism for iron-sulfur cluster assembly and transfer supported by Isc
  ferredoxin and the dedicated HscBA cycle. IscS mobilizes cysteine sulfur as a persulfide and supplies
  IscU, the transient cluster scaffold. Reduced Isc ferredoxin supplies reducing equivalents; HscB recruits
  IscU to the HscA ATPase, coupling ATP hydrolysis to cluster release and delivery. An optional IscA carrier
  branch supports condition- and client-dependent iron or cluster handling. Reduced anaerobic ISC implementations
  and scaffold-suppressor bypasses are comparative boundary cases outside the encoded Fdx-supported,
  HscBA-assisted profile; their altered requirements are not additional modeled variants here.
  IscR regulation, CyaY and IscX
  modulation, upstream iron and reductant supply, mitochondrial ISC, and the separate Suf and Nif systems
  lie outside this mechanism.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0016226
  title: iron-sulfur cluster assembly
  statement: GO:0016226 provides the shared biological-process context for the six Isc machinery roles.
- source_id: GO:0044571
  title: '[2Fe-2S] cluster assembly'
  statement: GO:0044571 captures the more specific cluster-assembly context of the core machinery.
- source_id: PMID:11432781
  title: Genetic analysis of the isc operon in Escherichia coli involved in the biogenesis of cellular
    iron-sulfur proteins.
  statement: 'Systematic E. coli isc operon mutagenesis defines the module boundary: iscS, iscU, hscB,
    hscA and fdx are central to Fe-S protein maturation, iscA has a smaller effect, and iscR and ORF3
    are dispensable for assembly.'
  supporting_text: Our findings support the conclusion that IscS, via cysteine desulfurase activity, provides
    the sulfur that is subsequently incorporated into Fe-S clusters by assembler machinery comprising
    of the iscUA-hscBA-fdx gene products.
- source_id: PMID:10544286
  title: Functional assignment of the ORF2-iscS-iscU-iscA-hscB-hscA-fdx-ORF3 gene cluster involved in
    the assembly of Fe-S clusters in Escherichia coli.
  statement: Reporter-ferredoxin coexpression in E. coli shows the iscS, iscA, hscA and fdx genes are
    required for Fe-S cluster assembly.
  supporting_text: we show the iscS, iscA, hscA, and fdx genes to be required for the assembly of the
    Fe-S clusters.
- source_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
  title: PSEPK UniProt metadata table
  statement: The contiguous PP_0842 through PP_0847 locus supplies exact Pseudomonas putida KT2440 accessions
    for IscS, IscU, IscA, HscB, HscA, and Fdx.
- source_id: PMID:32408945
  title: 'Making iron-sulfur cluster: structure, regulation and evolution of the bacterial ISC system.'
  statement: The review covers bacterial ISC and comparison with eukaryotic ISC, including adaptations
    to changing redox conditions. The systems share components without making all accessory requirements
    universal.
- source_id: PMID:34781750
  title: Bacterial Approaches for Assembling Iron-Sulfur Proteins.
  statement: The HscB-HscA cycle couples scaffold recognition and ATP hydrolysis to cluster delivery.
    Alternative ISC/SUF/NIF systems are distinct machineries; their coexistence does not establish that
    Fdx or HscBA is dispensable within the modeled Isc route.
- source_id: PMID:41970532
  title: 'Intricacies in iron-sulfur cluster function and biogenesis: functional versatility, sulfur sources,
    and enzyme specificity.'
  statement: The comparative synthesis distinguishes the five central IscS/IscU/Fdx/HscA/HscB roles from
    variable accessory proteins and discusses unresolved iron-donor and assembly-order questions.
- source_id: PMID:16936042
  title: Controlled expression and functional analysis of iron-sulfur cluster biosynthetic components
    within Azotobacter vinelandii.
  statement: Conditional depletion in Azotobacter establishes a central IscS/IscU/HscBA/Fdx requirement
    under the tested conditions. Low oxygen partially rescues HscBA depletion; the IscA null phenotype
    is associated with elevated oxygen.
- source_id: PMID:9582371
  statement: Native IscS purification and the original isc-region sequence distinguish housekeeping ISC
    proteins from Nif paralogs.
- source_id: PMID:10542283
  statement: Native FdIV identity and reversible redox biophysics support electron-carrier capability;
    correlated expression with Fpr does not demonstrate a productive donor chain.
- source_id: PMID:16964969
  statement: Azotobacter HscA, HscB and MgATP stimulate cluster transfer from IscU to apoferredoxin; the
    recipient role of Fdx is distinct from electron donation.
- source_id: PMID:25688831
  statement: E. coli NADPH/FNR/Fdx reconstitution supports reducing-equivalent delivery to IscS/IscU,
    with in vitro rates distinguished from physiological flux.
- source_id: PMID:26560204
  statement: 'Oxygen conditions and IscU suppressor variants alter ISC component requirements: Fdx can
    be dispensable anaerobically, whereas HscBA bypass is a separate scaffold-genotype result.'
notes: 'The modeled capacity is the canonical Fdx-supported, HscBA-assisted route. IscS, IscU, Fdx, HscB
  and HscA are required for that profile, not asserted universally necessary for all ISC-dependent synthesis.
  In E. coli lacking SUF, loss of Fdx can be tolerated anaerobically; the same primary study retains a
  requirement for wild-type IscS, IscU, HscB and HscA in that assay. Separate IscU suppressor substitutions
  partially bypass HscBA. These are distinct condition/genotype boundaries, not proof that unmodified
  IscSU alone supplies every client. Alternative electron-carrier identity remains unresolved. IscA is
  optional at this nascent-cluster/transfer boundary, without claiming dispensability for all aerobic
  clients or elevated-oxygen Azotobacter growth.


  Bacteria is a distribution envelope, not universal conservation. The reviewed panel samples E. coli,
  P. putida and A. vinelandii within Gammaproteobacteria; it does not establish experimentally complete
  coverage across bacterial phyla. The Azotobacter sequences match the original AF010139 deposit; DJ116
  sequence origin and subsequent DJ-derived experimental strains are distinguished in the member map.
  Five Azotobacter representatives support the canonical profile. Housekeeping IscA O31271 remains a reviewed
  comparator: broad binding and native participation do not establish its exact cluster-delivery chemistry,
  and NifIscA experiments are not transferred to it.


  Evidence strength differs by role and species. Native Azotobacter Fdx redox measurements, specific ISC
  signatures and depletion phenotypes support an inferred donor role by comparison with E. coli mechanism.
  Its native donor/acceptor chain is not reconstituted. In the Azotobacter HscBA assay, apo-Fdx is a cluster
  recipient, not evidence of electron donation. KT2440 roles also rely on comparative inference. A supported/inferred
  capacity profile must be distinguished from an assay-only cognate electron-relay profile.


  Available iron, L-cysteine, ATP and reduced ferredoxin are inputs. The physiological iron donor and
  loading order remain unresolved; reductase/reduced-ferredoxin supply is upstream. IscA is not the sole
  asserted iron source, and no fixed IscU-to-IscA ordering is encoded. Purified IscA iron donation and
  intact cluster delivery are distinct molecular claims.


  HscA family/subfamily descriptors are alternative classifications of one role, not two required proteins.
  HscA contributes ATP hydrolysis coupled to IscU transfer; HscB contributes ATPase activation and scaffold
  recruitment. Neither role automatically establishes generic folding/refolding. Broad Hsp70, J-domain,
  ferredoxin or IscU/SufU-family membership alone is insufficient. Family reviews retain unresolved universal
  function scopes, while representative-specific functions and cognate interfaces ground this module.'
