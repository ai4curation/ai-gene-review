id: MODULE:bacterial_isc_iron_sulfur_cluster_assembly
title: Bacterial Isc iron-sulfur cluster assembly
description: >-
  A reusable bacterial module for de novo assembly and transfer of
  iron-sulfur clusters by the housekeeping Isc system. The PLP-dependent
  cysteine desulfurase IscS mobilizes sulfur from L-cysteine as an
  enzyme-bound persulfide and passes it to the scaffold IscU, on which a
  nascent [2Fe-2S] cluster is assembled; the Isc [2Fe-2S] ferredoxin Fdx
  supplies an electron needed to reduce the persulfide sulfur. The J-type
  co-chaperone HscB recognizes cluster-bearing IscU and delivers it to the
  dedicated Hsp70-type chaperone HscA, whose ATP-driven cycle promotes
  release and transfer of the cluster. The A-type carrier IscA binds iron
  and [2Fe-2S] clusters and supports late cluster delivery to target
  apoproteins. Transcriptional regulation by IscR, the frataxin CyaY and
  IscX modulators, the Fe-S target proteins themselves, and the alternative
  Suf and Nif systems are outside the module boundary. Escherichia coli K-12
  and Pseudomonas putida KT2440 supply exact exemplars for every role.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0016226
    title: iron-sulfur cluster assembly
    statement: GO:0016226 provides the shared biological-process context for the six Isc machinery roles.
  - source_id: GO:0044571
    title: "[2Fe-2S] cluster assembly"
    statement: GO:0044571 captures the more specific cluster-assembly context of the core machinery.
  - source_id: PMID:11432781
    title: Genetic analysis of the isc operon in Escherichia coli involved in the biogenesis of cellular iron-sulfur proteins.
    statement: >-
      Systematic E. coli isc operon mutagenesis defines the module boundary:
      iscS, iscU, hscB, hscA and fdx are central to Fe-S protein maturation,
      iscA has a smaller effect, and iscR and ORF3 are dispensable for
      assembly.
    supporting_text: >-
      Our findings support the conclusion that IscS, via cysteine desulfurase
      activity, provides the sulfur that is subsequently incorporated into Fe-S
      clusters by assembler machinery comprising of the iscUA-hscBA-fdx gene
      products.
  - source_id: PMID:10544286
    title: Functional assignment of the ORF2-iscS-iscU-iscA-hscB-hscA-fdx-ORF3 gene cluster involved in the assembly of Fe-S clusters in Escherichia coli.
    statement: >-
      Reporter-ferredoxin coexpression in E. coli shows the iscS, iscA, hscA
      and fdx genes are required for Fe-S cluster assembly.
    supporting_text: >-
      we show the iscS, iscA, hscA, and fdx genes to be required for the
      assembly of the Fe-S clusters.
  - source_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
    title: PSEPK UniProt metadata table
    statement: >-
      The contiguous PP_0842 through PP_0847 locus supplies exact Pseudomonas
      putida KT2440 accessions for IscS, IscU, IscA, HscB, HscA, and Fdx.
notes: >-
  This is an assembly-process module, not a single linear reaction pathway.
  IscS and IscU define the conserved assembly core. Fdx electron delivery,
  IscA-assisted transfer, and the HscB-HscA scaffold-remodeling cycle are
  substantive accessory branches; they are marked optional because Suf-type
  or lineage-specific substitutes exist, although in E. coli loss of hscB,
  hscA or fdx is nearly as severe as loss of iscU (PMID:11432781).
  Taxonomic scope: the full iscSUA-hscBA-fdx gene cluster is best
  characterized in gamma-proteobacteria (E. coli K-12, Azotobacter
  vinelandii, P. putida KT2440), and its role-by-role conservation is shown
  by the E. coli and P. putida exemplars, so the module is kept at Bacteria
  with the caveat that many Gram-positive bacteria and archaea rely on Suf
  instead of Isc. The mitochondrial ISC machinery (NFS1-ISD11-ACP, ISCU,
  FDX2, HSCB, HSPA9/Ssq1, ISCA1/2) descends from this system but adds
  eukaryote-specific subunits and compartmentation, so it is not merged into
  this bacterial module; the shared PANTHER (sub)families (PTHR11601:SF34,
  PTHR10093, PTHR23426:SF65, PTHR14021:SF15, PTHR10072:SF41) record the
  homology. Family groundings use PANTHER (sub)families whose curated family
  reviews adjudicate the asserted activity. The IscU role is grounded at the
  family level: panther.obo defines nine PTHR10093 subfamilies, including
  SF26 named for IscU, but UniProt cross-references the IscU exemplars only
  at family level and PANTHER 19.0 classifies E. coli IscU in SF8, so no
  subfamily is asserted. The HscA role is grounded to PTHR19375:SF176
  (CHAPERONE PROTEIN HSCA), where PANTHER 19.0 classifies E. coli HscA,
  rather than to the whole HSP70 family, which also contains DnaK and
  eukaryotic Hsp70s that do not perform the IscU-specific role; the
  P. putida HscA is classified only at the family level.
module:
  id: bacterial_isc_iron_sulfur_cluster_assembly
  label: bacterial Isc iron-sulfur cluster assembly
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: iron-sulfur cluster assembly
      term:
        id: GO:0016226
        label: iron-sulfur cluster assembly
      description: Assembly and delivery of iron-sulfur clusters by the bacterial Isc machinery.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: Sulfur mobilization from L-cysteine
      node:
        id: isc_sulfur_mobilization
        label: IscS sulfur mobilization
        module_type: REACTION
        annotons:
          - id: iscs_cysteine_desulfurase
            label: IscS cysteine desulfurase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: cysteine desulfurase activity
                term:
                  id: GO:0031071
                  label: cysteine desulfurase activity
              family:
                preferred_term: IscS/NFS1-type group I cysteine desulfurase subfamily
                term:
                  id: PANTHER:PTHR11601:SF34
                  label: CYSTEINE DESULFURASE
                representative_members:
                  - preferred_term: iscS (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A6B7
                      label: Cysteine desulfurase IscS
                    description: Escherichia coli K-12 iscS/b2530, the biochemically and structurally characterized Isc cysteine desulfurase.
                  - preferred_term: iscS (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PK8
                      label: Cysteine desulfurase IscS
                    description: Pseudomonas putida KT2440 iscS/PP_0842.
            function:
              preferred_term: cysteine desulfurase activity
              term:
                id: GO:0031071
                label: cysteine desulfurase activity
              substrates:
                - preferred_term: L-cysteine
              products:
                - preferred_term: L-alanine
                - preferred_term: enzyme-bound persulfide sulfur
              cofactors:
                - preferred_term: pyridoxal 5'-phosphate
              evidence:
                - source_id: PMID:11577100
                  statement: Purified E. coli IscS transfers cysteine-derived persulfide sulfur directly to IscU, to which it binds tightly.
                  supporting_text: >-
                    IscU binds to IscS with high affinity (K(d) approximately 2
                    microm) in support of a direct transfer mechanism.
                - source_id: file:ECOLI/iscS/iscS-ai-review.yaml
                  statement: P0A6B7 is the E. coli K-12 IscS cysteine desulfurase supplying sulfur for Fe-S cluster assembly.
                - source_id: file:PSEPK/iscS/iscS-uniprot.txt
                  statement: Q88PK8 is the IscS-family PLP-dependent cysteine desulfurase.
            processes:
              - preferred_term: "[2Fe-2S] cluster assembly"
                term:
                  id: GO:0044571
                  label: "[2Fe-2S] cluster assembly"
            role_description: Generates persulfide sulfur transferred to the IscU scaffold.
    - order: 2
      role: Transient cluster assembly on IscU
      node:
        id: iscu_scaffold_assembly
        label: IscU scaffold assembly
        activation_logic:
          # Cluster assembly on IscU uses both persulfide sulfur from IscS and reducing
          # equivalents from ferredoxin.
          all_of:
            - element: isc_sulfur_mobilization
            - element: fdx_electron_delivery
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: iscu_cluster_scaffold
            label: IscU transient cluster scaffold
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: iron-sulfur cluster chaperone activity
                term:
                  id: GO:0140132
                  label: iron-sulfur cluster chaperone activity
              family:
                preferred_term: IscU/NifU-type Fe-S cluster scaffold family
                term:
                  id: PANTHER:PTHR10093
                  label: IRON-SULFUR CLUSTER ASSEMBLY ENZYME  NIFU HOMOLOG
                representative_members:
                  - preferred_term: iscU (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0ACD4
                      label: Iron-sulfur cluster assembly scaffold protein IscU
                    description: Escherichia coli K-12 iscU/b2529.
                  - preferred_term: iscU (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PK7
                      label: Iron-sulfur cluster assembly scaffold protein IscU
                    description: Pseudomonas putida KT2440 iscU/PP_0843.
            function:
              preferred_term: iron-sulfur cluster chaperone activity
              term:
                id: GO:0140132
                label: iron-sulfur cluster chaperone activity
              evidence:
                - source_id: PMID:15964837
                  statement: E. coli holo-IscU transfers preassembled [2Fe-2S] clusters to apoferredoxin in multiple turnovers.
                  supporting_text: >-
                    Kinetic studies further showed that cluster transfer exhibits
                    Michaelis-Menten behavior indicative of complex formation of
                    holo-IscU and holo-IscA with apoferredoxin
                - source_id: file:ECOLI/iscU/iscU-ai-review.yaml
                  statement: P0ACD4 is the E. coli K-12 IscU scaffold for transient Fe-S cluster assembly and transfer.
                - source_id: file:PSEPK/iscU/iscU-uniprot.txt
                  statement: Q88PK7 carries IscU-specific TIGR01999 and IPR011339 assignments.
            processes:
              - preferred_term: iron-sulfur cluster assembly
                term:
                  id: GO:0016226
                  label: iron-sulfur cluster assembly
            role_description: Provides the transient scaffold on which a nascent Fe-S cluster forms.
    - order: 3
      role: Reducing-equivalent delivery to cluster assembly
      optional: true
      node:
        id: fdx_electron_delivery
        label: Isc ferredoxin electron delivery
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: isc_ferredoxin
            label: Isc-associated 2Fe-2S ferredoxin
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: electron transfer activity
                term:
                  id: GO:0009055
                  label: electron transfer activity
              family:
                preferred_term: FDX2-type (Isc-associated) [2Fe-2S] ferredoxin subfamily
                term:
                  id: PANTHER:PTHR23426:SF65
                  label: FERREDOXIN-2, MITOCHONDRIAL
                representative_members:
                  - preferred_term: fdx (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A9R4
                      label: 2Fe-2S ferredoxin
                    description: Escherichia coli K-12 fdx/b2525.
                  - preferred_term: fdx (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PK3
                      label: 2Fe-2S ferredoxin
                    description: Pseudomonas putida KT2440 fdx/PP_0847.
            function:
              preferred_term: electron transfer activity
              term:
                id: GO:0009055
                label: electron transfer activity
              evidence:
                - source_id: PMID:23682711
                  statement: Reduced E. coli Fdx binds IscS and donates an electron to the IscS persulfide during cysteine turnover.
                  supporting_text: >-
                    These results (1) show that reduced Fdx supplies one electron to
                    the IscS complex as S(0) is produced by the enzymatic conversion
                    of Cys to Ala
                - source_id: file:ECOLI/fdx/fdx-ai-review.yaml
                  statement: P0A9R4 is the E. coli K-12 Isc [2Fe-2S] ferredoxin supplying electrons for cluster assembly.
                - source_id: file:PSEPK/fdx/fdx-uniprot.txt
                  statement: Q88PK3 carries Isc-specific TIGR02007 and IPR011536 assignments.
            processes:
              - preferred_term: iron-sulfur cluster assembly
                term:
                  id: GO:0016226
                  label: iron-sulfur cluster assembly
            role_description: Supplies reducing equivalents used during nascent cluster assembly.
    - order: 4
      role: IscU recognition and HscA recruitment
      optional: true
      node:
        id: hscb_iscu_recruitment
        label: HscB co-chaperone recruitment
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: hscb_cochaperone
            label: HscB IscU-targeting co-chaperone
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: ATPase activator activity
                term:
                  id: GO:0001671
                  label: ATPase activator activity
              family:
                preferred_term: HscB J-type co-chaperone subfamily
                term:
                  id: PANTHER:PTHR14021:SF15
                  label: IRON-SULFUR CLUSTER CO-CHAPERONE PROTEIN HSCB
                representative_members:
                  - preferred_term: hscB (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A6L9
                      label: Co-chaperone protein HscB
                    description: Escherichia coli K-12 hscB/b2527 (Hsc20).
                  - preferred_term: hscB (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PK5
                      label: Co-chaperone protein HscB homolog
                    description: Pseudomonas putida KT2440 hscB/PP_0845.
            function:
              preferred_term: ATPase activator activity
              term:
                id: GO:0001671
                label: ATPase activator activity
              evidence:
                - source_id: PMID:10869428
                  statement: E. coli HscB (Hsc20) binds IscU and, with IscU, stimulates HscA (Hsc66) ATPase activity up to 480-fold.
                  supporting_text: >-
                    IscU and its iron-sulfur complex (IscU-Fe/S) stimulated the basal
                    steady-state ATPase activity of Hsc66 weakly in the absence of
                    Hsc20 but, in the presence of Hsc20, increased the ATPase activity
                    up to 480-fold.
                - source_id: file:ECOLI/hscB/hscB-ai-review.yaml
                  statement: P0A6L9 is the E. coli K-12 HscB co-chaperone that targets IscU to HscA.
                - source_id: file:PSEPK/hscB/hscB-uniprot.txt
                  statement: Q88PK5 is the HscB-family co-chaperone encoded in the KT2440 isc locus.
            processes:
              - preferred_term: "[2Fe-2S] cluster assembly"
                term:
                  id: GO:0044571
                  label: "[2Fe-2S] cluster assembly"
            role_description: Recognizes cluster-bearing IscU and stimulates HscA ATPase activity.
    - order: 5
      role: ATP-dependent remodeling of cluster-bearing IscU
      optional: true
      node:
        id: hsca_atp_remodeling
        label: HscA ATP-dependent remodeling
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: hsca_chaperone_atpase
            label: HscA dedicated chaperone ATPase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: ATP-dependent protein folding chaperone
                term:
                  id: GO:0140662
                  label: ATP-dependent protein folding chaperone
              family:
                preferred_term: HscA dedicated Fe-S cluster Hsp70 chaperone
                term:
                  id: PANTHER:PTHR19375:SF176
                  label: CHAPERONE PROTEIN HSCA
                description: >-
                  The IscU-specific HscA branch of the Hsp70 family. PANTHER 19.0
                  classifies E. coli HscA in subfamily PTHR19375:SF176 (CHAPERONE
                  PROTEIN HSCA); the P. putida HscA is cross-referenced by UniProt
                  only at the HSP70 family level (PTHR19375). The family as a whole
                  also contains DnaK and eukaryotic Hsp70s that do not fill this
                  role, so the descriptor is grounded at the subfamily.
                representative_members:
                  - preferred_term: hscA (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0A6Z1
                      label: Chaperone protein HscA
                    description: Escherichia coli K-12 hscA/b2526 (Hsc66).
                  - preferred_term: hscA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PK4
                      label: Chaperone protein HscA homolog
                    description: Pseudomonas putida KT2440 hscA/PP_0846.
            function:
              preferred_term: ATP-dependent protein folding chaperone
              term:
                id: GO:0140662
                label: ATP-dependent protein folding chaperone
              evidence:
                - source_id: PMID:15485839
                  statement: IscU is the substrate of E. coli HscA, and IscU plus HscB synergistically accelerate the HscA ATPase cycle.
                  supporting_text: >-
                    When present together, IscU and HscB synergistically stimulate
                    both k(hyd) (approximately = 500-fold) and k(T-->R)
                    (approximately = 60-fold), leading to enhanced formation of the
                    HscA.ADP-IscU complex (substrate capture).
                - source_id: file:ECOLI/hscA/hscA-ai-review.yaml
                  statement: P0A6Z1 is the E. coli K-12 HscA chaperone whose ATPase cycle acts on IscU.
                - source_id: file:PSEPK/hscA/hscA-uniprot.txt
                  statement: Q88PK4 is the dedicated HscA-family ATP-dependent chaperone.
            processes:
              - preferred_term: iron-sulfur cluster assembly
                term:
                  id: GO:0016226
                  label: iron-sulfur cluster assembly
            role_description: Uses ATP hydrolysis to remodel IscU and promote cluster release.
    - order: 6
      role: Late cluster assembly or transfer by IscA
      optional: true
      node:
        id: isca_cluster_transfer
        label: IscA-assisted cluster transfer
        module_type: BIOLOGICAL_PROCESS
        annotons:
          - id: isca_cluster_carrier
            label: IscA cluster assembly and transfer protein
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: iron-sulfur cluster chaperone activity
                term:
                  id: GO:0140132
                  label: iron-sulfur cluster chaperone activity
              family:
                preferred_term: IscA/ISCA1-type A-type carrier subfamily
                term:
                  id: PANTHER:PTHR10072:SF41
                  label: IRON-SULFUR CLUSTER ASSEMBLY 1 HOMOLOG, MITOCHONDRIAL
                representative_members:
                  - preferred_term: iscA (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0AAC8
                      label: Iron-binding protein IscA
                    description: Escherichia coli K-12 iscA/b2528.
                  - preferred_term: iscA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PK6
                      label: Iron-binding protein IscA
                    description: Pseudomonas putida KT2440 iscA/PP_0844.
            function:
              preferred_term: iron-sulfur cluster chaperone activity
              term:
                id: GO:0140132
                label: iron-sulfur cluster chaperone activity
              evidence:
                - source_id: PMID:11319236
                  statement: E. coli IscA assembles a [2Fe-2S] cluster and transfers iron and sulfide to apo-ferredoxin.
                  supporting_text: >-
                    The metal form but not the apoform of IscA binds ferredoxin,
                    another member of the isc operon, selectively, allowing transfer
                    of iron and sulfide from IscA to ferredoxin
                - source_id: PMID:15247288
                  statement: E. coli IscA binds iron tightly and can deliver it for IscS-mediated cluster assembly on IscU.
                  supporting_text: >-
                    The results suggest that IscA is capable of recruiting
                    intracellular iron and providing iron for the iron-sulfur cluster
                    assembly in IscU
                - source_id: file:ECOLI/iscA/iscA-ai-review.yaml
                  statement: P0AAC8 is the E. coli K-12 A-type carrier IscA.
                - source_id: file:PSEPK/iscA/iscA-uniprot.txt
                  statement: Q88PK6 carries IscA-specific TIGR02011 and IPR011302 assignments.
            processes:
              - preferred_term: iron-sulfur cluster assembly
                term:
                  id: GO:0016226
                  label: iron-sulfur cluster assembly
            role_description: >-
              Binds iron and [2Fe-2S] clusters and supports late cluster
              delivery to target apoproteins; whether IscA acts mainly as an
              alternative scaffold, an iron donor or a carrier downstream of
              IscU is unresolved.
  connections:
    - source: isc_sulfur_mobilization
      target: iscu_scaffold_assembly
      connection_type: PROVIDES_INPUT_FOR
    - source: fdx_electron_delivery
      target: iscu_scaffold_assembly
      connection_type: PROVIDES_INPUT_FOR
    - source: iscu_scaffold_assembly
      target: hscb_iscu_recruitment
      connection_type: PROVIDES_INPUT_FOR
    - source: hscb_iscu_recruitment
      target: hsca_atp_remodeling
      connection_type: PROVIDES_INPUT_FOR
    - source: iscu_scaffold_assembly
      target: isca_cluster_transfer
      connection_type: PROVIDES_INPUT_FOR
knowledge_gaps:
  - gap_statement: >-
      The in vivo role of IscA in the Isc pathway is unresolved: purified IscA
      can bind iron, assemble and transfer [2Fe-2S] clusters, and deliver iron
      to IscU, but which of these activities it performs in cells, and whether
      it acts upstream of IscU or downstream as a carrier to [4Fe-4S] targets,
      is not established.
    boundary: >-
      Applies to the optional IscA step; the IscS-IscU core and the
      HscB-HscA cycle are not affected.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Determines whether IscA should be modeled as an iron donor, an alternative scaffold or a downstream cluster carrier.
    resolution: >-
      Trap IscA cluster and iron intermediates in vivo (for example by
      Moessbauer spectroscopy of whole cells expressing tagged IscA) in iscU,
      sufA and erpA backgrounds and follow transfer to defined [2Fe-2S] and
      [4Fe-4S] apotargets.
    provenance:
      - reference_id: PMID:15247288
        supporting_text: >-
          The results suggest that IscA is capable of recruiting intracellular iron
          and providing iron for the iron-sulfur cluster assembly in IscU
        reference_section_type: ABSTRACT
      - reference_id: PMID:11319236
        supporting_text: >-
          These results thus suggest that IscA is involved in ferredoxin cluster
          assembly and activation.
        reference_section_type: ABSTRACT
