id: MODULE:reductive_tca_cycle
title: Reductive tricarboxylic acid cycle
description: >-
  The reductive TCA cycle (reverse Krebs, Arnon-Buchanan cycle), which fixes
  CO2 by running the oxidative TCA cycle backwards. Three steps are not simply
  the reverse of their oxidative counterparts, and they are what define the
  cycle: citrate is cleaved by an ATP-dependent citrate lyase rather than made
  by citrate synthase; 2-oxoglutarate is formed by reductive carboxylation of
  succinyl-CoA by a ferredoxin-dependent 2-oxoglutarate synthase; and fumarate
  is reduced rather than succinate oxidized. A fourth ferredoxin-dependent
  carboxylation, pyruvate synthase, converts the acetyl-CoA released by citrate
  cleavage into pyruvate for biosynthesis. The cycle fixes two CO2 per turn and
  is markedly cheaper per carbon than the Calvin cycle, which is why it
  dominates in green sulfur bacteria and several Aquificae and
  epsilonproteobacteria; the price is that its ferredoxin-dependent
  carboxylases are oxygen-sensitive, confining it to anaerobic and
  microaerophilic niches. A sibling of MODULE:wood_ljungdahl_pathway,
  MODULE:hydroxypropionate_bicycle and MODULE:calvin_benson_bassham_cycle.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0019643
    title: reductive tricarboxylic acid cycle
    statement: Defines the process this module decomposes.
  - source_id: UniProtKB:Q9AJC4
    title: ATP-citrate lyase alpha-subunit (Chlorobium limicola)
    statement: >-
      The citrate-cleaving enzyme whose presence distinguishes the reductive
      cycle from the oxidative one, from a green sulfur bacterium in which the
      cycle was characterized.
  - source_id: UniProtKB:Q9AQH6
    title: ATP-citrate lyase beta-subunit (Chlorobium limicola)
    statement: The second subunit of the same heteromeric enzyme.
notes: >-
  The GO:0008177 assertion on rtca_frd sits under GO:0000104, which
  interpro/panther/PTHR11632/PTHR11632-review.yaml scopes SUBFAMILY_ONLY to
  SF51/SF53/SF72 while P00363 is in SF82; that scope_reason reads as a guard
  against root-level propagation rather than a claim about member capability,
  and saying so in the family review's own scope_reason would settle it there.
  Grounded on Chlorobium limicola, a green sulfur bacterium in which the cycle
  was characterized; the ATP-citrate lyase and 2-oxoglutarate synthase entries
  are unreviewed (TrEMBL), which is stated here because no reviewed entries
  exist for them in this organism. The shared steps that the cycle runs simply
  in reverse - aconitase, malate dehydrogenase, fumarase, citrate/isocitrate
  interconversion - are real parts of the cycle but are not modelled as
  separate parts, because they are not diagnostic and are shared with the
  oxidative cycle; the module models the three reversal-defining steps plus
  pyruvate synthase. Some organisms use a citryl-CoA synthetase plus
  citryl-CoA lyase pair in place of ATP-citrate lyase, which is a realization
  difference at the citrate-cleavage step rather than a different cycle.
  2-oxoglutarate synthase (GO:0047553) and pyruvate synthase (GO:0019164) are
  the GO terms for the ferredoxin-dependent carboxylations; both enzymes also
  run oxidatively in other organisms, so direction is a property of the
  metabolic context rather than of the protein. The reverse oxidative TCA
  cycle is modelled elsewhere in this corpus if at all; this module is
  specifically the carbon-fixing direction.
module:
  id: reductive_tca_cycle
  label: Reductive tricarboxylic acid cycle
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: reductive tricarboxylic acid cycle
      term:
        id: GO:0019643
        label: reductive tricarboxylic acid cycle
      description: >-
        CO2 fixation by running the TCA cycle in the reductive direction.
    - preferred_term: carbon fixation
      term:
        id: GO:0015977
        label: carbon fixation
  parts:
    - order: 1
      role: citrate cleavage (the reversal-defining step)
      node:
        id: rtca_citrate_cleavage
        label: ATP-citrate lyase cleavage of citrate to acetyl-CoA and oxaloacetate
        module_type: REACTION
        annotons:
          - id: rtca_acl
            label: ATP-citrate lyase (AclAB)
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: ATP-citrate lyase (AclAB)
                active_units:
                  - id: rtca_acl_alpha
                    label: AclA
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: aclA (Chlorobium limicola; unreviewed)
                        term:
                          id: UniProtKB:Q9AJC4
                          label: ATP-citrate lyase alpha-subunit
                  - id: rtca_acl_beta
                    label: AclB
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: aclB (Chlorobium limicola; unreviewed)
                        term:
                          id: UniProtKB:Q9AQH6
                          label: ATP-citrate lyase beta-subunit
            function:
              preferred_term: ATP citrate synthase activity
              term:
                id: GO:0003878
                label: ATP citrate synthase activity
              substrates:
                - preferred_term: citrate
                - preferred_term: coenzyme A
                - preferred_term: ATP
              products:
                - preferred_term: acetyl-CoA
                - preferred_term: oxaloacetate
                - preferred_term: ADP
                - preferred_term: phosphate
            role_description: >-
              Replaces citrate synthase, which is effectively irreversible in
              the synthetic direction. Spending ATP here is what lets the cycle
              close. The GO term is named for the reverse (synthase) direction;
              in this cycle the enzyme runs as a lyase.
    - order: 2
      role: fumarate reduction
      node:
        id: rtca_fumarate_reduction
        label: Fumarate reductase reduction of fumarate to succinate
        module_type: REACTION
        annotons:
          - id: rtca_frd
            label: Fumarate reductase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: >-
                  FAD-dependent oxidoreductase 2 flavoprotein subunit of the
                  SdhA/FrdA class (EC 1.3.5.1), run reductively here
                representative_members:
                  - preferred_term: sdhA (Chlorobium limicola; unreviewed)
                    term:
                      id: UniProtKB:A0A101JUB8
                      label: Fumarate reductase flavoprotein subunit
                  - preferred_term: frdA (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P00363
                      label: Fumarate reductase flavoprotein subunit
              description: >-
                The flavoprotein subunit carrying the succinate/fumarate
                half-reaction against a quinone pool, run reductively at this
                step. The two members deliberately span the family's two
                documented subfamilies rather than sitting on one side of it:
                A0A101JUB8 is in PTHR11632:SF53 (SUCCINATE DEHYDROGENASE
                FLAVOPROTEIN SUBUNIT) and P00363 in PTHR11632:SF82 (FUMARATE
                REDUCTASE FLAVOPROTEIN SUBUNIT, which
                interpro/panther/PTHR11632/PTHR11632-review.yaml marks
                diverged_from_family with "Physiologically reduce fumarate").
                That spread is the point, and it is the principle this module
                already states for the ferredoxin carboxylases: direction is a
                property of the metabolic context, not of the protein.
                A0A101JUB8's UniProt entry cannot place it on either side of
                that split, which is why the preferred_term names family
                membership rather than a direction. Its RecName "Fumarate
                reductase flavoprotein subunit" and its EC are both ARBA-only
                ({ECO:0000256|ARBA:ARBA00014044} and ARBA00012792) on an
                unreviewed TrEMBL entry at PE 3, which CLAUDE.md classes as an
                unvetted prediction and not support; its gene name sdhA is
                submitter-supplied ({ECO:0000313|EMBL:KUL33152.1}), equally
                unvetted. So nothing on that entry establishes a physiological
                direction either way, and the EC anchor rests on P00363, which
                is reviewed. The entry's one curated line, "Belongs to the
                FAD-dependent oxidoreductase 2 family", is family membership,
                which is what the preferred_term states.
                EC 1.3.5.4, which once named the quinol:fumarate reductase
                separately, is a transferred entry merged into 1.3.5.1
                (ExPASy: "Transferred entry: 1.3.5.1"), so a two-EC anchor
                would cite a class that no longer exists.
                No PANTHER term is asserted, and the reason is granularity
                rather than breadth. UniProt places A0A101JUB8 in
                PTHR11632:SF53 and P00363 in PTHR11632:SF82, so no subfamily
                contains both members. SF82 is unusable for a second reason: it
                sits outside the reviewed SUBFAMILY_ONLY scope for GO:0000104,
                so declaring it makes module_family_conformance raise
                FAMILY_CONFLICT at error level
                (module_family_conformance.py:131-139), not a warning. The
                shared base family PTHR11632 does contain both members, and
                declaring it yields FAMILY_SCOPE_RESTRICTED: "GO:0000104 is
                SUBFAMILY_ONLY; this family grounding does not establish the
                allowed subfamily scope" (:143-151). That complaint is about
                precision: the term is reviewed as valid for SF51/SF53/SF72
                only, and a base-family id does not say which subfamily a
                member falls in. Since the two members fall in different
                subfamilies and only one is in the allowed set, no single id
                states the truth, so the descriptor keeps its free-text intent
                and its members and asserts no family id.
                NADH-dependent fumarate reductases (GO:0016156, EC 1.3.1.6)
                occupy this same position in other organisms. That is recorded
                as context rather than modelled, because both members here are
                quinone-coupled rather than NAD(P)-coupled - which the curated
                "FAD-dependent oxidoreductase 2 family" line supports as
                membership evidence, and which is a separate axis from the
                physiological direction the ARBA text cannot establish.
            function:
              preferred_term: succinate dehydrogenase (quinone) activity
              term:
                id: GO:0008177
                label: succinate dehydrogenase (quinone) activity
              description: >-
                Reduction of fumarate to succinate with a quinol as electron
                donor, run in the reductive direction here. The term's name
                reads oxidatively, which is not a reason to refuse it: GO
                defines it by the reversible equation and carries "fumarate
                reductase (menaquinone)" as an exact synonym, and it xrefs the
                same EC 1.3.5.1 that P00363 carries on a reviewed entry. A
                name that reads oxidatively is not a semantic mismatch. This is
                not the cofactor-over-specificity error corrected elsewhere in
                this module set: that applies where a node spans both
                cofactors, as cam_malic_enzyme does, whereas the electron
                acceptor here is a quinone for both members and the
                quinone-specific term is the precise one. GO:0016156 would have
                been wrong, being NADH-specific (EC 1.3.1.6).
                One tension is worth recording rather than resolving silently.
                GO:0008177 is_a GO:0000104 succinate dehydrogenase activity,
                which PTHR11632-review.yaml scopes SUBFAMILY_ONLY to
                SF51/SF53/SF72 because propagating it from the family root
                would over-annotate the fumarate reductase branches. P00363
                sits outside that set, so asserting GO:0008177 on a descriptor
                including it entails a term this repo keeps off fumarate
                reductases. That scope statement guards against family-level
                propagation of a directionally named parent; it is not a claim
                that a quinol:fumarate reductase cannot catalyse the
                succinate/quinone reaction, which it demonstrably does - hence
                GO:0008177's exact synonym "fumarate reductase (menaquinone)"
                and its shared EC. So the scope statement does not exclude a
                member that genuinely runs the reaction in reverse, and no GO
                change is called for: GO:0000104 is named oxidatively in the
                same way GO:0008177 is, so by the argument above its parentage
                is no more defective than the child's name.
              substrates:
                - preferred_term: fumarate
              products:
                - preferred_term: succinate
            role_description: >-
              Replaces succinate dehydrogenase. Running this step reductively
              requires a donor at a lower potential than the quinone pool used
              in the oxidative direction.
    - order: 3
      role: succinyl-CoA formation
      node:
        id: rtca_succinyl_coa
        label: Succinate-CoA ligase activation of succinate
        module_type: REACTION
        annotons:
          - id: rtca_sucCD
            label: Succinate--CoA ligase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: succinate-CoA ligase (ADP-forming) activity
                term:
                  id: GO:0004775
                  label: succinate-CoA ligase (ADP-forming) activity
            function:
              preferred_term: succinate-CoA ligase (ADP-forming) activity
              term:
                id: GO:0004775
                label: succinate-CoA ligase (ADP-forming) activity
              substrates:
                - preferred_term: succinate
                - preferred_term: coenzyme A
                - preferred_term: ATP
              products:
                - preferred_term: succinyl-CoA
                - preferred_term: ADP
                - preferred_term: phosphate
            role_description: >-
              Supplies the thioester substrate for the carboxylation step; the
              second ATP cost of the cycle.
    - order: 4
      role: reductive carboxylation of succinyl-CoA
      node:
        id: rtca_oxoglutarate_synthase
        label: 2-oxoglutarate synthase carboxylation of succinyl-CoA
        module_type: REACTION
        annotons:
          - id: rtca_ogor
            label: 2-oxoglutarate:ferredoxin oxidoreductase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: 2-oxoacid:ferredoxin oxidoreductase, 2-oxoglutarate-specific
                representative_members:
                  - preferred_term: >-
                      A0A101JN76 (2-oxoglutarate:ferredoxin oxidoreductase
                      alpha subunit, Chlorobium limicola; unreviewed, no gene
                      symbol in UniProt)
                    term:
                      id: UniProtKB:A0A101JN76
                      label: 2-oxoglutarate ferredoxin oxidoreductase subunit alpha
            function:
              preferred_term: 2-oxoglutarate synthase activity
              term:
                id: GO:0047553
                label: 2-oxoglutarate synthase activity
              substrates:
                - preferred_term: succinyl-CoA
                - preferred_term: CO2
                - preferred_term: reduced ferredoxin
              products:
                - preferred_term: 2-oxoglutarate
                - preferred_term: coenzyme A
                - preferred_term: oxidized ferredoxin
            role_description: >-
              One of the two CO2-fixing steps. Thiamine-diphosphate and
              iron-sulfur dependent, and reliant on low-potential ferredoxin,
              which is the main reason the cycle is restricted to anoxic
              conditions.
    - order: 5
      role: pyruvate synthesis from the acetyl-CoA product
      node:
        id: rtca_pyruvate_synthase
        label: Pyruvate synthase carboxylation of acetyl-CoA
        module_type: REACTION
        annotons:
          - id: rtca_pfor
            label: Pyruvate:ferredoxin oxidoreductase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: pyruvate synthase activity
                term:
                  id: GO:0019164
                  label: pyruvate synthase activity
            function:
              preferred_term: pyruvate synthase activity
              term:
                id: GO:0019164
                label: pyruvate synthase activity
              substrates:
                - preferred_term: acetyl-CoA
                - preferred_term: CO2
                - preferred_term: reduced ferredoxin
              products:
                - preferred_term: pyruvate
                - preferred_term: coenzyme A
                - preferred_term: oxidized ferredoxin
            role_description: >-
              Takes the acetyl-CoA released by citrate cleavage into central
              biosynthesis. Strictly an outlet from the cycle rather than a
              step of the ring, but it is what makes the cycle autotrophic, and
              it fixes a further CO2.
  connections:
    - source: rtca_citrate_cleavage
      target: rtca_pyruvate_synthase
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The acetyl-CoA released by citrate cleavage is the substrate for
        reductive carboxylation to pyruvate.
    - source: rtca_citrate_cleavage
      target: rtca_fumarate_reduction
      connection_type: PRECEDES
      description: >-
        The oxaloacetate released by citrate cleavage reaches fumarate through
        the shared reductive steps (malate dehydrogenase and fumarase), which
        the module does not decompose because they are not diagnostic of the
        reductive direction, and treated here as one undecomposed stretch, as
        the 2-oxoglutarate to citrate span below is.
    - source: rtca_fumarate_reduction
      target: rtca_succinyl_coa
      connection_type: PRECEDES
      description: Succinate is activated to its CoA thioester.
    - source: rtca_succinyl_coa
      target: rtca_oxoglutarate_synthase
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Succinyl-CoA is the acceptor for the ferredoxin-dependent
        carboxylation.
    - source: rtca_oxoglutarate_synthase
      target: rtca_citrate_cleavage
      connection_type: PRECEDES
      description: >-
        2-oxoglutarate is carried on to citrate through the shared steps
        (isocitrate and aconitase), which the module does not decompose, and
        the cycle closes at citrate cleavage.
