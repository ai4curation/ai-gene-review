notes: >-
  The module represents carrier supply, not a peptidoglycan-specific pathway:
  C55-P is shared by several bacterial envelope-glycan systems. The same
  phosphatase reaction also returns carrier released as C55-PP after glycan
  transfer to the usable C55-P pool. A PANTHER term is deliberately omitted
  for the UppS descriptor because PTHR10291:SF0 contains the correct bacterial
  exemplars but has the divergent official label "DEHYDRODOLICHYL DIPHOSPHATE
  SYNTHASE 2"; the exact UniProt exemplars state the intended family without a
  misleading machine-readable assertion. Species-aware research also identifies
  three PAP2-family candidate phosphatases, but their broad family membership is
  insufficient to assign undecaprenyl-diphosphatase activity.
