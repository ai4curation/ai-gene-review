id: MODULE:bacterial_undecaprenyl_phosphate_carrier_supply
title: Bacterial undecaprenyl-phosphate carrier supply
description: >-
  A reusable bacterial module that supplies the C55 polyprenyl-phosphate lipid
  carrier used for cell-envelope glycan assembly. A soluble cis-prenyltransferase,
  UppS, elongates (2E,6E)-farnesyl diphosphate with eight isopentenyl diphosphates to
  form di-trans,octa-cis-undecaprenyl diphosphate (C55-PP). An integral inner-membrane
  undecaprenyl-diphosphatase of the BacA/UppP family then removes the terminal phosphate
  to make undecaprenyl phosphate (C55-P). The same phosphatase reaction also returns
  C55-PP, released after glycan transfer, to the usable C55-P pool. The carrier
  supports several pathways, including peptidoglycan, lipopolysaccharide O-antigen and
  enterobacterial common antigen synthesis. Transfer of pathway-specific sugars onto the
  carrier, glycan polymerization, carrier flipping, and the unrelated PAP2-family
  phosphatases that partly overlap the second step are outside this module.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0008834
  title: ditrans,polycis-undecaprenyl-diphosphate synthase [(2E,6E)-farnesyl-diphosphate specific] activity
  statement: Defines synthesis of the C55 undecaprenyl-diphosphate precursor.
- source_id: GO:0050380
  title: undecaprenyl-diphosphatase activity
  statement: Defines hydrolysis of undecaprenyl diphosphate to undecaprenyl phosphate.
- source_id: PMID:10217761
  title: The Escherichia coli homologue of yeast RER2, a key enzyme of dolichol synthesis, is essential for carrier lipid formation in bacterial cell wall synthesis.
  statement: >-
    E. coli UppS (Rth) is essential, and temperature-sensitive mutants lose
    undecaprenyl phosphate and cell-wall integrity, establishing UppS as the first step
    of carrier supply.
  supporting_text: >-
    The cellular level of undecaprenyl phosphate was in
    fact markedly decreased in the mutants.
- source_id: PMID:15778224
  title: Identification of multiple genes encoding membrane proteins with undecaprenyl pyrophosphate phosphatase (UppP) activity in Escherichia coli.
  statement: >-
    BacA makes the C55-P carrier from C55-PP. PAP2-family phosphatases provide
    redundancy, and loss of all of them depletes C55-P and arrests cell-wall synthesis.
  supporting_text: >-
    The enzyme function is to synthesize the carrier lipid
    undecaprenyl phosphate that is essential for the biosynthesis of peptidoglycan
    and other cell wall components.
- source_id: PMID:26560897
  title: Membrane Topology and Biochemical Characterization of the Escherichia coli BacA Undecaprenyl-Pyrophosphate Phosphatase.
  statement: >-
    BacA accounts for most membrane C55-PP phosphatase activity, and its active site
    faces the periplasm.
  supporting_text: >-
    Our data thus provide evidence that all the different E.
    coli C55-PP phosphatases identified to date (BacA and PAP2) catalyze the
    dephosphorylation of C55-PP molecules on the same (outer) side of the plasma
    membrane.
- source_id: file:PSEPK/uppP/uppP-deep-research-openscientist.md
  title: OpenScientist gene research for PSEPK UppP
  statement: >-
    The report supports Q88IY7 as a catalytically competent UppP/BacA-family
    enzyme while distinguishing ortholog-derived topology and possible
    flippase claims from established KT2440 evidence.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_undecaprenyl_phosphate_carrier_supply__ppu00550-deep-research-openscientist.md
  title: OpenScientist PSEPK carrier-supply satisfiability review
  statement: >-
    The two canonical steps are satisfiable with uppS/Q88MH6 and uppP/Q88IY7;
    PP_0251, PP_0900, and PP_4813 are uncertain PAP2-family redundancy
    candidates that must not receive blanket GO:0050380 transfer.
