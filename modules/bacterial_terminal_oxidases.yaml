id: MODULE:bacterial_terminal_oxidases
title: Bacterial aerobic terminal oxidase branches
description: >-
  Reusable module for bacterial aerobic terminal oxidases that reduce oxygen at
  the end of branched respiratory chains. Cytochrome c oxidases accept electrons
  from periplasmic cytochrome c, whereas quinol oxidases accept electrons
  directly from the membrane quinol pool. Individual bacteria may encode one or
  more variants with different donor preferences, oxygen affinities, inhibitor
  sensitivities, and proton-coupling properties. The module therefore separates
  the two donor classes and models their enzyme families as coexisting variants
  rather than forcing one universal complex.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: KEGG:ppu00190
    title: Pseudomonas putida KT2440 oxidative phosphorylation
    statement: >-
      The PSEPK oxidative-phosphorylation bucket contains aa3, bo3, two cbb3,
      and cyanide-insensitive terminal oxidase loci.
  - source_id: GO:0004129
    title: cytochrome-c oxidase activity
    statement: >-
      GO:0004129 grounds the electron-accepting reaction of the aa3 and cbb3
      cytochrome c oxidase branches.
  - source_id: GO:0016682
    title: oxidoreductase activity, acting on diphenols and related substances as donors, oxygen as acceptor
    statement: >-
      GO:0016682 grounds direct quinol oxidation coupled to oxygen reduction by
      the bo3 and cyanide-insensitive branches.
notes: >-
  P. putida KT2440 realizes all four terminal-oxidase families represented here:
  aa3 (PP_0103-PP_0106), bo3 (cyoABCD/PP_0812-PP_0815), duplicated cbb3
  complexes (PP_4250-PP_4253 and PP_4255-PP_4258), and CioAB
  (PP_4650-PP_4651). The broad ppu00190 bucket is not itself a single complex.
