    heavy chains (DYN-IAD); this module models that group.
- source_id: FB:FBgg0000386
  title: 'FlyBase gene group DYNA-IC: Axonemal dynein intermediate chains'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as axonemal dynein intermediate
    chains (DYNA-IC); this module models that group.
- source_id: FB:FBgg0000387
  title: 'FlyBase gene group DYNOA-IC: Axonemal outer arm dynein intermediate chains'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as axonemal outer arm dynein
    intermediate chains (DYNOA-IC); this module models that group.
- source_id: FB:FBgg0000388
  title: 'FlyBase gene group DYNIA-IC: Axonemal inner arm dynein intermediate chains'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as axonemal inner arm dynein
    intermediate chains (DYNIA-IC); this module models that group.
- source_id: GO:0005858
  title: axonemal dynein complex
  statement: >-
    GO term grounding the module as axonemal dynein complex.
notes: >-
  Heavy chains, intermediate chains and light chains are modelled per gene rather than as
  single complexes, because the composition of individual Drosophila arm species (which heavy
  chains pair with which intermediate chains, and which are sperm- versus chordotonal-specific)
  is not fully established. Heavy chains are given the general microtubule motor activity
  term. ODA-Dnal1 and Dnali1 are members of the FlyBase dynein light chain group (DYN-LC),
  which is assigned to dmel_cytoplasmic_dynein_dynactin; they are added here as non-member
  genes because they are axonemal arm light chains by homology. Outer-arm docking complex,
  dynein preassembly factors and the cytoplasmic dynein light chains are not parts. FlyBase
  groups realized by this module: DYNA (FBgg0000379), DYN-OAD (FBgg0000380), DYN-IAD (FBgg0000381),
  DYNA-IC (FBgg0000386), DYNOA-IC (FBgg0000387), DYNIA-IC (FBgg0000388). Participants were
  generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_axonemal_dynein_arms.yaml; none of the member genes has a gene review
  yet unless noted.
