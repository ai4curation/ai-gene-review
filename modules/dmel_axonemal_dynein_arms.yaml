id: MODULE:dmel_axonemal_dynein_arms
title: Axonemal outer and inner dynein arms in Drosophila melanogaster
description: >-
  Axonemal dyneins are the motors that bend motile cilia and flagella. They are attached in
  rows along the doublet microtubules of the 9+2 axoneme as outer dynein arms, which mainly
  set beat frequency, and inner dynein arms, which mainly shape the waveform. Each arm contains
  one or more dynein heavy chains, the ATP-driven motor subunits, together with intermediate
  and light chains that anchor the arm and regulate it. In Drosophila, motile axonemes are
  found only in sperm flagella and in the cilia of chordotonal mechanosensory neurons, so
  axonemal dyneins act in male fertility and hearing. Several sperm-specific heavy chains
  are encoded by the Y-chromosome fertility factors kl-2, kl-3 and kl-5.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000379
  title: 'FlyBase gene group DYNA: Axonemal dynein heavy chains'
  statement: >-
    FlyBase release FB2026_03 groups 11 D. melanogaster genes as axonemal dynein heavy chains
    (DYNA); this module models that group.
- source_id: FB:FBgg0000380
  title: 'FlyBase gene group DYN-OAD: Axonemal outer arm dynein heavy chains'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as axonemal outer arm dynein
    heavy chains (DYN-OAD); this module models that group.
- source_id: FB:FBgg0000381
  title: 'FlyBase gene group DYN-IAD: Axonemal inner arm dynein heavy chains'
  statement: >-
