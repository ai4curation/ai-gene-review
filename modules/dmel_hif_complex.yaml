id: MODULE:dmel_hif_complex
title: Hypoxia-inducible factor (Sima-Tgo) in Drosophila melanogaster
description: >-
  Hypoxia-inducible factor is a bHLH-PAS heterodimer that activates transcription when oxygen
  is low. The oxygen-regulated alpha subunit Sima (similar) is hydroxylated by the prolyl
  hydroxylase Fatiga in normoxia and degraded; in hypoxia it accumulates, enters the nucleus
  and dimerizes with the constitutive beta subunit Tango (tgo), the Drosophila ARNT homolog,
  to bind hypoxia response elements. Sima-Tgo drives hypoxia-induced gene expression, including
  tracheal branching responses, and Sima also has roles in growth control under normoxia.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000902
  title: 'FlyBase gene group HIF: Hypoxia-inducible factor'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as hypoxia-inducible factor (HIF);
    this module models that group.
- source_id: GO:0090575
  title: RNA polymerase II transcription regulator complex
  statement: >-
    GO term grounding the module as RNA polymerase II transcription regulator complex.
notes: >-
  GO has no specific cellular-component term for the HIF heterodimer, so the general RNA polymerase
  II transcription regulator complex term is used. Tgo is also the common partner of other
  bHLH-PAS proteins (for example single-minded, trachealess, spineless); only its HIF role
  is modelled here. The oxygen sensor Fatiga (Hph) and the VHL ubiquitin ligase are regulators
  and are not parts. FlyBase groups realized by this module: HIF (FBgg0000902). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_hif_complex.yaml; none of the member genes has a gene review yet
  unless noted.
