  connections:
  - source: periplasmic_precursor_maintenance
    target: translocator_barrel_installation
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      The holdases deliver the unfolded precursor to BAM in a state competent
      for barrel folding.
  - source: translocator_barrel_installation
    target: passenger_translocation
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      Installing the barrel creates the conduit through which the passenger then
      moves; for the classical architecture BAM also engages the passenger
      during that movement.
  knowledge_gaps:
  - gap_statement: >-
      Which Omp85-family insertase a type V substrate uses, and whether the two
      are redundant, is unresolved. The translocation and assembly module is
      required absolutely for one classical autotransporter in a reconstituted
      membrane, while BAM is the general machine and has been shown to contact a
      passenger during translocation. No experiment has compared the two routes
      for the same substrate in one strain background.
    boundary: >-
      Model both routes as variants on an insertase axis with ONE_OR_MORE
      selection rather than committing the module to BAM alone, and assert no
      ordering or exclusivity between them.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      Whether these proteins transport themselves is contested, which makes the
      molecular function of the classical translocator domain uncertain rather
      than merely unannotated. GO:0015474 asserts that the passenger-bearing
      protein does the transporting, while the literature that identified the
      dedicated insertase proposes instead that autotransporters are substrates
      of a secretion machine.
    boundary: >-
      Keep GO:0015474 on the architecture variants it describes, since it is the
      only term GO provides for the arrangement, and record the dispute here
      rather than silently endorsing or discarding the autonomous model. The
      focused review of Antigen 43 declines to propose the term for that protein
      on the same grounds.
    gap_kind:
    - ONTOLOGY
    - BIOLOGY
  - gap_statement: >-
      The patatin-like architecture rests on very few characterized examples,
      and no reviewed UniProt entry was available for its exemplar. Whether it
      is a widespread route or a small special case is unresolved.
    boundary: >-
      Keep the variant with a single, explicitly unreviewed exemplar and assert
      no passenger function for it.
    gap_kind:
    - BIOLOGY
  - gap_statement: >-
      What provides the energy for passenger translocation is not settled.
      Vectorial folding of the emerging passenger is the leading account, but the
      contribution of BAM and of the barrel itself to driving rather than merely
      conducting the passenger is unresolved.
    boundary: >-
      State the folding-driven account in prose without asserting an energetic
      molecular function for any part, and give BAM only its insertase role.
    gap_kind:
    - BIOLOGY
