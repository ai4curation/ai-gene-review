id: MODULE:bacterial_type_v_secretion
title: Bacterial type V secretion
description: >-
  A species-neutral module for delivery of a passenger protein to the surface of
  a diderm bacterium by the type V route. The precursor crosses the inner
  membrane through Sec and is held in a translocation-competent, unfolded state
  in the periplasm by holdase chaperones. A beta-barrel translocator, which is
  either a domain of the passenger's own polypeptide or a separate partner
  protein, is installed in the outer membrane by the BAM complex. The passenger
  then crosses the outer membrane through that barrel and folds on the far side.
  No ATP or ion gradient is available at the outer membrane, so vectorial
  folding of the emerging passenger supplies the directionality. Sec
  translocation itself, the biological activity of the displayed passenger, and
  the general biogenesis of outer-membrane proteins unrelated to secretion lie
  outside this module.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: GO:0046819
  title: protein secretion by the type V secretion system
  statement: GO:0046819 defines the biological process modeled by this module.
- source_id: GO:0098046
  title: type V protein secretion system complex
  statement: >-
    GO:0098046 identifies the translocator-plus-passenger assembly represented by
    the architecture variants.
- source_id: GO:0015474
  title: autotransporter activity
  statement: >-
    The definition of GO:0015474 states that the passenger and the porin are the
    N- and C-terminal regions of the same protein. That ordering is what
    separates the classical, trimeric, and patatin-like architectures, which the
    term fits, from the two-partner and inverted architectures, which it does
    not. The term is therefore applied selectively across the variants.
- source_id: PMID:22411980
  title: >-
    Type V secretion: mechanism(s) of autotransport through the bacterial outer
    membrane.
  statement: >-
    Reviews the type V subtypes and their shared mechanism, and is the basis for
    treating the architecture of the translocator-passenger pair as the axis
    along which this module varies.
- source_id: PMID:17702945
  title: >-
    Structure of the membrane protein FhaC: a member of the Omp85-TpsB
    transporter superfamily.
  statement: >-
    The FhaC structure establishes that the two-partner transporter is an
    Omp85-superfamily barrel, the same superfamily as BamA, which is why the
    two-partner variant is modeled with a separate transporter rather than as a
    self-transporting autotransporter.
- source_id: PMID:23056583
  title: >-
    Intimin and invasin export their C-terminus to the bacterial cell surface
    using an inverse mechanism compared to classical autotransport.
  statement: >-
    Establishes the inverted topology of the type Ve architecture, in which the
    barrel is N-terminal and the exported passenger C-terminal. This is the
    direct evidence for withholding GO:0015474 from the inverted variant.
- source_id: PMID:19850876
  title: >-
    Interaction of an autotransporter passenger domain with BamA during its
    translocation across the bacterial outer membrane.
  statement: >-
    Demonstrates that an autotransporter passenger contacts BamA during its
    translocation, which justifies including BAM as a part of this module rather
    than treating it purely as upstream outer-membrane protein biogenesis.
- source_id: file:ECOLI/surA/surA-ai-review.yaml
  title: surA gene review
  statement: >-
    The focused review grounds P0ABZ6 as a periplasmic holdase for unfolded
    outer-membrane proteins acting upstream of BAM, and supplies the holdase
    molecular function and periplasmic location used here.
- source_id: file:ECOLI/Skp/Skp-ai-review.yaml
  title: Skp gene review
  statement: >-
    The focused review grounds P0AEU7 as an ATP-independent periplasmic carrier
    that maintains unfolded outer-membrane proteins in a soluble state.
notes: >-
  Reusable boundary: the module begins with a Sec-delivered precursor in the periplasm and ends
  with the passenger folded on the outer face of the outer membrane. Three things are deliberately
  excluded. Sec translocation is a shared upstream route, as in the sibling type II module. The
  passenger's own biological activity is excluded because the same architecture carries proteases,
  adhesins, lipases, and toxin-delivery proteins, so admitting passenger chemistry would make
  the module a list of unrelated functions rather than a description of a secretion mechanism.
  General outer-membrane protein biogenesis is excluded even though BAM is shared with it: BAM
  is admitted only for the specific step of installing the type V translocator. The periplasmic
  holdases are included rather than treated as upstream because the precursor's unfolded state
  is a requirement of the transport step itself, not merely of its delivery. They are nonetheless
  not type V specific, and the module asserts no exclusivity for them. Ontology and curation gaps
  are recorded here rather than as knowledge_gaps, which CLAUDE.md reserves for biological unknowns
  that only new experiments could close. Nothing below is a biological unknown: a term request
  or a curator would resolve each one. GO:0015474 autotransporter activity hard-codes the classical
  domain order, defining the passenger as N-terminal and the porin as C-terminal. The inverted
  architecture is genuine autotransport by mechanism but is excluded by that wording, so it has
  to borrow the generic transmembrane protein transporter term and the self-transport claim is
  lost. What is asserted instead: Apply GO:0015474 only to the classical, trimeric, and patatin-like
  variants; use the generic transporter term for the inverted variant and record the reason on
  the annoton rather than stretching the definition. (recorded as ontology) Neither insertase
  carries a specific molecular function in GOA. For both BamA and TamA the role is expressed only
  through process and component terms, leaving protein binding as the molecular function annotation.
  For BamA the gap is now argued to be a propagation failure rather than a curatorial judgment,
  since the equivalent mitochondrial insertase SAM50 carries the term by mutant phenotype and
  was never placed as an ancestral node from which it could descend to the bacterial clade. For
  TamA no such argument has been made. What is asserted instead: Keep membrane insertase activity
  on both annotons and keep the note that GOA does not yet carry it. For BamA cite the focused
  gene review, which proposes the term with a comparator check; for TamA leave it as curator synthesis,
  which is all the evidence currently supports. (recorded as curation,ontology) The insertase
  molecular function is settled on the gene instead: genes/ECOLI/bamA/bamA-ai-review.yaml proposes
  GO:0032977 as a NEW annotation with a comparator check, and records the RcsF case it cannot
  cover as a term request.
module:
  id: bacterial_type_v_secretion
  label: Bacterial type V secretion
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: protein secretion by the type V secretion system
    term:
      id: GO:0046819
      label: protein secretion by the type V secretion system
    description: >-
      Passage of a passenger protein across the outer membrane through a
      beta-barrel translocator that is either part of the same polypeptide or a
      dedicated partner protein.
  context:
    taxa:
    - preferred_term: bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
      description: >-
        Diderm bacteria, where the outer membrane creates the energy-free
        translocation problem this route solves.
  parts:
  - order: 1
    role: >-
      Keep the Sec-delivered precursor soluble and unfolded during periplasmic
      transit
    node:
      id: periplasmic_precursor_maintenance
      label: Periplasmic maintenance of the type V precursor
      module_type: BIOLOGICAL_PROCESS
      description: >-
        The periplasm contains no ATP, so the precursor cannot be actively
        unfolded once it has aggregated. Holdase chaperones bind it as it leaves
        Sec and deliver it to BAM in a state competent for barrel assembly.
        These chaperones serve outer-membrane protein biogenesis generally; their
        role here is the type V specific consequence of that activity.
      annotons:
      - id: periplasmic_holdase
        label: Periplasmic holdase chaperone
        participant:
          selector_type: FAMILY
          family:
            preferred_term: periplasmic holdase chaperone family
            family_terms:
            - id: PANTHER:PTHR47637
              label: "CHAPERONE SURA"
            - id: PANTHER:PTHR35089
              label: "CHAPERONE PROTEIN SKP"
            representative_members:
            - preferred_term: SurA (Escherichia coli)
              term:
                id: UniProtKB:P0ABZ6
                label: Chaperone SurA
            - preferred_term: Skp (Escherichia coli)
              term:
                id: UniProtKB:P0AEU7
                label: Chaperone protein Skp
        function:
          preferred_term: unfolded protein holdase activity
          term:
            id: GO:0140309
            label: unfolded protein holdase activity
          description: >-
            ATP-independent binding that holds the substrate in a dynamic
            unfolded state rather than actively folding it.
        processes:
        - preferred_term: Gram-negative-bacterium-type cell outer membrane assembly
          term:
            id: GO:0043165
            label: Gram-negative-bacterium-type cell outer membrane assembly
        - preferred_term: protein secretion by the type V secretion system
          term:
            id: GO:0046819
            label: protein secretion by the type V secretion system
        locations:
        - preferred_term: outer membrane-bounded periplasmic space
          term:
            id: GO:0030288
            label: outer membrane-bounded periplasmic space
        role_description: >-
          Escorts the unfolded precursor from Sec to BAM and prevents
          off-pathway aggregation in the periplasm.
        evidence:
        - source_id: PMID:19850876
          supporting_text: >-
            Using a site-specific photocrosslinking approach, we found that residues
            adjacent to the stall point interact with BamA, a component of a
            heterooligomeric complex (Bam complex) that catalyzes OM protein assembly,
            and that residues closer to the EspP N terminus interact with the
            periplasmic chaperones SurA and Skp.
          statement: >-
            Direct engagement with a type V substrate rather than an upstream
            requirement: during a stalled translocation of the EspP passenger domain,
            SurA and Skp crosslink to the N-terminal segments of the passenger itself.
            This is what supports the type V secretion process term on this annoton.
        - source_id: file:ECOLI/surA/surA-ai-review.yaml
          statement: >-
            The focused review accepts holdase activity and the periplasmic
            location for P0ABZ6 and places it upstream of BAM.
        - source_id: file:ECOLI/Skp/Skp-ai-review.yaml
          statement: >-
            The focused review accepts the same holdase function for P0AEU7 and
            describes it as an ATP-independent carrier across the periplasm.
        notes: >-
          These chaperones act on outer-membrane proteins broadly, so the module
          asserts no exclusivity for them. The type V process term is not carried
          on breadth alone, though: the crosslinking evidence above places them on
          the passenger domain of a type V substrate during its translocation,
          which is participation in this route rather than a general requirement
          upstream of it.
  - order: 2
    role: Install the type V translocator beta-barrel in the outer membrane
    node:
      id: translocator_barrel_installation
      label: Omp85-dependent installation of the type V translocator
      module_type: TRANSPORT_STEP
      description: >-
        An Omp85-family insertase folds and inserts the translocator barrel. Two
        such machines do this work, and which one a given substrate uses is not
        interchangeable: the BAM complex serves outer-membrane proteins
        generally, while the translocation and assembly module was discovered
        because it promotes autotransporter secretion specifically. For the
        classical architecture the passenger domain contacts the insertase while
        it is being translocated, so the insertase is implicated in passenger
        transport and not only in barrel assembly.
      variant_sets:
      - id: outer_membrane_insertase
        label: Outer-membrane insertase
        axis: which Omp85-family insertase installs the translocator barrel
        selection: ONE_OR_MORE
        notes: >-
          Both routes use an Omp85-family barrel with periplasmic POTRA domains,
          so this is a choice between two parallel machines rather than between
          two mechanisms. Selection is ONE_OR_MORE because the routes are not
          known to be mutually exclusive for a given substrate, and because
          whether they are redundant, sequential or substrate-specific is
          unresolved; see the knowledge gaps.
        variants:
        - id: bam_route
          label: BAM-dependent installation
          module_type: TRANSPORT_STEP
          description: >-
            Installation by the BAM complex, the general outer-membrane protein
            biogenesis machine. This is the route implicated for classical
            autotransporters whose passenger has been shown to contact BamA
            during translocation.
          annotons:
          - id: bam_insertase
            label: BamA outer-membrane insertase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: BamA/Omp85 outer-membrane insertase family
                term:
                  id: PANTHER:PTHR12815:SF23
                  label: "OUTER MEMBRANE PROTEIN ASSEMBLY FACTOR BAMA"
                representative_members:
                - preferred_term: BamA (Escherichia coli)
                  term:
                    id: UniProtKB:P0A940
                    label: Outer membrane protein assembly factor BamA
            function:
              preferred_term: membrane insertase activity
              term:
                id: GO:0032977
                label: membrane insertase activity
              description: >-
                Binds the unfolded barrel substrate and mediates its integration into
                the outer membrane.
            processes:
            - preferred_term: Gram-negative-bacterium-type cell outer membrane assembly
              term:
                id: GO:0043165
                label: Gram-negative-bacterium-type cell outer membrane assembly
            - preferred_term: protein insertion into membrane
              term:
                id: GO:0051205
                label: protein insertion into membrane
            - preferred_term: protein secretion by the type V secretion system
              term:
                id: GO:0046819
                label: protein secretion by the type V secretion system
            locations:
            - preferred_term: cell outer membrane
              term:
                id: GO:0009279
                label: cell outer membrane
              description: >-
                Acting as the central subunit of the Bam protein complex
                (GO:1990063), which the locations slot cannot express because it
                accepts only cellular anatomical entities.
            role_description: >-
              Catalyzes insertion of the translocator barrel and engages the
              passenger during its passage.
            evidence:
            - source_id: file:ECOLI/bamA/bamA-ai-review.yaml
              statement: >-
                The focused review proposes membrane insertase activity for BamA
                as a NEW annotation and argues it with a comparator check: yeast
                SAM50, the Omp85-family beta-barrel insertase of the
                mitochondrial outer membrane, carries the term by mutant
                phenotype, and Escherichia coli YidC carries it by mutant
                phenotype and direct assay, so its absence from the BamA record
                is a propagation gap rather than a convention.
            notes: >-
              The insertase molecular function is still absent from GOA, which
              gives BamA only protein binding and chaperone binding in the
              molecular function aspect, with the insertase role carried by
              process and component terms. It is no longer a bare curatorial
              synthesis here: the focused gene review proposes it with a verified
              comparator argument and places the insertion step in BamA's own
              barrel lumen and lateral gate.
        - id: tam_route
          label: TAM-dependent installation
          module_type: TRANSPORT_STEP
          description: >-
            Installation by the translocation and assembly module, a two-subunit
            machine with the Omp85-family barrel TamA in the outer membrane and
            the elongate TamB spanning to the inner membrane. The module was
            discovered through its effect on autotransporter secretion, and for
            at least one classical autotransporter the dependence is absolute in
            a reconstituted membrane.
          annotons:
          - id: tama_insertase
            label: TamA outer-membrane insertase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TamA/Omp85 outer-membrane insertase family
                representative_members:
                - preferred_term: TamA (Escherichia coli)
                  term:
                    id: UniProtKB:P0ADE4
                    label: Translocation and assembly module subunit TamA
            function:
              preferred_term: membrane insertase activity
              term:
                id: GO:0032977
                label: membrane insertase activity
              description: >-
                Shown to be necessary and sufficient to initiate penetration of a
                classical autotransporter into a membrane layer.
            processes:
            - preferred_term: protein insertion into membrane
              term:
                id: GO:0051205
                label: protein insertion into membrane
            - preferred_term: protein secretion by the type V secretion system
              term:
                id: GO:0046819
                label: protein secretion by the type V secretion system
            locations:
            - preferred_term: cell outer membrane
              term:
                id: GO:0009279
                label: cell outer membrane
            role_description: >-
              Receives the substrate and initiates its entry into the outer
              membrane; the conformational change in its POTRA domains on
              substrate arrival is what starts the cycle.
            evidence:
            - source_id: PMID:25341963
              statement: >-
                TamA alone is necessary and sufficient to initiate penetration of
                Antigen 43 into a membrane layer, and the substrate does not
                associate with a membrane lacking the module.
            - source_id: file:ECOLI/flu/flu-ai-review.yaml
              statement: >-
                The focused review of Antigen 43 establishes the TAM dependence of
                its barrel insertion and is the reason this route is modeled.
            notes: >-
              As for BamA, the insertase molecular function is a curatorial
              synthesis rather than an existing GOA annotation.
          - id: tamb_subunit
            label: TamB inner-membrane subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TamB module subunit family
                representative_members:
                - preferred_term: TamB (Escherichia coli)
                  term:
                    id: UniProtKB:P39321
                    label: Translocation and assembly module subunit TamB
            function:
              preferred_term: structural molecule activity
              term:
                id: GO:0005198
                label: structural molecule activity
            processes:
            - preferred_term: protein secretion by the type V secretion system
              term:
                id: GO:0046819
                label: protein secretion by the type V secretion system
            locations:
            - preferred_term: plasma membrane
              term:
                id: GO:0005886
                label: plasma membrane
            role_description: >-
              Elongate subunit anchored in the inner membrane and contacting the
              POTRA domains of TamA, regulating the insertase rather than
              performing insertion itself.
            evidence:
            - source_id: PMID:25341963
              statement: >-
                TamB stands perpendicular to the membrane contacting TamA's POTRA
                domains, and regulates TamA's insertion activity.
            notes: >-
              No catalytic role is asserted. The reconstitution shows TamA alone
              initiates insertion, with TamB modulating the amount of substrate
              that enters.
  - order: 3
    role: Translocate the passenger across the outer membrane and fold it outside
    node:
      id: passenger_translocation
      label: Type V passenger translocation and surface display
      module_type: TRANSPORT_STEP
      description: >-
        The passenger crosses the outer membrane through the translocator barrel
        and folds on the outside. Architectures differ in whether the barrel and
        the passenger are one polypeptide or two, and in the order of the two
        elements within a single polypeptide. That ordering determines which
        molecular function term applies.
      variant_sets:
      - id: type_v_architecture
        label: Type V architecture
        axis: >-
          arrangement of the translocator barrel relative to its passenger
        selection: EXACTLY_ONE
        notes: >-
          The subtype letters are a description of architecture, not of
          phylogeny: all the barrels belong to broadly related outer-membrane
          protein folds, and it is the passenger-barrel arrangement that changes.
        variants:
        - id: classical_autotransporter
          label: Classical monomeric autotransporter (type Va)
          module_type: TRANSPORT_STEP
          description: >-
            One polypeptide with an N-terminal passenger and a C-terminal
            twelve-stranded barrel. This is the arrangement GO:0015474
            describes. Some passengers stay attached to the surface while others
            are released by cleavage inside the barrel.
          annotons:
          - id: va_translocator
            label: Classical autotransporter barrel domain
            participant:
              selector_type: DOMAIN
              domain:
                preferred_term: classical autotransporter C-terminal translocator domain
                term:
                  id: InterPro:IPR005546
                  label: Autotransporter beta-domain
                description: >-
                  The C-terminal twelve-stranded beta-barrel of a monomeric
                  autotransporter, which conducts its own N-terminal passenger.
              description: >-
                A domain selector is used because the translocator and the
                passenger are regions of one polypeptide with distinct roles.
            function:
              preferred_term: autotransporter activity
              term:
                id: GO:0015474
                label: autotransporter activity
            processes:
            - preferred_term: protein secretion by the type V secretion system
              term:
                id: GO:0046819
                label: protein secretion by the type V secretion system
            locations:
            - preferred_term: cell outer membrane
              term:
                id: GO:0009279
                label: cell outer membrane
            role_description: >-
              Forms the outer-membrane conduit for the passenger carried on the
              same chain.
          - id: va_passenger
            label: Classical autotransporter passenger domain
            participant:
              selector_type: FAMILY
              family:
                preferred_term: classical autotransporter family
                term:
                  id: PANTHER:PTHR12338
                  label: "AUTOTRANSPORTER"
                representative_members:
                - preferred_term: Ag43 (Escherichia coli, flu)
                  term:
                    id: UniProtKB:P39180
                    label: Antigen 43
                - preferred_term: EspP (Escherichia coli O157:H7)
                  term:
                    id: UniProtKB:Q7BSW5
                    label: Serine protease EspP
                - preferred_term: Tsh (Escherichia coli)
                  term:
                    id: UniProtKB:Q47692
                    label: Temperature-sensitive hemagglutinin tsh autotransporter
            processes:
            - preferred_term: protein secretion by the type V secretion system
              term:
                id: GO:0046819
                label: protein secretion by the type V secretion system
            locations:
            - preferred_term: cell surface
              term:
                id: GO:0009986
                label: cell surface
            role_description: >-
              The transported region, which folds progressively on the outside
              of the outer membrane; it is retained at the surface or released
              depending on the protein.
            evidence:
            - source_id: file:ECOLI/flu/flu-ai-review.yaml
              statement: >-
                The focused review of Antigen 43 confirms the bipartite
                passenger-plus-barrel architecture, places the passenger at the
                cell surface, and keeps its aggregation function outside this
                module's boundary.
            notes: >-
              No molecular function is asserted. These three exemplars are a
              protease, an aggregation-mediating adhesin, and a hemagglutinin,
              and passenger activity is outside the module boundary.
        - id: two_partner_secretion
          label: Two-partner secretion (type Vb)
          module_type: TRANSPORT_STEP
          description: >-
            The passenger and the transporter are separate proteins encoded
            together: a large TpsA exoprotein and a TpsB transporter whose barrel
            carries periplasmic POTRA domains. Because the barrel is not part of
            the passenger's chain, this is not autotransport.
          annotons:
          - id: vb_tpsb_transporter
            label: TpsB/Omp85-superfamily transporter
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TpsB/Omp85-superfamily two-partner transporter family
                term:
                  id: PANTHER:PTHR34597:SF3
                  label: "OUTER MEMBRANE TRANSPORTER CDIB"
                representative_members:
                - preferred_term: FhaC (Bordetella pertussis)
                  term:
                    id: UniProtKB:P35077
                    label: Filamentous hemagglutinin transporter protein FhaC
                - preferred_term: CdiB (Escherichia coli)
                  term:
                    id: UniProtKB:Q3YL97
                    label: Outer membrane transporter CdiB
            function:
              preferred_term: transmembrane protein transporter activity
              term:
                id: GO:0008320
                label: transmembrane protein transporter activity
              description: >-
                Used instead of autotransporter activity because the transporter
                and the passenger are different polypeptides, which the
                GO:0015474 definition excludes.
            processes:
            - preferred_term: protein secretion by the type V secretion system
              term:
                id: GO:0046819
                label: protein secretion by the type V secretion system
            locations:
            - preferred_term: cell outer membrane
              term:
                id: GO:0009279
                label: cell outer membrane
            role_description: >-
              Recognizes its cognate partner through POTRA domains and conducts
              it across the outer membrane.
          - id: vb_tpsa_passenger
            label: TpsA exoprotein
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TpsA two-partner exoprotein family
                representative_members:
                - preferred_term: FhaB (Bordetella pertussis)
                  term:
                    id: UniProtKB:P12255
                    label: Filamentous hemagglutinin
                - preferred_term: CdiA (Escherichia coli)
                  term:
                    id: UniProtKB:Q3YL96
                    label: Toxin CdiA
            processes:
            - preferred_term: protein secretion by the type V secretion system
              term:
                id: GO:0046819
                label: protein secretion by the type V secretion system
            locations:
            - preferred_term: cell surface
              term:
                id: GO:0009986
                label: cell surface
            role_description: >-
              The transported partner, carrying an N-terminal domain recognized
              by its cognate transporter.
        - id: trimeric_autotransporter
          label: Trimeric autotransporter adhesin (type Vc)
          module_type: TRANSPORT_STEP
          description: >-
            One polypeptide with an N-terminal passenger and a short C-terminal
            barrel segment; three subunits assemble into a single twelve-stranded
            barrel, each contributing four strands, so the barrel is shared.
          annotons:
          - id: vc_translocator
            label: Trimeric autotransporter barrel domain
            participant:
              selector_type: DOMAIN
              domain:
                preferred_term: trimeric autotransporter C-terminal translocator domain
                term:
                  id: InterPro:IPR005594
                  label: Trimeric autotransporter adhesin YadA-like, C-terminal membrane
                    anchor domain
                description: >-
                  The four-stranded C-terminal segment that trimerizes into one
                  twelve-stranded outer-membrane barrel.
            function:
              preferred_term: autotransporter activity
              term:
                id: GO:0015474
                label: autotransporter activity
              description: >-
                The domain order matches the GO:0015474 definition; the term's
                wording does not exclude a barrel built from three copies of the
                same protein.
            processes:
            - preferred_term: protein secretion by the type V secretion system
              term:
                id: GO:0046819
                label: protein secretion by the type V secretion system
            locations:
            - preferred_term: cell outer membrane
              term:
                id: GO:0009279
                label: cell outer membrane
            role_description: >-
              Contributes one third of the shared barrel through which the three
              passengers pass.
          - id: vc_passenger
            label: Trimeric autotransporter passenger domain
            participant:
              selector_type: FAMILY
              family:
                preferred_term: trimeric autotransporter adhesin family
                representative_members:
                - preferred_term: YadA (Yersinia enterocolitica)
                  term:
                    id: UniProtKB:P31489
                    label: Adhesin YadA
                - preferred_term: UpaG (Escherichia coli CFT073)
                  term:
                    id: UniProtKB:A0A0H2VCA1
                    label: Autotransporter adhesin UpaG
                - preferred_term: EhaG (Escherichia coli O157:H7)
                  term:
                    id: UniProtKB:Q7DJ60
                    label: Autotransporter adhesin EhaG
                - preferred_term: EibD (Escherichia coli)
