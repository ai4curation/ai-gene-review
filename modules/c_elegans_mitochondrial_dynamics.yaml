                supporting_text: >-
                  MFF-1 (an outer membrane marker)
          - id: mff2_adaptor
            label: MFF-2 outer-membrane fission adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MFF-2
                term:
                  id: UniProtKB:P91344
                  label: Mitochondrial fission factor
            function:
              preferred_term: molecular adaptor activity
              term:
                id: GO:0060090
                label: molecular adaptor activity
            processes:
              - preferred_term: mitochondrial fission
                term:
                  id: GO:0000266
                  label: mitochondrial fission
            locations:
              - preferred_term: mitochondrial outer membrane
                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
            role_description: >-
              MFF paralog that acts redundantly with MFF-1. No gene review in
              this repository.
            evidence:
              - source_id: PMID:21248201
                title: >-
                  A novel mitochondrial outer membrane protein, MOMA-1, that
                  affects cristae morphology in Caenorhabditis elegans.
                statement: >-
                  C. elegans has two FIS1 homologs and two Mff homologs.
                supporting_text: >-
                  has two Fis1 homologues, encoded by fis-1 and fis-2, and two
                  Mff homologues
    - order: 2
      role: outer-membrane fusion
      node:
        id: fzo1_omm_fusion
        label: FZO-1 mitochondrial outer membrane fusion
        module_type: BIOLOGICAL_PROCESS
        description: >-
          FZO-1 is the only worm mitofusin, a transmembrane dynamin-like
          GTPase of the outer membrane. fzo-1 mutants have highly fragmented
          mitochondria, and the fragmentation needs drp-1.
        concepts:
          - preferred_term: mitochondrial outer membrane fusion
            term:
              id: GO:1990626
              label: mitochondrial outer membrane fusion
        annotons:
          - id: fzo1_gtpase
            label: FZO-1 mitofusin GTPase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FZO-1
                term:
                  id: UniProtKB:Q23424
                  label: Transmembrane GTPase fzo-1
            function:
              preferred_term: GTPase activity
              term:
                id: GO:0003924
                label: GTPase activity
            processes:
              - preferred_term: mitochondrial outer membrane fusion
                term:
                  id: GO:1990626
                  label: mitochondrial outer membrane fusion
            locations:
              - preferred_term: mitochondrial outer membrane
                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
            role_description: >-
              Tethers and fuses outer membranes of neighboring mitochondria.
            evidence:
              - source_id: PMID:18722182
                title: >-
                  Caenorhabditis elegans drp-1 and fis-2 regulate distinct
                  cell-death execution pathways downstream of ced-3 and
                  independent of ced-9.
                statement: >-
                  fzo-1 and eat-3 mutant embryos have highly fragmented
                  mitochondria.
                supporting_text: >-
                  mitochondria appeared highly fragmented in fzo-1(tm1133),
                  eat-3(ad426) and eat-3(tm1107) embryos
              - source_id: PMID:19327994
                title: Bcl-2 proteins EGL-1 and CED-9 do not regulate mitochondrial fission or fusion in Caenorhabditis elegans.
                statement: >-
                  In fzo-1 mutants fission occurs but fusion is restricted.
                supporting_text: >-
                  in a fzo-1 mutant, in which mitochondrial fission occurs but
                  mitochondrial fusion is restricted
    - order: 3
      role: inner-membrane fusion and cristae maintenance
      node:
        id: eat3_imm_fusion
        label: EAT-3 mitochondrial inner membrane fusion
        module_type: BIOLOGICAL_PROCESS
        description: >-
          EAT-3 is the OPA1 ortholog, a dynamin-family GTPase of the inner
          membrane. In eat-3 mutants, matrix compartments are split by
          inner-membrane septa and cristae are disrupted. The animals are
          small, slow-growing, have small broods and are hypersensitive to
          paraquat. These phenotypes are stronger than those of the other
          fission and fusion mutants.
        concepts:
          - preferred_term: mitochondrial inner membrane fusion
            term:
              id: GO:1990627
              label: mitochondrial inner membrane fusion
        annotons:
          - id: eat3_gtpase
            label: EAT-3 (OPA1) inner-membrane fusion GTPase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EAT-3
                term:
                  id: UniProtKB:Q18965
                  label: Dynamin-like GTPase OPA1, mitochondrial
            function:
              preferred_term: GTPase activity
              term:
                id: GO:0003924
                label: GTPase activity
            processes:
              - preferred_term: mitochondrial inner membrane fusion
                term:
                  id: GO:1990627
                  label: mitochondrial inner membrane fusion
            locations:
              - preferred_term: mitochondrial inner membrane
                term:
                  id: GO:0005743
                  label: mitochondrial inner membrane
            role_description: >-
              Fuses inner membranes and maintains cristae architecture.
            evidence:
              - source_id: PMID:18454199
                title: The C. elegans Opa1 homologue EAT-3 is essential for resistance to free radicals.
                statement: >-
                  Inner-membrane septa in eat-3 mutants point to a specific
                  defect in inner-membrane fusion.
                supporting_text: >-
                  the matrices of fragmented mitochondria in eat-3 mutants are
                  divided by inner membrane septae, suggestive of a specific
                  defect in fusion of the mitochondrial inner membrane
              - source_id: PMID:18722182
                title: >-
                  Caenorhabditis elegans drp-1 and fis-2 regulate distinct
                  cell-death execution pathways downstream of ced-3 and
                  independent of ced-9.
                statement: >-
                  eat-3 mutant embryos have disrupted cristae.
                supporting_text: >-
                  mitochondria in eat-3(ad426) embryos had disrupted cristae
                  structures
  connections:
    - source: fzo1_omm_fusion
      target: eat3_imm_fusion
      connection_type: PRECEDES
      description: >-
        Outer-membrane fusion comes before inner-membrane fusion. The order is
        taken from yeast and mammals (Fzo1/MFN, then Mgm1/OPA1). In worms the
        two steps are separated by phenotype: drp-1; eat-3 double mutants
        have connected outer membranes but separate matrix compartments.
      evidence:
        - source_id: PMID:18454199
          title: The C. elegans Opa1 homologue EAT-3 is essential for resistance to free radicals.
          statement: >-
            Without EAT-3, outer membranes stay connected while matrices remain
            separate, so the outer and inner fusion steps can be separated.
          supporting_text: >-
            Mitochondria with highly connected outer membranes (green) but not
            connected matrix compartments (red) in a muscle cell of the
            eat-3(ad426); drp-1(cq5) double mutant.
knowledge_gaps:
  - gap_statement: >-
      Whether the BCL-2-family protein CED-9, with or without EGL-1,
      regulates mitochondrial fission or fusion in living worm cells is
      unresolved.
    boundary: >-
      One study reports that CED-9 binds FZO-1 and that the EGL-1-CED-9
      complex recruits DRP-1. Another finds no effect of loss or gain of
      egl-1 or ced-9 on mitochondrial connectivity or size.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether a BCL-2-family switch between fusion and fission is
      conserved in nematodes.
    resolution: >-
      Quantitative live imaging of fission and fusion rates in ced-9 and egl-1
      null and gain-of-function backgrounds, with endogenous tagging of DRP-1
      and FZO-1 and in vivo interaction assays.
    provenance:
      - reference_id: PMID:21949250
        supporting_text: >-
          we show that the EGL-1-CED-9 complex promotes mitochondrial fission
          by recruiting DRP-1 to mitochondria
      - reference_id: PMID:19327994
        supporting_text: >-
          had no apparent effect on mitochondrial connectivity or mitochondrial
          size
  - gap_statement: >-
      The factor that recruits DRP-1 to worm mitochondria without MFF is
      unknown.
    boundary: >-
      The mff-1 mff-2 double mutant still shows some fission and DRP-1
      recruitment. FIS-1/FIS-2 are not needed for fission, and MiD49/MiD51
      homologs are absent.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Would complete the worm fission recruitment machinery.
    resolution: >-
      DRP-1 localization in fis-1 fis-2 mff-1 mff-2 quadruple mutants, and a
      suppressor or proximity-labeling screen for DRP-1 outer-membrane
      partners.
    provenance:
      - reference_id: PMID:24196833
        supporting_text: >-
          Fis1 and Mff are not absolutely required for mitochondrial fission
  - gap_statement: >-
      Whether MIRO-1 controls mitochondrial transport or distribution in C.
      elegans, and how this relates to the lower mitochondrial content and
      long lifespan of miro-1 mutants, is not established.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Would decide whether mitochondrial positioning should be added as a
      part of worm mitochondrial dynamics.
    resolution: >-
      Live imaging of mitochondrial motility in neurons and muscle of
      miro-1(tm1966) animals, with EF-hand and GTPase-domain point mutants.
    provenance:
      - reference_id: PMID:27064409
        supporting_text: >-
          the amount of mitochondria in the miro-1 mutant is reduced to
          approximately 50% of the wild-type
