id: MODULE:c_elegans_mitochondrial_dynamics
title: Mitochondrial fission and fusion in Caenorhabditis elegans
description: >-
  Mitochondrial shape in Caenorhabditis elegans is set by a balance between
  fission and fusion carried out by three dynamin-family GTPases. Fission of
  the outer membrane is driven by DRP-1, the DNM1L/Drp1 ortholog, which is
  recruited from the cytosol to constriction sites on the outer membrane.
  There it assembles and uses GTP hydrolysis to sever the membrane, while
  inner-membrane division can proceed without it. The tail-anchored
  outer-membrane proteins MFF-1 and MFF-2, orthologs of mitochondrial fission
  factor, act redundantly to promote DRP-1-dependent fission of mitochondria
  and peroxisomes. The two FIS1 homologs, FIS-1 and FIS-2, are not required
  for fission in worms. Fusion happens in two membrane-specific steps. The
  mitofusin FZO-1 fuses outer membranes, and EAT-3, the OPA1 ortholog, fuses
  inner membranes and maintains cristae. Loss of fzo-1 or eat-3 fragments the
  mitochondrial network, and this fragmentation depends on drp-1; loss of
  drp-1 gives interconnected networks in which matrix compartments are joined
  by outer-membrane tubules. Fission and fusion are not needed for programmed
  cell death in this species. They are used in stress responses, in
  recovery of the network after acute heat stress, and in segregating damaged
  mitochondria for mitophagy.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:18722182
    title: >-
      Caenorhabditis elegans drp-1 and fis-2 regulate distinct cell-death
      execution pathways downstream of ced-3 and independent of ced-9.
    statement: >-
      The worm genome has single orthologs of the three mitochondrial dynamin
      GTPases.
    supporting_text: >-
      genome contains three genes, fzo-1, eat-3, and drp-1, which encode
      orthologs of MFN1/FZO1, OPA1, and DRP1, respectively.
  - source_id: PMID:18722182
    title: >-
      Caenorhabditis elegans drp-1 and fis-2 regulate distinct cell-death
      execution pathways downstream of ced-3 and independent of ced-9.
    statement: >-
      Fission requires drp-1, fusion requires fzo-1 and eat-3, and none of
      them is needed for programmed cell death.
    supporting_text: >-
      even though loss of drp-1 blocks mitochondrial fission, and loss of
      fzo-1 or eat-3 prevents mitochondrial fusion and causes excessive
      mitochondrial fission.
  - source_id: PMID:18722182
    title: >-
      Caenorhabditis elegans drp-1 and fis-2 regulate distinct cell-death
      execution pathways downstream of ced-3 and independent of ced-9.
    statement: >-
      Fission is epistatic to fusion: the fragmentation in fzo-1 mutants
      needs drp-1.
    supporting_text: >-
      indicating that drp-1 is required for the mitochondrial fragmentation
      observed in fzo-1 mutants
  - source_id: PMID:24196833
    title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
    statement: >-
      In worms Fis1 and Mff are not absolutely required for fission, and the
      FIS1 homologs have no obvious fission role.
    supporting_text: >-
      Fis1 and Mff are not absolutely required for mitochondrial fission
  - source_id: PMID:33734301
    title: Autophagy facilitates mitochondrial rebuilding after acute heat stress via a DRP-1-dependent process.
    statement: >-
      After acute heat stress the fragmented mitochondrial network is rebuilt
      by a DRP-1-dependent, autophagy-assisted process. This is one
      physiological use of the fission machinery.
    supporting_text: >-
      Autophagy facilitates mitochondrial rebuilding after acute heat stress
      via a DRP-1-dependent process.
  - source_id: file:genes/worm/drp-1/drp-1-ai-review.yaml
    title: worm drp-1 gene review
    statement: >-
      Core function: GTPase activity in mitochondrial fission at the
      mitochondrial outer membrane and cytosol.
  - source_id: file:genes/worm/mff-1/mff-1-ai-review.yaml
    title: worm mff-1 gene review
    statement: >-
      Core function: molecular adaptor activity in mitochondrial fission,
      redundant with MFF-2. MFF is not strictly required for DRP-1
      recruitment in worms.
  - source_id: file:genes/worm/fzo-1/fzo-1-ai-review.yaml
    title: worm fzo-1 gene review
    statement: >-
      Core function: GTPase activity in mitochondrial fusion at the outer
      membrane.
  - source_id: file:genes/worm/eat-3/eat-3-ai-review.yaml
    title: worm eat-3 gene review
    statement: >-
      Core function: GTPase activity in mitochondrial inner membrane fusion
      (GO:1990627) and cristae maintenance.
  - source_id: file:genes/worm/fis-1/fis-1-ai-review.yaml
    title: worm fis-1 gene review
    statement: >-
      FIS-1 does not detectably act in fission in worms. It acts after
      fission, in mitophagy, so it is modeled in MODULE:c_elegans_mitophagy.
  - source_id: file:projects/CAEEL_MITOPHAGY.md
    title: C. elegans Mitophagy and Mitochondrial Quality Control project page
    statement: >-
      Project page listing the worm mitochondrial dynamics gene reviews from
      which this module draws.
notes: >-
  Boundary. This is a concrete C. elegans module for the membrane-remodeling
  reactions that divide and join mitochondria: DRP-1-dependent outer-membrane
  fission with its MFF adaptors, FZO-1 outer-membrane fusion, and EAT-3
  inner-membrane fusion. Selective removal of mitochondria is
  MODULE:c_elegans_mitophagy, which uses MFF/DRP-1 fission upstream of the
  FIS-1/FIS-2-dependent disposal step in muscle.

  FIS-1 and FIS-2. The project page lists the FIS1 homologs as fission
  factors, but in worms neither single nor double mutants have a detectable
  fission or morphology defect (PMID:24196833, PMID:18722182). Both gene
  reviews give them mitophagy and disposal roles, not a role in DRP-1
  recruitment. They are therefore members of the mitophagy module, not of
  the fission part here. FIS-1 overexpression can still fragment
  mitochondria, even in the Mff double mutant, so it can promote fission when
  overexpressed. That is not evidence for an endogenous role.

  MFF-2. MFF-2 (P91344, F55F8.6; unreviewed UniProt entry, no gene review in
  this repository) is included alongside MFF-1 because the strong fission
  defect needs both genes. Its accession is from UniProt and matches the
  F55F8 locus named in PMID:21248201. MiD49/MiD51-type recruiters are
  vertebrate-specific and absent from worms.

  BCL-2-family regulation. CED-9 binds FZO-1 and, when bound to EGL-1, binds
  and recruits DRP-1 (PMID:21949250). Another group found that loss or gain
  of egl-1 or ced-9 had no effect on mitochondrial connectivity or size
  (PMID:19327994). CED-9 and EGL-1 are therefore not modeled as members.
  The conflict is recorded as a knowledge gap.

  Members left out. MIRO-1 (Q94263) is an outer-membrane Rho GTPase that, in
  other animals, links mitochondria to microtubule motors. Its worm review
  supports GTPase, calcium-binding and kinesin-binding activities, but no
  cached primary paper shows a worm transport or distribution defect: the
  miro-1 mutant has about half the normal amount of mitochondria and a long
  lifespan (PMID:27064409). Transport is also a different process from
  fission and fusion, so MIRO-1 is noted here and not modeled. SPG-7
  (Q9N3T5) is the worm AFG3L2-type m-AAA protease subunit of the inner
  membrane. Its review places it in mitochondrial protein processing,
  respiratory-chain assembly and the UPRmt, not in the dynamics machinery.
  No worm evidence links it to EAT-3 processing, so it is left out.
  MOMA-1 affects cristae morphology and is also left out.
module:
  id: c_elegans_mitochondrial_dynamics
  label: Mitochondrial fission and fusion in C. elegans
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Dynamin-family GTPase machinery that divides (DRP-1 with MFF-1/MFF-2) and
    fuses (FZO-1 outer membrane, EAT-3 inner membrane) mitochondria in C.
    elegans. The balance between the two sets mitochondrial network
    morphology.
  concepts:
    - preferred_term: mitochondrion organization
      term:
        id: GO:0007005
        label: mitochondrion organization
      description: >-
        Broad parent context. The specific processes are on the part nodes.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    cellular_components:
      - preferred_term: mitochondrion
        term:
          id: GO:0005739
          label: mitochondrion
  parts:
    - order: 1
      role: outer-membrane fission
      node:
        id: drp1_fission
        label: DRP-1/MFF mitochondrial fission
        module_type: BIOLOGICAL_PROCESS
        description: >-
          DRP-1 is recruited to spots on the mitochondrial outer membrane where
          scission later occurs, and it controls the final severing of the
          outer membrane. MFF-1 and MFF-2 are tail-anchored outer-membrane
          adaptors that act redundantly to promote fission. The mff-1 mff-2
          double mutant has a fission defect close to that of drp-1. DRP-1 can
          still reach worm mitochondria without MFF, so another recruitment
          route must exist.
        concepts:
          - preferred_term: mitochondrial fission
            term:
              id: GO:0000266
              label: mitochondrial fission
        evidence:
          - source_id: PMID:10619028
            title: C. elegans dynamin-related protein DRP-1 controls severing of the mitochondrial outer membrane.
            statement: >-
              In drp-1 mutants outer-membrane scission is blocked while
              inner-membrane scission still occurs.
            supporting_text: >-
              This indicates that scission of the mitochondrial outer membrane
              is inhibited, while scission of the inner membrane still occurs.
        annotons:
          - id: drp1_gtpase
            label: DRP-1 fission dynamin GTPase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DRP-1
                term:
                  id: UniProtKB:Q8WQC9
                  label: Dynamin-1-like protein drp-1
            function:
              preferred_term: GTPase activity
              term:
                id: GO:0003924
                label: GTPase activity
            processes:
              - preferred_term: mitochondrial fission
                term:
                  id: GO:0000266
                  label: mitochondrial fission
            locations:
              - preferred_term: mitochondrial outer membrane
                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Mechanochemical GTPase that severs the outer membrane at
              constriction sites. Recruited from the cytosol.
            evidence:
              - source_id: PMID:10619028
                title: C. elegans dynamin-related protein DRP-1 controls severing of the mitochondrial outer membrane.
                statement: >-
                  GFP-DRP-1 marks future scission sites, and overexpression
                  over-fragments mitochondria.
                supporting_text: >-
                  DRP-1 fused to GFP is observed in spots on mitochondria where
                  scission eventually occurs.
              - source_id: PMID:10619028
                title: C. elegans dynamin-related protein DRP-1 controls severing of the mitochondrial outer membrane.
                statement: >-
                  DRP-1 controls outer-membrane scission in the last stage of
                  division.
                supporting_text: >-
                  wild-type DRP-1 contributes to the final stages of
                  mitochondrial division by controlling scission of the
                  mitochondrial outer membrane
          - id: mff1_adaptor
            label: MFF-1 outer-membrane fission adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MFF-1
                term:
                  id: UniProtKB:Q19343
                  label: Mitochondrial fission factor
            function:
              preferred_term: molecular adaptor activity
              term:
                id: GO:0060090
                label: molecular adaptor activity
              description: >-
                Assigned by analogy to mammalian MFF, the main DRP1 receptor.
                Direct binding of worm MFF-1 to DRP-1 has not been shown in
                the cached literature.
            processes:
              - preferred_term: mitochondrial fission
                term:
                  id: GO:0000266
                  label: mitochondrial fission
            locations:
              - preferred_term: mitochondrial outer membrane
                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
            role_description: >-
              Tail-anchored outer-membrane fission factor, redundant with
              MFF-2.
            evidence:
              - source_id: PMID:24196833
                title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
                statement: >-
                  Single mff mutants are weak, and the double mutant has a
                  fission defect close to drp-1.
                supporting_text: >-
                  mff-1 and mff-2 single mutants have weak effects, and that the
                  Mff double mutant has a mitochondrial fission defect similar
                  to but not as strong as the drp-1 defect
              - source_id: PMID:21248201
                title: >-
                  A novel mitochondrial outer membrane protein, MOMA-1, that
                  affects cristae morphology in Caenorhabditis elegans.
                statement: >-
                  MFF-1 is used as an outer-membrane marker in mitochondrial
