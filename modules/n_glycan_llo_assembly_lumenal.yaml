    title: 'Biosynthesis of lipid-linked oligosaccharides in yeast: the ALG3 gene encodes the Dol-P-Man:Man5GlcNAc2-PP-Dol mannosyltransferase.'
    statement: ALG3 adds the first Dol-P-Man-derived mannose on the lumenal side.
  - source_id: PMID:15987956
    title: ALG9 mannosyltransferase is involved in two different steps of lipid-linked oligosaccharide biosynthesis.
    statement: Yeast ALG9 adds both the seventh and the ninth mannose.
  - source_id: PMID:10336995
    title: Ordered assembly of the asymmetrically branched lipid-linked oligosaccharide in the endoplasmic reticulum is ensured by the substrate specificity of the individual glycosyltransferases.
    statement: ALG12 adds the alpha-1,6 mannose to Man7GlcNAc2-PP-Dol; substrate specificity enforces ordered assembly.
  - source_id: PMID:8877369
    title: Isolation of the ALG6 locus of Saccharomyces cerevisiae required for glucosylation in the N-linked glycosylation pathway.
    statement: ALG6 is required for the first glucosylation of the LLO.
  - source_id: PMID:9597543
    title: 'The ALG10 locus of Saccharomyces cerevisiae encodes the alpha-1,2 glucosyltransferase of the endoplasmic reticulum: the terminal glucose of the lipid-linked oligosaccharide is required for efficient N-linked glycosylation.'
    statement: ALG10 (DIE2) adds the terminal alpha-1,2 glucose.
  - source_id: PMID:23751184
    title: N-linked protein glycosylation in the endoplasmic reticulum.
    statement: Review of LLO assembly on both faces of the ER membrane, centred on S. cerevisiae.
