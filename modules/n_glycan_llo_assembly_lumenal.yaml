  - source_id: YeastPathways:GLUCOSE-MANNOSYL-CHITO-DOLICHOL
    title: lipid-linked oligosaccharide biosynthesis (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLUCOSE-MANNOSYL-CHITO-DOLICHOL
    statement: 'The YeastCyc frame spans both LLO modules. Lumenal reactions: RXN3O-291 (ALG3), RXN3O-3 and RXN3O-259 (ALG9), RXN3O-11 (ALG12), RXN3O-411 (ALG6), RXN3O-412 (ALG8) and RXN3O-413 (DIE2/ALG10). All gene assignments were retained.'
