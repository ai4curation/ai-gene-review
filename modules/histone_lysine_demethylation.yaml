id: MODULE:histone_lysine_demethylation
title: Human histone lysine demethylation — FAD-dependent amine-oxidase demethylases KDM1A (LSD1) and KDM1B (LSD2) erasing H3K4me1/me2, and the Fe(II)/2-oxoglutarate-dependent JmjC demethylase families KDM2 (H3K36me1/me2), KDM3 (H3K9me1/me2), KDM4 (H3K9/H3K36me2/me3), KDM5 (H3K4me2/me3), KDM6 (H3K27me2/me3) and KDM7/PHF (H3K9me1/me2)
description: >-
  Methyl marks on histone lysines are removed by two unrelated classes of enzyme, each
  specific for the site and degree of methylation. The KDM1 (LSD) family, KDM1A (LSD1) and
  KDM1B (LSD2), are flavin amine oxidases: bound FAD oxidises the methylated epsilon-amine of a
  mono- or dimethyl lysine to an imine, which hydrolyses to the demethylated lysine and
  formaldehyde, and the reduced flavin is reoxidised by an electron acceptor, giving hydrogen
  peroxide when the acceptor is oxygen. The mechanism needs a protonated amine and so cannot
  act on trimethyl lysine. Both enzymes erase H3K4me1 and H3K4me2; KDM1A works mainly within
  corepressor complexes such as CoREST and, with the androgen receptor, also removes H3K9me1/me2.
  The second class are JmjC-domain dioxygenases. Using Fe(II), oxygen and 2-oxoglutarate, which
  is decarboxylated to succinate and carbon dioxide, they hydroxylate the methyl group, and the
  resulting hemiaminal releases formaldehyde; this chemistry also removes trimethyl marks. The
  human histone demethylases of this class fall into six families: KDM2A/B remove H3K36me1/me2;
  KDM3A/B remove H3K9me1/me2; KDM4A-D remove H3K9me3/me2, and KDM4A-C also H3K36me3/me2;
  KDM5A-D remove H3K4me3/me2; KDM6A (UTX) and KDM6B (JMJD3) remove the Polycomb mark
  H3K27me3/me2; and the PHD-JmjC enzymes KDM7A, PHF8 and PHF2 remove H3K9me1/me2, with H3K27me2
  (KDM7A) or H4K20me1 (PHF8) as further substrates. Demethylation of activating marks (H3K4)
  accompanies gene repression, and demethylation of repressive marks (H3K9, H3K27) accompanies
  activation, so each family is paired with the methyltransferases that write its mark.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001338
    title: histone modification pathway
    statement: >-
      RGD curates 21 human lysine demethylase genes to this pathway (TAS, PMID:23200123 for all;
      KDM4A and KDM6A also from other reviews): KDM1A, KDM1B, KDM2A, KDM2B, KDM3A, KDM3B, JMJD1C,
      KDM4A, KDM4B, KDM4C, KDM4D, KDM5A, KDM5B, KDM5C, KDM5D, KDM6A, KDM6B, KDM7A, PHF2, PHF8 and
      KDM8. Its diagram draws "Kdemethylases" acting on methyllysine. This module realises the
      lysine demethylase part of the pathway, item 5 of the histone modification split plan in
      projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md. Id and label checked against
      .cache/rgd_pw/pw.obo.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001338.yaml
    statement: RGD describes the two demethylase classes, the FAD-dependent amine oxidase of Kdm1a and the Fe(II)/alpha-ketoglutarate-dependent JmjC enzymes.
    supporting_text: Other KDM classes rely on molecular oxygen, Fe(II) and alpha-ketoglutarate
  - source_id: GO:0006338
    title: chromatin remodeling
    statement: >-
      PW:0001338 has no GO process mapping, and GO has obsoleted histone lysine demethylation
      and every site-specific histone demethylation process term, each with the comment that it
      represents a molecular function. The module's process concept is therefore chromatin
      remodeling, the process that human GOA attaches to the JmjC families by IBA (KDM2A/B,
      KDM4A-D, KDM5A-D, KDM7A, PHF2, PHF8) and to KDM2B by IDA; the site-specific chemistry is
      carried by the molecular functions on the annotons.
  - source_id: PMID:23200123
    title: 'Histone lysine methylation dynamics: establishment, regulation, and biological impact.'
    statement: RGD's source for the demethylase gene list; a review of the lysine methyltransferases and demethylases.
    supporting_text: Other demethylases, including KDM7B and KDM5C, are mutated in patients with cognitive or neurological impairments
  - source_id: PMID:15620353
    statement: LSD1 was the first histone demethylase identified, acting on H3K4 by oxidation.
    supporting_text: LSD1 specifically demethylates histone H3 lysine 4, which is linked to active transcription.
  - source_id: PMID:16362057
    statement: JHDM1 (KDM2A) established the JmjC domain as the signature of a second demethylase class.
    supporting_text: we identify the JmjC domain as a novel demethylase signature motif
  - source_id: PMID:23593242
    statement: Exclusion of JMJD1C. In a systematic comparison of the KDM3 subfamily, no histone demethylase activity was observed for JMJD1C, whereas KDM3A and KDM3B were active.
    supporting_text: we fail to observe histone demethylase activity for JMJD1C using immunocytochemical and biochemical approaches
  - source_id: PMID:29563586
    statement: Exclusion of KDM8 (JMJD5). Substrate screening and crystal structures assign JMJD5 as an arginine C-3 hydroxylase rather than a lysine demethylase.
    supporting_text: supporting the assignment of JMJD5 as an arginine hydroxylase rather than a KDM
  - source_id: PMID:20457893
    statement: The earlier report of KDM8 as an H3K36me2 demethylase, the basis of its name and its GOA demethylase row; superseded for this module by PMID:29563586.
    supporting_text: JMJD5 (now renamed KDM8), a JmjC family member, demethylates H3K36me2
  - source_id: PMID:24798337
    statement: UTY (KDM6C), not on the RGD list, is an active H3K27 demethylase in vitro but with reduced activity; it is not modelled (see notes).
    supporting_text: UTY(KDM6C) catalyzes demethylation of H3K27 peptides in vitro, analogously to KDM6B and KDM6A, but with reduced activity
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001338 (histone modification pathway)
  through the RGD_PATHWAY_ONTOLOGY project, as item 5 of the histone modification split plan
  (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md; seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier no_specific_go_term, flagged
  broad, 173 RGD-curated human genes). PW:0001338 is the only PW evidence source: it has no PW
  child for demethylation, and its diagram node "Kdemethylases" links only to an RGD web page.
  RGD annotates 21 human lysine demethylase genes to PW:0001338 (from .cache/rgd_pw/homo_genes_pw,
  all TAS to PMID:23200123). Nineteen are modelled: KDM1A and KDM1B (part 1); KDM2A, KDM2B, KDM3A,
  KDM3B, KDM4A, KDM4B, KDM4C, KDM4D, KDM5A, KDM5B, KDM5C, KDM5D, KDM6A, KDM6B, KDM7A, PHF8 and
  PHF2 (part 2). Two RGD genes are excluded, JMJD1C and KDM8, for the reasons in (4). No gene
  outside the RGD list is added. UniProt accessions and recommended names are from UniProt REST
  (November 2026). Molecular functions are from each protein's experimental human GOA rows in
  QuickGO (November 2026), using the most specific site- and state-specific term with an
  experimental row. Two functions are curator-authored or held at a parent term: KDM3B has no
  experimental molecular-function row and its H3K9me1/me2 term rests on two human papers
  (PMID:22615488, PMID:23593242); KDM5D and PHF2 use the parent site terms (H3K4, H3K9) at which
  their experimental rows sit. Only KDM4C has a gene review in this repository; its accepted
  H3K9me2/me3 demethylase function is used unchanged. Reactions were taken from Rhea (the EC
  master reactions cross-referenced from each GO term) and every ChEBI label was checked in
  OLS. For the FAD-dependent reaction Rhea writes a generic acceptor; FAD, FADH2, O2 and H2O2
  are written from the LSD1 mechanism paper PMID:15811342.

  GO process. GO has obsoleted histone demethylation, histone lysine demethylation and every
  site-specific histone demethylation process (H3K4, H3K9, H3K27, H3K36, H4K20), each because
  it represents a molecular function, so the content now lives in the histone demethylase
  activity terms on the annotons and no new process term is requested. The module process is
  GO:0006338 chromatin remodeling, which human GOA uses for the JmjC families (IBA, and IDA for
  KDM2B). It is the neutral choice: H3K4 demethylation accompanies repression and H3K9/H3K27
  demethylation accompanies activation, so neither a positive nor a negative regulation of
  transcription term fits the module as a whole.

  Boundary and modelling decisions. (1) Two catalytic parts by chemistry. Part 1 is the
  FAD-dependent amine oxidases, part 2 the Fe(II)/2-oxoglutarate-dependent JmjC dioxygenases,
  as RGD's own description divides them. Each enzyme is one gene-product annoton with its own
  activity, because each was shown to be active as an isolated protein. Paralogues are grouped
  as variants (selection ONE_OR_MORE, since paralogues are co-expressed and act at different
  loci rather than excluding one another); within part 2 the six families are sub-parts, each
  defined by the mark it erases. (2) One function per annoton. Several enzymes have a second
  genuine site: KDM1A on H3K9me1/me2 with the androgen receptor, KDM4A-C on H3K36me3/me2, KDM7A
  on H3K27me2 and PHF8 on H4K20me1. The annoton carries the activity with the strongest
  evidence and the second site is in its role text, rather than duplicating annotons.
  (3) Complexes are left to their modules. KDM1A is the catalytic subunit of CoREST, which the
  sibling histone_deacetylation models with KDM1A as a unit without this activity; KDM6A is a
  substoichiometric MLL3/MLL4 subunit in compass_family_h3k4_methylation; KDM2B is the PRC1.1
  targeting subunit in polycomb_repressive_complexes. Each sibling defers the demethylase
  activity to this module, and it is written here once. Cofactor and partner proteins (RCOR1
  for KDM1A on nucleosomes, NPAC/GLYR1 for KDM1B, ARID5B for PHF2) are named in role text and
  not modelled as units here. (4) Measured activity is not automatically function. Each JmjC
  candidate was judged on whether it evolved to demethylate histone lysines. JMJD1C (on the
  RGD list) is excluded: a systematic comparison found no histone demethylase activity for it
  where KDM3A and KDM3B were active (PMID:23593242), and its one human GOA row is an IMP for the
  parent H3K9 term (PMID:32034158) that cannot separate catalysis from an indirect effect. KDM8
  (JMJD5, on the RGD list) is excluded: it was reported as an H3K36me2 demethylase
  (PMID:20457893), but substrate screening and structures assign it as an arginyl C-3
  hydroxylase rather than a KDM (PMID:29563586), and it also has peptidase rows. Not on the RGD
  list and not added: JMJD6, whose histone arginine demethylase claim is disputed against its
  lysyl hydroxylase activity (RGD's own text says so) and which in any case acts on arginine;
  the ribosomal oxygenases RIOX1 (NO66) and RIOX2 (MINA), whose experimental human rows are for
  ribosomal protein histidyl hydroxylation, not histone demethylation; HR (hairless), which has
  no experimental human row; KDM4E, which has in vitro H3K9me3/me2 activity (PMID:21914792) but
  is not on the RGD list and has no cellular evidence cached here; and UTY (KDM6C), whose
  H3K27 demethylase activity is real but reduced in vitro (PMID:24798337) and whose in vivo
  role is not established in human. These are named here only. (5) Readers. The PHD, Tudor
  and ARID domains of the demethylases are part of the enzymes and appear in role text;
  free-standing methyllysine readers stay out, as the split plan says. (6) Substrates. Histones
  are substrates, not participants, and are represented only as ChEBI lysyl-residue groundings
  on the functions. (7) Writers. The plan's "paired by the mark they erase" is carried by the
  family node descriptions and by reference to the writer modules: H3K4 methylation in
  compass_family_h3k4_methylation (erased by KDM1 and KDM5), H3K27 methylation in
  polycomb_repressive_complexes (erased by KDM6), and H3K9 and H3K36 methylation in
  histone_lysine_methylation_h3k9_h3k36_h3k79_h4k20 (erased by KDM3, KDM4 and KDM2). (8) Out of scope:
  demethylation of non-histone substrates (p53, DNMT1, E2F1 and others by KDM1A), the
  inhibitor pharmacology, regulation of the enzymes by phosphorylation and degradation except
  where it gates activity (PHF2), and the oncometabolite inhibition of JmjC enzymes beyond the
  KDM2B evidence used.

  GO-CAM links. gocams/index.tsv (November 2026) has two human production models with members:
  gomodel:65bc474400001510 (KDM1A, GO:0032453, SNAI1 repression in epithelial to mesenchymal
  transition) and gomodel:64d5781900002111 (KDM4D, GO:0140684, TRIM14-USP14 stabilisation in
  inflammatory response). Their KDM1A and KDM4D activities are linked to the matching annotons.
  PANTHER family ids and PTNs are deliberately not asserted.

  Possible upstream errors (query only). (a) KDM1A carries EXP rows for GO:0140683 histone
  H3K9me/H3K9me2 demethylase activity (PMID:16079795, PMID:25684206). That term is defined as a
  Fe(II)/2-oxoglutarate dioxygenase reaction; LSD1 is FAD-dependent, and the fitting term is
  GO:0140685 FAD-dependent histone H3K9me/H3K9me2 demethylase activity, which carries no
  experimental human row. Candidate repoint for GOA (UniProt). (b) KDM8 carries an IDA row for
  GO:0051864 histone H3K36 demethylase activity (PMID:20457893) that later structural and
  biochemical work does not support (PMID:29563586); flagged as disputed, not as a wrong row.
  (c) GO term faults are recorded in proposed_ontology_changes: the GO:0140682 label disagrees
  with its definition, the GO:0141052 definition excludes the FAD-dependent and arginine
  children it has, and GO:0140685 carries a broad match to a 2-oxoglutarate EC number.
proposed_ontology_changes:
  - change_type: NODE_RENAME
    ontology: GO
    about_node:
      id: GO:0140682
      label: FAD-dependent H3K4me/H3K4me3 demethylase activity
    old_value: FAD-dependent H3K4me/H3K4me3 demethylase activity
    new_value: FAD-dependent histone H3K4me/H3K4me2 demethylase activity
    change_dsl: rename GO:0140682 from 'FAD-dependent H3K4me/H3K4me3 demethylase activity' to 'FAD-dependent histone H3K4me/H3K4me2 demethylase activity'
    origin: SELF_PROPOSED
    stance: AGREE
    confidence: CONFIRMED
    justification: >-
      The label names H3K4me3, but the definition is "removal of a methyl group from a di- or a
      monomethyl-lysine residue at position 4 of the histone H3 protein", the exact synonym is
      "histone H3-di/monomethyl-lysine-4 FAD-dependent demethylase activity", and the amine
      oxidase chemistry of LSD1 and LSD2 cannot remove a trimethyl mark. The sibling terms
      follow the pattern "histone H3K9me/H3K9me2", so "me2" (and the missing "histone") was
      meant. The current label invites annotation of trimethyl demethylases.
    supported_by:
      - reference_id: PMID:17320160
        supporting_text: is chemically restricted to demethylation of only mono- and di- but not trimethylated histone H3 lysine 4 (H3K4me3)
      - reference_id: PMID:15620353
        supporting_text: LSD1 specifically demethylates histone H3 lysine 4
  - change_type: NODE_TEXT_DEFINITION_CHANGE
    ontology: GO
    about_node:
      id: GO:0141052
      label: histone H3 demethylase activity
    old_value: >-
      Catalysis of the removal of a methyl group from a modified lysine residue of the histone
      H3 protein. This is a dioxygenase reaction that is dependent on Fe(II) and 2-oxoglutarate.
    new_value: Catalysis of the removal of a methyl group from a methylated residue of the histone H3 protein.
    change_dsl: change definition of GO:0141052 to 'Catalysis of the removal of a methyl group from a methylated residue of the histone H3 protein.'
    origin: SELF_PROPOSED
    stance: AGREE
    confidence: PROBABLE
    justification: >-
      GO:0141052 is the parent of histone H3K4 demethylase activity and histone H3K9 demethylase
      activity, whose children include the FAD-dependent amine oxidase activities GO:0140682
      and GO:0140685, and of GO:0033746 histone H3R2 demethylase activity, which acts on
      arginine. Its definition restricts it to lysine and to Fe(II)/2-oxoglutarate dioxygenase
      chemistry, so the FAD-dependent and arginine descendants contradict their parent's
      definition. The mechanism belongs on the dioxygenase children (which already say it) and
      the residue type on the site-specific terms.
    supported_by:
      - reference_id: PMID:15811342
        supporting_text: histone demethylation involves the flavin-catalysed oxidation of the methylated lysine
      - reference_id: PMID:16362057
        supporting_text: In the presence of Fe(ii) and alpha-ketoglutarate, JHDM1 demethylates H3-methyl-K36 and generates formaldehyde and succinate.
  - change_type: REMOVE_MAPPING
    ontology: GO
    about_node:
      id: GO:0140685
      label: FAD-dependent histone H3K9me/H3K9me2 demethylase activity
    old_value: EC:1.14.11.65
    origin: SELF_PROPOSED
    stance: AGREE
    confidence: PROBABLE
    justification: >-
      GO:0140685 carries skos:broadMatch EC:1.14.11.65, the [histone H3]-dimethyl-L-lysine9
      demethylase reaction, which is a 2-oxoglutarate-dependent dioxygenase reaction (EC
      1.14.11, with 2-oxoglutarate as one donor) and the exact match of the JmjC term GO:0140683.
      An FAD-dependent amine oxidation is not a 2-oxoglutarate reaction, so the EC is not
      broader than the GO term but a different reaction. The fitting EC class is that of the H3K4
      counterpart GO:0140682 (EC 1.14.99.66, acceptor-dependent); no EC yet exists for H3K9.
    supported_by:
      - reference_id: PMID:20228790
        supporting_text: during androgen receptor (AR)-activated gene expression, LSD1 removes mono- and dimethyl marks from lysine 9 of histone H3 (H3K9)
      - reference_id: PMID:15811342
        supporting_text: histone demethylation involves the flavin-catalysed oxidation of the methylated lysine
module:
  id: histone_lysine_demethylation
  label: Human histone lysine demethylation
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: chromatin remodeling
      term:
        id: GO:0006338
        label: chromatin remodeling
      description: >-
        The GO process used for the histone demethylases now that GO has obsoleted the
        histone demethylation processes as molecular functions; the site-specific
        demethylase activities are on the leaf annotons.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
  - order: 1
    role: FAD-dependent amine-oxidase demethylation of mono- and dimethyl H3K4
    node:
      id: amine_oxidase_demethylases
      label: KDM1 (LSD) family FAD-dependent amine-oxidase histone demethylases
      module_type: MOLECULAR_FUNCTION
      description: KDM1A (LSD1) and KDM1B (LSD2) oxidise the methylated epsilon-amine of a mono- or dimethyl
        lysine with bound FAD, giving an imine that hydrolyses to the demethylated lysine and formaldehyde;
        the reduced flavin is reoxidised by an electron acceptor, O2 in vitro, which yields hydrogen peroxide.
        The chemistry cannot act on trimethyl lysine.
      variant_sets:
      - id: kdm1_paralogs
        label: KDM1A or KDM1B
        axis: catalytic paralogue
        selection: ONE_OR_MORE
        variants:
        - id: kdm1a_variant
          label: KDM1A (LSD1)
          annotons:
          - id: kdm1a_h3k4_demethylase
            label: KDM1A (LSD1) demethylates H3K4me1/me2 by FAD-dependent amine oxidation
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: KDM1A
                term:
                  id: UniProtKB:O60341
                  label: Lysine-specific histone demethylase 1A
            function:
              preferred_term: FAD-dependent histone H3K4me1/me2 demethylase activity
              term:
                id: GO:0140682
                label: FAD-dependent H3K4me/H3K4me3 demethylase activity
              description: The GO label says H3K4me/H3K4me3 but the definition (di- or monomethyl H3K4)
                is the activity meant here; the label fault is recorded in proposed_ontology_changes.
              substrates:
              - preferred_term: H3K4me2 (dimethyl-L-lysyl(4)-[histone H3])
                term:
                  id: CHEBI:61976
                  label: N(6),N(6)-dimethyl-L-lysine(1+) residue
              - preferred_term: water
                term:
                  id: CHEBI:15377
                  label: water
              - preferred_term: O2
                term:
                  id: CHEBI:15379
                  label: dioxygen
                description: Electron acceptor that reoxidises the reduced flavin in vitro; Rhea writes
                  a generic acceptor A.
              products:
              - preferred_term: H3K4me1, then H3K4 (the monomethyl intermediate is demethylated in a second
                  cycle)
                term:
                  id: CHEBI:61929
                  label: N(6)-methyl-L-lysinium residue
              - preferred_term: formaldehyde
                term:
                  id: CHEBI:16842
                  label: formaldehyde
              - preferred_term: hydrogen peroxide
                term:
                  id: CHEBI:16240
                  label: hydrogen peroxide
                description: Product of flavin reoxidation by O2.
              cofactors:
              - preferred_term: FAD
                term:
                  id: CHEBI:57692
                  label: FAD(3-)
                description: Non-covalently bound flavin that oxidises the methylated amine to an imine.
              - preferred_term: FADH2
                term:
                  id: CHEBI:58307
                  label: FADH2(2-)
                description: Reduced flavin formed in each cycle and reoxidised by the electron acceptor.
              evidence:
              - source_id: RHEA:60244
                statement: N(6),N(6)-dimethyl-L-lysyl(4)-[histone H3] + 2 A + 2 H2O = L-lysyl(4)-[histone
                  H3] + 2 formaldehyde + 2 AH2; the EC 1.14.99.66 reaction cross-referenced from GO:0140682
                  (single steps RHEA:60248 and RHEA:60256). Rhea leaves the acceptor generic; FAD, FADH2,
                  O2 and H2O2 are written here from PMID:15811342. Labels checked in OLS (November 2026).
              - source_id: PMID:15811342
                statement: LSD1 demethylation is a flavin-catalysed oxidation of the methylated lysine,
                  and LSD1 reduces O2 to H2O2.
                supporting_text: histone demethylation involves the flavin-catalysed oxidation of the methylated
                  lysine
              - source_id: PMID:15811342
                statement: Hydrogen peroxide is the product of reoxidation by oxygen, a modest reactivity;
                  other acceptors may act in vivo.
                supporting_text: LSD1 converts oxygen to hydrogen peroxide although this reactivity is not
                  as pronounced as that of other flavin-dependent oxidases
            processes:
            - preferred_term: chromatin remodeling
              term:
                id: GO:0006338
                label: chromatin remodeling
            locations:
            - preferred_term: chromatin
              term:
                id: GO:0000785
                label: chromatin
            role_description: KDM1A carries EXP and IDA rows for GO:0140682 (PMID:15620353, PMID:15811342,
              PMID:20164337, PMID:26214369, PMID:20228790, PMID:27292636). The amine-oxidase chemistry needs
              a protonated alpha-amine hydrogen, so it removes only mono- and dimethyl marks. As a subunit
              of corepressor complexes (CoREST, modelled with KDM1A as a unit in histone_deacetylation)
              it erases H3K4me1/me2; with the androgen receptor it removes H3K9me1/me2 (PMID:16079795),
              a switch controlled by H3T6 phosphorylation (PMID:20228790). That second activity is GO:0140685
              FAD-dependent histone H3K9me/H3K9me2 demethylase activity; it is recorded here in prose because
              an annoton carries one function and H3K4 is the activity of the corepressor complexes. KDM1A
              acts on free histones and peptides alone; its activity on nucleosomes needs CoREST, which
              is why CoREST is modelled as the complex in the sibling module.
            evidence:
            - source_id: PMID:15620353
              statement: LSD1 specifically demethylates H3K4 by an oxidation that releases formaldehyde.
              supporting_text: LSD1 specifically demethylates histone H3 lysine 4, which is linked to active
                transcription. Lysine demethylation occurs via an oxidation reaction that generates formaldehyde.
            - source_id: PMID:20228790
              statement: LSD1 removes mono- and dimethyl H3K4 in corepressor complexes and mono- and dimethyl
                H3K9 with the androgen receptor.
              supporting_text: As a component of co-repressor complexes, LSD1 contributes to target gene
                repression by removing mono- and dimethyl marks from lysine 4 of histone H3 (H3K4). In contrast,
                during androgen receptor (AR)-activated gene expression, LSD1 removes mono- and dimethyl
                marks from lysine 9 of histone H3 (H3K9).
            - source_id: PMID:16079795
              statement: With the androgen receptor LSD1 demethylates H3K9, de-repressing AR target genes.
              supporting_text: LSD1 relieves repressive histone marks by demethylation of histone H3 at
                lysine 9 (H3-K9), thereby leading to de-repression of androgen receptor target genes.
            gocam_associations:
            - model: gomodel:65bc474400001510
              activity: gomodel:65bc474400001510/65bc474400001521
              title: KDM1A acetylation by KAT8 inhibits epithelial to mesenchymal transition (Human).
