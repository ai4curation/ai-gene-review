  connections:
  - source: egfr_ligand_production
    target: egfr_ligands
    connection_type: PROVIDES_INPUT_FOR
    description: >-
      Star trafficking and rhomboid cleavage release active Spitz, Keren and Gurken.
  - source: egfr_ligands
    target: egfr_receptor
    connection_type: POSITIVELY_REGULATES
    description: >-
      Ligand binding induces Egfr dimerization and autophosphorylation.
  - source: egfr_receptor
    target: egfr_adaptors_and_ras_activation
    connection_type: POSITIVELY_REGULATES
    description: >-
      Phosphorylated Egfr recruits Drk/Shc and Sos.
  - source: egfr_adaptors_and_ras_activation
    target: egfr_ras
    connection_type: POSITIVELY_REGULATES
    description: >-
      Sos catalyses GDP-GTP exchange on Ras85D.
  - source: egfr_ras
    target: egfr_mapk_cascade
    connection_type: POSITIVELY_REGULATES
    description: >-
      GTP-bound Ras activates Raf.
  - source: egfr_mapk_cascade
    target: egfr_nuclear_output
    connection_type: POSITIVELY_REGULATES
    description: >-
      Rolled (ERK) phosphorylates Pointed, Yan and Capicua to change target gene transcription.
