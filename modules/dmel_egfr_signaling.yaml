id: MODULE:dmel_egfr_signaling
title: EGFR signaling pathway in Drosophila melanogaster
description: >-
  Drosophila has a single EGF receptor (Egfr), a receptor tyrosine kinase activated by the
  TGF-alpha-like ligands Spitz, Keren and Gurken and the neuregulin-like ligand Vein. Spitz,
  Keren and Gurken are made as inactive membrane-bound precursors; the chaperone Star carries
  them from the endoplasmic reticulum to the Golgi, where rhomboid intramembrane proteases
  cleave them to release the secreted ligand. Ligand-bound Egfr recruits the adaptor Drk (Grb2)
  and the guanine nucleotide exchange factor Son of sevenless, which activates Ras85D. Ras
  triggers the Raf, Dsor1 (MEK) and Rolled (ERK) kinase cascade, assisted by the scaffolds
  KSR, CNK and Aveugle. ERK changes nuclear gene expression by activating the ETS factor Pointed
  and promoting the degradation or export of the repressors Yan (Aop) and Capicua. The pathway
  acts in oogenesis axis formation, photoreceptor recruitment, wing vein formation, and cell
  survival and proliferation in many tissues.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000958
  title: 'FlyBase gene group EGFR-RTK: Egfr signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 83 D. melanogaster genes as egfr signaling pathway (EGFR-RTK);
    this module models that group.
- source_id: GO:0007173
  title: epidermal growth factor receptor signaling pathway
  statement: >-
    GO term grounding the module as epidermal growth factor receptor signaling pathway.
notes: >-
  Boundary. Core components (FlyBase EGFR-C) and ligand production (EGF-PRO). The Ras-MAPK
  cascade, adaptors and ETS outputs are shared with FGFR, Sevenless and Torso signaling. Feedback
  inhibitors (Argos, Sprouty, Kekkon1) and other FlyBase regulators are not parts. Protease
  activity is asserted only for the rhomboids whose ligand cleavage is well established (Rho,
  Roughoid, Stet). FlyBase groups realized by this module: EGFR-RTK (FBgg0000958). Subgroups
  folded into it: EGFR-C, EGF-PRO. FlyBase also curates regulator sets for this pathway, which
  are context and not modelled as parts: EGFR-N (negative regulators of egfr signaling pathway,
  38 genes); EGFR-P (positive regulators of egfr signaling pathway, 17 genes). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_egfr_signaling.yaml; none of the member genes has a gene review yet
  unless noted.
