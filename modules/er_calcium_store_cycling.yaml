  connections:
    - source: er_ip3_production
      target: ip3r_release
      connection_type: PROVIDES_INPUT_FOR
      description: IP3 made by PLC beta binds and, with cytosolic calcium, opens the IP3 receptors.
    - source: er_calcium_release
      target: serca_reuptake
      connection_type: PRECEDES
      description: >-
        Calcium released into the cytosol is pumped back into the ER/SR by SERCA, refilling
        the store and terminating the cytosolic signal.
    - source: serca_regulin_inhibition
      target: serca_reuptake
      connection_type: NEGATIVELY_REGULATES
      description: Phospholamban and sarcolipin lower SERCA calcium affinity.
    - source: sr_luminal_buffering
      target: ryr2_cardiac_variant
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Calsequestrin-2 holds the releasable SR calcium pool next to RYR2. It also regulates
        the release complex, but reconstitution studies report inhibition at low luminal
        calcium, so no regulatory sign is asserted (see the CASQ2 gene review).
