        term:
          id: GO:0005789
          label: endoplasmic reticulum membrane
  parts:
    - order: 1
      optional: true
      role: IP3 production upstream of IP3 receptor gating
      node:
        id: er_ip3_production
        label: PLC beta hydrolysis of PIP2 to IP3 and DAG (upstream input)
        description: >-
          IP3, the ligand of the IP3 receptors, is made by phospholipase C downstream of
          Gq-coupled receptors (and of receptor tyrosine kinases through PLC gamma, not
          modelled). Realized by the PLC beta step of the GPCR-PLC-calcium-PKC module.
          Optional because ryanodine receptor release (part 2) does not need IP3.
        module_ref: gpcr_plc_calcium_pkc_signaling#plc_beta_activation
    - order: 2
      role: calcium release from the ER/SR store into the cytosol
      node:
        id: er_calcium_release
        label: ER/SR calcium release channels
        module_type: MODULE
        description: >-
          Two families of tetrameric intracellularly gated calcium channels in the ER/SR
          membrane release stored calcium. Cells use one or both families; skeletal and
          cardiac muscle rely on ryanodine receptors, most non-excitable cells on IP3
          receptors.
        variant_sets:
          - id: er_release_channel_families
            label: ER/SR release channel families
            axis: channel family and gating ligand
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            variants:
              - id: ip3r_release
                label: IP3 receptor release (ITPR1/2/3)
