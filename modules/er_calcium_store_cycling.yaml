id: MODULE:er_calcium_store_cycling
title: ER/SR calcium store cycling — calcium release through IP3 receptors (ITPR1/2/3) and ryanodine receptors (RYR1/2/3, with CACNA1S-coupled RYR1 release in skeletal muscle and calcium-induced calcium release by RYR2 in heart) and re-uptake by SERCA pumps (ATP2A1/2/3), with phospholamban/sarcolipin inhibition of SERCA and calsequestrin-2 luminal buffering
description: >-
  The endoplasmic reticulum (ER), and its muscle specialisation the sarcoplasmic reticulum
  (SR), is the main intracellular calcium store. Calcium leaves the store through two
  families of large tetrameric release channels in the ER/SR membrane and returns through
  P-type ATPase pumps. Inositol 1,4,5-trisphosphate (IP3) receptors (ITPR1, ITPR2, ITPR3)
  open when IP3, produced by phospholipase C downstream of surface receptors, binds together
  with cytosolic calcium; the three paralogs form homo- and heterotetramers with
  overlapping tissue distributions. Ryanodine receptors (RYR1, RYR2, RYR3) are activated by
  cytosolic calcium itself (calcium-induced calcium release). In skeletal muscle RYR1 in the
  junctional SR is opened by direct conformational coupling to the voltage sensor of the
  T-tubule L-type channel CACNA1S (Cav1.1), so depolarisation releases SR calcium without
  needing calcium entry; in cardiac muscle calcium entering through the L-type channel
  triggers RYR2 by calcium-induced calcium release; RYR3 is a low-sensitivity release
  channel expressed in brain and other tissues. Released calcium is pumped back into the
  store by the sarco/endoplasmic reticulum calcium ATPases (SERCA1-3, ATP2A1-3), which move
  two calcium ions into the lumen per ATP hydrolysed. In muscle the small transmembrane
  regulins phospholamban (PLN, mainly heart) and sarcolipin (SLN, mainly skeletal and
  atrial muscle) bind SERCA and lower its calcium affinity, and the luminal protein
  calsequestrin-2 buffers SR calcium near RYR2 and regulates the release complex.
  Release and re-uptake together set ER/SR calcium content and shape cytosolic calcium
  signals, contraction and relaxation.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001139
    title: calcium transport pathway
    statement: >-
      RGD Pathway Ontology record for the calcium transport pathway (55 human genes curated
      by RGD). Its text describes IP3 receptor and ryanodine receptor calcium release from
      ER/SR stores (diagram edges IP3 and Ca2+ associated with ITPRs, Ca2+ and cADPr with
      RYRs, Ca2+ stored to Ca2+ released) and SERCA re-uptake into the ER/SR. This module
      models that ER/SR store system only; the other transport systems of the record are
      separate modules or unmodelled (see notes). Human genes in scope from RGD's list:
      ITPR1 ITPR2 ITPR3 RYR1 RYR2 RYR3 ATP2A1 ATP2A2 ATP2A3. Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001139.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: IP3 receptor release from ER stores, co-gated by IP3 and calcium.
    supporting_text: IP3 binds IP3 receptors (ITPRs) in ER to prompt, along with Ca2+ , the release of the ion from ER stores
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: Ryanodine receptor release modes in skeletal and cardiac muscle.
    supporting_text: in cardiac muscle, Ryr2 mediated Ca2+ release is initiated in response to Ca2+ influx via Cacna1c(Cav1.2), or CICR
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001139.yaml
    statement: SERCA pumps return calcium to the ER/SR.
    supporting_text: There are three ER/SR (SERCAs, ATP2A1-3) and four plasma membrane (PMCAs, ATP2B1-4) pumps
  - source_id: GO:0006816
    title: calcium ion transport
    statement: >-
      The GO process mapped to PW:0001139 (skos:closeMatch) in the project's PW-GO mappings
      (projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is too broad for this
      module, whose concepts are the release and re-uptake processes below.
  - source_id: GO:0032469
    title: endoplasmic reticulum calcium ion homeostasis
    statement: >-
      The process that release and re-uptake together serve; carried by ATP2A2 (IDA
      PMID:16402920) in GOA. Used as a module concept with the two directional transport
      processes GO:1903514 and GO:1903515.
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001139 (calcium transport pathway) through
  the RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml,
  mapped GO:0006816 calcium ion transport). RGD curates 55 human genes to PW:0001139, mixing
  unrelated channel, pump and exchanger families, so the project models the record as one
  human module per transport system. This module is the ER/SR store system. Sibling
  modules from the same record: store_operated_calcium_entry (STIM-ORAI entry that refills
  the store after depletion), plasma_membrane_calcium_extrusion (PMCA, NCX, NCKX) and
  mitochondrial_calcium_uniporter (MCU complex uptake and NCLX efflux). They are named here
  rather than linked by module_ref because they were drafted in parallel. PW:0001139 is the
  only PW evidence source_id; its sub-pathway PW:0001140 (calcium/calcium-mediated
  signaling) is mentioned here in prose only.


  (1) BOUNDARY: UPSTREAM. IP3 production is upstream and is included as an optional part by
  module_ref to gpcr_plc_calcium_pkc_signaling#plc_beta_activation, the PLC beta step that
  makes IP3. That module's calcium_mobilization node also contains an ITPR1 annoton
  (without a function); this module does not reference that node, because it gives the
  full IP3 receptor family with functions, and the overlap is intended (the GPCR module
  is a compact signalling chain). PLC gamma downstream of receptor tyrosine kinases is not
  modelled. Cyclic ADP-ribose and NAADP (RGD diagram: cADPr associated with RYRs) are made
  by CD38-type ADP-ribosyl cyclases; their direct action on ryanodine receptors is not
  settled, so they are left in prose. The L-type channel CACNA1C (Cav1.2) that triggers
  RYR2 calcium-induced calcium release in heart is plasma membrane calcium entry (RGD
  voltage-operated channels), unmodelled in this batch, and so is not a part; CACNA1S is
  included because in skeletal muscle its role in this module is conformational coupling
  to RYR1 rather than calcium entry.


  (2) BOUNDARY: DOWNSTREAM AND NEIGHBOURS. Store depletion activates STIM-ORAI entry
  (store_operated_calcium_entry); ER-to-mitochondria calcium transfer at contact sites
  feeds the uniporter (mitochondrial_calcium_uniporter). Cytosolic calcium sensors and
  effectors (calmodulin, calcineurin, CaMKII, troponin) belong to calcium-mediated
  signalling and contraction, not here. The Golgi SPCA pumps (ATP2C1, ATP2C2), which RGD
  also lists, fill the Golgi rather than the ER and are left unmodelled; the
  endolysosomal release channels TPCN1, TPCN2 and MCOLN1 are also unmodelled.


  (3) PARTS. (1) optional IP3 production (module_ref); (2) ER/SR calcium release, a
  ONE_OR_MORE variant set over two channel families, each a nested ONE_OR_MORE paralog set
  (ITPR1/2/3; RYR1 with CACNA1S, RYR2, RYR3), because cells use one or both families and
  the paralogs form hetero-tetramers (IP3 receptors) or co-exist; (3) SERCA re-uptake
  (ATP2A1/2/3, ONE_OR_MORE); (4) optional regulin inhibition of SERCA (PLN, SLN); (5)
  optional calsequestrin-2 luminal buffering. Substrates and products are grounded to
  ChEBI with labels checked in OLS (November 2026): calcium(2+) CHEBI:29108, ATP(4-)
  CHEBI:30616, ADP(3-) CHEBI:456216, hydrogenphosphate CHEBI:43474, water CHEBI:15377; the
  compartment is given in preferred_term. The SERCA reaction follows GO:0005388 (two
  calcium ions per ATP; the counter-transported protons, mentioned by RGD, are not listed).


  (4) REGULATORS: WHAT IS INCLUDED AND WHY. RGD lists none of these as genes; all are added
  on evidence. PLN and SLN have gene reviews whose core function is ATPase inhibitor
  activity on SERCA (PLN GO:0042030 IDA PMID:19708671; SLN has no experimental GOA function
  row and its term comes from the gene review and PMID:9575189). CASQ2 has a gene review
  with calcium ion sequestering activity (GO:0140314 IDA) and RYR2 regulation. Left out:
  calsequestrin-1 (CASQ1, skeletal; experimental GOA is only calcium ion binding and no gene
  review here), triadin and junctin (no checked source in this draft), FKBP12.6 (FKBP1B)
  and FKBP12 (FKBP1A), and the IP3 receptor modulators IRBIT (AHCYL1) and BCL2 that RGD
  mentions. FKBP12.6 was left out on evidence: GOA has FKBP1B calcium channel inhibitor
  activity toward RYR2 (IDA PMID:12443530, PMID:20431056), but RYR2 channels lacking
  FKBP12.6 behave normally in PMID:17921453 (cached), so its role is disputed. Calmodulin
  (partial agonist of RYR1 in the apo form, inhibitor of IP3 receptors and RYRs when
  calcium-bound) is a general calcium sensor and is in gpcr_plc_calcium_pkc_signaling.


  (5) MOLECULAR FUNCTIONS. From experimental GOA (QuickGO, November 2026) or the gene's
  review core function, checked in go-basic 2026-07-26 (none obsolete): ITPR1 and ITPR3
  GO:0005220 inositol 1,4,5-trisphosphate-gated calcium channel activity (IDA; gene review
  core functions). ITPR2 GO:0005220 is TAS only in GOA (PMID:8081734), used on the
  strength of the production GO-CAM and the paralog evidence in PMID:10620513. RYR1 and
  RYR2 GO:0005219 ryanodine-sensitive calcium-release channel activity (IDA/IMP), which is
  is_a GO:0048763 calcium-induced calcium release activity (both genes also have
  GO:0048763 rows). RYR3 uses the parent GO:0015278 intracellularly gated calcium channel
  activity (IMP PMID:9395096), because its GO:0005219 row is TAS. ATP2A1/2/3 GO:0005388
  P-type calcium transporter activity (IDA/EXP). CACNA1S GO:0005245 voltage-gated calcium
  channel activity (IDA, IMP): GO has no term for the voltage sensor's conformational
  activation of RYR1, which is its real contribution here; the general GO:0099103 channel
  activator activity would fit better but has no CACNA1S annotation and is not authored.
  A structured request is in proposed_new_terms. Processes authored without a matching
  experimental GOA row, said here as required: RYR1 GO:0014808 (GOA has the parent
  GO:0051209 IDA/IMP), RYR3 GO:0051209, ATP2A1 GO:1903515. Locations authored: RYR1
  junctional SR membrane (GOA TAS), RYR3 ER membrane (GOA only TAS SR membrane).


  (6) GO-CAM LINKS. Pinned as gocam_associations: the production human models
  gomodel:671ae02600000821, gomodel:671ae02600000964 and gomodel:671ae02600001023
  (release of sequestered calcium by ITPR1, ITPR2 and ITPR3 upon IP3 binding), each typing
  the receptor with GO:0005220. No production GO-CAM in gocams/index.tsv contains RYR1-3,
  ATP2A1-3, CACNA1S, PLN, SLN or CASQ2. The seed's best_gocam (gomodel:65d7e4ac00002121,
  ITPR1-HSPA9-VDAC1 calcium transfer to mitochondria in apoptosis) shares ITPR1 but models
  ER-mitochondria transfer in apoptosis; it is not pinned here and is discussed in the
  mitochondrial uniporter module.


  (7) OTHER PW:0001139 GENES NOT MODELLED HERE, by symbol. STIM1 STIM2 ORAI1 ORAI2 ORAI3
  (store_operated_calcium_entry); ATP2B1-4, SLC8A1-3, SLC24A1-5
  (plasma_membrane_calcium_extrusion); MCU and SLC8B1 (mitochondrial_calcium_uniporter);
  unmodelled: voltage-gated CACNA1A-I and CACNB1-4 (CACNA1S is used here only as the RYR1
  voltage sensor), cyclic nucleotide-gated CNGA1-4, CNGB1, CNGB3, TRPV5, TRPV6, TPCN1,
  TPCN2, MCOLN1, ATP2C1, ATP2C2.


  (8) GROUNDING. UniProt accessions from genes/human/<GENE>/<GENE>-uniprot.txt for ITPR1,
  ITPR3, PLN, SLN and CASQ2, the rest from UniProt REST (reviewed human entries). Gene
  reviews exist only for ITPR1, ITPR3, PLN, SLN and CASQ2; ITPR2, RYR1-3, ATP2A1-3 and
  CACNA1S lack one, which is curation follow-up for the project plan. No PANTHER or PTN
  ids are asserted: every participant is a concrete human gene product.
proposed_new_terms:
  - proposed_name: calcium channel activator activity
    proposed_definition: >-
      Direct interaction with a calcium channel (binding or modification), resulting in its
      opening.
    justification: >-
      GO has potassium and sodium channel activator activity terms but no calcium
      counterpart; GO:0005246 calcium channel regulator activity has only the inhibitor
      child GO:0019855. In skeletal muscle excitation-contraction coupling the voltage
      sensor CACNA1S opens RYR1 by direct conformational coupling, independently of calcium
      entry. The term (also requested by the sibling store_operated_calcium_entry draft for
      STIM-ORAI gating) would sit under GO:0005246 (proposed_parent) and GO:0099103 channel
      activator activity, and would be the function of the CACNA1S annoton in this module.
    proposed_parent:
      id: GO:0005246
      label: calcium channel regulator activity
    supported_by:
      - reference_id: PMID:26115329
        supporting_text: RyR1 is activated by a conformational change of the voltage sensor in the dihydropyridine receptor (DHPR) upon depolarization of the T-tubule membrane, which is referred to as the depolarization-induced Ca2+ release (DICR)
      - reference_id: PMID:28012042
        supporting_text: In skeletal muscle, ECC is performed by the direct coupling of a voltage-gated L-type Ca2+ channel (dihydropyridine receptor; DHPR) located on the T-tubule with a Ca2+ release channel (ryanodine receptor; RYR1) on the sarcoplasmic reticulum (SR) component of the triad
