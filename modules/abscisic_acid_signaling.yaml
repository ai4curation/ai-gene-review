id: MODULE:abscisic_acid_signaling
title: 'Abscisic acid signaling across land plants: PYR/PYL–PP2C–Raf–SnRK2 relay and transcriptional or
  stomatal outputs'
description: Land plants share an abscisic acid (ABA) signaling toolkit comprising PYR/PYL/RCAR receptors,
  clade A PP2C phosphatases, Raf-like kinases, ABA-responsive SnRK2 kinases and ABRE-binding bZIP transcription
  factors. In the established angiosperm relay, ABA-stimulated receptors inhibit PP2Cs and relieve their
  inhibition of SnRK2; Raf-mediated phosphorylation initiates SnRK2 activity, followed by amplification
  through intermolecular SnRK2 phosphorylation. Constitutively active Arabidopsis B2 RAFs and stress-responsive
  B3 RAFs have distinct regulatory roles. Moss ARK also activates SnRK2, but moss evidence instead places
  PP2CAs mainly downstream of SnRK2 and do not impose the same upstream ABA-dependent release switch.
  Some receptors, including liverwort MpPYL1 and monomeric rice RCAR5/PYL5, retain basal phosphatase inhibition
  without hormone. Activated SnRK2s support bZIP-dependent protective transcription in both moss and angiosperm
  experiments. A guard-cell branch directly established in Arabidopsis and rice couples SnRK2 phosphorylation
  to SLAC1 anion efflux and stomatal closure. That branch is optional within this land-plant module; liverworts
  lack stomata. ABA biosynthesis, transport, catabolism, calcium-dependent branches and protein turnover
  lie outside the boundary.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0009738
  title: abscisic acid-activated signaling pathway
  statement: The module is grounded in the GO biological process term for ABA-activated signaling.
- source_id: PMID:19407142
  title: Abscisic acid inhibits type 2C protein phosphatases via the PYR/PYL family of START proteins.
  statement: PYR/PYL proteins are ABA receptors that act at the apex of a negative regulatory pathway
    by inhibiting PP2Cs.
  supporting_text: PYR/PYLs are ABA receptors functioning at the apex of a negative regulatory pathway
    that controls ABA signaling by inhibiting PP2Cs
- source_id: PMID:19407143
  title: Regulators of PP2C phosphatase activity function as abscisic acid sensors.
  statement: Independently, RCAR1 binds ABA and mediates ABA-dependent inactivation of ABI1/ABI2.
  supporting_text: RCAR1 was shown to bind ABA, to mediate ABA-dependent inactivation of ABI1 or ABI2
    in vitro, and to antagonize PP2C action in planta.
- source_id: PMID:19924127
  title: In vitro reconstitution of an abscisic acid signalling pathway.
  statement: A reduced in vitro system reconstitutes ABA-dependent ABF2 phosphorylation with PYR1, ABI1
    and SnRK2.6. Later Raf studies resolve how dephosphorylated SnRK2 is initially activated in cells.
  supporting_text: our study reveals a surprising simplicity of the pathway and demonstrates that the
    PYR/PYLs, clade-A PP2Cs, SnRK2s, and ABFs are the only core components to complete the ABA regulation
    of gene expression
- source_id: PMID:19805022
  title: Type 2C protein phosphatases directly regulate abscisic acid-activated protein kinases in Arabidopsis.
  statement: Clade A PP2Cs bind and dephosphorylate ABA-activated SnRK2s.
  supporting_text: Group A PP2Cs interacted physically with SnRK2s in various combinations, and efficiently
    inactivated ABA-activated SnRK2s via dephosphorylation of multiple Ser/Thr residues in the activation
    loop.
- source_id: PMID:19880399
  title: Three SnRK2 protein kinases are the main positive regulators of abscisic acid signaling in response
    to water stress in Arabidopsis.
  statement: SnRK2.2/2.3/2.6 (SRK2D/I/E) are redundant positive regulators; the triple mutant is strongly
    ABA-insensitive.
  supporting_text: srk2d srk2e srk2i (srk2d/e/i) triple mutants exhibit greatly reduced tolerance to drought
    stress and highly enhanced insensitivity to ABA.
- source_id: PMID:19955405
  title: Activity of guard cell anion channel SLAC1 is controlled by drought-stress signaling kinase-phosphatase
    pair.
  statement: Coexpression with OST1 activates SLAC1 anion currents in Xenopus oocytes.
  supporting_text: Upon coexpression of SLAC1 with OST1 in Xenopus oocytes, SLAC1-related anion currents
    appeared similar to those observed in guard cells.
- source_id: PMID:19955405
  title: Activity of guard cell anion channel SLAC1 is controlled by drought-stress signaling kinase-phosphatase
    pair.
  statement: ABI1 in the SLAC1-OST1 complex prevents SLAC1 activation.
  supporting_text: Integration of ABI1 into the SLAC1/OST1 complex, however, prevented SLAC1 activation.
- source_id: PMID:32754170
  statement: Comparative review supports the land-plant ABA receptor–PP2C–SnRK2 core, while distinguishing
    older enzymatic components and lineage-specific downstream outputs.
  supporting_text: All land plants comprise ABA receptors whose function is largely conserved
- source_id: PMID:33459424
  statement: Evolutionary review integrates bryophyte and algal comparisons with Raf kinases upstream
    of SnRK2.
  supporting_text: Raf-like kinases as upstream regulators of the core ABA module component SnRK2.
- source_id: PMID:42457603
  statement: Recent synthesis distinguishes ancient PP2C–SnRK2 components from canonical ABA-binding receptor
    evolution in land plants; its proposed noncanonical receptor trajectory is outside this module.
- source_id: PMID:42533760
  statement: Recent review compares conservation and divergence between seed-free lineages and seed plants;
    used for evolutionary framing, not direct evidence for individual reactions.
- source_id: PMID:31744875
  statement: Native liverwort MpPYL1 represses PP2C basally and is further activated by ABA; ligand dependence
    is not uniform across receptor lineages.
  supporting_text: a liverwort receptor possesses basal activity, but it is further activated by ABA.
- source_id: PMID:33911084
  statement: Raf kinases initiate activation-loop phosphorylation; activated SnRK2s amplify the response
    through intermolecular transphosphorylation.
  supporting_text: This transphosphorylation by RAFs is essential for SnRK2 activation.
- source_id: PMID:37276398
  statement: Arabidopsis B2 RAFs including RAF11 are constitutively active and activate SnRK2s after relief
    from PP2C inhibition; stress-responsive B3 RAFs enhance the response.
  supporting_text: Autophosphorylation of subclass III SnRK2s is not sufficient for ABA responses
- source_id: PMID:26540727
  statement: Moss ARK phosphorylates and activates SnRK2B; this demonstrates a bryophyte Raf–SnRK2 relay,
    with different upstream regulation from Arabidopsis B2 RAFs.
- source_id: PMID:26300907
  statement: Rice protoplast reconstitution links RCAR5/PYL5, PP2C6, SAPK9 and bZIP46 to an ABA-responsive
    Rab16A reporter.
  supporting_text: OsPYL/RCAR2 and -5 rescued the OsbZIP46 activity in the presence of SAPK9 and OsPP2C6
- source_id: PMID:31134357
  statement: Rice SAPK10 interacts with and phosphorylates OsSLAC1; localization, interaction and water-loss
    assays support the guard-cell output.
  supporting_text: SAPK10 phosphorylated OsSLAC1 in vitro
- source_id: PMID:26481009
  statement: OsSAPK8 activates rice OsSLAC1; the tested channel is nitrate selective with little chloride
    permeability, so channel selectivity is not identical across exemplars.
  supporting_text: OsSLAC1 is a nitrate-selective anion channel without obvious permeability to chloride,
    malate, and sulfate
- source_id: PMID:30675528
  statement: 'Moss conserves the signaling components but differs in their ordering: PP2CAs act mainly
    downstream of SnRK2, and ABA-dependent SnRK2 phosphorylation persists without PP2CA. This does not
    support a universal PYL–PP2C–SnRK2 release mechanism.'
  supporting_text: P. patens PP2CA seems to act downstream of SnRK2
- source_id: PMID:40333983
  statement: Moss ABI5A/B bind the SnRK2 pathway and activate the LEA1 promoter in an ABA- and SnRK2-dependent
    assay, establishing a bryophyte transcriptional output despite unresolved current accession-to-clone
    mapping.
  supporting_text: PpABI5A and PpABI5B transcriptionally activate the ABA-responsive promoter of the PpLEA1
    gene in an ABA- and SnRK2-dependent manner
- source_id: PMID:29575231
  statement: Moss phosphoproteomics establishes ABA-responsive AREB/ABF phosphorylation under ARK control.
  supporting_text: AREB/ABF-type transcription factors are phosphorylated in vivo in response to ABA under
    the control of ARK.
- source_id: PMID:24743650
  statement: Biochemical assays identify monomeric rice RCAR5, called OsPYL11 in this paper and PYL5 in
    the selected UniProt record, as an ABA-independent inhibitor of PP2C06. This differs from the hormone-dependent
    reporter rescue conditions in PMID:26300907.
notes: 'The taxon is an envelope for the conserved receptor–phosphatase–kinase signaling architecture,
  not a claim that every lineage implements every output or uses identical paralogs. Representatives span
  a liverwort, a moss, a monocot and a eudicot; each is accompanied by a gene review. Family identifiers
  are PANTHER classifications with official labels, constrained by the experimentally established role;
  they do not transfer that role to every member of a broad family. The native receptor, phosphatase and
  kinase pairings differ among species. In particular, rice PP2C06 and SAPK9 exemplify the transcriptional
  relay; their inclusion does not assert that PP2C06 is the native guard-cell phosphatase for SAPK10.
  Published rice guard-cell work instead identifies PP2C50/53. No PAINT ancestral placement is inferred
  merely from the representative set. The 2009 four-component reconstitution is retained as evidence for
  its reduced assay, not as proof that Raf kinases are dispensable in vivo. Location descriptors describe
  the demonstrated signaling compartments, not obligatory localization of every family member in every
  tissue. Shared components do not imply conserved edge topology: the direct PP2C-to-SnRK2 inhibitory
  connection is explicitly angiosperm-scoped, while moss PP2CA has a downstream inhibitory role and an
  additional ABA-to-ARK/SnRK2 input. No unverified molecular PP2CA substrate edge is invented for moss.
  Current UniProt models at the experimentally tested moss ABI5A/B loci conflict with the reported cloned
  proteins, so moss transcriptional evidence is represented at the family/step level without a guessed
  protein accession.'
