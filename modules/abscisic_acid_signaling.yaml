references:
- id: PMID:19407142
  title: Abscisic acid inhibits type 2C protein phosphatases via the PYR/PYL family of START proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Identifier and title checked against the fetched publication. Full text inspected for
      the mechanisms cited.
  findings:
  - statement: PYR/PYL proteins are ABA receptors that act at the apex of a negative regulatory pathway
      by inhibiting PP2Cs.
    supporting_text: PYR/PYLs are ABA receptors functioning at the apex of a negative regulatory pathway
      that controls ABA signaling by inhibiting PP2Cs
  - statement: NMR shows that (+)-ABA binds PYR1 and alters its conformation.
    supporting_text: which shows that ABA binds PYR1 and likely induces a conformational change
  - statement: ABA-bound PYR1 binds and inhibits PP2Cs.
    supporting_text: we show that ABA binds to PYR1, which in turn binds to and inhibits PP2Cs
  - statement: (+)-ABA inhibits PP2C activity in the presence of PYR1 with nanomolar IC50.
    supporting_text: (+)-ABA acts as a potent saturable inhibitor of phosphatase activity in the presence
