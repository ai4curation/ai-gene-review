  parts:
    - order: 1
      role: ABA perception by PYR/PYL/RCAR receptors
      node:
        id: aba_perception
        label: ABA perception by PYR/PYL receptors
        module_type: REGULATORY_STEP
        description: >-
          ABA binds the internal cavity of soluble START/Bet v1-fold PYR/PYL receptors; closure of the gate
          and latch loops over the ligand creates a PP2C-binding surface, so the ABA-receptor complex binds
          clade A PP2Cs and inhibits their phosphatase activity. The family is redundant (14 members in
          Arabidopsis), with dimeric (PYR1, PYL1, PYL2) and monomeric receptors.
        annotons:
          - id: pyr_pyl_aba_sensor
            label: PYR/PYL/RCAR ABA binding
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PYR/PYL/RCAR abscisic acid receptor family (PYR1, PYL1-PYL13 in Arabidopsis)
                representative_members:
                  - preferred_term: PYR1 (Arabidopsis)
                    term:
                      id: UniProtKB:O49686
                      label: Abscisic acid receptor PYR1
            function:
              preferred_term: abscisic acid binding
              term:
                id: GO:0010427
                label: abscisic acid binding
              evidence:
                - source_id: PMID:19407142
                  statement: NMR shows that (+)-ABA binds PYR1 and alters its conformation.
                  supporting_text: which shows that ABA binds PYR1 and likely induces a conformational change
                - source_id: PMID:19407143
                  statement: RCAR1 (PYL9) binds ABA.
                  supporting_text: RCAR1 was shown to bind ABA
                - source_id: PMID:19898420
                  statement: ABA binding closes the gate and latch loops of PYL2, creating the PP2C-binding
                    surface.
                  supporting_text: ABA binding induces the closure of the gate and formation of a gate-latch
                    interface, which in turn binds to the PP2C active site and converts the ABA-bound PYL2
                    into a competitive PP2C inhibitor.
            processes:
              - preferred_term: abscisic acid-activated signaling pathway
                term:
                  id: GO:0009738
                  label: abscisic acid-activated signaling pathway
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Binds ABA in the internal START-domain cavity; this ligand binding is the
              perception event that converts the receptor into a PP2C inhibitor.
          - id: pyr_pyl_receptor
            label: PYR/PYL/RCAR ABA receptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PYR/PYL/RCAR abscisic acid receptor family (PYR1, PYL1-PYL13 in Arabidopsis)
                representative_members:
                  - preferred_term: PYR1 (Arabidopsis)
                    term:
                      id: UniProtKB:O49686
                      label: Abscisic acid receptor PYR1
            function:
              preferred_term: protein phosphatase inhibitor activity
              term:
                id: GO:0004864
                label: protein phosphatase inhibitor activity
              evidence:
                - source_id: PMID:19407142
                  statement: ABA-bound PYR1 binds and inhibits PP2Cs.
                  supporting_text: we show that ABA binds to PYR1, which in turn binds to and inhibits PP2Cs
                - source_id: PMID:19407142
                  statement: (+)-ABA inhibits PP2C activity in the presence of PYR1 with nanomolar IC50.
                  supporting_text: (+)-ABA acts as a potent saturable inhibitor of phosphatase activity in
                    the presence of PYR1 (IC50 = 125 nM)
            processes:
              - preferred_term: abscisic acid-activated signaling pathway
                term:
                  id: GO:0009738
                  label: abscisic acid-activated signaling pathway
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: In the ABA-bound state, binds and inhibits clade A PP2Cs (ABA binding itself
              is captured by the pyr_pyl_aba_sensor annoton).
    - order: 2
      role: clade A PP2C repression of SnRK2 kinases
      node:
        id: pp2c_repression
        label: Clade A PP2C inactivation of SnRK2s
        module_type: REGULATORY_STEP
        description: >-
          In the absence of ABA, clade A PP2Cs (ABI1, ABI2, HAB1, PP2CA/AHG3 and others) bind subclass III
          SnRK2s and dephosphorylate activation-loop residues including OST1 Ser175, keeping the kinases
          inactive; ABI1 also binds the SLAC1-OST1 complex and prevents channel activation. ABA-bound
          receptors inhibit the PP2Cs.
        annotons:
          - id: clade_a_pp2c
            label: Clade A PP2C phosphatase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: clade A type 2C protein phosphatases (ABI1, ABI2, HAB1, PP2CA in Arabidopsis)
                representative_members:
                  - preferred_term: ABI1 (Arabidopsis)
                    term:
                      id: UniProtKB:P49597
                      label: Protein phosphatase 2C 56
            function:
              preferred_term: protein serine/threonine phosphatase activity
              term:
                id: GO:0004722
                label: protein serine/threonine phosphatase activity
              evidence:
                - source_id: PMID:19805022
                  statement: Clade A PP2Cs inactivate SnRK2s by dephosphorylation.
                  supporting_text: Group A PP2Cs interacted physically with SnRK2s in various combinations,
                    and efficiently inactivated ABA-activated SnRK2s via dephosphorylation of multiple
                    Ser/Thr residues in the activation loop.
                - source_id: PMID:19924127
                  statement: PP2Cs keep SnRK2s inactive through interaction and dephosphorylation.
                  supporting_text: the SnRK2 kinases are kept inactive by the PP2Cs through physical
                    interaction and dephosphorylation.
            processes:
              - preferred_term: negative regulation of abscisic acid-activated signaling pathway
                term:
                  id: GO:0009788
                  label: negative regulation of abscisic acid-activated signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: Dephosphorylates and inactivates SnRK2 kinases in the absence of ABA.
    - order: 3
      role: SnRK2 kinase activation
      node:
        id: snrk2_activation
        label: Subclass III SnRK2 kinase activation
        module_type: REGULATORY_STEP
        description: >-
          Released from PP2C inhibition, subclass III SnRK2s autophosphorylate their activation loop and
          become active. SnRK2.2, SnRK2.3 and SnRK2.6/OST1 act redundantly; OST1 predominates in guard
          cells while SnRK2.2/2.3 predominate in seeds and seedlings.
        annotons:
          - id: snrk2_kinase
            label: Subclass III SnRK2 protein kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: subclass III SnRK2 protein kinases (SnRK2.2, SnRK2.3, SnRK2.6/OST1 in
                  Arabidopsis)
                representative_members:
                  - preferred_term: OST1/SnRK2.6/SRK2E (Arabidopsis)
                    term:
                      id: UniProtKB:Q940H6
                      label: Serine/threonine-protein kinase SRK2E
                  - preferred_term: SnRK2.2/SRK2D (Arabidopsis)
                    term:
                      id: UniProtKB:Q39192
                      label: Serine/threonine-protein kinase SRK2D
                  - preferred_term: SnRK2.3/SRK2I (Arabidopsis)
                    term:
                      id: UniProtKB:Q39193
                      label: Serine/threonine-protein kinase SRK2I
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              evidence:
                - source_id: PMID:12468729
                  statement: OST1 is an ABA-activated protein kinase.
                  supporting_text: OST1 is an ABA-activated protein kinase related to the Vicia faba
                    ABA-activated protein kinase (AAPK).
                - source_id: PMID:19880399
                  statement: The three SnRK2s are redundant positive regulators of ABA signalling.
                  supporting_text: srk2d srk2e srk2i (srk2d/e/i) triple mutants exhibit greatly reduced
                    tolerance to drought stress and highly enhanced insensitivity to ABA.
            processes:
              - preferred_term: abscisic acid-activated signaling pathway
                term:
                  id: GO:0009738
                  label: abscisic acid-activated signaling pathway
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
              - preferred_term: nucleus
                term:
                  id: GO:0005634
