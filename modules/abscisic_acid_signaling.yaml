                  statement: Released SnRK2s phosphorylate ABFs to activate ABA-responsive genes.
                  supporting_text: The relieved SnRK2s can then phosphorylate ABFs to activate ABA-responsive
                    genes.
                - source_id: PMID:16463099
                  statement: ABI5 and AREB1 activate the RD29B promoter.
                  supporting_text: ABI3, ABI5 and AREB1 activated transcription of a GUS reporter gene driven
                    by the RD29B promoter strongly
                - source_id: PMID:10760247
