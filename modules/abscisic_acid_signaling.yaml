            role_description: Phosphorylates ABF/AREB/ABI5 transcription factors and, in guard cells, SLAC1.
    - order: 4
      role: ABRE-binding bZIP transcriptional output
      node:
        id: abf_transcription
        label: ABF/AREB/ABI5 transcriptional activation
        module_type: REGULATORY_STEP
        description: >-
          SnRK2-phosphorylated group A bZIP transcription factors (ABF1-4/AREBs in vegetative tissues;
          ABI5 and related factors in seeds and seedlings) bind ABA-responsive elements (ABREs) and
          activate ABA-responsive genes such as RD29B and late embryogenesis-abundant genes.
        annotons:
          - id: abf_bzip_activator
            label: ABF/AREB/ABI5 bZIP transcription factor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: group A ABRE-binding bZIP transcription factors (ABF/AREB/ABI5)
                representative_members:
                  - preferred_term: ABI5 (Arabidopsis)
                    term:
                      id: UniProtKB:Q9SJN0
                      label: Protein ABSCISIC ACID-INSENSITIVE 5
                  - preferred_term: ABF2/AREB1 (Arabidopsis)
                    term:
