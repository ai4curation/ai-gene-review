id: MODULE:abscisic_acid_signaling
title: Abscisic acid core signaling (PYR/PYL receptor - clade A PP2C - SnRK2 - ABF/ABI5 and SLAC1 outputs)
description: >-
  The core abscisic acid (ABA) signalling pathway of land plants is a double-negative relay that converts
  ABA perception into transcriptional and ion-channel outputs. Soluble START-domain receptors of the
  PYR/PYL/RCAR family bind ABA in an internal cavity; a gate-latch-lock conformational change creates a
  surface that binds and occludes the active site of clade A type 2C protein phosphatases (PP2Cs such
  as ABI1, ABI2, HAB1 and PP2CA/AHG3). In the absence of ABA these PP2Cs bind subclass III SnRK2
  protein kinases (SnRK2.2, SnRK2.3 and SnRK2.6/OST1 in Arabidopsis) and dephosphorylate their
  activation loop, keeping them inactive. ABA-bound receptors inhibit the PP2Cs and disrupt the
  PP2C-SnRK2 interaction, so the SnRK2s autophosphorylate and become active. Active SnRK2s
  phosphorylate the ABRE-binding bZIP transcription factors of the ABF/AREB/ABI5 group, which then
  activate ABA-responsive genes (for example RD29B and late embryogenesis-abundant genes), and in
  guard cells OST1 phosphorylates and activates the plasma-membrane S-type anion channel SLAC1,
  driving anion efflux, depolarisation and stomatal closure. ABA biosynthesis (including the
  NCED-catalysed committed step), ABA transport and catabolism, calcium-dependent kinase (CPK) branches,
  receptor turnover, and downstream transcriptional networks are outside this module's boundary.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0009738
    title: abscisic acid-activated signaling pathway
    statement: The module is grounded in the GO biological process term for ABA-activated signaling.
  - source_id: PMID:19407142
    title: Abscisic acid inhibits type 2C protein phosphatases via the PYR/PYL family of START proteins.
    statement: PYR/PYL proteins are ABA receptors that act at the apex of a negative regulatory pathway
      by inhibiting PP2Cs.
    supporting_text: >-
      PYR/PYLs are ABA receptors functioning at the apex of a negative regulatory pathway that controls
      ABA signaling by inhibiting PP2Cs
  - source_id: PMID:19407143
    title: Regulators of PP2C phosphatase activity function as abscisic acid sensors.
    statement: Independently, RCAR1 binds ABA and mediates ABA-dependent inactivation of ABI1/ABI2.
    supporting_text: >-
      RCAR1 was shown to bind ABA, to mediate ABA-dependent inactivation of ABI1 or ABI2 in vitro, and to
      antagonize PP2C action in planta.
  - source_id: PMID:19924127
    title: In vitro reconstitution of an abscisic acid signalling pathway.
    statement: PYR1, ABI1, SnRK2.6/OST1 and ABF2 are sufficient to reconstitute ABA-triggered ABF
      phosphorylation; receptors, clade A PP2Cs, SnRK2s and ABFs are the core components.
    supporting_text: >-
      our study reveals a surprising simplicity of the pathway and demonstrates that the PYR/PYLs,
      clade-A PP2Cs, SnRK2s, and ABFs are the only core components to complete the ABA regulation of
      gene expression
  - source_id: PMID:19805022
    title: Type 2C protein phosphatases directly regulate abscisic acid-activated protein kinases in
      Arabidopsis.
    statement: Clade A PP2Cs bind and dephosphorylate ABA-activated SnRK2s.
    supporting_text: >-
      Group A PP2Cs interacted physically with SnRK2s in various combinations, and efficiently inactivated
      ABA-activated SnRK2s via dephosphorylation of multiple Ser/Thr residues in the activation loop.
  - source_id: PMID:19880399
    title: Three SnRK2 protein kinases are the main positive regulators of abscisic acid signaling in
      response to water stress in Arabidopsis.
    statement: SnRK2.2/2.3/2.6 (SRK2D/I/E) are redundant positive regulators; the triple mutant is
      strongly ABA-insensitive.
    supporting_text: >-
      srk2d srk2e srk2i (srk2d/e/i) triple mutants exhibit greatly reduced tolerance to drought stress
      and highly enhanced insensitivity to ABA.
  - source_id: PMID:19955405
    title: Activity of guard cell anion channel SLAC1 is controlled by drought-stress signaling
      kinase-phosphatase pair.
    statement: Coexpression with OST1 activates SLAC1 anion currents in Xenopus oocytes.
    supporting_text: >-
      Upon coexpression of SLAC1 with OST1 in Xenopus oocytes, SLAC1-related anion currents appeared
      similar to those observed in guard cells.
  - source_id: PMID:19955405
    title: Activity of guard cell anion channel SLAC1 is controlled by drought-stress signaling
      kinase-phosphatase pair.
    statement: ABI1 in the SLAC1-OST1 complex prevents SLAC1 activation.
    supporting_text: Integration of ABI1 into the SLAC1/OST1 complex, however, prevented SLAC1 activation.
notes: >-
  Arabidopsis thaliana proteins are used as representative members, each grounded with its reviewed
  UniProtKB accession (PYR1 O49686, ABI1 P49597, OST1/SnRK2.6/SRK2E Q940H6, ABI5 Q9SJN0 from the gene
  review folders; SnRK2.2/SRK2D Q39192, SnRK2.3/SRK2I Q39193, ABF2/AREB1 Q9M7Q4 and SLAC1 Q9LD83 from
  UniProt, which have no gene review yet). Annoton molecular functions match the gene reviews' core
  functions: PYR1 abscisic acid binding (GO:0010427, modeled as a separate ABA-sensing annoton on the
  perception node) and protein phosphatase inhibitor activity (GO:0004864); signaling receptor
  activity (GO:0038023) is also core in the PYR1 review and is described in the role text. ABI1 protein
  serine/threonine phosphatase activity (GO:0004722), OST1 protein serine/threonine kinase activity
  (GO:0004674) and ion channel regulator activity (GO:0099106), and ABI5 DNA-binding transcription
  factor activity (GO:0003700). SLAC1 is modeled with voltage-gated monoatomic anion channel activity
  (GO:0008308) from the electrophysiology in PMID:19955405; it has no gene review. ABI5 is included as a
  representative of the ABRE-binding bZIP output role together with ABF2/AREB1, the factor used in the
  in vitro reconstitution; ABI5 acts mainly in seeds and seedlings, whereas ABF/AREBs act in vegetative
  tissues. Boundary decision on NCED3 (Q9LRR7, reviewed): NCED3 catalyses the committed
  9-cis-epoxycarotenoid cleavage step of ABA biosynthesis (GO:0045549, GO:0009688). It produces the
  ligand rather than doing any step of signal transduction, so it is excluded from this module and
  belongs in a future ABA biosynthesis module (upstream of carotene_backbone_biosynthesis outputs).
  Calcium-dependent guard-cell kinases (CPK6/CPK21/CPK23), the CO2 and ROS branches (RBOHF), SLAC1
  homologues (SLAH3), and receptor/PP2C turnover are likewise outside the boundary. No PANTHER family
  ids are asserted. No production GO-CAM in gocams/index.tsv contains these Arabidopsis proteins
  (checked 2026-10-14 by UniProt accession), so no gocam_associations are given.
module:
