id: MODULE:nematode_glutamate_gated_chloride_channels
title: Nematode ivermectin-sensitive glutamate-gated chloride channels
description: >-
  Nematode glutamate-gated chloride channels are Cys-loop anion channels that
  mediate inhibitory responses to extracellular glutamate and are activated
  allosterically by the avermectin anthelmintic ivermectin. C. elegans has
  several channel subunits with direct electrophysiological support: AVR-15 in
  the pharyngeal M3 inhibitory neuromuscular circuit, AVR-14 in extrapharyngeal
  ivermectin-sensitive neurons, GLC-1 and GLC-2 as an alpha/beta pair that can
  assemble into heteromeric GluCls, and GLC-3 as a homomeric GluCl acting in
  AIA and DVB neurons. The core drug-target biology is the repeated channel
  motif: a pentameric plasma-membrane chloride pore that opens in response to
  glutamate and can be locked open by ivermectin in sensitive subtypes.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:7935817
    title: >-
      Cloning of an avermectin-sensitive glutamate-gated chloride channel from
      Caenorhabditis elegans.
    statement: >-
      Cully et al. expression-cloned the original C. elegans GluCl alpha and
      beta subunits, now represented by GLC-1 and GLC-2.
    supporting_text: >-
      expression cloning of two functional complementary DNAs encoding an
      avermectin-sensitive glutamate-gated chloride channel
  - source_id: PMID:10716995
    title: >-
      The genetics of ivermectin resistance in Caenorhabditis elegans.
    statement: >-
      Dent et al. cloned avr-14, showed that the AVR-14B/GluClalpha3B splice
      form is glutamate- and ivermectin-gated in Xenopus oocytes, and placed
      avr-14, avr-15 and glc-1 in parallel ivermectin-sensitivity pathways.
    supporting_text: >-
      Each of the three GluCls genes, avr-14, avr-15 , and glc-1 , constitutes
      a parallel genetic pathway
  - source_id: PMID:9312045
    title: >-
      avr-15 encodes a chloride channel subunit that mediates inhibitory
      glutamatergic neurotransmission and ivermectin sensitivity in
      Caenorhabditis elegans.
    statement: >-
      Dent, Davis and Avery identified AVR-15 as the postsynaptic
      ivermectin-sensitive GluCl required for the inhibitory M3 pharyngeal
      synapse.
    supporting_text: >-
      An avr-15-encoded subunit forms a homomeric channel that is
      ivermectin-sensitive and glutamate-gated
  - source_id: PMID:11250875
    title: >-
      GLC-3: a novel fipronil and BIDN-sensitive, but
      picrotoxinin-insensitive, L-glutamate-gated chloride channel subunit from
      Caenorhabditis elegans.
    statement: >-
      Horoszok et al. showed that GLC-3 forms homomeric channels that are
      selective for chloride and directly activated by ivermectin.
    supporting_text: >-
      Expression of glc-3 cRNA in XENOPUS oocytes resulted in the formation of
      homo-oligomeric L-glutamate-gated chloride channels
  - source_id: PMID:21414922
    title: >-
      Behavioral choice between conflicting alternatives is regulated by a
      receptor guanylyl cyclase, GCY-28, and a receptor tyrosine kinase, SCD-2,
      in AIA interneurons of Caenorhabditis elegans.
    statement: >-
      Shinkai et al. placed GLC-3 in AIA interneurons by showing that
      AIA-specific GLC-3 expression rescued the glc-3 mutant barrier-crossing
      phenotype.
    supporting_text: >-
      animals expressing GLC-3 in AIA interneurons could rescue the phenotype
      of the glc-3 mutant
  - source_id: PMID:37811674
    title: >-
      UBR-1 ubiquitin ligase regulates the balance between GABAergic and
      glutamatergic signaling.
    statement: >-
      Li et al. placed GLC-3 in DVB autoinhibition and GLC-2 with GLC-4 in
      enteric-muscle inhibition downstream of DVB glutamate release.
    supporting_text: >-
      glutamate-gated chloride channels GLC-3 and GLC-2/4 receive DVB's
      glutamate signals to inhibit DVB and enteric muscle activity
  - source_id: file:interpro/panther/PTHR18945/PTHR18945-review.yaml
    title: PTHR18945 family review
    statement: >-
      The PANTHER review places nematode GluCls in the anion-selective
      invertebrate chloride-channel lineage of the heterogeneous Cys-loop
      receptor family, so this module grounds exact subunits rather than using
      family-wide ligand or selectivity assertions.
  - source_id: file:genes/worm/avr-14/avr-14-ai-review.yaml
    title: C. elegans avr-14 gene review
    statement: >-
      The avr-14 review accepts extracellularly glutamate-gated chloride
      channel activity, chloride transport and plasma-membrane localization as
      the core molecular functions of full-length AVR-14.
  - source_id: file:genes/worm/avr-15/avr-15-ai-review.yaml
    title: C. elegans avr-15 gene review
    statement: >-
      The avr-15 review accepts extracellularly glutamate-gated chloride
      channel activity in plasma-membrane and postsynaptic locations.
  - source_id: file:genes/worm/glc-1/glc-1-ai-review.yaml
    title: C. elegans glc-1 gene review
    statement: >-
      The glc-1 review models GLC-1 as contributing a glutamate-binding site,
      intersubunit ivermectin site and chloride-selective pore to
      ivermectin-sensitive GluCl channels.
  - source_id: file:genes/worm/glc-2/glc-2-ai-review.yaml
    title: C. elegans glc-2 gene review
    statement: >-
      The glc-2 review accepts extracellularly glutamate-gated chloride
      channel activity and records evidence for homomeric GLC-2 activity and
      GLC-1/GLC-2 heteromeric channels.
  - source_id: file:genes/worm/glc-3/glc-3-ai-review.yaml
    title: C. elegans glc-3 gene review
    statement: >-
      The glc-3 review accepts extracellularly glutamate-gated chloride
      channel activity for homomeric GLC-3 and records the Shinkai and Li
      primary sources that place native GLC-3 in AIA and DVB neurons.
notes: >-
  Boundary. This first draft models the C. elegans ivermectin-sensitive GluCl
  receptor subunits curated for the nematode anthelmintic-target workstream. It
  includes the three alpha-subunit genetic pathways from Dent et al. and the
  GLC-2 beta subunit that coassembles with GLC-1, plus GLC-3 as a later,
  directly characterized ivermectin-sensitive channel. It does not yet model C.
  elegans GLC-4, monepantel-sensitive
  nicotinic-like receptors, histamine-gated or GABA-gated anion channels,
  innexin modifiers of ivermectin sensitivity, or OSM-1-dependent drug access.
  Brugia, Onchocerca and Haemonchus GluCl orthologs should be added only after
  their reviewed UniProt records or parasite-specific orthology are resolved.
  Nematoda is therefore the intended target scope, with C. elegans as the
  current concrete realization.

  Structure. The receptor variants below are parallel GluCl realizers rather
  than sequential pathway steps: C. elegans can retain ivermectin sensitivity
  when a single GluCl gene is mutated, and high-level resistance in the Dent et
  al. assay required simultaneous loss of avr-14, avr-15 and glc-1. Native
  stoichiometry remains unresolved for these receptors. GLC-2 can also form
  recombinant homomeric channels, and the enteric-muscle GLC-2/GLC-4 receptor
  is a later extension once GLC-4 is reviewed. The Q8IFY7 AVR-14 accession is
  a 239-aa partial model, so AVR-14 channel activity is curated from
  full-length AVR-14B/GluClalpha3B as reviewed in avr-14.
