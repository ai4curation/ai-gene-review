    - order: 2
      role: heat-inducible ATP-dependent HSP90 chaperone and metazoan HSF1 repressor
      node:
        id: hsp90_chaperone
        label: Cytosolic HSP90 ATP-dependent chaperone
        module_type: MOLECULAR_FUNCTION
        description: >-
          Cytosolic HSP90 is an ATP-dependent clamp chaperone. Co-chaperones
          regulate its cycle, which completes the maturation and
          stabilization of metastable clients such as kinases, steroid
          receptors and transcription factors. HSF induces it through HSEs:
          worm HSP-90 (historical mutant name DAF-21), the only cytosolic
          HSP90 in C. elegans, is induced through distal HSEs bound by HSF-1,
          with a PQM-1 contribution. In human cells, HSP90 is also the main
          repressor of HSF1, which closes the negative feedback loop of the
          response.
        annotons:
          - id: hsp90_foldase
            label: HSP90 ATP-dependent chaperone
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Cytosolic HSP90 chaperones
                description: >-
