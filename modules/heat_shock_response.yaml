                supporting_text: >-
                  After HS treatment, hsp-90 was weakly induced in the
                  hsf-1(sy441) mutant, albeit starting at a 50% lower basal
                  expression level
              - source_id: PMID:21980476
                title: >-
                  Downregulation of the Hsp90 system causes defects in muscle
