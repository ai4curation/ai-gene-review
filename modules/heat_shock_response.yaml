                    term:
                      id: PANTHER:PTN000163629
                      label: PTN000163629
                    description: >-
                      Eukaryota-level node in PTHR11528 with IBD for cellular
                      response to heat (GO:0034605), protein stabilization and
                      cytosol. Seeds include worm hsp-90 (WBGene00000915) and
                      human HSP90AA1 (P07900).
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000163629 in PTHR11528.
            function:
              preferred_term: ATP-dependent protein folding chaperone
              term:
                id: GO:0140662
                label: ATP-dependent protein folding chaperone
              substrates:
                - preferred_term: client proteins (kinases, steroid receptors, guanylyl cyclases, myosin)
            processes:
              - preferred_term: protein folding
                term:
                  id: GO:0006457
                  label: protein folding
            locations:
