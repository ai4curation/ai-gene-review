    - order: 2
      role: ATP-independent small HSP holdase output
      node:
        id: shsp_holdase
        label: Small HSP holdases
        module_type: MOLECULAR_FUNCTION
        description: >-
          Canonical small heat shock proteins are alpha-crystallin-domain
          proteins that form dynamic oligomers. Without ATP, they bind
          heat-denatured proteins and keep them soluble and
          refolding-competent; the ATP-dependent chaperones later refold
          these clients. They do not refold clients themselves. The four worm
          hsp-16 genes (hsp-16.1, hsp-16.2, hsp-16.41, hsp-16.48) are
          arranged as divergently transcribed pairs sharing intergenic HSEs,
          are silent without stress and strictly HSF-1-dependent for heat
          induction. Human HSPB1 (Hsp27) is the vertebrate exemplar. GO has
          no current holdase term (see notes).
        annotons:
          - id: shsp_holdase_activity
            label: Small HSP ATP-independent holdase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Canonical small heat shock proteins (alpha-crystallin domain)
                term:
                  id: PANTHER:PTHR45640
                  label: HEAT SHOCK PROTEIN HSP-12.2-RELATED
                representative_members:
                  - preferred_term: HSP-16.1 (worm)
                    term:
                      id: UniProtKB:P34696
                      label: Heat shock protein Hsp-16.1/Hsp-16.11
                  - preferred_term: HSP-16.2 (worm)
                    term:
                      id: UniProtKB:P06582
                      label: Heat shock protein hsp-16.2
                  - preferred_term: HSP-16.41 (worm)
                    term:
                      id: UniProtKB:P06581
                      label: Heat shock protein Hsp-16.41
                  - preferred_term: HSP-16.48 (worm)
                    term:
                      id: UniProtKB:P02513
                      label: Heat shock protein Hsp-16.48/Hsp-16.49
                  - preferred_term: HSPB1/Hsp27 (human)
                    term:
                      id: UniProtKB:P04792
                      label: Heat shock protein beta-1
                ancestral_nodes:
                  - preferred_term: PAINT small HSP node PTN000897708
                    term:
                      id: PANTHER:PTN000897708
                      label: PTN000897708
                    description: >-
                      Eumetazoa-level node in PTHR45640 with IBD for response
                      to heat (GO:0009408), protein refolding, cytoplasm and
                      nucleus. Worm hsp-16.2 and human HSPB1 receive IBA
                      annotations from it. The protein refolding IBD is not
                      followed here, because the sHSP reviews treat refolding
                      as the work of the ATP-dependent chaperones.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000897708 in PTHR45640.
            function:
              preferred_term: protein folding chaperone (ATP-independent holdase)
              term:
                id: GO:0044183
                label: protein folding chaperone
              description: >-
                Holdase sense. The worm hsp-16 and human HSPB1 reviews
                propose a holdase chaperone activity NTR; the parent
                GO:0044183 is used here until GO creates it.
              substrates:
                - preferred_term: heat-denatured aggregation-prone protein
            processes:
              - preferred_term: response to heat
                term:
                  id: GO:0009408
                  label: response to heat
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Heat-inducible sHSP holdase that prevents aggregation of
              denatured proteins and hands them on for ATP-dependent
              refolding; does not refold them itself.
            evidence:
              - source_id: PMID:1550963
                title: >-
                  Temporal and spatial expression patterns of the small heat
                  shock (hsp16) genes in transgenic Caenorhabditis elegans.
                statement: Worm hsp16 transcription is entirely heat-shock dependent.
                supporting_text: >-
                  Transcription of the hsp16-lacZ transgenes was totally
                  heat-shock dependent
              - source_id: PMID:15611166
                title: >-
                  The L-type cyclin CYL-1 and the heat-shock-factor HSF-1 are
                  required for heat-shock-induced protein expression in
                  Caenorhabditis elegans.
                statement: Worm hsp-16.2 heat induction requires HSF-1.
                supporting_text: >-
                  Heat-shock-induced expression of hsp-16.2 mRNA was reduced in
                  cyl-1 mutants and virtually eliminated in hsf-1 and sup-45
                  mutants
              - source_id: PMID:27688402
                title: >-
                  E2F coregulates an essential HSF developmental program that
                  is distinct from the heat-shock response.
                statement: Worm hsp-16.41 heat induction almost entirely requires HSF-1.
                supporting_text: >-
                  The expression of classical heat-shock genes hsp-16.41 and
                  hsp-70 (C12C8.1) was severely compromised (>99% reduced) in
                  hsf-1(ok600) animals exposed to heat shock compared with N2
                  animals
              - source_id: PMID:20178975
                title: >-
                  Increased monomerization of mutant HSPB1 leads to protein
                  hyperactivity in Charcot-Marie-Tooth neuropathy.
                statement: >-
                  sHSPs such as HSPB1 cannot refold clients themselves but keep
                  them folding-competent for the ATP-dependent chaperones.
                supporting_text: >-
                  However, they are able to bind unfolded substrates and keep
