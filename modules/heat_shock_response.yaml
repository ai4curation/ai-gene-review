id: MODULE:heat_shock_response
title: HSF-driven cytosolic heat shock response
description: >-
  The heat shock response couples proteotoxic stress to transcriptional
  induction of the cytosolic chaperone network. Its driver is heat shock factor
  (HSF), a winged helix-turn-helix transcription factor found across
  eukaryotes. HSF binds heat shock elements (HSEs), inverted nGAAn pentamer
  repeats, as a homotrimer and activates RNA polymerase II transcription of
  chaperone genes. How HSF is held in check differs between lineages. In
  metazoans, exemplified by human HSF1, HSF is kept as an inert monomer in
  complexes with HSP90 and HSP70. Proteotoxic stress titrates these chaperones
  away, and HSF1 then trimerizes, binds HSEs and concentrates in nuclear stress
  granules. The induced chaperones feed back to switch HSF1 off. In budding
  yeast, Hsf1 is constitutively trimeric and nuclear. Its essential job is to
  maintain basal expression of the Hsp70 and Hsp90 genes, and stress raises its
  activity further. The chaperone output falls into three activities. Hsp70
  family foldases refold non-native clients by ATP-driven cycles. J-domain
  co-chaperones deliver clients and stimulate the Hsp70 ATPase, and HSP110- and
  BAG-family nucleotide-exchange factors reset the cycle. HSP90 is an
  ATP-dependent chaperone for metastable signaling and structural clients and
  is also the main repressor of metazoan HSF1. Small heat shock proteins are
  ATP-independent holdases that keep heat-denatured proteins soluble and
  refolding-competent for the ATP-dependent chaperones. Nematodes add an
  HSF-1/DAF-16-co-regulated branch of atypical 12-kDa small HSPs that
  contributes to longevity rather than to the acute response. In C. elegans the
  capacity of the response also falls sharply at the onset of reproduction,
  when repressive chromatin at stress loci blocks HSF-1 binding.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:7935471
    title: >-
      Activation of the DNA-binding ability of human heat shock transcription
      factor 1 may involve the transition from an intramolecular to an
      intermolecular triple-stranded coiled-coil structure.
    statement: >-
      Human HSF1 is an inactive monomer in unstressed cells and homotrimerizes
      to acquire HSE binding on heat stress.
    supporting_text: >-
      Heat stress (39 to 42 degrees C) disrupts these interactions, and hHSF1
      homotrimerizes and acquires heat shock element DNA-binding ability.
  - source_id: PMID:9727490
    title: >-
      Repression of heat shock transcription factor HSF1 activation by HSP90
      (HSP90 complex) that forms a stress-sensitive complex with HSF1.
    statement: >-
      HSP90 forms a stress-sensitive complex with human HSF1 and is a major
      repressor of its activation.
    supporting_text: >-
      We conclude that Hsp90, by itself and/or associated with multichaperone
      complexes, is a major repressor of HSF1.
  - source_id: PMID:27320198
    title: >-
      Defining the Essential Function of Yeast Hsf1 Reveals a Compact
      Transcriptional Program for Maintaining Eukaryotic Proteostasis.
    statement: >-
      The essential function of yeast Hsf1 is basal expression of Hsp70 and
      Hsp90; restoring it lets cells grow without Hsf1.
    supporting_text: >-
      Strikingly, rescuing basal expression of Hsp70 and Hsp90 chaperones
      enabled robust cell growth in the complete absence of Hsf1.
  - source_id: PMID:15611166
    title: >-
      The L-type cyclin CYL-1 and the heat-shock-factor HSF-1 are required for
      heat-shock-induced protein expression in Caenorhabditis elegans.
    statement: >-
      hsf-1 mutation virtually abolishes heat-shock-induced hsp-16.2
      transcription, establishing HSF-1 as the inducing factor for heat shock
      genes in the worm.
    supporting_text: >-
      Heat-shock-induced expression of hsp-16.2 mRNA was reduced in cyl-1
      mutants and virtually eliminated in hsf-1 and sup-45 mutants, as compared
      to wild-type expression.
  - source_id: PMID:27688402
    title: >-
      E2F coregulates an essential HSF developmental program that is distinct
      from the heat-shock response.
    statement: >-
      Heat shock relocates worm HSF-1 to distal HSEs of the hsc70 (hsp-1) and
      hsp90 promoters, which then drive their heat induction; the developmental
      HSF-1 program uses different sites and is outside this module.
    supporting_text: >-
      In contrast to the results for development at 20°C, activity of the
      hsc70 and hsp90 promoters at 34°C is independent of the GC-rich motif or
      the proximal HSEs but is regulated entirely by the tandem distal HSEs
  - source_id: PMID:26212459
    title: >-
      Repression of the Heat Shock Response Is a Programmed Event at the Onset
      of Reproduction.
    statement: >-
      In C. elegans the heat shock response collapses in early adulthood
      because repressive chromatin at stress loci prevents HSF-1 binding.
    supporting_text: >-
      This results in a repressed chromatin state that interferes with HSF-1
      binding and suppresses transcription initiation in response to stress.
  - source_id: PMID:14668486
    title: >-
      Regulation of longevity in Caenorhabditis elegans by heat shock factor
      and molecular chaperones.
    statement: >-
      Molecular chaperones are transcriptional targets of HSF-1, and their
      individual knockdown has smaller effects than loss of HSF-1, consistent
      with a chaperone network output.
    supporting_text: >-
      Down-regulation of individual molecular chaperones, transcriptional
      targets of HSF-1, also decreased longevity of long-lived mutant but not
      wild-type animals.
  - source_id: file:genes/human/HSF1/HSF1-ai-review.yaml
    title: human HSF1 gene review
    statement: >-
      Core function: stress-activated homotrimeric HSE-binding transcription
      activator (GO:0001228) in cellular response to heat; held as an inert
      monomer by HSP90, HSP70 and DNAJB1 complexes.
  - source_id: file:genes/yeast/HSF1/HSF1-ai-review.yaml
    title: yeast HSF1 gene review
    statement: >-
      Core function: HSE-binding transcription activator (GO:0001228) driving
      basal and stress-induced Hsp70 and Hsp90 transcription; constitutively
      trimeric and largely nuclear, unlike metazoan HSF1.
  - source_id: file:genes/worm/hsf-1/hsf-1-ai-review.yaml
    title: worm hsf-1 gene review
    statement: >-
      Accepts HSF-1 as the HSE-binding master transcription factor of the
      heat shock response; developmental, immune, autophagy and lifespan roles
      are kept as non-core.
  - source_id: file:projects/CAEEL_PROTEOSTASIS.md
    title: C. elegans Proteostasis Network Project
    statement: >-
      Project page whose heat shock response and chaperone tier this module
      organizes for C. elegans.
notes: >-
  History. This module was first curated as a C. elegans-only module
  (MODULE:c_elegans_heat_shock_response) and was generalized to the
  eukaryotic HSF-driven response. The worm evidence is kept; human and yeast
  exemplars were added from their gene reviews. C. elegans members remain
  among the representative members of every role.

  Boundary. The module covers HSF activation and HSE binding (part 1) and the
  cytosolic chaperone output it induces (parts 2 to 4), with an optional
  nematode-specific atypical sHSP branch (part 5). The context taxon is
  Eukaryota because HSF, Hsp70, HSP90 and the BAG and HSP110 exchange factors
  have PAINT nodes at or above Eukaryota (see ancestral_nodes). The
  representative members are opisthokont only (human, yeast, worm). The small
  HSP holdase node (PTN000897708) is placed at Eumetazoa, so yeast Hsp26/Hsp42
  are not used as representatives. Excluded: heat-shock-independent HSF
  programs, such as the worm developmental program with EFL-1/DPL-1
  (PMID:27688402), linker cell death through the ubiquitin-proteasome system
  (PMID:26952214) and autophagy induction after hormetic heat
  (PMID:28198373). HSF1 roles in mitosis, DNA repair and cancer are also
  excluded, as are the ER unfolded protein response and the mitochondrial UPR.
  HSF also induces the chaperonin CCT/TRiC, which is modeled separately in
  MODULE:cct_chaperonin_folding and is not repeated here.

  Activation mode as a variant set. Part 1 uses a variant set with the axis
  taxon / HSF activation mode. The metazoan variant is a latent monomer that
  trimerizes under stress and is repressed by HSP90 and HSP70 (human HSF1).
  Worm HSF-1 is placed in this variant by family membership and by its
  restraint at an early activation step by DDL-1/DDL-2. It differs from
  human HSF1 in two ways: it is constitutively nuclear (PMID:23107491), and
  a stress-triggered monomer-to-trimer switch has not been shown directly in
  the worm. The yeast variant is constitutively trimeric and nuclear, and its
  essential output is basal Hsp70/Hsp90 expression. The family-level MF is
  GO:0001228, as in the human and yeast reviews. The worm hsf-1 review asserts
  its parent GO:0003700.

  HSP90 feedback on HSF. HSP90 represses human HSF1 (PMID:9727490). This is
  modeled as a NEGATIVELY_REGULATES connection from the HSP90 part to HSF
  activation, with metazoan context. The human HSF1 review also lists
  HSP70/DNAJB1 complexes as repressors, and yeast Hsf1 is under Hsp70/Hsp90
  feedback (yeast HSF1 review). These are recorded in prose only, because
  this module cites no verbatim quote for the HSP70 arm. No cached worm study
  tests whether HSP-90 binds or represses HSF-1, so the connection is not
  asserted for nematodes (see knowledge_gaps).

  Regulators kept as context. Worm DDL-1/DDL-2 hold HSF-1 inactive under
  insulin/IGF-1-like signaling (PMID:22265419). PQM-1 contributes to heat
  induction of worm hsp-90 (PMID:29949773). JMJD-3.1 and H3K27me3 set the
  reproductive decline of the worm response (PMID:26212459). None of these
  has a gene review, so they are not modeled as members. HSF1
  post-translational modifications (phosphorylation, SUMOylation,
  acetylation) are likewise left to the HSF1 review.

  Hsp70 cofactors. The J-domain role is grounded by human DNAJB1 only. No
  worm Hsp40 (DNJ) gene has a review, and no cached paper names the
  HSF-1-induced worm Hsp40 partner. DNJ-13 (PMID:25053410) and DNJ-19
  (PMID:19165329) are mentioned in text only. Human HSPH1 (HSP110) has no
  review and is not used, so worm HSP-110 is the only HSP110 representative.
  The HSPA1A review gives its core MF as the parent GO:0044183, while its
  description calls HSPA1A an ATP-dependent foldase. The family-level MF here
  is GO:0140662, as in the worm hsp-1, hsp-70 and F44E5.4 reviews.

  Small HSP holdases. GO has no current holdase term, because GO:0051082 was
  obsoleted. The worm hsp-16 reviews propose a holdase chaperone activity
  NTR, and the HSPB1 review now proposes the same NTR (its GO:0044183 rows
  are MODIFY to it). Until GO creates that term, the family-level
  function is the parent GO:0044183, and the holdase sense is
  described in prose.

  Atypical small HSPs. The 12-kDa sHSPs are a nematode-specific optional part
  that follows their gene reviews. HSP-12.3 forms tetramers and HSP-12.6 is
  monomeric; neither shows in vitro chaperone activity. Because hsp-12.6 is
  not stress-inducible, no heat-response process is asserted for it. Their
  link to HSF-1 runs through HSF-1/DAF-16 co-regulation of sHSP genes in
  reduced insulin signaling and longevity (PMID:12750521), not through acute
  heat induction.

  Relation to other modules. MODULE:bacterial_dnak_dnaj_refolding_cycle
  models the bacterial DnaK/DnaJ/GrpE Hsp70 cycle. Part 2 here is the
  eukaryotic cytosolic counterpart, with HSP110- and BAG-family NEFs in place
  of GrpE, inside a stress-induced transcriptional program, so the two
  modules do not duplicate each other. MODULE:cct_chaperonin_folding covers
  the CCT/TRiC chaperonin.
module:
  id: heat_shock_response
  label: HSF-driven cytosolic heat shock response
  module_type: BIOLOGICAL_PROCESS
  description: >-
    HSF activation and HSE-dependent transcription (latent-monomer metazoan
    or constitutively trimeric yeast mode). The cytosolic chaperone network it
    induces: the Hsp70 foldase cycle with J-domain co-chaperones and HSP110-
    and BAG-family nucleotide-exchange factors, the HSP90 chaperone (also the
    HSF1 repressor in metazoa), small HSP holdases, and a nematode-specific
    HSF-1/DAF-16-co-regulated atypical sHSP branch.
  concepts:
    - preferred_term: cellular response to heat
      term:
        id: GO:0034605
        label: cellular response to heat
      description: >-
        Core process: the cell-autonomous transcriptional and chaperone
        response to elevated temperature.
  context:
    taxa:
      - preferred_term: Eukaryota
        term:
          id: NCBITaxon:2759
          label: Eukaryota
    conditions:
      - preferred_term: heat shock or other proteotoxic stress
  parts:
    - order: 1
      role: stress-regulated heat shock factor binding HSEs and inducing chaperone genes
      node:
        id: hsf_activation
        label: HSF activation and HSE-dependent transcription
        module_type: REGULATORY_STEP
        description: >-
          HSF binds HSEs (continuous inverted nGAAn pentamers) as a trimer and
          activates RNA polymerase II transcription of chaperone genes. The
          lineages differ in how HSF is kept inactive and how stress
          activates it (variant set). In metazoans, HSF1 is a latent monomer
          that trimerizes when stress titrates away its HSP90/HSP70
          repressors. In budding yeast, Hsf1 is constitutively trimeric and
          nuclear and drives essential basal chaperone expression. Heat shock
          concentrates HSF in nuclear stress granules in both human and worm
          cells.
        variant_sets:
          - id: hsf_activation_mode
            label: HSF activation mode
            axis: taxon / HSF activation mode
            selection: EXACTLY_ONE
            notes: >-
              Metazoan latent-monomer HSF1 (human; worm HSF-1 by family and
              pathway context) versus constitutively trimeric, nuclear fungal
              Hsf1 (budding yeast). Both are HSF family members (PTHR10015)
              that descend from the eukaryotic PAINT node PTN007416549.
            variants:
              - id: metazoan_latent_monomer_hsf
                label: Metazoan latent-monomer HSF1, repressed by HSP90/HSP70
                module_type: REGULATORY_STEP
                description: >-
                  In unstressed cells, HSF1 is an inert monomer, held by
                  intramolecular leucine-zipper contacts and by HSP90- and
                  HSP70-containing complexes. Proteotoxic stress releases it.
                  HSF1 then homotrimerizes, gains HSE binding, accumulates in
                  nuclear stress granules and activates HSP70, HSP90 and small
                  HSP genes. The induced chaperones attenuate it again. Worm
                  HSF-1 belongs here by family and by an early activation step
                  that DDL-1/DDL-2 restrain under insulin/IGF-1-like
                  signaling. Unlike human HSF1, worm HSF-1 is constitutively
                  nuclear, and its trimerization switch is inferred rather
                  than shown.
                context:
                  taxa:
                    - preferred_term: Metazoa
                      term:
                        id: NCBITaxon:33208
                        label: Metazoa
                annotons:
                  - id: metazoan_hsf1_tf
                    label: Metazoan HSF1 HSE-binding transcription activator
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Heat shock factor 1 (metazoan)
                        term:
                          id: PANTHER:PTHR10015
                          label: HEAT SHOCK TRANSCRIPTION FACTOR
                        representative_members:
                          - preferred_term: HSF1 (human)
                            term:
                              id: UniProtKB:Q00613
                              label: Heat shock factor protein 1
                          - preferred_term: HSF-1 (worm)
                            term:
                              id: UniProtKB:G5EFT5
                              label: Heat shock transcription factor hsf-1
                        ancestral_nodes:
                          - preferred_term: PAINT HSF node PTN007416549
                            term:
                              id: PANTHER:PTN007416549
                              label: PTN007416549
                            description: >-
                              Eukaryota-level node in PTHR10015 with IBD for
                              DNA-binding transcription factor activity
                              (GO:0003700), RNA polymerase II cis-regulatory
                              region sequence-specific DNA binding and
                              nucleus. Seeds include human HSF1 (Q00613) and
                              worm hsf-1 (WBGene00002004).
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN007416549 in PTHR10015.
                    function:
                      preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
                      term:
                        id: GO:0001228
                        label: DNA-binding transcription activator activity, RNA polymerase II-specific
                      targets:
                        - preferred_term: >-
                            HSE-containing promoters of HSP70, HSP90 and small
                            HSP genes
                    processes:
                      - preferred_term: cellular response to heat
                        term:
                          id: GO:0034605
                          label: cellular response to heat
                      - preferred_term: positive regulation of transcription by RNA polymerase II
                        term:
                          id: GO:0045944
                          label: positive regulation of transcription by RNA polymerase II
                    locations:
                      - preferred_term: nucleus
                        term:
                          id: GO:0005634
                          label: nucleus
                        description: >-
                          Activated HSF1 concentrates in nuclear stress
                          granules (GO:0097165) in human and worm cells.
                    role_description: >-
                      Stress-activated master transcription factor; a latent
                      monomer that homotrimerizes to bind HSEs and induce
                      chaperone genes.
                    evidence:
                      - source_id: PMID:7935471
                        title: >-
                          Activation of the DNA-binding ability of human heat
                          shock transcription factor 1 may involve the
                          transition from an intramolecular to an
                          intermolecular triple-stranded coiled-coil
                          structure.
                        statement: >-
                          Human HSF1 is monomeric and inactive in unstressed
                          cells and trimerizes to bind HSEs on heat stress.
                        supporting_text: >-
                          In unstressed human cells (37 degrees C), hHSF1
                          appears to be in an inactive, monomeric state that
                          may be maintained through intramolecular
                          interactions stabilized by transient interaction
                          with hsp70.
                      - source_id: PMID:9727490
                        title: >-
                          Repression of heat shock transcription factor HSF1
                          activation by HSP90 (HSP90 complex) that forms a
                          stress-sensitive complex with HSF1.
                        statement: >-
                          An HSP90-containing HSF1 complex exists in unstressed
                          cells and dissociates during stress.
                        supporting_text: >-
                          Hsp90-containing HSF1 complex is present in the
                          unstressed cell and dissociates during stress.
                      - source_id: PMID:21510947
                        title: >-
                          Diversity in DNA recognition by heat shock
                          transcription factors (HSFs) from model organisms.
                        statement: >-
                          Worm HSF-1 binds continuous nGAAn HSEs but, unusually,
                          not discontinuous ones.
                        supporting_text: >-
                          Among these, only C. elegans HSF failed to bind the
                          discontinuous nGAAn units
                      - source_id: PMID:23107491
                        title: >-
                          Caenorhabditis elegans HSF-1 is an essential nuclear
                          protein that forms stress granule-like structures
                          following heat shock.
                        statement: >-
                          Heat shock redistributes worm HSF-1 into nuclear
                          stress granules that mark active transcription,
                          dependent on DNA binding.
                        supporting_text: >-
                          Rapid formation of HSF-1 stress granules required
                          HSF-1 DNA-binding activity
                      - source_id: PMID:22265419
                        title: >-
                          HSF-1 regulators DDL-1/2 link insulin-like signaling
                          to heat-shock responses and modulation of longevity.
                        statement: >-
                          Insulin/IGF-1-like signaling regulates an early step
                          of worm HSF-1 activation via DDL-1 and DDL-2.
                        supporting_text: >-
                          This regulation occurs at an early step of HSF-1
                          activation via two HSF-1 regulators, DDL-1 and DDL-2.
                      - source_id: file:genes/human/HSF1/HSF1-ai-review.yaml
                        title: human HSF1 gene review
                        statement: >-
                          Core functions: GO:0001228 transcription activator in
                          cellular response to heat, and HSE binding
                          (GO:0000978) by HSF1 trimers.
                      - source_id: file:genes/worm/hsf-1/hsf-1-ai-review.yaml
                        title: worm hsf-1 gene review
                        statement: >-
                          Core functions: DNA-binding transcription factor
                          activity (GO:0003700), sequence-specific HSE binding
                          and homo-oligomerization.
              - id: fungal_constitutive_trimer_hsf
                label: Constitutively trimeric, nuclear fungal Hsf1
                module_type: REGULATORY_STEP
                description: >-
                  Budding yeast Hsf1 is the single, essential HSF. It is
                  constitutively trimeric and nuclear. Its essential function
                  under all conditions is basal transcription of a compact set
                  of chaperone genes; restoring basal Hsp70 (SSA2) and Hsp90
                  (HSC82) expression alone lets cells grow without Hsf1. Heat
                  and proteotoxic stress raise its activity through
                  phosphorylation and release from Hsp70/Hsp90 feedback, and
                  it then drives chaperone induction for thermotolerance.
                context:
                  taxa:
                    - preferred_term: Fungi
                      term:
                        id: NCBITaxon:4751
                        label: Fungi
                annotons:
                  - id: fungal_hsf1_tf
                    label: Yeast Hsf1 constitutive HSE-binding transcription activator
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Heat shock factor (fungal Hsf1)
                        term:
                          id: PANTHER:PTHR10015
                          label: HEAT SHOCK TRANSCRIPTION FACTOR
                        representative_members:
                          - preferred_term: Hsf1 (budding yeast)
                            term:
                              id: UniProtKB:P10961
                              label: Heat shock transcription factor
                        ancestral_nodes:
                          - preferred_term: PAINT HSF node PTN007416549
                            term:
                              id: PANTHER:PTN007416549
                              label: PTN007416549
                            description: >-
                              Same Eukaryota-level HSF node as the metazoan
                              variant. Budding yeast Hsf1 is an IBD seed under
                              its SGD id (S000003041) rather than its UniProt
                              accession, and receives its IBA annotations from
                              this node.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN007416549 in PTHR10015.
                    function:
                      preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
                      term:
                        id: GO:0001228
                        label: DNA-binding transcription activator activity, RNA polymerase II-specific
                      targets:
                        - preferred_term: >-
                            HSE-containing promoters of Hsp70 (SSA) and Hsp90
                            (HSC82, HSP82) genes
                    processes:
                      - preferred_term: cellular response to heat
                        term:
                          id: GO:0034605
                          label: cellular response to heat
                      - preferred_term: positive regulation of transcription by RNA polymerase II
                        term:
                          id: GO:0045944
                          label: positive regulation of transcription by RNA polymerase II
                    locations:
                      - preferred_term: nucleus
                        term:
                          id: GO:0005634
                          label: nucleus
                    role_description: >-
                      Constitutively trimeric, nuclear HSF whose essential
                      output is basal Hsp70/Hsp90 expression; stress raises its
                      activity further.
                    evidence:
                      - source_id: PMID:18270585
                        title: >-
                          Hsf1 activation inhibits rapamycin resistance and TOR
                          signaling in yeast revealed by combined proteomic and
                          genetic analysis.
                        statement: Yeast Hsf1 binds HSEs as a homotrimer.
                        supporting_text: >-
                          Hsf1 forms a homotrimer and recognizes heat shock
                          elements (HSEs) in promoters of target genes
                          consisting of at least three inverted repeats of
                          nGAAn.
                      - source_id: PMID:27320198
                        title: >-
                          Defining the Essential Function of Yeast Hsf1 Reveals
                          a Compact Transcriptional Program for Maintaining
                          Eukaryotic Proteostasis.
                        statement: >-
                          Yeast Hsf1 is constitutively nuclear and essential;
                          mammalian HSF1 instead is repressed and dispensable
                          without stress.
                        supporting_text: >-
                          Hsf1 is constitutively nuclear and essential for
                          yeast growth under all conditions
                      - source_id: PMID:27320198
                        title: >-
                          Defining the Essential Function of Yeast Hsf1 Reveals
                          a Compact Transcriptional Program for Maintaining
                          Eukaryotic Proteostasis.
                        statement: >-
                          Of the synthetic Hsf1 target genes, only the Hsp70
                          SSA2 and Hsp90 HSC82 genes are indispensable for
                          bypassing Hsf1.
                        supporting_text: >-
                          we found that that only SSA2 and HSC82 were
                          indispensable for Hsf1 bypass
                      - source_id: file:genes/yeast/HSF1/HSF1-ai-review.yaml
                        title: yeast HSF1 gene review
                        statement: >-
                          Core function: GO:0001228 transcription activator for
                          basal and stress-induced chaperone gene expression.
    - order: 2
      role: ATP-dependent Hsp70 refolding of heat-denatured clients with J-domain and nucleotide-exchange cofactors
      node:
        id: hsp70_folding_cycle
        label: Cytosolic Hsp70 folding cycle with J-domain, HSP110 and BAG cofactors
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Cytosolic Hsp70s bind non-native clients and refold them through
          ATP hydrolysis-coupled cycles. Constitutive Hsc70 (worm HSP-1) is
          abundant without stress and modestly heat-inducible. The inducible
          HSP70s (worm HSP-70/C12C8.1 and F44E5.4; human HSPA1A) are strongly
          HSF-dependent. J-domain co-chaperones (human DNAJB1) deliver clients
          and stimulate the Hsp70 ATPase. HSP110-family (worm HSP-110) and
          BAG-domain (worm BAG-1, human BAG1) nucleotide-exchange factors
          release ADP to reset the cycle.
        concepts:
          - preferred_term: protein folding
            term:
              id: GO:0006457
              label: protein folding
        annotons:
          - id: hsp70_foldase
            label: Cytosolic Hsp70 ATP-dependent foldase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Cytosolic Hsp70/Hsc70 chaperones
                term:
                  id: PANTHER:PTHR19375
                  label: HEAT SHOCK PROTEIN 70KDA
                representative_members:
                  - preferred_term: HSP-1 (worm Hsc70)
                    term:
                      id: UniProtKB:P09446
                      label: Heat shock protein hsp-1
                  - preferred_term: HSP-70/C12C8.1 (worm, inducible)
                    term:
                      id: UniProtKB:O45246
                      label: Heat shock protein 70
                  - preferred_term: F44E5.4 (worm, inducible)
                    term:
                      id: UniProtKB:G5ECU5
                      label: Heat shock protein 70
