knowledge_gaps:
  - gap_statement: >-
      Whether HSP-90 (or HSP-1) binds HSF-1 and represses it in unstressed C.
      elegans cells, as HSP90 represses human HSF1, is unknown. The answer
      would show whether the nematode response shares the metazoan chaperone
      feedback loop.
    boundary: >-
      HSP90 repression of HSF1 is established for human cells (PMID:9727490).
      In the worm, HSF-1 activation is known to be restrained by DDL-1/DDL-2
      under insulin signaling and by chromatin state at stress loci. No cached
      worm study tests HSP-90-HSF-1 binding or derepression of HSF-1 targets
      after HSP-90 inhibition.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether the worm response has the canonical metazoan
      chaperone feedback loop or relies on other attenuation mechanisms.
    resolution: >-
      Co-immunoprecipitate HSF-1 with HSP-90 and HSP-1 before and after heat
      shock; test hsp-16.2 reporter induction after hsp-90 RNAi or
      geldanamycin at permissive temperature.
  - gap_statement: >-
      The in vivo activity of the atypical 12-kDa sHSPs is unknown. They lack
      in vitro chaperone activity, yet hsp-12.6 knockdown shortens daf-2
      lifespan and accelerates polyglutamine aggregation.
    boundary: >-
      Their in vitro inactivity rests on citrate synthase and similar
      aggregation assays; other clients, partners or hetero-oligomerization
      with canonical sHSPs have not been tested.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether these proteins are chaperones with unusual clients,
      regulators of other sHSPs, or effectors with a non-chaperone function.
    resolution: >-
      Identify in vivo binding partners of HSP-12.6 and HSP-12.3 by
      proximity labeling, and test hetero-oligomerization with HSP-16 family
      members.
    provenance:
      - reference_id: PMID:9139746
        supporting_text: >-
          Interestingly, HSP12.6 does not function as a molecular chaperone in
          vitro, since it is unable to prevent the thermally induced
          aggregation of a test substrate.
