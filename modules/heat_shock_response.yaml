                  (TRAP1) paralogs. The cytosolic clade is fixed by the PAINT
                  node below. PANTHER places both representatives in
                  PTHR11528:SF87, named after vertebrate HSP90-alpha, so the
                  family level is kept.
                term:
                  id: PANTHER:PTHR11528
                  label: HEAT SHOCK PROTEIN 90 FAMILY MEMBER
                representative_members:
                  - preferred_term: HSP-90/DAF-21 (worm)
                    term:
