                  term:
                    id: CHEBI:15379
                    label: dioxygen
              products:
                - preferred_term: (3S)-3-hydroxy-L-asparaginyl-[HIF alpha C-TAD]
                  term:
                    id: CHEBI:138107
                    label: (3S)-3-hydroxy-L-asparagine residue
                - preferred_term: succinate
                  term:
                    id: CHEBI:30031
                    label: succinate(2-)
                - preferred_term: CO2
                  term:
