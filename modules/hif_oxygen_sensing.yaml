    - order: 5
      role: oxygen-dependent asparaginyl hydroxylation that silences the transactivation domain
      node:
        id: fih_asparaginyl_hydroxylation
        label: Asparaginyl hydroxylation of the HIF-alpha C-TAD by FIH (HIF1AN)
        module_type: REACTION
        description: >-
          FIH hydroxylates a conserved asparagine (Asn803 of HIF-1alpha, Asn851 of HIF-2alpha)
          in the C-terminal transactivation domain, using O2 and 2-oxoglutarate as cosubstrates
          like the prolyl hydroxylases. 3-Hydroxyasparagine prevents the C-TAD from binding the
          CH1 domain of p300/CBP, so the alpha subunit that escapes degradation is still
          transcriptionally silent. The two hydroxylations are independent, and the alpha subunit
          becomes fully active only when both fail. FIH is not part of a feedback loop: like the
          prolyl hydroxylases it is a constitutive enzyme whose rate is set by oxygen
          availability.
        concepts:
          - preferred_term: protein hydroxylation
            term:
              id: GO:0018126
              label: protein hydroxylation
        evidence:
          - source_id: PMID:12080085
            statement: FIH-1 is the asparaginyl hydroxylase, an Fe(II)-dependent enzyme using molecular O2.
            supporting_text: Like known hydroxylase enzymes, FIH-1 is an Fe(II)-dependent enzyme that uses molecular O(2) to modify its substrate.
          - source_id: RHEA:54260
            statement: >-
              L-asparaginyl-[protein] + 2-oxoglutarate + O2 = (3S)-3-hydroxy-L-asparaginyl-[protein]
              + succinate + CO2; a Rhea xref of GO:0036140 and EC 1.14.11.30.
