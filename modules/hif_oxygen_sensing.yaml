id: MODULE:hif_oxygen_sensing
title: HIF oxygen sensing — prolyl hydroxylation of HIF-alpha by PHD1-3, CRL2(VHL) ubiquitination and degradation, FIH asparaginyl hydroxylation, and HIF-alpha/ARNT dimerisation with p300/CBP; EGLN1/EGLN2/EGLN3/OS9/VHL/ELOB/ELOC/CUL2/RBX1/SAT2/HIF1AN/HIF1A/EPAS1/HIF3A/ARNT/ARNT2/EP300/CREBBP/RACK1/SAT1
description: >-
  Hypoxia-inducible factor (HIF) is the master transcriptional regulator of the metazoan
  response to low oxygen. It is a heterodimer of an oxygen-labile alpha subunit (HIF-1alpha,
  HIF-2alpha/EPAS1, or HIF-3alpha) and a constitutive bHLH-PAS beta subunit (ARNT, also called
  HIF-1beta, or its paralog ARNT2). The oxygen signal is read by two families of
  Fe(II)- and 2-oxoglutarate-dependent dioxygenases that use molecular O2 as a cosubstrate, so
  their activity falls as oxygen falls. The prolyl hydroxylases PHD1, PHD2 and PHD3 (EGLN2,
  EGLN1 and EGLN3) hydroxylate two prolines in the oxygen-dependent degradation domain of the
  alpha subunit. trans-4-Hydroxyproline creates the recognition mark for the von Hippel-Lindau
  protein (VHL), the substrate receptor of a cullin-2 RING ubiquitin ligase (CRL2) in which the
  Elongin B/C module (ELOB, ELOC) bridges VHL's VHL-box to the CUL2 scaffold and the RING
  subunit RBX1 transfers ubiquitin. Polyubiquitinated HIF-alpha is destroyed by the proteasome,
  giving the protein a half-life of minutes in oxygenated cells. In parallel, the asparaginyl
  hydroxylase FIH (HIF1AN) hydroxylates a conserved asparagine in the C-terminal
  transactivation domain, which blocks binding of the coactivators p300 (EP300) and CBP
  (CREBBP) and so silences the fraction of alpha subunit that escapes degradation. When oxygen
  is scarce both hydroxylations fail: the alpha subunit accumulates, enters the nucleus,
  dimerises with ARNT through its bHLH and PAS domains, binds hypoxia response elements and
  recruits p300/CBP to activate transcription of genes for angiogenesis, erythropoiesis,
  glycolysis and iron handling. Several proteins tune the switch without sensing oxygen
  themselves: OS-9 scaffolds HIF-1alpha with the prolyl hydroxylases, SSAT2 (SAT2) stabilises
  the VHL-Elongin C interaction, and RACK1 with SSAT1 (SAT1) recruits the Elongin B/C ligase to
  HIF-1alpha independently of hydroxylation and of VHL. Loss of VHL abolishes degradation and
  gives constitutive HIF activity, the basis of von Hippel-Lindau disease and of clear-cell
  renal carcinoma; EPAS1 and EGLN1 mutations cause erythrocytosis and paraganglioma.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000360
    title: hypoxia inducible factor pathway
    statement: >-
      The module boundary follows the RGD Pathway Ontology term and its interactive diagram.
      The diagram centres on the hydroxylated alpha subunit (drawn as Hif1a+O2) and draws
      Egln1 positively affecting it and associated with Os9; Hif1a+O2 associated with Os9,
      Sat1, Sat2 and Vhl; Hif1an positively affecting Hif1a+O2; Hif1a+O2 negatively affecting
      Crebbp and EP300; Gnb2l1 (Rack1) associated with Hif1a+O2, Sat1 and Tceb1; Sat2
      associated with Tceb1 and Vhl; Tceb1 associated with Vhl and with the Tceb1 recruited
      complex; and the deoxygenated alpha subunit (Hif1a-O2) positively affecting Hif target
      genes, with the labels "Hif-alpha ubiquitination, proteasomal degradation", "P-OH" and
      "N-OH". The record text adds the three alpha genes, the second beta subunit Arnt2, the
      three prolyl hydroxylases with Egln1/Phd2 as the essential one, and the oxygen-independent
      Rack1 route. Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000360.yaml).
  - source_id: GO:0097411
    title: hypoxia-inducible factor-1alpha signaling pathway
    statement: >-
      The curated narrowMatch recorded for PW:0000360 in
      projects/RGD_PATHWAY_ONTOLOGY/data/pw_go_curated.sssom.yaml, and this module's process
      concept. The mapping comment notes that GO:0097411 is HIF-1alpha only while the PW
      pathway also covers HIF-2alpha (EPAS1), which is why the alpha subunit is modelled as a
      variant set rather than as HIF1A alone.
  - source_id: GO:0071456
    title: cellular response to hypoxia
    statement: >-
      The curated broadMatch recorded for PW:0000360 in the same SSSOM file. It is the parent
      process under which GO:0097411 sits (GO:0097411 part_of GO:0071456), and the process the
      human GO-CAM gomodel:689e7a5d00004061 places the HIF1A transcription-factor activity in.
      It is kept as prose context rather than as the module's core concept, since a broad
      cellular-response term is less informative than the signalling-pathway term.
  - source_id: gomodel:689e7a5d00004061
    title: Regulation of Respiratory chain complex I by COXFA4L2 upon hypoxia. (Human)
    statement: >-
      The closest human GO-CAM to this module's transcriptional output: it enables HIF1A
      DNA-binding transcription factor activity, RNA polymerase II-specific (GO:0000981) as part
      of GO:0071456 cellular response to hypoxia, driving COXFA4L2 expression. No production
      GO-CAM models the oxygen-sensing switch itself (checked gocams/index.tsv, October 2026):
      there is no model containing VHL, HIF1AN, EGLN1 or EGLN2, and the only EGLN3 model
      (gomodel:680ad14200007201) hydroxylates GPX4 rather than a HIF alpha subunit.
  - source_id: gomodel:63f809ec00000611
    title: The CRL2(KLHDC10) complex catalyzes ubiquitination via the DesCEND (destruction via C-end degrons) pathway (Human)
    statement: >-
      The CRL2 core of this module (CUL2 ubiquitin ligase complex scaffold activity GO:0160072,
      RBX1 ubiquitin protein ligase activity GO:0061630) is grounded on this curated human
      CRL2 model, which uses a different substrate receptor (KLHDC10 rather than VHL) and
      therefore grounds the scaffold and RING activities, not the substrate choice.
  - source_id: PMID:11292861
    title: Targeting of HIF-alpha to the von Hippel-Lindau ubiquitylation complex by O2-regulated prolyl hydroxylation.
    statement: >-
      The founding result for the module: prolyl hydroxylation of the alpha subunit is the
      oxygen-dependent step that licenses pVHL binding, and the hydroxylase is the oxygen sensor.
    supporting_text: An absolute requirement for dioxygen as a cosubstrate and iron as cofactor suggests that HIF-PH functions directly as a cellular oxygen sensor.
  - source_id: PMID:11823643
    title: Asparagine hydroxylation of the HIF transactivation domain a hypoxic switch.
    statement: >-
      Establishes the second, transcription-blocking hydroxylation as a part of the same switch,
      so the module has two oxygen-sensing arms rather than one.
    supporting_text: Full induction of HIF-1alpha and -2alpha, therefore, relies on the abrogation of both Pro and Asn hydroxylation, which during normoxia occur at the degradation and COOH-terminal transactivation domains, respectively.
  - source_id: PMID:10353251
    title: The tumour suppressor protein VHL targets hypoxia-inducible factors for oxygen-dependent proteolysis.
    statement: >-
      Places pVHL in the degradation arm and shows that losing it is sufficient for constitutive
      HIF activity, which is why the ligase is a part of the module and not external regulation.
    supporting_text: In VHL-defective cells, HIF alpha-subunits are constitutively stabilized and HIF-1 is activated.
  - source_id: PMID:7539918
    title: Hypoxia-inducible factor 1 is a basic-helix-loop-helix-PAS heterodimer regulated by cellular O2 tension.
    statement: >-
      The heterodimer definition, and the basis for modelling the beta subunit as a shared,
      constitutive partner that also serves other bHLH-PAS factors.
    supporting_text: HIF-1 beta is a series of ARNT gene products, which can thus heterodimerize with either HIF-1 alpha or AHR.
  - source_id: PMID:8917528
    title: An essential role for p300/CBP in the cellular response to hypoxia.
    statement: >-
      p300/CBP recruitment is the transcriptional output step that the asparaginyl hydroxylation
      arm switches off, so both coactivators are modelled as parts.
    supporting_text: Hypoxic conditions lead to the formation of a DNA binding complex containing both HIF-1 alpha and p300/CBP.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000360 through the RGD_PATHWAY_ONTOLOGY
  project's diagram->module route. RGD curates 20 human genes to PW:0000360 (ARNT ARNT2 CREBBP
  CUL2 EGLN1 EGLN2 EGLN3 ELOB ELOC EP300 EPAS1 HIF1A HIF1AN HIF3A OS9 RACK1 RBX1 SAT1 SAT2 VHL).
  All 20 are modelled here. The mapped GO process GO:0097411 is the module's core concept and
  the broader GO:0071456 is kept as prose; both mappings come from the project's curated SSSOM
  file. The fly counterpart is modules/dmel_hif_complex.yaml, which models only the Sima-Tgo
  heterodimer (the FlyBase HIF gene group) and explicitly leaves the oxygen sensor Fatiga (Hph)
  and the VHL ligase out as regulators; this mammalian module takes the opposite boundary,
  because the RGD pathway is the sensing-and-degradation switch and the heterodimer is one step
  inside it. Nothing is duplicated between the two: the fly module is referenced here only in
  prose, since cross-species inclusion by module_ref would assert an identity between the fly
  complex and the human one that this module does not need.

  Molecular functions were taken from each protein's experimental GO annotations in QuickGO
  (checked 2026-10-28) and, where a gene review exists, cross-checked against its core
  functions. EGLN1, EGLN2 and EGLN3 all carry GO:0160082 hypoxia-inducible factor-proline
  dioxygenase activity (EGLN1 EXP/IDA and the core function of the completed EGLN1 review;
  EGLN2 and EGLN3 EXP), whose definition and Rhea xref RHEA:48400 are exactly the reaction this
  module's first step performs; the parent GO:0031545 peptidyl-proline 4-dioxygenase activity
  was not used for the HIF reaction, although it is the term the Reactome HIF reactions map to
  and the term the EGLN3 GO-CAM uses for its GPX4 substrate. HIF1AN carries GO:0036140
  [protein]-asparagine 3-dioxygenase activity (IDA/IMP; RHEA:54260). VHL carries GO:1990756
  ubiquitin-like ligase-substrate adaptor activity (IDA), ELOC GO:0030674
  protein-macromolecule adaptor activity (IBA; core in the ELOC review), ELOB GO:0031625
  ubiquitin protein ligase binding (IDA; core in the ELOB review), CUL2 GO:0160072 ubiquitin
  ligase complex scaffold activity (IDA) and RBX1 GO:0061630 ubiquitin protein ligase activity
  (IDA; core in the RBX1 review). The alpha subunits carry GO:0000981 DNA-binding transcription
  factor activity, RNA polymerase II-specific (HIF1A IDA, HIF3A IDA, EPAS1 IBA/ISA), the term
  both human HIF1A GO-CAMs use; the more specific GO:0001228 DNA-binding transcription
  activator activity, RNA polymerase II-specific is available for HIF1A (IDA/IMP) but not
  experimentally for EPAS1 or HIF3A, and HIF3A's IPAS variant is a repressor, so the shared
  parent is used across the variant set. ARNT and ARNT2 carry GO:0046982 protein
  heterodimerization activity (both IDA; core in the ARNT review) — the beta subunit's role
  here is to provide the dimerisation partner and the composite DNA-binding surface, and its
  own GO:0000981 annotation is contributes_to (IDA) rather than enables. EP300 and CREBBP carry
  GO:0003713 transcription coactivator activity (IDA; core in both reviews).

  Boundary decisions. (1) Target genes are out of scope. VEGFA and EPO are the outputs the
  pathway acts on, not participants: they bind no HIF, hydroxylate nothing and carry no
  signalling activity, exactly the substrate-versus-participant distinction CLAUDE.md requires.
  RGD draws them behind a single "Hif target genes" sub-page link rather than as genes, and
  neither is in the PW:0000360 gene list. (2) OS9, SAT2, RACK1 and SAT1 are modelled as
  regulatory parts rather than relegated to context, because each has a primary paper with
  gain- and loss-of-function evidence placing it in a physical complex with HIF-1alpha and with
  a named component of the degradation machinery (OS-9 with the prolyl hydroxylases,
  PMID:15721254; SSAT2 with VHL and Elongin C, PMID:17558023; RACK1 with Elongin C,
  PMID:17244529; SSAT1 with RACK1, PMID:17875644). None of the four has a GO molecular function
  that describes this role: OS9's only experimental MF is GO:0140032 glycosylation-dependent
  protein binding (IDA), from its ERAD lectin function; SAT1 and SAT2 carry only their
  polyamine acetyltransferase activity GO:0004145 (and SAT2 also a NOT|enables GO:0004145 IDA
  row, reflecting the dispute over whether it acetylates spermidine at all), which is not the
  activity at work here; RACK1's adaptor role is captured only by the broad GO:0060090
  molecular adaptor activity (TAS; core in the RACK1 review, which already records HIF1A as a
  client). Their annotons therefore carry a preferred_term and evidence but no GO identifier,
  except RACK1 where the broad adaptor term is used, rather than asserting a plausible-looking
  term the ontology does not support. This is a candidate for proposed new terms once the
  scaffolding roles are better characterised. (3) The oxygen-independent arm (RACK1 + SAT1) is
  marked optional: it operates on the same substrate but is not required for the oxygen switch,
  and it was defined largely through HSP90 inhibition. (4) HIF3A is modelled as a third alpha
  variant rather than as a separate inhibitory module. Its full-length product is a
  hydroxylation-regulated, ARNT-dimerising transcription factor (GO:0000981 IDA, GO:0000978
  IDA) that lacks a C-terminal transactivation domain, and its short IPAS splice variant is a
  dominant-negative that sequesters HIF-1alpha (PMID:11734856). Both readings are recorded on
  the annoton; splitting the locus into two modules would overstate how well the isoform
  repertoire is resolved. (5) HSP90, which competes with RACK1 for the PAS-A domain, is left
  out: it is a general chaperone whose involvement is shown mainly through inhibitor treatment,
  and including it would pull the HSP90 cycle into the module. The same applies to the HIF
  target-gene feedback on EGLN1 (PHD2 is itself HIF-inducible) and to the 2-oxoglutarate and
  ascorbate supply that all four dioxygenases need. (6) The Elongin B/C module is modelled as
  two explicit annotons, not folded into a complex descriptor, because both ELOB and ELOC have
  completed gene reviews whose core functions are exactly these adaptor activities, and because
  the same module serves CRL5 ligases elsewhere (see modules/reelin_signaling.yaml, whose
  CRL5(SOCS7) part omits Elongin B/C following its GO-CAM). The generic cullin-RING machinery
  is not re-modelled here: neddylation, the CAND1/CSN cycle and the proteasome itself are
  outside the boundary, and the 26S proteasome step is recorded as a process term on the ligase
  annotons rather than as a part.

  GO-CAM and GOA observations for upstream review. No production GO-CAM covers the oxygen
  sensor: gocams/index.tsv (October 2026) has no model containing VHL, HIF1AN, EGLN1, EGLN2,
  ELOB, ELOC, EPAS1, HIF3A, OS9, SAT1 or SAT2, and the two HIF1A models
  (gomodel:689e7a5d00004061, gomodel:689e7a5d00004412) use HIF1A only as the transcription
  factor downstream of COXFA4L2. This is the largest curation gap the module reveals. In GOA,
  GO:0097411 hypoxia-inducible factor-1alpha signaling pathway is carried in human, mouse and
  rat by CYBB, PDK1, PDK3, mouse Hif1a and miR-210, but by none of EGLN1-3, VHL, HIF1AN, ARNT,
  EP300 or CREBBP; EGLN1 and mouse Vhl instead carry the regulatory term GO:1902072 negative
  regulation of hypoxia-inducible factor-1alpha signaling pathway, which is the convention this
  module follows (the hydroxylase and the ligase regulate the pathway rather than being part of
  it), so no NEW pathway annotations are proposed for them here. SAT2's human GOA carries both
  enables and NOT|enables GO:0004145 by IDA from different references, which is worth an
  upstream look. Gene reviews exist for ARNT, EGLN1, ELOB, ELOC, RBX1, EP300, CREBBP, RACK1 and
  SAT1; HIF1A, EPAS1, HIF3A, ARNT2, VHL, EGLN2, EGLN3, HIF1AN, CUL2, OS9 and SAT2 have none,
  and PANTHER family ids and PTNs are deliberately not asserted.
module:
  id: hif_oxygen_sensing
  label: HIF oxygen-sensing switch
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: hypoxia-inducible factor-1alpha signaling pathway
      term:
        id: GO:0097411
        label: hypoxia-inducible factor-1alpha signaling pathway
      description: >-
        The signalling pathway mapped to PW:0000360. The GO term names HIF-1alpha, while this
        module covers all three alpha subunits; the extra coverage is recorded in the alpha
        variant set rather than by using a broader term.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          Where the prolyl hydroxylases (PHD2 is predominantly cytoplasmic) and the CRL2(VHL)
          ligase act on the alpha subunit.
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
        description: >-
          Where the stabilised alpha subunit dimerises with ARNT, binds hypoxia response
          elements and recruits p300/CBP. Both compartments are listed because the switch is
          spatially split, not because one is a refinement of the other.
  parts:
    - order: 1
      role: oxygen-dependent prolyl hydroxylation of the HIF-alpha degradation domain
      node:
        id: hif_prolyl_hydroxylation
        label: Prolyl hydroxylation of HIF-alpha by PHD1-3 (EGLN2/EGLN1/EGLN3)
        module_type: REACTION
        description: >-
          Fe(II)- and 2-oxoglutarate-dependent dioxygenases hydroxylate two prolines in the
          oxygen-dependent degradation domain of HIF-alpha (Pro402 and Pro564 of HIF-1alpha),
          consuming O2 and 2-oxoglutarate and releasing succinate and CO2. Because O2 is a
          cosubstrate with a Km near the physiological range, the rate of this reaction is the
          cell's oxygen reading. The three paralogues catalyse the same chemistry and differ in
          abundance, localisation and site preference; PHD2 (EGLN1) sets the normoxic
          steady-state level of HIF-1alpha.
        concepts:
          - preferred_term: peptidyl-proline hydroxylation to 4-hydroxy-L-proline
            term:
              id: GO:0018401
              label: peptidyl-proline hydroxylation to 4-hydroxy-L-proline
        evidence:
          - source_id: PMID:11292861
            statement: >-
              Hydroxylation of HIF-1alpha Pro564 by a prolyl hydroxylase regulates the pVHL
              interaction.
            supporting_text: Here we show that the interaction between human pVHL and a specific domain of the HIF-1alpha subunit is regulated through hydroxylation of a proline residue (HIF-1alpha P564) by an enzyme we have termed HIF-alpha prolyl-hydroxylase (HIF-PH).
          - source_id: PMID:11598268
            statement: >-
              The hydroxylases form a conserved family (the EGLN/PHD proteins) that is an
              essential component of the oxygen-sensing pathway.
            supporting_text: We identified a conserved family of HIF prolyl hydoxylase (HPH) enzymes that appear to be responsible for this posttranslational modification.
          - source_id: RHEA:48400
            statement: >-
              L-prolyl-[hypoxia-inducible factor alpha subunit] + 2-oxoglutarate + O2 =
              trans-4-hydroxy-L-prolyl-[hypoxia-inducible factor alpha subunit] + succinate +
              CO2; the Rhea xref of GO:0160082 and EC 1.14.11.29.
        variant_sets:
          - id: phd_paralog
            label: HIF prolyl hydroxylase paralogue
            axis: enzyme paralogue (PHD1/PHD2/PHD3, differing in abundance, localisation and site preference)
            selection: ONE_OR_MORE
            variants:
              - id: egln1_phd2_variant
                label: PHD2 (EGLN1) — the dominant normoxic sensor
                module_type: REACTION
                annotons:
                  - id: egln1_hif_prolyl_hydroxylase
                    label: EGLN1 (PHD2) hypoxia-inducible factor-proline dioxygenase activity
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: EGLN1 (PHD2)
                        term:
                          id: UniProtKB:Q9GZT9
                          label: Egl nine homolog 1
                    function:
                      preferred_term: hypoxia-inducible factor-proline dioxygenase activity
                      term:
                        id: GO:0160082
                        label: hypoxia-inducible factor-proline dioxygenase activity
                      substrates:
                        - preferred_term: L-prolyl-[HIF alpha subunit]
                          term:
                            id: CHEBI:50342
                            label: L-proline residue
                        - preferred_term: 2-oxoglutarate
                          term:
                            id: CHEBI:16810
                            label: 2-oxoglutarate(2-)
                        - preferred_term: O2
                          term:
                            id: CHEBI:15379
                            label: dioxygen
                      products:
                        - preferred_term: trans-4-hydroxy-L-prolyl-[HIF alpha subunit]
                          term:
                            id: CHEBI:61965
                            label: trans-4-hydroxy-L-proline residue
                        - preferred_term: succinate
                          term:
                            id: CHEBI:30031
                            label: succinate(2-)
                        - preferred_term: CO2
                          term:
                            id: CHEBI:16526
                            label: carbon dioxide
                      targets:
                        - preferred_term: HIF-1alpha
                          term:
                            id: UniProtKB:Q16665
                            label: Hypoxia-inducible factor 1-alpha
                        - preferred_term: HIF-2alpha (EPAS1)
                          term:
                            id: UniProtKB:Q99814
                            label: Endothelial PAS domain-containing protein 1
                    processes:
                      - preferred_term: negative regulation of hypoxia-inducible factor-1alpha signaling pathway
                        term:
                          id: GO:1902072
                          label: negative regulation of hypoxia-inducible factor-1alpha signaling pathway
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      The non-redundant oxygen sensor in cultured cells: silencing PHD2 alone
                      stabilises and activates HIF-1alpha in normoxia, while silencing PHD1 or
                      PHD3 does not. Its core function in the completed EGLN1 gene review is
                      this activity, with GO:1902072 as the process.
                    evidence:
                      - source_id: PMID:12912907
                        statement: PHD2 knockdown alone is sufficient to stabilise HIF-1alpha in normoxia.
                        supporting_text: Here we show that specific 'silencing' of PHD2 with short interfering RNAs is sufficient to stabilize and activate HIF-1alpha in normoxia in all the human cells investigated.
                      - source_id: PMID:12912907
                        statement: PHD1 and PHD3 knockdown has no such effect, so the paralogues are not interchangeable.
                        supporting_text: "'Silencing' of PHD1 and PHD3 has no effect on the stability of HIF-1alpha either in normoxia or upon re-oxygenation of cells briefly exposed to hypoxia."
              - id: egln2_phd1_variant
                label: PHD1 (EGLN2)
                module_type: REACTION
                annotons:
                  - id: egln2_hif_prolyl_hydroxylase
                    label: EGLN2 (PHD1) hypoxia-inducible factor-proline dioxygenase activity
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: EGLN2 (PHD1)
                        term:
                          id: UniProtKB:Q96KS0
                          label: Prolyl hydroxylase EGLN2
                    function:
                      preferred_term: hypoxia-inducible factor-proline dioxygenase activity
                      term:
                        id: GO:0160082
                        label: hypoxia-inducible factor-proline dioxygenase activity
                      targets:
                        - preferred_term: HIF-1alpha
                          term:
                            id: UniProtKB:Q16665
                            label: Hypoxia-inducible factor 1-alpha
                    locations:
                      - preferred_term: nucleus
                        term:
                          id: GO:0005634
                          label: nucleus
                    role_description: >-
                      Predominantly nuclear paralogue, oestrogen-inducible, with a preference
                      for the N-terminal degradation site. Dispensable for the normoxic
                      set-point in cultured cells.
                    evidence:
                      - source_id: PMID:11598268
                        statement: >-
                          Forced expression of an HPH family member attenuates normoxic
                          HIF-1alpha accumulation, the assay that defines the family's activity.
                        supporting_text: In cultured mammalian cells, inappropriate accumulation of HIF caused by forced expression of the HIF-1alpha subunit under normoxic conditions was attenuated by coexpression of HPH.
              - id: egln3_phd3_variant
                label: PHD3 (EGLN3)
                module_type: REACTION
                annotons:
                  - id: egln3_hif_prolyl_hydroxylase
                    label: EGLN3 (PHD3) hypoxia-inducible factor-proline dioxygenase activity
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: EGLN3 (PHD3)
                        term:
                          id: UniProtKB:Q9H6Z9
                          label: Prolyl hydroxylase EGLN3
                    function:
                      preferred_term: hypoxia-inducible factor-proline dioxygenase activity
                      term:
                        id: GO:0160082
                        label: hypoxia-inducible factor-proline dioxygenase activity
                      targets:
                        - preferred_term: HIF-1alpha
                          term:
                            id: UniProtKB:Q16665
                            label: Hypoxia-inducible factor 1-alpha
                        - preferred_term: HIF-2alpha (EPAS1)
                          term:
                            id: UniProtKB:Q99814
                            label: Endothelial PAS domain-containing protein 1
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Strongly hypoxia-inducible paralogue with a preference for the C-terminal
                      degradation site and a marked preference for HIF-2alpha; also hydroxylates
                      non-HIF substrates, which is what the only EGLN3 GO-CAM
                      (gomodel:680ad14200007201, GPX4) models.
                    evidence:
                      - source_id: PMID:11598268
                        statement: >-
                          The family was defined by the ability of its members to oppose normoxic
                          HIF accumulation, and loss of the fly orthologue derepresses a
                          hypoxia-inducible gene.
                        supporting_text: Suppression of HPH in cultured Drosophila melanogaster cells by RNA interference resulted in elevated expression of a hypoxia-inducible gene (LDH, encoding lactate dehydrogenase) under normoxic conditions.
    - order: 2
      role: scaffolding that promotes hydroxylation (oxygen-independent)
      optional: true
      node:
        id: os9_hydroxylation_scaffold
        label: OS-9 scaffolding of HIF-1alpha with the prolyl hydroxylases
        module_type: REGULATORY_STEP
        description: >-
          OS-9 binds both HIF-1alpha and the prolyl hydroxylases and raises the efficiency of
