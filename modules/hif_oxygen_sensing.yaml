            statement: The hydroxyproline inserts into a gap in the pVHL hydrophobic core that is a tumour-mutation hotspot.
            supporting_text: The hydroxyproline inserts into a gap in the pVHL hydrophobic core, at a site that is a hotspot for tumorigenic mutations, with its 4-hydroxyl group recognized by buried serine and histidine residues.
