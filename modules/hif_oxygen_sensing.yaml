                term:
                  id: GO:1902072
                  label: negative regulation of hypoxia-inducible factor-1alpha signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              The transactivation-domain oxygen sensor. Unlike the prolyl hydroxylases it does
              not change the alpha subunit's abundance, only its ability to recruit
              coactivators; it also carries a transcription corepressor activity annotation
              (GO:0003714, IDA) consistent with that role.
            evidence:
              - source_id: PMID:11823643
