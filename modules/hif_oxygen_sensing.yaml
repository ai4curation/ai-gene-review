    - order: 8
      role: oxygen-independent HIF-1alpha turnover (RACK1 route)
      optional: true
      node:
        id: oxygen_independent_turnover
        label: RACK1/SSAT1-dependent, VHL-independent ubiquitination of HIF-1alpha
        module_type: REGULATORY_STEP
        description: >-
          A second route to the same Elongin B/C ligase does not read hydroxyproline at all.
          RACK1 competes with HSP90 for the PAS-A domain of HIF-1alpha and, when bound, recruits
          the Elongin C ubiquitin-ligase complex, so HIF-1alpha is degraded independently of
          oxygen, of the prolyl hydroxylases and of VHL. SSAT1 stabilises the HIF-1alpha-RACK1
          interaction, mirroring what its paralogue SSAT2 does for VHL-Elongin C. Marked
          optional: this arm modulates the set-point but is not required for the oxygen switch,
          and much of the evidence comes from HSP90 inhibition.
        annotons:
          - id: rack1_eloc_adaptor
            label: RACK1 adaptor recruiting Elongin C to HIF-1alpha
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: RACK1
                term:
                  id: UniProtKB:P63244
                  label: Small ribosomal subunit protein RACK1
            function:
              preferred_term: molecular adaptor activity
              term:
                id: GO:0060090
                label: molecular adaptor activity
              targets:
                - preferred_term: HIF-1alpha
                  term:
                    id: UniProtKB:Q16665
                    label: Hypoxia-inducible factor 1-alpha
                - preferred_term: ELOC
                  term:
                    id: UniProtKB:Q15369
                    label: Elongin-C
            processes:
              - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
                term:
                  id: GO:0043161
                  label: proteasome-mediated ubiquitin-dependent protein catabolic process
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Functional analogue of VHL on this route: it occupies the substrate-receptor
              position without recognising a hydroxyproline, and its Elongin C-binding site
              resembles VHL's. The broad GO:0060090 molecular adaptor activity is the only term
              that fits; it is a core function of the completed RACK1 review, which already
              records HIF1A as a degradation client. RACK1's main cellular role is ribosomal,
              so this is a peripheral activity for the protein but a real part of this module.
            evidence:
              - source_id: PMID:17244529
                statement: RACK1 binds Elongin C and promotes HIF-1alpha ubiquitination.
                supporting_text: RACK1 binds to Elongin-C and promotes ubiquitination of HIF-1alpha.
              - source_id: PMID:17244529
                statement: >-
                  The route is independent of oxygen, the prolyl hydroxylases and VHL, and works
                  by competition with HSP90 for the PAS-A domain.
                supporting_text: Thus, RACK1 is an essential component of an O(2)/PHD/VHL-independent mechanism for regulating HIF-1alpha stability through competition with HSP90 and recruitment of the Elongin-C/B ubiquitin ligase complex.
          - id: sat1_rack1_stabiliser
            label: SSAT1 (SAT1) stabiliser of the HIF-1alpha-RACK1 interaction
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SAT1 (SSAT1)
                term:
                  id: UniProtKB:P21673
                  label: Diamine acetyltransferase 1
            function:
              preferred_term: HIF-1alpha-RACK1 interaction stabiliser (no GO molecular function term)
              description: >-
                No GO molecular function describes this role; SAT1's annotated and reviewed core
                activity is GO:0004145 diamine N-acetyltransferase activity in polyamine
                catabolism, a different activity. No identifier is asserted.
              targets:
                - preferred_term: HIF-1alpha
                  term:
                    id: UniProtKB:Q16665
                    label: Hypoxia-inducible factor 1-alpha
                - preferred_term: RACK1
                  term:
                    id: UniProtKB:P63244
                    label: Small ribosomal subunit protein RACK1
            role_description: >-
              Paralogue-mirrored accessory role: SSAT1 serves the oxygen-independent route as
              SSAT2 serves the oxygen-dependent one.
            evidence:
              - source_id: PMID:17875644
                statement: SSAT1 binds HIF-1alpha and promotes its degradation by stabilising the HIF-1alpha-RACK1 interaction.
                supporting_text: However, in contrast to SSAT2, SSAT1 acts by stabilizing the interaction of HIF-1alpha with RACK1.
              - source_id: PMID:17875644
                statement: The two paralogues are complementary, one oxygen-independent and one oxygen-dependent.
                supporting_text: Thus, the paralogs SSAT1 and SSAT2 play complementary roles in promoting O(2)-independent and O(2)-dependent degradation of HIF-1alpha.
  connections:
    - source: hif_prolyl_hydroxylation
      target: crl2_vhl_degradation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        trans-4-Hydroxyproline in the oxygen-dependent degradation domain is the mark that pVHL
        reads; without it the ligase does not engage the alpha subunit.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        The intermediate is a modified protein residue, not a CoA thioester, so the CoA
        continuity check does not apply. The continuity that matters here is
        trans-4-hydroxy-L-proline residue (CHEBI:61965), the product of RHEA:48400 and the
        ligand of the pVHL hydroxyproline pocket.
    - source: os9_hydroxylation_scaffold
      target: hif_prolyl_hydroxylation
      connection_type: POSITIVELY_REGULATES
      description: OS-9 brings the substrate and the hydroxylases together, raising hydroxylation efficiency.
    - source: sat2_vhl_stabilisation
      target: crl2_vhl_degradation
      connection_type: POSITIVELY_REGULATES
      description: SSAT2 stabilises the VHL-Elongin C interaction and so the assembled ligase.
    - source: crl2_vhl_degradation
      target: hif_dimerisation
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Polyubiquitination and proteasomal destruction of the alpha subunit prevent dimer
        formation; this is the normoxic off-state of the pathway.
    - source: hif_dimerisation
      target: coactivator_recruitment
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The DNA-bound heterodimer presents the C-terminal transactivation domain that p300/CBP
        bind.
    - source: fih_asparaginyl_hydroxylation
      target: coactivator_recruitment
      connection_type: NEGATIVELY_REGULATES
      description: >-
        3-Hydroxyasparagine in the C-TAD blocks the CH1 interaction, silencing the alpha subunit
        that escaped degradation. This is the second, independent oxygen-sensing arm.
    - source: oxygen_independent_turnover
      target: hif_dimerisation
      connection_type: NEGATIVELY_REGULATES
      description: >-
        RACK1/SSAT1-driven ubiquitination lowers HIF-1alpha levels without reading oxygen,
        setting the amount of alpha subunit available in either condition.
knowledge_gaps:
  - gap_statement: >-
      What the HIF3A locus does physiologically is unresolved. Its products range from a
      full-length ARNT-dimerising factor without a C-terminal transactivation domain to the
      dominant-negative IPAS, the splice repertoire and its tissue distribution are incompletely
      mapped, and no target-gene programme has been established for the activating form.
    boundary: >-
      HIF3A is modelled as a third variant of the alpha subunit in hif_alpha_subunit, carrying
      both the weak-activator and the dominant-negative readings on one annoton, rather than as
      a separate inhibitory module.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Whether HIF-3alpha is mainly a weak activator, a decoy that titrates ARNT away from
      HIF-1alpha and HIF-2alpha, or both in different tissues decides whether the module's alpha
      variant set is three parallel activators or two activators plus a competitive inhibitor,
      which changes the predicted dose-response of the whole switch.
    resolution: >-
      Isoform-resolved knock-ins at the Hif3a locus (full-length versus IPAS-only versus null)
      with matched ChIP-seq and RNA-seq in a tissue that expresses both, plus quantification of
      ARNT occupancy by each alpha subunit.
    provenance:
      - reference_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000360.yaml
        supporting_text: "the 3alpha gene is not well characterized - a splice variant appears to exert inhibitory roles"
  - gap_statement: >-
      How much of the hypoxic transcriptional response runs through ARNT2 rather than ARNT is
      unknown. ARNT2 dimerises with HIF-1alpha and binds DNA in assays and is expressed in brain
      and kidney, but no study has measured the HIF target-gene programme in ARNT2-null tissue
      with ARNT intact.
    boundary: >-
      ARNT2 is modelled as an alternative beta-subunit variant with the same
      heterodimerization activity as ARNT, not as a tissue-restricted replacement for it.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      If ARNT2 carries a substantial share of the response in brain or kidney, the beta variant
      set is a genuine either/or in those tissues rather than a redundancy, and ARNT-targeted
      perturbations would under-report the hypoxic response there.
    resolution: >-
      Conditional Arnt2 deletion with Arnt intact (and the reciprocal) in brain and kidney,
      scoring canonical HIF targets under graded hypoxia, with subunit-resolved ChIP.
    provenance:
      - reference_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000360.yaml
        supporting_text: "A second beta subunit Arnt2 has been identified with possibly overlapping functions."
  - gap_statement: >-
      The molecular activities of the four oxygen-independent regulators (OS-9, SSAT1, SSAT2 and
      RACK1 in this role) are described only as interactions. Whether any of them changes the
      catalytic parameters of the hydroxylases or only the local concentration of substrate and
      enzyme, whether the acetyltransferase activity of SSAT1/SSAT2 is needed at all for their
      effect on HIF-1alpha, and what their stoichiometry in the complexes is are all open.
    boundary: >-
      These four are modelled as regulatory parts whose annotons carry a preferred_term and
      evidence but, except for RACK1's broad molecular adaptor activity, no GO molecular
      function identifier.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Until the activity is defined, no GO molecular function can be asserted for these proteins
      in this pathway, and it cannot be said whether they are catalytic accessories, scaffolds
      or stoichiometric subunits of the ligase and sensor complexes.
    resolution: >-
      Reconstituted hydroxylation and ubiquitination kinetics with and without each regulator,
      using catalytically dead SSAT1/SSAT2 point mutants to separate the acetyltransferase
      activity from the scaffolding role, plus quantitative native mass spectrometry of the
      assembled complexes.
  - gap_statement: >-
      The division of labour between PHD1, PHD2 and PHD3 in vivo is only partly understood.
      Knockdown shows PHD2 sets the normoxic HIF-1alpha level in cultured cells, but the
      site-, substrate- and tissue-preferences that make PHD1 and PHD3 non-redundant in whole
      animals, and the Km values for O2 that would say which of them reports graded hypoxia at
      physiological tensions, are not established.
    boundary: >-
      The three paralogues are modelled as a ONE_OR_MORE variant set over the same reaction
      (GO:0160082, RHEA:48400), with their differences recorded in role descriptions rather than
      as separate steps.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Which paralogue is the physiological oxygen sensor at a given tension determines whether
      the module behaves as one graded sensor or as a set of sensors with different thresholds,
      and it is the basis on which PHD inhibitors used for renal anaemia are judged selective.
    resolution: >-
      Steady-state kinetics of all three enzymes against both degradation-domain peptides across
      the physiological O2 range, with tissue-specific single and compound knockouts scored for
      HIF-1alpha and HIF-2alpha stabilisation.
    provenance:
      - reference_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000360.yaml
        supporting_text: "Of the three modifying prolyl hydrolases, Egln1 known as Phd2 appears to be essential for the hypoxic response."
