    - order: 4
      role: dissolution of the contact and sealing of the phagophore
      node:
        id: attachment_site_disassembly
        label: Disassembly of the phagophore attachment site
        module_type: REGULATORY_STEP
        description: >-
          The site is obligatorily transient. Two events dismantle it. First, the
          ER-isolation membrane contact must be actively dissolved: VMP1 promotes
          SERCA activity and thereby limits contact formation, and cells lacking
          VMP1 accumulate isolation membranes stably stuck to the ER with
          autophagosome formation blocked. Second, ESCRT-III-mediated abscission
          at the rim seals the phagophore into a closed double-membrane
          autophagosome, removing the open edge on which the bridging machinery
          acts. Whether the bridging proteins leave before, during, or after
          sealing is not established (see knowledge gaps).
