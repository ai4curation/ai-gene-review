id: MODULE:phagophore_attachment_site
title: Phagophore attachment site (phagophore-organelle membrane contact site)
description: >-
  The phagophore attachment site is the zone of apposition through which a
  growing phagophore (isolation membrane) is physically held against a donor or
  anchor organelle while the autophagosome is built. Canonically this is the
  phagophore-endoplasmic reticulum membrane contact site: a bridging assembly in
  which an ATG2-family rod spans the ~10-20 nm gap between the ER and the
  phagophore rim, an Atg18/WIPI4-family beta-propeller clamps the ATG2 tip onto
  phosphatidylinositol 3-phosphate (PI3P) on the phagophore, and lipid
  scramblases work on both sides - VMP1 and TMEM41B in the donor ER membrane, and
  the ATG9 trimer at the phagophore rim - so that glycerophospholipids delivered
  by ATG2 into one leaflet are equilibrated across the bilayer. The site is
  nucleated by the Atg1/ULK1 kinase complex together with class III PI3K-derived
  PI3P, operates as a lipid conduit that drives phagophore expansion, and is
  taken apart when contacts are dissolved and the phagophore is sealed. Related
  attachment sites use the same bridging logic with a different partner
  organelle: PI3P-rich endosomes can serve as an alternative ATG2 lipid donor,
  and in budding yeast Vac8 anchors the phagophore assembly site to the vacuole,
  giving a positional rather than lipid-donating attachment. This module models
  the site as a cellular component with an assembly step, a composition, a lipid
  flux function, and a disassembly step.
status: DRAFT
scope: CONCRETE
