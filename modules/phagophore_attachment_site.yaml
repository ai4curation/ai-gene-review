                term:
                  id: GO:0000045
                  label: autophagosome assembly
            role_description: >-
              AAA-ATPase that remodels and disassembles the ESCRT-III polymer;
              its inhibition impairs autophagosome completion.
            evidence:
              - source_id: PMID:30030437
                statement: Inhibiting VPS4 ATPase activity impairs autophagosome completion.
                supporting_text: >-
                  Consistently, inhibition of the AAA-ATPase VPS4 activity
                  impairs autophagosome completion.
  variant_sets:
    - id: attachment_partner
      label: Partner organelle and attachment mode
      axis: partner organelle / taxon
      selection: ONE_OR_MORE
      notes: >-
        The first two variants are lipid-donating contacts built on the same
        ATG2 bridge; the third is a positional anchor that supplies no lipid and
        uses an entirely different tether. They are alternatives in the sense of
        which partner a given phagophore is attached to, and can co-occur.
      variants:
        - id: er_phagophore_contact
          label: ER-phagophore contact site (canonical)
          module_type: CELLULAR_COMPONENT
          description: >-
            The default and best-characterized realization. The ER cradles the
            isolation membrane as a continuous subdomain, ATG2 bridges the gap,
            and the ER is the principal lipid donor. GO has no cellular-component
            term for this structure.
          concepts:
            - preferred_term: endoplasmic reticulum membrane
              term:
                id: GO:0005789
                label: endoplasmic reticulum membrane
          annotons:
            - id: atg2_n_terminal_er_association
              label: ATG2 N-terminal region association with the ER
              participant:
                selector_type: FAMILY
                family:
                  preferred_term: ATG2 family
                  term:
                    id: PANTHER:PTHR13190
                    label: PTHR13190
                  representative_members:
                    - preferred_term: ATG2A (human)
                      term:
                        id: UniProtKB:Q2TAZ0
                        label: Autophagy-related protein 2 homolog A
                    - preferred_term: Atg2 (S. cerevisiae)
                      term:
                        id: UniProtKB:P53855
                        label: Autophagy-related protein 2
              function:
                preferred_term: endoplasmic reticulum-organelle membrane tether activity
                term:
                  id: GO:0170009
                  label: endoplasmic reticulum-organelle membrane tether activity
              locations:
                - preferred_term: endoplasmic reticulum membrane
                  term:
                    id: GO:0005789
                    label: endoplasmic reticulum membrane
              role_description: >-
                The ER-specific half of the bridge. The N-terminal membrane-binding
                region is dispensable for targeting the Atg2-Atg18 complex to the
                PAS but is what engages the ER, so it is the feature that makes
                this variant an ER contact rather than an endosomal one.
              evidence:
                - source_id: PMID:30254161
                  statement: The N-terminal region of Atg2 associates with the ER and is required for isolation membrane formation at the PAS.
                  supporting_text: >-
                    Our data suggest that this region associates with the
                    endoplasmic reticulum (ER) and is responsible for the
                    formation of the isolation membrane at the PAS.
          evidence:
            - source_id: PMID:19898463
              statement: The ER forms a cradle encircling the isolation membrane, with the two membranes interconnected.
              supporting_text: >-
                Electron tomography revealed that the ER-IM complex appears as a
                subdomain of the ER that formed a cradle encircling the IM, and
                showed that both ER and isolation membranes are interconnected.
            - source_id: PMID:19855179
              title: 3D tomography reveals connections between the phagophore and endoplasmic reticulum.
              statement: >-
                Independent electron tomography showing direct connections
                between the phagophore and the ER. Cached abstract-only, so no
                verbatim quote is asserted.
        - id: endosome_phagophore_contact
          label: Endosome-phagophore contact site (alternative lipid donor)
          module_type: CELLULAR_COMPONENT
          description: >-
            PI3P-rich endosomes can substitute as the ATG2 lipid source. ANKFY1,
            an endosomal FYVE-domain protein, binds PI3P and ATG2A and enhances
            ATG2A-mediated transfer; its depletion phenocopies ATG2A/B loss.
            Reported by a single laboratory, so modeled as an alternative route
            rather than as core composition.
          concepts:
            - preferred_term: recycling endosome
              term:
                id: GO:0055037
                label: recycling endosome
          annotons:
            - id: ankfy1_endosome_bridge
              label: ANKFY1 recruitment of ATG2A to PI3P-rich endosomes
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: ANKFY1
                  term:
                    id: UniProtKB:Q9P2R3
                    label: Ankyrin repeat and FYVE domain-containing protein 1
              function:
                preferred_term: phosphatidylinositol-3-phosphate binding
                term:
                  id: GO:0032266
                  label: phosphatidylinositol-3-phosphate binding
              role_description: >-
                FYVE-domain endosomal protein that recruits ATG2A to endosomal
                PI3P and enhances ATG2A-mediated lipid transfer.
              evidence:
                - source_id: PMID:38622126
                  statement: ANKFY1 recruits ATG2A to PI3P-rich endosomes and promotes transfer to phagophores.
                  supporting_text: >-
                    we propose that ANKFY1 recruits ATG2A to PI3P-enriched
                    endosomes and promotes ATG2A-mediated lipid transfer from
                    endosomes to phagophores
        - id: vacuole_phagophore_anchor
          label: Vacuole-phagophore anchor (budding yeast)
          module_type: CELLULAR_COMPONENT
          description: >-
            In S. cerevisiae the PAS is always made next to the vacuole. Vac8, an
            armadillo-repeat protein of the vacuolar membrane, tethers the PAS
            through the Atg1-complex subunit Atg13 and holds it there for the
            whole of autophagosome biogenesis. This attachment is positional -
            it confines where the phagophore is built and couples formation to
            subsequent fusion - and is not a lipid-donating contact. It is the
            one attachment site with a dedicated GO term.
          concepts:
            - preferred_term: vacuole-isolation membrane contact site
              term:
                id: GO:0120095
                label: vacuole-isolation membrane contact site
          context:
            taxa:
              - preferred_term: Saccharomyces cerevisiae
                description: Demonstrated in budding yeast; no metazoan equivalent is established.
          annotons:
            - id: vac8_vacuolar_tether
              label: Vac8 vacuolar tether for the phagophore assembly site
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: Vac8 (S. cerevisiae)
                  term:
                    id: UniProtKB:P39968
                    label: Vacuolar protein 8
              function:
                preferred_term: vacuolar membrane tether for the phagophore assembly site
                description: >-
                  Armadillo-repeat tether anchoring the PAS to the vacuolar
                  membrane via Atg13. GO's tether-activity terms are all
                  ER-centric (e.g. GO:0170009), so no exact term is asserted.
                targets:
                  - preferred_term: Atg13 (S. cerevisiae)
                    term:
                      id: UniProtKB:Q06628
                      label: Autophagy-related protein 13
              locations:
                - preferred_term: vacuolar membrane
                  term:
                    id: GO:0005774
                    label: vacuolar membrane
                - preferred_term: vacuole-isolation membrane contact site
                  term:
                    id: GO:0120095
                    label: vacuole-isolation membrane contact site
              evidence:
                - source_id: PMID:31649143
                  statement: Vac8 is the vacuolar tether that anchors the PAS via Atg13 throughout autophagosome biogenesis.
                  supporting_text: >-
                    We show that Vac8 constitutes a vacuolar tether that stably
                    anchors the PAS to the vacuole throughout autophagosome
                    biogenesis via the PAS component Atg13.
                - source_id: PMID:31649143
                  statement: The Vac8-dependent connection creates a confined space for autophagosome biogenesis between ER and vacuole.
                  supporting_text: >-
                    the stable PAS-vacuole connection established by Vac8 creates
                    a confined space for autophagosome biogenesis between the ER
                    and the vacuole
  connections:
    - source: attachment_site_nucleation
      target: attachment_site_composition
      connection_type: PRECEDES
      description: >-
        PI3P written at the nucleation platform is the address that recruits the
        Atg18/WIPI propellers and, through them, the ATG2 bridge.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Not a metabolic chain; these steps are linked by protein recruitment, not
        by a shared small-molecule intermediate.
    - source: attachment_site_composition
      target: lipid_flux_through_site
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The assembled three-face architecture is what makes directional lipid
        flux possible; neither tethering nor scrambling suffices alone.
    - source: atg9_rim_scramblase
      target: atg2_tether
      connection_type: POSITIVELY_REGULATES
      description: >-
        Atg9 binding confines Atg2 to the growing phagophore extremities;
        disrupting the Atg2-Atg9 interaction gives an aberrant distribution of
        Atg2 and of ER contact sites on forming phagophores.
      evidence:
        - source_id: PMID:29848619
          statement: Atg2-Atg9 binding is required for Atg2 confinement to the phagophore rim.
          supporting_text: >-
            Its interaction with Atg9, however, is key for Atg2 confinement to
            the growing phagophore extremities and subsequent association of
            Atg18.
    - source: wipi4_atg18_clamp
      target: atg2_tether
      connection_type: POSITIVELY_REGULATES
      description: >-
        The PI3P-bound propeller stabilizes the ATG2 tip on the phagophore,
        orienting the tether and accelerating transfer.
    - source: lipid_flux_through_site
      target: attachment_site_disassembly
      connection_type: PRECEDES
      description: >-
        Expansion is followed by contact dissolution and sealing of the rim.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Temporal ordering of membrane events, not a reaction chain with a shared
        intermediate.
    - source: vmp1_serca_contact_dissolution
      target: attachment_site_composition
      connection_type: NEGATIVELY_REGULATES
      description: >-
        VMP1, acting through SERCA, limits the lifetime of the contact; without
        it isolation membranes remain stably associated with the ER.
    - source: escrt_iii_rim_sealing
      target: lipid_flux_through_site
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Sealing removes the open phagophore rim, ending lipid delivery through
        the site.
