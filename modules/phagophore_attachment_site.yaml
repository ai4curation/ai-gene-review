                statement: VMP1 loss stabilizes ER-isolation membrane contacts and blocks autophagosome formation.
                supporting_text: >-
                  Loss of VMP1 causes stable association of IMs with the ER, thus
                  blocking autophagosome formation.
              - source_id: PMID:28890335
                statement: >-
