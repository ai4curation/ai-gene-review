evidence:
  - source_id: PMID:37465355
    title: The Organization and Function of the Phagophore-ER Membrane Contact Sites.
    statement: >-
      Frames the phagophore-ER interface as a bona fide membrane contact site
      organized by the ATG9 scramblase, ATG2 lipid transfer, and Atg18/WIPI4
      beta-propeller families - the boundary this module models.
    supporting_text: >-
      The phagophore establishes membrane-contact sites (MCSs) with the
      endoplasmic reticulum (ER)
  - source_id: PMID:19898463
    title: A subdomain of the endoplasmic reticulum forms a cradle for autophagosome formation.
    statement: >-
      Electron tomography establishes the attachment site morphologically: an ER
      subdomain cradles the isolation membrane and the two membranes are
      interconnected.
    supporting_text: >-
      Electron tomography revealed that the ER-IM complex appears as a subdomain
      of the ER that formed a cradle encircling the IM, and showed that both ER
      and isolation membranes are interconnected.
  - source_id: PMID:18725538
    title: Autophagosome formation from membrane compartments enriched in phosphatidylinositol
      3-phosphate and dynamically connected to the endoplasmic reticulum.
    statement: >-
      Defines the PI3P-enriched, ER-connected omegasome as the platform on which
      the attachment site and the phagophore form.
    supporting_text: >-
      provides a membrane platform for accumulation of autophagosomal proteins,
      expansion of autophagosomal membranes, and emergence of fully formed
      autophagosomes
notes: >-
  Boundary decisions. The module core is the bridging machinery that physically
  holds the phagophore against a partner organelle and moves lipid across that
  gap: ATG2, Atg18/WIPI4, ATG9, and the donor-membrane scramblases VMP1 and
  TMEM41B. Nucleation (Atg1/ULK1 complex, class III PI3K, PI3P, omegasome
  markers) is retained as an explicit assembly part because the site does not
  exist without it, and disassembly (VMP1/SERCA-dependent contact dissolution,
  ESCRT-III-dependent sealing) is retained because the site is inherently
  transient. Deliberately excluded as neighbouring modules: the ATG8/LC3
  conjugation cascade (ATG7, ATG3, ATG12-ATG5-ATG16L1) even though WIPI2
  recruits it at the same place and time; cargo receptors and selective-autophagy
  adaptors; ATG9 vesicle trafficking to and from the site; and autophagosome-
  lysosome/vacuole fusion.

  There is no GO cellular-component term for the ER-phagophore contact site, so
  the module node is grounded on the parent GO:0044232 organelle membrane contact
  site plus GO:0000407 phagophore assembly site; only the yeast vacuole variant
  has a dedicated term (GO:0120095). This is recorded as an ontology knowledge
  gap rather than papered over with an approximate term.

  Family-level roles carry PANTHER/PAINT ancestral nodes taken verbatim from the
  local IBD slices (PTHR13190/PTN000324023 for ATG2, PTHR13038/PTN000315580 for
  ATG9, PTHR11227/PTN000132136 for the Atg18/WIPI propellers). VMP1 and TMEM41B
  have no local PANTHER slice, so they are grounded by representative members
  only.
knowledge_gaps:
  - gap_statement: >-
      The Gene Ontology has no cellular-component term for the ER-phagophore
      membrane contact site, so the compartment in which ATG2, WIPI4, and ATG9
      act cannot be annotated as the contact site itself.
    boundary: >-
      GO models many other contact sites explicitly (GO:0044233
      mitochondria-associated endoplasmic reticulum membrane contact site,
      GO:0140268 endoplasmic reticulum-plasma membrane contact site, GO:0120095
      vacuole-isolation membrane contact site) and has both GO:0061908 phagophore
      and GO:0000407 phagophore assembly site. Only the phagophore-ER apposition
      is missing, even though it is the best-characterized attachment site.
    gap_kind:
      - ONTOLOGY
    dark_aspect: CC_DARK
    significance: >-
      Without the term, ATG2/WIPI4/ATG9 localization is annotated to the
      phagophore assembly site or to the ER membrane separately, losing the fact
      that the activity happens at the junction between them.
    resolution: >-
      Request a new GO CC term "endoplasmic reticulum-phagophore membrane contact
      site" as a child of GO:0044232, in the same pattern as GO:0120095.
    provenance:
      - reference_id: PMID:37465355
        supporting_text: >-
          The phagophore establishes membrane-contact sites (MCSs) with the
          endoplasmic reticulum (ER)
    proposed_terms:
      - proposed_name: endoplasmic reticulum-phagophore membrane contact site
        proposed_definition: >-
          A zone of apposition between the endoplasmic reticulum membrane and the
          phagophore (isolation membrane), bridged by ATG2-family lipid transfer
          proteins together with Atg18/WIPI-family PI3P effectors and ATG9
          scramblase, across which glycerophospholipids are delivered to support
          phagophore expansion.
        proposed_parent:
          id: GO:0044232
          label: organelle membrane contact site
        justification: >-
          GO already has sibling terms for other contact sites, including
          GO:0120095 for the vacuole-isolation membrane contact site, so the
          pattern exists; only the ER-phagophore apposition is missing.
  - gap_statement: >-
      How the attachment site is taken apart is not established: the trigger that
      releases ATG2, WIPI4, and ATG9 from the rim, and whether release precedes,
      accompanies, or follows ESCRT-dependent sealing, are undetermined.
    boundary: >-
      It is established that the contact must be dissolved - VMP1 loss traps
      isolation membranes stably on the ER and blocks autophagosome formation -
      and that VMP1 acts by promoting SERCA activity. What is not known is the
      order of events at the rim, or what marks a site as finished.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    significance: >-
      Disassembly is the step that converts a lipid-fed phagophore into a sealed
      autophagosome; without it, autophagic flux stalls with membranes attached
      to the ER.
    resolution: >-
      Time-resolved imaging of ATG2/WIPI4/ATG9 residence at single phagophores
      relative to a closure reporter, in wild-type versus VMP1-depleted and
      ESCRT-inhibited cells.
    provenance:
      - reference_id: PMID:28890335
        supporting_text: >-
          Loss of VMP1 causes stable association of IMs with the ER, thus
          blocking autophagosome formation.
      - reference_id: PMID:37465355
        supporting_text: >-
          phagophore-ER MCSs and their role in the phagophore expansion are not
          completely understood.
  - gap_statement: >-
      GO has no biological-process term for phagophore closure, the sealing event
      that terminates the attachment site.
    boundary: >-
      The event itself is experimentally tractable and ESCRT-III/VPS4 dependent
      (CHMP2A is a validated regulator), and GO covers the surrounding process
      with GO:0000045 autophagosome assembly, but the abscission step has no term
      of its own.
    gap_kind:
      - ONTOLOGY
      - BIOLOGY
    dark_aspect: BP_DARK
    significance: >-
      Closure regulators can currently only be annotated to the broad assembly
      term, which does not distinguish them from expansion or nucleation factors.
    resolution: >-
      Request a GO BP term "phagophore closure" as a child of GO:0000045.
    provenance:
      - reference_id: PMID:30030437
        supporting_text: >-
          The mechanism of phagophore closure remains unclear due to technical
          limitations in distinguishing unclosed and closed autophagosomal
          membranes.
    proposed_terms:
      - proposed_name: phagophore closure
        proposed_definition: >-
          The membrane abscission event by which the open rim of a phagophore is
          sealed, separating the inner and outer autophagosomal membranes and
          converting the phagophore into a closed double-membrane autophagosome.
        proposed_parent:
          id: GO:0000045
          label: autophagosome assembly
        justification: >-
          Closure is a distinct, ESCRT-III/VPS4-dependent step with its own
          validated regulators (e.g. CHMP2A); annotating them to the broad
          assembly term does not distinguish them from nucleation or expansion
          factors.
module:
  id: phagophore_attachment_site
  label: Phagophore attachment site
  module_type: CELLULAR_COMPONENT
  description: >-
    A transient bridging assembly that holds the rim of a growing phagophore
    against a partner organelle membrane. In its canonical form the partner is
    the ER and the site is a lipid conduit; the same architecture is reused with
    endosomes as an alternative lipid donor, and a related, non-donating
    attachment anchors the phagophore assembly site to the yeast vacuole.
  concepts:
    - preferred_term: organelle membrane contact site
      term:
        id: GO:0044232
        label: organelle membrane contact site
      description: >-
        Parent grounding. GO has no term for the ER-phagophore contact site
        specifically; see the ontology knowledge gap on this module.
    - preferred_term: phagophore assembly site
      term:
        id: GO:0000407
        label: phagophore assembly site
      description: >-
        The site at which the ATG machinery assembles and the phagophore forms;
        the attachment site is the interface between this structure and the
        partner organelle.
    - preferred_term: autophagosome assembly
      term:
        id: GO:0000045
        label: autophagosome assembly
      description: The process the attachment site exists to serve.
  context:
    taxa:
      - preferred_term: eukaryotes
        description: >-
          ATG2, ATG9, and the Atg18/WIPI propellers are conserved across
          eukaryotes; VMP1 and TMEM41B are conserved in the TMEM41/VMP1
          (DedA-like) superfamily, with VMP1 absent from S. cerevisiae.
    cellular_components:
      - preferred_term: phagophore
        term:
          id: GO:0061908
          label: phagophore
      - preferred_term: endoplasmic reticulum membrane
        term:
          id: GO:0005789
          label: endoplasmic reticulum membrane
        description: >-
          The canonical partner membrane. Listed rather than the whole ER because
          the contact is made by the membrane, and because the ER-side
          scramblases are integral membrane proteins.
      - preferred_term: phagophore assembly site membrane
        term:
          id: GO:0034045
          label: phagophore assembly site membrane
    conditions:
      - preferred_term: macroautophagy-inducing conditions
        term:
          id: GO:0016236
          label: macroautophagy
        description: >-
          Sites form constitutively at low frequency and are strongly induced by
          nutrient starvation and by selective-autophagy cargo.
  parts:
    - order: 1
      role: PI3P-dependent nucleation and recruitment of the attachment site
      node:
        id: attachment_site_nucleation
        label: Nucleation of the phagophore attachment site
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The Atg1/ULK1 kinase complex and the class III PI3K complex I act on an
          ER subdomain to generate a PI3P-enriched platform (the omegasome in
          mammals, the PAS in yeast). PI3P is the address that recruits the
          Atg18/WIPI beta-propellers, and through them ATG2, establishing the
          apposition between the nascent phagophore and the ER.
        concepts:
          - preferred_term: omegasome
            term:
              id: GO:1990462
              label: omegasome
            description: >-
              PI3P-enriched ER subdomain from which mammalian phagophores emerge;
              the structural context in which the attachment site is first made.
          - preferred_term: protein localization to phagophore assembly site
            term:
              id: GO:0034497
              label: protein localization to phagophore assembly site
        gocam_associations:
          - model: gomodel:6446bfcb00001774
            activity: gomodel:6446bfcb00001774/6446bfcb00001775
            title: Autophagosome assembly (Human)
            description: >-
              Curated ULK1 protein serine/threonine kinase activity occurring at
              the omegasome membrane, the initiating activity of this node.
          - model: gomodel:6446bfcb00001774
