          moves glycerophospholipids from the donor membrane into the phagophore
          faster than either tethering or scrambling could achieve alone: ATG2
          extracts lipids into its hydrophobic groove and unloads them into the
          acceptor cytosolic leaflet, and ATG9 redistributes them across the
          bilayer. Net flux drives phagophore expansion.
