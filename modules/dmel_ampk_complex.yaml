id: MODULE:dmel_ampk_complex
title: AMP-activated protein kinase complex in Drosophila melanogaster
description: >-
  AMP-activated protein kinase is a heterotrimeric energy sensor made of a catalytic alpha
  subunit, a scaffolding beta subunit with a glycogen-binding domain, and a gamma subunit
  whose CBS repeats bind AMP, ADP and ATP. Drosophila has a single gene for each subunit (AMPKalpha,
  alicorn and SNF4Agamma). When cellular energy falls, nucleotide binding to the gamma subunit
  promotes phosphorylation of the alpha activation loop by LKB1 and protects it from dephosphorylation.
  Active AMPK restores energy balance by inhibiting anabolic pathways, including TORC1 signaling
  and lipid synthesis, and promoting catabolism; in Drosophila it is also needed for epithelial
  polarity under energy stress and for normal lifespan and lipid storage.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002066
  title: 'FlyBase gene group AMPK-C: Ampk complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as ampk complex (AMPK-C); this
    module models that group.
- source_id: GO:0031588
  title: nucleotide-activated protein kinase complex
  statement: >-
    GO term grounding the module as nucleotide-activated protein kinase complex.
notes: >-
  Each subunit is encoded by a single Drosophila gene, so the complex has no subunit-isoform
  variants at the gene level. The upstream kinase Lkb1 is modelled in dmel_lkb1_strad_mo25_complex.
  FlyBase groups realized by this module: AMPK-C (FBgg0002066). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_ampk_complex.yaml; none of the member genes has a gene review yet
  unless noted.
