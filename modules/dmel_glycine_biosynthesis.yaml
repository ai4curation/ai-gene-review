id: MODULE:dmel_glycine_biosynthesis
title: Glycine biosynthesis in Drosophila melanogaster
description: >-
  Glycine can be made by two routes. From threonine, mitochondrial L-threonine 3-dehydrogenase
  (Tdh) oxidizes threonine to 2-amino-3-ketobutyrate, which 2-amino-3-ketobutyrate CoA ligase
  (Gcat) cleaves with coenzyme A into glycine and acetyl-CoA. From serine, serine hydroxymethyltransferase
  (Shmt) converts serine and tetrahydrofolate to glycine and 5,10-methylenetetrahydrofolate,
  linking glycine supply to one-carbon metabolism. Both reactions are reversible or bidirectional
  in context, so the enzymes also contribute to glycine and serine interconversion.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002176
  title: 'FlyBase gene group GLYBITH: Glycine biosynthesis'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as glycine biosynthesis (GLYBITH);
    this module models that group.
- source_id: GO:0006545
  title: glycine biosynthetic process
  statement: >-
    GO term grounding the module as glycine biosynthetic process.
notes: >-
  Boundary. The threonine route (Tdh, Gcat) and the serine route (Shmt) are alternative sources
  of glycine and are not connected to each other. Shmt is also listed in the L-carnitine biosynthesis
  module as a candidate hydroxytrimethyllysine aldolase. Enzyme functions are assigned by
  orthology. FlyBase groups realized by this module: GLYBITH (FBgg0002176). Participants were
  generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_glycine_biosynthesis.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
