id: MODULE:intestinal_sterol_absorption_and_efflux
title: Enterocyte apical sterol uptake and efflux — NPC1L1 uptake opposed by ABCG5/ABCG8 export
description: >-
  Net absorption of dietary and biliary sterols across the small intestine is set at the
  enterocyte brush-border membrane by two opposing transport activities. Niemann-Pick C1-like 1
  (NPC1L1) binds free cholesterol through its luminal N-terminal domain and takes it up into the
  cell by sterol-induced, clathrin/AP2-dependent endocytosis of NPC1L1 with cholesterol-enriched
  membrane; NPC1L1 favours cholesterol over plant sterols and is the target of the absorption
  inhibitor ezetimibe. The ATP-binding cassette heterodimer ABCG5/ABCG8 exports neutral sterols,
  especially plant sterols such as sitosterol and part of the absorbed cholesterol, from the
  apical membrane back into the lumen; the same transporter on the hepatocyte canalicular membrane
  secretes sterols into bile. The balance of uptake and efflux limits net sterol absorption and
  keeps plant sterols out of the circulation. NPC1L1 loss-of-function variants lower LDL
  cholesterol, whereas biallelic loss of ABCG5 or ABCG8 causes sitosterolaemia, with plant-sterol
  accumulation and premature atherosclerosis.
status: DRAFT
evidence:
  - source_id: GO:0030299
    title: intestinal cholesterol absorption
    statement: The module is grounded in intestinal cholesterol absorption and its negative regulation by apical sterol efflux.
  - source_id: file:human/NPC1L1/NPC1L1-ai-review.yaml
    title: NPC1L1 gene review (human)
    statement: >-
      The uptake step (UniProtKB:Q9UHC9, GO:0015485 cholesterol binding, directly involved in
      GO:0030299 and GO:0030301, apical plasma membrane) matches the completed human NPC1L1 review.
  - source_id: file:human/ABCG5/ABCG5-ai-review.yaml
    title: ABCG5 gene review (human)
    statement: >-
      ABCG5 (UniProtKB:Q9H222) contributes to GO:0034041 ABC-type sterol transporter activity as
      part of the ABCG5/ABCG8 heterodimer at the apical plasma membrane, directly involved in
      GO:0045796 negative regulation of intestinal cholesterol absorption.
  - source_id: file:human/ABCG8/ABCG8-ai-review.yaml
    title: ABCG8 gene review (human)
    statement: >-
      ABCG8 (UniProtKB:Q9H221) contributes to GO:0034041 ABC-type sterol transporter activity in
      the same heterodimer, directly involved in GO:0045796 and GO:0010949.
notes: >-
  Concrete vertebrate (human-represented) module limited to the apical membrane transport steps
  that set net sterol absorption. GO terms follow the core_functions of the completed human
  NPC1L1, ABCG5 and ABCG8 reviews; PANTHER subfamily ids and labels are from
  interpro/panther/panther.obo and match each protein's PANTHER human classification. Trafficking
  partners of NPC1L1 (NUMB, LIMA1, the myosin Vb-Rab11a-Rab11-FIP2 recycling complex, clathrin/AP2)
  are NPC1L1 cargo machinery and are named only here. Downstream intracellular steps (sterol
  transfer to the ER, esterification by SOAT2/ACAT2, packaging into chylomicrons by MTTP and
  APOB-48) have no or partial reviews and are outside this boundary; basolateral efflux to HDL by
  ABCA1 is likewise not modelled. Hepatic canalicular secretion of sterols into bile by ABCG5/ABCG8
  uses the same transporter and is mentioned in the role description rather than as a separate
  part. Human NPC1L1 is also expressed on the hepatocyte canalicular membrane, where it retrieves
  biliary cholesterol; that hepatic cycle is not modelled separately.
module:
  id: intestinal_sterol_absorption_and_efflux
  label: Enterocyte apical sterol uptake and efflux
  module_type: TRANSPORT_STEP
  concepts:
    - preferred_term: intestinal cholesterol absorption
      term:
        id: GO:0030299
        label: intestinal cholesterol absorption
      description: Uptake of dietary and biliary cholesterol by the small-intestinal epithelium.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: apical plasma membrane
        term:
          id: GO:0016324
          label: apical plasma membrane
        description: Enterocyte brush-border membrane, where both NPC1L1 and ABCG5/ABCG8 act.
  parts:
    - order: 1
      role: apical sterol uptake
      node:
        id: npc1l1_uptake
        label: NPC1L1 binds luminal cholesterol and internalizes it by sterol-induced endocytosis
        module_type: TRANSPORT_STEP
        annotons:
          - id: npc1l1_cholesterol_uptake
            label: "NPC1L1: apical cholesterol-uptake protein"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NPC1-like intracellular cholesterol transporter 1
                term:
                  id: PANTHER:PTHR45727:SF3
                  label: NPC1-LIKE INTRACELLULAR CHOLESTEROL TRANSPORTER 1
                representative_members:
                  - preferred_term: NPC1L1 (human)
                    term:
                      id: UniProtKB:Q9UHC9
                      label: NPC1-like intracellular cholesterol transporter 1
            function:
              preferred_term: cholesterol binding
              term:
                id: GO:0015485
                label: cholesterol binding
              description: >-
                The N-terminal domain binds cholesterol. GO has no current term that fits the
                uptake activity itself: GO:0015248 sterol transporter activity is obsolete, and the
                current GO:0120015 sterol transfer activity and GO:0120020 cholesterol transfer
                activity describe soluble carriers that ferry a sterol through the aqueous phase
                between membranes, whereas NPC1L1 stays in the apical membrane and moves the sterol
                through a channel inside itself. The transport role is therefore carried by the
                processes and role_description; the NPC1L1 review proposes a term for the activity.
              evidence:
                - source_id: file:human/NPC1L1/NPC1L1-ai-review.yaml
                  statement: Core function GO:0015485, directly involved in GO:0030299 and GO:0030301, apical plasma membrane
                - source_id: PMID:21602275
                  title: The N-terminal domain of NPC1L1 protein binds cholesterol and plays essential roles in cholesterol uptake.
                  statement: The NPC1L1 N-terminal domain binds cholesterol but not plant sterols.
                  supporting_text: NPC1L1-NTD specifically binds cholesterol but not plant sterols
                - source_id: PMID:18522832
                  title: The cholesterol absorption inhibitor ezetimibe acts by blocking the sterol-induced internalization of NPC1L1.
                  statement: Cholesterol enters cells with NPC1L1 by clathrin/AP2-mediated endocytosis.
                  supporting_text: cholesterol is internalized into cells with NPC1L1 through clathrin/AP2-mediated endocytosis
            processes:
              - preferred_term: intestinal cholesterol absorption
                term:
                  id: GO:0030299
                  label: intestinal cholesterol absorption
              - preferred_term: cholesterol transport
                term:
                  id: GO:0030301
                  label: cholesterol transport
            locations:
              - preferred_term: apical plasma membrane
                term:
                  id: GO:0016324
                  label: apical plasma membrane
            role_description: >-
              Required for most intestinal cholesterol absorption (NPC1L1-null mice) and the direct
              target of ezetimibe; also takes up alpha-tocopherol by the same mechanism.
    - order: 2
      role: apical sterol efflux back to the lumen (and into bile)
      node:
        id: abcg5_abcg8_efflux
        label: ABCG5/ABCG8 heterodimer exports neutral sterols from the apical membrane
        module_type: TRANSPORT_STEP
        annotons:
          - id: abcg5_abcg8_sterol_export
            label: "ABCG5/ABCG8: ATP-driven neutral sterol exporter"
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: ABCG5/ABCG8 sterol transporter heterodimer
                term:
                  id: GO:0043190
                  label: ATP-binding cassette (ABC) transporter complex
                active_units:
                  - id: abcg5_unit
                    label: ABCG5 half-transporter
                    role: Contributes a transmembrane domain and the Walker motifs of the active composite ATPase site.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: ATP-binding cassette sub-family G member 5
                        term:
                          id: PANTHER:PTHR48041:SF113
                          label: ATP-BINDING CASSETTE SUB-FAMILY G MEMBER 5
                        representative_members:
                          - preferred_term: ABCG5 (human)
                            term:
                              id: UniProtKB:Q9H222
                              label: ATP-binding cassette sub-family G member 5
                  - id: abcg8_unit
                    label: ABCG8 half-transporter
                    role: Contributes a transmembrane domain and the signature motif of the active composite ATPase site.
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: ATP-binding cassette sub-family G member 8
                        term:
                          id: PANTHER:PTHR48041:SF71
                          label: ATP-BINDING CASSETTE SUB-FAMILY G MEMBER 8
                        representative_members:
                          - preferred_term: ABCG8 (human)
                            term:
                              id: UniProtKB:Q9H221
                              label: ATP-binding cassette sub-family G member 8
            function:
              preferred_term: ABC-type sterol transporter activity
              term:
                id: GO:0034041
                label: ABC-type sterol transporter activity
              substrates:
                - preferred_term: cholesterol
                - preferred_term: plant sterols (sitosterol, campesterol)
              evidence:
                - source_id: file:human/ABCG5/ABCG5-ai-review.yaml
                  statement: ABCG5 contributes_to GO:0034041 in GO:0043190 at the apical plasma membrane
                - source_id: file:human/ABCG8/ABCG8-ai-review.yaml
                  statement: ABCG8 contributes_to GO:0034041 in GO:0043190 at the apical plasma membrane
                - source_id: PMID:12208868
                  title: Overexpression of ABCG5 and ABCG8 promotes biliary cholesterol secretion and reduces fractional absorption of dietary cholesterol.
                  statement: Raising ABCG5/ABCG8 expression halves fractional cholesterol absorption and raises biliary cholesterol.
                  supporting_text: >-
                    The fractional absorption of dietary cholesterol was reduced by about 50%, and
                    biliary cholesterol levels were increased more than fivefold.
            processes:
              - preferred_term: negative regulation of intestinal cholesterol absorption
                term:
                  id: GO:0045796
                  label: negative regulation of intestinal cholesterol absorption
              - preferred_term: negative regulation of intestinal phytosterol absorption
                term:
                  id: GO:0010949
                  label: negative regulation of intestinal phytosterol absorption
            locations:
              - preferred_term: apical plasma membrane
                term:
                  id: GO:0016324
                  label: apical plasma membrane
            role_description: >-
              Obligate heterodimer; neither half-transporter is active alone. Biallelic loss of
              either subunit causes sitosterolaemia. The same transporter on the hepatocyte
              canalicular membrane drives biliary sterol secretion.
  connections:
    - source: abcg5_abcg8_efflux
      target: npc1l1_uptake
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Apical ABCG5/ABCG8 efflux returns absorbed sterols (especially plant sterols) to the
        lumen, opposing NPC1L1-mediated uptake and lowering net sterol absorption.
