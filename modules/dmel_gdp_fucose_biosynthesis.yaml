id: MODULE:dmel_gdp_fucose_biosynthesis
title: De novo GDP-fucose biosynthesis in Drosophila melanogaster
description: >-
  GDP-L-fucose is the donor substrate for fucosyltransferases, including the O-fucosyltransferase
  that modifies Notch EGF repeats and the Golgi fucosyltransferases that fucosylate N-glycans.
  Drosophila makes it de novo from GDP-mannose in the cytosol: GDP-mannose 4,6-dehydratase
  (Gmd) forms GDP-4-keto-6-deoxymannose, and GDP-L-fucose synthase (Gmer) epimerizes and reduces
  this intermediate to GDP-L-fucose. GDP-fucose is then carried into the secretory pathway
  by two transporters, the Golgi GDP-fucose transporter (Gfr) and the endoplasmic reticulum
  transporter Efr. Loss of Gmd or of both transporters impairs Notch O-fucosylation and Notch
  signaling.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002026
  title: 'FlyBase gene group GDPFUC: De novo gdp-fucose biosynthesis'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as de novo gdp-fucose biosynthesis
    (GDPFUC); this module models that group.
- source_id: GO:0042351
  title: '''de novo'' GDP-L-fucose biosynthetic process'
  statement: >-
    GO term grounding the module as 'de novo' GDP-L-fucose biosynthetic process.
notes: >-
  Boundary. The module covers the four FlyBase members. GDP-mannose supply is modelled in
  the GDP-mannose biosynthesis module; the fucosyltransferases that consume GDP-fucose (for
  example O-fut1 and FucT6) are downstream and not parts. Drosophila is reported to lack the
  fucose salvage pathway, so the de novo route is its source of GDP-fucose. FlyBase groups
  realized by this module: GDPFUC (FBgg0002026). Participants were generated from the FlyBase
  gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_gdp_fucose_biosynthesis.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
