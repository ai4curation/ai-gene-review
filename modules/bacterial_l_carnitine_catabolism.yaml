- source_id: PMID:17910757
  title: Production of L-carnitine by secondary metabolism of bacteria.
  statement: Pseudomonas assimilation starts with carnitine oxidation; Acinetobacter trimethylamine formation
    and enterobacterial Cai-dependent conversion are different mechanisms. Rhizobium-like production strains
    illustrate that carnitine synthesis and degradation can be separated.
  supporting_text: with the concomitant formation of 3-dehydrocarnitine by an L-carnitine dehydrogenase
notes: 'The context is Pseudomonadota, with supported gamma- and alphaproteobacterial realizers, not a
  claim of universal pathway occurrence. The defined reaction boundary starts at free L-carnitine and
  ends at glycine betaine. Upstream gamma-butyrobetaine conversion, downstream GB demethylation, compatible-solute
  retention, CntAB trimethylamine production and Cai-dependent anaerobic reduction are separate mechanisms.
  The reactions themselves do not consume molecular oxygen; aerobic denotes the characterized physiological
  setting, not an oxygen substrate requirement. Anaerobic CJ25 GB production in PMID:40853000 proposes
  different downstream chemistry and does not establish this exact betainyl-CoA route.


  CaiX-CbcWV import is optional because free carnitine may be supplied by other importers or upstream
  intracellular synthesis. PAO1 CbcWV proteins have direct construct provenance, with native PA14/PAO1
  and heterologous-host assay boundaries recorded in their reviews. KT2440 transport and LcdH/CdhB chemistry
  rely on target architecture, conserved locus and characterized orthologs; the purified P. putida enzyme
  in PMID:3058208 is from IFP206. KT2440 PP_0303 is an exception to the former blanket unassayed claim:
  PMID:24240508 Data Sets 2/4 map Q88R31 to BKACE511 and record direct substrate screening. Its raw KAH
  signal lacks a recovered positive-call threshold, so possible secondary KAH activity remains unresolved;
  this neither establishes lysine metabolism nor negates its carnitine role. PANTHER BKACE or hydroxyacyl-CoA
  family membership alone is insufficient to select the exact reaction.


  For the fused Sinorhizobium realization, cloned 3D0a2 proteins were identical to Rm2011 and independently
  match the strain 1021 representative sequences. Full-length BcoEF supplies both oxidation and betainyl-CoA
  hydrolysis; isolated-domain assays and substrate channeling were not demonstrated. Its additional carnitinyl-CoA
  hydrolysis belongs upstream of this module. Rm1021 GBB-growth failure despite locus identity is retained
  as a strain-specific phenotype, not a negative carnitine-enzyme assay. The paper''s mutant set excludes
  BcoG; its role is supported by catalytic measurements, not an invented knockout.


  Broad GO parents GO:0016747 and GO:0016289 do not by themselves identify CdhC or CdhB specificity. The
  exact substrates/products, EC/Rhea reaction evidence, reviewed representatives and member-level activity
  constraints define each step. Both families are heterogeneous, and the fused thioesterase is grounded
  as an ortholog realization rather than assigning its domain an unverified PANTHER id. No complete pathway
  is inferred from a single dehydrogenase or from carnitine/GB growth alone.'
