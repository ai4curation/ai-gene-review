                    stoichiometry: "1"
                    participant:
                      selector_type: ORTHOLOG_OF
                      ortholog_of:
                        preferred_term: caiX / PA5388 (Pseudomonas aeruginosa PAO1)
                        term:
                          id: UniProtKB:Q9HTH6
                          label: ABC-type glycine betaine transport system substrate-binding domain-containing protein
