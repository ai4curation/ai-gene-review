id: MODULE:bacterial_l_carnitine_catabolism
title: Bacterial L-carnitine catabolism through 3-dehydrocarnitine
description: >-
  An aerobic bacterial pathway that converts L-carnitine to glycine betaine
  through 3-dehydrocarnitine. An NAD-dependent L-carnitine dehydrogenase forms
  3-dehydrocarnitine; a beta-keto acid cleavage enzyme (CdhC/BcoG) transfers
  the trimethylammonio-acetyl (betainyl) group to acetyl-CoA, releasing
  acetoacetate and forming betainyl-CoA; and a betainyl-CoA thioesterase
  releases glycine betaine and free CoA. The thioesterase is either a separate
  hotdog-fold protein (CdhB) or the C-terminal region of a bifunctional
  dehydrogenase-thioesterase (CdhAB/BcoE-BcoF). Where carnitine is taken up
  through an ABC importer, the CaiX substrate-binding protein confers carnitine
  selectivity on the shared CbcWV choline/betaine/carnitine core. The
  oxygenolytic CntAB route to trimethylamine, anaerobic Cai reduction to
  gamma-butyrobetaine, compatible-solute retention, acetoacetate activation,
  and downstream glycine-betaine demethylation are outside this boundary.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:19919675
    title: The ATP-binding cassette transporter Cbc (choline/betaine/carnitine) recruits multiple substrate-binding proteins with strong specificity for distinct quaternary ammonium compounds.
    statement: >-
      Establishes CbcWV as a shared core importer and CaiX as the
      carnitine-specific substrate-binding protein required for carnitine uptake
      in Pseudomonas aeruginosa and Pseudomonas syringae.
  - source_id: PMID:3058208
    title: Purification and properties of carnitine dehydrogenase from Pseudomonas putida.
    statement: Directly establishes NAD-dependent L-carnitine oxidation by a purified P. putida enzyme.
  - source_id: PMID:19406895
    title: Identification of genes required for Pseudomonas aeruginosa carnitine catabolism.
    statement: >-
      Genetic evidence establishes the PA5388-PA5384 locus, carrying the
      dehydrogenase and downstream cleavage genes, and glycine-betaine
      catabolism as required for growth on carnitine.
  - source_id: PMID:24240508
    title: Revealing the hidden functional diversity of an enzyme family.
    statement: >-
      Biochemical screening of the BKACE (DUF849) family establishes the CdhC
      reaction, and the curated UniProt records of P. aeruginosa CdhA, CdhC and
      CdhB attribute their catalytic activities to this work.
  - source_id: PMID:30670548
    title: Characterization of l-Carnitine Metabolism in Sinorhizobium meliloti.
    statement: >-
      Complete in vitro characterization of the same route in an
      alphaproteobacterium, where the dehydrogenase and betainyl-CoA thioesterase
      are fused in one bifunctional protein and BcoG performs the CdhC step; it
      reports conservation of the gene cluster in several bacterial classes.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_l_carnitine_catabolism__upa00117-deep-research-openscientist.md
    title: OpenScientist PSEPK carnitine-catabolism synthesis
    statement: >-
      Species-aware retrieval identifies the conserved PP_0301-PP_0304 locus
      around lcdH, the adjacent CbcWV core, and the remaining uncertainty in
      KT2440 transporter specificity while distinguishing alternative carnitine fates.
  - source_id: file:modules/bacterial_l_carnitine_catabolism-exemplar-verification.md
    title: UniProt accession verification for carnitine-catabolism exemplars
    statement: >-
      Records the official UniProt identities of PA5388/Q9HTH6,
      CdhC/Q9HTH7, and CdhB/Q9HTH9 and distinguishes accession identity from
      experimental functional evidence.
notes: >-
  Taxonomic scope. The route is experimentally characterized in two classes of
  Pseudomonadota: Gammaproteobacteria (P. aeruginosa CdhA/CdhC/CdhB with the
  CaiX-CbcWV importer; P. putida carnitine dehydrogenase) and
  Alphaproteobacteria (Sinorhizobium meliloti BcoE-BcoF and BcoG). Reviewed
  UniProt L-carnitine dehydrogenases from Burkholderia, Agrobacterium, Ruegeria,
  Streptomyces and Bacillales show the dehydrogenase is wider still, but the
  module context is kept at Pseudomonadota, where the downstream cleavage and
  thioesterase steps have been shown. KT2440 (Q88R30-Q88R40) remains an
  orthology exemplar: its LcdH, CdhC and CdhB candidates (Q88R32, Q88R31,
  Q88R33) are conserved-locus transfers from the characterized P. aeruginosa
  proteins and have not been assayed directly. In KT2440, Q88R40/Q88R39 form the
  shared CbcWV core and Q88R30 is the carnitine-selective CaiX component;
  Q88R38 CbcX is the choline-binding component and is not part of
  carnitine-specific uptake. Uptake is optional at this boundary: the Cbc/CaiX
  importer is the characterized Pseudomonas route, and the S. meliloti uptake
  system was not defined in PMID:30670548, and PMID:19919675 reports that Rhizobiaceae genomes lack CaiX orthologues. Family groundings. PANTHER:PTHR48075
  (SF5) also holds 3-hydroxybutyryl-CoA and 3-hydroxyadipyl-CoA dehydrogenases,
  and PTHR37418:SF2 holds BKACE enzymes with other beta-keto acid substrates,
  so both family selectors carry a required_function constraint; the family
  reviews record these subfamilies as functionally heterogeneous. The CbcW and
  CbcV families (PTHR47737, PTHR43869) are osmolyte-ABC families whose substrate
  is set by the binding protein, so the carnitine activity is assigned to the
  complex, not to these families. GO has no exact terms for the CdhC
  (EC 2.3.1.317, RHEA:47044) or CdhB (EC 3.1.2.33, RHEA:45716) activities;
  the member gene reviews carry proposed_new_terms, and the module uses the
  closest parents GO:0016747 and GO:0016289. Those parents are true of the
  measured reactions rather than ill-fitting, so the member reviews keep them in
  core_functions.molecular_function with the exact reaction in
  proposed_new_terms, rather than taking the proposed_molecular_function route
  that is reserved for activities with no adequate existing parent; when GO
  creates the two terms, the ids can be swapped in directly.
