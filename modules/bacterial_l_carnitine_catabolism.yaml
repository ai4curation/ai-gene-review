id: MODULE:bacterial_l_carnitine_catabolism
title: Bacterial L-carnitine catabolism through 3-dehydrocarnitine
description: An aerobic bacterial pathway that converts L-carnitine to glycine betaine through 3-dehydrocarnitine.
  An NAD-dependent L-carnitine dehydrogenase forms 3-dehydrocarnitine; a beta-keto acid cleavage enzyme
  (CdhC/BcoG) transfers the trimethylammonio-acetyl (betainyl) group to acetyl-CoA, releasing acetoacetate
  and forming betainyl-CoA; and a betainyl-CoA thioesterase releases glycine betaine and free CoA. The
  thioesterase is either a separate hotdog-fold protein (CdhB) or the C-terminal region of a bifunctional
  dehydrogenase-thioesterase (CdhAB/BcoE-BcoF). Where carnitine is taken up through an ABC importer, the
  CaiX substrate-binding protein confers carnitine selectivity on the shared CbcWV choline/betaine/carnitine
  core. The oxygenolytic CntAB route to trimethylamine, anaerobic Cai reduction to gamma-butyrobetaine,
  compatible-solute retention, acetoacetate activation, and downstream glycine-betaine demethylation are
  outside this boundary.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:19919675
  title: The ATP-binding cassette transporter Cbc (choline/betaine/carnitine) recruits multiple substrate-binding
    proteins with strong specificity for distinct quaternary ammonium compounds.
  statement: Establishes CbcWV as a shared core importer and CaiX as the carnitine-specific substrate-binding
    protein required for carnitine uptake in Pseudomonas aeruginosa and Pseudomonas syringae.
- source_id: PMID:3058208
  title: Purification and properties of carnitine dehydrogenase from Pseudomonas putida.
  statement: Purified P. putida IFP206 enzyme establishes NAD-dependent L-carnitine oxidation; strain
    identity does not transfer to KT2440.
- source_id: PMID:19406895
  title: Identification of genes required for Pseudomonas aeruginosa carnitine catabolism.
  statement: Genetic evidence establishes the PA5388-PA5384 locus, carrying the dehydrogenase and downstream
    cleavage genes, and glycine-betaine catabolism as required for growth on carnitine.
- source_id: PMID:24240508
  title: Revealing the hidden functional diversity of an enzyme family.
  statement: BKACE screening establishes substrate diversity. Official supplementary data directly map
    KT2440 Q88R31 to BKACE511; curated PAO1 reaction statements cite this work, but the accessible supplementary
    screen does not directly assay PAO1 BKACE529.
- source_id: PMID:30670548
  title: Characterization of l-Carnitine Metabolism in Sinorhizobium meliloti.
  statement: Complete in vitro characterization of the same route in an alphaproteobacterium, where the
    dehydrogenase and betainyl-CoA thioesterase are fused in one bifunctional protein and BcoG performs
    the CdhC step; it reports conservation of the gene cluster in several bacterial classes.
- source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_l_carnitine_catabolism__upa00117-deep-research-openscientist.md
  title: OpenScientist PSEPK carnitine-catabolism synthesis
  statement: Historical retrieval supports locus discovery and alternative-fate distinctions. Its blanket
    absence-of-KT2440-assays statement is superseded by the accession-mapped BKACE511 supplementary screen.
