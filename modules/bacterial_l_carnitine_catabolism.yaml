  title: UniProt accession verification for carnitine-catabolism exemplars
  statement: Records the official UniProt identities of PA5388/Q9HTH6, CdhC/Q9HTH7, and CdhB/Q9HTH9 and
    distinguishes accession identity from experimental functional evidence.
