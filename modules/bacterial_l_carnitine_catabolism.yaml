id: MODULE:bacterial_l_carnitine_catabolism
title: Bacterial L-carnitine catabolism through 3-dehydrocarnitine
description: >-
  A bacterial L-carnitine utilization module in which imported L-carnitine is
  oxidized to 3-dehydrocarnitine, cleaved to a betainyl-CoA intermediate, and
  converted to glycine betaine. The oxygenolytic CntAB route, anaerobic Cai
  reduction, compatible-solute retention, and downstream glycine-betaine
  demethylation are outside this boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__l_carnitine_dehydrogenation__upa00117-deep-research-openscientist.md
    title: OpenScientist review of the PSEPK L-carnitine dehydrogenation step
    statement: >-
      The species-aware report identifies PP_0301 through PP_0304 as a
      transporter-plus-catabolic locus while retaining uncertainty about the
      precise downstream chemistry.
notes: >-
  Provisional research scaffold. Exact functions, participants, reaction
  chaining, family selectors, and evidence will be rebuilt after gene-level and
  expanded module research complete.
