knowledge_gaps:
  - gap_statement: >-
      How the EGL-44/EGL-46 complex overrides a bound UNC-86/MEC-3 selector at
      touch-receptor promoters is not known: whether EGL-46 contacts DNA,
      whether the complex competes with the selector for overlapping sites or
      recruits a corepressor, and which sequence it recognises at its TRN and
      zag-1 targets.
    boundary: >-
      EGL-44 and EGL-46 bind each other directly, the complex represses TRN
      genes in FLP, and UniProt records EGL-44 binding a composite
      CAT...AAATGCAT motif with EGL-46. mec-3 expression is not affected in
      egl-44 or egl-46 mutants.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This decides how one selector pair can be read differently in two cell
      types, which is the core of the TRN versus FLP choice.
    resolution: >-
      Profile endogenous EGL-44, EGL-46 and MEC-3 binding in sorted FLP and
      TRN cells, test EGL-46 zinc fingers alone on the composite sites by
      EMSA, and screen for corepressors needed for FLP repression.
    provenance:
      - reference_id: PMID:30291162
        reference_section_type: ABSTRACT
        supporting_text: >-
          The FLP neurons fail to activate TRN genes, however, because a complex
          of two transcriptional repressors (EGL-44/EGL-46) prevents their
          expression.
  - gap_statement: >-
      The mechanism by which the guarantors (CEH-13/CEH-20, EGL-5 and ALR-1)
      raise the probability and level of mec-3 expression without activating
      it themselves is not known.
    boundary: >-
      The Hox proteins act through one Hox/Pbx site next to the UNC-86/MEC-3
      sites and need UNC-86; ALR-1 enhances mec-3 transcription only with
      UNC-86 and MEC-3. Loss of a guarantor makes commitment fail in a
      fraction of cells.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Guarantors explain how a selector reaches a reliable on state despite
      noisy expression; the same logic may apply to other terminal selectors.
    resolution: >-
      Measure mec-3 transcription bursts by live smFISH or MS2 imaging in
      ceh-13, egl-5 and alr-1 mutants, and test whether the guarantors recruit
      chromatin remodellers or Pol II cofactors to the mec-3 promoter.
    provenance:
      - reference_id: PMID:26547238
        reference_section_type: DISCUSSION
        supporting_text: >-
          How could the Hox proteins (and ALR-1) carry out their guarantor
          function?
  - gap_statement: >-
      Whether ZAG-1 represses egl-44 and egl-46 directly, and what sets the
      initial state of the ZAG-1 versus EGL-44/EGL-46 switch in the TRN and FLP
      lineages, is not known.
    boundary: >-
      ZAG-1 is expressed in the TRNs and not in FLP, prevents EGL-44/EGL-46
      expression, and does not activate TRN genes; EGL-44/EGL-46 inhibits
      ZAG-1 production.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      A bistable loop needs an initial bias; knowing it would say how lineage
      history decides between two fates that share a selector.
    resolution: >-
      Mutate candidate E-boxes in egl-44 and egl-46 regulatory regions, profile
      ZAG-1 binding, and image zag-1 and egl-44 onset in the ALM, PLM and FLP
      lineages.
    provenance:
      - reference_id: PMID:30291162
        reference_section_type: ABSTRACT
        supporting_text: >-
          ZAG-1 promotes TRN differentiation not by activating TRN genes but by
          preventing the expression of EGL-44/EGL-46.
