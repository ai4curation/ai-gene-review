id: MODULE:c_elegans_touch_receptor_neuron_terminal_selection
title: Touch receptor neuron terminal selection in Caenorhabditis elegans
description: >-
  The six gentle-touch receptor neurons (TRNs) of Caenorhabditis elegans (ALM,
  PLM, AVM and PVM) take their identity from two terminal selector
  transcription factors, the POU homeodomain protein UNC-86 and the LIM
  homeodomain protein MEC-3. UNC-86 is made first and switches mec-3
  transcription on. MEC-3 then joins UNC-86 in a heterodimer that binds
  AATGCAT-containing sites cooperatively and with higher stability than either
  protein alone. The heterodimer keeps mec-3 itself on (autoregulation) and
  activates the battery of touch-receptor genes, such as mec-4, mec-7 and
  mec-17. In mec-3 mutants the touch cells make none of their differentiated
  features. Two kinds of "guarantor" help the selector reach a stable on
  state without directing it. The Hox proteins CEH-13 (with its Pbx cofactor
  CEH-20) in ALM and EGL-5 in PLM raise the probability that UNC-86 starts
  mec-3 transcription. The Aristaless-related homeodomain factor ALR-1 forms a
  second positive feedback loop that keeps mec-3 expression high. The same
  selector pair is present in the FLP neurons, which are not touch receptors.
  There a repressor complex of the TEAD factor EGL-44 and the INSM-family zinc
  finger protein EGL-46 keeps the touch-receptor genes off. In the TRNs, the
  ZEB-family factor ZAG-1 keeps egl-44 and egl-46 off, and EGL-44/EGL-46 in
  turn represses zag-1. The two sets of repressors therefore form a bistable
  switch that settles which of the two fates a selector-expressing neuron
  takes.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:26547238
    title: Hox Proteins Act as Transcriptional Guarantors to Ensure Terminal Differentiation.
    statement: >-
      UNC-86 and MEC-3 are the terminal selectors of the TRN fate. They act as a
      heteromer that activates the TRN gene battery, and mec-3 expression is
      started by UNC-86 and then kept on by autoregulation that needs the
      heterodimer and ALR-1.
    supporting_text: >-
      This TRN fate is determined by terminal selectors UNC-86 and MEC-3, which
      form a heteromer to activate a battery of terminal differentiation genes
      required for TRN function
  - source_id: PMID:26547238
    title: Hox Proteins Act as Transcriptional Guarantors to Ensure Terminal Differentiation.
    statement: >-
      Selectors and guarantors are distinguished by their loss-of-function
      phenotypes: selector loss removes the TRN fate, guarantor loss makes fate
      commitment fail in only some cells.
    supporting_text: >-
      Null mutations in the selectors lead to a complete loss of TRN fate
      (Chalfie and Au, 1989), whereas mutations in the guarantors only cause a
      failure of fate commitment in a proportion of the cells.
  - source_id: PMID:30291162
    title: Inhibition of cell fate repressors secures the differentiation of the touch receptor neurons of Caenorhabditis elegans.
    statement: >-
      TRNs and FLP neurons share the UNC-86/MEC-3 selectors. EGL-44/EGL-46
      represses TRN genes in FLP, and ZAG-1 and EGL-44/EGL-46 repress each
      other, giving a bistable choice between the two fates.
    supporting_text: >-
      As EGL-44/EGL-46 also inhibits the production of ZAG-1, these proteins
      form a bistable, negative-feedback loop that regulates the choice between
      the two neuronal fates.
  - source_id: PMID:22087002
    title: Shared gene expression in distinct neurons expressing common selector genes.
    statement: >-
      FLP neurons express the same selector genes as the TRNs. They make low
      levels of some TRN mRNAs but no detectable TRN proteins, and they gain
      TRN traits when EGL-44/EGL-46 is lost or ALR-1 is expressed ectopically.
    supporting_text: >-
      Although the FLP neurons contain low amounts of the mRNAs for these TRN
      genes, they do not have detectable proteins.
  - source_id: file:worm/mec-3/mec-3-ai-review.yaml
    title: mec-3 gene review
    statement: >-
      Gene review grounding the MEC-3 selector role. Its core functions give
      Pol II-specific DNA-binding transcription factor activity as the
      UNC-86/MEC-3 heterodimer, in mechanoreceptor differentiation.
  - source_id: file:worm/egl-44/egl-44-ai-review.yaml
    title: egl-44 gene review
    statement: >-
      Gene review grounding the EGL-44 role in the FLP repressor complex. Its
      second core function, the YAP-1/EGL-44 Hippo effector, is outside this
      module.
  - source_id: file:worm/egl-46/egl-46-ai-review.yaml
    title: egl-46 gene review
    statement: >-
      Gene review grounding the EGL-46 role in the FLP repressor complex. Its
      EGL-44-independent activator roles in HSN, HOB and BAG are outside this
      module.
notes: >-
  Boundary. This is a concrete C. elegans module for the transcriptional
  program that gives the six TRNs their identity and keeps it. It covers four
  things: initiation of mec-3 by UNC-86, with the Hox guarantors of the
  embryonic TRNs; the UNC-86/MEC-3 selector heterodimer, split into its two
  roles (mec-3 autoregulation and activation of the TRN gene battery); the
  ALR-1 guarantor loop; and the ZAG-1 versus EGL-44/EGL-46 switch that
  restricts the TRN program to the TRNs among the neurons that express the
  selectors. The effector genes of the battery (mec-4, mec-7, mec-17, mec-2 and
  others) are named as targets of the selector, not modelled as parts. The
  Hox guarantor and ALR-1 parts are optional, because their loss lowers the
  fraction of cells that commit to the TRN fate rather than abolishing it, and
  the Hox proteins are not needed in AVM and PVM.

  Left out. (1) MEC-3 in the PVD nociceptor, where a low MEC-3 level drives
  dendrite arborization through targets such as hpo-30 and egl-46 and where
  AHR-1 raises MEC-3 to give the AVM rather than a PVD-like fate
  (PMID:23889932); MBL-1-dependent splicing and EEL-1 that tune the MEC-3 level
  (PMID:39423233, PMID:37729192). These belong with a PVD dendrite program. (2)
  The ALM versus BDU choice, in which MEC-3 binds UNC-86 and so keeps it from
  inducing the BDU program with PAG-3 (PMID:26096732). It is recorded in the
  selector role description, but PAG-3 and the BDU program are not modelled.
  (3) The LIM-domain cofactor LDB-1, which binds LIM domains and is needed for
  mec-2 activation (PMID:10993673, abstract only). No review grounds it, and
  its place in the heterodimer is not shown. (4) The heterochronic and other
  regulators that change the number of touch-receptor-like cells (lin-4,
  lin-14, sem-4; PMID:8187641, PMID:37281420), and mec-17, which is needed to
  maintain mec-3 expression in the TRNs (PMID:2576011) but encodes the
  alpha-tubulin N-acetyltransferase (UniProtKB:O45100), not a transcription
  factor. (5) All other roles of
  EGL-44 and EGL-46: HSN differentiation, Q-lineage cell-cycle exit, the male
  HOB program, PVD commissural branching, BAG gas-sensing identity, and the
  YAP-1/EGL-44 Hippo effector, which the hippo_signaling module covers. (6) A
  repression edge from EGL-44/EGL-46 to alr-1 in FLP. The egl-44 review reports
  it from a model-written summary of the full text of PMID:30291162, which is
  not open access; it is left as prose until the paper is read directly.

  Function terms. MEC-3 carries DNA-binding transcription factor activity, RNA
  polymerase II-specific (GO:0000981), as in its review, and UNC-86 the
  activator child (GO:0001228), as in its UniProt IDA annotation; the
  heterodimer as a whole is given activator activity because the two
  activation domains together make a highly potent activator (PMID:7664734).
  EGL-44 and EGL-46 follow their reviews (GO:0000981 and the repressor child
  GO:0001227). UNC-86, ALR-1, ZAG-1, CEH-13 and EGL-5 have no gene reviews and
  are grounded by their UniProtKB accessions; their function terms follow the
  existing UniProt/GOA annotations (GO:0000981 by IBA, IEA or ISS) and are
  described in each annoton. GO has no touch-receptor-neuron-specific
  differentiation term, so the module is grounded in mechanoreceptor
  differentiation (GO:0042490), the term the mec-3 review uses. WBbt ids
  (WBbt:0005237 touch receptor neuron, WBbt:0006828 FLP) are given in text
  because the WBbt prefix is not configured for label validation.

  Scope. UNC-86 is the Brn3 (POU4F) class POU factor, and vertebrate POU4F and
  LIM homeodomain factors are possible analogs in mechanosensory neurons. No
  cached evidence was assembled for a conserved POU-LIM selector pair, so the
  module is C. elegans-scoped rather than species-neutral.

  Boolean reading. Each selector role and each repressor is a variable. The
  autoregulation is stated in the mec3_autoregulation annoton, not as a
  self-loop connection, because the Boolean translator drops self-edges.
  mec-3 expression is therefore on exactly when UNC-86 is present, which
  matches the need for unc-86 both to start and to maintain mec-3
  (PMID:1361171). The Hox guarantors and ALR-1 are listed as omitted
  regulators because they raise the probability or level of mec-3
  expression, which a Boolean rule cannot express. Battery activation needs
  the heterodimer and the absence of EGL-44/EGL-46, and ZAG-1 and
  EGL-44/EGL-46 inhibit each other, giving two stable states.
module:
  id: c_elegans_touch_receptor_neuron_terminal_selection
  label: Touch receptor neuron terminal selection in C. elegans
  module_type: DEVELOPMENTAL_PROCESS
  description: >-
    UNC-86 starts mec-3 transcription, aided by Hox guarantors in the
    embryonic TRNs. The UNC-86/MEC-3 heterodimer then keeps mec-3 on, helped by
    the ALR-1 feedback loop, and activates the touch-receptor gene battery. A
    bistable switch between ZAG-1 (on in TRNs) and the EGL-44/EGL-46 repressor
    (on in FLP) confines battery activation to the TRNs.
  concepts:
    - preferred_term: touch receptor neuron differentiation
      term:
        id: GO:0042490
        label: mechanoreceptor differentiation
      description: >-
        GO has no term specific to touch receptor neurons; the module covers the
        TRN branch of mechanoreceptor differentiation in C. elegans.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    cell_types:
      - preferred_term: touch receptor neuron
        term:
          id: CL:0000200
          label: touch receptor cell
        description: >-
          WBbt:0005237 touch receptor neuron: the embryonic ALM and PLM pairs
          and the postembryonic AVM and PVM. The FLP neurons (WBbt:0006828)
          also express UNC-86 and MEC-3 and are where the EGL-44/EGL-46 arm
          acts.
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: initiation of selector expression
      node:
        id: mec3_initiation
        label: UNC-86 starts mec-3 transcription
        module_type: REGULATORY_STEP
        description: >-
          UNC-86 is expressed in the touch-cell lineages before MEC-3 and is
          needed for all mec-3 expression. On its own it binds the mec-3
          promoter and activates it in vitro, so it is the factor that first
          switches mec-3 on. It is also needed later to maintain mec-3
          expression, as the partner of MEC-3.
        annotons:
          - id: unc86_initiator
            label: UNC-86 activates mec-3 transcription
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: UNC-86
                term:
                  id: UniProtKB:P13528
                  label: Transcription factor unc-86
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
              description: >-
                As in the UniProt IDA annotation of P13528. UNC-86 has no gene
                review in this repository.
              targets:
                - preferred_term: mec-3 promoter
            processes:
              - preferred_term: positive regulation of transcription by RNA polymerase II
                term:
                  id: GO:0045944
                  label: positive regulation of transcription by RNA polymerase II
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              Initiator. UNC-86 alone binds and activates the mec-3 promoter and
              so produces the MEC-3 that the heterodimer needs.
            evidence:
              - source_id: PMID:7664734
                title: Synergistic activation of transcription by UNC-86 and MEC-3 in Caenorhabditis elegans embryo extracts.
                statement: UNC-86 alone activates the mec-3 promoter in vitro.
                supporting_text: >-
                  Whereas the POU homeodomain protein, UNC-86, alone was able to
                  activate transcription of the mec-3 promoter in vitro
              - source_id: PMID:2576011
                title: The mec-3 gene of Caenorhabditis elegans requires its own product for maintained expression and is expressed in three neuronal cell types.
                statement: unc-86 is needed for all mec-3 reporter expression.
                supporting_text: >-
                  unc-86, another homeo-box-containing gene, is necessary for all
                  mec-3-lacZ expression
              - source_id: PMID:1361171
                title: Regulation of the mec-3 gene by the C.elegans homeoproteins UNC-86 and MEC-3.
                statement: unc-86 is needed both to start and to maintain mec-3 expression.
                supporting_text: >-
                  the unc-86 gene appears to be required not only to initiate
                  mec-3 expression but also to maintain it.
              - source_id: UniProtKB:P13528
                title: UniProtKB P13528 (UNC86_CAEEL)
                statement: >-
                  Curated FUNCTION text (ECO:0000269, PMID:1361171 and
                  PMID:9735371): UNC-86 binds alone and with MEC-3 to the mec-3
                  promoter to start and maintain mec-3 expression.
        parts:
          - order: 1
            role: Hox guarantors of mec-3 initiation in the embryonic TRNs
            optional: true
            node:
              id: hox_guarantors
              label: Hox guarantors of mec-3 initiation
              module_type: REGULATORY_STEP
              description: >-
                Hox proteins act as transcriptional guarantors. They do not
                switch mec-3 on and cannot activate the mec-3 promoter without
                UNC-86, but through a Hox/Pbx site next to the UNC-86/MEC-3
                sites they raise the probability that UNC-86 activates it.
                Loss of either Hox gene makes about 40% of the corresponding
                TRNs fail to take the TRN fate. Neither the Hox genes nor the
                Hox/Pbx site is needed in the postembryonic AVM and PVM.
              evidence:
                - source_id: PMID:26547238
                  title: Hox Proteins Act as Transcriptional Guarantors to Ensure Terminal Differentiation.
                  statement: CEH-13 and EGL-5 raise the probability of mec-3 activation by UNC-86 through one Hox/Pbx site.
                  supporting_text: >-
                    CEH-13 and EGL-5 increase the probability of mec-3
                    transcriptional activation by the POU-homeodomain
                    transcription factor UNC-86 using the same Hox/Pbx binding
                    site.
                - source_id: PMID:26547238
                  title: Hox Proteins Act as Transcriptional Guarantors to Ensure Terminal Differentiation.
                  statement: The Hox proteins need UNC-86 to act on the mec-3 promoter.
                  supporting_text: >-
                    Without UNC-86, neither EGL-5 nor CEH-13/CEH-20 was able to
                    activate the mec-3 promoter
                - source_id: PMID:26547238
                  title: Hox Proteins Act as Transcriptional Guarantors to Ensure Terminal Differentiation.
                  statement: AVM and PVM do not need the Hox guarantors.
                  supporting_text: >-
                    neither the Hox genes nor the HP1 binding site was needed
                    for TRN identity in the postembryonic TRNs (the AVM and PVM
                    neurons)
              variant_sets:
                - id: hox_guarantor_by_position
                  label: Position-specific Hox guarantor
                  axis: anterior-posterior position of the embryonic TRN
                  variant_kind: REALIZER
                  selection: ONE_OR_MORE
                  variants:
                    - id: alm_ceh13
                      label: CEH-13 with CEH-20 in ALM
                      module_type: REGULATORY_STEP
                      annotons:
                        - id: ceh13_guarantor
                          label: CEH-13 Hox guarantor in ALM
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: CEH-13
                              term:
                                id: UniProtKB:P17488
                                label: Homeobox protein ceh-13
                          function:
                            preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
                            term:
                              id: GO:0000981
                              label: DNA-binding transcription factor activity, RNA polymerase II-specific
                            description: >-
                              Follows the existing IEA (InterPro) annotation of
                              P17488. CEH-13 acts with the Pbx cofactor CEH-20
                              through the Hox/Pbx site and does not activate the
                              mec-3 promoter by itself.
                            targets:
                              - preferred_term: mec-3 promoter (Hox/Pbx site HP1)
                          processes:
                            - preferred_term: positive regulation of transcription by RNA polymerase II
                              term:
                                id: GO:0045944
                                label: positive regulation of transcription by RNA polymerase II
                          role_description: >-
                            Anterior guarantor. With CEH-20 it secures mec-3
                            initiation in the ALM neurons.
                          evidence:
                            - source_id: PMID:26547238
                              title: Hox Proteins Act as Transcriptional Guarantors to Ensure Terminal Differentiation.
                              statement: CEH-13 and CEH-20 promote the TRN fate in ALM; EGL-5 acts in PLM.
                              supporting_text: >-
                                the anterior Hox protein CEH-13 and its cofactor
                                CEH-20 promote the TRN fate in ALM neurons, whereas
                                the posterior Hox protein EGL-5 contributes to the
                                cell fate commitment in PLM neurons.
                    - id: plm_egl5
                      label: EGL-5 in PLM
                      module_type: REGULATORY_STEP
                      annotons:
                        - id: egl5_guarantor
                          label: EGL-5 Hox guarantor in PLM
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: EGL-5
                              term:
                                id: UniProtKB:P17486
                                label: Homeobox protein egl-5
                          function:
                            preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
                            term:
                              id: GO:0000981
                              label: DNA-binding transcription factor activity, RNA polymerase II-specific
                            description: >-
                              Follows the existing IBA annotation of P17486.
                              EGL-5 acts through the same Hox/Pbx site as CEH-13;
                              no Pbx partner was found for it in PLM.
                            targets:
                              - preferred_term: mec-3 promoter (Hox/Pbx site HP1)
                          processes:
                            - preferred_term: positive regulation of transcription by RNA polymerase II
                              term:
                                id: GO:0045944
                                label: positive regulation of transcription by RNA polymerase II
                          role_description: >-
                            Posterior guarantor. It secures mec-3 initiation in
                            the PLM neurons.
                          evidence:
                            - source_id: PMID:26547238
                              title: Hox Proteins Act as Transcriptional Guarantors to Ensure Terminal Differentiation.
                              statement: No Pbx partner of EGL-5 was found in PLM.
                              supporting_text: >-
                                We were not able, however, to identify a
                                counterpart of CEH-20 in the PLM for EGL-5.
    - order: 2
      role: terminal selector heterodimer
      node:
        id: selector_heterodimer
        label: UNC-86/MEC-3 POU-LIM homeodomain selector heterodimer
        module_type: PROTEIN_COMPLEX
        description: >-
          MEC-3 binds the POU-specific domain of UNC-86. The two proteins bind
          cooperatively as a heterodimer, and heterodimer formation increases
          DNA-binding stability and specificity. In embryo extracts MEC-3 alone
          neither binds DNA nor activates transcription, while the two together
          bind cooperatively and activate synergistically. The heterodimer has
          two roles, modelled as two annotons of the same complex. At the mec-3
          promoter it keeps mec-3 on. At the promoters of the touch-receptor
          genes it activates the battery through UNC-86::MEC-3 sites built
          around the AATGCAT motif.
        annotons:
          - id: mec3_autoregulation
            label: UNC-86/MEC-3 heterodimer maintains mec-3 expression
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: UNC-86/MEC-3 heterodimer
                term:
                  id: GO:0090575
                  label: RNA polymerase II transcription regulator complex
                active_units:
                  - id: autoreg_unc86
                    label: UNC-86 POU homeodomain subunit
                    role: >-
                      DNA-binding subunit with an activation domain; its
                      POU-specific domain is the MEC-3 interface.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: UNC-86
                        term:
                          id: UniProtKB:P13528
                          label: Transcription factor unc-86
                    function:
                      preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
                      term:
                        id: GO:0001228
                        label: DNA-binding transcription activator activity, RNA polymerase II-specific
                  - id: autoreg_mec3
                    label: MEC-3 LIM homeodomain subunit
                    role: >-
                      DNA-binding partner with an activation domain; makes the
                      complex bind more stably and specifically.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MEC-3
                        term:
                          id: UniProtKB:P09088
                          label: Mechanosensory protein 3
                    function:
                      preferred_term: DNA-binding transcription factor activity, RNA polymerase II-specific
                      term:
                        id: GO:0000981
                        label: DNA-binding transcription factor activity, RNA polymerase II-specific
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
              description: >-
                Activity of the heterodimer as a whole, which carries two
                activation domains.
              targets:
                - preferred_term: mec-3 promoter (UNC-86/MEC-3 sites)
            processes:
              - preferred_term: positive regulation of transcription by RNA polymerase II
                term:
                  id: GO:0045944
                  label: positive regulation of transcription by RNA polymerase II
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            activation_logic:
              element: unc86_initiator
            omitted_regulators:
              - ceh13_guarantor
              - egl5_guarantor
              - alr1_feedback
            role_description: >-
              Autoregulation. Once UNC-86 has made enough MEC-3, the
              heterodimer keeps mec-3 transcribed in all cells that express it.
              Mutations in UNC-86 that block MEC-3 binding cause a failure to
              maintain mec-3 expression.
            evidence:
              - source_id: PMID:8103239
                title: Cooperative interactions between the Caenorhabditis elegans homeoproteins UNC-86 and MEC-3.
                statement: UNC-86 and MEC-3 bind the mec-3 promoter cooperatively as a heterodimer.
                supporting_text: >-
                  bind cooperatively as a heterodimer to the mec-3 promoter.
                  Heterodimer formation increases DNA binding stability and,
                  therefore, increases DNA binding specificity.
              - source_id: PMID:7664734
                title: Synergistic activation of transcription by UNC-86 and MEC-3 in Caenorhabditis elegans embryo extracts.
                statement: Together UNC-86 and MEC-3 bind cooperatively and activate the mec-3 promoter synergistically.
                supporting_text: >-
                  in the presence of both UNC-86 and MEC-3, we observed
                  cooperative binding to the mec-3 promoter and synergistic
                  activation of transcription in vitro
              - source_id: PMID:2576011
                title: The mec-3 gene of Caenorhabditis elegans requires its own product for maintained expression and is expressed in three neuronal cell types.
                statement: mec-3 activity is needed for maintained mec-3 expression.
                supporting_text: >-
                  mec-3 activity appears to be required for maintained
                  expression of the mec-3-lacZ fusion in all cells in which it
                  is expressed.
              - source_id: PMID:26547238
                title: Hox Proteins Act as Transcriptional Guarantors to Ensure Terminal Differentiation.
                statement: mec-3 expression is started by UNC-86 and maintained by autoregulation that needs the heterodimer and ALR-1.
                supporting_text: >-
                  mec-3 expression is initially activated by UNC-86 and later
                  maintained through autoregulation that requires both the
                  UNC-86/MEC-3 heterodimer and another transcription factor
                  ALR-1
              - source_id: PMID:10899123
                title: Protein interaction surface of the POU transcription factor UNC-86 selectively used in touch neurons.
                statement: >-
                  UNC-86 POU-domain mutations that abolish MEC-3 binding stop
                  mec-3 maintenance and mec-2 expression without affecting
                  UNC-86 targets in other neurons.
                supporting_text: >-
                  Residues P145 and L195, which are altered by these mutations,
                  are located in the POU-specific domain and abolish the physical
                  interaction of UNC-86 with the LIM homeodomain protein, MEC-3.
          - id: trn_battery_activation
            label: UNC-86/MEC-3 heterodimer activates the touch-receptor gene battery
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: UNC-86/MEC-3 heterodimer
                term:
                  id: GO:0090575
                  label: RNA polymerase II transcription regulator complex
                active_units:
                  - id: battery_unc86
                    label: UNC-86 POU homeodomain subunit
                    role: DNA-binding subunit with an activation domain.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: UNC-86
                        term:
                          id: UniProtKB:P13528
                          label: Transcription factor unc-86
                    function:
                      preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
                      term:
                        id: GO:0001228
                        label: DNA-binding transcription activator activity, RNA polymerase II-specific
                  - id: battery_mec3
                    label: MEC-3 LIM homeodomain subunit
                    role: >-
                      Modifies UNC-86 activity so that it activates
                      touch-cell-specific genes.
