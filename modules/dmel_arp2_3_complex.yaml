id: MODULE:dmel_arp2_3_complex
title: Arp2/3 complex in Drosophila melanogaster
description: >-
  The Arp2/3 complex is a seven-subunit actin nucleator that binds the side of an existing
  actin filament and starts a new filament at a 70 degree angle, producing branched actin
  networks. Two actin-related proteins, Arp2 and Arp3, form the template for the daughter
  filament, while the five ARPC subunits (ARPC1-ARPC5) hold them in place and contact the
  mother filament. The complex is intrinsically inactive and is switched on by nucleation-promoting
  factors such as SCAR/WAVE and WASp. In Drosophila, Arp2/3-driven branched actin is needed
  for lamellipodia, ring canal growth, myoblast fusion and many other processes. Drosophila
  has two ARPC3 paralogs, Arpc3A and Arpc3B, so two forms of the complex are possible.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001797
  title: 'FlyBase gene group ARPC-C: Actin-related protein 2/3 complexes'
  statement: >-
    FlyBase release FB2026_03 groups 8 D. melanogaster genes as actin-related protein 2/3
    complexes (ARPC-C); this module models that group.
- source_id: GO:0005885
  title: Arp2/3 protein complex
  statement: >-
    GO term grounding the module as Arp2/3 protein complex.
notes: >-
  FlyBase defines two complexes, ARPC3A and ARPC3B variants, that differ only in the ARPC3
  paralog; they are modelled as one complex with an EXACTLY_ONE choice at the ARPC3 position.
  Whether the two variants differ in activity or expression is not established here. Nucleation-promoting
  factors (SCAR/WAVE regulatory complex, WASp) are upstream regulators and are not parts (see
  dmel_wave_regulatory_complex). FlyBase groups realized by this module: ARPC-C (FBgg0001797).
  Subgroups folded into it: ARPC3A, ARPC3B. Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_arp2_3_complex.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
