id: MODULE:dmel_hops_corvet_tethering
title: HOPS and CORVET tethering complexes in Drosophila melanogaster
description: >-
  HOPS and CORVET are related hexameric tethering complexes of the endolysosomal system that
  share a class C Vps core of Vps11, Vps16, Vps18 and the Sec1/Munc18-family protein Vps33.
  HOPS adds Vps39 and Vps41, binds active Rab7 and promotes SNARE-dependent fusion of late
  endosomes, autophagosomes and lysosome-related organelles with lysosomes. CORVET uses Vps8
  (with Vps3 in yeast and mammals) and acts at the Rab5-positive early endosome stage. In
  Drosophila the core subunits are encoded by Vps11, Vps16A, deep orange (dor, Vps18) and
  carnation (car, Vps33A), and the HOPS-specific subunits by Vps39 and light (lt, Vps41);
  several of these were identified as eye-colour mutants with pigment granule defects. Drosophila
  also has paralogs Vps16B and Vps33B, which form a separate complex related to the mammalian
  VPS33B-VIPAS39 (CHEVI) complex.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000106
  title: 'FlyBase gene group VPS-C: Vps-c complex subunits'
  statement: >-
    FlyBase release FB2026_03 groups 9 D. melanogaster genes as vps-c complex subunits (VPS-C);
    this module models that group.
- source_id: GO:0030897
  title: HOPS complex
  statement: >-
    GO term grounding the module as HOPS complex.
- source_id: GO:0033263
  title: CORVET complex
  statement: >-
    GO term grounding the module as CORVET complex.
notes: >-
  Decomposition. The class C core, the HOPS-specific pair and the CORVET-specific Vps8 are
  modelled as parts; Drosophila has no Vps3 ortholog, and the exact subunit composition of
  Drosophila CORVET-like complexes is not modelled beyond Vps8. Vps16B and Vps33B are included
  because FlyBase groups them with the Vps-C subunits; they are modelled as a separate part
  because they do not form HOPS. Rab7, the Mon1-Ccz1 Rab7 exchange factor and the lysosomal
  SNAREs are partners, not parts. FlyBase groups realized by this module: VPS-C (FBgg0000106).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_hops_corvet_tethering.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
