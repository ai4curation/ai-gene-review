                term:
                  id: UniProtKB:P17480
                  label: Nucleolar transcription factor 1
            function:
              preferred_term: RNA polymerase I cis-regulatory region sequence-specific DNA binding
              term:
                id: GO:0001165
                label: RNA polymerase I cis-regulatory region sequence-specific DNA binding
            processes:
