id: MODULE:rna_polymerase_i_transcription
title: Human RNA polymerase I transcription of the rDNA — UBF and SL1 promoter recognition, RRN3-dependent recruitment of the 13-subunit Pol I, pre-rRNA synthesis, and TTF1/CAVIN1 (PTRF) termination and release
description: >-
  RNA polymerase I (Pol I) transcribes a single class of gene, the tandemly repeated
  ribosomal DNA (rDNA), producing the 47S precursor rRNA that is processed into the 18S,
  5.8S and 28S rRNAs. Transcription takes place in the nucleolus. The rDNA promoter is
  bipartite, with a core element around the transcription start site and an upstream
  control element. The HMG-box protein UBF binds and bends promoter and upstream DNA and
  activates transcription; the promoter-selectivity factor SL1, made of the TATA-box
  binding protein TBP and the Pol I-specific TBP-associated factors TAF1A, TAF1B, TAF1C
  and TAF1D (with TAF12), binds the core promoter and assembles with UBF into the
  preinitiation complex. RRN3 (TIF-IA) marks the initiation-competent subpopulation of
  Pol I and recruits it to the promoter by binding the SL1 subunits TAF1B and TAF1C. Pol I
  itself has 13 subunits in human: the two large catalytic subunits RPA1 (POLR1A) and RPA2
  (POLR1B), the RPAC1 and RPAC2 subunits shared with Pol III (POLR1C, POLR1D), the five
  RPABC subunits shared with Pol II and Pol III (POLR2E, POLR2F, POLR2H, POLR2K, POLR2L),
  and the Pol I-specific RPA43 stalk (POLR1F), the TFIIF-like RPA49/RPA34 heterodimer
  (POLR1E, POLR1G) and the TFIIS-like RNA cleavage subunit RPA12 (POLR1H). Downstream of
  the transcribed region, the termination factor TTF1 binds the terminator repeats and
  pauses the elongating polymerase, and CAVIN1 (PTRF) binds the U-rich 3' end of the
  nascent pre-rRNA and releases the transcript and the polymerase. Pol I output is tuned
  by nutrient and stress signalling through RRN3, SL1, UBF and the RPA49 subunit.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000126
    title: RNA polymerase I transcription pathway
    statement: >-
      The module boundary follows the RGD Pathway Ontology term and its diagram, which
      draws Ubtf with the SL1 complex, Rrn3 with SL1 and with RNA polymerase I, RNA
      polymerase I producing the pre-rRNA transcript, and Ptrf with Ttf1, together with
      elongation-associated factors (FACT, Paf1 complex, Supt4h1/Supt5h, Ncl) and
      regulators (Crebbp, Sirt1, Sirt7, mTOR, Erk and AMPK signalling). Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000126.yaml).
  - source_id: GO:0006360
    title: transcription by RNA polymerase I
    statement: >-
      The GO process mapped to PW:0000126 (skos:relatedMatch, from the PW definition
      cross-reference in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is the
      module's process concept.
  - source_id: PMID:12498690
    title: The cell cycle regulatory factor TAF1 stimulates ribosomal DNA transcription by binding to the activator UBF.
    statement: Human Pol I transcription requires UBF and SL1 assembled together on the promoter.
    supporting_text: In humans, Pol I transcription requires the upstream binding factor UBF and the selectivity factor SL1 to assemble coordinately on the promoter.
  - source_id: PMID:11250903
    title: hRRN3 is essential in the SL1-mediated recruitment of RNA Polymerase I to rRNA gene promoters.
    statement: RRN3 links initiation-competent Pol I to promoter-bound SL1.
    supporting_text: We conclude that hRRN3 functions to recruit initiation-competent Pol I to rRNA gene promoters.
  - source_id: PMID:23150253
    title: Basic mechanisms in RNA polymerase I transcription of the ribosomal RNA genes.
    statement: Review of the human Pol I transcription cycle used to set the step order of the module.
    supporting_text: Pol I-specific transcription factors guide Pol I to the rDNA promoter and contribute to multiple rounds of transcription initiation, promoter escape, elongation and termination.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000126 (RNA polymerase I transcription
  pathway) through the RGD_PATHWAY_ONTOLOGY project's diagram->module route (seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier related_module_only because
  the mapped GO term is shared with the fly module). RGD curates 37 human genes to
  PW:0000126: CAVIN1 CDC73 CREBBP CTR9 LEO1 NUCLEOLIN PAF1 POLR1A POLR1B POLR1C POLR1D
  POLR1E POLR1F POLR1G POLR1H POLR2E POLR2F POLR2H POLR2K POLR2L RRN3 RTF1 SIRT1 SIRT7
  SKIC8 SSRP1 SUPT16H SUPT4H1 SUPT5H TAF12 TAF1A TAF1B TAF1C TAF1D TBP TTF1 UBTF.
  Twenty-three are modelled as participants (UBTF; the SL1 subunits TBP, TAF1A, TAF1B,
  TAF1C, TAF1D and TAF12; RRN3; the 13 Pol I subunits; TTF1 and CAVIN1). No gene outside
  the RGD list is added. Molecular functions were taken from each protein's experimental
  GO annotations in QuickGO (November 2026); only CAVIN1 has a gene review in this
  repository, and its core function (rRNA primary transcript binding) is used. One
  function is curator-authored without an experimental human GOA row: TTF1 transcription
  termination site sequence-specific DNA binding, from the recombinant-protein binding
  and termination assays of PMID:7597036. UBF has a further IDA row for RNA polymerase I
  general transcription initiation factor activity (PMID:12498690) that is not used,
  because the annoton is typed by the DNA element it recognises. UniProt labels are the
  current recommended names (UniProt REST, November 2026); POLR1D is P0DPB6, the
  reviewed entry for RPAC2 (P0DPB5 is the separate POLR1D isoform 2 entry).

  Boundary decisions. (1) The enzyme is one complex annoton with 13 active units, as in
  modules/dmel_nuclear_rna_polymerases.yaml (the Drosophila counterpart, which models
  Pol I, II and III as three complex annotons) and as for TFIIH in the NER module.
  Only RPA1 and RPA2 carry a function; the other subunits are units without a function
  because none has an experimental molecular function in human GOA that describes its
  role in the enzyme (POLR1G and POLR2H have only RNA- and ssDNA-binding rows, POLR2L a
  zinc-binding row). A family-of-subunits descriptor was rejected because the subunits
  are not paralogues but distinct obligate parts of one enzyme. (2) Shared subunits. The
  five RPABC subunits (POLR2E, POLR2F, POLR2H, POLR2K, POLR2L) and the two RPAC subunits
  (POLR1C, POLR1D) are listed in full in both this module and
  modules/rna_polymerase_iii_transcription.yaml, with the same accessions and roles, so
  that each enzyme is complete where it is modelled. No human RNA polymerase II module
  exists, and none is created here. (3) SL1 is one complex annoton. TAF12 is included as
  a unit without a function because RGD lists it and draws it in SL1; its experimental
  functions in GOA (transcription coactivator activity, contributes to RNA polymerase II
  general transcription initiation factor activity) concern its TFIID and SAGA roles.
  TBP is shared with TFIIIB in the Pol III module and with TFIID. (4) RRN3 is its own step
  rather than a unit of the Pol I complex: it binds only the initiation-competent
  subpopulation of the enzyme (Pol I beta) and is released after initiation. (5)
  Elongation is intrinsic to the enzyme in this module. The RGD diagram also draws FACT
  (SSRP1, SUPT16H), the PAF1 complex (PAF1, CTR9, LEO1, CDC73, RTF1, SKIC8), DSIF
  (SUPT4H1, SUPT5H) and nucleolin as positively affecting pre-rRNA synthesis. These are
  excluded: they are general chromatin and elongation factors shared with Pol II
  transcription (and FACT with replication and repair), and their Pol I roles rest
  mainly on yeast genetics and on effects on elongation rate rather than on a step the
  basal machinery cannot perform. They are candidates for an optional elongation-accessory part when a human
  Pol II elongation module exists to reference. (6) Termination is modelled with TTF1
  and CAVIN1 (PTRF), both RGD genes drawn together on the diagram. The PTRF release
  activity was shown with the murine protein (PMID:9582279); the CAVIN1 gene review
  keeps the termination process and the rRNA primary transcript binding function while
  marking the human-specific IDA rows UNDECIDED, and the module follows the review. (7)
  Regulation is out of scope. CREBBP (acetylates RPA49), SIRT7 (deacetylates RPA49),
  SIRT1 (deacetylates TAF1B) and the mTOR, ERK, AMPK and p53 pathways drawn on the
  diagram (PW:0000180, PW:0000102, PW:0000542, PW:0000718) regulate Pol I output but do
  not perform a step of transcription; they are named here and in the description, not
  modelled. The same applies to the chromatin modification/remodeling pathway
  (PW:0001337), and to rRNA processing (PW:0001574) and ribosome biogenesis (PW:0001066),
  which are downstream. (8) Substrate versus participant: the rDNA template and the
  pre-rRNA product are not participants; CAVIN1 is a participant because its own
  transcript binding performs the release step.

  GO-CAM links. No production GO-CAM model in gocams/index.tsv contains RRN3, UBTF, the
  SL1 TAFs, TTF1, CAVIN1 or any Pol I subunit; TBP appears only in two Pol II models
  (ZNF76 regulation of TBP), which are not Pol I biology and are not linked. The seed's
  best_gocam, gomodel:617b481400000389 (KAT5 regulation of the cytoskeleton), overlaps
  only through SIRT1 and is unrelated, so no gocam_associations are recorded. PANTHER
  family ids and PTNs are deliberately not asserted.
