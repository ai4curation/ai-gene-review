              GOA are RNA polymerase I cis-regulatory region and core promoter
              sequence-specific DNA binding (IDA, PMID:22368283) and RNA polymerase I general
              transcription initiation factor activity (IDA, PMID:12498690); the
              cis-regulatory binding term is used because it names the upstream control
              element that distinguishes UBF from SL1.
            evidence:
              - source_id: PMID:12498690
                statement: UBF is an HMG-box factor that binds the rDNA promoter and activates Pol I transcription.
                supporting_text: UBF is an HMG box-containing factor that binds to the rDNA promoter and activates Pol I transcription through its acidic carboxy-terminal tail.
          - id: sl1_core_promoter_binding
            label: SL1 (TBP-TAF1A-TAF1B-TAF1C-TAF1D-TAF12) binds the core promoter and selects it for Pol I
            participant:
