                statement: Seven of the ten core subunits are shared with Pol II and/or Pol III.
                supporting_text: Among the 10 core subunits of the hPol I, five subunits (RPABC1, RPABC2, RPABC3, RPABC4, and RPABC5) are shared by the three RNA polymerases (Pol I, II, and III) and two subunits (RPAC1 and RPAC2) are shared by Pol I and Pol III, indicating a highly conserved catalytic core
              - source_id: PMID:36271492
                statement: Pol I-specific subunits carry TFIIF/TFIIE-like (RPA49/34) and TFIIS-like (RPA12) elements.
                supporting_text: In addition to TFIIF and TFIIE elements within the Pol I-specific subunits RPA49/34, TFIIS elements in subunit RPA12 and a DNA-mimicking element in RPA1, the integration of an HMG box element seems to contribute to the accumulating specialization.
