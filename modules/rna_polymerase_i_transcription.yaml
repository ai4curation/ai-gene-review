        module_type: BIOLOGICAL_PROCESS
        description: >-
          UBF binds the upstream control element and the core promoter as a dimer and bends
          the DNA; SL1 binds the core element. The two factors bind cooperatively and form
          the platform that RRN3-bound Pol I docks onto.
        concepts:
          - preferred_term: RNA polymerase I preinitiation complex assembly
            term:
              id: GO:0001188
              label: RNA polymerase I preinitiation complex assembly
        annotons:
          - id: ubf_promoter_binding
            label: UBF binds the rDNA upstream control element and core promoter
            participant:
              selector_type: GENE_PRODUCT
