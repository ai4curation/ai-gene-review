id: MODULE:integrated_stress_response
title: Integrated stress response
description: >-
  The integrated stress response (ISR) converts four unrelated stress signals
  into one translational and transcriptional output by phosphorylating a single
  residue. Four eIF2alpha kinases each sense a different input: HRI (EIF2AK1)
  heme deficiency, mitochondrial stress relayed by the OMA1-DELE1 pathway and
  cytosolic protein misfolding; PKR (EIF2AK2) double-stranded RNA; PERK
  (EIF2AK3) endoplasmic-reticulum folding stress; and GCN2 (EIF2AK4) amino-acid
  limitation and collided ribosomes. All four phosphorylate Ser51 of the alpha
  subunit of eIF2 (EIF2S1). Unphosphorylated eIF2 delivers initiator
  methionyl-tRNA to the ribosome and is recycled from the GDP to the GTP form by
  the decameric guanine-nucleotide exchange factor eIF2B; phosphorylated eIF2
  instead binds eIF2B in an exchange-inactive mode and inhibits it, so a
  substoichiometric phospho-eIF2 pool blocks recycling of the whole eIF2 pool.
  Reduced eIF2-GTP lowers global initiation and, because delayed reinitiation
  lets scanning ribosomes bypass an inhibitory upstream ORF, raises translation
  of ATF4, which activates cytoprotective, amino-acid and redox genes. ATF4
  drives a secondary bZIP arm (CHOP/DDIT3, ATF3) that shapes the response and,
  under severe stress, directs it toward death. ATF4 and CHOP also induce
  GADD34 (PPP1R15A), which, like the constitutive paralogue CReP (PPP1R15B),
  targets protein phosphatase 1 to phospho-eIF2alpha and closes a negative
  feedback loop that restores translation.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:27629041
    title: The integrated stress response.
    statement: >-
      The ISR is defined by phosphorylation of eIF2alpha by one of four eIF2alpha
      kinases, which lowers global protein synthesis and induces selected genes
      including ATF4.
    supporting_text: >-
      The core event in this pathway is the phosphorylation of eukaryotic
      translation initiation factor 2 alpha (eIF2α) by one of four members of
      the eIF2α kinase family, which leads to a decrease in global protein
      synthesis and the induction of selected genes, including the transcription
      factor ATF4, that together promote cellular recovery.
  - source_id: PMID:27629041
    title: The integrated stress response.
    statement: >-
      The ISR is primarily pro-survival, but severe stress drives its signalling
      toward cell death; the output depends on cellular context and stress
      intensity.
    supporting_text: >-
      Although the ISR is primarily a pro-survival, homeostatic program,
      exposure to severe stress can drive signaling toward cell death.
  - source_id: PMID:14638860
    title: Inhibition of a constitutive translation initiation factor 2alpha phosphatase, CReP, promotes survival of stressed cells.
    statement: >-
      The four kinases respond to distinct stresses - PKR to viral
      double-stranded RNA, GCN2 to uncharged tRNA, HRI to heme deficiency and
      PERK to ER client-protein overload - and converge on Ser51 of eIF2alpha.
    supporting_text: >-
      PKR (protein kinase repressor) is activated by double-stranded RNA
      produced during viral infection and plays an important role in
      translational inhibition and apoptosis of virally infected cells
      (Kaufman, 2000). But other eIF2α kinases protect cells against the impact
      of their cognate activating stress. GCN2, which responds to uncharged
      tRNAs, adapts cells to amino acid starvation (Natarajan et al., 2001;
      Zhang et al., 2002b). The heme-repressed kinase, HRI, protects developing
      erythroid precursors against the proteotoxic stress of free globin chains
      in iron-deficient vertebrates (Han et al., 2001). Whereas the ER localized
      eIF2α kinase PERK (PKR-like ER kinase), which is activated when ER
      chaperones are saturated by an excess of client proteins, protects cells
      against ER stress
  - source_id: PMID:14638860
    title: Inhibition of a constitutive translation initiation factor 2alpha phosphatase, CReP, promotes survival of stressed cells.
    statement: >-
      Ser51 phosphorylation negatively regulates eIF2B and blocks recycling of
      eIF2 to its GTP-bound form, inhibiting initiation.
    supporting_text: >-
      This signaling event, which is conserved from yeast to mammals,
      negatively regulates the guanine nucleotide exchange factor, eIF2B and
      inhibits the recycling of eIF2 to its active GTP bound form.
  - source_id: PMID:31048492
    title: Structural basis for eIF2B inhibition in integrated stress response.
    statement: >-
      Unphosphorylated and phosphorylated eIF2 bind eIF2B in exchange-active and
      exchange-inactive modes respectively, explaining dominant inhibition.
    supporting_text: >-
      The unphosphorylated and phosphorylated forms of eIF2 bind to eIF2B in
      completely different manners: the nucleotide exchange-active and
      -inactive modes, respectively. These structures explain how phosphorylated
      eIF2 dominantly inhibits the nucleotide exchange activity of eIF2B.
  - source_id: PMID:24852487
    title: eIF2B is a decameric guanine nucleotide exchange factor with a γ2ε2 tetrameric core.
    statement: >-
      eIF2B is a decamer built from two copies each of five non-identical
      subunits, assembling through the catalytic gamma and epsilon subunits.
    supporting_text: >-
      Although it is generally accepted that eIF2B is a pentamer of five
      non-identical subunits (α-ε), here we show that eIF2B is a decamer.
  - source_id: PMID:15277680
    title: Reinitiation involving upstream ORFs regulates ATF4 mRNA translation in mammalian cells.
    statement: >-
      Lower eIF2-GTP delays reinitiation so scanning ribosomes bypass the
      inhibitory uORF2 and initiate at the ATF4 coding region.
    supporting_text: >-
      During stress conditions, phosphorylation of eIF2 and the accompanying
      reduction in the levels of eIF2-GTP increase the time required for the
      scanning ribosomes to become competent to reinitiate translation. This
      delayed reinitiation allows for ribosomes to scan through the inhibitory
      uORF2 and instead reinitiate at the ATF4-coding region.
  - source_id: PMID:11381086
    title: Feedback inhibition of the unfolded protein response by GADD34-mediated dephosphorylation of eIF2alpha.
    statement: >-
      GADD34 recruits the PP1 catalytic subunit to dephosphorylate eIF2alpha,
      and its expression is stress dependent and kinase dependent.
    supporting_text: >-
      GADD34 formed a complex with the catalytic subunit of protein phosphatase
      1 (PP1c) that specifically promoted the dephosphorylation of eIF2alpha in
      vitro.
  - source_id: PMID:14638860
    title: Inhibition of a constitutive translation initiation factor 2alpha phosphatase, CReP, promotes survival of stressed cells.
    statement: >-
      CReP (PPP1R15B) is the regulatory subunit of a constitutively active
      eIF2alpha-directed holophosphatase; its knockdown activates the ISR.
    supporting_text: >-
      RNAi of this gene, which we named constitutive repressor of eIF2α
      phosphorylation (CReP, or PPP1R15B), repressed the constitutive
      eIF2α-directed phosphatase activity and activated the ISR.
  - source_id: file:genes/human/EIF2AK1/EIF2AK1-ai-review.yaml
    title: human EIF2AK1 gene review
    statement: >-
      Core functions: eukaryotic translation initiation factor 2alpha kinase
      activity and heme binding, in the cytosol.
  - source_id: file:genes/human/EIF2AK3/EIF2AK3-ai-review.yaml
    title: human EIF2AK3 gene review
    statement: >-
      Core functions: eukaryotic translation initiation factor 2alpha kinase
      activity and misfolded protein binding at the ER membrane.
  - source_id: file:genes/human/EIF2AK4/EIF2AK4-ai-review.yaml
    title: human EIF2AK4 gene review
    statement: >-
      Core functions: eukaryotic translation initiation factor 2alpha kinase
      activity and tRNA binding, in the cytosol.
  - source_id: file:genes/human/GCN1/GCN1-ai-review.yaml
    title: human GCN1 gene review
    statement: >-
      Core functions: stalled ribosome sensor activity and molecular adaptor
      activity on the cytosolic ribosome, and protein serine/threonine kinase
      activator activity in the cytosol.
  - source_id: file:genes/human/EIF2B5/EIF2B5-ai-review.yaml
    title: human EIF2B5 gene review
    statement: >-
      Core function: guanyl-nucleotide exchange factor activity in the cytosol,
      as the catalytic epsilon subunit of eIF2B.
  - source_id: file:genes/human/EIF2B1/EIF2B1-ai-review.yaml
    title: human EIF2B1 gene review
    statement: >-
      Core function: contributes to guanyl-nucleotide exchange factor activity
      within the eukaryotic translation initiation factor 2B complex.
  - source_id: file:genes/human/ATF4/ATF4-ai-review.yaml
    title: human ATF4 gene review
    statement: >-
      Core functions: DNA-binding transcription activator activity, RNA
      polymerase II-specific, and protein heterodimerization activity.
  - source_id: file:genes/human/ATF3/ATF3-ai-review.yaml
    title: human ATF3 gene review
    statement: >-
      Core functions: DNA-binding transcription factor activity, RNA polymerase
      II-specific, in the nucleus and on chromatin, and protein
      heterodimerization activity.
notes: >-
  Boundary. This module is the ISR signalling relay itself: the four eIF2alpha
  kinases, the eIF2 hub whose Ser51 phosphorylation is the core event, the
  eIF2B exchange factor that the phospho-mark inhibits, the ATF4 translational
  output with its secondary bZIP arm, and the PP1-based feedback that erases the
  mark. It has five parts and is grounded on GO:0140467 integrated stress
  response signaling. The effector genes that ATF4 and CHOP induce are
  downstream biology, not parts of the relay.

  Taxon scope. The module context is Mammalia (NCBITaxon:40674), the clade for
  which all five parts including the DELE1 relay and both PP1 targeting
  subunits are established. The eIF2alpha-phosphorylation core is far older -
  budding yeast runs it with a single kinase (Gcn2) and the bZIP factor Gcn4 in
  the ATF4 role - and the four-kinase quartet is vertebrate-wide, so the
  kinase variant set is a route set rather than a claim that every lineage has
  four inputs. Representatives are human throughout (EIF2AK1 Q9BQI3, EIF2AK2
  P19525, EIF2AK3 Q9NZJ5, EIF2AK4 Q9P2K8, GCN1 Q92616, EIF2S1 P05198, EIF2S2
  P20042, EIF2S3 P41091, EIF2B1 Q14232, EIF2B2 P49770, EIF2B3 Q9NR50, EIF2B4
  Q9UI10, EIF2B5 Q13144, ATF4 P18848, DDIT3 P35638, ATF3 P18847, PPP1R15A
  O75807, PPP1R15B Q5SWA1, PPP1CA P62136); accessions follow the gene reviews
  where one exists.

  The kinase variant set. Selection is ONE_OR_MORE, not EXACTLY_ONE: a single
  stress generally engages one kinase, but co-occurring stresses engage several,
  and GCN2 and PERK are both activated during amino-acid limitation with ER
  load. The set is declared ROUTE because the four variants differ in the
  sensed input and in the sensing module, not merely in which protein carries
  one activity; all four carry the same molecular function
  (GO:0004694), so the REALIZER inference would otherwise fire.

  Composition, not duplication. The HRI branch takes the OMA1-DELE1
  mitochondrial relay by reference from MODULE:mitochondrial_upr (nodes
  oma1_dele1_cleavage and dele1_hri_activation) rather than re-authoring the
  OMA1 and DELE1 annotons. Both referencing parts are optional: HRI is also
  activated by heme deficiency and by cytosolic protein misfolding, neither of
  which needs DELE1. The PERK branch deliberately does not use a module_ref:
  MODULE:er_unfolded_protein_response node perk_arm covers the same chemistry
  but also carries its own eIF2alpha and ATF4 annotons, so including it would
  duplicate this module's parts 2 and 4. The relationship is recorded here and
  on the PERK variant instead.

  eIF2 and the missing molecular function. GO has no molecular-function term
  for the activity of phosphorylated eIF2 toward eIF2B - the eIF2B inhibition
  that is the mechanistic core of the ISR. The hub annoton therefore records
  eIF2's ordinary translation initiation factor activity (GO:0003743) and states
  the inhibitory role in role_description and in the connection to the eIF2B
  annoton. The same tension is recorded on the worm eif-2alpha annoton of
  MODULE:er_unfolded_protein_response; it is an ontology question, not a
  knowledge gap. Human EIF2S1 has no gene review yet, so the hub annoton is
  grounded on UniProtKB:P05198 and on the GO-CAM activities listed below. GO-CAM
  curators type EIF2S1 as GO:0160296 cap-dependent translation initiation factor
  activity, a descendant of GO:0003743; this module uses the parent because eIF2
  acts in both cap-dependent and IRES-mediated initiation (both are typed on
  EIF2S1 in gomodel:6606056e00000903).

  Complexes. eIF2 (GO:0005850) and eIF2B (GO:0005851) are modelled as complex
  participants with active units, so that the subunit that carries the
  regulatory site (EIF2S1) and the subunit that carries the catalytic exchange
  activity (EIF2B5/epsilon) stay visible. The EIF2B1-EIF2B4 reviews assert
  contributes_to GO:0005085 within GO:0005851 rather than the activity itself,
  which matches the complex-level assertion used here.

  Feedback. GADD34 and CReP are variants of one role - the PP1 targeting
  subunit that dephosphorylates eIF2alpha - and the set is a REALIZER set with
  ONE_OR_MORE selection because the two are not interchangeable in time: CReP
  sets the basal phospho-eIF2alpha level in unstressed cells, while GADD34 is
  itself an ISR-induced gene and acts late. Both GO-CAM activities type them as
  molecular adaptor activity (GO:0060090) targeting PPP1CA, and that is the
  typing used here; the PP1 catalytic subunit is a separate annoton with
  GO:0004722.

  Left out. ASNS is an ATF4 target gene (PMID:11960987) and a project candidate,
  but asparagine synthase activity is an effector of the transcriptional output,
  not a step of the relay; the same holds for the chaperone, amino-acid
  transporter and redox genes. ISRIB and related eIF2B activators act on the
  same node as phospho-eIF2 but are pharmacology, not parts. The eIF2
  ternary-complex cycle with eIF5, initiator tRNA and the 40S subunit belongs to
  translation initiation. Negative regulators of individual branches are left
  out as regulation rather than steps: the SIFI (UBR4-KCMF1) complex terminates
  HRI-mediated signalling by ubiquitinating DELE1 and EIF2AK1
  (gomodel:6494e2e900001856); AKT1 and ATAD3A inhibit PERK
  (gomodel:66b5638000001719, gomodel:66b5638000001329) and BiP restrains it in
  unstressed cells (gomodel:66b5638000000739, modelled in
  MODULE:er_unfolded_protein_response); p58IPK/DNAJC3 inhibits GCN2 and PKR.
  No `activation_logic` rule is asserted anywhere in this module, so there is
  no `omitted_regulators` list either - the parts and the connections carry the
  structure.

  Related modules. MODULE:er_unfolded_protein_response (the PERK input, as the
  ER-specific arm), MODULE:mitochondrial_upr (the OMA1-DELE1-HRI input) and
  MODULE:ribosome_quality_control, which shares the collided-ribosome signal
  that activates GCN2 through GCN1 and ZAKalpha.

  GO-CAM. Six production models cover parts of this relay and are linked on the
  matching annotons: gomodel:6606056e00000903 (the complete HRI branch from
  OMA1 through ATF4 and CHOP), gomodel:66b5638000000624 (the PERK branch),
  gomodel:63d320cd00001779 and gomodel:62f58d8800000037 (GCN2 activation by GCN1
  and by ZAKalpha on collided ribosomes), gomodel:61e0e55600000407 (GADD34 and
  CReP targeting PPP1CA to eIF2alpha) and gomodel:6494e2e900001856 (SIFI-mediated
  shut-off of the HRI branch).
module:
  id: integrated_stress_response
  label: Integrated stress response
  module_type: SIGNALING_PATHWAY
  description: >-
    Four eIF2alpha kinases converge on Ser51 of eIF2alpha; phosphorylated eIF2
    inhibits its own exchange factor eIF2B, attenuating global initiation and
    raising ATF4 translation, and PP1 holoenzymes targeted by GADD34 or CReP
    reverse the mark.
  concepts:
    - preferred_term: integrated stress response signaling
      term:
        id: GO:0140467
        label: integrated stress response signaling
    - preferred_term: regulation of translational initiation by eIF2 alpha phosphorylation
      term:
        id: GO:0010998
        label: regulation of translational initiation by eIF2 alpha phosphorylation
  context:
    taxa:
      - preferred_term: Mammalia
        term:
          id: NCBITaxon:40674
          label: Mammalia
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
    conditions:
      - preferred_term: >-
          heme deficiency, mitochondrial depolarization or import failure,
          cytosolic protein misfolding, viral double-stranded RNA, ER
          client-protein overload, amino-acid limitation and ribosome collisions
  parts:
    - order: 1
      role: stress sensing and eIF2alpha Ser51 phosphorylation by an eIF2alpha kinase
      node:
        id: eif2a_kinase_activation
        label: eIF2alpha kinase activation
        module_type: SIGNALING_PATHWAY
        description: >-
          Four paralogous kinases of the eIF2alpha kinase family each pair a
          distinct sensing module with the same kinase domain and the same
          substrate site. Whichever is engaged, the output is phospho-Ser51 of
          eIF2alpha.
        variant_sets:
          - id: eif2a_kinase_branch
            label: eIF2alpha kinase branches
            axis: sensed stress and sensing module
            variant_kind: ROUTE
            selection: ONE_OR_MORE
            notes: >-
              Declared ROUTE rather than REALIZER: the four variants share one
              molecular function but differ in the input they sense, which is
              what distinguishes the branches biologically. ONE_OR_MORE because
              co-occurring stresses engage more than one kinase.
            variants:
              - id: hri_branch
                label: HRI branch (heme deficiency, mitochondrial stress, cytosolic misfolding)
                module_type: SIGNALING_PATHWAY
                description: >-
                  HRI is held inactive by bound heme and is activated when heme
                  is limiting, by the OMA1-DELE1 relay from stressed
                  mitochondria, and by cytosolic protein misfolding during
                  innate-immune signalosome assembly.
                concepts:
                  - preferred_term: HRI-mediated signaling
                    term:
                      id: GO:0140468
                      label: HRI-mediated signaling
                annotons:
                  - id: hri_kinase
                    label: HRI eIF2alpha kinase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: HRI (EIF2AK1)
                        term:
                          id: UniProtKB:Q9BQI3
                          label: Eukaryotic translation initiation factor 2-alpha kinase 1
                    function:
                      preferred_term: eukaryotic translation initiation factor 2alpha kinase activity
                      term:
                        id: GO:0004694
                        label: eukaryotic translation initiation factor 2alpha kinase activity
                      substrates:
                        - preferred_term: eIF2alpha (EIF2S1) Ser51
                      cofactors:
                        - preferred_term: heme, as an inhibitory ligand of the N-terminal heme-binding domain
                    processes:
                      - preferred_term: HRI-mediated signaling
                        term:
                          id: GO:0140468
                          label: HRI-mediated signaling
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      The multi-input kinase of the quartet. Heme binding is
                      inhibitory, so HRI reports heme and iron supply in
                      erythroid cells; it is separately activated by the
                      DELE1 fragment released from stressed mitochondria, and by
                      cytosolic protein misfolding.
                    gocam_associations:
                      - model: gomodel:6606056e00000903
                        activity: gomodel:6606056e00000903/6606056e00000938
                        title: Activation of the integrated stress response via activation of EIF2AK1/HRI by DELE1 in response to mitochondrial stress (Human)
                    evidence:
                      - source_id: PMID:32132707
                        title: Mitochondrial stress is relayed to the cytosol by an OMA1-DELE1-HRI pathway.
                        statement: Purified DELE1 stimulates the eIF2alpha kinase activity of HRI.
                        supporting_text: >-
                          Using purified HRI, eIF2α and DELE1, we showed that
                          DELE1 stimulates eIF2α kinase activity of HRI in vitro
                      - source_id: PMID:31273097
                        title: The heme-regulated inhibitor is a cytosolic sensor of protein misfolding that controls innate immune signaling.
                        statement: >-
                          HRI acts through eIF2alpha and ATF4 to control folding
                          and activation of the NOD1 signalosome, a
                          misfolding-sensing input independent of heme.
                        supporting_text: >-
                          We found that the eIF2α kinase heme-regulated
                          inhibitor (HRI) controls NOD1 signalosome folding and
                          activation through a process requiring eukaryotic
                          initiation factor 2α (eIF2α), the transcription factor
                          ATF4, and the heat shock protein HSPB8.
                      - source_id: file:genes/human/EIF2AK1/EIF2AK1-ai-review.yaml
                        title: human EIF2AK1 gene review
                        statement: >-
                          Core functions eIF2alpha kinase activity and heme
                          binding, both in the cytosol.
                parts:
                  - order: 1
                    optional: true
                    role: mitochondrial stress input - OMA1 cleavage of DELE1
                    node:
                      id: isr_oma1_dele1_cleavage
                      label: OMA1 stress-activated cleavage of DELE1 (by reference)
                      module_ref: mitochondrial_upr#oma1_dele1_cleavage
                      description: >-
                        Taken by reference from MODULE:mitochondrial_upr rather
                        than re-authored here. Optional because heme deficiency
                        and cytosolic misfolding activate HRI without it.
                  - order: 2
                    optional: true
                    role: mitochondrial stress input - DELE1 activation of HRI
                    node:
                      id: isr_dele1_hri_activation
                      label: DELE1 activates HRI in the cytosol (by reference)
                      module_ref: mitochondrial_upr#dele1_hri_activation
                      description: >-
                        Taken by reference from MODULE:mitochondrial_upr. Under
                        iron deficiency the same activation uses full-length
                        DELE1 stalled on the outer membrane rather than the
                        OMA1-generated fragment, so this part can hold without
                        the cleavage part above.
              - id: pkr_branch
                label: PKR branch (double-stranded RNA)
                module_type: SIGNALING_PATHWAY
                description: >-
                  PKR binds viral double-stranded RNA through its two dsRNA
                  binding domains, dimerizes, autophosphorylates and
                  phosphorylates eIF2alpha Ser51, shutting down translation in
                  infected cells.
                annotons:
                  - id: pkr_kinase
                    label: PKR eIF2alpha kinase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PKR (EIF2AK2)
                        term:
                          id: UniProtKB:P19525
                          label: Interferon-induced, double-stranded RNA-activated protein kinase
                    function:
                      preferred_term: eukaryotic translation initiation factor 2alpha kinase activity
                      term:
                        id: GO:0004694
                        label: eukaryotic translation initiation factor 2alpha kinase activity
                      substrates:
                        - preferred_term: eIF2alpha (EIF2S1) Ser51
                      cofactors:
                        - preferred_term: double-stranded RNA, as the activating ligand
                    processes:
                      - preferred_term: integrated stress response signaling
                        term:
                          id: GO:0140467
                          label: integrated stress response signaling
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      The antiviral input. Unlike the other three branches, GO
                      has no PKR-specific signalling term, so the process is
                      recorded at the parent GO:0140467; PKR's antiviral innate
                      immune role is annotated separately on the gene.
                    gocam_associations:
                      - model: gomodel:61e0e55600000407
                        activity: gomodel:61e0e55600000407/61e0e55600000588
                        title: SP_GADD34- PPP1CA
                    evidence:
                      - source_id: PMID:16179258
                        title: Higher-order substrate recognition of eIF2alpha by the RNA-dependent protein kinase PKR.
                        statement: >-
                          PKR phosphorylates eIF2alpha Ser51 in response to viral
                          double-stranded RNA; the crystal structures show
                          eIF2alpha bound to the catalytic lobe with the Ser51
                          site locally unfolded into the catalytic cleft.
                        supporting_text: >-
                          In response to binding viral double-stranded RNA
                          byproducts within a cell, the RNA-dependent protein
                          kinase PKR phosphorylates the alpha subunit of the
                          translation initiation factor eIF2 on a regulatory
                          site, Ser51.
                      - source_id: PMID:14638860
                        title: Inhibition of a constitutive translation initiation factor 2alpha phosphatase, CReP, promotes survival of stressed cells.
                        statement: >-
                          PKR is activated by double-stranded RNA produced during
                          viral infection.
                        supporting_text: >-
                          PKR (protein kinase repressor) is activated by
                          double-stranded RNA produced during viral infection
                          and plays an important role in translational
                          inhibition and apoptosis of virally infected cells
                    notes: >-
                      Human EIF2AK2 has no gene review yet, so this annoton is
                      grounded on UniProtKB:P19525 and on the cited structures
                      and GO-CAM activity.
              - id: perk_branch
                label: PERK branch (ER folding stress)
                module_type: SIGNALING_PATHWAY
                description: >-
                  PERK is an ER-membrane kinase whose luminal domain is held
                  inactive by BiP and is released when misfolded clients compete
                  BiP away; its cytosolic kinase domain then phosphorylates
                  eIF2alpha. This is the ER-specific input to the ISR and the
                  translational arm of the ER unfolded protein response.
                concepts:
                  - preferred_term: PERK-mediated unfolded protein response
                    term:
                      id: GO:0036499
                      label: PERK-mediated unfolded protein response
                annotons:
                  - id: perk_kinase
                    label: PERK eIF2alpha kinase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PERK (EIF2AK3)
                        term:
                          id: UniProtKB:Q9NZJ5
                          label: Eukaryotic translation initiation factor 2-alpha kinase 3
                    function:
                      preferred_term: eukaryotic translation initiation factor 2alpha kinase activity
                      term:
                        id: GO:0004694
                        label: eukaryotic translation initiation factor 2alpha kinase activity
                      substrates:
                        - preferred_term: eIF2alpha (EIF2S1) Ser51
                    processes:
                      - preferred_term: PERK-mediated unfolded protein response
                        term:
                          id: GO:0036499
                          label: PERK-mediated unfolded protein response
                    locations:
                      - preferred_term: endoplasmic reticulum membrane
                        term:
                          id: GO:0005789
                          label: endoplasmic reticulum membrane
                    role_description: >-
                      The only branch anchored in a membrane, with its sensing
                      domain in the ER lumen and its kinase domain in the
                      cytosol. Its arm is modelled in full, with BiP
                      restraint and the ATF6 and IRE1 arms, in
                      MODULE:er_unfolded_protein_response (node perk_arm).
                    gocam_associations:
                      - model: gomodel:66b5638000000624
                        title: Activation of the integrated stress response via activation of EIF2AK3/PERK in response to unfolded protein response (Human).
                    evidence:
                      - source_id: PMID:9930704
                        title: Protein translation and folding are coupled by an endoplasmic-reticulum-resident kinase.
                        statement: >-
