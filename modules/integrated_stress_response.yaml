id: MODULE:integrated_stress_response
title: Integrated stress response module
description: >-
  The integrated stress response (ISR) converts many unrelated stresses into
  one translational signal. A stress-activated eIF2alpha kinase phosphorylates
  the alpha subunit of eIF2 on Ser51 (Ser52 counting the initiator
  methionine). Phosphorylated eIF2-GDP binds its guanine nucleotide exchange
  factor eIF2B tightly and inhibits it, so the eIF2-GTP-Met-tRNAi ternary
  complex falls. Global cap-dependent translation initiation drops, while
  mRNAs with short upstream ORFs, ATF4 in animals and GCN4 in fungi, are
  translated more because scanning ribosomes take longer to reacquire ternary
  complex and bypass the inhibitory uORF (delayed reinitiation). ATF4 or GCN4
  then drives a transcriptional program for amino-acid supply, redox defence
  and recovery. In animals, PP1 holophosphatases targeted to eIF2alpha by the
  constitutive regulatory subunit PPP1R15B (CReP) and the stress-induced
  PPP1R15A (GADD34) dephosphorylate eIF2alpha and end the response.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: GO:0140467
  statement: The module is grounded in the GO process integrated stress response signaling.
- &isr_core
  source_id: PMID:27629041
  statement: The ISR core is eIF2alpha phosphorylation by one of four kinases, leading to lower global protein
    synthesis and induction of ATF4.
  supporting_text: The core event in this pathway is the phosphorylation of eukaryotic translation initiation
    factor 2 alpha (eIF2α) by one of four members of the eIF2α kinase family, which leads to a decrease in
    global protein synthesis and the induction of selected genes, including the transcription factor ATF4
- &crep_intro_eif2b
  source_id: PMID:14638860
  statement: eIF2alpha Ser51 phosphorylation is conserved from yeast to mammals and acts by inhibiting eIF2B.
  supporting_text: This signaling event, which is conserved from yeast to mammals, negatively regulates
    the guanine nucleotide exchange factor, eIF2B and inhibits the recycling of eIF2 to its active GTP bound
    form.
- &gcn4_atf4_parallel
  source_id: PMID:14638860
  statement: Gcn4p in yeast and ATF4 in mammals are the translationally induced effectors.
  supporting_text: the translation of specific mRNAs, such as those encoding the yeast transcription factor
    Gcn4p or the mammalian transcription factor ATF4 are induced under conditions of modest eIF2α phosphorylation
- &harding2000_ancient
  source_id: PMID:11106749
  statement: The mammalian PERK/GCN2-ATF4 pathway is homologous to the yeast general control response.
  supporting_text: This is the first example of a mammalian signaling pathway homologous to the well studied
    yeast general control response in which eIF2alpha phosphorylation activates genes involved in amino acid
    biosynthesis.
- source_id: PMID:16153175
  statement: In yeast the same initiation-factor events that induce GCN4 translation reduce general protein
    synthesis, and mammalian cells use the same strategy.
  supporting_text: Remarkably, mammalian cells use the same strategy to downregulate protein synthesis while
    inducing transcriptional activators of stress-response genes under various stressful conditions, including
    amino acid starvation.
