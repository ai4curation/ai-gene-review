    - order: 4
      role: selective translation of ATF4 and the transcriptional output
      node:
        id: atf4_output
        label: ATF4 translational control and transcriptional output
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The ATF4 mRNA carries two upstream ORFs. When eIF2-GTP is plentiful,
          ribosomes that have translated the permissive uORF1 reinitiate at the
          inhibitory uORF2 and ATF4 is not made. When eIF2-GTP falls, acquiring
          a new ternary complex takes longer, scanning ribosomes read through
          uORF2 and reinitiate at the ATF4 start codon. ATF4 then activates
          amino-acid, transport, chaperone and redox genes.
        annotons:
          - id: atf4_tf
            label: ATF4 stress-induced transcription activator
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ATF4
                term:
                  id: UniProtKB:P18848
                  label: Cyclic AMP-dependent transcription factor ATF-4
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
              targets:
                - preferred_term: >-
                    ISR target genes, including ASNS, amino-acid transporters,
                    CHAC1, DDIT3 and PPP1R15A
            processes:
              - preferred_term: integrated stress response signaling
                term:
                  id: GO:0140467
                  label: integrated stress response signaling
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              The translationally controlled output of the relay. ATF4 is
              regulated at the level of its own translation rather than by
              transcription or by a post-translational switch, which is why its
              uORF architecture is part of the mechanism.
            gocam_associations:
              - model: gomodel:6606056e00000903
                activity: gomodel:6606056e00000903/6606056e00000964
                title: Activation of the integrated stress response via activation of EIF2AK1/HRI by DELE1 in response to mitochondrial stress (Human)
            evidence:
              - source_id: PMID:15277680
                title: Reinitiation involving upstream ORFs regulates ATF4 mRNA translation in mammalian cells.
                statement: >-
                  Two uORFs in the ATF4 5' leader make its translation
                  eIF2-GTP-dependent: uORF1 permits reinitiation, uORF2 blocks
                  ATF4 expression when eIF2-GTP is abundant.
                supporting_text: >-
                  The 5' proximal uORF1 is a positive-acting element that
                  facilitates ribosome scanning and reinitiation at downstream
                  coding regions in the ATF4 mRNA. When eIF2-GTP is abundant in
                  nonstressed cells, ribosomes scanning downstream of uORF1
                  reinitiate at the next coding region, uORF2, an inhibitory
                  element that blocks ATF4 expression.
              - source_id: PMID:11960987
                title: ATF4 is a mediator of the nutrient-sensing response pathway that activates the human asparagine synthetase gene.
                statement: >-
                  ATF4 binds the nutrient-sensing response element of the
                  asparagine synthetase promoter and activates transcription on
                  amino-acid or glucose deprivation.
                supporting_text: >-
                  Overexpression of ATF4 increased A.S. promoter-driven
                  transcription, whereas an inhibitory dominant negative ATF4
                  mutant blocked both basal and starvation-enhanced
                  transcription.
              - source_id: file:genes/human/ATF4/ATF4-ai-review.yaml
                title: human ATF4 gene review
                statement: >-
                  Core functions DNA-binding transcription activator activity,
                  RNA polymerase II-specific, and protein heterodimerization
                  activity.
