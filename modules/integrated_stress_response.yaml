  connections:
    - source: eif2a_kinase_activation
      target: eif2_complex
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Whichever branch is engaged, the kinase phosphorylates Ser51 of
        eIF2alpha. This does not destroy eIF2's initiation-factor activity
        directly; it converts eIF2 into an inhibitor of its own recycling, which
        is why the effect is recorded as negative regulation of the eIF2 annoton
        rather than as a loss of function.
    - source: eif2_complex
      target: eif2b_gef
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Phospho-Ser51 eIF2 binds eIF2B in the exchange-inactive mode and
        inhibits nucleotide exchange dominantly, so a substoichiometric
        phospho-eIF2 pool blocks recycling of the whole eIF2 pool. GO has no
        molecular-function term for this inhibitory activity.
      evidence:
        - source_id: PMID:31048492
          title: Structural basis for eIF2B inhibition in integrated stress response.
          statement: >-
            The two eIF2 binding modes explain dominant inhibition of eIF2B by
            the phosphorylated form.
          supporting_text: >-
            These structures explain how phosphorylated eIF2 dominantly inhibits
            the nucleotide exchange activity of eIF2B.
    - source: eif2b_inhibition
      target: atf4_output
      connection_type: POSITIVELY_REGULATES
      description: >-
        Lower eIF2B activity lowers eIF2-GTP and the ternary-complex supply,
        which delays reinitiation and lets scanning ribosomes bypass the
        inhibitory uORF2 of the ATF4 mRNA. The same drop lowers global
        initiation, so one step produces both attenuation and selective ATF4
        translation.
    - source: atf4_output
      target: secondary_bzip_arm
      connection_type: POSITIVELY_REGULATES
      description: ATF4 induces DDIT3 and ATF3, which then act with it at target promoters.
    - source: atf4_output
      target: gadd34_pp1_adaptor
      connection_type: POSITIVELY_REGULATES
      description: >-
        ATF4, with CHOP, induces PPP1R15A, making GADD34 an ISR output that
        terminates the response that produced it.
    - source: eif2a_dephosphorylation
      target: eif2b_inhibition
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Removing phospho-Ser51 returns eIF2 to the exchange-active binding mode,
        relieving eIF2B inhibition and restoring initiation. CReP does this
        continuously and GADD34 does it as delayed feedback.
knowledge_gaps:
  - gap_statement: >-
      What sets the threshold at which ISR signalling stops being adaptive and
      becomes pro-apoptotic is not known. The same phospho-eIF2alpha mark and the
      same ATF4 output can end in recovery or in CHOP-driven death, and no
      measured property of the relay - phospho-eIF2alpha stoichiometry, duration,
      ATF4 or CHOP level - has been shown to be the determinant rather than a
      correlate.
    boundary: >-
      Firmly established: the mark, the eIF2B inhibition it causes, the uORF
      mechanism that raises ATF4, that CHOP is required for the death outcome in
      several systems, and that the outcome depends on stress intensity and
      duration. Not established: which measurable quantity the cell actually
      reads to commit.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      ISR-modulating drugs are being developed for neurodegeneration and for
      cancer, and whether they should raise or lower signalling depends on which
      quantity decides the outcome.
    provenance:
      - reference_id: PMID:27629041
        reference_section_type: ABSTRACT
        supporting_text: >-
          Although the ISR is primarily a pro-survival, homeostatic program,
          exposure to severe stress can drive signaling toward cell death.
  - gap_statement: >-
      When several stresses coincide, what decides which eIF2alpha kinase
      dominates, and whether the four branches have outputs beyond
      phospho-eIF2alpha that make them non-equivalent, is unresolved. The module
      models the four as alternative routes to one mark, but kinase-specific
      substrates and kinase-specific gene programs would make them distinct
      pathways rather than interchangeable inputs.
    boundary: >-
      Firmly established: which stress activates which kinase in isolation, that
      all four phosphorylate the same Ser51 site, and that an eIF2alpha S51A
      substitution removes most of the protective effect of all of them. Not
      established: the hierarchy under combined stress, or whether any branch
      has a phospho-eIF2alpha-independent output.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      Determines whether the four-branch architecture is redundancy for
      robustness or four separate responses that share one hub, and therefore
      whether branch-selective inhibitors would have distinct effects.
    provenance:
      - reference_id: PMID:14638860
        reference_section_type: INTRODUCTION
        supporting_text: >-
          The diversity of the upstream signals that activate eIF2α kinases has
          led us to propose that the downstream response, coordinated by the
          phosphorylation of eIF2α on serine 51 be termed an integrated stress
          response (ISR), because it integrates signaling in multiple stress
          pathways
