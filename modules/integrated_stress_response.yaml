notes: >-
  Created 2026-11-02 as a species-independent ISR core. Taxon scope: Opisthokonta is a curator judgement.
  The full chain (eIF2alpha kinase, eIF2alpha Ser51, eIF2B inhibition, uORF-controlled translation of a
  bZIP effector) is established in budding yeast (GCN2-GCN4) and in animals (four kinases, ATF4), and the
  cited papers state it is conserved from yeast to mammals (PMID:15277680, PMID:14638860, PMID:11106749).
  eIF2alpha kinases are older: PAINT places GO:0004694 on PTHR11042 nodes with plant, Dictyostelium and
  Plasmodium seeds (PTN000867953, PTN008315216), so the kinase step alone would fit Eukaryota, but a
  uORF-regulated effector transcription factor and eIF2B-mediated global repression are not grounded
  here outside fungi and animals. The kinase set differs by lineage (one GCN2 in yeast; HRI, PKR, PERK,
  GCN2 in vertebrates), which is why kinases are REALIZER variants. Boundary with er_unfolded_protein_response:
  that module's perk_arm node models PERK, eIF2alpha and ATF4 as the ER-specific branch with BiP control.
  This module models the shared core once; the PERK realizer repeats only the PERK kinase activity, and
  the eIF2alpha and ATF4 annotons here are the general ISR roles. PERK is not module_ref'd because the
  referenced node would bring eIF2alpha and ATF4 in a second time. The five human GO-CAMs are instances;
  their activities map onto the single eIF2 node, the kinase realizers and the ATF4 realizer, with the
  defects listed in gocam_associations. COX7A2L/SCAF1 and DDIT3/CHOP are ATF4 target-gene outputs and
  are left out of the module. eIF2 is represented by its alpha subunit because that is the phosphorylated,
  regulated subunit; the factor is the alpha-beta-gamma eIF2 complex. GO has no molecular-function term
  for the eIF2B-inhibitory activity of phosphorylated eIF2, so the inhibition is expressed by connections
  rather than by a second, differently typed eIF2 node. ISRIB-type eIF2B activators, eIF2B decamer
  assembly and alternative ISR outputs (ATF5, CHOP, QRICH1) are outside the boundary.
