          The upstream activators are context and are not modelled as parts: heme deficiency and the OMA1-DELE1
          relay for HRI, double-stranded RNA for PKR, BiP release and misfolded proteins for PERK, uncharged
          tRNA (with GCN1) for GCN2. The full PERK branch of the ER unfolded protein response, including its
          BiP control, is modelled in er_unfolded_protein_response#perk_arm; only the PERK kinase activity
          is repeated here as one realizer of the shared step.'
