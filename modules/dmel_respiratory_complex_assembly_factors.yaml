id: MODULE:dmel_respiratory_complex_assembly_factors
title: Respiratory chain and ATP synthase assembly factors in Drosophila melanogaster
description: >-
  The complexes of the mitochondrial oxidative phosphorylation system are built from nuclear-
  and mitochondrially encoded subunits with the help of dedicated assembly factors that are
  not part of the mature enzymes. Complex II (succinate dehydrogenase) assembly factors include
  SDHAF2-type proteins required for covalent flavinylation of the SdhA subunit and SDHAF3
  and SDHAF4 homologs that protect the iron-sulfur subunit and intermediates. Complex III
  assembly requires the AAA ATPase Bcs1, which inserts the Rieske iron-sulfur protein, the
  LYR protein LYRM7 that chaperones it, and the UQCC proteins that support cytochrome b. HIG1
  domain proteins associate with complexes III and IV and support respiratory supercomplex
  formation. ATP synthase (complex V) assembly factors include ATPAF1-type chaperones of the
  F1 domain, TMEM70 and the metalloprotease ATP23.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002034
  title: 'FlyBase gene group MCIII-AF: Mitochondrial respiratory chain complex iii assembly
    factors'
  statement: >-
