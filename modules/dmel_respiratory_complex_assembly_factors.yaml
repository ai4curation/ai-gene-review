    chain complex iii assembly factors (MCIII-AF); this module models that group.
- source_id: FB:FBgg0002036
  title: 'FlyBase gene group MCR-AF: Mitochondrial respirasome assembly factors'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as mitochondrial respirasome
    assembly factors (MCR-AF); this module models that group.
- source_id: FB:FBgg0002037
  title: 'FlyBase gene group MCII-AF: Mitochondrial respiratory chain complex ii assembly
    factors'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as mitochondrial respiratory
    chain complex ii assembly factors (MCII-AF); this module models that group.
- source_id: FB:FBgg0002039
  title: 'FlyBase gene group MCV-AF: Mitochondrial proton-transporting atp synthase complex
    assembly factors'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as mitochondrial proton-transporting
    atp synthase complex assembly factors (MCV-AF); this module models that group.
- source_id: GO:0033108
  title: mitochondrial respiratory chain complex assembly
  statement: >-
    GO term grounding the module as mitochondrial respiratory chain complex assembly.
notes: >-
  The module groups four FlyBase assembly-factor sets; the factors act on different complexes
  and are not a single complex or a linear pathway, so no connections are asserted. Complex
  I and complex IV assembly factors are not in these FlyBase groups and are outside this module.
  Several members are uncharacterised in Drosophila (for example CG15386, CG30373, CG17734
  and CG12107) and are included on the strength of FlyBase group membership and orthology;
  process terms are applied at the level of each group and do not imply that each member has
  been tested. Molecular functions are left unset because they are not established for the
  Drosophila proteins. FlyBase groups realized by this module: MCIII-AF (FBgg0002034), MCR-AF
  (FBgg0002036), MCII-AF (FBgg0002037), MCV-AF (FBgg0002039). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_respiratory_complex_assembly_factors.yaml; none of the member genes
  has a gene review yet unless noted.
