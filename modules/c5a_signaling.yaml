id: MODULE:c5a_signaling
title: Complement component C5a signaling pathway module
description: >-
  Proteolytic cleavage of secreted complement C5 by C3/C5 convertases (or granzyme K) in the
  extracellular region releases the 74-residue C5a anaphylatoxin, which engages the seven-transmembrane
  complement receptors C5aR1 (CD88) and C5aR2 (C5L2) at the plasma membrane of myeloid leukocytes,
  endothelial cells, and other target cells. C5a binding to C5aR1 activates pertussis-toxin-sensitive
  heterotrimeric Gi proteins (exemplified by GNAI2) and beta-arrestins, whereas C5a binding to the
  non-G-protein-coupled receptor C5aR2 selectively recruits beta-arrestins to modulate C5aR1
  signaling. Together these steps execute the complement component C5a signaling pathway
  (GO:0038178) and drive PI3Kgamma (PIK3CG)- and RhoA-dependent myeloid leukocyte chemotaxis
  (GO:0006935) and degranulation.
status: DRAFT
evidence:
  - source_id: GO:0038178
    title: complement component C5a signaling pathway
    statement: >-
      The module is grounded in the GO biological process term for complement component C5a
      signaling pathway (GO:0038178: the series of molecular signals initiated by complement
      component C5a binding to a C5a receptor on the surface of a target cell).
  - source_id: PMID:36806352
    title: Mechanism of activation and biased signaling in complement receptor C5aR1.
    supporting_text: >-
      The complement fragment C5a is one of its important effector components and exerts diverse
      physiological functions through activation of the C5a receptor 1 (C5aR1) and associated
      downstream G protein and β-arrestin signaling pathways.
    statement: >-
      Establishes C5a binding to C5aR1 and downstream G-protein (Gi) and beta-arrestin signaling.
  - source_id: PMID:37169960
    title: Revealing the signaling of complement receptors C3aR and C5aR1 by anaphylatoxins.
    supporting_text: >-
      The complement receptors C3aR and C5aR1, whose signaling is selectively activated by
      anaphylatoxins C3a and C5a, are important regulators of both innate and adaptive immune
      responses.
    statement: >-
      Resolves the structural basis of anaphylatoxin C5a recognition and Gi coupling by C5aR1.
  - source_id: PMID:37852260
    title: Molecular basis of anaphylatoxin binding, activation, and signaling bias at complement receptors.
    supporting_text: >-
      The complement system is a critical part of our innate immune response, and the terminal
      products of this cascade, anaphylatoxins C3a and C5a, exert their physiological and
      pathophysiological responses primarily via two GPCRs, C3aR and C5aR1.
    statement: >-
      Resolves the molecular basis of anaphylatoxin C5a recognition and biased signaling across
      complement receptors.
  - source_id: PANTHER:PTN002605305
    title: PAINT node PTN002605305 for complement C5
    statement: >-
      Local PAINT IBD node in PTHR11412 with propagated terms P:GO:0006935, P:GO:0006958; PAINT
      date 20260729.
  - source_id: PANTHER:PTN000026392
    title: PAINT node PTN000026392 for G protein alpha subunits (GNAI2)
    statement: >-
      Local PAINT IBD node in PTHR10218 with propagated terms C:GO:0005737, C:GO:0005834,
      F:GO:0003925, P:GO:0007188; PAINT date 20260828.
  - source_id: PANTHER:PTN000005674
    title: PAINT node PTN000005674 for PIK3CG
    statement: >-
      Local PAINT IBD node in PTHR10048 with propagated terms C:GO:0005886, F:GO:0016303,
      F:GO:0035005, P:GO:0043491; PAINT date 20240205.
  - source_id: PANTHER:PTN000632671
    title: PAINT node PTN000632671 for RHOA
    statement: >-
      Local PAINT IBD node in PTHR24072 with propagated terms C:GO:0005886, F:GO:0003924,
      F:GO:0005525, P:GO:0007015, P:GO:0007165; PAINT date 20260529.
notes: >-
  Curated signaling-pathway module for the complement component C5a signaling pathway (GO:0038178)
  built with PANTHER FAMILY/subfamily selectors, explicit molecular functions, biological processes,
  and cellular locations across the C5a anaphylatoxin ligand (C5, PANTHER:PTHR11412:SF83),
  the complement C5a receptors C5AR1 (PANTHER:PTHR24225:SF29) and C5AR2 (PANTHER:PTHR24225:SF1),
  heterotrimeric Gi alpha subunit GNAI2 (PANTHER:PTHR10218:SF73), and downstream chemotaxis
  effectors PIK3CG (PANTHER:PTHR10048) and RHOA (PANTHER:PTHR24072).
