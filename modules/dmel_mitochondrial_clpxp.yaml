id: MODULE:dmel_mitochondrial_clpxp
title: Mitochondrial ClpXP protease in Drosophila melanogaster
description: >-
  ClpXP is an ATP-dependent protease of the mitochondrial matrix. Hexameric rings of the AAA+
  unfoldase ClpX recognise substrates, unfold them and thread them into the barrel formed
  by two heptameric rings of the serine peptidase ClpP, where they are degraded. ClpXP contributes
  to matrix protein quality control and to the mitochondrial unfolded protein response.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002017
  title: 'FlyBase gene group CLPXP: Mitochondrial clpxp complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as mitochondrial clpxp complex
    (CLPXP); this module models that group.
- source_id: GO:0009368
  title: endopeptidase Clp complex
  statement: >-
    GO term grounding the module as endopeptidase Clp complex.
notes: >-
  FlyBase groups realized by this module: CLPXP (FBgg0002017). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_mitochondrial_clpxp.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
