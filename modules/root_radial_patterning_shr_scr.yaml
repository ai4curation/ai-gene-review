id: MODULE:root_radial_patterning_shr_scr
title: Root ground-tissue radial patterning by the SHORT-ROOT-SCARECROW-BIRD module
description: >-
  Radial patterning of the Arabidopsis root ground tissue is organised by a mobile GRAS-domain
  transcriptional regulator. SHORT-ROOT (SHR) is transcribed in the stele but the protein moves
  through plasmodesmata into the single adjacent cell layer (endodermis, cortex/endodermis initial
  (CEI) and quiescent centre (QC)). There it is captured in the nucleus by the related GRAS protein
  SCARECROW (SCR), with which it forms a head-to-head heterodimer, and by BIRD/INDETERMINATE-DOMAIN
  (IDD) C2H2 zinc-finger transcription factors such as JACKDAW (JKD/IDD10) and MAGPIE (MGP/IDD3).
  The BIRD zinc fingers ZF1-ZF3 contact DNA while ZF3-ZF4 dock into a groove on SHR, so the
  SHR-SCR heterodimer acts as a transcriptional coregulator brought to target promoters by BIRD
  proteins. Nuclear retention limits SHR movement to one layer, and the SHR-SCR-BIRD complex
  activates SCR itself (a positive feedback loop), MGP and other BIRDs (a feed-forward loop), and the
  D-type cyclin CYCD6;1. CYCD6;1 binds and activates CDKB1 kinases that phosphorylate
  RETINOBLASTOMA-RELATED (RBR), relieving RBR repression of SCR; this nested feed-forward loop
  triggers the formative asymmetric periclinal division of the CEI daughter that produces separate
  endodermis and cortex layers. SHR-SCR also specify endodermal identity, and SCR is required
  cell-autonomously for QC identity, providing the niche context in which the QC transcription factor
  WOX5 maintains the surrounding stem cells. Middle-cortex formation later in development reuses the
  SHR-SCR-CYCD6;1 module.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:28211915
  title: Structure of the SHR-SCR heterodimer bound to the BIRD/IDD transcriptional factor JKD.
  statement: SHR-SCR is a transcriptional cofactor docked on the zinc fingers of BIRD/IDD DNA-binding factors.
  supporting_text: SHR-SCR function as transcription cofactors by binding to the third and fourth ZFs, (ZF3-ZF4) of JKD
- source_id: PMID:17446396
  title: An evolutionarily conserved mechanism delimiting SHR movement defines a single layer of endodermis
    in plants.
  statement: SCR sequesters SHR in the nucleus, restricting SHR movement to one cell layer.
  supporting_text: SCARECROW (SCR) blocks SHR movement by sequestering it into the nucleus through protein-protein
    interaction
- source_id: PMID:20596025
  title: Spatiotemporal regulation of cell-cycle genes by SHORTROOT links patterning and growth.
  statement: SHR and SCR directly activate CYCD6;1 at the onset of the formative division.
  supporting_text: Coincident with the onset of a specific formative division, SHR and SCR directly activate
    a D-type cyclin
- source_id: PMID:22921914
  title: A bistable circuit involving SCARECROW-RETINOBLASTOMA integrates cues to inform asymmetric stem cell
    division.
  statement: CYCD6;1-CDKB1 phosphorylation of RBR and the SCR-RBR interaction form nested feed-forward loops
    positioning the asymmetric division.
  supporting_text: We demonstrate that this interaction, together with the activity of the RBR regulator CYCD6;1,
    defines the precise position of ACDs in the stem cell area through two nested feedforward loops
- source_id: PMID:26494755
  title: Transcriptional control of tissue formation throughout root development.
  statement: BIRDs (JKD, BIB, MGP, NUC, BLJ) retain SHR in the nucleus and are required for formative divisions.
  supporting_text: JKD and BALD-IBIS regulate SHR movement by promoting its nuclear retention, and cooperatively
    with MAGPIE (MGP) and NUTCRACKER (NUC) are required for the formative divisions that pattern the ground
    tissue into cortex and endodermis
- source_id: PMID:17785527
  title: Arabidopsis JACKDAW and MAGPIE zinc finger proteins delimit asymmetric cell division and stabilize
    tissue boundaries by restricting SHORT-ROOT action.
  statement: JKD and MGP act in a SHR-dependent feed-forward loop that regulates the range of SHR/SCR action.
  supporting_text: JACKDAW and MAGPIE genes, which encode members of a plant-specific family of zinc finger
    proteins, act in a SHR-dependent feed-forward loop to regulate the range of action of SHORT-ROOT and SCARECROW
notes: >-
  CONCRETE Arabidopsis module. All members are grounded as GENE_PRODUCT selectors by UniProtKB
  accession taken from the gene folders (SHR Q9SZF7, SCR Q9M384, JKD Q700D2, MGP Q9ZWA6, CYCD6;1
  Q9ZR04, WOX5 Q8H1D2). No PANTHER family ids are asserted: UniProt assigns the BIRD/IDD proteins to
  PTHR10593, whose official family name ("SERINE/THREONINE-PROTEIN KINASE RIO") is dominated by an
  unrelated member, so a family descriptor would mislead. For reference, UniProt places JKD in
  subfamily PTHR10593:SF231 ("PROTEIN INDETERMINATE-DOMAIN 13-RELATED") and MGP in PTHR10593:SF148
  ("ZINC FINGER PROTEIN MAGPIE"), and CYCD6;1 in PTHR10177 ("CYCLINS"). These are recorded here only
  and are not asserted as family descriptors. Other BIRDs (BIB/IDD9, NUC/IDD8, BLJ/IDD1,
  IME/IDD2) and CDKB1;1/1;2 and RBR participate but have no gene reviews yet; they are named in prose only.
  WOX5 is modelled as an optional context part for QC identity, not as a core step of ground-tissue
  patterning. No GO-CAM models in gocams/index.tsv contain these proteins. SHR intercellular movement
  is described in the SHR gene review (proposed new term) and is represented here only in prose and
  as the first part. Process granularity differs between annotons on purpose. The SHR annoton reuses
  GO:0009956 radial pattern formation from the existing SHR review, because SHR also acts in shoot
  tissues (its review covers leaf development), so the general term is kept there. The JKD and MGP annotons use the root-specific
  child GO:0090057 root radial pattern formation, because their documented roles are confined to the root.
  Both SCR and JKD nuclear-capture annotons use GO:0051457 maintenance of protein location in nucleus,
  because both retain SHR that has already entered the nucleus.
module:
  id: root_radial_patterning_shr_scr
  label: SHR-SCR-BIRD root ground-tissue radial patterning
  module_type: DEVELOPMENTAL_PROCESS
  concepts:
  - preferred_term: root radial pattern formation
    term:
      id: GO:0090057
      label: root radial pattern formation
    description: Formation of the concentric root tissues; here the separation of endodermis and cortex from
      the CEI and specification of endodermis and QC.
  - preferred_term: asymmetric cell division
    term:
      id: GO:0008356
      label: asymmetric cell division
    description: The formative division of the CEI daughter that produces endodermis and cortex.
  context:
    taxa:
    - preferred_term: Arabidopsis thaliana
      term:
        id: NCBITaxon:3702
        label: Arabidopsis thaliana
  parts:
  - order: 1
    role: mobile SHR signal from stele to adjacent layer
    node:
      id: shr_mobile_signal
      label: SHR movement from stele and nuclear entry in the endodermis/QC layer
      module_type: REGULATORY_STEP
      description: SHR is transcribed in the stele and moves one cell layer outward, acting as a positional
        transcriptional coregulator in the endodermis, CEI and QC.
      annotons:
      - id: shr_coregulator
        label: 'SHR: mobile GRAS transcription coregulator'
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: SHR
            term:
              id: UniProtKB:Q9SZF7
              label: Protein SHORT-ROOT
        function:
          preferred_term: transcription coregulator activity
          term:
            id: GO:0003712
            label: transcription coregulator activity
        processes:
        - preferred_term: radial pattern formation
          term:
            id: GO:0009956
            label: radial pattern formation
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: Non-cell-autonomous positional signal; in the adjacent layer it forms a heterodimer
          with SCR and is recruited to promoters by BIRD/IDD factors.
        evidence:
        - source_id: PMID:28211915
          statement: SHR-SCR are cofactors recruited via BIRD zinc fingers.
          supporting_text: SHR-SCR function as transcription cofactors by binding to the third and fourth ZFs,
            (ZF3-ZF4) of JKD
  - order: 2
    role: nuclear capture of SHR and assembly of the SHR-SCR-BIRD complex
    node:
      id: shr_nuclear_capture
      label: Nuclear capture of SHR by SCR and BIRD/IDD proteins
      module_type: REGULATORY_STEP
      description: SCR heterodimerizes with SHR through the GRAS alpha-helical caps and BIRD zinc fingers ZF3-ZF4
        dock into the SHR groove; together they retain SHR in the nucleus and confine it to a single layer.
        JKD and MGP bind SHR-SCR mutually exclusively.
      annotons:
      - id: scr_capture
        label: 'SCR: binds SHR GRAS domain, retaining SHR in the nucleus'
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: SCR
            term:
              id: UniProtKB:Q9M384
              label: Protein SCARECROW
        function:
          preferred_term: protein domain specific binding
          term:
            id: GO:0019904
            label: protein domain specific binding
        processes:
        - preferred_term: maintenance of protein location in nucleus
          term:
            id: GO:0051457
            label: maintenance of protein location in nucleus
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        evidence:
        - source_id: PMID:17446396
          statement: SCR sequesters SHR in the nucleus.
          supporting_text: SCARECROW (SCR) blocks SHR movement by sequestering it into the nucleus through protein-protein
            interaction
      - id: jkd_capture
        label: 'JKD: docks SHR-SCR on ZF3-ZF4 and retains SHR in the nucleus'
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: JKD
            term:
              id: UniProtKB:Q700D2
              label: Zinc finger protein JACKDAW
        function:
          preferred_term: transcription coregulator binding
          term:
            id: GO:0001221
            label: transcription coregulator binding
        processes:
        - preferred_term: maintenance of protein location in nucleus
          term:
            id: GO:0051457
            label: maintenance of protein location in nucleus
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        evidence:
        - source_id: PMID:26494755
          statement: JKD promotes SHR nuclear retention.
          supporting_text: JKD and BALD-IBIS regulate SHR movement by promoting its nuclear retention
      - id: mgp_capture
        label: 'MGP: docks SHR-SCR on ZF3-ZF4'
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: MGP
            term:
              id: UniProtKB:Q9ZWA6
              label: Zinc finger protein MAGPIE
        function:
          preferred_term: transcription coregulator binding
          term:
            id: GO:0001221
            label: transcription coregulator binding
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        evidence:
        - source_id: PMID:28211915
          statement: SHR-SCR binds MGP ZF3-ZF4 with high affinity, exclusive of JKD.
          supporting_text: relatively high affinity of the SHR-SCR complex to MGP ZF3-ZF4 (the KD value of 36 nM)
            and JKD ZF3-ZF4 (124 nM)
  - order: 3
    role: SHR-SCR-BIRD transcriptional activation of target genes
    node:
      id: shr_scr_bird_activation
      label: SHR-SCR-BIRD activation of SCR, MGP and CYCD6;1
      module_type: REGULATORY_STEP
      description: BIRD zinc fingers ZF1-ZF3 bind IDD motifs in target promoters and the docked SHR-SCR coregulator
        activates transcription. Targets include SCR (positive feedback that reinforces SHR capture), MGP and other
        BIRDs (feed-forward), and CYCD6;1 in the CEI/CEI daughter.
      annotons:
      - id: jkd_tf
        label: 'JKD: IDD DNA-binding transcription factor'
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: JKD
            term:
              id: UniProtKB:Q700D2
              label: Zinc finger protein JACKDAW
        function:
          preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
        processes:
        - preferred_term: root radial pattern formation
          term:
            id: GO:0090057
            label: root radial pattern formation
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        evidence:
        - source_id: PMID:21935722
          statement: JKD activates SCR and MGP promoters in protoplasts, enhanced by SHR and SCR.
          supporting_text: Transient expression of LUC reporter genes with the proximal sequences upstream from
            the ATG codon of SCR and MGP in protoplasts were activated by JKD
      - id: mgp_tf
        label: 'MGP: IDD DNA-binding transcription factor (SHR-SCR target)'
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: MGP
            term:
              id: UniProtKB:Q9ZWA6
              label: Zinc finger protein MAGPIE
        function:
          preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
        processes:
        - preferred_term: root radial pattern formation
          term:
            id: GO:0090057
            label: root radial pattern formation
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        evidence:
        - source_id: PMID:28211915
          statement: MGP zinc fingers bind the IDD consensus with high affinity.
          supporting_text: Our DNA binding assay using this consensus sequence with ZFs of MGP showed high affinity
            (KD value of 50 nM) for ZF1-4 (all four ZFs)
      - id: scr_coregulator
        label: 'SCR: GRAS transcription coregulator partner of SHR'
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: SCR
            term:
              id: UniProtKB:Q9M384
              label: Protein SCARECROW
        function:
          preferred_term: transcription coregulator activity
          term:
            id: GO:0003712
            label: transcription coregulator activity
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: Forms the SHR-SCR coregulator; also bound and inhibited by RBR, which is released by
          CYCD6;1-CDKB1 phosphorylation.
        evidence:
        - source_id: PMID:20596025
          statement: SHR and SCR bind and activate the CYCD6;1 promoter.
          supporting_text: We found significant enrichment for both SHR and SCR binding around 1 kilo-base (kb)
            upstream of the CYCD6;1 promoter
  - order: 4
    role: formative asymmetric division of the CEI daughter
    node:
      id: cycd6_formative_division
      label: CYCD6;1-CDKB1-driven formative periclinal division
      module_type: BIOLOGICAL_PROCESS
      description: CYCD6;1 binds and activates CDKB1;1/1;2; the kinase phosphorylates RBR, releasing SCR from
        RBR inhibition and executing the asymmetric periclinal division that separates endodermis and cortex.
        The same module later drives middle-cortex formation from the endodermis.
      concepts:
      - preferred_term: periclinal cell division
        term:
          id: GO:0090511
          label: periclinal cell division
      annotons:
      - id: cycd6_1_cdk_regulator
        label: 'CYCD6;1: D-type cyclin regulatory subunit of CDKB1'
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: CYCD6;1
            term:
              id: UniProtKB:Q9ZR04
              label: Putative cyclin-D6-1
        function:
          preferred_term: cyclin-dependent protein serine/threonine kinase regulator activity
          term:
            id: GO:0016538
            label: cyclin-dependent protein serine/threonine kinase regulator activity
        processes:
        - preferred_term: periclinal cell division
          term:
            id: GO:0090511
            label: periclinal cell division
        - preferred_term: asymmetric cell division
          term:
            id: GO:0008356
            label: asymmetric cell division
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        evidence:
        - source_id: PMID:22921914
          statement: CYCD6;1 with CDKB1 phosphorylates RBR.
          supporting_text: Based on our genetic and biochemical data, RBR phosphorylation is carried out by a complex
            of CYCD6;1 with either CDKB1;1 or CDKB1;2
        - source_id: PMID:20596025
          statement: CYCD6;1 is specific to formative divisions.
          supporting_text: These results indicate that CYCD6;1 is not required for proliferative cell divisions
            but is specifically involved in formative divisions needed for proper ground tissue patterning
  - order: 5
    role: quiescent centre identity (stem cell niche context)
    optional: true
    node:
      id: qc_identity_context
      label: QC identity and stem-cell niche context (SCR, WOX5)
      module_type: REGULATORY_STEP
      description: SHR and SCR are also required for QC specification; in the QC, WOX5 acts as a transcriptional
        repressor that maintains the surrounding columella and other stem cells. Included as niche context for
        the CEI; WOX5 is not part of the ground-tissue patterning mechanism itself.
      annotons:
      - id: wox5_qc_repressor
        label: 'WOX5: QC homeodomain transcription repressor'
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: WOX5
            term:
              id: UniProtKB:Q8H1D2
              label: WUSCHEL-related homeobox 5
        function:
          preferred_term: DNA-binding transcription repressor activity
          term:
            id: GO:0001217
            label: DNA-binding transcription repressor activity
        locations:
        - preferred_term: nucleus
          term:
            id: GO:0005634
            label: nucleus
        role_description: Context only; see the WOX5 gene review.
  connections:
  - source: shr_mobile_signal
    target: shr_nuclear_capture
    connection_type: PRECEDES
    description: SHR protein that has moved into the adjacent layer is captured in the nucleus.
  - source: shr_nuclear_capture
    target: shr_scr_bird_activation
    connection_type: CAUSES
    description: The assembled SHR-SCR-BIRD complex activates target transcription.
  - source: shr_scr_bird_activation
    target: shr_nuclear_capture
    connection_type: POSITIVELY_REGULATES
    description: SHR-SCR-BIRD activation of SCR and MGP reinforces SHR capture (positive feedback/feed-forward
      loops).
    evidence:
    - source_id: PMID:21935722
      statement: JKD directly regulates SCR and MGP with SHR, SCR and MGP.
      supporting_text: Our findings suggest that JKD directly regulates SCR and MGP expression in cooperation with
        SHR, SCR and MGP
  - source: shr_scr_bird_activation
    target: cycd6_formative_division
    connection_type: POSITIVELY_REGULATES
    description: SHR-SCR directly activate CYCD6;1 transcription at the onset of the formative division.
    evidence:
    - source_id: PMID:20596025
      statement: SHR and SCR directly activate a D-type cyclin.
      supporting_text: Coincident with the onset of a specific formative division, SHR and SCR directly activate
        a D-type cyclin
  - source: cycd6_formative_division
    target: shr_scr_bird_activation
    connection_type: POSITIVELY_REGULATES
    description: CYCD6;1-CDKB1 phosphorylation of RBR relieves RBR inhibition of SCR (nested feed-forward loop).
    evidence:
    - source_id: PMID:22921914
      statement: Nested feed-forward loops of SCR-RBR and CYCD6;1 position the asymmetric division.
      supporting_text: We demonstrate that this interaction, together with the activity of the RBR regulator CYCD6;1,
        defines the precise position of ACDs in the stem cell area through two nested feedforward loops
