      description: Rho1-GTP activates the GT48 synthase (all four S. pombe Bgs subunits; Fks1/Gsc2).
    - source: bgs3_ghs2_variant
      target: nascent_glucan_branching
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Proposed: Ghs2 branches the beta-1,3-glucan chain extruded by Bgs3
        (PMID:42786154). Not shown for the other variants.
  notes: >-
    NEW module (2026-11), built after reviewing S. pombe bgs1, bgs3, bgs4 and Ghs2
    (SPAC17G6.11c). Boundary decisions:
    (1) Rho1 is inside because it is a structural regulatory subunit of the
    holoenzyme (PMID:8602515, PMID:40021629). Its GEFs (Rgf1, Rgf3) and other
    effectors are outside.
    (2) Synthase partners that only control trafficking or localization (Sbg1 for
    Bgs1, Smi1, exomer, TRAPP-II, Myo52) are outside. Ghs2 is inside, as an
    optional third part, because its GH16 catalytic residues are needed and its
    loss reduces branched glucan, so it is proposed to modify the product, not just
    deliver the synthase.
    (3) S. pombe Bgs2 (spore wall) shares PANTHER subfamily SF48 with Fks1/Gsc2
    and is mentioned, not modelled.
    (4) alpha-1,3-glucan (Ags1 with Aah1/Aah3) and chitin
    (fungal_chitin_chitosan_synthesis) are separate modules.
    The linear/branched split of GO:0003843 (GO:0140753, GO:0140752) rests on the
    wall composition of mutants. The Bgs3-Ghs2 finding that a separate GH16
    protein makes branches calls into question whether any synthase is itself
    "branched". This is recorded as a knowledge gap, not changed here.
knowledge_gaps:
  - gap_statement: >-
      The enzyme that forms the beta-1,6 branch points of fungal
      beta-1,3-glucan has not been identified biochemically. For S. pombe Bgs3 the
      GH16 partner Ghs2 is the proposed brancher, but its reaction is unassayed.
      For Bgs4, the "branched" synthase, no branching partner is known, and no
      purified synthase has been shown to branch.
    boundary: >-
      Genetic, localization, co-IP and solid-state NMR data (PMID:42786154) link
      Ghs2 to branched glucan. Linkage analysis of a reconstituted product is
      missing.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: Decides whether branching is a synthase property or a partner activity, which affects
      GO's linear/branched synthase terms and the target of Kre6-directed antifungals.
    resolution: Reconstitute purified Bgs3 (and Bgs4) with and without Ghs2 or Ghs2-E419A in proteoliposomes
      and analyse the product linkages by NMR or methylation analysis.
