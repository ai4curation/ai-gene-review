id: MODULE:fungal_beta_1_3_glucan_synthesis
title: Fungal beta-1,3-glucan synthesis at the plasma membrane
description: >-
  Beta-1,3-glucan is the main structural polysaccharide of most fungal cell
  walls and septa. It is made at the plasma membrane by glucan synthase, a
  multi-pass GT48 (FKS family) glycosyltransferase. The synthase transfers
  glucose from cytosolic UDP-glucose to the growing chain at an active site on
  the cytosolic face and threads the chain through a transmembrane channel into
  the wall. The small GTPase Rho1 is the regulatory subunit: GTP-bound Rho1
  binds the synthase and is needed for its activity. Many fungi have several
  synthase paralogs with distinct jobs. Saccharomyces cerevisiae has Fks1 and
  Gsc2/Fks2. Schizosaccharomyces pombe has four: Bgs1 makes the linear
  beta-1,3-glucan of the primary septum, Bgs4 makes the major branched
  beta-1,3-glucan of the wall and secondary septum, Bgs2 acts in the spore wall,
  and Bgs3 is essential but its product is less well defined. Bgs3 works with
  Ghs2, a Kre6-related membrane protein with an extracellular GH16 domain. In
  the current model Ghs2 adds beta-1,6-linked branches to the chain Bgs3
  extrudes, but that reaction has not been assayed. UDP-glucose supply,
  synthase trafficking and localization factors, Rho1 GEFs and GAPs, and later
  cross-linking and remodeling of wall glucan by GH72/GH16/GH17 enzymes are
  outside the module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0071970
    title: fungal-type cell wall (1->3)-beta-D-glucan biosynthetic process
    statement: Module-level process concept.
  - source_id: PMID:36949198
    title: Structural and mechanistic insights into fungal β-1,3-glucan synthase FKS1.
    statement: >-
      Cryo-EM structures of S. cerevisiae Fks1 place the active site at the
      membrane-cytoplasm interface and show a glucan path across the membrane.
    supporting_text: >-
      These structures reveal the active site of the enzyme at the membrane-cytoplasm
      interface and a glucan translocation path spanning the membrane bilayer.
  - source_id: PMID:40021629
    title: Cryo-EM structure of the β-1,3-glucan synthase FKS1-Rho1 complex.
    statement: >-
      Structure of the Fks1-Rho1 holoenzyme. Rho1 sits between the GT domain and
      TM7-15, and binding is enhanced by GTPgammaS.
    supporting_text: >-
      The
      GS holoenzyme comprises the glycosyltransferase FKS1 and its regulatory factor
      Rho1, a small GTPase.
  - source_id: PMID:34959732
    title: Echinocandin Drugs Induce Differential Effects in Cytokinesis Progression and Cell Integrity.
    statement: >-
      Summary of the S. pombe synthases: linear septum glucan from Bgs1,
      branched wall glucan from Bgs4, Bgs3 essential with unknown function.
      This is the definition reference for GO:0140752 and GO:0140753.
    supporting_text: Bgs3 is essential, although its function remains unknown
  - source_id: PMID:42786154
    title: A bipartite glucan synthase-remodeler module organizes branched glucan assembly in the fungal cell wall.
    statement: >-
      Ghs2 is an obligate partner of Bgs3 and is proposed to branch the nascent
      Bgs3 chain. Sbg1 is the analogous partner of Bgs1.
    supporting_text: >-
      these findings support a model in which Bgs3 synthesizes
      linear β-1,3-glucan and Ghs2 subsequently introduces β-1,6-linked branch points
      onto the nascent polymer
  - source_id: file:SCHPO/bgs3/bgs3-bioinformatics/RESULTS.md
    title: Re-analysis of the deposited AlphaFold3 Ghs2-Bgs3 model (PMID:42786154)
    statement: >-
      In the authors' deposited AlphaFold3 model, the Ghs2-Bgs3 TM-TM interface
      is confident, but the GH16 position relative to the Bgs3 extrusion pore is
      not. The module therefore does not encode a structural placement.
    supporting_text: AF3 does not know where the GH16 domain sits relative to Bgs3
