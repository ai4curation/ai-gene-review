          statement: LBP and soluble CD14 each act as mobile carriers that deliver triacylated lipopeptides
            to TLR1-TLR2 and are not part of the final complex.
          supporting_text: either LBP or sCD14 can drive ternary complex formation and TLR activation
            by acting as mobile carriers of triacylated lipopeptides or lipoproteins
        - source_id: PMID:23430250
          statement: The carriers dissociate from the receptor complex.
          supporting_text: However, neither LBP nor sCD14 was physically associated with the final ternary
            complex
        gocam_associations:
