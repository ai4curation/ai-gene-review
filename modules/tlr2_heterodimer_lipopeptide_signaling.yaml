          statement: TLR2 heterodimers with TLR1 and TLR6 pre-exist on the cell surface.
          supporting_text: Our data show that TLR2 forms heterodimers with TLR1 and TLR6 and that these
            heterodimer pre-exist and are not induced by the ligand.
