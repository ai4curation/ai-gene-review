  - order: 2
    role: receptor recognition
    node:
      id: tlr2_heterodimer_recognition
      label: TLR2 heterodimer recognition
      module_type: REGULATORY_STEP
      description: Pre-formed TLR2 heterodimers at the cell surface recognise lipopeptide; the partner
