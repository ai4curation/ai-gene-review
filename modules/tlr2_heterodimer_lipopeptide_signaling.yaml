id: MODULE:tlr2_heterodimer_lipopeptide_signaling
title: TLR2-heterodimer lipopeptide sensing module
description: Recognition of bacterial lipopeptides by TLR2 heterodimers and the first steps of the MyD88-dependent
  signal. LBP and CD14 deliver the lipopeptide; TLR2 pairs with TLR1 for triacylated or with TLR6 for
  diacylated lipopeptides; the PIP2-anchored sorting adaptor TIRAP recruits MYD88, which recruits the
  kinase IRAK4. Downstream TRAF6, TAK1 and NF-kappaB steps are shared with other MyD88-dependent TLRs
  and are modelled in the toll-like receptor signaling module.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: PMID:19931471
  statement: TLR2 recognises di- and triacylated lipopeptides, and the partner (TLR1 or TLR6) sets the
    specificity.
  supporting_text: Toll-like receptor 2 (TLR2) initiates potent immune responses by recognizing diacylated
    and triacylated lipopeptides. Its ligand specificity is controlled by whether it heterodimerizes with
    TLR1 or TLR6.
module:
