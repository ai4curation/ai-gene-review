notes: 'Written as the reference representation for GO-CAMs 5fb9cc0600000727 and 5fce9b7300000030, whose
  receptor activities use GO:0001875 (lipopolysaccharide immune receptor activity) for lipopeptide recognition.
  Here the heterodimer carries GO:0038187 and the ligand specificity is expressed by the partner subunit''s
  binding term. Downstream steps: modules/toll_like_receptor_signaling.yaml.'
