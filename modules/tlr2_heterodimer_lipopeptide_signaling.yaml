    term:
      id: GO:0038123
      label: toll-like receptor TLR1:TLR2 signaling pathway
  - preferred_term: toll-like receptor TLR6:TLR2 signaling pathway
    term:
      id: GO:0038124
      label: toll-like receptor TLR6:TLR2 signaling pathway
  context:
    taxa:
