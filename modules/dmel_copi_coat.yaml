id: MODULE:dmel_copi_coat
title: COPI coatomer in Drosophila melanogaster
description: >-
  Coatomer is the heptameric coat of COPI vesicles, which mediate retrograde transport from
  the Golgi apparatus to the endoplasmic reticulum and transport between Golgi cisternae.
  Coatomer is recruited en bloc to membranes by the small GTPase Arf1 in its GTP-bound form
  and binds cargo with dilysine and related sorting signals. Structurally it consists of a
  B-subcomplex (alpha, beta' and epsilon subunits) that forms the outer cage-like layer and
  an F-subcomplex (beta, gamma, delta and zeta subunits) that resembles the clathrin adaptor
  complexes and contacts the membrane.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000087
  title: 'FlyBase gene group COPI: Coat protein complex i'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as coat protein complex i (COPI);
    this module models that group.
- source_id: GO:0030126
  title: COPI vesicle coat
  statement: >-
    GO term grounding the module as COPI vesicle coat.
notes: >-
  Boundary. The module contains the seven coatomer subunits. The Arf1 GTPase (Arf79F in Drosophila),
  its GEFs and GAPs regulate coat recruitment and are context, not parts. FlyBase groups realized
  by this module: COPI (FBgg0000087). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_copi_coat.yaml. Genes without a UniProtKB entry (mostly non-coding RNAs)
  are grounded to their FlyBase gene ids. None of the member genes has a gene review yet unless
  noted.
