notes: >-
  Boundary. The module groups the FlyBase elongation-factor complexes; RNA polymerase II is
  in dmel_nuclear_rna_polymerases. Eaf and Su(Tpl) are members of both SEC and LEC, and ear
  of both SEC and TFIIF, as in FlyBase. P-TEFb is a component of SEC in mammals but FlyBase
  lists it as a separate group, which is followed here. The testis-specific PAF1C is modelled
  as a variant of PAF1C because its subunits are testis paralogs of the somatic subunits;
  Ski8 (homolog of the PAF1C subunit WDR61/SKIC8) is listed by FlyBase in the testis variant.
  The 7SK snRNA genes have no protein product and are grounded to FlyBase gene ids. FlyBase
  groups realized by this module: FACT (FBgg0000282), P-TEFB (FBgg0001639), 7SKRNP (FBgg0001641),
  LEC (FBgg0001724), PAF1C (FBgg0001726), NELF (FBgg0001727), DSIF (FBgg0001728), SEC (FBgg0001729),
  ELO (FBgg0001733), PAF1C-T (FBgg0002094). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_rnapii_elongation_complexes.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
