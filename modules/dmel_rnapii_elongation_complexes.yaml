id: MODULE:dmel_rnapii_elongation_complexes
title: RNA polymerase II elongation complexes in Drosophila melanogaster
description: >-
  After initiation, RNA polymerase II pauses shortly downstream of most Drosophila promoters,
  held by DSIF (Spt4-Spt5) and NELF. Release into productive elongation requires P-TEFb (Cdk9-CycT),
  which phosphorylates NELF, Spt5 and the polymerase C-terminal domain; P-TEFb is held inactive
  by Hexim within the 7SK snRNP and is also recruited within the super elongation complex
  (SEC), which carries the ELL elongation factor Su(Tpl). The related little elongation complex
  (LEC) promotes transcription of snRNA genes. During elongation, the PAF1 complex couples
  polymerase to co-transcriptional histone modification, FACT reorganizes nucleosomes in front
  of and behind the polymerase, and elongin stimulates the elongation rate.
status: DRAFT
scope: CONCRETE
