id: MODULE:bacterial_cytochrome_bc1_complex
title: Bacterial cytochrome bc1 complex (ubiquinol:cytochrome c oxidoreductase)
description: >-
  Reusable bacterial module for the three-subunit cytochrome bc1 complex
  (respiratory complex III). PetA supplies the mobile Rieske 2Fe-2S branch,
  PetB is the transmembrane cytochrome b core containing the two quinone sites
  and b hemes, and PetC is the cytochrome c1 output branch. Together they
  oxidize quinol, reduce periplasmic cytochrome c, and operate the Q cycle to
  support vectorial proton movement. The module excludes unrelated KEGG
  ppu00190 complexes and the non-homologous alternative complex III systems.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0045275
    title: respiratory chain complex III
    statement: >-
      GO:0045275 grounds the assembled cytochrome bc1 complex.
  - source_id: GO:0008121
    title: ubiquinol-cytochrome-c reductase activity
    statement: >-
      GO:0008121 captures the emergent quinol:cytochrome c oxidoreductase
      reaction performed by the assembled PetABC complex.
  - source_id: KEGG:ppu00190
    title: Pseudomonas putida KT2440 oxidative phosphorylation
    statement: >-
      PP_1317-PP_1319 encode the contiguous PetA, PetB, and PetC structural
      subunits of the P. putida KT2440 cytochrome bc1 complex.
notes: >-
  PetA/Q88N95, PetB/Q88N94, and PetC/Q88N93 form the complete canonical
  bacterial complex. The whole-complex GO:0008121 activity should be represented
  as a contribution for individual subunits, with direct electron-transfer,
  cofactor-binding, and structural roles kept at the corresponding leaves.
