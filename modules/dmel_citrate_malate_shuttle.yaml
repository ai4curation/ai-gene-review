id: MODULE:dmel_citrate_malate_shuttle
title: Citrate-malate shuttle in Drosophila melanogaster
description: >-
  The citrate-malate shuttle moves acetyl units from mitochondria to the cytosol for fatty
  acid and sterol synthesis and for histone acetylation. Citrate made in the mitochondrial
  matrix is exported by the mitochondrial citrate carrier, encoded in Drosophila by scheggia
  (sea), in exchange for malate. In the cytosol ATP-citrate lyase (Acly) cleaves citrate into
  acetyl-CoA and oxaloacetate, and cytosolic malate dehydrogenase (Mdh1) reduces the oxaloacetate
  to malate, which can return to the mitochondria through the citrate carrier or be decarboxylated
  by malic enzyme.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002242
  title: 'FlyBase gene group CIMALSH: Citrate-malate shuttle'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as citrate-malate shuttle (CIMALSH);
    this module models that group.
- source_id: GO:0006843
  title: mitochondrial citrate transmembrane transport
  statement: >-
    GO term grounding the module as mitochondrial citrate transmembrane transport.
notes: >-
  Boundary. The module covers the three FlyBase members. Mitochondrial citrate synthase and
  the cytosolic NADP-malic enzymes (see the cytosolic NADPH regeneration module) are adjacent
  steps and not parts. The citrate carrier function of Sea and the enzyme functions are assigned
  by orthology to the conserved mammalian proteins. The module is grounded to mitochondrial
  citrate transmembrane transport because the newer GO term citrate-malate shuttle (GO:7770108)
  is not yet in the ontology release used for validation; it should replace the concept once
  available. FlyBase groups realized by this module: CIMALSH (FBgg0002242). Participants were
  generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_citrate_malate_shuttle.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
