        locations:
        - preferred_term: extracellular region
          term:
            id: GO:0005576
            label: extracellular region
        role_description: >-
          Supplies the inhibitory peptide of the oscillator. Only the dynorphin arm of this precursor
          is modelled here; its other peptides and its roles in striatal, hippocampal and spinal
          circuits are outside the module.
        evidence:
        - source_id: PMID:19776272
          title: Regulation of gonadotropin-releasing hormone secretion by kisspeptin/dynorphin/neurokinin
            B neurons in the arcuate nucleus of the mouse.
          statement: Mouse in situ hybridisation establishing that the arcuate kisspeptin neurons carry
            the dynorphin gene and both receptors, so the inhibition is autosynaptic.
          supporting_text: Kiss1 neurons in the Arc of female mice not only express the Dyn and NKB
            genes but also the NKB receptor gene (NK3) and the Dyn receptor
        - source_id: PMID:27549338
          title: High-frequency stimulation-induced peptide release synchronizes arcuate kisspeptin
            neurons and excites GnRH neurons.
          statement: The peptide is released by the population's own high-frequency firing, alongside
            neurokinin B.
          supporting_text: High-frequency photostimulation of Kiss1(ARH) neurons evoked local release
            of excitatory (NKB) and inhibitory (dynorphin) neuropeptides, which were found to synchronize
            the Kiss1(ARH) neuronal firing
        - source_id: PMID:17823266
          title: Kisspeptin neurons in the arcuate nucleus of the ewe express both dynorphin A and neurokinin
            B.
          statement: The same three-peptide phenotype in sheep, where much of the pulse-generator
            physiology was done.
          supporting_text: Most arcuate kisspeptin neurons express estrogen receptor-alpha, as do a
            set of arcuate neurons that contain both dynorphin and neurokinin B (NKB), suggesting that
            all three neuropeptides are colocalized in the same cells
      - id: kor_receptor
        label: Kappa-opioid receptor on KNDy neurons
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: OPRK1
            term:
              id: UniProtKB:P41145
              label: Kappa-type opioid receptor
          description: >-
