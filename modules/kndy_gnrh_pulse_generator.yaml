- id: PMID:19079066
  title: TAC3 and TACR3 mutations in familial hypogonadotropic hypogonadism reveal a key role for
    Neurokinin B in the central control of reproduction.
  findings:
  - statement: Homozygous loss-of-function mutations in TAC3 or TACR3 cause normosmic congenital
      hypogonadotropic hypogonadism with pubertal failure, establishing that neurokinin B acting
      through NK3R is required for the central control of human reproduction.
    supporting_text: We report four human pedigrees with severe congenital gonadotropin deficiency
      and pubertal failure in which all affected individuals are homozygous for loss-of-function
      mutations in TAC3 (encoding Neurokinin B) or its receptor TACR3 (encoding NK3R)
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read; the pedigree and conclusion quotes verify verbatim. The
      paper also notes that a central NK3R agonist suppressed luteinizing hormone in
      oestrogen-primed rats, which is why the module does not treat the sign of the response as
      uniform across species.
