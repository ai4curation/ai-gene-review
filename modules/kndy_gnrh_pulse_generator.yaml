            term:
              id: GO:0016498
              label: neuromedin K receptor activity
        function:
          preferred_term: neuromedin K receptor activity
          term:
            id: GO:0016498
            label: neuromedin K receptor activity
        processes:
        - preferred_term: phospholipase C-activating tachykinin receptor signaling pathway
          term:
            id: GO:0007209
            label: phospholipase C-activating tachykinin receptor signaling pathway
        - preferred_term: neuropeptide signaling pathway
          term:
            id: GO:0007218
            label: neuropeptide signaling pathway
        locations:
