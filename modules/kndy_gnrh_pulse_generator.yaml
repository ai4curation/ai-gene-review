          term:
            id: GO:0038003
            label: G protein-coupled opioid receptor signaling pathway
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: >-
          Transduces the co-released dynorphin signal on the KNDy neuron. Agonists suppress firing of
          every arcuate kisspeptin neuron tested and a selective antagonist blocks that suppression;
          in the burst paradigm the receptor acts presynaptically, because a kappa agonist attenuates
          the neurokinin B-mediated depolarisation while an NK3R agonist still excites the neuron in
          its presence.
        evidence:
        - source_id: PMID:23744641
          title: Neurokinin B activates arcuate kisspeptin neurons through multiple tachykinin receptors
            in the male mouse.
          statement: >-
            Receptor-level pharmacology: a kappa agonist suppresses firing of all arcuate kisspeptin neurons
            and a selective kappa antagonist blocks it completely.
          supporting_text: Dynorphin and the κ-opioid receptor agonist U50-488 evoked a potent suppression
            of all ARN kisspeptin neuron firing that was blocked completely by the κ-opioid receptor
            antagonist nor-Binaltorphimine
        - source_id: PMID:27549338
          title: High-frequency stimulation-induced peptide release synchronizes arcuate kisspeptin
            neurons and excites GnRH neurons.
          statement: >-
            Where the receptor acts in the burst: kappa signalling reduces the neurokinin B-mediated
            depolarisation presynaptically, by inhibiting release of the peptide.
          supporting_text: the κ-opioid receptor agonist U69,593 markedly attenuated the slow EPSP,
            whereas the selective κ-antagonist nor-BNI enhanced the ChR2-evoked slow EPSP, indicative
            of κ-opioid receptor-mediated presynaptic inhibition of NKB release
        - source_id: PMID:19776272
          title: Regulation of gonadotropin-releasing hormone secretion by kisspeptin/dynorphin/neurokinin
            B neurons in the arcuate nucleus of the mouse.
          statement: Long-term genetic disruption of the ligand or the receptor blunts the rise in
            luteinizing hormone after ovariectomy, so the arm matters in vivo and not only in slices.
          supporting_text: using Dyn and KOR knock-out mice, we found that long-term disruption of Dyn/KOR
            signaling compromises the rise of LH after ovariectomy
      connections:
      - source: dynorphin_ligand
        target: kor_receptor
        connection_type: POSITIVELY_REGULATES
        description: Dynorphin A binding activates the kappa-opioid receptor on the same population.
      knowledge_gaps:
      - gap_statement: Whether dynorphin acting on the kappa-opioid receptor is what ends each pulse is
          not settled. Kappa agonists silence these neurons and a kappa antagonist potentiates the
          peptide-evoked depolarisation, but blocking the receptor does not start firing in quiescent
          KNDy neurons, and the inhibition of agonist-evoked activity by dynorphin was seen only in
          gonad-intact and not in castrate mice, so what sets the interpulse interval, and whether the
          kappa receptor sits pre- or postsynaptically on these cells, remain open.
        boundary: >-
          The sufficiency of dynorphin-kappa signalling as the pulse terminator and the timing mechanism
          of the interpulse interval. Not in question: that dynorphin inhibits these neurons through the
          kappa receptor, and that losing the arm blunts the post-ovariectomy rise in luteinizing hormone.
        gap_kind:
        - BIOLOGY
        status: OPEN
        significance: The oscillator's period is the quantity the circuit exists to set; an inhibitory
          step that is necessary but not sufficient to time it implies at least one further mechanism,
          which no current module step represents.
        provenance:
        - reference_id: PMID:23744642
