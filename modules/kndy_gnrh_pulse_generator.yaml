          full_text_unavailable: true
          supporting_text: Dynorphin reduced spontaneous KNDy neuron activity, but antagonism of κ-opioid
            receptors (KOR) failed to induce firing activity in quiescent KNDy neurons
        - reference_id: PMID:27549338
          reference_section_type: DISCUSSION
          supporting_text: the κ-opioid receptor agonist U69,593 markedly attenuated the slow EPSP,
            whereas the selective κ-antagonist nor-BNI enhanced the ChR2-evoked slow EPSP, indicative
            of κ-opioid receptor-mediated presynaptic inhibition of NKB release
