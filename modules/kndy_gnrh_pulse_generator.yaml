          term:
            id: GO:0003925
            label: G protein activity
        processes:
        - preferred_term: phospholipase C-activating tachykinin receptor signaling pathway
          term:
            id: GO:0007209
            label: phospholipase C-activating tachykinin receptor signaling pathway
        locations:
        - preferred_term: cytoplasmic side of plasma membrane
          term:
            id: GO:0009898
            label: cytoplasmic side of plasma membrane
        role_description: >-
          The nucleotide switch that couples the activated receptor to phospholipase C beta. The
          slice evidence for this step in KNDy neurons is that intracellular GDP-beta-S abolishes the
