          statement: Human loss-of-function evidence that the ligand is required for the central
            control of the axis.
          supporting_text: We report four human pedigrees with severe congenital gonadotropin deficiency
            and pubertal failure in which all affected individuals are homozygous for loss-of-function
            mutations in TAC3 (encoding Neurokinin B) or its receptor TACR3 (encoding NK3R)
        - source_id: PMID:25574869
          title: Neurokinin B is critical for normal timing of sexual maturation but dispensable for
            adult reproductive function in female mice.
          statement: >-
            Mouse knockout: the ligand is needed for the timing of sexual maturation but adult fertility is
            retained, so the module is a modulator of pulse pattern rather than the only drive.
          supporting_text: Tac2-/- females had profound delays in sexual maturation, with time to vaginal
            opening and first estrus occurring significantly later than controls
      - id: nk3r_receptor
        label: Neurokinin-3 receptor (NK3R) on KNDy neurons
