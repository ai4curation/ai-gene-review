      description: >-
        The module's output. The depolarised GnRH neuron releases its decapeptide from terminals at
        the median eminence into the hypophysial portal circulation, in pulses whose timing follows
        the arcuate population's synchronised episodes. What the pituitary then does with that signal
        is downstream of this module.
      concepts:
      - preferred_term: gonadotropin-releasing hormone secretion
        description: >-
          No GO class exists for this process; requested in this document's proposed_new_terms. The
          grounded process on the annoton below names the pituitary consequence instead.
