              subunit.
          - source: gq_alpha_gnrh
            target: trpc_cation_channel
            connection_type: POSITIVELY_REGULATES
            description: >-
              Indirect: the route runs through phospholipase C beta, PIP2 hydrolysis and depletion and
              cSrc activation, steps this module does not represent as annotons. The reviewed GO-CAM
              uses an indirectly-positively-regulates predicate for the same edge.
          knowledge_gaps:
          - gap_statement: Which TRPC subunit or subunits carry the kisspeptin-activated cation current
              in GnRH neurons is not established. Six TRPC transcripts are present in these neurons,
              the current is defined only by TRPC-blocker pharmacology, and TRPC4-alpha is identified
              as a PIP2-interacting candidate by single-cell transcript detection rather than by
              subunit-specific loss of the current.
            boundary: >-
              The subunit composition of the channel. Not in question: that a receptor-operated TRPC-like
              non-selective cation conductance carries the depolarisation, and that its activation requires
              PIP2 depletion and cSrc.
            gap_kind:
            - BIOLOGY
            status: OPEN
            significance: The channel is where the module's signal becomes an electrical event, and a
              subunit-level answer is what would let the step be annotated to a protein rather than to
              a family.
            provenance:
            - reference_id: PMID:18434521
              reference_section_type: ABSTRACT
              full_text_unavailable: true
              supporting_text: single-cell reverse transcription-PCR analysis revealed that TRPC1, TRPC3,
                TRPC4, TRPC5, TRPC6, and TRPC7 subunits were expressed in GnRH neurons
            - reference_id: PMID:23744639
              reference_section_type: ABSTRACT
              full_text_unavailable: true
              supporting_text: Using single cell RT-PCR, we identified that the mRNA for the PIP(2)-interacting
                TRPC channel subunit, TRPC4α, is expressed in GnRH neurons
      knowledge_gaps:
      - gap_statement: Whether the pulsatile drive reaches GnRH neurons directly from arcuate KNDy
          terminals or through the rostral kisspeptin population is unresolved. Human and sheep
          anatomy show arcuate kisspeptin axons contacting GnRH neurons, and the classical model has
          the peptide released from fibres in the median eminence; but in mouse horizontal slices the
          excitation of GnRH neurons by arcuate stimulation required a glutamatergic relay through
          AVPV/PeN kisspeptin neurons, and it failed in coronal slices that cut that relay.
        boundary: >-
          The anatomical route carrying each pulse in vivo, and whether the two routes contribute in
          different species or in different reproductive states. Not in question: that kisspeptin acting
          on KISS1R on the GnRH neuron is the step that depolarises it.
        gap_kind:
        - BIOLOGY
        status: OPEN
        significance: The two routes differ in what the oscillator's output actually is, a peptide
          released at the median eminence or a glutamatergic synapse onto a second kisspeptin
          population, and so in which cells a lesion or a drug would interrupt the pulse.
        provenance:
        - reference_id: PMID:27549338
          reference_section_type: DISCUSSION
