        - reference_id: PMID:20529119
          reference_section_type: ABSTRACT
          full_text_unavailable: true
          supporting_text: In dual-immunolabeled specimens, fine kisspeptin-immunoreactive axon varicosities
            formed axo-somatic, axo-dendritic and axo-axonal contacts with GnRH neurons
  - order: 5
