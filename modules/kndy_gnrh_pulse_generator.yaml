          title: Definition of the hypothalamic GnRH pulse generator in mice.
          statement: Optogenetic demonstration in freely behaving mice that the arcuate population's
            activity is what makes this release pulsatile.
          supporting_text: The selective optogenetic activation of ARNKISS neurons for 1 min generated
