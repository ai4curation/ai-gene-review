- id: PMID:27549338
  title: High-frequency stimulation-induced peptide release synchronizes arcuate kisspeptin neurons
    and excites GnRH neurons.
  findings:
  - statement: Optogenetic stimulation of arcuate kisspeptin neurons in mouse slices releases
      neurokinin B and dynorphin locally; the resulting slow EPSP is NK3R- and Gq-dependent,
      kappa-opioid signalling inhibits neurokinin B release presynaptically, and GnRH neurons are
      excited through a glutamatergic relay to rostral kisspeptin neurons.
    supporting_text: High-frequency photostimulation of Kiss1(ARH) neurons evoked local release of
      excitatory (NKB) and inhibitory (dynorphin) neuropeptides, which were found to synchronize the
      Kiss1(ARH) neuronal firing
    reference_section_type: ABSTRACT
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text cached and read; the module's claims about the slow EPSP, its receptor
      dependence, the kappa-opioid presynaptic effect and the relay route are each quoted from it.
      The relay route is a slice result in mouse, which is why the module records it as one of two
      route variants rather than as the route.
