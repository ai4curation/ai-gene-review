knowledge_gaps:
- gap_statement: Whether the human infundibular KNDy network generates GnRH pulses by the mechanism
    demonstrated in rodents is not directly established. The human evidence is loss-of-function
    genetics for all four of TAC3, TACR3, KISS1 and KISS1R, the three-peptide phenotype in autopsy
    tissue, and the rise in infundibular neurokinin B expression after menopause; the autosynaptic
    excitation, the dynorphin termination and the synchronised population events have been
    demonstrated only in rodents, sheep, goat and monkey.
  boundary: >-
    The mechanism of pulse generation in the human hypothalamus, as opposed to the necessity of its
    components. Not in question: that the four genes are required for the human axis and that the
    cells carrying them exist in the human infundibular nucleus.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: Pharmacological manipulation of this circuit is already in human use, so which step a
    drug engages in people rather than in rodents is a practical question; and the sign of neurokinin
    B's effect on luteinizing hormone is not uniform across species and routes of administration.
  provenance:
  - reference_id: PMID:19079066
    reference_section_type: DISCUSSION
    supporting_text: These findings establish that NKB action via the NK3R is necessary for the central
      neuroendocrine control of human reproduction
  - reference_id: PMID:1708331
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: These data demonstrate that human menopause is associated with marked increases
      in hypothalamic NKB and SP gene expression.
  - reference_id: PMID:29109258
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: These ARNKISS population events were found to be near-perfectly correlated with
      pulsatile LH secretion
proposed_new_terms:
- proposed_name: gonadotropin-releasing hormone secretion
  proposed_definition: The regulated release of gonadotropin-releasing hormone (GnRH), an amidated
    decapeptide hormone, from a cell. In mammals GnRH is released from hypothalamic neuron terminals
    at the median eminence into the hypophysial portal circulation.
  justification: >-
    GO has classes for the response to GnRH (GO:0097210, GO:0097211), for the hormone's own activity
    (GO:0005183), for its receptor (GO:0004968) and for the pituitary gonadotropin secretion it
    causes (GO:0032274), but none for the release of GnRH itself. The process is the output of this
    module and of every kisspeptin, neurokinin B and dynorphin gene review in this repository, each of
    which currently has to use the pituitary term or a luteinizing hormone term for a hypothalamic
    event.
  proposed_parent:
    id: GO:0030072
    label: peptide hormone secretion
  supported_by:
  - reference_id: PMID:34939256
    reference_section_type: LITERATURE_REVIEW
    supporting_text: Interestingly, kisspeptin-10-evoked increases in [Ca2+]i are required for GnRH
      secretion at the median eminence (ME)
  - reference_id: PMID:20194706
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: pulsatile GnRH administration normalized circulating sex steroids, LH release,
      and restored fertility in one subject
- proposed_name: regulation of gonadotropin-releasing hormone secretion
  proposed_definition: Any process that modulates the frequency, rate or extent of the release of
    gonadotropin-releasing hormone from a cell.
  justification: >-
    What the KNDy circuit does is set the frequency and amplitude of GnRH release, and no class
    expresses that. The available terms name the pituitary outcome (GO:0033686 positive regulation of
    luteinizing hormone secretion, GO:0032278 positive regulation of gonadotropin secretion), so a
    hypothalamic neuron that patterns GnRH output is currently annotated to a pituitary secretion
    process two steps downstream of what it does.
  proposed_parent:
    id: GO:0046883
    label: regulation of hormone secretion
  supported_by:
  - reference_id: PMID:19776272
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: We propose a model whereby NKB and dynorphin act autosynaptically on kisspeptin
      neurons in the Arc to synchronize and shape the pulsatile secretion of kisspeptin and drive the
      release of GnRH from fibers in the median eminence
  - reference_id: PMID:24863620
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: the increase in LH pulse frequency was delayed and that the LH pulse amplitude
      was reduced in response to NK3R antagonism
- proposed_name: kisspeptin receptor activity
  proposed_definition: Combining with a kisspeptin, and transmitting the signal across the membrane by
    activating an associated G protein.
  justification: >-
    GO has kisspeptin receptor binding (GO:0031773) for the ligand side but no receptor activity term
    for KISS1R, so the receptor's own function can only be stated as the generic neuropeptide
    receptor activity (GO:0008188) used in this module and in the KISS1R and Kiss1r gene reviews. Its
    sibling neuropeptide receptors have specific terms, including the neuromedin K receptor activity
    (GO:0016498) this module uses for NK3R and the dynorphin receptor activity (GO:0038048) it uses
    for OPRK1. The KISS1 gene review separately requests the pathway term, kisspeptin receptor
    signaling pathway.
  proposed_parent:
    id: GO:0008188
    label: neuropeptide receptor activity
  supported_by:
  - reference_id: PMID:11457843
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: They bound with low nanomolar affinities to rat and human GPR54 expressed in Chinese
      hamster ovary K1 cells and stimulated PIP(2) hydrolysis
  - reference_id: PMID:39151001
    reference_section_type: ABSTRACT
    full_text_unavailable: true
    supporting_text: structure of KISS1R-Gq complex bound to the endogenous agonist KP54
