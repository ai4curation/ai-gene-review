        - source_id: PMID:27549338
          title: High-frequency stimulation-induced peptide release synchronizes arcuate kisspeptin
            neurons and excites GnRH neurons.
          statement: >-
            Expression evidence for the module's boundary: the receptor is on the oscillator's own cells,
            not on the GnRH neurons or the rostral kisspeptin population.
          supporting_text: Given that essentially all Kiss1ARH neurons, but not Kiss1AVPV/PeN or GnRH
            neurons, express Tacr3 mRNA
        - source_id: PMID:23744642
