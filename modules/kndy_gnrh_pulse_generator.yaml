        gocam_associations:
        - model: gomodel:68d5ebd600000736
          activity: gomodel:68d5ebd600000736/68d5ebd600000744
          title: Neuromedin K (Neurokinin B/NKB) binding to its receptor (TACR3/NK3R) triggers phospholipase
            C-activating G protein-coupled receptor signaling pathway (Human)
        evidence:
        - source_id: PMID:27549338
          title: High-frequency stimulation-induced peptide release synchronizes arcuate kisspeptin
            neurons and excites GnRH neurons.
          statement: G protein dependence of the step in the KNDy neuron itself, shown by dialysing a
