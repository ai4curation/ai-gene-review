id: MODULE:kndy_gnrh_pulse_generator
title: Arcuate KNDy neuron GnRH pulse generator module
description: >-
  The hypothalamic oscillator that converts tonic neuroendocrine state into the pulsatile
  gonadotropin-releasing hormone (GnRH) drive the reproductive axis requires. Its cells are the
  arcuate (infundibular) KNDy neurons, which co-express kisspeptin (KISS1), neurokinin B (the TAC3
  product) and dynorphin (the PDYN product). Three neuropeptide steps make the loop: neurokinin B
  released by the population acts back on NK3R (TACR3) on the same neurons, recruiting and
  synchronising them into a burst; dynorphin co-released during that burst acts on the kappa-opioid
  receptor (OPRK1) to inhibit further neurokinin B release and so terminate it; and the burst's
  kisspeptin output acts on KISS1R (GPR54) on GnRH neurons, where Gq/11, phospholipase C and a
  TRPC-like cation conductance depolarise the neuron and drive GnRH release at the median eminence.
  Estradiol acting through estrogen receptor alpha (ESR1) on these same neurons represses all three
  neuropeptide genes and their receptors, which is how gonadal steroid negative feedback sets pulse
  frequency. The module stops at GnRH release: pituitary GnRHR signalling and gonadotropin secretion
  are downstream, and the same neurons' projection to median preoptic NK3R neurons, which drives heat
  dissipation, is a separate output.
status: DRAFT
scope: CONCRETE
