              title: PTHR15536 PANTHER family review
              statement: The family review accepts receptor ligand activity family-wide for the
                amidated tachykinin released from these precursors, which is the function asserted
                here.
              supporting_text: Every member is the precursor of an amidated tachykinin whose conserved
                C-terminal Phe-Xaa-Gly-Leu-Met motif is what act
          required_function:
            preferred_term: receptor ligand activity
            term:
              id: GO:0048018
              label: receptor ligand activity
        function:
          preferred_term: receptor ligand activity
          term:
            id: GO:0048018
            label: receptor ligand activity
          targets:
          - preferred_term: neuromedin K receptor (NK3R)
            description: Neurokinin B is the preferred agonist of NK3R; it also activates NK1R and
              NK2R with lower potency, which matters for this circuit (see the node's knowledge gap).
        processes:
        - preferred_term: phospholipase C-activating tachykinin receptor signaling pathway
          term:
            id: GO:0007209
            label: phospholipase C-activating tachykinin receptor signaling pathway
        - preferred_term: tachykinin receptor signaling pathway
          term:
            id: GO:0007217
            label: tachykinin receptor signaling pathway
        locations:
        - preferred_term: extracellular region
          term:
            id: GO:0005576
            label: extracellular region
        role_description: >-
          Supplies the excitatory half of the autosynaptic pair. The amidated decapeptide is released
