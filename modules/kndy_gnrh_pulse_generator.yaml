notes: >-
  Boundary. The module is the arcuate KNDy oscillator and its kisspeptin output onto GnRH neurons,
  ending at GnRH release. Four things were considered and deliberately left out. (1) Pituitary
  GnRHR signalling and gonadotropin secretion are downstream of the module's output, happen in a
  different cell type, and are covered elsewhere in this repository by the gonadotropin gene reviews
  (genes/human/CGA, genes/human/FSHR) and the FSH GO-CAM reviews gocams/59dc728000000351 and
  gocams/69b3372b00003343; a gonadotrope module should carry them. (2) The same KNDy neurons project
  to glutamatergic NK3R neurons of the median preoptic nucleus and engage heat-loss effectors, which
  is the hot-flush mechanism and the target of the NK3R antagonists; it reuses the same ligand and
  receptor pair but acts on a different postsynaptic population and is not a step of the pulse
  generator, so it belongs in a separate module. The TAC3, TACR3, Tac2 and Tacr3 gene reviews carry
  that role as a third core function keyed to temperature homeostasis, not to the reproductive
  process terms used here. (3) The prohormone convertases and carboxypeptidase that cut and amidate
  the three precursors are shared secretory machinery, not specific to this circuit. (4) The
  preovulatory surge arm, in which rostral (AVPV/PeN) kisspeptin neurons are stimulated rather than
  inhibited by estradiol, is a different circuit with the opposite sign of feedback; only its
  possible role as a relay for arcuate output appears here, as a route variant.

  Species scope. Mammalia is an envelope, not a claim of uniform retention. The complete circuit has
  been tested in mouse (optogenetics, slice electrophysiology, knockouts); the three-peptide
  phenotype and estrogen receptor alpha co-expression are also established in sheep, the
  estradiol-suppression of infundibular neurokinin B in ovariectomised cynomolgus monkeys, and the
  human evidence is loss-of-function genetics for all four of TAC3, TACR3, KISS1 and KISS1R plus the
  post-menopausal rise in infundibular neurokinin B expression. Per-claim species are stated in each
  evidence statement.

  Grounding. Family selectors use PANTHER subfamilies verified in interpro/panther/panther.obo:
  PTHR15536:SF1 (TAC3, family review interpro/panther/PTHR15536), PTHR16955:SF6 (KISS1, family review
  interpro/panther/PTHR16955), PTHR11438:SF4 (PDYN), PTHR46925:SF1 (NK3R) and the two Gq/11 alpha
  subfamilies PTHR10218:SF329 and PTHR10218:SF328. Both family reviews accept receptor ligand
  activity (GO:0048018) family-wide for their ligand, which is what the two ligand annotons assert;
  PTHR15536 records positive regulation of luteinizing hormone secretion as UNRESOLVED at family
  scope, so that process term is used at module and node level for the mammalian circuit and is not
  asserted on the tachykinin family annoton. No PANTHER family term is asserted for the kisspeptin
  receptor: the PTHR45695 family review found that KISS1R is not a leaf of that tree but of PTHR24230,
  which has no family review here, so the descriptor keeps its exemplars and its PAINT node and omits
  the family id. Ancestral nodes are taken from local PAINT slices only
  (PTN002704209 from interpro/panther/PTHR16955/PTHR16955-paint.tsv, PTN009086039 from the
  PTHR45695 slice); PTHR15536's only PAINT node carries positive regulation of blood pressure, which
  is not a function this module asserts, so the tachykinin ligand carries no ancestral node.

  Gene reviews. TAC3, TACR3, KISS1, KISS1R, PDYN, GNAQ, GNA11, ESR2 (human) and Tac2, Tacr3, Kiss1,
  Kiss1r (mouse) are reviewed in this repository. Five participants are not: ESR1 (the receptor that
  carries the estradiol feedback; ESR2 is reviewed but is not the receptor shown to mediate it),
  OPRK1, GNRH1, TRPC4, and on the downstream side GNRHR and LHB. Their identifiers were read from
  UniProt when this module was written, and the module does not assert anything about them beyond the
  step it models.

  Open loop. The validator reports that the estradiol step is called feedback but has no incoming
  activating edge, so a Boolean translation reads it as a free input. That is correct and deliberate:
  the steroid is made by the gonads in response to the gonadotropins this module's output elicits, so
  the loop closes through the pituitary and the ovary or testis, both of which are outside the
  boundary. Treat estradiol as an exogenous input to this module rather than adding a pituitary or
  gonadal node to close the circle.
module:
  id: kndy_gnrh_pulse_generator
  label: Arcuate KNDy neuron GnRH pulse generator
  module_type: BIOLOGICAL_PROCESS
  description: >-
    A neuropeptide oscillator in one cell population plus its output synapse. Neurokinin B supplies
    recruitment and synchronisation, dynorphin supplies delayed self-inhibition, kisspeptin carries
    the result to the GnRH neuron, and estradiol sets the gain by repressing all three neuropeptide
    genes.
  concepts:
  - preferred_term: gonadotropin-releasing hormone pulse generation
    description: >-
      The module's own process has no GO term: there is no class for gonadotropin-releasing hormone
      secretion or its regulation, only for the pituitary gonadotropin secretion downstream of it
      (GO:0032274) and for responses to GnRH (GO:0097210). Requested in this document's
      proposed_new_terms; the grounded concepts below are the closest existing classes.
  - preferred_term: positive regulation of luteinizing hormone secretion
    term:
      id: GO:0033686
      label: positive regulation of luteinizing hormone secretion
    description: >-
      The closest grounded process for the circuit's mammalian output, and the term both tachykinin
      and both kisspeptin gene reviews use for this role. It names the pituitary consequence rather
      than the hypothalamic process, which is why the ungrounded concept above is retained.
  - preferred_term: positive regulation of gonadotropin secretion
    term:
      id: GO:0032278
      label: positive regulation of gonadotropin secretion
  context:
    taxa:
    - preferred_term: Mammalian lineages with an arcuate KNDy population
      term:
        id: NCBITaxon:40674
        label: Mammalia
      description: >-
        An envelope over the lineages in which the three-peptide arcuate population has been
        demonstrated (mouse, rat, sheep, macaque, human). Neither universal retention nor an origin
        in the mammalian ancestor is asserted; teleost kiss/tac3 systems are organised differently and
        are out of scope.
    cell_types:
    - preferred_term: KNDy neuron
      term:
        id: CL:4023125
        label: KNDy neuron
      description: The oscillator's cell. CL defines it as a hypothalamus kisspeptin neuron that
        coexpresses kisspeptin, neurokinin B and dynorphin, which is exactly the population modelled
        here.
    - preferred_term: hypothalamic gonadotropin-releasing hormone neuron
      term:
        id: CL:0011111
        label: hypothalamic gonadotropin-releasing hormone neuron
      description: The target cell of the module's output step; it is not part of the oscillator.
    anatomical_locations:
    - preferred_term: arcuate nucleus of hypothalamus
      term:
        id: UBERON:0001932
        label: arcuate nucleus of hypothalamus
      description: Called the infundibular nucleus in the human literature.
    - preferred_term: median eminence of neurohypophysis
      term:
        id: UBERON:0002197
        label: median eminence of neurohypophysis
      description: Where the kisspeptin terminals and the GnRH terminals meet the portal vasculature.
    evidence:
    - source_id: PMID:20529119
      title: 'The kisspeptin system of the human hypothalamus: sexual dimorphism and relationship with
        gonadotropin-releasing hormone and neurokinin B neurons.'
      statement: Human autopsy immunocytochemistry placing the cell bodies in the infundibular nucleus
        and their axons on GnRH neurons.
      supporting_text: In dual-immunolabeled specimens, fine kisspeptin-immunoreactive axon varicosities
        formed axo-somatic, axo-dendritic and axo-axonal contacts with GnRH neurons
  parts:
  - order: 1
    role: estradiol negative feedback onto the oscillator
    node:
      id: estradiol_negative_feedback
      label: Estradiol negative feedback onto KNDy neurons
      module_type: REGULATORY_STEP
      description: >-
        The regulatory input that sets pulse frequency. Estradiol acting through estrogen receptor
        alpha on the KNDy neurons themselves represses the genes for all three neuropeptides and for
        two of the receptors, so withdrawal of estradiol (ovariectomy, menopause) raises their
        expression and loss of feedback raises pulse frequency. This is a transcriptional input to the
        oscillator, not one of its peptide steps.
      concepts:
      - preferred_term: estrogen receptor signaling pathway
        term:
          id: GO:0030520
          label: estrogen receptor signaling pathway
      parts:
      - order: 1
        role: estrogen receptor relay in the KNDy neuron
        node:
          id: estradiol_receptor_relay
          label: Estrogen receptor signaling relay
          module_ref: estrogen_receptor_signaling
          description: >-
            The ligand-binding, coregulator-recruitment and transcriptional steps are the generic
            estrogen receptor relay and are included by reference rather than restated. The referenced
            module is a DRAFT and is deliberately generic: it carries both receptors and does not say
            which one acts here. The KNDy-specific claim, that the receptor is alpha and that its
            targets are the three neuropeptide genes, is the sibling node.
          evidence:
          - source_id: PMID:15919741
            title: Regulation of Kiss1 gene expression in the brain of the female mouse.
            statement: The receptor-level requirement in this circuit is specifically estrogen receptor
              alpha, which is why the generic relay is specialised in the sibling node.
            supporting_text: In OVX mice that lacked functional ERalpha, KiSS-1 mRNA did not respond
              to E2 in either the Arc or AVPV, suggesting that ERalpha is essential for mediating the
              inhibitory and stimulatory effects of E2
      - order: 2
        role: repression of the KNDy neuropeptide and receptor genes
        node:
          id: kndy_neuropeptide_gene_repression
          label: Repression of the KNDy neuropeptide genes
          module_type: REGULATORY_STEP
          description: >-
            Estradiol-bound estrogen receptor alpha in the arcuate KNDy neuron lowers transcription of
            Kiss1, Tac3/Tac2 and Pdyn, and of Tacr3 and Oprk1. The sign is specific to this population:
            the same hormone raises Kiss1 in the rostral periventricular population.
          annotons:
          - id: esr1_arcuate_repressor
            label: Estrogen receptor alpha in arcuate KNDy neurons
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ESR1
                term:
                  id: UniProtKB:P03372
                  label: Estrogen receptor
              description: >-
                Human accession read from UniProt. ESR1 has no gene review in this repository; the
                reviewed paralog ESR2 is not the receptor shown to carry this feedback, so it is not
                substituted here.
            function:
              preferred_term: nuclear estrogen receptor activity
              term:
                id: GO:0030284
                label: nuclear estrogen receptor activity
              targets:
              - preferred_term: KISS1
                description: Arcuate Kiss1 transcription is lowered by estradiol and this requires
                  estrogen receptor alpha.
              - preferred_term: TAC3
                description: Arcuate neurokinin B expression is lowered by estradiol in mouse and by
                  estrogen treatment in the ovariectomised macaque infundibular nucleus.
              - preferred_term: PDYN
                description: Arcuate dynorphin expression is lowered by estradiol, as are the Tacr3 and
                  Oprk1 receptor transcripts.
            processes:
            - preferred_term: estrogen receptor signaling pathway
              term:
                id: GO:0030520
                label: estrogen receptor signaling pathway
            - preferred_term: negative regulation of transcription by RNA polymerase II
              term:
                id: GO:0000122
                label: negative regulation of transcription by RNA polymerase II
            locations:
            - preferred_term: nucleus
              term:
                id: GO:0005634
                label: nucleus
            role_description: >-
              Carries the gonadal steroid signal into the oscillator as a transcriptional one. The
              receptor is on the KNDy neurons themselves, so the feedback does not need an
              interneuron.
            evidence:
            - source_id: PMID:15919741
              title: Regulation of Kiss1 gene expression in the brain of the female mouse.
              statement: Mouse genetics identifying the receptor subtype and showing it is on the
                kisspeptin neurons themselves.
              supporting_text: Double-label in situ hybridization revealed that virtually all KiSS-1-expressing
                neurons in the Arc and AVPV coexpress ERalpha
            - source_id: PMID:19776272
              title: Regulation of gonadotropin-releasing hormone secretion by kisspeptin/dynorphin/neurokinin
                B neurons in the arcuate nucleus of the mouse.
              statement: In mouse, estradiol lowers all three neuropeptide transcripts and both
                receptor transcripts in the arcuate nucleus, which is the full set of targets modelled
                here.
              supporting_text: We also found that expression of the Dyn, NKB, KOR, and NK3 in the Arc
                are inhibited by estradiol
            - source_id: PMID:10372719
              title: The effects of hormone replacement therapy on hypothalamic neuropeptide gene
                expression in a primate model of menopause.
              statement: Primate evidence that the suppression is an estrogen effect on the
                infundibular population.
              supporting_text: Both estrogen and estrogen plus progesterone treatments produced a
                marked suppression of the number of infundibular neurons expressing NKB gene transcripts
            - source_id: PMID:1708331
              title: Hypertrophy and increased gene expression of neurons containing neurokinin-B and
                substance-P messenger ribonucleic acids in the hypothalami of postmenopausal women.
              statement: >-
                The human read-out of losing this feedback: infundibular neurokinin B neurons hypertrophy and
                their transcript rises after menopause.
              supporting_text: the numbers of labeled neurons/tissue increased 6-fold (SP) and 15-fold
                (NKB) in the postmenopausal infundibular nucleus
      connections:
      - source: estradiol_receptor_relay
        target: kndy_neuropeptide_gene_repression
        connection_type: CAUSES
        description: Ligand-bound receptor acting on chromatin is what lowers the neuropeptide
          transcripts.
  - order: 2
    role: autosynaptic neurokinin B excitation and burst synchronisation
    node:
      id: nkb_autoexcitation
      label: Neurokinin B autoexcitation of KNDy neurons
      module_type: SIGNALING_PATHWAY
      description: >-
        The recruiting step. Neurokinin B released by the population binds NK3R on the same neurons
        and produces a slow, Gq-coupled depolarisation that spreads through the network and
        synchronises its firing. NK3R is on the KNDy neurons and not on the GnRH neurons, so this
        step is internal to the oscillator.
      concepts:
      - preferred_term: phospholipase C-activating tachykinin receptor signaling pathway
        term:
          id: GO:0007209
          label: phospholipase C-activating tachykinin receptor signaling pathway
      annotons:
      - id: nkb_ligand
        label: Neurokinin B precursors
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Tachykinin-3 (neurokinin B) precursors
            term:
              id: PANTHER:PTHR15536:SF1
              label: TACHYKININ-3
            description: >-
              The family's only subfamily, holding every vertebrate TAC3/tac3 precursor of neurokinin
              B. The reviewed human and mouse exemplars below are the two whose arcuate role is
              documented; the family selector is not a claim that every member runs this circuit.
            representative_members:
            - preferred_term: TAC3 (human)
              term:
                id: UniProtKB:Q9UHF0
                label: Tachykinin-3
            - preferred_term: Tac2 (mouse)
              term:
