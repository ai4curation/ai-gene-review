id: MODULE:dmel_trehalose_metabolism
title: Trehalose synthesis, transport and breakdown in Drosophila melanogaster
description: >-
  Trehalose, a glucose disaccharide, is the main circulating sugar in insect hemolymph. In
  the fat body, trehalose-6-phosphate synthase 1 (Tps1), a bifunctional enzyme with synthase
  and phosphatase domains, makes trehalose from UDP-glucose and glucose-6-phosphate. Trehalose
  leaves the fat body and enters target cells through the facilitative transporter Tret1,
  and in target tissues trehalase (Treh) hydrolyses it into two glucose molecules for glycolysis
  and other uses. Trehalose levels buffer hemolymph sugar and protect against stress.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002044
  title: 'FlyBase gene group TREHB: Trehalose biosynthesis'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as trehalose biosynthesis (TREHB);
    this module models that group.
- source_id: FB:FBgg0002052
  title: 'FlyBase gene group TREHC: Trehalose catabolism'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as trehalose catabolism (TREHC);
    this module models that group.
- source_id: GO:0005992
  title: trehalose biosynthetic process
  statement: >-
    GO term grounding the module as trehalose biosynthetic process.
- source_id: GO:0005993
  title: trehalose catabolic process
  statement: >-
    GO term grounding the module as trehalose catabolic process.
notes: >-
  Tps1 carries both the trehalose-6-phosphate synthase and the trehalose-6-phosphate phosphatase
  activities (flies have no separate phosphatase gene in the group); the annoton gives the
  synthase activity, which defines the committed step. Tret1 is in both FlyBase groups (biosynthesis
  and catabolism) and appears once, between the two enzymes. Treh encodes both secreted and
  intracellular trehalase isoforms. Glycogen and glucose metabolism, which supply and consume
  the substrates, are outside the module. FlyBase groups realized by this module: TREHB (FBgg0002044),
  TREHC (FBgg0002052). Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_trehalose_metabolism.yaml;
  none of the member genes has a gene review yet unless noted.
