      description: GalNAc-bound ASGR1/ASGR2 complexes at the hepatocyte surface are recruited into clathrin/AP-2 coated pits and internalized via DNM2 scission.
    - source: clathrin_ap2_dnm2_internalization
      target: early_endosome_acidification
      connection_type: PROVIDES_INPUT_FOR
      description: Internalized coated vesicles uncoat and fuse with V-ATPase-acidified early sorting endosomes where GalNAc ligands uncouple from ASGR1/ASGR2.
    - source: early_endosome_acidification
      target: ehd1_receptor_recycling
      connection_type: PROVIDES_INPUT_FOR
      description: Ligand-free ASGR1/ASGR2 receptors partition into EHD1-dependent tubular recycling endosomes for rapid return to the sinusoidal plasma membrane.
    - source: early_endosome_acidification
      target: escrt_rab7_late_endosome
      connection_type: PROVIDES_INPUT_FOR
      description: Uncoupled luminal GalNAc conjugates and desialylated glycoproteins progress via ESCRT-I (TSG101) and RAB7A into maturing late endosomes.
    - source: early_endosome_acidification
      target: cytosolic_galnac_escape
      connection_type: PROVIDES_INPUT_FOR
      description: A fraction of internalized GalNAc oligonucleotide payload translocates across the limiting endosomal membrane into the hepatocyte cytosol.
    - source: escrt_rab7_late_endosome
      target: cytosolic_galnac_escape
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Active RAB7A/ESCRT late endosomal maturation sequesters internalized payload into the
        late-endosomal/lysosomal pathway, limiting productive cytosolic escape (PMID:41814093).
    - source: escrt_rab7_late_endosome
      target: ctsd_lysosomal_degradation
      connection_type: PROVIDES_INPUT_FOR
      description: Mature RAB7A-positive late endosomes fuse with lysosomes where CTSD degrades desialylated glycoproteins and sequesters un-escaped conjugates.
  notes: >-
    Constructed for the DELIVEROME and ABM_TRAFFICKING projects to model hepatocyte-specific
    ASGR1/ASGR2 GalNAc-siRNA/ASO delivery and intracellular routing as an executable agent-based
    model (ABM) derived directly from the module graph. All protein participants are grounded to
    completed AIGR gene reviews (human ASGR1, ASGR2, AP2M1, CLTC, DNM2, ATP6V1A, EHD1, TSG101,
    RAB7A, CTSD, and mouse Rab7) and verified PANTHER family/subfamily identifiers.
executable_models:
  - id: asgr_galnac_delivery_abm
    title: Agent-based hepatocyte ASGR1/ASGR2 GalNAc-conjugate uptake, receptor recycling, lysosomal routing, and cytosolic escape model
    model_type: AGENT_BASED
    derivation: DERIVED_FROM_MODULE
    description: >-
      Simulates 100 discrete receptor-ligand / GalNAc-conjugate agents traversing the seven stages
      of hepatocyte ASGR-mediated uptake under uniform uncalibrated default transition rates
      (base_rate = 0.45, competing_inhibitor_factor = 0.25). Under wild-type baseline conditions,
      active RAB7A/ESCRT late endosomal maturation (escrt_rab7_late_endosome) attenuates the
      cytosolic escape transition from acidified sorting endosomes, yielding ~47% receptor recycling
      (ehd1_receptor_recycling), ~43% lysosomal routing/degradation (ctsd_lysosomal_degradation),
      and ~10% productive cytosolic escape (cytosolic_galnac_escape). Note that these percentages
      arise from uniform uncalibrated ABM transition kinetics rather than calibrated clinical
      pharmacokinetics (where only a minuscule portion of endocytosed GalNAc-ASO/siRNA escapes
      into the cytosol in vivo; PMID:29069408), and the RAB7A-depletion escape enhancement (10% -> 47%) is a qualitative
      cross-modality extrapolation from hepatic LNP endosomal escape competition (PMID:41814093).
      Perturbing individual stages reproduces the qualitative directionality of ASGR/clathrin uptake
      blockade, V-ATPase inhibition, EHD1 recycling loss, and RAB7A depletion.
    notes: >-
      Deterministic particle-conserving agent-based simulation (N=100 cargo particles, T=24 steps)
      derived from the module's directed flow connections (PROVIDES_INPUT_FOR) and competing-pathway
      inhibitory edges (NEGATIVELY_REGULATES) using uniform uncalibrated default kinetics. The ~10%
      baseline escape (47/43/10 split) and 10% -> 47% shift upon escrt_rab7_late_endosome loss are
      qualitative outputs of uniform uncalibrated ABM parameters extrapolated from hepatic LNP
      endosomal escape data (PMID:41814093), not calibrated clinical GalNAc-conjugate escape fractions.
    scenarios:
      - id: wt_galnac_hepatocyte_uptake
        label: Wild-type hepatocyte GalNAc uptake (rapid receptor recycling + lysosomal sequestration dominate; ~10% cytosolic escape)
        description: >-
          With all hepatocyte trafficking machinery active, internalized ASGR-GalNAc complexes
          undergo V-ATPase-driven uncoupling in early endosomes and partition primarily between
          EHD1-mediated receptor recycling (47%) and RAB7A/CTSD lysosomal routing (43%), while only
          a small fraction (10%) escapes into the hepatocyte cytosol.
        expected_active:
          - asgr_galnac_binding
          - clathrin_ap2_dnm2_internalization
          - early_endosome_acidification
          - ehd1_receptor_recycling
          - escrt_rab7_late_endosome
          - cytosolic_galnac_escape
          - ctsd_lysosomal_degradation
        expected_outcome_order:
          - ehd1_receptor_recycling
          - ctsd_lysosomal_degradation
          - cytosolic_galnac_escape
        evidence:
          - source_id: PMID:41814093
            title: In vivo endosomal escape assay identifies mechanisms for efficient hepatic LNP delivery.
            statement: In vivo hepatic endosomal escape is restricted to ~8% of internalized nucleic acid payload while the majority remains in endolysosomal/recycling compartments.
            supporting_text: >-
              finding that ~8% of BiP-20 LNPs reach the 
              cytosol within 30 min of administration.
      - id: rab7a_loss_enhanced_escape
        label: RAB7A / late-endosomal maturation loss (blocks lysosomal delivery and increases cytosolic GalNAc payload escape)
        description: >-
          Inactivating escrt_rab7_late_endosome (modeling hepatic Rab7 loss-of-function) prevents
          endosome-to-lysosome routing (ctsd_lysosomal_degradation drops to 0%) and lifts competitive
          sequestration on the sorting endosome, increasing productive cytosolic GalNAc payload
          escape from 10% to 47%.
        settings:
          - element: escrt_rab7_late_endosome
            active: false
        expected_active:
          - asgr_galnac_binding
          - clathrin_ap2_dnm2_internalization
          - early_endosome_acidification
          - ehd1_receptor_recycling
          - cytosolic_galnac_escape
        expected_inactive:
          - escrt_rab7_late_endosome
          - ctsd_lysosomal_degradation
        expected_outcome_order:
          - ehd1_receptor_recycling
          - cytosolic_galnac_escape
          - ctsd_lysosomal_degradation
        evidence:
          - source_id: PMID:41814093
            title: In vivo endosomal escape assay identifies mechanisms for efficient hepatic LNP delivery.
            statement: Loss of Rab7 blocks late endosomal maturation and increases productive cytosolic escape in hepatocytes.
            supporting_text: >-
              Loss of Rab7, a mediator of late endosomal maturation, increased LNP escape.
      - id: clathrin_dnm2_internalization_block
        label: Clathrin / AP-2 / DNM2 internalization block (GalNAc conjugates trapped on sinusoidal ASGR1/ASGR2)
        description: >-
          Inactivating clathrin_ap2_dnm2_internalization (modeling CLTC knockdown, AP2M1 deficiency,
          or dynamin-2 inhibition by dynasore) abolishes coated-pit budding and scission, trapping
          100% of bound GalNAc cargo on cell-surface ASGR1/ASGR2 (asgr_galnac_binding).
        settings:
          - element: clathrin_ap2_dnm2_internalization
            active: false
        expected_active:
          - asgr_galnac_binding
        expected_inactive:
          - clathrin_ap2_dnm2_internalization
          - early_endosome_acidification
          - ehd1_receptor_recycling
          - escrt_rab7_late_endosome
          - cytosolic_galnac_escape
          - ctsd_lysosomal_degradation
        expected_outcome_order:
          - asgr_galnac_binding
          - clathrin_ap2_dnm2_internalization
        evidence:
          - source_id: PMID:14985334
            title: Analysis of clathrin-mediated endocytosis of epidermal growth factor receptor by RNA interference.
            statement: Knockdown of clathrin heavy chain and dynamin produces maximal inhibition of receptor internalization.
            supporting_text: >-
              The knock-downs of 
              clathrin heavy chain and dynamin produced maximal inhibitory effects on the 
              internalization of both receptors.
      - id: vatpase_acidification_block
        label: V-ATPase acidification block (ATP6V1A loss / bafilomycin A1; arrest in neutral nascent vesicles)
        description: >-
          Inactivating early_endosome_acidification prevents endosomal pH drop and Ca2+-dependent
          ASGR-GalNAc uncoupling, arresting internalized complexes in neutral coated/uncoated
          endocytic vesicles (clathrin_ap2_dnm2_internalization) and abolishing recycling,
          lysosomal routing, and cytosolic escape.
        settings:
          - element: early_endosome_acidification
            active: false
        expected_active:
          - asgr_galnac_binding
          - clathrin_ap2_dnm2_internalization
        expected_inactive:
          - early_endosome_acidification
          - ehd1_receptor_recycling
          - escrt_rab7_late_endosome
          - cytosolic_galnac_escape
          - ctsd_lysosomal_degradation
        expected_outcome_order:
          - clathrin_ap2_dnm2_internalization
          - early_endosome_acidification
        evidence:
          - source_id: PMID:33065002
            title: Structures of a Complete Human V-ATPase Reveal Mechanisms of Its Assembly.
            statement: V-ATPase couples V1 ATP hydrolysis to Vo proton transfer to acidify endolysosomal compartments.
            supporting_text: >-
              Vesicular- or vacuolar-type adenosine triphosphatases (V-ATPases) 
              are ATP-driven proton pumps comprised of a cytoplasmic V1 complex for ATP 
              hydrolysis and a membrane-embedded Vo complex for proton transfer.
      - id: ehd1_recycling_block
        label: EHD1 recycling block (diverts sorting-endosome flux into lysosomal degradation and cytosolic escape)
        description: >-
          Inactivating ehd1_receptor_recycling blocks tubular recycling to the sinusoidal surface
          and redirects sorting-endosome flux into the late-endosomal/lysosomal pathway (80%) and
          cytosolic escape (20%).
        settings:
          - element: ehd1_receptor_recycling
            active: false
        expected_active:
          - asgr_galnac_binding
          - clathrin_ap2_dnm2_internalization
          - early_endosome_acidification
          - escrt_rab7_late_endosome
          - cytosolic_galnac_escape
          - ctsd_lysosomal_degradation
        expected_inactive:
          - ehd1_receptor_recycling
        expected_outcome_order:
          - ctsd_lysosomal_degradation
          - cytosolic_galnac_escape
          - ehd1_receptor_recycling
        evidence:
          - source_id: PMID:15020713
            title: Rabenosyn-5 and EHD1 interact and sequentially regulate protein recycling to the plasma membrane.
            statement: Depletion of EHD1 blocks recycling of internalized receptors back to the plasma membrane.
            supporting_text: >-
              Depletion of 
              either EHD1 or Rabenosyn-5 delayed the recycling of transferrin and major 
              histocompatibility complex class I to the plasma membrane.
      - id: ctsd_lysosomal_proteolysis_block
        label: CTSD lysosomal proteolysis block (undegraded cargo accumulates in late endosomes/lysosomes)
        description: >-
          Inactivating ctsd_lysosomal_degradation preserves upstream receptor recycling (47%) and
          cytosolic escape (10%) while causing undegraded cargo to accumulate in the late-endosomal
          depot (escrt_rab7_late_endosome, 43%).
        settings:
          - element: ctsd_lysosomal_degradation
            active: false
        expected_active:
          - asgr_galnac_binding
          - clathrin_ap2_dnm2_internalization
          - early_endosome_acidification
          - ehd1_receptor_recycling
          - escrt_rab7_late_endosome
          - cytosolic_galnac_escape
        expected_inactive:
          - ctsd_lysosomal_degradation
        expected_outcome_order:
          - ehd1_receptor_recycling
          - escrt_rab7_late_endosome
          - cytosolic_galnac_escape
          - ctsd_lysosomal_degradation
        evidence:
          - source_id: PMID:8393577
            title: "Crystal structures of native and inhibited forms of human cathepsin D: implications for lysosomal targeting and drug design."
            statement: Inhibition of cathepsin D blocks aspartic protease degradation inside the lysosomal lumen.
            supporting_text: >-
              Determination of the crystal structures of cathepsin D and a complex with
              pepstatin at 2.5 A resolution provides insights into inhibitor binding and
              lysosomal targeting for this two-chain, N-glycosylated aspartic protease.
