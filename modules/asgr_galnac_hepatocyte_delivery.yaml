id: MODULE:asgr_galnac_hepatocyte_delivery
title: Hepatocyte ASGR1/ASGR2 GalNAc-conjugate uptake and endosomal routing — clathrin/AP-2/DNM2 internalization, V-ATPase acidification, EHD1 receptor recycling vs. ESCRT/RAB7A late-endosomal maturation, CTSD lysosomal degradation, and cytosolic oligonucleotide escape
description: >-
  Hepatocyte-targeted N-acetylgalactosamine (GalNAc)-conjugated siRNA and antisense oligonucleotide
  therapeutics, as well as desialylated plasma glycoproteins, are selectively captured at the
  sinusoidal hepatocyte surface by the hetero-oligomeric asialoglycoprotein receptor complex
  (ASGR1/HL-1 and ASGR2/HL-2). Receptor-ligand complexes are concentrated into clathrin-coated pits
  by the AP-2 adaptor complex (AP2M1) and clathrin heavy chain (CLTC) and severed from the plasma
  membrane by the mechanochemical GTPase dynamin-2 (DNM2). Following vesicle uncoating, V-ATPase
  (ATP6V1A) acidifies the early sorting endosome lumen (pH ~6.0-5.5), triggering Ca2+ loss from the
  C-type lectin carbohydrate-recognition domains of ASGR1/ASGR2 and releasing the GalNAc-conjugate
  payload. From the acidified sorting endosome, flux partitions across three competing branches:
  (1) rapid tubular endocytic recycling of uncoupled ASGR1/ASGR2 back to the sinusoidal plasma
  membrane mediated by EHD1; (2) ESCRT-I (TSG101) multivesicular body sorting and RAB7A-driven
  early-to-late endosomal maturation, which delivers the vast majority of internalized GalNAc
  oligonucleotide and glycoprotein cargo to late endosomes and lysosomes for sequestration or
  hydrolytic/proteolytic turnover (represented by CTSD; PMID:12171918, PMID:29069408); and (3) a
  slow, rate-limiting endosomal membrane translocation step that releases a small productive fraction
  of oligonucleotide payload into the hepatocyte cytosol to engage RISC or RNase H1 (a minuscule
  fraction in vivo for GalNAc conjugates [PMID:29069408], modeled qualitatively as ~10% at baseline
  under uniform uncalibrated ABM transition rates with RAB7A-dependent late-endosomal competition
  extrapolated from hepatic LNP delivery [PMID:41814093]).
status: DRAFT
evidence:
  - source_id: GO:0030246
    title: carbohydrate binding
    statement: Ca2+-dependent C-type lectin recognition of terminal galactose and GalNAc residues by ASGR1 and ASGR2.
  - source_id: GO:0006898
    title: receptor-mediated endocytosis
    statement: Clathrin-, AP-2-, and dynamin-2-mediated internalization of ASGR-GalNAc cargo complexes at the hepatocyte surface.
  - source_id: GO:0048388
    title: endosomal lumen acidification
    statement: V-ATPase-driven proton translocation lowers early endosomal pH to uncouple GalNAc ligands from ASGR1/ASGR2.
  - source_id: GO:0032456
    title: endocytic recycling
    statement: EHD1-dependent tubular recycling returns ligand-free ASGR1/ASGR2 receptors to the hepatocyte plasma membrane.
  - source_id: GO:0008333
    title: endosome to lysosome transport
    statement: ESCRT-I (TSG101) and RAB7A route retained endosomal cargo into late endosomes and lysosomes, competing with cytosolic escape.
  - source_id: PMID:29069408
    title: Asialoglycoprotein receptor 1 mediates productive uptake of N-acetylgalactosamine-conjugated and unconjugated phosphorothioate antisense oligonucleotides into liver hepatocytes.
    statement: >-
      ASGR1 mediates high-affinity hepatocyte uptake of GalNAc-conjugated oligonucleotides via the
      clathrin-dependent endocytic pathway, while only a minuscule fraction of internalized
      oligonucleotide escapes endocytic compartments into the cytoplasm.
    supporting_text: >-
      It is clear, however, that only a minuscule portion of endocytosed ASO escapes into the
      cytoplasmic/nuclear space to mediate target cleavage, while the vast majority remains trapped
      in endocytic compartments and is inactive (4,5).
  - source_id: PMID:41814093
    title: In vivo endosomal escape assay identifies mechanisms for efficient hepatic LNP delivery.
    statement: >-
      In vivo hepatic endosomal escape is restricted by Rab7-mediated late endosomal maturation,
      and loss of Rab7 diverts endosomal cargo away from lysosomal sequestration to increase
      cytosolic delivery.
    supporting_text: Loss of Rab7, a mediator of late endosomal maturation, increased LNP escape.
  - source_id: PMID:12171918
    title: Nonpalmitoylated human asialoglycoprotein receptors recycle constitutively but are defective in coated pit-mediated endocytosis, dissociation, and delivery of ligand to lysosomes.
    statement: >-
      The human hepatic asialoglycoprotein receptor heterocomplex (ASGR1/H1 and ASGR2/H2) internalizes
      desialylated glycoproteins via the clathrin-coated pit pathway and delivers ligand to lysosomes.
    supporting_text: >-
      The hepatic asialoglycoprotein receptor (ASGP-R) internalizes desialylated
      glycoproteins via the clathrin-coated pit pathway and mediates their delivery to
      lysosomes for degradation.
  - source_id: file:human/ASGR1/ASGR1-ai-review.yaml
    title: ASGR1 gene review (human)
    statement: >-
      Major subunit of the hepatic asialoglycoprotein receptor mediating galactose/GalNAc binding
      and clathrin-dependent receptor-mediated endocytosis (UniProtKB:P07306, GO:0030246, GO:0006898).
  - source_id: file:human/ASGR2/ASGR2-ai-review.yaml
    title: ASGR2 gene review (human)
    statement: >-
      Minor subunit of the hepatic asialoglycoprotein receptor complex (UniProtKB:P07307,
      GO:0030246, GO:0006898).
  - source_id: file:human/AP2M1/AP2M1-ai-review.yaml
    title: AP2M1 gene review (human)
    statement: >-
      Tyrosine-motif cargo adaptor coupling plasma-membrane receptors to clathrin-coated pits
      (UniProtKB:Q96CW1, GO:0005048, GO:0072583).
  - source_id: file:worm/dpy-23/dpy-23-ai-review.yaml
    title: dpy-23 gene review (C. elegans)
    statement: >-
      Orthologous metazoan AP-2 mu2 subunit recognizing YxxPhi motifs for clathrin-dependent
      receptor-mediated endocytosis (UniProtKB:P35603, GO:0035615, GO:0072583).
  - source_id: file:human/CLTC/CLTC-ai-review.yaml
    title: CLTC gene review (human)
    statement: >-
      Clathrin heavy chain triskelion lattice assembly for coated-vesicle budding (UniProtKB:Q00610,
      GO:0005198, GO:0006898).
  - source_id: file:human/DNM2/DNM2-ai-review.yaml
    title: DNM2 gene review (human)
    statement: >-
      Mechanochemical GTPase motor driving clathrin-coated vesicle neck scission (UniProtKB:P50570,
      GO:0061791, GO:0099050).
  - source_id: file:human/ATP6V1A/ATP6V1A-ai-review.yaml
    title: ATP6V1A gene review (human)
    statement: >-
      V-ATPase catalytic subunit A driving endosomal lumen acidification (UniProtKB:P38606,
      GO:0046961, GO:0048388).
  - source_id: file:human/EHD1/EHD1-ai-review.yaml
    title: EHD1 gene review (human)
    statement: >-
      Recycling endosome tubulation and fission ATPase returning receptors to the cell surface
      (UniProtKB:Q9H4M9, GO:0016887, GO:0032456).
  - source_id: file:human/TSG101/TSG101-ai-review.yaml
    title: TSG101 gene review (human)
    statement: >-
      ESCRT-I subunit mediating MVB sorting (UniProtKB:Q99816, GO:0043130, GO:0036258).
  - source_id: file:human/RAB7A/RAB7A-ai-review.yaml
    title: RAB7A gene review (human)
    statement: >-
      Small GTPase governing early-to-late endosome maturation and lysosome fusion (UniProtKB:P51149,
      GO:0003924, GO:0045022, GO:0008333).
  - source_id: file:mouse/Rab7/Rab7-ai-review.yaml
    title: Rab7 gene review (mouse)
    statement: >-
      Mouse Rab7 mediates hepatic late endosomal maturation and restricts cytosolic payload escape
      (UniProtKB:P51150, PMID:41814093).
  - source_id: file:human/CTSD/CTSD-ai-review.yaml
    title: CTSD gene review (human)
    statement: >-
      Lysosomal aspartic endopeptidase executing terminal degradative proteolysis (UniProtKB:P07339,
      GO:0004190, GO:0006508).
module:
  id: asgr_galnac_hepatocyte_delivery
  label: Hepatocyte ASGR1/ASGR2 GalNAc-conjugate uptake, recycling, lysosomal routing, and cytosolic escape
  module_type: TRANSPORT_STEP
  concepts:
    - preferred_term: carbohydrate binding
      term:
        id: GO:0030246
        label: carbohydrate binding
      description: Selective recognition of terminal GalNAc and desialylated galactose ligands by C-type lectin receptors.
    - preferred_term: receptor-mediated endocytosis
      term:
        id: GO:0006898
        label: receptor-mediated endocytosis
      description: Clathrin-, AP-2-, and DNM2-dependent uptake of ASGR-bound cargo at the hepatocyte surface.
    - preferred_term: endosomal lumen acidification
      term:
        id: GO:0048388
        label: endosomal lumen acidification
      description: V-ATPase proton pumping that lowers endosomal pH and dissociates GalNAc ligands from ASGR1/ASGR2.
    - preferred_term: endocytic recycling
      term:
        id: GO:0032456
        label: endocytic recycling
      description: EHD1-driven tubular recycling of ligand-free ASGR1/ASGR2 receptors to the sinusoidal membrane.
    - preferred_term: endosome to lysosome transport
      term:
        id: GO:0008333
        label: endosome to lysosome transport
      description: ESCRT-I and RAB7A-dependent maturation of sorting endosomes into late endosomes and lysosomes.
  parts:
    - order: 1
      role: sinusoidal hepatocyte ASGR1/ASGR2 recognition of GalNAc-conjugated payloads and desialylated glycoproteins
      node:
        id: asgr_galnac_binding
        label: Cell-surface ASGR1/ASGR2 lectin binding of GalNAc conjugates & desialylated glycoproteins
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: asgr1_lectin_capture
            label: "ASGR1 (HL-1): major asialoglycoprotein receptor C-type lectin subunit"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Asialoglycoprotein receptor 1
                family_terms:
                  - id: PANTHER:PTHR22802:SF470
                    label: ASIALOGLYCOPROTEIN RECEPTOR 1
                  - id: PANTHER:PTHR22803:SF159
                    label: ASIALOGLYCOPROTEIN RECEPTOR 1
                representative_members:
                  - preferred_term: ASGR1 (human)
                    term:
                      id: UniProtKB:P07306
                      label: Asialoglycoprotein receptor 1
            function:
              preferred_term: asialoglycoprotein receptor activity
              term:
                id: GO:0004873
                label: asialoglycoprotein receptor activity
              substrates:
                - preferred_term: trivalent GalNAc-siRNA/ASO conjugates and desialylated plasma glycoproteins
              evidence:
                - source_id: file:human/ASGR1/ASGR1-ai-review.yaml
                  statement: Binds terminal beta-D-galactose and N-acetyl-D-galactosamine (GalNAc) moieties on desialylated glycoproteins and GalNAc-oligonucleotide conjugates at the hepatocyte sinusoidal membrane.
                - source_id: PMID:12171918
                  title: Nonpalmitoylated human asialoglycoprotein receptors recycle constitutively but are defective in coated pit-mediated endocytosis, dissociation, and delivery of ligand to lysosomes.
                  statement: The hepatic asialoglycoprotein receptor (composed of major subunit H1/ASGR1 and minor subunit H2/ASGR2) internalizes desialylated glycoproteins via the clathrin-coated pit pathway.
                  supporting_text: >-
                    The hepatic asialoglycoprotein receptor (ASGP-R) internalizes desialylated
                    glycoproteins via the clathrin-coated pit pathway and mediates their delivery to
                    lysosomes for degradation. The human ASGP-R contains two subunits, H1 and H2.
                - source_id: PMID:29069408
                  title: Asialoglycoprotein receptor 1 mediates productive uptake of N-acetylgalactosamine-conjugated and unconjugated phosphorothioate antisense oligonucleotides into liver hepatocytes.
                  statement: ASGR1 confers high-affinity GalNAc conjugate binding at the hepatocyte cell surface and mediates productive oligonucleotide internalization.
                  supporting_text: >-
                    GalNAc conjugation confers high affinity binding to the Asialoglycoprotein
                    Receptor (ASGR), a cell surface C-type lectin that functions as a scavenger
                    receptor and is able to remove desialylated glycoproteins from circulation (11–13).
            processes:
              - preferred_term: receptor-mediated endocytosis
                term:
                  id: GO:0006898
                  label: receptor-mediated endocytosis
            locations:
              - preferred_term: external side of plasma membrane
                term:
                  id: GO:0009897
                  label: external side of plasma membrane
            role_description: >-
              Major H1 subunit of the hepatic Ashwell-Morell C-type lectin receptor that binds
              terminal Gal/GalNAc ligands via its QPD Ca2+-binding motif and presents its
              cytoplasmic YQDL tyrosine sorting motif to AP-2.
          - id: asgr2_lectin_capture
            label: "ASGR2 (HL-2): minor asialoglycoprotein receptor C-type lectin subunit"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Asialoglycoprotein receptor 2
                family_terms:
                  - id: PANTHER:PTHR22802:SF433
                    label: ASIALOGLYCOPROTEIN RECEPTOR 2
                  - id: PANTHER:PTHR22803:SF159
                    label: ASIALOGLYCOPROTEIN RECEPTOR 1
                representative_members:
                  - preferred_term: ASGR2 (human)
                    term:
                      id: UniProtKB:P07307
                      label: Asialoglycoprotein receptor 2
            function:
              preferred_term: asialoglycoprotein receptor activity
              term:
                id: GO:0004873
                label: asialoglycoprotein receptor activity
              substrates:
                - preferred_term: trivalent GalNAc-siRNA/ASO conjugates and desialylated plasma glycoproteins
              evidence:
                - source_id: file:human/ASGR2/ASGR2-ai-review.yaml
                  statement: Co-assembles with ASGR1 via its coiled-coil stalk into hetero-oligomeric hepatic lectin complexes required for high-affinity multivalent GalNAc capture and endocytosis.
                - source_id: PMID:12171918
                  title: Nonpalmitoylated human asialoglycoprotein receptors recycle constitutively but are defective in coated pit-mediated endocytosis, dissociation, and delivery of ligand to lysosomes.
                  statement: The hepatic asialoglycoprotein receptor heterocomplex internalizes desialylated glycoproteins via the clathrin-coated pit pathway.
                  supporting_text: >-
                    The hepatic asialoglycoprotein receptor (ASGP-R) internalizes desialylated
                    glycoproteins via the clathrin-coated pit pathway and mediates their delivery to
                    lysosomes for degradation.
            processes:
              - preferred_term: receptor-mediated endocytosis
                term:
                  id: GO:0006898
                  label: receptor-mediated endocytosis
            locations:
              - preferred_term: external side of plasma membrane
                term:
                  id: GO:0009897
                  label: external side of plasma membrane
            role_description: >-
              Minor H2 subunit that hetero-oligomerizes with ASGR1 on the sinusoidal hepatocyte
              surface to establish the multivalent CRD spacing required for nanomolar binding of
              triantennary GalNAc oligosaccharides and GalNAc-siRNA/ASO conjugates.
    - order: 2
      role: clathrin/AP-2 coated-pit capture and DNM2-mediated vesicle scission
      node:
        id: clathrin_ap2_dnm2_internalization
        label: Clathrin/AP-2 coated pit assembly and DNM2 vesicle scission
        module_type: TRANSPORT_STEP
        annotons:
          - id: ap2m1_cargo_selection
            label: "AP2M1 (AP-2 mu2): tyrosine-motif cargo adaptor"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: AP-2 complex subunit mu
                term:
                  id: PANTHER:PTHR10529:SF236
                  label: AP-2 COMPLEX SUBUNIT MU
                representative_members:
                  - preferred_term: AP2M1 (human)
                    term:
                      id: UniProtKB:Q96CW1
                      label: AP-2 complex subunit mu
                  - preferred_term: dpy-23 (C. elegans)
                    term:
                      id: UniProtKB:P35603
                      label: AP-2 complex subunit mu
            function:
              preferred_term: signal sequence receptor activity
              term:
                id: GO:0005048
                label: signal sequence receptor activity
              evidence:
                - source_id: file:human/AP2M1/AP2M1-ai-review.yaml
                  statement: Recognizes cytoplasmic tyrosine-based YxxPhi sorting motifs and couples cargo receptors to the clathrin coat.
                - source_id: file:worm/dpy-23/dpy-23-ai-review.yaml
                  statement: Conserved metazoan AP-2 mu2 subunit that binds YxxPhi sorting motifs to drive clathrin-dependent endocytosis.
                - source_id: PMID:31104773
                  title: A Recurrent Missense Variant in AP2M1 Impairs Clathrin-Mediated Endocytosis and Causes Developmental and Epileptic Encephalopathy.
                  statement: Loss or mutation of AP-2 mu2 impairs clathrin-mediated endocytosis.
                  supporting_text: >-
                    revealed a significant impairment of CME of transferrin.
            processes:
              - preferred_term: clathrin-dependent endocytosis
                term:
                  id: GO:0072583
                  label: clathrin-dependent endocytosis
              - preferred_term: receptor internalization
                term:
                  id: GO:0031623
                  label: receptor internalization
            locations:
              - preferred_term: clathrin-coated pit
                term:
                  id: GO:0005905
                  label: clathrin-coated pit
            role_description: >-
              Recognizes the cytoplasmic YQDL tyrosine-based internalization motif of ASGR1 to
              concentrate GalNAc-bound receptor complexes into clathrin-coated pits.
          - id: cltc_coat_lattice
            label: "CLTC (CHC17): clathrin heavy chain coat lattice"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Clathrin heavy chain 1
                term:
                  id: PANTHER:PTHR10292:SF7
                  label: CLATHRIN HEAVY CHAIN 1
                representative_members:
                  - preferred_term: CLTC (human)
                    term:
                      id: UniProtKB:Q00610
                      label: Clathrin heavy chain 1
            function:
              preferred_term: structural molecule activity
              term:
                id: GO:0005198
                label: structural molecule activity
              evidence:
                - source_id: file:human/CLTC/CLTC-ai-review.yaml
                  statement: Polymerizes into polyhedral triskelion lattices at the plasma membrane to drive coated-vesicle budding.
                - source_id: PMID:14985334
                  title: Analysis of clathrin-mediated endocytosis of epidermal growth factor receptor by RNA interference.
                  statement: Knockdown of clathrin heavy chain maximally inhibits receptor internalization.
                  supporting_text: >-
                    The knock-downs of 
                    clathrin heavy chain and dynamin produced maximal inhibitory effects on the 
                    internalization of both receptors.
            processes:
              - preferred_term: receptor-mediated endocytosis
                term:
                  id: GO:0006898
                  label: receptor-mediated endocytosis
              - preferred_term: clathrin coat assembly
                term:
                  id: GO:0048268
                  label: clathrin coat assembly
            locations:
              - preferred_term: clathrin-coated endocytic vesicle
                term:
                  id: GO:0045334
                  label: clathrin-coated endocytic vesicle
            role_description: >-
              Assembles polyhedral clathrin cages around AP-2-clustered ASGR1/ASGR2 complexes to
              drive membrane invagination.
          - id: dnm2_vesicle_scission
            label: "DNM2 (dynamin-2): coated-vesicle neck scission GTPase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Dynamin-2
                term:
                  id: PANTHER:PTHR11566:SF23
                  label: DYNAMIN-2
                representative_members:
                  - preferred_term: DNM2 (human)
                    term:
                      id: UniProtKB:P50570
                      label: Dynamin-2
            function:
              preferred_term: GTPase motor activity
              term:
                id: GO:0061791
                label: GTPase motor activity
              evidence:
                - source_id: file:human/DNM2/DNM2-ai-review.yaml
                  statement: Assembles into helical collars at the neck of invaginated clathrin-coated pits and hydrolyzes GTP to sever nascent endocytic vesicles.
                - source_id: PMID:24970086
                  title: Membrane trafficking. Nucleoside diphosphate kinases fuel dynamin superfamily proteins with GTP for membrane remodeling.
                  statement: Dynamin superfamily molecular motors use GTP hydrolysis to drive membrane remodeling and vesicle scission.
                  supporting_text: >-
                    Dynamin superfamily molecular motors use guanosine triphosphate (GTP) as a source of
                    energy for membrane-remodeling events.
            processes:
              - preferred_term: vesicle scission
                term:
                  id: GO:0099050
                  label: vesicle scission
              - preferred_term: receptor-mediated endocytosis
                term:
                  id: GO:0006898
                  label: receptor-mediated endocytosis
            locations:
              - preferred_term: clathrin-coated pit
                term:
                  id: GO:0005905
                  label: clathrin-coated pit
            role_description: >-
              Constricts and severs the neck of clathrin-coated pits to release ASGR-GalNAc vesicles
              into the hepatocyte cytoplasm.
    - order: 3
      role: V-ATPase early endosome acidification and Ca2+-dependent ASGR-GalNAc uncoupling
      node:
        id: early_endosome_acidification
        label: V-ATPase early endosome acidification (pH drop & GalNAc ligand uncoupling from ASGR1/2)
        module_type: TRANSPORT_STEP
        annotons:
          - id: atp6v1a_proton_pump
            label: "ATP6V1A: V-ATPase catalytic subunit A"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: V-type proton ATPase catalytic subunit A
                term:
                  id: PANTHER:PTHR43607:SF9
                  label: V-TYPE PROTON ATPASE CATALYTIC SUBUNIT A
                representative_members:
                  - preferred_term: ATP6V1A (human)
                    term:
                      id: UniProtKB:P38606
                      label: V-type proton ATPase catalytic subunit A
            function:
              preferred_term: proton-transporting ATPase activity, rotational mechanism
              term:
                id: GO:0046961
                label: proton-transporting ATPase activity, rotational mechanism
              evidence:
                - source_id: file:human/ATP6V1A/ATP6V1A-ai-review.yaml
                  statement: Hydrolyzes ATP in the V1 ring to drive proton translocation across endosomal and lysosomal membranes.
                - source_id: PMID:33065002
                  title: Structures of a Complete Human V-ATPase Reveal Mechanisms of Its Assembly.
                  statement: V-ATPase couples V1 ATP hydrolysis to V0 proton pumping to acidify intracellular compartments.
                  supporting_text: >-
                    Vesicular- or vacuolar-type adenosine triphosphatases (V-ATPases) 
                    are ATP-driven proton pumps comprised of a cytoplasmic V1 complex for ATP 
                    hydrolysis and a membrane-embedded Vo complex for proton transfer.
            processes:
              - preferred_term: endosomal lumen acidification
                term:
                  id: GO:0048388
                  label: endosomal lumen acidification
              - preferred_term: proton transmembrane transport
                term:
                  id: GO:1902600
                  label: proton transmembrane transport
            locations:
              - preferred_term: endosome membrane
                term:
                  id: GO:0010008
                  label: endosome membrane
              - preferred_term: lysosomal membrane
                term:
                  id: GO:0005765
                  label: lysosomal membrane
            role_description: >-
              Acidifies sorting endosomes to pH ~5.5-6.0, dissociating Ca2+ from the ASGR1/ASGR2
              carbohydrate-recognition domains so that GalNAc conjugates are released into the
              endosomal lumen while free receptors enter recycling tubules.
    - order: 4
      role: EHD1-mediated tubular endocytic recycling of ligand-free ASGR1/ASGR2 to the hepatocyte surface
      node:
        id: ehd1_receptor_recycling
        label: EHD1 recycling endosome tubulation and ASGR1/ASGR2 return to sinusoidal surface
        module_type: TRANSPORT_STEP
        annotons:
          - id: ehd1_membrane_fission
            label: "EHD1: recycling endosome tubulation/fission ATPase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: EH domain-containing protein 1
                term:
                  id: PANTHER:PTHR11216:SF127
                  label: EH DOMAIN-CONTAINING PROTEIN 1
                representative_members:
                  - preferred_term: EHD1 (human)
                    term:
                      id: UniProtKB:Q9H4M9
                      label: EH domain-containing protein 1
            function:
              preferred_term: ATP hydrolysis activity
              term:
                id: GO:0016887
                label: ATP hydrolysis activity
              evidence:
                - source_id: file:human/EHD1/EHD1-ai-review.yaml
                  statement: Oligomerizes on recycling endosome tubules and hydrolyzes ATP to drive tubule fission and plasma-membrane recycling.
                - source_id: PMID:15020713
                  title: Rabenosyn-5 and EHD1 interact and sequentially regulate protein recycling to the plasma membrane.
                  statement: Depletion of EHD1 delays receptor recycling and traps cargo in the juxtanuclear recycling compartment.
                  supporting_text: >-
                    Depletion of 
                    either EHD1 or Rabenosyn-5 delayed the recycling of transferrin and major 
                    histocompatibility complex class I to the plasma membrane.
            processes:
              - preferred_term: endocytic recycling
                term:
                  id: GO:0032456
                  label: endocytic recycling
            locations:
              - preferred_term: recycling endosome membrane
                term:
                  id: GO:0055038
                  label: recycling endosome membrane
            role_description: >-
              Drives scission of recycling endosome tubules to rapidly return unoccupied ASGR1/ASGR2
              receptors (~15-20 min cycle time) back to the hepatocyte sinusoidal membrane for
              repeated rounds of GalNAc uptake.
    - order: 5
      role: ESCRT-I MVB sorting and RAB7A-mediated late endosome maturation
      node:
        id: escrt_rab7_late_endosome
        label: TSG101/ESCRT-I MVB sorting and RAB7A late endosome maturation (degradative depot commitment)
        module_type: TRANSPORT_STEP
        context:
          cellular_components:
            - preferred_term: late endosome membrane
              term:
                id: GO:0031902
                label: late endosome membrane
        annotons:
          - id: tsg101_escrt_sorting
            label: "TSG101: ESCRT-I ubiquitin-binding MVB sorting subunit"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Tumor susceptibility gene 101 protein
                term:
                  id: PANTHER:PTHR23306:SF17
                  label: TUMOR SUSCEPTIBILITY GENE 101 PROTEIN
                representative_members:
                  - preferred_term: TSG101 (human)
                    term:
                      id: UniProtKB:Q99816
                      label: Tumor susceptibility gene 101 protein
            function:
              preferred_term: ubiquitin binding
              term:
                id: GO:0043130
                label: ubiquitin binding
              evidence:
                - source_id: file:human/TSG101/TSG101-ai-review.yaml
                  statement: Binds ubiquitinated endocytic cargo on endosome membranes to nucleate ESCRT-mediated MVB sorting.
                - source_id: PMID:12900395
