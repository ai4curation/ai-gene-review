  notes: >-
    These variants are separately characterized implementations of conserved endogenous lipoylation
    chemistry, not universal taxonomic rules. The module is species-neutral: P. putida KT2440
    LipB/LipA is one exemplar of the direct route alongside E. coli; B. subtilis exemplifies
    the firmicute LipM-LipL relay; human and yeast exemplify the mitochondrial GCSH relay.
    The ONE_OR_MORE selection deliberately avoids asserting strict exclusivity but does not
    claim coexistence. Molecular functions occur only on leaf annotons, no generic module-level
    location is asserted, and salvage ligases plus downstream client complexes remain outside
    the boundary. Archaeal routes with split LipS1/LipS2 lipoyl synthases are not modeled;
    they would need their own variant with independently grounded families. Family grounding:
    PTHR10993 (LipB/LIPT2) and PTHR10949 (LipA/LIAS) each span direct and relay topologies,
    so family membership identifies the step, not the route. The LipM and LipL annotons use
    InterPro IPR024898 and IPR024897 because both proteins share PANTHER PTHR43679:SF2. The
    LIPT1 annoton carries no family term because PTHR12561:SF3 also contains ATP-dependent
    salvage ligases. Family reviews for all four PANTHER families are in interpro/panther.
    Intrinsic validator warnings: the LipL and LIPT1 functions have no GO id because the specific
    term, GO:7770091 lipoyl-GcvH:protein N-lipoyltransferase activity (covering RHEA:20213
    and RHEA:16413), exists in current GO but not in the GO release configured for validation;
    both are grounded by exact Rhea reactions and recorded in the gene reviews as a proposed
    term, to be swapped for GO:7770091 once the configured release contains it. The seed-overlap warning on the eukaryotic LIPT2 node PTN000863675 is also intrinsic: its IBD seeds are MOD and TAIR identifiers with no UniProtKB accession to compare with the representatives. PANTHER grounding
    PR #5076 proposed adding poplar LIP1 (B9H5L9) to the Bacillus LipA annoton and P. putida
    LipB (Q88DM4) to the human LIPT2 annoton; those placements put members in the wrong route
    and were not adopted. Yeast Lip3 (AIM22, P47051) is not used as a LIPT1-step exemplar
    because its amidotransfer activity has not been reconstituted.
