                            term:
                              id: PANTHER:PTN000863675
                              label: PTN000863675
                            description: >-
                              Local PAINT IBD data assigns GO:0033819 at this eukaryotic node,
                              seeded by Arabidopsis, Drosophila and mouse orthologs; human
                              LIPT2 and yeast Lip2 receive it by IBA.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: >-
                                  PTHR10993 PAINT data places lipoyl(octanoyl) transferase
                                  activity at PTN000863675.
                    function:
                      preferred_term: GCSH-directed lipoyl(octanoyl) transferase
                        activity
                      term:
                        id: GO:0033819
                        label: lipoyl(octanoyl) transferase activity
                      substrates:
                        - preferred_term: octanoyl-[mitochondrial acyl-carrier protein]
                        - preferred_term: apo-GCSH
                      products:
                        - preferred_term: mitochondrial acyl-carrier protein
                        - preferred_term: octanoyl-GCSH
                      evidence:
                        - source_id: RHEA:17665
                          title: octanoyl-ACP to protein octanoyl transfer
                          statement: >-
                            Rhea 17665 captures the LIPT2 octanoyl-ACP donor and
                            GCSH lysine acceptor chemistry.
                        - source_id: PMID:29987032
                          title: Protein moonlighting elucidates the essential human
                            pathway catalyzing lipoic acid assembly on its cognate
                            enzymes.
                          statement: >-
                            LIPT2 encodes the octanoyltransferase that initiates lipoyl group
                            assembly.
                        - source_id: PMID:23960015
                          title: The role of the Saccharomyces cerevisiae lipoate
                            protein ligase homologue, Lip3, in lipoic acid synthesis.
                          statement: >-
                            Extracts containing yeast Lip2 had octanoyltransferase activity
                            and lacked ligase activity.
                        - source_id: file:human/LIPT2/LIPT2-ai-review.yaml
                          statement: >-
                            The human LIPT2 review identifies GO:0033819 as the core molecular
                            function of A6NK58.
                    role_description: >-
                      Loads octanoyl onto the mitochondrial GCSH relay carrier.
            - order: 2
              role: sulfur insertion into GCSH-bound octanoyl
              node:
