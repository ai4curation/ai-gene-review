id: MODULE:endogenous_protein_lipoylation
title: Endogenous protein lipoylation
description: >-
  Endogenous protein lipoylation builds a lipoyl cofactor directly on conserved lysine residues
  in lipoyl domains. All characterized routes transfer an octanoyl group from octanoyl-acyl
  carrier protein to a protein carrier and use a radical-SAM lipoate synthase to insert sulfur
  atoms at C6 and C8. The topology varies by lineage: some bacteria (for example Escherichia
  coli and Pseudomonas putida) modify client lipoyl domains directly, whereas firmicutes such
  as Bacillus subtilis and eukaryotic mitochondria (human, yeast) first octanoylate the glycine
  cleavage H protein GcvH and use an amidotransferase to relay the acyl group from GcvH to
  the client E2 subunits. This module models the direct route, the Bacillus LipM-LipL relay
  and the mitochondrial LIPT2-LIAS-LIPT1 relay as alternatives. Exogenous lipoate salvage
  by ATP-dependent lipoate-protein ligases and the downstream lipoate-dependent enzyme complexes
  are outside the boundary.
status: COMPLETE
evidence:
  - source_id: GO:0009249
    title: protein lipoylation
    statement: >-
      The module represents the endogenous reactions that covalently install a
      lipoyl cofactor on protein lipoyl domains.
  - source_id:
      file:modules/endogenous_protein_lipoylation-deep-research-openscientist.md
    title: OpenScientist review of endogenous protein lipoylation
    statement: >-
      The review supports a conserved octanoyl-transfer and sulfur-insertion
      chemistry with direct and GcvH-relay topological variants.
  - source_id:
      file:projects/P_PUTIDA/deep-research/PSEPK__endogenous_protein_lipoylation__ppu00785-deep-research-openscientist.md
    title: OpenScientist review of endogenous protein lipoylation in Pseudomonas putida
      KT2440
    statement: >-
      The taxon review supports LipB Q88DM4 and LipA Q88DM5 as the complete
      direct route in KT2440 and flags PP_0423 as an uncertain LipM/LipL-family
      candidate outside the KEGG pathway bucket.
  - source_id: file:interpro/panther/PTHR10993/PTHR10993-paint.tsv
    title: PAINT assertions for LipB-family octanoyltransferases
    statement: >-
      PTN000107427 carries an IBD assertion for GO:0033819 seeded by reviewed
      Escherichia coli LipB P60720 and Mycobacterium tuberculosis P9WK83.
  - source_id: file:interpro/panther/PTHR10949/PTHR10949-paint.tsv
    title: PAINT assertions for eukaryotic lipoyl synthases
    statement: >-
      PTN000101947 carries an IBD assertion for GO:0016992 seeded in part by
      reviewed human LIAS O43766.
  - source_id: PMID:19570983
    title: Lipoic acid synthesis and attachment in yeast mitochondria.
    statement: >-
      Yeast LIP2 and LIP5 are required for lipoylation of all mitochondrial targets, and lipoylated
      Gcv3 is itself required for lipoylation of the E2 subunits Lat1 and Kgd2, establishing
      the mitochondrial GcvH relay outside animals.
  - source_id: PMID:29987032
    title: Protein moonlighting elucidates the essential human pathway catalyzing lipoic
      acid assembly on its cognate enzymes.
    statement: >-
      LIPT2 is the octanoyltransferase that initiates assembly and LIPT1 transfers lipoyl
      from GCSH to the 2-oxoacid dehydrogenase E2 subunits, biochemically defining the human
      pathway.
module:
  id: endogenous_protein_lipoylation
  label: Endogenous protein lipoylation
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: protein lipoylation
      term:
        id: GO:0009249
        label: protein lipoylation
      description: >-
        Covalent installation of a lipoyl cofactor on a lipoyl-domain lysine by
        an endogenous octanoyl-ACP-dependent route.
  variant_sets:
    - id: lipoylation_topologies
      label: Endogenous protein-lipoylation topologies
      axis: route topology and lineage
      selection: ONE_OR_MORE
      notes: >-
        The variants preserve the same chemistry but differ in whether the
        octanoyl or lipoyl group is relayed through GcvH before reaching client
        E2 lipoyl domains. ONE_OR_MORE is relaxed modeling, not evidence that
        the routes coexist in one organism. The cited work generally describes
        lineage-associated alternatives; coexistence and strict exclusivity
        remain untested and must be assessed for each concrete realization.
      variants:
        - id: direct_lipb_lipa_route
          label: Direct LipB-LipA route
          module_type: METABOLIC_PATHWAY
          description: >-
            LipB transfers octanoyl from octanoyl-ACP directly to a client
            lipoyl domain, and LipA inserts both sulfur atoms on that
            protein-bound intermediate. This is the characterized route in
            Escherichia coli; other organisms require independent evidence for
            this topology.
          parts:
            - order: 1
              role: direct octanoyl transfer from acyl carrier protein to a client
                lipoyl domain
              node:
                id: direct_lipb_octanoyl_transfer
                label: Direct octanoylation of a client lipoyl domain
                module_type: REACTION
                annotons:
                  - id: direct_lipb_activity
                    label: LipB-family octanoyltransferase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: LipB/LIPT2 octanoyltransferases (PANTHER SF7)
                        term:
                          id: PANTHER:PTHR10993:SF7
                          label: LIPOYLTRANSFERASE 2, MITOCHONDRIAL-RELATED
                        representative_members:
                          - preferred_term: LipB (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88DM4
                              label: Octanoyltransferase
                          - preferred_term: LipB (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P60720
                              label: Octanoyltransferase
                        ancestral_nodes:
                          - preferred_term: Bacterial LipB activity node PTN000107427
                            term:
                              id: PANTHER:PTN000107427
                              label: PTN000107427
                            description: >-
                              Local PAINT IBD data assigns GO:0033819 at this
                              node using reviewed E. coli LipB P60720 and
                              M. tuberculosis P9WK83 as seeds.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: >-
                                  PTHR10993 PAINT data places
                                  lipoyl(octanoyl) transferase activity at
                                  PTN000107427.
                    function:
                      preferred_term: lipoyl(octanoyl) transferase activity
                      term:
                        id: GO:0033819
                        label: lipoyl(octanoyl) transferase activity
                      substrates:
                        - preferred_term: octanoyl-[acyl-carrier protein]
                        - preferred_term: apo client lipoyl-domain protein
                      products:
                        - preferred_term: acyl-carrier protein
                        - preferred_term: octanoylated client lipoyl-domain protein
                      evidence:
                        - source_id: RHEA:17665
                          title: octanoyl-ACP to protein octanoyl transfer
                          statement: >-
                            Rhea 17665 defines transfer of octanoyl from
                            octanoyl-ACP to a protein lysine.
                        - source_id: file:PSEPK/lipB/lipB-ai-review.yaml
                          statement: >-
                            The PSEPK lipB review identifies GO:0033819 as the
                            core molecular function of Q88DM4.
                    role_description: >-
                      Produces the protein-bound octanoyl intermediate used by
                      LipA.
            - order: 2
              role: sulfur insertion into the directly octanoylated client lipoyl domain
              node:
                id: direct_lipa_sulfur_insertion
                label: Sulfur insertion on the client lipoyl domain
                module_type: REACTION
                annotons:
                  - id: direct_lipa_activity
                    label: LipA-family lipoate synthase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: LipA/LIAS lipoyl synthases (PANTHER SF0)
                        term:
                          id: PANTHER:PTHR10949:SF0
                          label: LIPOYL SYNTHASE, MITOCHONDRIAL
                        representative_members:
                          - preferred_term: LipA (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88DM5
                              label: Lipoyl synthase
                          - preferred_term: LipA (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P60716
                              label: Lipoyl synthase
                    function:
                      preferred_term: lipoate synthase activity
                      term:
                        id: GO:0016992
                        label: lipoate synthase activity
                      substrates:
                        - preferred_term: octanoylated client lipoyl-domain protein
                        - preferred_term: S-adenosyl-L-methionine
                      products:
                        - preferred_term: lipoylated client protein
                        - preferred_term: 5'-deoxyadenosine
                        - preferred_term: L-methionine
                      evidence:
                        - source_id: RHEA:16585
                          title: lipoate synthase reaction
                          statement: >-
                            Rhea 16585 defines radical-SAM sulfur insertion into
                            a protein-bound octanoyl group.
                        - source_id: file:PSEPK/lipA/lipA-ai-review.yaml
                          statement: >-
                            The PSEPK lipA review identifies GO:0016992 as the
                            core molecular function of Q88DM5.
                    role_description: >-
                      Completes lipoyl-cofactor formation on the client protein.
          connections:
            - source: direct_lipb_octanoyl_transfer
              target: direct_lipa_sulfur_insertion
              connection_type: PROVIDES_INPUT_FOR
              chaining_status: VERIFIED
              chaining_note: >-
                The octanoylated client protein produced by LipB is the
                macromolecular substrate of LipA.
              description: >-
                Direct LipB octanoylation precedes LipA sulfur insertion.

        - id: bacillus_gcvh_octanoyl_relay_route
          label: Bacillus GcvH octanoyl-relay route
          module_type: METABOLIC_PATHWAY
          description: >-
            In the characterized Bacillus subtilis route, LipM octanoylates GcvH, LipL transfers
            the acyl group from GcvH to client E2 lipoyl domains, and LipA inserts sulfur.
            LipL transfers octanoyl from octanoyl-GcvH in vitro, which is the order modeled
            here, but LipA can also act on octanoyl-GcvH: lipoyl-GcvH accumulates in cells
            lacking LipL and the ligase LplJ. The modeled order is therefore one supported
            realization, not a claim that sulfur insertion always follows relay.
          parts:
            - order: 1
              role: octanoyl transfer from acyl carrier protein to GcvH
              node:
                id: bacillus_lipm_gcvh_octanoylation
                label: LipM-dependent GcvH octanoylation
                module_type: REACTION
                annotons:
                  - id: bacillus_lipm_activity
                    label: LipM octanoyltransferase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Octanoyltransferase LipM family
                        term:
                          id: InterPro:IPR024898
                          label: Octanoyltransferase LipM
                        representative_members:
                          - preferred_term: LipM (Bacillus subtilis 168)
                            term:
                              id: UniProtKB:P54511
                              label: Octanoyltransferase LipM
                    function:
                      preferred_term: GcvH-directed lipoyl(octanoyl) transferase
                        activity
                      term:
                        id: GO:0033819
                        label: lipoyl(octanoyl) transferase activity
                      substrates:
                        - preferred_term: octanoyl-[acyl-carrier protein]
                        - preferred_term: apo-GcvH
                      products:
                        - preferred_term: acyl-carrier protein
                        - preferred_term: octanoyl-GcvH
                      evidence:
                        - source_id: RHEA:17665
                          title: octanoyl-ACP to protein octanoyl transfer
                          statement: >-
                            Rhea 17665 captures the LipM octanoyl-ACP donor and
                            protein-lysine acceptor chemistry.
                        - source_id: PMID:20882995
                          title: 'Lipoic acid synthesis: a new family of octanoyltransferases
                            generally annotated as lipoate protein ligases.'
                          statement: >-
                            Purified LipM transfers octanoyl from octanoyl-ACP through a Cys150
                            thioester intermediate and lacks lipoate ligase activity.
                        - source_id: file:BACSU/lipM/lipM-ai-review.yaml
                          statement: >-
                            The BACSU lipM review identifies GO:0033819 as the core molecular
                            function of P54511.
                    role_description: >-
                      Loads the octanoyl group onto the obligatory GcvH relay
                      carrier.
            - order: 2
              role: transfer of octanoyl from GcvH to client E2 lipoyl domains
              node:
                id: bacillus_lipl_octanoyl_relay
                label: LipL-dependent octanoyl relay to E2
                module_type: REACTION
                annotons:
                  - id: bacillus_lipl_activity
                    label: LipL octanoyl-GcvH amidotransferase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Octanoyltransferase LipL family
                        term:
                          id: InterPro:IPR024897
                          label: Octanoyltransferase LipL
                        representative_members:
                          - preferred_term: LipL (Bacillus subtilis 168)
                            term:
                              id: UniProtKB:P39648
                              label: Octanoyl-[GcvH]:protein N-octanoyltransferase
                    function:
                      preferred_term: octanoyl-GcvH:protein amidotransferase activity
                      description: >-
                        Transfers octanoyl from the lipoyl lysine of GcvH to a client E2 lipoyl-domain
                        lysine (RHEA:20213, EC 2.3.1.204). The matching term GO:7770091 lipoyl-GcvH:protein
                        N-lipoyltransferase activity exists in current GO but not in the GO
                        release configured for validation, so the function is grounded by
                        RHEA:20213 rather than the uninformative acyltransferase parent; GO:0033819
                        is not used because it is defined by the octanoyl-ACP donor.
                      substrates:
                        - preferred_term: octanoyl-GcvH
                        - preferred_term: apo E2 lipoyl-domain protein
                      products:
                        - preferred_term: apo-GcvH
                        - preferred_term: octanoylated E2 lipoyl-domain protein
                      evidence:
                        - source_id: RHEA:20213
                          title: octanoyl-GcvH to protein amidotransfer
                          statement: >-
                            Rhea 20213 captures transfer of octanoyl from GcvH
                            to a client protein lysine.
                          notes: EC 2.3.1.204
                        - source_id: PMID:21338421
                          title: >-
                            A novel amidotransferase required for lipoic acid cofactor assembly
                            in Bacillus subtilis.
                          statement: >-
                            LipL catalyses amidotransfer of the octanoyl moiety from octanoyl-GcvH
                            to the pyruvate dehydrogenase E2 subunit in vitro, via a thioester
                            acyl-enzyme intermediate, and has no octanoyl-ACP transferase
                            or ligase activity.
                        - source_id: file:BACSU/lipL/lipL-ai-review.yaml
                          statement: >-
                            The BACSU lipL review records this amidotransferase as the core
                            function of P39648 via a proposed term matching GO:7770091.
                    role_description: >-
                      Relays the octanoyl group from GcvH to the client E2
                      lipoyl domain.
            - order: 3
              role: sulfur insertion into octanoylated client E2 lipoyl domains
              node:
                id: bacillus_lipa_sulfur_insertion
                label: LipA sulfur insertion on client E2
                module_type: REACTION
                annotons:
                  - id: bacillus_lipa_activity
                    label: Bacillus LipA lipoate synthase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: LipA/LIAS lipoyl synthases (PANTHER SF0)
                        term:
                          id: PANTHER:PTHR10949:SF0
                          label: LIPOYL SYNTHASE, MITOCHONDRIAL
                        representative_members:
                          - preferred_term: LipA (Bacillus subtilis 168)
                            term:
                              id: UniProtKB:O32129
                              label: Lipoyl synthase
                    function:
                      preferred_term: lipoate synthase activity
                      term:
                        id: GO:0016992
                        label: lipoate synthase activity
                      substrates:
                        - preferred_term: octanoylated E2 lipoyl-domain protein
                        - preferred_term: S-adenosyl-L-methionine
                      products:
                        - preferred_term: lipoylated E2 protein
                        - preferred_term: 5'-deoxyadenosine
                        - preferred_term: L-methionine
                      evidence:
                        - source_id: RHEA:16585
                          title: lipoate synthase reaction
                          statement: >-
                            Rhea 16585 captures LipA sulfur insertion into a
                            protein-bound octanoyl group.
                        - source_id: file:BACSU/lipA/lipA-ai-review.yaml
                          statement: >-
                            The BACSU lipA review identifies GO:0016992 as the core molecular
                            function of O32129.
                    role_description: >-
                      Converts the relayed octanoyl group on the client E2
                      protein to mature lipoyllysine.
          connections:
            - source: bacillus_lipm_gcvh_octanoylation
              target: bacillus_lipl_octanoyl_relay
              connection_type: PROVIDES_INPUT_FOR
              chaining_status: VERIFIED
              chaining_note: >-
                LipM-produced octanoyl-GcvH is the donor substrate for LipL.
              description: >-
                GcvH carries octanoyl from LipM to LipL.
            - source: bacillus_lipl_octanoyl_relay
              target: bacillus_lipa_sulfur_insertion
              connection_type: PROVIDES_INPUT_FOR
              chaining_status: VERIFIED
              chaining_note: >-
                In the characterized Bacillus subtilis route, LipL produces
                octanoylated E2 substrate for LipA.
              description: >-
                LipL transfer to E2 precedes LipA sulfur insertion.

          evidence:
            - source_id: PMID:21338420
              title: A novel two-gene requirement for the octanoyltransfer reaction of
                Bacillus subtilis lipoic acid biosynthesis.
              statement: >-
                LipM and LipL catalyse sequential reactions; lipoyl-GcvH accumulates when
                LipL and LplJ are absent, so LipA can act on GcvH-bound octanoyl in vivo.
        - id: mitochondrial_gcsh_lipoyl_relay_route
          label: Mitochondrial GCSH lipoyl-relay route
          module_type: METABOLIC_PATHWAY
          description: >-
            In mitochondria, a LipB-family octanoyltransferase (human LIPT2, yeast Lip2) transfers
            octanoyl from mitochondrial acyl carrier protein to the glycine cleavage H protein
            (GCSH, yeast Gcv3), the LipA-family lipoyl synthase (LIAS, yeast Lip5) inserts
            sulfur on GCSH-bound octanoyl, and a lipoate-protein-ligase-fold amidotransferase
            (human LIPT1) transfers the mature lipoyl group from GCSH to client E2 lipoyl
            domains. The order is biochemically defined in human; in yeast, Lip2, Lip5 and
            Gcv3 are genetically required for E2 lipoylation, and the Lip3 relay enzyme is
            required in vivo but its amidotransfer activity has not been reconstituted.
          parts:
            - order: 1
              role: octanoyl transfer from mitochondrial acyl carrier protein to GCSH
              node:
                id: mitochondrial_lipt2_gcsh_octanoylation
                label: LIPT2-dependent GCSH octanoylation
                module_type: REACTION
                annotons:
