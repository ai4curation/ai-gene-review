  knowledge_gaps:
    - gap_statement: >-
        The order of sulfur insertion relative to GcvH-to-E2 relay is not uniform across GcvH-relay
        lineages, and within B. subtilis both orders appear possible: LipL relays octanoyl
        in vitro, yet lipoyl-GcvH accumulates in vivo when LipL and LplJ are absent.
      boundary: >-
        Sulfur insertion and acyl relay chemistry are established; the unknown is which order
        dominates in vivo in each relay lineage and whether LipL-type and LIPT1-type amidotransferases
        prefer octanoyl or lipoyl donors physiologically.
