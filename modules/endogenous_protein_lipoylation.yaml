                              label: Lipoyl synthase, mitochondrial
                          - preferred_term: Lip5 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P32875
                              label: Lipoyl synthase, mitochondrial
                        ancestral_nodes:
