      title: 'folate interconversions - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion for S. cerevisiae; activities part_of GO:0046655 folic
        acid metabolic process, with no causal edges. Includes SHMT, thymidylate
        synthase, DHFR, formate ligase and glycine cleavage activities that are
        outside this module.
    - model: gomodel:YeastPathways_PWY-2201
      title: 'folate transformations I - imported from: Saccharomyces Genome Database'
