        SGD conversion for S. cerevisiae; activities part_of GO:0035999. The
        ADE3 and MIS1 NADP-dehydrogenase activity (METHYLENETHFDEHYDROG-NADP-RXN)
        is mistyped as GO:0004329 formate-tetrahydrofolate ligase activity.
