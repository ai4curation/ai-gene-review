  notes: >-
    The module is organized by carrier-state chemistry rather than by one
    particular multidomain protein or species. Molecular-function terms are on
    leaf annotons. PANTHER families and selective UniProt representatives orient
    enzyme architecture and cofactor variants; exact PTNs are used only where
    the local canonical PAINT file carries the corresponding IBD assertion.
    Cofactor variants are defined by verified reaction and architecture rather
    than by taxonomic kingdom. The core dehydrogenase and cyclohydrolase
    operations are required, while the MTHFR and Fau branches are independently
    optional in concrete realizations.
    Formate ligation/release is treated as one-carbon loading or unloading and
    is excluded with SHMT and glycine-cleavage input. Purine, thymidylate, and
    methionine synthesis are consumers and are also outside the module.
    ALIGN with YeastPathways (2026-10; PWY3O-697, PWY-2201): S. cerevisiae
    exemplars were added for every in-scope reaction - ADE3 (cytosolic) and
    MIS1 (mitochondrial) trifunctional C1-THF synthases as a new NADP-linked
    variant and as fused cyclohydrolase representatives; MTD1 as a new
    monofunctional NAD-linked, cytosolic variant (the YeastCyc 1.5.1.15-RXN);
    MET13 as an NADPH MTHFR variant (PMID:11729203) and MET12 as a separate
    isozyme variant typed only with GO:0004489 because its cofactor
    preference and physiological role are not established; and FAU1 as a
    Fau/MTHFS representative. The boundary was not widened. SHM1/SHM2
    (GLYOHMETRANS-RXN), suggested in the crosswalk, stay outside because
    serine hydroxymethyltransferase is one-carbon loading and is modelled in
    glycine_serine_interconversion; the formate-tetrahydrofolate ligase
    domains of ADE3/MIS1 (FORMATETHFLIG-RXN), CDC21 thymidylate synthase,
    DFR1 and the glycine cleavage system are likewise outside (formate
    ligation currently has no module and is a curation follow-up). The
    PWY-2201 reactions with no yeast gene (cobalamin-dependent methionine
    synthase HOMOCYSMETB12-RXN - yeast MET6 is cobalamin-independent -,
    10-formyl-THF deformylase, ferredoxin-dependent MTHFR RXN-5061 and
    trimethylsulfonium methyltransferase 2.1.1.19-RXN) do not apply to S.
    cerevisiae. Compartments: MIS1 is mitochondrial and ADE3 and MTD1
    cytosolic, whereas both GO-CAMs place every activity, including MIS1's,
    in cytosol/cytoplasm; FAU1 was detected in the mitochondrial proteome but
    the module does not assert its compartment. GO-CAM disagreements:
    YeastPathways_PWY-2201 (and FOLSYN-PWY-1) type METHYLENETHFDEHYDROG-NADP-RXN
    as GO:0004329 rather than GO:0004488; YeastPathways_PWY3O-697 uses
    GO:0046655 folic acid metabolic process rather than GO:0035999; the
    glycine cleavage complex is in mitochondrion in PWY3O-697 but cytosol in
    PWY-2201; and PWY-2201 has an unexplained causal edge from MTD1 to FAU1.
    YeastPathways writes the MTHFR reaction with NAD(H), but the physiological
    yeast enzyme MET13 uses NADPH.
