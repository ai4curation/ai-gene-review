id: MODULE:dmel_brahma_complexes
title: Brahma (SWI/SNF) chromatin remodeling complexes in Drosophila melanogaster
description: >-
  Brahma complexes are the Drosophila SWI/SNF-family ATP-dependent chromatin remodelers. They
  use the Brahma (brm) ATPase to slide or evict nucleosomes, making DNA accessible to transcription
  factors, and act as trithorax group regulators that oppose Polycomb silencing. All forms
  share a core of brm, Moira, Bap55, Bap60, Brd7-9 and actin. The BAP form contains the ARID
  protein Osa, the PBAP form instead contains Polybromo, Bap170 and e(y)3, and a non-canonical
  form (ncBAP) contains Bicra. Different forms control different target genes in development.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000294
  title: 'FlyBase gene group BRM: Brahma complexes'
  statement: >-
    FlyBase release FB2026_03 groups 15 D. melanogaster genes as brahma complexes (BRM); this
    module models that group.
- source_id: GO:0035060
  title: brahma complex
  statement: >-
    GO term grounding the module as brahma complex.
notes: >-
  The three FlyBase subgroups are modelled as alternative complex forms, so shared core subunits
  (brm, mor, Bap55, Bap60, Brd7-9, actin) appear in each. PBAP is grounded to GO RSC-type
  complex (the PBAF-type branch) and ncBAP to GBAF complex by analogy with the mammalian GLTSCR1/BICRA-containing
  complex. FlyBase lists two actins (Act5C and Act42A) as BAP/PBAP members. FlyBase groups
  realized by this module: BRM (FBgg0000294). Subgroups folded into it: BAP, PBAP, NCBAP.
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_brahma_complexes.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
