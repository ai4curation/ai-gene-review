id: MODULE:bacterial_pst_phosphate_uptake
title: Bacterial Pst high-affinity phosphate uptake
description: >-
  A reusable bacterial ABC-transport module in which periplasmic PstS captures
  inorganic phosphate, the PstA/PstC membrane pair forms the translocation
  pathway, and PstB supplies ATP-dependent energy coupling. PhoU-mediated
  phosphate-homeostasis regulation and the PhoR/PhoB starvation response are
  adjacent regulatory systems rather than transport steps.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0035435
    title: phosphate ion transmembrane transport
    statement: Defines movement of phosphate across the membrane by the Pst system.
  - source_id: GO:0015415
    title: ATPase-coupled phosphate ion transmembrane transporter activity
    statement: Defines the collective ATP-coupled transport function.
  - source_id: file:PSEPK/pstS/pstS-ai-review.yaml
    statement: Grounds the PSEPK PstS substrate-binding exemplar.
  - source_id: file:PSEPK/pstA/pstA-ai-review.yaml
    statement: Grounds the PSEPK PstA permease exemplar.
  - source_id: file:PSEPK/pstC/pstC-ai-review.yaml
    statement: Grounds the PSEPK PstC permease exemplar.
  - source_id: file:PSEPK/pstB1/pstB1-ai-review.yaml
    statement: Grounds the PSEPK PstB1 energy-coupling exemplar.
  - source_id: file:PSEPK/pstB2/pstB2-ai-review.yaml
    statement: Grounds the second PSEPK PstB-like ATPase exemplar.
notes: >-
  The module is species-neutral and uses Pseudomonas putida KT2440 proteins as
  concrete exemplars. PstB1 and PstB2 are represented as alternative PstB-like
  energy-coupling exemplars, not two simultaneously required ATPase steps.
  The broad PANTHER family containing PstB2 has a misleading iron-export
  subfamily label; the exact UniProt record and gene review provide the
  phosphate-transporter grounding. Whether PstB2 exchanges freely with the
  PP_2656-PP_2659 PstSACB1 assembly remains a species-level question.
