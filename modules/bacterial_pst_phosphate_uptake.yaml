id: MODULE:bacterial_pst_phosphate_uptake
title: Bacterial Pst phosphate uptake
description: >-
  A reusable bacterial high-affinity phosphate-uptake module in which PstS
  captures inorganic phosphate, the PstA/PstC membrane subunits form the
  translocation pathway, and a PstB dimer supplies ATP-dependent energy
  coupling. The module represents uptake by the PstSACB transporter and ends
  with cytoplasmic phosphate delivery. PhoU-mediated homeostasis and PhoR/PhoB
  starvation signaling regulate this system but are not transport steps.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0035435
    title: phosphate ion transmembrane transport
    statement: Defines movement of phosphate across the membrane by the Pst system.
  - source_id: GO:0015415
    title: ATPase-coupled phosphate ion transmembrane transporter activity
    statement: Defines the collective ATP-coupled transport function of PstSACB.
  - source_id: UniProtKB:P0AG82
    title: Reviewed Escherichia coli K-12 PstS
    statement: >-
      The reviewed PstS entry describes a transporter containing one
      solute-binding PstS, PstA and PstC membrane proteins, and two PstB
      ATP-binding proteins.
  - source_id: UniProtKB:P0AAH0
    title: Reviewed Escherichia coli K-12 PstB
    statement: >-
      The reviewed PstB entry identifies the phosphate-import ATPase and the
      two-copy PstB stoichiometry of the PstSACB transporter.
  - source_id: file:modules/bacterial_pst_phosphate_uptake-deep-research-openscientist.md
    title: OpenScientist research for the reusable bacterial Pst uptake module
    statement: >-
      The generic review supports the PstS capture, PstA/PstC translocation,
      and PstB energy-coupling boundary while keeping Pho signaling outside.
notes: >-
  Reviewed Escherichia coli K-12 proteins orient each conserved family role.
  Exact PANTHER subfamilies are used only where the family-specific local
  entries contain the representative protein. PAINT nodes are asserted only
  where the local IBD record supports phosphate transport by the represented
  family. Molecular functions occur only on leaf annotons, and no generic
  location is asserted. PhoU, PhoR, PhoB, low-affinity phosphate carriers,
  phosphonate uptake, phosphate assimilation, and downstream metabolism are
  outside this transport module.
