    target: machr_gi_activation
    connection_type: NEGATIVELY_REGULATES
    description: GRK5-associated muscarinic desensitization limits inhibitory autoreceptor feedback. Native
      M2/M4 presynaptic evidence is from mouse; human receptor-expression evidence establishes context-dependent
      M2 sequestration, without measuring direct phosphorylation of every subtype.
    evidence:
    - source_id: PMID:19478075
      statement: Mouse hippocampal slices lacking GRK5 show reduced M2/M4 internalization and stronger
