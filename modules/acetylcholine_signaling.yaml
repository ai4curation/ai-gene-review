id: MODULE:acetylcholine_signaling
title: Human acetylcholine transmission and comparative receptor mechanisms
description: 'Human cholinergic transmission combines choline uptake by SLC5A7, cytosolic acetylcholine
  synthesis by CHAT, vesicular loading by SLC18A3, calcium-triggered exocytosis, receptor activation and
  extracellular acetylcholinesterase-mediated clearance. Nicotinic receptors are specific pentameric cation-channel
  assemblies: adult and fetal muscle receptors, neuronal heteromers, alpha7 homopentamers and alpha9/alpha10
  heteromers. Their subunit requirements and ligand-binding interfaces differ. Muscarinic receptors activate
  heterotrimeric G proteins: M1/M3/M5 preferentially couple to Gq/11 and M2/M4 predominantly couple to
  Gi/o, with ligand, tissue and assay-dependent variation. GRKs and RGS proteins regulate signal duration.
  Channel calcium entry need not cause net excitation: alpha9/alpha10 activation in hair cells recruits
  calcium-sensitive potassium conductance. Optional rat and chicken receptor segments expose experimentally
  measured differences in calcium permeability and downstream calcium handling; they do not establish
  a complete conserved vertebrate circuit. Generic exocytosis and downstream PLC/cAMP pathways are explicit
  interfaces. Neuromuscular receptor clustering and synapse assembly are separate processes.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PW:0000841
  title: acetylcholine signaling pathway
  statement: The module boundary follows the RGD Pathway Ontology term and its interactive diagram. The
    overview diagram draws ACh acting on nAChR and mAChR nodes and links out to the two subpathway diagrams;
    its record text describes CHAT synthesis from acetyl-CoA and choline, SLC18A3 vesicular loading, nicotinic
    and muscarinic reception, ACHE hydrolysis as signal termination and SLC5A7 reuptake of the resulting
    choline. Derived through projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0000841.yaml).
- source_id: PW:0000842
  title: acetylcholine signaling pathway via nicotinic acetylcholine receptor
  statement: The nicotinic subpathway diagram draws Chat, Slc18a3, released ACh, NMJ, postsynaptic and
    presynaptic nAChR nodes, Ache hydrolysis feeding choline back to synthesis through Slc5a7, and a separate
    cluster of Agrn-Lrp4, Lrp4-Musk, Dok7-Musk and NMJ nAChR-Rapsn associations with Musk positively affecting
    NMJ nAChR. The record text lists the subunit genes Chrna1-7, Chrna9-10, Chrnb1-4, Chrnd, Chrne and
    Chrng and describes the agrin/LRP4/MuSK/Dok7/rapsyn cluster as the prepatterning and stabilisation
    machinery that localises NMJ receptors. PW:0000842 has no GO mapping in the project's SSSOM file.
- source_id: PW:0000843
  title: acetylcholine signaling pathway via muscarinic acetylcholine receptor
  statement: The muscarinic subpathway diagram draws Chrm1, Chrm3 and Chrm5 associated with "Gnaq proteins
    in ACh" and Chrm2 and Chrm4 with "Gnai proteins in ACh", Galphaq signalling producing IP3 and DAG
    and Galphai signalling lowering cAMP, Adrbk1 (GRK2) negatively affecting all five receptors, Grk5
    negatively affecting the presynaptic M2/M4 autoreceptors, Rgs2 negatively affecting the Gq proteins
    and Rgs4 and Rgs6 negatively affecting the Gi proteins, and presynaptic autoreceptor inhibition of
    ACh release.
- source_id: GO:0095500
  title: acetylcholine receptor signaling pathway
  statement: The GO mapping recorded for PW:0000841 in the project's module seeds (skos:relatedMatch);
    it covers the reception arm of the module.
- source_id: GO:0007213
  title: G protein-coupled acetylcholine receptor signaling pathway
  statement: The GO mapping recorded for PW:0000843 (skos:relatedMatch); it is the muscarinic branch,
    refined here into its PLC-activating (GO:0007207) and adenylate cyclase-inhibiting (GO:0007197) children.
- source_id: PMID:10649566
  title: Identification and characterization of the high-affinity choline transporter.
  statement: Original rat and nematode transporter work establishes high-affinity choline uptake. The
    human implementation is grounded separately in PMID11027560; rate limitation is physiological-context
    dependent.
  supporting_text: In cholinergic neurons, high-affinity choline uptake in presynaptic terminals is the
    rate-limiting step in acetylcholine synthesis.
- source_id: PMID:31073061
  title: Structures of the M1 and M2 muscarinic acetylcholine receptor/G-protein complexes.
  statement: Establishes the two muscarinic coupling classes used as the variant axis of the muscarinic
    branch.
  supporting_text: M1R, M3R, and M5R couple to the Gq/ 11 family, whereas M2R and M4R couple to the Gi/
    o family.
- source_id: PMID:10869390
  title: Postnatal developmental delay and supersensitivity to organophosphate in gene-targeted mice lacking
    acetylcholinesterase.
  statement: AChE is the principal terminator of cholinergic transmission.
  supporting_text: Acetylcholinesterase (AChE; EC 3.1.1.7) is the primary terminator of nerve impulse
    transmission at cholinergic synapses
- source_id: PMID:41461581
  statement: Current authoritative nomenclature describes preferred coupling classes, not exclusive pairing
    in all physiological or experimental contexts.
  supporting_text: M1, M3, and M5 mAChRs preferentially couple to Gq/11 proteins, whilst M2 and M4 mAChRs
    predominantly couple to Gi/o proteins.
notes: The human transmission boundary retains uptake, synthesis, VAChT loading, release, one or more
  complete receptor implementations, and AChE clearance. Generic exocytosis and PLC/cAMP effector machinery
  are referenced rather than duplicated; their full gene panels are outside this audit, while the exact
  VAChT interface member is reviewed. Nicotinic activity belongs to an assembled complex; alpha7 requires
  five copies of one product. Adult epsilon and fetal gamma are alternatives. Alpha5 and beta3 are accessory
  constituents of specific alternatives, not obligatory subunits of every neuronal receptor. Human alpha6-containing
  functional capacity is grounded in engineered concatamers; native composition is separately supported
  by comparative experiments and remains context dependent. Exact human selectors and same-taxon complex
  units prevent cross-species mixed assemblies. PANTHER classification records homology, not interchangeability
  or family-wide neurotransmitter specificity. Root taxa list sampled evidence; each required step is
  human, while rat/chicken parts are optional comparators and cannot satisfy the full human boundary.
  AGRN/LRP4/MUSK/DOK7/RAPSN receptor clustering remains in nmj_achr_clustering, not ACh reception. The
  44-member audit includes all original 35 direct products, VAChT, human GNB5, three mouse cardiac comparators
  and four rat/chicken receptor comparators. The mouse Rgs6-Gnb5 regulator segment is explicit. G14 and
  Go coupling are separated from downstream effector claims; exact gene-product choices prevent substitution
  by other family members. Independent regulatory mechanisms are ONE_OR_MORE alternatives. Connections
  carry assay- and species-qualified evidence; no completed conserved circuit or universal native stoichiometry
  is claimed. Actual module Falcon and fallback attempts failed; research is based on normally cached
  publications and recorded manual assessment, with no fabricated provider report.
