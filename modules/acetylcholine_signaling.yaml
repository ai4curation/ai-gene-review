    - source_id: PMID:9495886
      statement: GRK5 coexpression facilitates human M2 sequestration in BHK-21 cells; this is not a universal
        effect across receptor subtypes or host cells.
knowledge_gaps:
- gap_statement: Which GRK and RGS proteins act on each muscarinic subtype in native neurons and effector
    tissues, and with what selectivity, is not known. The assignments drawn by RGD come largely from overexpression
    or single-tissue knockout work.
  boundary: It is established that GRK2 overexpression promotes sequestration of M2 to M5 but not M1 receptors,
    that GRK5 loss selectively impairs M2/M4 autoreceptor internalisation and lowers hippocampal ACh release,
    that RGS2 is a selective GAP for G alpha q and that RGS4 is a GAP for G alpha i.
  status: OPEN
  gap_kind:
  - BIOLOGY
  significance: Without subtype-resolved assignments the termination part of this module cannot be weighted,
    and subtype-selective muscarinic drugs cannot be matched to the desensitisation machinery that will
    shape their effect.
  provenance:
  - reference_id: PMID:9495886
    supporting_text: GRK4 delta, GRK5 and GRK6 did not facilitate sequestration of m1-m5 receptors in
      COS-7 cells, except that the sequestration of m2 receptors tended to be facilitated by coexpression
      of GRK4 delta, GRK5 and GRK6.
- gap_statement: The native subunit composition and stoichiometry of neuronal nicotinic receptors in most
    cell types is unresolved, including which alpha and beta combinations exist in vivo and how accessory
    subunits such as alpha5 and beta3 are distributed.
  boundary: Immunoprecipitation and knockout work establish alpha4beta2*, alpha6beta2* and alpha4alpha6beta2*
    receptors in dopaminergic terminal fields, and alpha3beta4* as the principal autonomic subtype, but
    the inventory is incomplete.
  status: OPEN
  gap_kind:
  - BIOLOGY
  significance: Subtype composition sets agonist sensitivity, calcium permeability and desensitisation,
    so it determines which receptors mediate nicotine reinforcement and which are tractable drug targets.
  provenance:
  - reference_id: PMID:12944511
    supporting_text: However, DA neurons express mRNAs coding for most, if not all, neuronal nAChR subunits,
      and the subunit composition of functional nAChRs has been difficult to establish.
