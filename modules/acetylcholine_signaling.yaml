  connections:
  - source: ach_choline_uptake
    target: ach_synthesis
    connection_type: PROVIDES_INPUT_FOR
    description: Transported choline is the substrate acetylated by CHAT. This links independently demonstrated
      transport and catalytic reactions, without asserting a transporter-enzyme complex.
    evidence:
    - source_id: PMID:11027560
      statement: Human transporter expression establishes choline uptake.
    - source_id: PMID:17144655
      statement: Human CHAT structures define choline and acetyl-CoA recognition and the acetyl-transfer
        mechanism.
  - source: ach_synthesis
    target: ach_vesicle_loading
    connection_type: PROVIDES_INPUT_FOR
    description: CHAT-generated cytosolic acetylcholine is available as substrate for VAChT loading; chemical
      continuity is inferred from the independently measured reactions.
    evidence:
    - source_id: PMID:17144655
      statement: CHAT produces acetylcholine from choline and acetyl-CoA.
    - source_id: PMID:8910293
      statement: Human VAChT expressed in PC-12 cells mediates ATP/proton-gradient-dependent vesicular
        acetylcholine uptake.
  - source: ach_vesicle_loading
    target: ach_release
    connection_type: PROVIDES_INPUT_FOR
    description: Vesicular acetylcholine supplies the transmitter cargo for exocytosis. Loading and fusion
      are distinct mechanisms; the conserved fusion interface has comparative cholinergic evidence rather
      than an all-human reconstitution.
    evidence:
    - source_id: PMID:8910293
      statement: Human VAChT confers vesicular acetylcholine accumulation in a rat cell line.
    - source_id: PMID:10526333
      statement: C. elegans unc-13 loss nearly abolishes evoked cholinergic release despite morphologically
        docked vesicles, supporting the generic priming/fusion interface; it is not a human protein assay.
  - source: ach_release
    target: ach_reception
    connection_type: PROVIDES_INPUT_FOR
    description: Extracellular acetylcholine activates the receptor implementations. Native release and
      recombinant human receptor responses provide complementary evidence, rather than a single reconstructed
      human synapse.
    evidence:
    - source_id: PMID:10526333
      statement: Native worm neuromuscular electrophysiology connects evoked vesicular release to cholinergic
        postsynaptic responses.
    - source_id: PMID:8788941
      statement: Recombinant human adult and fetal muscle receptor assemblies respond to acetylcholine.
    - source_id: PMID:11181437
      statement: Agonist-stimulated human muscarinic receptors expressed in CHO cells activate G proteins
        with subtype- and agonist-dependent profiles.
  - source: ach_release
    target: ach_hydrolysis
    connection_type: PROVIDES_INPUT_FOR
    description: Released acetylcholine is an extracellular substrate for acetylcholinesterase; this is
      a chemical substrate relation.
    evidence:
    - source_id: PMID:1517212
      statement: Human acetylcholinesterase catalytic-triad substitutions abolish enzymatic activity while
        preserving secretion and folding.
    - source_id: file:human/ACHE/ACHE-uniprot.txt
      statement: Publication-linked curated reaction specifies acetylcholine hydrolysis to choline and
        acetate.
      supporting_text: acetylcholine + H2O = choline + acetate + H(+)
  - source: ach_hydrolysis
    target: ach_reception
    connection_type: NEGATIVELY_REGULATES
    description: Hydrolysis lowers available agonist and thereby limits continuing receptor activation.
      Acetylcholinesterase is the principal terminator in this context; partial compensation in knockout
      mice prevents an absolute requirement claim.
    evidence:
    - source_id: PMID:10869390
      statement: AChE-null mice survive with substantial physiological abnormalities and compensatory
        hydrolysis; the study supports a principal, not exclusive, termination role.
    - source_id: PMID:1517212
      statement: Human mutagenesis independently establishes the catalytic activity underlying agonist
        removal.
  - source: ach_hydrolysis
    target: ach_choline_uptake
    connection_type: PROVIDES_INPUT_FOR
    description: Choline released by acetylcholine hydrolysis can enter the extracellular pool used by
      CHT1. This chemical recycling relation does not require direct binding between ACHE and SLC5A7.
    evidence:
    - source_id: file:human/ACHE/ACHE-uniprot.txt
      statement: Curated catalytic reaction produces choline.
      supporting_text: acetylcholine + H2O = choline + acetate + H(+)
    - source_id: PMID:11027560
      statement: Human CHT1 transports extracellular choline with high affinity.
  - source: machr_gi_activation
    target: ach_release
    connection_type: NEGATIVELY_REGULATES
    description: Presynaptic M2/M4-dependent inhibitory feedback limits further acetylcholine release.
      The native experimental support is mouse hippocampus and a cholinergic cell line; placement in the
      human module is a qualified homologous physiological inference.
    evidence:
    - source_id: PMID:19478075
      statement: Reduced evoked release after mouse GRK5 loss is corrected by an M2/M4 antagonist; cell-line
        release is also restored by pertussis toxin or muscarinic antagonists. This is pathway-level inhibition,
        not direct binding of G-alpha to a vesicle-fusion protein.
  - source: ach_muscarinic_termination
    target: muscarinic_reception
    connection_type: NEGATIVELY_REGULATES
    description: Optional GRK-associated desensitization and RGS-accelerated G-alpha inactivation shorten
      muscarinic responses in their respective contexts. RGS proteins act on G proteins rather than directly
      phosphorylating receptors.
    evidence:
    - source_id: PMID:9495886
      statement: Coexpression experiments measure receptor sequestration with subtype and cell-line dependence.
    - source_id: PMID:8756726
      statement: RGS4 accelerates Gi-family GTP hydrolysis.
    - source_id: PMID:19478087
      statement: Wild-type RGS2 has potent Gq-directed GAP activity.
