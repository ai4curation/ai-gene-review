id: MODULE:acetylcholine_signaling
title: Acetylcholine signaling — choline uptake, ACh synthesis and vesicular loading, nicotinic and muscarinic reception, AChE clearance and GRK/RGS termination; SLC5A7/CHAT/SLC18A3/CHRN*/CHRM1-5/GNAQ/GNAI/ACHE/GRK2/GRK5/RGS2/4/6
description: >-
  Acetylcholine (ACh) is the transmitter of motor neurons, of all autonomic
  preganglionic neurons and of parasympathetic postganglionic neurons, and a
  neuromodulator in the brain. In the cholinergic terminal, choline is taken up by the
  sodium-coupled high-affinity choline transporter CHT1 (SLC5A7), the rate-limiting step
  for synthesis. Choline O-acetyltransferase (CHAT) transfers the acetyl group of
  acetyl-CoA to choline in the cytosol, and the vesicular ACh transporter VAChT (SLC18A3)
  exchanges luminal protons for cytosolic ACh to fill synaptic vesicles, which are then
  released by calcium-triggered exocytosis. Released ACh acts on two receptor classes.
  Nicotinic receptors are pentameric ACh-gated cation channels of the Cys-loop
  superfamily: the muscle receptor at the neuromuscular junction (two alpha1 with beta1,
  delta and either the fetal gamma or the adult epsilon subunit) drives endplate
  depolarisation and contraction; neuronal heteromers (alpha4beta2* in the brain,
  alpha3beta4* in autonomic ganglia, alpha6beta2* on dopaminergic and GABAergic terminals,
  with alpha2, alpha5 and beta3 as additional or accessory subunits) and the alpha7
  homomer depolarise neurons and modulate transmitter release; alpha9alpha10 receptors
  serve cochlear efferent synapses. Muscarinic receptors are G protein-coupled: M1, M3 and
  M5 couple to Gq/11 and activate phospholipase C beta, while M2 and M4 couple to Gi/o,
  inhibit adenylyl cyclase and, through G beta-gamma, open GIRK channels; presynaptic
  M2/M4 autoreceptors inhibit further ACh release. Acetylcholinesterase (ACHE) in the
  synaptic cleft hydrolyses ACh to choline and acetate within milliseconds, terminating
  the signal and returning choline for reuptake. Muscarinic signalling is further
  terminated by G protein-coupled receptor kinases (GRK2 for most subtypes, GRK5 for the
  M2/M4 autoreceptors), which phosphorylate active receptors and promote their
  internalisation, and by RGS GTPase-activating proteins (RGS2 for Gq, RGS4 and RGS6 for
  Gi/o) that shorten the lifetime of active G alpha.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000841
    title: acetylcholine signaling pathway
    statement: >-
      The module boundary follows the RGD Pathway Ontology term and its interactive
      diagram. The overview diagram draws ACh acting on nAChR and mAChR nodes and links
      out to the two subpathway diagrams; its record text describes CHAT synthesis from
      acetyl-CoA and choline, SLC18A3 vesicular loading, nicotinic and muscarinic
      reception, ACHE hydrolysis as signal termination and SLC5A7 reuptake of the
      resulting choline. Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0000841.yaml).
  - source_id: PW:0000842
    title: acetylcholine signaling pathway via nicotinic acetylcholine receptor
    statement: >-
      The nicotinic subpathway diagram draws Chat, Slc18a3, released ACh, NMJ,
      postsynaptic and presynaptic nAChR nodes, Ache hydrolysis feeding choline back to
      synthesis through Slc5a7, and a separate cluster of Agrn-Lrp4, Lrp4-Musk, Dok7-Musk
      and NMJ nAChR-Rapsn associations with Musk positively affecting NMJ nAChR. The
      record text lists the subunit genes Chrna1-7, Chrna9-10, Chrnb1-4, Chrnd, Chrne and
      Chrng and describes the agrin/LRP4/MuSK/Dok7/rapsyn cluster as the prepatterning
      and stabilisation machinery that localises NMJ receptors. PW:0000842 has no GO
      mapping in the project's SSSOM file.
  - source_id: PW:0000843
    title: acetylcholine signaling pathway via muscarinic acetylcholine receptor
    statement: >-
      The muscarinic subpathway diagram draws Chrm1, Chrm3 and Chrm5 associated with
      "Gnaq proteins in ACh" and Chrm2 and Chrm4 with "Gnai proteins in ACh", Galphaq
      signalling producing IP3 and DAG and Galphai signalling lowering cAMP, Adrbk1
      (GRK2) negatively affecting all five receptors, Grk5 negatively affecting the
      presynaptic M2/M4 autoreceptors, Rgs2 negatively affecting the Gq proteins and Rgs4
      and Rgs6 negatively affecting the Gi proteins, and presynaptic autoreceptor
      inhibition of ACh release.
  - source_id: GO:0095500
    title: acetylcholine receptor signaling pathway
    statement: >-
      The GO mapping recorded for PW:0000841 in the project's module seeds
      (skos:relatedMatch); it covers the reception arm of the module.
  - source_id: GO:0007213
    title: G protein-coupled acetylcholine receptor signaling pathway
    statement: >-
      The GO mapping recorded for PW:0000843 (skos:relatedMatch); it is the muscarinic
      branch, refined here into its PLC-activating (GO:0007207) and adenylate
      cyclase-inhibiting (GO:0007197) children.
  - source_id: PMID:10649566
    title: Identification and characterization of the high-affinity choline transporter.
    statement: >-
      High-affinity choline uptake is the rate-limiting step for ACh synthesis, which is
      why the choline transporter is modelled as the first part of the module.
    supporting_text: In cholinergic neurons, high-affinity choline uptake in presynaptic terminals is the rate-limiting step in acetylcholine synthesis.
  - source_id: PMID:31073061
    title: Structures of the M1 and M2 muscarinic acetylcholine receptor/G-protein complexes.
    statement: >-
      Establishes the two muscarinic coupling classes used as the variant axis of the
      muscarinic branch.
    supporting_text: M1R, M3R, and M5R couple to the Gq/ 11 family, whereas M2R and M4R couple to the Gi/ o family.
  - source_id: PMID:10869390
    title: Postnatal developmental delay and supersensitivity to organophosphate in gene-targeted mice lacking acetylcholinesterase.
    statement: AChE is the principal terminator of cholinergic transmission.
    supporting_text: Acetylcholinesterase (AChE; EC 3.1.1.7) is the primary terminator of nerve impulse transmission at cholinergic synapses
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000841 and its two subpathway
  diagrams PW:0000842 (nicotinic) and PW:0000843 (muscarinic) through the
  RGD_PATHWAY_ONTOLOGY project's diagram->module route. RGD curates 40 human genes to
  PW:0000841. Thirty-five are modelled here; the overview diagram itself draws no genes,
  so the parts and topology come from the two subpathway diagrams and the record text.
  Boundary decisions. (1) Ligand supply and clearance are modelled as parts with their
  own molecular functions: SLC5A7 choline:sodium symporter activity, CHAT choline
  O-acetyltransferase activity and ACHE acetylcholinesterase activity. VAChT (SLC18A3)
  vesicular loading and calcium-triggered release are not re-modelled. They are
  included by reference (module_ref) to the VAChT node of
  modules/synaptic_vesicle_neurotransmitter_loading.yaml and to
  modules/synaptic_vesicle_exocytosis.yaml, which already ground SLC18A3 with
  acetylcholine transmembrane transporter activity GO:0005277 and the release
  machinery. (2) The reception step is a variant set with two classes. The nicotinic
  class is a second variant set of receptor subtypes, each modelled as an
  acetylcholine-gated channel complex (GO:0005892) carrying acetylcholine-gated
  monoatomic cation-selective channel activity GO:0022848 on the complex. Subunits are
  active units, because the existing gene reviews (CHRNA1, CHRNA4, CHRNB1, CHRNB2,
  CHRNG) record GO:0022848 as contributes_to rather than enables. The muscarinic class
  is a variant set of the Gq/11 branch (M1/M3/M5; GNAQ, GNA11, GNA14) and the Gi/o
  branch (M2/M4; GNAI1, GNAI2, plus GNAO1). GNAO1 is not in the RGD gene list. It is
  added because G alpha o is the partner in the M2 receptor-G protein structure
  (PMID:31073061) and in the human CHRM2 GO-CAM. Their downstream effector steps are
  referenced, not copied. The Gq branch points to the PLC beta node of
  modules/gpcr_plc_calcium_pkc_signaling.yaml. The Gi branch negatively regulates the
  adenylyl cyclase node of modules/gpcr_camp_pka_signaling.yaml, the module that RGD's
  "Galphai lowers cAMP" edge acts on. G beta-gamma opening of GIRK channels is described
  in prose and not modelled, because RGD does not draw it. (3) GRK2/GRK5 and RGS2/4/6
  form an optional desensitisation/termination part, so that the module can still be
  satisfied without it. G alpha molecular function is G protein activity GO:0003925, as
  in the human CHRM2 and mouse Chrm3 GO-CAMs. (4) The agrin-LRP4-MuSK-DOK7-rapsyn set
  (AGRN O00468, LRP4 O75096, MUSK O15146, DOK7 Q18PE1, RAPSN Q13702) is excluded. It is
  the neuromuscular-junction AChR clustering pathway (GO:0071340 skeletal muscle
  acetylcholine-gated channel clustering, part_of GO:0007528 neuromuscular junction
  development), a synapse-assembly process. These proteins do none of the work of
  receiving or transducing the ACh signal. They bind no ACh, gate no ion flux and couple
  to no G protein; their activities are RTK activation, coreceptor activity and
  receptor anchoring (AGRN, DOK7 and LRP4 reviews: transmembrane receptor protein
  tyrosine kinase activator activity GO:0030297, protein tyrosine kinase activator
  activity GO:0030296, coreceptor activity GO:0015026). Their knockout phenotypes show
  that they are necessary for building the synapse (PMID:10320756), not that they take
  part in the signalling step. Applying CLAUDE.md's substrate-vs-participant rule and
  comparator check: in GOA, AGRN and DOK7 carry only GO:0007528 and LRP4 carries
  GO:0071340/GO:0051124, while the receptor subunits (CHRNA1, CHRNB1) carry
  GO:0095500, GO:0007271 and GO:0007274. Curators have therefore kept the clustering
  machinery out of the signalling terms, and the mouse GO-CAM gomodel:64c3044100000089
  "Skeletal muscle acetylcholine-gated channel clustering 1 (Mouse)" models
  Agrn/Lrp4/Musk/Dok7 as a separate clustering pathway. This set is recorded as a
  candidate separate module (NMJ AChR clustering: agrin -> LRP4 -> MuSK/DOK7 -> rapsyn),
  to be grounded in GO:0071340 and that GO-CAM. RGD's "Musk --+> NMJ nAChR" edge is
  read as receptor localisation, not activation. (5) Organophosphate/pralidoxime AChE
  toxicology (RGD PW:0001511-adjacent records drawing ALB, CYP2B6, PON1) and the
  autonomic/organ-level outcomes in the RGD diagram (heart rate, bronchoconstriction,
  adrenal medulla) are out of scope. GO-CAM coverage: CHRNA7 (gomodel:678073a900000353,
  the project's best-overlap model, and gomodel:67369e7600000404), CHRNA9
  (gomodel:67b1629100004300), CHRM2 with GNAO1 (gomodel:67f85f2b00003584), ACHE
  (gomodel:6870555700001150), mouse Chrm3/Gnaq/Gna11 (gomodel:62f58d8800003672) and GRK2
  in a C5AR1 desensitisation model (gomodel:67f85f2b00004426) are linked under
  gocam_associations. No human GO-CAM covers CHAT, SLC5A7, the muscle receptor, M1/M3/M4/M5,
  GRK5 or the RGS proteins in an ACh context. Gene reviews exist for CHAT, CHRM1, CHRNA1,
  CHRNA4, CHRNB1, CHRNB2 and CHRNG, and their core molecular functions were used. The
  other members have no review yet, and their functions were taken from the cited
  literature. PANTHER family ids and PTNs are deliberately not asserted.
module:
  id: acetylcholine_signaling
  label: Acetylcholine signaling
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: acetylcholine receptor signaling pathway
      term:
        id: GO:0095500
        label: acetylcholine receptor signaling pathway
      description: >-
        The reception arm: signalling initiated by ACh binding to nicotinic or muscarinic
        receptors. This is the GO term mapped to PW:0000841.
    - preferred_term: synaptic transmission, cholinergic
      term:
        id: GO:0007271
        label: synaptic transmission, cholinergic
      description: >-
        Asserted alongside GO:0095500 because the RGD pathway also spans ACh synthesis,
        vesicular release and AChE clearance, which this term covers and the receptor
        signalling term does not. The two terms are not in a parent/child relation.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: cholinergic synapse
        term:
          id: GO:0098981
          label: cholinergic synapse
  parts:
    - order: 1
      role: high-affinity choline uptake into the cholinergic terminal
      node:
        id: ach_choline_uptake
        label: CHT1 (SLC5A7) sodium-coupled choline uptake
        module_type: TRANSPORT_STEP
        description: >-
          CHT1 takes choline, much of it recycled from ACh hydrolysis in the cleft, into
          the presynaptic terminal with sodium; this hemicholinium-3-sensitive uptake
          limits the rate of ACh synthesis.
        annotons:
          - id: slc5a7_choline_uptake
            label: CHT1 (SLC5A7) choline:sodium symport
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SLC5A7 (CHT1)
                term:
                  id: UniProtKB:Q9GZV3
                  label: High affinity choline transporter 1
            function:
              preferred_term: choline:sodium symporter activity
              term:
                id: GO:0005307
                label: choline:sodium symporter activity
              substrates:
                - preferred_term: extracellular choline
                  term:
                    id: CHEBI:15354
                    label: choline
            processes:
              - preferred_term: choline transport
                term:
                  id: GO:0015871
                  label: choline transport
            locations:
              - preferred_term: presynaptic membrane
                term:
                  id: GO:0042734
                  label: presynaptic membrane
            role_description: >-
              Supplies the choline substrate for CHAT; restricted to cholinergic neurons.
            evidence:
              - source_id: PMID:10649566
                statement: >-
                  CHT1 was cloned as the Na+-dependent high-affinity choline transporter
                  of cholinergic neurons.
                supporting_text: CHT1 is not homologous to neurotransmitter transporters, but is homologous to members of the Na+-dependent glucose transporter family. Expression of CHT1 mRNA is restricted to cholinergic neurons.
              - source_id: PMID:10649566
                statement: CHT1 accounts for synaptosomal high-affinity choline uptake.
                supporting_text: The characteristics of CHT1-mediated choline uptake essentially match those of high-affinity choline uptake in rat brain synaptosomes.
    - order: 2
      role: acetylcholine synthesis
      node:
        id: ach_synthesis
        label: CHAT synthesis of acetylcholine from acetyl-CoA and choline
        module_type: REACTION
        description: >-
          Cytosolic CHAT transfers the acetyl group of acetyl-CoA to choline, giving ACh
          and CoA; its presence defines a cholinergic neuron.
        annotons:
          - id: chat_ach_synthesis
            label: CHAT choline O-acetyltransferase activity
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CHAT
                term:
                  id: UniProtKB:P28329
                  label: Choline O-acetyltransferase
            function:
              preferred_term: choline O-acetyltransferase activity
              term:
                id: GO:0004102
                label: choline O-acetyltransferase activity
              substrates:
                - preferred_term: acetyl-CoA
                  term:
                    id: CHEBI:15351
                    label: acetyl-CoA
                - preferred_term: choline
                  term:
                    id: CHEBI:15354
                    label: choline
              products:
                - preferred_term: acetylcholine
                  term:
                    id: CHEBI:15355
                    label: acetylcholine
            processes:
              - preferred_term: acetylcholine biosynthetic process
                term:
                  id: GO:0008292
                  label: acetylcholine biosynthetic process
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The only ACh-synthesising enzyme of cholinergic neurons; this matches the
              core function in the CHAT gene review.
            evidence:
              - source_id: PMID:17144655
                statement: CHAT synthesises ACh from choline and acetyl-CoA.
                supporting_text: Choline acetyltransferase (ChAT) catalyzes the synthesis of the neurotransmitter acetylcholine from choline and acetyl-CoA, and its presence is a defining feature of cholinergic neurons.
              - source_id: PMID:11172068
                statement: >-
                  Catalytically impaired CHAT causes a congenital myasthenic syndrome with
                  stimulation-dependent failure of neuromuscular transmission.
                supporting_text: Here we report that mutations in CHAT cause a congenital myasthenic syndrome associated with frequently fatal episodes of apnea (CMS-EA).
    - order: 3
      role: vesicular acetylcholine loading
      node:
        id: ach_vesicle_loading
        label: VAChT (SLC18A3) loading of ACh into synaptic vesicles
        description: >-
          Included by reference to the VAChT variant of the synaptic vesicle
          neurotransmitter-loading module, which models SLC18A3 acetylcholine
          transmembrane transporter activity driven by the V-ATPase proton gradient.
        module_ref: synaptic_vesicle_neurotransmitter_loading#acetylcholine_loading
    - order: 4
      role: calcium-triggered vesicular ACh release
      node:
        id: ach_release
        label: Synaptic vesicle exocytosis of ACh
        description: >-
          Included by reference to the synaptic vesicle exocytosis module (docking,
          priming and calcium-triggered SNARE fusion), which is transmitter-agnostic.
        module_ref: synaptic_vesicle_exocytosis
    - order: 5
      role: acetylcholine reception
      node:
        id: ach_reception
        label: Nicotinic and muscarinic acetylcholine receptors
        module_type: SIGNALING_PATHWAY
        description: >-
          Released ACh binds ionotropic nicotinic receptors, which open a cation pore
          within milliseconds, and metabotropic muscarinic receptors, which activate
          heterotrimeric G proteins. A given synapse may use either class or both.
        variant_sets:
          - id: ach_receptor_class
            label: Receptor class
            axis: receptor class (ionotropic vs metabotropic)
            selection: ONE_OR_MORE
            notes: >-
              Many cholinergic targets, e.g. autonomic ganglia and hippocampal neurons,
              express both classes, hence ONE_OR_MORE.
            variants:
              - id: nicotinic_reception
                label: Nicotinic ACh receptor (ligand-gated cation channel) signalling
                module_type: SIGNALING_PATHWAY
                description: >-
                  Pentameric ACh-gated cation channels; two ACh sites in heteromers (at
                  alpha(+)/non-alpha(-) interfaces) and five in homomers. Opening
                  depolarises the postsynaptic membrane or, presynaptically, raises
                  terminal calcium to promote transmitter release. Corresponds to
                  PW:0000842.
                variant_sets:
                  - id: nachr_subtype
                    label: Nicotinic receptor subtype
                    axis: subunit composition / tissue
                    selection: ONE_OR_MORE
                    variants:
                      - id: nachr_muscle
                        label: Muscle-type nAChR at the neuromuscular junction
                        module_type: PROTEIN_COMPLEX
                        description: >-
                          (alpha1)2 beta1 delta epsilon in adult muscle, with gamma in
                          place of epsilon in fetal and denervated muscle.
                        annotons:
                          - id: muscle_nachr_channel
                            label: Muscle nAChR ACh-gated cation channel
                            participant:
                              selector_type: PROTEIN_COMPLEX
                              protein_complex:
                                preferred_term: muscle nicotinic acetylcholine receptor
                                term:
                                  id: GO:0005892
                                  label: acetylcholine-gated channel complex
                                active_units:
                                  - id: chrna1_unit
                                    label: alpha1 subunit (two copies)
                                    role: Principal (+) face of both ACh binding sites.
                                    participant:
                                      selector_type: GENE_PRODUCT
                                      gene_product:
                                        preferred_term: CHRNA1
                                        term:
                                          id: UniProtKB:P02708
                                          label: Acetylcholine receptor subunit alpha
                                  - id: chrnb1_unit
                                    label: beta1 subunit
                                    role: Non-binding structural subunit of the pentamer.
                                    participant:
                                      selector_type: GENE_PRODUCT
                                      gene_product:
                                        preferred_term: CHRNB1
                                        term:
                                          id: UniProtKB:P11230
                                          label: Acetylcholine receptor subunit beta
                                  - id: chrnd_unit
                                    label: delta subunit
                                    role: Complementary (-) face of one ACh site.
                                    participant:
                                      selector_type: GENE_PRODUCT
                                      gene_product:
                                        preferred_term: CHRND
                                        term:
                                          id: UniProtKB:Q07001
                                          label: Acetylcholine receptor subunit delta
                                  - id: chrne_unit
                                    label: epsilon subunit (adult)
                                    role: >-
                                      Complementary face of the second ACh site in adult
                                      receptors; confers short bursts and high conductance.
                                    participant:
                                      selector_type: GENE_PRODUCT
                                      gene_product:
                                        preferred_term: CHRNE
                                        term:
                                          id: UniProtKB:Q04844
                                          label: Acetylcholine receptor subunit epsilon
                                  - id: chrng_unit
                                    label: gamma subunit (fetal)
                                    role: >-
                                      Replaces epsilon in fetal receptors; longer openings,
                                      lower conductance.
                                    participant:
                                      selector_type: GENE_PRODUCT
                                      gene_product:
                                        preferred_term: CHRNG
                                        term:
                                          id: UniProtKB:P07510
                                          label: Acetylcholine receptor subunit gamma
                            function:
                              preferred_term: acetylcholine-gated monoatomic cation-selective channel activity
                              term:
                                id: GO:0022848
                                label: acetylcholine-gated monoatomic cation-selective channel activity
                            processes:
                              - preferred_term: neuromuscular synaptic transmission
                                term:
                                  id: GO:0007274
                                  label: neuromuscular synaptic transmission
                            locations:
                              - preferred_term: postsynaptic membrane
                                term:
                                  id: GO:0045211
                                  label: postsynaptic membrane
                              - preferred_term: neuromuscular junction
                                term:
                                  id: GO:0031594
                                  label: neuromuscular junction
                            role_description: >-
                              Generates the endplate potential that triggers the muscle
                              action potential; the activity is a property of the assembled
                              pentamer, which the subunit reviews record as contributes_to.
                            evidence:
                              - source_id: PMID:8788941
                                statement: >-
                                  Human adult and fetal muscle AChRs have the compositions
                                  modelled and differ in burst duration and conductance.
                                supporting_text: The single-channel properties of adult (alpha 2 beta delta epsilon) and fetal (alpha 2 beta delta gamma) forms of the human AChR were also investigated.
                              - source_id: PMID:39085615
                                statement: >-
                                  ACh released by motor neurons binds muscle nAChRs to
                                  initiate contraction; fetal and adult receptor types
                                  mark synapse maturation.
                                supporting_text: These neurons release acetylcholine (ACh), which binds to nicotinic ACh receptors (AChRs) on the muscle, initiating contraction.
                      - id: nachr_alpha4beta2
                        label: Neuronal alpha4beta2* and alpha6beta2* nAChRs
                        module_type: PROTEIN_COMPLEX
                        description: >-
                          The most abundant brain subtype, assembling as (alpha4)2(beta2)3
                          or (alpha4)3(beta2)2, with alpha2 able to replace alpha4 and
                          alpha5 as an accessory fifth subunit. The related alpha6beta2*
                          receptors, often with beta3, sit on dopaminergic and GABAergic
                          terminals.
                        annotons:
                          - id: alpha4beta2_nachr_channel
                            label: alpha4beta2*/alpha6beta2* nAChR ACh-gated cation channel
                            participant:
                              selector_type: PROTEIN_COMPLEX
                              protein_complex:
                                preferred_term: neuronal beta2-containing nicotinic receptor
                                term:
                                  id: GO:0005892
                                  label: acetylcholine-gated channel complex
                                active_units:
                                  - id: chrna4_unit
                                    label: alpha4 subunit
                                    role: Principal ACh-binding subunit of alpha4beta2*.
                                    participant:
                                      selector_type: GENE_PRODUCT
                                      gene_product:
                                        preferred_term: CHRNA4
                                        term:
                                          id: UniProtKB:P43681
                                          label: Neuronal acetylcholine receptor subunit alpha-4
                                  - id: chrnb2_unit
                                    label: beta2 subunit
                                    role: Complementary ACh-site subunit shared by alpha4beta2* and alpha6beta2*.
                                    participant:
                                      selector_type: GENE_PRODUCT
                                      gene_product:
                                        preferred_term: CHRNB2
                                        term:
                                          id: UniProtKB:P17787
                                          label: Neuronal acetylcholine receptor subunit beta-2
                                  - id: chrna2_unit
                                    label: alpha2 subunit
                                    role: Alternative principal alpha subunit pairing with beta2 or beta4.
                                    participant:
                                      selector_type: GENE_PRODUCT
                                      gene_product:
                                        preferred_term: CHRNA2
                                        term:
                                          id: UniProtKB:Q15822
                                          label: Neuronal acetylcholine receptor subunit alpha-2
                                  - id: chrna6_unit
                                    label: alpha6 subunit
                                    role: Principal subunit of presynaptic alpha6beta2* receptors.
                                    participant:
                                      selector_type: GENE_PRODUCT
                                      gene_product:
                                        preferred_term: CHRNA6
                                        term:
                                          id: UniProtKB:Q15825
                                          label: Neuronal acetylcholine receptor subunit alpha-6
                                  - id: chrnb3_unit
                                    label: beta3 subunit
                                    role: Accessory subunit of alpha6beta2beta3 receptors.
                                    participant:
                                      selector_type: GENE_PRODUCT
                                      gene_product:
                                        preferred_term: CHRNB3
                                        term:
                                          id: UniProtKB:Q05901
                                          label: Neuronal acetylcholine receptor subunit beta-3
                                  - id: chrna5_unit_b2
                                    label: alpha5 subunit
                                    role: Accessory fifth subunit that alters sensitivity and desensitisation.
                                    participant:
                                      selector_type: GENE_PRODUCT
                                      gene_product:
                                        preferred_term: CHRNA5
                                        term:
                                          id: UniProtKB:P30532
                                          label: Neuronal acetylcholine receptor subunit alpha-5
                            function:
                              preferred_term: acetylcholine-gated monoatomic cation-selective channel activity
                              term:
                                id: GO:0022848
                                label: acetylcholine-gated monoatomic cation-selective channel activity
                            processes:
                              - preferred_term: synaptic transmission, cholinergic
                                term:
                                  id: GO:0007271
                                  label: synaptic transmission, cholinergic
                              - preferred_term: presynaptic modulation of chemical synaptic transmission
                                term:
                                  id: GO:0099171
                                  label: presynaptic modulation of chemical synaptic transmission
                            locations:
                              - preferred_term: plasma membrane
                                term:
                                  id: GO:0005886
