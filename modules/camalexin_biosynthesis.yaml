  notes: >-
    Boundary. Parts 1-4 are the biosynthetic pathway (GO:0010120); part 5 is kept as an explicit
    regulatory part with its own concept (GO:1901183) so that the enzyme-versus-regulator split made in
    the MPK3 and WRKY33 gene reviews is visible: MPK3/MPK6 and WRKY33 regulate the pathway and are not
    parts of it. Upstream perception (CERK1, FLS2, MKK4/MKK5), the MPK4-MKS1 sequestration of WRKY33,
    other transcriptional inputs, tryptophan supply, camalexin export (ABCG36/PDR8) and the indole
    glucosinolate, auxin and 4-hydroxy-ICN branches from IAOx are outside this module.
    Metabolon. CYP79B2, CYP71A12, CYP71A13 and CYP71B15 co-purify and interact (co-IP, FRET-FLIM) with
    each other and with P450 reductase ATR1 at the ER (PMID:31511315). This is recorded in prose rather
    than as a complex part because the complex has no GO term beyond generic catalytic complex and the
    soluble steps (GST, GGP) are not shown to be in it. GSTU4 binds the complex but is not a pathway enzyme.
    Gene reviews. CYP79B2, CYP79B3, CYP71A13, CYP71A12, GSTF6, CYP71B15, GGP1, WRKY33 and MPK3 have
    completed reviews (genes/ARATH/) and the annoton functions and locations follow their core functions;
    MPK6's review is DRAFT. GGP3 and GSTU4 have no gene review yet and are grounded by UniProt only.
    CYP71A13 and CYP71A12 are modelled as separate annotons because their reviews assign different core
    molecular functions (GO:0047720 for CYP71A13; GO:0004497 plus a proposed cyanohydrin-forming term for
    CYP71A12).
    PANTHER. Only GGP1 is in the local PANTHER member index, so the other family descriptors carry no
    PANTHER id.
  knowledge_gaps:
    - gap_statement: >
        The enzyme that conjugates the CYP71A13-derived electrophile to glutathione in vivo is not
        established, nor is the share of enzymatic versus spontaneous conjugation.
      boundary: >
        GSTF6 is implicated by modest knockout/overexpression changes in camalexin (Su et al. 2011) and by
        GS-IAN formation with extracts of GSTF6-expressing yeast, although control yeast also form GSH(IAN).
        Against a dedicated role, the GSTF6 gene review records that gstf2 gstf3 gstf6 triple and gstf2
        gstf3 gstf6 gstf7 knockdown lines make normal camalexin, that 41 of 54 Arabidopsis GSTs supported
        GS-IAN formation with CYP71A13 in engineered yeast (Mucha et al. 2019), and that the electrophile
        reacts with glutathione or cysteine without an enzyme; CYP71A13 consumes IAOx at the same rate
        whichever thiol donor is present (Klein et al. 2013). GSTU4 binds the metabolon but is not a
        pathway enzyme, as camalexin rises in gstu4 knockouts. The Mucha et al. 2019 GST data come from
        the GSTF6 deep research; the cached PMID:31511315 entry is abstract-only.
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: Determines whether GSTF6, or any GST, can be annotated as performing this camalexin
        step. The GSTF6 review does not annotate it to camalexin biosynthetic process and raises the
        question as a suggested question.
      resolution: Assay purified GSTF6 and other phi/tau GSTs with CYP71A13-generated electrophile and
        glutathione against the uncatalysed rate, and test higher-order GST mutants for accumulation of
        IAN-derived side products after induction.
      provenance:
        - reference_id: PMID:23449503
          reference_section_type: LITERATURE_REVIEW
          supporting_text: which, after an unknown activation step, is conjugated to the tripeptide
            glutathione (γ-Glu-Cys-Gly) by glutathione S -transferases, including GSTF6
        - reference_id: PMID:21239642
          reference_section_type: ABSTRACT
          supporting_text: GSTF6 overexpression increased and GSTF6-knockout reduced camalexin production.
        - reference_id: PMID:24151049
          supporting_text: Taken together, the above data indicate that these P450s do not directly
            catalyze C–S bond formation, and that α-hydroxy-IAN is a precursor to Cys-IAN.
        - reference_id: file:ARATH/GSTF6/GSTF6-deep-research-falcon.md
          supporting_text: In a 2019 engineered-yeast screen, **41 of 54** tested Arabidopsis GSTs
            supported GS-IAN formation in the presence of CYP71A13.
        - reference_id: file:ARATH/GSTF6/GSTF6-deep-research-falcon.md
          supporting_text: After silver-nitrate induction, camalexin did **not** differ significantly from
            wild type in a *gstf2 gstf3 gstf6* triple knockout or a four-gene knockdown additionally
            targeting *gstf7*.
        - reference_id: file:modules/camalexin_biosynthesis-deep-research-falcon.md
          supporting_text: A dedicated, uniquely obligatory **GST protein** is another matter.
    - gap_statement: >
        GO has no molecular-function term for the O2- and reductase-dependent alpha-hydroxylation of IAOx
        to indole-3-cyanohydrin, or for its conversion to the thiol-trapped dehydro-IAN electrophile, so
        the camalexin-relevant activity of CYP71A13 and CYP71A12 is represented only by the IAOx
        dehydratase term (CYP71A13) or generic monooxygenase activity (CYP71A12). Whether dehydro-IAN
        formation is enzyme-catalysed, and whether IAN is an on- or off-pathway product, is not settled.
      boundary: >
        18O2 labelling shows an alpha-hydroxy-IAN intermediate for both CYP71A13 and CYP71A12, and
        CYP71A13 converts IAOx to an electrophile that accepts the thiol of cysteine or glutathione. IAN is
        the major in vitro product of CYP71A13 but is turned over about 1000-fold more slowly than IAOx,
        so IAOx is the likely in vivo substrate. Dehydration of the cyanohydrin to dehydro-IAN by the
        enzyme is proposed, not demonstrated.
      gap_kind:
        - BIOLOGY
        - ONTOLOGY
      status: OPEN
      significance: GO:0047720 captures only the dehydration to IAN, which may be off-pathway. Without a
        cyanohydrin-forming term the committed camalexin chemistry cannot be annotated on either P450.
      resolution: Create the proposed term below (proposed in the CYP71A12 gene review; the CYP71A13 review
        raises the same need as a suggested question), and resolve whether dehydro-IAN formation is
        enzymatic with purified CYP71A13 and P450 reductase.
      provenance:
        - reference_id: PMID:24151049
          reference_section_type: RESULTS
          supporting_text: With 97% 18O2, both CYP71A13 and CYP71A12 catalyze incorporation of the isotopic
            label into IAL (74% and 81% 18O incorporation, respectively, Figure S10), providing clear
            evidence for an α-hydroxy-IAN intermediate.
        - reference_id: PMID:24151049
          reference_section_type: RESULTS
          supporting_text: The persistent production of the dehydration product IAN alongside oxidized
            products from IAOx led us to examine whether IAN is an intermediate en route to camalexin or
            an off-pathway product.
      proposed_terms:
        - proposed_name: indole-3-acetaldoxime monooxygenase (indole-3-cyanohydrin-forming) activity
          proposed_definition: >-
            Catalysis of the NADPH-P450 reductase- and O2-dependent alpha-hydroxylation of
            (E)-indol-3-ylacetaldoxime to 2-hydroxy-2-(1H-indol-3-yl)acetonitrile (indole-3-cyanohydrin).
          justification: Proposed in genes/ARATH/CYP71A12/CYP71A12-ai-review.yaml; the 18O2 labelling
            applies equally to CYP71A13, whose review asks for the same term.
          supported_by:
            - reference_id: PMID:24151049
              reference_section_type: RESULTS
              supporting_text: both CYP71A13 and CYP71A12 catalyze incorporation of the isotopic label into
                IAL
            - reference_id: PMID:25953104
              reference_section_type: ABSTRACT
              supporting_text: for CYP71A12, indole-3-carbaldehyde and cyanide were identified as major
                reaction products.
    - gap_statement: >
        The peptidase that removes glycine from Cys(IAN)-Gly to give Cys(IAN) is unidentified.
      boundary: >
        Conversion of GS-IAN to Cys(IAN) needs a gamma-glutamyl peptidase (GGP1/GGP3) and a
        carboxypeptidase; phytochelatin synthase PCS1 was proposed but not established.
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: This is the one enzymatic step of the pathway with no candidate gene.
      resolution: Screen candidate cytosolic dipeptidases/carboxypeptidases for Cys(IAN)-Gly accumulation
        and loss of camalexin after induction.
      provenance:
        - reference_id: PMID:23449503
          reference_section_type: LITERATURE_REVIEW
          supporting_text: The subsequent conversion of γ-Glu-Cys(IAN)-Gly to Cys(IAN) requires the action
            of both a GGP and a carboxypeptidase.
    - gap_statement: >
        The reduced camalexin of ggt1 and ggt2 mutants in liquid-grown seedlings is unexplained, given
        that GGT1/GGT2 are apoplastic and do not cause GS-IAN accumulation.
      boundary: >
        GGP1/GGP3 mutants accumulate GS-IAN and make less camalexin in leaves; ggt1/ggt2 mutants do not
        accumulate the intermediates and affect camalexin only in liquid-culture media.
      gap_kind:
        - BIOLOGY
        - CURATION
      status: OPEN
      significance: GGT1/GGT2 should not be annotated as camalexin biosynthetic enzymes unless an
        indirect mechanism is excluded.
      resolution: Profile intermediates in ggt mutants under the liquid-culture conditions in which the
        camalexin phenotype is seen.
      provenance:
        - reference_id: PMID:21712415
          reference_section_type: DISCUSSION
          supporting_text: Future studies are needed to explain the interesting camalexin phenotype seen
            upon knockout of the extracellular GGTs
    - gap_statement: >
        GO has no molecular-function term for the first PAD3 reaction (Cys(IAN) to dihydrocamalexic acid
        with cyanide release, RHEA:10452), and GO:0010298 describes the second reaction as a simple
        decarboxylation rather than an O2-dependent oxidative decarboxylation.
      boundary: Both PAD3 reactions are demonstrated with recombinant enzyme and are in Rhea
        (RHEA:10452, RHEA:34807) and EC 1.14.19.52.
      gap_kind:
        - ONTOLOGY
      status: OPEN
      significance: Without the term the PAD3 activity is only half represented in GO.
      resolution: Create the proposed term below (proposed in the CYP71B15 gene review) and consider
        redefining GO:0010298 under oxidoreductase activity.
      provenance:
        - reference_id: PMID:19567706
          reference_section_type: ABSTRACT
          supporting_text: Surprisingly, yeast-expressed CYP71B15 also catalyzed thiazoline ring closure,
            DHCA formation, and cyanide release with Cys(IAN) as substrate.
      proposed_terms:
        - proposed_name: dihydrocamalexate synthase activity
          proposed_definition: >-
            Catalysis of the reaction: 2-(L-cystein-S-yl)-2-(1H-indol-3-yl)-acetonitrile + reduced
            [NADPH--hemoprotein reductase] + O2 = (R)-dihydrocamalexate + hydrogen cyanide + oxidized
            [NADPH--hemoprotein reductase] + 2 H2O + 2 H+ (RHEA:10452).
          justification: First of the two demonstrated CYP71B15 reactions; see
            genes/ARATH/CYP71B15/CYP71B15-ai-review.yaml.
          supported_by:
            - reference_id: PMID:19567706
              reference_section_type: ABSTRACT
              supporting_text: Cys(IAN) rescued the camalexin-deficient phenotype of cyp79b2 cyp79b3 and
                was itself converted to dihydrocamalexic acid (DHCA), the known substrate of CYP71B15
                (PAD3), by microsomes isolated from silver nitrate-treated Arabidopsis leaves.
    - gap_statement: >
        The MPK6 gene review does not record positive regulation of camalexin biosynthetic process as a
        core function, although MPK6 acts redundantly with MPK3 in phosphorylating WRKY33.
      boundary: >
        MPK3/MPK6 phosphorylate WRKY33 in vivo and the cascade regulates camalexin synthesis; the MPK3
        review uses GO:1901183. The MPK6 review is DRAFT and places this role under defence response
        to bacterium.
      gap_kind:
        - CURATION
      status: OPEN
      significance: The two paralogs are treated differently for the same role.
      resolution: When the MPK6 review is completed, consider a GO:1901183 core function matching MPK3.
      provenance:
        - reference_id: PMID:18378893
          reference_section_type: ABSTRACT
          supporting_text: Here, we report that synthesis of camalexin, the major phytoalexin in
            Arabidopsis , is regulated by the MPK3/MPK6 cascade.
