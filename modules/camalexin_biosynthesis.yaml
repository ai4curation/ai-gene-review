id: MODULE:camalexin_biosynthesis
title: Camalexin biosynthesis (tryptophan-derived indole phytoalexin)
description: >
  Camalexin (3-thiazol-2'-yl-indole) is the main phytoalexin of Arabidopsis and related Brassicaceae,
  made from tryptophan after pathogen attack. Tryptophan is converted to indole-3-acetaldoxime (IAOx) by
  CYP79B2/CYP79B3, IAOx to indole-3-acetonitrile (IAN) and onward by CYP71A13/CYP71A12, the nitrile
  intermediate is conjugated to glutathione and processed to a cysteine conjugate, and the bifunctional
  P450 CYP71B15 (PAD3) converts the cysteine conjugate to dihydrocamalexic acid and then camalexin. The
  pathway P450s associate in an ER-anchored metabolic complex. Pathogen-induced transcription of the
  biosynthetic genes depends on the MPK3/MPK6-WRKY33 module.
status: DRAFT
scope: CONCRETE
