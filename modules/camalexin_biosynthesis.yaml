id: MODULE:camalexin_biosynthesis
title: Camalexin biosynthesis (tryptophan-derived indole phytoalexin)
description: >
  Camalexin (3-thiazol-2'-yl-indole) is the main phytoalexin of Arabidopsis thaliana and is made from
  tryptophan after pathogen attack. The ER-anchored cytochrome P450s CYP79B2 and CYP79B3 convert tryptophan
  to indole-3-acetaldoxime (IAOx), a branch point shared with indole glucosinolate and auxin biosynthesis.
  CYP71A13, with a minor contribution from its paralog CYP71A12, commits IAOx to the camalexin branch. It
  monooxygenates IAOx to an alpha-hydroxy-indole-3-acetonitrile (indole-3-cyanohydrin) intermediate and is
  proposed to dehydrate this to a reactive electrophile (dehydro-IAN) that is captured by the thiol of
  glutathione or cysteine. CYP71A13 also dehydrates IAOx to indole-3-acetonitrile (IAN), which may be
  largely an off-pathway product; CYP71A12 releases more of the cyanohydrin as its breakdown products
  indole-3-carbaldehyde and cyanide. Glutathione transferases, including GSTF6, are implicated in the
  conjugation, but many GSTs can support it, higher-order phi-class GST mutants make normal camalexin, and
  the electrophile can react with glutathione without an enzyme. The cytosolic gamma-glutamyl peptidases GGP1 and GGP3 remove the gamma-glutamyl residue of
  the glutathione conjugate (GS-IAN), and an unidentified peptidase removes glycine to give the cysteine
  conjugate Cys(IAN). The bifunctional P450 CYP71B15 (PAD3) then closes the thiazoline ring of Cys(IAN)
  with cyanide release to form dihydrocamalexic acid, and oxidatively decarboxylates it to camalexin. The
  pathway P450s associate with each other and with P450 reductase in an ER-anchored metabolon that channels
  intermediates. Pathogen-induced transcription of the biosynthetic genes depends on the MAP kinases MPK3
  and MPK6, which phosphorylate the WRKY33 transcription factor; WRKY33 binds and activates the CYP71A13 and
  PAD3 promoters. These two components regulate the pathway and are not pathway enzymes.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:23449503
    title: 'Assigning gene function in biosynthetic pathways: camalexin and beyond.'
    statement: Overview of the pathway from Trp through IAOx, IAN, the glutathione conjugate and Cys(IAN)
      to camalexin, with GGPs rather than GGTs as the gamma-glutamyl cleaving enzymes.
    supporting_text: >-
      The glutathione conjugate γ-Glu-Cys(IAN)-Gly is then hydrolyzed by two consecutive peptidase reactions
      (discussed in detail below) to Cys(IAN), which is finally converted to camalexin by a two-step reaction
      catalyzed by CYP71B15 (PAD3)
  - source_id: PMID:31511315
    title: The Formation of a Camalexin Biosynthetic Metabolon.
    statement: The camalexin P450s form an enzyme complex that channels intermediates such as IAOx.
    supporting_text: >-
      Arabidopsis (Arabidopsis thaliana) efficiently synthesizes the antifungal phytoalexin camalexin without
      the apparent release of bioactive intermediates, such as indole-3-acetaldoxime, suggesting that the
      biosynthetic pathway of this compound is channeled by the formation of an enzyme complex.
  - source_id: PMID:31511315
    title: The Formation of a Camalexin Biosynthetic Metabolon.
    statement: GSTU4 binds the metabolon but is not a camalexin biosynthetic enzyme; camalexin rises in
      gstu4 knockouts.
    supporting_text: >-
      This shows that GSTU4 is not directly involved in camalexin biosynthesis but rather plays a role in
      a competing mechanism.
  - source_id: file:modules/camalexin_biosynthesis-deep-research-falcon.md
    title: Camalexin biosynthesis module deep research (falcon)
    statement: Used as retrieval support only, after the module was drafted. It agrees with the
      structure here (GGP1/GGP3 not GGT1/GGT2, unidentified glycine-removing peptidase, GSTF6 as a
      candidate rather than an established GST, GSTU4 not a pathway enzyme). Identifiers and structural
      claims were checked against UniProt, QuickGO, Rhea, the cached publications or the gene reviews.
module:
  id: camalexin_biosynthesis
  label: Camalexin biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: camalexin biosynthetic process
      term:
        id: GO:0010120
        label: camalexin biosynthetic process
      description: Tryptophan to camalexin (parts 1-4). Part 5 is regulation of this process, not a
        step of it.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: Concrete Arabidopsis instance. Camalexin and related thiazolyl-indole phytoalexins
          occur in other Brassicaceae (Camelina, Capsella), whose orthologs are not modelled here.
  parts:
    - order: 1
      role: tryptophan to indole-3-acetaldoxime (CYP79B2/B3)
      node:
        id: iaox_formation
        label: IAOx formation
        module_type: REACTION
        description: >-
          N-hydroxylation and decarboxylation of L-tryptophan to (E)-indol-3-ylacetaldoxime (RHEA:33279,
          EC 1.14.14.156). The step is shared with indole glucosinolate and auxin biosynthesis; the
          cyp79b2 cyp79b3 double mutant lacks camalexin and indole glucosinolates.
        annotons:
          - id: cyp79b_activity
            label: "CYP79B2/CYP79B3: tryptophan N-monooxygenase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CYP79B tryptophan N-monooxygenases (redundant paralogs)
                representative_members:
                  - preferred_term: CYP79B2 (Arabidopsis; pathogen-induced, main camalexin contributor)
                    term:
                      id: UniProtKB:O81346
                      label: Tryptophan N-monooxygenase 1
                  - preferred_term: CYP79B3 (Arabidopsis)
                    term:
                      id: UniProtKB:Q501D8
                      label: Tryptophan N-monooxygenase 2
            function:
              preferred_term: tryptophan N-monooxygenase activity
              term:
                id: GO:0090489
                label: tryptophan N-monooxygenase activity
              substrates:
                - preferred_term: L-tryptophan
                - preferred_term: O2
                - preferred_term: reduced [NADPH--hemoprotein reductase]
              products:
                - preferred_term: (E)-indol-3-ylacetaldoxime (IAOx)
                - preferred_term: CO2
              evidence:
                - source_id: PMID:15148388
                  statement: Camalexin is made from Trp via IAOx formed by CYP79B2/CYP79B3; the double
                    mutant is devoid of camalexin and labelled IAOx is incorporated.
                  supporting_text: >-
                    We show that camalexin, the indole phytoalexin of Arabidopsis thaliana, is synthesized
                    from tryptophan via indole-3-acetaldoxime (IAOx) in a reaction catalyzed by CYP79B2 and
                    CYP79B3.
                - source_id: PMID:10681464
                  statement: CYP79B2 and CYP79B3 convert Trp to IAOx.
                  supporting_text: >-
                    We have identified two Arabidopsis cytochrome P450s (CYP79B2 and CYP79B3) that can
                    convert Trp to indole-3-acetaldoxime (IAOx)
                - source_id: file:ARATH/CYP79B2/CYP79B2-ai-review.yaml
                  statement: CYP79B2 gene review core function (GO:0090489, directly involved in
                    GO:0010120 and GO:0009759).
                - source_id: file:ARATH/CYP79B3/CYP79B3-ai-review.yaml
                  statement: CYP79B3 gene review core function (GO:0090489, directly involved in
                    GO:0010120 and GO:0009759), redundant with CYP79B2.
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
                evidence:
                  - source_id: file:ARATH/CYP79B2/CYP79B2-ai-review.yaml
                    statement: Core-function location in the CYP79B2 gene review.
                  - source_id: file:ARATH/CYP79B3/CYP79B3-ai-review.yaml
                    statement: Core-function location in the CYP79B3 gene review.
            notes: >-
              Both paralogs have completed gene reviews with the same core function. Unlike CYP79B2,
              CYP79B3 is not induced when camalexin synthesis is elicited by silver nitrate (CYP79B3
              review), so CYP79B2 is listed as the main camalexin contributor.
    - order: 2
      role: indole-3-acetaldoxime to the reactive cyanohydrin / dehydro-IAN intermediate (CYP71A13, minor
        CYP71A12)
      node:
        id: ian_formation
        label: Indole cyanohydrin / dehydro-IAN formation
        module_type: REACTION
        description: >-
          The committed camalexin step. With 18O2 labelling, Klein et al. 2013 showed that CYP71A13 and
          CYP71A12 monooxygenate IAOx to an alpha-hydroxy-IAN (indole-3-cyanohydrin) intermediate. They
          propose that the enzyme then dehydrates this to a reactive electrophile (dehydro-IAN) that is
          captured by the free thiol of cysteine or glutathione; the P450 does not itself form the C-S bond.
          The dehydration of IAOx to IAN (RHEA:23156, EC 4.8.1.3), long taken as the pathway step, is the
          major in vitro product of CYP71A13, but IAN is turned over about 1000-fold more slowly than IAOx
          and may be largely an off-pathway product. CYP71A13 forms the thiol-trapped product more
          efficiently; CYP71A12 releases more of the cyanohydrin as indole-3-carbaldehyde and cyanide.
          GO has no molecular-function term for the cyanohydrin-forming monooxygenation (see knowledge
          gaps).
        annotons:
          - id: cyp71a13_activity
            label: "CYP71A13: indoleacetaldoxime dehydratase / IAOx-activating P450 (main camalexin enzyme)"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CYP71A13 (Arabidopsis; main camalexin enzyme)
                term:
                  id: UniProtKB:O49342
                  label: Indoleacetaldoxime dehydratase
            function:
              preferred_term: indoleacetaldoxime dehydratase activity
              term:
                id: GO:0047720
                label: indoleacetaldoxime dehydratase activity
              description: >-
                Used as in the CYP71A13 gene review core function. The term covers only the dehydration of
                IAOx to IAN; the O2- and reductase-dependent formation of the alpha-hydroxy-IAN and
                dehydro-IAN intermediate that feeds camalexin has no GO term.
              substrates:
                - preferred_term: (E)-indol-3-ylacetaldoxime (IAOx)
                - preferred_term: O2 (for the cyanohydrin-forming monooxygenation)
                - preferred_term: reduced [NADPH--hemoprotein reductase]
              products:
                - preferred_term: indole-3-acetonitrile (IAN; possibly off-pathway)
                - preferred_term: dehydro-IAN electrophile via alpha-hydroxy-IAN (thiol-trapped by glutathione
                    or cysteine)
              evidence:
                - source_id: PMID:17573535
                  statement: Recombinant CYP71A13 converts IAOx to IAN; cyp71A13 mutants make little
                    camalexin and are rescued by IAN.
                  supporting_text: >-
                    these results lead to the conclusion that CYP71A13 catalyzes the conversion of IAOx to
                    IAN in camalexin synthesis
                - source_id: PMID:24151049
                  statement: CYP71A13 converts IAOx to an electrophile that accepts the thiol of cysteine or
                    glutathione.
                  supporting_text: >-
                    These data establish that CYP71A13 catalyzes the conversion of IAOx to an electrophile
                    capable of accepting the thiol group of L-cysteine or glutathione
                - source_id: PMID:24151049
                  statement: 18O2 is incorporated into indole-3-carboxaldehyde by CYP71A13 and CYP71A12,
                    showing an alpha-hydroxy-IAN (cyanohydrin) intermediate.
                  supporting_text: >-
                    both CYP71A13 and CYP71A12 catalyze incorporation of the isotopic label into IAL (74% and
                    81% 18O incorporation, respectively, Figure S10), providing clear evidence for an
                    α-hydroxy-IAN intermediate
                - source_id: PMID:24151049
                  statement: The enzyme is proposed to dehydrate alpha-hydroxy-IAN to dehydro-IAN, which a
                    free thiol captures; CYP71A13 makes this intermediate more efficiently than CYP71A12.
                  supporting_text: >-
                    we suggest that the enzyme dehydrates α-hydroxy-IAN to a reactive electrophile (e.g.
                    dehydro-IAN, Scheme 3) that can be captured by a free thiol
                - source_id: PMID:24151049
                  statement: IAN is a poor substrate (about 1000-fold slower than IAOx), so IAOx rather than
                    IAN is the likely in vivo substrate and IAN may be off-pathway.
                  supporting_text: >-
                    These data suggest that IAOx is likely the in vivo substrate of both P450s.
                - source_id: PMID:31511315
                  statement: The glutathionylated intermediate is indole-3-cyanohydrin, made by CYP71A12
                    and especially CYP71A13.
                  supporting_text: >-
                    Camalexin biosynthesis involves glutathionylation of the intermediary
                    indole-3-cyanohydrin, which is synthesized by CYP71A12 and especially CYP71A13.
                - source_id: file:ARATH/CYP71A13/CYP71A13-ai-review.yaml
                  statement: CYP71A13 gene review core function (GO:0047720, directly involved in
                    GO:0010120, at the ER membrane), whose description includes the cyanohydrin-forming
                    oxidation.
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
                evidence:
                  - source_id: PMID:21712415
                    statement: The camalexin P450s are ER-associated with the catalytic domain facing the
                      cytosol.
                    supporting_text: >-
                      three of the four known enzymes in the pathway (including the first and the last
                      one) are cytochromes P450, which are associated with the endoplasmic reticulum,
                      having their catalytic domain facing the cytosol
                  - source_id: file:ARATH/CYP71A13/CYP71A13-ai-review.yaml
                    statement: Core-function location in the CYP71A13 gene review.
            notes: >-
              GO:0047720 is kept because the CYP71A13 gene review keeps it as the core molecular function
              (IDA in GOA, PMID:17573535). It under-describes the chemistry: the camalexin-relevant
              activity is the monooxygenation of IAOx to alpha-hydroxy-IAN and its conversion to the
              thiol-trapped electrophile, for which GO has no term. The CYP71A13 review raises this as a
              suggested question.
          - id: cyp71a12_activity
            label: "CYP71A12: IAOx monooxygenase forming indole-3-cyanohydrin (minor camalexin contribution)"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CYP71A12 (Arabidopsis; minor contribution to camalexin, main enzyme of the
                  ICOOH and 4-hydroxy-ICN branches)
                term:
                  id: UniProtKB:O49340
                  label: Cytochrome P450 71A12
            function:
              preferred_term: monooxygenase activity (IAOx alpha-hydroxylation to indole-3-cyanohydrin)
              term:
                id: GO:0004497
                label: monooxygenase activity
              description: >-
                Used as in the CYP71A12 gene review core function, which proposes a specific term,
                indole-3-acetaldoxime monooxygenase (indole-3-cyanohydrin-forming) activity (see knowledge
                gaps). Indoleacetaldoxime dehydratase activity (GO:0047720) is not asserted for CYP71A12.
              substrates:
                - preferred_term: (E)-indol-3-ylacetaldoxime (IAOx)
                - preferred_term: O2
                - preferred_term: reduced [NADPH--hemoprotein reductase]
              products:
                - preferred_term: indole-3-cyanohydrin (alpha-hydroxy-IAN)
                - preferred_term: indole-3-carbaldehyde and hydrogen cyanide (cyanohydrin breakdown products)
              evidence:
                - source_id: PMID:24151049
                  statement: 18O2 labelling shows that CYP71A12, like CYP71A13, alpha-hydroxylates IAOx.
                  supporting_text: >-
                    both CYP71A13 and CYP71A12 catalyze incorporation of the isotopic label into IAL
                - source_id: PMID:25953104
                  statement: Indole-3-carbaldehyde and cyanide are the major CYP71A12 products.
                  supporting_text: >-
                    for CYP71A12, indole-3-carbaldehyde and cyanide were identified as major reaction
                    products
                - source_id: PMID:25953104
                  statement: cyp71A12 cyp71A13 double mutants make only traces of camalexin, so CYP71A12
                    contributes to camalexin in leaves.
                  supporting_text: >-
                    double mutants synthesized only traces of camalexin, demonstrating that CYP71A12
                    contributes to camalexin biosynthesis in leaf tissue
                - source_id: PMID:26352477
                  statement: CYP71A12 is the main enzyme of the parallel 4-hydroxy-ICN branch, and its loss
                    changes camalexin only slightly.
                  supporting_text: >-
                    Levels of camalexin and other indolic metabolites were only slightly changed in
                    whole-seedling tissue extracts of the cyp71A12 mutant
                - source_id: file:ARATH/CYP71A12/CYP71A12-ai-review.yaml
                  statement: CYP71A12 gene review core function (GO:0004497, directly involved in
                    GO:0010120 and GO:0042435, at the ER membrane).
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
                evidence:
                  - source_id: file:ARATH/CYP71A12/CYP71A12-ai-review.yaml
                    statement: Core-function location in the CYP71A12 gene review.
            notes: >-
              CYP71A12 is modelled as a separate annoton so that it does not inherit the CYP71A13
              dehydratase term. Its main products enter the indole-3-carboxylic acid and 4-hydroxy-ICN
              branches, which are outside this module.
    - order: 3
      role: glutathione conjugation and processing to the cysteine conjugate (GSTF6, GGP1/GGP3)
      node:
        id: gsh_conjugation
        label: Glutathione conjugation and processing
        module_type: METABOLIC_PATHWAY
        description: >-
          Glutathione, not free cysteine, supplies the thiazole sulfur. The activated IAN intermediate is
          conjugated to glutathione (GS-IAN); the gamma-glutamyl residue is removed in the cytosol by GGP1
          (and GGP3), and glycine is then removed by an unidentified peptidase to give Cys(IAN). The
          extracellular gamma-glutamyl transpeptidases GGT1/GGT2 were proposed for the gamma-glutamyl step
          but the intermediate-accumulation, localization and enzyme-activity evidence favours GGP1.
        parts:
          - order: 1
            role: glutathione conjugation of the activated IAN intermediate
            node:
              id: gst_conjugation
              label: Glutathione conjugation (GSTF6)
              module_type: REACTION
              annotons:
                - id: gstf6_activity
                  label: "GSTF6: glutathione transferase (implicated)"
                  participant:
                    selector_type: GENE_PRODUCT
                    gene_product:
                      preferred_term: GSTF6 (Arabidopsis)
                      term:
                        id: UniProtKB:P42760
                        label: Glutathione S-transferase F6
                  function:
                    preferred_term: glutathione transferase activity (conjugation of activated IAN)
                    term:
                      id: GO:0004364
                      label: glutathione transferase activity
                    substrates:
                      - preferred_term: indole-3-cyanohydrin / activated IAN intermediate
                      - preferred_term: glutathione
                    products:
                      - preferred_term: GS-IAN (gamma-Glu-Cys(IAN)-Gly)
                    evidence:
                      - source_id: PMID:23449503
                        statement: GSTF6 is implicated by knockout/overexpression camalexin levels and by
                          GS-IAN formation with extracts of GSTF6-expressing yeast.
                        supporting_text: >-
                          provided support for the involvement of GSTF6 in the camalexin pathway by
                          measuring camalexin levels in knockout and overexpression mutants and by
                          demonstrating that extracts of GSTF6-expressing yeast could aid the formation of
                          γ-Glu-Cys(IAN)-Gly from GSH and IAN
                      - source_id: PMID:21239642
                        statement: gstf6 knockout reduces and GSTF6 overexpression increases camalexin, and
                          GSTF6 expressed in yeast supports GSH(IAN) formation; the GSTF6 review records
                          from the full text that the knockout effect is modest (about 27-28 percent) and
                          that control yeast also form GSH(IAN).
                        supporting_text: >-
                          GSTF6 overexpression increased and GSTF6-knockout reduced camalexin production.
                      - source_id: file:ARATH/GSTF6/GSTF6-ai-review.yaml
                        statement: GSTF6 gene review core function is glutathione transferase activity
                          (GO:0004364) in the cytosol, with participation in camalexin biosynthesis
                          described as a redundant contribution rather than a dedicated step; it is not
                          annotated to camalexin biosynthetic process.
                  locations:
                    - preferred_term: cytosol
                      term:
                        id: GO:0005829
                        label: cytosol
                      evidence:
                        - source_id: PMID:21712415
                          statement: GSTF6 lacks targeting peptides and is predicted to be cytosolic.
                          supporting_text: >-
                            The fourth enzyme, GSTF6, lacks predicted signaling peptides and is therefore
                            most likely cytosolic.
                        - source_id: file:ARATH/GSTF6/GSTF6-ai-review.yaml
                          statement: Core-function location in the GSTF6 gene review.
                  notes: >-
                    The 'implicated' framing follows the GSTF6 gene review, which keeps glutathione
                    transferase activity as core but treats GSTF6 as one of several redundant
                    contributors to GS-IAN formation: single-gene knockout and overexpression effects
                    are modest (Su et al. 2011), camalexin is normal in gstf2 gstf3 gstf6 triple and
                    gstf2 gstf3 gstf6 gstf7 knockdown lines, 41 of 54 Arabidopsis GSTs supported GS-IAN
                    formation with CYP71A13 in engineered yeast (Mucha et al. 2019, as reported in the
                    GSTF6 deep research), and the CYP71A13-derived electrophile reacts with thiols
                    without an enzyme (PMID:24151049). GOA has no camalexin annotation for GSTF6. GSTU4
                    (UniProtKB:Q9ZW27) is recruited to the metabolon but is not a pathway enzyme
                    (camalexin rises in gstu4 knockouts; PMID:31511315) and is deliberately not modelled
                    as a participant.
          - order: 2
            role: removal of the gamma-glutamyl residue from GS-IAN
            node:
              id: ggp_step
              label: Gamma-glutamyl removal (GGP1/GGP3)
              module_type: REACTION
              annotons:
                - id: ggp1_activity
                  label: "GGP1 (and GGP3): gamma-glutamyl peptidase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: GGP1 gamma-glutamyl peptidase subfamily
                      term:
                        id: PANTHER:PTHR42695:SF14
                        label: GAMMA-GLUTAMYL PEPTIDASE 1
                      representative_members:
                        - preferred_term: GGP1 (Arabidopsis)
                          term:
                            id: UniProtKB:Q9M0A7
                            label: Gamma-glutamyl peptidase 1
                  function:
                    preferred_term: gamma-glutamyl-peptidase activity
                    term:
                      id: GO:0034722
                      label: gamma-glutamyl-peptidase activity
                    substrates:
                      - preferred_term: GS-IAN (gamma-Glu-Cys(IAN)-Gly)
                    products:
                      - preferred_term: Cys(IAN)-Gly
                      - preferred_term: L-glutamate
                    evidence:
                      - source_id: PMID:21712415
                        statement: ggp1 and ggp1 ggp3 mutants make less camalexin and accumulate GS-IAN;
                          recombinant GGPs metabolize GS-IAN.
                        supporting_text: >-
                          we conclude that GGP1 and GGP3 are enzymes metabolizing GS-IAN in the camalexin
                          pathway
                      - source_id: PMID:23449503
                        statement: Applying end-product, intermediate, activity and localization criteria,
                          GGP1 rather than GGT1/GGT2 acts in the pathway.
                        supporting_text: >-
                          By applying these criteria to the camalexin pathway, we conclude that GGP1 and
                          not GGT1 or GGT2 are part of the camalexin pathway.
                      - source_id: file:ARATH/GGP1/GGP1-ai-review.yaml
                        statement: GGP1 gene review core function (GO:0034722, directly involved in
                          GO:0010120 and GO:0019761).
                  locations:
                    - preferred_term: cytosol
                      term:
                        id: GO:0005829
                        label: cytosol
                      evidence:
                        - source_id: file:ARATH/GGP1/GGP1-ai-review.yaml
                          statement: Core-function location in the GGP1 gene review.
                  notes: >-
                    GGP3 (UniProtKB:Q9M0A5) acts redundantly (the ggp1 ggp3 double mutant has less
                    camalexin than ggp1) but is not listed as a representative member because it is not
                    in the local PANTHER member index for the GGP1 subfamily; it has no gene review.
                    GGP1 also acts in core glucosinolate biosynthesis and glutathione catabolism (recorded
                    in its gene review and in the aliphatic glucosinolate module).
        connections:
          - source: gst_conjugation
            target: ggp_step
            connection_type: PROVIDES_INPUT_FOR
            description: GS-IAN is the GGP substrate; the Cys(IAN)-Gly product is trimmed to Cys(IAN) by
              an unidentified peptidase before PAD3.
    - order: 4
      role: cysteine conjugate to dihydrocamalexic acid and camalexin (CYP71B15/PAD3)
      node:
        id: pad3_steps
        label: Thiazole ring formation (PAD3)
        module_type: METABOLIC_PATHWAY
        description: >-
          The bifunctional P450 CYP71B15 (PAD3) catalyses two consecutive reactions (overall RHEA:52776,
          EC 1.14.19.52): thiazoline ring closure of Cys(IAN) with cyanide release to dihydrocamalexic acid
          (RHEA:10452), and oxidative decarboxylation of dihydrocamalexic acid to camalexin (RHEA:34807).
        annotons:
          - id: pad3_dhca_synthase
            label: "CYP71B15/PAD3: dihydrocamalexate synthase (no GO term yet)"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CYP71B15 / PAD3 (Arabidopsis)
                term:
                  id: UniProtKB:Q9LW27
                  label: Bifunctional dihydrocamalexate synthase/camalexin synthase
            function:
              preferred_term: dihydrocamalexate synthase activity
              description: Proposed term (see knowledge gaps), reused from the CYP71B15 gene review;
                corresponds to RHEA:10452.
              substrates:
                - preferred_term: Cys(IAN) (2-(L-cystein-S-yl)-2-(1H-indol-3-yl)-acetonitrile)
                - preferred_term: O2
                - preferred_term: reduced [NADPH--hemoprotein reductase]
              products:
                - preferred_term: dihydrocamalexic acid
                - preferred_term: hydrogen cyanide
              evidence:
                - source_id: PMID:19567706
                  statement: Yeast-expressed CYP71B15 closes the thiazoline ring of Cys(IAN), forming DHCA
                    and releasing cyanide.
                  supporting_text: >-
                    Surprisingly, yeast-expressed CYP71B15 also catalyzed thiazoline ring closure, DHCA
                    formation, and cyanide release with Cys(IAN) as substrate.
                - source_id: file:ARATH/CYP71B15/CYP71B15-ai-review.yaml
                  statement: CYP71B15 gene review core function with proposed_molecular_function
                    dihydrocamalexate synthase activity.
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
                evidence:
