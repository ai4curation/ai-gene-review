knowledge_gaps:
  - gap_statement: >-
      Whether the first acylation of this module ever uses sn-glycerol
      1-phosphate in a living bacterium, and so whether the route has a second,
      stereochemically distinct product, is unknown.
    boundary: >-
      Established: purified B. subtilis and E. coli PlsY acylate sn-glycerol
      1-phosphate as well as sn-glycerol 3-phosphate in detergent with only
      minor differences in product levels, PlsC converts both lysophosphatidic
      acid enantiomers into phosphatidic acid in a coupled liposome system, and
      PlsB is strictly specific for sn-glycerol 3-phosphate; separately, a
      minor glycerol 1-phosphate-backbone phosphatidylglycerol fraction has been
      reported in B. subtilis, whose only GPAT is PlsY. Unknown: whether PlsY
      makes that lipid in vivo, what supplies glycerol 1-phosphate, and the
      kinetic preference of either enzyme, since reconstituted PlsY clearly
      prefers glycerol 3-phosphate and the (S)-lysophosphatidic acid result is
      confounded by that substrate's lower concentration in a coupled assay.
      The module therefore models G3P chemistry only.
    gap_kind:
      - BIOLOGY
    dark_aspect: RESIDUAL_SUBGAP
    status: OPEN
    significance: >-
      This is the bacterial half of the lipid divide (projects/LIPID_DIVIDE.md).
      If PlsY acylates glycerol 1-phosphate in vivo, one ordinary bacterial
      acyltransferase accounts for heterochiral membranes, the capability is
      confined to the PlsY branch of the route variant set, and GO has no
      molecular function term for either the PlsY or the PlsC reaction on the
      S enantiomer. The term requests are held in the BACSU plsY and plsC
      reviews rather than asserted here.
    resolution: >-
      Determine kinetic constants of reconstituted PlsY for both
      glycerol-phosphate enantiomers and of reconstituted PlsC on chemically
      synthesised (R)- and (S)-lysophosphatidic acid supplied at equal
      concentrations, uncoupled from PlsY; then test in vivo whether
      (S)-backbone lipid depends on PlsY, by chiral lipidomics of an araM
      (egsA) deletion and of PlsY-depleted cells complemented with the strictly
      G3P-specific E. coli PlsB.
    provenance:
      - reference_id: PMID:42286214
        supporting_text: >-
          whereas the GPAT PlsB is strictly stereoselective towards G3P
        reference_section_type: INTRODUCTION
      - reference_id: PMID:42286214
        supporting_text: >-
