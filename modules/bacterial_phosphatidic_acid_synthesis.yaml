        reference_section_type: ABSTRACT
        full_text_unavailable: true
  - gap_statement: >-
      Whether PlsX and PlsY form a physical complex that channels
      acyl-phosphate, rather than releasing it into the cytoplasm, is not
      established.
    boundary: >-
      Acyl-phosphate is a reactive intermediate and UniProt records the
      PlsX-PlsY interaction only as probable, inferred from the HAMAP rule and
      from the loss of membrane-associated activity in the absence of either
      protein. No purified reconstitution or structure of a PlsX-PlsY assembly
      exists, and PlsX itself has no cached PAINT family data.
    gap_kind:
      - BIOLOGY
    dark_aspect: CC_DARK
    status: OPEN
    significance: >-
      If the two enzymes are an obligate assembly, the acyl-phosphate route is
      one annoton with a protein-complex participant rather than the two ordered
      reactions modelled here, and the step is also the point at which
      phospholipid synthesis is coupled to fatty acid synthesis.
    resolution: >-
      Test for a PlsX-PlsY complex by co-purification from native membranes and
      by crosslinking, and measure whether free acyl-phosphate accumulates or is
      channelled in a reconstituted system containing both proteins.
    provenance:
