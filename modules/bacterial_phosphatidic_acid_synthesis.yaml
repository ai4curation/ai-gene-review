          responsible for the backbone heterochirality observed in bacterial
          phospholipids.
        reference_section_type: INTRODUCTION
      - reference_id: PMID:42286214
        supporting_text: >-
          However, the levels of (R)-LPA (containing a G3P lipid backbone) were
