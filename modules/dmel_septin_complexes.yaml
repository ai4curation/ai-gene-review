id: MODULE:dmel_septin_complexes
title: Septin complexes in Drosophila melanogaster
description: >-
  Septins are GTP-binding proteins that assemble into hetero-oligomeric complexes, which polymerize
  into filaments and rings at the cell cortex. These structures act as scaffolds and diffusion
  barriers and are prominent at the cleavage furrow and the cellularization front. The best-characterized
  Drosophila septin complex contains Septin1, Septin2 and Peanut (Pnut), was purified from
  embryos and forms filaments in vitro; Pnut is needed for cytokinesis in proliferating tissues.
  Septin4 and Septin5, paralogs of Septin1 and Septin2, form a second complex with Pnut.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002070
  title: 'FlyBase gene group SEPT-C: Septin complexes'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as septin complexes (SEPT-C);
    this module models that group.
- source_id: GO:0031105
  title: septin complex
  statement: >-
    GO term grounding the module as septin complex.
notes: >-
  Pnut is shared by both complexes and appears in each variant. The cytokinesis process is
  attached only to the Septin1-Septin2-Pnut complex, for which the genetic and biochemical
  evidence is strongest; the roles of the Septin4-Septin5 complex are less well characterized.
  Septin-associated proteins such as anillin (scra) are context, not parts. FlyBase groups
  realized by this module: SEPT-C (FBgg0002070). Subgroups folded into it: SEPT-C12P, SEPT-C45P.
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_septin_complexes.yaml;
  none of the member genes has a gene review yet unless noted.
