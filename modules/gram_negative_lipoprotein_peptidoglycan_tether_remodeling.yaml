id: MODULE:gram_negative_lipoprotein_peptidoglycan_tether_remodeling
title: Gram-negative lipoprotein-peptidoglycan tether remodeling
description: >-
  A reusable Gram-negative bacterial module for reversible covalent attachment
  of an outer-membrane lipoprotein to peptidoglycan. An ErfK-family
  L,D-transpeptidase transfers a tetrapeptide-stem donor onto the C terminus of
  a Braun-lipoprotein-like substrate, and a YafK/LdtF-family cysteine hydrolase
  can release the lipoprotein by cleaving the resulting amide bond. These
  reactions remodel the connection between the outer membrane and sacculus;
  they do not represent peptidoglycan glycan polymerization or canonical 4-3
  peptide crosslinking by penicillin-binding proteins.
status: DRAFT
evidence:
- source_id: GO:0018104
  title: peptidoglycan-protein cross-linking
  statement: >-
    Defines covalent attachment of a protein substrate to peptidoglycan.
- source_id: PMID:37255442
  title: Characterization of Pseudomonas aeruginosa l,d-Transpeptidases and Evaluation of Their Role in Peptidoglycan Adaptation to Biofilm Growth.
  statement: >-
    Experiments in Pseudomonas aeruginosa establish OprI anchoring by the
    PP_2320-related ErfK subfamily. The full-text discussion tentatively assigns
    tether hydrolysis to the PP_1451-related YafK subfamily from its lack of
    detectable amide-bond-forming activity and close similarity to E. coli
    YafK.
  supporting_text: >-
    The function of LdtPae3 was tentatively assigned to the release of OprI
    based on both the absence of detectable amide bond-forming activity
    (formation of 3→3 and tripeptide→ OprI bonds) and the close similarity
    between LdtPae3 and E. coli hydrolase YafK.
- source_id: PMID:33941679
  title: Cleavage of Braun's lipoprotein Lpp from the bacterial peptidoglycan by a paralog of l,d-transpeptidases, LdtF.
  statement: >-
    Genetic and biochemical experiments identify E. coli LdtF/YafK as a
    murein endopeptidase that cleaves Lpp from peptidoglycan.
  supporting_text: >-
    Here, using genetic and biochemical approaches, we show that LdtF
    (formerly yafK), a newly identified paralog of l,d-transpeptidases in E.
    coli, is a murein hydrolytic enzyme that catalyzes cleavage of Lpp from the
    PG sacculus.
- source_id: PMID:33947763
  title: DpaA Detaches Braun's Lipoprotein from Peptidoglycan.
  statement: >-
    Independent biochemical work identifies the same E. coli enzyme as DpaA
    and demonstrates hydrolysis of the Lpp-peptidoglycan linkage.
  supporting_text: >-
    We now show that LdtF hydrolyzes the Lpp-peptidoglycan linkage, detaching
    Lpp from peptidoglycan, and have renamed LdtF to peptidoglycan
    meso-diaminopimelic acid protein amidase A (DpaA).
- source_id: PMID:42100858
  title: Outer Membrane-Peptidoglycan Anchoring in Pseudomonas aeruginosa.
  statement: >-
    PA2854/Q9HZZ0 directly anchors OprI to peptidoglycan in live P. aeruginosa,
    and the reaction was reconstituted with purified components.
  supporting_text: >-
    We document that the gene product of PA2854 is the catalyst that performs
    this transformation between the cell wall and the outer-membrane
    lipoprotein OprI in live Pseudomonas aeruginosa.
