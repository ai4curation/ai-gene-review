id: MODULE:dmel_condensin_complexes
title: Condensin I and condensin II in Drosophila melanogaster
description: >-
  Condensins are SMC complexes that compact and individualize chromosomes for segregation.
  Both condensin I and condensin II are built on a heterodimer of SMC2 and SMC4 (Gluon in
  Drosophila), whose ATPase heads are bridged by a kleisin subunit that recruits HEAT-repeat
  subunits. Condensin I contains the kleisin Barren (CAP-H) and the HEAT subunits Cap-D2 and
  Cap-G. Condensin II contains the kleisin Cap-H2 and the HEAT subunit Cap-D3; in Drosophila
  condensin II also promotes interphase chromosome territory formation and antagonizes homolog
  pairing.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000167
  title: 'FlyBase gene group COND: Condensin'
  statement: >-
    FlyBase release FB2026_03 groups 7 D. melanogaster genes as condensin (COND); this module
    models that group.
- source_id: GO:0000796
  title: condensin complex
  statement: >-
    GO term grounding the module as condensin complex.
notes: >-
  The FlyBase subgroups COND-I and COND-II share SMC2 and glu, which are modelled once as
  the core part. FlyBase lists no CAP-G2 subunit for condensin II. SMC2 has no UniProt entry
  in the FlyBase mapping and is grounded to its FlyBase gene id. FlyBase groups realized by
  this module: COND (FBgg0000167). Subgroups folded into it: COND-II, COND-I. Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_condensin_complexes.yaml; none of the member genes has a gene review
  yet unless noted.
