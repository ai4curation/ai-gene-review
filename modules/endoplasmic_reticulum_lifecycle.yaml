id: MODULE:endoplasmic_reticulum_lifecycle
title: Endoplasmic reticulum lifecycle
description: 'The endoplasmic reticulum is never made de novo: it grows from existing membrane, is shaped
  into sheets and tubules, imports the proteins of the secretory pathway as they are made, folds and modifies
  them, removes those that fail to fold, adjusts its capacity through the unfolded protein response, and
  is turned over by ER-phagy. This umbrella module composes the modules for those stages by reference.
  Co-translational protein import and oxidative folding are required in every eukaryote; the other stages
  are optional because the modelled pathways are lineage-specific or are not yet written as eukaryote-wide
  rules.'
status: DRAFT
scope: CONCRETE
evidence:
- source_id: file:modules/er_cotranslational_translocation.yaml
  title: SRP-dependent co-translational translocation into the ER
  statement: Eukaryote-wide SRP, SRP receptor and Sec61 core.
- source_id: file:modules/er_oxidative_protein_folding.yaml
  title: Oxidative protein folding in the ER
  statement: Eukaryote-wide BiP and PDI core, with Ero1 and the glycoprotein quality-control cycle optional.
notes: 'Organelle lifecycle umbrella (see projects/ORGANELLE_LIFECYCLES.md); stage roles follow the shared
  skeleton. Read as a satisfiability rule, the umbrella is satisfied when its required stages are: co-translational
  translocation and oxidative folding. N-glycosylation by the oligosaccharyltransferase is optional until
  its module is written as a eukaryote-wide rule. The unfolded protein response is optional because the
  referenced module is metazoan (IRE1 is the eukaryote-wide branch). Not yet modelled, because no eukaryote-wide
  module exists: ER-associated degradation, whose eukaryote-wide grounding is blocked locally (Hrd1''s
  PANTHER family has no entries table, and Cdc48 and Hrd3/Sel1 fall into lineage-specific subfamilies);
  ER shaping by reticulons, Yop1/DP1 and atlastin/Sey1; ER export by COPII; lipid synthesis; and ER-phagy.'
module:
  id: endoplasmic_reticulum_lifecycle
  label: Endoplasmic reticulum lifecycle
  module_type: ORGANELLE_LIFECYCLE
  concepts:
  - preferred_term: endoplasmic reticulum organization
    term:
      id: GO:0007029
      label: endoplasmic reticulum organization
  - preferred_term: endoplasmic reticulum
    term:
      id: GO:0005783
      label: endoplasmic reticulum
  context:
    taxa:
    - preferred_term: Eukaryota
      term:
        id: NCBITaxon:2759
        label: Eukaryota
  parts:
  - order: 1
    role: biogenesis and protein supply
    node:
      id: protein_import
      label: SRP-dependent co-translational translocation (see MODULE:er_cotranslational_translocation)
      module_ref: er_cotranslational_translocation
      description: Delivery of secretory and membrane proteins into the ER as they are made.
  - order: 4
    role: function
    node:
      id: oxidative_folding
      label: Oxidative protein folding (see MODULE:er_oxidative_protein_folding)
      module_ref: er_oxidative_protein_folding
      description: Folding and disulfide-bond formation of proteins in the ER lumen.
  - order: 4
    role: function
    optional: true
    node:
      id: n_glycosylation
      label: Oligosaccharyltransferase N-glycosylation (see MODULE:oligosaccharyltransferase_complex)
      module_ref: oligosaccharyltransferase_complex
  - order: 5
    role: quality control
    optional: true
    node:
      id: unfolded_protein_response
      label: Unfolded protein response (see MODULE:er_unfolded_protein_response)
      module_ref: er_unfolded_protein_response
      description: Metazoan IRE1, PERK and ATF6 signalling that adjusts ER folding capacity.
  connections:
  - source: protein_import
    target: oxidative_folding
    connection_type: PROVIDES_INPUT_FOR
    description: Imported chains fold and form disulfides in the ER lumen.
  - source: protein_import
    target: n_glycosylation
    connection_type: PROVIDES_INPUT_FOR
    description: The oligosaccharyltransferase glycosylates chains as they leave Sec61.
  - source: oxidative_folding
    target: unfolded_protein_response
    connection_type: PROVIDES_INPUT_FOR
    description: Unfolded proteins accumulating in the lumen activate the unfolded protein response.
