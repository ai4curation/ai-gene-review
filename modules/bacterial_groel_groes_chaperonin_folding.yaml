id: MODULE:bacterial_groel_groes_chaperonin_folding
title: Bacterial GroEL/GroES chaperonin folding
description: Bacterial group I chaperonins cooperate with GroES co-chaperonins to fold non-native proteins
  using ATP-driven cycles. The canonical cage is distinct from optional CnoX-mediated client protection.
  E. coli CnoX can bind GroEL, and structural states allow either coexistence with GroES or loss from
  the capped ring; GroES association does not impose unconditional CnoX displacement.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0140662
  title: ATP-dependent protein folding chaperone
  statement: Defines the ATP-dependent GroEL/GroES chaperonin folding activity.
- source_id: GO:1990220
  title: GroEL-GroES complex
  statement: Defines the bacterial chaperonin complex.
- source_id: file:genes/ECOLI/GroEL/GroEL-ai-review.yaml
  title: ECOLI GroEL gene review
  statement: The completed E. coli GroEL review grounds GroEL as the ATP-dependent protein-folding chaperone
    subunit of the GroEL/GroES complex.
- source_id: file:genes/ECOLI/groS/groS-ai-review.yaml
  title: ECOLI groS gene review
  statement: The completed E. coli groS review grounds GroES as the co-chaperonin lid of the GroEL/GroES
    complex.
- source_id: file:genes/ECOLI/CnoX/CnoX-ai-review.yaml
  title: ECOLI CnoX gene review
  statement: The completed E. coli CnoX review grounds CnoX as an HOCl-activated chaperedoxin and GroEL-binding
    redox-quality-control factor.
- source_id: PMID:7935796
  title: Residues in chaperonin GroEL required for polypeptide binding and release.
  statement: Identifies GroEL residues used for polypeptide and GroES binding and ATP-driven client release.
- source_id: PMID:9285585
  title: The crystal structure of the asymmetric GroEL-GroES-(ADP)7 chaperonin complex.
  statement: Establishes the functional asymmetric GroEL/GroES architecture that encapsulates folding
    clients.
- source_id: PMID:29754824
  title: 'CnoX Is a Chaperedoxin: A Holdase that Protects Its Substrates from Irreversible Oxidation.'
  statement: Establishes CnoX as an HOCl-activated holdase/redox protector for clients of the major DnaK
    and GroEL folding systems.
- source_id: PMID:36764293
  title: A molecular device for the redox quality control of GroEL/ES substrates.
  statement: Establishes the E. coli GroEL-CnoX interaction and redox quality control. Its release model
    is qualified by the distinct structural states captured in PMID:42567683.
notes: Bacterial folding capacity where the machinery occurs, not universal presence across Bacteria.
  Family classification is combined with independently supported function and compatible same-system partners.
  Five species across Pseudomonadota, Bacillota and Actinomycetota illustrate this scope; E. coli and
  Caulobacter CnoX mechanisms remain separately scoped optional branches. Twelve complete member reviews
  preserve 201 original rows with no additions. Unresolved binding claims, noncanonical mycobacterial
  assays, absent PAINT leaves and the holdase ontology gap remain explicit. Module curation status does
  not mean the project audit or PR is merged.
  The holdase ontology proposal remains in the CnoX reviews and annoton notes; the proposed
  activity is a child of protein folding chaperone GO:0044183. It is an ontology representation
  issue, not a standalone biological knowledge gap.
