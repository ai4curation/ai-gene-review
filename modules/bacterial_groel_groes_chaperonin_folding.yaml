references:
- id: PMID:19416363
  title: Multiple chaperonins in bacteria--why so many?
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full publisher review read independently; the normal cache is abstract-only. Comparative
      scope and duplication are not treated as proof of any individual unassayed paralog.
  findings:
  - statement: Bacterial chaperonin paralogs can specialize; numbering of paralogs does not establish
      orthology across taxa.
  - statement: Some bacterial lineages lack the canonical machinery, so a Bacteria context states scope
      rather than universal presence.
- id: PMID:25986150
  title: Multiple chaperonins in bacteria--novel functions and non-canonical behaviors.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full PMC review read independently; the existing publication cache is abstract-only.
      Speculative tail-function correlations are not promoted to mechanism or classification rules.
  findings:
  - statement: Duplicated chaperonins differ in regulation, substrate preference and oligomer behavior.
  - statement: Reported complementation depends on the tested co-chaperonin and conditions; broad family
      homology cannot establish universal interchangeability.
- id: PMID:38714141
  title: Entering deeper into the mysteries of the GroEL-GroES nanomachine.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract accessed only; used for review-level framing of GroEL/GroES and CnoX, not detailed
      mechanistic claims.
  findings:
  - statement: Reviews the GroEL/GroES cycle and the newer CnoX interaction.
- id: PMID:7935796
  title: Residues in chaperonin GroEL required for polypeptide binding and release.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract checked; the E. coli mutation results support binding/release requirements,
      not all bacterial substrate repertoires.
  findings:
  - statement: GroEL apical residues participate in substrate and GroES binding; the equatorial ATPase
      machinery supports productive release.
- id: PMID:9285585
  title: The crystal structure of the asymmetric GroEL-GroES-(ADP)7 chaperonin complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract checked; the asymmetric E. coli structure grounds chamber organization
      without making it the only permitted state.
  findings:
  - statement: GroES binding reorganizes the GroEL apical domains and stabilizes a hydrophilic folding
      chamber.
- id: PMID:22834700
  title: 'The unusual mycobacterial chaperonins: evidence for in vivo oligomerization and specialization
    of function.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract checked; publisher full-text retrieval was denied. Claims remain within
      explicit abstract results, without inferring strain or construct details not recovered.
  findings:
  - statement: Cpn60.2 from M. tuberculosis and M. smegmatis complements essential E. coli GroEL with
      cognate or E. coli co-chaperonins.
  - statement: The oligomerization state depends on solution conditions; native function is not ruled
      out by monomers under standard purification.
- id: PMID:30482828
  title: The Chaperone and Redox Properties of CnoX Chaperedoxins Are Tailored to the Proteostatic Needs
    of Bacterial Species.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and official supplementary strain/construct tables checked. CB15N is the Caulobacter
      background; recombinant expression in E. coli does not change protein species identity.
  findings:
  - statement: Caulobacter CnoX has constitutive holdase and thioredoxin-reductase-system-supported redox
      activity, contrasting with HOCl activation and stable client protection by E. coli CnoX.
  - statement: The Caulobacter GroEL/GroES system recovers citrate-synthase activity after CnoX capture;
      this does not establish direct transfer kinetics.
- id: PMID:42567683
  title: Structural interplay of the redox co-chaperone CnoX to GroEL/ES chaperonin.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Full text and constructs checked in the member consultation: reviewed E. coli proteins,
      recombinant expression, substrate-free AMP-PNP structural preparations. No productive-cycle ordering
      is inferred.'
  findings:
  - statement: A captured ternary state contains CnoX and GroES on the same GroEL ring; another state
      lacks cis-ring CnoX.
- id: PMID:29754824
  title: 'CnoX Is a Chaperedoxin: A Holdase that Protects Its Substrates from Irreversible Oxidation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract supports HOCl activation and client protection; detailed basal GroEL
      association is supported separately by the 2023 primary.
  findings:
  - statement: E. coli CnoX becomes an efficient holdase after HOCl activation, protecting clients of
      GroEL/ES and DnaK/J/GrpE from aggregation and irreversible oxidation.
- id: PMID:36764293
  title: A molecular device for the redox quality control of GroEL/ES substrates.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full cached text and member consultation assessed. Its observed GroES-dependent release
      is retained as a condition-specific result; later structural coexistence prevents an unconditional
      displacement rule.
  findings:
  - statement: E. coli CnoX binds outside the GroEL substrate-binding site and can protect GroEL clients
      through mixed disulfides without requiring the HOCl-induced holdase state.
- id: PMID:12082092
  title: Isolation and analysis of mutant alleles of the Bacillus subtilis HrcA repressor with reduced
    dependency on GroE function.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full-text Methods read in the member consultation; the published Bacillus HrcA experiments
      use E. coli purified GroEL/GroES for biochemical activation, alongside separate native Bacillus
      association/depletion evidence. Strains and assay species are not conflated.
  findings:
  - statement: Native Bacillus GroE depletion and GroEL capture support HrcA-associated proteostasis;
      the purified biochemical activation experiments use E. coli GroEL/GroES.
- id: PMID:15327959
  title: Mycobacterium tuberculosis GroEL homologues unusually exist as lower oligomers and retain the
    ability to suppress aggregation of substrate proteins.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract assessed. The reported lower-oligomer ATP-independent refolding is retained
      as an assay-specific observation, not dismissed because it differs from the canonical cycle.
  findings:
  - statement: M. tuberculosis chaperonin preparations can suppress aggregation and partially refold clients
      without ATP or GroES under the reported conditions; this does not rule out the later supported ATP-dependent
      oligomeric cycle.
