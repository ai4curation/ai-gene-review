id: MODULE:bacterial_groel_groes_chaperonin_folding
title: Bacterial GroEL/GroES chaperonin folding
description: >-
  A bacterial cytosolic chaperonin module in which GroEL double rings, capped
  by GroES, use cycles of ATP binding and hydrolysis to encapsulate non-native
  polypeptides and release folded clients. The HOCl-activated chaperedoxin CnoX
  can plug into this system by protecting oxidizing GroEL clients through
  holdase binding and reversible mixed-disulfide formation, then dissociating
  when GroES binds.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0140662
    title: ATP-dependent protein folding chaperone
    statement: Defines the ATP-dependent GroEL/GroES chaperonin folding activity.
  - source_id: GO:1990220
    title: GroEL-GroES complex
    statement: Defines the bacterial chaperonin complex.
  - source_id: file:genes/ECOLI/GroEL/GroEL-ai-review.yaml
    title: ECOLI GroEL gene review
    statement: >-
      The completed E. coli GroEL review grounds GroEL as the ATP-dependent
      protein-folding chaperone subunit of the GroEL/GroES complex.
  - source_id: file:genes/ECOLI/groS/groS-ai-review.yaml
    title: ECOLI groS gene review
    statement: >-
      The completed E. coli groS review grounds GroES as the co-chaperonin lid
      of the GroEL/GroES complex.
  - source_id: file:genes/ECOLI/CnoX/CnoX-ai-review.yaml
    title: ECOLI CnoX gene review
    statement: >-
      The completed E. coli CnoX review grounds CnoX as an HOCl-activated
      chaperedoxin and GroEL-binding redox-quality-control factor.
  - source_id: PMID:7935796
    title: Residues in chaperonin GroEL required for polypeptide binding and release.
    statement: >-
      Identifies GroEL residues used for polypeptide and GroES binding and
      ATP-driven client release.
  - source_id: PMID:9285585
    title: The crystal structure of the asymmetric GroEL-GroES-(ADP)7 chaperonin complex.
    statement: >-
      Establishes the functional asymmetric GroEL/GroES architecture that
      encapsulates folding clients.
  - source_id: PMID:29754824
    title: "CnoX Is a Chaperedoxin: A Holdase that Protects Its Substrates from Irreversible Oxidation."
    statement: >-
      Establishes CnoX as an HOCl-activated holdase/redox protector for clients
      of the major DnaK and GroEL folding systems.
  - source_id: PMID:36764293
    title: A molecular device for the redox quality control of GroEL/ES substrates.
    statement: >-
      Establishes the stable CnoX-GroEL complex, mixed-disulfide capture of
      GroEL clients, and GroES-triggered release of CnoX.
notes: >-
  The completed GroEL and groS ECOLI reviews cover the core chaperonin cage. CnoX
  is modeled as an optional HOCl-activated stress plugin rather than as a
  constitutive part of the GroEL/GroES foldase.
