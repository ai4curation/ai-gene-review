id: MODULE:lysine_dav_catabolism
title: L-lysine catabolism through 5-aminovalerate
description: >-
  A four-reaction bacterial route (the Dav or 5-aminovalerate pathway) that
  converts L-lysine to glutarate. An FAD-dependent L-lysine 2-monooxygenase
  (DavB) oxidatively decarboxylates L-lysine to 5-aminopentanamide, an amidase
  of the carbon-nitrogen hydrolase superfamily (DavA) hydrolyzes it to
  5-aminopentanoate (5-aminovalerate), a PLP-dependent class-III
  aminotransferase (DavT) transfers its amino group to 2-oxoglutarate to give
  5-oxopentanoate (glutarate semialdehyde), and an NADP+-dependent aldehyde
  dehydrogenase (DavD) oxidizes it to glutarate. The module represents these
  reaction roles independently of genomic organization. Lysine uptake, the
  parallel L-pipecolate/2-aminoadipate route, and the CoA-dependent and
  CoA-independent routes from glutarate to central metabolism are outside the
  boundary.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0019477
    title: L-lysine catabolic process
    statement: GO:0019477 provides the biological-process context.
  - source_id: PMID:16237033
    title: Multiple and interconnected pathways for L-lysine catabolism in Pseudomonas putida KT2440
    statement: >-
      P. putida KT2440 genetics identifies davB and davA in the aminovalerate
      route and distinguishes it from the parallel aminoadipate route.
  - source_id: PMID:31064836
    title: Massively Parallel Fitness Profiling Reveals Multiple Novel Enzymes in Pseudomonas putida Lysine Metabolism
    statement: >-
      KT2440 fitness and proteomics data support the Dav pathway, distinguish
      its L-lysine and 5-aminovalerate segments, and connect DavT and DavD to
      growth on 5-aminovalerate.
  - source_id: PMID:11679348
    title: Expression of a Pseudomonas putida aminotransferase involved in lysine catabolism is induced in the rhizosphere
    statement: >-
      Genetic and biochemical evidence establishes the DavT
      5-aminovalerate-aminotransferase role.
  - source_id: PMID:17388807
    title: Prediction of missing enzyme genes in a bacterial metabolic network. Reconstruction of the lysine-degradation pathway of Pseudomonas aeruginosa.
    statement: >-
      Pseudomonas aeruginosa PA0266 (DavT) and PA0265 (DavD) were predicted as
      the missing 5-aminovalerate aminotransferase and glutarate-semialdehyde
      dehydrogenase and verified in a coupled biochemical assay, extending the
      DavT-DavD segment beyond P. putida.
  - source_id: PMID:25012259
    title: Enzymatic production of 5-aminovalerate from L-lysine using L-lysine monooxygenase and 5-aminovaleramide amidohydrolase
    statement: >-
      Purified P. putida KT2440 DavB and DavA establish the first two
      substrate-specific reactions directly.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__lysine_dav_catabolism__ppu00310-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00310 satisfiability review
    statement: >-
      The species-aware review evaluates the Dav route in Pseudomonas putida
      KT2440 against the broader lysine-degradation map.
  - source_id: file:PSEPK/davB/davB-ai-review.yaml
    title: PSEPK davB gene review
    statement: Q88QV1 supplies the L-lysine 2-monooxygenase step.
  - source_id: file:PSEPK/davA/davA-ai-review.yaml
    title: PSEPK davA gene review
    statement: Q88QV2 supplies the 5-aminopentanamidase step.
  - source_id: file:PSEPK/davT/davT-ai-review.yaml
    title: PSEPK davT gene review
    statement: Q88RB9 supplies the 5-aminovalerate aminotransferase step.
  - source_id: file:PSEPK/davD/davD-ai-review.yaml
    title: PSEPK davD gene review
    statement: Q88RC0 supplies the glutarate-semialdehyde dehydrogenase step.
  - source_id: file:PSEAE/davT/davT-ai-review.yaml
    title: PSEAE davT gene review
    statement: Q9I6M4 supplies the 5-aminovalerate aminotransferase step in P. aeruginosa.
  - source_id: file:PSEAE/davD/davD-ai-review.yaml
    title: PSEAE davD gene review
    statement: Q9I6M5 supplies the glutarate-semialdehyde dehydrogenase step in P. aeruginosa.
module:
  id: lysine_dav_catabolism
  label: L-lysine catabolism through 5-aminovalerate
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: L-lysine catabolic process
      term:
        id: GO:0019477
        label: L-lysine catabolic process
      description: Conversion of L-lysine to glutarate through the Dav route.
  parts:
    - order: 1
      role: 5-aminopentanamide formation
      node:
        id: davB_step
        label: L-lysine 2-monooxygenase
        module_type: REACTION
        annotons:
          - id: davB_activity
            label: L-lysine 2-monooxygenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: flavin amine oxidase subfamily containing DavB lysine 2-monooxygenases
                term:
                  id: PANTHER:PTHR10742:SF410
                  label: LYSINE-SPECIFIC HISTONE DEMETHYLASE 2
                representative_members:
                  - preferred_term: davB (PSEPK)
                    term:
                      id: UniProtKB:Q88QV1
                      label: L-lysine 2-monooxygenase DavB
                    description: >-
                      Purified P. putida KT2440 enzyme used as the exact
                      exemplar. PANTHER's official SF410 name refers to another
                      member; the subfamily also holds yeast FMS1, so it is a
                      candidate set and the exemplar fixes the reaction.
            function:
              preferred_term: L-lysine 2-monooxygenase activity
              term:
                id: GO:0050067
                label: L-lysine 2-monooxygenase activity
              substrates:
                - preferred_term: L-lysine
                - preferred_term: oxygen
              products:
                - preferred_term: 5-aminopentanamide
                - preferred_term: carbon dioxide
                - preferred_term: water
            role_description: >-
              Oxidatively decarboxylates L-lysine to the DavA substrate.
    - order: 2
      role: 5-aminovalerate formation
      node:
        id: davA_step
        label: 5-aminopentanamidase
        module_type: REACTION
        annotons:
          - id: davA_activity
            label: 5-aminopentanamidase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: carbon-nitrogen hydrolase subfamily containing DavA 5-aminopentanamidases
                term:
                  id: PANTHER:PTHR43674:SF2
                  label: BETA-UREIDOPROPIONASE
                representative_members:
                  - preferred_term: davA (PSEPK)
                    term:
                      id: UniProtKB:Q88QV2
                      label: 5-aminopentanamidase
                    description: >-
                      Purified P. putida KT2440 enzyme used as the exact
                      exemplar. SF2 also holds beta-ureidopropionases and
                      N-carbamoylputrescine amidases.
            function:
              preferred_term: 5-aminopentanamidase activity
              term:
                id: GO:0047588
                label: 5-aminopentanamidase activity
              substrates:
                - preferred_term: 5-aminopentanamide
                - preferred_term: water
              products:
                - preferred_term: 5-aminopentanoate
                - preferred_term: ammonium
            role_description: >-
              Hydrolyzes 5-aminopentanamide to 5-aminovalerate.
    - order: 3
      role: glutarate-semialdehyde formation
      node:
        id: davT_step
        label: 5-aminovalerate aminotransferase
        module_type: REACTION
        annotons:
          - id: davT_activity
            label: 5-aminovalerate aminotransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: class-III aminotransferase subfamily containing DavT and PuuE/GabT omega-aminotransferases
                term:
                  id: PANTHER:PTHR11986:SF58
                  label: LEUCINE_METHIONINE RACEMASE
                representative_members:
                  - preferred_term: davT (PSEPK)
                    term:
                      id: UniProtKB:Q88RB9
                      label: 5-aminovalerate aminotransferase DavT
                  - preferred_term: davT (PSEAE)
                    term:
                      id: UniProtKB:Q9I6M4
                      label: 5-aminovalerate aminotransferase DavT
                    description: >-
                      Reviewed P. aeruginosa PAO1 ortholog (PA0266) with the
                      same RHEA:10212 reaction verified biochemically; also
                      classified in SF58.
            function:
              preferred_term: 5-aminovalerate:2-oxoglutarate transaminase activity
              term:
                id: GO:0047589
                label: 5-aminovalerate:2-oxoglutarate transaminase activity
              substrates:
                - preferred_term: 5-aminopentanoate
                - preferred_term: 2-oxoglutarate
              products:
                - preferred_term: 5-oxopentanoate
                - preferred_term: L-glutamate
            role_description: >-
              Transfers the amino group of 5-aminovalerate to 2-oxoglutarate.
    - order: 4
      role: glutarate formation
      node:
        id: davD_step
        label: Glutarate-semialdehyde dehydrogenase
        module_type: REACTION
        annotons:
          - id: davD_activity
            label: Glutarate-semialdehyde dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: succinate-semialdehyde dehydrogenase subfamily containing the DavD clade
                term:
                  id: PANTHER:PTHR43353:SF5
                  label: SUCCINATE-SEMIALDEHYDE DEHYDROGENASE, MITOCHONDRIAL
                representative_members:
                  - preferred_term: davD (PSEPK)
                    term:
                      id: UniProtKB:Q88RC0
                      label: Glutarate-semialdehyde dehydrogenase
                  - preferred_term: davD (PSEAE)
                    term:
                      id: UniProtKB:Q9I6M5
                      label: Glutarate-semialdehyde dehydrogenase
                    description: >-
                      Reviewed P. aeruginosa PAO1 ortholog (PA0265) with the
                      NADP+-linked RHEA:57832 reaction verified biochemically;
                      the source of the P. putida DavD similarity transfer.
            function:
              preferred_term: glutarate-semialdehyde dehydrogenase (NADP+) activity
              term:
                id: GO:0102810
                label: glutarate-semialdehyde dehydrogenase (NADP+) activity
              substrates:
                - preferred_term: 5-oxopentanoate
                - preferred_term: NADP+
                - preferred_term: water
              products:
                - preferred_term: glutarate
                - preferred_term: NADPH
                - preferred_term: proton
            role_description: Oxidizes glutarate semialdehyde to glutarate.
  connections:
    - source: davB_step
      target: davA_step
      connection_type: PROVIDES_INPUT_FOR
      description: DavB supplies 5-aminopentanamide to DavA.
    - source: davA_step
      target: davT_step
      connection_type: PROVIDES_INPUT_FOR
      description: DavA supplies 5-aminovalerate to DavT.
    - source: davT_step
      target: davD_step
      connection_type: PROVIDES_INPUT_FOR
      description: DavT supplies glutarate semialdehyde to DavD.
  notes: >-
    Taxonomic scope: the reaction roles are written species-neutrally, but the
    module is kept CONCRETE and grounded on exemplars with experimental
    evidence. All four steps are characterized in Pseudomonas putida KT2440
    (genetics, fitness profiling and purified DavB/DavA); the DavT-DavD segment
    is also characterized in Pseudomonas aeruginosa PAO1. No other organism
    with experimental evidence for the DavB-DavA segment was found in the
    cached literature, so no further exemplars are added. Each family term is
    the PANTHER subfamily that contains the exemplars (PTHR10742:SF410,
    PTHR43674:SF2, PTHR11986:SF58, PTHR43353:SF5); every one of these
    subfamilies is functionally mixed (SF58 also holds GABA aminotransferases,
    SF5 the succinate-semialdehyde dehydrogenases, SF410 yeast FMS1, SF2
    beta-ureidopropionases), so the exemplars and leaf molecular functions,
    not the subfamily, fix reaction specificity. GABA and
    succinate-semialdehyde terms that reach DavT and DavD by family transfer
    are treated as over-annotation in their gene reviews. No ancestral PTN
    node is asserted: no PAINT IBD for the Dav activities exists in these
    families. Glutarate degradation after DavD is modeled separately.
