id: MODULE:bacterial_nitrogen_regulatory_pts
title: Bacterial nitrogen-regulatory PTS phosphorelay
description: >-
  A species-neutral proteobacterial signaling module in which enzyme I(Ntr) accepts
  phosphate from phosphoenolpyruvate, NPr relays it, and EIIA(Ntr) acts as the
  terminal phosphorylation-state-dependent regulator. Unlike carbohydrate PTS
  pathways, this module does not transport or phosphorylate a sugar.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:23517463
    title: Reciprocal regulation of the autophosphorylation of enzyme INtr by glutamine and α-ketoglutarate in Escherichia coli.
    statement: >-
      Most proteobacteria carry the PTS(Ntr) paralogous to the sugar PTS; E. coli
      EI(Ntr) autophosphorylation is reciprocally regulated by glutamine and
      2-oxoglutarate through its GAF domain, giving the relay a nitrogen-status input.
  - source_id: PMID:10473571
    title: Enzyme I(Ntr) from Escherichia coli. A novel enzyme of the phosphoenolpyruvate-dependent phosphotransferase system exhibiting strict specificity for its phosphoryl acceptor, NPr.
    statement: >-
      Purified E. coli EI(Ntr) phosphorylates NPr but not HPr, defining an
      EI(Ntr)-NPr-IIA(Ntr) chain distinct from the EI-HPr-IIA(sugar) chain.
  - source_id: PMID:17416664
    title: The phosphotransferase system formed by PtsP, PtsO, and PtsN proteins controls production of polyhydroxyalkanoates in Pseudomonas putida
    statement: >-
      Genetic analysis identifies PtsP, PtsO/NPr, and PtsN as a regulatory
      phosphotransfer system controlling PHA accumulation in KT2440.
  - source_id: PMID:18296519
    title: Evidence of in vivo cross talk between the nitrogen-related and fructose-related branches of the carbohydrate phosphotransferase system of Pseudomonas putida
    statement: >-
      In vivo phosphorylation-state analysis establishes the primary flow as
      PEP to PtsP to PtsO/NPr to PtsN and separates this branch from sugar
      uptake, while documenting conditional FruB cross-talk.
  - source_id: PMID:26224366
    title: Interplay of the PtsN (EIIA(Ntr)) protein of Pseudomonas putida with its target sensor kinase KdpD
    statement: >-
      KT2440 PtsN directly interacts with KdpD and controls kdpFABC expression
      in a phosphorylation-state- and potassium-dependent manner.
  - source_id: PMID:21236318
    title: The interplay of the EIIA(Ntr) component of the nitrogen-related phosphotransferase system (PTS(Ntr)) of Pseudomonas putida with pyruvate dehydrogenase
    statement: >-
      Non-phosphorylated KT2440 PtsN directly interacts with AceE and inhibits
      pyruvate dehydrogenase activity.
  - source_id: PMID:19400808
    title: Stimulation of the potassium sensor KdpD kinase activity by interaction with the phosphotransferase protein IIA(Ntr) in Escherichia coli
    statement: >-
      E. coli EI(Ntr), NPr, and IIA(Ntr) form a regulatory phosphotransfer
      chain parallel to the carbohydrate-transport PTS, supporting the
      cross-species module boundary.
  - source_id: PMID:17289841
    title: Escherichia coli enzyme IIANtr regulates the K+ transporter TrkA.
    statement: >-
      Dephosphorylated E. coli IIA(Ntr) binds TrkA and limits K+ accumulation, a
      second potassium-homeostasis output of the terminal regulator.
  - source_id: file:PSEPK/ptsP/ptsP-uniprot.txt
    title: PSEPK PtsP UniProt record
    statement: Q88CN5 contains GAF, EI(Ntr), and PEP-utilizer domains.
  - source_id: file:PSEPK/ptsH/ptsH-uniprot.txt
    title: PSEPK NPr/PtsH UniProt record
    statement: >-
      Q88PA2 is the phosphocarrier experimentally assigned as NPr/PtsO between
      PtsP and PtsN in KT2440.
  - source_id: file:PSEPK/ptsN/ptsN-uniprot.txt
    title: PSEPK PtsN UniProt record
    statement: Q88PA0 carries the nitrogen-regulatory EIIA domain.
notes: >-
  Scope and generalization: the PTS(Ntr) is a proteobacterial paralogue of the sugar
  PTS, so the module is written species-neutrally with Pseudomonadota as context and
  two experimentally characterized exemplars per step, E. coli K-12 (enzymology,
  KdpD and TrkA outputs) and P. putida KT2440 (in vivo relay order, KdpD and AceE
  outputs). In the current UniProt record, KT2440 NPr is named ptsH (PP_0948,
  Q88PA2), whereas the primary literature calls the same functional role ptsO/NPr.
  FruB can feed phosphate into NPr/PtsN during fructose growth in P. putida, but this
  experimentally demonstrated cross-talk is an alternative input rather than a
  required part of the nitrogen-regulatory PTS. The conserved PtsN-KdpD regulatory
  interaction is represented on the terminal annoton with the sign-neutral protein
  kinase regulator activity, because E. coli IIA(Ntr) stimulates KdpD while P. putida
  PtsN represses kdpFABC through KdpD; the Kdp and Trk transport apparatus, PHA
  control, AceE and LpxD regulation, and other lineage-specific outputs are not
  required module parts.
  Family grounding: the entry and terminal steps use the PANTHER subfamilies that
  contain both exemplars (PTHR46244:SF1 EI(Ntr), PTHR47738:SF1 nitrogen regulatory
  protein). The NPr step uses PTHR33705:SF2, which contains both NPr exemplars but
  also canonical sugar-PTS HPr proteins of Firmicutes and other lineages and, within
  the declared Pseudomonadota context itself, HPr-named proteins of Neisseria, Xylella
  and Cupriavidus (see the PTHR33705 family review). The id over-selects inside the
  module's taxon as well as outside it; SF2 therefore records membership of an HPr-domain
  phosphocarrier, and the NPr role is assigned by pathway context (rpoN-operon ptsO,
  EI(Ntr) acceptor specificity). The PAINT node PTN002021052 attached to the PtsN
  family carries the activator term GO:0030295; the PTHR47738 review judges that
  placement too deep for the activator sign, and the module asserts only the parent
  regulator activity.
  Ontology gaps (curation, not biology): GO has no biological-process term for the
  nitrogen-regulatory PtsP-NPr-PtsN phosphorelay, and GO:0009401 is explicitly the
  sugar PTS and must not be propagated to this non-transport branch, so the relay is
  represented with protein phosphorylation and intracellular signal transduction. GO
  also lacks a specific molecular-function term for the PTS histidyl phosphocarrier
  step; GO:0016775 (phosphotransferase activity, nitrogenous group as acceptor) is
  used for NPr.
module:
  id: bacterial_nitrogen_regulatory_pts
  label: Bacterial nitrogen-regulatory PTS phosphorelay
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: protein phosphorylation
      term:
        id: GO:0006468
        label: protein phosphorylation
      description: >-
        Reversible transfer of high-energy phosphate through histidyl residues
        in the PtsP-NPr-PtsN regulatory relay.
  context:
    taxa:
      - preferred_term: Pseudomonadota
        term:
          id: NCBITaxon:1224
          label: Pseudomonadota
  parts:
    - order: 1
      role: PEP-dependent phosphorylation entry
      node:
        id: ptsp_phosphate_entry
        label: PtsP enzyme I(Ntr) phosphate entry
        module_type: REACTION
        description: >-
          PtsP accepts phosphate from phosphoenolpyruvate on its EI histidine
          and transfers it to the NPr phosphocarrier.
        annotons:
          - id: ptsp_enzyme_i_ntr
            label: PtsP enzyme I(Ntr)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PtsP enzyme I(Ntr) family
                term:
                  id: PANTHER:PTHR46244:SF1
                  label: PHOSPHOENOLPYRUVATE-DEPENDENT PHOSPHOTRANSFERASE SYSTEM
                representative_members:
                  - preferred_term: ptsP (ECOLI)
                    term:
                      id: UniProtKB:P37177
                      label: Phosphoenolpyruvate-dependent phosphotransferase system
                  - preferred_term: ptsP (PSEPK)
                    term:
                      id: UniProtKB:Q88CN5
                      label: Phosphoenolpyruvate--protein phosphotransferase
                ancestral_nodes:
                  - preferred_term: PAINT node PTN000532509
                    term:
                      id: PANTHER:PTN000532509
                      label: PTN000532509
                    description: >-
                      Root bacterial PAINT IBD node in PTHR46244 supporting GO:0008965,
                      seeded by E. coli enzyme I (P08839) and EI(Ntr) (P37177); assessed
                      SOUND in the PTHR46244 family review.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN000532509 in PTHR46244.
            function:
              preferred_term: phosphoenolpyruvate-protein phosphotransferase activity
              term:
                id: GO:0008965
                label: phosphoenolpyruvate-protein phosphotransferase activity
              evidence:
                - source_id: PMID:10473571
                  statement: >-
                    Purified E. coli EI(Ntr) phosphorylates NPr from PEP and does not
                    phosphorylate HPr.
                - source_id: PMID:18296519
                  statement: >-
                    In P. putida the primary phosphate flow is PEP to PtsP to NPr to
                    PtsN in vivo.
            role_description: >-
              Entry enzyme that couples PEP dephosphorylation to phosphorylation
              of the soluble NPr carrier; its GAF domain receives nitrogen-status
              signals (glutamine and 2-oxoglutarate in E. coli).
    - order: 2
      role: NPr phosphocarrier relay
      node:
        id: npr_phosphocarrier_relay
        label: NPr phosphocarrier relay
        module_type: REACTION
        description: >-
          NPr receives phosphate from PtsP and transfers it to EIIA(Ntr).
        annotons:
          - id: npr_phosphocarrier
            label: NPr phosphocarrier
            participant:
              selector_type: FAMILY
              family:
                preferred_term: nitrogen-regulatory NPr phosphocarrier family
                description: >-
                  NPr proteins assigned by pathway context to the carrier step
                  between EI(Ntr) and EIIA(Ntr). Grounded to PTHR33705:SF2, the
                  subfamily that contains both exemplars; SF2 also includes
                  canonical carbohydrate-PTS HPr proteins, so the family id records
                  HPr-domain membership, not the NPr role.
                term:
                  id: PANTHER:PTHR33705:SF2
                  label: PHOSPHOCARRIER PROTEIN NPR
                representative_members:
                  - preferred_term: ptsO (ECOLI)
                    term:
                      id: UniProtKB:P0A9N0
                      label: Phosphocarrier protein NPr
                  - preferred_term: ptsH (PSEPK)
                    term:
                      id: UniProtKB:Q88PA2
                      label: Phosphocarrier protein HPr
            function:
              preferred_term: phosphotransferase activity, nitrogenous group as acceptor
              term:
                id: GO:0016775
                label: phosphotransferase activity, nitrogenous group as acceptor
              evidence:
                - source_id: PMID:7876255
                  statement: >-
                    Purified E. coli NPr exchanges phosphate with enzyme I, HPr and
                    EIIA proteins.
                - source_id: PMID:18296519
                  statement: >-
                    In P. putida NPr is the in vivo intermediate between PtsP and PtsN.
            role_description: >-
              Soluble intermediate carrier between PtsP and PtsN, carrying the
              phosphoryl group on its active-site histidine and donating it to the
              EIIA(Ntr) histidine; GO:0016775 is used because GO lacks a specific PTS
              phosphocarrier molecular-function term.
    - order: 3
      role: Terminal EIIA(Ntr) phosphorylation-state regulator
      node:
        id: ptsn_terminal_regulator
        label: PtsN EIIA(Ntr) terminal regulator
        module_type: REACTION
        description: >-
          PtsN receives phosphate from NPr; its phosphorylation state controls
          interactions with downstream metabolic and transport targets.
        annotons:
          - id: ptsn_eiia_ntr
            label: PtsN EIIA(Ntr)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: nitrogen-regulatory EIIA family
                term:
                  id: PANTHER:PTHR47738:SF1
                  label: NITROGEN REGULATORY PROTEIN
                representative_members:
                  - preferred_term: ptsN (ECOLI)
                    term:
                      id: UniProtKB:P69829
                      label: Nitrogen regulatory protein
                  - preferred_term: ptsN (PSEPK)
                    term:
                      id: UniProtKB:Q88PA0
                      label: Phosphotransferase system enzyme IIA, regulation of potassium transport
                ancestral_nodes:
                  - preferred_term: PAINT node PTN002021052
                    term:
                      id: PANTHER:PTN002021052
                      label: PTN002021052
                    description: >-
                      PAINT IBD node in PTHR47738 seeded by E. coli IIA(Ntr) (P69829) for
                      protein kinase activator activity (GO:0030295). The PTHR47738 family
                      review assesses the activator sign as too deep; the KdpD-regulator
                      parent asserted here is supported in both exemplar lineages.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002021052 in PTHR47738.
            function:
              preferred_term: protein kinase regulator activity
              term:
                id: GO:0019887
                label: protein kinase regulator activity
              evidence:
                - source_id: PMID:19400808
                  statement: >-
                    E. coli IIA(Ntr) directly interacts with KdpD and stimulates
                    its kinase activity.
                - source_id: PMID:26224366
                  statement: >-
                    P. putida PtsN directly interacts with KdpD and regulates
                    kdpFABC expression, with a lineage-dependent direction.
            processes:
              - preferred_term: intracellular signal transduction
                term:
                  id: GO:0035556
                  label: intracellular signal transduction
              - preferred_term: regulation of potassium ion transmembrane transport
                term:
                  id: GO:1901379
                  label: regulation of potassium ion transmembrane transport
            role_description: >-
              Terminal phosphorelay component and phosphorylation-state-dependent
              regulatory effector. KdpD regulation is supported in both P. putida
              and E. coli, although the direction differs; TrkA inhibition (E. coli),
              AceE inhibition and PHA outputs (P. putida) remain lineage-specific
              extensions of the conserved relay.
  connections:
    - source: ptsp_phosphate_entry
      target: npr_phosphocarrier_relay
      connection_type: PROVIDES_INPUT_FOR
    - source: npr_phosphocarrier_relay
      target: ptsn_terminal_regulator
      connection_type: PROVIDES_INPUT_FOR
  knowledge_gaps:
    - gap_statement: >-
        The physiological signals controlling EI(Ntr) input outside the
        enterobacteria, and the rules connecting EIIA(Ntr) phosphostate to particular
        downstream targets (including the opposite sign of KdpD regulation in E. coli
        and P. putida), remain incompletely resolved across bacteria.
      boundary: >-
        Keep lineage-specific transport and metabolic outputs outside the
        conserved three-step phosphorelay core.
      gap_kind:
        - BIOLOGY
