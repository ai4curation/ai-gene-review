id: MODULE:bacterial_nitrogen_regulatory_pts
title: Proteobacterial nitrogen-regulatory PTS phosphorelay
description: A regulatory protein phosphorelay in Pseudomonadota in which PtsP enzyme I(Ntr) receives
  phosphate from phosphoenolpyruvate, a native NPr/HPr carrier relays it to PtsN, and the phosphorylation
  state of PtsN modulates noncovalent regulation of downstream proteins. The conserved relay is distinct
  from the species-dependent choice of target and from phosphorylation-coupled sugar transport.
status: COMPLETE
scope: CONCRETE
evidence:
- &id001
  source_id: PMID:41870250
  title: 'Bacterial nitrogen-related phosphotransferase systems: new insights into diverse roles in virulence,
    physiology, and central metabolism.'
  statement: The comparative review distinguishes conserved phosphotransfer roles from species-dependent
    metabolic and regulatory outputs, and describes independent functions of upstream components.
  supporting_text: in ways that vary among different species
  notes: The review is synthesis and discovery support. Native primary studies below determine individual
    steps and assay limits; homolog distribution is not evidence of an intact route in every lineage.
- &id004
  source_id: PMID:10473571
  title: Enzyme I(Ntr) from Escherichia coli. A novel enzyme of the phosphoenolpyruvate-dependent phosphotransferase
    system exhibiting strict specificity for its phosphoryl acceptor, NPr.
  statement: Purified E. coli EI(Ntr) transfers phosphate from PEP to NPr, with discrimination against
    carbohydrate HPr in the reported assay.
  supporting_text: EI(Ntr) phosphorylated NPr but not HPr
  notes: This is measured biochemical specificity, not proof that every cross-system transfer is impossible.
- &id005
  source_id: PMID:7876255
  title: Novel proteins of the phosphotransferase system encoded within the rpoN operon of Escherichia
    coli. Enzyme IIANtr affects growth on organic nitrogen and the conditional lethality of an erats mutant.
  statement: Purified E. coli NPr and PtsN participate in reversible phosphotransfer, including exchange
    with carbohydrate-PTS components in vitro.
  supporting_text: Purified IIANtr and NPr exchange phosphate
  notes: The experiment does not establish that every purified cross-reaction sustains a native regulatory
    route.
- &id003
  source_id: PMID:18296519
  title: Evidence of in vivo cross talk between the nitrogen-related and fructose-related branches of
    the carbohydrate phosphotransferase system of Pseudomonas putida.
  statement: KT2440-derived MAD2 mutant and tagged-PtsN complementation experiments establish the canonical
    PtsP–NPr–PtsN route under the tested conditions and a fructose-dependent alternative input.
  supporting_text: the primary flow of phosphate through the N/C-sensing PTS proceeds from PEP to EI(Ntr)
    to NPr to EIIA(Ntr)
  notes: Methods and Results were inspected in the separately retained full PMC article; the canonical
    cache contains only Abstract and Discussion. The assay measures native phosphorylation states, not
    purified binary turnover.
- &id002
  source_id: PMID:27109061
  title: Phosphotransferase-dependent accumulation of (p)ppGpp in response to glutamine deprivation in
    Caulobacter crescentus.
  statement: The native NA1000 proteins PtsP/CCNA_00892, HPr/CCNA_00241 and PtsN/CCNA_03710 form a regulatory
    phosphorelay responsive to glutamine deprivation.
  supporting_text: phosphorylation of EI(Ntr) and its downstream components HPr and EIIA(Ntr)
  notes: All strains are NA1000 derivatives. Entry phosphorylation was assayed in EI-containing protein
    fractions; do not describe this as homogeneous purified EI reconstitution.
- source_id: PMID:24633875
  title: Biochemical characterization of a nitrogen-type phosphotransferase system reveals that enzyme
    EI(Ntr) integrates carbon and nitrogen signaling in Sinorhizobium meliloti.
  statement: Purified Sinorhizobium EI(Ntr)-to-HPr transfer and glutamine regulation support an alpha-lineage
    entry comparison.
  notes: Exact donor-strain provenance is not resolved here; this is not a fourth fully reviewed native
    triplet. Alpha-ketoglutarate regulation is not generalized from E. coli.
- source_id: PMID:37074168
  title: PtsN in Pseudomonas aeruginosa Is Phosphorylated by Redundant Upstream Proteins and Impacts Virulence-Related
    Genes.
  statement: PA14 genetic and phosphorylation-state experiments demonstrate alternative PtsN phosphorylation
    when PtsO is absent.
  notes: PA14 is not PAO1. The result does not establish every bypass edge as a purified binary reaction.
- source_id: PMID:40748077
  title: Quorum sensing regulation by the nitrogen phosphotransferase system in Pseudomonas aeruginosa.
  statement: Published PA14 experiments show residual PtsP/PtsO regulatory effects without PtsN, limiting
    universal three-step explanations of downstream phenotypes.
  supporting_text: PtsO and PtsN have distinct regulons
- source_id: PMID:26489861
  title: Convergence of alarmone and cell cycle signaling from trans-encoded sensory domains.
  statement: NA1000 PtsP is recovered in a SpoT-containing co-complex, supporting additional connections
    beyond the canonical downstream carrier route.
  notes: Co-complex association is not proof of purified binary binding and is not made a mandatory relay
    part.
- source_id: PMID:26224366
  title: Interplay of the PtsN (EIIA(Ntr)) protein of Pseudomonas putida with its target sensor kinase
    KdpD.
  statement: KT2440 PtsN–KdpD interaction and potassium-dependent promoter repression are established.
  notes: The accessible target study does not resolve whether the relevant catalytic change is kinase
    versus phosphatase modulation; E. coli kinase activation is not imposed.
- &id007
  source_id: PMID:21236318
  title: The interplay of the EIIA(Ntr) component of the nitrogen-related phosphotransferase system (PTS(Ntr))
    of Pseudomonas putida with pyruvate dehydrogenase.
  statement: KT2440 PtsN associates with AceE and down-regulates PDH activity; nonphosphorylated PtsN
    is the inhibitory form.
  supporting_text: the enzyme activity was measured in extracts of isogenic ptsN(+)/ptsN(-)P. putida strains
  notes: Evidence combines immunoprecipitation/mass spectrometry, colocalization and cell-extract activity.
    It is not a purified binary inhibition experiment.
- &id006
  source_id: PMID:19400808
  title: Stimulation of the potassium sensor KdpD kinase activity by interaction with the phosphotransferase
    protein IIA(Ntr) in Escherichia coli.
  statement: E. coli PtsN directly stimulates the kinase activity of KdpD, establishing one enzyme-regulatory
    output.
  supporting_text: stimulates kinase activity
  notes: The activation direction is not transferred to Pseudomonas KdpD or to other PtsN targets.
- &id009
  source_id: PMID:39742999
  title: Interaction of unphosphorylated PtsN with the K(+)/H(+) antiporter YcgO inhibits its activity
    in Escherichia coli.
  statement: E. coli unphosphorylated PtsN interacts with YcgO and inhibits potassium/proton antiport,
    demonstrating a non-kinase target class.
  supporting_text: unphospho-PtsN specifically interacts with YcgO
  notes: Copurification, genetic experiments and membrane-vesicle assays support regulation. The detailed
    CorC/RCK activation mechanism remains a model.
- source_id: PMID:20202847
  title: Regulatory roles of the bacterial nitrogen-related phosphotransferase system.
  statement: The comparative review distinguishes the regulatory nitrogen PTS from carbohydrate uptake
    while acknowledging phosphate exchange between the systems.
  supporting_text: 'both systems can

    communicate with each other by phosphate exchange'
  notes: Abstract-only review cache. This supports comparative framing, not a new native-partner assay
    or universal output assignment.
- source_id: PMID:41960855
  title: An Escherichia coli Phosphotransferase System Modulates Methylglyoxal Resistance by Regulating
    Intracellular Potassium.
  statement: E. coli MG1655 experiments connect loss of unphosphorylated PtsN to YcgO-dependent methylglyoxal
    resistance under potassium conditions relevant to host colonization.
  supporting_text: 'the effects of acidification

    and intracellular potassium cannot be easily separated'
  notes: Contextual primary evidence for a physiological consequence of potassium transport regulation.
    It does not make PtsN a methylglyoxal-detoxifying enzyme or add an obligatory relay component. Full
    text was acquired through the normal XML publication fetch.
- source_id: file:analysis/module_audits/bacterial_nitrogen_regulatory_pts/literature-acquisition-20261107/PMID_18296519-pmc-body.txt
  title: Full PMC article body for PMID:18296519, retained with acquisition provenance
  statement: The complete Methods identifies MAD2 as a KT2440-derived strain and describes tagged-PtsN
    complementation; native phosphorylation readouts support the reported canonical route and conditional
    cross-talk.
  supporting_text: All Pseudomonas strains used in this work were derived from strain P. putida MAD2.
  notes: Additive source for Methods and Results omitted from the canonical publication cache; acquisition
    receipts preserve the raw PMC HTML and extracted body. Native-state genetics does not establish purified
    binary turnover for every edge.
notes: 'The demonstrated scope includes E. coli K-12, P. putida KT2440-derived strains and C. vibrioides
  NA1000 (historically C. crescentus); it is not a universal-presence claim for Pseudomonadota. The three
  required roles must be supported together in the target organism: mixing exemplars from different species
  does not establish a native route. In KT2440 the established ptsH/Q88PA2/PP_0948 record is the protein
  called ptsO or NPr in the literature. In NA1000 the carrier is legitimately called HPr. PtsP and NPr
  are represented as curated role families without an exact PANTHER selector because the available subdivisions
  do not coincide with those native roles. Their broader PANTHER classifications are reviewed separately,
  not silently promoted to pathway membership. PtsN is grounded to PTHR47738:SF1, not the heterogeneous
  parent family. No new ancestral gain/loss node is asserted. Sugar-process judgments follow target-specific
  evidence: demonstrated cross-system chemistry without established native coupled sugar uptake supports
  over-annotation (E. coli Ntr proteins and P. putida NPr). Native non-permease relay identity without
  such target-specific cross-system evidence supports rejection of electronic sugar-process transfer (Caulobacter
  and P. putida PtsP); P. putida PtsN additionally has a direct negative FruA-substitution result. FruB
  bypasses PtsP in the P. putida cross-talk experiment. Kinase-output annotations remain unresolved where
  evidence does not settle them. The module relies on independently supported core activities.'
