id: MODULE:bacterial_nitrogen_regulatory_pts
title: Bacterial nitrogen-regulatory phosphotransferase system
description: >-
  A species-neutral bacterial signaling module in which enzyme I(Ntr) accepts
  phosphate from phosphoenolpyruvate, NPr relays it, and EIIA(Ntr) acts as the
  terminal phosphorylation-state-dependent regulator. Unlike carbohydrate PTS
  pathways, this module does not transport or phosphorylate a sugar.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:17416664
    title: The phosphotransferase system formed by PtsP, PtsO, and PtsN proteins controls production of polyhydroxyalkanoates in Pseudomonas putida
    statement: >-
      Genetic analysis identifies PtsP, PtsO/NPr, and PtsN as a regulatory
      phosphotransfer system controlling PHA accumulation in KT2440.
  - source_id: PMID:18296519
    title: Evidence of in vivo cross talk between the nitrogen-related and fructose-related branches of the carbohydrate phosphotransferase system of Pseudomonas putida
    statement: >-
      In vivo phosphorylation-state analysis establishes the primary flow as
      PEP to PtsP to PtsO/NPr to PtsN and separates this branch from sugar
      uptake, while documenting conditional FruB cross-talk.
  - source_id: PMID:26224366
    title: Interplay of the PtsN (EIIA(Ntr)) protein of Pseudomonas putida with its target sensor kinase KdpD
    statement: >-
      KT2440 PtsN directly interacts with KdpD and controls kdpFABC expression
      in a phosphorylation-state- and potassium-dependent manner.
  - source_id: PMID:21236318
    title: The interplay of the EIIA(Ntr) component of the nitrogen-related phosphotransferase system (PTS(Ntr)) of Pseudomonas putida with pyruvate dehydrogenase
    statement: >-
      Non-phosphorylated KT2440 PtsN directly interacts with AceE and inhibits
      pyruvate dehydrogenase activity.
  - source_id: file:PSEPK/ptsP/ptsP-uniprot.txt
    title: PSEPK PtsP UniProt record
    statement: Q88CN5 contains GAF, EI(Ntr), and PEP-utilizer domains.
  - source_id: file:PSEPK/ptsH/ptsH-uniprot.txt
    title: PSEPK NPr/PtsH UniProt record
    statement: >-
      Q88PA2 is the phosphocarrier experimentally assigned as NPr/PtsO between
      PtsP and PtsN in KT2440.
  - source_id: file:PSEPK/ptsN/ptsN-uniprot.txt
    title: PSEPK PtsN UniProt record
    statement: Q88PA0 carries the nitrogen-regulatory EIIA domain.
notes: >-
  In the current UniProt record, KT2440 NPr is named ptsH (PP_0948, Q88PA2),
  whereas the primary literature calls the same functional role ptsO/NPr.
  FruB can feed phosphate into NPr/PtsN during fructose growth, but this
  experimentally demonstrated cross-talk is an alternative input rather than a
  required part of the nitrogen-regulatory PTS. Downstream PtsN targets and PHA,
  potassium-transport, or central-carbon phenotypes are regulatory outputs.
  PANTHER:PTHR33705:SF2 is not used as the NPr selector because its local member
  set also contains canonical carbohydrate-PTS HPr proteins.
module:
  id: bacterial_nitrogen_regulatory_pts
  label: Bacterial nitrogen-regulatory phosphotransferase system
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: protein phosphorylation
      term:
        id: GO:0006468
        label: protein phosphorylation
      description: >-
        Reversible transfer of high-energy phosphate through histidyl residues
        in the PtsP-NPr-PtsN regulatory relay.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: PEP-dependent phosphorylation entry
      node:
        id: ptsp_phosphate_entry
        label: PtsP enzyme I(Ntr) phosphate entry
        module_type: REACTION
        description: >-
          PtsP accepts phosphate from phosphoenolpyruvate on its EI histidine
          and transfers it to the NPr phosphocarrier.
        annotons:
          - id: ptsp_enzyme_i_ntr
            label: PtsP enzyme I(Ntr)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PtsP enzyme I(Ntr) family
                term:
                  id: PANTHER:PTHR46244:SF1
                  label: PHOSPHOENOLPYRUVATE-DEPENDENT PHOSPHOTRANSFERASE SYSTEM
                representative_members:
                  - preferred_term: PSEPK PtsP exemplar
                    term:
                      id: UniProtKB:Q88CN5
                      label: Phosphoenolpyruvate--protein phosphotransferase
            function:
              preferred_term: phosphoenolpyruvate-protein phosphotransferase activity
              term:
                id: GO:0008965
                label: phosphoenolpyruvate-protein phosphotransferase activity
            role_description: >-
              Entry enzyme that couples PEP dephosphorylation to phosphorylation
              of the soluble NPr carrier.
    - order: 2
      role: NPr phosphocarrier relay
      node:
        id: npr_phosphocarrier_relay
        label: NPr phosphocarrier relay
        module_type: REACTION
        description: >-
          NPr receives phosphate from PtsP and transfers it to EIIA(Ntr).
        annotons:
          - id: npr_phosphocarrier
            label: NPr phosphocarrier
            participant:
              selector_type: ORTHOLOG_OF
              ortholog_of:
                preferred_term: experimentally assigned KT2440 NPr phosphocarrier
                term:
                  id: UniProtKB:Q88PA2
                  label: Phosphocarrier protein HPr
                description: >-
                  Orthologs of PP_0948 that retain the experimentally assigned
                  NPr role between PtsP and PtsN; PP_0948 is called ptsH by
                  UniProt and ptsO/NPr in the KT2440 literature.
            function:
              preferred_term: transferase activity, transferring phosphorus-containing groups
              term:
                id: GO:0016772
                label: transferase activity, transferring phosphorus-containing groups
            role_description: >-
              Soluble intermediate carrier between PtsP and PtsN; the broad GO
              function is used because GO lacks a specific NPr phosphocarrier
              molecular-function term.
    - order: 3
      role: Terminal EIIA(Ntr) phosphorylation-state regulator
      node:
        id: ptsn_terminal_regulator
        label: PtsN EIIA(Ntr) terminal regulator
        module_type: REACTION
        description: >-
          PtsN receives phosphate from NPr; its phosphorylation state controls
          interactions with downstream metabolic and transport targets.
        annotons:
          - id: ptsn_eiia_ntr
            label: PtsN EIIA(Ntr)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: nitrogen-regulatory EIIA family
                term:
                  id: PANTHER:PTHR47738:SF1
                  label: NITROGEN REGULATORY PROTEIN
                representative_members:
                  - preferred_term: PSEPK PtsN exemplar
                    term:
                      id: UniProtKB:Q88PA0
                      label: Phosphotransferase system enzyme IIA, regulation of potassium transport
            function:
              preferred_term: protein kinase regulator activity
              term:
                id: GO:0019887
                label: protein kinase regulator activity
            processes:
              - preferred_term: intracellular signal transduction
                term:
                  id: GO:0035556
                  label: intracellular signal transduction
              - preferred_term: regulation of potassium ion transmembrane transport
                term:
                  id: GO:1901379
                  label: regulation of potassium ion transmembrane transport
            role_description: >-
              Terminal phosphorelay component and phosphorylation-state-dependent
              regulatory effector that directly controls KdpD-dependent potassium
              transport and inhibits AceE/PDH in its non-phosphorylated state.
  connections:
    - source: ptsp_phosphate_entry
      target: npr_phosphocarrier_relay
      connection_type: PROVIDES_INPUT_FOR
    - source: npr_phosphocarrier_relay
      target: ptsn_terminal_regulator
      connection_type: PROVIDES_INPUT_FOR
  knowledge_gaps:
    - gap_statement: >-
        GO:0009401 and GO:0008982 are sugar-PTS terms propagated to KT2440
        PTS(Ntr) proteins even though the experimentally characterized branch
        does not transport or phosphorylate carbohydrate.
      boundary: >-
        Do not use sugar transport as the module process; represent the relay
        as protein phosphorylation and record the ontology gap explicitly.
      gap_kind:
        - ONTOLOGY
    - gap_statement: >-
        The full set of direct PtsN targets and the conditions selecting each
        phosphorylation-dependent regulatory output remain incomplete.
      boundary: >-
        Keep PHA accumulation, potassium transport, and central-carbon effects
        as downstream outputs rather than required phosphorelay parts.
      gap_kind:
        - BIOLOGY
