  knowledge_gaps:
  - gap_statement: No exact single PANTHER subdivision identifies the native PtsP or NPr role across the
      demonstrated alpha and gamma exemplars.
    boundary: Retain the role-family descriptors and verified proteins without a guessed ID. SF6 and SF2
      membership alone do not establish the corresponding nitrogen-relay role.
    gap_kind:
    - ONTOLOGY
    - BIOLOGY
  - gap_statement: GO does not encode the complete native PtsP–NPr/HPr–PtsN route as a dedicated process
      or its partner specificity in the broad phosphotransferase activities.
    boundary: Keep protein phosphorylation and intracellular signaling as module context; do not substitute
      GO:0009401 coupled sugar uptake or ATP-specific/hybrid-kinase activities for the regulatory carrier.
      The biological boundary is native partner routing and lineage-specific input/output specificity,
      which must be established independently.
    gap_kind:
    - ONTOLOGY
    - BIOLOGY
  - gap_statement: Input metabolites and downstream target/phosphostate rules differ among species.
    boundary: Do not require KdpD, AceE, SpoT, YcgO, ManX or HprK in every realization. Purified Sinorhizobium
      entry biochemistry does not by itself establish a complete additional native PtsN route.
    gap_kind:
    - BIOLOGY
  - gap_statement: Loss of a canonical intermediate does not necessarily abolish PtsN phosphorylation
      when an alternative donor is available.
    boundary: A missing native carrier fails the canonical three-role route; separately demonstrated FruB
      bypass remains possible under its reported carbon-source conditions.
    gap_kind:
    - BIOLOGY
  - gap_statement: Upstream PtsP and carrier outputs can occur independently of PtsN.
    boundary: PA14 reporter/transcriptome experiments and Caulobacter PtsP–SpoT co-complex observations
      do not establish that every PtsP or carrier phenotype is transmitted through the complete three-role
      relay.
    gap_kind:
    - BIOLOGY
  description: The canonical PEP-to-PtsN regulatory relay, with native partner specificity and lineage-dependent
    outputs.
  evidence:
  - *id001
  notes: This module describes the conserved relay. Specific output machinery, upstream signal metabolism
    and alternative donors are contextual evidence, not required parts. Exact native partner combinations
    must be retained when applying the reusable roles to a species.
