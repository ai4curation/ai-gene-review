id: MODULE:dmel_vacuolar_atpase
title: Vacuolar H+-ATPase in Drosophila melanogaster
description: >-
  The vacuolar H+-ATPase (V-ATPase) is a rotary proton pump that acidifies lysosomes, endosomes,
  the Golgi and secretory vesicles, and in specialized epithelia such as the Malpighian tubules
  and midgut energizes the plasma membrane for transport. The cytosolic V1 domain hydrolyses
  ATP at three catalytic sites in an A3B3 hexamer, and the central rotor (subunits D, F and
  d) transmits rotation to a ring of proteolipid c subunits in the membrane V0 domain. The
  V0 a subunit provides the proton path together with the c ring, and peripheral stalks of
  E and G subunits, with C and H, hold the stator. Reversible dissociation of V1 from V0 regulates
  activity. In Drosophila many subunits are encoded by paralogous genes, some with tissue-
  or testis-restricted expression, and the accessory proteins Ac45 and ATP6AP2 associate with
  V0.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000111
  title: 'FlyBase gene group VHA: Vacuolar atpase subunits'
  statement: >-
    FlyBase release FB2026_03 groups 36 D. melanogaster genes as vacuolar atpase subunits
    (VHA); this module models that group.
- source_id: GO:0033176
  title: proton-transporting V-type ATPase complex
  statement: >-
    GO term grounding the module as proton-transporting V-type ATPase complex.
notes: >-
  Decomposition. Subunits are grouped by domain and by subunit type; each gene is its own
  annoton because paralogs of one subunit type are alternatives rather than co-subunits, and
  which paralogs assemble together in which tissue is not mapped. Subunit-type assignments
  follow the UniProt protein names. CG5421 is placed with the accessory subunits as in FlyBase;
  its function is not characterized. The proton-pumping activity belongs to the assembled
  complex; only ATP hydrolysis is attached to the catalytic A subunits. FlyBase groups realized
  by this module: VHA (FBgg0000111). Subgroups folded into it: VHA-ACS, VHA-V1, VHA-V0, VHA-V1-CAT,
  VHA-V1-NONCAT. Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_vacuolar_atpase.yaml;
  none of the member genes has a gene review yet unless noted.
