                label: Serine/threonine-protein kinase WNK1
        function:
          preferred_term: protein serine/threonine kinase activity
          term:
            id: GO:0004674
            label: protein serine/threonine kinase activity
        role_description: Upstream kinase of OSR1/SPAK and SLC12A2. Gene deletion only in
          LR73 cells; in macrophages only a pan-WNK inhibitor.
        notes: Treat as provisional in macrophages.
