knowledge_gaps:
- gap_statement: The AhR ligand produced downstream of TLR9 after efferocytosis is unknown.
  boundary: TLR9 and corpse DNA are needed for AhR activation, but DNA is not an AhR ligand
    and the IDO1-kynurenine route was not needed in this system.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  status: OPEN
  significance: The DNA route has no defined chemical link between TLR9 and AhR.
  resolution: Metabolite profiling of TLR9-dependent AhR ligands in efferocytosing Ido1-/-
    macrophages, with AhR binding assays.
  provenance:
  - reference_id: PMID:29760532
    supporting_text: we could observe Cyp1a1 mRNA induction by sqPCR analysis in Ap-BMDMs
      treated with the IDO inhibitor 1MT (Supplementary Fig. 3c) or in Ido1−/− Ap-BMDMs
