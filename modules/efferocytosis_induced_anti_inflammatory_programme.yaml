notes: 'Boundary: this module starts with the digested cargo of an engulfed apoptotic cell
  and ends with suppressed inflammatory output and production of IL-10, TGF-beta1 and PGE2.
  Engulfment and digestion belong to the phagocytosis modules. IL-10, TGF-beta1 and the opsonin
  C1q are outputs or readouts and are not modelled as participants.


  The routes come mostly from separate laboratories and model systems. Two disagree: PMID:39242914
  places IDO1 upstream of AhR, while PMID:29760532 found AhR activation intact without IDO1.
  They are modelled as independent routes rather than one chain. Some routes respond to engulfed
  cells in general, not only apoptotic ones (IgG-coated red cells also induce DNMT3A-dependent
  COX2 in PMID:35361955).


  Taxon scope: all shown in mouse, with some steps also in human macrophages. Whether any
  route operates outside mammals is not known.'
