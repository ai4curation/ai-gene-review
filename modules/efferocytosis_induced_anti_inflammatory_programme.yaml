            by MAT2A. DNMT3A uses it to methylate and silence Dusp4, so ERK1/2 stays active
            after the initial receptor signal. Sustained ERK induces PTGS2, and the PGE2 it
            makes induces TGF-beta1. Responses to LPS, IFN-gamma and IL-4 are normal without
            DNMT3A.
