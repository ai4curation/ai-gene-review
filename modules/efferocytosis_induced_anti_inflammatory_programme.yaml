id: MODULE:efferocytosis_induced_anti_inflammatory_programme
title: Efferocytosis-induced anti-inflammatory programme
description: 'A macrophage that has engulfed apoptotic cells suppresses inflammation and makes
  pro-resolving signals such as IL-10, TGF-beta1 and prostaglandin E2. Several parallel routes
  read components of the digested cell: sterols activate the liver X receptors, lipids activate
  PPAR-delta, fatty acids fuel mitochondrial oxidation that raises NAD+ and activates SIRT1
  and PBX1, tryptophan feeds IDO1 and the aryl hydrocarbon receptor, DNA signals through TLR9
  to the same receptor, and methionine supplies the methyl groups DNMT3A uses to keep ERK
  signalling on. Chloride sensing through SLC12A2 decides whether the corpse is read as anti-inflammatory.
  Each route has cargo-specificity controls: engulfing beads, necrotic cells or cargo-free
  phosphatidylserine beads does not trigger it.'
status: DRAFT
scope: ABSTRACT
