  - order: 2
    role: interpretation gate
    optional: true
    node:
      id: chloride_sensing_gate
      label: Chloride sensing sets the anti-inflammatory reading
      module_type: REGULATORY_STEP
      description: Corpse uptake lowers cytosolic chloride. The WNK1-OSR1/SPAK kinases activate
        the chloride importer SLC12A2, and chloride influx limits further uptake and is needed
        for the corpse to be read as anti-inflammatory. Without SLC12A2, phagocytes switch
        to a pro-inflammatory programme even though they eat more; phagocytes made to eat
        more by TIM4 overexpression do not switch.
      annotons:
      - id: slc12a2_chloride_import
        label: SLC12A2 chloride importer
        participant:
          selector_type: FAMILY
          family:
            preferred_term: SLC12A2 (NKCC1)
            term:
              id: PANTHER:PTHR11827:SF58
              label: SOLUTE CARRIER FAMILY 12 MEMBER 2
            representative_members:
            - preferred_term: Slc12a2 (mouse)
              term:
                id: UniProtKB:P55012
                label: Solute carrier family 12 member 2
            - preferred_term: SLC12A2 (human)
              term:
                id: UniProtKB:P55011
                label: Solute carrier family 12 member 2
        function:
          preferred_term: sodium:potassium:chloride symporter activity
          term:
            id: GO:0008511
            label: sodium:potassium:chloride symporter activity
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: Gate on the anti-inflammatory reading. Deletion or knockdown increases
          uptake and flips the response to pro-inflammatory; re-expression reverses this.
        evidence:
        - source_id: PMID:31792382
          title: Interpreting an apoptotic corpse as anti-inflammatory involves a chloride
            sensing pathway.
          statement: Loss of SLC12A2 increases corpse uptake.
          supporting_text: targeted deletion of Slc12a2 via CRISPR/Cas9 or siRNA-mediated
            knockdown in LR73 phagocytes resulted in significantly enhanced uptake of apoptotic
            corpses
        - source_id: PMID:31792382
          title: Interpreting an apoptotic corpse as anti-inflammatory involves a chloride
            sensing pathway.
          statement: The pro-inflammatory flip is not caused by eating more.
          supporting_text: Despite eating more corpses, the TIM4-overexpressing phagocytes
            did not show upregulation of pro-inflammatory signature genes, contrasting with
            Slc12a2-deficient phagocytes
        notes: Most mechanism is in hamster LR73 fibroblasts; macrophage evidence is mostly
          uptake phenotypes and inhibitors.
      - id: wnk1_chloride_sensor
        label: WNK1 chloride-sensing kinase
        participant:
