knowledge_gaps:
- gap_statement: 'Which enzyme adds the third methyl group to H4K20 in human cells is not known: purified
    KMT5B and KMT5C stop at H4K20me2, yet H4K20me3 at heterochromatin falls when they are inhibited.'
  boundary: Structural and kinetic studies of human SUV420H1/2 detect no H4K20me3 product, while the cell-based
    inhibitor study reports loss of both H4K20me2 and H4K20me3; whether KMT5B/KMT5C trimethylate only
    in a chromatin or partner context, or another enzyme does, is unresolved.
  gap_kind:
