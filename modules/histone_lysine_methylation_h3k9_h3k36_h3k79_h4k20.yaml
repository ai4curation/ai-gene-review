id: MODULE:histone_lysine_methylation_h3k9_h3k36_h3k79_h4k20
title: Human histone lysine methylation outside the Polycomb and COMPASS systems — H3K9 methylation by
  SUV39H1/SUV39H2 (trimethylation in constitutive heterochromatin), the G9a/GLP (EHMT2/EHMT1) heteromer
  (mono- and dimethylation) and SETDB1 with ATF7IP (trimethylation, transposable element silencing); H3K36
  dimethylation by NSD1, NSD2, NSD3 and ASH1L and trimethylation by SETD2 on elongating RNA polymerase
  II; H3K79 methylation by the non-SET enzyme DOT1L with AF10; and H4K20 monomethylation by KMT5A (SET8)
  followed by dimethylation by KMT5B/KMT5C
description: 'Histone lysines other than H3K4 and H3K27 are methylated by distinct families of S-adenosyl-L-methionine-dependent
  lysine methyltransferases, each specific for one site and for a defined number of methyl groups. Histone
  H3 lysine 9 (H3K9) is methylated by three systems. SUV39H1 and SUV39H2 trimethylate H3K9 at pericentric
  heterochromatin, building the H3K9me3 mark that HP1 proteins bind. G9a (EHMT2) and GLP (EHMT1) form
  a heteromeric complex that mono- and dimethylates H3K9 in euchromatin and silences genes. SETDB1, stabilised
  and stimulated by its partner ATF7IP, trimethylates H3K9 at promoters and at transposable elements,
  which it silences together with the HUSH complex and KRAB zinc-finger repressors. Histone H3 lysine
  36 (H3K36) is mono- and dimethylated by the NSD family (NSD1, NSD2, NSD3) and ASH1L, which act on nucleosomes
  and are associated with gene activation, and is trimethylated by SETD2, the only human enzyme that makes
  H3K36me3; SETD2 binds the hyperphosphorylated C-terminal domain of elongating RNA polymerase II and
  its mark suppresses cryptic intragenic transcription initiation. Histone H3 lysine 79 (H3K79), in the
  nucleosome core, is mono-, di- and trimethylated by DOT1L, the only known lysine methyltransferase without
  a SET domain; its partner AF10 reads unmodified H3K27 and is required for H3K79 dimethylation, and mistargeting
  of DOT1L by MLL fusions drives leukaemia. Histone H4 lysine 20 (H4K20) is methylated in sequence: KMT5A
  (SET8, PR-Set7), a cell-cycle regulated nucleosome-specific enzyme, makes H4K20me1, which KMT5B and
  KMT5C (SUV420H1/2) convert to H4K20me2, the mark read by 53BP1 in non-homologous end joining; H4K20me3
  at heterochromatin also depends on KMT5B/KMT5C in cells.'
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PW:0001338
  title: histone modification pathway
  statement: RGD curates to this pathway, from the histone lysine methylation review PMID:23200123 (TAS),
    the H3K9 methyltransferases SUV39H1, SUV39H2, EHMT1, EHMT2 and SETDB1, the H3K36 methyltransferases
    SETD2, NSD1, NSD3 and ASH1L, the H3K79 methyltransferase DOT1L and the H4K20 methyltransferases KMT5A,
    KMT5B and KMT5C, all of which are participants here. This module covers the lysine methylation writers
    of the pathway that the split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md does
    not assign to a module.
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001338.yaml
  statement: RGD describes the lysine methyltransferases as two classes, the SET-domain enzymes and a
    single non-SET enzyme.
  supporting_text: The methyltransferases (KMTs) possess a 130 amino acid enzymatic SET domain
- source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001338.yaml
  statement: Both classes of KMT use S-adenosylmethionine as the methyl donor.
  supporting_text: Both classes utilize S-adenosylmethionine (SAM) intermediate generated
- source_id: GO:0018022
  title: peptidyl-lysine methylation
  statement: PW:0001338 has no GO process mapping, and GO has obsoleted every histone lysine methylation
    process term (histone lysine methylation and the H3K9, H3K36, H3K79 and H4K20 methylation terms) because
    each represents a molecular function. The module's process concept is therefore the general process
    peptidyl-lysine methylation, as histone_arginine_methylation uses peptidyl-arginine methylation; the
    site and degree of methylation are carried by the site-specific methyltransferase activities on the
    catalytic annotons, and each part carries the downstream process its mark serves (heterochromatin
    formation, transcription elongation, transcription activation, non-homologous end joining).
- source_id: PMID:23200123
  statement: The RGD source review places DOT1L alone in the second, non-SET class of lysine methyltransferases.
  supporting_text: The second class of KMTs is represented solely by KMT4 (also known as Dot1p in yeast
    and Dot1L in human), which does not have a SET domain
- source_id: PMID:23200123
  statement: The source review assigns H3K9 mono- and dimethylation to G9a and GLP.
  supporting_text: KMT1C and its homolog KMT1D (GLP [G9a-like-Protein]/EHMT1) are responsible for mono-
    and dimethylation of H3K9.
notes: 'Derived from the RGD Pathway Ontology diagram PW:0001338 (histone modification pathway) through
  the RGD_PATHWAY_ONTOLOGY project (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier
  no_specific_go_term, flagged broad, 173 RGD-curated human genes). The histone modification split plan
  in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md does not name this module: it assigns
  H3K4 methylation to compass_family_h3k4_methylation and H3K27 methylation to polycomb_repressive_complexes
  and is silent on the other lysine methyltransferases. This module fills that gap, which is recorded
  in the notes of modules/histone_arginine_methylation.yaml ("Lysine methyltransferase gap"), by covering
  H3K9, H3K36, H3K79 and H4K20 methylation in one module with one part per site. PW:0001338 is the only
  PW evidence source; it has no PW children for lysine methylation, and its diagram names "Other complexes"
  that modify K9 and K36 without linking a PW id.


  Process concept. GO has obsoleted every histone lysine methylation process term as a molecular function,
  so the module concept is peptidyl-lysine methylation, matching histone_arginine_methylation''s use of
  peptidyl-arginine methylation. Each part carries the process its mark serves, taken from experimental
  human GOA rows or gene review core functions: heterochromatin formation for the H3K9 part, with pericentric
  heterochromatin formation for SUV39H1/2 (IDA), constitutive heterochromatin formation as the SUV39H
  node concept, negative regulation of gene expression, epigenetic for G9a/GLP (EHMT1 review core) and
  transposable element silencing by heterochromatin formation for SETDB1 (IDA); transcription elongation
  by RNA polymerase II for SETD2 (IMP) and positive or general regulation of DNA-templated transcription
  for the H3K36 dimethylases (NSD1 IDA, NSD3 IMP, ASH1L review core, NSD2 authored); positive regulation
  of transcription by RNA polymerase II for DOT1L (IDA/IMP); positive regulation of double-strand break
  repair via nonhomologous end joining for KMT5B/KMT5C (IMP). No new process term is requested, because
  GO''s policy is to represent histone methylation as molecular functions, and the site-specific activity
  terms exist for every reaction modelled.


  Membership. RGD genes used (13): SUV39H1, SUV39H2, EHMT1, EHMT2, SETDB1, SETD2, NSD1, NSD3, ASH1L, DOT1L,
  KMT5A, KMT5B, KMT5C, all annotated by RGD from PMID:23200123 (TAS). Participants added with cited human
  evidence although not on the RGD list (3): NSD2 (EXP H3K36 dimethyltransferase rows; PMID:22099308,
  PMID:19808676), ATF7IP (co-purifies with and stimulates human SETDB1, PMID:14536086; stabilises it,
  PMID:27732843) and MLLT10/AF10 (binds human DOT1L, PMID:15851025; required for H3K79 methylation, PMID:26439302).
  RGD lysine methyltransferase genes excluded: SETD7, SMYD1, SMYD2, SMYD3, PRDM2, PRDM6, PRDM8, PRDM9,
  PRDM16 and KMT2E (reasons below). CBX5 (HP1 alpha), which RGD also lists, is an H3K9me3 reader outside
  any modelled complex and stays out, as does MPHOSPH8. UniProt accessions and recommended names are from
  UniProt REST (November 2026); molecular functions are from each protein''s experimental human GOA rows
  in QuickGO (November 2026). EHMT1 and ASH1L have gene reviews in this repository, and their core functions
  are used unchanged (EHMT1 histone H3K9 methyltransferase activity with negative regulation of gene expression,
  epigenetic; ASH1L histone H3K36 dimethyltransferase activity with regulation of DNA-templated transcription).


  Modelling decisions. (1) One part per histone site, each a coexisting system, so the four parts are
  all required and the alternatives are within parts. (2) H3K9. SUV39H1 and SUV39H2 are a REALIZER variant
  set of single-subunit trimethylases at pericentric heterochromatin. G9a and GLP are one complex annoton
  because they act as a stoichiometric heteromer (detected in human HeLa and HEK293T cells, PMID:15774718);
  both subunits carry their own catalytic function and the complex carries the general H3K9 methyltransferase
  term with products restricted to me1 and me2. SETDB1 with ATF7IP is a complex annoton; ATF7IP''s methyltransferase
  regulator activity is curator-authored (no experimental human GOA row on that term). The HUSH complex
  (TASOR, MPHOSPH8, PPHLN1, none on the RGD list) recruits SETDB1 to H3K9me3-rich loci but is not a stable
  unit of the SETDB1-ATF7IP complex, and MPP8 is a reader, so HUSH is not modelled; nor are KAP-1/TRIM28
  and the KRAB zinc-finger proteins, which recruit SETDB1. No PRECEDES link is drawn between the H3K9
  systems: SUV39H enzymes prefer H3K9me1 (PMID:23200123) but the human source of that substrate (G9a/GLP,
  SETDB1 or the cytoplasmic PRDM route) is not settled, and the reported multimeric complex of SUV39H1,
  G9a, GLP and SETDB1 is not used. (3) H3K36. NSD1, NSD2, NSD3 and ASH1L are a REALIZER variant set of
  mono/dimethylases and SETD2 is a separate part as the sole trimethylase (in human myeloma cells SETD2
  depletion lowers H3K36me3 but not me2, PMID:22099308). No PRECEDES connection is drawn from the dimethylases
  to SETD2: SETD2 performs all three steps on unmodified nucleosomes in vitro (PMID:26002201), and whether
  it uses NSD-made H3K36me2 as its substrate in human cells is not established in the sources used. NSD1
  and NSD3 carry the general H3K36 term, as no experimental row asserts the dimethyl child for them. SETD2''s
  coupling to elongating Pol II rests on its association with hyperphosphorylated Pol II (PMID:16118227);
  the process term transcription elongation by RNA polymerase II is GOA''s IMP row and is read as the
  elongation-coupled chromatin step. (4) H3K79. DOT1L with AF10 is one complex annoton. AF10 binds DOT1L
  directly and its PZP reader couples unmodified H3K27 recognition to H3K79 dimethylation, so it is a
  stable, role-bearing unit. The other DotCom proteins found by proteomics in human cells (ENL/MLLT1,
  AF9/MLLT3, AF17/MLLT6, TRRAP, SKP1, beta-catenin; PMID:20203130) are not modelled: ENL and AF9 are also
  subunits of the super elongation complex, their contribution to H3K79 methylation in human cells is
  shown mainly with leukaemic fusion proteins, and the Wnt factors are not methylation units. (5) H4K20.
  KMT5A monomethylation PRECEDES KMT5B/KMT5C dimethylation (a REALIZER variant set), the product-substrate
  chain of RHEA:60344 and RHEA:60348; the connection carries chaining_status NOT_APPLICABLE because the
  intermediate is a methyl-lysine residue, not a CoA carrier. The H4K20 trimethyltransferase term is not
  used; the identity of the H4K20me3 writer is a knowledge gap. (6) Chemistry. SAM, SAH, H+ and the unmodified,
  mono-, di- and trimethyl L-lysyl residue states are grounded from the Rhea reactions cited on each function
  (RHEA:60276, 60280, 60284, 60288, 60308, 60312, 60316, 60320, 60324, 60328, 60344, 60348), with ChEBI
  labels checked in OLS (November 2026). The histones are substrates, not participants, and are not listed
  as units. (7) Authored functions not backed by an experimental GOA row on that exact term or a gene
  review core function: ATF7IP methyltransferase regulator activity; NSD2 positive regulation of DNA-templated
  transcription (process). MLLT10 histone binding is its IPI row. (8) Readers. Chromodomain, ankyrin and
  Tudor reading by the enzymes themselves (SUV39H1/2, EHMT1, SETDB1) is recorded in role text, not as
  separate activities. HP1/CBX5, MPP8 and other readers of the marks are outside the module.


  Excluded enzymes. SETD7 (SET7/9) was identified as an H3K4 monomethyltransferase on free histones (EXP,
  PMID:12540855), not on nucleosomes, and its many experimental GOA rows are for non-histone substrates
  (p53, TAF10, ER alpha and others); under the CLAUDE.md rule that measured activity is not automatically
  function it is treated as a non-histone protein-lysine methyltransferase and excluded, and its H3K4
  activity in any case belongs to compass_family_h3k4_methylation''s site rather than to this module.
  SMYD1, SMYD2 and SMYD3 have no experimental histone methyltransferase row in human GOA except one SMYD3
  IMP row for histone H4 methyltransferase activity (PMID:25738358); SMYD2''s experimental rows are p53
  methylation, and SMYD1 is a muscle cofactor; they are excluded. The PRDMs are excluded: PRDM2, PRDM6
  and PRDM8 have weak or in vitro histone activity, PRDM16 and MECOM''s cytoplasmic H3K9 monomethylation
  rests mainly on mouse studies (the human GO-CAM model 682fbcd000002172 draws it), and PRDM9''s robust
  H3K4/H3K36 trimethylation designates meiotic recombination hotspots, a different mechanism that would
  belong in a meiotic recombination module. KMT2E is left out as in compass_family_h3k4_methylation. The
  H3K9, H3K36 and H4K20 demethylases are in histone_lysine_demethylation; H3K27 methylation and its antagonism
  by H3K36 methylation are in polycomb_repressive_complexes; H3K4 methylation is in compass_family_h3k4_methylation.


  GO-CAM links. gocams/index.tsv (November 2026) lists production models containing SUV39H1, SUV39H2,
  SETDB1, EHMT1, KMT5A and SETD2. Pinned: the SUV39H1 and SUV39H2 trimethyltransferase activities of the
  G2E3 pericentric heterochromatin model, the SETDB1 activities of the HUSH and TNRC18 transposable element
  silencing models, and the KMT5A activity of the TONSL-MMS22L model. Not pinned: the SETD2 activity of
  the FIP200/TRIM21 autophagy model, which is a cytoplasmic non-histone methylation; the further SUV39H1
  models (ASB7, CDK1, CDK2, UHRF1, DCAF13 and PRDM16/MECOM models), which model regulation of SUV39H1
  rather than this pathway and would add no new grounding; and the EHMT1 activities in the PRDM16, CBX4,
  BCAT2, TLE3 and CRL2(APPBP2) adipocyte models (below). PANTHER family ids and PTNs are deliberately
  not asserted.


  Possible upstream issues (queries only, not read in full). (a) Several human adipocyte GO-CAM models
  give EHMT1 histone H3K9 trimethyltransferase activity (GO:0140949) as well as H3K9me2 methyltransferase
  activity; human and mouse biochemistry places G9a/GLP at H3K9 mono- and dimethylation, and the EHMT1
  gene review records the trimethylation rows as unresolved. Recorded for a CHECK request to the GO-CAM
  curators. (b) ASH1L carries an EXP row for histone H3K36 trimethyltransferase activity from PMID:21239497,
  whereas the kinetic study PMID:26002201 reports that ASH1L only mono- and dimethylates H3K36; the abstract
  of PMID:21239497 states only that ASH1L methylates H3K36 specifically. Recorded as a CHECK query to
  GOA. (c) NSD3 carries IDA rows for H3K4 dimethyltransferase and H3K27 di- and trimethyltransferase activities
  from PMID:16682010 that later nucleosome studies of the NSD family do not support; not read, recorded
  as a query.'
