        role_description: Rab GTPase on the contractile vacuole network and bladder that regulates the membrane traffic
          of the complex. In Dictyostelium its association with the contractile vacuole membranes is lost under
          hypo-osmotic conditions or when the proton pump is inhibited (PMID:11686306).
        evidence:
        - source_id: PMID:11686306
          statement: Dictyostelium Rab11 is associated with the V-ATPase-rich contractile vacuole membranes.
          supporting_text: Subcellular fractionation and immunofluorescence studies revealed that DdRab11 was exclusively
            associated with the ATPase proton pump-rich contractile vacuole membrane system, consisting of a reticular
            network and bladder-like vacuoles.
        - source_id: PMID:11686306
          statement: A dominant negative Dictyostelium Rab11 disrupts the structure of the contractile vacuole system.
          supporting_text: Compared with wild-type cells, the dominant negative DdRab11-expressing cells contained a more
            extensive contractile vacuole network and abnormally enlarged contractile vacuole bladders, most likely the
            result of defects in membrane trafficking.
