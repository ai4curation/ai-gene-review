id: MODULE:contractile_vacuole_complex
title: Contractile vacuole complex
description: The contractile vacuole complex (CVC) is an osmoregulatory organelle of many free-living protists and
  green algae, such as Dictyostelium, Paramecium, Chlamydomonas and trypanosomatids. It collects water and ions from
  the cytosol into a network of tubules and a bladder, then expels them through a pore at the plasma membrane,
  emptying and refilling in a cycle. Its membrane carries the V-type H+-ATPase, whose proton gradient drives the
  movement of water and ions, notably Ca2+, into the organelle. Membrane fusion, tubulation and discharge depend on
  SNAREs, Rab GTPases (Rab11 on the Dictyostelium complex) and, at discharge, the exocyst. This module is the
  proton pump and the Rab11 GTPase of the complex.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:24016530
  title: Contractile vacuole complex--its expanding protein inventory.
  statement: The CVC osmoregulates by using the proton gradient of its resident V-type H+-ATPase.
  supporting_text: The contractile vacuole complex (CVC) of some protists serves for the osmotic equilibration of water
    and ions, notably Ca(2+), by chemiosmotic exploitation of a H(+) gradient generated by the organelle-resident V-type
    H(+)-ATPase.
notes: 'Not a rule. Both parts occur in nearly every eukaryote: the V-ATPase acidifies lysosomes, vacuoles and endosomes
  everywhere, and Rab11 runs recycling-endosome and Golgi traffic in animals, plants and fungi, none of which have a
  contractile vacuole. Meeting the module therefore shows that a genome has the parts the complex uses, not that it
  has the organelle; no part is specific to the contractile vacuole, and the reviews of its protein inventory
  (PMID:24016530) describe it through general membrane-traffic machinery. Not modelled: SNAREs, the exocyst and the
  Rab8a-dependent discharge in Dictyostelium (PMID:22323285), the Dictyostelium-specific drainin and the BEACH protein
  LvsA, aquaporins, Ca2+ transporters and channels, and the fusion of acidocalcisomes with the contractile vacuole in
  trypanosomatids and Chlamydomonas.'
