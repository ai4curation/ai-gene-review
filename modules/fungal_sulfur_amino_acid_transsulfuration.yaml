  knowledge_gaps:
    - gap_statement: >-
        The PomBase S. pombe sulfur model contains a cystathionine
        beta-synthase activity (GO:0004122, part_of L-cysteine biosynthesis)
        whose enabling gene product is unidentified, and no S. pombe protein
        with cystathionine beta-synthase or cystathionine gamma-lyase EC
        annotation is found in UniProt. It is therefore unknown whether
        fission yeast can convert homocysteine to cysteine at all, and if so
        by which enzyme.
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: >-
        Determines whether the bidirectional transsulfuration typical of
        S. cerevisiae is ancestral to fungi or whether S. pombe relies only on
        the cysteine-to-homocysteine direction plus de novo cysteine synthesis
        from O-acylserine.
      resolution: >-
        Test whether S. pombe mutants blocked in O-acylserine-dependent
        cysteine synthesis can grow on homocysteine or methionine as the sole
        sulfur source, and assay cell extracts for cystathionine
        beta-synthase activity.
  notes: >-
    NEW module (2026-10) generalising YeastPathways HOMOCYS-CYS-CONVERT,
    CYSTEINE-SYN2-PWY, HOMOCYSDEGR-PWY-1 and the transsulfuration part of
    PWY-821-1. Boundary: from L-homocysteine or L-cysteine to the other via
    cystathionine. Homoserine O-acetylation (MET2) and direct sulfhydrylation
    of O-acetylhomoserine (MET17) are kept in methionine_biosynthesis, whose
    trans-sulfuration route variant uses the same STR2/STR3 (and MetB/MetC)
    exemplars and GO terms (GO:0003962, GO:0047804) as the
    cysteine-to-homocysteine variant here; homocysteine remethylation and the
    human CBS/CTH disease context are in homocysteine_metabolism, whose
    transsulfuration arm conforms to the homocysteine-to-cysteine variant
    here. The CBS/CTH-derived hydrogen sulfide production (GO:0070814, for
    which CYS4 has an IDA) is a side activity outside the module.
    Generalisation: the module is fungal in scope because only fungi are known
    to require both directions, but each direction is a variant that also
    matches the animal (CBS/CTH) or bacterial/plant (CGS/CBL) arm, and the
    variant set is ONE_OR_MORE. YeastCyc assessment - all four catalysts are
    correct; the STR2 assignment rests on disruption genetics only
    (PMID:10821189), STR3 has been assayed (PMID:22572787). CYS3 also shows
    cystathionine gamma-synthase activity with O-succinylhomoserine when
    expressed in E. coli (PMID:1577698), but O-succinylhomoserine is absent
    from yeast and this is not treated as a physiological route. YeastCyc's
    "forward" (cysteine to homocysteine) and "reverse" (homocysteine to
    cysteine) labels are the opposite of the convention in the crosswalk
    rationale (the S. cerevisiae gene reviews follow YeastCyc); directions
    are named explicitly here. Compartment is asserted per leaf, following
    the gene reviews: CYS4 and CYS3 cytoplasm, STR2 cytosol, and STR3
    peroxisome (Str3p carries a C-terminal PTS1 and was found in the
    peroxisome proteome, PMID:11565790), so cystathionine produced by STR2
    in the cytosol must reach the peroxisome; no module-level compartment is
    asserted. CYS4 mitochondrial HDA rows in GOA are not used. GO-CAM
    comparison - the four YeastPathways models agree with the module on
    genes and functions but have no causal edges, place STR3 in the cytosol
    rather than the peroxisome, and CYSTEINE-SYN2-PWY uses cytoplasm where
