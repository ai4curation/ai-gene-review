id: MODULE:fungal_sulfur_amino_acid_transsulfuration
title: Bidirectional transsulfuration between homocysteine and cysteine (fungal)
description: >-
  Interconversion of L-homocysteine and L-cysteine through the thioether
  intermediate L-cystathionine, catalysed by four pyridoxal 5'-phosphate (PLP)
  dependent enzymes acting in two opposite directions. In the
  homocysteine-to-cysteine direction, cystathionine beta-synthase condenses
  L-homocysteine with L-serine to L-cystathionine, and cystathionine
  gamma-lyase cleaves cystathionine to L-cysteine, 2-oxobutanoate and ammonia;
  this transfers the sulfur atom of methionine-derived homocysteine onto the
  serine carbon skeleton and is the only transsulfuration route of mammals. In
  the cysteine-to-homocysteine direction, cystathionine gamma-synthase
  condenses L-cysteine with an O-acylated L-homoserine to cystathionine, and
  cystathionine beta-lyase cleaves cystathionine to L-homocysteine, pyruvate
  and ammonia; this is the main route to homocysteine in enteric bacteria and
  plants. Budding yeast and other fungi that assimilate reduced sulfur
  primarily into the four-carbon chain of homocysteine (by direct
  sulfhydrylation of O-acetylhomoserine) possess both directions, so they can
  make cysteine from homocysteine and can also use cysteine as a sole sulfur
  source for methionine synthesis. Other lineages carry only one direction,
  and the module is therefore satisfied by either direction or by both.
status: DRAFT
evidence:
  - source_id: YeastPathways:HOMOCYS-CYS-CONVERT
    title: homocysteine and cysteine interconversion (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Source pathway covering both directions: CYS4 (cystathionine
      beta-synthase), CYS3 (cystathionine gamma-lyase), STR2 (cystathionine
      gamma-synthase, RXN-721) and STR3 (cystathionine beta-lyase). All four
      assignments were retained. YeastCyc calls the cysteine-to-homocysteine
      direction "forward" and the homocysteine-to-cysteine direction
      "reverse"; this module names the directions explicitly instead because
      the literature uses both conventions.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=HOMOCYS-CYS-CONVERT
  - source_id: YeastPathways:CYSTEINE-SYN2-PWY
    title: cysteine biosynthesis from homocysteine (S. cerevisiae, SGD YeastPathways)
    statement: CYS4 and CYS3; the homocysteine-to-cysteine direction.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=CYSTEINE-SYN2-PWY
  - source_id: YeastPathways:HOMOCYSDEGR-PWY-1
    title: L-cysteine biosynthesis III (from L-homocysteine) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Duplicate of CYSTEINE-SYN2-PWY with the same two reactions and
      catalysts (CYS4, CYS3).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=HOMOCYSDEGR-PWY-1
  - source_id: YeastPathways:PWY-821-1
    title: superpathway of sulfur amino acid biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway whose transsulfuration reactions (CYS4, CYS3, STR2, STR3)
      are modelled here. Its sulfate-assimilation reactions (MET3, MET14,
      MET16, MET10/MET5) belong to aps_dependent_assimilatory_sulfate_reduction;
      the aspartate-to-homoserine trunk (HOM3, HOM2, HOM6) to
      aspartate_family_threonine_biosynthesis; homoserine O-acetylation
      (MET2), O-acetylhomoserine sulfhydrylation (MET17), methionine synthase
      (MET6) and MET7 folylpolyglutamate synthesis to methionine_biosynthesis;
      and methionine adenosyltransferase (SAM1, SAM2) to methionine_cycle.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-821-1
  - source_id: GO:0050667
    title: homocysteine metabolic process
    statement: >-
      Module-level process. The dedicated term GO:0019346 transsulfuration is
      obsolete in current GO (GOA rows for CYS4, STR2 and STR3 display it as
      "obsolete transsulfuration"), so the two directions are instead grounded
      in GO:0019344 and GO:0071269, both of which are covered by this
      parent-level concept.
  - source_id: GO:0019344
    title: L-cysteine biosynthetic process
    statement: Process for the homocysteine-to-cysteine direction.
  - source_id: GO:0071269
    title: L-homocysteine biosynthetic process
    statement: Process for the cysteine-to-homocysteine direction.
  - source_id: PMID:8366024
    title: >-
      Cysteine biosynthesis in Saccharomyces cerevisiae occurs through the
      transsulfuration pathway which has been built up by enzyme recruitment.
    statement: >-
      Cloning of STR4 (CYS4, cystathionine beta-synthase) and STR1 (CYS3,
      cystathionine gamma-lyase); fungi possess two operating
      transsulfuration pathways, whereas mammals have only the
      homocysteine-to-cysteine route.
    supporting_text: >-
      Fungi are capable of incorporating reduced sulfur into a four-carbon
      chain, and they possess two operating transsulfuration pathways. By
      contrast, synthesis of cysteine from homocysteine is the only existing
      transsulfuration pathway in mammals.
  - source_id: PMID:10509018
    title: 'Cysteine biosynthesis in Saccharomyces cerevisiae: a new outlook on pathway and regulation.'
    statement: >-
      cys3 and cys4 disruptants are cysteine-dependent; cysteine is made in
      yeast exclusively by cystathionine beta-synthase and cystathionine
      gamma-lyase.
    supporting_text: >-
      cysteine is synthesized exclusively through the pathway constituted with
      beta-CTSase and gamma-CTLase
  - source_id: PMID:1577698
    title: Cloning and characterization of the CYS3 (CYI1) gene of Saccharomyces cerevisiae.
    statement: >-
      CYS3 is the structural gene for cystathionine gamma-lyase; in E. coli it
      also shows cystathionine gamma-synthase activity with
      O-succinylhomoserine, illustrating the shared chemistry of the
      gamma-family enzymes.
    supporting_text: >-
      CYS3 (CYI1) was concluded to be the structural gene for this enzyme.
  - source_id: PMID:10821189
    title: Cysteine is essential for transcriptional regulation of the sulfur assimilation genes in Saccharomyces cerevisiae.
    statement: >-
      Disruption of YJR130c (STR2) or YGL184c (STR3) blocks conversion of
      cysteine into homocysteine, identifying the yeast
      cysteine-to-homocysteine enzymes.
    supporting_text: >-
      Two genes that presumably encode cystathionine gamma-synthase and
      cystathionine beta-lyase were identified by genetic disruption (ORFs
      YJR130c and YGL184c), yielding yeast strains that cannot convert
      cysteine into homocysteine.
  - source_id: PMID:22572787
    title: 'Saccharomyces cerevisiae STR3 and yeast cystathionine β-lyase enzymes: The potential for engineering increased flavor release.'
    statement: Biochemical characterisation of STR3 as the S. cerevisiae cystathionine beta-lyase.
  - source_id: PMID:11565790
    title: Identification of peroxisomal membrane proteins of Saccharomyces cerevisiae by mass spectrometry.
    statement: >-
      Peroxisomal proteome supporting the peroxisomal location of STR3 used
      in the STR3 gene review (IDA in GOA).
  - source_id: PMID:9409150
    title: Metabolism of sulfur amino acids in Saccharomyces cerevisiae.
    statement: Review of S. cerevisiae sulfur amino acid metabolism cited by YeastPathways.
