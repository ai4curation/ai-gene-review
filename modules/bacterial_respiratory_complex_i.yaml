id: MODULE:bacterial_respiratory_complex_i
title: Bacterial respiratory complex I (proton-translocating NADH:quinone oxidoreductase)
description: >-
  Reusable bacterial module for the conserved 14-subunit respiratory complex I,
  also called NDH-1 or NADH:quinone oxidoreductase. The peripheral arm oxidizes
  NADH, transfers electrons through FMN and iron-sulfur centers, and reduces the
  quinone pool. The membrane arm couples this redox chemistry to proton
  translocation. The module separates the NADH-input, quinone-reduction,
  membrane-interface, and antiporter-like proton-pumping parts so that fused
  subunits such as NuoC/D can be represented without collapsing the enzyme to a
  single step. It excludes the non-homologous, non-proton-pumping type-II NADH
  dehydrogenase (Ndh/NDH-2).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0045271
    title: respiratory chain complex I
    statement: >-
      GO:0045271 grounds the assembled proton-translocating respiratory complex
      represented by the bacterial Nuo core.
  - source_id: KEGG:ppu00190
    title: Pseudomonas putida KT2440 oxidative phosphorylation
    statement: >-
      The PSEPK oxidative-phosphorylation bucket contains the contiguous
      PP_4119-PP_4131 nuo locus, encoding all 14 canonical Nuo subunits in 13
      proteins because NuoC and NuoD are fused.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__mitochondrial_complex_i_core__ppu00190-deep-research-openscientist.md
    title: OpenScientist review of complex I in Pseudomonas putida KT2440
    statement: >-
      Species-aware research identifies a complete, single-copy nuoA-N locus,
      supports the NuoC/D fusion, and distinguishes PP_0626 Ndh as a separate
      type-II NADH dehydrogenase rather than a complex I subunit.
notes: >-
  Pseudomonas putida KT2440 supplies exact representatives for every bacterial
  core subunit. PP_4121/Q88FH5 is a single NuoC/D polypeptide and therefore
  satisfies both conserved C- and D-subunit roles. Eukaryotic supernumerary
  NDUF subunits are outside this bacterial core module and their absence is not
  a pathway hole. GO:0050136 denotes non-electrogenic NADH:quinone activity and
  is incompatible with the defining proton-translocating chemistry of NDH-1;
  its automated propagation to Nuo subunits should be removed rather than used
  to model this module.
module:
  id: bacterial_respiratory_complex_i
  label: Bacterial respiratory complex I
  module_type: PROTEIN_COMPLEX
  concepts:
    - preferred_term: respiratory chain complex I
      term:
        id: GO:0045271
        label: respiratory chain complex I
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: NADH oxidation and entry electron transfer
      node:
        id: nuo_n_module
        label: Nuo N-module NADH-input arm
        module_type: PROTEIN_COMPLEX
        description: >-
          Soluble peripheral-arm segment in which NuoF oxidizes NADH at FMN and
          NuoE and NuoG relay electrons through iron-sulfur centers.
        annotons:
          - id: nuof_nadh_input
            label: NuoF FMN-dependent NADH-input subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NuoF/Nqo1/NDUFV1 family
                representative_members:
                  - preferred_term: PSEPK nuoF exemplar
                    term:
                      id: UniProtKB:Q88FH3
                      label: NADH-quinone oxidoreductase subunit F
                    description: Pseudomonas putida KT2440 nuoF/PP_4123.
            function:
              preferred_term: NADH dehydrogenase activity
              term:
                id: GO:0003954
                label: NADH dehydrogenase activity
              substrates:
                - preferred_term: NADH
                - preferred_term: FMN
              products:
                - preferred_term: NAD+
                - preferred_term: reduced FMN (FMNH2)
              cofactors:
                - preferred_term: FMN
            role_description: >-
              Catalytic entry subunit that binds FMN and accepts a hydride from
              NADH before passing electrons into the iron-sulfur relay.
          - id: nuoe_entry_fes
            label: NuoE entry iron-sulfur subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NuoE/Nqo2/NDUFV2 family
                representative_members:
                  - preferred_term: PSEPK nuoE exemplar
                    term:
                      id: UniProtKB:Q88FH4
                      label: NADH-quinone oxidoreductase subunit E
                    description: Pseudomonas putida KT2440 nuoE/PP_4122.
            function:
              preferred_term: electron transfer activity
              term:
                id: GO:0009055
                label: electron transfer activity
            role_description: >-
              Small iron-sulfur subunit at the NADH-input end of the peripheral
              arm.
          - id: nuog_fes_relay
            label: NuoG iron-sulfur relay subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NuoG/Nqo3/NDUFS1 family
                representative_members:
                  - preferred_term: PSEPK nuoG exemplar
                    term:
                      id: UniProtKB:Q88FH2
                      label: NADH-quinone oxidoreductase subunit G
                    description: Pseudomonas putida KT2440 nuoG/PP_4124.
            function:
              preferred_term: electron transfer activity
              term:
                id: GO:0009055
                label: electron transfer activity
              cofactors:
                - preferred_term: 2Fe-2S cluster
                - preferred_term: 4Fe-4S clusters
            role_description: >-
              Large peripheral-arm iron-sulfur protein that relays electrons
              away from the FMN-containing input site using one 2Fe-2S and three
              4Fe-4S clusters in the PSEPK exemplar.
    - order: 2
      role: terminal iron-sulfur relay and quinone-site architecture
      node:
        id: nuo_q_module
        label: Nuo Q-module quinone-reduction arm
        module_type: PROTEIN_COMPLEX
        description: >-
          Peripheral-arm segment that completes the iron-sulfur wire and forms
          the quinone-reactive cavity at the membrane-arm junction.
        annotons:
          - id: nuob_terminal_fes
            label: NuoB terminal iron-sulfur subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NuoB/Nqo6/NDUFS7 family
                representative_members:
                  - preferred_term: PSEPK nuoB exemplar
                    term:
                      id: UniProtKB:Q88FH6
                      label: NADH-quinone oxidoreductase subunit B
                    description: Pseudomonas putida KT2440 nuoB/PP_4120.
            function:
              preferred_term: electron transfer activity
              term:
                id: GO:0009055
                label: electron transfer activity
              cofactors:
                - preferred_term: 4 iron, 4 sulfur cluster
                  term:
                    id: GO:0051539
                    label: 4 iron, 4 sulfur cluster binding
