              Carries the terminal iron-sulfur center that supplies electrons
              to quinone at the Q-site.
          - id: nuocd_quinone_site
            label: Fused NuoC/D quinone-site scaffold
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NuoC-NuoD/Nqo5-Nqo4/NDUFS3-NDUFS2 families
                representative_members:
                  - preferred_term: PSEPK fused nuoC/D exemplar
                    term:
                      id: UniProtKB:Q88FH5
                      label: NADH-quinone oxidoreductase subunit C/D
                    description: >-
                      Pseudomonas putida KT2440 nuoC/PP_4121; one polypeptide
                      covers the conserved NuoC and NuoD structural roles.
            function:
              preferred_term: quinone binding
              term:
                id: GO:0048038
                label: quinone binding
              evidence:
                - source_id: file:PSEPK/nuoC/nuoC-uniprot.txt
                  statement: >-
                    The fused PSEPK NuoC/D record carries GO:0048038 quinone
                    binding and places the protein in the peripheral sector.
            role_description: >-
              Forms the quinone-cavity scaffold. In many Gammaproteobacteria,
              including P. putida KT2440, the C and D subunits are fused.
          - id: nuoi_fes_relay
            label: NuoI iron-sulfur relay subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NuoI/Nqo9/NDUFS8 family
                representative_members:
                  - preferred_term: PSEPK nuoI exemplar
                    term:
                      id: UniProtKB:Q88FH0
                      label: NADH-quinone oxidoreductase subunit I
                    description: Pseudomonas putida KT2440 nuoI/PP_4126.
            function:
              preferred_term: electron transfer activity
              term:
                id: GO:0009055
                label: electron transfer activity
              cofactors:
                - preferred_term: 4 iron, 4 sulfur cluster
                  term:
                    id: GO:0051539
                    label: 4 iron, 4 sulfur cluster binding
            role_description: >-
              Iron-sulfur subunit in the distal portion of the relay leading
              toward the terminal quinone-reducing center.
    - order: 3
      role: peripheral-arm to membrane-arm coupling interface
      node:
        id: nuo_membrane_interface
        label: Nuo membrane coupling interface
        module_type: PROTEIN_COMPLEX
