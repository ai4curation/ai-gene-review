  connections:
    - source: nuo_n_module
      target: nuo_q_module
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Electrons accepted from NADH at FMN flow through the peripheral-arm
        iron-sulfur relay to the quinone-reduction module.
    - source: nuo_q_module
      target: nuo_membrane_interface
      connection_type: CAUSES
      description: >-
        Quinone-site redox chemistry drives conformational changes at the
        peripheral-arm/membrane-arm interface.
