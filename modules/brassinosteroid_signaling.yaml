id: MODULE:brassinosteroid_signaling
title: Brassinosteroid signal perception and relay to BZR1/BES1 transcription factors
description: >-
  Brassinosteroid (BR) signalling converts perception of a steroid hormone at the cell surface into
  a change in nuclear gene expression through a chain of phosphorylation and dephosphorylation steps.
  In the absence of BR, the receptor kinase BRI1 is held inactive by its cytoplasmic inhibitor BKI1,
  and the constitutively active GSK3-like kinase BIN2 phosphorylates the BZR1 and BES1 transcription
  factors, which inhibits their DNA binding, promotes 14-3-3 binding and cytoplasmic retention, and
  targets them for degradation. Brassinolide binds the extracellular LRR domain of BRI1, which
  recruits the coreceptor kinase BAK1; transphosphorylation activates BRI1, which phosphorylates
  BKI1 (releasing it from the membrane) and the receptor-like cytoplasmic kinases BSK1 (and CDG1).
  Phosphorylated BSK1 binds the Kelch-repeat phosphatase BSU1, which (after CDG1 phosphorylation)
  dephosphorylates the conserved pTyr200 of BIN2 and inactivates it. With BIN2 off, PP2A
  dephosphorylates BZR1/BES1, which accumulate in the nucleus and bind BRRE and E-box elements to
  repress BR biosynthetic genes (feedback) and activate or repress thousands of growth-related genes.
  BR biosynthesis, receptor endocytosis/turnover, and downstream transcriptional networks are outside
  this module's boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:19734888
    title: Brassinosteroid signal transduction from cell-surface receptor kinases to nuclear transcription
      factors.
    statement: Establishes the connected relay BRI1 -> BSK1 -> BSU1 -| BIN2 -| BZR1/BZR2.
    supporting_text: >-
      These results demonstrate direct sequential BR activation of BRI1, BSK1 and BSU1, and inactivation
      of BIN2, leading to accumulation of unphosphorylated BZR (brassinazole resistant) transcription
      factors in the nucleus.
  - source_id: PMID:21855796
    title: The CDG1 kinase mediates brassinosteroid signal transduction from BRI1 receptor kinase to
      BSU1 phosphatase and GSK3-like kinase BIN2.
    statement: A parallel RLCK (CDG1) also relays BRI1 output to BSU1 by phosphorylating Ser764.
    supporting_text: >-
      CDG1 in turn phosphorylates S764 to activate BSU1, which inactivates BIN2 by dephosphorylating
      Y200 of BIN2.
  - source_id: PMID:16857903
    title: Brassinosteroids regulate dissociation of BKI1, a negative regulator of BRI1 signaling, from
      the plasma membrane.
    statement: BKI1 restrains BRI1 and limits BRI1-BAK1 association until BR is perceived.
    supporting_text: >-
      BKI1 is a substrate of BRI1 kinase and limits the interaction of BRI1 with its proposed coreceptor,
      BAK1, suggesting that BKI1 prevents the activation of BRI1.
  - source_id: PMID:12007405
    title: BES1 accumulates in the nucleus in response to brassinosteroids to regulate gene expression
      and promote stem elongation.
    statement: The pathway resembles Wnt signalling, with a GSK3 inactivated to allow nuclear
      accumulation of a transcriptional regulator.
    supporting_text: >-
      These results establish a signaling cascade for BRs with similarities to the Wnt pathway, in which
      signaling through cell surface receptors leads to inactivation of a GSK-3 allowing accumulation
      of a nuclear protein that regulates target gene expression.
  - source_id: file:ARATH/BRI1/BRI1-ai-review.yaml
    statement: BRI1 receptor and kinase core functions.
  - source_id: file:ARATH/BAK1/BAK1-ai-review.yaml
    statement: BAK1 coreceptor kinase core function.
  - source_id: file:ARATH/BKI1/BKI1-ai-review.yaml
    statement: BKI1 protein kinase inhibitor core function.
  - source_id: file:ARATH/BSK1/BSK1-ai-review.yaml
    statement: BSK1 receptor-like cytoplasmic kinase relay function.
  - source_id: file:ARATH/BSU1/BSU1-ai-review.yaml
    statement: BSU1 protein tyrosine phosphatase activity on BIN2 pTyr200.
  - source_id: file:ARATH/BIN2/BIN2-ai-review.yaml
    statement: BIN2 GSK3-like Ser/Thr kinase negative regulator.
  - source_id: file:ARATH/BZR1/BZR1-ai-review.yaml
    statement: BZR1 DNA-binding transcription factor.
  - source_id: file:ARATH/BES1/BES1-ai-review.yaml
    statement: BES1 DNA-binding transcription factor.
notes: >-
  Grounded on Arabidopsis thaliana proteins; each step has paralogous families (BRI1/BRL1/BRL3,
  SERK1-5, BSK1-12, BSU1/BSL1-3, BIN2/BIL1/BIL2 and other group-II GSK3s, BZR1/BES1/BEH1-4), so the
  single named members are exemplars, not an exhaustive list. CDG1/CDL1 (parallel RLCK relay to BSU1),
  PP2A (dephosphorylation of BZR1), KIB1 (BR-induced degradation of BIN2) and 14-3-3 proteins
  (cytoplasmic retention of phosphorylated BZR1/BES1) are described in the module description but not
  modelled as parts because their gene reviews are not part of this batch. BSK1 catalytic activity is
  debated (BSK8 structures suggest pseudokinase behaviour), and BSK1 promotes BSU1 activity in vivo
  without a demonstrated direct effect in vitro; the BSK1 -> BSU1 connection is therefore a positive
  regulatory link, not an asserted enzymatic activation. BRI1 annoton uses its reviewed core function
  (signaling receptor activity); a brassinosteroid-binding-specific receptor MF could be considered
  on the BRI1 review. No production GO-CAM in gocams/index.tsv contains these Arabidopsis proteins.
module:
  id: brassinosteroid_signaling
  label: Brassinosteroid signaling (BRI1 to BZR1/BES1)
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: brassinosteroid mediated signaling pathway
      term:
        id: GO:0009742
        label: brassinosteroid mediated signaling pathway
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: Members are grounded on Arabidopsis proteins; the pathway is conserved across
          land plants.
  parts:
    - order: 1
      role: receptor restraint by BKI1
      node:
        id: receptor_inhibition
        label: BKI1 inhibition of the unliganded BRI1 receptor
        module_type: REGULATORY_STEP
        description: >-
          In the absence of BR, membrane-anchored BKI1 binds the BRI1 kinase domain and blocks
          recruitment of BAK1. BR-activated BRI1 phosphorylates BKI1, releasing it into the cytosol.
        annotons:
          - id: bki1_inhibitor
            label: "BKI1: BRI1 kinase inhibitor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BKI1
                term:
                  id: UniProtKB:Q9FMZ0
                  label: BRI1 kinase inhibitor 1
            function:
              preferred_term: protein kinase inhibitor activity
              term:
                id: GO:0004860
                label: protein kinase inhibitor activity
              evidence:
                - source_id: PMID:22075146
                  statement: BKI1 keeps BRI1 quiescent; phosphorylated BKI1 binds 14-3-3 proteins that
                    relieve the inhibition.
                  supporting_text: >-
                    is quiescent in the absence of steroids, largely due to a negative regulator, BRI1
                    KINASE INHIBITOR 1 (BKI1)
            processes:
              - preferred_term: negative regulation of brassinosteroid mediated signaling pathway
                term:
                  id: GO:1900458
                  label: negative regulation of brassinosteroid mediated signaling pathway
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Holds BRI1 inactive until BR binding triggers its phosphorylation and
              membrane release.
    - order: 2
      role: hormone perception and receptor complex activation
      node:
        id: receptor_activation
        label: BRI1-BAK1 receptor complex activation
        module_type: REGULATORY_STEP
        description: >-
          Brassinolide binds the extracellular LRR/island domain of BRI1, which then associates with the
          coreceptor BAK1 (SERK3); sequential transphosphorylation activates the BRI1 kinase.
        annotons:
          - id: bri1_receptor
            label: "BRI1: brassinosteroid receptor kinase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BRI1
                term:
                  id: UniProtKB:O22476
                  label: Protein BRASSINOSTEROID INSENSITIVE 1
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              evidence:
                - source_id: file:ARATH/BRI1/BRI1-ai-review.yaml
                  statement: >-
                    BRI1 core function as a brassinosteroid receptor kinase; its protein serine/threonine
                    kinase activity (a BRI1 core function) phosphorylates BKI1, BSK1 and CDG1 in this
                    step, while ligand perception is captured by its signaling receptor activity core
                    function.
            processes:
              - preferred_term: brassinosteroid mediated signaling pathway
                term:
                  id: GO:0009742
                  label: brassinosteroid mediated signaling pathway
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Binds brassinolide and phosphorylates BKI1, BSK1 and CDG1.
          - id: bak1_coreceptor
            label: "BAK1: coreceptor kinase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BAK1
                term:
                  id: UniProtKB:Q94F62
                  label: BRASSINOSTEROID INSENSITIVE 1-associated receptor kinase 1
            function:
              preferred_term: transmembrane receptor protein serine/threonine kinase activity
              term:
                id: GO:0004675
                label: transmembrane receptor protein serine/threonine kinase activity
              evidence:
                - source_id: file:ARATH/BAK1/BAK1-ai-review.yaml
                  statement: BAK1 core function as coreceptor kinase in BR signalling.
            processes:
              - preferred_term: brassinosteroid mediated signaling pathway
                term:
                  id: GO:0009742
                  label: brassinosteroid mediated signaling pathway
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Ligand-dependent coreceptor that transphosphorylates and fully activates
              BRI1.
    - order: 3
      role: cytoplasmic kinase relay
      node:
        id: bsk_relay
        label: BSK1 phosphorylation by BRI1
        module_type: REGULATORY_STEP
        description: >-
          BRI1 phosphorylates the plasma-membrane-anchored RLCK BSK1 at Ser230, which promotes BSK1
          binding to BSU1. The parallel RLCK CDG1 is phosphorylated by BRI1 and phosphorylates BSU1 Ser764.
        annotons:
          - id: bsk1_relay_kinase
            label: "BSK1: BR-signaling receptor-like cytoplasmic kinase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BSK1
                term:
                  id: UniProtKB:Q944A7
                  label: Serine/threonine-protein kinase BSK1
            function:
              preferred_term: protein kinase activity
              term:
                id: GO:0004672
                label: protein kinase activity
              evidence:
                - source_id: PMID:18653891
                  statement: BSKs are BRI1 substrates that activate downstream signalling.
                  supporting_text: >-
                    These results demonstrate that BSKs are the substrates of BRI1 kinase that activate
                    downstream BR signal transduction.
                - source_id: PMID:19734888
                  statement: Phosphorylated BSK1 binds BSU1.
                  supporting_text: >-
                    We show that phosphorylation of BSK1 (BR-signalling kinase 1) by the BR receptor
                    kinase BRI1 (BR-insensitive 1) promotes BSK1 binding to the BSU1 (BRI1 suppressor 1)
                    phosphatase
            processes:
              - preferred_term: brassinosteroid mediated signaling pathway
                term:
                  id: GO:0009742
                  label: brassinosteroid mediated signaling pathway
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Receives the receptor phosphorylation signal and recruits BSU1; kinase
              activity contribution is debated (possible pseudokinase scaffold).
    - order: 4
      role: GSK3 inactivation by tyrosine dephosphorylation
      node:
        id: bsu1_phosphatase
        label: BSU1 dephosphorylation of BIN2 pTyr200
        module_type: REGULATORY_STEP
        description: >-
          The Kelch-repeat PPP phosphatase BSU1, promoted by phosphorylated BSK1 and activated by CDG1
          phosphorylation of Ser764, dephosphorylates the conserved activation-loop pTyr200 of BIN2,
          inactivating the kinase. BSU1 does not effectively dephosphorylate BZR1/BES1 directly.
        annotons:
          - id: bsu1_ptp
            label: "BSU1: Kelch-repeat phosphatase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BSU1
                term:
                  id: UniProtKB:Q9LR78
                  label: Serine/threonine-protein phosphatase BSU1
            function:
              preferred_term: protein tyrosine phosphatase activity
              term:
                id: GO:0004725
                label: protein tyrosine phosphatase activity
              evidence:
                - source_id: PMID:19734888
                  statement: BSU1 dephosphorylates BIN2 pTyr200, inactivating it.
                  supporting_text: >-
                    BSU1 inactivates the GSK3-like kinase BIN2 (BR-insensitive 2) by dephosphorylating a
                    conserved phospho-tyrosine residue (pTyr 200)
            processes:
              - preferred_term: positive regulation of brassinosteroid mediated signaling pathway
                term:
                  id: GO:1900459
                  label: positive regulation of brassinosteroid mediated signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Removes the activating pTyr200 of BIN2 (and related GSK3s), switching
              BIN2 off.
    - order: 5
      role: GSK3 negative regulation of BZR transcription factors
      node:
        id: bin2_kinase
        label: BIN2 phosphorylation of BZR1/BES1
        module_type: REGULATORY_STEP
        description: >-
          Active BIN2 phosphorylates BZR1/BES1, inhibiting DNA binding and promoting 14-3-3 binding,
          nuclear export and degradation. BR also triggers KIB1-mediated degradation of BIN2.
        annotons:
          - id: bin2_gsk3
            label: "BIN2: GSK3/SHAGGY-like kinase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BIN2
                term:
                  id: UniProtKB:Q39011
                  label: Shaggy-related protein kinase eta
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              evidence:
                - source_id: PMID:12114546
                  statement: BIN2 binds and phosphorylates BZR1 and reduces its accumulation.
                  supporting_text: >-
                    BIN2 directly interacts with BZR1 in yeast two-hybrid assays, phosphorylates BZR1 in
                    vitro, and negatively regulates BZR1 protein accumulation in vivo.
            processes:
              - preferred_term: negative regulation of brassinosteroid mediated signaling pathway
                term:
                  id: GO:1900458
                  label: negative regulation of brassinosteroid mediated signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: Keeps BZR1/BES1 phosphorylated and inactive in the absence of BR.
    - order: 6
      role: transcriptional output
      node:
        id: bzr_transcription
        label: BZR1/BES1-mediated BR-responsive transcription
        module_type: REGULATORY_STEP
        description: >-
          Dephosphorylated BZR1 and BES1 accumulate in the nucleus and bind BRRE (CGTGT/CG) and E-box
          elements to repress BR biosynthetic genes and activate or repress growth-related genes.
        annotons:
          - id: bzr1_tf
            label: "BZR1: BZR-family transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BZR1
                term:
                  id: UniProtKB:Q8S307
                  label: Protein BRASSINAZOLE-RESISTANT 1
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
              evidence:
                - source_id: file:ARATH/BZR1/BZR1-ai-review.yaml
                  statement: BZR1 core function as BRRE-binding transcription factor.
            processes:
              - preferred_term: brassinosteroid mediated signaling pathway
                term:
                  id: GO:0009742
                  label: brassinosteroid mediated signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Represses BR biosynthetic genes (feedback) and regulates growth genes.
          - id: bes1_tf
            label: "BES1/BZR2: BZR-family transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: BES1
                term:
                  id: UniProtKB:Q9LN63
                  label: Protein BRASSINAZOLE-RESISTANT 2
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
              evidence:
                - source_id: PMID:15680330
                  statement: BES1 binds and activates BR target promoters, cooperating with BIM1.
                  supporting_text: >-
                    establish that BES1 is a transcription factor that binds to and activates BR target
                    gene promoters both in vitro and in vivo
            processes:
              - preferred_term: brassinosteroid mediated signaling pathway
                term:
                  id: GO:0009742
                  label: brassinosteroid mediated signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Activates BR-induced genes (with BIM1) and represses BR-repressed genes.
  connections:
    - source: receptor_inhibition
      target: receptor_activation
      connection_type: NEGATIVELY_REGULATES
      description: BKI1 binds the BRI1 kinase domain and limits BRI1-BAK1 association.
    - source: receptor_activation
      target: receptor_inhibition
      connection_type: NEGATIVELY_REGULATES
      description: Activated BRI1 phosphorylates BKI1, releasing it from the plasma membrane.
    - source: receptor_activation
      target: bsk_relay
      connection_type: POSITIVELY_REGULATES
      description: BRI1 phosphorylates BSK1 at Ser230 (and CDG1 at Ser234).
    - source: bsk_relay
      target: bsu1_phosphatase
      connection_type: POSITIVELY_REGULATES
      description: Phosphorylated BSK1 binds BSU1, promoting BSU1 action on BIN2 in vivo.
    - source: bsu1_phosphatase
      target: bin2_kinase
      connection_type: NEGATIVELY_REGULATES
      description: BSU1 dephosphorylates BIN2 pTyr200, inactivating the kinase.
    - source: bin2_kinase
      target: bzr_transcription
      connection_type: NEGATIVELY_REGULATES
      description: BIN2 phosphorylation of BZR1/BES1 inhibits DNA binding and promotes 14-3-3 binding,
        nuclear export and degradation.
