notes: >-
  Scope and generalization. Nickel urease and its UreD/UreF/UreG activation
  machinery are conserved across bacteria, archaea, plants and fungi, so the module
  is written species-neutrally. Concrete exemplars come from the classic
  experimental systems: Klebsiella aerogenes (three-chain biochemistry and
  structure), Helicobacter pylori (two-chain enzyme; UreG/UreF/UreH structure) and
  Arabidopsis thaliana (single-chain enzyme; UreD/UreF/UreG genetics and in-planta
  complex). Pseudomonas putida KT2440 is kept as a genomic exemplar, and
  Nitrososphaera viennensis ureC1 as an archaeal catalytic exemplar. scope is
  CONCRETE because every leaf is grounded to representative proteins; the
  lineage differences are modelled as variants of the structural part and as an
  optional UreE part, not as separate modules.

  Family grounding. The catalytic chain and the three accessory proteins are
  grounded to single-subfamily PANTHER families (PTHR43440:SF1, PTHR33643:SF1,
  PTHR33620:SF1, PTHR31715:SF0), each with a family review. The gamma and beta
  structural chains are left without a PANTHER id: PANTHER's PTHR33569 lumps them
  with fungal single-chain urease, which does not identify the role. UreE has no
  PANTHER family. The InterPro accessions for these roles are given in the
  descriptors' descriptions.

  Boundary. Nickel import (for example NikR-regulated transporters), urea
  transport (Helicobacter UreI), hydrogenase-shared nickel chaperones (HypA/HypB,
  which also feed urease in Helicobacter), regulation of urease expression, and
  assimilation of the released ammonia are inputs or consequences, not module
  parts. Fungal accessory-protein homologues (S. pombe UreD/UreF/UreG-like
  proteins) are PAINT seeds for the accessory families but are not grounded here.
