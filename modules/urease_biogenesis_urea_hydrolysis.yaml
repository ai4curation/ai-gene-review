                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: bacterial UreC alpha-subunit family
                        term:
                          id: PANTHER:PTHR43440:SF1
                          label: UREASE
                        representative_members:
                          - preferred_term: PSEPK UreC exemplar
                            term:
                              id: UniProtKB:Q88J04
                              label: Urease subunit alpha
                            description: Pseudomonas putida KT2440 ureC/PP_2845.
                    role: >-
                      Catalytic alpha chain that supplies the carbamylated
                      lysine and ligands of the dinickel active site after maturation.
                    evidence:
                      - source_id: PMID:8718850
                        statement: Structural analysis places the binickel active center in the alpha subunit.
                      - source_id: file:PSEPK/ureC/ureC-uniprot.txt
                        statement: Q88J04 is the reviewed nickel-binding UreC alpha subunit of PSEPK urease.
            role_description: >-
              Builds the preorganized UreABC apoprotein that is the client for
              UreDEFG-dependent metallocenter installation.
            evidence:
              - source_id: PMID:8718850
                statement: The apoenzyme retains the UreABC architecture but lacks carbamate and nickel at the active site.
                supporting_text: >-
                  With the exception of the active site, in which a water
                  molecule takes the place of the missing carbamate and nickel
                  atoms, the structure of the apoenzyme is nearly identical to
                  that of the holoenzyme, suggesting a high degree of
                  preorganization which helps explain the tight binding of nickel.
