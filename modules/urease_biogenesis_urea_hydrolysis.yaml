notes: >-
  Exact PSEPK representatives ground the reusable roles without making the
  module species-restricted. General nickel import and ammonia assimilation are
  inputs and consequences, respectively, rather than module parts.
knowledge_gaps:
  - gap_statement: >-
      Has urease activity or UreDEFG-dependent metallocenter assembly been
      measured directly for the PP_2842-PP_2849 locus in Pseudomonas putida KT2440?
    boundary: >-
      Current target assignments are based on reviewed UniProt rules, conserved
      family architecture, locus completeness, and mechanistic studies of
      orthologous bacterial urease systems.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
