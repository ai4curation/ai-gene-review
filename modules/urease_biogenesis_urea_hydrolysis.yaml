id: MODULE:urease_biogenesis_urea_hydrolysis
title: Three-subunit bacterial urease biogenesis and urea hydrolysis
description: >-
  A reusable bacterial module in which UreA, UreB, and UreC assemble the
  urease apoprotein, UreD, UreE, UreF, and UreG install the carbamylated
  dinickel metallocenter in a GTP-dependent activation process, and the mature
  urease complex hydrolyzes urea. The module covers the common three-chain
  bacterial UreABC implementation and its UreDEFG maturation system. It does
  not include general nickel uptake or homeostasis, urea transport, regulation
  of urease expression, or downstream assimilation of released ammonia.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:7909161
    title: In vitro activation of urease apoprotein and role of UreD as a chaperone required for nickel metallocenter assembly
    statement: >-
      Establishes the UreABC apoprotein and the requirement for UreD, UreE,
      UreF, and UreG in functional metallocenter assembly.
    supporting_text: >-
      The formation of active urease in Klebsiella aerogenes requires the
      presence of three structural genes for the apoprotein (ureA, ureB, and
      ureC), as well as four accessory genes (ureD, ureE, ureF, and ureG) that
      are involved in functional assembly of the metallocenter in this
      nickel-containing enzyme.
  - source_id: PMID:10500143
    title: GTP-dependent activation of urease apoprotein in complex with the UreD, UreF, and UreG accessory proteins
    statement: >-
      Establishes that UreG-dependent GTP hydrolysis activates the
      UreD-UreF-UreG-apourease complex at physiological bicarbonate.
    supporting_text: >-
      Based on studies involving a nonhydrolyzable analog of GTP, we conclude
      that nucleotide hydrolysis, not just binding, is required for this
      process.
  - source_id: PMID:8318889
    title: Purification and characterization of Klebsiella aerogenes UreE protein - a nickel-binding protein that functions in urease metallocenter assembly
    statement: Establishes UreE as a cytoplasmic nickel-binding donor for urease maturation.
    supporting_text: >-
      We hypothesize that UreE binds intracellular nickel ion and functions as
      a nickel donor during metallocenter assembly into the urease apoprotein.
