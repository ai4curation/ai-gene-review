                    evidence:
                      - source_id: file:PSEPK/ureA/ureA-uniprot.txt
                        statement: Q88J06 is the reviewed UreA gamma subunit of the PSEPK heterotrimer.
                  - id: ureB_beta_subunit
                    label: UreB beta structural subunit
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: bacterial UreB beta-subunit family
                        term:
                          id: InterPro:IPR002019
                          label: Urease, beta subunit
                        representative_members:
                          - preferred_term: PSEPK UreB exemplar
