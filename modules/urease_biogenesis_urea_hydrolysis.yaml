                      - preferred_term: phosphate
                  role_description: >-
                    Forms a nickel-loaded dimer at its invariant Cys-Pro-His motif
                    and hydrolyzes GTP to release the nickel into the urease active
                    site.
                  evidence:
                    - source_id: PMID:10500143
                      statement: A UreG nucleotide-site variant localized the GTP-hydrolysis requirement to UreG.
                    - source_id: PMID:24115911
                      statement: GTP hydrolysis returns the nickel-charged UreG dimer to monomer and releases nickel to urease.
                      supporting_text: >-
                        the nickel-charged UreG dimer, upon GTP hydrolysis, reverts to
                        its monomeric form and releases nickel to urease
        connections:
          - source: uredf_activation_scaffold
            target: ureg_nickel_delivery
            connection_type: CAUSES
            description: The UreD-UreF scaffold recruits UreG to the apoprotein and gates its nucleotide turnover.
          - source: uree_nickel_supply
            target: ureg_nickel_delivery
            connection_type: PROVIDES_INPUT_FOR
            description: In bacteria, UreE-bound nickel is transferred to UreG.
    - order: 3
      role: urea hydrolysis by mature urease
      node:
        id: mature_urease_hydrolysis
        label: Urea hydrolysis by mature urease
        module_type: REACTION
