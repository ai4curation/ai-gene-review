                  role_description: >-
                    Couples UreG recruitment and nucleotide turnover to
                    productive rather than adventitious metal incorporation.
                  evidence:
                    - source_id: PMID:22369361
                      statement: UreF interaction with UreG gates GTPase activity and maturation fidelity.
          - order: 2
