id: MODULE:urease_biogenesis_urea_hydrolysis
title: Nickel-dependent urease biogenesis and urea hydrolysis
description: >-
  Urease is a nickel metalloenzyme that hydrolyzes urea to ammonia and carbamate,
  which decomposes to a second ammonia and bicarbonate. Its catalytic unit (the
  alpha chain or alpha region) is assembled first as an inactive apoprotein. The
  apoprotein is built from three chains (UreA gamma, UreB beta, UreC alpha) in most
  bacteria, from two chains in Helicobacter (a fused gamma-beta UreA plus a UreB
  alpha chain), and from a single chain in plants and fungi. The active site, two
  nickel ions bridged by a carbamylated lysine, is installed after assembly. That
  activation is carried out by conserved accessory proteins: UreD (UreH in
  Helicobacter) binds the apoprotein and, with UreF, recruits the SIMIBI-class
  GTPase UreG. In bacteria, the nickel metallochaperone UreE supplies nickel to
  UreG, and GTP hydrolysis by UreG releases nickel into the active site. Plants and
  fungi use UreD, UreF and UreG but have no UreE. The mature enzyme then hydrolyzes
  urea. The module does not include nickel uptake or homeostasis, urea transport,
  regulation of urease gene expression, or assimilation of the released ammonia.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:7909161
    title: In vitro activation of urease apoprotein and role of UreD as a chaperone required for nickel metallocenter assembly
    statement: >-
      Establishes the UreABC apoprotein and the requirement for UreD, UreE,
      UreF, and UreG in functional metallocenter assembly.
    supporting_text: >-
      The formation of active urease in Klebsiella aerogenes requires the
      presence of three structural genes for the apoprotein (ureA, ureB, and
      ureC), as well as four accessory genes (ureD, ureE, ureF, and ureG) that
      are involved in functional assembly of the metallocenter in this
      nickel-containing enzyme.
  - source_id: PMID:10500143
    title: GTP-dependent activation of urease apoprotein in complex with the UreD, UreF, and UreG accessory proteins
    statement: >-
      Establishes that UreG-dependent GTP hydrolysis activates the
      UreD-UreF-UreG-apourease complex at physiological bicarbonate.
    supporting_text: >-
      Based on studies involving a nonhydrolyzable analog of GTP, we conclude
      that nucleotide hydrolysis, not just binding, is required for this
      process.
  - source_id: PMID:8318889
    title: Purification and characterization of Klebsiella aerogenes UreE protein - a nickel-binding protein that functions in urease metallocenter assembly
    statement: Establishes UreE as a cytoplasmic nickel-binding donor for urease maturation.
    supporting_text: >-
      We hypothesize that UreE binds intracellular nickel ion and functions as
      a nickel donor during metallocenter assembly into the urease apoprotein.
  - source_id: PMID:24115911
    title: Structure of UreG/UreF/UreH complex reveals how urease accessory proteins facilitate maturation of Helicobacter pylori urease
    statement: >-
      Extends the activation mechanism to the two-chain Helicobacter urease: UreF
      and UreH recruit UreG, and a nickel-charged UreG dimer releases nickel to
      urease upon GTP hydrolysis.
    supporting_text: >-
      UreF and UreH form a complex to recruit UreG, which is a SIMIBI class GTPase,
      to the preactivation complex.
  - source_id: PMID:16244137
    title: Identification of three urease accessory proteins that are required for urease activation in Arabidopsis
    statement: >-
      Extends the module to plants: single-chain plant urease needs UreD, UreF and
      UreG (no UreE), and the three are sufficient to activate plant urease when
      co-expressed in E. coli.
    supporting_text: >-
      urease activity was observed only when all three plant accessory
      genes were coexpressed together with the plant urease gene
  - source_id: PMID:28710280
    title: The assembly of the plant urease activation complex and the essential role of the urease accessory protein G (UreG) in delivery of nickel to urease
    statement: >-
      Shows that a urease-UreD-UreF-UreG activation complex assembles stepwise in
      plants and that UreG delivers nickel.
    supporting_text: >-
      we demonstrate that a
      urease-UreD-UreF-UreG complex exists in plants and show its stepwise assembly.
module:
  id: urease_biogenesis_urea_hydrolysis
  label: Nickel-dependent urease biogenesis and urea hydrolysis
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Assembly of the urease apoprotein (three-chain, two-chain or single-chain),
    UreD/UreF/UreG-dependent installation of the carbamylated dinickel site (with
    UreE nickel supply in bacteria), and hydrolysis of urea by the mature enzyme.
  concepts:
    - preferred_term: urea catabolic process
      term:
        id: GO:0043419
        label: urea catabolic process
  parts:
    - order: 1
      role: apo-urease structural assembly
      node:
        id: apo_urease_assembly
        label: Apo-urease structural assembly
        module_type: CELLULAR_COMPONENT
        description: >-
          The structural chains associate into the inactive, preorganized
          apoprotein before the active site is loaded with carbamate and nickel.
          The number of chains differs between lineages; the catalytic alpha
          chain or region is conserved in all of them.
        variant_sets:
          - id: urease_chain_architecture
            label: Urease chain architecture
            axis: subunit architecture (taxon-associated)
            selection: EXACTLY_ONE
            notes: >-
              Each urease is built on exactly one of these architectures. They
              differ only in how the gamma, beta and alpha regions are split
              across polypeptides; the catalytic alpha region and its dinickel
              ligands are the same in all three.
            variants:
              - id: three_chain_apourease
                label: Three-chain (UreA-UreB-UreC) apo-urease
                module_type: PROTEIN_COMPLEX
                description: >-
                  Most bacteria and archaea, including Klebsiella aerogenes and
                  Pseudomonas putida, make an (alpha-beta-gamma)3 urease.
                annotons:
                  - id: apo_urease_three_chain_complex
                    label: Three-chain apo-urease complex
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: three-chain apo-urease complex
                        term:
                          id: GO:0035550
                          label: urease complex
                        description: >-
                          Inactive UreABC complex lacking the carbamylated
                          dinickel active site. The GO complex term covers both
                          apo and mature assemblies.
                        active_units:
                          - id: ureA_gamma_subunit
                            label: UreA gamma structural subunit
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: urease gamma subunit (UreA)
                                description: >-
                                  InterPro IPR002026 (urease gamma/gamma-beta
                                  subunit). PANTHER puts the gamma and beta chains
                                  together with fungal single-chain urease in
                                  PTHR33569, which is too broad to identify this
                                  role, so no PANTHER id is asserted.
                                representative_members:
                                  - preferred_term: ureA (PSEPK)
                                    term:
                                      id: UniProtKB:Q88J06
                                      label: Urease subunit gamma
                                    description: Pseudomonas putida KT2440 ureA/PP_2843.
                                  - preferred_term: ureA (KLEAE)
                                    term:
                                      id: UniProtKB:P18316
                                      label: Urease subunit gamma
                                    description: Klebsiella aerogenes ureA.
                            role: >-
                              Structural gamma chain that contributes to the
                              assembled complex but does not catalyze urea
                              hydrolysis on its own.
                            evidence:
                              - source_id: PMID:7909161
                                statement: ureA is one of the three structural genes for the K. aerogenes apoprotein.
                          - id: ureB_beta_subunit
                            label: UreB beta structural subunit
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: urease beta subunit (UreB)
                                description: >-
                                  InterPro IPR002019 (urease beta subunit).
                                  PANTHER PTHR33569 is too broad for this role (see
                                  the gamma subunit), so no PANTHER id is asserted.
                                representative_members:
                                  - preferred_term: ureB (PSEPK)
                                    term:
                                      id: UniProtKB:Q88J05
                                      label: Urease subunit beta
                                    description: Pseudomonas putida KT2440 ureB/PP_2844.
                                  - preferred_term: ureB (KLEAE)
                                    term:
                                      id: UniProtKB:P18315
                                      label: Urease subunit beta
                                    description: Klebsiella aerogenes ureB.
                            role: >-
                              Structural beta chain that contributes to the
                              assembled complex but does not catalyze urea
                              hydrolysis on its own.
                            evidence:
                              - source_id: PMID:7909161
                                statement: ureB is one of the three structural genes for the K. aerogenes apoprotein.
                          - id: ureC_alpha_subunit
                            label: UreC alpha catalytic subunit
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: urease alpha subunit (UreC)
                                term:
                                  id: PANTHER:PTHR43440:SF1
                                  label: UREASE
                                representative_members:
                                  - preferred_term: ureC (PSEPK)
                                    term:
                                      id: UniProtKB:Q88J04
                                      label: Urease subunit alpha
                                    description: Pseudomonas putida KT2440 ureC/PP_2845.
                                  - preferred_term: ureC (KLEAE)
                                    term:
                                      id: UniProtKB:P18314
                                      label: Urease subunit alpha
                                    description: Klebsiella aerogenes ureC.
                            role: >-
                              Catalytic alpha chain that supplies the
                              carbamylated lysine and the ligands of the dinickel
                              active site after maturation.
                            evidence:
                              - source_id: PMID:8718850
                                statement: Structural analysis places the binickel active center in the alpha subunit.
                    role_description: >-
                      Builds the preorganized UreABC apoprotein that the
                      activation machinery acts on.
                    evidence:
                      - source_id: PMID:8718850
                        statement: The apoenzyme keeps the UreABC architecture but lacks carbamate and nickel at the active site.
                        supporting_text: >-
                          With the exception of the active site, in which a water
                          molecule takes the place of the missing carbamate and nickel
                          atoms, the structure of the apoenzyme is nearly identical to
                          that of the holoenzyme, suggesting a high degree of
                          preorganization which helps explain the tight binding of nickel.
              - id: two_chain_apourease
                label: Two-chain (fused gamma-beta UreA plus UreB alpha) apo-urease
                module_type: PROTEIN_COMPLEX
                description: >-
                  Helicobacter and related epsilonproteobacteria fuse the gamma and
                  beta regions into one chain, named UreA (UniProt "urease subunit
                  alpha"), and name the catalytic alpha chain UreB (UniProt "urease
                  subunit beta"). The names are swapped relative to the three-chain
                  enzyme; the catalytic chain is still the PTHR43440 member.
                annotons:
                  - id: apo_urease_two_chain_complex
                    label: Two-chain apo-urease complex
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: two-chain apo-urease complex
                        term:
                          id: GO:0035550
                          label: urease complex
                        active_units:
                          - id: helicobacter_ureA_gamma_beta
                            label: Fused gamma-beta structural subunit (Helicobacter UreA)
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: fused urease gamma-beta subunit
                                description: >-
                                  InterPro IPR002026 (urease gamma/gamma-beta
                                  subunit) family member that also carries the beta
                                  region. No PANTHER id is asserted, for the same
                                  reason as for the three-chain gamma subunit.
                                representative_members:
                                  - preferred_term: ureA (HELPY)
                                    term:
                                      id: UniProtKB:P14916
                                      label: Urease subunit alpha
                                    description: Helicobacter pylori 26695 ureA/HP_0073.
                            role: >-
                              Structural chain combining the gamma and beta regions;
                              it contributes to the complex but does not catalyze
                              urea hydrolysis.
                          - id: helicobacter_ureB_alpha
                            label: Catalytic alpha chain (Helicobacter UreB)
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: urease alpha chain (Helicobacter UreB)
                                term:
                                  id: PANTHER:PTHR43440:SF1
                                  label: UREASE
                                representative_members:
                                  - preferred_term: ureB (HELPY)
                                    term:
                                      id: UniProtKB:P69996
                                      label: Urease subunit beta
                                    description: Helicobacter pylori 26695 ureB/HP_0072.
                            role: >-
                              Catalytic chain carrying the dinickel site, with the
                              carbamylated lysine at Lys219.
                            evidence:
                              - source_id: PMID:24115911
                                statement: H. pylori urease maturation carbamylates Lys219 and inserts two nickel ions.
                                supporting_text: >-
                                  Maturation of urease involves carbamylation of
                                  Lys219 and insertion of two nickel ions at its active site.
                    role_description: >-
                      Builds the two-chain apoprotein that the Helicobacter
                      UreF/UreH/UreG machinery acts on.
              - id: single_chain_apourease
                label: Single-chain apo-urease (plants and fungi)
                module_type: PROTEIN_COMPLEX
                description: >-
                  Plant and fungal ureases are one polypeptide carrying the gamma,
                  beta and alpha regions in that order, assembled into
                  homo-oligomers.
                annotons:
                  - id: single_chain_apourease_chain
                    label: Single-chain apo-urease
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: single-chain urease
                        description: >-
                          PANTHER splits this architecture by lineage: plant
                          single-chain ureases fall in PTHR43440:SF1 with the
                          bacterial alpha subunits, and fungal ones, such as
                          S. pombe ure1, in PTHR33569:SF1 with the bacterial gamma
                          and beta subunits.
                        family_terms:
                          - id: PANTHER:PTHR43440:SF1
                            label: UREASE
                          - id: PANTHER:PTHR33569:SF1
                            label: UREASE
                        representative_members:
                          - preferred_term: URE (ARATH)
                            term:
                              id: UniProtKB:Q9SR52
                              label: Urease
                            description: Arabidopsis thaliana At1g67550.
                          - preferred_term: ure1 (SCHPO)
                            term:
                              id: UniProtKB:O00084
                              label: Urease
                            description: Schizosaccharomyces pombe ure1/SPAC1952.11c.
                    role_description: >-
                      Single polypeptide that supplies both the structural regions
                      and the catalytic dinickel region of the apoprotein that the
                      UreD/UreF/UreG machinery acts on.
                    evidence:
                      - source_id: PMID:16244137
                        statement: Arabidopsis has one structural urease gene, whose insertion mutants lack urease activity.
    - order: 2
      role: nickel delivery and GTP-dependent urease activation
      node:
        id: urease_metallocenter_activation
        label: Nickel delivery and GTP-dependent urease activation
        module_type: BIOLOGICAL_PROCESS
        description: >-
          UreD (UreH) and UreF form an activation platform on apo-urease that
          recruits UreG. UreG binds nickel, supplied in bacteria by UreE, and its
          GTP hydrolysis releases the nickel into the carbamylated active site.
        parts:
          - order: 1
            role: activation-complex recruitment to apo-urease
            node:
              id: uredf_activation_scaffold
              label: UreD-UreF activation scaffold formation
              module_type: PROTEIN_COMPLEX
              annotons:
                - id: ured_urease_scaffold
                  label: UreD/UreH apo-urease activation scaffold
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: urease accessory protein UreD/UreH
                      term:
                        id: PANTHER:PTHR33643:SF1
                        label: UREASE ACCESSORY PROTEIN D
                      representative_members:
                        - preferred_term: ureD (PSEPK)
                          term:
                            id: UniProtKB:Q88J07
                            label: Urease accessory protein UreD
                          description: Pseudomonas putida KT2440 ureD/PP_2842.
                        - preferred_term: ureD (KLEAE)
                          term:
                            id: UniProtKB:Q09063
                            label: Urease accessory protein UreD
                          description: Klebsiella aerogenes ureD.
                        - preferred_term: ureH (HELPY)
                          term:
                            id: UniProtKB:Q09067
                            label: Urease accessory protein UreH
                          description: Helicobacter pylori 26695 ureH/HP_0067, the UreD orthologue.
                        - preferred_term: URED (ARATH)
                          term:
                            id: UniProtKB:Q7Y0S0
                            label: Urease accessory protein D
                          description: Arabidopsis thaliana At2g35035.
                  function:
                    preferred_term: urease activator activity
                    term:
                      id: GO:0018237
                      label: urease activator activity
                  role_description: >-
                    Binds apo-urease and scaffolds recruitment of UreF and UreG,
                    promoting nickel incorporation into the active site.
                  evidence:
                    - source_id: PMID:7909161
                      statement: UreD binds urease apoprotein and is required for nickel incorporation.
                      supporting_text: >-
                        The UreD-urease apoprotein complexes are competent for
                        activation by nickel
                - id: uref_activation_checkpoint
                  label: UreF activation-complex component
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: urease accessory protein UreF
                      term:
                        id: PANTHER:PTHR33620:SF1
                        label: UREASE ACCESSORY PROTEIN F
                      representative_members:
                        - preferred_term: ureF (PSEPK)
                          term:
                            id: UniProtKB:Q88J01
                            label: Urease accessory protein UreF
                          description: Pseudomonas putida KT2440 ureF/PP_2848.
                        - preferred_term: ureF (KLEAE)
                          term:
                            id: UniProtKB:P18318
                            label: Urease accessory protein UreF
                          description: Klebsiella aerogenes ureF.
                        - preferred_term: ureF (HELPY)
                          term:
                            id: UniProtKB:Q09065
                            label: Urease accessory protein UreF
                          description: Helicobacter pylori 26695 ureF/HP_0069.
                        - preferred_term: UREF (ARATH)
                          term:
                            id: UniProtKB:Q9XHZ3
                            label: Urease accessory protein F
                          description: Arabidopsis thaliana At1g21840.
                  function:
                    preferred_term: urease activator activity
                    term:
                      id: GO:0018237
                      label: urease activator activity
                  role_description: >-
                    Docks UreG onto the UreD-apourease platform and couples UreG
                    nucleotide turnover to faithful, rather than adventitious,
                    metal incorporation.
                  evidence:
                    - source_id: PMID:22369361
                      statement: UreF interaction with UreG gates GTPase activity and maturation fidelity.
          - order: 2
            role: nickel supply by UreE (bacteria)
            optional: true
            notes: >-
              Optional because plants and fungi have no UreE. In bacteria UreE
              raises the efficiency of nickel delivery; in K. aerogenes,
              deleting ureE reduces activation in cell extracts but does not
              abolish it.
            node:
              id: uree_nickel_supply
              label: UreE nickel supply
              module_type: BIOLOGICAL_PROCESS
              annotons:
                - id: uree_nickel_metallochaperone
                  label: UreE nickel metallochaperone
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: urease accessory protein UreE
                      description: >-
                        InterPro IPR012406 (UreE urease accessory protein). PANTHER
                        has no UreE family, so no PANTHER id is asserted.
                      representative_members:
                        - preferred_term: ureE (PSEPK)
                          term:
                            id: UniProtKB:Q88J03
                            label: Urease accessory protein UreE
                          description: Pseudomonas putida KT2440 ureE/PP_2846.
                        - preferred_term: ureE (KLEAE)
                          term:
                            id: UniProtKB:P18317
                            label: Urease accessory protein UreE
                          description: Klebsiella aerogenes ureE.
                        - preferred_term: ureE (HELPY)
                          term:
                            id: UniProtKB:Q09064
                            label: Urease accessory protein UreE
                          description: Helicobacter pylori 26695 ureE/HP_0070.
