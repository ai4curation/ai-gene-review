                            id: UniProtKB:P18319
                            label: Urease accessory protein UreG
                          description: Klebsiella aerogenes ureG.
                        - preferred_term: ureG (HELPY)
                          term:
                            id: UniProtKB:Q09066
                            label: Urease accessory protein UreG
                          description: Helicobacter pylori 26695 ureG/HP_0068.
                        - preferred_term: UREG (ARATH)
                          term:
                            id: UniProtKB:O64700
                            label: Urease accessory protein G
                          description: Arabidopsis thaliana At2g34470.
                  function:
                    preferred_term: GTPase activity
                    term:
                      id: GO:0003924
                      label: GTPase activity
                    substrates:
                      - preferred_term: GTP
                      - preferred_term: water
                    products:
