                      term:
                        id: PANTHER:PTHR31715:SF0
                        label: UREASE ACCESSORY PROTEIN G
                      representative_members:
                        - preferred_term: ureG (PSEPK)
                          term:
                            id: UniProtKB:Q88J00
                            label: Urease accessory protein UreG
                          description: Pseudomonas putida KT2440 ureG/PP_2849.
                        - preferred_term: ureG (KLEAE)
