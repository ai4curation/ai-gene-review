                          - preferred_term: EPC2
                            term:
                              id: UniProtKB:Q52LR7
                              label: Enhancer of polycomb homolog 2
                    function:
                      preferred_term: chromatin-protein adaptor activity
                      term:
                        id: GO:0140463
                        label: chromatin-protein adaptor activity
                  - id: ing3
                    label: ING3 H3K4me3 reader
                    role: PHD-finger subunit that reads H3K4me3 and is required for robust nucleosomal acetylation by the core.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ING3
                        term:
                          id: UniProtKB:Q9NXR8
                          label: Inhibitor of growth protein 3
                    function:
                      preferred_term: histone H3K4me3 reader activity
                      term:
                        id: GO:0140002
                        label: histone H3K4me3 reader activity
