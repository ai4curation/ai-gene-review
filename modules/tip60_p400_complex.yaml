                  label: piccolo histone acetyltransferase complex
                active_units:
                  - id: kat5
                    label: KAT5 (TIP60) catalytic subunit
                    role: MYST-family lysine acetyltransferase; acetylates H4 K5, K8, K12 and K16, H2A, H2A.Z and H2AX in nucleosomes.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: KAT5 (TIP60)
                        term:
                          id: UniProtKB:Q92993
                          label: Histone acetyltransferase KAT5
                    function:
                      preferred_term: histone acetyltransferase activity
                      term:
                        id: GO:0004402
                        label: histone acetyltransferase activity
                  - id: epc1_epc2
                    label: EPC1 or EPC2 scaffold
                    role: Enhancer-of-polycomb scaffold; the EPcA domain bridges KAT5 and ING3 for nucleosomal acetylation, and the EPC1 C-terminus recruits the H4K20me reader MBTD1.
                    participant:
