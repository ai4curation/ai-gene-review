  connections:
    - source: piccolo_kat5_core
      target: ep400_atpase
      connection_type: POSITIVELY_REGULATES
      description: >-
        Acetylation of nucleosomal H2A and H4 by the KAT5 core stimulates H2A.Z exchange
        by EP400 in the same complex.
      evidence:
        - source_id: PMID:39260417
          statement: H2A.Z exchange by TIP60-C is much higher in the presence of acetyl-CoA.
          supporting_text: we observe much higher H2A.Z exchange activity when acetyl-CoA is present in the reaction mixture (Fig. 5d)
    - source: tip60_yl1
      target: ep400_atpase
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        YL1 holds the free H2A.Z-H2B dimer and hands it to the nucleosome engaged by the
        EP400 ATPase.
knowledge_gaps:
  - gap_statement: >-
      Whether the acetyltransferase and exchange activities of TIP60-C act on the same
      nucleosome in sequence in cells, and how far acetylation by KAT5 is required for
      EP400-dependent H2A.Z deposition at promoters versus double-strand breaks, is not
      established.
    gap_kind:
      - BIOLOGY
