id: MODULE:tip60_p400_complex
title: Human NuA4/TIP60-p400 complex (TIP60-C) — KAT5 acetylation of histones H4 and H2A by the piccolo core (KAT5, EPC1/EPC2, ING3, MEAF6) combined with EP400-driven exchange of H2A-H2B for H2A.Z-H2B on the RUVBL1-RUVBL2 ring with YL1 (VPS72), plus the actin module, TRRAP and the MRG15-MRGBP-BRD8 reader module; EP400/KAT5/TRRAP/EPC1/EPC2/ING3/MEAF6/MORF4L1/MORF4L2/MRGBP/BRD8/DMAP1/YEATS4/VPS72/ACTL6A/ACTB/RUVBL1/RUVBL2
description: >-
  The human TIP60 complex (TIP60-C, also called NuA4/TIP60 or TIP60-p400) is a
  supercomplex of about twenty subunits that carries two chromatin-modifying
  activities which budding yeast splits between the NuA4 acetyltransferase and the
  SWR1 remodeler. Its MYST-family acetyltransferase KAT5 (TIP60), held in a piccolo
  core with EPC1 or EPC2, ING3 and MEAF6, acetylates nucleosomal histone H4 (K5, K8, K12,
  K16) and H2A, as well as H2A.Z and H2AX. Its SNF2-family ATPase EP400 (p400) exchanges
  canonical H2A-H2B dimers for H2A.Z-H2B, using the same RUVBL1-RUVBL2 hexamer, the
  H2A.Z chaperone YL1 (VPS72) and the actin module (ACTL6A, actin, DMAP1) as the SRCAP
  complex; the ARP6 and ZNHIT1 subunits of SRCAP are absent. EP400 is the scaffold that
  joins the SWR1-like and NuA4-like parts. The large PIKK-family protein TRRAP is a
  flexibly tethered platform that binds transcriptional activators, and acetyl- and
  methyl-histone readers (GAS41/YEATS4, ING3, BRD8 and the MRG15/MRGX-MRGBP module) bind
  modified chromatin. Acetylation of the nucleosome by the complex stimulates its own
  H2A.Z exchange activity. TIP60-C acts in transcriptional activation and in the repair
  of DNA double-strand breaks.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001339
    title: chromatin remodeling pathway
    statement: >-
      RGD's chromatin remodeling pathway groups ATP-dependent remodelers into four
      families (SWI/SNF, INO80 (SWR1), ISWI and CHD). This module models the p400
      (EP400) branch of the INO80/SWR1 family, which in humans is fused with the NuA4
      acetyltransferase. RGD curates EP400, KAT5, TRRAP, EPC1, EPC2, ING3, MEAF6,
      MORF4L1, MORF4L2, MRGBP, BRD8, DMAP1, YEATS4, VPS72, ACTL6A, ACTB, RUVBL1 and RUVBL2
      to PW:0001339; all eighteen are modelled. Derived through
      projects/RGD_PATHWAY_ONTOLOGY (pathways/PW_0001339.yaml).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001339.yaml
    statement: RGD's pathway text names the four ATP-dependent remodeler families.
    supporting_text: 'The four families/complexes are: SWI/SNF, INO80(SWRI), ISWI and CHD.'
  - source_id: GO:0006338
    title: chromatin remodeling
    statement: >-
      The GO process mapped to PW:0001339 (skos:closeMatch, from the PW definition
      cross-reference and a label match, projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml).
      It is the process of the EP400 exchange annoton.
  - source_id: GO:0035267
    title: NuA4 histone acetyltransferase complex
    statement: >-
      The GO complex term for TIP60-C; the subunits carry IDA rows for it in human GOA
      (PMID:14966270, PMID:27153538).
  - source_id: GO:0032777
    title: piccolo histone acetyltransferase complex
    statement: GO complex term for the KAT5-EPC1-ING3 (with MEAF6) acetyltransferase core.
  - source_id: PMID:39260417
    title: Structure of the human TIP60-C histone exchange and acetyltransferase complex.
    statement: >-
      Cryo-EM structure of endogenous TIP60-C: the two enzymatic activities, SWR1-like
      and NuA4-like parts joined by the EP400 scaffold, and a TRRAP activator-binding
      module.
    supporting_text: In humans, the TIP60-EP400 complex (TIP60-C) is a 20-subunit assembly that affects chromatin structure through two enzymatic activities
  - source_id: PMID:14966270
    title: Structural and functional conservation of the NuA4 histone acetyltransferase complex from yeast to humans.
    statement: >-
      Purification of human NuA4 complexes with KAT5 (Tip60) and identification of the
      conserved subunits; the human complex as a fusion of yeast NuA4 and SWR1.
    supporting_text: This raises the possibility that the human NuA4 complex is functionally equivalent to a fusion of two distinct complexes in yeast, one harboring HAT activity and the other involved in ATP-dependent chromatin remodeling.
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001339 (chromatin remodeling pathway)
  through the RGD_PATHWAY_ONTOLOGY project. PW:0001339 has no diagram genes and curates
  74 human genes spanning all four SNF2 remodeler families, so the project models one
  human module per complex group. This module is the p400 (EP400) group, which in
  humans is inseparable from the NuA4 acetyltransferase. The sister module
  srcap_h2az_deposition models the SRCAP complex, which performs the same H2A.Z
  exchange without an acetyltransferase; INO80, BAF/PBAF, ISWI and CHD/NuRD complexes
  are drafted separately. RGD genes modelled here: EP400, KAT5, TRRAP, EPC1, EPC2, ING3,
  MEAF6, MORF4L1, MORF4L2, MRGBP, BRD8, DMAP1, YEATS4, VPS72, ACTL6A, ACTB, RUVBL1 and
  RUVBL2. The shared subunits RUVBL1-RUVBL2, VPS72, the ACTL6A-actin-DMAP1 module and
  YEATS4 are written identically in this module and in srcap_h2az_deposition. EPC1/EPC2
  and MORF4L1/MORF4L2 are modelled as paralogue families whose members occupy the same
  position in alternative complexes (a protein highly related to EPC1 co-purifies with
  human NuA4, PMID:14966270; MRG15 and MRGX both co-purify with MRGBP, PMID:12963728).

  Molecular functions were taken from each subunit's experimental GOA rows in QuickGO
  (November 2026). KAT5 carries histone acetyltransferase activity (EXP rows), ING3 its
  H3K4me3 reader activity (IDA), EPC1 chromatin-protein adaptor activity (IDA,
  PMID:32209463), VPS72 histone chaperone activity (IMP), YEATS4 H3K27ac reader activity
  (IDA) and RUVBL1/RUVBL2 ATP hydrolysis activity (EXP/IDA). Functions authored without
  an experimental human GOA row: EP400 has no experimental molecular-function row (only
  bare protein binding and IBA chromatin binding); its ATP-dependent H2AZ histone
  chaperone activity is authored from the structural and biochemical characterisation
  of TIP60-C (PMID:39260417), and matches the SRCAP annoton of the sister module. The
  EPC1/EPC2 family annoton carries the EPC1 function; EPC2 has no experimental
  molecular-function row. The piccolo complex annoton carries histone acetyltransferase
  activity, the activity reconstituted by KAT5-EPC1-ING3 (PMID:14966270). MEAF6, the
  MORF4L1/MORF4L2 family, MRGBP, BRD8, TRRAP, ACTL6A, actin and DMAP1 are units without a
  function: MEAF6 has only contributes_to acetyltransferase rows, which are represented
  by the complex-level function; BRD8 and TRRAP have transcription coactivator and
  coregulator rows, which describe the context rather than a step of this module
  (decision 2); the others have no informative experimental molecular function in human
  GOA.

  Boundary decisions. (1) H2A.Z is the target, not a part. As in
  srcap_h2az_deposition, H2AZ1 and H2AZ2 are the cargo of the exchange (and a substrate
  of KAT5); the near-stoichiometric H2A.Z-H2B dimer in purified TIP60-C (PMID:39260417)
  is a loaded intermediate held by VPS72. By the substrate-versus-participant rule and the
  comparator check (no human or yeast H2A.Z is annotated part_of NuA4 or Swr1 complex
  in GOA; all are part_of nucleosome), H2A.Z appears only as cargo and target. (2) DNA
  repair and transcription-factor coactivation are context, not parts. KAT5 functions
  that act on non-histone substrates (ATM, p53 and many others), the MBTD1-dependent
  competition with 53BP1 and H2AK15 acetylation at double-strand breaks (modelled in
  atm_dsb_signaling), and coactivation of MYC, p53, nuclear receptors (BRD8) and Notch
  through TRRAP are outside this module; so are the related 2-hydroxyisobutyryl-,
  crotonyl-, butyryl- and lactyltransferase activities of KAT5. (3) Subunits not on the
  RGD list are not added: MBTD1 (H4K20me reader recruited by EPC1, PMID:27153538) and the
  EP400-related EP400NL complex are named only. ANP32E, which removes H2A.Z and associates
  with the p400/TIP60 complex (PMID:24463511), acts in the opposite direction and is
  excluded. (4) The SWR1-like and NuA4-like parts are modelled as one module because
  they are a single complex in humans: EP400 traverses both parts and the YL1 C-terminal
  domain glues them (PMID:39260417). The piccolo core, reader module and TRRAP are parts of
  the same complex. (5) INO80, which shares RUVBL1, RUVBL2 and ACTL6A, is modelled by
  another module; the SAGA complex, which shares TRRAP, is out of scope. (6) Human GOA
  annotates EP400, KAT5, TRRAP, ING3 and BRD8 part_of Swr1 complex (IDA, PMID:24463511);
  that reflects the H2A.Z-exchange activity of TIP60-C rather than a separate SRCAP-type
  complex and is recorded as an observation, not used here. PANTHER family ids and PTNs
  are deliberately not asserted.

  GO-CAM links. gomodel:617b481400000672 (KAT5 chromatin localization) models KAT5
  histone acetyltransferase and H4K16 acetyltransferase activities on chromatin; both are
  linked to the KAT5 unit. gomodel:617b481400000460 (KAT5 in homologous recombination;
  the seed's best_gocam lead) models KAT5 histone H2A acetyltransferase activity and
  EPC1 chromatin-protein adaptor activity in DSB repair; the EPC1 adaptor activity is
  linked to the EPC1/EPC2 annoton, while the KAT5 H2AK15 activity is already linked from
  atm_dsb_signaling and is left there because its context is out of scope here.
  gomodel:617b481400000793 (KAT5 autoacetylation) and the other KAT5 models concern
  non-histone substrates and are not linked. Observation for upstream review: in
  gomodel:617b481400000460 one KAT5 activity is typed bare protein binding (GO:0005515).
module:
  id: tip60_p400_complex
  label: Human NuA4/TIP60-p400 complex
  module_type: PROTEIN_COMPLEX
  description: >-
    TIP60-C, combining KAT5 histone H4/H2A acetylation with EP400-driven H2A.Z-H2B
    exchange in one supercomplex.
  concepts:
    - preferred_term: NuA4 histone acetyltransferase complex
      term:
        id: GO:0035267
        label: NuA4 histone acetyltransferase complex
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: chromatin
        term:
          id: GO:0000785
          label: chromatin
  parts:
    - order: 1
      role: SNF2-family exchange ATPase and scaffold (SWR1-like part)
      node:
        id: ep400_atpase
        label: EP400 ATPase
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: ep400_exchange_atpase
            label: EP400 exchanges H2A-H2B for H2A.Z-H2B
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EP400 (p400)
                term:
                  id: UniProtKB:Q96L91
                  label: E1A-binding protein p400
            function:
              preferred_term: ATP-dependent H2AZ histone chaperone activity
              term:
                id: GO:0140849
                label: ATP-dependent H2AZ histone chaperone activity
              cargo:
                - preferred_term: histone H2A.Z (H2AZ1)-H2B dimer
                  term:
                    id: UniProtKB:P0C0S5
                    label: Histone H2A.Z
                - preferred_term: histone H2A.V (H2AZ2)-H2B dimer
                  term:
                    id: UniProtKB:Q71UI9
                    label: Histone H2A.V
              targets:
                - preferred_term: canonical H2A-containing nucleosome
                  description: The H2A-H2B dimer of the nucleosome is evicted and replaced by H2A.Z-H2B.
            processes:
              - preferred_term: chromatin remodeling
                term:
                  id: GO:0006338
                  label: chromatin remodeling
            role_description: >-
              The 400-kDa SWR1-family ATPase. Its ATPase sits on the RUVBL1-RUVBL2
              hexamer with an insertion projecting into the ring; its HSA helix binds the
              actin module and continues into the SWR1-like part, and a second
              counter-helix crosses back, so EP400 is the scaffold that joins all three
              lobes of the complex. Its N-terminal region binds the MRG15-MRGBP-BRD8
              reader module. The authored function has no experimental human GOA row.
            evidence:
              - source_id: PMID:39260417
                statement: EP400 contains the ATPase that drives H2A.Z incorporation, and forms the scaffold of the three-lobed complex.
                supporting_text: The huge EP400 subunit contains the ATPase motor, traverses the junction between SWR1L and NuA4L twice and constitutes the scaffold of the three-lobed architecture.
              - source_id: PMID:39260417
                statement: TIP60-C exchanges H2A-H2B for H2A.Z-H2B in an ATP-dependent manner.
                supporting_text: 'two enzymatic activities: ATP-dependent exchange of histone H2A-H2B for H2A.Z-H2B, and histone acetylation'
    - order: 2
      role: AAA+ ATPase ring (SWR1-like part)
      node:
        id: tip60_ruvbl_ring
        label: RUVBL1-RUVBL2 ring
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: ruvbl1_ruvbl2_hexamer
            label: RUVBL1-RUVBL2 heterohexameric AAA+ ATPase ring
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: RUVBL1-RUVBL2 heterohexamer
                active_units:
                  - id: ruvbl1
                    label: RUVBL1 (TIP49a, pontin)
                    stoichiometry: '3'
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RUVBL1
                        term:
                          id: UniProtKB:Q9Y265
                          label: RuvB-like 1
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
                  - id: ruvbl2
                    label: RUVBL2 (TIP49b, reptin)
                    stoichiometry: '3'
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RUVBL2
                        term:
                          id: UniProtKB:Q9Y230
                          label: RuvB-like 2
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
            role_description: >-
              Three RUVBL1-RUVBL2 heterodimers form the hexameric head of the
              SWR1-type exchange machinery. The insertion between the two lobes of the
              SNF2-family ATPase (SRCAP or EP400) threads into the ring, which anchors
              the H2A.Z-H2B chaperone VPS72 and the ATPase C-lobe. The ring is a
              structural hub in this context; its own ATP hydrolysis is measured in
              vitro, but no step of histone exchange is known to be driven by it. The
              same hexamer is also a subunit of INO80 and of the R2TP chaperone, which
              are outside this module.
            evidence:
              - source_id: PMID:30337683
                statement: In the SRCAP complex the hexameric RUVBL1-RUVBL2 ring forms the head that the SRCAP insert associates with.
                supporting_text: The head consists of a single hexameric ring formed by three copies of RUVBL1-RUVBL2 heterodimer
              - source_id: PMID:39260417
                statement: In TIP60-C the same hexamer forms the core of the SWR1-like part, bound by the EP400 ATPase C-lobe and its insertion.
                supporting_text: The SWR1L subcomplex is dominated by a hetero-hexameric core of the RuvBL1 and RuvBL2 subunits as found in yeast8 (Fig. 1b).
    - order: 3
      role: H2A.Z-H2B chaperone and bridge between the two parts
      node:
        id: tip60_yl1
        label: YL1 (VPS72) H2A.Z-H2B chaperone
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: vps72_h2az_chaperone
            label: VPS72 (YL1) holds the H2A.Z-H2B dimer for deposition
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: VPS72 (YL1)
                term:
                  id: UniProtKB:Q15906
                  label: Vacuolar protein sorting-associated protein 72 homolog
            function:
              preferred_term: histone chaperone activity
              term:
                id: GO:0140713
                label: histone chaperone activity
              cargo:
                - preferred_term: histone H2A.Z (H2AZ1)-H2B dimer
                  term:
                    id: UniProtKB:P0C0S5
                    label: Histone H2A.Z
                - preferred_term: histone H2A.V (H2AZ2)-H2B dimer
                  term:
                    id: UniProtKB:Q71UI9
                    label: Histone H2A.V
            role_description: >-
              The Swc2-family subunit shared by SRCAP-C and TIP60-C. Its N-terminal
              domain binds the H2A.Z-H2B dimer specifically, through the extended
              acidic patch and the DNA-binding surface of the dimer, and holds it on
              the complex before it is transferred into the nucleosome. A long
              extended region then intercalates into the RUVBL1-RUVBL2 ring, and in
              TIP60-C a C-terminal domain bridges the SWR1-like and NuA4-like parts by
              binding DMAP1.
            evidence:
              - source_id: PMID:26974126
                statement: YL1 is a specific H2A.Z-deposition chaperone that recognises the H2A.Z-H2B dimer (crystal structure of human YL1-H2A.Z-H2B).
                supporting_text: Here, we identify YL1 as a specific H2A.Z-deposition chaperone.
              - source_id: PMID:39260417
                statement: In TIP60-C the N-terminal domain of YL1/VPS72 holds the H2A.Z-H2B dimer before deposition.
                supporting_text: The N-terminal domain of the YL1/VPS72 subunit holds the H2A.Z–H2B dimer before its deposition into the nucleosome (Fig. 2a).
              - source_id: PMID:15647280
                statement: YL1 was identified as a shared subunit of the TRRAP/TIP60 HAT complex and of the SRCAP complex.
                supporting_text: YL1 is also a component of a novel mammalian multiprotein complex that includes the SNF2-related helicase SRCAP
    - order: 4
      role: actin module and acetyl-histone reader
      node:
        id: tip60_actin_module
        label: ACTL6A-actin-DMAP1 module and GAS41
        module_type: PROTEIN_COMPLEX
        annotons:
          - id: actin_module_actl6a_actb_dmap1
            label: Actin module (ACTL6A, beta-actin, DMAP1) on the ATPase HSA helix
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: ACTL6A-actin-DMAP1 actin module
                active_units:
                  - id: actl6a
                    label: ACTL6A (BAF53A; Arp4 homologue)
                    role: Actin-related protein bound with actin to the HSA helix of the SNF2-family ATPase.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ACTL6A
                        term:
                          id: UniProtKB:O96019
                          label: Actin-like protein 6A
                  - id: actb
                    label: Beta-actin (nuclear actin)
                    role: Monomeric actin bound with ACTL6A to the HSA helix.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ACTB
                        term:
                          id: UniProtKB:P60709
                          label: Actin, cytoplasmic 1
                  - id: dmap1
                    label: DMAP1 (Swc4/Eaf2 homologue)
                    role: SANT-domain subunit that envelops the actin module and contacts VPS72.
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: DMAP1
                        term:
                          id: UniProtKB:Q9NPF5
                          label: DNA methyltransferase 1-associated protein 1
            role_description: >-
              The actin module binds the helicase-SANT-associated (HSA) helix of the
              ATPase (SRCAP or EP400). It is a structural subassembly; none of its
              three subunits has an experimental molecular function in human GOA that
              describes its role here, so the units carry no function. The same
              ACTL6A and actin subunits are also part of BAF/PBAF and INO80, which are
              separate modules. Actin is represented by beta-actin (ACTB), the actin
              that RGD lists; the structures do not distinguish beta- from
              gamma-actin.
            evidence:
              - source_id: PMID:30337683
                statement: SRCAP-C comprises ten subunits, with an N module of ACTL6A, actin, DMAP1 and GAS41.
                supporting_text: an N module containing ACTL6A, ACTIN, DMAP1 and GAS41
              - source_id: PMID:39260417
                statement: In TIP60-C the actin module comprises actin, ACTL6A and DMAP1 on the EP400 HSA helix.
                supporting_text: In TIP60-C, the actin module, which comprises two ARPs (actin and actin-like protein 6A (ACL6A)), the DMAP1 subunit
          - id: yeats4_acetyl_reader
            label: YEATS4 (GAS41) reads acetylated histone H3
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: YEATS4 (GAS41)
                term:
                  id: UniProtKB:O95619
                  label: YEATS domain-containing protein 4
            function:
              preferred_term: histone H3K27ac reader activity
              term:
                id: GO:0140119
                label: histone H3K27ac reader activity
            role_description: >-
              Yaf9-family YEATS-domain subunit shared by SRCAP-C and TIP60-C. Its
              YEATS domain binds acetylated H3K18 and H3K27 (both carry IDA reader rows
              in human GOA; the H3K27ac term is used here), and the coiled-coil dimer
              binds di-acetylated H3 with higher affinity. It is flexibly attached and
              is not resolved in the TIP60-C structure. Reading acetylated chromatin is
              proposed to help target H2A.Z exchange to acetylated promoter
              nucleosomes.
            evidence:
              - source_id: PMID:30071723
                statement: The GAS41 YEATS domain binds acetylated H3 peptides and prefers H3K18ac and H3K27ac.
                supporting_text: the YEATS domain of GAS41 binds acetylated histone peptides with moderate, mid-micromolar affinities, and preferentially recognizes acetylated H3K18 and H3K27
              - source_id: PMID:30337683
                statement: GAS41 is in the N module of SRCAP-C.
                supporting_text: an N module containing ACTL6A, ACTIN, DMAP1 and GAS41
    - order: 5
      role: histone acetyltransferase core (NuA4-like part)
      node:
