      description: >-
        Fructose-6-P + glutamine + acetyl-CoA + UTP -> UDP-GlcNAc (four committed steps).
        Also covers the NAGK salvage of free GlcNAc into the pathway where that branch
        exists; the former concept GO:0006047 UDP-N-acetylglucosamine metabolic process is
        obsolete (replaced by GO:0006048).
  context:
