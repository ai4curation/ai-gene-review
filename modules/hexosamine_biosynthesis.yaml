      description: The GlcN-6-P made by GFAT is N-acetylated by GNA1/GNPNAT1.
      chaining_status: NOT_APPLICABLE
      chaining_note: Glucosamine 6-phosphate links the steps; no CoA carrier is passed on.
    - source: glcn6p_acetylation
