id: MODULE:hexosamine_biosynthesis
title: Eukaryotic hexosamine biosynthesis and GlcNAc salvage
description: >-
  A reusable eukaryotic pathway that converts fructose 6-phosphate to
  UDP-N-acetylglucosamine through glutamine-dependent amination, acetyl-CoA-
  dependent N-acetylation, phosphomutase conversion, and UTP-dependent
  uridylyl transfer, all catalysed by soluble cytosolic enzymes. The
  eukaryotic order (N-acetylation of glucosamine 6-phosphate before the
  6-phosphate to 1-phosphate mutase step) differs from the bacterial route,
  in which glucosamine 6-phosphate is first isomerised to the 1-phosphate and
  then acetylated and uridylylated by a bifunctional enzyme. In animals and
  some other eukaryotes a GlcNAc-kinase salvage branch enters at the
  N-acetylglucosamine 6-phosphate intermediate. Feedback inhibition of the
  first, glutamine-dependent amidotransferase by UDP-GlcNAc couples pathway
  flux to nutrient availability and glycosylation demand. The product supplies
  protein N-glycosylation, GPI-anchor synthesis, chitin synthesis in fungi,
  proteoglycan synthesis and O-GlcNAcylation in animals, and the sialic-acid
  route.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: YeastPathways:UDPNAGSYN-YEAST-PWY
    title: UDP-N-acetylglucosamine biosynthesis (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=UDPNAGSYN-YEAST-PWY
    statement: >-
      YeastCyc lists L-GLN-FRUCT-6-P-AMINOTRANS-RXN (GFA1),
      GLUCOSAMINEPNACETYLTRANS-RXN (GNA1), PHOSACETYLGLUCOSAMINEMUT-RXN (PCM1)
      and NAG1P-URIDYLTRANS-RXN (QRI1). All four gene assignments were
      retained; no salvage kinase is listed for S. cerevisiae.
  - source_id: GO:0006048
    title: UDP-N-acetylglucosamine biosynthetic process
    statement: The four de novo steps carry out UDP-GlcNAc biosynthesis (GO:0006048).
  - source_id: GO:0006047
    title: UDP-N-acetylglucosamine metabolic process
    statement: NAGK salvages free GlcNAc into the UDP-GlcNAc metabolic pathway (GO:0006047).
  - source_id: PMID:16408321
    title: Enzymes of UDP-GlcNAc biosynthesis in yeast.
    statement: >-
      Review of the four-step cytoplasmic UDP-GlcNAc pathway in
      Saccharomyces cerevisiae and Candida albicans.
    supporting_text: The glucosamine-containing sugar nucleotide UDP-GlcNAc is synthesized in yeast cells in a four-step cytoplasmic pathway.
  - source_id: PMID:2656689
    title: Cloning of the glutamine:fructose-6-phosphate amidotransferase gene from yeast. Pheromonal regulation of its transcription.
    statement: GFA1 encodes the yeast L-glutamine:D-fructose-6-phosphate amidotransferase.
  - source_id: PMID:9867860
    title: Saccharomyces cerevisiae GNA1, an essential gene encoding a novel acetyltransferase involved in UDP-N-acetylglucosamine synthesis.
    statement: >-
      GNA1 encodes glucosamine-6-phosphate acetyltransferase; with Agm1p
      (PCM1) and Uap1p (QRI1) it converts glucosamine 6-phosphate to
      UDP-GlcNAc, and the yeast acetyltransferase and pyrophosphorylase are
      separate essential genes rather than the fused bacterial GlmU.
    supporting_text: These results indicate that YFL017C specifies glucosamine-6-phosphate acetyltransferase; therefore, the gene was designated GNA1 (glucosamine-6-phosphate acetyltransferase).
  - source_id: PMID:8174553
    title: Characterization of the essential yeast gene encoding N-acetylglucosamine-phosphate mutase.
    statement: AGM1 (PCM1) is the essential structural gene for N-acetylglucosamine-phosphate mutase.
  - source_id: PMID:9603950
    title: The eukaryotic UDP-N-acetylglucosamine pyrophosphorylases. Gene cloning, protein expression, and catalytic mechanism.
    statement: >-
      Yeast UAP1 (QRI1), Candida albicans and human UAP1 encode
      UDP-GlcNAc pyrophosphorylase; the mutase reaction precedes uridyl
      transfer in eukaryotes.
    supporting_text: These results demonstrate that the UAP1 genes  indeed specify eukaryotic UDP-GlcNAc pyrophosphorylase and that phosphomutase  reaction precedes uridyltransfer.
  - source_id: file:human/GFPT1/GFPT1-ai-review.yaml
    title: GFPT1 gene review (human)
    statement: The rate-limiting Fru-6-P + Gln -> GlcN-6-P step (UniProtKB:Q06210, GO:0004360) matches the completed human GFPT1 review.
  - source_id: file:human/GFPT2/GFPT2-ai-review.yaml
    title: GFPT2 gene review (human)
    statement: The Fru-6-P + Gln -> GlcN-6-P step (UniProtKB:O94808, GO:0004360) matches the completed human GFPT2 review.
  - source_id: file:human/GNPNAT1/GNPNAT1-ai-review.yaml
    title: GNPNAT1 gene review (human)
    statement: The GlcN-6-P -> GlcNAc-6-P acetylation step (UniProtKB:Q96EK6, GO:0004343) matches the completed human GNPNAT1 review.
  - source_id: file:human/PGM3/PGM3-ai-review.yaml
    title: PGM3 gene review (human)
    statement: The GlcNAc-6-P <-> GlcNAc-1-P mutase step (UniProtKB:O95394, GO:0004610) matches the completed human PGM3 review.
  - source_id: file:human/UAP1/UAP1-ai-review.yaml
    title: UAP1 gene review (human)
    statement: The GlcNAc-1-P + UTP -> UDP-GlcNAc step (UniProtKB:Q16222, GO:0003977) matches the completed human UAP1 review.
  - source_id: file:human/NAGK/NAGK-ai-review.yaml
    title: NAGK gene review (human)
    statement: The GlcNAc salvage kinase step (UniProtKB:Q9UJ70, GO:0045127) matches the completed human NAGK review.
module:
