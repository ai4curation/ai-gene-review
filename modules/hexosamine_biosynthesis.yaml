        term:
          id: NCBITaxon:2759
          label: Eukaryota
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: The represented biosynthetic and salvage reactions are carried out by soluble cytosolic enzymes.
  gocam_associations:
    - model: gomodel:YeastPathways_UDPNAGSYN-YEAST-PWY
      title: 'UDP-N-acetylglucosamine biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with GFA1 (GO:0004360), GNA1 (GO:0004343), PCM1
