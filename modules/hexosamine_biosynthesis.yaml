      connection_type: PRECEDES
      description: The GlcNAc-1-P made by PCM1/PGM3 is the substrate for QRI1/UAP1.
      chaining_status: NOT_APPLICABLE
      chaining_note: N-acetylglucosamine 1-phosphate links the steps; no CoA carrier is involved.
    - source: glcnac_salvage
      target: glcnac_mutase
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        NAGK feeds salvaged GlcNAc-6-P into the pathway at the mutase step (the same node GNA1/GNPNAT1
        produces), recycling free GlcNAc from glycoconjugate degradation into UDP-GlcNAc.
  notes: >-
    ALIGN (YeastPathways project, 2026-10): the human-grounded module was kept
    at eukaryotic scope and gained S. cerevisiae (GFA1 P14742, GNA1 P43577,
    PCM1 P38628, QRI1 P43123) and S. pombe (gfa1 Q09740, gna1 O13738, the two
    phosphoacetylglucosamine mutase paralogs SPAC13C5.05c Q09687 and
    SPAC1296.01c Q09770, uap1 O94617) exemplars; every yeast protein falls in
    the same PANTHER family as the human representative (PTHR10937,
    PTHR13355, PTHR45955, PTHR11952). YeastCyc gene assignments for
    UDPNAGSYN-YEAST-PWY are correct and complete for the four de novo steps.
    The NAGK salvage branch is now marked optional because neither the SGD
    nor the PomBase model contains a GlcNAc kinase; S. cerevisiae cannot use
    exogenous GlcNAc. GO-CAM agreement: both yeast models place all four
    activities in cytosol with the same MF terms used here; the PomBase model
    additionally includes pgi1 (glucose-6-phosphate isomerase, glycolysis)
    upstream, which is outside this module. Connections were converted to
    PRECEDES for the de novo chain. UDP-GlcNAc is the amino-sugar donor for
    the n_glycan_llo_assembly_cytoplasmic module (ALG7/DPAGT1 and
    ALG13/ALG14), chitin synthesis, GPI anchors and, in animals,
    O-GlcNAcylation and sialic-acid synthesis. Bacteria use a different order
    (GlmS, GlmM mutase on glucosamine 6-phosphate, then bifunctional GlmU
    acetyltransferase/uridylyltransferase), which is a separate pathway
    realization, not a variant of this eukaryotic chain. Notable moonlighting
    captured in the human gene reviews (kept non-core here): UAP1
    protein-serine pyrophosphorylase (IRF3, type-I-IFN) and NAGK
    muramyl-dipeptide kinase (NOD2). Disorders: GFPT1 CMS12, GNPNAT1
    rhizomelic skeletal dysplasia, PGM3-CDG.
  knowledge_gaps:
    - gap_statement: >-
        Schizosaccharomyces pombe encodes two phosphoacetylglucosamine mutase
