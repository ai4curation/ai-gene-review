id: MODULE:phage_bpp1_dgr_tropism_switching
title: Bordetella phage BPP-1 diversity-generating retroelement (DGR) adenine-mutagenic reverse transcription, Mtd C-type lectin receptor tropism switching, and podoviral portal genome delivery
description: 'A prototype diversity-generating retroelement (DGR) and adaptive host-recognition module exemplified by the
  short-tailed temperate podovirus Bordetella phage BPP-1 (NCBITaxon:2885909). As its bacterial host Bordetella bronchiseptica
  alternates between virulent (Bvg+) and avirulent (Bvg-) phase-variable cell-surface repertoires via the BvgAS two-component
  system, BPP-1 uses a self-contained retroelement cassette (mtd-avd-TR-brt) to diversify its distal tail fiber receptor-binding
  protein Mtd across >10^13 possible sequences without altering its structural scaffold. The pathway operates across three
  stages: (1) Adenine-mutagenic RNA-templated cDNA synthesis and target-primed retrohoming, in which the DGR reverse transcriptase
  Brt (bRT) complexes with a homopentameric barrel of the accessory variability determinant Avd and binds structured cis-acting
  DGR RNA flanking the invariant 134-bp template repeat (TR); the 2''-hydroxyl of internal spacer ribonucleotide SpA56 acts
  as the covalent primer for branched cDNA synthesis across TR while the bRT catalytic pocket selectively misincorporates
  dNTPs opposite template adenines, and the resulting adenine-mutagenized cDNA-RNA hybrid homes to the 3'' variable region
  (VR1) of mtd via the 21-bp IMH (initiation of mutagenic homing) element; (2) Multivalent host receptor engagement and tropism
  switching via the pyramid-shaped homotrimeric Mtd protein positioned as bilobed globules at the distal tips of the six phage
  tail fibers, whose C-terminal C-type lectin (CLec) fold scaffold presents 12 hypervariable surface-exposed residues per
  protomer (36 per trimer) to bind phase-variable outer-membrane receptors such as the autotransporter pertactin (Prn); and
  (3) Short-tail podoviral genome packaging and ejection through the dodecameric portal vertex ring formed by Bbp21 (gp21)
  at the unique 5-fold icosahedral capsid vertex.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:14973019
  title: Genomic and genetic analysis of Bordetella bacteriophages encoding reverse transcriptase-mediated tropism-switching
    cassettes.
  statement: Complete 42.4-kb genome sequence and genetic dissection of Bordetella phage BPP-1 establishing the roles of brt,
    mtd, avd, the template repeat (TR), and the portal-head morphogenesis locus (including bbp21).
- source_id: PMID:15386016
  title: Tropism switching in Bordetella bacteriophage defines a family of diversity-generating retroelements.
  statement: Defines the diversity-generating retroelement (DGR) family and demonstrates unidirectional, adenine-specific
    mutagenic homing from the invariant TR RNA to the mtd variable region (VR) directed by the IMH element.
- source_id: PMID:39779855
  title: RNA control of reverse transcription in a diversity-generating retroelement.
  statement: Cryo-EM structures of the BPP-1 bRT-Avd-RNA ribonucleoprotein holoenzyme showing how structured DGR RNA positions
    spacer adenosine SpA56 for 2'-OH-primed branched cDNA synthesis and modulates adenine fidelity.
- source_id: PMID:16170324
  title: The C-type lectin fold as an evolutionary solution for massive sequence variation.
  statement: Crystal structures of five BPP-1 Mtd tropism variants showing that a conserved intertwined homotrimer and C-type
    lectin (CLec) fold scaffold present 12 hypervariable residues in a static receptor-binding cleft without perturbing backbone
    geometry.
- source_id: PMID:20160083
  title: Three-dimensional structure of tropism-switching Bordetella bacteriophage.
  statement: Cryo-EM single-particle and cryo-ET subtomogram reconstructions of the BPP-1 virion localizing Mtd trimers to
    the bilobed distal tips of the six tail fibers and resolving the 12-fold portal-tail vertex.
- source_id: GO:0098678
  title: viral tropism switching
  statement: Defines the active diversification or switching of viral host-receptor specificity.
- source_id: GO:0006278
  title: RNA-templated DNA biosynthetic process
  statement: Defines reverse transcription of an RNA template into complementary DNA.
notes: 'Exemplar phage: Bordetella phage BPP-1 (NCBITaxon:2885909). Generalizes across bacteriophage, prophage, bacterial,
  and archaeal diversity-generating retroelements (DGRs, >1,500 identified across Caudoviricetes, Bacteroidota, Cyanobacteria,
  Firmicutes, and CPR/DPANN lineages) that pair an error-prone bRT-Avd reverse transcriptase ribonucleoprotein with a C-type
  lectin (CLec) or Ig-like variable target protein.'
