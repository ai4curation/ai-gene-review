  knowledge_gaps:
  - gap_statement: While the cryo-EM structure of the BPP-1 bRT-Avd-RNA holoenzyme has resolved 2'-OH-primed branched cDNA
      initiation at SpA56, the downstream host and/or phage enzymatic steps that cleave the recipient mtd VR1 target strand
      at the 21-bp IMH element and integrate the mutagenized cDNA into the replicating phage chromosome remain incompletely
      reconstituted in vitro; furthermore, GO lacks a dedicated molecular function term for mutagenic RNA-directed DNA polymerase
      activity or DGR accessory protein (Avd) RNA-chaperone activity.
    boundary: Map Brt to GO:0003964 (RNA-directed DNA polymerase activity), GO:0006278 (RNA-templated DNA biosynthetic process),
      and GO:0098678 (viral tropism switching); Mtd to GO:0098671 (adhesion receptor-mediated virion attachment to host cell)
      and GO:0098678; and Bbp21 to GO:0099002 (symbiont genome ejection through host cell envelope, short tail mechanism).
