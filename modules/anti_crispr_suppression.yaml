id: MODULE:anti_crispr_suppression
title: Anti-CRISPR suppression of host CRISPR-Cas immunity
description: >-
  A reusable counter-defence module for suppression of a host CRISPR-Cas system
  by proteins encoded by phages, prophages, and other mobile genetic elements.
  Anti-CRISPR (Acr) proteins are small, unrelated in sequence, and act by
  mechanism rather than by homology, so the module is decomposed by the step of
  the host pathway each class attacks: blockade of crRNA-guided target
  recognition, neutralisation of the effector nuclease, and enzymatic
  destruction of a CRISPR component or signal. A fourth, optional part covers
  the Aca autoregulatory switch that limits acr transcription once the host
  system is disabled. The host pathway itself is the separate module
  MODULE:crispr_cas_adaptive_immunity; general phage counter-defence against
  restriction-modification, and host-encoded self-regulators such as the Crn
  ring nucleases, are outside the boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0098672
    title: symbiont-mediated suppression of host CRISPR-cas system
    statement: >-
      GO:0098672 supplies the module boundary and is the term GOA uses for the
      characterised Acr exemplars cited here.
  - source_id: PMID:23242138
    title: Bacteriophage genes that inactivate the CRISPR/Cas bacterial immune system.
    statement: >-
      First identification of phage-encoded genes that inactivate a host
      CRISPR-Cas system, establishing anti-CRISPR as a distinct functional class.
  - source_id: PMID:26416740
    title: Multiple mechanisms for CRISPR-Cas inhibition by anti-CRISPR proteins.
    statement: >-
      Biochemical and in vivo analysis of three anti-CRISPR proteins showing that
      each inhibits CRISPR-Cas activity through a distinct mechanism. This is the
      direct justification for decomposing the module by mechanism rather than by
      family.
  - source_id: PMID:31428783
    title: The autoregulator Aca2 mediates anti-CRISPR repression.
    statement: >-
      Establishes the Aca autoregulatory part: acr genes are co-transcribed with
      a dedicated repressor that shuts the locus down after an initial burst.
  - source_id: file:BPZF4/AcrF8/AcrF8-ai-review.yaml
    title: AcrF8 gene review
    statement: >-
      The curated review of the type I-F inhibitor AcrF8 (H9C181) supplies the
      target-recognition-blockade exemplar and its GO:0098672 assignment.
notes: >-
  Boundary decisions. First, mechanism is the right decomposition axis because
  Acr families share no sequence relationship: AcrIF8, AcrIIA4, and AcrVA1 are
  unrelated proteins, and only their point of attack is comparable. Second,
  enzymatic Acrs are kept as a separate part from stoichiometric blockers
  because the distinction is functional, not cosmetic -- a blocker must be
  present in molar excess of its target, while an enzyme can act catalytically
  and sub-stoichiometrically. Third, the host-encoded Crn1/Crn2 ring nucleases
  (for example UniProtKB:Q97YD2 and UniProtKB:Q7LYJ6) are deliberately excluded:
  they degrade the same cyclic oligoadenylate signal as the viral AcrIII-1
  nuclease does, but as self-regulation of the host's own response rather than
  as symbiont-mediated suppression, so they belong to the host module.
  Fourth, no connection is drawn to the host module's nodes because connections
  are document-scoped; each part names its host target in prose instead.
module:
  id: anti_crispr_suppression
  label: anti-CRISPR suppression of host CRISPR-Cas immunity
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: symbiont-mediated suppression of host CRISPR-cas system
      term:
        id: GO:0098672
        label: symbiont-mediated suppression of host CRISPR-cas system
      description: >-
        Inhibition or disruption of a host CRISPR-Cas system by a symbiont,
        here a phage or other mobile genetic element.
  context:
    taxa:
      - preferred_term: viruses
        term:
          id: NCBITaxon:10239
          label: Viruses
        description: >-
          Characterised Acrs are encoded by bacteriophages, archaeal viruses,
          and the prophages and other mobile elements derived from them.
    cellular_components:
      - preferred_term: host cell cytoplasm
        term:
          id: GO:0030430
          label: host cell cytoplasm
        description: >-
          Acrs are translated from the injected or integrated element genome and
          act on host Cas machinery in the host cytoplasm.
  parts:
    - order: 1
      role: Blockade of crRNA-guided target recognition
      node:
        id: recognition_blockade
        label: target-recognition blockade
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The most common mechanism: the Acr binds the crRNA-loaded surveillance
          complex or single effector and prevents it from engaging target DNA,
          either by occluding the DNA-binding and PAM-reading surfaces or by
          contacting the crRNA itself. The effector's nuclease chemistry is left
          intact; it simply never reaches a substrate.
        variant_sets:
          - id: recognition_blockade_mechanism
            label: recognition-blockade implementation
            axis: blocked surface and host effector class
            selection: ONE_OR_MORE
            notes: >-
              A single phage genome commonly encodes several of these against
              one host system, so ONE_OR_MORE rather than EXACTLY_ONE.
            variants:
              - id: csy_complex_blocker_variant
                label: Type I-F Csy complex blockade
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  Acrs that bind the multi-subunit type I-F surveillance (Csy)
                  complex. AcrIF8 is distinctive in contacting the crRNA as well
                  as the Cas7f backbone, so the blockade does not depend on
                  protein-surface recognition alone.
                annotons:
                  - id: acrif8_csy_blocker
                    label: AcrIF8 Csy complex and crRNA-contacting blocker
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: AcrF8 (AcrIF8) anti-CRISPR family
                        term:
                          id: InterPro:IPR057730
                          label: Anti-CRISPR protein AcrF8
                        representative_members:
                          - preferred_term: ZF40_0031 / acrIF8 (Pectobacterium phage ZF40)
                            term:
                              id: UniProtKB:H9C181
                              label: Anti-CRISPR protein AcrF8
                            description: >-
                              The 92-residue inhibitor curated in
                              genes/BPZF4/AcrF8.
                    function:
                      preferred_term: ribonucleoprotein complex binding
                      term:
                        id: GO:0043021
                        label: ribonucleoprotein complex binding
                      targets:
                        - preferred_term: host type I-F Csy surveillance complex (Cas7f backbone and crRNA)
                      evidence:
                        - source_id: PMID:32170016
                          statement: >-
                            Cryo-EM shows AcrIF8 residues within hydrogen-bonding
                            distance of crRNA nucleobases as well as of the Cas7f
                            backbone, so the inhibitor engages both components of
                            the ribonucleoprotein.
                        - source_id: file:BPZF4/AcrF8/AcrF8-ai-review.yaml
                          statement: >-
                            The curated review assigns GO:0043021 for this dual
                            protein-plus-crRNA binding and GO:0098672 for the
                            suppression process.
                    processes:
                      - preferred_term: symbiont-mediated suppression of host CRISPR-cas system
                        term:
                          id: GO:0098672
                          label: symbiont-mediated suppression of host CRISPR-cas system
                    role_description: >-
                      Occupies the Csy complex so that R-loop formation on target
                      DNA cannot proceed; blockade is stoichiometric and requires
                      the inhibitor in excess of the complex.
                  - id: acrif2_csy_blocker
                    label: AcrIF2-family Csy complex blocker
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: AcrF2 anti-CRISPR family
                        term:
                          id: InterPro:IPR057728
                          label: Anti-CRISPR protein AcrF2
                        representative_members:
                          - preferred_term: orf30 / gp30 (Pseudomonas phage D3112)
                            term:
                              id: UniProtKB:Q6TM72
                              label: Anti-CRISPR protein 30
                            description: >-
                              One of the first anti-CRISPR genes identified, in
                              the type I-F system of Pseudomonas aeruginosa.
                    processes:
                      - preferred_term: symbiont-mediated suppression of host CRISPR-cas system
                        term:
                          id: GO:0098672
                          label: symbiont-mediated suppression of host CRISPR-cas system
                      - preferred_term: symbiont-mediated suppression of host adaptive immune response
                        term:
                          id: GO:0039504
                          label: symbiont-mediated suppression of host adaptive immune response
                    evidence:
                      - source_id: PMID:23242138
                        statement: >-
                          Identified among the first phage genes shown to
                          inactivate a host CRISPR-Cas system.
                      - source_id: GO:0098672
                        statement: >-
                          GOA records Q6TM72 as involved_in GO:0098672 and
                          GO:0039504.
                    role_description: >-
                      Binds the Csy complex and prevents target DNA engagement;
                      no molecular function is asserted here because the
                      specific blocked surface is not established from the local
                      evidence.
              - id: cas9_dna_mimicry_variant
                label: Type II Cas9 PAM-site occlusion and DNA mimicry
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  Acrs that inhibit Cas9 by presenting an acidic, DNA-like
                  surface to the PAM-recognition machinery, competitively
                  occupying the site that the target duplex would occupy.
                annotons:
                  - id: acriia4_dna_mimic
                    label: AcrIIA4 PAM-duplex mimic
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: AcrIIA4-like anti-CRISPR family
                        term:
                          id: InterPro:IPR056215
                          label: Anti-CRISPR Suppressor AcrIIA4-like
                        representative_members:
                          - preferred_term: acrIIA4 (Listeria monocytogenes prophage)
                            term:
                              id: UniProtKB:A0A247D711
                              label: Anti-CRISPR protein AcrIIA4
                            description: >-
                              The 87-residue prophage-encoded SpyCas9 inhibitor
                              used widely as an off-switch reagent.
                    function:
                      preferred_term: DNA mimicry-based competitive occlusion of the Cas9 PAM-recognition site
                      description: >-
                        Deliberately carries no GO id. The activity is
                        competitive occupancy of a nucleic-acid-binding site by
                        a protein that structurally mimics DNA; GO has no term
                        for it, and a binding term would lose the mimicry that
                        is the mechanism. See knowledge_gaps.
                      targets:
                        - preferred_term: host Cas9 PAM-interacting domain
                        - preferred_term: host Cas9 RuvC non-target-strand cleavage pocket
                      evidence:
                        - source_id: PMID:28602637
                          statement: >-
                            The crystal structure of AcrIIA4 bound to
                            sgRNA-loaded SpyCas9 shows it preferentially targets
                            residues essential for PAM duplex recognition and
                            blocks target DNA access to the RuvC pocket,
                            competitively occupying both.
                        - source_id: PMID:28041849
                          statement: >-
                            Prophage-encoded AcrIIA proteins inhibit SpyCas9 in
                            Listeria and in human cells, establishing the
                            inhibition in vivo.
                    processes:
                      - preferred_term: symbiont-mediated suppression of host CRISPR-cas system
                        term:
                          id: GO:0098672
                          label: symbiont-mediated suppression of host CRISPR-cas system
                    role_description: >-
                      Prevents Cas9 from licensing a target at all, acting
                      upstream of both nuclease domains; because the mimicked
                      surface is the PAM duplex, inhibition is largely
                      guide-independent.
                  - id: acriia2_dna_mimic
                    label: AcrIIA2 DNA-mimicking Cas9 inhibitor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: LP101_024 / acrIIA2 (Listeria phage LP-101)
                        term:
                          id: UniProtKB:A0A059T5F6
                          label: Anti-CRISPR protein AcrIIA2
                        description: >-
                          A second, unrelated Listeria-phage Cas9 inhibitor that
                          converges on the same PAM-recognition surface.
                    processes:
                      - preferred_term: symbiont-mediated suppression of host CRISPR-cas system
                        term:
                          id: GO:0098672
                          label: symbiont-mediated suppression of host CRISPR-cas system
                    evidence:
                      - source_id: PMID:30606466
                        statement: >-
                          Structural analysis presents AcrIIA2 inhibition as DNA
                          mimicry, making it an independent instance of the same
                          mechanism as AcrIIA4.
                    role_description: >-
                      Included as the convergence case: two sequence-unrelated
                      prophage proteins inhibit the same enzyme by mimicking its
                      substrate, which is the evidence that mechanism, not
                      family, is the reusable unit.
    - order: 2
      role: Neutralisation of the effector nuclease
      node:
        id: nuclease_neutralisation
        label: effector-nuclease neutralisation
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Acrs that leave target recognition intact and instead disable the
          nuclease that would destroy the target -- by sequestering a
          separately-recruited nuclease, or by blocking a catalytic domain of a
          single effector. These Acrs act downstream of the ones in part 1.
        variant_sets:
          - id: nuclease_neutralisation_mechanism
            label: nuclease-neutralisation implementation
            axis: neutralised nuclease and mode of inactivation
            selection: ONE_OR_MORE
            variants:
              - id: cas3_sequestration_variant
                label: Type I Cas3 sequestration
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  The mechanism available only against class 1 systems, where the
                  nuclease is a separate protein: the Acr binds Cas3 and keeps it
                  from being recruited to the R-loop, so the surveillance complex
                  finds its target but nothing degrades it.
                annotons:
                  - id: acrif3_cas3_sequestration
                    label: AcrF3 Cas3 sequestering inhibitor
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: protein sequestering activity
                        term:
                          id: GO:0140311
                          label: protein sequestering activity
                      family:
                        preferred_term: AcrF3-like Cas3 inhibitor family
                        term:
                          id: InterPro:IPR049085
                          label: Cas3 inhibitor AcrF3-like
                        representative_members:
                          - preferred_term: JBD5_035 / acrIF3 (Pseudomonas phage JBD5)
                            term:
                              id: UniProtKB:L7P7R7
                              label: Phage protein
                            description: >-
                              InterPro assigns this JBD5 protein to the AcrF3-like
                              Cas3 inhibitor family; UniProt has not yet given it
                              a mechanism-bearing name.
                    function:
                      preferred_term: protein sequestering activity
                      term:
                        id: GO:0140311
                        label: protein sequestering activity
                      targets:
                        - preferred_term: host type I-F Cas3 helicase-nuclease
                      evidence:
                        - source_id: PMID:27455460
                          statement: >-
                            The AcrF3-Cas3 structure establishes that inhibition
                            works by binding Cas3 directly and preventing its
                            recruitment to the Cascade-bound target.
                        - source_id: PMID:26416740
                          statement: >-
                            One of the three mechanistically distinct inhibitors
                            characterised in this work, and the one that acts on
                            the nuclease rather than the surveillance complex.
                    processes:
                      - preferred_term: symbiont-mediated suppression of host CRISPR-cas system
                        term:
                          id: GO:0098672
                          label: symbiont-mediated suppression of host CRISPR-cas system
                    role_description: >-
                      Holds Cas3 away from the licensed R-loop; this mechanism
                      has no counterpart against class 2 systems, where
                      recognition and cleavage are in one protein.
              - id: cas9_hnh_blockade_variant
                label: Type II-C Cas9 HNH-domain blockade
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  The class 2 equivalent of nuclease neutralisation: the Acr
                  binds the HNH catalytic domain of Cas9, permitting target
                  binding but preventing cleavage. Because the HNH fold is
                  conserved, this class inhibits Cas9 orthologues broadly.
                annotons:
                  - id: acriic1_hnh_blocker
                    label: AcrIIC1 broad-spectrum Cas9 HNH inhibitor
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: AcrIIC1 anti-CRISPR family
                        term:
                          id: InterPro:IPR064626
                          label: Anti-CRISPR type II subtype C1
                        representative_members:
                          - preferred_term: acrIIC1 (Neisseria meningitidis prophage)
                            term:
                              id: UniProtKB:A0A2D0TCG3
                              label: Anti-CRISPR protein
                            description: >-
                              The AcrIIC1 inhibitor of type II-C Cas9
                              orthologues.
                    function:
                      preferred_term: enzyme inhibitor activity directed at the Cas9 HNH nuclease domain
                      description: >-
                        No GO id asserted: the activity is occlusion of a
                        catalytic domain within a multidomain nuclease, leaving
                        DNA binding intact, and no GO molecular-function term
                        captures that. See knowledge_gaps.
                      targets:
                        - preferred_term: host Cas9 HNH nuclease domain
                      evidence:
                        - source_id: PMID:28844692
                          statement: >-
                            Characterised as a broad-spectrum Cas9 inhibitor that
                            acts by binding the conserved HNH domain, which is
                            why its inhibition generalises across Cas9
                            orthologues.
                        - source_id: GO:0098672
                          statement: >-
                            GOA records A0A2D0TCG3 against GO:0098672.
                    processes:
                      - preferred_term: symbiont-mediated suppression of host CRISPR-cas system
                        term:
                          id: GO:0098672
                          label: symbiont-mediated suppression of host CRISPR-cas system
                    role_description: >-
                      Traps a DNA-bound but catalytically silent Cas9; the
                      inhibited complex still occupies its target, which
                      distinguishes this mechanism from the DNA mimics of part 1.
    - order: 3
      role: Enzymatic destruction of a CRISPR component or signal
      node:
        id: enzymatic_subversion
        label: enzymatic subversion
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The mechanistically distinct minority: Acrs that are themselves
          enzymes and destroy a CRISPR component or messenger catalytically.
          Unlike every mechanism above, these do not need to be present in
          excess of their target, which makes them effective at low expression.
        variant_sets:
          - id: enzymatic_subversion_mechanism
            label: enzymatic-subversion implementation
            axis: destroyed substrate
            selection: ONE_OR_MORE
            variants:
              - id: crrna_cleavage_variant
                label: Guide-RNA destruction
                module_type: REACTION
                description: >-
                  An Acr with ribonuclease activity that cleaves the crRNA out of
                  the effector, disarming it irreversibly rather than occupying
                  it.
                annotons:
                  - id: acrva1_crrna_nuclease
                    label: AcrVA1 crRNA-cleaving inhibitor of Cas12a
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: RNA endonuclease activity
                        term:
                          id: GO:0004521
                          label: RNA endonuclease activity
                      family:
                        preferred_term: AcrVA1-like anti-CRISPR family
                        term:
                          id: InterPro:IPR064663
                          label: Anti-CRISPR type V subtype A1-like
                        representative_members:
                          - preferred_term: acrVA1 (Moraxella bovoculi)
                            term:
                              id: UniProtKB:A0A5H1ZR47
                              label: AcrVA1
                            description: >-
                              The Moraxella AcrVA1 inhibitor of Cas12a
                              orthologues.
                    function:
                      preferred_term: RNA endonuclease activity
                      term:
                        id: GO:0004521
                        label: RNA endonuclease activity
                      substrates:
                        - preferred_term: Cas12a-bound crRNA guide
                      products:
                        - preferred_term: truncated crRNA unable to license target recognition
                      evidence:
                        - source_id: PMID:30936531
                          statement: >-
                            AcrVA1 inhibits Cas12a broadly and enzymatically,
                            which is the basis for separating catalytic Acrs from
                            stoichiometric blockers.
                    processes:
                      - preferred_term: symbiont-mediated suppression of host CRISPR-cas system
                        term:
                          id: GO:0098672
                          label: symbiont-mediated suppression of host CRISPR-cas system
                    role_description: >-
                      Destroys the guide rather than the enzyme, leaving an
                      apo-effector; a single inhibitor molecule can disarm many
                      effectors.
              - id: coa_signal_degradation_variant
                label: Cyclic oligoadenylate signal degradation
                module_type: REACTION
                description: >-
                  The counter-defence specific to type III systems, which do not
                  rely on direct nuclease recruitment but on a cOA second
                  messenger. A viral ring nuclease degrades the messenger, so the
                  accessory ribonucleases are never switched on.
                annotons:
                  - id: acriii1_ring_nuclease
                    label: AcrIII-1 viral cyclic oligoadenylate ring nuclease
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: AcrIII-1 / DUF1874-family viral ring nuclease
                        term:
                          id: InterPro:IPR015055
                          label: STIV B116-like
                        description: >-
                          The DUF1874 family (InterPro STIV B116-like) in which
                          the viral anti-CRISPR ring nuclease activity was
                          identified; members are widespread in archaeal viruses
                          and some bacteriophages.
                        representative_members:
                          - preferred_term: 114 (Sulfolobus islandicus rod-shaped virus 1)
                            term:
                              id: UniProtKB:Q8QL27
                              label: Uncharacterized protein 114
                            description: >-
                              A reviewed SIRV1 member of the family, named as an
                              uncharacterised protein in UniProt; it orients the
                              family without asserting that this particular
                              accession is the assayed protein.
                    function:
                      preferred_term: cyclic oligoadenylate ring nuclease activity
                      description: >-
                        No GO id asserted: GO has no term for cleavage of a
                        cyclic oligoadenylate second messenger, the mirror image
                        of the missing cOA synthase term in the host module. See
                        knowledge_gaps.
                      substrates:
                        - preferred_term: cyclic tetra-adenylate (cA4)
                      products:
                        - preferred_term: linear adenylate products that no longer activate CARF ribonucleases
                      evidence:
                        - source_id: PMID:31942067
                          statement: >-
                            A virus-encoded ring nuclease degrades the cyclic
                            oligoadenylate signal produced by Cas10, subverting
                            type III immunity without touching the effector
                            complex.
                    processes:
                      - preferred_term: symbiont-mediated suppression of host CRISPR-cas system
                        term:
                          id: GO:0098672
                          label: symbiont-mediated suppression of host CRISPR-cas system
                    role_description: >-
                      Attacks the signalling layer rather than the recognition or
                      cleavage machinery, which is possible only against the
                      messenger-based type III architecture.
    - order: 4
      role: Aca-mediated autoregulation of the acr locus
      optional: true
      node:
        id: aca_autoregulation
        label: Aca autoregulatory switch
        module_type: REGULATORY_STEP
        description: >-
          acr genes are typically co-transcribed with a small helix-turn-helix
          anti-CRISPR-associated (aca) repressor that binds the shared promoter
          and shuts the locus down. The result is a burst of Acr early in
          infection, when the host system must be neutralised, followed by
          repression -- avoiding the cost of sustained high-level expression.
          Because the repressor is transcribed from the very promoter it
          represses, this is genuine negative feedback on the acr locus rather
          than external regulation. This part is optional because not every
          characterised acr locus has an identified aca gene.
        annotons:
          - id: aca2_repressor
            label: Aca2 anti-CRISPR-associated repressor
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: DNA-binding transcription repressor activity
                term:
                  id: GO:0001217
                  label: DNA-binding transcription repressor activity
              family:
                preferred_term: Aca2/YdiL-like anti-CRISPR-associated repressor family
                term:
                  id: InterPro:IPR015060
                  label: Aca2/YdiL-like
                representative_members:
                  - preferred_term: ZF40_0030 / aca2 (Pectobacterium phage ZF40)
                    term:
                      id: UniProtKB:H9C180
                      label: Aca2 repressor
                    description: >-
                      The repressor co-transcribed with acrIF8 in the same phage,
                      which is why the regulatory part and the
                      recognition-blockade part share an exemplar locus.
            function:
              preferred_term: DNA-binding transcription repressor activity
              term:
                id: GO:0001217
                label: DNA-binding transcription repressor activity
              targets:
                - preferred_term: shared aca2-acr promoter operator
              evidence:
                - source_id: PMID:31428783
                  statement: >-
                    Aca2 binds its own promoter region and represses the
                    co-transcribed anti-CRISPR gene, establishing the
                    autoregulatory negative-feedback loop.
                - source_id: GO:0003677
                  statement: >-
                    GOA records H9C180 as enabling GO:0003677 DNA binding,
                    consistent with the lambda-repressor-like DNA-binding domain
                    InterPro assigns it.
            processes:
              - preferred_term: negative regulation of DNA-templated transcription
                term:
                  id: GO:0045892
                  label: negative regulation of DNA-templated transcription
            role_description: >-
              Times the counter-defence rather than executing it; the repressor
              is not itself an inhibitor of any Cas protein.
  connections:
    - source: recognition_blockade
      target: aca_autoregulation
      connection_type: CAUSES
      description: >-
        Closes the feedback loop: aca2 is co-transcribed with the acr gene from
        the shared promoter, so expressing the inhibitor necessarily produces
        the repressor that will switch the locus off.
    - source: aca_autoregulation
      target: recognition_blockade
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Aca repression of the shared promoter limits how much
        recognition-blocking Acr is made after the initial burst.
    - source: aca_autoregulation
      target: nuclease_neutralisation
      connection_type: NEGATIVELY_REGULATES
      description: >-
        The same promoter-level repression applies to any acr gene in the
        aca-controlled operon, whatever its mechanism.
    - source: recognition_blockade
      target: nuclease_neutralisation
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Not a reaction chain: the ordering reflects where in the host pathway
        each mechanism intervenes, not a shared intermediate.
      description: >-
        Recognition blockade acts upstream of nuclease neutralisation in the host
        pathway; a phage encoding both attacks the same system at two points, and
        either alone is sufficient to block immunity.
knowledge_gaps:
  - gap_statement: >-
      GO has no molecular-function term for the characteristic anti-CRISPR
      mechanisms: DNA mimicry (competitive occupancy of a nucleic-acid-binding
      site by a protein that structurally imitates the nucleic acid), occlusion
      of one catalytic domain within a multidomain nuclease, and cleavage of a
      cyclic oligoadenylate messenger.
    boundary: >-
      GO:0098672 covers the process well, and GO:0140311 protein sequestering
      activity genuinely fits the AcrF3 case. The gap is confined to the
      molecular functions of the non-sequestering mechanisms, which are
      currently either left unasserted (as here) or flattened to a binding term
      that loses the mechanism.
    gap_kind:
      - ONTOLOGY
    status: OPEN
    significance: >-
      Mechanism is the only axis on which Acrs can be compared, since they share
      no sequence homology; without MF terms for these mechanisms, the
      functional distinction between a DNA mimic, a domain blocker, and a
      catalytic Acr is invisible to GO-based reasoning and survives only in
      prose.
    resolution: >-
      Request molecular-function terms for molecular-mimicry-based competitive
      inhibition and for cyclic oligoadenylate ring nuclease activity; the
      latter pairs with the cOA synthase request in
      MODULE:crispr_cas_adaptive_immunity.
  - gap_statement: >-
      Most characterised Acr proteins have no reviewed UniProt entry, and
      several carry uninformative names: the AcrF3-family exemplar L7P7R7 is
      named only "Phage protein", and the AcrIIC1 exemplar A0A2D0TCG3 only
      "Anti-CRISPR protein", despite both having published structures with their
      targets.
    boundary: >-
      InterPro has caught up faster than UniProt here, with
      mechanism-bearing family names (IPR049085 "Cas3 inhibitor AcrF3-like"),
      which is why this module grounds families in InterPro and leaves the
      UniProt labels as fetched.
    gap_kind:
      - CURATION
    status: OPEN
    significance: >-
      A reviewer who follows these accessions reaches an entry that does not say
      what the protein does, so the family grounding carries the information
      that the member record should.
    resolution: >-
      Nominate the structurally characterised Acr exemplars for UniProt review,
      and add gene reviews under genes/ for them as the AcrF8 review already
      does for H9C181.
  - gap_statement: >-
      Which specific DUF1874-family protein was assayed as the AcrIII-1 ring
      nuclease cannot be established from local data, so the family is grounded
      by InterPro with a reviewed SIRV1 member as an orienting exemplar rather
      than by the assayed accession.
    boundary: >-
      The family identity and the activity are both established by
      PMID:31942067; it is only the accession-level mapping from the paper's
      construct to a UniProt entry that is unresolved here.
    gap_kind:
      - CURATION
    status: OPEN
    significance: >-
      An exemplar that is not the assayed protein could later be mistaken for
      direct evidence of ring nuclease activity in that specific virus.
    resolution: >-
      Resolve the construct used in PMID:31942067 to its UniProt accession from
      the paper's data-availability or PDB entries, then replace the orienting
      exemplar with the assayed protein.
