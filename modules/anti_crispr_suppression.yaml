knowledge_gaps:
- gap_statement: When does native SIRV1 gp29 ring-nuclease expression provide a selective counterdefense
    benefit?
  gap_kind:
  - BIOLOGY
  status: OPEN
  boundary: Purified cA4 cleavage and suppression after plasmid/heterologous expression are established.
    The 2025 Comment tests native SIRV2 gp37 and SIRV1 gp29 transplanted into SIRV2, not native SIRV1
    infection. The Reply disputes physiological generalization and raises possible confounders. Both
    main texts were inspected; the unresolved issue is native deployment, not source inaccessibility.
  significance: Expression timing and abundance can separate biochemical anti-defense capacity from protection
    during native infection.
  resolution: Compare native-promoter expression, early-expression replacements and catalytic mutants
    in the same host/virus backgrounds, with matched cA4 and infection measurements; assess the full comment/reply
    together before extending the conclusion across DUF1874.
- gap_statement: How broadly do characterized Acrs inhibit natural effector orthologs in their mobile-element
    host ranges?
  gap_kind:
  - BIOLOGY
  status: OPEN
  boundary: The exemplars establish specific tested combinations, including type I-F/I-C, I-D, II, V and
    VI. Family or subtype names do not guarantee inhibition of every ortholog.
  significance: Effector variation, expression timing and regulatory control determine whether an inhibitor
    protects a mobile element in a new host.
  resolution: Test sequence-matched proteins against defined natural effector panels and distinguish infection/conjugation
    assays from heterologous editing inhibition.
- gap_statement: How do local transcriptional and translational controls tune inhibitor production across
    different mobile elements?
  gap_kind:
  - BIOLOGY
  status: OPEN
  boundary: ZF40 Aca2 has dual DNA/RNA regulation; this does not establish identical regulation in every
    Aca family or plasmid Acr locus.
  significance: Regulatory timing can limit cost while preserving sufficient early inhibitor activity.
  resolution: Measure native transcript, translation and infection/conjugation phenotypes after separate
    disruption of DNA operators and RNA-binding stem-loops.
