id: MODULE:dmel_vcb_ubiquitin_ligase
title: VHL-Elongin B/C-Cul2 ubiquitin ligase in Drosophila melanogaster
description: >-
  The VCB complex consists of the von Hippel-Lindau tumour suppressor protein (Vhl) bound
  to the adaptor heterodimer Elongin B and Elongin C. Together with Cul2 and the RING protein
  Roc1a it forms a cullin-RING E3 ubiquitin ligase in which Vhl is the substrate receptor.
  Its best-known substrates are hypoxia-inducible factor alpha subunits (Sima in Drosophila)
  after prolyl hydroxylation in normoxia, so the ligase couples oxygen availability to HIF-alpha
  degradation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001732
  title: 'FlyBase gene group VCB: Vcb complex'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as vcb complex (VCB); this module
    models that group.
- source_id: GO:0030891
  title: VCB complex
  statement: >-
    GO term grounding the module as VCB complex.
- source_id: GO:0031462
  title: Cul2-RING ubiquitin ligase complex
  statement: >-
    GO term grounding the module as Cul2-RING ubiquitin ligase complex.
notes: >-
  Strictly the VCB complex is Vhl-EloB-EloC; FlyBase includes Cul2 and Roc1a, so the module
  is the full CRL2-Vhl ligase. EloB and EloC are also subunits of the Elongin transcription
  elongation complex and of other Cul2/Cul5 ligases. FlyBase groups realized by this module:
  VCB (FBgg0001732). Participants were generated from the FlyBase gene-group membership and
  mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_vcb_ubiquitin_ligase.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
