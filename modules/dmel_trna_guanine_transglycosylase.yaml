id: MODULE:dmel_trna_guanine_transglycosylase
title: tRNA-guanine transglycosylase (queuine insertase) in Drosophila melanogaster
description: >-
  Eukaryotic tRNA-guanine transglycosylase exchanges guanine 34 in the anticodon of tRNA-Asp,
  tRNA-Asn, tRNA-His and tRNA-Tyr for queuine, forming queuosine. Animals cannot synthesize
  queuine and obtain it from diet and gut microbes. The enzyme is a heterodimer of a catalytic
  subunit (QTRT1 ortholog, Tgt) and a catalytically inactive paralogous accessory subunit
  (QTRT2 ortholog, CG3434) required for activity.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002008
  title: 'FlyBase gene group TGTC: Trna-guanine transglycosylase complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as trna-guanine transglycosylase
    complex (TGTC); this module models that group.
- source_id: GO:0120507
  title: tRNA-guanine transglycosylase complex
  statement: >-
    GO term grounding the module as tRNA-guanine transglycosylase complex.
notes: >-
  Modelled one part per subunit. Subunit roles are assigned by orthology to human QTRT1 and
  QTRT2; direct biochemical characterization of the Drosophila enzyme is limited. FlyBase
  groups realized by this module: TGTC (FBgg0002008). Participants were generated from the
  FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_trna_guanine_transglycosylase.yaml; none of the member genes has
  a gene review yet unless noted.
