id: MODULE:epithelial_apical_basal_polarity_complexes
title: Human epithelial apical-basal polarity complexes — the CDC42-activated PAR complex (PARD3, PARD6A/B/G, PRKCI/PRKCZ), the Crumbs complex (CRB3, PALS1, PATJ) and the basolateral Scribble module (SCRIB, DLG1, LLGL1/LLGL2), linked by mutual antagonism between aPKC and LGL
description: >-
  Epithelial cells divide their plasma membrane into an apical domain and a basolateral
  domain separated by the apical junctional complex. Three conserved groups of polarity
  proteins set up and maintain this boundary. The PAR complex consists of the multi-PDZ
  scaffold PAR3 (PARD3), a PAR6 adaptor (PARD6A, PARD6B or PARD6G) and an atypical protein
  kinase C (PRKCI or PRKCZ). PAR6 binds aPKC through its PB1 domain, PAR3 through its PDZ
  domain and GTP-bound CDC42 through its semi-CRIB motif, so CDC42-GTP recruits and
  activates the complex at the apical cortex and tight junction. The Crumbs complex is
  formed by the short transmembrane protein CRB3, the MAGUK PALS1 and the multi-PDZ protein
  PATJ; it marks the apical membrane and tight junction, and CRB3 and PALS1 bind PAR6 and
  so tie the two apical complexes together. The Scribble module comprises the LRR-PDZ
  scaffold SCRIB, the MAGUK DLG1 and the LGL proteins LLGL1 and LLGL2 at the basolateral
  membrane. The apical and basolateral groups antagonise each other: aPKC in the PAR6-aPKC
  complex phosphorylates LGL, which removes LGL from the apical cortex, and LGL in turn
  competes with PAR3 for PAR6-aPKC and suppresses the activity of the apical complex. This
  mutual exclusion positions the apical-basolateral boundary and the tight junction.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0045197
    title: establishment or maintenance of epithelial cell apical/basal polarity
    statement: >-
      The GO process that the module realises and its module-level concept. No RGD
      Pathway Ontology term covers apical-basal polarity, so no PW id is cited as evidence
      (see notes).
  - source_id: PMID:10934474
    title: The cell-polarity protein Par6 links Par3 and atypical protein kinase C to Cdc42.
    statement: >-
      Mammalian PAR6 forms a complex with CDC42-GTP, human PAR3 and the regulatory domains
      of atypical PKC, implicated in tight junction formation.
    supporting_text: Par6 forms a complex with Cdc42-GTP, with a human homologue of the multi-PDZ protein PAR-3 and with the regulatory domains of atypical protein kinase C (PKC) proteins.
  - source_id: PMID:12545177
    title: Direct interaction of two polarity complexes implicated in epithelial tight junction assembly.
    statement: >-
      The Crumbs-PALS1-PATJ and CDC42-PAR6-PAR3-aPKC complexes are linked through a direct
      PAR6-PALS1 interaction.
    supporting_text: Here we identify a biochemical and functional link between these two complexes that is mediated by Par6 and PALS1 (proteins associated with Lin7).
  - source_id: PMID:12725730
    title: Mammalian Lgl forms a protein complex with PAR-6 and aPKC independently of PAR-3 to regulate epithelial cell polarity.
    statement: >-
      Mammalian LGL is phosphorylated by aPKC and segregates from apical PAR6-aPKC to the
      basolateral membrane as cells polarise.
    supporting_text: mLgl initially colocalizes with PAR-6/aPKC at the cell-cell contact region and is phosphorylated by aPKC, followed by segregation from apical PAR-6/aPKC to the basolateral membrane after cells are polarized.
notes: >-
  Candidate module recorded in projects/RGD_PATHWAY_ONTOLOGY.md ("Next steps": a human
  PAR/Crumbs/Scribble polarity module, because protein_kinase_c_signaling mentions the PAR
  complex only through the atypical PKCs). It is not derived from an RGD diagram. The RGD
  Pathway Ontology (.cache/rgd_pw/pw.obo) has no apical-basal or epithelial polarity
  pathway; the only polarity terms are PW:0000200 (Wnt signaling, the planar cell polarity
  pathway) and its altered child, which describe a different axis. No PW id is therefore
  given as an evidence source_id. PW:0001515 (Hippo signaling pathway) is related through
  SCRIB but is not covered here. The module concept GO:0045197 (establishment or
  maintenance of epithelial cell apical/basal polarity) was checked in go-basic
  (2026-07-26); it covers both establishment and maintenance, which is what the mutual
  antagonism does. UniProt accessions and names are from UniProt REST (November 2026) or
  the gene folders; molecular functions are from experimental human GOA rows in QuickGO
  (November 2026) or gene-review core functions. The structure follows
  modules/dmel_epithelial_polarity_complexes.yaml; no Drosophila evidence is used. Several
  cited papers used mammalian non-human systems (MDCK cells, mouse brain); each evidence
  statement names the system, and human-specific evidence is cited where it exists (PAR6
  and PAR3 homologues, CRB3, PATJ, SCRIB, DLG1 in Caco-2 cells, PRKCI).

  Boundary and modelling decisions. (1) Relation to protein_kinase_c_signaling. That
  module models aPKC activation (PDPK1 priming and the PAR3-PAR6 scaffold) as one isoform
  class of PKC signalling. This module models the polarity machinery that aPKC serves;
  the PAR complex annoton repeats the aPKC and PAR6 grounding with the same functions
  (GO:0004674 for aPKC, GO:0035591 for PAR6) so the two modules agree, and the PKC
  module's atypical variant can later point here by module_ref. (2) Planar cell polarity
  (wnt_planar_cell_polarity) is a separate axis and is not modelled; SCRIB, which RGD draws
  on the PCP diagram as a VANGL2 partner, appears here only in its basolateral role. (3)
  CDC42 is an activator, not a PAR complex subunit, so it is its own regulatory part with
  a POSITIVELY_REGULATES edge. Its G protein activity is the CDC42 gene-review core
  function. Other CDC42 effectors and its GEFs/GAPs are out of scope. (4) Catalytic
  activity sits only on aPKC. PARD6 gets signaling adaptor activity (gene-review core
  function for PARD6B and PARD6G; the human PAR6 papers PMID:11260256 and PMID:10934474
  describe it as the adaptor linking CDC42 and aPKC to PAR3). PARD3 gets no function: it
  has no experimental human molecular function beyond protein binding and no review. (5)
  PARD3B is excluded from the PAR complex. Its gene review (PMID:33565714,
  PMID:12459187) records that PARD3B does not bind PAR6 or aPKC and localises to adherens
  junctions aPKC-independently; its core function is binding and restraining LKB1. It is
  a PAR3-family junctional polarity protein but not a PAR complex unit. (6) Crumbs
  complex: CRB3 is the epithelial Crumbs. CRB1 and CRB2 (retina and other tissues; both
  have gene reviews) form analogous complexes with PALS1 and PATJ but are not epithelial
  apical-basal determinants in the general sense and are left out. MPDZ (MUPP1), the PATJ
  paralogue, is named by the task as an alternative but has no cached human evidence for
  Crumbs-complex membership here and is not added. No molecular function is asserted for
  CRB3, PALS1 or PATJ: their experimental GOA rows are binding terms. GO has no
  cellular-component term for the Crumbs complex (GO:0035003 subapical complex is the
  invertebrate lateral membrane region, not the complex), so the complex descriptor has
  no term and a new term is requested in proposed_new_terms. LIN7 proteins, which bind
  PALS1, and AMOT family proteins are out of scope. (7) Scribble module: SCRIB, DLG1 and
  LGL are separate annotons because no stable tripartite complex is established. SCRIB
  carries signaling adaptor activity (IDA, PMID:27380321). DLG1 and the LGL proteins get no
  function: DLG1's experimental functions are channel or kinase binding in non-polarity
  contexts, and LGL antagonism of aPKC is competitive binding to PAR6 for which GO has no
  activity term (LLGL2 PDZ domain binding to PARD6B is the closest GOA row). (8)
  Connections. The two NEGATIVELY_REGULATES edges are the mutual antagonism the task
  asks for: aPKC phosphorylates LGL (PMID:12629547, PMID:12725730) and LGL suppresses the
  apical complex (PMID:16638806). The edges run between nodes, so the scribble_module
  edge is carried by LGL; no SCRIB-to-aPKC or DLG1-to-aPKC antagonism is asserted. The
  Crumbs-to-PAR edge (PAR6 recruitment, PMID:12545177, PMID:14718572) and the CDC42 edge
  are POSITIVELY_REGULATES. LGL is a substrate of aPKC and is not given a PAR-complex
  process role. (9) Out of scope: tight junction structural proteins (ZO-1, claudins,
  occludin), adherens junction cadherins, PAR1/MARK kinases and 14-3-3, LKB1, the
  Yurt/Coracle group, and downstream Hippo signalling.

  GO-CAM links. In gocams/index.tsv two human models contain members: gomodel:64d5781900002033
  (PRKCI protein serine/threonine kinase activity in an insulin-ARF6-RAC1 neurite outgrowth
  model; pinned to the PAR complex annoton because the function matches, though the
  biological context is different) and gomodel:62900b6400001749 (ZDHHC7 palmitoylates
  SCRIB, whose signaling adaptor activity acts upstream of YAP1 in polarised epithelial
  differentiation; pinned to the SCRIB annoton). No human model contains PARD3, PARD6,
  PRKCZ, CDC42, CRB3, PALS1, PATJ, DLG1 or LLGL1/2. Gene reviews exist for CDC42, PARD6A,
  PARD6B, PARD6G and PARD3B (and CRB1, CRB2), and their core functions were used. PANTHER
  family ids and PTNs are deliberately not asserted.
module:
  id: epithelial_apical_basal_polarity_complexes
  label: Epithelial apical-basal polarity complexes
  module_type: BIOLOGICAL_PROCESS
  description: >-
    CDC42-activated PAR complex, Crumbs complex and Scribble module that set apical and
    basolateral membrane identity by mutual antagonism.
  concepts:
    - preferred_term: establishment or maintenance of epithelial cell apical/basal polarity
      term:
        id: GO:0045197
        label: establishment or maintenance of epithelial cell apical/basal polarity
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
  parts:
    - order: 1
      role: apical GTPase activator of the PAR complex
      node:
        id: cdc42_activation
        label: CDC42-GTP activation of PAR6-aPKC
        module_type: REGULATORY_STEP
        description: >-
          GTP-bound CDC42 binds the semi-CRIB motif of PAR6 and so recruits and activates
          the PAR6-aPKC unit at the apical cortex. CDC42 is the activator, not a subunit
          of the PAR complex.
        annotons:
          - id: cdc42_g_protein
            label: CDC42 GTPase switch
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CDC42
                term:
                  id: UniProtKB:P60953
                  label: Cell division control protein 42 homolog
            function:
              preferred_term: G protein activity
              term:
                id: GO:0003925
                label: G protein activity
            locations:
              - preferred_term: apical plasma membrane
                term:
                  id: GO:0016324
                  label: apical plasma membrane
            role_description: >-
              GTP-controlled switch whose GTP-bound form engages PAR6. G protein activity is
              the first core function in the CDC42 gene review, which places CDC42 as the
              coordinator of epithelial polarity through spatially restricted effector
              engagement; GTPase activity GO:0003924 is IDA/EXP in human GOA.
            evidence:
              - source_id: PMID:11260256
                statement: Human PAR6 proteins bind GTP-bound CDC42 and Rac through their CRIB-like motif and form a ternary complex with the GTPases and aPKC.
                supporting_text: These interactions are not mutually exclusive, thereby allowing the PAR6 proteins to form a ternary complex with the GTPases and aPKC, both in vitro and in vivo.
    - order: 2
      role: apical polarity kinase complex
      node:
        id: par_complex
        label: PAR complex (PAR3-PAR6-aPKC)
        module_type: PROTEIN_COMPLEX
        description: >-
          PAR3, a PAR6 adaptor and an atypical PKC. aPKC is the only catalytic subunit;
          PAR6 links it to CDC42-GTP and PAR3; PAR3 positions the complex at the apical
          junction and is itself an aPKC substrate.
        annotons:
          - id: par_complex_complex
            label: PAR polarity complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: PAR polarity complex (PAR3-PAR6-aPKC)
                term:
                  id: GO:0120157
                  label: PAR polarity complex
                active_units:
                  - id: apkc_unit
                    label: atypical PKC (PRKCI or PRKCZ)
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: atypical protein kinase C (PRKCI, PRKCZ)
                        representative_members:
                          - preferred_term: PRKCI
                            term:
                              id: UniProtKB:P41743
                              label: Protein kinase C iota type
                          - preferred_term: PRKCZ
                            term:
                              id: UniProtKB:Q05513
                              label: Protein kinase C zeta type
                    role: >-
                      Catalytic subunit. PRKCI is the principal epithelial aPKC; PRKCZ is
                      the paralogous alternative. Protein serine/threonine kinase activity
                      is IDA in human GOA for both (PRKCI PMID:8226978, PRKCZ
                      PMID:15069075).
                    function:
                      preferred_term: protein serine/threonine kinase activity
                      term:
                        id: GO:0004674
                        label: protein serine/threonine kinase activity
                  - id: pard6_unit
                    label: PAR6 adaptor (PARD6A, PARD6B or PARD6G)
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PAR6 family (PARD6A, PARD6B, PARD6G)
                        representative_members:
                          - preferred_term: PARD6A
                            term:
                              id: UniProtKB:Q9NPB6
                              label: Partitioning defective 6 homolog alpha
                          - preferred_term: PARD6B
                            term:
                              id: UniProtKB:Q9BYG5
                              label: Partitioning defective 6 homolog beta
                          - preferred_term: PARD6G
                            term:
                              id: UniProtKB:Q9BYG4
                              label: Partitioning defective 6 homolog gamma
                    role: >-
                      Binds aPKC through its PB1 domain, CDC42-GTP through its semi-CRIB
                      motif and PAR3, CRB3 or PALS1 through its PDZ domain. Signaling
                      adaptor activity is the core function in the PARD6B and PARD6G gene
                      reviews; the PARD6A review uses its parent protein-macromolecule
                      adaptor activity (IPI with CRB3, PMID:14718572).
                    function:
                      preferred_term: signaling adaptor activity
                      term:
                        id: GO:0035591
                        label: signaling adaptor activity
                  - id: pard3_unit
                    label: PAR3 multi-PDZ scaffold
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PARD3
                        term:
                          id: UniProtKB:Q8TEW0
                          label: Partitioning defective 3 homolog
                    role: >-
                      Binds PAR6 through its PDZ domains and binds aPKC independently;
                      positions the complex at the apical junction and is an aPKC
                      substrate and inhibitor in vitro. No function term is given: PARD3
                      has no experimental human GOA molecular function other than protein
                      binding and no gene review.
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
            locations:
              - preferred_term: bicellular tight junction
                term:
                  id: GO:0005923
                  label: bicellular tight junction
              - preferred_term: apical plasma membrane
                term:
                  id: GO:0016324
                  label: apical plasma membrane
            role_description: >-
              The complex kinase activity is that of the aPKC unit, directed to polarity
              substrates such as LGL by the PAR6 scaffold.
            gocam_associations:
              - model: gomodel:64d5781900002033
                activity: gomodel:64d5781900002033/64d5781900002041
                title: Insulin-mediated activation of the ARF6-RAC1 axis in neurite outgrowth (Human)
                description: >-
                  PRKCI protein serine/threonine kinase activity (GO:0004674); the function
                  matches the aPKC unit, but the model context is neurite outgrowth, not
                  epithelial polarity.
            evidence:
              - source_id: PMID:10934475
                statement: Mammalian PAR3 and PAR6 associate through their PDZ domains and each binds aPKC; PAR3 is an aPKC substrate and inhibitor in vitro.
                supporting_text: mPAR-6 binds to Cdc42/Rac1 GTPases, and mPAR-3 and mPAR-6 bind independently to atypical protein kinase C (aPKC) isoforms. In vitro, mPAR-3 acts as a substrate and an inhibitor of aPKC.
              - source_id: PMID:10934474
                statement: PAR6 is the adaptor linking CDC42 and aPKC to PAR3.
                supporting_text: Thus, Par6 is a key adaptor that links Cdc42 and atypical PKCs to Par3.
              - source_id: PMID:8226978
                statement: Human PKC iota is an atypical PKC whose expression increases kinase activity toward myelin basic protein.
                supporting_text: Extracts of transfected CHO-K1 cells also displayed a significantly increased kinase activity using myelin basic protein as a substrate.
    - order: 3
      role: apical membrane determinant
      node:
        id: crumbs_complex
        label: Crumbs complex (CRB3-PALS1-PATJ)
        module_type: PROTEIN_COMPLEX
        description: >-
          The short transmembrane protein CRB3 binds the MAGUK PALS1 through its
          C-terminal FERM-binding and PDZ-binding motifs, and PALS1 binds the multi-PDZ
          protein PATJ. The complex marks the apical membrane and tight junction.
        annotons:
          - id: crumbs_complex_complex
            label: Crumbs complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: Crumbs complex (CRB3-PALS1-PATJ)
                active_units:
                  - id: crb3_unit
                    label: CRB3 transmembrane apical determinant
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CRB3
                        term:
                          id: UniProtKB:Q9BUF7
                          label: Protein crumbs homolog 3
                    role: >-
                      Epithelial Crumbs paralogue with a very short extracellular domain;
                      its cytoplasmic tail binds PALS1 and, through its C-terminal ERLI
                      motif, PAR6.
                  - id: pals1_unit
                    label: PALS1 MAGUK
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PALS1
                        term:
                          id: UniProtKB:Q8N3R9
                          label: Protein PALS1
                    role: >-
                      Links CRB3 to PATJ and binds the PAR6 PDZ domain through its N
                      terminus.
                  - id: patj_unit
                    label: PATJ multi-PDZ scaffold
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PATJ
                        term:
                          id: UniProtKB:Q8NI35
                          label: InaD-like protein
                    role: >-
                      Eight-PDZ protein concentrated at tight junctions; binds the CRB3
                      tail and PALS1.
            locations:
              - preferred_term: bicellular tight junction
                term:
                  id: GO:0005923
                  label: bicellular tight junction
              - preferred_term: apical plasma membrane
                term:
                  id: GO:0016324
                  label: apical plasma membrane
            role_description: >-
              No molecular function is asserted for the complex or its units. Their
              experimental human GOA functions are binding terms (protein domain specific
              binding, SH3 domain binding, identical protein binding) that describe
              assembly, not an activity, and GO has no Crumbs complex term (requested in
              proposed_new_terms).
            evidence:
              - source_id: PMID:12527193
                statement: Human CRB3 has a short extracellular domain and complexes with PALS1 and PATJ at the apical surface and tight junctions.
                supporting_text: CRB3 is a specialized isoform of the Crumbs protein family that is expressed in epithelia and can tie the apical membrane to the tight junction.
              - source_id: PMID:11964389
                statement: Human PATJ (hINADl) is concentrated in tight junctions of intestinal epithelial cells and binds the CRB3 C terminus.
                supporting_text: This CRB3 was able to interact through its C-terminal end with the N-terminal domain of hINADl.
              - source_id: PMID:14718572
                statement: CRB3 is apical and subapical in human intestine, and its ERLI motif binds PAR6 directly.
                supporting_text: CRB3 is localized to the apical and subapical area of epithelial cells from the mouse and human intestine
    - order: 4
      role: basolateral polarity determinants
      node:
        id: scribble_module
        label: Scribble module (SCRIB, DLG1, LGL)
        module_type: BIOLOGICAL_PROCESS
        description: >-
          SCRIB, DLG1 and LLGL1 or LLGL2 localise to the basolateral membrane and act
          together genetically, but they are not known to form a single stable complex,
          so each is a separate annoton.
        annotons:
          - id: scrib_adaptor
            label: SCRIB LRR-PDZ scaffold
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SCRIB
                term:
                  id: UniProtKB:Q14160
                  label: Protein scribble homolog
            function:
              preferred_term: signaling adaptor activity
              term:
                id: GO:0035591
                label: signaling adaptor activity
            locations:
              - preferred_term: basolateral plasma membrane
                term:
                  id: GO:0016323
                  label: basolateral plasma membrane
            role_description: >-
              Signaling adaptor activity is IDA in human GOA (PMID:27380321), where
              palmitoylated, membrane-bound SCRIB is needed for epithelial polarity and
              Hippo signalling.
            gocam_associations:
              - model: gomodel:62900b6400001749
                activity: gomodel:62900b6400001749/62900b6400001763
                title: ZDHHC7 Hsap regulates SCRIB in polarized cell differentiation (Human)
                description: SCRIB signaling adaptor activity (GO:0035591) in polarized epithelial cell differentiation at cell-cell junctions.
            evidence:
              - source_id: PMID:27380321
                statement: Palmitoylation targets SCRIB to the plasma membrane and is required for epithelial polarity.
                supporting_text: Immunofluorescence and confocal microscopy studies showed that palmitoylation of SCRIB is required for its plasma membrane targeting, establishment of epithelial cell polarity and activation of Hippo signaling pathway.
              - source_id: PMID:14681682
                statement: Human SCRIB is polarised in mammalian epithelia, colocalises with DLG and rescues Drosophila scrib mutants.
                supporting_text: We show that hScrib protein displays highly polarized localization in mammalian epithelial cells and colocalizes with mammalian Dlg
          - id: dlg1_scaffold
            label: DLG1 MAGUK
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DLG1
                term:
                  id: UniProtKB:Q12959
                  label: MAGUK scaffold protein DLG1
            locations:
              - preferred_term: basolateral plasma membrane
                term:
                  id: GO:0016323
                  label: basolateral plasma membrane
            role_description: >-
              Lateral and basal MAGUK required with MPP7 for tight junction assembly in
              Caco-2 cells. No function is asserted: its experimental human GOA functions
              (potassium channel regulator activity, kinase and channel binding) belong to
              synaptic and channel contexts, not to polarity.
            evidence:
              - source_id: PMID:17332497
                statement: DLG1 depletion from human Caco-2 cells impairs tight junction assembly and maintenance.
                supporting_text: Loss of either hDlg1 or MPP7 from epithelial Caco-2 cells results in a significant defect in the assembly and maintenance of functional tight junctions.
          - id: lgl_unit
            label: LGL (LLGL1 or LLGL2)
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LGL family (LLGL1, LLGL2)
                representative_members:
                  - preferred_term: LLGL1
                    term:
                      id: UniProtKB:Q15334
                      label: Lethal(2) giant larvae protein homolog 1
                  - preferred_term: LLGL2
                    term:
                      id: UniProtKB:Q6P1M3
                      label: LLGL scribble cell polarity complex component 2
            locations:
              - preferred_term: basolateral plasma membrane
                term:
                  id: GO:0016323
                  label: basolateral plasma membrane
            role_description: >-
              aPKC substrate and antagonist of the PAR complex: it competes with PAR3 for
              PAR6-aPKC and, when phosphorylated, leaves the apical cortex. No function
              term is asserted: GO has no term for this competitive inhibition, and the
              experimental human GOA rows are binding terms (PDZ domain binding with
              PARD6B for LLGL2, protein kinase binding for LLGL1).
            evidence:
              - source_id: PMID:12725730
                statement: Mammalian LGL competes with PAR3 to form a separate complex with PAR6-aPKC.
                supporting_text: We show that mammalian Lgl competes for PAR-3 in forming an independent complex with PAR-6/aPKC.
  connections:
    - source: cdc42_activation
      target: par_complex
      connection_type: POSITIVELY_REGULATES
      description: CDC42-GTP binds the PAR6 semi-CRIB motif and recruits and activates PAR6-aPKC.
      evidence:
        - source_id: PMID:11260256
          statement: Human PAR6 links activated CDC42 and Rac to aPKC.
          supporting_text: by functioning as an adaptor protein that links activated Rac and Cdc42 to aPKC signalling
    - source: crumbs_complex
      target: par_complex
      connection_type: POSITIVELY_REGULATES
      description: CRB3 and PALS1 bind the PAR6 PDZ domain and recruit PAR6 to the apical surface.
      evidence:
        - source_id: PMID:12545177
          statement: Crumbs recruits wild-type PAR6, but not a PDZ mutant, to the cell surface.
          supporting_text: The transmembrane protein Crb can recruit wild-type Par6, but not Par6 with a mutated PDZ domain, to the cell surface.
    - source: par_complex
      target: scribble_module
      connection_type: NEGATIVELY_REGULATES
      description: >-
        aPKC in the PAR6-aPKC complex phosphorylates LGL on conserved serines, which
        segregates LGL from the apical domain to the basolateral membrane.
      evidence:
        - source_id: PMID:12629547
          statement: In mammalian cells and mouse brain, aPKC-PAR6 binds and phosphorylates LGL, a functional aPKC substrate in polarisation.
          supporting_text: In cultured cell lines and in mouse brain, aPKC, mPar-6C and Mlgl form a multiprotein complex in which Mlgl is targeted for phosphorylation on conserved serine residues.
        - source_id: PMID:12725730
          statement: Phosphorylation by aPKC precedes LGL segregation to the basolateral membrane.
          supporting_text: mLgl initially colocalizes with PAR-6/aPKC at the cell-cell contact region and is phosphorylated by aPKC, followed by segregation from apical PAR-6/aPKC to the basolateral membrane after cells are polarized.
    - source: scribble_module
      target: par_complex
      connection_type: NEGATIVELY_REGULATES
      description: >-
        LGL suppresses the activity of the apical PAR3-aPKC-PAR6 complex and so mediates
        disassembly of apical domains.
      evidence:
        - source_id: PMID:16638806
          statement: Endogenous LGL drives apical domain disassembly in MDCK cells by suppressing PAR3-aPKC-PAR6 activity.
          supporting_text: Importantly, this Lgl function is mediated by the suppression of the apical PAR-3-aPKC-PAR-6 complex activity.
        - source_id: PMID:12725730
          statement: Excess LGL-PAR6-aPKC complex suppresses junction formation, opposite to the PAR3-containing complex.
          supporting_text: Overexpression studies establish that increased amounts of the mLgl/PAR-6/aPKC complex suppress the formation of epithelial junctions
proposed_new_terms:
  - proposed_name: Crumbs complex
    proposed_definition: >-
      A plasma membrane protein complex at the apical membrane and apical junction of
      epithelial cells that contains a transmembrane Crumbs protein, a PALS1 (Stardust)
      MAGUK protein and a PATJ (Discs lost) multi-PDZ protein, and that specifies the apical
      membrane domain.
    justification: >-
      GO has a PAR polarity complex term (GO:0120157) but no term for the Crumbs complex,
      the second conserved apical polarity complex; GO:0035003 subapical complex is a
      membrane region of invertebrate epithelia, not the protein complex. The Crumbs
      complex descriptors in this module and in dmel_epithelial_polarity_complexes
      therefore carry no term.
    proposed_parent:
      id: GO:0098797
      label: plasma membrane protein complex
    supported_by:
      - reference_id: PMID:12545177
        supporting_text: Two evolutionarily conserved multi-protein complexes, Crumbs (Crb)-PALS1 (Stardust)-PATJ (DiscsLost) and Cdc42-Par6-Par3-atypical protein kinase C (aPKC), have been implicated in the assembly of tight junctions and in polarization of Drosophila melanogaster epithelia.
      - reference_id: PMID:12527193
        supporting_text: it has a conserved intracellular domain that allows it to complex with Pals1 and PATJ
