id: MODULE:leucine_catabolism
title: Distal L-leucine catabolism
description: >-
  A reusable four-position pathway that converts leucine-derived
  3-methylbutanoyl-CoA (isovaleryl-CoA) to acetoacetate and acetyl-CoA.
  The pathway comprises acyl-CoA dehydrogenation, biotin-dependent
  carboxylation, methylglutaconyl-CoA hydration, and HMG-CoA cleavage.
  It separates reaction roles from lineage-specific enzyme families and
  cellular locations. Upstream leucine transamination and branched-chain
  2-oxoacid dehydrogenation are outside the module; the terminal HMG-CoA
  lyase reaction can also serve other HMG-CoA-generating pathways.
status: DRAFT
evidence:
  - source_id: GO:0006552
    title: L-leucine catabolic process
    statement: >-
      GO:0006552 supplies the biological-process context for degradation of
      L-leucine.
  - source_id: Reactome:R-HSA-70895
    title: Branched-chain amino acid catabolism
    statement: >-
      Human Reactome provides a curated instance of the ordered distal
      reactions, while the module abstracts away mitochondrial localization.
  - source_id: file:human/IVD/IVD-ai-review.yaml
    title: Human IVD gene review
    statement: P26440 grounds the eukaryotic dehydrogenase instance.
  - source_id: file:human/MCCC1/MCCC1-ai-review.yaml
    title: Human MCCC1 gene review
    statement: Q96RQ3 grounds the eukaryotic MCC alpha-subunit role.
  - source_id: file:human/MCCC2/MCCC2-ai-review.yaml
    title: Human MCCC2 gene review
    statement: Q9HCC0 grounds the eukaryotic MCC beta-subunit role.
  - source_id: file:human/AUH/AUH-ai-review.yaml
    title: Human AUH gene review
    statement: Q13825 grounds the eukaryotic hydratase-family instance.
  - source_id: file:human/HMGCL/HMGCL-ai-review.yaml
    title: Human HMGCL gene review
    statement: P35914 grounds the eukaryotic terminal lyase instance.
  - source_id: file:PSEPK/ivd/ivd-ai-review.yaml
    title: PSEPK ivd gene review
    statement: Q88FM5 supplies 3-methylbutanoyl-CoA dehydrogenase activity.
  - source_id: file:PSEPK/mccA/mccA-ai-review.yaml
    title: PSEPK mccA gene review
    statement: Q88FM2 supplies the MCC biotin-carboxylase/carrier subunit.
  - source_id: file:PSEPK/mccB/mccB-ai-review.yaml
    title: PSEPK mccB gene review
    statement: Q88FM4 supplies the MCC carboxyltransferase subunit.
  - source_id: file:PSEPK/liuC/liuC-ai-review.yaml
    title: PSEPK liuC gene review
    statement: Q88FM3 supplies the bacterial methylglutaconyl-CoA hydratase.
  - source_id: file:PSEPK/mvaB/mvaB-ai-review.yaml
    title: PSEPK mvaB gene review
    statement: Q88H25 supplies a PSEPK HMG-CoA lyase instance.
module:
  id: leucine_catabolism
  label: Distal L-leucine catabolism
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: L-leucine catabolic process
      term:
        id: GO:0006552
        label: L-leucine catabolic process
      description: >-
        Conversion of leucine-derived 3-methylbutanoyl-CoA to acetoacetate
        and acetyl-CoA.
  parts:
    - order: 1
      role: 3-methylcrotonyl-CoA formation
      node:
        id: ivd_step
        label: 3-methylbutanoyl-CoA dehydrogenase
        module_type: REACTION
        annotons:
          - id: ivd_activity
            label: 3-methylbutanoyl-CoA dehydrogenase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: 3-methylbutanoyl-CoA dehydrogenase activity
                term:
                  id: GO:0008470
                  label: 3-methylbutanoyl-CoA dehydrogenase activity
              family:
                preferred_term: isovaleryl-CoA dehydrogenases
                term:
                  id: PANTHER:PTHR43884:SF12
                  label: isovaleryl-CoA dehydrogenase-related
                representative_members:
                  - preferred_term: human IVD
                    term:
                      id: UniProtKB:P26440
                      label: Isovaleryl-CoA dehydrogenase, mitochondrial
                  - preferred_term: PSEPK Ivd
                    term:
                      id: UniProtKB:Q88FM5
                      label: Isovaleryl-CoA dehydrogenase
            function:
              preferred_term: 3-methylbutanoyl-CoA dehydrogenase activity
              term:
                id: GO:0008470
                label: 3-methylbutanoyl-CoA dehydrogenase activity
              substrates:
                - preferred_term: 3-methylbutanoyl-CoA
                - preferred_term: oxidized electron-transfer flavoprotein
              products:
                - preferred_term: 3-methylcrotonyl-CoA
                - preferred_term: reduced electron-transfer flavoprotein
            role_description: >-
              Uses enzyme-bound FAD to transfer reducing equivalents from
              3-methylbutanoyl-CoA to an electron-transfer flavoprotein.
    - order: 2
      role: 3-methylglutaconyl-CoA formation
      node:
        id: mcc_step
        label: 3-methylcrotonyl-CoA carboxylase complex
        module_type: PROTEIN_COMPLEX
        concepts:
          - preferred_term: methylcrotonoyl-CoA carboxylase complex
            term:
              id: GO:1905202
              label: methylcrotonoyl-CoA carboxylase complex
        annotons:
