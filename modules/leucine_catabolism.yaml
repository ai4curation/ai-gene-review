                label: hydroxymethylglutaryl-CoA lyase activity
              substrates:
                - preferred_term: (S)-3-hydroxy-3-methylglutaryl-CoA
              products:
                - preferred_term: acetoacetate
                - preferred_term: acetyl-CoA
            role_description: >-
              Cleaves HMG-CoA to acetoacetate and acetyl-CoA; this reaction
              can be shared with other HMG-CoA degradation routes.
  connections:
    - source: ivd_step
      target: mcc_step
      connection_type: PROVIDES_INPUT_FOR
      description: Ivd supplies 3-methylcrotonyl-CoA to the MCC complex.
    - source: mcc_step
      target: hydratase_step
      connection_type: PROVIDES_INPUT_FOR
      description: MCC supplies 3-methylglutaconyl-CoA to a hydratase.
    - source: hydratase_step
      target: hmgcl_step
      connection_type: PROVIDES_INPUT_FOR
      description: Hydration supplies HMG-CoA to the terminal lyase.
  notes: >-
    Exact human and bacterial UniProt accessions are exemplars rather than
    taxonomic restrictions. Mitochondrial matrix localization is valid for
    eukaryotic instances but is not a pathway-wide requirement and is absent
    from the reusable module context. Enzyme-bound FAD is represented as the
    Ivd cofactor rather than a consumed substrate. The distinct eukaryotic AUH
    and bacterial LiuC hydratase implementations are modeled as alternatives.
    The bacterial LiuC selector combines a broad crotonase-family record with
    the exact GO function and a concrete exemplar because the available
    PANTHER family is not specific for this reaction.
    No ancestral PTN node is asserted without verified PAINT IBD evidence.
