            label: MCC biotin-carboxylase and carrier subunit
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: biotin carboxylase activity
                term:
                  id: GO:0004075
                  label: biotin carboxylase activity
              family:
                preferred_term: MCC alpha subunits
                term:
                  id: PANTHER:PTHR18866:SF33
                  label: methylcrotonoyl-CoA carboxylase alpha subunit-related
                representative_members:
                  - preferred_term: human MCCC1
                    term:
                      id: UniProtKB:Q96RQ3
                      label: Methylcrotonoyl-CoA carboxylase subunit alpha
                  - preferred_term: PSEPK MccA
                    term:
                      id: UniProtKB:Q88FM2
                      label: Biotin carboxylase MccA
            function:
              preferred_term: biotin carboxylase activity
              term:
                id: GO:0004075
                label: biotin carboxylase activity
              substrates:
                - preferred_term: biotinylated carrier domain
                - preferred_term: hydrogencarbonate
                - preferred_term: ATP
              products:
                - preferred_term: carboxybiotinylated carrier domain
                - preferred_term: ADP
                - preferred_term: phosphate
            role_description: >-
              Carboxylates its tethered biotin carrier for transfer of the
              carboxyl group by the beta subunit.
          - id: mcc_beta_activity
            label: MCC carboxyltransferase subunit
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: methylcrotonoyl-CoA carboxylase activity
                term:
                  id: GO:0004485
                  label: methylcrotonoyl-CoA carboxylase activity
              family:
                preferred_term: MCC beta subunits
                term:
                  id: PANTHER:PTHR22855:SF13
                  label: methylcrotonoyl-CoA carboxylase beta chain
                representative_members:
                  - preferred_term: human MCCC2
                    term:
                      id: UniProtKB:Q9HCC0
                      label: Methylcrotonoyl-CoA carboxylase subunit beta
                  - preferred_term: PSEPK MccB
                    term:
                      id: UniProtKB:Q88FM4
                      label: Methylcrotonyl-CoA carboxylase subunit beta
            function:
              preferred_term: methylcrotonoyl-CoA carboxylase activity
              term:
                id: GO:0004485
                label: methylcrotonoyl-CoA carboxylase activity
              substrates:
                - preferred_term: 3-methylcrotonyl-CoA
                - preferred_term: carboxybiotinylated carrier domain
              products:
                - preferred_term: 3-methylglutaconyl-CoA
                - preferred_term: biotinylated carrier domain
            role_description: >-
              Transfers the carboxyl group from carrier-bound carboxybiotin
              to 3-methylcrotonyl-CoA.
    - order: 3
      role: HMG-CoA formation
      node:
        id: hydratase_step
        label: Methylglutaconyl-CoA hydration
        module_type: REACTION
        variant_sets:
