  connections:
    - source: ivd_step
      target: mcc_step
      connection_type: PROVIDES_INPUT_FOR
      description: Ivd supplies 3-methylcrotonyl-CoA to the MCC complex.
    - source: mcc_step
      target: hydratase_step
      connection_type: PROVIDES_INPUT_FOR
      description: MCC supplies 3-methylglutaconyl-CoA to a hydratase.
    - source: hydratase_step
      target: hmgcl_step
      connection_type: PROVIDES_INPUT_FOR
      description: Hydration supplies HMG-CoA to the terminal lyase.
  context:
    taxa:
      - preferred_term: Bacteria with a liu-type leucine utilization pathway
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          Exemplified by Pseudomonas aeruginosa (direct enzymology and mutant genetics for every step)
          and Pseudomonas putida KT2440 (cluster-context orthologs); a taxonomic envelope, not a claim
          that every bacterium degrades leucine.
      - preferred_term: Eukaryotes
        term:
          id: NCBITaxon:2759
          label: Eukaryota
        description: >-
          Exemplified by human, where all four steps are mitochondrial and deficiency of each enzyme
          causes an inborn error of leucine metabolism.
  notes: >-
    The module is species-neutral. Human and Pseudomonas aeruginosa members are the experimentally
    characterized exemplars (purified IVD/LiuA, MCC holoenzymes from both, AUH, HMGCL/LiuE); P. putida
    KT2440 members are retained as a cluster-context exemplar without direct assays. Exact accessions
    are exemplars rather than taxonomic restrictions. Mitochondrial matrix localization is valid for
    eukaryotic instances but is not a pathway-wide requirement and is absent from the reusable module
    context. Enzyme-bound FAD is represented as the Ivd cofactor rather than a consumed substrate. The
    distinct eukaryotic AUH and bacterial LiuC hydratase implementations are modeled as alternatives;
    they belong to different PANTHER families (PTHR11941 and PTHR42964). Several selector families are
    functionally mixed, which is why each annoton is gated by its required GO function and why some
    family-function conformance warnings are intrinsic: PTHR43884:SF12 also contains Bacillus FadE
    and other acyl-CoA dehydrogenases; PTHR22855:SF13 contains the glutaconyl-CoA decarboxylase GcdA;
    PTHR42738 contains the Chloroflexus citramalyl-CoA lyase; and PTHR42964:SF1, the only subfamily of
    its family, also holds hydroxycinnamoyl-CoA hydratase-lyases, FabM and PksH, so its family review
    leaves GO:0004490 UNRESOLVED and the LiuC variant relies on member-level evidence. PTHR42964 does
    carry a PAINT IBD for GO:0004490 (PTN001733227, seeded by P. aeruginosa LiuC), but it subtends all
    13 tree leaves and its family review assesses it TOO_DEEP, so it is not asserted as an ancestral
    node here. MCC beta subunits are modeled, like the alpha subunits, as contributing to the holoenzyme
    methylcrotonoyl-CoA carboxylase activity, with carboxyl transfer as their own activity. The holoenzyme
    activity has PAINT IBD nodes on both subunit families (PTN000523406 in PTHR22855, spanning bacterial
    and eukaryotic beta subunits; PTN000429500 in PTHR18866, eukaryotic alpha subunits only); they are
    not attached as ancestral nodes because the annotons carry the subunit half-reactions. PAINT places
    GO:0008470 (PTN000098091) and the MCC alpha activity on eukaryote-only nodes, although the bacterial
    LiuA and LiuD have their own direct evidence; the family reviews record these nodes as correctly
    placed but shallower than the function. P. aeruginosa liuA is genetically required for acyclic
    terpene utilization although the terpene route enters this pathway at 3-methylcrotonyl-CoA; that
    unexplained requirement is outside the module. Acyclic terpene (Atu) catabolism, which feeds
    3-methylcrotonyl-CoA and 3-hydroxy-3-isohexenylglutaryl-CoA into this pathway in P. aeruginosa,
    is upstream biology outside the module boundary.
