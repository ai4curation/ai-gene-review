                      Hydrates 3-methylglutaconyl-CoA in the bacterial LiuC
                      family context.
    - order: 4
      role: acetoacetate and acetyl-CoA formation
      node:
        id: hmgcl_step
        label: HMG-CoA lyase
        module_type: REACTION
        annotons:
          - id: hmgcl_activity
            label: HMG-CoA lyase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: hydroxymethylglutaryl-CoA lyase activity
                term:
                  id: GO:0004419
                  label: hydroxymethylglutaryl-CoA lyase activity
              family:
                preferred_term: HMG-CoA lyases
                term:
                  id: PANTHER:PTHR42738
                  label: hydroxymethylglutaryl-CoA lyase
                representative_members:
