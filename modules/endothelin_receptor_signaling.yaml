id: MODULE:endothelin_receptor_signaling
title: Endothelin receptor signaling pathway module
description: >-
  The endothelin receptor signaling pathway (GO:0086100) and its canonical phospholipase
  C-activating branch (GO:0160135) are initiated when the secreted 21-amino-acid bicyclic
  peptide hormones endothelin-1 (EDN1, PANTHER:PTHR13874:SF10), endothelin-2 (EDN2,
  PANTHER:PTHR13874:SF9), and endothelin-3 (EDN3, PANTHER:PTHR13874:SF11) bind and activate
  their cognate seven-transmembrane G protein-coupled receptors EDNRA (ETA,
  PANTHER:PTHR46099:SF2; selective for EDN1 and EDN2 over EDN3) and EDNRB (ETB,
  PANTHER:PTHR46099:SF3; equipotent for EDN1, EDN2, and EDN3) at the plasma membrane of
  vascular smooth-muscle cells, endothelial cells, neural crest derivatives, and renal/cardiac
  tissues. Agonist-bound EDNRA and EDNRB couple primarily to heterotrimeric Gq/11 proteins
  (exemplified by GNAQ, PANTHER:PTHR10218:SF329) to stimulate phospholipase C-beta (PLCB1,
  PANTHER:PTHR10336:SF12), hydrolyzing phosphatidylinositol 4,5-bisphosphate (PIP2) into
  inositol 1,4,5-trisphosphate (IP3) and diacylglycerol (DAG) to mobilize intracellular Ca2+
  and regulate vascular tone, systemic arterial blood pressure, and enteric/melanocytic neural
  crest development.
status: DRAFT
evidence:
  - source_id: GO:0086100
    title: endothelin receptor signaling pathway
    statement: >-
      The module is grounded in the GO biological process term for the endothelin receptor
      signaling pathway (GO:0086100) and its specific phospholipase C-activating branch
      (GO:0160135).
  - source_id: GO:0160135
    title: phospholipase C-activating endothelin receptor signaling pathway
    statement: >-
      Models the canonical Gq/11-phospholipase C-activating endothelin receptor signaling
      cascade (GO:0160135) triggered by EDN1, EDN2, and EDN3 across EDNRA and EDNRB.
  - source_id: Reactome:R-HSA-375281
    title: Endothelin-like ligands bind endothelin receptors
    supporting_text: >-
      Endothelin receptors (A and B) belong to the G-protein coupled receptor family and are
      widely expressed in the CNS and peripheral tissues. The receptor subtypes, ETA and ETB, can
      be pharmacologically distinguished by their rank order of affinity towards the three
      endothelin isopeptides; the ETA receptor is ET-1 selective with a rank order of affinity of
      ET-1 >= ET-2 >> ET-3, whereas the ETB receptor exhibits similar affinities for all three
      isopeptides (Davenport AP & Battistini B, 2002).
    statement: >-
      Establishes that all three endothelin isopeptides (EDN1, EDN2, EDN3) bind and activate
      the endothelin GPCRs EDNRA and EDNRB.
  - source_id: PMID:2649896
    title: 'The human endothelin family: three structurally and pharmacologically distinct isopeptides predicted by three separate genes.'
    supporting_text: >-
      Moreover, each of the human genes predicted a putative 21-residue peptide, similar to but
      distinct from each other: (i) the "classical" endothelin (ET-1), (ii) [Trp6,Leu7]endothelin
      (ET-2), and (iii) [Thr2,Phe4,Thr5,Tyr6, Lys7,Tyr14]endothelin (ET-3). Synthetic ET-1,
      ET-2, and ET-3 were prepared according to the deduced amino acid sequences, and the
      biological activities were assayed by contraction of isolated porcine coronary artery strips
      and by intravenous injection to anesthetized rats. All these synthetic peptides produced
      strong vasoconstrictor and pressor responses.
    statement: >-
      Demonstrates that the three human genes EDN1, EDN2, and EDN3 encode distinct 21-residue
      vasoactive endothelin peptide hormones.
  - source_id: PMID:1917960
    title: Effects of endothelins on signal transduction and proliferation in human melanocytes.
    supporting_text: >-
      Upon incubation with cultured cells, the mass contents of inositol 1,4,5-trisphosphate and
      intracellular calcium level were substantially increased by 10 nM ET-1, ET-2, and ET-3, but
      not by big-ET with maximal response at 80-130-s postincubation.
    statement: >-
      Establishes that mature ET-1 (EDN1), ET-2 (EDN2), and ET-3 (EDN3) directly stimulate
      phospholipase C to generate IP3 and mobilize intracellular Ca2+ (GO:0160135).
  - source_id: PMID:1713452
    title: Cloning and functional expression of human cDNA for the ETB endothelin receptor.
    supporting_text: >-
      COS cells transiently transfected with the cloned cDNA expressed specific, high-affinity
      binding sites for endothelin isopeptides and responded to the peptides with a transient
      increase of [Ca2+]i; endothelin-1 and endothelin-3 exhibited approximately equal potencies
      both in displacing 125I-labeled endothelin-1 binding and in eliciting [Ca2+]i transients.
    statement: >-
      Demonstrates that human EDNRB binds EDN1 and EDN3 with equal potency to trigger
      intracellular Ca2+ mobilization.
  - source_id: PANTHER:PTN000356323
    title: PAINT node PTN000356323 for the endothelin family (PTHR13874)
    statement: >-
      Local PAINT IBD root node in PTHR13874 with propagated terms C:GO:0005576, F:GO:0005179,
      F:GO:0031708, P:GO:0003100, P:GO:0006874, P:GO:0014826, P:GO:0045987; PAINT date 20260529.
notes: >-
  Curated signaling-pathway module for the endothelin receptor signaling pathway (GO:0086100)
  and its phospholipase C-activating branch (GO:0160135) built with PANTHER FAMILY/subfamily
  selectors across the three endogenous endothelin peptide hormones EDN1 (PANTHER:PTHR13874:SF10),
  EDN2 (PANTHER:PTHR13874:SF9), and EDN3 (PANTHER:PTHR13874:SF11), their cognate GPCRs EDNRA
  (PANTHER:PTHR46099:SF2) and EDNRB (PANTHER:PTHR46099:SF3), and downstream Gq/11 alpha (GNAQ,
  PANTHER:PTHR10218:SF329) and phospholipase C-beta (PLCB1, PANTHER:PTHR10336:SF12) effectors.
