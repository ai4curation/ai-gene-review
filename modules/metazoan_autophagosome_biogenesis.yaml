      node:
        id: maturation_fusion
        label: EPG5-dependent autophagosome-lysosome fusion
        module_type: BIOLOGICAL_PROCESS
        description: >-
          EPG5 is a metazoan-specific RAB7 effector. It binds RAB7 and
          VAMP7/8 on late endosomes and lysosomes, and Atg8-family proteins
          and STX17-SNAP29 on autophagosomes. It stabilises the correct
          trans-SNARE complex so that autophagosomes fuse with the right
          partner. Without EPG5, non-degradative hybrid vesicles build up.
          HOPS tethering and the SNAREs themselves are context, not modelled
          here.
