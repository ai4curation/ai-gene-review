id: MODULE:metazoan_autophagosome_biogenesis
title: Metazoan autophagosome biogenesis and maturation
description: >-
  In animals, macroautophagy builds a double-membrane autophagosome around
  cytoplasmic cargo and delivers it to lysosomes. The core steps are shared
  with yeast, but several are wired differently. An initiation complex of the
  Atg1/ULK kinase, ATG13 and ATG101 marks the site of formation, which in
  animals lies on endoplasmic reticulum (ER) subdomains called omegasomes. The
  class III phosphatidylinositol 3-kinase complex I (VPS34, the pseudokinase
  VPS15, Beclin 1 and ATG14) makes phosphatidylinositol 3-phosphate (PI3P) on
  this membrane. Two kinds of WD40 PROPPIN read PI3P. WIPI1/2-type proteins
  recruit the conjugation machinery, and WIPI3/4-type proteins partner the
  ATG2 rod in an ATG2-ATG18 complex. ATG2 carries lipids from the ER to the
  growing phagophore, and the ATG9 scramblase spreads them between the two
  leaflets. Atg8-family proteins are primed by ATG4 and conjugated to
  phosphatidylethanolamine by the E1 ATG7, the E2 ATG3 and the E3-like
  ATG12-ATG5-ATG16 complex, with ATG16 setting where conjugation happens.
  Animals have two Atg8 subfamilies, GABARAP-type and LC3-type, and the stage
  at which each acts differs between lineages: in nematodes the GABARAP-type
  protein acts early and the LC3-type protein late, whereas in mammalian
  cells the GABARAP subfamily dominates autophagosome-lysosome fusion. Cargo
  receptors such as p62/SQSTM1 link ubiquitinated cargo to Atg8-family
  proteins. Fusion with late endosomes and lysosomes needs EPG5, a
  metazoan-specific RAB7 effector that binds Atg8-family proteins and SNAREs
  and makes sure autophagosomes fuse with the correct partner.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:20550938
    title: C. elegans screen identifies autophagy genes specific to multicellular organisms.
    statement: >-
      Genetic screens in C. elegans define metazoan-specific autophagy genes
      (epg-2 to epg-5) acting at discrete steps, including EPG-5 in formation
      of degradative autolysosomes.
    supporting_text: >-
      Genetic analysis reveals that epg-2, -3, -4, and -5 define discrete
      genetic steps of the autophagy pathway.
  - source_id: PMID:21802374
    title: The WD40 repeat PtdIns(3)P-binding protein EPG-6 regulates progression of omegasomes to autophagosomes.
    statement: >-
      Hierarchical analysis of worm autophagy genes in aggregate degradation:
      the UNC-51 complex, EPG-8/Atg14 and lipidated LGG-1 binding to
      aggregates are required for omegasome formation; the two PI3P effectors
      EPG-6 and ATG-18 act differently.
    supporting_text: >-
      We also established the hierarchical relationship of autophagy genes in
      degradation of protein aggregates and revealed that the UNC-51/Atg1
      complex, EPG-8/Atg14, and binding of lipidated LGG-1 to protein
      aggregates are required for omegasome formation.
  - source_id: PMID:24374177
    title: The C. elegans LC3 acts downstream of GABARAP to degrade autophagosomes by interacting with the HOPS subunit VPS39.
    statement: >-
      Sequential requirement of LGG-1, LGG-2, RAB-7 and HOPS in generating
      autolysosomes in C. elegans.
    supporting_text: >-
      Genetic analyses sustain a sequential implication of LGG-1, LGG-2,
      RAB-7, and HOPS complex to generate autolysosomes.
  - source_id: PMID:27864321
    title: >-
      Atg8 family LC3/GABARAP proteins are crucial for autophagosome-lysosome
      fusion but not autophagosome formation during PINK1/Parkin mitophagy and
      starvation.
    statement: >-
      In human cells lacking all six Atg8 proteins, autophagosomes still form
      but are smaller, and fusion with lysosomes fails.
    supporting_text: >-
      Although neither GABARAPs nor LC3s are required for autophagosome
      biogenesis, loss of all Atg8s yields smaller autophagosomes and a slowed
      initial rate of autophagosome formation.
  - source_id: file:modules/phagophore_assembly_site.yaml
    title: Phagophore assembly site (PAS) module (budding yeast)
    statement: >-
      The yeast module that models the Atg17-Atg29-Atg31 scaffold and
      Atg1-complex condensate, Atg9 vesicles, PI3K complex I, Atg2-Atg18 and
      the Atg8 conjugation system at the PAS. This module is its metazoan
      counterpart.
  - source_id: file:modules/phagophore_organelle_contact_site.yaml
    title: Phagophore-organelle membrane contact site module
    statement: >-
      Models the ER-phagophore bridge (ATG2 rod, WIPI4 clamp, VMP1/TMEM41B
      and ATG9 scramblases) in structural detail; this module includes ATG2
      and ATG9 only as the lipid-supply step.
notes: >-
  Boundary. Bulk and selective macroautophagy in animals, from the
  initiation complex to fusion of the autophagosome with late endosomes and
  lysosomes. Eight parts in pathway order: ULK1 initiation complex,
  PI3KC3-C1 nucleation, PI3P effectors, lipid supply (ATG2, ATG9), Atg8
  conjugation, Atg8-family membrane proteins (with a lineage variant set for
  the stage at which each subfamily acts), optional cargo recruitment
  (SQSTM1/SQST-1), and EPG5-dependent fusion. Upstream regulation by mTOR and
  AMPK, transcriptional induction by TFEB/HLH-30, lysosomal degradation
  itself, and the PI3KC3-C2 endocytic complex are outside the boundary.
  HLH-30 and the LIPL-4 lipid branch are modelled in
  MODULE:c_elegans_lysosomal_lipid_signaling. Mitochondrion-specific
  receptors are modelled in MODULE:mitophagy.

  Context taxon. Metazoa. The boundary is drawn around steps that are shared
  by nematodes and mammals and that differ from budding yeast: ATG101 in the
  initiation complex (absent from Saccharomyces cerevisiae), the
  omegasome/ER origin, the split of Atg8 into GABARAP and LC3 subfamilies,
  and EPG5 at fusion (no yeast ortholog). Representative members are the C.
  elegans protein (where the genetics of the metazoan-specific steps was
  worked out) and the human ortholog, each with a gene review. Human ATG101,
  ATG3, ATG4B and WDR45 (WIPI4) have no gene review here, so those roles are
  represented by the worm protein only.

  Relation to MODULE:phagophore_assembly_site. That module is yeast-centred
  and models the Atg17-Atg29-Atg31 scaffold, which animals lack (FIP200 takes
  its place in mammals), and the condensate biophysics of the PAS. This
  module models the same conserved activities at the level of families, and
  adds the metazoan-specific steps. MODULE:phagophore_organelle_contact_site
  models the ATG2 bridge and scramblases structurally; here they appear only
  as the lipid-supply part.

  Members noted but not modelled as annotons. ATG14 (worm EPG-8, a divergent
  homolog; human ATG14 Q6ZNE5), ATG12 (worm LGG-3), FIP200/RB1CC1, VMP1
  (EPG-3), EI24 (EPG-4), ATG-16.1, ATG-4.2, VPS-39/HOPS, RAB7, STX17-SNAP29
  and the worm scaffold EPG-7. ATG-4.2 acts mainly at the
  delipidation/maturation stage (PMID:22767594) and would be a separate
  annoton if modelled.

  BEC-1 also acts in the PI3KC3-C2 complex in endosome-to-Golgi retrograde
  transport and phagosome maturation (PMID:21183797). ATG-18, EPG-5 and LGG-1
  also act in phagocytes to degrade apoptotic corpses (PMID:22451698). These
  roles are noted in the gene reviews and are outside this module.

  Lipidation nuance. In C. elegans, LGG-1 cleavage, not PE conjugation, is
  essential for autophagosome initiation (PMID:37395461), and in human cells
  autophagosomes still form without any Atg8 protein (PMID:27864321). The
  Atg8-family annotons keep phosphatidylethanolamine binding as their MF to
  match the gene review core functions, and this caveat is recorded as a
  knowledge gap.
module:
  id: metazoan_autophagosome_biogenesis
  label: Metazoan autophagosome biogenesis and maturation
  module_type: BIOLOGICAL_PROCESS
  description: >-
    ULK1-complex initiation, PI3KC3-C1 nucleation, PI3P effector recruitment,
    ATG2/ATG9 lipid supply, Atg8 conjugation and membrane anchoring, cargo
    recruitment and EPG5-dependent fusion of autophagosomes with lysosomes in
    animals.
  concepts:
    - preferred_term: macroautophagy
      term:
        id: GO:0016236
        label: macroautophagy
  context:
    taxa:
      - preferred_term: Metazoa
        term:
          id: NCBITaxon:33208
          label: Metazoa
        description: >-
          Representatives are C. elegans and human. The metazoan-specific
          steps (ATG101, GABARAP/LC3 split, EPG5) hold in both lineages.
    cellular_components:
      - preferred_term: cytoplasm
        term:
          id: GO:0005737
          label: cytoplasm
  parts:
    - order: 1
      role: initiation by the Atg1/ULK1 kinase complex
      node:
        id: ulk1_initiation
        label: ULK1-ATG13-ATG101 initiation complex
        module_type: PROTEIN_COMPLEX
        description: >-
          The Atg1/ULK1 kinase, ATG13 and ATG101 form the most upstream
          autophagy-specific complex. ATG13 binds the kinase and links it to
          the scaffold FIP200 in mammals; ATG101 binds ATG13. ATG101 is
          present in animals but absent from budding yeast. In C. elegans the
          complex is UNC-51, ATG-13 (EPG-1) and EPG-9.
        concepts:
          - preferred_term: Atg1/ULK1 kinase complex
            term:
              id: GO:1990316
              label: Atg1/ULK1 kinase complex
        annotons:
          - id: ulk_kinase
            label: Atg1/ULK1 serine/threonine kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Atg1/ULK1 kinases
                term:
                  id: PANTHER:PTHR24348
                  label: SERINE/THREONINE-PROTEIN KINASE UNC-51-RELATED
                representative_members:
                  - preferred_term: UNC-51 (C. elegans)
                    term:
                      id: UniProtKB:Q23023
                      label: Serine/threonine-protein kinase unc-51
                  - preferred_term: ULK1 (human)
                    term:
                      id: UniProtKB:O75385
                      label: Serine/threonine-protein kinase ULK1
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              description: >-
                Autophagy role only. UNC-51 also acts in axon guidance, which
                is outside this module (unc-51 gene review).
            processes:
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            role_description: >-
              Initiating kinase that phosphorylates downstream autophagy
              proteins once mTOR inhibition is relieved.
            evidence:
              - source_id: PMID:19225151
                title: ULK-Atg13-FIP200 complexes mediate mTOR signaling to the autophagy machinery.
                statement: Human ATG13 links ULK1/2 to FIP200 and activates ULK.
                supporting_text: >-
                  The mammalian Atg13 binds both ULK1 and ULK2 and mediates the
                  interaction of the ULK proteins with FIP200.
              - source_id: PMID:19377305
                title: epg-1 functions in autophagy-regulated processes and may encode a highly divergent Atg13 homolog in C. elegans.
                statement: The worm Atg13 homolog EPG-1 binds UNC-51.
                supporting_text: >-
                  epg-1 displays a similar expression pattern to, and directly
                  interacts with, the C. elegans Atg1 homolog UNC-51
          - id: atg13_regulator
            label: ATG13 kinase regulatory subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: ATG13 proteins
                term:
                  id: PANTHER:PTHR13430
                  label: FAMILY NOT NAMED
                representative_members:
                  - preferred_term: ATG-13/EPG-1 (C. elegans)
                    term:
                      id: UniProtKB:P34379
                      label: Autophagy-related protein 13 homolog
                  - preferred_term: ATG13 (human)
                    term:
                      id: UniProtKB:O75143
                      label: Autophagy-related protein 13
            function:
              preferred_term: protein kinase regulator activity
              term:
                id: GO:0019887
                label: protein kinase regulator activity
              description: >-
                Stabilises and activates the ULK kinase. ATG13 is a subunit of
                the ULK1 complex, not of the PI3K complex.
            processes:
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            role_description: >-
              Regulatory subunit that binds the kinase and the other complex
              subunits (FIP200 in mammals, ATG101).
            evidence:
              - source_id: PMID:19225151
                title: ULK-Atg13-FIP200 complexes mediate mTOR signaling to the autophagy machinery.
                statement: ATG13 binding stabilises and activates ULK and is needed for autophagosome formation.
                supporting_text: >-
                  The binding of Atg13 stabilizes and activates ULK and
                  facilitates the phosphorylation of FIP200 by ULK, whereas
                  knockdown of Atg13 inhibits autophagosome formation.
              - source_id: PMID:19377305
                title: epg-1 functions in autophagy-regulated processes and may encode a highly divergent Atg13 homolog in C. elegans.
                statement: EPG-1 is a divergent worm Atg13 that binds UNC-51.
                supporting_text: >-
                  suggesting that epg-1 encodes a divergent functional homolog
                  of Atg13 in C. elegans
          - id: atg101_subunit
            label: ATG101 subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: ATG101 proteins
                term:
                  id: PANTHER:PTHR13292
                  label: AUTOPHAGY-RELATED PROTEIN 101
                representative_members:
                  - preferred_term: EPG-9 (C. elegans)
                    term:
                      id: UniProtKB:Q95XH2
                      label: Autophagy-related protein 101
            function:
              preferred_term: protein kinase binding
              term:
                id: GO:0019901
                label: protein kinase binding
              description: >-
                As in the epg-9 gene review core function; EPG-9 binds ATG-13
                within the kinase complex.
            processes:
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            role_description: >-
              Animal-specific subunit (absent from budding yeast) that binds
              ATG13; its loss phenocopies loss of the kinase.
            evidence:
              - source_id: PMID:22885670
                title: The C. elegans ATG101 homolog EPG-9 directly interacts with EPG-1/Atg13 and is essential for autophagy.
                statement: EPG-9 binds EPG-1/Atg13 and its mutants resemble unc-51 and epg-1 mutants.
                supporting_text: >-
                  epg-9 mutants exhibit autophagy phenotypes characteristic of
                  those associated with loss of function of unc-51/Atg1 and
                  epg-1/Atg13. epg-9 encodes a protein with significant
                  homology to mammalian ATG101. EPG-9 directly interacts with
                  EPG-1/Atg13.
    - order: 2
      role: autophagic membrane nucleation by the class III PI3K complex I
      node:
        id: pi3k_nucleation
        label: PI3KC3-C1 nucleation (VPS34, VPS15, Beclin 1)
        module_type: PROTEIN_COMPLEX
        description: >-
          The class III PI3K complex I (VPS34, VPS15, Beclin 1 and ATG14)
          makes PI3P on ER-associated omegasomes and phagophores. VPS34 is the
          catalytic subunit; VPS15 is a pseudokinase that contributes to the
          activity of the complex; Beclin 1 is the scaffold. ATG14 (EPG-8 in
          C. elegans, a divergent homolog that binds BEC-1) directs the
          complex to autophagy. A second complex with UVRAG instead of ATG14
          (PI3KC3-C2) acts in endocytic trafficking and is outside this
          module.
        concepts:
          - preferred_term: phosphatidylinositol 3-kinase complex, class III, type I
            term:
              id: GO:0034271
              label: phosphatidylinositol 3-kinase complex, class III, type I
        annotons:
          - id: vps34_kinase
            label: VPS34 phosphatidylinositol 3-kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: VPS34 class III PI3K catalytic subunits
                term:
                  id: PANTHER:PTHR10048:SF7
                  label: PHOSPHATIDYLINOSITOL 3-KINASE CATALYTIC SUBUNIT TYPE 3
                representative_members:
                  - preferred_term: VPS-34/LET-512 (C. elegans)
                    term:
                      id: UniProtKB:Q9TXI7
                      label: Phosphatidylinositol 3-kinase catalytic subunit type 3
                  - preferred_term: PIK3C3/VPS34 (human)
                    term:
                      id: UniProtKB:Q8NEB9
                      label: Phosphatidylinositol 3-kinase catalytic subunit type 3
            function:
              preferred_term: 1-phosphatidylinositol-3-kinase activity
              term:
                id: GO:0016303
                label: 1-phosphatidylinositol-3-kinase activity
              substrates:
                - preferred_term: 1-phosphatidyl-1D-myo-inositol
              products:
                - preferred_term: 1-phosphatidyl-1D-myo-inositol 3-phosphate
            processes:
              - preferred_term: phosphatidylinositol-3-phosphate biosynthetic process
                term:
                  id: GO:0036092
                  label: phosphatidylinositol-3-phosphate biosynthetic process
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            role_description: >-
              Catalytic subunit that makes PI3P at the site of autophagosome
              formation. Its activity depends on Beclin 1.
            evidence:
              - source_id: PMID:11927551
                title: 'Membrane transport in Caenorhabditis elegans: an essential role for VPS34 at the nuclear membrane.'
                statement: Immunopurified worm VPS-34 phosphorylates PtdIns to PtdIns 3-P.
                supporting_text: >-
                  The anti- Ce VPS34 immunoprecipitate displayed a lipid kinase
                  activity towards PtdIns, yielding PtdIns 3-P as a product.
              - source_id: PMID:16111945
                title: Inactivation of the autophagy gene bec-1 triggers apoptotic cell death in C. elegans.
                statement: >-
                  BEC-1 is needed for the function of the class III PI3K
                  LET-512/VPS-34, which is required for autophagy.
                supporting_text: >-
                  We demonstrate that BEC-1 is necessary for the function of
                  the class III PI3 kinase LET-512/Vps34, an essential protein
                  required for autophagy, membrane trafficking, and endocytosis.
          - id: vps15_pseudokinase
            label: VPS15 pseudokinase regulatory subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: VPS15/PIK3R4 proteins
                term:
                  id: PANTHER:PTHR17583
                  label: PHOSPHOINOSITIDE 3-KINASE REGULATORY SUBUNIT 4
                representative_members:
                  - preferred_term: VPS-15 (C. elegans)
                    term:
                      id: UniProtKB:Q23669
                      label: Serine/threonine-protein
                  - preferred_term: PIK3R4/VPS15 (human)
                    term:
                      id: UniProtKB:Q99570
                      label: Phosphoinositide 3-kinase regulatory subunit 4
            function:
              preferred_term: 1-phosphatidylinositol-3-kinase activity
              term:
                id: GO:0016303
                label: 1-phosphatidylinositol-3-kinase activity
              description: >-
                contributes_to: VPS15 is a pseudokinase that does not itself
                phosphorylate lipids. It binds VPS34, raises its activity and
                regulates the complex, so the worm and human gene reviews
                record it as contributing to the catalytic activity of the
                complex.
            processes:
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            role_description: >-
              Pseudokinase subunit that stabilises VPS34 and controls the
              activity of the complex on membranes.
            evidence:
              - source_id: PMID:8999962
                title: Characterization of p150, an adaptor protein for the human phosphatidylinositol (PtdIns) 3-kinase. Substrate presentation by phosphatidylinositol transfer protein to the p150.Ptdins 3-kinase complex.
                statement: Human p150/VPS15 binds VPS34 and raises its lipid kinase activity.
                supporting_text: >-
                  Recombinant p150 associated with PtdIns 3-kinase in vitro in
                  a stable manner
              - source_id: PMID:26783301
                title: Negative regulation of phosphatidylinositol 3-phosphate levels in early-to-late endosome conversion.
                statement: In C. elegans the class III PI3K complex is VPS-34, BEC-1 and VPS-15.
                supporting_text: >-
                  the class III PI3K complex, which is composed of VPS-34,
                  BEC-1, and VPS-15/p150
          - id: beclin_scaffold
            label: Beclin 1 class III PI3K complex adaptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Beclin 1 proteins
                term:
                  id: PANTHER:PTHR12768
                  label: BECLIN 1
                representative_members:
                  - preferred_term: BEC-1 (C. elegans)
                    term:
                      id: UniProtKB:Q22592
                      label: Beclin homolog
                  - preferred_term: BECN1 (human)
                    term:
                      id: UniProtKB:Q14457
                      label: Beclin-1
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
              description: >-
                Links VPS34-VPS15 to the autophagy-specific subunit ATG14
                (EPG-8 in C. elegans). Beclin 1 also binds BCL-2 family
                proteins (CED-9 in C. elegans), which is outside this module.
            processes:
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            role_description: >-
              Non-catalytic scaffold that holds together the autophagy-specific
              class III PI3K complex.
            evidence:
              - source_id: PMID:21116129
                title: The coiled-coil domain protein EPG-8 plays an essential role in the autophagy pathway in C. elegans.
                statement: >-
                  EPG-8, a divergent Atg14 homolog, binds BEC-1 directly.
                supporting_text: >-
                  EPG-8 directly interacts with the C. elegans Beclin 1
                  homolog, BEC-1. Our study demonstrates that epg-8 may
                  function as a highly divergent homolog of the yeast autophagy
                  gene Atg14.
              - source_id: PMID:12958363
                title: Autophagy genes are essential for dauer development and life-span extension in C. elegans.
                statement: >-
                  bec-1 is the worm ortholog of APG6/VPS30/beclin 1 and is
                  required for dauer morphogenesis and lifespan extension.
                supporting_text: >-
                  bec-1, the C. elegans ortholog of the yeast and mammalian
                  autophagy gene APG6/VPS30/beclin1, is essential for normal
                  dauer morphogenesis and life-span extension
    - order: 3
      role: PI3P effector recruitment to early autophagic membranes
      node:
        id: pi3p_effector
        label: WIPI/PROPPIN PI3P effectors
        module_type: MOLECULAR_FUNCTION
        description: >-
          Two kinds of WD40 PROPPIN bind PI3P through an FRRG motif. WIPI1/2
          type proteins (C. elegans ATG-18, human WIPI2) recruit the
          ATG12-ATG5-ATG16 complex and act in autophagosome formation.
          WIPI3/4-type proteins (C. elegans EPG-6, human WDR45/WIPI4) bind ATG2
          and form the ATG2-ATG18 complex that moves omegasomes forward to
          autophagosomes. Both kinds belong to one PANTHER family; the split
          is a subfamily (paralog) split.
        annotons:
          - id: wipi12_pi3p_binding
            label: WIPI1/2-type PI3P effector
            participant:
              selector_type: FAMILY
              family:
                preferred_term: WIPI1/2-type PROPPINs (Atg18 clade)
                term:
                  id: PANTHER:PTHR11227
                  label: WD-REPEAT PROTEIN INTERACTING WITH PHOSPHOINOSIDES  WIPI -RELATED
                description: >-
                  The PANTHER family also contains the WIPI3/4-type paralogs;
                  only the WIPI1/2 clade fills this role.
                representative_members:
                  - preferred_term: ATG-18 (C. elegans)
                    term:
                      id: UniProtKB:O16466
                      label: Autophagy-related protein 18
                  - preferred_term: WIPI2 (human)
                    term:
                      id: UniProtKB:Q9Y4P8
                      label: WD repeat domain phosphoinositide-interacting protein 2
            function:
              preferred_term: phosphatidylinositol-3-phosphate binding
              term:
                id: GO:0032266
                label: phosphatidylinositol-3-phosphate binding
              description: >-
                WIPI2 also acts as an adaptor that recruits ATG16L1 (human
                WIPI2 gene review); PI3P binding is the activity shared with
                ATG-18.
            processes:
              - preferred_term: autophagosome assembly
                term:
                  id: GO:0000045
                  label: autophagosome assembly
            locations:
              - preferred_term: phagophore assembly site
                term:
                  id: GO:0000407
                  label: phagophore assembly site
            role_description: >-
              Reads PI3P made by PI3KC3-C1 and recruits the Atg8 conjugation
              machinery.
            evidence:
              - source_id: PMID:20505359
                title: Mammalian Atg18 (WIPI2) localizes to omegasome-anchored phagophores and positively regulates LC3 lipidation.
                statement: WIPI2 is a PI3P effector needed to form LC3-positive autophagosomes.
                supporting_text: >-
                  WIPI2 is recruited to early autophagosomal structures along
                  with Atg16L and ULK1 and is required for the formation of
