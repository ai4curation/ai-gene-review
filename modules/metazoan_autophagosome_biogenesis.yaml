    - order: 6
      role: Atg8-family proteins on the autophagic membrane
      node:
        id: atg8_family
        label: GABARAP-type and LC3-type Atg8 proteins
        module_type: MOLECULAR_FUNCTION
        description: >-
          Animal Atg8 proteins fall into GABARAP and LC3 subfamilies (one each
          in C. elegans, LGG-1 and LGG-2; three each in human). Both are
          conjugated to phosphatidylethanolamine and bind LIR-containing
          receptors and autophagy proteins. Both subfamilies are in one
          PANTHER family. The stage at which each subfamily acts differs
          between lineages and is modelled as a variant set. Human cells
          lacking all six Atg8 proteins still make autophagosomes, which are
          smaller, but fail to fuse them with lysosomes.
        variant_sets:
          - id: atg8_subfamily_staging
            label: Stage assignment of GABARAP-type and LC3-type Atg8 proteins
            axis: taxon / sequence lineage
            selection: EXACTLY_ONE
            notes: >-
              Both subfamilies are present in every variant; what differs is
              the step each subfamily is mainly needed for. The nematode and
              mammalian assignments are close to opposite for the
              GABARAP-type protein in early biogenesis.
            variants:
              - id: nematode_atg8_staging
                label: Nematode staging (GABARAP-type early, LC3-type late)
                module_type: MOLECULAR_FUNCTION
                description: >-
                  In C. elegans, LGG-1 (GABARAP-type) is processed and
                  lipidated first, is needed for autophagosome formation, and
                  is needed for LGG-2 (LC3-type) to reach autophagosomes.
                  LGG-2 then drives maturation and tethering to lysosomes
                  through the HOPS subunit VPS-39.
                annotons:
                  - id: lgg1_early
                    label: GABARAP-type LGG-1 in autophagosome formation
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: GABARAP-subfamily Atg8 proteins
                        term:
                          id: PANTHER:PTHR10969
                          label: MICROTUBULE-ASSOCIATED PROTEINS 1A/1B LIGHT CHAIN 3-RELATED
                        description: >-
                          PANTHER family covers both subfamilies; this role is
                          the GABARAP clade. Worm and human GABARAP-type
                          proteins sit in different PANTHER subfamilies, so the
                          role is grounded on the family.
                        representative_members:
                          - preferred_term: LGG-1 (C. elegans)
                            term:
                              id: UniProtKB:Q09490
                              label: Protein lgg-1
                    function:
                      preferred_term: phosphatidylethanolamine binding
                      term:
                        id: GO:0008429
                        label: phosphatidylethanolamine binding
                      description: >-
                        Covalent PE conjugation, as in the lgg-1 gene review
                        core function. The cleaved, non-lipidated form is
                        enough for autophagosome initiation, so PE conjugation
                        mainly helps recognise cargo and degrade
                        autophagosomes (PMID:37395461).
                    processes:
                      - preferred_term: autophagosome assembly
                        term:
                          id: GO:0000045
                          label: autophagosome assembly
                    locations:
                      - preferred_term: autophagosome membrane
                        term:
                          id: GO:0000421
                          label: autophagosome membrane
                    role_description: >-
                      Marks the growing autophagic membrane and acts upstream
                      of LGG-2.
                    evidence:
                      - source_id: PMID:37395461
                        title: LGG-1/GABARAP lipidation is not required for autophagy and development in Caenorhabditis elegans.
                        statement: >-
                          Cleavage of LGG-1 into form I is essential for
                          autophagosome initiation; lipidated form II helps
                          recognise cargo and degrade autophagosomes.
                        supporting_text: >-
                          The cleavage of LGG-1 into form I is essential for
                          autophagosome initiation and biogenesis while form II
                          is involved in cargo recognition and autophagosome
                          degradation.
                      - source_id: PMID:20523114
                        title: The autophagosomal protein LGG-2 acts synergistically with LGG-1 in dauer formation and longevity in C. elegans.
                        statement: LGG-1, but not LGG-2, functionally complements yeast atg8.
                        supporting_text: >-
                          LGG-1 but not LGG-2 is able to functionally complement
                          the atg8 mutant yeast.
                      - source_id: PMID:26687600
                        title: Structural Basis of the Differential Function of the Two C. elegans Atg8 Homologs, LGG-1 and LGG-2, in Autophagy.
                        statement: >-
                          LGG-1 is essential for aggregate degradation, while
                          LGG-2 has cargo- and stage-specific roles.
                        supporting_text: >-
                          lgg-1 is essential for degradation of protein
                          aggregates, while lgg-2 has cargo-specific and
                          developmental-stage-specific roles in aggregate
                          degradation.
                  - id: lgg2_late
                    label: LC3-type LGG-2 in autophagosome maturation
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: LC3-subfamily Atg8 proteins
                        term:
                          id: PANTHER:PTHR10969
                          label: MICROTUBULE-ASSOCIATED PROTEINS 1A/1B LIGHT CHAIN 3-RELATED
                        description: >-
                          PANTHER family covers both subfamilies; this role is
                          the LC3 clade. LGG-2 has its own PANTHER subfamily,
                          separate from human LC3B, so the role is grounded on
                          the family.
                        representative_members:
                          - preferred_term: LGG-2 (C. elegans)
                            term:
                              id: UniProtKB:Q23536
                              label: Protein lgg-2
                    function:
                      preferred_term: phosphatidylethanolamine binding
                      term:
                        id: GO:0008429
                        label: phosphatidylethanolamine binding
                      description: >-
                        C-terminal glycine PE conjugation, which LGG-2 needs to
                        localise to autophagosomes (lgg-2 gene review core
                        function).
                    processes:
                      - preferred_term: autophagosome maturation
                        term:
                          id: GO:0097352
                          label: autophagosome maturation
                      - preferred_term: autophagosome-lysosome fusion
                        term:
                          id: GO:0061909
                          label: autophagosome-lysosome fusion
                    locations:
                      - preferred_term: autophagosome membrane
                        term:
                          id: GO:0000421
                          label: autophagosome membrane
                    role_description: >-
                      Acts after LGG-1 and helps tether autophagosomes to
                      lysosomes through VPS-39.
                    evidence:
                      - source_id: PMID:24374177
                        title: The C. elegans LC3 acts downstream of GABARAP to degrade autophagosomes by interacting with the HOPS subunit VPS39.
                        statement: >-
                          LGG-1 is needed for LGG-2 localisation; LGG-2
                          controls maturation and binds VPS-39.
                        supporting_text: >-
                          LGG-1 acts upstream of LGG-2 to allow its
                          localization to autophagosomes. LGG-2 controls the
                          maturation of LGG-1-positive autophagosomes and
                          facilitates the tethering with the lysosomes through
                          a direct interaction with the VPS-39 HOPS complex
                          subunit.
                      - source_id: PMID:20523114
                        title: The autophagosomal protein LGG-2 acts synergistically with LGG-1 in dauer formation and longevity in C. elegans.
                        statement: The C-terminal glycine of LGG-2 is needed for its modification and autophagosome localisation.
                        supporting_text: >-
                          The C-terminal glycine residue of LGG-2 is essential
                          for post-translational modification and localization
                          to the autophagosomes.
                connections:
                  - source: lgg1_early
                    target: lgg2_late
                    connection_type: PRECEDES
                    description: LGG-1 is needed for LGG-2 to localise to autophagosomes.
              - id: mammalian_atg8_staging
                label: Mammalian staging (LC3 in phagophore elongation, GABARAP at fusion)
                module_type: MOLECULAR_FUNCTION
                description: >-
                  In mammalian cells, the LC3 subfamily acts in elongation of
                  the phagophore, and the GABARAP subfamily acts later. Gene
                  knockouts show that the GABARAP subfamily recruits PLEKHM1
                  and governs autophagosome-lysosome fusion and PINK1/Parkin
                  mitophagy, while the LC3 subfamily has a smaller role.
                annotons:
                  - id: lc3_elongation
                    label: LC3-subfamily Atg8 in phagophore elongation
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: LC3-subfamily Atg8 proteins
                        term:
                          id: PANTHER:PTHR10969
                          label: MICROTUBULE-ASSOCIATED PROTEINS 1A/1B LIGHT CHAIN 3-RELATED
                        representative_members:
                          - preferred_term: MAP1LC3B (human)
                            term:
                              id: UniProtKB:Q9GZQ8
