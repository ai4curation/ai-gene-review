      description: >-
        Cargo receptors bind Atg8-family proteins through LIR motifs and bring
        cargo into the forming autophagosome.
    - source: atg8_family
      target: maturation_fusion
      connection_type: PRECEDES
      description: >-
        Atg8-family proteins on the closed autophagosome are needed for
        fusion; EPG5 binds them on the autophagosome.
      evidence:
        - source_id: PMID:27864321
          title: >-
            Atg8 family LC3/GABARAP proteins are crucial for
            autophagosome-lysosome fusion but not autophagosome formation
            during PINK1/Parkin mitophagy and starvation.
          statement: Atg8 proteins are dispensable for autophagosome formation but essential for fusion.
          supporting_text: >-
            We show that Atg8s are dispensable for autophagosome formation and
            selective engulfment of mitochondria, but essential for
            autophagosome-lysosome fusion.
knowledge_gaps:
  - gap_statement: >-
      What Atg8-family proteins do in autophagosome formation, if their PE
      conjugation is not required for it, is unknown. In C. elegans, cleaved
      but non-lipidated LGG-1 supports autophagosome initiation, and in human
      cells autophagosomes still form without any Atg8 protein, though they
      are smaller.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Conflicts with the standard model in which Atg8 lipidation drives
      phagophore expansion, and affects how the Atg8-family MF should be
      described.
    resolution: >-
      Identify the binding partners of LGG-1(G116A) form I on nascent
      autophagic membranes, and image phagophore expansion in lgg-1(G116A)
      embryos and Atg8-null human cells at high resolution.
    provenance:
      - reference_id: PMID:37395461
        supporting_text: >-
          The cleavage of LGG-1 into form I is essential for autophagosome
          initiation and biogenesis while form II is involved in cargo
          recognition and autophagosome degradation.
      - reference_id: PMID:27864321
        supporting_text: >-
          Although neither GABARAPs nor LC3s are required for autophagosome
          biogenesis, loss of all Atg8s yields smaller autophagosomes and a
          slowed initial rate of autophagosome formation.
  - gap_statement: >-
      Why the GABARAP-type Atg8 protein is needed early in nematodes but
      mainly at fusion in mammalian cells is unknown, as is whether this
      reflects different binding partners or different numbers of paralogs.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether stage-specific roles of the two Atg8 subfamilies can be
      transferred between animal lineages.
    resolution: >-
      Swap LGG-1 and LGG-2 for human GABARAP and LC3B in C. elegans and test
      which steps each rescues; compare the LIR partners of each subfamily in
      both species.
    provenance:
      - reference_id: PMID:24374177
        supporting_text: >-
          LGG-1 acts upstream of LGG-2 to allow its localization to
          autophagosomes.
      - reference_id: PMID:20418806
        supporting_text: >-
          our results indicate that LC3s are involved in elongation of the
          phagophore membrane whereas the GABARAP/GATE-16 subfamily is
          essential for a later stage in autophagosome maturation.
  - gap_statement: >-
      How ATG-18 and EPG-6, two PI3P-binding PROPPINs, divide the work of
      autophagosome formation in C. elegans is unclear. It is also unknown
      whether ATG-18 joins a lipid-transfer complex with ATG-2 as yeast
      Atg18 does.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether the yeast Atg2-Atg18 bridge maps onto WIPI1/2-type
      or WIPI3/4-type proteins in animals.
    resolution: >-
      Compare ATG-2 binding and membrane-tethering activity of ATG-18 and
      EPG-6 in vitro, and map the step blocked in atg-18 versus epg-6
      mutants by electron microscopy.
    provenance:
      - reference_id: PMID:21802374
        supporting_text: >-
          EPG-6 directly interacts with ATG-2. epg-6 and atg-2 regulate
          progression of omegasomes to autophagosomes, and their loss of
          function causes accumulation of enlarged early autophagic
          structures.
