  notes: >-
    Scope and generalization: cytoplasmic D-glutamate and D-alanine supply and
    D-Ala-D-Ala ligation are conserved across peptidoglycan-synthesizing
    bacteria, so the module is species-neutral and grounded to PANTHER families
    and PAINT nodes, with E. coli K-12 (experimentally characterised MurI, Alr,
    DdlA and DdlB) and P. putida KT2440 as exemplars. Representative members are
    exemplars, not simultaneously required components. The two Ddl-family
    variants reflect resolved PANTHER subfamilies (SF25, SF23) and possible
    redundancy, not different reactions; genome-annotation names A and B do not
    reliably track the subfamily. A0A140FWM5 is a second KT2440 representative
    of the DdlB-like branch, supported by HAMAP, Rhea, domain, signature, and
    catalytic-site evidence despite its unreviewed status. The alanine racemase
    leaf uses the whole PTHR30511 family because no subfamily isolates the
    biosynthetic enzymes. D-glutamate and D-Ala-D-Ala converge downstream in the
    Mur ligase pathway (a separate module) but are not represented as a false
    linear chain. Some bacteria supply D-glutamate through D-amino acid
    transaminase instead of or in addition to MurI; that alternative is not
    modelled here.
  knowledge_gaps:
    - gap_statement: >-
        Pseudomonas putida KT2440 lacks an identified canonical cytoplasmic
        biosynthetic Alr assignment for the D-alanine-supply step.
      boundary: >-
        Q88GJ9 Alr/BSR is periplasmic, strongly favors lysine and arginine,
        and has no detected peptidoglycan contribution under tested
        conditions. Cytoplasmic Q88CB2 DadX is an experimentally verified,
        alanine-specific reversible racemase and is the leading candidate,
        but its direct physiological contribution to peptidoglycan D-alanine
        supply has not been demonstrated. The KT2440 step therefore remains
        candidate-uncertain rather than covered.
      gap_kind:
        - BIOLOGY
        - CURATION
      provenance:
        - reference_id: PMID:23995642
          supporting_text: >-
            Conversely, the putative catabolic alanine racemase DadX showed narrow substrate specificity, clearly preferring only the alanine stereoisomers as the substrates.
        - reference_id: PMID:30008699
          supporting_text: >-
            We found no evidence to suggest that any products of Alr activity were incorporated into peptidoglycan
