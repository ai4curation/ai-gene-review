id: MODULE:d_amino_acid_cell_wall_precursor_supply
title: D-amino-acid supply for peptidoglycan precursor biosynthesis
description: >-
  A species-neutral bacterial precursor-supply module that produces D-glutamate
  and D-alanine from their L-enantiomers and ligates two D-alanine molecules to
  form D-Ala-D-Ala. Glutamate racemase (MurI) supplies D-glutamate, a
  pyridoxal 5'-phosphate-dependent alanine racemase supplies D-alanine, and an
  ATP-grasp D-alanine--D-alanine ligase (Ddl) forms the dipeptide. These
  products feed the cytoplasmic Mur ligase pathway for peptidoglycan
  stem-peptide assembly. The module ends at free D-glutamate and D-Ala-D-Ala
  and excludes their incorporation by MurD and MurF, downstream lipid II
  synthesis, polymerization, cross-linking, D-amino-acid catabolism,
  periplasmic broad-specificity racemase metabolism, and L,D-transpeptidase
  peptidoglycan remodeling.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009252
    title: peptidoglycan biosynthetic process
    statement: >-
      GO:0009252 supplies the biological-process context for the D-glutamate
      and D-Ala-D-Ala precursors produced by this module; it is accepted on the
      E. coli K-12 and P. putida KT2440 MurI and Ddl gene reviews used as
      exemplars.
  - source_id: PMID:8098327
    title: The murI gene of Escherichia coli is an essential gene that encodes a glutamate racemase activity.
    statement: >-
      Establishes E. coli MurI as an essential glutamate racemase required for
      the D-glutamate of peptidoglycan.
  - source_id: PMID:11267762
    title: Characterization of the alanine racemases from two mycobacteria.
    statement: >-
      Shows that an E. coli alr dadX double mutant requires D-alanine and that
      mycobacterial alanine racemases complement it, supporting a conserved
      cytoplasmic D-alanine-supply step across bacterial lineages.
  - source_id: PMID:1993184
    title: >-
      Existence of two D-alanine:D-alanine ligases in Escherichia coli: cloning
      and sequencing of the ddlA gene and purification and characterization of
      the DdlA and DdlB enzymes.
    statement: >-
      Establishes the two E. coli D-Ala-D-Ala ligases, DdlA and DdlB, that
      exemplify the two Ddl PANTHER subfamilies modelled as variants here.
  - source_id: PMID:30008699
    title: A Broad Spectrum Racemase in Pseudomonas putida KT2440 Plays a Key Role in Amino Acid Catabolism.
    statement: >-
      The KT2440 Alr/BSR study establishes that measurable alanine racemase
      activity alone is insufficient to assign a physiological cytoplasmic
      D-alanine-supply role because Q88GJ9 is periplasmic and functions
      primarily in basic-amino-acid catabolism.
  - source_id: PMID:23995642
    title: Amino acid racemization in Pseudomonas putida KT2440
    statement: >-
      The comparative racemase study establishes the unusual division between
      an alanine-specific DadX and a periplasmic broad-spectrum Alr in KT2440.
