  notes: >-
    The module is species-neutral. Exact PSEPK proteins are representative
    members only where current evidence supports their chemistry. The two
    Ddl-family variants reflect resolved PANTHER subfamilies and possible
    redundancy, not different reactions. A0A140FWM5 is a second PSEPK
    representative of the DdlB-like branch, supported by HAMAP, Rhea, domain,
    signature, and catalytic-site evidence despite its unreviewed status.
    D-glutamate and D-Ala-D-Ala converge downstream
    in the Mur ligase pathway but are not represented as a false linear chain.
  knowledge_gaps:
    - gap_statement: >-
        Pseudomonas putida KT2440 lacks an identified canonical cytoplasmic
        biosynthetic Alr assignment for the D-alanine-supply step.
      boundary: >-
        Q88GJ9 Alr/BSR is periplasmic, strongly favors lysine and arginine,
        and has no detected peptidoglycan contribution under tested
        conditions. Cytoplasmic Q88CB2 DadX is an experimentally verified,
        alanine-specific reversible racemase and is the leading candidate,
        but its direct physiological contribution to peptidoglycan D-alanine
        supply has not been demonstrated. The PSEPK step therefore remains
        candidate-uncertain rather than covered.
      gap_kind:
        - BIOLOGY
        - CURATION
      provenance:
        - reference_id: PMID:23995642
          supporting_text: >-
            Conversely, the putative catabolic alanine racemase DadX showed narrow substrate specificity, clearly preferring only the alanine stereoisomers as the substrates.
        - reference_id: PMID:30008699
          supporting_text: >-
            We found no evidence to suggest that any products of Alr activity were incorporated into peptidoglycan
