  knowledge_gaps:
    - gap_statement: >-
        GO:0016120 carotene biosynthetic process (and its children phytoene
        biosynthetic process GO:1901174 and lycopene biosynthetic process
        GO:1901177) is not a descendant of GO:0016117 carotenoid biosynthetic
        process, even though carotenes are hydrocarbon carotenoids and
        beta-carotene biosynthetic process GO:1901812 is placed under
        GO:0016117.
      boundary: >-
        Both terms are asserted as module concepts so the module is reachable
        from either branch; no annotation is remapped on the basis of this
        inconsistency.
      gap_kind:
        - ONTOLOGY
      status: OPEN
      significance: >-
        Annotations to PSY, PDS, ZDS or CRTISO made with carotene-level terms
        are not inferred to carotenoid biosynthetic process, so GOA queries by
        GO:0016117 under-retrieve the pathway enzymes.
      resolution: >-
        Propose an is_a link from GO:0016119 carotene metabolic process to
        GO:0016116 carotenoid metabolic process (and correspondingly for the
        biosynthetic and catabolic children) in the GO ontology tracker.
      provenance:
        - reference_id: GO:0016120
          supporting_text: >-
            The chemical reactions and pathways resulting in the formation of carotenes, hydrocarbon carotenoids.
          reference_section_type: DATABASE_ENTRY
    - gap_statement: >-
        Additional lycopene cyclase families are known (heterodimeric
        CrtYc/CrtYd of actinobacteria and archaea, and the CruA/CruP cyclases
        of green sulfur bacteria and some cyanobacteria) but are not grounded
        here because no reviewed exemplar with a PANTHER assignment or cached
        gene review was verified in this session.
      boundary: >-
        The beta_cyclase_implementation variant set is left ONE_OR_MORE and
        open to additional variants; no identifiers are guessed for them.
      gap_kind:
        - CURATION
      status: OPEN
      significance: >-
        Without these variants the module cannot be satisfied for lineages
        whose only beta cyclase is CrtYc/CrtYd or CruA/CruP.
      resolution: >-
        Add variants once reviewed UniProt exemplars and their PANTHER
        families are confirmed, ideally alongside gene reviews.
      provenance:
        - reference_id: PMID:24175570
          supporting_text: >-
            Gram-positive bacteria, archaea and halophilic bacteria employ a heterodimeric β-cyclase encoded by two different genes CrtYc and CrtYd.
          reference_section_type: LITERATURE_REVIEW
        - reference_id: PMID:24175570
          supporting_text: >-
            tepidum utilizes a novel β-cyclase enzyme, CruA, which converts lycopene to γ-carotene and very low amounts of β-carotene.
          reference_section_type: LITERATURE_REVIEW
    - gap_statement: >-
        PANTHER's classification of the homologous LCYB/CrtL/LCYE lycopene
        cyclases is split: cyanobacterial CrtL (Q55276) and plant LCYE (Q38932)
        sit in the unnamed family PTHR39757 (SF5 and SF3), whereas PANTHER's
        per-organism classification places Arabidopsis LCYB (Q38933) in
        PTHR43876:SF15, a subfamily of a family named for the COQ6
        monooxygenase, while UniProt cross-references the same protein to
        PTHR39757:SF5.
      boundary: >-
        Two family descriptors carry the LCYB/CrtL role so that each reviewed
        exemplar is grounded in the family PANTHER's own classification
        assigns it; no PAINT ancestral node is asserted for either.
      gap_kind:
        - CURATION
      status: OPEN
      significance: >-
        Family-based satisfiability checks for plant beta-cyclases will miss
        members unless both PANTHER families are consulted.
      resolution: >-
        Check PANTHER's family boundaries for the FAD-dependent lycopene
        cyclase clade, and consolidate to a single descriptor if a future
        PANTHER release places LCYB and CrtL together.
      provenance:
        - reference_id: file:interpro/panther/panther-members.tsv
          supporting_text: "Q38933\tPTHR43876:SF15"
          reference_section_type: DATABASE_ENTRY
        - reference_id: UniProtKB:Q38933
          supporting_text: "PTHR39757:SF5"
          reference_section_type: DATABASE_ENTRY
    - gap_statement: >-
        In the poly-cis route, light-driven photoisomerization can substitute
        for Z-ISO and CRTISO in illuminated photosynthetic tissue, so the two
        isomerase steps are enzymatically required only in the dark or in
        non-photosynthetic tissue.
      boundary: >-
        The isomerization steps are modeled as required parts of the route
        because the chemical transformation is always required; the enzyme
        dispensability under light is recorded in the step descriptions and
        not as an optional part.
      gap_kind:
        - BIOLOGY
        - CURATION
      status: OPEN
      significance: >-
        Affects whether a lineage lacking a Z-ISO or CRTISO ortholog should be
        judged as failing to satisfy the module.
      resolution: >-
        Record per-lineage evidence for isomerase presence and phenotype when
        the module is instantiated for a concrete species.
      provenance:
        - reference_id: PMID:24175570
          supporting_text: >-
            Desaturation by PDS is followed by the isomerization of the 15-cis bond of ζ-carotene to trans, which can be mediated either by light or by the Z-ISO isomerase.
          reference_section_type: LITERATURE_REVIEW
        - reference_id: PMID:24175570
          supporting_text: >-
            A mutant in the Z-ISO gene of maize, referred to as pale yellow 9 (y9), was shown to accumulate 9,15,9′-tri-cis-ζ-carotene in dark tissues indicating a possible impairment in the light-independent mechanism of isomerization of the 15-cis bond.
          reference_section_type: LITERATURE_REVIEW
