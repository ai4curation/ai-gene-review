          - preferred_term: beta-carotene biosynthetic process
            term:
              id: GO:1901812
              label: beta-carotene biosynthetic process
            description: Two beta cyclizations of all-trans-lycopene.
          - preferred_term: alpha-carotene biosynthetic process
            term:
              id: GO:1901824
              label: alpha-carotene biosynthetic process
            description: One epsilon and one beta cyclization of all-trans-lycopene.
