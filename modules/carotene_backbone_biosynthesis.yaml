          six-membered rings. Two beta-ring cyclizations give gamma-carotene
          then beta-carotene. In plants an epsilon cyclase forms one epsilon
          ring (delta-carotene), and a beta cyclase then forms the other ring
          to give alpha-carotene; the beta and epsilon branches are the
          branch point between the beta,beta- and beta,epsilon-xanthophyll
          series.
