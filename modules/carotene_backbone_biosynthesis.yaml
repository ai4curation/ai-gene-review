id: MODULE:carotene_backbone_biosynthesis
title: Carotenoid biosynthesis I — carotene backbone (GGPP -> phytoene -> lycopene -> cyclic carotenes)
description: >-
  The carotene backbone segment of carotenoid biosynthesis converts two
  molecules of the C20 isoprenoid geranylgeranyl diphosphate (GGPP) into the
  C40 cyclic carotenes that seed every downstream carotenoid class. Phytoene
  synthase performs the head-to-head condensation that commits GGPP to
  carotenoids, giving 15-cis-phytoene. Phytoene is then desaturated to
  all-trans-lycopene by one of two mutually exclusive routes: a single
  FAD-dependent CrtI-type desaturase in most bacteria and fungi, or the
  four-enzyme poly-cis route of cyanobacteria and plants (PDS, Z-ISO, ZDS,
  CRTISO) in which two plastoquinone-dependent desaturases each introduce two
  double bonds and two isomerases convert the poly-cis intermediates to the
  all-trans product. Lycopene cyclases then form beta rings (giving gamma- and
  beta-carotene) or, in plants, one epsilon ring (giving delta- and
  alpha-carotene). Supply of GGPP, xanthophyll formation by ring hydroxylation
  and epoxidation, ketolation, and oxidative cleavage to apocarotenoids
  (retinal, abscisic acid, strigolactones, neurosporaxanthin) are outside this
  module.
status: DRAFT
evidence:
  - source_id: GO:0016117
    title: carotenoid biosynthetic process
    statement: >-
      GO:0016117 is the module-level process. The steps modeled here form the
      carotene backbone that every carotenoid biosynthetic pathway shares
      before branching into xanthophylls, ketocarotenoids, or apocarotenoids.
  - source_id: GO:0016120
    title: carotene biosynthetic process
    statement: >-
      GO:0016120 names the hydrocarbon-carotene product class of this module.
      In the current ontology it descends from isoprenoid biosynthetic process
      via carotene metabolic process and is not a descendant of GO:0016117
      carotenoid biosynthetic process, although beta-carotene biosynthetic
      process (GO:1901812) is; see knowledge_gaps.
  - source_id: KEGG:M00097
    title: Lycopene biosynthesis, geranylgeranyl-PP => lycopene
    statement: >-
      KEGG independently defines the same GGPP-to-lycopene boundary and the
      same two alternative desaturation routes: phytoene synthase followed by
      either the single CrtI-type desaturase (K10027/K15745) or the ordered
      PDS, Z-ISO, ZDS, CRTISO series (K02293, K15744, K00514, K09835).
  - source_id: KEGG:M01045
    title: Zeaxanthin biosynthesis, lycopene => beta-carotene => zeaxanthin
    statement: >-
      KEGG places lycopene beta-cyclase orthologs (K06443, K22502, K14605,
      K14606) as the lycopene-to-beta-carotene step, which is the cyclization
      part of this module; the subsequent hydroxylation to zeaxanthin is a
      xanthophyll step outside this module.
  - source_id: PMID:24175570
    title: Mechanistic aspects of carotenoid biosynthesis.
    statement: >-
      Comprehensive mechanistic review covering phytoene synthase chemistry,
      the CrtI versus PDS/ZDS/Z-ISO/CRTISO desaturation routes, and the
      lycopene cyclase families used to set the boundary of this module.
  - source_id: PMID:25578273
    title: Carotenoid metabolism in plants.
    statement: >-
      Plant-focused review of the plastid carotenoid pathway, including the
      poly-cis desaturation route, the beta/epsilon cyclase branch point, and
      the downstream xanthophyll and apocarotenoid branches excluded here.
  - source_id: PMID:15012246
    title: GENES AND ENZYMES OF CAROTENOID BIOSYNTHESIS IN PLANTS.
    statement: >-
      Classic review that established the plant pathway enzymes and their
      relationship to the bacterial crt genes used as exemplars in this module.
  - source_id: file:modules/carotene_backbone_biosynthesis-deep-research-openscientist.md
    title: OpenScientist carotene backbone biosynthesis module research
    statement: >-
      Module-level research supports the three-operation boundary (phytoene
      synthesis, four desaturations with isomerization, cyclization), the
      mutually exclusive but functionally interchangeable CrtI-type versus
      poly-cis desaturation routes (bacterial CrtI substitutes for the whole
      PDS/Z-ISO/ZDS/CRTISO set in planta), and at least four non-homologous
      cyclase families (CrtY, CrtL-type LCYB/LCYE, the fungal bifunctional
      synthase/cyclase, CruA/CruP). Manual assessment keeps GGPP supply, the
      ORANGE chaperone of PSY, the plastid terminal oxidase that re-oxidizes
      plastoquinone for the plant desaturases, xanthophyll formation and
      apocarotenoid cleavage outside the reusable core; identifiers in this
      module were verified against UniProt, PANTHER, Rhea, GO and the cached
      GO-CAM, not taken from the report.
notes: >-
  This reusable module is taxon-neutral at the root and records lineage
  differences in variant sets: the desaturation route (CrtI-type versus
  poly-cis) and the cyclase implementation (LCYB/CrtL-type, CrtY-type, or the
  fungal bifunctional phytoene synthase/lycopene cyclase). Representative
  members orient each family without restricting the module to those
  organisms. Grounding: Arabidopsis PSY1 (P37271), PDS (Q07356), Z-ISO
  (Q9SAC0), ZDS (Q38893), CRTISO (Q9M9Y8), LCYB (Q38933) and LCYE (Q38932);
  cyanobacterial pds/crtP (P26294), crtQ (P74306) and crtL (Q55276); Pantoea
  ananatis CrtB (P21683), CrtI (P21685) and CrtY (P21687); and Neurospora
  crassa al-2 (P37295) and al-1 (P21334), whose activities are also captured
  in the production GO-CAM 62f58d8800000065 (Carotenoid biosynthesis, N.
  crassa). PAINT ancestral nodes are cited only where a local PTHR42923
  IBD slice exists (PDS and ZDS). GGPP synthesis is covered by the
  isoprenoid_diphosphate_biosynthesis module; xanthophyll and apocarotenoid
  branches are deliberately excluded and are candidates for sibling modules.
module:
  id: carotene_backbone_biosynthesis
  label: Carotene backbone biosynthesis (GGPP -> phytoene -> lycopene -> cyclic carotenes)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: carotenoid biosynthetic process
      term:
        id: GO:0016117
        label: carotenoid biosynthetic process
      description: >-
        Formation of C40 carotenoids from GGPP; this module covers the shared
        carotene backbone up to the first cyclic carotenes.
    - preferred_term: carotene biosynthetic process
      term:
        id: GO:0016120
        label: carotene biosynthetic process
      description: >-
        The hydrocarbon carotenes (phytoene, lycopene, gamma-, beta-, delta-
        and alpha-carotene) are the products of this module.
    - preferred_term: beta-carotene biosynthetic process
      term:
        id: GO:1901812
        label: beta-carotene biosynthetic process
      description: >-
        Beta-carotene is the canonical end product of the beta-cyclization
        branch and the precursor of most xanthophylls and retinoids.
  context:
    cellular_components:
      - preferred_term: membrane
        term:
          id: GO:0016020
          label: membrane
        description: >-
          Phytoene synthase, the desaturases, the isomerases and the cyclases
          act on membrane-embedded hydrophobic substrates; the membrane is the
          plastid envelope or thylakoid in plants and cyanobacteria and the
          cytoplasmic membrane in other bacteria and fungi. Finer compartments
          are lineage-specific and are not asserted at the reusable root.
  parts:
    - order: 1
      role: Phytoene synthesis (commitment of GGPP to carotenoids)
      node:
        id: phytoene_synthesis
        label: Phytoene synthase step (2 GGPP -> 15-cis-phytoene)
        module_type: REACTION
        description: >-
          Phytoene synthase condenses two GGPP molecules head-to-head via
          prephytoene diphosphate to 15-cis-phytoene, the first C40 carotenoid
          and the committed step of the pathway.
        gocam_associations:
          - model: "62f58d8800000065"
            activity: gomodel:62f58d8800000065/62f58d8800000066
            title: Carotenoid biosynthesis (N. crassa)
            description: >-
              Production GO-CAM activity for the phytoene synthase function of
              the bifunctional al-2 protein, typed GO:0046905 with 15-cis-phytoene
              (CHEBI:27787) as output.
        annotons:
          - id: psy_activity
            label: 15-cis-phytoene synthase activity
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: 15-cis-phytoene synthase activity
                term:
                  id: GO:0046905
                  label: 15-cis-phytoene synthase activity
              family:
                preferred_term: Phytoene synthase (PSY/CrtB) family
                term:
                  id: PANTHER:PTHR31480
                  label: BIFUNCTIONAL LYCOPENE CYCLASE/PHYTOENE SYNTHASE
                description: >-
                  The official family name reflects the fungal bifunctional
                  members; plant PSY and bacterial CrtB are single-domain
                  phytoene synthases in the same family. UniProt assigns the
                  exemplars to the family without a subfamily, so the family
                  id is used.
                representative_members:
                  - preferred_term: PSY1 (Arabidopsis thaliana)
                    term:
                      id: UniProtKB:P37271
                      label: Phytoene synthase 1, chloroplastic
                  - preferred_term: CrtB (Pantoea ananatis)
                    term:
                      id: UniProtKB:P21683
                      label: 15-cis-phytoene synthase
                  - preferred_term: al-2 (Neurospora crassa)
                    term:
                      id: UniProtKB:P37295
                      label: Bifunctional lycopene cyclase/phytoene synthase
            function:
              preferred_term: 15-cis-phytoene synthase activity
              term:
                id: GO:0046905
                label: 15-cis-phytoene synthase activity
              substrates:
                - preferred_term: (2E,6E,10E)-geranylgeranyl diphosphate
              products:
                - preferred_term: 15-cis-phytoene
                - preferred_term: diphosphate
              evidence:
                - source_id: RHEA:34475
                  title: 15-cis-phytoene synthase overall reaction
                  statement: >-
                    Rhea 34475 (EC 2.5.1.32) defines 2 GGPP = 15-cis-phytoene +
                    2 diphosphate; the half-reactions via prephytoene
                    diphosphate are Rhea 22296 and Rhea 34479.
            processes:
              - preferred_term: phytoene biosynthetic process
                term:
                  id: GO:1901174
                  label: phytoene biosynthetic process
            role_description: >-
              Commits GGPP to the carotenoid pathway by forming the first C40
              carotene, 15-cis-phytoene.
    - order: 2
      role: Desaturation and isomerization of phytoene to all-trans-lycopene
      node:
        id: phytoene_desaturation_to_lycopene
        label: Phytoene -> all-trans-lycopene (four desaturations)
        module_type: METABOLIC_PATHWAY
        description: >-
          Four double bonds are introduced into 15-cis-phytoene to give
          all-trans-lycopene. Bacteria and fungi use one FAD-dependent
          CrtI-type desaturase that also isomerizes the 15-cis bond; plants and
          cyanobacteria use two plastoquinone-dependent desaturases (PDS, ZDS)
          that each introduce two cis double bonds, and two isomerases (Z-ISO,
          CRTISO) that convert the poly-cis intermediates to the all-trans
          configuration.
        concepts:
          - preferred_term: lycopene biosynthetic process
            term:
              id: GO:1901177
              label: lycopene biosynthetic process
            description: Formation of all-trans-lycopene from phytoene.
        variant_sets:
          - id: desaturation_route
            label: Phytoene desaturation route
            axis: desaturase enzyme system
            selection: EXACTLY_ONE
            notes: >-
              The two routes are mutually exclusive within a lineage: CrtI-type
              desaturases are found in most non-photosynthetic bacteria and in
              fungi, while the poly-cis route is found in cyanobacteria, algae
              and plants. Both are recognized by KEGG M00097.
            variants:
              - id: crti_type_desaturation
                label: CrtI-type single-enzyme desaturation
                module_type: REACTION
                description: >-
                  A single FAD-dependent desaturase of the amine-oxidase fold
                  carries out all four desaturations and the 15-cis to trans
                  isomerization, converting 15-cis-phytoene to
                  all-trans-lycopene via phytofluene, zeta-carotene and
                  neurosporene. Fungal orthologs (al-1 type) add a fifth
                  desaturation to 3,4-didehydrolycopene, feeding the torulene
                  branch, which is outside this module.
                context:
                  taxa:
                    - preferred_term: bacteria
                      term:
                        id: NCBITaxon:2
                        label: Bacteria
                    - preferred_term: fungi
                      term:
                        id: NCBITaxon:4751
                        label: Fungi
                gocam_associations:
                  - model: "62f58d8800000065"
                    activity: gomodel:62f58d8800000065/62f58d8800000075
                    title: Carotenoid biosynthesis (N. crassa)
                    description: >-
                      First of five sequential al-1 activities typed
                      GO:0016166 in the production GO-CAM (activities ...075,
                      ...087, ...094, ...101 and ...108), one per desaturation
                      from 15-cis-phytoene through neurosporene and lycopene to
                      3,4-didehydrolycopene.
                annotons:
                  - id: crti_activity
                    label: Lycopene-forming phytoene desaturase activity
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: phytoene dehydrogenase activity
                        term:
                          id: GO:0016166
                          label: phytoene dehydrogenase activity
                      family:
                        preferred_term: CrtI-type phytoene desaturase family
                        term:
                          id: PANTHER:PTHR43734
                          label: PHYTOENE DESATURASE
                        description: >-
                          Family-level id is used because PANTHER splits the
                          reviewed exemplars across subfamilies (Pantoea CrtI
                          in SF3, whose official label is a ketolase name, and
                          Neurospora al-1 in SF1). The lycopene-forming activity
                          is imposed by the required function and Rhea, not by
                          the PANTHER label.
                        representative_members:
                          - preferred_term: CrtI (Pantoea ananatis)
                            term:
                              id: UniProtKB:P21685
                              label: Phytoene desaturase (lycopene-forming)
                          - preferred_term: al-1 (Neurospora crassa)
                            term:
                              id: UniProtKB:P21334
                              label: Phytoene desaturase
                    function:
                      preferred_term: phytoene dehydrogenase activity
                      term:
                        id: GO:0016166
                        label: phytoene dehydrogenase activity
                      substrates:
                        - preferred_term: 15-cis-phytoene
                        - preferred_term: electron acceptor
                      products:
                        - preferred_term: all-trans-lycopene
                        - preferred_term: reduced electron acceptor
                      cofactors:
                        - preferred_term: FAD
                      evidence:
                        - source_id: RHEA:15585
                          title: lycopene-forming phytoene desaturase overall reaction
                          statement: >-
                            Rhea 15585 (EC 1.3.99.31) defines 15-cis-phytoene +
                            4 A = all-trans-lycopene + 4 AH2, the four-step
                            CrtI reaction.
                        - source_id: RHEA:30603
                          title: phytoene to phytofluene
                          statement: >-
                            Rhea 30603, 30607, 30611 and 30623 are the four
                            individual desaturations (phytoene -> phytofluene
                            -> zeta-carotene -> neurosporene -> lycopene)
                            assigned to Neurospora al-1; Rhea 30979 is the
                            fungal fifth desaturation to
                            3,4-didehydrolycopene.
                    role_description: >-
                      Performs all four desaturations from phytoene to
                      all-trans-lycopene as a single enzyme.
              - id: poly_cis_desaturation_isomerization
                label: Poly-cis desaturation/isomerization route (PDS, Z-ISO, ZDS, CRTISO)
                module_type: METABOLIC_PATHWAY
                description: >-
                  Two plastoquinone-dependent desaturases each introduce two
                  cis double bonds, and two isomerases restore the all-trans
                  configuration: PDS converts 15-cis-phytoene to
                  9,15,9'-tri-cis-zeta-carotene; Z-ISO isomerizes the 15-cis
                  bond to give 9,9'-di-cis-zeta-carotene; ZDS forms
                  7,7',9,9'-tetra-cis-lycopene (prolycopene); CRTISO
                  isomerizes prolycopene to all-trans-lycopene. Light-driven
                  photoisomerization can partially substitute for the two
                  isomerases in illuminated tissue, but the enzymes are
                  required in the dark and in non-photosynthetic tissues.
                notes: >-
                  The taxon context lists the lineages grounded by the
                  exemplars used here. Plant-type CrtP/CrtQ desaturases are
                  also reported in some anoxygenic green sulfur bacteria,
                  apparently without a Z-ISO ortholog, so the route is not
                  strictly confined to oxygenic phototrophs; no exemplar from
                  those lineages was verified in this session.
                context:
                  taxa:
                    - preferred_term: cyanobacteria
                      term:
                        id: NCBITaxon:1117
                        label: Cyanobacteriota
                    - preferred_term: green plants
                      term:
                        id: NCBITaxon:33090
                        label: Viridiplantae
                parts:
                  - order: 1
                    role: Phytoene desaturation to tri-cis-zeta-carotene
                    node:
                      id: pds_step
                      label: PDS step (15-cis-phytoene -> 9,15,9'-tri-cis-zeta-carotene)
                      module_type: REACTION
                      annotons:
                        - id: pds_activity
                          label: 15-cis-phytoene desaturase activity
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: phytoene dehydrogenase activity
                              term:
                                id: GO:0016166
                                label: phytoene dehydrogenase activity
                            family:
                              preferred_term: PDS/CrtP 15-cis-phytoene desaturase family
                              term:
                                id: PANTHER:PTHR42923:SF45
                                label: 15-CIS-PHYTOENE DESATURASE, CHLOROPLASTIC_CHROMOPLASTIC
                              description: >-
                                The official label is plant-biased; the
                                subfamily also holds the cyanobacterial
                                pds/crtP exemplar. The label is retained
                                verbatim without asserting localization.
                              representative_members:
                                - preferred_term: PDS (Arabidopsis thaliana)
                                  term:
                                    id: UniProtKB:Q07356
                                    label: 15-cis-phytoene desaturase, chloroplastic/chromoplastic
                                - preferred_term: pds/crtP (Synechococcus elongatus PCC 7942)
                                  term:
                                    id: UniProtKB:P26294
                                    label: 15-cis-phytoene desaturase
                              ancestral_nodes:
                                - preferred_term: PAINT PDS activity node PTN000078359
                                  term:
                                    id: PANTHER:PTN000078359
                                    label: PTN000078359
                                  description: >-
                                    PAINT node in PTHR42923 with IBD support for
                                    GO:0016166 and GO:0016117, seeded by the
                                    Arabidopsis PDS locus (AT4G14210, Q07356)
                                    and tomato PDS (P28554).
                                  evidence:
                                    - source_id: GO_REF:0000033
                                      statement: >-
                                        IBD propagation from PAINT node
                                        PTN000078359 in PTHR42923.
                          function:
                            preferred_term: phytoene dehydrogenase activity
                            term:
                              id: GO:0016166
                              label: phytoene dehydrogenase activity
                            substrates:
                              - preferred_term: 15-cis-phytoene
                              - preferred_term: plastoquinone
                            products:
                              - preferred_term: 9,15,9'-tri-cis-zeta-carotene
                              - preferred_term: plastoquinol
                            evidence:
                              - source_id: RHEA:30287
                                title: plant-type 15-cis-phytoene desaturase reaction
                                statement: >-
                                  Rhea 30287 (EC 1.3.5.5) defines 2 plastoquinone
                                  + 15-cis-phytoene = 9,9',15-tri-cis-zeta-carotene
                                  + 2 plastoquinol, the two-step PDS reaction.
                            notes: >-
                              GO has no child of GO:0016166 specific to the
                              plastoquinone-dependent EC 1.3.5.5 reaction; the
                              parent term is what GOA uses for PDS and CrtI
                              alike, so the two routes are distinguished here
                              by Rhea and by variant context rather than by
                              the GO function term.
                          role_description: >-
                            Introduces the first two double bonds, producing
                            the tri-cis-zeta-carotene intermediate.
                  - order: 2
                    role: 15-cis isomerization of tri-cis-zeta-carotene
                    node:
                      id: ziso_step
                      label: Z-ISO step (9,15,9'-tri-cis- -> 9,9'-di-cis-zeta-carotene)
                      module_type: REACTION
                      annotons:
                        - id: ziso_activity
                          label: 15-cis-zeta-carotene isomerase activity
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: 9,15,9'-tri-cis-zeta-carotene isomerase activity
                              term:
                                id: GO:0090471
                                label: 9,15,9'-tri-cis-zeta-carotene isomerase activity
                            family:
                              preferred_term: Z-ISO 15-cis-zeta-carotene isomerase family
                              term:
                                id: PANTHER:PTHR35988:SF2
                                label: 15-CIS-ZETA-CAROTENE ISOMERASE, CHLOROPLASTIC
                              representative_members:
                                - preferred_term: Z-ISO (Arabidopsis thaliana)
                                  term:
                                    id: UniProtKB:Q9SAC0
                                    label: 15-cis-zeta-carotene isomerase, chloroplastic
                          function:
                            preferred_term: 9,15,9'-tri-cis-zeta-carotene isomerase activity
                            term:
                              id: GO:0090471
                              label: 9,15,9'-tri-cis-zeta-carotene isomerase activity
                            substrates:
                              - preferred_term: 9,15,9'-tri-cis-zeta-carotene
                            products:
                              - preferred_term: 9,9'-di-cis-zeta-carotene
                            evidence:
                              - source_id: RHEA:30967
                                title: Z-ISO reaction
                                statement: >-
                                  Rhea 30967 (EC 5.2.1.12) defines
                                  9,9',15-tri-cis-zeta-carotene =
                                  9,9'-di-cis-zeta-carotene.
                          role_description: >-
                            Isomerizes the central 15-cis bond so that ZDS can
                            act; light can partially substitute for this step.
                  - order: 3
                    role: Zeta-carotene desaturation to prolycopene
                    node:
                      id: zds_step
                      label: ZDS step (9,9'-di-cis-zeta-carotene -> 7,7',9,9'-tetra-cis-lycopene)
                      module_type: REACTION
                      annotons:
                        - id: zds_activity
                          label: Zeta-carotene desaturase activity
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: 9,9'-di-cis-zeta-carotene desaturase activity
                              term:
                                id: GO:0016719
                                label: 9,9'-di-cis-zeta-carotene desaturase activity
                            family:
                              preferred_term: ZDS/CrtQ zeta-carotene desaturase family
                              term:
                                id: PANTHER:PTHR42923:SF41
                                label: ZETA-CAROTENE DESATURASE, CHLOROPLASTIC_CHROMOPLASTIC
                              description: >-
                                The official label is plant-biased; the
                                subfamily also holds the cyanobacterial crtQ
                                exemplar. The label is retained verbatim
                                without asserting localization.
                              representative_members:
                                - preferred_term: ZDS (Arabidopsis thaliana)
                                  term:
                                    id: UniProtKB:Q38893
                                    label: Zeta-carotene desaturase, chloroplastic/chromoplastic
                                - preferred_term: crtQ (Synechocystis sp. PCC 6803)
                                  term:
                                    id: UniProtKB:P74306
                                    label: Zeta-carotene desaturase
                              ancestral_nodes:
                                - preferred_term: PAINT ZDS activity node PTN007457606
                                  term:
                                    id: PANTHER:PTN007457606
                                    label: PTN007457606
                                  description: >-
                                    PAINT node in PTHR42923 with IBD support for
                                    GO:0016719 and GO:0016120, seeded by the
                                    Arabidopsis ZDS locus (AT3G04870, Q38893).
                                  evidence:
                                    - source_id: GO_REF:0000033
                                      statement: >-
                                        IBD propagation from PAINT node
                                        PTN007457606 in PTHR42923.
                          function:
                            preferred_term: 9,9'-di-cis-zeta-carotene desaturase activity
                            term:
                              id: GO:0016719
                              label: 9,9'-di-cis-zeta-carotene desaturase activity
                            substrates:
                              - preferred_term: 9,9'-di-cis-zeta-carotene
                              - preferred_term: plastoquinone
                            products:
                              - preferred_term: 7,7',9,9'-tetra-cis-lycopene
                              - preferred_term: plastoquinol
                            evidence:
                              - source_id: RHEA:30955
                                title: ZDS reaction
                                statement: >-
                                  Rhea 30955 (EC 1.3.5.6) defines
                                  9,9'-di-cis-zeta-carotene + 2 a quinone =
                                  7,7',9,9'-tetra-cis-lycopene + 2 a quinol.
                          role_description: >-
                            Introduces the third and fourth double bonds,
                            producing prolycopene.
                  - order: 4
                    role: Prolycopene isomerization to all-trans-lycopene
                    node:
                      id: crtiso_step
                      label: CRTISO step (7,7',9,9'-tetra-cis-lycopene -> all-trans-lycopene)
                      module_type: REACTION
                      annotons:
                        - id: crtiso_activity
                          label: Prolycopene isomerase activity
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: carotenoid isomerase activity
                              term:
                                id: GO:0046608
                                label: carotenoid isomerase activity
                            family:
                              preferred_term: CRTISO/CrtH prolycopene isomerase family
