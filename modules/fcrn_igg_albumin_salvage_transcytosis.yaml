  connections:
    - source: alb_igg_extracellular_pool
      target: clathrin_dnm2_endocytic_uptake
      connection_type: PROVIDES_INPUT_FOR
      description: Extracellular albumin and IgG are internalized from plasma via fluid-phase pinocytosis and clathrin/AP-2/DNM2-coated pits.
    - source: clathrin_dnm2_endocytic_uptake
      target: early_endosome_acidification
      connection_type: PROVIDES_INPUT_FOR
      description: Internalized endocytic vesicles deliver luminal IgG and albumin to V-ATPase-acidified early sorting endosomes (pH ~6.0).
    - source: early_endosome_acidification
      target: fcrn_ph_dependent_salvage
      connection_type: PROVIDES_INPUT_FOR
      description: Protonated IgG and albumin in acidified sorting endosomes bind endosomal FCGRT/B2M (FcRn) heterodimers with high affinity.
    - source: early_endosome_acidification
      target: rab7_late_endosome_routing
      connection_type: PROVIDES_INPUT_FOR
      description: Unbound luminal cargo remaining in the sorting endosome progresses into TSG101/RAB7A late endosomes.
    - source: fcrn_ph_dependent_salvage
      target: rab7_late_endosome_routing
      connection_type: NEGATIVELY_REGULATES
      description: >-
        High-affinity pH-dependent capture of IgG and albumin by endosomal FCGRT/B2M sequesters
        cargo into recycling tubules and protects it from RAB7A-mediated late-endosomal/lysosomal
        degradation (PMID:28330995, PMID:36979511).
    - source: fcrn_ph_dependent_salvage
      target: ehd1_snap23_salvage_exocytosis
      connection_type: PROVIDES_INPUT_FOR
      description: FcRn-bound IgG and albumin enter EHD1 recycling tubules and undergo SNAP23-mediated exocytic fusion and release at pH 7.4.
    - source: rab7_late_endosome_routing
      target: ctsd_lysosomal_catabolism
      connection_type: PROVIDES_INPUT_FOR
      description: Mature RAB7A-positive late endosomes fuse with lysosomes where CTSD catabolizes unsalvaged IgG and albumin.
  notes: >-
    Constructed for the DELIVEROME and ABM_TRAFFICKING projects to represent pH-dependent FcRn
    (FCGRT/B2M) salvage and transcytosis of IgG, Fc-fusion biologics, and serum albumin as an
    executable agent-based model (ABM) derived directly from the module graph. All protein
    participants are grounded to completed AIGR gene reviews (human ALB, FCGRT, B2M, AP2M1, CLTC,
    DNM2, ATP6V1A, EHD1, SNAP23, TSG101, RAB7A, CTSD, and mouse Rab7) and verified PANTHER
    family/subfamily identifiers.
executable_models:
  - id: fcrn_salvage_transcytosis_abm
    title: Agent-based model of pH-dependent FcRn (FCGRT/B2M) IgG and albumin salvage, exocytic recycling, and lysosomal catabolism
    model_type: AGENT_BASED
    derivation: DERIVED_FROM_MODULE
    description: >-
      Simulates 100 discrete IgG/albumin cargo agents traversing the seven stages of endothelial
      and epithelial FcRn trafficking under uniform uncalibrated default transition rates
      (base_rate = 0.45, competing_inhibitor_factor = 0.25). Under wild-type baseline conditions,
      active FcRn acidic capture (fcrn_ph_dependent_salvage) attenuates late-endosomal routing
      (rab7_late_endosome_routing) from acidified sorting endosomes, rescuing 80% of internalized
      IgG/albumin via EHD1/SNAP23 exocytic recycling (ehd1_snap23_salvage_exocytosis) while only
      20% undergoes lysosomal catabolism (ctsd_lysosomal_catabolism). Inactivating FcRn salvage
      (modeling FCGRT/B2M deficiency or therapeutic anti-FcRn blockade such as efgartigimod)
      diverts 100% of internalized cargo into RAB7A/CTSD lysosomal catabolism.
    notes: >-
      Deterministic particle-conserving agent-based simulation (N=100 cargo particles, T=24 steps)
      derived from the module's directed flow connections (PROVIDES_INPUT_FOR) and competing-pathway
      inhibitory edges (NEGATIVELY_REGULATES) using uniform uncalibrated default kinetics.
    scenarios:
      - id: wt_fcrn_salvage_dominance
        label: Wild-type FcRn salvage dominance (80% exocytic salvage/transcytosis vs. 20% lysosomal catabolism)
        description: >-
          With functional FCGRT/B2M heterodimers and V-ATPase acidification active, protonated IgG
          and albumin in early endosomes are predominantly captured by FcRn and returned to the
          circulation via EHD1/SNAP23 exocytosis (80%), while only a minor fraction escapes capture
          and undergoes CTSD lysosomal catabolism (20%).
        expected_active:
          - alb_igg_extracellular_pool
          - clathrin_dnm2_endocytic_uptake
          - early_endosome_acidification
          - fcrn_ph_dependent_salvage
          - ehd1_snap23_salvage_exocytosis
          - rab7_late_endosome_routing
          - ctsd_lysosomal_catabolism
        expected_outcome_order:
          - ehd1_snap23_salvage_exocytosis
          - ctsd_lysosomal_catabolism
        evidence:
          - source_id: PMID:28330995
            title: Hepatic FcRn regulates albumin homeostasis and susceptibility to liver injury.
            statement: FcRn binds IgG and albumin in weakly acidic endosomes, diverting the majority of internalized ligand from lysosomal degradation into recycling and transcytotic pathways.
            supporting_text: >-
              The neonatal crystallizable fragment receptor (FcRn) is responsible for maintaining the
              long half-life and high levels of the two most abundant circulating proteins, albumin
              and IgG. In the latter case, the protective mechanism derives from FcRn binding to IgG
              in the weakly acidic environment contained within endosomes of hematopoietic and
              parenchymal cells, whereupon IgG is diverted from degradation in lysosomes and is
              recycled.
      - id: fcrn_loss_hypercatabolism
        label: FcRn / B2M deficiency or anti-FcRn blockade (efgartigimod; 100% diversion to lysosomal catabolism)
        description: >-
          Inactivating fcrn_ph_dependent_salvage (modeling familial hypercatabolic hypoproteinemia
          from FCGRT/B2M loss or pharmacological FcRn blockade by efgartigimod/rozanolixizumab)
          abolishes salvage exocytosis (0%) and diverts 100% of internalized IgG and albumin into
          RAB7A late endosomes and CTSD lysosomal catabolism (100%).
        settings:
          - element: fcrn_ph_dependent_salvage
            active: false
        expected_active:
          - alb_igg_extracellular_pool
          - clathrin_dnm2_endocytic_uptake
          - early_endosome_acidification
          - rab7_late_endosome_routing
          - ctsd_lysosomal_catabolism
        expected_inactive:
          - fcrn_ph_dependent_salvage
          - ehd1_snap23_salvage_exocytosis
        expected_outcome_order:
          - ctsd_lysosomal_catabolism
          - ehd1_snap23_salvage_exocytosis
        evidence:
          - source_id: PMID:28330995
            title: Hepatic FcRn regulates albumin homeostasis and susceptibility to liver injury.
            statement: Genetic deletion or pharmacologic blockade of FcRn abolishes endosomal salvage and causes rapid albumin and IgG loss/catabolism.
            supporting_text: >-
              Here we demonstrate that mice with global or liver-specific FcRn deletion exhibit
              hypoalbuminemia, albumin loss into the bile, and increased albumin levels in the
              hepatocyte.
      - id: vatpase_acidification_block
        label: V-ATPase acidification block (ATP6V1A loss / bafilomycin A1; failure of acidic histidine protonation switch)
        description: >-
          Inactivating early_endosome_acidification prevents the endosomal pH drop to ~6.0 required
          for histidine protonation on IgG and albumin, arresting internalized cargo in neutral
          endocytic vesicles (clathrin_dnm2_endocytic_uptake) and abolishing pH-dependent FcRn
          salvage.
        settings:
          - element: early_endosome_acidification
            active: false
        expected_active:
          - alb_igg_extracellular_pool
          - clathrin_dnm2_endocytic_uptake
        expected_inactive:
          - early_endosome_acidification
          - fcrn_ph_dependent_salvage
          - ehd1_snap23_salvage_exocytosis
          - rab7_late_endosome_routing
          - ctsd_lysosomal_catabolism
        expected_outcome_order:
          - clathrin_dnm2_endocytic_uptake
          - early_endosome_acidification
        evidence:
          - source_id: PMID:33065002
            title: Structures of a Complete Human V-ATPase Reveal Mechanisms of Its Assembly.
            statement: V-ATPase couples V1 ATP hydrolysis to Vo proton transfer to acidify endosomal compartments.
            supporting_text: >-
              Vesicular- or vacuolar-type adenosine triphosphatases (V-ATPases) 
              are ATP-driven proton pumps comprised of a cytoplasmic V1 complex for ATP 
              hydrolysis and a membrane-embedded Vo complex for proton transfer.
      - id: ehd1_snap23_exocytosis_block
        label: EHD1 / SNAP23 recycling & exocytosis block (FcRn-bound cargo trapped in recycling/sorting endosomes)
        description: >-
          Inactivating ehd1_snap23_salvage_exocytosis (modeling EHD1 or SNAP23 depletion) prevents
          recycling tubule fission and plasma-membrane fusion, trapping FcRn-bound IgG and albumin
          intracellularly in the FcRn salvage compartment (80%) while the remaining 20% is degraded
          in lysosomes.
        settings:
          - element: ehd1_snap23_salvage_exocytosis
            active: false
        expected_active:
          - alb_igg_extracellular_pool
          - clathrin_dnm2_endocytic_uptake
          - early_endosome_acidification
          - fcrn_ph_dependent_salvage
          - rab7_late_endosome_routing
          - ctsd_lysosomal_catabolism
        expected_inactive:
          - ehd1_snap23_salvage_exocytosis
        expected_outcome_order:
          - fcrn_ph_dependent_salvage
          - ctsd_lysosomal_catabolism
          - ehd1_snap23_salvage_exocytosis
        evidence:
          - source_id: PMID:30811271
            title: Syntaxin 11 regulates the stimulus-dependent transport of Toll-like receptor 4 to the plasma membrane by cooperating with SNAP-23 in macrophages.
            statement: Depletion of SNAP-23 inhibits exocytic replenishment of recycling cargo at the plasma membrane.
            supporting_text: >-
              experiment suggested that stx11 interacts with SNAP-23, a plasma membrane-localized
              SNARE protein, whose depletion also inhibits TLR4 replenishment in LPS-stimulated cells
      - id: rab7_maturation_block_complete_salvage
        label: RAB7A late-endosomal maturation block (eliminates lysosomal catabolism and routes 100% of cargo to FcRn salvage)
        description: >-
          Inactivating rab7_late_endosome_routing blocks early-to-late endosome conversion and
          lysosomal delivery (ctsd_lysosomal_catabolism drops to 0%), allowing 100% of internalized
          IgG and albumin in acidified sorting endosomes to be captured by FcRn and exocytosed via
          EHD1/SNAP23.
        settings:
          - element: rab7_late_endosome_routing
            active: false
        expected_active:
          - alb_igg_extracellular_pool
          - clathrin_dnm2_endocytic_uptake
          - early_endosome_acidification
          - fcrn_ph_dependent_salvage
          - ehd1_snap23_salvage_exocytosis
        expected_inactive:
          - rab7_late_endosome_routing
          - ctsd_lysosomal_catabolism
        expected_outcome_order:
          - ehd1_snap23_salvage_exocytosis
          - ctsd_lysosomal_catabolism
        evidence:
          - source_id: PMID:20028791
            title: Disease mutations in Rab7 result in unregulated nucleotide exchange and inappropriate activation.
            statement: Rab7 controls the transition of early endosomes into the late-endosomal/lysosomal degradative system.
            supporting_text: >-
              Rab7 specifically controls the transition of early endosomes
              into the late-endosomal/lysosomal system and subsequent degradation of
              cargos associated with target vesicles
      - id: clathrin_dnm2_uptake_block
        label: Clathrin / DNM2 endocytic uptake block (albumin and IgG retained in extracellular plasma pool)
        description: >-
          Inactivating clathrin_dnm2_endocytic_uptake blocks coated-pit internalization and vesicle
          scission, retaining 100% of cargo in the extracellular plasma pool
          (alb_igg_extracellular_pool).
        settings:
          - element: clathrin_dnm2_endocytic_uptake
            active: false
        expected_active:
          - alb_igg_extracellular_pool
        expected_inactive:
          - clathrin_dnm2_endocytic_uptake
          - early_endosome_acidification
          - fcrn_ph_dependent_salvage
          - ehd1_snap23_salvage_exocytosis
          - rab7_late_endosome_routing
          - ctsd_lysosomal_catabolism
        expected_outcome_order:
          - alb_igg_extracellular_pool
          - clathrin_dnm2_endocytic_uptake
        evidence:
          - source_id: PMID:14985334
            title: Analysis of clathrin-mediated endocytosis of epidermal growth factor receptor by RNA interference.
            statement: Knockdown of clathrin heavy chain and dynamin blocks endocytic uptake from the cell surface.
            supporting_text: >-
              The knock-downs of 
              clathrin heavy chain and dynamin produced maximal inhibitory effects on the 
              internalization of both receptors.
