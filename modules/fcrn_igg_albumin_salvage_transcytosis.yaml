id: MODULE:fcrn_igg_albumin_salvage_transcytosis
title: Neonatal Fc receptor (FCGRT/B2M) pH-dependent IgG and albumin salvage and transcytosis — endocytic uptake, V-ATPase acidification, FcRn acidic capture, EHD1/SNAP23 exocytic recycling vs. RAB7A/CTSD lysosomal catabolism
description: >-
  Immunoglobulin G (IgG) antibodies, Fc-fusion biologics, and serum albumin (ALB) achieve their
  exceptionally long (~19-21 day) circulatory half-lives in humans through pH-dependent endosomal
  salvage mediated by the heterodimeric neonatal Fc receptor (FcRn), composed of the MHC class I-like
  alpha chain FCGRT (p51) and beta-2-microglobulin (B2M). Vascular endothelial cells, myeloid cells,
  and polarized barrier epithelia continuously internalize extracellular albumin and IgG from plasma
  into nascent endocytic vesicles via fluid-phase pinocytosis and clathrin/AP-2/DNM2-coated pits.
  At neutral extracellular pH (7.4), FcRn displays negligible affinity for IgG or albumin. Once
  V-ATPase (ATP6V1A) acidifies early sorting endosomes to pH ~6.0-5.5, protonation of surface
  histidine residues on the IgG CH2-CH3 interface and albumin domain III triggers high-affinity,
  non-cooperative 2:1:1 binding to endosomal FCGRT/B2M heterodimers. FcRn-bound cargo is sorted away
  from the degradative multivesicular body pathway into EHD1-dependent recycling tubules that dock
  and fuse with the plasma membrane via the target-SNARE SNAP23; exposure to neutral extracellular
  pH (7.4) immediately deprotonates the histidine switch and releases intact IgG and albumin back
  into circulation (or across polarized mucosal/placental barriers). Cargo that fails to engage
  FcRn (or is displaced by FcRn-blocking therapeutics such as efgartigimod or by FCGRT/B2M
  deficiency) remains in the endosomal lumen and progresses via ESCRT-I (TSG101) and RAB7A to
  lysosomes for proteolytic catabolism by cathepsin D (CTSD).
status: DRAFT
evidence:
  - source_id: GO:0038024
    title: cargo receptor activity
    statement: pH-dependent endosomal binding of IgG and serum albumin by the FCGRT/B2M (FcRn) heterodimer at pH 5.5-6.0.
  - source_id: GO:0006898
    title: receptor-mediated endocytosis
    statement: Clathrin-, AP-2-, and DNM2-dependent endocytic internalization at the endothelial/epithelial surface.
  - source_id: GO:0048388
    title: endosomal lumen acidification
    statement: V-ATPase-driven proton translocation acidifies early endosomes to pH ~6.0, enabling histidine-dependent FcRn binding.
  - source_id: GO:0032456
    title: endocytic recycling
    statement: EHD1- and SNAP23-dependent recycling and exocytic release of salvaged IgG and albumin at neutral plasma pH.
  - source_id: GO:0008333
    title: endosome to lysosome transport
    statement: Unbound luminal protein cargo is routed via TSG101 and RAB7A to lysosomes for CTSD-mediated proteolysis.
  - source_id: PMID:36979511
    title: "Heme Scavenging and Delivery: The Role of Human Serum Albumin."
    statement: >-
      Human serum albumin binds the neonatal Fc receptor (FcRn) and crosses endothelial barriers
      via active receptor-mediated transcytotic and salvage mechanisms.
    supporting_text: >-
      To date, eight membrane-associated HSA binding proteins have been described: albondin/glycoprotein
      60 (gp60) [82], glycoprotein 18 (gp18) [83], glycoprotein 30 (gp30) [83], neonatal Fc Receptor
      (FcRn) [84]
  - source_id: PMID:28330995
    title: Hepatic FcRn regulates albumin homeostasis and susceptibility to liver injury.
    statement: >-
      FcRn maintains the long circulatory half-life and high plasma levels of albumin and IgG by
      binding them in weakly acidic endosomes, diverting them from lysosomal degradation, and
      mediating recycling and bidirectional transcytosis.
    supporting_text: >-
      The neonatal crystallizable fragment receptor (FcRn) is responsible for maintaining the long
      half-life and high levels of the two most abundant circulating proteins, albumin and IgG. In
      the latter case, the protective mechanism derives from FcRn binding to IgG in the weakly
      acidic environment contained within endosomes of hematopoietic and parenchymal cells,
      whereupon IgG is diverted from degradation in lysosomes and is recycled.
  - source_id: PMID:24469444
    title: Structural insights into neonatal Fc receptor-based recycling mechanisms.
    statement: >-
      Crystal structure of human FcRn bound concurrently to human serum albumin (HSA) and IgG Fc
      demonstrates non-overlapping pH-dependent binding sites governed by histidine protonation
      (FcRn His161 for HSA and Fc His310 for IgG).
    supporting_text: >-
      We report the three-dimensional structure of human neonatal Fc receptor (FcRn) bound
      concurrently to its two known ligands. More particularly, we solved the crystal structure of
      the complex between human FcRn, wild-type human serum albumin (HSA), and a human Fc
      engineered for improved pharmacokinetics properties (Fc-YTE).
  - source_id: file:human/ALB/ALB-ai-review.yaml
    title: ALB gene review (human)
    statement: >-
      Extracellular serum carrier protein salvaged from lysosomal degradation by endosomal FcRn
      (UniProtKB:P02768, GO:0140104, GO:0005576).
  - source_id: file:human/FCGRT/FCGRT-ai-review.yaml
    title: FCGRT gene review (human)
    statement: >-
      IgG receptor FcRn large subunit p51 mediating pH-dependent endosomal capture and recycling of
      IgG and albumin (UniProtKB:P55899, GO:0038024, GO:0032456).
  - source_id: file:human/B2M/B2M-ai-review.yaml
    title: B2M gene review (human)
    statement: >-
      Essential beta-2-microglobulin light chain of the FcRn heterodimer required for FCGRT folding,
      stability, and endocytic recycling (UniProtKB:P61769, GO:0005198, GO:0032456).
  - source_id: file:human/AP2M1/AP2M1-ai-review.yaml
    title: AP2M1 gene review (human)
    statement: >-
      AP-2 mu2 cargo adaptor recognizing cytoplasmic sorting motifs (UniProtKB:Q96CW1, GO:0005048,
      GO:0072583).
  - source_id: file:worm/dpy-23/dpy-23-ai-review.yaml
    title: dpy-23 gene review (C. elegans)
    statement: >-
      Conserved metazoan AP-2 mu2 subunit recognizing cytoplasmic YxxPhi motifs for clathrin-dependent
      endocytosis (UniProtKB:P35603, GO:0035615, GO:0072583).
  - source_id: file:human/CLTC/CLTC-ai-review.yaml
    title: CLTC gene review (human)
    statement: >-
      Clathrin heavy chain 1 lattice assembly for coated-pit internalization (UniProtKB:Q00610,
      GO:0005198, GO:0006898).
  - source_id: file:human/DNM2/DNM2-ai-review.yaml
    title: DNM2 gene review (human)
    statement: >-
      Dynamin-2 GTPase driving endocytic vesicle scission (UniProtKB:P50570, GO:0061791, GO:0099050).
  - source_id: file:human/ATP6V1A/ATP6V1A-ai-review.yaml
    title: ATP6V1A gene review (human)
    statement: >-
      V-ATPase catalytic subunit A driving early endosomal acidification to pH ~6.0 (UniProtKB:P38606,
      GO:0046961, GO:0048388).
  - source_id: file:human/EHD1/EHD1-ai-review.yaml
    title: EHD1 gene review (human)
    statement: >-
      Recycling endosome tubulation and fission ATPase (UniProtKB:Q9H4M9, GO:0016887, GO:0032456).
  - source_id: file:human/SNAP23/SNAP23-ai-review.yaml
    title: SNAP23 gene review (human)
    statement: >-
      Plasma-membrane Qbc-SNARE mediating recycling vesicle fusion and exocytic release at pH 7.4
      (UniProtKB:O00161, GO:0005484, GO:0006887).
  - source_id: file:human/TSG101/TSG101-ai-review.yaml
    title: TSG101 gene review (human)
    statement: >-
      ESCRT-I MVB cargo sorting subunit (UniProtKB:Q99816, GO:0043130, GO:0036258).
  - source_id: file:human/RAB7A/RAB7A-ai-review.yaml
    title: RAB7A gene review (human)
    statement: >-
      Late endosomal maturation and lysosome transport GTPase (UniProtKB:P51149, GO:0003924,
      GO:0045022, GO:0008333).
  - source_id: file:human/CTSD/CTSD-ai-review.yaml
    title: CTSD gene review (human)
    statement: >-
      Lysosomal aspartic protease executing catabolism of unsalvaged serum proteins (UniProtKB:P07339,
      GO:0004190, GO:0006508).
module:
  id: fcrn_igg_albumin_salvage_transcytosis
  label: Neonatal Fc receptor (FCGRT/B2M) pH-dependent IgG and albumin salvage, exocytic recycling, and lysosomal catabolism
  module_type: TRANSPORT_STEP
  concepts:
    - preferred_term: cargo receptor activity
      term:
        id: GO:0038024
        label: cargo receptor activity
      description: Acidic pH-dependent binding of IgG and albumin by the endosomal FCGRT/B2M heterodimer.
    - preferred_term: endosomal lumen acidification
      term:
        id: GO:0048388
        label: endosomal lumen acidification
      description: V-ATPase proton pumping that lowers early endosomal pH to ~6.0, activating the histidine switch on IgG and albumin.
    - preferred_term: endocytic recycling
      term:
        id: GO:0032456
        label: endocytic recycling
      description: Tubular sorting and plasma-membrane return of FcRn-bound IgG and albumin.
    - preferred_term: exocytosis
      term:
        id: GO:0006887
        label: exocytosis
      description: SNAP23-mediated fusion of recycling carriers with the plasma membrane and cargo release at pH 7.4.
    - preferred_term: endosome to lysosome transport
      term:
        id: GO:0008333
        label: endosome to lysosome transport
      description: Routing of unbound luminal IgG and albumin through RAB7A late endosomes to lysosomes for catabolism.
  parts:
    - order: 1
      role: extracellular plasma pool of serum albumin (ALB) and IgG / Fc-fusion biologics at neutral pH (7.4)
      node:
        id: alb_igg_extracellular_pool
        label: Extracellular serum albumin (ALB) & IgG / Fc-biologic plasma pool (pH 7.4)
        module_type: MOLECULAR_FUNCTION
        annotons:
          - id: alb_extracellular_carrier
            label: "ALB (HSA): circulating serum albumin and FcRn salvage substrate"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Serum albumin
                term:
                  id: PANTHER:PTHR11385:SF15
                  label: ALBUMIN
                representative_members:
                  - preferred_term: ALB (human)
                    term:
                      id: UniProtKB:P02768
                      label: Albumin
            function:
              preferred_term: molecular carrier activity
              term:
                id: GO:0140104
                label: molecular carrier activity
              substrates:
                - preferred_term: endogenous metabolites, heme/bilirubin, fatty acids, and albumin-bound therapeutics
              evidence:
                - source_id: file:human/ALB/ALB-ai-review.yaml
                  statement: Principal extracellular plasma carrier protein whose ~19-21 day half-life depends on endosomal FcRn salvage and transcytosis.
                - source_id: PMID:20705604
                  title: ABCG2 transports and transfers heme to albumin through its large extracellular loop.
                  statement: Human serum albumin functions as an extracellular carrier protein in plasma.
                  supporting_text: >-
                    human serum albumin could be one of these possible partners as it removes hemin
                    bound to ECL3
                - source_id: PMID:36979511
                  title: "Heme Scavenging and Delivery: The Role of Human Serum Albumin."
                  statement: Human serum albumin crosses endothelial barriers via receptor-mediated transcytotic mechanisms involving FcRn.
                  supporting_text: >-
                    HSA can cross the endothelium via active transcytotic mechanisms, including
                    receptor-mediated processes
            processes:
              - preferred_term: bilirubin transport
                term:
                  id: GO:0015723
                  label: bilirubin transport
              - preferred_term: transport
                term:
                  id: GO:0006810
                  label: transport
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Circulates in plasma at neutral pH (7.4) where it does not bind cell-surface FcRn,
              entering vascular endothelial and myeloid cells continuously via pinocytosis and
              clathrin-coated pits.
    - order: 2
      role: clathrin/AP-2 coated-pit capture, pinocytic uptake, and DNM2 vesicle scission
      node:
        id: clathrin_dnm2_endocytic_uptake
        label: Clathrin/AP-2 endocytic uptake and DNM2 vesicle scission
        module_type: TRANSPORT_STEP
        annotons:
          - id: ap2m1_cargo_selection
            label: "AP2M1 (AP-2 mu2): clathrin-coated pit cargo adaptor"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: AP-2 complex subunit mu
                term:
                  id: PANTHER:PTHR10529:SF236
                  label: AP-2 COMPLEX SUBUNIT MU
                representative_members:
                  - preferred_term: AP2M1 (human)
                    term:
                      id: UniProtKB:Q96CW1
                      label: AP-2 complex subunit mu
                  - preferred_term: dpy-23 (C. elegans)
                    term:
                      id: UniProtKB:P35603
                      label: AP-2 complex subunit mu
            function:
              preferred_term: signal sequence receptor activity
              term:
                id: GO:0005048
                label: signal sequence receptor activity
              evidence:
                - source_id: file:human/AP2M1/AP2M1-ai-review.yaml
                  statement: Recognizes cytoplasmic sorting motifs on plasma-membrane receptors including the FCGRT cytoplasmic tail.
                - source_id: file:worm/dpy-23/dpy-23-ai-review.yaml
                  statement: Conserved metazoan AP-2 mu2 subunit recognizing YxxPhi motifs for clathrin-dependent receptor internalization.
                - source_id: PMID:31104773
                  title: A Recurrent Missense Variant in AP2M1 Impairs Clathrin-Mediated Endocytosis and Causes Developmental and Epileptic Encephalopathy.
                  statement: Loss or mutation of AP-2 mu2 impairs clathrin-mediated endocytosis.
                  supporting_text: >-
                    revealed a significant impairment of CME of transferrin.
            processes:
              - preferred_term: clathrin-dependent endocytosis
                term:
                  id: GO:0072583
                  label: clathrin-dependent endocytosis
              - preferred_term: receptor internalization
                term:
                  id: GO:0031623
                  label: receptor internalization
            locations:
              - preferred_term: clathrin-coated pit
                term:
                  id: GO:0005905
                  label: clathrin-coated pit
            role_description: >-
              Couples plasma-membrane FcRn (via tryptophan- and dileucine-based motifs in the FCGRT
              cytoplasmic tail) and co-internalized fluid-phase cargo into clathrin-coated pits.
          - id: cltc_coat_lattice
            label: "CLTC (CHC17): clathrin heavy chain coat lattice"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Clathrin heavy chain 1
                term:
                  id: PANTHER:PTHR10292:SF7
                  label: CLATHRIN HEAVY CHAIN 1
                representative_members:
                  - preferred_term: CLTC (human)
                    term:
                      id: UniProtKB:Q00610
                      label: Clathrin heavy chain 1
            function:
              preferred_term: structural molecule activity
              term:
                id: GO:0005198
                label: structural molecule activity
              evidence:
                - source_id: file:human/CLTC/CLTC-ai-review.yaml
                  statement: Polymerizes into polyhedral triskelion lattices at the plasma membrane to drive coated-vesicle budding.
                - source_id: PMID:14985334
                  title: Analysis of clathrin-mediated endocytosis of epidermal growth factor receptor by RNA interference.
                  statement: Knockdown of clathrin heavy chain maximally inhibits endocytic internalization.
                  supporting_text: >-
                    The knock-downs of 
                    clathrin heavy chain and dynamin produced maximal inhibitory effects on the 
                    internalization of both receptors.
            processes:
              - preferred_term: receptor-mediated endocytosis
                term:
                  id: GO:0006898
                  label: receptor-mediated endocytosis
              - preferred_term: clathrin coat assembly
                term:
                  id: GO:0048268
                  label: clathrin coat assembly
            locations:
              - preferred_term: clathrin-coated endocytic vesicle
                term:
                  id: GO:0045334
                  label: clathrin-coated endocytic vesicle
            role_description: >-
              Forms the polyhedral coat driving budding of endocytic vesicles containing luminal IgG
              and albumin.
          - id: dnm2_vesicle_scission
            label: "DNM2 (dynamin-2): coated-vesicle neck scission GTPase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Dynamin-2
                term:
                  id: PANTHER:PTHR11566:SF23
                  label: DYNAMIN-2
                representative_members:
                  - preferred_term: DNM2 (human)
                    term:
                      id: UniProtKB:P50570
                      label: Dynamin-2
            function:
              preferred_term: GTPase motor activity
              term:
                id: GO:0061791
                label: GTPase motor activity
              evidence:
                - source_id: file:human/DNM2/DNM2-ai-review.yaml
                  statement: Severs nascent clathrin-coated pits from the plasma membrane via GTP hydrolysis.
                - source_id: PMID:24970086
                  title: Membrane trafficking. Nucleoside diphosphate kinases fuel dynamin superfamily proteins with GTP for membrane remodeling.
                  statement: Dynamin superfamily motors use GTP as an energy source for membrane remodeling and scission.
                  supporting_text: >-
                    Dynamin superfamily molecular motors use guanosine triphosphate (GTP) as a source of
                    energy for membrane-remodeling events.
            processes:
              - preferred_term: vesicle scission
                term:
                  id: GO:0099050
                  label: vesicle scission
              - preferred_term: receptor-mediated endocytosis
                term:
                  id: GO:0006898
                  label: receptor-mediated endocytosis
            locations:
              - preferred_term: clathrin-coated pit
                term:
                  id: GO:0005905
                  label: clathrin-coated pit
            role_description: >-
              Catalyzes GTP-dependent neck fission to release nascent endocytic vesicles into the
              endothelial/epithelial cytoplasm.
    - order: 3
      role: V-ATPase early endosome acidification (pH ~6.0) and histidine protonation of IgG and albumin
      node:
        id: early_endosome_acidification
        label: V-ATPase early endosome acidification (pH ~6.0 histidine protonation switch)
        module_type: TRANSPORT_STEP
        annotons:
          - id: atp6v1a_proton_pump
            label: "ATP6V1A: V-ATPase catalytic subunit A"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: V-type proton ATPase catalytic subunit A
                term:
                  id: PANTHER:PTHR43607:SF9
                  label: V-TYPE PROTON ATPASE CATALYTIC SUBUNIT A
                representative_members:
                  - preferred_term: ATP6V1A (human)
                    term:
                      id: UniProtKB:P38606
                      label: V-type proton ATPase catalytic subunit A
            function:
              preferred_term: proton-transporting ATPase activity, rotational mechanism
              term:
                id: GO:0046961
                label: proton-transporting ATPase activity, rotational mechanism
              evidence:
                - source_id: file:human/ATP6V1A/ATP6V1A-ai-review.yaml
                  statement: Hydrolyzes ATP in the V1 ring to drive proton translocation across endosomal membranes.
                - source_id: PMID:33065002
                  title: Structures of a Complete Human V-ATPase Reveal Mechanisms of Its Assembly.
                  statement: V-ATPase couples V1 ATP hydrolysis to Vo proton translocation to acidify intracellular compartments.
                  supporting_text: >-
                    Vesicular- or vacuolar-type adenosine triphosphatases (V-ATPases) 
                    are ATP-driven proton pumps comprised of a cytoplasmic V1 complex for ATP 
                    hydrolysis and a membrane-embedded Vo complex for proton transfer.
            processes:
              - preferred_term: endosomal lumen acidification
                term:
                  id: GO:0048388
                  label: endosomal lumen acidification
              - preferred_term: proton transmembrane transport
                term:
                  id: GO:1902600
                  label: proton transmembrane transport
            locations:
              - preferred_term: endosome membrane
                term:
                  id: GO:0010008
                  label: endosome membrane
              - preferred_term: lysosomal membrane
                term:
                  id: GO:0005765
                  label: lysosomal membrane
            role_description: >-
              Lowers the early sorting endosome pH to ~5.5-6.0, protonating key histidine residues
              on internalized IgG (CH2-CH3 hinge) and albumin (domain III) to enable high-affinity
              capture by endosomal FcRn.
    - order: 4
      role: FCGRT/B2M (FcRn) acidic pH-dependent capture and salvage sorting of protonated IgG and albumin
      node:
        id: fcrn_ph_dependent_salvage
        label: FCGRT/B2M (FcRn) acidic endosome capture (pH 6.0 salvage receptor complex)
        module_type: MOLECULAR_FUNCTION
        context:
          cellular_components:
            - preferred_term: early endosome membrane
              term:
                id: GO:0031901
                label: early endosome membrane
        annotons:
          - id: fcgrt_salvage_receptor
            label: "FCGRT (FcRn alpha chain p51): pH-dependent IgG and albumin salvage receptor"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: IgG receptor FcRn large subunit p51
                term:
                  id: PANTHER:PTHR16675:SF3
                  label: IGG RECEPTOR FCRN LARGE SUBUNIT P51
                representative_members:
                  - preferred_term: FCGRT (human)
                    term:
                      id: UniProtKB:P55899
                      label: IgG receptor FcRn large subunit p51
            function:
              preferred_term: cargo receptor activity
              term:
                id: GO:0038024
                label: cargo receptor activity
              substrates:
                - preferred_term: protonated IgG (CH2-CH3 domain) and serum albumin (ALB domain III) at pH 5.5-6.0
              evidence:
                - source_id: file:human/FCGRT/FCGRT-ai-review.yaml
                  statement: Binds monomeric IgG and serum albumin simultaneously at non-overlapping interfaces in acidified early endosomes (pH ~6.0) to divert them from lysosomal degradation.
                - source_id: PMID:24469444
                  title: Structural insights into neonatal Fc receptor-based recycling mechanisms.
                  statement: Human FcRn binds human serum albumin (via domain III and FcRn His161) and IgG Fc (via Fc His310) concurrently at non-overlapping pH-dependent interfaces.
                  supporting_text: >-
                    We report the three-dimensional structure of human neonatal Fc receptor (FcRn)
                    bound concurrently to its two known ligands. More particularly, we solved the
                    crystal structure of the complex between human FcRn, wild-type human serum
                    albumin (HSA), and a human Fc engineered for improved pharmacokinetics
                    properties (Fc-YTE).
                - source_id: PMID:28330995
                  title: Hepatic FcRn regulates albumin homeostasis and susceptibility to liver injury.
                  statement: FcRn binds IgG and albumin in weakly acidic endosomes, diverting them from lysosomal degradation and mediating basal recycling and bidirectional transcytosis.
                  supporting_text: >-
                    The neonatal crystallizable fragment receptor (FcRn) is responsible for
                    maintaining the long half-life and high levels of the two most abundant
                    circulating proteins, albumin and IgG. In the latter case, the protective
                    mechanism derives from FcRn binding to IgG in the weakly acidic environment
                    contained within endosomes of hematopoietic and parenchymal cells, whereupon IgG
                    is diverted from degradation in lysosomes and is recycled.
            processes:
              - preferred_term: endocytic recycling
                term:
                  id: GO:0032456
                  label: endocytic recycling
              - preferred_term: receptor-mediated endocytosis
                term:
                  id: GO:0006898
                  label: receptor-mediated endocytosis
            locations:
              - preferred_term: early endosome membrane
                term:
                  id: GO:0031901
                  label: early endosome membrane
              - preferred_term: recycling endosome membrane
                term:
                  id: GO:0055038
                  label: recycling endosome membrane
            role_description: >-
              Captures protonated IgG and albumin in the acidic sorting endosome lumen and partitions
              the receptor-cargo complex into recycling/transcytotic tubules, actively preventing
              luminal progression to late endosomes.
          - id: b2m_fcrn_light_chain
            label: "B2M (beta-2-microglobulin): obligatory FcRn heterodimer light chain"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Beta-2-microglobulin
                term:
                  id: PANTHER:PTHR19944:SF62
                  label: BETA-2-MICROGLOBULIN
                representative_members:
                  - preferred_term: B2M (human)
                    term:
                      id: UniProtKB:P61769
                      label: Beta-2-microglobulin
            function:
              preferred_term: structural molecule activity
              term:
                id: GO:0005198
                label: structural molecule activity
              evidence:
                - source_id: file:human/B2M/B2M-ai-review.yaml
                  statement: Non-covalently pairs with the FCGRT heavy chain to stabilize the functional FcRn heterodimer and contributes contact residues at the IgG-Fc interface.
                - source_id: PMID:31104841
                  title: Human Neonatal Fc Receptor Is the Cellular Uncoating Receptor for Enterovirus B.
                  statement: FcRn is an MHC class I-like heterodimer composed of the heavy alpha chain (FCGRT) and the light beta-2-microglobulin chain (B2M), and knockout of either FCGRT or B2M abolishes functional FcRn receptor activity.
                  supporting_text: >-
                    FcRn is an MHC class I-like protein consisting of a heavy α chain encoded by the
                    FCGRT gene, and a light β2-microglubulin (β2 m) chain encoded by the B2M gene.
                - source_id: PMID:15020713
                  title: Rabenosyn-5 and EHD1 interact and sequentially regulate protein recycling to the plasma membrane.
                  statement: Beta-2-microglobulin-associated MHC class I-family complexes traffic through the EHD1-regulated endocytic recycling pathway.
                  supporting_text: >-
                    Depletion of 
                    either EHD1 or Rabenosyn-5 delayed the recycling of transferrin and major 
                    histocompatibility complex class I to the plasma membrane.
            processes:
              - preferred_term: endocytic recycling
                term:
                  id: GO:0032456
                  label: endocytic recycling
            locations:
              - preferred_term: early endosome membrane
                term:
                  id: GO:0031901
                  label: early endosome membrane
            role_description: >-
              Forms the obligatory invariant light chain of the FcRn heterodimer; loss of B2M
              abolishes FCGRT surface/endosomal expression and causes severe IgG and albumin
              hypercatabolism.
    - order: 5
      role: EHD1 tubular recycling and SNAP23-mediated exocytic fusion and cargo release at neutral pH (7.4)
      node:
        id: ehd1_snap23_salvage_exocytosis
        label: EHD1 recycling tubulation & SNAP23 exocytic release / transcytosis (pH 7.4 uncoupling)
        module_type: TRANSPORT_STEP
        annotons:
          - id: ehd1_membrane_fission
            label: "EHD1: recycling endosome tubulation/fission ATPase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: EH domain-containing protein 1
