id: MODULE:dmel_chromatin_assembly_factor_1
title: Chromatin assembly factor 1 in Drosophila melanogaster
description: >-
  Chromatin assembly factor 1 (CAF-1) is a three-subunit histone chaperone that deposits newly
  synthesised histone H3-H4 onto DNA behind the replication fork, coupling nucleosome assembly
  to DNA replication through its interaction with PCNA. It consists of Caf1-180 (p180), Caf1-105
  (p105) and the WD-repeat histone-binding protein Caf1-55 (p55). Caf1-55 is also a subunit
  of several other chromatin complexes.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000295
  title: 'FlyBase gene group CAF-1: Chromatin assembly factor 1'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as chromatin assembly factor
    1 (CAF-1); this module models that group.
- source_id: GO:0033186
  title: CAF-1 complex
  statement: >-
    GO term grounding the module as CAF-1 complex.
notes: >-
  A three-subunit complex decomposed one part per subunit. Caf1-55 is shared with NURF, NuRD,
  PRC2 and MuvB complexes, which are modelled in their own modules. The histone H3-H4 chaperone
  activity (GO:0000510), which Caf1-180 carries in GOA by IBA, is recorded on a complex-level
  annoton with all three subunits as active units. FlyBase groups realized by this module:
  CAF-1 (FBgg0000295). Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_chromatin_assembly_factor_1.yaml.
  Member genes with a gene review in this repository: Caf1-105, Caf1-180, Caf1-55.
