  connections:
    - source: reelin_receptor_binding
      target: dab1_phosphorylation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Receptor clustering brings receptor-bound DAB1 together and triggers its
        Src-family kinase phosphorylation (RELN -> LRP8 -> FYN -> DAB1 in both GO-CAMs).
    - source: dab1_phosphorylation
      target: reelin_pi3k_branch
      connection_type: POSITIVELY_REGULATES
      description: Phospho-DAB1 recruits p85-alpha and activates PI3K.
    - source: reelin_pi3k_branch
      target: reelin_akt_activation
      connection_type: POSITIVELY_REGULATES
      description: PI3K-generated PIP3 drives AKT activation, which inhibits GSK3B.
    - source: dab1_phosphorylation
      target: reelin_lis1_branch
      connection_type: POSITIVELY_REGULATES
      description: Phospho-DAB1 binds LIS1.
    - source: dab1_phosphorylation
      target: dab1_degradation
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Tyrosine-phosphorylated DAB1 is the substrate recognised by SOCS7 (FYN directly
        provides input for SOCS7 in gomodel:66187e4700002704).
    - source: dab1_degradation
      target: dab1_phosphorylation
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Ubiquitination and degradation of phospho-DAB1 terminate the signal (RNF7 directly
        negatively regulates DAB1 activity in the GO-CAM), the pathway's negative feedback.
knowledge_gaps:
  - gap_statement: >-
      How Reelin signalling through ApoER2, DAB1 and Src-family kinases changes NMDA and AMPA
      receptor function in the adult brain is incompletely understood: which tyrosines on
      GRIN2A/GRIN2B are phosphorylated and by which kinase, whether DAB1 binds the receptor
      complex directly, and how much of the reported enhancement of long-term potentiation
      goes through NMDA receptor phosphorylation versus PI3K-dependent AMPA receptor
      insertion.
    gap_kind:
      - BIOLOGY
  - gap_statement: >-
      Whether alpha3beta1 integrin and cadherin-related neuronal receptors act as Reelin
      co-receptors that contribute to DAB1 signalling in vivo, or only modulate adhesion in
      parallel, is unresolved; the reported binding has not been reconciled with the
      reeler-like phenotype of the VLDLR/ApoER2 double knockout.
    gap_kind:
      - BIOLOGY
