                supporting_text: Dab1 and Lis1 bound in a reelin-induced phosphorylation-dependent manner.
              - source_id: PMID:14578885
                statement: Compound Reln-pathway and Pafah1b1 heterozygous mutants have enhanced layering defects.
                supporting_text: Compound mutant mice with disruptions in the Reln pathway and heterozygous Pafah1b1 mutations had a higher incidence of hydrocephalus and enhanced cortical and hippocampal layering defects.
    - order: 6
      role: signal termination by phospho-DAB1 ubiquitination and degradation
      node:
        id: dab1_degradation
        label: CRL5(SOCS7) ubiquitination and proteasomal degradation of phospho-DAB1
        module_type: REGULATORY_STEP
        description: >-
          Tyrosine-phosphorylated DAB1 is recognised by the SOCS-box adaptor SOCS7 and
          polyubiquitinated by the cullin-5 RING ligase (CUL5 scaffold, RNF7/RBX2 RING
          subunit, Elongin B/C adaptor), then degraded by the proteasome. Loss of CUL5, RNF7
          or SOCS7 lets active DAB1 accumulate and neurons overshoot their target layer.
