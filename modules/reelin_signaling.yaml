            statement: Cul5 ablation in migrating neurons causes accumulation of active Dab1 and excess migration.
            supporting_text: Ablation of Cul5 in migrating neurons causes an accumulation of active Dab1 protein and a unique cortical layering defect, characterized by excess migration and buildup of neurons at the top of the cortical plate.
