        label: Phospho-DAB1 binding to LIS1 (PAFAH1B1)
        module_type: REGULATORY_STEP
        description: >-
          LIS1 binds DAB1 in a Reelin-induced, phosphorylation-dependent manner, and reduced
          LIS1 dosage worsens the layering defects of Reelin-pathway mutants. LIS1 regulates
          cytoplasmic dynein and so links the signal to nucleokinesis in migrating neurons.
