  connections:
  - source: p22_antitermination_step
    target: p22_immc_bistable_switch_step
    connection_type: POSITIVELY_REGULATES
    chaining_status: VERIFIED
    chaining_note: N-mediated antitermination at nutL and nutR extends early transcripts across terminators to express C3
      and C1, enabling C1 activation of PRE.
  - source: p22_immi_antirepressor_step
    target: p22_immc_bistable_switch_step
    connection_type: NEGATIVELY_REGULATES
    chaining_status: VERIFIED
    chaining_note: Mnt represses Pant during lysogeny so C2 remains active, whereas derepression of Ant results in non-covalent
      sequestration of C2 dimers and derepression of PL and PR.
  - source: p22_immc_bistable_switch_step
    target: p22_int_xis_recombination_step
    connection_type: POSITIVELY_REGULATES
    chaining_status: VERIFIED
    chaining_note: C1 activates integrative int expression during lysogenic establishment, whereas C2 inactivation (by RecA*
      autocleavage or Ant binding) derepresses PL to co-express xis and int for prophage excision.
  knowledge_gaps:
  - gap_statement: High-resolution structural characterization of the full-length P22 Ant antirepressor in complex with the
      P22 C2 repressor dimer is still lacking, leaving the exact atomic interface by which Ant allosterically or sterically
      blocks C2 operator binding unresolved.
    boundary: Stoichiometric non-covalent binding of P22 Ant to the P22 C2 repressor (and heterologous lambdoid cI repressors)
      that abolishes operator DNA binding without proteolytic cleavage is established biochemically and genetically (PMID:6350606,
      PMID:11053393).
    gap_kind:
    - BIOLOGY
