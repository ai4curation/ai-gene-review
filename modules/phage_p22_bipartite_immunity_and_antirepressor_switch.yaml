id: MODULE:phage_p22_bipartite_immunity_and_antirepressor_switch
title: Phage P22 bipartite immC/immI immunity, Mnt/Arc/Ant antirepressor regulation, and prophage integration/excision
description: >-
  A coupled bipartite gene-regulatory and site-specific recombination module that governs the lysogenic-lytic decision,
  prophage maintenance, and antirepressor-mediated induction in Salmonella phage P22 (Lederbergvirus). Unlike phage lambda,
  which relies on a single immunity region (immC), phage P22 encodes two distinct, interacting immunity regions: immC (encoding
  the primary repressor C2, the lytic switch repressor Cro, and the lysogenic establishment activator C1) and immI (encoding
  the antirepressor Ant and the two ribbon-helix-helix transcriptional repressors Mnt and Arc). Early transcription from PL
  and PR is extended by the nut-site antitermination protein N (gp24), expressing C3 (which inhibits host FtsH protease to
  stabilize C1), C1 (which activates PRE to drive C2 synthesis), and the site-specific recombinase Int (which integrates the
  phage genome at the Salmonella thrW tRNA locus). During established lysogeny, C2 dimers cooperatively repress PL and PR
  in immC while Mnt tetramers bind the Omnt operator in immI to repress Pant and prevent synthesis of the antirepressor Ant.
  During lytic infection or upon loss of Mnt repression, transcription from Pant expresses Arc (which binds Oarc as a dimer-of-dimers
  to negatively autoregulate Pant and prevent toxic Ant overproduction while activating Pmnt) and Ant (which binds non-covalently
  to C2 and related lambdoid CI repressors to abolish operator DNA binding without proteolysis), while C2 also undergoes RecA*-stimulated
  intramolecular autoproteolysis during the host SOS response, derepressing xis and int for excisive recombination and gp23
  (Q) for late transcription antitermination.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:7260059
  title: Primary structure of the phage P22 repressor and its gene c2.
  statement: Establishes the sequence and organization of the phage P22 immC primary immunity repressor C2.
- source_id: PMID:6350606
  title: Primary structure of the immI immunity region of bacteriophage P22.
  statement: Defines the genetic and transcriptional organization of the secondary immI immunity locus encoding Mnt, Arc, and
    the antirepressor Ant.
- source_id: PMID:8107872
  title: DNA recognition by beta-sheets in the Arc repressor-operator crystal structure.
  statement: Resolves the crystal structure of the Arc ribbon-helix-helix dimer-of-dimers bound to the Oarc operator via antiparallel
    beta-sheets in the major groove.
- source_id: PMID:1385814
  title: Characterization of the transcription activator protein C1 of bacteriophage P22.
  statement: Characterizes the P22 C1 transcriptional activator that binds TTGCNA6TTGC direct repeats to activate PRE during
    establishment of lysogeny.
- source_id: PMID:9501914
  title: Solution structure of P22 transcriptional antitermination N peptide-boxB RNA complex.
  statement: Defines the structural basis of sequence-specific recognition of the nut boxB RNA hairpin by the arginine-rich
    motif of P22 antitermination protein N (gp24).
- source_id: GO:0098689
  title: latency-replication decision
  statement: Defines the biological process governing the choice between viral latency and productive lytic replication.
- source_id: GO:0075713
  title: establishment of integrated proviral latency
  statement: Defines site-specific integration of the temperate phage genome into the host chromosome to establish a prophage.
notes: 'Exemplar phage: Salmonella phage P22 (NCBITaxon:10754). Generalizes across Lederbergvirus and related lambdoid enterobacterial
  phages that combine a canonical immC (C2-Cro-C1) switch with a secondary immI (Mnt-Arc-Ant) ribbon-helix-helix/antirepressor
  regulatory circuit.'
