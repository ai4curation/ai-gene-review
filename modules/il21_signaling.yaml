id: MODULE:il21_signaling
title: Interleukin-21 signaling pathway module
description: >-
  Secreted Interleukin-21 (IL21) binds the private alpha receptor subunit IL21R
  and recruits the shared common gamma chain (IL2RG) to assemble a heterodimeric
  class I cytokine receptor complex on B cells, T cells, and natural killer (NK)
  cells. Receptor assembly juxtaposes and activates receptor-associated Janus
  kinases JAK1 (on IL21R) and JAK3 (on IL2RG), which phosphorylate IL21R
  cytoplasmic tyrosines (notably Y519) to recruit and phosphorylate STAT3 (and
  contextually STAT1 and STAT5), driving germinal center B cell differentiation,
  immunoglobulin class-switch recombination, T follicular helper (Tfh) cell
  differentiation, and NK/CD8+ T cell effector maturation.
status: DRAFT
evidence:
  - source_id: GO:0038114
    title: interleukin-21-mediated signaling pathway
    statement: >-
      Grounded in the GO biological process term for interleukin-21-mediated
      signaling pathway, defined as the series of molecular signals initiated by
      interleukin-21 binding to its receptor complex (IL21R/IL2RG) on the
      surface of a target cell.
  - source_id: PMID:11081504
    title: Interleukin 21 and its receptor are involved in NK cell expansion and regulation of lymphocyte function.
    statement: >-
      Identified human IL21 and IL21R as a novel class I four-helix-bundle
      cytokine-receptor pair that promotes NK cell expansion and regulates B and
      T lymphocyte proliferation.
  - source_id: PMID:12244150
    title: IL-21 up-regulates the expression of genes associated with innate immunity and Th1 response.
    statement: >-
      Demonstrated that IL21 induces STAT3 DNA binding and STAT3 tyrosine
      phosphorylation in human NK and T cells and the NK-92 line (abstract;
      STAT1 activation by IL21 is documented in Reactome:R-HSA-9006870).
  - source_id: PMID:12504082
    title: Human IL-21 and IL-4 bind to partially overlapping epitopes of common gamma-chain.
    statement: >-
      Established that human IL21 engages the shared cytokine receptor common
      gamma chain (IL2RG) alongside IL21R to form a functional signaling complex.
  - source_id: PMID:15546387
    title: Biology of IL-21 and the IL-21 receptor.
    statement: >-
      Review of IL21 as a common gamma-chain family cytokine whose private
      receptor IL21R activates the JAK-STAT pathway upon ligand binding, with
      pleiotropic effects on B, T, NK, and dendritic cells (abstract only).
  - source_id: PMID:37339051
    title: A structural blueprint for interleukin-21 signal modulation.
    statement: >-
      Resolves the structural architecture of the ternary IL21:IL21R:IL2RG
      signaling complex and defines how ligand geometry controls JAK1/JAK3
      juxtaposition and STAT3 vs STAT1 activation amplitude.
  - source_id: Reactome:R-HSA-9005980
    title: IL21 binds IL21R:JAK1
    statement: >-
      Reactome reaction documenting initial high-affinity binding of secreted
      IL21 to the IL21R:JAK1 complex at the plasma membrane.
  - source_id: Reactome:R-HSA-9006844
    title: IL21:IL21R:JAK1 binds IL2RG:JAK3
    statement: >-
      Reactome reaction documenting recruitment of the IL2RG:JAK3 subunit to
      form the active ternary IL21:IL21R:IL2RG receptor complex.
  - source_id: Reactome:R-HSA-9006850
    title: IL21 receptor JAK phosphorylation
    statement: >-
      Reactome reaction documenting reciprocal phosphorylation of JAK1 and JAK3
      at the activated IL21 receptor complex.
  - source_id: Reactome:R-HSA-9006870
    title: IL21 receptor STAT phosphorylation
    statement: >-
      Reactome reaction documenting JAK1/JAK3-mediated phosphorylation of STAT3
      and STAT1 docked at phosphorylated IL21R.
  - source_id: file:genes/human/IL21/IL21-ai-review.yaml
    title: Human IL21 gene review
    statement: >-
      Curates human IL21 (UniProtKB:Q9HBE4) with GO:0005125 (cytokine activity)
      and GO:0038114 (interleukin-21-mediated signaling pathway), upgrading
      GO:0005126 (cytokine receptor binding) and GO:0005134 (interleukin-2
      receptor binding).
  - source_id: file:interpro/panther/PTHR14356/PTHR14356-review.yaml
    title: PANTHER PTHR14356 (INTERLEUKIN-15-RELATED) family review
    statement: >-
      Documents subfamily partitioning of PTHR14356 into PTHR14356:SF2 (IL21)
      and PTHR14356:SF3 (IL15), scopes GO:0038114 to subfamily PTHR14356:SF2
      (node PTN007637558), and recommends family-wide placement of GO:0005125
      (cytokine activity, currently asserted by PAINT only at the IL15 node
      PTN002682897) at PTN002682898, the node whose seeds span both
      subfamilies.
  - source_id: PANTHER:PTN002682898
    title: PAINT node PTN002682898 for IL21
    statement: >-
      Local PAINT IBD node in PTHR14356 (node taxon not recorded in
      paint.tsv; seeds include IL21 and IL15 orthologs) asserting only
