notes: >-
  Three-step JAK-STAT cytokine signaling module modeling Interleukin-21
  (subfamily PTHR14356:SF2) signaling through the heterodimeric IL21R
  (PTHR23037:SF7) and common gamma chain IL2RG (PTHR23037:SF47) receptor complex.
  Per ligand-in-signaling conventions (projects/LIGANDS_IN_SIGNALING.md), the
  IL21 ligand annoton uses the subfamily selector PANTHER:PTHR14356:SF2 (because
  parent family PTHR14356 also contains IL15 in PTHR14356:SF3) and molecular
  function GO:0005125 (cytokine activity, an is_a child of GO:0048018 receptor
  ligand activity) rather than receptor-binding terms GO:0005126 or GO:0005134,
  resolving the Category A gap where GO:0038114 was annotated to IL21R and IL2RG
  in human GOA but omitted on human IL21. Neither IL21 ligand PAINT node
  attests a molecular function: PTN002682898 asserts only GO:0001819 and
  GO:0050778, and PTN007637558 only GO:0045954, all biological process terms;
  GO:0005125 on the ligand step rests on the IL21 gene review and literature.
  The IL21R annoton uses the specific GO:0001532 (interleukin-21 receptor
  activity, an is_a child of GO:0004896); its PAINT node PTN000547990 asserts
  the parent GO:0004896, a recorded mismatch of specificity. The shared IL2RG
  chain keeps GO:0004896.
