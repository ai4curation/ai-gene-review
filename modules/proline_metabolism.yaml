id: MODULE:proline_metabolism
title: Proline-P5C biosynthesis and catabolism
description: >-
  Eukaryotic proline metabolism interconverts L-glutamate, L-ornithine,
  delta-1-pyrroline-5-carboxylate (P5C) and L-proline. In the biosynthetic
  arm, L-glutamate is phosphorylated to L-glutamyl 5-phosphate and reduced
  with NADPH to L-glutamate 5-semialdehyde, which cyclizes spontaneously to
  P5C; P5C reductase then forms L-proline. The two glutamate-activating
  reactions are catalyzed either by two separate enzymes, a glutamate 5-kinase
  and a gamma-glutamyl-phosphate reductase (as in fungi), or by the kinase and
  reductase domains of a single bifunctional P5C synthase (as in animals and
  plants). Ornithine aminotransferase can feed the same semialdehyde/P5C pool
  from L-ornithine. In the catabolic arm, a FAD-dependent proline
  dehydrogenase associated with the mitochondrial respiratory chain oxidizes
  L-proline back to P5C, and a mitochondrial NAD-dependent P5C dehydrogenase
  oxidizes the semialdehyde to L-glutamate, so that proline can serve as a
  carbon and nitrogen source. Biosynthesis and degradation are separated by
  compartment and by regulation (feedback control of glutamate 5-kinase,
  proline-induced expression of the catabolic enzymes).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: YeastPathways:PROSYN-PWY
    title: L-proline biosynthesis I (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists GLUTKIN-RXN (PRO1), GLUTSEMIALDEHYDROG-RXN (PRO2),
      spontaneous cyclization (SPONTPRO-RXN) and PYRROLINECARBREDUCT-RXN
      (PRO3). All three gene assignments were retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PROSYN-PWY
  - source_id: YeastPathways:PROUT-PWY
    title: L-proline degradation (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists RXN-14903 (PUT1 proline dehydrogenase), spontaneous
      hydrolysis of P5C and RXN-14116 (P5C dehydrogenase) but gives no gene for
      RXN-14116; PUT2 (P07275) catalyzes it and was added.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PROUT-PWY
  - source_id: GO:0055129
    title: L-proline biosynthetic process
    statement: Module-level process for the glutamate-to-proline arm.
  - source_id: GO:0006562
    title: L-proline catabolic process
    statement: Module-level process for the proline-to-glutamate arm.
  - source_id: GO:0006527
    title: L-arginine catabolic process
    statement: >-
      OAT routes ornithine-derived carbon into the P5C pool; the full arginine
      route is modelled in arginine_catabolism_arginase_pathway.
  - source_id: GO:0019470
    title: trans-4-hydroxy-L-proline catabolic process
    statement: ALDH4A1 provides a downstream glutamate-forming step shared with trans-4-hydroxy-L-proline degradation.
  - source_id: PMID:2824433
    title: Gene-enzyme relationships in the proline biosynthetic pathway of Saccharomyces cerevisiae.
    statement: >-
      Interspecies complementation of E. coli proline auxotrophs showed that
      PRO1 encodes gamma-glutamyl kinase, PRO2 gamma-glutamyl phosphate
      reductase and PRO3 P5C reductase, establishing the split two-enzyme
      architecture in budding yeast.
  - source_id: PMID:1592829
    title: 'Proline biosynthesis in Saccharomyces cerevisiae: analysis of the PRO3 gene, which encodes delta 1-pyrroline-5-carboxylate reductase.'
    statement: PRO3 encodes the P5C reductase catalyzing the final step of proline biosynthesis and is constitutively expressed.
  - source_id: PMID:1384052
    title: A bifunctional enzyme (delta 1-pyrroline-5-carboxylate synthetase) catalyzes the first two steps in proline biosynthesis in plants.
    statement: >-
      Plant P5CS is a single bifunctional enzyme carrying gamma-glutamyl kinase
      and glutamic-gamma-semialdehyde dehydrogenase domains corresponding to
      E. coli ProB and ProA, establishing the fused architecture outside animals.
  - source_id: PMID:387737
    title: 'Genetics and physiology of proline utilization in Saccharomyces cerevisiae: enzyme induction by proline.'
    statement: >-
      Proline is converted to glutamate by the sequential action of proline
      oxidase (PUT1) and P5C dehydrogenase (PUT2), both induced by proline.
  - source_id: PMID:3125423
    title: 'Proline utilization in Saccharomyces cerevisiae: sequence, regulation, and mitochondrial localization of the PUT1 gene product.'
    statement: PUT1 carries a mitochondrial import signal and PUT1-lacZ fusions are mitochondrially localized.
  - source_id: PMID:3537723
    title: 'Proline utilization in Saccharomyces cerevisiae: analysis of the cloned PUT1 gene.'
    statement: Respiratory-deficient petite strains make no detectable proline oxidase activity, linking PUT1 activity to the electron transport chain.
  - source_id: PMID:6358862
    title: 'Proline utilization in Saccharomyces cerevisiae: analysis of the cloned PUT2 gene.'
    statement: PUT2 encodes P5C dehydrogenase.
  - source_id: PMID:3025596
    title: Amino-terminal fragments of delta 1-pyrroline-5-carboxylate dehydrogenase direct beta-galactosidase to the mitochondrial matrix in Saccharomyces cerevisiae.
    statement: PUT2 P5C dehydrogenase was localized to the mitochondrial matrix by fractionation and latency.
  - source_id: PMID:6997271
    title: 'Proline: an essential intermediate in arginine degradation in Saccharomyces cerevisiae.'
    statement: >-
      In yeast, P5C formed from ornithine is first reduced to proline by P5C
      reductase and only then oxidized via PUT1 and PUT2, so the arginine and
      proline routes converge at proline rather than at free P5C.
  - source_id: PMID:7009582
    title: Subcellular compartmentation in control of converging pathways for proline and arginine metabolism in Saccharomyces cerevisiae.
    statement: >-
      Yeast P5C reductase is cytoplasmic and P5C dehydrogenase particulate
      (presumably mitochondrial); compartmentation prevents futile cycling
      between proline and P5C.
  - source_id: PMID:25112878
    title: Proline biosynthesis is required for endoplasmic reticulum stress tolerance in Saccharomyces cerevisiae.
    statement: >-
      GFP fusions show Pro1p, Pro2p and Pro3p exclusively in the cytosol;
      pro1 and pro2 nulls grow without proline (arginine catabolism supplies
      P5C to PRO3) whereas pro3 nulls cannot.
  - source_id: PMID:18419821
    title: Ornithine-delta-aminotransferase is essential for arginine catabolism but not for proline biosynthesis.
    statement: >-
      Arabidopsis deltaOAT is mitochondrial and feeds P5C into the catabolic
      branch; proline biosynthesis proceeds predominantly via the glutamate
      route, so OAT is not a general proline-biosynthetic input.
  - source_id: file:human/ALDH18A1/ALDH18A1-ai-review.yaml
    title: ALDH18A1 gene review (human)
    statement: The review independently supports glutamate 5-kinase and glutamate-5-semialdehyde dehydrogenase activities for bifunctional P5C synthase.
  - source_id: file:human/OAT/OAT-ai-review.yaml
    title: OAT gene review (human)
    statement: The review supports ornithine transamination into the glutamate-5-semialdehyde/P5C pool.
  - source_id: file:human/PYCR1/PYCR1-ai-review.yaml
    title: PYCR1 gene review (human)
    statement: The review supports reduction of P5C to L-proline by PYCR1.
  - source_id: file:human/PYCR2/PYCR2-ai-review.yaml
    title: PYCR2 gene review (human)
    statement: The review supports reduction of P5C to L-proline by the PYCR2 paralog.
  - source_id: file:human/PRODH/PRODH-ai-review.yaml
    title: PRODH gene review (human)
    statement: The review supports FAD-dependent oxidation of L-proline to P5C at the mitochondrial inner membrane.
  - source_id: file:human/ALDH4A1/ALDH4A1-ai-review.yaml
    title: ALDH4A1 gene review (human)
    statement: The review supports NAD-dependent oxidation of glutamate 5-semialdehyde to L-glutamate.
notes: >-
  GENERALIZE (YeastPathways project, 2026-10): the former mammal-only module
  was broadened to the eukaryotic proline-P5C cycle. The chemistry is shared
  across fungi, animals and plants; the main architectural difference is in
  the glutamate-activating arm, now an EXACTLY_ONE variant set: a split route
  with separate glutamate 5-kinase (S. cerevisiae PRO1, S. pombe pro2,
  PANTHER PTHR43654) and gamma-glutamyl-phosphate reductase (S. cerevisiae
  PRO2, S. pombe pro1, PTHR11063) versus the fused P5CS of animals and plants
  (ALDH18A1, PTHR11063:SF8). The previous mammalian ALDH18A1 leaves are kept
  unchanged as the fused variant. Note the confusing gene names: S. pombe pro1
  is the reductase and pro2 the kinase, the reverse of S. cerevisiae. The
  remaining steps are shared and gained fungal representatives. The P5C
  dehydrogenase role no longer carries a PANTHER id because the orthologous
  enzymes fall in different PANTHER families (human ALDH4A1 PTHR14516, yeast
  PUT2 and S. pombe put2 PTHR42862, Arabidopsis ALDH12A1 PTHR43521), so no
  single family contains the representatives. Locations are generalized:
  P5C reductase is given cytoplasm (yeast PRO3 and pro3 are cytosolic, while
  human PYCR1/PYCR2 are mitochondrial; mitochondrion is part of cytoplasm),
  proline dehydrogenase is given mitochondrion (inner-membrane association is
  curated for human PRODH, whereas for PUT1 the direct evidence is
  mitochondrial import plus a requirement for a functional respiratory chain),
  and ornithine aminotransferase carries no module location (cytosolic in
  yeasts, matrix in animals and plants). In S. cerevisiae the biosynthetic
  enzymes are cytosolic and the catabolic enzymes mitochondrial, which is why
  arginine-derived P5C must pass through proline before it is oxidized
  (PMID:6997271, PMID:7009582, PMID:25112878); that route is modelled in
  arginine_catabolism_arginase_pathway, which reuses the P5C reductase,
  proline dehydrogenase and P5C dehydrogenase roles. OAT is retained here as
  an alternative P5C input in its reversible role; in Arabidopsis it feeds
  only catabolism (PMID:18419821), and in yeast it contributes to proline
  only in pro1/pro2 mutants under derepressed conditions, so its
  proline-biosynthetic process annotation is lineage-dependent. YeastCyc
  corrections: PUT2 added as catalyst of RXN-14116 (no gene in YeastCyc).
  GO-CAM disagreements: both YeastPathways models place every activity in
  cytosol, including mitochondrial PUT1 and PUT2; the PomBase model
  678073a900003902 places put1 in the mitochondrial matrix rather than at the
  inner membrane, includes an unidentified mitochondrial proline transporter,
  glutamine synthetase, glutamine transport and mitochondrial tRNA charging
  (outside this module), and places arginase activities in the urea cycle
  process. Bacterial ProB-ProA-ProC and fused PutA architectures are modelled
  separately (bacterial_fused_puta_proline_catabolism). OAT and PRODH
  cofactors are retained explicitly as pyridoxal 5'-phosphate and FAD.
  GO:0010133, the former proline-to-glutamate catabolism term, is obsolete, so
  GO:0006562 is used. Disease and signaling consequences remain outside this
  reaction chain.
