  connections:
    - source: glutamate_to_semialdehyde
      target: pycr_proline_formation
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: Glutamate 5-semialdehyde spontaneously equilibrates with the P5C substrate reduced by P5C reductase.
    - source: oat_p5c_supply
      target: pycr_proline_formation
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: OAT supplies the same glutamate-5-semialdehyde/P5C pool used by P5C reductase.
    - source: oat_p5c_supply
      target: aldh4a1_glutamate_formation
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: >-
        Where OAT and P5C dehydrogenase share a compartment (mitochondria of
        animals and plants), OAT supplies the semialdehyde directly; in yeast,
        cytosolic ornithine-derived P5C reaches P5C dehydrogenase only via
        proline (PMID:6997271).
    - source: pycr_proline_formation
      target: prodh_p5c_formation
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: This edge denotes conceptual cycle re-entry, not simultaneous flux; biosynthesis and catabolism are opposing, reciprocally controlled arms.
    - source: prodh_p5c_formation
      target: aldh4a1_glutamate_formation
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: Proline dehydrogenase-derived P5C equilibrates with glutamate 5-semialdehyde, the P5C dehydrogenase substrate.
  knowledge_gaps:
    - gap_statement: >-
        The carrier that moves L-proline (or P5C) between the cytosolic
        biosynthetic enzymes and the mitochondrial catabolic enzymes is not
        identified in yeasts.
      boundary: >-
        Proline oxidation requires mitochondrial import of cytosolic proline,
        and the PomBase model represents this as an unidentified mitochondrial
        proline transporter; transport is kept outside the enzymatic core until
        the carrier is identified.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Why yeast P5C dehydrogenase oxidizes P5C derived from proline but not
        P5C derived from ornithine is not explained at the molecular level.
      boundary: >-
        Compartmentation (cytosolic OAT versus mitochondrial PUT1/PUT2) is the
        accepted explanation (PMID:6997271), but whether cytosolic P5C or its
        semialdehyde form can enter mitochondria at all has not been tested
        directly.
      gap_kind:
        - BIOLOGY
