id: MODULE:triacylglycerol_biosynthesis
title: Glycerolipid / triacylglycerol biosynthesis (glycerol-3-phosphate and DHAP routes)
description: >-
  Triacylglycerol (TAG) is the principal energy-storage lipid of eukaryotic cells. It is assembled from a
  three-carbon glycerol backbone and fatty acyl-CoAs, and the pathway's intermediates phosphatidic acid (PA) and
  diacylglycerol (DAG) are also the branch points to the membrane glycerophospholipids. Lysophosphatidic acid
  (LPA) is formed either by sn-1 acylation of glycerol-3-phosphate (glycerol-3-phosphate acyltransferase, GPAT)
  or by acylation of dihydroxyacetone phosphate followed by NADPH-dependent reduction of 1-acyl-DHAP; in fungi
  the same GPAT enzymes accept both acceptors, whereas the DHAP acyltransferase of animals belongs to
  peroxisomal ether-lipid synthesis. LPA is acylated at sn-2 to PA by 1-acylglycerol-3-phosphate
  O-acyltransferases (LPAATs) of the AGPAT family and, in fungi, also by MBOAT-family and lipid-droplet
  acyltransferases. A Mg2+-dependent lipin-family phosphatidate phosphatase, a soluble enzyme that acts on
  membranes, dephosphorylates PA to DAG. DAG is finally esterified at sn-3 either with an acyl-CoA by the
  diacylglycerol O-acyltransferases (the MBOAT-family DGAT1 and the DGAT2-family enzymes) or, independently of
  acyl-CoA, by a phospholipid:diacylglycerol acyltransferase (PDAT) that transfers an acyl chain from a
  glycerophospholipid. Synthesis takes place on the endoplasmic reticulum and on lipid droplets, into which TAG is
  packaged; in animals the first acylation is also performed at the mitochondrial outer membrane. Inherited
  defects in the mammalian enzymes cause metabolic disease (AGPAT2 congenital generalized lipodystrophy, LPIN1
  recurrent rhabdomyolysis, DGAT1 congenital diarrhoea).
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: YeastPathways:TRIGLSYN-PWY
    title: diacylglycerol and triacylglycerol biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists GPT2/SCT1 (RXN-1381), SLC1 (RXN-1623), DPP1/LPP1/PAH1 (PHOSPHATIDATE-PHOSPHATASE-RXN),
      DGA1 (DIACYLGLYCEROL-O-ACYLTRANSFERASE-RXN) and LRO1 (RXN-1641), plus a gene-less DAG transacylase
      (RXN-12383) and the DGK1 DAG kinase reaction (RXN-12959). PAH1 was retained as the PA phosphatase; DPP1 and
      LPP1 were not (PMID:22345606); ALE1 and LOA1 were added as further LPAATs; RXN-12383 has no yeast enzyme
      and was left out; DGK1 catalyses the reverse, PA-forming reaction and is outside the module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=TRIGLSYN-PWY
  - source_id: YeastPathways:PWY3O-6635
    title: superpathway of phosphatidate biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Combines the glycerol-3-phosphate and DHAP routes to PA with GPD1/GPD2 glycerol-3-phosphate dehydrogenase.
      The GPAT/DHAPAT (GPT2, SCT1), AYR1 and SLC1 assignments were retained; glycerol-3-phosphate supply by
      GPD1/GPD2 is modelled in glycerol_metabolism.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-6635
  - source_id: YeastPathways:PWY3O-6407
    title: phosphatidate biosynthesis I (the dihydroxyacetone pathway) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      DHAP acylation by GPT2/SCT1 (RXN3O-5279), 1-acyl-DHAP reduction by AYR1 (RXN3O-9800) and LPA acylation by
      SLC1. Retained as the DHAP-route variant.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-6407
  - source_id: YeastPathways:PWY3O-6499
    title: phosphatidate biosynthesis II (the glycerol-3-phosphate pathway) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Glycerol-3-phosphate acylation by GPT2/SCT1 and LPA acylation by SLC1, preceded by GPD1/GPD2. Retained as the
      glycerol-3-phosphate-route variant.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-6499
  - source_id: GO:0019432
    title: triglyceride biosynthetic process
    statement: The module as a whole synthesises triacylglycerol (GO:0019432).
  - source_id: GO:0006654
    title: phosphatidic acid biosynthetic process
    statement: The LPA-forming and LPA-acylating steps build phosphatidic acid, the shared intermediate (GO:0006654).
  - source_id: GO:0006651
    title: diacylglycerol biosynthetic process
    statement: Lipin-family PA phosphatases produce diacylglycerol, the branch point to TAG and phospholipids (GO:0006651).
  - source_id: PMID:22345606
    title: Metabolism and regulation of glycerolipids in the yeast Saccharomyces cerevisiae.
    statement: >-
      PA is made in the ER by the SCT1- and GPT2-encoded glycerol-3-P acyltransferases and the SLC1- and
      ALE1-encoded lysoPA acyltransferases; the GPATs also use dihydroxyacetone-P, whose acyl product is reduced
      by the LD- and ER-associated AYR1 reductase; PAH1 provides DAG that DGA1 (acyl-CoA-dependent) and LRO1
      (phospholipid-dependent) acylate to TAG; DPP1 and LPP1 are not involved in de novo TAG synthesis.
  - source_id: PMID:11544256
    title: 'The initial step of the glycerolipid pathway: identification of glycerol 3-phosphate/dihydroxyacetone phosphate dual substrate acyltransferases in Saccharomyces cerevisiae.'
    statement: >-
      GAT1 (= GPT2, YKR067w) and GAT2 (= SCT1, YBL011w) are the major yeast G-3-P acyltransferases and both are
      G-3-P/dihydroxyacetone phosphate dual-substrate sn-1 acyltransferases.
  - source_id: PMID:10049376
    title: Redundant systems of phosphatidic acid biosynthesis via acylation of glycerol-3-phosphate or dihydroxyacetone phosphate in the yeast Saccharomyces cerevisiae.
    statement: >-
      Gat1p in lipid particles and ER accepts both glycerol-3-phosphate and DHAP, and in vivo labelling shows that
      both precursors are incorporated as the glycerolipid backbone.
  - source_id: PMID:10617610
    title: 1-Acyldihydroxyacetone-phosphate reductase (Ayr1p) of the yeast Saccharomyces cerevisiae encoded by the open reading frame YIL124w is a major component of lipid particles.
    statement: AYR1 encodes the NADPH-dependent 1-acyl-DHAP reductase of lipid particles and ER; microsomes contain at least one further reductase.
  - source_id: PMID:9401016
    title: Biosynthesis of phosphatidic acid in lipid particles and endoplasmic reticulum of Saccharomyces cerevisiae.
    statement: Lipid particles acylate glycerol-3-phosphate to PA in two steps that require Gat1p and Slc1p; the ER has a second, independent PA-synthesis system.
  - source_id: PMID:17726007
    title: Identification of a novel lysophospholipid acyltransferase in Saccharomyces cerevisiae.
    statement: The MBOAT-family LPT1 (= ALE1) acylates lysophospholipids including LPA and works with Slc1 to incorporate unsaturated acyl chains.
  - source_id: PMID:22090344
    title: YPR139c/LOA1 encodes a novel lysophosphatidic acid acyltransferase associated with lipid droplets and involved in TAG homeostasis.
    statement: LOA1 (VPS66) is a lipid-droplet LPA acyltransferase with a preference for oleoyl-CoA whose loss reduces TAG.
  - source_id: PMID:16467296
    title: The Saccharomyces cerevisiae Lipin homolog is a Mg2+-dependent phosphatidate phosphatase enzyme.
    statement: >-
      PAH1 encodes the Mg2+-dependent PA phosphatase, present in membrane and cytosolic fractions; pah1 mutants
      accumulate PA and have less DAG and TAG; human LPIN1 has the same activity.
  - source_id: PMID:10747858
    title: A lecithin cholesterol acyltransferase-like gene mediates diacylglycerol esterification in yeast.
    statement: LRO1 esterifies DAG using phosphatidylcholine as acyl donor and is a major contributor to TAG synthesis.
  - source_id: PMID:10829075
    title: 'Phospholipid:diacylglycerol acyltransferase: an enzyme that catalyzes the acyl-CoA-independent formation of triacylglycerol in yeast and plants.'
    statement: >-
      PDAT synthesises TAG from phospholipid acyl donors and DAG in yeast and plants; budding-yeast PDAT and its
      fission-yeast and Arabidopsis relatives form a distinct LCAT-related branch.
  - source_id: PMID:11751875
    title: The DGA1 gene determines a second triglyceride synthetic pathway in yeast.
    statement: >-
      DGA1, the sole DGAT2-family gene in yeast, is an acyl-CoA:DAG acyltransferase; dga1 lro1 double mutants
      almost abolish TAG synthesis, and the residual activity depends on the sterol acyltransferase ARE2.
  - source_id: PMID:11751830
    title: Synthesis of triacylglycerols by the acyl-coenzyme A:diacyl-glycerol acyltransferase Dga1p in lipid particles of the yeast Saccharomyces cerevisiae.
    statement: Dga1p is the major DAGAT activity of lipid particles; Lro1p and Dga1p are the major contributors to cellular TAG synthesis.
  - source_id: PMID:18458076
    title: Characterization of the yeast DGK1-encoded CTP-dependent diacylglycerol kinase.
    statement: DGK1 converts DAG back to PA using CTP; it is the reverse of the lipin step and is recorded as context, not as a module part.
  - source_id: file:human/GPAM/GPAM-ai-review.yaml
    title: GPAM gene review (human)
    statement: Glycerol-3-phosphate acyltransferase 1 (UniProtKB:Q9HCL2, GO:0004366) matches the completed human GPAM review.
  - source_id: file:human/AGPAT2/AGPAT2-ai-review.yaml
    title: AGPAT2 gene review (human)
    statement: 1-acylglycerol-3-phosphate O-acyltransferase 2 (UniProtKB:O15120, GO:0003841) matches the completed human AGPAT2 review.
  - source_id: file:human/LPIN1/LPIN1-ai-review.yaml
    title: LPIN1 gene review (human)
    statement: Lipin-1 phosphatidate phosphatase (UniProtKB:Q14693, GO:0008195) matches the completed human LPIN1 review.
  - source_id: file:human/DGAT1/DGAT1-ai-review.yaml
    title: DGAT1 gene review (human)
    statement: Diacylglycerol O-acyltransferase 1 (UniProtKB:O75907, GO:0004144) matches the completed human DGAT1 review.
  - source_id: file:human/DGAT2/DGAT2-ai-review.yaml
    title: DGAT2 gene review (human)
    statement: Diacylglycerol O-acyltransferase 2 (UniProtKB:Q96PD7, GO:0004144) matches the completed human DGAT2 review.
notes: >-
  GENERALIZE (YeastPathways project, 2026-10). The former human-only module (GPAM -> AGPAT2 -> LPIN1 ->
  DGAT1/DGAT2) was broadened to eukaryotic glycerolipid/TAG synthesis. All human leaves, families and gene-review
  evidence are kept unchanged. Structural changes: (1) LPA formation is now a ONE_OR_MORE variant set of the
  glycerol-3-phosphate route and the DHAP route. The G3P-acylation node holds two GPAT annotons because animal
  GPAM (PANTHER PTHR12563, mitochondrial outer membrane) and fungal GPT2/SCT1 (PTHR31605, ER and lipid
  droplets) are not in the same PANTHER family; the fungal enzymes are dual G3P/DHAP acyltransferases
  (PMID:11544256), so they also ground the DHAP-acylation step. The animal DHAP acyltransferase GNPAT acts in
  peroxisomal ether-lipid synthesis (ether_lipid_plasmalogen_biosynthesis) and is not used here. (2) LPA
  acylation gained fungal exemplars: SLC1 and S. pombe SPAC1851.02 join AGPAT2 in PTHR10434, and two further
  annotons were added for the MBOAT-family ALE1/LPT1 (PTHR13906:SF4) and the lipid-droplet LOA1/VPS66
  (PTHR23063:SF60). ICT1 (Q12385), reported as an LPAAT, was not added because its contribution to de novo PA
  synthesis is not established in the cached literature. (3) PAH1 and S. pombe ned1 were added to the lipin
  family node. (4) DAG acylation is a ONE_OR_MORE variant set of acyl-CoA-dependent DGAT (DGAT1 MBOAT; DGAT2
  family with yeast DGA1 and S. pombe dga1) and acyl-CoA-independent PDAT (LRO1, S. pombe plh1). The sterol
  acyltransferase ARE2 (PTHR10408, the DGAT1 family) contributes a minor DGAT activity in yeast
  (PMID:11751875) but is not used as an exemplar because its principal function is steryl-ester synthesis.
  YeastCyc corrections: DPP1 and LPP1, listed as PA phosphatases in TRIGLSYN-PWY, are broad-specificity lipid
  phosphate phosphatases that are not involved in de novo TAG synthesis (PMID:22345606) and were not added; ALE1
  and LOA1 are missing from YeastCyc and were added; RXN-12383 (DAG:DAG transacylase) has no yeast gene and is
  not modelled; DGK1 (RXN-12959) runs the reverse reaction (DAG -> PA with CTP, PMID:18458076) and is noted as
  a regulator of the PA/DAG balance outside the module; GPD1/GPD2 glycerol-3-phosphate supply is in
  glycerol_metabolism. Compartments: YeastCyc-derived GO-CAMs put every activity in cytosol, but the yeast
  GPATs and SLC1 are ER and lipid-droplet enzymes, AYR1 is on lipid droplets and ER, DGA1 is enriched on lipid
  droplets, and PAH1 is a soluble enzyme that acts on the nuclear/ER membrane (PMID:22345606, PMID:10617610,
  PMID:11751830, PMID:16467296). GO-CAM disagreements: (a) all four YeastPathways models place activities in
  cytosol; (b) YeastPathways_TRIGLSYN-PWY includes DPP1 and LPP1 as PA phosphatases and DGK1 as part of TAG
  biosynthesis; (c) the PomBase model 6796b94c00005663 also contains SPAC6G10.03c as an LPA acyltransferase
  (UniProt names it a probable mitochondrial cardiolipin-specific deacylase), SPAC977.08/ayr2 as a second
  1-acyl-DHAP reductase (UniProt: uncharacterized oxidoreductase), ptp4/dgk1, pld1, gpd1/gpd2 and ept1, which
  are either unverified for this activity or outside this module. Plant seed-oil assembly is modelled
  separately in seed_triacylglycerol_biosynthesis; the CDP-diacylglycerol and Kennedy branches that consume PA
  and DAG are cdp_dag_phospholipid_synthesis and kennedy_pathway_phospholipid_synthesis.
