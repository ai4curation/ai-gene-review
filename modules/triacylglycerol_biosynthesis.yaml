  concepts:
    - preferred_term: triglyceride biosynthetic process
      term:
        id: GO:0019432
        label: triglyceride biosynthetic process
      description: Assembly of triacylglycerol from a glycerol-3-phosphate or DHAP backbone and acyl donors.
    - preferred_term: phosphatidic acid biosynthetic process
      term:
        id: GO:0006654
        label: phosphatidic acid biosynthetic process
      description: The LPA-forming and LPA-acylating steps build the PA intermediate.
    - preferred_term: diacylglycerol biosynthetic process
      term:
        id: GO:0006651
        label: diacylglycerol biosynthetic process
      description: Lipin-family PA phosphatases produce DAG, the branch point to TAG and phospholipids.
  context:
    taxa:
      - preferred_term: Eukaryota
        term:
          id: NCBITaxon:2759
          label: Eukaryota
        description: Fungi and animals share the reaction chain; enzyme families and compartments differ at the first and last steps.
    cellular_components:
      - preferred_term: endoplasmic reticulum membrane
        term:
          id: GO:0005789
          label: endoplasmic reticulum membrane
        description: LPAATs, lipin (on the membrane surface), DGAT1, PDAT and fungal GPATs act at the ER.
      - preferred_term: lipid droplet
        term:
          id: GO:0005811
          label: lipid droplet
        description: Fungal GPAT, AYR1, SLC1, LOA1 and DGA1, and animal DGAT2, act on lipid droplets, which store the TAG product.
      - preferred_term: mitochondrial outer membrane
        term:
          id: GO:0005741
          label: mitochondrial outer membrane
        description: Animal GPAM/GPAT1 performs the first acylation here.
  gocam_associations:
    - model: gomodel:YeastPathways_TRIGLSYN-PWY
      title: 'diacylglycerol and triacylglycerol biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with GPT2/SCT1, SLC1, PAH1 (plus DPP1/LPP1), DGA1, LRO1 and DGK1, all in cytosol and part
        of GO:0019432. DPP1, LPP1 and DGK1 are not module members.
    - model: gomodel:YeastPathways_PWY3O-6635
      title: 'superpathway of phosphatidate biosynthesis - imported from: Saccharomyces Genome Database'
      description: G3P and DHAP routes to PA (GPT2, SCT1, AYR1, SLC1) plus GPD1/GPD2, all in cytosol, part of GO:0006654.
    - model: gomodel:YeastPathways_PWY3O-6407
      title: 'phosphatidate biosynthesis I (the dihydroxyacetone pathway) - imported from: Saccharomyces Genome Database'
      description: DHAP route (GPT2/SCT1 DHAP acyltransferase, AYR1, SLC1), part of GO:0008654.
    - model: gomodel:YeastPathways_PWY3O-6499
      title: 'phosphatidate biosynthesis II (the glycerol-3-phosphate pathway) - imported from: Saccharomyces Genome Database'
      description: G3P route (GPD1/GPD2, GPT2/SCT1, SLC1), part of GO:0008654.
    - model: gomodel:6796b94c00005663
      title: phosphatidic acid biosynthetic process (GO:0006654) and triglyceride biosynthetic process (GO:0019432)
      description: >-
        PomBase S. pombe model with sct1 (GPAT and DHAPAT), ayr1, slc1, vps66, ned1, dga1 and plh1 in ER or ER
        membrane. It also includes ayr2, SPAC6G10.03c, ptp4, pld1, gpd1/gpd2 and ept1 (see notes).
