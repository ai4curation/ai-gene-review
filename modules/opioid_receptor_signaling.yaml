id: MODULE:opioid_receptor_signaling
title: G protein-coupled opioid receptor signaling pathway module
description: >-
  The G protein-coupled opioid receptor signaling pathway (GO:0038003) and its canonical
  adenylate cyclase-inhibiting branch (GO:0031635) are initiated when endogenous opioid and
  opioid-like neuropeptide precursors — proenkephalin-A (PENK, PANTHER:PTHR11438:SF3; cleaved
  into Met-enkephalin, Leu-enkephalin, Met-enkephalin-Arg-Phe, and Met-enkephalin-Arg-Gly-Leu),
  proenkephalin-B / prodynorphin (PDYN, PANTHER:PTHR11438:SF4; cleaved into dynorphin A,
  dynorphin B, alpha-/beta-neoendorphin, and Leu-enkephalin), and prepronociceptin (PNOC,
  PANTHER:PTHR11438:SF2; cleaved into nociceptin / orphanin FQ), together with
  pro-opiomelanocortin-derived beta-endorphin — are secreted from neuronal dense-core vesicles
  and bind the seven-transmembrane opioid receptor family GPCRs OPRM1 (mu-type opioid receptor,
  PANTHER:PTHR24229:SF7), OPRD1 (delta-type opioid receptor, PANTHER:PTHR24229:SF2), OPRK1
  (kappa-type opioid receptor, PANTHER:PTHR24229:SF1), and OPRL1 (nociceptin/NOP receptor,
  PANTHER:PTHR24229:SF11) at the plasma membrane and synaptic membrane. Agonist-bound opioid
  receptors couple to pertussis-toxin-sensitive inhibitory heterotrimeric Gi/o proteins
  (exemplified by GNAI1, PANTHER:PTHR10218:SF359), inhibiting adenylate cyclase (exemplified by
  ADCY5, PANTHER:PTHR45627:SF7) to lower intracellular cAMP while released Gbeta-gamma dimers
  activate GIRK potassium channels and inhibit voltage-gated Ca2+ channels to suppress
  presynaptic neurotransmitter release and nociceptive transmission.
status: DRAFT
evidence:
  - source_id: GO:0038003
    title: G protein-coupled opioid receptor signaling pathway
    statement: >-
      The module is grounded in the GO biological process term for the G protein-coupled opioid
      receptor signaling pathway (GO:0038003) and its canonical adenylate cyclase-inhibiting
      branch (GO:0031635).
  - source_id: GO:0031635
    title: adenylate cyclase-inhibiting opioid receptor signaling pathway
    statement: >-
      Models the canonical Gi/o-coupled adenylate cyclase-inhibiting opioid receptor signaling
      cascade (GO:0031635) triggered by endogenous opioid peptides (PENK, PDYN, PNOC) across
      OPRM1, OPRD1, OPRK1, and OPRL1.
  - source_id: Reactome:R-HSA-373076
    title: G alpha (i) signalling events
    supporting_text: >-
      The classic signaling mechanism for Gi/o is inhibition of adenylate cyclase, causing a
      decrease in intracellular cAMP levels. Values for cAMP may then be used to regulate the
      activity of cAMP-dependent protein kinase (PKA) and Exchange Protein Activated by cAMP
      (EPAC).
    statement: >-
      Establishes that opioid peptide ligands bind Gi/o-coupled opioid receptors (OPRM1, OPRD1,
      OPRK1, OPRL1) to inhibit adenylate cyclase and decrease intracellular cAMP.
  - source_id: PMID:7057924
    title: Primary structure of the human Met- and Leu-enkephalin precursor and its mRNA.
    supporting_text: >-
      The corresponding amino acid sequence shows that the precursor is 267 amino acids long and
      contains six interspersed Met-enkephalin sequences and one Leu-enkephalin sequence. Five of
      the seven enkephalins are flanked on both sides by pairs of basic amino acid residues.
    statement: >-
      Demonstrates that human PENK encodes a polyprotein precursor yielding six Met-enkephalin
      and one Leu-enkephalin opioid peptides.
  - source_id: PMID:9047294
    title: NMR and structural model of dynorphin A (1-17) bound to dodecylphosphocholine micelles.
    supporting_text: >-
      Dynorphin A (1-17) (dynorphin) acts preferentially and with high affinity at the
      kappa-opioid receptor, for which it is the natural, endogenous ligand.
    statement: >-
      Establishes PDYN-derived dynorphin A(1-17) as the high-affinity endogenous agonist of the
      kappa-opioid receptor (OPRK1).
  - source_id: PANTHER:PTN000153716
    title: PAINT node PTN000153716 for the proenkephalin/prodynorphin/pronociceptin family (PTHR11438)
    statement: >-
      Local PAINT IBD root node in PTHR11438 with propagated terms C:GO:0043025, F:GO:0001515,
      F:GO:0031628, P:GO:0007218, P:GO:0019233; PAINT date 20260828.
notes: >-
  Curated signaling-pathway module for the G protein-coupled opioid receptor signaling pathway
  (GO:0038003) and its adenylate cyclase-inhibiting branch (GO:0031635) built with PANTHER
  FAMILY/subfamily selectors across the endogenous proenkephalin-family opioid peptide ligands
  PENK (PANTHER:PTHR11438:SF3), PDYN (PANTHER:PTHR11438:SF4), and PNOC (PANTHER:PTHR11438:SF2),
  their cognate GPCRs OPRM1 (PANTHER:PTHR24229:SF7), OPRD1 (PANTHER:PTHR24229:SF2), OPRK1
  (PANTHER:PTHR24229:SF1), and OPRL1 (PANTHER:PTHR24229:SF11), and downstream Gi/o alpha (GNAI1,
  PANTHER:PTHR10218:SF359) and adenylate cyclase (ADCY5, PANTHER:PTHR45627:SF7) effectors.
