        label: G protein-coupled opioid receptor signaling pathway
      description: >-
        The series of molecular signals generated as a consequence of a G protein-coupled opioid
        receptor (OPRM1, OPRD1, OPRK1, or OPRL1) binding to one of its physiological opioid
        peptide ligands.
    - preferred_term: adenylate cyclase-inhibiting opioid receptor signaling pathway
      term:
        id: GO:0031635
        label: adenylate cyclase-inhibiting opioid receptor signaling pathway
      description: >-
        A G protein-coupled opioid receptor signaling pathway in which ligand-activated opioid
        receptors couple to Gi/o proteins to inhibit adenylate cyclase and reduce intracellular
        cAMP concentration.
