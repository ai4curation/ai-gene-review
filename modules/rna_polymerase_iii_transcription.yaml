    - source: tfiiib_recruitment
      target: pol3_transcription
      connection_type: PRECEDES
      description: BRF1 or BRF2 recruits Pol III, which opens the promoter without ATP hydrolysis and initiates.
    - source: maf1_pol3_inhibition
      target: pol3_enzyme
      connection_type: NEGATIVELY_REGULATES
      description: MAF1 binds Pol III and prevents its recruitment to promoter-bound TFIIIB.
