id: MODULE:rna_polymerase_iii_transcription
title: Human RNA polymerase III transcription — type 1 (TFIIIA-TFIIIC), type 2 (TFIIIC) and type 3 (SNAPc) promoter recognition, BRF1- or BRF2-TFIIIB recruitment, the 17-subunit Pol III with RPC7 paralogue choice, intrinsic termination, and MAF1 repression
description: >-
  RNA polymerase III (Pol III) transcribes short, abundant non-coding RNAs: all tRNAs,
  5S rRNA, U6 snRNA, 7SK RNA, the RNA components of RNase P and RNase MRP, 7SL RNA,
  vault and Y RNAs. It is recruited by the TFIIIB complex, which in turn is placed
  upstream of the start site by promoter-specific assembly factors. Three promoter types
  differ in how this happens. Type 1 promoters (5S rRNA genes) have an internal control
  region bound by the zinc-finger factor TFIIIA, which recruits the six-subunit TFIIIC.
  Type 2 promoters (tRNA genes and others) have internal A and B boxes bound directly by
  TFIIIC. Type 3 promoters (U6, 7SK and other gene-external promoters, found in
  vertebrates) have an upstream proximal sequence element bound by the five-subunit
  snRNA-activating protein complex SNAPc and a TATA box. TFIIIB consists of the TATA-box
  binding protein TBP, the SANT-domain protein BDP1 and a TFIIB-related factor, BRF1 at
  type 1 and type 2 promoters or BRF2 at type 3 promoters. Pol III has 17 subunits: the
  catalytic RPC1 (POLR3A) and RPC2 (POLR3B), the RPAC1 and RPAC2 subunits shared with
  Pol I (POLR1C, POLR1D), the five RPABC subunits shared with Pol I and Pol II (POLR2E,
  POLR2F, POLR2H, POLR2K, POLR2L), the TFIIE-like heterotrimer RPC3-RPC6-RPC7 (POLR3C,
  POLR3F, and POLR3G or its paralogue POLR3GL), the TFIIF-like heterodimer RPC4-RPC5
  (POLR3D, POLR3E), the RPC8-RPC9 stalk (POLR3H, CRCP) and the TFIIS-like RPC10
  (POLR3K). Pol III terminates without accessory factors at a run of thymidines on the
  non-template strand and re-initiates efficiently on the same gene. Under nutrient
  limitation or stress, the dephosphorylated repressor MAF1 binds Pol III and prevents
  its recruitment by TFIIIB.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000128
    title: RNA polymerase III transcription pathway
    statement: >-
      The module boundary follows the RGD Pathway Ontology term and its diagram, which
      draws TFIIIA with TFIIIC, TFIIIC with TFIIIB, SNAPc with TFIIIB (with Pou2f1 and
      Zfp143 acting on SNAPc), TFIIIB with RNA polymerase III, RNA polymerase III
      producing the pre-tRNA transcript, Maf1 and Rb1 inhibiting TFIIIB and Pol III or
      SNAPc, and Sub1 with TFIIIB and TFIIIC. Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0000128.yaml).
  - source_id: GO:0006383
    title: transcription by RNA polymerase III
    statement: >-
      The GO process mapped to PW:0000128 (skos:relatedMatch, from the PW definition
      cross-reference in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). It is the
      module's process concept.
  - source_id: PMID:18644873
    title: Different functional modes of p300 in activation of RNA polymerase III transcription from chromatin templates.
    statement: Pol III needs TFIIIB and TFIIIC, plus TFIIIA at 5S genes; TFIIIC reads the A and B boxes of type 2 genes and directs TFIIIB and Pol III binding.
    supporting_text: In the case of tRNA and VA1 genes (subclass 2 genes), gene-internal core promoter elements (A and B boxes) are recognized directly by TFIIIC, which in turn directs the sequential binding of TFIIIB and Pol III.
  - source_id: PMID:28743884
    title: Molecular mechanisms of Bdp1 in TFIIIB assembly and RNA polymerase III transcription initiation.
    statement: TFIIIB is TBP, BDP1 and BRF1 or BRF2; BRF2 replaces BRF1 at type 3 promoters, which carry a TATA box and an upstream PSE bound by SNAPc.
    supporting_text: In vertebrates, the TFIIB-related factor II (Brf2) replaces Brf1 at type III promoters such as the U6 snRNA promoter, which, unlike the other types of Pol III promoters, are characterized by the presence of a strong TATA box and an upstream proximal sequence (PSE) recognized by the multisubunit transcription factor SNAPc
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000128 (RNA polymerase III
  transcription pathway) through the RGD_PATHWAY_ONTOLOGY project's diagram->module route
  (seed in projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier related_module_only
  because the mapped GO term is shared with the fly module). RGD curates 58 human genes to
  PW:0000128: BDP1 BRF1 BRF2 CLP1 CRCP ELAC1 ELAC2 GTF3A GTF3C1 GTF3C2 GTF3C3 GTF3C4 GTF3C5
  GTF3C6 MAF1 POLR1C POLR1D POLR2E POLR2F POLR2H POLR2K POLR2L POLR3A POLR3B POLR3C POLR3D
  POLR3E POLR3F POLR3G POLR3GL POLR3H POLR3K POP1 POP4 POP5 POP7 POU2F1 RB1 RPP14 RPP21
  RPP25 RPP30 RPP38 RPP40 RTCB SNAPC1 SNAPC2 SNAPC3 SNAPC4 SNAPC5 SSB SUB1 TBP TSEN15 TSEN2
  TSEN34 TSEN54 ZNF143. Thirty-six are modelled as participants: GTF3A; the six TFIIIC
  subunits; the five SNAPc subunits; TBP, BRF1, BRF2 and BDP1; the 17 Pol III subunit
  genes plus the RPC7 paralogue POLR3GL (18 genes for 17 positions); and MAF1. No gene
  outside the RGD list is added. Molecular functions were taken from each protein's
  experimental GO annotations in QuickGO (November 2026); none of the participants has a
  gene review in this repository. Two functions are curator-authored without an
  experimental human GOA row: TFIIIA RNA polymerase III type 1 promoter
  sequence-specific DNA binding (the GO definition of that term names TFIIIA as the
  type 1 recognition factor) and MAF1 RNA polymerase inhibitor activity (reasons in the
  annoton). UniProt labels are the current recommended names (UniProt REST, November
  2026).

  Boundary decisions. (1) Promoter types as a ROUTE variant set. The three types use
  different assembly factors (TFIIIA then TFIIIC; TFIIIC alone; SNAPc) to reach the same
  intermediate, TFIIIB bound upstream of the start site, so they are three variants of
  part 1 (selection ONE_OR_MORE: each gene uses one type and every cell uses all three).
  TFIIIC is therefore written twice, as separate annotons in the type 1 and type 2
  variants with the same six subunits, because annoton ids must be unique and a variant
  cannot reference a sibling. (2) TFIIIB as a REALIZER variant set. Both forms carry the
  same activity; BRF1-TFIIIB serves type 1 and type 2 promoters and BRF2-TFIIIB serves
  type 3 promoters. The pairing of a promoter type with a TFIIIB form is stated in the
  labels and descriptions; it is not encoded as a constraint because the variant sets are
  independent. TBP and BDP1 are listed in both forms. (3) The enzyme is one complex
  annoton with 17 active units, matching modules/dmel_nuclear_rna_polymerases.yaml (the
  Drosophila counterpart) and the Pol I module. The RPC7 position is a FAMILY unit with
  POLR3G and POLR3GL as representative members, which records the paralogue choice
  without writing the 17-subunit enzyme out twice. No PANTHER id is asserted for it (the
  validator's informational notice about this is expected). Units without a function
  are those whose experimental GOA rows are limited to chromatin binding (POLR3D, POLR3G),
  zinc binding (POLR3K, POLR2L) or a complex-level polymerase activity assigned to a
  small subunit (POLR3H, CRCP). (4) Shared subunits. The five RPABC subunits (POLR2E,
  POLR2F, POLR2H, POLR2K, POLR2L) and the two RPAC subunits (POLR1C, POLR1D, the latter as
  P0DPB6) are listed in both this module and modules/rna_polymerase_i_transcription.yaml
  with the same accessions and roles. No human RNA polymerase II module exists, and none
  is created here. (5) Elongation, termination and reinitiation are intrinsic to Pol III
  and are concepts of the enzyme node. SUB1 (PC4), which RGD draws with TFIIIB and TFIIIC
  as a reinitiation and termination factor, is excluded: its experimental functions in
  GOA are DNA binding and RNA polymerase II coactivator activity, and its Pol III role is
  stimulatory rather than a step the basal system cannot perform. (6) MAF1 is an optional
  regulatory part connected to the enzyme by NEGATIVELY_REGULATES; its upstream control
  by mTORC1 (PW:0000180) is named, not modelled. RB1, which RGD draws inhibiting TFIIIB and
  SNAPc, is excluded as a pleiotropic repressor whose main role is outside Pol III
  transcription (it has its own gene review). (7) POU2F1 (Oct-1) and ZNF143 (Staf), which
  bind the distal sequence element of type 3 promoters and stimulate SNAPc binding, are
  excluded as gene-specific activators shared with Pol II snRNA promoters; they are not
  required for basal type 3 transcription. (8) tRNA processing is out of scope: RNase P
  (POP1, POP4, POP5, POP7, RPP14, RPP21, RPP25, RPP30, RPP38, RPP40), RNase Z (ELAC1,
  ELAC2), tRNA splicing (TSEN2, TSEN15, TSEN34, TSEN54, CLP1, RTCB) and the La protein SSB
  act on the transcript after synthesis and belong to the tRNA maturation pathway
  (PW:0001573). The chromatin modification/remodeling link (PW:0001337) is also out of
  scope. (9) Pol III's separate role as a cytosolic DNA sensor that transcribes AT-rich
  DNA into immunostimulatory RNA is not modelled; the module is limited to nuclear
  transcription of Pol III genes. (10) Substrate versus participant: the DNA template and
  the RNA products are not participants.

  GO-CAM links. No production GO-CAM model in gocams/index.tsv contains any Pol III
  subunit, TFIIIA, TFIIIB, TFIIIC, SNAPc or MAF1; TBP appears only in two Pol II models
  (ZNF76 regulation of TBP), which are not linked. The seed's best_gocam,
  gomodel:63f809ec00000701 (tRNA repair and recycling by ANKZF1, ELAC1 and TRNT1), overlaps
  only through ELAC1, a tRNA-processing enzyme excluded here, so no gocam_associations are
  recorded. PANTHER family ids and PTNs are deliberately not asserted.
