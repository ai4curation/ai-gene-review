            role_description: >-
              mTORC1 phosphorylation keeps MAF1 inactive; on mTOR inhibition or stress the
              dephosphorylated protein accumulates in the nucleus, occupies Pol III genes and
              displaces Pol III and BRF1. The function is curator-authored: GOA's
              experimental MAF1 molecular-function rows are type 1, 2 and 3 promoter DNA
              binding from ChIP occupancy (PMID:20233713), which describe where MAF1 is
              found rather than what it does, and its IBA row is RNA polymerase III core
              binding; RNA polymerase inhibitor activity follows the repression by binding
              the polymerase seen in the yeast Pol III-Maf1 structure discussed in
              PMID:33558764 and the IDA process rows for negative regulation of Pol III
              transcription.
            evidence:
              - source_id: PMID:20233713
                statement: mTOR inhibition raises MAF1 occupancy of Pol III genes and lowers Pol III and BRF1 binding.
                supporting_text: mTOR inhibition led to an increase in the occupancy of Maf1 on a set of Pol III-dependent genes, with concomitant reduction in the binding of Pol III and Brf1.
              - source_id: PMID:17499043
                statement: MAF1 occupancy of Pol III genes is reciprocal to that of TFIIIB and Pol III.
                supporting_text: Maf1 occupancy of Pol III genes is inversely correlated with that of the initiation factor TFIIIB and Pol III.
              - source_id: PMID:33558764
                statement: RPC7-alpha may make Pol III resistant to MAF1, linking paralogue choice to repression.
                supporting_text: We hypothesise that the RPC7α subunit specifically protects against Maf1-mediated Pol III inhibition in tumour cells
