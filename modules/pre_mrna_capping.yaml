id: MODULE:pre_mrna_capping
title: Human co-transcriptional pre-mRNA capping — RNGTT triphosphatase and guanylyltransferase, RNMT-RAMAC guanine-N7 methylation, and CMTR1 cap1 2'-O-methylation of RNA polymerase II transcripts
description: >-
  The 5' end of every RNA polymerase II transcript is capped soon after it emerges from the
  polymerase, while the transcript is only a few tens of nucleotides long. Capping is a
  chain of four enzymatic steps on the RNA 5' end. The bifunctional capping enzyme RNGTT
  first removes the gamma phosphate of the 5'-triphosphate end with its N-terminal
  cysteine-phosphatase domain, then, with its C-terminal nucleotidyltransferase domain,
  forms a covalent enzyme-GMP intermediate from GTP and transfers GMP to the
  5'-diphosphate end, giving an inverted guanosine linked 5'-5' through a triphosphate
  bridge. The cap guanine is then methylated at N7 by the methyltransferase RNMT, which in
  vertebrates works with its activating subunit RAMAC (RAM), using S-adenosyl-L-methionine
  as the methyl donor; this gives the 7-methylguanosine cap (cap0). In the nucleus, CMTR1
  then methylates the 2'-O-ribose of the first transcribed nucleotide (cap1). RNGTT, RNMT
  and CMTR1 are each recruited to the elongating polymerase through the
  Ser5-phosphorylated C-terminal domain of its largest subunit, which couples capping to
  promoter escape and early elongation. The finished cap is read by the nuclear
  cap-binding complex and later by the cytoplasmic translation factor eIF4E.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000127
    title: RNA polymerase II transcription pathway
    statement: >-
      The RGD Pathway Ontology diagram for Pol II transcription draws Rngtt as the capping
      enzyme acting on the nascent pre-mRNA and links the 5'-end pre-mRNA capping pathway as
      a sub-pathway. This module is one of the five modules of the Pol II split plan in
      projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md (item 4) and covers the
      capping step of that pathway. Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0000127.yaml).
  - source_id: PW:0001578
    title: 5'-end pre-mRNA capping pathway
    statement: >-
      RGD's own capping pathway (id and label checked against .cache/rgd_pw/pw.obo), a
      child of the mRNA maturation pathway and a diagram link of PW:0000127. RGD annotates
      five human genes to it (RNGTT, RNMT, RAMAC, NCBP1, NCBP2; TAS to RGD:9684851 and
      PMID:24354960). The module models the three enzymes and excludes the cap-binding
      complex (see notes).
  - source_id: GO:0006370
    title: 7-methylguanosine mRNA capping
    statement: >-
      The module's process concept. Its definition covers the triphosphatase,
      guanylyltransferase and N7 methylation steps and explicitly includes the ribose
      methylation of the first and second transcribed nucleotides. It is the process of the
      Reactome mRNA Capping pathway (cross-referenced from the GO term) and the process of
      the S. pombe GO-CAM model of capping.
  - source_id: PMID:9407024
    title: 5'-Capping enzymes are targeted to pre-mRNA by binding to the phosphorylated carboxy-terminal domain of RNA polymerase II.
    statement: Capping enzymes are recruited to the phosphorylated Pol II CTD, which makes capping specific to Pol II transcripts and couples it to CTD phosphorylation.
    supporting_text: the enzymes responsible for cap synthesis, RNA guanylyltransferase, and RNA (guanine-7)-methyltransferase bound directly to the phosphorylated, but not to the nonphosphorylated, form of the CTD in vitro
  - source_id: PMID:9371772
    title: Mammalian capping enzyme complements mutant Saccharomyces cerevisiae lacking mRNA guanylyltransferase and selectively binds the elongating form of RNA polymerase II.
    statement: The mammalian capping enzyme binds the elongating, not the initiating, form of Pol II.
    supporting_text: Full-length capping enzyme and an active C-terminal fragment bound to the elongating form and not to the initiating form of polymerase.
  - source_id: PMID:24354960
    title: Cap-binding complex (CBC).
    statement: >-
      RGD's cited source for PW:0001578. It describes the cap as formed by the capping
      enzymes and then bound by CBC, which mediates later processing events; this is the
      basis for treating CBC as a reader of the product rather than a participant in
      capping.
    supporting_text: Protein complexes recruited to 7mG mediate key processing events throughout the lifetime of the transcript. One of the most important mediators of 7mG functions is CBC (cap-binding complex).
  - source_id: PMID:12434151
    title: Structural basis of m7GpppG binding to the nuclear cap-binding protein complex.
    statement: >-
      The NCBP1 IDA row for 7-methylguanosine mRNA capping cites this structure of CBC
      bound to a cap analogue; the paper shows binding of the finished cap, not a capping
      reaction.
    supporting_text: CBP80 stabilizes the movement of the N-terminal loop of CBP20 and locks the CBC into a high affinity cap-binding state.
  - source_id: PMID:36725932
    title: mRNA ageing shapes the Cap2 methylome in mammalian mRNA.
    statement: >-
      Cap2 is added slowly to mRNAs in the cytosol, long after transcription, which is
      why CMTR2 is outside the co-transcriptional capping boundary.
    supporting_text: Cap2 is formed through a slow continuous conversion of mRNAs from Cap1 to Cap2 as mRNAs age in the cytosol.
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000127 (RNA polymerase II transcription
  pathway) as item 4 of the Pol II split plan
  (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md), with RGD's capping
  sub-pathway PW:0001578 (5'-end pre-mRNA capping pathway), whose id and label were checked
  against .cache/rgd_pw/pw.obo and which is cited as an evidence source because the module
  covers it. The PW:0000127 diagram draws Rngtt as the capping enzyme and describes capping
  as a triphosphatase-guanylyltransferase polypeptide followed by Rnmt methylation, with the
  capping enzyme interacting with DSIF and the methyltransferase complex and the nuclear
  cap-binding complex binding the capped RNA. RGD annotates five human genes to PW:0001578:
  RNGTT, RNMT, RAMAC, NCBP1 and NCBP2. Three are modelled (RNGTT, RNMT, RAMAC). One gene
  outside the RGD list is added, CMTR1, for the reasons in (3). No gene review exists in
  this repository for any member, so molecular functions were taken from each protein's
  experimental GO annotations in QuickGO (November 2026). One function is curator-authored
  without an experimental human GOA row on that exact term: RNGTT mRNA 5'-triphosphate
  monophosphatase activity (see the annoton). UniProt accessions and labels are from
  UniProt REST (November 2026). Reaction participants were grounded from Rhea (RHEA:67004,
  RHEA:67012, RHEA:67008, RHEA:67020, the EC master reactions) and each ChEBI label was
  checked in OLS; the substrates chain, so the product of each step is the substrate of
  the next.

  Boundary decisions. (1) RNGTT is one polypeptide with two catalytic domains in metazoa,
  so it appears as two parts with one annoton each, rather than as a complex. GO:0031533
  mRNA capping enzyme complex is not used: its definition is the two-subunit fungal
  enzyme. (2) RNMT and RAMAC are one complex annoton (GO:0160130) with RNMT as the catalytic
  unit and RAMAC as an activator unit. RAMAC gets no catalytic function, because RNMT is
  active alone and RAMAC raises its activity and RNA affinity. The paralog RAMACL has only
  a phylogenetic capping row and is not modelled. (3) CMTR1 (cap1) is included. The
  definition of GO:0006370 includes ribose methylation of the first transcribed
  nucleotide; CMTR1 is nuclear, binds the Pol II CTD, and every human mRNA carries cap1,
  so cap1 is added to the nascent transcript as part of the same capping process. RGD does
  not list CMTR1; it is the only gene added beyond RGD. (4) CMTR2 (cap2) is excluded from the parts.
  It is in both nucleus and cytosol, only part of the mRNA population carries cap2 at steady state, and cap2 is
  added slowly in the cytosol as mRNAs age (PMID:36725932), so it is not part of
  co-transcriptional capping. Its GOA row for 7-methylguanosine mRNA capping (IDA,
  PMID:21310715) is consistent with the GO definition and is not an error; leaving it out
  is a scope decision. It would fit a later cap-maturation module with the
  cap-adjacent N6-methyladenosine writer PCIF1, which is likewise excluded here because
  it modifies only transcripts that start with adenosine and is not needed to form the
  cap. (5) The nuclear cap-binding complex (NCBP1, NCBP2) is excluded although RGD lists
  it. Applying the substrate-versus-participant rule: the complex binds the finished
  m7G cap (its experimental functions are RNA 7-methylguanosine cap binding) and performs
  none of the triphosphatase, guanylyltransferase or methyltransferase chemistry; it is a
  reader of the product. Comparator check: the other human cap readers, EIF4E and NCBP3,
  carry no GO:0006370 annotation in QuickGO, and among cap-binding proteins only NCBP1
  carries one (IDA, PMID:12434151), which rests on a crystal structure of the complex with
  a cap analogue (see the possible upstream error below). CBC's downstream roles in
  splicing, export and translation are context in modules/mrna_nuclear_export.yaml and
  elsewhere. (6) The polymerase and its CTD are not modelled here. Recruitment of RNGTT,
  RNMT and CMTR1 by the Ser5-phosphorylated CTD is recorded in the description and
  evidence; the Pol II enzyme and the TFIIH CDK7 kinase that phosphorylates Ser5 belong to
  the sibling module rna_polymerase_ii_core_and_initiation, and DSIF (SUPT4H1, SUPT5H),
  which binds and stimulates the capping enzyme during promoter-proximal pausing, to
  rna_polymerase_ii_elongation_and_termination. (7) DXO, drawn on the PW:0000127 diagram
  with XRN2 in termination, removes incompletely capped and unmethylated caps; it is
  cap quality control and decay, not cap formation, and is left to the elongation and
  termination sibling. (8) Regulation of capping by signalling to RNMT-RAMAC and the
  interferon induction of CMTR1 are out of scope. (9) The snRNA caps made by the same
  enzymes on Pol II snRNA transcripts, and their later hypermethylation by TGS1, are not
  modelled; the module concerns pre-mRNA. (10) SAGA and ATAC belong to a later
  histone-modification tranche and are not involved here.

  GO-CAM links. No human production GO-CAM in gocams/index.tsv contains RNGTT, RNMT,
  RAMAC, CMTR1, CMTR2, NCBP1 or NCBP2. The S. pombe model gomodel:66187e4700001573 (RNA
  capping) models the same three core steps with Pct1, Ceg1 and Pcm1, and its activities
  are linked to the three matching annotons as orthologous activities. Its other two
  activities, the Ser5-phosphorylated Rpb1 CTD as an adaptor and the Mcs6 CTD Ser5 kinase,
  are sibling-module biology and are not linked. The SARS-CoV-2 model
  gomodel:5e72450500004237 has viral cap N7 and cap1 methyltransferases (nsp14, nsp16) in
  host evasion; it is viral, not this pathway, and is not linked. PANTHER family ids and
  PTNs are deliberately not asserted.

  Possible upstream errors. (a) The RNGTT triphosphatase row GO:0050355 inorganic
  triphosphate phosphatase activity (IDA, PMID:9473487) names hydrolysis of free
  triphosphate; the paper measured RNA 5'-triphosphatase activity, which is GO:0140818,
  a term whose definition cites the same paper. Query to GOA (UniProt). (b) The NCBP1 row
  GO:0006370 (IDA, PMID:12434151) annotates a cap reader to cap formation from a binding
  structure; candidate over-annotation, query only. (c) The definition of GO:0006370 (and
  of its parent GO:0009452) mislabels the ribose methylations, and GO:0004482 lacks the
  Rhea cross-reference for its reaction; both are recorded in proposed_ontology_changes.
proposed_ontology_changes:
  - change_type: NODE_TEXT_DEFINITION_CHANGE
    ontology: GO
    about_node:
      id: GO:0006370
      label: 7-methylguanosine mRNA capping
    old_value: >-
      The sequence of enzymatic reactions by which the mRNA 5' cap structure, an inverted
      7-methylguanosine linked via a 5'-5' triphosphate bridge (m7G(5')ppp(5')X) to the first
      transcribed residue, is added to a nascent transcript. Additional methylation can occur
      on the ribose sugars of the first and second nucleotides adjacent to the m7G nRNA cap.
      These methylations are often referred to as N6,2'-O-dimethyladenosine (m6,2A) and
      N6,2'-O-dimethylguanosine (m6,2G), respectively.
    new_value: >-
      The sequence of enzymatic reactions by which the mRNA 5' cap structure, an inverted
      7-methylguanosine linked via a 5'-5' triphosphate bridge (m7G(5')ppp(5')X) to the first
      transcribed residue, is added to a nascent transcript. Additional 2'-O-methylation can
      occur on the ribose of the first transcribed nucleotide (cap1) and of the second
      transcribed nucleotide (cap2).
    change_dsl: >-
      change definition of GO:0006370 to 'The sequence of enzymatic reactions by which the
      mRNA 5' cap structure, an inverted 7-methylguanosine linked via a 5'-5' triphosphate
      bridge (m7G(5')ppp(5')X) to the first transcribed residue, is added to a nascent
      transcript. Additional 2'-O-methylation can occur on the ribose of the first
      transcribed nucleotide (cap1) and of the second transcribed nucleotide (cap2).'
    origin: SELF_PROPOSED
    stance: AGREE
    confidence: PROBABLE
    justification: >-
      The last sentence names the first- and second-nucleotide ribose methylations as
      N6,2'-O-dimethyladenosine and N6,2'-O-dimethylguanosine. Ribose methylation of the
      first and second transcribed nucleotides is cap1 and cap2, made by CMTR1 and CMTR2 on
      any nucleotide. N6 methylation is a separate base modification of a first-position
      adenosine only, made by PCIF1, and guanine has no N6 amino group, so
      N6,2'-O-dimethylguanosine does not describe the second-position modification. The
      same text is in the parent GO:0009452 7-methylguanosine RNA capping, which should be
      corrected the same way. The wording also says "nRNA cap" for "mRNA cap".
    supported_by:
      - reference_id: PMID:21310715
        supporting_text: Methylation of the ribose on the first transcribed nucleotide is termed cap1 and similar methylation of the second transcribed position is termed cap2.
      - reference_id: PMID:36725932
        supporting_text: mRNA caps exist in either the Cap1 or Cap2 form, depending on the presence of 2'-O-methylation on the first transcribed nucleotide or both the first and second transcribed nucleotides, respectively
  - change_type: OTHER
    ontology: GO
    about_node:
      id: GO:0004482
      label: mRNA 5'-cap (guanine-N7-)-methyltransferase activity
    new_value: RHEA:67008
    change_dsl: add xref RHEA:67008 to GO:0004482
    origin: SELF_PROPOSED
    stance: AGREE
    confidence: CONFIRMED
    justification: >-
      GO:0004482 carries EC:2.1.1.56 and Reactome cross-references but no Rhea
      cross-reference, whereas the other steps of capping (GO:0140818, GO:0004484,
      GO:0004483) do. RHEA:67008 is the EC 2.1.1.56 reaction, a 5'-end
      (5'-triphosphoguanosine)-ribonucleoside in mRNA + S-adenosyl-L-methionine = a 5'-end
      (N(7)-methyl 5'-triphosphoguanosine)-ribonucleoside in mRNA +
      S-adenosyl-L-homocysteine, which matches the GO definition. A mapping request rather
      than a fault in meaning, recorded here so that it is not left in prose.
module:
  id: pre_mrna_capping
  label: Human co-transcriptional pre-mRNA capping
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: 7-methylguanosine mRNA capping
      term:
        id: GO:0006370
        label: 7-methylguanosine mRNA capping
      description: The GO process for the whole chain; the four parts are its enzymatic steps.
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
  parts:
    - order: 1
      role: removal of the 5'-terminal gamma phosphate of the nascent transcript
      node:
        id: triphosphatase_step
        label: RNGTT triphosphatase domain converts the 5'-triphosphate end to a 5'-diphosphate end
        module_type: REACTION
        annotons:
          - id: rngtt_triphosphatase
            label: RNGTT N-terminal domain hydrolyses the 5'-triphosphate end of nascent pre-mRNA
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: RNGTT
                term:
                  id: UniProtKB:O60942
                  label: mRNA-capping enzyme
            function:
              preferred_term: mRNA 5'-triphosphate monophosphatase activity
              term:
                id: GO:0140818
                label: mRNA 5'-triphosphate monophosphatase activity
              substrates:
                - preferred_term: 5'-triphosphate end of the nascent transcript
                  term:
                    id: CHEBI:167618
                    label: 5'-end ribonucleotide 5'-triphosphate(4-) residue
                - preferred_term: water
                  term:
                    id: CHEBI:15377
                    label: water
              products:
                - preferred_term: 5'-diphosphate end of the transcript
                  term:
                    id: CHEBI:167616
                    label: 5'-end ribonucleoside 5'-diphosphate(3-) residue
                - preferred_term: phosphate
                  term:
                    id: CHEBI:43474
                    label: hydrogenphosphate
                - preferred_term: H+
                  term:
                    id: CHEBI:15378
                    label: hydron
              evidence:
                - source_id: RHEA:67004
                  statement: >-
                    a 5'-end triphospho-ribonucleoside in mRNA + H2O = a 5'-end
                    diphospho-ribonucleoside in mRNA + phosphate + H(+); the EC 3.6.1.74 master
                    reaction, cross-referenced from GO:0140818. ChEBI participants and labels
                    from the Rhea entry and OLS (November 2026).
                  notes: EC:3.6.1.74
            processes:
              - preferred_term: 7-methylguanosine mRNA capping
                term:
                  id: GO:0006370
                  label: 7-methylguanosine mRNA capping
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              The first step, carried by the N-terminal cysteine-phosphatase domain of the
              bifunctional capping enzyme. The function term is curator-authored: human GOA
              records this activity as GO:0050355 inorganic triphosphate phosphatase activity
              (IDA, PMID:9473487) and GO:0004651 polynucleotide 5'-phosphatase activity
              (Reactome TAS). GO:0140818 is the specific RNA 5'-triphosphatase term, is a
              child of GO:0004651, cites PMID:9473487 in its own definition, and is the term the
              S. pombe capping GO-CAM uses for the orthologous Pct1 triphosphatase.
            evidence:
              - source_id: PMID:9473487
                statement: Recombinant human capping enzyme has both activities, and the N-terminal 213-residue fragment alone is the RNA 5'-triphosphatase.
                supporting_text: the N-terminal 213 amino acid fragment containing a tyrosine specific protein phosphatase motif catalyzed the RNA 5'-triphosphatase activity
            gocam_associations:
              - model: gomodel:66187e4700001573
                activity: gomodel:66187e4700001573/66187e4700001574
                title: RNA capping (GO:0036260)
                description: >-
                  S. pombe pct1, the separate-subunit orthologue of the RNGTT triphosphatase
                  domain, enables GO:0140818 part of GO:0006370 in the nucleus. Fission-yeast
                  model; linked as the orthologous activity, not as human evidence.
    - order: 2
      role: guanylyl transfer to the 5'-diphosphate end
      node:
        id: guanylyltransferase_step
        label: RNGTT guanylyltransferase domain caps the 5'-diphosphate end with GMP from GTP
        module_type: REACTION
        annotons:
          - id: rngtt_guanylyltransferase
            label: RNGTT C-terminal domain forms the enzyme-GMP intermediate and transfers GMP to the RNA 5' end
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: RNGTT
                term:
                  id: UniProtKB:O60942
                  label: mRNA-capping enzyme
            function:
              preferred_term: mRNA guanylyltransferase activity
              term:
                id: GO:0004484
                label: mRNA guanylyltransferase activity
              substrates:
                - preferred_term: 5'-diphosphate end of the transcript
                  term:
                    id: CHEBI:167616
                    label: 5'-end ribonucleoside 5'-diphosphate(3-) residue
                - preferred_term: GTP
                  term:
                    id: CHEBI:37565
                    label: GTP(4-)
                - preferred_term: H+
                  term:
                    id: CHEBI:15378
                    label: hydron
              products:
                - preferred_term: GpppN-capped 5' end (unmethylated cap)
                  term:
                    id: CHEBI:167617
                    label: 5'-(5'-triphosphoguanosine)-(ribonucleotide)(3-) residue
                - preferred_term: diphosphate
                  term:
                    id: CHEBI:33019
                    label: diphosphate(3-)
              evidence:
                - source_id: RHEA:67012
                  statement: >-
                    a 5'-end diphospho-ribonucleoside in mRNA + GTP + H(+) = a 5'-end
                    (5'-triphosphoguanosine)-ribonucleoside in mRNA + diphosphate; the EC
                    2.7.7.50 master reaction. GO:0004484 cross-references only the
                    purine-specific RHEA:54592 and its adenosine and guanosine children, not
                    this general reaction.
                  notes: EC:2.7.7.50
            processes:
              - preferred_term: 7-methylguanosine mRNA capping
                term:
                  id: GO:0006370
                  label: 7-methylguanosine mRNA capping
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              The second step, carried by the C-terminal nucleotidyltransferase domain of the
              same polypeptide (active-site lysine in the KxDG motif). Function from the human
              IDA row (PMID:9473487); the same domain also binds the Ser5-phosphorylated CTD
              that recruits the enzyme to the elongating polymerase.
            evidence:
              - source_id: PMID:9473487
                statement: The C-terminal fragment of human capping enzyme is the guanylyltransferase.
                supporting_text: the C-terminal 369 amino acid fragment exhibited the mRNA guanylyltransferase activity
              - source_id: PMID:9371772
                statement: The mammalian enzyme forms a guanylylated intermediate at an active-site lysine and complements yeast lacking the guanylyltransferase.
                supporting_text: Conversion of Lys-294 in the KXDG-conserved motif eliminated both guanylylation and complementation, identifying it as the active site.
            gocam_associations:
              - model: gomodel:66187e4700001573
                activity: gomodel:66187e4700001573/66187e4700001581
                title: RNA capping (GO:0036260)
                description: >-
                  S. pombe ceg1, the orthologue of the RNGTT guanylyltransferase domain,
                  enables GO:0004484 part of GO:0006370 in the nucleus. Fission-yeast model;
                  linked as the orthologous activity, not as human evidence.
    - order: 3
      role: guanine-N7 methylation of the cap (cap0 formation)
      node:
        id: n7_methylation_step
        label: RNMT-RAMAC methylates the cap guanine at N7
        module_type: REACTION
        annotons:
          - id: rnmt_ramac_n7_methyltransferase
            label: RNMT, activated by RAMAC, transfers a methyl group from S-adenosyl-L-methionine to N7 of the cap guanine
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: RNMT-RAMAC cap methyltransferase
                term:
                  id: GO:0160130
                  label: mRNA cap methyltransferase RNMT:RAMAC complex
                active_units:
                  - id: rnmt_unit
                    label: RNMT
                    role: catalytic subunit; binds S-adenosyl-L-methionine and the GpppN cap
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RNMT
                        term:
                          id: UniProtKB:O43148
                          label: mRNA cap guanine-N(7) methyltransferase
                    function:
                      preferred_term: mRNA 5'-cap (guanine-N7-)-methyltransferase activity
                      term:
                        id: GO:0004482
                        label: mRNA 5'-cap (guanine-N7-)-methyltransferase activity
                  - id: ramac_unit
                    label: RAMAC
                    role: activating subunit; stabilises the RNMT lobe, increases S-adenosyl-L-methionine recruitment and adds an RNA-binding domain
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RAMAC
                        term:
                          id: UniProtKB:Q9BTL3
                          label: RNA guanine-N7 methyltransferase activating subunit
                    function:
                      preferred_term: enzyme activator activity
                      term:
                        id: GO:0008047
                        label: enzyme activator activity
            function:
              preferred_term: mRNA 5'-cap (guanine-N7-)-methyltransferase activity
              term:
                id: GO:0004482
                label: mRNA 5'-cap (guanine-N7-)-methyltransferase activity
              substrates:
                - preferred_term: GpppN-capped 5' end (unmethylated cap)
                  term:
                    id: CHEBI:167617
                    label: 5'-(5'-triphosphoguanosine)-(ribonucleotide)(3-) residue
                - preferred_term: S-adenosyl-L-methionine
                  term:
                    id: CHEBI:59789
                    label: S-adenosyl-L-methionine zwitterion
              products:
                - preferred_term: m7GpppN cap (cap0)
                  term:
                    id: CHEBI:156461
                    label: 5'-(N(7)-methyl 5'-triphosphoguanosine)-ribonucleoside(2-) residue
                - preferred_term: S-adenosyl-L-homocysteine
                  term:
                    id: CHEBI:57856
                    label: S-adenosyl-L-homocysteine zwitterion
              evidence:
                - source_id: RHEA:67008
                  statement: >-
                    a 5'-end (5'-triphosphoguanosine)-ribonucleoside in mRNA +
                    S-adenosyl-L-methionine = a 5'-end (N(7)-methyl
                    5'-triphosphoguanosine)-ribonucleoside in mRNA + S-adenosyl-L-homocysteine;
                    the EC 2.1.1.56 master reaction. GO:0004482 carries no Rhea cross-reference
                    (see proposed_ontology_changes).
                  notes: EC:2.1.1.56
            processes:
              - preferred_term: 7-methylguanosine mRNA capping
                term:
                  id: GO:0006370
                  label: 7-methylguanosine mRNA capping
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              The third step. RNMT carries the catalytic activity (IDA, PMID:22099306 and
              PMID:27422871; IMP, PMID:9790902). RAMAC has no catalytic activity of its own; its
              experimental function rows are enzyme activator activity (IDA, PMID:27422871)
              and RNA binding (IDA, PMID:22099306), and the activator term is used because it
              names its role in this step. RNMT is active alone in vitro, so RAMAC is an
              activator rather than a co-catalytic subunit. The paralog RAMACL carries only an
