            label: MYC bHLH transcription factor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: MYC2/MYC3/MYC4 subgroup IIIe bHLH transcription factors
                representative_members:
                  - preferred_term: MYC2 (JIN1; Arabidopsis)
                    term:
                      id: UniProtKB:Q39204
                      label: Transcription factor MYC2
                  - preferred_term: MYC3 (bHLH005; Arabidopsis)
                    term:
                      id: UniProtKB:Q9FIP9
                      label: Transcription factor MYC3
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
              evidence:
                - source_id: PMID:21335373
                  statement: MYC3 binds DNA with the same specificity as MYC2.
                  supporting_text: They both are nuclear proteins that bind DNA with sequence specificity similar
                    to that of MYC2.
                - source_id: PMID:21321051
                  statement: MYC2 and MYC3 transactivate JAZ promoters.
                  supporting_text: MYC2, MYC3, and MYC4 were all capable of inducing expression of JAZ::GUS
                    reporter constructs following transfection of carrot protoplasts.
            processes:
              - preferred_term: positive regulation of DNA-templated transcription
                term:
                  id: GO:0045893
                  label: positive regulation of DNA-templated transcription
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Activates jasmonate-responsive genes once JAZ repression is removed.
