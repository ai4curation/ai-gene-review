    - source: jaz_degradation
      target: jaz_ninja_tpl_repression
      connection_type: NEGATIVELY_REGULATES
      description: Proteasomal removal of JAZ dismantles the JAZ-NINJA-TOPLESS repressor assembly on MYC factors.
    - source: jaz_ninja_tpl_repression
      target: myc_activation
      connection_type: NEGATIVELY_REGULATES
      description: JAZ blocks MYC-MED25 interaction and recruits NINJA-TOPLESS, repressing MYC target genes.
    - source: myc_activation
      target: jaz_ninja_tpl_repression
      connection_type: POSITIVELY_REGULATES
      description: MYC factors induce JAZ gene transcription, replenishing repressors (negative feedback loop).
