id: MODULE:jasmonate_coi1_jaz_signaling
title: Jasmonate perception and JAZ derepression (JAR1-COI1-JAZ-NINJA/TPL-MYC module)
description: >-
  Jasmonate signaling in vascular plants works by hormone-triggered derepression. Jasmonic acid is
  activated by the GH3-family jasmonoyl-amino acid conjugate synthetase JAR1, which adenylates JA and
  conjugates it to L-isoleucine to form jasmonoyl-L-isoleucine (JA-Ile), the bioactive hormone. JA-Ile
  is perceived by a co-receptor formed by the F-box/LRR protein COI1 and a JAZ (JASMONATE ZIM-domain)
  repressor: the hormone sits in an open pocket of the COI1 leucine-rich-repeat domain, is trapped by
  the Jas-motif degron of JAZ, and the complex is potentiated by inositol phosphate. COI1 is the
  substrate adaptor of an SCF E3 ubiquitin ligase (COI1-ASK1/ASK2-CUL1-RBX1), so hormone-dependent JAZ
  binding leads to JAZ polyubiquitination and 26S proteasome-dependent degradation. In the resting
  state, JAZ proteins bind the N-terminal JAZ-interaction domain of the bHLH transcription factors
  MYC2, MYC3 and MYC4 through their Jas motif, competitively blocking MYC recruitment of the Mediator
  subunit MED25; through their TIFY/ZIM domain they bind the adaptor NINJA, whose EAR motif recruits the
  Groucho/Tup1-type corepressor TOPLESS (TPL) and TPL-related proteins. JA-Ile-triggered JAZ degradation
  therefore removes both the MYC-blocking and the corepressor-recruiting activities, releasing MYC
  factors to activate jasmonate-responsive genes that control defense against insects and necrotrophic
  pathogens, wound responses, secondary metabolism and growth inhibition. Many JAZ genes are themselves
  MYC targets, providing negative feedback. Jasmonate biosynthesis upstream of JA (13-LOX, AOS, AOC,
  OPR3 and beta-oxidation), JA-Ile catabolism and JAZ-independent COI1 functions are outside this
  module.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0009867
    title: jasmonic acid mediated signaling pathway
    statement: The module is grounded in the GO biological process term for jasmonic acid mediated signaling.
  - source_id: PMID:15258265
    title: The oxylipin signal jasmonic acid is activated by an enzyme that conjugates it to isoleucine
      in Arabidopsis.
    statement: JAR1 forms JA-Ile, and jar1 mutants have strongly reduced JA-Ile.
    supporting_text: >-
      JA-Ile was found at 29.6 pmole g(-1) fresh weight (FW) in the wild type but was more than sevenfold
      lower in two jar1 alleles.
  - source_id: PMID:20927106
    title: Jasmonate perception by inositol-phosphate-potentiated COI1-JAZ co-receptor.
    statement: The jasmonate receptor is a COI1-JAZ complex in which COI1 holds JA-Ile in an open pocket.
    supporting_text: >-
      Here we present structural and pharmacological data to show that the true Arabidopsis jasmonate
      receptor is a complex of both COI1 and JAZ.
  - source_id: PMID:17637677
    title: JAZ repressor proteins are targets of the SCF(COI1) complex during jasmonate signalling.
    statement: JA-Ile promotes COI1-JAZ1 interaction and SCF(COI1)- and proteasome-dependent JAZ1 degradation.
    supporting_text: >-
      Jasmonate treatment causes JAZ1 degradation and this degradation is dependent on activities of the
      SCF(COI1) ubiquitin ligase and the 26S proteasome.
  - source_id: PMID:17637675
    title: The JAZ family of repressors is the missing link in jasmonate signalling.
    statement: JAZ proteins are direct SCF(COI1) targets degraded by the proteasome after jasmonate treatment.
    supporting_text: >-
      Our results demonstrate that JAI3 and other JAZs are direct targets of the SCF(COI1) E3 ubiquitin
      ligase and jasmonate treatment induces their proteasome degradation.
  - source_id: PMID:20360743
    title: NINJA connects the co-repressor TOPLESS to jasmonate signalling.
    statement: JAZ proteins recruit TPL/TPRs through the EAR-motif adaptor NINJA.
    supporting_text: >-
      Here we show that the Arabidopsis JAZ proteins recruit the Groucho/Tup1-type co-repressor TOPLESS
      (TPL) and TPL-related proteins (TPRs) through a previously uncharacterized adaptor protein,
      designated Novel Interactor of JAZ (NINJA).
  - source_id: PMID:26258305
    title: Structural basis of JAZ repression of MYC transcription factors in jasmonate signalling.
    statement: The JAZ Jas helix binds the MYC3 N-terminal domain and competitively blocks MED25 recruitment.
    supporting_text: >-
      In this position, the Jas helix competitively inhibits MYC3 interaction with the MED25 subunit of
      the transcriptional Mediator complex.
  - source_id: PMID:21335373
    title: The Arabidopsis bHLH transcription factors MYC3 and MYC4 are targets of JAZ repressors and act
      additively with MYC2 in the activation of jasmonate responses.
    statement: MYC3 and MYC4 act additively with MYC2 as JAZ-repressed activators of JA responses.
    supporting_text: >-
      Our results show that MYC3 and MYC4 are activators of JA-regulated programs that act additively with
      MYC2 to regulate specifically different subsets of the JA-dependent transcriptional response.
notes: >-
  Arabidopsis proteins are used as representative members; the COI1-JAZ-MYC module is conserved across
  land plants (in the liverwort Marchantia polymorpha COI1 perceives dinor-OPDA isomers rather than
  JA-Ile, so the JAR1 step is placed in vascular-plant context). JAZ1 (TIFY10A) is the representative
  JAZ; Arabidopsis has 13 JAZ proteins, most of which bind NINJA (JAZ7 and JAZ8 do not and carry their
  own EAR motifs). TOPLESS is referenced by its UniProt accession (Q94AI7, verified via UniProt REST);
  TPR2 and TPR3 also co-purify with NINJA. NINJA is named AFPH2 in UniProt (Q9SV55); NINJA is the
  standard Arabidopsis symbol. The SCF core subunits ASK1/ASK2, CUL1 and RBX1 are shared with other SCF
  ligases and are described rather than modeled as annotons. No PANTHER family ids are asserted: MYC2
  and MYC3 are grouped by curator judgment as subgroup IIIe bHLH factors, not by a verified family id.
  No production GO-CAM in gocams/index.tsv contains these Arabidopsis proteins (checked 2026-10-06).
  GO has no JA-Ile receptor-activity term; COI1 hormone perception uses hormone binding (GO:0042562),
  matching the COI1 review. NINJA and TPL are both given transcription corepressor activity; NINJA's
  more specific bridging (adaptor) role currently lacks a dedicated GO term.
module:
  id: jasmonate_coi1_jaz_signaling
  label: Jasmonate perception and JAZ derepression
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: jasmonic acid mediated signaling pathway
      term:
        id: GO:0009867
        label: jasmonic acid mediated signaling pathway
      description: JA-Ile formation, COI1-JAZ perception, SCF(COI1)-mediated JAZ degradation and the
        resulting release of MYC-dependent transcription from JAZ-NINJA-TOPLESS repression.
  context:
    taxa:
      - preferred_term: vascular plants
        term:
          id: NCBITaxon:58023
          label: Tracheophyta
        description: JA-Ile-COI1-JAZ-MYC signaling operates in vascular plants; Arabidopsis thaliana provides
          the representative members.
  parts:
    - order: 1
      role: bioactive hormone formation
      node:
        id: ja_ile_formation
        label: JA-Ile formation by JAR1
        module_type: REACTION
        description: >-
          The cytoplasmic GH3 enzyme JAR1 adenylates jasmonic acid and transfers it to L-isoleucine,
          producing JA-Ile, the ligand of the COI1-JAZ co-receptor. jar1 null mutants retain some JA-Ile,
          indicating minor additional conjugating activities.
        annotons:
          - id: jar1_ja_ile_synthetase
            label: JAR1 jasmonoyl-L-amino acid synthetase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: JAR1 (FIN219, GH3.11; Arabidopsis)
                term:
                  id: UniProtKB:Q9SKE2
                  label: Jasmonoyl--L-amino acid synthetase JAR1
            function:
              preferred_term: jasmonoyl-L-amino acid ligase activity
              term:
                id: GO:0080123
                label: jasmonoyl-L-amino acid ligase activity
              evidence:
                - source_id: PMID:15258265
                  statement: Recombinant JAR1 forms JA-amido conjugates including JA-Ile.
                  supporting_text: analysis of products produced in vitro by recombinant JAR1 demonstrated that
                    this enzyme forms JA-amido conjugates with several amino acids, including JA-Ile.
                - source_id: PMID:18247047
                  statement: JAR1 strongly prefers isoleucine.
                  supporting_text: Kinetic analysis showed that JAR1 had a K (m) of 0.03 mM for Ile, which was
                    60-80-fold lower than for Leu, Val and Phe.
            processes:
              - preferred_term: jasmonic acid metabolic process
                term:
                  id: GO:0009694
                  label: jasmonic acid metabolic process
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: Converts jasmonic acid into the bioactive hormone JA-Ile.
    - order: 2
      role: hormone perception by the COI1-JAZ co-receptor
      node:
        id: coi1_jaz_perception
        label: JA-Ile perception by COI1-JAZ
        module_type: REGULATORY_STEP
        description: >-
          JA-Ile binds an open pocket in the COI1 LRR domain and is trapped by the loop of the JAZ Jas-motif
          degron, whose helix docks onto COI1; inositol phosphate bound to COI1 potentiates co-receptor
          assembly. High-affinity hormone binding requires both COI1 and JAZ.
        annotons:
          - id: coi1_hormone_binding
            label: COI1 JA-Ile-binding co-receptor subunit
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: COI1 (Arabidopsis)
                term:
                  id: UniProtKB:O04197
                  label: Coronatine-insensitive protein 1
            function:
              preferred_term: hormone binding
              term:
                id: GO:0042562
                label: hormone binding
              evidence:
                - source_id: PMID:20927106
                  statement: COI1 contains a pocket recognizing JA-Ile with high specificity.
                  supporting_text: COI1 contains an open pocket that recognizes the bioactive hormone
                    (3R,7S)-jasmonoyl-l-isoleucine (JA-Ile) with high specificity.
            processes:
              - preferred_term: jasmonic acid mediated signaling pathway
                term:
                  id: GO:0009867
                  label: jasmonic acid mediated signaling pathway
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Binds JA-Ile together with the JAZ degron, forming the ligand-dependent co-receptor.
    - order: 3
      role: JAZ ubiquitination and proteasomal degradation
      node:
        id: jaz_degradation
        label: SCF(COI1)-mediated JAZ ubiquitination and degradation
        module_type: REGULATORY_STEP
        description: >-
          As the F-box substrate adaptor of SCF(COI1), COI1 brings hormone-bound JAZ to the ASK1/ASK2-CUL1-RBX1
          core for polyubiquitination; JAZ proteins are then degraded by the 26S proteasome within minutes of
          JA-Ile accumulation.
        annotons:
          - id: coi1_scf_substrate_adaptor
            label: COI1 F-box substrate adaptor of SCF(COI1)
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: COI1 (Arabidopsis)
                term:
                  id: UniProtKB:O04197
                  label: Coronatine-insensitive protein 1
            function:
              preferred_term: ubiquitin-like ligase-substrate adaptor activity
              term:
                id: GO:1990756
                label: ubiquitin-like ligase-substrate adaptor activity
              evidence:
                - source_id: PMID:20927106
                  statement: COI1 promotes hormone-dependent ubiquitylation and degradation of JAZ proteins.
                  supporting_text: The F-box protein CORONATINE INSENSITIVE 1 (COI1) mediates jasmonate
                    signalling by promoting hormone-dependent ubiquitylation and degradation of transcriptional
                    repressor JAZ proteins.
                - source_id: PMID:12172031
                  statement: COI1 assembles SCF(COI1) with CUL1, RBX1 and ASK1/ASK2.
                  supporting_text: COI1 associates physically with AtCUL1, AtRbx1, and either of the Arabidopsis
                    Skp1-like proteins ASK1 or ASK2 to assemble ubiquitin-ligase complexes
            processes:
              - preferred_term: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
                term:
                  id: GO:0031146
                  label: SCF-dependent proteasomal ubiquitin-dependent protein catabolic process
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Recruits hormone-bound JAZ repressors to the SCF(COI1) E3 ligase (GO:0019005
              SCF ubiquitin ligase complex) for polyubiquitination and proteasomal degradation.
    - order: 4
      role: JAZ-NINJA-TOPLESS repression of MYC factors
      node:
        id: jaz_ninja_tpl_repression
        label: JAZ-NINJA-TOPLESS corepressor assembly
        module_type: REGULATORY_STEP
        description: >-
          In the absence of JA-Ile, JAZ proteins bind MYC factors through the Jas motif and the adaptor NINJA
          through the TIFY motif of the ZIM domain; NINJA's EAR motif recruits TOPLESS and TPL-related
          corepressors. This assembly represses MYC-dependent transcription until JAZ is degraded.
        annotons:
          - id: jaz_repressor
            label: JAZ repressor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: JAZ (TIFY group II) jasmonate repressors
                representative_members:
                  - preferred_term: JAZ1 (TIFY10A; Arabidopsis)
                    term:
                      id: UniProtKB:Q9LMA8
                      label: Protein TIFY 10A
            function:
              preferred_term: transcription corepressor activity
              term:
                id: GO:0003714
                label: transcription corepressor activity
              evidence:
                - source_id: PMID:17637677
                  statement: JAZ1 represses jasmonate-responsive transcription.
                  supporting_text: JAZ1 protein acts to repress transcription of jasmonate-responsive genes
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Binds and inhibits MYC transcription factors, and recruits NINJA; also the
              degron-bearing co-receptor partner and SCF(COI1) substrate.
          - id: ninja_adaptor
            label: NINJA EAR-motif adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NINJA (AFPH2; Arabidopsis)
                term:
                  id: UniProtKB:Q9SV55
                  label: AFP homolog 2
            function:
              preferred_term: transcription corepressor activity
              term:
                id: GO:0003714
                label: transcription corepressor activity
              evidence:
                - source_id: PMID:20360743
                  statement: NINJA represses transcription through its TPL-binding EAR motif.
                  supporting_text: NINJA acts as a transcriptional repressor whose activity is mediated by a
                    functional TPL-binding EAR repression motif.
            processes:
              - preferred_term: negative regulation of DNA-templated transcription
                term:
                  id: GO:0045892
                  label: negative regulation of DNA-templated transcription
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Bridges the TIFY motif of JAZ proteins to TOPLESS corepressors via its EAR motif.
          - id: tpl_corepressor
            label: TOPLESS corepressor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TOPLESS (TPL; Arabidopsis)
                term:
                  id: UniProtKB:Q94AI7
                  label: Protein TOPLESS
            function:
              preferred_term: transcription corepressor activity
              term:
                id: GO:0003714
                label: transcription corepressor activity
              evidence:
                - source_id: PMID:20360743
                  statement: NINJA is in a complex with TPL and TPR2/TPR3, and TPL negatively regulates jasmonate
                    responses.
                  supporting_text: Accordingly, both NINJA and TPL proteins function as negative regulators of
                    jasmonate responses.
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Groucho/Tup1-type corepressor recruited by NINJA to silence MYC target genes.
    - order: 5
      role: MYC-dependent transcriptional activation
      node:
        id: myc_activation
        label: MYC2/MYC3 activation of jasmonate-responsive genes
        module_type: REGULATORY_STEP
        description: >-
          Released from JAZ, the subgroup IIIe bHLH factors MYC2, MYC3 and MYC4 bind G-box elements, recruit
          MED25 and activate jasmonate-responsive genes, including JAZ genes (negative feedback).
        annotons:
