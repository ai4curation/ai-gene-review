proposed_ontology_changes:
- change_type: NODE_MOVE
  ontology: GO
  about_node:
    id: GO:0033255
    label: SAS acetyltransferase complex
  old_value: GO:0032777
  new_value: GO:0031248
  subject:
    id: GO:0031248
    label: protein acetyltransferase complex
  predicate: rdfs:subClassOf
  change_dsl: move GO:0033255 rdfs:subClassOf GO:0032777 from GO:0032777 to GO:0031248
  justification: >-
    GO:0033255 SAS acetyltransferase complex is asserted is_a GO:0032777 piccolo histone
    acetyltransferase complex, which is defined as a heterotrimeric H4/H2A histone acetyltransferase
    complex with a substrate preference for chromatin over free histones that contains a subset of
    the NuA4 subunits. The yeast SAS complex fails each part of that definition: it acetylates histone
    H4 lysine 16 (and H3 lysine 14 in vitro) but not H2A, it prefers free histones, with no or only
    very weak activity on nucleosomes, and its subunits Sas2, Sas4 and Sas5 are not NuA4 subunits.
    Because neither term carries a logical definition, SAS acetyltransferase complex is currently not
    classified as a histone acetyltransferase complex at all. The move places it under protein
    acetyltransferase complex, which is correct and asserts no location. The more specific parent
    GO:1902562 H4 histone acetyltransferase complex is logically defined and would make the complex
    part_of chromatin through GO:0000123 histone acetyltransferase complex; the evidence does not show
    SAS-I to be part of chromatin, so that parent fits only once the GO:0000123 part_of chromatin edge
    (questioned for the HAT-B and Rtt109-Vps75 complexes) is removed.
  origin: SELF_PROPOSED
  confidence: PROBABLE
  request_status: NOT_FILED
  ontology_state_verified: '2026-11-18'
  affected_annotations:
  - UniProtKB:P40963 SAS2 part_of GO:0033255 (IDA PMID:12626510; IPI PMID:11731480, PMID:15788653)
  - UniProtKB:Q04003 SAS4 part_of GO:0033255 (IBA GO_REF:0000033; IDA PMID:12626510; IEA
    GO_REF:0000002; IPI PMID:11731480)
  - UniProtKB:Q99314 SAS5 part_of GO:0033255 (IDA PMID:12626510; IPI PMID:11731480, PMID:15788653)
  supported_by:
  - reference_id: PMID:12626510
    supporting_text: neither the recombinant nor the native SAS complex acetylated nucleosomal histones
      under conditions that were optimum for acetylating free histones
  - reference_id: PMID:15659401
    supporting_text: It is capable of acetylating both free histones and nucleosomes, although the
      nucleosomal HAT activity of SAS complex is very weak when compared with that of NuA4
  - reference_id: PMID:15659401
    supporting_text: the native yeast SAS complex is a small trimeric protein complex composed solely
      of Sas2, Sas4, and Sas5 with a molecular mass of about 125 kDa
knowledge_gaps:
- gap_statement: >-
    It is not known whether SAS-I acetylates H4 lysine 16 on histones before they are deposited (free
    or bound to CAF-I or Asf1) or on newly assembled nucleosomes.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    The answer decides whether SAS-I acts on chromatin or on its precursors, and so whether a
    chromatin location is right for the complex. In vitro the complex prefers free histones and does
    not acetylate Asf1-bound H3-H4, while its nucleosomal activity is absent or very weak; in vivo
    H4K16 acetylation appears in chromatin as soon as DNA is replicated, which fits either model.
  provenance:
  - reference_id: PMID:12626510
    supporting_text: association of H3 and H4 with Asf1 blocks their acetylation by the SAS complex,
      raising the possibility that the SAS HAT complex may acetylate free histones prior to their
      deposition onto DNA by Asf1 or CAF-I
  - reference_id: PMID:34014972
    supporting_text: Alternatively, SAS-I may acetylate the histones as they are bound by CAF-I/ Asf1,
      but shortly before incorporation into chromatin.
  - reference_id: PMID:15659401
    supporting_text: It is capable of acetylating both free histones and nucleosomes, although the
      nucleosomal HAT activity of SAS complex is very weak when compared with that of NuA4
- gap_statement: >-
    Whether the CAF-I interaction couples SAS-I to replication-coupled chromatin assembly has not
    been tested.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Sas2 binds Cac1, the large subunit of CAF-I, and SAS-dependent H4K16 acetylation is deposited
    during S phase in the wake of chromatin assembly, which led to a recruitment model. No experiment
    has removed the SAS-I-CAF-I contact and measured replication-coupled H4K16 acetylation, and SAS-I
    has not been detected on chromatin by ChIP.
  provenance:
  - reference_id: PMID:21908408
    supporting_text: Since CAF-I deposits histones on newly replicated DNA, one can therefore speculate
      that it recruits SAS-I to sites of chromatin assembly to perform histone acetylation.
  - reference_id: PMID:11731480
    supporting_text: SAS-I is recruited to freshly replicated DNA by its association with chromatin
      assembly complexes to acetylate lysine 16 of H4
- gap_statement: >-
    The functions of SAS-I beyond preventing the spreading of SIR heterochromatin are unknown.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Esa1 and Sas2 together supply all cellular H4K16 acetylation, and removing Sas2 from cells that
    already lack Esa1, Rpd3L and Sir3 worsens their growth, which points to a role of SAS-I acetylation
    beyond its boundary function. What that role is has not been identified.
  provenance:
  - reference_id: PMID:34014972
    supporting_text: SAS-I-mediated acetylation has a cellular function that extends beyond its
      function in preventing the spreading of the SIR complex
