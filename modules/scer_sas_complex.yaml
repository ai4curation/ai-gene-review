id: MODULE:scer_sas_complex
title: SAS-I histone acetyltransferase complex (Sas2-Sas4-Sas5) in Saccharomyces cerevisiae
description: >-
  SAS-I is a budding-yeast histone acetyltransferase that acetylates histone H4 on lysine 16. The
  native complex is a trimer of about 125 kDa with one copy each of the MYST-family catalytic
  subunit Sas2, the central subunit Sas4 and the YEATS-domain subunit Sas5. Sas4 bridges Sas2 and
  Sas5; Sas2 is active only with Sas4, and Sas5 stimulates the activity. The complex acetylates free
  histones well and nucleosomes only weakly. It interacts with the histone deposition factors Asf1
  and CAF-I, and acetylation of H4 lysine 16 appears in chromatin as soon as DNA is replicated, in a
  SAS-I-dependent manner, so the complex is thought to acetylate new histones at or just before their
  deposition. SAS-I provides about 60 percent of cellular H4K16 acetylation, mostly within open
  reading frames. The mark opposes deacetylation by Sir2 and binding of Sir3, so SAS-I limits the
  spreading of SIR heterochromatin from telomeres and the silent mating-type loci; without it SIR
  proteins spread into subtelomeric regions and silence the genes there.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:15659401
  title: Characterization of the yeast trimeric-SAS acetyltransferase complex.
  statement: >-
    Defines the boundary: the native complex is a trimer of Sas2, Sas4 and Sas5 and nothing else.
  supporting_text: the native yeast SAS complex is a small trimeric protein complex composed solely
    of Sas2, Sas4, and Sas5 with a molecular mass of about 125 kDa
- source_id: PMID:12626510
  title: Sas4 and Sas5 are required for the histone acetyltransferase activity of Sas2 in the SAS
    complex.
  statement: >-
    The reconstituted complex shows the division of labour: Sas4 is required for Sas2's activity and
    Sas5 stimulates it.
  supporting_text: recombinant Sas2 has HAT activity that absolutely requires Sas4 and is stimulated
    by Sas5
- source_id: PMID:15788653
  title: Nuclear import of the histone acetyltransferase complex SAS-I in Saccharomyces cerevisiae.
  statement: >-
    Sas4 is the central subunit and bridges Sas2 and Sas5.
  supporting_text: we found that Sas4p was the central subunit of the SAS-I complex, bridging Sas2p
    and Sas5p
- source_id: PMID:11731480
  title: The silencing complex SAS-I links histone acetylation to the assembly of repressed chromatin
    by CAF-I and Asf1 in Saccharomyces cerevisiae.
  statement: >-
    SAS-I is a nuclear complex and interacts with CAF-I and Asf1, which are not subunits.
  supporting_text: the MYST family acetyltransferase Sas2 was found to interact with Cac1, the largest
    subunit of Saccharomyces cerevisiae chromatin assembly factor-I (CAF-I), and with the nucleosome
    assembly factor Asf1
notes: >-
  Boundary. The module contains the three subunits of the native trimer: Sas2 (catalytic), Sas4
  (central, bridging) and Sas5 (accessory). An early gel-filtration estimate of about 450 kDa
  (PMID:11731479) is superseded by the characterization of the native complex as a 125 kDa trimer
  composed solely of the three proteins (PMID:15659401). The histone chaperones Asf1 and CAF-I (its
  large subunit Cac1) bind SAS-I and link it to histone deposition, but are not subunits and belong
  with replication-coupled chromatin assembly; they are named in the role descriptions. Histones are
  substrates. Sir2, Sir3 and the Rpd3L deacetylase, which SAS-I opposes at heterochromatin
  boundaries, and Esa1 (NuA4), which acetylates H4K16 redundantly with SAS-I (PMID:34014972), are
  outside the module.


  Activity and sites. The catalytic annoton uses histone H4K16 acetyltransferase activity, the core
  function in the SAS2 review: the native trimer acetylates H4 lysine 16 exclusively in vitro and is
  required for bulk H4K16 acetylation in vivo, and an H4 K16R mutation phenocopies sas2 deletion. The
  recombinant complex also acetylated H3 lysine 14 in one study (PMID:12626510); the SAS2 review
  keeps that as a secondary function, and it is not modelled here. Sas4 contributes to the activity
  and bridges Sas2 and Sas5, and its annoton carries its own activity, protein-macromolecule adaptor
  activity, as in the SAS4 review. Sas5 contributes to the activity without a known activity of its
  own: an annoton function would assert that Sas5 enables H4K16 acetylation, so its step is left
  untyped and the contribution is recorded in the SAS5 review (contributes_to GO:0046972). The YEATS
  domain of Sas5 binds acylated H3 peptides weakly in vitro (PMID:35296687), but no role for that
  binding in SAS-I has been shown.


  Where SAS-I acts. The evidence places the activity mainly on histones that are not yet in
  chromatin, at or just before deposition. Sutton et al. found that neither the recombinant nor the
  native complex acetylated nucleosomal histones under conditions optimal for free histones, and
  that H3-H4 bound to Asf1 is not acetylated, which suggested acetylation of free histones before
  deposition by Asf1 or CAF-I (PMID:12626510). Shia et al. detected nucleosomal activity, but very
  weak compared with NuA4 (PMID:15659401). In vivo, H4K16 acetylation rises in chromatin immediately
  upon replication and this depends on Sas4; Boltengagen et al. leave open whether SAS-I is recruited
  to newly assembled chromatin through CAF-I or acetylates CAF-I/Asf1-bound histones shortly before
  incorporation (PMID:34014972). SAS-I is not recruited to promoters and does not travel with Pol
  II, and Sas2 has not been detected on chromatin by ChIP (PMID:21908408). SAS-I therefore has a
  documented activity on non-chromatin histones, and a chromatin location is not established; the
  located_in chromatin rows on the three subunits cite a paper without a localization assay and are
  kept only as non-core in the gene reviews.


  Ontology. The module concept is GO:0033255 SAS acetyltransferase complex. Unlike the HAT-B and
  Rtt109-Vps75 terms, it does not inherit part_of chromatin in the current release (go-plus
  2026-07-26): its only parent is GO:0032777 piccolo histone acetyltransferase complex, which is_a
  protein-containing complex, and neither term has a logical definition that places it under
  GO:0000123 histone acetyltransferase complex. The piccolo parent is wrong on three counts: piccolo
  is defined as an H4/H2A acetyltransferase that prefers chromatin over free histones and contains a
  subset of NuA4 subunits, whereas SAS-I acetylates H4 (and H3 in vitro) but not H2A, prefers free
  histones, and shares no subunit with NuA4. As a result SAS-I is also missing from the histone
  acetyltransferase complex hierarchy. The reparenting is requested under proposed_ontology_changes.
  The natural parent, H4 histone acetyltransferase complex (GO:1902562), is logically defined and
  would be classified under GO:0000123 and so under chromatin, which the evidence above does not
  support; until the GO:0000123 part_of chromatin edge questioned in
  modules/scer_hat_b_complex.yaml is resolved, the request names GO:0031248 protein acetyltransferase
  complex, the parent proposed there for the HAT-B term.


  Gene reviews. SAS2 (reviewed earlier), SAS4 and SAS5 support the three annotons. The SAS4 and
  SAS5 reviews modify the subtelomeric heterochromatin formation rows to heterochromatin boundary
  formation, used as the annoton process here; the SAS2 review still accepts subtelomeric
  heterochromatin formation and silent mating-type cassette heterochromatin formation as core.
