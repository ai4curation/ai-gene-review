id: MODULE:ribosome_quality_control_and_stalled_ribosome_rescue
title: Human ribosome-associated quality control and stalled-ribosome rescue — ZNF598 collision sensing, splitting by the ASC-1 (RQT) complex or PELO-HBS1L with ABCE1, and NEMF-LTN1 nascent-chain quality control with ANKZF1 release
description: >-
  Cytosolic ribosomes that stall during elongation, whether on an mRNA feature that blocks
  decoding (no-go), on a poly(A) tail or truncated 3' end that lacks a stop codon (nonstop), or
  through slow decoding, are detected and dismantled by a dedicated quality-control pathway.
  When a trailing ribosome runs into a stalled one, the two 40S subunits form a composite
  interface that the RING E3 ubiquitin ligase ZNF598 recognises; ZNF598 monoubiquitinates the
  40S protein eS10 and builds K63-linked polyubiquitin chains on uS10. The ubiquitinated
  leading ribosome is split into subunits by the ASC-1 complex (the human RQC-trigger complex),
  in which the ATP-dependent helicase ASCC3 does the work, the CUE-domain protein ASCC2 reads
  the K63 chains and TRIP4 is the third subunit. Ribosomes stalled at the 3' end of an mRNA,
  with an empty mRNA channel and A site, are instead recognised by PELO, the eRF1-like factor,
  delivered by its GTPase partner HBS1L, and split by the ABC-family ATPase ABCE1. Splitting
  leaves a 60S subunit carrying peptidyl-tRNA. NEMF binds this 60S complex, senses the tRNA,
  and recruits and stabilises the E3 ligase listerin (LTN1), which polyubiquitinates the nascent
  chain at the exit tunnel; TCF25 biases the chains towards K48 linkage. NEMF also adds
  untemplated C-terminal alanine tails to the nascent chain, which expose buried lysines to
  LTN1 and, when LTN1 fails, act as C-terminal degrons. The tRNA-specific endonuclease ANKZF1
  cuts the 3'CCA end off the P-site tRNA to release the ubiquitinated chain for proteasomal
  degradation, and the VCP-UFD1-NPLOC4 segregase is thought to extract it. In parallel, the
  stalling mRNA is silenced: GIGYF2 and the cap-binding protein 4EHP (EIF4E2) block further
  initiation on that message, and the mRNA is degraded.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001671
    title: no-go mRNA decay pathway
    statement: >-
      RGD Pathway Ontology term for decay of mRNAs on which ribosomes stall during elongation (id
      and label checked against .cache/rgd_pw/pw.obo; is_a PW:0000546 mRNA decay pathway, and a
      diagram link of the translation pathway PW:0000101). RGD annotates no human or rat gene to
      it directly. The module covers its ribosome side: sensing of the stalled ribosome,
      splitting by the ASC-1 complex or by PELO-HBS1L with ABCE1, and quality control of the
      nascent chain. The decay enzymes themselves are not modelled (see notes and knowledge
      gaps).
  - source_id: PW:0000549
    title: nonstop mRNA decay pathway
    statement: >-
      RGD Pathway Ontology term for decay of mRNAs lacking a stop codon (id and label checked
      against .cache/rgd_pw/pw.obo; is_a PW:0000546 mRNA decay pathway, and a diagram link of
      PW:0000101). RGD annotates no human or rat gene to it directly. The module covers its
      ribosome side: PELO-HBS1L recognition of ribosomes stalled at the 3' end, ABCE1
      splitting, and NEMF-LTN1 quality control of the nonstop product.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000101.yaml
    statement: >-
      RGD's translation pathway text names PELO and HBS1L as the factors that recognise stalled
      ribosomes in no-go and nonstop decay and ABCE1 as their recycling partner.
    supporting_text: they are recognized by the two corresponding paralogs - Pelota (Pelo) and Hbs1, respectively.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0000101.yaml
    statement: RGD's text links ABCE1 to PELO for recycling of stalled ribosomes.
    supporting_text: Abce1 interacts with Etf1 or Pelo to promote recycling.
  - source_id: GO:0072344
    title: rescue of stalled cytosolic ribosome
    statement: >-
      Main GO process of the module (is_a cytoplasmic translational elongation and ribosome
      disassembly). The PW terms map to the mRNA decay processes GO:0070966 (no-go decay) and
      GO:0070481 (non-stop decay) in their definitions; those are cited here as context but are
      not module concepts because the module does not model the decay enzymes.
  - source_id: GO:1990116
    title: ribosome-associated ubiquitin-dependent protein catabolic process
    statement: GO process for the nascent-chain branch of the module (NEMF, LTN1, TCF25, ANKZF1, VCP).
  - source_id: PMID:30293783
    title: ZNF598 Is a Quality Control Sensor of Collided Ribosomes.
    statement: The collided di-ribosome is the minimal unit recognised by ZNF598.
    supporting_text: the minimal unit engaged by ZNF598 is the collided di-ribosome
  - source_id: PMID:32579943
    title: The ASC-1 Complex Disassembles Collided Ribosomes.
    statement: >-
      In a mammalian cell-free system ASCC disassembles the leading collided ribosome, requiring
      ZNF598 ubiquitination of the 40S but not PELO-HBS1L.
    supporting_text: Disassembly, but not ribosome association, requires 40S ubiquitination by ZNF598, but not GTP-dependent factors, including the Pelo-Hbs1L ribosome rescue complex.
  - source_id: PMID:21448132
    title: Dissociation by Pelota, Hbs1 and ABCE1 of mammalian vacant 80S ribosomes and stalled elongation complexes.
    statement: Mammalian PELO and HBS1L split stalled elongation complexes only together with ABCE1.
    supporting_text: Pelota/Hbs1 also induced dissociation of ECs and release of peptidyl-tRNA, but only in the presence of ABCE1.
  - source_id: PMID:30244831
    title: Release of Ubiquitinated and Non-ubiquitinated Nascent Chains from Stalled Mammalian Ribosomal Complexes by ANKZF1 and Ptrh1.
    statement: The mammalian RQC sequence after splitting, reconstituted from purified factors.
    supporting_text: 60S RNCs associate with NEMF, which recruits the E3 ubiquitin ligase Listerin that ubiquitinates NCs.
notes: >-
  Derived through projects/RGD_PATHWAY_ONTOLOGY from the stalled-ribosome part of the RGD
  translation pathway diagram (PW:0000101; pathways/PW_0000101.yaml), whose split plan
  (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md, item 4) left no-go and nonstop
  decay to a later ribosome-quality-control module, and translation_elongation_and_termination
  (decision 7) left PELO and HBS1L for it. PW:0001671 (no-go mRNA decay pathway) and PW:0000549
  (nonstop mRNA decay pathway) are cited as evidence source_ids; ids, labels and definitions
  were checked against .cache/rgd_pw/pw.obo. In pw.obo both are is_a PW:0000546 (mRNA decay
  pathway), not children of translation; they enter the translation pathway as diagram links
  of PW:0000101, whose text names Pelo and Hbs1l as their stalled-ribosome sensors and Abce1 as
  the recycling factor. Neither PW id has its own seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, and .cache/rgd_pw/homo_genes_pw and
  rattus_genes_pw annotate no gene to either; RGD annotates PELO and HBS1L to the parent
  PW:0000546 and to translation termination PW:0000582. PW:0000101 itself is not cited as an
  evidence source because its elongation, termination, initiation and ribosome parts are
  modelled in the sibling modules. All participants were therefore added from human
  experimental evidence: ZNF598, ASCC3, ASCC2, TRIP4, PELO, HBS1L, NEMF, LTN1, TCF25, ANKZF1,
  VCP, UFD1, NPLOC4, GIGYF2 and EIF4E2, all of which have human gene reviews. UniProt
  accessions and recommended names are from the gene folders. Molecular functions are from
  experimental human GOA rows (local GOA files, November 2026) or the core functions of the
  gene reviews. Curator-authored functions without an experimental human GOA row for the
  same term: GTPase activity for HBS1L (Reactome TAS only; core function of its review),
  tRNA-specific ribonuclease activity for ANKZF1 (core function of its review; its IDA rows
  are the parent RNA endonuclease activity and catalytic activity, acting on a tRNA),
  polyubiquitin modification-dependent protein binding for UFD1 and ubiquitin binding for
  NPLOC4 (core functions of their reviews; no experimental GOA row), and ATP hydrolysis
  activity for VCP in this setting (experimental rows exist from other processes; its RQC
  rows are NAS). The GO process concepts are rescue of stalled cytosolic ribosome
  (GO:0072344) and ribosome-associated ubiquitin-dependent protein catabolic process
  (GO:1990116), not the no-go and non-stop decay processes the PW terms map to, because the
  decay enzymes are not modelled.

  Boundary and modelling decisions. (1) Substrates are not participants. The ribosomal
  proteins that ZNF598 ubiquitinates (eS10/RPS10, uS10/RPS20, and uS3/RPS3 in some studies),
  the ribosome itself, the stalling mRNA, the nascent chain and the P-site tRNA are acted on;
  they are not units. Ribosomal proteins are modelled once in cytoplasmic_ribosome, including
  RACK1, whose gene review records its role in resolving poly(A)-stalled ribosomes as a 40S
  constituent; RACK1 is referenced there, not repeated. The E2 that ZNF598 uses (UBE2D family)
  and ubiquitin supply are generic and not modelled. (2) ZNF598 has two annotons, the
  collision-sensor activity and the E3 activity, as in its review and in
  gomodel:63e5937500000591; its third GO-CAM activity, protein-RNA adaptor activity in
  gomodel:63e5937500000997, is pinned to the initiation-repression node rather than given a
  third annoton because that model is the only source for it. (3) Splitting is a variant set
  with two routes chosen by ribosome state, as in the human reconstitutions (PMID:32579943
  for ASC-1 on collided ribosomes; PMID:21448132 and PMID:27543824 for PELO-HBS1L-ABCE1 on
  ribosomes with little mRNA past the P site). The human RQC-trigger complex is ASCC3, ASCC2
  and TRIP4 only (PMID:36302773); ASCC1, the fourth subunit of the nuclear ASC-1 coactivator
  complex, has no RQC evidence and is excluded. TRIP4 and TCF25 are listed without a molecular
  function because each was assayed only within its complex and their reviews assign none;
  ASCC2 gets its ubiquitin-reading function and no ATPase or splitting activity. Whether ABCE1
  also acts after the ASC-1 route is not established in the cited human work, so ABCE1 sits in
  the PELO-HBS1L route; the RQC GO-CAMs draw both ASCC3 and ABCE1 upstream of NEMF, and those
  ABCE1 activities are pinned to the referencing node. (4) ABCE1 is modelled in
  translation_elongation_and_termination (abce1_recycling) and is included here by module_ref;
  its rescue and RQC GO-CAM activities, which that module left for this one, are pinned here.
  (5) The nascent-chain branch follows the mammalian reconstitution (PMID:25578875,
  PMID:30244831): NEMF has two annotons (60S binding that recruits listerin; alanyl-tRNA
  binding for CAT tailing, as in its review and in the GO-CAMs); the peptidyl transfer that
  adds the tail is catalysed by the 60S rRNA. The C-end degron ligases that recognise Ala tails
  (CRL2-KLHDC10, RCHY1; gomodel:63f809ec00000560) and the proteasome are downstream degradation
  machinery and are not modelled; KLHDC10's GO-CAM activity is not pinned. (6) VCP-UFD1-NPLOC4
  is an optional part. In yeast Cdc48-Ufd1-Npl4 is part of the RQC complex, but in the purified
  mammalian system p97 with its cofactors only slightly stimulated degradation and did not
  affect ubiquitination (PMID:30244831), and the human GOA rows for RQC are NAS
  (PMID:35452614); this is recorded as a knowledge gap. No production GO-CAM contains VCP,
  UFD1 or NPLOC4 in an RQC model. (7) ANKZF1 releases the chain by cleaving the tRNA;
  peptidyl-tRNA hydrolysis by PTRH1 of non-ubiquitinated chains (PMID:30244831) is a minor
  alternative and not modelled. Repair of ANKZF1-cleaved tRNA by ELAC1 and TRNT1
  (PMID:32075755, PMID:31011209; gomodel:63f809ec00000701) is tRNA recycling downstream of
  RQC and not modelled; those two GO-CAM activities are not pinned. (8) mRNA decay coupled to
  stalling. No endonuclease is modelled. N4BP2 is the human homologue of the yeast Cue2 and
  worm NONU-1 endonucleases, and its depletion stabilises a nonstop reporter in human cells
  (PMID:40441874, the source of its IMP row for non-stop decay), but no human study cached here
  shows N4BP2 cleaving mRNA at stalled ribosomes, so it is named here and in a knowledge gap,
  not as a participant. ANGEL1, reported in the same paper as a nonstop-decay factor, is
  likewise not modelled. The 3'-to-5' decay of the mRNA by the SKI complex and the exosome
  (required for nonstop decay with HBS1L and PELO, PMID:23667253; the SKI node of
  gomodel:63e5937500001279) is general cytoplasmic decay with no human module yet and is not
  modelled; that GO-CAM activity is not pinned. The NMD module (nonsense_mediated_mrna_decay)
  handles premature stop codons and is separate. (9) GIGYF2-4EHP repression of initiation is an
  optional regulatory part with human experimental support (PMID:32726578); EDF1, also reported
  to recruit GIGYF2 to collisions, has no experimental GOA row for this and is not modelled.
  (10) Excluded related pathways: collision-induced ribotoxic and integrated stress signalling
  (ZAK, GCN1 and GCN2), degradation of stalled eEF1A and eRF1 by RNF14 and RNF25 (excluded also
  from translation_elongation_and_termination), ubiquitination of ribosomal proteins by other
  ligases (CNOT4, MKRN1, RNF10) in poly(A) or initiation quality control, and ER-associated
  RQC by ufmylation of RPL26 (UFL1, DDRGK1, CDK5RAP3, UFSP2; gomodel:65f3ae5c00000257, whose
  ASCC3 and ABCE1 activities are pinned here because they are the same splitting steps).
  Mitochondrial ribosome rescue is outside. Comparator check for substrates: queried by term id
  in QuickGO (November 2026, descendants included), rescue of stalled cytosolic ribosome
  returns 11 annotations for ZNF598 (positive control) and none for its substrates RPS10,
  RPS20 or RPS3, consistent with leaving the substrates out.

  GO-CAM links (gocams/index.tsv). Pinned: gomodel:63e5937500000591 (ZNF598 sensor and E3,
  ASCC2, ASCC3); gomodel:63e5937500001279 (HBS1L, PELO and ABCE1; the SKI activity is not
  pinned); gomodel:63f809ec00000512 (NEMF twice, LTN1, ASCC3, ABCE1); gomodel:63f809ec00000560
  (NEMF twice, ASCC3, ABCE1); gomodel:63f809ec00000701 (NEMF, ANKZF1); gomodel:63e5937500000997
  (ZNF598 adaptor, GIGYF2, EIF4E2); gomodel:65f3ae5c00000257 (ASCC3, ABCE1). The GO-CAM ABCE1
  activities use the parent ribonucleoside triphosphate phosphatase activity, consistent with
  the ATP hydrolysis activity in the referenced module. PANTHER family ids and PTNs are not
  asserted.
knowledge_gaps:
  - gap_statement: >-
      The endonuclease that cleaves mRNA upstream of stalled or collided ribosomes in human
      no-go and nonstop decay has not been shown biochemically. N4BP2, the homologue of yeast
      Cue2 and worm NONU-1, is the candidate: its depletion stabilises a human nonstop reporter,
      but no human assay has shown it cutting mRNA at collided ribosomes.
    boundary: >-
      The module models sensing, splitting and nascent-chain quality control; the decay
      enzymes are named in notes only.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Without the endonuclease the mRNA side of PW:0001671 and PW:0000549 cannot be modelled
      for human, and whether N4BP2 is a collision-dependent nuclease, and whether it needs
      ZNF598 ubiquitination, is unknown.
    resolution: >-
      Reconstitute cleavage of a stalling mRNA by purified N4BP2 on collided human ribosomes,
      test a catalytic-dead N4BP2 in N4BP2-knockout cells with no-go and nonstop reporters, and
      map cleavage sites relative to the collision.
    provenance:
      - reference_id: PMID:40441874
        supporting_text: We next tested whether N4BP2, a mammalian homolog of the initiating NSD/NGD endonuclease Cue2/NONU-1, plays a role in targeting the NSD substrate for mRNA decay.
      - reference_id: PMID:40441874
        supporting_text: Indeed, depletion of N4BP2 led to stabilization of the NSD reporter
  - gap_statement: >-
      Whether the VCP-UFD1-NPLOC4 segregase is required to extract ubiquitinated nascent chains
      from 60S subunits in human cells is unresolved; in purified mammalian reactions ANKZF1
      released ubiquitinated chains for proteasomal degradation with only slight stimulation by
      p97 and its cofactors.
    boundary: >-
      VCP-UFD1-NPLOC4 is modelled as an optional part on the basis of yeast work and author
      statements.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Decides whether p97 is a core step of human RQC or an accessory one.
    resolution: >-
      Acute VCP inhibition or degron depletion in human cells with a stalling reporter,
      measuring 60S-associated ubiquitinated nascent chains and their degradation, and
      reconstitution with human ribosomes, NEMF, listerin, ANKZF1 and p97 complexes.
    provenance:
      - reference_id: PMID:30244831
        supporting_text: Degradation was slightly stimulated by p97/Ufd1-Npl4 and moderately inhibited by NEMF/Listerin.
  - gap_statement: >-
      The molecular activities of TRIP4 in the RQC-trigger complex and of TCF25 in the RQC
      complex are unknown; both are required or present for function, but neither has an
      activity assigned.
    boundary: Both are listed as units without a molecular function.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Each is a conserved subunit of a core RQC complex whose contribution is undefined.
    resolution: >-
      Structure-guided mutants of TRIP4 in reconstituted hRQT splitting assays, and of TCF25 in
      listerin chain-linkage assays, to identify the activity each contributes.
    provenance:
      - reference_id: PMID:30244831
        supporting_text: We also found that TCF25, a poorly characterized RQC component, ensures preferential formation of the K48-ubiquitin linkage.
module:
  id: ribosome_quality_control_and_stalled_ribosome_rescue
  label: Ribosome-associated quality control and stalled-ribosome rescue
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Sensing of collided or stalled cytosolic ribosomes, their splitting into subunits, and
    ubiquitin-dependent clearance of the nascent chain left on the 60S subunit, with
    translational silencing of the stalling mRNA.
  concepts:
    - preferred_term: rescue of stalled cytosolic ribosome
      term:
        id: GO:0072344
        label: rescue of stalled cytosolic ribosome
    - preferred_term: ribosome-associated ubiquitin-dependent protein catabolic process
      term:
        id: GO:1990116
        label: ribosome-associated ubiquitin-dependent protein catabolic process
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
  parts:
    - order: 1
      role: sensing of collided ribosomes and ubiquitination of the 40S subunit
      node:
        id: collision_sensing
        label: ZNF598 recognition and ubiquitination of collided ribosomes
        module_type: BIOLOGICAL_PROCESS
        description: >-
          ZNF598 binds the 40S-40S interface of collided di-ribosomes and ubiquitinates two
          proteins of the leading 40S subunit, eS10 (RPS10) and uS10 (RPS20). The ribosomal
          proteins are substrates of this step, not participants; they are modelled once in
          cytoplasmic_ribosome.
        annotons:
          - id: znf598_sensor
            label: "ZNF598: recognition of the collided di-ribosome"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ZNF598
                term:
                  id: UniProtKB:Q86UK7
                  label: E3 ubiquitin-protein ligase ZNF598
            function:
              preferred_term: stalled ribosome sensor activity
              term:
                id: GO:0170011
                label: stalled ribosome sensor activity
            processes:
              - preferred_term: rescue of stalled cytosolic ribosome
                term:
                  id: GO:0072344
                  label: rescue of stalled cytosolic ribosome
            locations:
              - preferred_term: cytosolic ribosome
                term:
                  id: GO:0022626
                  label: cytosolic ribosome
            role_description: >-
              Binds collided di-ribosomes selectively, using collisions as the proxy for
              stalling, so that the threshold for quality control depends on the initiation
              rate of each mRNA. Experimental human GOA: stalled ribosome sensor activity, IDA
              (PMID:30293783), and ribosome binding, IDA; this is one of the two core functions
              of the human ZNF598 review.
            evidence:
              - source_id: PMID:30293783
                statement: The collided di-ribosome carries the ZNF598 targets at its 40S-40S interface.
                supporting_text: The collided di-ribosome structure reveals an extensive 40S-40S interface in which the ubiquitination targets of ZNF598 reside.
            gocam_associations:
              - model: gomodel:63e5937500000591
                activity: gomodel:63e5937500000591/63e5937500000592
                title: ZNF598 stalled ribosome sensor activity (GO:0170011), Activation of the ribosome quality control by ZNF598 in response to ribosome collisions, leading to ubiquitination of RPS20/us10 and ribosome dissociation by the RQT complex, composed of ASCC2 and ASCC3 (Human)
          - id: znf598_e3
            label: "ZNF598: E3 ubiquitin ligase for eS10 and uS10 on the leading 40S"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ZNF598
                term:
                  id: UniProtKB:Q86UK7
                  label: E3 ubiquitin-protein ligase ZNF598
            function:
              preferred_term: ubiquitin protein ligase activity
              term:
                id: GO:0061630
                label: ubiquitin protein ligase activity
            processes:
              - preferred_term: rescue of stalled cytosolic ribosome
                term:
                  id: GO:0072344
                  label: rescue of stalled cytosolic ribosome
            locations:
              - preferred_term: cytosolic ribosome
                term:
                  id: GO:0022626
                  label: cytosolic ribosome
            role_description: >-
              RING-type E3 that, with an E2 of the UBE2D family, monoubiquitinates eS10 (RPS10)
              at two lysines and adds K63-linked polyubiquitin to uS10 (RPS20); the uS10 chains
              recruit the ASC-1 complex. Experimental human GOA: ubiquitin protein ligase
              activity, IDA (PMID:28065601, PMID:28685749, PMID:30293783, PMID:36302773) and
              IMP; this is the other core function of the ZNF598 review. eS10 and uS10 are
              substrates. Ubiquitination of uS3 reported in some studies is not modelled
              separately. ZNF598's adaptor role in recruiting GIGYF2-4EHP is in part 4.
            evidence:
              - source_id: PMID:28065601
                statement: eS10 is the primary ribosomal target of ZNF598 in human cells.
                supporting_text: Biochemical ubiquitination reactions identified two sites of mono-ubiquitination on the 40S protein eS10 as the primary ribosomal target of ZNF598.
              - source_id: PMID:36302773
                statement: ZNF598 builds K63-linked chains on uS10 of collided ribosomes, which are required for RQC.
                supporting_text: Biochemical analysis of collided ribosomes shows that ZNF598 forms K63-linked polyubiquitin chains on uS10, which are decisive for mammalian RQC initiation.
            gocam_associations:
              - model: gomodel:63e5937500000591
                activity: gomodel:63e5937500000591/63e5937500000599
                title: ZNF598 ubiquitin protein ligase activity (GO:0061630), Activation of the ribosome quality control by ZNF598 in response to ribosome collisions, leading to ubiquitination of RPS20/us10 and ribosome dissociation by the RQT complex, composed of ASCC2 and ASCC3 (Human)
        connections:
          - source: znf598_sensor
            target: znf598_e3
            connection_type: POSITIVELY_REGULATES
            description: >-
              Binding of the collided di-ribosome positions ZNF598 to ubiquitinate the leading
              40S; ZNF598 discriminates collided from single stalled ribosomes before it
              ubiquitinates them.
    - order: 2
      role: splitting of the stalled ribosome into subunits
      node:
        id: stalled_ribosome_splitting
        label: Splitting of stalled ribosomes by the ASC-1 complex or by PELO-HBS1L with ABCE1
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Two routes split stalled ribosomes, chosen by the state of the ribosome: the ASC-1
          complex dissociates the ZNF598-ubiquitinated leading ribosome of a collision with
          mRNA still in its channel, while PELO-HBS1L recognises ribosomes with an empty A site
          and mRNA channel, as at the 3' end of a truncated or nonstop mRNA, and ABCE1 then
          splits them. Both leave a 60S subunit carrying peptidyl-tRNA and the nascent chain.
        concepts:
          - preferred_term: ribosome disassembly
            term:
              id: GO:0032790
              label: ribosome disassembly
        variant_sets:
          - id: splitting_routes
            label: splitting route
            axis: >-
              state of the stalled ribosome (ubiquitinated collided ribosome with mRNA in the
              channel versus ribosome with an empty A site and mRNA channel at the 3' end)
            variant_kind: ROUTE
            selection: ONE_OR_MORE
            variants:
              - id: asc1_complex_route
                label: ASC-1 (RQT) complex — ASCC3 helicase with ASCC2 and TRIP4
                module_type: PROTEIN_COMPLEX
                description: >-
                  The human RQC-trigger complex is ASCC3, ASCC2 and TRIP4. It binds collided
                  ribosomes without ubiquitin but disassembles the leading ribosome only after
                  ZNF598 has put K63 chains on uS10; ASCC3's ATPase supplies the work.
                concepts:
                  - preferred_term: RQC-trigger complex
                    term:
                      id: GO:0180022
                      label: RQC-trigger complex
                annotons:
                  - id: ascc3_atpase
                    label: "ASCC3: ATP-dependent helicase that dissociates the leading ribosome"
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ASCC3
                        term:
                          id: UniProtKB:Q8N3C0
                          label: Activating signal cointegrator 1 complex subunit 3
                    function:
                      preferred_term: ATP hydrolysis activity
                      term:
                        id: GO:0016887
                        label: ATP hydrolysis activity
                    processes:
                      - preferred_term: ribosome disassembly
                        term:
                          id: GO:0032790
                          label: ribosome disassembly
                      - preferred_term: rescue of stalled cytosolic ribosome
                        term:
                          id: GO:0072344
                          label: rescue of stalled cytosolic ribosome
                    locations:
                      - preferred_term: cytosolic ribosome
                        term:
                          id: GO:0022626
