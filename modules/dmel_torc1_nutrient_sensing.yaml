id: MODULE:dmel_torc1_nutrient_sensing
title: TORC1 nutrient- and growth-factor-sensing machinery in Drosophila melanogaster
description: >-
  TORC1 is activated on the lysosome surface only when two inputs coincide. Amino acid sufficiency
  is relayed through the heterodimeric Rag GTPases (RagA-B with RagC-D), which are anchored
  to the lysosome by the pentameric Ragulator complex and recruit TORC1 when RagA-B is GTP-bound.
  The GATOR1 complex (Iml1, Nprl2, Nprl3) acts as a GTPase-activating protein for RagA-B and
  so inhibits TORC1, and the GATOR2 complex (Mio, Wdr24, Wdr59, Seh1 and Sec13) inhibits GATOR1.
  Growth-factor and energy signals are relayed through the TSC1-TSC2 complex (Tsc1 and Gigas),
  a GTPase-activating protein for the small GTPase Rheb, which directly activates TORC1. In
  Drosophila, GATOR1 and GATOR2 regulate TORC1 activity in the ovary and other tissues, and
  TSC mutations cause cell overgrowth.
status: DRAFT
scope: CONCRETE
