notes: >-
  Boundary. TORC1 itself is modelled in dmel_tor_complexes; this module holds the upstream
  regulators that act on the Rag and Rheb GTPases. Rheb is not a member of these FlyBase groups
  and is added as the textbook substrate of the TSC complex and direct activator of TORC1.
  RagC-D has no UniProt mapping in the FlyBase file and is grounded to its FlyBase gene id.
  The GATOR1 GAP activity and the Ragulator structure are best characterized in mammalian
  and yeast orthologs. FlyBase groups realized by this module: SEA (FBgg0000050), RAG (FBgg0000321),
  TSC1-2C (FBgg0000905), LAMTOR (FBgg0001685), RAGGEF (FBgg0002204). Subgroups folded into
  it: GAT1, GAT2. Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_torc1_nutrient_sensing.yaml;
  none of the member genes has a gene review yet unless noted.
