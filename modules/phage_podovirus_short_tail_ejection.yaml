  knowledge_gaps:
  - gap_statement: The biophysical mechanism by which the internal core proteins gp14, gp15, and gp16 unfold to traverse the
      narrow gp8-gp11-gp12 portal-nozzle channel and spontaneously refold into a hexameric trans-envelope conduit across the
      outer membrane, periplasm, and inner membrane remains incompletely understood; in addition, Gene Ontology lacks a dedicated
      cellular component term for the transient podovirus trans-envelope DNA-ejectosome complex.
    boundary: Annotate internal core proteins to their resident virion and host envelope compartments (GO:0044423 virion component,
      GO:0020002 host cell plasma membrane, GO:0044229 host cell periplasmic space) and to the biological process GO:0099002
      (symbiont genome ejection through host cell envelope, short tail mechanism).
    gap_kind:
    - BIOLOGY
    - ONTOLOGY
