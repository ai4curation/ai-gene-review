id: MODULE:phage_podovirus_short_tail_ejection
title: Podovirus short-tail assembly, receptor-triggered nozzle remodeling, and internal core protein DNA-ejectosome channel
  formation
description: A coordinated morphogenetic and host-entry module characteristic of T7-like podoviruses (Autographiviridae and
  related short-tailed Caudoviricetes) that solves the topological challenge of translocating a double-stranded DNA genome
  across the Gram-negative outer membrane, peptidoglycan cell wall, periplasm, and inner membrane using a non-contractile
  tail shorter than the cell envelope thickness. During procapsid assembly, a cylindrical internal core stack of gp14, gp15,
  and the lytic transglycosylase gp16 is assembled coaxially atop the dodecameric portal ring (gp8) inside the capsid. Following
  DNA packaging, the dodecameric gatekeeper adaptor (gp11), hexameric tail nozzle (gp12), tail assembly protein (gp7.3), and
  six trimeric tail fibers (gp17) assemble onto the portal vertex. Upon irreversible lipopolysaccharide receptor engagement
  and tail fiber reorientation, conformational opening of the gp12 nozzle gates the sequential ejection of gp14 (forming the
  outer membrane pore), gp16 (locally hydrolyzing periplasmic peptidoglycan via its N-terminal lytic transglycosylase domain
  and spanning the inner membrane), and gp15 (forming a hexameric periplasmic tunnel with gp16) to construct a continuous
  trans-envelope DNA-ejectosome conduit into the host cytoplasm.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:23884409
  title: Structural characterization of the bacteriophage T7 tail machinery.
  statement: Defines the architecture and stoichiometric assembly of the T7 portal (gp8), adaptor (gp11), nozzle (gp12), and
    tail fiber (gp17) complex.
- source_id: PMID:23306440
  title: The bacteriophage t7 virion undergoes extensive structural remodeling during infection.
  statement: Cryo-electron tomography demonstrating ejection of the internal core proteins gp14, gp15, and gp16 upon receptor
    binding to form an extended trans-envelope tail conduit across the Escherichia coli cell envelope.
- source_id: PMID:34214465
  title: Cryo-EM structure of the periplasmic tunnel of T7 DNA-ejectosome at 2.7 Å resolution.
  statement: Atomic-resolution cryo-EM structure of the gp15-gp16 periplasmic tunnel of the T7 DNA-ejectosome spanning the
    periplasm and peptidoglycan layer.
- source_id: PMID:22645347
  title: Structure of the receptor-binding carboxy-terminal domain of bacteriophage T7 tail fibers.
  statement: Establishes the trimeric pyramid structure and lipopolysaccharide-binding loops of the T7 gp17 tail fiber C-terminal
    receptor-binding domain.
- source_id: GO:0099002
  title: symbiont genome ejection through host cell envelope, short tail mechanism
  statement: Defines the biological process of viral genome delivery across the bacterial envelope via a short non-contractile
    podovirus tail and extensible internal core ejectosome.
notes: 'Exemplar phage: Escherichia phage T7 (NCBITaxon:10760). Generalizes across Autographiviridae and other podoviruses
  (such as coliphage T3, Klebsiella phage KP32, Pseudomonas phage phiKMV, and cyanophage P-SSP7) that couple a gp11/gp12-type
  short tubular nozzle to an internal virion core (gp14/gp15/gp16 orthologs) ejected to form a transient trans-envelope DNA
  channel.'
