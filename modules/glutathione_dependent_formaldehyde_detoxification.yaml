      connection_type: PROVIDES_INPUT_FOR
  knowledge_gaps:
    - gap_statement: >-
        The quantitative contribution of this route relative to alternative
        formaldehyde oxidation branches varies among bacteria and often remains
        unresolved.
      boundary: Keep parallel dehydrogenases outside this defined branch.
      gap_kind: [BIOLOGY]
    - gap_statement: >-
        KT2440 formaldehyde-tolerance phenotypes support roles for PP_1616 and
        PP_1617 but do not establish their proposed FrmA-FrmC reaction
        sequence. PP_3970 contributes to formaldehyde mineralization, but
        published names and glutathione-dependence assignments conflict, and
        UniProtKB:Q88FV8 does not resolve its substrate or cofactor dependence.
      boundary: >-
        Do not treat the PP_1616/PP_1617 phenotypes as reaction-specific
        evidence or assign PP_3970 to a glutathione-dependent or
        glutathione-independent branch without direct biochemical evidence.
      gap_kind: [CURATION]
