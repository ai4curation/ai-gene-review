          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: Glutathione capture of formaldehyde
      node:
        id: formaldehyde_glutathione_capture
        label: S-(hydroxymethyl)glutathione formation
        module_type: REACTION
        description: >-
          Formaldehyde reacts with glutathione to form the hemithioacetal
          S-(hydroxymethyl)glutathione, which feeds the subsequent
          dehydrogenase step. This capture is spontaneous and has no gene
          participant.
    - order: 2
      role: Hemithioacetal oxidation
      node:
        id: frma_hemithioacetal_oxidation
        label: S-(hydroxymethyl)glutathione oxidation
        module_type: REACTION
        description: >-
          A class-3 alcohol dehydrogenase oxidizes
          S-(hydroxymethyl)glutathione to S-formylglutathione. The GO term
          permits NAD(P)+, whereas characterized family members are NAD+-biased.
        annotons:
          - id: frma_formaldehyde_dehydrogenase
            label: FrmA S-(hydroxymethyl)glutathione dehydrogenase
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: S-(hydroxymethyl)glutathione dehydrogenase [NAD(P)+] activity
                term:
                  id: GO:0051903
                  label: S-(hydroxymethyl)glutathione dehydrogenase [NAD(P)+] activity
              family:
                preferred_term: zinc-containing alcohol dehydrogenase family, class-3 lineage
                term:
                  id: PANTHER:PTHR43880:SF12
                  label: ALCOHOL DEHYDROGENASE CLASS-3
                representative_members:
