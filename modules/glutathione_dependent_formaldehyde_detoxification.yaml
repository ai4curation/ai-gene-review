id: MODULE:glutathione_dependent_formaldehyde_detoxification
title: Glutathione-dependent formaldehyde detoxification
description: >-
  A bacterial detoxification module in which formaldehyde is captured by
  glutathione as S-(hydroxymethyl)glutathione, the hemithioacetal is oxidized
  to S-formylglutathione, and the thioester is hydrolyzed to formate while
  regenerating glutathione. Chemical capture, oxidation, and hydrolysis are
  represented as separate steps.
status: DRAFT
evidence:
  - source_id: PMID:21261833
    title: Physiological responses of Pseudomonas putida to formaldehyde during detoxification
    statement: >-
      KT2440 oxidizes formaldehyde rather than assimilating it, and disruption
      of PP_1616 impairs growth under sublethal formaldehyde stress.
  - source_id: file:PSEPK/frmA/frmA-uniprot.txt
    title: PSEPK FrmA UniProt record
    statement: Q88MF5 is an S-(hydroxymethyl)glutathione dehydrogenase.
  - source_id: file:PSEPK/frmC/frmC-uniprot.txt
    title: PSEPK FrmC UniProt record
    statement: Q88MF4 is an S-formylglutathione hydrolase.
notes: >-
  The boundary begins with glutathione capture of formaldehyde and ends at
  formate plus regenerated glutathione. Formate oxidation to carbon dioxide,
  formaldehyde efflux, DNA repair, protein-quality control, and nitrosothiol
  reduction are distinct downstream or parallel functions. Organisms can carry
  additional formaldehyde oxidation routes, so this module represents the
  glutathione-dependent branch rather than the entire cellular response.
