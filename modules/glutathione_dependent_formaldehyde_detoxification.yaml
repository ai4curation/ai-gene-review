    - gap_statement: >-
        KT2440 formaldehyde-tolerance phenotypes support roles for PP_1616 and
        PP_1617 but do not establish their proposed FrmA-FrmC reaction
        sequence. PP_3970 contributes to formaldehyde mineralization, but
        published names and glutathione-dependence assignments conflict, and
        UniProtKB:Q88FV8 does not resolve its substrate or cofactor dependence.
