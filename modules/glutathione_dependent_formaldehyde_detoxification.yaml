id: MODULE:glutathione_dependent_formaldehyde_detoxification
title: Glutathione-dependent formaldehyde detoxification
description: >-
  A detoxification module found in bacteria and eukaryotes in which formaldehyde is captured by glutathione as S-(hydroxymethyl)glutathione, the hemithioacetal is oxidized to S-formylglutathione by a class-III alcohol dehydrogenase, and the thioester is hydrolyzed to formate while regenerating glutathione. Chemical capture, oxidation, and hydrolysis are represented as separate steps; formate can then be oxidized to CO2 by an NAD-dependent formate dehydrogenase.
status: DRAFT
evidence:
  - source_id: PMID:21261833
    title: Physiological responses of Pseudomonas putida to formaldehyde during detoxification
    statement: >-
      KT2440 oxidizes formaldehyde rather than assimilating it. PP_1616 and
      PP_1617 are induced by 0.5 mM formaldehyde, and their disruption impairs
      growth at 1.5 mM formaldehyde; the paper does not assign either protein
      to this glutathione-dependent reaction sequence.
  - source_id: PMID:21261833
    title: Physiological responses of Pseudomonas putida to formaldehyde during detoxification
    statement: >-
      This study calls PP_3970 fhdA and glutathione-dependent, but reports a
      formaldehyde-sensitivity phenotype rather than a biochemical substrate or
      glutathione-dependence assay.
    supporting_text: the fhdA gene encoding a glutathione‐dependent formaldehyde dehydrogenase (PP3970)
  - source_id: PMID:19304846
    title: Redundancy of enzymes for formaldehyde detoxification in Pseudomonas putida
    statement: >-
      KT2440 PP_3970 knockout data support a contribution to
      labeled-formaldehyde mineralization, but do not establish the enzyme's
      substrate chemistry or glutathione dependence.
    supporting_text: The results showed that both enzymes contributed to formaldehyde catabolism.
  - source_id: PMCID:PMC2687156
    title: Open-access full text of PMID:19304846
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2687156/
    statement: >-
      The open-access full text calls PP_3970 fdhB during a comparative
      sequence-annotation analysis; its glutathione-independent classification
      is not established by a direct biochemical assay.
    supporting_text: The PP0328 gene was annotated as fdhA, whereas the PP3970 gene was called fdhB (Table 1).
  - source_id: UniProtKB:Q88FV8
    title: PSEPK PP_3970 UniProt record
    url: https://rest.uniprot.org/uniprotkb/Q88FV8.txt
    statement: >-
      The current unreviewed record names PP_3970 ybdR and assigns only a
      generic zinc-dependent, NAD(P)-binding oxidoreductase function; it does
      not assign formaldehyde as substrate or state glutathione dependence.
  - source_id: file:PSEPK/frmA/frmA-uniprot.txt
    title: PSEPK FrmA UniProt record
    statement: Q88MF5 is an S-(hydroxymethyl)glutathione dehydrogenase.
  - source_id: UniProtKB:P25437
    title: Reviewed Escherichia coli FrmA UniProt record
    url: https://rest.uniprot.org/uniprotkb/P25437.txt
    statement: >-
      The reviewed E. coli FrmA record reports glutathione-dependent
      formaldehyde dehydrogenase activity, assigns GO:0051903 from direct assay,
      and classifies the protein in PTHR43880:SF12.
  - source_id: file:PSEPK/frmC/frmC-uniprot.txt
    title: PSEPK FrmC UniProt record
    statement: Q88MF4 is an S-formylglutathione hydrolase.
  - source_id: file:interpro/panther/PTHR10061/PTHR10061-metadata.yaml
    title: PANTHER PTHR10061 family metadata
    statement: PTHR10061 is the S-formylglutathione hydrolase family used for the FrmC selector.
  - source_id: file:modules/glutathione_dependent_formaldehyde_detoxification-deep-research-openscientist.md
    title: OpenScientist review of glutathione-dependent formaldehyde detoxification
    statement: >-
      Supports the reusable three-step boundary, spontaneous first step,
      NAD+-biased FrmA oxidation, FrmC-family hydrolysis, and separation from
      glutathione-independent formaldehyde oxidation routes.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__glutathione_dependent_formaldehyde_detoxification__ppu00680-deep-research-openscientist.md
    title: OpenScientist PSEPK pathway satisfiability review
    statement: >-
      Finds the branch satisfiable through adjacent frmA and frmC candidates
      while emphasizing that their exact KT2440 chemistry lacks direct
      enzymology and that PP_3970 belongs outside this defined branch.
  - source_id: PANTHER:PTN000191653
    title: PAINT FrmA-function ancestral node
    statement: >-
      Local PTHR43880 PAINT data place GO:0051903 by IBD at PTN000191653,
      seeded in part by reviewed Escherichia coli FrmA P25437.
  - source_id: PANTHER:PTN000006872
    title: PAINT S-formylglutathione-hydrolase ancestral node
    statement: >-
      Local PTHR10061 PAINT data place GO:0018738 by IBD at PTN000006872,
      seeded in part by reviewed E. coli FrmB P51025 and YeiG P33018.
  - source_id: YeastPathways:PWY-1801-1
    title: formaldehyde oxidation II (glutathione-dependent) (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-1801-1
    statement: YeastCyc lists spontaneous RXN-2961, RXN-2962 (SFA1), S-FORMYLGLUTATHIONE-HYDROLASE-RXN (YJL068C) and 1.2.1.2-RXN (FDH1). All assignments were retained; FDH1 is modelled as an optional downstream formate-oxidation part.
  - source_id: PMID:8483449
    title: Molecular structure and genetic regulation of SFA, a gene responsible for resistance to formaldehyde in Saccharomyces cerevisiae, and characterization of its protein product.
    statement: SFA1 encodes the yeast glutathione-dependent formaldehyde dehydrogenase.
  - source_id: PMID:10427036
    title: Purification and properties of an esterase from the yeast Saccharomyces cerevisiae and identification of the encoding gene.
    statement: YJL068C encodes an S-formylglutathione hydrolase.
    supporting_text: We purified an intracellular esterase that can function as an S-formylglutathione hydrolase from the yeast Saccharomyces cerevisiae.
  - source_id: PMID:11921099
    title: Functional analysis of structural genes for NAD(+)-dependent formate dehydrogenase in Saccharomyces cerevisiae.
    statement: FDH1 and FDH2 encode NAD-dependent formate dehydrogenase; in S288C FDH2 is split into two ORFs, and fdh1 fdh2 mutants lack activity.
  - source_id: PMID:8625422
    title: Overexpression of ADH1 confers hyper-resistance to formaldehyde in Saccharomyces cerevisiae.
    statement: Sfa1 (Adh5) detoxification needs glutathione, whereas ADH1 provides a glutathione-independent reductive route outside this module.
  - source_id: file:yeast/SFA1/SFA1-ai-review.yaml
    title: SFA1 gene review (S. cerevisiae)
    statement: Core functions GO:0051903 (formaldehyde catabolic process) and GO:0080007 S-nitrosoglutathione reductase, cytosol.
  - source_id: file:yeast/YJL068C/YJL068C-ai-review.yaml
    title: YJL068C gene review (S. cerevisiae)
    statement: Core function GO:0018738.
  - source_id: file:yeast/FDH1/FDH1-ai-review.yaml
    title: FDH1 gene review (S. cerevisiae)
    statement: Core function GO:0008863 in formate catabolism.
notes: >-
  The boundary begins with glutathione capture of formaldehyde and ends at formate plus regenerated glutathione. Formate oxidation to carbon dioxide, formaldehyde efflux, DNA repair, protein-quality control, and nitrosothiol reduction are distinct downstream or parallel functions. Organisms can carry additional formaldehyde oxidation routes, so this module represents the glutathione-dependent branch rather than the entire cellular response. In KT2440, PP_3970 has genetic evidence for a contribution to formaldehyde mineralization, but that does not place it in the defined FrmA-FrmC reaction sequence. The literature uses conflicting names and glutathione-dependence assignments for PP_3970, while UniProtKB:Q88FV8 currently assigns only a generic zinc-dependent, NAD(P)-binding oxidoreductase function. Its precise chemistry therefore remains unresolved. The exact contribution of PP_1616/FrmA and PP_1617/FrmC to this branch remains based on homology and should be tested directly. ALIGN (YeastPathways project, 2026-10): the bacterial module was widened to bacteria and eukaryotes. S. cerevisiae SFA1 (P32771) shares PANTHER PTHR43880:SF12 with E. coli FrmA, and YJL068C (P40363) and human ESD share PTHR10061 with FrmB/YeiG. Human ADH5 is in PTHR43880:SF4 and is therefore not listed under the SF12 selector. SFA1 is also the yeast S-nitrosoglutathione reductase; that activity is outside this module. The YeastCyc formate dehydrogenase step (FDH1) was added as an optional part 4, because formate oxidation is not required for formaldehyde detoxification. FDH2 is a pseudogene split into YPL275W/YPL276W in S288C. GO-CAM disagreement: the SGD model attaches SFA1 only to the root molecular_function term in cytoplasm, while GO:0051903 is directly supported. No PomBase model is linked for this group. The KT2440 PP_3970 gap was reclassified as BIOLOGY because its substrate and glutathione dependence need direct enzymology.
