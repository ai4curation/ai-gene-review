id: MODULE:bacterial_mla_intermembrane_phospholipid_transport
title: Bacterial Mla intermembrane phospholipid transport
description: >-
  A species-neutral diderm-bacterial module for phospholipid exchange across
  the cell envelope through an outer-membrane MlaA/VacJ interface, a soluble
  periplasmic MlaC carrier, and an ATP-coupled inner-membrane MlaFEDB complex.
  The module represents the conserved transport architecture without forcing
  a universal retrograde or anterograde net direction.
status: DRAFT
evidence:
  - source_id: GO:0120010
    title: intermembrane phospholipid transfer
    statement: Defines phospholipid transfer between the two membranes of the diderm bacterial envelope.
  - source_id: file:PSEPK/ttg2D/ttg2D-uniprot.txt
    title: PSEPK Ttg2D/MlaC UniProt record
    statement: Q88P91 is a structurally characterized MlaC-family phospholipid-binding protein.
  - source_id: file:PSEPK/mlaF/mlaF-uniprot.txt
    title: PSEPK MlaF UniProt record
    statement: Q88P94 is the ATPase subunit of the MlaFEDB inner-membrane complex.
notes: >-
  Pseudomonas putida KT2440 names the MlaC- and MlaB-equivalent operon products
  Ttg2D and Ttg2E. The module uses their conserved family roles while retaining
  the exact local gene names. Transport direction is deliberately unresolved:
  older annotations describe retrograde removal of outer-membrane
  phospholipids, whereas biochemical and structural literature has supported
  multiple direction models.
