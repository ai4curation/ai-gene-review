  knowledge_gaps:
    - gap_statement: The physiologically dominant net direction of Mla-mediated phospholipid transfer is not universally resolved.
      boundary: Model conserved interfaces and exchange roles without encoding a single retrograde or anterograde connection.
      gap_kind:
        - BIOLOGY
      status: OPEN
      provenance:
        - reference_id: PMID:34873038
          reference_section_type: ABSTRACT
          supporting_text: >-
            Key to the system in driving lipid trafficking is the MlaFEDB
            ATP-binding cassette transporter complex in the IM, but mechanistic
            details, including transport directionality, remain enigmatic.
    - gap_statement: >-
        MlaA proteins occur with and without a canonical lipoprotein signal,
        porin partners vary by lineage, and MlaB's precise effect on MlaF
        stability and ATPase activity remains incompletely resolved (no
        STAS-domain NTP-binding or regulatory activity has been demonstrated
        for MlaB orthologs outside E. coli).
      boundary: >-
