id: MODULE:bacterial_mla_intermembrane_phospholipid_transport
title: Bacterial Mla intermembrane phospholipid transport
description: >-
  Phospholipid exchange between the outer and inner membranes of diderm
  (Gram-negative-type) bacteria by the Mla (maintenance of lipid asymmetry)
  system. Three interfaces are required: an outer-membrane MlaA/VacJ
  lipoprotein, which in characterized enterobacteria sits in a complex with
  trimeric porins and accesses phospholipid in the outer leaflet; a soluble
  periplasmic MlaC carrier that binds phospholipid in a hydrophobic pocket
  and shuttles it between the membranes; and the inner-membrane MlaFEDB ABC
  complex, in which the MlaE permease and the hexameric MCE-domain MlaD ring
  form a continuous lipid pathway energized by MlaF ATP hydrolysis, with the
  STAS-domain MlaB bound to MlaF on the cytoplasmic side. The system keeps
  phospholipid out of the lipopolysaccharide-rich outer leaflet; the module
  represents the conserved transport architecture without forcing a single
  retrograde or anterograde net direction.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:19383799
    title: An ABC transport system that maintains lipid asymmetry in the gram-negative outer membrane.
    statement: >-
      Genetic definition of the Mla pathway in Escherichia coli as a conserved
      multi-compartment system that preserves outer-membrane lipid asymmetry.
    supporting_text: >-
      This highly conserved pathway, which we have termed the Mla pathway for
      its role in preserving OM lipid asymmetry, is composed of at least 6
      proteins and contains at least 1 component in each cellular compartment.
  - source_id: PMID:28388411
    title: Architectures of Lipid Transport Systems for the Bacterial Outer Membrane.
    statement: >-
      Escherichia coli MlaFEDB and MlaA-OmpF complexes both bind MlaC directly,
      and lipid-bound MlaA-porin complexes hand phospholipid to the MlaC pocket;
      MCE-domain transporters are widespread in diderm bacteria.
    supporting_text: >-
      Binding of MlaC to the lipid-bound MlaA-OmpC/OmpF complex results in
      lipid transfer to the hydrophobic pocket of MlaC, where it is protected
      from solvent.
  - source_id: PMID:27529189
    title: Defining key roles for auxiliary proteins in an ABC transporter that maintains bacterial outer membrane lipid asymmetry.
    statement: >-
      Escherichia coli MlaD and MlaB are required for MlaFEDB assembly and
      activity, placing MlaB inside the complex as an accessory subunit.
    supporting_text: >-
      elucidate critical roles for auxiliary proteins, MlaD and MlaB, in the
      assembly and activity of the complex.
  - source_id: PMID:32602838
    title: Structure of MlaFB uncovers novel mechanisms of ABC transporter regulation.
    statement: >-
      The MlaFB crystal structure shows the STAS-domain MlaB bound to the side
      of each MlaF nucleotide-binding domain.
    supporting_text: >-
      one MlaB subunit binds to the side of each of the two MlaF ATPase domains
  - source_id: PMID:39080293
    title: Structure of the MlaC-MlaD complex reveals molecular basis of periplasmic phospholipid transport.
    statement: >-
      Reconstituted transfer from MlaA donor proteoliposomes to MlaFEDB
      acceptor proteoliposomes depends on the MlaC carrier.
    supporting_text: >-
      Readout of transport is reported by the reduction of quenching of NBD
      labelled phosphatidyl glycerol (PE) by Rhodamine-PE after transport from
      donor MlaA containing proteoliposomes to acceptor MlaFEDB
      proteoliposomes by the MlaC chaperone.
  - source_id: PMID:33236984
    title: Structure of bacterial phospholipid transporter MlaFEDB with substrate bound.
    statement: Cryo-EM defines the MlaFEDB architecture and a continuous phospholipid pathway through MlaE and MlaD.
    supporting_text: >-
      A continuous transport pathway extends from the MlaE
      substrate-binding site, through the channel of MlaD, and into the periplasm.
  - source_id: PMID:33837253
    title: The Pseudomonas aeruginosa substrate-binding protein Ttg2D functions as a general glycerophospholipid transporter across the periplasm.
    statement: Direct work on a Pseudomonas Ttg2D ortholog establishes a soluble periplasmic glycerophospholipid carrier.
    supporting_text: >-
      In Pseudomonas aeruginosa, Ttg2D is the soluble periplasmic phospholipid-binding
      component of an ABC transport system thought to be involved in maintaining the
      asymmetry of the outer membrane.
  - source_id: PMID:34873038
    title: ATP disrupts lipid-binding equilibrium to drive retrograde transport critical for bacterial outer membrane asymmetry.
    statement: Reconstituted transfer assays support ATP-enhanced retrograde transport while also detecting spontaneous bidirectional exchange.
    supporting_text: >-
      We further demonstrate that spontaneous PL transfer also occurs from
      MlaFEDB to MlaC, but such anterograde movement is instead abolished by ATP
      hydrolysis.
  - source_id: GO:0120010
    title: intermembrane phospholipid transfer
    statement: Defines phospholipid transfer between the two membranes of the diderm bacterial envelope.
  - source_id: file:PSEPK/ttg2D/ttg2D-uniprot.txt
    title: PSEPK Ttg2D/MlaC UniProt record
    statement: Q88P91 is a structurally characterized MlaC-family phospholipid-binding protein.
  - source_id: file:PSEPK/mlaF/mlaF-uniprot.txt
    title: PSEPK MlaF UniProt record
    statement: Q88P94 is the ATPase subunit of the MlaFEDB inner-membrane complex.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_mla_intermembrane_phospholipid_transport__ppu02010-deep-research-openscientist.md
    title: OpenScientist PSEPK Mla pathway satisfiability research
    statement: >-
      Supports complete coverage by PP_0958-PP_0962 plus unlinked VacJ
      PP_2163, while distinguishing the PP_0140-PP_0142 Mce-like system and
      unresolved PP_1737 MlaA-family paralog from the core Mla route.
  - source_id: file:modules/bacterial_mla_intermembrane_phospholipid_transport-deep-research-openscientist.md
    title: OpenScientist generic Mla module research
    statement: >-
      Supports the three-interface boundary, direction-neutral architecture,
      MlaB accessory role, MlaA lineage variation, and separation from
      parallel phospholipase-based outer-membrane repair.
notes: >-
  Taxonomic scope. The Mla system is conserved across diderm Proteobacteria
  and beyond; every leaf is grounded with two exemplars from different
  orders: the experimentally defined Escherichia coli K-12 system (MlaA,
  MlaB, MlaC, MlaD, MlaE, MlaF; the genetic, biochemical and structural
  reference, and the PAINT seed for every PANTHER node used here) and the
  Pseudomonas putida KT2440 system (VacJ, Ttg2E, Ttg2D, MlaD, MlaE, MlaF),
  whose legacy toluene-tolerance names Ttg2D and Ttg2E correspond to the
  MlaC and MlaB roles by domain, orthology and contiguous operon context.
  The scope is deliberately bacterial. MlaE (PTHR30188:SF4) and MlaF
  (PTHR43023) families also contain the plant chloroplast TGD1 and TGD3
  proteins, which with the MCE protein TGD2 move lipids from the ER into
  the plastid; that is a different organelle process and is not modeled
  here. Mycobacterial Mce/YrbE systems share MCE and permease folds but
  import lipids such as cholesterol and fatty acids across a different
  envelope; shared MlaF/E/D-like domains alone therefore do not assign a
  protein to this module (P. putida PP_0140-PP_0142 are such a separate
  Mce-like system, and PP_1737 is a second MlaA-family protein without the
  canonical VacJ assignment; neither is counted as a duplicate core
  component). Transport direction is deliberately unresolved: reconstituted
  biochemistry favors ATP-driven retrograde (outer-to-inner membrane)
  transport, but anterograde models have been published and direction may
  vary with context. OmpC/OmpF are the characterized porin partners of E.
  coli MlaA rather than a universally required named porin in every
  lineage, so the porin is not modeled as a separate required part.
