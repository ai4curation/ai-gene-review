id: MODULE:bacterial_type_vi_secretion_apparatus
title: Bacterial type VI secretion apparatus
description: >-
  A contractile bacterial secretion nanomachine assembled from an envelope-spanning
  membrane complex, a cytoplasmic baseplate, an Hcp tube surrounded by a TssBC
  sheath, a VgrG puncturing tip, and the ClpV ATPase that recycles contracted sheath.
  Cargo effectors, cognate immunity proteins, cargo-specific adapters, and global
  transcriptional regulation are outside this conserved structural boundary.
status: DRAFT
evidence:
  - source_id: GO:0033103
    title: protein secretion by the type VI secretion system
    statement: GO process represented by the assembled apparatus.
  - source_id: GO:0033104
    title: type VI protein secretion system complex
    statement: GO cellular-component term represented by the assembled structural subunits.
  - source_id: PMID:36748579
    title: Transcriptional organization and regulation of the Pseudomonas putida K1 type VI secretion system gene cluster.
    statement: >-
      Figure 2a presents the KT2440 K1 structural- and vgrG-operon maps; the
      accompanying text experimentally establishes their transcriptional
      organization and distinguishes the structural apparatus from adapters,
      effectors, and immunity proteins.
notes: >-
  The reusable core contains TssJLM, TssEFGK, TssA, Hcp/TssD, TssBC, VgrG, and
  ClpV/TssH. PMID:36748579 Figure 2a presents the KT2440 K1 locus map, while
  Table S4 supports only the intergenic-distance analysis. Figure 2a, the
  promoter/operon text, and the exact UniProt family records jointly support
  PP_3088=tssA1, PP_3089=hcp1/tssD1, PP_3090=tagP1,
  PP_5561=tagF1, PP_3091=tssM1, PP_3092=tssL1, PP_3093=tssK1,
  PP_3094=tssJ1, PP_3095=clpV1/tssH1, PP_3096=tssG1, PP_3097=tssF1,
  PP_3098=tssE1, PP_3099=tssC1, PP_3100=tssB1, and PP_5562=tagB1.
  TagP1 and TagB1 are K1 accessory stabilizers and TagF1 is a post-translational
  regulator, so none is required by the conserved apparatus core. VgrG1 is encoded
  in the adjacent divergent operon but is retained here as the conserved tip;
  K1-specific adapters, effectors, and immunity proteins are excluded.
