id: MODULE:bacterial_type_vi_secretion_apparatus
title: Bacterial type VI secretion apparatus
description: >-
  A contractile bacterial secretion nanomachine assembled from an envelope-spanning
  membrane complex, a cytoplasmic baseplate, an Hcp tube surrounded by a TssBC
  sheath, a VgrG puncturing tip, and the ClpV ATPase that recycles contracted sheath.
  Cargo effectors, cognate immunity proteins, cargo-specific adapters, and global
  transcriptional regulation are outside this conserved structural boundary.
status: DRAFT
evidence:
  - source_id: GO:0033103
    title: protein secretion by the type VI secretion system
    statement: GO process represented by the assembled apparatus.
  - source_id: GO:0033104
    title: type VI protein secretion system complex
    statement: GO cellular-component term represented by the assembled structural subunits.
  - source_id: PMID:36748579
    title: Transcriptional organization and regulation of the Pseudomonas putida K1 type VI secretion system gene cluster.
    statement: >-
      Figure 2a presents the KT2440 K1 structural- and vgrG-operon maps; the
      accompanying text experimentally establishes their transcriptional
      organization and distinguishes the structural apparatus from adapters,
      effectors, and immunity proteins.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_type_vi_secretion_apparatus__ppu03070-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu03070 type VI secretion satisfiability review
    statement: >-
      The species/pathway/taxon report confirms that the K1 apparatus satisfies
      the reusable core and separates it from the other secretion systems in
      the broad ppu03070 bucket. Its proposed PP_3090/PP_3091 split-TssM
      interpretation is not adopted because direct locus and architecture
      evidence identify PP_3090 as the TagP1 accessory and PP_3091 as TssM1.
  - source_id: PMID:26200339
    title: Biogenesis and structure of a type VI secretion membrane core complex.
    statement: Establishes the TssJLM trans-envelope membrane-complex architecture.
  - source_id: PMID:26460929
    title: The Type VI Secretion TssEFGK-VgrG Phage-Like Baseplate Is Recruited to the TssJLM Membrane Complex via Multiple Contacts and Serves As Assembly Platform for Tail Tube/Sheath Polymerization.
    statement: >-
      Establishes the membrane-complex, baseplate/spike, and tail assembly
      hierarchy and the TssEFGK-VgrG interaction network.
  - source_id: PMID:28947741
    title: Cryo-EM structure of the extended type VI secretion system sheath-tube complex.
    statement: Resolves the extended TssBC sheath around the Hcp tube and its contraction-coupled remodeling.
  - source_id: PMID:23289512
    title: ClpV recycles VipA/VipB tubules and prevents non-productive tubule formation to ensure efficient type VI protein secretion.
    statement: Establishes the ATPase-dependent recycling role of ClpV after sheath contraction.
notes: >-
  The conserved apparatus boundary contains TssJLM, TssEFGK, TssA, Hcp/TssD,
  TssBC, VgrG, and ClpV/TssH. System-specific stabilizers, post-translational
  regulators, adapters, cargo effectors, and immunity proteins are excluded.
  The PSEPK K1 realization, including its TagP1, TagB1, and TagF1 accessories,
  is documented in the corresponding project batch rather than encoded as a
  universal property of this module.
