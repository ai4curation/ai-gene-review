id: MODULE:cytotoxic_granule_exocytosis
title: Cytotoxic granule exocytosis module
description: >-
  Delivery of the killing machinery of a cytotoxic lymphocyte onto one target cell.
  Perforin, the granzymes and granulysin are not secreted when they are made: they
  are loaded into a secretory lysosome, held there, and released only when the cell
  meets a target, at the immunological synapse and nowhere else. The granule is
  carried to the synapse by RAB27A, docked and primed by Munc13-4 (UNC13D), and
  fused with the plasma membrane by syntaxin-11 with its partner Munc18-2 (STXBP2).
  Perforin then forms pores in the target membrane through which the granzymes
  reach its cytosol. Human loss-of-function in each step causes the same disease,
  familial hemophagocytic lymphohistiocytosis, which is how the parts list was
  established.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: PMID:14622600
  statement: Granule content release at the immunological synapse is a regulated multi-step
    process of transfer, docking and fusion.
  supporting_text: Secretion of cytolytic granules content at the immunological synapse is a highly
    regulated process essential for lymphocyte cytotoxicity. This process requires the rapid transfer
    of perforin containing lytic granules to the target cell interface, followed by their docking and
    fusion with the plasma membrane.
- source_id: PMID:19884660
  statement: The genes mutated in familial hemophagocytic lymphohistiocytosis all encode
    proteins of this one pathway.
  supporting_text: These genes all encode proteins involved in the cytotoxic activity of lymphocytes.
notes: >-
  Built for projects/PRODUCTION_TERMS.md. The curated classification marks the
  perforin, granzyme A, granzyme B and granulysin production terms (4 production,
  6 regulation) as resting on dedicated machinery, and this is it. These four
  products share one storage and release machine, which is the argument against
  giving each of them its own production term: nothing in the route is specific to
  any one of them.
  Boundary: starts with a loaded granule and ends with pore formation in the target
  membrane. Granule biogenesis from the endolysosomal system, and the synapse
  formation that positions the cell, are upstream and are not modelled here;
  granzyme action on target substrates is downstream, and cached Reactome events
  such as R-HSA-139893 cover it.
  LYST and MYO5A are deliberately excluded. LYST mutations (Chediak-Higashi)
  change granule size rather than the release steps modelled here, and MYO5A is
  the control that shows the pathway's boundary: it causes the same pigmentary
  disease as RAB27A but not the immune one, and MYO5A-defective T cells kill
  normally.
  No cached GO-CAM has an activity on any of these proteins in this role, so there
  are no pins.
module:
  id: cytotoxic_granule_exocytosis
  label: Cytotoxic granule exocytosis
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Transport of the granule to the synapse, then docking and priming, then fusion,
    then pore formation in the target. Each step was mapped by a human deficiency
    that abolishes killing while leaving the granule contents intact.
  concepts:
  - preferred_term: natural killer cell degranulation
    term:
      id: GO:0043320
      label: natural killer cell degranulation
  - preferred_term: regulated exocytosis
    term:
      id: GO:0045055
      label: regulated exocytosis
  context:
    taxa:
    - preferred_term: mammals
      term:
        id: NCBITaxon:40674
        label: Mammalia
    cell_types:
    - preferred_term: cytotoxic T cell or natural killer cell
      description: >-
        The module is shared by CD8 cytotoxic T lymphocytes and NK cells; the
        granule and the release machinery are the same in both, which is why one
        mutation disables both.
  knowledge_gaps:
  - gap_statement: >-
      How the granule contents cross from the synaptic cleft into the target cell is
      not settled. Perforin pores in the plasma membrane are the classical route, but
      an endosomal route, in which perforin acts on the endosome membrane after
      granzymes are taken up, has also been argued, and the two make different
      predictions about what a perforin-deficient cell can still do.
    boundary: >-
      Affects the last step of this module: whether pore formation happens at the
      plasma membrane of the target or inside it.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      It determines whether perforin is a delivery device or a killing agent in its
      own right, and so what a partial perforin deficiency should look like.
    resolution: >-
      Follow labelled granzyme and perforin in the same target cell with enough time
      resolution to say which membrane is breached first.
  - gap_statement: >-
      Whether granulysin is released by the same machinery as perforin and the
      granzymes is assumed rather than shown. It is stored in the same granules, but
      no human deficiency isolates its release, and it is absent from mouse, so the
      genetics that mapped the rest of this pathway cannot speak to it.
    boundary: Affects whether granulysin belongs in the cargo list of this module.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      Granulysin kills intracellular bacteria rather than host cells, so a separate
      release route would mean a separate effector arm.
    resolution: >-
      Test granulysin release in cells from patients lacking RAB27A, Munc13-4 or
      syntaxin-11, against perforin release in the same cells.
  parts:
  - order: 1
    role: granule transport to the synapse
    node:
      id: granule_transport
      label: RAB27A-dependent transport of the granule to the synapse
      module_type: TRANSPORT_STEP
      description: >-
        The loaded granule is moved to the interface with the target cell. RAB27A is
        the step's marker: without it T cells have normal granules but reduced
        cytotoxicity and reduced granule exocytosis.
      annotons:
      - id: rab27a_granule_transport
        label: RAB27A granule GTPase
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: RAB27A
            term:
              id: UniProtKB:P51159
              label: Ras-related protein Rab-27A
        function:
          preferred_term: GTPase activity
          term:
            id: GO:0003924
            label: GTPase activity
          description: >-
            The GTP-bound form marks the granule for the synapse-directed step; the
            activity asserted is the GTPase cycle rather than motor activity, which
            belongs to the motors it recruits.
        locations: &granule
        - preferred_term: cytolytic granule
          term:
            id: GO:0044194
            label: cytolytic granule
        processes: &killing
        - preferred_term: T cell mediated cytotoxicity
          term:
            id: GO:0001913
            label: T cell mediated cytotoxicity
        role_description: >-
          Key effector of the exocytosis route, and the point where the immune and
          pigmentary arms of Griscelli syndrome separate.
        evidence:
        - source_id: PMID:10835631
          statement: RAB27A-deficient T cells show reduced cytotoxicity and reduced cytolytic
            granule exocytosis, where MYO5A-defective T cells do not.
          supporting_text: >-
            In addition, RAB27A-deficient T cells exhibited reduced cytotoxicity and cytolytic granule
            exocytosis, whereas MYO5A-defective T cells did not.
        - source_id: PMID:10835631
          statement: RAB27A is described as a key effector of cytotoxic granule exocytosis.
          supporting_text: RAB27A appears to be a key effector of cytotoxic granule exocytosis
  - order: 2
    role: docking and priming
    node:
      id: granule_docking_priming
      label: Munc13-4-dependent docking and priming
      module_type: REGULATORY_STEP
      description: >-
        The granule is held against the plasma membrane and made fusion-competent.
        Munc13-4 deficiency (FHL3) leaves granules that reach the synapse but do not
        fuse, which is what separates this step from transport.
      annotons:
      - id: unc13d_priming
        label: Munc13-4 granule priming factor
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: UNC13D
            term:
              id: UniProtKB:Q70J99
              label: Protein unc-13 homolog D
        function:
          preferred_term: calcium-dependent phospholipid binding
          term:
            id: GO:0005544
            label: calcium-dependent phospholipid binding
          description: >-
            Munc13 proteins use C2 domains to engage membrane phospholipids in a
            calcium-dependent way, which couples the calcium signal of target
            recognition to fusion competence.
        locations: *granule
        processes: *killing
        role_description: >-
          Makes docked granules fusion-competent; its loss abolishes killing without
          abolishing the granule or its contents.
        evidence:
        - source_id: PMID:14622600
          statement: Munc13-4 is essential for cytolytic granule fusion and is mutated in FHL3.
          supporting_text: >-
            Munc13-4 is essential for cytolytic granules fusion and is mutated in a form of familial
            hemophagocytic lymphohistiocytosis
        - source_id: PMID:14622600
          statement: The step requires transfer to the interface followed by docking and fusion.
          supporting_text: followed by their docking and fusion with the plasma membrane
  - order: 3
    role: membrane fusion
    node:
      id: granule_fusion
      label: Syntaxin-11 and Munc18-2 dependent fusion
      module_type: REGULATORY_STEP
      description: >-
        The primed granule fuses with the plasma membrane and empties into the
        synaptic cleft. Syntaxin-11 is the SNARE and Munc18-2 its partner; losing
        either causes FHL, so the two act as one unit.
      annotons:
      - id: stx11_snare
        label: Syntaxin-11 SNARE
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: STX11
            term:
              id: UniProtKB:O75558
              label: Syntaxin-11
        processes:
        - preferred_term: vesicle fusion
          term:
            id: GO:0006906
            label: vesicle fusion
        locations: &plasma_membrane
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: >-
          The SNARE of this fusion step. No molecular function is asserted: GO has no
          live generic SNARE term under that name, and asserting syntaxin binding
          would describe its partner's side of the interaction rather than its own
          role.
        evidence:
        - source_id: PMID:15703195
          statement: A homozygous STX11 deletion defines the FHL4 locus in a consanguineous
            kindred.
          supporting_text: we identified a homozygous deletion of 5 bp in the syntaxin 11 gene (STX11)
        - source_id: PMID:15703195
          statement: FHL is characterised by defects in natural killer cell function.
          supporting_text: Familial hemophagocytic lymphohistiocytosis (FHL) is a rare autosomal recessive
            disorder characterized by hyperactive phagocytes and defects in natural killer cell function.
      - id: stxbp2_snare_partner
        label: Munc18-2 syntaxin partner
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: STXBP2
            term:
              id: UniProtKB:Q15833
              label: Syntaxin-binding protein 2
        function:
          preferred_term: syntaxin binding
          term:
            id: GO:0019905
            label: syntaxin binding
          targets:
          - preferred_term: STX11
            term:
              id: UniProtKB:O75558
              label: Syntaxin-11
        processes: *killing
        locations: *plasma_membrane
        role_description: >-
          Binds and stabilises syntaxin-11; its deficiency impairs granule exocytosis
          in patient NK cells, which is why the pair is modelled as one step.
        evidence:
        - source_id: PMID:19884660
          statement: STXBP2 (Munc18-2) is mutated in FHL5 and its loss impairs cytotoxic granule
            exocytosis in patient NK cells.
          supporting_text: >-
            Munc18-2 deficiency causes familial hemophagocytic lymphohistiocytosis type 5 and impairs
            cytotoxic granule exocytosis in patient NK cells
  - order: 4
    role: delivery into the target cell
    node:
      id: perforin_pore_delivery
      label: Perforin pore formation and granzyme delivery
      module_type: REGULATORY_STEP
      description: >-
        Perforin oligomerises in the target membrane and opens it, letting the
        granzymes reach the target cytosol. This is where the module's cargo becomes
        an effect, and the only step whose membrane target is another cell.
      annotons:
      - id: prf1_pore
        label: Perforin pore former
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: PRF1
            term:
              id: UniProtKB:P14222
              label: Perforin-1
        function:
          preferred_term: pore-forming activity
          term:
            id: GO:0140911
            label: pore-forming activity
          description: Inserts into the target cell membrane and oligomerises into transmembrane
            pores.
        locations: *plasma_membrane
        processes: *killing
        role_description: >-
          The delivery device for the granzymes, and the gene whose mutation defined
          FHL2 and so the whole pathway.
        evidence:
        - source_id: PMID:10583959
          statement: FHL patients carry homozygous perforin mutations and their lymphocytes have
            defective cytotoxic activity.
          supporting_text: >-
            Sequencing of the coding regions of the perforin gene of eight unrelated 10q21-22-linked
            FHL patients revealed homozygous nonsense mutations in four patients and missense mutations
            in the other four patients. Cultured lymphocytes from patients had defective cytotoxic
            activity
      - id: granule_protease_cargo
        label: Granule serine protease cargo
        participant:
          selector_type: FAMILY
          family:
            preferred_term: granzyme
            description: >-
              The granule serine proteases that enter the target cytosol through the
              perforin pore and cleave its substrates. Granzymes A and B are the ones
              whose production terms this module accounts for.
            representative_members:
            - preferred_term: GZMA
              term:
                id: UniProtKB:P12544
                label: Granzyme A
            - preferred_term: GZMB
              term:
                id: UniProtKB:P10144
                label: Granzyme B
        function:
          preferred_term: serine-type endopeptidase activity
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
          description: >-
            Cleaves target-cell substrates once delivered. The activity is the
            granzyme's own; what this module contributes is getting it to the
            substrate.
        locations: *granule
        role_description: >-
          The cargo. Its own production terms are what this module explains: the
          granzymes share this route with perforin and granulysin, so none of them
          has release machinery of its own.
        evidence:
        - source_id: PMID:14622600
          statement: The granules whose release this module describes are the perforin-containing
            lytic granules.
          supporting_text: the rapid transfer of perforin containing lytic granules to the target cell
            interface
      - id: granule_maturation_protease
        label: Cathepsin C granzyme activator
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: CTSC
            term:
              id: UniProtKB:P53634
              label: Dipeptidyl peptidase 1
        function:
          preferred_term: dipeptidyl-peptidase activity
          term:
            id: GO:0008239
            label: dipeptidyl-peptidase activity
          description: >-
            Removes the activation dipeptide from granzyme proenzymes inside the
            granule, so the cargo is stored active rather than activated on release.
          substrates:
          - preferred_term: GZMB
            term:
              id: UniProtKB:P10144
              label: Granzyme B
        locations: *granule
        role_description: >-
          A maturation step inside the granule rather than part of release; included
          because it is why the stored cargo is competent the moment it is delivered.
        evidence:
        - source_id: PMID:14622600
          statement: The granules are loaded with perforin before the release steps modelled
            here.
          supporting_text: perforin containing lytic granules
  connections:
  - source: granule_transport
    target: granule_docking_priming
    connection_type: PRECEDES
    description: A granule must reach the synapse before it can be docked there.
    chaining_status: NOT_APPLICABLE
    chaining_note: A vesicle-trafficking chain, not a metabolic one, so the CoA continuity
      check does not apply.
  - source: granule_docking_priming
    target: granule_fusion
    connection_type: PRECEDES
    description: Priming is what makes the docked granule fusion-competent.
    chaining_status: NOT_APPLICABLE
    chaining_note: Trafficking step, not a metabolic one.
  - source: granule_fusion
    target: perforin_pore_delivery
    connection_type: PRECEDES
    description: Fusion empties the granule into the cleft, where perforin meets the target
      membrane.
    chaining_status: NOT_APPLICABLE
    chaining_note: Trafficking step, not a metabolic one.
