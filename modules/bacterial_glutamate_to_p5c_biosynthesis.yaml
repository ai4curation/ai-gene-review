- source_id: file:genes/ECOLI/proA/proA-ai-review.yaml
  title: ECOLI proA gene review
  statement: The completed E. coli proA review grounds ProA as the cytosolic gamma-glutamyl phosphate
    reductase that catalyzes the second step in the glutamate-to-P5C branch.
- source_id: file:interpro/panther/PTHR43654/PTHR43654-paint.tsv
  title: PAINT assertions for the glutamate 5-kinase family
  statement: PTN000115542 carries an IBD assertion for GO:0004349 and is seeded by experimentally characterized
    E. coli P0A7B5.
- source_id: file:interpro/panther/PTHR11063/PTHR11063-paint.tsv
  title: PAINT assertions for the glutamate semialdehyde dehydrogenase family
  statement: PTN000115463 carries an IBD assertion for GO:0004350 and is seeded by experimentally characterized
    E. coli P07004.
- source_id: PMID:25367752
  title: 'Evolution of proline biosynthesis: enzymology, bioinformatics, genetics, and transcriptional
    regulation.'
  statement: Split ProB/ProA chemistry is evolutionarily widespread but not universal; alternative ornithine
    routes can supply proline.
- source_id: PMID:26443591
  title: Biosynthesis of Proline.
  statement: Glutamyl kinase uses ATP to activate glutamate and gamma-glutamyl phosphate reductase uses
    NADPH to reduce the intermediate.
- source_id: PMID:39514317
  title: 'Challenging a decades-old paradigm: ProB and ProA do not channel the unstable intermediate in
    proline synthesis after all.'
  statement: Proline synthesis persists after changes expected to prevent a specific ProB–ProA interface,
    arguing against obligatory channeling.
- source_id: PMID:21784929
  title: Osmotically controlled synthesis of the compatible solute proline is critical for cellular defense
    of Bacillus subtilis against high osmolarity.
  statement: The anabolic ProB route and osmoadaptive ProJ route share ProA.
- source_id: PMID:8755867
  title: 'Mutations in the Corynebacterium glutamicum proline biosynthetic pathway: a natural bypass of
    th proA step.'
  statement: Corynebacterium proB and proA contribute to the canonical glutamate route.
- source_id: PMID:37511294
  title: Investigating the Prevalence of RNA-Binding Metabolic Enzymes in E. coli.
  statement: Specific in-vitro RNA binding by E. coli ProB contradicts a blanket family-wide claim that
    no member binds RNA.
- source_id: PMID:8083159
  title: Multiple copies of the proB gene enhance degS-dependent extracellular protease production in
    Bacillus subtilis.
  statement: The cloned Bacillus proB region is followed closely by proA, consistent with an anabolic
    operon.
notes: The Bacteria scope describes the split-enzyme route where present, not universal possession or
  exclusivity. The nine member proteins represent Pseudomonadota, Bacillota and Actinomycetota. Fungi
  and some archaea also use split enzymes, but lie outside this bacterial module; fused plant/animal P5CS
  is a different architecture. In Bacillus, ProB and ProJ are alternative kinases feeding a shared ProA.
  Their anabolic versus osmoadaptive regulation does not define different chemical steps. The 2011 Bacillus
  genetics used JH642 derivatives rather than the strain-168 reference proteins; the 1996 Corynebacterium
  study used ATCC17965 rather than the ATCC13032 reference proteins. Curated HAMAP assignments support
  those reference proteins, and the strain differences remain explicit in their reviews. ProJ feedback
  resistance is a physiological hypothesis in the 2011 paper, not a measured inhibition constant. Residual
  growth and asd complementation of a Corynebacterium proA mutant indicate a possible bypass, so absence
  of a canonical family is not proof that a cell cannot form P5C. PMID:39514317 challenges obligatory
  ProB–ProA substrate channeling in E. coli; a transient complex is not required by this module, and neither
  a negative pulldown alone nor that E. coli study is treated as a universal absence result. The kinase
  PANTHER family includes divergent isopentenyl phosphate kinases in SF1, while SF3 includes bacteria,
  archaea, fungi and protists. PTHR11063 includes monofunctional ProA and fused P5CS. Thus family membership
  must be combined with the specified activity and split-polypeptide architecture. No new PAINT placement
  is inferred from the donor list or from GOA nodes missing in the committed tree slice. RNA binding shown
  for E. coli ProB in 2023 is not a required pathway activity and is not transferred to all PUA-containing
  family members. The PSEPK KEGG carbapenem-bucket label is historical partition provenance, not evidence
  for carbapenem synthesis by this pair.
