id: MODULE:bacterial_glutamate_to_p5c_biosynthesis
title: Bacterial glutamate-to-P5C branch of proline biosynthesis
description: 'Bacterial split-enzyme conversion of L-glutamate to L-glutamate 5-semialdehyde: a ProB-family
  kinase, including the Bacillus ProJ paralog, phosphorylates glutamate with ATP, and ProA reduces L-glutamyl
  5-phosphate with NADPH. Spontaneous cyclization yields pyrroline-5-carboxylate (P5C). The module ends
  before ProC-type P5C reduction to proline and does not require a ProB–ProA complex.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0055129
  title: L-proline biosynthetic process
  statement: GO:0055129 captures the proline-biosynthetic context for ProB and ProA.
- source_id: file:PSEPK/proB/proB-uniprot.txt
  title: UniProtKB entry for PSEPK proB
