    description: ProB produces L-glutamyl 5-phosphate, the substrate reduced by ProA to L-glutamate 5-semialdehyde/P5C.
    chaining_status: VERIFIED
    chaining_note: UniProt pathway annotations place PSEPK ProB and ProA as steps 1/2 and 2/2 of L-glutamate-5-semialdehyde
      formation from L-glutamate.
  knowledge_gaps:
  - gap_statement: It is not established whether bacterial ProB and ProA form a stable or transient complex
      that channels the labile L-glutamyl 5-phosphate intermediate, or simply act at high local concentration.
    boundary: Applies to the PROVIDES_INPUT_FOR hand-off between the ProB and ProA steps; the eukaryotic
      fused P5C synthase solves the same problem intramolecularly and is outside this module.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: Free glutamyl 5-phosphate hydrolyzes or cyclizes to 5-oxoproline, so the mode of coupling
      determines how the two steps should be modeled (two independent enzymes versus an obligate enzyme
      pair). The direct experimental hint of a kinase-reductase complex comes from yeast (PMID:12513997,
      S. cerevisiae Pro1 and Pro2), whose split enzymes are orthologous to bacterial ProB and ProA; for
      the bacterial pair the evidence is mainly inferred from intermediate chemistry and operon linkage.
    resolution: Co-purification or crosslinking of ProB with ProA at native levels, together with transient-time
      or competing-enzyme kinetics showing intermediate transfer without equilibration with bulk solvent.
    provenance:
    - reference_id: file:modules/bacterial_glutamate_to_p5c_biosynthesis-deep-research-openscientist.md
      supporting_text: Whether bacterial ProB and ProA form a stable complex, a transient encounter complex,
        or simply operate at high local concentration remains only partly resolved
      reference_section_type: DISCUSSION
    - reference_id: PMID:12513997
      supporting_text: both of which catalyze the first two steps of l -proline synthesis from l -glutamate
        and which together may form a complex in vivo
      reference_section_type: ABSTRACT
references:
- id: PMID:25367752
  title: 'Evolution of proline biosynthesis: enzymology, bioinformatics, genetics, and transcriptional
    regulation.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review, cached abstract and publisher full text read. Separates widespread
      glutamate route, fused eukaryotic P5CS and alternative ornithine routes. Older channeling interpretations
      are qualified by the 2024 primary study.
  findings:
  - statement: Split ProB/ProA chemistry is evolutionarily widespread but not universal; alternative ornithine
      routes can supply proline.
  - statement: Plant and animal P5CS joins kinase and reductase activities that are separate in the bacterial
      route.
- id: PMID:26443591
  title: Biosynthesis of Proline.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Enzymology review; cached abstract available. Used for reaction and feedback context,
      not as proof of obligatory physical channeling.
  findings:
  - statement: Glutamyl kinase uses ATP to activate glutamate and gamma-glutamyl phosphate reductase uses
      NADPH to reduce the intermediate.
  - statement: Proline feedback inhibition regulates kinase activity but does not justify identical regulation
      of every paralog.
- id: PMID:39514317
  title: 'Challenging a decades-old paradigm: ProB and ProA do not channel the unstable intermediate in
    proline synthesis after all.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. Structural perturbations, activity assays and diffusion calculations
      address E. coli split enzymes; conclusions are not generalized to fused P5CS filaments.
  findings:
  - statement: Proline synthesis persists after changes expected to prevent a specific ProB–ProA interface,
      arguing against obligatory channeling.
  - statement: The calculated intermediate lifetime permits diffusion across an E. coli cell before most
      intermediate cyclizes to a dead-end product.
- id: PMID:21784929
  title: Osmotically controlled synthesis of the compatible solute proline is critical for cellular defense
    of Bacillus subtilis against high osmolarity.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. Most experimental strains are JH642 derivatives, distinct from
      strain168 reference entries. Genetics supports alternative ProB/ProJ kinase routes converging on
      ProA; feedback resistance of ProJ is argued, not directly measured.
  findings:
  - statement: The anabolic ProB route and osmoadaptive ProJ route share ProA.
  - statement: proHJ disruption impairs osmoadaptive proline production, whereas proA disruption also
      causes proline auxotrophy.
- id: PMID:8755867
  title: 'Mutations in the Corynebacterium glutamicum proline biosynthetic pathway: a natural bypass of
    th proA step.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read; full text not recovered. ATCC17965 mutant/complementation findings
      are a species comparison for ATCC13032, not an exact-strain enzyme assay.
  findings:
  - statement: Corynebacterium proB and proA contribute to the canonical glutamate route.
  - statement: Residual growth of proA-null mutants and complementation by asd suggest an alternative
      source of the reductive step.
- id: PMID:37511294
  title: Investigating the Prevalence of RNA-Binding Metabolic Enzymes in E. coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text read. K12 ASKA ProB was recloned for protein purification; positive
      ProB evidence is SELEX and competition EMSA, not iCLIP. Weak affinity, unresolved binding site and
      unproven physiological effect constrain interpretation.
  findings:
  - statement: Specific in-vitro RNA binding by E. coli ProB contradicts a blanket family-wide claim that
      no member binds RNA.
  - statement: RNA binding is not required to represent either proline-biosynthetic reaction and is not
      established for the other exemplars.
- id: PMID:8083159
  title: Multiple copies of the proB gene enhance degS-dependent extracellular protease production in
    Bacillus subtilis.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached abstract read; UniProt identifies strain168 and flags discrepancies in its original
      reported sequence. Multicopy exoprotease effects are not evidence that ProB directly catalyzes proteolysis
      or binds the regulator.
  findings:
  - statement: The cloned Bacillus proB region is followed closely by proA, consistent with an anabolic
      operon.
  - statement: The proposed signal from a biosynthetic intermediate to DegS remains a mechanistic interpretation
      of multicopy phenotypes.
