  connections:
    - source: prob_glutamate_5_kinase_step
      target: proa_gamma_glutamyl_phosphate_reductase_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        ProB produces L-glutamyl 5-phosphate, the substrate reduced by ProA to
        L-glutamate 5-semialdehyde/P5C.
      chaining_status: VERIFIED
      chaining_note: >-
        UniProt pathway annotations place PSEPK ProB and ProA as steps 1/2 and
        2/2 of L-glutamate-5-semialdehyde formation from L-glutamate.
  knowledge_gaps:
    - gap_statement: >-
        It is not established whether bacterial ProB and ProA form a stable or
        transient complex that channels the labile L-glutamyl 5-phosphate
        intermediate, or simply act at high local concentration.
      boundary: >-
        Applies to the PROVIDES_INPUT_FOR hand-off between the ProB and ProA
        steps; the eukaryotic fused P5C synthase solves the same problem
        intramolecularly and is outside this module.
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: >-
        Free glutamyl 5-phosphate hydrolyzes or cyclizes to 5-oxoproline, so
        the mode of coupling determines how the two steps should be modeled
        (two independent enzymes versus an obligate enzyme pair). The direct
        experimental hint of a kinase-reductase complex comes from yeast
        (PMID:12513997, S. cerevisiae Pro1 and Pro2), whose split enzymes are
        orthologous to bacterial ProB and ProA; for the bacterial pair the
        evidence is mainly inferred from intermediate chemistry and operon
        linkage.
      resolution: >-
        Co-purification or crosslinking of ProB with ProA at native levels,
        together with transient-time or competing-enzyme kinetics showing
        intermediate transfer without equilibration with bulk solvent.
      provenance:
        - reference_id: file:modules/bacterial_glutamate_to_p5c_biosynthesis-deep-research-openscientist.md
          supporting_text: >-
            Whether bacterial ProB and ProA form a stable complex, a transient
            encounter complex, or simply operate at high local concentration
            remains only partly resolved
          reference_section_type: DISCUSSION
        - reference_id: PMID:12513997
          supporting_text: >-
            both of which catalyze the first two steps of l -proline synthesis
            from l -glutamate and which together may form a complex in vivo
          reference_section_type: ABSTRACT
