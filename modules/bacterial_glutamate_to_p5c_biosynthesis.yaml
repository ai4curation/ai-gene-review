id: MODULE:bacterial_glutamate_to_p5c_biosynthesis
title: Bacterial glutamate-to-P5C branch of proline biosynthesis
description: >-
  Species-neutral bacterial module for the two-enzyme conversion of
  L-glutamate to L-glutamate 5-semialdehyde, which cyclizes to
  1-pyrroline-5-carboxylate (P5C), during proline biosynthesis. ProB
  phosphorylates L-glutamate to L-glutamyl 5-phosphate, and ProA reduces that
  acyl phosphate intermediate to L-glutamate 5-semialdehyde using NADPH. This
  module deliberately stops before the terminal P5C reductase step that makes
  L-proline.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: KEGG:ppu00332
    title: Pseudomonas putida KT2440 ProB/ProA bucket
    statement: >-
      The local PSEPK pathway partition assigns proB/PP_0691 and proA/PP_4811
      as the two primary genes in this compact bucket. Although the KEGG label
      is carbapenem biosynthesis, the PSEPK UniProt records support canonical
      proline-biosynthesis ProB and ProA functions.
  - source_id: file:modules/bacterial_glutamate_to_p5c_biosynthesis-deep-research-openscientist.md
    title: OpenScientist research for the bacterial glutamate-to-P5C module
    statement: >-
      The generic synthesis supports the ordered ProB kinase and ProA
      reductase reactions as a reusable two-step precursor module that ends at
      glutamate 5-semialdehyde/P5C before P5C reductase.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_glutamate_to_p5c_biosynthesis__ppu00332-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00332 satisfiability review
    statement: >-
      The taxon/pathway synthesis identifies ppu00332 as a misleading KEGG
      bucket for PSEPK ProB and ProA rather than evidence of carbapenem
      biosynthesis, and finds both precursor reactions covered.
  - source_id: GO:0055129
    title: L-proline biosynthetic process
    statement: >-
      GO:0055129 captures the proline-biosynthetic context for ProB and ProA.
  - source_id: file:PSEPK/proB/proB-uniprot.txt
    title: UniProtKB entry for PSEPK proB
    statement: >-
      Q88Q07 is a reviewed glutamate 5-kinase and step 1/2 of
      L-glutamate-5-semialdehyde formation from L-glutamate.
  - source_id: file:PSEPK/proA/proA-uniprot.txt
    title: UniProtKB entry for PSEPK proA
    statement: >-
      Q88DL4 is a reviewed gamma-glutamyl phosphate reductase and step 2/2 of
      L-glutamate-5-semialdehyde formation from L-glutamate.
  - source_id: file:genes/ECOLI/proB/proB-ai-review.yaml
    title: ECOLI proB gene review
    statement: >-
      The completed E. coli proB review grounds ProB as the cytosolic
      glutamate 5-kinase that catalyzes the first step in the
      glutamate-to-P5C branch.
  - source_id: file:genes/ECOLI/proA/proA-ai-review.yaml
    title: ECOLI proA gene review
    statement: >-
      The completed E. coli proA review grounds ProA as the cytosolic
      gamma-glutamyl phosphate reductase that catalyzes the second step in the
      glutamate-to-P5C branch.
  - source_id: file:interpro/panther/PTHR43654/PTHR43654-paint.tsv
    title: PAINT assertions for the glutamate 5-kinase family
    statement: >-
      PTN000115542 carries an IBD assertion for GO:0004349 and is seeded by
      experimentally characterized E. coli P0A7B5.
  - source_id: file:interpro/panther/PTHR11063/PTHR11063-paint.tsv
    title: PAINT assertions for the glutamate semialdehyde dehydrogenase family
    statement: >-
      PTN000115463 carries an IBD assertion for GO:0004350 and is seeded by
      experimentally characterized E. coli P07004.
notes: >-
  Scope and generalization: the two-enzyme ProB/ProA route is conserved
  across bacteria, so the module is species-neutral at the family level and
  grounded by two exemplars, E. coli K-12 (P0A7B5, P07004; experimentally
  characterized enzymes) and P. putida KT2440 (Q88Q07, Q88DL4; the strain in
  which this pathway bucket was first curated). Fungi use the same split
  enzymes (yeast PRO1 in PTHR43654 and PRO2 in PTHR11063, both reviewed as
  the family reference proteins), whereas animals and plants fuse the two
  activities into one bifunctional P5C synthase; the module keeps its
  bacterial context taxon and title, and the fused P5CS route belongs to
  separate eukaryotic modules. The module stops at glutamate
  5-semialdehyde/P5C, before the terminal P5C reductase (ProC) step. In P.
  putida KT2440 the KEGG map that holds ProB and ProA is labeled carbapenem
  biosynthesis (ppu00332); that label is kept out of the module biology.
  Families: both members are in function-named PANTHER families, PTHR43654
  (GLUTAMATE 5-KINASE) and PTHR11063 (GLUTAMATE SEMIALDEHYDE DEHYDROGENASE),
  and all four exemplars sit in PTHR43654:SF1 and PTHR11063:SF8. Neither
  subfamily is asserted as a module family term. PTHR43654:SF1 is
  functionally mixed: besides 401 ProB glutamate 5-kinases it holds five
  isopentenyl phosphate kinases (Arabidopsis IPK Q8H1F7 and four archaeal
  IPKs), so the SF1 id would also select proteins that do not perform this
  step. PTHR11063:SF8 also holds the bifunctional animal P5C synthases, which
  belong to a different (fused-enzyme) route. The PTHR43654 PAINT slice
  records the divergence as IRD losses of glutamate 5-kinase activity and
  proline biosynthesis at node PTN001337743 (seeded by the Arabidopsis IPK),
  which lies outside every ProB exemplar; the slice cannot show whether the
  archaeal IPKs also descend from that node. The family IBD nodes PTN000115542 and PTN000115463
  are the asserted ancestral nodes. GOA for Q88Q07 and Q88DL4 also cites
  PTN002462614 and PTN002253185 inside combined electronic annotations; these
  nodes are absent from the committed PAINT slices and are not asserted.
