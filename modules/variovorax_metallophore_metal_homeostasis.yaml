id: MODULE:variovorax_metallophore_metal_homeostasis
title: Variovorax periplasmic D-gluconate production, intracellular iron trafficking, polyphosphate turnover, and heavy-metal cation efflux
description: >-
  A functional grouping of four independent metabolic and metal-homeostasis
  subsystems across the cell envelope and cytoplasm of Variovorax paradoxus: (1)
  periplasmic PQQ-dependent glucose dehydrogenase (Gcd) oxidation of D-glucose
  to D-glucono-1,5-lactone coupled to membrane ubiquinone reduction in the
  D-gluconate pathway; (2) cytosolic YggX-family Fe(2+)-trafficking protein
  (FetP) binding of ferrous iron for intracellular iron transactions and Fe-S
  cluster assembly/repair; (3) cytoplasmic inorganic polyphosphate (polyP)
  polymerization by polyphosphate kinase 1 (Ppk) and hydrolytic depolymerization
  to orthophosphate by exopolyphosphatase (Ppx); and (4) transmembrane export of
  divalent heavy-metal cations (Co2+, Zn2+, Cd2+) by the tripartite CzcCBA
  HME-RND trans-envelope efflux complex (CzcA3 inner-membrane RND antiporter,
  CzcB periplasmic membrane-fusion adaptor, and CzcC outer-membrane factor
  channel) and the inner-membrane CzcD cation diffusion facilitator (CDF)
  antiporter.
status: DRAFT
evidence:
  - source_id: GO:0006879
    title: intracellular iron ion homeostasis
    statement: >-
      GO:0006879 provides the biological-process context for cytosolic ferrous
      iron trafficking and intracellular iron homeostasis.
  - source_id: GO:0098655
    title: monoatomic cation transmembrane transport
    statement: >-
      GO:0098655 provides the biological-process context for HME-RND- and
      CDF-mediated transmembrane export of monoatomic metal cations.
  - source_id: PMID:21183664
    title: >-
      Complete genome sequence of the metabolically versatile plant
      growth-promoting endophyte Variovorax paradoxus S110.
    statement: >-
      Documents the metabolic versatility of Variovorax paradoxus S110 across
      heterotrophic, autotrophic, and plant-associated lifestyles.
    supporting_text: >-
      Variovorax paradoxus is a microorganism of special interest due to its
      diverse metabolic capabilities, including the biodegradation of both
      biogenic compounds and anthropogenic contaminants.
  - source_id: PMID:10559151
    title: >-
      CzcD is a heavy metal ion transporter involved in regulation of heavy
      metal resistance in Ralstonia sp. strain CH34.
    statement: >-
      Establishes the complementary roles of the tripartite CzcCB2A RND
      trans-envelope cation efflux complex and the inner-membrane CzcD CDF
      transporter in bacterial Co(2+)/Zn(2+)/Cd(2+) export.
    supporting_text: >-
      The Czc system of Ralstonia sp. strain CH34 mediates resistance to cobalt,
      zinc, and cadmium through ion efflux catalyzed by the CzcCB(2)A
      cation-proton antiporter.
  - source_id: PMID:12829273
    title: >-
      Efflux-mediated heavy metal resistance in prokaryotes.
    statement: >-
      Defines the three-component architecture of HME-RND heavy-metal efflux
      systems (inner-membrane RND pump CzcA, periplasmic membrane-fusion protein
      CzcB, and outer-membrane factor CzcC) alongside CDF-family inner-membrane
      antiporters (CzcD).
    supporting_text: >-
      The mechanisms of action, physiological functions, and distribution of
      metal-exporting proteins are outlined, namely: CBA efflux pumps driven by
      proteins of the resistance-nodulation-cell division superfamily, P-type
      ATPases, cation diffusion facilitator and chromate proteins, NreB- and
      CnrT-like resistance factors.
  - source_id: PMID:23687963
    title: >-
      Accumulation of inorganic polyphosphate enables stress endurance and
      catalytic vigour in Pseudomonas putida KT2440.
    statement: >-
      Establishes that bacterial inorganic polyphosphate turnover is governed by
      the opposing activities of polyphosphate kinase (Ppk) and
      exopolyphosphatase (Ppx).
    supporting_text: >-
      In addition to Ppk, there is another polyP-modifying enzyme: the so-called
      exopolyphosphatase (Ppx), that is in charge of polyP hydrolysis to Pi
      (Figure 1A).
  - source_id: file:VARPD/gcd/gcd-ai-review.yaml
    title: Variovorax paradoxus gcd gene review
    statement: >-
      A0A0H2LUW4 (VPARA_65850) encodes the 818-residue membrane-bound
      PQQ-dependent quinoprotein glucose dehydrogenase Gcd responsible for
      periplasmic oxidation of D-glucose to D-glucono-1,5-lactone.
  - source_id: file:VARPS/fetP/fetP-ai-review.yaml
    title: Variovorax paradoxus S110 fetP gene review
    statement: >-
      C5CNX5 (Vapar_2982) encodes the 90-residue cytosolic YggX-family probable
      Fe(2+)-trafficking protein FetP.
  - source_id: file:VARPD/ppk/ppk-ai-review.yaml
    title: Variovorax paradoxus ppk gene review
    statement: >-
      A0A0H2M4T4 (VPARA_28600) encodes the 710-residue polyphosphate kinase 1
      Ppk, which synthesizes inorganic polyphosphate polymers from ATP in the
      cytosol.
  - source_id: file:VARPD/ppx/ppx-ai-review.yaml
    title: Variovorax paradoxus ppx gene review
    statement: >-
      A0A0H2MBK5 (VPARA_10490) encodes the 506-residue cytosolic
      exopolyphosphatase Ppx (EC 3.6.1.11) that hydrolyzes inorganic
      polyphosphate chains into orthophosphate.
    supporting_text: >-
      Processive hydrolytic cleavage of terminal orthophosphate residues from
      inorganic polyphosphate chains in the cytosol, balancing Ppk-mediated
      polyphosphate synthesis.
  - source_id: file:VARPD/czcA3/czcA3-ai-review.yaml
    title: Variovorax paradoxus czcA3 gene review
    statement: >-
      A0A0H2MBF7 (VPARA_44890) encodes the 1067-residue inner-membrane HME-RND
      cation efflux antiporter subunit CzcA3.
  - source_id: file:VARPD/czcB/czcB-ai-review.yaml
    title: Variovorax paradoxus czcB gene review
    statement: >-
      A0A0H2LX82 (VPARA_44900) encodes the 455-residue periplasmic
      membrane-fusion adaptor subunit CzcB encoded immediately downstream of
      czcA3 (VPARA_44890).
    supporting_text: >-
      Periplasmic membrane-fusion adaptor subunit of the tripartite CzcCBA
      heavy-metal efflux complex that bridges the inner-membrane RND antiporter
      CzcA3 (VPARA_44890) and the outer-membrane channel CzcC (VPARA_44910) and
      binds transition metal cations via its histidine-rich N-terminal
      periplasmic tail to facilitate transmembrane metal cation export.
  - source_id: file:VARPD/czcC/czcC-ai-review.yaml
    title: Variovorax paradoxus czcC gene review
    statement: >-
      A0A0H2M0U4 (VPARA_44910) encodes the 445-residue outer-membrane factor
      efflux duct subunit CzcC of the tripartite CzcCBA complex.
    supporting_text: >-
      Outer-membrane factor (OMF) channel subunit of the tripartite CzcCBA
      heavy-metal efflux complex that forms the outer-membrane exit duct for
      transmembrane export of monoatomic metal cations.
  - source_id: file:VARPD/czcD/czcD-ai-review.yaml
    title: Variovorax paradoxus czcD gene review
    statement: >-
      A0A0H2M558 (VPARA_15480) encodes the 320-residue inner-membrane cation
      diffusion facilitator (CDF) heavy-metal/H(+) antiporter CzcD.
    supporting_text: >-
      Inner-membrane Cation Diffusion Facilitator (CDF) antiporter that
      catalyzes transmembrane export of cytoplasmic Zn(2+) (as well as Co(2+)
      and Cd(2+)) across the plasma membrane to maintain intracellular zinc ion
      homeostasis.
module:
  id: variovorax_metallophore_metal_homeostasis
  label: Variovorax periplasmic D-gluconate production, intracellular iron trafficking, polyphosphate turnover, and heavy-metal cation efflux
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: intracellular iron ion homeostasis
      term:
        id: GO:0006879
        label: intracellular iron ion homeostasis
      description: >-
        Maintenance of internal iron ion levels via cytosolic Fe(2+)
        trafficking for Fe-S cluster assembly and repair.
    - preferred_term: monoatomic cation transmembrane transport
      term:
        id: GO:0098655
        label: monoatomic cation transmembrane transport
      description: >-
        Proton-motive-force-driven transmembrane export of monoatomic metal
        cations across the bacterial cell envelope by HME-RND and CDF efflux
        systems.
  parts:
    - order: 1
      role: periplasmic PQQ-dependent oxidation of D-glucose to D-glucono-1,5-lactone
      node:
        id: gcd_bioleaching_step
        label: Gcd periplasmic PQQ-dependent glucose oxidation
        module_type: REACTION
        annotons:
          - id: gcd_dehydrogenase_activity
            label: Gcd quinoprotein glucose dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial membrane-bound PQQ-dependent glucose dehydrogenases
                family_terms:
                  - id: InterPro:IPR017511
                    label: Quinoprotein glucose/sorbosone dehydrogenase
                representative_members:
                  - preferred_term: gcd (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2LUW4
                      label: Quinoprotein glucose dehydrogenase
                    description: >-
                      Variovorax paradoxus VPARA_65850; 818-residue inner-membrane
                      PQQ-dependent glucose dehydrogenase that oxidizes D-glucose
                      to D-glucono-1,5-lactone in the periplasm.
            function:
              preferred_term: quinoprotein glucose dehydrogenase activity
              term:
                id: GO:0008876
                label: quinoprotein glucose dehydrogenase activity
              substrates:
                - preferred_term: D-glucose
                - preferred_term: ubiquinone
              products:
                - preferred_term: D-glucono-1,5-lactone
                - preferred_term: ubiquinol
            role_description: >-
              Catalyzes the direct periplasmic oxidation of D-glucose to
              D-glucono-1,5-lactone (which hydrolyzes to D-gluconate) coupled
              to membrane ubiquinone reduction.
    - order: 2
      role: cytosolic ferrous iron binding and intracellular iron trafficking
      node:
        id: fetP_iron_trafficking_step
        label: FetP cytosolic Fe(2+) trafficking activity
        module_type: REACTION
        annotons:
          - id: fetP_ferrous_binding_activity
            label: FetP iron ion binding
            participant:
              selector_type: FAMILY
              family:
                preferred_term: YggX/FetP Fe(2+)-trafficking proteins
                family_terms:
                  - id: InterPro:IPR007457
                    label: Fe2+-trafficking protein
                representative_members:
                  - preferred_term: fetP (Variovorax paradoxus S110)
                    term:
                      id: UniProtKB:C5CNX5
                      label: Probable Fe(2+)-trafficking protein
                    description: >-
                      Variovorax paradoxus S110 Vapar_2982; 90-residue cytosolic
                      YggX-family Fe(2+)-binding protein predicted to mediate
                      intracellular iron transactions for Fe-S cluster assembly
                      and repair.
            function:
              preferred_term: iron ion binding
              term:
                id: GO:0005506
                label: iron ion binding
            role_description: >-
              Predicted to bind intracellular Fe(2+) in the cytosol to mediate
              iron transactions between iron acquisition and Fe-S cluster
              synthesis or repair.
    - order: 3
      role: cytoplasmic ATP-dependent polymerization and hydrolytic turnover of inorganic polyphosphate
      node:
        id: ppk_polyphosphate_sequestration_step
        label: Ppk and Ppx cytoplasmic inorganic polyphosphate turnover
        module_type: REACTION
        annotons:
          - id: ppk_kinase_activity
            label: Ppk polyphosphate kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PPK1-family polyphosphate kinases
                family_terms:
                  - id: InterPro:IPR003414
                    label: Polyphosphate kinase
                representative_members:
                  - preferred_term: ppk (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2M4T4
                      label: Polyphosphate kinase
                    description: >-
                      Variovorax paradoxus VPARA_28600; 710-residue PPK1 enzyme
                      that polymerizes the terminal gamma-phosphate of ATP into
                      long-chain inorganic polyphosphate.
            function:
              preferred_term: polyphosphate kinase activity
              term:
                id: GO:0008976
                label: polyphosphate kinase activity
              substrates:
                - preferred_term: ATP
                - preferred_term: polyphosphate
              products:
                - preferred_term: ADP
                - preferred_term: polyphosphate
            role_description: >-
              Catalyzes the reversible transfer of the terminal gamma-phosphate
              of ATP to form long-chain inorganic polyphosphate in the
              cytoplasm.
          - id: ppx_exopolyphosphatase_activity
            label: Ppx exopolyphosphatase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Ppx/GppA-family bacterial exopolyphosphatases
                family_terms:
                  - id: InterPro:IPR030673
                    label: Exopolyphosphatase
                representative_members:
                  - preferred_term: ppx (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2MBK5
                      label: Exopolyphosphatase
                    description: >-
                      Variovorax paradoxus VPARA_10490; 506-residue cytosolic
                      exopolyphosphatase (EC 3.6.1.11) that processively
                      hydrolyzes terminal orthophosphate residues from linear
                      polyphosphate chains.
            function:
              preferred_term: exopolyphosphatase activity
              term:
                id: GO:0004309
                label: exopolyphosphatase activity
              substrates:
                - preferred_term: polyphosphate
                - preferred_term: water
              products:
                - preferred_term: polyphosphate
                - preferred_term: phosphate
            role_description: >-
              Catalyzes the processive hydrolytic release of terminal
              orthophosphate (Pi) from inorganic polyphosphate chains in the
              cytosol, balancing Ppk-mediated polyP synthesis.
    - order: 4
      role: trans-envelope CzcCBA HME-RND and inner-membrane CzcD CDF heavy-metal cation efflux
      node:
        id: czcA3_heavy_metal_efflux_step
        label: CzcCBA tripartite RND and CzcD CDF heavy-metal cation efflux
        module_type: TRANSPORT_STEP
        annotons:
          - id: czcA3_antiporter_activity
            label: CzcA3 inner-membrane RND heavy-metal cation antiporter
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CzcA/CusA-family HME-RND heavy-metal efflux pumps
                family_terms:
                  - id: InterPro:IPR004763
                    label: Efflux transporter, RND family, CusA-like
                representative_members:
                  - preferred_term: czcA3 (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2MBF7
                      label: Cobalt/zinc/cadmium efflux RND transporter, CzcA family
                    description: >-
                      Variovorax paradoxus VPARA_44890; 1067-residue
                      inner-membrane HME-RND antiporter subunit of the
                      tripartite CzcCBA cation efflux complex.
            function:
              preferred_term: monoatomic cation transmembrane transporter activity
              term:
                id: GO:0008324
                label: monoatomic cation transmembrane transporter activity
            role_description: >-
              Couples the inner-membrane proton-motive force to transmembrane
              export of divalent metal cations (Co2+, Zn2+, Cd2+) as the
              inner-membrane RND pump subunit of the tripartite CzcCBA complex.
          - id: czcB_membrane_fusion_activity
            label: CzcB periplasmic membrane-fusion adaptor subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CzcB/CusB-family periplasmic HME-RND membrane-fusion proteins
                representative_members:
                  - preferred_term: czcB (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2LX82
                      label: Metal cation efflux system protein CzcB
                    description: >-
                      Variovorax paradoxus VPARA_44900; 455-residue periplasmic
                      membrane-fusion adaptor protein with an N-terminal
                      10-histidine metal-binding region (residues 41-121)
                      bridging CzcA3 and CzcC.
            function:
              preferred_term: efflux transmembrane transporter activity
              term:
                id: GO:0015562
                label: efflux transmembrane transporter activity
            role_description: >-
              Bridges the inner-membrane RND pump CzcA3 and the outer-membrane
              channel CzcC across the periplasm within the tripartite CzcCBA
              heavy-metal efflux complex.
          - id: czcC_outer_membrane_channel_activity
            label: CzcC outer-membrane efflux factor channel subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CzcC/CusC-family outer-membrane heavy-metal efflux factor channels
                representative_members:
                  - preferred_term: czcC (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2M0U4
                      label: Outer membrane protein CzcC
                    description: >-
                      Variovorax paradoxus VPARA_44910; 445-residue
                      outer-membrane factor (OEP, Pfam PF02321) subunit forming
                      the outer-membrane exit duct of the tripartite CzcCBA
                      efflux complex.
            function:
              preferred_term: efflux transmembrane transporter activity
              term:
                id: GO:0015562
                label: efflux transmembrane transporter activity
            role_description: >-
              Forms the trimeric outer-membrane beta-barrel/alpha-helical
              tunnel that conducts metal cations from CzcA3-CzcB across the
              outer membrane to the extracellular medium.
          - id: czcD_cdf_antiporter_activity
            label: CzcD inner-membrane CDF heavy-metal/H(+) antiporter
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CzcD/YiiP-family cation diffusion facilitator heavy-metal antiporters
                family_terms:
                  - id: InterPro:IPR002524
                    label: Cation efflux protein
                representative_members:
                  - preferred_term: czcD / antiporter (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2M558
                      label: Cadmium, cobalt and zinc/H(+)-K(+) antiporter
                    description: >-
                      Variovorax paradoxus VPARA_15480; 320-residue 6-TM
                      inner-membrane CDF antiporter with conserved TM2/TM5 Site
                      A ligands (His59, His62, His188, Asp192) and a 15-His
                      cytoplasmic loop (residues 152-179).
            function:
              preferred_term: zinc ion transmembrane transporter activity
              term:
                id: GO:0005385
                label: zinc ion transmembrane transporter activity
            role_description: >-
              Exports cytoplasmic Zn(2+), Co(2+), and Cd(2+) across the inner
              membrane into the periplasm in exchange for protons, where cations
              are subsequently extruded across the outer membrane by CzcCBA.
  notes: >-
    Groups four independent metabolic and metal-homeostasis subsystems in
    Variovorax paradoxus (module_type: BIOLOGICAL_PROCESS): (1) periplasmic
    D-glucose oxidation to D-glucono-1,5-lactone by membrane-bound PQQ-dependent
    glucose dehydrogenase (Gcd, A0A0H2LUW4, VPARA_65850); (2) cytosolic ferrous
    iron trafficking by the YggX-family protein FetP (C5CNX5, Vapar_2982); (3)
    cytoplasmic inorganic polyphosphate synthesis by polyphosphate kinase 1
    (Ppk, A0A0H2M4T4, VPARA_28600) and hydrolytic depolymerization by
    exopolyphosphatase (Ppx, A0A0H2MBK5, VPARA_10490); and (4) trans-envelope
    and inner-membrane divalent heavy-metal cation efflux mediated by the
    tripartite CzcCBA HME-RND complex — CzcA3 (A0A0H2MBF7, VPARA_44890), CzcB
    (A0A0H2LX82, VPARA_44900), and CzcC (A0A0H2M0U4, VPARA_44910) — alongside
    the inner-membrane CzcD CDF antiporter (A0A0H2M558, VPARA_15480). Because
    these four subsystems act in distinct physiological pathways across the cell
    envelope and cytoplasm, no sequential causal connections are asserted
    between the four top-level parts.
