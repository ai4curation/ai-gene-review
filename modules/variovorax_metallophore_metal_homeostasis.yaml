id: MODULE:variovorax_metallophore_metal_homeostasis
title: Variovorax periplasmic D-gluconate production, intracellular iron trafficking, polyphosphate synthesis, and RND metal cation efflux
description: >-
  A functional grouping of four independent metabolic and metal-homeostasis
  activities across the cell envelope and cytoplasm of Variovorax paradoxus: (1)
  periplasmic PQQ-dependent glucose dehydrogenase (Gcd) oxidation of D-glucose
  to D-glucono-1,5-lactone coupled to membrane ubiquinone reduction in the
  D-gluconate pathway; (2) cytosolic YggX-family Fe(2+)-trafficking protein
  (FetP) binding of ferrous iron for intracellular iron transactions and Fe-S
  cluster assembly/repair; (3) cytoplasmic polyphosphate kinase 1 (Ppk)
  ATP-dependent synthesis of long-chain inorganic polyphosphate (polyP); and (4)
  inner-membrane HME-RND proton/cation antiporter (CzcA3) transmembrane export
  of monoatomic metal cations.
status: DRAFT
evidence:
  - source_id: GO:0006879
    title: intracellular iron ion homeostasis
    statement: >-
      GO:0006879 provides the biological-process context for cytosolic ferrous
      iron trafficking and intracellular iron homeostasis.
  - source_id: GO:0098655
    title: monoatomic cation transmembrane transport
    statement: >-
      GO:0098655 provides the biological-process context for HME-RND-mediated
      transmembrane export of monoatomic metal cations.
  - source_id: PMID:21183664
    title: >-
      Complete genome sequence of the metabolically versatile plant
      growth-promoting endophyte Variovorax paradoxus S110.
    statement: >-
      Documents the metabolic versatility of Variovorax paradoxus S110 across
      heterotrophic, autotrophic, and plant-associated lifestyles.
    supporting_text: >-
      Variovorax paradoxus is a microorganism of special interest due to its
      diverse metabolic capabilities, including the biodegradation of both
      biogenic compounds and anthropogenic contaminants.
  - source_id: file:VARPD/gcd/gcd-ai-review.yaml
    title: Variovorax paradoxus gcd gene review
    statement: >-
      A0A0H2LUW4 (VPARA_65850) encodes the 818-residue membrane-bound
      PQQ-dependent quinoprotein glucose dehydrogenase Gcd responsible for
      periplasmic oxidation of D-glucose to D-glucono-1,5-lactone.
  - source_id: file:VARPS/fetP/fetP-ai-review.yaml
    title: Variovorax paradoxus S110 fetP gene review
    statement: >-
      C5CNX5 (Vapar_2982) encodes the 90-residue cytosolic YggX-family probable
      Fe(2+)-trafficking protein FetP.
  - source_id: file:VARPD/ppk/ppk-ai-review.yaml
    title: Variovorax paradoxus ppk gene review
    statement: >-
      A0A0H2M4T4 (VPARA_28600) encodes the 710-residue polyphosphate kinase 1
      Ppk, which synthesizes inorganic polyphosphate polymers from ATP in the
      cytosol.
  - source_id: file:VARPD/czcA3/czcA3-ai-review.yaml
    title: Variovorax paradoxus czcA3 gene review
    statement: >-
      A0A0H2MBF7 (VPARA_44890) encodes the 1067-residue inner-membrane HME-RND
      cation efflux antiporter subunit CzcA3.
module:
  id: variovorax_metallophore_metal_homeostasis
  label: Variovorax periplasmic D-gluconate production, intracellular iron trafficking, polyphosphate synthesis, and RND metal cation efflux
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: intracellular iron ion homeostasis
      term:
        id: GO:0006879
        label: intracellular iron ion homeostasis
      description: >-
        Maintenance of internal iron ion levels via cytosolic Fe(2+)
        trafficking for Fe-S cluster assembly and repair.
    - preferred_term: monoatomic cation transmembrane transport
      term:
        id: GO:0098655
        label: monoatomic cation transmembrane transport
      description: >-
        Proton-motive-force-driven transmembrane export of monoatomic metal
        cations across the bacterial plasma membrane by HME-RND antiporters.
  parts:
    - order: 1
      role: periplasmic PQQ-dependent oxidation of D-glucose to D-glucono-1,5-lactone
      node:
        id: gcd_bioleaching_step
        label: Gcd periplasmic PQQ-dependent glucose oxidation
        module_type: REACTION
        annotons:
          - id: gcd_dehydrogenase_activity
            label: Gcd quinoprotein glucose dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial membrane-bound PQQ-dependent glucose dehydrogenases
                family_terms:
                  - id: InterPro:IPR017511
                    label: Quinoprotein glucose/sorbosone dehydrogenase
                representative_members:
                  - preferred_term: gcd (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2LUW4
                      label: Quinoprotein glucose dehydrogenase
                    description: >-
                      Variovorax paradoxus VPARA_65850; 818-residue inner-membrane
                      PQQ-dependent glucose dehydrogenase that oxidizes D-glucose
                      to D-glucono-1,5-lactone in the periplasm.
            function:
              preferred_term: quinoprotein glucose dehydrogenase activity
              term:
                id: GO:0008876
                label: quinoprotein glucose dehydrogenase activity
              substrates:
                - preferred_term: D-glucose
                - preferred_term: ubiquinone
              products:
                - preferred_term: D-glucono-1,5-lactone
                - preferred_term: ubiquinol
            role_description: >-
              Catalyzes the direct periplasmic oxidation of D-glucose to
              D-glucono-1,5-lactone (which hydrolyzes to D-gluconate) coupled
              to membrane ubiquinone reduction.
    - order: 2
      role: cytosolic ferrous iron binding and intracellular iron trafficking
      node:
        id: fetP_iron_trafficking_step
        label: FetP cytosolic Fe(2+) trafficking activity
        module_type: REACTION
        annotons:
          - id: fetP_ferrous_binding_activity
            label: FetP iron ion binding
            participant:
              selector_type: FAMILY
              family:
                preferred_term: YggX/FetP Fe(2+)-trafficking proteins
                family_terms:
                  - id: InterPro:IPR007457
                    label: Fe2+-trafficking protein
                representative_members:
                  - preferred_term: fetP (Variovorax paradoxus S110)
                    term:
                      id: UniProtKB:C5CNX5
                      label: Probable Fe(2+)-trafficking protein
                    description: >-
                      Variovorax paradoxus S110 Vapar_2982; 90-residue cytosolic
                      YggX-family Fe(2+)-binding protein predicted to mediate
                      intracellular iron transactions for Fe-S cluster assembly
                      and repair.
            function:
              preferred_term: iron ion binding
              term:
                id: GO:0005506
                label: iron ion binding
            role_description: >-
              Predicted to bind intracellular Fe(2+) in the cytosol to mediate
              iron transactions between iron acquisition and Fe-S cluster
              synthesis or repair.
    - order: 3
      role: cytoplasmic ATP-dependent polymerization of inorganic polyphosphate
      node:
        id: ppk_polyphosphate_sequestration_step
        label: Ppk inorganic polyphosphate polymerization
        module_type: REACTION
        annotons:
          - id: ppk_kinase_activity
            label: Ppk polyphosphate kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PPK1-family polyphosphate kinases
                family_terms:
                  - id: InterPro:IPR003414
                    label: Polyphosphate kinase
                representative_members:
                  - preferred_term: ppk (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2M4T4
                      label: Polyphosphate kinase
                    description: >-
                      Variovorax paradoxus VPARA_28600; 710-residue PPK1 enzyme
                      that polymerizes the terminal gamma-phosphate of ATP into
                      long-chain inorganic polyphosphate.
            function:
              preferred_term: polyphosphate kinase activity
              term:
                id: GO:0008976
                label: polyphosphate kinase activity
              substrates:
                - preferred_term: ATP
                - preferred_term: polyphosphate
              products:
                - preferred_term: ADP
                - preferred_term: polyphosphate
            role_description: >-
              Catalyzes the reversible transfer of the terminal gamma-phosphate
              of ATP to form long-chain inorganic polyphosphate in the
              cytoplasm.
    - order: 4
      role: inner-membrane HME-RND proton-antiporter efflux of monoatomic metal cations
      node:
        id: czcA3_heavy_metal_efflux_step
        label: CzcA3 RND heavy-metal cation efflux
        module_type: TRANSPORT_STEP
        annotons:
          - id: czcA3_antiporter_activity
            label: CzcA3 RND monoatomic cation transmembrane transporter
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CzcA/CusA-family HME-RND heavy-metal efflux pumps
                family_terms:
                  - id: InterPro:IPR004763
                    label: Efflux transporter, RND family, CusA-like
                representative_members:
                  - preferred_term: czcA3 (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2MBF7
                      label: Cobalt/zinc/cadmium efflux RND transporter, CzcA family
                    description: >-
                      Variovorax paradoxus VPARA_44890; 1067-residue
                      inner-membrane HME-RND antiporter subunit of a tripartite
                      cation efflux system.
            function:
              preferred_term: monoatomic cation transmembrane transporter activity
              term:
                id: GO:0008324
                label: monoatomic cation transmembrane transporter activity
            role_description: >-
              Couples the inner-membrane proton-motive force to transmembrane
              export of monoatomic metal cations as the inner-membrane RND pump
              subunit of a tripartite efflux complex.
  notes: >-
    Groups four independent metabolic and metal-homeostasis activities in
    Variovorax paradoxus (module_type: BIOLOGICAL_PROCESS): periplasmic
    D-glucose oxidation to D-glucono-1,5-lactone by membrane-bound PQQ-dependent
    glucose dehydrogenase (Gcd, A0A0H2LUW4, VPARA_65850), cytosolic ferrous iron
    trafficking by the YggX-family protein FetP (C5CNX5, Vapar_2982),
    cytoplasmic inorganic polyphosphate synthesis by polyphosphate kinase 1
    (Ppk, A0A0H2M4T4, VPARA_28600), and inner-membrane HME-RND proton-driven
    monoatomic metal cation efflux (CzcA3, A0A0H2MBF7, VPARA_44890). Grounded on
    verified InterPro family entries (IPR017511, IPR007457, IPR003414,
    IPR004763) from the corresponding UniProt records. Because these four
    proteins act in distinct physiological pathways and do not form a sequential
    substrate-handoff cascade (and no siderophore/metallophore step is included
    in this module), no causal connections are asserted between the four parts.
