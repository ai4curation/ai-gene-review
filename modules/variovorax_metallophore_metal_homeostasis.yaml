  notes: >-
    Groups six metabolic, polyphosphate, and metal-homeostasis subsystems in
    Variovorax paradoxus (module_type: BIOLOGICAL_PROCESS): (1) periplasmic
    D-glucose oxidation to D-glucono-1,5-lactone by membrane-bound PQQ-dependent
    glucose dehydrogenase (Gcd, A0A0H2LUW4, VPARA_65850); (2) cytosolic ferrous
    iron binding and intracellular iron trafficking by the YggX-family protein
    FetP (C5CNX5, Vapar_2982); (3) Fe(2+)- and Zn(2+)-responsive transcriptional
    repression of iron- and zinc-uptake operons under metal sufficiency by Fur1
    (A0A0H2M8T9, VPARA_18200) and Zur (A0A0H2LYR2, VPARA_33720); (4) cytoplasmic
    inorganic polyphosphate synthesis by polyphosphate kinase 1 (Ppk, A0A0H2M4T4,
    VPARA_28600) and hydrolytic depolymerization by exopolyphosphatase (Ppx,
    A0A0H2MBK5, VPARA_10490; high-affinity orthophosphate uptake by PstSACB is
    modeled separately in MODULE:bacterial_pst_phosphate_uptake); (5)
    trans-envelope and inner-membrane heavy-metal cation efflux mediated by the
    tripartite CzcCBA HME-RND complex — CzcA3 (A0A0H2MBF7, VPARA_44890), CzcB
    (A0A0H2LX82, VPARA_44900), and CzcC (A0A0H2M0U4, VPARA_44910) — together
    with the inner-membrane CzcD CDF antiporter (A0A0H2M558, VPARA_15480) and
    the inner-membrane P1B-type Zn(2+)/Cd(2+) and Cu(+) efflux ATPases CadA2
    (A0A0H2LVW9, VPARA_44980) and CopA2 (A0A0H2M2H3, VPARA_21930); and (6)
    periplasmic heavy-metal modulation by CzcI (A0A0H2LVR9, VPARA_44920) and
    His-Asp phosphorelay regulation by the CusS-CzcR two-component system
    (A0A0H2MBG2, VPARA_44940; A0A0H2LVW5, VPARA_44930). Because these six
    subsystems act in distinct physiological pathways across the cell envelope
    and cytoplasm, no sequential causal connections are asserted between the six
    top-level parts.
