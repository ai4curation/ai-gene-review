id: MODULE:variovorax_metallophore_metal_homeostasis
title: Variovorax bioleaching, intracellular iron trafficking, polyphosphate sequestration, and RND metal efflux
description: >-
  An integrated bacterial metal mobilization and homeostasis module in
  Variovorax paradoxus coordinating four complementary mechanisms across the
  cell envelope and cytoplasm: (1) periplasmic PQQ-dependent glucose
  dehydrogenase (Gcd) oxidation of D-glucose to gluconic acid to solubilize
  poorly soluble phosphate minerals and rare earth elements (lanthanides); (2)
  cytosolic Fe(2+)-trafficking protein (FetP) binding and buffering of ferrous
  iron for Fe-S cluster assembly and protection against Fenton toxicity; (3)
  cytoplasmic polyphosphate kinase (Ppk) synthesis of high-molecular-weight
  inorganic polyphosphate granules that chelate and store multivalent cations
  and lanthanides; and (4) inner-membrane RND proton/cation antiporter (CzcA3)
  export of excess divalent heavy-metal ions (Co2+, Zn2+, Cd2+) across the cell
  envelope.
status: DRAFT
evidence:
  - source_id: GO:0006879
    title: intracellular iron ion homeostasis
    statement: >-
      GO:0006879 provides the biological-process context for ferrous iron
      buffering and intracellular iron homeostasis.
  - source_id: GO:0006882
    title: cellular zinc ion homeostasis
    statement: >-
      GO:0006882 provides the biological-process context for CzcA-mediated zinc,
      cobalt, and cadmium detoxification.
  - source_id: PMID:21183664
    title: >-
      Complete genome sequence of the metabolically versatile plant
      growth-promoting endophyte Variovorax paradoxus S110.
    statement: >-
      Documents the extensive repertoire of metabolic, heavy-metal resistance,
      and iron homeostasis genes in Variovorax paradoxus S110.
    supporting_text: >-
      Variovorax paradoxus is a microorganism of special interest due to its
      diverse metabolic capabilities, including the biodegradation of both
      biogenic compounds and anthropogenic contaminants.
  - source_id: file:VARPD/gcd/gcd-ai-review.yaml
    title: Variovorax paradoxus gcd gene review
    statement: >-
      A0A0H2LUW4 encodes the membrane-bound PQQ-dependent glucose dehydrogenase
      Gcd responsible for periplasmic gluconic acid production.
  - source_id: file:VARPS/fetP/fetP-ai-review.yaml
    title: Variovorax paradoxus S110 fetP gene review
    statement: >-
      C5CNX5 (Vapar_2982) encodes the YggX-family Fe(2+)-trafficking protein
      FetP.
  - source_id: file:VARPD/ppk/ppk-ai-review.yaml
    title: Variovorax paradoxus ppk gene review
    statement: >-
      A0A0H2M4T4 encodes polyphosphate kinase Ppk, which synthesizes inorganic
      polyphosphate polymers for energy storage and metal cation chelation.
  - source_id: file:VARPD/czcA3/czcA3-ai-review.yaml
    title: Variovorax paradoxus czcA3 gene review
    statement: >-
      A0A0H2MBF7 encodes the RND heavy-metal efflux antiporter CzcA3.
module:
  id: variovorax_metallophore_metal_homeostasis
  label: Variovorax bioleaching, intracellular iron trafficking, polyphosphate sequestration, and RND metal efflux
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: intracellular iron ion homeostasis
      term:
        id: GO:0006879
        label: intracellular iron ion homeostasis
      description: >-
        Maintenance of internal iron ion levels and protection against
        iron-catalyzed oxidative stress.
    - preferred_term: cellular zinc ion homeostasis
      term:
        id: GO:0006882
        label: cellular zinc ion homeostasis
      description: >-
        Regulation of cytoplasmic divalent transition-metal levels through
        polyphosphate sequestration and RND-mediated cation efflux.
  parts:
    - order: 1
      role: periplasmic organic acid production for mineral and rare earth element bioleaching
      node:
        id: gcd_bioleaching_step
        label: Gcd periplasmic PQQ-dependent glucose oxidation
        module_type: REACTION
        annotons:
          - id: gcd_dehydrogenase_activity
            label: Gcd PQQ-dependent glucose dehydrogenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial membrane-bound PQQ-dependent glucose dehydrogenases
                family_terms:
                  - id: InterPro:IPR017516
                    label: Quinoprotein glucose dehydrogenase, bacterial
                representative_members:
                  - preferred_term: gcd (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2LUW4
                      label: Quinoprotein glucose dehydrogenase
                    description: >-
                      Variovorax paradoxus VPARA_65850; oxidizes D-glucose in
                      the periplasm to generate gluconic acid for phosphate and
                      lanthanide mineral dissolution.
            function:
              preferred_term: quinoprotein glucose dehydrogenase activity
              term:
                id: GO:0008876
                label: quinoprotein glucose dehydrogenase activity
              substrates:
                - preferred_term: D-glucose
                - preferred_term: ubiquinone
              products:
                - preferred_term: D-glucono-1,5-lactone
                - preferred_term: ubiquinol
            role_description: >-
              Catalyzes the direct periplasmic oxidation of D-glucose to
              D-glucono-1,5-lactone (which hydrolyzes to gluconic acid),
              acidifying the rhizosphere micro-environment and chelating metal
              and rare earth cations from mineral surfaces.
    - order: 2
      role: cytosolic ferrous iron binding and redox-buffered trafficking
      node:
        id: fetP_iron_trafficking_step
        label: FetP cytosolic Fe(2+) chaperone activity
        module_type: REACTION
        annotons:
          - id: fetP_ferrous_binding_activity
            label: FetP iron ion binding
            participant:
              selector_type: FAMILY
              family:
                preferred_term: YggX/FetP Fe(2+)-trafficking proteins
                family_terms:
                  - id: InterPro:IPR007457
                    label: Fe2+-trafficking protein
                representative_members:
                  - preferred_term: fetP (Variovorax paradoxus S110)
                    term:
                      id: UniProtKB:C5CNX5
                      label: Probable Fe(2+)-trafficking protein
                    description: >-
                      Variovorax paradoxus S110 Vapar_2982; cytosolic
                      Fe(2+)-binding protein that buffers labile ferrous ions
                      for Fe-S cluster assembly and repair.
            function:
              preferred_term: iron ion binding
              term:
                id: GO:0005506
                label: iron ion binding
            role_description: >-
              Binds labile ferrous iron in the cytosol to mediate iron
              transactions for Fe-S cluster assembly while limiting hydroxyl
              radical generation.
    - order: 3
      role: cytoplasmic polyphosphate synthesis for intracellular cation and lanthanide chelation
      node:
        id: ppk_polyphosphate_sequestration_step
        label: Ppk inorganic polyphosphate polymerization
        module_type: REACTION
        annotons:
          - id: ppk_kinase_activity
            label: Ppk polyphosphate kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PPK1-family polyphosphate kinases
                family_terms:
                  - id: InterPro:IPR003414
                    label: Polyphosphate kinase
                representative_members:
                  - preferred_term: ppk (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2M4T4
                      label: Polyphosphate kinase
                    description: >-
                      Variovorax paradoxus VPARA_23820; polymerizes the terminal
                      gamma-phosphate of ATP into long-chain polyphosphate.
            function:
              preferred_term: polyphosphate kinase activity
              term:
                id: GO:0008976
                label: polyphosphate kinase activity
              substrates:
                - preferred_term: ATP
                - preferred_term: polyphosphate
              products:
                - preferred_term: ADP
                - preferred_term: polyphosphate
            role_description: >-
              Synthesizes polyanionic inorganic polyphosphate chains in the
              cytoplasm that sequester excess intracellular divalent transition
              metals and trivalent lanthanide ions.
    - order: 4
      role: inner-membrane RND proton-antiporter efflux of excess divalent heavy-metal cations
      node:
        id: czcA3_heavy_metal_efflux_step
        label: CzcA3 RND heavy-metal cation efflux
        module_type: TRANSPORT_STEP
        annotons:
          - id: czcA3_antiporter_activity
            label: CzcA3 RND monoatomic cation transmembrane transporter
            participant:
              selector_type: FAMILY
              family:
                preferred_term: CzcA-family RND heavy-metal efflux pumps
                family_terms:
                  - id: InterPro:IPR004763
                    label: Resistance-nodulation-cell division (RND) transporter, CzcA
                representative_members:
                  - preferred_term: czcA3 (Variovorax paradoxus)
                    term:
                      id: UniProtKB:A0A0H2MBF7
                      label: Cobalt-zinc-cadmium resistance protein CzcA
                    description: >-
                      Variovorax paradoxus VPARA_44890; inner-membrane RND
                      antiporter subunit exporting Co2+, Zn2+, and Cd2+.
            function:
              preferred_term: monoatomic cation transmembrane transporter activity
              term:
                id: GO:0008324
                label: monoatomic cation transmembrane transporter activity
            role_description: >-
              Couples the proton-motive force to the extrusion of toxic cobalt,
              zinc, and cadmium ions across the cell envelope.
  connections:
    - source: gcd_bioleaching_step
      target: fetP_iron_trafficking_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Periplasmic gluconic acid produced by Gcd solubilizes mineral-bound iron
        and trace metals that enter the cell for FetP-buffered handling.
    - source: fetP_iron_trafficking_step
      target: ppk_polyphosphate_sequestration_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Cytosolic metal mobilization and uptake supply divalent cations that are
        buffered intracellularly by Ppk-generated polyphosphate granules.
    - source: ppk_polyphosphate_sequestration_step
      target: czcA3_heavy_metal_efflux_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Intracellular polyphosphate chelation and turnover buffer free
        cytoplasmic cations that are exported by CzcA3-mediated RND efflux when
        bioleached metal influx exceeds metabolic demand.
  notes: >-
    Models the four-part metal mobilization and detoxification architecture in
    Variovorax paradoxus combining periplasmic gluconic acid bioleaching (Gcd,
    A0A0H2LUW4), cytosolic ferrous iron buffering (FetP, C5CNX5), cytoplasmic
    polyphosphate cation sequestration (Ppk, A0A0H2M4T4), and RND proton-driven
    heavy-metal efflux (CzcA3, A0A0H2MBF7). Grounded on verified InterPro
    family entries (IPR017516, IPR007457, IPR003414, IPR004763) from the
    corresponding UniProt records.
