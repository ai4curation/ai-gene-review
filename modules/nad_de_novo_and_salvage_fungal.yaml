  notes: >-
    NEW module for the YeastPathways NAD group (2026-10). Ten YeastCyc frames
    (PWY3O-4158, NADSYN-PWY, TRYPTOPHAN-DEGRADATION-1, PWY-5651, PWY-5653,
    PWY3O-4106, PWY3O-4107, PWY3O-96, PWY3O-224, PWY3O-236) describe one
    convergent network, so they are modeled as four precursor-route variants
    feeding shared NaMN adenylylation, NAD+ synthetase and NMN adenylylation
    steps. The human MODULE:kynurenine_nad_de_novo covers the same de novo
    chemistry with TDO2/IDO1 and an ACMSD branch, and
    MODULE:nadp_synthesis_and_nr_salvage covers human NR kinases; the
    aspartate de novo route of MODULE:nad_biosynthesis_salvage is absent from
    fungi. YeastCyc corrections: BNA3 is a kynurenine aminotransferase, not
    the formamidase (PMID:18205391), and is excluded; SIR2 is an NAD+
    consumer that releases nicotinamide and is excluded; POF1 (NMN-specific
    adenylyltransferase, PMID:24759102) is added; MEU1 is noted but not
    modeled. Compartments: all YeastPathways and PomBase activities are
    placed in the cytosol; Npt1 and Nma2 are also nuclear (PMID:11884393) and
    UniProt places Bna4 in the mitochondrial outer membrane, so no module-level compartment
    is asserted. Precursor transporters (nicotinate and nicotinamide riboside
    permeases) and the NMN/IMP nucleotidases that regenerate nicotinamide
    riboside are outside the boundary. GO-CAM disagreements: YeastPathways
    types URH1 as uridine nucleosidase and PNP1 as purine-nucleoside
    phosphorylase for the riboside reactions, and assigns arylformamidase
    activity to BNA3; PomBase 698e557b00000821 types the S. pombe PNP
    (SPAC1805.16c) as a nicotinamide riboside hydrolase and includes
    transporters and a thiazole synthase outside this module. S. pombe has no
    kynurenine-route genes in the PomBase model and is represented only in
    the salvage variants.
