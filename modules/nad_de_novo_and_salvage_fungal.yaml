id: MODULE:nad_de_novo_and_salvage_fungal
title: Fungal NAD+ biosynthesis from tryptophan and pyridine salvage
description: >-
  NAD+ supply network of yeasts and other fungi, in which several precursor
  routes converge on nicotinate mononucleotide (NaMN) or nicotinamide
  mononucleotide (NMN) and then share the final adenylylation and amidation
  steps. De novo synthesis uses the kynurenine pathway: an indoleamine
  2,3-dioxygenase-family enzyme opens L-tryptophan to N-formylkynurenine, a
  kynurenine formamidase releases kynurenine, kynurenine 3-monooxygenase and
  kynureninase give 3-hydroxyanthranilate, 3-hydroxyanthranilate
  3,4-dioxygenase opens the ring to 2-amino-3-carboxymuconate semialdehyde,
  which cyclizes non-enzymatically to quinolinate, and quinolinate
  phosphoribosyltransferase makes NaMN. Fungi lack the aspartate-derived
  (NadA/NadB) de novo route. In the Preiss-Handler salvage route, nicotinamide
  released by NAD+-consuming enzymes is deamidated by a nicotinamidase and the
  resulting nicotinate is converted to NaMN by nicotinate
  phosphoribosyltransferase. Nicotinamide riboside and nicotinic acid riboside
  are either phosphorylated by nicotinamide riboside kinase (to NMN or NaMN)
  or cleaved to the free bases by nucleosidases and nucleoside phosphorylases,
  which then enter the Preiss-Handler route. NaMN is adenylylated to
  nicotinate adenine dinucleotide (NaAD) by NMN/NaMN adenylyltransferases and
  amidated to NAD+ by a glutamine-dependent NAD+ synthetase, whereas NMN is
  adenylylated directly to NAD+. The de novo route requires oxygen, so
  fermenting yeasts depend on salvage under anaerobic conditions. Precursor
  uptake, NAD+-consuming reactions such as sirtuin deacetylation, and NADP+
  formation are outside the module.
status: DRAFT
evidence:
  - source_id: GO:0009435
    title: NAD+ biosynthetic process
    statement: Module-level process for the convergent NAD+ supply network.
  - source_id: GO:0034354
    title: "'de novo' NAD+ biosynthetic process from L-tryptophan"
    statement: >-
      Grounds the kynurenine de novo route. GO:0034354 is obsolete in current GO (2026 releases), replaced by GO:0034628, which now carries 'from L-tryptophan' and 'kynurenine pathway' as synonyms although its definition text still describes only the L-aspartate route. The concept keeps GO:0034354 because the ontology version used for validation in this repository still has it live with this label; migrate when the pinned GO is updated.
  - source_id: GO:0034355
    title: NAD+ biosynthetic process via the salvage pathway
    statement: Grounds the nicotinamide, nicotinate and riboside salvage routes.
  - source_id: YeastPathways:PWY3O-4158
    title: superpathway of NAD biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway with BNA1-BNA7, NMA1, NMA2, QNS1, PNC1, NPT1, NRK1, URH1,
      PNP1 and SIR2. BNA3 is not the kynurenine formamidase (PMID:18205391)
      and SIR2 is an NAD+ consumer; both are excluded. POF1 and MEU1 are
      missing.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4158
  - source_id: YeastPathways:NADSYN-PWY
    title: NAD de novo biosynthesis II (from tryptophan) (S. cerevisiae, SGD YeastPathways)
    statement: Kynurenine route from tryptophan to NAD+; folded into the de novo variant and shared final steps.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=NADSYN-PWY
  - source_id: YeastPathways:TRYPTOPHAN-DEGRADATION-1
    title: L-tryptophan degradation III (eukaryotic) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Same reaction set as NADSYN-PWY drawn as tryptophan catabolism; in yeast
      this catabolism is the de novo NAD+ route.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=TRYPTOPHAN-DEGRADATION-1
  - source_id: YeastPathways:PWY-5651
    title: L-tryptophan degradation to 2-amino-3-carboxymuconate semialdehyde (S. cerevisiae, SGD YeastPathways)
    statement: First five kynurenine-route reactions (BNA2, BNA7, BNA4, BNA5, BNA1).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5651
  - source_id: YeastPathways:PWY-5653
    title: NAD biosynthesis from 2-amino-3-carboxymuconate semialdehyde (S. cerevisiae, SGD YeastPathways)
    statement: Non-enzymatic quinolinate formation, BNA6, NMA1/NMA2 and QNS1.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5653
  - source_id: YeastPathways:PWY3O-4106
    title: NAD salvage pathway IV (from nicotinamide riboside) (S. cerevisiae, SGD YeastPathways)
    statement: NRK1 phosphorylation of nicotinamide riboside and NMN adenylylation by NMA1/NMA2.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4106
  - source_id: YeastPathways:PWY3O-4107
    title: NAD salvage pathway V (PNC V cycle) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      PNC1, NPT1, NMA1/NMA2 and QNS1 salvage with the SIR2 NAD+-consuming
      step that releases nicotinamide; SIR2 is outside the module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4107
  - source_id: YeastPathways:PWY3O-96
    title: nicotinamide riboside salvage pathway II (S. cerevisiae, SGD YeastPathways)
    statement: URH1 hydrolysis and PNP1 phosphorolysis of nicotinamide riboside.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-96
  - source_id: YeastPathways:PWY3O-224
    title: nicotinate riboside salvage pathway I (S. cerevisiae, SGD YeastPathways)
    statement: Single-reaction NRK1 phosphorylation of nicotinic acid riboside; folded into the riboside kinase variant.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-224
  - source_id: YeastPathways:PWY3O-236
    title: nicotinate riboside salvage pathway II (S. cerevisiae, SGD YeastPathways)
    statement: URH1 and PNP1 cleavage of nicotinic acid riboside; folded into the riboside cleavage variant.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-236
  - source_id: PMID:12062417
    title: Aerobic and anaerobic NAD+ metabolism in Saccharomyces cerevisiae.
    statement: >-
      Identifies the kynurenine-pathway BNA genes, shows that loss of the
      kynurenine pathway is co-lethal with npt1 deletion, and shows that yeast
      is a nicotinic acid auxotroph under anaerobic conditions.
  - source_id: PMID:18205391
    title: >-
      Identification of formyl kynurenine formamidase and kynurenine
      aminotransferase from Saccharomyces cerevisiae using crystallographic,
      bioinformatic and biochemical evidence.
    statement: BNA7 (YDR428C) is the kynurenine formamidase; Bna3 is a kynurenine aminotransferase.
  - source_id: PMID:11816029
    title: Identification and functional analysis of the Saccharomyces cerevisiae nicotinamidase gene, PNC1.
    statement: PNC1 encodes the yeast nicotinamidase.
  - source_id: PMID:11884393
    title: Manipulation of a nuclear NAD+ salvage pathway delays aging without altering steady-state NAD+ levels.
    statement: NPT1 encodes the salvage nicotinate phosphoribosyltransferase; Npt1 and Nma2 are concentrated in the nucleus.
  - source_id: PMID:15137942
    title: >-
      Discoveries of nicotinamide riboside as a nutrient and conserved NRK
      genes establish a Preiss-Handler independent route to NAD+ in fungi and
      humans.
    statement: Nrk1 phosphorylates nicotinamide riboside in a Preiss-Handler-independent route to NAD+.
  - source_id: PMID:17482543
    title: Nicotinamide riboside promotes Sir2 silencing and extends lifespan via Nrk and Urh1/Pnp1/Meu1 pathways to NAD+.
    statement: Nicotinamide riboside is used through Nrk1 and through an Nrk1-independent Urh1/Pnp1/Meu1 pathway.
  - source_id: PMID:17914902
    title: Nicotinamide riboside kinase structures reveal new pathways to NAD+.
    statement: Nicotinic acid riboside is used by Nrk1 and NAD+ synthetase, and by Urh1, Pnp1 and Preiss-Handler salvage.
  - source_id: PMID:12597897
    title: Identification and characterization of a second NMN adenylyltransferase gene in Saccharomyces cerevisiae.
    statement: YGR010W (NMA2) encodes a second yeast NMN adenylyltransferase.
  - source_id: PMID:24759102
    title: YCL047C/POF1 is a novel nicotinamide mononucleotide adenylyltransferase (NMNAT) in Saccharomyces cerevisiae.
    statement: Pof1 is an NMN-specific adenylyltransferase required for normal NAD+ levels and NR use.
  - source_id: PMID:12771147
    title: >-
      Eukaryotic NAD+ synthetase Qns1 contains an essential, obligate
      intramolecular thiol glutamine amidotransferase domain related to
      nitrilase.
    statement: Qns1 is a glutamine-dependent NAD+ synthetase with an essential nitrilase-related glutaminase domain.
  - source_id: file:yeast/PNC1/PNC1-ai-review.yaml
    title: S. cerevisiae PNC1 gene review
    statement: Core function GO:0008936 nicotinamidase activity in nicotinate nucleotide salvage.
  - source_id: file:modules/kynurenine_nad_de_novo.yaml
    title: Human kynurenine pathway module
    statement: Human counterpart of the de novo route; uses the same GO activities for each step.
  - source_id: file:modules/nad_biosynthesis_salvage.yaml
    title: L-aspartate de novo and selected salvage routes to NAD+
    statement: Bacterial-centered module with the aspartate de novo route that fungi lack.
module:
  id: nad_de_novo_and_salvage_fungal
  label: Fungal NAD+ de novo synthesis and salvage
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: NAD+ biosynthetic process
      term:
        id: GO:0009435
        label: NAD+ biosynthetic process
    - preferred_term: "'de novo' NAD+ biosynthetic process from L-tryptophan"
      term:
        id: GO:0034354
        label: "'de novo' NAD+ biosynthetic process from L-tryptophan"
    - preferred_term: NAD+ biosynthetic process via the salvage pathway
      term:
        id: GO:0034355
        label: NAD+ biosynthetic process via the salvage pathway
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-4158
      title: 'superpathway of NAD biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD superpathway conversion, all activities in the cytosol without
        causal edges. BNA3 shares the arylformamidase activity with BNA7, URH1
        is typed uridine nucleosidase and PNP1 purine-nucleoside phosphorylase,
        and SIR2 histone deacetylation is included.
    - model: gomodel:YeastPathways_NADSYN-PWY
      title: 'NAD <i>de novo</i> biosynthesis II (from tryptophan) - imported from: Saccharomyces Genome Database'
      description: Kynurenine route plus NMA1/NMA2 and QNS1; BNA3 again assigned arylformamidase activity.
    - model: gomodel:YeastPathways_TRYPTOPHAN-DEGRADATION-1
      title: 'L-tryptophan degradation III (eukaryotic) - imported from: Saccharomyces Genome Database'
      description: Same activities as NADSYN-PWY.
    - model: gomodel:YeastPathways_PWY-5651
      title: 'L-tryptophan degradation to 2-amino-3-carboxymuconate semialdehyde - imported from: Saccharomyces Genome Database'
      description: First five kynurenine-route activities.
    - model: gomodel:YeastPathways_PWY-5653
      title: 'NAD biosynthesis from 2-amino-3-carboxymuconate semialdehyde - imported from: Saccharomyces Genome Database'
      description: BNA6, NMA1/NMA2 and QNS1 activities.
    - model: gomodel:YeastPathways_PWY3O-4106
      title: 'NAD salvage pathway IV (from nicotinamide riboside) - imported from: Saccharomyces Genome Database'
      description: NRK1 and NMA1/NMA2 activities.
    - model: gomodel:YeastPathways_PWY3O-4107
      title: 'NAD salvage pathway V (PNC V cycle) - imported from: Saccharomyces Genome Database'
      description: PNC1, NPT1, NMA1/NMA2, QNS1 and the NAD+-consuming SIR2 activity.
    - model: gomodel:698e557b00000821
      title: NAD+ biosynthetic process (GO:0009435)
      description: >-
        PomBase S. pombe salvage-only model (S. pombe has no kynurenine
        route): pnc1, npt1, nrk1, urh1, urh2, SPAC1805.16c, SPAC806.06c,
        SPAC694.03 and qns1 in the cytosol, plus plasma-membrane nicotinate and
        nicotinamide riboside transporters and a thiazole synthase that are
        outside this module.
  parts:
    - order: 1
      role: formation of NaMN or NMN from precursors
      node:
        id: pyridine_mononucleotide_supply
        label: Formation of NaMN or NMN by de novo synthesis or salvage
        module_type: METABOLIC_PATHWAY
        description: >-
          Four routes supply pyridine mononucleotides. Organisms and conditions
          use one or more of them; the kynurenine route is absent from fission
          yeast and needs oxygen in budding yeast.
        variant_sets:
          - id: pyridine_precursor_routes
            label: Pyridine mononucleotide supply routes
            axis: precursor route
            selection: ONE_OR_MORE
            variants:
              - id: kynurenine_de_novo_route
                label: Kynurenine de novo route from L-tryptophan
                module_type: METABOLIC_PATHWAY
                concepts:
                  - preferred_term: "'de novo' NAD+ biosynthetic process from L-tryptophan"
                    term:
                      id: GO:0034354
                      label: "'de novo' NAD+ biosynthetic process from L-tryptophan"
                parts:
                  - order: 1
                    role: tryptophan ring opening
                    node:
                      id: tryptophan_dioxygenase_step
                      label: L-tryptophan to N-formylkynurenine
                      module_type: REACTION
                      annotons:
                        - id: bna2_ido_activity
                          label: Bna2-type indoleamine 2,3-dioxygenase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: indoleamine 2,3-dioxygenase family
                              term:
                                id: PANTHER:PTHR28657
                                label: INDOLEAMINE 2,3-DIOXYGENASE
                              representative_members:
                                - preferred_term: BNA2 (Saccharomyces cerevisiae)
                                  term:
                                    id: UniProtKB:P47125
                                    label: Indoleamine 2,3-dioxygenase
                                  description: S. cerevisiae BNA2/YJR078W.
                          function:
                            preferred_term: indoleamine 2,3-dioxygenase activity
                            term:
                              id: GO:0033754
                              label: indoleamine 2,3-dioxygenase activity
                            substrates:
                              - preferred_term: L-tryptophan
                              - preferred_term: dioxygen
                            products:
                              - preferred_term: N-formyl-L-kynurenine
                            cofactors:
                              - preferred_term: heme
                            evidence:
                              - source_id: EC:1.13.11.52
                                statement: Indoleamine 2,3-dioxygenase.
                              - source_id: PMID:12062417
                                statement: >-
                                  Kynurenine-pathway BNA genes are identified and
                                  are co-lethal with npt1 deletion.
                          gocam_associations:
                            - model: gomodel:YeastPathways_PWY3O-4158
                              activity: gomodel:RXN-8665
                              title: 'superpathway of NAD biosynthesis - imported from: Saccharomyces Genome Database'
                              description: BNA2 enables GO:0033754 in cytosol.
                          role_description: >-
                            Fungal Bna2 belongs to the IDO family rather than to
                            the TDO family used by animal liver.
                  - order: 2
                    role: formamide hydrolysis
                    node:
                      id: kynurenine_formamidase_step
                      label: N-formylkynurenine to L-kynurenine
                      module_type: REACTION
                      annotons:
                        - id: bna7_formamidase_activity
                          label: Bna7 kynurenine formamidase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: fungal alpha/beta-hydrolase kynurenine formamidases
                              description: >-
                                Bna7 has no PANTHER family assignment in UniProt,
                                so no PANTHER term is asserted.
                              representative_members:
                                - preferred_term: BNA7 (Saccharomyces cerevisiae)
                                  term:
                                    id: UniProtKB:Q04066
                                    label: Kynurenine formamidase
                                  description: S. cerevisiae BNA7/YDR428C.
                          function:
                            preferred_term: arylformamidase activity
                            term:
                              id: GO:0004061
                              label: arylformamidase activity
                            substrates:
                              - preferred_term: N-formyl-L-kynurenine
                              - preferred_term: water
                            products:
                              - preferred_term: L-kynurenine
                              - preferred_term: formate
                            evidence:
                              - source_id: PMID:18205391
                                statement: >-
                                  demonstrate that YDR428C, which we have
                                  designated BNA7, is the yeast FKF
                          gocam_associations:
                            - model: gomodel:YeastPathways_PWY3O-4158
                              activity: gomodel:ARYLFORMAMIDASE-RXN
                              title: 'superpathway of NAD biosynthesis - imported from: Saccharomyces Genome Database'
                              description: >-
                                BNA7 and, incorrectly, BNA3 enable GO:0004061 in
