                          gocam_associations:
                            - model: gomodel:YeastPathways_PWY3O-4158
                              activity: gomodel:KYNURENINE-3-MONOOXYGENASE-RXN
                              title: 'superpathway of NAD biosynthesis - imported from: Saccharomyces Genome Database'
                              description: BNA4 enables GO:0004502 (placed in cytosol).
                          role_description: Commits kynurenine to the NAD+ branch.
                  - order: 4
