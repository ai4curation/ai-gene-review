    - source_id: PMID:41887919
      title: 'Current Insight into Human Ornithine Aminotransferase: A Review.'
      statement: Human OAT review corroborates reversible PLP chemistry and spontaneous GSA/P5C equilibration.
        Its broad fungal localization statement is limited here to the demonstrated exemplars and is not
        evidence that every fungus uses the budding-yeast proline detour.
      supporting_text: The GSA undergoes spontaneous cyclization
  knowledge_gaps:
  - gap_statement: The molecular carrier for cytosol-to-mitochondrion proline entry is not established
      by the reviewed budding-yeast studies. Put6/Put7 regulate proline metabolism but are not demonstrated
      transporters.
    boundary: Transport is required for the shuttle and remains outside the assigned enzyme parts; PMID:32978391
      describes the transporter as unknown.
    gap_kind:
    - BIOLOGY
  - gap_statement: A complete compulsory proline detour has not been directly demonstrated for every fungal
      exemplar. Fission-yeast isotope conversion supports arginase/OAT flux, whereas assignment of each
      downstream shuttle enzyme is comparative.
    boundary: Keep pathway-wide flux evidence separate from homologous enzyme function and localization.
    gap_kind:
    - BIOLOGY
  - gap_statement: Fission-yeast car1 and aru1 differ in iron-dependent regulation, and Arabidopsis ARGAHs
      differ in seedling activity contributions. Their relative flux varies with growth conditions; the
      representatives are not asserted to be physiologically interchangeable.
    boundary: PMID:20435771 and PMID:26075619 establish differentiated regulation and combined arginine
      conversion; plant paralog context is assessed in the gene reviews.
    gap_kind:
    - BIOLOGY
