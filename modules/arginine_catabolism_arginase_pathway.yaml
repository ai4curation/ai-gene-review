  connections:
  - source: arginase_step
    target: ornithine_transamination_step
    connection_type: PROVIDES_INPUT_FOR
    chaining_status: VERIFIED
    chaining_note: Arginase produces the ornithine consumed by OAT. Native conversion is demonstrated
      in yeast and Arabidopsis; animal coupling denotes compatible mitochondrial chemistry with tissue-dependent
      flux.
    evidence:
    - source_id: PMID:6997271
      title: 'Proline: an essential intermediate in arginine degradation in Saccharomyces cerevisiae.'
      statement: Budding-yeast mutants establish a proline intermediate between ornithine-derived P5C
        and mitochondrial glutamate formation under the studied conditions. This is not a demonstration
        in all fungi.
      supporting_text: Put- mutants excreted proline when grown on arginine or ornithine as the sole nitrogen
        source.
    - source_id: PMID:18419821
      title: Ornithine-delta-aminotransferase is essential for arginine catabolism but not for proline
        biosynthesis.
      statement: Arabidopsis mitochondrial OAT is necessary for use of supplied arginine or ornithine
        as nitrogen; loss of OAT does not impair stress-induced proline accumulation in the tested conditions.
        This supports a catabolic connection to mitochondrial P5CDH, not universal absence of ornithine-derived
        proline in all plants.
      supporting_text: These findings demonstrated that oat mutants could not use Arg or Orn as nitrogen sources for growth.
    - source_id: PMID:26075619
      title: Deletion of Genes Encoding Arginase Improves Use of "Heavy" Isotope-Labeled Arginine for
        Mass Spectrometry in Fission Yeast.
      statement: Fission-yeast car1/aru1 double deletion prevents virtually all measured isotope-arginine conversion. The authors
        propose an Arg3-dependent ornithine/citrulline/arginine re-synthesis route to explain isotope
        pre-peaks; the old claim that this yeast lacks the route is contradicted.
      supporting_text: ornithine carbamoyl transferase Arg3 is part of the “arginine re-synthesis pathway”
  - source: ornithine_transamination_step
    target: p5c_disposal
    connection_type: PROVIDES_INPUT_FOR
    chaining_status: VERIFIED
    chaining_note: OAT produces open-chain glutamate semialdehyde, which equilibrates with P5C. Reductase
      consumes the cyclic pool; dehydrogenase consumes semialdehyde directly or after ring opening. Transport
      and choice of branch depend on the implementation.
    evidence:
