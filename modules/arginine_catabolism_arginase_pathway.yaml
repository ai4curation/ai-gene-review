id: MODULE:arginine_catabolism_arginase_pathway
title: Arginine catabolism via arginase and ornithine aminotransferase
description: >-
  The arginase pathway degrades L-arginine to L-glutamate (or, without oxygen,
  to L-proline) and lets eukaryotes use arginine as a nitrogen source.
  Manganese-dependent arginase hydrolyzes L-arginine to L-ornithine and urea.
  Pyridoxal-phosphate-dependent ornithine aminotransferase then transfers the
  delta-amino group of ornithine to 2-oxoglutarate, forming L-glutamate and
  L-glutamate 5-semialdehyde, which cyclizes non-enzymatically to
  delta-1-pyrroline-5-carboxylate (P5C). How P5C reaches glutamate depends on
  where the enzymes sit. In fungi, arginase and ornithine aminotransferase are
  cytosolic: P5C is first reduced to proline by P5C reductase, and proline is
  then oxidized back to P5C and on to glutamate by mitochondrial proline
  dehydrogenase and P5C dehydrogenase. Proline oxidation needs the respiratory
  chain, so under anaerobic conditions the pathway stops at proline. Where
  ornithine aminotransferase is mitochondrial (animals, plants), P5C
  dehydrogenase can oxidize the semialdehyde directly. Urea goes on to
  urea-degrading enzymes and is outside the module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: YeastPathways:ARGDEG-YEAST-PWY
    title: arginine degradation (aerobic) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists ARGINASE-RXN (CAR1), ORNITHINE-GLU-AMINOTRANSFERASE-RXN
      (CAR2), spontaneous cyclization, PYRROLINECARBREDUCT-RXN (PRO3),
      RXN-14903 (PUT1) and RXN-14116 with no catalyst; PUT2 (P07275) was
      added for RXN-14116. The aerobic route is the proline-shuttle variant.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=ARGDEG-YEAST-PWY
  - source_id: YeastPathways:ARG-PRO-PWY
    title: L-arginine degradation VI (arginase 2 pathway) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists CAR1, CAR2, spontaneous cyclization and PRO3, ending at
      proline; this is the anaerobic proline end-point variant. Gene
      assignments were retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=ARG-PRO-PWY
  - source_id: GO:0006527
    title: L-arginine catabolic process
    statement: Module-level process.
  - source_id: GO:0006593
    title: L-ornithine catabolic process
    statement: The ornithine aminotransferase step onward is ornithine catabolism.
  - source_id: PMID:6094498
    title: Nucleotide sequence of the Saccharomyces cerevisiae arginase gene (CAR1) and its transcription under various physiological conditions.
    statement: CAR1 encodes S. cerevisiae arginase.
  - source_id: PMID:7985419
    title: Cloning and sequencing of Schizosaccharomyces pombe car1 gene encoding arginase. Expression of the arginine anabolic and catabolic genes in response to arginine and related metabolites.
    statement: S. pombe car1 encodes an arginase that complements a S. cerevisiae car1 mutant; its synthesis is induced by arginine.
  - source_id: PMID:26075619
    title: Deletion of Genes Encoding Arginase Improves Use of "Heavy" Isotope-Labeled Arginine for Mass Spectrometry in Fission Yeast.
    statement: Deleting both S. pombe arginase genes, car1 and aru1, is needed to prevent nearly all conversion of arginine into other amino acids, so both contribute arginase activity.
  - source_id: PMID:3036506
    title: Molecular characterization of transposable-element-associated mutations that lead to constitutive L-ornithine aminotransferase expression in Saccharomyces cerevisiae.
    statement: CAR2 (cargB) encodes ornithine aminotransferase, an inducible enzyme.
  - source_id: PMID:6997271
    title: 'Proline: an essential intermediate in arginine degradation in Saccharomyces cerevisiae.'
    statement: >-
      In yeast, ornithine-derived P5C is reduced to proline by P5C reductase
      and then oxidized via proline oxidase and P5C dehydrogenase; put mutants
      excrete proline when grown on arginine.
  - source_id: PMID:7009582
    title: Subcellular compartmentation in control of converging pathways for proline and arginine metabolism in Saccharomyces cerevisiae.
    statement: P5C reductase is cytoplasmic and P5C dehydrogenase particulate, separating the two P5C-consuming enzymes.
  - source_id: PMID:387737
    title: 'Genetics and physiology of proline utilization in Saccharomyces cerevisiae: enzyme induction by proline.'
    statement: The arginine-degradative pathway intersects proline degradation at P5C, and arginine-derived P5C induces the Put enzymes through its conversion to proline.
  - source_id: PMID:25112878
    title: Proline biosynthesis is required for endoplasmic reticulum stress tolerance in Saccharomyces cerevisiae.
    statement: pro1 and pro2 nulls grow without proline because arginine catabolism supplies P5C to PRO3, whereas pro3 nulls cannot.
  - source_id: PMID:12620851
    title: Improved anaerobic use of arginine by Saccharomyces cerevisiae.
    statement: >-
      Anaerobically, yeast assimilates only three of arginine's four nitrogens
      because proline accumulates; a cytosolic PUT2 in a pro3 strain diverts
      P5C to glutamate.
  - source_id: PMID:18419821
    title: Ornithine-delta-aminotransferase is essential for arginine catabolism but not for proline biosynthesis.
    statement: Arabidopsis deltaOAT is mitochondrial and essential for using arginine or ornithine as nitrogen source, feeding P5C into the catabolic branch toward glutamate.
  - source_id: PMID:12679340
    title: 'Yeast epiarginase regulation, an enzyme-enzyme activity control: identification of residues of ornithine carbamoyltransferase and arginase responsible for enzyme catalytic and regulatory activities.'
    statement: Arginase and OTCase form a one-to-one complex in the presence of ornithine and arginine, inhibiting OTCase while arginase remains active.
  - source_id: file:human/OAT/OAT-ai-review.yaml
    title: OAT gene review (human)
    statement: The review supports PLP-dependent ornithine transamination and its role in arginine catabolism.
notes: >-
  NEW (YeastPathways project, 2026-10), merging ARGDEG-YEAST-PWY (aerobic) and
  ARG-PRO-PWY (anaerobic, ending at proline). The core is two enzymes,
  arginase and ornithine aminotransferase. The fate of P5C is an ONE_OR_MORE
  variant set: (1) the fungal proline-shuttle route (P5C reductase in the
  cytosol, then mitochondrial proline dehydrogenase and P5C dehydrogenase;
  PMID:6997271, PMID:7009582); (2) a proline end-point used anaerobically,
  when proline oxidation is blocked (PMID:12620851); (3) direct oxidation by
  P5C dehydrogenase where ornithine aminotransferase is mitochondrial
  (animals, plants; PMID:18419821). The P5C reductase, proline dehydrogenase
  and P5C dehydrogenase roles are the same as in proline_metabolism and use
  the same representatives. P5C/semialdehyde interconversion is
  non-enzymatic and is not modelled as a step. YeastCyc corrections: PUT2
  (P07275) added as catalyst of RXN-14116, which has no gene in YeastCyc;
  PUT1 and PUT2 are mitochondrial, not cytosolic. S. pombe has two arginases
  (car1 and aru1, both PANTHER PTHR43782:SF3), and both are needed for
  arginine conversion (PMID:26075619). Plant arginases (for example
  Arabidopsis ARGAH2, Q9ZPF5) fall in the separate arginase/agmatinase family
  PTHR11358, so they are not representatives of the PTHR43782 selector.
  Hepatic ARG1 acts in the urea cycle (modules/urea_cycle.yaml); ARG2 is
  given as the mitochondrial, non-ureagenic animal exemplar. Excluded from
  the module: urea degradation (DUR1,2 urea amidolyase in fungi, urease in
  plants), arginine and proline uptake, nitrogen catabolite repression and
  ArgR/Mcm1 induction, and the arginase-OTCase "epiarginase" complex
  (GO:1903269). That complex is a regulatory link in which arginase bound to
  substrate inhibits ARG3 ornithine carbamoyltransferase, preventing futile
  re-synthesis of arginine during catabolism (PMID:12679340). It is recorded
  here and in the ARG3/CAR1 reviews rather than as a module step. GO-CAM
  disagreements: both YeastPathways models put every activity in cytosol,
  including mitochondrial PUT1 and PUT2. ARG-PRO-PWY also has no P5C
  dehydrogenase, consistent with its anaerobic end-point. The PomBase model
  678073a900003902, linked here for the S. pombe arginases and car2, places
  car1 and aru1 arginase activities in GO:0000050 urea cycle. S. pombe has
  no ornithine carbamoyltransferase-based ureagenic cycle, so L-arginine
  catabolic process is the better process term.
