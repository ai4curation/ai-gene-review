id: MODULE:arginine_catabolism_arginase_pathway
title: Arginine catabolism via arginase and ornithine aminotransferase
description: Arginase and ornithine aminotransferase route arginine through ornithine to glutamate 5-semialdehyde,
  which equilibrates spontaneously with pyrroline-5-carboxylate (P5C). This comparative module covers
  demonstrated budding- and fission-yeast, Arabidopsis and human enzymes, without asserting identical
  flux or compartmentation throughout Eukaryota. In budding yeast, cytosolic P5C reduction makes proline,
  which can enter mitochondrial proline oxidation and semialdehyde oxidation; anaerobic cultures instead
  retain proline as an endpoint. Mitochondrial ornithine aminotransferase and P5C dehydrogenase permit
  direct semialdehyde oxidation in the plant and animal implementations. The aminotransferase is reversible,
  and its intestinal biosynthetic direction is outside this catabolic boundary. Plant arginases belong
  to a distinct arginase/agmatinase family. Urea disposal, transmembrane substrate supply, arginine re-synthesis,
  polyamine synthesis and regulation remain adjoining pathways.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: YeastPathways:ARGDEG-YEAST-PWY
  title: arginine degradation (aerobic) (S. cerevisiae, SGD YeastPathways)
  statement: YeastCyc lists ARGINASE-RXN (CAR1), ORNITHINE-GLU-AMINOTRANSFERASE-RXN (CAR2), spontaneous
    cyclization, PYRROLINECARBREDUCT-RXN (PRO3), RXN-14903 (PUT1) and RXN-14116 with no catalyst; PUT2
    (P07275) was added for RXN-14116. The aerobic route is the proline-shuttle variant.
  url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=ARGDEG-YEAST-PWY
- source_id: YeastPathways:ARG-PRO-PWY
  title: L-arginine degradation VI (arginase 2 pathway) (S. cerevisiae, SGD YeastPathways)
  statement: YeastCyc lists CAR1, CAR2, spontaneous cyclization and PRO3, ending at proline; this is the
    anaerobic proline end-point variant. Gene assignments were retained.
  url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=ARG-PRO-PWY
- source_id: GO:0006527
  title: L-arginine catabolic process
  statement: Module-level process.
- source_id: GO:0006593
  title: L-ornithine catabolic process
  statement: The ornithine aminotransferase step onward is ornithine catabolism.
- source_id: PMID:6094498
  title: Nucleotide sequence of the Saccharomyces cerevisiae arginase gene (CAR1) and its transcription
    under various physiological conditions.
  statement: CAR1 encodes S. cerevisiae arginase.
- source_id: PMID:7985419
  title: Cloning and sequencing of Schizosaccharomyces pombe car1 gene encoding arginase. Expression of
    the arginine anabolic and catabolic genes in response to arginine and related metabolites.
  statement: S. pombe car1 encodes an arginase that complements a S. cerevisiae car1 mutant; its synthesis
    is induced by arginine.
- source_id: PMID:26075619
  title: Deletion of Genes Encoding Arginase Improves Use of "Heavy" Isotope-Labeled Arginine for Mass
    Spectrometry in Fission Yeast.
  statement: Fission-yeast car1/aru1 double deletion prevents virtually all measured isotope-arginine conversion. The authors propose
    an Arg3-dependent ornithine/citrulline/arginine re-synthesis route to explain isotope pre-peaks; the
    old claim that this yeast lacks the route is contradicted.
  supporting_text: ornithine carbamoyl transferase Arg3 is part of the “arginine re-synthesis pathway”
- source_id: PMID:3036506
  title: Molecular characterization of transposable-element-associated mutations that lead to constitutive
    L-ornithine aminotransferase expression in Saccharomyces cerevisiae.
  statement: CAR2 (cargB) encodes ornithine aminotransferase, an inducible enzyme.
- source_id: PMID:6997271
  title: 'Proline: an essential intermediate in arginine degradation in Saccharomyces cerevisiae.'
  statement: Budding-yeast mutants establish a proline intermediate between ornithine-derived P5C and
    mitochondrial glutamate formation under the studied conditions. This is not a demonstration in all
    fungi.
  supporting_text: Put- mutants excreted proline when grown on arginine or ornithine as the sole nitrogen
    source.
- source_id: PMID:7009582
  title: Subcellular compartmentation in control of converging pathways for proline and arginine metabolism
    in Saccharomyces cerevisiae.
  statement: Fractionation separates budding-yeast cytoplasmic P5C reductase from particulate P5C dehydrogenase;
    the original study calls the latter presumably mitochondrial.
  supporting_text: are physically separated in yeast cells.
- source_id: PMID:387737
  title: 'Genetics and physiology of proline utilization in Saccharomyces cerevisiae: enzyme induction
    by proline.'
  statement: The arginine-degradative pathway intersects proline degradation at P5C, and arginine-derived
    P5C induces the Put enzymes through its conversion to proline.
- source_id: PMID:25112878
  title: Proline biosynthesis is required for endoplasmic reticulum stress tolerance in Saccharomyces
    cerevisiae.
  statement: Under the tested culture conditions, pro1 and pro2 nulls grow without added proline whereas
    pro3 nulls cannot, consistent with arginine catabolism supplying P5C to PRO3.
- source_id: PMID:12620851
  title: Improved anaerobic use of arginine by Saccharomyces cerevisiae.
  statement: Anaerobic budding yeast normally retains one arginine nitrogen in proline. Engineered pro3
    ure2 cells expressing targeting-sequence-deleted PUT2 bypass this limitation; the experiment does
    not establish endogenous cytosolic PUT2.
  supporting_text: assimilation of all four rather than just three of the nitrogen atoms in arginine.
- source_id: PMID:18419821
  title: Ornithine-delta-aminotransferase is essential for arginine catabolism but not for proline biosynthesis.
  statement: Arabidopsis mitochondrial OAT is necessary for use of supplied arginine or ornithine as nitrogen;
    loss of OAT does not impair stress-induced proline accumulation in the tested conditions. This supports
    a catabolic connection to mitochondrial P5CDH, not universal absence of ornithine-derived proline
    in all plants.
  supporting_text: These findings demonstrated that oat mutants could not use Arg or Orn as nitrogen sources for growth.
- source_id: PMID:12679340
  title: 'Yeast epiarginase regulation, an enzyme-enzyme activity control: identification of residues
    of ornithine carbamoyltransferase and arginase responsible for enzyme catalytic and regulatory activities.'
  statement: Arginase and OTCase form a one-to-one complex in the presence of ornithine and arginine,
    inhibiting OTCase while arginase remains active.
- source_id: PMID:28272331
  title: Ornithine Aminotransferase, an Important Glutamate-Metabolizing Enzyme at the Crossroads of Multiple
    Metabolic Pathways.
  statement: Comparative review distinguishes demonstrated cytosolic fungal OAT from mitochondrial plant
    and mammalian OAT. Mammalian intestinal OAT can support ornithine/arginine synthesis, so the catabolic
    direction is conditional, not a universal property of OAT expression.
  supporting_text: with the notable exception of the intestine, where citrulline (Cit) or arginine (Arg)
    are end products.
- source_id: PMID:41887919
  title: 'Current Insight into Human Ornithine Aminotransferase: A Review.'
  statement: Human OAT review corroborates reversible PLP chemistry and spontaneous GSA/P5C equilibration.
    Its broad fungal localization statement is limited here to the demonstrated exemplars and is not evidence
    that every fungus uses the budding-yeast proline detour.
  supporting_text: The GSA undergoes spontaneous cyclization
- source_id: PMID:26284079
  title: Physiological implications of arginine metabolism in plants.
  statement: Plant arginine-metabolism review links mitochondrial arginine utilization to nitrogen remobilization
    and distinguishes it from plastid biosynthesis. Transporter roles are condition dependent; this review
    alone does not prove an obligatory carrier or universal flux through every downstream branch.
  supporting_text: It is thus conceivable that arginine catabolism serves on the one hand to mobilize nitrogen storages
- source_id: PMID:39952693
  title: Biochemistry, pharmacology, and in vivo function of arginases.
  statement: Recent mammalian arginase review supports mitochondrial ARG2 as distinct from hepatic ARG1
    and explicitly cautions that expression, localization and activity differ among humans, primates and
    rodents. Immune and vascular effects are context, outside this catalytic module.
  supporting_text: there are significant differences in Arg1 and Arg2 expression, cellular localization,
    and activity in humans and primates as compared to rodents
- source_id: PMID:29412048
  title: 'Arginase: A Multifaceted Enzyme Important in Health and Disease.'
  statement: 'Reviewed as background, with a specific cross-taxon passage rejected: the statement that
    most bacteria, plants and yeasts have one mitochondrial ARG2 cannot establish localization or copy
    number. Bacteria lack mitochondria, fission yeast has two demonstrated arginases, and Arabidopsis
    has two ARGAHs. Primary target evidence governs the module.'
  supporting_text: Most plants, bacteria, yeasts, and invertebrates have only one arginase isoform
- source_id: PMID:1939179
  title: Roles of metal ions in the maintenance of the tertiary and quaternary structure of arginase from
    Saccharomyces cerevisiae.
  statement: Purified S. cerevisiae CAR1 had a weakly bound catalytic Mn ion and a more tightly bound
    predominantly Zn structural site. Do not turn the binuclear-Mn architecture of other arginases into
    a universal metal-occupancy assertion.
  supporting_text: binding of a weakly bound Mn2+ ion confers catalytic activity.
- source_id: PMID:8898077
  title: Molecular cloning of cDNA for nonhepatic mitochondrial arginase (arginase II) and comparison
    of its induction with nitric oxide synthase in a murine macrophage-like cell line.
  statement: Human ARG2 precursor was imported into isolated mitochondria and processed. The same paper
    studies induction in a murine macrophage cell line; that regulatory result is not a human-cell assay.
  supporting_text: The arginase II precursor synthesized in vitro was imported into isolated mitochondria
    and proteolytically processed.
- source_id: PMID:32754173
  title: The Neighboring Subunit Is Engaged to Stabilize the Substrate in the Active Site of Plant Arginases.
  statement: Primary structures of Arabidopsis ARGAH1 and Medicago arginase show hexameric plant enzymes,
    Mn-containing active sites and intersubunit ornithine recognition. These support the distinct plant
    arginase/agmatinase family, not a universal oligomeric state for all arginases.
  supporting_text: plant hexameric arginases engage a long loop from the neighboring subunit
- source_id: PMID:35752016
  title: Phosphatidic acid binds to and stimulates the activity of ARGAH2 from Arabidopsis.
  statement: Recombinant Arabidopsis ARGAH2 arginase activity and its stimulation by phosphatidic acid
    were measured directly; the plant family is included for arginine hydrolysis independently of its
    additional agmatinase activity.
  supporting_text: PA binding to AtARGAH2 leads to the enhancement of arginase enzymatic activity in a
    dose dependent manner.
- source_id: PMID:28716421
  title: Dual functioning of plant arginases provides a third route for putrescine synthesis.
  statement: Arabidopsis ARGAHs also support an ADC-linked agmatinase route in heterologous complementation
    and purified-enzyme assays. Chloroplast localization was observed by transient expression in Nicotiana;
    dominant native stress flux was proposed, not directly measured. This alternative chemistry lies outside
    the ornithine route.
  supporting_text: ARGAH genes in leaves of Nicotiana benthamiana, showed that these proteins are localized to the chloroplast.
- source_id: PMID:28345116
  title: Oligomeric State and Thermal Stability of Apo- and Holo- Human Ornithine δ-Aminotransferase.
  statement: Purified human OAT has a tetramer-dimer equilibrium; an engineered dimer retains catalytic
    features. A compulsory hexamer is not required for the module reaction.
  supporting_text: the catalytic unit of hOAT is the dimer.
- source_id: PMID:22516612
  title: The three-dimensional structural basis of type II hyperprolinemia.
  statement: Human ALDH4A1 catalysis and mutant inactivation ground semialdehyde oxidation. Ligand-bound
    high-resolution structures in this paper are from mouse; species provenance is retained.
  supporting_text: Mutation of Ser352 to Leu is shown to abolish catalytic activity and eliminate NAD(+)
    binding.
- source_id: PMID:11532180
  title: A nuclear gene encoding mitochondrial Delta-pyrroline-5-carboxylate dehydrogenase and its potential
    role in protection from proline toxicity.
  statement: Arabidopsis P5CDH was identified by complementation of yeast put2 and experimentally targeted
    to mitochondria. This establishes the plant catabolic enzyme without claiming Arabidopsis NAD-versus-NADP
    kinetics from another species.
  supporting_text: Complementation of the Deltaput2 mutant allowed identification of the Arabidopsis P5CDH
    gene.
- source_id: PMID:15548746
  title: The role of [Delta]1-pyrroline-5-carboxylate dehydrogenase in proline degradation.
  statement: Native Arabidopsis p5cdh mutants lack detectable proline degradation and are hypersensitive
    to arginine and ornithine, supporting convergence on the P5C/GSA catabolic pool together with the
    OAT experiments.
  supporting_text: p5cdh mutants were hypersensitive toward Pro and other molecules producing P5C, such
    as Arg and Orn.
- source_id: PMID:20435771
  title: Iron-dependent remodeling of fungal metabolic pathways associated with ferrichrome biosynthesis.
  statement: 'Fission-yeast arginases have distinguishable regulation: car1 is iron-repressed while car3
    (the aru1 synonym) is constitutively expressed in the assayed conditions. Ornithine supply to siderophore
    synthesis is an alternative output, outside this module.'
  supporting_text: Although car3(+) was constitutively expressed, car1(+) transcription levels were repressed
    upon exposure to iron
- source_id: PMID:32978391
  title: Yeast homologs of human MCUR1 regulate mitochondrial proline metabolism.
  statement: Put6/Put7 regulate mitochondrial proline metabolism; this study still describes proline entry
    through an unknown transporter. A regulatory mutant phenotype does not identify either protein as
    the carrier.
  supporting_text: Proline enters the mitochondria via an unknown transporter
- source_id: PMID:3125423
  title: 'Proline utilization in Saccharomyces cerevisiae: sequence, regulation, and mitochondrial localization
    of the PUT1 gene product.'
  statement: PUT1 mitochondrial targeting and oxygen-regulated expression were tested. High expression
    in respiratory-deficient cells separates transcriptional regulation from the respiratory electron-transfer
    requirement of proline utilization.
  supporting_text: PUT1 expression in a [rho-] strain grown either aerobically or anaerobically is as
    high
- source_id: PMID:20450881
  title: Purification and characterization of Put1p from Saccharomyces cerevisiae.
  statement: Purified budding-yeast Put1p directly oxidizes proline using ubiquinone-1 as electron acceptor.
    This supports the quinone-linked enzyme reaction without identifying molecular oxygen as the immediate
    acceptor or establishing purified fission-yeast kinetics.
  supporting_text: Put1p also exhibited high activity using ubiquinone-1 (CoQ(1)) as an electron acceptor
- source_id: PMID:3025596
  title: Amino-terminal fragments of delta 1-pyrroline-5-carboxylate dehydrogenase direct beta-galactosidase
    to the mitochondrial matrix in Saccharomyces cerevisiae.
  statement: Native budding-yeast PUT2 was localized to the mitochondrial matrix by fractionation and
    substrate latency. Fusion-protein targeting further tested its import sequence; fission-yeast matrix
    assignment remains comparative.
  supporting_text: was localized to the matrix compartment by a mitochondrial fractionation procedure.
notes: 'The taxon envelope denotes characterized eukaryotic implementations, not universal presence or
  physiological equivalence. The full proline detour and anaerobic endpoint have direct budding-yeast
  evidence; fission-yeast homologs and arginine-to-proline conversion support comparative coverage but
  do not independently demonstrate every shuttle step. ARG2 is the mitochondrial human exemplar; hepatic
  ARG1 and the complete ureagenic cycle are outside this boundary. Plant ARGAH1/ARGAH2 belong to PTHR11358,
  separate from PTHR43782 fungal/animal arginases, and their agmatinase activity is not the activity selected
  here. Mitochondrial localization supports the catabolic implementation; transient Nicotiana chloroplast
  localization and context-dependent regulation are preserved in the individual reviews. Human OAT and
  ALDH4A1 biochemical evidence replaces citations to review YAML files. P5C/GSA equilibration is spontaneous,
  with the open-chain aldehyde used by P5CDH; it is not assigned to an invented enzyme. SGD imports put
  mitochondrial PUT1/PUT2 activities in cytosol; primary localization evidence governs this module. The
  PomBase GO:0000050 annotations are not rejected merely because S. pombe is not a mammalian ureotelic
  organism: PMID26075619 explicitly models Arg3-dependent arginine re-synthesis. Its isotope data and
  proposed detailed route are distinguished. Epiarginase inhibition of ARG3 is a regulatory edge outside
  the catalytic chain. The 2018 arginase review contains an overgeneralized localization/copy-number statement
  and is not used as authority for it. Native flux is not inferred from family labels alone; exact PANTHER
  names may reflect a different dominant activity, so selectors retain explicit required functions.'
