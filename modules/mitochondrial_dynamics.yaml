  connections:
    - source: fzo1_omm_fusion
      target: eat3_imm_fusion
      connection_type: PRECEDES
      description: >-
        Outer-membrane fusion comes before inner-membrane fusion. The order is
        established in yeast and mammals (Fzo1/MFN, then Mgm1/OPA1). In worms
        the two steps are separated by phenotype: drp-1; eat-3 double mutants
        have connected outer membranes but separate matrix compartments.
      evidence:
        - source_id: PMID:18454199
          title: The C. elegans Opa1 homologue EAT-3 is essential for resistance to free radicals.
          statement: >-
            Without EAT-3, outer membranes stay connected while matrices remain
            separate, so the outer and inner fusion steps can be separated.
          supporting_text: >-
            Mitochondria with highly connected outer membranes (green) but not
            connected matrix compartments (red) in a muscle cell of the
            eat-3(ad426); drp-1(cq5) double mutant.
knowledge_gaps:
  - gap_statement: >-
      Whether the BCL-2-family protein CED-9, with or without EGL-1,
      regulates mitochondrial fission or fusion in living worm cells is
      unresolved.
    boundary: >-
      One study reports that CED-9 binds FZO-1 and that the EGL-1-CED-9
      complex recruits DRP-1. Another finds no effect of loss or gain of
      egl-1 or ced-9 on mitochondrial connectivity or size.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Decides whether a BCL-2-family switch between fusion and fission is
      conserved in nematodes.
    resolution: >-
      Quantitative live imaging of fission and fusion rates in ced-9 and egl-1
      null and gain-of-function backgrounds, with endogenous tagging of DRP-1
      and FZO-1 and in vivo interaction assays.
    provenance:
      - reference_id: PMID:21949250
        supporting_text: >-
          we show that the EGL-1-CED-9 complex promotes mitochondrial fission
          by recruiting DRP-1 to mitochondria
      - reference_id: PMID:19327994
        supporting_text: >-
          had no apparent effect on mitochondrial connectivity or mitochondrial
          size
  - gap_statement: >-
      The factor that recruits DRP-1 to worm mitochondria without MFF is
      unknown.
    boundary: >-
      The mff-1 mff-2 double mutant still shows some fission and DRP-1
      recruitment. FIS-1/FIS-2 are not needed for fission, and MiD49/MiD51
      homologs are absent.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Would complete the worm fission recruitment machinery.
    resolution: >-
      DRP-1 localization in fis-1 fis-2 mff-1 mff-2 quadruple mutants, and a
      suppressor or proximity-labeling screen for DRP-1 outer-membrane
      partners.
    provenance:
      - reference_id: PMID:24196833
        supporting_text: >-
          Fis1 and Mff are not absolutely required for mitochondrial fission
  - gap_statement: >-
      Whether MIRO-1 controls mitochondrial transport or distribution in C.
      elegans, and how this relates to the lower mitochondrial content and
      long lifespan of miro-1 mutants, is not established.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Would decide whether mitochondrial positioning should be added as a
      part of worm mitochondrial dynamics.
    resolution: >-
      Live imaging of mitochondrial motility in neurons and muscle of
      miro-1(tm1966) animals, with EF-hand and GTPase-domain point mutants.
    provenance:
      - reference_id: PMID:27064409
        supporting_text: >-
          the amount of mitochondria in the miro-1 mutant is reduced to
          approximately 50% of the wild-type
