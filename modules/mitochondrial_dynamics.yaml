id: MODULE:mitochondrial_dynamics
title: Mitochondrial fission and fusion
description: >-
  In animals and fungi, mitochondrial shape is set by a balance between
  fission and fusion carried out by three classes of dynamin-family GTPases.
  Fission of the outer membrane is driven by a dynamin-related protein
  (DNM1L/Drp1 in mammals, Dnm1 in budding yeast, DRP-1 in nematodes) that is
  recruited from the cytosol to constriction sites on the outer membrane.
  There it assembles into helices and uses GTP hydrolysis to constrict and
  sever the organelle. The same dynamin also divides peroxisomes. Recruitment
  depends on outer-membrane receptors whose identity differs between lineages:
  the tail-anchored adaptor MFF in animals, and Fis1 with the adaptors Mdv1 and
  Caf4 in budding yeast. In nematodes, the two MFF paralogs promote fission
  but are not essential for recruiting DRP-1. Fusion happens in two
  membrane-specific steps. Mitofusins (MFN1/MFN2, Fzo1, FZO-1) tether and fuse
  outer membranes. OPA1 and its orthologs (Mgm1 in yeast, EAT-3 in nematodes)
  fuse inner membranes; human L-OPA1 does this together with cardiolipin on
  the opposing membrane. When fusion is lost, unopposed fission fragments the
  mitochondrial network, and this fragmentation needs the fission dynamin.
  When fission is lost, the network becomes hyperconnected. The balance
  between the two is used in stress responses and in segregating damaged
  mitochondria for mitophagy.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:18722182
    title: >-
      Caenorhabditis elegans drp-1 and fis-2 regulate distinct cell-death
      execution pathways downstream of ced-3 and independent of ced-9.
    statement: >-
      The worm genome has single orthologs of the three mitochondrial dynamin
      GTPases.
    supporting_text: >-
      genome contains three genes, fzo-1, eat-3, and drp-1, which encode
      orthologs of MFN1/FZO1, OPA1, and DRP1, respectively.
  - source_id: PMID:18722182
    title: >-
      Caenorhabditis elegans drp-1 and fis-2 regulate distinct cell-death
      execution pathways downstream of ced-3 and independent of ced-9.
    statement: >-
      Fission requires drp-1, fusion requires fzo-1 and eat-3, and none of
      them is needed for programmed cell death.
    supporting_text: >-
      even though loss of drp-1 blocks mitochondrial fission, and loss of
      fzo-1 or eat-3 prevents mitochondrial fusion and causes excessive
      mitochondrial fission.
  - source_id: PMID:18722182
    title: >-
      Caenorhabditis elegans drp-1 and fis-2 regulate distinct cell-death
      execution pathways downstream of ced-3 and independent of ced-9.
    statement: >-
      Fission is epistatic to fusion: the fragmentation in fzo-1 mutants
      needs drp-1.
    supporting_text: >-
      indicating that drp-1 is required for the mitochondrial fragmentation
      observed in fzo-1 mutants
  - source_id: PMID:24196833
    title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
    statement: >-
      In worms Fis1 and Mff are not absolutely required for fission, and the
      FIS1 homologs have no obvious fission role.
    supporting_text: >-
      Fis1 and Mff are not absolutely required for mitochondrial fission
  - source_id: PMID:33734301
    title: Autophagy facilitates mitochondrial rebuilding after acute heat stress via a DRP-1-dependent process.
    statement: >-
      After acute heat stress the fragmented mitochondrial network is rebuilt
      by a DRP-1-dependent, autophagy-assisted process. This is one
      physiological use of the fission machinery.
    supporting_text: >-
      Autophagy facilitates mitochondrial rebuilding after acute heat stress
      via a DRP-1-dependent process.
  - source_id: file:genes/worm/drp-1/drp-1-ai-review.yaml
    title: worm drp-1 gene review
    statement: >-
      Core function: GTPase activity in mitochondrial fission at the
      mitochondrial outer membrane and cytosol.
  - source_id: file:genes/worm/mff-1/mff-1-ai-review.yaml
    title: worm mff-1 gene review
    statement: >-
      Core function: molecular adaptor activity in mitochondrial fission,
      redundant with MFF-2. MFF is not strictly required for DRP-1
      recruitment in worms.
  - source_id: file:genes/worm/fzo-1/fzo-1-ai-review.yaml
    title: worm fzo-1 gene review
    statement: >-
      Core function: GTPase activity in mitochondrial fusion at the outer
      membrane.
  - source_id: file:genes/worm/eat-3/eat-3-ai-review.yaml
    title: worm eat-3 gene review
    statement: >-
      Core function: GTPase activity in mitochondrial inner membrane fusion
      (GO:1990627) and cristae maintenance.
  - source_id: file:genes/worm/fis-1/fis-1-ai-review.yaml
    title: worm fis-1 gene review
    statement: >-
      FIS-1 does not detectably act in fission in worms. It acts after
      fission, in mitophagy, so it is modeled in MODULE:mitophagy.
  - source_id: file:projects/CAEEL_MITOPHAGY.md
    title: C. elegans Mitophagy and Mitochondrial Quality Control project page
    statement: >-
      Project page listing the worm mitochondrial dynamics gene reviews from
      which this module draws.
  - source_id: PMID:10559943
    title: The dynamin-related GTPase Dnm1 regulates mitochondrial fission in yeast.
    statement: >-
      In budding yeast, fission (Dnm1) and outer-membrane fusion (Fzo1)
      antagonize each other, and fission is epistatic to fusion, as in worms.
    supporting_text: >-
      dnm1 mutations block the mitochondrial fission and fragmentation
      normally observed in the fzo1 mutant strain
  - source_id: PMID:23921378
    title: >-
      Adaptor proteins MiD49 and MiD51 can act independently of Mff and Fis1
      in Drp1 recruitment and are specific for mitochondrial fission.
    statement: >-
      In mammals, Fis1 and Mff are receptors for Drp1 on both mitochondria and
      peroxisomes.
    supporting_text: >-
      Fis1 and Mff are Drp1 receptor/effector proteins of mitochondria and
      peroxisomes.
  - source_id: PMID:18445678
    title: >-
      Dnm1p-dependent peroxisome fission requires Caf4p, Mdv1p and Fis1p.
    statement: >-
      In budding yeast, Dnm1 recruitment for peroxisome fission uses the
      Fis1-Mdv1/Caf4 receptor system rather than MFF.
    supporting_text: >-
      Dnm1p-dependent peroxisome fission requires Caf4p, Mdv1p and Fis1p
  - source_id: file:genes/human/DNM1L/DNM1L-ai-review.yaml
    title: human DNM1L gene review
    statement: >-
      Core functions: GTPase activity in mitochondrial fission and in
      peroxisome fission, at the outer membrane, cytosol and peroxisome.
  - source_id: file:genes/yeast/DNM1/DNM1-ai-review.yaml
    title: yeast DNM1 gene review
    statement: >-
      Core functions: GTPase activity in mitochondrial fission and, recruited
      by Fis1/Mdv1/Caf4, in peroxisome fission.
  - source_id: file:genes/human/MFF/MFF-ai-review.yaml
    title: human MFF gene review
    statement: >-
      Core function: protein-membrane adaptor activity that recruits DNM1L to
      mitochondrial and peroxisomal fission sites.
  - source_id: file:genes/worm/mff-2/mff-2-ai-review.yaml
    title: worm mff-2 gene review
    statement: >-
      Core function: molecular adaptor activity in mitochondrial and
      peroxisomal fission, redundant with MFF-1. The adaptor function is
      inferred from family homology.
  - source_id: file:genes/human/MFN2/MFN2-ai-review.yaml
    title: human MFN2 gene review
    statement: >-
      Core function: GTPase activity in mitochondrial outer membrane fusion.
  - source_id: file:genes/human/OPA1/OPA1-ai-review.yaml
    title: human OPA1 gene review
    statement: >-
      Core functions: GTPase-dependent fusogenic activity in inner-membrane
      fusion, and, separately, membrane bending in cristae formation with
      MICOS.
notes: >-
  Boundary. This module covers the membrane-remodeling reactions that divide
  and join mitochondria: dynamin-related-protein outer-membrane fission with
  its outer-membrane receptor, mitofusin outer-membrane fusion, and
  OPA1-family inner-membrane fusion. Selective removal of mitochondria is
  MODULE:mitophagy, which uses MFF/DRP-1 fission upstream of the
  FIS-1/FIS-2-dependent disposal step in worm muscle. Cristae shaping by OPA1
  oligomers together with MICOS is a separable OPA1 function (S-OPA1 keeps
  cristae without supporting fusion, PMID:32245890) and is out of scope here.
  Mitochondrial transport and positioning (MIRO/TRAK) are also out of scope.

  Taxon scope. The context is Opisthokonta (animals and fungi), the clade in
  which all three GTPase classes are represented by reviewed members: worm,
  human and yeast for the fission dynamin, worm and human for mitofusin and
  OPA1. Fission dynamins are pan-eukaryotic: PAINT places mitochondrial
  fission on an animal DRP1 node (PTN002480309) and on a fungal Dnm1 node
  (PTN002480318), and plant DRP3-type proteins carry their own IBDs in
  PTHR11566. PAINT places the mitofusin GTPase/fusion node at Eukaryota
  (PTN002573358, taxon:2759), but no reviewed non-opisthokont mitofusin is
  included here. The OPA1-family fusion IBDs are on an animal node
  (PTN007514526, seeded by fly, mouse, human and worm) and, separately, on a
  fungal Mgm1 node (PTN008973437, seeded by S. pombe and S. cerevisiae). The
  fusion parts are therefore asserted only for opisthokonts, and a plant or
  protist version of this module would need different fusion parts.

  Fission receptor lineages. Receptors are the part that differs most between
  lineages. Animals use the tail-anchored adaptor MFF; vertebrates also use
  MiD49/MiD51, which can recruit Drp1 independently of Mff and Fis1
  (PMID:23921378). Budding yeast uses Fis1 with the WD40 adaptors Mdv1 and
  Caf4 (PMID:18445678). No yeast FIS1, MDV1 or CAF4 gene review exists in
  this repository, so the receptor is modeled as a single MFF-family annoton
  rather than as a taxon variant set. A Fis1-Mdv1/Caf4 variant should be added
  once those yeast proteins are reviewed. In worms the two MFF paralogs act
  redundantly, and the mff-1 mff-2 double mutant has a fission defect close to
  that of drp-1, but MFF is not absolutely required: DRP-1 still reaches worm
  mitochondria without it (PMID:24196833). The worm reviews therefore keep
  the parent term molecular adaptor activity (GO:0060090) for MFF-1/MFF-2,
  whereas the human MFF review supports the more specific protein-membrane
  adaptor activity (GO:0043495) from direct MFF-Drp1 binding.

  FIS1 homologs in worms. Worm FIS-1 and FIS-2 are not fission factors:
  neither single nor double mutants have a detectable fission or morphology
  defect (PMID:24196833, PMID:18722182). Both gene reviews give them
  mitophagy and disposal roles, so they are members of MODULE:mitophagy. FIS-1
  overexpression can still fragment mitochondria, even in the Mff double
  mutant, which is not evidence for an endogenous role.

  Unreviewed orthologs. Human MFN1, human FIS1, yeast Fzo1 (FZO1) and yeast
  Mgm1 (MGM1) have no gene review in this repository and are not used as
  representatives. Yeast Fzo1 and Mgm1 are the classic outer- and
  inner-membrane fusion GTPases and should be added as representatives once
  reviewed.

  PANTHER families. The fission dynamins fall in different PTHR11566
  (DYNAMIN) subfamilies in each species (worm SF21, human SF39, yeast SF235),
  and PTHR11566 also contains OPA1 and the endocytic dynamins, so no family
  term is asserted for the fission-dynamin role; the PAINT nodes and
  representatives carry the grounding. Mitofusins share PTHR10465, MFF-family
  adaptors share PTHR16501 (named after fly Tango11), and worm EAT-3 and
  human OPA1 share the subfamily PTHR11566:SF67. Family assignments are from
  the UniProt PANTHER cross-references of the representatives.

  BCL-2-family regulation in worms. CED-9 binds FZO-1 and, when bound to
  EGL-1, binds and recruits DRP-1 (PMID:21949250). Another group found that
  loss or gain of egl-1 or ced-9 had no effect on mitochondrial connectivity
  or size (PMID:19327994). CED-9 and EGL-1 are therefore not modeled as
  members, and the conflict is recorded as a knowledge gap.

  Members left out. MIRO-1 (Q94263) is an outer-membrane Rho GTPase that, in
  other animals, links mitochondria to microtubule motors. Its worm review
  supports GTPase, calcium-binding and kinesin-binding activities, but no
  cached primary paper shows a worm transport or distribution defect: the
  miro-1 mutant has about half the normal amount of mitochondria and a long
  lifespan (PMID:27064409). SPG-7 (Q9N3T5) is the worm AFG3L2-type m-AAA
  protease subunit of the inner membrane. Its review places it in
  mitochondrial protein processing, respiratory-chain assembly and the UPRmt,
  not in the dynamics machinery, and no worm evidence links it to EAT-3
  processing. MOMA-1 affects cristae morphology and is also left out.
module:
  id: mitochondrial_dynamics
  label: Mitochondrial fission and fusion
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Dynamin-family GTPase machinery that divides mitochondria (a
    dynamin-related protein recruited by an outer-membrane receptor) and fuses
    them (mitofusin at the outer membrane, OPA1/Mgm1 at the inner membrane).
    The balance between the two sets mitochondrial network morphology.
  concepts:
    - preferred_term: mitochondrion organization
      term:
        id: GO:0007005
        label: mitochondrion organization
      description: >-
        Broad parent context. The specific processes are on the part nodes.
  context:
    taxa:
      - preferred_term: Opisthokonta
        term:
          id: NCBITaxon:33154
          label: Opisthokonta
        description: >-
          Animals and fungi. Fission dynamins are pan-eukaryotic, but the
          mitofusin and OPA1/Mgm1 fusion parts are asserted only for
          opisthokonts (see notes).
    cellular_components:
      - preferred_term: mitochondrion
        term:
          id: GO:0005739
          label: mitochondrion
  parts:
    - order: 1
      role: outer-membrane fission
      node:
        id: drp1_fission
        label: Dynamin-related protein mitochondrial fission
        module_type: BIOLOGICAL_PROCESS
        description: >-
          A dynamin-related protein is recruited from the cytosol to spots on
          the mitochondrial outer membrane where scission later occurs. There
          it self-assembles into helices, constricts the organelle and severs
          the outer membrane using GTP hydrolysis. Outer-membrane receptors
          (MFF in animals, Fis1-Mdv1/Caf4 in budding yeast) recruit it. In
          worms the mff-1 mff-2 double mutant has a fission defect close to
          that of drp-1, but DRP-1 can still reach mitochondria without MFF,
          so another recruitment route must exist there.
        concepts:
          - preferred_term: mitochondrial fission
            term:
              id: GO:0000266
              label: mitochondrial fission
        evidence:
          - source_id: PMID:10619028
            title: C. elegans dynamin-related protein DRP-1 controls severing of the mitochondrial outer membrane.
            statement: >-
              In worm drp-1 mutants outer-membrane scission is blocked while
              inner-membrane scission still occurs.
            supporting_text: >-
              This indicates that scission of the mitochondrial outer membrane
              is inhibited, while scission of the inner membrane still occurs.
          - source_id: PMID:11514614
            title: Dynamin-related protein Drp1 is required for mitochondrial division in mammalian cells.
            statement: >-
              In mammalian cells, mutant Drp1 blocks mitochondrial division.
            supporting_text: >-
              cells with mutant Drp1 is a block in mitochondrial division
        annotons:
          - id: drp1_gtpase
            label: Fission dynamin GTPase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DRP1/Dnm1 mitochondrial fission dynamins
                description: >-
                  Fission-dynamin clade of the dynamin superfamily. No PANTHER
                  family term is asserted: PTHR11566 (DYNAMIN) also contains
                  OPA1 and endocytic dynamins, and the representatives fall
                  in different species-specific subfamilies.
                representative_members:
                  - preferred_term: DRP-1 (worm)
                    term:
                      id: UniProtKB:Q8WQC9
                      label: Dynamin-1-like protein drp-1
                  - preferred_term: DNM1L (human)
                    term:
                      id: UniProtKB:O00429
                      label: Dynamin-1-like protein
                  - preferred_term: DNM1 (budding yeast)
                    term:
                      id: UniProtKB:P54861
                      label: Dynamin-related protein DNM1
                ancestral_nodes:
                  - preferred_term: PAINT animal DRP1 mitochondrial fission node PTN002480309
                    term:
                      id: PANTHER:PTN002480309
                      label: PTN002480309
                    description: >-
                      PTHR11566 node with IBD support for mitochondrial fission
                      (GO:0000266), seeded by fly Drp1, mouse Dnm1l, human
                      DNM1L and worm drp-1.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002480309 in PTHR11566.
                  - preferred_term: PAINT fungal Dnm1 mitochondrial fission node PTN002480318
                    term:
                      id: PANTHER:PTN002480318
                      label: PTN002480318
                    description: >-
                      Dikarya node in PTHR11566 with IBD support for
                      mitochondrial fission, mitochondrion and peroxisome,
                      seeded by S. cerevisiae DNM1, S. pombe and C. albicans
                      orthologs.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002480318 in PTHR11566.
                  - preferred_term: PAINT peroxisome fission node PTN008520527
                    term:
                      id: PANTHER:PTN008520527
                      label: PTN008520527
                    description: >-
                      PTHR11566 node with IBD support for peroxisome fission
                      (GO:0016559), seeded by human DNM1L, mouse Dnm1l and
                      yeast DNM1 and VPS1.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN008520527 in PTHR11566.
            function:
              preferred_term: GTPase activity
              term:
                id: GO:0003924
                label: GTPase activity
            processes:
              - preferred_term: mitochondrial fission
                term:
                  id: GO:0000266
                  label: mitochondrial fission
              - preferred_term: peroxisome fission
                term:
                  id: GO:0016559
                  label: peroxisome fission
            locations:
              - preferred_term: mitochondrial outer membrane
                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
              - preferred_term: peroxisome
                term:
                  id: GO:0005777
                  label: peroxisome
            role_description: >-
              Mechanochemical GTPase recruited from the cytosol that
              constricts and severs the outer membrane at fission sites. The
              same GTPase divides peroxisomes, a shared use outside this
              module's boundary.
            evidence:
              - source_id: PMID:10619028
                title: C. elegans dynamin-related protein DRP-1 controls severing of the mitochondrial outer membrane.
                statement: >-
                  GFP-DRP-1 marks future scission sites, and overexpression
                  over-fragments mitochondria.
                supporting_text: >-
                  DRP-1 fused to GFP is observed in spots on mitochondria where
                  scission eventually occurs.
              - source_id: PMID:10619028
                title: C. elegans dynamin-related protein DRP-1 controls severing of the mitochondrial outer membrane.
                statement: >-
                  DRP-1 controls outer-membrane scission in the last stage of
                  division.
                supporting_text: >-
                  wild-type DRP-1 contributes to the final stages of
                  mitochondrial division by controlling scission of the
                  mitochondrial outer membrane
              - source_id: PMID:23977156
                title: Functional mapping of human dynamin-1-like GTPase domain based on x-ray structure analyses.
                statement: >-
                  Point mutations in the human DNM1L G domain abolish GTP
                  hydrolysis.
                supporting_text: >-
                  Amino acid substitutions Q34A, K38A, S39A, T59A, D146A,
                  G149A, K216A and D218A completely abolished GTP hydrolysis.
              - source_id: PMID:11553714
                title: >-
                  The GTPase effector domain sequence of the Dnm1p GTPase
                  regulates self-assembly and controls a rate-limiting step in
                  mitochondrial fission.
                statement: >-
                  Yeast Dnm1 binds and hydrolyzes GTP in vitro.
                supporting_text: >-
                  we show that bacterially expressed Dnm1p can bind and
                  hydrolyze GTP in vitro
              - source_id: PMID:21170049
                title: Conformational changes in Dnm1 support a contractile mechanism for mitochondrial fission.
                statement: >-
                  Dnm1 helices on lipid tubes constrict when GTP is added.
                supporting_text: >-
                  Dnm1-lipid tubes constrict by ~50 nm upon addition of GTP.
          - id: mff_adaptor
            label: MFF-family outer-membrane fission receptor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Mitochondrial fission factor (MFF) family adaptors
                description: >-
                  Tail-anchored outer-membrane adaptors of animals. Worm has
                  two paralogs, MFF-1 and MFF-2. Budding yeast lacks MFF and
                  uses Fis1-Mdv1/Caf4 instead (see notes).
                term:
                  id: PANTHER:PTHR16501
                  label: TRANSPORT AND GOLGI ORGANIZATION PROTEIN 11
                representative_members:
                  - preferred_term: MFF (human)
                    term:
                      id: UniProtKB:Q9GZY8
                      label: Mitochondrial fission factor
                  - preferred_term: MFF-1 (worm)
                    term:
                      id: UniProtKB:Q19343
                      label: Mitochondrial fission factor
                  - preferred_term: MFF-2 (worm)
                    term:
                      id: UniProtKB:P91344
                      label: Mitochondrial fission factor
            function:
              preferred_term: protein-membrane adaptor activity
              term:
                id: GO:0043495
                label: protein-membrane adaptor activity
              description: >-
                Supported for human MFF, which binds Drp1 and recruits it to
                mitochondria. The worm MFF-1 and MFF-2 reviews keep the parent
                term molecular adaptor activity (GO:0060090), because direct
                binding of worm MFF to DRP-1 has not been shown and worm MFF is
                not absolutely required for DRP-1 recruitment.
            processes:
              - preferred_term: mitochondrial fission
                term:
                  id: GO:0000266
                  label: mitochondrial fission
              - preferred_term: peroxisome fission
                term:
                  id: GO:0016559
                  label: peroxisome fission
            locations:
              - preferred_term: mitochondrial outer membrane
                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
            role_description: >-
              Outer-membrane receptor that recruits the fission dynamin to
              fission sites. Essential for Drp1 recruitment in mammalian
              cells, but redundant and not essential in worms.
            evidence:
              - source_id: PMID:21149567
                title: Mff is an essential factor for mitochondrial recruitment of Drp1 during mitochondrial fission in mammalian cells.
                statement: >-
                  Mammalian Mff binds Drp1 and acts at the Drp1 recruitment
                  step of fission.
                supporting_text: >-
                  Mff interacts with Drp1 both in vivo and in vitro.
              - source_id: PMID:21149567
                title: Mff is an essential factor for mitochondrial recruitment of Drp1 during mitochondrial fission in mammalian cells.
                statement: >-
                  Mff regulates the mitochondrial recruitment of Drp1.
                supporting_text: >-
                  indicating that Mff functions in mitochondrial fission by
                  regulating the mitochondrial recruitment step of Drp1
              - source_id: PMID:24196833
                title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
                statement: >-
                  Worm single mff mutants are weak, and the double mutant has a
                  fission defect close to drp-1.
                supporting_text: >-
                  mff-1 and mff-2 single mutants have weak effects, and that the
                  Mff double mutant has a mitochondrial fission defect similar
                  to but not as strong as the drp-1 defect
              - source_id: PMID:21248201
                title: >-
                  A novel mitochondrial outer membrane protein, MOMA-1, that
                  affects cristae morphology in Caenorhabditis elegans.
                statement: >-
                  Worm MFF-1 is used as an outer-membrane marker in
                  mitochondrial fractionation.
                supporting_text: >-
                  MFF-1 (an outer membrane marker)
              - source_id: PMID:21248201
                title: >-
                  A novel mitochondrial outer membrane protein, MOMA-1, that
                  affects cristae morphology in Caenorhabditis elegans.
                statement: >-
                  C. elegans has two FIS1 homologs and two Mff homologs.
                supporting_text: >-
                  has two Fis1 homologues, encoded by fis-1 and fis-2, and two
                  Mff homologues
    - order: 2
      role: outer-membrane fusion
      node:
        id: fzo1_omm_fusion
        label: Mitofusin mitochondrial outer membrane fusion
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Mitofusins are transmembrane dynamin-like GTPases of the outer
          membrane that tether apposed mitochondria and fuse their outer
          membranes. Mammals have two (MFN1 and MFN2), budding yeast has Fzo1
          and worms have the single mitofusin FZO-1. Loss of the mitofusin
          fragments the network, and the fragmentation needs the fission
          dynamin in both worms and yeast.
        concepts:
          - preferred_term: mitochondrial outer membrane fusion
            term:
              id: GO:1990626
              label: mitochondrial outer membrane fusion
        annotons:
          - id: fzo1_gtpase
            label: Mitofusin GTPase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Mitofusins (Fzo1/MFN family)
                term:
                  id: PANTHER:PTHR10465
                  label: TRANSMEMBRANE GTPASE FZO1
                representative_members:
                  - preferred_term: FZO-1 (worm)
                    term:
                      id: UniProtKB:Q23424
                      label: Transmembrane GTPase fzo-1
                  - preferred_term: MFN2 (human)
                    term:
                      id: UniProtKB:O95140
                      label: Mitofusin-2
                ancestral_nodes:
                  - preferred_term: PAINT mitofusin node PTN002573358
                    term:
                      id: PANTHER:PTN002573358
                      label: PTN002573358
                    description: >-
                      PTHR10465 node placed at Eukaryota with IBD support for
                      GTPase activity, mitochondrial fusion and mitochondrial
                      outer membrane, seeded by fly, human, mouse, rat and
                      yeast (FZO1) mitofusins.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002573358 in PTHR10465.
            function:
