    - order: 3
      role: inner-membrane fusion
      node:
        id: eat3_imm_fusion
        label: OPA1-family mitochondrial inner membrane fusion
        module_type: BIOLOGICAL_PROCESS
        description: >-
          OPA1-family dynamin GTPases of the inner membrane (OPA1 in mammals,
          Mgm1 in yeast, EAT-3 in worms) fuse inner membranes after outer
          membrane fusion. Human L-OPA1 on one membrane and cardiolipin on the
          other are sufficient for fusion, with GTP-independent tethering
          followed by GTP-hydrolysis-dependent fusion. In worm eat-3 mutants,
          matrix compartments are split by inner-membrane septa and cristae
          are disrupted; the animals are small, slow-growing, have small broods
          and are hypersensitive to paraquat. Cristae shaping by OPA1 with
          MICOS is a separate function and is out of scope here.
        concepts:
          - preferred_term: mitochondrial inner membrane fusion
            term:
              id: GO:1990627
              label: mitochondrial inner membrane fusion
