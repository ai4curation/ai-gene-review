id: MODULE:hepatic_trimethylamine_n_oxygenation
title: Hepatic trimethylamine N-oxygenation and metaorganismal TMAO synthesis
description: >-
  Conserved mammalian hepatic monooxygenase module in which endoplasmic
  reticulum membrane-anchored flavin-containing monooxygenase 3 (FMO3) catalyzes
  the NADPH- and O2-dependent N-oxygenation of gut microbiota-derived
  trimethylamine (TMA) to odorless trimethylamine N-oxide (TMAO), as well as the
  N- and S-oxygenation of diverse nucleophilic xenobiotics and drugs. In both
  humans and mice, dietary quaternary amines (phosphatidylcholine, choline,
  carnitine) are cleaved by gut microbial lyases (CutC/CutD, CntA/CntB) to
  release volatile TMA, which enters the portal circulation and is oxidized in
  hepatocytes by FMO3 via a stable C4a-hydroperoxyflavin intermediate. Loss of
  human FMO3 causes autosomal recessive trimethylaminuria (fish-odor syndrome),
  and loss of mouse Fmo3 abolishes hepatic TMA-to-TMAO conversion.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:9536088
    title: >-
      Mutations of the flavin-containing monooxygenase gene (FMO3) cause
      trimethylaminuria, a defect in detoxication.
    statement: >-
      Human FMO3 catalyzes the hepatic N-oxygenation of dietary-derived
      trimethylamine and xenobiotics; loss-of-function mutations cause
      trimethylaminuria.
    supporting_text: >-
      We show here that mutations in the human flavin-containing monooxygenase
      isoform 3 gene ( FMO3 ) impair N -oxygenation of xenobiotics and are
      responsible for the trimethylaminuria phenotype.
  - source_id: PMID:9776311
    title: >-
      Isoform specificity of trimethylamine N-oxygenation by human
      flavin-containing monooxygenase (FMO) and P450 enzymes: selective
      catalysis by FMO3.
    statement: >-
      At physiological pH, human FMO3 is the specific and efficient hepatic TMA
      N-oxygenase responsible for metabolic clearance of TMA to TMAO in vivo.
    supporting_text: >-
      Therefore, at physiological pH, human FMO3 is a very specific and
      efficient TMA N-oxygenase, and is likely responsible for the metabolic
      clearance of TMA in vivo in humans.
  - source_id: PMID:9344459
    title: >-
      Molecular cloning, sequencing, and expression in Escherichia coli of mouse
      flavin-containing monooxygenase 3 (FMO3): comparison with the human
      isoform.
    statement: >-
      Recombinant mouse and human FMO3 share conserved catalytic activity toward
      trimethylamine and nucleophilic S-/N-containing substrates.
    supporting_text: >-
      Catalytic activities of mouse and human FMO3 were high toward the
      substrate methimazole; however, in the presence of trimethylamine and
      thioacetamide, FMO-dependent methimazole oxidation by both enzymes was
      reduced by greater than 85%.
  - source_id: PMID:29981269
    title: >-
      Flavin monooxygenase 3, the host hepatic enzyme in the metaorganismal
      trimethylamine N-oxide-generating pathway, modulates platelet
      responsiveness and thrombosis risk.
    statement: >-
      Defines the two-step metaorganismal pathway in which gut microbial TMA
      lyases produce TMA from dietary precursors and host hepatic FMO3 converts
      portal-vein TMA into TMAO in mice and humans.
    supporting_text: >-
      Gut microbial TMA lyases use these nutrients as substrates to produce TMA,
      which upon delivery to the liver via the portal circulation, is converted
      into TMAO by host hepatic flavin monooxygenases (FMOs).
  - source_id: file:genes/human/FMO3/FMO3-ai-review.yaml
    title: Human FMO3 gene review
    statement: >-
      Grounds human FMO3 (UniProtKB:P31513) as the adult hepatic ER-anchored
      flavin-containing monooxygenase responsible for TMA N-oxygenation and
      xenobiotic N-/S-oxygenation.
  - source_id: file:genes/mouse/Fmo3/Fmo3-ai-review.yaml
    title: Mouse Fmo3 gene review
    statement: >-
      Grounds mouse Fmo3 (UniProtKB:P97501) as the orthologous hepatic
      flavin-containing monooxygenase required for TMA-to-TMAO conversion.
notes: >-
  Boundary: Gut microbial cleavage of dietary choline and carnitine to TMA by
  microbial CutC/CutD and CntA/CntB is upstream metaorganismal context supplying
  portal-vein TMA to hepatocytes. Within the hepatocyte endoplasmic reticulum
  membrane, NADPH--cytochrome P450 reductase (POR) is NOT required for FMO3
  catalysis because FMO3 directly binds NADPH and O2 to generate its own
  C4a-hydroperoxyflavin intermediate. Member genes with reviews in this
  repository: human/FMO3 (UniProtKB:P31513), mouse/Fmo3 (UniProtKB:P97501).
module:
  id: hepatic_trimethylamine_n_oxygenation
  label: Hepatic trimethylamine N-oxygenation
  module_type: METABOLIC_PATHWAY
  description: >-
    Endoplasmic reticulum membrane-anchored FMO3 reduces bound FAD with NADPH
    and reacts with O2 to form a stable C4a-hydroperoxyflavin intermediate that
    oxygenates gut microbiota-derived trimethylamine (TMA) to trimethylamine
    N-oxide (TMAO) and detoxifies nucleophilic N- and S-containing xenobiotics.
