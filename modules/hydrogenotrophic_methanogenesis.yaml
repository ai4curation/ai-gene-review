id: MODULE:hydrogenotrophic_methanogenesis
title: Hydrogenotrophic methanogenesis from CO2 (Methanothermobacter)
description: 'Methane formation from CO2 and H2 in Methanobacteriales. CO2 is bound to methanofuran
  and reduced to the formyl level, the formyl group is transferred to tetrahydromethanopterin (H4MPT),
  and the C1 unit is reduced through the methenyl, methylene and methyl levels. The methyl group is
  transferred to coenzyme M by a membrane-bound, Na+-pumping methyltransferase, and methyl-coenzyme M
  is reduced to methane with coenzyme B, releasing the heterodisulfide CoM-S-S-CoB. Electrons come from
  H2 by three routes: F420 reduced by the F420-reducing hydrogenase serves the methenyl and methylene
  reductions, the H2-forming methylene-H4MPT dehydrogenase can replace the F420 route for one step,
  and the cytoplasmic hydrogenase-heterodisulfide reductase complex couples heterodisulfide reduction
  to ferredoxin reduction by flavin-based electron bifurcation, supplying the reduced ferredoxin for
  the first step. Several steps are catalysed by multisubunit complexes whose subunits each carry part
  of the reaction.'
status: DRAFT
scope: CONCRETE
evidence:
- &ev_bifurcation
  source_id: PMID:21262829
  title: Coupling of ferredoxin and heterodisulfide reduction via electron bifurcation in hydrogenotrophic
    methanogenic archaea.
  statement: Shows that the MvhADG-HdrABC complex reduces ferredoxin only together with the heterodisulfide,
    linking the last step of the pathway to the first.
- &ev_fwd
  source_id: PMID:27846502
  title: The methanogenic CO2 reducing-and-fixing enzyme is bifunctional and contains 46 [4Fe-4S] clusters.
  statement: Structure of the tungsten formylmethanofuran dehydrogenase; CO2 is reduced to formate at
    the FwdBD tungsten site and condensed with methanofuran at the FwdA amidohydrolase site.
- &ev_ftr
  source_id: PMID:3097011
  title: 'The role of formylmethanofuran: tetrahydromethanopterin formyltransferase in methanogenesis
    from carbon dioxide.'
  statement: Reconstitutes the formyltransferase and cyclohydrolase steps in CO2 reduction to methane.
- &ev_frh_mtd_hmd
  source_id: PMID:18487331
  title: Roles of coenzyme F420-reducing hydrogenases and hydrogen- and F420-dependent methylenetetrahydromethanopterin
    dehydrogenases in reduction of F420 and production of hydrogen during methanogenesis.
  statement: Describes the F420-reducing hydrogenase and the Hmd/Mtd pair as alternative routes for
    supplying electrons to the methenyl and methylene reductions.
- &ev_mtr
  source_id: PMID:7737157
  title: The energy conserving N5-methyltetrahydromethanopterin:coenzyme M methyltransferase complex from
    Methanobacterium thermoautotrophicum is composed of eight different subunits.
  statement: Purifies the eight-subunit membrane-associated methyltransferase.
- &ev_mcr
  source_id: PMID:30951290
  title: 'Methyl (Alkyl)-Coenzyme M Reductases: Nickel F-430-Containing Enzymes Involved in Anaerobic
    Methane Formation and in Anaerobic Oxidation of Methane or of Short Chain Alkanes.'
  statement: Review of methyl-coenzyme M reductase, the methane-forming enzyme.
- source_id: GO:0019386
  title: methanogenesis, from carbon dioxide
  statement: The module realizes this GO process.
notes: 'Concrete module for Methanothermobacter thermautotrophicus strain Delta H, with the reviewed
  genes in genes/METTH/. Most of the biochemistry was done on the closely related strain Marburg
  (Methanothermobacter marburgensis); the Delta H reviews record sequence identities to the Marburg
  orthologs. The C1 steps on H4MPT are the archaeal counterpart of the methyl branch of the Wood-Ljungdahl
  pathway (modules/wood_ljungdahl_pathway.yaml), but here the methyl group goes to coenzyme M and methane,
  not to acetyl-CoA. Energy conservation is through the Na+ gradient built by Mtr; the anaplerotic
  energy-converting hydrogenases (Eha, Ehb) that supply reduced ferredoxin when bifurcation falls short
  are left out. Three activities have no GO term and are given by name only, as proposed in the gene
  reviews: the two half-reactions of formylmethanofuran dehydrogenase (FwdB, FwdA) and the bifurcating
  H2:CoB-CoM heterodisulfide,ferredoxin reductase reaction. GO:0051912 (CoB--CoM heterodisulfide reductase
  activity) is deliberately not used, because it is defined with methanophenazine as the electron acceptor,
  which this organism lacks. M. jannaschii orthologs (genes/METJA/mcrA, mtrA, hdrA) are reviewed separately.'
module:
  id: hydrogenotrophic_methanogenesis
  label: Hydrogenotrophic methanogenesis from CO2
  module_type: METABOLIC_PATHWAY
  description: Seven C1 steps from CO2 to methane, plus the two electron-supply reactions that link
    H2 oxidation to them.
  concepts:
  - preferred_term: methanogenesis, from carbon dioxide
    term:
      id: GO:0019386
      label: methanogenesis, from carbon dioxide
  context:
    taxa:
    - preferred_term: Methanothermobacter thermautotrophicus str. Delta H
      term:
        id: NCBITaxon:187420
        label: Methanothermobacter thermautotrophicus str. Delta H
    cellular_components:
    - preferred_term: cytoplasm
      term:
        id: GO:0005737
        label: cytoplasm
  parts:
  - order: 1
    role: CO2 reduction to formylmethanofuran
    node:
      id: co2_formylation
      label: CO2 reduction and formylation of methanofuran
      module_type: REACTION
      annotons:
      - id: fwd
        label: Tungsten formylmethanofuran dehydrogenase
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: tungsten formylmethanofuran dehydrogenase FwdABCDFG
            term:
              id: GO:0044675
              label: formyl-methanofuran dehydrogenase (tungsten enzyme) complex
            active_units:
            - id: fwd_b
              label: FwdB, tungsten-pterin subunit
              role: Reduces CO2 to formate at the tungsten bis-pterin site, with reduced ferredoxin
                as electron donor; GO has no term for this half-reaction.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: MTH_1559 (FwdB)
                  term:
                    id: UniProtKB:O27601
                    label: formylmethanofuran dehydrogenase subunit B
              function:
                preferred_term: formate dehydrogenase activity (acceptor-unspecified)
                description: No GO term; proposed in the MTH_1559 gene review.
            - id: fwd_a
              label: FwdA, binuclear-zinc amidohydrolase subunit
              role: Condenses the formate delivered through an internal tunnel with methanofuran to
                give formylmethanofuran (RHEA:24686, in reverse); GO has no term for this half-reaction.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: MTH_1557 (FwdA)
                  term:
                    id: UniProtKB:O27599
                    label: Tungsten formylmethanofuran dehydrogenase, subunit A
              function:
                preferred_term: formylmethanofuran amidohydrolase activity
                description: No GO term; proposed in the MTH_1557 gene review.
        function:
          preferred_term: formylmethanofuran dehydrogenase activity
          term:
            id: GO:0018493
            label: formylmethanofuran dehydrogenase activity
          substrates:
          - preferred_term: CO2
          - preferred_term: methanofuran
          - preferred_term: reduced ferredoxin
          products:
          - preferred_term: N-formylmethanofuran
          - preferred_term: oxidized ferredoxin
        role_description: Fixes CO2 onto methanofuran, the most endergonic step, driven by reduced
          ferredoxin from electron bifurcation. A molybdenum isoenzyme (Fmd) also exists.
        evidence:
        - *ev_fwd
  - order: 2
    role: formyl transfer to H4MPT
    node:
      id: formyl_transfer
      label: Formyl transfer from methanofuran to H4MPT
      module_type: REACTION
      annotons:
      - id: ftr
        label: Formylmethanofuran:H4MPT formyltransferase
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: ftr (MTH_1259)
            term:
              id: UniProtKB:P21348
              label: Formylmethanofuran--tetrahydromethanopterin formyltransferase
        function:
          preferred_term: formylmethanofuran-tetrahydromethanopterin N-formyltransferase activity
          term:
            id: GO:0030270
            label: formylmethanofuran-tetrahydromethanopterin N-formyltransferase activity
          substrates:
          - preferred_term: N-formylmethanofuran
          - preferred_term: tetrahydromethanopterin
          products:
          - preferred_term: N5-formyl-H4MPT
          - preferred_term: methanofuran
        evidence:
        - *ev_ftr
  - order: 3
    role: cyclization to methenyl-H4MPT
    node:
      id: cyclohydrolysis
      label: Cyclization of formyl-H4MPT
      module_type: REACTION
      annotons:
      - id: mch
        label: Methenyl-H4MPT cyclohydrolase
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: mch (MTH_773)
            term:
              id: UniProtKB:O26867
              label: Methenyltetrahydromethanopterin cyclohydrolase
        function:
          preferred_term: methenyltetrahydromethanopterin cyclohydrolase activity
          term:
            id: GO:0018759
            label: methenyltetrahydromethanopterin cyclohydrolase activity
          substrates:
          - preferred_term: N5-formyl-H4MPT
          products:
          - preferred_term: 5,10-methenyl-H4MPT
        role_description: Runs in the reverse of the direction in which the EC reaction is written,
          closing the imidazolinium ring.
        evidence:
        - *ev_ftr
  - order: 4
    role: reduction to methylene-H4MPT
    node:
      id: methenyl_reduction
      label: Reduction of methenyl-H4MPT
      module_type: REACTION
      variant_sets:
      - id: methenyl_reduction_donor
        label: Electron donor for methenyl-H4MPT reduction
        axis: electron donor (reduced F420 or H2)
        selection: ONE_OR_MORE
        notes: Both enzymes are present; Hmd is induced, and Mtd and Frh repressed, under nickel limitation,
          since Hmd needs no nickel.
        variants:
        - id: mtd_route
          label: F420-dependent route (Mtd)
          module_type: REACTION
          annotons:
          - id: mtd
            label: F420-dependent methylene-H4MPT dehydrogenase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: mtd (MTH_1464)
                term:
                  id: UniProtKB:Q50501
                  label: F420-dependent methylenetetrahydromethanopterin dehydrogenase
            function:
              preferred_term: methylenetetrahydromethanopterin dehydrogenase activity
              term:
                id: GO:0030268
                label: methylenetetrahydromethanopterin dehydrogenase activity
              substrates:
              - preferred_term: 5,10-methenyl-H4MPT
              - preferred_term: reduced coenzyme F420
              products:
              - preferred_term: 5,10-methylene-H4MPT
              - preferred_term: coenzyme F420
            evidence:
            - *ev_frh_mtd_hmd
        - id: hmd_route
          label: H2-dependent route (Hmd)
          module_type: REACTION
          annotons:
          - id: hmd
            label: H2-forming methylene-H4MPT dehydrogenase ([Fe]-hydrogenase)
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: hmd (MTH_1142)
                term:
                  id: UniProtKB:O27211
                  label: 5,10-methenyltetrahydromethanopterin hydrogenase
            function:
              preferred_term: N5,N10-methenyltetrahydromethanopterin hydrogenase activity
              term:
                id: GO:0047068
                label: N5,N10-methenyltetrahydromethanopterin hydrogenase activity
              substrates:
              - preferred_term: 5,10-methenyl-H4MPT
              - preferred_term: H2
              products:
              - preferred_term: 5,10-methylene-H4MPT
            evidence:
            - *ev_frh_mtd_hmd
  - order: 5
    role: reduction to methyl-H4MPT
    node:
      id: methylene_reduction
      label: Reduction of methylene-H4MPT
      module_type: REACTION
      annotons:
      - id: mer
        label: F420-dependent methylene-H4MPT reductase
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: mer (MTH_1752)
            term:
              id: UniProtKB:O27784
              label: 5,10-methylenetetrahydromethanopterin reductase
        function:
          preferred_term: coenzyme F420-dependent N5,N10-methenyltetrahydromethanopterin reductase activity
          term:
            id: GO:0018537
            label: coenzyme F420-dependent N5,N10-methenyltetrahydromethanopterin reductase activity
          substrates:
          - preferred_term: 5,10-methylene-H4MPT
          - preferred_term: reduced coenzyme F420
          products:
          - preferred_term: 5-methyl-H4MPT
          - preferred_term: coenzyme F420
        role_description: The GO term name says methenyl, but its definition is the methylene-to-methyl
          reduction catalysed by Mer.
        evidence:
        - *ev_frh_mtd_hmd
  - order: 6
    role: methyl transfer to coenzyme M
    node:
      id: methyl_transfer
      label: Methyl transfer from H4MPT to coenzyme M
      module_type: REACTION
      annotons:
      - id: mtr
        label: Na+-translocating methyl-H4MPT:coenzyme M methyltransferase
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: MtrA-H methyltransferase complex
            term:
              id: GO:0044677
              label: methyl-tetrahydromethanopterin:coenzyme M methyltransferase complex
            active_units:
            - id: mtr_h
              label: MtrH, methyl-H4MPT demethylating subunit
              role: Transfers the methyl group from methyl-H4MPT to the MtrA cobamide (first half-reaction,
                not coupled to Na+).
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: mtrH (MTH_1156)
                  term:
                    id: UniProtKB:O27224
                    label: Tetrahydromethanopterin S-methyltransferase subunit H
              function:
                preferred_term: 5-methyl-5,6,7,8-tetrahydromethanopterin-dependent methyltransferase
                  activity
                term:
                  id: GO:0042086
                  label: 5-methyl-5,6,7,8-tetrahydromethanopterin-dependent methyltransferase activity
            - id: mtr_a
              label: MtrA, cobamide methyl-carrier subunit
              role: Carries the methyl group on its 5-hydroxybenzimidazolyl cobamide; its demethylation
                by coenzyme M at MtrCDE is the Na+-pumping step. GO has no corrinoid carrier activity
                term.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: mtrA1 (MTH_1159)
                  term:
                    id: UniProtKB:O27227
                    label: Tetrahydromethanopterin S-methyltransferase subunit A 1
              function:
                preferred_term: cobalamin binding
                term:
                  id: GO:0031419
                  label: cobalamin binding
        function:
          preferred_term: tetrahydromethanopterin S-methyltransferase activity
          term:
            id: GO:0030269
            label: tetrahydromethanopterin S-methyltransferase activity
          substrates:
          - preferred_term: 5-methyl-H4MPT
          - preferred_term: coenzyme M
          - preferred_term: Na+ (cytoplasm)
          products:
          - preferred_term: methyl-coenzyme M
          - preferred_term: tetrahydromethanopterin
          - preferred_term: Na+ (outside)
        locations:
        - preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: The only energy-conserving step of the C1 chain, pumping Na+ out of the cell.
        evidence:
        - *ev_mtr
  - order: 7
    role: methane formation
    node:
      id: methane_formation
      label: Reduction of methyl-coenzyme M to methane
      module_type: REACTION
      annotons:
      - id: mcr
        label: Methyl-coenzyme M reductase
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: methyl-coenzyme M reductase (McrABG)2 with coenzyme F430
            term:
              id: GO:0044674
              label: methyl coenzyme M reductase complex
            active_units:
            - id: mcr_a
              label: McrA, alpha subunit
              role: Carries the F430 nickel active site.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: mcrA (MTH_1164)
                  term:
                    id: UniProtKB:O27232
                    label: Methyl-coenzyme M reductase subunit alpha
              function:
                preferred_term: coenzyme-B sulfoethylthiotransferase activity
                term:
                  id: GO:0050524
                  label: coenzyme-B sulfoethylthiotransferase activity
        function:
          preferred_term: coenzyme-B sulfoethylthiotransferase activity
          term:
            id: GO:0050524
            label: coenzyme-B sulfoethylthiotransferase activity
          substrates:
          - preferred_term: methyl-coenzyme M
          - preferred_term: coenzyme B
          products:
          - preferred_term: methane
          - preferred_term: CoM-S-S-CoB heterodisulfide
        evidence:
        - *ev_mcr
  - order: 8
    role: heterodisulfide reduction coupled to ferredoxin reduction
    node:
      id: heterodisulfide_reduction
      label: Bifurcating heterodisulfide and ferredoxin reduction
      module_type: REACTION
      annotons:
      - id: mvh_hdr
        label: MvhADG-HdrABC hydrogenase-heterodisulfide reductase
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: MvhADG-HdrABC complex
            term:
              id: GO:0044678
              label: CoB-CoM heterodisulfide reductase complex
            active_units:
            - id: mvh_a
              label: MvhA, [NiFe] hydrogenase large subunit
              role: Oxidizes H2 at the [NiFe] site; electrons pass through MvhG and MvhD to HdrA.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: mvhA (MTH_1134)
                  term:
                    id: UniProtKB:Q50783
                    label: F420-non-reducing hydrogenase subunit A
              function:
                preferred_term: nickel cation binding
                term:
                  id: GO:0016151
                  label: nickel cation binding
            - id: hdr_a
              label: HdrA, flavin bifurcation subunit
              role: Splits the electron pair at its FAD, sending one electron to ferredoxin and one
                towards HdrB.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: hdrA (MTH_1381)
                  term:
                    id: UniProtKB:O27434
                    label: H(2):CoB-CoM heterodisulfide,ferredoxin reductase subunit A
              function:
                preferred_term: electron transfer activity
                term:
                  id: GO:0009055
                  label: electron transfer activity
            - id: hdr_b
              label: HdrB, heterodisulfide-reducing subunit
              role: Cleaves CoM-S-S-CoB at its two noncubane [4Fe-4S] clusters.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: hdrB (MTH_1879)
                  term:
                    id: UniProtKB:O27907
                    label: H(2):CoB-CoM heterodisulfide,ferredoxin reductase subunit B
              function:
                preferred_term: 4 iron, 4 sulfur cluster binding
                term:
                  id: GO:0051539
                  label: 4 iron, 4 sulfur cluster binding
        function:
          preferred_term: H2:CoB-CoM heterodisulfide,ferredoxin reductase activity
          description: No GO term (EC 1.8.98.5, RHEA:55748); proposed in the METTH hdrA, hdrB and mvhA
            and METJA hdrA gene reviews.
          substrates:
          - preferred_term: CoM-S-S-CoB heterodisulfide
          - preferred_term: H2
          - preferred_term: oxidized ferredoxin
          products:
          - preferred_term: coenzyme M
          - preferred_term: coenzyme B
          - preferred_term: reduced ferredoxin
        role_description: Regenerates coenzymes M and B and, by flavin-based electron bifurcation,
          the reduced ferredoxin needed for CO2 reduction in step 1.
        evidence:
        - *ev_bifurcation
        - &ev_hdr_structure
          source_id: PMID:28818947
          title: Methanogenic heterodisulfide reductase (HdrABC-MvhAGD) uses two noncubane [4Fe-4S] clusters
            for reduction.
          statement: Structure of the complex; the heterodisulfide is reduced at the HdrB noncubane clusters.
  - order: 9
    role: F420 reduction by H2
    node:
      id: f420_reduction
      label: Reduction of coenzyme F420 by H2
      module_type: REACTION
      annotons:
      - id: frh
        label: F420-reducing [NiFe] hydrogenase
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: F420-reducing hydrogenase FrhABG
            active_units:
            - id: frh_a
              label: FrhA, [NiFe] large subunit
              role: Oxidizes H2 at the [NiFe] site.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: frhA (MTH_1300)
                  term:
                    id: UniProtKB:P19496
                    label: Coenzyme F420 hydrogenase subunit alpha
              function:
                preferred_term: nickel cation binding
                term:
                  id: GO:0016151
                  label: nickel cation binding
            - id: frh_g
              label: FrhG, iron-sulfur relay subunit
              role: Carries electrons from FrhA to FrhB through three [4Fe-4S] clusters.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: frhG (MTH_1298)
                  term:
                    id: UniProtKB:P19498
                    label: Coenzyme F420 hydrogenase subunit gamma
              function:
                preferred_term: electron transfer activity
                term:
                  id: GO:0009055
                  label: electron transfer activity
            - id: frh_b
              label: FrhB, FAD and F420 subunit
              role: Transfers a hydride from its FAD to F420.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: frhB (MTH_1297)
                  term:
                    id: UniProtKB:P19499
                    label: Coenzyme F420 hydrogenase subunit beta
              function:
                preferred_term: coenzyme F420 binding
                term:
                  id: GO:0070967
                  label: coenzyme F420 binding
        function:
          preferred_term: coenzyme F420 hydrogenase activity
          term:
            id: GO:0050454
            label: coenzyme F420 hydrogenase activity
          substrates:
          - preferred_term: H2
          - preferred_term: coenzyme F420
          products:
          - preferred_term: reduced coenzyme F420
        role_description: Supplies the reduced F420 used by Mtd (step 4) and Mer (step 5). GO has no
          complex term for this hydrogenase.
        evidence:
        - &ev_frh_structure
          source_id: PMID:23483797
          title: De novo modeling of the F(420)-reducing [NiFe]-hydrogenase from a methanogenic archaeon
            by cryo-electron microscopy.
          statement: Assigns the [NiFe] centre to FrhA, the iron-sulfur relay to FrhG and the FAD and
            F420 site to FrhB.
  connections:
