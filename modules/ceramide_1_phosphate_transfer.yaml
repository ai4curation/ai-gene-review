id: MODULE:ceramide_1_phosphate_transfer
title: Ceramide-1-phosphate production and cytosolic transfer
description: >-
  Ceramide-1-phosphate is produced on the cytoplasmic face of the Golgi/TGN
  from ceramide delivered from the endoplasmic reticulum. CERT1 transfers
  ceramide from the ER side to an ER-trans-Golgi network membrane contact site,
  CERK phosphorylates that ceramide to C1P at the cytoplasmic side of the
  trans-Golgi network membrane, and CPTP selectively transfers C1P through the
  cytosol toward the cytoplasmic face of the plasma membrane and other acceptor
  membranes. This module covers the CERT/CERK/CPTP branch that connects
  de-novo ceramide supply to C1P distribution, rather than the glucosylceramide,
  sphingomyelin, or sphingosine-1-phosphate arms of sphingolipid metabolism.
status: DRAFT
evidence:
  - source_id: file:gocams/68b0f0d000008519/68b0f0d000008519-review.yaml
    title: C16-Ceramide-1-P transport enabled by CPTP GO-CAM review
    statement: >-
      The reviewed human GO-CAM captures the CERT1/CERK/CPTP route for C16
      ceramide and C16 ceramide 1-phosphate at the Golgi.
  - source_id: file:human/CERK/CERK-ai-review.yaml
    title: CERK gene review (human)
    statement: >-
      The CERK core review places ceramide kinase activity in ceramide
      metabolism at the cytoplasmic side of the trans-Golgi network membrane.
  - source_id: PMID:17392267
    title: 'Ceramide kinase uses ceramide provided by ceramide transport protein: localization to organelles of eicosanoid synthesis.'
    statement: CERT supplies ceramide for newly synthesized C1P.
    supporting_text: >-
      downregulation of CERT by RNA interference technology dramatically
      reduced the levels of newly synthesized C1P
  - source_id: PMID:23863933
    title: Non-vesicular trafficking by a ceramide-1-phosphate transfer protein regulates eicosanoids.
    statement: Human CPTP specifically transfers C1P between membranes.
    supporting_text: human GLTPD1, named here CPTP, is shown to specifically transfer C1P between membranes
notes: >-
  The cached GO-CAM is human and C16-specific, but the module boundary is a
  reusable CERT/CERK/CPTP motif: ceramide handoff to the Golgi/TGN, ceramide
  phosphorylation, and C1P export. PTHR12358:SF25 plus PTN002644025 grounds the
  vertebrate CERK ceramide-kinase branch. CERT1 is grounded to its PANTHER
  subfamily and human representative; CPTP is kept as the human GO-CAM
  representative until a local PANTHER membership row or narrower family review
  can ground a species-neutral C1P-specific transfer family.
