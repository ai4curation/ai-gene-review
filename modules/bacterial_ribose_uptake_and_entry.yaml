  connections:
    - source: rbsabc_ribose_import
      target: rbsd_ribose_pyranase
      connection_type: PROVIDES_INPUT_FOR
      description: Imported cytoplasmic D-ribose is the substrate pool for RbsD.
    - source: rbsd_ribose_pyranase
      target: rbsk_ribose_phosphorylation
      connection_type: PROVIDES_INPUT_FOR
      description: RbsD accelerates formation of beta-D-ribofuranose for RbsK phosphorylation.
  knowledge_gaps:
    - gap_statement: >-
        RbsD catalyzes pyranose-to-furanose conversion, while ribofuranose
        anomers can exchange spontaneously in solution; the quantitative
        contribution of the RbsD-catalyzed step to pathway flux varies with
        physiological demand.
      boundary: >-
        Represent RbsD as a substantive catalytic operation without claiming
        that it is the only possible source of beta-D-ribofuranose or is
        universally essential in every bacterial implementation.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The substrate range of RbsABC-type importers outside E. coli is
        untested: the KT2440 PP_2454-PP_2459 complex has not been assayed for
        ribose transport, and the sequence features that distinguish ribose
        importers from the closely related allose (AlsBAC) importers in the
        same PANTHER subfamilies are unknown.
      boundary: >-
        Treat ribose specificity as carried by experimentally characterized
        exemplars and rbs operon context, not by PANTHER family membership.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        PP_2759 RbsA and PP_2760 form a second ATPase/permease pair, but their
        transported substrate and substrate-binding component are unresolved.
      boundary: >-
        Do not use the second locus to satisfy the D-ribose import step without
        substrate-specific evidence or a cognate binding-protein assignment.
      gap_kind:
        - BIOLOGY
