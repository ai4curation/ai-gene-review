id: MODULE:bacterial_ribose_uptake_and_entry
title: Bacterial D-ribose uptake and entry
description: >-
  A reusable bacterial route in which an RbsABC complex imports D-ribose,
  RbsD accelerates interconversion of the beta-pyranose and beta-furanose
  forms, and RbsK phosphorylates ribose to D-ribose 5-phosphate for entry into
  central carbon and nucleotide metabolism. Transcriptional regulation and
  downstream pentose-phosphate reactions are outside the module boundary.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0015752
    title: D-ribose transmembrane transport
    statement: Defines the substrate-specific import process represented by RbsABC.
  - source_id: GO:0019303
    title: D-ribose catabolic process
    statement: Defines conversion of imported D-ribose into a metabolically usable form.
  - source_id: file:genes/PSEPK/rbsB/rbsB-uniprot.txt
    statement: Grounds the KT2440 periplasmic substrate-binding exemplar.
  - source_id: file:genes/PSEPK/rbsA-I/rbsA-I-uniprot.txt
    statement: Grounds the KT2440 ABC ATPase exemplar.
  - source_id: file:genes/PSEPK/rbsC/rbsC-uniprot.txt
    statement: Grounds the KT2440 ribose-permease exemplar.
  - source_id: file:genes/PSEPK/rbsD/rbsD-uniprot.txt
    statement: Grounds the KT2440 D-ribose pyranase exemplar and RHEA:25432 reaction.
  - source_id: file:genes/ECOLI/rbsD/rbsD-ai-review.yaml
    statement: Grounds the E. coli D-ribose pyranase exemplar.
  - source_id: file:genes/ECOLI/rbsB/rbsB-ai-review.yaml
    statement: Grounds the E. coli RbsB substrate-binding exemplar.
  - source_id: file:genes/ECOLI/rbsA/rbsA-ai-review.yaml
    statement: Grounds the E. coli RbsA ATPase exemplar.
  - source_id: file:genes/ECOLI/rbsC/rbsC-ai-review.yaml
    statement: Grounds the E. coli RbsC permease exemplar.
  - source_id: file:genes/ECOLI/rbsK/rbsK-ai-review.yaml
    statement: Grounds the E. coli RbsK ribokinase exemplar.
  - source_id: PMID:15060078
    title: >-
      NMR application probes a novel and ubiquitous family of enzymes that
      alter monosaccharide configuration.
    statement: >-
      Primary IDA source showing that E. coli RbsD catalyzes the pyranose to
      furanose conversion of ribose, grounding the P04982 exemplar for
      GO:0062193.
    supporting_text: >-
      We show that RbsD catalyzes the pyran to furan conversion of ribose
  - source_id: file:genes/PSEPK/rbsK/rbsK-uniprot.txt
    statement: Grounds the KT2440 ribokinase exemplar and RHEA:13697 reaction.
  - source_id: PMID:25533465
    title: >-
      In vitro reassembly of the ribose ATP-binding cassette transporter reveals
      a distinct set of transport complexes.
    statement: >-
      Reconstitutes the E. coli RbsABC2 importer from RbsA, the RbsC dimer and
      RbsB, grounding the P04983, P0AGI1 and P02925 exemplars of the import step.
    supporting_text: >-
      The ribose transporter in Escherichia coli is a tripartite complex
      consisting of a cytoplasmic ATP-binding cassette protein, RbsA, with fused
      nucleotide binding domains; a transmembrane domain homodimer, RbsC2; and a
      periplasmic substrate binding protein, RbsB.
  - source_id: PMID:6327617
    title: >-
      Molecular cloning and characterization of genes required for ribose
      transport and utilization in Escherichia coli K-12.
    statement: >-
      Genetic definition of the E. coli rbs operon, linking high-affinity
      ribose transport (RbsB, RbsA, RbsC) to ribokinase-dependent utilization.
    supporting_text: >-
      It appears that the high-affinity transport system for ribose consists of
      the three components, ribose-binding protein, the 50-kilodalton RbsA
      protein, and the 27-kilodalton RbsC protein
  - source_id: PMID:11563694
    title: The effect of inorganic phosphate on the activity of bacterial ribokinase.
    statement: >-
      Direct kinetic characterization of purified E. coli RbsK, grounding the
      P0A9J6 exemplar for GO:0004747.
    supporting_text: >-
      the catalytic activity of E. coli ribokinase is also affected by PVI,
      increasing both the velocity and affinity of the enzyme for D-ribose
  - source_id: file:interpro/panther/PTHR46847/PTHR46847-review.yaml
    statement: Family review for the RbsB substrate-binding protein family.
  - source_id: file:interpro/panther/PTHR43790/PTHR43790-review.yaml
    statement: Family review for the RbsA ABC ATPase family.
  - source_id: file:interpro/panther/PTHR32196/PTHR32196-review.yaml
    statement: Family review for the RbsC permease family.
  - source_id: file:interpro/panther/PTHR37831/PTHR37831-review.yaml
    statement: Family review for the RbsD pyranase family.
  - source_id: file:interpro/panther/PTHR10584/PTHR10584-review.yaml
    statement: Family review for the PfkB sugar kinase family containing ribokinase.
  - source_id: file:modules/bacterial_ribose_uptake_and_entry-deep-research-openscientist.md
    statement: >-
      Synthesizes experimental work on the assembled RbsABC importer, RbsD
      pyranase reaction, and RbsK mechanism while noting bacterial variation
      and the spontaneous background ring interconversion.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_ribose_uptake_and_entry__rbs-locus-deep-research-openscientist.md
    statement: >-
      Supports satisfaction of all three operations by PP_2454-PP_2459 while
      documenting that direct KT2440 transport or pathway experiments were not
      found and that PP_2757-PP_2761 remains substrate-ambiguous.
notes: >-
  The module is species-neutral. The experimentally characterized Escherichia
  coli K-12 rbs operon (RbsABC2 reconstitution, RbsB structure, RbsD NMR assay,
  RbsK kinetics) supplies the primary exemplar of every step, and the
  contiguous Pseudomonas putida KT2440 PP_2454-PP_2459 locus is a second,
  sequence-inferred implementation. RbsR regulates both loci but is not a
  transport or metabolic step. A second KT2440 pair, RbsA/PP_2759 and the
  permease PP_2760, lacks a neighboring substrate-binding protein and is not
  assigned to this module without substrate-specific evidence. The RbsB, RbsA
  and RbsC active units are grounded at PANTHER family level (PTHR46847,
  PTHR43790, PTHR32196) because the families are substrate-diversified
  carbohydrate-importer families: their names refer to D-allose or other
  systems, PTHR46847:SF1 and PTHR43790:SF3 also contain the allose-system
  proteins AlsB and AlsA, and the ribose permeases are split between
  PTHR32196:SF21 (E. coli RbsC) and SF72 (KT2440 RbsC). Ribose specificity is
  therefore carried by the exemplars and the operon, not by the family term;
  see the family reviews. RbsD is grounded at PTHR37831:SF1, whose members
  are D-ribose pyranases. RbsK carries no PANTHER family term: both RbsK
  exemplars are in PTHR10584:SF166, but the PTHR10584 family review finds
  SF166 functionally mixed and leaves ribokinase activity unresolved at
  subfamily level, so the role is anchored to the PAINT ribokinase node
  PTN000061929 and to the E. coli and KT2440 exemplars. The
  L-arabinose transporter IBA on E. coli RbsA from PTN001953353 is judged an
  over-propagation in the RbsA gene and PTHR43790 family reviews.
