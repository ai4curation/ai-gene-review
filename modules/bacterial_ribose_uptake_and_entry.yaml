id: MODULE:bacterial_ribose_uptake_and_entry
title: Bacterial D-ribose uptake and entry
description: >-
  A reusable bacterial route in which an RbsABC complex imports D-ribose,
  RbsD accelerates interconversion of the beta-pyranose and beta-furanose
  forms, and RbsK phosphorylates ribose to D-ribose 5-phosphate for entry into
  central carbon and nucleotide metabolism. Transcriptional regulation and
  downstream pentose-phosphate reactions are outside the module boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0015752
    title: D-ribose transmembrane transport
    statement: Defines the substrate-specific import process represented by RbsABC.
  - source_id: GO:0019303
    title: D-ribose catabolic process
    statement: Defines conversion of imported D-ribose into a metabolically usable form.
  - source_id: file:PSEPK/rbsB/rbsB-uniprot.txt
    statement: Grounds the KT2440 periplasmic substrate-binding exemplar.
  - source_id: file:PSEPK/rbsA-I/rbsA-I-uniprot.txt
    statement: Grounds the KT2440 ABC ATPase exemplar.
  - source_id: file:PSEPK/rbsC/rbsC-uniprot.txt
    statement: Grounds the KT2440 ribose-permease exemplar.
  - source_id: file:PSEPK/rbsD/rbsD-uniprot.txt
    statement: Grounds the KT2440 D-ribose pyranase exemplar and RHEA:25432 reaction.
  - source_id: file:PSEPK/rbsK/rbsK-uniprot.txt
    statement: Grounds the KT2440 ribokinase exemplar and RHEA:13697 reaction.
  - source_id: file:modules/bacterial_ribose_uptake_and_entry-deep-research-openscientist.md
    statement: >-
      Synthesizes experimental work on the assembled RbsABC importer, RbsD
      pyranase reaction, and RbsK mechanism while noting bacterial variation
      and the spontaneous background ring interconversion.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_ribose_uptake_and_entry__rbs-locus-deep-research-openscientist.md
    statement: >-
      Supports satisfaction of all three operations by PP_2454-PP_2459 while
      documenting that direct KT2440 transport or pathway experiments were not
      found and that PP_2757-PP_2761 remains substrate-ambiguous.
notes: >-
  The module is species-neutral and uses the contiguous KT2440
  PP_2454-PP_2459 locus as an exact implementation. RbsR/PP_2457 regulates the
  locus but is not a transport or metabolic step. A second KT2440 pair,
  RbsA/PP_2759 and the permease PP_2760, lacks a neighboring substrate-binding
  protein and is not assigned to this module without substrate-specific
  evidence. PANTHER terms are omitted for RbsB and RbsA-I because their current
  UniProt selectors are labeled as D-allose-related families; exact UniProt
  exemplars retain the intended grounding without asserting unsupported family
  specificity.
