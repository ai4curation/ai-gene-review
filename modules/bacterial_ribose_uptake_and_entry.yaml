  connections:
    - source: rbsabc_ribose_import
      target: rbsd_ribose_pyranase
      connection_type: PROVIDES_INPUT_FOR
      description: Imported cytoplasmic D-ribose is the substrate pool for RbsD.
    - source: rbsd_ribose_pyranase
      target: rbsk_ribose_phosphorylation
      connection_type: PROVIDES_INPUT_FOR
      description: RbsD accelerates formation of beta-D-ribofuranose for RbsK phosphorylation.
  knowledge_gaps:
    - gap_statement: >-
        D-ribose ring forms interconvert spontaneously, and the quantitative
        contribution of RbsD to pathway flux varies with physiological demand.
      boundary: >-
        Represent RbsD as a substantive catalytic operation without claiming
        that it is the only possible source of beta-D-ribofuranose or is
        universally essential in every bacterial implementation.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The PP_2454-PP_2459 locus strongly supports a ribose-specific route,
        but direct KT2440 transport assays have not yet been located for the
        RbsB/RbsC/RbsA-I complex. In particular, the RbsB and RbsA-I PANTHER
        selectors carry D-allose-related labels that should not be treated as
        substrate-specific evidence.
      boundary: >-
        Retain exact KT2440 proteins as exemplars while omitting ambiguous
        PANTHER terms until family or experimental evidence discriminates
        ribose from related aldopentose/aldohexose importers.
      gap_kind:
        - BIOLOGY
        - CURATION
    - gap_statement: >-
        PP_2759 RbsA and PP_2760 form a second ATPase/permease pair, but their
        transported substrate and substrate-binding component are unresolved.
      boundary: >-
        Do not use the second locus to satisfy the D-ribose import step without
        substrate-specific evidence or a cognate binding-protein assignment.
      gap_kind:
        - BIOLOGY
        - CURATION
