knowledge_gaps:
- gap_statement: >-
    How interferon receptor engagement raises cytosolic Ca2+ is unknown. No channel, pump or
    intracellular store has been identified between the interferon receptors and the Ca2+ flux.
  boundary: >-
    Established: interferon-gamma treatment raises intracellular Ca2+ rapidly and dose-dependently,
    and chelating that rise abolishes STAT1 serine phosphorylation. Unknown: whether the Ca2+ comes
    across the plasma membrane or out of internal stores, and what connects the receptor to it.
  gap_kind:
  - BIOLOGY
  dark_aspect: BP_DARK
  significance: >-
    It is the one step of the module with no molecular carrier, and it determines whether the branch
    is shared with other Ca2+-mobilizing stimuli or is specific to interferon receptors.
  resolution: >-
    Store-depletion and channel-blocker panels, or targeted knockdown of candidate channels and
    store-release machinery, with the interferon-induced Ca2+ rise and STAT1 serine phosphorylation
    as the readouts.
  provenance:
  - reference_id: PMID:11972023
    supporting_text: BAPTA-AM, which prevents an intracellular rise of [Ca 2+ ] i caused by either
      influx of Ca 2+ from the medium or release of Ca 2+ from intracellular stores
    reference_section_type: RESULTS
  status: OPEN
- gap_statement: >-
    Whether PTK2B/Pyk2 is a genuine intermediate between CaMKII and STAT1 phosphorylation, and if
    so which residue it acts on, is unknown.
  boundary: >-
    Established: the Pyk2 inhibitor Tyrphostin A9 blocks interferon-beta signaling and STAT1
    phosphorylation, in the same experiment as the calmodulin and CaMKII inhibitors. Unknown:
    whether Pyk2 itself is required, where it sits relative to CaMKII, and what it phosphorylates.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    Decides whether the kinase step of the module is one enzyme or two, and whether the serine mark
    is delivered by CaMKII directly.
  resolution: >-
    PTK2B knockout or knockdown with the interferon-stimulated-gene and STAT1 phosphorylation
    readouts, and an epistasis test against constitutively active CaMKII.
  provenance:
  - reference_id: PMID:35568036
    supporting_text: First, 293T cells expressing an ISRE reporter were treated with inhibitors of
      CaM (W7), CaMKII (KN93), and its downstream signaling partner Pyk2 (Tyrphostin A9-TyrA9)
    reference_section_type: RESULTS
  status: OPEN
- gap_statement: >-
    Why OspC2 binds apo-calmodulin as well as OspC1 and OspC3 do, yet fails to block calmodulin's
    activation of CaMKII, is unknown. The structural or kinetic difference that separates binding
    from inhibition within one effector family has not been identified.
  boundary: >-
    Established: all three effectors interact with apo-calmodulin, but only OspC1 and OspC3 block
    the calmodulin-phospho-CaMKII interaction, and only they potently block type I and type II
    interferon signaling. Unknown: what the inhibitory two do to calmodulin that OspC2 does not.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    It is the experiment that would show what sequestration of apo-calmodulin actually requires, and
    would settle whether GO:0140311 protein sequestering activity is the right typing for the
    inhibitory effectors and bare binding the right typing for OspC2.
  resolution: >-
    Comparative structures or affinity and off-rate measurements of the three effector-apo-calmodulin
    complexes, with the chimeras that already map the responsible region as the starting point.
  provenance:
  - reference_id: PMID:35568036
    supporting_text: However, all three OspC effectors interacted with Apo-CaM (Figure 3B, right half
      of blot).
    reference_section_type: RESULTS
  - reference_id: PMID:35568036
    supporting_text: pCaMKII binding to CaM was similarly inhibited by OspC1 or OspC3 but not OspC2
      (Figure 3G).
    reference_section_type: RESULTS
  status: OPEN
- gap_statement: >-
    Which CaMKII paralog carries the step in which cell type is unresolved. The gamma and delta
    isoforms were assayed together without separating their contributions, alpha is sufficient when
    overexpressed as a constitutively active construct but is largely neuronal, and beta has no
    interferon-specific evidence.
  boundary: >-
    Established: the ubiquitous gamma/delta pair is what binds the STAT1 transcription activation
    domain, and CaMKII activity is required for the serine mark. Unknown: the contribution of each
    paralog in a cell type that mounts an interferon response, which paralog-specific knockouts
    would give.
  gap_kind:
  - BIOLOGY
  dark_aspect: MF_DARK
  significance: >-
    Determines which variants of the REALIZER set are physiological rather than merely competent,
    and whether the GO-CAM models' use of CAMK2A is a representative choice or an error.
  resolution: >-
    Single and combined CAMK2G, CAMK2D, CAMK2A and CAMK2B knockouts in an interferon-responsive
    non-neuronal cell line, scoring STAT1 serine phosphorylation and interferon-stimulated gene
    induction.
  provenance:
  - reference_id: PMID:11972023
    supporting_text: These results indicate that there is a specific interaction between Stat1 and
      the ubiquitous members of the CaMKII family, i.e., CaMKIIγ/δ.
    reference_section_type: RESULTS
  - reference_id: PMID:11972023
    supporting_text: Because of the nature of the CaMKII as a multienzyme complex in vivo ( 21 ),
      the DN effect of the CaMKII mutants would depend on the stoichiometry of the WT and mutant
      enzyme subunits in the complex, and therefore complete inhibition was not seen.
    reference_section_type: RESULTS
  status: OPEN
  status: OPEN
notes: >-
  Created 2026-11-02 to unify four GO-CAM models that fragment one mechanism along a 2x2 of
  interferon ligand (beta, gamma) and OspC effector (OspC1, OspC3): 62b4ffe300004525,
  62b4ffe300004489, 62b4ffe300005467 and 62b4ffe300005437. Their GoCamReviews agree that the split is
  combinatorial rather than biological, and this module is the single mechanism, with the ligand
  axis as a ROUTE variant set and the effector axis as a REALIZER variant set inside one optional
  part.

  Corrections the module makes to the GO-CAMs, each recorded on the annoton that carries it. The
  calmodulin activity is asserted once, as GO:0061891 calcium ion sensor activity, replacing the
  same-gene GO:0005509 -> GO:0043539 CALM1 chain that all four models open with; eight GO-CAM
  activities map onto that one annoton, and the GO:0043539 face of the activity survives as the
  CaMKII paralogs in its `targets`. The missing occurs_in of every cytosolic host activity is
  supplied. The effectors are typed GO:0140311 protein sequestering activity rather than bare
  GO:0005516 calmodulin binding, following the paper's own conclusion. The CaMKII paralog is a
  variant set with gamma and delta first, which addresses the WRONG_GENE_PRODUCT defect recorded
  against CAMK2A in the IFN-gamma model while keeping alpha, for which PMID:35568036 has
  constitutive-activity evidence. The missing IFN -> receptor -> JAK -> STAT1 component is supplied
  by module_ref to type_i_interferon_signaling, type_ii_interferon_signaling and
  jak_stat_signaling, not duplicated. The STAT1 -> EP300 edge, whose ECO:0000314 evidence cites a
  paper that assays no coactivator, is deliberately not carried: STAT1 recruiting p300/CBP to target
  promoters is a step of STAT-dependent transcription and belongs to jak_stat_signaling.

  Boundary. The module is a side-input, not a segment of the JAK-STAT core: it supplies the STAT1
  transcription-activation-domain serine mark, which raises the transcriptional output of a cascade
  that runs without it, and PMID:11972023 shows the two inputs are separable in both directions
  (chelating Ca2+ removes S727 and leaves Y701 intact). Everything in the JAK-STAT and interferon
  cascades is therefore referenced, never restated. Pyk2 is an optional part rather than a core step
  because its only evidence is one pharmacological inhibitor, the judgement the GoCamReviews reach
  in calling its absence from the models defensible. OspC2 is named in the variant set's notes as
  the family's non-inhibiting member rather than modelled as a variant; it would merit a NOT
  annotation on its own entry. The separate cell-death functions of OspC1 and OspC3, which
  PMID:35568036 shows are biochemically distinct from this one, are out of scope.

  Groundings. PANTHER:PTHR23048 is used for calmodulin; the id and its official name
  "MYOSIN LIGHT CHAIN 1, 3" were read from interpro/panther/panther.obo, and CALM1's UniProt record
  carries that family cross-reference, so the surprising name is PANTHER's, not a guess. No PANTHER
  family is asserted for CaMKII, STAT1 or the effectors: CAMK2A's only family cross-reference is
  PTHR24347 "SERINE/THREONINE-PROTEIN KINASE", too heterogeneous to carry this role, and the
  paralogs are better modelled as the variants of a realizer set. No PAINT ancestral node is claimed
  for any role, because none was resolved from local PAINT data. Mouse accessions are given for the
  CaMKII paralogs and STAT1 and as calmodulin representatives, all verified against UniProt.
