id: MODULE:calmodulin_camkii_stat1_potentiation
title: Ca2+/calmodulin-CaMKII potentiation of interferon-induced STAT1 signaling
description: >-
    Interferon receptor engagement mobilizes a cytosolic Ca2+ flux alongside the canonical
    JAK-STAT cascade. Ca2+-loaded calmodulin senses the flux and activates CaMKII, which phosphorylates
    STAT1 on the transcription-activation-domain serine (S727 in human and mouse STAT1). That serine
    mark is not what drives STAT1 dimerization or nuclear import, which depend on the JAK-dependent
    tyrosine mark; it is required for maximal transcription of interferon-stimulated genes. The module
    is therefore a side-input that potentiates, rather than a step in, the JAK-STAT core, and the
    JAK-STAT and interferon steps are included here by reference. Shigella type III effectors of the
    OspC family exploit the branch: OspC1 and OspC3 bind Ca2+-free calmodulin, block its Ca2+ loading
    and so prevent CaMKII activation, STAT1 serine phosphorylation and interferon-stimulated gene
    expression.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: GO:0046427
  statement: The module is a positive regulatory input into receptor signaling via JAK-STAT, which
    is the process term it shares with all four grounding GO-CAM models.
- &id_camkii_potentiates
  source_id: PMID:35568036
  statement: Ca2+/CaM/CaMKII potentiate interferon-induced STAT1 phosphorylation.
  supporting_text: Ca2+/CaM/CaMKII modulate IFN signaling by potentiating STAT1 phosphorylation.
- &id_two_events
  source_id: PMID:11972023
  statement: Receptor occupation and the Ca2+ flux are two separate required inputs, which is why
    this module is a side-input rather than a step in the JAK-STAT core.
  supporting_text: Thus two different cellular signaling events, IFN-γ receptor occupation and Ca
    2+ flux, are required for Stat1 to achieve maximal transcriptional activation through regulation
    of phosphorylation.
- &id_separate_from_jak
  source_id: PMID:11972023
  statement: The Ca2+ branch is explicitly distinct from the Janus-kinase tyrosine branch.
  supporting_text: Our findings suggest that a Ca 2+ flux induced by the IFN-γ signaling pathway,
    a separate event from the tyrosine phosphorylation by Janus kinases, is required for phosphorylation
    of S727 in Stat1.
- &id_ospc_summary
  source_id: PMID:35568036
  statement: OspC1 and OspC3 inhibit the whole branch down to interferon-stimulated gene expression.
  supporting_text: Shigella OspC1 and OspC3 bind and inhibit CaM to block CaMKII phosphorylation,
    STAT1 activation and ISG expression.
module:
  id: calmodulin_camkii_stat1_potentiation
  label: Ca2+/calmodulin-CaMKII potentiation of interferon-induced STAT1 signaling
  module_type: SIGNALING_PATHWAY
  description: A Ca2+-sensing side-input that raises the transcriptional output of interferon-induced
    STAT1 by adding the transcription-activation-domain serine mark, together with the bacterial
    effector mechanism that disables it.
  concepts:
  - preferred_term: positive regulation of receptor signaling pathway via JAK-STAT
    term:
      id: GO:0046427
      label: positive regulation of receptor signaling pathway via JAK-STAT
    description: The regulatory effect of the module on the JAK-STAT cascade it feeds into.
  - preferred_term: serine phosphorylation of STAT protein
    term:
      id: GO:0042501
      label: serine phosphorylation of STAT protein
    description: The molecular event the module delivers; the tyrosine mark is contributed by the
      referenced JAK-STAT module instead.
  - preferred_term: calcium-mediated signaling
    term:
      id: GO:0019722
      label: calcium-mediated signaling
    description: The second messenger branch that carries the interferon signal to CaMKII.
  context:
    taxa:
    - preferred_term: mammals
      term:
        id: NCBITaxon:40674
        label: Mammalia
      description: Host scope of the module.
    cellular_components:
    - preferred_term: cytosol
      term:
        id: GO:0005829
        label: cytosol
    - preferred_term: nucleus
      term:
        id: GO:0005634
        label: nucleus
    notes: >-
      Curator judgement, not a quoted conservation claim. Calmodulin, the CaMKII paralog family,
      STAT1 and the interferon receptors are all older than Mammalia, so the parts of the mechanism
      are at least vertebrate-wide. What has actually been demonstrated is the linkage: the
      Ca2+ -> CaM -> CaMKII -> STAT1 serine-phosphorylation connection is shown only in human cells
      (U3A, HeLa, HEK293T) and mouse cells (NIH 3T3) and mouse colon in PMID:11972023 and
      PMID:35568036. Mammalia is the narrowest clade that covers the demonstrated instances without
      asserting conservation that has not been tested. Widen it if the linkage is shown in a
      non-mammalian vertebrate.
  parts:
  - order: 1
    role: interferon receptor engagement and JAK activation
    node:
      id: ifn_receptor_trigger
      label: Interferon receptor engagement (trigger)
      module_type: SIGNALING_PATHWAY
      description: The upstream event that both activates JAK-STAT and mobilizes the Ca2+ flux this
        module senses. Included by reference to the interferon modules rather than duplicated. Either
        interferon class triggers the branch.
      variant_sets:
      - id: ifn_class
        label: Interferon class
        axis: interferon receptor class delivering the trigger
        variant_kind: ROUTE
        selection: ONE_OR_MORE
        notes: >-
          Type I (IFN-beta, IFNAR, JAK1-TYK2) and type II (IFN-gamma, IFNGR, JAK1-JAK2) interferons
          both drive this branch, and the four grounding GO-CAM models split along exactly this
          axis: 62b4ffe300004525 and the two OspC models use the IFN-beta process term GO:0035458,
          62b4ffe300004489 the IFN-gamma term GO:0071346. The split is a route of the same mechanism,
          not two mechanisms. PMID:35568036 reports type III interferon (IFN-lambda) inhibition by
          OspC effectors as well, but does not test the CaM/CaMKII branch for IFN-lambda, so no
          type III variant is asserted.
        evidence:
        - source_id: PMID:35568036
          statement: The CaM/CaMKII input had been described for type I and type II interferon
            before this work extended it to IFN-beta in epithelial cells.
          supporting_text: CaM/CaMKII modulate JAK/STAT and IFN signalingIFNα or IFNγ signaling pathways
            were shown to be modulated by CaM and CaMKII in macrophages, but whether this is the
            case for IFNβ in epithelial cells had not been studied
        variants:
        - id: type_i_ifn_trigger
          label: Type I interferon trigger
          description: IFN-alpha/beta through IFNAR1-IFNAR2 and JAK1-TYK2, by reference to the type I
            interferon module.
          module_ref: type_i_interferon_signaling
          evidence:
          - *id_camkii_potentiates
        - id: type_ii_ifn_trigger
          label: Type II interferon trigger
          description: IFN-gamma through IFNGR1-IFNGR2 and JAK1-JAK2, by reference to the type II
            interferon module.
          module_ref: type_ii_interferon_signaling
          evidence:
          - source_id: PMID:11972023
            statement: IFN-gamma mobilizes the Ca2+ flux and activates CaMKII.
            supporting_text: We demonstrate that IFN-γ mobilizes a Ca 2+ flux in cells and activates
              CaMKII.
      evidence:
      - *id_two_events
      gocam_associations:
      - model: gomodel:62b4ffe300003747
        title: Canonical JAK-STAT interferon signaling model
        notes: >-
          The IFN -> receptor -> JAK -> STAT1 component exists only in this unconnected canonical
          model; none of the four CaM/CaMKII models contains it, which is the defect recorded in all
          four GoCamReviews ("nothing in the model responds to interferon-gamma"). This module
          supplies the missing component by reference instead of restating it.
    notes: >-
      Required, not optional: without receptor engagement there is no Ca2+ flux and no STAT1 tyrosine
      mark for the serine mark to add to. How interferon receptor occupation raises cytosolic Ca2+
      is not established (see knowledge gaps), so no channel or store annoton is asserted here.
  - order: 2
    role: Ca2+ sensing by calmodulin
    node:
      id: calmodulin_ca_sensing
      label: Calmodulin senses the Ca2+ flux and activates CaMKII
      module_type: REGULATORY_STEP
      description: Ca2+-loaded calmodulin adopts the open conformation, binds the CaMKII regulatory
        segment and triggers T286 autophosphorylation. One activity, not a Ca2+-binding step followed
        by a separate activation step.
      annotons:
      - id: calmodulin_sensor
        label: Calmodulin Ca2+ sensor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: calmodulin
            term:
              id: PANTHER:PTHR23048
              label: MYOSIN LIGHT CHAIN 1, 3
