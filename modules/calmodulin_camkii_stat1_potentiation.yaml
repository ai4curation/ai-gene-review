                term:
                  id: UniProtKB:Q13555
                  label: Calcium/calmodulin-dependent protein kinase type II subunit gamma
                description: Mouse ortholog Camk2g is UniProtKB:Q923T9.
            function: &camkii_function
              preferred_term: calcium/calmodulin-dependent protein kinase activity
              term:
                id: GO:0004683
                label: calcium/calmodulin-dependent protein kinase activity
              targets:
              - preferred_term: STAT1 (human)
                term:
                  id: UniProtKB:P42224
                  label: Signal transducer and activator of transcription 1-alpha/beta
              - preferred_term: Stat1 (mouse)
                term:
                  id: UniProtKB:P42225
                  label: Signal transducer and activator of transcription 1
            processes: &camkii_processes
            - preferred_term: serine phosphorylation of STAT protein
              term:
                id: GO:0042501
                label: serine phosphorylation of STAT protein
            - preferred_term: positive regulation of receptor signaling pathway via JAK-STAT
              term:
                id: GO:0046427
                label: positive regulation of receptor signaling pathway via JAK-STAT
            locations: &camkii_locations
            - preferred_term: cytosol
              term:
                id: GO:0005829
                label: cytosol
            - preferred_term: nucleus
              term:
                id: GO:0005634
                label: nucleus
            role_description: Identified as the p55 STAT1-transcription-activation-domain-interacting
              protein; the amino-terminal half of its regulatory region binds STAT1 directly, and the
              kinase is present in both cytoplasm and nucleus.
            evidence:
            - *id_gamma_delta
            - &id_camkii_phosphorylates
              source_id: PMID:11972023
              statement: CaMKII binds STAT1 and phosphorylates S727.
              supporting_text: CaMKII can interact directly with Stat1 and phosphorylate Stat1 on
                S727 in vitro.
            - &id_camkii_required
              source_id: PMID:11972023
              statement: Blocking Ca2+ flux or CaMKII removes the serine mark and the transcriptional
