  - order: 4
    role: STAT1 tyrosine phosphorylation (the step this one potentiates)
    node:
      id: stat1_tyrosine_phosphorylation_ref
      label: STAT recruitment and tyrosine phosphorylation
      description: >-
        By reference to the canonical JAK-STAT module. This is the JAK-dependent branch that the
