        - model: gomodel:62b4ffe300004489
          activity: gomodel:62b4ffe300004489/62b4ffe300004564
          title: Regulation of the JAK-STAT pathway by calmodulin in response to interferon-gamma (Human)
          notes: CALM1 GO:0005509, no occurs_in. Merged into this one annoton.
        - model: gomodel:62b4ffe300004489
          activity: gomodel:62b4ffe300004489/62b4ffe300004590
          title: Regulation of the JAK-STAT pathway by calmodulin in response to interferon-gamma (Human)
          notes: CALM1 GO:0043539, has_input CAMK2A, no occurs_in. Merged here.
        - model: gomodel:62b4ffe300005467
          activity: gomodel:62b4ffe300005467/62b4ffe300005488
          title: Inhibition of the JAK-STAT pathway by S.flexneri OspC1 that blocks calcium-binding
            to calmodulin (Human)
          notes: CALM1 GO:0005509, the node OspC1 directly negatively regulates. Merged here; the
            inhibitory edge now points at the sensor activity.
        - model: gomodel:62b4ffe300005467
          activity: gomodel:62b4ffe300005467/62b4ffe300005495
          title: Inhibition of the JAK-STAT pathway by S.flexneri OspC1 that blocks calcium-binding
            to calmodulin (Human)
          notes: CALM1 GO:0043539, has_input CAMK2A. Terminal node in that model, so the chain stopped
            before the kinase; merged here and continued by the CaMKII part.
        - model: gomodel:62b4ffe300005437
          activity: gomodel:62b4ffe300005437/62b4ffe300005449
          title: Inhibition of the JAK-STAT pathway by S.flexneri OspC3 that blocks calcium-binding
            to calmodulin (Human)
          notes: CALM1 GO:0005509. Merged here.
        - model: gomodel:62b4ffe300005437
          activity: gomodel:62b4ffe300005437/62b4ffe300005456
          title: Inhibition of the JAK-STAT pathway by S.flexneri OspC3 that blocks calcium-binding
            to calmodulin (Human)
          notes: CALM1 GO:0043539, has_input CAMK2A. Merged here.
      notes: >-
        This single annoton replaces eight GO-CAM activities. All four models open with a CALM1
        GO:0005509 node directly positively regulating a second CALM1 GO:0043539 node: a same-gene
        causal chain that the GoCamReviews flag in each model, because sensing Ca2+ and thereby
        activating a target are one activity. GO:0061891 calcium ion sensor activity is a lateral
        re-typing, not a refinement: its parents are GO:0140784 metal ion sensor activity,
        GO:0140299 molecular sensor activity and GO:0098772 molecular function regulator activity,
        so it is not a child of GO:0005509. The GO:0043539 face of the activity is preserved as the
        CaMKII paralogs in `targets`, and the CALM1 gene review's accepted core function GO:0043539
        therefore does not appear as this annoton's `function`; expect a function-coverage warning
        on that account. The missing occurs_in of all eight GO-CAM activities is supplied as cytosol.
  - order: 3
    role: CaMKII activation and STAT1 serine phosphorylation
    node:
      id: camkii_stat1_serine_phosphorylation
      label: CaMKII phosphorylates the STAT1 transcription activation domain
      module_type: REGULATORY_STEP
      description: Ca2+/calmodulin-activated CaMKII binds the STAT1 transcription activation domain
        and phosphorylates the serine within it (S727 in human and mouse STAT1), the mark required
        for maximal interferon-stimulated gene transcription.
      variant_sets:
      - id: camkii_paralog
        label: CaMKII catalytic paralog
        axis: CAMK2 paralog carrying the kinase step
        variant_kind: REALIZER
        selection: ONE_OR_MORE
        notes: >-
          CAMK2A, CAMK2B, CAMK2G and CAMK2D are alternative carriers of one required activity;
          CaMKII acts as a mixed multimer in vivo, so more than one paralog can serve at once.
          The evidence is paralog-specific and uneven. PMID:11972023 identifies the STAT1-binding
          and STAT1-phosphorylating kinases as the ubiquitously expressed gamma and delta isoforms,
          and uses purified alpha/beta from rat brain only as a positive control in the in vitro
          kinase assay. PMID:35568036 used a constitutively active CaMKII alpha construct, so alpha
          is sufficient when expressed. CAMK2A is largely neuronal while the interferon experiments
          are in fibroblasts and epithelial cells, so alpha is a competent but not the physiological
          carrier in those settings; CAMK2B is included as the fourth family member on the
          PMID:11972023 alpha/beta control and the PMID:14722083 isoform comparison, and is the
          weakest-supported variant.
        evidence:
        - &id_gamma_delta
          source_id: PMID:11972023
          statement: The ubiquitous gamma/delta isoforms are the ones that interact with STAT1.
          supporting_text: These results indicate that there is a specific interaction between Stat1
            and the ubiquitous members of the CaMKII family, i.e., CaMKIIγ/δ.
        - source_id: PMID:14722083
          statement: The four isoforms were compared structurally and enzymatically.
          supporting_text: showed significant differences in their interactions with Ca(2+)-calmodulin
            as assessed by binding, substrate phosphorylation, and autophosphorylation
        variants:
