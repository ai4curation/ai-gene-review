        function:
          preferred_term: calcium ion sensor activity
          term:
            id: GO:0061891
            label: calcium ion sensor activity
          description: Binding Ca2+ and responding by the conformational change that exposes the
            target-binding surface. Chosen over the bare GO:0005509 calcium ion binding used by all
            four GO-CAMs, which says what is bound but not what the binding achieves.
          targets:
          - preferred_term: CAMK2G (human)
            term:
              id: UniProtKB:Q13555
              label: Calcium/calmodulin-dependent protein kinase type II subunit gamma
          - preferred_term: CAMK2D (human)
            term:
              id: UniProtKB:Q13557
              label: Calcium/calmodulin-dependent protein kinase type II subunit delta
          - preferred_term: CAMK2A (human)
            term:
              id: UniProtKB:Q9UQM7
              label: Calcium/calmodulin-dependent protein kinase type II subunit alpha
          - preferred_term: CAMK2B (human)
            term:
              id: UniProtKB:Q13554
              label: Calcium/calmodulin-dependent protein kinase type II subunit beta
        processes:
        - preferred_term: positive regulation of receptor signaling pathway via JAK-STAT
          term:
            id: GO:0046427
            label: positive regulation of receptor signaling pathway via JAK-STAT
        - preferred_term: calcium-mediated signaling
          term:
            id: GO:0019722
            label: calcium-mediated signaling
        locations:
        - preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        role_description: The Ca2+ sensor of the branch. Apo-calmodulin is inert for this step; Ca2+
          loading is what makes it a CaMKII activator, which is why an effector that holds the
          Ca2+-free form is sufficient to shut the branch down.
        evidence:
        - &id_cam_sensor
          source_id: PMID:35568036
          statement: Calmodulin is the host Ca2+ sensor of this branch.
          supporting_text: Here, we demonstrate that the conserved family of OspC effectors blocks
            IFN responses through binding and inhibition of the host Ca2+ sensor calmodulin (CaM)
        - &id_cam_activates_camkii
          source_id: PMID:35568036
          statement: Ca2+-loaded calmodulin activates CaMKII by inducing T286 autophosphorylation.
          supporting_text: When bound to Ca2+, CaM binds and activates CaMKII by inducing its autophosphorylation
            on T286.
        - source_id: PMID:35568036
          statement: The open Ca2+-bound conformation is what binds and activates downstream targets
            including CaMKII.
          supporting_text: When bound to Ca2+, CaM adopts an open conformation facilitating its binding
            to, and activation of, a large number of downstream targets including calmodulin kinase II
            (CaMKII).
        - source_id: PMID:14722083
          statement: The four CaMKII isoforms differ in how they interact with Ca2+-calmodulin.
          supporting_text: showed significant differences in their interactions with Ca(2+)-calmodulin
            as assessed by binding, substrate phosphorylation, and autophosphorylation
        gocam_associations:
        - model: gomodel:62b4ffe300004525
          activity: gomodel:62b4ffe300004525/62b4ffe300004526
          title: Regulation of the JAK-STAT pathway by calmodulin in response to interferon-beta (Human)
          notes: CALM1 GO:0005509 calcium ion binding, no occurs_in. Merged into this one annoton.
        - model: gomodel:62b4ffe300004525
          activity: gomodel:62b4ffe300004525/62b4ffe300004533
          title: Regulation of the JAK-STAT pathway by calmodulin in response to interferon-beta (Human)
          notes: CALM1 GO:0043539 protein serine/threonine kinase activator activity, has_input CAMK2A,
