id: MODULE:hydroxypropionate_hydroxybutyrate_cycle
title: 3-Hydroxypropionate/4-hydroxybutyrate CO2 fixation cycle (Sulfolobales)
description: 'The autotrophic CO2 fixation cycle of the Sulfolobales. Acetyl-CoA is carboxylated to malonyl-CoA
  and reduced through malonate semialdehyde and 3-hydroxypropionate to propionyl-CoA, which is carboxylated
  a second time and rearranged to succinyl-CoA. Succinyl-CoA is reduced through succinate semialdehyde
  to 4-hydroxybutyrate, which is activated, dehydrated to crotonyl-CoA and converted through acetoacetyl-CoA
  into two molecules of acetyl-CoA. One acetyl-CoA restarts the cycle, so each turn fixes two bicarbonate
  molecules into one acetyl-CoA. Several enzymes act twice: one carboxylase acts on acetyl-CoA and propionyl-CoA,
  one reductase on malonyl-CoA and succinyl-CoA, and one crotonase-family enzyme dehydrates 3-hydroxypropionyl-CoA
  and hydrates crotonyl-CoA.'
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:18079405
  title: A 3-hydroxypropionate/4-hydroxybutyrate autotrophic carbon dioxide assimilation pathway in Archaea
  statement: Defines the cycle in Metallosphaera sedula.
- &id003
  source_id: PMID:19684143
  title: 'Malonic semialdehyde reductase, succinic semialdehyde reductase, and succinyl-coenzyme A reductase
    from Metallosphaera sedula: enzymes of the autotrophic 3-hydroxypropionate/4-hydroxybutyrate cycle
    in Sulfolobales.'
  statement: Identifies Msed_1993 as malonic semialdehyde reductase, Msed_1424 as succinic semialdehyde
    reductase and Msed_0709 as the succinyl-CoA reductase, each by purification or heterologous expression.
- &id004
  source_id: PMID:19429610
  title: 3-hydroxypropionyl-coenzyme A dehydratase and acryloyl-coenzyme A reductase, enzymes of the autotrophic
    3-hydroxypropionate/4-hydroxybutyrate cycle in the Sulfolobales
  statement: Identifies Msed_2001 as 3-hydroxypropionyl-CoA dehydratase and Msed_1426 as acryloyl-CoA
    reductase.
- &id010
  source_id: PMID:21169482
  title: Identification of missing genes and enzymes for autotrophic carbon fixation in crenarchaeota
  statement: Identifies Msed_0399 as the bifunctional crotonyl-CoA hydratase/(S)-3-hydroxybutyryl-CoA
    dehydrogenase and points to the beta-ketothiolase gene Msed_0656.
- &id002
  source_id: PMID:24532060
  title: Conversion of 4-hydroxybutyrate to acetyl coenzyme A and its anapleurosis in the Metallosphaera
    sedula 3-hydroxypropionate/4-hydroxybutyrate carbon fixation pathway
  statement: Names the acetyl-CoA/propionyl-CoA carboxylase subunits Msed_0147, Msed_0148 and Msed_1375
    among the genes most strongly upregulated under autotrophic growth.
- &id008
  source_id: PMID:33472982
  title: Convergent Evolution of a Promiscuous 3-Hydroxypropionyl-CoA Dehydratase/Crotonyl-CoA Hydratase
    in Crenarchaeota and Thaumarchaeota
  statement: Shows that Msed_2001 supplies most of the crotonyl-CoA hydratase activity of M. sedula and
    that Msed_0399 is not the main crotonyl-CoA hydratase.
- source_id: GO:0015977
  title: carbon fixation
  statement: The cycle is an autotrophic carbon fixation pathway; GO has no term for the 3HP/4HB cycle
    itself.
- &id006
  source_id: PMID:22752162
  title: Epimerase (Msed_0639) and mutase (Msed_0638 and Msed_2055) convert (S)-methylmalonyl-coenzyme
    A (CoA) to succinyl-CoA in the Metallosphaera sedula 3-hydroxypropionate/4-hydroxybutyrate cycle.
  statement: Shows that Msed_0639 (epimerase) and the two-subunit mutase Msed_0638/Msed_2055 are upregulated
    autotrophically and, as recombinant enzymes, together convert (S)-methylmalonyl-CoA to succinyl-CoA.
- &id009
  source_id: PMID:32218776
  title: Enzymes Catalyzing Crotonyl-CoA Conversion to Acetoacetyl-CoA During the Autotrophic CO(2) Fixation
    in Metallosphaera sedula.
  statement: The dehydrogenase Msed_1423, not the bifunctional Msed_0399, appears to be the main (S)-3-hydroxybutyryl-CoA
    dehydrogenase of the cycle; the paper also lists beta-ketothiolase paralogs of Msed_0656.
- &id001
  source_id: PMID:12581213
  title: Characterization of acetyl-CoA/propionyl-CoA carboxylase in Metallosphaera sedula. Carboxylating
    enzyme in the 3-hydroxypropionate cycle for autotrophic carbon fixation.
  statement: Purified M. sedula acetyl-CoA/propionyl-CoA carboxylase carboxylates both acetyl-CoA and
    propionyl-CoA.
notes: 'Concrete module for the crenarchaeal (Sulfolobales) form of the cycle, with M. sedula DSM 5348
  proteins as representative members. GO:0043427 carbon fixation by 3-hydroxypropionate cycle is deliberately
  not used: it is defined as the Chloroflexus pathway that fixes CO2 into glyoxylate, which is a different
  cycle. The gene reviews propose ''carbon fixation by 3-hydroxypropionate/4-hydroxybutyrate cycle'' and
  four missing activity terms; four steps therefore carry a function descriptor without a GO id. Thaumarchaeota
  run a related cycle with partly convergent enzymes (PMID:33472982) and are outside this module.'
