    title: Two proteins homologous to the N- and C-terminal domains of the bacterial glycosyltransferase Murg are required for the second step of dolichyl-linked oligosaccharide synthesis in Saccharomyces cerevisiae.
    statement: Yeast ALG13 and ALG14 are essential MurG-like halves required for GlcNAc2-PP-Dol formation.
  - source_id: PMID:16100110
    title: Alg14 recruits Alg13 to the cytoplasmic face of the endoplasmic reticulum to form a novel bipartite UDP-N-acetylglucosamine transferase required for the second step of N-linked glycosylation.
    statement: Alg14 is the membrane anchor that recruits catalytic Alg13 to the cytosolic face of the ER.
    supporting_text: We show that Alg14 functions  as a membrane anchor that recruits Alg13 to the cytosolic face of the ER, where  catalysis of GlcNAc2-PP-dol occurs.
  - source_id: PMID:16100113
    title: 'Biosynthesis of lipid-linked oligosaccharides in Saccharomyces cerevisiae: Alg13p and Alg14p form a complex required for the formation of GlcNAc(2)-PP-dolichol.'
    statement: Alg13p and Alg14p form the complex that makes GlcNAc2-PP-Dol.
  - source_id: PMID:19282279
    title: Biochemical characterization and membrane topology of Alg2 from Saccharomyces cerevisiae as a bifunctional alpha1,3- and 1,6-mannosyltransferase involved in lipid-linked oligosaccharide biosynthesis.
    statement: Yeast Alg2 transfers both the alpha-1,3- and alpha-1,6-linked mannoses to Man1GlcNAc2-PP-Dol.
  - source_id: PMID:11278778
    title: The yeast ALG11 gene specifies addition of the terminal alpha 1,2-Man to the Man5GlcNAc2-PP-dolichol N-glycosylation intermediate formed on the cytosolic side of the endoplasmic reticulum.
    statement: ALG11 adds the alpha-1,2 mannoses that complete Man5GlcNAc2-PP-Dol on the cytosolic face.
  - source_id: PMID:23751184
    title: N-linked protein glycosylation in the endoplasmic reticulum.
    statement: Review of LLO assembly on both faces of the ER membrane, centred on S. cerevisiae.
