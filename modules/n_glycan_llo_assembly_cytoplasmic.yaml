    title: lipid-linked oligosaccharide biosynthesis (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLUCOSE-MANNOSYL-CHITO-DOLICHOL
    statement: 'The YeastCyc frame spans both LLO modules. Cytoplasmic-face reactions: 2.7.8.15-RXN (ALG7), 2.4.1.141-RXN (ALG13/ALG14), RXN3O-9818 (ALG1), 2.4.1.132-RXN and RXN3O-378 (ALG2), RXN3O-379 and 2.4.1.131-RXN (ALG11). All gene assignments were retained.'
