  notes: >-
    Cytoplasmic-face segment of dolichol-linked oligosaccharide (LLO) assembly, grounded to the human enzymes DPAGT1 (UniProtKB:Q9H3H5, GO:0003975, EC 2.7.8.15), the ALG13/ALG14 UDP-GlcNAc transferase (Q9NP73 GO:0004577 catalytic + Q96F25 GO:0043495 anchor, EC 2.4.1.141), ALG1 (Q9BT22, GO:0004578, EC 2.4.1.142), ALG2 (Q9H553, GO:0004378/GO:0102704, EC 2.4.1.132/257) and ALG11 (Q2TAA5, GO:0004377, EC 2.4.1.131). GO molecular-function/location terms were taken from the completed human gene reviews and verified against the local go.db; Reactome reaction ids/titles were verified against the local reactome cache. Each step uses a PANTHER family selector with the human enzyme as representative so the module generalises across orthologs/paralogs. The ALG13/ALG14 step is modelled as a PROTEIN_COMPLEX node (catalytic + membrane-anchoring subunits; ALG14's core function is the non-catalytic adaptor activity GO:0043495, not a transferase term). Sugar donors are cytosolic UDP-GlcNAc (DPAGT1, ALG13/14) and GDP-mannose (ALG1, ALG2, ALG11). Downstream, Man5GlcNAc2-PP-Dol is flipped into the ER lumen by the RFT1 flippase (already reviewed) and extended by the lumenal ALG enzymes (ALG3, ALG9, ALG12, ALG6, ALG8, ALG10 — a separate module), then transferred to protein by the oligosaccharyltransferase. Dolichol-phosphate and the Dol-P-Man/Dol-P-Glc donors are supplied by a further module (DOLK, SRD5A3, DPM1/2/3, MPDU1, ALG5). Disorders: each step's loss is a CDG type I (DPAGT1-, ALG13-, ALG14-, ALG1-, ALG2-, ALG11-CDG), several also presenting as congenital myasthenic syndromes. ALIGN (YeastPathways project, 2026-10): S. cerevisiae (ALG7 P07286, ALG13 P53178, ALG14 P38242, ALG1 P16661, ALG2 P43636, ALG11 P53954) and S. pombe (alg7 P42881, alg13 O14190, alg14 O14199, alg1 O13933, alg2 Q96WW6, alg11 O74878) exemplars were added to every role; the ALG names are yeast-derived, and the YeastCyc gene assignments in GLUCOSE-MANNOSYL-CHITO-DOLICHOL are correct. The ALG13 role now lists two PANTHER families because S. cerevisiae ALG13 is placed in PTHR47043 while human and S. pombe ALG13 are in PTHR12867. Connections were converted to PRECEDES. GO-CAM disagreements: the SGD model places every ER-membrane enzyme in cytosol, gives ALG11 only the parent GO:0000026 and types the ALG2 alpha-1,6 step with GO:0033164; the PomBase model agrees with the step order and adds causal links through the rft1 flippase to the lumenal module.
  gocam_associations:
    - model: gomodel:YeastPathways_GLUCOSE-MANNOSYL-CHITO-DOLICHOL
      title: 'lipid-linked oligosaccharide biosynthesis - imported from: Saccharomyces Genome Database'
      description: SGD conversion covering both LLO modules. All activities are placed in cytosol rather than at the ER membrane, and ALG11 (GO:0000026), ALG12 (GO:0000009) and the ALG2 alpha-1,6 step (GO:0033164) carry broader or different MF terms than the specific LLO terms used here.
    - model: gomodel:665912ed00000459
      title: dolichol-linked oligosaccharide biosynthetic process (GO:0006488)  (plus transfer and processing)
      description: PomBase S. pombe model of the whole LLO pathway at the ER membrane, including rft1 flippase, alg5 and dpm1 donor synthesis, oligosaccharyltransferase and gls1 glucosidase I, which lie outside this module.
