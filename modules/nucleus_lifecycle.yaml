id: MODULE:nucleus_lifecycle
title: Nucleus and nuclear envelope lifecycle
description: The nucleus is bounded by a double-membrane envelope continuous with the endoplasmic reticulum
  and perforated by nuclear pore complexes. Pores are inserted into the intact envelope during interphase
  and, in cells with an open mitosis, the envelope and pores are disassembled at prophase and rebuilt
  around the daughter chromosomes, with ESCRT-III sealing the remaining holes. Throughout, the pores and
  the Ran system move proteins and RNAs between nucleus and cytoplasm. This umbrella module composes the
  modules for those stages by reference. The pore and Ran transport core is required in every eukaryote;
  the single-species descriptions are optional.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: file:modules/nuclear_pore_transport_core.yaml
  title: Nuclear pore complex and Ran-dependent karyopherin transport
  statement: 'Partial eukaryote-wide core: four nucleoporins, Ran, NTF2 and the exportins Crm1 and Cse1.'
notes: 'Organelle lifecycle umbrella (see projects/ORGANELLE_LIFECYCLES.md); stage roles follow the shared
  skeleton. Read as a satisfiability rule, the umbrella is satisfied when the pore and transport core
  is, and that core is partial (see its notes). The karyopherin import module, the Drosophila pore module
  and the human mRNA export module are optional references; the karyopherin module is not written as a
  PANTHER-grounded satisfiability rule. Not yet modelled, because no eukaryote-wide module exists: interphase
  pore insertion, nuclear envelope sealing by CHMP7, LEM2 and ESCRT-III (local PANTHER entries for the
  CHMP7 subfamily are vertebrate-only and for the LEMD2 subfamily mammal-only), mitotic disassembly and
  reassembly, which is absent from organisms with a closed mitosis, and the nuclear lamina, which is not
  universal.'
