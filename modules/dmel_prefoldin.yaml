id: MODULE:dmel_prefoldin
title: Prefoldin complex in Drosophila melanogaster
description: >-
  Prefoldin is a heterohexameric co-chaperone shaped like a jellyfish, with six coiled-coil
  tentacles that bind nascent or unfolded polypeptides, notably actin and tubulin, and pass
  them to the CCT chaperonin. It is built from two alpha-class subunits (Pfdn3, encoded by
  mgr, and Pfdn5) and four beta-class subunits (Pfdn1, Pfdn2, Pfdn4 and Pfdn6). In Drosophila,
  mgr is needed for normal tubulin levels and spindle formation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001640
  title: 'FlyBase gene group PFDN: Prefoldin complex'
  statement: >-
    FlyBase release FB2026_03 groups 6 D. melanogaster genes as prefoldin complex (PFDN);
    this module models that group.
- source_id: GO:0016272
  title: prefoldin complex
  statement: >-
    GO term grounding the module as prefoldin complex.
notes: >-
  The alpha/beta class split follows the conserved prefoldin architecture. No molecular function
  is asserted because the former GO term for unfolded protein binding is obsolete and no specific
  replacement fits. FlyBase groups realized by this module: PFDN (FBgg0001640). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_prefoldin.yaml; none of the member genes has a gene review yet unless
  noted.
