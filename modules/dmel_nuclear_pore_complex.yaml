id: MODULE:dmel_nuclear_pore_complex
title: Nuclear pore complex in Drosophila melanogaster
description: >-
  The nuclear pore complex (NPC) is a large assembly of about 30 different nucleoporins, each
  present in multiple copies, that spans the nuclear envelope and controls traffic between
  nucleus and cytoplasm. A symmetric core of stacked rings (two outer rings built from the
  Nup107-160 Y-complex, an inner ring, and a transmembrane ring) anchors a central channel
  filled with phenylalanine-glycine (FG) repeat nucleoporins that form the permeability barrier.
  Asymmetric cytoplasmic filaments and a nuclear basket attach to the core and act in mRNA
  export and in docking of transport receptors. Several Drosophila nucleoporins also act off
  the pore, for example in gene regulation and in mitosis.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000146
  title: 'FlyBase gene group NPC: Nuclear pore complex'
  statement: >-
    FlyBase release FB2026_03 groups 31 D. melanogaster genes as nuclear pore complex (NPC);
    this module models that group.
- source_id: GO:0005643
  title: nuclear pore
  statement: >-
    GO term grounding the module as nuclear pore.
notes: >-
  Sub-structure follows the conserved assignments of the human and yeast homologs; FlyBase
  lists the nucleoporins as one flat group. Mgtor is the Drosophila Tpr homolog (Megator).
  FlyBase groups realized by this module: NPC (FBgg0000146). Participants were generated from
  the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_nuclear_pore_complex.yaml; none of the member genes has a gene review
  yet unless noted.
