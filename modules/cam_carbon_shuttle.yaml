id: MODULE:cam_carbon_shuttle
title: CAM carbon shuttle
description: >-
  Crassulacean acid metabolism, the temporal counterpart of the C4 shuttle: the
  two carboxylations are separated across the day/night cycle in one cell
  rather than between two cell types. At night, with stomata open, PEP
  carboxylase fixes bicarbonate into oxaloacetate, which is reduced to malate
  and stored as malic acid in the vacuole, acidifying it. By day, with stomata
  shut, malate leaves the vacuole and is decarboxylated, and the released CO2
  is refixed by Rubisco behind closed stomata, which is what makes the pathway
  water-conserving. PEP is regenerated from the C3 product, usually via starch
  or soluble sugar. The phase switch is enforced by reciprocal phosphorylation
  of PEP carboxylase: a circadian-controlled kinase phosphorylates it at
  night, relieving malate inhibition, and dephosphorylation by day prevents
  futile refixation of the CO2 being released. The Calvin-Benson-Bassham cycle
  is included by reference. The C4 spatial shuttle is a sibling module
  (MODULE:c4_carbon_shuttle); the two share most of their enzymology and
  differ in what separates the carboxylations.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0009761
    title: CAM photosynthesis
    statement: >-
      Defines the day/night-separated two-carboxylation process this module
      decomposes.
  - source_id: UniProtKB:P10490
    title: Phosphoenolpyruvate carboxylase 1 (Mesembryanthemum crystallinum)
    statement: >-
      Reviewed PEP carboxylase from the classical facultative-CAM model, the
      nocturnal carboxylation step.
  - source_id: UniProtKB:Q9LS46
    title: Aluminum-activated malate transporter 9 (Arabidopsis thaliana)
    statement: >-
      Reviewed vacuolar malate channel; the tonoplast leg of the shuttle is
      grounded on a C3 exemplar because the transport step is not CAM-specific.
notes: >-
  Species-neutral at this boundary. Mesembryanthemum crystallinum is the
  orienting exemplar for the carboxylation step because it is the classical
  facultative-CAM model with reviewed entries, and the tonoplast transporters
  are Arabidopsis exemplars of families that are not CAM-specific: ALMT9 and
  TDT carry the malate flux in C3 plants too, and no reviewed CAM-species
  entry exists for either. Naming them is a family-level orientation, not a
  claim that these proteins run CAM. The same applies to the PPCK exemplars
  Q9SPK4 and Q93VK0, which are likewise Arabidopsis and likewise stand for the
  family rather than for CAM-running proteins. The PP2A phosphatase that the
  description credits with the daytime half of the switch is named but
  deliberately not modelled: its identity in CAM species is not established
  well enough to ground an annoton, and the switch is satisfied by the
  kinase's absence by day. The four classical CAM phases (I-IV) are
  a description of flux over time rather than four distinct enzyme sets, so
  they are described in prose and encoded as the night/day parts plus the
  phosphorylation switch, not as four parts. Stomatal control is a
  precondition and a separate biology, so it is named but not modelled.
  Decarboxylation subtypes (malic-enzyme versus PEP-carboxykinase CAM) exist
  as in C4 but GO has no CAM-specific children for them, so they are modelled
  as a variant set with no subtype concepts. Facultative/inducible CAM and the
  CAM-idling and CAM-cycling variations are realizations, not parts.
module:
  id: cam_carbon_shuttle
  label: CAM carbon shuttle
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: CAM photosynthesis
      term:
        id: GO:0009761
        label: CAM photosynthesis
      description: >-
        Two temporally separated carboxylations that allow CO2 uptake at night
        and refixation behind closed stomata by day.
    - preferred_term: carbon fixation
      term:
        id: GO:0015977
        label: carbon fixation
  parts:
    - order: 1
      role: nocturnal carboxylation
      node:
        id: cam_night_carboxylation
        label: PEP carboxylase fixation of bicarbonate at night
        module_type: REACTION
        annotons:
          - id: cam_carbonic_anhydrase
            label: Cytosolic carbonic anhydrase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: carbonate dehydratase activity
                term:
                  id: GO:0004089
                  label: carbonate dehydratase activity
            function:
              preferred_term: carbonate dehydratase activity
              term:
                id: GO:0004089
                label: carbonate dehydratase activity
              substrates:
                - preferred_term: CO2
              products:
                - preferred_term: bicarbonate
            role_description: >-
              Supplies the bicarbonate substrate, as in the C4 shuttle.
          - id: cam_pepc
            label: CAM-type phosphoenolpyruvate carboxylase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: phosphoenolpyruvate carboxylase (CAM isoform)
                representative_members:
                  - preferred_term: PPCA / PPC1 (Mesembryanthemum crystallinum)
                    term:
                      id: UniProtKB:P10490
                      label: Phosphoenolpyruvate carboxylase 1
            function:
              preferred_term: phosphoenolpyruvate carboxylase activity
              term:
                id: GO:0008964
                label: phosphoenolpyruvate carboxylase activity
              substrates:
                - preferred_term: phosphoenolpyruvate
                - preferred_term: bicarbonate
              products:
                - preferred_term: oxaloacetate
                - preferred_term: phosphate
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Active at night in the phosphorylated, malate-tolerant state.
          - id: cam_nad_mdh
            label: Cytosolic malate dehydrogenase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: L-malate dehydrogenase activity
                term:
                  id: GO:0030060
                  label: L-malate dehydrogenase (NAD+) activity
            function:
              preferred_term: L-malate dehydrogenase (NAD+) activity
              term:
                id: GO:0030060
                label: L-malate dehydrogenase (NAD+) activity
              substrates:
                - preferred_term: oxaloacetate
                - preferred_term: NADH
              products:
                - preferred_term: malate
                - preferred_term: NAD+
            role_description: >-
              Produces the acid that is stored; CAM uses the NAD-dependent
              cytosolic enzyme rather than the chloroplastic NADP enzyme of
              malate-type C4.
    - order: 2
      role: vacuolar malic acid storage
      node:
        id: cam_vacuolar_storage
        label: Tonoplast malate influx and overnight acidification
        module_type: TRANSPORT_STEP
        annotons:
          - id: cam_almt_channel
            label: Tonoplast malate channel
            participant:
              selector_type: FAMILY
              family:
                preferred_term: aluminium-activated malate transporter (ALMT) tonoplast clade
                representative_members:
                  - preferred_term: ALMT9 (Arabidopsis thaliana)
                    term:
                      id: UniProtKB:Q9LS46
                      label: Aluminum-activated malate transporter 9
            function:
              preferred_term: malate transmembrane transporter activity
              term:
                id: GO:0015140
                label: malate transmembrane transporter activity
            locations:
              - preferred_term: vacuolar membrane
                term:
                  id: GO:0005774
                  label: vacuolar membrane
            role_description: >-
              Malate influx is electrically and energetically coupled to the
              tonoplast proton pumps, which is why the vacuole acidifies rather
              than merely accumulating malate salt.
          - id: cam_tdt_transporter
            label: Tonoplast dicarboxylate transporter
            participant:
              selector_type: FAMILY
              family:
                preferred_term: tonoplast dicarboxylate transporter (TDT/SLAC-adjacent clade)
                representative_members:
                  - preferred_term: TDT (Arabidopsis thaliana)
                    term:
                      id: UniProtKB:Q8LG88
                      label: Tonoplast dicarboxylate transporter
            function:
              preferred_term: malate transmembrane transporter activity
              term:
                id: GO:0015140
                label: malate transmembrane transporter activity
            locations:
              - preferred_term: vacuolar membrane
                term:
                  id: GO:0005774
                  label: vacuolar membrane
            role_description: >-
              Contributes to malate flux across the tonoplast and to the
              daytime efflux leg.
    - order: 3
      role: daytime decarboxylation
      node:
        id: cam_day_decarboxylation
        label: Malate efflux and decarboxylation behind closed stomata
        module_type: REACTION
        description: >-
          CAM species divide into malic-enzyme and PEP-carboxykinase types as
          C4 species do, but GO provides no CAM-specific children for the
          subtypes, so the variants carry no subtype concept of their own.
        variant_sets:
          - id: cam_decarboxylation_type
            label: CAM decarboxylation route
            axis: decarboxylation route
            selection: ONE_OR_MORE
            variants:
              - id: cam_me_variant
                label: Malic-enzyme type
                annotons:
                  - id: cam_malic_enzyme
                    label: NADP- or NAD-dependent malic enzyme
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: malic enzyme activity
                        term:
                          id: GO:0004470
                          label: malic enzyme activity
                    function:
                      preferred_term: malic enzyme activity (NADP- or NAD-dependent)
                      term:
                        id: GO:0004470
                        label: malic enzyme activity
                      description: >-
                        The generic parent rather than the NADP-specific
                        GO:0004473, because CAM species use either cofactor and
                        this annoton is labelled for both; asserting the
                        NADP-specific child would contradict its own label.
                      substrates:
                        - preferred_term: malate
                      products:
                        - preferred_term: pyruvate
                        - preferred_term: CO2
                    role_description: >-
                      Releases CO2 for Rubisco and yields pyruvate, which is
                      routed back to PEP by PPDK.
              - id: cam_pck_variant
                label: PEP-carboxykinase type
                annotons:
                  - id: cam_pepck
                    label: Cytosolic PEP carboxykinase
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: phosphoenolpyruvate carboxykinase (ATP) activity
                        term:
                          id: GO:0004612
                          label: phosphoenolpyruvate carboxykinase (ATP) activity
                    function:
                      preferred_term: phosphoenolpyruvate carboxykinase (ATP) activity
                      term:
                        id: GO:0004612
                        label: phosphoenolpyruvate carboxykinase (ATP) activity
                      substrates:
                        - preferred_term: oxaloacetate
                        - preferred_term: ATP
                      products:
                        - preferred_term: phosphoenolpyruvate
                        - preferred_term: CO2
                        - preferred_term: ADP
                    role_description: >-
                      Requires malate to be oxidized to oxaloacetate first, and
                      regenerates PEP directly.
    - order: 4
      role: PEP regeneration
      optional: true
      node:
        id: cam_pep_regeneration
        label: Pyruvate, phosphate dikinase regeneration of PEP
        module_type: REACTION
        annotons:
          - id: cam_ppdk
            label: Pyruvate, phosphate dikinase
            participant:
              selector_type: ANY_WITH_FUNCTION
              required_function:
                preferred_term: pyruvate, phosphate dikinase activity
                term:
                  id: GO:0050242
                  label: pyruvate, phosphate dikinase activity
            function:
              preferred_term: pyruvate, phosphate dikinase activity
              term:
                id: GO:0050242
                label: pyruvate, phosphate dikinase activity
              substrates:
                - preferred_term: pyruvate
                - preferred_term: ATP
                - preferred_term: phosphate
              products:
                - preferred_term: phosphoenolpyruvate
                - preferred_term: AMP
                - preferred_term: diphosphate
            role_description: >-
              Needed in malic-enzyme-type CAM, which is why this part is
              optional: the PEP-carboxykinase variant regenerates PEP at the
              decarboxylation step instead. The carbon usually passes through
              starch or soluble sugar overnight rather than being held as a
              three-carbon pool.
    - order: 5
      role: day/night phosphorylation switch
      node:
        id: cam_pepc_phosphoswitch
        label: Circadian phosphorylation of PEP carboxylase
        module_type: REGULATORY_STEP
        annotons:
          - id: cam_ppck
            label: Phosphoenolpyruvate carboxylase kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: phosphoenolpyruvate carboxylase kinase (PPCK)
                representative_members:
                  - preferred_term: PPCK1 (Arabidopsis thaliana)
                    term:
                      id: UniProtKB:Q9SPK4
                      label: Phosphoenolpyruvate carboxylase kinase 1
                  - preferred_term: PPCK2 (Arabidopsis thaliana)
                    term:
                      id: UniProtKB:Q93VK0
                      label: Phosphoenolpyruvate carboxylase kinase 2
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: phosphoenolpyruvate carboxylase
            role_description: >-
              Phosphorylating the N-terminal serine of PEP carboxylase at night
              reduces its sensitivity to malate inhibition, letting
              carboxylation continue as vacuolar malate accumulates. The kinase
              is itself under circadian transcriptional control, which is how
              the phase information reaches the enzyme. Its absence by day is
              what stops the shuttle refixing the CO2 it is trying to release.
    - order: 6
      role: carbon fixation by the Calvin-Benson-Bassham cycle
      node:
        id: cam_cbb_cycle
        label: Calvin-Benson-Bassham cycle by day
        description: >-
          Included by reference to MODULE:calvin_benson_bassham_cycle. The
          released CO2 is refixed by Rubisco behind closed stomata; the shuttle
          raises the CO2 concentration at that Rubisco rather than replacing
          it. GO places GO:0009761 under the same carbon-fixation grouping term
          as the cycle itself.
        module_ref: calvin_benson_bassham_cycle
        concepts:
          - preferred_term: reductive pentose-phosphate cycle
            term:
              id: GO:0019253
              label: reductive pentose-phosphate cycle
  connections:
    - source: cam_night_carboxylation
      target: cam_vacuolar_storage
      connection_type: PRECEDES
      description: Malate made at night is moved into the vacuole as malic acid.
    - source: cam_vacuolar_storage
      target: cam_day_decarboxylation
      connection_type: PRECEDES
      description: >-
        Stored malate is released by day; the overnight acidification and its
        daytime reversal are the measurable signature of the pathway.
    - source: cam_day_decarboxylation
      target: cam_pep_regeneration
      connection_type: PRECEDES
      description: >-
        The C3 product is returned to PEP, via starch or sugar in most species.
    - source: cam_pepc_phosphoswitch
      target: cam_night_carboxylation
      connection_type: POSITIVELY_REGULATES
      description: >-
        Night-time phosphorylation desensitizes PEP carboxylase to malate
        inhibition, sustaining nocturnal carboxylation.
    - source: cam_day_decarboxylation
      target: cam_cbb_cycle
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The CO2 released from stored malate is the substrate Rubisco refixes
        while the stomata stay shut.
    - source: cam_day_decarboxylation
      target: cam_night_carboxylation
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Malate released by day inhibits unphosphorylated PEP carboxylase,
        which is the feedback that keeps the two phases from running together.
