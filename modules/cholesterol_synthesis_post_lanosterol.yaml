id: MODULE:cholesterol_synthesis_post_lanosterol
title: Cholesterol biosynthesis II — lanosterol to cholesterol (post-lanosterol); SLOS, CDPX2, CHILD, lathosterolosis
description: >-
  The post-lanosterol segment of cholesterol biosynthesis converts lanosterol into
  cholesterol through a ~19-reaction sequence of demethylations, isomerisation,
  desaturations and reductions carried out by endoplasmic-reticulum-membrane enzymes. The
  three lanosterol methyl groups are removed first: CYP51A1 (a cytochrome P450) removes the
  14-alpha-methyl group, and the resulting Delta14 bond is reduced by TM7SF2 or LBR; then the
  two C4 methyls are removed in two rounds by the C4-
  demethylation machinery in which MSMO1 (a non-heme di-iron methylsterol oxidase)
  oxidises the C4 methyl to a carboxylate and NSDHL (a 3-beta-hydroxysteroid dehydrogenase/
  C4-decarboxylase) decarboxylates it (the 3-ketoreductase HSD17B7 then restores the 3-beta-ol).
  EBP (sterol Delta(8)-Delta(7) isomerase) shifts the ring double bond from Delta8 to
  Delta7; SC5D (lathosterol oxidase / sterol-C5-desaturase) introduces the C5-6 double bond;
  and DHCR7 (7-dehydrocholesterol reductase) reduces the C7-8 double bond to give
  cholesterol. The pathway runs as two interconvertible arms — the Bloch arm (retaining the
  side-chain Delta24 double bond until the end) and the Kandutsch-Russell arm (in which
  DHCR24 reduces the Delta24 bond early) — that differ only in the timing of the DHCR24
  step. Isotope tracing shows that tissues mostly combine the Bloch arm with a modified
  Kandutsch-Russell arm, in which DHCR24 reduces zymosterol, rather than using the canonical
  Kandutsch-Russell route, in tissue-specific proportions. Inherited enzyme defects cause distinctive malformation/skeletal/skin disorders:
  DHCR7 -> Smith-Lemli-Opitz syndrome; SC5D -> lathosterolosis; EBP -> X-linked
  chondrodysplasia punctata 2 (Conradi-Hunermann-Happle); NSDHL -> CHILD syndrome; MSMO1 ->
  SC4MOL deficiency; and DHCR24 -> desmosterolosis.
status: DRAFT
evidence:
  - source_id: GO:0006695
    title: cholesterol biosynthetic process
    statement: >-
      The module is grounded in cholesterol biosynthetic process (GO:0006695); it covers
      the post-lanosterol lanosterol -> cholesterol segment.
  - source_id: Reactome:R-HSA-191273
    title: Cholesterol biosynthesis
    statement: >-
      Reactions follow the human Reactome cholesterol-biosynthesis pathway: R-HSA-194678
      (CYP51A1), R-HSA-194641 (MSMO1), R-HSA-194642 (NSDHL), R-HSA-6807052 (EBP),
      R-HSA-195664 (SC5D) and R-HSA-196402 (DHCR7).
  - source_id: file:human/CYP51A1/CYP51A1-ai-review.yaml
    title: CYP51A1 gene review (human)
    statement: >-
      The lanosterol 14-demethylation step (UniProtKB:Q16850, GO:0008398) matches the
      completed human CYP51A1 review.
  - source_id: file:human/MSMO1/MSMO1-ai-review.yaml
    title: MSMO1 gene review (human)
    statement: >-
      The C4-methyl-oxidation step (UniProtKB:Q15800, GO:0000254) matches the completed
      human MSMO1 review.
  - source_id: file:human/NSDHL/NSDHL-ai-review.yaml
    title: NSDHL gene review (human)
    statement: >-
      The C4-decarboxylation step (UniProtKB:Q15738, GO:0000252) matches the completed
      human NSDHL review.
  - source_id: file:human/EBP/EBP-ai-review.yaml
    title: EBP gene review (human)
    statement: >-
      The Delta8-Delta7 isomerisation step (UniProtKB:Q15125, GO:0000247) matches the
      completed human EBP review.
  - source_id: file:human/SC5D/SC5D-ai-review.yaml
    title: SC5D gene review (human)
    statement: >-
      The C5-desaturation step (UniProtKB:O75845, GO:0050046) matches the completed human
      SC5D review.
  - source_id: file:human/DHCR7/DHCR7-ai-review.yaml
    title: DHCR7 gene review (human)
    statement: >-
      The 7-dehydrocholesterol-reduction (final) step (UniProtKB:Q9UBM7, GO:0047598)
      matches the completed human DHCR7 review.
  - source_id: file:human/DHCR24/DHCR24-ai-review.yaml
    title: DHCR24 gene review (human)
    statement: >-
      The Delta24 side-chain reduction (UniProtKB:Q15392, GO:0050614 Delta24-sterol reductase
      activity, the core function in the completed DHCR24 review) distinguishes the Bloch and
      Kandutsch-Russell arms. An earlier version of this statement cited GO:0000246, which is the
      ergosterol Delta24(24-1) reductase term.
  - source_id: PMID:42532476
    title: 'Sterol flux rewiring: Cholesterol biosynthesis as a dynamic signaling network.'
    statement: >-
      2026 review used to audit the module. It treats the post-lanosterol segment as partially
      overlapping Bloch and Kandutsch-Russell branches whose use varies by tissue, and DHCR24 as a
      node of that switch. The earlier module version named DHCR24 but did not model it as a part.
    supporting_text: >-
      Beyond lanosterol, biosynthesis follows the partially overlapping Bloch and Kandutsch–Russell
      pathways, whose relative contributions vary among tissues and physiological conditions (3, 11, 16).
  - source_id: PMID:26114596
    title: Flux analysis of cholesterol biosynthesis in vivo reveals multiple tissue and cell-type specific pathways.
    statement: >-
      Primary isotope-tracing evidence that tissues use the Bloch pathway and a hybrid modified
      Kandutsch-Russell (MK-R) pathway, in which DHCR24 acts on zymosterol, rather than the canonical
      Kandutsch-Russell pathway.
    supporting_text: >-
      Surprisingly, no tissue used the
      canonical K-R pathway. Rather, a hybrid pathway was identified that we call the
      modified K-R (MK-R) pathway.
module:
  id: cholesterol_synthesis_post_lanosterol
  label: Cholesterol biosynthesis (lanosterol -> cholesterol)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: cholesterol biosynthetic process
      term:
        id: GO:0006695
        label: cholesterol biosynthetic process
      description: >-
        Post-lanosterol conversion of lanosterol to cholesterol by demethylation,
        isomerisation, desaturation and reduction.
  context:
    cellular_components:
      - preferred_term: endoplasmic reticulum membrane
        term:
          id: GO:0005789
          label: endoplasmic reticulum membrane
        description: The post-lanosterol sterol-modifying enzymes are ER-membrane proteins.
  parts:
    - order: 1
      role: 14-alpha-demethylation
      node:
        id: cyp51a1_step
        label: lanosterol to 14-demethyl-lanosterol (FF-MAS)
        module_type: REACTION
        annotons:
          - id: cyp51a1_activity
            label: "CYP51A1: sterol 14-alpha-demethylase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Sterol 14-alpha-demethylase family (CYP51A1)
                representative_members:
                  - preferred_term: CYP51A1 (human)
                    term:
                      id: UniProtKB:Q16850
                      label: Lanosterol 14-alpha demethylase
            function:
              preferred_term: sterol 14-demethylase activity
              term:
                id: GO:0008398
                label: sterol 14-demethylase activity
              substrates:
                - preferred_term: lanosterol (or 24,25-dihydrolanosterol)
              products:
                - preferred_term: 14-demethyl sterol (FF-MAS) + formate
              evidence:
                - source_id: EC:1.14.14.154
                  statement: sterol 14-alpha-demethylase (CYP51); P450, heme/iron; first post-lanosterol step
                - source_id: Reactome:R-HSA-194678
                  statement: "CYP51A1 demethylates LAN (human Reactome reaction)"
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              P450 that removes lanosterol's 14-alpha-methyl group (three oxidative steps),
              the first post-lanosterol demethylation.
    - order: 2
      role: Delta14 reduction
      node:
        id: delta14_reduction_step
        label: 14-demethyl sterol (FF-MAS) to Delta14-reduced sterol (T-MAS)
        module_type: REACTION
        description: >-
          Two paralogous Delta14-sterol reductases can each perform this step. TM7SF2 is an ER enzyme, and the
          lamin B receptor LBR carries the same sterol-reductase activity.
        annotons:
          - id: tm7sf2_activity
            label: "TM7SF2: Delta14-sterol reductase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: TM7SF2 Delta14-sterol reductase subfamily
                term:
                  id: PANTHER:PTHR21257:SF52
                  label: DELTA(14)-STEROL REDUCTASE TM7SF2
                representative_members:
                  - preferred_term: TM7SF2 (human)
                    term:
                      id: UniProtKB:O76062
                      label: Delta(14)-sterol reductase TM7SF2
            function:
              preferred_term: Delta14-sterol reductase activity
              term:
                id: GO:0050613
                label: Delta14-sterol reductase activity
              substrates:
                - preferred_term: 4,4-dimethylcholesta-8,14,24-trien-3beta-ol (FF-MAS)
                - preferred_term: NADPH
              products:
                - preferred_term: 4,4-dimethylcholesta-8,24-dien-3beta-ol (T-MAS)
              evidence:
                - source_id: UniProtKB:O76062
                  statement: Reviewed Delta(14)-sterol reductase TM7SF2, EC 1.3.1.70; GOA has IDA/EXP annotations to GO:0050613 (PMID:16784888).
                - source_id: Reactome:R-HSA-194698
                  statement: Human Reactome reaction for TM7SF2 reduction of the Delta14 bond (cited by GOA TAS annotation).
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Reduces the C14-15 double bond left by CYP51A1 demethylation; redundant with LBR.
          - id: lbr_activity
            label: "LBR: Delta14-sterol reductase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LBR Delta14-sterol reductase subfamily
                term:
                  id: PANTHER:PTHR21257:SF55
                  label: DELTA(14)-STEROL REDUCTASE LBR
                representative_members:
                  - preferred_term: LBR (human)
                    term:
                      id: UniProtKB:Q14739
                      label: Delta(14)-sterol reductase LBR
            function:
              preferred_term: Delta14-sterol reductase activity
              term:
                id: GO:0050613
                label: Delta14-sterol reductase activity
              substrates:
                - preferred_term: 4,4-dimethylcholesta-8,14,24-trien-3beta-ol (FF-MAS)
                - preferred_term: NADPH
              products:
                - preferred_term: 4,4-dimethylcholesta-8,24-dien-3beta-ol (T-MAS)
              evidence:
                - source_id: UniProtKB:Q14739
                  statement: Reviewed Delta(14)-sterol reductase LBR, EC 1.3.1.70; GOA has IDA and IMP annotations to GO:0050613 (PMID:9630650, PMID:16784888).
                - source_id: Reactome:R-HSA-194674
                  statement: Human Reactome reaction for LBR reduction of the Delta14 bond (cited by GOA TAS annotation).
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Lamin B receptor with sterol Delta14-reductase activity; paralog that overlaps TM7SF2 at this step. Its sterol-reductase activity is located in the nuclear envelope and ER membrane.
    - order: 3
      role: C4-methyl oxidation
      node:
        id: msmo1_step
        label: 4,4-dimethyl/4-methyl sterol to 4-carboxy sterol (C4-methyl oxidation)
        module_type: REACTION
        annotons:
          - id: msmo1_activity
            label: "MSMO1: C4-methylsterol oxidase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Fatty acid hydroxylase / methylsterol oxidase family (MSMO1/SC5D)
                term:
                  id: PANTHER:PTHR11863
                  label: STEROL DESATURASE
                representative_members:
                  - preferred_term: MSMO1 (human)
                    term:
                      id: UniProtKB:Q15800
                      label: Methylsterol monooxygenase 1
            function:
              preferred_term: C-4 methylsterol oxidase activity
              term:
                id: GO:0000254
                label: C-4 methylsterol oxidase activity
              substrates:
                - preferred_term: 4-alpha-methyl sterol
                - preferred_term: O2 / NAD(P)H
              products:
                - preferred_term: 4-alpha-carboxy sterol
              evidence:
                - source_id: EC:1.14.18.9
                  statement: C4-methylsterol oxidase; non-heme di-iron; oxidises C4 methyl to carboxylate (with NSDHL)
                - source_id: Reactome:R-HSA-194641
                  statement: "4,4-dimethylcholesta-8(9),24-dien-3beta-ol is oxidized to 4-methyl... (human Reactome reaction)"
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Non-heme di-iron oxidase oxidising the sterol C4-methyl group to a carboxylate
              (repeated for both C4 methyls); the oxidative part of C4-demethylation. MSMO1
              deficiency = SC4MOL deficiency.
    - order: 4
      role: C4-decarboxylation / 3-oxidation
      node:
        id: nsdhl_step
        label: 4-carboxy sterol to 3-keto sterol + CO2 (then reduced to 3-beta-ol)
        module_type: REACTION
        annotons:
          - id: nsdhl_activity
            label: "NSDHL: sterol-4-carboxylate 3-dehydrogenase (decarboxylating)"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: NSDHL / 3-beta-HSD-like C4-decarboxylase family (NSDHL)
                representative_members:
                  - preferred_term: NSDHL (human)
                    term:
                      id: UniProtKB:Q15738
                      label: Sterol-4-alpha-carboxylate 3-dehydrogenase, decarboxylating
            function:
              preferred_term: 3-beta-hydroxysteroid dehydrogenase [NAD(P)+]/C4-decarboxylase activity
              term:
                id: GO:0000252
                label: 3-beta-hydroxysteroid dehydrogenase [NAD(P)+]/C4-decarboxylase activity
              substrates:
                - preferred_term: 3-beta-hydroxy-4-alpha-carboxy sterol
                - preferred_term: NAD(P)+
              products:
                - preferred_term: 3-keto sterol + CO2
              evidence:
                - source_id: EC:4.1.1.-
                  statement: sterol-4alpha-carboxylate 3-dehydrogenase (decarboxylating); completes C4-demethylation with MSMO1
                - source_id: Reactome:R-HSA-194642
                  statement: "4-methyl,4-carboxycholesta-8(9),24-dien-3beta-ol is decarboxylated (human Reactome reaction)"
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              NAD(P)+-dependent 3-dehydrogenation/decarboxylation of the 4-carboxysterol; the
              decarboxylating half of C4-demethylation. NSDHL deficiency = CHILD / CK syndrome.
    - order: 5
      role: 3-keto reduction
      node:
        id: hsd17b7_step
        label: 3-keto sterol to 3-beta-hydroxy sterol
        module_type: REACTION
        annotons:
          - id: hsd17b7_activity
            label: "HSD17B7: 3-keto-steroid reductase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: 3-keto-steroid reductase / HSD17B7 subfamily
                term:
                  id: PANTHER:PTHR44442:SF1
                  label: 3-KETO-STEROID REDUCTASE_17-BETA-HYDROXYSTEROID DEHYDROGENASE 7
                representative_members:
                  - preferred_term: HSD17B7 (human)
                    term:
                      id: UniProtKB:P56937
                      label: 3-keto-steroid reductase/17-beta-hydroxysteroid dehydrogenase 7
            function:
              preferred_term: 3-beta-hydroxysteroid 3-dehydrogenase (NADP+) activity
              term:
                id: GO:0000253
                label: 3-beta-hydroxysteroid 3-dehydrogenase (NADP+) activity
              substrates:
                - preferred_term: 3-keto C4-demethylated sterol (from NSDHL)
                - preferred_term: NADPH
              products:
                - preferred_term: 3-beta-hydroxy sterol (4-methylzymosterol, then zymosterol after the second round)
              evidence:
                - source_id: UniProtKB:P56937
                  statement: Reviewed 3-keto-steroid reductase, EC 1.1.1.270; GOA has IDA/EXP annotations to GO:0000253 (PMID:12829805).
                - source_id: Reactome:R-HSA-194689
                  statement: Human Reactome reaction for the HSD17B7 3-keto reduction in C4 demethylation (cited by GOA TAS annotation).
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Restores the 3-beta-hydroxyl after NSDHL oxidative decarboxylation, completing each of the two C4-demethylation rounds.
    - order: 6
      role: Delta8 -> Delta7 isomerisation
      node:
        id: ebp_step
        label: Delta(8)-sterol to Delta(7)-sterol
        module_type: REACTION
        annotons:
          - id: ebp_activity
            label: "EBP: sterol Delta(8),Delta(7)-isomerase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Emopamil-binding protein / sterol isomerase family (EBP)
                term:
                  id: PANTHER:PTHR14207
                  label: STEROL ISOMERASE
                representative_members:
                  - preferred_term: EBP (human)
                    term:
                      id: UniProtKB:Q15125
                      label: 3-beta-hydroxysteroid-Delta(8),Delta(7)-isomerase
            function:
              preferred_term: C-8 sterol isomerase activity
              term:
                id: GO:0000247
                label: C-8 sterol isomerase activity
              substrates:
                - preferred_term: Delta(8)-sterol (e.g. zymostenol)
              products:
                - preferred_term: Delta(7)-sterol (e.g. lathosterol)
              evidence:
                - source_id: EC:5.3.3.5
                  statement: 3-beta-hydroxysteroid-Delta8,Delta7-isomerase (emopamil-binding protein)
                - source_id: Reactome:R-HSA-6807052
                  statement: "EBP isomerizes ZYMSTNL to LTHSOL (human Reactome reaction)"
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Shifts the ring double bond from Delta8 to Delta7. Deficiency = X-linked
              chondrodysplasia punctata 2 (Conradi-Hunermann-Happle).
    - order: 7
      role: C5-desaturation
      node:
        id: sc5d_step
        label: Delta(7)-sterol (lathosterol) to Delta(5,7)-sterol (7-dehydrocholesterol)
        module_type: REACTION
        annotons:
          - id: sc5d_activity
            label: "SC5D: lathosterol oxidase (sterol-C5-desaturase)"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Fatty acid hydroxylase / sterol desaturase family (SC5D/MSMO1)
                term:
                  id: PANTHER:PTHR11863
                  label: STEROL DESATURASE
                representative_members:
                  - preferred_term: SC5D (human)
                    term:
                      id: UniProtKB:O75845
                      label: Lathosterol oxidase
            function:
              preferred_term: delta7-sterol 5(6)-desaturase activity
              term:
                id: GO:0050046
                label: delta7-sterol 5(6)-desaturase activity
              substrates:
                - preferred_term: lathosterol (Delta7-sterol)
                - preferred_term: O2 / NAD(P)H
              products:
                - preferred_term: 7-dehydrocholesterol (Delta5,7-sterol)
              evidence:
                - source_id: EC:1.14.19.20
                  statement: sterol-C5-desaturase (lathosterol oxidase); non-heme iron; introduces the C5-6 double bond
                - source_id: Reactome:R-HSA-195664
                  statement: "Cholesta-7,24-dien-3beta-ol is desaturated to form cholesta-5,7,24... (human Reactome reaction)"
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Introduces the C5-6 double bond (lathosterol -> 7-dehydrocholesterol).
              Deficiency = lathosterolosis.
    - order: 8
      role: 7-dehydrocholesterol reduction (final)
      node:
        id: dhcr7_step
        label: 7-dehydrocholesterol to cholesterol
        module_type: REACTION
        annotons:
          - id: dhcr7_activity
            label: "DHCR7: 7-dehydrocholesterol reductase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: 7-dehydrocholesterol reductase family (DHCR7)
                term:
                  id: PANTHER:PTHR21257
                  label: DELTA(14)-STEROL REDUCTASE
                representative_members:
                  - preferred_term: DHCR7 (human)
                    term:
                      id: UniProtKB:Q9UBM7
                      label: 7-dehydrocholesterol reductase
            function:
              preferred_term: 7-dehydrocholesterol reductase activity
              term:
                id: GO:0047598
                label: 7-dehydrocholesterol reductase activity
              substrates:
                - preferred_term: 7-dehydrocholesterol
                - preferred_term: NADPH
              products:
                - preferred_term: cholesterol
              evidence:
                - source_id: EC:1.3.1.21
                  statement: 7-dehydrocholesterol reductase; reduces the C7-8 double bond; final Kandutsch-Russell step
                - source_id: Reactome:R-HSA-196402
                  statement: "Cholesta-5,7,24-trien-3beta-ol is reduced to desmosterol (human Reactome reaction)"
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Reduces the C7-8 double bond of 7-dehydrocholesterol to give cholesterol (and,
              in the Bloch arm, 7-dehydrodesmosterol -> desmosterol); 7-DHC is also the
              vitamin-D3 precursor. Deficiency = Smith-Lemli-Opitz syndrome.
    - order: 9
      role: Delta24 side-chain reduction (Bloch / modified Kandutsch-Russell switch)
      node:
        id: dhcr24_step
        label: Delta24-sterol to 24,25-dihydro sterol (desmosterol to cholesterol; zymosterol to zymostenol)
        module_type: REACTION
        description: >-
          DHCR24 reduces the side-chain Delta24 bond. When it acts decides the branch. In the Bloch pathway it acts
          last, on desmosterol. In the modified Kandutsch-Russell (MK-R) pathway it acts on zymosterol, giving
          zymostenol, which then passes through EBP, SC5D and DHCR7. Isotope tracing in mice found no tissue using
          the canonical Kandutsch-Russell route from lanosterol, and the Bloch:MK-R ratio varies with tissue and
          flux (PMID:26114596).
        annotons:
          - id: dhcr24_activity
            label: "DHCR24: Delta24-sterol reductase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: DHCR24 / 24-dehydrocholesterol reductase subfamily
                term:
                  id: PANTHER:PTHR10801:SF0
                  label: DELTA(24)-STEROL REDUCTASE
                representative_members:
                  - preferred_term: DHCR24 (human)
                    term:
                      id: UniProtKB:Q15392
                      label: Delta(24)-sterol reductase
            function:
              preferred_term: Delta24-sterol reductase activity
              term:
                id: GO:0050614
                label: Delta24-sterol reductase activity
              substrates:
                - preferred_term: Delta24 sterol (desmosterol in the Bloch arm; zymosterol in the MK-R arm)
                - preferred_term: NADPH
              products:
                - preferred_term: 24,25-dihydro sterol (cholesterol; zymostenol)
              evidence:
                - source_id: file:human/DHCR24/DHCR24-ai-review.yaml
                  statement: Completed human DHCR24 review; core function GO:0050614 Delta24-sterol reductase activity (GOA EXP, PMID:11519011). Deficiency = desmosterolosis.
                - source_id: PMID:26114596
                  statement: DHCR24 timing sets the Bloch versus modified Kandutsch-Russell flux, and DHCR24 overexpression shifts flux toward MK-R.
                  supporting_text: >-
                    Sterol depletion in cultured cells increased
                    flux through the Bloch pathway, whereas overexpression of 24-dehydrocholesterol
                    reductase (DHCR24) enhanced usage of the MK-R pathway.
            locations:
              - preferred_term: endoplasmic reticulum membrane
                term:
                  id: GO:0005789
                  label: endoplasmic reticulum membrane
            role_description: >-
              Reduces the side-chain Delta24 bond; its timing distinguishes the Bloch and modified Kandutsch-Russell arms. Deficiency = desmosterolosis.
  connections:
    - source: cyp51a1_step
      target: delta14_reduction_step
      connection_type: PROVIDES_INPUT_FOR
      description: The Delta14 bond left by CYP51A1 demethylation (FF-MAS) is reduced by TM7SF2 or LBR.
    - source: delta14_reduction_step
      target: msmo1_step
      connection_type: PROVIDES_INPUT_FOR
      description: The Delta14-reduced 4,4-dimethyl sterol (T-MAS) undergoes C4-demethylation (MSMO1/NSDHL/HSD17B7).
    - source: msmo1_step
      target: nsdhl_step
      connection_type: PROVIDES_INPUT_FOR
      description: The 4-carboxy sterol from MSMO1 is decarboxylated by NSDHL.
    - source: nsdhl_step
      target: hsd17b7_step
      connection_type: PROVIDES_INPUT_FOR
      description: The 3-keto sterol from NSDHL is reduced back to the 3-beta-ol by HSD17B7.
    - source: hsd17b7_step
      target: ebp_step
      connection_type: PROVIDES_INPUT_FOR
      description: In the Bloch arm, zymosterol (the Delta8-sterol left after two C4-demethylation rounds) is isomerised by EBP.
    - source: hsd17b7_step
      target: dhcr24_step
      connection_type: PROVIDES_INPUT_FOR
      description: In the modified Kandutsch-Russell arm, zymosterol is reduced by DHCR24 to zymostenol.
    - source: dhcr7_step
      target: dhcr24_step
      connection_type: PROVIDES_INPUT_FOR
      description: In the Bloch arm, desmosterol made by DHCR7 is reduced by DHCR24 to cholesterol.
    - source: dhcr24_step
      target: ebp_step
      connection_type: PROVIDES_INPUT_FOR
      description: In the modified Kandutsch-Russell arm, zymostenol made by DHCR24 is isomerised by EBP to lathosterol and continues through SC5D and DHCR7 to cholesterol (PMID:26114596).
    - source: ebp_step
      target: sc5d_step
      connection_type: PROVIDES_INPUT_FOR
      description: The Delta7-sterol (lathosterol) from EBP is desaturated by SC5D.
    - source: sc5d_step
      target: dhcr7_step
      connection_type: PROVIDES_INPUT_FOR
      description: 7-dehydrocholesterol from SC5D is reduced by DHCR7 to cholesterol.
  notes: >-
    The post-lanosterol segment of cholesterol biosynthesis grounded to the human enzymes
    CYP51A1 (UniProtKB:Q16850, GO:0008398, EC 1.14.14.154), MSMO1 (Q15800, GO:0000254, EC
    1.14.18.9), NSDHL (Q15738, GO:0000252), EBP (Q15125, GO:0000247, EC 5.3.3.5), SC5D
    (O75845, GO:0050046, EC 1.14.19.20) and DHCR7 (Q9UBM7, GO:0047598, EC 1.3.1.21). GO
    molecular-function terms were taken from the human GOA records; Reactome reaction ids were
    checked against the local reactome/ cache; R-HSA-194698 (TM7SF2), R-HSA-194674 (LBR) and
    R-HSA-194689 (HSD17B7) were cached in the 2026-10 revision and their reaction summaries
    confirmed to describe the Delta14 reduction and the C4-demethylation 3-keto reduction. Each step uses a PANTHER family
    selector with the human enzyme as representative (MSMO1 and SC5D share the fatty-acid-
    hydroxylase/sterol-desaturase family PTHR11863). This is a SIMPLIFIED ordered view of a
    ~19-reaction, branched segment: it runs as two interconvertible arms — the Bloch arm (the
    side-chain Delta24 bond is kept until the end) and the Kandutsch-Russell arm (DHCR24
    reduces Delta24 early) — differing only in when DHCR24 (UniProtKB:Q15392, GO:0050614
    Delta24-sterol reductase; deficiency = desmosterolosis) acts. Revision (2026-10, after the
    review PMID:42532476): DHCR24 is now an explicit part, connected both from HSD17B7 (zymosterol,
    the modified K-R entry; PMID:26114596) and from DHCR7 (desmosterol, the Bloch end). The
    Delta14-reduction step (TM7SF2 O76062 / LBR Q14739, GO:0050613) and the 3-keto reduction of C4
    demethylation (HSD17B7 P56937, GO:0000253) were added because the earlier chain skipped them.
    None of these three has a gene review in this repository; they are grounded to reviewed UniProt
    entries, GOA experimental annotations and Reactome reactions. The parts list still shows one
    C4-demethylation pass (MSMO1 -> NSDHL -> HSD17B7), which runs twice in the pathway. Upstream, lanosterol comes from the sterol_commitment_squalene_to_lanosterol
    module (FDFT1/SQLE/LSS); the immediate substrate lanosterol is made by the mevalonate ->
    squalene route. Disorders map to individual steps: CYP51A1 (no common disease), MSMO1
    (SC4MOL deficiency), NSDHL (CHILD/CK syndrome), EBP (CDPX2 / Conradi-Hunermann-Happle),
    SC5D (lathosterolosis), DHCR7 (Smith-Lemli-Opitz syndrome), DHCR24 (desmosterolosis).
