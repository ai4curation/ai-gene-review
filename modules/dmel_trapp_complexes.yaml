id: MODULE:dmel_trapp_complexes
title: TRAPP complexes in Drosophila melanogaster
description: >-
  Transport protein particle (TRAPP) complexes are multisubunit guanine nucleotide exchange
  factors for Rab GTPases in the secretory and autophagic pathways. A shared core, in which
  Bet3, Bet5 and Trs23 form the catalytic surface for Rab1 nucleotide exchange, is extended
  with Trs20, Trs31, Trs33 and the Trs20-like CG9067. Addition of the large subunits Trs120
  (SIDL) and Trs130 (brunelleschi, brun) forms TRAPPII, which acts at the Golgi and in Drosophila
  is required for male meiotic cytokinesis; addition of Trs85 (gryzun, gry) and the TRAPPC11,
  TRAPPC12 and TRAPPC13 homologs forms TRAPPIII, which acts in ER-to-Golgi transport and autophagy.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000149
  title: 'FlyBase gene group TRAPP: Trapp complexes'
  statement: >-
    FlyBase release FB2026_03 groups 13 D. melanogaster genes as trapp complexes (TRAPP);
    this module models that group.
- source_id: FB:FBgg0002202
  title: 'FlyBase gene group TRAPP-CAT: Trapp guanine nucleotide exchange factor catalytic
    core subunits'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as trapp guanine nucleotide exchange
    factor catalytic core subunits (TRAPP-CAT); this module models that group.
- source_id: GO:0030008
  title: TRAPP complex
  statement: >-
    GO term grounding the module as TRAPP complex.
notes: >-
  Decomposition. The shared core is split into the FlyBase catalytic core group (Bet3, Bet5,
  Trs23) and the other shared subunits; the complex-specific subunits are modelled as alternatives.
  TRAPPII-specific subunits (SIDL, brun) and TRAPPIII-specific subunits (gry, l(3)76BDm, CG11396,
  CG4953) follow the FlyBase TRAPPII and TRAPPIII groups. TRAPPII is reported to activate
  Rab11 as well as Rab1 in some systems; that specificity is not resolved for Drosophila and
  is not modelled. FlyBase groups realized by this module: TRAPP (FBgg0000149), TRAPP-CAT
  (FBgg0002202). Subgroups folded into it: TRAPPII, TRAPPIII. Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_trapp_complexes.yaml; none of the member genes has a gene review
  yet unless noted.
