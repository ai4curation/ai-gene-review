  connections:
    - source: tip_link
      target: met_channel
      connection_type: POSITIVELY_REGULATES
      description: >-
        Increased tip-link tension during deflection towards the tallest row is passed
        through PCDH15, LHFPL5 and TMIE to the pore and raises channel open probability.
    - source: upper_tip_link_density
      target: tip_link
      connection_type: POSITIVELY_REGULATES
      description: >-
        The harmonin-SANS-MYO7A complex anchors CDH23 and holds the tip link under resting
        tension.
    - source: myo1c_adaptation
      target: tip_link
      connection_type: NEGATIVELY_REGULATES
      description: >-
        During sustained deflection the adaptation motor slips, lowering tip-link tension
        and so channel open probability.
    - source: met_channel
      target: ihc_ribbon_exocytosis
      connection_type: POSITIVELY_REGULATES
      description: >-
        The transduction current depolarises the inner hair cell, which opens the
        presynaptic Ca2+ channels (CaV1.3, not modelled) that trigger otoferlin-dependent
        release.
    - source: ihc_glutamate_loading
      target: ihc_ribbon_exocytosis
      connection_type: PROVIDES_INPUT_FOR
      description: VGLUT3-loaded vesicles are the glutamate quanta released at the ribbon synapse.
knowledge_gaps:
  - gap_statement: >-
      Which motor sets resting tip-link tension and mediates slow adaptation in cochlear hair
      cells is unresolved; MYO7A localises to the upper tip-link density, while the
      MYO1C adaptation evidence comes from vestibular hair cells.
    boundary: >-
      MYO7A is modelled as the UTLD tensioning motor and MYO1C as an optional adaptation
      part restricted to equilibrioception; neither is asserted as the cochlear adaptation
      motor.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: Determines whether the tensioning and adaptation steps are one motor or two in the cochlea.
    resolution: >-
      Acute, motor-specific inhibition (for example analog-sensitive MYO7A or MYO1C alleles)
      in mature cochlear hair cells with measurement of resting open probability and
      adaptation kinetics.
    provenance:
      - reference_id: PMID:21709241
        supporting_text: However, localization studies are conflicting, leaving open the question of which myosin localizes at the UTLD and generates the tip-link resting tension.
      - reference_id: PMID:19447093
        supporting_text: It should also be noted that current models of MYO1C function in adaptation are largely based on the study of vestibular hair cells.
  - gap_statement: >-
      How tip-link tension is conveyed from PCDH15 through LHFPL5 and TMIE to open the TMC
      pore, and the stoichiometry of the native complex, are not established in mammalian
      hair cells.
    boundary: >-
      The channel is modelled as one complex with mechanosensitive cation channel activity;
      no gating mechanism or stoichiometry is asserted.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: The gating mechanism is the core unknown of hair-cell transduction.
    resolution: >-
      Structures of the native mammalian complex under tension and site-directed
      perturbation of the PCDH15-LHFPL5-TMIE-TMC1 interfaces with transduction recordings.
    provenance:
      - reference_id: PMID:25467981
        supporting_text: We also show that TMIE establishes a critical link between the PCDH15/LHFPL5 complex and the pore-forming subunits of the transduction channel.
