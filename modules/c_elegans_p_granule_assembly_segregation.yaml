                  becomes covered by smaller condensates assembled by MEG-3 and
                  MEG-4, two homologous intrinsically disordered proteins
    - order: 4
      role: anterior MEX-5/MEX-6 RNA-competition gradient
      node:
        id: mex_gradient
        label: MEX-5/MEX-6 anterior gradient that dissolves anterior granules
        module_type: REGULATORY_STEP
        description: >-
          PAR polarity enriches the tandem CCCH zinc-finger RNA-binding
          proteins MEX-5 and MEX-6 in the anterior cytoplasm of the zygote.
          MEX-5 binds U-rich RNA with high affinity and takes RNA away from the
          RNA-dependent scaffolds. It suppresses RNA-induced MEG-3 phase
          separation and dissolves PGL-3/RNA condensates. Granules therefore
          dissolve where MEX-5 is high and condense where it is low. MEX-6 is a
          nearly identical paralog that is redundant with MEX-5. Its direct
          effect on condensates has not been tested.
        concepts:
          - preferred_term: P granule disassembly
            term:
              id: GO:1903864
              label: P granule disassembly
