            evidence:
              - source_id: PMID:18234720
                title: DEPS-1 promotes P-granule assembly and RNA interference in C. elegans germ cells.
                statement: DEPS-1 is needed for PGL-1 localization and glh-1 accumulation.
                supporting_text: >-
                  DEPS-1 is required for the proper localization of PGL-1 to P
                  granules, the accumulation of glh-1 mRNA and protein
              - source_id: PMID:32843637
                title: DEPS-1 is required for piRNA-dependent silencing and PIWI condensate organisation in Caenorhabditis elegans.
                statement: DEPS-1 and PRG-1 co-assemble into perinuclear condensates.
                supporting_text: >-
                  DEPS-1 and PRG-1 form intertwining clusters to build
                  elongated condensates in vivo which are dependent on the
                  Piwi-interacting motif of DEPS-1.
    - order: 3
      role: MEG intrinsically disordered shell that stabilizes embryonic granules
      node:
        id: meg_embryonic_shell
        label: MEG-3/MEG-4 RNA-condensing shell on PGL droplets
        module_type: PROTEIN_COMPLEX
        description: >-
          In the zygote, the paralogous intrinsically disordered proteins MEG-3
          and MEG-4 form small, less dynamic condensates on the surface of PGL
          droplets. The MEG-3 C-terminal HMGL motif binds PGL-3 and couples the
          two phases, and the disordered N-terminal region binds RNA. MEG-3
          traps about 500 mRNAs in a sequence-independent way. Without the
          HMGL-PGL-3 contact, MEG-3 and PGL-3 form separate condensates that no
          longer co-segregate to the germline or recruit RNA. MEG-3/MEG-4 are
          needed for posterior segregation of P granules from the zygote stage
          onward.
        concepts:
          - preferred_term: P granule assembly
            term:
              id: GO:1903863
              label: P granule assembly
        context:
          cellular_components:
            - preferred_term: germ plasm
              term:
                id: GO:0060293
                label: germ plasm
        annotons:
          - id: meg3_scaffold
            label: MEG-3 RNA-binding condensate scaffold
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MEG-3
                term:
                  id: UniProtKB:Q9TXM1
                  label: Uncharacterized protein
            function:
              preferred_term: molecular condensate scaffold activity
              term:
                id: GO:0140693
                label: molecular condensate scaffold activity
              targets:
                - preferred_term: embryonic mRNAs with low ribosome coverage
            processes:
              - preferred_term: P granule assembly
                term:
                  id: GO:1903863
                  label: P granule assembly
            locations:
              - preferred_term: P granule
                term:
                  id: GO:0043186
                  label: P granule
              - preferred_term: germ plasm
                term:
                  id: GO:0060293
                  label: germ plasm
            role_description: >-
              The main embryonic scaffold. Phase separation induced by RNA
              forms a posterior-rich MEG-3 gradient, and binding to PGL-3
              couples MEG-3 condensates to the PGL core.
            evidence:
              - source_id: PMID:27914198
                title: Spatial patterning of P granules by RNA-induced phase separation of the intrinsically-disordered protein MEG-3.
                statement: P granule asymmetry depends on RNA-induced MEG-3 phase separation.
                supporting_text: >-
                  P granule asymmetry depends on RNA-induced phase separation of
                  the granule scaffold MEG-3
              - source_id: PMID:34106046
                title: Protein-based condensation mechanisms drive the assembly of RNA-rich P granules.
                statement: >-
                  Binding of the MEG-3 HMGL motif to PGL-3 is needed for
