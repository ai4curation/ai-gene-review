          They scaffold germline P-bodies, which carry the DDX6 helicase CGH-1,
          EDC-3 and the TIS11-family protein POS-1. These condensates sit next
          to P granules in P1 and mix with them in P4. Without meg-1 and meg-2,
          CGH-1 and EDC-3 do not accumulate in P4, POS-1 targets are
          misregulated, and the germline founder cell is mis-specified. CAR-1
          (LSM14) co-purifies with CGH-1 in germline RNA particles in an
          RNA-dependent way. Its dependence on MEG-1/MEG-2 has not been tested.
