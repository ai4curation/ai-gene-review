          the B56 regulatory subunits PPTR-1 and PPTR-2 dephosphorylates them,
          which promotes assembly. MBK-2 also primes MEX-5/MEX-6 at T186 for
          later phosphorylation by Polo kinases. That priming is needed for
          MEX-5 function and links the kinase to the gradient part.
