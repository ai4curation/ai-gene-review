  connections:
    - source: glh_perinuclear_layer
      target: pgl_core
      connection_type: POSITIVELY_REGULATES
      description: >-
        GLH-1/GLH-4 are needed for PGL proteins to associate with perinuclear P
        granules. DEPS-1 is needed for PGL-1 localization.
    - source: meg_embryonic_shell
      target: pgl_core
      connection_type: POSITIVELY_REGULATES
      description: >-
        MEG-3 binds PGL-3 through its HMGL motif, coats PGL droplets and
        stabilizes them so that they co-segregate to the germline.
      evidence:
        - source_id: PMID:34106046
          title: Protein-based condensation mechanisms drive the assembly of RNA-rich P granules.
          statement: PGL-3 binding recruits MEG-3 to the PGL condensate surface.
          supporting_text: >-
            binding between PGL-3 and MEG-3 recruits MEG-3 to the surface of
            PGL-3 condensates in germ plasm and stimulates condensation of
            MEG-3 and MEG-3-bound RNAs
    - source: mex_gradient
      target: meg_embryonic_shell
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Anterior MEX-5 suppresses MEG-3 phase separation, so a posterior-rich
        MEG-3 gradient forms opposite the MEX-5 gradient.
      evidence:
        - source_id: PMID:27914198
          title: Spatial patterning of P granules by RNA-induced phase separation of the intrinsically-disordered protein MEG-3.
          statement: The MEG-3 and MEX-5 gradients are anti-correlated.
          supporting_text: >-
            MEG-3 forms a posterior-rich concentration gradient that is
            anti-correlated with a gradient in the RNA-binding protein MEX-5
    - source: mex_gradient
      target: pgl_core
      connection_type: NEGATIVELY_REGULATES
      description: >-
        MEX-5 competes with PGL-3 for mRNA and dissolves PGL-3/RNA droplets in
        the anterior.
    - source: meg_phospho_switch
      target: meg_embryonic_shell
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Net effect of MBK-2 phosphorylation of MEG-3, which favors disassembly.
        PP2A-PPTR dephosphorylation acts in the opposite direction and favors
        assembly.
    - source: meg_phospho_switch
      target: germline_p_body
      connection_type: NEGATIVELY_REGULATES
      description: >-
        MEG-1 is also an MBK-2/PP2A substrate. The effect of its phosphorylation
        on germline P-body stability has not been measured directly.
    - source: meg_phospho_switch
      target: mex_gradient
      connection_type: POSITIVELY_REGULATES
      description: >-
        MBK-2 priming of MEX-5 T186 enables Polo kinase binding and is needed
        for MEX-5 function in vivo.
knowledge_gaps:
  - gap_statement: >-
      The direct targets of MBK-2 and PP2A-PPTR within the P granule are not
      fully known. It is unclear which MEG phosphosites control the
      condensation of MEG-3/MEG-4 and of MEG-1/MEG-2, and whether
      phosphorylation acts by changing RNA binding, PGL-3 binding or
      self-association.
    boundary: >-
      MEG-1 and MEG-3 are shown substrates. Phosphomimetic and phospho-dead
      effects on the separate germline P-body have not been tested.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This decides whether one kinase/phosphatase switch tunes both germ plasm
      condensates, or whether the MEG-1/2 and MEG-3/4 paralog pairs are
      controlled separately.
    resolution: >-
      Map phosphosites on each MEG in vivo, test phospho-mutant MEGs in in vitro
      RNA and PGL-3 co-condensation assays, and image germline P-bodies in
      mbk-2 and pptr-1 pptr-2 embryos.
    provenance:
      - reference_id: PMID:25535836
        supporting_text: >-
          The molecules and reactions that drive these dynamics in vivo are not
          well understood.
  - gap_statement: >-
      The molecular basis of P granule anchoring at nuclear pores is not
      established. It is not known which GLH, DEPS-1 or nucleoporin contacts
      tether the perinuclear granule, or what role helicase activity plays in
      that tethering.
    boundary: >-
      GLH proteins assemble at nuclear pores without the PGLs, and the PGLs need
      GLH-1 or GLH-4 to reach the nuclear periphery. Direct GLH-nucleoporin
      binding and DEPS-1-pore contacts are not shown in the cached primary
      literature.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      This links condensate position to mRNA export and to small RNA
      surveillance of newly exported transcripts.
    resolution: >-
      Map GLH-1 and DEPS-1 binding to nucleoporins, and test
      ATPase-dead or FG-repeat-deleted GLH-1 alleles for perinuclear PGL
      localization.
    provenance:
      - reference_id: PMID:20223759
        supporting_text: >-
          Our results suggest that nuclear-associated P granules provide a
          perinuclear compartment where newly exported mRNAs are collected prior
          to their release to the general cytoplasm.
