id: MODULE:c_elegans_p_granule_assembly_segregation
title: P granule assembly and asymmetric segregation in Caenorhabditis elegans
description: >-
  P granules are the germline ribonucleoprotein condensates of Caenorhabditis
  elegans. In adult germ cells they sit on the cytoplasmic face of nuclear pore
  clusters, where newly exported mRNAs pass through them. In oocytes and
  embryos they are cytoplasmic and are inherited by the germline founder cell.
  The condensate is built in layers. The PGL proteins PGL-1 and PGL-3 (with
  PGL-2 after embryogenesis) self-associate and bind RNA to form the liquid
  core. The Vasa-family DEAD-box helicases GLH-1 and GLH-4 (with GLH-2) gather
  at nuclear pores independently of the PGLs and are needed for the PGLs to
  reach the nuclear periphery. DEPS-1 is a perinuclear P granule protein that
  is needed for PGL-1 localization and GLH-1 accumulation, and that binds the
  Piwi protein PRG-1. In the zygote, the intrinsically disordered proteins
  MEG-3 and MEG-4 condense with mRNA on the surface of PGL droplets. This shell
  stabilizes the granules, recruits about 500 mRNAs, and makes the granules
  co-segregate with the germline. Segregation to the posterior blastomere uses
  two regulatory inputs. First, PAR polarity sets up an anterior-high gradient
  of the RNA-binding proteins MEX-5 and MEX-6. MEX-5 competes with PGL-3 and
  MEG-3 for RNA, so granules dissolve in the anterior and condense in the
  posterior. Second, the DYRK kinase MBK-2 phosphorylates MEG-1 and MEG-3 to
  promote granule disassembly, and the PP2A phosphatase with its PPTR-1/PPTR-2
  B56 regulatory subunits reverses this to promote assembly. MEG-1 and MEG-2
  scaffold a second germ plasm condensate. These germline P-bodies carry the
  DDX6 helicase CGH-1 and other decapping and deadenylation regulators, and
  they are needed to specify the germline founder cell. Loss of P granule
  components causes temperature-sensitive or complete sterility, and germ cells
  that lack P granules can switch to somatic fates.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:21402787
    title: PGL proteins self associate and bind RNPs to mediate germ granule assembly in C. elegans.
    statement: >-
      PGL-1 and PGL-3 are the scaffold of the germ granule. They use an RGG box
      to recruit RNA and RNA-binding proteins and a self-association domain to
      form globular granules.
    supporting_text: >-
      the PGL proteins PGL-1 and PGL-3 serve as the scaffold for germ granule
      formation in Caenorhabditis elegans
  - source_id: PMID:27594427
    title: Polar Positioning of Phase-Separated Liquid Compartments in Cells Regulated by an mRNA Competition Mechanism.
    statement: >-
      P granules are liquids whose posterior condensation is driven by polarity
      protein gradients, including the mRNA-binding protein MEX-5.
    supporting_text: >-
      They are liquids that condense at one end of the embryo by localized
      phase separation, driven by gradients of polarity proteins such as the
      mRNA-binding protein MEX-5.
  - source_id: PMID:20223759
    title: Perinuclear P granules are the principal sites of mRNA export in adult C. elegans germ cells.
    statement: >-
      For most of the life cycle P granules are attached to clusters of nuclear
      pore complexes on germ cell nuclei.
    supporting_text: >-
      Throughout most of the C. elegans life cycle, however, P granules are
      associated with clusters of nuclear pore complexes (NPCs) on germ cell
      nuclei.
  - source_id: PMID:24746798
    title: Germ-granule components prevent somatic development in the C. elegans germline.
    statement: >-
      Depleting the PGL nucleators and the GLH perinuclear-localization factors
      together makes germ cells express somatic markers. This shows that
      P granules protect germline identity.
    supporting_text: >-
      simultaneously knocking down factors that nucleate granule formation
      (PGL-1 and PGL-3) and promote their perinuclear localization (GLH-1 and
      GLH-4)
  - source_id: PMID:36196602
    title: Specialized germline P-bodies are required to specify germ cell fate in Caenorhabditis elegans embryos.
    statement: >-
      The embryonic germ plasm holds two distinct condensates. P granules
      depend on MEG-3/MEG-4 and germline P-bodies depend on MEG-1/MEG-2.
    supporting_text: >-
      P granules depend on MEG-3 and MEG-4 and germline P-bodies depend on
      MEG-1 and MEG-2.
  - source_id: file:modules/primordial_germ_cell_specification.yaml
    title: Primordial germ cell specification module
    statement: >-
      The taxon-neutral germline specification module. Its preformation variant
      (inherited germ plasm, Vasa/DDX4 exemplar) is the general context for
      this worm-specific condensate module.
  - source_id: file:projects/CAEEL_P_GRANULES.md
    title: C. elegans P Granule/Germ Granule Dynamics Project
    statement: >-
      Project page listing the reviewed P granule genes whose gene reviews
      ground the annotons in this module.
notes: >-
  Boundary. This is a concrete C. elegans module about how the P granule
  condensate is built, anchored and positioned. It covers the PGL core, the
  Vasa/GLH and DEPS-1 perinuclear layer, the MEG-3/MEG-4 embryonic shell, the
  MEX-5/MEX-6 gradient that dissolves anterior granules, and the
  MBK-2/PP2A-PPTR phosphorylation switch on MEG proteins. The germline P-body
  (MEG-1/MEG-2 with CGH-1 and CAR-1) is an optional companion part. It is a
  separate condensate (PMID:36196602, PMID:18692039) that merges with P
  granules in P4 and shares the MBK-2 input. Earlier work described MEG-1 and
  MEG-2 as P granule components (PMID:18202375), and the meg-1 and meg-2
  reviews still carry P granule assembly terms. Here they are placed in the
  P-body part to follow the later two-condensate model. The small RNA
  machinery that lives in or next to P granules is out of scope: the Argonautes
  PRG-1, CSR-1 and WAGO-1, the Z granule protein ZNFX-1, and the Mutator foci
  protein MUT-16. Those proteins use the granule but do not build or position
  it. DEPS-1 is kept because it is needed for PGL-1 localization and GLH-1
  accumulation. Its PRG-1 binding is recorded as a role, not as a separate
  silencing part.

  Anchoring. The perinuclear anchor is the GLH layer. GLH proteins gather at
  nuclear pores without the PGLs, and the PGLs need GLH-1 or GLH-4 to reach the
  nuclear periphery (PMID:33579952, PMID:18430929). Physical pore contacts are
  not modeled as a molecular function, because the gene reviews do not assert
  one. The nucleoporin NPP-10 and the Vasa paralog GLH-3 have no reviews and
  are left out. DEPS-1 is perinuclear and needed for PGL-1 localization, but
  no cached primary paper shows it binding nuclear pore proteins. It is
  therefore modeled as a perinuclear scaffold, not as a pore anchor.

  Phosphatase. PPTR-1 (UniProtKB:O18178) follows its gene review: a B56
  regulatory subunit with protein phosphatase activator activity
  (GO:0072542), part of the PP2A complex (GO:0000159), acting in P granule
  assembly by dephosphorylating MEG-1/MEG-3, redundantly with PPTR-2 and
  opposite to MBK-2. Its second core role, restraining AKT-1 in insulin/IGF-1
  signaling, is outside this module. PPTR-2 has only unreviewed TrEMBL entries
  spread over several isoforms. It is named in the text but not given an
  annoton. The PP2A catalytic and scaffold subunits (LET-92, PAA-1) are not
  modeled.

  MF choices follow the gene reviews' core_functions. PGL-1 carries identical
  protein binding (N-terminal dimerization) because its review does not use
  condensate scaffold activity. PGL-3, PGL-2, DEPS-1, MEG-2, MEG-3 and MEG-4
  carry molecular condensate scaffold activity (GO:0140693). MEG-1 carries
  molecular adaptor activity. PGL-1 and PGL-3 also have guanosine-specific
  RNase activity (PMID:26787882), but no assembly role has been shown for it,
  so it is not used here. MEX-5 and MEX-6 also repress translation of maternal
  mRNAs. That role belongs to embryonic patterning and is not modeled here.
module:
  id: c_elegans_p_granule_assembly_segregation
  label: P granule assembly and asymmetric segregation in C. elegans
  module_type: ORGANELLE_LIFECYCLE
  description: >-
    Layered assembly of the P granule condensate (PGL core, perinuclear GLH and
    DEPS-1 layer, embryonic MEG shell) and its posterior segregation in the
    zygote. Segregation is driven by an anterior MEX-5/MEX-6 RNA-competition
    gradient and by an MBK-2/PP2A phosphorylation switch on MEG proteins.
  concepts:
    - preferred_term: P granule organization
      term:
        id: GO:0030719
        label: P granule organization
      description: >-
        Covers both P granule assembly (GO:1903863) and P granule disassembly
        (GO:1903864). Those child terms are placed on the parts that drive each
        direction.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    cellular_components:
      - preferred_term: P granule
        term:
          id: GO:0043186
          label: P granule
    anatomical_locations:
      - preferred_term: germline and early embryo (P lineage)
        description: >-
          Adult and larval germ cells, oocytes, and the P0-P4 blastomeres of
          the early embryo.
  parts:
    - order: 1
      role: PGL scaffold core of the condensate
      node:
        id: pgl_core
        label: PGL self-associating RNA-binding scaffold core
        module_type: PROTEIN_COMPLEX
        description: >-
          PGL-1 and PGL-3 are constitutive P granule proteins that act
          redundantly for fertility. They self-associate through N-terminal and
          central dimerization domains and recruit RNA and RNA-binding proteins
          through C-terminal RGG boxes. In vitro, PGL-3 alone forms
          liquid droplets with mRNA. PGL-2 joins P granules only after
          embryogenesis, lacks the RGG box, and is not required for fertility
          even with pgl-1 loss. Each PGL reaches P granules independently of the
          other two.
        concepts:
          - preferred_term: P granule assembly
            term:
              id: GO:1903863
              label: P granule assembly
        annotons:
          - id: pgl1_scaffold
            label: PGL-1 self-associating P granule scaffold
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PGL-1
                term:
                  id: UniProtKB:Q9TZQ3
                  label: Guanyl-specific ribonuclease pgl-1
            function:
              preferred_term: identical protein binding
              term:
                id: GO:0042802
                label: identical protein binding
              description: >-
                N-terminal dimerization. Interface mutations prevent P granule
                assembly in vivo.
            processes:
              - preferred_term: P granule assembly
                term:
                  id: GO:1903863
                  label: P granule assembly
            locations:
              - preferred_term: P granule
                term:
                  id: GO:0043186
                  label: P granule
            role_description: >-
              Constitutive scaffold. Self-association through the N-terminal
              dimerization domain nucleates the granule, and the RGG box
              recruits RNA and RNP partners.
            evidence:
              - source_id: PMID:33579952
                title: C. elegans germ granules require both assembly and localized regulators for mRNA repression.
                statement: >-
                  Mutating the PGL-1 dimer interface blocks P granule assembly
                  in vivo and reduces fertility.
                supporting_text: >-
                  Therefore, PGL-1 dimerization lies at the heart of both P
                  granule assembly and function.
              - source_id: PMID:21402787
                title: PGL proteins self associate and bind RNPs to mediate germ granule assembly in C. elegans.
                statement: >-
                  PGL proteins have two assembly domains, an RGG box and a
                  self-association domain.
                supporting_text: >-
                  an RGG box for recruiting RNA and RNA-binding proteins and a
                  self-association domain for formation of globular granules
          - id: pgl3_scaffold
            label: PGL-3 condensate scaffold
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PGL-3
                term:
                  id: UniProtKB:G5EBV6
                  label: Guanyl-specific ribonuclease pgl-3
            function:
              preferred_term: molecular condensate scaffold activity
              term:
                id: GO:0140693
                label: molecular condensate scaffold activity
            processes:
              - preferred_term: P granule assembly
                term:
                  id: GO:1903863
                  label: P granule assembly
            locations:
              - preferred_term: P granule
                term:
                  id: GO:0043186
                  label: P granule
            role_description: >-
              Redundant with PGL-1 as the constitutive scaffold. PGL-3 with
              mRNA is enough to reconstitute P granule-like liquid droplets in
              vitro, and it is the PGL that MEG-3 binds through its HMGL motif.
            evidence:
              - source_id: PMID:15238518
                title: The PGL family proteins associate with germ granules and function redundantly in Caenorhabditis elegans germline development.
                statement: PGL-3 acts redundantly with PGL-1 for fertility.
                supporting_text: >-
                  at least PGL-3 functions redundantly with PGL-1 to ensure
                  fertility in both sexes of C. elegans
              - source_id: PMID:27594427
                title: Polar Positioning of Phase-Separated Liquid Compartments in Cells Regulated by an mRNA Competition Mechanism.
                statement: PGL-3 alone reconstitutes P granule-like droplets.
                supporting_text: >-
                  We reconstitute P granule-like droplets in vitro using a
                  single protein PGL-3.
          - id: pgl2_postembryonic
            label: PGL-2 postembryonic P granule scaffold component
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PGL-2
                term:
                  id: UniProtKB:P34266
                  label: P granule abnormality protein 2
            function:
              preferred_term: molecular condensate scaffold activity
              term:
                id: GO:0140693
                label: molecular condensate scaffold activity
              description: >-
                Taken from the pgl-2 review's core function. PGL-2 has no
                assembly phenotype of its own, so this is the weakest PGL
                assertion.
            locations:
              - preferred_term: P granule
                term:
                  id: GO:0043186
                  label: P granule
            role_description: >-
              Postembryonic PGL-family member that interacts with PGL-1 and
              PGL-3. It is dispensable for fertility, alone or with pgl-1.
            evidence:
              - source_id: PMID:15238518
                title: The PGL family proteins associate with germ granules and function redundantly in Caenorhabditis elegans germline development.
                statement: PGL-2 is a P granule component only after embryogenesis.
                supporting_text: >-
                  PGL-2 is associated with P granules only during postembryonic
                  development
    - order: 2
      role: perinuclear Vasa helicase and DEPS-1 layer
      node:
        id: glh_perinuclear_layer
        label: GLH Vasa helicases and DEPS-1 at the nuclear periphery
        module_type: MODULE
        description: >-
          In the adult germline, P granules sit over nuclear pore clusters.
          The Vasa-family DEAD-box helicases GLH-1 and GLH-4 gather at nuclear
          pores without the PGLs, and the PGLs need them to reach the nuclear
          periphery. Epistasis therefore puts the GLHs upstream of the PGLs and
          IFE-1 in assembly. GLH-1 is the main family member. GLH-4 is
          redundant with it, and GLH-2 is a further, non-essential paralog.
          DEPS-1 is a perinuclear P granule protein. It is needed for PGL-1 to
          localize to granules and for glh-1 mRNA and protein to accumulate,
          and it binds PRG-1 directly to organize perinuclear PIWI condensates.
        concepts:
          - preferred_term: P granule assembly
            term:
              id: GO:1903863
              label: P granule assembly
        context:
          cellular_components:
            - preferred_term: perinuclear region of cytoplasm
              term:
                id: GO:0048471
                label: perinuclear region of cytoplasm
        annotons:
          - id: glh1_helicase
            label: GLH-1 Vasa-family RNA helicase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GLH-1
                term:
                  id: UniProtKB:P34689
                  label: ATP-dependent RNA helicase glh-1
            function:
              preferred_term: RNA helicase activity
              term:
                id: GO:0003724
                label: RNA helicase activity
            processes:
              - preferred_term: P granule assembly
                term:
                  id: GO:1903863
                  label: P granule assembly
            locations:
              - preferred_term: P granule
                term:
                  id: GO:0043186
                  label: P granule
              - preferred_term: perinuclear region of cytoplasm
                term:
                  id: GO:0048471
                  label: perinuclear region of cytoplasm
            role_description: >-
              The main Vasa helicase. It is needed for PGL proteins to associate
              with perinuclear P granules.
            evidence:
              - source_id: PMID:18430929
                title: Genetic analysis of the Caenorhabditis elegans GLH family of P-granule proteins.
                statement: >-
                  GLH-1 and GLH-4 act upstream of the PGL proteins in P granule
                  assembly.
                supporting_text: >-
                  suggesting a pathway of P-granule assembly in which the GLHs
                  are upstream of the PGL proteins and the mRNA cap-binding
                  protein IFE-1
              - source_id: PMID:33579952
                title: C. elegans germ granules require both assembly and localized regulators for mRNA repression.
                statement: >-
                  GLH proteins assemble at nuclear pores independently of PGLs.
                supporting_text: >-
                  In contrast, GLH proteins can assemble at the nuclear pore
                  independently of PGLs
          - id: glh4_helicase
            label: GLH-4 Vasa-family RNA helicase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GLH-4
                term:
                  id: UniProtKB:O76743
                  label: ATP-dependent RNA helicase glh-4
            function:
              preferred_term: RNA helicase activity
              term:
                id: GO:0003724
                label: RNA helicase activity
            locations:
              - preferred_term: P granule
                term:
                  id: GO:0043186
                  label: P granule
            role_description: >-
              Redundant with GLH-1. The double loss causes glh-1-like sterility
              at all temperatures.
            evidence:
              - source_id: PMID:10851135
                title: Combinatorial RNA interference indicates GLH-4 can compensate for GLH-1; these two P granule components are critical for fertility in C. elegans.
                statement: GLH-1 or GLH-4 is enough to support germline development.
                supporting_text: >-
                  These studies reveal that C.elegans can use GLH-1 or GLH-4 to
                  promote germline development.
              - source_id: PMID:33579952
                title: C. elegans germ granules require both assembly and localized regulators for mRNA repression.
                statement: >-
                  PGL-1 and PGL-3 need GLH-1 or GLH-4 to localize to the
                  nuclear periphery.
                supporting_text: >-
                  both PGL-1 and PGL-3 rely on GLH-1 or GLH-4 Vasa helicases to
                  localize to the nuclear periphery in adult germ cells
          - id: glh2_helicase
            label: GLH-2 Vasa-family RNA helicase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GLH-2
                term:
                  id: UniProtKB:Q966L9
                  label: ATP-dependent RNA helicase glh-2
            function:
              preferred_term: RNA helicase activity
              term:
                id: GO:0003724
                label: RNA helicase activity
            locations:
              - preferred_term: P granule
                term:
                  id: GO:0043186
                  label: P granule
            role_description: >-
              Constitutive P granule helicase with six CCHC zinc fingers. It is
              not essential, and P granules still form when GLH-1 and GLH-4 are
              depleted.
            evidence:
              - source_id: PMID:8943022
                title: Multiple potential germ-line helicases are components of the germ-line-specific P granules of Caenorhabditis elegans.
                statement: GLH-1 and GLH-2 are P granule components at all germline stages.
                supporting_text: >-
                  Both GLH proteins localize in the P granules at all stage of
                  germ-line development.
          - id: deps1_scaffold
            label: DEPS-1 perinuclear P granule scaffold
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DEPS-1
                term:
                  id: UniProtKB:Q9N303
