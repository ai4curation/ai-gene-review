    - order: 6
      role: companion germline P-body condensate in the germ plasm
      optional: true
      notes: >-
        Optional because germline P-bodies are a separate condensate from P
        granules. They are kept because they share the germ plasm, merge with
        P granules in P4, use the MEG paralogs and the MBK-2/PP2A input, and
        are needed for germline founder cell fate.
      node:
        id: germline_p_body
        label: MEG-1/MEG-2 germline P-body with CGH-1 and CAR-1
        module_type: CELLULAR_COMPONENT
        description: >-
