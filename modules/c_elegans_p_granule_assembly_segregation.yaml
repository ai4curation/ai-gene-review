    - order: 5
      role: MBK-2/PP2A phosphorylation switch on MEG proteins
      node:
        id: meg_phospho_switch
        label: MBK-2 kinase and PP2A-PPTR phosphatase acting on MEGs
        module_type: REGULATORY_STEP
        description: >-
          MBK-2/DYRK is activated during the oocyte-to-embryo transition. It
