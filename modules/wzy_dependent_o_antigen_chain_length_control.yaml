id: MODULE:wzy_dependent_o_antigen_chain_length_control
title: Wzy-dependent O-antigen chain-length control
description: >-
  A structural regulation module for Wzy-dependent O-antigen biosynthesis in
  which the inner-membrane Wzz-family polysaccharide co-polymerase FepE
  controls very-long modal O-antigen chain length. FepE is a PCP-1 family
  scaffold/regulator of Wzy polymerase processivity and is not a protein kinase
  or ferric enterobactin transporter.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009243
    title: O antigen biosynthetic process
    statement: Defines the Wzy-dependent O-antigen process regulated by FepE.
  - source_id: file:genes/ECOLI/fepE/fepE-ai-review.yaml
    title: ECOLI fepE gene review
    statement: >-
      The completed E. coli fepE review grounds FepE as a Wzz/PCP-1
      O-antigen modal chain-length regulator.
  - source_id: PMID:12603743
    title: >-
      Regulation of Salmonella typhimurium lipopolysaccharide O antigen chain
      length is required for virulence; identification of FepE as a second Wzz.
    statement: >-
      Identifies FepE as the Wzz protein responsible for very-long modal
      O-antigen chains.
  - source_id: PMID:22437828
    title: >-
      Structural characterization of closely related O-antigen
      lipopolysaccharide (LPS) chain length regulators.
    statement: Supports the FepE PCP-1 structural model for modal chain-length regulation.
notes: >-
  The module name uses the pathway class rather than E. coli K-12 O-antigen
  output, because standard K-12 lacks an intact O-antigen locus. The reviewed
  FepE function is a conserved Wzz-family chain-length regulatory activity.
