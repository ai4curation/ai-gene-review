id: MODULE:dmel_hypusine_biosynthesis
title: Hypusine biosynthesis in Drosophila melanogaster
description: >-
  Hypusine is a modified lysine found only in translation factor eIF5A, where it is needed
  for eIF5A to support translation elongation through difficult sequences such as polyproline
  stretches. It is made in two steps. Deoxyhypusine synthase (Dhps) transfers the aminobutyl
  group of spermidine to a specific lysine of eIF5A, forming deoxyhypusine. Deoxyhypusine
  hydroxylase, encoded in Drosophila by nero, then hydroxylates this residue to hypusine.
  In flies, nero mutations affect cell and organ growth and autophagy.
status: DRAFT
scope: CONCRETE
