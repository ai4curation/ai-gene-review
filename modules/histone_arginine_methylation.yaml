                term:
                  id: GO:0005634
                  label: nucleus
            role_description: >-
              PRMT7 carries an IDA row for histone H4 methyltransferase activity
              (PMID:15494416), in which immunopurified human PRMT7 methylated histones and an
              H4 peptide. That paper reported symmetric dimethylarginine as the main product and
              called PRMT7 a type II enzyme; this was not borne out: purified PRMT7 makes only
              MMA (PMID:24247247, recombinant mouse PRMT7, used here only for the product type),
              and the RGD source review classes it as the type III enzyme. The product is
              therefore written as MMA, and the process is the omega-N-methylation parent rather
              than either dimethylation child. Histone H2B was the preferred histone substrate of
              the mouse enzyme, but no human histone site is grounded here, so the residue is
              left at the histone H4 level of the experimental row. The location is the nucleus
              (IDA, PMID:15494416) rather than chromatin, as no chromatin association of PRMT7
              is shown in the cached sources. PRMT7 is included because it has experimental
              histone methyltransferase evidence on the human protein; its in vivo histone role
              is recorded as a knowledge gap.
