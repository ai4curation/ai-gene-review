id: MODULE:histone_arginine_methylation
title: Human histone arginine methylation by the PRMT family — type I asymmetric dimethylation by PRMT1 (H4R3), CARM1/PRMT4 (H3R17, H3R26), PRMT6 (H3R2) and weakly PRMT2 (H4), type II symmetric dimethylation of H4R3 and H3R8 by PRMT5 with WDR77 (and COPR5 for H4R3), and type III monomethylation of histones by PRMT7
description: >-
  Arginine residues in the histone tails are methylated by protein arginine
  methyltransferases (PRMTs), which transfer methyl groups from S-adenosyl-L-methionine to
  the guanidino nitrogens of arginine and release S-adenosyl-L-homocysteine. All PRMTs make
  omega-N-monomethylarginine (MMA). Type I enzymes add a second methyl group to the same
  nitrogen and make asymmetric dimethylarginine (ADMA); the type II enzyme PRMT5 adds it to
  the other terminal nitrogen and makes symmetric dimethylarginine (SDMA); the type III enzyme
  PRMT7 stops at MMA. On histones the principal type I marks are H4R3me2a, deposited by
  PRMT1, the major H4R3 methyltransferase of human cells; H3R17me2a and H3R26me2a, deposited by
  the coactivator CARM1 (PRMT4); and H3R2me2a, deposited by PRMT6. PRMT2 also makes MMA and
  ADMA on histone H4, but with a turnover about 800-fold lower than PRMT1. PRMT1 and CARM1 are
  recruited as transcriptional coactivators by nuclear receptors and other transcription
  factors, and their marks are associated with gene activation, whereas H3R2me2a by PRMT6
  prevents H3K4 trimethylation by MLL complexes and is repressive. PRMT5 acts with its obligate
  WD40 partner WDR77 (MEP50) and symmetrically dimethylates H4R3 and H3R8; the histone-binding
  adaptor COPR5 (COPRS) directs nuclear PRMT5-WDR77 to H4R3 and to nucleosomes, and the
  symmetric marks are associated with transcriptional repression. Asymmetric and symmetric
  dimethylation of the same residue, H4R3, are mutually exclusive and have opposite
  transcriptional effects. Human PRMT7 methylates histones in vitro; it is a strict
  monomethylase, and its role on histones in cells is unsettled.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001338
    title: histone modification pathway
    statement: >-
      RGD curates six PRMT genes to this pathway, PRMT1, PRMT2, CARM1, PRMT5, PRMT6 and PRMT7
      (TAS, PMID:24583552 for all six), and its diagram draws "Rmethylases" acting on arginine
      and the methylarginine mark associated with "Rme-readers". This module realises the
      arginine methylation part of the pathway, item 6 of the histone modification split plan
      in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md.
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001338.yaml
    statement: RGD describes the three PRMT types and the products they make on histone arginines.
    supporting_text: Type I and II catalyze the formation of an MMA intermediate which is further processed to ADMA by type I or to SDMA by type II PRMTs
  - source_id: GO:0018216
    title: peptidyl-arginine methylation
    statement: >-
      PW:0001338 has no GO process mapping, and GO has obsoleted the histone arginine
      methylation process terms (histone arginine methylation and the H3R2, H3R17, H3R26 and
      H4R3 methylation terms) because each represents a molecular function. The module's
      process concept is therefore the general process peptidyl-arginine methylation, with its
      asymmetric and symmetric dimethylation children on the type I and type II annotons; the
      histone and residue specificity is carried by the site-specific molecular functions
      (histone H4R3, H3R17, H3R26, H3R2 and H3R8 methyltransferase activity) on the catalytic
      annotons.
  - source_id: PMID:24583552
    title: Readers of histone methylarginine marks.
    statement: The RGD source review classifies the PRMTs into type I (ADMA), type II (SDMA) and type III (MMA only) enzymes.
    supporting_text: Type I enzymes (PRMT1, PRMT2, PRMT3, PRMT4/CARM1, PRMT6, and PRMT8) perform a second methylation step to generate the ADMA mark, and the Type II enzyme (PRMT5) generates the SDMA mark.
  - source_id: PMID:24583552
    statement: PRMT1 and CARM1 are the coactivator PRMTs and deposit H4R3me2a and H3R17me2a.
    supporting_text: PRMT1 and CARM1 are the primary transcriptional coactivators in the PRMT enzyme family, and they deposit the H4R3me2a and H3R17me2a marks respectively
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001338 (histone modification pathway)
  through the RGD_PATHWAY_ONTOLOGY project, as item 6 of the histone modification split plan
  (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md; seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier no_specific_go_term, flagged
  broad, 173 RGD-curated human genes). PW:0001338 is the only PW evidence source: it has no PW
  children covering arginine methylation, and its diagram nodes "Rmethylases" and
  "Rme-readers" link only to RGD web pages, not to PW ids. UniProt accessions and recommended
  names are from UniProt REST (November 2026); none of the members has a gene review in this
  repository. Molecular functions are from each protein's experimental human GOA rows in
  QuickGO (November 2026), except where an annoton's role_description says the function is
  curator-authored.

  Membership. All six PRMT genes RGD annotates to PW:0001338 (PRMT1, PRMT2, CARM1, PRMT5,
  PRMT6, PRMT7; TAS, PMID:24583552) are participants. Two participants are added beyond the
  RGD list, each on cited human evidence: WDR77 (MEP50), the obligate partner of PRMT5
  (PMID:23071334, PMID:11756452), and COPRS (COPR5), the nuclear adaptor that binds histone H4
  and directs PRMT5 to H4R3 (PMID:18404153; Reactome R-HSA-5205861). Excluded RGD genes: the
  methylarginine readers RGD lists from reader reviews (TDRD3, which reads H3R17me2a and
  H4R3me2a; SPIN1; L3MBTL1; UHRF1) are readers outside any complex modelled here and stay out,
  following item 7 of the split plan. Not added: PRMT3 and PRMT9 (non-histone substrates),
  PRMT8 (a PRMT1 paralogue with no histone evidence cited here), CLNS1A (pICln, see below), the Reactome cyclin D1-CDK4 partners of PRMT5-WDR77
  (regulators that phosphorylate WDR77, not participants in the methyl transfer), and the
  BRG1/hBRM SWI/SNF remodelers that associate with PRMT5 (PMID:15485929), which have their own
  remodeler modules. Histone proteins are substrates and are not units.

  Process term. GO obsoleted histone arginine methylation and the H3R2, H3R17, H3R26 and H4R3
  methylation processes because they represent molecular functions, and obsoleted the
  grouping function histone arginine N-methyltransferase activity in favour of the
  site-specific children. The module concept is therefore the current general process
  peptidyl-arginine methylation, with its asymmetric and symmetric dimethylation children on
  the type I and type II nodes and the omega-N-methylation parent on PRMT7, which makes only
  monomethylarginine. These process assignments are curator-authored from the product type:
  none of the PRMTs carries an experimental human GOA row for the three dimethylation process
  terms. No new process term is requested, because GO's policy is to represent histone
  modifications as functions. Chromatin remodeling (IDA for PRMT5, PMID:18404153) is a second
  process on the PRMT5 H4R3 annoton only. The site-specific histone methyltransferase terms
  carry no Rhea cross-reference and Rhea has no histone-specific arginine methylation
  reactions, so the chemistry (SAM, SAH, H+, the arginine, MMA, ADMA and SDMA residues) is
  grounded through the protein-level Rhea reactions RHEA:48100, RHEA:48104, RHEA:48096 (type
  I), RHEA:48112 and RHEA:48108 (type II), with ChEBI labels checked in OLS.

  Boundary and modelling decisions. (1) Three parts by PRMT type, because the type determines
  the product (ADMA, SDMA or MMA); the parts are parallel, not ordered, so no connections are
  drawn. Type I and type II dimethylation of H4R3 are mutually exclusive on the same residue
  and have opposite transcriptional effects; this is recorded in prose rather than as a
  connection, since neither enzyme acts on the other. (2) Type I enzymes are an ONE_OR_MORE
  variant set, one variant per enzyme, each a gene product annoton: PRMT1 H4R3, CARM1 H3R17
  and H3R26 (two annotons, as GO has one term per residue), PRMT6 H3R2, and PRMT2 histone H4.
  (3) PRMT5 and the methylosome. The sibling module spliceosomal_snrnp_biogenesis models the
  PRMT5-WDR77-CLNS1A methylosome acting on Sm proteins in the cytoplasm. This module does not
  reuse it by module_ref, because pICln is an Sm-specific adaptor that competes with other
  PRMT5 adaptors; instead the histone-directed activity is a separate histone-context
  PRMT5-WDR77 complex without pICln, with COPR5 on the H4R3 annoton and the bare PRMT5-WDR77
  core on the H3R8 annoton. The complex term is histone methyltransferase complex (PRMT5 has
  an IDA part_of row, PMID:23048031), not methylosome, whose GO definition is restricted to
  Sm-protein methylation. (4) Subunits without catalysis. WDR77 is a unit without a function
  in both annotons: it is required for PRMT5 activity but was assayed only in the complex, and
  its experimental molecular-function rows concern other roles. COPRS carries its IDA histone
  binding row as its unit function. (5) Curator-authored functions, not backed by an
  experimental GOA row on that exact term: CARM1 histone H3R26 methyltransferase activity
  (PMID:11341840), PRMT5 histone H3R8 methyltransferase activity (PMID:15485929; Reactome
  R-HSA-5205799), and PRMT2 histone H4 methyltransferase activity (refined from the general
  histone methyltransferase IDA row of PMID:19405910, which assayed histone H4). (6) PRMT2 is
  kept as a minor variant despite an activity 800-fold below PRMT1, because the activity on
  histone H4 was measured directly and RGD lists it; its role in cells is not established.
  (7) PRMT7 is included as the type III part because the human enzyme has an experimental
  histone methyltransferase row (IDA, PMID:15494416); its product is written as MMA following
  the later biochemistry and the RGD source review, and its role in cells is a knowledge gap.
  (8) Downstream readers and effects are out of scope: H3R2me2a blocking WDR5 and H3K4
  trimethylation links to compass_family_h3k4_methylation; DNMT3A binding to H4R3me2s and the
  coactivator complexes that recruit PRMT1 and CARM1 (with CBP/p300, see
  histone_acetyltransferase_complexes) are not modelled. Non-histone PRMT substrates (Sm
  proteins, RNA-binding proteins, signalling proteins, transcription factors) are outside the
  module; the Sm-protein reaction is in spliceosomal_snrnp_biogenesis.

  Lysine methyltransferase gap. The split plan assigns H3K4 methylation by COMPASS to
  compass_family_h3k4_methylation and H3K27 methylation by PRC2 to
  polycomb_repressive_complexes, but is silent on the other histone lysine methyltransferases
  RGD annotates to PW:0001338: SETDB1, SUV39H1, SUV39H2, EHMT1, EHMT2 (H3K9); SETD2, NSD1,
  NSD3, ASH1L (H3K36); DOT1L (H3K79); KMT5A, KMT5B, KMT5C (H4K20); SETD7, SMYD1, SMYD2, SMYD3;
  and PRDM2, PRDM6, PRDM8, PRDM9 and PRDM16, together with KMT2E. They are not arginine
  methyltransferases and are not given parts here. The H3K9, H3K36, H3K79 and H4K20 enzymes
  are modelled in histone_lysine_methylation_h3k9_h3k36_h3k79_h4k20, which also records why
  SETD7, the SMYDs, the PRDMs and KMT2E are left out.

  GO-CAM links. gocams/index.tsv (November 2026) lists production models containing PRMT1
  (methylation of SMAD6, MRE11, TP53BP1, FMR1-related and mTORC1-related models), CARM1
  (FBXO9-mediated degradation), PRMT6 (FBXO24-mediated degradation) and PRMT5 (CGAS
  methylation). Every one models a non-histone substrate or the enzyme's own turnover, and
  none models histone methylation, so no gocam_associations are recorded. No model contains
  PRMT2, PRMT7, WDR77 or COPRS. PANTHER family ids and PTNs are deliberately not asserted.

  Possible upstream issues (queries only, not read in full). (a) CARM1 carries an IDA row for
  positive regulation of transcription by RNA polymerase I from PMID:15471871, a study of
  FXR-directed H3R17 methylation at the bile salt export pump (BSEP) gene, which is transcribed
  by RNA polymerase II; the row may have been meant as positive regulation of transcription by
  RNA polymerase II. (b) PRMT7 carries IDA rows for protein-arginine omega-N symmetric
  methyltransferase activity (PMID:15494416 and one other study) that later biochemistry
  contradicts (PMID:24247247 reports monomethylation only); a CHECK request to GOA, not a
  correction, since the human-enzyme papers were not read in full.
module:
