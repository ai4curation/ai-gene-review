        label: Type I PRMTs make asymmetric dimethylarginine on histones
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Each type I enzyme acts alone (as a homodimer or oligomer) and methylates a
          characteristic set of histone arginines: PRMT1 H4R3, CARM1 H3R17 and H3R26, PRMT6 H3R2
          (with H4R3 and H2AR3 in vitro), PRMT2 histone H4 at low rate.
        concepts:
          - preferred_term: peptidyl-arginine methylation, to asymmetrical-dimethyl arginine
            term:
              id: GO:0019919
              label: peptidyl-arginine methylation, to asymmetrical-dimethyl arginine
        variant_sets:
          - id: type_i_enzymes
            label: PRMT1, CARM1, PRMT6 or PRMT2
            axis: catalytic enzyme and histone site
            selection: ONE_OR_MORE
            variants:
              - id: prmt1_variant
                label: PRMT1, the major H4R3 asymmetric dimethylase
                description: >-
                  PRMT1 is the predominant type I enzyme of human cells and the major, if not exclusive,
