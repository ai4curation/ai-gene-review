  module_type: BIOLOGICAL_PROCESS
  description: >-
    Methylation of histone tail arginines by the three classes of protein arginine
    methyltransferases: type I asymmetric dimethylases (PRMT1, CARM1, PRMT6, PRMT2), the type
    II symmetric dimethylase PRMT5 with WDR77, and the type III monomethylase PRMT7.
