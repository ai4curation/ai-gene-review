id: MODULE:phage_protein_primed_dna_replication
title: Bacteriophage protein-primed linear dsDNA replication and early-to-late transcriptional switch
description: A reusable module representing protein-primed viral DNA replication and early-to-late transcriptional
  regulation in linear double-stranded DNA bacteriophages with 5'-covalently linked terminal proteins,
  exemplified by the Gram-positive Salasmaviridae podovirus Bacillus phage phi29 (BPPH2) and the Gram-negative
  internal-membrane Tectiviridae phage PRD1 (BPPRD). Because DNA polymerases cannot initiate synthesis
  de novo, these linear dsDNA phages solve the end-replication problem by using a genome-linked terminal
  protein (TP; phi29 gp3 or PRD1 P8) as a primer. A free TP molecule forms a heterodimer with the viral
  B-family DNA polymerase (phi29 gp2 or PRD1 P1) and is recruited to the inverted terminal repeat (ITR)
  replication origins at both genome ends—a step stimulated in phi29 by the histone-like nucleoprotein
  p6, early replication factor gp17, and membrane-anchoring replication proteins gp1 and gp16.7, and protected
  from host uracil excision by the uracil-DNA glycosylase inhibitor p56 (gene 0.8). The polymerase catalyzes
  the covalent linkage of the first deoxynucleotide (5'-dAMP in phi29 via Ser-232; 5'-dGMP in PRD1 via
  Tyr-190) to the terminal protein, recovers the terminal template nucleotide via a sliding-back (phi29)
  or jumping-back (PRD1) mechanism, and elongates full-length strands continuously via intrinsic strand-displacement
  synthesis without a replicative helicase while viral single-stranded DNA-binding proteins (phi29 gp5;
  PRD1 P12 and P19) coat and protect the displaced single strands. In phi29, cooperative binding of the
  transcriptional regulator p4 with p6 subsequently flips transcription from the early A2b/A2c promoters
  to the late morphogenetic A3 promoter.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0039693
  title: viral DNA genome replication
  statement: Ontology grounding for viral DNA genome replication (note that GO lacks a dedicated term for
    protein-primed viral DNA replication; GO:0039685 in GO is rolling hairpin viral DNA replication).
- source_id: file:genes/BPPH2/2/2-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P03680 (DPOL_BPPH2)
  statement: Establishes that phi29 gp2 is a protein-primed B-family DNA polymerase with TP-deoxynucleotidylation,
    sliding-back initiation, high-processivity strand-displacement DNA synthesis, and 3'-5' proofreading
    exonuclease activities.
  supporting_text: Polymerase responsible for protein-primed viral DNA replication by strand displacement
    with high processivity and fidelity (PubMed:2498321, PubMed:3863101). To start replication, the DNA
    polymerase forms a heterodimer with a free primer terminal protein (TP), recognizes the replication
    origins at both 5' ends of the linear chromosome, and initiates replication using as primer the OH-group
    of Ser-232 of the TP (PubMed:22210885).
- source_id: file:genes/BPPH2/3/3-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P03681 (TERM_BPPH2)
  statement: Establishes that phi29 gp3 is the primer terminal protein covalently linked via Ser-232 to
    the 5'-dAMP termini of both genome strands.
  supporting_text: Primer terminal protein (TP) is covalently linked to the 5'-ends of both strands of
    the genome through a phosphodiester bond between the beta-hydroxyl group of a serine residue and the
    5'-phosphate of the terminal deoxyadenylate (dAMP) (PubMed:6813861).
- source_id: file:genes/BPPRD/I/I-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P10479 (DPOL_BPPRD)
  statement: Establishes that PRD1 P1 is the protein-primed DNA-directed DNA polymerase with 3'-5' proofreading
    exonuclease activity that replicates the linear PRD1 genome.
  supporting_text: 'Replicates the viral genomic DNA. This polymerase possesses two enzymatic activities:
    DNA synthesis (polymerase) and an exonucleolytic activity that degrades single-stranded DNA in the
    3''- to 5''-direction for proofreading purpose.'
- source_id: file:genes/BPPRD/VIII/VIII-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P09009 (TERM_BPPRD)
  statement: Establishes that PRD1 P8 is the genome-linked DNA terminal protein essential for priming
    viral DNA replication (note that the UniProt CC line erroneously states 'beta-hydroxyl group of a
    tyrosine residue and the 5''-phosphate of the terminal deoxyadenylate' by similarity to phi29, whereas
    PMID:1655759 demonstrates a phenolic O4-hydroxyl Tyr-190 to 5'-dGMP linkage).
  supporting_text: Acts as a primer for viral genomic replication. DNA terminal protein is covalently
    linked to the 5'-ends of both strands of the genome through a phosphodiester bond between the beta-hydroxyl
    group of a tyrosine residue and the 5'-phosphate of the terminal deoxyadenylate. This protein is essential
    for DNA replication and is involved in the priming of DNA elongation (By similarity).
- source_id: PMID:1655759
  title: Overexpression, purification, and characterization of Escherichia coli bacteriophage PRD1 DNA polymerase. In vitro synthesis of full-length PRD1 DNA with purified proteins.
  statement: Directly demonstrates that PRD1 DNA polymerase P1 catalyzes formation of the P8-dGMP replication
    initiation complex and synthesizes full-length PRD1 DNA in vitro.
  supporting_text: Formation of the P8-dGMP replication initiation complex was a prerequisite for phage DNA replication, which proceeded from the initiation complex and yielded genome length replication products.
- source_id: file:genes/BPPH2/4/4-uniprot.txt
  title: UniProtKB/Swiss-Prot entry P03682 (TF4_BPPH2)
  statement: Establishes that phi29 p4 cooperates with histone-like protein p6 to repress early promoters
    A2b/A2c and activate the late A3 promoter.
  supporting_text: Mediates, together with protein p6, the early to late transcriptional switch by stabilizing
    the binding of host RNA polymerase (RNAP) to the late A3 promoter.
module:
  id: phage_protein_primed_dna_replication
  label: Bacteriophage protein-primed linear dsDNA replication and transcriptional switch
  module_type: BIOLOGICAL_PROCESS
  concepts:
  - preferred_term: protein-primed viral DNA replication
    term:
      id: GO:0039693
      label: viral DNA genome replication
    description: Replication of linear viral dsDNA primed by covalent deoxynucleotidylation of a genome-linked
      terminal protein and elongated by intrinsic strand displacement.
  - preferred_term: regulation of viral transcription
    term:
      id: GO:0046782
      label: regulation of viral transcription
    description: Coordinated repression of early viral promoters and activation of late morphogenetic
      promoters coupled to origin nucleoprotein remodeling.
  parts:
  - order: 1
    role: Host base-excision repair inhibition and origin nucleoprotein activation
    node:
      id: origin_activation_and_udg_inhibition
      label: Protection of viral DNA from host UDG and nucleoprotein activation of terminal replication
        origins
      module_type: REGULATORY_STEP
      annotons:
