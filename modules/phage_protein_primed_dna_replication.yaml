          preferred_term: structural molecule activity
          term:
            id: GO:0005198
            label: structural molecule activity
        processes:
        - preferred_term: viral DNA genome replication
          term:
            id: GO:0039693
            label: viral DNA genome replication
        locations:
        - preferred_term: host cell membrane
          term:
            id: GO:0033644
            label: host cell membrane
        role_description: Self-assembles via its C-terminal coiled-coil domain into two-dimensional protofilament
