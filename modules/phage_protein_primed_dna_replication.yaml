        label: Histone-like origin-melting dsDNA-binding protein p6
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Phage phi29 histone-like nucleoprotein p6 family
            representative_members:
            - preferred_term: 6 / p6 (Bacillus phage phi29 histone-like protein p6)
              term:
                id: UniProtKB:P03685
                label: Histone-like protein p6
        function:
          preferred_term: double-stranded DNA binding
          term:
            id: GO:0003690
            label: double-stranded DNA binding
        processes:
        - preferred_term: protein-primed viral DNA replication
          term:
            id: GO:0039693
            label: viral DNA genome replication
        - preferred_term: negative regulation of viral transcription
          term:
            id: GO:0032897
            label: negative regulation of viral transcription
        locations:
        - preferred_term: host cell cytoplasm
          term:
            id: GO:0030430
            label: host cell cytoplasm
        role_description: Wraps the AT-rich terminal replication origins into a right-handed toroidal
          superhelix to locally unwind the origin and recruit the gp2-gp3 heterodimer while repressing
          the early C2 promoter.
      - id: phi29_gp17_early_replication_factor
        label: Early replication origin recruitment factor gp17
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Phage phi29 early DNA replication protein gp17 family
            representative_members:
            - preferred_term: 17 / gp17 (Bacillus phage phi29 DNA replication protein 17)
              term:
                id: UniProtKB:P03686
                label: DNA replication protein 17
        processes:
        - preferred_term: viral DNA genome replication
          term:
            id: GO:0039693
            label: viral DNA genome replication
        locations:
        - preferred_term: host cell cytoplasm
          term:
            id: GO:0030430
            label: host cell cytoplasm
        role_description: Interacts with p6 at low multiplicity of infection to optimize p6 binding at
          the viral genome ends and stimulate early origin initiation.
  - order: 2
    role: Terminal-protein-primed initiation and sliding-back / jumping-back recovery
    node:
      id: tp_primed_initiation
      label: Terminal protein deoxynucleotidylation and template-recovery initiation by TP-DNAP heterodimer
      module_type: BIOLOGICAL_PROCESS
      annotons:
      - id: phage_terminal_protein_primer
        label: Genome-linked primer terminal protein (phi29 gp3 / PRD1 P8)
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Bacteriophage genome-linked primer terminal protein family
            representative_members:
            - preferred_term: 3 / gp3 (Bacillus phage phi29 primer terminal protein)
              term:
                id: UniProtKB:P03681
                label: Primer terminal protein
            - preferred_term: VIII / P8 (Enterobacteria phage PRD1 DNA terminal protein)
              term:
                id: UniProtKB:P09009
                label: DNA terminal protein
        function:
          preferred_term: DNA binding
          term:
            id: GO:0003677
            label: DNA binding
        processes:
        - preferred_term: protein-primed viral DNA replication
          term:
            id: GO:0039693
            label: viral DNA genome replication
        locations:
        - preferred_term: host cell cytoplasm
          term:
            id: GO:0030430
            label: host cell cytoplasm
        role_description: Forms a 1:1 initiation heterodimer with the viral B-family DNA polymerase and
          presents a side-chain hydroxyl group (Ser-232 in phi29 gp3; Tyr-190 in PRD1 P8) into the polymerase
          active site to prime covalent deoxynucleotidylation directed by an internal 3'-terminal template
          nucleotide, remaining covalently attached to the 5' ends of packaged viral DNA.
      - id: phage_protein_primed_dna_polymerase
        label: Protein-primed B-family DNA-directed DNA polymerase (phi29 gp2 / PRD1 P1)
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Bacteriophage protein-primed B-family DNA polymerase family
            representative_members:
            - preferred_term: 2 / gp2 (Bacillus phage phi29 DNA polymerase)
              term:
                id: UniProtKB:P03680
                label: DNA polymerase
            - preferred_term: I / P1 (Enterobacteria phage PRD1 DNA-directed DNA polymerase)
              term:
                id: UniProtKB:P10479
                label: DNA-directed DNA polymerase
        function:
          preferred_term: DNA-directed DNA polymerase activity
          term:
            id: GO:0003887
            label: DNA-directed DNA polymerase activity
        processes:
        - preferred_term: protein-primed viral DNA replication
          term:
            id: GO:0039693
            label: viral DNA genome replication
        locations:
        - preferred_term: host cell cytoplasm
          term:
            id: GO:0030430
            label: host cell cytoplasm
        role_description: Catalyzes TP deoxynucleotidylation, sliding-back or jumping-back recovery of
          the 3'-terminal sequence, and highly processive strand-displacement DNA synthesis coupled to
          intramolecular 3'-5' exonucleolytic proofreading via TPR1/TPR2 subdomains without requiring
          an accessory helicase or sliding clamp.
  - order: 3
    role: Strand-displacement elongation, ssDNA protection, and membrane compartmentalization
