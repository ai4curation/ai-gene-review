        participant:
          selector_type: FAMILY
          family:
            preferred_term: Phage phi29 integral membrane DNA-binding replication protein gp16.7 family
            representative_members:
            - preferred_term: 16.7 / gp16.7 (Bacillus phage phi29 DNA replication protein 16.7)
              term:
                id: UniProtKB:P16517
                label: DNA replication protein 16.7
        function:
          preferred_term: DNA binding
          term:
            id: GO:0003677
            label: DNA binding
