          term:
            id: GO:0030430
            label: host cell cytoplasm
        role_description: Cooperatively binds and melts secondary structures in the displaced single-stranded
          viral DNA strands generated during type I and type II strand-displacement replication, protecting
          intermediates from host nucleases and stimulating polymerase elongation.
      - id: phi29_gp1_membrane_protofilament_scaffold
        label: Membrane-associated protofilament replication scaffold gp1 (p1)
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Phage phi29 membrane-associated protofilament replication scaffold gp1 family
            representative_members:
