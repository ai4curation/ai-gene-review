          membrane.
  - order: 4
    role: Cooperative p4-p6 early-to-late transcriptional switch
    node:
      id: p4_p6_transcriptional_switch
      label: Cooperative p4 and p6 nucleoprotein remodeling to repress early promoters and activate the
        late A3 promoter
      module_type: REGULATORY_STEP
      annotons:
      - id: phi29_p4_late_activator
        label: Late genes transcriptional activator p4
        participant:
          selector_type: FAMILY
          family:
            preferred_term: Phage phi29 helix-turn-helix late transcription activator p4 family
            representative_members:
            - preferred_term: 4 / p4 (Bacillus phage phi29 late genes activator p4)
              term:
                id: UniProtKB:P03682
                label: Late genes activator p4
        function:
          preferred_term: DNA-binding transcription factor activity
          term:
            id: GO:0003700
            label: DNA-binding transcription factor activity
        processes:
        - preferred_term: positive regulation of viral transcription
          term:
            id: GO:0050434
            label: positive regulation of viral transcription
        - preferred_term: negative regulation of viral transcription
          term:
            id: GO:0032897
            label: negative regulation of viral transcription
        locations:
        - preferred_term: host cell cytoplasm
          term:
            id: GO:0030430
            label: host cell cytoplasm
        role_description: Dimeric DNA-binding transcription factor that binds inverted repeats between
          the early A2c/A2b promoters and the late A3 promoter, cooperating with p6 to remodel local promoter
          topology, repress early transcription, and recruit host vegetative sigma-A RNA polymerase via
          its alpha-subunit C-terminal domain to activate late morphogenetic and lysis gene expression.
  connections:
  - source: origin_activation_and_udg_inhibition
    target: tp_primed_initiation
    connection_type: POSITIVELY_REGULATES
    description: Inhibition of host UDG by p56 preserves intact template strands while p6 and gp17 unwind
      the AT-rich terminal origins and recruit the TP-polymerase complex.
  - source: tp_primed_initiation
    target: strand_displacement_and_membrane_anchoring
    connection_type: PROVIDES_INPUT_FOR
    description: Following TP deoxynucleotidylation, sliding-back/jumping-back recovery, and dissociation
      of the polymerase from the priming TP after transition to elongation, the polymerase continuously
      synthesizes full-length viral DNA via strand displacement.
  - source: strand_displacement_and_membrane_anchoring
    target: p4_p6_transcriptional_switch
    connection_type: PROVIDES_INPUT_FOR
    description: Accumulation of replicated viral DNA templates and early proteins p4 and p6 drives cooperative
      nucleoprotein assembly between the A2c/A2b and A3 promoters, switching gene expression to late virion
      morphogenesis.
  context:
    taxa:
    - preferred_term: Bacillus phage phi29
      term:
        id: NCBITaxon:2884424
        label: Bacillus phage phi29
    - preferred_term: Enterobacteria phage PRD1
      term:
        id: NCBITaxon:10658
        label: Enterobacteria phage PRD1
  notes: 'Exemplar phages: Bacillus phage phi29 (NCBITaxon:2884424, family Salasmaviridae): Canonical
    Gram-positive protein-primed podovirus encoding DNA polymerase gp2, primer terminal protein gp3, ssDNA-binding
    protein gp5, histone-like origin protein p6, membrane replication factors gp1 and gp16.7, early factor
    gp17, UDG inhibitor p56 (0.8), and late transcription factor p4. Enterobacteria phage PRD1 (NCBITaxon:10658,
    family Tectiviridae): Canonical internal-membrane dsDNA phage encoding protein-primed B-family DNA
    polymerase P1 (gene I), tyrosine-linked terminal protein P8 (gene VIII), and ssDNA-binding proteins
    P12 (gene XII) and P19 (gene XIX).'
