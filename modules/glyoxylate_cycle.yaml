  connections:
    - source: glyoxylate_citrate_synthase_step
      target: glyoxylate_aconitase_step
      connection_type: PRECEDES
      description: Citrate (exported from the peroxisome in yeast).
    - source: glyoxylate_aconitase_step
      target: isocitrate_lyase_step
      connection_type: PRECEDES
      description: Isocitrate.
    - source: isocitrate_lyase_step
      target: malate_synthase_step
      connection_type: PRECEDES
      description: Glyoxylate; the co-product succinate leaves the cycle.
    - source: malate_synthase_step
      target: glyoxylate_malate_dehydrogenase_step
      connection_type: PRECEDES
      description: (S)-Malate.
    - source: glyoxylate_malate_dehydrogenase_step
      target: glyoxylate_citrate_synthase_step
      connection_type: PRECEDES
      description: Oxaloacetate closes the cycle.
  knowledge_gaps:
    - gap_statement: >-
        How citrate, malate and oxaloacetate cross the yeast peroxisomal
        membrane between the peroxisomal (CIT2, MDH3, oleate-grown MLS1) and
        cytosolic (ACO1, ICL1, MDH2) glyoxylate-cycle enzymes is not
        established; pore-mediated permeability rather than dedicated
        carriers has been proposed (PMID:23966945).
      boundary: >-
        The module records enzyme compartments on representative members but
        does not model transport steps.
      gap_kind:
        - BIOLOGY
