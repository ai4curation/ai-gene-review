id: MODULE:glyoxylate_cycle
title: Glyoxylate cycle
description: >-
  The glyoxylate cycle (glyoxylate shunt) lets bacteria, fungi, plants and
  nematodes grow on two-carbon compounds such as acetate, ethanol or fatty
  acids by converting acetyl-CoA into four-carbon dicarboxylic acids without
  losing carbon as CO2. It shares the citrate synthase, aconitase and malate
  dehydrogenase reactions with the tricarboxylic acid cycle but replaces the two
  oxidative decarboxylations with two signature reactions: isocitrate lyase
  cleaves isocitrate into succinate and glyoxylate, and malate synthase
  condenses glyoxylate with a second acetyl-CoA to form malate. Malate is
  oxidized back to oxaloacetate to close the cycle, so each turn takes in two
  acetyl-CoA and releases one succinate, which is used for gluconeogenesis and
  biosynthesis. In bacteria all reactions are cytoplasmic and the TCA-cycle
  enzymes are shared. In eukaryotes the cycle is split between compartments
  and uses dedicated isozymes: in plant seedlings the enzymes are concentrated
  in glyoxysomes, a specialized form of peroxisome, whereas in budding yeast
  citrate synthase is peroxisomal while aconitase, isocitrate lyase and the
  main malate dehydrogenase are cytosolic and malate synthase is cytosolic on
  ethanol but peroxisomal on fatty acids, so intermediates cross the
  peroxisomal membrane. Nematodes and Euglena carry isocitrate lyase and
  malate synthase as two domains of one bifunctional protein. Mammals lack
  the signature enzymes.
status: DRAFT
evidence:
  - source_id: GO:0006097
    title: glyoxylate cycle
    statement: Module-level process for the isocitrate lyase/malate synthase bypass.
  - source_id: YeastPathways:GLYOXYLATE-BYPASS
    title: glyoxylate cycle (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists MALATE-DEH-RXN (MDH1, MDH2, MDH3), ISOCIT-CLEAV-RXN
      (ICL1), MALSYN-RXN (MLS1, DAL7), the two aconitase half-reactions (ACO1,
      ACO2) and CITSYN-RXN (CIT1, CIT2, CIT3). After review the retained
      glyoxylate-cycle catalysts are CIT2, ACO1, ICL1, MLS1 and MDH2 plus MDH3.
      CIT1, CIT3 and MDH1 are mitochondrial TCA-cycle enzymes, ACO2 is a
      homocitrate dehydratase of lysine biosynthesis, and DAL7 is the
      allantoin-pathway malate synthase.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=GLYOXYLATE-BYPASS
  - source_id: YeastPathways:PWY3O-94
    title: superpathway of TCA cycle and glyoxylate cycle (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway frame combining the TCA cycle (modelled in tca_cycle) with
      the isocitrate lyase and malate synthase reactions modelled here.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-94
  - source_id: PMID:13430766
    title: Synthesis of cell constituents from C2-units by a modified tricarboxylic acid cycle.
    statement: Original description of the glyoxylate cycle as a modified TCA cycle that synthesizes cell constituents from C2 units.
  - source_id: PMID:7033207
    title: Genetic regulation of the glyoxylate shunt in Escherichia coli K-12.
    statement: >-
      The two unique glyoxylate-shunt enzymes of E. coli, isocitrate lyase
      (aceA) and malate synthase (aceB), form an operon required for growth on
      acetate or fatty acids.
  - source_id: PMID:1551398
    title: The ICL1 gene from Saccharomyces cerevisiae.
    statement: >-
      ICL1 deletion abolishes isocitrate lyase activity and growth on ethanol as
      sole carbon source.
  - source_id: PMID:1454530
    title: Differentially regulated malate synthase genes participate in carbon and nitrogen metabolism of S. cerevisiae.
    statement: >-
      MLS1 is the carbon-source-regulated malate synthase used on nonfermentable
      carbon, whereas DAL7 is nitrogen-regulated and participates in allantoin
      catabolism.
  - source_id: PMID:11846793
    title: Targeting of malate synthase 1 to the peroxisomes of Saccharomyces cerevisiae cells depends on growth on oleic acid medium.
    statement: >-
      Mls1p is peroxisomal in oleate-grown cells but primarily cytosolic in
      ethanol-grown cells, and a cytosolic Mls1p fully supports growth on
      ethanol or acetate.
  - source_id: PMID:2181273
    title: Citrate synthase encoded by the CIT2 gene of Saccharomyces cerevisiae is peroxisomal.
    statement: The CIT2 citrate synthase is peroxisomal and participates in the glyoxylate cycle.
  - source_id: PMID:15975908
    title: 'Yeast aconitase in two locations and two metabolic pathways: seeing small amounts is believing.'
    statement: >-
      A small cytosolic pool of Aco1 carries out the glyoxylate shunt while the
      mitochondrial pool functions in the TCA cycle.
  - source_id: PMID:23106124
    title: The fungal α-aminoadipate pathway for lysine biosynthesis requires two enzymes of the aconitase family for the isomerization of homocitrate to homoisocitrate.
    statement: Yeast Aco2p contributes exclusively to lysine biosynthesis, so it is not a glyoxylate-cycle aconitase.
  - source_id: PMID:1986231
    title: 'Isolation, nucleotide sequence analysis, and disruption of the MDH2 gene from Saccharomyces cerevisiae: evidence for three isozymes of yeast malate dehydrogenase.'
    statement: >-
      MDH2, the major nonmitochondrial malate dehydrogenase in acetate-grown
      cells, is required for growth on acetate or ethanol.
  - source_id: PMID:1447211
    title: Isolation and characterization of the yeast gene encoding the MDH3 isozyme of malate dehydrogenase.
    statement: >-
      MDH3 is a peroxisomal (SKL-terminated) isozyme contributing about 10% of
      malate dehydrogenase activity on acetate; its disruption reduces growth on
      acetate.
  - source_id: PMID:7673155
    title: Expression and function of a mislocalized form of peroxisomal malate dehydrogenase (MDH3) in yeast.
    statement: >-
      Peroxisomal MDH3, unlike the other glyoxylate-pathway enzymes, is not
      subject to catabolite inactivation, and a cytosolic form of MDH3 can
      substitute for MDH2.
  - source_id: PMID:23966945
    title: 'Permeability of the peroxisomal membrane: lessons from the glyoxylate cycle.'
    statement: >-
      Compares the compartmentation of glyoxylate-cycle enzymes in
      S. cerevisiae, C. albicans and Arabidopsis: in S. cerevisiae Icl1p,
      Mdh2p and Aco1p are cytosolic and Cit2p peroxisomal, and among the yeast
      citrate synthases only Cit2p contributes to the cycle.
  - source_id: PMID:20889721
    title: Intracellular acetyl unit transport in fungal carbon metabolism.
    statement: >-
      Peroxisomal citrate synthase converts acetyl-CoA into citrate that can
      cross membranes, one of two fungal acetyl-unit transport systems.
  - source_id: PMID:15923350
    title: Arabidopsis peroxisomal citrate synthase is required for fatty acid respiration and seed germination.
    statement: >-
      Arabidopsis peroxisomal CSY2/CSY3 are glyoxylate-cycle citrate synthases
      also needed for fatty-acid respiration in seedlings.
  - source_id: PMID:11173291
    title: Re-examining the role of the glyoxylate cycle in oilseeds.
    statement: >-
      The plant glyoxylate cycle converts storage-lipid acetyl-CoA into
      carbohydrate during seedling establishment.
  - source_id: PMID:7781887
    title: 'Bifunctional glyoxylate cycle protein of Caenorhabditis elegans: a developmentally regulated protein of intestine and muscle.'
    statement: >-
      The C. elegans protein carries separate isocitrate lyase and malate
      synthase domains in one polypeptide with both activities.
  - source_id: PMID:15964777
    title: Molecular characterization of a bifunctional glyoxylate cycle enzyme, malate synthase/isocitrate lyase, in Euglena gracilis.
    statement: >-
      Euglena carries a bifunctional malate synthase-isocitrate lyase with the
      domain order inverted relative to the C. elegans protein.
  - source_id: PMID:11452311
    title: The glyoxylate cycle is required for fungal virulence.
    statement: >-
      Phagocytosed yeast induce glyoxylate-cycle genes, and Candida albicans
      icl1 mutants are less virulent in mice.
  - source_id: PMID:12455685
    title: 'Life and death in a macrophage: role of the glyoxylate cycle in virulence.'
    statement: Review of the glyoxylate cycle in microbial survival inside phagocytes; cited by YeastPathways.
  - source_id: PMID:27678487
    title: Pex9p is a new yeast peroxisomal import receptor for PTS1-containing proteins.
    statement: >-
      Under oleate conditions Pex9p imports both malate synthase isoenzymes,
      Mls1p and Mls2p (Dal7p), into peroxisomes.
notes: >-
  NEW (YeastPathways project, 2026-10). Scope: the isocitrate lyase plus
  malate synthase bypass with the three shared reactions that close the cycle
  (citrate synthase, aconitase, malate dehydrogenase), generalized over
  bacteria, fungi, plants and nematodes. Succinate export and its further
  conversion (succinate-fumarate carrier, TCA-cycle succinate dehydrogenase and
  fumarase, cytosolic malate dehydrogenase and PEP carboxykinase) are downstream
  links to tca_cycle and gluconeogenesis; acetyl-CoA supply (fatty-acid
  beta-oxidation, acetyl-CoA synthetase) is upstream. Neither is modelled here.
  The shared steps carry only the glyoxylate-cycle isozymes as yeast
  exemplars (peroxisomal CIT2, the cytosolic pool of ACO1, cytosolic MDH2 and
  peroxisomal MDH3); the mitochondrial isozymes are in tca_cycle. In bacteria
  such as E. coli the same citrate synthase, aconitase and malate
  dehydrogenase enzymes serve both cycles. Variant set: malate synthase is
  either a monofunctional malate synthase A-family enzyme (fungi, plants,
  enterobacteria; PANTHER PTHR42902) or the C-terminal domain of a
  bifunctional isocitrate lyase-malate synthase (C. elegans icl-1; the protein
  falls in the isocitrate lyase family PTHR21631). The malate synthase G family
  (PTHR42739, E. coli GlcB), which serves the glyoxylate shunt in some bacteria
  but glycolate utilization in E. coli, is not given an exemplar here; see
  glycolate_glyoxylate_assimilation for that bacterial route. YeastCyc
  corrections: DAL7 (malate synthase 2) is excluded because its physiological
  role is in allantoin catabolism under nitrogen control (PMID:1454530); ACO2
  is excluded (homocitrate dehydratase, PMID:23106124); CIT1, CIT3 and MDH1
  are mitochondrial TCA-cycle isozymes. Note that CIT2 is dispensable on
  ethanol or acetate when mitochondrial citrate synthesis can substitute
  (PMID:23966945), and that MDH2, not peroxisomal MDH3, is the main
  glyoxylate-cycle malate dehydrogenase on two-carbon substrates
  (PMID:1986231, PMID:1447211). GO-CAM disagreements: the YeastPathways
  GLYOXYLATE-BYPASS conversion places every activity, including peroxisomal
  CIT2, MLS1 and MDH3, in the cytosol, and enables the aconitase and malate
  synthase reactions by ACO2 and DAL7 respectively. There is no PomBase
  glyoxylate-cycle model; the PomBase TCA-cycle model 665912ed00000015 types
  SPBC1683.11c (PomBase icl1) as isocitrate lyase acting with the glyoxylate
  reductase gor2 in glyoxylate catabolism, whereas UniProt (Q9P6J1) names it a
  mitochondrial 2-methylisocitrate lyase, so no S. pombe exemplar is given.
