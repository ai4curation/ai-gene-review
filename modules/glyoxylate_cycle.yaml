        label: Aconitase
        module_type: REACTION
        annotons:
          - id: glyoxylate_aconitase_activity
            label: Aconitase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: aconitate hydratase family (cytosolic pool of the TCA-cycle aconitase in yeast)
                representative_members:
                  - preferred_term: ACO1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P19414
                      label: Aconitate hydratase, mitochondrial
                    description: >-
                      The small cytosolic fraction of Aco1 serves the
                      glyoxylate shunt (PMID:15975908).
            function:
              preferred_term: aconitate hydratase activity
              term:
                id: GO:0003994
                label: aconitate hydratase activity
              substrates:
                - preferred_term: citrate
              products:
                - preferred_term: isocitrate
            role_description: >-
              Isomerizes citrate to isocitrate via cis-aconitate; in yeast this
              is the cytosolic pool of the same ACO1 gene product that acts in
              the mitochondrial TCA cycle.
            gocam_associations:
              - model: gomodel:YeastPathways_GLYOXYLATE-BYPASS
                activity: gomodel:ACONITATEDEHYDR-RXN
                title: 'glyoxylate cycle - imported from: Saccharomyces Genome Database'
                description: >-
                  ACO1 and ACO2 enable GO:0003994 in cytosol; ACO2 is excluded
