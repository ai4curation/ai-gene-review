      title: 'glyoxylate cycle - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with CIT2, ACO1/ACO2, ICL1, MLS1/DAL7 and MDH2/MDH3, all
        placed in the cytosol and part of GO:0006097, without causal edges.
    - model: gomodel:YeastPathways_PWY3O-94
