        activities alongside the TCA cycle.
  parts:
    - order: 1
      role: acetyl-CoA entry
      node:
        id: glyoxylate_citrate_synthase_step
        label: Citrate synthase (glyoxylate-cycle isozyme)
        module_type: REACTION
        annotons:
          - id: glyoxylate_citrate_synthase_activity
            label: Citrate synthase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: citrate synthase families (peroxisomal eukaryotic isozymes; bacterial GltA shared with the TCA cycle)
                representative_members:
                  - preferred_term: CIT2 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P08679
                      label: Citrate synthase, peroxisomal
                    description: Peroxisomal (PTS1) isozyme (PMID:2181273).
                  - preferred_term: CSY2 (Arabidopsis thaliana)
                    term:
                      id: UniProtKB:Q9LXS6
                      label: Citrate synthase 2, peroxisomal
                  - preferred_term: CSY3 (Arabidopsis thaliana)
                    term:
                      id: UniProtKB:Q9SJH7
                      label: Citrate synthase 3, peroxisomal
                  - preferred_term: gltA (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0ABH7
                      label: Citrate synthase
                    description: Single citrate synthase serving both the TCA and glyoxylate cycles.
            function:
              preferred_term: citrate synthase activity
              term:
                id: GO:0036440
                label: citrate synthase activity
              substrates:
                - preferred_term: acetyl-CoA
                - preferred_term: oxaloacetate
                - preferred_term: H2O
              products:
                - preferred_term: citrate
                - preferred_term: CoA
            role_description: >-
              Condenses the first acetyl-CoA of each turn with oxaloacetate. In
              fungi and plants a peroxisomal isozyme couples the cycle to
              peroxisomal acetyl-CoA from fatty-acid beta-oxidation.
            gocam_associations:
              - model: gomodel:YeastPathways_GLYOXYLATE-BYPASS
                activity: gomodel:CITSYN-RXN
                title: 'glyoxylate cycle - imported from: Saccharomyces Genome Database'
                description: CIT2 enables GO:0036440 (placed in cytosol rather than peroxisome).
    - order: 2
