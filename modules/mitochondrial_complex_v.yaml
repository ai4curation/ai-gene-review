knowledge_gaps:
  - gap_statement: >-
      Whether the LINC00528 locus (UniProtKB:Q8N1L1 / C22orf37) is protein-coding at all is
      unresolved, so the reported 170-aa microprotein "ATHENA" cannot yet be admitted as a
      Complex V assembly factor. The prior question is not what ATHENA does but whether the
      protein exists: UniProt annotates Q8N1L1 as reviewed with protein existence "Uncertain"
      and the caution "Product of a dubious CDS prediction. May be a non-coding RNA", and the
      entry carries no GO annotations at all (QuickGO, 0 hits).
    boundary: >-
      What is established is the composition of the module itself — the F1/Fo subunits and the
      two assembly factors ATPAF2 and TMEM70 — each grounded in a completed gene review and in
      PANTHER family membership. What is reported but unconfirmed is that ATHENA localises to the
      mitochondrial inner membrane, binds the ATP synthase beta and gamma subunits together with
      ANT and PiC, and promotes assembly of the ATP synthasome (PMID:42547818, a single 2026
      primary paper, abstract-only in this repository). Every other LINC00528 study in PubMed
      treats the locus as a non-coding RNA — e.g. as a cytoplasmic miR-143-3p sponge
      (PMID:31833800) — and none reports a translated product. Q8N1L1 has no PANTHER family, no
      InterPro signature, no annotated transmembrane segment and no annotated subcellular
      location, so the module's usual FAMILY-based participant grounding is unavailable.
      Accordingly ATHENA is recorded here as a candidate member and is deliberately NOT added as
      a part or annoton of the module.
    gap_kind:
      - BIOLOGY
      - CURATION
    dark_aspect: WHOLLY_DARK
    status: OPEN
    significance: >-
      The "ATP synthase-associated macromolecular complex" (ATP synthasome: ATP synthase plus the
      adenine nucleotide translocase and the phosphate carrier) is itself a contested assembly,
      and its dedicated biogenesis factors are largely unknown. A genuine microprotein that
      chaperones synthasome assembly would be a substantive addition to the two assembly factors
      currently modelled (ATPAF2, TMEM70), and would also add a lncRNA-encoded microprotein to a
      complex whose subunit inventory is otherwise considered closed.
    resolution: >-
      Independent confirmation that the ORF is translated in vivo — endogenous peptide detection
      by mass spectrometry, ribosome profiling, or antibody/epitope-tagged detection at the native
      locus — followed by an upgrade of the UniProt protein-existence level for Q8N1L1 away from
      "Uncertain" and removal of the dubious-CDS caution. Given that grounding, the next steps are
      a human gene review under genes/human/LINC00528/ and, if the interaction data hold, an
      annoton in the complex_v_assembly node using selector_type GENE_PRODUCT (no PANTHER family
      exists), with GO:0033615 mitochondrial proton-transporting ATP synthase complex assembly and
      GO:0005743 mitochondrial inner membrane. Until then the module composition is unchanged.
    provenance:
      - reference_id: PMID:42547818
        full_text_unavailable: true
        supporting_text: >-
          Here, we identify a 170-amino acid protein encoded by the lncRNA LINC00528, which we
          term ATP synthase-associated macromolecular complex enhancing microprotein (ATHENA).
          Mechanistically, ATHENA localizes to the mitochondrial inner membrane, in which ATHENA
          directly interacts with ATP synthase subunits (β and γ) and solute carrier proteins,
          including ANT and PiC, thereby promoting the assembly of these macromolecular complexes,
          enhancing ATP synthesis, and preserving mitochondrial and cristae architecture.
      - reference_id: PMID:42547818
        full_text_unavailable: true
        supporting_text: >-
          the regulation and potential function of this complex remain poorly understood in cancer
      - reference_id: PMID:31833800
        supporting_text: >-
          Nuclear-cytoplasmic fractionation assay showed that LINC00528 was mainly localized in
          cytoplasm
      - reference_id: PMID:31833800
        supporting_text: >-
          These data suggested that LINC00528 might serve as a sponge of miR-143-3p in myocardial
          cells
