  - source_id: PMID:42547818
    title: ATHENA promotes the assembly of the ATP synthase-associated macromolecular complex and cancer progression.
    statement: >-
      Evaluated candidate assembly factor ATHENA, a reported 170-aa microprotein encoded by the lncRNA
      LINC00528 (UniProtKB:Q8N1L1), said to sit in the inner membrane, bind the F1 beta and gamma subunits
      plus ANT and PiC, and promote assembly of the ATP synthase-associated macromolecular complex
      (ATP synthasome). NOT modelled as a part of this module — see notes for why the claim is held pending.
    supporting_text: >-
      Mechanistically, ATHENA localizes to the mitochondrial inner membrane, in which ATHENA directly
      interacts with ATP synthase subunits (β and γ) and solute carrier proteins, including ANT and PiC,
      thereby promoting the assembly of these macromolecular complexes, enhancing ATP synthesis, and
      preserving mitochondrial and cristae architecture.
  - source_id: UniProtKB:Q8N1L1
    title: Putative uncharacterized protein encoded by LINC00528 (CV037_HUMAN)
    statement: >-
      The only protein-level identifier for ATHENA is UniProtKB:Q8N1L1, which UniProt currently lists at
      protein existence level 5 (Uncertain) with "CAUTION: Product of a dubious CDS prediction. May be a
      non-coding RNA." It carries no GO annotations and no PANTHER family assignment, so the ORF's coding
      status is not yet supported by the reference proteome.
    url: https://www.uniprot.org/uniprotkb/Q8N1L1
  - source_id: PMID:42809533
    title: Complexome profiling of mitochondria in the myzozoan parasite of oysters, Perkinsus marinus.
    statement: >-
      Evaluated candidate components ATPPM1 and ATPPM2 (Pmar_PMAR021141 = UniProtKB:C5KGI6;
      Pmar_PMAR014495 = UniProtKB:C5KWE2), two proteins that co-migrate with the enlarged ~1.9 MDa
      Perkinsus marinus ATP synthase in complexome profiles and are also recovered with the
      size-exclusion-purified complex. The authors propose them as candidate replacements for the
      lineage-specific Toxoplasma luminal-domain subunits (ATPTG5, 7, 10, 11, 16) that Perkinsus
      appears to lack. NOT modelled as parts or as a taxon variant of this module — see notes.
    supporting_text: >-
      These data suggest that the association with ATP synthase is genuine, and they represent either
      novel ATP synthase subunits, or late-stage assembly factors, and we putatively assign them the
      names ATPPM1–2, although further experimental work would be required to confirm this.
  - source_id: PMID:42809533
    title: Complexome profiling of mitochondria in the myzozoan parasite of oysters, Perkinsus marinus.
    statement: >-
      The gap the two candidates are proposed to fill: five of the Toxoplasma lineage-specific
      subunits that build the expanded luminal domain have no detectable Perkinsus homolog, so the
      candidate assignment rests on an argument from absence plus co-migration rather than on a
      structure or a loss-of-function phenotype.
    supporting_text: >-
      We were unable to identify Perkinsus homologs of many of the corresponding lineage-specific
      subunits (ATPTG5,7,10,11 and 16)
  - source_id: UniProtKB:C5KGI6
    title: Uncharacterized protein Pmar_PMAR021141 (C5KGI6_PERM5), putative ATPPM1
    statement: >-
      ATPPM1 resolves to UniProtKB:C5KGI6, an unreviewed (TrEMBL) Perkinsus marinus ATCC 50983 entry
      of 99 aa — consistent with the 10 kDa protein described in the paper — at protein existence
      level 4 (Predicted). It has no InterPro or PANTHER cross-reference and no GO annotation, so the
      module's FAMILY-based participant grounding is unavailable for it.
    url: https://www.uniprot.org/uniprotkb/C5KGI6
  - source_id: UniProtKB:C5KWE2
    title: Pmar_PMAR014495 (C5KWE2_PERM5), putative ATPPM2
    statement: >-
      ATPPM2 resolves to UniProtKB:C5KWE2, an unreviewed Perkinsus marinus ATCC 50983 entry of 171 aa
      (~19 kDa, matching the paper) at protein existence level 4 (Predicted), with no PANTHER family
      and no GO annotation. Its protein name is submitter-supplied annotation in an unreviewed entry,
      and its only InterPro match is the structure-level Thioredoxin-like superfamily (see below)
      rather than a family-level glutaredoxin signature; the sequence carries three cysteines
      (positions 15, 21 and 46), the first two inside the predicted N-terminal targeting region, and
      no CXXC or CGFS redox motif. A redox-active glutaredoxin function should therefore not be
      assumed from the entry name.
    url: https://www.uniprot.org/uniprotkb/C5KWE2
  - source_id: InterPro:IPR036249
    title: Thioredoxin-like superfamily
    statement: >-
      The "predicted thioredoxin domain" reported for ATPPM2 corresponds to IPR036249, a homologous
      superfamily (fold-level) entry, which places the protein in the thioredoxin fold without
      assigning it to a functional family.
    url: https://www.ebi.ac.uk/interpro/entry/InterPro/IPR036249/
knowledge_gaps:
  - gap_statement: >-
      Whether the LINC00528 locus (UniProtKB:Q8N1L1 / C22orf37) is protein-coding at all is
      unresolved, so the reported 170-aa microprotein "ATHENA" cannot yet be admitted as a
      Complex V assembly factor. The prior question is not what ATHENA does but whether the
      protein exists: UniProt annotates Q8N1L1 as reviewed with protein existence "Uncertain"
      and the caution "Product of a dubious CDS prediction. May be a non-coding RNA", and the
      entry carries no GO annotations at all (QuickGO, 0 hits).
    boundary: >-
      What is established is the composition of the module itself — the F1/Fo subunits and the
      two assembly factors ATPAF2 and TMEM70 — each grounded in a completed gene review and in
      PANTHER family membership. What is reported but unconfirmed is that ATHENA localises to the
      mitochondrial inner membrane, binds the ATP synthase beta and gamma subunits together with
      ANT and PiC, and promotes assembly of the ATP synthasome (PMID:42547818, a single 2026
      primary paper, abstract-only in this repository). No independent report of a translated
      product was found; the LINC00528 literature located here instead treats the locus as a
      non-coding RNA — e.g. as a cytoplasmic miR-143-3p sponge (PMID:31833800). That is a
      bounded search rather than an exhaustive one, and it was not re-run against PubMed at
      review time, so it should be re-checked before the gap is closed either way. Q8N1L1 has no PANTHER family, no
      InterPro signature, no annotated transmembrane segment and no annotated subcellular
      location, so the module's usual FAMILY-based participant grounding is unavailable.
      Accordingly ATHENA is recorded here as a candidate member and is deliberately NOT added as
      a part or annoton of the module.
    gap_kind:
      - BIOLOGY
      - CURATION
      - ONTOLOGY
    dark_aspect: WHOLLY_DARK
    status: OPEN
    significance: >-
      The "ATP synthase-associated macromolecular complex" (ATP synthasome: ATP synthase plus the
      adenine nucleotide translocase and the phosphate carrier) is itself a contested assembly,
      and its dedicated biogenesis factors are largely unknown. A genuine microprotein that
      chaperones synthasome assembly would be a substantive addition to the two assembly factors
      currently modelled (ATPAF2, TMEM70), and would also add a lncRNA-encoded microprotein to a
      complex whose subunit inventory is otherwise considered closed.
    resolution: >-
      Two independent things must be settled, and the second decides where ATHENA would belong.
      (1) Existence: independent confirmation that the ORF is translated in vivo — endogenous
      peptide detection by mass spectrometry, ribosome profiling, or antibody/epitope-tagged
      detection at the native locus — followed by an upgrade of the UniProt protein-existence
      level for Q8N1L1 away from "Uncertain" and removal of the dubious-CDS caution, then a human
      gene review under genes/human/LINC00528/. (2) Placement: evidence that separates an effect
      on F1Fo holoenzyme biogenesis — the role ATPAF2 and TMEM70 occupy in this node — from an
      effect on association of the holoenzyme with the ADP/ATP and phosphate carriers, which the
      single available report does not distinguish (see notes). If the holoenzyme-assembly branch
      holds, the admission path is an annoton in the complex_v_assembly node using selector_type
      GENE_PRODUCT (no PANTHER family exists), with GO:0033615 mitochondrial proton-transporting
      ATP synthase complex assembly and GO:0005743 mitochondrial inner membrane. If instead the
      effect proves to be on carrier association only, oxphos_adenine_nucleotide_phosphate_carriers.yaml
      is the better home and GO:0033615 is the wrong term: it covers assembly of the ATP synthase,
      not of the synthase-carrier supercomplex, and GO currently has no ATP synthasome assembly
      term to use in its place (searched via OLS). That missing term is the ONTOLOGY component of
      this gap; no replacement is proposed here, because the synthasome's status as a stable
      entity is itself contested and a term should not be proposed for an entity that may not
      survive. Until all of this is settled the module composition is unchanged.
    provenance:
      - reference_id: PMID:42547818
        full_text_unavailable: true
        reference_section_type: ABSTRACT
        supporting_text: >-
          Here, we identify a 170-amino acid protein encoded by the lncRNA LINC00528, which we
          term ATP synthase-associated macromolecular complex enhancing microprotein (ATHENA).
          Mechanistically, ATHENA localizes to the mitochondrial inner membrane, in which ATHENA
          directly interacts with ATP synthase subunits (β and γ) and solute carrier proteins,
          including ANT and PiC, thereby promoting the assembly of these macromolecular complexes,
          enhancing ATP synthesis, and preserving mitochondrial and cristae architecture.
      - reference_id: PMID:42547818
        full_text_unavailable: true
        reference_section_type: ABSTRACT
        supporting_text: >-
          the regulation and potential function of this complex remain poorly understood in cancer
      - reference_id: PMID:31833800
        reference_section_type: RESULTS
        supporting_text: >-
          Nuclear-cytoplasmic fractionation assay showed that LINC00528 was mainly localized in
          cytoplasm
      - reference_id: PMID:31833800
        reference_section_type: RESULTS
        supporting_text: >-
          These data suggested that LINC00528 might serve as a sponge of miR-143-3p in myocardial
          cells
  - gap_statement: >-
      Whether the two myzozoan-specific proteins that co-purify with the enlarged Perkinsus marinus
      ATP synthase — ATPPM1 (Pmar_PMAR021141, UniProtKB:C5KGI6) and ATPPM2 (Pmar_PMAR014495,
      UniProtKB:C5KWE2) — are structural subunits of the holoenzyme or late-stage assembly factors
      that leave it is unresolved, and the two readings imply different module placements. The
      authors state the alternative explicitly and do not choose between them. Nor is it known
      whether either protein substitutes structurally for the expanded-luminal-domain subunits that
      Perkinsus appears to lack (the Toxoplasma ATPTG5, 7, 10, 11 and 16 set), which is the
      inference the candidate assignment rests on.
    boundary: >-
      What is established is association: both proteins co-migrate with the other ATP synthase
      subunits at ~1.9 MDa in every complexome dataset, at abundances comparable to the other
      myzozoan-specific subunits, and both are recovered alongside 22 expected subunits from
      size-exclusion-purified ATP synthase (PMID:42809533, full text read). What is not established
      is stoichiometry, position in the complex, or necessity: there is no structure placing either
      protein, and no knockdown, knockout or conditional-depletion assembly or growth phenotype for
      either. The structural substitution for the missing ATPTG subunits is an inference from
      absence plus size similarity, not a measurement — the paper notes only that ATPPM1 is short
      (10 kDa) like ATPTG10, 11 and 16. Grounding is also thin: both are unreviewed TrEMBL entries
      at protein existence level 4 (Predicted) with no GO annotation and no PANTHER family, so the
      module's usual FAMILY-based participant grounding is unavailable, and for ATPPM2 the only
      InterPro match is the fold-level Thioredoxin-like superfamily (IPR036249) rather than a
      glutaredoxin family signature. Mitochondrial localisation for both rests on DeepLoc 2.1
      prediction, not on imaging or fractionation of the individual proteins. This is a bounded
      assessment of one paper rather than a literature sweep on either accession.
    gap_kind:
      - BIOLOGY
    dark_aspect: WHOLLY_DARK
    status: OPEN
    significance: >-
      The enlarged, 32-subunit myzozoan ATP synthase is the clearest case of a respiratory complex
      whose subunit inventory is lineage-specific rather than conserved, and in Toxoplasma and
      Plasmodium several of those lineage-specific subunits are required for growth — which is what
      makes the apicomplexan complex a drug target that the human holoenzyme is not. Whether the
      luminal/hexamerisation subunits are replaced by non-homologous proteins in other myzozoans, or
      simply absent, decides whether that expanded architecture is ancestral to Myzozoa or an
      apicomplexan specialisation. It also bears on this module only negatively: it marks where the
      human subunit inventory stops being a template for the complex in other eukaryotes.
    resolution: >-
      For the subunit-versus-factor question: a structure of the Perkinsus (or any non-apicomplexan
      myzozoan) ATP synthase with either protein resolved in density, or quantitative
      stoichiometry on the purified complex, would settle placement; conditional depletion with
      complexome or BN-PAGE readout would separate a structural subunit (holoenzyme fails to form
      or runs smaller) from a late-stage assembly factor (holoenzyme forms, intermediate
      accumulates). For the substitution question: cross-linking or interface mapping against the
      subunits flanking the Toxoplasma luminal domain, or detection of divergent ATPTG5/7/10/11/16
      homologs by structure-based rather than sequence-based search (the authors' own preferred
      hypothesis for their absence). Curation would then follow, and not before: neither protein is
      admissible to this module in any case, because this module is the human holoenzyme — see the
      notes for why a taxon variant is the wrong vehicle and what the admission path would be.
    provenance:
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          We noted that in all complexome datasets 2 other proteins (Pmar_PMAR021141 and
          Pmar_PMAR014495) consistently co-migrated with the other subunits of ATP synthase, with
          similar abundance to other myzozoan-specific ATP synthase subunits
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          In addition to detection of 22 expected ATP synthase subunits, both of these new proteins
          were also present (S7 Table).
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          These data suggest that the association with ATP synthase is genuine, and they represent
          either novel ATP synthase subunits, or late-stage assembly factors, and we putatively
          assign them the names ATPPM1–2, although further experimental work would be required to
          confirm this.
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          Similar to the missing subunits from Toxoplasma ATPTG10,11 and 16, Pmar_PMAR021141 is a
          short protein of 10 kDa.
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          Pmar_PMAR014495 is a 19 kDa protein with a predicted thioredoxin domain.
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          Both proteins are predicted to be mitochondrially localised using DeepLoc 2.1 prediction
          models [47]
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          Perkinsus may lack this domain or it may possess derived versions of the missing subunits,
          which we were not able to detect by homology searches due to sequence divergence.
