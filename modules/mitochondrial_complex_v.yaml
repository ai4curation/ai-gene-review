id: MODULE:mitochondrial_complex_v
title: Mitochondrial respiratory Complex V (F1Fo ATP synthase) — subunits and F1 assembly; ATP5F1A/ATP5F1B/ATP5F1D/ATP5F1E/ATP5PO/ATP5MC3/ATP5MD + ATPAF2/TMEM70
description: >-
  Complex V, the F1Fo ATP synthase, is the terminal enzyme of oxidative phosphorylation: it uses
  the proton-motive force generated by the electron transport chain (Complexes I-IV) to drive the
  synthesis of ATP from ADP and inorganic phosphate. It is a rotary molecular motor with two
  coupled sectors. The membrane-embedded Fo sector — the c-ring (ATP5MC1/2/3), the a-subunit
  (mtDNA-encoded MT-ATP6) and small membrane subunits including DAPIT (ATP5MD) and 6.8PL — conducts
  protons and rotates the central stalk; the matrix-facing F1 sector is the catalytic head, an
  alpha3-beta3 hexamer (ATP5F1A/ATP5F1B) whose three catalytic nucleotide sites are turned through
  their conformational cycle by the rotating central stalk (gamma/ATP5F1C, delta/ATP5F1D,
  epsilon/ATP5F1E). The peripheral (stator) stalk, anchored at the top by OSCP (ATP5PO), holds the
  F1 head stationary against the rotor so that rotation is converted into ATP synthesis rather than
  futile spinning. Assembly is factor-dependent: ATPAF2 (ATP12) is a matrix chaperone that binds
  the F1 alpha subunit to build the alpha3-beta3 catalytic core, and TMEM70 is an inner-membrane
  scaffold that promotes incorporation of subunit c into the Fo c-ring rotor. Neither factor is a
  subunit of the mature enzyme or carries its catalytic activity. Inherited defects in the subunits or assembly factors cause
  mitochondrial complex V (ATP synthase) deficiency — commonly a neonatal encephalopathy with
  3-methylglutaconic aciduria, lactic acidosis and cardiomyopathy.
references:
  - id: PMID:42547818
    title: ATHENA promotes the assembly of the ATP synthase-associated macromolecular complex and cancer progression.
    reference_review:
      relevance: MEDIUM
      correctness: DISPUTED
      review_notes: >-
        Identifier and title checked against the cached PubMed record (no wider literature sweep
        was run; see the boundary note on the ATHENA knowledge gap). Sole report that LINC00528
        (UniProtKB:Q8N1L1,
        C22orf37) is translated into a 170-aa mitochondrial microprotein ("ATHENA") that promotes
        assembly of the ATP synthase-associated macromolecular complex. Only the abstract is
        cached (full_text_available: false), so the coding-potential evidence (Ribo-seq, endogenous
        peptide detection, tagged-locus expression) cannot be inspected here. Marked DISPUTED
        rather than VERIFIED because the central claim — that this locus is protein-coding at all —
        is contradicted by the current UniProt annotation and unsupported by any independent study;
        see the ATHENA knowledge gap below.
  - id: PMID:31833800
    title: LINC00528 regulates myocardial infarction by targeting the miR-143-3p/COX-2 axis.
    reference_review:
      relevance: LOW
      correctness: VERIFIED
      review_notes: >-
        Not about Complex V. Cited only to delimit the ATHENA knowledge gap: an independent study
        that treats LINC00528 as a cytoplasmic non-coding RNA acting as a miR-143-3p sponge, with
        no reference to a translated product or to mitochondria.
  - id: PMID:42809533
    title: Complexome profiling of mitochondria in the myzozoan parasite of oysters, Perkinsus marinus.
    reference_review:
      relevance: MEDIUM
      correctness: VERIFIED
      review_notes: >-
        Identifier and title checked against the cached PMC full text (PMC13623125,
        full_text_available: true). Primary complexome-profiling study of Perkinsus marinus
        mitochondria; directly about F1Fo ATP synthase composition, but in a myzozoan rather than in
        the human subunits this module is grounded on. Cited here to delimit the ATPPM1/ATPPM2
        knowledge gap below. The two central claims used — that the two proteins co-migrate and
        co-purify with ATP synthase, and that this leaves subunit versus late-assembly-factor
        undecided — are stated and hedged by the authors themselves, so no soundness concern
        arises; the paper is not used to support any module part.
status: DRAFT
