  - source_id: PMID:42547818
    title: ATHENA promotes the assembly of the ATP synthase-associated macromolecular complex and cancer progression.
    statement: >-
      Evaluated candidate assembly factor ATHENA, a reported 170-aa microprotein encoded by the lncRNA
      LINC00528 (UniProtKB:Q8N1L1), said to sit in the inner membrane, bind the F1 beta and gamma subunits
      plus ANT and PiC, and promote assembly of the ATP synthase-associated macromolecular complex
      (ATP synthasome). NOT modelled as a part of this module — see notes for why the claim is held pending.
    supporting_text: >-
      Mechanistically, ATHENA localizes to the mitochondrial inner membrane, in which ATHENA directly
      interacts with ATP synthase subunits (β and γ) and solute carrier proteins, including ANT and PiC,
      thereby promoting the assembly of these macromolecular complexes, enhancing ATP synthesis, and
      preserving mitochondrial and cristae architecture.
  - source_id: UniProtKB:Q8N1L1
    title: Putative uncharacterized protein encoded by LINC00528 (CV037_HUMAN)
    statement: >-
      The only protein-level identifier for ATHENA is UniProtKB:Q8N1L1, which UniProt currently lists at
      protein existence level 5 (Uncertain) with "CAUTION: Product of a dubious CDS prediction. May be a
      non-coding RNA." It carries no GO annotations and no PANTHER family assignment, so the ORF's coding
      status is not yet supported by the reference proteome.
    url: https://www.uniprot.org/uniprotkb/Q8N1L1
  - source_id: PMID:42809533
    title: Complexome profiling of mitochondria in the myzozoan parasite of oysters, Perkinsus marinus.
    statement: >-
      Evaluated candidate subunits ATPPM1 (Pmar_PMAR021141, UniProtKB:C5KGI6, 99 aa) and ATPPM2
      (Pmar_PMAR014495, UniProtKB:C5KWE2, 171 aa), two proteins that co-migrate with ATP synthase in
      every Perkinsus marinus complexome dataset and are recovered with the size-exclusion-purified
      complex. NOT modelled as parts of this module: they are candidate components of the divergent
      myzozoan enzyme, not of the human F1Fo holoenzyme this module is grounded on, and the authors
      leave subunit versus late-stage-assembly-factor undetermined — see notes for why.
    supporting_text: >-
      they represent either novel ATP synthase subunits, or late-stage assembly factors, and we
      putatively assign them the names ATPPM1–2, although further experimental work would be
      required to confirm this
  - source_id: PMID:42809533
    title: Complexome profiling of mitochondria in the myzozoan parasite of oysters, Perkinsus marinus.
    statement: >-
      The candidates were sought because the Perkinsus enzyme lacks detectable homologs of several
      Toxoplasma lineage-specific luminal-domain subunits, a gap that is itself specific to the
      myzozoan complex and has no counterpart in the human enzyme modelled here.
    supporting_text: >-
      We were unable to identify Perkinsus homologs of many of the corresponding lineage-specific
      subunits (ATPTG5,7,10,11 and 16)
  - source_id: UniProtKB:C5KGI6
    title: Uncharacterized protein Pmar_PMAR021141 (Perkinsus marinus ATCC 50983 / TXsc)
    statement: >-
      ATPPM1 resolves to UniProtKB:C5KGI6, a 99-aa TrEMBL entry at protein existence "Predicted"
      with no GO annotation, no PANTHER family, no InterPro signature and no annotated transmembrane
      segment, so this module's FAMILY-based participant grounding is unavailable for it. The length
      is consistent with the paper's "short protein of 10 kDa", confirming the accession.
    url: https://www.uniprot.org/uniprotkb/C5KGI6
  - source_id: UniProtKB:C5KWE2
    title: Monothiol glutaredoxin-4, putative, Pmar_PMAR014495 (Perkinsus marinus ATCC 50983 / TXsc)
    statement: >-
      ATPPM2 resolves to UniProtKB:C5KWE2, a 171-aa TrEMBL entry at protein existence "Predicted"
      whose only signature is the thioredoxin-like fold superfamily (InterPro:IPR036249) and whose
      UniProt name assigns it to the monothiol glutaredoxins. The length and fold match the paper's
      "19 kDa protein with a predicted thioredoxin domain", confirming the accession, but the
      independent glutaredoxin assignment supplies an alternative account of the co-migration that
      the study does not exclude. No PANTHER family or GO annotation is available for grounding.
    url: https://www.uniprot.org/uniprotkb/C5KWE2
knowledge_gaps:
  - gap_statement: >-
      Whether the LINC00528 locus (UniProtKB:Q8N1L1 / C22orf37) is protein-coding at all is
      unresolved, so the reported 170-aa microprotein "ATHENA" cannot yet be admitted as a
      Complex V assembly factor. The prior question is not what ATHENA does but whether the
      protein exists: UniProt annotates Q8N1L1 as reviewed with protein existence "Uncertain"
      and the caution "Product of a dubious CDS prediction. May be a non-coding RNA", and the
      entry carries no GO annotations at all (QuickGO, 0 hits).
    boundary: >-
      What is established is the composition of the module itself — the F1/Fo subunits and the
      two assembly factors ATPAF2 and TMEM70 — each grounded in a completed gene review and in
      PANTHER family membership. What is reported but unconfirmed is that ATHENA localises to the
      mitochondrial inner membrane, binds the ATP synthase beta and gamma subunits together with
      ANT and PiC, and promotes assembly of the ATP synthasome (PMID:42547818, a single 2026
      primary paper, abstract-only in this repository). No independent report of a translated
      product was found; the LINC00528 literature located here instead treats the locus as a
      non-coding RNA — e.g. as a cytoplasmic miR-143-3p sponge (PMID:31833800). That is a
      bounded search rather than an exhaustive one, and it was not re-run against PubMed at
      review time, so it should be re-checked before the gap is closed either way. Q8N1L1 has no PANTHER family, no
      InterPro signature, no annotated transmembrane segment and no annotated subcellular
      location, so the module's usual FAMILY-based participant grounding is unavailable.
      Accordingly ATHENA is recorded here as a candidate member and is deliberately NOT added as
      a part or annoton of the module.
    gap_kind:
      - BIOLOGY
      - CURATION
      - ONTOLOGY
    dark_aspect: WHOLLY_DARK
    status: OPEN
    significance: >-
      The "ATP synthase-associated macromolecular complex" (ATP synthasome: ATP synthase plus the
      adenine nucleotide translocase and the phosphate carrier) is itself a contested assembly,
      and its dedicated biogenesis factors are largely unknown. A genuine microprotein that
      chaperones synthasome assembly would be a substantive addition to the two assembly factors
      currently modelled (ATPAF2, TMEM70), and would also add a lncRNA-encoded microprotein to a
      complex whose subunit inventory is otherwise considered closed.
    resolution: >-
      Two independent things must be settled, and the second decides where ATHENA would belong.
      (1) Existence: independent confirmation that the ORF is translated in vivo — endogenous
      peptide detection by mass spectrometry, ribosome profiling, or antibody/epitope-tagged
      detection at the native locus — followed by an upgrade of the UniProt protein-existence
      level for Q8N1L1 away from "Uncertain" and removal of the dubious-CDS caution, then a human
      gene review under genes/human/LINC00528/. (2) Placement: evidence that separates an effect
      on F1Fo holoenzyme biogenesis — the role ATPAF2 and TMEM70 occupy in this node — from an
      effect on association of the holoenzyme with the ADP/ATP and phosphate carriers, which the
      single available report does not distinguish (see notes). If the holoenzyme-assembly branch
      holds, the admission path is an annoton in the complex_v_assembly node using selector_type
      GENE_PRODUCT (no PANTHER family exists), with GO:0033615 mitochondrial proton-transporting
      ATP synthase complex assembly and GO:0005743 mitochondrial inner membrane. If instead the
      effect proves to be on carrier association only, oxphos_adenine_nucleotide_phosphate_carriers.yaml
      is the better home and GO:0033615 is the wrong term: it covers assembly of the ATP synthase,
      not of the synthase-carrier supercomplex, and GO currently has no ATP synthasome assembly
      term to use in its place (searched via OLS). That missing term is the ONTOLOGY component of
      this gap; no replacement is proposed here, because the synthasome's status as a stable
      entity is itself contested and a term should not be proposed for an entity that may not
      survive. Until all of this is settled the module composition is unchanged.
    provenance:
      - reference_id: PMID:42547818
        full_text_unavailable: true
        reference_section_type: ABSTRACT
        supporting_text: >-
          Here, we identify a 170-amino acid protein encoded by the lncRNA LINC00528, which we
          term ATP synthase-associated macromolecular complex enhancing microprotein (ATHENA).
          Mechanistically, ATHENA localizes to the mitochondrial inner membrane, in which ATHENA
          directly interacts with ATP synthase subunits (β and γ) and solute carrier proteins,
          including ANT and PiC, thereby promoting the assembly of these macromolecular complexes,
          enhancing ATP synthesis, and preserving mitochondrial and cristae architecture.
      - reference_id: PMID:42547818
        full_text_unavailable: true
        reference_section_type: ABSTRACT
        supporting_text: >-
          the regulation and potential function of this complex remain poorly understood in cancer
      - reference_id: PMID:31833800
        reference_section_type: RESULTS
        supporting_text: >-
          Nuclear-cytoplasmic fractionation assay showed that LINC00528 was mainly localized in
          cytoplasm
      - reference_id: PMID:31833800
        reference_section_type: RESULTS
        supporting_text: >-
          These data suggested that LINC00528 might serve as a sponge of miR-143-3p in myocardial
          cells
  - gap_statement: >-
      What ATPPM1 (UniProtKB:C5KGI6 / Pmar_PMAR021141) and ATPPM2 (UniProtKB:C5KWE2 /
      Pmar_PMAR014495) do in the myzozoan F1Fo ATP synthase is unknown, and even the category is
      undetermined: the authors who named them state that they "represent either novel ATP synthase
      subunits, or late-stage assembly factors". The distinction is not cosmetic — a stoichiometric
      subunit belongs structurally in the Fo or F1 sector, whereas a late assembly factor acts
      transiently on biogenesis and is not part of the mature enzyme, the same line that separates
      ATPAF2/TMEM70 from the subunits in this module. Neither protein has an assigned molecular
      activity: ATPPM1 is a 10 kDa protein with no InterPro signature, and ATPPM2's only domain
      signal is a thioredoxin-like fold whose relevance (if any) to ATP synthesis is untested.
    boundary: >-
      What is established is the association, not the role. Perkinsus marinus has an enlarged ATP
      synthase: homology searches against the experimentally characterised ~32-subunit Toxoplasma
      complex found 27 putative Perkinsus homologs, 26 of which peak together at ~1.9 MDa in the
      mitochondrial complexome (the c subunit was not detected by mass spectrometry in either that
      or the earlier Toxoplasma study). Against that background ATPPM1 and ATPPM2 co-migrated with
      the ATP synthase subunits in every complexome dataset at abundances comparable to the other
      myzozoan-specific subunits, were both recovered by mass spectrometry from ATP synthase
      purified by size-exclusion chromatography alongside 22 expected subunits, and are both
      predicted mitochondrial by DeepLoc 2.1. Neither was findable by homology from Toxoplasma,
      which is why they are new. What is NOT established is anything downstream of that
      association: stoichiometry, structural position, molecular activity, and whether loss
      destabilises the holoenzyme. Grounding is correspondingly thin — both accessions are
      TrEMBL-only (unreviewed), protein existence "Predicted", with no GO annotations and no PANTHER
      family, so this module's usual FAMILY-based participant grounding is unavailable; ATPPM1 has
      no InterPro match at all and ATPPM2's sole InterPro entry is the homologous superfamily
      IPR036249 (Thioredoxin-like superfamily), with UniProt naming it "Monothiol glutaredoxin-4,
      putative" (UniProt REST query at review time; release not pinned). Accordingly ATPPM1 and
      ATPPM2 are recorded here as assessed candidates and are deliberately NOT added as parts or
      annotons. Separately resolved by the same paper, and therefore not part of this gap: a
      Perkinsus ATPTG1 homolog encoded on its own gene (unfused from CytC1) was detected in complex
      with ATP synthase, placing the ATPTG1 subunit role before the apicomplexan gene-fusion event.
    gap_kind:
      - BIOLOGY
    dark_aspect: MF_DARK
    status: OPEN
    significance: >-
      The subunit inventory of the mammalian F1Fo ATP synthase is treated as closed, yet the
      myzozoan enzyme is roughly twice the size, and the extra subunits are where its
      lineage-specific biology sits — in Toxoplasma the additional subunits mediate hexamerisation
      and shape cristae. ATPPM1 and ATPPM2 are the first ATP synthase-associated proteins in this
      lineage found by proteomics rather than by homology, i.e. a class of component that homology
      transfer from Toxoplasma or human structurally cannot reach, which bears on how far
      composition of this complex can be inferred computationally in understudied lineages at all.
      If ATPPM2's thioredoxin-like domain is functional, a redox element associated with the mature
      complex would be a genuinely new kind of ATP synthase component rather than another small
      structural subunit. Because the Perkinsus and apicomplexan enzymes are drug-relevant
      (components of these complexes are required for parasite growth), a confirmed
      parasite-restricted subunit or assembly factor is also a candidate target.
    resolution: >-
      Wet-lab work in Perkinsus (or in Toxoplasma, if homologs are found there on re-examination,
      which the authors note is how SDHC was recovered): epitope tagging to confirm mitochondrial
      localisation of the endogenous proteins, and conditional knockdown/knockout read out by
      blue-native PAGE and complexome profiling. The readouts separate the two possibilities
      directly — loss of a late assembly factor leaves a reduced or destabilised holoenzyme and a
      stalled intermediate, whereas loss of a subunit yields an otherwise assembled complex of
      correspondingly lower mass. Structural placement in a cryo-EM map of the purified Perkinsus
      ATP synthase would settle stoichiometry and position, and an in vitro thiol-oxidoreductase or
      glutaredoxin assay on recombinant ATPPM2 would test whether its thioredoxin-like fold is
      catalytic. Only then is there anything for this module to take: if either protein proves a
      subunit it belongs in an Fo/F1-equivalent node, and if it proves a biogenesis factor it
      belongs with ATPAF2/TMEM70 under GO:0033615 — but in a myzozoan node or module, since every
      part here is grounded on a reviewed human accession with a completed gene review, and these
      proteins have no human counterpart.
    provenance:
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          We noted that in all complexome datasets 2 other proteins (Pmar_PMAR021141 and
          Pmar_PMAR014495) consistently co-migrated with the other subunits of ATP synthase, with
          similar abundance to other myzozoan-specific ATP synthase subunits
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          Similar to the missing subunits from Toxoplasma ATPTG10,11 and 16, Pmar_PMAR021141 is a
          short protein of 10 kDa. Pmar_PMAR014495 is a 19 kDa protein with a predicted thioredoxin
          domain.
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          In addition to detection of 22 expected ATP synthase subunits, both of these new proteins
          were also present
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          These data suggest that the association with ATP synthase is genuine, and they represent
          either novel ATP synthase subunits, or late-stage assembly factors, and we putatively
          assign them the names ATPPM1–2, although further experimental work would be required to
          confirm this.
      - reference_id: PMID:42809533
        reference_section_type: DISCUSSION
        supporting_text: >-
          two putative new ATP synthase subunits, ATPPM1 and ATPPM2, not detectable by homology
          searches as they were absent from the well characterised Toxoplasma complex
      - reference_id: PMID:42809533
        reference_section_type: RESULTS
        supporting_text: >-
          Our detection of ATPTG1 in complex with ATP synthase in Perkinsus strongly suggests that a
          role for this protein as an ATP synthase subunit existed prior to the fusion event with
          CytC1 in myzozoan evolution.
