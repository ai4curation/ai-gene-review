id: MODULE:bacterial_purine_base_oxidation_to_urate
title: Bacterial purine base oxidation to urate
description: >-
  A reusable bacterial pathway realization in which xanthine is supplied by
  either zinc-dependent guanine deamination or NAD+-dependent hypoxanthine
  oxidation and is then oxidized to urate. In the two-subunit realization,
  the same XdhAB molybdo-flavo-iron-sulfur complex performs both
  NAD+-dependent oxidation reactions.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006145
    title: purine nucleobase catabolic process
    statement: >-
      GO:0006145 captures the purine-base degradation boundary represented by
      the convergent guanine and hypoxanthine routes.
  - source_id: RHEA:14665
    title: guanine deaminase reaction
    statement: >-
      Rhea 14665 defines hydrolytic conversion of guanine to xanthine and
      ammonium.
  - source_id: RHEA:24670
    title: NAD+-dependent hypoxanthine dehydrogenase reaction
    statement: >-
      Rhea 24670 defines oxidation of hypoxanthine to xanthine with NAD+ as
      electron acceptor.
  - source_id: RHEA:16669
    title: NAD+-dependent xanthine dehydrogenase reaction
    statement: >-
      Rhea 16669 defines oxidation of xanthine to urate with NAD+ as electron
      acceptor.
  - source_id: PMID:11341925
    title: >-
      Xanthine dehydrogenase from Pseudomonas putida 86: specificity,
      oxidation-reduction potentials of its redox-active centers, and first
      EPR characterization.
    statement: >-
      A characterized two-subunit Pseudomonas XDH oxidizes both hypoxanthine
      and xanthine, prefers NAD+, and contains molybdenum, FAD, and two
      iron-sulfur centers.
  - source_id: PMID:26355499
    title: >-
      Identification of a chemoreceptor that specifically mediates chemotaxis
      toward metabolizable purine derivatives.
    statement: >-
      Pseudomonas putida KT2440 uses guanine, hypoxanthine, xanthine, and uric
      acid as sole nitrogen sources, providing direct organism-level evidence
      that purine-base catabolic flux operates in this genome.
  - source_id: file:modules/bacterial_purine_base_oxidation_to_urate-deep-research-openscientist.md
    title: OpenScientist generic-module research report
    statement: >-
      The report independently supports the convergent two-part boundary and
      emphasizes that one XdhAB performing both oxidations is specific to this
      realization rather than a universal bacterial rule.
  - source_id: file:PSEPK/guaD/guaD-ai-review.yaml
    title: PSEPK guaD gene review
    statement: Q88F18 is the guanine-deaminase candidate for the guanine entry route.
  - source_id: file:PSEPK/xdhA/xdhA-ai-review.yaml
    title: PSEPK xdhA gene review
    statement: Q88F21 is the FAD- and iron-sulfur-containing XdhAB subunit.
  - source_id: file:PSEPK/xdhB/xdhB-ai-review.yaml
    title: PSEPK xdhB gene review
    statement: Q88F20 is the molybdenum-cofactor-binding XdhAB subunit.
notes: >-
  This is a species-neutral module for the bacterial two-subunit XdhAB
  realization, not a Pseudomonas-specific pathway. Pseudomonas putida KT2440,
  P. putida 86, and Rhodobacter capsulatus are included only as genome or
  biochemical exemplars. Fused eukaryotic XDH proteins, bacterial
  three-subunit systems, and Moco-independent hypoxanthine routes are outside
  this realization's participant architecture. Purine nucleotide hydrolysis
  and salvage are upstream alternatives, while urate oxidation and downstream
  allantoin degradation are separate modules. Xdh cofactor maturation is
  required for activity but belongs to molybdenum-cofactor biogenesis rather
  than this catalytic reaction-chain boundary. No Xdh-specific PAINT node is
  asserted: the current PTHR45444 exact xanthine-dehydrogenase nodes are
  restricted to eukaryotic branches, while PTHR11908 provides only broad
  oxidoreductase ancestry for the molybdopterin-binding family.
