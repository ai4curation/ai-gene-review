knowledge_gaps:
  - gap_statement: >-
      Direct biochemical reconstitution of the PP_4278/PP_4279 XdhAB complex
      from Pseudomonas putida KT2440 with both hypoxanthine and xanthine
      substrates has not been identified.
    boundary: >-
      Current KT2440 assignment is supported by exact subunit architecture,
      EC/domain annotation, conserved locus context, and homologous bacterial
      XDH biochemistry rather than a strain-specific enzyme assay.
    gap_kind:
      - BIOLOGY
      - CURATION
    status: OPEN
    significance: >-
      Distinguishes a strong family- and pathway-level assignment from direct
      strain-specific proof of both reactions.
    resolution: >-
      Purify or reconstitute KT2440 XdhA and XdhB and measure NAD+-dependent
      oxidation of hypoxanthine and xanthine separately.
  - gap_statement: >-
      Dedicated XdhC-mediated molybdenum-cofactor maturation is established in
      a homologous two-subunit XDH, but the requirement and exact role of the
      corresponding maturation factor have not been demonstrated for each
      representative bacterial XdhAB system.
    boundary: >-
      Cofactor biogenesis and insertion are outside this reaction-chain module,
      but an unvalidated maturation assignment can prevent structural-gene
      presence from satisfying the pathway in vivo.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Separates structural-gene presence from formation of an active
      molybdenum center.
    resolution: >-
      Test each candidate Xdh maturation factor by deletion and complementation,
      followed by XdhAB cofactor analysis and activity assays.
