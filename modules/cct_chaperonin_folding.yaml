id: MODULE:cct_chaperonin_folding
title: CCT/TRiC chaperonin-mediated folding
description: >-
  The chaperonin containing TCP-1 (CCT, also called TRiC) is the group II
  chaperonin of the eukaryotic cytosol. It is a double ring of two
  hetero-octameric rings, each made of one copy of eight paralogous subunits
  (CCT1/alpha to CCT8/theta), and this subunit set is conserved from yeast to
  nematodes and mammals. Each subunit has an equatorial ATP-binding domain, an
  intermediate hinge and an apical client-binding domain with a built-in lid,
  so CCT closes its folding chamber without a separate co-chaperonin. Cycles of
  ATP binding and hydrolysis drive lid closure and folding of clients held in
  the chamber. Nucleotide use is asymmetric: only four subunits (CCT1, CCT2,
  CCT4 and CCT5) bind ATP at physiological concentrations, and ATP binding by
  the other four is dispensable in vivo. The main obligate clients are actin
  and tubulin. Nascent actin and tubulin chains are captured by prefoldin
  (GimC in budding yeast), a jellyfish-shaped heterohexamer of two alpha-class
  and four beta-class subunits that binds non-native chains without ATP,
  docks on CCT and hands them over, raising the rate and yield of folding. In
  yeast, loss of prefoldin or CCT impairs actin- and tubulin-based
  cytoskeletal functions. In C. elegans, CCT depletion disrupts actin and
  microtubule organization and causes intestinal microvillus loss, prefoldin
  loss lowers alpha-tubulin levels and slows microtubule growth, and raising
  the CCT8 subunit level in somatic tissues extends lifespan in a
  CCT-dependent way.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:23011926
    title: Human TRiC complex purified from HeLa cells contains all eight CCT subunits and is active in vitro.
    statement: >-
      Human TRiC contains all eight CCT subunits in double-barrel rings, as in
      bovine and yeast TRiC, and is active in refolding assays.
    supporting_text: >-
      This purified human TRiC contained all eight CCT subunits organized into
      double-barrel rings, consistent with what has been found for bovine and
      yeast TRiC.
  - source_id: PMID:25143409
    title: Caenorhabditis elegans chaperonin CCT/TRiC is required for actin and tubulin biogenesis and microvillus formation in intestinal epithelial cells.
    statement: >-
      CCT is a hetero-oligomeric double ring of eight subunits per ring, and
      the C. elegans genome has eight cct genes.
    supporting_text: >-
      The C. elegans genome contains eight genes encoding the individual CCT
      subunits (cct-1 to cct-8)
  - source_id: PMID:25143409
    title: Caenorhabditis elegans chaperonin CCT/TRiC is required for actin and tubulin biogenesis and microvillus formation in intestinal epithelial cells.
    statement: >-
      In vivo, CCT depletion causes actin aggregation, loss of microvilli and
      reduced tubulin, while the intermediate filament IFB-2 is unaffected,
      indicating client selectivity.
    supporting_text: >-
      CCT depletion causes a reduction in the tubulin levels and
      disorganization of the microtubule network.
  - source_id: PMID:9630229
    title: Prefoldin, a chaperone that delivers unfolded proteins to cytosolic chaperonin.
    statement: >-
      Prefoldin is a heterohexameric chaperone that binds CCT and transfers
      unfolded targets to it; yeast prefoldin deletion phenocopies chaperonin
      mutation.
    supporting_text: >-
      Prefoldin binds specifically to cytosolic chaperonin (c-cpn) and
      transfers target proteins to it. Deletion of the gene encoding a
      prefoldin subunit in S. cerevisiae results in a phenotype similar to
      those found when c-cpn is mutated, namely impaired functions of the
      actin and tubulin-based cytoskeleton.
  - source_id: PMID:18062952
    title: Efficient chaperone-mediated tubulin biogenesis is essential for cell division and cell migration in C. elegans.
    statement: >-
      Prefoldin and CCT act together in tubulin biogenesis in C. elegans, and
      CCT loss is more severe, consistent with CCT having more clients.
    supporting_text: >-
      Furthermore, reducing CCT function causes more severe phenotypes
      (compared with prefoldin knockdown) in the embryo and developing gonad,
      consistent with a broader role for CCT in protein folding.
  - source_id: file:modules/bacterial_groel_groes_chaperonin_folding.yaml
    title: Bacterial GroEL/GroES chaperonin folding module
    statement: >-
      Group I chaperonin comparator. GroEL is a homo-oligomeric ring that
      needs the GroES lid. CCT is a hetero-oligomeric group II chaperonin with
      a built-in apical lid.
  - source_id: file:genes/human/TCP1/TCP1-ai-review.yaml
    title: human TCP1 gene review
    statement: >-
      Core function: TCP1 (CCT1, alpha) binds ATP and contributes to the
      ATP-dependent protein folding chaperone activity of the assembled CCT
      complex.
  - source_id: file:genes/human/PFDN2/PFDN2-ai-review.yaml
    title: human PFDN2 gene review
    statement: >-
      Core function: PFDN2 is a beta-class prefoldin subunit with protein
      folding chaperone activity (GO:0044183) in the prefoldin complex.
  - source_id: file:genes/yeast/TCP1/TCP1-ai-review.yaml
    title: yeast TCP1 gene review
    statement: >-
      Core function: yeast Tcp1 (CCT1, alpha) contributes to the
      ATP-dependent protein folding chaperone activity of CCT.
  - source_id: file:genes/worm/cct-1/cct-1-ai-review.yaml
    title: worm cct-1 gene review
    statement: >-
      Core function: CCT-1 (alpha) binds ATP and contributes to the
      ATP-dependent protein folding chaperone activity of the assembled CCT
      complex.
  - source_id: file:genes/worm/cct-8/cct-8-ai-review.yaml
    title: worm cct-8 gene review
    statement: >-
      Core function: CCT-8 (theta) contributes to complex-level folding
      activity. It is a low-ATPase subunit whose distinctive role is client
      binding and allosteric coordination.
notes: >-
  Boundary. This module covers cytosolic group II chaperonin folding in
  eukaryotes: client delivery by prefoldin, then ATP-driven folding in the CCT
  chamber. The context taxon is Eukaryota because the eight-subunit CCT and
  the six-subunit prefoldin are present, as orthologous subunit sets, in
  fungi, animals and other eukaryotes, and the representative members span
  budding yeast, C. elegans and human. Archaea have prefoldin and group II
  chaperonins (thermosomes) of simpler composition; they are outside this
  module. No variant_sets are used: subunit composition, ring order and the
  prefoldin hand-off are conserved across the represented lineages, and no
  lineage replaces a role with an unrelated protein.

  Activity placement. Folding activity belongs to the assembled hetero-oligomer,
  so the complex-level MF GO:0140662 (ATP-dependent protein folding chaperone)
  is placed on the CCT complex annoton, and individual subunits are active
  units. Each subunit role is an ortholog group (FAMILY selector) represented
  by the worm, yeast and, where reviewed, human protein. All eight CCT
  subunits fall in the single PANTHER family PTHR11353 (CHAPERONIN), and its
  subunit subfamilies are split by lineage, so no PANTHER id is asserted for
  the individual CCT subunit groups. The prefoldin subunit groups each have
  their own PANTHER family, and those ids match the UniProt cross-references
  of every representative. Following PMID:23041314, ATP binding (GO:0005524)
  is given only on the four high-affinity subunits CCT1, CCT2, CCT4 and CCT5;
  CCT3, CCT6, CCT7 and CCT8 carry no subunit-level MF beyond contributing to
  GO:0140662. Gene reviews are not fully consistent on this point. The worm
  cct-8 review accepts ATP binding as a core function of CCT-8, although CCT8
  is a low-affinity subunit. The yeast TCP1, CCT3, CCT5, CCT6 and CCT7 reviews
  give ATP hydrolysis activity (GO:0016887) as the subunit MF, the yeast CCT2
  and CCT4 reviews give ATP binding, and the yeast CCT8 review gives only
  GO:0140662. The module follows the subunit ATP-affinity data and records
  these discrepancies here without changing the reviews.

  Prefoldin is an optional part. It is needed for efficient actin and tubulin
  biogenesis but not for all CCT clients, and CCT can fold clients that reach
  it without prefoldin. Its complex-level activity is given as the
  ATP-independent GO:0044183 protein folding chaperone, since GO:0051082
  unfolded protein binding is obsolete. The C. elegans PFD-4 subunit is
  divergent and its loss reportedly gives no visible phenotype, so its
  contribution to worm prefoldin is uncertain; human PFDN4 is listed as the
  better-supported representative of that role. PFD-6/PFDN6 and other
  prefoldin subunits also occur in the prefoldin-like R2TP/PAQosome complex,
  which is outside this module. The C. elegans CCT-4 subunit has a reported
  nuclear role in assembling meiotic HORMAD proteins into chromosome axes
  (PMID:41136395); that nuclear function is also outside this module.

  Post-chaperonin tubulin folding cofactors (GO:0007023 post-chaperonin
  tubulin folding pathway), the HSP70/HSP90 systems and the mitochondrial
  group I chaperonin HSP60 are outside the boundary. HSP-60 co-purified with
  worm CCT in one study (PMID:9434769) but is a separate, mitochondrial
  machine. Clients (actins, alpha- and beta-tubulins and WD40 proteins) are
  substrates, not members. No production GO-CAM in gocams/index.tsv contains
  these proteins.

  Relation to MODULE:bacterial_groel_groes_chaperonin_folding. Both are
  ATP-driven cage chaperonins. GroEL is a homo-heptameric double ring capped
  by the separate GroES lid. CCT is a hetero-octameric double ring with a
  built-in lid and subunit-specific client-binding surfaces. The two are kept
  as separate modules, not variants of one, because the subunit composition,
  lid mechanism and client sets differ.
module:
  id: cct_chaperonin_folding
  label: CCT/TRiC chaperonin folding
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Prefoldin-assisted delivery and ATP-dependent folding of cytosolic clients,
    principally actin and tubulin, by the eight-subunit eukaryotic CCT/TRiC
    chaperonin.
  concepts:
    - preferred_term: protein folding
      term:
        id: GO:0006457
        label: protein folding
      description: >-
        Chaperone-assisted folding of newly synthesized cytosolic
        polypeptides, especially actin and tubulin.
  context:
    taxa:
      - preferred_term: Eukaryota
        term:
          id: NCBITaxon:2759
          label: Eukaryota
        description: >-
          CCT1-8 and prefoldin subunit orthologs are present across eukaryotes;
          representatives are from Saccharomyces cerevisiae, Caenorhabditis
          elegans and Homo sapiens.
    cellular_components:
      - preferred_term: cytoplasm
        term:
          id: GO:0005737
          label: cytoplasm
  parts:
    - order: 1
      role: capture and delivery of nascent actin and tubulin to CCT
      optional: true
      node:
        id: prefoldin_delivery
        label: Prefoldin client capture and delivery
        module_type: MOLECULAR_FUNCTION
        description: >-
          Prefoldin (GimC) is a heterohexamer of two alpha-class (PFDN3/VBP1,
          PFDN5) and four beta-class (PFDN1, PFDN2, PFDN4, PFDN6) subunits. Its
          coiled-coil tentacles bind non-native actin and tubulin chains
          without ATP, and the complex docks on CCT through a conserved
          electrostatic interface and passes the chains to it. In yeast,
          prefoldin accelerates actin folding on CCT and prevents premature
          release of non-native protein. In C. elegans, prefoldin RNAi lowers
          alpha-tubulin and slows microtubule growth, and pfd-1 mutants show
          distal tip cell migration defects that CCT or tubulin RNAi phenocopy.
