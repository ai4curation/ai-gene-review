knowledge_gaps:
  - gap_statement: >-
      Beyond actin and tubulin, the obligate in vivo clients of CCT in
      metazoan tissues are poorly defined, as is the basis for client
      selectivity (for example, why the C. elegans intermediate filament IFB-2
      is unaffected by CCT depletion).
    boundary: >-
      In C. elegans, in vivo client evidence comes mostly from cct-5 RNAi
      phenotypes in the intestine and from tubulin and actin readouts. No
      client-capture proteomics has been done for worm CCT.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines which developmental and proteostasis phenotypes of cct
      knockdown reflect actin and tubulin folding and which reflect other
      clients.
    resolution: >-
      Tagged-CCT affinity capture with quantitative proteomics in worm
      tissues, and folding-state reporters for candidate clients after
      tissue-specific cct depletion.
    provenance:
      - reference_id: PMID:25143409
        supporting_text: >-
          suggesting substrate specificity of CCT in the folding of filamentous
          cytoskeletons in vivo
  - gap_statement: >-
      Which CCT clients, or which aspect of proteostasis, mediate the lifespan
      extension caused by raising CCT assembly in C. elegans somatic tissues
      is unknown.
    boundary: >-
      Somatic cct-8 overexpression increases assembled double-ring CCT on
      native gels and extends lifespan, and the extension is partly reduced
      by cct-6 knockdown. The downstream folding events that link more CCT
      to longevity have not been identified.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Distinguishes a general boost in folding capacity from improved folding
      of specific clients (for example cytoskeletal proteins) as the basis of
      chaperonin-dependent longevity.
    resolution: >-
      Compare client folding and aggregation profiles in aged cct-8(OE) and
      control animals, and test whether tissue-restricted overexpression or
      client-specific suppression alters the lifespan effect.
    provenance:
      - reference_id: PMID:27892468
        supporting_text: >-
          By native gel electrophoresis analysis, we confirmed that OE of cct-8
          in somatic tissues increases TRiC/CCT assembly in the form of two
          stacked rings
  - gap_statement: >-
      Whether the divergent C. elegans PFD-4 subunit contributes to prefoldin
      chaperone function, or has been functionally replaced or repurposed, is
      unknown.
    boundary: >-
      PFD-4 is assigned to prefoldin by homology and complex annotation; other
      worm prefoldin subunits are needed for tubulin biogenesis, but pfd-4
      loss reportedly gives no visible phenotype.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether nematode prefoldin is a canonical heterohexamer or
      works with a reduced or substituted beta-subunit set.
    resolution: >-
      Test PFD-4 incorporation into worm prefoldin by co-purification, and
      measure alpha-tubulin levels and microtubule growth in pfd-4 null
      embryos, alone and combined with other prefoldin knockdowns.
    provenance:
      - reference_id: file:genes/worm/pfd-4/pfd-4-ai-review.yaml
        supporting_text: >-
