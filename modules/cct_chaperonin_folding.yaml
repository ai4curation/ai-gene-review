                  phenotype.
    - order: 2
      role: ATP-dependent client folding in the CCT chamber
      node:
        id: cct_folding_chamber
        label: CCT/TRiC ATP-dependent folding chamber
        module_type: MOLECULAR_FUNCTION
        description: >-
          The eight CCT subunits occupy fixed positions in each ring. Their
          apical domains provide client-binding surfaces and the built-in lid.
          ATP binding and hydrolysis in the equatorial domains close the lid
          and fold the enclosed client. The four high-ATP-affinity subunits
          (CCT1, CCT2, CCT4, CCT5) form one contiguous hemisphere of the ring
          and the four low-affinity subunits (CCT3, CCT6, CCT7, CCT8) the
          other, giving an asymmetric power stroke.
