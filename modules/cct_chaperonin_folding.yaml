                title: "Compartmentation of protein folding in vivo: sequestration of non-native polypeptide by the chaperonin-GimC system."
                statement: >-
                  In yeast, GimC (prefoldin) interacts with folding
                  intermediates and with TRiC, accelerating actin folding.
                supporting_text: >-
                  By interacting with folding intermediates and with TRiC,
