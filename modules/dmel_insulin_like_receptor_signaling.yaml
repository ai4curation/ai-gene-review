id: MODULE:dmel_insulin_like_receptor_signaling
title: Insulin-like receptor signaling pathway in Drosophila melanogaster
description: >-
  Drosophila insulin-like peptides (Ilps), several of them secreted by the insulin-producing
  cells of the brain, bind the single insulin-like receptor InR, a receptor tyrosine kinase.
  Activated InR phosphorylates the adaptor Chico (IRS) and acts with the adaptor Lnk (SH2B),
  recruiting the class IA phosphatidylinositol 3-kinase made of the catalytic subunit Pi3K92E
  (Dp110) and the regulatory subunit Pi3K21B (p60). The resulting PIP3 recruits Pdk1 and Akt;
  Akt phosphorylates and excludes the transcription factor FOXO from the nucleus and promotes
  TORC1 activity through Rheb, leading to S6 kinase activation and inhibition of the translational
  repressor Thor (4E-BP). The pathway controls cell and organismal growth, carbohydrate and
  lipid metabolism, reproduction and lifespan.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000903
  title: 'FlyBase gene group PI3K-IA: Class ia phosphatidylinositol 3-kinase complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as class ia phosphatidylinositol
    3-kinase complex (PI3K-IA); this module models that group.
- source_id: FB:FBgg0000910
  title: 'FlyBase gene group INS: Insulin-like receptor signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 78 D. melanogaster genes as insulin-like receptor signaling
    pathway (INS); this module models that group.
- source_id: GO:0008286
  title: insulin receptor signaling pathway
  statement: >-
    GO term grounding the module as insulin receptor signaling pathway.
notes: >-
  Boundary. Core components (FlyBase INS-C) and the class IA PI3K complex (PI3K-IA). Ilp1,
  Ilp4, Ilp7 and Ilp8 are not FlyBase core members and are not included. The TORC1 and MAPK
  branches are shared with TOR and Ras signaling modules. Pten, Tsc1/gigas, ImpL2 and other
  FlyBase regulators are not parts. The other-effectors part collects FlyBase core members
  whose position in the pathway is tissue-specific; no activities are asserted for them. FlyBase
  groups realized by this module: PI3K-IA (FBgg0000903), INS (FBgg0000910). Subgroups folded
  into it: INS-C. FlyBase also curates regulator sets for this pathway, which are context
  and not modelled as parts: INS-P (positive regulators of insulin-like receptor signaling
  pathway, 22 genes); INS-N (negative regulators of insulin-like receptor signaling pathway,
  29 genes). Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_insulin_like_receptor_signaling.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
