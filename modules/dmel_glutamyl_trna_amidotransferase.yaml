id: MODULE:dmel_glutamyl_trna_amidotransferase
title: Mitochondrial glutamyl-tRNA(Gln) amidotransferase (GatCAB) in Drosophila melanogaster
description: >-
  In mitochondria of animals there is no glutaminyl-tRNA synthetase. Instead, mitochondrial
  tRNA-Gln is first mischarged with glutamate by the non-discriminating mitochondrial glutamyl-tRNA
  synthetase, and the heterotrimeric GatCAB amidotransferase converts the bound glutamate
  to glutamine. GatA is a glutaminase that releases ammonia from glutamine, GatB phosphorylates
  the glutamate and transfers the ammonia to form Gln-tRNA(Gln), and GatC is a small subunit
  that stabilizes the complex.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002000
  title: 'FlyBase gene group GATCAB: Glutamyl-trna(gln) amidotransferase complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as glutamyl-trna(gln) amidotransferase
    complex (GATCAB); this module models that group.
- source_id: GO:0030956
  title: glutamyl-tRNA(Gln) amidotransferase complex
  statement: >-
    GO term grounding the module as glutamyl-tRNA(Gln) amidotransferase complex.
notes: >-
  Modelled one part per subunit. The glutaminyl-tRNA synthase (glutamine-hydrolyzing) activity
  belongs to the complex as a whole and is not assigned to individual subunits here. GatB
  has no UniProt mapping in the FlyBase-derived table and is grounded to its FlyBase gene
  id. The mitochondrial glutamyl-tRNA synthetase that provides the substrate is outside this
  module. FlyBase groups realized by this module: GATCAB (FBgg0002000). Participants were
  generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_glutamyl_trna_amidotransferase.yaml; none of the member genes has
  a gene review yet unless noted.
