id: MODULE:bacterial_base_excision_repair
title: Bacterial base-excision repair system
description: >-
  A reusable bacterial DNA-damage response module in which lesion-specific DNA
  glycosylases remove small damaged bases, AP-site processing enzymes create a
  repairable 3-prime hydroxyl, DNA polymerase I restores the missing nucleotide,
  and an NAD-dependent DNA ligase seals the nick. The bacterial MutT-MutY-MutM
  8-oxoguanine defense is represented across nucleotide-pool sanitation and
  lesion excision. Nucleotide excision repair, mismatch repair, double-strand
  break repair, and damage signaling are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006284
    title: base-excision repair
    statement: Defines the lesion-excision and repair-synthesis process modeled here.
  - source_id: RHEA:31575
    title: 8-oxo-dGTP diphosphatase reaction
    statement: Defines MutT-dependent sanitation of the oxidized deoxynucleotide pool.
  - source_id: RHEA:66592
    title: class I AP-lyase reaction
    statement: Defines beta-elimination cleavage performed by bifunctional Nth- and MutM-family glycosylases.
  - source_id: RHEA:22508
    title: DNA-directed DNA polymerase reaction
    statement: Defines nucleotide addition during repair-gap filling.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__base-excision-repair__ppu03410-deep-research-openscientist.md
    title: OpenScientist PSEPK base-excision repair synthesis
    statement: >-
      Species-aware retrieval identifies a complete KT2440 BER relay, an Xth-only
      AP-endonuclease architecture, a missing MutT candidate, and a spurious Crc hit.
notes: >-
  The module is species-neutral. Pseudomonas putida KT2440 supplies concrete
  representatives for every role. Organisms vary in their glycosylase repertoire
  and may use Nfo/Endonuclease IV instead of or in addition to Xth-family AP
  endonucleases. MutT is an upstream preventive branch rather than a DNA-bound
  intermediate-processing step and therefore has no PRECEDES connection.
