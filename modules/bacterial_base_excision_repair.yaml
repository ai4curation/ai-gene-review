  connections:
    - source: ung_excision
      target: xth_processing
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: Ung creates an AP site that is incised by a class II AP endonuclease.
    - source: mutm_excision
      target: xth_processing
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: Bifunctional MutM already nicks DNA, but downstream end processing can still be required before synthesis.
    - source: muty_excision
      target: xth_processing
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: MutY creates an AP site after adenine excision.
    - source: nth_excision
      target: xth_processing
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: Bifunctional Nth already nicks DNA, but downstream end processing can still be required before synthesis.
    - source: tag_excision
      target: xth_processing
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: Tag creates an AP site after 3-methyladenine excision.
    - source: xth_processing
      target: pola_synthesis
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: AP-site incision and end processing create a 3-prime hydroxyl for repair synthesis.
    - source: pola_synthesis
      target: liga_sealing
      connection_type: PRECEDES
      chaining_status: NOT_APPLICABLE
      chaining_note: DNA polymerase I gap filling leaves the nick sealed by LigA.
  knowledge_gaps:
    - gap_statement: Bacterial taxa vary in the AP-endonuclease family that implements the incision step.
      boundary: >-
        Treat Xth and Nfo as alternative family implementations; do not infer an
        Nfo requirement when Xth-family activity is present.
      gap_kind:
        - BIOLOGY
    - gap_statement: Substrate breadth and redundancy among lesion-specific glycosylases are organism-dependent.
      boundary: >-
        Require coverage of relevant lesion classes, but do not require every
        Tag, AlkA, Mpg, Nei, or Nth paralog in every bacterial genome.
      gap_kind:
        - BIOLOGY
