              function is asserted: GOA offers only protein binding and an IBA serine-type
              endopeptidase activity that is implausible for a pseudoprotease, and GO has no
              term for this membrane-cofactor role.
            evidence:
              - source_id: PMID:9689066
                statement: >-
                  The inhibitory reaction proceeds through a factor Xa-protein Z-ZPI complex
                  at the phospholipid surface.
                supporting_text: The inhibitory process appears to involve the formation of a factor Xa-PZ-ZPI complex at the phospholipid surface.
