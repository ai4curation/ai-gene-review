                  gamma chains, so all three genes contribute to the polymer.
                supporting_text: Fibrinogen molecules are comprised of two sets of disulfide-bridged Aalpha-, Bbeta-, and gamma-chains.
          - id: fgg_fibrin_polymer
            label: Fibrinogen gamma chain in fibrin network assembly and cross-linking
