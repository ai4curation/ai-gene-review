knowledge_gaps:
  - gap_statement: >-
      How much of physiological factor XI activation is done by thrombin, by factor XIIa
      from the contact system, and by factor XIa autoactivation is still unresolved, and the
      kinetic measurements that favour thrombin were made in purified systems with
      non-physiological surfaces such as dextran sulfate.
    boundary: >-
      It is firmly established that factor XIa activates factor IX, that factor XIIa and
      thrombin can both activate factor XI in vitro, and that factor XII deficiency causes
      no bleeding while factor XI deficiency causes a mild bleeding tendency.
    status: OPEN
    gap_kind:
      - BIOLOGY
    significance: >-
      This sets whether factor XI inhibitors act on an amplification loop that is normally
      thrombin-driven, which is the rationale for antithrombotics that aim to spare
      haemostasis.
    provenance:
      - reference_id: PMID:1652157
        supporting_text: Dextran sulfate enhances activation of factor XI by thrombin 2000-fold; part of this effect is due to autoactivation of factor XI by activated factor XI.
  - gap_statement: >-
      The quantitative contribution of the protein Z/ZPI system to restraining factor Xa in
      vivo, relative to antithrombin and TFPI, is unknown, as is the molecular basis of
      protein Z's cofactor action given that its protease-like domain is catalytically
      degenerate.
    boundary: >-
      It is established that ZPI inhibits factor Xa only in the presence of protein Z,
      calcium and a phospholipid surface, through a ternary factor Xa-PZ-ZPI complex, and
      that antithrombin and TFPI inhibit factor Xa independently of protein Z.
    status: OPEN
    gap_kind:
      - BIOLOGY
    significance: >-
      Without it the anticoagulant arm of this module cannot be weighted, and protein Z
      remains a member with no assignable molecular function.
    provenance:
      - reference_id: PMID:9689066
        supporting_text: Human protein Z (PZ) is a 62,000-Mr, vitamin K-dependent plasma protein whose structure is similar to coagulation factors VII, IX, X, protein C, and protein S, but whose function is not known.
