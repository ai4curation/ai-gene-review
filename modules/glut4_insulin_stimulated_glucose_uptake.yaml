                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RAB8A
                        term:
                          id: UniProtKB:P61006
                          label: Ras-related protein Rab-8A
                    function:
                      preferred_term: GTPase activity
                      term:
                        id: GO:0003924
                        label: GTPase activity
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: Insulin-activated GSV Rab in muscle, acting before RAB13.
                    evidence:
                      - source_id: PMID:21041651
                        statement: Insulin activates Rab8A (and Rab13) and both regulate GLUT4 translocation in muscle cells, downstream of AS160.
                        supporting_text: insulin promotes GTP loading of Rab13 and Rab8A but not Rab10 in rat L6 muscle cells, Rab8A activation preceding that of Rab13
                  - id: rab13_gtpase
                    label: RAB13 GTPase activity
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RAB13
                        term:
                          id: UniProtKB:P51153
                          label: Ras-related protein Rab-13
                    function:
                      preferred_term: GTPase activity
                      term:
                        id: GO:0003924
                        label: GTPase activity
                    locations:
                      - preferred_term: cell periphery
                        term:
                          id: GO:0071944
                          label: cell periphery
                    role_description: >-
                      Insulin-activated GSV Rab in muscle; its knockdown blocks the insulin-induced
                      increase of surface GLUT4, rescued by RAB13 but not RAB8A.
                    evidence:
                      - source_id: PMID:21041651
                        statement: Rab13 knockdown blocks the insulin-induced increase of surface GLUT4 in muscle cells.
                        supporting_text: siRNA-mediated Rab13 knockdown blocked the insulin-induced increase of GLUT4 at the muscle cell surface that was rescued by a Rab13 ortholog but not by Rab8A
    - order: 3
      role: GLUT4 storage-vesicle movement along microtubules and actin
      node:
        id: gsv_movement
        label: Motor-driven GLUT4 storage vesicle movement (KIF5B, MYO5A, MYO1C)
        module_type: REGULATORY_STEP
        description: >-
          GTP-loaded GSV Rabs recruit cytoskeletal motors that carry GLUT4 vesicles to the cell
          periphery: the kinesin-1 heavy chain KIF5B moves them along microtubules, while the
          myosins MYO5A (an AKT2 substrate) and MYO1C move them on cortical actin. All three act in
          a PI3K-pathway-coupled but, for KIF5B and MYO1C, wortmannin-insensitive manner.
        annotons:
          - id: kif5b_motor
            label: KIF5B microtubule motor activity
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: KIF5B
                term:
                  id: UniProtKB:P33176
                  label: Kinesin-1 heavy chain
            function:
              preferred_term: plus-end-directed microtubule motor activity
              term:
                id: GO:0008574
                label: plus-end-directed microtubule motor activity
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Conventional kinesin that moves GLUT4 vesicles along microtubules in response to
              insulin; dominant-negative kinesin light chain blocks GLUT4 translocation.
            evidence:
              - source_id: PMID:12743033
                statement: KIF5B mediates insulin-stimulated GLUT4 movements on microtubules and is required for GLUT4 translocation.
                supporting_text: This insulin signaling pathway regulating KIF5B function appears to be required for GLUT4 translocation to the plasma membrane.
          - id: myo5a_motor
            label: MYO5A actin motor activity
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MYO5A
                term:
                  id: UniProtKB:Q9Y4I1
                  label: Unconventional myosin-Va
            function:
              preferred_term: microfilament motor activity
              term:
                id: GO:0000146
                label: microfilament motor activity
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Actin-based motor that is phosphorylated by AKT2 on Ser1650; phosphorylation enhances
              its binding to actin and facilitates anterograde movement of GLUT4 vesicles to the
              surface.
            evidence:
              - source_id: PMID:17515613
                statement: MYO5A is an AKT2 substrate; phosphorylated MYO5A facilitates anterograde movement of GLUT4 vesicles along actin.
                supporting_text: phosphorylated myosin 5a facilitates anterograde movement of GLUT4 vesicles along actin to the cell surface
          - id: myo1c_motor
