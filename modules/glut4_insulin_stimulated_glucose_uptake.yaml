  connections:
    - source: insulin_akt2_activation
      target: rabgap_rab_activation
      connection_type: CAUSES
      description: Activated AKT2 phosphorylates and inactivates the TBC1D4/TBC1D1 Rab GAPs.
    - source: rabgap_rab_activation
      target: gsv_movement
      connection_type: POSITIVELY_REGULATES
      description: GTP-loaded GSV Rabs recruit the cytoskeletal motors that move GLUT4 vesicles.
    - source: insulin_akt2_activation
      target: cortical_actin_remodelling
      connection_type: POSITIVELY_REGULATES
      description: >-
        In muscle, insulin signalling (through RAC1, parallel to the AKT2-RabGAP axis) drives
        cortical actin remodelling needed for GLUT4 delivery.
    - source: gsv_movement
      target: snare_fusion
      connection_type: PROVIDES_INPUT_FOR
      description: Motors deliver GSVs to the cell periphery, where they dock and fuse.
    - source: cortical_actin_remodelling
      target: snare_fusion
      connection_type: POSITIVELY_REGULATES
      description: Remodelled cortical actin supports GSV delivery and fusion at the muscle cell surface.
    - source: snare_fusion
      target: glucose_transport
      connection_type: PROVIDES_INPUT_FOR
      description: SNARE fusion inserts GLUT4 into the plasma membrane, enabling glucose transport.
knowledge_gaps:
  - gap_statement: >-
      Whether the PI3K-independent CAP(SORBS1)-CBL-CRK-RAPGEF1(C3G)-RHOQ(TC10) arm is a genuine
      requirement for insulin-stimulated GLUT4 translocation is unresolved: it was reported as
      essential in 3T3-L1 adipocytes (Chiang et al. 2001), but a later RNAi study found depletion
      of CAP, CrkII and Cbl did not reduce insulin signalling to GLUT4 (Zhou et al. 2004). Whether
      the discrepancy reflects cell-line, redundancy or off-target effects, and whether TC10 acts
      in primary adipocytes and muscle in vivo, needs resolution by loss-of-function in
      physiological systems.
    gap_kind:
      - BIOLOGY
