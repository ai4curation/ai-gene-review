          complex remodels the cortical actin meshwork beneath the plasma membrane. A dynamic cycle
          of ARP2/3-driven branching and cofilin (CFL1)-mediated severing — cofilin being
          dephosphorylated by slingshot (SSH1) and rephosphorylated by LIMK1 — is required for GLUT4
          to reach the cell surface. Optional because this cortical-actin arm is prominent in muscle
          and dispensable for the core RabGAP-Rab-SNARE axis in adipocytes.
