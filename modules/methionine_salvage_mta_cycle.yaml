id: MODULE:methionine_salvage_mta_cycle
title: L-methionine salvage from 5'-methylthioadenosine (MTA cycle)
description: >-
  The methionine salvage pathway, or 5'-methylthioadenosine (MTA) cycle,
  regenerates L-methionine from MTA, the by-product of S-adenosylmethionine
  (SAM) use in polyamine synthesis (and, in plants, ethylene synthesis). The
  methylthio group of MTA and carbons 2-5 of its ribose become the methionine
  skeleton, so the cycle recovers reduced sulfur that is costly to assimilate,
  and it also clears MTA, which inhibits spermidine synthase. MTA is first
  converted to S-methyl-5-thio-alpha-D-ribose 1-phosphate (MTR-1-P), either
  directly by MTA phosphorylase (eukaryotes and many bacteria) or by MTA
  nucleosidase followed by ATP-dependent MTR kinase (many bacteria, plants).
  MTR-1-P isomerase converts MTR-1-P to the ribulose phosphate, which
  MTRu-1-P dehydratase converts to the 2,3-diketo phosphate. An enolase and a
  phosphatase then form the acireductone
  1,2-dihydroxy-5-(methylthio)pent-1-en-3-one. Fungi and animals do this
  with one bifunctional enolase-phosphatase (E1); Bacillus uses a RuBisCO-like
  enolase (MtnW) and a separate phosphatase (MtnX). An Fe(II)-dependent
  acireductone dioxygenase then oxidises the acireductone to
  4-methylthio-2-oxobutanoate (KMTB) and formate. A final transamination
  converts KMTB to methionine. This step is redundant and is carried out by
  broad-specificity aromatic and branched-chain amino acid transaminases, not
  a dedicated enzyme. The cycle needs dioxygen and is largely cytosolic.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY3O-64
    title: methionine salvage pathway
    statement: >-
      Source pathway for the S. cerevisiae realisation (six reactions). The
      SGD summary pathway lists MEU1, MRI1, MDE1, UTR4 and ADI1 for the five
      dedicated steps and ARO8, ARO9, BAT1 and BAT2 for the final
      transamination (EC 2.6.1.88). All nine assignments were retained. The
      YeastCyc reaction records cite literature for every step except the
      MTA phosphorylase reaction; MEU1 is supported here by PMID:16530730 and
      PMID:18625006.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-64
  - source_id: YeastPathways:PWY3O-351
    title: superpathway of methionine salvage pathway
    statement: >-
      Superpathway that adds methionine adenosyltransferase (SAM1/SAM2), SAM
      decarboxylase (SPE2), spermidine synthase (SPE3) and spermine synthase
      (SPE4) as the MTA-producing reactions. These belong to the
      methionine_cycle and polyamine_metabolism modules and are outside this
      module's boundary, which begins with MTA.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-351
  - source_id: GO:0071267
    title: L-methionine salvage
    statement: >-
      Module-level process. The route-specific term "L-methionine salvage
      from methylthioadenosine" (GO:0019509) is obsolete, and GO:0033353
      L-methionine cycle explicitly denotes the SAM/SAH/homocysteine cycle,
      not the MTA cycle.
  - source_id: PMID:18625006
    title: A complete inventory of all enzymes in the eukaryotic methionine salvage pathway.
    statement: >-
      Identifies and verifies all S. cerevisiae MTA-cycle enzymes (Meu1p,
      Mri1p, Mde1p, Utr4p, Adi1p) and shows that the final transamination is
      redundant and is mainly carried out by Aro8p, Aro9p, Bat1p and Bat2p.
    supporting_text: >-
      The genes encoding 5'-methylthioribose-1-phosphate isomerase and
      5'-methylthioribulose-1-phosphate dehydratase are herein named MRI1 and
      MDE1, respectively.
  - source_id: PMID:19946895
    title: >-
      Metabolic characteristics and importance of the universal methionine
      salvage pathway recycling methionine from 5'-methylthioadenosine.
    statement: Review of the pathway, its two entry routes and its lineage variation.
    supporting_text: >-
      MTA is first converted to 5'-methylthioribose-1-phosphate either by MTA
      phosphorylase or the combined action of MTA nucleosidase and
      5'-methylthioribose kinase.
  - source_id: PMID:16530730
    title: Methylthioadenosine and polyamine biosynthesis in a Saccharomyces cerevisiae meu1delta mutant.
    statement: >-
      meu1 deletion abolishes MTA phosphorylase-dependent MTA turnover; >98%
      of yeast MTA comes from polyamine synthesis.
    supporting_text: >-
      we showed that >98% of methylthioadenosine is produced as a byproduct of
      polyamine synthesis
  - source_id: PMID:15215245
    title: Crystal structure of yeast Ypr118w, a methylthioribose-1-phosphate isomerase related to regulatory eIF2B subunits.
    statement: Ypr118w (Mri1) is an eIF2B-related MTR-1-P isomerase required for growth on MTA.
    supporting_text: >-
      In vivo, Ypr118w protein is required for yeast cells to grow on
      methylthioadenosine in the absence of methionine
  - source_id: PMID:15938715
    title: >-
      Membrane-type 1 matrix metalloproteinase cytoplasmic tail binding
      protein-1 (MTCBP-1) acts as an eukaryotic aci-reductone dioxygenase
      (ARD) in the methionine salvage pathway.
    statement: Yeast YMR009w (ADI1) and human MTCBP-1 (ADI1) act as acireductone dioxygenase in the MTA cycle.
    supporting_text: >-
      Disruption of the yeast ARD homolog, YMR009w gene, abolished ability of
      the cells to grow in this culture condition.
  - source_id: PMID:15102328
    title: Bacterial variations on the methionine salvage pathway.
    statement: >-
      Describes the bacterial variants: nucleosidase plus kinase entry, and a
      split enolase (RuBisCO-like MtnW) plus phosphatase (MtnX) in B. subtilis
      versus a bifunctional enolase-phosphatase in other organisms.
    supporting_text: >-
      While in B. subtilis this is performed by two distinct polypeptides, in
      the other organisms analyzed here an enolase-phosphatase yields
      1,2-dihydroxy-3-keto-5-methylthiopentene.
module:
  id: methionine_salvage_mta_cycle
  label: Methionine salvage from 5'-methylthioadenosine (MTA cycle)
  module_type: METABOLIC_PATHWAY
  description: >-
    MTA -> MTR-1-P -> MTRu-1-P -> 2,3-diketo-5-methylthiopentyl 1-phosphate ->
    acireductone -> 4-methylthio-2-oxobutanoate -> L-methionine.
  concepts:
    - preferred_term: L-methionine salvage
      term:
        id: GO:0071267
        label: L-methionine salvage
      description: >-
        Regeneration of L-methionine from 5'-methylthioadenosine; the most
        specific current GO process term.
  context:
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          All dedicated enzymes are cytosolic in yeast (GO-CAMs); the
          transamination is also performed by mitochondrial Bat1 (see notes).
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-64
      title: "methionine salvage pathway - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:YeastPathways_PWY3O-351
      title: "superpathway of methionine salvage pathway - imported from: Saccharomyces Genome Database (S. cerevisiae)"
    - model: gomodel:69c59f8a00000584
      title: "L-methionine cycle (GO:0033353) (S. pombe; content is the MTA salvage cycle)"
  parts:
    - order: 1
      role: MTA to methylthioribose 1-phosphate (entry)
      node:
        id: mtr1p_formation_step
        label: 5'-methylthioadenosine to S-methyl-5-thio-alpha-D-ribose 1-phosphate
        module_type: REACTION
        variant_sets:
          - id: mta_entry_variants
            label: MTA entry routes
            axis: route variant
            selection: ONE_OR_MORE
            variants:
              - id: mta_phosphorylase_route
                label: Direct phosphorolysis (MTA phosphorylase)
                module_type: REACTION
                annotons:
                  - id: mta_phosphorylase_activity
                    label: S-methyl-5'-thioadenosine phosphorylase
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: S-methyl-5-thioadenosine phosphorylase activity
                        term:
                          id: GO:0017061
                          label: S-methyl-5-thioadenosine phosphorylase activity
                      family:
                        preferred_term: MTA phosphorylase (MtnP/MTAP)
                        term:
                          id: PANTHER:PTHR42679:SF2
                          label: S-METHYL-5'-THIOADENOSINE PHOSPHORYLASE
                        representative_members:
                          - preferred_term: MEU1 (S. cerevisiae)
                            term:
                              id: UniProtKB:Q07938
                              label: S-methyl-5'-thioadenosine phosphorylase
                            description: meu1 deletion causes MTA accumulation (PMID:16530730).
                          - preferred_term: mta1 (S. pombe, SPAC16C9.02c)
                            term:
                              id: UniProtKB:Q09816
                              label: S-methyl-5'-thioadenosine phosphorylase
                          - preferred_term: MTAP (human)
                            term:
                              id: UniProtKB:Q13126
                              label: S-methyl-5'-thioadenosine phosphorylase
                    function:
                      preferred_term: S-methyl-5-thioadenosine phosphorylase activity
                      term:
                        id: GO:0017061
                        label: S-methyl-5-thioadenosine phosphorylase activity
                      substrates:
                        - preferred_term: S-methyl-5'-thioadenosine
                        - preferred_term: phosphate
                      products:
                        - preferred_term: S-methyl-5-thio-alpha-D-ribose 1-phosphate
                        - preferred_term: adenine
                      evidence:
                        - source_id: EC:2.4.2.28
                          statement: S-methyl-5'-thioadenosine phosphorylase
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Single-step, energy-sparing entry; also releases adenine
                      for purine salvage.
                    gocam_associations:
                      - model: gomodel:YeastPathways_PWY3O-64
                        activity: gomodel:5-METHYLTHIOADENOSINE-PHOSPHORYLASE-RXN
