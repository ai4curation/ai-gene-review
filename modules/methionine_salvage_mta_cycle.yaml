              - id: mta_nucleosidase_kinase_route
                label: Hydrolysis then phosphorylation (MTA nucleosidase + MTR kinase)
                module_type: METABOLIC_PATHWAY
                description: >-
                  Two-step entry found in many bacteria (e.g. Bacillus
                  subtilis) and in plants: MTA is hydrolysed to
                  5-methylthioribose and adenine, and MTR is then
                  phosphorylated by an ATP-dependent kinase. Not used by yeasts.
                parts:
                  - order: 1
                    role: MTA hydrolysis
                    node:
                      id: mta_nucleosidase_step
                      label: 5'-methylthioadenosine to 5-methylthioribose
                      module_type: REACTION
