  notes: >-
    Boundary: begins with 5'-methylthioadenosine and ends with L-methionine.
    MTA-producing reactions (SAM decarboxylase SPE2, spermidine synthase SPE3,
    spermine synthase SPE4) and SAM synthesis (SAM1/SAM2), which the
    YeastPathways superpathway PWY3O-351 adds, belong to the
    polyamine_metabolism and methionine_cycle modules. MTA export and
    alternative MTA fates (e.g. 5-methylthioribose excretion in E. coli) are
    outside the module.

    YeastCyc corrections: none to gene assignments. The SGD summary lists all
    five dedicated enzymes (MEU1, MRI1, MDE1, UTR4, ADI1) plus ARO8, ARO9,
    BAT1, BAT2, consistent with Pirkov et al. 2008 (PMID:18625006), which
    also excluded the UTR4 homologue YNL010w. Compartment: the GO-CAMs place
    every step in the cytosol, but BAT1 is the mitochondrial branched-chain
    transaminase, so its contribution to KMTB transamination presumably
    occurs in the mitochondrial matrix (KMTB import not established); BAT2,
    ARO8 and ARO9 are cytosolic.

    GO-CAM disagreements: (1) the YeastPathways models type the R15-RXN
    transamination for all four transaminases with GO:0052656 L-isoleucine
    transaminase activity, which is a different reaction. The pathway step
    is GO:0010326 L-methionine:oxo-acid transaminase activity (EC 2.6.1.88),
    used here. (2) PomBase model gomodel:69c59f8a00000584 is titled with
    GO:0033353 L-methionine cycle, but its content is this MTA salvage cycle.
    GO:0033353 denotes the SAM/SAH/homocysteine cycle, so GO:0071267
    L-methionine salvage is the better process term. GO:0033353 annotations
    on MTA-cycle genes (e.g. UTR4, ADI1, MDE1, MRI1) are legacy migrations
    from the obsoleted GO:0019509. (3) The PomBase model
    has two MTRu-1-P dehydratase activities, mde1 (SPAC20H4.05c, PTHR10640:SF7,
    the MDE1/APIP orthologue) and mta3 (SPAC9.06c, UniProt Q9UT22,
    "methylthioribulose-1-phosphate dehydratase-like protein", PTHR10640:SF10).
    mta3's enabled-by evidence in the model is IBA only
    (PTN000067541). Only mde1 is used as the S. pombe exemplar here, and
    whether mta3 is a second active dehydratase or a diverged paralogue is
    left open. (4) The PomBase model has no transamination step.

    Lineage variation: the dedicated dioxygenase step needs O2, and some
    bacteria (e.g. E. coli) lack a complete pathway (PMID:19946895). The
    nucleosidase/kinase entry and the split MtnW/MtnX enolase-phosphatase are
    bacterial/plant variants and have no yeast representatives. MTA
    phosphorylase also releases adenine to purine salvage.
