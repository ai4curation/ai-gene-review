      chaining_note: MTRu-1-P is the isomerase product and dehydratase substrate.
    - source: mtru1p_dehydratase_step
      target: acireductone_formation_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        2,3-diketo-5-methylthiopentyl 1-phosphate is the dehydratase product
        and the enolase(-phosphatase) substrate.
    - source: acireductone_formation_step
      target: acireductone_dioxygenase_step
