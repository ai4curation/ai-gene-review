      role: SAM-dependent bis-methylation of uroporphyrinogen III
      node:
        id: uroporphyrinogen_methylation_step
        label: Uroporphyrinogen III to precorrin-2
        module_type: REACTION
        annotons:
          - id: sumt_activity
            label: Uroporphyrinogen-III C-methyltransferase (SUMT)
            participant:
