id: MODULE:siroheme_biosynthesis
title: Siroheme biosynthesis from uroporphyrinogen III
description: >-
  Biosynthesis of siroheme, the iron-containing isobacteriochlorin prosthetic
  group of assimilatory sulfite and nitrite reductases, from the common
  tetrapyrrole precursor uroporphyrinogen III. Three reactions are required:
  S-adenosyl-L-methionine-dependent bis-methylation of uroporphyrinogen III at
  C-2 and C-7 to precorrin-2, NAD(P)+-dependent dehydrogenation of precorrin-2
  to sirohydrochlorin, and insertion of ferrous iron into sirohydrochlorin to
  give siroheme. The chemistry is conserved in bacteria, fungi and plants, but
  the enzyme architecture differs. In enterobacteria a single multifunctional
  siroheme synthase (CysG) carries all three activities, with the methylase in
  its C-terminal region and the dehydrogenase and chelatase sharing an
  N-terminal region. Fungi split the pathway between a monofunctional
  uroporphyrinogen-III methyltransferase (Met1-type) and a bifunctional
  dehydrogenase-ferrochelatase (Met8-type) that uses a single active site for
  both reactions. Bacillus and plants use separate enzymes for every step,
  including a small SirB-type sirohydrochlorin ferrochelatase that in plants is
  located in the plastid. Uroporphyrinogen III synthesis is shared with heme,
  chlorophyll and cobalamin biosynthesis and lies upstream of this module;
  incorporation of siroheme into sulfite reductase lies downstream.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY-5194-1
    title: siroheme biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Source pathway with three reactions: RXN-13403 (bis-methylation, MET1),
      DIMETHUROPORDEHYDROG-RXN (precorrin-2 dehydrogenase, MET8) and
      SIROHEME-FERROCHELAT-RXN (sirohydrochlorin ferrochelatase, MET8). All
      three catalyst assignments were retained after review; no enzyme is
      missing. The pathway comment notes that S. cerevisiae has no
      assimilatory nitrite reductase, so siroheme is used only by sulfite
      reductase in this yeast.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY-5194-1
  - source_id: GO:0019354
    title: siroheme biosynthetic process
    statement: Module-level biological process.
  - source_id: GO:0004851
    title: uroporphyrin-III C-methyltransferase activity
    statement: Molecular function of the first (bis-methylation) step.
  - source_id: GO:0043115
    title: precorrin-2 dehydrogenase activity
    statement: Molecular function of the second (dehydrogenation) step.
  - source_id: GO:0051266
    title: sirohydrochlorin ferrochelatase activity
    statement: Molecular function of the terminal (iron insertion) step.
  - source_id: PMID:9003798
    title: >-
      Siroheme biosynthesis in Saccharomyces cerevisiae requires the products
      of both the MET1 and MET8 genes.
    statement: >-
      Genetic identification of MET1 (identical to MET20) and MET8 as the
      S. cerevisiae siroheme biosynthesis genes.
    supporting_text: >-
      The MET1 gene from S. cerevisiae was cloned and shown to be the same
      gene as MET20. Sequence similitudes as well as complementation studies
      indicate that Met1p and Met8p are both involved in siroheme
      biosynthesis.
  - source_id: PMID:10051442
    title: The role of Saccharomyces cerevisiae Met1p and Met8p in sirohaem and cobalamin biosynthesis.
    statement: >-
      Complementation of cysG mutants and in vitro assay establish Met1p as
      the SAM-dependent uroporphyrinogen III methyltransferase and Met8p as
      the precorrin-2 dehydrogenase and sirohydrochlorin ferrochelatase.
    supporting_text: >-
      MET1 encodes the S-adenosyl-l-methionine uroporphyrinogen III
      transmethylase activity, and MET8 encodes the dehydrogenase and chelatase
      activities (all three functions are encoded by Sal. typhimurium and E.
      coli cysG).
  - source_id: PMID:11980703
    title: The structure of Saccharomyces cerevisiae Met8p, a bifunctional dehydrogenase and ferrochelatase.
    statement: >-
      Met8p carries out both terminal reactions with a single active site and
      a fold unrelated to other chelatases.
    supporting_text: >-
      Analysis of mutant proteins suggests that both catalytic activities
      share a single active site, and that Asp141 plays an essential role in
      both dehydrogenase and chelatase processes.
  - source_id: PMID:8243665
    title: The Escherichia coli cysG gene encodes the multifunctional protein, siroheme synthase.
    statement: E. coli CysG alone converts uroporphyrinogen III to siroheme.
    supporting_text: >-
      Thus CysG is a multifunctional protein solely responsible for siroheme
      synthesis from uro'gen III in E. coli, and accordingly is renamed
      siroheme synthase.
  - source_id: PMID:7945210
    title: Gene dissection demonstrates that the Escherichia coli cysG gene encodes a multifunctional protein.
    statement: >-
      The C-terminal region of CysG (residues 202-457) is the methyltransferase;
      the N-terminal region is required for the dehydrogenation and iron
      insertion steps.
    supporting_text: >-
      The evidence presented in this paper suggests that the CysG protein is a
      multifunctional protein involved in SAM-dependent methylation, pyridine
      dinucleotide dependent dehydrogenation and ferrochelation.
  - source_id: PMID:12408752
    title: >-
      Identification and functional analysis of enzymes required for
      precorrin-2 dehydrogenation and metal ion insertion in the biosynthesis
      of sirohaem and cobalamin in Bacillus megaterium.
    statement: >-
      Bacillus megaterium uses three separate enzymes, SirA, SirC
      (precorrin-2 dehydrogenase) and SirB (sirohydrochlorin ferrochelatase).
    supporting_text: >-
      SirC was found to act as a precorrin-2 dehydrogenase, generating
      sirohydrochlorin, and SirB was found to act as a ferrochelatase
      responsible for the final step in sirohaem synthesis.
  - source_id: PMID:15545265
    title: >-
      Identification and characterization of the terminal enzyme of siroheme
      biosynthesis from Arabidopsis thaliana: a plastid-located
      sirohydrochlorin ferrochelatase containing a 2FE-2S center.
    statement: >-
      Arabidopsis SirB is a small, chloroplast-located sirohydrochlorin
      ferrochelatase with an Fe-S centre.
    supporting_text: >-
      Green fluorescent protein tagging revealed that it is located in the
      chloroplast.
  - source_id: PMID:1479340
    title: Physiological analysis of mutants of Saccharomyces cerevisiae impaired in sulphate assimilation.
    statement: >-
      MET1 and MET8 are among the genes required for an enzymatically active
      sulfite reductase, linking this module to sulfate assimilation.
    supporting_text: >-
      the products of at least five genes are needed for the synthesis of an
      enzymically active sulphite reductase. These genes are MET1, MET5, MET8,
      MET10 and MET20.
