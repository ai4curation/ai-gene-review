  notes: >-
    NEW module from YeastPathways PWY-5194-1 (2026-10). Boundary: starts at
    uroporphyrinogen III (shared with heme, chlorophyll and cobalamin; its
    synthesis by the HEM enzymes is upstream) and ends with free siroheme.
    Insertion of siroheme into sulfite reductase belongs to
    aps_dependent_assimilatory_sulfate_reduction, whose sulfite-reduction
    step depends on this module (in S. cerevisiae met1 and met8 mutants lack
    sulfite reductase activity, PMID:1479340); cobaltochelation of
    sirohydrochlorin for anaerobic cobalamin synthesis (CbiK/CbiX) is a
    separate branch. YeastCyc assessment - the three reactions and the MET1
    and MET8 assignments are correct; YeastCyc's comment speaks of "four
    enzymatic steps" because the bis-methylation is two methyl transfers in
    one reaction (RXN-13403). Compartment: the yeast GO-CAM places all three
    activities in the cytosol, whereas plant SUMT and SirB are plastid
    enzymes, so no compartment is asserted at module level. Architecture is
    modelled as an explicit variant set for the two terminal reactions
    (bifunctional Met8, the N-terminal region of trifunctional CysG, or
    separate SirC + SirB); the methylase step is a single family role whose
    exemplars include the CysG C-terminal region. S. pombe orthologs
    (SPCC1739.06c SUMT and met8) exist but no PomBase GO-CAM is linked to
    this module, so they are not used as exemplars. GO-CAM comparison -
    YeastPathways_PWY-5194-1 agrees with the module on genes, functions and
    compartment, but has no causal edges between the three activities. In
    GOA, MET8 also carries an IDA for GO:0004325 protoporphyrin ferrochelatase
    activity (PMID:11980703); the physiologically relevant substrate is
    sirohydrochlorin and only GO:0051266 is used here.
