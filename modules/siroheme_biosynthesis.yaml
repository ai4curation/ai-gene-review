          to sirohydrochlorin, then insertion of Fe2+ into sirohydrochlorin to
          give siroheme. Both are always required; the lineages differ in
          whether one bifunctional enzyme, one domain of a trifunctional
          siroheme synthase, or two separate enzymes catalyse them.
