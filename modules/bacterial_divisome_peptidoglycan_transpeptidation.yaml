id: MODULE:bacterial_divisome_peptidoglycan_transpeptidation
title: Bacterial divisome peptidoglycan polymerization and crosslinking
description: >-
  A septal peptidoglycan-synthesis module for the bacterial divisome core in
  which the SEDS glycosyltransferase FtsW polymerizes lipid II-derived glycan
  strands and the class B penicillin-binding protein FtsI/PBP3 forms 4-3
  peptide crosslinks at the division septum. FtsW and FtsI form the cognate
  division synthase pair; upstream FtsZ-ring positioning, precursor lipid II
  synthesis, class A PBP backup polymerases, and downstream cell separation are
  outside this focused module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0000917
    title: division septum assembly
    statement: Defines the septal cell-division process that requires FtsI/PBP3.
  - source_id: GO:0009252
    title: peptidoglycan biosynthetic process
    statement: Defines peptidoglycan synthesis from lipid II.
  - source_id: file:genes/ECOLI/ftsI/ftsI-ai-review.yaml
    title: ECOLI ftsI gene review
    statement: >-
      The completed E. coli ftsI review grounds FtsI as the PBP3 septal
      D,D-transpeptidase.
  - source_id: file:genes/ECOLI/ftsW/ftsW-ai-review.yaml
    title: ECOLI ftsW gene review
    statement: >-
      The completed E. coli ftsW review grounds FtsW as the SEDS-family septal
      peptidoglycan glycosyltransferase.
  - source_id: PMID:6450748
    title: >-
      Evidence for involvement of penicillin-binding protein 3 in murein
      synthesis during septation but not during cell elongation.
    statement: Supports the septation-specific requirement for PBP3 activity.
  - source_id: PMID:9603865
    title: FtsI and FtsW are localized to the septum in Escherichia coli.
    statement: Establishes septal localization of FtsI and FtsW.
  - source_id: PMID:20847002
    title: >-
      The integral membrane FtsW protein and peptidoglycan synthase PBP3 form a
      subcomplex in Escherichia coli.
    statement: Establishes the FtsW-FtsI/PBP3 subcomplex.
  - source_id: PMID:27525505
    title: SEDS proteins are a widespread family of bacterial cell wall polymerases.
    statement: Establishes the SEDS protein family as peptidoglycan glycosyltransferases.
notes: >-
  The completed ftsW and ftsI ECOLI reviews cover the septal SEDS/bPBP synthase
  pair. The old assignment of peptidoglycan glycosyltransferase activity to
  FtsI was a historical misattribution; the glycosyltransferase role belongs to
  FtsW and other polymerases, not PBP3.
