                      septal glycan-labeling experiments in E. coli support its physiological polymerase role,
                      while purified ortholog complexes establish the cognate-bPBP dependence. This core excludes
                      the separate in-vitro lipid-II translocation capacity.
                    supporting_text: We conclude that FtsW is a peptidoglycan polymerase that requires divalent
                      cations and the presence of a bPBP for activity.
