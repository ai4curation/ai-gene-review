id: MODULE:bacterial_divisome_peptidoglycan_transpeptidation
title: Bacterial divisome peptidoglycan polymerization and crosslinking
description: 'A focused FtsW/class-B-PBP septal peptidoglycan-synthesis mechanism with two required reactions:
  lipid-II-derived glycan polymerization and serine-dependent D,D peptide crosslinking. FtsW requires a compatible
  bPBP activation interface, whereas crosslink catalysis can be supplied conditionally by Bacillus PBP3 while
  physical PBP2B remains present. The acceptor amino group may lie on a stem peptide or an attached bridge;
  mDAP is not universal. Sampled E. coli, Bacillus, Staphylococcus and Streptococcus implementations illustrate
  this mechanism, which is not a universal description of bacterial division. Precursor supply, divisome positioning
  and upstream activation, class-A-PBP alternatives and cell separation lie outside this focused boundary.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: GO:0000917
  title: division septum assembly
  statement: Defines septum assembly as process context; it does not specify a universally required FtsI implementation.
- source_id: GO:0009252
  title: peptidoglycan biosynthetic process
  statement: Defines peptidoglycan synthesis from lipid II.
- source_id: file:genes/ECOLI/ftsI/ftsI-ai-review.yaml
  title: ECOLI ftsI gene review
  statement: The completed E. coli ftsI review grounds FtsI as the PBP3 septal D,D-transpeptidase.
- source_id: file:genes/ECOLI/ftsW/ftsW-ai-review.yaml
  title: ECOLI ftsW gene review
  statement: The completed E. coli ftsW review grounds FtsW as the SEDS-family septal peptidoglycan glycosyltransferase.
- source_id: PMID:6450748
  title: Evidence for involvement of penicillin-binding protein 3 in murein synthesis during septation but
    not during cell elongation.
  statement: Supports the septation-specific requirement for PBP3 activity.
- source_id: PMID:9603865
  title: FtsI and FtsW are localized to the septum in Escherichia coli.
  statement: Establishes septal localization of FtsI and FtsW.
- source_id: PMID:20847002
  title: The integral membrane FtsW protein and peptidoglycan synthase PBP3 form a subcomplex in Escherichia
    coli.
  statement: Establishes the FtsW-FtsI/PBP3 subcomplex.
- source_id: PMID:27525505
  title: SEDS proteins are a widespread family of bacterial cell wall polymerases.
  statement: Establishes the SEDS protein family as peptidoglycan glycosyltransferases.
- source_id: PMID:40879381
  title: Peptidoglycan polymerase function and regulation.
  statement: The comparative review distinguishes SEDS GT119 polymerases from class-A-PBP GT51 architecture.
    Similar PG output does not make the families interchangeable.
  supporting_text: a C1-type GTase from the CAZy GT119 family
- source_id: PMID:38821027
  title: Stay on track - revelations of bacterial cell wall synthesis enzymes and things that go by single-molecule
    imaging.
  statement: The review compares synthase dynamics across diderm and monoderm models. Conserved septal synthesis
    does not imply a universal two-track motion mechanism.
  supporting_text: the movement occurs at two distinct speeds
- source_id: PMID:30692671
  title: FtsW is a peptidoglycan polymerase that is functional only in complex with its cognate penicillin-binding
    protein.
  statement: Purified FtsW requires a compatible bPBP for polymerization; its partner may be catalytically
    inactive. StPBP2x crosslink products are separately measured, so polymerization does not prove complete
    crosslinked output.
  supporting_text: its polymerase activity requires complex formation with its partner class B PBP.
- source_id: PMID:28792086
  title: Functional redundancy of division specific penicillin-binding proteins in Bacillus subtilis.
  statement: In the tested Bacillus subtilis mutants, PBP3 supplies catalytic capacity when PBP2B catalysis
    is disabled; the PBP2B protein still provides an essential structural role.
  supporting_text: a catalytically inactive mutant of PBP 2B supports cell division
- source_id: PMID:41118402
  title: Molecular dissection of Class A PBP function uncovers novel features of the non-canonical Clostridioides
    difficile divisome complex.
  statement: C. difficile vegetative cell division uses a class-A-PBP1-centered mechanism and bounds claims
    that FtsW/FtsI is universally required. This alternative lies outside the focused FtsW/bPBP pair.
  supporting_text: it lacks functional orthologs of the septal peptidoglycan-synthesizing enzymes, FtsW and
    FtsI.
notes: 'The two original reaction nodes and E. coli annoton identifiers are retained. Nine completed reference-protein
  reviews ground four compatible native pairs and one conditional PBP3 catalytic substitute. Family membership
  identifies candidates, not partner compatibility or catalytic competence. The checker uses production compile_node/is_satisfied
  with an explicit active-unit and proposed-function-aware oracle; one pair/taxon witness is shared across
  both reactions. Same-taxon constraints bound native panel inference, not all possible heterologous biochemistry:
  PMID30692671 directly demonstrated StFtsW activation by pneumococcal PBP2x. FtsW polymerization alone does
  not establish crosslinked output; StPBP2x crosslinking also works on glycan supplied by other polymerases.
  No stable FtsW/PBP2B/PBP3 trimer is asserted. Comparative review findings and eight original curated reference
  entries are retained unchanged.'
