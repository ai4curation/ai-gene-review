- id: PMID:40879381
  title: Peptidoglycan polymerase function and regulation.
  findings:
  - statement: The comparative review distinguishes SEDS GT119 polymerases from class-A-PBP GT51 architecture.
      Similar PG output does not make the families interchangeable.
    supporting_text: a C1-type GTase from the CAZy GT119 family
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Accessible abstract supports architecture; detailed compatibility claims rely on primary
      assays. Cache is abstract-only.
- id: PMID:38821027
  title: Stay on track - revelations of bacterial cell wall synthesis enzymes and things that go by single-molecule
    imaging.
  findings:
  - statement: The review compares synthase dynamics across diderm and monoderm models. Conserved septal synthesis
      does not imply a universal two-track motion mechanism.
    supporting_text: the movement occurs at two distinct speeds
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative synthesis; motion models remain scoped to the organisms and assays reviewed.
      Full cached text is available.
- id: PMID:35408901
  title: 'An Updated Model of the Divisome: Regulation of the Septal Peptidoglycan Synthesis Machinery by the
    Divisome.'
  findings:
  - statement: FtsBLQ/FtsN regulation belongs to activation context for the focused synthase pair. Proposed
      contacts and assembly models are not direct proof of a universal regulator set.
    supporting_text: multiple putative interactions within FtsWI and with regulators
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: The source explicitly labels proposed interactions and models; avoid converting speculation
      to required module steps. Full cached text is available.
- id: PMID:30692671
  title: FtsW is a peptidoglycan polymerase that is functional only in complex with its cognate penicillin-binding
    protein.
  findings:
  - statement: Purified FtsW requires a compatible bPBP for polymerization; its partner may be catalytically
      inactive. StPBP2x crosslink products are separately measured, so polymerization does not prove complete
      crosslinked output.
    supporting_text: its polymerase activity requires complex formation with its partner class B PBP.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary text and Methods examined. The StFtsW construct is current Q5M5I9 residues 6-431;
      donor and expression strains differ in some assays. Lipid-II source and polymerase/crosslinking readouts
      must be distinguished. Full cached text is available.
- id: PMID:28792086
  title: Functional redundancy of division specific penicillin-binding proteins in Bacillus subtilis.
  findings:
  - statement: In the tested Bacillus subtilis mutants, PBP3 supplies catalytic capacity when PBP2B catalysis
      is disabled; the PBP2B protein still provides an essential structural role.
    supporting_text: a catalytically inactive mutant of PBP 2B supports cell division
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Conditional substitution in the tested 168-derived backgrounds; not dispensability of the
      PBP2B protein or a universal native replacement route. Full cached text is available.
- id: PMID:38480901
  title: Peptidoglycan synthesis drives a single population of septal cell wall synthases during division in
    Bacillus subtilis.
  findings:
  - statement: Bacillus septal synthase movement is driven by PG synthesis and differs from E. coli two-track
      dynamics. Partial dependence of processivity on FtsZ is retained.
    supporting_text: a partial dependence of PBP2B processivity on FtsZ treadmilling was observed
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Native imaging uses PY79-derived strains; reference-sequence identity and kinetic claims
      are separate questions. Full cached text is available.
- id: PMID:38480900
  title: Cell constriction requires processive septal peptidoglycan synthase movement independent of FtsZ treadmilling
    in Staphylococcus aureus.
  findings:
  - statement: Staphylococcus aureus shows synthesis-associated FtsW/PBP1 motion and septal constriction under
      the examined conditions; this does not require imposing E. coli track behavior.
    supporting_text: independently of FtsZ treadmilling in S. aureus.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Imaging and inhibition support native coupling; the experiments do not establish universal
      independence of all divisome assembly from FtsZ. Full cached text is available.
- id: PMID:41118402
  title: Molecular dissection of Class A PBP function uncovers novel features of the non-canonical Clostridioides
    difficile divisome complex.
  findings:
  - statement: C. difficile vegetative cell division uses a class-A-PBP1-centered mechanism and bounds claims
      that FtsW/FtsI is universally required. This alternative lies outside the focused FtsW/bPBP pair.
    supporting_text: it lacks functional orthologs of the septal peptidoglycan-synthesizing enzymes, FtsW and
      FtsI.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Primary source distinguishes vegetative division and conditional PBP3 regulatory participation;
      do not infer absence of all SEDS proteins or all sporulation functions. Full cached text is available.
