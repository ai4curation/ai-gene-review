                affinity.
              evidence:
              - source_id: file:KOMXY/bcsA/bcsA-ai-review.yaml
                statement: Complete gene review verifies the sequence bridge and distinguishes conserved
                  catalytic function from historical subunit naming.
            - preferred_term: cslA (STRLI)
              term:
                id: UniProtKB:A0ABM5R5V5
                label: Glycosyl transferase
              description: TK24 reference protein, identical to assayed 1326 CslA. Exact sequence identity
