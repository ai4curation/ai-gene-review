id: MODULE:bacterial_cellulose_biosynthesis
title: Bacterial cellulose biosynthesis
description: Bacterial UDP-glucose-dependent cellulose polymerization coupled to architecture-dependent
  membrane translocation, periplasmic support and extracellular passage. BcsA-family synthases provide
  the conserved catalytic role. Characterized BcsB/BcsC systems coexist with typeIII BcsC-independent
  and cyanobacterial BcsB-independent architectures whose envelope mechanisms remain incompletely resolved.
  A distinct monoderm CslA–GlxA complex establishes cellulose-synthesizing capacity in vitro, with native
  polymer composition unresolved. PilZ-dependent activation and accessory assembly factors are modeled
  in their applicable implementations. The taxon context describes diverse bacterial lineages, not universal
  occurrence or a universally sufficient protein inventory.
status: COMPLETE
evidence:
- source_id: PMID:26077867
  title: 'Bacterial cellulose biosynthesis: diversity of operons, subunits, products, and functions.'
  statement: Four principal operon architectures distinguish conserved polymerization from lineage-dependent
    support and export; BcsB and BcsC are not universal bacterial requirements.
  supporting_text: In most studied bacteria, just two subunits, BcsA and BcsB, are necessary and sufficient
    for the formation of the polysaccharide chain in vitro.
- source_id: PMID:38688160
  title: 'Bacterial synthase-dependent exopolysaccharide secretion: a focus on cellulose.'
  statement: A contemporary review distinguishes common synthase mechanisms from diverse modification
    and crystalline-assembly machinery.
  supporting_text: The secreted cellulosic chains can be decorated with additional chemical groups or
    can pack with various degrees of crystallinity depending on dedicated enzymatic complexes and/or cytoskeletal
    scaffolds.
- source_id: PMID:40941819
  title: 'Cellulose Synthesis in Cyanobacteria: Shared Pathways and Distinct Features with Bacteria and
    Plants.'
  statement: Cyanobacterial synthases extend the relevant taxonomic scope beyond Pseudomonadota, but replacement
    export machinery remains mechanistically uncertain.
  supporting_text: These operons typically entail bcsA but lack bcsB and other canonical bcs genes present
    in other bacterial systems.
- source_id: PMID:23222542
  title: Crystallographic snapshot of cellulose synthesis and membrane translocation.
  statement: Rhodobacter sphaeroides 2.4.1 BcsA/BcsB structures connect glycosyl transfer to inner-membrane
    cellulose translocation.
  supporting_text: BcsB is a periplasmic protein that is anchored to the inner membrane via a single,
    C-terminal TM-helix.
- source_id: PMID:24704788
  title: Mechanism of activation of bacterial cellulose synthase by cyclic di-GMP.
  statement: The direct c-di-GMP activation switch resides in the cytoplasmic PilZ domain of BcsA.
  supporting_text: BcsA forms a PilZ domain within its C-terminal intracellular extension
- source_id: PMID:31604608
  title: Architecture of the Cellulose Synthase Outer Membrane Channel and Its Association with the Periplasmic
    TPR Domain.
  statement: The E. coli BcsC outer-membrane channel provides a structural basis for cellulose export
    through a hydrated barrel.
  supporting_text: The membrane-integrated porin domain of BcsC forms a kidney-shaped 16-stranded β-barrel
- source_id: PMID:39242554
  title: Insights into phosphoethanolamine cellulose synthesis and secretion across the Gram-negative
    cell envelope.
  statement: The E. coli BcsB/BcsC interface supplies evidence for a trans-envelope handoff in the enterobacterial
    system.
  supporting_text: BcsC interacts with the terminal BcsB subunit of the semicircle to establish an envelope-spanning
    complex.
- source_id: PMID:33563593
  title: Architecture and regulation of an enterobacterial cellulose secretion system.
  statement: BcsQ participates in an ATP-bound regulatory assembly, with weak ATPase activity rather than
    demonstrated high-turnover transport energetics.
  supporting_text: the BcsHisRQWT complex exhibited only weak adenosine triphosphatase (ATPase) activity
    in vitro
- source_id: PMID:24097954
  title: Cellulose as an architectural element in spatially structured Escherichia coli biofilms.
  statement: A premature stop in native E. coli K12 bcsQ prevents a functional cellulose system under
    the tested conditions; repairing W3110 yields AR3110.
  supporting_text: We conclude that the SNP that generates the stop codon early in bcsQ interferes with
    cellulose biosynthesis in the “domesticated” E. coli K-12 laboratory strains.
- source_id: PMID:21498404
  title: Cellulose accumulation and a cellulose synthase gene are responsible for cell aggregation in
    the cyanobacterium Thermosynechococcus vulcanus RKN.
  statement: The RKN cyanobacterial Tvtll0007 synthase is genetically implicated in cellulose accumulation
    among three assayed candidate synthases.
  supporting_text: Gene disruption analysis showed that only Tvtll0007 was responsible for both the light-
    and low temperature-induced cell aggregation and the induction of cellulose accumulation.
- source_id: PMID:29688612
  title: 'Genetic identification of factors for extracellular cellulose accumulation in the thermophilic
    cyanobacterium Thermosynechococcus vulcanus: proposal of a novel tripartite secretion system.'
  statement: RKN genetics supports accessory contributions of XcsB, XcsC and TolC; a tripartite export
    mechanism is proposed, not directly reconstituted.
  supporting_text: Based on these and phylogenetic analysis, we propose that the cyanobacterial extracellular
    cellulose production is due to a novel variant of the bacterial tripartite secretion system.
- source_id: PMID:20921370
  title: Structure of bacterial cellulose synthase subunit D octamer with four inner passageways.
  statement: An octameric BcsD structure binds cellopentaose and supports a proposed glucan-organization
    mechanism; it does not demonstrate directional transport.
  supporting_text: The location of cellopentaoses in the complex structure suggests that four glucan chains
    are extruded individually through their own passageway along the dimer interface in a twisted manner.
- source_id: PMID:38557137
  title: CslA and GlxA from Streptomyces lividans form a functional cellulose synthase complex.
  statement: A purified Streptomyces lividans CslA–GlxA complex synthesizes cellulose in vitro; GlxA is
    an auxiliary partner distinct from BcsB. This demonstrates biochemical capacity, while native glycan
    composition remains unresolved.
  supporting_text: the CslA–GlxA complex produces cellulose chains of at least 60–80 glucose units with
    UDP-glucose as substrate.
- source_id: PMID:38750617
  title: Glycosyl transferase GT2 genes mediate the biosynthesis of an unusual (1,3;1,4)-β-glucan exopolysaccharide
    in the bacterium Sarcina ventriculi.
  statement: Sarcina ventriculi GT2 enzymes synthesize mixed-linkage glucan. GT2 membership and historical
    cellulose staining cannot establish cellulose-specific chemistry.
  supporting_text: Here we show that two family GT2 glycosyltransferases from the Gram-positive bacterium
    Sarcina ventriculi are capable of synthesizing MLGs.
- source_id: PMID:33264329
  title: Identification of the Clostridial cellulose synthase and characterization of the cognate glycosyl
    hydrolase, CcsZ.
  statement: The clostridial study proposes a cellulose-synthase system from homology and directly characterizes
    CcsZ hydrolase; it does not demonstrate CcsA polymerase activity.
  supporting_text: Here, we demonstrate the presence of the ccsZABHI locus that bears sequence similarities
    to known Gram-negative cellulose exopolysaccharide biosynthesis systems and propose for the first
    time a model of cellulose synthesis in Gram positives
notes: The root requires polymerization plus an envelope architecture. The BcsB/BcsC route is grounded
  in primary structural and biochemical evidence; typeIII and cyanobacterial routes retain explicit unresolved
  annotons rather than silently substituting speculative carriers. A failure to close those routes is
  an abduction target because native cellulose production is observed. This is not a claim of pathway
  absence. Family coverage includes directly assayed RKN and Rhodobacter proteins; no particular PANTHER/domain
  signature is treated as universal if it excludes those exemplars. E. coli repaired/full-length BcsQ
  and native pseudogene fragment are separate records. Direct PilZ binding belongs to BcsA, not BcsB.
  Family/database names are labels only and do not override primary evidence. The monoderm CslA–GlxA architecture
  has direct biochemical support. Sarcina mixed-linkage glucan and modeled clostridial CcsA are specificity
  comparators, not additional assayed cellulose-polymerase exemplars.
module:
  id: bacterial_cellulose_biosynthesis
  label: Bacterial cellulose biosynthesis
  module_type: BIOLOGICAL_PROCESS
  description: Cellulose polymerization plus architecture-dependent support and envelope passage. Known
    polymerase activity is distinguished from a fully explained extracellular system.
  concepts:
  - preferred_term: cellulose biosynthetic process
