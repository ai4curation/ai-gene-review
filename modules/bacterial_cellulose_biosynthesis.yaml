    - preferred_term: Bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
      description: Cross-taxon cellulose machinery sampled in Pseudomonadota, Cyanobacteriota and Streptomyces.
        BcsB/BcsC and accessory requirements differ by architecture. The Streptomyces complex establishes
        biochemical capacity, not confirmed native cellulose output or universal bacterial occurrence.
  parts:
  - role: Required cellulose polymerization and plasma-membrane translocation
    node:
      id: bcsA_cellulose_polymerization_step
      label: BcsA cellulose polymerization step
      module_type: REACTION
      description: BcsA-family multi-pass inner-membrane GT2 enzymes polymerize UDP-glucose into cellulose
        and couple chain elongation to membrane translocation.
      annotons:
      - id: bcsA_cellulose_synthase
        label: BcsA cellulose synthase catalytic subunit
        participant:
          selector_type: FAMILY
          family:
            preferred_term: BcsA cellulose synthase catalytic subunit family
            term:
              id: PANTHER:PTHR43867:SF2
              label: Cellulose synthase catalytic subunit A [UDP-forming]
            description: 'BcsA-family GT2 proteins within the verified PTHR43867:SF2 subfamily. SF2 also
              contains non-cellulose glycosyltransferases, so membership is intersected with independently
              supported UDP-forming cellulose synthase activity. The cellulose-specific IPR003919 signature
              cannot be universal: the experimentally supported RKN synthase E5RST0 lacks it in the frozen
              record. OpgH and monoglucosyldiacylglycerol-synthase comparators do not acquire cellulose
              activity from this family name. Activity is evaluated from completed evidence-based reviews,
              including the proposed GO:0016760 refinements for E5RST0 and A0ABM5R5V5. Their frozen GOA
              records carry GO:0016758, so an unmodified GOA-only scan still leaves these two unresolved.
              The independent biochemical evidence, not the family name or proposal alone, supports the
              refinement.'
            representative_members:
            - preferred_term: bcsA (PSEPK)
              term:
                id: UniProtKB:Q88JL4
                label: Cellulose synthase catalytic subunit [UDP-forming]
              description: Pseudomonas putida KT2440 bcsA/PP_2635.
            - preferred_term: RSP_0333 (CERS4)
              term:
                id: UniProtKB:Q3J125
                label: Cellulose synthase catalytic subunit [UDP-forming]
              description: Directly characterized Cereibacter (Rhodobacter) sphaeroides 2.4.1 BcsA, mapped
                by methods and 4HG6/4P00.
            - preferred_term: celA (AGRFC)
              term:
                id: UniProtKB:A9CEZ7
                label: Cellulose synthase catalytic subunit [UDP-forming]
              description: Agrobacterium fabrum C58 reference CelA; C58-lineage genetics supports the
                role but exact historical construct/residue identity is not assumed.
            - preferred_term: Tvtll0007 (THEVL)
              term:
                id: UniProtKB:E5RST0
                label: Cellulose synthase
              description: Authentic cyanobacterial RKN synthase mapped through AB571479/BAJ61012.1; not
                the similarly named BP1 protein.
            - preferred_term: bcsA (ECOLI)
              term:
                id: UniProtKB:P37653
                label: Cellulose synthase catalytic subunit [UDP-forming]
              description: K12 reference BcsA; native pathway output depends on the strain and bcsQ state.
              evidence:
              - source_id: file:ECOLI/bcsA/bcsA-ai-review.yaml
                statement: The completed gene review distinguishes source identity, inferred role and
                  experimental limitations.
            - preferred_term: bcsA (KOMXY,1306-3)
