- id: PMID:20921370
  title: Structure of bacterial cellulose synthase subunit D octamer with four inner passageways.
  findings:
  - statement: An octameric BcsD structure binds cellopentaose and supports a proposed glucan-organization
      mechanism; it does not demonstrate directional transport.
    supporting_text: The location of cellopentaoses in the complex structure suggests that four glucan
      chains are extruded individually through their own passageway along the dimer interface in a twisted
      manner.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
