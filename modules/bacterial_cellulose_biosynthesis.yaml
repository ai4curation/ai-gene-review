references:
- id: PMID:26077867
  title: 'Bacterial cellulose biosynthesis: diversity of operons, subunits, products, and functions.'
  findings:
  - statement: Four principal operon architectures distinguish conserved polymerization from lineage-dependent
      support and export; BcsB and BcsC are not universal bacterial requirements.
    supporting_text: In most studied bacteria, just two subunits, BcsA and BcsB, are necessary and sufficient
      for the formation of the polysaccharide chain in vitro.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review examined, including typeIII systems lacking BcsC and typeIV systems lacking
      BcsB. Architectural diversity does not establish the proposed alternative proteins' exact activities.
- id: PMID:38688160
  title: 'Bacterial synthase-dependent exopolysaccharide secretion: a focus on cellulose.'
  findings:
  - statement: A contemporary review distinguishes common synthase mechanisms from diverse modification
      and crystalline-assembly machinery.
    supporting_text: The secreted cellulosic chains can be decorated with additional chemical groups or
      can pack with various degrees of crystallinity depending on dedicated enzymatic complexes and/or
      cytoskeletal scaffolds.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract-only cache; used for comparative framing, with individual mechanisms grounded
      in accessible primary studies.
  full_text_unavailable: true
- id: PMID:40941819
  title: 'Cellulose Synthesis in Cyanobacteria: Shared Pathways and Distinct Features with Bacteria and
    Plants.'
  findings:
  - statement: Cyanobacterial synthases extend the relevant taxonomic scope beyond Pseudomonadota, but
      replacement export machinery remains mechanistically uncertain.
    supporting_text: These operons typically entail bcsA but lack bcsB and other canonical bcs genes present
      in other bacterial systems.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review examined. Its proposed functional equivalence of HlyD-like/BcsW proteins
      to BcsB is not treated as demonstrated transport chemistry; the 2018 primary paper describes a proposed
      tripartite system.
- id: PMID:23222542
  title: Crystallographic snapshot of cellulose synthesis and membrane translocation.
  findings:
  - statement: Rhodobacter sphaeroides 2.4.1 BcsA/BcsB structures connect glycosyl transfer to inner-membrane
      cellulose translocation.
    supporting_text: BcsB is a periplasmic protein that is anchored to the inner membrane via a single,
      C-terminal TM-helix.
  - statement: BcsA forms the cellulose-conducting channel that couples polymerization to membrane passage.
    supporting_text: demonstrates how BcsA forms a cellulose-conducting channel, and suggests a model
      for the coupling of cellulose synthesis and translocation in which the nascent polysaccharide is
      extended by one glucose molecule at a time.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. Assayed BcsA Q3J125 and BcsB Q3J126 identities are independently
      mapped through 4HG6/4P00. BcsB construct lacks its native signal sequence; this is not direct evidence
      for every bacterial architecture.
- id: PMID:24704788
  title: Mechanism of activation of bacterial cellulose synthase by cyclic di-GMP.
  findings:
  - statement: The direct c-di-GMP activation switch resides in the cytoplasmic PilZ domain of BcsA.
    supporting_text: BcsA forms a PilZ domain within its C-terminal intracellular extension
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full Rhodobacter mechanistic study examined. Direct ligand binding is not transferred
      to periplasmic BcsB merely from its historical protein name.
- id: PMID:31604608
  title: Architecture of the Cellulose Synthase Outer Membrane Channel and Its Association with the Periplasmic
    TPR Domain.
  findings:
  - statement: The E. coli BcsC outer-membrane channel provides a structural basis for cellulose export
      through a hydrated barrel.
    supporting_text: The membrane-integrated porin domain of BcsC forms a kidney-shaped 16-stranded β-barrel
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined;6TZK maps to P37650. The structure is a truncated C-terminal construct,
      not a direct flux measurement or a universal alternative-export architecture.
- id: PMID:39242554
  title: Insights into phosphoethanolamine cellulose synthesis and secretion across the Gram-negative
    cell envelope.
  findings:
  - statement: The E. coli BcsB/BcsC interface supplies evidence for a trans-envelope handoff in the enterobacterial
      system.
    supporting_text: BcsC interacts with the terminal BcsB subunit of the semicircle to establish an envelope-spanning
      complex.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text examined. Experiments include a Rhodobacter/E. coli BcsA chimera and a BcsC-TPR/BcsB
      fusion; do not generalize exact stoichiometry or phosphoethanolamine modification to all taxa.
- id: PMID:33563593
  title: Architecture and regulation of an enterobacterial cellulose secretion system.
  findings:
  - statement: BcsQ participates in an ATP-bound regulatory assembly, with weak ATPase activity rather
      than demonstrated high-turnover transport energetics.
    supporting_text: the BcsHisRQWT complex exhibited only weak adenosine triphosphatase (ATPase) activity
      in vitro
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text recovered by normal fetch. Source genes were amplified from E. coli 1094;
      BL21 was the expression host. ATP binding and mutant phenotypes support an assembly/regulatory role;
      the precise hydrolysis-dependent step remains proposed.
- id: PMID:39394223
  title: Structural basis for synthase activation and cellulose modification in the E. coli Type II Bcs
    secretion system.
  findings:
  - statement: Enterobacterial cellulose modification and cytosolic regulator recruitment involve additional
      BcsG and BcsF machinery.
    supporting_text: a dimeric BcsF-dependent recruitment of an otherwise cytosolic BcsE2R2Q2 regulatory
      complex
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text recovered by normal fetch. Source E. coli 1094 genes and native phenotypic
