      No transport or catalytic MF is inferred.
- id: PMID:38557137
  title: CslA and GlxA from Streptomyces lividans form a functional cellulose synthase complex.
  findings:
  - statement: A purified Streptomyces lividans CslA–GlxA complex synthesizes cellulose in vitro; GlxA
      is an auxiliary partner distinct from BcsB. This demonstrates biochemical capacity, while native
      glycan composition remains unresolved.
    supporting_text: the CslA–GlxA complex produces cellulose chains of at least 60–80 glucose units with
      UDP-glucose as substrate.
  - statement: The authors explicitly distinguish demonstrated synthesis in vitro from the unresolved
      native glycan identity.
    supporting_text: While our work unambiguously shows that CslA–GlxA can synthesize cellulose in vitro,
      it remains to be established whether this is also the glucan that is produced in vivo.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text and source constructs checked. TK24 CslA is identical to assayed strain 1326
      CslA through UniParc, UniSave, genomic translation and primer checks. GlxA is the experimentally
      supported extended 645-residue 1326 protein. Native TK24 phenotype, native polymer composition and
      a direct GlxA c-di-GMP-binding site are not transferred.
- id: PMID:38750617
  title: Glycosyl transferase GT2 genes mediate the biosynthesis of an unusual (1,3;1,4)-β-glucan exopolysaccharide
    in the bacterium Sarcina ventriculi.
  findings:
  - statement: Sarcina ventriculi GT2 enzymes synthesize mixed-linkage glucan. GT2 membership and historical
      cellulose staining cannot establish cellulose-specific chemistry.
    supporting_text: Here we show that two family GT2 glycosyltransferases from the Gram-positive bacterium
      Sarcina ventriculi are capable of synthesizing MLGs.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Abstract supports the explicit product-specificity finding; no unavailable full-text
      methods or individual source accession is inferred. This is a counterexample to treating GT2 enzymes
      or all reported Gram-positive glucans as cellulose.
- id: PMID:33264329
  title: Identification of the Clostridial cellulose synthase and characterization of the cognate glycosyl
    hydrolase, CcsZ.
  findings:
  - statement: The clostridial study proposes a cellulose-synthase system from homology and directly characterizes
      CcsZ hydrolase; it does not demonstrate CcsA polymerase activity.
    supporting_text: Here, we demonstrate the presence of the ccsZABHI locus that bears sequence similarities
      to known Gram-negative cellulose exopolysaccharide biosynthesis systems and propose for the first
      time a model of cellulose synthesis in Gram positives
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text distinguishes modeled CcsA from the experimentally assayed CcsZ hydrolase.
