id: MODULE:il10_signaling
title: Interleukin-10 signaling — IL-10 binding to IL10RA and recruitment of IL10RB, JAK1/TYK2 activation, STAT3 docking on phospho-IL10RA and STAT3-driven anti-inflammatory transcription; IL10/IL10RA/IL10RB/JAK1/TYK2/STAT3/STAT1
description: >-
  Interleukin-10 (IL-10), a domain-swapped homodimeric class II cytokine, binds its high-affinity
  receptor chain IL10RA (IL-10R1); the IL-10:IL10RA complex then recruits the shared low-affinity
  chain IL10RB (IL-10R2), which cannot bind IL-10 alone. Assembly of the ternary complex activates
  JAK1, bound to IL10RA, and TYK2, bound to IL10RB. The kinases phosphorylate two tyrosines in the
  IL10RA cytoplasmic domain that are the docking sites for STAT3; JAK-phosphorylated STAT3 dimerizes,
  enters the nucleus and drives the transcriptional programme that suppresses pro-inflammatory
  cytokine production in monocytes and macrophages. STAT1 (and STAT5 in some cells) is also
  activated but is not recruited through the STAT3 docking sites. Among the STAT3-induced genes is
  SOCS3, which does not inhibit the IL-10 receptor itself.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000515
    title: interleukin-10 signaling pathway
    statement: >-
      RGD Pathway Ontology diagram from which this module is derived: Il10 binding to Il10ra and
      Il10rb, Jak1 on Il10ra and Tyk2 on Il10rb phosphorylating Il10ra at two tyrosines, Stat3
      recruited to the phosphotyrosine, Stat1 associated with Il10ra, and anti-inflammatory and
      Th1/Th2 outputs.
  - source_id: GO:0140105
    title: interleukin-10-mediated signaling pathway
    statement: >-
      The GO process mapped to PW:0000515 and the concept of this module's root node; it is the
      process term of the human IL-10 GO-CAM and of the experimental GOA rows on IL10, IL10RA,
      IL10RB, JAK1, TYK2 and STAT3.
  - source_id: PMID:31611251
    title: Biology and therapeutic potential of interleukin-10.
    statement: Review used for the overall decomposition into receptor assembly, JAK1/TYK2 and STAT3 steps.
    supporting_text: >-
      Binding of IL-10 to its receptor activates a major JAK1-TYK2-STAT3 signaling cascade, which
      culminates with the induction of the STAT3-mediated anti-inflammatory response.
  - source_id: PMID:12754507
    title: IL-6 induces an anti-inflammatory response in the absence of SOCS3 in macrophages.
    statement: >-
      Boundary evidence for the SOCS3 decision: SOCS3 is induced by IL-10 but does not block IL-10
      receptor signalling, so it is an output of this module, not a feedback part.
    supporting_text: SOCS3 specifically prevents activation of STAT3 by IL-6 but not IL-10.
  - source_id: gomodel:626b20c100000681
    title: IL10-mediated signaling pathway (Human)
    statement: >-
      Production human GO-CAM realizing this module: IL10 cytokine activity upstream of IL10RA
      interleukin-10 receptor activity, which is upstream of IL10RB coreceptor activity and JAK1
      kinase activity; IL10RB is upstream of TYK2 and JAK1 is upstream of STAT3. Its six activities
      are pinned to the annotons below.
notes: >-
  Derivation. This module is derived from RGD PW:0000515 (interleukin-10 signaling pathway; 7
  RGD-curated human genes: IL10, IL10RA, IL10RB, JAK1, STAT1, STAT3, TYK2). All seven are modelled.
  The RGD text also describes upstream control of IL10 production (STAT3 downstream of IL-6 and
  IL-12, TLR2 and pathogen induction) and the many downstream immune effects; IL-10 production is a
  separate process (GO:0032613) outside this module, and the effects are outputs of the STAT3
  transcription step.

  Relationship to il22_signaling and il6_signaling. IL10RB is the shared second chain of the IL-10,
  IL-22, IL-26 and type III interferon receptors. modules/il22_signaling.yaml models IL22RA1:IL10RB
  with JAK1 and TYK2; its receptor-assembly and JAK steps are IL-22-specific (they phosphorylate
  IL22RA1, not IL10RA), so no step of it is genuinely shared and none is module_ref'd. This module
  follows its conventions for the shared roles: JAK1 and TYK2 carry non-membrane spanning protein
  tyrosine kinase activity (GO:0004715) at cytosol/plasma membrane, and STAT3 carries DNA-binding
  transcription factor activity, RNA polymerase II-specific (GO:0000981). The one deliberate
  difference is IL10RB: il22_signaling gives it cytokine receptor activity (GO:0004896, from the
  PAINT node), whereas here it carries coreceptor activity (GO:0015026), the term of the IDA GOA row
  (PMID:16982608) and of the IL-10 GO-CAM, matching IL10RB's role as the low-affinity chain that only
  binds IL-10 after IL10RA has. modules/il6_signaling.yaml is IL-6/gp130-specific and exposes no
  shared step; it is referenced only for the SOCS3 contrast below. The generic STAT dimerization and
  nuclear import step and the STAT-dependent transcription step are included by module_ref to
  jak_stat_signaling#stat_dimerization_import and jak_stat_signaling#stat_transcription.

  SOCS3 (substrate and target-gene rule). RGD's text says IL-10-induced Socs3 inhibits JAK kinases
  and may terminate IL-10 effects. SOCS3 is indeed a STAT3 target induced by IL-10, but SOCS3
  docks on gp130 and inhibits IL-6 signalling, and in SOCS3-deficient macrophages IL-10 signalling
  is unchanged (PMID:12754507; PMID:31611251). Being an induced gene is not participation in
  IL-10 signalling, and SOCS3 does no work at the IL-10 receptor, so SOCS3 is recorded as an output
  of the transcription step in prose and is not a part. SOCS3 is not on RGD's human gene list for
  this pathway either.

  STAT1 and STAT5. IL-10 activates STAT1 in T cells and monocytes and STAT5 in some cells, but the
  IL10RA phosphotyrosines recruit STAT3 and not STAT1 or STAT5 (PMID:8910398), and STAT3 with JAK1 is
  required for the anti-inflammatory action (PMID:10347215). STAT1 (on RGD's list) is therefore an
  optional, accessory part; STAT5 is not modelled.

  Residue numbering. The two STAT3 docking tyrosines were mapped in the murine receptor (Tyr427 and
  Tyr477, in the YQKQ and YLKQ motifs). Human residue numbers are not asserted here because they were
  not verified against the human IL10RA sequence.

  Functions and their support. IL10 GO:0005125 cytokine activity (IDA; IL10 gene review core
  function), IL10RA GO:0004920 interleukin-10 receptor activity (IDA), IL10RB GO:0015026 coreceptor
  activity (IDA), JAK1 and TYK2 GO:0004715 (IDA; gene review core functions), STAT3 and STAT1
  GO:0000981 (IDA; gene review core functions). No curator-authored function without an experimental
  GOA row is used. IL10RA and IL10RB have no local gene review or UniProt file; their accessions were
  taken from UniProt REST. Participants are GENE_PRODUCT accessions; no PANTHER family or PTN ids are
  asserted.

  GO-CAM. gomodel:626b20c100000681 (IL10-mediated signaling pathway, Human) contains six of the seven
  members and its activities are pinned to the matching annotons. Two differences are recorded, not
  corrected: the model types STAT3 with the parent GO:0003700 where this module uses the RNA
  polymerase II-specific child GO:0000981, and the model has no causal edge from TYK2 to STAT3 (only
  JAK1 is upstream of STAT3), whereas the literature has both kinases phosphorylating the receptor.
  STAT1 is not in the model.
