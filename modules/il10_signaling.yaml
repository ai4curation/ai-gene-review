knowledge_gaps:
  - gap_statement: >-
      How the same activated STAT3 delivers an anti-inflammatory programme downstream of IL10RA but
      not downstream of gp130 is not fully explained: SOCS3 selectivity accounts for part of it,
      but the requirement for the serine-containing IL10RA C-terminal region and the STAT3
      cofactors that make the programme IL-10-specific remain unidentified.
    gap_kind:
      - BIOLOGY
