  notes: >-
    NEW module (YeastPathways crosswalk, 2026-10) generalising six YeastCyc
    frames (PWY3O-4109 isoleucine, PWY3O-4112 leucine, PWY3O-4105 valine,
    PWY3O-4115 phenylalanine, PWY3O-4108 tyrosine, PWY3O-214 tryptophan
    degradation) into one three-step pathway with the substrate class and enzyme
    isoform as variant axes. Methionine is degraded by the same enzymes to
    methionol but has no YeastCyc frame in this group and is not modelled as a
    separate variant. GO's dedicated Ehrlich pathway process terms are all
    obsolete, so concepts use GO:0009083 and GO:0009074 and leaves use the
    amino-acid-specific catabolic process terms. Gene corrections to YeastCyc:
    (1) THI3 is removed as a catalyst. It has no detectable decarboxylase
    activity (PMID:22904058) and acts as a regulator of thiamine metabolism; its
    early assignment as the main leucine decarboxylase (PMID:9341119) is
    superseded. (2) ARO10 is added to the valine frame and to the tyrosine
    frame, which lists no gene for 4.1.1.80-RXN. (3) PDC1/5/6 are added to the
    leucine frame, because Pdc isozymes decarboxylate 4-methyl-2-oxopentanoate
    (PMID:22904058, PMID:9546164). (4) HIS5 (histidinol-phosphate
    aminotransferase) is removed from phenylalanine transamination (RXN-10814);
    aro8 aro9 mutants show that Aro8/Aro9 carry aromatic transamination. (5)
    The oxidative fusel-acid branch (ALD3) is added; YeastCyc only models
    reduction. (6) BAT1 is mitochondrial, not cytosolic, and is kept as a minor,
    mainly biosynthetic contributor; BAT2 is the catabolic transaminase.
    GO-CAM disagreements (SGD models): BAT1/BAT2 are typed with the
    isoleucine-specific GO:0052656 in the leucine and valine models instead of
    GO:0004084; ARO9 is typed with the 2-oxoglutarate term GO:0008793 for a
    pyruvate-dependent reaction although Aro9 does not use 2-oxoglutarate (this
    module uses GO:0047312, GO:0080098 and GO:0047299); ARO8 and ARO9 tyrosine
    transamination are typed only as GO:0003674; ARO10 is typed with phenylpyruvate
    decarboxylase for the leucine 2-oxo acid; the tyrosine model gives PDC1/5/6
    but not ARO10 for 4-hydroxyphenylpyruvate decarboxylation; and BAT1 and ADH3
    are placed in the cytosol. The SGD models have no causal links. Excluded
    from the module: the mitochondrial branched-chain 2-oxo acid dehydrogenase
    route (not needed for fusel alcohol formation, PMID:9341119, PMID:9748245);
    amino acid uptake by Gap1 and Wap1/Agp1; the Aro80 transcriptional
    activator; and CHA1, the catabolic serine/threonine dehydratase, which is
    the catabolic counterpart of ILV1 rather than an Ehrlich enzyme. BAT1 and
    ARO8 are also members of the branched_chain_amino_acid_biosynthesis and
    phenylalanine_tyrosine_biosynthesis modules. Pyruvate decarboxylases and
    ADH1 are shared with alcoholic fermentation.
  knowledge_gaps:
    - gap_statement: >-
        The aldehyde dehydrogenase isozymes that oxidize the branched-chain and
        indole fusel aldehydes to fusel acids are not identified.
      boundary: >-
        ALD3 has been assigned only to phenylacetaldehyde oxidation; activity on
        the other fusel aldehydes is inferred from the acids found in culture
        supernatants.
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: >-
        Fusel acids are a major Ehrlich pathway end product under respiratory
        conditions, and the split between alcohol and acid formation is set at
        this step.
      resolution: >-
        Measure fusel acid formation from each amino acid in single and combined
        ald deletion mutants, and assay purified Ald isozymes with each fusel
        aldehyde.
