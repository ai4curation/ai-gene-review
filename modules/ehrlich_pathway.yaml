id: MODULE:ehrlich_pathway
title: Ehrlich pathway (amino acid catabolism to fusel alcohols and fusel acids)
description: >-
  Catabolic route by which yeasts and other fungi degrade the branched-chain
  amino acids (leucine, isoleucine, valine), the aromatic amino acids
  (phenylalanine, tyrosine, tryptophan) and methionine when these are used as
  nitrogen sources. Only the amino group is retained by the cell; the carbon
  skeleton is excreted. The pathway has three steps. A pyridoxal-phosphate
  aminotransferase first transfers the amino group to an acceptor 2-oxo acid
  (2-oxoglutarate for the branched-chain aminotransferases; pyruvate or
  phenylpyruvate for the inducible aromatic aminotransferase), giving the
  corresponding 2-oxo acid. A thiamine-diphosphate-dependent 2-oxo-acid
  decarboxylase then irreversibly converts the 2-oxo acid to an aldehyde with
  one carbon fewer; this is the first step specific to the pathway. Finally,
  depending on the redox state of the cell, the aldehyde is reduced by NADH
  alcohol dehydrogenases to a fusel alcohol (isoamyl alcohol, 2-methylbutanol,
  isobutanol, 2-phenylethanol, tyrosol, tryptophol) or oxidized by aldehyde
  dehydrogenases to a fusel acid. All three steps are carried out by sets of
  overlapping isozymes whose use depends on the amino acid, the carbon source
  and the growth stage. In budding yeast the aminotransferase and decarboxylase
  of the aromatic branch are co-induced by aromatic amino acids. Oxidative
  degradation of the 2-oxo acids by the mitochondrial branched-chain 2-oxo
  acid dehydrogenase complex, the catabolic route that dominates in animals,
  is outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009083
    title: branched-chain amino acid catabolic process
    statement: >-
      Module-level process concept for the branched-chain arm (leucine,
      isoleucine and valine catabolism).
  - source_id: GO:0009074
    title: aromatic amino acid catabolic process
    statement: >-
      Module-level process concept for the aromatic arm (phenylalanine,
      tyrosine and tryptophan catabolism).
  - source_id: GO:0000955
    title: obsolete amino acid catabolic process via Ehrlich pathway
    statement: >-
      GO formerly had dedicated Ehrlich pathway process terms (GO:0000947 to
      GO:0000955); all are now obsolete, so the module uses the
      amino-acid-specific catabolic process terms instead.
  - source_id: YeastPathways:PWY3O-4109
    title: isoleucine degradation (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists BAT1/BAT2 transamination, decarboxylation by PDC1, PDC5,
      PDC6, ARO10 and THI3, and reduction by ADH1-5 and SFA1. THI3 was not
      retained as a catalyst.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4109
  - source_id: YeastPathways:PWY3O-4112
    title: leucine degradation (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists BAT1/BAT2 transamination, decarboxylation of
      4-methyl-2-oxopentanoate by ARO10 and THI3, and reduction by ADH1-5 and
      SFA1. THI3 was not retained; PDC1/5/6 were added because they decarboxylate
      4-methyl-2-oxopentanoate.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4112
  - source_id: YeastPathways:PWY3O-4105
    title: valine degradation (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists BAT1/BAT2 transamination, decarboxylation of
      3-methyl-2-oxobutanoate by PDC1/5/6, and reduction by ADH1-5 and SFA1.
      All were retained; ARO10 was added as a secondary branched-chain
      decarboxylase.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4105
  - source_id: YeastPathways:PWY3O-4115
    title: phenylalanine degradation (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists phenylalanine transamination by ARO8 and HIS5 (with
      2-oxoglutarate) and by ARO9 (with pyruvate), phenylpyruvate
      decarboxylation by ARO10 and PDC1/5/6, and reduction by ADH1-5 and SFA1.
      HIS5 was not retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4115
  - source_id: YeastPathways:PWY3O-4108
    title: L-tyrosine degradation III (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists tyrosine transamination by ARO8 and ARO9 and reduction by
      ADH1-5, but gives no gene for 4-hydroxyphenylpyruvate decarboxylation
      (4.1.1.80-RXN). ARO10 was added for that step.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4108
  - source_id: YeastPathways:PWY3O-214
    title: tryptophan degradation (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists tryptophan transamination by ARO8 (2-oxoglutarate) and
      ARO9 (phenylpyruvate), indolepyruvate decarboxylation by ARO10 and
      PDC1/5/6, and reduction by ADH1-5 and SFA1. All were retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-214
  - source_id: PMID:18281432
    title: >-
      The Ehrlich pathway for fusel alcohol production: a century of research on
      Saccharomyces cerevisiae metabolism.
    statement: >-
      Review of the Ehrlich pathway: transamination, decarboxylation and then
      reduction or oxidation of the aldehyde, with the yeast isozymes for each
      step.
  - source_id: PMID:12902239
    title: Identification and characterization of phenylpyruvate decarboxylase genes in Saccharomyces cerevisiae.
    statement: >-
      Defines the three-step pathway with its oxidative alternative and
      identifies ARO10 as the physiologically relevant phenylpyruvate
      decarboxylase; THI3 is not itself an active decarboxylase.
    supporting_text: >-
      Catabolism of amino acids via the Ehrlich pathway involves transamination to the
      corresponding alpha-keto acids, followed by decarboxylation to an aldehyde and
      then reduction to an alcohol. Alternatively, the aldehyde may be oxidized to an
      acid.
  - source_id: PMID:12499363
    title: The catabolism of amino acids to long chain and complex alcohols in Saccharomyces cerevisiae.
    statement: >-
      Phenylpyruvate and indolepyruvate are decarboxylated by Pdc1, Pdc5, Pdc6
      or Aro10, and the final reduction can be done by any of Adh1-Adh5 or Sfa1.
    supporting_text: >-
      the final step of amino acid catabolism
      (conversion of an aldehyde to a long chain or complex alcohol) can be
      accomplished by any one of the ethanol dehydrogenases (Adh1p, Adh2p, Adh3p,
      Adh4p, Adh5p) or by Sfa1p (formaldehyde dehydrogenase.)
  - source_id: PMID:22904058
    title: Substrate specificity of thiamine pyrophosphate-dependent 2-oxo-acid decarboxylases in Saccharomyces cerevisiae.
    statement: >-
      Systematic comparison of the five candidate 2-oxo-acid decarboxylases;
      Thi3 has no activity, Aro10 has the highest affinity for phenylpyruvate
      and branched-chain 2-oxo acids.
    supporting_text: >-
      No decarboxylation activity was
      found for Thi3 with any of the substrates tested. Only Aro10 and Pdc5 catalyzed
      the decarboxylation of the aromatic substrate phenylpyruvate, with Aro10 showing
      superior kinetic properties.
  - source_id: PMID:15933030
    title: >-
      Physiological characterization of the ARO10-dependent,
      broad-substrate-specificity 2-oxo acid decarboxylase activity of
      Saccharomyces cerevisiae.
    statement: >-
      ARO10 is the only decarboxylase gene induced by phenylalanine, leucine or
      methionine as nitrogen source and confers broad-substrate 2-oxo-acid
      decarboxylase activity.
    supporting_text: >-
      only ARO10 was transcriptionally up-regulated when phenylalanine,
      leucine, or methionine was used as a nitrogen source compared to growth on
      ammonia, proline, and asparagine.
  - source_id: PMID:21501384
    title: Characterization of a thiamin diphosphate-dependent phenylpyruvate decarboxylase from Saccharomyces cerevisiae.
    statement: >-
      Purified Aro10 is an efficient aromatic 2-keto-acid decarboxylase; its in
      vitro substrate spectrum argues against a major role with branched-chain
      2-oxo acids (contrast PMID:22904058).
    supporting_text: >-
      The enzyme is shown to be an efficient aromatic
      2-keto acid decarboxylase, consistent with it playing a major in vivo role in
      phenylalanine, tryptophan and possibly also tyrosine catabolism.
  - source_id: PMID:9546164
    title: Pyruvate decarboxylase catalyzes decarboxylation of branched-chain 2-oxo acids but is not essential for fusel alcohol production by Saccharomyces cerevisiae.
    statement: >-
      Pdc1 and Pdc5 decarboxylate branched-chain 2-oxo acids, but a Pdc-negative
      strain still forms branched-chain fusel alcohols.
    supporting_text: >-
      Experiments with cell
      extracts from S. cerevisiae mutants expressing a single PDC gene demonstrated
      that both PDC1- and PDC5-encoded isoenzymes can decarboxylate branched-chain
      2-oxo acids.
  - source_id: PMID:9748245
    title: An investigation of the metabolism of valine to isobutyl alcohol in Saccharomyces cerevisiae.
    statement: >-
      Valine-derived 2-oxoisovalerate is decarboxylated by pyruvate
      decarboxylase; the branched-chain 2-oxo acid dehydrogenase route is not
      needed for isobutyl alcohol formation.
    supporting_text: >-
      any single isozyme of
      pyruvate decarboxylase is sufficient for the formation of isobutyl alcohol from
      valine.
  - source_id: PMID:9341119
    title: A 13C nuclear magnetic resonance investigation of the metabolism of leucine to isoamyl alcohol in Saccharomyces cerevisiae.
    statement: >-
      Leucine-derived 2-oxoisocaproate is converted to isoamyl alcohol by
      decarboxylation rather than through the branched-chain 2-oxo acid
      dehydrogenase. The paper attributed the decarboxylation mainly to YDL080c
      (THI3), which was later shown not to be an active decarboxylase
      (PMID:22904058).
  - source_id: PMID:10753893
    title: An investigation of the metabolism of isoleucine to active Amyl alcohol in Saccharomyces cerevisiae.
    statement: >-
      Any one of the Pdc1/Pdc5/Pdc6/YDL080c/YDR380w (ARO10) decarboxylase
      family is sufficient for isoleucine catabolism to 2-methylbutanol.
    supporting_text: >-
      Apparently, any one of
      this family of decarboxylases is sufficient to allow the catabolism of
      isoleucine to active amyl alcohol.
  - source_id: PMID:8702755
    title: Two yeast homologs of ECA39, a target for c-Myc regulation, code for cytosolic and mitochondrial branched-chain amino acid aminotransferases.
    statement: >-
      BAT1 (ECA39) and BAT2 (ECA40) encode the mitochondrial and cytosolic
      branched-chain aminotransferases; BAT2 is expressed mainly in stationary
      phase.
    supporting_text: >-
      ECA39 is highly expressed during log phase and
      is down-regulated during the stationary phase of growth, while ECA40 shows an
      inverse pattern of gene expression.
  - source_id: PMID:8798704
    title: Mitochondrial and cytosolic branched-chain amino acid transaminases from yeast, homologs of the myc oncogene-regulated Eca39 protein.
    statement: Bat1 is in the mitochondrial matrix and Bat2 in the cytosol.
    supporting_text: >-
      A highly homologous protein, Bat2p, of 376 amino acid residues was found
      in the cytosol.
  - source_id: PMID:10207060
    title: Transcriptional induction by aromatic amino acids in Saccharomyces cerevisiae.
    statement: >-
      ARO9 catalyses the first step of aromatic amino acid catabolism and is
      co-induced with ARO10 by the Aro80 activator.
    supporting_text: >-
      Aromatic aminotransferase II, product of the ARO9 gene, catalyzes the first step
      of tryptophan, phenylalanine, and tyrosine catabolism in Saccharomyces
      cerevisiae.
  - source_id: PMID:9491083
    title: Characterisation of Saccharomyces cerevisiae ARO8 and ARO9 genes encoding aromatic aminotransferases I and II reveals a new aminotransferase subfamily.
    statement: >-
      ARO8 and ARO9 encode aromatic aminotransferases I and II; ARO9 is induced
      by aromatic amino acids.
    supporting_text: >-
      ARO9 expression is induced when aromatic
      amino acids are present in the growth medium
  - source_id: PMID:6763508
    title: 'Tryptophan degradation in Saccharomyces cerevisiae: characterization of two aromatic aminotransferases.'
    statement: >-
      Biochemical characterization of aromatic aminotransferases I and II
      (cited by YeastPathways for amino-acceptor specificity).
  - source_id: PMID:23836015
    title: Metabolic engineering of Saccharomyces cerevisiae for the production of 2-phenylethanol via Ehrlich pathway.
    statement: >-
      Ald3 is mainly responsible for oxidizing phenylacetaldehyde, the
      oxidative (fusel acid) branch competing with 2-phenylethanol formation.
    supporting_text: >-
      We demonstrated that
      Ald3 is mainly responsible for phenylacetaldehyde oxidation, competing with 2-PE
      production.
