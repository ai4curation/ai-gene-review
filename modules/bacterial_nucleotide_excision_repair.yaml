id: MODULE:bacterial_nucleotide_excision_repair
title: Bacterial nucleotide-excision repair system
description: >-
  A reusable bacterial nucleotide-excision repair module in which UvrA and UvrB
  recognize bulky, helix-distorting DNA lesions, UvrC incises the damaged strand
  on both sides of the lesion, UvrD releases the damage-containing oligonucleotide,
  DNA polymerase I fills the resulting gap, and an NAD-dependent DNA ligase seals
  the nick. Mfd supplies an optional transcription-coupled entry route by removing
  lesion-stalled RNA polymerase and recruiting the Uvr machinery. Base-excision
  repair, mismatch repair, homologous-recombination repair, translesion synthesis,
  and eukaryotic XPD/TFIIH excision repair are outside this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006289
    title: nucleotide-excision repair
    statement: Defines the UvrABC lesion-excision and repair-synthesis process represented here.
  - source_id: GO:0009381
    title: excinuclease ABC activity
    statement: >-
      Defines the collective activity of the assembled UvrABC machinery; the
      individual UvrA, UvrB, and UvrC annotons below carry their own molecular
      functions rather than this complex-level term.
  - source_id: PMID:33480355
    title: Structural basis for transcription complex disruption by the Mfd translocase.
    statement: >-
      Structural work on E. coli Mfd establishes ATP-dependent removal of
      lesion-stalled RNA polymerase and recruitment of UvrABC in bacterial TCR.
    supporting_text: >-
      Mfd mediates TCR in bacteria by removing the stalled RNAP concealing the
      lesion and recruiting Uvr(A)BC.
  - source_id: RHEA:13065
    title: ATP hydrolysis reaction
    statement: Defines the ATPase chemistry used by UvrD and Mfd to remodel DNA repair intermediates.
  - source_id: RHEA:22508
    title: DNA-directed DNA polymerase reaction
    statement: Defines repair-gap filling by bacterial DNA polymerase I.
  - source_id: PANTHER:PTN000116141
    title: PAINT UvrD-family helicase node
    statement: >-
      The local PTHR11070 PAINT table assigns 3-prime-to-5-prime DNA helicase
      activity to this ancestral node using experimentally characterized UvrD/PcrA-family seeds.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-nucleotide-excision-repair__ppu03420-deep-research-openscientist.md
    title: OpenScientist PSEPK bacterial nucleotide-excision repair synthesis
    statement: >-
      Species-aware retrieval identifies a complete seven-role KT2440 NER relay
      and distinguishes three KEGG-bucket proteins that are not required core components.
notes: >-
  The module is species-neutral and represents both global-genome NER and the
  Mfd-dependent transcription-coupled entry route. Pseudomonas putida KT2440
  supplies a concrete representative for every role. Mfd is optional for the
  global-genome route. Cho-family alternative incision proteins and lineage-specific
  UvrA2 accessory paralogs are not universal requirements. PolA and LigA are shared
  with replication and other DNA-repair pathways. GO:0009381 describes the
  assembled UvrABC activity and is retained only as module-level evidence; each
  subunit leaf is represented by its distinguishable activity.
