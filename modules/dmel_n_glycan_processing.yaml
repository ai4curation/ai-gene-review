id: MODULE:dmel_n_glycan_processing
title: N-glycan trimming and processing in Drosophila melanogaster
description: >-
  After oligosaccharyltransferase transfers Glc3Man9GlcNAc2 to asparagine residues of nascent
  proteins, the N-glycan is trimmed in the endoplasmic reticulum and then remodelled in the
  Golgi apparatus. In the ER, glucosidase I (Gcs1) removes the outer glucose and the glucosidase
  II heterodimer (Gcs2alpha catalytic and Gcs2beta regulatory subunits) removes the two inner
  glucoses; these steps also control entry into and exit from the calnexin-calreticulin folding
  cycle. Class I alpha-1,2-mannosidases trim mannoses in the ER and cis-Golgi. In the Golgi,
  GlcNAc transferase I (Mgat1) adds GlcNAc to the alpha-1,3 arm, which allows alpha-mannosidase
  II to remove two further mannoses. In insects most N-glycans are then converted to paucimannose
  glycans by the Golgi beta-N-acetylglucosaminidase Fused lobes (fdl), while a smaller fraction
  is extended to hybrid and complex glycans by GlcNAc transferase II, core fucosyltransferases,
  galactosyl-, GalNAc-, glucuronyl- and sialyltransferases.
status: DRAFT
scope: CONCRETE
