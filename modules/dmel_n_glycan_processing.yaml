notes: >-
  Boundary. The module starts after transfer of the lipid-linked oligosaccharide to protein
  (oligosaccharyltransferase is outside the module) and covers ER trimming, Golgi trimming
  and Golgi diversification, the three FlyBase N-glycan processing groups plus the glucosidase
  II complex group. Core fucosylation by FutA and Fut6 needs the GlcNAc added by Mgat1 and
  can occur before or after mannosidase II trimming, so the order within the diversification
  part is shown only where it is clear. GlcAT-P and GlcAT-S are glucuronyltransferases that
  act on N-glycans and glycolipids (GlcAT-P is also in the O-GalNAc branch of dmel_protein_o_glycosylation);
  GalT1 is a beta-1,3-galactosyltransferase. No molecular function is assigned to the regulatory
  Gcs2beta subunit or to alpha-Man-IIb, whose in vitro activity differs from that of classical
  mannosidase II. Molecular functions of Gcs1, alpha-Man-Ib and Mgat1 follow orthology; the
  others are supported by assays of the fly enzymes in GO. FlyBase groups realized by this
  module: PGERT (FBgg0002122), PGGOT (FBgg0002123), PGGOD (FBgg0002124), GLU2ABII (FBgg0002131).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_n_glycan_processing.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
