id: MODULE:intraflagellar_transport_core
title: Intraflagellar transport core across eukaryotes
description: 'Cilia and flagella are built and maintained by intraflagellar transport (IFT): trains of the IFT-B
  and IFT-A complexes are carried from the basal body to the ciliary tip by kinesin-2 and back by dynein-2, bringing
  axonemal precursors such as tubulin in and returning turnover products and signalling receptors. IFT goes back
  to the last eukaryotic common ancestor and is kept in almost every lineage that builds cilia, while lineages that
  have lost cilia have lost it. This module is the eukaryote-wide core of the IFT machinery, written so that it
  can be evaluated in a new genome.'
status: DRAFT
scope: CONCRETE
notes: 'Eukaryota scope, with human representatives. Read as a satisfiability rule, a genome needs nine IFT-B subunits
  (IFT52, IFT46, IFT81, IFT74, IFT70, IFT172, IFT80, IFT57, IFT38), four IFT-A subunits (IFT140, IFT144, IFT122,
  IFT139) and the dynein-2 intermediate chain DYNC2I2. Those are the subunits whose selectors have members in all
  eleven ciliated lineages checked in PANTHER''s release-19 classification files (human, Nematostella, Monosiga,
  Batrachochytrium, Chlamydomonas, Trypanosoma, Leishmania, Giardia, Trichomonas, Paramecium, Phytophthora) and
  in none of the seven non-ciliated ones (Arabidopsis, rice, budding and fission yeast, Neurospora, Dictyostelium,
  Entamoeba). IFT88, IFT56, IFT54, IFT20, the dynein-2 heavy and light intermediate chains and kinesin-2 are optional,
  each because its selector misses one or two ciliated lineages. Every cited PAINT node is placed at Eukaryota except
  PTN000404360 (no taxon in the PAINT rows), and their IBD seeds include Trypanosoma and Giardia proteins. Three
  ciliated lineages fail the rule as written: Plasmodium, whose files list no IFT subunit; Thalassiosira, which
  keeps IFT88, IFT52, IFT81, IFT74 and IFT70 but no IFT-B2 or IFT-A subunit; and the moss Physcomitrium, which lacks
  IFT52, IFT81, IFT74, IFT70, IFT38, IFT140, IFT144 and DYNC2I2 in the files. The first two build flagella only
  in gametes; whether the moss gaps are losses or classification gaps is not checked. Not modelled: IFT121/WDR35
  and IFT43 (subfamilies cover too few lineages), IFT27, IFT25 and IFT22, KAP3 (its subfamily also holds an Entamoeba
  protein), the BBSome and the transition zone. Each location is the first of cilium, axoneme, ciliary basal body,
  ciliary base, ciliary plasm and motile cilium that the cited nodes place; most cited nodes also place the IFT-B,
  IFT-A or cytoplasmic dynein complex, which is not a location.'
