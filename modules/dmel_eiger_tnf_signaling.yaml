id: MODULE:dmel_eiger_tnf_signaling
title: Eiger (TNF) signaling pathway in Drosophila melanogaster
description: >-
  Eiger is the single Drosophila member of the tumor necrosis factor superfamily. It is a
  type II transmembrane protein that can be released as a soluble ligand by the metalloprotease
  Tace. Eiger binds the TNF receptors Grindelwald and Wengen, which signal through Traf proteins
  and the Tak1-Tab2 kinase complex to the JNK kinase kinases Hemipterous and Mkk4 and the
  JNK Basket. The Ste20-family kinase Misshapen acts upstream in the JNK cascade. JNK activation
  by Eiger induces apoptosis and cell elimination in development and tumour suppression, and
  also contributes to tissue growth, regeneration, pain sensitization and immune responses.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001560
  title: 'FlyBase gene group TNF: Tnfalpha-eiger signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 23 D. melanogaster genes as tnfalpha-eiger signaling
    pathway (TNF); this module models that group.
- source_id: GO:0033209
  title: tumor necrosis factor-mediated signaling pathway
  statement: >-
    GO term grounding the module as tumor necrosis factor-mediated signaling pathway.
notes: >-
  Boundary. The module stops at the JNK Basket; the AP-1 transcription factors (Jra, Kay)
  and JNK target genes are not FlyBase members of this group and are left out. Licorne (MKK3)
  belongs to the p38 branch and is included because FlyBase lists it among the core components.
  Traf6 is also in the FlyBase positive regulator set; Traf4 is not a FlyBase member, although
  it has been implicated in Eiger signaling. The JNK phosphatase Puckered and other regulators
  are FlyBase regulator sets and not parts. FlyBase groups realized by this module: TNF (FBgg0001560).
  Subgroups folded into it: TNF-C. FlyBase also curates regulator sets for this pathway, which
  are context and not modelled as parts: TNF-N (negative regulators of tnfalpha-eiger signaling
  pathway, 5 genes); TNF-P (positive regulators of tnfalpha-eiger signaling pathway, 7 genes).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_eiger_tnf_signaling.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
