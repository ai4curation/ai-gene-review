id: MODULE:protocatechuate_ortho_cleavage
title: Protocatechuate ortho-cleavage branch
description: >-
  Reusable bacterial beta-ketoadipate-pathway branch that converts
  protocatechuate to 3-oxoadipate. PcaG/PcaH perform intradiol ring cleavage,
  followed by PcaB cycloisomerization, PcaC decarboxylation, and PcaD
  enol-lactone hydrolysis. Activation and cleavage of 3-oxoadipate by the shared
  lower beta-ketoadipate pathway are outside this branch.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0019618
    title: protocatechuate catabolic process, ortho-cleavage
    statement: >-
      GO:0019618 specifically grounds protocatechuate degradation through the
      ortho-cleavage branch of the beta-ketoadipate route.
  - source_id: KEGG:ppu00362
    title: Pseudomonas putida KT2440 benzoate degradation
    statement: >-
      KEGG ppu00362 includes the KT2440 pca genes for the protocatechuate
      ortho-cleavage branch.
  - source_id: file:PSEPK/pcaG/pcaG-ai-review.yaml
    title: pcaG gene review (PSEPK)
    statement: >-
      The alpha-subunit grounding (UniProtKB:Q88E13, GO:0018578 contributed to
      as part of the heteromultimer, GO:0008199 ferric iron binding) matches
      the completed PSEPK pcaG review.
  - source_id: file:PSEPK/pcaH/pcaH-ai-review.yaml
    title: pcaH gene review (PSEPK)
    statement: >-
      The beta-subunit grounding (UniProtKB:Q88E12, GO:0018578 contributed to
      as part of the heteromultimer, GO:0008199 ferric iron binding) matches
      the completed PSEPK pcaH review.
  - source_id: file:PSEPK/pcaB/pcaB-ai-review.yaml
    title: pcaB gene review (PSEPK)
    statement: >-
      The cycloisomerase grounding (UniProtKB:Q88N37, GO:0047472) matches the
      completed PSEPK pcaB review.
  - source_id: file:PSEPK/pcaC/pcaC-ai-review.yaml
    title: pcaC gene review (PSEPK)
    statement: >-
      The decarboxylase grounding (UniProtKB:Q88N35, GO:0047575) matches the
      completed PSEPK pcaC review.
  - source_id: file:PSEPK/pcaD/pcaD-ai-review.yaml
    title: pcaD gene review (PSEPK)
    statement: >-
      The enol-lactonase grounding (UniProtKB:Q88N36, GO:0047570) matches the
      completed PSEPK pcaD review. That review also records pcaDE as supplying
      the shared enol-lactonase function for both the cat and pca branches;
      see the boundary note below.
notes: >-
  The branch starts at protocatechuate and stops at 3-oxoadipate. PcaK-mediated
  aromatic-acid uptake and upper pathways that generate protocatechuate are
  upstream. PcaI/PcaJ/PcaF convert 3-oxoadipate to central metabolites and are
  modeled in a separate shared lower-pathway module.


  OPEN BOUNDARY QUESTION (raised in review, not yet resolved): part 4 (PcaD
  enol-lactone hydrolysis) may not belong in this branch. The curated pcaD
  review records pcaDE as supplying the shared enol-lactonase function for
  both the cat and pca branches, and the sibling module
  catechol_ortho_cleavage.yaml deliberately stops at beta-ketoadipate
  enol-lactone, deferring the hydrolase to "the shared lower beta-ketoadipate"
  module. That shared module does not exist yet, so the catechol module's
  terminal product currently has no consumer anywhere, while this module
  claims the hydrolase for the pca branch alone. The two candidate
  resolutions - create the shared lower-pathway module and move PcaD into it,
  or keep PcaD here and accept the asymmetry - are a curation decision for a
  maintainer rather than a mechanical fix.
module:
  id: protocatechuate_ortho_cleavage
  label: Protocatechuate to 3-oxoadipate
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: protocatechuate catabolic process, ortho-cleavage
      term:
        id: GO:0019618
        label: protocatechuate catabolic process, ortho-cleavage
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: protocatechuate intradiol ring cleavage
      node:
        id: pcagh_ring_cleavage
        label: PcaGH protocatechuate 3,4-dioxygenase
        module_type: PROTEIN_COMPLEX
        description: >-
          The alpha and beta subunits assemble the non-heme ferric intradiol
          dioxygenase that opens protocatechuate to 3-carboxy-cis,cis-muconate.
        concepts:
          - preferred_term: protocatechuate 3,4-dioxygenase activity
            term:
              id: GO:0018578
              label: protocatechuate 3,4-dioxygenase activity
        annotons:
          - id: pcag_alpha_subunit
            label: PcaG alpha subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: protocatechuate 3,4-dioxygenase alpha-subunit family
                term:
                  id: NCBIfam:TIGR02423
                  label: protocatechuate 3,4-dioxygenase subunit alpha
                description: >-
                  Equivalog-scoped family for the alpha subunit specifically.
                  The PANTHER assignment for PcaG (PTHR33711, "DIOXYGENASE,
                  PUTATIVE (AFU_ORTHOLOGUE AFUA_2G02910)-RELATED") is the whole
                  intradiol ring-cleavage superfamily and does not distinguish
                  the alpha from the beta subunit.
                representative_members:
                  - preferred_term: PSEPK PcaG exemplar
                    term:
                      id: UniProtKB:Q88E13
                      label: Protocatechuate 3,4-dioxygenase alpha chain
            role_description: >-
              Alpha component of the heteromultimeric ring-cleavage enzyme;
              contributes to, but does not independently enable, the reaction.
          - id: pcah_beta_subunit
            label: PcaH beta subunit
            participant:
              selector_type: FAMILY
              family:
                preferred_term: protocatechuate 3,4-dioxygenase beta-subunit family
                term:
                  id: NCBIfam:TIGR02422
                  label: protocatechuate 3,4-dioxygenase subunit beta
                description: >-
                  Equivalog-scoped family for the beta subunit specifically.
                  PcaG and PcaH share the same PANTHER family (PTHR33711), so
                  a PANTHER selector cannot express the alpha/beta distinction
                  this annoton pair depends on.
                representative_members:
                  - preferred_term: PSEPK PcaH exemplar
                    term:
                      id: UniProtKB:Q88E12
                      label: Protocatechuate 3,4-dioxygenase beta chain
            role_description: >-
              Beta component of the heteromultimeric ring-cleavage enzyme;
              contributes to, but does not independently enable, the reaction.
    - order: 2
      role: 3-carboxymuconate cycloisomerization
      node:
        id: pcab_cycloisomerization
        label: PcaB carboxymuconate cycloisomerization
        module_type: REACTION
        annotons:
          - id: pcab_cycloisomerase
            label: PcaB cycloisomerase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: 3-carboxy-cis,cis-muconate cycloisomerase (PcaB) family
                term:
                  id: NCBIfam:TIGR02426
                  label: 3-carboxy-cis,cis-muconate cycloisomerase
                description: >-
                  Equivalog family, exactly co-extensive with the GO:0047472
                  activity below. PcaB's PANTHER assignment (PTHR43172) is the
                  adenylosuccinate lyase / fumarate lyase superfamily, which is
                  far broader than this reaction.
                representative_members:
                  - preferred_term: PSEPK PcaB exemplar
                    term:
                      id: UniProtKB:Q88N37
                      label: 3-carboxy-cis,cis-muconate cycloisomerase
            function:
              preferred_term: 3-carboxy-cis,cis-muconate cycloisomerase activity
              term:
                id: GO:0047472
                label: 3-carboxy-cis,cis-muconate cycloisomerase activity
            role_description: Forms 4-carboxymuconolactone from the ring-cleavage product.
    - order: 3
      role: 4-carboxymuconolactone decarboxylation
      node:
        id: pcac_decarboxylation
        label: PcaC carboxymuconolactone decarboxylation
        module_type: REACTION
        annotons:
          - id: pcac_decarboxylase
            label: PcaC decarboxylase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: 4-carboxymuconolactone decarboxylase (PcaC) family
                term:
                  id: NCBIfam:TIGR02425
                  label: 4-carboxymuconolactone decarboxylase
                description: >-
                  Equivalog family, exactly co-extensive with the GO:0047575
                  activity below. PcaC's PANTHER assignment (PTHR33570,
                  "4-CARBOXYMUCONOLACTONE DECARBOXYLASE FAMILY PROTEIN") also
                  covers the NDH-1 regulator members of the CMD-like fold.
                representative_members:
                  - preferred_term: PSEPK PcaC exemplar
                    term:
                      id: UniProtKB:Q88N35
                      label: 4-carboxymuconolactone decarboxylase
            function:
              preferred_term: 4-carboxymuconolactone decarboxylase activity
              term:
                id: GO:0047575
                label: 4-carboxymuconolactone decarboxylase activity
            role_description: Produces 3-oxoadipate enol-lactone.
    - order: 4
      role: 3-oxoadipate enol-lactone hydrolysis
      node:
        id: pcad_enollactone_hydrolysis
        label: PcaD enol-lactone hydrolysis
        module_type: REACTION
        annotons:
          - id: pcad_enollactonase
            label: PcaD enol-lactonase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: 3-oxoadipate enol-lactonase (PcaD) family
                term:
                  id: NCBIfam:TIGR02427
                  label: 3-oxoadipate enol-lactonase
                description: >-
                  Equivalog family, exactly co-extensive with the GO:0047570
                  activity below. PcaD's PANTHER assignment (PTHR43433,
                  "HYDROLASE, ALPHA/BETA FOLD FAMILY PROTEIN") is the whole
                  alpha/beta-hydrolase superfamily.
                representative_members:
                  - preferred_term: PSEPK PcaD exemplar
                    term:
                      id: UniProtKB:Q88N36
                      label: 3-oxoadipate enol-lactonase 2
            function:
              preferred_term: 3-oxoadipate enol-lactonase activity
              term:
                id: GO:0047570
                label: 3-oxoadipate enol-lactonase activity
            role_description: Hydrolyzes the enol-lactone to 3-oxoadipate.
  connections:
    - source: pcagh_ring_cleavage
      target: pcab_cycloisomerization
      connection_type: PROVIDES_INPUT_FOR
    - source: pcab_cycloisomerization
      target: pcac_decarboxylation
      connection_type: PROVIDES_INPUT_FOR
    - source: pcac_decarboxylation
      target: pcad_enollactone_hydrolysis
      connection_type: PROVIDES_INPUT_FOR
