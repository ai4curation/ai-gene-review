id: MODULE:protocatechuate_ortho_cleavage
title: Protocatechuate ortho-cleavage branch
description: >-
  Reusable bacterial beta-ketoadipate-pathway branch that converts
  protocatechuate to 3-oxoadipate. PcaG/PcaH perform intradiol ring cleavage,
  followed by PcaB cycloisomerization, PcaC decarboxylation, and PcaD
  enol-lactone hydrolysis. Activation and cleavage of 3-oxoadipate by the shared
  lower beta-ketoadipate pathway are outside this branch.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0019618
    title: protocatechuate catabolic process, ortho-cleavage
    statement: >-
      GO:0019618 specifically grounds protocatechuate degradation through the
      ortho-cleavage branch of the beta-ketoadipate route.
  - source_id: KEGG:ppu00362
    title: Pseudomonas putida KT2440 benzoate degradation
    statement: >-
      KEGG ppu00362 includes the KT2440 pca genes for the protocatechuate
      ortho-cleavage branch.
notes: >-
  The branch starts at protocatechuate and stops at 3-oxoadipate. PcaK-mediated
  aromatic-acid uptake and upper pathways that generate protocatechuate are
  upstream. PcaI/PcaJ/PcaF convert 3-oxoadipate to central metabolites and are
  modeled in a separate shared lower-pathway module.
