id: MODULE:lysosome_related_organelle_lifecycle
title: Lysosome-related organelle lifecycle
description: Lysosome-related organelles are specialised compartments of particular animal cell types, such
  as melanosomes in pigment cells, dense granules in platelets, lytic granules in cytotoxic lymphocytes and
  gut granules in nematode intestinal cells. They arise from endosomes, coexist with conventional lysosomes,
  and are often acidic and secretory. Their membrane proteins are sorted from endosomes by AP-3 and BLOC-1
  and directed to the forming organelle by the Rab32/38 GTPases and their exchange factor; the organelles
  then mature, store or synthesise their specialised content, and in many cell types are moved to the cell
  periphery and secreted. This umbrella module composes the modules for those stages by reference.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: file:modules/lysosome_related_organelle_biogenesis.yaml
  title: Lysosome-related organelle biogenesis by the Rab32/38 pathway
  statement: AP-3, BLOC-1, Rab32/38 and its exchange factor (BLOC-3 or the nematode GLO-3), with BLOC-2 optional.
- source_id: PMID:23247405
  title: Cell type-specific Rab32 and Rab38 cooperate with the ubiquitous lysosome biogenesis machinery to synthesize
    specialized lysosome-related organelles.
  statement: Lysosome-related organelles are specialised compartments that coexist with conventional lysosomes.
  supporting_text: Lysosome-related organelles (LROs) exist in specialized cells to serve specific functions
    and typically co-exist with conventional lysosomes.
- source_id: PMID:25183830
  title: The biogenesis of lysosomes and lysosome-related organelles.
  statement: Review of lysosome and lysosome-related organelle biogenesis.
  supporting_text: The biogenesis of lysosomes and lysosome-related organelles is discussed, taking into
    account their dynamic nature and multiple roles.
notes: 'Organelle lifecycle umbrella (see projects/ORGANELLE_LIFECYCLES.md); stage roles follow the shared
  skeleton. Read as a satisfiability rule, the umbrella is satisfied when lysosome_related_organelle_biogenesis
  is. Its context is Metazoa because the organelles are characterised in animals; the Rab32/38 pathway itself
  is older (see that module''s notes). Acidification by the V-ATPase is optional: many but not all of these
  organelles are acidic. The Drosophila compendium dmel_bloc_borc_complexes is optional and descriptive. Not
  yet modelled: organelle-specific content and maturation, Rab27- and myosin-dependent transport and secretion,
  and turnover.'
