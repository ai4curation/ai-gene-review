id: MODULE:carnitine_shuttle
title: Carnitine acyltransferase shuttle (mitochondrial import of acyl and acetyl units)
description: >-
  The carnitine shuttle moves activated acyl groups across membranes that are
  impermeable to acyl-CoA. A carnitine acyltransferase on the donor side
  transfers the acyl group from CoA to L-carnitine; the resulting
  acylcarnitine is carried across the mitochondrial inner membrane by a
  mitochondrial-carrier-family carnitine/acylcarnitine translocase in exchange
  for free carnitine; and a matrix carnitine acyltransferase reverses the
  transfer, regenerating acyl-CoA and releasing carnitine for recycling. The
  same chemistry serves different cargo in different lineages. In animals the
  shuttle imports long-chain fatty acids for mitochondrial beta-oxidation:
  carnitine palmitoyltransferase 1 on the outer membrane catalyses the
  committed, malonyl-CoA-inhibited step and carnitine palmitoyltransferase 2
  on the matrix side of the inner membrane regenerates long-chain acyl-CoA.
  In fungi such as budding yeast, where beta-oxidation is peroxisomal, the
  shuttle carries acetyl units: carnitine acetyltransferases in the
  peroxisome, cytosol and at the mitochondrial outer membrane form
  acetylcarnitine from acetyl-CoA produced by beta-oxidation or by cytosolic
  acetate and ethanol metabolism, and the mitochondrial isoform regenerates
  acetyl-CoA in the matrix for the tricarboxylic acid cycle. Cells take up
  carnitine through a plasma-membrane transporter; budding yeast cannot make
  carnitine and depends on uptake. Inherited defects of the animal components
  (SLC22A5, CPT1A, SLC25A20, CPT2) cause fatty-acid-oxidation disorders.
status: DRAFT
evidence:
  - source_id: YeastPathways:PWY3O-4
    title: carnitine shuttle (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4
    statement: >-
      YeastCyc lists CARNITINE-O-ACETYLTRANSFERASE-RXN (CAT2, YAT1, YAT2) and
      the reverse matrix reaction RXN3O-37 (CAT2). The pathway comment names
      Crc1p as the translocase, but CRC1 is not attached to any reaction; it
      and the plasma-membrane carnitine transporter AGP2 were added.
  - source_id: GO:0006853
    title: carnitine shuttle
    statement: Module-level process for carnitine-dependent acyl transfer across mitochondrial membranes.
  - source_id: Reactome:R-HSA-200425
    title: Carnitine shuttle
    statement: >-
      Step order and reaction directions of the long-chain branch follow the
      human Reactome "Carnitine shuttle" pathway (R-HSA-200425): R-HSA-165026
      (SLC22A5 uptake), R-HSA-200406 (CPT1A), R-HSA-200424 (SLC25A20 antiport)
      and R-HSA-200410 (CPT2).
  - source_id: PMID:20889721
    title: Intracellular acetyl unit transport in fungal carbon metabolism.
    statement: >-
      In fungi, carnitine acetyltransferases exchange the CoA of acetyl-CoA for
      carnitine so that acetylcarnitine can move between compartments; a
      citrate synthase-dependent route is the alternative.
  - source_id: PMID:10545096
    title: Molecular characterization of carnitine-dependent transport of acetyl-CoA from peroxisomes to mitochondria in Saccharomyces cerevisiae and identification of a plasma membrane carnitine transporter, Agp2p.
    statement: >-
      Carnitine-dependent transport of peroxisomal acetyl-CoA to mitochondria
      requires CAT2, the translocase YOR100C/CRC1 and the plasma-membrane
      carnitine transporter AGP2.
  - source_id: PMID:10622748
    title: Identification of the mitochondrial carnitine carrier in Saccharomyces cerevisiae.
    statement: Reconstituted Crc1p transports carnitine, acetylcarnitine and propionylcarnitine, and much less medium- and long-chain acylcarnitines.
  - source_id: PMID:7628448
    title: Peroxisomal and mitochondrial carnitine acetyltransferases of Saccharomyces cerevisiae are encoded by a single gene.
    statement: One gene (YCAT/CAT2) encodes both the mitochondrial and the peroxisomal carnitine acetyltransferase, via alternative transcript starts.
  - source_id: PMID:7628449
    title: The membrane of peroxisomes in Saccharomyces cerevisiae is impermeable to NAD(H) and acetyl-CoA under in vivo conditions.
    statement: The peroxisomal membrane is impermeable to acetyl-CoA in vivo; acetyl units leave via carnitine acetyltransferase or the citrate synthase route.
  - source_id: PMID:11329169
    title: 'Carnitine-dependent metabolic activities in Saccharomyces cerevisiae: three carnitine acetyltransferases are essential in a carnitine-dependent strain.'
    statement: >-
      CAT2 (peroxisomal and mitochondrial), YAT1 (presumably outer
      mitochondrial membrane) and YAT2 are all essential for growth on
      non-fermentable carbon sources in a cit2 strain.
  - source_id: PMID:8262985
    title: The ethanol-inducible YAT1 gene from yeast encodes a presumptive mitochondrial outer carnitine acetyltransferase.
    statement: YAT1 is ethanol/acetate-induced and binds mitochondria in a protease-sensitive location, consistent with an outer-membrane carnitine acetyltransferase.
  - source_id: PMID:18427809
    title: 'Carnitine and carnitine acetyltransferases in the yeast Saccharomyces cerevisiae: a role for carnitine in stress protection.'
    statement: Overexpression of single CAT genes does not cross-complement, suggesting specific roles for each enzyme.
  - source_id: PMID:27143389
    title: Requirements for Carnitine Shuttle-Mediated Translocation of Mitochondrial Acetyl Moieties to the Yeast Cytosol.
    statement: >-
      Fatty-acid-grown yeast uses the shuttle to import acetyl units into
      mitochondria; export to the cytosol does not normally occur in vivo but
      can be enabled by mutations including in YAT2.
  - source_id: file:yeast/CAT2/CAT2-ai-review.yaml
    title: CAT2 gene review (S. cerevisiae)
    statement: Core function GO:0004092 carnitine O-acetyltransferase activity in mitochondria and peroxisomes.
  - source_id: file:human/SLC22A5/SLC22A5-ai-review.yaml
    title: SLC22A5 gene review (human)
    statement: The plasma-membrane carnitine-uptake step (UniProtKB:O76082, GO:0015226) matches the completed human SLC22A5/OCTN2 review.
  - source_id: file:human/CPT1A/CPT1A-ai-review.yaml
    title: CPT1A gene review (human)
    statement: The CPT1 step grounding (UniProtKB:P50416, GO:0004095, mitochondrial outer membrane) matches the completed human CPT1A review.
  - source_id: file:human/SLC25A20/SLC25A20-ai-review.yaml
    title: SLC25A20 gene review (human)
    statement: The translocase step (UniProtKB:O43772, GO:0015227, inner membrane) matches the completed human SLC25A20 review.
  - source_id: file:human/CPT2/CPT2-ai-review.yaml
    title: CPT2 gene review (human)
    statement: The CPT2 step grounding (UniProtKB:P23786, GO:0004095, inner membrane) matches the completed human CPT2 review.
module:
  id: carnitine_shuttle
  label: Carnitine acyltransferase shuttle
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: carnitine shuttle
      term:
        id: GO:0006853
        label: carnitine shuttle
      description: >-
        Carnitine-dependent transfer of acyl (animals: long-chain fatty acyl;
        fungi: mainly acetyl) groups into the mitochondrial matrix.
  context:
    taxa:
      - preferred_term: Eukaryota
        term:
          id: NCBITaxon:2759
          label: Eukaryota
        description: Long-chain acyl cargo in animals; acetyl cargo in fungi.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-4
      title: 'carnitine shuttle - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion with CAT2, YAT1 and YAT2 enabling GO:0004092 in cytosol
        and CAT2 enabling the reverse matrix reaction (no location), part of
        GO:0006853. CRC1 and AGP2 are absent, and the peroxisomal and
        mitochondrial-outer-membrane locations are not represented.
  parts:
    - order: 1
      role: cellular carnitine uptake (supplies the carnitine pool)
      node:
        id: slc22a5_step
        label: L-carnitine import across the plasma membrane
        module_type: TRANSPORT_STEP
        variant_sets:
          - id: carnitine_uptake_variants
            label: Plasma-membrane carnitine transporter
            axis: transporter family (lineage)
            selection: EXACTLY_ONE
            variants:
              - id: octn2_uptake_variant
                label: Na+-dependent OCTN carnitine transporter (animals)
                module_type: TRANSPORT_STEP
                annotons:
                  - id: slc22a5_activity
                    label: "SLC22A5/OCTN2: Na+-dependent carnitine transporter"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: OCTN2/SLC22A5 carnitine transporter subfamily
                        term:
                          id: PANTHER:PTHR24064:SF283
                          label: ORGANIC CATION_CARNITINE TRANSPORTER 2
                        representative_members:
                          - preferred_term: SLC22A5 / OCTN2 (human)
                            term:
                              id: UniProtKB:O76082
                              label: Organic cation/carnitine transporter 2
                    function:
                      preferred_term: carnitine transmembrane transporter activity
                      term:
                        id: GO:0015226
                        label: carnitine transmembrane transporter activity
                      substrates:
                        - preferred_term: L-carnitine (extracellular)
                        - preferred_term: sodium ion (cotransported)
                      products:
                        - preferred_term: L-carnitine (cytosol)
                      evidence:
                        - source_id: Reactome:R-HSA-165026
                          statement: "OCTN2 / SLC22A5 transports CAR from extracellular space to cytosol (human Reactome reaction)"
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      High-affinity, sodium-dependent plasma-membrane carnitine
                      importer; also mediates renal carnitine reabsorption.
                      Deficiency causes primary (systemic) carnitine deficiency.
              - id: agp2_uptake_variant
                label: AGP2-dependent carnitine uptake (budding yeast)
                module_type: TRANSPORT_STEP
                annotons:
                  - id: agp2_activity
                    label: "AGP2: plasma-membrane carnitine uptake regulator"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: AGP2-type amino acid permease-family carnitine uptake regulator
                        description: >-
                          No PANTHER id: AGP2 is in the broad amino acid permease
                          family PTHR43341, whose members are mostly not
                          carnitine transporters.
                        representative_members:
                          - preferred_term: AGP2 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P38090
                              label: General amino acid permease AGP2
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Required for efficient carnitine uptake in yeast, which
                      cannot synthesise carnitine.
                    notes: >-
                      Disputed activity. No direct transporter activity is asserted
                      here: the AGP2 gene review asserts no molecular function;
                      GOA has only IMP "positive regulation of carnitine
                      transmembrane transport"; and Aouida et al. 2013
                      (PMID:23755272, full text) show that Agp2 sustains
                      expression of the HNM1, DUR3 and SAM3 permeases and
                      propose it acts mainly as a regulator or transceptor. HNM1
                      carries much of the carnitine uptake.
                    evidence:
                      - source_id: PMID:23755272
                        statement: Agp2 is proposed to regulate expression of other carnitine and polyamine permeases rather than transport them itself.
                        supporting_text: >-
                          we also demonstrate for the first time that in cells lacking a
                          functional AGP2 gene nearly 172 genes are downregulated as compared
                          to the parent
    - order: 2
      role: acyl transfer from CoA to carnitine (donor side)
      node:
        id: cpt1_step
        label: acyl-CoA + L-carnitine to acylcarnitine + CoA
        module_type: REACTION
        variant_sets:
          - id: donor_side_cargo_variants
            label: Donor-side carnitine acyltransferase by cargo
            axis: acyl cargo (long-chain acyl vs acetyl) / lineage
            selection: ONE_OR_MORE
            variants:
              - id: cpt1_long_chain_variant
                label: CPT1 long-chain acyl transfer at the mitochondrial outer membrane (animals)
                module_type: REACTION
                annotons:
                  - id: cpt1a_activity
                    label: "CPT1A: carnitine palmitoyltransferase 1 (liver)"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: CPT1A carnitine O-palmitoyltransferase subfamily
                        term:
                          id: PANTHER:PTHR22589:SF74
                          label: CARNITINE O-PALMITOYLTRANSFERASE 1, LIVER ISOFORM
                        representative_members:
                          - preferred_term: CPT1A (human, liver isoform)
                            term:
                              id: UniProtKB:P50416
                              label: Carnitine O-palmitoyltransferase 1, liver isoform
                    function:
                      preferred_term: carnitine O-palmitoyltransferase activity
                      term:
                        id: GO:0004095
                        label: carnitine O-palmitoyltransferase activity
                      substrates:
                        - preferred_term: long-chain acyl-CoA
                        - preferred_term: L-carnitine
                      products:
                        - preferred_term: long-chain O-acylcarnitine
                        - preferred_term: coenzyme A
                      evidence:
                        - source_id: EC:2.3.1.21
                          statement: carnitine O-palmitoyltransferase
                        - source_id: Reactome:R-HSA-200406
                          statement: "CPT1A transfers PALM to CAR (human Reactome reaction)"
                    locations:
                      - preferred_term: mitochondrial outer membrane
                        term:
                          id: GO:0005741
                          label: mitochondrial outer membrane
                    role_description: >-
                      Committed, rate-limiting step of long-chain fatty-acid
                      oxidation, allosterically inhibited by malonyl-CoA.
                      Deficiency causes CPT1A deficiency. Muscle/brain use the
                      CPT1B/CPT1C isoforms.
              - id: cat_acetyl_variant
                label: Carnitine acetyltransferases forming acetylcarnitine (fungi)
                module_type: REACTION
                annotons:
                  - id: cat_acetyl_donor_activity
                    label: "CAT2 (peroxisomal) / YAT1 / YAT2: carnitine O-acetyltransferase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Carnitine O-acyltransferase family (acetyltransferase members)
                        representative_members:
                          - preferred_term: CAT2 (Saccharomyces cerevisiae; peroxisomal isoform)
                            term:
                              id: UniProtKB:P32796
                              label: Carnitine O-acetyltransferase, mitochondrial
                            description: >-
                              Peroxisomal form translated from shorter oleate-induced
                              transcripts lacking the mitochondrial presequence
                              (PMID:7628448).
                          - preferred_term: YAT1 (Saccharomyces cerevisiae; mitochondrial outer membrane)
                            term:
                              id: UniProtKB:P80235
                              label: Putative mitochondrial carnitine O-acetyltransferase
                            description: Ethanol/acetate-induced, presumptive outer-membrane enzyme (PMID:8262985).
                          - preferred_term: YAT2 (Saccharomyces cerevisiae; cytosolic)
                            term:
                              id: UniProtKB:P40017
                              label: Carnitine O-acetyltransferase YAT2
                            description: Contributes much of the CAT activity of ethanol-grown cells (PMID:11329169).
                    function:
                      preferred_term: carnitine O-acetyltransferase activity
                      term:
                        id: GO:0004092
                        label: carnitine O-acetyltransferase activity
                      substrates:
                        - preferred_term: acetyl-CoA
                        - preferred_term: L-carnitine
                      products:
                        - preferred_term: O-acetyl-L-carnitine
                        - preferred_term: coenzyme A
                      evidence:
                        - source_id: PMID:11329169
                          statement: CAT2, YAT1 and YAT2 are all essential for growth on non-fermentable carbon in a carnitine-dependent (cit2) strain.
                        - source_id: file:yeast/CAT2/CAT2-ai-review.yaml
                          statement: Core function GO:0004092.
                    gocam_associations:
                      - model: gomodel:YeastPathways_PWY3O-4
                        activity: gomodel:CARNITINE-O-ACETYLTRANSFERASE-RXN
                        title: 'carnitine shuttle - imported from: Saccharomyces Genome Database'
                        description: CAT2, YAT1 and YAT2 enable GO:0004092, all placed in cytosol.
                    role_description: >-
                      Convert acetyl-CoA made in the peroxisome (beta-oxidation)
                      or cytosol (acetate/ethanol metabolism) to acetylcarnitine.
                      The three paralogs act in different compartments and do not
                      cross-complement (PMID:18427809), so no single location is
                      asserted.
    - order: 3
      role: acylcarnitine/carnitine antiport across the inner membrane
      node:
        id: slc25a20_step
        label: acylcarnitine (cytosolic side) / carnitine (matrix) antiport
        module_type: TRANSPORT_STEP
        annotons:
          - id: slc25a20_activity
            label: "SLC25A20/CACT, CRC1: carnitine/acylcarnitine translocase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Mitochondrial carnitine/acylcarnitine carrier family (SLC25A20, CRC1)
                representative_members:
                  - preferred_term: SLC25A20 / CACT (human)
                    term:
                      id: UniProtKB:O43772
                      label: Mitochondrial carnitine/acylcarnitine carrier protein
                  - preferred_term: CRC1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:Q12289
                      label: Mitochondrial carnitine carrier
                    description: >-
                      Transports carnitine and short-chain (acetyl-, propionyl-)
                      carnitines, and long-chain acylcarnitines only weakly
                      (PMID:10622748); required for carnitine-dependent acetyl
                      transport (PMID:10545096).
            function:
              preferred_term: O-acyl-L-carnitine transmembrane transporter activity
              term:
                id: GO:0015227
                label: O-acyl-L-carnitine transmembrane transporter activity
              substrates:
                - preferred_term: acylcarnitine (long-chain in animals; acetylcarnitine in fungi), intermembrane space
                - preferred_term: L-carnitine (matrix)
              products:
                - preferred_term: acylcarnitine (matrix)
                - preferred_term: L-carnitine (intermembrane space)
              evidence:
                - source_id: Reactome:R-HSA-200424
                  statement: "Exchange of acylcarnitine and carnitine across the inner mitochondrial membrane (human Reactome reaction)"
                - source_id: PMID:10622748
                  statement: Crc1p transports carnitine, acetylcarnitine and propionylcarnitine.
            locations:
              - preferred_term: mitochondrial inner membrane
                term:
                  id: GO:0005743
                  label: mitochondrial inner membrane
            role_description: >-
              Inner-membrane antiporter importing acylcarnitine into the matrix
              in exchange for free carnitine. Substrate range differs by
              lineage (long-chain in animals, short-chain in yeast). SLC25A20
              deficiency causes carnitine-acylcarnitine translocase deficiency.
    - order: 4
      role: regeneration of matrix acyl-CoA (completes the shuttle)
      node:
        id: cpt2_step
        label: acylcarnitine + CoA to acyl-CoA + L-carnitine (matrix)
        module_type: REACTION
        variant_sets:
          - id: matrix_side_cargo_variants
            label: Matrix-side carnitine acyltransferase by cargo
            axis: acyl cargo (long-chain acyl vs acetyl) / lineage
            selection: ONE_OR_MORE
            variants:
              - id: cpt2_long_chain_variant
                label: CPT2 long-chain acyl transfer (animals)
                module_type: REACTION
                annotons:
                  - id: cpt2_activity
                    label: "CPT2: carnitine palmitoyltransferase 2"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: CPT2 carnitine O-palmitoyltransferase subfamily
                        term:
                          id: PANTHER:PTHR22589:SF51
                          label: CARNITINE O-PALMITOYLTRANSFERASE 2, MITOCHONDRIAL
                        representative_members:
                          - preferred_term: CPT2 (human)
                            term:
                              id: UniProtKB:P23786
                              label: Carnitine O-palmitoyltransferase 2, mitochondrial
                    function:
                      preferred_term: carnitine O-palmitoyltransferase activity
                      term:
                        id: GO:0004095
                        label: carnitine O-palmitoyltransferase activity
                      substrates:
                        - preferred_term: long-chain O-acylcarnitine (matrix)
                        - preferred_term: coenzyme A
                      products:
                        - preferred_term: long-chain acyl-CoA
                        - preferred_term: L-carnitine
                      evidence:
                        - source_id: EC:2.3.1.21
                          statement: carnitine O-palmitoyltransferase
                        - source_id: Reactome:R-HSA-200410
                          statement: "CPT2 converts acylcarnitine to acyl-CoA (human Reactome reaction)"
                    locations:
                      - preferred_term: mitochondrial inner membrane
                        term:
                          id: GO:0005743
                          label: mitochondrial inner membrane
                    role_description: >-
                      Matrix-facing inner-membrane transferase regenerating
                      long-chain acyl-CoA for beta-oxidation. Deficiency causes
                      CPT2 deficiency (myopathic form: exercise-induced
                      rhabdomyolysis).
              - id: cat2_mito_acetyl_variant
                label: Mitochondrial carnitine acetyltransferase regenerating acetyl-CoA (fungi)
                module_type: REACTION
                annotons:
                  - id: cat2_mito_activity
                    label: "CAT2 (mitochondrial isoform): carnitine O-acetyltransferase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: CAT2 mitochondrial/peroxisomal carnitine O-acetyltransferase subfamily
                        term:
                          id: PANTHER:PTHR22589:SF103
                          label: CARNITINE O-ACETYL-TRANSFERASE, ISOFORM A-RELATED
                        representative_members:
                          - preferred_term: CAT2 (Saccharomyces cerevisiae; mitochondrial isoform)
                            term:
                              id: UniProtKB:P32796
                              label: Carnitine O-acetyltransferase, mitochondrial
                            description: Presequence-containing form imported into mitochondria (PMID:7628448).
                    function:
                      preferred_term: carnitine O-acetyltransferase activity
                      term:
                        id: GO:0004092
                        label: carnitine O-acetyltransferase activity
                      substrates:
                        - preferred_term: O-acetyl-L-carnitine (matrix)
                        - preferred_term: coenzyme A
                      products:
                        - preferred_term: acetyl-CoA
                        - preferred_term: L-carnitine
                      evidence:
                        - source_id: PMID:10545096
                          statement: CAT2 is required for carnitine-dependent transport of peroxisomal acetyl-CoA to mitochondria.
                    locations:
                      - preferred_term: mitochondrion
                        term:
                          id: GO:0005739
                          label: mitochondrion
                    gocam_associations:
                      - model: gomodel:YeastPathways_PWY3O-4
                        activity: gomodel:RXN3O-37
                        title: 'carnitine shuttle - imported from: Saccharomyces Genome Database'
                        description: CAT2 enables GO:0004092 in the mitochondrial-lumen reaction (no location in the model).
                    role_description: >-
                      Regenerate matrix acetyl-CoA (for citrate synthase) and free
                      carnitine for export by the translocase.
  connections:
    - source: slc22a5_step
      target: cpt1_step
      connection_type: PROVIDES_INPUT_FOR
      description: Imported L-carnitine is the acyl acceptor of the donor-side acyltransferase.
    - source: cpt1_step
      target: slc25a20_step
      connection_type: PROVIDES_INPUT_FOR
      description: Acylcarnitine (or acetylcarnitine) is imported into the matrix by the translocase.
    - source: slc25a20_step
      target: cpt2_step
      connection_type: PROVIDES_INPUT_FOR
      description: Matrix acylcarnitine is converted back to acyl-CoA.
    - source: cpt2_step
      target: slc25a20_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Free carnitine released in the matrix is exported by the translocase
        (the antiport counter-substrate), recycling carnitine and closing the
        shuttle.
  knowledge_gaps:
    - gap_statement: >-
        The carrier that exports acetylcarnitine from yeast peroxisomes to the
        cytosol has not been identified, although the peroxisomal membrane is
        impermeable to acetyl-CoA and peroxisomal CAT2 is required.
      boundary: >-
        Peroxisomal acetylcarnitine formation is modelled within the
        donor-side variant; the peroxisomal membrane crossing is not modelled
        as a separate step until a carrier is identified.
      gap_kind:
        - BIOLOGY
  notes: >-
    GENERALIZE (YeastPathways project, 2026-10): the former human long-chain
    shuttle was broadened to carnitine acyltransferase shuttles with the same
    chemistry but different cargo. The two transferase steps became ONE_OR_MORE
    variant sets on the axis "acyl cargo": CPT1/CPT2 (GO:0004095, long-chain,
    animals) vs carnitine acetyltransferases (GO:0004092, acetyl, fungi). All
    transferases are in PTHR22589. The donor-side acetyl variant groups the
    three S. cerevisiae paralogs (peroxisomal CAT2 isoform, YAT1 at the
    mitochondrial outer membrane, cytosolic YAT2) without a single location;
    the matrix variant is the mitochondrial CAT2 isoform (one gene, two
    targeted forms; PMID:7628448). The translocase step gained CRC1 (same
    PANTHER family PTHR45624 as SLC25A20; short-chain preference,
    PMID:10622748). Carnitine uptake became an EXACTLY_ONE variant set with
    SLC22A5 (animals) and AGP2 (budding yeast, PMID:10545096). Module-level
    compartment context was replaced by annoton locations because the donor
    compartment differs by cargo (mitochondrial outer membrane, peroxisome,
    cytosol). In yeast the shuttle is in vivo effectively unidirectional
    (import of acetyl units into mitochondria; PMID:27143389), and it is
    redundant with the peroxisomal citrate synthase/glyoxylate route
    (PMID:7628449, PMID:11329169). YeastCyc corrections: PWY3O-4 names Crc1p
    in its comment but attaches it to no reaction, and AGP2 is absent.
    GO-CAM disagreements: YeastPathways_PWY3O-4 places CAT2, YAT1 and YAT2 in
    cytosol (CAT2 is peroxisomal/mitochondrial, YAT1 mitochondrial outer
    membrane), gives no location for the matrix reaction and lacks the
    translocase. The medium-chain/peroxisomal mammalian acyltransferases CRAT
    and CROT are not modelled. Downstream, long-chain acyl-CoA enters
    mitochondrial beta-oxidation (fatty_acid_beta_oxidation) and acetyl-CoA
    enters the TCA cycle (tca_cycle).
