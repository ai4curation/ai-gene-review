id: MODULE:dmel_erf1_erf3_termination_complex
title: eRF1-eRF3 translation termination complex in Drosophila melanogaster
description: >-
  Eukaryotic translation termination is carried out by the release factors eRF1 and eRF3.
  eRF1 recognizes all three stop codons in the ribosomal A site and triggers hydrolysis of
  the peptidyl-tRNA bond through its conserved GGQ motif. eRF3 is a translational GTPase that
  delivers eRF1 to the ribosome as a ternary complex with GTP; GTP hydrolysis by eRF3 accommodates
  eRF1 and accelerates peptide release.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001971
  title: 'FlyBase gene group TRFC: Erf1-erf3 translation termination complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as erf1-erf3 translation termination
    complex (TRFC); this module models that group.
- source_id: GO:0018444
  title: translation release factor complex
  statement: >-
    GO term grounding the module as translation release factor complex.
notes: >-
  Two-subunit complex modelled one part per subunit. Ribosome recycling (Pelo/ABCE1-type factors)
  is outside this module. FlyBase groups realized by this module: TRFC (FBgg0001971). Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_erf1_erf3_termination_complex.yaml; none of the member genes has
  a gene review yet unless noted.
