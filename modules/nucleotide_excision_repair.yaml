    - source: tfiih_opening
      target: preincision_verification
      connection_type: PRECEDES
      description: The opened bubble is bound by XPA and RPA, and XPD stalling verifies the lesion.
    - source: preincision_verification
      target: dual_incision
      connection_type: PRECEDES
      description: RPA and XPA position XPF-ERCC1 5' and XPG 3' of the lesion.
    - source: dual_incision
      target: repair_synthesis
      connection_type: PRECEDES
      description: The 5' incision by XPF-ERCC1 provides the 3'-OH primer; synthesis can begin before the 3' incision.
    - source: repair_synthesis
      target: ligation
      connection_type: PRECEDES
      description: The completed patch leaves a nick that is ligated.
