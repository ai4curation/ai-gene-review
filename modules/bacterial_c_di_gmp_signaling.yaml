                term:
                  id: CHEBI:18420
                  label: magnesium(2+)
              - preferred_term: manganese(2+)
                term:
                  id: CHEBI:29035
                  label: manganese(2+)
            role_description: Lowers the c-di-GMP pool by one-step hydrolysis to the linear dinucleotide
              pGpG.
            evidence:
            - source_id: PMID:15995192
              title: 'The ubiquitous protein domain EAL is a cyclic diguanylate-specific phosphodiesterase:
