        - id: hd_gyp_phosphodiesterase
          label: HD-GYP-domain phosphodiesterase
          module_type: REACTION
          description: Active HD-GYP domains hydrolyse c-di-GMP. PA4781 experiments resolve pGpG as an
            intermediate and slow onward conversion to GMP; Borrelia PdeB assays establish overall conversion
            to GMP. Those observations are not treated as a universal rate, metal preference or intermediate-release
            property of every family member.
          annotons:
          - id: hd_gyp_pde_activity
            label: HD-GYP-domain c-di-GMP phosphodiesterase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: HD-GYP-domain c-di-GMP phosphodiesterases
                description: The verified PANTHER groupings represented here are further restricted to
                  experimentally supported c-di-GMP hydrolases. Family/domain membership alone does not
                  assert catalytic activity.
                representative_members:
                - preferred_term: PA4781 (Pseudomonas aeruginosa)
                  term:
                    id: UniProtKB:Q9HV27
                    label: Cyclic di-GMP phosphodiesterase PA4781
                  description: PAO1 REC–HD-GYP protein with phosphorylation-gated hydrolysis, higher affinity
                    for pGpG than c-di-GMP and slow onward GMP formation in vitro.
                  evidence:
                  - source_id: PMID:24066157
                    title: 'C-di-GMP hydrolysis by Pseudomonas aeruginosa HD-GYP phosphodiesterases: analysis
                      of the reaction mechanism and novel roles for pGpG.'
                    statement: Both PA4781 and PA4108 hydrolyse c-di-GMP in two steps via the linear intermediate
                      pGpG, and the unphosphorylated REC domain of PA4781 blocks substrate access.
                  - source_id: PMID:19170727
                    title: HD-GYP domain proteins regulate biofilm formation and virulence in Pseudomonas
                      aeruginosa.
                    statement: Mutation of PA4108 and PA4781 raises cellular c-di-GMP, consistent with
                      phosphodiesterase function in vivo.
                - preferred_term: PdeB (Borrelia burgdorferi B31)
                  term:
                    id: UniProtKB:O50161
                    label: Cyclic di-GMP phosphodiesterase PdeB
                  description: HD-GYP enzyme in a second verified PANTHER family. Direct assays on B31-A3-derived
                    protein show c-di-GMP conversion to GMP; ring opening is inferred within that overall
                    reaction.
                  evidence:
                  - source_id: PMID:21670168
                    title: Analysis of the HD-GYP domain cyclic dimeric GMP phosphodiesterase reveals
                      a role in motility and the enzootic life cycle of Borrelia burgdorferi.
                    statement: Borrelia PdeB is a distinct HD-GYP exemplar with c-di-GMP hydrolysis demonstrated
                      in B31-A3-derived material; the assay reports GMP as final product, not isolated
                      pGpG release.
                    supporting_text: Here we demonstrate that BB0374/PdeB specifically hydrolyzed c-di-GMP
                      with a K(m) of 2.9 nM, confirming that it is a functional phosphodiesterase.
                family_terms:
                - id: PANTHER:PTHR45228
                  label: CYCLIC DI-GMP PHOSPHODIESTERASE TM_0186-RELATED
                - id: PANTHER:PTHR43155
                  label: CYCLIC DI-GMP PHOSPHODIESTERASE PA4108-RELATED
              required_function:
