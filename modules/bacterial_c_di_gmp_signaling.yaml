id: MODULE:bacterial_c_di_gmp_signaling
title: Bacterial cyclic di-GMP second-messenger signalling
description: A reusable bacterial intracellular second-messenger motif comprising GGDEF-mediated c-di-GMP
  synthesis, turnover by EAL or HD-GYP phosphodiesterases, and recognition by protein receptors. Synthesis
  and hydrolysis alter ligand availability, either in shared cellular pools or through local enzyme–effector
  interactions. The model samples Pseudomonadota, Bacillota and Spirochaetota; it does not imply that
  every bacterium has the motif, both phosphodiesterase classes or every receptor class. PilZ proteins
  and catalytically inactive GGDEF/EAL proteins provide distinct receptor implementations. Motility, adhesion,
  extracellular-polysaccharide production and host adaptation are receptor-specific outputs outside the
  core boundary.
status: COMPLETE
scope: ABSTRACT
evidence:
- source_id: PMID:42429561
  title: Roles of divalent metals in the regulation of cyclic di-GMP signaling in bacteria.
  statement: Review defining the module boundary as the balance of GGDEF diguanylate cyclases against
    EAL and HD-GYP phosphodiesterases, and summarising the divalent-metal requirements of each catalytic
    domain.
  supporting_text: The intracellular concentration of c-di-GMP is tightly controlled by opposing activities
    of diguanylate cyclases (DGCs), which synthesize c-di-GMP from GTP, and phosphodiesterases (PDEs),
    which degrade c-di-GMP into pGpG or GMP
- source_id: PMID:41452322
  title: Architecture and regulatory functions of c-di-GMP signaling in classical Bordetella species.
  statement: Review summarising the general synthesis/degradation/effector architecture and its Bordetella
    instantiation, including scaffold-dependent cyclase activation (BdcA-DdpA) and the degenerate-EAL
    receptor LapD controlling the LapG protease.
  supporting_text: Intracellular c-di-GMP levels are sensed by variety of effectors, including degenerate
    GGDEF/EAL domain proteins, transcription factors, PilZ domain proteins and riboswitches.
- source_id: PMID:37251514
  title: Local signaling enhances output specificity of bacterial c-di-GMP signaling networks.
  statement: Comparative review distinguishes experimentally supported local enzyme–effector signalling
    from global concentration control; both can coexist.
  supporting_text: Such high specificity and flexibility arise from combining modes of local and global
    c-di-GMP signaling in complex signaling networks.
- source_id: PMID:23893111
  title: Functional characterization of core components of the Bacillus subtilis cyclic-di-GMP signaling
    pathway.
  statement: B. subtilis provides a Bacillota example with active GGDEF cyclases, one EAL phosphodiesterase
    and PilZ receptor; tested motility effects did not imply a biofilm phenotype.
  supporting_text: Furthermore, elevation of c-di-GMP levels in B. subtilis led to inhibition of swarming
    motility, whereas biofilm formation was unaffected.
- source_id: PMID:24822172
  title: The cyclic-di-GMP signaling pathway in the Lyme disease spirochete, Borrelia burgdorferi.
  statement: 'The B31-centred Borrelia system supplies a Spirochaetota comparison: one cyclase, EAL and
    HD-GYP phosphodiesterases, and the PilZ effector PlzA; this inventory is not generalized to all Borrelia
    strains.'
notes: 'Boundary: the required roles are synthesis, degradation and protein recognition of c-di-GMP. Receptor-dependent
  transcription, RNA effects, motility, adhesin retention and polysaccharide production remain downstream
  biology. Riboswitches and other protein receptor folds are outside this selected protein-receptor motif,
  not asserted absent. BdcA-associated DdpA is an optional, lineage-restricted regulatory part, not a
  universal cyclase subunit.


  Taxonomic sampling: the 17 reference proteins cover Pseudomonadota, Bacillota and Spirochaetota. Bacterial
  scope describes the distribution of this reusable motif, not universal genomic capacity. E. coli and
  B. subtilis provide EAL-only sampled turnover implementations; Borrelia provides EAL and HD-GYP enzymes.
  A panel spanning species must not be mistaken for a complete pathway in any one strain. The B. subtilis
  168 reference proteins are distinguished from NCIB3610-derived experiments; Bordetella RB50 sequence
  records from strain 9.73 phenotypic work; and Borrelia B31 from derivative strains, as documented in
  member reviews.


  Family selectors are grounded in verified PANTHER classifications where available, with exact official
  labels and representative membership. Family membership is intersected with the stated activity; a PANTHER
  name containing phosphodiesterase does not make every member catalytic. PilZ receptors remain an explicitly
  functional grouping with a PilZ-domain requirement and demonstrated ligand binding; no unresolved PANTHER
  id is invented. No PAINT ancestral-node assertion is made from a domain match.


  Local versus global signalling: edges describe ligand supply or removal from a pool accessible to the
  specified receptor. They do not imply one homogeneous pool, direct regulatory binding between every
  cyclase and phosphodiesterase, or a universal receptor-affinity hierarchy. Evidence for local signalling
  requires more than a phenotype: direct interactions, pathway specificity and measurements of messenger
  levels must be considered together (PMID:37251514).


  Ontology: QuickGO checked on 2026-11-05 still defines GO:0061939 c-di-GMP signaling as transfer of information
  from one cell to another. The intracellular motif therefore retains c-di-GMP as its concept rather than
  importing that definition. This is an ontology issue to resolve, not evidence that the biological motif
  is absent.


  Retraction and catalytic scope: the retracted RpfG paper PMID:16611728 is not used to establish HD-GYP
  chemistry. PA4781 primary kinetics and Borrelia PdeB assays independently support turnover, with intermediate/product
  differences stated explicitly. Degenerate GGDEF/EAL receptors do not inherit cyclase/PDE activity from
  their domains. DdpA has an additional histidine-kinase region whose activity remains unresolved; its
  inactive GGDEF/EAL regions do not prove that kinase region is inactive.'
module:
  id: bacterial_c_di_gmp_signaling
  label: Bacterial cyclic di-GMP second-messenger signalling
  module_type: SIGNALING_PATHWAY
  concepts:
  - preferred_term: c-di-GMP
    term:
      id: CHEBI:49537
      label: c-di-GMP
    description: The second messenger whose synthesis, hydrolysis and recognition define the module.
  context:
    taxa:
    - preferred_term: Bacteria
      term:
        id: NCBITaxon:2
        label: Bacteria
      description: This intracellular motif occurs across bacterial lineages; representatives here sample
        Pseudomonadota, Bacillota and Spirochaetota. Presence, paralogue number, receptor repertoire and
        physiological outputs vary, and no universal occurrence is asserted.
  parts:
  - order: 1
    role: c-di-GMP synthesis by GGDEF diguanylate cyclases
    node:
      id: c_di_gmp_synthesis
      label: Diguanylate cyclase synthesis of c-di-GMP
      module_type: REACTION
      description: Two GGDEF domains, each binding one GTP, align in an antiparallel dimer and condense
        the two GTPs into c-di-GMP with release of pyrophosphate. Catalysis requires divalent metal (Mg2+,
        and in many enzymes Mn2+) coordinated by the GG(D/E)EF motif. Many cyclases are inhibited non-competitively
        by c-di-GMP binding to an allosteric I-site (RxxD motif) within the GGDEF domain itself, and N-terminal
        sensory domains (receiver, CZB, globin, Cache and others) gate the activity in response to the
        cue each enzyme senses.
      evidence:
      - source_id: PMID:42429561
        statement: GGDEF dimerisation, antiparallel GTP alignment and Mg2+/Mn2+ dependence of the cyclase
          reaction.
        supporting_text: Dimerization is crucial for c-di-GMP synthesis, as each GGDEF monomer binds one
          GTP molecule.
      - source_id: PMID:16923812
        title: Allosteric control of cyclic di-GMP signaling.
        statement: Defines the I-site as an allosteric c-di-GMP binding site within the GGDEF domain mediating
          non-competitive product inhibition, with an RXXD core motif conserved in most GGDEF proteins.
      - source_id: PMID:23893111
        title: Functional characterization of core components of the Bacillus subtilis cyclic-di-GMP signaling
          pathway.
        statement: B. subtilis provides a Bacillota example with active GGDEF cyclases, one EAL phosphodiesterase
          and PilZ receptor; tested motility effects did not imply a biofilm phenotype.
        supporting_text: Furthermore, elevation of c-di-GMP levels in B. subtilis led to inhibition of
          swarming motility, whereas biofilm formation was unaffected.
      - source_id: PMID:32156823
        title: Cyclic di-GMP Signaling in Bacillus subtilis Is Governed by Direct Interactions of Diguanylate
          Cyclases and Cognate Receptors.
        statement: DgcK interacts with the inactive-GGDEF receptor YdaK and with DgrA/MotI; local interactions
          and global PdeH control can coexist.
        supporting_text: The soluble domains of DgcK and of YdaK show a direct interaction in vitro, which
          depends on an intact I-site within the degenerated GGDEF domain of YdaK.
      annotons:
      - id: dgc_ggdef_activity
        label: GGDEF-domain diguanylate cyclase
        participant:
          selector_type: FAMILY
          family:
            preferred_term: GGDEF-domain diguanylate cyclases
            description: 'Experimentally supported GGDEF cyclases within the verified PANTHER grouping.
              Catalytic activity is required separately: conserved motifs and family membership are not
              sufficient to classify degenerate domains as enzymes.'
            term:
              id: PANTHER:PTHR45138:SF9
              label: DIGUANYLATE CYCLASE DGCM-RELATED
            representative_members:
            - preferred_term: PleD (Caulobacter crescentus)
              term:
                id: UniProtKB:Q9A5I5
                label: Response regulator PleD
              description: Response regulator with a C-terminal GGDEF cyclase domain; the founding structural
                and kinetic exemplar, activated by phosphorylation and polarly localised.
              evidence:
              - source_id: PMID:15075296
                title: Cell cycle-dependent dynamic localization of a bacterial response regulator with
                  a novel di-guanylate cyclase output domain.
                statement: Establishes the C-terminal GGDEF domain of PleD as a c-di-GMP-synthesising
                  cyclase coupled to polar localisation.
            - preferred_term: DgcZ (YdeH) (Escherichia coli)
              term:
                id: UniProtKB:P31129
                label: Diguanylate cyclase DgcZ
              description: CZB–GGDEF zinc-sensory cyclase; the sensory CZB domain and catalytic GGDEF
                domain are distinct. Zn2+ binding inhibits the cyclase in the characterized system.
              evidence:
              - source_id: PMID:23769666
                title: Structure and signaling mechanism of a zinc-sensory diguanylate cyclase.
                statement: Crystal structures and in vitro kinetics show Zn2+ binding to the 3His/1Cys
                  CZB motif inhibits the cyclase, linking a sensory input to c-di-GMP output.
            - preferred_term: BdcA (Bordetella bronchiseptica)
              term:
                id: UniProtKB:A0A0H3LVU7
                label: Diguanylate cyclase BdcA
              description: RB50 reference protein assigned the BdcA activity established in strain 9.73.
                In vivo c-di-GMP and motility effects require DdpA; purified enzyme chemistry and mutant
                stability were not established.
              evidence:
              - source_id: PMID:23475948
                title: Cyclic-di-GMP signalling regulates motility and biofilm formation in Bordetella
                  bronchiseptica.
                statement: Identifies BB3576 as a GGDEF protein with diguanylate cyclase activity controlling
                  motility and biofilm formation.
              - source_id: PMID:31209073
                title: Bordetella bronchiseptica Diguanylate Cyclase BdcA Regulates Motility and Is Important
                  for the Establishment of Respiratory Infection in Mice.
                statement: bdcA deletion enhances motility; BdcA overexpression increases c-di-GMP and
                  inhibits motility in a BB2109-dependent manner. Catalytic-motif perturbation supports
                  a cyclase role, but mutant stability was not confirmed.
            - preferred_term: DgcK (Bacillus subtilis 168)
              term:
                id: UniProtKB:P54595
                label: Diguanylate cyclase DgcK
              description: Membrane GGDEF cyclase; reference-strain mapping and NCIB3610 experiments are
                distinguished in the gene review. DgcK couples directly to YdaK and MotI/DgrA.
              evidence:
              - source_id: PMID:23893111
                title: Functional characterization of core components of the Bacillus subtilis cyclic-di-GMP
                  signaling pathway.
                statement: B. subtilis provides a Bacillota example with active GGDEF cyclases, one EAL
                  phosphodiesterase and PilZ receptor; tested motility effects did not imply a biofilm
                  phenotype.
                supporting_text: Furthermore, elevation of c-di-GMP levels in B. subtilis led to inhibition
                  of swarming motility, whereas biofilm formation was unaffected.
              - source_id: PMID:32156823
                title: Cyclic di-GMP Signaling in Bacillus subtilis Is Governed by Direct Interactions
                  of Diguanylate Cyclases and Cognate Receptors.
                statement: DgcK interacts with the inactive-GGDEF receptor YdaK and with DgrA/MotI; local
                  interactions and global PdeH control can coexist.
                supporting_text: The soluble domains of DgcK and of YdaK show a direct interaction in
                  vitro, which depends on an intact I-site within the degenerated GGDEF domain of YdaK.
            - preferred_term: Rrp1 (Borrelia burgdorferi B31)
              term:
                id: UniProtKB:O51380
                label: diguanylate cyclase
              description: Receiver–GGDEF cyclase of the compact Borrelia system; phosphorylation-dependent
                activity supplies c-di-GMP to effector pathways.
              evidence:
              - source_id: PMID:24822172
                title: The cyclic-di-GMP signaling pathway in the Lyme disease spirochete, Borrelia burgdorferi.
                statement: 'The B31-centred Borrelia system supplies a Spirochaetota comparison: one cyclase,
                  EAL and HD-GYP phosphodiesterases, and the PilZ effector PlzA; this inventory is not
                  generalized to all Borrelia strains.'
              - source_id: PMID:15716451
                title: 'Cyclic diguanylate is a ubiquitous signaling molecule in bacteria: insights into
                  biochemistry of the GGDEF protein domain.'
                statement: Rrp1 is a phosphorylation-gated GGDEF cyclase; the available abstract directly
                  reports enzyme activity, while precise cloning-strain detail is not recovered from that
                  cache.
          required_function:
            preferred_term: diguanylate cyclase activity
            term:
              id: GO:0052621
              label: diguanylate cyclase activity
          required_domain:
            preferred_term: GGDEF domain
            term:
              id: InterPro:IPR000160
              label: GGDEF domain
        function:
          preferred_term: diguanylate cyclase activity
          term:
            id: GO:0052621
            label: diguanylate cyclase activity
          substrates:
          - preferred_term: GTP
            term:
              id: CHEBI:15996
              label: GTP
          products:
          - preferred_term: c-di-GMP
            term:
              id: CHEBI:49537
              label: c-di-GMP
          cofactors:
          - preferred_term: magnesium(2+)
            term:
              id: CHEBI:18420
              label: magnesium(2+)
          - preferred_term: manganese(2+)
            term:
              id: CHEBI:29035
              label: manganese(2+)
            description: Supports activity of many GGDEF enzymes and promotes stronger dimerisation of
              PleD than Mg2+ alone.
            evidence:
            - source_id: PMID:42429561
              supporting_text: A well-characterized GGDEF-containing protein, PleD, exhibits enhanced
                DGC activity with both Mg²⁺ and Mn²⁺, with Mn²⁺ promoting stronger dimerization
        role_description: 'Sets the input arm of the module: converts the sensory state of its N-terminal
          domain into c-di-GMP production.'
        evidence:
        - source_id: PMID:15075296
          title: Cell cycle-dependent dynamic localization of a bacterial response regulator with a novel
            di-guanylate cyclase output domain.
          statement: PleD defines a phosphorylation-regulated GGDEF cyclase exemplar; sensory architecture
            is not shared by all cyclases.
        - source_id: PMID:23769666
          title: Structure and signaling mechanism of a zinc-sensory diguanylate cyclase.
          statement: DgcZ demonstrates CZB-dependent zinc sensing and GGDEF catalysis.
        - source_id: PMID:23893111
          title: Functional characterization of core components of the Bacillus subtilis cyclic-di-GMP
            signaling pathway.
          statement: B. subtilis provides a Bacillota example with active GGDEF cyclases, one EAL phosphodiesterase
            and PilZ receptor; tested motility effects did not imply a biofilm phenotype.
          supporting_text: Furthermore, elevation of c-di-GMP levels in B. subtilis led to inhibition
            of swarming motility, whereas biofilm formation was unaffected.
        - source_id: PMID:24822172
          title: The cyclic-di-GMP signaling pathway in the Lyme disease spirochete, Borrelia burgdorferi.
          statement: 'The B31-centred Borrelia system supplies a Spirochaetota comparison: one cyclase,
            EAL and HD-GYP phosphodiesterases, and the PilZ effector PlzA; this inventory is not generalized
            to all Borrelia strains.'
  - order: 2
    role: c-di-GMP degradation by EAL or HD-GYP phosphodiesterases
    node:
      id: c_di_gmp_degradation
      label: Phosphodiesterase turnover of c-di-GMP
      module_type: REACTION
      description: EAL and HD-GYP phosphodiesterases are structurally unrelated alternatives for c-di-GMP
        turnover. Some bacteria use one class and others both; co-occurrence is not assumed. Products
        and metal requirements depend on the characterized enzyme.
      variant_sets:
      - id: c_di_gmp_pde_families
        label: c-di-GMP phosphodiesterase family
        axis: enzyme family
        selection: ONE_OR_MORE
        notes: EAL and HD-GYP domains are unrelated folds that catalyse the same first hydrolytic step;
          which family (or both) a species uses is a genomic property, not a mechanistic alternative within
          one enzyme.
        variants:
        - id: eal_phosphodiesterase
          label: EAL-domain phosphodiesterase
          module_type: REACTION
          description: Active EAL domains open c-di-GMP to pGpG. Conserved catalytic residues and metal-dependent
            hydrolysis distinguish enzymes from inactive EAL receptors. Mg2+/Mn2+ support and Ca2+ inhibition
            are documented for representative enzymes; their relative effects are not asserted identical
            across all proteins. Further pGpG clearance is outside the shared first-step boundary.
          annotons:
          - id: eal_pde_activity
            label: EAL-domain c-di-GMP phosphodiesterase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: EAL-domain c-di-GMP phosphodiesterases
                description: The verified PANTHER groupings represented here are further restricted to
                  experimentally supported c-di-GMP hydrolases. Family/domain membership alone does not
                  assert catalytic activity.
                representative_members:
                - preferred_term: PdeH (YhjH) (Escherichia coli)
                  term:
                    id: UniProtKB:P37646
                    label: Cyclic di-GMP phosphodiesterase PdeH
                  description: E. coli K-12 motility-associated EAL phosphodiesterase; controls ligand
                    availability to receptor pathways.
                  evidence:
                  - source_id: PMID:18765794
                    title: Inverse regulatory coordination of motility and curli-mediated adhesion in
                      Escherichia coli.
                    statement: Identifies YhjH as an EAL protein and c-di-GMP phosphodiesterase placed
                      under FlhDC/FliA control, antagonising GGDEF proteins.
                    supporting_text: YhjH, an EAL protein and c-di-GMP phosphodiesterase under FlhDC/FliA
                      control
                - preferred_term: PdeL (YahA) (Escherichia coli)
                  term:
                    id: UniProtKB:P21514
                    label: Cyclic di-GMP phosphodiesterase PdeL
                  description: The first EAL domain shown in vitro to be sufficient for c-di-GMP-specific
                    hydrolysis to pGpG.
                  evidence:
                  - source_id: PMID:15995192
                    title: 'The ubiquitous protein domain EAL is a cyclic diguanylate-specific phosphodiesterase:
                      enzymatically active and inactive EAL domains.'
                    statement: Full-length YahA and its isolated EAL domain hydrolyse c-di-GMP to 5'pGpG,
                      with activity dependent on Mg2+ or Mn2+ and strongly inhibited by Ca2+.
                - preferred_term: PdeH (Bacillus subtilis 168)
                  term:
                    id: UniProtKB:P14203
                    label: Cyclic di-GMP phosphodiesterase PdeH
                  description: EAL phosphodiesterase associated with global c-di-GMP clearance in B. subtilis;
                    distinct family placement from E. coli PdeH despite the shared gene name.
                  evidence:
                  - source_id: PMID:23893111
                    title: Functional characterization of core components of the Bacillus subtilis cyclic-di-GMP
                      signaling pathway.
                    statement: B. subtilis provides a Bacillota example with active GGDEF cyclases, one
                      EAL phosphodiesterase and PilZ receptor; tested motility effects did not imply a
                      biofilm phenotype.
                    supporting_text: Furthermore, elevation of c-di-GMP levels in B. subtilis led to inhibition
                      of swarming motility, whereas biofilm formation was unaffected.
                  - source_id: PMID:32156823
                    title: Cyclic di-GMP Signaling in Bacillus subtilis Is Governed by Direct Interactions
                      of Diguanylate Cyclases and Cognate Receptors.
                    statement: DgcK interacts with the inactive-GGDEF receptor YdaK and with DgrA/MotI;
                      local interactions and global PdeH control can coexist.
                    supporting_text: The soluble domains of DgcK and of YdaK show a direct interaction
                      in vitro, which depends on an intact I-site within the degenerated GGDEF domain
                      of YdaK.
                - preferred_term: PdeA (Borrelia burgdorferi B31)
                  term:
                    id: UniProtKB:O51338
                    label: Cyclic di-GMP phosphodiesterase PdeA
                  description: EAL turnover arm of the Borrelia system; complements the HD-GYP PdeB alternative.
                  evidence:
                  - source_id: PMID:24822172
                    title: The cyclic-di-GMP signaling pathway in the Lyme disease spirochete, Borrelia
                      burgdorferi.
                    statement: 'The B31-centred Borrelia system supplies a Spirochaetota comparison: one
                      cyclase, EAL and HD-GYP phosphodiesterases, and the PilZ effector PlzA; this inventory
                      is not generalized to all Borrelia strains.'
                  - source_id: PMID:20444101
                    title: Analysis of a Borrelia burgdorferi phosphodiesterase demonstrates a role for
                      cyclic-di-guanosine monophosphate in motility and virulence.
                    statement: PdeA C-terminal residues 386–670 were purified and hydrolysed c-di-GMP
                      to pGpG; the full-length protein did not express successfully. Native phenotypes
                      used B31-A3 derivatives.
                family_terms:
                - id: PANTHER:PTHR33121
                  label: CYCLIC DI-GMP PHOSPHODIESTERASE PDEF
                - id: PANTHER:PTHR33525
                  label: FAMILY NOT NAMED
              required_function:
                preferred_term: cyclic-guanylate-specific phosphodiesterase activity
                term:
                  id: GO:0071111
                  label: cyclic-guanylate-specific phosphodiesterase activity
              required_domain:
                preferred_term: EAL domain
                term:
                  id: InterPro:IPR001633
                  label: EAL domain
            function:
              preferred_term: cyclic-guanylate-specific phosphodiesterase activity
              term:
                id: GO:0071111
                label: cyclic-guanylate-specific phosphodiesterase activity
              substrates:
              - preferred_term: c-di-GMP
                term:
                  id: CHEBI:49537
                  label: c-di-GMP
