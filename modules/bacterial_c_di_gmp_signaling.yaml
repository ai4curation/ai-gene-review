id: MODULE:bacterial_c_di_gmp_signaling
title: Bacterial cyclic di-GMP second-messenger signalling
description: >-
  A reusable bacterial second-messenger motif in which the intracellular level of
  cyclic di-GMP (c-di-GMP) is set by the opposing activities of synthesising and
  degrading enzymes and read out by dedicated receptor proteins. GGDEF-domain
  diguanylate cyclases condense two GTP molecules into c-di-GMP, usually as
  dimers and often under non-competitive product inhibition at an allosteric
  I-site in the GGDEF domain. Two unrelated phosphodiesterase families turn the signal over:
  EAL-domain enzymes hydrolyse c-di-GMP to linear pGpG, and HD-GYP-domain enzymes
  hydrolyse it via pGpG towards GMP. Receptors convert c-di-GMP binding into a
  change in the activity of a downstream target; well-characterised protein
  receptor classes are PilZ-domain proteins and proteins carrying catalytically
  degenerate GGDEF or EAL domains that retain c-di-GMP binding. The cyclases and
  phosphodiesterases typically carry N-terminal sensory domains, so the motif
  integrates many environmental inputs, and many receptors act on motility,
  adhesion, exopolysaccharide synthesis and virulence outputs that are modelled
  as separate modules.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: PMID:42429561
    title: Roles of divalent metals in the regulation of cyclic di-GMP signaling in bacteria.
    statement: >-
      Review defining the module boundary as the balance of GGDEF diguanylate
      cyclases against EAL and HD-GYP phosphodiesterases, and summarising the
      divalent-metal requirements of each catalytic domain.
    supporting_text: >-
      The intracellular concentration of c-di-GMP is tightly controlled by
      opposing activities of diguanylate cyclases (DGCs), which synthesize
      c-di-GMP from GTP, and phosphodiesterases (PDEs), which degrade c-di-GMP
      into pGpG or GMP
  - source_id: PMID:41452322
    title: Architecture and regulatory functions of c-di-GMP signaling in classical Bordetella species.
    statement: >-
      Review summarising the general synthesis/degradation/effector architecture
      and its Bordetella instantiation, including scaffold-dependent cyclase
      activation (BdcA-DdpA) and the degenerate-EAL receptor LapD controlling
      the LapG protease.
    supporting_text: >-
      Intracellular c-di-GMP levels are sensed by variety of effectors, including
      degenerate GGDEF/EAL domain proteins, transcription factors, PilZ domain
      proteins and riboswitches.
notes: >-
  Boundary. The module is the second-messenger motif itself: synthesis,
  degradation and the receptor step that converts c-di-GMP binding into a change
  in a target protein. The physiological outputs are deliberately left to their
  own modules; c-di-GMP receptor subunits already modelled elsewhere include the
  BcsA PilZ switch in MODULE:bacterial_cellulose_biosynthesis and the Alg44 PilZ
  subunit in MODULE:alginate_polymerization_export. c-di-GMP riboswitches and
  c-di-GMP-binding transcription factors (e.g. FleQ, VpsT, Clp) are real receptor
  classes but are outside this boundary: riboswitches are not protein annotons,
  and the transcription-factor receptors are better represented with the
  regulons they control. Sensory input domains (PAS, GAF, CHASE, Cache, CZB,
  globin) are described on the enzymes rather than as separate parts because
  they differ from one cyclase or phosphodiesterase to the next.

  Representative members. PleD (Caulobacter crescentus) and DgcZ (Escherichia
  coli) are the cyclase exemplars with direct biochemistry; BdcA is retained as
  the Bordetella bronchiseptica exemplar because its cyclase activity was shown
  in vivo and it illustrates scaffold-dependent activation by the degenerate
  GGDEF/EAL protein DdpA (BB2109), but the GGAAF catalytic mutant could not be
  shown to be stable, so BdcA rests on weaker biochemistry than PleD or DgcZ.
  The Xanthomonas campestris HD-GYP protein RpfG is not used as the HD-GYP
  exemplar because the PNAS 2006 paper reporting its c-di-GMP hydrolysis
  (PMID:16611728) is retracted; Pseudomonas aeruginosa PA4781 is used instead,
  on direct enzyme kinetics (PMID:24066157). In Bordetella the single PilZ
  protein YcgR does not control flagellar motility (PMID:41452322), so the E.
  coli YcgR flagellar-brake function is not assumed to transfer to all PilZ
  proteins; the receptor annotons assert c-di-GMP binding and leave the
  downstream target to each receptor.

  Ontology. GO:0061939 (c-di-GMP signaling) has the right label but its
  definition describes information transfer "from one cell to another" and it
  sits under cell-cell signaling (GO:0007267), whereas bacterial c-di-GMP is an
  intracellular second messenger. It is therefore not used as the module
  concept; the definition should be raised with GO. The I-site feedback
  inhibition and the degenerate-domain receptors share structural domains with
  the enzymes, so domain presence alone does not predict which role a protein
  plays; catalytic-motif conservation (GGDEF/GGEEF; EAL with the DDFGTGYSS loop;
  HD and GYP) has to be checked before assigning an enzyme role.
module:
  id: bacterial_c_di_gmp_signaling
  label: Bacterial cyclic di-GMP second-messenger signalling
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: c-di-GMP
      term:
        id: CHEBI:49537
        label: c-di-GMP
      description: >-
        The second messenger whose synthesis, hydrolysis and recognition define
        the module.
  context:
    taxa:
      - preferred_term: Bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          GGDEF, EAL and HD-GYP domains are widespread across bacterial phyla;
          most genomes that encode them encode several paralogues of each.
  parts:
    - order: 1
      role: c-di-GMP synthesis by GGDEF diguanylate cyclases
      node:
        id: c_di_gmp_synthesis
        label: Diguanylate cyclase synthesis of c-di-GMP
        module_type: REACTION
        description: >-
          Two GGDEF domains, each binding one GTP, align in an antiparallel
          dimer and condense the two GTPs into c-di-GMP with release of
          pyrophosphate. Catalysis requires divalent metal (Mg2+, and in many
          enzymes Mn2+) coordinated by the GG(D/E)EF motif. Many cyclases are
          inhibited non-competitively by c-di-GMP binding to an allosteric
          I-site (RxxD motif) within the GGDEF domain itself, and N-terminal sensory
          domains (receiver, CZB, globin, Cache and others) gate the activity in
          response to the cue each enzyme senses.
        evidence:
          - source_id: PMID:42429561
            statement: >-
              GGDEF dimerisation, antiparallel GTP alignment and Mg2+/Mn2+
              dependence of the cyclase reaction.
            supporting_text: >-
              Dimerization is crucial for c-di-GMP synthesis, as each GGDEF
              monomer binds one GTP molecule.
          - source_id: PMID:16923812
            title: Allosteric control of cyclic di-GMP signaling.
            statement: >-
              Defines the I-site as an allosteric c-di-GMP binding site within
              the GGDEF domain mediating non-competitive product inhibition,
              with an RXXD core motif conserved in most GGDEF proteins.
        annotons:
          - id: dgc_ggdef_activity
            label: GGDEF-domain diguanylate cyclase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GGDEF-domain diguanylate cyclases
                description: >-
                  Proteins whose GGDEF domain retains the GG(D/E)EF catalytic
                  motif and the DxD metal-binding residues. The domain is shared
                  with non-catalytic (degenerate) receptors, so the motif, not
                  domain presence, defines this role.
                term:
                  id: InterPro:IPR000160
                  label: GGDEF domain
                representative_members:
                  - preferred_term: PleD (Caulobacter crescentus)
                    term:
                      id: UniProtKB:Q9A5I5
                      label: Response regulator PleD
                    description: >-
                      Response regulator with a C-terminal GGDEF cyclase domain;
                      the founding structural and kinetic exemplar, activated by
                      phosphorylation and polarly localised.
                    evidence:
                      - source_id: PMID:15075296
                        title: >-
                          Cell cycle-dependent dynamic localization of a bacterial
                          response regulator with a novel di-guanylate cyclase
                          output domain.
                        statement: >-
                          Establishes the C-terminal GGDEF domain of PleD as a
                          c-di-GMP-synthesising cyclase coupled to polar
                          localisation.
                  - preferred_term: DgcZ (YdeH) (Escherichia coli)
                    term:
                      id: UniProtKB:P31129
                      label: Diguanylate cyclase DgcZ
                    description: >-
                      Single-domain GGDEF cyclase allosterically inhibited by
                      Zn2+ bound to its N-terminal CZB sensory domain; GOA
                      records GO:0052621 by IDA and EXP.
                    evidence:
                      - source_id: PMID:23769666
                        title: Structure and signaling mechanism of a zinc-sensory diguanylate cyclase.
                        statement: >-
                          Crystal structures and in vitro kinetics show Zn2+
                          binding to the 3His/1Cys CZB motif inhibits the
                          cyclase, linking a sensory input to c-di-GMP output.
                  - preferred_term: BdcA (Bordetella bronchiseptica)
                    term:
                      id: UniProtKB:A0A0H3LVU7
                      label: Diguanylate cyclase BdcA
                    description: >-
                      Membrane-associated Cache-GGDEF cyclase that raises
                      cellular c-di-GMP, represses motility and requires the
                      degenerate GGDEF/EAL protein DdpA (BB2109) for activity.
                    evidence:
                      - source_id: PMID:23475948
                        title: >-
                          Cyclic di-GMP signalling regulates motility and biofilm
                          formation in Bordetella bronchiseptica.
                        statement: >-
                          Identifies BB3576 as a GGDEF protein with diguanylate
                          cyclase activity controlling motility and biofilm
                          formation.
                      - source_id: PMID:31209073
                        title: >-
                          Bordetella bronchiseptica Diguanylate Cyclase BdcA
                          Regulates Motility and Is Important for the
                          Establishment of Respiratory Infection in Mice.
                        statement: >-
                          bdcA deletion raises motility and lowers c-di-GMP, and
                          BB2109 is required for BdcA-dependent motility
                          inhibition and biofilm formation.
            function:
              preferred_term: diguanylate cyclase activity
              term:
                id: GO:0052621
                label: diguanylate cyclase activity
              substrates:
                - preferred_term: GTP
                  term:
                    id: CHEBI:15996
                    label: GTP
              products:
                - preferred_term: c-di-GMP
                  term:
                    id: CHEBI:49537
                    label: c-di-GMP
              cofactors:
                - preferred_term: magnesium(2+)
                  term:
                    id: CHEBI:18420
                    label: magnesium(2+)
                - preferred_term: manganese(2+)
                  term:
                    id: CHEBI:29035
                    label: manganese(2+)
                  description: >-
                    Supports activity of many GGDEF enzymes and promotes
                    stronger dimerisation of PleD than Mg2+ alone.
                  evidence:
                    - source_id: PMID:42429561
                      supporting_text: >-
                        A well-characterized GGDEF-containing protein, PleD,
                        exhibits enhanced DGC activity with both Mg²⁺ and Mn²⁺,
                        with Mn²⁺ promoting stronger dimerization
            role_description: >-
              Sets the input arm of the module: converts the sensory state of its
              N-terminal domain into c-di-GMP production.
    - order: 2
      role: c-di-GMP degradation by EAL or HD-GYP phosphodiesterases
      node:
        id: c_di_gmp_degradation
        label: Phosphodiesterase turnover of c-di-GMP
        module_type: REACTION
        description: >-
          Two structurally unrelated phosphodiesterase families hydrolyse
          c-di-GMP. Both require divalent metal, and both are represented in
          most genomes that use the messenger, so the step is modelled as a
          variant set over the enzyme family rather than as two separate parts.
        variant_sets:
          - id: c_di_gmp_pde_families
            label: c-di-GMP phosphodiesterase family
            axis: enzyme family
            selection: ONE_OR_MORE
            notes: >-
              EAL and HD-GYP domains are unrelated folds that catalyse the same
              first hydrolytic step; which family (or both) a species uses is a
              genomic property, not a mechanistic alternative within one enzyme.
            variants:
              - id: eal_phosphodiesterase
                label: EAL-domain phosphodiesterase
                module_type: REACTION
                description: >-
                  The EAL domain opens one phosphodiester bond of c-di-GMP to
                  give the linear dinucleotide pGpG. Catalysis uses two
                  divalent metals coordinated by the EAL motif and the
                  conserved DDFG(T/A)GYSS loop, is faster with Mn2+ than Mg2+,
                  and is inhibited by Ca2+. Onward hydrolysis of pGpG by EAL
                  domains is very slow, so pGpG clearance is a separate
                  activity.
                annotons:
                  - id: eal_pde_activity
                    label: EAL-domain c-di-GMP phosphodiesterase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: EAL-domain c-di-GMP phosphodiesterases
                        description: >-
                          Proteins whose EAL domain retains the catalytic EAL
                          motif and the DDFGTGYSS metal-binding loop. Many EAL
                          domains are degenerate and bind without hydrolysing,
                          so this role requires the conserved residues.
                        term:
                          id: InterPro:IPR001633
                          label: EAL domain
                        representative_members:
                          - preferred_term: PdeH (YhjH) (Escherichia coli)
                            term:
                              id: UniProtKB:P37646
                              label: Cyclic di-GMP phosphodiesterase PdeH
                            description: >-
                              The dominant motility-associated EAL
                              phosphodiesterase of E. coli; GOA records
                              GO:0071111 by IDA from PMID:18765794.
                            evidence:
                              - source_id: PMID:18765794
                                title: >-
                                  Inverse regulatory coordination of motility and
                                  curli-mediated adhesion in Escherichia coli.
                                statement: >-
                                  Identifies YhjH as an EAL protein and c-di-GMP
                                  phosphodiesterase placed under FlhDC/FliA
                                  control, antagonising GGDEF proteins.
                                supporting_text: >-
                                  YhjH, an EAL protein and c-di-GMP
                                  phosphodiesterase under FlhDC/FliA control
                          - preferred_term: PdeL (YahA) (Escherichia coli)
                            term:
                              id: UniProtKB:P21514
                              label: Cyclic di-GMP phosphodiesterase PdeL
                            description: >-
                              The first EAL domain shown in vitro to be
                              sufficient for c-di-GMP-specific hydrolysis to
                              pGpG.
                            evidence:
                              - source_id: PMID:15995192
                                title: >-
                                  The ubiquitous protein domain EAL is a cyclic
                                  diguanylate-specific phosphodiesterase:
                                  enzymatically active and inactive EAL domains.
                                statement: >-
                                  Full-length YahA and its isolated EAL domain
                                  hydrolyse c-di-GMP to 5'pGpG, with activity
                                  dependent on Mg2+ or Mn2+ and strongly
                                  inhibited by Ca2+.
                    function:
                      preferred_term: cyclic-guanylate-specific phosphodiesterase activity
                      term:
                        id: GO:0071111
                        label: cyclic-guanylate-specific phosphodiesterase activity
                      substrates:
                        - preferred_term: c-di-GMP
                          term:
                            id: CHEBI:49537
                            label: c-di-GMP
                      products:
                        - preferred_term: pGpG
                          term:
                            id: CHEBI:48622
                            label: pGpG
                      cofactors:
                        - preferred_term: magnesium(2+)
                          term:
                            id: CHEBI:18420
                            label: magnesium(2+)
                        - preferred_term: manganese(2+)
                          term:
                            id: CHEBI:29035
                            label: manganese(2+)
                    role_description: >-
                      Lowers the c-di-GMP pool by one-step hydrolysis to the
                      linear dinucleotide pGpG.
              - id: hd_gyp_phosphodiesterase
                label: HD-GYP-domain phosphodiesterase
                module_type: REACTION
                description: >-
                  HD-GYP domains belong to the HD superfamily of
                  metal-dependent phosphohydrolases and hydrolyse c-di-GMP in
                  two steps through pGpG towards GMP. Characterised members use
                  Fe2+, Mn2+ or Mg2+, and some are active with only one of
                  these despite binding several.
                annotons:
                  - id: hd_gyp_pde_activity
                    label: HD-GYP-domain c-di-GMP phosphodiesterase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: HD-GYP-domain c-di-GMP phosphodiesterases
                        description: >-
                          HD-superfamily hydrolases carrying the tandem
                          histidine-aspartate pair and the active-site GYP
                          loop.
                        term:
                          id: InterPro:IPR037522
                          label: HD-GYP domain
                        representative_members:
                          - preferred_term: PA4781 (Pseudomonas aeruginosa)
                            term:
                              id: UniProtKB:Q9HV27
                              label: Cyclic di-GMP phosphodiesterase PA4781
                            description: >-
                              REC-HD-GYP protein with direct kinetics for
                              two-step hydrolysis of c-di-GMP via pGpG; GOA
                              records GO:0071111 by IDA from PMID:19170727.
                            evidence:
                              - source_id: PMID:24066157
                                title: >-
                                  C-di-GMP hydrolysis by Pseudomonas aeruginosa
                                  HD-GYP phosphodiesterases: analysis of the
                                  reaction mechanism and novel roles for pGpG.
                                statement: >-
                                  Both PA4781 and PA4108 hydrolyse c-di-GMP in
                                  two steps via the linear intermediate pGpG,
                                  and the unphosphorylated REC domain of PA4781
                                  blocks substrate access.
                              - source_id: PMID:19170727
                                title: >-
                                  HD-GYP domain proteins regulate biofilm
                                  formation and virulence in Pseudomonas
                                  aeruginosa.
                                statement: >-
                                  Mutation of PA4108 and PA4781 raises cellular
                                  c-di-GMP, consistent with phosphodiesterase
                                  function in vivo.
                    function:
                      preferred_term: cyclic-guanylate-specific phosphodiesterase activity
                      term:
                        id: GO:0071111
                        label: cyclic-guanylate-specific phosphodiesterase activity
                        description: >-
                          The GO term describes the c-di-GMP to pGpG step, which
                          is the first step HD-GYP enzymes catalyse; onward
                          hydrolysis of pGpG to GMP is an additional activity of
                          this family with no distinct GO term.
                      substrates:
                        - preferred_term: c-di-GMP
                          term:
                            id: CHEBI:49537
                            label: c-di-GMP
                      products:
                        - preferred_term: pGpG
                          term:
                            id: CHEBI:48622
                            label: pGpG
                        - preferred_term: guanosine 5'-monophosphate
                          term:
                            id: CHEBI:17345
                            label: guanosine 5'-monophosphate
                          description: >-
                            Produced by the slower second hydrolytic step on
                            pGpG.
                      cofactors:
                        - preferred_term: iron(2+)
                          term:
                            id: CHEBI:29033
                            label: iron(2+)
                        - preferred_term: manganese(2+)
                          term:
                            id: CHEBI:29035
                            label: manganese(2+)
                        - preferred_term: magnesium(2+)
                          term:
                            id: CHEBI:18420
                            label: magnesium(2+)
                    role_description: >-
                      Lowers the c-di-GMP pool and, unlike EAL enzymes, carries
                      the degradation through towards GMP.
        evidence:
          - source_id: PMID:41452322
            statement: >-
              Distinguishes the products of the two phosphodiesterase families.
            supporting_text: >-
              EAL-domain PDEs hydrolyze c-di-GMP to linear pGpG
              (5’-phosphoguanylyl-(3’,5’)-guanosine), whereas HD-GYP domain PDEs
              hydrolyze c-di-GMP into two GMP molecules
          - source_id: PMID:42429561
            statement: >-
              Metal requirements of the EAL and HD-GYP catalytic domains,
              including the Ca2+ inhibition that first linked metals to c-di-GMP
              turnover.
            supporting_text: >-
              Although most characterized HD-GYPs utilize Fe²⁺, Mn²⁺, or Mg²⁺
              for activity, other metals can influence the function of HD-GYPs
    - order: 3
      role: c-di-GMP recognition by protein receptors
      node:
        id: c_di_gmp_reception
        label: Protein receptors of c-di-GMP
        module_type: REGULATORY_STEP
        description: >-
          Receptors bind c-di-GMP and convert the occupancy of that site into a
          conformational change that alters a downstream target. Two protein
          classes with structural and binding evidence are modelled: PilZ-domain
          proteins, the canonical standalone c-di-GMP binding module, and
          proteins whose GGDEF or EAL domain has lost catalysis but retained
          ligand binding. Because the downstream targets differ from one
          receptor to the next, the annotons assert the binding activity and
          name each receptor's target in prose rather than claiming a shared
          output process.
        variant_sets:
          - id: c_di_gmp_receptor_classes
            label: c-di-GMP protein receptor class
            axis: receptor module
            selection: ONE_OR_MORE
            variants:
              - id: pilz_receptor
                label: PilZ-domain receptor
                module_type: REGULATORY_STEP
                description: >-
                  The PilZ domain is a dedicated c-di-GMP binding module, found
                  standalone (YcgR) and fused to effector proteins such as
                  cellulose synthase BcsA and the alginate polymerisation
                  subunit Alg44. Binding is of high affinity and the most
                  conserved PilZ residues contact the ligand directly.
                annotons:
                  - id: pilz_binding
                    label: PilZ-domain c-di-GMP binding
                    participant:
                      selector_type: DOMAIN
                      domain:
                        preferred_term: PilZ domain
                        term:
                          id: InterPro:IPR009875
                          label: PilZ domain
                        description: >-
                          Occurs alone or appended to effector proteins; the
                          domain itself is sufficient for c-di-GMP binding.
                      required_function:
                        preferred_term: cyclic-di-GMP binding
                        term:
                          id: GO:0035438
                          label: cyclic-di-GMP binding
                      description: >-
                        Representative standalone exemplar: Escherichia coli
                        YcgR (UniProtKB:P76010), whose GO:0035438 annotation is
                        IDA from PMID:16920715.
                    function:
                      preferred_term: cyclic-di-GMP binding
                      term:
                        id: GO:0035438
                        label: cyclic-di-GMP binding
                      substrates:
                        - preferred_term: c-di-GMP
                          term:
                            id: CHEBI:49537
                            label: c-di-GMP
                      evidence:
                        - source_id: PMID:16920715
                          title: >-
                            The PilZ domain is a receptor for the second
                            messenger c-di-GMP: the PilZ domain protein YcgR
                            controls motility in enterobacteria.
                          statement: >-
                            YcgR and its isolated PilZ domain bind c-di-GMP
                            tightly and specifically (Kd 0.84 uM for the
                            full-length protein), and the most conserved PilZ
                            residues are required for binding.
                    role_description: >-
                      Converts a rise in c-di-GMP into a conformational change
                      in the PilZ protein or in the effector it is fused to; in
                      E. coli YcgR this engages the flagellar motor as a brake,
                      but the output is receptor-specific and not a property of
                      the domain.
                    notes: >-
                      The flagellar-brake output is not assumed to be conserved:
                      the single Bordetella PilZ protein YcgR has no detectable
                      effect on flagellar motility.
                    evidence:
                      - source_id: PMID:20303158
                        title: Second messenger-mediated adjustment of bacterial swimming velocity.
                        statement: >-
                          c-di-GMP-bound YcgR interacts with the motor protein
                          MotA to curb flagellar output, the best-characterised
                          PilZ receptor output.
                      - source_id: PMID:41452322
                        statement: >-
                          The Bordetella PilZ protein does not control motility,
                          so PilZ output is receptor- and species-specific.
                        supporting_text: >-
                          Experimental evidence indicates that deletion of ycgR
                          does not affect flagellar motility, suggesting that
                          YcgR either lacks functional activity or is involved
                          in alternative, as yet unidentified, regulatory
                          pathways
              - id: degenerate_ggdef_eal_receptor
                label: Degenerate GGDEF/EAL receptor
                module_type: REGULATORY_STEP
                description: >-
                  Proteins that retain a GGDEF and/or EAL domain but have lost
                  the catalytic residues, and bind c-di-GMP instead of turning
                  it over. Binding at the degenerate domain is relayed to a
                  partner protein or to another domain of the same protein, so
                  this class carries most of the documented local (hub) rather
                  than global signalling.
                annotons:
                  - id: degenerate_eal_binding
                    label: Degenerate GGDEF/EAL c-di-GMP receptor binding
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: >-
                          catalytically degenerate GGDEF/EAL c-di-GMP receptors
                        description: >-
                          Defined by loss of the GGDEF and/or EAL catalytic
                          residues with retained ligand binding; the family is a
                          functional class, not a single PANTHER family, so no
                          family id is asserted.
                        representative_members:
                          - preferred_term: LapD (Pseudomonas fluorescens Pf0-1)
                            term:
                              id: UniProtKB:Q3KK31
                              label: Diguanylate cyclase/phosphodiesterase (LapD)
                            description: >-
                              Inner-membrane receptor with degenerate GGDEF and
                              EAL domains; binds c-di-GMP at the degenerate EAL
                              domain and relays the signal across the membrane
                              through a HAMP domain to sequester the
                              periplasmic protease LapG.
                            evidence:
                              - source_id: PMID:19218451
                                title: >-
                                  LapD is a bis-(3',5')-cyclic dimeric
                                  GMP-binding protein that regulates surface
                                  attachment by Pseudomonas fluorescens Pf0-1.
                                statement: >-
                                  Establishes LapD as a c-di-GMP effector with
                                  enzymatically inactive cyclase and EAL domains
                                  that binds the ligand through the degenerate
                                  EAL domain and signals inside-out.
                              - source_id: PMID:21304926
                                title: >-
                                  Structural basis for c-di-GMP-mediated
                                  inside-out signaling controlling periplasmic
                                  proteolysis.
                                statement: >-
                                  Crystal structures show c-di-GMP binding to
                                  the degenerate phosphodiesterase domain
                                  disrupts the autoinhibited state and licenses
                                  LapG sequestration.
                          - preferred_term: DdpA (BB2109) (Bordetella bronchiseptica)
                            term:
                              id: UniProtKB:A0A0H3LMJ1
                              label: Putative sensor histidine kinase BB2109
                            description: >-
                              Membrane protein with degenerate GGDEF and EAL
                              domains that is required for BdcA cyclase activity
                              and its motility/biofilm output, an example of a
                              degenerate-domain protein acting as a scaffold on
