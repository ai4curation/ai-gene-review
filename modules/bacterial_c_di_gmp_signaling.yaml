  connections:
    - source: c_di_gmp_synthesis
      target: c_di_gmp_degradation
      connection_type: NEGATIVELY_REGULATES
      description: >-
        The two enzyme arms act on the same pool in opposition; the steady-state
        c-di-GMP concentration is set by their relative activities rather than by
        either arm alone.
    - source: c_di_gmp_synthesis
      target: c_di_gmp_reception
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Cyclase-made c-di-GMP is the ligand the receptors bind, either from the
        shared cytoplasmic pool (global signalling) or delivered locally by a
        cyclase bound to the receptor.
    - source: c_di_gmp_degradation
      target: c_di_gmp_reception
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Phosphodiesterase activity lowers receptor occupancy, so receptors with
        different affinities are released in a hierarchy as the pool falls.
  knowledge_gaps:
    - gap_statement: >-
        The proximal ligands sensed by most GGDEF and EAL N-terminal sensory
        domains are unknown, including the Cache domain of the Bordetella
        cyclase BdcA, so the inputs that set the c-di-GMP level in a given
        condition cannot be enumerated.
      boundary: >-
        Describe cyclases and phosphodiesterases by catalytic activity and
        sensory-domain architecture; do not assert a specific input ligand
        except where one is experimentally identified (e.g. Zn2+ for DgcZ).
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Whether metal availability acts as a physiological signal, rather than
        only as a catalytic requirement, is unresolved for most enzymes; metals
        beyond Mg2+ and Mn2+ have been tested largely in vitro and often at
        non-physiological concentrations.
      boundary: >-
        Record metals as cofactors of the catalytic step and keep claims that a
        metal is a signal to the few cases with in vivo support, such as Zn2+
        acting on the DgcZ CZB domain.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The downstream targets of most c-di-GMP receptors are unidentified, and
        the single PilZ protein of Bordetella has no known output, so receptor
        presence does not predict which process the messenger controls in a
        given species.
      boundary: >-
        Assert c-di-GMP binding for receptor annotons and leave the controlled
        process to the output modules; do not transfer the YcgR flagellar-brake
        output to PilZ proteins generally.
      gap_kind:
        - BIOLOGY
