      supporting_text: The soluble domains of DgcK and of YdaK show a direct interaction in vitro, which
        depends on an intact I-site within the degenerated GGDEF domain of YdaK.
  - source: c_di_gmp_degradation
    target: c_di_gmp_reception
    connection_type: NEGATIVELY_REGULATES
    description: Hydrolysis can reduce occupancy of receptors coupled to the accessible messenger pool.
      The effect depends on enzyme–receptor organization and kinetics; a universal affinity-ranked response
      or homogeneous cellular pool is not asserted.
    evidence:
    - source_id: PMID:37251514
      title: Local signaling enhances output specificity of bacterial c-di-GMP signaling networks.
      statement: Comparative review distinguishes experimentally supported local enzyme–effector signalling
        from global concentration control; both can coexist.
      supporting_text: Such high specificity and flexibility arise from combining modes of local and global
        c-di-GMP signaling in complex signaling networks.
    - source_id: PMID:21304920
      title: A c-di-GMP effector system controls cell adhesion by inside-out signaling and surface protein
        cleavage.
      statement: The Pf0-1 circuit experimentally links PDE-driven c-di-GMP depletion to LapD signalling
        and adhesin release.
  knowledge_gaps:
  - gap_statement: The proximal ligands sensed by most GGDEF and EAL N-terminal sensory domains are unknown,
      including the Cache domain of the Bordetella cyclase BdcA, so the inputs that set the c-di-GMP level
      in a given condition cannot be enumerated.
    boundary: Describe cyclases and phosphodiesterases by catalytic activity and sensory-domain architecture;
      do not assert a specific input ligand except where one is experimentally identified (e.g. Zn2+ for
      DgcZ).
    gap_kind:
    - BIOLOGY
  - gap_statement: Whether metal availability acts as a physiological signal, rather than only as a catalytic
      requirement, is unresolved for most enzymes; metals beyond Mg2+ and Mn2+ have been tested largely
      in vitro and often at non-physiological concentrations.
    boundary: Record metals as cofactors of the catalytic step and keep claims that a metal is a signal
      to the few cases with in vivo support, such as Zn2+ acting on the DgcZ CZB domain.
    gap_kind:
    - BIOLOGY
  - gap_statement: The downstream targets of most c-di-GMP receptors are unidentified, and the single
      PilZ protein of Bordetella has no known output, so receptor presence does not predict which process
      the messenger controls in a given species.
    boundary: Assert c-di-GMP binding for receptor annotons and leave the controlled process to the output
      modules; do not transfer the YcgR flagellar-brake output to PilZ proteins generally.
    gap_kind:
    - BIOLOGY
  - gap_statement: The molecular action of DdpA is unresolved, including direct BdcA association, ligand
      binding and activity of its distinct histidine-kinase region.
    boundary: Keep the genetic requirement as optional context, without assigning an unmeasured binding
      or catalytic molecular function.
    gap_kind:
    - BIOLOGY
  - gap_statement: The endogenous RNA and DNA targets of PlzA and the physiological contribution of its
      assayed nucleic-acid activities remain unresolved; the reported ligand dependence of RNA binding
      also varies between assays.
    boundary: Retain the demonstrated in vitro activities as qualified gene-level proposals, while treating
      cyclic-di-GMP recognition as the established module role and avoiding a universal transcriptional
      or RNA-remodelling output.
    gap_kind:
    - BIOLOGY
