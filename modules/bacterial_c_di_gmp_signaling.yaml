- id: PMID:42429561
  title: Roles of divalent metals in the regulation of cyclic di-GMP signaling in bacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review used for scope and framing; primary studies support the mechanism-specific
      claims.
  findings:
  - statement: Review defining the module boundary as the balance of GGDEF diguanylate cyclases against
      EAL and HD-GYP phosphodiesterases, and summarising the divalent-metal requirements of each catalytic
      domain.
    supporting_text: The intracellular concentration of c-di-GMP is tightly controlled by opposing activities
      of diguanylate cyclases (DGCs), which synthesize c-di-GMP from GTP, and phosphodiesterases (PDEs),
      which degrade c-di-GMP into pGpG or GMP
  - statement: GGDEF dimerisation, antiparallel GTP alignment and Mg2+/Mn2+ dependence of the cyclase
      reaction.
    supporting_text: Dimerization is crucial for c-di-GMP synthesis, as each GGDEF monomer binds one GTP
      molecule.
  - statement: Metal requirements of the EAL and HD-GYP catalytic domains, including the Ca2+ inhibition
      that first linked metals to c-di-GMP turnover.
    supporting_text: Although most characterized HD-GYPs utilize Fe²⁺, Mn²⁺, or Mg²⁺ for activity, other
      metals can influence the function of HD-GYPs
- id: PMID:41452322
  title: Architecture and regulatory functions of c-di-GMP signaling in classical Bordetella species.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Comparative review used for scope and framing; primary studies support the mechanism-specific
      claims.
  findings:
  - statement: Review summarising the general synthesis/degradation/effector architecture and its Bordetella
      instantiation, including scaffold-dependent cyclase activation (BdcA-DdpA) and the degenerate-EAL
      receptor LapD controlling the LapG protease.
    supporting_text: Intracellular c-di-GMP levels are sensed by variety of effectors, including degenerate
      GGDEF/EAL domain proteins, transcription factors, PilZ domain proteins and riboswitches.
  - statement: Distinguishes the products of the two phosphodiesterase families.
    supporting_text: EAL-domain PDEs hydrolyze c-di-GMP to linear pGpG (5’-phosphoguanylyl-(3’,5’)-guanosine),
      whereas HD-GYP domain PDEs hydrolyze c-di-GMP into two GMP molecules
  - statement: The Bordetella PilZ protein does not control motility, so PilZ output is receptor- and
      species-specific.
    supporting_text: Experimental evidence indicates that deletion of ycgR does not affect flagellar motility,
      suggesting that YcgR either lacks functional activity or is involved in alternative, as yet unidentified,
      regulatory pathways
  - statement: DdpA (BB2109) is a catalytically degenerate GGDEF/EAL protein required for activation of
      BdcA cyclase activity and for the BdcA-dependent motility and biofilm phenotypes.
    supporting_text: DdpA (BB2109) of B. bronchiseptica is required for activation of catalytic activity
      of BdcA.
  - statement: The DdpA-BdcA relationship rests on a deletion phenotype, i.e. a functional rather than
      demonstrated physical interaction.
    supporting_text: Deletion of ddpA abolishes the BdcA-dependent inhibition of motility and stimulation
      of biofilm formation, indicating a functional interaction between the two proteins.
