  - order: 3
    role: c-di-GMP recognition by protein receptors
    node:
      id: c_di_gmp_reception
      label: Protein receptors of c-di-GMP
      module_type: REGULATORY_STEP
      description: 'Receptors bind c-di-GMP and convert the occupancy of that site into a conformational
        change that alters a downstream target. Two protein classes with structural and binding evidence
        are modelled: PilZ-domain proteins, the canonical standalone c-di-GMP binding module, and proteins
        whose GGDEF or EAL domain has lost catalysis but retained ligand binding. Because the downstream
        targets differ from one receptor to the next, the annotons assert the binding activity and name
        each receptor''s target in prose rather than claiming a shared output process.'
      variant_sets:
      - id: c_di_gmp_receptor_classes
        label: c-di-GMP protein receptor class
        axis: receptor module
        selection: ONE_OR_MORE
        variants:
        - id: pilz_receptor
          label: PilZ-domain receptor
          module_type: REGULATORY_STEP
          description: c-di-GMP-binding PilZ proteins provide receptor implementations with different
            output mechanisms. Some PilZ proteins lack ligand-binding capability, so direct binding evidence
            or a justified equivalent inference is required in addition to domain presence.
          annotons:
          - id: pilz_binding
            label: PilZ-domain c-di-GMP binding
            participant:
              selector_type: FAMILY
              required_domain:
                preferred_term: PilZ domain
                term:
                  id: InterPro:IPR009875
                  label: PilZ domain
                description: The PilZ domain is a structural constraint; conserved binding residues and
                  independent functional support are required. Domain presence alone does not establish
                  ligand binding.
              required_function:
                preferred_term: cyclic-di-GMP binding
                term:
                  id: GO:0035438
                  label: cyclic-di-GMP binding
              family:
                preferred_term: PilZ-domain c-di-GMP receptors
                description: Functional grouping of PilZ-domain proteins with independently supported
                  c-di-GMP binding, either standalone or fused to an output domain. No PANTHER assignment
                  was resolved for the selected representatives, so no family id is asserted.
                representative_members:
                - preferred_term: YcgR (Escherichia coli K-12)
                  term:
                    id: UniProtKB:P76010
                    label: Flagellar brake protein YcgR
                  description: Standalone PilZ receptor whose GO:0035438 annotation is IDA from PMID:16920715.
                - preferred_term: MotI/DgrA (Bacillus subtilis 168)
                  term:
                    id: UniProtKB:P38491
                    label: Motility inhibitor MotI
                  description: PilZ motor regulator; its clutch mechanism and strain mapping are assessed
                    in its review, rather than copied from E. coli YcgR.
                  evidence:
                  - source_id: PMID:23893111
                    title: Functional characterization of core components of the Bacillus subtilis cyclic-di-GMP
                      signaling pathway.
                    statement: B. subtilis provides a Bacillota example with active GGDEF cyclases, one
                      EAL phosphodiesterase and PilZ receptor; tested motility effects did not imply a
                      biofilm phenotype.
                    supporting_text: Furthermore, elevation of c-di-GMP levels in B. subtilis led to inhibition
                      of swarming motility, whereas biofilm formation was unaffected.
                  - source_id: PMID:32156823
                    title: Cyclic di-GMP Signaling in Bacillus subtilis Is Governed by Direct Interactions
                      of Diguanylate Cyclases and Cognate Receptors.
                    statement: DgcK interacts with the inactive-GGDEF receptor YdaK and with DgrA/MotI;
                      local interactions and global PdeH control can coexist.
                    supporting_text: The soluble domains of DgcK and of YdaK show a direct interaction
                      in vitro, which depends on an intact I-site within the degenerated GGDEF domain
                      of YdaK.
                - preferred_term: PlzA (Borrelia burgdorferi B31)
                  term:
                    id: UniProtKB:O51675
                    label: PilZN3 domain-containing protein
                  description: Specific c-di-GMP-binding PilZ effector. Its nucleic-acid effects are downstream
                    activities and are not generalized to the PilZ class.
                  evidence:
                  - source_id: PMID:20030712
                    title: 'Identification and molecular characterization of a cyclic-di-GMP effector
                      protein, PlzA (BB0733): additional evidence for the existence of a functional cyclic-di-GMP
                      regulatory network in the Lyme disease spirochete, Borrelia burgdorferi.'
                    statement: Recombinant B31 PlzA binds c-di-GMP specifically; PilZ-domain presence
                      alone does not establish ligand binding.
                    supporting_text: The occurrence of a PilZ domain within a protein is not in and of
                      itself sufficient to convey c-di-GMP binding, as other structural aspects of the
                      protein are important in the interaction.
            function:
              preferred_term: cyclic-di-GMP binding
              term:
                id: GO:0035438
                label: cyclic-di-GMP binding
              substrates:
              - preferred_term: c-di-GMP
                term:
                  id: CHEBI:49537
                  label: c-di-GMP
              evidence:
              - source_id: PMID:16920715
                title: 'The PilZ domain is a receptor for the second messenger c-di-GMP: the PilZ domain
                  protein YcgR controls motility in enterobacteria.'
                statement: YcgR and its isolated PilZ domain bind c-di-GMP tightly and specifically (Kd
                  0.84 uM for the full-length protein), and the most conserved PilZ residues are required
                  for binding.
            role_description: Converts a rise in c-di-GMP into a conformational change in the PilZ protein
              or in the effector it is fused to; in E. coli YcgR this engages the flagellar motor as a
              brake, but the output is receptor-specific and not a property of the domain.
            notes: 'The flagellar-brake output is not assumed to be conserved: the single Bordetella PilZ
              protein YcgR has no detectable effect on flagellar motility.'
            evidence:
            - source_id: PMID:20303158
              title: Second messenger-mediated adjustment of bacterial swimming velocity.
              statement: c-di-GMP-bound YcgR interacts with the motor protein MotA to curb flagellar output,
                the best-characterised PilZ receptor output.
            - source_id: PMID:41452322
              statement: The Bordetella PilZ protein does not control motility, so PilZ output is receptor-
                and species-specific.
              supporting_text: Experimental evidence indicates that deletion of ycgR does not affect flagellar
