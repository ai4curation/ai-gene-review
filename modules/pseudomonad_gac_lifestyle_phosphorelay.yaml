id: MODULE:pseudomonad_gac_lifestyle_phosphorelay
title: Pseudomonad GacS/GacA lifestyle-control phosphorelay
description: >-
  The pseudomonad Gac two-component system, a global switch between motile or
  acute and sessile or community behaviour. The inner-membrane hybrid sensor
  kinase GacS autophosphorylates and relays phosphate through its own receiver
  and HPt domains to the conserved receiver aspartate of the NarL/FixJ-type
  response regulator GacA. Phosphorylated GacA then activates transcription of
  genes for small RNAs that titrate RsmA/CsrA-family translational repressors.
  A second inner-membrane hybrid protein, RetS, has lost its own kinase
  activity and opposes the relay by binding GacS, removing phosphate from it
  and dephosphorylating its receiver domain. The module covers sensing, the
  His->Asp->His->Asp phosphotransfer, its antagonism by RetS, and GacA's
  transcriptional output. The Rsm protein arm and the individual downstream
  regulons (adhesins, type VI secretion, exopolysaccharides) are outside its
  boundary.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0000160
    title: phosphorelay signal transduction system
    statement: >-
      Defines the GacS/GacA two-component signalling relationship on which the
      module core is grounded.
  - source_id: PMID:11768529
    title: Regulatory roles of the GacS/GacA two-component system in plant-associated and other gram-negative bacteria.
    statement: >-
      Review establishing the GacS hybrid-kinase phosphorelay to GacA and its
      role as a global regulator across gram-negative bacteria.
    supporting_text: >-
      A current model proposes that GacS senses a still-unknown signal and
      activates, via a phosphorelay mechanism, the GacA transcription
      regulator, which in turn triggers the expression of target genes.
  - source_id: PMID:18047567
    title: 'Gac/Rsm signal transduction pathway of gamma-proteobacteria: from RNA recognition to regulation of social behaviour.'
    statement: >-
      GacS/GacA (BarA/UvrY in enterobacteria) positively controls sRNA genes
      that sequester RsmA/CsrA proteins; supports the transcriptional output
      and the gammaproteobacterial distribution of the system.
    supporting_text: >-
      In many gamma-proteobacteria, the conserved GacS/GacA (BarA/UvrY)
      two-component system positively controls the expression of one to five
      genes specifying small RNAs
  - source_id: PMID:29880803
    title: Multiple communication mechanisms between sensor kinases are crucial for virulence in Pseudomonas aeruginosa.
    statement: >-
      Defines the three mechanisms by which kinase-dead RetS attenuates GacS
      signalling.
    supporting_text: >-
      We demonstrate three mechanisms by which RetS attenuates
      GacS signalling: RetS takes phosphoryl groups from GacS-P; RetS has
      transmitter phosphatase activity against the receiver domain of GacS-P;
      and RetS inhibits GacS autophosphorylation.
  - source_id: PMID:36748579
    title: Transcriptional organization and regulation of the Pseudomonas putida K1 type VI secretion system gene cluster.
    statement: >-
      KT2440 genetics: GacS activates and RetS represses a shared output, so
      the antagonism holds in P. putida.
    supporting_text: >-
      This indicates that GacS is a positive regulator of K1-T6SS
      expression, and this activity is repressed only by RetS in the
      exponential phase of growth.
  - source_id: PMID:33693029
    title: Genome-Wide Analysis of Targets for Post-Transcriptional Regulation by Rsm Proteins in Pseudomonas putida.
    statement: >-
      KT2440 rsmY and rsmZ carry conserved GacA binding sites, grounding the
      transcriptional output in the reference strain.
    supporting_text: >-
      conserved GacA binding sites, involved in transcriptional regulation of
      Rsm-titrating RNAs in other Pseudomonas species (Brencic et al., 2009)
      could be identified in the regions upstream rsmY and rsmZ
  - source_id: file:PSEPK/gacS/gacS-ai-review.yaml
    statement: >-
      Grounds the GacS sensor kinase and HPt phosphotransfer roles and the
      plasma-membrane location.
  - source_id: file:PSEPK/gacA/gacA-ai-review.yaml
    statement: >-
      Grounds GacA phosphorelay response regulator activity (Asp54) and its
      DNA-binding transcriptional activator output.
  - source_id: file:PSEPK/retS/retS-ai-review.yaml
    statement: >-
      Grounds RetS as a kinase-dead transmitter phosphatase that negatively
      regulates the relay.
  - source_id: file:PSEPK/retS/retS-bioinformatics/RESULTS.md
    statement: >-
      KT2440 RetS lacks the HATPase G1 and G2 boxes that both GacS kinases
      carry and keeps the HExxT phosphatase H-box.
    supporting_text: >-
      KT2440 RetS lacks both G1 and G2 ATP-binding boxes in its HATPase
      region, exactly like the kinase-dead PAO1 RetS
notes: >-
  Scope. The module is CONCRETE and scoped to Pseudomonas. The underlying
  relay chemistry is the taxon-neutral MODULE:two_component_relay motif, which
  the inner phosphorelay bundle declares. The GacS/GacA pair itself is
  gammaproteobacterial: Escherichia coli BarA/UvrY (with CsrB/CsrC and CsrA)
  and Vibrio VarS/VarA are orthologous systems with experimental evidence
  (BarA autophosphorylates and phosphorylates UvrY specifically,
  PMID:11022030). They were not added as representative members because the
  module's antagonist input, RetS, is a pseudomonad feature with no
  counterpart in those systems, because their outputs differ (carbon storage
  and virulence rather than the pseudomonad lifestyle programs), and because
  none of those genes has a review in this repository. A taxon-neutral
  BarA/GacS-UvrY/GacA-Csr/Rsm module would be the right home for them.
  Modelling. GacS is a hybrid kinase: its receiver and HPt modules are domains
  of the sensor, so the template's histidine-phosphotransfer tier is filled by
  the GacS HPt domain (His863) rather than a separate protein, recorded as the
  conformance deviation. RetS has no HPt domain and, in the P. aeruginosa
  ortholog, no kinase activity (degenerate HATPase without G-boxes); KT2440
  RetS lacks the same motifs. It is therefore modelled by its transmitter
  phosphatase activity and as a negative regulator of the relay, not as a
  second sensor kinase. LadS-type positive inputs are not modelled because no
  KT2440 ortholog has been characterised.
  Families. GacS and RetS both fall in PANTHER:PTHR45339:SF1, a heterogeneous
  subfamily of active hybrid kinases, the kinase-dead RetS, the RcsD
  phosphotransferase and fungal response regulators. The family review
  (interpro/panther/PTHR45339/PTHR45339-review.yaml) scopes sensor kinase
  activity as RESIDUE_DETERMINED by the HATPase G1 and G2 boxes, with GacS as
  positive and RetS as negative controls. Because no PANTHER subfamily
  separates the kinases from the rest, no PTHR45339 id is asserted on any of
  the three GacS/RetS annotons; those roles are grounded by representative
  member and gene review. GacA belongs to PANTHER:PTHR43214:SF3 (RESPONSE
  REGULATOR UVRY), the BarA/UvrY subfamily of NarL/FixJ regulators, whose
  family-wide phosphorelay response regulator and DNA-binding transcription
  factor activities support both GacA annotons. Representative members are
  listed per role only (GacS is not listed as a RetS-role exemplar, nor RetS
  as a GacS-role exemplar).
  Boundary. GacA activates the RsmY/RsmZ sRNA genes; the sRNAs and the RsmA,
  RsmE and RsmI proteins of KT2440 that carry the signal post-transcriptionally
  are outside this boundary. Their gene reviews and a connected Rsm module are
  outstanding curation work. Adhesin (LapA/LapF), biofilm and K1-T6SS outputs
  documented in KT2440 are downstream of that arm and are recorded in the gene
  reviews rather than modelled here.
module:
  id: pseudomonad_gac_lifestyle_phosphorelay
  label: Pseudomonad GacS/GacA lifestyle-control phosphorelay
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: phosphorelay signal transduction system
      term:
        id: GO:0000160
        label: phosphorelay signal transduction system
      description: >-
        His->Asp->His->Asp phosphotransfer from the GacS hybrid sensor kinase to
        the GacA response regulator.
  context:
    taxa:
      - preferred_term: Pseudomonas
        term:
          id: NCBITaxon:286
          label: Pseudomonas
  parts:
    - order: 1
      role: GacS/GacA His-Asp phosphorelay
      node:
        id: gac_phosphorelay
        label: GacS/GacA phosphorelay
        module_type: SIGNALING_PATHWAY
        description: >-
          The membrane hybrid sensor kinase GacS autophosphorylates on its
          HisKA histidine, passes the phosphoryl group to its own receiver
          aspartate and HPt histidine, and from there to the receiver aspartate
          (Asp54) of GacA.
        conforms_to:
          - template: two_component_relay
            status: WITH_DEVIATIONS
            deviations:
              - >-
                The histidine-phosphotransfer (Hpt, GO:0009927) tier is not a
                discrete protein: it is the C-terminal HPt domain of the hybrid
                kinase GacS (His863), which also carries the receiver domain
                (Asp718) between the transmitter and the HPt. The sensor and
                Hpt tiers are therefore realised by one protein.
            notes: >-
              GacS transmitter (GO:0000155) -> GacS HPt domain (GO:0009927) ->
              GacA receiver (GO:0000156) fills the three template tiers in the
              template's order. The intramolecular receiver step between the
              first two tiers is not a separate tier of the template.
        parts:
          - order: 1
            role: GacS sensor-kinase autophosphorylation
            node:
              id: gacs_sensor
              label: GacS hybrid sensor kinase
              module_type: REGULATORY_STEP
              annotons:
                - id: gacs_sensor_kinase
                  label: GacS phosphorelay sensor kinase
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: GacS/BarA-type hybrid sensor kinases with intact HATPase G-boxes
                      representative_members:
                        - preferred_term: GacS (Pseudomonas putida KT2440)
                          term:
                            id: UniProtKB:Q88MC3
                            label: histidine kinase
                  function:
                    preferred_term: phosphorelay sensor kinase activity
                    term:
                      id: GO:0000155
                      label: phosphorelay sensor kinase activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  locations:
                    - preferred_term: plasma membrane
                      term:
                        id: GO:0005886
                        label: plasma membrane
                  role_description: >-
                    Senses an unidentified signal at the inner membrane and
                    autophosphorylates, initiating the relay toward GacA.
          - order: 2
            role: GacS HPt-domain phosphotransfer
            node:
              id: gacs_hpt
              label: GacS HPt domain
              module_type: REGULATORY_STEP
              annotons:
                - id: gacs_hpt_phosphotransfer
                  label: GacS HPt histidine phosphotransfer
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: C-terminal HPt domain of GacS-type hybrid sensor kinases
                      representative_members:
                        - preferred_term: GacS (Pseudomonas putida KT2440)
                          term:
                            id: UniProtKB:Q88MC3
                            label: histidine kinase
                  function:
                    preferred_term: histidine phosphotransfer kinase activity
                    term:
                      id: GO:0009927
                      label: histidine phosphotransfer kinase activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  locations:
                    - preferred_term: plasma membrane
                      term:
                        id: GO:0005886
                        label: plasma membrane
                  role_description: >-
                    The HPt domain of GacS receives phosphate from the GacS
                    receiver domain and donates it to the GacA receiver
                    aspartate.
          - order: 3
            role: GacA receiver-aspartate phosphorylation
            node:
              id: gaca_response_regulator
              label: GacA response regulator
              module_type: REGULATORY_STEP
              annotons:
                - id: gaca_response_regulator_activity
                  label: GacA phosphorelay response regulator
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: GacA/UvrY-type response-regulator subfamily
                      term:
                        id: PANTHER:PTHR43214:SF3
                        label: RESPONSE REGULATOR UVRY
                      representative_members:
                        - preferred_term: GacA (Pseudomonas putida KT2440)
                          term:
                            id: UniProtKB:Q88FJ6
                            label: Response regulator GacA
                  function:
                    preferred_term: phosphorelay response regulator activity
                    term:
                      id: GO:0000156
                      label: phosphorelay response regulator activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  locations:
                    - preferred_term: cytosol
                      term:
                        id: GO:0005829
                        label: cytosol
                  role_description: >-
                    Receives phosphate on its conserved receiver Asp54,
                    licensing the LuxR-type DNA-binding output domain.
        connections:
          - source: gacs_sensor
            target: gacs_hpt
            connection_type: CAUSES
            description: >-
              The phosphoryl group on the GacS HisKA histidine passes through
              the GacS receiver aspartate to the HPt histidine.
          - source: gacs_hpt
            target: gaca_response_regulator
            connection_type: CAUSES
            description: >-
              The GacS HPt domain transfers its phosphoryl group to the GacA
              receiver aspartate.
    - order: 2
      role: RetS antagonistic input
      node:
        id: rets_antagonist
        label: RetS antagonism of GacS
        module_type: REGULATORY_STEP
        description: >-
          A kinase-dead inner-membrane hybrid protein that binds GacS, captures
          phosphoryl groups from it, dephosphorylates its receiver domain and
          blocks its autophosphorylation, damping the GacA-dependent output.
        annotons:
          - id: rets_transmitter_phosphatase
            label: RetS transmitter phosphatase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: RetS-type kinase-dead hybrid sensors of pseudomonads
                representative_members:
                  - preferred_term: RetS (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88DK1
                      label: histidine kinase
            function:
              preferred_term: phosphoprotein phosphatase activity
              term:
                id: GO:0004721
                label: phosphoprotein phosphatase activity
            processes:
              - preferred_term: negative regulation of phosphorelay signal transduction system
                term:
                  id: GO:0070298
                  label: negative regulation of phosphorelay signal transduction system
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Removes phosphate from the GacS receiver domain by transmitter
              phosphatase activity (HExxT H-box) and opposes the relay rather
              than driving an output of its own.
    - order: 3
      role: GacA-dependent transcriptional output
      node:
        id: gaca_transcriptional_output
        label: GacA transcriptional activation
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Phosphorylated GacA binds conserved upstream sites and activates
          transcription of the Rsm-titrating sRNA genes (rsmY and rsmZ in
          KT2440), which leads, through the Rsm arm, to adhesin expression and
          biofilm formation.
        annotons:
          - id: gaca_transcription_factor
            label: GacA DNA-binding transcriptional activator
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GacA/UvrY-type response-regulator subfamily
                term:
                  id: PANTHER:PTHR43214:SF3
                  label: RESPONSE REGULATOR UVRY
                representative_members:
                  - preferred_term: GacA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88FJ6
                      label: Response regulator GacA
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: positive regulation of DNA-templated transcription
                term:
                  id: GO:0045893
                  label: positive regulation of DNA-templated transcription
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Activates transcription of the sRNA genes once its receiver
              domain is phosphorylated. Biofilm promotion lies downstream,
              through the Rsm arm outside this module.
  connections:
    - source: gac_phosphorelay
      target: gaca_transcriptional_output
      connection_type: POSITIVELY_REGULATES
      description: >-
        Phosphorylation of the GacA receiver domain licenses its
        transcriptional activator output.
    - source: rets_antagonist
      target: gacs_sensor
      connection_type: NEGATIVELY_REGULATES
      description: >-
        RetS binds GacS, takes phosphoryl groups from it, dephosphorylates its
        receiver domain and inhibits its autophosphorylation.
  knowledge_gaps:
    - gap_statement: >-
        The signal sensed by the periplasmic domain of GacS, and the ligand of
        the RetS 7TMR-DISM domain that may tune its antagonism, are unknown in
        any pseudomonad.
      boundary: >-
        Describe both sensors by molecular function and membrane location,
        without asserting a ligand.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Whether KT2440 RetS acts on GacS by the same three mechanisms shown for
        P. aeruginosa RetS (phosphoryl capture, transmitter phosphatase
        activity, inhibition of autophosphorylation) has not been tested; the
        assignment rests on orthology and motif conservation.
      boundary: >-
        Type RetS by transmitter phosphatase activity on ISS evidence and keep
        the KT2440 genetic phenotype as the only strain-level support.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The direct DNA targets of phosphorylated GacA in KT2440 beyond the
        rsmY and rsmZ promoters are unmapped, so which KT2440 outputs are
        direct and which pass through the Rsm proteins or RpoS is unknown.
      boundary: >-
        Model only sRNA-gene activation as the direct output.
      gap_kind:
        - BIOLOGY
