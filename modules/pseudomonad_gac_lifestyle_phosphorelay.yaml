id: MODULE:pseudomonad_gac_lifestyle_phosphorelay
title: Pseudomonad GacS/GacA lifestyle-control phosphorelay
description: >-
  The pseudomonad Gac two-component system, a global lifestyle switch between
  motile/acute and sessile/community behaviour. The membrane hybrid sensor kinase
  GacS autophosphorylates and relays phosphate through its own receiver and HPt
  modules to the conserved receiver aspartate of the LuxR-type response regulator
  GacA, which then acts as a DNA-binding transcriptional regulator of
  surface-associated behaviours including adhesin expression and biofilm
  development. A second membrane hybrid sensor kinase, RetS, acts on the same
  relay as an opposing input rather than as an independent pathway. The module
  covers sensing, His->Asp phosphotransfer, and the transcriptional output; the
  individual downstream regulons (type VI secretion, exopolysaccharide synthesis,
  c-di-GMP effectors) are separate modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0000160
    title: phosphorelay signal transduction system
    statement: >-
      Defines the GacS/GacA two-component signalling relationship on which the
      module core is grounded.
  - source_id: GO:0000155
    title: phosphorelay sensor kinase activity
    statement: Defines the sensing/autophosphorylation role of GacS and RetS.
  - source_id: GO:0000156
    title: phosphorelay response regulator activity
    statement: Defines the phosphoacceptor role of GacA.
  - source_id: file:PSEPK/gacS/gacS-ai-review.yaml
    statement: >-
      Grounds the PSEPK GacS hybrid sensor-kinase exemplar, its plasma-membrane
      location, and its HAMP/kinase/receiver/HPt domain architecture.
  - source_id: file:PSEPK/gacA/gacA-ai-review.yaml
    statement: >-
      Grounds the PSEPK GacA response-regulator exemplar, the conserved Asp54
      phosphoacceptor, and the adhesin/biofilm transcriptional output.
  - source_id: file:PSEPK/retS/retS-ai-review.yaml
    statement: >-
      Grounds the PSEPK RetS hybrid sensor-kinase exemplar as an opposing input
      to the same relay.
notes: >-
  The module is scoped to Pseudomonas because the GacS/GacA/RetS arrangement and
  its lifestyle output are characterised in that genus; the underlying relay
  chemistry is the taxon-neutral MODULE:two_component_relay motif, which the
  inner phosphorelay bundle declares. GacS and RetS are hybrid kinases whose HPt
  module is a domain of the sensor protein rather than a discrete
  histidine-phosphotransfer protein, so the bundle collapses the template's
  three protein tiers into two, recorded as a deviation. The KT2440 outputs that
  are experimentally supported gene-by-gene (adhesin/biofilm control for GacA,
  K1-T6SS repression for RetS) are recorded in the gene reviews; only the
  adhesin/biofilm arm is modelled here as the transcriptional output, because it
  is the arm with direct transcriptional evidence for the regulator itself.
  RsmA/RsmE and the CrcZ/CrcY-class small RNAs that carry the Gac signal
  post-transcriptionally in other pseudomonads are deliberately outside this
  boundary: they have no reviewed gene grounding in this repository yet.
module:
  id: pseudomonad_gac_lifestyle_phosphorelay
  label: Pseudomonad GacS/GacA lifestyle-control phosphorelay
  module_type: SIGNALING_PATHWAY
  concepts:
    - preferred_term: phosphorelay signal transduction system
      term:
        id: GO:0000160
        label: phosphorelay signal transduction system
      description: >-
        His->Asp phosphotransfer from the GacS hybrid sensor kinase to the GacA
        response regulator.
  context:
    taxa:
      - preferred_term: Pseudomonas
        term:
          id: NCBITaxon:286
          label: Pseudomonas
  parts:
    - order: 1
      role: GacS/GacA His-Asp phosphorelay
      node:
        id: gac_phosphorelay
        label: GacS/GacA phosphorelay
        module_type: SIGNALING_PATHWAY
        description: >-
          The membrane hybrid sensor kinase GacS autophosphorylates on its
          conserved histidine and delivers phosphate, through its intramolecular
          receiver and HPt modules, to the conserved receiver aspartate of GacA.
        conforms_to:
          - template: two_component_relay
            status: WITH_DEVIATIONS
            deviations:
              - >-
                The histidine-phosphotransfer (Hpt, GO:0009927) tier is not a
                discrete protein: GacS is a hybrid kinase carrying its own
                receiver and HPt domains, so the template's three protein tiers
                are realised by two proteins.
            notes: >-
              GacS (sensor, GO:0000155) -> GacA (response regulator,
              GO:0000156) fills the phosphorelay tiers with the canonical
              His->Asp transfer topology. The multistep His->Asp->His->Asp
              chemistry is retained but occurs within GacS rather than across a
              separate Hpt protein.
        parts:
          - order: 1
            role: GacS sensor-kinase autophosphorylation
            node:
              id: gacs_sensor
              label: GacS hybrid sensor kinase
              module_type: REGULATORY_STEP
              annotons:
                - id: gacs_sensor_kinase
                  label: GacS phosphorelay sensor kinase
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: pseudomonad GacS/RetS hybrid sensor-kinase family
                      term:
                        id: PANTHER:PTHR45339:SF1
                        label: HYBRID SIGNAL TRANSDUCTION HISTIDINE KINASE J
                      representative_members:
                        - preferred_term: GacS (Pseudomonas putida KT2440)
                          term:
                            id: UniProtKB:Q88MC3
                            label: Sensor protein GacS
                  function:
                    preferred_term: phosphorelay sensor kinase activity
                    term:
                      id: GO:0000155
                      label: phosphorelay sensor kinase activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  locations:
                    - preferred_term: plasma membrane
                      term:
                        id: GO:0005886
                        label: plasma membrane
                  role_description: >-
                    Senses the membrane-proximal input and autophosphorylates,
                    initiating the relay toward GacA.
          - order: 2
            role: GacA receiver-aspartate phosphorylation
            node:
              id: gaca_response_regulator
              label: GacA response regulator
              module_type: REGULATORY_STEP
              annotons:
                - id: gaca_response_regulator_activity
                  label: GacA phosphorelay response regulator
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: GacA/UvrY-type response-regulator family
                      term:
                        id: PANTHER:PTHR43214:SF3
                        label: RESPONSE REGULATOR UVRY
                      representative_members:
                        - preferred_term: GacA (Pseudomonas putida KT2440)
                          term:
                            id: UniProtKB:Q88FJ6
                            label: Response regulator GacA
                  function:
                    preferred_term: phosphorelay response regulator activity
                    term:
                      id: GO:0000156
                      label: phosphorelay response regulator activity
                  processes:
                    - preferred_term: phosphorelay signal transduction system
                      term:
                        id: GO:0000160
                        label: phosphorelay signal transduction system
                  role_description: >-
                    Receives phosphate on its conserved receiver aspartate,
                    licensing the DNA-binding output domain.
        connections:
          - source: gacs_sensor
            target: gaca_response_regulator
            connection_type: CAUSES
            description: >-
              GacS transfers its phosphoryl group, via its intramolecular HPt
              module, to the GacA receiver aspartate.
    - order: 2
      role: RetS opposing sensor input
      node:
        id: rets_opposing_sensor
        label: RetS opposing sensor kinase
        module_type: REGULATORY_STEP
        description: >-
          A second membrane hybrid sensor kinase that acts on the Gac relay as an
          antagonistic input, damping the GacA-dependent output.
        annotons:
          - id: rets_sensor_kinase
            label: RetS phosphorelay sensor kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: pseudomonad GacS/RetS hybrid sensor-kinase family
                term:
                  id: PANTHER:PTHR45339:SF1
                  label: HYBRID SIGNAL TRANSDUCTION HISTIDINE KINASE J
                representative_members:
                  - preferred_term: RetS (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88DK1
                      label: Sensor protein RetS
            function:
              preferred_term: phosphorelay sensor kinase activity
              term:
                id: GO:0000155
                label: phosphorelay sensor kinase activity
            processes:
              - preferred_term: phosphorelay signal transduction system
                term:
                  id: GO:0000160
                  label: phosphorelay signal transduction system
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Provides an opposing sensory input to the Gac relay rather than
              driving an independent phosphorelay output.
    - order: 3
      role: GacA-dependent transcriptional output
      node:
        id: gaca_transcriptional_output
        label: GacA transcriptional output
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Phosphorylated GacA acts through its LuxR-type DNA-binding domain as a
          transcriptional activator of surface-associated community behaviour.
        annotons:
          - id: gaca_transcription_factor
            label: GacA DNA-binding transcriptional regulator
            participant:
              selector_type: FAMILY
              family:
                preferred_term: GacA/UvrY-type response-regulator family
                term:
                  id: PANTHER:PTHR43214:SF3
                  label: RESPONSE REGULATOR UVRY
                representative_members:
                  - preferred_term: GacA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88FJ6
                      label: Response regulator GacA
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: positive regulation of single-species biofilm formation
                term:
                  id: GO:1900192
                  label: positive regulation of single-species biofilm formation
            role_description: >-
              Activates adhesin and biofilm-associated genes once the receiver
              domain is phosphorylated.
  connections:
    - source: gac_phosphorelay
      target: gaca_transcriptional_output
      connection_type: POSITIVELY_REGULATES
      description: >-
        Phosphorylation of the GacA receiver domain licenses its transcriptional
        activator output.
    - source: rets_opposing_sensor
      target: gac_phosphorelay
      connection_type: NEGATIVELY_REGULATES
      description: >-
        RetS signalling opposes the GacS/GacA relay, lowering the
        GacA-dependent output.
  knowledge_gaps:
    - gap_statement: >-
        The proximal stimulus sensed by GacS, and the mechanism by which RetS
        opposes the relay, are not established for Pseudomonas putida KT2440.
      boundary: >-
        Describe both sensors conservatively by molecular function and membrane
        location, without asserting a specific ligand or a direct
        GacS-RetS heterodimerisation mechanism.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        The post-transcriptional arm that carries the Gac signal in other
        pseudomonads (RsmA/RsmE repressors and their decoy small RNAs) has no
        reviewed gene grounding in this repository.
      boundary: >-
        Keep the module boundary at sensing, phosphotransfer, and the
        transcriptional output; add the Rsm arm as a connected module once its
        members are reviewed.
      gap_kind:
        - CURATION
