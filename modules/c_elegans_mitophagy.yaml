id: MODULE:c_elegans_mitophagy
title: Mitophagy in Caenorhabditis elegans
description: >-
  Mitophagy is the selective macroautophagy of mitochondria. In Caenorhabditis
  elegans damaged or unwanted mitochondria are marked on their outer membrane
  and captured by phagophores decorated with the Atg8-family protein LGG-1.
  Two kinds of mark are known. In the ubiquitin-dependent route, the
  mitochondrial kinase PINK-1 and the RBR-family E3 ubiquitin ligase PDR-1
  (Parkin) act on stressed mitochondria, by analogy with mammalian PINK1 and
  Parkin. In the receptor-mediated route, outer-membrane proteins bridge the
  mitochondrion directly to the phagophore. DCT-1, the BNIP3/NIX ortholog, is
  required for stress-induced mitophagy in adult somatic tissues and acts
  genetically with PINK-1 and PDR-1. FNDC-1, the FUNDC1 ortholog, acts in
  hypoxia-reoxygenation mitophagy and in a late, ubiquitin-independent phase
  of paternal mitochondrial elimination in the embryo. The earlier,
  ubiquitin-dependent phase of paternal organelle clearance (allophagy) uses
  the receptor ALLO-1, which binds LGG-1 through an LC3-interacting region
  and is regulated by the TBK1-family kinase IKKE-1. Mitophagy of stress-damaged
  mitochondria in muscle also depends on the FIS1-family outer-membrane
  proteins FIS-1 and FIS-2, which are not needed for fission in this species
  but act at a late step after MFF/DRP-1-dependent fission; without them,
  stalled LGG-1-positive intermediates containing mitochondrial fragments
  accumulate. Mitophagy is coupled to mitochondrial biogenesis through
  SKN-1-dependent transcription of dct-1, and its decline with age contributes
  to the accumulation of damaged mitochondria.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:25896323
    title: Coordination of mitophagy and mitochondrial biogenesis during ageing in C. elegans.
    statement: >-
      DCT-1 is a key mediator of stress-induced mitophagy in C. elegans, and
      mitophagy is coupled to mitochondrial biogenesis through SKN-1.
    supporting_text: >-
      We find that DCT-1 is a key mediator of mitophagy and longevity assurance
      under conditions of stress in C. elegans.
  - source_id: PMID:25896323
    title: Coordination of mitophagy and mitochondrial biogenesis during ageing in C. elegans.
    statement: >-
      Impaired mitophagy triggers SKN-1 retrograde signalling that raises
      both mitochondrial biogenesis and DCT-1 expression.
    supporting_text: >-
      triggers mitochondrial retrograde signalling through the SKN-1
      transcription factor that regulates both mitochondrial biogenesis genes
      and mitophagy by enhancing DCT-1 expression
  - source_id: PMID:33734301
    title: Autophagy facilitates mitochondrial rebuilding after acute heat stress via a DRP-1-dependent process.
    statement: >-
      Secondary statement of the earlier primary finding that severe heat
      stress induces mitophagy in muscle that depends on DCT-1, PINK-1 and
      PDR-1, and that DCT-1/NIX and FUNDC1 are the known worm mitophagy
      receptors.
    supporting_text: >-
      a severe and prolonged HS induces a DCT-1
  - source_id: PMID:24196833
    title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
    statement: >-
      Nascent mitophagosomes are seen in worm muscle as LGG-1 spots on the
      mitochondrial surface. They are absent in pink-1 mutants.
    supporting_text: >-
      pink-1 single and pink-1 fis-1 fis-2 triple mutant animals had no
      colocalizing spots, as expected for a complete block of mitophagy
  - source_id: PMID:31153831
    title: Ubiquitination is required for the initial removal of paternal organelles in C. elegans.
    statement: >-
      Paternal mitochondria are removed by two temporally distinct routes, an
      early ubiquitin-dependent route and a later FNDC-1-dependent route.
    supporting_text: >-
      there are at least two different mechanisms for targeting paternal
      mitochondria for elimination: the first involving ubiquitination and a
      second involving a mitochondrial associated autophagy receptor, fndc-1
  - source_id: file:genes/worm/pink-1/pink-1-ai-review.yaml
    title: worm pink-1 gene review
    statement: >-
      Core function: protein serine/threonine kinase activity in mitophagy at
      mitochondria. The ubiquitin and Parkin Ser65 phosphorylation mechanism
      is carried over from mammalian PINK1.
  - source_id: file:genes/worm/pdr-1/pdr-1-ai-review.yaml
    title: worm pdr-1 gene review
    statement: >-
      Core function: RBR-family ubiquitin protein ligase activity in
      mitophagy, in the cytosol and on the mitochondrial outer membrane.
  - source_id: file:genes/worm/dct-1/dct-1-ai-review.yaml
    title: worm dct-1 gene review
    statement: >-
      Core function: mitochondrion autophagosome adaptor activity
      (GO:0140580) in mitophagy at the mitochondrial outer membrane. The
      review records PINK-1-dependent ubiquitination of DCT-1 at Lys-26 under
      oxidative stress, from the full text of PMID:25896323.
  - source_id: file:genes/worm/fndc-1/fndc-1-ai-review.yaml
    title: worm fndc-1 gene review
    statement: >-
      Core function: mitochondrion autophagosome adaptor activity
      (GO:0140580) in mitophagy at the mitochondrial outer membrane.
  - source_id: file:genes/worm/lgg-1/lgg-1-ai-review.yaml
    title: worm lgg-1 gene review
    statement: >-
      Core function: PE-conjugated Atg8-family modifier on autophagosome
      membranes. The review accepts its mitophagy annotations and its direct
      binding to the ALLO-1 and SQST-1 receptors.
  - source_id: file:genes/worm/sqst-1/sqst-1-ai-review.yaml
    title: worm sqst-1 gene review
    statement: >-
      Keeps the IBA mitophagy annotation as non-core because a role for
      SQST-1 in worm mitophagy has not been shown. SQST-1 is therefore not a
      member of this module.
  - source_id: file:projects/CAEEL_MITOPHAGY.md
    title: C. elegans Mitophagy and Mitochondrial Quality Control project page
    statement: >-
      Project page listing the worm mitophagy and mitochondrial dynamics
      gene reviews from which this module draws.
notes: >-
  Boundary. This is a concrete C. elegans module for the selective capture of
  mitochondria by the autophagy machinery. It starts at the marking of a
  mitochondrion (PINK-1/PDR-1 ubiquitin signalling, or an outer-membrane
  receptor) and ends at receptor engagement of LGG-1 on the phagophore and the
  FIS-1/FIS-2-dependent completion of disposal. Building the autophagosome
  (ATG-1/EPG-1 initiation, BEC-1/VPS-34 PI3P synthesis, ATG-9, ATG-2/ATG-18,
  and the ATG-7/ATG-3/ATG-16 lipidation cascade) is the subject of
  MODULE:c_elegans_autophagosome_biogenesis and is not re-modeled here; LGG-1
  appears only in its role as the docking site that receptors bind.
  Autophagosome-lysosome fusion (EPG-5, LGG-2, HOPS) and degradation are also
  downstream and outside this boundary. The phagophore-ER contact that
  supplies lipid for phagophore growth is MODULE:phagophore_organelle_contact_site.
  FIS-1 acts at the ER-mitochondria interface (MAM), but that contact is a
  separate structure from the phagophore-ER contact site module.

  Fission. Stress-induced mitophagy in muscle uses MFF-dependent DRP-1
  fission upstream of the FIS-1/FIS-2 step. The fission machinery itself is in
  MODULE:c_elegans_mitochondrial_dynamics. Fission is not required for every
  route: oxidative-stress-induced neuronal mitophagy is drp-1-independent but
  partly pink-1-dependent (PMID:35916724). Fission is therefore recorded as
  context, not as a required part.

  Mechanism carried over from mammals. In worms, PINK-1 and PDR-1 are placed
  in mitophagy by genetics (reporters, epistasis, LGG-1 colocalization) and by
  PDR-1 E3 ligase activity toward other substrates. Ubiquitin Ser65
  phosphorylation by PINK-1, phosphorylation-driven PDR-1 activation, and
  ubiquitination of named outer-membrane substrates have not been shown
  biochemically in C. elegans. The PINK-1 and PDR-1 molecular functions below
  follow the gene reviews. The step order is taken from the mammalian
  pathway.

  Members left out. SQST-1 (p62) is excluded because its review keeps the
  mitophagy annotation as non-core with no worm evidence; its demonstrated
  worm role is aggrephagy. LGG-2 acts downstream of LGG-1 in autophagosome
  maturation and is left to the autophagy modules. MIRO-1 is a Parkin
  substrate in mammals but has not been shown to act in worm mitophagy.
  ATFS-1, SKN-1 and DAF-16 regulate mitophagy gene expression and are
  regulatory context, not mitophagy machinery. IKKE-1 (P32742) regulates
  ALLO-1 by phosphorylation and is described in the ALLO-1 annoton, not
  modeled as its own member. The E2 enzymes UBC-18 and UBC-16 that
  ubiquitinate paternal membranous organelles are also not modeled
  separately. ALLO-1 (Q9U389) is included even though it has no gene review in
  this repository. Its role rests on PMID:29255173 and on the accepted
  LGG-1-ALLO-1 interaction in the lgg-1 review.

  Accessions. LGG-1 is Q09490, the accession used by the lgg-1 review and
  UniProt. The project page gives a different accession.
module:
  id: c_elegans_mitophagy
  label: Mitophagy in C. elegans
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Selective macroautophagy of mitochondria in C. elegans. Damaged or
    unwanted mitochondria are marked by PINK-1/PDR-1 ubiquitin signalling or
    by outer-membrane receptors (DCT-1, FNDC-1, ALLO-1), the receptors engage
    LGG-1 on the phagophore, and FIS-1/FIS-2 complete orderly disposal of
    fission-derived mitochondrial fragments.
  concepts:
    - preferred_term: mitophagy
      term:
        id: GO:0000423
        label: mitophagy
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    cellular_components:
      - preferred_term: mitochondrial outer membrane
        term:
          id: GO:0005741
          label: mitochondrial outer membrane
        description: >-
          Shared site of marking. PINK-1 accumulates there, PDR-1 is recruited
          there, and DCT-1, FNDC-1, FIS-1 and FIS-2 are outer-membrane
          proteins.
    conditions:
      - preferred_term: oxidative, heat or mitochondrial toxin stress in adult tissues
      - preferred_term: hypoxia-reoxygenation
      - preferred_term: fertilization (paternal mitochondrial elimination in the embryo)
  parts:
    - order: 1
      role: ubiquitin-dependent marking of damaged mitochondria
      node:
        id: pink1_pdr1_marking
        label: PINK-1/PDR-1 ubiquitin signalling on damaged mitochondria
        module_type: SIGNALING_PATHWAY
        description: >-
          PINK-1 is a mitochondrially targeted serine/threonine kinase.
          Mammalian PINK1 is stabilized on the outer membrane of depolarized
          mitochondria, phosphorylates ubiquitin and Parkin at Ser65, and so
          activates Parkin. PDR-1 is the worm Parkin, an RBR E3 ubiquitin
          ligase. In C. elegans, pink-1 is required for the formation of
          nascent LGG-1-positive mitophagosomes on muscle mitochondria and for
          stress-induced autophagy. PDR-1 joins the stalled mitophagy
          intermediates seen in fis-1 fis-2 mutants. Under oxidative stress
          the receptor DCT-1 is ubiquitinated in a PINK-1-dependent manner.
        concepts:
          - preferred_term: type 2 mitophagy
            term:
              id: GO:0061734
              label: type 2 mitophagy
            description: >-
              The GO term for damage-initiated, Parkin-dependent mitophagy. It
              is applied by orthology: in worms the initiating signal is
              oxidative, heat or toxin stress, and mitochondrial
              depolarization has not been tested as the trigger.
        evidence:
          - source_id: PMID:24196833
            title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
            statement: >-
              Stalled mitophagy intermediates in fis-1 fis-2 mutants are the
              product of PINK-1-induced mitophagy.
            supporting_text: >-
              do indicate that LGG-1 aggregates in Fis1 mutants are an
              aberrant product of Pink1-induced mitophagy
          - source_id: PMID:35916724
            title: >-
              Selective disruption of Drp1-independent mitophagy and
              mitolysosome trafficking by an Alzheimer's disease relevant tau
              modification in a novel Caenorhabditis elegans model.
            statement: >-
              Oxidative-stress-induced neuronal mitophagy is drp-1-independent
              and at least partly pink-1-dependent.
            supporting_text: >-
              Both oxidative-stress-induced mitophagy and the ability of T231E to
              suppress it were independent of drp-1, but at least partially
              dependent on pink-1.
        annotons:
          - id: pink1_kinase
            label: PINK-1 serine/threonine kinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PINK-1
                term:
                  id: UniProtKB:Q09298
                  label: Serine/threonine-protein kinase pink-1, mitochondrial
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              description: >-
                Substrates (ubiquitin, PDR-1) are inferred from mammalian
                PINK1 and have not been shown biochemically for the worm
                protein.
            processes:
              - preferred_term: mitophagy
                term:
                  id: GO:0000423
                  label: mitophagy
            locations:
              - preferred_term: mitochondrion
                term:
                  id: GO:0005739
                  label: mitochondrion
            role_description: >-
              Stress sensor and initiating kinase. It is needed for nascent
              mitophagosomes to form on mitochondria and for stress-induced
              autophagy.
            evidence:
              - source_id: PMID:24196833
                title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
                statement: >-
                  pink-1 loss abolishes LGG-1/TOM-70 colocalizing spots
                  (nascent mitophagosomes) on muscle mitochondria.
                supporting_text: >-
                  pink-1 single and pink-1 fis-1 fis-2 triple mutant animals had
                  no colocalizing spots, as expected for a complete block of
                  mitophagy
              - source_id: PMID:26469957
                title: >-
                  A bacterial metabolite induces glutathione-tractable
                  proteostatic damage, proteasomal disturbances, and
                  PINK1-dependent autophagy in C. elegans.
                statement: >-
                  Metabolite-induced LGG-1 puncta require pink-1.
                supporting_text: >-
                  Notably, animals with reduced pink-1 no longer have increased
                  mCherry::LGG-1 accumulation in the presence of the metabolite.
          - id: pdr1_ligase
            label: PDR-1 (Parkin) RBR E3 ubiquitin ligase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PDR-1
                term:
                  id: UniProtKB:Q9XUS3
                  label: E3 ubiquitin-protein ligase parkin
            function:
              preferred_term: ubiquitin protein ligase activity
              term:
                id: GO:0061630
                label: ubiquitin protein ligase activity
              description: >-
                Ligase activity has been shown in worms toward CED-10/Rac1 in
                the engulfment pathway. The outer-membrane substrates it
                modifies during mitophagy are not identified.
            processes:
              - preferred_term: mitophagy
                term:
                  id: GO:0000423
                  label: mitophagy
              - preferred_term: protein ubiquitination
                term:
                  id: GO:0016567
                  label: protein ubiquitination
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
              - preferred_term: mitochondrial outer membrane
                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
            role_description: >-
              E3 ligase that is recruited from the cytosol to stressed
              mitochondria. Its ubiquitination of outer-membrane proteins is
              presumed to mark them for receptor recognition.
            evidence:
              - source_id: PMID:16204351
                title: >-
                  A Caenorhabditis elegans Parkin mutant with altered
                  solubility couples alpha-synuclein aggregation to
                  proteotoxic stress.
                statement: >-
                  PDR-1 cooperates with ubiquitylation co-enzymes to mediate
                  ubiquitin conjugation.
                supporting_text: >-
                  PDR-1 protein physically associates and cooperates with a
                  conserved degradation machinery to mediate ubiquitin
                  conjugation.
              - source_id: PMID:24625979
                title: >-
                  PDR-1/hParkin negatively regulates the phagocytosis of
                  apoptotic cell corpses in Caenorhabditis elegans.
                statement: >-
                  The E3-null pdr-1(lg103) allele fails to ubiquitylate
                  CED-10, which shows worm PDR-1 ligase activity in vivo.
                supporting_text: >-
                  As expected, the E3 ligase-null mutant of PDR-1 (lg103) failed
                  to induce CED-10 ubiquitylation
              - source_id: PMID:24196833
                title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
                statement: >-
                  Tagged PDR-1 is found in the stalled mitophagy intermediates
                  of fis-1 fis-2 mutants.
                supporting_text: >-
                  CFP-tagged Parkin also accumulates in LGG-1 aggregates in the
                  Fis1 mutants
    - order: 2
      role: outer-membrane receptor recognition of mitochondria
      node:
        id: mitophagy_receptor_recognition
        label: Mitophagy receptor and adaptor recognition
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Outer-membrane receptor proteins bridge the mitochondrion to
          LGG-1-decorated phagophore membranes. The worm receptors are used in
          different contexts and are not interchangeable alternatives for one
          step. They are grouped as a variant set because each one supplies
          the mitochondrion-to-phagophore link.
        variant_sets:
          - id: mitophagy_receptors
            label: Context-specific worm mitophagy receptors
            axis: receptor, tissue and developmental context
            selection: ONE_OR_MORE
            notes: >-
              DCT-1 acts in adult somatic stress-induced mitophagy, genetically
              with PINK-1/PDR-1. FNDC-1 acts in hypoxia-reoxygenation
              mitophagy and in the late, ubiquitin-independent phase of
              paternal mitochondrial elimination. ALLO-1 acts in the early,
              ubiquitin-dependent phase of paternal organelle clearance
              (allophagy), which also removes the sperm membranous
              organelles.
            variants:
              - id: dct1_receptor
                label: DCT-1 (BNIP3/NIX) stress-induced mitophagy receptor
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  DCT-1 is a tail-anchored outer-membrane protein with a WXXL
                  LIR-like motif. It is required for stress-induced mitophagy
                  and its dct-1 expression is raised by SKN-1 when mitophagy is
                  impaired.
                annotons:
                  - id: dct1_adaptor
                    label: DCT-1 mitochondrion-autophagosome adaptor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: DCT-1
                        term:
                          id: UniProtKB:Q09969
                          label: NIP3 homolog
                    function:
                      preferred_term: mitochondrion autophagosome adaptor activity
                      term:
                        id: GO:0140580
                        label: mitochondrion autophagosome adaptor activity
                    processes:
                      - preferred_term: mitophagy
                        term:
                          id: GO:0000423
                          label: mitophagy
                    locations:
                      - preferred_term: mitochondrial outer membrane
                        term:
                          id: GO:0005741
                          label: mitochondrial outer membrane
                    role_description: >-
                      Main somatic mitophagy receptor in the adult. It links
                      PINK-1/PDR-1-marked mitochondria to LGG-1.
                    evidence:
                      - source_id: PMID:25896323
                        title: Coordination of mitophagy and mitochondrial biogenesis during ageing in C. elegans.
                        statement: >-
                          DCT-1 is a key mediator of mitophagy under stress.
                        supporting_text: >-
                          We find that DCT-1 is a key mediator of mitophagy and
                          longevity assurance under conditions of stress
              - id: fndc1_receptor
                label: FNDC-1 (FUNDC1) ubiquitin-independent mitophagy receptor
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  FNDC-1 is a FUN14-family multi-pass outer-membrane protein.
                  It is expressed in somatic tissues and strongly in sperm, and
                  it contributes to hypoxic mitophagy and to the late removal
                  of paternal mitochondria.
                annotons:
                  - id: fndc1_adaptor
                    label: FNDC-1 mitochondrion-autophagosome adaptor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: FNDC-1
                        term:
                          id: UniProtKB:Q22252
                          label: FUN14 domain-containing protein fndc-1
                    function:
                      preferred_term: mitochondrion autophagosome adaptor activity
                      term:
                        id: GO:0140580
                        label: mitochondrion autophagosome adaptor activity
                      description: >-
                        Assigned by orthology to FUNDC1 and by genetic
                        requirement. A direct FNDC-1-LGG-1 interaction has not
                        been reported in the cached literature.
                    processes:
                      - preferred_term: mitophagy
                        term:
                          id: GO:0000423
                          label: mitophagy
                    locations:
                      - preferred_term: mitochondrial outer membrane
                        term:
                          id: GO:0005741
                          label: mitochondrial outer membrane
                    role_description: >-
                      Ubiquitin-independent receptor for hypoxic mitophagy and
                      for the late phase of paternal mitochondrial
                      elimination.
                    evidence:
                      - source_id: PMID:31233739
                        title: Fndc-1 contributes to paternal mitochondria elimination in C. elegans.
                        statement: >-
                          FNDC-1 mediates hypoxic mitophagy and contributes to
                          paternal mitochondria elimination, as a
                          ubiquitin-independent receptor.
                        supporting_text: >-
                          This is the first example of a ubiquitin-independent
                          mitophagy receptor playing a role in the selective
                          degradation of sperm mitochondria.
                      - source_id: PMID:31153831
                        title: Ubiquitination is required for the initial removal of paternal organelles in C. elegans.
                        statement: >-
                          Paternal mitochondria that escape the early route are
                          removed later by an fndc-1-dependent process.
                        supporting_text: >-
                          they are eventually removed from the embryo in a
                          process that depends on the mitophagy adaptor
                          protein, fndc-1
                      - source_id: PMID:33416042
                        title: FNDC-1-mediated mitophagy and ATFS-1 coordinate to protect against hypoxia-reoxygenation.
                        statement: >-
                          FNDC-1 is the worm FUNDC1 ortholog that responds to
                          hypoxia-reoxygenation.
                        supporting_text: >-
                          we provide evidence that FNDC-1 is the C. elegans
                          ortholog of FUNDC1
              - id: allo1_receptor
                label: ALLO-1 allophagy receptor for paternal organelles
                module_type: BIOLOGICAL_PROCESS
                description: >-
                  ALLO-1 gathers on ubiquitinated paternal organelles
                  (mitochondria and membranous organelles) soon after
                  fertilization, before the autophagosome forms. It binds LGG-1
                  through its LIR motif. IKKE-1, the TBK1/IKKepsilon homolog,
                  binds and phosphorylates ALLO-1, and this phosphorylation is
                  important for clearance.
                annotons:
                  - id: allo1_adaptor
                    label: ALLO-1 cargo adaptor
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ALLO-1
                        term:
                          id: UniProtKB:Q9U389
                          label: Allophagy receptor allo-1
                    function:
                      preferred_term: autophagy cargo adaptor activity
                      term:
                        id: GO:0160247
                        label: autophagy cargo adaptor activity
                      description: >-
                        The cargo is paternal organelles, both mitochondria
                        and membranous organelles, so the general cargo-adaptor
                        term is used rather than the mitochondrion-specific
                        adaptor term.
                    processes:
                      - preferred_term: mitophagy
                        term:
                          id: GO:0000423
                          label: mitophagy
                    role_description: >-
                      Ubiquitin-dependent receptor that links paternal
                      organelles to LGG-1 in the early embryo.
                    evidence:
                      - source_id: PMID:29255173
                        title: >-
                          The autophagy receptor ALLO-1 and the IKKE-1 kinase
                          control clearance of paternal mitochondria in
                          Caenorhabditis elegans.
                        statement: >-
                          ALLO-1 is required for autophagosome formation around
                          paternal organelles and binds LGG-1 through its LIR.
                        supporting_text: >-
                          ALLO-1 is essential for autophagosome formation around
                          paternal organelles and directly binds to the worm LC3
                          homologue LGG-1 through its LC3-interacting region (LIR)
                          motif.
                      - source_id: PMID:29255173
                        title: >-
                          The autophagy receptor ALLO-1 and the IKKE-1 kinase
                          control clearance of paternal mitochondria in
                          Caenorhabditis elegans.
                        statement: >-
                          ALLO-1 localization depends on ubiquitination of
                          paternal organelles.
                        supporting_text: >-
                          this localization depends on the ubiquitin modification
                          of the paternal organelles
    - order: 3
      role: receptor capture by the Atg8-family protein on the phagophore
      node:
        id: lgg1_capture
        label: LGG-1 docking of mitophagy receptors on the phagophore
        module_type: BIOLOGICAL_PROCESS
        description: >-
          LGG-1, the GABARAP-family Atg8 ortholog, is conjugated to
          phosphatidylethanolamine on the phagophore membrane and serves as the
          binding site for LIR-containing receptors. In muscle, nascent
          mitophagosomes appear as LGG-1 spots on the mitochondrial surface. In
          the embryo, LGG-1 is recruited to paternal organelles. How the
          phagophore is built and LGG-1 is lipidated belongs to the
          autophagosome biogenesis module.
        annotons:
          - id: lgg1_atg8
            label: LGG-1 phagophore-anchored Atg8-family protein
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LGG-1
                term:
                  id: UniProtKB:Q09490
                  label: Protein lgg-1
            function:
              preferred_term: phosphatidylethanolamine binding
              term:
                id: GO:0008429
                label: phosphatidylethanolamine binding
              description: >-
                The core function in the lgg-1 review. Covalent PE anchoring
                puts LGG-1 on the phagophore. Its receptor-binding (LIR
                docking) role has no specific GO molecular function term and
                is described in role_description.
            processes:
              - preferred_term: mitophagy
                term:
                  id: GO:0000423
                  label: mitophagy
            locations:
              - preferred_term: autophagosome membrane
                term:
                  id: GO:0000421
                  label: autophagosome membrane
            role_description: >-
              Membrane-anchored binding site for the mitophagy receptors. ALLO-1
              binds it directly through its LIR. DCT-1 carries a LIR-like motif.
            evidence:
              - source_id: PMID:24196833
                title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
                statement: >-
                  Nascent mitophagosomes in muscle are detected as LGG-1 spots
                  on the mitochondrial surface.
                supporting_text: >-
