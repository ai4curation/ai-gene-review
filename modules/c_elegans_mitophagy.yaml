    - order: 4
      role: completion of orderly disposal of fission-derived mitochondrial fragments
      node:
        id: fis1_disposal
        label: FIS-1/FIS-2-dependent disposal of damaged mitochondria
        module_type: BIOLOGICAL_PROCESS
        description: >-
          After stress-induced, MFF/DRP-1-dependent fission, the FIS1-family
          outer-membrane proteins FIS-1 and FIS-2 act redundantly at a late
          step of mitophagy, before fusion with lysosomes. Fis1 joins a
          DRP-1-containing complex at the ER-mitochondria interface but is not
          needed for DRP-1 recruitment or for fission. In fis-1 fis-2 mutants,
          large LGG-1-positive aggregates containing mitochondrial fragments,
          DRP-1 and PDR-1 build up. Their formation requires mff, drp-1 and
          pink-1. FIS-1 is also needed to remove UV-C-induced mitochondrial DNA
          damage.
