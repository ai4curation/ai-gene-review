                term:
                  id: GO:0005741
                  label: mitochondrial outer membrane
            role_description: >-
              Late-acting outer-membrane factor that keeps disposal of
              fission-derived fragments orderly. Acts redundantly with FIS-2.
            evidence:
              - source_id: PMID:24196833
                title: Mutations in Fis1 disrupt orderly disposal of defective mitochondria.
                statement: >-
                  Fis1 acts late in removal and is not needed for DRP-1 entry
                  into the MAM or for fission.
                supporting_text: >-
                  Fis1 is part of the MAM complex and contributes to a late stage
                  of the removal process but is not required for entry of Drp1
