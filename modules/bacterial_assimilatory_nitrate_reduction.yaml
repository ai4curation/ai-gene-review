- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC7152768/?report=xml
  title: A recently evolved diflavin-containing monomeric nitrate reductase is responsible for highly
    efficient bacterial nitrate assimilation
  findings:
  - statement: Purified recombinant M. smegmatis NasN is a diflavin-containing monomeric nitrate reductase;
      native genetics establishes nitrate assimilation.
    supporting_text: NasN is an NADPH-dependent, diflavin-containing monomeric enzyme composed of a canonical
      molybdopterin cofactor-binding catalytic domain and an FMN–FAD/NAD-binding, electron-receiving/transferring
      domain
  - statement: The main NasN reaction is NADPH-dependent, with a measured weaker NADH-supported reaction.
    supporting_text: Among the physiological electron donors tested for the purified NasN, NADPH was preferred
      over NADH, as shown by a 26-fold greater activity with NADPH relative to NADH
  - statement: NasN remains oxygen-sensitive despite greater tolerance than the comparator enzyme. Aerobic
      growth does not imply oxygen-stable purified catalysis.
    supporting_text: NasN was shown to be oxygen-sensitive, as air-exposure of the purified enzyme resulted
      in a significant decrease in both NADPH- and NADH-dependent NaR activities
  - statement: Native cytoplasmic-fraction assays connect NasN to the NADPH-dependent nitrate activity.
    supporting_text: when NADPH was used as an electron donor, both cytoplasmic fractions from M. smegmatis
      WT and narG-null mutant showed similar detectable NaR activity, but not that of the nasN-null mutant
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full primary article underlying PMID:32111737. Native mc2 155 genetics and purified
      NasN biochemistry; corrected-sequence identity is independently reconciled. Relative oxygen tolerance
      does not mean oxygen stability.
