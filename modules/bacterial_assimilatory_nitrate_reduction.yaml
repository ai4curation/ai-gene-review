- id: PMID:14871493
  title: 'Complex formation between ferredoxin and Synechococcus ferredoxin: nitrate oxidoreductase.'
  findings:
  - statement: NarB catalyzes nitrate-to-nitrite reduction with ferredoxin. Donor experiments include
      heterologous Anabaena ferredoxin, not an exclusive native ferredoxin assignment.
    supporting_text: 'When

