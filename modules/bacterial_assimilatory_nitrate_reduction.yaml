      label: KT2440 PP_1703–NirBD route
      module_type: METABOLIC_PATHWAY
      description: Native genetic/physiological support plus explicit fused-enzyme and NirBD-assembly
        inferences. No direct full-fusion donor preference, purified native NirBD assembly requirement
        or Y-9-to-KT2440 assay substitution is claimed.
