    title: Identification of the Ferredoxin-Binding Site of a Ferredoxin-Dependent Cyanobacterial Nitrate
      Reductase.
    statement: Nitrate assimilation proceeds through nitrate-to-nitrite reduction followed by nitrite-to-ammonia
      reduction. This is reaction continuity, not evidence for a physical complex between the enzymes.
    supporting_text: The first step is catalyzed by nitrate reductase (NR) and involves the initial two-electron
      reduction of nitrate to nitrite.
  - source_id: PMID:34323689
    title: NirD curtails the stringent response by inhibiting RelA activity in Escherichia coli.
    statement: Nitrate-fed E. coli can use nitrate as nitrogen source during nitrate respiration. Respiratory
      nitrate reduction supplies nitrite to NirBD; NarU plus NirBD is not a complete nitrate-reduction
      route.
    supporting_text: Under nitrate respiration, nitrate is converted to nitrite, which is subsequently
      converted to ammonium (NH4) by the cytosolic NADH-dependent nitrite reductase NirBD. Bacteria can
      then utilize NH4 as nitrogen source.
  notes: Chemical continuity between reactions does not imply a stable reductase supercomplex or channeling.
    No ammonium incorporation, respiratory nitrate-reductase assembly, denitrification branch or Anabaena
    maturation protein is modeled.
evidence:
- source_id: PMID:9006953
  title: Substrate-binding lipoprotein of the cyanobacterium Synechococcus sp. strain PCC 7942 involved
    in the transport of nitrate and nitrite.
  statement: Native PCC 7942 NrtABCD is required for the high-affinity nitrate/nitrite uptake system;
    NrtA is its substrate-binding lipoprotein.
  supporting_text: 'Of the four genes (nrtABCD) required for active transport of nitrate in the

    cyanobacterium Synechococcus sp. strain PCC 7942, nrtBCD encode membrane

    components of an ATP-binding cassette transporter involved in the transport of

    nitrite as well as of nitrate'
- source_id: PMID:8624415
  title: A cyanobacterial narB gene encodes a ferredoxin-dependent nitrate reductase.
  statement: Purified PCC 7942 NarB reduces nitrate with reduced ferredoxin; methyl viologen can bypass
    the physiological electron-input interaction.
  supporting_text: 'either reduced methyl viologen or reduced

    ferredoxin could be used as an electron donor for the reduction of nitrate'
- source_id: PMID:8490140
  title: 'Nitrite reductase gene from Synechococcus sp. PCC 7942: homology between cyanobacterial and
    higher-plant nitrite reductases.'
  statement: The native PCC 7942 nirA product is a nitrite reductase with conserved siroheme/[4Fe-4S]
    active-center residues; ferredoxin-class assignment combines this homology with curated target classification.
  supporting_text: 'Identities found at positions corresponding to those

    amino acids which in the above-mentioned proteins hold the Fe4S4-siroheme active

    center suggest that nitrite reductase from Synechococcus bears an active site

    much alike that present in those reductases.'
- source_id: file:BACSU/nasB/nasB-source-analysis/native-nas-system.md
  title: native-nas-system.md
  statement: NasB and NasC are both required for native assimilatory nitrate reduction after polarity
    controls. Primary assay donor was methyl viologen, not direct NADH kinetics.
  supporting_text: NasB and NasC were independently required for nitrate utilization after downstream
    expression was restored.
- source_id: PMID:9765565
  title: Nitrogen and oxygen regulation of Bacillus subtilis nasDEF encoding NADH-dependent nitrite reductase
    by TnrA and ResDE.
  statement: Both NasD and NasE are needed for native nitrite reductase activity, with downstream-expression
    controls. No exact oligomeric stoichiometry is established.
  supporting_text: both nasD and nasE genes are required for enzyme activity.
- source_id: PMID:9765565
  title: Nitrogen and oxygen regulation of Bacillus subtilis nasDEF encoding NADH-dependent nitrite reductase
    by TnrA and ResDE.
  statement: Bacillus lysate nitrite-reductase activity is predominantly NADH-dependent. The minor NADPH-supported
    signal does not establish a NasDE-specific NADPH reaction.
  supporting_text: Activity with NADPH was less than 10% of that with NADH.
- source_id: PMID:35285712
  title: 'Nitrogen Metabolism in Pseudomonas putida: Functional Analysis Using Random Barcode Transposon
    Sequencing.'
  statement: Native KT2440 pooled-mutant fitness supports PP_2092 nitrate uptake. This is not a clean
    deletion proving absolute transport necessity.
  supporting_text: We were also able to identify a distinct nitrate transporter PP_2092 (−2.6).
- source_id: file:PSEPK/PP_1703/PP_1703-source-analysis/README.md
  title: README.md
  statement: The historic catalytic region maps exactly to Q88M71 residues 1–724, supporting target identity
    at that region without claiming a full-fusion biochemical assay.
  supporting_text: AF203789 encodes 724 residues identical to Q88M71 residues 1–724.
- source_id: PMID:38000372
  title: Cyclic di-GMP inhibits nitrate assimilation by impairing the antitermination function of NasT
    in Pseudomonas putida.
  statement: Native KT2440 experiments support nirBD expression during nitrate assimilation and lysate
    nitrite reductase activity. They perturb NasT/c-di-GMP rather than individually reconstituting both
    subunits.
  supporting_text: "NasT was \nessential for expressing the nirBD operon encoding nitrite reductase during\
    \ \nnitrate assimilation."
- source_id: file:modules/bacterial_assimilatory_nitrate_reduction-source-analysis/nasN-identity-proof.json
  title: nasN-identity-proof.json
  statement: Corrected DQ866862 encodes the 1351-residue protein A4ZHT3 exactly; this resolves the MSMEG_4206/NasN
    identity and overrides the ARBA-only sulfite label.
  supporting_text: '"translation_exactly_matches_uniprot": true'
- source_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC7152768/?report=xml
  title: A recently evolved diflavin-containing monomeric nitrate reductase is responsible for highly
    efficient bacterial nitrate assimilation
  statement: The main NasN reaction is NADPH-dependent, with a measured weaker NADH-supported reaction.
  supporting_text: Among the physiological electron donors tested for the purified NasN, NADPH was preferred
    over NADH, as shown by a 26-fold greater activity with NADPH relative to NADH
- source_id: DOI:10.1186/1471-2164-14-301
  title: Genome wide analysis of the complete GlnR nitrogen-response regulon in Mycobacterium smegmatis
  statement: Native GlnR-linked expression supports NirBD recruitment in nitrogen limitation. Activity
    and paired assembly are inferred from target-specific NirB/NirD classifications, not a purified mc2
    155 complex assay.
  supporting_text: 'the nitrite reductase NirBD

    enzyme is up regulated by GlnR in nitrogen limitation'
- source_id: PMID:34323689
  title: NirD curtails the stringent response by inhibiting RelA activity in Escherichia coli.
  statement: Nitrate-fed E. coli can use nitrate as nitrogen source during nitrate respiration. Respiratory
    nitrate reduction supplies nitrite to NirBD; NarU plus NirBD is not a complete nitrate-reduction route.
