        - source_id: PMID:34323689
          title: NirD curtails the stringent response by inhibiting RelA activity in Escherichia coli.
          statement: Nitrate-fed E. coli can use nitrate as nitrogen source during nitrate respiration.
            Respiratory nitrate reduction supplies nitrite to NirBD; NarU plus NirBD is not a complete
            nitrate-reduction route.
          supporting_text: Under nitrate respiration, nitrate is converted to nitrite, which is subsequently
            converted to ammonium (NH4) by the cytosolic NADH-dependent nitrite reductase NirBD. Bacteria
            can then utilize NH4 as nitrogen source.
