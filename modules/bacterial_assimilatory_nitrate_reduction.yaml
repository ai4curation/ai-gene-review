id: MODULE:bacterial_assimilatory_nitrate_reduction
title: Bacterial assimilatory nitrate uptake and reduction
description: Bacterial nitrate utilization supplies ammonium for biosynthesis through successive nitrate-to-nitrite
  and nitrite-to-ammonium reductions. Four species-native implementations distinguish ferredoxin-dependent
  cyanobacterial enzymes, a multisubunit Bacillus nitrate reductase, and fused pyridine-nucleotide-linked
  nitrate reductases in Pseudomonas and Mycolicibacterium. Uptake assemblies are required when extracellular
  nitrate is the input; an intracellular-nitrate boundary permits omission of uptake. A separate E. coli
  comparison illustrates nitrate-fed assimilation during respiration and depends on an upstream respiratory
  nitrate reductase outside the represented protein panel. The module ends at ammonium, before its incorporation
  into glutamine or glutamate.
status: DRAFT
scope: CONCRETE
module:
  id: bacterial_assimilatory_nitrate_reduction
  label: Species-native nitrate-to-ammonium routes
  module_type: METABOLIC_PATHWAY
  description: A complete route requires both reductions from one native species implementation. Cross-species
    subunit substitutions and combining independently chosen upstream and downstream families are not
    allowed.
  variant_sets:
  - id: native_nitrate_to_ammonium_routes
    label: Complete species-native reduction route
    axis: organism and native enzyme architecture
    selection: EXACTLY_ONE
    variants:
