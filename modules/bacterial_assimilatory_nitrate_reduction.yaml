- id: url:https://idus.us.es/bitstream/handle/11441/129668/Involvement%20of%20the%20C-terminal%20Domain.pdf?sequence=1
  title: Involvement of the C-terminal Domain of an ATP-binding Subunit in the Regulation of the ABC-type
    Nitrate/Nitrite Transporter of the Cyanobacterium Synechococcus sp. Strain PCC 7942*
  findings:
  - statement: Native PCC 7942 derivative experiments measure both reductases using an artificial donor.
      This supports reaction continuity but does not establish exclusive native ferredoxin specificity.
    supporting_text: NR and NiR activities were determined at 30 °C
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full institutional PDF text of PMID:9341163 inspected, including strain identity and
      methods. R2-SPc is a plasmid-cured PCC 7942 derivative. Both reductase assays use reduced methyl
      viologen; the nitrate-transporter manipulations do not constitute a purified NirA donor-preference
      experiment.
- id: PMID:7868621
  title: The nasB operon and nasA gene are required for nitrate/nitrite assimilation in Bacillus subtilis.
  findings:
  - statement: Primary native genetics establishes the nasABCDEF nitrate/nitrite-assimilation system.
      Detailed polarity controls and artificial-donor limits are recorded separately from the cached abstract.
    supporting_text: 'The isolation of the nasABCDEF genes of B. subtilis, which are

      required for nitrate/nitrite assimilation, is reported.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Canonical cache is abstract-only. The publisher PDF was read in the BACSU source-analysis
      handoff; detailed subunit conclusions are attributed to that separate analysis, not misquoted as
      cached full text. Experiments are JH642-derived in the 168 lineage.
- id: file:PSEPK/PP_1703/PP_1703-source-analysis/RESULTS.md
  title: Modern PP_1703 CDS check
  findings:
  - statement: The continuous modern KT2440 CDS translates exactly to the complete Q88M71 fusion, supporting
      the single-CDS model despite historical split records; this is genomic-model evidence, not a full-length
      protein-expression or kinetic assay.
    supporting_text: Bacterial-code translation gives 1,341 residues and a terminal TGA, no internal stop,
      and exact identity to both AAN67324.2 and Q88M71.
notes: The 21 exact products preserve all 14 original exemplars and add seven native partners. PANTHER
  descriptors use the official OBO names and immutable target DR memberships solely as metadata; surprising
  family names do not overrule primary chemistry. No PTN ancestral placement is asserted. Native complexes
  require all named active units, without guessed stoichiometry. Evidence distinguishes direct experiments,
  source-analysis identity bridges, comparative mechanism inference and unresolved donor/assembly specificity.
