          title: 'Nitrogen Metabolism in Pseudomonas putida: Functional Analysis Using Random Barcode
            Transposon Sequencing.'
          statement: Native KT2440 pooled-mutant fitness supports PP_2092 nitrate uptake. This is not
            a clean deletion proving absolute transport necessity.
          supporting_text: We were also able to identify a distinct nitrate transporter PP_2092 (−2.6).
        - source_id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC101894/?report=xml
          title: Inactivation of gltB Abolishes Expression of the Assimilatory Nitrate Reductase Gene
            (nasB) in Pseudomonas putida KT2442
          statement: Historical KT2442 disruption/complementation supports an assimilatory nitrate-reductase
            catalytic region; the clone was not the full modern fusion.
          supporting_text: In conclusion, these results clearly demonstrate that P. putida N25 bears the
            mini-Tn5 luxAB transposon within the assimilatory nitrate reductase.
        - source_id: file:PSEPK/PP_1703/PP_1703-source-analysis/README.md
          title: README.md
          statement: The historic catalytic region maps exactly to Q88M71 residues 1–724, supporting target
            identity at that region without claiming a full-fusion biochemical assay.
          supporting_text: AF203789 encodes 724 residues identical to Q88M71 residues 1–724.
        - source_id: PMID:38000372
          title: Cyclic di-GMP inhibits nitrate assimilation by impairing the antitermination function
            of NasT in Pseudomonas putida.
          statement: Native KT2440 experiments support nirBD expression during nitrate assimilation and
            lysate nitrite reductase activity. They perturb NasT/c-di-GMP rather than individually reconstituting
            both subunits.
          supporting_text: "NasT was \nessential for expressing the nirBD operon encoding nitrite reductase\
            \ during \nnitrate assimilation."
