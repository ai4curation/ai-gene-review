      title: Identification of the Ferredoxin-Binding Site of a Ferredoxin-Dependent Cyanobacterial Nitrate
        Reductase.
      statement: Nitrate assimilation proceeds through nitrate-to-nitrite reduction followed by nitrite-to-ammonia
        reduction. This is reaction continuity, not evidence for a physical complex between the enzymes.
      supporting_text: The first step is catalyzed by nitrate reductase (NR) and involves the initial
        two-electron reduction of nitrate to nitrite.
    - source_id: PMID:9765565
      title: Nitrogen and oxygen regulation of Bacillus subtilis nasDEF encoding NADH-dependent nitrite
        reductase by TnrA and ResDE.
      statement: NasBC supplies the assimilatory upstream reaction during aerobic growth. Anaerobic respiratory
        NarGHJI is a different upstream input outside this route.
      supporting_text: Our previous results showed that nitrate reductase encoded by nasB and nasC located
        upstream of the nasD gene functions only in nitrate assimilation during aerobic growth
    - source_id: PMID:38000372
      title: Cyclic di-GMP inhibits nitrate assimilation by impairing the antitermination function of
        NasT in Pseudomonas putida.
      statement: Native KT2440 experiments support nirBD expression during nitrate assimilation and lysate
        nitrite reductase activity. They perturb NasT/c-di-GMP rather than individually reconstituting
        both subunits.
      supporting_text: "NasT was \nessential for expressing the nirBD operon encoding nitrite reductase\
