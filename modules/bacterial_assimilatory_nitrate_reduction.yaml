id: MODULE:bacterial_assimilatory_nitrate_reduction
title: Bacterial assimilatory nitrate uptake and reduction
description: >-
  A reusable bacterial module for reducing nitrate through nitrite to ammonium
  for biosynthesis. In complete whole-cell realizations that use extracellular
  nitrate, a nitrate-import system supplies the intracellular pool before an
  assimilatory molybdoenzyme reduces nitrate to nitrite and a
  siroheme-containing NirBD complex performs the six-electron reduction of
  nitrite to ammonium. Uptake is optional at the reusable module boundary so
  that the two core reductions can also be instantiated from intracellular
  nitrate. The module stops at ammonium; incorporation through GS-GOGAT is a
  separate module. Respiratory nitrate reduction, denitrification, and
  dissimilatory nitrate reduction to ammonium are outside this boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0042128
    title: nitrate assimilation
    statement: >-
      GO:0042128 defines use of nitrate as a nitrogen source through reduction
      and incorporation into cellular material.
  - source_id: UniProtKB:Q9L2E6
    title: Streptomyces coelicolor assimilatory nitrate reductase NasA
    statement: >-
      Reviewed Q9L2E6 provides a bacterial ferredoxin-linked assimilatory
      nitrate-reductase exemplar assigned to nitrate-to-nitrite reduction.
  - source_id: UniProtKB:P08201
    title: Escherichia coli NirB nitrite reductase large subunit
    statement: >-
      Reviewed P08201 grounds the catalytic large subunit of NADH-dependent
      assimilatory nitrite reductase.
  - source_id: UniProtKB:P0A9I8
    title: Escherichia coli NirD nitrite reductase small subunit
    statement: >-
      Reviewed P0A9I8 grounds the conserved NirD accessory small-subunit family.
  - source_id: PMID:22965870
    title: Crystal structure of NirD, the small subunit of the nitrite reductase NirbD from Mycobacterium tuberculosis at 2.0 Å resolution.
    statement: NirD has a Rieske-related fold but no Fe-S cluster or other electron-transfer cofactor.
  - source_id: PMID:32523942
    title: A Nitrate-Blind P. putida Strain Boosts PHA Production in a Synthetic Mixed Culture.
    statement: >-
      The introduction cites PP_1703 and nirBD (PP_1705 and PP_1706) as the
      assigned KT2440 assimilatory nitrate and nitrite reductases; the paper
      itself perturbs nasT rather than directly assaying these enzymes.
  - source_id: PMID:32111737
    title: A recently evolved diflavin-containing monomeric nitrate reductase is responsible for highly efficient bacterial nitrate assimilation.
    statement: >-
      NasN biochemistry establishes a reusable fused molybdopterin plus
      FMN-FAD/NAD-binding architecture for NADPH-dependent assimilatory nitrate
      reduction.
  - source_id: PMID:35285712
    title: 'Nitrogen Metabolism in Pseudomonas putida: Functional Analysis Using Random Barcode Transposon Sequencing.'
    statement: >-
      Pooled mutant fitness assays provide organism-wide physiological
      evidence for nitrogen-source assimilation pathways.
  - source_id: file:PSEPK/nasA/nasA-ai-review.yaml
    title: PSEPK NasA nitrate/nitrite transporter review
    statement: >-
      Q88L43 is the KT2440 nitrate/nitrite porter and is supported most strongly
      as the nitrate-uptake component of nitrate assimilation.
  - source_id: file:PSEPK/PP_1703/PP_1703-uniprot.txt
    title: UniProtKB entry for PSEPK PP_1703
    statement: >-
      Q88M71 combines Mo-bisMGD/4Fe-4S nitrate-reductase domains with
      flavodoxin, FAD, and NAD(P)-binding reductase domains and is assigned to
      nitrate assimilation, although imported donor and localization calls
      conflict.
  - source_id: file:PSEPK/PP_1703/PP_1703-deep-research-openscientist.md
    title: OpenScientist report for the fused PSEPK nitrate reductase candidate
    statement: >-
      The report synthesizes the fused diflavin architecture, same-lineage
      genetics, comparative biochemistry, and the unresolved direct Q88M71 assay.
  - source_id: file:PSEPK/nirB/nirB-uniprot.txt
    title: UniProtKB entry for PSEPK NirB
    statement: >-
      Q88M69 is a siroheme- and iron-sulfur-containing NirB-family nitrite
      reductase large subunit assigned to nitrate assimilation.
  - source_id: file:PSEPK/nirD/nirD-uniprot.txt
    title: UniProtKB entry for PSEPK NirD
    statement: >-
      Q88M68 is a NirD-family small accessory subunit adjacent to nirB.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial_assimilatory_nitrate_reduction__ppu00910-deep-research-openscientist.md
    title: OpenScientist review of the module in Pseudomonas putida KT2440
    statement: >-
      The taxon/pathway report recovers NasA, PP_1703, and NirBD as a complete
      candidate whole-cell route and separates GS-GOGAT and dissimilatory
      nitrogen metabolism. Its PP_1703 donor and localization conclusions are
      sequence-based inferences rather than direct KT2440 biochemistry.
  - source_id: file:interpro/panther/PTHR23515/PTHR23515-paint.tsv
    title: PAINT assertions for nitrate/nitrite porters
    statement: >-
      PTN009073875 carries IBD assertions for nitrate transmembrane transporter
      activity and nitrate transmembrane transport, with reviewed E. coli NarU
      P37758 among the experimental seeds.
  - source_id: file:interpro/panther/PTHR40562/PTHR40562-paint.tsv
    title: PAINT assertions for NirD-family small subunits
    statement: >-
      PTN008082957 carries IBD assertions for the NADH-dependent nitrite
      reductase activity and complex, seeded by reviewed E. coli NirD P0A9I8.
notes: >-
  CONCRETE denotes a grounded bacterial pathway realization, not a
  species-specific member list. Nitrate uptake is optional at this reusable
  boundary but is required when the realization begins with extracellular
  nitrate. ONE_OR_MORE is relaxed modeling: transporter systems can coexist,
  while coexistence or strict exclusivity of nitrate-reductase architectures is
  not asserted without organism-specific evidence. Molecular functions occur
  only on leaf annotons, and no generic localization is asserted.
