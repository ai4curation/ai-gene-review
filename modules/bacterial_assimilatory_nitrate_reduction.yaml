- id: file:BACSU/nasB/nasB-source-analysis/native-nas-system.md
  title: native-nas-system.md
  findings:
  - statement: Native JH642-derived NasA loss supports nitrate uptake; it does not demonstrate a particular
      transport coupling mechanism or exclude incidental nitrite uptake.
    supporting_text: NasA loss abolished nitrate growth despite retained nitrate reductase activity, supporting
      uptake.
  - statement: NasB and NasC are both required for native assimilatory nitrate reduction after polarity
      controls. Primary assay donor was methyl viologen, not direct NADH kinetics.
    supporting_text: NasB and NasC were independently required for nitrate utilization after downstream
      expression was restored.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Manual source analysis of the primary PMID:7868621 publisher PDF. The canonical publication
      cache remains abstract-only. Distinguishes JH642-derived assays from exact reference-isolate identity
      and records polarity controls and artificial-donor limits.
- id: url:https://pmc.ncbi.nlm.nih.gov/articles/PMC94119/
  title: 'Prokaryotic Nitrate Reduction: Molecular Properties and Functional Distinction among Bacterial
    Nitrate Reductases'
  findings:
  - statement: NasB supplies the diaphorase region and NasC the catalytic region. NADH is the review-level
      physiological interpretation; the module uses donor-generic GO:0008940 for this native complex.
    supporting_text: 'In B. subtilis, the nasBC genes code for the NADH-nitrate reductase: NasB is a diaphorase
      with NADH- and FAD-binding domains, and NasC is the catalytic subunit.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full text of the 1999 review PMID:10542156. Used for the NasBC electron-transfer/catalytic
      division and NADH interpretation, not a direct native donor assay. Its historical E. coli detoxification
      framing does not negate later assimilation experiments.
- id: PMID:9765565
  title: Nitrogen and oxygen regulation of Bacillus subtilis nasDEF encoding NADH-dependent nitrite reductase
    by TnrA and ResDE.
  findings:
  - statement: Both NasD and NasE are needed for native nitrite reductase activity, with downstream-expression
      controls. No exact oligomeric stoichiometry is established.
    supporting_text: both nasD and nasE genes are required for enzyme activity.
  - statement: Bacillus lysate nitrite-reductase activity is predominantly NADH-dependent. The minor NADPH-supported
      signal does not establish a NasDE-specific NADPH reaction.
    supporting_text: Activity with NADPH was less than 10% of that with NADH.
  - statement: Native NasDE activity is cytosolic. These assays concern JH642-derived strains in the 168
      lineage.
    supporting_text: No nitrite reductase activity was detected in the membrane fraction, whereas nearly
      all activity was present in the cytosolic fraction, indicating that the NasDE enzyme is a cytoplasmic
      protein.
  - statement: NasBC supplies the assimilatory upstream reaction during aerobic growth. Anaerobic respiratory
      NarGHJI is a different upstream input outside this route.
    supporting_text: Our previous results showed that nitrate reductase encoded by nasB and nasC located
      upstream of the nasD gene functions only in nitrate assimilation during aerobic growth
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cached source text inspected for the specific findings quoted here; assay and taxon
      limits are retained in the module.
