- source_id: file:PSEPK/PP_1703/PP_1703-source-analysis/RESULTS.md
  title: Modern PP_1703 CDS check
  statement: The continuous modern KT2440 CDS translates exactly to the complete Q88M71 fusion, supporting
    the single-CDS model despite historical split records; this is genomic-model evidence, not a full-length
    protein-expression or kinetic assay.
  supporting_text: Bacterial-code translation gives 1,341 residues and a terminal TGA, no internal stop,
    and exact identity to both AAN67324.2 and Q88M71.
