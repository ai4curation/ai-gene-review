      label: PCC 7942 ferredoxin-dependent route
      module_type: METABOLIC_PATHWAY
      description: Complete native nitrate-to-ammonium reaction sequence. NrtABCD is required for the
        modeled extracellular uptake case; omission is allowed only for an intracellular nitrate boundary.
        The sequential reductases are not asserted to form a physical complex.
      context:
        taxa:
        - preferred_term: Synechococcus elongatus PCC 7942 = FACHB-805
          term:
            id: NCBITaxon:1140
            label: Synechococcus elongatus PCC 7942 = FACHB-805
        conditions:
        - preferred_term: Intracellular nitrate input; extracellular input additionally requires the modeled
            native uptake step
        evidence:
        - source_id: PMID:9006953
          title: Substrate-binding lipoprotein of the cyanobacterium Synechococcus sp. strain PCC 7942
            involved in the transport of nitrate and nitrite.
          statement: Native PCC 7942 NrtABCD is required for the high-affinity nitrate/nitrite uptake
            system; NrtA is its substrate-binding lipoprotein.
          supporting_text: 'Of the four genes (nrtABCD) required for active transport of nitrate in the

            cyanobacterium Synechococcus sp. strain PCC 7942, nrtBCD encode membrane

            components of an ATP-binding cassette transporter involved in the transport of

            nitrite as well as of nitrate'
        - source_id: PMID:8624415
          title: A cyanobacterial narB gene encodes a ferredoxin-dependent nitrate reductase.
          statement: Purified PCC 7942 NarB reduces nitrate with reduced ferredoxin; methyl viologen can
            bypass the physiological electron-input interaction.
          supporting_text: 'either reduced methyl viologen or reduced

            ferredoxin could be used as an electron donor for the reduction of nitrate'
        - source_id: PMID:8490140
          title: 'Nitrite reductase gene from Synechococcus sp. PCC 7942: homology between cyanobacterial
            and higher-plant nitrite reductases.'
          statement: The native PCC 7942 nirA product is a nitrite reductase with conserved siroheme/[4Fe-4S]
            active-center residues; ferredoxin-class assignment combines this homology with curated target
            classification.
          supporting_text: 'Identities found at positions corresponding to those

            amino acids which in the above-mentioned proteins hold the Fe4S4-siroheme active

            center suggest that nitrite reductase from Synechococcus bears an active site

            much alike that present in those reductases.'
        - source_id: PMID:28520412
          title: Identification of the Ferredoxin-Binding Site of a Ferredoxin-Dependent Cyanobacterial
            Nitrate Reductase.
          statement: Nitrate assimilation proceeds through nitrate-to-nitrite reduction followed by nitrite-to-ammonia
            reduction. This is reaction continuity, not evidence for a physical complex between the enzymes.
          supporting_text: The first step is catalyzed by nitrate reductase (NR) and involves the initial
            two-electron reduction of nitrate to nitrite.
