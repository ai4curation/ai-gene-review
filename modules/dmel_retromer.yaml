id: MODULE:dmel_retromer
title: Retromer complex in Drosophila melanogaster
description: >-
  Retromer retrieves transmembrane cargo from endosomes and returns it to the trans-Golgi
  network or to the plasma membrane. Its cargo-selective core is a heterotrimer of Vps35,
  Vps26 and Vps29 that recognizes sorting motifs in cargo tails; it associates with sorting
  nexins, including the SNX-BAR proteins Snx1 and Snx6, which bind endosomal phosphoinositides
  and shape membrane tubules. In Drosophila, retromer recycles the Wnt cargo receptor Wntless
  (Wls) to the Golgi, which is needed for Wingless secretion, and it also maintains rhodopsin
  and other cargo in photoreceptors.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000196
  title: 'FlyBase gene group RETRO: Retromer complex'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as retromer complex (RETRO);
    this module models that group.
- source_id: GO:0030904
  title: retromer complex
  statement: >-
    GO term grounding the module as retromer complex.
notes: >-
  Decomposition. The cargo-selective trimer and the SNX-BAR sorting nexin pair are modelled
  as separate parts; the SNX-BAR proteins associate with the trimer less stably than the trimer
  subunits associate with each other. Snx3 and the WASH complex, which also cooperate with
  retromer, are outside this module. FlyBase groups realized by this module: RETRO (FBgg0000196).
  Participants were generated from the FlyBase gene-group membership and mapped to UniProtKB
  by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_retromer.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
