id: MODULE:scer_rtt109_vps75_complex
title: Rtt109-Vps75 histone acetyltransferase complex in Saccharomyces cerevisiae
description: >-
  Rtt109 is the fungal histone H3 acetyltransferase that acetylates newly synthesized histone H3
  before it is deposited into chromatin. It is active only in complex with a histone chaperone.
  With the NAP-family chaperone Vps75 it forms a stable complex, in which a Vps75 dimer binds one
  or two Rtt109 molecules. Vps75 stabilizes Rtt109, brings it into the nucleus, raises its catalytic
  rate about 100-fold and positions the H3 N-terminal tail in a central cavity facing the Rtt109
  active site, so the complex preferentially acetylates H3 K9 and K27 in the tail. Acetylation of
  H3 K56 in the histone-fold core requires the other chaperone, Asf1, which presents the H3-H4
  dimer to Rtt109. Neither Rtt109-chaperone complex acts on nucleosomal H3. H3 K56 acetylation
  marks newly replicated chromatin and is needed for genome stability; the Rtt109-Vps75 complex is
  dispensable for that mark and for resistance to genotoxic agents, while Vps75 also has
  Rtt109-independent roles as a histone chaperone, including H2A-H2B eviction at transcribed genes.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:17320445
  title: Histone H3-K56 acetylation is catalyzed by histone chaperone-dependent complexes.
  statement: >-
    Defines the boundary: Rtt109 is active only in complex with a histone chaperone, either Asf1 or
    Vps75.
  supporting_text: H3-K56 acetylation is catalyzed when Rtt109, a protein that lacks significant
    homology to known acetyltransferases, forms an active complex with either of two histone binding
    proteins, Asf1 or Vps75.
- source_id: PMID:17369253
  title: The Rtt109-Vps75 histone acetyltransferase complex acetylates non-nucleosomal histone H3.
  statement: >-
    The native and recombinant Rtt109-Vps75 complex acetylates free H3 but not nucleosomal H3.
  supporting_text: both recombinant and native Rtt109-Vps75 HAT complexes exhibited no detectable
    activity toward nucleosomal H3
- source_id: PMID:18458063
  title: Chaperone control of the activity and specificity of the histone H3 acetyltransferase Rtt109.
  statement: >-
    Rtt109 purifies from yeast with Vps75, which stabilizes it.
  supporting_text: Rtt109 purifies from yeast in complex with the histone chaperone Vps75, which
    stabilizes the HAT in vivo.
notes: >-
  Boundary. The module contains the two subunits of the stable complex, Rtt109 (catalytic) and
  Vps75 (chaperone and activator). Asf1 is not a subunit: it binds Rtt109 through H3-H4 and
  through the Rtt109 C-terminus, and presents the H3-H4 dimer for K56 acetylation. It is recorded
  in the K56 annoton's role description rather than as a part, and belongs with its own
  replication-coupled assembly module. Histones H3 and H4 are substrates. The two crystal
  structures disagree on stoichiometry: a symmetric Vps75 dimer with two Rtt109 molecules
  (PMID:21256037) and an asymmetric Vps75 dimer with one Rtt109 (PMID:21454705); Vps75 also forms
  tetramers on H3-H4 (PMID:27036862).

  Division of labour. Vps75 is needed for Rtt109 to acetylate the H3 tail (K9, K27) but not H3
  K56, which requires only Asf1 in vivo. Rtt109 is unstable without Vps75, so early vps75 deletion
  phenotypes mixed loss of the complex with loss of Rtt109; an Rtt109 mutant stable without Vps75
  separated the two (PMID:21463458).

  Ontology. The module concept is GO:0070775 H3 histone acetyltransferase complex, defined as a
  complex capable of histone H3 acetyltransferase activity. A reasoner places it under GO:0000123
  histone acetyltransferase complex, which is part_of GO:0000785 chromatin, so the module and the
  GO:0070775 annotations on Rtt109, Vps75 and Asf1 entail a chromatin location. The Rtt109-Vps75
  complex has no detectable activity on nucleosomal H3, so it is a second counterexample to that
  edge, after HAT-B (modules/scer_hat_b_complex.yaml). The edge deletion is recorded under
  proposed_ontology_changes.

  RTT109 and VPS75 have gene reviews in this repository. The RTT109 review accepts the H3 K9 and
  K27 activities but lists them under the broader GO:0010484 core function, which the module
  validator reports as ANNOTATION_SUPPORTED.
