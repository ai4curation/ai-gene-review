proposed_ontology_changes:
- change_type: EDGE_DELETION
  ontology: GO
  about_node:
    id: GO:0000123
    label: histone acetyltransferase complex
  subject:
    id: GO:0000785
    label: chromatin
  predicate: BFO:0000050
  change_dsl: delete edge GO:0000123 BFO:0000050 GO:0000785
  justification: >-
    GO:0000123 is logically defined as any complex capable of histone acetyltransferase activity,
    and GO:0070775 H3 histone acetyltransferase complex is classified under it, so both are part_of
    GO:0000785 chromatin. The Rtt109-Vps75 complex, annotated to GO:0070775, has no detectable
    activity on nucleosomal H3 and acts on newly synthesized H3-H4 before deposition, possibly even
    before nuclear import. It is a second counterexample to the edge after the type B histone
    acetyltransferase; the same request, with the HAT-B evidence, is in
    modules/scer_hat_b_complex.yaml.
  origin: SELF_PROPOSED
  confidence: PROBABLE
  request_status: NOT_FILED
  ontology_state_verified: '2026-11-15'
  supported_by:
  - reference_id: PMID:17369253
    supporting_text: both recombinant and native Rtt109-Vps75 HAT complexes exhibited no detectable
      activity toward nucleosomal H3
  - reference_id: PMID:21463458
    supporting_text: Rtt109 nuclear localization depends on Vps75, and nuclear localization of the
      Vps75-Rtt109 complex is not critical for Rtt109-dependent functions, suggesting Rtt109 may be
      able to acetylate nascent histones before nuclear import
knowledge_gaps:
- gap_statement: >-
    It is not known whether the Rtt109-Vps75 complex acetylates new histone H3 before nuclear import,
    in the nucleus, or both.
  gap_kind:
  - BIOLOGY
  status: OPEN
  significance: >-
    Vps75 carries Rtt109 into the nucleus, yet preventing nuclear accumulation of the complex does
    not impair Rtt109-dependent functions, which suggests acetylation can happen in the cytoplasm.
    Where acetylation occurs bears on how the H3 tail marks are coordinated with Asf1, H3 K56
    acetylation and HAT-B acetylation of H4.
  provenance:
  - reference_id: PMID:21463458
    supporting_text: Rtt109 nuclear localization depends on Vps75, and nuclear localization of the
      Vps75-Rtt109 complex is not critical for Rtt109-dependent functions, suggesting Rtt109 may be
      able to acetylate nascent histones before nuclear import
- gap_statement: >-
    The functions of Vps75 that do not depend on Rtt109 are only partly defined.
  gap_kind:
  - BIOLOGY
  status: NARROWING
  significance: >-
    Vps75 is dispensable for H3 K56 acetylation and for hydroxyurea resistance, associates with the
    chromatin of active and inactive genes and telomeres, and has genetic interactions that point to
    Rtt109-independent roles. One such role has been identified: Vps75 is recruited to transcribed
    genes without Rtt109 and cooperates with RSC to remove H2A/H2B dimers from nucleosomes. How it
    acts there in vivo, and whether it has further roles, is not established.
  provenance:
  - reference_id: PMID:19470761
    supporting_text: reconstitution of nucleosome disassembly using the ATP-dependent chromatin
      remodeler Rsc and Vps75 revealed that these proteins can cooperate to remove H2A/H2B dimers
      from nucleosomes
  - reference_id: PMID:17344218
    supporting_text: they also have separate roles
  - reference_id: PMID:21463458
    supporting_text: our genetic interaction data support the idea of Rtt109-independent functions of
      Vps75
