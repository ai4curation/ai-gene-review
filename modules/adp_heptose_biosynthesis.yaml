- id: PMID:32591860
  title: 'ADP-heptose: a bacterial PAMP detected by the host sensor ALPK1.'
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Review of pathway architecture, distribution and host sensing; use primary enzyme studies
      for decisive reaction assignments. The hygromycin comparison concerns a different altro-heptose
      branch and is not used to extend this manno-heptose module.
  findings:
  - statement: The review describes split HldA/HldC architecture and patchy ADP-heptose distribution;
      no universal bacterial or Gram-negative pathway presence is inferred.
    supporting_text: In Neisseria species, the bifunctional protein HldE is replaced by two independent
      enzymes, HldA and HldC
  - statement: Partial gmhB deletion phenotypes in some organisms can reflect alternative phosphatase
      activity; that does not remove the required dephosphorylation reaction from the pathway.
    supporting_text: A partial phenotype may result from functional redundancy to GmhB in ADP-heptose
      biosynthesis and the existence of a yet-unidentified phosphatase activity capable of dephosphorylating
      HBP.
