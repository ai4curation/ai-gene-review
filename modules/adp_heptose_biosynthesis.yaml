  knowledge_gaps:
    - gap_statement: >-
        The terminal stereoisomer required by downstream glycoconjugate
        assembly differs among bacterial realizations and cannot be inferred
        solely from the presence of the four ADP-D,D-heptose reactions.
      boundary: >-
        Treat HldD as an optional maturation part and establish the concrete
        endpoint from a specific epimerase assignment or glycan structure.
      gap_kind:
        - BIOLOGY
        - CURATION
