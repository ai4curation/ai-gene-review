- id: PMID:29483275
  title: d-Sedoheptulose-7-phosphate is a common precursor for the heptoses of septacidin and hygromycin
    B.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: 'Local publication cache remains abstract-only after supported refresh attempts. The
      full publisher PDF was independently inspected externally: hybrid-enzyme substitutions establish
      SepB/SepL activities and isolated SepC provides epimerase evidence. Original deposited coding sequences
      are exactly matched to all three representative accessions.'
  findings:
  - statement: The Streptomyces fimbriatus SepB/SepL/SepC enzyme set makes ADP-L,D-manno-heptose for septacidin
      biosynthesis, demonstrating this route outside Gram-negative LPS synthesis.
    supporting_text: 'we studied septacidin biosynthesis by in vivo and in

      vitro experiments and discovered that SepB, SepL, and SepC can convert

      d-sedoheptulose-7-phosphate (S-7-P) to ADP-l-glycero-β-d-manno-heptose'
  - statement: SepB supplies the isomerase, kinase and adenylyltransferase reactions, with SepL supplying
      phosphatase and SepC supplying C-6 epimerase; these experimentally assigned components realize the
      same five-reaction route with different domain fusion.
