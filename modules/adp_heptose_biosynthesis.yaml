- id: PMID:39116220
  title: The β-d-manno-heptoses are immune agonists across kingdoms.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Cross-kingdom functional evidence is interpreted at the demonstrated enzyme/experimental-host
      level. No endogenous S2 pathway or complete viral/eukaryotic pathway is inferred. The author-uploaded
      main article was inspected externally; the local cache remains abstract-only and publisher supplements
      were inaccessible. The exact kinase construct was independently matched to GenBank PP708527.1; other
      member mappings are explicitly inferred.
  findings:
  - statement: The 2024 primary study extends functional heptose-biosynthetic enzymes beyond bacteria
      and demonstrates archaeal ADP-heptose production. Full-text interpretation distinguishes an engineered
      S2 host expressing DSM2067 enzymes from endogenous S2 synthesis and distinguishes partial viral/eukaryotic
      complements from complete pathways.
    supporting_text: 'We also produced ADP-heptose in

      archaea and verified its innate immune agonist functions.'
