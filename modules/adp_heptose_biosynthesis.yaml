id: MODULE:adp_heptose_biosynthesis
title: ADP-heptose precursor biosynthesis
description: >-
  A bacterial nucleotide-sugar pathway that converts D-sedoheptulose
  7-phosphate to ADP-D-glycero-beta-D-manno-heptose through GmhA, the kinase
  activity of HldE, GmhB, and the adenylyltransferase activity of HldE. In
  lineages that use ADP-L-glycero-beta-D-manno-heptose, HldD performs a
  subsequent C-6 epimerization. Transfer of the activated heptose into the LPS
  core by heptosyltransferases is downstream of this module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: KEGG:M00064
    title: ADP-L-glycero-D-manno-heptose biosynthesis
    statement: Defines the canonical reaction chain from sedoheptulose 7-phosphate to activated L,D-heptose.
  - source_id: GO:0097171
    title: ADP-L-glycero-beta-D-manno-heptose biosynthetic process
    statement: Defines the canonical biological process represented by the complete route.
  - source_id: GO:2001061
    title: D-glycero-D-manno-heptose 7-phosphate biosynthetic process
    statement: Defines formation of the phosphoheptose intermediate at the pathway entrance.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__adp-heptose-biosynthesis__ppu00541-deep-research-openscientist.md
    title: OpenScientist PSEPK ADP-heptose biosynthesis synthesis
    statement: Species-aware retrieval used to distinguish the core ADP-D,D-heptose reactions from terminal HldD-dependent stereochemical maturation.
  - source_id: RHEA:27489
    title: phosphoheptose isomerase reaction
    statement: Defines GmhA conversion of sedoheptulose 7-phosphate to phosphoheptose anomers.
  - source_id: RHEA:27473
    title: heptose 7-phosphate kinase reaction
    statement: Defines the first catalytic activity of HldE.
  - source_id: RHEA:28518
    title: heptose 1,7-bisphosphate 7-phosphatase reaction
    statement: Defines GmhB hydrolysis of the C-7 phosphate.
  - source_id: RHEA:27465
    title: heptose 1-phosphate adenylyltransferase reaction
    statement: Defines the second catalytic activity of HldE.
  - source_id: RHEA:17577
    title: ADP-heptose 6-epimerase reaction
    statement: Defines optional conversion of the D,D activated sugar to the L,D stereoisomer.
notes: >-
  HldE is represented at two distinct leaf reactions because its N- and
  C-terminal domains catalyze non-adjacent pathway steps. Terminal HldD
  epimerization is optional at this generic boundary so concrete realizations
  can distinguish ADP-D,D-heptose production from L,D-heptose maturation. No
  molecular function or generic cytoplasmic location is asserted at module
  level.
