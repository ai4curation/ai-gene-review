references:
- id: PMID:11751812
  title: Biosynthesis pathway of ADP-L-glycero-beta-D-manno-heptose in Escherichia coli.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Accessible text checked for the stated claims. Primary experiments are distinguished
      from comparative background.
  findings:
  - statement: The E. coli pathway was reconstructed using E. coli HldE/GmhB with Aneurinibacillus thermoaerophilus
      GmhA, establishing the four connected reactions to ADP-D,D-heptose.
    supporting_text: 'Our results demonstrate that the

      synthesis of ADP-D-beta-D-heptose in Escherichia coli requires three proteins,

      GmhA (sedoheptulose 7-phosphate isomerase), HldE (bifunctional D-beta-D-heptose

      7-phosphate kinase/D-beta-D-heptose 1-phosphate adenylyltransferase), and GmhB

      (D,D-heptose 1,7-bisphosphate phosphatase), as well as ATP and the ketose

      phosphate precursor sedoheptulose 7-phosphate.'
  - statement: HldD performs the subsequent epimerization giving the L,D-heptose donor used in E. coli
      inner-core LPS.
    supporting_text: 'A previously characterized

      epimerase, formerly named WaaD (RfaD) and now renamed HldD, completes the

      pathway to form the ADP-L-beta-D-heptose precursor utilized in the assembly of

      inner core LPS.'
- id: PMID:23256532
  title: Structural-functional studies of Burkholderia cenocepacia D-glycero-β-D-manno-heptose 7-phosphate
    kinase (HldA) and characterization of inhibitors with antibiotic adjuvant and antivirulence properties.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Accessible text checked for the stated claims. Primary experiments are distinguished
      from comparative background.
  findings:
  - statement: Burkholderia HldA and HldC are separate kinase and adenylyltransferase proteins corresponding
      to the two domains of HldE.
    supporting_text: 'HldA and HldC

      are homologous to the N- and the C-terminal domains of HldE, respectively.'
  - statement: The assayed monofunctional HldA kinase has structural and catalytic-mutagenesis support;
      a fused-enzyme family label does not imply an adenylyltransferase activity.
    supporting_text: 'Results of the mutagenesis studies

      on the in vivo activity of HldA confirm the role of the conserved

      aspartate, Asp270, as the catalytic residue.'
