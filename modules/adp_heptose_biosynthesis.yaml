id: MODULE:adp_heptose_biosynthesis
title: ADP-heptose precursor biosynthesis
description: ADP-manno-heptose precursor synthesis converts sedoheptulose 7-phosphate into ADP-D-glycero-beta-D-manno-heptose
  through isomerization, C-1 phosphorylation, C-7 dephosphorylation and adenylylation. A further C-6 epimerization
  supplies the L,D stereoisomer where required. The same reaction sequence is implemented by separate,
  bifunctional or trifunctional enzymes and supplies Gram-negative lipopolysaccharide and selected Gram-positive
  secondary metabolites. An archaeal enzyme set also produces ADP-heptose in an engineered archaeal host;
  native biological uses outside bacteria remain unresolved.
status: COMPLETE
scope: CONCRETE
evidence:
- &id001
  source_id: PMID:11751812
  title: Biosynthesis pathway of ADP-L-glycero-beta-D-manno-heptose in Escherichia coli.
  statement: The E. coli pathway was reconstructed using E. coli HldE/GmhB with Aneurinibacillus thermoaerophilus
    GmhA, establishing the four connected reactions to ADP-D,D-heptose.
  supporting_text: 'Our results demonstrate that the

    synthesis of ADP-D-beta-D-heptose in Escherichia coli requires three proteins,

    GmhA (sedoheptulose 7-phosphate isomerase), HldE (bifunctional D-beta-D-heptose

    7-phosphate kinase/D-beta-D-heptose 1-phosphate adenylyltransferase), and GmhB

    (D,D-heptose 1,7-bisphosphate phosphatase), as well as ATP and the ketose

    phosphate precursor sedoheptulose 7-phosphate.'
- &id015
  source_id: PMID:32591860
  title: 'ADP-heptose: a bacterial PAMP detected by the host sensor ALPK1.'
  statement: The review describes split HldA/HldC architecture and patchy ADP-heptose distribution; no
    universal bacterial or Gram-negative pathway presence is inferred.
  supporting_text: In Neisseria species, the bifunctional protein HldE is replaced by two independent
    enzymes, HldA and HldC
- source_id: PMID:37317291
  title: 'A Bittersweet Kiss of Gram-Negative Bacteria: The Role of ADP-Heptose in the Pathogenesis of
    Infection.'
  statement: This review distinguishes the kinase, phosphatase, nucleotide-activation and epimerization
    steps and documents split HldA/HldC implementations.
  supporting_text: In certain bacteria species, such as Neisseria meningitidis and Ralstonia eutropha,
    the functions of the HldE are replaced by the HldA (as the β-D-heptose-7-phosphate kinase)and HldC
    (β-D-heptose-1-phosphate adenosyltransferase) enzymes
- &id003
  source_id: PMID:29483275
  title: d-Sedoheptulose-7-phosphate is a common precursor for the heptoses of septacidin and hygromycin
    B.
  statement: The Streptomyces fimbriatus SepB/SepL/SepC enzyme set makes ADP-L,D-manno-heptose for septacidin
    biosynthesis, demonstrating this route outside Gram-negative LPS synthesis.
  supporting_text: 'we studied septacidin biosynthesis by in vivo and in

    vitro experiments and discovered that SepB, SepL, and SepC can convert

    d-sedoheptulose-7-phosphate (S-7-P) to ADP-l-glycero-β-d-manno-heptose'
- &id016
  source_id: PMID:34632535
  title: A conservative distribution of tridomain NDP-heptose synthetases in actinobacteria.
  statement: Some related actinobacterial tridomain proteins lack kinase activity; domain architecture
    alone cannot establish complete pathway competence.
  supporting_text: 'Enzymatical characterization of

    the tridomain proteins from different strains showed that they are involved in

    ADP-D-glycero-β-D-manno-heptose biosynthesis despite the unexpected discovery of

    kinase activities deficient in some proteins.'
- &id005
  source_id: PMID:39116220
  title: The β-d-manno-heptoses are immune agonists across kingdoms.
  statement: The 2024 primary study extends functional heptose-biosynthetic enzymes beyond bacteria and
    demonstrates archaeal ADP-heptose production. Full-text interpretation distinguishes an engineered
    S2 host expressing DSM2067 enzymes from endogenous S2 synthesis and distinguishes partial viral/eukaryotic
    complements from complete pathways.
  supporting_text: 'We also produced ADP-heptose in

    archaea and verified its innate immune agonist functions.'
- &id017
  source_id: PMID:39558531
  title: NDP-β-d-manno-heptoses are small molecule agonists sensed by the vertebrates to discriminate
    organisms of different kingdoms.
  statement: This author commentary reviews cross-kingdom heptose enzymes and unresolved physiological
    roles. Its shorthand reference to M. maripaludis S2 is read together with the primary engineered-host
    experiment rather than as evidence of an endogenous pathway.
notes: 'Bacteria and Archaea are non-universal envelopes for complete demonstrated enzyme sets. Functional
  individual enzymes also occur in viruses and eukaryotes, but their partial complements do not establish
  a complete native route. The archaeal experiment expressed DSM2067 enzymes in HBE-negative Methanococcus
  maripaludis S2; it is not evidence of endogenous S2 production. The core endpoint is ADP-D,D-manno-heptose;
  HldD/SepC epimerization is optional only at this generic module boundary and is required in realizations
  whose downstream product uses the L,D donor. The GDP-alpha-heptose route, HygP-dependent ADP-altro-heptose
  synthesis, glycan transfer reactions and host ALPK1 signaling are outside this module. The kinase adds
  phosphate at C-1 despite its substrate-based name; the adenylyltransferase transfers AMP, not ADP. Protein
  fusions do not collapse nonadjacent reactions. Family labels dominated by HldE or DiaA do not establish
  all activities on every member: the explicit required function and reviewed representative provide the
  biological restriction. No unverified PAINT ancestral placement is asserted. The ADP route does not
  imply ATP-exclusive nucleotidyltransferase specificity: some enzymes also use CTP or UTP. The listed
  fusion architectures are examples; HldF isomerase/nucleotidyltransferase and HldG phosphatase/nucleotidyltransferase
  fusions are also reported. Archaeal HldD activity and L,D-heptose production were not demonstrated by
  the four-gene reconstruction; this does not establish epimerase absence. Archaeal representatives are
  the DSM2067 locus proteins preserved in dated UniSave records. The kinase has an exact match to the
  published synthetic construct; the other three are family/domain-and-context assignments, not asserted
  exact experimental constructs.'
