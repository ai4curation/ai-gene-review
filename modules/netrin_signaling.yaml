                      receptor.
                    evidence:
                      - source_id: PMID:9126742
                        title: Vertebrate homologues of C. elegans UNC-5 are candidate netrin receptors.
                        statement: Vertebrate UNC5 homologues bind netrin.
                        supporting_text: >-
                          We provide evidence that these two UNC-5 homologues, as well as the rcm gene
                          product, are netrin-binding proteins, supporting the hypothesis that UNC-5
                          and its relatives are netrin receptors.
