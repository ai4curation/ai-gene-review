                    label: UNC5-family netrin receptor
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: UNC5 family netrin receptors
                        term:
                          id: PANTHER:PTHR12582
                          label: NETRIN RECEPTOR UNC5
                        representative_members:
                          - preferred_term: UNC5A
                            term:
                              id: UniProtKB:Q6ZN44
                              label: Netrin receptor UNC5A
                          - preferred_term: UNC5B
                            term:
                              id: UniProtKB:Q8IZJ1
                              label: Netrin receptor UNC5B
                          - preferred_term: UNC5C
                            term:
                              id: UniProtKB:O95185
                              label: Netrin receptor UNC5C
                          - preferred_term: UNC5D
