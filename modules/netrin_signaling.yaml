                            term:
                              id: UniProtKB:P43146
                              label: Netrin receptor DCC
                          - preferred_term: fra
                            term:
                              id: UniProtKB:A1Z920
                              label: Frazzled, isoform A
                    function:
                      preferred_term: netrin receptor activity
                      term:
                        id: GO:0005042
                        label: netrin receptor activity
                    processes:
                      - preferred_term: netrin-activated signaling pathway
                        term:
                          id: GO:0038007
                          label: netrin-activated signaling pathway
                    locations:
                      - preferred_term: plasma membrane
                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: Netrin-binding transmembrane receptor that mediates
                      attraction toward the netrin source.
                    evidence:
                      - source_id: PMID:8861902
                        title: Deleted in Colorectal Cancer (DCC) encodes a netrin receptor.
                        statement: DCC binds netrin-1 and is required for netrin-1-dependent
                          commissural axon outgrowth.
                        supporting_text: >-
                          These results indicate that DCC is a receptor or a component of a receptor
                          that mediates the effects of netrin-1 on commissural axons
                      - source_id: PMID:8861904
                        title: frazzled encodes a Drosophila member of the DCC immunoglobulin subfamily
                          and is required for CNS and motor axon guidance.
                        statement: Frazzled is the Drosophila DCC-family receptor for Netrin-dependent
                          axon guidance.
                        supporting_text: >-
                          suggest that Frazzled may function in vivo as a receptor or component of a
                          receptor mediating Netrin-dependent axon guidance
              - id: unc5_family_receptor
                label: UNC5-family receptor (repulsion)
                module_type: SIGNALING_PATHWAY
                annotons:
