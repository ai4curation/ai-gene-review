                statement: DCC receptors mediate attraction and some repulsion; UNC5 receptors
                  mediate repulsion only.
                supporting_text: >-
                  DCC receptors have been implicated in both attraction and repulsion by Netrins.
                  UNC5 receptors are required only for repulsion.
