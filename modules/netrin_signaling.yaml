      role: secreted ligand
      node:
        id: netrin_ligand
        label: Netrin ligand
        module_type: SIGNALING_PATHWAY
        description: A secreted netrin (UNC-6/netrin-1 class) presented by the signal-sending
          tissue, such as the CNS midline.
        annotons:
          - id: netrin_ligand_family
            label: Netrin ligand
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Netrin ligands (netrin subset of the netrin/laminin family)
                term:
                  id: PANTHER:PTHR10574
                  label: NETRIN/LAMININ-RELATED
                description: >-
                  PTHR10574 also contains laminin chains, which are not netrin receptor ligands.
                  The role here is restricted to netrins.
                representative_members:
                  - preferred_term: NTN1
                    term:
                      id: UniProtKB:O95631
                      label: Netrin-1
                  - preferred_term: NTN3
                    term:
                      id: UniProtKB:O00634
                      label: Netrin-3
                  - preferred_term: NetA
                    term:
                      id: UniProtKB:Q24567
                      label: Netrin-A
                  - preferred_term: NetB
                    term:
                      id: UniProtKB:Q24568
                      label: Netrin-B
                ancestral_nodes:
                  - preferred_term: PAINT node PTN008501429 (netrins)
                    term:
                      id: PANTHER:PTN008501429
                      label: PTN008501429
                    description: >-
                      Local PAINT IBD node in PTHR10574 (taxon:6072) with propagated terms
                      C:GO:0005604 and P:GO:0008045. Its IBD seeds include Drosophila NetA
                      (FB:FBgn0015773) and NetB (FB:FBgn0015774), mouse Ntn1 (MGI:105088),
                      C. elegans WBGene00006746 and two zebrafish genes.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN008501429 in PTHR10574.
            function:
              preferred_term: netrin receptor binding
              term:
                id: GO:1990890
                label: netrin receptor binding
            processes:
              - preferred_term: netrin-activated signaling pathway
                term:
                  id: GO:0038007
                  label: netrin-activated signaling pathway
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: Secreted netrin that binds DCC-family and UNC5-family receptors.
            evidence:
              - source_id: PMID:8780646
                title: 'Guidance cues at the Drosophila CNS midline: identification and characterization
                  of two Drosophila Netrin/UNC-6 homologs.'
                statement: Drosophila has two netrins, NetA and NetB.
                supporting_text: >-
                  We have identified two Drosophila homologs of this protein family (Netrin-A and
                  Netrin-B).
              - source_id: PMID:8780645
                title: 'Genetic analysis of Netrin genes in Drosophila: Netrins guide CNS commissural
                  axons and peripheral motor axons.'
                statement: Drosophila netrins are required for commissural and motor axon guidance.
                supporting_text: >-
                  Thus, Drosophila Netrins are required for the guidance of commissural axons at the
                  midline, and of motor axons to their target muscles.
    - order: 2
      role: receptor
      node:
        id: netrin_receptor
        label: Netrin receptor
        module_type: SIGNALING_PATHWAY
        description: Transmembrane netrin receptor on the responding cell or growth cone. The
          receptor family present determines whether the response is attraction or repulsion.
        variant_sets:
          - id: netrin_receptor_response
            label: Netrin receptor by response
            axis: attraction versus repulsion
            selection: ONE_OR_MORE
            evidence:
