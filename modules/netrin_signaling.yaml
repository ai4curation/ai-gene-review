                        title: Short- and long-range repulsion by the Drosophila Unc5 netrin receptor.
                        statement: Drosophila Unc5 is a repulsive netrin receptor; long-range repulsion
                          also requires Frazzled.
                        supporting_text: >-
                          Both short- and long-range repulsion require Netrin function, but only
                          long-range repulsion requires Frazzled.
  connections:
