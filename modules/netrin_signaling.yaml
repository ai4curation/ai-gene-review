id: MODULE:netrin_signaling
title: Netrin signaling pathway module
description: >-
  Netrins are secreted laminin-related guidance cues. A netrin binds receptors of the DCC
  family (vertebrate DCC, Drosophila Frazzled) on a responding cell to mediate attraction,
  and receptors of the UNC5 family to mediate repulsion, steering migrating cells and axons
  toward or away from the netrin source.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0038007
    title: netrin-activated signaling pathway
    statement: The module is grounded in the GO biological process term for netrin-activated
      signaling.
  - source_id: PMID:21558366
    title: 'Netrins: versatile extracellular cues with diverse functions.'
    statement: Review of netrin signalling mechanisms in vertebrate and invertebrate systems,
      used for the module boundary.
    supporting_text: >-
      Netrins are secreted proteins that were first identified as guidance cues, directing
      cell and axon migration during neural development.
  - source_id: PMID:11719202
    title: Short- and long-range repulsion by the Drosophila Unc5 netrin receptor.
    statement: Netrins act through two receptor families, DCC (attraction and repulsion) and
      UNC5 (repulsion only).
    supporting_text: >-
      They act through receptors of the DCC and UNC5 families. DCC receptors have been
      implicated in both attraction and repulsion by Netrins. UNC5 receptors are required only
      for repulsion.
notes: >-
  Boundary. The module has two steps: a secreted netrin ligand, and a netrin receptor on the
  responding cell, with attractive (DCC family) and repulsive (UNC5 family) receptor variants.
  Intracellular transducers (FAK/PTK2, SRC-family kinases, TRIM9, Rho-family GTPase regulators),
  the co-receptor candidates DSCAM and neogenin, and laminins in the same PANTHER family are not
  modelled as parts. Representative members are human (NTN1, NTN3, DCC, UNC5A-D) and Drosophila
  (NetA, NetB, fra, unc-5).

  Ligand function term. The ligand step uses GO:1990890 netrin receptor binding, which matches
  the core function in the NTN1 and NTN3 gene reviews and is part_of GO:0038007 in the full
  ontology. GO:1990890 is_a signaling receptor binding, not receptor ligand activity
  (GO:0048018), so a check that looks for a receptor ligand activity gene in each annotated
  pathway does not find one for netrin signaling. Whether netrin receptor binding should sit
  under receptor ligand activity is an ontology question, not a biological one.

  Annotation state (GOA GAFs dated 2026-05-21). Human: UNC5A-D are annotated to GO:0038007,
  but DCC, NTN1, NTN3 and NTN4 are not, and none of the netrins has a netrin receptor binding or
  receptor ligand activity MF. Drosophila: fra and unc-5 are annotated to GO:0038007 (IEA), but
  NetA and NetB are annotated only to axon guidance terms and have no MF annotation.
module:
  id: netrin_signaling
  label: Netrin signaling pathway
  module_type: SIGNALING_PATHWAY
  description: >-
    A secreted netrin binds a DCC-family receptor to attract, or an UNC5-family receptor to
    repel, a migrating cell or growth cone.
