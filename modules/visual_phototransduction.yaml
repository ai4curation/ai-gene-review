                    role_description: >-
                      Dim-light visual pigment of rods; photoactivated rhodopsin catalyses
                      nucleotide exchange on rod transducin.
                    evidence:
                      - source_id: PMID:11095744
                        statement: Transducin couples rhodopsin to the rod cascade.
                        supporting_text: Retinal photoreceptors use the heterotrimeric G protein transducin to couple rhodopsin to a biochemical cascade that underlies the electrical photoresponse.
                    gocam_associations:
                      - model: gomodel:6918f23700000035
                        activity: gomodel:6918f23700000035/6918f23700000045
                        title: RHO G protein-coupled photoreceptor activity (GO:0008020) in the rod photoreceptor disc membrane
