    - order: 11
      role: chromophore regeneration
      node:
        id: phototransduction_chromophore_regeneration
        label: Retinoid visual cycle
        module_ref: retinoid_visual_cycle
        description: >-
          Regenerates the 11-cis-retinal released from bleached opsins; drawn by RGD as the
          subpathway PW:0001005 and modelled as a separate module.
  connections:
    - source: phototransduction_chromophore_regeneration
      target: phototransduction_photon_capture
      connection_type: PROVIDES_INPUT_FOR
      description: The visual cycle supplies 11-cis-retinal to regenerate the visual pigment.
    - source: phototransduction_photon_capture
      target: phototransduction_transducin
      connection_type: POSITIVELY_REGULATES
      description: Photoactivated opsin catalyses GDP/GTP exchange on transducin alpha.
    - source: phototransduction_transducin
      target: phototransduction_pde6
      connection_type: POSITIVELY_REGULATES
      description: >-
        GTP-bound transducin alpha binds the PDE6 gamma subunits and relieves their
        inhibition of the catalytic subunits.
    - source: phototransduction_pde6
      target: phototransduction_cng_channel
      connection_type: NEGATIVELY_REGULATES
      description: PDE6 hydrolyses the cGMP that holds the CNG channels open.
    - source: phototransduction_cng_channel
      target: phototransduction_nckx
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Ca2+ entering through open CNG channels is extruded by NCKX; channel closure with
        continued extrusion lowers outer-segment Ca2+.
    - source: phototransduction_cng_channel
      target: phototransduction_recoverin
      connection_type: POSITIVELY_REGULATES
      description: >-
        Ca2+ entering through open CNG channels in darkness keeps recoverin in its
        Ca2+-bound, kinase-inhibiting form.
    - source: phototransduction_nckx
      target: phototransduction_recoverin
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Continued Ca2+ extrusion after channel closure lowers Ca2+ and releases recoverin
        from rhodopsin kinase.
    - source: phototransduction_cng_channel
      target: phototransduction_cgmp_resynthesis
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Ca2+ entering through open CNG channels keeps GCAPs in their Ca2+-bound form, which
        does not stimulate retGC.
    - source: phototransduction_nckx
      target: phototransduction_cgmp_resynthesis
      connection_type: POSITIVELY_REGULATES
      description: >-
        The light-induced Ca2+ fall produced by NCKX extrusion converts GCAPs to their
        Ca2+-free, retGC-stimulating form.
    - source: phototransduction_opsin_phosphorylation
      target: phototransduction_photon_capture
      connection_type: NEGATIVELY_REGULATES
      description: Phosphorylation reduces the activity of the photoactivated opsin.
    - source: phototransduction_opsin_phosphorylation
      target: phototransduction_arrestin
      connection_type: PRECEDES
      description: Arrestin binds the phosphorylated opsin.
    - source: phototransduction_arrestin
      target: phototransduction_photon_capture
      connection_type: NEGATIVELY_REGULATES
      description: Arrestin caps the phosphorylated opsin and blocks transducin activation.
    - source: phototransduction_recoverin
      target: phototransduction_opsin_phosphorylation
      connection_type: NEGATIVELY_REGULATES
      description: Ca2+-recoverin inhibits rhodopsin kinase in darkness; the light-induced Ca2+ fall relieves it.
    - source: phototransduction_rgs9_gap
      target: phototransduction_transducin
      connection_type: NEGATIVELY_REGULATES
      description: The RGS9 complex accelerates GTP hydrolysis by transducin alpha.
    - source: phototransduction_cgmp_resynthesis
      target: phototransduction_cng_channel
      connection_type: POSITIVELY_REGULATES
      description: Resynthesised cGMP reopens the CNG channels.
