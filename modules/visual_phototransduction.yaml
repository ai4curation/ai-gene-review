        module_type: REGULATORY_STEP
        description: >-
          At the high Ca2+ of darkness, Ca2+-recoverin binds and inhibits rhodopsin kinase.
          The light-induced fall in Ca2+ releases the kinase and shortens the lifetime of
          active opsin, a component of light adaptation.
