                      term:
                        id: GO:0008020
                        label: G protein-coupled photoreceptor activity
                      targets:
                        - preferred_term: GNAT1 (rod transducin alpha)
                          term:
                            id: UniProtKB:P11488
                            label: Guanine nucleotide-binding protein G(t) subunit alpha-1
                    processes:
