id: MODULE:dmel_raps_insc_complex
title: Pins-Inscuteable (Raps-Insc) complex in Drosophila melanogaster
description: >-
  Partner of Inscuteable (Pins, also called Raps) and Inscuteable (Insc) form a complex at
  the apical cortex of dividing neuroblasts. Insc binds the Par complex through Bazooka and
  recruits Pins, which with the G protein alpha subunit Galphai binds Mud (NuMA) and orients
  the mitotic spindle along the apical-basal axis. This coupling of cell polarity to spindle
  orientation ensures that basal cell-fate determinants segregate into the smaller ganglion
  mother cell during asymmetric neuroblast division.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001988
  title: 'FlyBase gene group RIC: Raps-insc complex'
  statement: >-
    FlyBase release FB2026_03 groups 2 D. melanogaster genes as raps-insc complex (RIC); this
    module models that group.
- source_id: GO:1990499
  title: raps-insc complex
  statement: >-
    GO term grounding the module as raps-insc complex.
notes: >-
  Galphai, Mud and Bazooka bind the complex but are not members of the FlyBase group and are
  treated as context. Pins is also active in epithelia without Insc. FlyBase groups realized
  by this module: RIC (FBgg0001988). Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_raps_insc_complex.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
