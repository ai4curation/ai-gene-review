    - order: 5
      role: carbon-carbon cleavage
      node:
        id: methylisocitrate_cleavage
        label: 2-methylisocitrate cleavage
        module_type: REACTION
        annotons:
          - id: methylisocitrate_lyase
            label: 2-methylisocitrate lyase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PrpB 2-methylisocitrate lyases
                term:
                  id: PANTHER:PTHR42905:SF5
                  label: CARBOXYVINYL-CARBOXYPHOSPHONATE PHOSPHORYLMUTASE, CHLOROPLASTIC
                representative_members:
                  - preferred_term: PrpB (ECOLI)
                    term:
                      id: UniProtKB:P77541
                      label: 2-methylisocitrate lyase
                  - preferred_term: PrpB (PSEPK)
                    term:
                      id: UniProtKB:Q88KF6
                      label: 2-methylisocitrate lyase
                description: >-
                  PrpB enzymes form PANTHER subfamily SF5 of the isocitrate
                  lyase/PEP mutase family PTHR42905 (PANTHER's family and
                  subfamily names notwithstanding);
                  other subfamilies are oxaloacetate decarboxylases and PEP
                  phosphomutases.
                ancestral_nodes:
                  - preferred_term: PAINT node PTN001855076 for methylisocitrate lyase activity
                    term:
                      id: PANTHER:PTN001855076
                      label: PTN001855076
                    description: >-
                      Bacterial PAINT IBD node in PTHR42905 for GO:0046421,
                      seeded by E. coli, Salmonella and Shewanella PrpB; PAINT
                      date 20200810.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN001855076 in PTHR42905.
            function:
              preferred_term: methylisocitrate lyase activity
              term:
                id: GO:0046421
                label: methylisocitrate lyase activity
              substrates:
                - preferred_term: 2-methylisocitrate
              products:
                - preferred_term: succinate
                - preferred_term: pyruvate
              cofactors:
                - preferred_term: magnesium ion
            role_description: >-
              Cleaves 2-methylisocitrate to succinate and pyruvate, returning
              the oxaloacetate-derived carbon skeleton to central metabolism.
  connections:
    - source: propionate_activation
      target: methylcitrate_synthesis
      connection_type: PROVIDES_INPUT_FOR
      description: Propionyl-CoA is the acyl donor for 2-methylcitrate synthesis.
    - source: methylcitrate_synthesis
      target: methylaconitate_generation
      connection_type: PROVIDES_INPUT_FOR
      description: 2-methylcitrate enters either dehydration implementation.
    - source: methylaconitate_generation
      target: methylisocitrate_formation
      connection_type: PROVIDES_INPUT_FOR
      description: Both alternatives converge on 2-methyl-cis-aconitate.
    - source: methylisocitrate_formation
      target: methylisocitrate_cleavage
      connection_type: PROVIDES_INPUT_FOR
      description: 2-methylisocitrate is the substrate cleaved by PrpB.
  notes: >-
    The root is deliberately multi-part and taxon-neutral. Representative
    members are drawn from organisms where each step was characterized
    biochemically or genetically: Escherichia coli K-12 (PrpE, PrpC, PrpD, AcnB,
    PrpB), Salmonella enterica LT2 (AcnA), and Shewanella oneidensis MR-1 (AcnD,
    PrpF), together with Pseudomonas putida KT2440, which encodes both
    dehydration routes. Family descriptors are grounded at the PANTHER subfamily
    that holds the pathway enzymes wherever the family review restricts the
    activity to that subfamily. The fungal mitochondrial cycle (for example,
    yeast CIT3 in citrate synthase subfamily SF15, and a 2-methylisocitrate lyase
    of the isocitrate lyase family) uses enzymes outside these bacterial
    subfamilies, so it is noted but not separately modeled. PrpD and AcnD/PrpF are modeled with ONE_OR_MORE
    semantics because organisms may encode either or both routes (KT2440 and
    Ralstonia eutropha encode both; PMID:14702315). The common hydration step likewise allows AcnA- and
    AcnB-family implementations, which coexist in enteric bacteria and are
    redundant there. E. coli AcnA is not used as an exemplar because its
    2-methylisocitrate dehydratase activity has not been shown directly. KT2440
    AcnA-I (Q88L24) is a candidate for the AcnA route only by orthology, so it is
    also not listed. The AcnD product is represented generically:
    4-methylaconitate is the leading assignment, but the exact structure and
    stereochemistry are not established uniformly across organisms. Propionate
    activation is not exclusive to PrpE; in E. coli, acetyl-CoA synthetase can
    substitute.
