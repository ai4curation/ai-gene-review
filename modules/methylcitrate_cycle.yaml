id: MODULE:methylcitrate_cycle
title: 2-methylcitrate cycle
description: >-
  A propionate-assimilation pathway that activates propionate to propionyl-CoA,
  condenses propionyl-CoA with oxaloacetate to form 2-methylcitrate, converts
  2-methylcitrate to 2-methylisocitrate through alternative
  dehydration/isomerization implementations, and cleaves 2-methylisocitrate to
  succinate and pyruvate. The direct PrpD route is distinguished from the
  two-component AcnD/PrpF route, and the common aconitase-family hydration step
  is represented separately, with AcnB- and AcnA-family implementations. The
  pathway is widespread in proteobacteria and actinobacteria and is also present
  in fungal mitochondria.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0019543
    title: propionate catabolic process
    statement: >-
      GO:0019543 provides the biological-process scope for catabolism of
      propionate through propionyl-CoA and the 2-methylcitrate pathway.
  - source_id: PMID:9325432
    title: >-
      Propionate oxidation in Escherichia coli: evidence for operation of a
      methylcitrate cycle in bacteria.
    statement: >-
      Establishes that E. coli oxidises propionate to pyruvate through the
      methylcitrate cycle first described in fungi, with PrpC as the
      2-methylcitrate synthase.
  - source_id: PMID:12473114
    title: >-
      Oxidation of propionate to pyruvate in Escherichia coli. Involvement of
      methylcitrate dehydratase and aconitase.
    statement: >-
      Resolves the isomerization of 2-methylcitrate to 2-methylisocitrate in
      E. coli into the PrpD dehydration and AcnB hydration steps, and reports
      that acetyl-CoA synthetase can replace PrpE for propionate activation.
  - source_id: PMID:11294638
    title: >-
      In vitro conversion of propionate to pyruvate by Salmonella enterica
      enzymes: 2-methylcitrate dehydratase (PrpD) and aconitase Enzymes catalyze
      the conversion of 2-methylcitrate to 2-methylisocitrate.
    statement: >-
      Reconstitutes the complete cycle in vitro from homogeneous PrpE, PrpC,
      PrpD, AcnA and PrpB, and shows that AcnA and AcnB are redundant for the
      hydration step.
  - source_id: PMID:14702315
    title: >-
      The acnD genes of Shewenella oneidensis and Vibrio cholerae encode a new
      Fe/S-dependent 2-methylcitrate dehydratase enzyme that requires prpF
      function in vivo.
    statement: >-
      Defines the AcnD/PrpF alternative to PrpD: together, but not separately,
      AcnD and PrpF restore growth of a Salmonella prpD mutant on propionate.
  - source_id: PMID:29145506
    title: >-
      The PrpF protein of Shewanella oneidensis MR-1 catalyzes the isomerization
      of 2-methyl-cis-aconitate during the catabolism of propionate via the
      AcnD-dependent 2-methylcitric acid cycle.
    statement: >-
      Shows that PrpF isomerizes the AcnD product into 2-methyl-cis-aconitate,
      the substrate of the housekeeping aconitase, and assigns 4-methylaconitate
      as the probable AcnD product.
  - source_id: PMID:11422389
    title: >-
      2-Methylisocitrate lyases from the bacterium Escherichia coli and the
      filamentous fungus Aspergillus nidulans: characterization and comparison
      of both enzymes.
    statement: >-
      Identifies E. coli PrpB as the 2-methylisocitrate lyase that cleaves
      threo-2-methylisocitrate to succinate and pyruvate.
  - source_id: file:PSEPK/prpC/prpC-ai-review.yaml
    title: PSEPK prpC gene review
    statement: >-
      The curated KT2440 review identifies Q88KF5 as the 2-methylcitrate
      synthase rather than the housekeeping TCA citrate synthase.
  - source_id: file:PSEPK/acnB/acnB-ai-review.yaml
    title: PSEPK acnB gene review
    statement: >-
      The curated KT2440 review identifies Q88KF1 as a bifunctional aconitase
      with a core 2-methylisocitrate dehydratase/hydratase role in propionate
      assimilation.
  - source_id: file:PSEPK/prpD/prpD-uniprot.txt
    title: UniProtKB entry Q88KF2 for PSEPK PrpD
    statement: >-
      UniProt records the direct 2-methylcitrate to 2-methyl-cis-aconitate
      dehydration reaction for Q88KF2.
  - source_id: file:PSEPK/prpF/prpF-uniprot.txt
    title: UniProtKB entry Q88KF3 for PSEPK PrpF
    statement: >-
      UniProt places the PrpF-family aconitate isomerase Q88KF3 in propionate
      degradation.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__methylcitrate_cycle__ppu00640-deep-research-openscientist.md
    title: OpenScientist PSEPK 2-methylcitrate-cycle pathway report
    statement: >-
      The pathway-level family and locus analysis resolves PP_2336 as AcnD,
      confirms that both dehydration implementations coexist in KT2440, and
      identifies both AcnA-I and AcnB as candidate enzymes for the common
      hydration step.
  - source_id: file:modules/methylcitrate_cycle-deep-research-openscientist.md
    title: OpenScientist review of the 2-methylcitrate cycle
    statement: >-
      The generic module review supports modeling the direct PrpD and
      two-component AcnD/PrpF routes as alternative implementations that
      converge before a shared aconitase step. It also cautions that the exact
      AcnD product structure is not established uniformly across systems.
module:
  id: methylcitrate_cycle
  label: 2-methylcitrate cycle
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: propionate catabolic process
      term:
        id: GO:0019543
        label: propionate catabolic process
      description: >-
        Conversion of propionate-derived propionyl-CoA to pyruvate and
        succinate through 2-methylcitrate intermediates.
  parts:
    - order: 1
      role: propionate activation
      node:
        id: propionate_activation
        label: Propionate activation to propionyl-CoA
        module_type: REACTION
        annotons:
          - id: propionate_coa_ligase
            label: Propionate-CoA ligase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PrpE-family propionate-CoA ligases
                term:
                  id: PANTHER:PTHR43347
                  label: ACYL-COA SYNTHETASE
                representative_members:
                  - preferred_term: PrpE (ECOLI)
                    term:
                      id: UniProtKB:P77495
                      label: Propionate--CoA ligase
                  - preferred_term: PrpE (PSEPK)
                    term:
                      id: UniProtKB:Q88KD9
                      label: Propionyl-CoA synthetase
                ancestral_nodes:
                  - preferred_term: PAINT node PTN001944621 for propionate-CoA ligase activity
                    term:
                      id: PANTHER:PTN001944621
                      label: PTN001944621
                    description: >-
                      PAINT IBD node in PTHR43347 for GO:0050218, seeded by
                      E. coli and Salmonella PrpE and human and rat ACSS3; PAINT
                      date 20220223.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN001944621 in PTHR43347.
            function:
              preferred_term: propionate-CoA ligase activity
              term:
                id: GO:0050218
                label: propionate-CoA ligase activity
              substrates:
                - preferred_term: propionate
                - preferred_term: CoA
                - preferred_term: ATP
              products:
                - preferred_term: propionyl-CoA
                - preferred_term: AMP
                - preferred_term: diphosphate
            role_description: >-
              Supplies the propionyl-CoA substrate used by 2-methylcitrate
              synthase. Nonorthologous activation routes, such as acetyl-CoA
              synthetase in E. coli, require separate pathway-instance
              adjudication.
    - order: 2
      role: 2-methylcitrate formation
      node:
        id: methylcitrate_synthesis
        label: 2-methylcitrate synthesis
        module_type: REACTION
        annotons:
          - id: methylcitrate_synthase
            label: 2-methylcitrate synthase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: PrpC-type 2-methylcitrate synthases
                term:
                  id: PANTHER:PTHR11739:SF25
                  label: CITRATE SYNTHASE-RELATED PROTEIN DDB_G0287281
                representative_members:
                  - preferred_term: PrpC (ECOLI)
                    term:
                      id: UniProtKB:P31660
                      label: 2-methylcitrate synthase
                  - preferred_term: PrpC (PSEPK)
                    term:
                      id: UniProtKB:Q88KF5
                      label: 2-methylcitrate synthase
                description: >-
                  Bacterial PrpC enzymes form PANTHER subfamily SF25 of the
                  citrate synthase family (PANTHER's subfamily name
                  notwithstanding). The dual-specificity fungal mitochondrial
                  CIT3-type enzymes (SF15) are a separate eukaryotic
                  implementation and are not grounded here.
                ancestral_nodes:
                  - preferred_term: PAINT node PTN002621568 for 2-methylcitrate synthase activity
                    term:
                      id: PANTHER:PTN002621568
                      label: PTN002621568
                    description: >-
                      PAINT IBD node in PTHR11739 for GO:0050440, seeded by the
                      E. coli, Salmonella and Shewanella PrpC enzymes; PAINT date
                      20200807.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002621568 in PTHR11739.
            function:
              preferred_term: 2-methylcitrate synthase activity
              term:
                id: GO:0050440
                label: 2-methylcitrate synthase activity
              substrates:
                - preferred_term: propionyl-CoA
                - preferred_term: oxaloacetate
                - preferred_term: H2O
              products:
                - preferred_term: 2-methylcitrate
                - preferred_term: CoA
            role_description: >-
              Condenses propionyl-CoA and oxaloacetate to commit carbon to the
              cycle.
    - order: 3
      role: 2-methyl-cis-aconitate generation
      node:
        id: methylaconitate_generation
        label: Conversion of 2-methylcitrate to 2-methyl-cis-aconitate
        module_type: METABOLIC_PATHWAY
        description: >-
          Alternative direct and two-component implementations produce the
          2-methyl-cis-aconitate substrate used by the common hydration step.
        variant_sets:
          - id: methylaconitate_generation_routes
            label: 2-methylcitrate dehydration implementations
            axis: reaction mechanism
            selection: ONE_OR_MORE
            variants:
              - id: prpD_direct_route
                label: Direct PrpD route
                module_type: REACTION
                annotons:
                  - id: prpD_methylcitrate_dehydratase
                    label: PrpD 2-methylcitrate dehydratase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: PrpD 2-methylcitrate dehydratases
                        term:
                          id: PANTHER:PTHR16943:SF8
                          label: 2-METHYLCITRATE DEHYDRATASE
                        representative_members:
                          - preferred_term: PrpD (ECOLI)
                            term:
                              id: UniProtKB:P77243
                              label: 2-methylcitrate dehydratase
                          - preferred_term: PrpD (PSEPK)
                            term:
                              id: UniProtKB:Q88KF2
                              label: 2-methylcitrate dehydratase
                        description: >-
                          PrpD enzymes form PANTHER subfamily SF8 of the MmgE/PrpD
                          family, which also contains cis-aconitate decarboxylases;
                          family membership alone does not establish this activity.
                    function:
                      preferred_term: 2-methylcitrate dehydratase activity
                      term:
                        id: GO:0047547
                        label: 2-methylcitrate dehydratase activity
                      substrates:
                        - preferred_term: 2-methylcitrate
                      products:
                        - preferred_term: 2-methyl-cis-aconitate
                        - preferred_term: H2O
                    role_description: >-
                      Directly dehydrates (2S,3S)-2-methylcitrate to
                      2-methyl-cis-aconitate by a syn elimination.
              - id: acnD_prpF_route
                label: Two-component AcnD/PrpF route
                module_type: METABOLIC_PATHWAY
                description: >-
                  An aconitase-family dehydratase first forms a positional
                  methylaconitate isomer, which PrpF rearranges to
                  2-methyl-cis-aconitate.
                parts:
                  - order: 1
                    role: AcnD-dependent dehydration
                    node:
                      id: acnD_dehydration
                      label: AcnD-family 2-methylcitrate dehydration
                      module_type: REACTION
                      annotons:
                        - id: acnD_pathway_dehydratase
                          label: AcnD 2-methylcitrate dehydratase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: AcnD-family 2-methylcitrate dehydratases
                              term:
                                id: NCBIfam:TIGR02333
                                label: Fe/S-dependent 2-methylisocitrate dehydratase AcnD
                              representative_members:
                                - preferred_term: AcnD (SHEON)
                                  term:
                                    id: UniProtKB:Q8EJW3
                                    label: 2-methylcitrate dehydratase (2-methyl-trans-aconitate forming)
                                - preferred_term: AcnD (PSEPK)
                                  term:
                                    id: UniProtKB:Q88KF4
                                    label: AcnD-family 2-methylcitrate dehydratase
                              description: >-
                                AcnD forms a diverged lineage within the AcnA-type
                                aconitase family (PANTHER PTHR11670), lacking
                                isocitrate and 2-methylisocitrate activity despite
                                the NCBIfam model name. PTHR11670 assigns no
                                subfamilies and also contains the canonical
                                aconitases and iron-regulatory proteins, so the
                                AcnD-specific NCBIfam model is used to ground this
                                role.
                          function:
                            preferred_term: hydro-lyase activity
                            term:
                              id: GO:0016836
                              label: hydro-lyase activity
                            substrates:
                              - preferred_term: 2-methylcitrate
                            products:
                              - preferred_term: AcnD-derived methylaconitate isomer
                              - preferred_term: H2O
                            cofactors:
                              - preferred_term: 4 iron, 4 sulfur cluster
                          role_description: >-
                            Dehydrates 2-methylcitrate to the methylaconitate
                            isomer used by PrpF. GO lacks an
                            AcnD-specific product-resolved molecular-function
                            term, so the available hydro-lyase parent is used.
                  - order: 2
                    role: methylaconitate isomerization
                    node:
                      id: prpF_isomerization
                      label: PrpF methylaconitate isomerization
                      module_type: REACTION
                      annotons:
                        - id: prpF_aconitate_isomerase
                          label: PrpF aconitate isomerase
                          participant:
                            selector_type: FAMILY
                            family:
                              preferred_term: PrpF methylaconitate isomerases
                              term:
                                id: PANTHER:PTHR43709:SF2
                                label: DUF453 DOMAIN PROTEIN (AFU_ORTHOLOGUE AFUA_6G00360)
                              representative_members:
                                - preferred_term: PrpF (SHEON)
                                  term:
                                    id: UniProtKB:Q8EJW4
                                    label: 2-methyl-aconitate isomerase
                                - preferred_term: PrpF (PSEPK)
                                  term:
                                    id: UniProtKB:Q88KF3
                                    label: Aconitate isomerase
                              ancestral_nodes:
                                - preferred_term: PAINT node PTN002017920 for C=C-transposing isomerase activity
                                  term:
                                    id: PANTHER:PTN002017920
                                    label: PTN002017920
                                  description: >-
                                    PAINT IBD node in PTHR43709 for GO:0016863,
                                    seeded by Shewanella PrpF; PAINT date 20241126.
                                    Sound for the PrpF clade; whether it should also
                                    reach the GalD-type tautomerases of SF3 is
                                    unresolved in the family review.
                                  evidence:
                                    - source_id: GO_REF:0000033
                                      statement: IBD propagation from PAINT node PTN002017920 in PTHR43709.
                          function:
                            preferred_term: intramolecular oxidoreductase activity, transposing C=C bonds
                            term:
                              id: GO:0016863
                              label: intramolecular oxidoreductase activity, transposing C=C bonds
                            substrates:
                              - preferred_term: AcnD-derived methylaconitate isomer
                            products:
                              - preferred_term: 2-methyl-cis-aconitate
                          role_description: >-
                            Converts the AcnD product (probably
                            4-methyl-cis-aconitate) to 2-methyl-cis-aconitate by
                            moving the C=C bond. GO lacks a
                            methylaconitate-specific isomerase term (a
                            'methylaconitate isomerase activity' term is proposed
                            in the PrpF gene reviews), so the C=C-transposing
                            parent is used.
                connections:
                  - source: acnD_dehydration
                    target: prpF_isomerization
                    connection_type: PROVIDES_INPUT_FOR
                    description: The AcnD product is the substrate rearranged by PrpF.
    - order: 4
      role: 2-methylisocitrate formation
      node:
        id: methylisocitrate_formation
        label: 2-methyl-cis-aconitate hydration
        module_type: REACTION
        variant_sets:
          - id: methylisocitrate_hydratase_families
            label: Aconitase-family hydration implementations
            axis: aconitase paralog family
            selection: ONE_OR_MORE
            variants:
              - id: acnB_hydration_route
                label: AcnB-family hydration
                module_type: REACTION
                annotons:
                  - id: acnB_methylisocitrate_hydratase
                    label: AcnB-family 2-methylisocitrate hydratase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: AcnB-family aconitate hydratases with methylisocitrate activity
                        term:
                          id: PANTHER:PTHR43160:SF4
                          label: ACONITATE HYDRATASE B
                        representative_members:
                          - preferred_term: AcnB (ECOLI)
                            term:
                              id: UniProtKB:P36683
                              label: Aconitate hydratase B
                          - preferred_term: AcnB (PSEPK)
                            term:
                              id: UniProtKB:Q88KF1
                              label: Aconitate hydratase B
                        ancestral_nodes:
