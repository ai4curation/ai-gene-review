                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation from PAINT node PTN001362560 in PTHR43160.
                    function:
                      preferred_term: 2-methylisocitrate dehydratase activity
                      term:
                        id: GO:0047456
                        label: 2-methylisocitrate dehydratase activity
                      substrates:
                        - preferred_term: 2-methyl-cis-aconitate
                        - preferred_term: H2O
                      products:
                        - preferred_term: 2-methylisocitrate
                      cofactors:
                        - preferred_term: 4 iron, 4 sulfur cluster
                    role_description: >-
                      Uses the reversible aconitase-family reaction in the
                      hydration direction to form the PrpB substrate.
              - id: acnA_hydration_route
                label: AcnA-family hydration
                module_type: REACTION
                annotons:
                  - id: acnA_methylisocitrate_hydratase
                    label: AcnA-family 2-methylisocitrate hydratase
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: AcnA-family aconitate hydratases with methylisocitrate activity
                        term:
                          id: NCBIfam:TIGR01341
                          label: aconitate hydratase AcnA
                        representative_members:
                          - preferred_term: AcnA (SALTY)
                            term:
                              id: UniProtKB:Q8ZP52
                              label: Aconitate hydratase A
                        description: >-
                          AcnA-type aconitases (NCBIfam TIGR01341) within PANTHER
                          PTHR11670. The PANTHER family is not used here because it
                          has no subfamilies and also contains AcnD and the
                          iron-regulatory proteins. Hydration of
                          2-methyl-cis-aconitate is shown for Salmonella AcnA and
                          should be transferred only with organism-specific evidence.
                    function:
                      preferred_term: 2-methylisocitrate dehydratase activity
                      term:
                        id: GO:0047456
                        label: 2-methylisocitrate dehydratase activity
                      substrates:
                        - preferred_term: 2-methyl-cis-aconitate
                        - preferred_term: H2O
                      products:
                        - preferred_term: 2-methylisocitrate
                      cofactors:
                        - preferred_term: 4 iron, 4 sulfur cluster
                    role_description: >-
                      Provides a second aconitase-family implementation of the
                      reversible hydration step where AcnA retains this
