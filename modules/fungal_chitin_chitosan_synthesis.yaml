id: MODULE:fungal_chitin_chitosan_synthesis
title: Fungal chitin synthesis and deacetylation to chitosan
description: >-
  Chitin, a linear beta-1,4-linked polymer of N-acetylglucosamine, is a minor
  but essential structural polysaccharide of the fungal cell wall, septa and
  spore walls. It is made at the plasma membrane by chitin synthases,
  processive multi-pass membrane GT-2 glycosyltransferases that transfer
  N-acetylglucosamine from cytosolic UDP-N-acetylglucosamine to the growing
  chain and extrude the chain through a transmembrane channel to the cell
  surface. Fungi have several chitin synthase classes with different cellular
  jobs. In budding yeast, chitin synthase II (Chs2) makes the primary septum at
  the bud neck, chitin synthase III (catalytic Chs3 activated by the Chs4 or,
  in sporulation, Shc1 subunit) makes most cell-wall chitin, the chitin ring at
  bud emergence and the chitin of the spore wall, and chitin synthase I (Chs1)
  repairs the birth scar after cell separation. Loss of all three is lethal.
  Some nascent chitin is then deacetylated by secreted or membrane-anchored
  CE4-family chitin deacetylases to give chitosan, a beta-1,4-glucosamine
  polymer. In budding yeast this happens only in the ascospore wall, where the
  sporulation-specific deacetylases Cda1 and Cda2 convert Chs3-made chitin into
  the chitosan layer; in other fungi, such as Cryptococcus neoformans,
  deacetylases also make chitosan in the vegetative wall. The supply of
  UDP-N-acetylglucosamine (hexosamine pathway), chitin synthase trafficking and
  localisation factors, and chitin cross-linking or degradation are outside the
  module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006031
    title: chitin biosynthetic process
    statement: Module-level process concept.
  - source_id: GO:0006030
    title: chitin metabolic process
    statement: >-
      GO has no chitosan biosynthesis term; the deacetylation step is grounded
      as chitin metabolism within ascospore wall assembly.
  - source_id: GO:0030476
    title: ascospore wall assembly
    statement: Process context of the S. cerevisiae Chs3 plus Cda1/Cda2 chitosan arm.
  - source_id: YeastPathways:PWY3O-15
    title: chitin biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      YeastCyc lists CHITIN-SYNTHASE-RXN with CHS1, CHS2 and CHS3; all three
      were retained, separated by synthase class. The comment names Chs4 as
      essential for Chs3 activity but does not attach it; Chs4 (SKT5) and its
      sporulation paralog Shc1 were added as activating subunits of chitin
      synthase III.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-15
  - source_id: YeastPathways:PWY3O-70
    title: chitosan biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: YeastCyc lists CHITIN-DEACETYLASE-RXN with CDA1 and CDA2. Both retained.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-70
  - source_id: PMID:8257107
    title: Genetics and molecular biology of chitin synthesis in fungi.
    statement: >-
      Review of the three S. cerevisiae chitin synthases and their distinct
      roles; chitin synthase III makes about 90% of cellular chitin.
    supporting_text: >-
      Chitin synthase III is required for the synthesis of 90% of the cellular chitin,
      including the chitin in the bud scars and lateral wall.
  - source_id: PMID:12228806
    title: The genetic complexity of chitin synthesis in fungi.
    statement: >-
      Fungi have one (S. pombe) to seven (Aspergillus fumigatus) chitin
      synthase isoenzymes, which supports modelling synthase classes as
      variants.
    supporting_text: >-
      Chitin synthesis is based on the regulation of distinct chitin
      synthase isoenzymes whose number ranges from one in Schizosaccharomyces pombe to
      seven in some filamentous fungi, such as Aspergillus fumigatus.
  - source_id: PMID:16760306
    title: Cell wall assembly in Saccharomyces cerevisiae.
    statement: Review of yeast cell wall composition and assembly, including chitin (cited by YeastPathways).
  - source_id: PMID:2050738
    title: The function of chitin synthases 2 and 3 in the Saccharomyces cerevisiae cell cycle.
    statement: >-
      Chs2 is specific for the primary septum; Chs3 makes the chitin ring,
      lateral-wall chitin and the chitosan of spore walls; loss of all three
      chitin synthases is lethal.
    supporting_text: >-
      Therefore, Chs2 is specific for primary septum formation,
      whereas Chs3 is responsible for chitin in the ring at bud emergence and in the
      cell wall.
  - source_id: PMID:2523889
    title: Chitin synthase 1, an auxiliary enzyme for chitin synthesis in Saccharomyces cerevisiae.
    statement: Chs1 is an auxiliary repair enzyme that prevents lysis at the birth scar under acidic conditions.
    supporting_text: >-
      The latter emerges as an auxiliary or emergency enzyme.
  - source_id: PMID:1293886
    title: DIT101 (CSD2, CAL1), a cell cycle-regulated yeast gene required for synthesis of chitin in cell walls and chitosan in spore walls.
    statement: CHS3 (DIT101/CSD2) is required for spore-wall chitosan as well as for vegetative chitin.
    supporting_text: >-
      Chemical measurements showed that this mutant does not synthesize
      chitosan during sporulation.
  - source_id: PMID:9234668
    title: Characterization of CHS4 (CAL2), a gene of Saccharomyces cerevisiae involved in chitin biosynthesis and allelic to SKT5 and CSD4.
    statement: Chs4 is a post-translational activator required for full chitin synthase III activity.
    supporting_text: >-
      we therefore propose that Chs4p would be an essential
      component of the CSIII complex, acting as a post-translational regulator of this
      activity.
  - source_id: PMID:17142567
    title: Prenylation of Saccharomyces cerevisiae Chs4p Affects Chitin Synthase III activity and chitin chain length.
    statement: Chs4 physically interacts with Chs3 and is indispensable for its activity in vivo.
    supporting_text: >-
      Chs4p (Cal2/Csd4/Skt5) was identified as a protein factor physically interacting
      with Chs3p, the catalytic subunit of chitin synthase III (CSIII), and is
      indispensable for its enzymatic activity in vivo.
  - source_id: PMID:11918806
    title: Control of chitin synthesis through Shc1p, a functional homologue of Chs4p specifically induced during sporulation.
    statement: Shc1 is a sporulation-specific Chs4 homolog needed for normal spore-wall chitosan.
    supporting_text: >-
      Shc1p is required for proper maturation of the
      ascospore through its participation in the synthesis of the chitosan layer.
  - source_id: PMID:10366589
    title: Chs7p, a new protein involved in the control of protein export from the endoplasmic reticulum that is specifically engaged in the regulation of chitin synthesis in Saccharomyces cerevisiae.
    statement: >-
      Chs7 is an ER protein needed for Chs3 export; it is a trafficking factor
      kept outside the module.
    supporting_text: >-
      In the absence of CHS7 product, Chs3p, but not other secreted proteins, is retained in the ER
  - source_id: PMID:8940152
    title: Two sporulation-specific chitin deacetylase-encoding genes are required for the ascospore wall rigidity of Saccharomyces cerevisiae.
    statement: CDA1 and CDA2 account for all chitin deacetylase activity and are sporulation-specific.
    supporting_text: >-
      We have cloned the CDA1 and
      CDA2 genes which together account for the total chitin deacetylase activity of
      the organism.
  - source_id: PMID:17400891
    title: Chitosan, the deacetylated form of chitin, is necessary for cell wall integrity in Cryptococcus neoformans.
    statement: >-
      In Cryptococcus neoformans, three chitin deacetylases convert
      Chs3-made chitin into vegetative cell-wall chitosan, showing that the
      synthase-to-deacetylase coupling is not restricted to spores.
    supporting_text: >-
      The data suggest a model for
      chitosan production in vegetatively growing C. neoformans where the three chitin
      deacetylases convert chitin generated by the chitin synthase Chs3 into chitosan.
  - source_id: PMID:36131020
    title: Structural basis for directional chitin biosynthesis.
    statement: >-
      Cryo-EM structures of an oomycete chitin synthase show the reaction
      chamber and polymer-translocating channel of the membrane enzyme.
    supporting_text: >-
      The key reactions of
      chitin biosynthesis are catalysed by chitin synthase2-4, a membrane-integrated
      glycosyltransferase that transfers GlcNAc from UDP-GlcNAc to a growing chitin
      chain.
