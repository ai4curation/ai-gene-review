  notes: >-
    NEW module (YeastPathways crosswalk, 2026-10) combining PWY3O-15 (chitin
    biosynthesis) and PWY3O-70 (chitosan biosynthesis). The polymerisation
    step is modelled with chitin-synthase class variants (CSIII, CSII, CSI);
    the deacetylation step is an optional second part, linked specifically to
    CSIII. Corrections and additions to YeastCyc: (1) the three synthases share
    one reaction in YeastCyc; they are separated here because they build
    different structures (PMID:2050738, PMID:2523889, PMID:8257107). (2) The
    CSIII activator Chs4/Skt5, named in the YeastCyc comment, and its
    sporulation paralog Shc1 were added as non-catalytic activator subunits
    (GO:0008047). (3) The chitin synthases are placed in the plasma membrane
    (CSII at the bud neck), not the cytosol. GO-CAM disagreements: the
    YeastPathways PWY3O-15 model puts all three chitin synthase activities in
    the cytosol and omits Chs4; there is no GO-CAM for PWY3O-70. Consistency
    with gene reviews: the CHS7 review gives Chs7 a protein folding chaperone
    function in ER-to-Golgi transport of Chs3, so Chs7, like the exomer
    (Chs5/Chs6) and the chitin-ring scaffold Bni4, is treated as trafficking
    and localisation machinery outside the module. UDP-N-acetylglucosamine
    supply is the hexosamine_biosynthesis module (GFA1, GNA1, PCM1, QRI1 in
    yeast). GO has no chitosan biosynthetic process term, so the deacetylation
    part uses chitin metabolic process (GO:0006030) and its S. cerevisiae
    annoton uses ascospore wall assembly; a chitosan biosynthesis term could
    be requested. The Cryptococcus deacetylases (PMID:17400891) generalise the
    step to vegetative walls but are not used as exemplars because their
    UniProt accessions were not verified. No PomBase GO-CAM is linked; S.
    pombe is not used as an exemplar.
