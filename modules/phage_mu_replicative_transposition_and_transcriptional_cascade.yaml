id: MODULE:phage_mu_replicative_transposition_and_transcriptional_cascade
title: Escherichia Phage Mu Lysis-Lysogeny Switch, Replicative Transposition, and Mor-C Transcriptional Cascade
description: 'A concrete pathway module for the transposable temperate bacteriophage Mu (Muvirus mu, NCBITaxon:2681603) covering: (1) the bimodal lysis-lysogeny decision governed by the competition between Repressor protein c (Repc, P06019) and Negative regulator of transcription Ner (P06020) at the O1/O2/O3 operator-enhancer region (IAS) between the PcM and Pe promoters; (2) post-ejection non-covalent circularization and host RecBCD exonuclease protection of the linear phage genome by injected virion protein N (P08557) and early Ku-homolog DNA-end protection protein Gam (P06023); (3) conservative integration and lytic replicative transposition catalyzed by the tetrameric DDE-recombinase MuA transpososome (P07636) and the ATP-dependent target-site selector/target-immunity protein MuB (P03763); and (4) the sequential middle-to-late transcriptional activation cascade driven by the Middle operon regulator Mor (P23848, activating Pm) and the Late transcription activator C (P06022, activating Plys, PI, PP, and Pmom).'
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:9546656
    title: 'Oligomeric structure of the repressor of the bacteriophage Mu early operon.'
    statement: Repressor protein c (Repc) regulates the lytic-lysogenic decision of bacteriophage Mu by binding three operator sites (O1, O2, and O3) overlapping two divergent promoters in the early operator/enhancer region.
    supporting_text: 'The regulation of the lytic and lysogenic development in the life cycle of bacteriophage Mu is regulated in part by its repressor, c, which binds to three operator sites, O1, O2 and O3, overlapping two divergent promoters.'
  - source_id: PMID:12049743
    title: 'Direct observation of single MuB polymers: evidence for a DNA-dependent conformational change for generating an active target complex.'
    statement: MuB is an ATP-dependent DNA-binding protein that polymerizes on DNA to select target sites on the host chromosome and activate the MuA transpososome during Mu transposition.
    supporting_text: 'MuB, an ATP-dependent DNA binding protein, is critical for selection of target sites on the host chromosome during Mu transposition.'
  - source_id: PMID:14729670
    title: 'Crystal structure of the Mor protein of bacteriophage Mu, a member of the Mor/C family of transcription activators.'
    statement: Defines the structural basis of Mor dimerization and transcriptional activation of the Mu middle promoter Pm, initiating the Mor/C middle-to-late transcriptional cascade.
    supporting_text: 'Transcription from the middle promoter, Pm, of bacteriophage Mu requires the phage-encoded activator protein Mor and bacterial RNA polymerase.'
notes: Curated for Phase 7 of the Bacteriophage Genome & Module Curation project (`projects/PHAGES.md`). Unlike lambdoid phages (lambda, P22) or P2, phage Mu never excises its prophage genome upon induction and encodes no DNA polymerase or primase; instead, MuA and MuB assemble a strand-transfer transpososome whose 3'-OH nicked target ends prime host DNA polymerase III holoenzyme for cointegrate replicative transposition.
module:
  id: phage_mu_replicative_transposition_and_transcriptional_cascade
  label: Phage Mu Replicative Transposition and Transcriptional Cascade
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: latency-replication decision
      term:
        id: GO:0098689
        label: latency-replication decision
      description: Competition between Repc and Ner at operators O1-O3 and between Repc and MuA at the internal activation sequence (IAS) to choose between lysogenic latency and lytic transposition.
    - preferred_term: DNA transposition
      term:
        id: GO:0006313
        label: DNA transposition
      description: MuA- and MuB-catalyzed conservative integration and lytic replicative transposition of the Mu genome into random host chromosomal target sites.
    - preferred_term: positive regulation of viral transcription
      term:
        id: GO:0050434
        label: positive regulation of viral transcription
      description: Sequential activation of the Mu middle promoter (Pm) by Mor and the four late promoters (Plys, PI, PP, Pmom) by C.
  context:
    taxa:
      - preferred_term: Escherichia phage Mu
        term:
          id: NCBITaxon:2681603
          label: Escherichia phage Mu
      - preferred_term: Escherichia coli
        term:
          id: NCBITaxon:562
          label: Escherichia coli
  parts:
    - order: 1
      role: Repc-Ner bistable operator switch and superinfection immunity
      node:
        id: repc_ner_latency_replication_switch
        label: Repc and Ner operator competition at Pe and PcM
        module_type: BIOLOGICAL_PROCESS
        description: Repressor protein c (Repc) binds operators O1, O2, and O3 overlapping the early promoter Pe and the internal activation sequence (IAS), repressing lytic early transcription and competing directly with MuA transposase for IAS enhancer binding. Conversely, the Cro-like negative regulator Ner binds between Pe and PcM to repress PcM (blocking Repc synthesis) while autoregulating Pe transcription during lytic commitment.
        annotons:
          - id: repc_lysogenic_repressor_activity
            label: Repc repression of early promoter Pe and competition with MuA at the IAS enhancer
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: repc (Escherichia phage Mu)
                term:
                  id: UniProtKB:P06019
                  label: Repressor protein c
              description: Master lysogenic repressor c (Repc) that maintains prophage latency and superinfection immunity by repressing Pe and blocking MuA enhancer binding.
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: latency-replication decision
                term:
                  id: GO:0098689
                  label: latency-replication decision
              - preferred_term: establishment of viral latency
                term:
                  id: GO:0019043
                  label: establishment of viral latency
              - preferred_term: maintenance of viral latency
                term:
                  id: GO:0019044
                  label: maintenance of viral latency
            locations:
              - preferred_term: host cell cytoplasm
                term:
                  id: GO:0030430
                  label: host cell cytoplasm
            evidence:
              - source_id: file:genes/BPMU/repc/repc-uniprot.txt
                statement: Repc promotes latency by binding operators O1 and O2 to repress Pe and competes with DDE-recombinase A for binding to the internal activation sequence (IAS).
                supporting_text: Promotes latency by binding operators O1 and O2 in the     enhancer/operator region, thereby repressing the transcription from the     Pe (early) promoter and blocking the expression of the genes required     for replication (lytic growth).
            role_description: Binds O1/O2/O3 operators to silence the lytic early promoter Pe and prevent MuA transpososome activation at the IAS enhancer.
          - id: ner_lytic_commitment_repressor_activity
            label: Ner repression of PcM and homeostatic negative regulation of Pe
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: ner (Escherichia phage Mu)
                term:
                  id: UniProtKB:P06020
                  label: Negative regulator of transcription
              description: Cro-equivalent early transcriptional regulator Ner that shuts off Repc expression from PcM and dampens Pe transcription to keep early gene dosage independent of copy number.
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: latency-replication decision
                term:
                  id: GO:0098689
                  label: latency-replication decision
              - preferred_term: negative regulation of DNA-templated transcription
                term:
                  id: GO:0045892
                  label: negative regulation of DNA-templated transcription
            locations:
              - preferred_term: host cell cytoplasm
                term:
                  id: GO:0030430
                  label: host cell cytoplasm
            evidence:
              - source_id: file:genes/BPMU/ner/ner-uniprot.txt
                statement: Ner switches off PcM to block Repc synthesis and negatively regulates Pe to maintain copy-number-independent early transcription.
                supporting_text: Switches off the PcM promoter thereby blocking expression of     the major repressor Repc (latency factor) and favoring transcription     from the early promoter (Pe) and hence viral transposition and lytic     development.
            role_description: Represses PcM to commit the phage to lytic transposition while buffering early Pe transcription as genome copy number rises.
    - order: 2
      role: Non-covalent genome circularization and DNA-end protection
      node:
        id: n_gam_genome_circularization_and_end_protection
        label: Injected N protein circularization and Gam Ku-like DNA-end protection
        module_type: BIOLOGICAL_PROCESS
        description: Following ejection of the linear Mu genome (which carries heterogeneous host flanking DNA at both ends), co-injected virion protein N binds both ends to form a non-covalently closed, supercoiled DNA-protein complex protected from host exonucleases, while early protein Gam (a bacterial Ku homolog) binds linear dsDNA ends to block host RecBCD nuclease degradation and facilitate conservative integration.
        annotons:
          - id: n_injected_dna_circularization
            label: Protein N non-covalent circularization and exonuclease protection of ejected viral DNA
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: N (Escherichia phage Mu)
                term:
                  id: UniProtKB:P08557
                  label: DNA circularization protein N
              description: Virion baseplate-associated protein N ejected into the host cell with the phage genome to bridge the linear DNA ends into a non-covalent supercoiled circle.
            function:
              preferred_term: DNA binding
              term:
                id: GO:0003677
                label: DNA binding
            processes:
              - preferred_term: viral life cycle
                term:
                  id: GO:0019058
                  label: viral life cycle
            locations:
              - preferred_term: host cell cytoplasm
                term:
                  id: GO:0030430
                  label: host cell cytoplasm
            evidence:
              - source_id: file:genes/BPMU/N/N-uniprot.txt
                statement: Protein N circularizes the viral DNA after ejection into a non-covalent supercoiled protein-DNA complex and protects linear viral dsDNA from host exonuclease degradation.
                supporting_text: Required for tail assembly of phage Mu and responsible for     circularizing the viral DNA after it has been ejected into the host     cell.
            role_description: Bridges the two ends of ejected linear Mu DNA into a supercoiled non-covalent circle required for efficient L-R synapsis and protects the ends from host exonucleases.
          - id: gam_linear_dna_end_protection
            label: Gam homodimer binding and protection of linear dsDNA ends
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: gam (Escherichia phage Mu)
                term:
                  id: UniProtKB:P06023
                  label: Putative DNA ends protecting protein gam
              description: Early homodimeric Ku-like DNA-end binding protein Gam that shields linear dsDNA termini from host exonucleases without sequence specificity.
            function:
              preferred_term: double-stranded DNA binding
              term:
                id: GO:0003690
                label: double-stranded DNA binding
            processes:
              - preferred_term: viral life cycle
                term:
                  id: GO:0019058
                  label: viral life cycle
            locations:
              - preferred_term: host cell cytoplasm
                term:
                  id: GO:0030430
                  label: host cell cytoplasm
            evidence:
              - source_id: file:genes/BPMU/gam/gam-uniprot.txt
                statement: Gam binds linear double-stranded DNA termini and protects them from host exonuclease degradation.
                supporting_text: Protects linear double-stranded DNA from host exonuclease     degradation. Binds to linear dsDNA irrespective of the precise     architecture of the DNA terminus but not to RNA or to ssDNA.
            role_description: Caps linear dsDNA ends to prevent degradation by host exonucleases during infection and conservative integration.
    - order: 3
      role: MuA-MuB transpososome assembly, target immunity, and replicative transposition
      node:
        id: mua_mub_transpososome_replicative_transposition
        label: MuA DDE-recombinase strand transfer and MuB ATP-dependent target capture
        module_type: BIOLOGICAL_PROCESS
        description: Monomeric MuA binds the L1-L3 and R1-R3 att ends and the internal activation sequence (IAS) to assemble a stable tetrameric transpososome assisted by host IHF and HU. MuA nicks the 3' ends of the viral genome and catalyzes concerted strand transfer into a 5-bp staggered target site captured by ATP-bound MuB helical filaments. MuA simultaneously stimulates MuB ATPase activity on nearby DNA to clear MuB from cis-linked Mu copies (transposition target immunity). During initial infection, 5' host flanking flaps are resected with host ClpX assistance for conservative integration; during lytic growth, ClpX remodels the strand-transfer complex so host PriA and DNA polymerase III holoenzyme replicate across the Mu genome via target-primed replicative transposition.
        annotons:
          - id: mua_dde_transposase_activity
            label: MuA DDE-recombinase DNA cleavage, strand transfer, and 5'-flap resection
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: A (Escherichia phage Mu)
                term:
                  id: UniProtKB:P07636
                  label: DDE-recombinase A
              description: Catalytic DDE-family transposase MuA that forms the tetrameric transpososome at Mu attL/attR ends and drives both initial chromosomal integration and lytic replicative transposition.
            function:
              preferred_term: transposase activity
              term:
                id: GO:0004803
                label: transposase activity
            processes:
              - preferred_term: DNA transposition
                term:
                  id: GO:0006313
                  label: DNA transposition
              - preferred_term: establishment of integrated proviral latency
                term:
                  id: GO:0075713
                  label: establishment of integrated proviral latency
              - preferred_term: viral genome replication
                term:
                  id: GO:0019079
                  label: viral genome replication
            locations:
              - preferred_term: host cell cytoplasm
                term:
                  id: GO:0030430
                  label: host cell cytoplasm
            evidence:
              - source_id: file:genes/BPMU/A/A-uniprot.txt
                statement: DDE-recombinase A cleaves both viral DNA ends and catalyzes nucleophilic attack on host DNA for both conservative integration and lytic replicative transposition.
                supporting_text: Responsible for viral genome integration into the host     chromosome. During integration of the incoming virus, DDE-recombinase A     cleaves both viral DNA ends and the resulting 3'-OH perform a     nucleophilic attack of the host DNA.
            role_description: Cleaves the 3' ends of the Mu genome and catalyzes concerted strand transfer into host target DNA to generate 3'-OH replication primers.
          - id: mub_target_dna_activator_activity
            label: MuB ATP-dependent target DNA capture, MuA activation, and cis target immunity
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: B (Escherichia phage Mu)
                term:
                  id: UniProtKB:P03763
                  label: ATP-dependent target DNA activator B
              description: AAA+ ATPase MuB that polymerizes as helical filaments on non-immune target DNA, delivers target DNA to the MuA transpososome, allosterically activates MuA strand transfer, and dissociates upon MuA-stimulated ATP hydrolysis to enforce cis target immunity.
            function:
              preferred_term: ATP hydrolysis activity
              term:
                id: GO:0016887
                label: ATP hydrolysis activity
            processes:
              - preferred_term: DNA transposition
                term:
                  id: GO:0006313
                  label: DNA transposition
              - preferred_term: viral genome replication
                term:
                  id: GO:0019079
                  label: viral genome replication
            locations:
              - preferred_term: host cell cytoplasm
                term:
                  id: GO:0030430
                  label: host cell cytoplasm
            evidence:
              - source_id: file:genes/BPMU/B/B-uniprot.txt
                statement: MuB selects target DNA sites for transposition, recruits and catalytically activates DDE-recombinase A, and prevents self-integration via target immunity.
                supporting_text: Selects the target DNA sites for transposition. Recruits DDE-     recombinase A to the target sites and catalytically activates it.
            role_description: Coats non-Mu target DNA in an ATP-dependent filament to recruit and activate the MuA transpososome while preventing self-insertion into existing Mu copies.
    - order: 4
      role: Sequential Mor -> C middle and late transcriptional activation cascade
      node:
        id: mor_c_middle_and_late_transcriptional_cascade
        label: Mor activation of middle promoter Pm and C activation of late promoters Plys, PI, PP, and Pmom
        module_type: BIOLOGICAL_PROCESS
        description: Once replicative transposition initiates, the semi-essential early product Mor homodimerizes via an intertwined helix-turn-helix fold, binds the middle promoter Pm (-51 to -36), and contacts the C-terminal domains of host RNA polymerase alpha (RpoA) and sigma-70 (RpoD) subunits to activate middle operon transcription. The middle operon encodes Late transcription activator C, a Mg2+-dependent homodimeric Mor paralog that binds and unwinds the four late promoters (Plys, PI, PP, and Pmom) to realign promoter elements and recruit host RNA polymerase for late morphogenesis, lysis, and DNA modification gene expression.
        annotons:
          - id: mor_middle_promoter_activator_activity
            label: Mor homodimer transcriptional activation of the middle promoter Pm
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: mor (Escherichia phage Mu)
                term:
                  id: UniProtKB:P23848
                  label: Middle operon regulator
              description: Homodimeric HTH transcription activator Mor that binds Pm and recruits host RNA polymerase via RpoA/RpoD interactions to express the late activator C.
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: positive regulation of viral transcription
                term:
                  id: GO:0050434
                  label: positive regulation of viral transcription
            locations:
              - preferred_term: host cell cytoplasm
                term:
                  id: GO:0030430
                  label: host cell cytoplasm
            evidence:
              - source_id: file:genes/BPMU/mor/mor-uniprot.txt
                statement: Mor activates the Pm middle promoter to drive expression of late transcription activator C.
                supporting_text: Activator of the Pm promoter, which controls middle genes     expression. Activation of Pm allows expression of protein C necessary     for late gene expression.
            role_description: Activates the middle promoter Pm following replicative DNA synthesis, coupling DNA replication to expression of the late activator C.
          - id: c_late_promoter_activator_activity
            label: Protein C Mg2+-dependent activation of late promoters Plys, PI, PP, and Pmom
            participant:
              selector_type: SPECIFIC_GENE_PRODUCT
              gene_product:
                preferred_term: C (Escherichia phage Mu)
                term:
                  id: UniProtKB:P06022
                  label: Late transcription activator C
              description: Mg2+-binding homodimeric transcription activator C that unwinds and activates Plys, PI, PP, and Pmom to initiate late morphogenesis, SAR-endolysin lysis, and Mom DNA methylcarbamoylation.
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: positive regulation of viral transcription
                term:
                  id: GO:0050434
                  label: positive regulation of viral transcription
            locations:
              - preferred_term: host cell cytoplasm
                term:
                  id: GO:0030430
                  label: host cell cytoplasm
            evidence:
              - source_id: file:genes/BPMU/C/C-uniprot.txt
                statement: Late transcription activator C activates the Plys, PI, PP, and Pmom late promoters by unwinding promoter DNA and recruiting host RNA polymerase.
                supporting_text: Positive regulator of viral late genes transcription.     Responsible for the transition from middle to late gene expression.     Activates the Plys, PI, PP and Pmom late promoters thereby allowing the     expression of viral endolysin and structural genes.
            role_description: Activates the four late promoters (Plys, PI, PP, Pmom) to turn on capsid/tail assembly, SAR-endolysin lysis, and Mom antirestriction modification.
  connections:
    - source: repc_ner_latency_replication_switch
      target: mua_mub_transpososome_replicative_transposition
      connection_type: REGULATES
      predicate:
        preferred_term: regulates
        term:
          id: RO:0002211
          label: regulates
      description: Ner repression of PcM relieves Repc operator/IAS occupancy, permitting Pe transcription of MuA and MuB and allowing MuA to engage the internal activation sequence (IAS) enhancer to assemble the active transpososome.
    - source: n_gam_genome_circularization_and_end_protection
      target: mua_mub_transpososome_replicative_transposition
      connection_type: PROVIDES_INPUT_FOR
      predicate:
        preferred_term: provides input for
        term:
          id: RO:0002413
          label: provides input for
      description: Non-covalent circularization of ejected viral DNA by protein N and end-protection by Gam preserve the linear genome ends and supercoiling required for MuA transpososome synapsis and conservative integration.
    - source: mua_mub_transpososome_replicative_transposition
      target: mor_c_middle_and_late_transcriptional_cascade
      connection_type: POSITIVELY_REGULATES
      predicate:
        preferred_term: positively regulates
        term:
          id: RO:0002213
          label: positively regulates
      description: Replicative transposition amplifies the early transcript encoding Mor and provides replication-coupled template activation required for Mor-dependent transcription from the middle promoter Pm.
  knowledge_gaps:
    - gap_statement: Several semi-essential early genes transcribed between B and C (including Mup06, Mup07, Mup08, Mup09, Mup11, Mup12/arm, Mup13, Mup14, Mup15, and gemA) modulate host nucleoid supercoiling, DNA ligase activity, or transposition efficiency, but their molecular targets and biochemical activities remain largely uncharacterized.
      boundary: Restrict concrete module annotons in the early/middle region to the biochemically defined regulators and transposition factors (Repc, Ner, N, Gam, MuA, MuB, Mor, and C).
      gap_kind:
        - BIOLOGY
        - CURATION
