id: MODULE:dmel_intraflagellar_transport
title: Intraflagellar transport complexes A and B in Drosophila melanogaster
description: >-
  Intraflagellar transport (IFT) moves protein cargo along the axoneme between the ciliary
  base and tip. IFT trains are built from two multi-subunit complexes: IFT-B, which is carried
  toward the tip by kinesin-2 and is required for anterograde transport and axoneme assembly,
  and IFT-A, which is needed mainly for retrograde transport by cytoplasmic dynein 2 and for
  import of membrane proteins. In Drosophila, cilia occur only on type I sensory neurons and
  on sperm. IFT is required to build the sensory cilia of chordotonal and external sensory
  neurons, and mutants such as nompB (IFT88) lack mechanosensory potentials, whereas most
  of the sperm axoneme is assembled without IFT.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000046
  title: 'FlyBase gene group IFT: Intraflagellar transport complexes'
  statement: >-
    FlyBase release FB2026_03 groups 23 D. melanogaster genes as intraflagellar transport
    complexes (IFT); this module models that group.
- source_id: GO:0030990
  title: intraciliary transport particle
  statement: >-
    GO term grounding the module as intraciliary transport particle.
notes: >-
  The BBSome subgroup (BBS) of the FlyBase IFT group is already covered by the existing bbsome
  module and is not repeated here. IFT-B is not split into its IFT-B1 and IFT-B2 subcomplexes
  because not all Drosophila members have been mapped to them. Kinesin-2 and cytoplasmic dynein
  2 motors (see dmel_cytoplasmic_dynein_dynactin) are context, not parts. FlyBase groups realized
  by this module: IFT (FBgg0000046). Subgroups folded into it: IFT-A, IFT-B. Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_intraflagellar_transport.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
