  knowledge_gaps:
    - gap_statement: >
        Arabidopsis CERK1 binds chitin directly but the rice OsCERK1 gene review removed chitin binding
        from OsCERK1, so the orthologous kinases carry different ligand-binding claims. Whether OsCERK1
        contacts chitin at all within the CEBiP-OsCERK1 complex has not been shown.
      boundary: >-
        CEBiP is the major chitin-binding protein of rice cells and OsCERK1 is required as the kinase;
        Arabidopsis CERK1 ectodomain binds chitin with low affinity (Kd about 455 uM) and is dimerized by
        chitin octamers.
      gap_kind:
        - BIOLOGY
        - CURATION
      status: OPEN
      significance: Determines whether chitin binding is an ancestral CERK1 property kept in Arabidopsis
        and lost or masked in rice, or an Arabidopsis-specific addition, and therefore whether chitin
        binding should be propagated across CERK1 orthologs.
      resolution: Direct binding assays of the OsCERK1 ectodomain under the same conditions used for
        AtCERK1, and structure of the ligand-bound CEBiP-OsCERK1 complex.
      provenance:
        - reference_id: PMID:21070404
          supporting_text: it does appear that CEBiP plays a major role in chitin elicitor binding and
            that OsCERK1 functions as a signal transducer through its Ser/Thr kinase activity in rice
    - gap_statement: >
        Which of the two OsRLCK185 substrates, OsMAPKKKepsilon (OsMAPKKK24) or OsMAPKKK18, carries most
        of the chitin signal to OsMKK4-OsMPK3/OsMPK6 in rice is unknown.
      boundary: >-
        OsRLCK185 is directly phosphorylated by OsCERK1 and phosphorylates OsMAPKKKepsilon and
        OsMAPKKK18, each of which interacts with OsMKK4 upstream of OsMPK3/OsMPK6 (OsRLCK185 gene review).
        The two substrates were identified by separate groups and have not been compared in one system.
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: Determines which rice MAP3K is the chitin-specific relay, and so which one should be
        grounded as the rice member of the MAP3K step.
      resolution: Compare chitin-induced OsMPK3/OsMPK6 activation and blast resistance in single and
        double OsMAPKKKepsilon/OsMAPKKK18 mutants, and test OsRLCK185 phosphosite mutants of each
        substrate.
      provenance:
        - reference_id: PMID:23498959
          supporting_text: How the MAP kinase cascades are engaged downstream of OsCERK1 remains
            obscure.
        - reference_id: PMID:28111288
          supporting_text: OsRLCK185 interacts with and phosphorylates the C-terminal regulatory domain of
            OsMAPKKKε.
        - reference_id: PMID:28371870
          supporting_text: These results suggested that OsRLCK185 connects the chitin receptor to the MAPK
            cascade consisting of OsMAPKKK18-OsMKK4-OsMPK3/6.
    - gap_statement: >
        The genetic contribution of PBL27 to chitin-induced MAPKKK5 phosphorylation and MPK3/MPK6
        activation is disputed. Shinya et al. 2014 report reduced chitin-induced MAPK activation in
        pbl27, but Rao et al. 2018 and Bi et al. 2018 found normal MAPK activation or
        MAPKKK5 phosphorylation in pbl27 and attribute the step mainly to RLCK VII-4 kinases (e.g. PBL19,
        at MAPKKK5 Ser-599, distinct from the PBL27 C-terminal sites).
      boundary: >-
        PBL27 phosphorylates MAPKKK5 in a CERK1-dependent manner and interacts with it at the plasma
        membrane; RLCK VII-4 members are required for chitin-triggered MAPK activation; RLCK VII kinases
        phosphorylate MAPKKK5 Ser-599, which is required for pattern-triggered MPK3/MPK6 activation. The
        PBL27 and MAPKKK5 gene reviews keep the PBL27 kinase activity and record the dispute.
      gap_kind:
        - BIOLOGY
        - CURATION
      status: OPEN
      significance: Decides whether PBL27 or RLCK VII-4 kinases should be the representative members of
        the RLCK-to-MAP3K step. RLCK VII-4 kinases are not added here because none has a gene review in
        this repository and the Rao and Bi papers are abstract-only in the cache.
      resolution: Compare chitin-induced MAPKKK5 phosphorylation (Ser-599 and the PBL27 C-terminal sites)
        and MPK3/MPK6 activation in pbl27, rlck vii-4 and combined mutants under matched conditions, then
        review PBL19 and the other RLCK VII-4 members.
      provenance:
        - reference_id: PMID:24750441
          supporting_text: Knockout of PBL27 resulted in the suppression of several chitin-induced defense
            responses, including the activation of MPK3/6
        - reference_id: PMID:29907700
          supporting_text: RLCK VII-4 members were required for the chitin-triggered activation of MAPK,
            demonstrating that these kinases link a PRR to MAPK activation
        - reference_id: PMID:29871986
          supporting_text: directly phosphorylate MAPKKK5 Ser-599, which is required for pattern-triggered
            MPK3/6 activation
        - reference_id: file:ARATH/PBL27/PBL27-deep-research-falcon.md
          supporting_text: Two 2018 studies found normal MAPKKK5 phosphorylation or MAPK activation in
            *pbl27* and RLCK-VII-1 higher-order mutants, but strong defects in an RLCK-VII-4 sextuple
            mutant.
    - gap_statement: >
        The chitin-specific link from CERK1 to RBOHD through BIK1 is less well supported than the
        RLCK-MAPKKK5 link. BIK1 associates with CERK1 and chitin-induced ROS is reported to depend on BIK1
        phosphorylation of RBOHD, but whether CERK1 phosphorylates BIK1 directly, and which RLCK VII members
        carry the chitin ROS output, has not been shown; the BIK1 gene review has no chitin-specific core
        function. Whether PBL1 contributes at all is unclear: its gene review finds no evidence that PBL1
        alone phosphorylates RBOHD (only bik1 pbl1 double mutants were tested), and pbl1 (cce5) mutants
        have a normal chitin-induced Ca2+ response. RLCK VII-4 mutants are specifically defective in
        chitin-induced ROS, suggesting that other RLCKs share or carry this output.
      boundary: >-
        BIK1 directly phosphorylates RBOHD after PAMP perception; BIK1 associates with CERK1; the
        chitin-induced ROS burst depends on RBOHD and does not depend on PBL27 or MAPKKK5; PBL1 is required
        for full Ca2+ responses to flg22, elf18 and AtPep1 but not chitin.
      gap_kind:
        - BIOLOGY
        - CURATION
      status: OPEN
      significance: Decides whether the ROS branch should name BIK1 alone, BIK1 with PBL1, or RLCK VII-4
        kinases as the chitin RBOHD kinases. PBL1 is kept out of the annoton until PBL1-specific chitin or
        RBOHD evidence exists.
      resolution: Test chitin-induced RBOHD phosphorylation and ROS in pbl1 single, bik1 single, bik1 pbl1
        and rlck vii-4 mutants; map RBOHD sites phosphorylated by recombinant PBL1 versus kinase-dead PBL1;
        and test whether CERK1 phosphorylates BIK1 or PBL1 in vitro.
      provenance:
        - reference_id: PMID:27494702
          supporting_text: BIK1 also associates with the LysM-RK CERK1 and the LRR-RK PEPR1, which
            mediate immune responses to fungal chitin
        - reference_id: PMID:25522736
          supporting_text: a survey of different MAMPs/DAMPs showed reduced calcium responses to flg22,
            elf18 and AtPep1 but a normal response to chitin octamers (ch8) in cce5
        - reference_id: PMID:29907700
          supporting_text: rlck vii-4 was defective specifically in chitin-induced reactive oxygen species
            production
        - reference_id: file:ARATH/PBL1/PBL1-ai-review.yaml
          supporting_text: PBL1 binds the RBOHD N-terminus, but RBOHD phosphosite loss has only been
            measured in bik1 pbl1 double mutants and direct site-resolved phosphorylation was shown for
