  knowledge_gaps:
    - gap_statement: >
        Arabidopsis CERK1 binds chitin directly but the rice OsCERK1 gene review removed chitin binding
        from OsCERK1, so the orthologous kinases carry different ligand-binding claims. Whether OsCERK1
        contacts chitin at all within the CEBiP-OsCERK1 complex has not been shown.
      boundary: >-
        CEBiP is the major chitin-binding protein of rice cells and OsCERK1 is required as the kinase;
        Arabidopsis CERK1 ectodomain binds chitin with low affinity (Kd about 455 uM) and is dimerized by
        chitin octamers.
      gap_kind:
        - BIOLOGY
        - CURATION
      status: OPEN
      significance: Determines whether chitin binding is an ancestral CERK1 property kept in Arabidopsis
        and lost or masked in rice, or an Arabidopsis-specific addition, and therefore whether chitin
        binding should be propagated across CERK1 orthologs.
      resolution: Direct binding assays of the OsCERK1 ectodomain under the same conditions used for
        AtCERK1, and structure of the ligand-bound CEBiP-OsCERK1 complex.
      provenance:
        - reference_id: PMID:21070404
          supporting_text: it does appear that CEBiP plays a major role in chitin elicitor binding and
            that OsCERK1 functions as a signal transducer through its Ser/Thr kinase activity in rice
    - gap_statement: >
        The rice steps downstream of OsRLCK185 (which MAP3K it phosphorylates, and the MAP2K/MAPK
        pair) and the rice ROS route (OsRLCK176, OsRacGEF1-OsRac1 and the rice RBOH) are not grounded
        in this module.
      boundary: >-
        OsRLCK185 is directly phosphorylated by OsCERK1 and is needed for chitin-induced MAPK
        activation; the Arabidopsis branch (PBL27-MAPKKK5-MKK4/MKK5-MPK3/MPK6) is fully grounded.
      gap_kind:
        - CURATION
      status: OPEN
      significance: Without the rice members the MAPK and ROS branches are grounded only in
        Arabidopsis, although the receptor variant set is grounded in both species.
      resolution: Cache the rice MAP kinase and OsRacGEF1/OsRac1 papers, review the genes, and add rice
        representative members to the downstream steps.
      provenance:
        - reference_id: PMID:23498959
          supporting_text: How the MAP kinase cascades are engaged downstream of OsCERK1 remains
            obscure.
    - gap_statement: >
        The chitin-specific link from CERK1 to BIK1-type RLCKs and RBOHD is less well supported than the
        PBL27-MAPKKK5 link. BIK1 associates with CERK1, but the cached evidence for direct BIK1
        phosphorylation of RBOHD comes from flagellin signalling, and no gene review grounds a
        CERK1-BIK1 phosphorylation.
      boundary: >-
        BIK1 directly phosphorylates RBOHD after PAMP perception; BIK1 associates with CERK1; the
        chitin-induced ROS burst depends on RBOHD and does not depend on PBL27 or MAPKKK5.
      gap_kind:
        - BIOLOGY
        - CURATION
      status: OPEN
      significance: Decides whether the ROS branch should name BIK1/PBL1 or another RLCK as the chitin
        RBOHD kinase.
      resolution: Test chitin-induced RBOHD phosphorylation and ROS in bik1 pbl1 mutants, and whether
        CERK1 phosphorylates BIK1 or PBL1 in vitro.
      provenance:
        - reference_id: PMID:27494702
          supporting_text: BIK1 also associates with the LysM-RK CERK1 and the LRR-RK PEPR1, which
            mediate immune responses to fungal chitin
    - gap_statement: >
        A second, CERK1-independent chitin pathway closes plasmodesmata: LYM2 with LYK4 and LYK5, CPK6
        and CPK11, and RBOHD. It is outside this module and not yet modelled as its own module.
      boundary: >-
        LYM2 binds chitin and is needed for chitin-induced plasmodesmal closure; CERK1 is not; the
        plasmodesmal response needs LYK4, LYK5 and RBOHD.
      gap_kind:
        - CURATION
      status: OPEN
      significance: The two chitin pathways share LYK4/LYK5 and RBOHD, so annotating either from the
        other would mix outputs. A separate plasmodesmal chitin-response module would keep them apart.
        The LYM2 gene review proposes a term for negative regulation of plasmodesmata-mediated
        intercellular transport, which GO lacks.
      resolution: Build a plasmodesmal chitin-response module with LYM2 (O23006) as the chitin binder,
        after the CPK6/CPK11 genes are reviewed.
      provenance:
        - reference_id: PMID:23674687
          supporting_text: is not required for chitin-induced
            changes to plasmodesmata flux, suggesting that there are at least two
            chitin-activated response pathways
        - reference_id: PMID:32284410
          supporting_text: responses in the plasmodesmal PM require the LysM receptor kinases LYK4 and
            LYK5 in addition to LYM2
