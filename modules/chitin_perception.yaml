id: MODULE:chitin_perception
title: Plant chitin perception by LysM receptor complexes
description: >
  Plants detect fungal cell-wall chitin oligosaccharides at the plasma membrane with LysM-domain pattern
  recognition receptors. A ligand-binding LysM protein (CEBiP-type LysM-RLP in rice; the LysM-RLKs LYK5 and
  LYK4 in Arabidopsis) binds chitin and forms a complex with the LysM receptor kinase CERK1, whose kinase
  domain is activated and phosphorylates receptor-like cytoplasmic kinases (PBL27/OsRLCK185 and BIK1-type).
  These relay the signal to a MAPKKK-MKK4/5-MPK3/6 cascade and to RBOHD-dependent ROS production, driving
  chitin-triggered immunity. Fungal LysM effectors (e.g. Ecp6, Slp1) sequester chitin oligomers to evade
  this system.
status: DRAFT
scope: ABSTRACT
