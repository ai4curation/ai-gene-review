        label: LysM receptor complex (chitin binder + CERK1 kinase)
        module_type: PROTEIN_COMPLEX
        description: >-
          A chitin-binding LysM protein and the LysM receptor kinase CERK1 form a ligand-induced complex at
          the plasma membrane. In every configuration the active kinase is CERK1; what varies is which
          protein binds the chitin.
