id: MODULE:bacterial_3sp_thioether_desulfination
title: Bacterial 3-mercaptopropionate and 3-sulfinopropionate desulfination pathway
status: COMPLETE
description: >-
  Three-step aerobic catabolic pathway by which Variovorax paradoxus strain
  TBEA6 and related betaproteobacteria degrade the organosulfur compounds
  3-mercaptopropionate (3MP, generated by cleavage of the thioether
  3,3'-thiodipropionate, TDP) and 3-sulfinopropionate (3SP) into propanoyl-CoA
  and inorganic sulfite. First, the cysteine dioxygenase homolog Mdo
  (3-mercaptopropionate dioxygenase, EC 1.13.11.20) catalyzes the O2-dependent
  dioxygenation of 3-mercaptopropionate to 3-sulfinopropionate (PMID:19001372).
  Second, the homodimeric class III CoA-transferase Act
  (succinyl-CoA:3-sulfinopropionate CoA-transferase, UniProtKB:B9U6P4,
  VPARA_05450) transfers CoA from succinyl-CoA (or itaconyl-CoA/glutaryl-CoA)
  to 3-sulfinopropionate to form 3-sulfinopropanoyl-CoA (3SP-CoA) and succinate
  (PMID:23772073). Third, the homotetrameric FAD-containing
  3-sulfinopropanoyl-CoA desulfinase Acd (EC 3.13.1.4; Variovorax paradoxus
  UniProtKB:B9U6P5 / Advenella mimigardefordensis UniProtKB:Q705F0), encoded
  immediately downstream of act, catalyzes the non-oxidative C-S bond cleavage
  (desulfination) of 3-sulfinopropanoyl-CoA into propanoyl-CoA and sulfite
  (PMID:24317404), channeling the carbon skeleton into the methylcitrate cycle.
evidence:
  - source_id: PMID:19001372
    title: 3-mercaptopropionate dioxygenase, a cysteine dioxygenase homologue, catalyzes the initial step of 3-mercaptopropionate catabolism in the 3,3-thiodipropionic acid-degrading bacterium variovorax paradoxus.
    statement: Elucidates the 3-mercaptopropionate and 3-sulfinopropionate catabolic pathway in Variovorax paradoxus TBEA6, demonstrating Mdo-catalyzed oxygenation of 3-mercaptopropionate to 3-sulfinopropionate and subsequent CoA activation and desulfination to propionyl-CoA.
    supporting_text: Insertion of Tn5::mob in a gene putatively coding for a family III acyl-CoA-transferase resulted in the accumulation of 3-sulfinopropionate during cultivation on 3,3-thiodipropionic acid, indicating that this compound is further metabolized to 3-sulfinopropionyl-CoA and subsequently to propionyl-CoA.
  - source_id: PMID:23772073
    title: Succinyl-CoA:3-sulfinopropionate CoA-transferase from Variovorax paradoxus strain TBEA6, a novel member of the class III coenzyme A (CoA)-transferase family.
    statement: Purifies and kinetically characterizes Variovorax paradoxus TBEA6 Act (B9U6P4) as a homodimeric class III succinyl-CoA:3-sulfinopropionate CoA-transferase that converts 3-sulfinopropionate into 3-sulfinopropanoyl-CoA.
    supporting_text: The act gene of Variovorax paradoxus TBEA6 encodes a succinyl-CoA:3-sulfinopropionate coenzyme A (CoA)-transferase, Act(TBEA6) (2.8.3.x), which catalyzes the activation of 3-sulfinopropionate (3SP), an intermediate during 3,3'-thiodipropionate (TDP) degradation.
  - source_id: PMID:24317404
    title: Identification of 3-sulfinopropionyl coenzyme A (CoA) desulfinases within the Acyl-CoA dehydrogenase superfamily.
    statement: Purifies and characterizes Variovorax paradoxus TBEA6 Acd (B9U6P5) and orthologous bacterial Acd enzymes as homotetrameric FAD-dependent 3-sulfinopropanoyl-CoA desulfinases (EC 3.13.1.4) that cleave 3SP-CoA into propanoyl-CoA and sulfite.
    supporting_text: Only AcdTBEA6, AcdN-1, and AcdLB400 desulfinated 3SP-CoA and were thus identified as 3SP-CoA desulfinases within the acyl-CoA dehydrogenase family, although none of these three Acds dehydrogenated any of the tested acyl-CoA thioesters.
module:
  id: bacterial_3sp_thioether_desulfination
  label: Bacterial 3-mercaptopropionate and 3-sulfinopropionate desulfination pathway
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: sulfur compound catabolic process
      term:
        id: GO:0044273
        label: sulfur compound catabolic process
      description: >-
        Aerobic catabolism of 3-mercaptopropionate and 3-sulfinopropionate to
        propanoyl-CoA and sulfite via Mdo, Act, and Acd.
  context:
    taxa:
      - preferred_term: Variovorax paradoxus
        term:
          id: NCBITaxon:34073
          label: Variovorax paradoxus
  parts:
    - order: 1
      role: dioxygenation of 3-mercaptopropionate to 3-sulfinopropionate
      node:
        id: mdo_3mp_dioxygenase_step
        label: Mdo 3-mercaptopropionate dioxygenation
        module_type: REACTION
        annotons:
          - id: mdo_dioxygenase_activity
            label: Mdo 3-mercaptopropionate dioxygenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Mdo 3-mercaptopropionate dioxygenases (EC 1.13.11.20)
                representative_members:
                  - preferred_term: mdo (Variovorax paradoxus TBEA6)
                    term:
                      id: UniProtKB:B9U6P1
                      label: Mdo
                    description: >-
                      Variovorax paradoxus TBEA6 3-mercaptopropionate
                      dioxygenase purified and characterized in PMID:19001372.
            function:
              preferred_term: 3-mercaptopropionate dioxygenase activity
              term:
                id: GO:0016702
                label: oxidoreductase activity, acting on single donors with incorporation of molecular oxygen, incorporation of two atoms of oxygen
              substrates:
                - preferred_term: 3-mercaptopropionate
                - preferred_term: dioxygen
              products:
                - preferred_term: 3-sulfinopropionate
            role_description: >-
              Catalyzes the Fe(II)- and O2-dependent oxidation of the thiol
              group of 3-mercaptopropionate to form 3-sulfinopropionate (3SP).
    - order: 2
      role: CoA-transferase activation of 3-sulfinopropionate to 3-sulfinopropanoyl-CoA
      node:
        id: act_3sp_coa_transferase_step
        label: Act succinyl-CoA:3-sulfinopropionate CoA transfer
        module_type: REACTION
        annotons:
          - id: act_coa_transferase_activity
            label: Act succinyl-CoA:3-sulfinopropionate CoA-transferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Act family III succinyl-CoA:3-sulfinopropionate CoA-transferases
                representative_members:
                  - preferred_term: act (Variovorax paradoxus TBEA6)
                    term:
                      id: UniProtKB:B9U6P4
                      label: Act
                    description: >-
                      Variovorax paradoxus TBEA6 VPARA_05450 (Act(TBEA6));
                      homodimeric class III CoA-transferase characterized in
                      PMID:23772073.
            function:
              preferred_term: succinyl-CoA:3-sulfinopropionate CoA-transferase activity
              term:
                id: GO:0008410
                label: CoA-transferase activity
              substrates:
                - preferred_term: 3-sulfinopropionate
                - preferred_term: succinyl-CoA
              products:
                - preferred_term: 3-sulfinopropanoyl-CoA
                - preferred_term: succinate
            role_description: >-
              Transfers the CoA moiety from succinyl-CoA (or
              itaconyl-CoA/glutaryl-CoA) to 3-sulfinopropionate to generate
              3-sulfinopropanoyl-CoA (3SP-CoA).
    - order: 3
      role: non-oxidative FAD-dependent desulfination of 3-sulfinopropanoyl-CoA to propanoyl-CoA and sulfite
      node:
        id: acd_3sp_coa_desulfinase_step
        label: Acd 3-sulfinopropanoyl-CoA desulfination
        module_type: REACTION
        annotons:
          - id: acd_desulfinase_activity
            label: Acd 3-sulfinopropanoyl-CoA desulfinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Acd 3-sulfinopropanoyl-CoA desulfinases (EC 3.13.1.4)
                representative_members:
                  - preferred_term: acd (Advenella mimigardefordensis DPN7)
                    term:
                      id: UniProtKB:Q705F0
                      label: Acd
                    description: >-
                      Advenella mimigardefordensis DPN7 3-sulfinopropanoyl-CoA
                      desulfinase (EC 3.13.1.4), orthologous to Variovorax
                      paradoxus TBEA6 Acd (UniProtKB:B9U6P5, VPARA_05440) and
                      capable of complementing the V. paradoxus act::Tn5::mob
                      polar mutant (PMID:23772073, PMID:24317404).
            function:
              preferred_term: 3-sulfinopropanoyl-CoA desulfinase activity
              term:
                id: GO:0016787
                label: hydrolase activity
              substrates:
                - preferred_term: 3-sulfinopropanoyl-CoA
                - preferred_term: water
              products:
                - preferred_term: propanoyl-CoA
                - preferred_term: sulfite
            role_description: >-
              Uses a non-redox, structurally bound FAD cofactor to catalyze the
              hydrolytic C-S bond cleavage (desulfination, EC 3.13.1.4) of
              3-sulfinopropanoyl-CoA into propanoyl-CoA and inorganic sulfite.
  connections:
    - source: mdo_3mp_dioxygenase_step
      target: act_3sp_coa_transferase_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Mdo oxidizes 3-mercaptopropionate to 3-sulfinopropionate (3SP), the
        carboxylate substrate activated by Act.
    - source: act_3sp_coa_transferase_step
      target: acd_3sp_coa_desulfinase_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        Act converts 3-sulfinopropionate into 3-sulfinopropanoyl-CoA (3SP-CoA),
        the direct thioester substrate desulfinated by Acd (UniProtKB:B9U6P5 /
        UniProtKB:Q705F0).
  notes: >-
    Grounded on the Variovorax paradoxus strain TBEA6 (NCBITaxon:34073)
    3,3'-thiodipropionate (TDP) and 3-sulfinopropionate (3SP) catabolic gene
    cluster encoding Mdo (UniProtKB:B9U6P1; PMID:19001372), Act
    (UniProtKB:B9U6P4, VPARA_05450; PMID:23772073), and Acd (UniProtKB:B9U6P5,
    VPARA_05440; PMID:24317404, complemented in vivo by Advenella
    mimigardefordensis DPN7 Acd UniProtKB:Q705F0 in PMID:23772073).
