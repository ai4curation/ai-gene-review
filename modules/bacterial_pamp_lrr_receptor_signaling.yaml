    - preferred_term: detection of bacterium
      term:
        id: GO:0016045
        label: detection of bacterium
      description: The perception step performed by FLS2 and EFR; both receptor gene reviews use this
        term.
    - preferred_term: pathogen-associated molecular pattern receptor signaling pathway
      term:
        id: GO:0140426
        label: pathogen-associated molecular pattern receptor signaling pathway
      description: The receptor-initiated signalling the module describes; FLS2, EFR and BAK1 gene
        reviews use this term.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: Concrete Arabidopsis instance. FLS2 orthologs occur widely in flowering plants, but
          EFR is restricted to the Brassicaceae.
    cellular_components:
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
        description: Receptor complex, RLCKs and RBOHD act at the plasma membrane; the MAPKs also act in
          the cytoplasm and nucleus (see annoton locations).
