  description: >-
    flg22 or elf18 perception by the LRR-RK pattern recognition receptor FLS2 or EFR with the co-receptor
    BAK1, and the two RLCK-dependent branches it starts: BIK1 to the RBOHD ROS burst, and RLCK VII to the
    MAPKKK3/5-MKK4/5-MPK3/6 relay.
