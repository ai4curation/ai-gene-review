          supporting_text: directly phosphorylate MAPKKK5 Ser-599, which is required for pattern-triggered
            MPK3/6 activation
  knowledge_gaps:
    - gap_statement: >
        Which RLCK VII kinase or kinases phosphorylate MAPKKK5 (and MAPKKK3) downstream of FLS2 and EFR
        is unresolved; BIK1 is the defined RLCK for the RBOHD branch, but no single RLCK has been shown
        to be required for flg22- or elf18-induced MPK3/MPK6 activation.
      boundary: >-
        RLCK VII kinases as a group phosphorylate MAPKKK5 Ser-599, and this site is required for
        pattern-triggered MPK3/MPK6 activation (PMID:29871986). For chitin, PBL27 and RLCK VII-4 kinases
        are the candidates (MODULE:chitin_perception).
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: Defines the branch point where the flagellin and EF-Tu signal splits between the
        ROS burst and the MAPK relay, and whether the split is set by RLCK identity.
      resolution: Higher-order RLCK VII subfamily mutants tested for flg22- and elf18-induced MPK3/MPK6
        activation and MAPKKK5 Ser-599 phosphorylation, with complementation by single members.
      provenance:
        - reference_id: PMID:29871986
          supporting_text: the MAPKKKs responsible for MPK3/6 activation downstream of diverse PRRs and how
            the perception of diverse molecular patterns leads to the activation of MAPKKKs remain elusive
    - gap_statement: >
        How FERONIA, as a RALF-regulated scaffold, promotes the ligand-induced association of FLS2 and
        EFR with BAK1 is not known, including which FER domain contacts the receptor complex and whether
        FER kinase activity is needed.
      boundary: >-
        FER facilitates ligand-induced FLS2-BAK1 and EFR-BAK1 complex formation, and RALF23 binding to FER
        inhibits immune signalling (PMID:28104890).
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: Determines whether FER should be modelled as a regulator part of the receptor
        complex, and links cell-wall integrity and RALF signalling to PRR complex assembly.
      resolution: Test kinase-dead and domain-deleted FER variants for restoration of flg22-induced
        FLS2-BAK1 association and ROS in fer mutants, and map the FER-receptor-complex interface.
      provenance:
        - reference_id: PMID:28104890
          supporting_text: We show that FER acts as a RALF-regulated scaffold that modulates receptor
            kinase complex assembly.
