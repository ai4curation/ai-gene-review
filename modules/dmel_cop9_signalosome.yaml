id: MODULE:dmel_cop9_signalosome
title: COP9 signalosome in Drosophila melanogaster
description: >-
  The COP9 signalosome (CSN) is an eight-subunit complex that removes the ubiquitin-like protein
  Nedd8 from cullins, thereby controlling the activity and assembly of cullin-RING ubiquitin
  ligases. Six subunits (CSN1, CSN2, CSN3, CSN4, CSN7 and CSN8) contain PCI domains and form
  a horseshoe-shaped scaffold, and two subunits (CSN5 and CSN6) contain MPN domains; CSN5
  is the JAMM metalloprotease that carries the deneddylase activity. Drosophila has two CSN1
  paralogs: CSN1b in the ubiquitous complex and CSN1a in a testis-specific variant. The Drosophila
  CSN2 subunit is encoded by alien.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001828
  title: 'FlyBase gene group COP9-C: Cop9 signalosome complexes'
  statement: >-
    FlyBase release FB2026_03 groups 9 D. melanogaster genes as cop9 signalosome complexes
    (COP9-C); this module models that group.
- source_id: GO:0008180
  title: COP9 signalosome
  statement: >-
    GO term grounding the module as COP9 signalosome.
notes: >-
  FlyBase subgroups COP9 and COP9-T share seven subunits and differ only in CSN1b versus CSN1a;
  the shared subunits are modelled once. CSN1 is a PCI subunit but is modelled as its own
  part to hold the paralog variants. FlyBase groups realized by this module: COP9-C (FBgg0001828).
  Subgroups folded into it: COP9, COP9-T. Participants were generated from the FlyBase gene-group
  membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from
  module_specs/dmel_cop9_signalosome.yaml; none of the member genes has a gene review yet
  unless noted.
