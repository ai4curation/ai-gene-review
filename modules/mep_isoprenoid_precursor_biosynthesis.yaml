id: MODULE:mep_isoprenoid_precursor_biosynthesis
title: MEP isoprenoid precursor biosynthesis
description: >-
  The methylerythritol phosphate (MEP/DOXP) route converts pyruvate
  and glyceraldehyde 3-phosphate through seven reactions into isopentenyl
  diphosphate (IPP) and dimethylallyl diphosphate (DMAPP). DXS forms the shared
  branch-point metabolite DXP, Dxr commits DXP to the MEP route, IspD-IspG
  build HMBPP, and IspH produces the two universal five-carbon isoprenoid
  precursors. DXP use in thiamine or pyridoxal-phosphate biosynthesis and
  downstream prenyl-diphosphate elongation are outside this module.
status: DRAFT
evidence:
  - source_id: GO:0019288
    title: isopentenyl diphosphate biosynthetic process, methylerythritol phosphate pathway
    statement: >-
      GO:0019288 captures IPP production through the MEP route represented by
      the seven ordered reactions in this module.
  - source_id: GO:0050992
    title: dimethylallyl diphosphate biosynthetic process
    statement: >-
      The terminal IspH reaction also produces DMAPP, the second universal
      five-carbon isoprenoid precursor.
  - source_id: KEGG:M00096
    title: C5 isoprenoid biosynthesis, non-mevalonate pathway
    statement: >-
      KEGG independently defines the same seven ordered MEP reactions. The
      terminal IspH reaction directly produces both IPP and DMAPP, so this
      pathway does not require IDI as an eighth step.
  - source_id: PMID:41700894
    title: 'Harnessing evolution: leveraging bacterial isoprenoid pathway diversity toward improved bioengineering strategies.'
    statement: >-
      2026 review of bacterial isoprenoid pathway diversity used to audit the module. It confirms the
      seven-step MEP route with direct IPP/DMAPP output by IspH, and it identifies two unrelated Dxr
      forms. The second (Dxr-II/DRL) was missing from the earlier module version.
    supporting_text: >-
      IspH (also referred to as LytB) then converts HMBDP to IDP and DMADP at a ratio favoring IDP,
      although this ratio is variable based on the enzyme of study (34).
  - source_id: PMID:20660776
    title: A new family of enzymes catalyzing the first committed step of the methylerythritol 4-phosphate (MEP) pathway for isoprenoid biosynthesis in bacteria.
    statement: >-
      Primary identification of DRL, a DXR-like oxidoreductase class that catalyzes the Dxr reaction in
      Brucella abortus and other bacteria lacking canonical Dxr.
    supporting_text: >-
      These results reveal the existence of a novel class of
      oxidoreductases catalyzing the conversion of DXP into MEP in prokaryotic cells,
  - source_id: file:modules/mep_isoprenoid_precursor_biosynthesis-deep-research-openscientist.md
    title: OpenScientist MEP isoprenoid precursor biosynthesis module research
    statement: >-
      Module-level research supports the ordered seven-reaction boundary, Dxr
      as the first committed step, direct formation of IPP and DMAPP by IspH,
      and flavodoxin- versus ferredoxin-coupled IspG implementations. Manual
      assessment excludes regulation, metabolite signaling, detailed Fe-S
      mechanism, and downstream prenyl metabolism from the reusable core.
notes: >-
  This reusable module models the seven-reaction route found in bacteria and
  plastids. Representative proteins orient each family without restricting the
  module to those organisms. The IspG step explicitly represents flavodoxin-
  and ferredoxin-coupled implementations. Prenyl-diphosphate elongation,
  DXP-dependent vitamin branches, and IPP/DMAPP pool balancing by IDI are
  outside the boundary. After the 2026 review PMID:41700894, the Dxr step was
  split into canonical Dxr (Dxr-I) and the unrelated DXR-like DRL class (Dxr-II;
  PMID:20660776). The review's other variation points are left out of the core:
  type I vs type II IDI (IDI is outside the boundary), and suppressor mutations
  that bypass dxs/dxr loss, which are not defined pathway steps.
module:
  id: mep_isoprenoid_precursor_biosynthesis
  label: MEP isoprenoid precursor biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: isopentenyl diphosphate biosynthetic process, methylerythritol 4-phosphate pathway
      term:
        id: GO:0019288
        label: isopentenyl diphosphate biosynthetic process, methylerythritol phosphate pathway
      description: Production of IPP through the MEP/DOXP route.
    - preferred_term: dimethylallyl diphosphate biosynthetic process
      term:
        id: GO:0050992
        label: dimethylallyl diphosphate biosynthetic process
      description: Production of DMAPP as a second product of the terminal IspH step.
  parts:
    - order: 1
      role: DXP formation from pyruvate and glyceraldehyde 3-phosphate
      node:
        id: dxs_dxp_formation
        label: DXS-dependent DXP formation
        module_type: REACTION
        description: >-
          DXS performs a thiamine-diphosphate-dependent condensation that
          supplies DXP to the MEP route and to vitamin-biosynthesis branches.
        annotons:
          - id: dxs_activity
            label: DXP synthase activity
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: 1-deoxy-D-xylulose-5-phosphate synthase activity
                term:
                  id: GO:0008661
                  label: 1-deoxy-D-xylulose-5-phosphate synthase activity
              family:
                preferred_term: DXP synthase family
                term:
                  id: PANTHER:PTHR43322:SF5
                  label: 1-DEOXY-D-XYLULOSE-5-PHOSPHATE SYNTHASE, CHLOROPLASTIC
                description: >-
                  The official SF5 label is chloroplast-biased, but the local
                  member index places both reviewed bacterial exemplars in this
                  exact subfamily. The label is retained verbatim and does not
                  impose chloroplast localization on the reusable role.
                representative_members:
                  - preferred_term: Dxs (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88QG7
                      label: 1-deoxy-D-xylulose-5-phosphate synthase
                  - preferred_term: Dxs (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P77488
                      label: 1-deoxy-D-xylulose-5-phosphate synthase
                ancestral_nodes:
                  - preferred_term: PAINT DXS activity node PTN000179250
                    term:
                      id: PANTHER:PTN000179250
                      label: PTN000179250
                    description: >-
                      PAINT node in PTHR43322 with IBD support for GO:0008661
                      and GO:0019288 seeded by the E. coli Dxs exemplar.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          IBD propagation from PAINT node PTN000179250 in
                          PTHR43322.
            function:
              preferred_term: 1-deoxy-D-xylulose-5-phosphate synthase activity
              term:
                id: GO:0008661
                label: 1-deoxy-D-xylulose-5-phosphate synthase activity
              substrates:
                - preferred_term: pyruvate
                - preferred_term: D-glyceraldehyde 3-phosphate
              products:
                - preferred_term: 1-deoxy-D-xylulose 5-phosphate
                - preferred_term: carbon dioxide
              evidence:
                - source_id: RHEA:12605
                  title: DXP synthase reaction
                  statement: >-
                    Rhea 12605 defines condensation of pyruvate and
                    D-glyceraldehyde 3-phosphate to DXP and carbon dioxide.
            role_description: >-
              Produces DXP at the entry to the route without implying that DXS
              is committed exclusively to isoprenoid precursor biosynthesis.
    - order: 2
      role: Commitment of DXP to MEP
      node:
        id: dxr_mep_formation
        label: DXP reductoisomerase-dependent MEP formation
        module_type: REACTION
        description: >-
          Two unrelated enzyme classes catalyze the same NADPH-dependent DXP to MEP reaction. Canonical
          Dxr (Dxr-I) and the DXR-like DRL class (Dxr-II) share sequence similarity only in the
          NADPH-binding region, and DRL is scattered sporadically across bacteria (PMID:41700894,
          PMID:20660776).
        variant_sets:
          - id: dxr_enzyme_class
            label: DXP reductoisomerase enzyme class
            axis: enzyme family
            selection: ONE_OR_MORE
            variants:
              - id: dxr_type_i_variant
                label: Canonical Dxr (Dxr-I)
                module_type: REACTION
                annotons:
                  - id: dxr_activity
                    label: DXP reductoisomerase activity
                    participant:
                      selector_type: FAMILY
                      required_function:
                        preferred_term: 1-deoxy-D-xylulose-5-phosphate reductoisomerase activity
                        term:
                          id: GO:0030604
                          label: 1-deoxy-D-xylulose-5-phosphate reductoisomerase activity
                      family:
                        preferred_term: DXP reductoisomerase family
                        term:
                          id: PANTHER:PTHR30525:SF0
                          label: 1-DEOXY-D-XYLULOSE 5-PHOSPHATE REDUCTOISOMERASE, CHLOROPLASTIC
                        description: >-
                          The official SF0 label is chloroplast-biased, while the
                          verified membership includes reviewed bacterial Dxr proteins.
                          The exact label is retained without asserting localization.
                        representative_members:
                          - preferred_term: Dxr (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88MH4
                              label: 1-deoxy-D-xylulose 5-phosphate reductoisomerase
                          - preferred_term: Dxr (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P45568
                              label: 1-deoxy-D-xylulose 5-phosphate reductoisomerase
                        ancestral_nodes:
                          - preferred_term: PAINT Dxr activity node PTN000776155
                            term:
                              id: PANTHER:PTN000776155
                              label: PTN000776155
                            description: >-
                              PAINT node in PTHR30525 with IBD support for GO:0030604
                              seeded by the E. coli Dxr exemplar.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: >-
                                  IBD propagation from PAINT node PTN000776155 in
                                  PTHR30525.
                    function:
                      preferred_term: 1-deoxy-D-xylulose-5-phosphate reductoisomerase activity
                      term:
                        id: GO:0030604
                        label: 1-deoxy-D-xylulose-5-phosphate reductoisomerase activity
                      substrates:
                        - preferred_term: 1-deoxy-D-xylulose 5-phosphate
                        - preferred_term: NADPH
                      products:
                        - preferred_term: 2-C-methyl-D-erythritol 4-phosphate
                        - preferred_term: NADP+
                      evidence:
                        - source_id: RHEA:13719
                          title: physiological DXP reductoisomerase reaction
                          statement: >-
                            Rhea 13719 is the physiological direction from DXP and
                            NADPH to MEP and NADP+.
                    role_description: Commits DXP to the MEP isoprenoid precursor route.
              - id: drl_type_ii_variant
                label: DXR-like DRL (Dxr-II)
                module_type: REACTION
                annotons:
                  - id: drl_activity
                    label: DRL DXP reductoisomerase activity
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: DRL (DXR-like) oxidoreductase family
                        description: >-
                          No PANTHER id is asserted. The Brucella abortus DRL falls in PTHR37850
                          ("STRU PROTEIN"), but that family also holds proteins with other functions,
                          and no family-level DRL assignment has been established.
                        representative_members:
                          - preferred_term: DRL / BAB2_0264 (Brucella abortus 2308)
                            term:
                              id: UniProtKB:Q2YIM3
                              label: Oxidoreductase, putative
                            description: >-
                              Locus BAB2_0264, shown by PMID:20660776 to complement a DXR-deficient
                              E. coli strain. The UniProt entry is unreviewed and still carries a
                              generic name.
                    function:
                      preferred_term: 1-deoxy-D-xylulose-5-phosphate reductoisomerase activity
                      term:
                        id: GO:0030604
                        label: 1-deoxy-D-xylulose-5-phosphate reductoisomerase activity
                      substrates:
                        - preferred_term: 1-deoxy-D-xylulose 5-phosphate
                        - preferred_term: NADPH
                      products:
                        - preferred_term: 2-C-methyl-D-erythritol 4-phosphate
                        - preferred_term: NADP+
                      evidence:
                        - source_id: PMID:20660776
                          statement: >-
                            Brucella abortus lacks Dxr, but its DRL protein (BAB2_0264) catalyzes the same
                            DXP to MEP reaction and complements an E. coli dxr mutant.
                          supporting_text: >-
                            Subsequent
                            experiments confirmed that DRL and DXR catalyze the same biochemical reaction.
                        - source_id: PMID:41700894
                          statement: Review describing Dxr-I and Dxr-II as the two forms of the first committed MEP-pathway enzyme.
                          supporting_text: >-
                            The first committed step of the MEP path is carried out by the enzyme Dxr,
                            which exists in two forms: Dxr-I and Dxr-II, which only share sequence-level
                            homology at the NADPH-binding domain (10).
                    role_description: >-
                      Commits DXP to the MEP route in bacteria that lack canonical Dxr, such as Brucella.
    - order: 3
      role: CDP-ME formation
      node:
        id: ispd_cdp_me_formation
        label: IspD-dependent CDP-ME formation
        module_type: REACTION
        annotons:
          - id: ispd_activity
            label: MEP cytidylyltransferase activity
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: 2-C-methyl-D-erythritol 4-phosphate cytidylyltransferase activity
                term:
                  id: GO:0050518
                  label: 2-C-methyl-D-erythritol 4-phosphate cytidylyltransferase activity
              family:
                preferred_term: IspD MEP cytidylyltransferase family
                term:
                  id: PANTHER:PTHR32125:SF4
                  label: 2-C-METHYL-D-ERYTHRITOL 4-PHOSPHATE CYTIDYLYLTRANSFERASE, CHLOROPLASTIC
                description: >-
                  The official SF4 label is chloroplast-biased, but the exact
                  subfamily contains the reviewed bacterial IspD exemplars.
                  The label is retained verbatim without asserting localization.
                representative_members:
                  - preferred_term: IspD (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88MF7
                      label: 2-C-methyl-D-erythritol 4-phosphate cytidylyltransferase
                  - preferred_term: IspD (Escherichia coli K-12)
                    term:
                      id: UniProtKB:Q46893
                      label: 2-C-methyl-D-erythritol 4-phosphate cytidylyltransferase
                ancestral_nodes:
                  - preferred_term: PAINT IspD activity node PTN000781812
                    term:
                      id: PANTHER:PTN000781812
                      label: PTN000781812
                    description: >-
                      PAINT node in PTHR32125 with IBD support for
                      GO:0050518 seeded by the E. coli IspD exemplar.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          IBD propagation from PAINT node PTN000781812 in
                          PTHR32125.
            function:
              preferred_term: 2-C-methyl-D-erythritol 4-phosphate cytidylyltransferase activity
              term:
                id: GO:0050518
                label: 2-C-methyl-D-erythritol 4-phosphate cytidylyltransferase activity
              substrates:
                - preferred_term: 2-C-methyl-D-erythritol 4-phosphate
                - preferred_term: CTP
              products:
                - preferred_term: 4-diphosphocytidyl-2-C-methyl-D-erythritol
                - preferred_term: diphosphate
              evidence:
                - source_id: RHEA:13429
                  title: MEP cytidylyltransferase reaction
                  statement: >-
                    Rhea 13429 defines CTP-dependent conversion of MEP to
                    CDP-ME and diphosphate.
            role_description: Converts MEP to the cytidylated intermediate CDP-ME.
    - order: 4
      role: CDP-ME 2-phosphate formation
      node:
        id: ispe_cdp_me2p_formation
        label: IspE-dependent CDP-ME 2-phosphate formation
        module_type: REACTION
        annotons:
          - id: ispe_activity
            label: CDP-ME kinase activity
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: 4-(cytidine 5'-diphospho)-2-C-methyl-D-erythritol kinase activity
                term:
                  id: GO:0050515
                  label: 4-(cytidine 5'-diphospho)-2-C-methyl-D-erythritol kinase activity
              family:
                preferred_term: IspE CDP-ME kinase family
                term:
                  id: PANTHER:PTHR43527:SF2
                  label: 4-DIPHOSPHOCYTIDYL-2-C-METHYL-D-ERYTHRITOL KINASE, CHLOROPLASTIC
                description: >-
                  The official SF2 label is chloroplast-biased, but the exact
                  subfamily contains the reviewed bacterial IspE exemplars.
                  The label is retained verbatim without asserting localization.
                representative_members:
                  - preferred_term: IspE (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PX5
                      label: 4-diphosphocytidyl-2-C-methyl-D-erythritol kinase
                  - preferred_term: IspE (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P62615
                      label: 4-diphosphocytidyl-2-C-methyl-D-erythritol kinase
                ancestral_nodes:
                  - preferred_term: PAINT IspE activity node PTN000466527
                    term:
                      id: PANTHER:PTN000466527
                      label: PTN000466527
                    description: >-
                      PAINT node in PTHR43527 with IBD support for GO:0050515
                      seeded by the E. coli IspE exemplar.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          IBD propagation from PAINT node PTN000466527 in
                          PTHR43527.
            function:
              preferred_term: 4-(cytidine 5'-diphospho)-2-C-methyl-D-erythritol kinase activity
              term:
                id: GO:0050515
                label: 4-(cytidine 5'-diphospho)-2-C-methyl-D-erythritol kinase activity
              substrates:
                - preferred_term: 4-diphosphocytidyl-2-C-methyl-D-erythritol
                - preferred_term: ATP
              products:
                - preferred_term: 4-diphosphocytidyl-2-C-methyl-D-erythritol 2-phosphate
                - preferred_term: ADP
              evidence:
                - source_id: RHEA:18437
                  title: CDP-ME kinase reaction
                  statement: >-
                    Rhea 18437 defines ATP-dependent phosphorylation of CDP-ME
                    to CDP-ME 2-phosphate.
            role_description: Phosphorylates CDP-ME to form CDP-ME 2-phosphate.
    - order: 5
      role: ME-CPP formation
      node:
        id: ispf_me_cpp_formation
        label: IspF-dependent ME-CPP formation
        module_type: REACTION
        annotons:
          - id: ispf_activity
            label: ME-CPP synthase activity
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: 2-C-methyl-D-erythritol 2,4-cyclodiphosphate synthase activity
                term:
                  id: GO:0008685
                  label: 2-C-methyl-D-erythritol 2,4-cyclodiphosphate synthase activity
              family:
                preferred_term: IspF ME-CPP synthase family
                term:
                  id: PANTHER:PTHR43181:SF1
                  label: 2-C-METHYL-D-ERYTHRITOL 2,4-CYCLODIPHOSPHATE SYNTHASE, CHLOROPLASTIC
                description: >-
                  The official SF1 label is chloroplast-biased, while the local
                  member index places both reviewed bacterial IspF exemplars in
                  this exact subfamily. The label is retained verbatim without
                  asserting localization.
                representative_members:
                  - preferred_term: IspF (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88MF3
                      label: 2-C-methyl-D-erythritol 2,4-cyclodiphosphate synthase
                  - preferred_term: IspF (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P62617
                      label: 2-C-methyl-D-erythritol 2,4-cyclodiphosphate synthase
                ancestral_nodes:
                  - preferred_term: PAINT IspF activity node PTN000781796
                    term:
                      id: PANTHER:PTN000781796
                      label: PTN000781796
                    description: >-
                      PAINT node in PTHR43181 with IBD support for GO:0008685
                      seeded by the E. coli IspF exemplar.
                    evidence:
                      - source_id: GO_REF:0000033
