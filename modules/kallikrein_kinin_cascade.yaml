id: MODULE:kallikrein_kinin_cascade
title: Kallikrein-kinin cascade — contact activation, kinin release from kininogen, B1/B2 receptor signaling, kininase inactivation and serpin control
description: >-
  The kallikrein-kinin system is an extracellular protease cascade that releases the
  vasoactive kinin peptides bradykinin and kallidin (Lys-bradykinin) from a single
  precursor, kininogen, and terminates them by peptidase cleavage. Two routes feed the
  cascade. In the plasma (contact) route, coagulation factor XII (F12, Hageman factor)
  binds negatively charged surfaces or misfolded protein aggregates and is autoactivated
  or activated by traces of protease; surface-bound F12a then activates plasma
  prekallikrein (KLKB1), which circulates in complex with high-molecular-weight
  kininogen, and the formed kallikrein activates further F12 in a reciprocal
  positive-feedback loop. Prolylcarboxypeptidase (PRCP) on the endothelial membrane
  provides a factor XII-independent prekallikrein activator. Active plasma kallikrein
  cleaves high-molecular-weight kininogen and liberates the nonapeptide bradykinin. In
  the tissue route, tissue kallikrein (KLK1), secreted by kidney, pancreas and salivary
  gland, cleaves low-molecular-weight kininogen at two sites and releases the decapeptide
  kallidin. The kinins act as short-lived local hormones on two G protein-coupled
  receptors: the constitutively expressed B2 receptor (BDKRB2), whose agonists are
  bradykinin and kallidin, and the inducible B1 receptor (BDKRB1), whose agonists are
  the des-Arg metabolites generated at the kinin C terminus by the carboxypeptidases
  CPN1 (plasma, kininase I) and CPM (membrane-bound). Receptor occupancy raises
  intracellular calcium and drives vasodilation, increased vascular permeability,
  release of inflammatory mediators and stimulation of sensory neurons. Several
  peptidases act as kininases and destroy kinin activity: angiotensin-converting enzyme
  (ACE, kininase II), neprilysin (MME) and the soluble and membrane-bound aminopeptidases
  P (XPNPEP1, XPNPEP2). The proteases of the cascade are restrained by serpins and by
  alpha-2-macroglobulin: C1 inhibitor (SERPING1) and A2M are the principal plasma
  inhibitors of kallikrein and F12a, and kallistatin (SERPINA4) inhibits tissue
  kallikrein.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0000526
    title: kallikrein-kinin cascade pathway
    statement: >-
      The module boundary and its members follow the RGD interactive diagram for this
      Pathway Ontology term. The diagram draws Kng1 giving rise to highKng1 and lowKng1,
      highKng1 associated with prekallikrein (pKlkb1) and positively affecting BK, Klk1
      acting on lowKng1 to give KD, F12a in the contact step, Cpm and Cpn1 converting
      BK and KD to des-Arg-kinins, Bdkrb2 associated with BK and KD and Bdkrb1 with the
      des-Arg kinins, the kinins positively affecting vasodilation, inflammatory
      mediator release and sensory neuron stimulation, and the inhibitory edges
      Serping1 -| F12a, Serping1 -| Klkb1, A2m -| Klkb1 and Serpina4 -| Klk1. The
      diagram also links out to the coagulation cascade (PW:0000474), classical
      complement (PW:0000503) and kinin signaling (PW:0001480) pathways, which are
      outside this module. Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0000526.yaml).
  - source_id: GO:0002254
    title: kinin cascade
    statement: >-
      The module as a whole is the kinin cascade: the extracellular reaction series
      whose ultimate products are kallidin and bradykinin. Its two initiating routes
      are the specific children GO:0002353 plasma kallikrein-kinin cascade and
      GO:0002255 tissue kallikrein-kinin cascade, which are used on the respective
      parts rather than on the module node.
  - source_id: GO:0002353
    title: plasma kallikrein-kinin cascade
    statement: >-
      The contact-activation route. Human F12 carries this term by IDA
      (PMID:18725990, PMID:6793628), and mouse Prcp by IMP, so the term covers both
      the factor XII-dependent and the prolylcarboxypeptidase-dependent entry into
      prekallikrein activation.
  - source_id: GO:0002255
    title: tissue kallikrein-kinin cascade
    statement: >-
      The tissue (glandular) route, in which kallikrein-1 acts on low-molecular-weight
      kininogen. The term is annotated experimentally to a mouse tissue kallikrein
      (UniProtKB:P00755, Klk1b1, IMP); human KLK1 itself has no direct GO annotation
      to it, which is recorded in the notes rather than asserted here.
  - source_id: gomodel:6246724f00000632
    title: Bradykinin degradation by ACE and bradykin-binding to its receptor (Human)
    statement: >-
      An independent, curator-built human GO-CAM (cached under
      gocams/6246724f00000632/) models three of this module's gene products with
      matching molecular functions: ACE peptidyl-dipeptidase activity (GO:0008241) in
      bradykinin catabolic process (GO:0010815), KNG1 hormone activity (GO:0005179) in
      vasodilation (GO:0042311) and BDKRB2 bradykinin receptor activity (GO:0004947) in
      vasodilation. The ACE activity is drawn causally upstream of the KNG1 hormone
      activity. Those three annotons carry gocam_associations here; no production
      GO-CAM was found for the contact-activation, tissue-kallikrein, carboxypeptidase
      or inhibitor steps.
  - source_id: PMID:18725990
    title: Misfolded proteins activate factor XII in humans, leading to kallikrein formation without initiating coagulation.
    statement: >-
      Establishes the entry point of the cascade and separates it from coagulation:
      surface-adsorbed or denatured protein aggregates activate factor XII and form
      kallikrein without triggering clotting.
    supporting_text: Factor XII was activated by misfolded protein aggregates that formed by denaturation or by surface adsorption, which specifically led to the activation of the kallikrein-kinin system without inducing coagulation.
  - source_id: PMID:273926
    title: Role of surface in surface-dependent activation of Hageman factor (blood coagulation factor XII).
    statement: >-
      Defines what an activating surface does and identifies kallikrein as the
      physiologically potent activator of surface-bound factor XII, the reciprocal
      step of this module.
    supporting_text: The results showed that surface-bound Hageman factor was 500 times more susceptible than soluble Hageman factor to proteolytic activation by kallikrein in the presence of high molecular weight kininogen.
  - source_id: PMID:386794
    title: Molecular assembly in the contact phase of the Hageman factor system.
    statement: >-
      States the assembly logic used for parts 1 and 2: high-molecular-weight kininogen
      is the surface cofactor that brings prekallikrein next to factor XII, and
      activation of the two zymogens is reciprocal.
    supporting_text: High MW kininogen serves as a surface cofactor to assemble prekallikrein or factor XI in proximity to surface-bound Hageman factor. Reciprocal proteolytic activation of Hageman factor and prekallikrein represents an essential step in the rapid activation of the contact phase.
  - source_id: PMID:11830581
    title: Identification and characterization of prolylcarboxypeptidase as an endothelial cell prekallikrein activator.
    statement: >-
      Identifies the factor XII-independent prekallikrein activator on the endothelial
      membrane as prolylcarboxypeptidase.
    supporting_text: PRCP appears to be a HUVEC-associated PK activator.
  - source_id: PMID:104988
    title: "Studies on human kininogens. I. Isolation, characterization, and cleavage by plasma kallikrein of high molecular weight (HMW)-kininogen."
    statement: >-
      The plasma-route product step: human plasma kallikrein liberates bradykinin from
      human high-molecular-weight kininogen, leaving the kinin-free heavy and light
      chains.
    supporting_text: We investigated whether the liberation of kinin from human HMW-kininogen by human plasma kallikrein was accompanied by liberation of histidine-rich fragments
  - source_id: PMID:7749384
    title: Cleavage of human kininogen fragments at Met-Lys by human tissue kallikrein.
    statement: >-
      The tissue-route product step, including the two cleavage sites and the
      TK-specific Met-Lys bond.
    supporting_text: Tissue kallikrein (TK) cleaves low molecular weight kininogen (LK) at two sites to release kallidin
  - source_id: PMID:1282629
    title: "Bradykinin-degrading enzymes: structure, function, distribution, and potential roles in cardiovascular pharmacology."
    statement: >-
      Frames the inactivation part: several distinct peptidases qualify as kininases,
      and which one matters depends on where it is and what else is present. This is
      why the module models them as parallel annotons of one step.
    supporting_text: These include aminopeptidase P, meprin, endopeptidase 24.15, prolyl endopeptidase, neutral endopeptidase 24.11, angiotensin I-converting enzyme, carboxypeptidase N, carboxypeptidase M, and deamidase.
  - source_id: PMID:7692967
    title: "High molecular weight kininogen potentiates the heparin-accelerated inhibition of plasma kallikrein by antithrombin: role for antithrombin in the regulation of kallikrein."
    statement: >-
      Names C1 inhibitor and alpha-2-macroglobulin as the primary plasma inhibitors of
      kallikrein and gives their rate constants, grounding the inhibitor part.
    supporting_text: nor did the protein enhance the rate constants of 1.7 x 10(4) and 3.4 x 10(4) M-1 s-1 for kallikrein reactions with its primary plasma inhibitors C1-inhibitor and alpha 2-macroglobulin, respectively
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0000526 through the
  RGD_PATHWAY_ONTOLOGY project (seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml). The diagram supplied the
  boundary, the members and the topology; every molecular function was then chosen
  against the participant's experimental GOA rows in QuickGO rather than from the
  diagram: F12 and KLKB1 serine-type endopeptidase activity GO:0004252
  (F12 IDA/EXP PMID:18725990, PMID:6793628, PMID:11204562; KLKB1 TAS PMID:1993180),
  KLK1 GO:0004252 (TAS PMID:2686621, NAS PMID:7749372, IBA), PRCP serine-type
  carboxypeptidase activity GO:0004185 (TAS PMID:28321), KNG1 hormone activity
  GO:0005179 (IDA PMID:1314587, PMID:1329734), BDKRB2 and BDKRB1 bradykinin receptor
  activity GO:0004947 (IDA PMID:1314587, PMID:1329734, PMID:17077303 and IDA
  PMID:10422787, PMID:1314587 respectively), CPN1 and CPM metallocarboxypeptidase
  activity GO:0004181 (TAS PMID:2912725, PMID:2753907, IBA), ACE peptidyl-dipeptidase
  activity GO:0008241 (EXP), MME metalloendopeptidase activity GO:0004222 (EXP
  PMID:8168535, IDA), XPNPEP1 metalloaminopeptidase activity GO:0070006 (IDA
  PMID:18515364), XPNPEP2 aminopeptidase activity GO:0004177 (EXP PMID:15361070),
  SERPING1 and SERPINA4 serine-type endopeptidase inhibitor activity GO:0004867 (IDA
  PMID:11527969; TAS PMID:1334488) and A2M endopeptidase inhibitor activity GO:0004866
  (IDA PMID:7679575, matching the core function of its gene review in
  genes/human/A2M/). GO:0005515 protein binding is deliberately never used.
  KNG1 is the substrate the kallikreins cleave, so it is given no proteolysis or
  protein-processing process term here: the cleaving is done by KLKB1 and KLK1, and
  GO's convention is that a process under proteolysis belongs to the enzyme (the same
  reasoning recorded for AGT and GO:0002003 in CLAUDE.md; a comparator check finds no
  kininogen in GO:0002353 or GO:0002255 in human, mouse or rat). What KNG1 does
  perform is the agonist step: the released bradykinin acts as a local hormone, which
  is exactly the activity GOA records by IDA and the human GO-CAM
  gomodel:6246724f00000632 models, and that is how it appears in the receptor part.
  Hand-offs deliberately left out: F12a activation of factor XI and the rest of the
  intrinsic coagulation cascade belong to modules/coagulation_cascade.yaml (the RGD
  diagram's PW:0000474 link; PMID:386794 notes that alpha-HFa, but not beta-HFa,
  activates factor XI, so the branch point is in the contact step modeled here);
  plasmin generation and fibrinolysis, which contact activation also feeds
  (PMID:89876), belong to modules/fibrinolysis.yaml; the classical complement pathway
  that F12a can stimulate (PW:0000503) is out of scope. ACE's other role, converting
  angiotensin I, is out of scope and is modeled in the human GO-CAM
  gocams/6246724f00000549 (renin-angiotensin pathway); only its kininase II function
  is used here. Receptor desensitization by GRK4, ARRB1 and ARRB2, which the adjacent
  RGD kinin-signaling diagram PW:0001480 draws, is deliberately omitted: the
  experimental GOA rows that place those three in desensitization of G
  protein-coupled receptor signaling (GO:0002029) and the GO-CAMs that model them
  (for example gomodel:67f85f2b00004426) concern other receptors, and no annotation
  or cached model was found tying them to BDKRB1 or BDKRB2, so asserting it would go
  beyond the evidence. Of the module's sixteen gene products only A2M currently has a
  gene review (genes/human/A2M/); the rest are curation follow-up recorded in the
  project plan, not knowledge gaps. PANTHER family ids are omitted throughout: every
  participant is a concrete human gene product, and no family id was checked against
  the PANTHER member index.
module:
  id: kallikrein_kinin_cascade
  label: Kallikrein-kinin cascade
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: kinin cascade
      term:
        id: GO:0002254
        label: kinin cascade
      description: >-
        Extracellular protease cascade whose products are the kinins bradykinin and
        kallidin, acting through the B1 and B2 bradykinin receptors.
  context:
    cellular_components:
      - preferred_term: extracellular region
        term:
          id: GO:0005576
          label: extracellular region
      - preferred_term: plasma membrane
        term:
          id: GO:0005886
          label: plasma membrane
        description: >-
          The receptors, the membrane-anchored kininases (ACE, MME, XPNPEP2, CPM) and
          the endothelial prekallikrein activator PRCP act at the cell surface, facing
          the same extracellular compartment as the soluble steps.
  parts:
    - order: 1
      role: contact activation of factor XII
      node:
        id: kks_contact_activation
        label: Surface-dependent activation of factor XII
        module_type: REACTION
        description: >-
          Factor XII binds negatively charged surfaces or misfolded protein aggregates.
          Surface binding both allows slow autoactivation and makes the zymogen far
          more susceptible to cleavage by proteases, above all by kallikrein, which is
          the reciprocal feedback arm of this cascade.
        annotons:
          - id: f12_surface_activation
            label: Factor XII autoactivation on surfaces
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: F12
                term:
                  id: UniProtKB:P00748
                  label: Coagulation factor XII
            function:
              preferred_term: serine-type endopeptidase activity
              term:
                id: GO:0004252
                label: serine-type endopeptidase activity
              substrates:
                - preferred_term: factor XII zymogen (autoactivation)
                  term:
                    id: UniProtKB:P00748
                    label: Coagulation factor XII
            processes:
              - preferred_term: protein autoprocessing
                term:
                  id: GO:0016540
                  label: protein autoprocessing
              - preferred_term: plasma kallikrein-kinin cascade
                term:
                  id: GO:0002353
                  label: plasma kallikrein-kinin cascade
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Initiating zymogen of the plasma route. Contact with an anionic surface or
              a misfolded protein aggregate converts a small amount of F12 to F12a,
              which is then amplified by kallikrein feedback.
            evidence:
              - source_id: PMID:18725990
                statement: >-
                  Misfolded protein aggregates, formed by denaturation or surface
                  adsorption, activate factor XII and selectively drive the
                  kallikrein-kinin system.
                supporting_text: Factor XII was activated by misfolded protein aggregates that formed by denaturation or by surface adsorption, which specifically led to the activation of the kallikrein-kinin system without inducing coagulation.
              - source_id: PMID:18725990
                statement: >-
                  The cascade is initiated by autoactivation of factor XII and feeds
                  both coagulation and the kinin arm.
                supporting_text: This cascade is initiated by autoactivation of Factor XII and leads to both coagulation (via Factor XI) and an inflammatory response (via the kallikrein-kinin system).
              - source_id: PMID:273926
                statement: >-
                  Surface binding alters factor XII so that other proteases, not the
                  surface itself, carry out the activating cleavage.
                supporting_text: These results suggest that substances classically known as "activating surfaces" promote the activation of Hageman factor indirectly by altering its structure such that it is much more susceptible to proteolytic activation by other plasma or cellular proteases.
          - id: klkb1_f12_feedback
            label: Plasma kallikrein activation of factor XII (reciprocal feedback)
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: KLKB1
                term:
                  id: UniProtKB:P03952
                  label: Plasma kallikrein
            function:
              preferred_term: serine-type endopeptidase activity
              term:
                id: GO:0004252
                label: serine-type endopeptidase activity
              substrates:
                - preferred_term: surface-bound factor XII
                  term:
                    id: UniProtKB:P00748
                    label: Coagulation factor XII
            processes:
              - preferred_term: Factor XII activation
                term:
                  id: GO:0002542
                  label: Factor XII activation
              - preferred_term: zymogen activation
                term:
                  id: GO:0031638
                  label: zymogen activation
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              Amplification arm: formed kallikrein cleaves surface-bound factor XII far
              faster than the surface alone can autoactivate it, so a trace of either
              enzyme rapidly activates the whole contact phase.
            evidence:
              - source_id: PMID:273926
                statement: >-
                  Kallikrein is the most potent activator of surface-bound factor XII,
                  effective at a thousandth of the plasma prekallikrein concentration.
                supporting_text: Kallikrein even at concentrations as low as 0.5 nM (i.e., 1/1000th of the concentration of prekallikrein in plasma) was very potent in the limited proteolysis of the surface-bound Hageman factor.
              - source_id: PMID:386794
                statement: Activation of the two zymogens is reciprocal.
                supporting_text: Reciprocal proteolytic activation of Hageman factor and prekallikrein represents an essential step in the rapid activation of the contact phase.
    - order: 2
      role: prekallikrein activation
      node:
        id: kks_prekallikrein_activation
        label: Activation of plasma prekallikrein to kallikrein
        module_type: REACTION
        description: >-
          Prekallikrein circulates bound to high-molecular-weight kininogen, which
          assembles it next to surface-bound factor XII. F12a cleaves it to kallikrein;
          on endothelial cells, membrane-expressed prolylcarboxypeptidase does the same
          independently of factor XII.
        annotons:
          - id: f12a_pk_activation
            label: Factor XIIa activation of prekallikrein
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: F12
                term:
                  id: UniProtKB:P00748
                  label: Coagulation factor XII
            function:
              preferred_term: serine-type endopeptidase activity
              term:
                id: GO:0004252
                label: serine-type endopeptidase activity
              substrates:
                - preferred_term: plasma prekallikrein
                  term:
                    id: UniProtKB:P03952
                    label: Plasma kallikrein
            processes:
              - preferred_term: zymogen activation
                term:
                  id: GO:0031638
                  label: zymogen activation
              - preferred_term: plasma kallikrein-kinin cascade
                term:
                  id: GO:0002353
                  label: plasma kallikrein-kinin cascade
            locations:
              - preferred_term: extracellular region
                term:
                  id: GO:0005576
                  label: extracellular region
            role_description: >-
              First committed step of the plasma route. The surface-bound alpha form of
              F12a activates prekallikrein and factor XI; the soluble beta form
              activates prekallikrein only, which disseminates kinin formation while
              keeping intrinsic clotting local.
            evidence:
              - source_id: PMID:386794
                statement: >-
                  High-molecular-weight kininogen assembles prekallikrein next to
                  surface-bound factor XII, and the two F12a forms differ in which
                  substrates they reach.
                supporting_text: High MW kininogen serves as a surface cofactor to assemble prekallikrein or factor XI in proximity to surface-bound Hageman factor.
              - source_id: PMID:386794
                statement: >-
                  Soluble beta-F12a leaves the surface and activates further
                  prekallikrein but not factor XI, separating the kinin output from
                  intrinsic clotting.
                supporting_text: The other form of activated Hageman factor, beta HFa, leaves the surface, going into solution where it readily activates additional prekallikrein but not factor XI.
              - source_id: PMID:18725990
                statement: >-
                  In patients with systemic amyloidosis, factor XII but not factor XI
                  is activated and kallikrein is formed, showing the two outputs can be
                  uncoupled in vivo.
                supporting_text: we found that Factor XII, but not Factor XI, was activated and kallikrein was formed in blood from patients with systemic amyloidosis
          - id: prcp_pk_activation
            label: Prolylcarboxypeptidase activation of prekallikrein on endothelium
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PRCP
                term:
                  id: UniProtKB:P42785
                  label: Lysosomal Pro-X carboxypeptidase
            function:
              preferred_term: serine-type carboxypeptidase activity
              term:
                id: GO:0004185
                label: serine-type carboxypeptidase activity
            processes:
              - preferred_term: plasma kallikrein-kinin cascade
                term:
                  id: GO:0002353
                  label: plasma kallikrein-kinin cascade
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Factor XII-independent entry to the cascade: membrane-expressed PRCP
              activates prekallikrein that has assembled on high-molecular-weight
              kininogen at the endothelial surface, with a Km in the nanomolar range.
            evidence:
              - source_id: PMID:11830581
                statement: >-
                  PRCP was purified from endothelial cells as the prekallikrein
                  activator acting on kininogen-bound prekallikrein.
                supporting_text: When prekallikrein (PK) assembles on high molecular weight kininogen on HUVEC, PK is activated to kallikrein.
              - source_id: PMID:11830581
                statement: >-
                  The activity is not factor XII: it does not correct factor
                  XII-deficient plasma, is not recognised by anti-factor XII and does
                  not activate factor XI.
                supporting_text: PKA did not correct the coagulant defect in factor XII deficient plasma, was purified from HUVEC cultured in factor XII-deficient serum, was not detected by antibody to factor XII, did not activate FXI, and was not inhibited by a neutralizing antibody to FXII.
              - source_id: PMID:11830581
                statement: PRCP activates prekallikrein with nanomolar affinity.
                supporting_text: The K(m) of PK activation by PRCP is 6.7 nm.
    - order: 3
      role: kinin release from kininogen
      node:
        id: kks_kinin_release
        label: Release of kinins from kininogen by a kallikrein
        module_type: REACTION
        description: >-
          Both active kinins come from kininogen (KNG1), whose alternative transcripts
          give the high- and low-molecular-weight forms. Which kinin is produced depends
          on which kallikrein does the cleaving, so the two routes are modeled as
          alternatives along the enzyme axis. Both can operate in the same organism, in
          different compartments.
        variant_sets:
          - id: kinin_release_route
            label: Plasma versus tissue kallikrein route
            axis: enzyme and substrate route
            selection: ONE_OR_MORE
            notes: >-
              ONE_OR_MORE rather than EXACTLY_ONE: the plasma route operates in the
              intravascular compartment on high-molecular-weight kininogen and the
              tissue route in glandular tissue and their fluids on the
              low-molecular-weight form, and tissue kallikrein can also cleave the high
              form. A concrete realization may therefore have one or both.
            variants:
              - id: plasma_kallikrein_route
                label: Plasma kallikrein releasing bradykinin from high-molecular-weight kininogen
                module_type: REACTION
                description: >-
                  Active plasma kallikrein cleaves high-molecular-weight kininogen in
                  the intravascular compartment, liberating the nonapeptide bradykinin
                  and leaving the disulfide-linked kinin-free heavy and light chains.
                annotons:
                  - id: klkb1_hk_cleavage
                    label: Plasma kallikrein cleavage of high-molecular-weight kininogen
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: KLKB1
                        term:
                          id: UniProtKB:P03952
                          label: Plasma kallikrein
                    function:
                      preferred_term: serine-type endopeptidase activity
                      term:
                        id: GO:0004252
                        label: serine-type endopeptidase activity
                      substrates:
                        - preferred_term: high-molecular-weight kininogen
                          term:
                            id: UniProtKB:P01042
                            label: Kininogen-1
                      products:
                        - preferred_term: bradykinin (kinin-9)
                          term:
                            id: CHEBI:3165
                            label: bradykinin
                    processes:
                      - preferred_term: plasma kallikrein-kinin cascade
                        term:
                          id: GO:0002353
                          label: plasma kallikrein-kinin cascade
                    locations:
                      - preferred_term: extracellular region
                        term:
                          id: GO:0005576
                          label: extracellular region
                    role_description: >-
                      Product-forming step of the plasma route; the enzyme performs the
                      cleavage, kininogen is its substrate.
                    evidence:
                      - source_id: PMID:104988
                        statement: >-
                          Human plasma kallikrein liberates kinin from human
                          high-molecular-weight kininogen.
                        supporting_text: We investigated whether the liberation of kinin from human HMW-kininogen by human plasma kallikrein was accompanied by liberation of histidine-rich fragments
                      - source_id: PMID:104988
                        statement: >-
                          Bradykinin is isolated from the digest, with the histidine-rich
                          sequence staying on the light chain of the kinin-free protein.
                        supporting_text: Most of the histidine in human HMW-kininogen was recovered in the kinin-free protein, and the light chain of kinin-free protein was found to be rich in histidine compared with the heavy chain.
              - id: tissue_kallikrein_route
                label: Tissue kallikrein releasing kallidin from low-molecular-weight kininogen
                module_type: REACTION
                description: >-
                  Tissue kallikrein, secreted by kidney, pancreas and salivary gland,
                  cleaves low-molecular-weight kininogen at two sites, one of them the
                  unusual Met-Lys bond, releasing the decapeptide kallidin
                  (Lys-bradykinin).
