              kallidin; couples to the calcium-phosphatidylinositol cascade.
            evidence:
              - source_id: PMID:1329734
                statement: >-
                  The cloned human B2 receptor is a high-affinity bradykinin receptor
                  coupling to calcium and inositol phosphate signaling.
                supporting_text: Functional coupling to the Ca(2+)-phosphatidylinositol cascade was demonstrated in transfected CHO cells where inositol phosphates accumulation and intracellular calcium concentration were elevated in response to BK stimulation.
              - source_id: PMID:1314587
                statement: >-
                  The receptor is a seven-transmembrane G protein-coupled receptor of
                  the B2 subtype.
                supporting_text: The cDNA clone encodes a 364 amino acid protein that has the characteristics of a seven transmembrane domain G-protein coupled receptor.
              - source_id: PMID:17077303
                statement: >-
                  ACE and the B2 receptor form a complex at the plasma membrane, placing
                  the receptor and its kininase side by side at the cell surface.
                supporting_text: Human ACE and bradykinin B2 receptors form a complex at the plasma membrane.
            gocam_associations:
