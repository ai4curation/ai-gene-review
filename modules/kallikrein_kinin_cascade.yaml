          The released kinins act as short-lived local hormones. Bradykinin and kallidin
          are agonists of the constitutively expressed B2 receptor; the des-Arg
          metabolites made in part 5 are the agonists of the inducible B1 receptor. Both
          are G protein-coupled receptors that raise intracellular calcium and drive
          vasodilation and inflammatory mediator release.
