                        statement: >-
                          Tissue kallikrein cleaves low-molecular-weight kininogen at
                          two sites to release kallidin, one of them the TK-specific
                          Met-Lys bond.
                        supporting_text: Tissue kallikrein (TK) cleaves low molecular weight kininogen (LK) at two sites to release kallidin
                      - source_id: PMID:7749384
                        statement: >-
                          Site I is a trypsin-like Arg-Ser bond and site II the unusual
                          Met-Lys bond unique to tissue kallikrein.
                        supporting_text: site I (between Arg389 and Ser390) is a typical cleavage point for a trypsin-like enzyme whereas site II (between Met379 and Lys380) is unusual and unique to TK
                      - source_id: PMID:2686621
