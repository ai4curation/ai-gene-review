              kallikreins, not a participant in their proteolysis, so it carries no
              processing term here.
            evidence:
              - source_id: PMID:1314587
                statement: >-
                  Bradykinin binds the cloned human B2 receptor with sub-nanomolar
                  affinity, the agonist activity annotated to KNG1 by IDA.
                supporting_text: Saturation binding analysis indicates that the human BK-2 receptor expressed in COS-7 cells binds BK with a KD of 0.13 nM.
            gocam_associations:
              - model: gomodel:6246724f00000632
                activity: gomodel:6246724f00000632/6246724f00000645
