knowledge_gaps:
  - gap_statement: >-
      Which kininase actually terminates a kinin signal at a given site in vivo is not
      established. ACE, neprilysin, carboxypeptidases N and M and both aminopeptidases
      P can all cleave bradykinin in vitro, and the outcome depends on local
      concentration, membrane localization and competition between them, which no
      current measurement resolves in intact tissue.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      It determines which peptidase inhibitors raise kinin levels where, and so which
      drugs carry bradykinin-mediated angioedema risk.
    provenance:
      - reference_id: PMID:1282629
        supporting_text: Determination of the importance of a peptidase in the inactivation of bradykinin during a particular physiological response can be difficult
  - gap_statement: >-
      What physiologically initiates factor XII activation is unresolved. Anionic
      surfaces activate it in vitro but factor XII is dispensable for haemostasis, and
      although misfolded protein aggregates activate it selectively towards the kinin
      arm, the endogenous activating structures and the conditions under which they
      form in healthy tissue are unknown.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      The trigger determines whether the plasma route is normally quiescent and only
      engaged in disease, or continuously generating kinins at low level.
    provenance:
      - reference_id: PMID:18725990
        supporting_text: the physiological role of the contact system remains elusive
  - gap_statement: >-
      The relative contribution of prolylcarboxypeptidase and factor XIIa to
      prekallikrein activation in vivo is unknown. PRCP activates kininogen-bound
      prekallikrein on endothelial cells independently of factor XII, but whether this
      is the dominant route in an intact vessel, and how it is regulated, has not been
      measured.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      A constitutive endothelial route would make kinin generation a continuous local
      vascular function rather than an injury response.
    provenance:
      - reference_id: PMID:12489798
        supporting_text: Understanding the importance and physiologic activity of the plasma kallikrein/kinin system (KKS) has been thwarted by the absence of an inclusive theory for its assembly and activation.
