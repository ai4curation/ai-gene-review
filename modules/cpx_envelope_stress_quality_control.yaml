id: MODULE:cpx_envelope_stress_quality_control
title: Cpx envelope-stress periplasmic quality control
description: >-
  A periplasmic envelope-stress quality-control module covering two
  Cpx-regulated effector branches. CpxP inhibits the CpxA sensor kinase in the
  unstressed state and can act as a DegP adaptor for a subset of misfolded
  periplasmic substrates, while Spy binds non-native periplasmic clients in
  situ to prevent aggregation and assist refolding. Transcriptional control by
  CpxR/BaeR and DegP proteolysis itself are outside this CpxP/Spy-focused
  module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0030547
    title: signaling receptor inhibitor activity
    statement: Defines CpxP inhibition of the CpxA sensor kinase.
  - source_id: GO:0140767
    title: enzyme-substrate adaptor activity
    statement: Defines CpxP adaptor activity for DegP-mediated proteolysis.
  - source_id: GO:0044183
    title: protein folding chaperone
    statement: Defines Spy's periplasmic refolding-chaperone function.
  - source_id: file:genes/ECOLI/CpxP/CpxP-ai-review.yaml
    title: ECOLI CpxP gene review
    statement: >-
      The completed E. coli CpxP review grounds CpxP as a CpxA inhibitor and
      DegP adaptor.
  - source_id: file:genes/ECOLI/Spy/Spy-ai-review.yaml
    title: ECOLI Spy gene review
    statement: >-
      The completed E. coli Spy review grounds Spy as a periplasmic in-situ
      holdase and refolding chaperone.
  - source_id: PMID:16303867
    title: The extracytoplasmic adaptor protein CpxP is degraded with substrate by DegP.
    statement: Establishes CpxP adaptor function in DegP-mediated proteolysis.
  - source_id: PMID:17259177
    title: >-
      Purification, reconstitution, and characterization of the CpxRAP envelope
      stress system of Escherichia coli.
    statement: Establishes CpxP inhibition of CpxA autophosphorylation.
  - source_id: PMID:25207645
    title: >-
      Dynamic interaction between the CpxA sensor kinase and the periplasmic
      accessory protein CpxP mediates signal recognition in E. coli.
    statement: Demonstrates dynamic CpxP-CpxA interaction during envelope-stress sensing.
  - source_id: PMID:21317898
    title: Genetic selection designed to stabilize proteins uncovers a chaperone called Spy.
    statement: Establishes Spy as an ATP-independent aggregation-suppressing chaperone.
  - source_id: PMID:26619265
    title: Substrate protein folds while it is bound to the ATP-independent chaperone Spy.
    statement: Shows that a Spy-associated client can fold while bound to Spy.
notes: >-
  CpxP's weak in vitro chaperone activity is deliberately not represented as a
  core holdase activity. The reviewed biology supports CpxA inhibition and
  substrate delivery to DegP as CpxP's primary activities. CpxP and Spy are
  grouped here as periplasmic quality-control effectors in the Cpx regulon, not
  as direct binding partners or sequential handoff components.
