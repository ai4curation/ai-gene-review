id: MODULE:bacterial_mnma_trna_thiolation
title: Bacterial MnmA tRNA wobble-uridine thiolation
description: Bacterial MnmA pathways mobilize sulfur from cysteine and use ATP to install sulfur at the
  2-position of tRNA wobble uridine. Sulfur delivery can use the multi-protein Tus relay or compatible
  direct desulfurase–MnmA partnerships. The active enzyme state, donor pairing and substrate tRNA determine
  which implementation can operate.
status: COMPLETE
evidence:
- &id009
  source_id: PMID:24765101
  title: Biosynthesis and functions of sulfur modifications in tRNA.
  statement: The comparative review distinguishes tRNA sulfur positions and variation in sulfur-delivery
    machinery, supporting a U34-specific boundary rather than an all-tRNA-thiolation module.
  supporting_text: TusBCD and TusE are not found in many organisms
- &id003
  source_id: PMID:39660893
  title: '2-Thiouridine formation in Escherichia coli: a critical review.'
  statement: The critical review contrasts conflicting E. coli cofactor experiments. Keep the established
    relay and reaction separate from the unresolved terminal sulfur-activation mechanism.
  supporting_text: These apparent differences in experimental findings need to be investigated and clarified
    in future studies.
- &id005
  source_id: PMID:41970532
  title: 'Intricacies in iron-sulfur cluster function and biogenesis: functional versatility, sulfur sources,
    and enzyme specificity.'
  statement: The 2026 review distinguishes dedicated Bacillus sulfur donor–acceptor partnerships from
    multifunctional IscS; a desulfurase family match alone cannot establish a compatible MnmA donor.
  supporting_text: Specific protein–protein interactions between these enzymes and their dedicated sulfur
    acceptors restrict their reactivities and, consequently, biological functions.
- &id001
  source_id: PMID:16387657
  title: Mechanistic insights into sulfur relay by multiple sulfur mediators involved in thiouridine biosynthesis
    at tRNA wobble positions.
  statement: Recombinant E. coli IscS, TusA, TusBCD, TusE and MnmA reconstitute efficient U34 thiolation.
    The result establishes the multi-protein relay without proving each proposed covalent intermediate.
  supporting_text: Efficient 2-thiouridine formation in vitro was reconstituted with recombinant TusA,
    a TusBCD complex, TusE, and previously identified IscS and MnmA.
- &id002
  source_id: PMID:16472754
  title: Structural basis for sulfur relay to RNA mediated by heterohexameric TusBCD complex.
  statement: TusBCD is a heterohexamer; the tested TusD cysteine, rather than the candidate TusC cysteine,
    participates in sulfur transfer. TusB/C supply the organized assembly.
  supporting_text: only Cys78, in the TusD subunit, participates in sulfur transfer during the s2U modification
    process.
- &id004
  source_id: PMID:25825430
  title: Abbreviated Pathway for Biosynthesis of 2-Thiouridine in Bacillus subtilis.
  statement: Bacillus YrvO and MnmA form an ATP-dependent sulfur-transfer partnership and restore thiolation-related
    phenotypes in heterologous assays. Purified and native conditional-expression evidence are distinguished.
  supporting_text: established a partnership between the B. subtilis proteins that is contingent upon
    the presence of ATP.
- &id006
  source_id: PMID:31801798
  title: An ancient type of MnmA protein is an iron-sulfur cluster-dependent sulfurtransferase for tRNA
    anticodons.
  statement: Both Thermus donor enzymes support cysteine-fed U34 thiolation with holo-MnmA after removal
    of reductants; this establishes purified capacity, not native donor choice.
  supporting_text: In the absence of reductant, s2U was readily formed by the cysteine desulfurases using
    cysteine as the sulfur donor.
- &id007
  source_id: PMID:31801798
  title: An ancient type of MnmA protein is an iron-sulfur cluster-dependent sulfurtransferase for tRNA
    anticodons.
  statement: Thermus C-type MnmA has an oxygen-sensitive cluster required in the characterized assay;
    this requirement is not generalized to D-type MnmA.
  supporting_text: contains an oxygen-sensitive [4Fe–4S]-type cluster, which is required for s2U34 formation.
notes: Bacteria denotes the occurrence envelope, not universal conservation. E. coli and KT2440 orient
  the Tus route; the latter is a conserved-function inference. Bacillus PS832/168 and Thermus HB27 supply
  contrasting direct-delivery examples. These exemplars do not establish exclusivity across their lineages.
  Sulfur-delivery capacity is separate from native flux; simplified E. coli two-enzyme assays do not establish
  physiological Tus dispensability. U8/U54 thiolation, cytosolic Ncs6/NcsA systems and the other IscS
  branches are outside the boundary. C5 elaboration is separate and not an obligatory downstream step.
  Generated provider reports and family names do not independently establish activity. Family/subfamily
  membership does not establish identical partners, substrates or cofactors; exact source-supported role,
  pairing and active-state requirements remain independent. This is a modeling boundary, not a separately
  unresolved biological question. The Thermus alternatives encode assay-demonstrated donor capacity; they
  do not assign native donor flux.
