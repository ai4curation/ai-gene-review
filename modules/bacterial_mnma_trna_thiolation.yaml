id: MODULE:bacterial_mnma_trna_thiolation
title: Tus-dependent bacterial MnmA tRNA wobble-uridine thiolation
description: >-
  A bacterial sulfur-relay pathway that installs the 2-thio group of
  5-methylaminomethyl-2-thiouridine (mnm5s2U) at wobble position 34 of
  tRNA(Lys), tRNA(Glu) and tRNA(Gln). The PLP-dependent cysteine desulfurase IscS
  mobilizes sulfur from L-cysteine as an enzyme-bound persulfide and transfers it
  to the sulfur carrier TusA, whose binding stimulates IscS and commits the sulfur
  to tRNA thiolation. TusA passes the sulfur to Cys78 of TusD within the
  heterohexameric TusBCD complex, a dimer of TusB-TusC-TusD heterotrimers in which
  TusB and TusC are structural subunits. TusE binds TusBCD, stimulates the
  TusA-to-TusD step, accepts the sulfur on its C-terminal cysteine and delivers it
  to the ATP-dependent thiouridylase MnmA bound to substrate tRNA. MnmA adenylates
  uridine 34 and incorporates the relay sulfur to form 2-thiouridine. Sulfur
  mobilization, the two carrier hand-offs, complex-mediated transfer and the
  final tRNA thiolation are modeled as separate roles.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0002143
    title: tRNA wobble position uridine thiolation
    statement: >-
      GO:0002143 identifies the biological process performed by the Tus sulfur
      relay and MnmA.
  - source_id: PMID:16387657
    title: Mechanistic insights into sulfur relay by multiple sulfur mediators involved in thiouridine biosynthesis at tRNA wobble positions.
    statement: >-
      A genome-wide E. coli screen identified tusABCDE, and the IscS-TusA-TusBCD-
      TusE-MnmA relay was reconstituted in vitro with the order of sulfur flow
      established.
    supporting_text: >-
      Efficient 2-thiouridine formation in vitro was reconstituted with
      recombinant TusA, a TusBCD complex, TusE, and previously identified IscS
      and MnmA.
  - source_id: PMID:16472754
    title: Structural basis for sulfur relay to RNA mediated by heterohexameric TusBCD complex.
    statement: >-
      The E. coli TusBCD structure and mutagenesis established the heterohexamer
      and TusD Cys78 as the only TusBCD cysteine used for sulfur transfer.
    supporting_text: >-
      In vivo mutant analyses revealed that only Cys78, in the TusD subunit,
      participates in sulfur transfer during the s2U modification process.
  - source_id: PMID:12549933
    title: MnmA and IscS are required for in vitro 2-thiouridine biosynthesis in Escherichia coli.
    statement: E. coli MnmA with IscS, cysteine and Mg-ATP forms s2U on unmodified tRNA in vitro.
    supporting_text: >-
      The activity requires MnmA, Mg-ATP, l-cysteine, and the cysteine
      desulfurase IscS.
  - source_id: PMID:16871210
    title: Snapshots of tRNA sulphuration via an adenylated intermediate.
    statement: MnmA-tRNA structures trap the adenylated U34 intermediate.
    supporting_text: The adenylated RNA intermediate is trapped.
  - source_id: file:modules/bacterial_mnma_trna_thiolation-analysis/tree-check.txt
    title: PANTHER reference-tree leaves under the Tus relay and MnmA PAINT nodes
    statement: >-
      Derived from the committed tree_check.py; lists the leaves under every
      PAINT node of the TusA, TusB, TusC, TusD, TusE and MnmA families, used to
      judge the taxonomic reach of the Tus subunit families.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__bacterial-mnma-trna-wobble-uridine-thiolation-sulfur-relay__ppu04122-deep-research-openscientist.md
    title: OpenScientist review of the P. putida KT2440 MnmA sulfur relay
    statement: >-
      Sequence and locus analysis assigning one KT2440 protein to every relay
      step, with the PP_3993-PP_3996 tusD-tusC-tusB-tusE locus.
    supporting_text: The **PP_3993→PP_3996 consecutive locus tags form a `tusD-tusC-tusB-tusE` operon**
notes: >-
  Scope. The module is the Tus-dependent route to s2U34 and is kept within
  Gammaproteobacteria rather than generalized to all bacteria. MnmA itself is
  near-universal in bacteria (PTHR11933:SF5 coincides with the PAINT
  2-thiouridylase root), but the TusB, TusC, TusD and TusE subunit families are
  lineage-restricted: their PAINT node leaves in the tree check are
  gammaproteobacterial Tus orthologs plus Dsr-system homologs of sulfur-oxidizing
  and sulfate-reducing organisms, Thermotoga and Dictyoglomus, and the
  Bacillus subtilis entries of PTHR33279 sit in SF6, not the TusA subfamily.
  Bacteria without the Tus genes and mitochondria (TRMU/MTU1, Slm3) thiolate U34
  with MnmA-family enzymes fed by other sulfur donors; those routes are outside
  this module. Exemplars. Escherichia coli K-12, where the relay was discovered,
  reconstituted and solved structurally, is the experimental exemplar for every
  role; Pseudomonas putida KT2440 is a second exemplar whose assignments are
  ortholog-, signature- and locus-based (no KT2440 relay experiment exists).
  Families. Each role is grounded to the PANTHER subfamily that holds both
  exemplars, and each family has a curated review. Several of these subfamilies
  are broader than the relay: PTHR33279:SF2 also contains TusA-like paralogs (for
  example KT2440 PP_1233) that lack the TusA-specific IPR022931/HAMAP MF_00413
  signature, and the TusB, TusC and TusE families also contain Dsr-type or
  uncharacterized homologs. For that reason the family reviews leave
  GO:0002143 UNRESOLVED at family scope for PTHR33279, PTHR38780, PTHR37526 and
  PTHR37010, while the carrier and catalytic activities used by the annotons
  are covered. Boundaries. IscS also feeds iron-sulfur cluster assembly,
  molybdopterin, thiamine and 4-thiouridine synthesis
  (modules/bacterial_isc_iron_sulfur_cluster_assembly.yaml models the Isc
  branch with the same IscS grounding); the MnmEG/MnmC elaboration of the
  modified uridine at C5 is downstream and also excluded. TusA's secondary
  contributions to molybdopterin synthesis are recorded in its gene review, not
  here.
