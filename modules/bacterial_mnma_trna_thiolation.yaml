id: MODULE:bacterial_mnma_trna_thiolation
title: Tus-dependent bacterial MnmA tRNA wobble-uridine thiolation
description: >-
  A Tus-dependent bacterial sulfur-relay module that mobilizes sulfur from
  cysteine and passes it through TusA, the TusBCD complex, and TusE to MnmA,
  which installs 2-thiouridine at the wobble uridine of substrate tRNAs. Sulfur
  mobilization, carrier handoffs, complex-mediated transfer, and tRNA
  thiolation are modeled as separate substantive roles.
status: DRAFT
evidence:
  - source_id: GO:0002143
    title: tRNA wobble position uridine thiolation
    statement: >-
      GO:0002143 identifies the biological process performed by the bacterial
      Tus sulfur relay and MnmA.
  - source_id: file:PSEPK/iscS/iscS-uniprot.txt
    title: PSEPK IscS UniProt record
    statement: >-
      Q88PK8 is the KT2440 cysteine desulfurase that mobilizes sulfur for tRNA
      modification and other sulfur-dependent pathways.
  - source_id: file:PSEPK/tusA/tusA-uniprot.txt
    title: PSEPK TusA UniProt record
    statement: Q88L21 is a TusA-family sulfur carrier assigned to U34 thiolation.
  - source_id: file:PSEPK/tusD/tusD-uniprot.txt
    title: PSEPK TusD UniProt record
    statement: Q88FT9 is the TusD sulfur-carrying subunit of the TusBCD complex.
  - source_id: file:PSEPK/PP_3994/PP_3994-uniprot.txt
    title: PSEPK TusC-like UniProt record
    statement: Q88FT8 is a TusC-family subunit encoded in the KT2440 tusBCDE locus.
  - source_id: file:PSEPK/PP_3995/PP_3995-uniprot.txt
    title: PSEPK TusB UniProt record
    statement: Q88FT7 is a TusB-family subunit encoded in the KT2440 tusBCDE locus.
  - source_id: file:PSEPK/tusE/tusE-uniprot.txt
    title: PSEPK TusE UniProt record
    statement: Q88FT6 is a TusE-family sulfur carrier in the relay.
  - source_id: file:PSEPK/mnmA/mnmA-uniprot.txt
    title: PSEPK MnmA UniProt record
    statement: >-
      Q88FR9 catalyzes ATP-dependent 2-thiolation of wobble uridine in tRNA.
  - source_id: PMID:16387657
    title: Mechanistic insights into sulfur relay by multiple sulfur mediators involved in thiouridine biosynthesis at tRNA wobble positions.
    statement: >-
      Biochemical reconstitution established the ordered IscS-TusA-TusBCD-TusE-
      MnmA relay in E. coli.
  - source_id: PMID:16472754
    title: Structural basis for sulfur relay to RNA mediated by heterohexameric TusBCD complex.
    statement: >-
      Structure and mutagenesis established heterohexameric TusBCD and the
      sulfur-transfer role of TusD Cys78.
notes: >-
  This module represents the Tus-dependent implementation of the MnmA pathway;
  it is not asserted to be universal across bacteria. IscS also supplies sulfur
  to iron-sulfur cluster and cofactor pathways; those branches are outside this
  boundary. MnmC-dependent elaboration of the modified uridine is downstream and
  is likewise excluded. The exact KT2440 gene names for Q88FT8, Q88FT7, and
  Q88FT6 remain locus-tag based in the review files, while their family roles are
  represented as TusC, TusB, and TusE here.
