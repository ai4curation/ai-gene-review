id: MODULE:latent_tgfb_activation
title: Latent TGF-beta activation module
description: >-
  Release of active TGF-beta from the latent complex in which it is stored. TGF-beta
  is unusual among cytokines: the cell secretes it already folded around its own
  prodomain, which holds it inert, and the controlled step is not transcription or
  secretion but mechanical release from that complex, often long afterwards and
  somewhere else. Furin cuts the proprotein into the latency-associated peptide and
  the mature growth factor, which stay non-covalently associated; a latent
  TGF-beta-binding protein (LTBP1, LTBP3 or LTBP4) ties the small latent complex
  into the extracellular matrix, or GARP (LRRC32) tethers it to the surface of a
  regulatory T cell or platelet. An alpha-V integrin then grips the RGD motif in the
  prodomain and pulls: force, not proteolysis, unfastens the prodomain's
  "straitjacket" and frees the growth factor to reach its receptor. The receptor
  signalling that follows is a separate module.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: PMID:30361387
  statement: TGF-beta1 is one of very few cytokines made in a latent form that must be
    activated to do anything.
  supporting_text: Transforming growth factor-β1 (TGF-β1) is one of very few cytokines produced in
    a latent form, requiring activation to exert any of its vastly diverse effects on development,
    immunity, and cancer.
- source_id: PMID:21677751
  statement: Activation needs an alpha-V integrin bound to the prodomain RGD and force
    exerted against a matrix anchor.
  supporting_text: Activation of TGF-β1 requires the binding of α(v) integrin to an RGD sequence in
    the prodomain and exertion of force on this domain, which is held in the extracellular matrix by
    latent TGF-β binding proteins.
- source_id: PMID:2022183
  statement: The latency-associated peptide alone is what keeps TGF-beta1 latent.
  supporting_text: The TGF-beta 1-latency associated peptide is sufficient for the latency of TGF-beta
    1, whereas the functions of LTBP remain to be elucidated.
proposed_new_terms:
- proposed_name: latent transforming growth factor beta activation
  proposed_definition: >-
    The process in which active transforming growth factor beta is released from the
    latent complex formed by its own latency-associated prodomain and an anchoring
    protein, making it able to bind its receptor. Includes integrin- and
    force-dependent release, and release by proteolysis of the prodomain or of the
    anchoring protein.
  justification: >-
    GO has no process term for this step. Searching the ontology for TGF-beta
    processes of this kind returns only GO:0032905, GO:0032906 and GO:0032907,
    the "transforming growth factor beta1/2/3 production" terms, plus their
    regulation children: that is, GO can say the amount of TGF-beta went up, but
    not that latent TGF-beta was activated, which is the step the literature
    treats as the control point and the step integrin-knockout phenotypes report
    on. GO does already model the structure involved, as GO:0038045 large latent
    transforming growth factor-beta complex, so only the process is missing.
  proposed_parent:
    id: GO:0051604
    label: protein maturation
  supported_by:
  - reference_id: PMID:21677751
    reference_section_type: ABSTRACT
    supporting_text: Activation of TGF-β1 requires the binding of α(v) integrin to an RGD sequence in
      the prodomain and exertion of force on this domain
  - reference_id: PMID:22278742
    reference_section_type: ABSTRACT
    supporting_text: Integrin α(V)β(6) and to a lesser extent α(V)β(8) are able to activate TGFβ from
      the GARP-proTGFβ1 complex.
notes: >-
  Built for projects/PRODUCTION_TERMS.md. The curated classification there marks
  the four TGF-beta production terms (4 production, 12 regulation) as resting on
  dedicated machinery, and this module is that machinery. The terms are also among
  the six cytokine production terms GO never flagged do-not-annotate, so unlike
  most of the branch they are still open for direct annotation, which makes the
  missing activation term more consequential.
  Boundary: starts at the secreted proprotein and ends with free, receptor-competent
  TGF-beta. Receptor binding and SMAD signalling are modules/tgfb_smad_signaling.yaml.
  Transcription of the TGF-beta genes is upstream and is not modelled here; that is
  the part the "production" terms name.
  Not modelled as variants of the activation step: thrombospondin-1, plasmin, MMP2
  and MMP9, and low pH are all reported to activate latent TGF-beta, but they are a
  heterogeneous set whose physiological weight is contested, and treating them as
  alternative realizers would assert a parity with integrin-mediated activation that
  the evidence does not support. THBS1 is noted in the knowledge gap instead.
  No cached GO-CAM has an activity on any of these proteins in this role, so there
  are no pins.
module:
  id: latent_tgfb_activation
  label: Latent TGF-beta activation
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Proprotein cleavage, then anchoring of the latent complex, then force-dependent
    release. The first two steps build a store; the third is the one that is
    regulated.
  concepts:
  - preferred_term: protein maturation
    term:
      id: GO:0051604
      label: protein maturation
  context:
    taxa:
    - preferred_term: vertebrates
      term:
        id: NCBITaxon:7742
        label: Vertebrata <vertebrates>
  knowledge_gaps:
  - gap_statement: >-
      Which activation route matters in which tissue is unsettled. Integrin-mediated
      force is established for TGF-beta1, but thrombospondin-1, plasmin and the
      matrix metalloproteinases are also reported to activate latent TGF-beta, and
      their relative contribution in a normal tissue is not resolved.
    boundary: >-
      Affects whether the release step should become a variant set over routes
      rather than the single integrin-dependent step modelled here.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      The route determines what a TGF-beta inhibitor should target, and whether
      integrin blockade can separate pathological from homeostatic TGF-beta.
    resolution: >-
      Compare active TGF-beta in tissues from animals lacking the integrin RGD
      binding site, thrombospondin-1 or the candidate proteases, in the same assay.
    provenance:
    - reference_id: PMID:25548275
      reference_section_type: TITLE
      supporting_text: Induction and activation of latent transforming growth factor-β1 are carried
        out by two distinct
  - gap_statement: >-
      Whether TGF-beta2 and TGF-beta3 are activated the same way as TGF-beta1 is
      not established. The prodomain fold is shared across the family, but the
      integrin-dependence was shown for TGF-beta1, and TGF-beta2 lacks the RGD
      motif that alpha-V integrins recognise.
    boundary: Affects the isoform scope of the release step; the module is drawn from
      TGF-beta1 evidence.
    gap_kind:
    - BIOLOGY
    status: OPEN
    significance: >-
      If TGF-beta2 cannot be integrin-activated, its latency must be broken some
      other way, and a module covering all three isoforms would be wrong.
    resolution: Test integrin-dependent activation of each isoform side by side in the
      same reporter system.
    provenance:
    - reference_id: PMID:21677751
      reference_section_type: ABSTRACT
      supporting_text: Sequences of all 33 TGF-β family members indicate a similar prodomain fold.
  parts:
  - order: 1
    role: proprotein cleavage
    node:
      id: proprotein_cleavage
      label: Furin cleavage of the TGF-beta proprotein
      module_type: REACTION
      description: >-
        Furin cuts the proprotein in the trans-Golgi network into the
        latency-associated peptide and the mature growth factor. The two pieces stay
        together: cleavage makes the latent complex rather than releasing anything.
      annotons:
      - id: furin_protgfb_cleavage
        label: Furin proprotein convertase
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: FURIN
            term:
              id: UniProtKB:P09958
              label: Furin
        function:
          preferred_term: serine-type endopeptidase activity
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
          substrates:
          - &tgfb1_substrate
            preferred_term: TGFB1
            term:
              id: UniProtKB:P01137
              label: Transforming growth factor beta-1 proprotein
        locations:
        - preferred_term: Golgi membrane
          term:
            id: GO:0000139
            label: Golgi membrane
        role_description: >-
          Separates the prodomain from the growth factor without separating them
          physically; furin is shared with many other precursors and is not
          dedicated to TGF-beta.
        evidence:
        - source_id: Reactome:R-HSA-170844
          statement: Furin cleaves the proprotein into LAP and the mature peptide, which do not
            physically separate.
          supporting_text: However, the N- and C-terminal polypeptides do not physically separate.
            Rather they stay in one complex.
  - order: 2
    role: anchoring of the latent complex
    node:
      id: latent_complex_anchoring
      label: Anchoring of the small latent complex
      module_type: REGULATORY_STEP
      description: >-
        The small latent complex is tied down, either into the extracellular matrix
        by an LTBP or to the cell surface by GARP. The anchor is what later allows an
        integrin to pull against it, so this step is not mere storage: without an
        anchor there is nothing for force to act on.
      concepts:
      - preferred_term: large latent transforming growth factor-beta complex
        term:
          id: GO:0038045
          label: large latent transforming growth factor-beta complex
      variant_sets:
      - id: latent_anchor
        label: Anchoring protein
        axis: anchoring protein and compartment
        variant_kind: REALIZER
        selection: ONE_OR_MORE
        notes: >-
          LTBPs anchor into the matrix and GARP to the plasma membrane; which is used
          depends on the cell. They compete for the same site on the prodomain, so a
          cell expressing GARP can divert latent TGF-beta from the matrix to its own
          surface.
        evidence:
        - source_id: PMID:22278742
          statement: GARP outcompetes LTBP for binding the prodomain.
          supporting_text: Noncovalent association is sufficiently strong for GARP to outcompete latent
            TGFβ-binding protein for binding to proTGFβ1.
        variants:
        - id: ltbp_matrix_anchor
          label: LTBP matrix anchor
          module_type: REGULATORY_STEP
          annotons:
          - id: ltbp_anchor
            label: LTBP latent-complex anchor
            participant:
              selector_type: FAMILY
              family:
                preferred_term: latent TGF-beta-binding protein
                description: >-
                  The LTBP family members that bind the TGF-beta prodomain and are
                  themselves incorporated into the extracellular matrix. LTBP2 is
                  excluded: it belongs to the family but is not reported to bind
                  latent TGF-beta.
                representative_members:
                - preferred_term: LTBP1
                  term:
                    id: UniProtKB:Q14766
                    label: Latent-transforming growth factor beta-binding protein 1
                - preferred_term: LTBP3
                  term:
                    id: UniProtKB:Q9NS15
                    label: Latent-transforming growth factor beta-binding protein 3
                - preferred_term: LTBP4
                  term:
                    id: UniProtKB:Q8N2S1
                    label: Latent-transforming growth factor beta-binding protein 4
            function: &tgfb_binding_function
              preferred_term: transforming growth factor beta binding
              term:
                id: GO:0050431
                label: transforming growth factor beta binding
              targets:
              - *tgfb1_substrate
            locations:
            - preferred_term: extracellular matrix
              term:
                id: GO:0031012
                label: extracellular matrix
            role_description: >-
              Disulfide-links to the prodomain and ties the complex into the matrix,
              giving the integrin something to pull against.
            evidence:
            - source_id: Reactome:R-HSA-2395328
              statement: TGF-beta is secreted as a complex of the growth factor, its cleaved
                propeptide and an LTBP.
              supporting_text: >-
                TGF-beta is secreted from cells in latent form as part of a complex that includes
                two other proteins: the cleaved propeptide of TGF beta, known as latency associated
                peptide (LAP), and a member of the latent TGF beta binding protein (LTBP) family.
            - source_id: PMID:26918958
              statement: LTBP4 is one of the latent-binding proteins that form the large latent complex.
              supporting_text: Latent TGFβ binding proteins are extracellular matrix proteins that bind
                latent TGFβ to form the large latent complex.
        - id: garp_surface_anchor
          label: GARP cell-surface anchor
          module_type: REGULATORY_STEP
          annotons:
          - id: garp_anchor
            label: GARP latent-complex anchor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LRRC32
                term:
                  id: UniProtKB:Q14392
                  label: Leucine-rich repeat-containing protein 32
            function: *tgfb_binding_function
            locations:
            - preferred_term: cell surface
              term:
                id: GO:0009986
                label: cell surface
            role_description: >-
              Presents latent TGF-beta on the surface of a regulatory T cell or
              platelet, and in doing so prevents its release as a soluble cytokine:
              the same molecule both stores and withholds it.
            evidence:
            - source_id: PMID:19651619
              statement: GARP tethers latent TGF-beta to the surface of activated regulatory T cells
                and platelets.
              supporting_text: We show that GARP or LRRC32, a leucine-rich repeat molecule of unknown
                function, is critical for tethering TGF-beta to the cell surface.
            - source_id: PMID:22278742
              statement: GARP association prevents TGF-beta1 secretion.
              supporting_text: Association between GARP and proTGFβ1 prevents the secretion of TGFβ1.
  - order: 3
    role: force-dependent release
    node:
      id: integrin_force_release
      label: Integrin- and force-dependent release of active TGF-beta
      module_type: REGULATORY_STEP
      description: >-
        An alpha-V integrin binds the RGD motif in the prodomain and transmits
        cytoskeletal force to it. Binding alone does nothing: the prodomain only
        lets go when force unfastens it, which is why this step needs a cell pulling
        on an anchored complex rather than an enzyme.
      annotons:
      - id: alphav_integrin_activator
        label: Alpha-V integrin latent-complex activator
        participant:
          selector_type: PROTEIN_COMPLEX
          protein_complex:
            preferred_term: alpha-V integrin heterodimer
            description: >-
              An ITGAV heterodimer with ITGB6 or ITGB8; both activate latent
              TGF-beta, beta-6 more effectively than beta-8 from the GARP complex.
            active_units:
            - id: itgav_unit
              label: ITGAV
              role: The shared alpha chain; the RGD-binding site is formed between the
                two chains.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: ITGAV
                  term:
                    id: UniProtKB:P06756
                    label: Integrin alpha-V
            - id: itgb6_unit
              label: ITGB6
              role: The beta chain of the most effective activating heterodimer, on
                epithelium.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: ITGB6
                  term:
                    id: UniProtKB:P18564
                    label: Integrin beta-6
            - id: itgb8_unit
              label: ITGB8
              role: The beta chain of the heterodimer that activates GARP-presented
                TGF-beta on regulatory T cells.
              participant:
                selector_type: GENE_PRODUCT
                gene_product:
                  preferred_term: ITGB8
                  term:
                    id: UniProtKB:P26012
                    label: Integrin beta-8
        function:
          preferred_term: transforming growth factor beta binding
          term:
            id: GO:0050431
            label: transforming growth factor beta binding
          description: >-
            Binds the RGD motif of the latency-associated prodomain. The activity
            asserted here is the binding; the release that follows is mechanical and
            is the module's output rather than a separate catalytic step.
          targets:
          - *tgfb1_substrate
        locations:
        - &plasma_membrane
          preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        processes:
        - preferred_term: integrin-mediated signaling pathway
          term:
            id: GO:0007229
            label: integrin-mediated signaling pathway
        role_description: >-
          The step that decides whether stored TGF-beta ever acts. Integrin-beta-6
          and integrin-beta-8 knockouts phenocopy loss of TGF-beta1 in the tissues
          where they do this job.
        evidence:
        - source_id: PMID:21677751
          statement: Integrin binding alone is insufficient; force-dependent release requires
            unfastening the prodomain straitjacket.
          supporting_text: Complex formation between α(v)β(6) integrin and the prodomain is insufficient
            for TGF-β1 release. Force-dependent activation requires unfastening of a 'straitjacket'
            that encircles each growth-factor monomer
        - source_id: PMID:22278742
          statement: AlphaVbeta6 and alphaVbeta8 activate TGF-beta from the GARP complex, and
            activation requires the RGD motif and the disulfide link to GARP.
          supporting_text: Activation requires the RGD motif of latent TGFβ, disulfide linkage between
            GARP and latent TGFβ, and mem
        - source_id: Reactome:R-HSA-2395320
          statement: Of the integrins that bind the LAP RGD motif, only alphaVbeta6 and alphaVbeta8
            activate TGF-beta.
          supporting_text: Binding to integrins alphaVBeta6 and alphaVBeta8 leads to TGF beta activation.
      - id: active_tgfb_output
        label: Released active TGF-beta
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: TGFB1
            term:
              id: UniProtKB:P01137
              label: Transforming growth factor beta-1 proprotein
        function:
          preferred_term: cytokine activity
          term:
            id: GO:0005125
            label: cytokine activity
          description: >-
            The mature growth factor, once free of the prodomain, is receptor-competent.
            This annoton is the module's output and the point at which
            modules/tgfb_smad_signaling.yaml takes over.
        locations:
        - preferred_term: extracellular region
          term:
            id: GO:0005576
            label: extracellular region
        role_description: >-
          Named explicitly so the module ends in a product rather than in an
          activity, which is the decomposition projects/PRODUCTION_TERMS.md asks of
          the production terms.
        evidence:
        - source_id: PMID:30361387
          statement: Regulatory T cells activate GARP-presented latent TGF-beta1 through integrin
            alphaVbeta8 to suppress nearby cells.
          supporting_text: Tregs) suppress immune cells within close proximity by activating latent TGF-β1
            presented by GARP (glycoprotein A repetitions predominant) to integrin αVβ8 on their surface.
  connections:
  - source: proprotein_cleavage
    target: latent_complex_anchoring
    connection_type: PRECEDES
    description: Cleavage produces the small latent complex that the anchor then binds.
    chaining_status: NOT_APPLICABLE
    chaining_note: A protein-maturation chain, not a metabolic one, so the CoA continuity
      check does not apply.
  - source: latent_complex_anchoring
    target: integrin_force_release
    connection_type: PRECEDES
    description: Only an anchored complex can be opened by force; an unanchored one would
      move rather than unfold.
    chaining_status: NOT_APPLICABLE
    chaining_note: Mechanical step, not a metabolic one.
