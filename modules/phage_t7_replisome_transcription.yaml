id: MODULE:phage_t7_replisome_transcription
title: Autographiviridae host defense evasion, RNA polymerase shutoff, single-subunit transcription, and minimal T7 replisome
description: 'An integrated host-takeover, transcription, and genome-replication module characteristic of T7-like lytic podoviruses
  (Autographiviridae). Immediately upon entry of the leading left end of the linear genome, host Escherichia coli RNA polymerase
  transcribes the Class I early operon from promoters A1, A2, and A3, producing: (1) the B-form DNA mimic Ocr (gp0.3), which
  blocks Type I restriction-modification and BREX complexes; (2) the serine/threonine protein kinase gp0.7, which phosphorylates
  the beta-prime subunit of host RNA polymerase, RNase E, and translation factors to attenuate host gene expression; (3) the
  single-subunit phage RNA polymerase (gp1); and (4) the ATP-dependent DNA ligase (gp1.3). T7 RNA polymerase then drives high-velocity
  transcription of Class II replication and host-shutoff genes and Class III structural genes from phage-specific 23-bp promoters.
  Class II gene 2 protein (gp2) binds the beta-prime jaw domain of host sigma-70-RNA polymerase holoenzyme to completely shut
  off residual host transcription, while endonuclease I (gp3) and the 5''-3'' exonuclease/RNase H (gp6) degrade the host chromosome
  to supply deoxynucleoside monophosphates for phage DNA synthesis. Genome replication is executed by a minimal four-protein
  replisome comprising the gp5 DNA polymerase complexed 1:1 with host Escherichia coli thioredoxin as its processivity factor,
  the hexameric ring bifunctional primase-helicase (gp4), and the C-terminally acidic single-stranded DNA-binding protein
  (gp2.5), followed by concatemer maturation and Holliday junction resolution assisted by gp6, gp1.3, and gp3.'
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:30679383
  title: Structures and operating principles of the replisome.
  statement: Establishes the structural organization and coordinated leading/lagging-strand operating mechanism of the minimal
    bacteriophage T7 replisome (gp5-thioredoxin, gp4 primase-helicase, and gp2.5 ssDNA-binding protein).
- source_id: PMID:32009150
  title: Dynamic structural insights into the molecular mechanism of DNA unwinding by the bacteriophage T7 helicase.
  statement: Cryo-EM and mechanistic characterization of hand-over-hand spiral translocation and DNA unwinding by the hexameric
    T7 gp4 helicase-primase.
- source_id: PMID:10369763
  title: Inhibition of Escherichia coli RNA polymerase by bacteriophage T7 gene 2 protein.
  statement: Demonstrates that T7 gp2 binds the beta-prime subunit of host sigma-70-RNA polymerase to inhibit open promoter
    complex formation and shut off host transcription.
- source_id: PMID:8133519
  title: Bacteriophage T7 RNA polymerase and its active-site mutants. Kinetic, spectroscopic and calorimetric characterization.
  statement: Characterizes the catalytic mechanism and promoter-specific transcription activity of the single-subunit T7 DNA-directed
    RNA polymerase (gp1).
- source_id: PMID:9236119
  title: 'The junction-resolving enzyme T7 endonuclease I: quaternary structure and interaction with DNA.'
  statement: Establishes the homodimeric structure and four-way Holliday junction cleavage activity of T7 endonuclease I (gp3).
- source_id: GO:0039693
  title: viral DNA genome replication
  statement: Defines the biological process of replicating the viral double-stranded DNA genome inside the infected host cell.
notes: 'Exemplar phage: Escherichia phage T7 (NCBITaxon:10760). Generalizes across Autographiviridae (coliphage T3, Yersinia
  phage phiYeO3-12, Klebsiella phage KP34, Pseudomonas phage gh-1) and provides the evolutionary archetype for eukaryotic
  mitochondrial transcription and replication machinery (POLRMT, TWINKLE helicase, and DNA polymerase gamma).'
