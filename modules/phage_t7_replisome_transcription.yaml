  knowledge_gaps:
  - gap_statement: The structural handoff mechanism by which T7 RNA polymerase (gp1) transfers the nascent RNA primer at the
      primary replication origin (phi1.1A/phi1.1B) to the assembling gp5-TrxA-gp4-gp2.5 replisome in vivo remains incompletely
      resolved; in addition, Gene Ontology lacks a dedicated complex term for the minimal four-protein T7 replisome holoenzyme
      and a specific molecular function term for DNA-mimic anti-restriction inhibitors such as Ocr (gp0.3).
    boundary: Annotate Ocr to GO:0004857 (enzyme inhibitor activity) and GO:0099018 (symbiont-mediated evasion of host restriction-modification
      system), and annotate replisome subunits to their respective catalytic/binding functions and GO:0039693 (viral DNA genome
      replication).
    gap_kind:
