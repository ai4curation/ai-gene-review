            label: CD74-CD44 MIF receptor complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: macrophage migration inhibitory factor receptor complex
                term:
                  id: GO:0035692
                  label: macrophage migration inhibitory factor receptor complex
                active_units:
                  - id: cd74_mif_binding_unit
                    label: CD74
                    role: MIF/DDT-binding unit; binds the ligand through its extracellular
                      domain but cannot signal alone
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: CD74 (MHC class II invariant chain / MIF receptor)
                        term:
                          id: PANTHER:PTHR14093:SF17
                          label: HLA CLASS II HISTOCOMPATIBILITY ANTIGEN GAMMA CHAIN
                        description: >-
                          Subfamily PTHR14093:SF17 of PANTHER:PTHR14093 (HLA CLASS II GAMMA
                          CHAIN); the parent family also includes the thyroglobulin subfamily
                          PTHR14093:SF19, which shares only the type-1 thyroglobulin repeat.
                        representative_members:
                          - preferred_term: CD74
                            term:
                              id: UniProtKB:P04233
                              label: HLA class II histocompatibility antigen gamma chain
                          - preferred_term: Cd74
                            term:
                              id: UniProtKB:P04441
                              label: H-2 class II histocompatibility antigen gamma chain
                        ancestral_nodes:
                          - preferred_term: PAINT node PTN002679661 (CD74 MIF binding and
                              cytokine receptor activity)
                            term:
                              id: PANTHER:PTN002679661
                              label: PTN002679661
                            description: >-
                              Local PAINT IBD node in PTHR14093 (taxon:117571 Euteleostomi)
                              seeded by human CD74 (UniProtKB:P04233), mouse Cd74
                              (MGI:MGI:96534) and zebrafish cd74a (ZFIN:ZDB-GENE-000901-1),
                              propagating 13 terms including F:GO:0035718 macrophage migration
                              inhibitory factor binding and F:GO:0004896 cytokine receptor
                              activity.
                            evidence:
                              - source_id: GO_REF:0000033
                                statement: IBD propagation of GO:0035718 macrophage migration
                                  inhibitory factor binding from PAINT node PTN002679661 in
                                  PTHR14093.
                    function:
                      preferred_term: macrophage migration inhibitory factor binding
                      term:
                        id: GO:0035718
                        label: macrophage migration inhibitory factor binding
                    evidence:
                      - source_id: PMID:12782713
                        title: MIF signal transduction initiated by binding to CD74.
                        statement: MIF binds the extracellular domain of cell-surface CD74, and
                          CD74 is required for MIF-induced ERK1/2 activation.
                        supporting_text: >-
                          MIF binds to the extracellular domain of CD74, and CD74 is required for
                          MIF-induced activation of the extracellular signal-regulated kinase-1/2
                          MAP kinase cascade, cell proliferation, and PGE2 production.
                      - source_id: PMID:17045821
                        title: CD44 is the signaling component of the macrophage migration
                          inhibitory factor-CD74 receptor complex.
                        statement: CD74 alone is sufficient for MIF binding.
                        supporting_text: CD74 alone mediated MIF binding
                  - id: cd44_signaling_unit
                    label: CD44
                    role: signal-transducing unit; its intracytoplasmic domain is required for
                      MIF-induced Src-dependent ERK1/2 activation
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: CD44
                        term:
                          id: PANTHER:PTHR10225:SF6
                          label: CD44 ANTIGEN
                        description: >-
                          CD44 subfamily of PANTHER:PTHR10225 (hyaluronan receptor family). CD44
                          is also the principal hyaluronan receptor; only its role as the
                          signaling subunit of the MIF receptor complex is in scope here.
                        representative_members:
                          - preferred_term: CD44
                            term:
                              id: UniProtKB:P16070
                              label: CD44 antigen
                          - preferred_term: Cd44
                            term:
                              id: UniProtKB:P15379
                              label: CD44 antigen
                        ancestral_nodes:
                          - preferred_term: PAINT node PTN002566805 (CD44 MIF receptor complex)
                            term:
                              id: PANTHER:PTN002566805
                              label: PTN002566805
                            description: >-
                              PAINT IBD node in PTHR10225 (taxon:117571 Euteleostomi) seeded by
                              mouse Cd44 (MGI:MGI:88338) and human CD44 (UniProtKB:P16070),
                              propagating C:GO:0035692 macrophage migration inhibitory factor
                              receptor complex, F:GO:0004896 cytokine receptor activity
