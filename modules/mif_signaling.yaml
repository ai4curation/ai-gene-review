                      the complex rather than binding MIF itself.
                    evidence:
                      - source_id: PMID:17045821
                        title: CD44 is the signaling component of the macrophage migration
                          inhibitory factor-CD74 receptor complex.
                        statement: MIF-induced ERK1/2 phosphorylation requires full-length CD44
                          in addition to CD74, and CD44 is an integral member of the CD74
                          receptor complex.
                        supporting_text: >-
                          CD74 alone mediated MIF binding; however, MIF-induced ERK1 and ERK2
                          kinase phosphorylation required the coexpression of full-length CD44.
            function:
              preferred_term: cytokine receptor activity
              term:
                id: GO:0004896
                label: cytokine receptor activity
            processes:
              - preferred_term: macrophage migration inhibitory factor signaling pathway
                term:
                  id: GO:0035691
                  label: macrophage migration inhibitory factor signaling pathway
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Cell-surface receptor complex in which CD74 binds MIF or DDT and
              CD44 transduces the signal to Src-family kinases and the ERK1/2 cascade. Neither
              subunit alone is a functional MIF receptor.
            evidence:
              - source_id: GO:0035692
                title: macrophage migration inhibitory factor receptor complex
                statement: The GO definition of the MIF receptor complex states that it comprises the CD74
                  and CD44 cell surface proteins, which is the composition modelled in this step.
              - source_id: file:HETGA/Cd44/Cd44-ai-review.yaml
                title: Naked mole-rat Cd44 gene review
                statement: The existing Cd44 ortholog review assesses the MIF receptor complex term and
                  notes that its GO definition names both CD44 and CD74, which corroborates modelling the
                  receptor step as a CD74-CD44 complex.
                supporting_text: >-
                  The GO definition of this complex names CD44 and CD74 explicitly
              - source_id: PMID:17045821
                title: CD44 is the signaling component of the macrophage migration inhibitory
                  factor-CD74 receptor complex.
                statement: CD74 and CD44 together form the MIF receptor complex that signals
                  to ERK1/2 and protects cells from apoptosis.
                supporting_text: >-
                  These data establish CD44 as an integral member of the CD74 receptor complex
                  leading to MIF signal transduction.
  connections:
