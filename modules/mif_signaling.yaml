id: MODULE:mif_signaling
title: MIF signaling pathway module
description: >-
  Macrophage migration inhibitory factor (MIF) and its paralog D-dopachrome tautomerase (DDT,
  also called MIF-2) are secreted homotrimeric cytokines that bind the cell-surface receptor
  CD74 (the MHC class II invariant chain) in complex with the signaling co-receptor CD44 on
  responding immune and parenchymal cells, initiating SRC-family kinase and ERK1/2 MAP kinase
  signaling cascades that regulate leukocyte activation, inflammatory cytokine production and
  cell survival.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0035691
    title: macrophage migration inhibitory factor signaling pathway
    statement: The module is grounded in the GO biological process term for the macrophage
      migration inhibitory factor signaling pathway.
  - source_id: PMID:12782713
    title: MIF signal transduction initiated by binding to CD74.
    statement: Identifies cell-surface CD74 as the high-affinity receptor for MIF required for
      MIF-induced ERK1/2 activation, PGE2 production and cell proliferation.
    supporting_text: >-
      MIF binds to the extracellular domain of CD74, and CD74 is required for MIF-induced
      activation of the extracellular signal-regulated kinase-1/2 MAP kinase cascade, cell
      proliferation, and PGE2 production.
  - source_id: PMID:17045821
    title: CD44 is the signaling component of the macrophage migration inhibitory factor-CD74
      receptor complex.
    statement: Shows that CD74 forms a signaling receptor complex with CD44, which is required
      for MIF-induced SRC and ERK1/2 activation and protection from apoptosis.
    supporting_text: >-
      CD74 alone mediated MIF binding; however, MIF-induced ERK1 and ERK2 kinase
      phosphorylation required the coexpression of full-length CD44.
  - source_id: PMID:21817065
    title: The D-dopachrome tautomerase (DDT) gene product is a cytokine and functional
      homolog of macrophage migration inhibitory factor (MIF).
    statement: Demonstrates that D-dopachrome tautomerase (DDT / MIF-2) is a second MIF-family
      cytokine ligand that binds CD74 with high affinity and activates ERK1/2 signaling in a
      CD74- and CD44-dependent manner.
    supporting_text: >-
      We show that recombinant D-DT protein binds CD74 with high affinity, leading to
      activation of ERK1/2 MAP kinase and downstream proinflammatory pathways.
  - source_id: file:interpro/panther/PTHR11954/PTHR11954-review.yaml
    statement: PANTHER family review for PTHR11954 (D-DOPACHROME DECARBOXYLASE), covering the
      MIF and DDT subfamilies and PAINT node PTN000237513.
  - source_id: file:genes/human/MIF/MIF-ai-review.yaml
    statement: Gene review for human MIF (UniProtKB:P14174).
notes: >-
  Boundary. The module has two steps: a secreted MIF-family cytokine ligand (MIF or DDT) and
  the cell-surface CD74 receptor on the responding cell. The transmembrane co-receptor CD44
  (which associates with CD74 in the macrophage migration inhibitory factor receptor complex,
  GO:0035692, to transduce SRC and ERK1/2 signals because CD74 has a short cytoplasmic tail
  lacking intrinsic catalytic activity), the non-cognate chemokine receptors CXCR2, CXCR4 and
  ACKR3 (which MIF, but not DDT, also engages via its pseudo-(E)LR motif), and intracellular
  effectors (SRC-family kinases, ERK1/2, AMPK, JAB1/CSN5) are not modelled as separate parts.
  The module is species-neutral; the representative members (human MIF, DDT and CD74; mouse
  Mif, Ddt and Cd74) are examples, not a species scope. The taxon scope Bilateria
  (NCBITaxon:33213) tracks the taxon placement of the PAINT MIF/DDT cytokine-activity clade
  node PTN000237513 in PTHR11954 (whereas the vertebrate CD74 receptor clade node PTN002679661
  in PTHR14093:SF17 is placed at Euteleostomi, NCBITaxon:117571).

  Ligand function term. The ligand step uses GO:0005125 cytokine activity, a child of
  GO:0048018 receptor ligand activity, following the GO-CAM signaling receptor guideline that
  a ligand enables receptor ligand activity or a child. Both PAINT node PTN000237513 in
  PTHR11954 and experimental annotations on human MIF and DDT (PMID:21817065) assert
  GO:0005125 cytokine activity. Members of PTHR11954 also possess an ancestral phenylpyruvate
  tautomerase / D-dopachrome decarboxylase catalytic site around N-terminal Pro-2
  (PTN000237510, GO:0050178 phenylpyruvate tautomerase activity), which overlaps the
  CD74-binding surface (PMID:17526494, PMID:21817065); that enzymatic activity is documented in
  interpro/panther/PTHR11954/PTHR11954-review.yaml and genes/human/MIF/MIF-ai-review.yaml.

  Receptor family and function term. The receptor step is grounded to subfamily
  PANTHER:PTHR14093:SF17 (HLA CLASS II HISTOCOMPATIBILITY ANTIGEN GAMMA CHAIN) rather than the
  parent family PANTHER:PTHR14093 (HLA CLASS II GAMMA CHAIN), because PTHR14093 also includes
  the PTHR14093:SF19 thyroglobulin subfamily (which shares only the type-1 thyroglobulin
  repeat). PAINT node PTN002679661 in PTHR14093 (taxon:117571, seeded by human CD74, mouse Cd74
  and zebrafish cd74a) carries 13 IBD annotations, including GO:0004896 cytokine receptor
  activity and GO:0035718 macrophage migration inhibitory factor binding alongside MHC class II
  antigen presentation and downstream signaling terms. The receptor step uses GO:0004896
  cytokine receptor activity.

  Annotation state (GOA GAFs). Human CD74 (UniProtKB:P04233) and CD44 (UniProtKB:P16070) are
  annotated to GO:0035691 macrophage migration inhibitory factor signaling pathway (IEA from
  mouse MGI annotations on Cd74 and Cd44) and GO:2000448 positive regulation of macrophage
  migration inhibitory factor signaling pathway, and human DDT (UniProtKB:P30046) is annotated
  to GO:0035691 by IDA (PMID:21817065), whereas human MIF (UniProtKB:P14174) is not annotated
  to GO:0035691 in GOA (MIF carries the parent term GO:0007166 cell surface receptor signaling
  pathway by IDA from PMID:12782713 and GO:0070374 positive regulation of ERK1 and ERK2
  cascade). Following the DDT precedent, the MIF gene review adds GO:0035691 as NEW (IDA), and
  the PTHR11954 family review recommends adding GO:0035691 at PTN000237513.
