            function:
              preferred_term: cytokine receptor activity
              term:
                id: GO:0004896
                label: cytokine receptor activity
            processes:
              - preferred_term: macrophage migration inhibitory factor signaling pathway
                term:
                  id: GO:0035691
                  label: macrophage migration inhibitory factor signaling pathway
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Cell-surface MIF/DDT-binding receptor subunit that initiates MIF
              signaling in complex with CD44.
            evidence:
              - source_id: PMID:12782713
                title: MIF signal transduction initiated by binding to CD74.
                statement: Cell-surface CD74 is a high-affinity binding protein for MIF and is
                  required for MIF-mediated ERK1/2 phosphorylation, PGE2 production and cell
                  proliferation.
                supporting_text: >-
                  Using expression cloning and functional analysis, we report the identification
                  of CD74, the cell surface form of the class II–associated invariant chain, as
                  a cell surface binding protein for MIF. MIF binds to CD74 by a high-affinity
                  interaction, and CD74 expression is required for MIF-mediated ERK-1/2
                  phosphorylation, PGE2 production, and cell proliferation.
              - source_id: PMID:17045821
                title: CD44 is the signaling component of the macrophage migration inhibitory
                  factor-CD74 receptor complex.
                statement: CD74 mediates MIF binding and complexes with CD44 to activate SRC
                  and ERK1/2 signaling and protect cells from apoptosis.
                supporting_text: >-
                  These data establish CD44 as an integral member of the CD74 receptor complex
                  leading to MIF signal transduction.
