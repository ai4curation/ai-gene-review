            evidence:
              - source_id: PMID:12782713
                title: MIF signal transduction initiated by binding to CD74.
                statement: MIF binds the extracellular domain of CD74 with nanomolar affinity
                  and activates ERK1/2 signaling.
                supporting_text: >-
                  A recombinant, soluble form of CD74 binds MIF with a dissociation constant of
                  approximately 9 x 10-9 Kd, as defined by surface plasmon resonance (BIAcore
                  analysis), and soluble CD74 inhibits MIF-mediated extracellular
                  signal-regulated kinase activation in defined cell systems.
              - source_id: PMID:21817065
                title: The D-dopachrome tautomerase (DDT) gene product is a cytokine and
                  functional homolog of macrophage migration inhibitory factor (MIF).
                statement: DDT (MIF-2) also binds the CD74 ectodomain with high affinity and
                  activates ERK1/2 phosphorylation in a CD74/CD44-dependent manner.
                supporting_text: >-
                  D-DT–induced ERK1/2 phosphorylation was strictly dependent on the expression
                  of both CD74 and CD44, as previously reported for MIF
