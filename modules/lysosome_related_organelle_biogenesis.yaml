id: MODULE:lysosome_related_organelle_biogenesis
title: Lysosome-related organelle biogenesis by the Rab32/38 pathway
description: Lysosome-related organelles are cell-type-specific compartments that share their origin with
  lysosomes and coexist with them, such as melanosomes, platelet dense granules and the gut granules of
  nematodes. They are built from endosomes by the machinery that delivers membrane proteins to lysosomes,
  redirected by the small GTPases Rab32 and Rab38. AP-3 and BLOC-1 sort the organelle's membrane proteins
  away from the degradative route, and Rab32/38, activated by a dedicated guanine nucleotide exchange factor
  (BLOC-3 in vertebrates and insects, a GLO-3 and CCZ-1 complex in nematodes), directs that cargo to the
  forming organelle. This module is the core of that pathway, written so that it can be evaluated in any
  animal genome.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:23084991
  title: BLOC-3 mutated in Hermansky-Pudlak syndrome is a Rab32/38 guanine nucleotide exchange factor.
  statement: BLOC-1 and BLOC-2 with AP-3 sort melanosome components at early endosomes; BLOC-3 is the Rab32/38
    GEF.
  supporting_text: BLOC-1 and BLOC-2, together with the AP-3 clathrin adaptor complex, act at early endosomes
    to sort components required for melanin formation and melanosome biogenesis away from the degradative
    lysosomal pathway toward early stage melanosomes.
- source_id: PMID:23247405
  title: Cell type-specific Rab32 and Rab38 cooperate with the ubiquitous lysosome biogenesis machinery to synthesize
    specialized lysosome-related organelles.
  statement: Rab32 and Rab38 redirect the ubiquitous sorting machinery to traffic cargo to melanosomes.
  supporting_text: Two small GTPases, Rab32 and Rab38, are key proteins in the biogenesis of melanosomes and
    were recently shown to redirect the ubiquitous machinery-BLOC-2, AP-1 and AP-3-to traffic specialized cargoes
    to melanosomes in melanocytes.
notes: 'Scope: read as a satisfiability rule, an animal genome needs a Rab32/38-family GTPase, a GEF for it
  (BLOC-3, or the nematode GLO-3 and CCZ-1 pair), the AP-3 delta subunit and BLOC-1. AP-3, BLOC-1 and the HOPS
  machinery are not specific to lysosome-related organelles; they also deliver proteins to conventional lysosomes,
  and AP-3 delta and BLOC-1 subunits are found outside animals (Dictyostelium and the chytrid carry several
  in PANTHER''s release-19 files). The Rab32/38-and-GEF axis is what makes the pathway specific, and it is
  older than animals too: PANTHER''s files place a Rab32-subfamily protein and an HPS1 protein in Monosiga
  and Dictyostelium. The module therefore takes Metazoa as its context because the organelles it describes
  are characterised in animals, not because its parts are animal-specific. BLOC-2 (HPS3, HPS5, HPS6) is optional:
  HPS6 is in no census animal outside human and Trichoplax. Not modelled: organelle-specific cargo and maturation
  (melanin synthesis, serotonin and nucleotide uptake into dense granules), the Rab27 and myosin-Va machinery
  that moves and secretes these organelles, the LYST/beige protein, and the HOPS-related complexes that fuse
  vesicles with the maturing organelle.'
