id: MODULE:plant_circadian_clock_oscillator
title: Arabidopsis core circadian oscillator (CCA1/LHY - PRR - evening complex - ZTL)
description: >
  The core circadian oscillator of Arabidopsis thaliana is a network of interlocked
  transcriptional repressor loops that generates a roughly 24 h rhythm in the nucleus. It is
  reinforced by timed, light-gated proteolysis. At dawn, the single-MYB transcription factors
  CCA1 and LHY peak and repress evening-phased clock genes (TOC1, ELF4, LUX, ELF3) through
  evening elements in their promoters. Through the day, the pseudo-response regulators
  PRR9, PRR7, PRR5 and finally TOC1 (PRR1) accumulate in sequential waves. Each binds target
  promoters through its C-terminal CCT domain and represses CCA1 and LHY, recruiting
  TOPLESS/TPR corepressors with histone deacetylase, so that CCA1/LHY expression stays low
  until the end of the night. At dusk the evening complex (EC) assembles: the scaffold ELF3
  bridges the DNA-binding MYB protein LUX and the small protein ELF4. The EC represses PRR9,
  PRR7, GI and LUX itself through the LUX binding site, closing the evening-to-morning
  connection and gating growth genes (PIF4/PIF5) to the end of the night. Post-translational
  control sets the pace. The LOV-domain F-box photoreceptor ZEITLUPE (ZTL), as the substrate
  adaptor of an SCF E3 ligase, targets phosphorylated TOC1 and PRR5 for proteasomal
  degradation, mainly in the dark. GIGANTEA binds ZTL in a blue-light-enhanced manner and
  stabilizes it during the day, so ZTL activity rises at dusk. Light input through
  phytochromes and cryptochromes, temperature input (sensed partly by the ELF3 prion-like
  domain), and output pathways such as photoperiodic flowering (GI-CO-FT, CDFs) are outside
  this module's boundary except where a component acts directly within the oscillator loops.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:20233950
    title: PSEUDO-RESPONSE REGULATORS 9, 7, and 5 are transcriptional repressors in the Arabidopsis
      circadian clock.
    statement: PRR9, PRR7 and PRR5 repress CCA1 and LHY and bind their promoters, forming the daytime
      negative arm of the CCA1/LHY-PRR loop.
    supporting_text: Here, we demonstrate that PRR9, PRR7, and PRR5 act as transcriptional repressors
      of CCA1 and LHY.
  - source_id: PMID:11100772
    title: 'Circadian waves of expression of the APRR1/TOC1 family of pseudo-response regulators in
      Arabidopsis thaliana: insight into the plant circadian clock.'
    statement: PRR transcripts accumulate in sequential waves after dawn.
    supporting_text: the APRR-mRNAs started accumulating sequentially after dawn with 2-3 h intervals
      in the order of APRR9-->APRR7-->APRR5-->APRR3-->APRR1
  - source_id: PMID:21753751
    title: The ELF4-ELF3-LUX complex links the circadian clock to diurnal control of hypocotyl growth.
    statement: The evening complex consists of ELF3, ELF4 and LUX, with ELF3 bridging ELF4 and LUX.
    supporting_text: ELF3 is both necessary and sufficient to form a complex between ELF4 and LUX
  - source_id: PMID:21236673
    title: LUX ARRHYTHMO encodes a nighttime repressor of circadian gene expression in the Arabidopsis
      core clock.
    statement: LUX directly represses PRR9, linking the evening and morning loops.
    supporting_text: LUX directly regulates the expression of PSEUDO RESPONSE REGULATOR9 (PRR9), a
      major component of the morning transcriptional feedback circuit
  - source_id: PMID:18562312
    title: Post-translational regulation of the Arabidopsis circadian clock through selective proteolysis
      and phosphorylation of pseudo-response regulator proteins.
    statement: Within the PRR family, only TOC1 and PRR5 are SCF-ZTL proteolytic substrates.
    supporting_text: together with TOC1, PRR5 is the only other likely proteolytic substrate of the
      E3 ubiquitin ligase SCF(ZTL) within this PRR family
  - source_id: PMID:23267111
    title: Transcriptional corepressor TOPLESS complexes with pseudoresponse regulator proteins and
      histone deacetylases to regulate circadian transcription.
    statement: PRR5, PRR7 and PRR9 recruit TPL/TPR corepressors at the CCA1 and LHY promoters.
    supporting_text: interact with these three PRR proteins at the CCA1 and LHY promoters to repress
      transcription and alter circadian period
module:
  id: plant_circadian_clock_oscillator
  label: Arabidopsis core circadian oscillator
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Interlocked transcriptional repressor loops (morning MYB factors, sequential PRR repressors,
    evening complex) plus SCF-ZTL proteolysis of TOC1/PRR5, which together generate and pace the
    plant circadian rhythm.
  concepts:
    - preferred_term: circadian rhythm
      term:
        id: GO:0007623
        label: circadian rhythm
      description: The endogenous roughly 24 h oscillation generated by the module.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: Concrete instance grounded in Arabidopsis members; orthologous loops exist
          across flowering plants.
    cellular_components:
      - preferred_term: nucleus
        term:
          id: GO:0005634
          label: nucleus
        description: The transcriptional loops operate on chromatin in the nucleus; ZTL acts on
          nucleocytoplasmically shuttling substrates.
  parts:
    - order: 1
      role: morning loop (dawn MYB repressors)
      node:
        id: morning_myb_loop
        label: CCA1/LHY morning loop
        module_type: REGULATORY_STEP
        description: >-
          Partially redundant single-MYB (RVE-type) transcription factors that peak at dawn, bind
          evening elements and repress evening-phased clock genes including TOC1, ELF4 and LUX.
        annotons:
          - id: cca1_myb_tf
            label: "CCA1: dawn MYB transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CCA1
                term:
                  id: UniProtKB:P92973
                  label: Protein CCA1
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: circadian rhythm
                term:
                  id: GO:0007623
                  label: circadian rhythm
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Binds evening elements and represses evening-phased oscillator genes at dawn.
          - id: lhy_myb_tf
            label: "LHY: dawn MYB transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LHY
                term:
                  id: UniProtKB:Q6R0H1
                  label: Protein LHY
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
            processes:
              - preferred_term: regulation of circadian rhythm
                term:
                  id: GO:0042752
                  label: regulation of circadian rhythm
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Partially redundant with CCA1 in dawn repression of evening genes.
    - order: 2
      role: daytime PRR repressor wave
      node:
        id: prr_repressor_wave
        label: PRR9 -> PRR7 -> PRR5 sequential repressors
        module_type: REGULATORY_STEP
        description: >-
          Pseudo-response regulators expressed in successive waves from morning (PRR9) through
          midday (PRR7) to afternoon/evening (PRR5). Each represses CCA1 and LHY through its
          CCT domain with TPL/TPR corepressors, keeping the morning genes off until the end of
          the night. The three are partially redundant: the prr9 prr7 prr5 triple mutant is
          arrhythmic.
        annotons:
          - id: prr9_repressor
            label: "PRR9: morning CCT-domain repressor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PRR9
                term:
                  id: UniProtKB:Q8L500
                  label: Two-component response regulator-like APRR9
            function:
              preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
              term:
                id: GO:0001227
                label: DNA-binding transcription repressor activity, RNA polymerase II-specific
              evidence:
                - source_id: PMID:23267111
                  statement: PRR9 forms a repressive complex with TPL and HDA6 in vivo.
                  supporting_text: a complex of PRR9, TPL, and histone deacetylase 6, can form in vivo
            processes:
              - preferred_term: circadian rhythm
                term:
                  id: GO:0007623
                  label: circadian rhythm
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Earliest PRR; light-induced, represses CCA1/LHY in the morning.
          - id: prr7_repressor
            label: "PRR7: midday CCT-domain repressor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PRR7
                term:
                  id: UniProtKB:Q93WK5
                  label: Two-component response regulator-like APRR7
            function:
              preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
              term:
                id: GO:0001227
                label: DNA-binding transcription repressor activity, RNA polymerase II-specific
              evidence:
                - source_id: PMID:23808423
                  statement: PRR7 directly represses morning-expressed genes.
                  supporting_text: PRR7 is important for cyclic gene expression by repressing the
                    transcription of morning-expressed genes
            processes:
              - preferred_term: circadian rhythm
                term:
                  id: GO:0007623
                  label: circadian rhythm
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Midday PRR; represses CCA1/LHY and morning output genes.
          - id: prr5_repressor
            label: "PRR5: afternoon CCT-domain repressor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PRR5
                term:
                  id: UniProtKB:Q6LA42
                  label: Two-component response regulator-like APRR5
            function:
              preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
              term:
                id: GO:0001227
                label: DNA-binding transcription repressor activity, RNA polymerase II-specific
              evidence:
                - source_id: PMID:23027938
                  statement: PRR5 binds target DNA through its CCT motif.
                  supporting_text: PRR5 associates with target DNA through binding at the CCT motif
                    in vivo
            processes:
              - preferred_term: circadian rhythm
                term:
                  id: GO:0007623
                  label: circadian rhythm
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Afternoon PRR; represses CCA1/LHY and output genes, heterodimerizes
              with TOC1, and is an SCF-ZTL substrate.
    - order: 3
      role: evening PRR repressor (TOC1)
      node:
        id: toc1_evening_repressor
        label: TOC1 (PRR1) evening repressor
        module_type: REGULATORY_STEP
        description: >-
          TOC1, the last PRR wave, peaks at dusk and binds the CCA1 and LHY promoters through its
          CCT domain to repress them. With the morning MYBs it forms the original reciprocal
          feedback loop.
        annotons:
          - id: toc1_repressor
            label: "TOC1: evening CCT-domain repressor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: TOC1
                term:
                  id: UniProtKB:Q9LKL2
                  label: Two-component response regulator-like APRR1
            function:
              preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
              term:
                id: GO:0001227
                label: DNA-binding transcription repressor activity, RNA polymerase II-specific
            processes:
              - preferred_term: circadian rhythm
                term:
                  id: GO:0007623
                  label: circadian rhythm
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Dusk-phased repressor of CCA1/LHY.
    - order: 4
      role: evening complex
      node:
        id: evening_complex
        label: Evening complex (ELF3-ELF4-LUX)
        module_type: PROTEIN_COMPLEX
        description: >-
          Dusk-phased nuclear repressor complex. LUX provides sequence-specific DNA binding (LBS,
          GAT(A/T)CG); ELF3 is the scaffold bridging LUX and ELF4; ELF4 restores high-affinity DNA
          binding of the LUX-ELF3 subcomplex. The EC represses PRR9, PRR7, GI and LUX and the growth
          regulators PIF4/PIF5 during the early night, and its target occupancy weakens at warm
          temperature.
        concepts:
          - preferred_term: transcription regulator complex
            term:
              id: GO:0005667
              label: transcription regulator complex
            description: The EC is annotated (ComplexPortal) as a transcription regulator complex.
        annotons:
          - id: lux_dna_binding_subunit
            label: "LUX: MYB DNA-binding subunit"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LUX
                term:
                  id: UniProtKB:Q9SNB4
                  label: Transcription factor LUX
            function:
              preferred_term: DNA-binding transcription repressor activity, RNA polymerase II-specific
              term:
                id: GO:0001227
                label: DNA-binding transcription repressor activity, RNA polymerase II-specific
              evidence:
                - source_id: PMID:21236673
                  statement: LUX binds its own promoter and represses itself.
                  supporting_text: We also show that LUX binds to its own promoter, defining a new negative
                    autoregulatory feedback loop within the core clock.
            processes:
              - preferred_term: negative regulation of transcription by RNA polymerase II
                term:
                  id: GO:0000122
                  label: negative regulation of transcription by RNA polymerase II
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Targets the EC to LBS-containing promoters.
          - id: elf3_scaffold
            label: "ELF3: EC scaffold"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ELF3
                term:
                  id: UniProtKB:O82804
                  label: Protein EARLY FLOWERING 3
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
              evidence:
                - source_id: PMID:21753751
                  statement: ELF3 bridges ELF4 and LUX.
                  supporting_text: ELF3 is both necessary and sufficient to form a complex between ELF4
                    and LUX
            processes:
              - preferred_term: negative regulation of transcription by RNA polymerase II
                term:
                  id: GO:0000122
                  label: negative regulation of transcription by RNA polymerase II
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Non-DNA-binding scaffold and corepressor; its prion-like domain makes
              EC activity temperature-sensitive.
          - id: elf4_corepressor
            label: "ELF4: EC corepressor subunit"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ELF4
                term:
                  id: UniProtKB:O04211
                  label: Protein EARLY FLOWERING 4
            function:
              preferred_term: transcription corepressor activity
              term:
                id: GO:0003714
                label: transcription corepressor activity
            processes:
              - preferred_term: negative regulation of transcription by RNA polymerase II
                term:
                  id: GO:0000122
                  label: negative regulation of transcription by RNA polymerase II
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            role_description: Small helical subunit recruited via ELF3; restores EC DNA binding.
    - order: 5
      role: ZTL-mediated proteolysis of TOC1 and PRR5 (gated by GI and blue light)
      node:
        id: ztl_proteolysis
        label: SCF-ZTL degradation of TOC1/PRR5
        module_type: REGULATORY_STEP
        description: >-
          The LOV/F-box/Kelch photoreceptor ZTL is the substrate adaptor of an SCF E3 ligase that
          recognizes phosphorylated TOC1 and PRR5 via their pseudo-receiver domains and targets
          them for 26S proteasomal degradation, mainly in the dark. GIGANTEA binds ZTL in a
          blue-light-enhanced manner and stabilizes it during the day, so ZTL protein levels
          oscillate and its activity rises at dusk.
        annotons:
          - id: ztl_substrate_adaptor
            label: "ZTL: SCF substrate adaptor for TOC1/PRR5"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ZTL
                term:
                  id: UniProtKB:F4KAN2
                  label: Galactose oxidase/kelch repeat superfamily protein
            function:
              preferred_term: ubiquitin-like ligase-substrate adaptor activity
              term:
                id: GO:1990756
                label: ubiquitin-like ligase-substrate adaptor activity
              evidence:
                - source_id: PMID:17693530
                  statement: ZTL targets PRR5 for proteasomal degradation.
                  supporting_text: ZTL targets PRR5 for degradation by 26S proteasomes in the circadian
                    clock and in early photomorphogenesis
            processes:
              - preferred_term: ubiquitin-dependent protein catabolic process
                term:
                  id: GO:0006511
                  label: ubiquitin-dependent protein catabolic process
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: Recognizes phosphorylated TOC1/PRR5; LOV domain gates activity by blue light.
          - id: ztl_photoreceptor
            label: "ZTL: LOV-domain blue-light photoreceptor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: ZTL
                term:
                  id: UniProtKB:F4KAN2
                  label: Galactose oxidase/kelch repeat superfamily protein
            function:
              preferred_term: photoreceptor activity
              term:
                id: GO:0009881
                label: photoreceptor activity
            processes:
              - preferred_term: response to blue light
                term:
                  id: GO:0009637
                  label: response to blue light
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: FMN-binding LOV domain senses blue light and enhances GI binding.
          - id: gi_ztl_stabilizer
            label: "GI: binds and stabilizes ZTL"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GI
                term:
                  id: UniProtKB:Q9SQI2
                  label: Protein GIGANTEA
            function:
              preferred_term: ubiquitin protein ligase binding
              term:
                id: GO:0031625
                label: ubiquitin protein ligase binding
            processes:
              - preferred_term: regulation of circadian rhythm
                term:
                  id: GO:0042752
                  label: regulation of circadian rhythm
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: Blue-light-enhanced ZTL partner that stabilizes ZTL during the day.
  connections:
    - source: morning_myb_loop
      target: toc1_evening_repressor
      connection_type: NEGATIVELY_REGULATES
      description: CCA1/LHY bind the evening element of the TOC1 promoter and repress it at dawn.
    - source: morning_myb_loop
      target: evening_complex
      connection_type: NEGATIVELY_REGULATES
      description: CCA1/LHY repress the evening-phased EC genes (ELF4, LUX, ELF3) through evening elements.
      evidence:
        - source_id: PMID:16006522
          statement: CCA1 and LHY bind the evening element in the LUX promoter.
          supporting_text: We demonstrate that CCA1 and LHY bind to the evening element motif in the
            LUX promoter, which strongly suggests that these proteins repress LUX expression, as they
            do TOC1.
    - source: prr_repressor_wave
      target: morning_myb_loop
      connection_type: NEGATIVELY_REGULATES
      description: PRR9, PRR7 and PRR5 bind and repress the CCA1 and LHY promoters during the day.
      evidence:
        - source_id: PMID:20233950
          statement: PRR9/7/5 associate with CCA1/LHY promoters in vivo.
          supporting_text: PRR9, PRR7, and PRR5 associate with the CCA1 and LHY promoters in vivo, coincident
            with the timing of decreased CCA1 and LHY expression
    - source: toc1_evening_repressor
      target: morning_myb_loop
      connection_type: NEGATIVELY_REGULATES
      description: TOC1 represses CCA1 and LHY at dusk and through the night.
    - source: evening_complex
      target: prr_repressor_wave
      connection_type: NEGATIVELY_REGULATES
      description: The EC, via LUX binding sites, represses PRR9 (and PRR7) during the early night,
        allowing CCA1/LHY to rise toward dawn.
      evidence:
        - source_id: PMID:21236673
          statement: LUX directly represses PRR9.
          supporting_text: LUX directly regulates the expression of PSEUDO RESPONSE REGULATOR9 (PRR9),
            a major component of the morning transcriptional feedback circuit
    - source: ztl_proteolysis
      target: toc1_evening_repressor
      connection_type: NEGATIVELY_REGULATES
      description: SCF-ZTL degrades TOC1 in the dark.
      evidence:
        - source_id: PMID:18562312
          statement: TOC1 and PRR5 are SCF-ZTL substrates.
          supporting_text: together with TOC1, PRR5 is the only other likely proteolytic substrate of
            the E3 ubiquitin ligase SCF(ZTL) within this PRR family
    - source: ztl_proteolysis
      target: prr_repressor_wave
      connection_type: NEGATIVELY_REGULATES
      description: SCF-ZTL degrades PRR5, but not PRR9 or PRR7.
      evidence:
        - source_id: PMID:17693530
          statement: ZTL targets PRR5 for proteasomal degradation.
          supporting_text: ZTL targets PRR5 for degradation by 26S proteasomes in the circadian clock and
            in early photomorphogenesis
  notes: >-
    No production GO-CAM in gocams/index.tsv contains these Arabidopsis clock genes (checked
    2026-10-06), so no gocam_associations are given. ZTL is grounded as UniProtKB:F4KAN2 to match
    the existing genes/ARATH/ZTL review. The canonical Swiss-Prot entry for ZEITLUPE (At5g57360) is
    Q94BT6, and the review should be re-grounded on it (see ZTL-notes.md). The RVE8/LNK
    activators, CHE, PRR3, and the light (PHY/CRY) and temperature input pathways are omitted from
    this core boundary. Photoperiodic flowering outputs (GI-FKF1-CDF-CO-FT) are a separate module.
    PANTHER family ids are not asserted.
