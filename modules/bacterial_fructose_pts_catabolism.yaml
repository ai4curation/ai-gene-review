id: MODULE:bacterial_fructose_pts_catabolism
title: Bacterial fused-relay fructose PTS uptake and catabolism
description: A reusable bacterial fused-relay module coupling phosphoenolpyruvate-driven phosphorelay,
  fructose translocation with phosphorylation to fructose 1-phosphate, and ATP-dependent production of
  fructose 1,6-bisphosphate. This implementation requires a fused EI-HPr-EIIA FruB protein and an EIIB'BC
  FruA transporter with two EIIB-type domains plus EIIC. Nitrogen-related PTS signaling and metabolism
  downstream of fructose 1,6-bisphosphate are outside the module boundary.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: PMID:18296519
  title: Evidence of in vivo cross talk between the nitrogen-related and fructose-related branches of
    the carbohydrate phosphotransferase system of Pseudomonas putida.
  statement: KT2440 genetics and phosphotransfer analysis establish FruB and FruA as a complete fructose-intake
    PTS and define their fused relay architecture.
- source_id: PMID:27933319
  title: A Metabolic Widget Adjusts the Phosphoenolpyruvate-Dependent Fructose Influx in Pseudomonas putida.
  statement: The KT2440 fruBKA locus supplies cytosolic FruB, membrane FruA, and FruK for fructose uptake
    and fructose 1-phosphate metabolism.
- source_id: UniProtKB:Q88PQ5
  title: Pseudomonas putida KT2440 FruB
  statement: Q88PQ5 is the exact PSEPK EI-HPr-EIIA phosphorelay exemplar.
- source_id: UniProtKB:Q88PQ3
  title: Pseudomonas putida KT2440 FruA
  statement: Q88PQ3 is the exact PSEPK fructose-specific EIIB'BC exemplar.
- source_id: UniProtKB:Q88PQ4
  title: Pseudomonas putida KT2440 FruK
  statement: Q88PQ4 is the exact PSEPK 1-phosphofructokinase exemplar.
- source_id: file:PSEPK/fruB/fruB-ai-review.yaml
  title: Curated PSEPK FruB gene review
  statement: The review proposes a missing EIIA-to-EIIB phosphotransferase activity term for the FruB-to-FruA
    handoff.
- source_id: file:genes/ECOLI/fruA/fruA-ai-review.yaml
  title: Curated E. coli fruA gene review
  statement: P20966 grounds the E. coli fructose-specific EIIB'BC PTS permease role and supports the phosphocysteine-D-fructose
    transporter step.
- source_id: file:genes/ECOLI/fruK/fruK-ai-review.yaml
  title: Curated E. coli fruK gene review
  statement: P0AEW9 grounds the E. coli 1-phosphofructokinase role for conversion of fructose 1-phosphate
    to fructose 1,6-bisphosphate.
notes: 'The Bacteria context bounds this fused-relay implementation rather than asserting universal bacterial
  capacity. Demonstrated systems and sequence-qualified comparisons span alpha- and gammaproteobacteria.
  Deinococcus provides a separate strain boundary: the older assayed system uses ATP, whereas resequenced
  ATCC13939K has a restored full FruB ORF. This is not yet proof of native PEP-dependent uptake. E. coli
  FruA/FruK are component comparators; E. coli FPr lacks EI and requires separate PtsI, so these two members
  do not make a complete fused-relay system. Xanthomonas historical assays used ATCC13951, while current
  exemplar sequences are ATCC33913 with recorded differences. Rhodobacter sequences match the original
  sequenced locus, and the Sp7 panel matches the experimentally prioritized main locus; do not substitute
  its paralog locus. PANTHER memberships are necessary family context, not sufficient architecture, donor,
  substrate or pathway evidence. Required-domain and required-function descriptors capture the additional
  conditions; no family name is treated as proof of these conditions.'
