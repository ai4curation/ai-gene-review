id: MODULE:bacterial_fructose_pts_catabolism
title: Bacterial fused-relay fructose PTS uptake and catabolism
description: >-
  A bacterial fructose-utilization module in which a single soluble
  multiphosphoryl transfer protein (FruB), fusing EIIA(Fru), HPr and enzyme I
  domains, accepts phosphate from phosphoenolpyruvate and relays it to the
  membrane EIIB'BC fructose permease FruA; FruA imports fructose as
  intracellular fructose 1-phosphate, and the 1-phosphofructokinase FruK
  converts it with ATP to fructose 1,6-bisphosphate. The fused relay is
  documented experimentally in Pseudomonas and Xanthomonas, and in
  Pseudomonas putida FruB is the only enzyme I-type sugar-PTS protein. The
  permease and kinase steps are the
  same as in bacteria that split the relay into a separate enzyme I and an
  EIIA-HPr FPr protein, such as Escherichia coli. Nitrogen-related PTS
  signalling, transcriptional control, and metabolism downstream of fructose
  1,6-bisphosphate are outside the module.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:18296519
    title: Evidence of in vivo cross talk between the nitrogen-related and fructose-related branches of the carbohydrate phosphotransferase system of Pseudomonas putida.
    statement: >-
      KT2440 genetics establish FruB and FruA as a complete fructose-intake PTS
      and show that phosphate enters it from phosphoenolpyruvate.
  - source_id: PMID:27933319
    title: A Metabolic Widget Adjusts the Phosphoenolpyruvate-Dependent Fructose Influx in Pseudomonas putida.
    statement: >-
      The KT2440 fruBKA locus supplies cytoplasmic FruB, membrane FruA, and
      FruK for fructose uptake and fructose 1-phosphate metabolism.
  - source_id: PMID:7496537
    title: 'Fructose phosphotransferase system of Xanthomonas campestris pv. campestris: characterization of the fruB gene.'
    statement: >-
      A fruB mutant establishes the fused multiphosphoryl transfer protein as
      required for fructose transport and phosphorylation in X. campestris,
      extending the fused-relay architecture beyond Pseudomonas.
  - source_id: PMID:8626640
    title: Function of the duplicated IIB domain and oligomeric structure of the fructose permease of Escherichia coli.
    statement: >-
      Biochemistry of E. coli FruA defines the EIIB'BC permease: the B' domain
      aids phosphoryl transfer from the EIIA donor and the B-domain cysteine is
      essential for fructose phosphorylation and transport.
  - source_id: file:PSEPK/fruB/fruB-ai-review.yaml
    title: PSEPK fruB gene review
    statement: >-
      Q88PQ5 supplies the PEP-dependent EI-HPr-EIIA(Fru) relay; the review
      proposes a PTS EIIA-to-EIIB phosphotransferase activity term for the
      FruB-to-FruA handoff.
  - source_id: file:XANCP/fruB/fruB-ai-review.yaml
    title: XANCP fruB gene review
    statement: >-
      P45597 grounds the same fused relay in Xanthomonas campestris; the
      root-node N-acetylglucosamine transport IBA is removed there.
  - source_id: file:PSEPK/fruA/fruA-ai-review.yaml
    title: PSEPK fruA gene review
    statement: Q88PQ3 supplies the membrane EIIB-EIIC fructose transport-phosphorylation step.
  - source_id: file:ECOLI/fruA/fruA-ai-review.yaml
    title: ECOLI fruA gene review
    statement: >-
      P20966 grounds the fructose-specific EIIB'BC permease step with
      experimental transport and phosphorylation evidence.
  - source_id: file:PSEPK/fruK/fruK-ai-review.yaml
    title: PSEPK fruK gene review
    statement: Q88PQ4 supplies 1-phosphofructokinase activity in the fruBKA locus.
  - source_id: file:ECOLI/fruK/fruK-ai-review.yaml
    title: ECOLI fruK gene review
    statement: >-
      P0AEW9 grounds the 1-phosphofructokinase step with purified-enzyme
      evidence for fructose 1-phosphate specificity.
  - source_id: file:interpro/panther/PTHR46244/PTHR46244-review.yaml
    title: PTHR46244 family review
    statement: >-
      Phosphoenolpyruvate-protein phosphotransferase activity is safe family-wide;
      the fused fructose relay proteins sit in SF6 with sugar-PTS enzyme I.
  - source_id: file:interpro/panther/PTHR30505/PTHR30505-review.yaml
    title: PTHR30505 family review
    statement: >-
      Phosphocysteine-dependent sugar transport is family-wide, but fructose
      specificity is mixed with mannose and mannosyl-glycerate permeases and is
      left unresolved at the family level.
  - source_id: file:interpro/panther/PTHR46566/PTHR46566-review.yaml
    title: PTHR46566 family review
    statement: >-
      SF5 holds FruK together with tagatose-6-phosphate kinases, so
      1-phosphofructokinase activity is judged per member rather than from the
      subfamily id.
  - source_id: file:bacterial_fructose_pts_catabolism-deep-research-openscientist.md
    title: OpenScientist module deep research
    statement: >-
      The OpenScientist report supplied the initial outline and candidate
      members; every structural claim was checked against the gene reviews and
      literature above.
notes: >-
  Boundary and architecture. The module is defined by the fused relay: one
  cytoplasmic FruB polypeptide carries enzyme I, HPr and EIIA(Fru) domains and
  phosphorylates the FruA EIIB domain directly. The fused protein is documented
  experimentally in Pseudomonas putida KT2440 and Xanthomonas campestris; E. coli
  instead uses enzyme I (PtsI) with the EIIA-HPr diphosphoryl transfer protein
  FPr, and that split-relay route is modelled by the sibling module
  fructose_pts_uptake_and_catabolism, which shares the permease and kinase
  steps. E. coli FruA and FruK are used here only as experimentally
  characterized exemplars of those shared steps. The previous four-part draft
  split the PEP entry reaction from the intramolecular EI-to-HPr-to-EIIA relay;
  the relay is now described within the FruB step because it happens inside one
  polypeptide and GO has no activity term for it. GO also lacks a term for the
  EIIA-to-EIIB phosphotransfer at the FruB-to-FruA handoff; the FruB gene
  reviews propose "PTS EIIA-to-EIIB phosphotransferase activity" for it.
  Family scope. The FruA and FruK family groundings (PTHR30505 and
  PTHR46566:SF5) report FAMILY_FUNCTION_UNREVIEWED by design: their family
  reviews leave the fructose-specific terms UNRESOLVED because fructose
  permeases and 1-phosphofructokinases share those PANTHER (sub)families with
  mannose, mannosyl-glycerate and tagatose-phosphate specificities, and no
  specificity-determining site is curated. The module relies on its reviewed
  representatives for those steps, and the two FruA exemplars fall in different
  PTHR30505 subfamilies (SF0, SF32), so no single subfamily can be used. PAINT
  node PTN001317471, which another branch attaches to the FruK step, is not used
  as an ancestral node: it asserts substrate-generic phosphofructokinase
  activity (GO:0008443), is co-seeded by PfkB 6-phosphofructokinases, and its
  inheritance below the seeds is unresolved in the PTHR46566 review.
module:
  id: bacterial_fructose_pts_catabolism
  label: Bacterial fused-relay fructose PTS uptake and catabolism
