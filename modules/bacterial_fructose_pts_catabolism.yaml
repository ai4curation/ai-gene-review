      term:
        id: GO:0009401
        label: phosphoenolpyruvate-dependent sugar phosphotransferase system
      description: PEP-driven protein phosphorelay coupled to fructose uptake and phosphorylation.
    - preferred_term: fructose catabolic process
      term:
        id: GO:0006001
        label: fructose catabolic process
      description: Conversion of imported fructose to fructose 1,6-bisphosphate.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: PEP-dependent phosphorylation and intramolecular relay of the fused FruB protein
      node:
        id: frub_phosphorelay
        label: FruB fused EI-HPr-EIIA phosphorelay
        module_type: REACTION
        annotons:
          - id: frub_pep_phosphotransferase_activity
            label: FruB phosphoenolpyruvate-protein phosphotransferase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: fused fructose PTS multiphosphoryl transfer proteins (with sugar-PTS enzyme I)
                term:
                  id: PANTHER:PTHR46244:SF6
                  label: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
                representative_members:
                  - preferred_term: FruB (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PQ5
                      label: Phosphoenolpyruvate-protein phosphotransferase
                  - preferred_term: FruB (Xanthomonas campestris pv. campestris)
                    term:
                      id: UniProtKB:P45597
                      label: Multiphosphoryl transfer protein
            function:
              preferred_term: phosphoenolpyruvate-protein phosphotransferase activity
              term:
                id: GO:0008965
                label: phosphoenolpyruvate-protein phosphotransferase activity
              substrates:
                - preferred_term: phosphoenolpyruvate
                - preferred_term: FruB enzyme I domain histidine
              products:
                - preferred_term: pyruvate
                - preferred_term: phosphorylated FruB enzyme I domain histidine
              evidence:
                - source_id: RHEA:23880
                  title: phosphoenolpyruvate-protein phosphotransferase reaction
                  statement: >-
                    Rhea 23880 defines phosphate transfer from
                    phosphoenolpyruvate to a protein histidine.
            processes:
              - preferred_term: phosphoenolpyruvate-dependent sugar phosphotransferase system
                term:
                  id: GO:0009401
                  label: phosphoenolpyruvate-dependent sugar phosphotransferase system
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              The enzyme I domain autophosphorylates from phosphoenolpyruvate
              (GO:0008965), then passes the phosphoryl group within the same
              polypeptide through its HPr domain to its EIIA(Fru) domain, which
              phosphorylates the EIIB domain of FruA. GO has no term for the
              internal relay or for the EIIA-to-EIIB handoff; the FruB gene
              reviews propose "PTS EIIA-to-EIIB phosphotransferase activity".
    - order: 2
      role: fructose uptake coupled to fructose 1-phosphate formation
      node:
        id: fructose_pts_transport_phosphorylation
        label: FruA fructose transport and phosphorylation
        module_type: REACTION
        annotons:
          - id: frua_transport_phosphorylation_activity
            label: FruA fructose-specific EIIB'BC activity
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
                term:
                  id: GO:0022877
                  label: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
              family:
                preferred_term: fructose-family PTS EIIB-EIIC permeases
                term:
                  id: PANTHER:PTHR30505
                  label: FRUCTOSE-LIKE PERMEASE
                representative_members:
                  - preferred_term: FruA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PQ3
                      label: Protein-N(pi)-phosphohistidine--D-fructose phosphotransferase
                  - preferred_term: FruA (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P20966
                      label: PTS system fructose-specific EIIB'BC component
            function:
              preferred_term: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
              term:
                id: GO:0022877
                label: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
              substrates:
                - preferred_term: D-fructose (outside)
                - preferred_term: phosphorylated FruB EIIA(Fru) histidine
              products:
                - preferred_term: D-fructose 1-phosphate (inside)
                - preferred_term: unphosphorylated FruB EIIA(Fru) histidine
              evidence:
                - source_id: RHEA:49252
                  title: PTS fructose transport-phosphorylation reaction
                  statement: >-
                    Rhea 49252 defines coupled import of D-fructose and its
                    phosphorylation to intracellular D-fructose 1-phosphate by
                    a phospho-histidine protein donor.
                - source_id: file:ECOLI/fruA/fruA-ai-review.yaml
                  statement: >-
                    The E. coli fruA review accepts the fructose-specific
                    EIIB'BC transporter activity for P20966.
            processes:
              - preferred_term: fructose import across plasma membrane
                term:
                  id: GO:1990539
                  label: fructose import across plasma membrane
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              FruA receives phosphate on its EIIB cysteine from the FruB EIIA
              histidine and transfers it to fructose as EIIC moves the sugar
              into the cell, releasing fructose 1-phosphate in the cytoplasm.
    - order: 3
      role: fructose 1-phosphate conversion to fructose 1,6-bisphosphate
      node:
        id: fructose_1_phosphate_kinase_reaction
        label: Fructose 1-phosphate phosphorylation
        module_type: REACTION
        annotons:
          - id: fruk_activity
            label: FruK 1-phosphofructokinase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: 1-phosphofructokinase (FruK) clade of the PfkB kinases
                term:
                  id: PANTHER:PTHR46566:SF5
                  label: 1-PHOSPHOFRUCTOKINASE
                representative_members:
                  - preferred_term: FruK (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PQ4
                      label: 1-phosphofructokinase
                  - preferred_term: FruK (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0AEW9
                      label: 1-phosphofructokinase
            function:
              preferred_term: 1-phosphofructokinase activity
              term:
                id: GO:0008662
                label: 1-phosphofructokinase activity
              substrates:
                - preferred_term: beta-D-fructose 1-phosphate
                - preferred_term: ATP
              products:
                - preferred_term: beta-D-fructose 1,6-bisphosphate
                - preferred_term: ADP
                - preferred_term: proton
              evidence:
                - source_id: RHEA:14213
                  title: 1-phosphofructokinase reaction
                  statement: >-
                    Rhea 14213 defines ATP-dependent phosphorylation of
                    beta-D-fructose 1-phosphate.
                - source_id: file:ECOLI/fruK/fruK-ai-review.yaml
                  statement: >-
                    The E. coli fruK review accepts 1-phosphofructokinase
                    activity for P0AEW9.
            processes:
              - preferred_term: fructose catabolic process
                term:
                  id: GO:0006001
                  label: fructose catabolic process
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Converts the fructose 1-phosphate released by FruA into fructose
