  connections:
    - source: frub_phosphorelay
      target: fructose_pts_transport_phosphorylation
      connection_type: PROVIDES_INPUT_FOR
      description: Phosphorylated FruB EIIA(Fru) donates phosphate to the FruA EIIB domain.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        The intermediate is a protein phosphohistidine, not a CoA metabolite;
        KT2440 genetics show FruB is required to phosphorylate FruA.
    - source: fructose_pts_transport_phosphorylation
      target: fructose_1_phosphate_kinase_reaction
      connection_type: PROVIDES_INPUT_FOR
      description: FruA-produced fructose 1-phosphate is the FruK substrate.
      chaining_status: VERIFIED
      chaining_note: >-
        RHEA:49252 yields D-fructose 1-phosphate and RHEA:14213 consumes
