      connection_type: PROVIDES_INPUT_FOR
      description: Phosphorylated FruB donates phosphate to the FruA EIIB domain.
      chaining_status: VERIFIED
      chaining_note: Direct KT2440 phosphotransfer genetics supports FruB-to-FruA coupling.
    - source: fructose_pts_transport_phosphorylation
      target: fructose_1_phosphate_kinase_reaction
      connection_type: PROVIDES_INPUT_FOR
      description: FruA-produced beta-D-fructose 1-phosphate is the FruK substrate.
      chaining_status: VERIFIED
      chaining_note: The fruBKA locus and exact reactions establish the metabolite handoff.
  knowledge_gaps:
    - gap_statement: >-
        GO lacks a molecular-function term for phosphate transfer from a fructose-PTS
        EIIA histidine to the cognate EIIB phosphocysteine at the FruB-to-FruA handoff.
      boundary: >-
        The un-termed FruB internal-relay annoton and the part-2-to-part-3 connection
        preserve this step; the corresponding PSEPK FruB gene review proposes an
        EIIA-to-EIIB phosphotransferase activity term.
      gap_kind:
        - ONTOLOGY
