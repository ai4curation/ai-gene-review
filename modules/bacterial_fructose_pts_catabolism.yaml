id: MODULE:bacterial_fructose_pts_catabolism
title: Bacterial fused-relay fructose PTS uptake and catabolism
description: >-
  A reusable bacterial fused-relay module coupling phosphoenolpyruvate-driven phosphorelay,
  fructose translocation with phosphorylation to fructose 1-phosphate, and
  ATP-dependent production of fructose 1,6-bisphosphate. This implementation
  requires a fused EI-HPr-EIIA FruB protein and an EIIB'BC FruA transporter
  with two EIIB-type domains plus EIIC. Nitrogen-related PTS signaling and metabolism
  downstream of fructose 1,6-bisphosphate are outside the module boundary.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:18296519
    title: Evidence of in vivo cross talk between the nitrogen-related and fructose-related branches of the carbohydrate phosphotransferase system of Pseudomonas putida.
    statement: >-
      KT2440 genetics and phosphotransfer analysis establish FruB and FruA as a
      complete fructose-intake PTS and define their fused relay architecture.
  - source_id: PMID:27933319
    title: A Metabolic Widget Adjusts the Phosphoenolpyruvate-Dependent Fructose Influx in Pseudomonas putida.
    statement: >-
      The KT2440 fruBKA locus supplies cytosolic FruB, membrane FruA, and FruK
      for fructose uptake and fructose 1-phosphate metabolism.
  - source_id: UniProtKB:Q88PQ5
    title: Pseudomonas putida KT2440 FruB
    statement: Q88PQ5 is the exact PSEPK EI-HPr-EIIA phosphorelay exemplar.
  - source_id: UniProtKB:Q88PQ3
    title: Pseudomonas putida KT2440 FruA
    statement: Q88PQ3 is the exact PSEPK fructose-specific EIIB'BC exemplar.
  - source_id: UniProtKB:Q88PQ4
    title: Pseudomonas putida KT2440 FruK
    statement: Q88PQ4 is the exact PSEPK 1-phosphofructokinase exemplar.
  - source_id: file:PSEPK/fruB/fruB-ai-review.yaml
    title: Curated PSEPK FruB gene review
    statement: >-
      The review proposes a missing EIIA-to-EIIB phosphotransferase activity term
      for the FruB-to-FruA handoff.
notes: >-
  FruB architecture varies across bacteria. This module is explicitly the
  fused EI-HPr-EIIA implementation represented by P. putida KT2440 and
  Xanthomonas campestris; split-relay fructose PTS systems require a separate
  architectural variant. The completed OpenScientist report records the initial
  three-part outline; final curation produced four parts by separating PEP entry
  from the internal FruB relay.
module:
  id: bacterial_fructose_pts_catabolism
  label: Bacterial fused-relay fructose PTS uptake and catabolism
  module_type: METABOLIC_PATHWAY
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: phosphoenolpyruvate-dependent phosphorylation of fused FruB
      node:
        id: frub_pep_entry_reaction
        label: FruB phosphoenolpyruvate entry reaction
        module_type: REACTION
        annotons:
          - id: frub_pep_phosphotransferase_activity
            label: FruB phosphoenolpyruvate-protein phosphotransferase activity
            participant:
              selector_type: FAMILY
              family:
                preferred_term: fused fructose PTS EI-HPr-EIIA family
                term:
                  id: PANTHER:PTHR46244:SF6
                  label: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
                representative_members:
                  - preferred_term: FruB (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PQ5
                      label: Phosphoenolpyruvate-protein phosphotransferase
                  - preferred_term: FruB (Xanthomonas campestris pv. campestris)
                    term:
                      id: UniProtKB:P45597
                      label: Multiphosphoryl transfer protein
            function:
              preferred_term: phosphoenolpyruvate-protein phosphotransferase activity
              term:
                id: GO:0008965
                label: phosphoenolpyruvate-protein phosphotransferase activity
              substrates:
                - preferred_term: phosphoenolpyruvate
                - preferred_term: unphosphorylated FruB EI histidine
              products:
                - preferred_term: pyruvate
                - preferred_term: phosphorylated FruB EI histidine
            role_description: >-
              GO:0008965 covers phosphate entry from phosphoenolpyruvate to
              the FruB EI histidine (RHEA:23880), not the complete internal relay.
    - order: 2
      role: internal FruB EI-to-HPr-to-EIIA phosphorelay
      node:
        id: frub_internal_phosphorelay
        label: Internal fused FruB phosphorelay
        module_type: REACTION
        annotons:
          - id: frub_internal_relay_activity
            label: FruB internal multiphosphoryl transfer
            participant:
              selector_type: FAMILY
              family:
                preferred_term: fused fructose PTS EI-HPr-EIIA family
                term:
                  id: PANTHER:PTHR46244:SF6
                  label: PHOSPHOENOLPYRUVATE-PROTEIN PHOSPHOTRANSFERASE
                representative_members:
                  - preferred_term: FruB (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PQ5
                      label: Phosphoenolpyruvate-protein phosphotransferase
                  - preferred_term: FruB (Xanthomonas campestris pv. campestris)
                    term:
                      id: UniProtKB:P45597
                      label: Multiphosphoryl transfer protein
            function:
              preferred_term: intramolecular EI-to-HPr-to-EIIA phosphorelay
              substrates:
                - preferred_term: phosphorylated FruB EI histidine
                - preferred_term: unphosphorylated FruB HPr and EIIA domains
              products:
                - preferred_term: unphosphorylated FruB EI and HPr domains
                - preferred_term: phosphorylated FruB EIIA histidine
            role_description: >-
              The fused HPr and EIIA domains relay phosphate from the
              phosphorylated EI domain to the FruA EIIB phosphoacceptor. No
              existing GO molecular-function term captures this full internal relay;
              the curated FruB gene review proposes the narrower EIIA-to-EIIB
              phosphotransferase activity needed at the FruB-to-FruA handoff.
    - order: 3
      role: fructose uptake coupled to fructose 1-phosphate formation
      node:
        id: fructose_pts_transport_phosphorylation
        label: Fructose PTS transport and phosphorylation
        module_type: REACTION
        annotons:
          - id: frua_transport_phosphorylation_activity
            label: FruA fructose-specific EIIB'BC activity
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
                term:
                  id: GO:0022877
                  label: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
              family:
                preferred_term: fructose-specific PTS EIIB-EIIC family
                term:
                  id: PANTHER:PTHR30505
                  label: FRUCTOSE-LIKE PERMEASE
                representative_members:
                  - preferred_term: FruA (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88PQ3
                      label: Protein-N(pi)-phosphohistidine--D-fructose phosphotransferase
                  - preferred_term: FruA (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P20966
                      label: PTS system fructose-specific EIIB'BC component
            function:
              preferred_term: fructose phosphotransferase system transporter activity
              term:
                id: GO:0022877
                label: protein-N(PI)-phosphohistidine-fructose phosphotransferase system transporter activity
              substrates:
                - preferred_term: extracellular fructose
                - preferred_term: phosphorylated FruB EIIA histidine
              products:
