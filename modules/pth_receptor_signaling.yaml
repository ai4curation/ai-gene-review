                statement: >-
                  GRK2, but not GRK3, enhances PTH-stimulated phosphorylation of the PTH
                  receptor, on the same residues used by the endogenous kinase.
                supporting_text: >-
                  Overexpression of GRK2, but not GRK3, enhanced PTH-stimulated receptor
                  phosphorylation
            gocam_associations:
