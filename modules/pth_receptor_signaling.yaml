                      id: UniProtKB:O14745
                      label: Na(+)/H(+) exchange regulatory cofactor NHE-RF1
                  - preferred_term: NHERF2 (SLC9A3R2)
                    term:
                      id: UniProtKB:Q15599
                      label: Na(+)/H(+) exchange regulatory cofactor NHE-RF2
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
              targets:
                - preferred_term: PTH1R carboxy-terminal PDZ-binding motif
                  term:
                    id: UniProtKB:Q03431
                    label: Parathyroid hormone/parathyroid hormone-related peptide receptor
            processes:
              - preferred_term: positive regulation of phospholipase C-activating G protein-coupled receptor signaling pathway
                term:
                  id: GO:1900738
                  label: positive regulation of phospholipase C-activating G protein-coupled receptor signaling pathway
              - preferred_term: negative regulation of adenylate cyclase-activating G protein-coupled receptor signaling pathway
                term:
                  id: GO:0106072
                  label: negative regulation of adenylate cyclase-activating G protein-coupled receptor signaling pathway
            locations:
              - preferred_term: apical plasma membrane
                term:
                  id: GO:0016324
                  label: apical plasma membrane
            role_description: >-
              Tether PTH1R and phospholipase C beta 1 side by side, switching the receptor's
              output from cAMP toward calcium.
            evidence:
              - source_id: PMID:12075354
                statement: >-
                  NHERF2 binds PLC beta 1 and the PTH1R carboxy-terminal PDZ motif; in cells with
                  the complex, PTH activates PLC beta and inhibits adenylyl cyclase through Gi/o.
                supporting_text: >-
                  PTH treatment of cells that express the NHERF2 PTH1R complex markedly
                  activates phospholipase C beta and inhibits adenylyl cyclase through
                  stimulation of inhibitory G proteins (G(i/o) proteins).
              - source_id: PMID:20843475
                statement: >-
                  NHERF1/EBP50 confers PTH-stimulated calcium signalling on cells that otherwise
                  respond only with cAMP.
                supporting_text: >-
                  In contrast, PTHrP(1-36) induced both cAMP and calcium signaling in A10 cells
                  over-expressing EBP50.
          - id: ezrin_anchor
            label: Ezrin FERM-domain anchoring of PTH1R and NHERF1
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: EZR (ezrin)
                term:
                  id: UniProtKB:P15311
                  label: Ezrin
            function:
              preferred_term: protein domain specific binding
              term:
                id: GO:0019904
                label: protein domain specific binding
              targets:
                - preferred_term: PTH1R carboxy-terminal tail
                  term:
                    id: UniProtKB:Q03431
                    label: Parathyroid hormone/parathyroid hormone-related peptide receptor
                - preferred_term: NHERF1
                  term:
                    id: UniProtKB:O14745
                    label: Na(+)/H(+) exchange regulatory cofactor NHE-RF1
            locations:
              - preferred_term: apical plasma membrane
                term:
                  id: GO:0016324
                  label: apical plasma membrane
            role_description: >-
              Actin-membrane linker binding the PTH1R FERM site and NHERF1; supports apical
