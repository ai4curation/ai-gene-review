        annotons:
          - id: pth_grk2
            label: GRK2 phosphorylation of PTH1R
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GRK2
                term:
                  id: UniProtKB:P25098
                  label: G protein-coupled receptor kinase 2
            function:
              preferred_term: G protein-coupled receptor kinase activity
              term:
                id: GO:0004703
                label: G protein-coupled receptor kinase activity
              targets:
                - preferred_term: PTH1R
                  term:
                    id: UniProtKB:Q03431
                    label: Parathyroid hormone/parathyroid hormone-related peptide receptor
