        module_type: REGULATORY_STEP
        description: >-
          PDZ scaffolds bound to the PTH1R carboxy-terminal motif, linked to actin through
          ezrin. The complex biases the receptor toward phospholipase C signalling and away
          from adenylyl cyclase, and in renal proximal tubule it holds the receptor apically.
