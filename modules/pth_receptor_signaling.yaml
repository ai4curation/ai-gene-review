                        term:
                          id: GO:0005886
                          label: plasma membrane
                    role_description: >-
                      Stimulatory G alpha subunit; added to RGD's gene list because the Gs step
                      cannot be modelled without it.
                    gocam_associations:
                      - model: gomodel:67c10cc400004508
                        activity: gomodel:67c10cc400004508/67c10cc400004511
                        title: PTH1R-mediated signaling via G-alpha-s following activation by parathyroid hormone (PTH) (Human).
                        description: Same gene and molecular function (GO:0003925), between PTH1R and ADCY6.
