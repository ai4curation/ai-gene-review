            evidence:
              - source_id: PMID:19608645
                statement: >-
                  Ezrin binds the PTH1R carboxy-terminal tail directly, and dominant-negative
                  ezrin selectively disrupts apical PTH1R expression and signalling.
                supporting_text: >-
                  Expression of a dominant-negative ezrin selectively disrupts apical expression
                  and signaling of the PTH1R.
    - order: 6
      role: receptor desensitization (termination)
      node:
        id: pth_termination
        label: GRK2 phosphorylation and beta-arrestin desensitization of PTH1R
        module_type: REGULATORY_STEP
        description: >-
          GRK2 phosphorylates serines in the PTH1R cytoplasmic tail of the agonist-occupied
          receptor; beta-arrestins bind it, block G protein coupling and drive
          dynamin-dependent endocytosis. Phosphorylation is required for the uncoupling step,
