                label: Gq/11 route (phospholipase C beta)
                description: >-
                  Included by reference to the PLC beta step of the generic
                  Gq-PLC-calcium-PKC module; the downstream IP3/calcium and DAG/PKC steps are
                  in that module.
                module_ref: gpcr_plc_calcium_pkc_signaling#plc_beta_activation
    - order: 3
      role: adenylyl cyclase produces cAMP
      node:
        id: pth_adenylyl_cyclase
        label: Adenylyl cyclase produces cAMP
        description: >-
          Included by reference to the adenylyl cyclase step of the generic Gs-cAMP-PKA
          module; RGD names no cyclase isoform (the PTH1R GO-CAM uses ADCY6).
        module_ref: gpcr_camp_pka_signaling#adenylyl_cyclase_activation
    - order: 4
      role: PKA activation and output
      node:
        id: pth_pka
        label: PKA activation and substrate phosphorylation
        description: >-
          Included by reference to the PKA/CREB step of the generic Gs-cAMP-PKA module. The
          renal phosphate-transport and bone outputs of PKA are outside this module.
        module_ref: gpcr_camp_pka_signaling#pka_creb_output
