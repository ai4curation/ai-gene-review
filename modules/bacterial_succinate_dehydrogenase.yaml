id: MODULE:bacterial_succinate_dehydrogenase
title: Bacterial succinate dehydrogenase complex and SdhE-dependent maturation
description: >-
  Reusable bacterial module for respiratory complex II, the membrane-bound
  succinate:quinone oxidoreductase that connects the tricarboxylic acid cycle to
  the respiratory quinone pool without pumping protons. The SdhA flavoprotein
  oxidizes succinate to fumarate, SdhB relays electrons through iron-sulfur
  centers, and SdhC/SdhD form the membrane anchor and quinone-reduction domain.
  A separate SdhE maturation step promotes covalent FAD attachment to SdhA.
  This module excludes the paralogous fumarate reductase system and
  mitochondrial-lineage assembly factors that are not part of the conserved
  bacterial realization.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: RHEA:40523
    title: succinate:quinone oxidoreductase reaction
    statement: >-
      The bacterial SdhABCD holoenzyme couples succinate oxidation to fumarate
      with quinone reduction to quinol.
  - source_id: file:PSEPK/sdhA/sdhA-ai-review.yaml
    title: PSEPK SdhA review
    statement: >-
      Q88FA7 is the covalently flavinylated succinate-oxidizing subunit of the
      P. putida KT2440 SdhABCD complex.
  - source_id: file:PSEPK/sdhB/sdhB-ai-review.yaml
    title: PSEPK SdhB review
    statement: >-
      Q88FA8 is the iron-sulfur electron-transfer subunit of the complex.
  - source_id: file:PSEPK/sdhC/sdhC-ai-review.yaml
    title: PSEPK SdhC review
    statement: >-
      Q88FA5 is the cytochrome b556 membrane-anchor subunit.
  - source_id: file:PSEPK/sdhD/sdhD-ai-review.yaml
    title: PSEPK SdhD review
    statement: >-
      Q88FA6 is the hydrophobic membrane-anchor subunit that partners SdhC.
  - source_id: file:PSEPK/sdhE/sdhE-uniprot.txt
    title: UniProtKB entry for PSEPK SdhE
    statement: >-
      Q88MZ4 is the conserved FAD assembly factor that promotes covalent FAD
      attachment to SdhA.
notes: >-
  The P. putida KT2440 structural complex is encoded by the compact sdhCDAB
  locus PP_4193-PP_4190. SdhE/PP_1424 is encoded elsewhere and is a maturation
  factor rather than a stoichiometric holoenzyme subunit. The complete
  succinate:quinone oxidoreductase activity is an emergent property of SdhABCD;
  individual subunits contribute distinct catalytic, relay, or anchoring roles.
