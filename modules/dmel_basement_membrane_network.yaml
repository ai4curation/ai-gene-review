id: MODULE:dmel_basement_membrane_network
title: Basement membrane laminin and collagen network in Drosophila melanogaster
description: >-
  Basement membranes are sheet-like extracellular matrices beneath epithelia and around muscles
  and organs. Their two self-assembling networks are made of laminin and type IV collagen.
  Drosophila has two laminin trimers, each made of one alpha chain (LanA or Wing blister)
  with the shared beta (LanB1) and gamma (LanB2) chains; laminins polymerise at the cell surface
  and initiate basement membrane assembly. Type IV collagen trimers of Col4a1 and Viking are
  made mainly by the fat body and hemocytes and then incorporated into basement membranes,
  where they form a cross-linked network that gives strength and shapes organs. Multiplexin
  (the collagen XV/XVIII homolog) and Pericardin (a collagen IV-like protein of the cardiac
  extracellular matrix) are additional collagens grouped with them.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001185
  title: 'FlyBase gene group COL: Collagens'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as collagens (COL); this module
    models that group.
- source_id: FB:FBgg0001190
  title: 'FlyBase gene group LMN: Laminins'
  statement: >-
    FlyBase release FB2026_03 groups 4 D. melanogaster genes as laminins (LMN); this module
    models that group.
- source_id: GO:0005604
  title: basement membrane
  statement: >-
    GO term grounding the module as basement membrane.
notes: >-
  Boundary. The module joins the FlyBase collagen and laminin groups. Other core basement
  membrane components, perlecan (trol), nidogen (Ndg) and SPARC, are not in these groups and
  are not added; the collagen IV cross-linking peroxidasin (Pxn) and the collagen-processing
  enzymes are also outside the module. The laminin alpha-chain composition is shown as two
  variants that share LanB1 and LanB2. Pericardin is grouped by FlyBase as a collagen and
  is found mainly in the cardiac and pericardial matrix rather than in all basement membranes.
  The connection from laminin to collagen IV summarises the assembly order shown for Drosophila
  embryos and is not a metabolic step. FlyBase groups realized by this module: COL (FBgg0001185),
  LMN (FBgg0001190). Participants were generated from the FlyBase gene-group membership and
  mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_basement_membrane_network.yaml;
  none of the member genes has a gene review yet unless noted.
