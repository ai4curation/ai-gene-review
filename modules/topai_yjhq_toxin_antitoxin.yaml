id: MODULE:topai_yjhq_toxin_antitoxin
title: TopAI-YjhQ toxin-antitoxin neutralization
description: >-
  A protein-sequestration module for the Escherichia coli topAI-yjhQ
  toxin-antitoxin pair in which YjhQ acts as the antitoxin for TopAI/YjhX.
  YjhQ binding neutralizes TopAI toxicity and relieves TopAI-mediated
  inhibition of topoisomerase I. YjhQ's predicted GNAT-family acetyltransferase
  chemistry remains substrate-unknown and is outside this toxin-sequestering
  module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0097351
    title: toxin sequestering activity
    statement: Defines the protein-binding antitoxin activity of YjhQ.
  - source_id: file:genes/ECOLI/yjhQ/yjhQ-ai-review.yaml
    title: ECOLI yjhQ gene review
    statement: >-
      The completed E. coli yjhQ review grounds YjhQ as the antitoxin that
      sequesters TopAI/YjhX.
  - source_id: PMID:26553797
    title: An endogenous protein inhibitor, YjhX (TopAI), for topoisomerase I from Escherichia coli.
    statement: >-
      Establishes the topAI-yjhQ pair, YjhQ neutralization of TopAI toxicity,
      and physical TopAI-YjhQ interaction.
    supporting_text: >-
      co-induction of YjhQ in the presence of 0.2% arabinose with TopAI in
      the presence of 0.1 mM IPTG neutralized the toxicity of TopAI indicating
      that the overproduction of TopAI is toxic to the cells, while YjhQ is the
      antitoxin for TopAI
  - source_id: PMID:26553797
    title: An endogenous protein inhibitor, YjhX (TopAI), for topoisomerase I from Escherichia coli.
    statement: >-
      Shows that YjhQ physically complexes with TopAI and relieves TopAI
      inhibition of topoisomerase I.
    supporting_text: >-
      PrS2-YjhQ was pulled down with PrS-TopAI (Figure 1B; lanes 9 and 10) but
      not with PrS (Figure 1B; lanes 4 and 5), indicating that TopAI toxin
      interacts with YjhQ antitoxin in a manner similar to that of other TA
      systems.
notes: >-
  TopAI/YjhX is modeled only at the TopAI-YjhQ boundary needed to describe the
  reviewed YjhQ antitoxin; a full TopAI/topoisomerase-I inhibition review should
  wait for dedicated TopAI curation.
