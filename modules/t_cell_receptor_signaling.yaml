          - id: cd45_phosphatase
            label: CD45 receptor tyrosine phosphatase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PTPRC
                term:
                  id: UniProtKB:P08575
                  label: Receptor-type tyrosine-protein phosphatase C
            function:
              preferred_term: protein tyrosine phosphatase activity
              term:
                id: GO:0004725
                label: protein tyrosine phosphatase activity
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
