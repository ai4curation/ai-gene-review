                term:
                  id: GO:0033173
                  label: calcineurin-NFAT signaling cascade
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Ca2+/calmodulin-activated phosphatase that dephosphorylates NFAT
              and exposes its nuclear localization signals.
          - id: nfatc1_tf
            label: NFATC1 transcription factor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NFATC1
                term:
                  id: UniProtKB:O95644
                  label: Nuclear factor of activated T-cells, cytoplasmic 1
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
