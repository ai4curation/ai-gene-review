id: MODULE:t_cell_receptor_signaling
title: T cell receptor signaling pathway module
description: >-
  The proximal T cell receptor (TCR) signaling pathway, from antigen engagement
  at the plasma membrane to calcium/NFAT-driven transcription. Peptide-MHC
  binding by the clonotypic TCR alpha/beta chains is transmitted by the
  invariant CD3 and CD3 zeta subunits, whose ITAMs are phosphorylated by the
  Src-family kinase LCK, carried to the complex by the MHC-matched coreceptor
  (CD4 or CD8) and kept primed by the phosphatase CD45. Doubly phosphorylated ITAMs dock
  the tandem SH2 domains of ZAP70, which LCK then activates. ZAP70
  phosphorylates the transmembrane scaffold LAT and the cytosolic adaptor
  SLP-76 (LCP2), which the adaptor GADS bridges into the TCR signalosome; the
  signalosome recruits PLC gamma 1 and the Tec kinase ITK that activates it.
  PLC gamma 1 hydrolyses PIP2 to IP3 and DAG; IP3-driven calcium entry
  activates calcineurin, which dephosphorylates NFAT so that it enters the
  nucleus and activates target genes. The Ras-MAPK/AP-1 and PKC-theta/NF-kappaB
  branches that also leave the LAT signalosome are outside this module and are
  modelled in their own modules. Leaf molecular functions follow the
  ADAPTIVE_IMMUNITY gene reviews of each member.
status: DRAFT
evidence:
  - source_id: GO:0050852
    title: T cell receptor signaling pathway
    statement: The module is grounded in the GO biological process term for T cell receptor signaling.
  - source_id: gomodel:685de18700002961
    title: T cell receptor signaling (Human).
    statement: >-
      Production GO-CAM covering the receptor-proximal part of the module (TCR
      complex, CD4, LCK, CD3E, CD247 and ZAP70 activities). Its activities are
      linked on the matching annotons below.
  - source_id: file:projects/ADAPTIVE_IMMUNITY.md
    title: Adaptive Immunity project
    statement: >-
      The member gene reviews (CD3D, CD3E, CD3G, CD247, CD4, CD8A, CD8B, LCK,
      PTPRC, ZAP70, LAT, LCP2, GRAP2, ITK, PLCG1, PPP3CA, PPP3CB, PPP3R1,
      NFATC1) are all COMPLETE; each annoton's function is the core
      molecular function chosen in that gene's review.
