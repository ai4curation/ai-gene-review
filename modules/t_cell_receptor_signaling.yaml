  parts:
    - order: 1
      role: Antigen recognition and ITAM presentation
      node:
        id: tcr_cd3_triggering
        label: TCR-CD3 complex antigen recognition
        module_type: REGULATORY_STEP
        description: >-
          The octameric TCR-CD3 complex (TCR alpha/beta with CD3 gamma-epsilon,
          CD3 delta-epsilon and CD3 zeta-zeta) binds peptide-MHC through the
          clonotypic alpha/beta chains and transmits that event across the
          membrane through the ten ITAMs of the invariant CD3 and CD3 zeta
          chains. The receptor activity belongs to the complex: the CD3 chains
          contribute adaptor activity and do not bind antigen themselves.
        annotons:
          - id: tcr_cd3_complex
            label: TCR-CD3 receptor complex
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: alpha-beta T cell receptor complex
                term:
                  id: GO:0042105
                  label: alpha-beta T cell receptor complex
                description: >-
                  The clonotypic TCR alpha and beta chains are encoded by
                  rearranged loci and have no single representative UniProt
                  entry; the invariant signaling subunits are listed as active
                  units.
                active_units:
                  - id: cd3d_unit
                    label: CD3D
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CD3D
                        term:
                          id: UniProtKB:P04234
                          label: T-cell surface glycoprotein CD3 delta chain
                    role: >-
                      ITAM-bearing adaptor subunit (signaling receptor complex
                      adaptor activity) that pairs with CD3E and is needed for
                      complex assembly.
                  - id: cd3e_unit
                    label: CD3E
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CD3E
                        term:
                          id: UniProtKB:P07766
                          label: T-cell surface glycoprotein CD3 epsilon chain
                    role: >-
                      Central ITAM-bearing adaptor subunit of both CD3 dimers;
                      its basic residue-rich sequence recruits LCK and its
                      proline-rich sequence recruits NCK.
                  - id: cd3g_unit
                    label: CD3G
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CD3G
                        term:
                          id: UniProtKB:P09693
                          label: T-cell surface glycoprotein CD3 gamma chain
                    role: >-
                      ITAM-bearing adaptor subunit that pairs with CD3E and
                      carries the di-leucine motif for TCR internalization.
                  - id: cd247_unit
                    label: CD247
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: CD247
                        term:
                          id: UniProtKB:P20963
                          label: T-cell surface glycoprotein CD3 zeta chain
                    role: >-
                      Disulfide-linked zeta homodimer carrying three tandem
                      ITAMs per chain, the main ZAP70 docking platform.
            function:
