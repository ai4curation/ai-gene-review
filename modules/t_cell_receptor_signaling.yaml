    - order: 2
      role: Proximal tyrosine kinase relay
      node:
        id: lck_zap70_relay
        label: LCK and ZAP70 tyrosine kinase activation
        module_type: REACTION
        description: >-
          Coreceptor-associated and free LCK phosphorylates the CD3 and CD3
          zeta ITAMs. ZAP70 docks on doubly phosphorylated ITAMs through its
          tandem SH2 domains, is activated by LCK phosphorylation of its
          interdomain and activation-loop tyrosines, and then phosphorylates
          LAT and SLP-76. ZAP70 cannot phosphorylate ITAMs itself, so the two
          kinases act in sequence.
