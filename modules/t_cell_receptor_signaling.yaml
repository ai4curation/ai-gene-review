    - order: 3
      role: LAT-SLP-76 signalosome assembly
      node:
        id: lat_slp76_signalosome
        label: LAT and SLP-76 signalosome assembly
        module_type: REGULATORY_STEP
        description: >-
          ZAP70-phosphorylated tyrosines on the palmitoylated transmembrane
          scaffold LAT dock PLC gamma 1, GRB2 and GADS; GADS bridges LAT to
          SLP-76, whose own ZAP70-phosphorylated tyrosines recruit VAV1, NCK
          and ITK. The resulting multivalent assembly forms membrane-associated
          condensates at the immunological synapse and positions PLC gamma 1
          for activation by ITK.
        annotons:
          - id: lat_adaptor
            label: LAT transmembrane scaffold
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LAT
                term:
                  id: UniProtKB:O43561
                  label: Linker for activation of T-cells family member 1
            function:
              preferred_term: signaling receptor complex adaptor activity
              term:
                id: GO:0030159
                label: signaling receptor complex adaptor activity
            locations:
              - preferred_term: immunological synapse
                term:
                  id: GO:0001772
                  label: immunological synapse
            role_description: >-
              Phosphotyrosine scaffold that docks PLC gamma 1, GRB2 and GADS and
              nucleates TCR signalosome condensates.
          - id: slp76_adaptor
            label: SLP-76 cytosolic adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LCP2
                term:
                  id: UniProtKB:Q13094
                  label: Lymphocyte cytosolic protein 2
            function:
              preferred_term: signaling adaptor activity
              term:
                id: GO:0035591
                label: signaling adaptor activity
            locations:
