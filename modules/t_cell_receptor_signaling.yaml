                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              GADS-bound adaptor that recruits VAV1, NCK and ITK to the LAT
              signalosome, required for PLC gamma 1 activation.
          - id: gads_adaptor
            label: GADS bridging adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GRAP2
                term:
                  id: UniProtKB:O75791
                  label: GRB2-related adapter protein 2
            function:
              preferred_term: signaling adaptor activity
              term:
