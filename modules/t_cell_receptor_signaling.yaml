                      kinase activity (F:GO:0004713) and plasma-membrane
                      localization in PTHR24418/PTHR24416 kinase families.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002521457 in PTHR24418.
                  - preferred_term: PAINT Src-family signaling node PTN002521528
                    term:
                      id: PANTHER:PTN002521528
                      label: PTN002521528
                    description: >-
                      PANTHER PAINT node in PTHR24418 with IBD support for
                      non-membrane spanning protein tyrosine kinase activity
                      (F:GO:0004715) and signaling receptor binding.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002521528 in PTHR24418.
            function:
              preferred_term: non-membrane spanning protein tyrosine kinase activity
              term:
                id: GO:0004715
                label: non-membrane spanning protein tyrosine kinase activity
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            gocam_associations:
              - model: "685de18700002961"
                activity: gomodel:685de18700002961/685de18700003036
