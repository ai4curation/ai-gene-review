        module_type: REACTION
        description: >-
          LAT-docked PLC gamma 1, phosphorylated by ITK, hydrolyses
          phosphatidylinositol 4,5-bisphosphate to inositol 1,4,5-trisphosphate
          (IP3) and diacylglycerol (DAG). IP3 releases ER calcium and triggers
          store-operated calcium entry; DAG feeds the RasGRP/Ras-MAPK and
          PKC-theta branches modelled elsewhere.
        annotons:
