  connections:
    - source: tcr_cd3_triggering
      target: lck_zap70_relay
      connection_type: CAUSES
      description: TCR-CD3 engagement licenses LCK phosphorylation of ITAMs and ZAP70 recruitment.
    - source: lck_zap70_relay
      target: lat_slp76_signalosome
      connection_type: CAUSES
      description: Activated ZAP70 phosphorylates LAT and SLP-76, which then assemble the signalosome.
    - source: lat_slp76_signalosome
      target: plcg1_second_messengers
      connection_type: CAUSES
      description: The LAT-SLP-76 signalosome recruits PLC gamma 1 and positions it for activation by ITK.
    - source: plcg1_second_messengers
      target: nfat_output
      connection_type: CAUSES
      description: IP3-driven calcium entry activates calcineurin, which releases NFAT into the nucleus.
  notes: >-
    Ontology note: GO has no class-neutral peptide-MHC receptor activity term,
    so the TCR-CD3 complex uses transmembrane signaling receptor activity; the
    production GO-CAM uses MHC class II receptor activity for the CD4 case.
    GO also has no cellular component for the CD8 alpha-beta heterodimer.
