            axis: T cell lineage (MHC class restriction)
            selection: EXACTLY_ONE
            notes: >-
              Conventional alpha-beta T cells use CD4 (MHC class II restricted)
              or CD8 alpha-beta (MHC class I restricted). The coreceptor binds
              the same peptide-MHC as the TCR and brings LCK to the complex; it
              is not a subunit of the TCR complex.
