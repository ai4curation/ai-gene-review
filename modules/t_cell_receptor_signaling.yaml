                  label: Tyrosine-protein kinase ITK/TSK
            function:
              preferred_term: non-membrane spanning protein tyrosine kinase activity
              term:
                id: GO:0004715
                label: non-membrane spanning protein tyrosine kinase activity
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Recruited to phospho-SLP-76 and activated by LCK; phosphorylates
              PLC gamma 1 (Tyr783) to switch on PIP2 hydrolysis.
          - id: plc_gamma_effector
            label: PLC gamma 1
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PLCG1
                term:
                  id: UniProtKB:P19174
                  label: 1-phosphatidylinositol 4,5-bisphosphate phosphodiesterase gamma-1
            function:
              preferred_term: phosphatidylinositol-4,5-bisphosphate phospholipase C activity
              term:
                id: GO:0004435
                label: phosphatidylinositol-4,5-bisphosphate phospholipase C activity
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              Generates IP3 and DAG at the membrane; the same enzyme acts
