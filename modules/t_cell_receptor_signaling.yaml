                representative_members:
                  - preferred_term: ZAP70
                    term:
                      id: UniProtKB:P43403
                      label: Tyrosine-protein kinase ZAP-70
                ancestral_nodes:
                  - preferred_term: PAINT tyrosine kinase node PTN002521457
                    term:
                      id: PANTHER:PTN002521457
                      label: PTN002521457
                    description: >-
                      PANTHER PAINT node with IBD support for protein tyrosine
                      kinase activity (F:GO:0004713).
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PAINT node PTN002521457 in PTHR24418.
            function:
              preferred_term: non-membrane spanning protein tyrosine kinase activity
              term:
                id: GO:0004715
                label: non-membrane spanning protein tyrosine kinase activity
            locations:
