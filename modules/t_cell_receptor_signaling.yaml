    - order: 5
      role: Calcium-NFAT transcriptional output
      node:
        id: nfat_output
        label: Calcineurin-NFAT transcriptional output
        module_type: REGULATORY_STEP
        description: >-
          Sustained cytosolic calcium activates the phosphatase calcineurin,
          which dephosphorylates NFAT proteins and exposes their nuclear
          localization signals. Nuclear NFATC1 binds DNA with AP-1 and other
          partners to activate target genes such as IL2.
        annotons:
