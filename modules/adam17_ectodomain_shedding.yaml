id: MODULE:adam17_ectodomain_shedding
title: iRhom-ADAM17 ectodomain shedding module
description: >-
  Regulated release of the soluble form of a membrane-anchored signalling
  protein by the sheddase ADAM17. Many cytokines, growth factors and receptors
  are made as transmembrane precursors, so for them the appearance of a soluble
  ligand is a proteolytic event rather than a transcriptional one. The module
  covers the whole machine, not just the protease: an iRhom pseudoprotease
  (iRhom2 or iRhom1) binds ADAM17 in the endoplasmic reticulum and escorts it
  out, furin removes the inhibitory prodomain in the trans-Golgi network,
  FRMD8/iTAP holds the mature complex at the cell surface, phosphorylation of
  the cytoplasmic tails licenses cleavage on stimulation, TIMP3 inhibits it, and
  the catalytic step cuts the substrate's juxtamembrane stalk. Without the iRhom
  the protease never matures, which is why a module centred on ADAM17 alone
  would miss where the control lies.
status: DRAFT
scope: ABSTRACT
evidence:
- source_id: PMID:22246777
  statement: Transmembrane signalling proteins are activated by ADAM17 shedding of their
    ectodomain.
  supporting_text: Like many extracellular signaling proteins, TNF is synthesized as a transmembrane
    protein; the active signal is its ectodomain, which is shed from cells after cleavage by an ADAM
    family metalloprotease, ADAM17 (TNFα-converting enzyme, TACE).
- source_id: PMID:29897336
  statement: ADAM17 is the primary sheddase for TNF and the EGF receptor ligands, and works
    in complex with the iRhoms.
  supporting_text: ADAM17, a membrane-tethered metalloprotease, is the primary shedding enzyme responsible
    for the release of the inflammatory cytokine TNFα and several EGF receptor ligands. ADAM17 exists
    in complex with the rhomboid-like iRhom proteins, which act as cofactors that regulate ADAM17 substrate
    shedding.
- source_id: file:human/ADAM17/ADAM17-uniprot.txt
  statement: Curated UniProt function statement for the sheddase.
  supporting_text: Transmembrane metalloprotease which mediates the ectodomain shedding of a myriad
    of transmembrane proteins including adhesion proteins, growth factor precursors and cytokines important
    for inflammation and immunity
notes: >-
  Built for projects/PRODUCTION_TERMS.md, where the curated classification makes
  this the mechanism behind the largest group of production terms after the
  interferons: 7 production terms and 17 regulation terms (TNF, RANKL,
  amphiregulin, fractalkine, CXCL16 and the TNF superfamily parent). Each of
  those terms names an outcome; this module names the machine that produces it.
  Boundary: it starts with ADAM17 biosynthesis and ends with the released
  ectodomain. What the released ligand then does belongs to the receptor's own
  module, and the transcription of the substrate gene is upstream of this module
  rather than part of it. ADAM10 is deliberately not modelled as a variant of
  the protease step: it shares substrates such as fractalkine and CXCL16 but is
  regulated by tetraspanins rather than by iRhoms, so it is a different machine
  and belongs in its own module.
module:
  id: adam17_ectodomain_shedding
  label: iRhom-ADAM17 ectodomain shedding
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Maturation and delivery of the sheddase, then licensing, then cleavage of the
    substrate's stalk. The order matters: the first two parts are why a cell that
    transcribes both protease and substrate can still release nothing.
  concepts:
  - preferred_term: membrane protein ectodomain proteolysis
    term:
      id: GO:0006509
      label: membrane protein ectodomain proteolysis
  context:
    taxa:
    - preferred_term: animals
      term:
        id: NCBITaxon:33208
        label: Metazoa
  parts:
  - order: 1
    role: sheddase maturation and delivery
    node:
      id: adam17_maturation
      label: ADAM17 maturation and delivery to the cell surface
      module_type: TRANSPORT_STEP
      description: >-
        Pro-ADAM17 cannot leave the endoplasmic reticulum on its own. An iRhom
        binds it there and escorts it to the trans-Golgi network, where furin
        removes the prodomain that keeps the catalytic site blocked, and on to the
        plasma membrane. This is the step that makes the iRhoms, rather than
        ADAM17 itself, the point of control.
      knowledge_gaps:
      - gap_statement: >-
          Whether iRhom1 and iRhom2 select different ADAM17 substrates, or only
          differ in which tissues express them, is unsettled.
        boundary: >-
          Affects how the iRhom annoton below is modelled; if the paralogs do
          select different substrates, the family descriptor should become a
          variant set over them.
        gap_kind:
        - BIOLOGY
        status: OPEN
        significance: >-
          Substrate selectivity at the iRhom step would make the iRhoms, rather
          than the protease, the useful target for separating TNF release from
          EGF-ligand release.
        resolution: >-
          Compare the shed substrate repertoire of cells lacking iRhom1, iRhom2
          or both, in a tissue that expresses the two.
        provenance:
        - reference_id: PMID:29897336
          reference_section_type: ABSTRACT
          supporting_text: ADAM17 exists in complex with the rhomboid-like iRhom proteins, which act
            as cofactors that regulate ADAM17 substrate shedding.
      annotons:
      - id: irhom_cargo_receptor
        label: iRhom ADAM17 cargo receptor
        participant:
          selector_type: FAMILY
          family:
            preferred_term: iRhom pseudoprotease
            description: >-
              The catalytically dead rhomboid-family pseudoproteases iRhom2 and
              iRhom1, which bind ADAM17 in the ER membrane and recruit it for
              export. iRhom2 dominates in myeloid cells and is the one TNF release
              depends on; iRhom1 covers other tissues, and losing both is what
              phenocopies loss of ADAM17.
            representative_members:
            - preferred_term: RHBDF2
              term:
                id: UniProtKB:Q6PJF5
                label: Inactive rhomboid protein 2
            - preferred_term: RHBDF1
              term:
                id: UniProtKB:Q96CC6
                label: Inactive rhomboid protein 1
        function:
          preferred_term: cargo receptor activity
          term:
            id: GO:0038024
            label: cargo receptor activity
          description: >-
            Binds ADAM17 as cargo in the endoplasmic reticulum membrane and
            recruits it into the export route. Asserted as the specific claim that
            the iRhom is the receptor for this one cargo, not that it is a general
            export factor.
          targets: &adam17_target
          - preferred_term: ADAM17
            term:
              id: UniProtKB:P78536
              label: Disintegrin and metalloproteinase domain-containing protein 17
        locations:
        - &er_membrane
          preferred_term: endoplasmic reticulum membrane
          term:
            id: GO:0005789
            label: endoplasmic reticulum membrane
        role_description: >-
          Without it the protease stays immature in the ER, so no substrate is
          cleaved however much protease or substrate the cell makes.
        evidence:
        - source_id: PMID:22246777
          statement: iRhom2 binds ADAM17 and promotes its ER exit; without it the protease is
            neither matured by furin nor delivered to the surface.
          supporting_text: iRhom2 binds TACE and promotes its exit from the endoplasmic reticulum. The
            failure of TACE to exit the endoplasmic reticulum in the absence of iRhom2 prevents the furin-mediated
            maturation and trafficking of TACE to the cell surface, the site of TNF cleavage.
        - source_id: Reactome:R-HSA-9662747
          statement: Reactome models iRhom2 as the transporter of ADAM17 from the ER through the
            Golgi to the plasma membrane.
          supporting_text: inactive rhomboid protein 2 (iRHOM2) has been shown to be required for disintegrin
            and metalloproteinase domain-containing protein 17's (ADAM17) exit from the ER

      - id: furin_prodomain_removal
        label: Furin prodomain removal
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: FURIN
            term:
              id: UniProtKB:P09958
              label: Furin
        function:
          preferred_term: serine-type endopeptidase activity
          term:
            id: GO:0004252
            label: serine-type endopeptidase activity
          targets: *adam17_target
          description: Cleaves the ADAM17 prodomain in the trans-Golgi network, leaving the
            catalytically competent protease.
        locations:
        - preferred_term: Golgi membrane
          term:
            id: GO:0000139
            label: Golgi membrane
        role_description: >-
          Converts the zymogen to the active protease. Furin is not dedicated to
          ADAM17 and does the same job for many precursors, so it is a required
          part of this module without being specific to it.
        evidence:
        - source_id: Reactome:R-HSA-9662786
          statement: Furin removes the inhibitory ADAM17 prodomain during transport through the
            trans-Golgi network.
          supporting_text: While ADAM17 is being transported through the trans-Golgi network, FURIN cleaves
            the prodomain region of ADAM17 releasing the inhibitory part
      - id: frmd8_stabilisation
        label: FRMD8/iTAP complex stabilisation
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: FRMD8
            term:
              id: UniProtKB:Q9BZ67
              label: FERM domain-containing protein 8
        function:
          preferred_term: protein-macromolecule adaptor activity
          term:
            id: GO:0030674
            label: protein-macromolecule adaptor activity
          description: Binds the cytoplasmic N-terminus of the iRhoms and holds the iRhom-ADAM17
            complex at the cell surface.
        locations:
        - &plasma_membrane
          preferred_term: plasma membrane
          term:
            id: GO:0005886
            label: plasma membrane
        role_description: >-
          Sets how much mature sheddase survives at the surface: without it the
          complex is degraded through the endolysosomal route and shedding falls.
        evidence:
        - source_id: PMID:29897336
          statement: FRMD8 binds the iRhom N-terminus and is needed to stabilise iRhom and ADAM17
            at the cell surface.
          supporting_text: FRMD8 binds to the cytoplasmic N-terminus of iRhoms and is necessary to stabilise
            iRhoms and ADAM17 at the cell surface. In the absence of FRMD8, iRhom2 and ADAM17 are degraded
            via the endolysosomal pathway, resulting in the reduction of ADAM17-mediated shedding.
        - source_id: PMID:29897333
          statement: Independently identified as iTAP, an iRhom tail-associated protein controlling
            TNF secretion.
          supporting_text: The trafficking of TACE to the cell surface, and stimulation of its proteolytic
            activity, depends on membrane proteins, called iRhoms.
  - order: 2
    role: licensing of the mature sheddase
    optional: true
    node:
      id: sheddase_licensing
      label: Stimulus-dependent licensing of ADAM17
      module_type: REGULATORY_STEP
      description: >-
        Mature surface ADAM17 is not constitutively active. Stimulation leads to
        phosphorylation of the cytoplasmic tails of ADAM17 and of iRhom2, which
        licenses cleavage; this is the step that makes shedding a signal-responsive
        event rather than a constant leak. Marked optional because the module's
        catalytic step can proceed in reconstituted systems without it.
      annotons:
      - id: adam17_tail_phosphorylation
        label: ADAM17 cytoplasmic tail phosphorylation
        participant:
          selector_type: ANY_WITH_FUNCTION
          description: >-
            A stimulus-activated serine/threonine kinase acting on the ADAM17
            cytoplasmic tail; p38 MAP kinase (MAPK14) and PLK2 are the ones
            Reactome models, and which kinase acts varies with the stimulus, so
            the participant is left as a selector rather than named.
          required_function:
            preferred_term: protein serine/threonine kinase activity
            term:
              id: GO:0004674
              label: protein serine/threonine kinase activity
        function:
          preferred_term: protein serine/threonine kinase activity
          term:
            id: GO:0004674
            label: protein serine/threonine kinase activity
          targets: *adam17_target
        locations:
        - &cytosol
          preferred_term: cytosol
          term:
            id: GO:0005829
            label: cytosol
        role_description: Phosphorylates the ADAM17 tail, which is required for shedding of its
          substrates.
        evidence:
        - source_id: Reactome:R-HSA-9662823
          statement: Phosphorylation of the ADAM17 tail at Thr735 and Ser819 is required for
            ectodomain shedding.
          supporting_text: Specifically, the phosphorylation at residues Thr735 (Díaz-Rodríguez et al.
            2002 & Xu and Derynck 2010) and Ser819 is required for ectodomains shedding.
  - order: 3
    role: substrate cleavage
    node:
      id: substrate_cleavage
      label: Cleavage of the substrate ectodomain
      module_type: REACTION
      description: >-
        The catalytic step: ADAM17 cuts the juxtamembrane stalk of a
        membrane-anchored substrate, releasing the soluble ectodomain and leaving
        a membrane stub. The substrate list is broad and is a property of the
        protease, so substrates are recorded on the activity rather than as
        variants of the step.
      annotons:
      - id: adam17_sheddase
        label: ADAM17 sheddase
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: ADAM17
            term:
              id: UniProtKB:P78536
              label: Disintegrin and metalloproteinase domain-containing protein 17
        function:
          preferred_term: metalloendopeptidase activity
          term:
            id: GO:0004222
            label: metalloendopeptidase activity
          description: >-
            Zinc-dependent cleavage of the juxtamembrane stalk of a transmembrane
            substrate. The same active site serves every substrate below, which is
            why no substrate's "production" term names machinery of its own.
          substrates:
          - preferred_term: TNF
            term:
              id: UniProtKB:P01375
              label: Tumor necrosis factor
            description: The founding substrate; membrane TNF is cut to the soluble 17 kDa cytokine.
          - preferred_term: AREG
            term:
              id: UniProtKB:P15514
              label: Amphiregulin
            description: An EGF receptor ligand released on G-protein-coupled receptor stimulation.
          - preferred_term: CX3CL1
            term:
              id: UniProtKB:P78423
              label: Fractalkine
            description: Adhesive while anchored, chemoattractant once released; also an ADAM10 substrate.
          - preferred_term: CXCL16
            term:
              id: UniProtKB:Q9H2A7
              label: C-X-C motif chemokine 16
            description: The other membrane-anchored chemokine; also an ADAM10 substrate.
          - preferred_term: IL6R
            term:
              id: UniProtKB:P08887
              label: Interleukin-6 receptor subunit alpha
            description: Shedding generates the soluble receptor that makes IL-6 trans-signalling possible.
          - preferred_term: SELL
            term:
              id: UniProtKB:P14151
              label: L-selectin
            description: Shedding releases the leukocyte from its adhesive tether.
        locations:
        - *plasma_membrane
        processes:
        - &shedding_process
          preferred_term: membrane protein ectodomain proteolysis
          term:
            id: GO:0006509
            label: membrane protein ectodomain proteolysis
        role_description: >-
          The one activity that every substrate's soluble form depends on. Its
          breadth is the point: it is shared machinery for products that GO gives
          separate production terms.
        evidence:
        - source_id: Reactome:R-HSA-3371385
          statement: ADAM17 cleaves the 26 kDa membrane TNF precursor to the soluble 17 kDa form.
          supporting_text: TNF-α-converting enzyme (TACE or ADAM17) mediates the cleavage of TNF-α generating
            the soluble 17kDa form
        - source_id: PMID:12743035
          statement: GPCR stimulation drives metalloprotease cleavage and release of amphiregulin,
            and blocking TACE prevents it.
          supporting_text: stimulation with the GPCR agonists LPA or carbachol specifically results in
            metalloprotease cleavage and release of amphiregulin (AR)
        - source_id: PMID:18373975
          statement: ADAM10 and ADAM17 are both responsible for cytokine-induced CXCL16 shedding.
          supporting_text: We identified ADAM10 and ADAM17 as being responsible for the cytokine-induced
            shedding of CXCL16.
  - order: 4
    role: inhibition
    optional: true
    node:
      id: timp3_inhibition
      label: TIMP3 inhibition of the sheddase
      module_type: REGULATORY_STEP
      description: >-
        TIMP3 is the endogenous inhibitor that distinguishes ADAM17 from the other
        TIMP targets, and it sets the resting level of shedding; loss of TIMP3
        raises it. Included as the module's brake.
      annotons:
      - id: timp3_inhibitor
        label: TIMP3 metalloendopeptidase inhibitor
        participant:
          selector_type: GENE_PRODUCT
          gene_product:
            preferred_term: TIMP3
            term:
              id: UniProtKB:P35625
              label: Metalloproteinase inhibitor 3
        function:
          preferred_term: metalloendopeptidase inhibitor activity
          term:
            id: GO:0008191
            label: metalloendopeptidase inhibitor activity
          targets: *adam17_target
        locations:
        - preferred_term: extracellular matrix
          term:
            id: GO:0031012
            label: extracellular matrix
        role_description: Binds the ADAM17 active-site cleft and blocks cleavage; the only TIMP
          that inhibits this protease effectively.
        evidence:
        - source_id: PMID:18638486
          statement: TIMP-3 is unique among the TIMPs in effectively inhibiting ADAM17, and binds
            its active-site cleft.
          supporting_text: TIMP-3 (tissue inhibitor of metalloproteinases 3) is unique among the TIMP
            inhibitors, in that it effectively inhibits the TNF-alpha converting enzyme (TACE).
        - source_id: PMID:12743035
          statement: Blocking TACE with TIMP-3 prevents amphiregulin release, tying the inhibitor
            to the catalytic step modelled here.
          supporting_text: blockade of the metalloprotease-disintegrin tumour necrosis factor-alpha-converting
            enzyme (TACE) by the tissue inhibitor of metalloprotease-3
  connections:
  - source: adam17_maturation
    target: sheddase_licensing
    connection_type: PRECEDES
    description: Only the matured, surface-delivered protease can be licensed.
    chaining_status: NOT_APPLICABLE
    chaining_note: A protein-maturation and trafficking chain, not a metabolic one; the CoA
      continuity check does not apply.
  - source: sheddase_licensing
    target: substrate_cleavage
    connection_type: PRECEDES
    description: Tail phosphorylation licenses the catalytic step.
    chaining_status: NOT_APPLICABLE
    chaining_note: Signalling step, not a metabolic one.
  - source: timp3_inhibition
    target: substrate_cleavage
    connection_type: NEGATIVELY_REGULATES
    description: TIMP3 blocks the active site, setting the resting rate of shedding.
