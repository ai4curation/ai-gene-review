notes: >-
  Decomposition. The Sec61 heterotrimer is modelled as three variants that differ in their
  gamma subunit, following FlyBase; Sec61alpha and Sec61beta have no UniProt mapping in the
  FlyBase index and are grounded to FlyBase genes. FlyBase groups only TRAM and Tapdelta as
  translocon-associated proteins; they are modelled as individual proteins and the other TRAP
  subunits are not added. SRP targeting is the separate module dmel_srp_cotranslational_targeting;
  signal peptidase and oligosaccharyltransferase are outside this module. FlyBase groups realized
  by this module: SEC61TC (FBgg0001851), SEC-PF (FBgg0001902), SEC62-63 (FBgg0001920), SEC-T
  (FBgg0001921), SEC-TRAP (FBgg0001922). Subgroups folded into it: SEC61T-CG8860, SEC61T-G2,
  SEC61T-T. Participants were generated from the FlyBase gene-group membership and mapped
  to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_sec61_translocon.yaml;
  none of the member genes has a gene review yet unless noted.
