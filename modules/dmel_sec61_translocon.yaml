id: MODULE:dmel_sec61_translocon
title: Sec61 translocon and associated complexes in Drosophila melanogaster
description: >-
  The Sec61 complex is the protein-conducting channel of the endoplasmic reticulum membrane.
  Its alpha subunit forms an hourglass-shaped pore with a lateral gate through which signal
  sequences and transmembrane segments of nascent polypeptides enter the lipid bilayer; the
  small beta and gamma subunits stabilize the channel. Sec61 receives ribosome-nascent chain
  complexes from the SRP receptor for cotranslational translocation, and with the Sec62-Sec63
  complex it also translocates proteins post-translationally. Translocon-associated proteins
  such as TRAM and the TRAP complex assist the insertion and translocation of particular substrates.
  Drosophila has three Sec61 gamma genes, Sec61gamma, CG8860 and the testis-expressed CG13426,
  giving alternative forms of the channel.
status: DRAFT
scope: CONCRETE
