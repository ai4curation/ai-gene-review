id: MODULE:histidine_catabolism
title: Histidine catabolism to glutamate
description: >-
  A reusable pathway for degradation of L-histidine to L-glutamate. Three
  conserved reactions convert histidine through trans-urocanate and
  4-imidazolone-5-propanoate to N-formimidoyl-L-glutamate. Terminal processing
  then differs among organisms. A two-step route uses HutF and HutG to release
  ammonium and formate; a one-step route uses a formimidoylglutamase to release
  formamide directly. The folate-coupled route instead transfers the formimino
  group to tetrahydrofolate and feeds it into one-carbon metabolism.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0006548
    title: L-histidine catabolic process
    statement: >-
      GO:0006548 captures degradation of L-histidine represented by the common
      three-step trunk and alternative terminal routes.
  - source_id: file:modules/histidine_catabolism-deep-research-openscientist.md
    title: OpenScientist research for the reusable histidine catabolism module
    statement: >-
      The literature synthesis supports the ordered three-reaction trunk and
      the distinct two-step formate, one-step formamide, and folate-coupled
      terminal chemistries. It says an organism generally possesses one route,
      but treats identification of organisms with co-occurring routes as an
      open question. ONE_OR_MORE therefore avoids encoding an exclusivity
      constraint that the cited research has not established.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__histidine_catabolism__ppu00340-deep-research-openscientist.md
    title: OpenScientist PSEPK histidine-catabolism satisfiability review
    statement: >-
      The taxon-specific synthesis supports coverage of the PSEPK route by
      HutH, HutU, HutI, HutF, and HutG, while explicitly noting that individual
      enzyme assignments rely mainly on reviewed records and congeneric
      evidence rather than direct KT2440 biochemistry for every step.
  - source_id: file:PSEPK/hutH/hutH-uniprot.txt
    title: UniProtKB entry for PSEPK HutH
    statement: >-
      Q88CZ7 is a reviewed histidine ammonia-lyase assigned to Rhea 21232.
  - source_id: file:PSEPK/hutU/hutU-uniprot.txt
    title: UniProtKB entry for PSEPK HutU
    statement: >-
      Q88CZ6 is a reviewed urocanate hydratase assigned to Rhea 13101.
  - source_id: file:PSEPK/hutI/hutI-uniprot.txt
    title: UniProtKB entry for PSEPK HutI
    statement: >-
      Q88CZ9 is a reviewed imidazolonepropionase assigned to Rhea 23660.
  - source_id: RHEA:22832
    title: formimidoylglutamate deiminase reaction
    statement: >-
      Rhea 22832 defines HutF-dependent formation of
      N-formyl-L-glutamate and ammonium.
  - source_id: RHEA:12476
    title: N-formylglutamate deformylase reaction
    statement: >-
      Rhea 12476 defines HutG-dependent release of L-glutamate and formate.
  - source_id: RHEA:22492
    title: formimidoylglutamase reaction
    statement: >-
      Rhea 22492 defines one-step hydrolysis of
      N-formimidoyl-L-glutamate to L-glutamate and formamide.
  - source_id: UniProtKB:P42068
    title: Bacillus subtilis HutG formimidoylglutamase
    statement: >-
      The reviewed P42068 entry identifies Bacillus subtilis strain 168 HutG
      as formimidoylglutamase EC 3.5.3.8, assigns Rhea 22492, and cites
      PMID:4990470 for function and catalytic activity.
  - source_id: file:interpro/panther/PTHR11358/PTHR11358-entries.csv
    title: PANTHER PTHR11358 member export
    statement: >-
      The committed PANTHER export classifies P42068 in the function-specific
      PTHR11358:SF35 FORMIMIDOYLGLUTAMASE subfamily.
  - source_id: InterPro:IPR005923
    title: Formiminoglutamase family
    statement: >-
      IPR005923 is the function-specific Formiminoglutamase family and maps to
      formimidoylglutamase activity and histidine catabolism. The PANTHER
      subfamily complements rather than replaces this functional evidence by
      providing a locally validated member roster.
  - source_id: PMID:4990470
    title: Urocanase and N-formimino-L-glutamate formiminohydrolase of Bacillus subtilis, two enzymes of the histidine degradation pathway.
    statement: >-
      Primary enzymology establishes the Bacillus subtilis
      N-formimino-L-glutamate formiminohydrolase as a histidine-degradation
      enzyme.
    supporting_text: "Urocanase and N-formimino-L-glutamate formiminohydrolase of Bacillus subtilis, two enzymes of the histidine degradation pathway."
notes: >-
  This document replaces a one-part human-only wrapper. The common chemistry is
  now exposed as three ordered reaction parts and the terminal route is modeled
  explicitly as three implementation variants. The Pseudomonas putida KT2440
  genes provide concrete exemplars for the two-step formate route, Bacillus
  subtilis HutG provides an exemplar for the one-step formamide route, and
  completed human reviews ground the folate-coupled FTCD route. These exemplars
  do not restrict the taxonomic scope of the route variants. Histidine
  transport, Hut transcriptional regulation, ammonia reassimilation, and
  downstream glutamate metabolism and folate one-carbon metabolism beyond the
  FTCD-intrinsic cyclodeamination are outside the boundary. The OpenScientist
  synthesis is retained as research provenance: it generally expects one
  terminal route but leaves coexistence unresolved. ONE_OR_MORE is a
  conservative relaxation that does not assert either exclusivity or parallel
  route occurrence.
