  title: Acyltransferases that Modify Cell Surface Polymers Across the Membrane.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full comparative review inspected. Direct Dlt and PatA chemistry informs a proposed
      AlgI mechanism; the complete alginate relay is explicitly unproven.
  findings:
  - statement: Alginate O-acetylation uses the AlgI/AlgJ MBOAT-SGNH pair together with AlgF and AlgX;
      current mechanistic models distinguish native associations from unresolved handoff chemistry.
