id: MODULE:alginate_o_acetylation
title: Alginate O-acetylation
description: Bacterial alginate O-acetylation modifies mannuronate residues as the polymer traverses the
  cell envelope. In characterized pseudomonads, the membrane MBOAT component AlgI and periplasm-facing
  SGNH protein AlgJ act with the interaction mediator AlgF and polymer-modifying enzyme AlgX. Azotobacter
  uses homologous proteins, with AlgV corresponding to Pseudomonas AlgJ. AlgX directly transfers acetyl
  groups to polymannuronate in vitro, while the physiological donor and complete AlgI-to-AlgJ-to-AlgX
  relay remain unresolved. Polymer precursor synthesis, polymerization, export and mannuronate epimerization
  are separate but physically coupled processes.
status: COMPLETE
scope: ABSTRACT
evidence:
- source_id: PMID:40171682
  statement: Comparative transmembrane acylation review defines the proposed relay and its unresolved
    steps.
- source_id: PMID:40821665
  statement: Comparative Azotobacter review provides nomenclature and physiological scope, with mechanistic
    generalizations checked against primary studies.
- source_id: PMID:37797696
  statement: Direct interaction and structural work identifies a noncatalytic role for AlgF.
- source_id: PMID:25165982
  statement: Direct AlgJ/AlgX biochemistry separates esterase assays from polymer transfer.
- source_id: PMID:10352233
  statement: Native Azotobacter algF mutation establishes an acetylation role outside Pseudomonas.
notes: The review integrates direct target biochemistry, native genetics and explicit homology inference.
  All four roles have family descriptors and verified exemplars; InterPro AlgJ and AlgX entries are domain
  annotations, so they are retained as domain constraints rather than asserted as full-length family ids.
  AlgI has a broad MBOAT PANTHER assignment whose official label names teichoic-acid modification; that
  label is not evidence of AlgI substrate specificity. AlgF is not assigned intrinsic acetyltransferase
  activity solely because it is required for acetylation. GO:0051979 is not a descendant of GO:0042121;
  modification and polymer biosynthesis/export are distinct roles. The lack of a substrate-specific AlgX
  GO term is an ontology note, not an unknown biological mechanism. New provider requests failed; manually
  inspected primary literature and genuine existing reports are documented in the notes.
