id: MODULE:alginate_o_acetylation
title: Alginate O-acetylation
description: >-
  A bacterial alginate-maturation module in which the inner-membrane AlgI
  component supplies acetyl groups to a periplasm-facing AlgJ-AlgF relay and
  AlgX transfers acetyl groups to O-2 and O-3 positions of mannuronate residues
  in nascent alginate. Alginate precursor synthesis, polymerization, export,
  and mannuronate C5 epimerization are separate modules.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__alginate-o-acetylation__ppu00543-deep-research-openscientist.md
    title: OpenScientist PSEPK alginate O-acetylation synthesis
    statement: Species-aware retrieval identifies the conserved AlgI-AlgJ-AlgF-AlgX machinery and excludes unrelated CysE-family enzymes.
  - source_id: PMID:12003941
    title: Mutant analysis and cellular localization of the AlgI, AlgJ, and AlgF proteins required for O acetylation of alginate in Pseudomonas aeruginosa.
    statement: Defines the requirement and envelope topology of AlgI, AlgJ, and AlgF.
    supporting_text: each mutant produced alginate lacking O-acetyl groups.
  - source_id: PMID:25165982
    title: P. aeruginosa SGNH hydrolase-like proteins AlgJ and AlgX have similar topology but separate and distinct roles in alginate acetylation.
    statement: Distinguishes the AlgJ relay from the terminal, polymer-binding AlgX transferase.
    supporting_text: AlgX binds polymannuronic acid specifically in a length-dependent manner.
  - source_id: PMID:31900562
    title: Analysis of the alginate O-acetylation machinery in Pseudomonas aeruginosa.
    statement: Supports a complex containing AlgI, AlgJ, and AlgF that acts with AlgX.
    supporting_text: Three proteins, AlgI, AlgJ and AlgF have been implicated to form a complex and act together with AlgX for O-acetylation of alginate.
  - source_id: UniProtKB:Q51392
    title: Reviewed Pseudomonas aeruginosa AlgI exemplar
    statement: Provides a reviewed exemplar for the membrane acetyl-transfer component.
  - source_id: UniProtKB:Q51372
    title: Reviewed Pseudomonas aeruginosa AlgX exemplar
    statement: Provides a reviewed exemplar for the terminal polymer O-acetyltransferase.
notes: >-
  The four components are retained as distinct parts because they have
  separable topological and mechanistic roles. AlgI has a broad
  acyltransferase-family assignment, but its immediate donor and acceptor are
  unresolved. AlgJ has acetylesterase activity in vitro, but its physiological
  relay reaction is unresolved and no molecular function is asserted here;
  AlgF has no established catalytic activity. AlgX is the terminal
  O-acetyltransferase. EC 2.3.1.30 serine O-acetyltransferases are not members
  of this module.
