id: MODULE:biotin_biosynthesis
title: Bacterial de novo biotin biosynthesis — the conserved KAPA→DAPA→dethiobiotin→biotin core (BioF/BioA/BioD/BioB)
description: >-
  De novo biosynthesis of the cofactor biotin (vitamin B7) in bacteria proceeds
  through a conserved four-step terminal pathway that converts a pimeloyl
  thioester and simple amino donors into the fused bicyclic biotin ring. In the
  canonical route: (1) the pyridoxal-5'-phosphate (PLP) enzyme 8-amino-7-
  oxononanoate synthase (BioF) condenses a pimeloyl thioester (pimeloyl-[acyl-
  carrier protein] in Escherichia coli) with L-alanine to give 8-amino-7-
  oxononanoate (KAPA, also called 7-keto-8-aminopelargonic acid); (2) the PLP
  aminotransferase adenosylmethionine-8-amino-7-oxononanoate transaminase (BioA)
  transaminates KAPA to 7,8-diaminononanoate (DAPA), using S-adenosyl-L-
  methionine — rather than glutamate — as the unusual amino donor; (3) the ATP-
  and Mg2+-dependent dethiobiotin synthetase (BioD) closes the ureido ring by
  carboxylating DAPA to dethiobiotin; and (4) the radical-S-adenosylmethionine
  iron–sulfur enzyme biotin synthase (BioB) inserts sulfur across the C6–C9
  positions of dethiobiotin to complete the thiophane ring, yielding biotin.
  This KAPA→DAPA→dethiobiotin→biotin core (the BioF/BioA/BioD/BioB steps) is
  strongly conserved across Gram-negative bacteria and mycobacteria and is
  absent from humans, who obtain biotin from diet and gut microbiota, which is
  why it is an attractive antibacterial target. The upstream stage that builds
  the pimeloyl thioester (BioC/BioH in E. coli; BioW/BioI or other routes in
  other taxa) is taxonomically variable and is treated here as context rather
  than as a modeled part.
status: DRAFT
evidence:
  - source_id: GO:0009102
    title: biotin biosynthetic process
    statement: >-
      All four enzymes of the module are annotated to the GO biotin biosynthetic
      process (GO:0009102), the process this metabolic module realizes.
  - source_id: UniProtKB:P12998
    title: 8-amino-7-oxononanoate synthase (BioF), E. coli K-12
    statement: >-
      Step-1 grounding: bioF (P12998), EC 2.3.1.47, GO:0008710 8-amino-7-
      oxononanoate synthase activity, Rhea:42288, PANTHER PTHR13693:SF100
      (the 8-amino-7-oxononanoate synthase subfamily, not the whole
      alpha-oxoamine synthase superfamily PTHR13693, which also contains
      serine palmitoyltransferase, ALAS and GCAT subfamilies).
  - source_id: UniProtKB:P12995
    title: Adenosylmethionine-8-amino-7-oxononanoate aminotransferase (BioA), E. coli K-12
    statement: >-
      Step-2 grounding: bioA (P12995), EC 2.6.1.62, GO:0004015 adenosylmethionine-
      8-amino-7-oxononanoate transaminase activity, Rhea:16861, PANTHER PTHR42684.
  - source_id: UniProtKB:P13000
    title: ATP-dependent dethiobiotin synthetase (BioD), E. coli K-12
    statement: >-
      Step-3 grounding: bioD (P13000), EC 6.3.3.3, GO:0004141 dethiobiotin
      synthase activity, Rhea:15805, PANTHER PTHR43210.
  - source_id: UniProtKB:P12996
    title: Biotin synthase (BioB), E. coli K-12
    statement: >-
      Step-4 grounding: bioB (P12996), EC 2.8.1.6, GO:0004076 biotin synthase
      activity, Rhea:22060, PANTHER PTHR22976.
  - source_id: PMID:42343126
    title: A Streptomyces megacluster encodes synergistic biotin-targeting antibiotics
    statement: >-
      A conserved Streptomyces biosynthetic megacluster produces four natural-
      product families (stravidins, acidomycin, dapamycins, α-Me-KAPA) plus the
      biotin-binding protein streptavidin, which converge on bacterial biotin
      metabolism by enzyme inhibition, prodrug activation, cofactor mimicry and
      biotin sequestration — motivating this module as a druggable target
      pathway.
    supporting_text: >-
      These components converge on bacterial biotin metabolism through
      complementary mechanisms, including enzyme inhibition, prodrug activation,
      cofactor mimicry and biotin sequestration.
    notes: >-
      Curator caveat: this record is abstract-only (full_text_available: false)
      and the abstract names no individual enzyme. It therefore does not itself
      establish which pathway step any given metabolite acts on, nor any
      inhibition kinetics. The commonly-made step-level assignments are recorded
      as a knowledge gap rather than asserted here (see module.knowledge_gaps).
module:
  id: biotin_biosynthesis
  label: Bacterial de novo biotin biosynthesis (BioF → BioA → BioD → BioB)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: biotin biosynthetic process
      term:
        id: GO:0009102
        label: biotin biosynthetic process
      description: >-
        De novo assembly of the biotin bicyclic ring from a pimeloyl thioester
        and amino/sulfur donors through the conserved KAPA → DAPA → dethiobiotin
        → biotin sequence.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          This module is scoped to bacterial de novo biotin biosynthesis. The
          scope is what the participant selectors are drawn against: the BioF
          selector rests on the bacteria-scoped PAINT node PTN000343971
          (taxon:2), and both the PTHR13693:SF77 and PTHR42684:SF3 exclusions
          argued in knowledge_gaps are taxonomic rather than functional. Archaeal
          and eukaryotic members of the same PANTHER families (e.g. the archaeal
          HcgA proteins inside PTHR22976, the fungal/plant SF77 BioF proteins)
          are therefore out of scope for this module even where they fall inside
          a family selector.
  parts:
    - order: 1
      role: KAPA (8-amino-7-oxononanoate) formation — entry into the biotin amino stage
      node:
        id: biof_step
        label: pimeloyl-[ACP] + L-alanine -> 8-amino-7-oxononanoate (KAPA) + CO2 + holo-[ACP]
        module_type: REACTION
        annotons:
          - id: biof_activity
            label: "BioF: 8-amino-7-oxononanoate synthase (KAPA synthase)"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: 8-amino-7-oxononanoate synthase subfamily (BioF)
                description: >-
                  Grounded to the PTHR13693:SF100 subfamily rather than the
                  parent family PTHR13693, which is the whole alpha-oxoamine
                  synthase superfamily and also contains the serine
                  palmitoyltransferase (SF2/SF54/SF79), ALAS (SF58), GCAT
                  (SF102) and LCB2B (SF104) subfamilies — none of which act in
                  biotin biosynthesis. All membership counts given here are over
                  the UniProtKB/Swiss-Prot-reviewed slice cached in
                  interpro/panther/PTHR13693/PTHR13693-entries.csv (408 reviewed
                  members, of which 270 are SF100 and 11 SF77); PANTHER counts
                  PTHR13693 as 65129 proteins across 20 subfamilies, so these are
                  audits of the reviewed subset, not exhaustive family censuses.
                  SF100 is not the only AONS subfamily in PTHR13693: SF77 carries
                  the identical subfamily name 8-AMINO-7-OXONONANOATE SYNTHASE
                  and contains genuine BioF orthologs, including bacterial ones
                  (Helicobacter pylori O25320/Q9ZLN3, Aquifex aeolicus O66875)
                  alongside archaeal (Q58694, A6UQL9, A6UWX3), fungal (C8V1D1)
                  and plant (Q8GW43) members. SF77 is deliberately excluded from
                  this selector because the PAINT grounding used for this step —
                  PTN000343971, scoped to taxon:2 and seeded by UniProtKB:P12998
                  and UniProtKB:P9WQ87 — sits over SF100 members only, and SF77
                  spans lineages outside this module's bacterial scope (its own
                  PAINT node PTN001008501 is fungal, taxon:4751). The
                  consequence is a known and accepted coverage gap: SF77
                  bacterial BioF such as H. pylori HP_0598 is not matched by
                  this participant (see knowledge_gaps). SF100 is itself not
                  functionally pure: it contains the CAI-1 autoinducer synthases
                  CqsA of Vibrio cholerae (Q9KM65) and Vibrio campbellii
                  (A7N6R9), alpha-oxoamine synthases that perform quorum-sensing
                  autoinducer chemistry rather than the KAPA-forming
                  condensation. Unlike the archaeal outliers noted for the BioB
                  family these are bacterial, so the taxon constraint does not
                  exclude them; they are discharged by required_function
                  (GO:0008710) alone, not by the choice of subfamily.
                term:
                  id: PANTHER:PTHR13693:SF100
                  label: 8-AMINO-7-OXONONANOATE SYNTHASE
                representative_members:
                  - preferred_term: BioF (E. coli K-12)
                    term:
                      id: UniProtKB:P12998
                      label: 8-amino-7-oxononanoate synthase
                ancestral_nodes:
                  - preferred_term: PAINT node PTN000343971 (bacterial BioF) in PTHR13693
                    term:
                      id: PANTHER:PTN000343971
                      label: PTN000343971
                    description: >-
                      Bacteria-scoped PAINT IBD node (taxon:2) in PTHR13693
                      propagating F:GO:0008710 and P:GO:0009102, seeded by
                      UniProtKB:P12998 (E. coli BioF) and UniProtKB:P9WQ87
                      (M. tuberculosis BioF1), both SF100 members; PAINT date
                      20200206. The eukaryotic sibling nodes of the same family
                      instead carry GO:0003870 (ALAS, PTN000343737) and
                      GO:0004758 (serine palmitoyltransferase, PTN000343811 /
                      PTN000343996), which is what makes this node, rather than
                      the parent family, the grounding for this step.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          IBD propagation from PAINT node PTN000343971 in
                          PTHR13693.
                        url: file:interpro/panther/PTHR13693/PTHR13693-paint.tsv
              required_function:
                preferred_term: 8-amino-7-oxononanoate synthase activity
                term:
                  id: GO:0008710
                  label: 8-amino-7-oxononanoate synthase activity
                description: >-
                  Functional constraint on the family selector: a member matches
                  this annoton only if it catalyses the KAPA-forming
                  condensation. This is what keeps the selector from reaching
                  the non-biotin alpha-oxoamine synthases of the parent family
                  PTHR13693 should the grounding ever be widened, and it is also
                  the only constraint that excludes the two bacterial CqsA
                  autoinducer synthases (Q9KM65, A7N6R9) that sit inside SF100
                  itself — neither the subfamily choice nor the taxon constraint
                  removes them.
              taxon:
                preferred_term: bacteria
                term:
                  id: NCBITaxon:2
                  label: Bacteria
                description: >-
                  Taxonomic constraint on the selector, matching
                  module.context.taxa. The SF77 exclusion argued in the family
                  description and in knowledge_gaps is taxonomic rather than
                  functional, and the PAINT node this step rests on
                  (PTN000343971) is itself scoped to taxon:2. It does not do all
                  the work here: the CqsA members of SF100 are bacterial and are
                  excluded by required_function instead.
            function:
              preferred_term: 8-amino-7-oxononanoate synthase activity
              term:
                id: GO:0008710
                label: 8-amino-7-oxononanoate synthase activity
              substrates:
                - preferred_term: pimeloyl-[acyl-carrier protein]
                - preferred_term: L-alanine
              products:
                - preferred_term: 8-amino-7-oxononanoate (KAPA)
                - preferred_term: carbon dioxide
                - preferred_term: holo-[acyl-carrier protein]
              evidence:
                - source_id: EC:2.3.1.47
                  statement: 8-amino-7-oxononanoate synthase (AONS / KAPA synthase)
                - source_id: RHEA:42288
                  statement: 6-carboxyhexanoyl-[ACP] + L-alanine + H(+) = (8S)-8-amino-7-oxononanoate + holo-[ACP] + CO2
                - source_id: PANTHER:PTN000343971
                  statement: >-
                    Bacteria-scoped PAINT ancestral node (taxon:2) in PTHR13693
                    asserting GO:0008710 and GO:0009102 by IBD, seeded by
                    UniProtKB:P12998 (E. coli BioF) and UniProtKB:P9WQ87
                    (M. tuberculosis BioF); the eukaryotic sibling nodes of the
                    same family instead carry GO:0003870 (ALAS) and GO:0004758
                    (serine palmitoyltransferase).
                  url: file:interpro/panther/PTHR13693/PTHR13693-paint.tsv
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              PLP-dependent condensation of a pimeloyl thioester with L-alanine,
              with concomitant decarboxylation, to form the first biotin-pathway
              intermediate KAPA (8-amino-7-oxononanoate). This is the committed
              entry into the conserved amino/diamino stage of biotin synthesis.
    - order: 2
      role: transamination of KAPA to the diamine DAPA (SAM as amino donor)
      node:
        id: bioa_step
        label: 8-amino-7-oxononanoate (KAPA) + S-adenosyl-L-methionine -> 7,8-diaminononanoate (DAPA) + S-adenosyl-4-methylsulfanyl-2-oxobutanoate
        module_type: REACTION
        annotons:
          - id: bioa_activity
            label: "BioA: adenosylmethionine-8-amino-7-oxononanoate transaminase (DAPA aminotransferase)"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Adenosylmethionine-8-amino-7-oxononanoate transaminase subfamily (BioA)
                description: >-
                  Grounded to the PTHR42684:SF17 subfamily rather than the parent
                  family PTHR42684, which is a broader class-III aminotransferase
                  family also containing the beta-alanine--pyruvate (SF1) and
                  gamma-aminobutyrate transaminase (SF8/SF10/SF19/SF20)
                  subfamilies, none of which act in biotin biosynthesis. Counts
                  here are over the UniProtKB/Swiss-Prot-reviewed slice cached in
                  interpro/panther/PTHR42684/PTHR42684-entries.csv (51 reviewed
                  members, of which 29 are SF17); PANTHER counts PTHR42684 as
                  18974 proteins across 12 subfamilies, so this is an audit of the
                  reviewed subset rather than an exhaustive family census. All 29
                  reviewed SF17 members catalyse this same KAPA -> DAPA step of
                  the biotin pathway (including the fused BioAB proteins of
                  Bacteroides), and the subfamily contains the E. coli K-12
                  representative P12995. SF17 is not, however, the *bacterial*
                  BioA subfamily, and the SF17/SF3 split is not a
                  bacteria/eukaryote split: SF17 also holds the archaeal bioA of
                  Methanocaldococcus jannaschii (Q58696), which is excluded here
                  by the taxon constraint rather than by the subfamily choice,
                  while SF3 holds a genuine bacterial bioA (Synechococcus
                  elongatus PCC 7942 Q31SA6) alongside the eukaryotic equivalents
                  (S. cerevisiae BIO3 P50277, the fungal bifunctional Q5AYI6).
                  PAINT agrees that GO:0004015 is not SF17-exclusive: node
                  PTN000241343 propagates it with no taxon restriction, seeded
                  jointly by UniProtKB:P12995 (SF17) and SGD:S000005341 (SF3).
                  The consequence is a coverage gap symmetric to the SF77 gap
                  documented for BioF — cyanobacterial BioA in SF3 is not matched
                  by this participant (see knowledge_gaps). The step is chemically
                  uniform but the amino donor is not: SF17 also contains the
                  L-lysine-dependent BioK variant (Bacillus subtilis P53555), for
                  which the SAM-specific function asserted on this annoton does
                  not hold — recorded as a knowledge gap rather than qualified
                  here (see knowledge_gaps).
                term:
                  id: PANTHER:PTHR42684:SF17
                  label: ADENOSYLMETHIONINE-8-AMINO-7-OXONONANOATE AMINOTRANSFERASE
                representative_members:
                  - preferred_term: BioA (E. coli K-12)
                    term:
                      id: UniProtKB:P12995
                      label: Adenosylmethionine-8-amino-7-oxononanoate aminotransferase
                ancestral_nodes:
                  - preferred_term: PAINT node PTN000241343 (BioA/DAPA aminotransferase) in PTHR42684
                    term:
                      id: PANTHER:PTN000241343
                      label: PTN000241343
                    description: >-
                      PAINT IBD node in PTHR42684 propagating F:GO:0004015 and
                      P:GO:0009102, seeded by UniProtKB:P12995 (E. coli BioA),
                      UniProtKB:P9WQ81 (M. tuberculosis), SGD:S000005341
                      (S. cerevisiae BIO3) and AGI_LocusCode:AT5G57590
                      (Arabidopsis). Unlike the BioF node PTN000343971 this one
                      carries no taxon restriction and its seeds span SF17 and
                      SF3, which is the PAINT-side evidence that GO:0004015 is
                      not an SF17-exclusive function; the bacterial scope of this
                      step therefore rests on participant.taxon rather than on
                      the node. The sibling node PTN000241344 is separately scoped
                      to eukaryotes (taxon:2759) and carries GO:0004141 and
                      GO:0005739 instead.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          IBD propagation from PAINT node PTN000241343 in
                          PTHR42684.
                        url: file:interpro/panther/PTHR42684/PTHR42684-paint.tsv
              required_function:
                preferred_term: S-adenosyl-L-methionine:8-amino-7-oxononanoate transaminase activity
                term:
                  id: GO:0004015
                  label: S-adenosyl-L-methionine:8-amino-7-oxononanoate transaminase activity
                description: >-
                  Functional constraint on the family selector, and the slot in
                  which the BioK donor mismatch is discharged rather than left
                  as an unqualified assertion over all of PTHR42684:SF17: the
                  L-lysine-dependent BioK variant (Bacillus subtilis P53555)
                  performs the same KAPA -> DAPA transamination but does not
                  carry this SAM-specific function, and so does not satisfy this
                  constraint (see knowledge_gaps).
              taxon:
                preferred_term: bacteria
                term:
                  id: NCBITaxon:2
                  label: Bacteria
                description: >-
                  Taxonomic constraint on the selector, matching
                  module.context.taxa. This constraint is load-bearing rather
                  than redundant: SF17 is not bacteria-only, and it is this slot
                  — not the subfamily choice — that excludes the archaeal bioA of
                  Methanocaldococcus jannaschii (Q58696) and the eukaryotic BioA
                  equivalents wherever PANTHER places them.
            function:
              preferred_term: S-adenosyl-L-methionine:8-amino-7-oxononanoate transaminase activity
              term:
                id: GO:0004015
                label: S-adenosyl-L-methionine:8-amino-7-oxononanoate transaminase activity
              substrates:
                - preferred_term: 8-amino-7-oxononanoate (KAPA)
                - preferred_term: S-adenosyl-L-methionine
              products:
                - preferred_term: 7,8-diaminononanoate (DAPA)
                - preferred_term: S-adenosyl-4-methylsulfanyl-2-oxobutanoate
              evidence:
                - source_id: EC:2.6.1.62
                  statement: adenosylmethionine-8-amino-7-oxononanoate transaminase (DAPA aminotransferase)
                - source_id: RHEA:16861
                  statement: (8S)-8-amino-7-oxononanoate + S-adenosyl-L-methionine = S-adenosyl-4-methylsulfanyl-2-oxobutanoate + (7R,8S)-7,8-diammoniononanoate
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              PLP-dependent aminotransferase that installs the second (C7) amino
              group, converting KAPA to the diamine DAPA. Unusually it uses
              S-adenosyl-L-methionine, not glutamate, as the amino donor.
    - order: 3
      role: ureido-ring closure — carboxylation of DAPA to dethiobiotin
      node:
        id: biod_step
        label: 7,8-diaminononanoate (DAPA) + CO2 + ATP -> dethiobiotin + ADP + phosphate
        module_type: REACTION
        annotons:
          - id: biod_activity
            label: "BioD: ATP-dependent dethiobiotin synthetase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Dethiobiotin synthetase family (BioD)
                description: >-
                  Kept at family level deliberately, not for want of checking.
                  The same paralog-contamination audit that forced subfamily
                  narrowing for BioF and BioA was run against
                  interpro/panther/PTHR43210/PTHR43210-entries.csv and came back
                  clean: of the 256 UniProtKB/Swiss-Prot-reviewed members cached
                  in that file, 254 are named as dethiobiotin synthetase BioD
                  (236 "ATP-dependent dethiobiotin synthetase BioD" plus
                  paralog-numbered BioD 1/BioD 2 copies), one is the bifunctional
                  BioCD protein of Bordetella avium (Q2KXN6, whose BioD half
                  catalyses this same step), and one is uncharacterized
                  (Synechocystis slr0039). That audit covers the reviewed slice
                  only — PANTHER counts PTHR43210 as 11765 proteins across 3
                  subfamilies — so it establishes that no non-biotin enzyme class
                  appears among the reviewed members, not that none exists in the
                  family. The stronger, family-wide support is the PAINT node
                  below: PTN000482092 asserts dethiobiotin synthase activity at
                  the root of the family. On that basis PTHR43210 is treated as
                  functionally equivalent to its BioD subfamilies (SF5/SF2/SF4,
                  which split by clade rather than by chemistry) and narrowing
                  would only shrink coverage.
                term:
                  id: PANTHER:PTHR43210
                  label: DETHIOBIOTIN SYNTHETASE
                representative_members:
                  - preferred_term: BioD (E. coli K-12)
                    term:
                      id: UniProtKB:P13000
                      label: ATP-dependent dethiobiotin synthetase BioD
                ancestral_nodes:
                  - preferred_term: PAINT node PTN000482092 (dethiobiotin synthetase) in PTHR43210
                    term:
                      id: PANTHER:PTN000482092
                      label: PTN000482092
                    description: >-
                      PAINT IBD node in PTHR43210 propagating F:GO:0004141,
                      P:GO:0009102 and C:GO:0005829, seeded by UniProtKB:P13000
                      (E. coli BioD), UniProtKB:P0A6E9, UniProtKB:P9WPQ5
                      (M. tuberculosis) and SGD:S000005340 (S. cerevisiae BIO4).
                      This is the substantive justification for keeping the BioD
                      selector at family level: a single unrestricted node
                      asserting dethiobiotin synthase activity over the whole
                      family is better evidence of functional homogeneity than
                      the name census of the reviewed slice. The node carries no
                      taxon restriction, so bacterial scope comes from
                      participant.taxon.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          IBD propagation from PAINT node PTN000482092 in
                          PTHR43210.
                        url: file:interpro/panther/PTHR43210/PTHR43210-paint.tsv
              required_function:
                preferred_term: dethiobiotin synthase activity
                term:
                  id: GO:0004141
                  label: dethiobiotin synthase activity
                description: >-
                  Functional constraint on the family selector. PTHR43210 is
                  kept at family level because the audit found no non-biotin
                  enzyme class in it; this slot encodes that argument as a
                  constraint rather than leaving it in prose, and excludes the
                  one uncharacterized member (Synechocystis slr0039) while
                  admitting the bifunctional BioCD protein of Bordetella avium
                  (Q2KXN6), whose BioD half does catalyse this step.
              taxon:
                preferred_term: bacteria
                term:
                  id: NCBITaxon:2
                  label: Bacteria
                description: >-
                  Taxonomic constraint on the selector, matching
                  module.context.taxa.
            function:
              preferred_term: dethiobiotin synthase activity
              term:
                id: GO:0004141
                label: dethiobiotin synthase activity
              substrates:
                - preferred_term: 7,8-diaminononanoate (DAPA)
                - preferred_term: carbon dioxide
                - preferred_term: ATP
              products:
                - preferred_term: dethiobiotin
                - preferred_term: ADP
                - preferred_term: phosphate
              evidence:
                - source_id: EC:6.3.3.3
                  statement: dethiobiotin synthase (DTBS)
                - source_id: RHEA:15805
                  statement: (7R,8S)-7,8-diammoniononanoate + CO2 + ATP = (4R,5S)-dethiobiotin + ADP + phosphate + 3 H(+)
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              ATP- and Mg2+-dependent ligase that fixes CO2 onto the two amino
              groups of DAPA to form the cyclic ureido (imidazolidone) ring of
              dethiobiotin — the penultimate biotin-pathway intermediate.
    - order: 4
      role: sulfur insertion — thiophane-ring closure to biotin
      node:
        id: biob_step
        label: dethiobiotin + sulfur donor + 2 S-adenosyl-L-methionine -> biotin + 2 L-methionine + 2 5'-deoxyadenosine
        module_type: REACTION
        annotons:
          - id: biob_activity
            label: "BioB: biotin synthase (radical-SAM Fe-S enzyme)"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Biotin synthase family (BioB)
                description: >-
                  Kept at family level deliberately. PANTHER places every one of
                  the 590 UniProtKB/Swiss-Prot-reviewed members cached in
                  interpro/panther/PTHR22976/PTHR22976-entries.csv in a single
                  subfamily, PTHR22976:SF2, and reports subfamilies: 1 for the
                  family as a whole, so subfamily narrowing is not available here
                  — and SF2's name ("BIOTIN SYNTHASE, MITOCHONDRIAL") would
                  misdescribe the bacterial members that make up the bulk of it.
                  (590 is the size of the reviewed slice, not of the family:
                  PANTHER counts PTHR22976 as 15083 proteins.) Within that
                  reviewed slice the family is functionally clean: 587 members
                  are named biotin synthase (including the 3 mitochondrial ones),
                  one is uncharacterized (Methanocaldococcus jannaschii
