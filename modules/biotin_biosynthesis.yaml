                  - preferred_term: BioB activity node PTN000540961
                    term:
                      id: PANTHER:PTN000540961
                      label: PTN000540961
                    description: >-
                      PAINT node carrying GO:0004076 and seeded by
                      experimentally characterized E. coli P12996.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: >-
                          Local PTHR22976 PAINT data assigns GO:0004076 to
