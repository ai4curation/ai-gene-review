                                    id: UniProtKB:Q88QW9
                                    label: Malonyl-[acyl-carrier protein] O-methyltransferase
                                  description: Pseudomonas putida KT2440 bioC/PP_0365.
                                - preferred_term: bioC (Escherichia coli K-12)
                                  term:
                                    id: UniProtKB:P12999
                                    label: Malonyl-[acyl-carrier protein] O-methyltransferase
                                  description: >-
                                    Reviewed, experimentally characterized exemplar for
                                    malonyl-ACP methylation.
                          function:
                            preferred_term: malonyl-ACP O-methyltransferase activity
                            term:
                              id: GO:0102130
                              label: malonyl-CoA methyltransferase activity
