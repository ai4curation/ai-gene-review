  connections:
    - source: bioC_step
      target: bioH_step
      connection_type: PRECEDES
      description: >-
        Two cycles of shared fatty-acid elongation convert the BioC product to
        pimeloyl-ACP methyl ester before BioH hydrolysis.
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Shared fatty-acid-synthase reactions perform two elongation cycles
        between the BioC and BioH pathway-specific control points.
    - source: pimelate_thioester_supply
      target: bioF_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        The pimelate thioester (pimeloyl-ACP or pimeloyl-CoA) is the KAPA
        synthase substrate.
    - source: bioF_step
      target: bioA_step
      connection_type: PRECEDES
    - source: bioA_step
      target: bioD_step
      connection_type: PRECEDES
    - source: bioD_step
      target: bioB_step
      connection_type: PRECEDES
  knowledge_gaps:
    - gap_statement: >-
        The ppu00780 bucket lists several generic fatty-acid-synthesis enzymes,
        but it does not establish which paralogs carry the masked pimelate
        intermediate in KT2440.
      boundary: >-
        Keep shared elongation as an explicit dependency and do not assign
        biotin-specific membership to Fab proteins without pathway-specific
        genetic, biochemical, or strong comparative-genomic evidence.
      gap_kind:
        - BIOLOGY
        - CURATION
      status: OPEN
      significance: >-
        Selecting a specific Fab paralog without pathway-specific evidence
        would turn a shared dependency into an unsupported dedicated member.
      resolution: >-
        Trace the ACP-bound masked pimelate intermediate genetically or
        biochemically to identify which native elongation enzymes carry it.
      provenance:
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__biotin_biosynthesis__ppu00780-deep-research-openscientist.md
          supporting_text: >-
            Any of several FAS reductases could service the masked intermediate;
            do not single one out.
          reference_section_type: RESULTS
    - gap_statement: >-
        No direct biochemical or genetic characterization of the six KT2440
        pathway-specific proteins was identified in the module-level research.
      boundary: >-
        Treat pathway coverage as strongly supported by exact family assignments,
        conserved reactions, and genomic context, but do not represent transferred
        mechanism as strain-specific experimental evidence.
      gap_kind:
        - CURATION
      status: OPEN
      significance: >-
        The PSEPK pathway is satisfiable by strong comparative evidence, but
        transferred mechanism must not be represented as direct KT2440 assays.
      resolution: >-
        Purify and assay each KT2440 enzyme or establish gene-specific pathway
        phenotypes with native complementation.
      provenance:
        - reference_id: file:projects/P_PUTIDA/deep-research/PSEPK__biotin_biosynthesis__ppu00780-deep-research-openscientist.md
          supporting_text: >-
            Evidence for KT2440 is **homology/domain/pathway-database based
            (PE3–4)**; there is no direct biochemical or genetic
            characterization of the KT2440 bio proteins themselves.
          reference_section_type: RESULTS
    - gap_statement: >-
        The reaction catalysed by Saccharomyces BIO1 and the chemical origin of
        the pimeloyl moiety in Saccharomyces yeasts are unknown.
      boundary: >-
        BIO1 is required for biotin prototrophy, is a PhyH-family
        (dioxygenase-like) protein, and its function needs oxygen
        (PMID:18073433, PMID:32276977). Saccharomyces lacks the peroxisomal BioF
        route used by other fungi (PMID:21998305).
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: >-
        This is the unknown first step of yeast biotin synthesis and the reason
        biotin synthesis in yeast requires oxygen.
      resolution: >-
        Purify BIO1 and test Fe(II)/2-oxoglutarate-dependent oxidation of
        candidate acyl-CoA or fatty-acid substrates; trace label from fatty
        acids into biotin in BIO1-expressing strains.
    - gap_statement: >-
        Whether BIO6, a class-III aminotransferase paralogue of BIO3, itself
        catalyses KAPA formation from a pimelate thioester and L-alanine has
        not been shown biochemically.
      boundary: >-
        Genetics places BIO6 before KAPA (PMID:16269718), and BIO1 plus BIO6
        are sufficient to restore prototrophy to S288C (PMID:18073433); SGD's
        GO:0008710 annotation for BIO6 is by sequence similarity.
      gap_kind:
        - BIOLOGY
      status: OPEN
      significance: >-
        A KAPA synthase in the aminotransferase class III fold would be a
        convergent solution to a reaction normally done by class-II BioF
        enzymes.
      resolution: >-
        Assay purified BIO6 with pimeloyl-CoA (and candidate BIO1 products) and
        L-alanine for KAPA formation.
  notes: >-
    Alignment with YeastPathways BIOTIN-SYNTHESIS-PWY and the PomBase model
    67c10cc400002026. The module now models the pimelate-thioester supply and
    the KAPA-forming step as variant sets, because these are the steps that
    differ between bacteria, filamentous fungi and Saccharomyces; the BioA,
    BioD and BioB steps are conserved and only gain fungal exemplars. The
    Saccharomyces route was rebuilt after loss of the ancestral pathway: BIO1
    arose by duplication of the PhyH-family gene YJR154W and BIO6 by duplication
    of the BioA gene BIO3 (PMID:18073433). Many S. cerevisiae strains,
    including S288C, lack BIO1 and BIO6 and are biotin auxotrophs; the BIO1 and
    BIO6 exemplars are therefore from strain A364a. BIO5 (KAPA/DAPA uptake),
    VHT1 (biotin uptake), BPL1 biotin-protein ligase, BirA-type regulation and
    the human biotin cycle (modules/biotin_cycle.yaml) are outside the module.
    S. pombe has no BioF, BioA or BioD family member and keeps only bio2, so it
    can make biotin only from imported dethiobiotin. Compartments: BIO2 and
    A. nidulans BioB are mitochondrial, A. nidulans BioF is peroxisomal, and
    UniProt also places A. nidulans BioDA in the mitochondrial matrix by
    similarity; the SGD GO-CAM places all yeast activities in cytosol. The
    bifunctional BioDA architecture is noted at the BioA and BioD steps rather
    than as a separate variant set, because the reactions and their order are
    unchanged. Molecular functions are attached only to leaf annotons. GO:0102130
    retains its official label, malonyl-CoA methyltransferase activity, while its
    definition and RHEA:17105 grounding specify the physiological malonyl-ACP
    reaction modeled here. BioC uses NCBIfam:TIGR02072 because its current
    PANTHER subfamily is mislabeled as a mitochondrial arginine hydroxylase. The
    BioA family is now asserted at PTHR42684 because the fungal BIO3/BioDA
    proteins are in a different subfamily (SF3) from the bacterial exemplars
    (SF17).
