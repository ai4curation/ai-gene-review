              - id: fungal_peroxisomal_beta_oxidation_variant
                label: Peroxisomal beta-oxidation route to pimeloyl-CoA (filamentous fungi)
                module_type: METABOLIC_PATHWAY
                description: >-
                  In Aspergillus nidulans and probably most fungi, pimeloyl-CoA
                  is made by the peroxisomal beta-oxidation cycle (acyl-CoA
                  oxidase AoxA and multifunctional protein FoxA) and used by a
                  peroxisomal KAPA synthase. The beta-oxidation enzymes are
                  shared machinery, not biotin-specific members, so no annoton
                  is asserted (PMID:21998305).
              - id: saccharomyces_bio1_variant
                label: BIO1-dependent, oxygen-requiring route (Saccharomyces yeasts)
                module_type: REACTION
                description: >-
                  Saccharomyces yeasts lack the peroxisomal BioF route and need
                  BIO1, a PhyH-family (Fe(II)/2-oxoglutarate dioxygenase-like)
                  protein that arose by duplication of YJR154W. Biotin synthesis
                  by this route needs oxygen. The substrate and product of
                  BIO1 are unknown.
                annotons:
                  - id: bio1_pimelate_supply_activity
                    label: "BIO1: pimelate-thioester supply (reaction unknown)"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: Saccharomyces BIO1 (PhyH family)
                        term:
                          id: PANTHER:PTHR21308
                          label: PHYTANOYL-COA ALPHA-HYDROXYLASE
                        representative_members:
                          - preferred_term: BIO1 (Saccharomyces cerevisiae A364a)
                            term:
                              id: UniProtKB:E9P9F6
                              label: Putative pimeloyl-CoA synthetase
                            description: >-
                              BIO1 from biotin-prototrophic strain A364a; the
                              S288C reference genome lacks a functional copy.
                    function:
                      preferred_term: pimelate-thioester supply (catalytic activity unknown)
                      description: >-
                        SGD annotates BIO1 to 6-carboxyhexanoate-CoA ligase
                        activity (GO:0042410) by sequence similarity, but BIO1
                        is a PhyH-family dioxygenase-like protein rather than an
                        acyl-CoA ligase, and its reaction remains unresolved
                        (PMID:32276977). No GO molecular-function term is
                        asserted.
                      evidence:
                        - source_id: PMID:18073433
                          statement: BIO1 with BIO6 restores biotin prototrophy to S288C.
                        - source_id: PMID:32276977
                          statement: Bio1 catalytic function is unresolved and its activity needs oxygen.
                    role_description: >-
                      Required for formation of the pimelate moiety in
                      Saccharomyces yeasts.
