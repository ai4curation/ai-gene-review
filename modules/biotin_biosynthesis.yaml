module:
  id: biotin_biosynthesis
  label: de novo biotin biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: biotin biosynthetic process
      term:
        id: GO:0009102
        label: biotin biosynthetic process
      description: Formation of biotin from a pimelate thioester through KAPA, DAPA and dethiobiotin.
  gocam_associations:
    - model: gomodel:YeastPathways_BIOTIN-SYNTHESIS-PWY
      title: 'biotin biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD YeastPathways conversion for S. cerevisiae S288C: BIO3, BIO4 and
        BIO2, all placed in cytosol, no causal edges. BIO1, BIO6 and the KAPA
        synthase step are absent because S288C lacks those genes; BIO2 is
        mitochondrial rather than cytosolic.
    - model: gomodel:67c10cc400002026
      title: biotin import across plasma membrane (GO:1905135),  biotin biosynthetic process (GO:0009102),   biotinylated proteins
      description: >-
        PomBase S. pombe model. S. pombe has only the last enzyme, bio2 (biotin
        synthase), and imports biotin and dethiobiotin with vht1. The model's
        biotin and dethiobiotin transport, bpl1 biotin-protein ligase and the
        biotinylated carboxylases (pyr1, cut6) lie outside this module.
  parts:
    - order: 1
      role: pimelate-thioester supply
      node:
        id: pimelate_thioester_supply
        label: Pimeloyl-ACP or pimeloyl-CoA formation
        module_type: METABOLIC_PATHWAY
        description: >-
          Supplies the seven-carbon pimelate thioester that KAPA synthase
          condenses with L-alanine. The route differs between lineages.
        variant_sets:
          - id: pimelate_supply_variants
            label: Pimelate-thioester supply routes
            axis: route (taxon)
            selection: EXACTLY_ONE
            variants:
              - id: bioc_bioh_variant
                label: BioC-BioH route through fatty-acid synthesis (many bacteria)
                module_type: METABOLIC_PATHWAY
                parts:
                  - order: 1
                    role: malonyl-ACP carboxyl methylation
                    node:
                      id: bioC_step
                      label: Malonyl-ACP to malonyl-ACP methyl ester
                      module_type: REACTION
                      annotons:
                        - id: bioC_activity
                          label: BioC malonyl-ACP O-methyltransferase
                          participant:
                            selector_type: FAMILY
                            required_function:
                              preferred_term: malonyl-ACP O-methyltransferase activity
                              term:
                                id: GO:0102130
                                label: malonyl-CoA methyltransferase activity
                            family:
                              preferred_term: BioC malonyl-ACP O-methyltransferase family
                              term:
                                id: NCBIfam:TIGR02072
                                label: BioC
                              representative_members:
                                - preferred_term: bioC (Pseudomonas putida KT2440)
