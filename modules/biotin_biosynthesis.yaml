id: MODULE:biotin_biosynthesis
title: De novo biotin biosynthesis (pimelate-thioester supply and BioF-BioA-BioD-BioB ring assembly)
description: >-
  De novo synthesis of biotin in bacteria, fungi and plants. A seven-carbon
  pimelate thioester (pimeloyl-ACP or pimeloyl-CoA) is first made by a
  lineage-specific route, and four conserved reactions then assemble the two
  rings of biotin. In many bacteria, BioC methylates malonyl-ACP, the shared
  fatty-acid-synthase reactions extend the masked intermediate to pimeloyl-ACP
  methyl ester, and BioH removes the methyl group. Filamentous fungi make
  pimeloyl-CoA by peroxisomal beta-oxidation, and Saccharomyces yeasts need
  the oxygen-dependent BIO1 protein, whose reaction is not known. The pimelate
  thioester is condensed with L-alanine to 8-amino-7-oxononanoate (KAPA) by a
  PLP-dependent KAPA synthase: bacterial BioF, a peroxisomal BioF in
  filamentous fungi, or, in Saccharomyces, a step that requires the BIO6
  protein, a paralogue of the BioA aminotransferase. BioA then transfers an
  amino group from S-adenosylmethionine to give 7,8-diaminononanoate (DAPA),
  BioD closes the ureido ring with CO2 and ATP to give dethiobiotin, and the
  radical-SAM enzyme BioB inserts sulfur to form biotin. In fungi BioB is
  mitochondrial, and in filamentous fungi and plants BioD and BioA are fused in
  one protein. Biotin attachment to carboxylases, biotin uptake and regulation
  are outside the module.
status: DRAFT
evidence:
  - source_id: YeastPathways:BIOTIN-SYNTHESIS-PWY
    title: biotin biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Source pathway for the Saccharomyces variant. It lists BIO3 (DAPA
      aminotransferase), BIO4 (dethiobiotin synthetase) and BIO2 (biotin
      synthase), all placed in cytosol, and leaves the KAPA synthase reaction
      (7KAPSYN-RXN) without a gene because the reference strain S288C lacks
      BIO1 and BIO6. This module adds BIO1 (pimelate-thioester supply) and
      BIO6 (KAPA formation) from biotin-prototrophic strains and places BIO2
      in the mitochondrion.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=BIOTIN-SYNTHESIS-PWY
  - source_id: KEGG:ppu00780
    title: Pseudomonas putida KT2440 biotin metabolism
    statement: >-
      The PSEPK pathway bucket contains the bioBFHCD cluster and the separate
      bioA gene, together with generic fatty-acid and biotin-utilization genes
      that require boundary curation.
  - source_id: GO:0009102
    title: biotin biosynthetic process
    statement: The module is grounded in the GO biological-process term for biotin synthesis.
  - source_id: PMID:10333520
    title: Characterization of the biotin biosynthesis pathway in Saccharomyces cerevisiae and evidence for a cluster containing BIO5, a novel gene involved in vitamer uptake.
    statement: >-
      BIO3 and BIO4 encode DAPA aminotransferase and dethiobiotin synthase;
      BIO5 encodes a KAPA uptake protein.
    supporting_text: >-
      We demonstrate that BIO3 (YNR058w) and BIO4 (YNR057c) encode,
      respectively, a 7, 8-diaminopelargonic acid aminotransferase and a dethiobiotin
      synthase, involved in the biotin biosynthesis pathway.
  - source_id: PMID:8117110
    title: 'The gene for biotin synthase from Saccharomyces cerevisiae: cloning, sequencing, and complementation of Escherichia coli strains lacking biotin synthase.'
    statement: BIO2 encodes yeast biotin synthase.
  - source_id: PMID:16269718
    title: Identification and characterization of a novel biotin biosynthesis gene in Saccharomyces cerevisiae.
    statement: >-
      BIO6, a BIO3 homologue present in sake and some laboratory strains, is
      required for biotin prototrophy and acts before KAPA.
    supporting_text: >-
      These results suggest that Bio6p acts in an unknown step of
      biotin synthesis before KAPA synthesis.
  - source_id: PMID:18073433
    title: The reacquisition of biotin prototrophy in Saccharomyces cerevisiae involved horizontal gene transfer, gene duplication and gene clustering.
    statement: >-
      BIO1 and BIO6 together restore biotin prototrophy to S288C; BIO1 is a
      paralogue of YJR154W, and the pathway was rebuilt in the Saccharomyces
      lineage by horizontal transfer and gene duplication.
    supporting_text: >-
      The biotin auxotroph strain S288c was
      able to grow on media lacking biotin when BIO1 and the known biotin synthesis
      gene BIO6 were introduced together on a plasmid vector.
  - source_id: PMID:32276977
    title: Exploiting the Diversity of Saccharomycotina Yeasts To Engineer Biotin-Independent Growth of Saccharomyces cerevisiae.
    statement: >-
      Bio1 is the bottleneck of yeast biotin synthesis, its catalytic function
      is unresolved, and biotin prototrophy conferred by Bio1 needs oxygen.
    supporting_text: >-
      identified Bio1, whose catalytic
      function remains unresolved, as a bottleneck in biotin synthesis
  - source_id: PMID:34052444
    title: Engineering oxygen-independent biotin biosynthesis in Saccharomyces cerevisiae.
    statement: >-
      De novo biotin synthesis in S. cerevisiae needs oxygen; expression of the
      E. coli pimelate-thioester route makes it oxygen-independent.
  - source_id: PMID:21998305
    title: Contributions of the peroxisome and β-oxidation cycle to biotin synthesis in fungi.
    statement: >-
      Fungal KAPA (AON) synthase is peroxisomal and uses pimeloyl-CoA from
      peroxisomal beta-oxidation; Saccharomyces species lack this enzyme and use
      a different route for the pimelate intermediate.
    supporting_text: >-
      AON synthases with PTS1 are found throughout the
      fungal kingdom, in ascomycetes, basidiomycetes, and members of basal fungal
      lineages but not in representatives of the Saccharomyces species complex,
      including Saccharomyces cerevisiae.
  - source_id: PMID:20713166
    title: Characterization of the Aspergillus nidulans biotin biosynthetic gene cluster and use of the bioDA gene as a new transformation marker.
    statement: >-
      In A. nidulans and many filamentous fungi, basidiomycetes and plants,
      DAPA aminotransferase and dethiobiotin synthetase are one bifunctional
      BioDA protein.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__biotin_biosynthesis__ppu00780-deep-research-openscientist.md
    title: OpenScientist module/pathway/taxon report for PSEPK biotin biosynthesis
    statement: >-
      Supports coverage of all six pathway-specific reactions, exclusion of
      BirA and generic fatty-acid-synthesis proteins from dedicated membership,
      and complete pathway satisfiability in KT2440. Individual enzyme
      assignments remain homology- and genomic-context-based rather than direct
      KT2440 biochemical evidence.
  - source_id: file:modules/biotin_biosynthesis-deep-research-openscientist.md
    title: OpenScientist research for the reusable BioC-BioH biotin pathway
    statement: >-
      The generic synthesis supports a six-enzyme BioC-BioH de novo route,
      with shared fatty-acid elongation between BioC and BioH treated as a
      dependency rather than dedicated pathway membership.
  - source_id: file:projects/P_PUTIDA/data/psepk_pathway_membership.tsv
    title: PSEPK pathway membership table
    statement: >-
      Supplies exact locus, gene-symbol, accession, and pathway-bucket mappings
      used for the PSEPK satisfiability pass.
