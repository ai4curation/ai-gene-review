id: MODULE:biotin_biosynthesis
title: De novo biotin biosynthesis via the BioC-BioH route
description: >-
  Bacterial de novo biotin synthesis in which BioC methylates malonyl-ACP,
  shared fatty-acid-synthase reactions extend the masked intermediate to
  pimeloyl-ACP methyl ester, and BioH removes the methyl group. BioF, BioA,
  BioD, and BioB then assemble the two-ring biotin cofactor. The module models
  the six pathway-specific enzymes; generic fatty-acid elongation machinery is
  an explicit dependency rather than a biotin-specific member, and biotin
  attachment and BirA-mediated regulation are outside the biosynthesis boundary.
status: DRAFT
evidence:
  - source_id: KEGG:ppu00780
    title: Pseudomonas putida KT2440 biotin metabolism
    statement: >-
      The PSEPK pathway bucket contains the bioBFHCD cluster and the separate
      bioA gene, together with generic fatty-acid and biotin-utilization genes
      that require boundary curation.
  - source_id: GO:0009102
    title: biotin biosynthetic process
    statement: The module is grounded in the GO biological-process term for biotin synthesis.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__biotin_biosynthesis__ppu00780-deep-research-openscientist.md
    title: OpenScientist module/pathway/taxon report for PSEPK biotin biosynthesis
    statement: >-
      Supports coverage of all six pathway-specific reactions, exclusion of
      BirA and generic fatty-acid-synthesis proteins from dedicated membership,
      and complete pathway satisfiability in KT2440. Individual enzyme
      assignments remain homology- and genomic-context-based rather than direct
      KT2440 biochemical evidence.
  - source_id: file:modules/biotin_biosynthesis-deep-research-openscientist.md
    title: OpenScientist research for the reusable BioC-BioH biotin pathway
    statement: >-
      The generic synthesis supports a six-enzyme BioC-BioH de novo route,
      with shared fatty-acid elongation between BioC and BioH treated as a
      dependency rather than dedicated pathway membership.
  - source_id: file:projects/P_PUTIDA/data/psepk_pathway_membership.tsv
    title: PSEPK pathway membership table
    statement: >-
      Supplies exact locus, gene-symbol, accession, and pathway-bucket mappings
      used for the PSEPK satisfiability pass.
  - source_id: UniProtKB:P12999
    title: Reviewed Escherichia coli BioC malonyl-ACP O-methyltransferase
    statement: >-
      P12999 is an experimentally characterized cross-species exemplar for
      malonyl-ACP methylation and the modified-fatty-acid-synthesis route.
  - source_id: UniProtKB:P13001
    title: Reviewed Escherichia coli BioH pimeloyl-ACP methyl ester esterase
    statement: >-
      P13001 is an experimentally characterized cross-species exemplar for
      pathway-specific hydrolysis of pimeloyl-ACP methyl ester.
  - source_id: UniProtKB:P12998
    title: Reviewed Escherichia coli BioF 8-amino-7-oxononanoate synthase
    statement: >-
      P12998 is an experimentally characterized cross-species exemplar for the
      pimeloyl-ACP and L-alanine condensation reaction.
  - source_id: UniProtKB:P12995
    title: Reviewed Escherichia coli BioA aminotransferase
    statement: >-
      P12995 is an experimentally characterized cross-species exemplar for
      SAM-dependent 7,8-diaminononanoate formation.
  - source_id: UniProtKB:P13000
    title: Reviewed Escherichia coli BioD dethiobiotin synthetase
    statement: >-
      P13000 is an experimentally characterized cross-species exemplar for
      ATP-dependent dethiobiotin ring closure.
  - source_id: UniProtKB:P12996
    title: Reviewed Escherichia coli BioB biotin synthase
    statement: >-
      P12996 is an experimentally characterized cross-species exemplar for the
      terminal radical-SAM sulfur-insertion reaction.
  - source_id: file:interpro/panther/PTHR13693/PTHR13693-paint.tsv
    title: PAINT assertions for the BioF family
    statement: >-
      PTN000343971 carries IBD assertions for GO:0008710 and GO:0009102,
      seeded in part by experimentally characterized E. coli P12998.
  - source_id: file:interpro/panther/PTHR42684/PTHR42684-paint.tsv
    title: PAINT assertions for the BioA family
    statement: >-
      PTN000241343 carries IBD assertions for GO:0004015 and GO:0009102,
      seeded in part by experimentally characterized E. coli P12995.
  - source_id: file:interpro/panther/PTHR43210/PTHR43210-paint.tsv
    title: PAINT assertions for the BioD family
    statement: >-
      PTN000482092 carries an IBD assertion for GO:0004141, seeded in part by
      experimentally characterized E. coli P13000.
  - source_id: file:interpro/panther/PTHR22976/PTHR22976-paint.tsv
    title: PAINT assertions for the BioB family
    statement: >-
      PTN000540961 carries IBD assertions for GO:0004076 and GO:0009102,
      seeded in part by experimentally characterized E. coli P12996.
