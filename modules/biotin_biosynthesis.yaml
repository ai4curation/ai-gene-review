                  statement: malonyl-ACP O-methyltransferase reaction
                  notes: EC 2.1.1.197
            role_description: >-
              Masks the free carboxyl group so the pimelate precursor can be
              assembled by the shared fatty-acid-synthase elongation cycle.
    - order: 2
