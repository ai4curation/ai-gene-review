    - gap_statement: >-
        Which step of this module each metabolite of the Streptomyces
        biotin-targeting megacluster acts on is not established by any reference
        cited here. The assignments commonly made in the wider literature —
        acidomycin/amiclenomycin inactivating the BioA (DAPA aminotransferase)
        step, α-Me-KAPA acting as a mimic of the KAPA intermediate, and
        streptavidin sequestering the biotin product downstream — are curator
        inference from the earlier amiclenomycin literature, not claims of
        PMID:42343126.
      boundary: >-
        What PMID:42343126 does establish is that the megacluster produces
        stravidins, acidomycin, dapamycins, α-Me-KAPA and streptavidin, and that
        these converge on bacterial biotin metabolism by enzyme inhibition,
        prodrug activation, cofactor mimicry and biotin sequestration. Its
        cached record is abstract-only (full_text_available: false) and names no
        individual enzyme, so neither the target step nor any inhibition
        kinetics can be read from it.
      gap_kind:
        - CURATION
      status: OPEN
      resolution: >-
        Cite the primary amiclenomycin/acidomycin literature for the BioA-target
        assignment, or obtain the full text of PMID:42343126, before attaching
        any inhibitor to a specific part of this module.
