id: MODULE:biotin_biosynthesis
title: Bacterial de novo biotin biosynthesis — the conserved KAPA→DAPA→dethiobiotin→biotin core (BioF/BioA/BioD/BioB)
description: >-
  De novo biosynthesis of the cofactor biotin (vitamin B7) in bacteria proceeds
  through a conserved four-step terminal pathway that converts a pimeloyl
  thioester and simple amino donors into the fused bicyclic biotin ring. In the
  canonical route: (1) the pyridoxal-5'-phosphate (PLP) enzyme 8-amino-7-
  oxononanoate synthase (BioF) condenses a pimeloyl thioester (pimeloyl-[acyl-
  carrier protein] in Escherichia coli) with L-alanine to give 8-amino-7-
  oxononanoate (KAPA, also called 7-keto-8-aminopelargonic acid); (2) the PLP
  aminotransferase adenosylmethionine-8-amino-7-oxononanoate transaminase (BioA)
  transaminates KAPA to 7,8-diaminononanoate (DAPA), using S-adenosyl-L-
  methionine — rather than glutamate — as the unusual amino donor; (3) the ATP-
  and Mg2+-dependent dethiobiotin synthetase (BioD) closes the ureido ring by
  carboxylating DAPA to dethiobiotin; and (4) the radical-S-adenosylmethionine
  iron–sulfur enzyme biotin synthase (BioB) inserts sulfur across the C6–C9
  positions of dethiobiotin to complete the thiophane ring, yielding biotin.
  This KAPA→DAPA→dethiobiotin→biotin core (the BioF/BioA/BioD/BioB steps) is
  strongly conserved across Gram-negative bacteria and mycobacteria and is
  absent from humans, who obtain biotin from diet and gut microbiota, which is
  why it is an attractive antibacterial target. The upstream stage that builds
  the pimeloyl thioester (BioC/BioH in E. coli; BioW/BioI or other routes in
  other taxa) is taxonomically variable and is treated here as context rather
  than as a modeled part.
status: DRAFT
evidence:
  - source_id: GO:0009102
    title: biotin biosynthetic process
    statement: >-
      All four enzymes of the module are annotated to the GO biotin biosynthetic
      process (GO:0009102), the process this metabolic module realizes.
  - source_id: UniProtKB:P12998
    title: 8-amino-7-oxononanoate synthase (BioF), E. coli K-12
    statement: >-
      Step-1 grounding: bioF (P12998), EC 2.3.1.47, GO:0008710 8-amino-7-
      oxononanoate synthase activity, Rhea:42288, PANTHER PTHR13693:SF100
      (the 8-amino-7-oxononanoate synthase subfamily, not the whole
      alpha-oxoamine synthase superfamily PTHR13693, which also contains
      serine palmitoyltransferase, ALAS and GCAT subfamilies).
  - source_id: UniProtKB:P12995
    title: Adenosylmethionine-8-amino-7-oxononanoate aminotransferase (BioA), E. coli K-12
    statement: >-
      Step-2 grounding: bioA (P12995), EC 2.6.1.62, GO:0004015 adenosylmethionine-
      8-amino-7-oxononanoate transaminase activity, Rhea:16861, PANTHER PTHR42684.
  - source_id: UniProtKB:P13000
    title: ATP-dependent dethiobiotin synthetase (BioD), E. coli K-12
    statement: >-
      Step-3 grounding: bioD (P13000), EC 6.3.3.3, GO:0004141 dethiobiotin
      synthase activity, Rhea:15805, PANTHER PTHR43210.
  - source_id: UniProtKB:P12996
    title: Biotin synthase (BioB), E. coli K-12
    statement: >-
      Step-4 grounding: bioB (P12996), EC 2.8.1.6, GO:0004076 biotin synthase
      activity, Rhea:22060, PANTHER PTHR22976.
  - source_id: PMID:42343126
    title: A Streptomyces megacluster encodes synergistic biotin-targeting antibiotics
    statement: >-
      A conserved Streptomyces biosynthetic megacluster produces four natural-
      product families (stravidins, acidomycin, dapamycins, α-Me-KAPA) plus the
      biotin-binding protein streptavidin, which converge on bacterial biotin
      metabolism by enzyme inhibition, prodrug activation, cofactor mimicry and
      biotin sequestration — motivating this module as a druggable target
      pathway.
    supporting_text: >-
      These components converge on bacterial biotin metabolism through
      complementary mechanisms, including enzyme inhibition, prodrug activation,
      cofactor mimicry and biotin sequestration.
    notes: >-
      Curator caveat: this record is abstract-only (full_text_available: false)
      and the abstract names no individual enzyme. It therefore does not itself
      establish which pathway step any given metabolite acts on, nor any
      inhibition kinetics. The commonly-made step-level assignments are recorded
      as a knowledge gap rather than asserted here (see module.knowledge_gaps).
module:
  id: biotin_biosynthesis
  label: Bacterial de novo biotin biosynthesis (BioF → BioA → BioD → BioB)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: biotin biosynthetic process
      term:
        id: GO:0009102
        label: biotin biosynthetic process
      description: >-
        De novo assembly of the biotin bicyclic ring from a pimeloyl thioester
        and amino/sulfur donors through the conserved KAPA → DAPA → dethiobiotin
        → biotin sequence.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          This module is scoped to bacterial de novo biotin biosynthesis. The
          scope is what the participant selectors are drawn against: the BioF
          selector rests on the bacteria-scoped PAINT node PTN000343971
          (taxon:2), and both the PTHR13693:SF77 and PTHR42684:SF3 exclusions
          argued in knowledge_gaps are taxonomic rather than functional. Archaeal
          and eukaryotic members of the same PANTHER families (e.g. the archaeal
          HcgA proteins inside PTHR22976, the fungal/plant SF77 BioF proteins)
          are therefore out of scope for this module even where they fall inside
          a family selector.
  parts:
    - order: 1
      role: KAPA (8-amino-7-oxononanoate) formation — entry into the biotin amino stage
      node:
        id: biof_step
        label: pimeloyl-[ACP] + L-alanine -> 8-amino-7-oxononanoate (KAPA) + CO2 + holo-[ACP]
        module_type: REACTION
        annotons:
          - id: biof_activity
            label: "BioF: 8-amino-7-oxononanoate synthase (KAPA synthase)"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: 8-amino-7-oxononanoate synthase subfamily (BioF)
                description: >-
                  Grounded to the PTHR13693:SF100 subfamily (270 members) rather
                  than the parent family PTHR13693, which is the whole
                  alpha-oxoamine synthase superfamily and also contains the
                  serine palmitoyltransferase (SF2/SF54/SF79), ALAS (SF58), GCAT
                  (SF102) and LCB2B (SF104) subfamilies — none of which act in
                  biotin biosynthesis. SF100 is not the only AONS subfamily in
                  PTHR13693: SF77 (11 members) carries the identical subfamily
                  name 8-AMINO-7-OXONONANOATE SYNTHASE and contains genuine BioF
                  orthologs, including bacterial ones (Helicobacter pylori
                  O25320/Q9ZLN3, Aquifex aeolicus O66875) alongside archaeal
                  (Q58694, A6UQL9, A6UWX3), fungal (C8V1D1) and plant (Q8GW43)
                  members. SF77 is deliberately excluded from this selector
                  because the PAINT grounding used for this step —
                  PTN000343971, scoped to taxon:2 and seeded by UniProtKB:P12998
                  and UniProtKB:P9WQ87 — sits over SF100 members only, and SF77
                  spans lineages outside this module's bacterial scope (its own
                  PAINT node PTN001008501 is fungal, taxon:4751). The
                  consequence is a known and accepted coverage gap: SF77
                  bacterial BioF such as H. pylori HP_0598 is not matched by
                  this participant (see knowledge_gaps).
                term:
                  id: PANTHER:PTHR13693:SF100
                  label: 8-AMINO-7-OXONONANOATE SYNTHASE
                representative_members:
                  - preferred_term: BioF (E. coli K-12)
                    term:
                      id: UniProtKB:P12998
                      label: 8-amino-7-oxononanoate synthase
            function:
              preferred_term: 8-amino-7-oxononanoate synthase activity
              term:
                id: GO:0008710
                label: 8-amino-7-oxononanoate synthase activity
              substrates:
                - preferred_term: pimeloyl-[acyl-carrier protein]
                - preferred_term: L-alanine
              products:
                - preferred_term: 8-amino-7-oxononanoate (KAPA)
                - preferred_term: carbon dioxide
                - preferred_term: holo-[acyl-carrier protein]
              evidence:
                - source_id: EC:2.3.1.47
                  statement: 8-amino-7-oxononanoate synthase (AONS / KAPA synthase)
                - source_id: RHEA:42288
                  statement: 6-carboxyhexanoyl-[ACP] + L-alanine + H(+) = (8S)-8-amino-7-oxononanoate + holo-[ACP] + CO2
                - source_id: PANTHER:PTN000343971
                  statement: >-
                    Bacteria-scoped PAINT ancestral node (taxon:2) in PTHR13693
                    asserting GO:0008710 and GO:0009102 by IBD, seeded by
                    UniProtKB:P12998 (E. coli BioF) and UniProtKB:P9WQ87
                    (M. tuberculosis BioF); the eukaryotic sibling nodes of the
                    same family instead carry GO:0003870 (ALAS) and GO:0004758
                    (serine palmitoyltransferase).
                  url: file:interpro/panther/PTHR13693/PTHR13693-paint.tsv
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              PLP-dependent condensation of a pimeloyl thioester with L-alanine,
              with concomitant decarboxylation, to form the first biotin-pathway
              intermediate KAPA (8-amino-7-oxononanoate). This is the committed
              entry into the conserved amino/diamino stage of biotin synthesis.
    - order: 2
      role: transamination of KAPA to the diamine DAPA (SAM as amino donor)
      node:
        id: bioa_step
        label: 8-amino-7-oxononanoate (KAPA) + S-adenosyl-L-methionine -> 7,8-diaminononanoate (DAPA) + S-adenosyl-4-methylsulfanyl-2-oxobutanoate
        module_type: REACTION
        annotons:
          - id: bioa_activity
            label: "BioA: adenosylmethionine-8-amino-7-oxononanoate transaminase (DAPA aminotransferase)"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Adenosylmethionine-8-amino-7-oxononanoate transaminase subfamily (BioA)
                description: >-
                  Grounded to the PTHR42684:SF17 subfamily rather than the parent
                  family PTHR42684, which is a broader class-III aminotransferase
                  family also containing the beta-alanine--pyruvate (SF1) and
                  gamma-aminobutyrate transaminase (SF8/SF10/SF19/SF20)
                  subfamilies, none of which act in biotin biosynthesis. SF17 is
                  the bacterial BioA subfamily: all 29 members catalyse this same
                  KAPA -> DAPA step of the biotin pathway (including the fused
                  BioAB proteins of Bacteroides), and it contains the E. coli K-12
                  representative P12995. Note that the eukaryotic BioA equivalents
                  (S. cerevisiae BIO3, the plant bifunctional BIO3-BIO1) are placed
                  in SF3 instead, so this selector is bacteria-scoped, matching the
                  module's scope. The step is chemically uniform but the amino
                  donor is not: SF17 also contains the L-lysine-dependent BioK
                  variant (Bacillus subtilis P53555), for which the SAM-specific
                  function asserted on this annoton does not hold — recorded as a
                  knowledge gap rather than qualified here (see knowledge_gaps).
                term:
                  id: PANTHER:PTHR42684:SF17
                  label: ADENOSYLMETHIONINE-8-AMINO-7-OXONONANOATE AMINOTRANSFERASE
                representative_members:
                  - preferred_term: BioA (E. coli K-12)
                    term:
                      id: UniProtKB:P12995
                      label: Adenosylmethionine-8-amino-7-oxononanoate aminotransferase
            function:
              preferred_term: S-adenosyl-L-methionine:8-amino-7-oxononanoate transaminase activity
              term:
                id: GO:0004015
                label: S-adenosyl-L-methionine:8-amino-7-oxononanoate transaminase activity
              substrates:
                - preferred_term: 8-amino-7-oxononanoate (KAPA)
                - preferred_term: S-adenosyl-L-methionine
              products:
                - preferred_term: 7,8-diaminononanoate (DAPA)
                - preferred_term: S-adenosyl-4-methylsulfanyl-2-oxobutanoate
              evidence:
                - source_id: EC:2.6.1.62
                  statement: adenosylmethionine-8-amino-7-oxononanoate transaminase (DAPA aminotransferase)
                - source_id: RHEA:16861
                  statement: (8S)-8-amino-7-oxononanoate + S-adenosyl-L-methionine = S-adenosyl-4-methylsulfanyl-2-oxobutanoate + (7R,8S)-7,8-diammoniononanoate
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              PLP-dependent aminotransferase that installs the second (C7) amino
              group, converting KAPA to the diamine DAPA. Unusually it uses
              S-adenosyl-L-methionine, not glutamate, as the amino donor.
    - order: 3
      role: ureido-ring closure — carboxylation of DAPA to dethiobiotin
      node:
        id: biod_step
        label: 7,8-diaminononanoate (DAPA) + CO2 + ATP -> dethiobiotin + ADP + phosphate
        module_type: REACTION
        annotons:
          - id: biod_activity
            label: "BioD: ATP-dependent dethiobiotin synthetase"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Dethiobiotin synthetase family (BioD)
                description: >-
                  Kept at family level deliberately, not for want of checking.
                  The same paralog-contamination audit that forced subfamily
                  narrowing for BioF and BioA was run against
                  interpro/panther/PTHR43210/PTHR43210-entries.csv and came back
                  clean: of the 256 members, 254 are named as dethiobiotin
                  synthetase BioD (236 "ATP-dependent dethiobiotin synthetase
                  BioD" plus paralog-numbered BioD 1/BioD 2 copies), one is the
                  bifunctional BioCD protein of Bordetella avium (Q2KXN6, whose
                  BioD half catalyses this same step), and one is uncharacterized
                  (Synechocystis slr0039). The family carries no non-biotin
                  enzyme class, so PTHR43210 as a whole is functionally
                  equivalent to its BioD subfamilies (SF5/SF2/SF4, which split
                  by clade rather than by chemistry) and narrowing would only
                  shrink coverage.
                term:
                  id: PANTHER:PTHR43210
                  label: DETHIOBIOTIN SYNTHETASE
                representative_members:
                  - preferred_term: BioD (E. coli K-12)
                    term:
                      id: UniProtKB:P13000
                      label: ATP-dependent dethiobiotin synthetase BioD
            function:
              preferred_term: dethiobiotin synthase activity
              term:
                id: GO:0004141
                label: dethiobiotin synthase activity
              substrates:
                - preferred_term: 7,8-diaminononanoate (DAPA)
                - preferred_term: carbon dioxide
                - preferred_term: ATP
              products:
                - preferred_term: dethiobiotin
                - preferred_term: ADP
                - preferred_term: phosphate
              evidence:
                - source_id: EC:6.3.3.3
                  statement: dethiobiotin synthase (DTBS)
                - source_id: RHEA:15805
                  statement: (7R,8S)-7,8-diammoniononanoate + CO2 + ATP = (4R,5S)-dethiobiotin + ADP + phosphate + 3 H(+)
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              ATP- and Mg2+-dependent ligase that fixes CO2 onto the two amino
              groups of DAPA to form the cyclic ureido (imidazolidone) ring of
              dethiobiotin — the penultimate biotin-pathway intermediate.
    - order: 4
      role: sulfur insertion — thiophane-ring closure to biotin
      node:
        id: biob_step
        label: dethiobiotin + sulfur donor + 2 S-adenosyl-L-methionine -> biotin + 2 L-methionine + 2 5'-deoxyadenosine
        module_type: REACTION
        annotons:
          - id: biob_activity
            label: "BioB: biotin synthase (radical-SAM Fe-S enzyme)"
            participant:
              selector_type: FAMILY
              family:
                preferred_term: Biotin synthase family (BioB)
                description: >-
                  Kept at family level deliberately. PANTHER places all 590
                  members of PTHR22976 in a single subfamily, PTHR22976:SF2
                  (interpro/panther/PTHR22976/PTHR22976-entries.csv), so
                  subfamily narrowing is not available here — and SF2's name
                  ("BIOTIN SYNTHASE, MITOCHONDRIAL") would misdescribe the
                  bacterial members that make up the bulk of it. The family is
                  functionally clean: 587 members are named biotin synthase
                  (including the 3 mitochondrial ones), one is uncharacterized
                  (Methanocaldococcus jannaschii Q58014/MJ0597), and the only
                  genuine functional outliers are the two archaeal HcgA proteins
                  (Q58195 M. jannaschii, Q6M0Z2 Methanococcus maripaludis),
                  radical-SAM relatives that act in [Fe]-hydrogenase cofactor
                  biosynthesis rather than in biotin biosynthesis. Both are
                  archaeal and so fall outside this module's bacterial scope
                  (module.context.taxa), which is why they are noted here rather
                  than treated as a selector defect.
                term:
                  id: PANTHER:PTHR22976
                  label: BIOTIN SYNTHASE
                representative_members:
                  - preferred_term: BioB (E. coli K-12)
                    term:
                      id: UniProtKB:P12996
                      label: Biotin synthase
            function:
              preferred_term: biotin synthase activity
              term:
                id: GO:0004076
                label: biotin synthase activity
              substrates:
                - preferred_term: dethiobiotin
                - preferred_term: sulfur-carrier protein (thiocarboxylated)
                - preferred_term: S-adenosyl-L-methionine
              products:
                - preferred_term: biotin
                - preferred_term: L-methionine
                - preferred_term: 5'-deoxyadenosine
              evidence:
                - source_id: EC:2.8.1.6
                  statement: biotin synthase (radical-SAM sulfur insertion)
                - source_id: RHEA:22060
                  statement: >-
                    (4R,5S)-dethiobiotin + (sulfur carrier)-SH + 2 reduced
                    [2Fe-2S]-[ferredoxin] + 2 S-adenosyl-L-methionine = (sulfur
                    carrier)-H + biotin + 2 5'-deoxyadenosine + 2 L-methionine + 2
                    oxidized [2Fe-2S]-[ferredoxin]
                  notes: >-
                    Rhea models the sulfur donor as an abstract (sulfur carrier)-SH /
                    (sulfur carrier)-H pair and the [2Fe-2S]-[ferredoxin] couple as
                    the electron donor; the two are distinct. The sacrificial
                    auxiliary-cluster mechanism described in role_description is a
                    separate mechanistic claim about the enzyme's own [2Fe-2S]
                    cluster and is not asserted by this reaction.
            locations:
              - preferred_term: cytoplasm
                term:
                  id: GO:0005737
                  label: cytoplasm
            role_description: >-
              Radical-S-adenosylmethionine [4Fe-4S] enzyme that reductively cleaves
              two molecules of SAM to abstract hydrogens from C6 and C9 of
              dethiobiotin and insert sulfur, closing the thiophane ring to yield
              mature biotin. The final step of the pathway. In the mainstream
              E. coli model the immediate sulfur donor is the enzyme's own
              sacrificial auxiliary [2Fe-2S] cluster, which makes turnover
              effectively single-cycle in vitro pending cluster regeneration; that
              mechanism is a claim about the enzyme, not a transcription of
              RHEA:22060, which models the donor abstractly as a sulfur-carrier
              protein.
  connections:
    - source: biof_step
      target: bioa_step
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      description: >-
        KAPA (8-amino-7-oxononanoate) produced by BioF is the substrate
        transaminated by BioA.
    - source: bioa_step
      target: biod_step
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      description: >-
        DAPA (7,8-diaminononanoate) produced by BioA is the substrate
        carboxylated by BioD.
    - source: biod_step
      target: biob_step
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      description: >-
        Dethiobiotin produced by BioD is the substrate on which BioB performs
        sulfur insertion to give biotin.
  knowledge_gaps:
    - gap_statement: >-
        Which step of this module each metabolite of the Streptomyces
        biotin-targeting megacluster acts on is not established by any reference
        cited here. The assignments commonly made in the wider literature —
        acidomycin/amiclenomycin inactivating the BioA (DAPA aminotransferase)
        step, α-Me-KAPA acting as a mimic of the KAPA intermediate, and
        streptavidin sequestering the biotin product downstream — are curator
        inference from the earlier amiclenomycin literature, not claims of
        PMID:42343126.
      boundary: >-
        What PMID:42343126 does establish is that the megacluster produces
        stravidins, acidomycin, dapamycins, α-Me-KAPA and streptavidin, and that
        these converge on bacterial biotin metabolism by enzyme inhibition,
        prodrug activation, cofactor mimicry and biotin sequestration. Its
        cached record is abstract-only (full_text_available: false) and names no
        individual enzyme, so neither the target step nor any inhibition
        kinetics can be read from it.
      gap_kind:
        - CURATION
      status: OPEN
      resolution: >-
        Cite the primary amiclenomycin/acidomycin literature for the BioA-target
        assignment, or obtain the full text of PMID:42343126, before attaching
        any inhibitor to a specific part of this module.
      provenance:
        - reference_id: PMID:42343126
          supporting_text: >-
            These components converge on bacterial biotin metabolism through
            complementary mechanisms, including enzyme inhibition, prodrug
            activation, cofactor mimicry and biotin sequestration.
          full_text_unavailable: true
          reference_section_type: ABSTRACT
    - gap_statement: >-
        The BioF participant selector PTHR13693:SF100 does not cover every
        bacterial 8-amino-7-oxononanoate synthase. PTHR13693:SF77 carries the
        identical subfamily name and holds bona fide bacterial BioF orthologs
        (Helicobacter pylori O25320/Q9ZLN3, Aquifex aeolicus O66875) that this
        module therefore does not match.
      boundary: >-
        SF100 (270 members) is correctly grounded: the bacteria-scoped PAINT
        node PTN000343971 (taxon:2) asserts GO:0008710 and GO:0009102 by IBD,
        seeded by UniProtKB:P12998 (E. coli BioF) and UniProtKB:P9WQ87
        (M. tuberculosis BioF1), and both seeds are SF100 members. SF77 has only
        11 members, and the two other PTHR13693 nodes carrying GO:0009102 are
        both scoped outside this module's bacterial range: PTN001008501 is
        fungal (taxon:4751, seeded by UniProtKB:C8V1D1, an SF77 member) and
        PTN000343964 is plant (taxon:33090, seeded by AGI_LocusCode:AT5G04620;
        the sole Arabidopsis SF77 member in the cached entries file is Q8GW43,
        gene BIOF). SF77 members span archaea (Q58694, A6UQL9, A6UWX3), fungi
        (C8V1D1, B0XZV7, A0A443I7W9) and plants (Q8GW43) as well as bacteria,
        which is consistent with its PAINT grounding being non-bacterial; there
        is no bacteria-scoped PAINT node to extend the selector over.
      gap_kind:
        - CURATION
      status: OPEN
      resolution: >-
        Either add SF77 as a second family selector for the BioF step once a
        bacteria-scoped grounding for it exists, or confirm with PANTHER that
        the SF100/SF77 split is a clustering artefact and the two should be
        treated as one AONS subfamily.
      provenance:
        - reference_id: file:interpro/panther/PTHR13693/PTHR13693-entries.csv
          supporting_text: >-
            O25320,8-amino-7-oxononanoate synthase,protein,85962,Helicobacter
            pylori (strain ATCC 700392 / 26695),Helicobacter pylori (strain ATCC
            700392 / 26695),HP_0598,373,PTHR13693:SF77,8-AMINO-7-OXONONANOATE
            SYNTHASE,True
          reference_section_type: DATABASE_ENTRY
        - reference_id: file:interpro/panther/PTHR13693/PTHR13693-paint.tsv
          supporting_text: |-
            PTHR13693	PTN000343964	GO:0009102	P	IBD	false	AGI_LocusCode:AT5G04620	taxon:33090	20230406
            PTHR13693	PTN000343971	GO:0008710	F	IBD	false	UniProtKB:P12998|UniProtKB:P9WQ87	taxon:2	20200206
            PTHR13693	PTN000343971	GO:0009102	P	IBD	false	UniProtKB:P9WQ87|UniProtKB:P12998	taxon:2	20200206
            PTHR13693	PTN001008501	GO:0009102	P	IBD	false	UniProtKB:C8V1D1	taxon:4751	20230406
          reference_section_type: DATABASE_ENTRY
        - reference_id: file:interpro/panther/PTHR13693/PTHR13693-entries.csv
          supporting_text: >-
            Q8GW43,8-amino-7-oxononanoate synthase,protein,3702,Arabidopsis
            thaliana,Arabidopsis thaliana (Mouse-ear
            cress),BIOF,476,PTHR13693:SF77,8-AMINO-7-OXONONANOATE
            SYNTHASE,True
          reference_section_type: DATABASE_ENTRY
    - gap_statement: >-
        The bioa_activity annoton asserts one amino-donor chemistry
        (GO:0004015, S-adenosyl-L-methionine as donor) across the whole
        PTHR42684:SF17 selector, but SF17 is not uniform in that respect: it also
        contains the L-lysine-dependent BioK-type DAPA transaminase of Bacillus
        subtilis (UniProtKB:P53555, gene bioK), for which the asserted donor —
        and hence the substrate/product pair modelled on this step — is wrong.
        How the module should represent the two donor chemistries is undecided.
      boundary: >-
        The step itself is uniform and not in doubt: every SF17 member converts
        KAPA to DAPA by PLP-dependent transamination at C7, and the SAM-dependent
        assertion is correct for the great majority of the subfamily, including
        the E. coli K-12 representative P12995 on which this annoton is grounded.
        What varies is only the amino donor. GO offers no term for the
        lysine-dependent variant: a GO search via OLS for the 8-amino-7-
        oxononanoate transaminase / 7,8-diaminononanoate synthase step returns
        GO:0004015 alone, and its definition is explicitly SAM-specific
        ("(8S)-8-amino-7-oxononanoate + S-adenosyl-L-methionine = ..."), so BioK
        cannot currently be typed correctly even if it were split out.
