  - source_id: UniProtKB:P12998
    title: Reviewed Escherichia coli BioF 8-amino-7-oxononanoate synthase
    statement: >-
      P12998 is an experimentally characterized cross-species exemplar for the
      pimeloyl-ACP and L-alanine condensation reaction.
  - source_id: UniProtKB:P12995
    title: Reviewed Escherichia coli BioA aminotransferase
    statement: >-
      P12995 is an experimentally characterized cross-species exemplar for
      SAM-dependent 7,8-diaminononanoate formation.
  - source_id: UniProtKB:P13000
    title: Reviewed Escherichia coli BioD dethiobiotin synthetase
    statement: >-
      P13000 is an experimentally characterized cross-species exemplar for
      ATP-dependent dethiobiotin ring closure.
  - source_id: UniProtKB:P12996
    title: Reviewed Escherichia coli BioB biotin synthase
    statement: >-
      P12996 is an experimentally characterized cross-species exemplar for the
