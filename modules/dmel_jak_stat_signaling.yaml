id: MODULE:dmel_jak_stat_signaling
title: JAK-STAT signaling pathway in Drosophila melanogaster
description: >-
  The Drosophila JAK-STAT pathway has a minimal set of core components. The secreted Unpaired
  cytokines (Upd1, Upd2, Upd3) bind the receptor Domeless, which is related to vertebrate
  gp130-type cytokine receptors. Receptor activation stimulates the associated Janus kinase
  Hopscotch, which phosphorylates Domeless and the single STAT, Stat92E. Phosphorylated Stat92E
  dimerizes, enters the nucleus and activates target genes. The pathway acts in embryonic
  segmentation, stem cell maintenance, hematopoiesis, intestinal regeneration, cellular immunity
  and stress responses.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000883
  title: 'FlyBase gene group JAKSTAT: Jak-stat signaling pathway'
  statement: >-
    FlyBase release FB2026_03 groups 41 D. melanogaster genes as jak-stat signaling pathway
    (JAKSTAT); this module models that group.
- source_id: GO:0007259
  title: cell surface receptor signaling pathway via JAK-STAT
  statement: >-
    GO term grounding the module as cell surface receptor signaling pathway via JAK-STAT.
notes: >-
  Boundary. Core components only (FlyBase JAKSTAT-C). The decoy receptor Latran, Socs36E,
  Ptp61F, Stat92E-interacting cofactors and other FlyBase regulators are not parts. FlyBase
  groups realized by this module: JAKSTAT (FBgg0000883). Subgroups folded into it: JAKSTAT-C.
  FlyBase also curates regulator sets for this pathway, which are context and not modelled
  as parts: JAKSTAT-P (positive regulators of jak-stat signaling pathway, 16 genes); JAKSTAT-N
  (negative regulators of jak-stat signaling pathway, 19 genes). Participants were generated
  from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_jak_stat_signaling.yaml. Genes without a UniProtKB entry (mostly
  non-coding RNAs) are grounded to their FlyBase gene ids. None of the member genes has a
  gene review yet unless noted.
