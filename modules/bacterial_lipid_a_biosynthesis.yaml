                label: tetraacyldisaccharide 4'-kinase activity
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: Phosphorylates the tetraacylated lipid disaccharide.
    - order: 3
      role: Kdo precursor synthesis and transfer to lipid IV(A)
      node:
