id: MODULE:bacterial_lipid_a_biosynthesis
title: Bacterial lipid A biosynthesis
description: >-
  Reusable Gram-negative bacterial module for synthesis of Kdo-decorated lipid
  A from UDP-N-acetylglucosamine. The pathway is divided into early glucosamine
  acylation, lipid-disaccharide formation and phosphorylation, Kdo precursor
  supply and transfer, and late secondary acylation. Optional remodeling after
  lipid A synthesis is outside this core module.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009245
    title: lipid A biosynthetic process
    statement: >-
      GO:0009245 grounds the conserved Raetz pathway that constructs lipid A.
  - source_id: KEGG:ppu00540
    title: Pseudomonas putida KT2440 lipopolysaccharide biosynthesis
    statement: >-
      KEGG ppu00540 identifies the KT2440 enzymes for lipid A and Kdo assembly.
notes: >-
  KT2440 encodes two KdsA paralogs, KdsA1 and KdsA2; either family member can
  satisfy the Kdo-8-phosphate synthase role, but this module does not assert
  equal physiological contribution. PP_0063 is a second late lipid A
  acyltransferase-family protein. PagL deacylases and LpxO-family hydroxylases
  remodel lipid A after core synthesis and are excluded.
module:
  id: bacterial_lipid_a_biosynthesis
  label: Kdo-decorated lipid A biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: lipid A biosynthetic process
      term:
        id: GO:0009245
        label: lipid A biosynthetic process
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
  parts:
    - order: 1
      role: early UDP-glucosamine acylation
      node:
        id: early_glucosamine_acylation
        label: UDP-glucosamine acylation and deacetylation
        module_type: METABOLIC_PATHWAY
        description: >-
          LpxA installs the first acyl chain, LpxC removes the acetyl group, and
          LpxD installs the second acyl chain to produce UDP-2,3-diacylglucosamine.
        annotons:
          - id: lpxa_first_acyltransferase
            label: LpxA first acyltransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LpxA family
                term:
                  id: PANTHER:PTHR43480
                  label: UDP-N-acetylglucosamine acyltransferase
                representative_members:
                  - preferred_term: PSEPK LpxA exemplar
                    term:
                      id: UniProtKB:Q88MG8
                      label: UDP-N-acetylglucosamine acyltransferase
            function:
              preferred_term: UDP-N-acetylglucosamine acyltransferase activity
              term:
                id: GO:0008780
                label: UDP-N-acetylglucosamine acyltransferase activity
            role_description: Transfers a hydroxyacyl chain from acyl-ACP to UDP-GlcNAc.
          - id: lpxc_deacetylase
            label: LpxC deacetylase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LpxC family
                term:
                  id: PANTHER:PTHR33694
                  label: UDP-3-O-acyl-N-acetylglucosamine deacetylase
                representative_members:
                  - preferred_term: PSEPK LpxC exemplar
                    term:
                      id: UniProtKB:Q88N71
                      label: UDP-3-O-acyl-N-acetylglucosamine deacetylase
            function:
              preferred_term: UDP-3-O-acyl-N-acetylglucosamine deacetylase activity
              term:
                id: GO:0103117
                label: UDP-3-O-acyl-N-acetylglucosamine deacetylase activity
            role_description: Commits the first acylated intermediate to lipid A synthesis.
          - id: lpxd_second_acyltransferase
            label: LpxD second acyltransferase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LpxD family
                term:
                  id: PANTHER:PTHR43378
                  label: UDP-3-O-acylglucosamine N-acyltransferase
                representative_members:
                  - preferred_term: PSEPK LpxD exemplar
                    term:
                      id: UniProtKB:Q88MH0
                      label: UDP-3-O-acylglucosamine N-acyltransferase
            function:
              preferred_term: UDP-3-O-[(3R)-3-hydroxyacyl]-glucosamine N-acyltransferase activity
              term:
                id: GO:0103118
                label: UDP-3-O-[(3R)-3-hydroxyacyl]-glucosamine N-acyltransferase activity
            role_description: Produces UDP-2,3-diacylglucosamine.
    - order: 2
      role: lipid-disaccharide formation and phosphorylation
      node:
        id: lipid_disaccharide_formation
        label: Lipid IV(A) formation
        module_type: METABOLIC_PATHWAY
        description: >-
          LpxH releases lipid X, LpxB condenses lipid X with a second
          diacylglucosamine unit, and LpxK phosphorylates the disaccharide.
        annotons:
          - id: lpxh_lipid_x_hydrolase
            label: LpxH lipid X-forming hydrolase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LpxH family
                term:
                  id: PANTHER:PTHR34990
                  label: UDP-2,3-diacylglucosamine hydrolase
                representative_members:
                  - preferred_term: PSEPK LpxH exemplar
                    term:
                      id: UniProtKB:Q88IU7
                      label: UDP-2,3-diacylglucosamine hydrolase
            function:
              preferred_term: UDP-2,3-diacylglucosamine hydrolase activity
              term:
                id: GO:0008758
                label: UDP-2,3-diacylglucosamine hydrolase activity
            role_description: Hydrolyzes UDP-2,3-diacylglucosamine to lipid X.
          - id: lpxb_disaccharide_synthase
