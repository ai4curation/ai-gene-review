        label: CMP-Kdo synthesis and Kdo transfer
        module_type: METABOLIC_PATHWAY
        description: >-
          KdsD, KdsA, KdsC, and KdsB produce activated CMP-Kdo. WaaA transfers
          Kdo residues to lipid IV(A), licensing late acylation.
        annotons:
          - id: kdsd_arabinose_5p_isomerase
            label: KdsD arabinose-5-phosphate isomerase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: KdsD family
                term:
                  id: PANTHER:PTHR42745
                  label: arabinose-5-phosphate isomerase
                representative_members:
                  - preferred_term: PSEPK KdsD exemplar
