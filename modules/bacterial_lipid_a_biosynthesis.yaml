                representative_members:
                  - preferred_term: PSEPK LpxB exemplar
                    term:
                      id: UniProtKB:Q88MG7
                      label: lipid-A-disaccharide synthase
            function:
              preferred_term: lipid-A-disaccharide synthase activity
              term:
                id: GO:0008915
                label: lipid-A-disaccharide synthase activity
            role_description: Condenses lipid X with UDP-diacylglucosamine.
          - id: lpxk_lipid_a_kinase
            label: LpxK lipid A 4-prime kinase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: LpxK family
                term:
                  id: PANTHER:PTHR42724
                  label: tetraacyldisaccharide 4'-kinase
                representative_members:
                  - preferred_term: PSEPK LpxK exemplar
                    term:
                      id: UniProtKB:Q88LM9
                      label: tetraacyldisaccharide 4'-kinase
            function:
              preferred_term: tetraacyldisaccharide 4'-kinase activity
              term:
