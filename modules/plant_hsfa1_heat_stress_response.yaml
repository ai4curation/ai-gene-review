notes: >-
  Relation to MODULE:heat_shock_response. That module covers the eukaryotic HSF-to-chaperone logic with
  opisthokont representatives only (human, yeast and worm), and its small HSP node is placed at
  Eumetazoa. This plant module was built as a separate concrete instance rather than an extension of
  it. It adds the plant-specific HSFA1 multi-gene master tier and the secondary transcription factor
  cascade (DREB2A -> HSFA3, HSFA2), which have no counterpart in the generic module. It also adds the
  HSP101/ClpB disaggregase, which is absent from metazoans. Hsp70 J-domain and nucleotide-exchange
  cofactors are not re-modelled here. A later option is to add an Arabidopsis HSFA1 variant to the
  generic module's activation-mode variant set.

  Boundary. Upstream heat sensing (membrane fluidity, Ca2+/calmodulin and CBK3 signalling, ROS, and the
  HSFA1 kinases and phosphatases), DRIP-mediated turnover of DREB2A, DREB2A's drought and osmotic
  programme, HSFA1-PIF4 thermomorphogenesis, and the HSFA2-REF6 transgenerational memory loop are
  outside this module. Other HSFs (HSFB1/B2b repressors, HSFA7a/b), HSA32 and other output chaperones
  (HSP70 isoforms, other sHSP classes, ROF1, HSBP) are not modelled. They are referred to in prose only
  where they explain a reviewed member.

  HSFA1 MF terms follow each gene review's core function: GO:0003700 for HSFA1a, HSFA1b and HSFA1e and
  GO:0001228 for HSFA1d. Both sHSPs have no GO MF id, because their reviews record holdase chaperone
  activity as a proposed new term. PMID:11576425 (in vitro chaperone activity of "At-HSP17.6A") is
  attributed to the class II protein HSP17.7 (At5g12030, O81822), not to the class I HSP17.6A (At1g59860,
  Q9XIE3). UniProt disagrees: the Q9XIE3 entry cites PMID:11576425 for its FUNCTION line ("Possesses
  chaperone activity"). The module follows the paper's own statement that the protein is the cytosolic
  class II smHSP, and the TAIR cross-reference that gives At5g12030 the HSP17.6A symbol. This is a
  nomenclature collision, and the Q9XIE3 attribution should be raised with UniProt rather than taken as
  settled either way. No production GO-CAMs in gocams/index.tsv contain these Arabidopsis
  proteins.
