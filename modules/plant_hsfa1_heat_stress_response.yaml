                term:
                  id: GO:0005829
                  label: cytosol
          - id: hsp17_7_holdase
            label: "HSP17.7 (class II sHSP): ATP-independent holdase"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HSP17.7 (At5g12030; "At-HSP17.6A" in older literature)
                term:
