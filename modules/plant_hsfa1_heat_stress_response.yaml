                  supporting_text: >-
                    HsfA1d, HsfA1e and HsfA2 showed transcriptional response on the Hsp101 promoter.
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
            notes: >-
              HSFA1e adds little to the heat response beyond HSFA1a/b/d (the a/b/d triple mutant already
              loses HS-responsive DREB2A expression). Its gene review treats it as an HSFA1 paralog with
              osmotic and salt roles. It is kept here as a member of the HSFA1 tier rather than as a core
              heat activator.
    - order: 2
      role: DREB2A -> HSFA3 secondary transcription branch
      node:
        id: dreb2a_hsfa3_branch
        label: DREB2A -> HSFA3 transcription factor cascade
        module_type: REGULATORY_STEP
        description: >-
          DREB2A is induced by heat through an HSE in its promoter that needs HSFA1. Heat-induced DREB2A
          accumulates in the nucleus and binds DRE elements, including the HSFA3 promoter. HSFA3 then
          activates HSP gene promoters and is needed for full thermotolerance. DREB2A protein is held at
          low levels by DRIP E3 ligases and is stabilised during heat. That control and DREB2A's separate
          drought role are outside this module.
        annotons:
          - id: dreb2a_tf
            label: "DREB2A: heat- and drought-induced AP2/ERF DRE-binding transcription activator"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
