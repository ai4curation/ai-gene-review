                  statement: HSFA2 activates sHSP and other target genes through TATA-proximal HSEs.
                  supporting_text: >-
                    two modules of a TATA-proximal heat shock element (HSE) are essential for
                    transcriptional activation by HsfA2
                - source_id: PMID:32573848
                  statement: HSFA2 activates the HSP101 promoter.
                  supporting_text: >-
                    HsfA1d, HsfA1e and HsfA2 showed transcriptional response on the Hsp101 promoter.
            processes:
              - preferred_term: heat acclimation
                term:
                  id: GO:0010286
                  label: heat acclimation
              - preferred_term: positive regulation of DNA-templated transcription
                term:
                  id: GO:0045893
                  label: positive regulation of DNA-templated transcription
            locations:
