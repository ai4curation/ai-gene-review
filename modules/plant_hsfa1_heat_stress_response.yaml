              term:
                id: GO:0140545
                label: ATP-dependent protein disaggregase activity
              evidence:
                - source_id: PMID:7866032
                  statement: AtHSP101 complements the thermotolerance defect of yeast hsp104 deletion.
                  supporting_text: >-
                    When AtHSP101 was expressed in yeast, it complemented the thermotolerance defect
                    caused by a deletion of the HSP104 gene.
                - source_id: PMID:15659638
                  statement: HSP101 suppressor alleles restore solubility of aggregated sHSPs after heat.
                  supporting_text: >-
                    the strongest Class 2 suppressors restored solubility of aggregated small heat shock
                    proteins (sHsps) after heat stress
            processes:
              - preferred_term: protein refolding
                term:
                  id: GO:0042026
                  label: protein refolding
              - preferred_term: cellular response to heat
                term:
                  id: GO:0034605
                  label: cellular response to heat
            locations:
