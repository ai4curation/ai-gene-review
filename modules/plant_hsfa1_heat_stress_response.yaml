                term:
                  id: GO:0005634
                  label: nucleus
    - order: 4
      role: protein disaggregation output (HSP101 disaggregase with sHSP holdases)
      node:
        id: hsp101_shsp_disaggregation
        label: HSP101-sHSP protein disaggregation system
        module_type: BIOLOGICAL_PROCESS
        description: >-
          The sHSPs bind heat-denatured proteins without using ATP and keep them in soluble co-aggregates.
          The hexameric AAA+ disaggregase HSP101 (ClpB1, the plant ortholog of yeast Hsp104) works with
          HSP70 to extract polypeptides from these aggregates so that they can be refolded. Mutations in
          HSP101 that restore thermotolerance also restore the solubility of aggregated sHSPs after heat,
          which links the two systems genetically. HSP101 is not present in metazoans. HSP101 also
          promotes translation of the HSA32 protein in a feedback loop that prolongs acclimation memory.
          That loop is recorded here but not modelled.
        concepts:
          - preferred_term: protein refolding
            term:
              id: GO:0042026
              label: protein refolding
            description: Recovery of heat-denatured proteins from aggregates.
        annotons:
          - id: hsp101_disaggregase
            label: "HSP101/ClpB1: ATP-dependent protein disaggregase"
            participant:
