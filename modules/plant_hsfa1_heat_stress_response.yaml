            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
    - order: 3
      role: HSFA2 amplifier of the chaperone response and acclimation memory
      node:
        id: hsfa2_amplifier
        label: HSFA2 heat-induced amplifying transcription factor
        module_type: REGULATORY_STEP
        description: >-
          HSFA2 is barely expressed before stress and becomes the most strongly heat-induced HSF. It
          binds TATA-proximal HSEs of sHSP and other target genes and keeps them expressed during
          recovery, which extends acquired thermotolerance (heat acclimation memory). HSFA2 also drives
          the cytosolic protein response to misfolded proteins.
        annotons:
          - id: hsfa2_tf
            label: "HSFA2: heat-induced HSE-binding transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HSFA2 (At2g26150)
                term:
                  id: UniProtKB:O80982
                  label: Heat stress transcription factor A-2
            function:
