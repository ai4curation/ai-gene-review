                term:
                  id: UniProtKB:O82132
                  label: Dehydration-responsive element-binding protein 2A
            function:
              preferred_term: DNA-binding transcription activator activity, RNA polymerase II-specific
              term:
                id: GO:0001228
                label: DNA-binding transcription activator activity, RNA polymerase II-specific
              targets:
                - preferred_term: HSFA3 promoter
              evidence:
                - source_id: PMID:17030801
                  statement: DREB2A binds DRE elements and activates downstream genes, including heat genes.
                  supporting_text: >-
                    Transcription factor DREB2A interacts with a cis-acting dehydration-responsive element
                    (DRE) sequence and activates expression of downstream genes
                - source_id: PMID:18261981
                  statement: DREB2A directly regulates HSFA3 expression under heat stress.
                  supporting_text: the expression of HsfA3 was directly regulated by DREB2A under HS
            processes:
              - preferred_term: heat acclimation
                term:
                  id: GO:0010286
                  label: heat acclimation
                evidence:
                  - source_id: PMID:17030801
                    statement: dreb2a knockouts have reduced thermotolerance.
                    supporting_text: >-
                      Thermotolerance was significantly increased in plants overexpressing DREB2A CA and
