id: MODULE:plant_hsfa1_heat_stress_response
title: HSFA1-driven heat stress response in Arabidopsis
description: >-
  In Arabidopsis thaliana, the transcriptional response to high temperature is a cascade headed by the
  four class A1 heat stress transcription factors (HSFA1a, HSFA1b, HSFA1d and HSFA1e). These are
  constitutively expressed master regulators. In unstressed cells they are held inactive by the
  cytosolic chaperones HSP90 and HSC70/HSP70. Heat titrates the chaperones away, and the HSFA1s then
  accumulate in the nucleus, bind heat shock elements (HSEs) and switch on most heat-responsive genes.
  Their targets include genes for secondary transcription factors that amplify and prolong the
  response. DREB2A, an AP2/ERF factor also used in drought signalling, has an HSE in its promoter and is
  induced by HSFA1. DREB2A in turn induces HSFA3, the only HSF known to be controlled by DREB2A. HSFA2
  is the most strongly heat-induced HSF and sustains chaperone expression during recovery and heat
  acclimation memory. The cascade's output is the cytosolic chaperone network. The AAA+ disaggregase
  HSP101 (ClpB1) is essential for acquired thermotolerance. With HSP70 it pulls proteins out of
  heat-induced aggregates, including those held by the ATP-independent small HSP (sHSP) holdases.
  HSP90 and HSP70 refold and stabilise clients and also feed back to repress HSFA1. Loss of HSFA1a/b/d
  globally abolishes heat-induced gene expression and greatly reduces heat tolerance. Loss of HSP101
  abolishes acquired thermotolerance.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:21931939
    title: Arabidopsis HsfA1 transcription factors function as the main positive regulators in heat
      shock-responsive gene expression.
    statement: >-
      HSFA1a, HSFA1b and HSFA1d are the main positive regulators of heat-responsive gene expression;
      their triple mutant loses global heat-induced expression of chaperone and transcription factor
      genes and is heat sensitive.
    supporting_text: >-
      HS-responsive gene expression, including that of molecular chaperones and transcription factors,
      was globally and drastically impaired in the hsfa1a/b/d triple mutant, which exhibited greatly
      reduced tolerance to HS stress.
  - source_id: PMID:17999647
    title: A cascade of transcription factor DREB2A and heat stress transcription factor HsfA3 regulates
      the heat stress response of Arabidopsis.
    statement: DREB2A induces HSFA3, which in turn activates Hsp gene promoters.
    supporting_text: >-
      HsfA3 is the only Hsf that is transcriptionally induced during hs by DREB2A, and HsfA3 in turn
      regulates the expression of Hsp-encoding genes.
  - source_id: PMID:32573848
    title: AtHsc70-1 negatively regulates the basal heat tolerance in Arabidopsis thaliana through
      affecting the activity of HsfAs and Hsp101.
    statement: >-
      HSC70-1 binds HSFA1d and HSFA1e in the cytosol and represses the HSFA1d/A1e/A2 activators of
      HSP101.
    supporting_text: >-
      We provide genetic evidence that Hsc70-1 is a negative regulator affecting HsfA1d/A1e/A2
      activators, which in turn regulate Hsp101 expression and basal thermotolerance.
  - source_id: file:projects/ARATH_HEAT_STRESS.md
    title: Arabidopsis Heat Stress Gene Curation Project
    statement: >-
      Project page for the ten reviewed heat stress genes (HSFA1a/b/d/e, HSFA2, HSFA3, DREB2A, HSP101,
      HSC70-1 and HSP90.1) that this module organises.
  - source_id: file:modules/heat_shock_response.yaml
    title: HSF-driven cytosolic heat shock response (eukaryotic module)
    statement: >-
      The general eukaryotic HSF/chaperone module, whose representatives are opisthokont only. This
      module is the concrete plant instance and adds the plant-specific HSFA1 transcriptional cascade
      and the HSP101 disaggregase.
module:
  id: plant_hsfa1_heat_stress_response
  label: Arabidopsis HSFA1 cascade (HSFA1 -> DREB2A/HSFA3 and HSFA2 -> chaperones)
  module_type: BIOLOGICAL_PROCESS
  description: >-
    Concrete Arabidopsis module in five parts. HSFA1 master regulators induce two secondary
    transcription branches, DREB2A -> HSFA3 and HSFA2. All three tiers drive the chaperone output: the
    HSP101-sHSP disaggregation system and the HSC70/HSP90 chaperones, which also repress HSFA1.
  concepts:
    - preferred_term: cellular response to heat
      term:
        id: GO:0034605
        label: cellular response to heat
      description: The cell-autonomous transcriptional and chaperone response that this module implements.
    - preferred_term: heat acclimation
      term:
        id: GO:0010286
        label: heat acclimation
      description: >-
        Acquired thermotolerance after a priming heat exposure. In Arabidopsis it depends on HSP101 and
        is prolonged by HSFA2 and HSFA3.
  context:
    taxa:
      - preferred_term: Arabidopsis thaliana
        term:
          id: NCBITaxon:3702
          label: Arabidopsis thaliana
        description: >-
          Concrete instance in Arabidopsis. The HSFA1 -> DREB2A -> HSFA3 wiring has been shown only in
          Arabidopsis. Homologous HSFA1/HSFA2 and HSP101 functions are known in tomato and other plants
          but are not modelled here.
    conditions:
      - preferred_term: high temperature (heat stress, typically 37-45 degrees C)
        description: Activates HSFA1 and induces the secondary transcription factors and chaperones.
  parts:
    - order: 1
      role: master regulators of heat-responsive transcription
      node:
        id: hsfa1_master_regulators
        label: HSFA1a/b/d/e master heat stress transcription factors
        module_type: REGULATORY_STEP
        description: >-
          The four HSFA1 paralogs are constitutively expressed, partly redundant HSE-binding
          transcription activators. HSFA1a, HSFA1b and HSFA1d carry most of the heat response. HSFA1e
          contributes less and is also needed for normal growth (quadruple mutant). Before stress,
          HSP90 and HSC70-1 bind them and limit their nuclear accumulation and activity. Heat relieves
          this repression.
        annotons:
          - id: hsfa1a_tf
            label: "HSFA1a: HSE-binding master heat stress transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HSFA1a (At4g17750)
                term:
                  id: UniProtKB:P41151
                  label: Heat stress transcription factor A-1a
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
              evidence:
                - source_id: PMID:7948881
                  statement: Recombinant HSFA1a (ATHSF1) binds HSE oligonucleotides as a trimer.
                  supporting_text: >-
                    the recombinant Athsf1 protein binds specifically to a synthetic oligonucleotide
                    containing five heat shock elements
            processes:
              - preferred_term: cellular response to heat
                term:
                  id: GO:0034605
                  label: cellular response to heat
            locations:
              - preferred_term: nucleus
                term:
                  id: GO:0005634
                  label: nucleus
          - id: hsfa1b_tf
            label: "HSFA1b: HSE-binding master heat stress transcription factor"
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: HSFA1b (At5g16820)
                term:
                  id: UniProtKB:O81821
                  label: Heat stress transcription factor A-1b
            function:
              preferred_term: DNA-binding transcription factor activity
              term:
                id: GO:0003700
                label: DNA-binding transcription factor activity
              evidence:
                - source_id: PMID:21931939
                  statement: HSFA1a, HSFA1b and HSFA1d are the main positive regulators of heat-responsive genes.
                  supporting_text: >-
                    HsfA1a, HsfA1b, and HsfA1d function as main positive regulators in HS-responsive gene
                    expression
            processes:
              - preferred_term: cellular response to heat
                term:
                  id: GO:0034605
