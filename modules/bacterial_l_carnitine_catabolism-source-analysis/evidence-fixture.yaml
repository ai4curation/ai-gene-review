purpose: Finite, source-grounded enzyme-capacity and optional uptake audit; not genome-wide prediction
  or native-growth assay.
required_reactions:
- oxidation
- cleavage
- hydrolysis
optional_reactions:
- import
reactions:
  oxidation:
    go: GO:0047728
    rhea: RHEA:19265
    substrates:
    - L-carnitine
    - NAD+
    products:
    - 3-dehydrocarnitine
    - NADH
    - proton
    sources:
    - pao1_oxidation
    - rhime_biochemistry
    - IFP206
  cleavage:
    go: GO:0016747
    rhea: RHEA:47044
    substrates:
    - 3-dehydrocarnitine
    - acetyl-CoA
    products:
    - betainyl-CoA
    - acetoacetate
    sources:
    - pao1_cleavage
    - rhime_biochemistry
    - target_screen
  hydrolysis:
    go: GO:0016289
    rhea: RHEA:45716
    substrates:
    - betainyl-CoA
    - water
    products:
    - glycine betaine
    - CoA
    - proton
    sources:
    - pao1_hydrolysis
    - rhime_biochemistry
  import:
    go: GO:0015226
    substrates:
    - L-carnitine outside
    - ATP
    - water
    products:
    - L-carnitine inside
    - ADP
    - phosphate
    required_unit_roles:
    - carnitine_recognition
    - translocation
    - ATP_coupling
    sources:
    - transport_primary
    - pao1_scope
sources:
  transport_primary:
    path: publications/PMID_19919675.md
    kind: PRIMARY_FULL_CACHE
    quotes:
    - In addition to the core transporter comprised of a transmembrane protein (CbcW) and an ATPase (CbcV)
    - carnitine uptake (Table 5)
    scope: Pseudomonas native mutants and constructs; Table5 combines P.syringae CaiX with PAO1 CbcWV
      in E.coli. Not an all-native KT2440 assay.
  pao1_scope:
    path: analysis/module_audits/bacterial_l_carnitine_catabolism/pseae-consultation/primary-scope.md
    kind: SOURCE_IDENTITY_CONSULTATION
    quotes:
    - The paper's Table 5 CaiX reconstitution uses a P. syringae B728a substrate-binding protein with
      the PAO1 core
    scope: Separates PAO1 constructs, PA14/native genetics and heterologous-host uptake.
  pao1_oxidation:
    path: genes/PSEAE/cdhA/cdhA-uniprot.txt
    kind: CURATED_PRIMARY_LINKED_REACTION
    quotes:
    - Reaction=carnitine + NAD(+) = 3-dehydrocarnitine + NADH + H(+);
    scope: Publication-linked curated PAO1 reaction, with primary specificity paper not independently
      available in full.
  pao1_cleavage:
    path: genes/PSEAE/cdhC/cdhC-uniprot.txt
    kind: CURATED_PRIMARY_LINKED_REACTION
    quotes:
    - Reaction=3-dehydrocarnitine + acetyl-CoA = N,N,N-trimethylglycyl-CoA + acetoacetate;
    scope: ECO0000269 curated reaction cites24240508; accessible screen is not a PAO1 assay.
  pao1_hydrolysis:
    path: genes/PSEAE/cdhB/cdhB-uniprot.txt
    kind: CURATED_PRIMARY_LINKED_REACTION
    quotes:
    - Reaction=N,N,N-trimethylglycyl-CoA + H2O = glycine betaine + CoA + H(+);
    scope: ECO0000269 curated reaction cites24240508; exact target assay details not independently exposed
      in accessible supplement.
  psepk_evidence:
    path: analysis/module_audits/bacterial_l_carnitine_catabolism/psepk-consultation/evidence.md
    kind: QUALIFIED_COMPARATIVE_ANALYSIS
    quotes:
    - Global BLOSUM62 alignment
    - No alignment establishes native flux
    scope: Target sequence/locus/domain support, qualified by specific ortholog activity and strain boundaries.
  target_screen:
    path: analysis/module_audits/bacterial_l_carnitine_catabolism/psepk-consultation/results.yaml
    kind: PRIMARY_DATASET_ACCESSION_MAPPING
    quotes:
    - BKACE_511
    - Q88R31
    - 'Activity_T1_A_dehydrocarnitine: ''146.407'''
    scope: Direct target pre-process screening values. Positive-call cutoff and target kinetics unresolved;
      combines with independent comparative chemistry.
  rhime_biochemistry:
    path: genes/RHIME/bcoE-bcoF/bcoE-bcoF-source-analysis/primary-scope.md
    kind: PRIMARY_FULL_TEXT_AND_SEQUENCE_BRIDGE
    quotes:
    - Purified full-length Smc01638 performs NAD-dependent carnitine oxidation
    - BcoG/Smc01637 was kinetically assayed for dehydrocarnitine plus acetyl-CoA conversion
    - 496/496 residues
    scope: 3D0a2 recombinant proteins identical to Rm2011, and independently sequence-identical1021 representatives.
      Intact fusion assays, not isolated domains. Does not transfer strain growth.
  IFP206:
    path: publications/PMID_3058208.md
    kind: PRIMARY_ABSTRACT
    quotes:
    - Pseudomonas putida IFP 206
    - the carnitine dehydrogenase is specific for L-carnitine and NAD+
    scope: Reaction support in IFP206; not a KT2440 target experiment.
  native_pseudomonas:
    path: publications/PMID_19406895.md
    kind: PRIMARY_ABSTRACT_WITH_FULL_CONSULTATION
    quotes:
    - We used a genetic screen of the P. aeruginosa PA14 transposon mutant library
    scope: Growth/locus evidence; full consultation separates PAO1 insertions and PA14 deletions. Growth
      is not exact isolated enzyme chemistry.
  CJ25:
    path: publications/PMID_40853000.md
    kind: PRIMARY_FULL_CACHE
    quotes:
    - Future work, including gene cloning, enzyme purification, and assays, will be crucial to confirm
      their activity
    scope: GB production and proteomics nominate Fad homologs, not validated CdhC/betainyl-CoA enzyme
      realization.
  alternative_route_scope:
    path: modules/bacterial_l_carnitine_catabolism-source-analysis/alternative-route-scope.md
    kind: PRIMARY_ABSTRACT_AND_CACHED_BOUNDARY_REVIEW
    quotes:
    - Heterologous overexpression of cntAB enables Escherichia coli to produce TMA
    scope: PMID24591617 primary abstract read on PubMed; CntAB outcome differs from the three canonical
      reactions. No native negative or accession invented.
  alternative_fates:
    path: publications/PMID_9037756.md
    kind: REVIEW_ABSTRACT
    quotes:
    - degrade only the carbon backbone, with formation of trimethylamine.
    - "via \ncrotonobetaine, to gamma-butyrobetaine"
    scope: Comparative route/product boundary; not evidence that CntAB or Cai enzymes perform the three
      reactions in this module.
