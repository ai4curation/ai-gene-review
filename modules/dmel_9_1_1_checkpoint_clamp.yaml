id: MODULE:dmel_9_1_1_checkpoint_clamp
title: Rad9-Hus1-Rad1 (9-1-1) checkpoint clamp in Drosophila melanogaster
description: >-
  The 9-1-1 complex is a heterotrimeric ring of Rad9, Hus1 and Rad1 that is structurally related
  to the PCNA sliding clamp. An RFC-like clamp loader places it at 5' recessed junctions of
  single-stranded DNA gaps and resected ends, where it helps recruit and activate the ATR
  kinase in the DNA damage and replication checkpoint. In Drosophila, the Hus1 ortholog is
  named Hus1-like.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0002116
  title: 'FlyBase gene group CCC-911: Checkpoint clamp complex'
  statement: >-
    FlyBase release FB2026_03 groups 3 D. melanogaster genes as checkpoint clamp complex (CCC-911);
    this module models that group.
- source_id: GO:0030896
  title: checkpoint clamp complex
  statement: >-
    GO term grounding the module as checkpoint clamp complex.
notes: >-
  The clamp loader (Rad17-RFC in other species) is outside the module. Each subunit is modelled
  as a part because the trimer has no further sub-structure. FlyBase groups realized by this
  module: CCC-911 (FBgg0002116). Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_9_1_1_checkpoint_clamp.yaml;
  none of the member genes has a gene review yet unless noted.
