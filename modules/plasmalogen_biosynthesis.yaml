id: MODULE:plasmalogen_biosynthesis
title: Plasmalogen biosynthesis (oxygen-dependent alkyl-ether desaturation route and anaerobic diacyl-lipid reduction route)
description: >-
  Formation of plasmalogens: glycerolipids that carry a 1-(1Z-alkenyl) (vinyl)
  ether at sn-1, usually with an acyl chain at sn-2 and a phospho or glyco head
  group at sn-3. The class is defined by the vinyl-ether bond alone, so it spans
  hundreds of molecular species that differ in head group, sn-1 alkenyl chain
  and sn-2 acyl chain. The vinyl ether is made by two routes that share no
  enzymes and no intermediates. In animals and other eukaryotes the oxygen-
  dependent route builds an ether lipid from scratch. Peroxisomal GNPAT
  acylates dihydroxyacetone phosphate, and AGPS exchanges that acyl chain for a
  fatty alcohol supplied by FAR1, forming the ether bond. PexRAP then reduces
  the 1-alkyl-DHAP, and ER enzymes acylate, dephosphorylate and add the
  ethanolamine head group (SELENOI) to give plasmanyl-PE. Finally the PEDS1
  (TMEM189) desaturase introduces the vinyl-ether double bond with O2 and
  cytochrome b5. PEDS1 and its myxobacterial ortholog CarF belong to one
  PANTHER subfamily, and the eukaryotic pathway is thought to have come from
  myxobacteria by horizontal gene transfer. In obligate and facultative
  anaerobic bacteria the vinyl ether is made without an alkyl-ether
  intermediate and without oxygen. A plasmalogen synthase of the benzoyl-CoA
  reductase / 2-hydroxyacyl-CoA dehydratase family reduces the sn-1 acyl ester
  of a complete diacyl phospholipid directly to the alk-1'-enyl ether. This
  enzyme is either one polypeptide (PlsA) or two (PlsA with PlsR). Because the
  bacterial enzyme acts on whichever diacyl lipids the cell makes, it gives
  plasmenyl PE, PG and other head groups. Outside the module are the supply of
  diacyl phospholipids and of CDP-ethanolamine, plasmenylcholine formation and
  acyl-chain remodelling (for example EC 2.3.1.25 lysoplasmalogen
  acyltransferases), and plasmalogen turnover.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: GO:0008611
    title: ether lipid biosynthetic process
    statement: >-
      Module-level process. GO has no plasmalogen-specific biosynthesis term:
      "plasmalogen biosynthetic process" is a NARROW synonym of GO:0008611.
  - source_id: Reactome:R-HSA-75896
    title: Plasmalogen biosynthesis
    statement: >-
      Human peroxisomal steps from dihydroxyacetone phosphate to the
      alkyl-glycerol phosphate, followed by less well characterized ER steps.
    supporting_text: >-
      1-Acylglycerol-3-phosphate is synthesized from dihydroxyacetone phosphate,
      an acyl CoA molecule and NADPH + H+ in four reactions catalyzed by
      peroxisomal enzymes
  - source_id: PMID:41843685
    title: Origin of eukaryotic plasmalogen biosynthesis by horizontal gene transfer from myxobacteria.
    statement: >-
      PEDS1, and probably FAR and GNPAT, entered an early eukaryote from
      myxobacteria. This links the eukaryotic route to the bacterial CarF
      desaturase.
    supporting_text: >-
      were acquired by an early eukaryotic ancestor through horizontal gene
      transfer (HGT) from myxobacteria
  - source_id: PMID:33350306
    title: 'Plasmalogen Biosynthesis by Anaerobic Bacteria: Identification of a Two-Gene Operon Responsible for Plasmalogen Production in Clostridium perfringens.'
    statement: >-
      Defines the anaerobic route as a reductive conversion of an ester,
      unlike the oxidative desaturation of an ether in aerobes.
    supporting_text: >-
      anaerobic plasmalogen biosynthesis uses the reductive conversion of an
      ester to an aldehyde equivalent
  - source_id: PMID:28617934
    title: The anaerobic biosynthesis of plasmalogens.
    statement: >-
      Feeding studies show that the anaerobic vinyl ether is formed on a
      complete diacyl glycerolipid, not on a DHAP-derived ether precursor.
    supporting_text: >-
      In bacteria the alk-1'-enyl ether bond is formed after the fully formed
      acyl glycerolipids are synthesized
  - source_id: PMID:36452453
    title: Plasmalogens in bacteria, sixty years on.
    statement: >-
      Review of bacterial plasmalogen distribution, the PlsA/PlsR reductases
      and the membrane properties of plasmalogens.
module:
  id: plasmalogen_biosynthesis
  label: plasmalogen biosynthesis
  module_type: METABOLIC_PATHWAY
  description: >-
    Two independently evolved routes to the vinyl-ether lipid, modelled as
    whole-pathway alternatives because they have no step, substrate or
    intermediate in common.
  concepts:
    - preferred_term: plasmalogen biosynthetic process
      term:
        id: GO:0008611
        label: ether lipid biosynthetic process
      description: >-
        Plasmalogen biosynthesis is a NARROW synonym of this term; GO has no
        more specific process.
  variant_sets:
    - id: vinyl_ether_route_variants
      label: Routes to the 1-(1Z-alkenyl) ether
      axis: route (oxygen requirement and enzyme family; taxon)
      selection: EXACTLY_ONE
      variants:
        - id: aerobic_alkyl_ether_desaturation_variant
          label: Oxygen-dependent route via plasmanyl-PE desaturation (eukaryotes)
          module_type: METABOLIC_PATHWAY
          description: >-
            Included by reference to the ether lipid / plasmalogen biosynthesis
            module. In the peroxisome, GNPAT acylates DHAP, FAR1 supplies the
            fatty alcohol, AGPS forms the ether bond, and PexRAP reduces
            alkyl-DHAP. In the ER, plasmanylethanolamine is assembled
            (SELENOI adds the head group) and the PEDS1 desaturase forms the
            vinyl ether with O2 and cytochrome b5. The bacterial ortholog CarF
            (Myxococcus xanthus) performs the same desaturation. The pathway
            is thought to have entered eukaryotes from myxobacteria.
          module_ref: ether_lipid_plasmalogen_biosynthesis
          evidence:
            - source_id: PMID:41843685
              title: Origin of eukaryotic plasmalogen biosynthesis by horizontal gene transfer from myxobacteria.
              statement: The eukaryotic desaturation route has a myxobacterial origin.
              supporting_text: >-
                were acquired by an early eukaryotic ancestor through horizontal
                gene transfer (HGT) from myxobacteria
        - id: anaerobic_diacyl_reduction_variant
          label: Anaerobic route by reduction of a diacyl phospholipid (bacteria)
          module_type: REACTION
          description: >-
            A BCR/HAD-family plasmalogen synthase converts the sn-1 acyl ester
            of a complete diacyl glycerophospholipid into the 1-(1Z-alkenyl)
            ether in one enzymatic step, without O2 and without an alkyl-ether
            intermediate. In E. coli the bacterial enzymes make plasmenyl-PE
            and plasmenyl-PG, so the head-group range is set by the host's
            lipids. The enzyme is proposed to work like the BCR/HAD family:
            ATP-dependent electron transfer through [4Fe-4S] clusters reduces
            the ester to a ketyl radical, then a second reduction and a
            dehydration follow. The electron donor is unknown, and no Rhea
            reaction, EC number or GO molecular-function term exists.
            Supplying the diacyl phospholipids is outside the module.
          variant_sets:
            - id: plsa_enzyme_organization_variants
              label: Plasmalogen synthase polypeptide organization
              axis: enzyme organization (single chain versus two subunits; taxon)
              selection: EXACTLY_ONE
              variants:
                - id: single_chain_plsa_variant
                  label: Single-chain PlsA (Act1-Act2-Red1-Red2 in one protein)
                  module_type: REACTION
                  annotons:
                    - id: single_chain_plsa_activity
                      label: Single-chain anaerobic plasmalogen synthase PlsA
                      participant:
                        selector_type: FAMILY
                        family:
                          preferred_term: single-chain anaerobic plasmalogen synthase (PlsA/PlsAR)
                          term:
                            id: PANTHER:PTHR32329:SF4
                            label: ACTIVATOR OF 2-HYDROXYACYL-COA DEHYDRATASE
                          description: >-
                            PANTHER's subfamily name reflects family
                            resemblance only. Its characterized members are
                            plasmalogen synthases, not dehydratase
                            activators. All four representative members are
                            assigned to PTHR32329:SF4 by their UniProt PANTHER
                            cross-references.
                          evidence:
                            - source_id: file:LACLA/yxcA/yxcA-bioinformatics/RESULTS.md
                              title: yxcA (Q9CDI2) sequence comparison with characterized plasmalogen synthases
                              statement: >-
                                The UniProt PANTHER cross-references of all four
                                representatives (and of L. cremoris A2RP33) are
                                PTHR32329:SF4. Q9CDI2 is 96.6% identical to the
                                experimentally tested L. cremoris PlsA.
                              supporting_text: >-
                                The UniProt PANTHER cross-references, fetched by the
                                script, place Q9CDI2
                            - source_id: file:LACLA/yxcA/yxcA-bioinformatics/RESULTS.md
                              title: yxcA (Q9CDI2) sequence comparison with characterized plasmalogen synthases
                              statement: Identity of Q9CDI2 to the L. cremoris PlsA expressed in PMID:41427725.
                              supporting_text: >-
                                It is essentially the same protein (96.6% identity) as
                                the *L. cremoris* PlsA shown to confer plasmalogen
                                synthesis on *E. coli*
                          representative_members:
                            - preferred_term: SMU_438c (Streptococcus mutans UA159)
                              term:
                                id: UniProtKB:Q8DVN8
                                label: (R)-2-hydroxyglutaryl-CoA dehydratase activator-related protein
                              description: >-
                                Knockout abolishes plasmalogens; it is
                                sufficient in S. sanguinis (PMID:38456674).
                            - preferred_term: EF1327 (Enterococcus faecalis V583)
                              term:
                                id: UniProtKB:Q835P9
                                label: BadF/BadG/BcrA/BcrD ATPase family protein
                              description: Sufficient for plasmalogen synthesis in E. coli (PMID:33350306).
                            - preferred_term: MeHAD / MELS_0169 (Megasphaera elsdenii)
                              term:
                                id: UniProtKB:G0VRE7
                                label: Putative CoA-substrate-specific enzyme activase
                              description: >-
                                Sufficient in E. coli; a combined mutant of its
                                four predicted [4Fe-4S] cysteines is inactive
                                (PMID:37348645).
                            - preferred_term: yxcA (Lactococcus lactis IL1403)
                              term:
                                id: UniProtKB:Q9CDI2
                                label: 2-hydroxyglutaryl-CoA dehydratase
                              description: >-
                                Ortholog of the L. cremoris ATCC BAA-493 PlsA
                                (LACR_2543), which is sufficient for plasmalogen
                                synthesis in E. coli (PMID:41427725). Reviewed in
                                genes/LACLA/yxcA.
                      function:
                        preferred_term: anaerobic plasmalogen synthase activity (no GO term)
                        description: >-
                          Conversion of a 1,2-diacyl-sn-glycero-3-phospholipid
                          into the corresponding 1-(1Z-alkenyl)-2-acyl
                          phospholipid. GO:0047159 "plasmalogen synthase
                          activity" is a lysoplasmalogen acyltransferase
                          (EC 2.3.1.25) and must not be used. A new GO term
                          is needed.
                        substrates:
                          - preferred_term: 1,2-diacyl-sn-glycero-3-phospholipid (e.g. PE, PG)
                          - preferred_term: ATP (proposed)
                          - preferred_term: reduced electron donor (unknown)
                        products:
                          - preferred_term: 1-O-(1Z-alkenyl)-2-acyl-sn-glycero-3-phospholipid
                        evidence:
                          - source_id: PMID:38456674
                            title: Plasmalogen, a glycerophospholipid crucial for Streptococcus mutans acid tolerance and colonization.
                            statement: SMU_438c is necessary in S. mutans and sufficient in a heterologous streptococcus.
                            supporting_text: >-
                              The heterologous expression of SMU_438c in a
                              plasmalogen-negative strain, Streptococcus sanguinis,
                              resulted in the production of plasmalogen, indicating
                              that this enzyme is sufficient for plasmalogen
                              production
                          - source_id: PMID:33350306
                            title: 'Plasmalogen Biosynthesis by Anaerobic Bacteria: Identification of a Two-Gene Operon Responsible for Plasmalogen Production in Clostridium perfringens.'
                            statement: The facultative anaerobe E. faecalis encodes all domains in one polypeptide.
                            supporting_text: >-
                              The E. faecalis gene EF1327 encodes all activation and
                              reduction/dehydration domains as a single polypeptide
                              (PlsA)
                          - source_id: PMID:37348645
                            title: Characterization and heterologous expression of plasmalogen synthase MeHAD from Megasphaera elsdenii.
                            statement: The predicted [4Fe-4S] cysteines are needed for activity.
                            supporting_text: >-
                              The four-cysteine (Cys125, Cys164, Cys445 and Cys484)
                              site-mutant of MeHAD, which were predicted binding to
                              the [4Fe-4S] cluster, was unable to synthesize
                              plasmalogens
                          - source_id: PMID:39725447
                            title: Anaerobic plasmalogen production in recombinant Escherichia coli carrying plasmalogen synthase gene from Selenomonas ruminantium.
                            statement: The product spans more than one head group.
                            supporting_text: Both plasmenylethanolamine and plasmenylglycerol were detected
                          - source_id: PMID:41427725
                            title: Characterization of plasmalogen production in facultative anaerobic bacteria and aerobic synthesis in recombinant Escherichia coli expressing anaerobic bacterium-derived plasmalogen synthase genes.
                            statement: Lactococcus PlsA is sufficient in E. coli, including in air.
                            supporting_text: >-
                              Both PlsLc and PlsBs produced plasmalogens, as
                              evidenced by the detection of aldehydes in the lipid
                              extracts after acid hydrolysis (Fig. 3B). This was
                              observed under both aerobic and anaerobic cultures.
                      role_description: >-
                        Forms the vinyl ether directly on a diacyl lipid; the
                        single enzyme of this route.
                - id: two_subunit_plsa_plsr_variant
                  label: Two-subunit PlsA (Act1-Act2-Red1) plus PlsR (Red2)
                  module_type: REACTION
                  annotons:
                    - id: plsa_subunit_activity
                      label: PlsA subunit (activation and first reduction domain)
                      participant:
                        selector_type: GENE_PRODUCT
                        gene_product:
                          preferred_term: PlsA / CPF_1406 (Clostridium perfringens ATCC 13124)
                          term:
                            id: UniProtKB:A0A0H2YUD5
                            label: CoA-substrate-specific enzyme activase
                          description: >-
                            Reference-proteome counterpart of strain 13 CPE1195,
                            the PlsA of the characterized operon. Strain 13 has no
                            active UniProtKB entry. No PANTHER subfamily is
                            asserted for the separate subunits.
                      function:
                        preferred_term: contributes to anaerobic plasmalogen synthase activity (no GO term)
                        description: >-
                          Provides the two ATP-dependent activation domains and
                          the first reduction/dehydration domain of the PlsAR
                          complex.
                        evidence:
                          - source_id: PMID:33350306
                            title: 'Plasmalogen Biosynthesis by Anaerobic Bacteria: Identification of a Two-Gene Operon Responsible for Plasmalogen Production in Clostridium perfringens.'
                            statement: Domain split between PlsA and PlsR.
                            supporting_text: >-
                              PlsA is a multidomain protein composed of two
                              activation domains (Act1 and Act2), and one
                              reduction/dehydration domain (Red1). PlsR encodes a
                              second reduction domain (Red2)
                      role_description: Activation and first reduction module of the PlsAR enzyme.
                    - id: plsr_subunit_activity
                      label: PlsR subunit (second reduction domain)
                      participant:
                        selector_type: GENE_PRODUCT
                        gene_product:
                          preferred_term: PlsR / CPF_1405 (Clostridium perfringens ATCC 13124)
                          term:
                            id: UniProtKB:A0A0H2YN56
                            label: 2-hydroxyglutaryl-CoA dehydratase
                          description: >-
                            Reference-proteome counterpart of strain 13 CPE1194,
                            the PlsR of the characterized operon. UniProt's PANTHER
                            cross-reference places it in PTHR32329:SF4, but no
                            committed source records that placement. Its Red2
                            domain also corresponds to the dehydratase-side
                            Pfam PF06050 (HGD-D) in PMID:33350306, not to the
                            activator domains the subfamily is named for. No
                            PANTHER subfamily is asserted here.
                      function:
                        preferred_term: contributes to anaerobic plasmalogen synthase activity (no GO term)
                        description: >-
                          Second reduction/dehydration domain. The deletion
                          removed the whole operon, so PlsR's individual
                          requirement was not tested separately.
                      role_description: Second reduction module of the PlsAR enzyme.
notes: >-
  Modelling choices. (1) The two routes share no step, substrate or
  intermediate, so they are whole-pathway alternatives in one variant set.
  The eukaryotic route is included by reference to
  ether_lipid_plasmalogen_biosynthesis, not copied. (2) GO:0008611 is the
  most specific process term available. (3) The anaerobic step has no GO MF
  term, Rhea reaction or EC number, so its annotons carry a described
  function without a term, as for BIO1 in the biotin module. A GO new-term
  request and a relabelling of GO:0047159 ("plasmalogen synthase activity",
  an EC 2.3.1.25 lysoplasmalogen acyltransferase) have been drafted. (4)
  PANTHER PTHR32329:SF4 is named after 2-hydroxyacyl-CoA dehydratase
  activators, but its experimentally characterized members are plasmalogen
  synthases. The broader PTHR32329 family mixes these with genuine
  dehydratase activators (HgdC, LcdC, HadI, FldI) and benzoyl-CoA reductase
  subunits. (5) Myxobacteria use the CarF desaturase. Their upstream
  ether-bond enzymes are not modelled, so the eukaryotic variant is grounded
  in eukaryotic proteins apart from the desaturase step. (6) Naming: "PlsA"
  is the Act1-Act2-Red1 subunit in C. perfringens (PMID:33350306) but the
  whole single-chain enzyme in E. faecalis and Lactococcus. The Selenomonas
  ruminantium enzyme is called SrPlsAR (PMID:39725447) and the Megasphaera
  enzyme MeHAD (PMID:37348645). Labels here follow each organism's paper. (7)
  SrPlsAR is not a representative member because the cached abstract gives
  no locus tag or accession to ground it.
knowledge_gaps:
  - gap_statement: >-
      The electron donor, the ATP requirement and the reaction mechanism of
      the anaerobic plasmalogen synthase are unknown.
    boundary: >-
      Expressing PlsA or PlsAR alone gives plasmalogens in heterologous hosts.
      Mutating the predicted [4Fe-4S] cysteines or the ATP-binding sites
      lowers or abolishes synthesis. No PlsA has been purified and assayed in
      vitro.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      A balanced reaction is needed before Rhea, EC and a GO MF term can
      describe the anaerobic route.
    resolution: >-
      Purify PlsA anaerobically, characterize its iron-sulfur clusters, and
      reconstitute activity on defined diacyl phospholipids with ATP and
      candidate reductants such as ferredoxin.
    provenance:
      - reference_id: PMID:33350306
        supporting_text: >-
          anaerobic plasmalogen biosynthesis uses the reductive conversion of an
          ester to an aldehyde equivalent
