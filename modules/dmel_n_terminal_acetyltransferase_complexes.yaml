id: MODULE:dmel_n_terminal_acetyltransferase_complexes
title: N-terminal acetyltransferase complexes in Drosophila melanogaster
description: >-
  N-terminal acetyltransferases (NATs) transfer an acetyl group from acetyl-CoA to the alpha-amino
  group of protein N termini, mostly co-translationally at the ribosome. Each complex pairs
  a catalytic subunit with one or more auxiliary subunits that anchor it to the ribosome and
  shape substrate choice. NatA (catalytic Naa10, vnc in flies, with auxiliary Naa15-16) acetylates
  N termini exposed after removal of the initiator methionine; Naa50 (san) associates with
  NatA. NatB (Naa20 with Naa25, psidin) acetylates Met-Asp/Glu/Asn/Gln N termini. NatC (Naa30
  with Naa35 and Naa38) acetylates Met followed by a hydrophobic residue. Drosophila has a
  testis-specific NatC catalytic paralog, Naa30B.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000650
  title: 'FlyBase gene group NAT-CPX: N-terminal acetyltransferase complexes'
  statement: >-
    FlyBase release FB2026_03 groups 9 D. melanogaster genes as n-terminal acetyltransferase
    complexes (NAT-CPX); this module models that group.
- source_id: GO:0031415
  title: NatA complex
  statement: >-
    GO term grounding the module as NatA complex.
- source_id: GO:0031416
  title: NatB complex
  statement: >-
    GO term grounding the module as NatB complex.
- source_id: GO:0031417
  title: NatC complex
  statement: >-
    GO term grounding the module as NatC complex.
notes: >-
  Parts follow FlyBase subgroups NATA, NATB, NATC and NATC-T. Catalytic activity is assigned
  to the Naa10, Naa20 and Naa30 orthologs by conservation with yeast and human NATs; no activity
  is assigned to san (Naa50), whose own substrate specificity in flies is not settled here,
  or to auxiliary subunits. Other NATs that act alone (NatD/Naa40, NatF/Naa60, NatH/Naa80)
  are not in these FlyBase groups. Naa20B is not a FlyBase member of NATB and is not included.
  FlyBase groups realized by this module: NAT-CPX (FBgg0000650). Subgroups folded into it:
  NATA, NATB, NATC, NATC-T. Participants were generated from the FlyBase gene-group membership
  and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py from module_specs/dmel_n_terminal_acetyltransferase_complexes.yaml.
  Genes without a UniProtKB entry (mostly non-coding RNAs) are grounded to their FlyBase gene
  ids. None of the member genes has a gene review yet unless noted.
