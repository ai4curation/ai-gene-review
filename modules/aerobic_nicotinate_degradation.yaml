- id: PMID:18678916
  title: 'Deciphering the genetic determinants for aerobic nicotinic acid degradation: the nic cluster
    from Pseudomonas putida KT2440.'
  findings:
  - statement: KT2440 NicAB expression, disruption/complementation and cytochrome-domain truncation experiments
      identify cytochrome-linked nicotinate hydroxylation; the NADP-specific GO:0050138 reaction is not
      this activity.
  - statement: KT2440 NicC recombinant extracts convert 6-hydroxynicotinate to 2,5-dihydroxypyridine with
      added NADH and FAD; mutant accumulation places the reaction after NicAB.
  - statement: Purified KT2440 NicX cleaves 2,5-dihydroxypyridine to N-formylmaleamate, resolving the
      earlier proposal of direct maleamate formation.
  - statement: KT2440 NicD recombinant extracts hydrolyze N-formylmaleamate to maleamate and formate;
      S101A, D125A and H245A abolish activity whereas E221A retains about 70%.
  - statement: KT2440 NicF recombinant extracts release ammonia from maleamate; its proposed catalytic
      residues derive from conservation rather than a target mutagenesis experiment.
  - statement: KT2440 NicE/MaiA is assigned to maleate isomerization from sequence similarity and conserved
      cysteines within the reconstructed route; this study does not report a direct NicE enzyme assay.
  full_text_unavailable: true
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full PMC2516282 article independently inspected; supported cache refresh remains abstract-only.
      Results distinguish assayed NicAB/NicC/NicX/NicD/NicF from homology-based NicE assignment. Methods
      calls a NicD product maleate, but Results, Fig.1 and product chemistry establish maleamate. Findings
      based on the body are paraphrases, not invented cache quotations.
