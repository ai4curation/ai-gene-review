  concepts:
  - preferred_term: nicotinate catabolic process
    term:
      id: GO:1901848
      label: nicotinate catabolic process
    description: Aerobic conversion of nicotinate to central metabolites.
  context:
    taxa:
    - preferred_term: Pseudomonadota with the aerobic maleamate route
      term:
        id: NCBITaxon:1224
        label: Pseudomonadota
      description: The native complete-route anchor is KT2440; comparative nic clusters and assayed NicC/NicX
        occur in Burkholderiales. This is neither a universal phylum-level capability nor an exhaustive
        absence claim outside the sampled taxa. Shared lower reactions in nicotine degradation do not
        satisfy the complete module.
      evidence:
      - source_id: PMID:18678916
        title: 'Deciphering the genetic determinants for aerobic nicotinic acid degradation: the nic cluster
          from Pseudomonas putida KT2440.'
        statement: The full study compares KT2440 nic genes with Burkholderiales clusters and explicitly
          distinguishes fused and split NicB architectures.
      - source_id: PMID:29485696
        title: The Bordetella bronchiseptica nic locus encodes a nicotinic acid degradation pathway and
          the 6-hydroxynicotinate-responsive regulator BpsR.
        statement: Bordetella mutant and regulation experiments support native nicotinate degradation,
          with predicted differences in the entry proteins.
      - source_id: PMID:42618148
        title: The complex role of nicotinic acid metabolism in the genus Bordetella.
        statement: The review describes differing nicotinic acid utilization among Bordetella lineages;
          detailed enzyme assignments require primary evidence.
