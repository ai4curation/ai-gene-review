id: MODULE:aerobic_nicotinate_degradation
title: Aerobic nicotinate degradation through 2,5-dihydroxypyridine
description: >-
  A reusable six-reaction bacterial pathway that converts nicotinate to
  fumarate through 6-hydroxynicotinate, 2,5-dihydroxypyridine,
  N-formylmaleamate, maleamate, and maleate. NicAB performs the initial
  cytochrome-linked hydroxylation, NicC performs an oxygen- and NADH-dependent
  oxidative decarboxylation, NicX opens the pyridine ring, NicD removes the
  formyl group, NicF releases the amide nitrogen, and MaiA isomerizes maleate
  to fumarate.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:1901848
    title: nicotinate catabolic process
    statement: >-
      GO:1901848 captures degradation of nicotinate represented by this
      ordered route.
  - source_id: UniPathway:UPA01010
    title: nicotinate degradation
    statement: >-
      The PSEPK UniPathway membership groups the characterized nic genes for
      aerobic nicotinate degradation.
  - source_id: PMID:18678916
    title: >-
      Deciphering the genetic determinants for aerobic nicotinic acid
      degradation: the nic cluster from Pseudomonas putida KT2440.
    statement: >-
      This study experimentally characterized the P. putida KT2440 nicotinate
      degradation gene cluster and the pathway intermediates.
  - source_id: file:PSEPK/nicA/nicA-ai-review.yaml
    title: PSEPK nicA gene review
    statement: >-
      Q88FX9 is the iron-sulfur small subunit of the NicAB nicotinate
      dehydrogenase.
  - source_id: file:PSEPK/nicB/nicB-ai-review.yaml
    title: PSEPK nicB gene review
    statement: >-
      Q88FX8 is the molybdenum/heme-containing large subunit of NicAB.
notes: >-
  The pathway is species-neutral but grounded by the experimentally
  characterized Pseudomonas putida KT2440 system. The broad GO molecular
  function available for NicAB, NicD, and NicF does not encode their precise
  substrate specificity, so their exact EC numbers and Rhea reactions define
  the leaf chemistry. NicR and NicS regulate expression but are not required
  catalytic parts. Nicotinate uptake, cofactor assembly, cytochrome oxidase,
  and downstream fumarate metabolism are outside the boundary.
module:
  id: aerobic_nicotinate_degradation
  label: Aerobic nicotinate degradation through 2,5-dihydroxypyridine
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: nicotinate catabolic process
      term:
        id: GO:1901848
        label: nicotinate catabolic process
      description: Aerobic conversion of nicotinate to central metabolites.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          This realization represents bacterial nicotinate degradation through
          the 2,5-dihydroxypyridine and maleamate intermediates.
  parts:
    - order: 1
      role: nicotinate hydroxylation
      node:
        id: nicab_nicotinate_hydroxylation
        label: NicAB-dependent 6-hydroxynicotinate formation
        module_type: REACTION
        annotons:
          - id: nicab_activity
            label: NicAB nicotinate dehydrogenase activity
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: NicAB nicotinate dehydrogenase complex
                active_units:
                  - id: nica_iron_sulfur_subunit
                    label: NicA iron-sulfur subunit
                    role: Relays electrons through two [2Fe-2S] clusters.
                    participant:
                      selector_type: ORTHOLOG_OF
                      ortholog_of:
                        preferred_term: Pseudomonas putida KT2440 NicA
                        term:
                          id: UniProtKB:Q88FX9
                          label: Nicotinate dehydrogenase subunit A
                        description: >-
                          Orthologs retaining the NicA small-subunit architecture
                          and its role in a two-component NicAB enzyme.
                      required_function:
                        preferred_term: 2 iron, 2 sulfur cluster binding
                        term:
                          id: GO:0051537
                          label: 2 iron, 2 sulfur cluster binding
                  - id: nicb_catalytic_subunit
                    label: NicB catalytic and cytochrome electron-transfer subunit
                    role: >-
                      Binds the molybdenum cofactor and heme centers required
                      for nicotinate hydroxylation and cytochrome reduction.
                    participant:
                      selector_type: ORTHOLOG_OF
                      ortholog_of:
                        preferred_term: Pseudomonas putida KT2440 NicB
                        term:
                          id: UniProtKB:Q88FX8
                          label: Nicotinate dehydrogenase subunit B
                        description: >-
                          Orthologs retaining the Mo-MCD catalytic and
                          cytochrome electron-transfer architecture of NicB.
                      required_function:
                        preferred_term: molybdopterin cofactor binding
                        term:
                          id: GO:0043546
                          label: molybdopterin cofactor binding
            function:
              preferred_term: oxidoreductase activity, acting on CH or CH2 groups
              term:
                id: GO:0016725
                label: oxidoreductase activity, acting on CH or CH2 groups
              substrates:
                - preferred_term: nicotinate
                - preferred_term: water
                - preferred_term: oxidized cytochrome
              products:
                - preferred_term: 6-hydroxynicotinate
                - preferred_term: reduced cytochrome
                - preferred_term: proton
              evidence:
                - source_id: RHEA:27417
                  title: cytochrome-linked nicotinate dehydrogenase reaction
                  statement: >-
                    Rhea 27417 defines conversion of nicotinate to
                    6-hydroxynicotinate by EC 1.17.2.1.
                - source_id: file:PSEPK/nicA/nicA-ai-review.yaml
                  statement: >-
                    The review assigns Q88FX9 to the NicAB reaction as its
                    iron-sulfur subunit.
                - source_id: file:PSEPK/nicB/nicB-ai-review.yaml
                  statement: >-
                    The review assigns Q88FX8 to the same reaction as the
                    catalytic large subunit.
            processes:
              - preferred_term: nicotinate catabolic process
                term:
                  id: GO:1901848
                  label: nicotinate catabolic process
            role_description: Introduces the first hydroxyl group into nicotinate.
    - order: 2
      role: oxidative decarboxylation of 6-hydroxynicotinate
      node:
        id: nicc_dihydroxypyridine_formation
        label: NicC-dependent 2,5-dihydroxypyridine formation
        module_type: REACTION
        annotons:
          - id: nicc_activity
            label: NicC 6-hydroxynicotinate 3-monooxygenase activity
            participant:
              selector_type: ORTHOLOG_OF
              ortholog_of:
                preferred_term: Pseudomonas putida KT2440 NicC
                term:
                  id: UniProtKB:Q88FY2
                  label: 6-hydroxynicotinate 3-monooxygenase
                description: >-
                  Orthologs retaining the characterized 6-hydroxynicotinate
                  oxidative-decarboxylation reaction; the broad PANTHER
                  monooxygenase subfamily alone is not specificity evidence.
              required_function:
                preferred_term: 6-hydroxynicotinate 3-monooxygenase activity
                term:
                  id: GO:0043731
                  label: 6-hydroxynicotinate 3-monooxygenase activity
            function:
              preferred_term: 6-hydroxynicotinate 3-monooxygenase activity
              term:
                id: GO:0043731
                label: 6-hydroxynicotinate 3-monooxygenase activity
              substrates:
                - preferred_term: 6-hydroxynicotinate
                - preferred_term: NADH
                - preferred_term: oxygen
                - preferred_term: proton
              products:
                - preferred_term: 2,5-dihydroxypyridine
                - preferred_term: carbon dioxide
                - preferred_term: NAD+
                - preferred_term: water
              evidence:
                - source_id: RHEA:27333
                  title: 6-hydroxynicotinate 3-monooxygenase reaction
                  statement: >-
                    Rhea 27333 defines the FAD-dependent oxidative
                    decarboxylation performed by NicC.
                - source_id: file:PSEPK/nicC/nicC-ai-review.yaml
                  statement: >-
                    The review accepts GO:0043731 as the core function of
                    Q88FY2.
            processes:
              - preferred_term: nicotinate catabolic process
                term:
                  id: GO:1901848
                  label: nicotinate catabolic process
            role_description: Produces the dioxygenase substrate 2,5-dihydroxypyridine.
    - order: 3
      role: pyridine-ring cleavage
      node:
        id: nicx_ring_cleavage
        label: NicX-dependent N-formylmaleamate formation
        module_type: REACTION
        annotons:
          - id: nicx_activity
            label: NicX 2,5-dihydroxypyridine dioxygenase activity
            participant:
              selector_type: ORTHOLOG_OF
              ortholog_of:
                preferred_term: Pseudomonas putida KT2440 NicX
                term:
                  id: UniProtKB:Q88FY1
                  label: 2,5-dihydroxypyridine 5,6-dioxygenase
                description: >-
                  Orthologs retaining the characterized 2,5-dihydroxypyridine
                  ring-cleavage reaction.
              required_function:
                preferred_term: 2,5-dihydroxypyridine 5,6-dioxygenase activity
                term:
                  id: GO:0047075
                  label: 2,5-dihydroxypyridine 5,6-dioxygenase activity
            function:
              preferred_term: 2,5-dihydroxypyridine 5,6-dioxygenase activity
              term:
                id: GO:0047075
                label: 2,5-dihydroxypyridine 5,6-dioxygenase activity
              substrates:
                - preferred_term: 2,5-dihydroxypyridine
                - preferred_term: oxygen
              products:
                - preferred_term: N-formylmaleamate
                - preferred_term: proton
              evidence:
                - source_id: RHEA:27522
                - source_id: InterPro:IPR058739
                  statement: Reaction-specific NicX family support complements the exact KT2440 ortholog anchor.
                  title: 2,5-dihydroxypyridine ring-cleavage reaction
                  statement: >-
                    Rhea 27522 defines Fe(II)-dependent formation of
                    N-formylmaleamate.
                - source_id: file:PSEPK/nicX/nicX-ai-review.yaml
                  statement: >-
                    The review accepts GO:0047075 as the core function of
                    Q88FY1.
            processes:
              - preferred_term: nicotinate catabolic process
                term:
                  id: GO:1901848
                  label: nicotinate catabolic process
            role_description: Opens the aromatic pyridine ring.
    - order: 4
      role: N-formylmaleamate deformylation
      node:
        id: nicd_deformylation
        label: NicD-dependent maleamate formation
        module_type: REACTION
        annotons:
          - id: nicd_activity
            label: NicD N-formylmaleamate deformylase activity
            participant:
              selector_type: ORTHOLOG_OF
              ortholog_of:
                preferred_term: Pseudomonas putida KT2440 NicD
                term:
                  id: UniProtKB:Q88FY3
                  label: N-formylmaleamate deformylase
                description: >-
                  Orthologs retaining EC 3.5.1.106/Rhea 30843 activity; the
                  broad alpha/beta-hydrolase family alone does not establish
                  N-formylmaleamate specificity.
              required_function:
                preferred_term: hydrolase activity on linear amides
                term:
                  id: GO:0016811
                  label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
            function:
              preferred_term: hydrolase activity, acting on carbon-nitrogen bonds in linear amides
              term:
                id: GO:0016811
                label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
              substrates:
                - preferred_term: N-formylmaleamate
                - preferred_term: water
              products:
                - preferred_term: maleamate
                - preferred_term: formate
                - preferred_term: proton
              evidence:
                - source_id: RHEA:30843
                  title: N-formylmaleamate deformylase reaction
                  statement: >-
                    Rhea 30843 defines hydrolysis of N-formylmaleamate to
                    maleamate and formate by EC 3.5.1.106.
                - source_id: file:PSEPK/nicD/nicD-ai-review.yaml
                  statement: The review identifies this precise reaction for Q88FY3.
            processes:
              - preferred_term: nicotinate catabolic process
                term:
                  id: GO:1901848
                  label: nicotinate catabolic process
            role_description: Removes the formyl group after ring opening.
    - order: 5
      role: maleamate deamidation
      node:
        id: nicf_maleate_formation
        label: NicF-dependent maleate formation
        module_type: REACTION
        annotons:
          - id: nicf_activity
            label: NicF maleamate amidohydrolase activity
            participant:
              selector_type: ORTHOLOG_OF
              ortholog_of:
                preferred_term: Pseudomonas putida KT2440 NicF
                term:
                  id: UniProtKB:Q88FY5
                  label: Maleamate amidohydrolase
                description: >-
                  Orthologs retaining EC 3.5.1.107/Rhea 27385 activity; the
                  isochorismatase fold alone does not establish maleamate
                  specificity.
              required_function:
                preferred_term: hydrolase activity on linear amides
                term:
                  id: GO:0016811
                  label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
            function:
              preferred_term: hydrolase activity, acting on carbon-nitrogen bonds in linear amides
              term:
                id: GO:0016811
                label: hydrolase activity, acting on carbon-nitrogen (but not peptide) bonds, in linear amides
              substrates:
                - preferred_term: maleamate
                - preferred_term: water
              products:
                - preferred_term: maleate
                - preferred_term: ammonium
              evidence:
                - source_id: RHEA:27385
                  title: maleamate amidohydrolase reaction
                  statement: >-
                    Rhea 27385 defines hydrolysis of maleamate to maleate and
                    ammonium by EC 3.5.1.107.
                - source_id: file:PSEPK/nicF/nicF-ai-review.yaml
                  statement: The review identifies this precise reaction for Q88FY5.
            processes:
              - preferred_term: nicotinate catabolic process
                term:
                  id: GO:1901848
                  label: nicotinate catabolic process
            role_description: Releases the pathway nitrogen and forms maleate.
    - order: 6
      role: maleate isomerization
      node:
        id: maia_fumarate_formation
        label: MaiA-dependent fumarate formation
        module_type: REACTION
        annotons:
          - id: maia_activity
            label: MaiA maleate isomerase activity
            participant:
              selector_type: ORTHOLOG_OF
              ortholog_of:
                preferred_term: Pseudomonas putida KT2440 MaiA/NicE
                term:
                  id: UniProtKB:Q88FY4
                  label: Maleate isomerase
                description: >-
                  Orthologs retaining the maleate-to-fumarate reaction in the
                  maleamate pathway.
              required_function:
                preferred_term: maleate isomerase activity
                term:
                  id: GO:0050076
                  label: maleate isomerase activity
            function:
              preferred_term: maleate isomerase activity
              term:
                id: GO:0050076
                label: maleate isomerase activity
              substrates:
                - preferred_term: maleate
              products:
                - preferred_term: fumarate
              evidence:
                - source_id: RHEA:13169
                - source_id: InterPro:IPR028615
                  statement: Maleate-isomerase family support complements the exact KT2440 ortholog anchor.
                  title: maleate isomerase reaction
                  statement: Rhea 13169 defines cis-trans isomerization of maleate to fumarate.
                - source_id: file:PSEPK/maiA/maiA-ai-review.yaml
                  statement: >-
                    The review accepts GO:0050076 as the core function of
                    Q88FY4.
            processes:
              - preferred_term: nicotinate catabolic process
                term:
                  id: GO:1901848
                  label: nicotinate catabolic process
            role_description: Produces fumarate for entry into central metabolism.
  connections:
    - source: nicab_nicotinate_hydroxylation
      target: nicc_dihydroxypyridine_formation
      connection_type: PROVIDES_INPUT_FOR
      description: NicAB produces the 6-hydroxynicotinate consumed by NicC.
      chaining_status: VERIFIED
      chaining_note: Rhea 27417 product matches the Rhea 27333 substrate.
    - source: nicc_dihydroxypyridine_formation
      target: nicx_ring_cleavage
      connection_type: PROVIDES_INPUT_FOR
      description: NicC produces the 2,5-dihydroxypyridine consumed by NicX.
      chaining_status: VERIFIED
      chaining_note: Rhea 27333 product matches the Rhea 27522 substrate.
    - source: nicx_ring_cleavage
      target: nicd_deformylation
      connection_type: PROVIDES_INPUT_FOR
      description: NicX produces the N-formylmaleamate consumed by NicD.
      chaining_status: VERIFIED
      chaining_note: Rhea 27522 product matches the Rhea 30843 substrate.
    - source: nicd_deformylation
      target: nicf_maleate_formation
      connection_type: PROVIDES_INPUT_FOR
      description: NicD produces the maleamate consumed by NicF.
      chaining_status: VERIFIED
      chaining_note: Rhea 30843 product matches the Rhea 27385 substrate.
    - source: nicf_maleate_formation
      target: maia_fumarate_formation
      connection_type: PROVIDES_INPUT_FOR
      description: NicF produces the maleate consumed by MaiA.
      chaining_status: VERIFIED
      chaining_note: Rhea 27385 product matches the Rhea 13169 substrate.
  knowledge_gaps:
    - gap_statement: >-
        GO lacks a substrate-specific molecular-function term for the
        cytochrome-linked NicAB nicotinate dehydrogenase reaction.
      boundary: >-
        The NicAB leaf uses GO:0016725 together with Rhea 27417 and the
        two-subunit complex model to preserve the exact hydroxylation
        chemistry.
      gap_kind:
        - ONTOLOGY
    - gap_statement: >-
        GO lacks substrate-specific molecular-function terms for
        N-formylmaleamate deformylase and maleamate amidohydrolase activities.
      boundary: >-
        The NicD and NicF leaves use GO:0016811 together with Rhea 30843 and
        Rhea 27385; the corresponding gene reviews propose the two missing
        terms.
      gap_kind:
        - ONTOLOGY
    - gap_statement: >-
        Broad PANTHER and fold-level families for NicC, NicD, and NicF do not
        by themselves establish the substrate specificity of these reactions.
      boundary: >-
        The leaves use orthology to characterized P. putida exemplars together
        with required GO functions and exact Rhea reactions. More specific,
        independently validated family models remain a curation need.
      gap_kind:
        - CURATION
