- id: PMID:33281798
  title: Physiology of a Hybrid Pathway for Nicotine Catabolism in Bacteria.
  reference_review:
    relevance: HIGH
    correctness: VERIFIED
    review_notes: Full review inspected. Useful cross-pathway comparison; primary strain-specific experiments
      govern complete-route claims and exact member assignments.
  findings:
  - statement: The review compares the distinct nicotine and nicotinate entry routes and their shared
      four-reaction segment from 2,5-dihydroxypyridine to fumarate. A downstream enzyme alone does not
      establish nicotinate utilization.
    supporting_text: Interestingly, the steps for 2,5-dihydroxypyridine degradation are also identical
      to those in the nicotinate-degrading pathway
  - statement: The review identifies deformylation as the shared step after ring cleavage.
    supporting_text: N-formylmaleamate deformylase (Nfo, 28.1 kDa) catalyzes the hydrolysis of N-formylmaleamic
      acid into maleamic and formic acids.
  - statement: The review identifies maleamate hydrolysis as the shared nitrogen-release step.
    supporting_text: Next the hydrolysis of maleamic acid into maleic acid and ammonia is catalyzed by
      maleamate amidohydrolase
  - statement: The review identifies maleate isomerization as the common terminal reaction.
    supporting_text: Finally, maleate cis/trans-isomerase (Iso, 26.8 kDa) catalyzes the isomerization
      of maleic acid into fumaric acid
- id: PMID:42618148
  title: The complex role of nicotinic acid metabolism in the genus Bordetella.
