id: MODULE:aerobic_nicotinate_degradation
title: Aerobic nicotinate degradation through 2,5-dihydroxypyridine
description: A six-reaction aerobic nicotinate degradation route in Pseudomonadota, converting nicotinate
  to fumarate through 6-hydroxynicotinate, 2,5-dihydroxypyridine, N-formylmaleamate, maleamate and maleate.
  The characterized two-component NicAB enzyme initiates hydroxylation, followed by NicC oxidative decarboxylation,
  NicX ring cleavage, NicD deformylation, NicF deamidation and MaiA isomerization. Related bacteria share
  downstream chemistry while differing in pathway distribution and entry-enzyme architecture.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:18678916
  title: 'Deciphering the genetic determinants for aerobic nicotinic acid degradation: the nic cluster
    from Pseudomonas putida KT2440.'
  statement: KT2440 growth, knockout/complementation, heterologous cluster transfer and step assays establish
    the native six-reaction route, with the final NicE assignment inferred from homology.
- source_id: PMID:33281798
  title: Physiology of a Hybrid Pathway for Nicotine Catabolism in Bacteria.
  statement: The comparative review separates nicotinate entry from nicotine entry and identifies the
    shared downstream chemistry.
- source_id: PMID:29485696
  title: The Bordetella bronchiseptica nic locus encodes a nicotinic acid degradation pathway and the
    6-hydroxynicotinate-responsive regulator BpsR.
  statement: Bordetella provides an additional native catabolic context but does not establish that every
    lineage or every entry architecture implements the same protein complex.
notes: 'The complete native route is anchored in Pseudomonas putida KT2440. The taxon is an evidence-supported
  envelope, not a universal trait or a claim of evolutionary origin. Bordetella bronchiseptica NicC and
  NicX extend reaction-level sampling to Burkholderiales, but the full Bordetella entry complex is not
  asserted to have the two-component KT2440 architecture. BB1776 and BB1783 are separately reviewed architectural
  comparators; their NicB1/NicB2 roles remain predicted. All six reactions are required at this boundary.
  Nicotinate uptake, cofactor assembly, regulation by NicR/BpsR or NicS, terminal cytochrome oxidation
  and downstream fumarate metabolism remain context. Nicotine is a different starting substrate: S16 Iso/MaiA
  is a directly assayed terminal-reaction comparator, not a native complete-route exemplar. PANTHER names
  are copied verbatim and used only with reaction-specific constraints; no substrate specificity or PAINT
  ancestral placement is inferred from a family label. GO lacks exact terms for the NicAB cytochrome reaction
  and the two amide hydrolases; these leaves use explicit activity names and Rhea chemistry instead of
  overbroad molecular functions. Gene reviews propose matching new terms. Evidence coverage remains uneven:
  the founding paper assigns KT2440 MaiA by homology rather than a target enzyme assay, and the reported
  Bordetella NicX product analysis is a meeting abstract. These are limits of available evidence, not
  established absence of biochemical knowledge.'
module:
