            role_description: J-protein interaction promotes client engagement and DnaK ATP hydrolysis.
              ATP-to-ADP/phosphate chemistry is performed by DnaK, not by DnaJ. Mtb J1 and J2 are alternative
              positive cofactors with distinct efficiencies; Pseudomonas is a conserved-role inference,
              not exact-target reconstitution.
            evidence:
            - source_id: PMID:1826368
              title: Escherichia coli DnaJ and GrpE heat shock proteins jointly stimulate ATPase activity
                of DnaK.
              statement: DnaJ accelerates hydrolysis by DnaK; DnaJ is not the ATP-hydrolyzing catalyst.
              supporting_text: DnaJ alone leads to an acceleration in the rate of hydrolysis of the DnaK-bound
                ATP.
              notes: E. coli nucleotide-cycle biochemistry separates hydrolysis and nucleotide release.
                The coupled steady-state ATPase increase with DnaJ and GrpE does not make GrpE an ATPase
                or assign nucleotide hydrolysis to DnaJ.
            - source_id: PMID:7937953
              title: The ATP hydrolysis-dependent reaction cycle of the Escherichia coli Hsp70 system
                DnaK, DnaJ, and GrpE.
              statement: DnaJ first binds the non-native client, then collaborates with DnaK in the ATP-dependent
                cycle.
              supporting_text: unfolded luciferase binds initially to DnaJ
              notes: 'Reconstituted E. coli DnaK/DnaJ/GrpE folding of denatured firefly luciferase. Abstract-only
                cache: do not invent exact E. coli substrain, construct sequences, protein concentrations
                or temperatures. This is a defined model-client mechanism, not a guarantee for every client.'
            - source_id: PMID:27872278
              title: Reconstitution of a Mycobacterium tuberculosis proteostasis network highlights essential
                cofactor interactions with chaperone DnaK.
              statement: DnaJ1 and DnaJ2 provide alternative positive activation routes with different
                kinetics.
              supporting_text: DnaJ1 and DnaJ2 activate the ATPase activity of DnaK differently.
              notes: 'Purified Mtb proteins expressed as His-SUMO fusions in E. coli followed by tag cleavage.
                MS ATP/ADP assays: low-cofactor DnaJ2 is more effective; appreciable J1 activation appears
                at approximately equimolar J1:DnaK. Do not collapse J1/J2 into quantitatively equivalent
                cofactors. Exact H37Rv donor construct identity remains the gene audit limitation; species-level
                biochemistry is not fabricated exact-strain evidence.'
            - source_id: PMID:27872278
              title: Reconstitution of a Mycobacterium tuberculosis proteostasis network highlights essential
                cofactor interactions with chaperone DnaK.
              statement: One J protein can support activity, while both enhance the tested aggregate-reactivation
                output.
              supporting_text: When one J protein was removed, there was approximately half the amount
                of refolding
              notes: Heat-denatured luciferase with Hsp20 during preparation; DnaK/GrpE/J-cofactors restore
                activity and ClpB increases yield. J1:J2 ratio changes the ClpB-containing reaction. Do
                not require both J genes for basal modeled capacity, and do not promise identical yield
                with either alone. The native deletion/complementation tests are in M. smegmatis, not
                direct H37Rv viability measurements. Aggregate dissolution and ClpB enhancement remain
                outside the minimal refolding core.
