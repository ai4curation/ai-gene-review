references:
- id: PMID:7937953
  title: The ATP hydrolysis-dependent reaction cycle of the Escherichia coli Hsp70 system DnaK, DnaJ,
    and GrpE.
  findings:
  - statement: 'DnaJ first binds the non-native client, then collaborates with DnaK in the ATP-dependent
      cycle. Reconstituted E. coli DnaK/DnaJ/GrpE folding of denatured firefly luciferase. Abstract-only
      cache: do not invent exact E. coli substrain, construct sequences, protein concentrations or temperatures.
      This is a defined model-client mechanism, not a guarantee for every client.'
    supporting_text: unfolded luciferase binds initially to DnaJ
  - statement: Efficient recovery of the tested luciferase substrate requires repeated cycles. Luciferase
      refolding rather than a universal fixed number of cycles. A single pass releases only a fraction
      as folded protein; avoid a deterministic claim that each cycle yields native protein.
    supporting_text: Several rounds of ATP-dependent interaction with DnaK and DnaJ are required for fully
      efficient folding.
  reference_review:
    review_notes: Cached abstract only. Each finding is bounded by the assay and target identity described
      below.
- id: PMID:1826368
  title: Escherichia coli DnaJ and GrpE heat shock proteins jointly stimulate ATPase activity of DnaK.
  findings:
  - statement: DnaJ accelerates hydrolysis by DnaK; DnaJ is not the ATP-hydrolyzing catalyst. E. coli
      nucleotide-cycle biochemistry separates hydrolysis and nucleotide release. The coupled steady-state
      ATPase increase with DnaJ and GrpE does not make GrpE an ATPase or assign nucleotide hydrolysis
      to DnaJ.
    supporting_text: DnaJ alone leads to an acceleration in the rate of hydrolysis of the DnaK-bound ATP.
  - statement: GrpE promotes release of bound nucleotide, permitting ATP rebinding and client release.
      E. coli nucleotide-release measurements. Describe exchange/reset rather than GrpE catalysis of ATP
      hydrolysis. ATP rebinding and client release belong to the coupled DnaK cycle.
    supporting_text: GrpE alone increases the rate of release of bound ATP or ADP without affecting the
      rate of hydrolysis.
  reference_review:
    review_notes: Cached abstract only. Each finding is bounded by the assay and target identity described
      below.
- id: PMID:11162122
  title: Regulation of ATPase and chaperone cycle of DnaK from Thermus thermophilus by the nucleotide
    exchange factor GrpE.
  findings:
  - statement: Do not require a positive autonomous ATPase-stimulation assertion for Thermus DnaJ2. Thermus
      thermophilus nucleotide-cycle kinetics; the paper also examines GrpE exchange and luciferase refolding.
      This is a negative result under the reported conditions, not proof that stimulation is impossible
      in every client-loaded assembly. The cache is abstract-only.
    supporting_text: DnaJ does not stimulate the DnaK-mediated ATP hydrolysis
  - statement: GrpE-mediated exchange remains effective despite the historical lack of J-mediated ATPase
      stimulation. Stopped-flow/equilibrium nucleotide-analogue measurements; altered refolding kinetics
      need not imply reduced final yield. No universal kinetic magnitude is transferred to other GrpE
      proteins.
    supporting_text: nucleotide exchange is still efficiently stimulated by GrpE.
  reference_review:
    review_notes: Cached abstract only. Each finding is bounded by the assay and target identity described
      below.
- id: PMID:31604242
  title: Structural basis for client recognition and activity of Hsp40 chaperones.
  findings:
  - statement: 'Client-handling work is directly supported independently of a positive ATPase-stimulation
      rate assay. Full-text Results: chemically denatured luciferase in Hsp70/Hsp40/NEF reactions; mutations
      impairing the client-binding domains strongly reduce refolding. The observed J-protein requirement
      is for this reconstituted assay. The general introductory statement about J-domain stimulation is
      not a new direct Thermus ATPase assay.'
    supporting_text: ttHsp40 is essential for the refolding activity of the machinery
  - statement: The Hsp70-Hsp40 interaction participates in client exchange and productive refolding. NMR
      client-complex analysis and refolding perturbations; disruption of the Hsp70 C-tail interaction
      adversely affects refolding. Do not infer that every handoff follows a universal irreversible order
      or that chaperone binding and unfolded-client binding are the same molecular-function assertion.
    supporting_text: Hsp70 binding to Hsp40 displaces the unfolded client.
  reference_review:
    review_notes: Full text accessed. Each finding is bounded by the assay and target identity described
      below.
- id: PMID:41092901
  title: Mechanisms of assembly and function of the Hsp70-Hsp40 chaperone machinery.
  findings:
  - statement: 'Modern productive refolding experiments use Hsp40, Hsp70 and a nucleotide-exchange factor
      together. Methods: firefly luciferase unfolded in6M urea, diluted to0.2µM; 2mM ATP with phosphoenolpyruvate/pyruvate-kinase
      regeneration. Thermus genes DnaJ, DnaK and GrpE are cloned into expression constructs; proteins
      expressed in E. coli BL21(DE3), with affinity-tag removal. This supports the specified three-component
      implementation. An assay recipe alone is not an omission test establishing absolute requirement
      of each component for every client/condition. Productive assay temperature30°C is not the organism
      optimal growth temperature. Point-mutant and monomeric engineered constructs must be distinguished
      from wild-type controls.'
    supporting_text: 0.25μM Hsp40 protein, 5 μM Hsp70 protein and 1 μM NEF at 30 °C
  - statement: DafA stabilizes an inhibited assembly; it is not a required productive folding component.
      The stabilized structural assembly has2Hsp70:2Hsp40:2DafA, not the older3:3:3 arrangement. Structural
      contacts occlude Hsp70 client sites and the J-domain docking surface. Keep observed inhibition/client
      occlusion separate from an independently measured ATPase-rate effect. Mere genomic presence of dafA
      must not veto productive capacity; occupancy/assembly state matters. Intrinsic Hsp40 G/F autoinhibition
      is a separate regulatory mechanism.
    supporting_text: a T. thermophilus protein that binds and inhibits the activity of the Hsp70 machinery
  reference_review:
    review_notes: Full text accessed. Each finding is bounded by the assay and target identity described
      below.
- id: PMID:27872278
  title: Reconstitution of a Mycobacterium tuberculosis proteostasis network highlights essential cofactor
    interactions with chaperone DnaK.
  findings:
  - statement: 'DnaJ1 and DnaJ2 provide alternative positive activation routes with different kinetics.
      Purified Mtb proteins expressed as His-SUMO fusions in E. coli followed by tag cleavage. MS ATP/ADP
      assays: low-cofactor DnaJ2 is more effective; appreciable J1 activation appears at approximately
      equimolar J1:DnaK. Do not collapse J1/J2 into quantitatively equivalent cofactors. Exact H37Rv donor
      construct identity remains the gene audit limitation; species-level biochemistry is not fabricated
      exact-strain evidence.'
    supporting_text: DnaJ1 and DnaJ2 activate the ATPase activity of DnaK differently.
  - statement: One J protein can support activity, while both enhance the tested aggregate-reactivation
      output. Heat-denatured luciferase with Hsp20 during preparation; DnaK/GrpE/J-cofactors restore activity
      and ClpB increases yield. J1:J2 ratio changes the ClpB-containing reaction. Do not require both
      J genes for basal modeled capacity, and do not promise identical yield with either alone. The native
      deletion/complementation tests are in M. smegmatis, not direct H37Rv viability measurements. Aggregate
      dissolution and ClpB enhancement remain outside the minimal refolding core.
    supporting_text: When one J protein was removed, there was approximately half the amount of refolding
  reference_review:
    review_notes: Full text accessed. Each finding is bounded by the assay and target identity described
      below.
- id: PMID:38253530
  title: Structure of the M. tuberculosis DnaK-GrpE complex reveals how key DnaK roles are controlled.
  findings:
  - statement: A DnaK-DnaJ2-GrpE system supports ATP-dependent recovery of a model client without making
      ClpB a core requirement. Full-text Results specify2mM ATP and refolding at25°C. The structure resolves
      an asymmetric1DnaK:2GrpE complex; GrpE-interface mutants impair exchange and refolding. The study
      uses J2, not a direct demonstration that J1 is an equivalent substitute in this exact assay. In
      vivo complementation uses M. smegmatis and Mtb operon constructs; distinguish that from native Mtb
      physiology. The1:2 structural stoichiometry does not require a permanently assembled three-protein
      cycle.
    supporting_text: firefly luciferase was denatured at 42 °C and refolded by DnaK, DnaJ2, and GrpE
  - statement: GrpE allosterically couples nucleotide exchange with client release in the Mtb system.
      Full-length DnaK-GrpE cryo-EM plus peptide-release, exchange and refolding assays. Do not restrict
      GrpE to a passive ADP-release label, but avoid making this Mtb structural route or detailed stoichiometry
      universal across all bacterial systems.
    supporting_text: the disordered GrpE N-terminus is critical for substrate release
  reference_review:
    review_notes: Full text accessed. Each finding is bounded by the assay and target identity described
      below.
- id: PMID:18323638
  title: In vivo and in vitro complementation study comparing the function of DnaK chaperone systems from
    halophilic lactic acid bacterium Tetragenococcus halophilus and Escherichia coli.
  findings:
  - statement: Same-species component presence and an Hsp70 ATPase/holdase identity are insufficient to
      prove productive coupling. Abstract reports tested ATP-hydrolysis and luciferase-refolding conditions;
      T. halophilus DnaJ/GrpE complement E. coli and E. coli DnaK cross-reacts with both sets. Use as
      a bounded negative coupling example, not proof of no native Tetragenococcus refolding under every
      condition. Conversely, do not encode all cross-species combinations as biologically impossible.
    supporting_text: DnaK did not cooperate with the purified DnaJ and GrpE from either T. halophilus
      or E. coli
  reference_review:
    review_notes: Cached abstract only. Each finding is bounded by the assay and target identity described
      below.
- id: PMID:31201219
  title: 'Hsp70 molecular chaperones: multifunctional allosteric holding and unfolding machines.'
  findings:
  - statement: The shared cycle concerns transient, nucleotide-controlled client affinity. Comparative
      review, full text. Useful framing, not independent evidence for a particular strain, accession,
      compatible trio or arbitrary fixed stoichiometry.
    supporting_text: substrate binding is transient and allosterically cycles
  reference_review:
    review_notes: Full text accessed. Each finding is bounded by the assay and target identity described
      below.
- id: PMID:41134158
  title: 'Tuning the Hsp70 chaperone cycle: emerging roles of GrpE-like nucleotide exchange factors in
    proteostasis and organelle function.'
  findings:
  - statement: Conserved ATPase mechanisms coexist with regulatory and substrate differences. Comparative
      review, full text. Do not let its generalized bacterial descriptions override Thermus/Tetragenococcus
      primary exceptions or lineage-specific duplication.
    supporting_text: these systems exhibit striking regulatory diversity and substrate specificity
  reference_review:
