id: MODULE:bacterial_dnak_dnaj_refolding_cycle
title: Bacterial DnaK/DnaJ/GrpE protein refolding cycle
description: A bacterial client-refolding mechanism that couples J-protein-assisted client engagement
  to ATP-driven DnaK remodeling and GrpE-mediated nucleotide exchange. Canonical activating J proteins
  and the Thermus DnaJ2 client-handoff implementation have distinct experimental support. Reviewed Ecoli,
  Pseudomonas, mycobacterial and Thermus proteins ground the roles, with exact assay and sequence limits
  retained. DafA can stabilize an inhibited Thermus assembly but is not required for productive refolding.
  ClpB aggregate dissolution, RpoH feedback and ATP-independent native-protein protection are outside
  the required cycle.
status: COMPLETE
scope: CONCRETE
evidence:
- source_id: PMID:31201219
  title: 'Hsp70 molecular chaperones: multifunctional allosteric holding and unfolding machines.'
  statement: The shared cycle concerns transient, nucleotide-controlled client affinity.
  supporting_text: substrate binding is transient and allosterically cycles
  notes: Comparative review, full text. Useful framing, not independent evidence for a particular strain,
    accession, compatible trio or arbitrary fixed stoichiometry.
- source_id: PMID:41134158
  title: 'Tuning the Hsp70 chaperone cycle: emerging roles of GrpE-like nucleotide exchange factors in
    proteostasis and organelle function.'
  statement: Conserved ATPase mechanisms coexist with regulatory and substrate differences.
  supporting_text: these systems exhibit striking regulatory diversity and substrate specificity
  notes: Comparative review, full text. Do not let its generalized bacterial descriptions override Thermus/Tetragenococcus
    primary exceptions or lineage-specific duplication.
- source_id: PMID:12475169
  title: The DnaK/ClpB chaperone system from Thermus thermophilus.
  statement: Thermus organization and regulation differ from E. coli.
  supporting_text: profound differences in its regulation, and genetic as well as oligomeric organization
  notes: Comparative review, abstract-only cache. Does not establish exact contemporary complex stoichiometry
    or replace primary structural/refolding measurements.
- source_id: PMID:7937953
  title: The ATP hydrolysis-dependent reaction cycle of the Escherichia coli Hsp70 system DnaK, DnaJ,
    and GrpE.
  statement: Efficient recovery of the tested luciferase substrate requires repeated cycles.
  supporting_text: Several rounds of ATP-dependent interaction with DnaK and DnaJ are required for fully
    efficient folding.
  notes: Luciferase refolding rather than a universal fixed number of cycles. A single pass releases only
    a fraction as folded protein; avoid a deterministic claim that each cycle yields native protein.
- source_id: PMID:38253530
  title: Structure of the M. tuberculosis DnaK-GrpE complex reveals how key DnaK roles are controlled.
  statement: A DnaK-DnaJ2-GrpE system supports ATP-dependent recovery of a model client without making
    ClpB a core requirement.
  supporting_text: firefly luciferase was denatured at 42 °C and refolded by DnaK, DnaJ2, and GrpE
  notes: Full-text Results specify2mM ATP and refolding at25°C. The structure resolves an asymmetric1DnaK:2GrpE
    complex; GrpE-interface mutants impair exchange and refolding. The study uses J2, not a direct demonstration
    that J1 is an equivalent substitute in this exact assay. In vivo complementation uses M. smegmatis
    and Mtb operon constructs; distinguish that from native Mtb physiology. The1:2 structural stoichiometry
    does not require a permanently assembled three-protein cycle.
- source_id: PMID:41092901
  title: Mechanisms of assembly and function of the Hsp70-Hsp40 chaperone machinery.
  statement: Modern productive refolding experiments use Hsp40, Hsp70 and a nucleotide-exchange factor
    together.
  supporting_text: 0.25μM Hsp40 protein, 5 μM Hsp70 protein and 1 μM NEF at 30 °C
  notes: 'Methods: firefly luciferase unfolded in6M urea, diluted to0.2µM; 2mM ATP with phosphoenolpyruvate/pyruvate-kinase
    regeneration. Thermus genes DnaJ, DnaK and GrpE are cloned into expression constructs; proteins expressed
    in E. coli BL21(DE3), with affinity-tag removal. This supports the specified three-component implementation.
    An assay recipe alone is not an omission test establishing absolute requirement of each component
    for every client/condition. Productive assay temperature30°C is not the organism optimal growth temperature.
    Point-mutant and monomeric engineered constructs must be distinguished from wild-type controls.'
- source_id: PMID:18323638
  title: In vivo and in vitro complementation study comparing the function of DnaK chaperone systems from
    halophilic lactic acid bacterium Tetragenococcus halophilus and Escherichia coli.
  statement: Same-species component presence and an Hsp70 ATPase/holdase identity are insufficient to
    prove productive coupling.
  supporting_text: DnaK did not cooperate with the purified DnaJ and GrpE from either T. halophilus or
    E. coli
  notes: Abstract reports tested ATP-hydrolysis and luciferase-refolding conditions; T. halophilus DnaJ/GrpE
    complement E. coli and E. coli DnaK cross-reacts with both sets. Use as a bounded negative coupling
    example, not proof of no native Tetragenococcus refolding under every condition. Conversely, do not
    encode all cross-species combinations as biologically impossible.
notes: Three original required role IDs are retained. Broad families identify candidate ancestry, while
  reviewed molecular roles and explicit compatible-cycle witnesses constrain capacity. Ecoli/Pseudomonas
  and Mtb construct/strain evidence are distinguished; Pseudomonas is an inferred reference implementation.
  Contemporary Thermus primary data qualify generalized co-chaperone descriptions in comparative reviews.
