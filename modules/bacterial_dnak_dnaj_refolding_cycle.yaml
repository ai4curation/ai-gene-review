id: MODULE:bacterial_dnak_dnaj_refolding_cycle
title: Bacterial DnaK/DnaJ/GrpE protein refolding cycle
description: >-
  A bacterial cytosolic Hsp70 refolding module in which the Hsp40 co-chaperone
  DnaJ captures unfolded or misfolded clients, stimulates DnaK ATP hydrolysis
  through its J domain, and promotes substrate locking onto DnaK; GrpE then
  drives nucleotide exchange to reset the DnaK cycle and release clients for
  folding. The sigma32/RpoH feedback branch, ClpB-dependent disaggregation, and
  DnaK's ATP-independent holdase side activity are outside this focused
  DnaK/DnaJ/GrpE folding cycle.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0140662
    title: ATP-dependent protein folding chaperone
    statement: Defines DnaK's ATP-dependent client-remodeling activity.
  - source_id: GO:0001671
    title: ATPase activator activity
    statement: Defines DnaJ stimulation of the DnaK ATPase cycle.
  - source_id: file:genes/ECOLI/DnaK/DnaK-ai-review.yaml
    title: ECOLI DnaK gene review
    statement: >-
      The completed E. coli DnaK review grounds DnaK as the Hsp70 ATP-dependent
      protein folding chaperone of the DnaK/DnaJ/GrpE cycle.
  - source_id: file:genes/ECOLI/DnaJ/DnaJ-ai-review.yaml
    title: ECOLI DnaJ gene review
    statement: >-
      The completed E. coli DnaJ review grounds DnaJ as the Hsp40 client
      targeting and DnaK ATPase-activating co-chaperone.
  - source_id: file:genes/ECOLI/grpE/grpE-ai-review.yaml
    title: ECOLI grpE gene review
    statement: >-
      The completed E. coli grpE review grounds GrpE as the DnaK
      adenyl-nucleotide exchange factor.
  - source_id: PMID:1826368
    title: Escherichia coli DnaJ and GrpE heat shock proteins jointly stimulate ATPase activity of DnaK.
    statement: Establishes the stimulation of DnaK ATPase activity by DnaJ and GrpE.
  - source_id: PMID:7937953
    title: >-
      The ATP hydrolysis-dependent reaction cycle of the Escherichia coli Hsp70
      system DnaK, DnaJ, and GrpE.
    statement: >-
      Supports ATP-dependent DnaK/DnaJ cycles as a core route for efficient
      client folding.
  - source_id: PMID:20953191
    title: The kinetic parameters and energy cost of the Hsp70 chaperone as a polypeptide unfoldase.
    statement: >-
      Quantifies the DnaK/DnaJ/GrpE machine as a polypeptide unfoldase that
      uses ATP to remodel stable misfolded clients.
notes: >-
  The completed DnaK, DnaJ, and GrpE ECOLI reviews cover the canonical Hsp70
  refolding machine. The module leaves out DnaJ-independent DnaK functions,
  GrpE's temperature-tuned heat-shock feedback role, and other J-domain
  paralogs.
