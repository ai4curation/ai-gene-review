knowledge_gaps:
  - gap_statement: >-
      How SKN-1 phosphorylation by PMK-1, GSK-3 and the insulin-signaling
      kinases changes its recognition by WDR-23 or its ubiquitination by
      CUL-4/DDB-1 is unknown, and direct ubiquitination of SKN-1 by this
      ligase has not been shown.
    boundary: >-
      WDR-23 acts genetically downstream of the kinase inputs, and WDR-23
      associates with CUL-4/DDB-1, but the phosphosites that control
      degradation and the degron on SKN-1 have not been mapped in the cached
      literature.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      Determines whether the kinase inputs act through the degradation step
      or independently on nuclear transport.
    resolution: >-
      Reconstitute CUL-4/DDB-1/WDR-23 ubiquitination of SKN-1 in vitro with
      phosphomimetic and phospho-dead PMK-1 and GSK-3 site mutants, and
      measure SKN-1 half-life in the corresponding knock-in strains.
    provenance:
      - reference_id: PMID:19273594
        supporting_text: >-
          suggesting that phosphorylation of SKN-1 may function to modify its
          interaction with WDR-23 and/or CUL-4/DDB-1
