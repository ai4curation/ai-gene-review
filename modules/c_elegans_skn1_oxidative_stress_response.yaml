id: MODULE:c_elegans_skn1_oxidative_stress_response
title: SKN-1 oxidative and xenobiotic stress response in Caenorhabditis elegans
description: >-
  SKN-1 is the Caenorhabditis elegans CNC-family transcription factor related
  to mammalian Nrf1/Nrf2. In the intestine it drives the phase II
  detoxification response to oxidative and xenobiotic stress, inducing genes
  such as the glutamate-cysteine ligase gcs-1 and the glutathione
  S-transferase gst-4. SKN-1 binds DNA as a monomer through a Skn domain that
  joins a bZIP-like basic region to an N-terminal arm. Its activity is set by
  the balance of several post-translational inputs. Without stress, the WD40
  substrate receptor WDR-23 associates with the CUL-4/DDB-1 ubiquitin ligase
  and keeps SKN-1 protein levels and nuclear accumulation low, presumably by
  directing it to proteasomal degradation. Glycogen synthase kinase-3
  (GSK-3) phosphorylates SKN-1 and keeps it out of intestinal nuclei. Insulin/
  IGF-1-like signaling kinases (AKT-1, AKT-2, SGK-1) phosphorylate and
  inhibit SKN-1 in parallel. Oxidative stress activates the NSY-1/SEK-1/PMK-1
  p38 MAPK cascade, and PMK-1 phosphorylates SKN-1, which then accumulates in
  intestinal nuclei and activates its target genes. Loss of WDR-23 gives
  constitutive SKN-1 nuclear accumulation and strong target-gene
  induction, and skn-1 mutants are sensitive to oxidative stress and short
  lived.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PMID:12869585
    title: SKN-1 links C. elegans mesendodermal specification to a conserved oxidative stress response.
    statement: >-
      Postembryonic SKN-1 regulates a phase II detoxification gene and
      accumulates in intestinal nuclei under oxidative stress; skn-1 mutants
      are stress-sensitive and short-lived.
    supporting_text: >-
      SKN-1 is present in ASI nuclei under normal conditions, and accumulates
      in intestinal nuclei in response to oxidative stress. skn-1 mutants are
      sensitive to oxidative stress and have shortened lifespans.
  - source_id: PMID:19273594
    title: >-
      The WD40 repeat protein WDR-23 functions with the CUL4/DDB1 ubiquitin
      ligase to regulate nuclear abundance and activity of SKN-1 in
      Caenorhabditis elegans.
    statement: >-
      WDR-23 acts downstream of the p38, GSK-3 and insulin-like inputs, which
      places the CUL-4/DDB-1/WDR-23 step as the integration point for SKN-1
      phosphorylation signals.
    supporting_text: >-
      WDR-23 regulates SKN-1 target genes downstream from p38
      mitogen-activated protein kinase, glycogen synthase kinase 3, and
      insulin-like receptor pathways
  - source_id: PMID:18358814
    title: >-
      Direct inhibition of the longevity-promoting factor SKN-1 by
      insulin-like signaling in C. elegans.
    statement: >-
      Insulin/IGF-1-like signaling kinases phosphorylate and inhibit SKN-1 in
      parallel to DAF-16; recorded as an additional inhibitory input (not
      modeled as a part).
    supporting_text: >-
      The IIS kinases AKT-1, -2, and SGK-1 phosphorylate SKN-1, and reduced
      IIS leads to constitutive SKN-1 nuclear accumulation in the intestine
      and SKN-1 target gene activation.
  - source_id: file:genes/worm/skn-1/skn-1-ai-review.yaml
    title: worm skn-1 gene review
    statement: >-
      Accepts SKN-1 as an RNA polymerase II-specific DNA-binding transcription
      factor for phase II detoxification and oxidative stress genes, with
      separate developmental (EMS specification) and longevity roles.
  - source_id: file:modules/p38_cascade.yaml
    title: p38 stress-activated MAPK cascade module
    statement: >-
      Taxon-neutral p38 MAPK cascade module; the NSY-1/SEK-1/PMK-1 input part
      here is a worm instance of its MAP3K-MAP2K-p38 core.
  - source_id: file:projects/CAEEL_PROTEOSTASIS.md
    title: C. elegans Proteostasis Network Project
    statement: >-
      Project page whose SKN-1/Nrf oxidative-stress tier this module
      organizes.
notes: >-
  Boundary. This is a concrete C. elegans module for the intestinal SKN-1
  (mainly the SKN-1C isoform) phase II detoxification response. It has three
  post-translational inputs on SKN-1 (WDR-23/CUL-4/DDB-1 degradation, GSK-3
  inhibitory phosphorylation and PMK-1 activating phosphorylation), the SKN-1
  transcription step, and a phase II enzyme output part. The developmental
  role of maternal SKN-1 in EMS blastomere specification, the ER-associated
  SKN-1A proteasome-recovery response, and SKN-1B in ASI neurons for dietary
  restriction longevity are outside this boundary. The insulin/IGF-1-like
  AKT-1/AKT-2/SGK-1 inhibitory input (PMID:18358814) is real but the kinases
  are not reviewed here, so it is recorded as context. The GATA factor ELT-3
  is a SKN-1 co-activator for gst-4 (PMID:28600327) and BRAP-2 restrains the
  p38 input (PMID:28600327); both are context, not members.

  Relation to the p38 immunity module. The NSY-1/SEK-1/PMK-1 cascade is
  shared with intestinal antibacterial immunity, where PMK-1 acts through
  ATF-7 and other targets. The cascade itself (TIR-1, NSY-1, SEK-1, PMK-1)
  is modeled in MODULE:c_elegans_pmk1_intestinal_immunity,
  which is the place for kinase-relay detail. Here the cascade is a single
  input part whose leaf annotons carry only each kinase's catalytic activity,
  and the module adds what is specific to the stress response: PMK-1
  phosphorylation of SKN-1. The taxon-neutral MODULE:p38_cascade gives the
  generic relay.

  Relation to mammalian Nrf2. Worms have no KEAP1. WDR-23 is the DCAF11
  ortholog, and the CUL-4/DDB-1/WDR-23 E3 ligase occupies the position that
  KEAP1-CUL3 holds for Nrf2 in mammals. This is an analogy of role, not of
  sequence, and no KEAP1-like cysteine-sensor step is modeled.

  Grounding caveats. The wdr-23 review is filed on S6FN32, a 498-residue
  product that lacks the N termini of the experimentally studied cytoplasmic
  WDR-23A and nuclear WDR-23B isoforms (both from P90794). The nuclear
  WDR-23B isoform is the one that restrains SKN-1 target genes
  (PMID:31409866). CUL-4 (Q17392), DDB-1 (Q21554), GCS-1 (Q20117) and GST-4
  (Q21355) have no worm gene review; their accessions come from UniProt and
  their molecular functions are assigned from UniProt function and catalytic
  activity annotation and from family biology (human DDB1 review), so they
  are less firmly grounded than the reviewed members. Ubiquitination of SKN-1
  by CUL-4/DDB-1/WDR-23 has not been shown biochemically in the cached
  literature; the 2009 study states it as presumed.
module:
  id: c_elegans_skn1_oxidative_stress_response
  label: SKN-1 oxidative and xenobiotic stress response in C. elegans
  module_type: SIGNALING_PATHWAY
  description: >-
    Post-translational control of SKN-1 by CUL-4/DDB-1/WDR-23 degradation,
    GSK-3 inhibitory phosphorylation and p38 PMK-1 activating
    phosphorylation, followed by nuclear SKN-1 induction of phase II
    detoxification genes (gcs-1, gst-4) in the intestine.
  concepts:
    - preferred_term: cellular response to oxidative stress
      term:
        id: GO:0034599
        label: cellular response to oxidative stress
    - preferred_term: cellular detoxification
      term:
        id: GO:1990748
        label: cellular detoxification
      description: >-
        Phase II detoxification output of the response.
  context:
    taxa:
      - preferred_term: Caenorhabditis elegans
        term:
          id: NCBITaxon:6239
          label: Caenorhabditis elegans
    anatomical_locations:
      - preferred_term: intestine
        description: >-
          WBbt:0005772 intestine. The stress-inducible SKN-1 response is
          intestinal; constitutive SKN-1 in ASI neurons is outside the module.
          The WBbt id is given in text because the WBbt prefix is not
          configured for label validation.
    conditions:
      - preferred_term: oxidative stress (e.g. arsenite, peroxide, paraquat) or xenobiotic exposure
  parts:
    - order: 1
      role: constitutive CUL-4/DDB-1/WDR-23 ubiquitin-ligase restraint of SKN-1 abundance
      node:
        id: wdr23_degradation
        label: CUL-4/DDB-1/WDR-23 restraint of SKN-1
        module_type: PROTEIN_COMPLEX
        description: >-
          The WD40 protein WDR-23 associates with the CUL-4/DDB-1 ubiquitin
          ligase and represses SKN-1 protein levels, nuclear accumulation and
          activity, presumably by targeting SKN-1 for proteasomal degradation.
          The nuclear WDR-23B isoform restrains SKN-1 target genes; loss of
          WDR-23 raises gst-4 mRNA about 40-fold. Within the complex, WDR-23
          is the substrate receptor, DDB-1 the adaptor that links it to the
          cullin, and CUL-4 the scaffold.
        concepts:
          - preferred_term: Cul4-RING E3 ubiquitin ligase complex
            term:
              id: GO:0080008
              label: Cul4-RING E3 ubiquitin ligase complex
        annotons:
          - id: wdr23_receptor
            label: WDR-23 substrate receptor for SKN-1
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: WDR-23
                term:
                  id: UniProtKB:S6FN32
                  label: DDB1- and CUL4-associated factor 11 homolog
            function:
              preferred_term: molecular adaptor activity
              term:
                id: GO:0060090
                label: molecular adaptor activity
              targets:
                - preferred_term: SKN-1
            processes:
              - preferred_term: proteasome-mediated ubiquitin-dependent protein catabolic process
                term:
                  id: GO:0043161
                  label: proteasome-mediated ubiquitin-dependent protein catabolic process
                description: >-
                  Presumed outcome; SKN-1 ubiquitination by this ligase has
                  not been shown directly.
            role_description: >-
              DCAF11-family substrate receptor that recruits SKN-1 to the
              CUL-4/DDB-1 ligase and keeps it low in the absence of stress.
            evidence:
              - source_id: PMID:19273594
                title: >-
                  The WD40 repeat protein WDR-23 functions with the CUL4/DDB1
                  ubiquitin ligase to regulate nuclear abundance and activity
                  of SKN-1 in Caenorhabditis elegans.
                statement: >-
                  WDR-23 represses SKN-1 levels, nuclear accumulation and
                  activity with CUL-4/DDB-1, presumably by degradation.
                supporting_text: >-
                  SKN-1 protein levels, nuclear accumulation, and activity are
                  repressed by the WD40 repeat protein WDR-23, which interacts
                  with the CUL-4/DDB-1 ubiquitin ligase to presumably target
                  the transcription factor for proteasomal degradation.
              - source_id: PMID:31409866
                title: >-
                  Nuclear and cytoplasmic WDR-23 isoforms mediate differential
                  effects on GEN-1 and SKN-1 substrates.
                statement: >-
                  Loss of WDR-23 strongly derepresses the SKN-1 target gst-4.
                supporting_text: >-
                  wdr-23(tm1817) showed a significant increase (~40-fold) in
                  gst-4 mRNA levels
              - source_id: file:genes/worm/wdr-23/wdr-23-ai-review.yaml
                title: worm wdr-23 gene review
                statement: >-
                  Core function: molecular adaptor activity (GO:0060090),
                  recruiting substrates to CUL-4/DDB-1; isoform caveats
                  recorded.
          - id: ddb1_adaptor
            label: DDB-1 cullin-receptor adaptor
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: DDB-1
                term:
                  id: UniProtKB:Q21554
                  label: DNA damage-binding protein 1
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
              description: >-
                Assigned from DDB1 family biology (bridging DCAF substrate
                receptors to CUL4) and the human DDB1 review; no worm DDB-1
                review exists.
            role_description: >-
              Links the WDR-23 substrate receptor to CUL-4.
            evidence:
              - source_id: UniProtKB:Q21554
                title: UniProtKB Q21554 DNA damage-binding protein 1 (C. elegans)
                statement: >-
                  UniProt records worm DDB-1 interaction with CUL-4 and its
                  role in CUL-4-dependent CDT-1 degradation.
              - source_id: file:genes/human/DDB1/DDB1-ai-review.yaml
                title: human DDB1 gene review
                statement: >-
                  Ortholog core functions include protein-macromolecule adaptor
                  activity (GO:0030674) and ubiquitin ligase complex scaffold
                  activity.
          - id: cul4_scaffold
            label: CUL-4 cullin scaffold
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CUL-4
                term:
                  id: UniProtKB:Q17392
                  label: Cullin-4
            function:
              preferred_term: ubiquitin ligase complex scaffold activity
              term:
                id: GO:0160072
                label: ubiquitin ligase complex scaffold activity
              description: >-
                Assigned from cullin family biology and UniProt; no worm CUL-4
                review exists.
            role_description: >-
              Cullin scaffold of the CRL4 ligase that ubiquitinates
              receptor-bound substrates.
            evidence:
              - source_id: UniProtKB:Q17392
                title: UniProtKB Q17392 Cullin-4 (C. elegans)
                statement: >-
                  UniProt describes CUL-4 as a component of cullin-based E3
                  ligases whose substrate specificity depends on the variable
                  substrate-recognition subunit, acting with DDB-1.
    - order: 1
      role: inhibitory GSK-3 phosphorylation keeping SKN-1 out of intestinal nuclei
      node:
        id: gsk3_inhibition
        label: GSK-3 inhibitory phosphorylation of SKN-1
        module_type: REGULATORY_STEP
        description: >-
          Without stress, GSK-3 phosphorylates SKN-1 and prevents its nuclear
          accumulation and constitutive activity in the intestine. The GSK-3
          sites are conserved in mammalian SKN-1 orthologs. Even when GSK-3
          inhibition is blocked, basal p38 signaling is still needed for
          SKN-1 function, so the two inputs are not simply redundant.
        annotons:
          - id: gsk3_kinase
            label: GSK-3 serine/threonine kinase acting on SKN-1
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: GSK-3
                term:
                  id: UniProtKB:Q9U2Q9
                  label: Glycogen synthase kinase-3
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              targets:
                - preferred_term: SKN-1
            processes:
              - preferred_term: negative regulation of protein localization to nucleus
                term:
                  id: GO:1900181
                  label: negative regulation of protein localization to nucleus
            role_description: >-
              Inhibitory kinase that holds SKN-1 out of intestinal nuclei in
              the absence of stress.
            evidence:
              - source_id: PMID:16251270
                title: >-
                  Regulation of the Caenorhabditis elegans oxidative stress
                  defense protein SKN-1 by glycogen synthase kinase-3.
                statement: >-
                  GSK-3 phosphorylation prevents SKN-1 nuclear accumulation in
                  the unstressed intestine.
                supporting_text: >-
                  in the absence of stress, phosphorylation by glycogen
                  synthase kinase-3 (GSK-3) prevents SKN-1 from accumulating
                  in nuclei and functioning constitutively in the intestine
              - source_id: file:genes/worm/gsk-3/gsk-3-ai-review.yaml
                title: worm gsk-3 gene review
                statement: >-
                  Core function: protein serine/threonine kinase activity
                  (GO:0004674) restraining SKN-1 nuclear localization; Wnt and
                  OMA-1 roles are separate core functions outside this module.
    - order: 1
      role: stress-activated p38 MAPK phosphorylation of SKN-1
      node:
        id: p38_skn1_activation
        label: NSY-1/SEK-1/PMK-1 p38 MAPK input to SKN-1
        module_type: SIGNALING_PATHWAY
        description: >-
          The NSY-1 (MAP3K), SEK-1 (MAP2K), PMK-1 (p38 MAPK) cascade is the
          same cassette used in intestinal innate immunity, where it is
          modeled in detail (MODULE:c_elegans_pmk1_intestinal_immunity). In
          the oxidative stress response, PMK-1 phosphorylates SKN-1, which
          then accumulates in intestinal nuclei and activates gcs-1
          transcription.
        annotons:
          - id: nsy1_map3k
            label: NSY-1 MAP3K
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: NSY-1
                term:
                  id: UniProtKB:Q21029
                  label: Mitogen-activated protein kinase kinase kinase nsy-1
            function:
              preferred_term: MAP kinase kinase kinase activity
              term:
                id: GO:0004709
                label: MAP kinase kinase kinase activity
              targets:
                - preferred_term: SEK-1
            processes:
              - preferred_term: p38MAPK cascade
                term:
                  id: GO:0038066
                  label: p38MAPK cascade
            role_description: MAP3K at the top of the p38 relay.
            evidence:
              - source_id: PMID:12142542
                title: A conserved p38 MAP kinase pathway in Caenorhabditis elegans innate immunity.
                statement: >-
                  NSY-1 is the MAP3K and SEK-1 the MAP2K of the worm p38
                  cassette upstream of PMK-1.
                supporting_text: >-
                  sek-1, which encodes a mitogen-activated protein (MAP) kinase
                  kinase, and nsy-1, which encodes a MAP kinase kinase kinase
              - source_id: file:genes/worm/nsy-1/nsy-1-ai-review.yaml
                title: worm nsy-1 gene review
                statement: >-
                  Core function: MAP kinase kinase kinase activity
                  (GO:0004709) at the apex of the NSY-1/SEK-1/PMK-1 cascade.
            gocam_associations:
              - model: gomodel:568b0f9600000284
                activity: gomodel:568b0f9600000284/57ec3a7e00000109
                title: Antibacterial innate immune response in the intestine via MAPK cascade (C. elegans)
          - id: sek1_map2k
            label: SEK-1 MAP2K
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: SEK-1
                term:
                  id: UniProtKB:G5EDF7
                  label: Dual specificity mitogen-activated protein kinase kinase sek-1
            function:
              preferred_term: MAP kinase kinase activity
              term:
                id: GO:0004708
                label: MAP kinase kinase activity
              targets:
                - preferred_term: PMK-1
            processes:
              - preferred_term: p38MAPK cascade
                term:
                  id: GO:0038066
                  label: p38MAPK cascade
            role_description: MAP2K that phosphorylates and activates PMK-1.
            evidence:
              - source_id: file:genes/worm/sek-1/sek-1-ai-review.yaml
                title: worm sek-1 gene review
                statement: >-
                  Core function: MAP kinase kinase activity (GO:0004708); the
                  SEK-1/PMK-1 pathway regulates SKN-1 nuclear localization in
