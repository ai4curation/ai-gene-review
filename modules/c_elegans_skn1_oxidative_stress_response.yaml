            gocam_associations:
              - model: gomodel:568b0f9600000284
                activity: gomodel:568b0f9600000284/57ec3a7e00000119
                title: Antibacterial innate immune response in the intestine via MAPK cascade (C. elegans)
          - id: pmk1_p38
            label: PMK-1 p38 MAPK phosphorylating SKN-1
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: PMK-1
                term:
                  id: UniProtKB:Q17446
                  label: Mitogen-activated protein kinase pmk-1
            function:
              preferred_term: MAP kinase activity
              term:
                id: GO:0004707
                label: MAP kinase activity
              targets:
                - preferred_term: SKN-1
            processes:
              - preferred_term: response to oxidative stress
                term:
                  id: GO:0006979
                  label: response to oxidative stress
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              p38 MAPK that phosphorylates SKN-1 under oxidative stress and
              promotes its intestinal nuclear accumulation.
            evidence:
              - source_id: PMID:16166371
                title: >-
                  The C. elegans p38 MAPK pathway regulates nuclear
                  localization of the transcription factor SKN-1 in oxidative
                  stress response.
                statement: >-
                  PMK-1 phosphorylates SKN-1 under oxidative stress, driving
                  its intestinal nuclear accumulation and gcs-1 transcription.
                supporting_text: >-
                  In response to oxidative stress, PMK-1 phosphorylates SKN-1,
                  leading to its accumulation in intestine nuclei, where SKN-1
                  activates transcription of gcs-1, a phase II detoxification
                  enzyme gene.
              - source_id: file:genes/worm/pmk-1/pmk-1-ai-review.yaml
                title: worm pmk-1 gene review
                statement: >-
                  Core function: MAP kinase activity (GO:0004707) with direct
                  phosphorylation of SKN-1 among other substrates.
            gocam_associations:
              - model: gomodel:568b0f9600000284
                activity: gomodel:568b0f9600000284/568b0f9600000285
                title: Antibacterial innate immune response in the intestine via MAPK cascade (C. elegans)
        connections:
          - source: nsy1_map3k
            target: sek1_map2k
            connection_type: POSITIVELY_REGULATES
