id: MODULE:type_ii_fatty_acid_synthesis
title: Type-II (dissociated) fatty-acid synthesis, bacterial and mitochondrial
description: >-
  A reusable dissociated fatty-acid synthase (FAS II) pathway in which each
  reaction is catalysed by a separate enzyme acting on acyl chains carried by
  a free acyl carrier protein (ACP). Malonyl-CoA formed by acetyl-CoA
  carboxylase is loaded onto ACP, an acyl-ACP chain is initiated, and the chain
  is iteratively elongated through condensation, beta-keto reduction,
  dehydration, and enoyl reduction. The same architecture operates in
  bacteria (and plastids) and, as a conserved, endosymbiont-derived system, in
  the mitochondrial matrix of eukaryotes, where it is independent of the
  cytosolic type I FAS and its best-defined product is octanoyl-ACP, the
  precursor of lipoic acid. Mitochondrial FAS II uses a homomeric multidomain
  acetyl-CoA carboxylase, a mitochondrial ACP and partly unrelated reductase
  and dehydratase families. An optional FabA/FabB branch introduces and
  extends cis unsaturation in bacteria. Enzyme-family, cofactor and
  compartment variants are represented explicitly rather than collapsed into a
  type-I fatty-acid synthase.
status: DRAFT
evidence:
  - source_id: YeastPathways:FASYN-ELONG2-PWY
    title: fatty acid elongation (S. cerevisiae, SGD YeastPathways)
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=FASYN-ELONG2-PWY
    statement: >-
      YeastCyc frame for the generic ACP-based elongation round, assigned to
      cytosolic FAS1/FAS2 mixed with the mitochondrial FAS II enzymes CEM1
      (3-oxoacyl-ACP synthase) and OAR1 (3-oxoacyl-ACP reductase). The
      mitochondrial dehydratase HTD2, enoyl reductase ETR1, MCT1 and ACP1 are
      not listed. Mapped here to the mitochondrial FAS II variant; the FAS1/FAS2
      parts belong to fatty_acid_de_novo_synthesis.
  - source_id: PMID:19028688
    title: 'Mitochondrial fatty acid synthesis type II: more than just fatty acids.'
    statement: >-
      Eukaryotes have a conserved mitochondrial FAS pathway independent of
      cytosolic FAS, catalysed by soluble enzymes resembling the prokaryotic
      system; octanoic acid is the direct precursor of lipoic acid, and yeast
      mutants are respiratory deficient with low lipoic acid.
  - source_id: PMID:16246072
    title: Mitochondrial fatty acid synthesis and maintenance of respiratory competent mitochondria in yeast.
    statement: >-
      Characterisation of Etr1p, the HTD2/YHR067w dehydratase and Hfa1p as the
      mitochondrial acetyl-CoA carboxylase completed the yeast mitochondrial
      FAS II pathway.
  - source_id: PMID:14761959
    title: HFA1 encoding an organelle-specific acetyl-CoA carboxylase controls mitochondrial fatty acid synthesis in Saccharomyces cerevisiae.
    statement: >-
      HFA1 encodes a mitochondrially targeted acetyl-CoA carboxylase providing
      malonyl-CoA for intraorganellar fatty acid and lipoic acid synthesis;
      hfa1 mutants resemble mitochondrial FAS mutants.
  - source_id: PMID:9388293
    title: Two genes of the putative mitochondrial fatty acid synthase in the genome of Saccharomyces cerevisiae.
    statement: >-
      OAR1 (YKL055c, 3-oxoacyl-ACP reductase homologue) and MCT1 (YOR221c,
      malonyl-CoA:ACP transferase homologue) disruptions are respiratory
      deficient, like the mitochondrial ACP and beta-ketoacyl-ACP synthase
      mutants.
  - source_id: PMID:8412701
    title: Identification of a new nuclear gene (CEM1) encoding a protein homologous to a beta-keto-acyl synthase which is essential for mitochondrial respiration in Saccharomyces cerevisiae.
    statement: CEM1 encodes a beta-ketoacyl synthase homologue required for respiration but not for bulk fatty acid synthesis.
  - source_id: PMID:15387819
    title: Htd2p/Yhr067p is a yeast 3-hydroxyacyl-ACP dehydratase essential for mitochondrial function and morphology.
    statement: YHR067w/HTD2 encodes the mitochondrial 3-hydroxyacyl-thioester dehydratase 2 of mitochondrial FAS.
  - source_id: PMID:11509667
    title: Candida tropicalis Etr1p and Saccharomyces cerevisiae Ybr026p (Mrf1'p), 2-enoyl thioester reductases essential for mitochondrial respiratory competence.
    statement: >-
      Ybr026p/ETR1 is a mitochondrial 2-enoyl thioester reductase required for
      respiration; the deletion is complemented by mitochondrially targeted
      E. coli FabI.
  - source_id: PMID:9187370
    title: Mitochondrial acyl carrier protein is involved in lipoic acid synthesis in Saccharomyces cerevisiae.
    statement: acp1 deletion mutants retain only 5-10% of wild-type lipoic acid and are respiratory deficient.
  - source_id: PMID:18059524
    title: 'Acyl carrier protein: structure-function relationships in a conserved multifunctional protein family.'
    statement: ACP is a universal carrier of acyl intermediates in fatty acid synthesis.
  - source_id: GO:0006633
    title: fatty acid biosynthetic process
    statement: >-
      GO:0006633 provides the biological-process scope for de novo fatty-acid
      chain initiation and elongation.
  - source_id: UniProtKB:P0A6Q3
    title: Reviewed Escherichia coli FabA UniProt record
    url: https://rest.uniprot.org/uniprotkb/P0A6Q3.txt
    statement: >-
      The reviewed E. coli FabA record has direct GO evidence for both FabA
      reactions and classifies the protein in PTHR30272:SF8.
  - source_id: UniProtKB:P0A953
    title: Reviewed Escherichia coli FabB UniProt record
    url: https://rest.uniprot.org/uniprotkb/P0A953.txt
    statement: >-
      The reviewed E. coli FabB record has direct GO evidence for
      3-oxoacyl-ACP synthase activity and classifies the protein in
      PTHR11712:SF306.
  - source_id: UniProtKB:P0AAI5
    title: Reviewed Escherichia coli FabF UniProt record
    url: https://rest.uniprot.org/uniprotkb/P0AAI5.txt
    statement: >-
      The reviewed E. coli FabF record has direct GO evidence for
      3-oxoacyl-ACP synthase activity and classifies the protein in
      PTHR11712:SF336.
  - source_id: file:modules/type_ii_fatty_acid_synthesis-deep-research-openscientist.md
    title: OpenScientist research for the reusable type-II fatty-acid synthesis module
    statement: >-
      The module-level review supports the obligatory initiation and
      four-reaction elongation sequence, while documenting enzyme-family
      variation and the conditional FabA/FabB unsaturation branch.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__type_ii_fatty_acid_synthesis__ppu00061-deep-research-openscientist.md
    title: OpenScientist PSEPK ppu00061 pathway satisfiability review
    statement: >-
      The species-aware review finds the KT2440 pathway satisfiable, identifies
      AcpP and FabV as core members, and flags several same-family paralogs as
      candidates that must not be assumed to perform the core pathway role.
  - source_id: file:PSEPK/accC/accC-ai-review.yaml
    title: PSEPK accC gene review
    statement: >-
      The KT2440 review identifies Q88QD6 as the biotin-carboxylase subunit of
      acetyl-CoA carboxylase.
  - source_id: file:PSEPK/fabD/fabD-uniprot.txt
    title: UniProtKB entry Q88LL7 for PSEPK FabD
    statement: >-
      UniProt identifies Q88LL7 as malonyl-CoA:ACP transacylase.
  - source_id: file:PSEPK/PP_4379/PP_4379-uniprot.txt
    title: UniProtKB entry Q88ES4 for PSEPK PP_4379
    statement: >-
      UniProt assigns Q88ES4 beta-ketoacyl-ACP synthase III activity.
  - source_id: file:PSEPK/PP_4545/PP_4545-uniprot.txt
    title: UniProtKB entry Q88EC1 for PSEPK PP_4545
    statement: >-
      UniProt assigns Q88EC1 beta-ketodecanoyl-ACP synthase activity.
  - source_id: file:PSEPK/PP_0262/PP_0262-uniprot.txt
    title: UniProtKB entry Q88R72 for PSEPK PP_0262
    statement: >-
      UniProt links Q88R72 to the primary structural and biochemical study of
      the standalone MadB malonyl-ACP decarboxylase.
  - source_id: PMID:36796578
    title: Initiation of fatty acid biosynthesis in Pseudomonas putida KT2440
    statement: >-
      Direct genetics and biochemistry establish three initiation routes:
      short-chain-acyl-CoA-selective FabH1, medium-chain-acyl-CoA-selective
      FabH2, and MadB-dependent production of acetyl-ACP from malonyl-ACP.
  - source_id: file:PSEPK/fabV/fabV-uniprot.txt
    title: UniProtKB entry Q88E33 for PSEPK FabV
    statement: >-
      UniProt identifies Q88E33 as the NADH-dependent enoyl-ACP reductase of
      FAS-II.
module:
