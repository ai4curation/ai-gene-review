        (for example by decarboxylative priming on the KAS enzyme, or by an
        acetyl-ACP-forming transferase) is not established; the PomBase model
        attributes acetyl loading onto mitochondrial ACP to the cytosolic FAS
        subunit fas1.
      boundary: >-
        The chain-initiation part is left with its bacterial variants only;
        mitochondrial representatives are given for loading, condensation and
        the reductive cycle. Biochemical reconstitution with purified
        mitochondrial enzymes would resolve the priming route.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Apart from octanoyl-ACP for lipoic acid synthesis, the end products
        and chain-length termination mechanism of mitochondrial FAS II are
        unknown.
      boundary: >-
        The module stops at acyl-ACP; transfer of the octanoyl group to
        lipoyl domains is modelled in endogenous_protein_lipoylation.
      gap_kind:
        - BIOLOGY
  notes: >-
    ALIGN (YeastPathways project, 2026-10): added eukaryotic mitochondrial FAS
    II. YeastCyc FASYN-ELONG2-PWY ("fatty acid elongation") is a generic
    ACP-based elongation round that mixes cytosolic FAS1/FAS2 with the
    mitochondrial FAS II enzymes CEM1 and OAR1; the FAS1/FAS2 assignments
    belong to fatty_acid_de_novo_synthesis and are not used here. Mitochondrial
    representatives (S. cerevisiae, S. pombe from PomBase model
    678073a900002931) were added to shared roles where the family matches:
    ACP (ACP1, SPAC4H3.09 in PTHR20863), malonyl-CoA:ACP transacylase (MCT1,
    mct1; descriptor has no PANTHER id because human MCAT is in PTHR47170 while
    yeast MCT1 is in PTHR42681), and the FabF/KAS-II variant (CEM1, cem1 in
    PTHR11712:SF336, whose "MITOCHONDRIAL" label now also matches these
    members). New variants were added where the mitochondrial enzyme belongs
    to a different family: a mitochondrial homomeric acetyl-CoA carboxylase
    (HFA1, PTHR45728; PMID:14761959), an OAR1-type ketoreductase
    (PTHR42760:SF133), an HTD2 hotdog dehydratase (PTHR28152) and a MECR/ETR1
    NADPH-dependent enoyl reductase (PTHR43981, GO:0141148). Mitochondrial
    leaves are located in mitochondrion; mitochondrial ACP activation by PPT2
    (S. pombe ppt2) is activation context. YeastCyc corrections: HTD2, ETR1,
    MCT1, ACP1 and HFA1 are missing from FASYN-ELONG2-PWY; HFA1, MCT1, CEM1 and
    OAR1 are instead listed as catalysts of the cytosolic FAS frames. GO-CAM
    disagreements: YeastPathways_FASYN-ELONG2-PWY places CEM1 and OAR1 in
    cytosol, attaches them to the same nodes as cytosolic FAS2, types the FAS1
    dehydratase node (3-HYDROXYDECANOYL-ACP-DEHYDR-RXN) as enoyl-ACP reductase
    GO:0141148 and TES1 as palmitoyl-(protein) hydrolase GO:0008474, and uses
    GO:0030497 fatty acid elongation as the process. The PomBase model
    agrees with the mitochondrial FAS II chain but places cut6 (cytosolic ACC)
    and fas1 acetyltransferase activities in the mitochondrion; S. pombe has no
    HFA1 paralog in this model. Human mtFAS (OXSM, MCAT, CBR4/HSD17B8, HTD2,
    MECR, NDUFAB1) is not fully represented: only MECR shares a PANTHER family
    with its fungal counterpart among the added roles. Exact KT2440 accessions are representative members and do not restrict the
    module to Pseudomonas. Same-family paralogs without a distinct, supported
    pathway role remain gene-level curation questions rather than separate
    module variants. ACP phosphopantetheinylation is required before use but is
    activation context outside this pathway boundary. FabI is grounded to the
    functionally appropriate PTHR43159 parent and PAINT node PTN001215190
    because the current SF2 name is chloroplast-biased even though the
    subfamily contains bacterial FabI. PANTHER's assignments for the FabK
    exemplar (PTHR32332:SF20, a broad
    2-nitropropane-dioxygenase-like group) and the FabL exemplar
    (PTHR43639:SF1, a broad SDR group) are deliberately not used to delimit
    those variants; experimentally characterized UniProt accessions are
    retained as exemplars. The compact cis_unsaturated_branch is integration
    context only; bacterial_unsaturated_fatty_acid_biosynthesis is authoritative
    for the branch-specific FabA/FabB chemistry and optional FabF extension.
    PANTHER's broad PTHR11712:SF336 subfamily contains bacterial FabF, KasA/KasB,
    polyketide-synthase components, and genuine mitochondrial KAS proteins. Its
    official "MITOCHONDRIAL" label is retained verbatim, while the reviewed
    bacterial exemplars and exact leaf function constrain the intended FabF role;
    the label is not a localization assertion for the module.
    The Mad-route condensing-enzyme descriptor remains at parent PTHR11712
    because it intentionally spans FabB and FabF representatives in different
    subfamilies.
    The existing fatty_acid_de_novo_synthesis module describes type-I mammalian
    lipogenesis and is intentionally separate.
