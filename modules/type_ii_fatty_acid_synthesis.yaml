      title: 'fatty acid elongation - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion of the ACP elongation round with CEM1 (GO:0004315) and
        OAR1 (GO:0004316) mixed with cytosolic FAS1/FAS2 and TES1, all placed
        in cytosol and part of GO:0030497 fatty acid elongation. CEM1 and OAR1
        are mitochondrial; HTD2, ETR1, MCT1, ACP1 and HFA1 are absent.
    - model: gomodel:678073a900002931
      title: fatty acid biosynthetic process (GO:0006633)
      description: >-
        PomBase S. pombe model whose mitochondrial sub-model runs mct1 ->
        cem1 -> oar2 -> htd2 -> etr1 -> cem1 on the mitochondrial ACP
        SPAC4H3.09 (activated by ppt2), feeding lip2 lipoylation; it also
        contains cytosolic type I FAS and ER elongation, modelled elsewhere.
