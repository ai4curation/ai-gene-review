      role: malonyl-CoA formation
      node:
        id: acetyl_coa_carboxylation
        label: Acetyl-CoA carboxylase
        module_type: REACTION
        description: >-
          Bacteria use a heteromeric AccABCD complex; the mitochondrial FAS II
          of fungi uses a mitochondrially targeted homomeric multidomain
          carboxylase (S. cerevisiae HFA1).
