  knowledge_gaps:
    - gap_statement: >-
        KT2440 encodes two full-length IlvA-family threonine deaminases,
        Q88HB4/PP_3446 and Q88CN1/PP_5149, with the same predicted reaction and
        isoleucine-pathway assignment.
      boundary: >-
        Either family member can satisfy the biochemical entry step in this
        first-pass module. Direct genetics, expression, or enzyme regulation
        data are needed to determine whether both carry biosynthetic flux and
        whether they specialize by growth condition.
      gap_kind:
        - BIOLOGY
      status: OPEN
    - gap_statement: >-
        The exact Q88CQ2 record assigns a 2Fe-2S cluster, whereas other IlvD
        family literature commonly describes a 4Fe-4S catalytic cluster.
      boundary: >-
        The reusable module therefore requires an iron-sulfur cluster without
        imposing one cluster nuclearity. Direct biochemical or spectroscopic
        characterization is needed to establish the Q88CQ2 cofactor state.
      gap_kind:
        - BIOLOGY
      status: OPEN
    - gap_statement: >-
        Fission yeast has a single branched-chain aminotransferase (eca39),
        yet its BCAA trunk is mitochondrial and its leucine branch ends in the
        cytosol. How one protein serves both compartments (dual targeting,
        metabolite shuttling, or a predominant single location) is not
        established; UniProt gives a mitochondrial location by similarity
        and a cytoplasmic/nuclear location from a GFP-fusion screen.
      boundary: >-
        Compartment-specific localization and flux experiments (tagged eca39
        at the endogenous locus, targeting-sequence mutants) are needed to
        decide whether the S. pombe transamination step is mitochondrial,
        cytosolic, or both.
      gap_kind:
        - BIOLOGY
      status: OPEN
  notes: >-
    YeastPathways alignment (BRANCHED-CHAIN-AA-SYN-PWY-1, ILEUSYN-PWY-1,
    VALSYN-PWY, LEUSYN-PWY-1). All four SGD frames are subsets of this module
    and no YeastCyc reaction was rejected. Corrections and additions to the
    YeastCyc gene lists: LEU2 is the 3-isopropylmalate dehydrogenase
    (RXN-13158 has no gene in the pathway summary); OAC1 exports
    2-isopropylmalate from mitochondria (PMID:18682385) and is modelled as an
    optional fungal transport part; BAT2 is retained as a catalyst but is
    mainly the catabolic paralog (PMID:21267457). Compartments: the SGD GO-CAM
    conversions place every activity in the cytosol, but ILV1, ILV2/ILV6,
    ILV5, ILV3, BAT1, LEU9 and the long LEU4 form are mitochondrial;
    only LEU1, LEU2, BAT2 and the short LEU4 form are cytosolic
    (PMID:12626680, PMID:3275644, PMID:8798704). The SGD conversion also types
    all BAT1/BAT2 reactions as GO:0052656 L-isoleucine transaminase, including
    the valine and leucine reactions; the module uses the parent GO:0004084.
    The PomBase model has no valine transamination and no causal edge from
    tda1 to AHAS, and places one ilv5 activity in GO:0006551 L-leucine
    metabolic process rather than GO:0009098. S. pombe gene symbols are
    confusing relative to budding yeast: S. pombe ilv1 is the AHAS catalytic
    subunit (ILV2 ortholog), tda1 is the threonine deaminase, leu3 is
    2-isopropylmalate synthase, leu2 the isomerase and leu1 the
    dehydrogenase. Upstream supplies (thiamine diphosphate import for AHAS,
    CoA and acetyl-CoA in mitochondria, Fe-S cluster assembly for ILV3/LEU1),
    regulators (Leu3/alpha-IPM, Gcn4), tRNA charging and BCAA transport are
    outside the module. The PSEPK ppu00290 bucket also contains shorter
    serine/threonine dehydratases, two additional AHAS-like large subunits,
    AlaA, and leucine dehydrogenase. They are not counted as module members
    because pathway-map membership alone does not establish that they supply
    the physiological biosynthetic route. IlvA is required only for the
    isoleucine precursor input. Its PROVIDES_INPUT_FOR edge records
    2-oxobutanoate supply without making IlvA a prerequisite for the
    pyruvate-only valine branch.
