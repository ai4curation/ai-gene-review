id: MODULE:branched_chain_amino_acid_biosynthesis
title: L-valine, L-leucine, and L-isoleucine biosynthesis
description: >-
  De novo biosynthesis of the three branched-chain amino acids in bacteria,
  archaea, fungi and plants; the pathway is absent from animals. L-isoleucine
  synthesis begins with threonine deamination to 2-oxobutanoate. An
  acetohydroxy-acid synthase (a catalytic large subunit with a regulatory small
  subunit), ketol-acid reductoisomerase and dihydroxy-acid dehydratase then form
  a shared catalytic trunk that processes either the valine precursor derived
  from two pyruvate molecules or the isoleucine precursor derived from pyruvate
  plus 2-oxobutanoate. The valine intermediate 2-oxoisovalerate also enters a
  three-reaction leucine extension (2-isopropylmalate synthase, isopropylmalate
  isomerase and 3-isopropylmalate dehydrogenase). A branched-chain amino-acid
  aminotransferase performs the terminal transamination for all three products.
  The reaction chain is conserved, but two features vary by lineage. First,
  isopropylmalate isomerase is a heteromeric LeuC-LeuD enzyme in bacteria and
  plants but a single fused polypeptide in fungi. Second, in fungi the pathway
  is split between compartments: threonine deaminase, the shared trunk, most
  2-isopropylmalate synthase and a biosynthetic aminotransferase are in the
  mitochondrial matrix, 2-isopropylmalate is exported to the cytosol by a
  mitochondrial carrier, and the isomerase and dehydrogenase are cytosolic. In
  budding yeast, mitochondrial BAT1 and cytosolic BAT2 are paralogous
  aminotransferases, with BAT1 favoured for biosynthesis and BAT2 for
  catabolism.
status: DRAFT
evidence:
  - source_id: GO:0009082
    title: Branched-chain amino acid biosynthetic process
    statement: >-
      The module is grounded in the GO biological process for valine, leucine,
      and isoleucine biosynthesis.
  - source_id: GO:0009099
    title: L-valine biosynthetic process
    statement: Product-specific child process covered by the shared trunk plus terminal transamination.
  - source_id: GO:1901705
    title: L-isoleucine biosynthetic process
    statement: Product-specific child process covered by threonine deamination, the shared trunk and terminal transamination.
  - source_id: GO:0009098
    title: L-leucine biosynthetic process
    statement: Product-specific child process covered by the shared trunk, the leucine extension and terminal transamination.
  - source_id: YeastPathways:BRANCHED-CHAIN-AA-SYN-PWY-1
    title: superpathway of branched chain amino acid biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      The SGD superpathway lists ILV1, ILV2/ILV6, ILV5, ILV3, LEU4/LEU9, LEU1
      and BAT1/BAT2 as catalysts and gives no gene for the
      3-isopropylmalate dehydrogenase reaction (RXN-13158). LEU2 was added for
      that step (it is present as the enabler of RXN-13158 in the SGD GO-CAM
      conversion), and OAC1 was added as the fungal 2-isopropylmalate exporter.
      The YeastPathways comment correctly describes the mitochondrial trunk,
      alpha-IPM export and cytosolic leucine branch.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=BRANCHED-CHAIN-AA-SYN-PWY-1
  - source_id: YeastPathways:ILEUSYN-PWY-1
    title: L-isoleucine biosynthesis I (from threonine) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Isoleucine sub-pathway (ILV1, ILV2/ILV6, ILV5, ILV3, BAT1/BAT2); every
      reaction is contained in this module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=ILEUSYN-PWY-1
  - source_id: YeastPathways:VALSYN-PWY
    title: L-valine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Valine sub-pathway (ILV2/ILV6, ILV5, ILV3, BAT1/BAT2); every reaction is
      contained in this module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=VALSYN-PWY
  - source_id: YeastPathways:LEUSYN-PWY-1
    title: L-leucine biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Leucine-specific sub-pathway (LEU4/LEU9, LEU1, BAT1/BAT2); the
      3-isopropylmalate dehydrogenase reaction is listed without a gene and is
      assigned here to LEU2.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=LEUSYN-PWY-1
  - source_id: PMID:12626680
    title: 'Leucine biosynthesis in fungi: entering metabolism through the back door.'
    statement: >-
      Review (cited by YeastPathways) describing the S. cerevisiae pathway and
      its compartmentation: the enzymes converting pyruvate and
      2-oxobutanoate to the valine and isoleucine 2-oxoacid precursors and to
      alpha-isopropylmalate are largely mitochondrial, whereas isopropylmalate
      isomerase (LEU1) and beta-isopropylmalate dehydrogenase (LEU2) are
      entirely cytoplasmic; Bat1p is the mitochondrial and Bat2p the cytosolic
      branched-chain aminotransferase.
  - source_id: PMID:3289762
    title: Regulation of isoleucine-valine biosynthesis in Saccharomyces cerevisiae.
    statement: Cited by YeastPathways for the isoleucine and valine sub-pathways.
  - source_id: PMID:22419079
    title: Regulation of amino acid, nucleotide, and phosphate metabolism in Saccharomyces cerevisiae.
    statement: YeastBook review cited by YeastPathways for the superpathway and its regulation.
  - source_id: PMID:25408465
    title: Inhibitors of amino acids biosynthesis as antifungal agents.
    statement: >-
      Cited by YeastPathways; background on the absence of the pathway from
      mammals and its use as an antifungal target.
  - source_id: PMID:37455545
    title: Branched-chain amino acid biosynthesis in fungi.
    statement: >-
      Review of fungal BCAA biosynthesis noting that the pathway is
      well-characterized in S. cerevisiae and that gene duplication and
      functional divergence of pathway genes vary among fungi.
  - source_id: PMID:10213630
    title: Expression, purification, characterization, and reconstitution of the large and small subunits of yeast acetohydroxyacid synthase.
    statement: >-
      ILV6 is a mitochondrial AHAS small subunit that stimulates ILV2 catalytic
      activity up to 7-fold and confers valine sensitivity.
  - source_id: PMID:3275644
    title: Yeast LEU4 encodes mitochondrial and nonmitochondrial forms of alpha-isopropylmalate synthase.
    statement: >-
      LEU4 produces a long mitochondrial form and a short cytoplasmic form of
      alpha-isopropylmalate synthase; the short form is functional in leucine
      biosynthesis.
  - source_id: PMID:25841022
    title: Diversification of Paralogous α-Isopropylmalate Synthases by Modulation of Feedback Control and Hetero-Oligomerization in Saccharomyces cerevisiae.
    statement: >-
      LEU4 and LEU9 encode alpha-IPM synthase isozymes; the Leu4 homodimer is
      leucine-sensitive, the Leu9 homodimer is resistant, and Leu4-Leu9
      heterodimers form in vivo.
  - source_id: PMID:20657649
    title: Two origins for the gene encoding alpha-isopropylmalate synthase in fungi.
    statement: >-
      S. pombe leu3+ encodes alpha-isopropylmalate synthase (its auxotrophy was
      complemented by Phycomyces leuA); the zygomycete/chytrid leuA genes are
      more closely related to plant and photosynthetic-bacterial homologs than
      to ascomycete or basidiomycete genes, so fungi have two origins for this
      enzyme.
  - source_id: PMID:18682385
    title: alpha-Isopropylmalate, a leucine biosynthesis intermediate in yeast, is transported by the mitochondrial oxalacetate carrier.
    statement: >-
      Alpha-IPM produced in mitochondria must be exported to the cytosol; the
      reconstituted mitochondrial oxalacetate carrier Oac1p transports
      alpha-IPM, and an oac1 leu4 double deletion cannot grow on fermentable
      substrates without leucine.
  - source_id: PMID:8798704
    title: Mitochondrial and cytosolic branched-chain amino acid transaminases from yeast, homologs of the myc oncogene-regulated Eca39 protein.
    statement: >-
      Bat1p is targeted to the mitochondrial matrix and Bat2p is cytosolic;
      the bat1 bat2 double deletion is auxotrophic for Ile, Leu and Val.
  - source_id: PMID:8702755
    title: Two yeast homologs of ECA39, a target for c-Myc regulation, code for cytosolic and mitochondrial branched-chain amino acid aminotransferases.
    statement: Independent identification of the cytosolic and mitochondrial yeast BCAT paralogs; cited by YeastPathways.
  - source_id: PMID:10989445
    title: Branched-chain-amino-acid transaminases of yeast Saccharomyces cerevisiae.
    statement: Cited by YeastPathways for the BAT1/BAT2 transamination reactions.
  - source_id: PMID:21267457
    title: Saccharomyces cerevisiae Bat1 and Bat2 aminotransferases have functionally diverged from the ancestral-like Kluyveromyces lactis orthologous enzyme.
    statement: >-
      The single K. lactis BCAT is bifunctional (biosynthesis and catabolism);
      in S. cerevisiae these roles are partitioned between BAT1 (biosynthetic,
      mitochondrial) and BAT2 (catabolic, cytosolic).
  - source_id: PMID:35325114
    title: Response to leucine in Schizosaccharomyces pombe (fission yeast).
    statement: >-
      Review of the S. pombe pathway with experimental confirmation that
      SPAC17G8.06c (ilv3+) encodes dihydroxy-acid dehydratase (complemented by
      S. cerevisiae ILV3); leu3+ encodes the only known S. pombe
      2-isopropylmalate synthase, leu2+ the isomerase, leu1+ the dehydrogenase
      and eca39+ the aminotransferase.
  - source_id: KEGG:ppu00290
    title: Pseudomonas putida KT2440 valine, leucine, and isoleucine biosynthesis
    statement: >-
      The PSEPK pathway instance supplies the candidate set for the species-level
      satisfiability pass; map spillover and paralogous enzyme families require
      manual boundary curation.
  - source_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
    title: PSEPK UniProt metadata table
    statement: >-
      Supplies the exact PSEPK accessions, locus tags, protein families, and
      pathway keywords used for the representative members below.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__branched_chain_amino_acid_biosynthesis__ppu00290-deep-research-openscientist.md
    title: OpenScientist module/pathway/taxon report for PSEPK branched-chain amino-acid biosynthesis
    statement: >-
      Supports the six-part pathway boundary, coverage by the selected KT2440
      proteins, and exclusion of broad-map and catabolic-family candidates.
      Individual assignments remain based on exact database records and
      orthology because the report found no target-strain enzymology for the
      proteins themselves; IlvA and additional AHAS-family paralog roles remain
      unresolved.
  - source_id: PANTHER:PTN002459384
    title: PAINT threonine-deaminase ancestral node
    statement: >-
      Local PTHR48078 PAINT data place GO:0004794 by IBD at PTN002459384,
      seeded in part by reviewed Escherichia coli IlvA P04968.
  - source_id: PANTHER:PTN000483120
    title: PAINT ketol-acid reductoisomerase ancestral node
    statement: >-
      Local PTHR21371 PAINT data place GO:0004455 by IBD at PTN000483120,
      seeded in part by reviewed Escherichia coli IlvC P05793.
  - source_id: PANTHER:PTN002879868
    title: PAINT isopropylmalate-dehydratase small-subunit ancestral node
    statement: >-
      Local PTHR43345 PAINT data place GO:0003861 by IBD at PTN002879868,
      seeded in part by reviewed Salmonella LeuD P04787.
  - source_id: PANTHER:PTN000216982
    title: PAINT isopropylmalate-dehydrogenase ancestral node
    statement: >-
      Local PTHR42979 PAINT data place GO:0003862 by IBD at PTN000216982,
      seeded in part by reviewed Escherichia coli LeuB P30125.
module:
  id: branched_chain_amino_acid_biosynthesis
  label: branched-chain amino acid biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: branched-chain amino acid biosynthetic process
      term:
        id: GO:0009082
        label: branched-chain amino acid biosynthetic process
      description: Formation of L-valine, L-leucine, and L-isoleucine.
    - preferred_term: L-valine biosynthetic process
      term:
        id: GO:0009099
        label: L-valine biosynthetic process
      description: Two pyruvate through the shared trunk and terminal transamination.
    - preferred_term: L-isoleucine biosynthetic process
      term:
        id: GO:1901705
        label: L-isoleucine biosynthetic process
      description: L-threonine plus pyruvate through the shared trunk and terminal transamination.
    - preferred_term: L-leucine biosynthetic process
      term:
        id: GO:0009098
        label: L-leucine biosynthetic process
      description: 2-oxoisovalerate through the leucine extension and terminal transamination.
  gocam_associations:
    - model: gomodel:YeastPathways_BRANCHED-CHAIN-AA-SYN-PWY-1
      title: 'superpathway of branched chain amino acid biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD conversion for S. cerevisiae covering all module reactions except
        alpha-IPM export. Every activity is placed in cytosol (GO:0005829) and
        no causal edges are given; ILV1, ILV2/ILV6, ILV5, ILV3, BAT1 and
        mitochondrial LEU4/LEU9 are mitochondrial. All three BAT1/BAT2
        transaminations are typed GO:0052656 (L-isoleucine transaminase),
        including the valine and leucine reactions. LEU2 enables RXN-13158
        here, although the pathway summary lists no gene for that reaction.
    - model: gomodel:YeastPathways_ILEUSYN-PWY-1
      title: 'L-isoleucine biosynthesis I (from threonine) - imported from: Saccharomyces Genome Database'
      description: >-
        SGD isoleucine sub-pathway (ILV1, AHAS complex, ILV5, ILV3, BAT1/BAT2);
        same cytosol-only placement as the superpathway model.
    - model: gomodel:YeastPathways_VALSYN-PWY
      title: 'L-valine biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD valine sub-pathway (AHAS complex, ILV5, ILV3, BAT1/BAT2); the
        valine transamination is typed GO:0052656 (isoleucine) rather than
        GO:0052655.
    - model: gomodel:YeastPathways_LEUSYN-PWY-1
      title: 'L-leucine biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD leucine-specific sub-pathway (LEU4/LEU9, LEU1, LEU2, BAT1/BAT2);
        the leucine transamination is typed GO:0052656 rather than GO:0052654,
        and the LEU4/LEU9 activity is placed in cytosol only.
    - model: gomodel:6690711d00002706
      title: L-isoleucine biosynthetic process (GO:1901705), L-leucine biosynthetic process (GO:0009098)
      description: >-
        PomBase S. pombe model with mitochondrial tda1, ilv1/ilv6 AHAS, ilv5,
        ilv3, leu3 and eca39 (isoleucine transamination), the oac1
        isopropylmalate exporter in the mitochondrial inner membrane, and
        cytosolic leu2, leu1 and eca39 (leucine transamination). No valine
        transamination activity is modelled. The model also contains
        mitochondrial isoleucyl- and leucyl-tRNA ligases, a thiamine
        diphosphate transporter (AHAS cofactor supply), an L-leucine
        transporter, L-alanine transaminase and pyruvate dehydrogenase E2,
        which lie outside this module.
  parts:
    - order: 1
      role: isoleucine-branch 2-oxobutanoate supply
      node:
        id: ilvA_step
        label: L-threonine to 2-oxobutanoate
        module_type: REACTION
        annotons:
          - id: ilvA_activity
            label: Biosynthetic threonine deaminase (IlvA/ILV1)
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: threonine deaminase activity
                term:
                  id: GO:0004794
                  label: threonine deaminase activity
              family:
                preferred_term: full-length biosynthetic threonine deaminase family
                term:
                  id: PANTHER:PTHR48078:SF11
                  label: THREONINE DEHYDRATASE, MITOCHONDRIAL
                representative_members:
                  - preferred_term: ilvA-I (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88HB4
                      label: L-threonine dehydratase
                    description: Pseudomonas putida KT2440 ilvA-I/PP_3446.
                  - preferred_term: ilvA-II (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88CN1
                      label: L-threonine dehydratase
                    description: Pseudomonas putida KT2440 ilvA-II/PP_5149.
                  - preferred_term: ilvA (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P04968
                      label: L-threonine dehydratase biosynthetic IlvA
                    description: Reviewed bacterial biosynthetic IlvA exemplar.
                  - preferred_term: ILV1 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P00927
                      label: Threonine dehydratase, mitochondrial
                    description: >-
                      S. cerevisiae ILV1/YER086W; mitochondrial, isoleucine
                      inhibited and valine activated.
                  - preferred_term: tda1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:O94634
                      label: Threonine dehydratase, mitochondrial
                    description: S. pombe tda1/SPBC1677.03c.
                ancestral_nodes:
                  - preferred_term: PAINT threonine-deaminase ancestral node
                    term:
                      id: PANTHER:PTN002459384
                      label: PTN002459384
                    description: >-
                      PTHR48078 IBD node for GO:0004794, seeded by P04968 and
                      other experimentally annotated threonine deaminases.
                    evidence:
                      - source_id: GO_REF:0000033
                        statement: IBD propagation from PTN002459384 in PTHR48078.
                notes: >-
                  The official PANTHER subfamily label is retained verbatim;
                  its mitochondrial wording reflects eukaryotic members and
                  does not assert a location for bacterial IlvA proteins.
            function:
              preferred_term: threonine deaminase activity
              term:
                id: GO:0004794
                label: threonine deaminase activity
              substrates:
                - preferred_term: L-threonine
              products:
                - preferred_term: 2-oxobutanoate
                - preferred_term: ammonium
              cofactors:
                - preferred_term: pyridoxal 5'-phosphate
              evidence:
                - source_id: EC:4.3.1.19
                  statement: L-threonine dehydratase reaction
            gocam_associations:
              - model: gomodel:YeastPathways_BRANCHED-CHAIN-AA-SYN-PWY-1
                activity: gomodel:THREDEHYD-RXN
                title: 'superpathway of branched chain amino acid biosynthesis - imported from: Saccharomyces Genome Database'
                description: ILV1 enables GO:0004794 (placed in cytosol; ILV1 is mitochondrial).
              - model: gomodel:6690711d00002706
                activity: gomodel:6690711d00002706/6690711d00002707
                title: L-isoleucine biosynthetic process (GO:1901705), L-leucine biosynthetic process (GO:0009098)
                description: S. pombe tda1 enables GO:0004794 in the mitochondrial matrix; no causal edge to AHAS.
            role_description: >-
              Supplies 2-oxobutanoate for the isoleucine branch; mitochondrial
              in fungi. KT2440 has two full-length IlvA-family proteins with
              the same reviewed pathway assignment; their relative
              physiological contributions remain unresolved.
    - order: 2
      role: acetohydroxy-acid formation
      node:
        id: ilvIH_step
        label: Acetohydroxy-acid synthase complex
        module_type: PROTEIN_COMPLEX
        concepts:
          - preferred_term: acetolactate synthase complex
            term:
              id: GO:0005948
              label: acetolactate synthase complex
            description: >-
              Heteromeric biosynthetic synthase of a catalytic large subunit
              (IlvI/ILV2) and a regulatory small subunit (IlvH/ILV6).
        description: >-
          The catalytic large subunit (bacterial IlvI, fungal ILV2/ilv1) and the
          non-catalytic regulatory small subunit (bacterial IlvH, fungal
          ILV6/ilv6) form the complex, which accepts either pyruvate plus
          pyruvate or pyruvate plus 2-oxobutanoate. In fungi the complex is in
          the mitochondrial matrix; yeast ILV6 stimulates ILV2 activity up to
          7-fold and confers valine feedback sensitivity (PMID:10213630).
        annotons:
          - id: ilvI_activity
            label: Acetohydroxy-acid synthase catalytic subunit (IlvI/ILV2)
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: acetolactate synthase activity
                term:
                  id: GO:0003984
                  label: acetolactate synthase activity
              family:
                preferred_term: biosynthetic acetohydroxy-acid synthase large subunit
                term:
                  id: NCBIfam:TIGR00118
                  label: acetolactate synthase, large subunit, biosynthetic type
                representative_members:
                  - preferred_term: ilvI (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88DY8
                      label: Acetolactate synthase
                    description: Pseudomonas putida KT2440 ilvI/PP_4680.
                  - preferred_term: ILV2 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P07342
                      label: Acetolactate synthase catalytic subunit, mitochondrial
                    description: S. cerevisiae ILV2/YMR108W; mitochondrial.
                  - preferred_term: ilv1 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:P36620
                      label: Acetolactate synthase, mitochondrial
                    description: >-
                      S. pombe ilv1/SPBP35G2.07, the AHAS catalytic subunit
                      (not the S. cerevisiae ILV1 threonine deaminase
                      ortholog despite the shared symbol).
                notes: >-
                  The exact Q88DY8, P07342 and P36620 UniProt records all
                  assign TIGR00118 (and PANTHER PTHR18968:SF13). Broad
                  PTHR18968 contains non-AHAS enzymes and is not used as the
                  biosynthetic catalytic-subunit selector.
            function:
              preferred_term: acetolactate synthase activity
              term:
                id: GO:0003984
                label: acetolactate synthase activity
              substrates:
                - preferred_term: pyruvate
                - preferred_term: pyruvate or 2-oxobutanoate
              products:
                - preferred_term: 2-acetolactate or 2-aceto-2-hydroxybutanoate
                - preferred_term: carbon dioxide
              cofactors:
                - preferred_term: thiamine diphosphate
                - preferred_term: FAD
                - preferred_term: magnesium ion
              evidence:
                - source_id: EC:2.2.1.6
                  statement: acetolactate synthase reaction
            gocam_associations:
              - model: gomodel:YeastPathways_BRANCHED-CHAIN-AA-SYN-PWY-1
                activity: gomodel:ACETOLACTSYN-RXN
                title: 'superpathway of branched chain amino acid biosynthesis - imported from: Saccharomyces Genome Database'
                description: AHAS complex SGD:S000218137 enables GO:0003984 (valine precursor; placed in cytosol).
              - model: gomodel:YeastPathways_BRANCHED-CHAIN-AA-SYN-PWY-1
                activity: gomodel:ACETOOHBUTSYN-RXN
                title: 'superpathway of branched chain amino acid biosynthesis - imported from: Saccharomyces Genome Database'
                description: AHAS complex SGD:S000218137 enables GO:0003984 (isoleucine precursor; placed in cytosol).
              - model: gomodel:6690711d00002706
                activity: gomodel:6690711d00002706/6690711d00002719
                title: L-isoleucine biosynthetic process (GO:1901705), L-leucine biosynthetic process (GO:0009098)
                description: S. pombe ilv1 enables GO:0003984 in the mitochondrial matrix (isoleucine branch).
              - model: gomodel:6690711d00002706
                activity: gomodel:6690711d00002706/678073a900001305
                title: L-isoleucine biosynthetic process (GO:1901705), L-leucine biosynthetic process (GO:0009098)
                description: S. pombe ilv1 enables GO:0003984 in the mitochondrial matrix (leucine branch).
          - id: ilvH_regulator_activity
            label: Acetohydroxy-acid synthase regulatory subunit (IlvH/ILV6)
            participant:
              selector_type: FAMILY
              required_function:
                preferred_term: acetolactate synthase regulator activity
                term:
                  id: GO:1990610
                  label: acetolactate synthase regulator activity
              family:
                preferred_term: biosynthetic acetohydroxy-acid synthase small subunit
                family_terms:
                  - id: PANTHER:PTHR30239
                    label: ACETOLACTATE SYNTHASE SMALL SUBUNIT
                  - id: PANTHER:PTHR31242
                    label: ACETOLACTATE SYNTHASE SMALL SUBUNIT, MITOCHONDRIAL
                representative_members:
                  - preferred_term: ilvH (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88DY9
                      label: Acetolactate synthase small subunit
                    description: Pseudomonas putida KT2440 ilvH/PP_4679.
                  - preferred_term: ilvN (Escherichia coli K-12)
                    term:
                      id: UniProtKB:P0ADF8
                      label: Acetolactate synthase isozyme 1 small subunit
                    description: Reviewed bacterial regulatory-subunit exemplar.
                  - preferred_term: ILV6 (Saccharomyces cerevisiae)
                    term:
                      id: UniProtKB:P25605
                      label: Acetolactate synthase small subunit, mitochondrial
                    description: >-
                      S. cerevisiae ILV6/YCL009C; mitochondrial regulatory
                      subunit (PMID:10213630).
                  - preferred_term: ilv6 (Schizosaccharomyces pombe)
                    term:
                      id: UniProtKB:O60086
                      label: Probable acetolactate synthase small subunit
                    description: S. pombe ilv6/SPBC14C8.04.
                notes: >-
                  Bacterial small subunits are in PTHR30239 whereas the fungal
                  ILV6/ilv6 proteins are in the separate PTHR31242 family (both
                  per UniProt cross-references), so both families are listed.
                  The local PTHR30239 PAINT export places catalytic GO:0003984
                  at a node seeded by small subunits. That assertion is not
                  used here because the small subunit regulates rather than
                  performs the acetolactate-forming chemistry. The same
                  PTN000767018 node carries GO:0009099, but local exports do not
                  establish that Q88DY9 descends from that node, so the process
                  assertion is not promoted either.
            function:
              preferred_term: acetolactate synthase regulator activity
              term:
                id: GO:1990610
                label: acetolactate synthase regulator activity
              evidence:
                - source_id: PMID:10213630
                  statement: >-
                    Reconstitution studies showed that the ilv6 protein
