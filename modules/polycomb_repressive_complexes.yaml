                      gene_product:
                        preferred_term: EZH1
                        term:
                          id: UniProtKB:Q92800
                          label: Histone-lysine N-methyltransferase EZH1
                    function:
                      preferred_term: histone H3K27 trimethyltransferase activity
                      term:
                        id: GO:0140951
                        label: histone H3K27 trimethyltransferase activity
                  - id: unit_eed
                    label: EED
                    role: WD40 subunit required for activity; its aromatic cage binds H3K27me3 and allosterically activates EZH1/2
                    participant:
