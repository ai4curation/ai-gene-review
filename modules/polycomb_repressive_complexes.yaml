id: MODULE:polycomb_repressive_complexes
title: Human Polycomb repressive complexes — PRC2 (EZH1 or EZH2 with EED, SUZ12 and RBBP4/7, in PRC2.1 and PRC2.2 forms) trimethylating histone H3 lysine 27, and canonical (CBX-PHC-PCGF2/4) and variant (PCGF1/3/5/6 with RYBP or YAF2) PRC1 monoubiquitylating histone H2A lysine 119 through the RING1A/RING1B E3 ligase
description: >-
  Polycomb group proteins maintain the repressed state of developmental regulators
  through two classes of chromatin-modifying complexes that build facultative
  heterochromatin. Polycomb repressive complex 2 (PRC2) mono-, di- and trimethylates
  histone H3 lysine 27 (H3K27) using S-adenosyl-L-methionine. Its catalytic subunit is
  EZH2 or its paralogue EZH1, which is active only in the core complex with EED and
  SUZ12; the histone-binding WD40 proteins RBBP4 and RBBP7 complete the core. EED binds
  pre-existing H3K27me3 and allosterically activates the complex, so that the mark
  propagates. Accessory subunits define two mutually exclusive forms: PRC2.1 carries one
  Polycomb-like protein (PHF1, MTF2 or PHF19), whose Tudor domains bind H3K36me3, and
  PRC2.2 carries JARID2 and AEBP2, which contact H2AK119-ubiquitylated nucleosomes and
  stimulate PRC2 on them. Polycomb repressive complex 1 (PRC1) monoubiquitylates histone
  H2A lysine 119 (H2AK119ub1). Its E3 ligase is a heterodimer of RING1B (RNF2) or RING1A
  (RING1) with one of six PCGF proteins. Canonical PRC1 pairs RING1A/B with PCGF2 or
  PCGF4 (BMI1) and carries a CBX chromodomain protein, which binds H3K27me3 and so
  recruits canonical PRC1 to PRC2-modified chromatin, and a PHC protein; it has low
  intrinsic ligase activity and compacts chromatin. Variant PRC1 complexes pair RING1A/B
  with PCGF1, PCGF3, PCGF5 or PCGF6 and with RYBP or YAF2, which excludes the CBX and
  PHC subunits and stimulates ligase activity; they deposit most H2AK119ub1 and are
  recruited independently of H3K27me3, for example to unmethylated CpG islands by
  KDM2B in PRC1.1. H2AK119ub1 in turn promotes PRC2.2 binding, so the two systems
  reinforce each other.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001338
    title: histone modification pathway
    statement: >-
      RGD curates 173 human genes to this pathway, among them the PRC2 genes EZH2, AEBP2,
      PHF1 and PHF19 and the PRC1 genes RING1, RNF2, BMI1, PCGF1, PCGF2, PCGF3, PCGF5,
      PCGF6, CBX2, CBX4, CBX6, CBX7, CBX8, PHC1, PHC2 and PHC3, together with KDM2B. This
      module realises the Polycomb part of the pathway (module 1 of the histone
      modification split plan in projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md).
  - source_id: file:projects/RGD_PATHWAY_ONTOLOGY/pathways/PW_0001338.yaml
    statement: RGD frames the pathway as writers and erasers of histone marks together with their readers.
    supporting_text: The modification pathways bring together the enzymes that catalyze the modification
  - source_id: GO:0140718
    title: facultative heterochromatin formation
    statement: >-
      PW:0001338 has no GO process mapping, and GO has obsoleted the histone H3K27
      methylation and H2AK119 monoubiquitination processes as molecular functions. The
      module's process is facultative heterochromatin formation, whose definition names
      H3K27 methylation as the metazoan mechanism and which is the process in the EZH2
      gene review's core function.
  - source_id: PMID:12351676
    statement: The human EED-EZH2 complex methylates nucleosomal histone H3 at lysine 27.
    supporting_text: We demonstrate that the complex specifically methylates nucleosomal histone H3 at lysine 27 (H3-K27).
  - source_id: PMID:15386022
    statement: A human PRC1-like complex containing RING1, RING2 and BMI1 is the histone H2A lysine 119 ubiquitin ligase.
    supporting_text: hPRC1L monoubiquitinates nucleosomal histone H2A at lysine 119.
  - source_id: PMID:22325352
    statement: Human PRC1 comprises six groups of complexes, each with a distinct PCGF subunit and RING1A/B.
    supporting_text: six major groups of PRC1 complexes, each containing a distinct PCGF subunit, a RING1A/B ubiquitin ligase, and a unique set of associated polypeptides
notes: >-
  Derived from the RGD Pathway Ontology diagram PW:0001338 (histone modification pathway)
  through the RGD_PATHWAY_ONTOLOGY project, as module 1 of the histone modification split
  plan (projects/RGD_PATHWAY_ONTOLOGY/broad_pathway_split_plans.md; seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier no_specific_go_term, flagged
  broad, 173 RGD-curated human genes). PW:0001338 is the only PW evidence source: its
  children (chromatin remodeling, DNA modification) do not cover Polycomb, and the diagram
  draws no Polycomb node (its labels are COMPASS complexes, deubiquitinases and gene
  expression). UniProt accessions and names are from the repository's UniProt files (EZH2,
  AEBP2, BCOR) or UniProt REST (November 2026); molecular functions are from each
  protein's experimental human GOA rows in QuickGO (November 2026) unless stated in a
  unit's role or annoton role_description. The structure follows
  modules/dmel_polycomb_group_complexes.yaml (structure only; no Drosophila evidence is
  used except where a cited human-protein paper also reports fly experiments).

  Process term. GO obsoleted histone H3K27 methylation, H3K27 trimethylation and H2AK119
  monoubiquitination as biological processes because they represent molecular functions,
  so no process term names either reaction. The reactions are carried as the annoton
  functions (histone H3K27 trimethyltransferase activity; histone H2AK119 ubiquitin ligase
  activity) and the module process is facultative heterochromatin formation, whose GO
  definition names H3K27 methylation as the metazoan mechanism and which is the EZH2 gene
  review's core process; negative regulation of transcription by RNA polymerase II is the
  second process on the catalytic annotons. No new process term is requested, because
  GO's deliberate policy is to represent histone modifications as functions.

  Membership. RGD genes used (21): EZH2, AEBP2, PHF1, PHF19, RING1, RNF2, BMI1, PCGF1,
  PCGF2, PCGF3, PCGF5, PCGF6, CBX2, CBX4, CBX6, CBX7, CBX8, PHC1, PHC2, PHC3 and KDM2B
  (KDM2B as the PRC1.1 targeting subunit).
  Genes added with explicit evidence although not on the RGD list: the PRC2 core subunits
  EED, SUZ12, RBBP4, RBBP7 (UniProt and PMID:15225548, PMID:15385962, PMID:29628311) and
  the alternative catalytic subunit EZH1 (PMID:19026781); the PRC2 accessory subunits MTF2
  and JARID2 (PMID:29628311, PMID:20075857, PMID:29348366); the variant PRC1 subunits RYBP
  and YAF2 (PMID:22325352, PMID:22325148); and BCOR (PMID:16943429 and its gene review). Each
  has experimental human GOA complex membership (ESC/E(Z) complex, PcG protein complex or
  PRC1 complex; BCOR has BCOR complex by IDA) except YAF2 and MTF2, whose membership rests on the cited papers.
  RGD genes in the pathway that are not modelled here: CBX5 (HP1 alpha, an H3K9me3 reader
  of constitutive heterochromatin, not a Polycomb protein) and L3MBTL1 (an MBT reader not
  in a PRC complex); the erasers below; and the other writer, reader and eraser families
  assigned to sibling modules.

  Modelling decisions. (1) Catalytic annotons are the complexes, with the catalytic
  subunit as a unit carrying its own experimental function: EZH2 and EZH1 (histone H3K27
  trimethyltransferase activity, IDA) in PRC2; RNF2 (ubiquitin protein ligase activity,
  IDA/IMP) and RING1 (same term, IBA only) in PRC1. The EZH proteins are inactive outside
  PRC2 and RING1A/B needs a PCGF partner, so the complex carries the histone-specific
  function. The complex-level PRC1 function, histone H2AK119 ubiquitin ligase activity, is
  curator-authored from PMID:15386022 (human GOA has it on RNF2 only by ISS/IEA); it is the
  only function in the module not taken from an experimental human GOA row or a gene
  review core function, apart from the RING1 IBA row. (2) Paralogous alternatives (EZH1 or
  EZH2, RBBP4 or RBBP7, RING1A or RING1B, the PCGF, CBX and PHC families, RYBP or YAF2)
  are listed as units with roles stating the alternative, as in mediator_complex, rather
  than as variant sets, because mixed occupancy is possible and the combinations present
  in cells are not all established. (3) The PRC2.1/PRC2.2 split is a variant set with
  EXACTLY_ONE selection because the two accessory modules compete for the same SUZ12
  surface and define mutually exclusive subtypes (PMID:29628311, PMID:29348366). EPOP and
  PALI1/PALI2 (PRC2.1 accessory proteins; PALI1 is encoded by the LCOR locus) are not
  modelled: neither is on the RGD list and neither has experimental human molecular
  function rows; they would be added as further PRC2.1 units. (4) Canonical and variant
  PRC1 are separate parts rather than a variant set, because both coexist in the same
  cell, have different recruitment logic and different connections (canonical PRC1 reads
  PRC2's product; variant PRC1 provides PRC2.2's input). The six PCGF-defined groups
  (PRC1.1 to PRC1.6, PMID:22325352) are recorded in unit roles; PCGF2 and PCGF4 can also
  form RYBP-containing variant complexes, which is not modelled separately. (5) Reader
  subunits are kept only inside the complex that recruits them: CBX8 (H3K27me3 reader,
  IDA) in canonical PRC1, PHF1 and PHF19 (H3K36me3 reader, IDA) in PRC2.1, KDM2B
  (unmethylated CpG binding, IDA) in PRC1.1. EED's H3K27me3-binding allosteric activation
  (PMID:19767730) is recorded in prose because human GOA records EED only as an enzyme
  activator. CBX2, CBX4, CBX6 and CBX7 have no experimental H3K27me3 reader row and are
  given none, although they share the chromodomain (PMID:21047797). (6) Connections: PRC2
  PROVIDES_INPUT_FOR canonical PRC1 (H3K27me3 read by the CBX chromodomain; PMID:12351676,
  PMID:22325148) and variant PRC1 PROVIDES_INPUT_FOR PRC2 (H2AK119ub1 bound by JARID2 and
  AEBP2 in PRC2.2; PMID:33479123). The first edge applies to canonical PRC1 only, since most
  PRC1 does not colocalise with H3K27me3 (PMID:22325352). (7) Substrates are not parts:
  histones H3 and H2A and nucleosomes are inputs; the H3K27 lysine and SAM/SAH are grounded
  as the PRC2 reaction participants from RHEA:60292 as listed for EZH2 in UniProt. No Rhea
  reaction is grounded for the H2A ubiquitylation, which is a protein-transfer reaction
  without small-molecule participants other than ubiquitin. (8) Ubiquitin-conjugating
  enzymes (UBE2D family) used by PRC1 are not parts, as E2 enzymes are shared with many
  E3s. (9) Accessory subunits of PRC1.3/1.5 (AUTS2, casein kinase 2 subunits, FBRS) and
  PRC1.6 (E2F6, MGA, MAX, L3MBTL2, WDR5) are not modelled: none is on the RGD list, AUTS2-
  PRC1 activates rather than represses transcription (AUTS2 gene review), and the PRC1.6
  DNA-binding subunits are targeting context; SCMH1/SCML2 (SCM homologues) are likewise
  omitted. (10) DNA-binding recruiters (YY1, REST, BCL6 and others) and long noncoding RNAs
  that recruit PRC2 are targeting context, not parts.

  Erasers. The H3K27me2/3 demethylases KDM6A and KDM6B (on the RGD list) belong to the
  sibling module histone_lysine_demethylation, as does the H3K36 demethylase activity of
  KDM2B. The H2AK119ub1 deubiquitinase PR-DUB (BAP1 with ASXL1/2/3; BAP1 is on the RGD
  list) and USP16 (also listed) are not modelled in this module or any sibling of this
  tranche: they are erasers of the PRC1 mark with their own complex and catalytic
  mechanism, and they remain out of scope here and are recorded as a candidate for a
  separate histone H2A deubiquitination module.

  GO-CAM links. In gocams/index.tsv only EZH2 and CBX4 among the members appear. EZH2's
  activities in three human models are pinned to the PRC2 catalytic annoton: two
  linker-histone models (gomodel:6870555700002306, CRAMP1-dependent expression of histone
  H1 genes; gomodel:6870555700002365, H1.2 binds H3K27me3), where EZH2 has histone H3K27
  trimethyltransferase activity; and gomodel:65bc474400000069 (regulation of GSK3B
  phosphorylation by ZDHHC4-mediated palmitoylation), where EZH2 has the parent term
  histone methyltransferase activity in positive regulation of cell migration. CBX4 appears
  only in gomodel:682fbcd000004101 with SUMO ligase activity stabilising PRDM16, a
  non-Polycomb activity, and is not linked. No model contains another PRC1 or PRC2 subunit.
  The seed's best_gocam (69c59f8a00000219, PCAF-SAGA) has no Polycomb member and is not
  linked. PANTHER family ids and PTNs are deliberately not asserted.

  Observations for upstream review. (a) RING1 has ubiquitin protein ligase activity only by
  IBA and no experimental molecular function in human GOA, although it is a subunit of the
  purified hPRC1L E3 complex (PMID:15386022). (b) Histone H2AK119 ubiquitin ligase activity
  is absent from RNF2's experimental rows although PMID:15386022, cited for its ubiquitin
  protein ligase IDA row, shows nucleosomal H2A lysine 119 specificity; the more specific
  term would fit that row. (c) In gomodel:65bc474400000069 EZH2 is typed with the general
  histone methyltransferase activity in a cell-migration process; the H3K27-specific term
  would match its other models (not checked against the full text).
module:
  id: polycomb_repressive_complexes
  label: Human Polycomb repressive complexes PRC1 and PRC2
  module_type: PROTEIN_COMPLEX
  description: >-
    PRC2 deposits H3K27me3 and PRC1 deposits H2AK119ub1; canonical PRC1 reads H3K27me3
    and PRC2.2 reads H2AK119ub1, coupling the two writers in facultative heterochromatin.
  concepts:
    - preferred_term: PcG protein complex
      term:
        id: GO:0031519
        label: PcG protein complex
    - preferred_term: facultative heterochromatin formation
      term:
        id: GO:0140718
        label: facultative heterochromatin formation
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: chromatin
        term:
          id: GO:0000785
          label: chromatin
  parts:
    - order: 1
      role: histone H3K27 methyltransferase (PRC2)
      node:
        id: prc2
        label: Polycomb repressive complex 2 (PRC2)
        module_type: PROTEIN_COMPLEX
        description: >-
          The PRC2 core (EZH1 or EZH2, EED, SUZ12, RBBP4/RBBP7) catalyses H3K27
          methylation; one of two mutually exclusive accessory modules (PRC2.1 or PRC2.2)
          tunes targeting and activity.
        concepts:
          - preferred_term: ESC/E(Z) complex (PRC2)
            term:
              id: GO:0035098
              label: ESC/E(Z) complex
        annotons:
          - id: prc2_core_methyltransferase
            label: PRC2 core trimethylates histone H3 lysine 27
            participant:
              selector_type: PROTEIN_COMPLEX
              protein_complex:
                preferred_term: PRC2 core (EZH1/EZH2-EED-SUZ12-RBBP4/RBBP7)
                term:
                  id: GO:0035098
                  label: ESC/E(Z) complex
                active_units:
                  - id: unit_ezh2
                    label: EZH2
                    role: catalytic SET-domain subunit; one PRC2 contains either EZH2 or EZH1; EZH2-PRC2 deposits most H3K27me2/3 in proliferating cells
                    participant:
