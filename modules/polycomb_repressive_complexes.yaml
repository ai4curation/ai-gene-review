                    L-lysyl27-[histone H3] + 3 S-adenosyl-L-methionine =
                    N6,N6,N6-trimethyl-L-lysyl27-[histone H3] + 3 S-adenosyl-L-homocysteine +
                    3 H+ (EC 2.1.1.356), the reaction that GO:0140951 cross-references; the
                    ChEBI participants are those listed for EZH2 in UniProt.
                - source_id: file:genes/human/EZH2/EZH2-uniprot.txt
                  statement: UniProt records the EZH2 reaction with Rhea and ChEBI cross-references and experimental evidence.
                  supporting_text: homocysteine + 3 H(+); Xref=Rhea:RHEA:60292
            processes:
              - preferred_term: facultative heterochromatin formation
                term:
                  id: GO:0140718
                  label: facultative heterochromatin formation
              - preferred_term: negative regulation of transcription by RNA polymerase II
                term:
                  id: GO:0000122
                  label: negative regulation of transcription by RNA polymerase II
            locations:
              - preferred_term: chromatin
                term:
                  id: GO:0000785
                  label: chromatin
            role_description: >-
              The methyltransferase activity belongs to the complex, with EZH2 or EZH1 as
              the catalytic unit. Both carry histone H3K27 trimethyltransferase activity by
              IDA in human GOA (EZH2: PMID:22323599, PMID:26581166 and others; EZH1:
              PMID:19026781), always assayed as PRC2 because the isolated SET-domain
              protein is inactive. EED and SUZ12 carry enzyme activator activity by IDA
              (PMID:15385962, PMID:28229514), the term that names their role: the
              activity needs EZH2, EED and SUZ12 together (PMID:15225548), and EED binding
              to H3K27me3 allosterically activates the complex (PMID:19767730). EED has no
              experimental histone H3K27me3 reader row in human GOA, so the reader activity
              is recorded in this text and not as its function. RBBP4 and RBBP7 carry
              histone binding by IDA from PMID:9651585, an assay of the RBBP proteins in a
              deacetylase context (the same evidence is used in nurd_complex); they are
              given that function here because it is their only experimental activity
              and the RBBP-histone contact is shared by every complex they join.
            evidence:
              - source_id: PMID:15225548
                statement: PRC2 methyltransferase activity needs EZH2, EED and SUZ12, with AEBP2 for optimal activity.
                supporting_text: We found that the HMTase activity requires a minimum of three components-EZH2, EED, and SUZ12-while AEBP2 is required for optimal enzymatic activity.
              - source_id: PMID:15385962
                statement: SUZ12 is essential for the activity and stability of PRC2 and for H3K27me2/3 in mouse embryos.
                supporting_text: SUZ12 is essential for the activity and stability of the PRC2/3 complexes in mouse embryos, in tissue culture cells and in vitro
              - source_id: PMID:19026781
                statement: EZH1 and EZH2 form similar PRC2 complexes; PRC2-EZH1 methylates weakly but compacts chromatin.
                supporting_text: While PRC2-Ezh2 catalyzes H3K27me2/3 and its knockdown affects global H3K27me2/3 levels, PRC2-Ezh1 performs this function weakly.
              - source_id: PMID:19767730
                statement: EED binds trimethyl-lysine marks and this allosterically activates PRC2, propagating H3K27me3.
                supporting_text: the carboxy-terminal domain of EED specifically binds to histone tails carrying trimethyl-lysine residues associated with repressive chromatin marks, and that this leads to the allosteric activation of the methyltransferase activity of PRC2
              - source_id: PMID:29348366
                statement: SUZ12 contacts all other PRC2 subunits and stabilises the complex.
                supporting_text: SUZ12 interacts with all other subunits within the assembly and thus contributes to the stability of the complex.
              - source_id: PMID:29628311
                statement: The PRC2 core is SUZ12, EED, RBBP4/7 and EZH1/2, and PRC2.1 and PRC2.2 are its two forms.
                supporting_text: Whereas two distinct forms exist, PRC2.1 (containing one polycomb-like protein) and PRC2.2 (containing AEBP2 and JARID2)
            gocam_associations:
              - model: gomodel:6870555700002306
                activity: gomodel:6870555700002306/6870555700002355
                title: EZH2 histone H3K27 trimethyltransferase activity (GO:0140951), Transcription factor CRAMP1 specifically mediates expression of histone H1 genes, enabling Polycomb repression (Human)
              - model: gomodel:6870555700002365
                activity: gomodel:6870555700002365/6870555700002388
                title: EZH2 histone H3K27 trimethyltransferase activity (GO:0140951), Linker histone H1.2 recognizes and binds H3K27me3 (Human)
              - model: gomodel:65bc474400000069
                activity: gomodel:65bc474400000069/65bc474400000081
                title: EZH2 histone methyltransferase activity (GO:0042054), Regulation of GSK3B phosphorylation by ZDHHC4-mediated palmitoylation (Human)
        variant_sets:
          - id: prc2_accessory_module
            label: PRC2 accessory module (PRC2.1 or PRC2.2)
            axis: accessory subunit composition (Polycomb-like protein versus JARID2-AEBP2)
            variant_kind: REALIZER
            selection: EXACTLY_ONE
            notes: >-
              The two accessory modules bind the same SUZ12 surface and define mutually
              exclusive PRC2 subtypes. Each tunes recruitment and activity; neither is
              required for catalysis by the core.
            evidence:
              - source_id: PMID:29628311
                statement: PRC2.1 contains one Polycomb-like protein and PRC2.2 contains AEBP2 and JARID2.
                supporting_text: PRC2.1 (containing one polycomb-like protein) and PRC2.2 (containing AEBP2 and JARID2)
            variants:
              - id: prc2_1
                label: PRC2.1 (one Polycomb-like protein, PHF1, MTF2 or PHF19)
                module_type: PROTEIN_COMPLEX
                description: >-
                  PRC2.1 carries a single Polycomb-like (PCL) protein. The PCL Tudor domains
                  of PHF1 and PHF19 bind H3K36me3, stabilising PRC2 on chromatin and
                  allowing H3K27me3 to spread into H3K36-methylated regions.
                annotons:
                  - id: prc2_1_phf1
                    label: PHF1 reads H3K36me3 for PRC2.1
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: PHF1
                        term:
                          id: UniProtKB:O43189
                          label: PHD finger protein 1
                    function:
                      preferred_term: histone H3K36me3 reader activity
                      term:
                        id: GO:0140003
