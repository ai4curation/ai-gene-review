    - source: prc2
      target: canonical_prc1
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        H3K27me3 deposited by PRC2 is bound by the CBX chromodomain of canonical PRC1,
        recruiting it to PRC2-modified chromatin (the hierarchical recruitment model). Only
        a subset of PRC1 complexes colocalise with H3K27me3, and the human Pc-type CBX
        chromodomains bind the mark weakly, so this edge covers canonical PRC1 only.
      evidence:
