id: MODULE:dmel_muvb_complexes
title: MuvB-containing transcription complexes in Drosophila melanogaster
description: >-
  MuvB is a conserved core of five proteins (Mip130, Mip120, Mip40, Lin-52 and Caf1-55) that
  assembles with different partners to repress or activate cell-cycle and differentiation
  genes. With E2F2, Dp and the retinoblastoma-family proteins Rbf or Rbf2 it forms dREAM,
  which represses E2F target genes and developmentally regulated genes. With the Myb transcription
  factor it forms the Myb-MuvB complex (MMB), which activates G2/M genes and also controls
  site-specific chorion gene amplification. In spermatocytes a testis-specific relative, tMAC,
  which contains Aly, Comr, Tomb and Topi with Mip40 and Caf1-55, activates the meiotic and
  spermatid differentiation gene program.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0001984
  title: 'FlyBase gene group MUVB-C: Muvb complexes'
  statement: >-
    FlyBase release FB2026_03 groups 14 D. melanogaster genes as muvb complexes (MUVB-C);
    this module models that group.
- source_id: FB:FBgg0001987
  title: 'FlyBase gene group MUVB: Muvb core subunits'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as muvb core subunits (MUVB);
    this module models that group.
- source_id: GO:0070176
  title: DRM complex
  statement: >-
    GO term grounding the module as DRM complex.
notes: >-
  The MuvB core is modelled as its own part (FlyBase group MUVB) and also appears within each
  assembly variant, which list full FlyBase memberships. FlyBase places the dREAM Rbf group
  (DRM-R) membership to include both Rbf and Rbf2. tMAC is listed under MuvB complexes by
  FlyBase; it shares Mip40 and Caf1-55 with MuvB and contains testis-specific paralogs (Aly,
  Tomb) of other MuvB subunits. Mip40 has no UniProt mapping and is grounded to its FlyBase
  gene. tMAC has no GO cellular-component term. FlyBase groups realized by this module: MUVB-C
  (FBgg0001984), MUVB (FBgg0001987). Subgroups folded into it: DRM-R, DRM-R2, TMAC, MMC. Participants
  were generated from the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_muvb_complexes.yaml; none of the member genes has a gene review yet
  unless noted.
