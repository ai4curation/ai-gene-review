id: MODULE:mitochondrial_trna_charging_and_initiator_formylation
title: Mitochondrial aminoacyl-tRNA charging and initiator Met-tRNA formylation (human); AARS2/DARS2/TARS2 + MTFMT
description: Translation in mitochondria uses the 22 tRNAs encoded by mitochondrial DNA, which are charged with their amino
  acids in the mitochondrial matrix by a separate set of nuclear-encoded aminoacyl-tRNA synthetases (the "2" synthetases,
  for example AARS2, DARS2 and TARS2). Each synthetase activates its amino acid with ATP and transfers it to the cognate mitochondrial
  tRNA. A single mitochondrial tRNA(Met) serves both initiation and elongation; the fraction destined for initiation is formylated
  on its methionyl group by methionyl-tRNA formyltransferase (MTFMT), using 10-formyltetrahydrofolate, to give fMet-tRNA(Met),
  which is recognized by the mitochondrial initiation factor and used to start synthesis of the 13 mtDNA-encoded respiratory-chain
  subunits. Biallelic variants in the mitochondrial synthetases cause tissue-selective disorders (for example DARS2 leukoencephalopathy
  with brainstem and spinal cord involvement and lactate elevation, AARS2 infantile cardiomyopathy or adult leukoencephalopathy
  with ovarian failure, TARS2 combined oxidative phosphorylation deficiency), and MTFMT variants cause Leigh syndrome and
  combined oxidative phosphorylation deficiency 15.
status: DRAFT
evidence:
- source_id: GO:0070127
  title: tRNA aminoacylation for mitochondrial protein translation
  statement: The charging part is grounded in tRNA aminoacylation for mitochondrial protein translation; amino-acid-specific
    ligase activities stay on the leaf annotons.
- source_id: GO:0071951
  title: conversion of methionyl-tRNA to N-formyl-methionyl-tRNA
  statement: The formylation part is grounded in the conversion of Met-tRNA to fMet-tRNA.
- source_id: Reactome:R-HSA-380177
  title: alanine + tRNA(Ala) + ATP => Ala-tRNA(Ala) + AMP + pyrophosphate
  statement: AARS2 charges mitochondrial tRNA(Ala) (human Reactome reaction).
- source_id: Reactome:R-HSA-380229
  title: aspartate + tRNA(Asp) + ATP => Asp-tRNA(Asp) + AMP + pyrophosphate
  statement: DARS2 charges mitochondrial tRNA(Asp) (human Reactome reaction).
- source_id: file:human/AARS2/AARS2-ai-review.yaml
  title: AARS2 gene review (human)
  statement: AARS2 (UniProtKB:Q5JTZ9) core function GO:0004813 alanine-tRNA ligase activity, directly involved in mitochondrial
    alanyl-tRNA aminoacylation (GO:0070143).
- source_id: file:human/DARS2/DARS2-ai-review.yaml
  title: DARS2 gene review (human)
  statement: DARS2 (UniProtKB:Q6PI48) core function GO:0004815 aspartate-tRNA ligase activity in the mitochondrial matrix.
- source_id: file:human/TARS2/TARS2-ai-review.yaml
  title: TARS2 gene review (human)
  statement: TARS2 (UniProtKB:Q9BW92) core function GO:0004829 threonine-tRNA ligase activity, directly involved in GO:0070127,
    in the mitochondrial matrix.
- source_id: file:human/MTFMT/MTFMT-ai-review.yaml
  title: MTFMT gene review (human)
  statement: MTFMT (UniProtKB:Q96DP5) core function GO:0004479 methionyl-tRNA formyltransferase activity, directly involved
    in GO:0071951 and mitochondrial translational initiation (GO:0070124), in the mitochondrial matrix.
notes: 'Concrete human module built from the four completed human reviews (AARS2, DARS2, TARS2, MTFMT); GO terms are those
  of their core_functions and PANTHER subfamily ids and labels are from interpro/panther/panther.obo, matching each protein''s
  PANTHER human classification. The synthetases are listed as a variant set of one charging step because each charges a different
  tRNA; the set is deliberately incomplete. The other mitochondrial synthetases (for example MARS2, which charges the tRNA(Met)
  that MTFMT formylates, and the GatCAB-dependent Gln-tRNA route) have no gene reviews here and are named only in this note,
  so the charging-to-formylation connection is mediated by an unmodelled MARS2 step. Upstream mitochondrial tRNA maturation
  (RNase P TRMT10C-HSD17B10-PRORP, RNase Z ELAC2, CCA addition by TRNT1, and modifications) is a separate boundary: of its
  members only TRMT10C has a completed review, so it is not modelled. Downstream initiation (MTIF2/MTIF3) and the mitoribosome
  are also outside the boundary. AARS2 editing (Ser-tRNA(Ala) deacylase) activity is a fidelity function recorded in the AARS2
  review and not modelled here.'
