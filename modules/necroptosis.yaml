                  - id: zbp1_rhim_adaptor
                    label: ZBP1 RHIM adaptor engaging the RIPK core
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ZBP1 (DAI)
                        term:
                          id: UniProtKB:Q9H171
                          label: Z-DNA-binding protein 1
                    function:
                      preferred_term: signaling adaptor activity
                      term:
                        id: GO:0035591
                        label: signaling adaptor activity
                      targets:
                        - preferred_term: RIPK3 (mouse) / RIPK1 (human)
                    processes:
                      - preferred_term: necroptotic signaling pathway
                        term:
                          id: GO:0097527
