                        supporting_text: >-
                          we report the identification of two receptor-interacting
                          protein (RIP) homotypic interaction motifs (RHIMs) in the
                          DAI protein sequence, and show that these domains relay
                          DAI-induced NF-kappaB signals through the recruitment of the
                          RHIM-containing kinases RIP1 and RIP3
                      - source_id: PMID:42436309
                        title: >-
                          Human ZBP1 is a potent inducer of cell death through
                          mechanisms divergent from mouse ZBP1.
                        statement: >-
                          Human ZBP1-induced death depends on RIPK1 rather than
                          RIPK3, unlike mouse ZBP1.
                        supporting_text: >-
                          In contrast to mZBP1, which signals primarily through RIPK3,
                          hZBP1-induced cell death depends on RIPK1 in a
                          RIPK3-independent manner.
    - order: 2
      role: >-
        RHIM amyloid assembly of the necrosome/ripoptosome core, which activates RIPK3
      node:
        id: necrosome_rhim_assembly
        label: Necrosome (ripoptosome) RHIM assembly
        module_type: PROTEIN_COMPLEX
        description: >-
          The RHIM of RIPK3 polymerizes with the RHIM of the upstream initiator
          (RIPK1, TRIF or ZBP1) into hetero-amyloid filaments that form the core of the
          necrosome. This assembly is not merely an interaction: RHIM mutation
          abolishes cluster formation, RIPK3 kinase activation and necroptosis, so
          assembly is the step that switches the effector kinase on.
        concepts:
          - preferred_term: ripoptosome assembly involved in necroptotic process
            term:
              id: GO:1901026
              label: ripoptosome assembly involved in necroptotic process
          - preferred_term: ripoptosome (necrosome core)
            term:
              id: GO:0097342
              label: ripoptosome
            description: >-
              Used as the complex term for the RIPK1/RIPK3 RHIM core. GO carries
              "necrosome" as a related synonym of this term even though its definition
              centres on RIPK1/RIPK3 while the literature "ripoptosome" is the
              RIPK1/FADD/caspase-8/cFLIP platform; see notes and knowledge_gaps.
        annotons:
          - id: ripk3_rhim_scaffold
            label: RIPK3 RHIM hetero-amyloid scaffold
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: RIPK3
                term:
                  id: UniProtKB:Q9Y572
                  label: Receptor-interacting serine/threonine-protein kinase 3
            function:
              preferred_term: protein serine/threonine kinase binding
              term:
                id: GO:0120283
                label: protein serine/threonine kinase binding
              targets:
                - preferred_term: RIPK1 RHIM (and the RHIMs of ZBP1 and TRIF)
            processes:
              - preferred_term: ripoptosome assembly involved in necroptotic process
                term:
                  id: GO:1901026
                  label: ripoptosome assembly involved in necroptotic process
              - preferred_term: amyloid fibril formation
                term:
                  id: GO:1990000
                  label: amyloid fibril formation
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Non-catalytic, RHIM-mediated role of RIPK3, kept separate from its
              kinase activity because the two are distinct core functions in the gene
              review and because RHIM mutants retain kinase domains while failing to
              be activated. The reciprocal RIPK1 RHIM contribution is described at this
              node rather than asserted as a separate RIPK1 molecular function, since
              no GO molecular function for RHIM polymerization is available.
            evidence:
              - source_id: PMID:22817896
                title: >-
                  The RIP1/RIP3 necrosome forms a functional amyloid signaling complex
                  required for programmed necrosis.
                statement: >-
                  The RHIMs of RIPK1 and RIPK3 assemble heterodimeric filamentous
                  structures.
                supporting_text: >-
                  Here, we report that the RIP homotypic interaction motifs (RHIMs) of
                  RIP1 and RIP3 mediate the assembly of heterodimeric filamentous
                  structures.
              - source_id: PMID:29681455
                title: >-
                  The Structure of the Necrosome RIPK1-RIPK3 Core, a Human
                  Hetero-Amyloid Signaling Complex.
                statement: >-
                  Structural evidence that the RIPK1-RIPK3 core is a hetero-amyloid
                  signaling complex.
                supporting_text: >-
                  The RIPK1-RIPK3 necrosome is an amyloid signaling complex that
                  initiates TNF-induced necroptosis
              - source_id: PMID:19524512
                title: >-
                  Receptor interacting protein kinase-3 determines cellular necrotic
                  response to TNF-alpha.
                statement: >-
                  RIPK3 is recruited to RIPK1 to form the necrosis-inducing complex.
                supporting_text: >-
                  Upon induction of necrosis, RIP3 is recruited to RIPK1 to form a
                  necrosis-inducing complex
    - order: 3
      role: >-
        committing step - activated RIPK3 phosphorylates MLKL, licensing the executioner
      node:
        id: ripk3_mlkl_licensing
        label: RIPK3 phosphorylation of MLKL
        module_type: REGULATORY_STEP
        description: >-
          Within the assembled necrosome, RIPK3 phosphorylates MLKL on T357/S358 in
          the pseudokinase activation loop. This is the committing step of the pathway:
          it is required for MLKL oligomerization and membrane translocation, and
          activating mutations in the MLKL pseudoactive site cause RIPK3-independent
          necroptosis.
        concepts:
          - preferred_term: necroptotic signaling pathway
            term:
              id: GO:0097527
              label: necroptotic signaling pathway
        annotons:
          - id: ripk3_mlkl_kinase
            label: RIPK3 necroptotic effector kinase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: RIPK3
                term:
                  id: UniProtKB:Q9Y572
                  label: Receptor-interacting serine/threonine-protein kinase 3
            function:
              preferred_term: protein serine/threonine kinase activity
              term:
                id: GO:0004674
                label: protein serine/threonine kinase activity
              substrates:
                - preferred_term: MLKL (T357/S358)
              targets:
                - preferred_term: MLKL
            processes:
              - preferred_term: necroptotic signaling pathway
                term:
                  id: GO:0097527
                  label: necroptotic signaling pathway
              - preferred_term: necroptotic process
                term:
                  id: GO:0070266
                  label: necroptotic process
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              The one kinase step that is required by all three initiation variants;
              RIPK3 kinase-dead cells are necroptosis-resistant, and the substrate
              that matters for execution is MLKL rather than RIPK1.
            gocam_associations:
              - model: gomodel:62b4ffe300000504
                activity: gomodel:62b4ffe300000504/62b4ffe300000522
                title: >-
                  Poxvirus-OPG065 inhibition of ZBP1-mediated necroptosis
                  (Human-Poxvirus)
            evidence:
              - source_id: PMID:22265413
                title: >-
                  Mixed lineage kinase domain-like protein mediates necrosis signaling
                  downstream of RIP3 kinase.
                statement: >-
                  RIPK3 phosphorylates MLKL at T357/S358 and these events are critical
                  for necrosis.
                supporting_text: >-
                  MLKL was phosphorylated by RIP3 at the threonine 357 and serine 358
                  residues, and these phosphorylation events were critical for
                  necrosis.
              - source_id: PMID:19524512
                title: >-
                  Receptor interacting protein kinase-3 determines cellular necrotic
                  response to TNF-alpha.
                statement: RIPK3 catalytic activity is required for necrosis.
                supporting_text: >-
                  The kinase activity of RIP3 is essential for necrosis execution.
              - source_id: PMID:24012422
                title: >-
                  The pseudokinase MLKL mediates necroptosis via a molecular switch
                  mechanism.
                statement: >-
                  MLKL's non-enzymatic necroptotic role is switched on by
                  RIPK3-mediated phosphorylation.
                supporting_text: >-
                  its essential nonenzymatic role in necroptotic signaling is induced
                  by receptor-interacting serine-threonine kinase 3
                  (RIPK3)-mediated phosphorylation
    - order: 4
      role: execution phase - MLKL destabilizes the plasma membrane and the cell lyses
      node:
        id: necroptosis_execution
        label: Execution phase of necroptosis (MLKL)
        module_type: BIOLOGICAL_PROCESS
        description: >-
          Phosphorylation releases the MLKL four-helix bundle from the pseudokinase
          latch; binding of higher-order inositol phosphates is additionally required
          for oligomerization and membrane recruitment; the basic patch of the 4HB
          domain then binds phosphatidylinositol phosphates at the plasma membrane and
          disrupts bilayer integrity, producing ion influx and lytic death. The three
          annotons are the three reviewed MLKL core functions: activation, membrane
          targeting, and the lethal activity itself.
        concepts:
          - preferred_term: execution phase of necroptosis
            term:
              id: GO:0097528
              label: execution phase of necroptosis
        annotons:
          - id: mlkl_ip6_activation
            label: MLKL inositol-phosphate-dependent activation
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MLKL
                term:
                  id: UniProtKB:Q8NB16
                  label: Mixed lineage kinase domain-like protein
            function:
              preferred_term: inositol hexakisphosphate binding
              term:
                id: GO:0000822
                label: inositol hexakisphosphate binding
            processes:
              - preferred_term: execution phase of necroptosis
                term:
                  id: GO:0097528
                  label: execution phase of necroptosis
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Binding of IP6 and related higher-order inositol phosphates to the
              N-terminal region is required, in addition to RIPK3 phosphorylation, for
              MLKL oligomerization and membrane recruitment - a second input to the
              execution phase that is not supplied by the kinase.
            evidence:
              - source_id: PMID:29883610
                title: "MLKL Requires the Inositol Phosphate Code to Execute Necroptosis."
                statement: >-
                  Loss of higher-order inositol phosphates blocks necroptosis
                  downstream of MLKL phosphorylation.
                supporting_text: >-
                  genetic disruption of IP kinases to abolish production of higher
                  order inositol phosphates blocked necroptosis downstream of MLKL
                  phosphorylation by RIPK3 and prevented the oligomerization and
                  plasma membrane recruitment of MLKL
              - source_id: PMID:25288762
                title: >-
                  Activation of the pseudokinase MLKL unleashes the four-helix bundle
                  domain to induce membrane localization and necroptotic cell death.
                statement: >-
                  The pseudokinase domain restrains the four-helix bundle until
                  activation.
                supporting_text: >-
                  the MLKL pseudokinase domain acts as a latch to restrain the
                  N-terminal four-helix bundle (4HB) domain
          - id: mlkl_pip_membrane_targeting
            label: MLKL phosphatidylinositol-phosphate-dependent membrane targeting
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MLKL
                term:
                  id: UniProtKB:Q8NB16
                  label: Mixed lineage kinase domain-like protein
            function:
              preferred_term: phosphatidylinositol phosphate binding
              term:
                id: GO:1901981
                label: phosphatidylinositol phosphate binding
            processes:
              - preferred_term: execution phase of necroptosis
                term:
                  id: GO:0097528
                  label: execution phase of necroptosis
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              A basic patch on the four-helix bundle binds plasma-membrane
              phosphatidylinositol phosphates, recruiting the MLKL oligomer to the
              bilayer it then disrupts; membrane localization of the oligomer is
              required for death.
            evidence:
              - source_id: PMID:24813885
                title: >-
                  MLKL compromises plasma membrane integrity by binding to
                  phosphatidylinositol phosphates.
                statement: >-
                  A basic 4HB surface patch binds PIPs and recruits MLKL to the plasma
                  membrane.
                supporting_text: >-
                  a patch of positively charged amino acids on the surface of the 4HBD
                  binds to phosphatidylinositol phosphates (PIPs) and allows
                  recruitment of MLKL to the plasma membrane
              - source_id: PMID:24316671
                title: >-
                  Plasma membrane translocation of trimerized MLKL protein is required
                  for TNF-induced necroptosis.
                statement: >-
                  Plasma-membrane localization of oligomerized MLKL is required for
                  necroptosis.
                supporting_text: >-
                  the plasma membrane localization of trimerized MLKL is critical for
                  mediating necroptosis
          - id: mlkl_membrane_destabilization
            label: MLKL membrane destabilization (lethal step)
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: MLKL
                term:
                  id: UniProtKB:Q8NB16
                  label: Mixed lineage kinase domain-like protein
            function:
              preferred_term: membrane destabilizing activity
              term:
                id: GO:0140912
                label: membrane destabilizing activity
              description: >-
                The reviewed MLKL core activity. Pore-forming activity (GO:0140911) is
                deliberately not asserted: the reviewed evidence supports bilayer
                destabilization and leakage rather than a defined channel.
            processes:
              - preferred_term: execution phase of necroptosis
                term:
                  id: GO:0097528
                  label: execution phase of necroptosis
              - preferred_term: necroptotic process
                term:
                  id: GO:0070266
                  label: necroptotic process
            locations:
              - preferred_term: plasma membrane
                term:
                  id: GO:0005886
                  label: plasma membrane
            role_description: >-
              The terminal, lethal activity of the module: oligomerized,
              membrane-bound MLKL directly compromises bilayer integrity, causing ion
              influx and lysis. MLKL is the only module member whose loss blocks death
              downstream of every initiator.
            gocam_associations:
              - model: gomodel:62b4ffe300000504
                activity: gomodel:62b4ffe300000504/62b4ffe300000706
                title: >-
                  Poxvirus-OPG065 inhibition of ZBP1-mediated necroptosis
                  (Human-Poxvirus)
            evidence:
              - source_id: PMID:24703947
                title: >-
                  Mixed lineage kinase domain-like protein MLKL causes necrotic
                  membrane disruption upon phosphorylation by RIP3.
                statement: >-
                  Phosphorylated MLKL oligomerizes, moves to membranes, and directly
                  disrupts membrane integrity.
                supporting_text: >-
                  This property allows MLKL to move from the cytosol to the plasma and
                  intracellular membranes, where it directly disrupts membrane
                  integrity, resulting in necrotic death.
              - source_id: PMID:24813885
                title: >-
                  MLKL compromises plasma membrane integrity by binding to
                  phosphatidylinositol phosphates.
                statement: >-
                  Recombinant MLKL permeabilizes PIP-containing liposomes, and the
                  basic patch is required.
                supporting_text: >-
                  recombinant MLKL, but not a mutant lacking these positive charges,
                  induces leakage of PIP-containing liposomes as potently as BAX
              - source_id: PANTHER:PTN008689042
                statement: >-
                  IBD propagation of GO:0097527 at PAINT node PTN008689042 in
                  PTHR44329, seeded by UniProtKB:Q8NB16 and MGI:MGI:1921818.
    - order: 5
      optional: true
      role: >-
        caspase-8/FADD/cFLIP brake - proteolytic restraint whose failure permits the
        chain above
      node:
        id: casp8_fadd_cflip_brake
        label: Caspase-8/FADD/cFLIP brake on necroptosis
        module_type: REGULATORY_STEP
        description: >-
          In a cell with intact caspase-8 activity, FADD-recruited caspase-8
          (heterodimerized with cFLIP(L)) cleaves RIPK1 and other substrates and keeps
          the RHIM core from forming; necroptosis is what appears when this restraint
          is lost, which is why caspase-8 deficiency is embryonic-lethal in a
          RIPK3-dependent way. The same RIPK1/FADD/caspase-8/cFLIP platform is the
          apoptotic alternative and is modelled as such in
          modules/death_receptor_apoptotic_signaling.yaml and
          modules/apoptotic_execution_phase.yaml; it is included here only as
          regulation, not as a core necroptotic step.
        concepts:
          - preferred_term: negative regulation of necroptotic process
            term:
              id: GO:0060546
              label: negative regulation of necroptotic process
        annotons:
          - id: casp8_ripk1_cleavage
            label: Caspase-8 proteolytic restraint of necroptosis
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CASP8
                term:
                  id: UniProtKB:Q14790
                  label: Caspase-8
            function:
              preferred_term: cysteine-type endopeptidase activity
              term:
                id: GO:0004197
                label: cysteine-type endopeptidase activity
              substrates:
                - preferred_term: RIPK1
            processes:
              - preferred_term: negative regulation of necroptotic process
                term:
                  id: GO:0060546
                  label: negative regulation of necroptotic process
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Limited proteolysis of RIPK1 (and other signaling substrates) is the
              normal off-state of this module; loss of caspase-8 unmasks
              RIPK3-dependent death.
            evidence:
              - source_id: PMID:21368762
                title: "RIP3 mediates the embryonic lethality of caspase-8-deficient mice."
                statement: >-
                  Caspase-8 suppresses RIPK3-RIPK1 complex-dependent necroptosis.
                supporting_text: >-
                  Casp8 suppresses RIP3-RIP1 (also known as RIPK3-RIPK1) kinase
                  complex-dependent necroptosis that follows death receptor activation
              - source_id: PMID:21368762
                title: "RIP3 mediates the embryonic lethality of caspase-8-deficient mice."
                statement: >-
                  The lethality of caspase-8 loss is RIPK3-dependent, placing the brake
                  upstream of this module's core.
                supporting_text: >-
                  We find that RIP3 is responsible for the mid-gestational death of
                  Casp8-deficient embryos.
              - source_id: PMID:24019532
                title: "Toll-like receptor 3-mediated necrosis via TRIF, RIP3, and MLKL."
                statement: >-
                  The same caspase-8 restraint governs the TLR-initiated route.
                supporting_text: >-
                  rely on caspase 8 to suppress RIP3-dependent programmed necrosis
          - id: fadd_platform_adaptor
            label: FADD adaptor assembling the restraining platform
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FADD
                term:
                  id: UniProtKB:Q13158
                  label: FAS-associated death domain protein
            function:
              preferred_term: protein-macromolecule adaptor activity
              term:
                id: GO:0030674
                label: protein-macromolecule adaptor activity
            processes:
              - preferred_term: regulation of necroptotic process
                term:
                  id: GO:0060544
                  label: regulation of necroptotic process
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Brings caspase-8 (and cFLIP) into the RIPK1-containing cytosolic
              platform. The reviewed FADD annotations keep this necroptotic-regulatory
              context as non-core relative to FADD's death-receptor role, which is why
              it sits in the optional part here.
            evidence:
              - source_id: PMID:21737330
                title: >-
                  cIAPs block Ripoptosome formation, a RIP1/caspase-8 containing
                  intracellular cell death complex differentially regulated by cFLIP
                  isoforms.
                statement: >-
                  The RIPK1-containing platform contains FADD, caspase-8, caspase-10
                  and cFLIP isoforms.
                supporting_text: >-
                  It contains RIP1, FADD, caspase-8, caspase-10, and caspase inhibitor
                  cFLIP isoforms.
          - id: cflar_caspase8_rheostat
            label: cFLIP setting of the caspase-8 rheostat
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: CFLAR (c-FLIP)
                term:
                  id: UniProtKB:O15519
                  label: CASP8 and FADD-like apoptosis regulator
            function:
              preferred_term: cysteine-type endopeptidase activator activity
              term:
                id: GO:0140608
                label: cysteine-type endopeptidase activator activity
              targets:
                - preferred_term: CASP8
            processes:
              - preferred_term: regulation of necroptotic process
                term:
                  id: GO:0060544
                  label: regulation of necroptotic process
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              cFLIP(L)-caspase-8 heterodimers give the limited protease activity that
              cleaves RIPK1 without committing to apoptosis; which cFLIP isoform is
              present decides whether the platform yields apoptosis or
              RIPK3-dependent necroptosis.
            evidence:
              - source_id: PMID:21737330
                title: >-
                  cIAPs block Ripoptosome formation, a RIP1/caspase-8 containing
                  intracellular cell death complex differentially regulated by cFLIP
                  isoforms.
                statement: >-
                  Caspase activity set by cFLIP isoforms decides between
                  RIPK3-dependent necroptosis and caspase-dependent apoptosis.
                supporting_text: >-
                  caspase activity is the "rheostat" that is controlled by cFLIP
                  isoforms in the Ripoptosome and decides if cell death occurs by
                  RIP3-dependent necroptosis or caspase-dependent apoptosis
  connections:
    - source: necroptotic_signaling
      target: necrosome_rhim_assembly
      connection_type: CAUSES
      description: >-
        An activated RHIM-bearing initiator nucleates the RHIM amyloid core with
        RIPK3.
    - source: necrosome_rhim_assembly
      target: ripk3_mlkl_licensing
      connection_type: CAUSES
      description: >-
        RHIM assembly clusters and activates RIPK3; RHIM mutants retain the kinase
        domain but are not activated.
      evidence:
        - source_id: PMID:22817896
          title: >-
            The RIP1/RIP3 necrosome forms a functional amyloid signaling complex
            required for programmed necrosis.
          statement: >-
            RHIM mutation compromises cluster formation, kinase activation and
            necrosis.
          supporting_text: >-
            Mutations in the RHIMs of RIP1 and RIP3 that are defective in the
            interaction compromise cluster formation, kinase activation, and
            programmed necrosis in vivo.
    - source: ripk3_mlkl_licensing
      target: necroptosis_execution
      connection_type: CAUSES
      description: >-
        MLKL phosphorylation on T357/S358 licenses oligomerization, membrane
        recruitment and the lethal membrane-destabilizing step.
    - source: casp8_fadd_cflip_brake
      target: necroptotic_signaling
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Caspase-8 cleavage of RIPK1 terminates kinase-dependent initiation; this is the
        restraint whose loss permits the pathway.
    - source: casp8_fadd_cflip_brake
      target: necrosome_rhim_assembly
      connection_type: NEGATIVELY_REGULATES
      description: >-
        Intact caspase-8 activity prevents formation of the RIPK1-RIPK3 RHIM core,
        including on the TLR-initiated route.
