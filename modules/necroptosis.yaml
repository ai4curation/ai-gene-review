id: MODULE:necroptosis
title: Necroptosis (RHIM-dependent RIPK3-MLKL lytic cell death) module
description: >-
  A decomposition of the necroptotic process (GO:0070266): the caspase-8-restrained,
  RIPK3- and MLKL-dependent form of programmed necrosis. The module follows GO's own
  partition of the process into a signaling phase (GO:0097527 necroptotic signaling
  pathway), the assembly of the RIPK1/RIPK3 RHIM platform that licenses the effector
  kinase (GO:1901026 ripoptosome assembly involved in necroptotic process; complex
  GO:0097342 ripoptosome), and an execution phase (GO:0097528) carried out by MLKL at
  the plasma membrane.

  Design intent: the committing chemistry is a single linear hand-off - an upstream
  RHIM-bearing sensor or adaptor nucleates a RHIM amyloid core with RIPK3, activated
  RIPK3 phosphorylates MLKL, and phosphorylated MLKL destabilizes the membrane - so
  the module is one ordered chain of parts rather than the redundant-suppressor
  topology used for ferroptosis. The branch point that makes necroptosis a distinct
  program sits upstream: three alternative initiators converge on the same RIPK3 core
  and are modelled as a variant set along the axis of which receptor supplies the RHIM
  (RIPK1 downstream of TNFR1 and other death receptors; TICAM1/TRIF downstream of TLR3
  and endosomal TLR4; ZBP1 downstream of Z-form nucleic acid sensing). The
  caspase-8/FADD/cFLIP brake is modelled as an optional regulatory part that negatively
  regulates the chain, not as a core step: its proteolysis is what normally keeps the
  module off, and the same complex is the apoptotic alternative.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0070266
    title: necroptotic process
    statement: >-
      GO defines the necroptotic process as a programmed necrotic cell death
      characterized by activation of RIPK1 and/or RIPK3 and critical dependence on
      MLKL, divided into a signaling phase and an execution phase triggered by the
      former. That division is the top-level decomposition used here.
  - source_id: GO:0097342
    title: ripoptosome
    statement: >-
      GO's ripoptosome term is defined as a complex whose core components are RIPK1
      and RIPK3 and whose formation can induce either extrinsic apoptotic or
      necroptotic signaling; it carries "necrosome" as a related synonym. This module
      uses it as the complex term for the RHIM platform (see notes on the
      ripoptosome/necrosome naming).
  - source_id: PMID:22265413
    title: >-
      Mixed lineage kinase domain-like protein mediates necrosis signaling downstream
      of RIP3 kinase.
    statement: >-
      Identified MLKL as the RIPK3 substrate and necroptotic effector, fixing the
      RIPK3 -> MLKL hand-off that separates the signaling phase from the execution
      phase in this module.
    supporting_text: >-
      MLKL was phosphorylated by RIP3 at the threonine 357 and serine 358 residues,
      and these phosphorylation events were critical for necrosis.
  - source_id: PMID:22817896
    title: >-
      The RIP1/RIP3 necrosome forms a functional amyloid signaling complex required
      for programmed necrosis.
    statement: >-
      Established that the RHIMs of RIPK1 and RIPK3 assemble a filamentous
      (amyloid-like) complex and that RHIM mutation abolishes kinase activation and
      necrosis, which is the basis for modelling RHIM assembly as its own part.
    supporting_text: >-
      Mutations in the RHIMs of RIP1 and RIP3 that are defective in the interaction
      compromise cluster formation, kinase activation, and programmed necrosis in vivo.
  - source_id: PMID:24019532
    title: "Toll-like receptor 3-mediated necrosis via TRIF, RIP3, and MLKL."
    statement: >-
      Showed that TLR3/TLR4 engage RIPK3 directly through a RHIM-dependent
      TRIF-RIPK3 association, independent of RIPK1, while remaining MLKL-dependent -
      the evidence for treating the upstream initiator as a variant set over one
      shared RIPK3-MLKL core.
    supporting_text: >-
      TLR3 or TLR4 directly activates programmed necrosis through a RIP homotypic
      interaction motif-dependent association of TRIF with RIP3 kinase (also called
      RIPK3).
  - source_id: PANTHER:PTN000585372
    title: PAINT node PTN000585372 for RIPK1
    statement: >-
      Local PAINT IBD row in PTHR44329 propagating P:GO:0097527 necroptotic signaling
      pathway, seeded by MGI:MGI:108212 and UniProtKB:Q13546; cited as provenance that
      the RIPK1 necroptotic-signaling role is a PAINT-placed inherited function, not a
      human-only observation.
  - source_id: PANTHER:PTN008689042
    title: PAINT node PTN008689042 for MLKL
    statement: >-
      Local PAINT IBD row in PTHR44329 propagating P:GO:0097527 necroptotic signaling
      pathway, seeded by MGI:MGI:1921818 and UniProtKB:Q8NB16; cited as provenance for
      the MLKL role being an inherited rather than lineage-specific function.
  - source_id: gomodel:62b4ffe300000504
    title: Poxvirus-OPG065 inhibition of ZBP1-mediated necroptosis (Human-Poxvirus)
    statement: >-
      Cached production GO-CAM grounding the ZBP1 -> RIPK3 (GO:0097527) -> MLKL
      (GO:0097528) chain in human cells, used as the GO-CAM anchor for the ZBP1
      initiation variant, the RIPK3 licensing step, and the MLKL execution node.
  - source_id: file:genes/human/MLKL/MLKL-ai-review.yaml
    title: Human MLKL AI gene review
    statement: >-
      The reviewed MLKL core functions - membrane destabilizing activity (GO:0140912),
      phosphatidylinositol phosphate binding (GO:1901981) as membrane targeting, and
      inositol hexakisphosphate binding (GO:0000822) as activation, all in the
      execution phase - are the source of the three execution-phase annotons here.
      That review deliberately rejects a pore-forming activity term for MLKL; this
      module follows it.
  - source_id: file:genes/human/RIPK3/RIPK3-ai-review.yaml
    title: Human RIPK3 AI gene review
    statement: >-
      The reviewed RIPK3 core functions separate the kinase activity that
      phosphorylates MLKL (GO:0004674) from the RHIM scaffold activity (GO:0120283,
      with amyloid fibril formation GO:1990000); this module keeps that separation as
      two parts.
  - source_id: file:genes/human/RIPK1/RIPK1-ai-review.yaml
    title: Human RIPK1 AI gene review
    statement: >-
      The reviewed RIPK1 core functions distinguish a kinase-dependent
      pro-necroptotic role (GO:0004674 in GO:0097527/GO:0070266/GO:1901026) from a
      kinase-independent scaffold role that restrains necroptosis; only the former is
      a core part of this module.
notes: >-
  Boundary decisions.

  (1) Scope is the necroptotic process itself (GO:0070266) and its three GO parts.
  Receptor-proximal biology that merely feeds it is out of scope and is reached by
  reference, not duplicated: TNFR1 ligation, complex I assembly, cIAP/LUBAC
  ubiquitination and the NF-kappaB survival output belong to
  modules/tnf_signaling.yaml; LPS recognition and the TRAM-TRIF endosomal branch
  belong to modules/tlr4_md2_lps_signaling.yaml; FAS/FADD/DISC apoptotic initiation
  belongs to modules/death_receptor_apoptotic_signaling.yaml; effector-caspase
  execution belongs to modules/apoptotic_execution_phase.yaml. The upstream initiator
  variants therefore model only the RHIM-bearing adaptor that nucleates RIPK3, and
  the receptor that activates it is named in prose rather than given an annoton.

  (2) RIPK1 appears only in its kinase-dependent, necrosome-nucleating role. Its
  kinase-independent scaffold role is an inhibitor of this module (reviewed core
  function in GO:0060546), and the TRIF and ZBP1 routes can reach RIPK3 without it,
  which is why RIPK1 is one variant rather than an obligate part.

  (3) MLKL is placed in the execution phase and RIPK1/RIPK3 in the signaling phase,
  following the per-gene reviews. MLKL's core activity is taken as GO:0140912
  membrane destabilizing activity; the reviews reject GO:0140911 pore-forming
  activity for MLKL, and this module does not assert it.

  (4) Caspase-8/FADD/cFLIP are the brake, not the core. They are an optional
  regulatory part with NEGATIVELY_REGULATES edges, because necroptosis is the output
  that appears when this proteolytic restraint fails; the same platform is also the
  apoptotic alternative, modelled in the death-receptor and apoptotic-execution
  modules.

  (5) Ripoptosome/necrosome naming. The literature calls the RIPK1-RIPK3 RHIM core
  the "necrosome" and the RIPK1-FADD-caspase-8-cFLIP platform the "ripoptosome". GO
  has one term, GO:0097342 ripoptosome, whose definition centres on RIPK1/RIPK3 as
  core components while carrying "necrosome" as an exact-in-spirit (RELATED) synonym;
  GO:1901026 is correspondingly named "ripoptosome assembly involved in necroptotic
  process". This module uses those GO terms as they stand and does not invent a
  separate necrosome term; the naming mismatch is recorded as an ontology knowledge
  gap rather than resolved by curator fiat.

  (6) Parthanatos is excluded. PARP1/AIF-dependent parthanatotic death does not
  require RIPK3 or MLKL and is not a form of necroptosis, so it is outside this
  module even though GO:0070266 carries "parthanatos" and "PARP-dependent cell death"
  as RELATED synonyms. Those synonyms are legacy aggregation, not a scope statement,
  and nothing in this module should be read as covering parthanatos.

  (7) No module-level deep research exists for necroptosis: no provider run was
  available when this module was curated, so there is no
  necroptosis-deep-research-<provider>.md file. All structural claims are grounded in
  the per-gene reviews under genes/human/, cached publications, local PAINT rows and
  the cached GO-CAM named above.
knowledge_gaps:
  - gap_statement: >-
      GO has no distinct term for the RIPK1-RIPK3 RHIM amyloid core ("necrosome") as
      against the RIPK1-FADD-caspase-8-cFLIP death platform ("ripoptosome"), although
      the two assemblies have different compositions and opposite outputs.
    boundary: >-
      GO:0097342 ripoptosome is defined on RIPK1/RIPK3 core components and carries
      "necrosome" as a related synonym, while PMID:21737330 defines the ripoptosome as
      a RIP1/FADD/caspase-8/caspase-10/cFLIP complex. Both assemblies are therefore
      annotated to one term.
    gap_kind:
      - ONTOLOGY
      - BIOLOGY
    dark_aspect: CC_DARK
    status: OPEN
    significance: >-
      Annotating the necroptotic RHIM core and the caspase-8-activating platform to a
      single complex term makes the apoptosis/necroptosis decision invisible at the
      complex level, and leaves module members that belong to only one of the two
      sharing a cellular-component claim.
    resolution: >-
      Determine experimentally whether the RHIM-polymerized RIPK1-RIPK3 core and the
      DED-based RIPK1-FADD-caspase-8 platform are separable assemblies in the same
      cell, and on that basis request a child term (or sibling terms) under
      GO:0097342 rather than re-labelling the existing term.
    provenance:
      - reference_id: PMID:21737330
        reference_section_type: ABSTRACT
        supporting_text: >-
          It contains RIP1, FADD, caspase-8, caspase-10, and caspase inhibitor cFLIP
          isoforms.
      - reference_id: PMID:21737330
        reference_section_type: ABSTRACT
        supporting_text: >-
          caspase activity is the "rheostat" that is controlled by cFLIP isoforms in
          the Ripoptosome and decides if cell death occurs by RIP3-dependent
          necroptosis or caspase-dependent apoptosis
  - gap_statement: >-
      Whether TICAM1/TRIF carries a necroptotic process role in human cells at
      endogenous expression, as against the mouse fibroblast system in which the
      direct TRIF-RIPK3 route was defined.
    boundary: >-
      PMID:24019532 establishes a RHIM-dependent TRIF-RIPK3 association driving
      MLKL-dependent necrosis independently of RIPK1, but the reviewed human TICAM1
      annotations carry no necroptotic process term and the gene review raises this as
      an open question; GOA has no row for it.
    gap_kind:
      - BIOLOGY
    dark_aspect: BP_DARK
    status: OPEN
    significance: >-
      The TRIF variant is one of the three initiators this module asserts; if the
      human route is not RIPK1-independent, the variant set collapses toward RIPK1 as
      an obligate part.
    resolution: >-
      In TICAM1-knockout human macrophages or epithelial cells, reconstitute wild-type
      and RHIM-mutant TICAM1, stimulate TLR3/TLR4 under caspase inhibition, and score
      MLKL phosphorylation and lytic death with and without RIPK1 kinase inhibition.
    provenance:
      - reference_id: file:genes/human/TICAM1/TICAM1-ai-review.yaml
        reference_section_type: OTHER
        supporting_text: >-
          human evidence beyond overexpression was not found in the cached literature
      - reference_id: file:genes/human/TICAM1/TICAM1-ai-review.yaml
        reference_section_type: OTHER
        supporting_text: no GOA row captures this
  - gap_statement: >-
      Human and mouse ZBP1 route cell-death signalling through different RIP kinases,
      and what the human ZBP1-RIPK1 RHIM assemblies do is not established.
    boundary: >-
      PMID:42436309 reports that human ZBP1-induced death depends on RIPK1 and can
      proceed without RIPK3, whereas mouse ZBP1 signals primarily through RIPK3, and
      states that the biological significance of the hZBP1-RIPK1 cytoplasmic
      assemblies remains unclear; the reviewed ZBP1 core adaptor function is asserted
      without resolving which arrangement is conserved.
    gap_kind:
      - BIOLOGY
    status: OPEN
    significance: >-
      The ZBP1 variant is modelled here as feeding the same RHIM core; if the human
      route bypasses RIPK3, part of the module's shared core is species-specific.
    resolution: >-
      Compare human and mouse ZBP1 RHIM requirements side by side in matched
      RIPK1/RIPK3-null backgrounds, and test whether the hZBP1-RIPK1 assemblies are
      required for MLKL phosphorylation and lysis.
    provenance:
      - reference_id: PMID:42436309
        reference_section_type: ABSTRACT
        supporting_text: >-
          In contrast to mZBP1, which signals primarily through RIPK3, hZBP1-induced
          cell death depends on RIPK1 in a RIPK3-independent manner.
      - reference_id: PMID:42436309
        reference_section_type: RESULTS
        supporting_text: >-
          Although the biological significance of the solid-like cytoplasmic
          assemblies remains unclear
module:
  id: necroptosis
  label: Necroptosis
  module_type: BIOLOGICAL_PROCESS
  concepts:
    - preferred_term: necroptotic process
      term:
        id: GO:0070266
        label: necroptotic process
      description: >-
        RIPK3- and MLKL-dependent programmed necrosis, normally restrained by
        caspase-8, comprising a signaling phase and an execution phase.
  context:
    taxa:
      - preferred_term: Mammalia
        term:
          id: NCBITaxon:40674
          label: Mammalia
        description: >-
          Mammalian implementation, represented with human gene products. RIPK3 and
          MLKL are vertebrate innovations and are absent or divergent in several
          lineages (including birds for MLKL regulation and some mammals for RIPK3),
          so this module is deliberately not asserted for metazoa as a whole.
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          The signaling phase and RHIM assembly occur on cytosolic platforms; the
          execution phase acts at the plasma membrane (asserted on the
          execution-phase annotons rather than here).
  parts:
    - order: 1
      role: >-
        necroptotic signaling - a RHIM-bearing sensor or adaptor is activated and
        engages RIPK3
      node:
        id: necroptotic_signaling
        label: Necroptotic signaling (upstream RHIM-dependent initiation)
        module_type: SIGNALING_PATHWAY
        description: >-
          The signaling phase of necroptosis. An upstream RHIM-containing protein is
          activated by its own receptor system and presents its RHIM to RIPK3. The
          three known routes - RIPK1 downstream of ligated death receptors,
          TICAM1/TRIF downstream of TLR3 and endosomal TLR4, and ZBP1 downstream of
          Z-form nucleic acid - differ in sensor and in whether RIPK1 is required, but
          converge on the same RIPK3 core. Receptor ligation itself is modelled in the
          TNF, TLR4 and death-receptor modules and is not duplicated here.
        concepts:
          - preferred_term: necroptotic signaling pathway
            term:
              id: GO:0097527
              label: necroptotic signaling pathway
        variant_sets:
          - id: upstream_rhim_initiator
            label: Upstream RHIM-bearing initiator
            axis: >-
              which receptor system supplies the RHIM that nucleates RIPK3 (death
              receptor via RIPK1; TLR3/TLR4 via TRIF; Z-nucleic acid sensing via ZBP1)
            selection: ONE_OR_MORE
            evidence:
              - source_id: PMID:24019532
                title: "Toll-like receptor 3-mediated necrosis via TRIF, RIP3, and MLKL."
                statement: >-
                  Demonstrates that RIPK3-dependent programmed necrosis is induced by
                  RIP1-RIP3, DAI(ZBP1)-RIP3 and TRIF-RIP3 complexes alike, which is
                  the basis for treating the initiator as an alternative rather than a
                  fixed step.
                supporting_text: >-
                  Here, we describe two small molecule RIP3 kinase inhibitors and
                  employ them to demonstrate the common requirement for RIP3 kinase in
                  programmed necrosis induced by RIP1-RIP3, DAI-RIP3, and TRIF-RIP3
                  complexes.
            variants:
              - id: ripk1_death_receptor_initiation
                label: RIPK1-dependent initiation downstream of death receptors
                module_type: REGULATORY_STEP
                description: >-
                  When caspase-8 activity is absent or blocked, RIPK1 released from
                  ligated TNFR1 (or other death-receptor complexes) dimerizes through
                  its death domain, autophosphorylates, and engages RIPK3 through
                  RHIM-RHIM interaction. TNFR1 ligation, complex I ubiquitination and
                  the NF-kappaB output are upstream and belong to
                  modules/tnf_signaling.yaml.
                annotons:
                  - id: ripk1_necroptotic_kinase
                    label: RIPK1 kinase-dependent necrosome nucleation
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RIPK1
                        term:
                          id: UniProtKB:Q13546
                          label: Receptor-interacting serine/threonine-protein kinase 1
                    function:
                      preferred_term: protein serine/threonine kinase activity
                      term:
                        id: GO:0004674
                        label: protein serine/threonine kinase activity
                      targets:
                        - preferred_term: RIPK1 (autophosphorylation) and RIPK3
                    processes:
                      - preferred_term: necroptotic signaling pathway
                        term:
                          id: GO:0097527
                          label: necroptotic signaling pathway
                      - preferred_term: necroptotic process
                        term:
                          id: GO:0070266
                          label: necroptotic process
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Kinase-dependent activator of the pathway: death-domain
                      dimerization activates RIPK1, which engages RIPK3 via RHIM and
                      undergoes reciprocal phosphorylation with it. RIPK1 does not
                      phosphorylate MLKL; its output is an activated RIPK3. The same
                      protein restrains necroptosis in its kinase-independent scaffold
                      role, which is outside this part.
                    evidence:
                      - source_id: PMID:29440439
                        title: >-
                          Death-domain dimerization-mediated activation of RIPK1
                          controls necroptosis and RIPK1-dependent apoptosis.
                        statement: >-
                          Death-domain-mediated dimerization is required for RIPK1
                          kinase activation in necroptosis.
                        supporting_text: >-
                          Our study demonstrates the role of RIPK1-DD in mediating
                          RIPK1 dimerization and activation of its kinase activity
                          during necroptosis and RIPK1-dependent apoptosis
                      - source_id: PMID:19524513
                        title: >-
                          Phosphorylation-driven assembly of the RIP1-RIP3 complex
                          regulates programmed necrosis and virus-induced
                          inflammation.
                        statement: >-
                          Reciprocal RIP1/RIP3 phosphorylation stabilizes the
                          pronecrotic complex.
                        supporting_text: >-
                          The phosphorylation of RIP1 and RIP3 stabilizes their
                          association within the pronecrotic complex
                      - source_id: PANTHER:PTN000585372
                        statement: >-
                          IBD propagation of GO:0097527 at PAINT node PTN000585372 in
                          PTHR44329, seeded by UniProtKB:Q13546 and MGI:MGI:108212.
              - id: trif_tlr_initiation
                label: TRIF-dependent initiation downstream of TLR3 and endosomal TLR4
                module_type: REGULATORY_STEP
                description: >-
                  TLR3 and endosomal TLR4 can drive necroptosis without RIPK1 by a
                  direct RHIM-dependent association between TICAM1/TRIF and RIPK3. LPS
                  recognition and TRIF recruitment to the receptor are modelled in
                  modules/tlr4_md2_lps_signaling.yaml.
                annotons:
                  - id: ticam1_rhim_adaptor
                    label: TICAM1/TRIF RHIM adaptor engaging RIPK3
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: TICAM1 (TRIF)
                        term:
                          id: UniProtKB:Q8IUC6
                          label: TIR domain-containing adapter molecule 1
                    function:
                      preferred_term: signaling adaptor activity
                      term:
                        id: GO:0035591
                        label: signaling adaptor activity
                      targets:
                        - preferred_term: RIPK3
                    processes:
                      - preferred_term: necroptotic signaling pathway
                        term:
                          id: GO:0097527
                          label: necroptotic signaling pathway
                      - preferred_term: toll-like receptor 3 signaling pathway
                        term:
                          id: GO:0034138
                          label: toll-like receptor 3 signaling pathway
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                    role_description: >-
                      Non-catalytic adaptor whose C-terminal RHIM binds RIPK3
                      directly, allowing TLR3/TLR4 to initiate necroptosis
                      independently of RIPK1 while remaining MLKL-dependent. The
                      reviewed human TICAM1 annotations carry no necroptotic process
                      term, so this role is asserted from the primary literature and
                      recorded as an open question in knowledge_gaps.
                    evidence:
                      - source_id: PMID:24019532
                        title: "Toll-like receptor 3-mediated necrosis via TRIF, RIP3, and MLKL."
                        statement: >-
                          TRIF associates with RIPK3 through a RHIM-dependent
                          interaction to activate programmed necrosis.
                        supporting_text: >-
                          TLR3 or TLR4 directly activates programmed necrosis through
                          a RIP homotypic interaction motif-dependent association of
                          TRIF with RIP3 kinase (also called RIPK3).
                      - source_id: PMID:24019532
                        title: "Toll-like receptor 3-mediated necrosis via TRIF, RIP3, and MLKL."
                        statement: >-
                          The TRIF route proceeds without RIPK1 but still requires
                          MLKL downstream of RIPK3, which is why it is a variant of
                          initiation rather than a separate module.
                        supporting_text: >-
                          it remains dependent on mixed lineage kinase domain-like
                          protein (MLKL) downstream of RIP3 kinase
              - id: zbp1_z_nucleic_acid_initiation
                label: ZBP1-dependent initiation downstream of Z-form nucleic acid sensing
                module_type: REGULATORY_STEP
                description: >-
                  ZBP1 senses Z-form RNA (and Z-DNA) through its Zalpha domains and
                  presents its RHIMs to RIPK3 (mouse) or RIPK1 (human), initiating
                  necroptosis during influenza A and herpesvirus infection. Nuclear
                  initiation is documented for influenza A, where MLKL is activated in
                  the nucleus.
                annotons:
                  - id: zbp1_z_rna_sensing
                    label: ZBP1 Z-nucleic acid sensing
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: ZBP1 (DAI)
                        term:
                          id: UniProtKB:Q9H171
                          label: Z-DNA-binding protein 1
                    function:
                      preferred_term: pattern recognition receptor activity
                      term:
                        id: GO:0038187
                        label: pattern recognition receptor activity
                    processes:
                      - preferred_term: antiviral innate immune response
                        term:
                          id: GO:0140374
                          label: antiviral innate immune response
                    locations:
                      - preferred_term: cytosol
                        term:
                          id: GO:0005829
                          label: cytosol
                      - preferred_term: nucleus
                        term:
                          id: GO:0005634
                          label: nucleus
                    role_description: >-
                      Sensing step that licenses the adaptor role below; the reviewed
