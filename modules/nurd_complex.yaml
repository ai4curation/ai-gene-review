id: MODULE:nurd_complex
title: Human NuRD nucleosome remodeling and deacetylase complex — MTA-HDAC-RBBP deacetylase core with an MBD-GATAD2 bridge to a CHD remodeling ATPase and CDK2AP1; HDAC1/2, MTA1-3, RBBP4/7, MBD2/3, GATAD2A/B, CHD3/4/5, CDK2AP1
description: >-
  The nucleosome remodeling and deacetylase (NuRD) complex couples ATP-dependent
  nucleosome remodeling by a CHD-family (Mi-2) ATPase with class I histone
  deacetylation in one assembly of about 1 to 2 MDa. Each of its seven subunit
  types is encoded by two or three paralogues in vertebrates, and the paralogues
  define mutually exclusive, functionally distinct complexes. The core is a
  deacetylase subcomplex in which MTA1, MTA2 or MTA3 scaffolds the histone
  deacetylases HDAC1 and HDAC2 and the histone-binding WD40 proteins RBBP4 and
  RBBP7; the HDAC-RBBP pair alone is a core shared with Sin3 complexes and is
  catalytically weak until MTA engages it. A methyl-CpG-binding domain protein
  (MBD2 or MBD3) binds this core, and a GATAD2 protein (GATAD2A or GATAD2B,
  p66alpha or p66beta) bridges the MBD to the C-terminal region of the CHD
  remodeler (CHD3, CHD4 or, in brain, CHD5), which carries the peripheral
  subunit CDK2AP1. MBD2-NuRD is targeted to methylated CpG DNA, while
  MBD3-NuRD does not bind methylated DNA directly. NuRD is best known as a
  transcriptional corepressor recruited by many DNA-binding transcription
  factors, but CHD3- and CHD4-NuRD can also support activation of target genes,
  and NuRD accumulates at sites of DNA damage. Transcription-factor targeting,
  DNA repair and the other HDAC1/2- and RBBP4/7-containing complexes (Sin3,
  CoREST, PRC2, NURF) are context for this module, not parts of it.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: PW:0001339
    title: chromatin remodeling pathway
    statement: >-
      RGD's chromatin remodeling pathway names the CHD family as one of four
      SNF2-family remodeler groups and draws a NuRD complex node that positively
      affects gene expression; the pathway mixes unrelated remodeler families,
      so the project models one human module per complex group and this module
      models the NuRD group. Derived through projects/RGD_PATHWAY_ONTOLOGY
      (pathways/PW_0001339.yaml).
  - source_id: GO:0006338
    title: chromatin remodeling
    statement: >-
      skos:closeMatch for PW:0001339 in the project seed (PW definition xref and
      lexical match). It is carried here as the process of the CHD remodeling
      ATPase annotons; the module itself is typed by the complex term NuRD
      complex.
  - source_id: GO:0016581
    title: NuRD complex
    statement: >-
      GO term grounding the module as the NuRD complex. Every modelled subunit
      except CHD5 has an experimental (IDA or IPI) NuRD complex row in human
      GOA; CHD5 membership rests on PMID:21931736.
  - source_id: PMID:9885572
    title: NURD, a novel complex with both ATP-dependent chromatin-remodeling and histone deacetylase activities.
    statement: >-
      Discovery of human NuRD as one complex carrying both nucleosome
      disruption and histone deacetylase activity, with MTA1 as a subunit.
    supporting_text: We report a novel human complex, named NURD, which contains not only ATP-dependent nucleosome disruption activity, but also histone deacetylase activity
  - source_id: PMID:33283408
    title: Cross-linking mass spectrometry reveals the structural topology of peripheral NuRD subunits relative to the core complex.
    statement: >-
      Cross-linking IP-mass spectrometry of human NuRD defines its topology:
      an MTA-RBBP-HDAC core, onto which an MBD and a GATAD2 assemble, which in
      turn enables binding of the peripheral CHD and CDK2AP proteins. This is
      the architecture used for the parts.
    supporting_text: Our results confirm that the core of the complex is formed by MTA, RBBP, and HDAC proteins. Assembly of a copy of MBD and GATAD2 onto this core enables binding of the peripheral CHD and CDK2AP proteins.
  - source_id: PMID:33283408
    title: Cross-linking mass spectrometry reveals the structural topology of peripheral NuRD subunits relative to the core complex.
    statement: >-
      Vertebrate NuRD subunit types are paralogue families whose members define
      mutually exclusive complexes; this is why each paralogue group is a
      variant set rather than a list of co-required subunits.
    supporting_text: These paralogs define mutually exclusive and functionally distinct complexes.
notes: >-
  Derived from the RGD Pathway Ontology term PW:0001339 (chromatin remodeling
  pathway) through the RGD_PATHWAY_ONTOLOGY project (seed in
  projects/RGD_PATHWAY_ONTOLOGY/data/module_seeds.yaml, tier
  related_module_only; mapped GO process chromatin remodeling,
  skos:closeMatch). RGD curates 74 human genes to PW:0001339 and its page has
  no gene-linked diagram; the definition divides the SNF2-family remodelers
  into four families (SWI/SNF, INO80/SWR1, ISWI, CHD) and the diagram draws
  separate complex nodes (BAF, PBAF, ACF, CHRAC, NURF, WICH, INO80, SRCAP,
  TRRAP/Tip60, NuRD). Because these are unrelated complexes, the project
  models one human module per complex group; this module is the NuRD (CHD
  family) group. Its 14 RGD genes are CHD3 CHD4 CHD5 HDAC1 HDAC2 MTA1 MTA2
  MTA3 MBD2 MBD3 GATAD2A GATAD2B RBBP4 RBBP7, all modelled. The remaining RGD
  genes belong to the SWI/SNF (BAF/PBAF), ISWI, INO80 (ino80_complex), SRCAP
  and TIP60/p400 groups, modelled or to be modelled in sibling modules.

  Structure. The parts follow the topology from cross-linking IP-mass
  spectrometry of human NuRD (PMID:33283408) and the earlier subunit
  analysis (PMID:10444591): (1) an MTA-HDAC-RBBP deacetylase core, and (2)
  a remodeling module in which an MBD binds the core, a GATAD2 binds the MBD
  (CR1) and the CHD C terminus (CR2), and the CHD ATPase carries CDK2AP1.
  Each vertebrate subunit type is a paralogue family whose members define
  mutually exclusive complexes, so each family is a variant set. HDAC1/2,
  MTA1-3 and RBBP4/7 use selection ONE_OR_MORE because the core contains
  two copies of each (an MTA dimer with two HDACs and several RBBPs) and
  mixed paralogue occupancy cannot be excluded; MBD2/3, GATAD2A/B and
  CHD3/4/5 use EXACTLY_ONE because a single copy is present per complex and
  CHD3- versus CHD4-NuRD (PMID:28977666) and MBD2- versus MBD3-NuRD are
  distinct complexes. Some structural studies place the MBD with the
  deacetylase core (a "NuDe" subcomplex); here it is placed in the remodeling
  module as the bridge, following PMID:33283408, and this choice does not
  change any annoton.

  Boundary decisions. (1) HDAC1, HDAC2, RBBP4 and RBBP7 are shared with the
  Sin3, CoREST, PRC2 and NURF complexes; only their NuRD role is modelled.
  The RBBP histone binding evidence (PMID:9651585) comes from the Sin3
  complex, whose HDAC-RBBP core is the one NuRD shares (PMID:10444591). (2)
  CDK2AP1 is added although RGD does not list it: it has two IDA NuRD complex
  rows in human GOA (PMID:20523938, PMID:33283408), copurifies with every
  NuRD subunit and cross-links to the CHD C terminus. (3) CDK2AP2 is not
  added: PMID:33283408 reports it as a NuRD subunit, but that rests on one
  study whose peptides are largely shared with CDK2AP1; it would be a
  paralogue variant of part 2.4 if confirmed. (4) Substoichiometric NuRD
  interactors (ZMYND8, ZNF687 and ZNF592, the Z3 module) and the PWWP2A/B
  and other chromatin readers are not parts. (5) DNA-binding transcription
  factors that recruit NuRD (for example ZNF410, BCL11A, SALL4, FOG1/ZFPM1,
  IKZF1) are targeting context, not parts. (6) NuRD recruitment to DNA
  damage sites and its replication-coupled roles are context. (7) CHD5
  membership rests on a mouse-brain purification (PMID:21931736) because
  human CHD5 has no experimental NuRD complex row. (8) Molecular functions
  are the subunits' experimental GO rows (QuickGO, November 2026) except: CHD5
  remodeler activity is IBA-supported; MTA1-3, MBD3, GATAD2B and CDK2AP1 are
  given no function because no experimental row describes their scaffold
  role (generic protein binding is not used). No complex-level function is
  asserted for the deacetylase core; HDAC1/2 carry the catalytic activity.
  Gene reviews exist for CHD3, CHD4 and GATAD2B; the CHD3 and CHD4 core
  functions (ATP-dependent chromatin remodeler activity, in NuRD complex)
  match the annotons.

  GO-CAM. In gocams/index.tsv only CHD4 and HDAC1 among the subunits appear.
  CHD4 is in gomodel:6197061700001485 (silencing of fetal hemoglobin by
  ZNF410), where its activity is typed as transcription corepressor
  activity downstream of ZNF410; that activity is pinned to the CHD4 annoton
  because it is the NuRD ATPase acting at a ZNF410 target, even though the
  model's MF term describes the complex output rather than the remodeler
  activity. HDAC1's only model (CDKN1A induction via PCAF-SAGA) contains no
  other NuRD subunit and is not linked. The seed's best GO-CAM lead
  (617b481400000460, KAT5 in homologous recombination) overlaps the RGD list
  only through TIP60-complex genes and is unrelated to NuRD.

  Observations for upstream review. (a) MBD3 carries methyl-CpG binding (IDA,
  PMID:24307175) in human GOA, but PMID:10444591 reports that MBD3 does not
  bind methylated DNA directly; the row may reflect 5-hydroxymethylcytosine
  or weak binding and was not used. (b) GATAD2A has protein-macromolecule
  adaptor activity (IDA) but GATAD2B has no experimental adaptor row although
  the cited paper (PMID:12183469) shows direct MBD binding by both p66
  paralogues. PANTHER family ids and PTNs are deliberately not asserted.
module:
  id: nurd_complex
  label: Human NuRD complex
  module_type: PROTEIN_COMPLEX
  description: >-
    MTA-HDAC-RBBP deacetylase core joined through an MBD-GATAD2 bridge to a
    CHD-family remodeling ATPase that carries CDK2AP1.
  concepts:
    - preferred_term: NuRD complex
      term:
        id: GO:0016581
        label: NuRD complex
  context:
    taxa:
      - preferred_term: Homo sapiens
        term:
          id: NCBITaxon:9606
          label: Homo sapiens
    cellular_components:
      - preferred_term: chromatin
        term:
          id: GO:0000785
          label: chromatin
  parts:
    - order: 1
      role: histone deacetylase core (MTA-HDAC-RBBP)
      node:
        id: nurd_deacetylase_core
        label: MTA-HDAC-RBBP deacetylase core
        module_type: PROTEIN_COMPLEX
        description: >-
          An MTA dimer scaffolds HDAC1/HDAC2 and RBBP4/RBBP7. HDAC1/2 with
          RBBP4/7 alone is a deacetylase core shared with Sin3 complexes, and its
          activity is low until an MTA protein engages it. Only the NuRD
          configuration is modelled here; the same HDAC and RBBP proteins in
          Sin3, CoREST, PRC2 or NURF are outside this module.
        evidence:
          - source_id: PMID:10444591
            statement: >-
              HDAC1/2 with RbAp48/46 (RBBP4/7) is a core shared with Sin3
              complexes; MTA2 modulates its activity, and MBD3 mediates the
              association of MTA2 with the core.
            supporting_text: The histone deacetylases HDAC1 and HDAC2 and the histone binding proteins RbAp48 and RbAp46 form a core complex shared between NuRD and Sin3-histone deacetylase complexes.
          - source_id: PMID:10444591
            statement: MTA2 modulates the deacetylase activity of the core.
            supporting_text: MTA2 modulates the enzymatic activity of the histone deacetylase core complex.
        variant_sets:
          - id: nurd_hdac_paralog
            label: class I histone deacetylase (HDAC1 or HDAC2)
            axis: paralogue (HDAC1 versus HDAC2)
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            notes: >-
              HDAC1 and HDAC2 both copurify with NuRD and can occupy the core as
              homo- or heterodimers; either supplies the catalytic deacetylase.
            variants:
              - id: nurd_hdac1_variant
                label: HDAC1
                module_type: MOLECULAR_FUNCTION
                annotons:
                  - id: nurd_hdac1
                    label: HDAC1 histone deacetylase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: HDAC1
                        term:
                          id: UniProtKB:Q13547
                          label: Histone deacetylase 1
                    function:
                      preferred_term: histone deacetylase activity
                      term:
                        id: GO:0004407
                        label: histone deacetylase activity
                    role_description: >-
                      Catalytic deacetylase of NuRD. HDAC1 carries histone
                      deacetylase activity by EXP from the NuRD discovery paper
                      (PMID:9885572) and by several IDA rows; its child
                      histone deacetylase activity, hydrolytic mechanism and its
                      decrotonylase activities are not NuRD-specific findings.
              - id: nurd_hdac2_variant
                label: HDAC2
                module_type: MOLECULAR_FUNCTION
                annotons:
                  - id: nurd_hdac2
                    label: HDAC2 histone deacetylase
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: HDAC2
                        term:
                          id: UniProtKB:Q92769
                          label: Histone deacetylase 2
                    function:
                      preferred_term: histone deacetylase activity
                      term:
                        id: GO:0004407
                        label: histone deacetylase activity
                    role_description: >-
                      Catalytic deacetylase of NuRD, paralogous to HDAC1; histone
                      deacetylase activity by EXP (PMID:9885572) and IDA.
          - id: nurd_mta_paralog
            label: MTA scaffold (MTA1, MTA2 or MTA3)
            axis: paralogue (MTA1 versus MTA2 versus MTA3)
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            notes: >-
              MTA proteins dimerise and each binds an HDAC and an RBBP; they are
              non-catalytic scaffolds that activate the HDAC and anchor the MBD.
              MTA1, MTA2 and MTA3 define distinct NuRD complexes. No MTA paralogue
              has an experimental molecular function that describes its scaffold
              role, so no function is asserted.
            variants:
              - id: nurd_mta1_variant
                label: MTA1
                module_type: PROTEIN_COMPLEX
                annotons:
                  - id: nurd_mta1
                    label: MTA1 deacetylase-core scaffold
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MTA1
                        term:
                          id: UniProtKB:Q13330
                          label: Metastasis-associated protein MTA1
                    role_description: >-
                      Scaffold subunit identified in the founding human NuRD
                      purification; its experimental GOA rows (transcription
                      coactivator and corepressor activity, IMP) describe reporter
                      outcomes rather than the scaffold activity.
                    evidence:
                      - source_id: PMID:9885572
                        statement: MTA1 is a subunit of human NuRD.
                        supporting_text: One subunit of NURD was identified as MTA1
              - id: nurd_mta2_variant
                label: MTA2
                module_type: PROTEIN_COMPLEX
                annotons:
                  - id: nurd_mta2
                    label: MTA2 deacetylase-core scaffold
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MTA2
                        term:
                          id: UniProtKB:O94776
                          label: Metastasis-associated protein MTA2
                    role_description: >-
                      Scaffold subunit that modulates the deacetylase activity of
                      the HDAC-RBBP core (PMID:10444591).
              - id: nurd_mta3_variant
                label: MTA3
                module_type: PROTEIN_COMPLEX
                annotons:
                  - id: nurd_mta3
                    label: MTA3 deacetylase-core scaffold
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: MTA3
                        term:
                          id: UniProtKB:Q9BTC8
                          label: Metastasis-associated protein MTA3
                    role_description: >-
                      Scaffold subunit of a distinct MTA3-NuRD; found in the
                      brain CHD5 complex (PMID:21931736).
          - id: nurd_rbbp_paralog
            label: histone-binding WD40 subunit (RBBP4 or RBBP7)
            axis: paralogue (RBBP4 versus RBBP7)
            variant_kind: REALIZER
            selection: ONE_OR_MORE
            notes: >-
              RBBP4 and RBBP7 (RbAp48 and RbAp46) bind histone H3 and H4 tails and
              the MTA scaffold; NuRD can contain both.
            variants:
              - id: nurd_rbbp4_variant
                label: RBBP4
                module_type: MOLECULAR_FUNCTION
                annotons:
                  - id: nurd_rbbp4
                    label: RBBP4 histone binding
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RBBP4
                        term:
                          id: UniProtKB:Q09028
                          label: Histone-binding protein RBBP4
                    function:
                      preferred_term: histone binding
                      term:
                        id: GO:0042393
                        label: histone binding
                    role_description: >-
                      Histone-binding subunit of the deacetylase core; histone
                      binding is IDA (PMID:9651585, a study of the Sin3 complex
                      whose HDAC-RBBP core NuRD shares).
              - id: nurd_rbbp7_variant
                label: RBBP7
                module_type: MOLECULAR_FUNCTION
                annotons:
                  - id: nurd_rbbp7
                    label: RBBP7 histone binding
                    participant:
                      selector_type: GENE_PRODUCT
                      gene_product:
                        preferred_term: RBBP7
                        term:
                          id: UniProtKB:Q16576
                          label: Histone-binding protein RBBP7
                    function:
                      preferred_term: histone binding
                      term:
                        id: GO:0042393
                        label: histone binding
                    role_description: >-
                      Histone-binding subunit of the deacetylase core, paralogous
                      to RBBP4; histone binding is IDA (PMID:9651585).
    - order: 2
      role: remodeling module (MBD-GATAD2 bridge, CHD ATPase and CDK2AP1)
      node:
        id: nurd_remodeling_module
        label: MBD-GATAD2-CHD remodeling module
        module_type: PROTEIN_COMPLEX
        description: >-
          A copy of MBD2 or MBD3 binds the MTA-HDAC-RBBP core; GATAD2A or
          GATAD2B binds the MBD through its conserved region 1 (CR1) and the CHD
          C terminus through its conserved region 2 (CR2); the CHD ATPase carries
          CDK2AP1 on its C terminus. GATAD2 is needed for CHD4 to join the core.
        evidence:
          - source_id: PMID:33283408
            statement: GATAD2 bridges the NuRD core and the CHD proteins through two conserved regions.
            supporting_text: Our data reveal that the conserved region 2 (CR2) of GATAD2A is sufficient to bind CHD4 and CDK2AP1, whereas conserved region 1 (CR1) of GATAD2A is required for the interaction with the core NuRD complex.
          - source_id: PMID:33283408
            statement: CDK2AP1 association requires the CHD C terminus.
            supporting_text: The C terminus of CHD proteins is required for the association with GATAD2 proteins and CDK2AP1.
        parts:
          - order: 1
            role: methyl-CpG-binding domain bridge (MBD2 or MBD3)
            node:
              id: nurd_mbd
              label: MBD2 or MBD3
              module_type: PROTEIN_COMPLEX
              description: >-
                The MBD subunit links the deacetylase core to GATAD2. MBD2 binds
                methylated CpG and targets MBD2-NuRD to methylated DNA; MBD3 does
                not bind methylated DNA directly. MBD2- and MBD3-NuRD are distinct
                complexes.
              variant_sets:
                - id: nurd_mbd_paralog
                  label: MBD paralogue
                  axis: paralogue (MBD2 versus MBD3)
                  variant_kind: REALIZER
                  selection: EXACTLY_ONE
                  evidence:
                    - source_id: PMID:10444591
                      statement: MBD3 links MTA2 to the core and does not bind methylated DNA, whereas MBD2 directs NuRD to methylated DNA.
                      supporting_text: MBD3 does not directly bind methylated DNA but is highly related to MBD2, a polypeptide that binds to methylated DNA
                  variants:
                    - id: nurd_mbd2_variant
                      label: MBD2-NuRD
                      module_type: MOLECULAR_FUNCTION
                      annotons:
                        - id: nurd_mbd2
                          label: MBD2 methyl-CpG binding
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: MBD2
                              term:
                                id: UniProtKB:Q9UBB5
                                label: Methyl-CpG-binding domain protein 2
                          function:
                            preferred_term: methyl-CpG binding
                            term:
                              id: GO:0008327
                              label: methyl-CpG binding
                          role_description: >-
                            Reads methylated CpG and directs NuRD to methylated
                            DNA; methyl-CpG binding is IDA in human GOA.
                          evidence:
                            - source_id: PMID:10444591
                              statement: MBD2 targets NuRD to methylated DNA.
                              supporting_text: MBD2 interacts with the NuRD complex and directs the complex to methylated DNA.
                    - id: nurd_mbd3_variant
                      label: MBD3-NuRD
                      module_type: PROTEIN_COMPLEX
                      annotons:
                        - id: nurd_mbd3
                          label: MBD3 core-to-GATAD2 bridge
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: MBD3
                              term:
                                id: UniProtKB:O95983
                                label: Methyl-CpG-binding domain protein 3
                          role_description: >-
                            Structural bridge that mediates the association of
                            MTA2 with the deacetylase core and binds GATAD2. No
                            function is asserted: MBD3 does not bind methylated
                            DNA directly (PMID:10444591), so its methyl-CpG
                            binding IDA row is not used (see notes).
                          evidence:
                            - source_id: PMID:10444591
                              statement: MBD3 links MTA2 to the HDAC-RBBP core.
                              supporting_text: MBD3 mediates the association of MTA2 with the core histone deacetylase complex.
          - order: 2
            role: GATAD2 bridge between MBD and CHD
            node:
              id: nurd_gatad2
              label: GATAD2A or GATAD2B (p66alpha or p66beta)
              module_type: PROTEIN_COMPLEX
              variant_sets:
                - id: nurd_gatad2_paralog
                  label: GATAD2 paralogue
                  axis: paralogue (GATAD2A versus GATAD2B)
                  variant_kind: REALIZER
                  selection: EXACTLY_ONE
                  evidence:
                    - source_id: PMID:12183469
                      statement: Both p66 paralogues bind MBD2 and MBD3 directly and have overlapping functions.
                      supporting_text: We demonstrate direct binding of both p66 family members to MBD2 as well as MBD3.
                  variants:
                    - id: nurd_gatad2a_variant
                      label: GATAD2A (p66alpha)
                      module_type: MOLECULAR_FUNCTION
                      annotons:
                        - id: nurd_gatad2a
                          label: GATAD2A MBD-CHD adaptor
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: GATAD2A
                              term:
                                id: UniProtKB:Q86YP4
                                label: Transcriptional repressor p66-alpha
                          function:
                            preferred_term: protein-macromolecule adaptor activity
                            term:
                              id: GO:0030674
                              label: protein-macromolecule adaptor activity
                          role_description: >-
                            Adaptor that binds the MBD through CR1 and the CHD
                            C terminus and CDK2AP1 through CR2; adaptor activity
                            is IDA (PMID:12183469) in human GOA.
                    - id: nurd_gatad2b_variant
                      label: GATAD2B (p66beta)
                      module_type: PROTEIN_COMPLEX
                      annotons:
                        - id: nurd_gatad2b
                          label: GATAD2B MBD-CHD bridge
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: GATAD2B
                              term:
                                id: UniProtKB:Q8WXI9
                                label: Transcriptional repressor p66-beta
                          role_description: >-
                            Paralogous bridge with a single MBD-interaction domain.
                            No function is asserted: GATAD2B has no experimental
                            molecular function row other than a high-throughput
                            nucleosomal DNA binding contribution, and its gene
                            review's core function (transcription corepressor
                            activity) describes the whole-complex output.
          - order: 3
            role: CHD remodeling ATPase
            node:
              id: nurd_chd_atpase
              label: CHD3, CHD4 or CHD5 remodeling ATPase
              module_type: MOLECULAR_FUNCTION
              description: >-
                Each NuRD complex contains a single CHD ATPase. CHD3 and CHD4 are
                broadly co-expressed but form distinct complexes with different
                remodeling behaviour; CHD5 is brain-restricted and forms a
                NuRD-like complex with HDAC2, GATAD2B, MTA3 and RBBP7.
              variant_sets:
                - id: nurd_chd_paralog
                  label: CHD paralogue
                  axis: paralogue and tissue (CHD3 or CHD4 broadly, CHD5 in brain)
                  variant_kind: REALIZER
                  selection: EXACTLY_ONE
                  evidence:
                    - source_id: PMID:28977666
                      statement: NuRD complexes contain either CHD3 or CHD4, not both.
                      supporting_text: We mapped the CHD composition of NuRD complexes in mammalian cells and discovered that they are isoform-specific, containing either the monomeric CHD3 or CHD4 ATPase.
                  variants:
                    - id: nurd_chd4_variant
                      label: CHD4-NuRD
                      module_type: MOLECULAR_FUNCTION
                      annotons:
                        - id: nurd_chd4
                          label: CHD4 ATP-dependent chromatin remodeler
                          participant:
                            selector_type: GENE_PRODUCT
                            gene_product:
                              preferred_term: CHD4
                              term:
                                id: UniProtKB:Q14839
                                label: ATP-dependent chromatin remodeler CHD4
                          function:
                            preferred_term: ATP-dependent chromatin remodeler activity
                            term:
