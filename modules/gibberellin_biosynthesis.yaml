id: MODULE:gibberellin_biosynthesis
title: Bioactive gibberellin (GA4/GA1) biosynthesis from geranylgeranyl diphosphate
description: >-
  Biosynthesis of the bioactive gibberellins GA4 and GA1 in vascular plants from the plastid
  diterpene precursor (E,E,E)-geranylgeranyl diphosphate (GGPP), decomposed into three
  compartment-defined stages that use three enzyme classes. (1) In the plastid stroma two
  terpene cyclases make the tetracyclic hydrocarbon ent-kaurene: the class II cyclase
  ent-copalyl diphosphate synthase (CPS) converts GGPP to ent-copalyl diphosphate (the first
  committed step) and the class I cyclase ent-kaurene synthase (KS) converts ent-CPP to
  ent-kaurene with release of diphosphate. (2) Two multifunctional cytochrome P450
  monooxygenases at the plastid envelope and endoplasmic reticulum oxidize ent-kaurene to
  GA12: ent-kaurene oxidase (KO, CYP701A) performs three oxidations of C-19 to give
  ent-kaurenoic acid, and ent-kaurenoic acid oxidase (KAO, CYP88A) performs three further
  oxidations, including B-ring contraction, to give GA12, the first gibberellin. (3) Soluble
  2-oxoglutarate/Fe(II)-dependent dioxygenases in the cytosol complete the pathway: GA
  20-oxidase (GA20ox) oxidizes and removes C-20 of GA12 (via GA15 and GA24) to give the C19
  gibberellin GA9, and GA 3-oxidase (GA3ox) 3beta-hydroxylates GA9 to bioactive GA4. The
  same two dioxygenases act on the 13-hydroxylated series (GA53 to GA20 to GA1). The early
  stages are encoded by single or few genes, whereas GA20ox and GA3ox are multigene families
  whose transcription is the main point of control of bioactive GA levels (feedback
  repression through DELLA signaling, light and developmental regulation). GGPP supply,
  GA 13-hydroxylation, GA 2-oxidase and other deactivation routes, GA transport, and GA
  perception/DELLA signaling are outside this module's boundary.
status: DRAFT
scope: ABSTRACT
evidence:
  - source_id: PMID:22533671
    title: Gibberellin biosynthesis and its regulation.
    statement: GA biosynthesis uses terpene cyclases, P450 monooxygenases and 2-oxoglutarate-dependent
      dioxygenases in plastids, the endomembrane system and the cytosol, respectively.
    supporting_text: >-
      In higher plants, GAs are synthesized by the action of terpene cyclases, cytochrome P450
      mono-oxygenases and 2-oxoglutarate-dependent dioxygenases localized, respectively, in
      plastids, the endomembrane system and the cytosol.
  - source_id: PMID:11722763
    title: A plastid envelope location of Arabidopsis ent-kaurene oxidase links the plastid and
      endoplasmic reticulum steps of the gibberellin biosynthesis pathway.
    statement: CPS and KS are plastid-targeted, KO is on the outer plastid envelope and KAO1/KAO2
      are ER-targeted.
    supporting_text: >-
      These data suggest that the AtKO1 protein links the plastid- and endoplasmic
      reticulum-located steps of the gibberellin biosynthesis pathway by association with the
      outer envelope of the plastid.
  - source_id: PMID:18173378
    title: Gibberellin metabolism and its regulation.
    statement: Review establishing that most GA biosynthesis and deactivation genes are identified
      and that both are tightly regulated.
    supporting_text: >-
      Biochemical, genetic, and genomic approaches have led to the identification of the
      majority of the genes that encode GA biosynthesis and deactivation enzymes.
  - source_id: PMID:2236013
    title: Endogenous gibberellins in Arabidopsis thaliana and possible steps blocked in the
      biosynthetic pathways of the semidwarf ga4 and ga5 mutants.
    statement: GA9 must be 3beta-hydroxylated to GA4 to become bioactive in Arabidopsis.
    supporting_text: >-
      GA9 is not active in Arabidopsis, but it must be 3 beta-hydroxylated to GA4 to become
      bioactive.
notes: >-
  Arabidopsis thaliana members are used as representative members (all have completed gene
  reviews under genes/ARATH/: GA1, GA2, GA3, KAO1, KAO2, GA20OX1, GA3OX1); the module itself is
  phrased taxon-neutrally for vascular plants. Annoton molecular functions match the gene
  reviews' core_functions. PANTHER subfamily ids were checked against
  interpro/panther/panther.obo; no PANTHER id is asserted for KAO (KAO1 and KAO2 fall in
  different PTHR24286 subfamilies) or for GA20ox/GA3ox (UniProt maps them only to the broad
  2OG-Fe(II) oxygenase superfamily PTHR47990). Paralogs not reviewed here (GA20ox2-5,
  GA3ox2-4) contribute the same activities in a tissue- and stage-specific manner. GA
  2-oxidases (C19- and C20-GA 2-oxidases), which deactivate GA4/GA1 and their precursors, are
  context for homeostasis rather than parts of this biosynthetic module. No production GO-CAM
  in gocams/index.tsv contains these Arabidopsis gene products.
module:
  id: gibberellin_biosynthesis
  label: Gibberellin biosynthesis (GGPP to GA4/GA1)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: gibberellin biosynthetic process
      term:
        id: GO:0009686
        label: gibberellin biosynthetic process
      description: Formation of bioactive gibberellins from GGPP.
  context:
    taxa:
      - preferred_term: Tracheophyta
        term:
          id: NCBITaxon:58023
          label: Tracheophyta
        description: The CPS/KS/KO/KAO/GA20ox/GA3ox route to GA4 is characterized in seed plants
          and also present in lycophytes; bryophytes make ent-kaurene-derived metabolites but not
          the full pathway.
  parts:
    - order: 1
      role: plastid cyclization of GGPP to ent-kaurene
      node:
        id: plastid_stage
        label: Plastid stage - terpene cyclases (GGPP to ent-kaurene)
        module_type: METABOLIC_PATHWAY
        description: >-
          Two sequential cyclases in the plastid stroma. CPS performs a protonation-initiated
          (class II, DXDD general acid) bicyclization of GGPP to ent-CPP; KS performs an
          ionization-initiated (class I, Mg2+/DDXXD) cyclization of ent-CPP to ent-kaurene.
        parts:
          - order: 1
            role: committed bicyclization of GGPP
            node:
              id: cps_step
              label: ent-Copalyl diphosphate synthase (CPS/GA1)
              module_type: REACTION
              annotons:
                - id: cps_activity
                  label: "CPS: ent-copalyl diphosphate synthase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: plant ent-copalyl diphosphate synthase subfamily
                      term:
                        id: PANTHER:PTHR31739:SF4
                        label: ENT-COPALYL DIPHOSPHATE SYNTHASE, CHLOROPLASTIC
                      representative_members:
                        - preferred_term: GA1/CPS (Arabidopsis; At4g02780)
                          term:
                            id: UniProtKB:Q38802
                            label: Ent-copalyl diphosphate synthase, chloroplastic
                  function:
                    preferred_term: ent-copalyl diphosphate synthase activity
                    term:
                      id: GO:0009905
                      label: ent-copalyl diphosphate synthase activity
                    substrates:
                      - preferred_term: (2E,6E,10E)-geranylgeranyl diphosphate
                    products:
                      - preferred_term: ent-copalyl diphosphate
                    evidence:
                      - source_id: RHEA:14841
                        statement: (2E,6E,10E)-geranylgeranyl diphosphate = ent-copalyl diphosphate
                          (EC 5.5.1.13).
                      - source_id: PMID:7994182
                        statement: GA1 expressed in E. coli with a GGPP synthase accumulates CPP;
                          the cDNA complements ga1-3.
                        supporting_text: >-
                          In Escherichia coli cells that express both the Arabidopsis GA1 gene
                          and the Erwinia uredovora gene encoding GGPP synthase, CPP was
                          accumulated.
                      - source_id: file:ARATH/GA1/GA1-ai-review.yaml
                        statement: Core function in the GA1 gene review.
                  processes:
                    - preferred_term: gibberellin biosynthetic process
                      term:
                        id: GO:0009686
                        label: gibberellin biosynthetic process
                  locations:
                    - preferred_term: chloroplast
                      term:
                        id: GO:0009507
                        label: chloroplast
                  role_description: First committed step; Mg2+/GGPP synergistic substrate inhibition
                    of the GA-specific CPS may limit flux into the pathway.
          - order: 2
            role: tetracyclization to ent-kaurene
            node:
              id: ks_step
              label: ent-Kaurene synthase (KS/GA2)
              module_type: REACTION
              annotons:
                - id: ks_activity
                  label: "KS: ent-kaurene synthase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: plant ent-kaurene synthase subfamily
                      term:
                        id: PANTHER:PTHR31739:SF3
                        label: ENT-KAUR-16-ENE SYNTHASE, CHLOROPLASTIC
                      representative_members:
                        - preferred_term: GA2/KS (Arabidopsis; At1g79460)
                          term:
                            id: UniProtKB:Q9SAK2
                            label: Ent-kaur-16-ene synthase, chloroplastic
                  function:
                    preferred_term: ent-kaurene synthase activity
                    term:
                      id: GO:0009899
                      label: ent-kaurene synthase activity
                    substrates:
                      - preferred_term: ent-copalyl diphosphate
                    products:
                      - preferred_term: ent-kaur-16-ene
                      - preferred_term: diphosphate
                    evidence:
                      - source_id: RHEA:22220
                        statement: ent-copalyl diphosphate = ent-kaur-16-ene + diphosphate (EC
                          4.2.3.19).
                      - source_id: PMID:9536043
                        statement: Recombinant AtKS converts CPP to ent-kaurene; GA2 encodes KS.
                        supporting_text: Taken together, our results show that the GA2 locus encodes
                          KS.
                      - source_id: file:ARATH/GA2/GA2-ai-review.yaml
                        statement: Core function in the GA2 gene review.
                  processes:
                    - preferred_term: gibberellin biosynthetic process
                      term:
                        id: GO:0009686
                        label: gibberellin biosynthetic process
                  locations:
                    - preferred_term: chloroplast stroma
                      term:
                        id: GO:0009570
                        label: chloroplast stroma
        connections:
          - source: cps_step
            target: ks_step
            connection_type: PRECEDES
            chaining_status: VERIFIED
            chaining_note: CPS produces ent-copalyl diphosphate, the substrate of KS (RHEA:14841
              product = RHEA:22220 substrate).
    - order: 2
      role: P450 oxidation of ent-kaurene to GA12
      node:
        id: p450_stage
        label: Endomembrane stage - P450 monooxygenases (ent-kaurene to GA12)
        module_type: METABOLIC_PATHWAY
        description: >-
          Two multifunctional P450s, each catalysing three successive oxygenations using
          NADPH-cytochrome P450 reductase as electron donor. KO acts at the outer plastid
          envelope (proteomics also co-fractionate it with the ER) and KAO in the ER membrane.
        parts:
          - order: 1
            role: three-step C-19 oxidation of ent-kaurene
            node:
              id: ko_step
              label: ent-Kaurene oxidase (KO/GA3, CYP701A)
              module_type: REACTION
              annotons:
                - id: ko_activity
                  label: "KO: ent-kaurene oxidase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: ent-kaurene oxidase (CYP701A) family
                      term:
                        id: PANTHER:PTHR47283:SF1
                        label: ENT-KAURENE OXIDASE, CHLOROPLASTIC
                      representative_members:
                        - preferred_term: GA3/KO/CYP701A3 (Arabidopsis; At5g25900)
                          term:
                            id: UniProtKB:Q93ZB2
                            label: Ent-kaurene oxidase, chloroplastic
                  function:
                    preferred_term: ent-kaurene oxidase activity
                    term:
                      id: GO:0052615
                      label: ent-kaurene oxidase activity
                    substrates:
                      - preferred_term: ent-kaur-16-ene
                      - preferred_term: O2 (x3)
                    products:
                      - preferred_term: ent-kaur-16-en-19-oate (ent-kaurenoic acid)
                    evidence:
                      - source_id: RHEA:32323
                        statement: ent-kaur-16-ene + 3 O2 (3 reduced P450 reductase) =
                          ent-kaur-16-en-19-oate (EC 1.14.14.86).
                      - source_id: PMID:9952446
                        statement: GA3 expressed in yeast converts ent-kaurene to ent-kaurenoic acid.
                        supporting_text: >-
                          demonstrate that the single enzyme GA3 (ent-kaurene oxidase) catalyzes
                          the three steps of gibberellin biosynthesis from ent-kaurene to
                          ent-kaurenoic acid
                      - source_id: file:ARATH/GA3/GA3-ai-review.yaml
                        statement: Core function in the GA3 gene review.
                  processes:
                    - preferred_term: gibberellin biosynthetic process
                      term:
                        id: GO:0009686
                        label: gibberellin biosynthetic process
                  locations:
                    - preferred_term: chloroplast outer membrane
                      term:
                        id: GO:0009707
                        label: chloroplast outer membrane
                      evidence:
                        - source_id: PMID:11722763
                          statement: In vitro import places AtKO1 on the outer face of the
                            chloroplast envelope.
                          supporting_text: >-
                            Chloroplast import assays with 35S-labelled AtKO1 protein show that
                            it is targeted to the outer face of the chloroplast envelope.
          - order: 2
            role: three-step oxidation of ent-kaurenoic acid to GA12
            node:
              id: kao_step
              label: ent-Kaurenoic acid oxidase (KAO, CYP88A)
              module_type: REACTION
              annotons:
                - id: kao_activity
                  label: "KAO1/KAO2: ent-kaurenoic acid oxidase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: ent-kaurenoic acid oxidase (CYP88A) subfamily
                      representative_members:
                        - preferred_term: KAO1/CYP88A3 (Arabidopsis; At1g05160)
                          term:
                            id: UniProtKB:O23051
                            label: Ent-kaurenoic acid oxidase 1
                        - preferred_term: KAO2/CYP88A4 (Arabidopsis; At2g32440)
                          term:
                            id: UniProtKB:Q9C5Y2
                            label: Ent-kaurenoic acid oxidase 2
                  function:
                    preferred_term: ent-kaurenoic acid monooxygenase activity
                    term:
                      id: GO:0051777
                      label: ent-kaurenoic acid monooxygenase activity
                    substrates:
                      - preferred_term: ent-kaur-16-en-19-oate
                      - preferred_term: O2 (x3)
                    products:
                      - preferred_term: gibberellin A12
                    evidence:
                      - source_id: RHEA:33219
                        statement: ent-kaur-16-en-19-oate + 3 O2 (3 reduced P450 reductase) =
                          gibberellin A12 (EC 1.14.14.107).
                      - source_id: PMID:11172076
                        statement: Yeast expressing AtKAO1 or AtKAO2 converts ent-kaurenoic acid to
                          GA12.
                        supporting_text: >-
                          Yeast strains expressing cDNAs encoding each of the two Arabidopsis and
                          the barley CYP88A enzymes catalyze the three steps of the GA
                          biosynthesis pathway from ent-kaurenoic acid to GA(12).
                      - source_id: PMID:25146977
                        statement: KAO1 and KAO2 are redundant; the double mutant is a severe GA
                          dwarf.
                        supporting_text: >-
                          the kao1 kao2 double mutant exhibits typical non-germinating GA-dwarf
                          phenotypes, similar to those observed in the severely GA-deficient
                          ga1-3 mutant
                      - source_id: file:ARATH/KAO1/KAO1-ai-review.yaml
                        statement: Core function in the KAO1 gene review.
                      - source_id: file:ARATH/KAO2/KAO2-ai-review.yaml
                        statement: Core function in the KAO2 gene review.
                  processes:
                    - preferred_term: gibberellin biosynthetic process
                      term:
                        id: GO:0009686
                        label: gibberellin biosynthetic process
                  locations:
                    - preferred_term: endoplasmic reticulum membrane
                      term:
                        id: GO:0005789
                        label: endoplasmic reticulum membrane
                  notes: KAO1 and KAO2 are functionally redundant paralogs (single mutants are wild
                    type), so either fills this step.
        connections:
          - source: ko_step
            target: kao_step
            connection_type: PRECEDES
            chaining_status: VERIFIED
            chaining_note: KO produces ent-kaur-16-en-19-oate (RHEA:32323 product), the KAO
              substrate (RHEA:33219).
    - order: 3
      role: cytosolic dioxygenase conversion of GA12 to bioactive GA4
      node:
        id: dioxygenase_stage
        label: Cytosolic stage - 2-oxoglutarate-dependent dioxygenases (GA12 to GA4)
        module_type: METABOLIC_PATHWAY
        description: >-
          Soluble 2OG/Fe(II)-dependent dioxygenases. GA20ox removes C-20 (GA12 to GA9; GA53 to
          GA20) and GA3ox introduces the 3beta-hydroxyl that confers bioactivity (GA9 to GA4;
          GA20 to GA1). Both are encoded by multigene families and their transcription is the
          principal homeostatic control point of GA levels.
        parts:
          - order: 1
            role: C-20 oxidation and removal
            node:
              id: ga20ox_step
              label: GA 20-oxidase (GA20ox)
              module_type: REACTION
              annotons:
                - id: ga20ox_activity
                  label: "GA20ox: gibberellin 20-oxidase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: GA 20-oxidase clade of plant 2OG-Fe(II) oxygenases
                      representative_members:
                        - preferred_term: GA20OX1/GA5 (Arabidopsis; At4g25420)
                          term:
                            id: UniProtKB:Q39110
                            label: Gibberellin 20 oxidase 1
                  function:
                    preferred_term: gibberellin 20-oxidase activity
                    term:
                      id: GO:0045544
                      label: gibberellin 20-oxidase activity
                    substrates:
                      - preferred_term: gibberellin A12
                      - preferred_term: 2-oxoglutarate (x2)
                      - preferred_term: O2 (x3)
                    products:
                      - preferred_term: gibberellin A9
                      - preferred_term: succinate
                      - preferred_term: CO2
                    evidence:
                      - source_id: RHEA:60772
                        statement: gibberellin A12 + 2 2-oxoglutarate + 3 O2 = gibberellin A9 + 2
                          succinate + 3 CO2 (overall; via GA15 RHEA:60776 and GA24 RHEA:60780).
                      - source_id: PMID:7630935
                        statement: Recombinant Arabidopsis GA20ox enzymes oxidize GA12 to GA9.
                        supporting_text: >-
                          each of which oxidized GA12 at C-20 to GA15, GA24, and the C19
                          compound GA9, a precursor of bioactive GAs
                      - source_id: PMID:18069939
                        statement: GA20ox1 and GA20ox2 act partially redundantly.
                        supporting_text: >-
                          AtGA20ox1 and AtGA20ox2 act redundantly to promote hypocotyl and
                          internode elongation, flowering time, elongation of anther filaments,
                          the number of seeds that develop per silique and elongation of
                          siliques
                      - source_id: file:ARATH/GA20OX1/GA20OX1-ai-review.yaml
                        statement: Core function in the GA20OX1 gene review.
                  processes:
                    - preferred_term: gibberellin biosynthetic process
                      term:
                        id: GO:0009686
                        label: gibberellin biosynthetic process
                  locations:
                    - preferred_term: cytoplasm
                      term:
                        id: GO:0005737
                        label: cytoplasm
          - order: 2
            role: 3beta-hydroxylation to bioactive GA
            node:
              id: ga3ox_step
              label: GA 3-oxidase (GA3ox)
              module_type: REACTION
              annotons:
                - id: ga3ox_activity
                  label: "GA3ox: gibberellin 3beta-dioxygenase"
                  participant:
                    selector_type: FAMILY
                    family:
                      preferred_term: GA 3-oxidase clade of plant 2OG-Fe(II) oxygenases
                      representative_members:
                        - preferred_term: GA3OX1/GA4 (Arabidopsis; At1g15550)
                          term:
                            id: UniProtKB:Q39103
                            label: Gibberellin 3-beta-dioxygenase 1
                  function:
                    preferred_term: gibberellin 3-beta-dioxygenase activity
                    term:
                      id: GO:0016707
                      label: gibberellin 3-beta-dioxygenase activity
                    substrates:
                      - preferred_term: gibberellin A9
                      - preferred_term: 2-oxoglutarate
                      - preferred_term: O2
                    products:
                      - preferred_term: gibberellin A4
                      - preferred_term: succinate
                      - preferred_term: CO2
                    evidence:
                      - source_id: RHEA:68996
                        statement: gibberellin A9 + 2-oxoglutarate + O2 = gibberellin A4 + succinate
                          + CO2.
                      - source_id: RHEA:10104
                        statement: gibberellin A20 + 2-oxoglutarate + O2 = gibberellin A1 +
                          succinate + CO2 (EC 1.14.11.15; 13-hydroxylated branch).
                      - source_id: PMID:9625708
                        statement: Recombinant GA3ox1 3beta-hydroxylates GA9 (preferred) and GA20.
                        supporting_text: >-
                          GA9 was the preferred substrate, with a Michaelis value of 1 microm
                          compared with 15 microm for GA20.
                      - source_id: PMID:16460513
                        statement: GA3ox1 and GA3ox2 supply bioactive GA during vegetative growth.
                        supporting_text: >-
                          Our results show that AtGA3ox1 and AtGA3ox2 are responsible for the
                          synthesis of bioactive GAs during vegetative growth, but that they are
                          dispensable for reproductive development.
                      - source_id: file:ARATH/GA3OX1/GA3OX1-ai-review.yaml
                        statement: Core function in the GA3OX1 gene review.
                  processes:
                    - preferred_term: gibberellin biosynthetic process
                      term:
                        id: GO:0009686
                        label: gibberellin biosynthetic process
                  locations:
                    - preferred_term: cytoplasm
                      term:
                        id: GO:0005737
                        label: cytoplasm
        connections:
          - source: ga20ox_step
            target: ga3ox_step
            connection_type: PRECEDES
            chaining_status: VERIFIED
            chaining_note: GA20ox produces GA9 (RHEA:60772 product), the preferred GA3ox substrate
              (RHEA:68996); in the 13-hydroxylated branch GA20 links the same two enzymes.
  connections:
    - source: plastid_stage
      target: p450_stage
      connection_type: PROVIDES_INPUT_FOR
      description: ent-Kaurene made in the stroma is oxidized by KO on the outer plastid envelope;
        how the hydrophobic intermediate crosses the envelope is not established.
    - source: p450_stage
      target: dioxygenase_stage
      connection_type: PROVIDES_INPUT_FOR
      description: GA12 formed by ER-bound KAO is released to the cytosol, where GA20ox acts; in
        germinating seeds early and late steps can occur in different cell types, implying
        intercellular movement of an intermediate.
  knowledge_gaps:
    - gap_statement: >-
        The route by which ent-kaurene leaves the plastid stroma to reach KO, and whether KO acts
        on the outer plastid envelope, the ER, or at plastid-ER contact sites, is unresolved:
        import assays place KO on the outer envelope while organelle proteomics co-fractionate it
        with the ER.
      boundary: >-
        Resolving this requires in vivo localization of endogenous KO and tracing of ent-kaurene
        movement, not re-reading existing data.
      gap_kind:
        - BIOLOGY
      status: OPEN
      provenance:
        - reference_id: PMID:11722763
          supporting_text: >-
            These data suggest that the AtKO1 protein links the plastid- and endoplasmic
            reticulum-located steps of the gibberellin biosynthesis pathway by association with
            the outer envelope of the plastid.
    - gap_statement: >-
        In germinating seeds CPS is expressed in the provasculature whereas KO and GA3ox are
        expressed in cortex and endodermis, so an intermediate must move between cell types; its
        identity and transporter are unknown.
      boundary: >-
        Requires cell-type-resolved metabolite profiling and transport assays.
      gap_kind:
        - BIOLOGY
      status: OPEN
      resolution: Cell-type-specific GA intermediate profiling in germinating embryos combined with
        transport assays for candidate intermediates.
      provenance:
        - reference_id: PMID:11737781
          supporting_text: >-
            This implies that intercellular transport of an intermediate of the GA biosynthetic
            pathway is required to produce bioactive GAs.
