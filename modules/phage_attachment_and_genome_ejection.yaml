                id: myovirus_reversible_adsorption
                label: Long tail fiber reversible host recognition
                module_type: BIOLOGICAL_PROCESS
                annotons:
                  - id: ltf_adhesion_receptor_binding
                    label: Long tail fiber distal tip adhesion receptor recognition
                    participant:
                      selector_type: ANY_WITH_FUNCTION
                      required_function:
                        preferred_term: structural constituent of virion
                        term:
                          id: GO:0039660
                          label: structural constituent of virion
                      gene_product:
                        preferred_term: 37 (Bacteriophage T4)
                        term:
                          id: UniProtKB:P03744
                          label: Long-tail fiber protein gp37
                      description: Distal long tail fiber subunits (such as T4 gp37) bind primary host surface receptors (e.g. LPS or OmpC) reversibly to orient the virion on the cell surface.
                    function:
                      preferred_term: structural constituent of virion
                      term:
                        id: GO:0039660
                        label: structural constituent of virion
                    processes:
                      - preferred_term: adhesion receptor-mediated virion attachment to host cell
                        term:
                          id: GO:0098671
                          label: adhesion receptor-mediated virion attachment to host cell
                      - preferred_term: lipopolysaccharide-mediated virion attachment to host cell
                        term:
                          id: GO:0039638
                          label: lipopolysaccharide-mediated virion attachment to host cell
                    role_description: Mediates initial reversible scanning and attachment to host outer membrane receptors.
            - order: 2
              role: irreversible commitment and baseplate triggering
              node:
                id: myovirus_irreversible_baseplate_commitment
                label: Short tail fiber irreversible attachment and baseplate expansion
                module_type: BIOLOGICAL_PROCESS
                annotons:
                  - id: stf_entry_receptor_binding
                    label: Short tail fiber irreversible receptor binding
