    - preferred_term: symbiont genome ejection through host cell envelope
      term:
        id: GO:0039678
        label: symbiont genome ejection through host cell envelope
      description: Translocation of the bacteriophage genome from the virion capsid across the bacterial cell envelope into the host cytoplasm.
    - preferred_term: symbiont entry into host cell
