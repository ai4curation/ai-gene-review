id: MODULE:phage_attachment_and_genome_ejection
title: Bacteriophage Host Attachment and Genome Ejection Systems
description: 'A reusable module capturing the mechanisms by which bacteriophages recognize host surface receptors, penetrate the bacterial cell envelope, and deliver their viral genome into the host cytoplasm. Adsorption proceeds via reversible binding to primary adhesion receptors (`GO:0098671`, including LPS `GO:0039638`, outer membrane porins, pili `GO:0039666`, or flagella `GO:0098931`) followed by irreversible commitment to secondary entry receptors (`GO:0098670`). Genome delivery (`GO:0039678`) is modeled as a variant set across six morphologically distinct architectures: (1) contractile myovirus tail sheath contraction and cell-puncturing needle penetration (`GO:0099000`, e.g. T4), (2) long non-contractile siphovirus tail tip/tape-measure channel translocation (`GO:0099001`, e.g. lambda, T5), (3) short podovirus tail extendable internal core/ejectosome formation (`GO:0099002`, e.g. T7, P22), (4) pilus retraction and TolQRA-dependent translocation in ssDNA/ssRNA filamentous and leviphages
  (e.g. M13, MS2, Qbeta), (5) spike-guided DNA pilot tube translocation in icosahedral Microviridae (e.g. phiX174 gpG/gpH), and (6) envelope membrane fusion + nucleocapsid shell peptidoglycan digestion in enveloped dsRNA Cystoviridae (e.g. phi6 P3/P6/P5).'
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: PMID:27193680
    title: Structure of the T4 baseplate and its function in triggering sheath contraction.
    statement: Reversible and irreversible tail fiber binding induces a hexagonal-to-star conformational transition in the T4 baseplate that triggers tail sheath contraction and genome ejection.
    supporting_text: Here we present the atomic structure of the approximately 6-megadalton bacteriophage T4 baseplate in its pre- and post-host attachment states and explain the events that lead to sheath contraction in atomic detail.
  - source_id: PMID:19229296
    title: 'The tail sheath structure of bacteriophage T4: a molecular machine for infecting bacteria.'
    statement: Contraction of the T4 gp18 tail sheath drives the inner gp19 tail tube and gp5-gp27 cell-puncturing complex across the bacterial outer membrane.
    supporting_text: The contraction of the sheath drives the tail tube through the outer membrane, creating a channel for the viral genome delivery.
  - source_id: PMID:11823865
    title: Structure of the cell-puncturing device of bacteriophage T4.
    statement: The T4 baseplate central hub complex (gp5-gp27) forms a membrane-puncturing needle carrying a lysozyme domain that digests periplasmic peptidoglycan during entry.
    supporting_text: The carboxy-terminal domain of gp5 is a triple-stranded beta-helix that forms an equilateral triangular prism, which acts as a membrane-puncturing needle. The middle lysozyme domain of gp5, situated on the periphery of the prism, serves to digest the peptidoglycan layer.
  - source_id: PMID:15701513
    title: Control of bacteriophage T4 tail lysozyme activity during the infection process.
    statement: Bacteriophage T4 gp5 tail lysozyme activity is sterically inhibited in the mature virion and activated upon tail contraction to locally degrade host peptidoglycan during entry.
    supporting_text: The gp5 needle punctures the outer cell membrane and then digests the peptidoglycan cell wall in the periplasmic space.
  - source_id: file:projects/PHAGES.md
    title: Bacteriophage Genome & Module Curation Plan
    statement: Synthesizes the receptor-binding and genome ejection variants across myoviruses, siphoviruses, podoviruses, filamentous phages, microviruses, and enveloped cystoviruses.
    supporting_text: Three mutually exclusive mechanism children exist in GO (`GO:0099000` contractile tail, `GO:0099001` long flexible tail, `GO:0099002` short tail), plus pilus-retraction (`M13`, `MS2`), DNA pilot tube (`φX174`), and membrane-fusion/spike (`φ6`, `PRD1`) routes.
notes: Curated for the Bacteriophage Genome & Module Curation project. Distinguishes tail-associated peptidoglycan hydrolases acting during viral entry ("lysis from without", annotated to `GO:0098932` symbiont entry into host cell via disruption of host cell wall peptidoglycan, e.g. T4 gp5, T7 gp16, phi6 P5) from late-expressed cytoplasmic/periplasmic endolysins acting during progeny release (`GO:0044659`, e.g. T4 gpE, lambda R, T7 gp3.5). Because virion component terms (`GO:0044423`, `GO:0098015` virus tail, `GO:0098024` virus tail, fiber, `GO:0098025` virus tail, baseplate, `GO:0098027` virus tail, sheath, `GO:0098026` virus tail, tube, `GO:0098023` virus tail, tip) sit under `GO:0044423` rather than `GO:0110165` (`cellular anatomical entity`) in GO, annoton `locations` slots here are omitted or restricted to host cell anatomical compartments while virion structural subcompartments are captured in `concepts`, `description`, and the per-gene reviews.
