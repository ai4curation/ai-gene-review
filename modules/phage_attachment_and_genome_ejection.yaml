                        term:
                          id: UniProtKB:P10930
                          label: Short tail fiber protein gp12
                      description: Short tail fibers (T4 gp12) anchored to baseplate wedge subunits (gp6, gp7, gp8, gp9, gp10, gp11, gp25, gp53) unfold and bind irreversibly to the LPS core, locking the baseplate in its star conformation.
                    function:
                      preferred_term: structural constituent of virion
                      term:
                        id: GO:0039660
                        label: structural constituent of virion
                    processes:
                      - preferred_term: entry receptor-mediated virion attachment to host cell
                        term:
                          id: GO:0098670
                          label: entry receptor-mediated virion attachment to host cell
