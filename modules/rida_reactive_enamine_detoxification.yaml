id: MODULE:rida_reactive_enamine_detoxification
title: RidA reactive enamine/imine detoxification
description: >-
  A cytosolic metabolic damage-control module in which RidA accelerates
  hydrolytic deamination of reactive enamine/imine intermediates generated by
  PLP-dependent enzymes such as threonine dehydratase, protecting isoleucine
  biosynthesis and other PLP enzyme pathways from covalent damage.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0120241
    title: 2-iminobutanoate/2-iminopropanoate deaminase activity
    statement: Defines the RidA reactive imine/enamine deaminase activity.
  - source_id: GO:1901705
    title: L-isoleucine biosynthetic process
    statement: >-
      Defines the branched-chain amino-acid pathway protected from IlvA-derived
      2-iminobutanoate damage by RidA.
  - source_id: file:genes/ECOLI/RidA/RidA-ai-review.yaml
    title: ECOLI RidA gene review
    statement: >-
      The completed E. coli RidA review grounds the enamine/imine deaminase
      activity and distinguishes it from HOCl-activated moonlighting holdase
      activity.
  - source_id: PMID:22094463
    title: >-
      Conserved YjgF protein family deaminates reactive enamine/imine
      intermediates of pyridoxal 5'-phosphate (PLP)-dependent enzyme
      reactions.
    statement: >-
      Establishes the conserved RidA/YjgF-family deaminase activity toward
      reactive intermediates from PLP-dependent enzymes.
  - source_id: PMID:23696645
    title: >-
      Redox proteomics uncovers peroxynitrite-sensitive proteins that help
      Escherichia coli to overcome nitrosative stress.
    statement: >-
      Directly identifies E. coli RidA as an enamine/imine deaminase and
      supports redox regulation of that activity.
notes: >-
  RidA's N-chlorination-activated holdase moonlighting activity is not part of
  this core enamine/imine detoxification module and is intentionally left out
  until modification-dependent holdases are modeled more generally.
