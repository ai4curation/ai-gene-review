id: MODULE:lipid_a_raetz_biosynthesis
title: Kdo2-lipid A biosynthesis (Raetz pathway)
description: >-
  The constitutive nine-enzyme Raetz pathway that builds Kdo2-lipid A, the
  minimal essential lipopolysaccharide anchor, at the cytoplasmic face of the
  Gram-negative inner membrane. LpxA reversibly transfers an
  (R)-3-hydroxyacyl chain from acyl carrier protein (ACP) to UDP-GlcNAc; the
  zinc deacetylase LpxC then irreversibly removes the N-acetyl group, the
  committed step that sets pathway flux. LpxD adds the second
  (R)-3-hydroxyacyl chain, LpxH cleaves part of the UDP-diacylglucosamine pool
  to lipid X, LpxB condenses lipid X with UDP-diacylglucosamine to the
  beta-1',6-linked disaccharide, and LpxK phosphorylates the 4' position to
  give lipid IVA. The bifunctional Kdo transferase WaaA adds two Kdo residues
  from CMP-Kdo, and the late acyltransferases LpxL and LpxM add laurate and
  myristate to the Kdo2-lipid IVA acceptor to give hexa-acylated Kdo2-lipid A.
  Flux is set at LpxC by FtsH-mediated proteolysis tuned by the adaptor LapB
  and the anti-adaptor YejM (PbgA), represented here as an optional regulatory
  part rather than as pathway chemistry.
status: DRAFT
scope: CONCRETE
evidence:
  - source_id: GO:0009245
    title: lipid A biosynthetic process
    statement: Defines formation of lipid A, covering the LpxA to LpxK steps.
  - source_id: GO:0036104
    title: Kdo2-lipid A biosynthetic process
    statement: Defines formation of Kdo2-lipid A, the end product of this module.
  - source_id: PMID:12045108
    title: Lipopolysaccharide endotoxins.
    statement: >-
      Review of the constitutive Raetz pathway enzymes and their order in
      Escherichia coli; used for orientation, with each step separately
      grounded in a primary gene-identification paper.
  - source_id: PMID:42264091
    title: Control of the committed step in lipopolysaccharide biosynthesis.
    statement: >-
      Trigger review. Summarises the pathway order and the FtsH/LapB/YejM
      proteolytic control of LpxC, the committed-step enzyme.
    supporting_text: >-
      Subsequent steps of LPS synthesis are catalyzed by LpxD (14), LpxH (15),
      and LpxB (8, 16), generating a lipid A disaccharide intermediate.
  - source_id: PMID:42264091
    title: Control of the committed step in lipopolysaccharide biosynthesis.
    statement: >-
      FtsH degrades LpxC, with LapB acting as the adaptor and YejM as the
      anti-adaptor.
    supporting_text: >-
      LapB acts as an adaptor that promotes LpxC degradation, whereas YejM
      functions as an antiadaptor that counteracts this activity.
  - source_id: PMID:12045108
    title: Lipopolysaccharide endotoxins.
    statement: >-
      LpxH is not universal among Gram-negative bacteria.
    supporting_text: >-
      LpxH is missing in a few Gram-negative genomes, suggesting additional
      enzymes of this kind may exist.
  - source_id: PMID:12045108
    title: Lipopolysaccharide endotoxins.
    statement: >-
      E. coli has a cold-induced LpxL paralogue, LpxP, that adds palmitoleate
      in place of laurate.
    supporting_text: >-
      LpxP inserts palmitoleate in place of laurate
  - source_id: PMID:8366124
    title: UDP-N-acetylglucosamine acyltransferase of Escherichia coli. The first step of endotoxin biosynthesis is thermodynamically unfavorable.
    statement: >-
      The LpxA reaction has an unfavourable equilibrium, so the following
      deacetylation by LpxC is the committing step.
    supporting_text: >-
      Thus, although UDP-GlcNAc acyltransferase catalyzes the first unique step of lipid A biosynthesis, it is the second enzyme (the deacetylase) that commits the substrates to this pathway.
  - source_id: PMID:8824222
    title: Regulation of UDP-3-O-[R-3-hydroxymyristoyl]-N-acetylglucosamine deacetylase in Escherichia coli. The second enzymatic step of lipid a biosynthesis.
    statement: >-
      Feedback control of lipid A synthesis acts on the amount of LpxC protein
      and not on the other pathway enzymes.
    supporting_text: >-
      Five other enzymes of the lipid A pathway are not affected.
  - source_id: RHEA:67812
    title: UDP-N-acetylglucosamine O-acyltransferase reaction
    statement: Defines the LpxA reaction (EC 2.3.1.129).
  - source_id: RHEA:67816
    title: UDP-3-O-acyl-N-acetylglucosamine deacetylase reaction
    statement: Defines the LpxC reaction (EC 3.5.1.108).
  - source_id: RHEA:53836
    title: UDP-3-O-acylglucosamine N-acyltransferase reaction
    statement: Defines the LpxD reaction (EC 2.3.1.191).
  - source_id: RHEA:25213
    title: UDP-2,3-diacylglucosamine hydrolase reaction
    statement: Defines the LpxH reaction (EC 3.6.1.54).
  - source_id: RHEA:67828
    title: lipid-A-disaccharide synthase reaction
    statement: Defines the LpxB reaction (EC 2.4.1.182).
  - source_id: RHEA:20700
    title: tetraacyldisaccharide 4'-kinase reaction
    statement: Defines the LpxK reaction (EC 2.7.1.130).
  - source_id: RHEA:28066
    title: lipid IVA Kdo transferase reaction
    statement: Defines the first WaaA Kdo transfer (EC 2.4.99.12).
  - source_id: RHEA:28062
    title: Kdo-lipid IVA Kdo transferase reaction
    statement: Defines the second WaaA Kdo transfer (EC 2.4.99.13).
  - source_id: RHEA:28442
    title: Kdo2-lipid IVA lauroyltransferase reaction
    statement: Defines the LpxL reaction (EC 2.3.1.241).
  - source_id: RHEA:28438
    title: Kdo2-lauroyl-lipid IVA myristoyltransferase reaction
    statement: Defines the LpxM reaction (EC 2.3.1.243).
notes: >-
  Boundary. The module starts at the LpxA acyl transfer onto UDP-GlcNAc and
  ends at Kdo2-lipid A. Substrate supply is upstream and outside the module:
  UDP-GlcNAc (shared with peptidoglycan precursor synthesis, see
  MODULE:peptidoglycan_precursor_biosynthesis), (R)-3-hydroxymyristoyl-ACP
  from type II fatty acid synthesis (where FabZ competes with LpxA for the
  same pool), and CMP-Kdo from MODULE:kdo_biosynthesis, whose KdsB product is
  consumed by the WaaA step modelled here. Core oligosaccharide assembly,
  MsbA flipping, O-antigen ligation and Lpt-mediated transport to the outer
  membrane (MODULE:bacterial_lps_transport) are downstream; inducible lipid A
  modification (e.g. MODULE:lipid_a_l_arabinose_modification) and host
  recognition of the product (MODULE:tlr4_md2_lps_signaling) are separate
  modules.

  Committed step. LpxA is the first pathway-specific reaction but is
  reversible and thermodynamically unfavourable (Keq about 0.01,
  PMID:8366124), so commitment occurs at the irreversible LpxC deacetylation.
  This is recorded on the lpxC_step node and is the reason the regulatory
  part targets that step and no other.

  Regulation vs parts. FtsH, LapB (YciM) and YejM (PbgA/LapC) do no lipid A
  chemistry: they set the steady-state amount (and, for LapB, the activity) of
  LpxC. They are therefore modelled as a single optional REGULATORY_STEP part
  connected to lpxC_step by NEGATIVELY_REGULATES, not as steps in the reaction
  chain. FabZ, PldA/FadD-derived acyl-CoA signalling, the Rod complex and
  Lpt/OM-derived inputs described in PMID:42264091 are left out entirely:
  their link to LpxC abundance is genetic or indirect and belongs in the
  phospholipid/peptidoglycan modules.

  LapB has two documented activities on LpxC - adaptor-mediated delivery to
  FtsH and direct allosteric inhibition of deacetylase activity
  (PMID:38635633). Only the adaptor role is given a GO molecular function
  here; the inhibitory activity is recorded in role_description and notes
  because an in vivo contribution has not been established.

  Grounding. Participants are concrete Escherichia coli K-12 gene products
  because the reviewed scope is the E. coli pathway; PANTHER families are
  given alongside each exemplar so the steps can be reused for other
  Gram-negative lineages. LpxH is not universal among Gram-negative
  bacteria (PMID:12045108 notes its absence from some Gram-negative
  genomes, implying another enzyme for this step), but no alternative is asserted here because no second
  implementation was reviewed. Likewise the cold-shock-induced LpxL
  paralogue LpxP, which adds palmitoleate in place of laurate at low
  temperature (PMID:12045108), is outside this constitutive module and is
  not modelled as a variant of the lpxL_step.
  No cytoplasm/cytosol term is asserted at module level; per-step locations
  follow the GOA cellular-component annotations of each enzyme.
module:
  id: lipid_a_raetz_biosynthesis
  label: Kdo2-lipid A biosynthesis (Raetz pathway)
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: lipid A biosynthetic process
      term: {id: "GO:0009245", label: "lipid A biosynthetic process"}
      description: Formation of the acylated diglucosamine bisphosphate lipid A backbone.
    - preferred_term: Kdo2-lipid A biosynthetic process
      term: {id: "GO:0036104", label: "Kdo2-lipid A biosynthetic process"}
      description: >-
        Formation of the minimal essential LPS species, the end product of
        this module.
  context:
    taxa:
      - preferred_term: Escherichia coli K-12
        term: {id: "NCBITaxon:83333", label: "Escherichia coli K-12"}
    cellular_components:
      - preferred_term: cytoplasmic face of the inner membrane
        term: {id: "GO:0005886", label: "plasma membrane"}
        description: >-
          Early steps are soluble cytoplasmic reactions; from LpxH onward the
          enzymes act at the cytoplasmic leaflet of the inner membrane.
  parts:
    - order: 1
      role: First acyl chain transfer to UDP-GlcNAc
      node:
        id: lpxA_step
        label: UDP-GlcNAc O-acylation
        module_type: REACTION
        description: >-
          Reversible, thermodynamically unfavourable transfer of an
          (R)-3-hydroxyacyl group from ACP to the 3-OH of UDP-GlcNAc. The
          unfavourable equilibrium is why commitment falls to the next step.
        annotons:
          - id: lpxA_activity
            label: LpxA UDP-GlcNAc acyltransferase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LpxA (Escherichia coli K-12)
                term:
                  id: "UniProtKB:P0A722"
                  label: Acyl-[acyl-carrier-protein]--UDP-N-acetylglucosamine O-acyltransferase
              family:
                preferred_term: LpxA family
                term: {id: "PANTHER:PTHR43480", label: "ACYL-[ACYL-CARRIER-PROTEIN]--UDP-N-ACETYLGLUCOSAMINE O-ACYLTRANSFERASE"}
                representative_members:
                  - preferred_term: LpxA (Escherichia coli K-12)
                    term:
                      id: "UniProtKB:P0A722"
                      label: Acyl-[acyl-carrier-protein]--UDP-N-acetylglucosamine O-acyltransferase
            function:
              preferred_term: UDP-N-acetylglucosamine O-acyltransferase activity
              term: {id: "GO:0008780", label: "acyl-[acyl-carrier-protein]-UDP-N-acetylglucosamine O-acyltransferase activity"}
              substrates:
                - preferred_term: UDP-N-acetyl-alpha-D-glucosamine
                - preferred_term: (3R)-hydroxyacyl-[ACP]
              products:
                - preferred_term: UDP-3-O-[(3R)-3-hydroxyacyl]-N-acetyl-alpha-D-glucosamine
                - preferred_term: holo-[ACP]
              evidence:
                - source_id: RHEA:67812
                  statement: Defines the EC 2.3.1.129 reaction.
                - source_id: PMID:8366124
                  statement: >-
                    Purified E. coli enzyme catalyses the reaction with an
                    equilibrium constant near 0.01.
                  supporting_text: >-
                    The most remarkable feature of the reaction is its unfavorable equilibrium constant, Keq approximately equal to 0.01
            processes:
              - preferred_term: lipid A biosynthetic process
                term: {id: "GO:0009245", label: "lipid A biosynthetic process"}
            locations:
              - preferred_term: cytosol
                term: {id: "GO:0005829", label: "cytosol"}
            role_description: >-
              First pathway-specific but reversible reaction; competes with
              FabZ for the (R)-3-hydroxyacyl-ACP pool.
    - order: 2
      role: Committed deacetylation
      node:
        id: lpxC_step
        label: UDP-3-O-acyl-GlcNAc deacetylation (committed step)
        module_type: REACTION
        description: >-
          Irreversible, zinc-dependent removal of the N-acetyl group. Because
          the preceding LpxA reaction is reversible and unfavourable, this is
          the committed step of lipid A and hence of LPS biosynthesis, and the
          point at which pathway flux is set.
        annotons:
          - id: lpxC_activity
            label: LpxC UDP-3-O-acyl-GlcNAc deacetylase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LpxC / EnvA (Escherichia coli K-12)
                term:
                  id: "UniProtKB:P0A725"
                  label: UDP-3-O-acyl-N-acetylglucosamine deacetylase
              family:
                preferred_term: LpxC family
                term: {id: "PANTHER:PTHR33694", label: "UDP-3-O-ACYL-N-ACETYLGLUCOSAMINE DEACETYLASE 1, MITOCHONDRIAL-RELATED"}
                representative_members:
                  - preferred_term: LpxC / EnvA (Escherichia coli K-12)
                    term:
                      id: "UniProtKB:P0A725"
                      label: UDP-3-O-acyl-N-acetylglucosamine deacetylase
            function:
              preferred_term: UDP-3-O-acyl-N-acetylglucosamine deacetylase activity
              term: {id: "GO:0103117", label: "UDP-3-O-acyl-N-acetylglucosamine deacetylase activity"}
              substrates:
                - preferred_term: UDP-3-O-[(3R)-3-hydroxyacyl]-N-acetyl-alpha-D-glucosamine
                - preferred_term: water
              products:
                - preferred_term: UDP-3-O-[(3R)-3-hydroxyacyl]-alpha-D-glucosamine
                - preferred_term: acetate
              evidence:
                - source_id: RHEA:67816
                  statement: Defines the EC 3.5.1.108 reaction.
                - source_id: PMID:8530464
                  statement: >-
                    envA, renamed lpxC, is the structural gene for the
                    deacetylase; the overproduced protein carries the activity.
                  supporting_text: >-
                    Thus, envA is the structural gene for UDP-3-O-acyl-GlcNAc
            processes:
              - preferred_term: lipid A biosynthetic process
                term: {id: "GO:0009245", label: "lipid A biosynthetic process"}
            locations:
              - preferred_term: cytoplasm
                term: {id: "GO:0005737", label: "cytoplasm"}
            role_description: >-
              Committed, irreversible step; a zinc metallo-deacetylase whose
              cellular amount, rather than its catalytic efficiency, sets
              pathway flux.
            notes: >-
              GO:0008759 (the former LpxC-specific deacetylase term) is
              obsolete; GO:0103117 is the current reaction term. Zinc binding
              (GO:0008270) is a supporting cofactor activity recorded in the
              gene annotations rather than a separate module step.
    - order: 3
      role: Second acyl chain transfer
      node:
        id: lpxD_step
        label: UDP-3-O-acyl-glucosamine N-acylation
        module_type: REACTION
        annotons:
          - id: lpxD_activity
            label: LpxD N-acyltransferase
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LpxD / FirA (Escherichia coli K-12)
                term:
                  id: "UniProtKB:P21645"
                  label: UDP-3-O-(3-hydroxymyristoyl)glucosamine N-acyltransferase
              family:
                preferred_term: LpxD family
                term: {id: "PANTHER:PTHR43378", label: "UDP-3-O-ACYLGLUCOSAMINE N-ACYLTRANSFERASE"}
                representative_members:
                  - preferred_term: LpxD / FirA (Escherichia coli K-12)
                    term:
                      id: "UniProtKB:P21645"
                      label: UDP-3-O-(3-hydroxymyristoyl)glucosamine N-acyltransferase
            function:
              preferred_term: UDP-3-O-acylglucosamine N-acyltransferase activity
              term: {id: "GO:0103118", label: "UDP-3-O-[(3R)-3-hydroxyacyl]-glucosamine N-acyltransferase activity"}
              substrates:
                - preferred_term: UDP-3-O-[(3R)-3-hydroxyacyl]-alpha-D-glucosamine
                - preferred_term: (3R)-hydroxyacyl-[ACP]
              products:
                - preferred_term: UDP-2-N,3-O-bis[(3R)-3-hydroxyacyl]-alpha-D-glucosamine
                - preferred_term: holo-[ACP]
              evidence:
                - source_id: RHEA:53836
                  statement: Defines the EC 2.3.1.191 reaction.
                - source_id: PMID:8366125
                  statement: >-
                    firA (lpxD) is the structural gene for the third enzyme of
                    the pathway.
                  supporting_text: >-
                    demonstrating that firA is the structural gene for the enzyme
            processes:
              - preferred_term: lipid A biosynthetic process
                term: {id: "GO:0009245", label: "lipid A biosynthetic process"}
            locations:
              - preferred_term: cytosol
                term: {id: "GO:0005829", label: "cytosol"}
            role_description: >-
              Produces UDP-2,3-diacylglucosamine, the branch-point metabolite
              used both as the LpxH substrate and as the LpxB donor.
    - order: 4
      role: Lipid X formation
      node:
        id: lpxH_step
        label: UDP-2,3-diacylglucosamine hydrolysis
        module_type: REACTION
        description: >-
          Pyrophosphatase cleavage of part of the UDP-2,3-diacylglucosamine
          pool to lipid X (2,3-diacylglucosamine 1-phosphate), the acceptor
          half of the disaccharide.
        annotons:
          - id: lpxH_activity
