                - source_id: PMID:3049593
                  statement: >-
                    The purified E. coli enzyme condenses lipid X with
                    UDP-2,3-diacylglucosamine.
                  supporting_text: >-
                    The purified enzyme displays a strong kinetic preference for sugar substrates bearing two fatty acyl moieties
            processes:
              - preferred_term: lipid A biosynthetic process
                term: {id: "GO:0009245", label: "lipid A biosynthetic process"}
            locations:
