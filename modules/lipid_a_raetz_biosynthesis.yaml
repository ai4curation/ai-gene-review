                  statement: Defines the EC 3.6.1.54 reaction.
                - source_id: PMID:12000770
                  statement: >-
                    ybbF, renamed lpxH, encodes the specific
                    UDP-2,3-diacylglucosamine hydrolase of lipid A synthesis.
                  supporting_text: >-
                    Because ybbF encodes the specific UDP-2,3-diacylglucosamine hydrolase involved in lipid A biosynthesis, it is now designated lpxH.
            processes:
              - preferred_term: lipid A biosynthetic process
                term: {id: "GO:0009245", label: "lipid A biosynthetic process"}
            locations:
              - preferred_term: cytoplasm
                term: {id: "GO:0005737", label: "cytoplasm"}
