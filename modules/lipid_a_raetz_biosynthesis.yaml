              the cytoplasmic face; supplies lipid X for LpxB.
            notes: >-
              LpxH is absent from some Gram-negative lineages, which use an
              unrelated hydrolase for this step; no alternative implementation
              is asserted here because none was reviewed. Location follows the
              GOA experimental cellular-component annotation (cytoplasm);
              the peripheral association with the cytoplasmic face of the
              inner membrane described in role_description is not separately
              asserted as a location.
