    - order: 10
      role: Proteolytic control of the committed step
      optional: true
      node:
        id: lpxC_proteolytic_control
        label: FtsH/LapB/YejM control of LpxC abundance
        module_type: REGULATORY_STEP
        description: >-
          A membrane-embedded regulatory switch that sets the steady-state
          amount of LpxC and therefore flux through the committed step. The
          adaptor LapB (YciM) recruits LpxC to the AAA+ protease FtsH for
          degradation; the anti-adaptor YejM (PbgA/LapC) sequesters the LapB
          transmembrane helix and is released when LPS accumulates in the
          periplasmic leaflet of the inner membrane. LapB additionally
          inhibits LpxC catalytic activity directly in vitro. This part
          performs no lipid A chemistry and is therefore modelled as
          regulation rather than as a pathway step.
        annotons:
          - id: ftsh_lpxc_proteolysis
            label: FtsH ATP-dependent degradation of LpxC
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: FtsH (Escherichia coli K-12)
                term:
                  id: "UniProtKB:P0AAI3"
                  label: ATP-dependent zinc metalloprotease FtsH
            function:
              preferred_term: ATP-dependent peptidase activity
              term: {id: "GO:0004176", label: "ATP-dependent peptidase activity"}
              targets:
                - preferred_term: LpxC / EnvA (Escherichia coli K-12)
                  term:
                    id: "UniProtKB:P0A725"
                    label: UDP-3-O-acyl-N-acetylglucosamine deacetylase
              evidence:
                - source_id: PMID:10048027
                  statement: >-
                    Purified FtsH degrades the LpxC deacetylase, and ftsH
                    mutation raises LpxC and LPS amounts.
                  supporting_text: >-
                    Pulse-chase experiments and in vitro assays with purified components showed that FtsH, the AAA-type membrane-bound metalloprotease, degrades the deacetylase.
            processes:
              - preferred_term: protein catabolic process
                term: {id: "GO:0030163", label: "protein catabolic process"}
            locations:
              - preferred_term: plasma membrane
                term: {id: "GO:0005886", label: "plasma membrane"}
            role_description: >-
              The only essential AAA+ protease of E. coli; the effector of the
              switch, degrading LpxC and so lowering pathway flux.
          - id: lapb_adaptor
            label: LapB adaptor delivering LpxC to FtsH
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: LapB / YciM (Escherichia coli K-12)
                term:
                  id: "UniProtKB:P0AB58"
                  label: Lipopolysaccharide assembly protein B
              family:
                preferred_term: LapB family
                term: {id: "PANTHER:PTHR45586", label: "TPR REPEAT-CONTAINING PROTEIN PA4667"}
                representative_members:
                  - preferred_term: LapB / YciM (Escherichia coli K-12)
                    term:
                      id: "UniProtKB:P0AB58"
                      label: Lipopolysaccharide assembly protein B
            function:
              preferred_term: protease adaptor activity
              term: {id: "GO:0030674", label: "protein-macromolecule adaptor activity"}
              targets:
                - preferred_term: LpxC / EnvA (Escherichia coli K-12)
                  term:
                    id: "UniProtKB:P0A725"
                    label: UDP-3-O-acyl-N-acetylglucosamine deacetylase
              evidence:
                - source_id: PMID:35931690
                  statement: >-
                    Reconstituted kinetics show LapB is an adaptor that binds
                    FtsH through its transmembrane helix and recruits LpxC
                    through its cytoplasmic domains.
                  supporting_text: >-
                    We establish an in vitro assay to analyze the kinetics of LpxC degradation and demonstrate that LapB is an adaptor protein that utilizes its transmembrane helix to interact with FtsH and its cytoplasmic domains to recruit LpxC.
                - source_id: PMID:24266962
                  statement: >-
                    yciM (lapB) regulation of LpxC amounts requires FtsH in
                    vivo.
                  supporting_text: >-
                    Regulation of LpxC by YciM was contingent on the presence of FtsH
                - source_id: PMID:24722986
                  statement: >-
                    Loss of LapB raises LpxC levels and LPS content, placing
                    LapB as a negative regulator of lipid A synthesis.
                  supporting_text: >-
                    the levels of LpxC, the enzyme that catalyzes the first committed step of lipid A synthesis, were highly elevated in the Δ(lapA lapB) mutant
            processes:
              - preferred_term: negative regulation of lipid biosynthetic process
                term: {id: "GO:0051055", label: "negative regulation of lipid biosynthetic process"}
            locations:
              - preferred_term: plasma membrane
                term: {id: "GO:0005886", label: "plasma membrane"}
            role_description: >-
              Substrate-delivery adaptor; a LapB dimer engages two LpxC
              molecules through its TPR and rubredoxin domains and, in vitro,
              also inhibits LpxC deacetylase activity allosterically
              (PMID:38635633), a second activity with no GO molecular function
              asserted here.
            notes: >-
              PANTHER's own classification files place P0AB58 in
              PTHR12558:SF47 while UniProt cross-references PTHR45586:SF1.
              Both subfamilies carry the same name ("LIPOPOLYSACCHARIDE
              ASSEMBLY PROTEIN B"), so the subfamily name cannot decide
              between them. The family-level names do: PTHR12558 is "CELL
              DIVISION CYCLE 16,23,27" (the eukaryotic anaphase-promoting
              complex TPR subunits), whereas PTHR45586 is "TPR
              REPEAT-CONTAINING PROTEIN PA4667", a bacterial TPR protein
              family, which fits a bacterial inner-membrane TPR/rubredoxin
              protein. The UniProt assignment is kept on that basis and the
              disagreement is recorded rather than resolved.
          - id: yejm_antiadaptor
            label: YejM anti-adaptor sequestering LapB
            participant:
              selector_type: GENE_PRODUCT
              gene_product:
                preferred_term: YejM / PbgA (Escherichia coli K-12)
                term:
                  id: "UniProtKB:P0AD27"
                  label: Inner membrane protein PbgA
              family:
                preferred_term: YejM/PbgA family
                term: {id: "PANTHER:PTHR43108", label: "N-ACETYLGLUCOSAMINE-6-SULFATASE FAMILY MEMBER"}
                representative_members:
                  - preferred_term: YejM / PbgA (Escherichia coli K-12)
                    term:
                      id: "UniProtKB:P0AD27"
                      label: Inner membrane protein PbgA
            function:
              preferred_term: protein sequestering activity
              term: {id: "GO:0140311", label: "protein sequestering activity"}
              targets:
                - preferred_term: LapB / YciM (Escherichia coli K-12)
                  term:
                    id: "UniProtKB:P0AB58"
                    label: Lipopolysaccharide assembly protein B
              evidence:
                - source_id: PMID:35931690
                  statement: >-
                    The YejM/LapB structure shows YejM competes with FtsH for
                    LapB, and LPS and LapB occupy overlapping sites on YejM.
                  supporting_text: >-
                    Our YejM/LapB complex structure reveals that YejM is an anti-adaptor protein, competing with FtsH for LapB to inhibit LpxC degradation.
                - source_id: PMID:32291302
                  statement: >-
                    Genetic epistasis places YejM upstream of YciM (LapB) in
                    preventing toxic LPS overproduction.
                  supporting_text: >-
                    we show that yciM is epistatic to yejM, demonstrating that YejM acts upstream of YciM to prevent toxic overproduction of LPS
                - source_id: PMID:32430473
                  statement: >-
                    Suppressors of yejM essentiality map to lpxC and lapB, and
                    LpxC is destabilised without YejM.
                  supporting_text: >-
                    Suppressors of YejM essentiality were identified in lpxC and lapB, and LpxC overproduction was shown to be sufficient to allow survival of ΔyejM mutants.
                - source_id: PMID:32788728
                  statement: >-
                    PbgA (YejM) carries a lipid A-binding motif at the
                    periplasmic leaflet and senses LPS to regulate LpxC
                    stability.
                  supporting_text: >-
                    identify a lipid A-binding motif along the periplasmic leaflet of the inner membrane
            processes:
              - preferred_term: regulation of lipid biosynthetic process
                term: {id: "GO:0046890", label: "regulation of lipid biosynthetic process"}
            locations:
              - preferred_term: plasma membrane
                term: {id: "GO:0005886", label: "plasma membrane"}
            role_description: >-
              LPS sensor at the periplasmic leaflet; a lipid A-binding motif
              lies along the periplasmic leaflet of the inner membrane
              (PMID:32788728), and LPS binding releases LapB to act on FtsH. The
              reported magnesium-dependent phosphatase activity of the
              periplasmic domain has no identified physiological substrate and
              is not asserted as a module function.
  connections:
    - source: lpxA_step
      target: lpxC_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        LpxA produces UDP-3-O-acyl-N-acetylglucosamine, the LpxC substrate
        (curator-confirmed; the automated matcher tracks only CoA-bearing
        species and cannot see this UDP-sugar link).
    - source: lpxC_step
      target: lpxD_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        LpxC produces UDP-3-O-acylglucosamine, the LpxD substrate; not a CoA
        species, so not visible to the automated matcher.
    - source: lpxD_step
      target: lpxH_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        LpxD produces UDP-2,3-diacylglucosamine, hydrolysed by LpxH; not a CoA
        species, so not visible to the automated matcher.
    - source: lpxD_step
      target: lpxB_step
      connection_type: PROVIDES_INPUT_FOR
      description: >-
        LpxB also consumes UDP-2,3-diacylglucosamine directly as the donor
        half of the disaccharide, so the LpxD product feeds both branches.
    - source: lpxH_step
      target: lpxB_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        LpxH produces lipid X, the LpxB acceptor; not a CoA species, so not
        visible to the automated matcher.
    - source: lpxB_step
      target: lpxK_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        LpxB produces lipid A disaccharide, phosphorylated by LpxK; not a CoA
        species, so not visible to the automated matcher.
    - source: lpxK_step
      target: waaA_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        LpxK produces lipid IVA, the WaaA acceptor, whose 4'-phosphate WaaA
        requires; not a CoA species, so not visible to the automated matcher.
    - source: waaA_step
      target: lpxL_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        WaaA produces Kdo2-lipid IVA, the obligatory LpxL acceptor; not a CoA
        species, so not visible to the automated matcher.
    - source: lpxL_step
      target: lpxM_step
      connection_type: PRECEDES
      chaining_status: VERIFIED
      chaining_note: >-
        LpxL produces Kdo2-(lauroyl)-lipid IVA, the LpxM acceptor; not a CoA
        species, so not visible to the automated matcher.
    - source: lpxC_proteolytic_control
      target: lpxC_step
      connection_type: NEGATIVELY_REGULATES
      description: >-
        FtsH, directed by the LapB adaptor, lowers LpxC abundance and thereby
        flux through the committed step; YejM opposes this by sequestering
        LapB when periplasmic LPS is low.
    - source: yejm_antiadaptor
      target: lapb_adaptor
      connection_type: NEGATIVELY_REGULATES
      description: >-
        YejM binds the LapB transmembrane helices at the site LapB uses for
        FtsH, so LapB is unavailable as an adaptor until LPS displaces it.
    - source: lapb_adaptor
      target: ftsh_lpxc_proteolysis
      connection_type: POSITIVELY_REGULATES
      description: >-
        LapB increases the affinity of LpxC for FtsH, accelerating its
        degradation.
