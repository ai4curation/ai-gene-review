                      id: "UniProtKB:P10441"
                      label: Lipid-A-disaccharide synthase
            function:
              preferred_term: lipid-A-disaccharide synthase activity
              term: {id: "GO:0008915", label: "lipid-A-disaccharide synthase activity"}
              substrates:
                - preferred_term: lipid X
                - preferred_term: UDP-2-N,3-O-bis[(3R)-3-hydroxyacyl]-alpha-D-glucosamine
              products:
                - preferred_term: lipid A disaccharide
                - preferred_term: UDP
