id: MODULE:dmel_tor_complexes
title: TOR complexes TORC1 and TORC2 in Drosophila melanogaster
description: >-
  The serine/threonine kinase TOR acts in two distinct complexes. TORC1, defined by the substrate-recruiting
  subunit Raptor, is rapamycin-sensitive, is activated by amino acids and growth factors through
  the Rag and Rheb GTPases, and promotes growth by phosphorylating S6 kinase and the translation
  inhibitor 4E-BP (Thor) while repressing autophagy. TORC2, defined by Rictor and Sin1 together
  with Lst8, phosphorylates Akt at its hydrophobic motif and contributes to growth control
  and cytoskeletal regulation.
status: DRAFT
scope: CONCRETE
evidence:
- source_id: FB:FBgg0000911
  title: 'FlyBase gene group TOR: Tor complexes'
  statement: >-
    FlyBase release FB2026_03 groups 5 D. melanogaster genes as tor complexes (TOR); this
    module models that group.
- source_id: GO:0038201
  title: TOR complex
  statement: >-
    GO term grounding the module as TOR complex.
notes: >-
  Boundary. Membership follows FlyBase; FlyBase lists Lst8 only in TORC2, although Lst8 is
  also a TORC1 subunit in other organisms. Upstream regulators (Rag and Rheb GTPases, GATOR,
  TSC) are modelled in dmel_torc1_nutrient_sensing. FlyBase groups realized by this module:
  TOR (FBgg0000911). Subgroups folded into it: TORC1, TORC2. Participants were generated from
  the FlyBase gene-group membership and mapped to UniProtKB by projects/FLYBASE_GENE_GROUPS/generate_modules.py
  from module_specs/dmel_tor_complexes.yaml. Genes without a UniProtKB entry (mostly non-coding
  RNAs) are grounded to their FlyBase gene ids. None of the member genes has a gene review
  yet unless noted.
