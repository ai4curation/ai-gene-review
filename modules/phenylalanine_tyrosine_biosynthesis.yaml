  statement: Identifies the plant prephenate aminotransferase.
- source_id: PMID:21102469
  title: >-
    Prephenate aminotransferase directs plant phenylalanine biosynthesis via arogenate.
  statement: The arogenate route predominates in plants.
- source_id: PMID:17726025
  title: >-
    Phenylalanine biosynthesis in Arabidopsis thaliana. Identification and characterization
