id: MODULE:phenylalanine_tyrosine_biosynthesis
title: L-phenylalanine and L-tyrosine biosynthesis from chorismate
description: >-
  Branch of aromatic amino acid biosynthesis that converts chorismate to L-phenylalanine and
  L-tyrosine in bacteria, fungi and plants. Chorismate mutase rearranges chorismate to prephenate;
  this committed step is the main point of feedback control, typically inhibited by tyrosine
  (and in fungi and plants activated by tryptophan). Prephenate is then converted by one of
  two routes. In the prephenate route used by fungi and most bacteria, prephenate dehydratase
  gives phenylpyruvate and prephenate dehydrogenase gives 4-hydroxyphenylpyruvate, and aromatic
  aminotransferases convert these keto acids to phenylalanine and tyrosine. In the arogenate
  route that predominates in plants, prephenate aminotransferase first gives arogenate, which
  arogenate dehydratase and arogenate dehydrogenase convert to phenylalanine and tyrosine.
  In enteric bacteria chorismate mutase is fused to the dehydratase (P-protein) or the dehydrogenase
  (T-protein); in fungi and plants it is a separate allosteric enzyme. Synthesis of chorismate,
  the tryptophan branch and the hydroxylation of phenylalanine to tyrosine are outside this
  module.
status: DRAFT
