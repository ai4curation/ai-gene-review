    cofactor was corrected to NAD+.
  url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-4120
- source_id: YeastPathways:COMPLETE-ARO-PWY-1
  title: >-
    superpathway of aromatic amino acid biosynthesis (S. cerevisiae, SGD YeastPathways)
  statement: >-
    The superpathway is the union of chorismate biosynthesis, the tryptophan branch and this
    module. Only its chorismate-mutase, prephenate and transamination reactions are modelled
    here; it is not modelled as a separate module.
  url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=COMPLETE-ARO-PWY-1
- source_id: PMID:1943992
  title: >-
    Aromatic amino acid biosynthesis in the yeast Saccharomyces cerevisiae: a model system
    for the regulation of a eukaryotic biosynthetic pathway.
  statement: >-
    Review of the yeast gene-enzyme relationships and branch-point regulation; cited by YeastPathways.
  supporting_text: >-
    the carbon flow is controlled mainly by modulating the enzyme activities at the first
    step of the pathway and at the branch points by feedback action of the three aromatic
    amino acid end products
- source_id: PMID:3027508
  title: >-
    Molecular cloning and characterization of ARO7-OSM2, a single yeast gene necessary for
    chorismate mutase activity and growth in hypertonic medium.
  statement: ARO7 encodes yeast chorismate mutase.
- source_id: PMID:9642265
  title: >-
    Tyrosine and tryptophan act through the same binding site at the dimer interface of yeast
    chorismate mutase.
  statement: Allosteric regulation of ARO7 by tyrosine and tryptophan.
- source_id: PMID:21388819
  title: >-
    Complementation of the pha2 yeast mutant suggests functional differences for arogenate
    dehydratases from Arabidopsis thaliana.
  statement: >-
    pha2 yeast mutants lack prephenate dehydratase; plant ADTs differ in residual PDT activity.
- source_id: PMID:2697638
  title: >-
    Characterization of the prephenate dehydrogenase-encoding gene, TYR1, from Saccharomyces
    cerevisiae.
  statement: TYR1 encodes yeast prephenate dehydrogenase.
- source_id: PMID:30771296
  title: >-
    Biochemical characterization of TyrA dehydrogenases from Saccharomyces cerevisiae (Ascomycota)
    and Pleurotus ostreatus (Basidiomycota).
  statement: >-
    Yeast TYR1 prefers prephenate and NAD+, so the module uses GO:0008977 rather than GO:0004665.
- source_id: PMID:9491082
  title: >-
    Phenylalanine- and tyrosine-auxotrophic mutants of Saccharomyces cerevisiae impaired in
    transamination.
  statement: >-
    ARO8 and ARO9 are redundant for Phe/Tyr transamination; HIS5 does not substitute, since
    aro8 aro9 double mutants are auxotrophs.
- source_id: PMID:9491083
  title: >-
    Characterisation of Saccharomyces cerevisiae ARO8 and ARO9 genes encoding aromatic aminotransferases
    I and II reveals a new aminotransferase subfamily.
  statement: >-
    ARO8 is under general amino acid control; ARO9 is induced by aromatic amino acids.
- source_id: PMID:15983
  title: >-
    Escherichia coli mutants deficient in the aspartate and aromatic amino acid aminotransferases.
  statement: TyrB and AspC are redundant aromatic aminotransferases in E. coli.
- source_id: PMID:20883697
  title: >-
    Identification of a plant gene encoding glutamate/aspartate-prephenate aminotransferase:
