  statement: Characterises Arabidopsis NADP-specific arogenate dehydrogenase.
- source_id: PMID:22554242
  title: The shikimate pathway and aromatic amino Acid biosynthesis in plants.
  statement: Review of plant aromatic amino acid biosynthesis, including compartmentation.
