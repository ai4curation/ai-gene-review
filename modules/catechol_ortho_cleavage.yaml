id: MODULE:catechol_ortho_cleavage
title: Catechol ortho-cleavage branch of the beta-ketoadipate pathway
description: >-
  A reusable bacterial aromatic-catabolism module for the catechol ortho-cleavage
  branch of the beta-ketoadipate pathway, which converts catechol to beta-ketoadipate
  enol-lactone in three cytoplasmic steps. A CatA-type Fe(III) intradiol catechol
  1,2-dioxygenase first cleaves catechol between its hydroxylated carbons to
  cis,cis-muconate; a CatB-type muconate cycloisomerase of the enolase superfamily
  then forms (4S)-muconolactone; and a CatC-type muconolactone Delta-isomerase
  produces the enol-lactone. The same three-enzyme chain is found in Proteobacteria,
  as in Pseudomonas putida KT2440 (which carries two CatA paralogs) and Acinetobacter
  baylyi ADP1, and in Actinobacteria, as in Rhodococcus opacus 1CP, whose CatA and
  CatB come from lineages distinct from the proteobacterial enzymes. The module starts
  at catechol, the product of upper pathways such as benzoate dioxygenation, and stops
  before the enol-lactone hydrolase, CoA-transferase and thiolase steps that the
  catechol branch shares with the protocatechuate branch.
status: COMPLETE
scope: CONCRETE
evidence:
  - source_id: GO:0019615
    title: catechol catabolic process, ortho-cleavage
    statement: >-
      GO:0019615 provides the process-level boundary for the catechol
      ortho-cleavage branch modeled here.
  - source_id: UniPathway:UPA00157
    title: beta-ketoadipate pathway
    statement: >-
      UniPathway places CatA and CatC in the catechol-derived beta-ketoadipate
      route, with the catechol branch represented as three steps from catechol
      to the beta-ketoadipate enol-lactone intermediate.
  - source_id: KEGG:ppu00361
    title: Pseudomonas putida KT2440 chlorocyclohexane and chlorobenzene degradation
    statement: >-
      The local PSEPK pathway partition assigns CatA-I, CatA-II, and CatB to
      KEGG ppu00361, but the biochemical interpretation is catechol
      ortho-cleavage rather than a complete chlorinated-aromatic degradation
      module.
  - source_id: KEGG:ppu00362
    title: Pseudomonas putida KT2440 benzoate degradation
    statement: >-
      CatC is pulled from neighboring benzoate/aromatic-catabolism memberships
      because it is required downstream of CatB in the catechol branch, even
      though it is not a primary ppu00361 bucket gene.
  - source_id: file:modules/catechol_ortho_cleavage-deep-research-openscientist.md
    title: OpenScientist module research for catechol ortho-cleavage
    statement: >-
      OpenScientist retrieval supports the three-enzyme CatA to CatB to CatC
      boundary, the start at catechol, the stop before shared lower
      beta-ketoadipate reactions, and the separation of chlorocatechol modified
      ortho-cleavage as a distinct neighboring module.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__catechol_ortho_cleavage__ppu00361-deep-research-openscientist.md
    title: OpenScientist PSEPK pathway research for ppu00361 catechol ortho-cleavage
    statement: >-
      The PSEPK-specific retrieval concluded that the KT2440 catechol
      ortho-cleavage branch is fully satisfiable once CatC/PP_3714 is included;
      its omission from the ppu00361 candidate bucket is a KEGG map-partitioning
      artifact, not a biological pathway gap.
  - source_id: PMID:2449420
    title: Transcriptional regulation, nucleotide sequence, and localization of the promoter of the catBC operon in Pseudomonas putida.
    statement: >-
      Classical P. putida catBC work identifies catB and catC as encoding
      cis,cis-muconate lactonizing enzyme I and muconolactone isomerase,
      respectively, required for benzoate dissimilation to beta-ketoadipate.
  - source_id: file:PSEPK/catA/catA-ai-review.yaml
    title: Curated KT2440 catA-I review
    statement: >-
      Accepts catechol 1,2-dioxygenase activity for CatA-I/PP_3713 and refines the
      broad process rows to GO:0019615.
  - source_id: file:PSEPK/catA-II/catA-II-ai-review.yaml
    title: Curated KT2440 catA-II review
    statement: >-
      Accepts the same catechol 1,2-dioxygenase activity for the ben-locus paralog
      PP_3166.
  - source_id: file:PSEPK/catA-II/catA-II-deep-research-openscientist.md
    title: OpenScientist gene research for catA-II
    statement: >-
      Distinguishes Q88I35/PP_3166, embedded in the benzoate uptake/oxidation gene
      island, from the CatA-I/PP_3713 cat-region paralog.
  - source_id: file:PSEPK/catB/catB-ai-review.yaml
    title: Curated KT2440 catB review
    statement: >-
      Accepts muconate cycloisomerase activity and removes propagated
      peptide/amino-acid and chloromuconate annotations.
  - source_id: file:PSEPK/catC/catC-ai-review.yaml
    title: Curated KT2440 catC review
    statement: >-
      Accepts muconolactone delta-isomerase activity and places CatC downstream of
      CatA and CatB in the catechol branch.
  - source_id: file:ACIAD/catA/catA-ai-review.yaml
    title: Curated A. baylyi ADP1 catA review
    statement: >-
      ADP1 CatA is the structurally defining catechol 1,2-dioxygenase (Fe(III)
      homodimer with catechol complexes).
  - source_id: file:ACIAD/catB/catB-ai-review.yaml
    title: Curated A. baylyi ADP1 catB review
    statement: >-
      The ADP1 muconate cycloisomerase converts cis,cis-muconate but not
      chlorinated muconates.
  - source_id: file:ACIAD/catC/catC-ai-review.yaml
    title: Curated A. baylyi ADP1 catC review
    statement: >-
      ADP1 catC encodes muconolactone isomerase in the catBCIJFD operon and
      complements a P. putida catC mutant.
  - source_id: file:RHOOP/catA/catA-ai-review.yaml
    title: Curated R. opacus 1CP catA review
    statement: >-
      Actinobacterial CatA (NCBIfam TIGR02438) characterised structurally and
      kinetically with catechol.
  - source_id: file:RHOOP/catB/catB-ai-review.yaml
    title: Curated R. opacus 1CP catB review
    statement: >-
      Muconate cycloisomerase purified from benzoate-grown 1CP; PANTHER places it
      in PTHR48080, not PTHR48073.
  - source_id: file:RHOOP/catC/catC-ai-review.yaml
    title: Curated R. opacus 1CP catC review
    statement: >-
      Third gene of the 1CP catABC cluster, whose clone expresses all three
      catechol-branch activities.
  - source_id: PMID:8990288
    title: Characterization of catechol catabolic genes from Rhodococcus erythropolis 1CP.
    statement: >-
      The Gram-positive strain 1CP carries catA catB catC in one cluster whose
      clone expresses catechol 1,2-dioxygenase, muconate cycloisomerase and
      muconolactone isomerase, showing the same three-step branch outside the
      Proteobacteria.
  - source_id: PMID:3003031
    title: Cloning and expression of Acinetobacter calcoaceticus catBCDE genes in Pseudomonas putida and Escherichia coli.
    statement: >-
      Acinetobacter catB and catC encode consecutive catechol-branch reactions and
      complement P. putida catB and catC mutants.
  - source_id: file:interpro/panther/PTHR33711/PTHR33711-review.yaml
    title: PTHR33711 intradiol ring-cleavage dioxygenase family review
    statement: >-
      Catechol 1,2-dioxygenase activity is restricted to CatA clades within SF7;
      the PANTHER family also holds chlorocatechol/hydroxyquinol 1,2-dioxygenases
      and protocatechuate 3,4-dioxygenase subunits.
  - source_id: file:interpro/panther/PTHR48073/PTHR48073-review.yaml
    title: PTHR48073 OSBS-related family review
    statement: >-
      Proteobacterial CatB shares SF2 with MenC and epimerases; MenC-derived PAINT
      IBDs at PTN001334879 propagate wrongly to the CatB clade.
  - source_id: file:interpro/panther/PTHR48080/PTHR48080-review.yaml
    title: PTHR48080 D-galactonate dehydratase-related family review
    statement: >-
      Actinobacterial CatB sits in SF3 of this family; the SF3-root epimerase IBD
      is too deep for it.
notes: >-
  Scope: generalised from a first-pass P. putida KT2440 (PSEPK) instance to a
  Bacteria-wide module, because the same CatA -> CatB -> CatC chain is experimentally
  established in gammaproteobacteria (KT2440, A. baylyi ADP1) and in the
  actinobacterium R. opacus 1CP. KT2440 remains one exemplar; ADP1 and 1CP were added
  because each has direct structural, biochemical or genetic evidence for all three
  steps. Scope stays CONCRETE since every step is grounded to reviewed proteins.
  Fungal catechol branches are not modelled: some fungal intradiol dioxygenases fall
  in PANTHER PTHR33711, but the fungal cycloisomerase and isomerase steps were not
  reviewed. Family grounding uses NCBIfam models rather than PANTHER: CatA is split
  into proteobacterial (TIGR02439) and actinobacterial (TIGR02438) families, both
  inside the broader PANTHER PTHR33711:SF7; TIGR02534 covers muconate cycloisomerases
  that PANTHER divides between PTHR48073 (Proteobacteria) and PTHR48080
  (Actinobacteria), each a heterogeneous enolase-superfamily family; TIGR03221 covers
  CatC, which has no PANTHER family. The KEGG ppu00361 bucket that seeded the PSEPK
  instance lacks CatC (a map-partitioning artefact) and over-broadly frames the branch
  as chlorinated-aromatic degradation; chlorocatechol modified ortho-cleavage is a
  separate neighbouring module. Downstream enol-lactone hydrolase, CoA-transferase and
  thiolase steps are shared lower beta-ketoadipate chemistry, modelled separately.
module:
  id: catechol_ortho_cleavage
  label: Catechol ortho-cleavage branch
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: catechol catabolic process, ortho-cleavage
      term:
        id: GO:0019615
        label: catechol catabolic process, ortho-cleavage
      description: >-
        Conversion of catechol through intradiol ring cleavage and subsequent
        lactone rearrangements toward the beta-ketoadipate pathway.
  context:
    taxa:
      - preferred_term: bacteria
        term:
          id: NCBITaxon:2
          label: Bacteria
        description: >-
          Bacterial CatABC-type catechol ortho-cleavage, with exemplars from
          Gammaproteobacteria (Pseudomonas, Acinetobacter) and Actinobacteria
          (Rhodococcus).
    cellular_components:
      - preferred_term: cytosol
        term:
          id: GO:0005829
          label: cytosol
        description: >-
          CatABC-like bacterial aromatic-catabolism enzymes are soluble cytosolic
          enzymes.
  parts:
    - order: 1
      role: catechol intradiol ring cleavage
      node:
        id: cata_ring_cleavage
        label: CatA catechol 1,2-dioxygenation
        module_type: REACTION
        description: >-
          CatA-like intradiol dioxygenases cleave catechol between the two
          hydroxylated carbons, incorporating both atoms of dioxygen and forming
          cis,cis-muconate.
        annotons:
          - id: cata_activity
            label: Catechol 1,2-dioxygenase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: bacterial catechol 1,2-dioxygenase (CatA) families
                description: >-
                  Non-heme Fe(III) intradiol catechol 1,2-dioxygenases
                  of the proteobacterial (TIGR02439) and
                  actinobacterial (TIGR02438) CatA families. Both lie
                  within PANTHER PTHR33711:SF7, which also holds
                  chlorocatechol and hydroxyquinol 1,2-dioxygenases
                  and is therefore not used as the grounding.
                representative_members:
                  - preferred_term: catA / catA-I (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88GK8
                      label: catechol 1,2-dioxygenase
                    description: Pseudomonas putida KT2440 catA-I/PP_3713.
                  - preferred_term: catA-II (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88I35
                      label: catechol 1,2-dioxygenase
                    description: Pseudomonas putida KT2440 catA-II/PP_3166.
                  - preferred_term: catA (Acinetobacter baylyi ADP1)
                    term:
                      id: UniProtKB:P07773
                      label: Catechol 1,2-dioxygenase
                    description: >-
                      Acinetobacter baylyi ADP1 catA/ACIAD1442;
                      crystal structure with catechol
                      bound.
                  - preferred_term: catA (Rhodococcus opacus 1CP)
                    term:
                      id: UniProtKB:P95607
                      label: Catechol 1,2-dioxygenase
                    description: >-
                      Rhodococcus opacus 1CP catA; actinobacterial
                      CatA (TIGR02438) with crystal
                      structures.
                family_terms:
                  - id: NCBIfam:TIGR02439
                    label: catechol 1,2-dioxygenase
                  - id: NCBIfam:TIGR02438
                    label: catechol 1,2-dioxygenase
            function:
              preferred_term: catechol 1,2-dioxygenase activity
              term:
                id: GO:0018576
                label: catechol 1,2-dioxygenase activity
              substrates:
                - preferred_term: catechol
                - preferred_term: dioxygen
              products:
                - preferred_term: cis,cis-muconate
                - preferred_term: hydrogen ion
              cofactors:
                - preferred_term: ferric iron
                  term:
                    id: GO:0008199
                    label: ferric iron binding
              evidence:
                - source_id: file:ACIAD/catA/catA-ai-review.yaml
                  statement: >-
                    ADP1 CatA catechol 1,2-dioxygenase and Fe(III)
                    binding accepted from IDA and
                    structural evidence.
                - source_id: file:RHOOP/catA/catA-ai-review.yaml
                  statement: >-
                    R. opacus 1CP CatA activity accepted from
                    expression, structural and kinetic
                    evidence.
                - source_id: file:PSEPK/catA/catA-ai-review.yaml
                  statement: >-
                    KT2440 CatA-I activity accepted from family
                    membership and KT2440-lineage
                    genetics.
            processes:
              - preferred_term: catechol catabolic process, ortho-cleavage
                term:
                  id: GO:0019615
                  label: catechol catabolic process, ortho-cleavage
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              First committed catechol-branch step. Proteobacterial and
              actinobacterial CatA enzymes belong to separate NCBIfam
              families; KT2440 carries two paralogs (CatA-I in the cat
              region and the ben-linked CatA-II).
    - order: 2
      role: cis,cis-muconate lactonization
      node:
        id: catb_lactonization
        label: CatB muconate cycloisomerization
        module_type: REACTION
        description: >-
          CatB-like enzymes cycloisomerize cis,cis-muconate to muconolactone,
          the second reaction of the catechol branch.
        annotons:
          - id: catb_activity
            label: Muconate cycloisomerase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: muconate cycloisomerase family
                term:
                  id: NCBIfam:TIGR02534
                  label: muconate cycloisomerase
                description: >-
                  CatB-type muconate cycloisomerases of the mandelate
                  racemase/muconate lactonizing enzyme branch of the
                  enolase superfamily (TIGR02534). PANTHER splits them
                  between PTHR48073 (Proteobacteria) and PTHR48080
                  (Actinobacteria), both heterogeneous families, so
                  PANTHER is not used as the grounding.
                representative_members:
                  - preferred_term: catB (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88GK6
                      label: Muconate cycloisomerase 1
                    description: Pseudomonas putida KT2440 catB/PP_3715.
                  - preferred_term: catB (Acinetobacter baylyi ADP1)
                    term:
                      id: UniProtKB:Q43931
                      label: Muconate cycloisomerase 1
                    description: >-
                      Acinetobacter baylyi ADP1 catB/ACIAD1446;
                      substrate specificity measured.
                  - preferred_term: catB (Rhodococcus opacus 1CP)
                    term:
                      id: UniProtKB:P95608
                      label: Muconate cycloisomerase 1
                    description: >-
                      Rhodococcus opacus 1CP catB; enzyme purified
                      from benzoate-grown cells.
            function:
              preferred_term: muconate cycloisomerase activity
              term:
                id: GO:0018849
                label: muconate cycloisomerase activity
              substrates:
                - preferred_term: cis,cis-muconate
              products:
                - preferred_term: (+)-muconolactone
              cofactors:
                - preferred_term: manganese ion
                  term:
                    id: GO:0030145
                    label: manganese ion binding
              evidence:
                - source_id: file:PSEPK/catB/catB-ai-review.yaml
                  statement: >-
                    The catB review accepts muconate cycloisomerase
                    activity and Mn(2+) binding
                    from P. putida biochemistry.
                - source_id: file:ACIAD/catB/catB-ai-review.yaml
                  statement: >-
                    ADP1 CatB converts cis,cis-muconate but not chlorinated muconates.
                - source_id: file:RHOOP/catB/catB-ai-review.yaml
                  statement: >-
                    R. opacus 1CP muconate cycloisomerase purified
                    and its gene cloned from
                    peptide sequence.
            processes:
              - preferred_term: catechol catabolic process, ortho-cleavage
                term:
                  id: GO:0019615
                  label: catechol catabolic process, ortho-cleavage
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Converts the CatA product to muconolactone; distinct from
              chloromuconate cycloisomerase/dehalogenating routes.
    - order: 3
      role: muconolactone isomerization
      node:
        id: catc_isomerization
        label: CatC muconolactone delta-isomerization
        module_type: REACTION
        description: >-
          CatC-like enzymes isomerize muconolactone to the beta-ketoadipate
          enol-lactone intermediate, completing the catechol ortho-cleavage
          branch before the shared lower beta-ketoadipate reactions.
        annotons:
          - id: catc_activity
            label: Muconolactone delta-isomerase
            participant:
              selector_type: FAMILY
              family:
                preferred_term: muconolactone delta-isomerase family
                term:
                  id: NCBIfam:TIGR03221
                  label: muconolactone delta-isomerase
                description: >-
                  CatC-like muconolactone delta-isomerases of the bacterial
                  catechol branch.
                representative_members:
                  - preferred_term: catC (Pseudomonas putida KT2440)
                    term:
                      id: UniProtKB:Q88GK7
                      label: Muconolactone Delta-isomerase
                    description: Pseudomonas putida KT2440 catC/PP_3714.
                  - preferred_term: catC (Acinetobacter baylyi ADP1)
                    term:
                      id: UniProtKB:Q43932
                      label: Muconolactone Delta-isomerase
                    description: Acinetobacter baylyi ADP1 catC/ACIAD1447.
                  - preferred_term: catC (Rhodococcus opacus 1CP)
                    term:
                      id: UniProtKB:P95609
                      label: Muconolactone Delta-isomerase
                    description: Rhodococcus opacus 1CP catC.
            function:
              preferred_term: muconolactone delta-isomerase activity
              term:
                id: GO:0016159
                label: muconolactone delta-isomerase activity
              substrates:
                - preferred_term: (+)-muconolactone
              products:
                - preferred_term: beta-ketoadipate enol-lactone
              evidence:
                - source_id: file:PSEPK/catC/catC-ai-review.yaml
                  statement: >-
                    KT2440 CatC muconolactone delta-isomerase
                    activity accepted from the P.
                    putida catBC operon literature.
                - source_id: file:ACIAD/catC/catC-ai-review.yaml
                  statement: >-
                    ADP1 catC encodes muconolactone isomerase and
                    complements a P. putida catC
                    mutant.
                - source_id: file:RHOOP/catC/catC-ai-review.yaml
                  statement: >-
                    The 1CP cat cluster clone expresses
                    muconolactone isomerase activity.
            processes:
              - preferred_term: catechol catabolic process, ortho-cleavage
                term:
                  id: GO:0019615
                  label: catechol catabolic process, ortho-cleavage
            locations:
              - preferred_term: cytosol
                term:
                  id: GO:0005829
                  label: cytosol
            role_description: >-
              Completes the three-step catechol branch by producing the
              enol-lactone substrate for the shared lower beta-ketoadipate
              module.
  connections:
    - source: cata_ring_cleavage
      target: catb_lactonization
      connection_type: PRECEDES
      description: The CatA product cis,cis-muconate is the substrate for CatB.
      chaining_status: VERIFIED
    - source: catb_lactonization
      target: catc_isomerization
      connection_type: PRECEDES
      description: The CatB product muconolactone is the substrate for CatC.
      chaining_status: VERIFIED
