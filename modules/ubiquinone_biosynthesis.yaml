      chaining_note: The long-chain polyprenyl diphosphate is the prenyl donor for UbiA/Coq2.
    - source: hydroxybenzoate_head_group_synthesis
      target: hydroxybenzoate_prenylation
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: >-
        Each supply route produces 4-hydroxybenzoate, which UbiA or Coq2
        prenylates.
    - source: hydroxybenzoate_prenylation
      target: ring_modification_routes
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: VERIFIED
      chaining_note: >-
        4-Hydroxy-3-polyprenylbenzoate is decarboxylated first by UbiD in
        bacteria and hydroxylated first by Coq6 in eukaryotes.
    - source: ubiquinone_biosynthesis_accessory_system
      target: ring_modification_routes
      connection_type: PROVIDES_INPUT_FOR
      chaining_status: NOT_APPLICABLE
      chaining_note: >-
        Accessory factors supply assembly, lipid-intermediate handling or
        electrons rather than a chemical substrate.
  knowledge_gaps:
    - gap_statement: >-
        The enzymes that convert 4-hydroxyphenylpyruvate to
        4-hydroxybenzaldehyde in fungi, and the head-group route in animals,
        are not identified.
      boundary: >-
        Model only the Aro8/Aro9 and Hfd1 steps of the fungal route and mark
        the intervening chain as a knowledge gap.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Coq11 (both yeasts) and Coq12 (fission yeast) are required for normal
        CoQ levels, but their molecular activities in the pathway are
        unresolved.
      boundary: >-
        Keep them out of the leaf annotons until a reaction or defined
        accessory role is established.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        Oxygen-independent UbiT/UbiU/UbiV hydroxylation reaches the same
        ubiquinone product but uses distinct machinery and incompletely resolved
        chemistry.
      boundary: >-
        Keep that route outside this aerobic module until its reaction-level
        implementation can be grounded without conflating it with UbiI/UbiH/
        UbiF- or Coq7-family activities.
      gap_kind:
        - BIOLOGY
        - CURATION
    - gap_statement: >-
        Exact reaction order and intermediate nomenclature for the three ring
        hydroxylations varies across bacterial lineages.
      boundary: >-
        Treat the grouped hydroxylation and methylation nodes as a reusable
        activity inventory; instantiate lineage-specific order only when direct
        biochemical or well-supported pathway evidence is available.
      gap_kind:
        - BIOLOGY
    - gap_statement: >-
        UbiB is a conserved kinase-like ATP-dependent accessory factor, but the
        direct molecular output of bacterial UbiB proteins remains less certain than their
        pathway requirement.
      boundary: >-
        Model UbiB as optional accessory context and do not assign a module leaf
        molecular function until the bacterial activity is directly resolved.
      gap_kind:
        - BIOLOGY
        - CURATION
