id: MODULE:ubiquinone_biosynthesis
title: Ubiquinone (coenzyme Q) biosynthesis in bacteria and mitochondria
description: >-
  De novo biosynthesis of ubiquinone (coenzyme Q) from 4-hydroxybenzoate and
  a long-chain all-trans-polyprenyl diphosphate in bacteria and in the
  mitochondria of eukaryotes. A dedicated trans-prenyltransferase sets the
  tail length (homomeric IspB or Coq1, or a heterotetrameric Dps1/Dlp1 or
  PDSS1/PDSS2 enzyme). The aromatic head group comes from chorismate via UbiC
  in bacteria, and from tyrosine in fungi, where aminotransferases form
  4-hydroxyphenylpyruvate and an aldehyde dehydrogenase (Hfd1) oxidizes
  4-hydroxybenzaldehyde to 4-hydroxybenzoate. UbiA-family prenyltransferases
  (UbiA in the bacterial membrane, Coq2 in the mitochondrial inner membrane)
  attach the tail. The ring then undergoes one decarboxylation, three
  hydroxylations, two O-methylations and one C-methylation, in lineage-specific
  order: bacteria decarboxylate first with prFMN-dependent UbiD (cofactor from
  UbiX) and use UbiI/UbiH/UbiF or Coq7 hydroxylases, whereas the mitochondrial
  CoQ synthome hydroxylates C5 with Coq6, O-methylates with Coq3, performs a
  C1 oxidative decarboxylation with Coq4, then C-methylates (Coq5),
  hydroxylates C6 (Coq7) and O-methylates again (Coq3). Accessory factors
  (UbiJ, UbiK and UbiB in bacteria; Coq8, Coq9 and the mitochondrial
  ferredoxin system in eukaryotes) organize the hydrophobic intermediates or
  supply electrons. Oxygen-independent UbiT/UbiU/UbiV implementations, C5-C20
  prenyl diphosphate synthesis, and coenzyme Q transport and use are outside
  the module.
status: DRAFT
evidence:
  - source_id: GO:0006744
    title: ubiquinone biosynthetic process
    statement: >-
      GO biological-process term for de novo ubiquinone biosynthesis; used as
      the primary process grounding for the module.
  - source_id: KEGG:map00130
    title: Ubiquinone and other terpenoid-quinone biosynthesis
    statement: >-
      KEGG pathway context for ubiquinone biosynthesis and neighboring
      terpenoid-quinone reactions; species-specific map members need filtering
      because quinone reductases, homogentisate metabolism, menaquinone
      methylation, and cofactor-supply enzymes can appear in the same map.
  - source_id: PMID:28927698
    title: Biochemistry of Mitochondrial Coenzyme Q Biosynthesis
    statement: >-
      Review article summarizing CoQ/ubiquinone biosynthesis across eukaryotic
      and prokaryotic systems, including the UbiD/UbiX decarboxylation context,
      prokaryotic UbiG O-methylation, UbiE/COQ5 C-methylation, UbiH-like
      hydroxylation, and COQ7/Coq7 late hydroxylation.
  - source_id: PMID:24480387
    title: Biosynthesis and physiology of coenzyme Q in bacteria
    statement: >-
      Review of bacterial ubiquinone reaction order, enzyme assignments, and
      pathway variation used to delimit the reaction chain.
  - source_id: PMID:23709220
    title: "ubiI, a new gene in Escherichia coli coenzyme Q biosynthesis, is involved in aerobic C5-hydroxylation"
    statement: >-
      Establishes UbiI as the oxygen-dependent early polyprenylphenol
      hydroxylase and grounds the experimentally characterized E. coli
      exemplar UniProtKB:P25535.
  - source_id: PMID:30686758
    title: A soluble metabolon synthesizes the isoprenoid lipid ubiquinone
    statement: >-
      Establishes the bacterial Ubi metabolon and the lipid-intermediate
      handling role of the UbiJ scaffold.
  - source_id: PMID:36142227
    title: "Towards Molecular Understanding of the Functional Role of UbiJ-UbiK(2) Complex in Ubiquinone Biosynthesis by Multiscale Molecular Modelling Studies"
    statement: >-
      Supports the bacterial UbiJ/UbiK accessory assembly context while
      distinguishing it from the core reaction sequence.
  - source_id: PMID:10419476
    title: >-
      Yeast and rat Coq3 and Escherichia coli UbiG polypeptides catalyze both
      O-methyltransferase steps in coenzyme Q biosynthesis.
    statement: >-
      Purified E. coli UbiG catalyzes both O-methylation reactions represented
      by the UbiG annotons.
  - source_id: PMID:9045837
    title: >-
      A C-methyltransferase involved in both ubiquinone and menaquinone
      biosynthesis: isolation and identification of the Escherichia coli ubiE gene.
    statement: >-
      E. coli genetics establishes the UbiE-dependent ring C-methylation step
      in ubiquinone biosynthesis.
  - source_id: YeastPathways:PWY3O-862
    title: superpathway of ubiquinone biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Superpathway joining FPP/GGPP and hexaprenyl diphosphate synthesis, the
      unassigned coumarate route to 4-hydroxybenzoate and the COQ ring
      reactions. ERG20 and BTS1 steps belong to
      MODULE:isoprenoid_diphosphate_biosynthesis; the decarboxylation
      (RXN3O-73) has no gene and is filled by COQ4; the C1 hydroxylation
      (RXN3O-12) assigned to COQ6 is part of the COQ4 oxidative
      decarboxylation (PMID:38295803).
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-862
  - source_id: YeastPathways:PWY3O-19
    title: ubiquinol-6 biosynthesis from 4-hydroxybenzoate (eukaryotic) (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Eight ring reactions with COQ2, COQ6, COQ3, COQ5 and CAT5/COQ7; COQ4 is
      added for the unassigned decarboxylation and COQ8, COQ9 and the
      YAH1/ARH1 electron supply as accessory factors.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-19
  - source_id: YeastPathways:PWY3O-1109
    title: p-hydroxybenzoate biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      Proposed coumarate route from tyrosine with no assigned genes; replaced
      in the module by the Aro8/Aro9 to Hfd1 route of PMID:27693056, with the
      intervening steps left as a knowledge gap.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=PWY3O-1109
  - source_id: YeastPathways:HEXPPSYN-PWY-2
    title: hexaprenyl diphosphate biosynthesis (S. cerevisiae, SGD YeastPathways)
    statement: >-
      ERG20 (GPP, FPP), BTS1 (GGPP) and COQ1 (hexaprenyl diphosphate); only the
      chain-length-determining COQ1 step is part of this module.
    url: https://pathway.yeastgenome.org/YEAST/NEW-IMAGE?object=HEXPPSYN-PWY-2
  - source_id: PMID:2198286
    title: >-
      Elucidation of the deficiency in two yeast coenzyme Q mutants.
      Characterization of the structural gene encoding hexaprenyl
      pyrophosphate synthetase.
    statement: COQ1 encodes hexaprenyl pyrophosphate synthetase.
  - source_id: PMID:14519123
    title: >-
      Fission yeast decaprenyl diphosphate synthase consists of Dps1 and the
      newly characterized Dlp1 protein in a novel heterotetrameric structure.
    statement: S. pombe decaprenyl diphosphate synthase is a Dps1-Dlp1 heterotetramer.
  - source_id: PMID:27693056
    title: Mechanistic Details of Early Steps in Coenzyme Q Biosynthesis Pathway in Yeast.
    statement: >-
      Aro8 and Aro9 deaminate tyrosine to 4-hydroxyphenylpyruvate and Hfd1
      oxidizes 4-hydroxybenzaldehyde to 4-hydroxybenzoate in yeast.
  - source_id: PMID:20592037
    title: para-Aminobenzoic acid is a precursor in coenzyme Q6 biosynthesis in Saccharomyces cerevisiae.
    statement: para-Aminobenzoate is an alternative ring precursor for CoQ6 in yeast.
  - source_id: PMID:21944752
    title: >-
      Coenzyme Q biosynthesis: Coq6 is required for the C5-hydroxylation
      reaction and substrate analogs rescue Coq6 deficiency.
    statement: >-
      Coq6 performs only the C5 hydroxylation, with Yah1/Arh1 as likely
      electron donors.
  - source_id: PMID:38295803
    title: COQ4 is required for the oxidative decarboxylation of the C1 carbon of coenzyme Q in eukaryotic cells.
    statement: >-
      COQ4 catalyzes C1 decarboxylation and hydroxylation as a single
      oxidative decarboxylation.
  - source_id: PMID:30661980
    title: An Isoprene Lipid-Binding Protein Promotes Eukaryotic Coenzyme Q Biosynthesis.
    statement: COQ9 binds CoQ intermediates and interfaces with COQ7.
  - source_id: PMID:26008578
    title: Yeast Coq9 controls deamination of coenzyme Q intermediates that derive from para-aminobenzoic acid.
    statement: Coq9 is required for CoQ-synthome integrity.
  - source_id: PMID:37156397
    title: Identification of novel coenzyme Q(10) biosynthetic proteins Coq11 and Coq12 in Schizosaccharomyces pombe.
    statement: >-
      S. pombe coq11 and coq12 deletions lower CoQ to about 4 percent of wild
      type; Coq12 is required for 4-hydroxybenzoate synthesis.
  - source_id: file:modules/coenzyme_q10_biosynthesis.yaml
    title: Coenzyme Q10 (ubiquinone) biosynthesis module (human)
    statement: >-
      Human-scoped sibling module; its PDSS1/2 and COQ2-COQ9 assignments are
      consistent with the eukaryotic variants here.
  - source_id: file:modules/ubiquinone_biosynthesis-deep-research-openscientist.md
    title: OpenScientist generic ubiquinone module review
    statement: >-
      Research synthesis covering module boundaries, reaction order,
      oxygen-dependent alternatives, and bacterial assembly factors.
  - source_id: file:projects/P_PUTIDA/deep-research/PSEPK__ubiquinone_biosynthesis__ppu00130-deep-research-openscientist.md
    title: OpenScientist PSEPK ubiquinone pathway assessment
    statement: >-
      Species-level satisfiability audit identifying the complete KT2440
      aerobic route, the Coq7-for-UbiF substitution, and UbiJ/UbiK/UbiB
      accessory factors omitted by KEGG map membership.
  - source_id: file:projects/P_PUTIDA/data/psepk_gene_list.tsv
    title: PSEPK UniProt metadata inventory
    statement: >-
      Local UniProt-derived inventory provides the Pseudomonas putida KT2440
      exemplar accessions, GO terms, EC numbers, and PANTHER families used to
      ground representative members in this module.
notes: >-
  This module is intentionally narrower than KEGG map00130: it represents
  aerobic ubiquinone biosynthesis, not all terpenoid quinones. Homogentisate
  production, generic NAD(P)H:quinone oxidoreductases, acyl-CoA thioesterases,
  menaquinone synthesis, and downstream quinone use are outside the boundary.
  GENERALIZE with YeastPathways (2026-10): the module was broadened from a
  bacterial pathway to bacteria plus mitochondria rather than creating a
  separate eukaryotic sibling, because the tail synthase, the UbiA/Coq2
  prenyltransferase, the UbiG/Coq3 and UbiE/Coq5 methyltransferases, the
  Coq6/UbiI-type flavin hydroxylase and the Coq7 hydroxylase are homologous
  across the two lineages; only the head-group supply, the decarboxylase and
  the reaction order differ. Those differences are modeled as exclusive
  lineage variants at the head-group, prenylation (compartment),
  ring-modification and accessory levels, so the bacterial content is kept
  intact inside the bacterial variants. The human-scoped
  MODULE:coenzyme_q10_biosynthesis remains a concrete human instance of the
  eukaryotic variant. The chain-length-determining polyprenyl diphosphate
  synthase (Coq1, IspB, Dps1/Dlp1, PDSS1/PDSS2) is now an optional part,
  because MODULE:isoprenoid_diphosphate_biosynthesis stops at GGPP and defers
  Coq1 here; ERG20 and BTS1 stay in that module. YeastCyc corrections: COQ4
  fills the unassigned decarboxylation (RXN3O-73) and also performs the C1
  hydroxylation that YeastCyc assigns to COQ6 (RXN3O-12) (PMID:38295803);
  CAT5 is COQ7; COQ8, COQ9 and the YAH1/ARH1 ferredoxin system are missing
  from the YeastCyc gene list; the coumarate route of PWY3O-1109 has no genes
  and is replaced by the Aro8/Aro9 and Hfd1 steps (PMID:27693056). All
  YeastPathways activities are placed in the cytosol, whereas the CoQ enzymes
  are mitochondrial. GO-CAM disagreements: PWY3O-19 types both COQ6
  activities with the bacterial UbiH term GO:0008681; PWY3O-862 types COQ1
  and COQ6 only with GO:0003674; HEXPPSYN-PWY-2 types COQ1 as a heptaprenyl
  diphosphate synthase. The PomBase model 662af8fa00000408 assigns the C1
  hydroxylation (GO:0120538) to coq6 after coq4 decarboxylation, whereas
  Pelosi et al. (PMID:38295803) assign both C1 reactions to COQ4; it also
  includes coq10 (CoQ binding after synthesis), coq11, coq12 and a ptc7
  phosphatase that are not modeled as annotons here.

module:
  id: ubiquinone_biosynthesis
  label: Ubiquinone biosynthesis
  module_type: METABOLIC_PATHWAY
  concepts:
    - preferred_term: ubiquinone biosynthetic process
      term:
        id: GO:0006744
        label: ubiquinone biosynthetic process
      description: De novo formation of ubiquinone/coenzyme Q.
  gocam_associations:
    - model: gomodel:YeastPathways_PWY3O-862
      title: 'superpathway of ubiquinone biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        SGD superpathway conversion: all activities in the cytosol, COQ1 and
        both COQ6 activities typed only as GO:0003674, and ERG20/BTS1
        prenyltransferase activities that belong to isoprenoid metabolism.
    - model: gomodel:YeastPathways_PWY3O-19
      title: 'ubiquinol-6 biosynthesis from 4-hydroxybenzoate (eukaryotic) - imported from: Saccharomyces Genome Database'
      description: >-
        SGD ring-modification conversion: COQ2, COQ6 (two activities typed with
        the bacterial UbiH term GO:0008681), COQ3 (two activities), COQ5 and
        CAT5; all in the cytosol and part of only GO:0009058.
    - model: gomodel:YeastPathways_HEXPPSYN-PWY-2
      title: 'hexaprenyl diphosphate biosynthesis - imported from: Saccharomyces Genome Database'
      description: >-
        ERG20, BTS1 and COQ1; COQ1 is typed GO:0000010 heptaprenyl
        diphosphate synthase activity, and one activity is enabled by a
        chemical (CHEBI:36080) placeholder.
    - model: gomodel:662af8fa00000408
      title: ubiquinone metabolic process (GO:0006743)
      description: >-
        PomBase S. pombe model with dps1/dlp1, ppt1, coq6 (C5 and C1
        hydroxylation), coq3 (both methylations), coq4, coq5, coq7, coq8, coq9,
        coq10, coq11, coq12, etp1, arh1 and a ptc7 phosphatase, largely chained
        by causal edges on the inner membrane.
  parts:
    - order: 0
      role: polyprenyl diphosphate side-chain synthesis (chain-length determining)
      optional: true
      node:
        id: polyprenyl_diphosphate_tail_synthesis
        label: Long-chain all-trans-polyprenyl diphosphate synthesis
        module_type: METABOLIC_PATHWAY
        description: >-
          A dedicated long-chain trans-prenyltransferase elongates farnesyl or
          geranylgeranyl diphosphate with isopentenyl diphosphate to the
          species-specific tail length (C30 in budding yeast, C40 in
          Escherichia coli, C50 in fission yeast and humans), which sets the
          isoprenoid length of the ubiquinone made. The C5-C20 prenyl
          diphosphate trunk (IPP isomerase, FPP and GGPP synthases) is
          upstream shared isoprenoid metabolism
          (MODULE:isoprenoid_diphosphate_biosynthesis). The part is optional
          because the tail synthase is often also modeled with general
          isoprenoid metabolism.
        variant_sets:
          - id: tail_synthase_architecture_variants
            label: Long-chain polyprenyl diphosphate synthase architectures
            axis: enzyme architecture and product chain length
            selection: EXACTLY_ONE
            variants:
              - id: homomeric_hexaprenyl_synthase_variant
                label: Homomeric hexaprenyl diphosphate synthase (Coq1-type)
                module_type: REACTION
                annotons:
                  - id: coq1_hexaprenyl_diphosphate_synthase_activity
                    label: "Coq1: hexaprenyl diphosphate synthase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: long-chain trans-polyprenyl diphosphate synthase family
                        term:
                          id: PANTHER:PTHR12001
                          label: GERANYLGERANYL PYROPHOSPHATE SYNTHASE
                        representative_members:
                          - preferred_term: COQ1 (Saccharomyces cerevisiae)
                            term:
                              id: UniProtKB:P18900
                              label: Hexaprenyl pyrophosphate synthase, mitochondrial
                            description: >-
                              S. cerevisiae COQ1/YBR003W, required for
                              hexaprenyl pyrophosphate synthetase activity and
                              CoQ6 synthesis (PMID:2198286).
                    function:
                      preferred_term: hexaprenyl-diphosphate synthase activity
                      term:
                        id: GO:0036423
                        label: hexaprenyl-diphosphate synthase ((2E,6E)-farnesyl-diphosphate specific) activity
                      substrates:
                        - preferred_term: (2E,6E)-farnesyl diphosphate
                        - preferred_term: isopentenyl diphosphate (three molecules)
                      products:
                        - preferred_term: all-trans-hexaprenyl diphosphate
                        - preferred_term: diphosphate
                      evidence:
                        - source_id: PMID:2198286
                          statement: >-
                            The strain deficient in hexaprenyl pyrophosphate
                            synthetase activity is complemented by the gene
                            later named COQ1.
                    locations:
                      - preferred_term: mitochondrion
                        term:
                          id: GO:0005739
                          label: mitochondrion
                    gocam_associations:
                      - model: gomodel:YeastPathways_HEXPPSYN-PWY-2
                        activity: gomodel:RXN3O-9805
                        title: 'hexaprenyl diphosphate biosynthesis - imported from: Saccharomyces Genome Database'
                        description: >-
                          COQ1 typed GO:0000010 heptaprenyl diphosphate
                          synthase activity (mitochondrion) for a hexaprenyl
                          product.
                      - model: gomodel:YeastPathways_PWY3O-862
                        activity: gomodel:RXN3O-9805
                        title: 'superpathway of ubiquinone biosynthesis - imported from: Saccharomyces Genome Database'
                        description: COQ1 typed only with the root term GO:0003674.
                    role_description: >-
                      Sets the six-isoprene tail of CoQ6. YeastCyc draws the
                      substrate as geranylfarnesyl diphosphate (from an
                      unassigned RXN-8813 step); the GO term used here names the
                      farnesyl diphosphate primer.
              - id: homomeric_octaprenyl_synthase_variant
                label: Homomeric octaprenyl diphosphate synthase (IspB-type)
                module_type: REACTION
                annotons:
                  - id: ispb_octaprenyl_diphosphate_synthase_activity
                    label: "IspB: octaprenyl diphosphate synthase"
                    participant:
                      selector_type: FAMILY
                      family:
                        preferred_term: long-chain trans-polyprenyl diphosphate synthase family
                        term:
                          id: PANTHER:PTHR12001
                          label: GERANYLGERANYL PYROPHOSPHATE SYNTHASE
                        representative_members:
                          - preferred_term: ispB (Escherichia coli K-12)
                            term:
                              id: UniProtKB:P0AD57
                              label: Octaprenyl diphosphate synthase
                          - preferred_term: ispB (Pseudomonas putida KT2440)
                            term:
                              id: UniProtKB:Q88Q11
                              label: Octaprenyl diphosphate synthase
                            description: Pseudomonas putida KT2440 ispB/PP_0687.
                    function:
                      preferred_term: all-trans-octaprenyl-diphosphate synthase activity
                      term:
                        id: GO:0106350
                        label: all-trans-octaprenyl-diphosphate synthase activity
                      substrates:
                        - preferred_term: (2E,6E)-farnesyl diphosphate
                        - preferred_term: isopentenyl diphosphate (five molecules)
                      products:
                        - preferred_term: all-trans-octaprenyl diphosphate
                        - preferred_term: diphosphate
                      evidence:
                        - source_id: EC:2.5.1.90
                          statement: All-trans-octaprenyl-diphosphate synthase.
                    role_description: Homodimeric bacterial tail synthase for Q8.
              - id: heterotetrameric_decaprenyl_synthase_variant
                label: Heterotetrameric decaprenyl diphosphate synthase (Dps1/Dlp1, PDSS1/PDSS2)
                module_type: PROTEIN_COMPLEX
                notes: >-
                  Fission yeast and mammals make the C50 tail with a
                  heterotetramer of two related subunits; both are required
                  for activity (PMID:14519123).
                annotons:
                  - id: decaprenyl_diphosphate_synthase_activity
                    label: Dps1/Dlp1-type decaprenyl diphosphate synthase
                    participant:
                      selector_type: PROTEIN_COMPLEX
                      protein_complex:
                        preferred_term: decaprenyl diphosphate synthase heterotetramer
                        active_units:
                          - id: dps1_pdss1_subunit
                            label: Dps1/PDSS1 subunit
                            role: Catalytic prenyltransferase subunit.
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: Dps1/PDSS1 subunit
                                term:
                                  id: PANTHER:PTHR12001
                                  label: GERANYLGERANYL PYROPHOSPHATE SYNTHASE
                                representative_members:
                                  - preferred_term: dps1 (Schizosaccharomyces pombe)
                                    term:
                                      id: UniProtKB:O43091
                                      label: Decaprenyl-diphosphate synthase subunit 1
                                    description: S. pombe dps1/SPBPJ4664.01.
                                  - preferred_term: PDSS1 (Homo sapiens)
                                    term:
                                      id: UniProtKB:Q5T2R2
                                      label: All trans-polyprenyl-diphosphate synthase PDSS1
                          - id: dlp1_pdss2_subunit
                            label: Dlp1/PDSS2 subunit
                            role: Partner subunit required for activity and chain-length control.
                            participant:
                              selector_type: FAMILY
                              family:
                                preferred_term: Dlp1/PDSS2 subunit
                                term:
                                  id: PANTHER:PTHR12001
                                  label: GERANYLGERANYL PYROPHOSPHATE SYNTHASE
                                representative_members:
                                  - preferred_term: dlp1 (Schizosaccharomyces pombe)
                                    term:
                                      id: UniProtKB:O13851
                                      label: Decaprenyl-diphosphate synthase subunit 2
                                    description: S. pombe dlp1/SPAC19G12.12.
                                  - preferred_term: PDSS2 (Homo sapiens)
                                    term:
                                      id: UniProtKB:Q86YH6
                                      label: All trans-polyprenyl-diphosphate synthase PDSS2
                    function:
                      preferred_term: all-trans-decaprenyl-diphosphate synthase activity
                      term:
                        id: GO:0097269
                        label: all-trans-decaprenyl-diphosphate synthase activity
                      substrates:
                        - preferred_term: (2E,6E)-farnesyl diphosphate
                        - preferred_term: isopentenyl diphosphate (seven molecules)
                      products:
                        - preferred_term: all-trans-decaprenyl diphosphate
                        - preferred_term: diphosphate
                      evidence:
                        - source_id: PMID:14519123
                          statement: >-
                            decaprenyl diphosphate synthase from
                            Schizosaccharomyces pombe is comprised of a novel
                            protein named Dlp1 acting in partnership with Dps1
                    gocam_associations:
                      - model: gomodel:662af8fa00000408
                        activity: gomodel:662af8fa00000408/662af8fa00001337
                        title: ubiquinone metabolic process (GO:0006743)
                        description: S. pombe dps1 enables GO:0097269; causally upstream of ppt1.
                      - model: gomodel:662af8fa00000408
                        activity: gomodel:662af8fa00000408/662af8fa00001361
                        title: ubiquinone metabolic process (GO:0006743)
                        description: S. pombe dlp1 enables GO:0097269; causally upstream of ppt1.
                    role_description: Heteromeric C50 tail synthase.
    - order: 1
      role: aromatic head-group supply
      node:
        id: hydroxybenzoate_head_group_synthesis
        label: 4-Hydroxybenzoate head-group supply
        module_type: METABOLIC_PATHWAY
        description: >-
          Bacteria form 4-hydroxybenzoate from chorismate with UbiC, whereas
          eukaryotes derive it from tyrosine (fungi) or by other routes that
          are only partly resolved. Organisms that import 4-hydroxybenzoate
          can bypass this part.
        variant_sets:
          - id: hydroxybenzoate_supply_routes
            label: 4-Hydroxybenzoate supply routes
            axis: lineage-specific precursor route
            selection: ONE_OR_MORE
            variants:
              - id: chorismate_lyase_route
                label: Chorismate lyase (UbiC) route (bacteria)
                module_type: REACTION
                annotons:
                  - id: chorismate_lyase_activity
                    label: "UbiC: chorismate lyase"
                    participant:
                      selector_type: FAMILY
