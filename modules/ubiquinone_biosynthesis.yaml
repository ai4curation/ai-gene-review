              - id: eukaryotic_coq_ring_route
                label: Mitochondrial COQ-complex ring modification (eukaryotes)
                module_type: METABOLIC_PATHWAY
                description: >-
                  In fungi and animals the ring of 4-hydroxy-3-polyprenylbenzoate
                  is modified on the matrix face of the inner membrane by
                  enzymes of the CoQ synthome (complex Q) in an order that
                  differs from bacteria: Coq6 C5-hydroxylation, Coq3 first
