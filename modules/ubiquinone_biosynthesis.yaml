                  also installs the C1 hydroxyl), Coq5 C-methylation, Coq7
                  C6-hydroxylation and a second Coq3 O-methylation that yields
                  ubiquinol. The bacterial UbiD/UbiX decarboxylase system is
                  not used (PMID:38295803).
